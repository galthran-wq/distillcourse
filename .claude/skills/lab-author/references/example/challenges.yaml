checkpoints:
  zscore:
    kind: exact
    seed: 1337
    atol: 1.0e-9
    inputs_code: |
      inputs = (rng.normal(2.0, 3.0, size=40),)
    wrong:
      - hint: "Did you subtract the mean before dividing by the std?"
        code: |
          def f(x):
              import numpy as np
              return x / x.std()
  pairwise:
    kind: exact
    seed: 42
    atol: 1.0e-9
    inputs_code: |
      inputs = (rng.normal(size=(20, 3)),)
  separate:
    kind: metric
    metric: roc_auc
    threshold: 0.85
    labels_code: |
      rng = np.random.default_rng(7)
      rng.normal(size=(200, 3))          # keep the stream aligned with the solution
      labels = rng.integers(0, 2, 200)
  why-standardize:
    kind: review
    rubric: |
      Pass if the answer connects feature scale to distance domination or to
      comparable feature contributions. Fail only if it is clearly off-task.

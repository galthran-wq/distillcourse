name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          # The suite's database, created here directly: there is no compose
          # init hook in CI. scripts/test.sh derives the same _test name.
          POSTGRES_DB: distillcourse_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: ./scripts/lint.sh
      # The suite runs on a database built by the migrations and torn down by
      # them, so this also proves upgrade and downgrade both work.
      - run: ./scripts/test.sh

  lab-client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/lab-client
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # .python-version pins the floor rather than the newest interpreter: the
      # package has to install and run on Colab's, so that is what is tested.
      - run: uv sync --frozen
      - run: ./scripts/lint.sh
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      # Labs are executed, not parsed: the suite and validate both run each
      # lab's reference solution in the environment its uv.lock pins.
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: npm ci
        working-directory: apps/frontend
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run validate

  # The public mirror (github.com/galthran-wq/distillcourse-labs) is a build
  # artifact: labs-dist's public half plus a copy of the client, committed with
  # no history and force-pushed over a deploy key that can write to the mirror
  # alone — the monorepo token never touches the mirror and vice versa.
  mirror:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [frontend, lab-client]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      # build-labs re-executes each lab's reference solution: the notebooks
      # published here must be the ones the answer keys were generated from.
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: npm ci
        working-directory: apps/frontend
      - run: npm run build-labs
      - run: ./ops/mirror/assemble.sh mirror-tree
      - name: Force-push the mirror
        env:
          DEPLOY_KEY: ${{ secrets.LABS_MIRROR_DEPLOY_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/mirror
          chmod 600 ~/.ssh/mirror
          cd mirror-tree
          git init -q -b main
          git config user.name "distillcourse CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "mirror of $GITHUB_SHA"
          GIT_SSH_COMMAND="ssh -i ~/.ssh/mirror -o StrictHostKeyChecking=accept-new" \
            git push -q --force git@github.com:galthran-wq/distillcourse-labs.git main

[project]
name = "distillcourse-backend"
version = "0.1.0"
description = "distillcourse API: users, telemetry, and the tutor harness."
requires-python = ">=3.14,<4.0"
dependencies = [
    "fastapi[standard]>=0.141.1,<1.0.0",
    "pydantic>2.0",
    "pydantic-settings<3.0.0,>=2.2.1",
    "sqlalchemy[asyncio]>=2.0.36,<3.0.0",
    "psycopg[binary]>=3.3.4,<4.0.0",
    "alembic<2.0.0,>=1.12.1",
    "tenacity<10.0.0,>=8.2.3",
    "pwdlib[argon2,bcrypt]>=0.3.0",
    "logfire[fastapi,sqlalchemy,httpx]>=4.14.1,<5.0.0",
    "emails>=1.1.2,<2.0",
    "jinja2<4.0.0,>=3.1.4",
    # zoneinfo validates the timezone the browser reports; slim images carry no
    # system tz database, so the data ships with the application.
    "tzdata>=2026.3",
]

[dependency-groups]
dev = [
    "pytest<10.0.0,>=7.4.3",
    "pytest-asyncio>=1.3.0,<2.0.0",
    "mypy<3.0.0,>=1.8.0",
    "ruff<1.0.0,>=0.2.2",
    "coverage<8.0.0,>=7.4.3",
]

# Nothing imports this project as a distribution: `app` is imported from the
# working directory, so there is no wheel to build and no build backend.
[tool.uv]
package = false

[tool.mypy]
strict = true

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG001", # unused arguments in functions
    "T201",   # print statements are not allowed
]
ignore = [
    "E501",  # line too long, handled by the formatter
    "B008",  # do not perform function calls in argument defaults
    "B904",  # allow raising exceptions without from e, for HTTPException
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
show_missing = true
sort = "-Cover"

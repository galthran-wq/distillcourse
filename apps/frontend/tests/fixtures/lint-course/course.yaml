schema_version: 1
slug: lint-course
title: Lint fixture course
tagline: Minimal course that passes every lint rule
status: in_progress
audience: Test fixture.
tone: Terse.
intro: Fixture course intro.
sources:
  - Fixture source, 2026
outcomes:
  - id: co-surprisal
    text: Compute the surprisal of simple events
    bloom: apply

modules:
  - slug: basics
    title: "Basics"
    outcomes: [co-surprisal]
    lessons:
      - slug: intro-surprise
        title: "Measuring surprise"
        type: core
        status: drafted
        key_image: figures/rarity.svg
        goal: "Compute the surprisal of an event from its probability"
        opening: "Rare events carry more information than common ones."
        est_minutes: 7
        prerequisites: []
        concepts:
          introduces: [surprisal]
          reinforces: []
        key_ideas:
          - Rare events carry more information
          - Logarithms make surprises add up
        demo: null

      - slug: next-steps
        title: "Where surprisal leads"
        type: core
        status: planned
        goal: "Explain how surprisal extends to whole distributions"
        opening: "Entropy extends surprisal from single events to whole distributions."
        est_minutes: 8
        prerequisites: [intro-surprise]
        concepts:
          introduces: []
          reinforces: [surprisal]
        key_ideas:
          - Averaging surprisal gives entropy
          - Certainty means zero surprise
        demo: null

      - slug: surprisal-lab
        title: "Lab: surprisal from scratch"
        type: lab
        status: drafted
        key_image: figures/lab.svg
        goal: "Implement surprisal and entropy from their definitions"
        opening: "A formula you can implement is a formula you understand."
        est_minutes: 10
        prerequisites: [intro-surprise]
        concepts:
          introduces: []
          reinforces: [surprisal]
        key_ideas:
          - Implementing a definition is how you learn it
          - Checkpoints check outputs, not style
        demo: null
        lab:
          est_hours: 3
          checkpoints:
            - id: surprisal
              kind: exact
              text: "Implement surprisal(p) in bits"
            - id: entropy-terms
              kind: exact
              text: "Return the per-outcome terms of the entropy sum"
              required: false
            - id: beat-baseline
              kind: metric
              text: "Rank the held-out sources: beat ROC-AUC 0.85"
              required: false
            - id: why-uniform
              kind: review
              text: "Argue why entropy is largest for the uniform distribution"
              required: false

checkpoints:
  surprisal:
    kind: exact
    seed: 1337
    atol: 1.0e-6
    inputs_code: |
      p = rng.random(16) * 0.9 + 0.1
      inputs = (p,)
    wrong:
      - hint: "Natural log instead of log base 2."
        code: |
          def f(p):
              import numpy as np
              return -np.log(p)
  entropy-terms:
    kind: exact
    seed: 99
    atol: 1.0e-6
    inputs_code: |
      x = rng.random((20, 5))
      inputs = (x / x.sum(axis=1, keepdims=True),)
    wrong:
      - hint: "The terms are p log2(1/p), not log2(1/p) alone."
        code: |
          def f(p):
              import numpy as np
              return -np.log2(p)
  beat-baseline:
    kind: metric
    metric: roc_auc
    threshold: 0.85
    holdout: data/holdout.csv
    labels_code: |
      rng = np.random.default_rng(11)
      x = rng.random((40, 4))
      p = x / x.sum(axis=1, keepdims=True)
      h = -(p * np.log2(p)).sum(axis=1)
      labels = (h < np.median(h)).astype(float)
      flip = rng.random(40) < 0.1
      labels = np.where(flip, 1 - labels, labels)
  why-uniform:
    kind: review
    rubric: |
      Pass if the answer names the uniform distribution as the maximum and
      gives a reason (no outcome is cheaper to describe than any other).

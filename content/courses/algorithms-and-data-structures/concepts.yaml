concepts:
  - id: asymptotic-notation
    name: Asymptotic notation
    definition: "O, Omega, and Theta notation for classifying an algorithm's running time by growth rate, ignoring constant factors and lower-order terms"
    introduced_in: asymptotic-notation

  - id: loop-invariant
    name: Loop invariant
    definition: "A claim that holds before every iteration of a loop; proved by initialization, maintenance, and termination, it establishes an iterative algorithm's correctness"
    introduced_in: loop-invariants-and-correctness

  - id: recurrence
    name: Recurrence
    definition: "An equation, such as T(n) = 2T(n/2) + O(n), expressing a recursive algorithm's running time in terms of itself on smaller inputs"
    introduced_in: recurrences-and-master-theorem

  - id: master-theorem
    name: Master theorem
    definition: "A closed-form solution for recurrences of the form T(n) = aT(n/b) + f(n), by comparing f(n) against n^(log_b a)"
    introduced_in: recurrences-and-master-theorem

  - id: array
    name: Array
    definition: "A fixed-size contiguous block of memory giving O(1) access to any element by index"
    introduced_in: arrays-and-linked-lists

  - id: linked-list
    name: Linked list
    definition: "A sequence of nodes, each holding a value and a pointer to the next, giving O(1) insertion/deletion at a known position and O(n) access by index"
    introduced_in: arrays-and-linked-lists

  - id: stack
    name: Stack
    definition: "A last-in-first-out (LIFO) abstract data type supporting push, pop, and peek"
    introduced_in: stacks-and-queues

  - id: queue
    name: Queue
    definition: "A first-in-first-out (FIFO) abstract data type supporting enqueue, dequeue, and peek"
    introduced_in: stacks-and-queues

  - id: amortized-analysis
    name: Amortized analysis
    definition: "Bounding the average cost per operation over any sequence of operations, even when individual operations vary widely in cost"
    introduced_in: dynamic-arrays-and-amortized-analysis

  - id: dynamic-array
    name: Dynamic array
    definition: "An array that grows by allocating a larger block and copying elements when it overflows, typically by doubling capacity"
    introduced_in: dynamic-arrays-and-amortized-analysis

  - id: hash-table
    name: Hash table
    definition: "A structure mapping keys to array indices via a hash function, giving expected O(1) search, insert, and delete"
    introduced_in: hash-tables

  - id: binary-search-tree
    name: Binary search tree
    definition: "A binary tree where every left-subtree key is smaller and every right-subtree key is larger than its root, giving O(h) search/insert/delete for height h"
    introduced_in: binary-search-trees

  - id: balanced-bst
    name: Balanced binary search tree
    definition: "A binary search tree that restores a height invariant after every update using local rotations, guaranteeing O(log n) height"
    introduced_in: balanced-search-trees

  - id: heap
    name: Binary heap
    definition: "A complete binary tree, stored in an array, satisfying the heap property (a parent no larger than its children in a min-heap)"
    introduced_in: binary-heaps-and-priority-queues

  - id: priority-queue
    name: Priority queue
    definition: "An abstract data type supporting insert and extract-minimum (or maximum), commonly implemented with a binary heap"
    introduced_in: binary-heaps-and-priority-queues

  - id: union-find
    name: Union-find (disjoint-set forest)
    definition: "A data structure tracking a partition of elements into disjoint groups, supporting union and find in near-constant amortized time with union-by-rank and path compression"
    introduced_in: union-find

  - id: divide-and-conquer
    name: Divide-and-conquer
    definition: "A design paradigm: split a problem into smaller instances of itself, solve them recursively, and combine the results"
    introduced_in: comparison-sorting-merge-and-quicksort

  - id: comparison-sort
    name: Comparison sort
    definition: "A sorting algorithm that orders elements using only pairwise comparisons between them"
    introduced_in: comparison-sorting-merge-and-quicksort

  - id: comparison-sort-lower-bound
    name: Comparison-sort lower bound
    definition: "The proof, via a decision-tree argument, that any comparison-based sort needs Omega(n log n) comparisons in the worst case"
    introduced_in: heapsort-and-the-sorting-lower-bound

  - id: counting-sort
    name: Counting sort
    definition: "A non-comparison sort that tallies value occurrences and places elements via prefix sums, running in O(n+k) for values in [0,k)"
    introduced_in: linear-time-sorting

  - id: radix-sort
    name: Radix sort
    definition: "A non-comparison sort that applies stable counting sort once per digit, least significant first"
    introduced_in: linear-time-sorting

  - id: binary-search
    name: Binary search
    definition: "A search technique that halves the candidate range each step using a loop invariant, running in O(log n) on sorted data or any monotonic predicate"
    introduced_in: binary-search-and-order-statistics

  - id: order-statistics
    name: Order statistics
    definition: "The problem of finding the k-th smallest (or largest) element of a collection without fully sorting it"
    introduced_in: binary-search-and-order-statistics

  - id: greedy-algorithm
    name: Greedy algorithm
    definition: "An algorithm that builds a solution by repeatedly making the locally best choice, without reconsidering it"
    introduced_in: greedy-algorithms

  - id: exchange-argument
    name: Exchange argument
    definition: "A proof technique showing a greedy choice is optimal by transforming any optimal solution to match it without making it worse"
    introduced_in: greedy-algorithms

  - id: dynamic-programming
    name: Dynamic programming
    definition: "A design paradigm that solves each distinct subproblem exactly once, caching or tabulating the result, applicable when a problem has optimal substructure"
    introduced_in: dynamic-programming-i-one-dimensional

  - id: overlapping-subproblems
    name: Overlapping subproblems
    definition: "The property that a recursive problem's subproblems recur, so naive recursion recomputes the same answer many times — the signature that makes memoization pay off"
    introduced_in: dynamic-programming-i-one-dimensional

  - id: graph
    name: Graph
    definition: "A set of nodes and a set of edges between them, directed or undirected, weighted or unweighted"
    introduced_in: graph-representations

  - id: adjacency-list
    name: Adjacency list / adjacency matrix
    definition: "The two standard graph representations: a per-node list of neighbors (O(V+E) space), or a V x V table of edges (O(V^2) space, O(1) edge test)"
    introduced_in: graph-representations

  - id: bfs
    name: Breadth-first search
    definition: "A graph traversal that visits nodes in order of increasing distance from a source using a FIFO queue, computing unweighted shortest paths in O(V+E)"
    introduced_in: breadth-first-search

  - id: dfs
    name: Depth-first search
    definition: "A graph traversal that explores as far as possible along each branch before backtracking, classifying edges as tree, back, forward, or cross"
    introduced_in: depth-first-search-and-topological-sort

  - id: topological-sort
    name: Topological sort
    definition: "An ordering of a DAG's nodes consistent with every edge's direction, obtained as the reverse of DFS finish order"
    introduced_in: depth-first-search-and-topological-sort

  - id: strongly-connected-component
    name: Strongly connected component
    definition: "A maximal group of nodes in a directed graph that can each reach every other, found via two depth-first searches (Kosaraju's algorithm)"
    introduced_in: strongly-connected-components

  - id: dijkstras-algorithm
    name: Dijkstra's algorithm
    definition: "A single-source shortest-path algorithm for nonnegative edge weights, greedily finalizing the closest unfinalized node via a priority queue"
    introduced_in: shortest-paths-dijkstra

  - id: bellman-ford
    name: Bellman-Ford algorithm
    definition: "A single-source shortest-path algorithm tolerating negative edge weights, relaxing every edge V-1 times and detecting negative-weight cycles on a V-th round"
    introduced_in: shortest-paths-bellman-ford

  - id: minimum-spanning-tree
    name: Minimum spanning tree
    definition: "A tree connecting every node of a weighted undirected graph using the least possible total edge weight"
    introduced_in: minimum-spanning-trees

  - id: cut-property
    name: Cut property
    definition: "For any partition of a graph's nodes into two nonempty sets, the lightest edge crossing the cut belongs to some minimum spanning tree"
    introduced_in: minimum-spanning-trees

  - id: reduction
    name: Reduction
    definition: "An efficient transformation of one problem's input into another's, letting a solver for the second problem solve the first"
    introduced_in: reductions-between-problems

  - id: np-completeness
    name: NP-completeness
    definition: "The property of a problem in NP to which every other problem in NP reduces in polynomial time, making it a hardest problem in the class"
    introduced_in: p-np-and-np-completeness

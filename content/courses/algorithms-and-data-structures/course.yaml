schema_version: 1
slug: algorithms-and-data-structures
title: Algorithms and Data Structures
tagline: The core data structures and algorithm design techniques every engineer should own — running-time analysis, sorting and search structures, graphs, and the greedy/divide-and-conquer/dynamic-programming toolkit
status: in_progress
audience: >
  Engineers comfortable with reading pseudocode in any language and with
  basic mathematical proof (induction, reading sums and inequalities); no
  prior algorithms coursework assumed. Expects precise statements, worked
  examples computed in full, and minimal ceremony.
tone: >
  Dry, precise, engineering register. Declarative statements of fact; worked
  examples carried through completely, no skipped steps. No rhetorical
  questions, no teasers. Second person only in instructions.
intro: >
  A hash table answers a lookup in the time it takes to compute one hash, no
  matter how many keys it holds; a linked list answers the same lookup by
  walking, on average, half its length. Both structures store identical
  data. The gap between milliseconds and minutes at scale is rarely the
  hardware or the language — it is which of a small, fixed set of data
  structures and algorithms was chosen, and whether the choice was backed by
  an argument or a guess.


  This course is that argument, made precise. It starts by giving running
  time a notation that survives changes of machine and language —
  asymptotic notation — and a technique for showing an algorithm computes
  what it claims to — the loop invariant. Everything after builds on those
  two tools: the handful of data structures (arrays, linked lists, hash
  tables, balanced search trees, heaps, disjoint sets) that back nearly
  every higher-level library call; the classical techniques for putting
  data in order and finding it fast; and the three design paradigms —
  divide-and-conquer, greedy choice, dynamic programming — that turn an
  unfamiliar problem into one of the ones already solved. Graphs get
  extended treatment because so much of computing is graphs in disguise: a
  dependency list, a road network, a call graph are all adjacency
  structures, and breadth-first search, depth-first search, Dijkstra's
  algorithm, and minimum spanning trees are four moves that answer almost
  every question asked of one.


  The course closes by showing where this toolkit runs out. Problems such
  as the traveling salesman or boolean satisfiability have resisted every
  attempt at a fast algorithm for over fifty years, and reductions plus the
  Cook-Levin theorem explain why: a fast algorithm for any one of them would
  give a fast algorithm for all of them. That is a genuine boundary, not a
  gap to be smoothed over, and recognizing which side of it a new problem
  falls on is itself a skill this course builds.


  Scope: this is the first of two natural courses on the subject and covers
  the load-bearing undergraduate core — the material used daily regardless
  of specialty — stopping at the boundary of NP-completeness with a
  practitioner's map of what comes next. Amortized analysis stays at the
  aggregate-method level. The accounting and potential methods, splay trees
  and Fibonacci heaps, van Emde Boas and succinct structures, network flow
  and matching, linear programming and duality, randomized and
  approximation algorithms, string algorithms, computational geometry, and
  parallel/external-memory models are reserved for the advanced sequence
  (see `research/course-2-proposal.md` in this course's directory).
prerequisites:
  - text: Comfortable reading and writing pseudocode in any programming language
  - text: "Basic proof technique: induction, and reading mathematical notation (sums, inequalities, logarithms)"
key_results:
  - text: "T(n) = 2T(n/2) + O(n) solves to O(n log n) by the Master theorem — the running time shared by merge sort and every balanced divide-and-conquer algorithm"
    lesson: recurrences-and-master-theorem
  - text: A dynamic array's amortized cost per append is O(1) even though individual appends occasionally cost O(n), because doubling geometrically spaces out the expensive resizes
    lesson: dynamic-arrays-and-amortized-analysis
  - text: Under simple uniform hashing, expected search, insert, and delete cost O(1) regardless of how many keys the table holds
    lesson: hash-tables
  - text: A height-balanced search tree guarantees O(log n) search, insert, and delete, where an unbalanced tree degrades to O(n)
    lesson: balanced-search-trees
  - text: Union-find with union-by-rank and path compression runs m operations on n elements in O(m alpha(n)) time — alpha the inverse Ackermann function, effectively constant
    lesson: union-find
  - text: "No comparison-based sorting algorithm can guarantee fewer than Omega(n log n) comparisons in the worst case — proved by counting the leaves a decision tree needs"
    lesson: heapsort-and-the-sorting-lower-bound
  - text: Counting sort and radix sort run in O(n + k) time by never comparing two elements, sidestepping the comparison-sort lower bound entirely
    lesson: linear-time-sorting
  - text: A greedy choice is correct exactly when an exchange argument shows every optimal solution can be rearranged to make that choice without getting worse
    lesson: greedy-algorithms
  - text: A dynamic-programming recurrence is correct exactly when the problem has optimal substructure and the subproblems overlap enough to be worth memoizing
    lesson: dynamic-programming-i-one-dimensional
  - text: Dijkstra's algorithm finds correct shortest paths from a single source in O((V + E) log V) with a binary heap, but only when every edge weight is nonnegative
    lesson: shortest-paths-dijkstra
  - text: Bellman-Ford finds shortest paths in O(VE) time with negative edge weights allowed, and detects a negative-weight cycle when one exists
    lesson: shortest-paths-bellman-ford
  - text: "The cut property certifies every edge a minimum spanning tree needs: the lightest edge crossing any cut belongs to some MST, which is why Kruskal's and Prim's greedy choices are correct"
    lesson: minimum-spanning-trees
  - text: The Cook-Levin theorem makes Boolean satisfiability NP-complete, and a polynomial-time reduction from it to any other problem in NP proves that problem NP-complete too
    lesson: p-np-and-np-completeness
spine:
  - label: "A cost model for algorithms"
    step: >
      Running time needs a notation that survives a change of machine or
      language, and a correctness argument needs a technique that works
      without running the code. Asymptotic notation supplies the first,
      loop invariants and recurrence solving supply the second and third.
    caption: "O(n log n) describes merge sort on any machine ever built."
    lessons: [asymptotic-notation, loop-invariants-and-correctness, recurrences-and-master-theorem]
  - label: "Building blocks: sequences and hashing"
    step: >
      Arrays, linked lists, and hash tables are the structures every later
      algorithm is built on. Choosing among them is a matter of which
      operations must be fast, and dynamic arrays show that a single
      expensive operation can still average out to cheap.
    caption: "A hash table turns a key into an array index in one computation."
    lessons: [arrays-and-linked-lists, stacks-and-queues, dynamic-arrays-and-amortized-analysis, hash-tables]
  - label: "Ordered structures: trees, heaps, and disjoint sets"
    step: >
      Keeping data sorted while it changes needs a structure that
      rebalances itself; keeping only the minimum accessible needs a
      shallower one; and tracking which elements have merged into one group
      needs neither order nor a full tree.
    caption: "A red-black tree never lets its height exceed 2 log(n+1)."
    lessons: [binary-search-trees, balanced-search-trees, binary-heaps-and-priority-queues, union-find]
  - label: "Putting data in order"
    step: >
      Sorting is the most-used subroutine in computing, which is why it
      supports several distinct algorithms with different guarantees, an
      exact lower bound on any comparison-based approach, and algorithms
      that beat that bound by refusing to compare at all.
    caption: "Counting sort touches each element twice and never compares one to another."
    lessons: [comparison-sorting-merge-and-quicksort, heapsort-and-the-sorting-lower-bound, linear-time-sorting, binary-search-and-order-statistics]
  - label: "Design paradigms: divide, choose greedily, remember"
    step: >
      Three patterns recur across almost every efficient algorithm not yet
      covered: split a problem into independent pieces, make an
      irrevocable locally-best choice, or solve every subproblem once and
      reuse the answers. Recognizing which pattern a new problem takes is
      the central design skill of the course.
    caption: "Edit distance is the same recurrence in two dimensions instead of one."
    lessons: [divide-and-conquer-design, greedy-algorithms, dynamic-programming-i-one-dimensional, dynamic-programming-ii-two-dimensional]
  - label: "Graphs as a model of relationships"
    step: >
      A dependency list, a road network, and a call graph are all the same
      object — a set of nodes and the edges between them — and traversing
      that object systematically answers reachability, cycle detection,
      and ordering questions across all three.
    caption: "Depth-first search classifies every edge it does not use as a tree edge."
    lessons: [graph-representations, breadth-first-search, depth-first-search-and-topological-sort, strongly-connected-components]
  - label: "The shortest path and the cheapest network"
    step: >
      Weighting a graph's edges turns reachability into optimization:
      finding the cheapest route between two nodes, or the cheapest network
      that connects all of them, and both problems admit greedy algorithms
      once the right exchange or cut argument is in hand.
    caption: "Prim's algorithm grows one tree; Kruskal's algorithm grows a forest that merges."
    lessons: [shortest-paths-dijkstra, shortest-paths-in-dags-and-dp, shortest-paths-bellman-ford, minimum-spanning-trees]
  - label: "Where efficient algorithms run out"
    step: >
      Every algorithm so far runs in polynomial time. Some problems have
      resisted a polynomial algorithm for over fifty years, and reductions
      show why: a fast algorithm for any one of a large family would yield
      a fast algorithm for all of them, which is what it means to call a
      problem NP-complete.
    caption: "Every problem in NP reduces to Boolean satisfiability in polynomial time."
    lessons: [reductions-between-problems, p-np-and-np-completeness, coping-with-np-hardness]
sources:
  - T. H. Cormen, C. E. Leiserson, R. L. Rivest, C. Stein, Introduction to Algorithms, 4th ed., MIT Press, 2022
  - R. Sedgewick, K. Wayne, Algorithms, 4th ed., Addison-Wesley, 2011 (companion site and Coursera courses free)
  - J. Erickson, Algorithms, 2019, free online under CC BY 4.0, https://jeffe.cs.illinois.edu/teaching/algorithms/
  - P. Morin, Open Data Structures, 2013, free online under CC BY, https://opendatastructures.org/
  - S. Dasgupta, C. H. Papadimitriou, U. V. Vazirani, Algorithms, McGraw-Hill, 2008, free author draft, https://cseweb.ucsd.edu/~dasgupta/book/index.html
  - J. Kleinberg, E. Tardos, Algorithm Design, Pearson, 2005
  - E. Demaine, J. Ku, J. Solomon, MIT 6.006 Introduction to Algorithms, Spring 2020, https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/
  - E. Demaine, S. Devadas, N. Lynch, MIT 6.046J Design and Analysis of Algorithms, Spring 2015, https://ocw.mit.edu/courses/6-046j-design-and-analysis-of-algorithms-spring-2015/
  - 'C. A. R. Hoare, "Algorithm 64: Quicksort," Communications of the ACM 4(7), 1961'
  - E. W. Dijkstra, "A Note on Two Problems in Connexion with Graphs," Numerische Mathematik 1, 269-271, 1959
  - R. E. Tarjan, "Depth-First Search and Linear Graph Algorithms," SIAM Journal on Computing 1(2), 146-160, 1972
  - R. E. Tarjan, "Efficiency of a Good But Not Linear Set Union Algorithm," Journal of the ACM 22(2), 215-225, 1975
  - L. J. Guibas, R. Sedgewick, "A Dichromatic Framework for Balanced Trees," 19th Annual Symposium on Foundations of Computer Science, 8-21, 1978
  - J. B. Kruskal, "On the Shortest Spanning Subtree of a Graph and the Traveling Salesman Problem," Proceedings of the American Mathematical Society 7(1), 48-50, 1956
  - R. C. Prim, "Shortest Connection Networks and Some Generalizations," Bell System Technical Journal 36(6), 1389-1401, 1957
  - S. A. Cook, "The Complexity of Theorem-Proving Procedures," 3rd ACM Symposium on Theory of Computing, 151-158, 1971
  - R. M. Karp, "Reducibility Among Combinatorial Problems," in Complexity of Computer Computations, 85-103, 1972
  - L. A. Levin, "Universal Sequential Search Problems," Problems of Information Transmission 9(3), 265-266, 1973
  - "M. R. Garey, D. S. Johnson, Computers and Intractability: A Guide to the Theory of NP-Completeness, W. H. Freeman, 1979"
outcomes:
  - id: co-analyze
    text: Analyze the running time of iterative and recursive algorithms using asymptotic notation, recurrence solving, and loop invariants
    bloom: analyze
  - id: co-structures
    text: Implement and select among elementary and tree-based data structures based on the running-time tradeoffs of their operations
    bloom: apply
  - id: co-sort-search
    text: Implement comparison-based and linear-time sorting algorithms and apply binary search and order-statistic variants
    bloom: apply
  - id: co-design
    text: Design algorithms with the divide-and-conquer, greedy, and dynamic-programming paradigms and justify their correctness
    bloom: create
  - id: co-graphs
    text: Implement graph traversal, shortest-path, and minimum-spanning-tree algorithms and select the correct one for a graph's structure
    bloom: apply
  - id: co-limits
    text: Evaluate whether a computational problem admits an efficient algorithm using reductions and NP-completeness, and choose a practical strategy when it does not
    bloom: evaluate

modules:
  - slug: foundations
    title: "Analyzing algorithms"
    outcomes: [co-analyze]
    lessons:
      - slug: asymptotic-notation
        title: "Asymptotic notation"
        type: core
        status: drafted
        key_image: figures/sandwich.svg
        goal: "Classify an algorithm's running time using O, Omega, and Theta notation"
        opening: "Two algorithms that solve the same problem can differ in running time by a factor that grows without bound as the input grows, and asymptotic notation is the language for stating exactly how."
        est_minutes: 26
        prerequisites: []
        concepts:
          introduces: [asymptotic-notation]
          reinforces: []
        key_ideas:
          - "O(f) is an upper bound, Omega(f) a lower bound, Theta(f) both at once — each ignores constant factors and lower-order terms"
          - "Growth rate, not a single input size, is what the notation compares: n^2 beats 100n only past n=100"
          - Worst-case, best-case, and average-case are different functions of n for the same algorithm
          - "A common ranking by growth: O(1) < O(log n) < O(n) < O(n log n) < O(n^2) < O(2^n)"
        demo:
          component: GrowthRaceChart
          spec: >
            Plot several named functions (log n, n, n log n, n^2, 2^n) racing as n
            grows on a slider, with a toggle between linear and log-scaled axes.
            Task stated first: find the n at which n^2 overtakes 100n, then find
            the n past which 2^n cannot be rendered on a linear axis at all.
            Presets: small n (n<20), crossover zoom, exponential blowup.

      - slug: loop-invariants-and-correctness
        title: "Loop invariants and correctness"
        type: core
        status: drafted
        key_image: figures/cards.svg
        goal: "Construct a loop invariant that proves an iterative algorithm's correctness"
        opening: "An algorithm that terminates and returns an answer has not thereby been shown correct; a loop invariant is a claim that holds before every iteration, holds after the loop ends, and by holding at the end proves the algorithm right."
        est_minutes: 28
        prerequisites: [asymptotic-notation]
        concepts:
          introduces: [loop-invariant]
          reinforces: []
        key_ideas:
          - "A correctness proof by loop invariant has three parts: initialization, maintenance, termination"
          - "Initialization: the invariant holds before the first iteration"
          - "Maintenance: if the invariant holds before an iteration, one iteration keeps it holding before the next"
          - "Termination: when the loop ends, the invariant plus the exit condition implies the answer is correct"
          - Binary search's invariant is that the target, if present, always lies within the current bounds
        demo: null

      - slug: recurrences-and-master-theorem
        title: "Recurrences and the Master theorem"
        type: core
        status: drafted
        key_image: figures/three-shapes.svg
        goal: "Solve recurrences that describe divide-and-conquer running time using the recursion-tree method and the Master theorem"
        opening: "A divide-and-conquer algorithm's running time satisfies a recurrence — T(n) written in terms of T applied to smaller inputs — and solving that recurrence, not tracing the recursion by hand, is how its asymptotic running time is found."
        est_minutes: 34
        prerequisites: [asymptotic-notation]
        concepts:
          introduces: [recurrence, master-theorem]
          reinforces: [asymptotic-notation]
        key_ideas:
          - "A recursion tree sums the work done at every level of recursive calls"
          - "The Master theorem gives T(n) = aT(n/b) + f(n) a closed form by comparing f(n) against n^(log_b a)"
          - "T(n) = 2T(n/2) + O(n) — merge sort's recurrence — solves to O(n log n)"
          - The three Master-theorem cases correspond to work dominated by the leaves, spread evenly, or dominated by the root
        demo:
          component: RecursionTreeExplorer
          spec: >
            Enter a, b, and f(n) for T(n) = aT(n/b) + f(n); renders the
            recursion tree level by level with per-level work totals and
            identifies which Master-theorem case applies. Task stated first:
            find values of a and b that make merge sort's recurrence, then find
            a change to f(n) that moves the answer into a different case.
            Presets: merge sort, binary search, a case-3 recurrence.

  - slug: elementary-structures
    title: "Elementary data structures"
    outcomes: [co-structures]
    lessons:
      - slug: arrays-and-linked-lists
        title: "Arrays and linked lists"
        type: core
        status: drafted
        key_image: figures/scoreboard.svg
        goal: "Compare arrays and linked lists by the cost of their core operations"
        opening: "Arrays and linked lists both store an ordered sequence of elements, and choosing between them is a matter of which operation — random access or insertion at an arbitrary position — the workload needs to be fast."
        est_minutes: 24
        prerequisites: [asymptotic-notation]
        concepts:
          introduces: [array, linked-list]
          reinforces: [asymptotic-notation]
        key_ideas:
          - "Arrays give O(1) random access because index arithmetic computes an address directly"
          - "Linked lists give O(1) insertion/deletion at a known position, at the cost of O(n) access by index"
          - Doubly linked lists trade one extra pointer per node for O(1) removal given only a node reference
          - Cache locality favors arrays even when asymptotic costs tie, because contiguous memory is read faster than pointer-chased memory
        demo: null

      - slug: stacks-and-queues
        title: "Stacks and queues"
        type: core
        status: drafted
        key_image: figures/stack-vs-queue.svg
        goal: "Implement the stack and queue abstract data types and select between them by access pattern"
        opening: "A stack and a queue expose the same three operations — insert, remove, peek — but differ in which element removal returns: the most recently inserted, or the least recently inserted."
        est_minutes: 24
        prerequisites: [arrays-and-linked-lists]
        concepts:
          introduces: [stack, queue]
          reinforces: [array, linked-list]
        key_ideas:
          - "LIFO (stack) and FIFO (queue) are access disciplines, not implementations — both can sit on an array or a linked list"
          - A circular buffer implements a queue on a fixed array without shifting elements
          - Function call frames form a stack, which is why deep unbounded recursion overflows it
          - "A queue reversed through two stacks amortizes to O(1) per operation"
        demo: null

      - slug: dynamic-arrays-and-amortized-analysis
        title: "Dynamic arrays and amortized analysis"
        type: core
        status: drafted
        key_image: figures/cost-bars.svg
        goal: "Compute the amortized cost of dynamic-array resizing using the aggregate method"
        opening: "A dynamic array supports appends past its current capacity by allocating a larger block and copying every element into it, an O(n) operation that nonetheless makes appending cost O(1) on average over any sequence of appends."
        est_minutes: 30
        prerequisites: [arrays-and-linked-lists, stacks-and-queues]
        concepts:
          introduces: [amortized-analysis, dynamic-array]
          reinforces: [array, asymptotic-notation, stack, queue]
        key_ideas:
          - "Doubling capacity on overflow, rather than growing by a fixed amount, keeps resizes geometrically rare"
          - "The aggregate method bounds total cost over n operations and divides by n to get amortized cost per operation"
          - "n appends cost at most 3n total copy-work, because the copy costs 1+2+4+...+n sum to under 2n"
          - Growing by a fixed increment instead of doubling makes the amortized cost O(n), not O(1) — the growth factor is what makes doubling work
        demo:
          component: DynamicArrayGrowth
          spec: >
            Reader clicks "append" repeatedly on a visualized array; capacity
            doubles on overflow with a visible copy animation, and a running
            chart plots per-append cost alongside the cumulative average. Task
            stated first: predict which append numbers will be expensive before
            clicking, then confirm the cumulative average per append stays
            bounded past 50 appends. Presets: start empty, start pre-sized.

      - slug: hash-tables
        title: "Hash tables"
        type: core
        status: drafted
        key_image: figures/funnel.svg
        goal: "Explain how hashing achieves expected O(1) dictionary operations and analyze the cost imposed by collisions"
        opening: "A hash table maps a key to an array index by computing a hash function, turning search, insert, and delete into expected O(1) operations at the cost of losing the sorted order an array index would otherwise carry."
        est_minutes: 34
        prerequisites: [dynamic-arrays-and-amortized-analysis]
        concepts:
          introduces: [hash-table]
          reinforces: [array, amortized-analysis]
        key_ideas:
          - "A hash function maps a large key space to a small array of buckets; collisions — two keys, one bucket — are inevitable once the key space exceeds the table size"
          - "Chaining resolves collisions with a list per bucket; open addressing resolves them by probing for another slot"
          - "Under simple uniform hashing, expected search time is Theta(1 + alpha) where alpha is the load factor n/m"
          - Resizing a hash table when the load factor crosses a threshold keeps operations amortized O(1), the same argument as dynamic arrays
          - A poor hash function collapses expected O(1) into worst-case O(n) regardless of the resolution scheme
        demo:
          component: HashCollisionExplorer
          spec: >
            Insert reader-typed keys into a small fixed-size table under a
            selectable hash function and collision policy (chaining vs. linear
            probing); shows bucket contents and probe sequences live. Task
            stated first: find three keys that all hash to the same bucket
            under the default function, then compare how many probes chaining
            vs. open addressing needs to find the third. Presets: good hash
            function, deliberately bad hash function (identity mod 4), near-full
            table.

  - slug: trees-and-heaps
    title: "Trees, heaps, and disjoint sets"
    outcomes: [co-structures]
    lessons:
      - slug: binary-search-trees
        title: "Binary search trees"
        type: core
        status: drafted
        key_image: figures/insertion-order.svg
        goal: "Implement search, insertion, and deletion on a binary search tree and analyze their cost in terms of tree height"
        opening: "A binary search tree keeps every left-subtree key smaller and every right-subtree key larger than its root, which turns search, insertion, and deletion into O(h) operations for a tree of height h."
        est_minutes: 32
        prerequisites: [arrays-and-linked-lists, hash-tables]
        concepts:
          introduces: [binary-search-tree]
          reinforces: [linked-list, asymptotic-notation, hash-table]
        key_ideas:
          - "The BST invariant — left smaller, right larger, recursively — makes an in-order traversal produce sorted output"
          - Search and insertion both walk one root-to-leaf path, comparing at each node
          - "Deletion of a node with two children replaces it with its in-order successor, which always has at most one child"
          - "Height h ranges from log2(n+1) (perfectly balanced) to n (a degenerate chain), so BST operations are only as fast as the tree is balanced"
        demo:
          component: BSTInsertDelete
          spec: >
            Reader inserts and deletes keys into a live binary search tree,
            watching the tree shape change and the current height tracked
            against log2(n+1). Task stated first: insert 1 through 8 in sorted
            order and watch the tree degrade to a chain of height 8, then
            insert the same keys in a different order and get height 3.
            Presets: sorted insertion, random insertion, delete-heavy sequence.

      - slug: balanced-search-trees
        title: "Balanced search trees"
        type: core
        status: drafted
        key_image: figures/rb-23.svg
        goal: "Explain how rotations keep a search tree balanced and why the balance invariant guarantees O(log n) operations"
        opening: "A binary search tree degrades to O(n) operations whenever insertions arrive in sorted order; a balanced search tree prevents that by restoring a height invariant after every insertion or deletion using a constant number of local rotations."
        est_minutes: 34
        prerequisites: [binary-search-trees]
        concepts:
          introduces: [balanced-bst]
          reinforces: [binary-search-tree, asymptotic-notation]
        key_ideas:
          - "A rotation restructures a local 3-node neighborhood in O(1) time without breaking the BST invariant"
          - "AVL trees bound the height difference between sibling subtrees to 1; red-black trees bound the ratio of longest to shortest root-to-leaf path to 2"
          - Both invariants force height O(log n), which is what guarantees O(log n) search, insert, and delete
          - Red-black trees do at most a constant number of rotations per insertion or deletion, which is why they are the default balanced tree in most standard libraries
        demo:
          component: RotationBalancer
          spec: >
            Insert keys into a height-tracked BST; when an insertion would push
            the AVL balance invariant past 1, a highlighted rotation fixes it
            automatically, shown before/after. Task stated first: insert 1
            through 6 in order without rotations enabled and watch height hit
            6, then re-run with rotations enabled and confirm height stays at
            3. Presets: rotations off, rotations on, worst-case insertion order.

      - slug: binary-heaps-and-priority-queues
        title: "Binary heaps and priority queues"
        type: core
        status: drafted
        key_image: figures/dual-view.svg
        goal: "Implement a binary heap and use it to build a priority queue"
        opening: "A binary heap keeps only the minimum (or maximum) element easy to find, in exchange for giving up the ability to search for an arbitrary element — a trade that makes insert and extract-min both O(log n) using an array with no pointers at all."
        est_minutes: 30
        prerequisites: [arrays-and-linked-lists, recurrences-and-master-theorem]
        concepts:
          introduces: [heap, priority-queue]
          reinforces: [array, asymptotic-notation]
        key_ideas:
          - "The heap property — a parent is no larger (min-heap) than its children — is weaker than the BST invariant and cheaper to maintain"
          - "Storing a complete binary tree in an array (children of index i at 2i+1, 2i+2) needs no pointers and keeps height Theta(log n)"
          - "Sift-up after insert and sift-down after extract-min each cost O(log n)"
          - "Build-heap on n elements runs in O(n), not O(n log n), because most nodes are near the bottom and sift only a short distance"
          - A priority queue built on a binary heap is the data structure behind Dijkstra's algorithm and heapsort
        demo:
          component: HeapSiftVisualizer
          spec: >
            Array-backed min-heap; reader inserts values and extracts the
            minimum, watching sift-up and sift-down highlight the swapped path.
            Task stated first: insert 5 values in an order that needs zero
            sift-up swaps, then find an insertion order that needs the maximum
            possible swaps for a 5-element heap. Presets: empty heap,
            build-heap from an unsorted array, extract-heavy sequence.

      - slug: union-find
        title: "Union-find (disjoint-set forests)"
        type: core
        status: drafted
        key_image: figures/percolation.svg
        goal: "Implement the union-find data structure with union by rank and path compression, and analyze its near-linear cost"
        opening: "Union-find tracks a partition of elements into disjoint groups under two operations — merge two groups, ask whether two elements are in the same group — without ever needing to enumerate a group's members."
        est_minutes: 30
        prerequisites: [dynamic-arrays-and-amortized-analysis]
        concepts:
          introduces: [union-find]
          reinforces: [amortized-analysis, array]
        key_ideas:
          - "Each element points to a parent; a group's representative is the root found by following parent pointers to a self-loop"
          - "Union by rank attaches the shorter tree under the taller one's root, bounding tree height by log n on its own"
          - "Path compression flattens every node on a find path to point directly at the root, shortening future finds"
          - "Both optimizations together give O(alpha(n)) amortized time per operation, where alpha is the inverse Ackermann function — for any n that fits in memory, alpha(n) <= 4"
        demo:
          component: UnionFindPathCompression
          spec: >
            n elements as separate nodes; reader issues union and find
            operations, watching the forest shape and path compression flatten
            chains on each find. Task stated first: build a worst-case chain of
            height 6 without rank or compression, then re-run with both
            optimizations enabled and confirm no chain exceeds height 2.
            Presets: naive union, union-by-rank only, full optimization.

  - slug: sorting-and-searching
    title: "Sorting and searching"
    outcomes: [co-sort-search]
    lessons:
      - slug: comparison-sorting-merge-and-quicksort
        title: "Merge sort and quicksort"
        type: core
        status: drafted
        key_image: figures/split-trees.svg
        goal: "Implement merge sort and quicksort and analyze their running time using the Master theorem and average-case analysis"
        opening: "Merge sort and quicksort both sort by divide-and-conquer — split, recursively sort the pieces, combine — but merge sort does the work while combining and quicksort does it while splitting, a difference that gives one a guaranteed O(n log n) and the other an O(n^2) worst case."
        est_minutes: 36
        prerequisites: [recurrences-and-master-theorem, arrays-and-linked-lists]
        concepts:
          introduces: [divide-and-conquer, comparison-sort]
          reinforces: [master-theorem, asymptotic-notation]
        key_ideas:
          - "Divide-and-conquer: split the input, solve each piece recursively, combine the solutions"
          - "Merge sort's merge step does the ordering work in O(n), giving the recurrence T(n) = 2T(n/2) + O(n) = O(n log n) unconditionally"
          - "Quicksort's partition step does the ordering work, so an unlucky pivot (already-sorted input, first-element pivot) drives the recurrence to T(n) = T(n-1) + O(n) = O(n^2)"
          - "A randomized pivot choice makes quicksort's expected running time O(n log n) regardless of input order"
          - Merge sort needs O(n) auxiliary space; quicksort sorts in place
        demo:
          component: SortRaceComparator
          spec: >
            Bar-chart array; step or auto-run merge sort and quicksort side by
            side on the same input, with comparison and swap counters. Task
            stated first: construct a 10-element input that makes quicksort
            with a first-element pivot take the most comparisons possible,
            then confirm merge sort's comparison count barely changes on the
            same input. Presets: random, sorted, reverse-sorted.

      - slug: heapsort-and-the-sorting-lower-bound
        title: "Heapsort and the comparison-sort lower bound"
        type: core
        status: drafted
        key_image: figures/decision-tree-3.svg
        goal: "Derive the Omega(n log n) lower bound on comparison-based sorting using a decision-tree argument, and implement heapsort as an in-place O(n log n) sort"
        opening: "Merge sort and quicksort both run in O(n log n) time on average, and no comparison-based sorting algorithm can do better in the worst case — a fact provable without analyzing any specific algorithm, by counting how many comparisons any decision tree needs to distinguish all n! orderings."
        est_minutes: 32
        prerequisites: [binary-heaps-and-priority-queues, comparison-sorting-merge-and-quicksort]
        concepts:
          introduces: [comparison-sort-lower-bound]
          reinforces: [heap, comparison-sort, asymptotic-notation]
        key_ideas:
          - "Any comparison sort corresponds to a binary decision tree with n! leaves, one per possible output ordering"
          - "A binary tree with n! leaves has height at least log2(n!) = Omega(n log n), so some input forces that many comparisons"
          - "Heapsort repeatedly extracts the maximum from a max-heap built in O(n), giving O(n log n) worst-case time in-place"
          - Heapsort matches the lower bound exactly but is usually slower in practice than quicksort due to worse cache locality
        demo: null

      - slug: linear-time-sorting
        title: "Counting sort and radix sort"
        type: worked-practice
        status: drafted
        key_image: figures/two-worlds.svg
        goal: "Implement counting sort and radix sort and explain how they beat the comparison-sort lower bound"
        opening: "The Omega(n log n) lower bound applies only to algorithms that sort by comparing elements; counting sort and radix sort sort in O(n + k) time by using the elements' values as array indices instead."
        est_minutes: 28
        prerequisites: [heapsort-and-the-sorting-lower-bound]
        concepts:
          introduces: [counting-sort, radix-sort]
          reinforces: [comparison-sort-lower-bound, array]
        key_ideas:
          - "Counting sort tallies occurrences of each value in a range [0,k) and uses prefix sums to place elements directly, in O(n+k)"
          - "Counting sort is stable, which is what lets radix sort chain it correctly"
          - "Radix sort sorts by digit, least significant first, running counting sort once per digit — d digits in base k gives O(d(n+k))"
          - The lower bound is not violated because these algorithms never compare two elements to each other, only to array indices
        demo: null

      - slug: binary-search-and-order-statistics
        title: "Binary search and order statistics"
        type: worked-practice
        status: drafted
        key_image: figures/bsearch-2.svg
        goal: "Apply binary search to sorted data and implement randomized quickselect to find order statistics in expected linear time"
        opening: "Finding a target in sorted data takes O(log n) comparisons by binary search, and finding the k-th smallest element without fully sorting takes expected O(n) time by quickselect, a variant of quicksort's partition that recurses into only one side."
        est_minutes: 30
        prerequisites: [loop-invariants-and-correctness, comparison-sorting-merge-and-quicksort]
        concepts:
          introduces: [binary-search, order-statistics]
          reinforces: [loop-invariant, comparison-sort]
        key_ideas:
          - "Binary search's invariant — the target, if present, lies within [lo, hi] — halves the search range each iteration, giving O(log n)"
          - "Binary search generalizes past exact-match lookup to any monotonic predicate: finding the first element for which a condition flips"
          - "Quickselect partitions like quicksort but recurses into only the side containing the k-th element, giving T(n) = T(n/2) + O(n) in expectation"
          - "Expected linear time for quickselect follows from a randomized pivot landing in the middle half with probability 1/2"
        demo:
          component: QuickselectPivotChooser
          spec: >
            Array with a target rank k; reader picks pivots manually (or lets
            the algorithm pick randomly) and watches which side is discarded
            after each partition. Task stated first: find the 4th-smallest
            element of a 12-element array using as few partitions as possible,
            then compare against a worst-case pivot sequence that needs O(n)
            partitions. Presets: random pivots, adversarial first-element
            pivots.

      - slug: median-of-medians
        title: "Worst-case linear selection (median of medians)"
        type: extra
        status: drafted
        key_image: figures/grid.svg
        goal: "Explain how the median-of-medians pivot rule makes selection run in worst-case O(n) time"
        opening: "Quickselect's expected linear time collapses to O(n^2) against an adversarial pivot sequence; choosing the pivot as the median of medians of groups of five restores a guaranteed 30-70 split and makes selection worst-case linear."
        est_minutes: 26
        prerequisites: [binary-search-and-order-statistics]
        concepts:
          introduces: []
          reinforces: [order-statistics, recurrence, comparison-sort]
        key_ideas:
          - "Split the array into groups of 5, take each group's median, recurse to find the median of those medians, use it as the pivot"
          - "The pivot is guaranteed to exceed at least 3n/10 elements and be exceeded by at least 3n/10, so each partition discards a constant fraction"
          - "The recurrence T(n) <= T(n/5) + T(7n/10) + O(n) solves to O(n) because 1/5 + 7/10 < 1"
          - "Groups of 3 fail: 1/3 + 2/3 = 1 makes the recurrence Theta(n log n), which is why 5 is the smallest group size that works"
        demo: null

  - slug: design-paradigms
    title: "Algorithm design paradigms"
    outcomes: [co-design]
    lessons:
      - slug: divide-and-conquer-design
        title: "Divide-and-conquer design"
        type: worked-practice
        status: drafted
        key_image: figures/four-vs-three.svg
        goal: "Design a divide-and-conquer algorithm for a new problem and derive its running time from the recurrence it satisfies"
        opening: "Merge sort is one instance of a general pattern — split a problem into smaller instances of itself, solve them recursively, and combine the results — and the same pattern designs algorithms for problems that look nothing like sorting."
        est_minutes: 32
        prerequisites: [recurrences-and-master-theorem, comparison-sorting-merge-and-quicksort]
        concepts:
          introduces: []
          reinforces: [divide-and-conquer, master-theorem, recurrence]
        key_ideas:
          - "Grade-school multiplication of two n-digit numbers is Theta(n^2); splitting each number in half and recursing naively gives the same recurrence as grade-school, T(n) = 4T(n/2) + O(n)"
          - "Karatsuba's trick reduces four recursive multiplications to three, changing the recurrence to T(n) = 3T(n/2) + O(n) = O(n^1.585)"
          - Finding the right way to combine subproblem results, not the split itself, is usually where a divide-and-conquer design lives or dies
          - The closest-pair-of-points problem uses the same pattern with a non-obvious O(n) combine step that prunes candidates by a strip around the dividing line
        demo: null

      - slug: greedy-algorithms
        title: "Greedy algorithms"
        type: core
        status: drafted
        key_image: figures/exchange-2.svg
        goal: "Design a greedy algorithm and justify its correctness with an exchange argument"
        opening: "A greedy algorithm builds a solution by repeatedly making the choice that looks best right now, never reconsidering it — a strategy that is wrong for most problems and provably optimal for a specific, recognizable few."
        est_minutes: 32
        prerequisites: [loop-invariants-and-correctness]
        concepts:
          introduces: [greedy-algorithm, exchange-argument]
          reinforces: [loop-invariant]
        key_ideas:
          - "Interval scheduling maximized by earliest-finish-time-first is optimal; maximized by shortest-interval-first is not, and a 3-interval counterexample shows why"
          - "An exchange argument proves optimality by showing any optimal solution can be transformed to match the greedy choice without becoming worse, one swap at a time"
          - Greedy algorithms need both optimal substructure and the greedy-choice property; dynamic programming is the fallback when only the first holds
          - "Fractional knapsack (take a divisible fraction of items in value-per-weight order) is greedy-optimal; 0/1 knapsack is not, which previews why DP is needed for the integral version"
        demo:
          component: GreedyVsOptimalCounterexample
          spec: >
            Interval-scheduling instance; reader chooses which heuristic drives
            the greedy sweep (earliest finish, shortest interval, fewest
            conflicts) and watches the count of non-overlapping intervals
            selected. Task stated first: construct a 3-interval instance on
            which shortest-interval-first selects fewer intervals than
            earliest-finish-first, then verify earliest-finish-first is never
            beaten on any instance you build. Presets: the counterexample,
            a dense conflict set, a hand-editable instance.

      - slug: dynamic-programming-i-one-dimensional
        title: "Dynamic programming I: one-dimensional recurrences"
        type: core
        status: planned
        goal: "Formulate a dynamic-programming recurrence for a sequential decision problem and implement it bottom-up"
        opening: "Dynamic programming solves a problem by solving every distinct subproblem exactly once and reusing the answer, which turns an exponential tree of recursive calls into a polynomial number of table entries whenever the subproblems overlap."
        est_minutes: 36
        prerequisites: [divide-and-conquer-design]
        concepts:
          introduces: [dynamic-programming, overlapping-subproblems]
          reinforces: [divide-and-conquer, recurrence]
        key_ideas:
          - "Naive recursive Fibonacci makes exponentially many calls because fib(n-2) is recomputed inside both fib(n-1) and the direct call — the overlapping-subproblems signature"
          - "Memoization caches each subproblem's answer the first time it is computed and returns the cached value after; bottom-up fills the table in dependency order instead of recursing"
          - "Optimal substructure — an optimal solution is built from optimal solutions to subproblems — is what makes the recurrence correct, independent of overlap"
          - "Rod cutting and coin change both reduce to a 1D table indexed by remaining length or remaining amount, each entry computed from a few earlier entries"
        demo:
          component: DPTableFill
          spec: >
            Coin-change instance (target amount, coin denominations); reader
            fills the 1D DP table cell by cell, choosing which earlier cell each
            new cell depends on, with live validation against the recurrence.
            Task stated first: find the minimum coins for a target using a
            denomination set with no coin of value 1, then identify which
            targets are unreachable. Presets: standard coins, a set requiring
            a greedy-fails example, an unreachable target.

      - slug: dynamic-programming-ii-two-dimensional
        title: "Dynamic programming II: two-dimensional recurrences"
        type: worked-practice
        status: planned
        goal: "Apply dynamic programming to two-dimensional state spaces, including edit distance and 0/1 knapsack"
        opening: "Some dynamic-programming states need two indices instead of one — how far into each of two strings, or how many items considered against how much capacity remains — and the recurrence and table both grow to two dimensions accordingly."
        est_minutes: 34
        prerequisites: [dynamic-programming-i-one-dimensional]
        concepts:
          introduces: []
          reinforces: [dynamic-programming, overlapping-subproblems]
        key_ideas:
          - "Edit distance between strings of length m and n fills an (m+1) x (n+1) table, each cell the cost of the cheapest edit sequence for a prefix pair"
          - "The edit-distance recurrence takes the minimum of three cases — insert, delete, substitute/match — each pointing to one neighboring cell"
          - "0/1 knapsack fills a table indexed by item count and remaining capacity, and unlike the fractional version, greedy value-per-weight ordering is provably not optimal"
          - Reconstructing the actual solution, not just its value, means walking backward through the table from the choice that produced each optimal cell
        demo:
          component: EditDistanceGrid
          spec: >
            Two reader-typed short strings; fills the edit-distance grid live
            and traces the backpointer path for the resulting alignment. Task
            stated first: find two 5-letter words with edit distance exactly 2,
            then find a pair where the cheapest edit path is not unique.
            Presets: near-identical strings, anagram pair, disjoint strings.

  - slug: graph-traversal
    title: "Graphs: traversal and structure"
    outcomes: [co-graphs]
    lessons:
      - slug: graph-representations
        title: "Graph representations"
        type: core
        status: planned
        goal: "Compare adjacency-list and adjacency-matrix graph representations and select the appropriate one by operation cost"
        opening: "A graph is a set of nodes and a set of edges between them, and every algorithm that operates on one first commits to a representation — adjacency list or adjacency matrix — whose costs for the two questions 'what are this node's neighbors' and 'is there an edge between these two nodes' differ by an asymptotic factor."
        est_minutes: 26
        prerequisites: [arrays-and-linked-lists, hash-tables]
        concepts:
          introduces: [graph, adjacency-list]
          reinforces: [array, linked-list, hash-table]
        key_ideas:
          - "A graph G=(V,E) may be directed or undirected, weighted or unweighted"
          - "An adjacency list stores, per node, a list of its neighbors — O(V+E) space, O(deg(v)) to list v's neighbors, O(deg(v)) to test an edge"
          - "An adjacency matrix stores a V x V boolean or weight table — O(V^2) space, O(1) to test an edge, O(V) to list neighbors"
          - "Sparse graphs (E much less than V^2), the common case, favor adjacency lists; dense graphs or frequent edge-existence queries favor matrices"
        demo: null

      - slug: breadth-first-search
        title: "Breadth-first search"
        type: core
        status: planned
        goal: "Implement breadth-first search and use it to compute shortest paths in an unweighted graph"
        opening: "Breadth-first search explores a graph one distance layer at a time from a source node, using a queue to guarantee every node is visited in order of its distance from the source, which makes it the shortest-path algorithm for unweighted graphs."
        est_minutes: 30
        prerequisites: [graph-representations]
        concepts:
          introduces: [bfs]
          reinforces: [queue, graph]
        key_ideas:
          - "BFS uses a FIFO queue: nodes are visited in the order they are discovered, which is the order of increasing distance from the source"
          - "Each node is enqueued once and dequeued once, giving O(V+E) total time with an adjacency-list representation"
          - "Recording each node's discovering edge builds a shortest-path tree, and the number of edges to the source is exactly the unweighted shortest-path distance"
          - BFS also detects whether a graph is bipartite by checking that no edge connects two nodes at the same layer
        demo:
          component: GraphTraversalStepper
          spec: >
            Small graph with a chosen source; step BFS one dequeue at a time,
            highlighting the frontier queue and each node's discovered
            distance. Task stated first: find a node whose shortest distance
            from the source is 3, then find a graph where two different
            traversal orders (tie-breaking) still agree on every distance.
            Presets: a grid graph, a graph with a bottleneck node, a
            disconnected graph.

      - slug: depth-first-search-and-topological-sort
        title: "Depth-first search and topological sort"
        type: core
        status: planned
        goal: "Implement depth-first search and use edge classification to detect cycles and compute a topological order"
        opening: "Depth-first search explores as far as possible along each branch before backtracking, and classifying every edge it encounters — tree, back, forward, or cross — turns the traversal into a tool for detecting cycles and ordering a directed acyclic graph's nodes consistently with its edges."
        est_minutes: 32
        prerequisites: [graph-representations, loop-invariants-and-correctness]
        concepts:
          introduces: [dfs, topological-sort]
          reinforces: [graph, stack]
        key_ideas:
          - "DFS recurses (or uses an explicit stack) into an unvisited neighbor before returning to try the next one, running in O(V+E)"
          - "A back edge — pointing to an ancestor still on the recursion stack — exists exactly when the graph has a cycle"
          - "Topological sort of a DAG is the reverse of DFS finish-time order: every edge u -> v finishes v before u"
          - Topological order is not unique in general, but any two valid orders agree on the relative position of every edge's endpoints
        demo:
          component: TopoSortStepper
          spec: >
            DAG of task dependencies; step DFS and watch finish times get
            assigned, then read off the topological order as reversed finish
            order. Task stated first: find a valid topological order by hand
            before running DFS, then confirm DFS's reversed finish order
            matches (or gives a different but still valid order). Presets: a
            build-dependency DAG, a graph with a cycle (detection fails
            visibly), a DAG with multiple valid orders.

      - slug: strongly-connected-components
        title: "Strongly connected components"
        type: worked-practice
        status: planned
        goal: "Compute the strongly connected components of a directed graph using two depth-first searches"
        opening: "Two nodes in a directed graph are strongly connected if each can reach the other, and Kosaraju's algorithm finds every maximal group of mutually reachable nodes using nothing more than two ordinary depth-first searches, one on the graph and one on its reverse."
        est_minutes: 28
        prerequisites: [depth-first-search-and-topological-sort]
        concepts:
          introduces: [strongly-connected-component]
          reinforces: [dfs, topological-sort]
        key_ideas:
          - "Strong connectivity is an equivalence relation on nodes, partitioning the graph into disjoint SCCs"
          - "Kosaraju's algorithm: DFS the graph to get finish order, DFS the reversed graph in decreasing finish order, each resulting tree is one SCC"
          - "Contracting each SCC to a single node always produces a DAG — the 'condensation' of the original graph"
          - The condensation DAG is what lets algorithms designed for DAGs (like topological-order DP) apply to graphs that have cycles
        demo: null

  - slug: weighted-graphs
    title: "Weighted graphs: shortest paths and spanning trees"
    outcomes: [co-graphs]
    lessons:
      - slug: shortest-paths-dijkstra
        title: "Dijkstra's algorithm"
        type: core
        status: planned
        goal: "Justify Dijkstra's algorithm's correctness for nonnegative edge weights and implement it with a binary heap"
        opening: "Dijkstra's algorithm finds shortest paths from a single source in a graph with nonnegative edge weights by repeatedly finalizing the closest unfinalized node, a greedy choice that a binary heap makes efficient and that only remains correct because no edge weight is negative."
        est_minutes: 34
        prerequisites: [breadth-first-search, binary-heaps-and-priority-queues]
        concepts:
          introduces: [dijkstras-algorithm]
          reinforces: [bfs, heap, greedy-algorithm]
        key_ideas:
          - "Dijkstra generalizes BFS from counting edges to summing weights, replacing the FIFO queue with a min-priority queue keyed on tentative distance"
          - "Relaxation: if dist[u] + weight(u,v) < dist[v], update dist[v] — the operation every shortest-path algorithm in this module is built from"
          - "The greedy choice — finalize the unfinalized node with smallest tentative distance — is correct because a negative edge could otherwise undercut an already-finalized distance"
          - "With a binary heap, Dijkstra runs in O((V+E) log V); a single negative edge can produce a wrong answer without any error"
        demo:
          component: DijkstraFrontier
          spec: >
            Weighted graph with a source; step Dijkstra one extract-min at a
            time, watching tentative distances update on relaxation and nodes
            turn "finalized". Task stated first: find the shortest path to a
            specific far node and its total weight before finishing the run,
            then add one negative edge and observe the algorithm report a wrong
            distance. Presets: all-nonnegative graph, a graph with one
            negative edge (broken case), a graph with multiple equal-weight
            shortest paths.

      - slug: shortest-paths-in-dags-and-dp
        title: "Shortest paths in DAGs and the DP connection"
        type: synthesis
        status: planned
        goal: "Explain why dynamic programming is single-source shortest paths on a DAG, and compute shortest paths in a DAG in linear time"
        opening: "Every dynamic-programming recurrence computed in topological order is a shortest-path (or longest-path) computation on the DAG of subproblem dependencies, and recognizing the correspondence turns two module's worth of separate techniques into one."
        est_minutes: 26
        prerequisites: [depth-first-search-and-topological-sort, dynamic-programming-ii-two-dimensional]
        concepts:
          introduces: []
          reinforces: [topological-sort, dynamic-programming, dijkstras-algorithm]
        key_ideas:
          - "Relaxing every edge once, in topological order, computes correct shortest paths in a DAG in O(V+E), with no need for a priority queue"
          - "A DP recurrence's dependency graph — each state pointing to the states it depends on — is exactly a DAG, and the DP table fill order is a topological order of it"
          - "Coin change's recurrence is a shortest-path computation on a DAG where nodes are remaining amounts and edges are coin subtractions"
          - The DAG shortest-path algorithm is strictly more general than a hand-written DP recurrence — it needs no problem-specific insight to derive, only the dependency graph
        demo: null

      - slug: shortest-paths-bellman-ford
        title: "Bellman-Ford and negative weights"
        type: core
        status: planned
        goal: "Implement Bellman-Ford and explain how it handles negative edge weights and detects negative-weight cycles"
        opening: "Bellman-Ford finds correct shortest paths even when some edges have negative weight, something Dijkstra cannot do, by relaxing every edge V-1 times instead of finalizing nodes greedily — and a graph with a negative-weight cycle has no well-defined shortest path at all, which Bellman-Ford also detects."
        est_minutes: 30
        prerequisites: [shortest-paths-dijkstra]
        concepts:
          introduces: [bellman-ford]
          reinforces: [dijkstras-algorithm]
        key_ideas:
          - "Any shortest path with no repeated node uses at most V-1 edges, so V-1 full rounds of relaxing every edge suffices to converge"
          - "Bellman-Ford runs in O(VE), slower than Dijkstra's O((V+E) log V), in exchange for tolerating negative weights"
          - "A negative-weight cycle makes 'shortest path' undefined — walking the cycle repeatedly decreases the path weight without bound"
          - "A V-th relaxation round that still finds an improvement proves a negative-weight cycle exists, reachable from the source"
        demo:
          component: BellmanFordRelax
          spec: >
            Weighted graph including at least one negative edge; step
            Bellman-Ford round by round, highlighting which distances improve
            each round. Task stated first: predict how many rounds are needed
            before distances stop changing, then load a graph with a negative
            cycle and identify the round on which the detection check fires.
            Presets: negative edge no cycle, negative cycle, all-nonnegative
            (matches Dijkstra).

      - slug: minimum-spanning-trees
        title: "Minimum spanning trees"
        type: synthesis
        status: planned
        goal: "Implement Kruskal's and Prim's algorithms and justify their correctness using the cut property"
        opening: "A minimum spanning tree connects every node of a weighted undirected graph using the least total edge weight, and both standard algorithms for finding one — Kruskal's, which grows a forest, and Prim's, which grows a single tree — are greedy, and both are correct for the same underlying reason: the cut property."
        est_minutes: 34
        prerequisites: [union-find, shortest-paths-dijkstra]
        concepts:
          introduces: [minimum-spanning-tree, cut-property]
          reinforces: [union-find, greedy-algorithm, heap]
        key_ideas:
          - "The cut property: for any partition of the nodes into two nonempty sets, the lightest edge crossing the cut belongs to some MST"
          - "Kruskal's algorithm sorts edges by weight and adds each one that does not create a cycle, using union-find to test that in O(alpha(n))"
          - "Prim's algorithm grows one tree from a start node, always adding the lightest edge leaving the current tree, using a priority queue exactly like Dijkstra's"
          - "Both run in O(E log V); Kruskal's is preferable for sparse graphs, Prim's for dense ones with an adjacency matrix"
          - Unlike shortest paths, MST correctness never depends on the sign of edge weights — the cut property holds regardless
        demo:
          component: MSTCutProperty
          spec: >
            Weighted graph; reader draws a cut by selecting a node subset, and
            the lightest crossing edge highlights automatically, then runs
            Kruskal's or Prim's step by step to watch the MST assemble edge by
            edge. Task stated first: find a cut whose lightest crossing edge is
            not the graph's globally lightest edge, then confirm both
            algorithms still include it in their MST. Presets: a graph with a
            unique MST, a graph with tied edge weights (multiple valid MSTs).

  - slug: limits-of-efficiency
    title: "Limits of efficient computation"
    outcomes: [co-limits]
    lessons:
      - slug: reductions-between-problems
        title: "Reductions between problems"
        type: core
        status: planned
        goal: "Construct a reduction from one problem to another to compare their computational difficulty"
        opening: "A reduction from problem A to problem B is an efficient way of solving A using a solver for B as a subroutine, and reductions are how the entire course's toolkit is extended: a new problem that reduces to shortest paths or to matching inherits that problem's algorithm for free."
        est_minutes: 30
        prerequisites: [dynamic-programming-ii-two-dimensional, graph-representations]
        concepts:
          introduces: [reduction]
          reinforces: [dynamic-programming, graph]
        key_ideas:
          - "A poly-time reduction from A to B plus a poly-time algorithm for B gives a poly-time algorithm for A"
          - "Reductions run in both directions as an argument: if A reduces to B, B is 'at least as hard' as A"
          - Many problems that look unrelated to graphs or DP become tractable once phrased as an instance of one — currency arbitrage detection reduces to negative-cycle detection
          - A reduction is not a resemblance or an analogy; it is a specific, efficiently computable transformation of one problem's input into another's
        demo: null

      - slug: p-np-and-np-completeness
        title: "P, NP, and NP-completeness"
        type: core
        status: planned
        goal: "Explain the classes P and NP and what makes a problem NP-complete"
        opening: "P is the class of problems solvable in polynomial time; NP is the (much larger, as far as anyone has proved) class of problems whose solutions can be verified in polynomial time once given; and an NP-complete problem is one that every other problem in NP reduces to, making it a hardest problem in the class."
        est_minutes: 34
        prerequisites: [reductions-between-problems]
        concepts:
          introduces: [np-completeness]
          reinforces: [reduction]
        key_ideas:
          - "P: solvable in polynomial time. NP: a proposed solution is checkable in polynomial time. P is a subset of NP, and whether the inclusion is strict is the open P vs. NP problem"
          - "The Cook-Levin theorem proves Boolean satisfiability (SAT) is NP-complete by showing any NP problem's verification process can be encoded as a SAT instance"
          - "Once one NP-complete problem is known, proving a new problem NP-complete needs only a poly-time reduction from an existing NP-complete problem to it"
          - "Karp's 1972 paper reduced SAT to 21 problems in one step, including vertex cover, independent set, and Hamiltonian cycle, establishing them as NP-complete too"
          - No known algorithm solves any NP-complete problem in polynomial time, and finding one would solve all of them simultaneously
        demo: null

      - slug: coping-with-np-hardness
        title: "Coping with NP-hardness"
        type: synthesis
        status: planned
        goal: "Select a practical strategy — special-case algorithm, heuristic, or approximation — for an NP-hard problem encountered in practice"
        opening: "An NP-complete problem in a codebase is not solved by finding a clever enough algorithm; it is coped with, by exploiting structure the specific instances have that the general problem does not, by accepting a good-enough answer instead of an optimal one, or by giving up polynomial time for small enough inputs."
        est_minutes: 30
        prerequisites: [p-np-and-np-completeness]
        concepts:
          introduces: []
          reinforces: [np-completeness, dynamic-programming, greedy-algorithm]
        key_ideas:
          - "Special-case structure can restore tractability: vertex cover is NP-hard in general but solvable in polynomial time on trees by a simple DP"
          - "Exponential-but-better-than-brute-force algorithms exist for many NP-complete problems: 0/1 knapsack's O(nW) DP is exponential only in the number of bits of W, not in n"
          - "Heuristics and local search (simulated annealing, greedy construction plus local improvement) give no guarantee but work well on typical instances"
          - "Approximation algorithms give a proven bound on how far from optimal the answer can be — a different but rigorous notion of 'solved' — and are the subject of the advanced sequence"
          - "Recognizing that a new problem is NP-complete is itself valuable: it redirects effort from searching for an exact polynomial algorithm to choosing among these strategies"
        demo: null

<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .hot { fill: #e2903a; }
    .cool { fill: #4c8dd6; }
  </style>
  <defs>
    <marker id="ai-blue" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4c8dd6"/>
    </marker>
  </defs>

  <text class="cool" x="368" y="26" text-anchor="middle" font-weight="600">insert(2, x): the n − i = 4 elements behind slot 2 each move one slot right</text>

  <!-- shift arcs above the before row -->
  <path d="M240,58 Q272,40 300,58" fill="none" stroke="#4c8dd6" stroke-width="1.5" marker-end="url(#ai-blue)"/>
  <path d="M304,58 Q336,40 364,58" fill="none" stroke="#4c8dd6" stroke-width="1.5" marker-end="url(#ai-blue)"/>
  <path d="M368,58 Q400,40 428,58" fill="none" stroke="#4c8dd6" stroke-width="1.5" marker-end="url(#ai-blue)"/>
  <path d="M432,58 Q464,40 492,58" fill="none" stroke="#4c8dd6" stroke-width="1.5" marker-end="url(#ai-blue)"/>

  <text class="muted" x="52" y="90" text-anchor="end">before</text>

  <!-- before row: a b c d e f _ _ -->
  <rect x="60"  y="66" width="64" height="42" rx="4" fill="none" stroke="currentColor"/>
  <rect x="124" y="66" width="64" height="42" rx="4" fill="none" stroke="currentColor"/>
  <rect x="188" y="66" width="64" height="42" rx="4" fill="none" stroke="currentColor"/>
  <rect x="252" y="66" width="64" height="42" rx="4" fill="none" stroke="currentColor"/>
  <rect x="316" y="66" width="64" height="42" rx="4" fill="none" stroke="currentColor"/>
  <rect x="380" y="66" width="64" height="42" rx="4" fill="none" stroke="currentColor"/>
  <rect x="444" y="66" width="64" height="42" rx="4" fill="none" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5"/>
  <rect x="508" y="66" width="64" height="42" rx="4" fill="none" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5"/>

  <text class="label" x="92"  y="92" text-anchor="middle">a</text>
  <text class="label" x="156" y="92" text-anchor="middle">b</text>
  <text class="cool" x="220" y="92" text-anchor="middle">c</text>
  <text class="cool" x="284" y="92" text-anchor="middle">d</text>
  <text class="cool" x="348" y="92" text-anchor="middle">e</text>
  <text class="cool" x="412" y="92" text-anchor="middle">f</text>

  <text class="muted" x="92"  y="124" text-anchor="middle">0</text>
  <text class="muted" x="156" y="124" text-anchor="middle">1</text>
  <text class="muted" x="220" y="124" text-anchor="middle">2</text>
  <text class="muted" x="284" y="124" text-anchor="middle">3</text>
  <text class="muted" x="348" y="124" text-anchor="middle">4</text>
  <text class="muted" x="412" y="124" text-anchor="middle">5</text>
  <text class="muted" x="476" y="124" text-anchor="middle">6</text>
  <text class="muted" x="540" y="124" text-anchor="middle">7</text>

  <text class="muted" x="52" y="192" text-anchor="end">after</text>

  <!-- after row: a b x c d e f _ -->
  <rect x="60"  y="168" width="64" height="42" rx="4" fill="none" stroke="currentColor"/>
  <rect x="124" y="168" width="64" height="42" rx="4" fill="none" stroke="currentColor"/>
  <rect x="188" y="168" width="64" height="42" rx="4" fill="#e2903a" opacity="0.18"/>
  <rect x="188" y="168" width="64" height="42" rx="4" fill="none" stroke="#e2903a" stroke-width="2"/>
  <rect x="252" y="168" width="64" height="42" rx="4" fill="none" stroke="currentColor"/>
  <rect x="316" y="168" width="64" height="42" rx="4" fill="none" stroke="currentColor"/>
  <rect x="380" y="168" width="64" height="42" rx="4" fill="none" stroke="currentColor"/>
  <rect x="444" y="168" width="64" height="42" rx="4" fill="none" stroke="currentColor"/>
  <rect x="508" y="168" width="64" height="42" rx="4" fill="none" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5"/>

  <text class="label" x="92"  y="194" text-anchor="middle">a</text>
  <text class="label" x="156" y="194" text-anchor="middle">b</text>
  <text class="hot"  x="220" y="194" text-anchor="middle" font-weight="600">x</text>
  <text class="cool" x="284" y="194" text-anchor="middle">c</text>
  <text class="cool" x="348" y="194" text-anchor="middle">d</text>
  <text class="cool" x="412" y="194" text-anchor="middle">e</text>
  <text class="cool" x="476" y="194" text-anchor="middle">f</text>

  <text class="muted" x="60" y="240">inserting at the front (i = 0) moves all n elements; inserting at the back moves none</text>
</svg>

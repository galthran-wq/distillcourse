<svg viewBox="0 0 640 220" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .hot { fill: #e2903a; }
  </style>
  <defs>
    <marker id="am-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#e2903a"/>
    </marker>
    <marker id="am-arrowC" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- address computation annotation -->
  <text class="hot" x="414" y="34" text-anchor="middle" font-weight="600">addr(5) = 512 + 5 × 8 = 552</text>
  <line x1="414" y1="44" x2="414" y2="82" stroke="#e2903a" stroke-width="1.5" marker-end="url(#am-arrow)"/>

  <!-- indices above cells -->
  <text class="muted" x="74" y="78" text-anchor="middle">i = 0</text>
  <text class="muted" x="142" y="78" text-anchor="middle">1</text>
  <text class="muted" x="210" y="78" text-anchor="middle">2</text>
  <text class="muted" x="278" y="78" text-anchor="middle">3</text>
  <text class="muted" x="346" y="78" text-anchor="middle">4</text>
  <text class="hot" x="414" y="78" text-anchor="middle" font-size="11">5</text>
  <text class="muted" x="482" y="78" text-anchor="middle">6</text>
  <text class="muted" x="550" y="78" text-anchor="middle">7</text>

  <!-- cells -->
  <rect x="40"  y="88" width="68" height="46" rx="4" fill="none" stroke="currentColor"/>
  <rect x="108" y="88" width="68" height="46" rx="4" fill="none" stroke="currentColor"/>
  <rect x="176" y="88" width="68" height="46" rx="4" fill="none" stroke="currentColor"/>
  <rect x="244" y="88" width="68" height="46" rx="4" fill="none" stroke="currentColor"/>
  <rect x="312" y="88" width="68" height="46" rx="4" fill="none" stroke="currentColor"/>
  <rect x="380" y="88" width="68" height="46" rx="4" fill="#e2903a" opacity="0.18"/>
  <rect x="380" y="88" width="68" height="46" rx="4" fill="none" stroke="#e2903a" stroke-width="2"/>
  <rect x="448" y="88" width="68" height="46" rx="4" fill="none" stroke="currentColor"/>
  <rect x="516" y="88" width="68" height="46" rx="4" fill="none" stroke="currentColor"/>

  <!-- values -->
  <text class="label" x="74"  y="116" text-anchor="middle">41</text>
  <text class="label" x="142" y="116" text-anchor="middle">7</text>
  <text class="label" x="210" y="116" text-anchor="middle">19</text>
  <text class="label" x="278" y="116" text-anchor="middle">3</text>
  <text class="label" x="346" y="116" text-anchor="middle">88</text>
  <text class="hot"  x="414" y="116" text-anchor="middle" font-weight="600">26</text>
  <text class="label" x="482" y="116" text-anchor="middle">5</text>
  <text class="label" x="550" y="116" text-anchor="middle">60</text>

  <!-- addresses below -->
  <text class="muted" x="74"  y="154" text-anchor="middle">512</text>
  <text class="muted" x="142" y="154" text-anchor="middle">520</text>
  <text class="muted" x="210" y="154" text-anchor="middle">528</text>
  <text class="muted" x="278" y="154" text-anchor="middle">536</text>
  <text class="muted" x="346" y="154" text-anchor="middle">544</text>
  <text class="hot"  x="414" y="154" text-anchor="middle" font-size="11" font-weight="600">552</text>
  <text class="muted" x="482" y="154" text-anchor="middle">560</text>
  <text class="muted" x="550" y="154" text-anchor="middle">568</text>

  <!-- base + width annotations -->
  <line x1="40" y1="162" x2="40" y2="176" stroke="currentColor" opacity="0.55"/>
  <text class="muted" x="40" y="192">base = 512</text>
  <path d="M516,166 L516,172 L584,172 L584,166" fill="none" stroke="currentColor" opacity="0.55"/>
  <text class="muted" x="550" y="190" text-anchor="middle">w = 8 bytes</text>
</svg>

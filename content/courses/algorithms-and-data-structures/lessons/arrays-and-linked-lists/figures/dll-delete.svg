<svg viewBox="0 0 640 240" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .hot { fill: #e2903a; }
    .cool { fill: #4c8dd6; }
  </style>
  <defs>
    <marker id="dd-hot" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#e2903a"/>
    </marker>
    <marker id="dd-cool" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4c8dd6"/>
    </marker>
    <marker id="dd-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor"/>
    </marker>
  </defs>

  <text class="hot" x="320" y="34" text-anchor="middle" font-weight="600">x.prev.next ← x.next</text>
  <path d="M198,96 Q320,44 442,96" fill="none" stroke="#e2903a" stroke-width="1.8" marker-end="url(#dd-hot)"/>

  <!-- left neighbor: prev | 12 | next -->
  <text class="muted" x="125" y="86" text-anchor="middle">x.prev</text>
  <rect x="70" y="98" width="26" height="44" rx="4" fill="none" stroke="currentColor"/>
  <rect x="96" y="98" width="58" height="44" rx="4" fill="none" stroke="currentColor"/>
  <rect x="154" y="98" width="26" height="44" rx="4" fill="none" stroke="currentColor"/>
  <text class="label" x="125" y="125" text-anchor="middle">12</text>

  <!-- x, being removed -->
  <g opacity="0.35">
    <rect x="265" y="98" width="26" height="44" rx="4" fill="none" stroke="currentColor"/>
    <rect x="291" y="98" width="58" height="44" rx="4" fill="none" stroke="currentColor"/>
    <rect x="349" y="98" width="26" height="44" rx="4" fill="none" stroke="currentColor"/>
    <text class="label" x="320" y="125" text-anchor="middle">99</text>
    <line x1="278" y1="120" x2="184" y2="120" stroke="currentColor" stroke-width="1.2" marker-end="url(#dd-arrow)"/>
    <line x1="362" y1="120" x2="456" y2="120" stroke="currentColor" stroke-width="1.2" marker-end="url(#dd-arrow)"/>
  </g>
  <text class="label" x="320" y="86" text-anchor="middle" font-weight="600">x</text>

  <!-- right neighbor -->
  <text class="muted" x="515" y="86" text-anchor="middle">x.next</text>
  <rect x="460" y="98" width="26" height="44" rx="4" fill="none" stroke="currentColor"/>
  <rect x="486" y="98" width="58" height="44" rx="4" fill="none" stroke="currentColor"/>
  <rect x="544" y="98" width="26" height="44" rx="4" fill="none" stroke="currentColor"/>
  <text class="label" x="515" y="125" text-anchor="middle">37</text>

  <path d="M442,146 Q320,198 198,146" fill="none" stroke="#4c8dd6" stroke-width="1.8" marker-end="url(#dd-cool)"/>
  <text class="cool" x="320" y="212" text-anchor="middle" font-weight="600">x.next.prev ← x.prev</text>

  <text class="muted" x="40" y="234">two writes, no traversal: x's own fields name both neighbors</text>
</svg>

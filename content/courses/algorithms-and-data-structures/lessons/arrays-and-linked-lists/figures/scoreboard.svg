<svg viewBox="0 0 720 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .head { fill: currentColor; font-size: 11px; font-weight: 600; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 10px; }
    .val { fill: currentColor; font-size: 13px; }
    .one { fill: currentColor; font-size: 13px; font-weight: 600; }
    .hot { fill: #e2903a; font-size: 13px; font-weight: 600; }
  </style>

  <text class="label" x="30" y="26" font-weight="600">Sequence operations, worst case Θ(·)</text>
  <text class="muted" x="700" y="26" text-anchor="end">scoreboard v1</text>

  <!-- header -->
  <text class="head" x="168" y="52" text-anchor="middle">get(i)</text>
  <text class="head" x="232" y="46" text-anchor="middle">insert(i)</text>
  <text class="head" x="232" y="58" text-anchor="middle">delete(i)</text>
  <text class="head" x="296" y="46" text-anchor="middle">insert</text>
  <text class="head" x="296" y="58" text-anchor="middle">front</text>
  <text class="head" x="360" y="46" text-anchor="middle">delete</text>
  <text class="head" x="360" y="58" text-anchor="middle">front</text>
  <text class="head" x="424" y="46" text-anchor="middle">insert</text>
  <text class="head" x="424" y="58" text-anchor="middle">back</text>
  <text class="head" x="488" y="46" text-anchor="middle">delete</text>
  <text class="head" x="488" y="58" text-anchor="middle">back</text>
  <text class="head" x="552" y="46" text-anchor="middle">insert</text>
  <text class="head" x="552" y="58" text-anchor="middle">after p</text>
  <text class="head" x="616" y="46" text-anchor="middle">delete</text>
  <text class="head" x="616" y="58" text-anchor="middle">given p</text>
  <text class="head" x="680" y="52" text-anchor="middle">search</text>
  <line x1="30" y1="66" x2="700" y2="66" stroke="currentColor" stroke-width="1"/>

  <!-- stripes -->
  <rect x="24" y="74" width="682" height="40" fill="currentColor" opacity="0.05" rx="4"/>
  <rect x="24" y="158" width="682" height="40" fill="currentColor" opacity="0.05" rx="4"/>

  <!-- array row -->
  <text class="label" x="30" y="92" font-weight="600">array</text>
  <text class="muted" x="30" y="106">fixed capacity</text>
  <text class="hot" x="168" y="98" text-anchor="middle">1</text>
  <text class="val" x="232" y="98" text-anchor="middle">n</text>
  <text class="val" x="296" y="98" text-anchor="middle">n</text>
  <text class="val" x="360" y="98" text-anchor="middle">n</text>
  <text class="one" x="424" y="98" text-anchor="middle">1 ‡</text>
  <text class="one" x="488" y="98" text-anchor="middle">1</text>
  <text class="val" x="552" y="98" text-anchor="middle">n †</text>
  <text class="val" x="616" y="98" text-anchor="middle">n †</text>
  <text class="val" x="680" y="98" text-anchor="middle">n</text>

  <!-- singly linked row -->
  <text class="label" x="30" y="134" font-weight="600">singly linked</text>
  <text class="muted" x="30" y="148">head + tail pointers</text>
  <text class="val" x="168" y="140" text-anchor="middle">n</text>
  <text class="val" x="232" y="140" text-anchor="middle">n</text>
  <text class="one" x="296" y="140" text-anchor="middle">1</text>
  <text class="one" x="360" y="140" text-anchor="middle">1</text>
  <text class="one" x="424" y="140" text-anchor="middle">1</text>
  <text class="val" x="488" y="140" text-anchor="middle">n</text>
  <text class="one" x="552" y="140" text-anchor="middle">1</text>
  <text class="val" x="616" y="140" text-anchor="middle">n</text>
  <text class="val" x="680" y="140" text-anchor="middle">n</text>

  <!-- doubly linked row -->
  <text class="label" x="30" y="176" font-weight="600">doubly linked</text>
  <text class="muted" x="30" y="190">with sentinel</text>
  <text class="val" x="168" y="182" text-anchor="middle">n</text>
  <text class="val" x="232" y="182" text-anchor="middle">n</text>
  <text class="one" x="296" y="182" text-anchor="middle">1</text>
  <text class="one" x="360" y="182" text-anchor="middle">1</text>
  <text class="one" x="424" y="182" text-anchor="middle">1</text>
  <text class="one" x="488" y="182" text-anchor="middle">1</text>
  <text class="one" x="552" y="182" text-anchor="middle">1</text>
  <text class="hot" x="616" y="182" text-anchor="middle">1</text>
  <text class="val" x="680" y="182" text-anchor="middle">n</text>

  <line x1="30" y1="212" x2="700" y2="212" stroke="currentColor" stroke-width="1" opacity="0.4"/>
  <text class="muted" x="30" y="234">‡ while spare capacity lasts; a full array must be reallocated and every element copied</text>
  <text class="muted" x="30" y="252">† an array has no node handles: the operation is insert(i) / delete(i), paid for in shifts</text>
  <text class="muted" x="30" y="270">insert(i) / delete(i) is Θ(n) in every row: the array pays shifts, the lists pay the walk to position i</text>
  <text class="muted" x="30" y="288">every Θ(1) in one row faces a Θ(n) in another — no row dominates</text>
</svg>

<svg viewBox="0 0 640 210" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .hot { fill: #e2903a; }
  </style>
  <defs>
    <marker id="sn-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor"/>
    </marker>
    <marker id="sn-hot" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#e2903a"/>
    </marker>
  </defs>

  <!-- field labels above node 2 -->
  <text class="hot" x="282" y="36" text-anchor="middle" font-weight="600">value</text>
  <line x1="282" y1="42" x2="282" y2="74" stroke="#e2903a" stroke-width="1.2" marker-end="url(#sn-hot)"/>
  <text class="hot" x="325" y="36" text-anchor="start" font-weight="600">next: a pointer to the successor</text>
  <line x1="325" y1="42" x2="325" y2="74" stroke="#e2903a" stroke-width="1.2" marker-end="url(#sn-hot)"/>

  <!-- head -->
  <rect x="40" y="80" width="54" height="40" rx="4" fill="none" stroke="currentColor"/>
  <text class="label" x="67" y="105" text-anchor="middle" font-weight="600">head</text>
  <line x1="94" y1="100" x2="126" y2="100" stroke="currentColor" stroke-width="1.5" marker-end="url(#sn-arrow)"/>

  <!-- node 1 -->
  <rect x="130" y="78" width="55" height="44" rx="4" fill="none" stroke="currentColor"/>
  <rect x="185" y="78" width="30" height="44" rx="4" fill="none" stroke="currentColor"/>
  <text class="label" x="157" y="105" text-anchor="middle">12</text>
  <circle cx="200" cy="100" r="3" fill="currentColor"/>
  <line x1="200" y1="100" x2="251" y2="100" stroke="currentColor" stroke-width="1.5" marker-end="url(#sn-arrow)"/>

  <!-- node 2 -->
  <rect x="255" y="78" width="55" height="44" rx="4" fill="none" stroke="#e2903a" stroke-width="2"/>
  <rect x="310" y="78" width="30" height="44" rx="4" fill="none" stroke="#e2903a" stroke-width="2"/>
  <text class="label" x="282" y="105" text-anchor="middle">99</text>
  <circle cx="325" cy="100" r="3" fill="currentColor"/>
  <line x1="325" y1="100" x2="376" y2="100" stroke="currentColor" stroke-width="1.5" marker-end="url(#sn-arrow)"/>

  <!-- node 3 -->
  <rect x="380" y="78" width="55" height="44" rx="4" fill="none" stroke="currentColor"/>
  <rect x="435" y="78" width="30" height="44" rx="4" fill="none" stroke="currentColor"/>
  <text class="label" x="407" y="105" text-anchor="middle">37</text>
  <circle cx="450" cy="100" r="3" fill="currentColor"/>
  <line x1="450" y1="100" x2="501" y2="100" stroke="currentColor" stroke-width="1.5" marker-end="url(#sn-arrow)"/>

  <!-- node 4 (tail) -->
  <rect x="505" y="78" width="55" height="44" rx="4" fill="none" stroke="currentColor"/>
  <rect x="560" y="78" width="30" height="44" rx="4" fill="none" stroke="currentColor"/>
  <text class="label" x="532" y="105" text-anchor="middle">5</text>
  <line x1="563" y1="119" x2="587" y2="81" stroke="currentColor" stroke-width="1.5"/>
  <text class="muted" x="575" y="140" text-anchor="middle">nil</text>

  <!-- non-contiguous addresses -->
  <text class="muted" x="172" y="142" text-anchor="middle">@2144</text>
  <text class="muted" x="297" y="142" text-anchor="middle">@512</text>
  <text class="muted" x="422" y="142" text-anchor="middle">@8960</text>
  <text class="muted" x="532" y="142" text-anchor="middle">@1032</text>

  <text class="muted" x="40" y="178">the addresses are wherever the allocator put each node: order lives in the pointers, not in memory</text>
</svg>

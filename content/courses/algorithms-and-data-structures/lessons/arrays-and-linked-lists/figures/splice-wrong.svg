<svg viewBox="0 0 640 250" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .hot { fill: #e2903a; }
  </style>
  <defs>
    <marker id="sw-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor"/>
    </marker>
    <marker id="sw-hot" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#e2903a"/>
    </marker>
  </defs>

  <text class="label" x="40" y="28" font-weight="600">the same two writes, reversed: p.next ← u first, then u.next ← p.next</text>

  <!-- leading -->
  <text class="muted" x="46" y="86">…</text>
  <line x1="64" y1="82" x2="146" y2="82" stroke="currentColor" stroke-width="1.5" marker-end="url(#sw-arrow)"/>

  <!-- p -->
  <text class="label" x="177" y="50" text-anchor="middle" font-weight="600">p</text>
  <rect x="150" y="60" width="55" height="44" rx="4" fill="none" stroke="currentColor"/>
  <rect x="205" y="60" width="30" height="44" rx="4" fill="none" stroke="currentColor"/>
  <text class="label" x="177" y="87" text-anchor="middle">12</text>
  <circle cx="220" cy="82" r="3" fill="currentColor"/>
  <path d="M220,82 Q222,150 246,172" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#sw-arrow)"/>

  <!-- q, orphaned -->
  <g opacity="0.3">
    <rect x="405" y="60" width="55" height="44" rx="4" fill="none" stroke="currentColor"/>
    <rect x="460" y="60" width="30" height="44" rx="4" fill="none" stroke="currentColor"/>
    <text class="label" x="432" y="87" text-anchor="middle">37</text>
    <circle cx="475" cy="82" r="3" fill="currentColor"/>
    <line x1="475" y1="82" x2="556" y2="82" stroke="currentColor" stroke-width="1.5" marker-end="url(#sw-arrow)"/>
    <text class="muted" x="566" y="86">…</text>
  </g>
  <text class="label" x="432" y="50" text-anchor="middle" font-weight="600">q and the rest: unreachable</text>

  <!-- u with self-loop -->
  <text class="hot" x="236" y="188" text-anchor="end" font-weight="600">u</text>
  <rect x="250" y="160" width="55" height="44" rx="4" fill="none" stroke="#e2903a" stroke-width="2"/>
  <rect x="305" y="160" width="30" height="44" rx="4" fill="none" stroke="#e2903a" stroke-width="2"/>
  <text class="hot" x="277" y="187" text-anchor="middle" font-weight="600">x</text>
  <circle cx="320" cy="182" r="3" fill="#e2903a"/>
  <path d="M320,182 Q378,182 378,220 Q378,236 320,232 Q262,228 262,210" fill="none" stroke="#e2903a" stroke-width="1.8" marker-end="url(#sw-hot)"/>
  <text class="hot" x="398" y="222" font-size="11">u.next ← p.next copies u's own address</text>

  <text class="muted" x="40" y="130">the write p.next ← u destroyed the only pointer to q before anything saved it</text>
</svg>

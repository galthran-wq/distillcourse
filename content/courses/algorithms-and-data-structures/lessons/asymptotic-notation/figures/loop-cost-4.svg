<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .code { fill: currentColor; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
    .count { fill: #e2903a; font-weight: 600; }
  </style>

  <text class="muted" x="48" y="30">algorithm PairProducts(A[1..n])</text>
  <text class="muted" x="560" y="30" text-anchor="end">times executed</text>

  <text class="muted" x="30" y="58">1</text>
  <text class="code" x="48" y="58">s ← 0</text>
  <text class="count" x="560" y="58" text-anchor="end" opacity="0.3">1</text>

  <text class="muted" x="30" y="84">2</text>
  <text class="code" x="48" y="84">for i ← 1 to n</text>
  <text class="count" x="560" y="84" text-anchor="end" opacity="0.3">n + 1</text>

  <text class="muted" x="30" y="110">3</text>
  <text class="code" x="80" y="110">for j ← i + 1 to n</text>
  <text class="count" x="560" y="110" text-anchor="end">n(n+1)/2</text>

  <text class="muted" x="30" y="136">4</text>
  <text class="code" x="112" y="136">s ← s + A[i]·A[j]</text>
  <text class="count" x="560" y="136" text-anchor="end">n(n−1)/2</text>

  <text class="muted" x="30" y="162">5</text>
  <text class="code" x="48" y="162">return s</text>
  <text class="count" x="560" y="162" text-anchor="end" opacity="0.3">1</text>

  <line x1="30" y1="184" x2="560" y2="184" stroke="currentColor" stroke-width="1" opacity="0.4"/>

  <text class="label" x="48" y="220">T(n) = <tspan class="count" font-size="17">Θ(n²)</tspan></text>
  <text class="muted" x="48" y="244">the growth rate of the leading term: the only part that survives a change of machine</text>
</svg>

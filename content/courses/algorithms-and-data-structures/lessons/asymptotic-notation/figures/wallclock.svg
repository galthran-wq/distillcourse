<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .val { fill: currentColor; }
    .hot { fill: #e2903a; font-weight: 600; }
  </style>

  <!-- header -->
  <text class="label" x="30" y="42" font-weight="600">growth class</text>
  <text class="label" x="330" y="42" text-anchor="end" font-weight="600">n = 10³</text>
  <text class="label" x="470" y="42" text-anchor="end" font-weight="600">n = 10⁶</text>
  <text class="label" x="610" y="42" text-anchor="end" font-weight="600">n = 10⁹</text>
  <line x1="30" y1="52" x2="610" y2="52" stroke="currentColor" stroke-width="1"/>

  <!-- row stripes -->
  <rect x="24" y="60" width="592" height="34" fill="currentColor" opacity="0.05" rx="4"/>
  <rect x="24" y="128" width="592" height="34" fill="currentColor" opacity="0.05" rx="4"/>
  <rect x="24" y="196" width="592" height="34" fill="currentColor" opacity="0.05" rx="4"/>

  <!-- rows -->
  <text class="label" x="30" y="82">Θ(1)</text>
  <text class="muted" x="100" y="82">constant</text>
  <text class="val" x="330" y="82" text-anchor="end">1 ns</text>
  <text class="val" x="470" y="82" text-anchor="end">1 ns</text>
  <text class="val" x="610" y="82" text-anchor="end">1 ns</text>

  <text class="label" x="30" y="116">Θ(log n)</text>
  <text class="muted" x="100" y="116">logarithmic</text>
  <text class="val" x="330" y="116" text-anchor="end">10 ns</text>
  <text class="val" x="470" y="116" text-anchor="end">20 ns</text>
  <text class="val" x="610" y="116" text-anchor="end">30 ns</text>

  <text class="label" x="30" y="150">Θ(n)</text>
  <text class="muted" x="100" y="150">linear</text>
  <text class="val" x="330" y="150" text-anchor="end">1 µs</text>
  <text class="val" x="470" y="150" text-anchor="end">1 ms</text>
  <text class="val" x="610" y="150" text-anchor="end">1 s</text>

  <text class="label" x="30" y="184">Θ(n log n)</text>
  <text class="muted" x="130" y="184">log-linear</text>
  <text class="val" x="330" y="184" text-anchor="end">10 µs</text>
  <text class="val" x="470" y="184" text-anchor="end">20 ms</text>
  <text class="val" x="610" y="184" text-anchor="end">30 s</text>

  <text class="label" x="30" y="218">Θ(n²)</text>
  <text class="muted" x="100" y="218">quadratic</text>
  <text class="val" x="330" y="218" text-anchor="end">1 ms</text>
  <text class="hot" x="470" y="218" text-anchor="end">≈ 17 min</text>
  <text class="val" x="610" y="218" text-anchor="end">≈ 32 years</text>

  <text class="label" x="30" y="252">Θ(2ⁿ)</text>
  <text class="muted" x="100" y="252">exponential</text>
  <text class="hot" x="330" y="252" text-anchor="end">≈ 10²⁸¹ millennia</text>
  <text class="val" x="470" y="252" text-anchor="end" opacity="0.55">—</text>
  <text class="val" x="610" y="252" text-anchor="end" opacity="0.55">—</text>

  <line x1="30" y1="268" x2="610" y2="268" stroke="currentColor" stroke-width="1" opacity="0.4"/>
  <text class="muted" x="30" y="292">one step per nanosecond: a 1 GHz machine executing one operation per cycle</text>
  <text class="muted" x="30" y="308">the observable universe holds an estimated 10⁸⁰ particles; 2¹⁰⁰⁰ ≈ 10³⁰¹ steps</text>
</svg>

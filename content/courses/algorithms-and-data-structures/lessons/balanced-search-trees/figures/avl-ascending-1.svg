<svg viewBox="0 0 640 270" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .edge { stroke: currentColor; stroke-width: 1.3; opacity: 0.75; }
    .node { fill: none; stroke: currentColor; stroke-width: 1.4; }
    .cur { fill: #e2903a; fill-opacity: 0.22; stroke: #e2903a; stroke-width: 1.8; }
    .key { fill: currentColor; text-anchor: middle; }
    .bf { fill: currentColor; opacity: 0.6; font-size: 10.5px; }
  </style>
  <text class="label" x="24" y="26" font-weight="600">insert 1, then 2</text>
  <line class="edge" x1="55" y1="60" x2="155" y2="122"/>
  <circle class="node" cx="55" cy="60" r="15"/><text class="key" x="55" y="64">1</text>
  <circle class="cur" cx="155" cy="122" r="15"/><text class="key" x="155" y="126">2</text>
  <text class="bf" x="74" y="48">+1</text>
  <text class="bf" x="174" y="110">0</text>
  <text class="muted" x="24" y="256">bf = height(right) − height(left); each key keeps one horizontal position for the whole sequence</text>
</svg>

<svg viewBox="0 0 640 270" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .edge { stroke: currentColor; stroke-width: 1.3; opacity: 0.75; }
    .node { fill: none; stroke: currentColor; stroke-width: 1.4; }
    .rot { fill: none; stroke: #e2903a; stroke-width: 1.8; }
    .key { fill: currentColor; text-anchor: middle; }
    .bf { fill: currentColor; opacity: 0.6; font-size: 10.5px; }
  </style>
  <text class="label" x="24" y="26" font-weight="600">rotate left at 1:  height 1 again</text>
  <line class="edge" x1="155" y1="60" x2="55" y2="122"/>
  <line class="edge" x1="155" y1="60" x2="255" y2="122"/>
  <circle class="rot" cx="155" cy="60" r="15"/><text class="key" x="155" y="64">2</text>
  <circle class="rot" cx="55" cy="122" r="15"/><text class="key" x="55" y="126">1</text>
  <circle class="node" cx="255" cy="122" r="15"/><text class="key" x="255" y="126">3</text>
  <text class="bf" x="174" y="48">0</text>
  <text class="bf" x="74" y="110">0</text>
  <text class="bf" x="274" y="110">0</text>
  <text class="muted" x="24" y="256">2 takes 1&#8217;s place; the keys 1, 2, 3 keep their left-to-right order</text>
</svg>

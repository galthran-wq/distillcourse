<svg viewBox="0 0 640 270" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .edge { stroke: currentColor; stroke-width: 1.3; opacity: 0.75; }
    .node { fill: none; stroke: currentColor; stroke-width: 1.4; }
    .cur { fill: #e2903a; fill-opacity: 0.22; stroke: #e2903a; stroke-width: 1.8; }
    .bad { fill: none; stroke: #e2903a; stroke-width: 2.2; }
    .key { fill: currentColor; text-anchor: middle; }
    .bf { fill: currentColor; opacity: 0.6; font-size: 10.5px; }
    .bfbad { fill: #e2903a; font-size: 10.5px; font-weight: 600; }
  </style>
  <text class="label" x="24" y="26" font-weight="600">insert 4, then 5:  two ancestors reach +2 &#8212; the fixup fires at the lowest</text>
  <line class="edge" x1="155" y1="60" x2="55" y2="122"/>
  <line class="edge" x1="155" y1="60" x2="255" y2="122"/>
  <line class="edge" x1="255" y1="122" x2="355" y2="184"/>
  <line class="edge" x1="355" y1="184" x2="455" y2="238"/>
  <circle class="node" cx="155" cy="60" r="15"/><text class="key" x="155" y="64">2</text>
  <circle class="node" cx="55" cy="122" r="15"/><text class="key" x="55" y="126">1</text>
  <circle class="bad" cx="255" cy="122" r="15"/><text class="key" x="255" y="126">3</text>
  <circle class="node" cx="355" cy="184" r="15"/><text class="key" x="355" y="188">4</text>
  <circle class="cur" cx="455" cy="238" r="15"/><text class="key" x="455" y="242">5</text>
  <text class="bfbad" x="174" y="48">+2</text>
  <text class="bf" x="74" y="110">0</text>
  <text class="bfbad" x="274" y="110">+2 &#8592; lowest</text>
  <text class="bf" x="374" y="172">+1</text>
  <text class="bf" x="474" y="226">0</text>
  <text class="muted" x="24" y="256">node 2 is also at +2, but repairing the lowest violation will repair it for free</text>
</svg>

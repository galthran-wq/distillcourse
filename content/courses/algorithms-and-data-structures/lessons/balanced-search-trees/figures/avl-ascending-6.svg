  <line class="edge" x1="355" y1="122" x2="255" y2="184"/>
  <line class="edge" x1="355" y1="122" x2="455" y2="184"/>
  <line class="edge" x1="455" y1="184" x2="555" y2="238"/>
  <circle class="bad" cx="155" cy="60" r="15"/><text class="key" x="155" y="64">2</text>
  <circle class="node" cx="55" cy="122" r="15"/><text class="key" x="55" y="126">1</text>
  <circle class="node" cx="355" cy="122" r="15"/><text class="key" x="355" y="126">4</text>
  <circle class="node" cx="255" cy="184" r="15"/><text class="key" x="255" y="188">3</text>
  <circle class="node" cx="455" cy="184" r="15"/><text class="key" x="455" y="188">5</text>
  <circle class="cur" cx="555" cy="238" r="15"/><text class="key" x="555" y="242">6</text>
  <text class="bfbad" x="174" y="48">+2</text>
  <text class="bf" x="74" y="110">0</text>
  <text class="bf" x="374" y="110">+1</text>
  <text class="bf" x="274" y="172">0</text>
  <text class="bf" x="474" y="172">+1</text>
  <text class="bf" x="574" y="226">0</text>
  <text class="muted" x="24" y="256">the walk from the new leaf finds no violation until the root itself</text>

    .bad { fill: none; stroke: #e2903a; stroke-width: 2.2; }
    .key { fill: currentColor; text-anchor: middle; }
    .bf { fill: currentColor; opacity: 0.6; font-size: 10.5px; }
    .bfbad { fill: #e2903a; font-size: 10.5px; font-weight: 600; }
  </style>
  <text class="label" x="24" y="26" font-weight="600">insert 6:  bf(2) = +2, this time at the root</text>

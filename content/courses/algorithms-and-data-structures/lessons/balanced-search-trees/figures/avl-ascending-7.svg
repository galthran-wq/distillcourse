<svg viewBox="0 0 640 270" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .edge { stroke: currentColor; stroke-width: 1.3; opacity: 0.75; }
    .node { fill: none; stroke: currentColor; stroke-width: 1.4; }
    .rot { fill: none; stroke: #e2903a; stroke-width: 1.8; }
    .key { fill: currentColor; text-anchor: middle; }
    .bf { fill: currentColor; opacity: 0.6; font-size: 10.5px; }
  </style>
  <text class="label" x="24" y="26" font-weight="600">rotate left at 2:  six sorted inserts, three rotations, height 2</text>
  <line class="edge" x1="355" y1="60" x2="155" y2="122"/>
  <line class="edge" x1="355" y1="60" x2="455" y2="122"/>
  <line class="edge" x1="155" y1="122" x2="55" y2="184"/>
  <line class="edge" x1="155" y1="122" x2="255" y2="184"/>
  <line class="edge" x1="455" y1="122" x2="555" y2="184"/>
  <circle class="rot" cx="355" cy="60" r="15"/><text class="key" x="355" y="64">4</text>
  <circle class="rot" cx="155" cy="122" r="15"/><text class="key" x="155" y="126">2</text>
  <circle class="node" cx="455" cy="122" r="15"/><text class="key" x="455" y="126">5</text>
  <circle class="node" cx="55" cy="184" r="15"/><text class="key" x="55" y="188">1</text>
  <circle class="node" cx="255" cy="184" r="15"/><text class="key" x="255" y="188">3</text>
  <circle class="node" cx="555" cy="184" r="15"/><text class="key" x="555" y="188">6</text>
  <text class="bf" x="374" y="48">0</text>
  <text class="bf" x="174" y="110">0</text>
  <text class="bf" x="474" y="110">+1</text>
  <text class="bf" x="74" y="172">0</text>
  <text class="bf" x="274" y="172">0</text>
  <text class="bf" x="574" y="172">0</text>
  <text class="muted" x="24" y="256">a plain BST after the same six inserts: a right chain of height 5</text>
</svg>

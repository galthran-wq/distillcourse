<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .edge { stroke: currentColor; stroke-width: 1.3; opacity: 0.75; }
    .node { fill: none; stroke: currentColor; stroke-width: 1.4; }
    .bad { fill: none; stroke: #e2903a; stroke-width: 2.2; }
    .ok { fill: none; stroke: #5aa46a; stroke-width: 2.2; }
    .key { fill: currentColor; text-anchor: middle; }
    .bfbad { fill: #e2903a; font-size: 10.5px; font-weight: 600; }
    .bfok { fill: #5aa46a; font-size: 10.5px; font-weight: 600; }
    .arrow { stroke: currentColor; stroke-width: 1.4; fill: none; }
  </style>
  <defs>
    <marker id="ah2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7" fill="none" stroke="currentColor" stroke-width="1.3"/>
    </marker>
  </defs>

  <text class="label" x="24" y="26" font-weight="600">the inside case: 2 sits between 1 and 3</text>

  <!-- row 1: single rotation fails -->
  <text class="muted" x="24" y="58">one rotation:</text>
  <line class="edge" x1="150" y1="60" x2="112" y2="105"/>
  <line class="edge" x1="112" y1="105" x2="150" y2="150"/>
  <circle class="bad" cx="150" cy="60" r="13"/><text class="key" x="150" y="64">3</text>
  <circle class="node" cx="112" cy="105" r="13"/><text class="key" x="112" y="109">1</text>
  <circle class="node" cx="150" cy="150" r="13"/><text class="key" x="150" y="154">2</text>
  <text class="bfbad" x="167" y="52">&#8722;2</text>

  <line class="arrow" x1="205" y1="105" x2="285" y2="105" marker-end="url(#ah2)"/>
  <text class="muted" x="245" y="93" text-anchor="middle">rotate right at 3</text>

  <line class="edge" x1="335" y1="60" x2="373" y2="105"/>
  <line class="edge" x1="373" y1="105" x2="335" y2="150"/>
  <circle class="bad" cx="335" cy="60" r="13"/><text class="key" x="335" y="64">1</text>
  <circle class="node" cx="373" cy="105" r="13"/><text class="key" x="373" y="109">3</text>
  <circle class="node" cx="335" cy="150" r="13"/><text class="key" x="335" y="154">2</text>
  <text class="bfbad" x="352" y="52">+2</text>
  <text class="bfbad" x="430" y="98">still |bf| = 2:</text>
  <text class="bfbad" x="430" y="116">the bend flipped sides</text>

  <!-- row 2: two rotations succeed -->
  <text class="muted" x="24" y="228">two rotations:</text>
  <line class="edge" x1="150" y1="230" x2="112" y2="275"/>
  <line class="edge" x1="112" y1="275" x2="150" y2="320"/>
  <circle class="bad" cx="150" cy="230" r="13"/><text class="key" x="150" y="234">3</text>
  <circle class="node" cx="112" cy="275" r="13"/><text class="key" x="112" y="279">1</text>
  <circle class="node" cx="150" cy="320" r="13"/><text class="key" x="150" y="324">2</text>
  <text class="bfbad" x="167" y="222">&#8722;2</text>

  <line class="arrow" x1="205" y1="275" x2="270" y2="275" marker-end="url(#ah2)"/>
  <text class="muted" x="237" y="263" text-anchor="middle">left at 1</text>

  <line class="edge" x1="345" y1="230" x2="307" y2="275"/>
  <line class="edge" x1="307" y1="275" x2="269" y2="320"/>
  <circle class="node" cx="345" cy="230" r="13"/><text class="key" x="345" y="234">3</text>
  <circle class="node" cx="307" cy="275" r="13"/><text class="key" x="307" y="279">2</text>
  <circle class="node" cx="269" cy="320" r="13"/><text class="key" x="269" y="324">1</text>
  <text class="muted" x="378" y="234">now an outside chain</text>

  <line class="arrow" x1="400" y1="275" x2="465" y2="275" marker-end="url(#ah2)"/>
  <text class="muted" x="432" y="263" text-anchor="middle">right at 3</text>

  <line class="edge" x1="530" y1="240" x2="492" y2="285"/>
  <line class="edge" x1="530" y1="240" x2="568" y2="285"/>
  <circle class="ok" cx="530" cy="240" r="13"/><text class="key" x="530" y="244">2</text>
  <circle class="node" cx="492" cy="285" r="13"/><text class="key" x="492" y="289">1</text>
  <circle class="node" cx="568" cy="285" r="13"/><text class="key" x="568" y="289">3</text>
  <text class="bfok" x="530" y="322" text-anchor="middle">balanced: bf = 0</text>
</svg>

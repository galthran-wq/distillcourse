<svg viewBox="0 0 640 230" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .name { fill: currentColor; text-anchor: end; }
  </style>
  <text class="label" x="24" y="26" font-weight="600">worst-case height, n = 10&#8310; keys</text>

  <text class="name" x="200" y="62">perfect balance</text>
  <rect x="210" y="48" width="57" height="20" rx="3" fill="#5aa46a" fill-opacity="0.85"/>
  <text class="label" x="275" y="62">19&#160;&#160;=&#160;&#8968;lg(n+1)&#8969; &#8722; 1</text>

  <text class="name" x="200" y="100">AVL</text>
  <rect x="210" y="86" width="84" height="20" rx="3" fill="#4c8dd6" fill-opacity="0.85"/>
  <text class="label" x="302" y="100">&#8804; 28&#160;&#160;(&#8776; 1.44 lg n)</text>

  <text class="name" x="200" y="138">red-black</text>
  <rect x="210" y="124" width="117" height="20" rx="3" fill="#e2903a" fill-opacity="0.85"/>
  <text class="label" x="335" y="138">&#8804; 39&#160;&#160;(&#8804; 2 lg(n+1))</text>

  <text class="name" x="200" y="176">plain BST, sorted input</text>
  <rect x="210" y="162" width="290" height="20" rx="3" fill="currentColor" fill-opacity="0.45"/>
  <path d="M505,158 L513,186 M513,158 L521,186" stroke="currentColor" stroke-width="2" fill="none"/>
  <text class="label" x="530" y="176">999,999</text>

  <text class="muted" x="24" y="212">bars to scale except the chain: drawn fully, it would run 3 km &#8212; 25,000&#215; the red-black bar</text>
</svg>

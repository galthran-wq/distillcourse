<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .edge { stroke: currentColor; stroke-width: 1.2; opacity: 0.75; }
    .node { fill: none; stroke: currentColor; stroke-width: 1.3; }
  </style>
  <text class="muted" x="24" y="22">smallest possible AVL trees: every node maximally tilted, one subtree a level deeper than its sibling</text>

  <!-- T1: 2 nodes -->
  <line class="edge" x1="60" y1="55" x2="40" y2="90"/>
  <circle class="node" cx="60" cy="55" r="9"/>
  <circle class="node" cx="40" cy="90" r="9"/>
  <text class="label" x="60" y="238" text-anchor="middle">h = 1:  N(1) = 2</text>

  <!-- T2: 4 nodes -->
  <line class="edge" x1="160" y1="55" x2="135" y2="90"/>
  <line class="edge" x1="160" y1="55" x2="185" y2="90"/>
  <line class="edge" x1="135" y1="90" x2="118" y2="125"/>
  <circle class="node" cx="160" cy="55" r="9"/>
  <circle class="node" cx="135" cy="90" r="9"/>
  <circle class="node" cx="185" cy="90" r="9"/>
  <circle class="node" cx="118" cy="125" r="9"/>
  <text class="label" x="160" y="238" text-anchor="middle">h = 2:  N(2) = 4</text>

  <!-- T3: 7 nodes -->
  <line class="edge" x1="300" y1="55" x2="260" y2="90"/>
  <line class="edge" x1="300" y1="55" x2="345" y2="90"/>
  <line class="edge" x1="260" y1="90" x2="235" y2="125"/>
  <line class="edge" x1="260" y1="90" x2="285" y2="125"/>
  <line class="edge" x1="235" y1="125" x2="220" y2="160"/>
  <line class="edge" x1="345" y1="90" x2="328" y2="125"/>
  <circle class="node" cx="300" cy="55" r="9"/>
  <circle class="node" cx="260" cy="90" r="9"/>
  <circle class="node" cx="345" cy="90" r="9"/>
  <circle class="node" cx="235" cy="125" r="9"/>
  <circle class="node" cx="285" cy="125" r="9"/>
  <circle class="node" cx="220" cy="160" r="9"/>
  <circle class="node" cx="328" cy="125" r="9"/>
  <text class="label" x="300" y="238" text-anchor="middle">h = 3:  N(3) = 7</text>

  <!-- T4: 12 nodes -->
  <rect x="378" y="60" width="146" height="135" rx="8" fill="#4c8dd6" fill-opacity="0.10" stroke="#4c8dd6" stroke-opacity="0.55" stroke-dasharray="4 4"/>
  <rect x="526" y="60" width="82" height="100" rx="8" fill="#e2903a" fill-opacity="0.10" stroke="#e2903a" stroke-opacity="0.55" stroke-dasharray="4 4"/>
  <line class="edge" x1="510" y1="40" x2="465" y2="75"/>
  <line class="edge" x1="510" y1="40" x2="570" y2="75"/>
  <line class="edge" x1="465" y1="75" x2="425" y2="110"/>
  <line class="edge" x1="465" y1="75" x2="505" y2="110"/>
  <line class="edge" x1="425" y1="110" x2="403" y2="145"/>
  <line class="edge" x1="425" y1="110" x2="447" y2="145"/>
  <line class="edge" x1="403" y1="145" x2="388" y2="180"/>
  <line class="edge" x1="505" y1="110" x2="490" y2="145"/>
  <line class="edge" x1="570" y1="75" x2="548" y2="110"/>
  <line class="edge" x1="570" y1="75" x2="592" y2="110"/>
  <line class="edge" x1="548" y1="110" x2="533" y2="145"/>
  <circle class="node" cx="510" cy="40" r="9"/>
  <circle class="node" cx="465" cy="75" r="9"/>
  <circle class="node" cx="570" cy="75" r="9"/>
  <circle class="node" cx="425" cy="110" r="9"/>
  <circle class="node" cx="505" cy="110" r="9"/>
  <circle class="node" cx="403" cy="145" r="9"/>
  <circle class="node" cx="447" cy="145" r="9"/>
  <circle class="node" cx="388" cy="180" r="9"/>
  <circle class="node" cx="490" cy="145" r="9"/>
  <circle class="node" cx="548" cy="110" r="9"/>
  <circle class="node" cx="592" cy="110" r="9"/>
  <circle class="node" cx="533" cy="145" r="9"/>
  <text x="450" y="210" text-anchor="middle" fill="#4c8dd6" font-size="11">N(3) = 7</text>
  <text x="567" y="210" text-anchor="middle" fill="#e2903a" font-size="11">N(2) = 4</text>
  <text class="label" x="498" y="238" text-anchor="middle">h = 4:  N(4) = 1 + 7 + 4 = 12</text>
</svg>

<svg viewBox="0 0 640 445" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .edge { stroke: currentColor; stroke-width: 1.3; opacity: 0.75; }
    .redlink { stroke: #e2903a; stroke-width: 2.6; }
    .node { fill: none; stroke: currentColor; stroke-width: 1.4; }
    .rednode { fill: #e2903a; fill-opacity: 0.18; stroke: #e2903a; stroke-width: 1.8; }
    .key { fill: currentColor; text-anchor: middle; }
    .box { fill: none; stroke: currentColor; stroke-width: 1.4; }
  </style>
  <defs>
    <marker id="ah3" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7" fill="none" stroke="currentColor" stroke-width="1.3"/>
    </marker>
  </defs>

  <text class="muted" x="24" y="22">red-black BST, red links drawn flat: a red node sits level with its parent</text>
  <line class="redlink" x1="410" y1="16" x2="440" y2="16"/>
  <text class="muted" x="448" y="20">red link (glue inside a node)</text>
  <line class="edge" x1="410" y1="34" x2="440" y2="34"/>
  <text class="muted" x="448" y="38">black link (a real edge)</text>

  <!-- top: LLRB -->
  <line class="edge" x1="320" y1="55" x2="230" y2="115"/>
  <line class="edge" x1="320" y1="55" x2="450" y2="115"/>
  <line class="redlink" x1="150" y1="115" x2="230" y2="115"/>
  <line class="edge" x1="230" y1="115" x2="285" y2="175"/>
  <line class="edge" x1="150" y1="115" x2="105" y2="175"/>
  <line class="edge" x1="150" y1="115" x2="190" y2="175"/>
  <line class="redlink" x1="40" y1="175" x2="105" y2="175"/>
  <line class="edge" x1="450" y1="115" x2="405" y2="175"/>
  <line class="edge" x1="450" y1="115" x2="545" y2="175"/>
  <line class="redlink" x1="480" y1="175" x2="545" y2="175"/>
  <circle class="node" cx="320" cy="55" r="14"/><text class="key" x="320" y="59">M</text>
  <circle class="node" cx="230" cy="115" r="14"/><text class="key" x="230" y="119">J</text>
  <circle class="rednode" cx="150" cy="115" r="14"/><text class="key" x="150" y="119">E</text>
  <circle class="node" cx="450" cy="115" r="14"/><text class="key" x="450" y="119">R</text>
  <circle class="rednode" cx="40" cy="175" r="14"/><text class="key" x="40" y="179">A</text>
  <circle class="node" cx="105" cy="175" r="14"/><text class="key" x="105" y="179">C</text>
  <circle class="node" cx="190" cy="175" r="14"/><text class="key" x="190" y="179">H</text>
  <circle class="node" cx="285" cy="175" r="14"/><text class="key" x="285" y="179">L</text>
  <circle class="node" cx="405" cy="175" r="14"/><text class="key" x="405" y="179">P</text>
  <circle class="rednode" cx="480" cy="175" r="14"/><text class="key" x="480" y="179">S</text>
  <circle class="node" cx="545" cy="175" r="14"/><text class="key" x="545" y="179">X</text>

  <!-- hoist arrow -->
  <line x1="320" y1="205" x2="320" y2="248" stroke="currentColor" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#ah3)"/>
  <text class="label" x="332" y="231">hoist each red node into its parent</text>

  <!-- bottom: 2-3 tree -->
  <rect class="box" x="303" y="255" width="34" height="28" rx="5"/><text class="key" x="320" y="273">M</text>
  <rect class="box" x="182" y="316" width="56" height="28" rx="5"/>
  <text class="key" x="198" y="334" fill="#e2903a">E</text><text class="key" x="222" y="334">J</text>
  <rect class="box" x="433" y="316" width="34" height="28" rx="5"/><text class="key" x="450" y="334">R</text>
  <rect class="box" x="47" y="386" width="56" height="28" rx="5"/>
  <text class="key" x="63" y="404" fill="#e2903a">A</text><text class="key" x="87" y="404">C</text>
  <rect class="box" x="168" y="386" width="34" height="28" rx="5"/><text class="key" x="185" y="404">H</text>
  <rect class="box" x="273" y="386" width="34" height="28" rx="5"/><text class="key" x="290" y="404">L</text>
  <rect class="box" x="388" y="386" width="34" height="28" rx="5"/><text class="key" x="405" y="404">P</text>
  <rect class="box" x="497" y="386" width="56" height="28" rx="5"/>
  <text class="key" x="513" y="404" fill="#e2903a">S</text><text class="key" x="537" y="404">X</text>
  <line class="edge" x1="312" y1="283" x2="215" y2="316"/>
  <line class="edge" x1="328" y1="283" x2="450" y2="316"/>
  <line class="edge" x1="188" y1="344" x2="75" y2="386"/>
  <line class="edge" x1="210" y1="344" x2="185" y2="386"/>
  <line class="edge" x1="232" y1="344" x2="290" y2="386"/>
  <line class="edge" x1="441" y1="344" x2="405" y2="386"/>
  <line class="edge" x1="459" y1="344" x2="525" y2="386"/>

  <text class="muted" x="320" y="436" text-anchor="middle">the same keys as a 2-3 tree: every leaf at depth 2 &#8212; the black links alone are perfectly balanced</text>
</svg>

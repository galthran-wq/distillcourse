<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .edge { stroke: currentColor; stroke-width: 1.3; opacity: 0.75; }
    .pivot { stroke: #e2903a; stroke-width: 2.4; }
    .node { fill: none; stroke: currentColor; stroke-width: 1.4; }
    .key { fill: currentColor; text-anchor: middle; }
    .tri { fill: none; stroke: currentColor; stroke-width: 1.2; opacity: 0.8; }
    .triB { fill: #4c8dd6; fill-opacity: 0.14; stroke: #4c8dd6; stroke-width: 1.4; }
    .arrow { stroke: currentColor; stroke-width: 1.4; fill: none; }
  </style>
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7" fill="none" stroke="currentColor" stroke-width="1.3"/>
    </marker>
  </defs>

  <!-- BEFORE: y above x -->
  <line class="pivot" x1="185" y1="55" x2="110" y2="120"/>
  <line class="edge" x1="185" y1="55" x2="255" y2="115"/>
  <line class="edge" x1="110" y1="120" x2="65" y2="177"/>
  <line class="edge" x1="110" y1="120" x2="155" y2="177"/>
  <polygon class="tri" points="65,177 40,228 90,228"/>
  <polygon class="triB" points="155,177 130,228 180,228"/>
  <polygon class="tri" points="255,115 227,168 283,168"/>
  <circle class="node" cx="185" cy="55" r="15"/><text class="key" x="185" y="59">y</text>
  <circle class="node" cx="110" cy="120" r="15"/><text class="key" x="110" y="124">x</text>
  <text class="key" x="65" y="215">A</text>
  <text class="key" x="155" y="215" fill="#4c8dd6">B</text>
  <text class="key" x="255" y="152">C</text>
  <text class="muted" x="63" y="245" text-anchor="middle">&lt; x</text>
  <text class="muted" x="155" y="245" text-anchor="middle">x..y</text>
  <text class="muted" x="255" y="185" text-anchor="middle">&gt; y</text>
  <text class="muted" x="160" y="278" text-anchor="middle">in-order:  A · x · B · y · C</text>

  <!-- arrows between panels -->
  <line class="arrow" x1="288" y1="112" x2="350" y2="112" marker-end="url(#ah)"/>
  <text class="muted" x="319" y="98" text-anchor="middle">right at y</text>
  <line class="arrow" x1="350" y1="150" x2="288" y2="150" marker-end="url(#ah)"/>
  <text class="muted" x="319" y="176" text-anchor="middle">left at x</text>

  <!-- AFTER: x above y -->
  <line class="pivot" x1="440" y1="55" x2="515" y2="120"/>
  <line class="edge" x1="440" y1="55" x2="380" y2="115"/>
  <line class="edge" x1="515" y1="120" x2="480" y2="177"/>
  <line class="edge" x1="515" y1="120" x2="570" y2="177"/>
  <polygon class="tri" points="380,115 352,168 408,168"/>
  <polygon class="triB" points="480,177 455,228 505,228"/>
  <polygon class="tri" points="570,177 545,228 595,228"/>
  <circle class="node" cx="440" cy="55" r="15"/><text class="key" x="440" y="59">x</text>
  <circle class="node" cx="515" cy="120" r="15"/><text class="key" x="515" y="124">y</text>
  <text class="key" x="380" y="152">A</text>
  <text class="key" x="480" y="215" fill="#4c8dd6">B</text>
  <text class="key" x="570" y="215">C</text>
  <text class="muted" x="480" y="278" text-anchor="middle">in-order:  A · x · B · y · C</text>

  <text class="muted" x="320" y="20" text-anchor="middle">only B changes parent (its keys lie between x and y, so either parent is legal)</text>
</svg>

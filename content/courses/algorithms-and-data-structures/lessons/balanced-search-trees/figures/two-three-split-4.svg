<svg viewBox="0 0 640 270" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .edge { stroke: currentColor; stroke-width: 1.3; opacity: 0.75; }
    .box { fill: none; stroke: currentColor; stroke-width: 1.4; }
    .hot { fill: #e2903a; fill-opacity: 0.15; stroke: #e2903a; stroke-width: 2; }
    .key { fill: currentColor; text-anchor: middle; }
    .amber { fill: #e2903a; text-anchor: middle; font-weight: 600; }
    .path { stroke: #e2903a; stroke-width: 2; stroke-dasharray: 4 4; fill: none; }
  </style>
  <defs>
    <marker id="ts4" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7" fill="none" stroke="#e2903a" stroke-width="1.5"/>
    </marker>
  </defs>
  <text class="label" x="24" y="20" font-weight="600">the root overflows and splits: N becomes a new root</text>

  <line class="edge" x1="312" y1="54" x2="210" y2="104"/>
  <line class="edge" x1="328" y1="54" x2="430" y2="104"/>
  <line class="edge" x1="202" y1="132" x2="140" y2="188"/>
  <line class="edge" x1="218" y1="132" x2="280" y2="188"/>
  <line class="edge" x1="422" y1="132" x2="360" y2="188"/>
  <line class="edge" x1="438" y1="132" x2="500" y2="188"/>

  <line class="path" x1="352" y1="100" x2="336" y2="62" marker-end="url(#ts4)"/>

  <rect class="hot" x="303" y="26" width="34" height="28" rx="5"/>
  <text class="amber" x="320" y="44">N</text>

  <rect class="box" x="193" y="104" width="34" height="28" rx="5"/>
  <text class="key" x="210" y="122">J</text>
  <rect class="box" x="413" y="104" width="34" height="28" rx="5"/>
  <text class="key" x="430" y="122">R</text>

  <rect class="box" x="112" y="188" width="56" height="28" rx="5"/>
  <text class="key" x="128" y="206">A</text><text class="key" x="152" y="206">C</text>
  <rect class="box" x="263" y="188" width="34" height="28" rx="5"/>
  <text class="key" x="280" y="206">L</text>
  <rect class="box" x="343" y="188" width="34" height="28" rx="5"/>
  <text class="key" x="360" y="206">P</text>
  <rect class="box" x="472" y="188" width="56" height="28" rx="5"/>
  <text class="key" x="488" y="206">S</text><text class="key" x="512" y="206">X</text>

  <text class="muted" x="24" y="258">growth happens at the root, never at the leaves</text>
</svg>

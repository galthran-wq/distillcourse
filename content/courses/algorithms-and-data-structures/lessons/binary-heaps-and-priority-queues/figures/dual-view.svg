<svg viewBox="0 0 640 312" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .idx { fill: currentColor; opacity: 0.55; font-size: 10px; text-anchor: middle; }
    .edge { stroke: currentColor; stroke-width: 1.3; opacity: 0.75; }
    .node { fill: none; stroke: currentColor; stroke-width: 1.4; }
    .key { fill: currentColor; text-anchor: middle; }
    .box { fill: none; stroke: currentColor; stroke-width: 1.3; }
    .amber { stroke: #e2903a; stroke-width: 2; fill: #e2903a; fill-opacity: 0.12; }
    .blue { stroke: #4c8dd6; stroke-width: 2; fill: #4c8dd6; fill-opacity: 0.12; }
  </style>

  <text class="muted" x="24" y="20">left(i) = 2i + 1&#160;&#160;&#160;&#160;right(i) = 2i + 2&#160;&#160;&#160;&#160;parent(i) = &#8970;(i&#8722;1)/2&#8971;</text>

  <!-- edges -->
  <line class="edge" x1="320" y1="46" x2="176" y2="95"/>
  <line class="edge" x1="320" y1="46" x2="464" y2="95"/>
  <line class="edge" x1="176" y1="95" x2="104" y2="150"/>
  <line class="edge" x1="176" y1="95" x2="248" y2="150"/>
  <line class="edge" x1="464" y1="95" x2="392" y2="150"/>
  <line class="edge" x1="464" y1="95" x2="536" y2="150"/>
  <line class="edge" x1="104" y1="150" x2="68" y2="205"/>
  <line class="edge" x1="104" y1="150" x2="140" y2="205"/>
  <line class="edge" x1="248" y1="150" x2="212" y2="205"/>

  <!-- nodes -->
  <circle class="node" cx="320" cy="46" r="16"/><text class="key" x="320" y="50">11</text>
  <circle class="node" cx="176" cy="95" r="16"/><text class="key" x="176" y="99">26</text>
  <circle class="amber" cx="464" cy="95" r="16"/><text class="key" x="464" y="99">20</text>
  <circle class="node" cx="104" cy="150" r="16"/><text class="key" x="104" y="154">32</text>
  <circle class="node" cx="248" cy="150" r="16"/><text class="key" x="248" y="154">29</text>
  <circle class="blue" cx="392" cy="150" r="16"/><text class="key" x="392" y="154">50</text>
  <circle class="blue" cx="536" cy="150" r="16"/><text class="key" x="536" y="154">41</text>
  <circle class="node" cx="68" cy="205" r="16"/><text class="key" x="68" y="209">91</text>
  <circle class="node" cx="140" cy="205" r="16"/><text class="key" x="140" y="209">65</text>
  <circle class="node" cx="212" cy="205" r="16"/><text class="key" x="212" y="209">72</text>

  <!-- node indices (diagonal placement avoids edges) -->
  <text class="idx" x="320" y="20">0</text>
  <text class="idx" x="156" y="79">1</text>
  <text class="idx" x="486" y="79">2</text>
  <text class="idx" x="84" y="134">3</text>
  <text class="idx" x="268" y="134">4</text>
  <text class="idx" x="370" y="134">5</text>
  <text class="idx" x="558" y="134">6</text>
  <text class="idx" x="48" y="189">7</text>
  <text class="idx" x="162" y="189">8</text>
  <text class="idx" x="192" y="189">9</text>

  <!-- array strip -->
  <rect class="box" x="120" y="252" width="40" height="32"/><text class="key" x="140" y="273">11</text>
  <rect class="box" x="160" y="252" width="40" height="32"/><text class="key" x="180" y="273">26</text>
  <rect class="amber" x="200" y="252" width="40" height="32"/><text class="key" x="220" y="273">20</text>
  <rect class="box" x="240" y="252" width="40" height="32"/><text class="key" x="260" y="273">32</text>
  <rect class="box" x="280" y="252" width="40" height="32"/><text class="key" x="300" y="273">29</text>
  <rect class="blue" x="320" y="252" width="40" height="32"/><text class="key" x="340" y="273">50</text>
  <rect class="blue" x="360" y="252" width="40" height="32"/><text class="key" x="380" y="273">41</text>
  <rect class="box" x="400" y="252" width="40" height="32"/><text class="key" x="420" y="273">91</text>
  <rect class="box" x="440" y="252" width="40" height="32"/><text class="key" x="460" y="273">65</text>
  <rect class="box" x="480" y="252" width="40" height="32"/><text class="key" x="500" y="273">72</text>
  <text class="idx" x="140" y="300">0</text>
  <text class="idx" x="180" y="300">1</text>
  <text class="idx" x="220" y="300">2</text>
  <text class="idx" x="260" y="300">3</text>
  <text class="idx" x="300" y="300">4</text>
  <text class="idx" x="340" y="300">5</text>
  <text class="idx" x="380" y="300">6</text>
  <text class="idx" x="420" y="300">7</text>
  <text class="idx" x="460" y="300">8</text>
  <text class="idx" x="500" y="300">9</text>

  <!-- index-arithmetic arcs from box 2 to boxes 5 and 6 -->
  <path d="M 220 250 Q 280 226 336 248" fill="none" stroke="#e2903a" stroke-width="1.4"/>
  <path d="M 337 249 L 327 243 L 326 250 Z" fill="#e2903a"/>
  <path d="M 222 248 Q 310 212 376 246" fill="none" stroke="#e2903a" stroke-width="1.4"/>
  <path d="M 377 247 L 367 241 L 366 248 Z" fill="#e2903a"/>
  <text x="252" y="230" fill="#e2903a" font-size="10">2&#183;2+1 = 5</text>
  <text x="322" y="212" fill="#e2903a" font-size="10">2&#183;2+2 = 6</text>
</svg>

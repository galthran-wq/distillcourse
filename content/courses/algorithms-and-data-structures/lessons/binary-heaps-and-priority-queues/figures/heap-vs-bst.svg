<svg viewBox="0 0 640 250" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .edge { stroke: currentColor; stroke-width: 1.3; opacity: 0.75; }
    .node { fill: none; stroke: currentColor; stroke-width: 1.4; }
    .key { fill: currentColor; text-anchor: middle; }
  </style>

  <text class="label" x="150" y="24" text-anchor="middle">min-heap: parent &#8804; children</text>
  <text class="label" x="480" y="24" text-anchor="middle">BST: left &lt; node &lt; right</text>

  <!-- left panel: min-heap on 11, 20, 26, 29, 32 -->
  <rect x="30" y="96" width="210" height="102" rx="8" fill="#e2903a" fill-opacity="0.10" stroke="#e2903a" stroke-opacity="0.55" stroke-dasharray="4 4"/>
  <line class="edge" x1="150" y1="62" x2="95" y2="117"/>
  <line class="edge" x1="150" y1="62" x2="205" y2="117"/>
  <line class="edge" x1="95" y1="117" x2="62" y2="172"/>
  <line class="edge" x1="95" y1="117" x2="130" y2="172"/>
  <circle class="node" cx="150" cy="62" r="16"/><text class="key" x="150" y="66">11</text>
  <circle class="node" cx="95" cy="117" r="16"/><text class="key" x="95" y="121">20</text>
  <circle class="node" cx="205" cy="117" r="16"/><text class="key" x="205" y="121">26</text>
  <circle class="node" cx="62" cy="172" r="16"/><text class="key" x="62" y="176">29</text>
  <circle class="node" cx="130" cy="172" r="16"/><text class="key" x="130" y="176">32</text>
  <text x="135" y="216" text-anchor="middle" fill="#e2903a" font-size="11">every key here &#8805; 11, nothing more</text>
  <text class="muted" x="135" y="238" text-anchor="middle">20 | 26 unordered; 29 could hang under 26 instead</text>

  <!-- right panel: BST on the same keys -->
  <rect x="366" y="96" width="102" height="102" rx="8" fill="#4c8dd6" fill-opacity="0.10" stroke="#4c8dd6" stroke-opacity="0.55" stroke-dasharray="4 4"/>
  <rect x="502" y="96" width="106" height="102" rx="8" fill="#e2903a" fill-opacity="0.10" stroke="#e2903a" stroke-opacity="0.55" stroke-dasharray="4 4"/>
  <line class="edge" x1="480" y1="62" x2="425" y2="117"/>
  <line class="edge" x1="480" y1="62" x2="535" y2="117"/>
  <line class="edge" x1="425" y1="117" x2="392" y2="172"/>
  <line class="edge" x1="535" y1="117" x2="568" y2="172"/>
  <circle class="node" cx="480" cy="62" r="16"/><text class="key" x="480" y="66">26</text>
  <circle class="node" cx="425" cy="117" r="16"/><text class="key" x="425" y="121">20</text>
  <circle class="node" cx="535" cy="117" r="16"/><text class="key" x="535" y="121">29</text>
  <circle class="node" cx="392" cy="172" r="16"/><text class="key" x="392" y="176">11</text>
  <circle class="node" cx="568" cy="172" r="16"/><text class="key" x="568" y="176">32</text>
  <text x="417" y="216" text-anchor="middle" fill="#4c8dd6" font-size="11">&lt; 26</text>
  <text x="555" y="216" text-anchor="middle" fill="#e2903a" font-size="11">&gt; 26</text>
  <text class="muted" x="480" y="238" text-anchor="middle">every pair ordered through some ancestor</text>
</svg>

<svg viewBox="0 0 640 272" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .bar { fill: none; stroke: currentColor; stroke-width: 1.3; }
    .inbar { fill: currentColor; text-anchor: middle; font-size: 11px; }
    .row { fill: currentColor; font-size: 11px; }
  </style>

  <text class="muted" x="24" y="20">a complete tree, one bar per level, bar width &#8733; node count</text>

  <!-- level bars, bottom-up -->
  <rect class="bar" x="190" y="60" width="20" height="24" rx="3"/>
  <text class="inbar" x="200" y="52">&#8942;</text>
  <rect class="bar" x="180" y="94" width="40" height="24" rx="3"/>
  <text class="inbar" x="200" y="110">&#8804; n/16</text>
  <rect class="bar" x="160" y="128" width="80" height="24" rx="3"/>
  <text class="inbar" x="200" y="144">&#8804; n/8</text>
  <rect class="bar" x="120" y="162" width="160" height="24" rx="3"/>
  <text class="inbar" x="200" y="178">&#8804; n/4 nodes</text>
  <rect class="bar" x="40" y="196" width="320" height="24" rx="3"/>
  <text class="inbar" x="200" y="212">&#8804; n/2 nodes (the leaves)</text>

  <!-- height axis -->
  <text class="muted" x="28" y="77">h</text>
  <text class="muted" x="160" y="110" text-anchor="end">3</text>
  <text class="muted" x="140" y="144" text-anchor="end">2</text>
  <text class="muted" x="100" y="178" text-anchor="end">1</text>
  <text class="muted" x="28" y="212">0</text>

  <!-- per-level sift cost and product -->
  <text class="row" x="390" y="77">sift &#8804; &#8970;lg n&#8971;, but only 1 node</text>
  <text class="row" x="390" y="110">sift &#8804; 3&#160;&#160;&#8594;&#160;&#160;3n/16</text>
  <text class="row" x="390" y="144">sift &#8804; 2&#160;&#160;&#8594;&#160;&#160;n/4</text>
  <text class="row" x="390" y="178">sift &#8804; 1&#160;&#160;&#8594;&#160;&#160;n/4</text>
  <text class="row" x="390" y="212">sift = 0&#160;&#160;&#8594;&#160;&#160;0</text>

  <text x="40" y="250" fill="#e2903a">total swaps &#8804; 0 + n/4 + n/4 + 3n/16 + &#8943; = n &#183; &#931;&#8342; h/2&#688;&#8314;&#185; = n</text>
  <text class="muted" x="40" y="268">(integer rounding of the counts at most doubles this: &#8804; 2n, still linear)</text>
</svg>

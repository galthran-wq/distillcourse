<svg viewBox="0 0 640 248" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .edge { stroke: currentColor; stroke-width: 1.3; opacity: 0.75; }
    .node { fill: none; stroke: currentColor; stroke-width: 1.4; }
    .key { fill: currentColor; text-anchor: middle; }
    .row { fill: currentColor; font-size: 11px; }
  </style>

  <text class="muted" x="24" y="22">keep the k = 4 largest seen so far: a min-heap of the champions</text>

  <!-- stream -->
  <text class="muted" x="24" y="66">stream</text>
  <text class="key" x="16" y="94">&#8943;</text>
  <rect class="node" x="30" y="76" width="34" height="26" rx="4"/>
  <text class="key" x="47" y="93">33</text>
  <rect x="72" y="76" width="34" height="26" rx="4" fill="none" stroke="#4c8dd6" stroke-width="1.6"/>
  <text class="key" x="89" y="93">58</text>

  <!-- arrow from 58 to the root -->
  <line x1="110" y1="89" x2="266" y2="89" stroke="#4c8dd6" stroke-width="1.4"/>
  <polygon points="274,89 264,84 264,94" fill="#4c8dd6"/>

  <!-- champion heap [41, 65, 72, 91] -->
  <line class="edge" x1="285" y1="101.5" x2="258" y2="135.5"/>
  <line class="edge" x1="305" y1="101.5" x2="332" y2="135.5"/>
  <line class="edge" x1="240" y1="162" x2="224" y2="190"/>
  <circle cx="295" cy="89" r="16" fill="none" stroke="#e2903a" stroke-width="1.6"/>
  <text class="key" x="295" y="93">41</text>
  <circle class="node" cx="248" cy="148" r="16"/><text class="key" x="248" y="152">65</text>
  <circle class="node" cx="342" cy="148" r="16"/><text class="key" x="342" y="152">72</text>
  <circle class="node" cx="216" cy="204" r="16"/><text class="key" x="216" y="208">91</text>
  <text x="295" y="52" text-anchor="middle" fill="#e2903a" font-size="11">root = weakest champion</text>

  <!-- outcomes -->
  <text class="row" x="412" y="84" fill="#4c8dd6">58 &gt; 41: evict the root, put 58 there,</text>
  <text class="row" x="412" y="102" fill="#4c8dd6">sift down &#8594; champions [58, 65, 72, 91]</text>
  <text class="row" x="412" y="144">33 &#8804; 41: not a champion &#8212;</text>
  <text class="row" x="412" y="162">discarded after one comparison</text>
  <text class="muted" x="412" y="204">the loser 41 was never among</text>
  <text class="muted" x="412" y="220">the 4 largest of the full stream</text>

  <text x="24" y="242" fill="#e2903a">every item meets only the root: O(n log k) time, O(k) memory for the k largest of n items</text>
</svg>

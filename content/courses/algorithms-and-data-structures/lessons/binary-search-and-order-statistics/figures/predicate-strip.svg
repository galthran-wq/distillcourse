<rect x="246" y="44" width="34" height="30" rx="3" fill="#4c8dd6" fill-opacity="0.12" stroke="#4c8dd6" stroke-opacity="0.7"/><text x="263" y="64" text-anchor="middle" fill="#4c8dd6">F</text>
<rect x="283" y="44" width="34" height="30" rx="3" fill="#4c8dd6" fill-opacity="0.12" stroke="#4c8dd6" stroke-opacity="0.7"/><text x="300" y="64" text-anchor="middle" fill="#4c8dd6">F</text>
<rect x="320" y="44" width="34" height="30" rx="3" fill="#4c8dd6" fill-opacity="0.12" stroke="#4c8dd6" stroke-opacity="0.7"/><text x="337" y="64" text-anchor="middle" fill="#4c8dd6">F</text>

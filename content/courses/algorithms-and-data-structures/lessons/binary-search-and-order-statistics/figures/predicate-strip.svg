<svg viewBox="0 0 640 236" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12.5">
<style>.label { fill: currentColor; } .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }</style>

<text class="label" x="24" y="26" font-weight="600">a monotone predicate: F once flipped to T, stays T</text>

<!-- predicate strip: 16 cells, F for 1..10 (blue), T for 11..16 (amber) -->
<!-- pitch 37, w 34, x(i) = 24 + (i-1)*37 -->
<rect x="24" y="44" width="34" height="30" rx="3" fill="#4c8dd6" fill-opacity="0.12" stroke="#4c8dd6" stroke-opacity="0.7"/><text x="41" y="64" text-anchor="middle" fill="#4c8dd6">F</text>

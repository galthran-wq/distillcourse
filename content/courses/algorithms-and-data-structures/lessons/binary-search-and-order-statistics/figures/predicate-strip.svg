<rect x="505" y="152" width="34" height="30" rx="3" fill="none" stroke="currentColor" stroke-opacity="0.35"/><text x="522" y="172" text-anchor="middle" fill="currentColor" opacity="0.6" font-size="11">80</text>
<rect x="542" y="152" width="34" height="30" rx="3" fill="none" stroke="currentColor" stroke-opacity="0.35"/><text x="559" y="172" text-anchor="middle" fill="currentColor" opacity="0.6" font-size="11">89</text>

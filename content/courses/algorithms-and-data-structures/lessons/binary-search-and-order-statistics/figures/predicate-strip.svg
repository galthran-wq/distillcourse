<rect x="431" y="44" width="34" height="30" rx="3" fill="#e2903a" fill-opacity="0.12" stroke="#e2903a" stroke-opacity="0.8"/><text x="448" y="64" text-anchor="middle" fill="#e2903a">T</text>

<!-- flip-point marker -->
<path d="M 411 92 L 406 82 L 416 82 Z" fill="#e2903a"/>
<text x="411" y="107" text-anchor="middle" fill="#e2903a" font-weight="600" font-size="11.5">first T — what FirstTrue returns</text>

<!-- the special case: array row aligned below -->
<text class="label" x="24" y="140" font-weight="600">the special case that is sorted-array lookup: f(i) := A[i] ≥ 61</text>

<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12.5">
<style>.label { fill: currentColor; } .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }</style>

<text class="label" x="24" y="24" font-weight="700" font-size="14">The module's price list, n keys</text>

<!-- header -->
<text class="muted" x="24" y="52">question</text>
<text class="muted" x="330" y="52">cost</text>
<text class="muted" x="504" y="52">established in</text>
<line x1="24" y1="60" x2="616" y2="60" stroke="currentColor" stroke-opacity="0.5"/>

<!-- row 1 -->
<text class="label" x="24" y="82">is x here? (unsorted array)</text>
<text class="label" x="330" y="82">Θ(n) scan</text>
<text class="muted" x="504" y="82">elementary structures</text>
<line x1="24" y1="92" x2="616" y2="92" stroke="currentColor" stroke-opacity="0.18"/>

<!-- row 2 -->
<text class="label" x="24" y="114">put in order (comparisons)</text>
<text class="label" x="330" y="114">Θ(n lg n), tight both ways</text>
<text class="muted" x="504" y="114">sorting lessons</text>
<line x1="24" y1="124" x2="616" y2="124" stroke="currentColor" stroke-opacity="0.18"/>

<!-- row 3 -->
<text class="label" x="24" y="146">put in order (integer keys &lt; nᶜ)</text>
<text class="label" x="330" y="146">Θ(cn), no comparisons</text>
<text class="muted" x="504" y="146">counting/radix sort</text>
<line x1="24" y1="156" x2="616" y2="156" stroke="currentColor" stroke-opacity="0.18"/>

<!-- row 4 (this lesson, amber accent bar) -->
<rect x="16" y="164" width="3.5" height="26" rx="1.5" fill="#e2903a"/>
<text class="label" x="24" y="180">is x here? (sorted array)</text>
<text class="label" x="330" y="180">Θ(lg n), optimal per query</text>
<text class="muted" x="504" y="180">this lesson</text>
<line x1="24" y1="190" x2="616" y2="190" stroke="currentColor" stroke-opacity="0.18"/>

<!-- row 5 -->
<rect x="16" y="198" width="3.5" height="26" rx="1.5" fill="#e2903a"/>
<text class="label" x="24" y="214">minimum</text>
<text class="label" x="330" y="214">exactly n − 1 comparisons</text>
<text class="muted" x="504" y="214">this lesson</text>
<line x1="24" y1="224" x2="616" y2="224" stroke="currentColor" stroke-opacity="0.18"/>

<!-- row 6 -->
<rect x="16" y="232" width="3.5" height="26" rx="1.5" fill="#e2903a"/>
<text class="label" x="24" y="248">k-th smallest, any k</text>
<text class="label" x="330" y="248">expected Θ(n), quickselect</text>
<text class="muted" x="504" y="248">this lesson</text>
<line x1="24" y1="258" x2="616" y2="258" stroke="currentColor" stroke-opacity="0.18"/>

<!-- row 7 -->
<text class="label" x="24" y="280">k-th smallest, guaranteed</text>
<text class="label" x="330" y="280">worst-case Θ(n) exists</text>
<text class="muted" x="504" y="280">optional extra lesson</text>
</svg>

<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
<style>.label { fill: currentColor; } .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }</style>

<!-- edges: root (300,42) -> (150,96)/(450,96) -> (75,150)/(225,150)/(375,150)/(525,150) -> leaves y 204 -->
<g stroke="currentColor" stroke-opacity="0.45" stroke-width="1.2">
<line x1="300" y1="42" x2="150" y2="96"/><line x1="300" y1="42" x2="450" y2="96"/>
<line x1="150" y1="96" x2="75" y2="150"/><line x1="150" y1="96" x2="225" y2="150"/>
<line x1="450" y1="96" x2="375" y2="150"/><line x1="450" y1="96" x2="525" y2="150"/>
<line x1="75" y1="150" x2="40" y2="204"/><line x1="75" y1="150" x2="110" y2="204"/>
<line x1="225" y1="150" x2="190" y2="204"/><line x1="225" y1="150" x2="260" y2="204"/>
<line x1="375" y1="150" x2="340" y2="204"/><line x1="375" y1="150" x2="410" y2="204"/>
<line x1="525" y1="150" x2="490" y2="204"/><line x1="525" y1="150" x2="560" y2="204"/>
</g>

<!-- internal nodes: comparisons, two outcomes each -->
<g>
<circle cx="300" cy="42" r="14" fill="none" stroke="currentColor" stroke-width="1.4"/><text class="label" x="300" y="46" text-anchor="middle" font-size="11">≤?</text>
<circle cx="150" cy="96" r="14" fill="none" stroke="currentColor" stroke-width="1.4"/><text class="label" x="150" y="100" text-anchor="middle" font-size="11">≤?</text>
<circle cx="450" cy="96" r="14" fill="none" stroke="currentColor" stroke-width="1.4"/><text class="label" x="450" y="100" text-anchor="middle" font-size="11">≤?</text>
<circle cx="75" cy="150" r="14" fill="none" stroke="currentColor" stroke-width="1.4"/><text class="label" x="75" y="154" text-anchor="middle" font-size="11">≤?</text>
<circle cx="225" cy="150" r="14" fill="none" stroke="currentColor" stroke-width="1.4"/><text class="label" x="225" y="154" text-anchor="middle" font-size="11">≤?</text>
<circle cx="375" cy="150" r="14" fill="none" stroke="currentColor" stroke-width="1.4"/><text class="label" x="375" y="154" text-anchor="middle" font-size="11">≤?</text>
<circle cx="525" cy="150" r="14" fill="none" stroke="currentColor" stroke-width="1.4"/><text class="label" x="525" y="154" text-anchor="middle" font-size="11">≤?</text>
</g>

<!-- 8 outcome leaves: found at 1..7, absent -->
<g>
<rect x="18" y="204" width="44" height="24" rx="4" fill="#e2903a" fill-opacity="0.14" stroke="#e2903a"/><text x="40" y="220" text-anchor="middle" fill="#e2903a" font-size="11">at 1</text>
<rect x="88" y="204" width="44" height="24" rx="4" fill="#e2903a" fill-opacity="0.14" stroke="#e2903a"/><text x="110" y="220" text-anchor="middle" fill="#e2903a" font-size="11">at 2</text>
<rect x="168" y="204" width="44" height="24" rx="4" fill="#e2903a" fill-opacity="0.14" stroke="#e2903a"/><text x="190" y="220" text-anchor="middle" fill="#e2903a" font-size="11">at 3</text>
<rect x="238" y="204" width="44" height="24" rx="4" fill="#e2903a" fill-opacity="0.14" stroke="#e2903a"/><text x="260" y="220" text-anchor="middle" fill="#e2903a" font-size="11">at 4</text>
<rect x="318" y="204" width="44" height="24" rx="4" fill="#e2903a" fill-opacity="0.14" stroke="#e2903a"/><text x="340" y="220" text-anchor="middle" fill="#e2903a" font-size="11">at 5</text>
<rect x="388" y="204" width="44" height="24" rx="4" fill="#e2903a" fill-opacity="0.14" stroke="#e2903a"/><text x="410" y="220" text-anchor="middle" fill="#e2903a" font-size="11">at 6</text>
<rect x="468" y="204" width="44" height="24" rx="4" fill="#e2903a" fill-opacity="0.14" stroke="#e2903a"/><text x="490" y="220" text-anchor="middle" fill="#e2903a" font-size="11">at 7</text>
<rect x="536" y="204" width="52" height="24" rx="4" fill="#4c8dd6" fill-opacity="0.14" stroke="#4c8dd6"/><text x="562" y="220" text-anchor="middle" fill="#4c8dd6" font-size="11">absent</text>
</g>

<!-- depth ruler -->
<g>
<line x1="616" y1="42" x2="616" y2="204" stroke="currentColor" stroke-opacity="0.4" stroke-dasharray="3 3"/>
<text class="muted" x="628" y="46" text-anchor="middle">0</text>
<text class="muted" x="628" y="100" text-anchor="middle">1</text>
<text class="muted" x="628" y="154" text-anchor="middle">2</text>
<text class="muted" x="628" y="208" text-anchor="middle">3</text>
</g>

<text class="label" x="300" y="250" text-anchor="middle">n = 7 cells: 8 distinct verdicts need 8 leaves, and 8 leaves force depth ≥ lg 8 = 3</text>
</svg>

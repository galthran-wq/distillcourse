<svg viewBox="0 0 640 252" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
<style>.label { fill: currentColor; } .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }</style>

<text class="label" x="36" y="22" font-weight="600">work per partition, n = 64, every pivot in the middle half</text>

<!-- bars: 64, 48, 36, 27, 20.25, 15.19, 11.39, 8.54, 6.41, then dots; scale 1.9 px/unit, baseline y=200 -->
<g fill="#e2903a" fill-opacity="0.55">
<rect x="36" y="78.4" width="32" height="121.6"/>
<rect x="80" y="108.8" width="32" height="91.2"/>
<rect x="124" y="131.6" width="32" height="68.4"/>
<rect x="168" y="148.7" width="32" height="51.3"/>
<rect x="212" y="161.5" width="32" height="38.5"/>
<rect x="256" y="171.1" width="32" height="28.9"/>
<rect x="300" y="178.4" width="32" height="21.6"/>
<rect x="344" y="183.8" width="32" height="16.2"/>
<rect x="388" y="187.8" width="32" height="12.2"/>
</g>
<text class="muted" x="436" y="196">⋯</text>
<line x1="30" y1="200" x2="470" y2="200" stroke="currentColor" stroke-opacity="0.5"/>

<text class="muted" x="52" y="216" text-anchor="middle">64</text>
<text class="muted" x="96" y="216" text-anchor="middle">48</text>
<text class="muted" x="140" y="216" text-anchor="middle">36</text>
<text class="muted" x="184" y="216" text-anchor="middle">27</text>
<text class="muted" x="228" y="216" text-anchor="middle">20¼</text>
<text class="muted" x="272" y="216" text-anchor="middle">15.2</text>
<text class="muted" x="316" y="216" text-anchor="middle">11.4</text>
<text class="muted" x="360" y="216" text-anchor="middle">8.5</text>
<text class="muted" x="404" y="216" text-anchor="middle">6.4</text>
<text class="muted" x="250" y="238" text-anchor="middle">each bar ≤ ¾ of the one before: a geometric series</text>

<!-- stacked total, scale 256 -> 176px, baseline 200, cap at y=24 -->
<g fill="#e2903a">
<rect x="520" y="156" width="48" height="44" fill-opacity="0.5"/>
<rect x="520" y="123" width="48" height="33" fill-opacity="0.32"/>

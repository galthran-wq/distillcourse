<rect x="520" y="24" width="48" height="13.2" fill-opacity="0.15"/>
</g>
<line x1="504" y1="24" x2="584" y2="24" stroke="#4c8dd6" stroke-width="1.6" stroke-dasharray="5 3"/>
<text x="544" y="16" text-anchor="middle" fill="#4c8dd6" font-weight="600" font-size="11.5">4n = 256</text>
<line x1="504" y1="200" x2="584" y2="200" stroke="currentColor" stroke-opacity="0.5"/>

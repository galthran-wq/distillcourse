<svg viewBox="0 0 730 240" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="11">
  <style>
    .label { fill: currentColor; font-size: 12px; font-weight: 600; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 10.5px; }
    .edge { stroke: currentColor; stroke-width: 1.2; opacity: 0.75; }
    .node { fill: none; stroke: currentColor; stroke-width: 1.3; }
    .gone { fill: none; stroke: #e2903a; stroke-width: 1.6; stroke-dasharray: 4 3; }
    .succ { fill: #5aa46a; fill-opacity: 0.2; stroke: #5aa46a; stroke-width: 1.6; }
    .key { fill: currentColor; text-anchor: middle; }
    .arrow { stroke: currentColor; stroke-width: 1.6; opacity: 0.7; }
  </style>

  <!-- panel a: leaf -->
  <text class="label" x="20" y="24">leaf: unlink</text>
  <line class="edge" x1="70" y1="70" x2="40" y2="125"/>
  <line class="edge" x1="70" y1="70" x2="100" y2="125"/>
  <circle class="node" cx="70" cy="70" r="13"/><text class="key" x="70" y="74">20</text>
  <circle class="gone" cx="40" cy="125" r="13"/><text class="key" x="40" y="129">11</text>
  <circle class="node" cx="100" cy="125" r="13"/><text class="key" x="100" y="129">29</text>
  <line class="arrow" x1="122" y1="95" x2="146" y2="95"/>
  <polygon points="146,95 138,91 138,99" fill="currentColor" opacity="0.7"/>
  <line class="edge" x1="172" y1="70" x2="202" y2="125"/>
  <circle class="node" cx="172" cy="70" r="13"/><text class="key" x="172" y="74">20</text>
  <circle class="node" cx="202" cy="125" r="13"/><text class="key" x="202" y="129">29</text>

  <line x1="222" y1="16" x2="222" y2="224" stroke="currentColor" opacity="0.2" stroke-dasharray="3 3"/>

  <!-- panel b: one child -->
  <text class="label" x="238" y="24">one child: splice the child up</text>
  <line class="edge" x1="288" y1="70" x2="258" y2="125"/>
  <line class="edge" x1="288" y1="70" x2="318" y2="125"/>
  <line class="edge" x1="318" y1="125" x2="293" y2="180"/>
  <circle class="node" cx="288" cy="70" r="13"/><text class="key" x="288" y="74">65</text>
  <circle class="node" cx="258" cy="125" r="13"/><text class="key" x="258" y="129">50</text>
  <circle class="gone" cx="318" cy="125" r="13"/><text class="key" x="318" y="129">91</text>
  <circle class="succ" cx="293" cy="180" r="13"/><text class="key" x="293" y="184">72</text>
  <line class="arrow" x1="342" y1="95" x2="366" y2="95"/>
  <polygon points="366,95 358,91 358,99" fill="currentColor" opacity="0.7"/>
  <line class="edge" x1="405" y1="70" x2="375" y2="125"/>
  <line class="edge" x1="405" y1="70" x2="435" y2="125"/>
  <circle class="node" cx="405" cy="70" r="13"/><text class="key" x="405" y="74">65</text>
  <circle class="node" cx="375" cy="125" r="13"/><text class="key" x="375" y="129">50</text>
  <circle class="succ" cx="435" cy="125" r="13"/><text class="key" x="435" y="129">72</text>

  <line x1="452" y1="16" x2="452" y2="224" stroke="currentColor" opacity="0.2" stroke-dasharray="3 3"/>

  <!-- panel c: two children -->
  <text class="label" x="466" y="24">two children: successor lifted</text>
  <line class="edge" x1="508" y1="70" x2="478" y2="125"/>
  <line class="edge" x1="508" y1="70" x2="538" y2="125"/>
  <line class="edge" x1="538" y1="125" x2="513" y2="180"/>
  <line class="edge" x1="538" y1="125" x2="565" y2="180"/>
  <circle class="gone" cx="508" cy="70" r="13"/><text class="key" x="508" y="74">20</text>
  <circle class="node" cx="478" cy="125" r="13"/><text class="key" x="478" y="129">11</text>
  <circle class="node" cx="538" cy="125" r="13"/><text class="key" x="538" y="129">29</text>
  <circle class="succ" cx="513" cy="180" r="13"/><text class="key" x="513" y="184">26</text>
  <circle class="node" cx="565" cy="180" r="13"/><text class="key" x="565" y="184">32</text>
  <text class="muted" x="513" y="206" text-anchor="middle">successor</text>
  <line class="arrow" x1="586" y1="95" x2="610" y2="95"/>
  <polygon points="610,95 602,91 602,99" fill="currentColor" opacity="0.7"/>
  <line class="edge" x1="652" y1="70" x2="622" y2="125"/>
  <line class="edge" x1="652" y1="70" x2="682" y2="125"/>
  <line class="edge" x1="682" y1="125" x2="704" y2="180"/>
  <circle class="succ" cx="652" cy="70" r="13"/><text class="key" x="652" y="74">26</text>
  <circle class="node" cx="622" cy="125" r="13"/><text class="key" x="622" y="129">11</text>
  <circle class="node" cx="682" cy="125" r="13"/><text class="key" x="682" y="129">29</text>
  <circle class="node" cx="704" cy="180" r="13"/><text class="key" x="704" y="184">32</text>
</svg>

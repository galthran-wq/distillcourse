  <line class="guide" x1="463" y1="121" x2="463" y2="304"/>
  <line class="guide" x1="520" y1="249" x2="520" y2="304"/>
  <line class="guide" x1="578" y1="185" x2="578" y2="304"/>

  <!-- nodes -->
  <circle class="node" cx="348" cy="40" r="17"/><text class="key" x="348" y="44">41</text>
  <circle class="node" cx="118" cy="104" r="17"/><text class="key" x="118" y="108">20</text>
  <circle class="node" cx="463" cy="104" r="17"/><text class="key" x="463" y="108">65</text>
  <circle class="node" cx="60" cy="168" r="17"/><text class="key" x="60" y="172">11</text>

  <circle class="node" cx="175" cy="232" r="17"/><text class="key" x="175" y="236">26</text>
  <circle class="node" cx="290" cy="232" r="17"/><text class="key" x="290" y="236">32</text>
  <circle class="node" cx="520" cy="232" r="17"/><text class="key" x="520" y="236">72</text>

  <!-- number line -->
  <text class="muted" x="40" y="296">in-order output</text>
  <line x1="36" y1="312" x2="606" y2="312" stroke="#e2903a" stroke-width="1.8"/>
  <polygon points="606,312 596,307 596,317" fill="#e2903a"/>

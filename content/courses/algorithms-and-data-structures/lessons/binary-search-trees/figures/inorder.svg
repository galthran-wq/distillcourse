    <line x1="348" y1="306" x2="348" y2="318"/>
    <line x1="405" y1="306" x2="405" y2="318"/>
    <line x1="463" y1="306" x2="463" y2="318"/>
    <line x1="520" y1="306" x2="520" y2="318"/>
    <line x1="578" y1="306" x2="578" y2="318"/>
  </g>
  <g fill="currentColor" text-anchor="middle" font-size="11.5">
    <text x="60" y="336">11</text>
    <text x="118" y="336">20</text>
    <text x="175" y="336">26</text>

<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .edge { stroke: currentColor; stroke-width: 1.3; opacity: 0.75; }
    .node { fill: none; stroke: currentColor; stroke-width: 1.4; }
    .key { fill: currentColor; text-anchor: middle; }
    .guide { stroke: currentColor; stroke-width: 1; opacity: 0.3; stroke-dasharray: 3 3; }
  </style>

  <!-- edges -->
  <line class="edge" x1="348" y1="40" x2="118" y2="104"/>

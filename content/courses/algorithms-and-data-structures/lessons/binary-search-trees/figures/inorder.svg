  <line class="edge" x1="463" y1="104" x2="405" y2="168"/>
  <line class="edge" x1="463" y1="104" x2="578" y2="168"/>
  <line class="edge" x1="578" y1="168" x2="520" y2="232"/>

  <!-- projection guides, node bottom to number line -->

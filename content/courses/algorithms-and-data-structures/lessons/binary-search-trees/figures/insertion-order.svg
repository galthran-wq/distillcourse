<svg viewBox="0 0 672 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .edge { stroke: currentColor; stroke-width: 1.3; opacity: 0.75; }
    .chainedge { stroke: #e2903a; stroke-width: 1.6; }
    .node { fill: none; stroke: currentColor; stroke-width: 1.4; }
    .chain { fill: none; stroke: #e2903a; stroke-width: 1.6; }
    .key { fill: currentColor; text-anchor: middle; }
    .ruler { stroke: currentColor; stroke-width: 1.2; opacity: 0.6; }
  </style>

  <text class="label" x="40" y="26" font-weight="600">insert 1, 2, 3, &#8230;, 8</text>
  <text class="muted" x="40" y="44">sorted arrival: every comparison goes right</text>

  <!-- chain -->
  <line class="chainedge" x1="56" y1="62" x2="88" y2="96"/>
  <line class="chainedge" x1="88" y1="96" x2="120" y2="130"/>
  <line class="chainedge" x1="120" y1="130" x2="152" y2="164"/>
  <line class="chainedge" x1="152" y1="164" x2="184" y2="198"/>
  <line class="chainedge" x1="184" y1="198" x2="216" y2="232"/>
  <line class="chainedge" x1="216" y1="232" x2="248" y2="266"/>
  <line class="chainedge" x1="248" y1="266" x2="280" y2="300"/>
  <circle class="chain" cx="56" cy="62" r="13"/><text class="key" x="56" y="66">1</text>
  <circle class="chain" cx="88" cy="96" r="13"/><text class="key" x="88" y="100">2</text>
  <circle class="chain" cx="120" cy="130" r="13"/><text class="key" x="120" y="134">3</text>
  <circle class="chain" cx="152" cy="164" r="13"/><text class="key" x="152" y="168">4</text>
  <circle class="chain" cx="184" cy="198" r="13"/><text class="key" x="184" y="202">5</text>
  <circle class="chain" cx="216" cy="232" r="13"/><text class="key" x="216" y="236">6</text>
  <circle class="chain" cx="248" cy="266" r="13"/><text class="key" x="248" y="270">7</text>
  <circle class="chain" cx="280" cy="300" r="13"/><text class="key" x="280" y="304">8</text>

  <!-- height ruler, chain -->
  <line class="ruler" x1="318" y1="62" x2="318" y2="300"/>
  <line class="ruler" x1="312" y1="62" x2="324" y2="62"/>
  <line class="ruler" x1="312" y1="300" x2="324" y2="300"/>
  <text class="label" x="328" y="185" fill="#e2903a" font-weight="600">h = 7</text>

  <text class="label" x="400" y="26" font-weight="600">insert 5, 2, 7, 1, 3, 6, 8, 4</text>
  <text class="muted" x="400" y="44">shuffled arrival: the same 8 keys</text>

  <!-- bushy tree -->
  <line class="edge" x1="490" y1="72" x2="428" y2="140"/>
  <line class="edge" x1="490" y1="72" x2="552" y2="140"/>
  <line class="edge" x1="428" y1="140" x2="394" y2="208"/>
  <line class="edge" x1="428" y1="140" x2="462" y2="208"/>
  <line class="edge" x1="552" y1="140" x2="518" y2="208"/>
  <line class="edge" x1="552" y1="140" x2="586" y2="208"/>
  <line class="edge" x1="462" y1="208" x2="480" y2="276"/>
  <circle class="node" cx="490" cy="72" r="13"/><text class="key" x="490" y="76">5</text>
  <circle class="node" cx="428" cy="140" r="13"/><text class="key" x="428" y="144">2</text>
  <circle class="node" cx="552" cy="140" r="13"/><text class="key" x="552" y="144">7</text>
  <circle class="node" cx="394" cy="208" r="13"/><text class="key" x="394" y="212">1</text>
  <circle class="node" cx="462" cy="208" r="13"/><text class="key" x="462" y="212">3</text>
  <circle class="node" cx="518" cy="208" r="13"/><text class="key" x="518" y="212">6</text>
  <circle class="node" cx="586" cy="208" r="13"/><text class="key" x="586" y="212">8</text>
  <circle class="node" cx="480" cy="276" r="13"/><text class="key" x="480" y="280">4</text>

  <!-- height ruler, bushy -->
  <line class="ruler" x1="622" y1="72" x2="622" y2="276"/>
  <line class="ruler" x1="616" y1="72" x2="628" y2="72"/>
  <line class="ruler" x1="616" y1="276" x2="628" y2="276"/>
  <text class="label" x="630" y="178" font-weight="600">h = 3</text>
</svg>

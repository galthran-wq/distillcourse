<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .edge { stroke: currentColor; stroke-width: 1.3; opacity: 0.75; }
    .node { fill: none; stroke: currentColor; stroke-width: 1.4; }
    .key { fill: currentColor; text-anchor: middle; }
    .ok { fill: #5aa46a; font-size: 11px; }
  </style>

  <!-- left panel: the invariant -->
  <text class="label" x="150" y="24" text-anchor="middle" font-weight="600">the invariant</text>
  <line class="edge" x1="150" y1="62" x2="95" y2="100"/>
  <line class="edge" x1="150" y1="62" x2="205" y2="100"/>
  <circle class="node" cx="150" cy="46" r="17"/><text class="key" x="150" y="50">k</text>
  <polygon points="95,100 45,195 145,195" fill="#4c8dd6" fill-opacity="0.15" stroke="#4c8dd6" stroke-opacity="0.7"/>
  <polygon points="205,100 155,195 255,195" fill="#e2903a" fill-opacity="0.15" stroke="#e2903a" stroke-opacity="0.7"/>
  <text x="95" y="182" text-anchor="middle" fill="#4c8dd6" font-size="11">all keys &lt; k</text>
  <text x="205" y="182" text-anchor="middle" fill="#e2903a" font-size="11">all keys &gt; k</text>
  <text class="muted" x="150" y="228" text-anchor="middle">the whole subtree, not just the child</text>

  <line x1="320" y1="20" x2="320" y2="240" stroke="currentColor" opacity="0.25" stroke-dasharray="3 3"/>

  <!-- right panel: the child-only near miss -->
  <text class="label" x="480" y="24" text-anchor="middle" font-weight="600">the child-only check, passing wrongly</text>
  <line class="edge" x1="470" y1="52" x2="410" y2="118"/>
  <line class="edge" x1="410" y1="118" x2="455" y2="186"/>
  <circle class="node" cx="470" cy="52" r="17"/><text class="key" x="470" y="56">20</text>
  <circle class="node" cx="410" cy="118" r="17"/><text class="key" x="410" y="122">10</text>
  <circle cx="455" cy="186" r="17" fill="#e2903a" fill-opacity="0.20" stroke="#e2903a" stroke-width="1.6"/>
  <text class="key" x="455" y="190">25</text>
  <text class="ok" x="415" y="78">10 &lt; 20 ✓</text>
  <text class="ok" x="378" y="160">25 &gt; 10 ✓</text>
  <text x="527" y="196" fill="#e2903a" font-size="11">25 &gt; 20, inside 20&#8217;s left subtree ✗</text>
  <!-- failed search path -->
  <line x1="484" y1="62" x2="540" y2="112" stroke="currentColor" stroke-width="1.4" stroke-dasharray="4 3" opacity="0.7"/>
  <text class="muted" x="548" y="120">nil</text>
  <text class="muted" x="480" y="238" text-anchor="middle">search for 25: 25 &gt; 20 &#8658; go right &#8658; nil — reported absent</text>
</svg>

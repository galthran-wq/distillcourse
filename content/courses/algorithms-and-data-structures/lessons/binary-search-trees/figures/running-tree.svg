<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .edge { stroke: currentColor; stroke-width: 1.3; opacity: 0.75; }
    .node { fill: none; stroke: currentColor; stroke-width: 1.4; }
    .key { fill: currentColor; text-anchor: middle; }
  </style>

  <!-- subtree regions -->
  <rect x="40" y="92" width="270" height="168" rx="8" fill="#4c8dd6" fill-opacity="0.10" stroke="#4c8dd6" stroke-opacity="0.55" stroke-dasharray="4 4"/>
  <rect x="386" y="92" width="212" height="168" rx="8" fill="#e2903a" fill-opacity="0.10" stroke="#e2903a" stroke-opacity="0.55" stroke-dasharray="4 4"/>
  <text x="175" y="282" text-anchor="middle" fill="#4c8dd6">every key &lt; 41</text>
  <text x="492" y="282" text-anchor="middle" fill="#e2903a">every key &gt; 41</text>

  <!-- edges -->
  <line class="edge" x1="348" y1="48" x2="118" y2="112"/>
  <line class="edge" x1="348" y1="48" x2="463" y2="112"/>
  <line class="edge" x1="118" y1="112" x2="60" y2="176"/>
  <line class="edge" x1="118" y1="112" x2="233" y2="176"/>
  <line class="edge" x1="233" y1="176" x2="175" y2="240"/>
  <line class="edge" x1="233" y1="176" x2="290" y2="240"/>
  <line class="edge" x1="463" y1="112" x2="405" y2="176"/>
  <line class="edge" x1="463" y1="112" x2="578" y2="176"/>
  <line class="edge" x1="578" y1="176" x2="520" y2="240"/>

  <!-- nodes -->
  <circle class="node" cx="348" cy="48" r="17"/><text class="key" x="348" y="52">41</text>
  <circle class="node" cx="118" cy="112" r="17"/><text class="key" x="118" y="116">20</text>
  <circle class="node" cx="463" cy="112" r="17"/><text class="key" x="463" y="116">65</text>
  <circle class="node" cx="60" cy="176" r="17"/><text class="key" x="60" y="180">11</text>
  <circle class="node" cx="233" cy="176" r="17"/><text class="key" x="233" y="180">29</text>
  <circle class="node" cx="405" cy="176" r="17"/><text class="key" x="405" y="180">50</text>
  <circle class="node" cx="578" cy="176" r="17"/><text class="key" x="578" y="180">91</text>
  <circle class="node" cx="175" cy="240" r="17"/><text class="key" x="175" y="244">26</text>
  <circle class="node" cx="290" cy="240" r="17"/><text class="key" x="290" y="244">32</text>
  <circle class="node" cx="520" cy="240" r="17"/><text class="key" x="520" y="244">72</text>

  <text class="muted" x="348" y="18" text-anchor="middle">the same split repeats at every node: at 20, {11} left and {26, 29, 32} right</text>
</svg>

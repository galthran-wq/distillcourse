<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
<style>.label { fill: currentColor; } .muted { fill: currentColor; opacity: 0.55; font-size: 10.5px; }</style>

<rect x="70" y="24" width="150" height="44" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text class="label" x="145" y="42" text-anchor="middle" font-weight="600">1 · Divide</text>
<text class="muted" x="145" y="58" text-anchor="middle">split into subproblems</text>

<rect x="250" y="24" width="150" height="44" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text class="label" x="325" y="42" text-anchor="middle" font-weight="600">2 · Conquer</text>
<text class="muted" x="325" y="58" text-anchor="middle">sort each piece recursively</text>

<rect x="430" y="24" width="150" height="44" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text class="label" x="505" y="42" text-anchor="middle" font-weight="600">3 · Combine</text>
<text class="muted" x="505" y="58" text-anchor="middle">assemble the sorted whole</text>

<line x1="220" y1="46" x2="248" y2="46" stroke="currentColor" stroke-width="1.4"/>
<path d="M 244 42 L 250 46 L 244 50 Z" fill="currentColor"/>
<line x1="400" y1="46" x2="428" y2="46" stroke="currentColor" stroke-width="1.4"/>
<path d="M 424 42 L 430 46 L 424 50 Z" fill="currentColor"/>

<line x1="145" y1="76" x2="145" y2="112" stroke="currentColor" opacity="0.3" stroke-dasharray="3 3"/>
<line x1="325" y1="76" x2="325" y2="112" stroke="currentColor" opacity="0.3" stroke-dasharray="3 3"/>
<line x1="505" y1="76" x2="505" y2="112" stroke="currentColor" opacity="0.3" stroke-dasharray="3 3"/>

<text class="label" x="10" y="140" font-weight="600" font-size="11">merge sort</text>
<rect x="80" y="118" width="130" height="40" rx="4" fill="none" stroke="currentColor" opacity="0.6" stroke-width="1.2"/>
<text class="label" x="145" y="134" text-anchor="middle">cut at the middle</text>
<text class="muted" x="145" y="150" text-anchor="middle">Θ(1)</text>
<rect x="260" y="118" width="130" height="40" rx="4" fill="none" stroke="currentColor" opacity="0.6" stroke-width="1.2"/>
<text class="label" x="325" y="134" text-anchor="middle">two half-size calls</text>
<text class="muted" x="325" y="150" text-anchor="middle">2 T(n/2)</text>
<rect x="440" y="118" width="130" height="40" rx="4" fill="none" stroke="#e2903a" stroke-width="2"/>
<text x="505" y="134" text-anchor="middle" fill="#e2903a" font-weight="600">merge — Θ(n)</text>
<text class="muted" x="505" y="150" text-anchor="middle">all the ordering work</text>

<text class="label" x="10" y="220" font-weight="600" font-size="11">quicksort</text>
<rect x="80" y="198" width="130" height="40" rx="4" fill="none" stroke="#e2903a" stroke-width="2"/>
<text x="145" y="214" text-anchor="middle" fill="#e2903a" font-weight="600">partition — Θ(n)</text>
<text class="muted" x="145" y="230" text-anchor="middle">all the ordering work</text>
<rect x="260" y="198" width="130" height="40" rx="4" fill="none" stroke="currentColor" opacity="0.6" stroke-width="1.2"/>
<text class="label" x="325" y="214" text-anchor="middle">one call per side</text>
<text class="muted" x="325" y="230" text-anchor="middle">T(q−1) + T(n−q)</text>
<rect x="440" y="198" width="130" height="40" rx="4" fill="none" stroke="currentColor" opacity="0.6" stroke-width="1.2"/>
<text class="label" x="505" y="214" text-anchor="middle">nothing</text>
<text class="muted" x="505" y="230" text-anchor="middle">Θ(1)</text>

<text class="muted" x="320" y="284" text-anchor="middle">the Θ(n) pass per level is the same in both sorts; only its position in the template differs</text>
</svg>

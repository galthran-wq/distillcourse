<rect x="322" y="180" width="42" height="34" rx="3" fill="none" stroke="currentColor" opacity="0.4" stroke-width="1.2"/>
<rect x="368" y="180" width="42" height="34" rx="3" fill="none" stroke="currentColor" opacity="0.4" stroke-width="1.2"/>
<rect x="414" y="180" width="42" height="34" rx="3" fill="none" stroke="currentColor" opacity="0.4" stroke-width="1.2"/>
<rect x="460" y="180" width="42" height="34" rx="3" fill="none" stroke="currentColor" opacity="0.4" stroke-width="1.2"/>

<text class="muted" x="320" y="262" text-anchor="middle">back to the left half: each output still costs exactly one comparison</text>
</svg>

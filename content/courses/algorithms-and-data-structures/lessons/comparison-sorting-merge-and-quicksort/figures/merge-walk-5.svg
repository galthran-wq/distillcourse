<svg viewBox="0 0 640 290" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
<style>.label { fill: currentColor; } .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }</style>
<text class="muted" x="160" y="40" text-anchor="middle">left half A[1..4], sorted</text>
<text class="muted" x="450" y="40" text-anchor="middle">right half A[5..8], sorted</text>

<g opacity="0.3">
<rect x="70" y="56" width="42" height="34" rx="3" fill="none" stroke="currentColor" stroke-width="1.3"/>
<text class="label" x="91" y="78" text-anchor="middle">1</text>
<rect x="116" y="56" width="42" height="34" rx="3" fill="none" stroke="currentColor" stroke-width="1.3"/>
<text class="label" x="137" y="78" text-anchor="middle">2</text>
</g>
<rect x="162" y="56" width="42" height="34" rx="3" fill="none" stroke="#e2903a" stroke-width="2"/>
<text class="label" x="183" y="78" text-anchor="middle" font-weight="600">5</text>
<rect x="208" y="56" width="42" height="34" rx="3" fill="none" stroke="currentColor" stroke-width="1.3"/>
<text class="label" x="229" y="78" text-anchor="middle">7</text>

<g opacity="0.3">
<rect x="360" y="56" width="42" height="34" rx="3" fill="none" stroke="currentColor" stroke-width="1.3"/>
<text class="label" x="381" y="78" text-anchor="middle">3</text>

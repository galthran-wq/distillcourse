</g>
<rect x="452" y="56" width="42" height="34" rx="3" fill="none" stroke="#e2903a" stroke-width="2"/>
<text class="label" x="473" y="78" text-anchor="middle">6</text>
<rect x="498" y="56" width="42" height="34" rx="3" fill="none" stroke="currentColor" stroke-width="1.3"/>
<text class="label" x="519" y="78" text-anchor="middle">8</text>

<path d="M 183 100 L 178 110 L 188 110 Z" fill="#e2903a"/>
<text x="183" y="124" text-anchor="middle" fill="#e2903a" font-weight="600">i</text>
<path d="M 473 100 L 468 110 L 478 110 Z" fill="#4c8dd6"/>
<text x="473" y="124" text-anchor="middle" fill="#4c8dd6" font-weight="600">j</text>

<text class="label" x="320" y="152" text-anchor="middle">compare 5 : 6  →  take <tspan fill="#e2903a" font-weight="600">5</tspan></text>

<text class="muted" x="130" y="201" text-anchor="end">output</text>
<rect x="138" y="180" width="42" height="34" rx="3" fill="none" stroke="#5aa46a" stroke-width="1.6"/>
<text class="label" x="159" y="202" text-anchor="middle">1</text>
<rect x="184" y="180" width="42" height="34" rx="3" fill="none" stroke="#5aa46a" stroke-width="1.6"/>
<text class="label" x="205" y="202" text-anchor="middle">2</text>
<rect x="230" y="180" width="42" height="34" rx="3" fill="none" stroke="#5aa46a" stroke-width="1.6"/>
<text class="label" x="251" y="202" text-anchor="middle">3</text>
<rect x="276" y="180" width="42" height="34" rx="3" fill="none" stroke="#5aa46a" stroke-width="1.6"/>

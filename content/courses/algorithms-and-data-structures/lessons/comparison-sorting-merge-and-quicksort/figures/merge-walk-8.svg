<path d="M 519 100 L 514 110 L 524 110 Z" fill="#4c8dd6"/>
<text x="519" y="124" text-anchor="middle" fill="#4c8dd6" font-weight="600">j</text>

<text class="label" x="320" y="152" text-anchor="middle">left half empty  →  <tspan fill="#e2903a" font-weight="600">8</tspan> is copied free, no comparison</text>


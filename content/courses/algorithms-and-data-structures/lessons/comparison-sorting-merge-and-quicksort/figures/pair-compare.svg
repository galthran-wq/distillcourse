<svg viewBox="0 0 640 250" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
<style>.label { fill: currentColor; } .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }</style>
<text class="muted" x="320" y="34" text-anchor="middle">keys in sorted order · Z = {3, 4, 5, 6} travels in one subarray until its first pivot</text>

<rect x="224" y="52" width="186" height="58" rx="6" fill="none" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5"/>

<g opacity="0.35">
<rect x="136" y="64" width="42" height="34" rx="3" fill="none" stroke="currentColor" stroke-width="1.3"/>
<text class="label" x="157" y="86" text-anchor="middle">1</text>
<rect x="182" y="64" width="42" height="34" rx="3" fill="none" stroke="currentColor" stroke-width="1.3"/>
<text class="label" x="203" y="86" text-anchor="middle">2</text>
</g>
<rect x="228" y="64" width="42" height="34" rx="3" fill="none" stroke="#e2903a" stroke-width="2"/>
<text class="label" x="249" y="86" text-anchor="middle" font-weight="600">3</text>
<rect x="274" y="64" width="42" height="34" rx="3" fill="none" stroke="#4c8dd6" stroke-width="1.5"/>
<text class="label" x="295" y="86" text-anchor="middle">4</text>
<rect x="320" y="64" width="42" height="34" rx="3" fill="none" stroke="#4c8dd6" stroke-width="1.5"/>
<text class="label" x="341" y="86" text-anchor="middle">5</text>
<rect x="366" y="64" width="42" height="34" rx="3" fill="none" stroke="#e2903a" stroke-width="2"/>
<text class="label" x="387" y="86" text-anchor="middle" font-weight="600">6</text>
<g opacity="0.35">
<rect x="412" y="64" width="42" height="34" rx="3" fill="none" stroke="currentColor" stroke-width="1.3"/>
<text class="label" x="433" y="86" text-anchor="middle">7</text>
<rect x="458" y="64" width="42" height="34" rx="3" fill="none" stroke="currentColor" stroke-width="1.3"/>
<text class="label" x="479" y="86" text-anchor="middle">8</text>
</g>

<text class="label" x="320" y="152" text-anchor="middle">first pivot from Z is <tspan fill="#e2903a" font-weight="600">3</tspan> or <tspan fill="#e2903a" font-weight="600">6</tspan> — 2 of the 4 draws  →  the pair is compared</text>
<text class="label" x="320" y="182" text-anchor="middle">first pivot from Z is <tspan fill="#4c8dd6" font-weight="600">4</tspan> or <tspan fill="#4c8dd6" font-weight="600">5</tspan>  →  3 and 6 land on opposite sides, never compared</text>

<text class="muted" x="320" y="222" text-anchor="middle">Pr[ 3 compared to 6 ] = 2 / (j − i + 1) = 2/4</text>
</svg>

<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
<style>.label { fill: currentColor; } .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }</style>

<line x1="322" y1="16" x2="322" y2="304" stroke="currentColor" opacity="0.25" stroke-dasharray="4 4"/>

<text class="label" x="165" y="26" text-anchor="middle" font-weight="600">median pivot every time</text>

<line x1="160" y1="70" x2="105" y2="94" stroke="currentColor" opacity="0.5" stroke-width="1.2"/>
<line x1="170" y1="70" x2="225" y2="94" stroke="currentColor" opacity="0.5" stroke-width="1.2"/>
<rect x="143" y="44" width="44" height="26" rx="4" fill="none" stroke="currentColor" stroke-width="1.4"/>
<text class="label" x="165" y="61" text-anchor="middle">n</text>

<line x1="100" y1="120" x2="75" y2="144" stroke="currentColor" opacity="0.5" stroke-width="1.2"/>
<line x1="110" y1="120" x2="135" y2="144" stroke="currentColor" opacity="0.5" stroke-width="1.2"/>
<line x1="220" y1="120" x2="195" y2="144" stroke="currentColor" opacity="0.5" stroke-width="1.2"/>
<line x1="230" y1="120" x2="255" y2="144" stroke="currentColor" opacity="0.5" stroke-width="1.2"/>
<rect x="83" y="94" width="44" height="26" rx="4" fill="none" stroke="currentColor" stroke-width="1.4"/>
<text class="label" x="105" y="111" text-anchor="middle">n/2</text>
<rect x="203" y="94" width="44" height="26" rx="4" fill="none" stroke="currentColor" stroke-width="1.4"/>
<text class="label" x="225" y="111" text-anchor="middle">n/2</text>

<rect x="55" y="144" width="40" height="26" rx="4" fill="none" stroke="currentColor" stroke-width="1.4"/>
<text class="label" x="75" y="161" text-anchor="middle">n/4</text>
<rect x="115" y="144" width="40" height="26" rx="4" fill="none" stroke="currentColor" stroke-width="1.4"/>
<text class="label" x="135" y="161" text-anchor="middle">n/4</text>
<rect x="175" y="144" width="40" height="26" rx="4" fill="none" stroke="currentColor" stroke-width="1.4"/>
<text class="label" x="195" y="161" text-anchor="middle">n/4</text>
<rect x="235" y="144" width="40" height="26" rx="4" fill="none" stroke="currentColor" stroke-width="1.4"/>
<text class="label" x="255" y="161" text-anchor="middle">n/4</text>

<text class="label" x="165" y="196" text-anchor="middle">⋯</text>
<text class="label" x="165" y="222" text-anchor="middle">1&#160;&#160;1&#160;&#160;⋯&#160;&#160;1</text>

<text x="305" y="61" text-anchor="end" fill="#e2903a" font-weight="600">cn</text>
<text x="305" y="111" text-anchor="end" fill="#e2903a" font-weight="600">cn</text>
<text x="305" y="161" text-anchor="end" fill="#e2903a" font-weight="600">cn</text>

<text class="muted" x="165" y="262" text-anchor="middle">cn per level × lg n levels</text>
<text x="165" y="286" text-anchor="middle" fill="#4c8dd6" font-weight="600" font-size="14">Θ(n lg n)</text>

<text class="label" x="480" y="26" text-anchor="middle" font-weight="600">fixed-end pivot, sorted input</text>

<rect x="398" y="44" width="52" height="26" rx="4" fill="none" stroke="currentColor" stroke-width="1.4"/>
<text class="label" x="424" y="61" text-anchor="middle">n</text>
<line x1="424" y1="70" x2="424" y2="90" stroke="currentColor" opacity="0.5" stroke-width="1.2"/>
<line x1="440" y1="70" x2="462" y2="84" stroke="currentColor" opacity="0.5" stroke-width="1.2"/>
<text class="muted" x="472" y="90">∅</text>

<rect x="398" y="90" width="52" height="26" rx="4" fill="none" stroke="currentColor" stroke-width="1.4"/>
<text class="label" x="424" y="107" text-anchor="middle">n−1</text>
<line x1="424" y1="116" x2="424" y2="136" stroke="currentColor" opacity="0.5" stroke-width="1.2"/>
<line x1="440" y1="116" x2="462" y2="130" stroke="currentColor" opacity="0.5" stroke-width="1.2"/>
<text class="muted" x="472" y="136">∅</text>

<rect x="398" y="136" width="52" height="26" rx="4" fill="none" stroke="currentColor" stroke-width="1.4"/>
<text class="label" x="424" y="153" text-anchor="middle">n−2</text>
<line x1="424" y1="162" x2="424" y2="180" stroke="currentColor" opacity="0.5" stroke-width="1.2"/>

<text class="label" x="424" y="198" text-anchor="middle">⋮</text>

<rect x="398" y="210" width="52" height="26" rx="4" fill="none" stroke="currentColor" stroke-width="1.4"/>
<text class="label" x="424" y="227" text-anchor="middle">1</text>

<text x="530" y="61" fill="#e2903a" font-weight="600">c·n</text>
<text x="530" y="107" fill="#e2903a" font-weight="600">c·(n−1)</text>
<text x="530" y="153" fill="#e2903a" font-weight="600">c·(n−2)</text>
<text x="530" y="227" fill="#e2903a" font-weight="600">c·1</text>

<text class="muted" x="480" y="262" text-anchor="middle">n levels, totals an arithmetic series</text>
<text x="480" y="286" text-anchor="middle" fill="#4c8dd6" font-weight="600" font-size="14">Θ(n²)</text>
</svg>

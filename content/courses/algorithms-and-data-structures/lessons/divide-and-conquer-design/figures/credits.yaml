images:
  - file: treviso-1478-multiplication.png
    title: "Long multiplication (with casting out nines) and lattice multiplication of 934 × 314 = 293276, as printed in the 1478 Treviso Arithmetic"
    credit: "Anonymous, L'Arte dell'Abbaco (Treviso, colophon dated 10 December 1478) — the first printed mathematics book in the West; original copy digitised by the Biblioteca Nazionale Braidense, Milan (BEIC digital library, pid 2953344). Reproduced as Figure 0.1 of Jeff Erickson, Algorithms, 1st paperback edition (13 June 2019), §0.2, page 5, from which this crop was taken."
    source_url: "https://jeffe.cs.illinois.edu/teaching/algorithms/book/Algorithms-JeffE.pdf"
    license: "public domain (printed 1478); Erickson's book, the immediate source of this reproduction, is © 2019 Jeff Erickson under a Creative Commons Attribution 4.0 International License, and its Image Credits page lists this figure among the works in the public domain"
    license_url: "http://creativecommons.org/licenses/by/4.0/"
    retrieved: "2026-08-07"
    located: "Algorithms (Erickson), PDF page 23 = book page 5, Figure 0.1 — the upper of the two figures on that page; the underlying scan is Biblioteca Nazionale Braidense / BEIC, http://atena.beic.it/webclient/DeliveryManager?pid=2953344. Erickson's caption misdates the book 1458; the standard date is 1478 (Swetz, Capitalism and Arithmetic, Open Court, 1987)"
    modifications: "cropped out of a 300-dpi render of the book page — the printed caption, the running head, the page number and the neighbouring Eutocius figure removed; metadata stripped. Not scaled, not retouched, nothing removed from inside the figure"
    background: light

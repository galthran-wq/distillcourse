<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
<style>.label { fill: currentColor; } .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }</style>

<line x1="320" y1="16" x2="320" y2="324" stroke="currentColor" opacity="0.25" stroke-dasharray="4 4"/>

<!-- LEFT: four calls -->
<text class="label" x="160" y="28" text-anchor="middle" font-weight="600">four half-size calls</text>

<rect x="138" y="44" width="44" height="26" rx="4" fill="none" stroke="currentColor" stroke-width="1.4"/>
<text class="label" x="160" y="61" text-anchor="middle">n</text>

<line x1="148" y1="70" x2="58" y2="98" stroke="currentColor" opacity="0.5" stroke-width="1.2"/>
<line x1="156" y1="70" x2="118" y2="98" stroke="currentColor" opacity="0.5" stroke-width="1.2"/>
<line x1="164" y1="70" x2="178" y2="98" stroke="currentColor" opacity="0.5" stroke-width="1.2"/>
<line x1="172" y1="70" x2="238" y2="98" stroke="currentColor" opacity="0.5" stroke-width="1.2"/>

<rect x="36" y="98" width="44" height="26" rx="4" fill="none" stroke="currentColor" stroke-width="1.4"/>
<text class="label" x="58" y="115" text-anchor="middle">n/2</text>
<rect x="96" y="98" width="44" height="26" rx="4" fill="none" stroke="currentColor" stroke-width="1.4"/>
<text class="label" x="118" y="115" text-anchor="middle">n/2</text>
<rect x="156" y="98" width="44" height="26" rx="4" fill="none" stroke="currentColor" stroke-width="1.4"/>
<text class="label" x="178" y="115" text-anchor="middle">n/2</text>
<rect x="216" y="98" width="44" height="26" rx="4" fill="none" stroke="currentColor" stroke-width="1.4"/>
<text class="label" x="238" y="115" text-anchor="middle">n/2</text>

<line x1="58" y1="124" x2="50" y2="146" stroke="currentColor" opacity="0.35" stroke-width="1.2"/>
<line x1="118" y1="124" x2="112" y2="146" stroke="currentColor" opacity="0.35" stroke-width="1.2"/>
<line x1="178" y1="124" x2="172" y2="146" stroke="currentColor" opacity="0.35" stroke-width="1.2"/>
<line x1="238" y1="124" x2="232" y2="146" stroke="currentColor" opacity="0.35" stroke-width="1.2"/>
<text class="muted" x="148" y="162" text-anchor="middle">16 subproblems of n/4 …</text>

<text class="label" x="148" y="192" text-anchor="middle">⋮</text>
<text class="muted" x="148" y="216" text-anchor="middle">n² leaves</text>

<text x="300" y="61" text-anchor="end" fill="#e2903a" font-weight="600">cn</text>
<text x="300" y="115" text-anchor="end" fill="#e2903a" font-weight="600">2cn</text>
<text x="300" y="162" text-anchor="end" fill="#e2903a" font-weight="600">4cn</text>
<text class="muted" x="300" y="192" text-anchor="end">×2 per level</text>

<text class="muted" x="160" y="262" text-anchor="middle">leaf-dominated: the n² leaves decide</text>
<text x="160" y="288" text-anchor="middle" fill="#4c8dd6" font-weight="600" font-size="14">Θ(n²)</text>
<text class="muted" x="160" y="310" text-anchor="middle">no better than grade school</text>

<!-- RIGHT: three calls -->
<text class="label" x="480" y="28" text-anchor="middle" font-weight="600">three calls — one deleted</text>

<rect x="458" y="44" width="44" height="26" rx="4" fill="none" stroke="currentColor" stroke-width="1.4"/>
<text class="label" x="480" y="61" text-anchor="middle">n</text>

<line x1="468" y1="70" x2="398" y2="98" stroke="currentColor" opacity="0.5" stroke-width="1.2"/>
<line x1="478" y1="70" x2="468" y2="98" stroke="currentColor" opacity="0.5" stroke-width="1.2"/>
<line x1="488" y1="70" x2="538" y2="98" stroke="currentColor" opacity="0.5" stroke-width="1.2"/>
<line x1="496" y1="70" x2="592" y2="98" stroke="#e2903a" opacity="0.55" stroke-width="1.2" stroke-dasharray="3 3"/>

<rect x="376" y="98" width="44" height="26" rx="4" fill="none" stroke="currentColor" stroke-width="1.4"/>
<text class="label" x="398" y="115" text-anchor="middle">n/2</text>
<rect x="446" y="98" width="44" height="26" rx="4" fill="none" stroke="currentColor" stroke-width="1.4"/>
<text class="label" x="468" y="115" text-anchor="middle">n/2</text>
<rect x="516" y="98" width="44" height="26" rx="4" fill="none" stroke="currentColor" stroke-width="1.4"/>
<text class="label" x="538" y="115" text-anchor="middle">n/2</text>
<rect x="570" y="98" width="44" height="26" rx="4" fill="none" stroke="#e2903a" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.7"/>
<text x="592" y="115" text-anchor="middle" fill="#e2903a" opacity="0.85">✕</text>
<text x="592" y="140" text-anchor="middle" fill="#e2903a" font-size="10">deleted by the</text>
<text x="592" y="152" text-anchor="middle" fill="#e2903a" font-size="10">identity</text>

<line x1="398" y1="124" x2="392" y2="146" stroke="currentColor" opacity="0.35" stroke-width="1.2"/>
<line x1="468" y1="124" x2="462" y2="146" stroke="currentColor" opacity="0.35" stroke-width="1.2"/>
<line x1="538" y1="124" x2="532" y2="146" stroke="currentColor" opacity="0.35" stroke-width="1.2"/>
<text class="muted" x="462" y="162" text-anchor="middle">9 subproblems of n/4 …</text>

<text class="label" x="462" y="192" text-anchor="middle">⋮</text>
<text class="muted" x="462" y="216" text-anchor="middle">n<tspan dy="-4" font-size="9">lg 3</tspan><tspan dy="4"> leaves</tspan></text>

<text x="368" y="61" text-anchor="end" fill="#e2903a" font-weight="600">cn</text>
<text x="368" y="115" text-anchor="end" fill="#e2903a" font-weight="600">1.5cn</text>
<text x="368" y="162" text-anchor="end" fill="#e2903a" font-weight="600">2.25cn</text>
<text class="muted" x="368" y="192" text-anchor="end">×3/2 per level</text>

<text class="muted" x="480" y="262" text-anchor="middle">still leaf-dominated — but fewer leaves</text>
<text x="480" y="288" text-anchor="middle" fill="#4c8dd6" font-weight="600" font-size="14">Θ(n<tspan dy="-6" font-size="11">lg 3</tspan><tspan dy="6">) = Θ(n</tspan><tspan dy="-6" font-size="11">1.585</tspan><tspan dy="6">)</tspan></text>
<text class="muted" x="480" y="310" text-anchor="middle">the exponent moved: lg 4 = 2 → lg 3 ≈ 1.585</text>
</svg>

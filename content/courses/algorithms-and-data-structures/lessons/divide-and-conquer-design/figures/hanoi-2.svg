<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
<style>.label { fill: currentColor; } .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }</style>

<text x="320" y="30" text-anchor="middle" fill="#e2903a" font-weight="600">② move disk n straight to the destination — 1 move</text>

<!-- pegs and base -->
<line x1="140" y1="70" x2="140" y2="205" stroke="currentColor" stroke-width="5" opacity="0.5" stroke-linecap="round"/>
<line x1="320" y1="70" x2="320" y2="205" stroke="currentColor" stroke-width="5" opacity="0.5" stroke-linecap="round"/>
<line x1="500" y1="70" x2="500" y2="205" stroke="currentColor" stroke-width="5" opacity="0.5" stroke-linecap="round"/>
<rect x="60" y="205" width="520" height="8" rx="3" fill="currentColor" opacity="0.5"/>
<text class="muted" x="140" y="234" text-anchor="middle">source</text>
<text class="muted" x="320" y="234" text-anchor="middle">spare</text>
<text class="muted" x="500" y="234" text-anchor="middle">destination</text>

<!-- arrow src -> dst over the top -->
<path d="M 150 105 Q 320 62 488 102" fill="none" stroke="#e2903a" stroke-width="1.6" stroke-dasharray="4 3"/>
<path d="M 488 102 l -10 -7 m 10 7 l -12 2" fill="none" stroke="#e2903a" stroke-width="1.6"/>

<!-- source: ghost of disk n -->
<rect x="80" y="189" width="120" height="16" rx="6" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.3"/>

<!-- spare: the parked n−1 stack, now inert -->
<rect x="275" y="189" width="90" height="16" rx="6" fill="none" stroke="currentColor" stroke-width="1.6"/>
<rect x="286" y="173" width="68" height="16" rx="6" fill="none" stroke="currentColor" stroke-width="1.6"/>
<rect x="297" y="157" width="46" height="16" rx="6" fill="none" stroke="currentColor" stroke-width="1.6"/>
<text class="muted" x="320" y="150" text-anchor="middle" font-size="10">n−1 disks</text>

<!-- destination: disk n arrives -->
<rect x="440" y="189" width="120" height="16" rx="6" fill="#e2903a" fill-opacity="0.18" stroke="#e2903a" stroke-width="1.6"/>
<text x="500" y="182" text-anchor="middle" fill="#e2903a" font-size="10">disk n</text>
</svg>

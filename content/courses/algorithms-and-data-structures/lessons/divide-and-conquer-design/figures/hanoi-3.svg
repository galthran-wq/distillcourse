<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
<style>.label { fill: currentColor; } .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }</style>

<text x="320" y="30" text-anchor="middle" fill="#4c8dd6" font-weight="600">③ recursion again: re-stack the n−1 disks onto disk n — T(n−1) moves</text>

<!-- pegs and base -->
<line x1="140" y1="70" x2="140" y2="205" stroke="currentColor" stroke-width="5" opacity="0.5" stroke-linecap="round"/>
<line x1="320" y1="70" x2="320" y2="205" stroke="currentColor" stroke-width="5" opacity="0.5" stroke-linecap="round"/>
<line x1="500" y1="70" x2="500" y2="205" stroke="currentColor" stroke-width="5" opacity="0.5" stroke-linecap="round"/>
<rect x="60" y="205" width="520" height="8" rx="3" fill="currentColor" opacity="0.5"/>
<text class="muted" x="140" y="234" text-anchor="middle">source</text>
<text class="muted" x="320" y="234" text-anchor="middle">spare</text>
<text class="muted" x="500" y="234" text-anchor="middle">destination</text>

<!-- arrow spare -> dst -->
<path d="M 335 112 Q 410 76 485 106" fill="none" stroke="#4c8dd6" stroke-width="1.6" stroke-dasharray="4 3"/>
<path d="M 485 106 l -10 -6 m 10 6 l -11 3" fill="none" stroke="#4c8dd6" stroke-width="1.6"/>

<!-- spare: ghosts of the stack -->
<rect x="275" y="189" width="90" height="16" rx="6" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.3"/>
<rect x="286" y="173" width="68" height="16" rx="6" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.3"/>
<rect x="297" y="157" width="46" height="16" rx="6" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.3"/>

<!-- destination: disk n with the stack arriving on top -->
<rect x="440" y="189" width="120" height="16" rx="6" fill="none" stroke="currentColor" stroke-width="1.6"/>
<rect x="455" y="173" width="90" height="16" rx="6" fill="#4c8dd6" fill-opacity="0.15" stroke="#4c8dd6" stroke-width="1.6"/>
<rect x="466" y="157" width="68" height="16" rx="6" fill="#4c8dd6" fill-opacity="0.15" stroke="#4c8dd6" stroke-width="1.6"/>
<rect x="477" y="141" width="46" height="16" rx="6" fill="#4c8dd6" fill-opacity="0.15" stroke="#4c8dd6" stroke-width="1.6"/>

<text class="muted" x="320" y="254" text-anchor="middle">total: T(n) = T(n−1) + 1 + T(n−1) = 2T(n−1) + 1</text>
</svg>

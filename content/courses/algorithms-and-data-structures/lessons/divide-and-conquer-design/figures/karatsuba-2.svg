<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
<style>.label { fill: currentColor; } .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }</style>

<text x="320" y="24" text-anchor="middle" fill="#e2903a" font-weight="600">② three half-size products — the only recursive calls</text>

<text x="320" y="62" text-anchor="middle" font-size="22" font-family="ui-monospace, monospace"><tspan fill="#e2903a" font-weight="600">12</tspan><tspan fill="#4c8dd6" font-weight="600">34</tspan><tspan class="label"> × </tspan><tspan fill="#e2903a" font-weight="600">56</tspan><tspan fill="#4c8dd6" font-weight="600">78</tspan></text>

<text x="222" y="86" text-anchor="middle"><tspan fill="#e2903a">a = 12</tspan><tspan class="muted">&#160;&#160;·10²&#160;+&#160;</tspan><tspan fill="#4c8dd6">b = 34</tspan></text>
<text x="428" y="86" text-anchor="middle"><tspan fill="#e2903a">c = 56</tspan><tspan class="muted">&#160;&#160;·10²&#160;+&#160;</tspan><tspan fill="#4c8dd6">d = 78</tspan></text>

<text class="muted" x="320" y="118" text-anchor="middle">x·y = ac·10⁴ + (ad + bc)·10² + bd — three coefficients needed</text>

<rect x="60" y="136" width="150" height="44" rx="5" fill="none" stroke="#e2903a" stroke-width="1.6"/>
<text class="label" x="135" y="154" text-anchor="middle">ac = 12·56</text>
<text x="135" y="172" text-anchor="middle" fill="#e2903a" font-weight="600">= 672</text>

<rect x="240" y="136" width="150" height="44" rx="5" fill="none" stroke="#e2903a" stroke-width="1.6"/>
<text class="label" x="315" y="154" text-anchor="middle">bd = 34·78</text>
<text x="315" y="172" text-anchor="middle" fill="#e2903a" font-weight="600">= 2652</text>

<rect x="420" y="136" width="160" height="44" rx="5" fill="none" stroke="#e2903a" stroke-width="1.6"/>
<text class="label" x="500" y="154" text-anchor="middle">(a−b)(c−d) = (−22)(−22)</text>
<text x="500" y="172" text-anchor="middle" fill="#e2903a" font-weight="600">= 484</text>

<rect x="120" y="200" width="400" height="34" rx="5" fill="none" stroke="currentColor" opacity="0.15" stroke-dasharray="3 3"/>
<rect x="90" y="252" width="460" height="34" rx="5" fill="none" stroke="currentColor" opacity="0.15" stroke-dasharray="3 3"/>
</svg>

<svg viewBox="0 0 640 240" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
<style>.label { fill: currentColor; } .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }</style>

<!-- matrix A -->
<rect x="80" y="36" width="100" height="100" rx="4" fill="none" stroke="currentColor" stroke-width="1.4"/>
<line x1="130" y1="36" x2="130" y2="136" stroke="currentColor" opacity="0.4"/>
<line x1="80" y1="86" x2="180" y2="86" stroke="currentColor" opacity="0.4"/>
<text class="label" x="105" y="66" text-anchor="middle">A₁₁</text>
<text class="label" x="155" y="66" text-anchor="middle">A₁₂</text>
<text class="label" x="105" y="116" text-anchor="middle">A₂₁</text>
<text class="label" x="155" y="116" text-anchor="middle">A₂₂</text>

<text class="label" x="205" y="92" text-anchor="middle" font-size="16">×</text>

<!-- matrix B -->
<rect x="230" y="36" width="100" height="100" rx="4" fill="none" stroke="currentColor" stroke-width="1.4"/>
<line x1="280" y1="36" x2="280" y2="136" stroke="currentColor" opacity="0.4"/>
<line x1="230" y1="86" x2="330" y2="86" stroke="currentColor" opacity="0.4"/>
<text class="label" x="255" y="66" text-anchor="middle">B₁₁</text>
<text class="label" x="305" y="66" text-anchor="middle">B₁₂</text>
<text class="label" x="255" y="116" text-anchor="middle">B₂₁</text>
<text class="label" x="305" y="116" text-anchor="middle">B₂₂</text>

<text class="label" x="355" y="92" text-anchor="middle" font-size="16">=</text>

<!-- matrix C -->
<rect x="380" y="36" width="100" height="100" rx="4" fill="none" stroke="currentColor" stroke-width="1.4"/>
<line x1="430" y1="36" x2="430" y2="136" stroke="currentColor" opacity="0.4"/>
<line x1="380" y1="86" x2="480" y2="86" stroke="currentColor" opacity="0.4"/>
<text class="label" x="405" y="66" text-anchor="middle">C₁₁</text>
<text class="label" x="455" y="66" text-anchor="middle">C₁₂</text>
<text class="label" x="405" y="116" text-anchor="middle">C₂₁</text>
<text class="label" x="455" y="116" text-anchor="middle">C₂₂</text>

<text class="muted" x="505" y="60">each block:</text>
<text class="muted" x="505" y="76">n/2 × n/2</text>
<text class="muted" x="505" y="104">C₁₁ = A₁₁B₁₁ + A₁₂B₂₁, …</text>

<!-- counts -->
<text class="label" x="80" y="176">block formula: <tspan text-decoration="line-through" opacity="0.55">8</tspan> half-size products&#160;&#160;→&#160;&#160;<tspan fill="#e2903a" font-weight="600">7</tspan><tspan fill="#e2903a"> (Strassen 1969)</tspan></text>

<text class="muted" x="80" y="204">8 products:&#160;&#160;T(n) = 8 T(n/2) + Θ(n²) = Θ(n³)</text>
<text x="80" y="226" fill="#4c8dd6" font-weight="600">7 products:&#160;&#160;T(n) = 7 T(n/2) + Θ(n²) = Θ(n<tspan dy="-5" font-size="10">lg 7</tspan><tspan dy="5">) = O(n</tspan><tspan dy="-5" font-size="10">2.81</tspan><tspan dy="5">)</tspan></text>
</svg>

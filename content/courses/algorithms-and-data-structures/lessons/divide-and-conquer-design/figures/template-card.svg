<svg viewBox="0 0 640 312" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
<style>.label { fill: currentColor; } .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }</style>

<text class="label" x="24" y="26" font-weight="600">the divide-and-conquer design card</text>
<text class="muted" x="616" y="26" text-anchor="end">filled in: merge sort</text>

<rect x="24" y="42" width="280" height="56" rx="5" fill="none" stroke="currentColor" stroke-width="1.4"/>
<text class="label" x="38" y="66" font-weight="600">1&#8202;·&#8202;split</text>
<text class="muted" x="38" y="84">how is an instance cut into smaller ones?</text>
<line x1="304" y1="70" x2="330" y2="70" stroke="currentColor" opacity="0.5" stroke-width="1.2"/>
<rect x="332" y="42" width="284" height="56" rx="5" fill="none" stroke="#e2903a" stroke-width="1.4"/>
<text x="346" y="66" fill="#e2903a">cut at the midpoint, blind to values:</text>
<text x="346" y="84" fill="#e2903a">two halves of n/2</text>

<rect x="24" y="110" width="280" height="56" rx="5" fill="none" stroke="currentColor" stroke-width="1.4"/>
<text class="label" x="38" y="134" font-weight="600">2&#8202;·&#8202;return contract</text>
<text class="muted" x="38" y="152">what does a solved subproblem hand back?</text>
<line x1="304" y1="138" x2="330" y2="138" stroke="currentColor" opacity="0.5" stroke-width="1.2"/>
<rect x="332" y="110" width="284" height="56" rx="5" fill="none" stroke="#e2903a" stroke-width="1.4"/>
<text x="346" y="134" fill="#e2903a">each half comes back sorted</text>
<text x="346" y="152" fill="#e2903a">(trusted, never re-checked)</text>

<rect x="24" y="178" width="280" height="56" rx="5" fill="none" stroke="currentColor" stroke-width="1.4"/>
<text class="label" x="38" y="202" font-weight="600">3&#8202;·&#8202;combine</text>
<text class="muted" x="38" y="220">how do sub-answers make the answer? cost?</text>
<line x1="304" y1="206" x2="330" y2="206" stroke="currentColor" opacity="0.5" stroke-width="1.2"/>
<rect x="332" y="178" width="284" height="56" rx="5" fill="none" stroke="#e2903a" stroke-width="1.4"/>
<text x="346" y="202" fill="#e2903a">two-finger merge of the sorted halves,</text>
<text x="346" y="220" fill="#e2903a">Θ(n)</text>

<rect x="24" y="246" width="280" height="56" rx="5" fill="none" stroke="currentColor" stroke-width="1.4"/>
<text class="label" x="38" y="270" font-weight="600">4&#8202;·&#8202;recurrence</text>
<text class="muted" x="38" y="288">rows 1–3 fix a, b, f(n) — priced before coding</text>
<line x1="304" y1="274" x2="330" y2="274" stroke="currentColor" opacity="0.5" stroke-width="1.2"/>
<rect x="332" y="246" width="284" height="56" rx="5" fill="none" stroke="#4c8dd6" stroke-width="1.4"/>
<text x="346" y="270" fill="#4c8dd6" font-weight="600">T(n) = 2 T(n/2) + Θ(n)</text>
<text x="346" y="288" fill="#4c8dd6">= Θ(n lg n)&#160;&#160;(Master, case 2)</text>
</svg>

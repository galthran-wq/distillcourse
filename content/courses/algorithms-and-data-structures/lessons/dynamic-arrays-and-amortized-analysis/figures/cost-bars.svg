<svg viewBox="0 0 640 270" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .hot { fill: #e2903a; }
    .cool { fill: #4c8dd6; }
  </style>

  <text class="label" x="320" y="24" text-anchor="middle" font-weight="600">per-append cost, appends 1–17: total 48 = 17 writes + 31 copies</text>

  <!-- legend -->
  <rect x="404" y="38" width="10" height="10" fill="#e2903a" opacity="0.8"/>
  <text class="muted" x="420" y="47">resize append, cost i</text>
  <rect x="404" y="54" width="10" height="10" fill="currentColor" opacity="0.35"/>
  <text class="muted" x="420" y="63">plain append, cost 1</text>
  <line x1="404" y1="76" x2="414" y2="76" stroke="#4c8dd6" stroke-width="2"/>
  <text class="muted" x="420" y="80">running average T(i)/i</text>

  <!-- dashed guide at cost 3 -->
  <line x1="50" y1="183" x2="600" y2="183" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5"/>
  <text class="muted" x="600" y="178" text-anchor="end">cost 3 — the bound 3n/n</text>

  <!-- bars: baseline y=210, 9 px per unit -->
  <rect x="58"  y="201" width="20" height="9"   fill="currentColor" opacity="0.35"/>
  <rect x="88"  y="192" width="20" height="18"  fill="#e2903a" opacity="0.8"/>
  <rect x="118" y="183" width="20" height="27"  fill="#e2903a" opacity="0.8"/>
  <rect x="148" y="201" width="20" height="9"   fill="currentColor" opacity="0.35"/>
  <rect x="178" y="165" width="20" height="45"  fill="#e2903a" opacity="0.8"/>
  <rect x="208" y="201" width="20" height="9"   fill="currentColor" opacity="0.35"/>
  <rect x="238" y="201" width="20" height="9"   fill="currentColor" opacity="0.35"/>
  <rect x="268" y="201" width="20" height="9"   fill="currentColor" opacity="0.35"/>
  <rect x="298" y="129" width="20" height="81"  fill="#e2903a" opacity="0.8"/>
  <rect x="328" y="201" width="20" height="9"   fill="currentColor" opacity="0.35"/>
  <rect x="358" y="201" width="20" height="9"   fill="currentColor" opacity="0.35"/>
  <rect x="388" y="201" width="20" height="9"   fill="currentColor" opacity="0.35"/>
  <rect x="418" y="201" width="20" height="9"   fill="currentColor" opacity="0.35"/>
  <rect x="448" y="201" width="20" height="9"   fill="currentColor" opacity="0.35"/>
  <rect x="478" y="201" width="20" height="9"   fill="currentColor" opacity="0.35"/>
  <rect x="508" y="201" width="20" height="9"   fill="currentColor" opacity="0.35"/>
  <rect x="538" y="57"  width="20" height="153" fill="#e2903a" opacity="0.8"/>

  <!-- spike labels -->
  <text class="hot" x="98"  y="187" text-anchor="middle" font-size="11">2</text>
  <text class="hot" x="128" y="178" text-anchor="middle" font-size="11">3</text>
  <text class="hot" x="188" y="160" text-anchor="middle" font-size="11">5</text>
  <text class="hot" x="308" y="124" text-anchor="middle" font-size="11">9</text>
  <text class="hot" x="548" y="52"  text-anchor="middle" font-size="11">17</text>

  <!-- running average polyline -->
  <polyline fill="none" stroke="#4c8dd6" stroke-width="2"
    points="68,201 98,196.5 128,192 158,194.3 188,188.4 218,190.5 248,192 278,193.1 308,186 338,187.5 368,188.7 398,189.8 428,190.6 458,191.4 488,192 518,192.6 548,184.6"/>
  <circle cx="548" cy="184.6" r="3.5" fill="#4c8dd6"/>
  <text class="cool" x="560" y="196" font-size="11">48/17 ≈ 2.8</text>

  <!-- baseline and x labels -->
  <line x1="50" y1="210" x2="600" y2="210" stroke="currentColor" opacity="0.7"/>
  <text class="muted" x="68"  y="228" text-anchor="middle">1</text>
  <text class="muted" x="188" y="228" text-anchor="middle">5</text>
  <text class="muted" x="308" y="228" text-anchor="middle">9</text>
  <text class="muted" x="428" y="228" text-anchor="middle">13</text>
  <text class="muted" x="548" y="228" text-anchor="middle">17</text>
  <text class="muted" x="320" y="250" text-anchor="middle">append number i — spikes at i − 1 = 1, 2, 4, 8, 16</text>
</svg>

<svg viewBox="0 0 640 240" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .hot { fill: #e2903a; }
    .cool { fill: #4c8dd6; }
  </style>

  <text class="label" x="320" y="24" text-anchor="middle" font-weight="600">all copy work for appends 1–17, laid against a 2n ruler</text>

  <!-- copy bars, 13 px per element, left-aligned at x=80 -->
  <rect x="80" y="44"  width="208" height="22" rx="3" fill="#4c8dd6" opacity="0.75"/>
  <text class="cool" x="296" y="60">copy 16 (at append 17)</text>
  <rect x="80" y="72"  width="104" height="22" rx="3" fill="#4c8dd6" opacity="0.75"/>
  <text class="cool" x="192" y="88">copy 8 (at append 9)</text>
  <rect x="80" y="100" width="52"  height="22" rx="3" fill="#4c8dd6" opacity="0.75"/>
  <text class="cool" x="140" y="116">copy 4 (at append 5)</text>
  <rect x="80" y="128" width="26"  height="22" rx="3" fill="#4c8dd6" opacity="0.75"/>
  <text class="cool" x="114" y="144">copy 2 (at append 3)</text>
  <rect x="80" y="156" width="13"  height="22" rx="3" fill="#4c8dd6" opacity="0.75"/>
  <text class="cool" x="101" y="172">copy 1 (at append 2)</text>

  <!-- ruler: 2n = 34 units -->
  <rect x="80" y="196" width="442" height="18" rx="3" fill="none" stroke="#e2903a" stroke-width="2"/>
  <text class="hot" x="530" y="210">2n = 34</text>
  <text class="muted" x="80" y="232">each bar is half the one above it: 16 + 8 + 4 + 2 + 1 = 31 — under twice the largest copy, so under 2n</text>
</svg>

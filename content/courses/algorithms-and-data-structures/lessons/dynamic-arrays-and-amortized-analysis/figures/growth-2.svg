<svg viewBox="0 0 640 250" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .hot { fill: #e2903a; }
    .cool { fill: #4c8dd6; }
  </style>
  <defs>
    <marker id="g2-blue" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4c8dd6"/>
    </marker>
  </defs>

  <text class="label" x="320" y="28" text-anchor="middle" font-weight="600">append b: full. allocate 2, copy 1, write b — cost 2</text>

  <text class="muted" x="56" y="95" text-anchor="end">before</text>
  <rect x="64" y="70" width="56" height="40" rx="4" fill="none" stroke="currentColor"/>
  <text class="label" x="92" y="95" text-anchor="middle">a</text>
  <text class="muted" x="128" y="95">capacity 1, full</text>

  <path d="M92,112 L92,156" fill="none" stroke="#4c8dd6" stroke-width="1.5" marker-end="url(#g2-blue)"/>

  <text class="muted" x="56" y="185" text-anchor="end">after</text>
  <rect x="64" y="160" width="56" height="40" rx="4" fill="none" stroke="currentColor"/>
  <rect x="120" y="160" width="56" height="40" rx="4" fill="#e2903a" opacity="0.18"/>
  <rect x="120" y="160" width="56" height="40" rx="4" fill="none" stroke="#e2903a" stroke-width="2"/>
  <text class="cool" x="92" y="185" text-anchor="middle">a</text>
  <text class="hot" x="148" y="185" text-anchor="middle" font-weight="600">b</text>
  <text class="muted" x="184" y="185">capacity 2, n = 2</text>

  <text class="muted" x="64" y="236">1 write, 1 copy (blue arrow): the old block is freed</text>
</svg>

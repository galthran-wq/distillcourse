<svg viewBox="0 0 640 250" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .hot { fill: #e2903a; }
    .cool { fill: #4c8dd6; }
  </style>
  <defs>
    <marker id="g3-blue" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4c8dd6"/>
    </marker>
  </defs>

  <text class="label" x="320" y="28" text-anchor="middle" font-weight="600">append c: full again. allocate 4, copy 2, write c — cost 3</text>

  <text class="muted" x="56" y="95" text-anchor="end">before</text>
  <rect x="64" y="70" width="56" height="40" rx="4" fill="none" stroke="currentColor"/>
  <rect x="120" y="70" width="56" height="40" rx="4" fill="none" stroke="currentColor"/>
  <text class="label" x="92" y="95" text-anchor="middle">a</text>
  <text class="label" x="148" y="95" text-anchor="middle">b</text>
  <text class="muted" x="184" y="95">capacity 2, full</text>

  <path d="M92,112 L92,156" fill="none" stroke="#4c8dd6" stroke-width="1.5" marker-end="url(#g3-blue)"/>
  <path d="M148,112 L148,156" fill="none" stroke="#4c8dd6" stroke-width="1.5" marker-end="url(#g3-blue)"/>

  <text class="muted" x="56" y="185" text-anchor="end">after</text>
  <rect x="64" y="160" width="56" height="40" rx="4" fill="none" stroke="currentColor"/>
  <rect x="120" y="160" width="56" height="40" rx="4" fill="none" stroke="currentColor"/>
  <rect x="176" y="160" width="56" height="40" rx="4" fill="#e2903a" opacity="0.18"/>
  <rect x="176" y="160" width="56" height="40" rx="4" fill="none" stroke="#e2903a" stroke-width="2"/>
  <rect x="232" y="160" width="56" height="40" rx="4" fill="none" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5"/>
  <text class="cool" x="92" y="185" text-anchor="middle">a</text>
  <text class="cool" x="148" y="185" text-anchor="middle">b</text>
  <text class="hot" x="204" y="185" text-anchor="middle" font-weight="600">c</text>
  <text class="muted" x="296" y="185">capacity 4, n = 3</text>

  <text class="muted" x="64" y="236">1 write, 2 copies — and one free slot banked for the next append</text>
</svg>

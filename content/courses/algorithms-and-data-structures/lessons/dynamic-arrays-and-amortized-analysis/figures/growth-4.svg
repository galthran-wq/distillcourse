<svg viewBox="0 0 640 250" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .hot { fill: #e2903a; }
    .cool { fill: #4c8dd6; }
  </style>

  <text class="label" x="320" y="28" text-anchor="middle" font-weight="600">append d: a free slot is waiting. write d — cost 1, no copies</text>

  <text class="muted" x="56" y="95" text-anchor="end">before</text>
  <rect x="64" y="70" width="56" height="40" rx="4" fill="none" stroke="currentColor"/>
  <rect x="120" y="70" width="56" height="40" rx="4" fill="none" stroke="currentColor"/>
  <rect x="176" y="70" width="56" height="40" rx="4" fill="none" stroke="currentColor"/>
  <rect x="232" y="70" width="56" height="40" rx="4" fill="none" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5"/>
  <text class="label" x="92" y="95" text-anchor="middle">a</text>
  <text class="label" x="148" y="95" text-anchor="middle">b</text>
  <text class="label" x="204" y="95" text-anchor="middle">c</text>
  <text class="muted" x="304" y="95">capacity 4, n = 3</text>

  <text class="muted" x="56" y="185" text-anchor="end">after</text>
  <rect x="64" y="160" width="56" height="40" rx="4" fill="none" stroke="currentColor"/>
  <rect x="120" y="160" width="56" height="40" rx="4" fill="none" stroke="currentColor"/>
  <rect x="176" y="160" width="56" height="40" rx="4" fill="none" stroke="currentColor"/>
  <rect x="232" y="160" width="56" height="40" rx="4" fill="#e2903a" opacity="0.18"/>
  <rect x="232" y="160" width="56" height="40" rx="4" fill="none" stroke="#e2903a" stroke-width="2"/>
  <text class="label" x="92" y="185" text-anchor="middle">a</text>
  <text class="label" x="148" y="185" text-anchor="middle">b</text>
  <text class="label" x="204" y="185" text-anchor="middle">c</text>
  <text class="hot" x="260" y="185" text-anchor="middle" font-weight="600">d</text>
  <text class="muted" x="304" y="185">capacity 4, full</text>

  <text class="muted" x="64" y="236">the block does not move; the same slots keep their addresses</text>
</svg>

<svg viewBox="0 0 640 252" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .bar { fill: currentColor; opacity: 0.35; }
    .hot { fill: #e2903a; opacity: 0.8; }
  </style>

  <text class="label" x="320" y="18" text-anchor="middle" font-weight="600">per-operation cost under three O(1) guarantees</text>

  <!-- ===== panel 1: worst-case ===== -->
  <line x1="25" y1="121" x2="181" y2="121" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5"/>
  <text class="muted" x="181" y="115" text-anchor="end" font-size="10.5">the bound</text>
  <rect class="bar" x="25"  y="147" width="9" height="13"/>
  <rect class="bar" x="38"  y="147" width="9" height="13"/>
  <rect class="bar" x="51"  y="147" width="9" height="13"/>
  <rect class="bar" x="64"  y="147" width="9" height="13"/>
  <rect class="bar" x="77"  y="147" width="9" height="13"/>
  <rect class="bar" x="90"  y="147" width="9" height="13"/>
  <rect class="bar" x="103" y="147" width="9" height="13"/>
  <rect class="bar" x="116" y="147" width="9" height="13"/>
  <rect class="bar" x="129" y="147" width="9" height="13"/>
  <rect class="bar" x="142" y="147" width="9" height="13"/>
  <rect class="bar" x="155" y="147" width="9" height="13"/>
  <rect class="bar" x="168" y="147" width="9" height="13"/>
  <line x1="25" y1="160" x2="181" y2="160" stroke="currentColor" opacity="0.7"/>

  <!-- ===== panel 2: amortized (appends 1–12 of the doubling trace) ===== -->
  <line x1="235" y1="121" x2="391" y2="121" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5"/>
  <rect class="bar" x="235" y="147" width="9" height="13"/>
  <rect class="hot" x="248" y="134" width="9" height="26"/>
  <rect class="hot" x="261" y="121" width="9" height="39"/>
  <rect class="bar" x="274" y="147" width="9" height="13"/>
  <rect class="hot" x="287" y="95"  width="9" height="65"/>
  <rect class="bar" x="300" y="147" width="9" height="13"/>
  <rect class="bar" x="313" y="147" width="9" height="13"/>
  <rect class="bar" x="326" y="147" width="9" height="13"/>
  <rect class="hot" x="339" y="43"  width="9" height="117"/>
  <rect class="bar" x="352" y="147" width="9" height="13"/>
  <rect class="bar" x="365" y="147" width="9" height="13"/>
  <rect class="bar" x="378" y="147" width="9" height="13"/>
  <polyline fill="none" stroke="#4c8dd6" stroke-width="2"
    points="239.5,147 252.5,140.5 265.5,134 278.5,137.3 291.5,128.8 304.5,131.8 317.5,134 330.5,135.6 343.5,125.3 356.5,127.5 369.5,129.3 382.5,130.8"/>
  <line x1="235" y1="160" x2="391" y2="160" stroke="currentColor" opacity="0.7"/>

  <!-- ===== panel 3: expected ===== -->
  <line x1="445" y1="121" x2="601" y2="121" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5"/>
  <rect class="bar" x="445" y="147" width="9" height="13"/>
  <rect class="bar" x="458" y="147" width="9" height="13"/>
  <rect class="hot" x="471" y="108" width="9" height="52"/>
  <rect class="bar" x="484" y="147" width="9" height="13"/>
  <rect class="bar" x="497" y="147" width="9" height="13"/>
  <rect class="bar" x="510" y="147" width="9" height="13"/>
  <rect class="hot" x="523" y="69"  width="9" height="91"/>
  <rect class="bar" x="536" y="147" width="9" height="13"/>
  <rect class="hot" x="549" y="134" width="9" height="26"/>
  <rect class="bar" x="562" y="147" width="9" height="13"/>
  <rect class="bar" x="575" y="147" width="9" height="13"/>
  <rect class="hot" x="588" y="121" width="9" height="39"/>
  <line x1="445" y1="160" x2="601" y2="160" stroke="currentColor" opacity="0.7"/>

  <!-- ===== panel titles and glosses ===== -->
  <text class="label" x="103" y="185" text-anchor="middle" font-weight="600" font-size="12.5">worst-case O(1)</text>
  <text class="muted" x="103" y="203" text-anchor="middle">stack push</text>
  <text class="muted" x="103" y="219" text-anchor="middle">every operation under the bound;</text>
  <text class="muted" x="103" y="234" text-anchor="middle">no averaging anywhere</text>

  <text class="label" x="313" y="185" text-anchor="middle" font-weight="600" font-size="12.5">amortized O(1)</text>
  <text class="muted" x="313" y="203" text-anchor="middle">dynamic-array append</text>
  <text class="muted" x="313" y="219" text-anchor="middle">spikes certain and scheduled;</text>
  <text class="muted" x="313" y="234" text-anchor="middle">blue running average under the bound</text>

  <text class="label" x="523" y="185" text-anchor="middle" font-weight="600" font-size="12.5">expected O(1)</text>
  <text class="muted" x="523" y="203" text-anchor="middle">hash-table insert (next lesson)</text>
  <text class="muted" x="523" y="219" text-anchor="middle">average is over random choices;</text>
  <text class="muted" x="523" y="234" text-anchor="middle">a bad draw can land anywhere</text>
</svg>

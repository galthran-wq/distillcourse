<svg viewBox="0 0 640 240" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .hot { fill: #e2903a; }
    .cool { fill: #4c8dd6; }
  </style>

  <text class="label" x="320" y="26" text-anchor="middle" font-weight="600">halve-at-half, pop again: the same shrink, the same 4 copies. cost 5</text>

  <text class="muted" x="72" y="94" text-anchor="end">before</text>
  <rect x="80"  y="70" width="40" height="36" rx="3" fill="#4c8dd6" opacity="0.5"/>
  <rect x="120" y="70" width="40" height="36" rx="3" fill="#4c8dd6" opacity="0.5"/>
  <rect x="160" y="70" width="40" height="36" rx="3" fill="#4c8dd6" opacity="0.5"/>
  <rect x="200" y="70" width="40" height="36" rx="3" fill="#4c8dd6" opacity="0.5"/>
  <rect x="240" y="70" width="40" height="36" rx="3" fill="#e2903a" opacity="0.5"/>
  <rect x="80"  y="70" width="40" height="36" rx="3" fill="none" stroke="currentColor"/>
  <rect x="120" y="70" width="40" height="36" rx="3" fill="none" stroke="currentColor"/>
  <rect x="160" y="70" width="40" height="36" rx="3" fill="none" stroke="currentColor"/>
  <rect x="200" y="70" width="40" height="36" rx="3" fill="none" stroke="currentColor"/>
  <rect x="240" y="70" width="40" height="36" rx="3" fill="none" stroke="currentColor"/>
  <rect x="280" y="70" width="40" height="36" rx="3" fill="none" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5"/>
  <rect x="320" y="70" width="40" height="36" rx="3" fill="none" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5"/>
  <rect x="360" y="70" width="40" height="36" rx="3" fill="none" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5"/>
  <text class="muted" x="412" y="94">capacity 8, n = 5 — pop the amber element</text>

  <text class="muted" x="72" y="174" text-anchor="end">after</text>
  <rect x="80"  y="150" width="40" height="36" rx="3" fill="#4c8dd6" opacity="0.5"/>
  <rect x="120" y="150" width="40" height="36" rx="3" fill="#4c8dd6" opacity="0.5"/>
  <rect x="160" y="150" width="40" height="36" rx="3" fill="#4c8dd6" opacity="0.5"/>
  <rect x="200" y="150" width="40" height="36" rx="3" fill="#4c8dd6" opacity="0.5"/>
  <rect x="80"  y="150" width="40" height="36" rx="3" fill="none" stroke="currentColor"/>
  <rect x="120" y="150" width="40" height="36" rx="3" fill="none" stroke="currentColor"/>
  <rect x="160" y="150" width="40" height="36" rx="3" fill="none" stroke="currentColor"/>
  <rect x="200" y="150" width="40" height="36" rx="3" fill="none" stroke="currentColor"/>
  <text class="muted" x="252" y="174">capacity 4, full — exactly frame 1's result</text>

  <text class="muted" x="80" y="222">pop, push, pop, push, … at this boundary: every single operation copies all ≈ n elements</text>
</svg>

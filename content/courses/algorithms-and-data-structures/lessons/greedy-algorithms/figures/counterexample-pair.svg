<svg viewBox="0 0 640 220" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
<style>.label { fill: currentColor; } .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }</style>

<text class="label" x="40" y="28" font-weight="600">shortest interval first</text>
<text class="label" x="340" y="28" font-weight="600">earliest finish time first</text>
<line x1="320" y1="16" x2="320" y2="196" stroke="currentColor" opacity="0.25"/>

<!-- left panel: picks S, blocks both long intervals -->
<rect x="70" y="52" width="90" height="16" rx="3" fill="currentColor" opacity="0.22"/>
<text class="muted" x="64" y="64" text-anchor="end">[1,4)</text>
<text class="muted" x="166" y="65">&#215;</text>
<rect x="130" y="84" width="60" height="16" rx="3" fill="#e2903a"/>
<text class="muted" x="124" y="96" text-anchor="end">[3,5)</text>
<rect x="160" y="116" width="90" height="16" rx="3" fill="currentColor" opacity="0.22"/>
<text class="muted" x="154" y="128" text-anchor="end">[4,7)</text>
<text class="muted" x="256" y="129">&#215;</text>
<text class="label" x="40" y="168">the short interval straddles both long ones</text>
<text class="label" x="40" y="192" font-weight="600">tally: 1 interval</text>

<!-- right panel: picks both long intervals -->
<rect x="370" y="52" width="90" height="16" rx="3" fill="#e2903a"/>
<text class="muted" x="364" y="64" text-anchor="end">[1,4)</text>
<rect x="430" y="84" width="60" height="16" rx="3" fill="currentColor" opacity="0.22"/>
<text class="muted" x="424" y="96" text-anchor="end">[3,5)</text>
<text class="muted" x="496" y="97">&#215;</text>
<rect x="460" y="116" width="90" height="16" rx="3" fill="#e2903a"/>
<text class="muted" x="454" y="128" text-anchor="end">[4,7)</text>
<text class="label" x="340" y="168">[1,4) finishes first; [4,7) then fits</text>
<text class="label" x="340" y="192" font-weight="600">tally: 2 intervals</text>
</svg>

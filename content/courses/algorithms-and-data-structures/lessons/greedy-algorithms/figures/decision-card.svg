<svg viewBox="0 0 640 312" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
<style>.label { fill: currentColor; } .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }</style>

<text class="label" x="24" y="26" font-weight="600">the greedy design card: two properties, one fork</text>

<rect x="24" y="42" width="592" height="60" rx="5" fill="none" stroke="currentColor" stroke-width="1.4"/>
<text class="label" x="38" y="66" font-weight="600">1&#8202;&#183;&#8202;optimal substructure</text>
<text class="muted" x="38" y="84">an optimal solution contains an optimal solution to the subproblem a choice leaves behind &#8212; needed by greedy AND dynamic programming</text>

<rect x="24" y="116" width="592" height="60" rx="5" fill="none" stroke="currentColor" stroke-width="1.4"/>
<text class="label" x="38" y="140" font-weight="600">2&#8202;&#183;&#8202;greedy-choice property</text>
<text class="muted" x="38" y="158">some optimal solution makes the locally best first choice &#8212; proved by an exchange argument, never assumed</text>

<line x1="180" y1="176" x2="164" y2="212" stroke="currentColor" opacity="0.5" stroke-width="1.2"/>
<line x1="460" y1="176" x2="476" y2="212" stroke="currentColor" opacity="0.5" stroke-width="1.2"/>
<text class="muted" x="120" y="204">both hold</text>
<text class="muted" x="452" y="204">only property 1 holds</text>

<rect x="24" y="216" width="284" height="72" rx="5" fill="none" stroke="#e2903a" stroke-width="1.6"/>
<text x="38" y="240" fill="#e2903a" font-weight="600">greedy</text>
<text x="38" y="258" fill="#e2903a">sort by the criterion, one sweep,</text>
<text x="38" y="276" fill="#e2903a">never backtrack &#8212; O(n log n)</text>

<rect x="332" y="216" width="284" height="72" rx="5" fill="none" stroke="#4c8dd6" stroke-width="1.6"/>
<text x="346" y="240" fill="#4c8dd6" font-weight="600">dynamic programming</text>
<text x="346" y="258" fill="#4c8dd6">solve every subproblem, compare</text>
<text x="346" y="276" fill="#4c8dd6">the answers &#8212; next lesson</text>
</svg>

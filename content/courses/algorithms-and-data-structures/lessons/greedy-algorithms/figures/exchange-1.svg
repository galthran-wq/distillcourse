<svg viewBox="0 0 640 250" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
<style>.label { fill: currentColor; } .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }</style>

<text class="label" x="24" y="24" font-weight="600">frame 1 · two schedules of size 3</text>

<text class="muted" x="60" y="58">an optimal schedule O</text>
<rect x="60" y="66" width="212" height="18" rx="3" fill="#4c8dd6"/>
<text x="66" y="79" fill="#fff" font-size="11">o&#8321; [0,4)</text>
<rect x="325" y="66" width="106" height="18" rx="3" fill="#4c8dd6"/>
<text x="331" y="79" fill="#fff" font-size="11">o&#8322; [5,7)</text>
<rect x="484" y="66" width="106" height="18" rx="3" fill="#4c8dd6"/>
<text x="490" y="79" fill="#fff" font-size="11">o&#8323; [8,10)</text>

<text class="muted" x="60" y="138">the greedy schedule G</text>
<rect x="113" y="146" width="106" height="18" rx="3" fill="#e2903a"/>
<text x="119" y="159" fill="#fff" font-size="11">g&#8321; [1,3)</text>
<rect x="272" y="146" width="106" height="18" rx="3" fill="#e2903a"/>
<text x="278" y="159" fill="#fff" font-size="11">g&#8322; [4,6)</text>
<rect x="431" y="146" width="106" height="18" rx="3" fill="#e2903a"/>
<text x="437" y="159" fill="#fff" font-size="11">g&#8323; [7,9)</text>

<line x1="219" y1="141" x2="255" y2="94" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5"/>
<text class="label" x="60" y="205">the first entries differ, and g&#8321; finishes no later than o&#8321;: 3 &#8804; 4</text>
<text class="muted" x="60" y="225">every later interval of O starts at or after o&#8321;&#8217;s finish, hence after g&#8321;&#8217;s</text>
</svg>

<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
<style>.label { fill: currentColor; } .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }</style>

<text class="label" x="24" y="24" font-weight="600">one criterion, two problems: capacity 50 lb</text>

<!-- item legend -->
<rect x="24" y="52" width="12" height="12" rx="2" fill="#e2903a"/>
<text class="label" x="42" y="62">item 1: 10 lb, $60</text>
<text class="muted" x="42" y="77">$6 / lb &#8212; best ratio</text>
<rect x="24" y="96" width="12" height="12" rx="2" fill="#4c8dd6"/>
<text class="label" x="42" y="106">item 2: 20 lb, $100</text>
<text class="muted" x="42" y="121">$5 / lb</text>
<rect x="24" y="140" width="12" height="12" rx="2" fill="#5aa46a"/>
<text class="label" x="42" y="150">item 3: 30 lb, $120</text>
<text class="muted" x="42" y="165">$4 / lb &#8212; worst ratio</text>

<!-- column A: fractional greedy -->
<text class="label" x="270" y="52" text-anchor="middle">fractional</text>
<text class="muted" x="270" y="66" text-anchor="middle">greedy by $/lb</text>
<rect x="230" y="76" width="80" height="200" rx="3" fill="none" stroke="currentColor" stroke-width="1.2"/>
<rect x="230" y="76" width="80" height="80" fill="#5aa46a"/>
<text x="270" y="106" text-anchor="middle" fill="#fff" font-size="11">20 of 30 lb</text>
<text x="270" y="121" text-anchor="middle" fill="#fff" font-size="11">$80</text>
<rect x="230" y="156" width="80" height="80" fill="#4c8dd6"/>
<text x="270" y="200" text-anchor="middle" fill="#fff" font-size="11">$100</text>
<rect x="230" y="236" width="80" height="40" fill="#e2903a"/>
<text x="270" y="260" text-anchor="middle" fill="#fff" font-size="11">$60</text>
<text class="label" x="270" y="298" text-anchor="middle" font-weight="600">$240 &#8212; optimal</text>

<!-- column B: 0/1 greedy -->
<text class="label" x="410" y="52" text-anchor="middle">0/1</text>
<text class="muted" x="410" y="66" text-anchor="middle">greedy by $/lb</text>
<rect x="370" y="76" width="80" height="200" rx="3" fill="none" stroke="currentColor" stroke-width="1.2"/>
<rect x="370" y="76" width="80" height="80" fill="none" stroke="currentColor" stroke-dasharray="4 3" opacity="0.5"/>
<text class="muted" x="410" y="112" text-anchor="middle">20 lb</text>
<text class="muted" x="410" y="127" text-anchor="middle">empty</text>
<rect x="370" y="156" width="80" height="80" fill="#4c8dd6"/>
<text x="410" y="200" text-anchor="middle" fill="#fff" font-size="11">$100</text>
<rect x="370" y="236" width="80" height="40" fill="#e2903a"/>
<text x="410" y="260" text-anchor="middle" fill="#fff" font-size="11">$60</text>
<text class="label" x="410" y="298" text-anchor="middle" font-weight="600">$160</text>

<!-- column C: 0/1 optimal -->
<text class="label" x="550" y="52" text-anchor="middle">0/1</text>
<text class="muted" x="550" y="66" text-anchor="middle">optimal: skip item 1</text>
<rect x="510" y="76" width="80" height="200" rx="3" fill="none" stroke="currentColor" stroke-width="1.2"/>
<rect x="510" y="76" width="80" height="120" fill="#5aa46a"/>
<text x="550" y="140" text-anchor="middle" fill="#fff" font-size="11">$120</text>
<rect x="510" y="196" width="80" height="80" fill="#4c8dd6"/>
<text x="550" y="240" text-anchor="middle" fill="#fff" font-size="11">$100</text>
<text class="label" x="550" y="298" text-anchor="middle" font-weight="600">$220</text>
</svg>

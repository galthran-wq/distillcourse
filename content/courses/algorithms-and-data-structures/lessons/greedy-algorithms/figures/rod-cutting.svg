<svg viewBox="0 0 640 250" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
<style>.label { fill: currentColor; } .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }</style>

<text class="label" x="24" y="24" font-weight="600">rod of length 7, two ways to cut it</text>

<text class="label" x="70" y="62">greedy: best value per unit first (length 6 rates 31/6 &#8776; 5.2 per unit)</text>
<rect x="70" y="72" width="420" height="26" rx="3" fill="#e2903a"/>
<text x="280" y="89" text-anchor="middle" fill="#fff">length 6 &#8594; 31</text>
<rect x="490" y="72" width="70" height="26" rx="3" fill="currentColor" opacity="0.22"/>
<text class="label" x="525" y="89" text-anchor="middle">1 &#8594; 1</text>
<text class="label" x="575" y="90" font-weight="600">= 32</text>

<text class="label" x="70" y="142">optimal: three modest pieces</text>
<rect x="70" y="152" width="140" height="26" rx="3" fill="#4c8dd6"/>
<text x="140" y="169" text-anchor="middle" fill="#fff">2 &#8594; 10</text>
<rect x="210" y="152" width="140" height="26" rx="3" fill="#4c8dd6"/>
<text x="280" y="169" text-anchor="middle" fill="#fff">2 &#8594; 10</text>
<rect x="350" y="152" width="210" height="26" rx="3" fill="#5aa46a"/>
<text x="455" y="169" text-anchor="middle" fill="#fff">3 &#8594; 13</text>
<text class="label" x="575" y="170" font-weight="600">= 33</text>

<!-- unit ticks -->
<g stroke="currentColor" opacity="0.35">
  <line x1="70" y1="192" x2="560" y2="192"/>
  <line x1="70" y1="188" x2="70" y2="196"/><line x1="140" y1="188" x2="140" y2="196"/>
  <line x1="210" y1="188" x2="210" y2="196"/><line x1="280" y1="188" x2="280" y2="196"/>
  <line x1="350" y1="188" x2="350" y2="196"/><line x1="420" y1="188" x2="420" y2="196"/>
  <line x1="490" y1="188" x2="490" y2="196"/><line x1="560" y1="188" x2="560" y2="196"/>
</g>
<g class="muted" text-anchor="middle">
  <text x="70" y="210">0</text><text x="140" y="210">1</text><text x="210" y="210">2</text>
  <text x="280" y="210">3</text><text x="350" y="210">4</text><text x="420" y="210">5</text>
  <text x="490" y="210">6</text><text x="560" y="210">7</text>
</g>

<text class="muted" x="70" y="236">lengths 2 and 3 rate only 5.0 and 4.3 per unit; no single ratio sees the combination</text>
</svg>

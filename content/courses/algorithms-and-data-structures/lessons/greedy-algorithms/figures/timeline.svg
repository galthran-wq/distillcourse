<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
<style>.label { fill: currentColor; } .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }</style>

<text class="label" x="24" y="20" font-weight="600">earliest finish time first: one sweep in finish order</text>

<!-- dashed frontier guides at f = 4, 7, 10 -->
<line x1="202" y1="30" x2="202" y2="252" stroke="#e2903a" stroke-dasharray="3 3" opacity="0.5"/>
<line x1="301" y1="30" x2="301" y2="252" stroke="#e2903a" stroke-dasharray="3 3" opacity="0.5"/>
<line x1="400" y1="30" x2="400" y2="252" stroke="#e2903a" stroke-dasharray="3 3" opacity="0.5"/>

<!-- rows, sorted by finish time -->
<!-- a1 [1,4) selected -->
<text class="label" x="97" y="49" text-anchor="end">a1</text>
<rect x="103" y="37" width="99" height="16" rx="3" fill="#e2903a"/>
<!-- a2 [3,5) rejected -->
<text class="muted" x="163" y="75" text-anchor="end">a2</text>
<rect x="169" y="63" width="66" height="16" rx="3" fill="currentColor" opacity="0.22"/>
<text class="muted" x="241" y="76">starts at 3 &#60; 4</text>
<!-- a3 [0,6) rejected -->
<text class="muted" x="64" y="101" text-anchor="end">a3</text>
<rect x="70" y="89" width="198" height="16" rx="3" fill="currentColor" opacity="0.22"/>
<text class="muted" x="274" y="102">starts at 0 &#60; 4</text>
<!-- a4 [4,7) selected -->
<text class="label" x="196" y="127" text-anchor="end">a4</text>
<rect x="202" y="115" width="99" height="16" rx="3" fill="#e2903a"/>
<!-- a5 [2,9) rejected -->
<text class="muted" x="130" y="153" text-anchor="end">a5</text>
<rect x="136" y="141" width="231" height="16" rx="3" fill="currentColor" opacity="0.22"/>
<text class="muted" x="373" y="154">starts at 2 &#60; 7</text>
<!-- a6 [7,10) selected -->
<text class="label" x="295" y="179" text-anchor="end">a6</text>
<rect x="301" y="167" width="99" height="16" rx="3" fill="#e2903a"/>
<!-- a7 [8,14) rejected -->
<text class="muted" x="328" y="205" text-anchor="end">a7</text>
<rect x="334" y="193" width="198" height="16" rx="3" fill="currentColor" opacity="0.22"/>
<text class="muted" x="538" y="206">starts at 8 &#60; 10</text>
<!-- a8 [12,16) selected -->
<text class="label" x="460" y="231" text-anchor="end">a8</text>
<rect x="466" y="219" width="132" height="16" rx="3" fill="#e2903a"/>

<!-- axis -->
<line x1="70" y1="252" x2="598" y2="252" stroke="currentColor" stroke-width="1.2"/>
<g class="muted" text-anchor="middle">
  <text x="70" y="268">0</text>
  <text x="136" y="268">2</text>
  <text x="202" y="268">4</text>
  <text x="268" y="268">6</text>
  <text x="334" y="268">8</text>
  <text x="400" y="268">10</text>
  <text x="466" y="268">12</text>
  <text x="532" y="268">14</text>
  <text x="598" y="268">16</text>
</g>

<!-- legend -->
<rect x="70" y="280" width="12" height="12" rx="2" fill="#e2903a"/>
<text class="label" x="88" y="290">selected: 4 intervals</text>
<rect x="230" y="280" width="12" height="12" rx="2" fill="currentColor" opacity="0.22"/>
<text class="muted" x="248" y="290">rejected: starts before the last selected finish (dashed lines)</text>
</svg>

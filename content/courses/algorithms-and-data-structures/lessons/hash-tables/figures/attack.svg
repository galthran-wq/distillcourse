<svg viewBox="0 0 640 350" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .hot { fill: #e2903a; font-size: 11px; }
    .cool { fill: #4c8dd6; font-size: 11px; }
    .slot { fill: none; stroke: currentColor; opacity: 0.7; }
  </style>
  <defs>
    <marker id="at-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- panel A -->
  <text class="cool" x="30" y="26" font-weight="600" font-size="13">8 ordinary keys</text>
  <text class="muted" x="30" y="44">α = 1, chains of length 1</text>

  <rect class="slot" x="60" y="60" width="30" height="20" rx="3"/>
  <rect x="98" y="60" width="30" height="20" rx="3" fill="#4c8dd6" fill-opacity="0.25" stroke="#4c8dd6"/>
  <rect class="slot" x="60" y="86" width="30" height="20" rx="3"/>
  <rect x="98" y="86" width="30" height="20" rx="3" fill="#4c8dd6" fill-opacity="0.25" stroke="#4c8dd6"/>
  <rect class="slot" x="60" y="112" width="30" height="20" rx="3"/>
  <rect x="98" y="112" width="30" height="20" rx="3" fill="#4c8dd6" fill-opacity="0.25" stroke="#4c8dd6"/>
  <rect class="slot" x="60" y="138" width="30" height="20" rx="3"/>
  <rect x="98" y="138" width="30" height="20" rx="3" fill="#4c8dd6" fill-opacity="0.25" stroke="#4c8dd6"/>
  <rect class="slot" x="60" y="164" width="30" height="20" rx="3"/>
  <rect x="98" y="164" width="30" height="20" rx="3" fill="#4c8dd6" fill-opacity="0.25" stroke="#4c8dd6"/>
  <rect class="slot" x="60" y="190" width="30" height="20" rx="3"/>
  <rect x="98" y="190" width="30" height="20" rx="3" fill="#4c8dd6" fill-opacity="0.25" stroke="#4c8dd6"/>
  <rect class="slot" x="60" y="216" width="30" height="20" rx="3"/>
  <rect x="98" y="216" width="30" height="20" rx="3" fill="#4c8dd6" fill-opacity="0.25" stroke="#4c8dd6"/>
  <rect class="slot" x="60" y="242" width="30" height="20" rx="3"/>
  <rect x="98" y="242" width="30" height="20" rx="3" fill="#4c8dd6" fill-opacity="0.25" stroke="#4c8dd6"/>

  <text class="cool" x="30" y="288">each insert scans a chain of length ≤ 1</text>
  <text class="cool" x="30" y="308" font-weight="600" font-size="13">total for n inserts: n</text>

  <!-- divider arrow -->
  <line x1="196" y1="152" x2="248" y2="152" stroke="currentColor" opacity="0.7" marker-end="url(#at-arrow)"/>
  <text class="muted" x="222" y="142" text-anchor="middle">same code</text>
  <text class="muted" x="222" y="172" text-anchor="middle">different keys</text>

  <!-- panel B -->
  <text class="hot" x="300" y="26" font-weight="600" font-size="13">8 attacker-chosen keys, one hash code</text>
  <text class="muted" x="300" y="44">"AaAa…", "AaBB…", "BBAa…": every one hashes to slot 3</text>

  <rect class="slot" x="320" y="60" width="30" height="20" rx="3"/>
  <text class="muted" x="358" y="75">empty</text>
  <rect class="slot" x="320" y="86" width="30" height="20" rx="3"/>
  <text class="muted" x="358" y="101">empty</text>
  <rect class="slot" x="320" y="112" width="30" height="20" rx="3"/>
  <text class="muted" x="358" y="127">empty</text>

  <rect x="320" y="138" width="30" height="20" rx="3" fill="#e2903a" fill-opacity="0.3" stroke="#e2903a"/>
  <rect x="358" y="138" width="24" height="20" rx="3" fill="#e2903a" fill-opacity="0.2" stroke="#e2903a"/>
  <rect x="386" y="138" width="24" height="20" rx="3" fill="#e2903a" fill-opacity="0.2" stroke="#e2903a"/>
  <rect x="414" y="138" width="24" height="20" rx="3" fill="#e2903a" fill-opacity="0.2" stroke="#e2903a"/>
  <rect x="442" y="138" width="24" height="20" rx="3" fill="#e2903a" fill-opacity="0.2" stroke="#e2903a"/>
  <rect x="470" y="138" width="24" height="20" rx="3" fill="#e2903a" fill-opacity="0.2" stroke="#e2903a"/>
  <rect x="498" y="138" width="24" height="20" rx="3" fill="#e2903a" fill-opacity="0.2" stroke="#e2903a"/>
  <rect x="526" y="138" width="24" height="20" rx="3" fill="#e2903a" fill-opacity="0.2" stroke="#e2903a"/>
  <rect x="554" y="138" width="24" height="20" rx="3" fill="#e2903a" fill-opacity="0.2" stroke="#e2903a"/>
  <text class="hot" x="586" y="153">…</text>

  <rect class="slot" x="320" y="164" width="30" height="20" rx="3"/>
  <text class="muted" x="358" y="179">empty</text>
  <rect class="slot" x="320" y="190" width="30" height="20" rx="3"/>
  <text class="muted" x="358" y="205">empty</text>
  <rect class="slot" x="320" y="216" width="30" height="20" rx="3"/>
  <text class="muted" x="358" y="231">empty</text>
  <rect class="slot" x="320" y="242" width="30" height="20" rx="3"/>
  <text class="muted" x="358" y="257">empty</text>

  <text class="hot" x="300" y="288">insert i scans the i − 1 keys already there</text>
  <text class="hot" x="300" y="308" font-weight="600" font-size="13">total for n inserts: n(n − 1)/2</text>

  <line x1="30" y1="322" x2="610" y2="322" stroke="currentColor" opacity="0.3"/>
  <text class="label" x="30" y="342" font-size="12">at n = 20,000 keys: 20,000 comparisons on the left, about 2 × 10⁸ on the right</text>
</svg>

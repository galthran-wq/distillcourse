<svg viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .hot { fill: #e2903a; }
    .slot { fill: none; stroke: currentColor; opacity: 0.7; }
    .node { fill: none; stroke: currentColor; opacity: 0.7; }
  </style>
  <defs>
    <marker id="ch-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor"/>
    </marker>
    <marker id="ch-hot" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#e2903a"/>
    </marker>
  </defs>

  <text class="label" x="24" y="26" font-weight="600">h(k) = k mod 9; keys 5, 28, 19, 15, 20, 33, 12, 17, 10, each prepended</text>

  <!-- slot column -->
  <text class="muted" x="140" y="40" text-anchor="middle">T</text>

  <!-- slot 0 -->
  <rect class="slot" x="120" y="46" width="40" height="26" rx="3"/>
  <text class="muted" x="112" y="64" text-anchor="end">0</text>
  <text class="muted" x="190" y="64">nil</text>

  <!-- slot 1 : 10 -> 19 -> 28  (highlighted search path) -->
  <rect x="120" y="76" width="40" height="26" rx="3" fill="#e2903a" fill-opacity="0.2" stroke="#e2903a"/>
  <text class="muted" x="112" y="94" text-anchor="end">1</text>
  <line x1="160" y1="89" x2="184" y2="89" stroke="#e2903a" stroke-width="1.6" marker-end="url(#ch-hot)"/>
  <rect x="186" y="78" width="46" height="22" rx="3" fill="none" stroke="#e2903a"/>
  <text class="hot" x="209" y="94" text-anchor="middle">10</text>
  <line x1="232" y1="89" x2="250" y2="89" stroke="#e2903a" stroke-width="1.6" marker-end="url(#ch-hot)"/>
  <rect x="252" y="78" width="46" height="22" rx="3" fill="none" stroke="#e2903a"/>
  <text class="hot" x="275" y="94" text-anchor="middle">19</text>
  <line x1="298" y1="89" x2="316" y2="89" stroke="#e2903a" stroke-width="1.6" marker-end="url(#ch-hot)"/>
  <rect x="318" y="78" width="46" height="22" rx="3" fill="#e2903a" fill-opacity="0.25" stroke="#e2903a"/>
  <text class="hot" x="341" y="94" text-anchor="middle" font-weight="600">28</text>
  <text class="hot" x="378" y="94" font-size="11">search(28): 3 keys examined</text>

  <!-- slot 2 : 20 -->
  <rect class="slot" x="120" y="106" width="40" height="26" rx="3"/>
  <text class="muted" x="112" y="124" text-anchor="end">2</text>
  <line x1="160" y1="119" x2="184" y2="119" stroke="currentColor" opacity="0.6" marker-end="url(#ch-arrow)"/>
  <rect class="node" x="186" y="108" width="46" height="22" rx="3"/>
  <text class="label" x="209" y="124" text-anchor="middle">20</text>

  <!-- slot 3 : 12 -->
  <rect class="slot" x="120" y="136" width="40" height="26" rx="3"/>
  <text class="muted" x="112" y="154" text-anchor="end">3</text>
  <line x1="160" y1="149" x2="184" y2="149" stroke="currentColor" opacity="0.6" marker-end="url(#ch-arrow)"/>
  <rect class="node" x="186" y="138" width="46" height="22" rx="3"/>
  <text class="label" x="209" y="154" text-anchor="middle">12</text>

  <!-- slot 4 : empty -->
  <rect class="slot" x="120" y="166" width="40" height="26" rx="3"/>
  <text class="muted" x="112" y="184" text-anchor="end">4</text>
  <text class="muted" x="190" y="184">nil</text>

  <!-- slot 5 : 5 -->
  <rect class="slot" x="120" y="196" width="40" height="26" rx="3"/>
  <text class="muted" x="112" y="214" text-anchor="end">5</text>
  <line x1="160" y1="209" x2="184" y2="209" stroke="currentColor" opacity="0.6" marker-end="url(#ch-arrow)"/>
  <rect class="node" x="186" y="198" width="46" height="22" rx="3"/>
  <text class="label" x="209" y="214" text-anchor="middle">5</text>

  <!-- slot 6 : 33 -> 15 -->
  <rect class="slot" x="120" y="226" width="40" height="26" rx="3"/>
  <text class="muted" x="112" y="244" text-anchor="end">6</text>
  <line x1="160" y1="239" x2="184" y2="239" stroke="currentColor" opacity="0.6" marker-end="url(#ch-arrow)"/>
  <rect class="node" x="186" y="228" width="46" height="22" rx="3"/>
  <text class="label" x="209" y="244" text-anchor="middle">33</text>
  <line x1="232" y1="239" x2="250" y2="239" stroke="currentColor" opacity="0.6" marker-end="url(#ch-arrow)"/>
  <rect class="node" x="252" y="228" width="46" height="22" rx="3"/>
  <text class="label" x="275" y="244" text-anchor="middle">15</text>

  <!-- slot 7 : empty -->
  <rect class="slot" x="120" y="256" width="40" height="26" rx="3"/>
  <text class="muted" x="112" y="274" text-anchor="end">7</text>
  <text class="muted" x="190" y="274">nil</text>

  <!-- slot 8 : 17 -->
  <rect class="slot" x="120" y="286" width="40" height="26" rx="3"/>
  <text class="muted" x="112" y="304" text-anchor="end">8</text>
  <line x1="160" y1="299" x2="184" y2="299" stroke="currentColor" opacity="0.6" marker-end="url(#ch-arrow)"/>
  <rect class="node" x="186" y="288" width="46" height="22" rx="3"/>
  <text class="label" x="209" y="304" text-anchor="middle">17</text>

  <!-- summary -->
  <line x1="24" y1="330" x2="616" y2="330" stroke="currentColor" opacity="0.3"/>
  <text class="label" x="24" y="352">load factor α = n/m = 9/9 = 1 — the average chain holds one key</text>
  <text class="muted" x="24" y="370">chain lengths 0, 3, 1, 1, 0, 1, 2, 0, 1: the longest is three times the average</text>
</svg>

<svg viewBox="0 0 640 220" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .hot { fill: #e2903a; font-size: 12px; }
    .slot { fill: none; stroke: currentColor; opacity: 0.6; }
  </style>
  <defs>
    <marker id="da-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- key chips above their own slots -->
  <rect x="130" y="18" width="56" height="22" rx="4" fill="#4c8dd6" fill-opacity="0.2" stroke="#4c8dd6"/>
  <text x="158" y="33" text-anchor="middle" fill="#4c8dd6" font-size="12">key 2</text>
  <rect x="274" y="18" width="56" height="22" rx="4" fill="#4c8dd6" fill-opacity="0.2" stroke="#4c8dd6"/>
  <text x="302" y="33" text-anchor="middle" fill="#4c8dd6" font-size="12">key 5</text>
  <rect x="418" y="18" width="56" height="22" rx="4" fill="#4c8dd6" fill-opacity="0.2" stroke="#4c8dd6"/>
  <text x="446" y="33" text-anchor="middle" fill="#4c8dd6" font-size="12">key 8</text>

  <line x1="158" y1="42" x2="158" y2="76" stroke="currentColor" opacity="0.7" marker-end="url(#da-arrow)"/>
  <line x1="302" y1="42" x2="302" y2="76" stroke="currentColor" opacity="0.7" marker-end="url(#da-arrow)"/>
  <line x1="446" y1="42" x2="446" y2="76" stroke="currentColor" opacity="0.7" marker-end="url(#da-arrow)"/>
  <text class="muted" x="600" y="33" text-anchor="end">no hash function —</text>
  <text class="muted" x="600" y="48" text-anchor="end">the key is the address</text>

  <!-- the array: slots 0..9, ellipsis, u−1 -->
  <rect class="slot" x="40" y="80" width="44" height="30" rx="3"/>
  <rect class="slot" x="88" y="80" width="44" height="30" rx="3"/>
  <rect x="136" y="80" width="44" height="30" rx="3" fill="#e2903a" fill-opacity="0.25" stroke="#e2903a"/>
  <rect class="slot" x="184" y="80" width="44" height="30" rx="3"/>
  <rect class="slot" x="232" y="80" width="44" height="30" rx="3"/>
  <rect x="280" y="80" width="44" height="30" rx="3" fill="#e2903a" fill-opacity="0.25" stroke="#e2903a"/>
  <rect class="slot" x="328" y="80" width="44" height="30" rx="3"/>
  <rect class="slot" x="376" y="80" width="44" height="30" rx="3"/>
  <rect x="424" y="80" width="44" height="30" rx="3" fill="#e2903a" fill-opacity="0.25" stroke="#e2903a"/>
  <rect class="slot" x="472" y="80" width="44" height="30" rx="3"/>
  <text class="label" x="530" y="101" text-anchor="middle">⋯</text>
  <rect class="slot" x="548" y="80" width="52" height="30" rx="3"/>

  <text class="hot" x="158" y="100" text-anchor="middle">rec 2</text>
  <text class="hot" x="302" y="100" text-anchor="middle">rec 5</text>
  <text class="hot" x="446" y="100" text-anchor="middle">rec 8</text>

  <text class="muted" x="62" y="126" text-anchor="middle">0</text>
  <text class="muted" x="110" y="126" text-anchor="middle">1</text>
  <text class="muted" x="158" y="126" text-anchor="middle">2</text>
  <text class="muted" x="206" y="126" text-anchor="middle">3</text>
  <text class="muted" x="254" y="126" text-anchor="middle">4</text>
  <text class="muted" x="302" y="126" text-anchor="middle">5</text>
  <text class="muted" x="350" y="126" text-anchor="middle">6</text>
  <text class="muted" x="398" y="126" text-anchor="middle">7</text>
  <text class="muted" x="446" y="126" text-anchor="middle">8</text>
  <text class="muted" x="494" y="126" text-anchor="middle">9</text>
  <text class="muted" x="574" y="126" text-anchor="middle">u − 1</text>

  <!-- the bill -->
  <path d="M40,140 L40,148 L600,148 L600,140" fill="none" stroke="currentColor" opacity="0.6"/>
  <text class="label" x="320" y="168" text-anchor="middle" font-size="12">u slots allocated up front — Θ(u) space, a property of the key type</text>
  <text class="hot" x="320" y="192" text-anchor="middle">n = 3 slots in use — the other u − 3 are paid for and hold nil</text>
</svg>

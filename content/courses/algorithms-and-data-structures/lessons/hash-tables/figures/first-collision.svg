<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .hot { fill: #e2903a; }
  </style>

  <text class="label" x="320" y="24" text-anchor="middle" font-weight="600">probability that some two keys share a slot — m = 365 slots</text>

  <!-- axes -->
  <line x1="70" y1="220" x2="580" y2="220" stroke="currentColor" opacity="0.7"/>
  <line x1="70" y1="42" x2="70" y2="220" stroke="currentColor" opacity="0.7"/>

  <!-- half line -->
  <line x1="70" y1="135" x2="580" y2="135" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5"/>
  <text class="muted" x="64" y="139" text-anchor="end">0.5</text>
  <text class="muted" x="64" y="224" text-anchor="end">0</text>
  <text class="muted" x="64" y="54" text-anchor="end">1.0</text>

  <!-- curve -->
  <polyline fill="none" stroke="#4c8dd6" stroke-width="2"
    points="70,220 111.7,215.4 153.3,200.1 195,177.0 236.7,150.1 261.7,133.8 278.3,123.3 320,100.0 361.7,81.6 403.3,68.5 445,60.0 486.7,55.1 528.3,52.4 570,51.0"/>

  <!-- marker at 23 keys -->
  <line x1="261.7" y1="133.8" x2="261.7" y2="220" stroke="#e2903a" stroke-dasharray="3 3"/>
  <circle cx="261.7" cy="133.8" r="4" fill="#e2903a"/>
  <text class="hot" x="252" y="100" text-anchor="end" font-size="11">23 keys — even odds</text>
  <text class="muted" x="252" y="116" text-anchor="end">load factor α = 23/365 = 0.063</text>

  <!-- rule of thumb -->
  <text class="muted" x="400" y="176">first collision at about √(πm/2) keys</text>
  <text class="muted" x="400" y="192">= 24 here, 1,253 for m = 10⁶</text>

  <!-- x labels -->
  <text class="muted" x="70" y="240" text-anchor="middle">0</text>
  <text class="muted" x="236.7" y="240" text-anchor="middle">20</text>
  <text class="muted" x="403.3" y="240" text-anchor="middle">40</text>
  <text class="muted" x="570" y="240" text-anchor="middle">60</text>
  <text class="muted" x="320" y="262" text-anchor="middle">keys inserted (the table is under 17% full across this whole range)</text>
</svg>

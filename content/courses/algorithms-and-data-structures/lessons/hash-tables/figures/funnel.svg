<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .hot { fill: #e2903a; }
  </style>
  <defs>
    <marker id="fn-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor"/>
    </marker>
    <marker id="fn-hot" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#e2903a"/>
    </marker>
  </defs>

  <!-- universe -->
  <rect x="24" y="42" width="196" height="222" rx="18" fill="none" stroke="currentColor" opacity="0.7"/>
  <text class="label" x="122" y="34" text-anchor="middle" font-weight="600">U — every possible key</text>
  <text class="muted" x="122" y="282" text-anchor="middle">|U| = 26¹⁰ for ten-letter names</text>

  <!-- stored keys -->
  <rect x="52" y="86" width="140" height="150" rx="12" fill="none" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5"/>
  <text class="muted" x="122" y="80" text-anchor="middle">K — the n keys stored</text>

  <circle cx="84" cy="118" r="4" fill="currentColor"/><text class="muted" x="84" y="136" text-anchor="middle">k₁</text>
  <circle cx="152" cy="112" r="4" fill="currentColor"/><text class="muted" x="152" y="102" text-anchor="middle">k₄</text>
  <circle cx="150" cy="160" r="4" fill="#e2903a"/><text class="hot" x="150" y="178" text-anchor="middle" font-size="11">k₅</text>
  <circle cx="82" cy="192" r="4" fill="#e2903a"/><text class="hot" x="82" y="182" text-anchor="middle" font-size="11">k₂</text>
  <circle cx="128" cy="206" r="4" fill="currentColor"/><text class="muted" x="128" y="224" text-anchor="middle">k₃</text>

  <!-- hash function label -->
  <text class="label" x="330" y="30" text-anchor="middle" font-weight="600">h : U → {0, …, m−1}</text>
  <text class="muted" x="330" y="48" text-anchor="middle">one computation, no comparisons</text>

  <!-- arrows -->
  <line x1="92" y1="118" x2="452" y2="82" stroke="currentColor" opacity="0.6" marker-end="url(#fn-arrow)"/>
  <line x1="160" y1="112" x2="452" y2="138" stroke="currentColor" opacity="0.6" marker-end="url(#fn-arrow)"/>
  <line x1="136" y1="208" x2="452" y2="250" stroke="currentColor" opacity="0.6" marker-end="url(#fn-arrow)"/>
  <line x1="158" y1="160" x2="452" y2="194" stroke="#e2903a" stroke-width="1.6" marker-end="url(#fn-hot)"/>
  <line x1="90" y1="192" x2="452" y2="194" stroke="#e2903a" stroke-width="1.6" marker-end="url(#fn-hot)"/>

  <!-- table -->
  <text class="label" x="512" y="34" text-anchor="middle" font-weight="600">T — m slots</text>
  <rect x="458" y="42" width="108" height="24" rx="3" fill="none" stroke="currentColor" opacity="0.7"/>
  <rect x="458" y="70" width="108" height="24" rx="3" fill="none" stroke="currentColor" opacity="0.7"/>
  <rect x="458" y="98" width="108" height="24" rx="3" fill="none" stroke="currentColor" opacity="0.7"/>
  <rect x="458" y="126" width="108" height="24" rx="3" fill="none" stroke="currentColor" opacity="0.7"/>
  <rect x="458" y="154" width="108" height="24" rx="3" fill="none" stroke="currentColor" opacity="0.7"/>
  <rect x="458" y="182" width="108" height="24" rx="3" fill="#e2903a" fill-opacity="0.22" stroke="#e2903a"/>
  <rect x="458" y="210" width="108" height="24" rx="3" fill="none" stroke="currentColor" opacity="0.7"/>
  <rect x="458" y="238" width="108" height="24" rx="3" fill="none" stroke="currentColor" opacity="0.7"/>

  <text class="muted" x="450" y="59" text-anchor="end">0</text>
  <text class="muted" x="450" y="199" text-anchor="end">5</text>
  <text class="muted" x="450" y="255" text-anchor="end">7</text>

  <text class="label" x="512" y="87">k₁</text>
  <text class="label" x="512" y="143">k₄</text>
  <text class="hot" x="512" y="199" font-weight="600">k₂ , k₅</text>
  <text class="label" x="512" y="255">k₃</text>

  <text class="hot" x="580" y="199" font-size="11">collision</text>
  <text class="muted" x="512" y="282" text-anchor="middle">m ≈ n slots</text>
</svg>

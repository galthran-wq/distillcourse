<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .hot { fill: #e2903a; font-size: 12px; }
    .bit { fill: none; stroke: #4c8dd6; }
    .out { fill: #e2903a; fill-opacity: 0.3; stroke: #e2903a; }
    .copy { stroke: #e2903a; stroke-width: 1.5; opacity: 0.8; }
    .mix { stroke: #e2903a; opacity: 0.35; }
  </style>

  <!-- ===================== panel 1: division ===================== -->
  <text class="label" x="24" y="24" font-weight="600">division, m = 2ᵖ</text>
  <text class="muted" x="176" y="24">h(k) = k mod 2ᵖ — keep the low p bits, discard the rest</text>

  <text class="muted" x="24" y="55">k</text>
  <!-- 16 input bits, pitch 21, x0 = 40, y = 42, size 16 -->
  <rect class="bit" opacity="0.35" x="40" y="42" width="16" height="16" rx="2"/>
  <rect class="bit" opacity="0.35" x="61" y="42" width="16" height="16" rx="2"/>
  <rect class="bit" opacity="0.35" x="82" y="42" width="16" height="16" rx="2"/>
  <rect class="bit" opacity="0.35" x="103" y="42" width="16" height="16" rx="2"/>
  <rect class="bit" opacity="0.35" x="124" y="42" width="16" height="16" rx="2"/>
  <rect class="bit" opacity="0.35" x="145" y="42" width="16" height="16" rx="2"/>
  <rect class="bit" opacity="0.35" x="166" y="42" width="16" height="16" rx="2"/>
  <rect class="bit" opacity="0.35" x="187" y="42" width="16" height="16" rx="2"/>
  <rect class="bit" opacity="0.35" x="208" y="42" width="16" height="16" rx="2"/>
  <rect class="bit" opacity="0.35" x="229" y="42" width="16" height="16" rx="2"/>
  <rect class="bit" opacity="0.35" x="250" y="42" width="16" height="16" rx="2"/>
  <rect class="bit" opacity="0.35" x="271" y="42" width="16" height="16" rx="2"/>
  <rect class="bit" x="292" y="42" width="16" height="16" rx="2"/>
  <rect class="bit" x="313" y="42" width="16" height="16" rx="2"/>
  <rect class="bit" x="334" y="42" width="16" height="16" rx="2"/>
  <rect class="bit" x="355" y="42" width="16" height="16" rx="2"/>

  <text class="muted" x="165" y="75" text-anchor="middle">high bits: never read</text>

  <!-- straight copies of the low 4 bits -->
  <line class="copy" x1="300" y1="58" x2="300" y2="96"/>
  <line class="copy" x1="321" y1="58" x2="321" y2="96"/>
  <line class="copy" x1="342" y1="58" x2="342" y2="96"/>
  <line class="copy" x1="363" y1="58" x2="363" y2="96"/>

  <rect class="out" x="292" y="96" width="16" height="16" rx="2"/>
  <rect class="out" x="313" y="96" width="16" height="16" rx="2"/>
  <rect class="out" x="334" y="96" width="16" height="16" rx="2"/>
  <rect class="out" x="355" y="96" width="16" height="16" rx="2"/>
  <text class="hot" x="382" y="109">h(k): the low p bits, copied unchanged</text>

  <text class="muted" x="24" y="140">any two keys equal in their low p bits collide — an arithmetic progression of stride m lands in one slot</text>

  <!-- ===================== panel 2: multiply-shift ===================== -->
  <text class="label" x="24" y="184" font-weight="600">multiply-shift, m = 2ˡ</text>
  <text class="muted" x="212" y="184">h(k) = top ℓ bits of (a · k mod 2ʷ), a odd — mix first, then keep</text>

  <text class="muted" x="24" y="215">k</text>
  <rect class="bit" x="40" y="202" width="16" height="16" rx="2"/>
  <rect class="bit" x="61" y="202" width="16" height="16" rx="2"/>
  <rect class="bit" x="82" y="202" width="16" height="16" rx="2"/>
  <rect class="bit" x="103" y="202" width="16" height="16" rx="2"/>
  <rect class="bit" x="124" y="202" width="16" height="16" rx="2"/>
  <rect class="bit" x="145" y="202" width="16" height="16" rx="2"/>
  <rect class="bit" x="166" y="202" width="16" height="16" rx="2"/>
  <rect class="bit" x="187" y="202" width="16" height="16" rx="2"/>
  <rect class="bit" x="208" y="202" width="16" height="16" rx="2"/>
  <rect class="bit" x="229" y="202" width="16" height="16" rx="2"/>
  <rect class="bit" x="250" y="202" width="16" height="16" rx="2"/>
  <rect class="bit" x="271" y="202" width="16" height="16" rx="2"/>
  <rect class="bit" x="292" y="202" width="16" height="16" rx="2"/>
  <rect class="bit" x="313" y="202" width="16" height="16" rx="2"/>
  <rect class="bit" x="334" y="202" width="16" height="16" rx="2"/>
  <rect class="bit" x="355" y="202" width="16" height="16" rx="2"/>

  <!-- every input bit routed into the kept bits: crossing lines -->
  <line class="mix" x1="48" y1="218" x2="300" y2="256"/>
  <line class="mix" x1="69" y1="218" x2="363" y2="256"/>
  <line class="mix" x1="90" y1="218" x2="342" y2="256"/>
  <line class="mix" x1="111" y1="218" x2="321" y2="256"/>
  <line class="mix" x1="132" y1="218" x2="300" y2="256"/>
  <line class="mix" x1="153" y1="218" x2="363" y2="256"/>
  <line class="mix" x1="174" y1="218" x2="342" y2="256"/>
  <line class="mix" x1="195" y1="218" x2="321" y2="256"/>
  <line class="mix" x1="216" y1="218" x2="300" y2="256"/>
  <line class="mix" x1="237" y1="218" x2="363" y2="256"/>
  <line class="mix" x1="258" y1="218" x2="342" y2="256"/>
  <line class="mix" x1="279" y1="218" x2="321" y2="256"/>
  <line class="mix" x1="300" y1="218" x2="300" y2="256"/>
  <line class="mix" x1="321" y1="218" x2="363" y2="256"/>
  <line class="mix" x1="342" y1="218" x2="342" y2="256"/>
  <line class="mix" x1="363" y1="218" x2="321" y2="256"/>

  <rect class="out" x="292" y="256" width="16" height="16" rx="2"/>
  <rect class="out" x="313" y="256" width="16" height="16" rx="2"/>
  <rect class="out" x="334" y="256" width="16" height="16" rx="2"/>
  <rect class="out" x="355" y="256" width="16" height="16" rx="2"/>
  <text class="hot" x="382" y="269">h(k): the top ℓ bits of the mixed word</text>

  <text class="muted" x="24" y="300">the carries of a · k route every input bit into the kept bits — three machine instructions</text>
</svg>

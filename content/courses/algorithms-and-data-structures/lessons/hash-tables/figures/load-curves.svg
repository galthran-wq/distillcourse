<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .hot { fill: #e2903a; }
    .ok { fill: #5aa46a; }
    .cool { fill: #4c8dd6; }
  </style>

  <text class="label" x="24" y="24" font-weight="600">expected slots touched per operation, against load factor α = n/m</text>

  <!-- legend, in the empty upper-left of the plot -->
  <line x1="100" y1="70" x2="122" y2="70" stroke="#4c8dd6" stroke-width="2"/>
  <text class="muted" x="128" y="74">chaining, 1 + α</text>
  <line x1="100" y1="88" x2="122" y2="88" stroke="#5aa46a" stroke-width="2"/>
  <text class="muted" x="128" y="92">linear probing, search hit</text>
  <line x1="100" y1="106" x2="122" y2="106" stroke="#e2903a" stroke-width="2"/>
  <text class="muted" x="128" y="110">linear probing, search miss / insert</text>

  <!-- axes -->
  <line x1="70" y1="230" x2="590" y2="230" stroke="currentColor" opacity="0.7"/>
  <line x1="70" y1="44" x2="70" y2="230" stroke="currentColor" opacity="0.7"/>

  <!-- gridlines -->
  <line x1="70" y1="170" x2="590" y2="170" stroke="currentColor" stroke-dasharray="3 3" opacity="0.35"/>
  <line x1="70" y1="110" x2="590" y2="110" stroke="currentColor" stroke-dasharray="3 3" opacity="0.35"/>
  <text class="muted" x="64" y="219" text-anchor="end">1</text>
  <text class="muted" x="64" y="174" text-anchor="end">4</text>
  <text class="muted" x="64" y="114" text-anchor="end">8</text>
  <text class="muted" x="64" y="54" text-anchor="end">12</text>

  <!-- chaining: 1 + alpha -->
  <line x1="70" y1="215" x2="570" y2="200.75" stroke="#4c8dd6" stroke-width="2"/>

  <!-- linear probing, search hit -->
  <polyline fill="none" stroke="#5aa46a" stroke-width="2"
    points="70,215 175.3,213.1 280.5,210 333.2,207.5 385.8,203.75 438.4,197.5 464.7,192.5 491.1,185 517.4,172.5 543.7,147.5 570,72.5"/>

  <!-- linear probing, search miss -->
  <polyline fill="none" stroke="#e2903a" stroke-width="2"
    points="70,215 175.3,210.8 280.5,201.7 333.2,192.5 385.8,175.6 438.4,139.2 464.7,102.5 486.6,50"/>
  <text class="hot" x="478" y="64" text-anchor="end" font-size="11">miss curve exits at α = 0.79</text>

  <!-- alpha = 0.9 marker -->
  <line x1="543.7" y1="44" x2="543.7" y2="230" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5"/>
  <text class="muted" x="543.7" y="250" text-anchor="middle">0.9</text>

  <!-- x labels -->
  <text class="muted" x="70" y="250" text-anchor="middle">0</text>
  <text class="muted" x="201.6" y="250" text-anchor="middle">0.25</text>
  <text class="muted" x="333.2" y="250" text-anchor="middle">0.5</text>
  <text class="muted" x="464.7" y="250" text-anchor="middle">0.75</text>
  <text class="muted" x="320" y="272" text-anchor="middle">load factor α — for open addressing the table is full at α = 1 and the curves have a pole there</text>
  <text class="muted" x="320" y="290" text-anchor="middle">at α = 0.9: chaining 1.9, probing hit 5.5, probing miss 50.5</text>
</svg>

<svg viewBox="0 0 640 270" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .hot { fill: #e2903a; }
    .ok { fill: #5aa46a; }
  </style>

  <text class="label" x="24" y="24" font-weight="600">what the hash table bought, and what it sold</text>

  <!-- header -->
  <text class="muted" x="24" y="54">operation</text>
  <text class="muted" x="300" y="54">sorted array</text>
  <text class="muted" x="450" y="54">hash table</text>
  <line x1="24" y1="62" x2="616" y2="62" stroke="currentColor" opacity="0.4"/>

  <!-- rows -->
  <rect x="440" y="68" width="176" height="58" rx="4" fill="#5aa46a" fill-opacity="0.14"/>
  <text class="label" x="24" y="88">search(k)</text>
  <text class="muted" x="300" y="88">Θ(log n)</text>
  <text class="ok" x="450" y="88" font-weight="600">Θ(1) expected</text>

  <text class="label" x="24" y="118">insert(k), delete(k)</text>
  <text class="muted" x="300" y="118">Θ(n)</text>
  <text class="ok" x="450" y="118" font-weight="600">Θ(1) expected</text>

  <line x1="24" y1="132" x2="616" y2="132" stroke="currentColor" opacity="0.25" stroke-dasharray="3 3"/>

  <rect x="440" y="138" width="176" height="90" rx="4" fill="#e2903a" fill-opacity="0.14"/>
  <text class="label" x="24" y="158">min(), max()</text>
  <text class="muted" x="300" y="158">Θ(1)</text>
  <text class="hot" x="450" y="158">Θ(m + n)</text>

  <text class="label" x="24" y="188">successor(k)</text>
  <text class="muted" x="300" y="188">Θ(log n)</text>
  <text class="hot" x="450" y="188">Θ(m + n)</text>

  <text class="label" x="24" y="218">range [a, b], r hits</text>
  <text class="muted" x="300" y="218">Θ(log n + r)</text>
  <text class="hot" x="450" y="218">Θ(m + n)</text>

  <text class="muted" x="24" y="250">the ordered operations cost a full scan of the table: hashing scattered the keys on purpose</text>
</svg>

<svg viewBox="0 0 640 230" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .hot { fill: #e2903a; }
    .ok { fill: #5aa46a; }
    .slot { fill: none; stroke: currentColor; opacity: 0.7; }
  </style>
  <defs>
    <marker id="p1-hot" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#e2903a"/>
    </marker>
  </defs>

  <text class="label" x="24" y="26" font-weight="600">1 — insert 10, 15, 20 into m = 5 slots, h(k) = k mod 5</text>
  <text class="muted" x="24" y="44">every one of them wants slot 0; linear probing walks right until a slot is free</text>

  <!-- probe path for key 20 -->
  <path d="M157,90 C167,70 189,70 199,88" fill="none" stroke="#e2903a" stroke-width="1.5" marker-end="url(#p1-hot)"/>
  <path d="M241,90 C251,70 273,70 283,88" fill="none" stroke="#e2903a" stroke-width="1.5" marker-end="url(#p1-hot)"/>
  <text class="hot" x="320" y="76" font-size="11">key 20: probe 0, probe 1, land in 2</text>

  <rect class="slot" x="120" y="96" width="74" height="36" rx="4"/>
  <text class="label" x="157" y="120" text-anchor="middle">10</text>
  <rect class="slot" x="204" y="96" width="74" height="36" rx="4"/>
  <text class="label" x="241" y="120" text-anchor="middle">15</text>
  <rect x="288" y="96" width="74" height="36" rx="4" fill="#e2903a" fill-opacity="0.2" stroke="#e2903a"/>
  <text class="hot" x="325" y="120" text-anchor="middle" font-weight="600">20</text>
  <rect class="slot" x="372" y="96" width="74" height="36" rx="4"/>
  <text class="muted" x="409" y="120" text-anchor="middle">nil</text>
  <rect class="slot" x="456" y="96" width="74" height="36" rx="4"/>
  <text class="muted" x="493" y="120" text-anchor="middle">nil</text>

  <text class="muted" x="157" y="150" text-anchor="middle">0</text>
  <text class="muted" x="241" y="150" text-anchor="middle">1</text>
  <text class="muted" x="325" y="150" text-anchor="middle">2</text>
  <text class="muted" x="409" y="150" text-anchor="middle">3</text>
  <text class="muted" x="493" y="150" text-anchor="middle">4</text>

  <text class="ok" x="24" y="184" font-size="12">search(20): slot 0 holds 10, slot 1 holds 15, slot 2 holds 20 — found in 3 probes</text>
  <text class="muted" x="24" y="204">a search stops early only when it meets an empty slot: the key would have been put there</text>
</svg>

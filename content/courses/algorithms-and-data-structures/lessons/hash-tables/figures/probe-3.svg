<svg viewBox="0 0 640 230" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .hot { fill: #e2903a; }
    .slot { fill: none; stroke: currentColor; opacity: 0.7; }
  </style>
  <defs>
    <marker id="p3-hot" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#e2903a"/>
    </marker>
  </defs>

  <text class="label" x="24" y="26" font-weight="600">3 — search(20) now fails, although 20 is in the table</text>
  <text class="muted" x="24" y="44">h(20) = 0; probe 0 holds 10, probe 1 is empty, so the search reports "absent"</text>

  <path d="M157,90 C167,70 189,70 199,88" fill="none" stroke="#e2903a" stroke-width="1.5" marker-end="url(#p3-hot)"/>
  <text class="hot" x="290" y="76" font-size="11">stops here — an empty slot ends every search</text>

  <rect class="slot" x="120" y="96" width="74" height="36" rx="4"/>
  <text class="label" x="157" y="120" text-anchor="middle">10</text>
  <rect x="204" y="96" width="74" height="36" rx="4" fill="#e2903a" fill-opacity="0.25" stroke="#e2903a"/>
  <text class="hot" x="241" y="120" text-anchor="middle" font-weight="600">nil</text>
  <rect x="288" y="96" width="74" height="36" rx="4" fill="none" stroke="currentColor" stroke-dasharray="4 3" opacity="0.5"/>
  <text class="muted" x="325" y="120" text-anchor="middle">20 — never reached</text>
  <rect class="slot" x="372" y="96" width="74" height="36" rx="4"/>
  <text class="muted" x="409" y="120" text-anchor="middle">nil</text>
  <rect class="slot" x="456" y="96" width="74" height="36" rx="4"/>
  <text class="muted" x="493" y="120" text-anchor="middle">nil</text>

  <text class="muted" x="157" y="150" text-anchor="middle">0</text>
  <text class="muted" x="241" y="150" text-anchor="middle">1</text>
  <text class="muted" x="325" y="150" text-anchor="middle">2</text>
  <text class="muted" x="409" y="150" text-anchor="middle">3</text>
  <text class="muted" x="493" y="150" text-anchor="middle">4</text>

  <text class="hot" x="24" y="184" font-size="12">a stored key has become invisible — deleting one key silently corrupted another's lookup</text>
  <text class="muted" x="24" y="204">chaining has no such failure: deleting a list node leaves the rest of the list linked</text>
</svg>

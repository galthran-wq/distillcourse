<svg viewBox="0 0 640 230" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .hot { fill: #e2903a; }
    .ok { fill: #5aa46a; }
    .slot { fill: none; stroke: currentColor; opacity: 0.7; }
  </style>
  <defs>
    <marker id="p4-ok" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#5aa46a"/>
    </marker>
  </defs>

  <text class="label" x="24" y="26" font-weight="600">4 — the repair: slot 1 holds a tombstone, not nil</text>
  <text class="muted" x="24" y="44">search walks past a tombstone; insert may overwrite one</text>

  <path d="M157,90 C167,70 189,70 199,88" fill="none" stroke="#5aa46a" stroke-width="1.5" marker-end="url(#p4-ok)"/>
  <path d="M241,90 C251,70 273,70 283,88" fill="none" stroke="#5aa46a" stroke-width="1.5" marker-end="url(#p4-ok)"/>
  <text class="ok" x="330" y="76" font-size="11">search(20): 3 probes, found</text>

  <rect class="slot" x="120" y="96" width="74" height="36" rx="4"/>
  <text class="label" x="157" y="120" text-anchor="middle">10</text>
  <rect x="204" y="96" width="74" height="36" rx="4" fill="#5aa46a" fill-opacity="0.18" stroke="#5aa46a"/>
  <text class="ok" x="241" y="120" text-anchor="middle" font-weight="600">deleted</text>
  <rect x="288" y="96" width="74" height="36" rx="4" fill="#5aa46a" fill-opacity="0.18" stroke="#5aa46a"/>
  <text class="ok" x="325" y="120" text-anchor="middle" font-weight="600">20</text>
  <rect class="slot" x="372" y="96" width="74" height="36" rx="4"/>
  <text class="muted" x="409" y="120" text-anchor="middle">nil</text>
  <rect class="slot" x="456" y="96" width="74" height="36" rx="4"/>
  <text class="muted" x="493" y="120" text-anchor="middle">nil</text>

  <text class="muted" x="157" y="150" text-anchor="middle">0</text>
  <text class="muted" x="241" y="150" text-anchor="middle">1</text>
  <text class="muted" x="325" y="150" text-anchor="middle">2</text>
  <text class="muted" x="409" y="150" text-anchor="middle">3</text>
  <text class="muted" x="493" y="150" text-anchor="middle">4</text>

  <text class="label" x="24" y="184" font-size="12">the cost: tombstones occupy slots without holding keys, so probe lengths stop tracking α</text>
  <text class="muted" x="24" y="204">a delete-heavy open-addressed table has to be rebuilt periodically to clear them</text>
</svg>

<svg viewBox="0 0 640 250" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; font-size: 12px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .box { fill: none; stroke: currentColor; opacity: 0.7; }
  </style>
  <defs>
    <marker id="qo-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- row 1: the guarantee -->
  <text x="24" y="24" font-weight="600" font-size="13" fill="#5aa46a">the guarantee: keys committed before the draw</text>

  <rect class="box" x="24" y="36" width="176" height="44" rx="5"/>
  <text class="label" x="112" y="54" text-anchor="middle">the adversary fixes</text>
  <text class="label" x="112" y="70" text-anchor="middle">all n keys</text>

  <line x1="202" y1="58" x2="224" y2="58" stroke="currentColor" opacity="0.7" marker-end="url(#qo-arrow)"/>

  <rect class="box" x="228" y="36" width="176" height="44" rx="5"/>
  <text class="label" x="316" y="54" text-anchor="middle">the table draws h</text>
  <text class="label" x="316" y="70" text-anchor="middle">at random</text>

  <line x1="406" y1="58" x2="428" y2="58" stroke="currentColor" opacity="0.7" marker-end="url(#qo-arrow)"/>

  <rect x="432" y="36" width="184" height="44" rx="5" fill="#5aa46a" fill-opacity="0.15" stroke="#5aa46a"/>
  <text class="label" x="524" y="54" text-anchor="middle">every search: expected</text>
  <text class="label" x="524" y="70" text-anchor="middle">Θ(1 + α)</text>

  <text class="muted" x="24" y="102">a bad key set for the drawn h still exists — but the adversary had to choose without seeing h</text>

  <!-- row 2: the fixed function -->
  <text x="24" y="146" font-weight="600" font-size="13" fill="#e2903a">a fixed published function: the draw already happened</text>

  <rect class="box" x="24" y="158" width="176" height="44" rx="5"/>
  <text class="label" x="112" y="176" text-anchor="middle">h ships fixed</text>
  <text class="label" x="112" y="192" text-anchor="middle">in the library</text>

  <line x1="202" y1="180" x2="224" y2="180" stroke="currentColor" opacity="0.7" marker-end="url(#qo-arrow)"/>

  <rect class="box" x="228" y="158" width="176" height="44" rx="5"/>
  <text class="label" x="316" y="176" text-anchor="middle">the adversary picks keys</text>
  <text class="label" x="316" y="192" text-anchor="middle">knowing h</text>

  <line x1="406" y1="180" x2="428" y2="180" stroke="currentColor" opacity="0.7" marker-end="url(#qo-arrow)"/>

  <rect x="432" y="158" width="184" height="44" rx="5" fill="#e2903a" fill-opacity="0.15" stroke="#e2903a"/>
  <text class="label" x="524" y="176" text-anchor="middle">every operation:</text>
  <text class="label" x="524" y="192" text-anchor="middle">worst case Θ(n)</text>

  <text class="muted" x="24" y="224">one precomputed colliding key set defeats every process that runs this code</text>
</svg>

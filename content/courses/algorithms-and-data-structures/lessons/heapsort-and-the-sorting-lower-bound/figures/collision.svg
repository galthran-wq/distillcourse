<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .edge { stroke: currentColor; stroke-width: 1.3; opacity: 0.75; }
    .stub { stroke: currentColor; stroke-width: 1.3; opacity: 0.35; stroke-dasharray: 4 4; }
    .node { fill: none; stroke: currentColor; stroke-width: 1.4; }
    .leafy { stroke: currentColor; stroke-width: 1.2; fill: #5aa46a; fill-opacity: 0.12; }
    .bluebox { stroke: #4c8dd6; stroke-width: 1.8; fill: #4c8dd6; fill-opacity: 0.10; }
    .amberbox { stroke: #e2903a; stroke-width: 1.8; fill: #e2903a; fill-opacity: 0.10; }
    .bluearrow { stroke: #4c8dd6; stroke-width: 1.6; fill: none; }
    .amberarrow { stroke: #e2903a; stroke-width: 1.6; fill: none; }
    .lab { fill: currentColor; text-anchor: middle; }
    .greent { fill: #5aa46a; }
    .ambert { fill: #e2903a; }
  </style>
  <defs>
    <marker id="mb" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4c8dd6"/>
    </marker>
    <marker id="ma" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#e2903a"/>
    </marker>
  </defs>

  <text class="muted" x="24" y="20">a tree with 4 &lt; 3! = 6 leaves: two orderings share a leaf</text>

  <text class="muted" x="30" y="62">input (a, b, c) = (3, 1, 2)</text>
  <rect class="bluebox" x="30" y="70" width="28" height="26"/><text class="lab" x="44" y="87">3</text>
  <rect class="bluebox" x="58" y="70" width="28" height="26"/><text class="lab" x="72" y="87">1</text>
  <rect class="bluebox" x="86" y="70" width="28" height="26"/><text class="lab" x="100" y="87">2</text>

  <text class="muted" x="30" y="182">input (a, b, c) = (3, 2, 1)</text>
  <rect class="amberbox" x="30" y="190" width="28" height="26"/><text class="lab" x="44" y="207">3</text>
  <rect class="amberbox" x="58" y="190" width="28" height="26"/><text class="lab" x="72" y="207">2</text>
  <rect class="amberbox" x="86" y="190" width="28" height="26"/><text class="lab" x="100" y="207">1</text>

  <line class="bluearrow" x1="120" y1="83" x2="262" y2="52" marker-end="url(#mb)"/>
  <line class="amberarrow" x1="120" y1="203" x2="262" y2="60" marker-end="url(#ma)"/>

  <line class="stub" x1="300" y1="57" x2="238" y2="110"/>
  <text class="muted" x="228" y="126">&#8230;</text>
  <line class="edge" x1="300" y1="57" x2="372" y2="110"/>
  <text class="muted" x="348" y="82">&gt; (both)</text>
  <line class="stub" x1="372" y1="123" x2="308" y2="176"/>
  <text class="muted" x="300" y="192">&#8230;</text>
  <line class="edge" x1="372" y1="123" x2="446" y2="170"/>
  <text class="muted" x="420" y="146">&gt; (both)</text>

  <rect class="node" x="268" y="44" width="64" height="26" rx="5"/><text class="lab" x="300" y="61">a &#8804; b ?</text>
  <rect class="node" x="340" y="110" width="64" height="26" rx="5"/><text class="lab" x="372" y="127">a &#8804; c ?</text>
  <rect class="leafy" x="392" y="170" width="108" height="26" rx="5"/><text class="lab" x="446" y="187">output &#10216;b, c, a&#10217;</text>

  <line class="bluearrow" x1="500" y1="176" x2="540" y2="160" marker-end="url(#mb)"/>
  <line class="amberarrow" x1="500" y1="192" x2="540" y2="226" marker-end="url(#ma)"/>
  <text class="lab" x="580" y="156">(1, 2, 3)</text>
  <text class="greent" x="552" y="174">&#10003; sorted</text>
  <text class="lab" x="580" y="240">(2, 1, 3)</text>
  <text class="ambert" x="546" y="258">&#10007; not sorted</text>

  <text class="muted" x="150" y="288">one leaf = one fixed rearrangement; it cannot be right for both inputs</text>
</svg>

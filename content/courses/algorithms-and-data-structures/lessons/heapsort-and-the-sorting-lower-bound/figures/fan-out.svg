<svg viewBox="0 0 640 290" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .side { stroke: currentColor; stroke-width: 1.3; opacity: 0.6; stroke-dasharray: 4 4; }
    .edge { stroke: currentColor; stroke-width: 1.4; opacity: 0.75; }
    .aedge { stroke: #e2903a; stroke-width: 1.4; }
    .lvl { fill: currentColor; opacity: 0.45; }
    .band { stroke: #5aa46a; stroke-width: 1.6; fill: #5aa46a; fill-opacity: 0.14; }
    .lab { fill: currentColor; text-anchor: middle; }
    .ambert { fill: #e2903a; }
  </style>
  <defs>
    <marker id="fa" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#e2903a"/>
    </marker>
  </defs>

  <!-- left panel: comparison, fan-out 2 -->
  <text class="lab" x="150" y="24">one &#8804; test: 2 outcomes</text>
  <circle cx="150" cy="48" r="5" fill="currentColor"/>
  <line class="edge" x1="150" y1="48" x2="105" y2="90"/>
  <line class="edge" x1="150" y1="48" x2="195" y2="90"/>
  <text class="muted" x="112" y="66" text-anchor="end">&#8804;</text>
  <text class="muted" x="188" y="66">&gt;</text>
  <circle class="lvl" cx="105" cy="90" r="4"/>
  <circle class="lvl" cx="195" cy="90" r="4"/>
  <line class="side" x1="150" y1="48" x2="60" y2="190"/>
  <line class="side" x1="150" y1="48" x2="240" y2="190"/>
  <text class="muted" x="92" y="132" text-anchor="end">height h</text>
  <rect class="band" x="60" y="190" width="180" height="26" rx="4"/>
  <text class="lab" xml:space="preserve" x="150" y="207">&#8804; 2<tspan dy="-5" font-size="9">h</tspan><tspan dy="5">&#160;leaves</tspan></text>
  <text class="lab" xml:space="preserve" x="150" y="248">2<tspan dy="-5" font-size="9">h</tspan><tspan dy="5">&#160;&#8805; n!  &#8658;  h &#8805; lg (n!)</tspan></text>
  <text class="lab" x="150" y="272">floor: &#920;(n lg n)</text>

  <!-- middle: the single change -->
  <text class="lab ambert" x="322" y="108">read the key&#8217;s value:</text>
  <text class="lab ambert" x="322" y="124">fan-out 2 &#8594; k</text>
  <line class="aedge" x1="270" y1="140" x2="372" y2="140" stroke-width="2" marker-end="url(#fa)"/>

  <!-- right panel: value-indexed step, fan-out k -->
  <text class="lab" x="490" y="24">one value-indexed step: <tspan class="ambert">k outcomes</tspan></text>
  <circle cx="490" cy="48" r="5" fill="currentColor"/>
  <line class="aedge" x1="490" y1="48" x2="410" y2="90"/>
  <line class="aedge" x1="490" y1="48" x2="450" y2="90"/>
  <line class="aedge" x1="490" y1="48" x2="490" y2="90"/>
  <line class="aedge" x1="490" y1="48" x2="530" y2="90"/>
  <line class="aedge" x1="490" y1="48" x2="570" y2="90"/>
  <circle class="lvl" cx="410" cy="90" r="4"/>
  <circle class="lvl" cx="450" cy="90" r="4"/>
  <circle class="lvl" cx="490" cy="90" r="4"/>
  <circle class="lvl" cx="530" cy="90" r="4"/>
  <circle class="lvl" cx="570" cy="90" r="4"/>
  <text class="muted" x="407" y="106">1</text>
  <text class="muted" x="487" y="106">&#8230;</text>
  <text class="muted" x="567" y="106">k</text>
  <line class="side" x1="490" y1="48" x2="400" y2="190"/>
  <line class="side" x1="490" y1="48" x2="580" y2="190"/>
  <text class="muted" x="548" y="132">height h</text>
  <rect class="band" x="400" y="190" width="180" height="26" rx="4"/>
  <text class="lab" xml:space="preserve" x="490" y="207">&#8804; k<tspan dy="-5" font-size="9">h</tspan><tspan dy="5">&#160;leaves</tspan></text>
  <text class="lab" xml:space="preserve" x="490" y="248">k<tspan dy="-5" font-size="9">h</tspan><tspan dy="5">&#160;&#8805; n!  &#8658;  h &#8805; log</tspan><tspan dy="9" font-size="9">k</tspan><tspan dy="-9">&#160;(n!)</tspan></text>
  <text class="lab ambert" x="490" y="272">floor: &#920;(n) for k &#8776; n</text>
</svg>

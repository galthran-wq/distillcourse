  <circle class="lvl" cx="180" cy="144" r="4"/>
  <circle class="lvl" cx="260" cy="144" r="4"/>
  <circle class="lvl" cx="340" cy="144" r="4"/>
  <circle class="lvl" cx="420" cy="144" r="4"/>


<svg viewBox="0 0 640 268" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .lab { fill: currentColor; }
    .cell { fill: currentColor; text-anchor: middle; }
    .rule { stroke: currentColor; stroke-width: 1; opacity: 0.35; }
    .rulestrong { stroke: currentColor; stroke-width: 1.4; opacity: 0.7; }
    .hl { fill: #e2903a; fill-opacity: 0.08; stroke: #e2903a; stroke-width: 1.2; }
    .greent { fill: #5aa46a; text-anchor: middle; }
    .dash { fill: currentColor; opacity: 0.4; text-anchor: middle; }
  </style>

  <text class="muted" x="24" y="34">algorithm</text>
  <text class="muted" x="228" y="34" text-anchor="middle">worst case</text>
  <text class="muted" x="338" y="34" text-anchor="middle">average / expected</text>
  <text class="muted" x="448" y="34" text-anchor="middle">extra space</text>
  <text class="muted" x="528" y="34" text-anchor="middle">stable</text>
  <text class="muted" x="598" y="34" text-anchor="middle">in place</text>
  <line class="rulestrong" x1="24" y1="44" x2="628" y2="44"/>

  <text class="lab" x="24" y="74">merge sort</text>
  <text class="cell" x="228" y="74">n lg n</text>
  <text class="cell" x="338" y="74">n lg n</text>
  <text class="cell" x="448" y="74">&#920;(n)</text>
  <text class="greent" x="528" y="74">&#10003;</text>
  <text class="dash" x="598" y="74">&#8212;</text>
  <line class="rule" x1="24" y1="88" x2="628" y2="88"/>

  <text class="lab" x="24" y="116">quicksort (random pivot)</text>
  <text class="cell" x="228" y="116">n&#178;/2</text>
  <text class="cell" x="338" y="116">1.39 n lg n</text>
  <text class="cell" x="448" y="116">&#920;(lg n)</text>
  <text class="dash" x="528" y="116">&#8212;</text>
  <text class="greent" x="598" y="116">&#10003;</text>
  <line class="rule" x1="24" y1="130" x2="628" y2="130"/>

  <rect class="hl" x="16" y="138" width="616" height="34" rx="5"/>
  <text class="lab" x="24" y="160">heapsort</text>
  <text class="cell" x="228" y="160">2 n lg n</text>
  <text class="cell" x="338" y="160">2 n lg n</text>
  <text class="cell" x="448" y="160">&#920;(1)</text>
  <text class="dash" x="528" y="160">&#8212;</text>
  <text class="greent" x="598" y="160">&#10003;</text>

  <line class="rulestrong" x1="24" y1="188" x2="628" y2="188"/>
  <text class="lab" x="24" y="216">any comparison sort</text>
  <text class="cell" x="330" y="216">&#8805; lg (n!) &#8776; n lg n &#8722; 1.44 n comparisons</text>
  <text class="muted" x="330" y="238" text-anchor="middle">worst case and average &#8212; the floor proved in this lesson</text>
</svg>

  <rect class="box" x="114" y="200" width="44" height="32"/>
  <rect class="box" x="158" y="200" width="44" height="32"/>
  <rect class="box" x="202" y="200" width="44" height="32"/>
  <rect class="box" x="246" y="200" width="44" height="32"/>
  <rect class="box" x="290" y="200" width="44" height="32"/>
  <rect class="abox" x="334" y="200" width="44" height="32"/><text class="key" x="356" y="221">3</text>
  <rect class="box" x="378" y="200" width="44" height="32"/>
  <text class="idx" x="92" y="246">0</text><text class="idx" x="136" y="246">1</text><text class="idx" x="180" y="246">2</text><text class="idx" x="224" y="246">3</text><text class="idx" x="268" y="246">4</text><text class="idx" x="312" y="246">5</text><text class="idx" x="356" y="246">6</text><text class="idx" x="400" y="246">7</text>

  <text class="muted" x="24" y="284">seven placements remain; the worked example below runs all of them</text>

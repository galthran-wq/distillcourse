<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .idx { fill: currentColor; opacity: 0.55; font-size: 10px; text-anchor: middle; }
    .key { fill: currentColor; text-anchor: middle; }
    .rowlab { fill: currentColor; text-anchor: end; font-weight: bold; }
    .box { fill: none; stroke: currentColor; stroke-width: 1.3; }
    .bbox { stroke: #4c8dd6; stroke-width: 2; fill: #4c8dd6; fill-opacity: 0.12; }
    .abox { stroke: #e2903a; stroke-width: 2; fill: #e2903a; fill-opacity: 0.12; }
    .aedge { stroke: #e2903a; stroke-width: 1.8; fill: none; }
    .ambert { fill: #e2903a; font-size: 11px; }
  </style>
  <defs>
    <marker id="c4-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#e2903a"/>
    </marker>
  </defs>
  <text class="muted" x="24" y="20">4 &#183; placement pass, right to left: first element out is A[7] = 3</text>

  <text class="rowlab" x="56" y="61">A</text>
  <rect class="box" x="70" y="40" width="44" height="32"/><text class="key" x="92" y="61">2</text>
  <rect class="box" x="114" y="40" width="44" height="32"/><text class="key" x="136" y="61">5</text>
  <rect class="box" x="158" y="40" width="44" height="32"/><text class="key" x="180" y="61">3</text>
  <rect class="box" x="202" y="40" width="44" height="32"/><text class="key" x="224" y="61">0</text>
  <rect class="box" x="246" y="40" width="44" height="32"/><text class="key" x="268" y="61">2</text>
  <rect class="box" x="290" y="40" width="44" height="32"/><text class="key" x="312" y="61">3</text>
  <rect class="box" x="334" y="40" width="44" height="32"/><text class="key" x="356" y="61">0</text>
  <rect class="abox" x="378" y="40" width="44" height="32"/><text class="key" x="400" y="61">3</text>
  <text class="idx" x="92" y="86">0</text><text class="idx" x="136" y="86">1</text><text class="idx" x="180" y="86">2</text><text class="idx" x="224" y="86">3</text><text class="idx" x="268" y="86">4</text><text class="idx" x="312" y="86">5</text><text class="idx" x="356" y="86">6</text><text class="idx" x="400" y="86">7</text>

  <path class="aedge" d="M 400 74 C 390 104, 300 96, 240 116" marker-end="url(#c4-a)"/>
  <text class="ambert" x="300" y="94">read C[3]</text>
  <text class="muted" x="224" y="112" text-anchor="middle">7 &#8594; 6</text>

  <text class="rowlab" x="56" y="141">C</text>
  <rect class="bbox" x="70" y="120" width="44" height="32"/><text class="key" x="92" y="141">2</text>
  <rect class="bbox" x="114" y="120" width="44" height="32"/><text class="key" x="136" y="141">2</text>
  <rect class="bbox" x="158" y="120" width="44" height="32"/><text class="key" x="180" y="141">4</text>
  <rect class="abox" x="202" y="120" width="44" height="32"/><text class="key" x="224" y="141">6</text>
  <rect class="bbox" x="246" y="120" width="44" height="32"/><text class="key" x="268" y="141">7</text>
  <rect class="bbox" x="290" y="120" width="44" height="32"/><text class="key" x="312" y="141">8</text>
  <text class="idx" x="92" y="166">0</text><text class="idx" x="136" y="166">1</text><text class="idx" x="180" y="166">2</text><text class="idx" x="224" y="166">3</text><text class="idx" x="268" y="166">4</text><text class="idx" x="312" y="166">5</text>
  <text class="muted" x="350" y="141">decrement, then place at the new value: slot 6</text>

  <path class="aedge" d="M 224 152 C 230 180, 320 176, 350 198" marker-end="url(#c4-a)"/>
  <text class="ambert" x="258" y="186">place at B[6]</text>


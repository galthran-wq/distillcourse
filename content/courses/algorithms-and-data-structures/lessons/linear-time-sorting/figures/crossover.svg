<svg viewBox="0 0 620 296" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .tick { fill: currentColor; opacity: 0.55; font-size: 10px; text-anchor: middle; }
    .ytick { fill: currentColor; opacity: 0.55; font-size: 10px; text-anchor: end; }
    .axis { stroke: currentColor; stroke-width: 1.3; opacity: 0.75; }
    .guide { stroke: currentColor; stroke-width: 1.2; opacity: 0.5; stroke-dasharray: 3 3; }
    .aline { stroke: #e2903a; stroke-width: 2.2; fill: none; }
    .bline { stroke: #4c8dd6; stroke-width: 2.2; fill: none; }
    .ambert { fill: #e2903a; font-size: 11px; }
    .bluet { fill: #4c8dd6; font-size: 11px; }
    .wins { fill: #e2903a; fill-opacity: 0.08; stroke: none; }
  </style>
  <defs>
    <marker id="cx-c" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor" opacity="0.75"/>
    </marker>
  </defs>

  <polygon class="wins" points="70,230 306,146 70,146"/>
  <text class="ambert" x="96" y="196">radix does less work</text>
  <text class="ambert" x="96" y="211">per key in here</text>

  <line class="axis" x1="70" y1="230" x2="596" y2="230" marker-end="url(#cx-c)"/>
  <line class="axis" x1="70" y1="230" x2="70" y2="38" marker-end="url(#cx-c)"/>
  <text class="muted" x="330" y="266" text-anchor="middle">key width b (bits), for n = 2&#178;&#8304; keys</text>
  <text class="muted" x="76" y="34">work per key</text>

  <text class="tick" x="145" y="246">64</text>
  <text class="tick" x="306" y="246">200</text>
  <text class="tick" x="542" y="246">400</text>
  <text class="ytick" x="62" y="192">10</text>
  <text class="ytick" x="62" y="150">20</text>
  <text class="ytick" x="62" y="108">30</text>
  <text class="ytick" x="62" y="66">40</text>

  <line class="bline" x1="70" y1="146" x2="589" y2="146"/>
  <text class="bluet" x="330" y="164">any comparison sort: lg n = 20 comparisons per key</text>

  <line class="aline" x1="70" y1="230" x2="589" y2="45"/>
  <text class="ambert" x="555" y="40" text-anchor="end">radix sort, base n = 2&#178;&#8304;:</text>
  <text class="ambert" x="555" y="56" text-anchor="end">2 array touches &#215; b/20 passes</text>

  <line class="guide" x1="306" y1="230" x2="306" y2="146"/>
  <circle cx="306" cy="146" r="4" fill="#e2903a"/>
  <text class="muted" x="314" y="126">paper crossover: b = 200 bits</text>

  <line class="guide" x1="145" y1="230" x2="145" y2="146"/>
  <text class="muted" x="130" y="130" text-anchor="middle">64-bit keys:</text>
  <text class="muted" x="130" y="143" text-anchor="middle">&#8776;6 vs 20</text>

  <text class="muted" x="70" y="288">an array touch is not a comparison: constants and cache move the real crossover left</text>
</svg>

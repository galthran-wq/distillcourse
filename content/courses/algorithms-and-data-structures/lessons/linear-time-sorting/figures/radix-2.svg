  <text class="muted" x="386" y="44" text-anchor="middle">after</text>

  <text class="d" x="130" y="68">7</text><text class="adig" x="146" y="68">2</text><text class="d" x="162" y="68">0</text>
  <text class="d" x="130" y="98">3</text><text class="adig" x="146" y="98">5</text><text class="d" x="162" y="98">5</text>
  <text class="d" x="130" y="128">4</text><text class="adig" x="146" y="128">3</text><text class="d" x="162" y="128">6</text>
  <text class="d" x="130" y="158">4</text><text class="adig" x="146" y="158">5</text><text class="d" x="162" y="158">7</text>
  <text class="d" x="130" y="188">6</text><text class="adig" x="146" y="188">5</text><text class="d" x="162" y="188">7</text>
  <text class="d" x="130" y="218">3</text><text class="adig" x="146" y="218">2</text><text class="d" x="162" y="218">9</text>
  <text class="d" x="130" y="248">8</text><text class="adig" x="146" y="248">3</text><text class="d" x="162" y="248">9</text>

  <line class="edge" x1="205" y1="154" x2="320" y2="154" marker-end="url(#r2-c)"/>
  <text class="muted" x="262" y="144" text-anchor="middle">place by digit,</text>
  <text class="muted" x="262" y="170" text-anchor="middle">right to left</text>

  <text class="d" x="370" y="68">7</text><text class="adig" x="386" y="68">2</text><text class="d" x="402" y="68">0</text>
  <text class="d" x="370" y="98">3</text><text class="adig" x="386" y="98">2</text><text class="d" x="402" y="98">9</text>
  <text class="d" x="370" y="128">4</text><text class="adig" x="386" y="128">3</text><text class="d" x="402" y="128">6</text>
  <text class="d" x="370" y="158">8</text><text class="adig" x="386" y="158">3</text><text class="d" x="402" y="158">9</text>
  <text class="d" x="370" y="188">3</text><text class="adig" x="386" y="188">5</text><text class="d" x="402" y="188">5</text>
  <text class="d" x="370" y="218">4</text><text class="adig" x="386" y="218">5</text><text class="d" x="402" y="218">7</text>
  <text class="d" x="370" y="248">6</text><text class="adig" x="386" y="248">5</text><text class="d" x="402" y="248">7</text>

  <path class="bedge" d="M 420 56 L 428 56 L 428 100 L 420 100"/>
  <text class="bluet" x="436" y="74">tie on tens digit 2:</text>
  <text class="bluet" x="436" y="90">pass 1&#8217;s order kept</text>


      <path d="M0,0 L8,4 L0,8 z" fill="currentColor" opacity="0.75"/>
    </marker>
  </defs>
  <text class="muted" x="24" y="20">pass 2 &#183; stable counting sort on the tens digit (k = 10)</text>

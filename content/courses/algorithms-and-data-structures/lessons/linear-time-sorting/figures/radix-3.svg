<svg viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="14">
  <style>
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .d { fill: currentColor; text-anchor: middle; }
    .adig { fill: #e2903a; text-anchor: middle; font-weight: bold; }
    .edge { stroke: currentColor; stroke-width: 1.4; opacity: 0.75; }
    .band { stroke: #5aa46a; stroke-width: 1.6; fill: #5aa46a; fill-opacity: 0.12; }
    .greent { fill: #5aa46a; font-size: 12px; }
  </style>
  <defs>
    <marker id="r3-c" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor" opacity="0.75"/>
    </marker>
  </defs>
  <text class="muted" x="24" y="20">pass 3 &#183; stable counting sort on the hundreds digit (k = 10)</text>
  <text class="muted" x="146" y="44" text-anchor="middle">before</text>
  <text class="muted" x="386" y="44" text-anchor="middle">after</text>

  <text class="adig" x="130" y="68">7</text><text class="d" x="146" y="68">2</text><text class="d" x="162" y="68">0</text>
  <text class="adig" x="130" y="98">3</text><text class="d" x="146" y="98">2</text><text class="d" x="162" y="98">9</text>
  <text class="adig" x="130" y="128">4</text><text class="d" x="146" y="128">3</text><text class="d" x="162" y="128">6</text>
  <text class="adig" x="130" y="158">8</text><text class="d" x="146" y="158">3</text><text class="d" x="162" y="158">9</text>
  <text class="adig" x="130" y="188">3</text><text class="d" x="146" y="188">5</text><text class="d" x="162" y="188">5</text>
  <text class="adig" x="130" y="218">4</text><text class="d" x="146" y="218">5</text><text class="d" x="162" y="218">7</text>
  <text class="adig" x="130" y="248">6</text><text class="d" x="146" y="248">5</text><text class="d" x="162" y="248">7</text>

  <line class="edge" x1="205" y1="154" x2="320" y2="154" marker-end="url(#r3-c)"/>
  <text class="muted" x="262" y="144" text-anchor="middle">place by digit,</text>
  <text class="muted" x="262" y="170" text-anchor="middle">right to left</text>

  <rect class="band" x="352" y="50" width="68" height="210" rx="5"/>
  <text class="adig" x="370" y="68">3</text><text class="d" x="386" y="68">2</text><text class="d" x="402" y="68">9</text>
  <text class="adig" x="370" y="98">3</text><text class="d" x="386" y="98">5</text><text class="d" x="402" y="98">5</text>
  <text class="adig" x="370" y="128">4</text><text class="d" x="386" y="128">3</text><text class="d" x="402" y="128">6</text>
  <text class="adig" x="370" y="158">4</text><text class="d" x="386" y="158">5</text><text class="d" x="402" y="158">7</text>
  <text class="adig" x="370" y="188">6</text><text class="d" x="386" y="188">5</text><text class="d" x="402" y="188">7</text>
  <text class="adig" x="370" y="218">7</text><text class="d" x="386" y="218">2</text><text class="d" x="402" y="218">0</text>
  <text class="adig" x="370" y="248">8</text><text class="d" x="386" y="248">3</text><text class="d" x="402" y="248">9</text>

  <text class="greent" x="310" y="278">sorted: the most significant digit ran last</text>
</svg>

<svg viewBox="0 0 620 286" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .idx { fill: currentColor; opacity: 0.55; font-size: 10px; text-anchor: middle; }
    .key { fill: currentColor; text-anchor: middle; }
    .rowlab { fill: currentColor; text-anchor: end; font-weight: bold; }
    .lab { fill: currentColor; text-anchor: middle; font-weight: bold; }
    .box { fill: none; stroke: currentColor; stroke-width: 1.3; }
    .abox { stroke: #e2903a; stroke-width: 2; fill: #e2903a; fill-opacity: 0.12; }
    .bbox { stroke: #4c8dd6; stroke-width: 2; fill: #4c8dd6; fill-opacity: 0.12; }
    .aedge { stroke: #e2903a; stroke-width: 1.6; fill: none; }
    .bedge { stroke: #4c8dd6; stroke-width: 1.6; fill: none; }
    .greent { fill: #5aa46a; font-weight: bold; }
  </style>
  <defs>
    <marker id="st-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#e2903a"/>
    </marker>
    <marker id="st-b" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4c8dd6"/>
    </marker>
  </defs>

  <text class="lab" x="160" y="24">scan A right to left (the pseudocode)</text>
  <text class="lab" x="460" y="24">scan A left to right</text>

  <!-- left panel -->
  <text class="rowlab" x="48" y="68">A</text>
  <rect class="abox" x="60" y="48" width="40" height="30"/><text class="key" x="80" y="68">3</text>
  <rect class="box" x="100" y="48" width="40" height="30"/><text class="key" x="120" y="68">1</text>
  <rect class="bbox" x="140" y="48" width="40" height="30"/><text class="key" x="160" y="68">3</text>
  <text class="idx" x="80" y="92">0</text><text class="idx" x="120" y="92">1</text><text class="idx" x="160" y="92">2</text>
  <text class="muted" x="60" y="112">after prefix sums, C[3] = 3: the 3s own slots 1&#8211;2</text>

  <line class="bedge" x1="160" y1="80" x2="160" y2="166" marker-end="url(#st-b)"/>
  <text class="muted" x="168" y="128">1st: slot C[3]&#8722;1 = 2</text>
  <line class="aedge" x1="80" y1="80" x2="116" y2="166" marker-end="url(#st-a)"/>
  <text class="muted" x="36" y="150">2nd: slot 1</text>

  <text class="rowlab" x="48" y="190">B</text>
  <rect class="box" x="60" y="170" width="40" height="30"/><text class="key" x="80" y="190">1</text>
  <rect class="abox" x="100" y="170" width="40" height="30"/><text class="key" x="120" y="190">3</text>
  <rect class="bbox" x="140" y="170" width="40" height="30"/><text class="key" x="160" y="190">3</text>
  <text class="idx" x="80" y="214">0</text><text class="idx" x="120" y="214">1</text><text class="idx" x="160" y="214">2</text>
  <text class="greent" x="60" y="242">&#10003; input order kept</text>

  <!-- right panel -->
  <text class="rowlab" x="348" y="68">A</text>
  <rect class="abox" x="360" y="48" width="40" height="30"/><text class="key" x="380" y="68">3</text>
  <rect class="box" x="400" y="48" width="40" height="30"/><text class="key" x="420" y="68">1</text>
  <rect class="bbox" x="440" y="48" width="40" height="30"/><text class="key" x="460" y="68">3</text>
  <text class="idx" x="380" y="92">0</text><text class="idx" x="420" y="92">1</text><text class="idx" x="460" y="92">2</text>
  <line class="aedge" x1="380" y1="80" x2="456" y2="166" marker-end="url(#st-a)"/>
  <text class="muted" x="336" y="128">1st: slot 2</text>
  <line class="bedge" x1="460" y1="80" x2="424" y2="166" marker-end="url(#st-b)"/>
  <text class="muted" x="470" y="150">2nd: slot 1</text>

  <text class="rowlab" x="348" y="190">B</text>
  <rect class="box" x="360" y="170" width="40" height="30"/><text class="key" x="380" y="190">1</text>
  <rect class="bbox" x="400" y="170" width="40" height="30"/><text class="key" x="420" y="190">3</text>
  <rect class="abox" x="440" y="170" width="40" height="30"/><text class="key" x="460" y="190">3</text>
  <text class="idx" x="380" y="214">0</text><text class="idx" x="420" y="214">1</text><text class="idx" x="460" y="214">2</text>
  <text class="key" x="360" y="242" text-anchor="start" font-weight="bold">&#10007; sorted, equals swapped</text>

  <!-- legend -->
  <rect class="abox" x="150" y="260" width="14" height="14"/>
  <text class="muted" x="170" y="271">the 3 that arrived first</text>
  <rect class="bbox" x="330" y="260" width="14" height="14"/>
  <text class="muted" x="350" y="271">the 3 that arrived second</text>
</svg>

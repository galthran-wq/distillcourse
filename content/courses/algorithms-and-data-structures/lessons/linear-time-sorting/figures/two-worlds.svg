<svg viewBox="0 0 640 262" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .panel { fill: none; stroke: currentColor; stroke-width: 1.3; opacity: 0.6; }
    .apanel { fill: none; stroke: #e2903a; stroke-width: 1.6; }
    .box { fill: none; stroke: currentColor; stroke-width: 1.3; }
    .abox { stroke: #e2903a; stroke-width: 2; fill: #e2903a; fill-opacity: 0.12; }
    .edge { stroke: currentColor; stroke-width: 1.4; opacity: 0.75; }
    .aedge { stroke: #e2903a; stroke-width: 1.8; fill: none; }
    .lab { fill: currentColor; text-anchor: middle; }
    .idx { fill: currentColor; opacity: 0.55; font-size: 10px; text-anchor: middle; }
    .ambert { fill: #e2903a; }
    .badge { fill: none; stroke: currentColor; stroke-width: 1.5; }
    .abadge { fill: none; stroke: #e2903a; stroke-width: 1.5; }
  </style>
  <defs>
    <marker id="tw-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#e2903a"/>
    </marker>
    <marker id="tw-c" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor" opacity="0.75"/>
    </marker>
  </defs>

  <!-- left panel: comparison model -->
  <rect class="panel" x="24" y="36" width="284" height="190" rx="8"/>
  <text class="lab" x="166" y="26">the comparison model</text>
  <rect class="box" x="120" y="54" width="92" height="28" rx="5"/>
  <text class="lab" x="166" y="73">x &#8804; y ?</text>
  <line class="edge" x1="146" y1="82" x2="110" y2="120" marker-end="url(#tw-c)"/>
  <line class="edge" x1="186" y1="82" x2="222" y2="120" marker-end="url(#tw-c)"/>
  <text class="lab" x="102" y="140">yes</text>
  <text class="lab" x="230" y="140">no</text>
  <text class="muted" x="166" y="168" text-anchor="middle">every step: 2 outcomes</text>
  <rect class="badge" x="62" y="184" width="208" height="28" rx="5"/>
  <text class="lab" x="166" y="203" font-weight="bold">&#937;(n lg n) applies here</text>

  <!-- right panel: value as index -->
  <rect class="apanel" x="332" y="36" width="284" height="190" rx="8"/>
  <text class="lab" x="474" y="26">indexing by value</text>
  <rect class="abox" x="352" y="56" width="70" height="28" rx="5"/>
  <text class="lab" x="387" y="75">key = 3</text>
  <path class="aedge" d="M 422 70 C 470 60, 510 50, 526 92" marker-end="url(#tw-a)"/>
  <rect class="box" x="442" y="96" width="24" height="24"/>
  <rect class="box" x="466" y="96" width="24" height="24"/>
  <rect class="box" x="490" y="96" width="24" height="24"/>
  <rect class="abox" x="514" y="96" width="24" height="24"/>
  <rect class="box" x="538" y="96" width="24" height="24"/>
  <rect class="box" x="562" y="96" width="24" height="24"/>
  <text class="idx" x="454" y="134">0</text>
  <text class="idx" x="478" y="134">1</text>
  <text class="idx" x="502" y="134">2</text>
  <text class="idx" x="526" y="134">3</text>
  <text class="idx" x="550" y="134">4</text>
  <text class="idx" x="574" y="134">5</text>
  <text class="muted" x="474" y="168" text-anchor="middle">one step: k outcomes</text>
  <rect class="abadge" x="346" y="184" width="256" height="28" rx="5"/>
  <text class="lab ambert" x="474" y="203" font-weight="bold">outside the theorem: &#920;(n + k)</text>

  <text class="muted" x="320" y="250" text-anchor="middle">the lower bound binds the left world only; C[A[j]] lives in the right one</text>
</svg>

<svg viewBox="0 0 560 262" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
<style>.label { fill: currentColor; } .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }</style>
<defs><marker id="bm" markerWidth="7" markerHeight="7" refX="5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 z" fill="#4c8dd6"/></marker></defs>
<!-- hand: sorted cards 2 4 5 10 -->
<g>
<rect x="40" y="30" width="40" height="56" rx="4" fill="#e2903a" fill-opacity="0.18" stroke="currentColor"/>
<text x="60" y="64" text-anchor="middle" class="label" font-weight="600" font-size="14">2</text>
<rect x="88" y="30" width="40" height="56" rx="4" fill="#e2903a" fill-opacity="0.18" stroke="currentColor"/>
<text x="108" y="64" text-anchor="middle" class="label" font-weight="600" font-size="14">4</text>
<rect x="136" y="30" width="40" height="56" rx="4" fill="#e2903a" fill-opacity="0.18" stroke="currentColor"/>
<text x="156" y="64" text-anchor="middle" class="label" font-weight="600" font-size="14">5</text>
<rect x="184" y="30" width="40" height="56" rx="4" fill="#e2903a" fill-opacity="0.18" stroke="currentColor"/>
<text x="204" y="64" text-anchor="middle" class="label" font-weight="600" font-size="14">10</text>
<text x="132" y="104" text-anchor="middle" class="muted">the hand: kept sorted</text>
</g>
<!-- held card 7 -->
<g>
<rect x="284" y="24" width="40" height="56" rx="4" fill="none" stroke="#4c8dd6" stroke-width="2.5"/>
<text x="304" y="58" text-anchor="middle" fill="#4c8dd6" font-weight="600" font-size="14">7</text>
<text x="304" y="98" text-anchor="middle" class="muted">the next card</text>
<path d="M 284 38 C 254 12, 208 10, 182 24" fill="none" stroke="#4c8dd6" stroke-width="1.8" marker-end="url(#bm)"/>
<text x="234" y="10" text-anchor="middle" class="muted" fill="#4c8dd6">insert where it fits</text>
</g>
<!-- pile: face-down cards -->
<g>
<rect x="396" y="36" width="40" height="56" rx="4" fill="currentColor" fill-opacity="0.10" stroke="currentColor" opacity="0.7"/>
<rect x="410" y="30" width="40" height="56" rx="4" fill="currentColor" fill-opacity="0.10" stroke="currentColor" opacity="0.7"/>
<text x="423" y="108" text-anchor="middle" class="muted">the pile: face down</text>
</g>
<!-- array binding -->
<g>
<text x="64" y="142" text-anchor="middle" class="muted">1</text>
<text x="118" y="142" text-anchor="middle" class="muted">2</text>
<text x="172" y="142" text-anchor="middle" class="muted">3</text>
<text x="226" y="142" text-anchor="middle" class="muted">4</text>
<text x="280" y="142" text-anchor="middle" class="muted">5</text>
<text x="334" y="142" text-anchor="middle" class="muted">6</text>
<text x="388" y="142" text-anchor="middle" class="muted">7</text>
<rect x="40" y="150" width="48" height="36" rx="4" fill="#e2903a" fill-opacity="0.18" stroke="currentColor"/>
<text x="64" y="173" text-anchor="middle" class="label" font-size="15">2</text>
<rect x="94" y="150" width="48" height="36" rx="4" fill="#e2903a" fill-opacity="0.18" stroke="currentColor"/>
<text x="118" y="173" text-anchor="middle" class="label" font-size="15">4</text>
<rect x="148" y="150" width="48" height="36" rx="4" fill="#e2903a" fill-opacity="0.18" stroke="currentColor"/>
<text x="172" y="173" text-anchor="middle" class="label" font-size="15">5</text>
<rect x="202" y="150" width="48" height="36" rx="4" fill="#e2903a" fill-opacity="0.18" stroke="currentColor"/>
<text x="226" y="173" text-anchor="middle" class="label" font-size="15">10</text>
<rect x="256" y="150" width="48" height="36" rx="4" fill="none" stroke="#4c8dd6" stroke-width="2.5"/>
<text x="280" y="173" text-anchor="middle" fill="#4c8dd6" font-weight="600" font-size="15">7</text>
<rect x="310" y="150" width="48" height="36" rx="4" fill="currentColor" fill-opacity="0.08" stroke="currentColor" opacity="0.7"/>
<text x="334" y="173" text-anchor="middle" class="muted" font-size="15">?</text>
<rect x="364" y="150" width="48" height="36" rx="4" fill="currentColor" fill-opacity="0.08" stroke="currentColor" opacity="0.7"/>
<text x="388" y="173" text-anchor="middle" class="muted" font-size="15">?</text>
<line x1="299" y1="80" x2="280" y2="144" stroke="#4c8dd6" stroke-width="1" stroke-dasharray="3 3" opacity="0.6"/>
<path d="M 40 198 L 40 203 L 250 203 L 250 198" fill="none" stroke="currentColor" opacity="0.6"/>
<text x="145" y="220" text-anchor="middle" class="muted">A[1..i&#8722;1]</text>
<text x="145" y="234" text-anchor="middle" class="muted">sorted, the original elements</text>
<text x="280" y="220" text-anchor="middle" class="muted">A[i] = key</text>
<path d="M 310 198 L 310 203 L 412 203 L 412 198" fill="none" stroke="currentColor" opacity="0.6"/>
<text x="361" y="220" text-anchor="middle" class="muted">A[i+1..n]</text>
<text x="361" y="234" text-anchor="middle" class="muted">still in the pile</text>
</g>
</svg>

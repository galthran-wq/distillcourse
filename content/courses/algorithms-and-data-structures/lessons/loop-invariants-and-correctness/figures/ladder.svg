<svg viewBox="0 0 600 258" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
<style>.label { fill: currentColor; } .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }</style>
<defs><marker id="cm" markerWidth="7" markerHeight="7" refX="5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 z" fill="currentColor"/></marker><marker id="gm" markerWidth="7" markerHeight="7" refX="5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 z" fill="#5aa46a"/></marker></defs>
<!-- bottom rung: initialization -->
<rect x="60" y="196" width="360" height="48" rx="5" fill="none" stroke="currentColor" stroke-width="1.4"/>
<text x="74" y="216" class="label" font-weight="600">1&#8195;Initialization</text>
<text x="74" y="234" class="label">the invariant holds at the first checkpoint</text>
<text x="452" y="224" class="muted">= base case</text>
<!-- arrow up -->
<line x1="240" y1="192" x2="240" y2="160" stroke="currentColor" stroke-width="1.4" marker-end="url(#cm)"/>
<!-- middle rung: maintenance -->
<rect x="60" y="104" width="360" height="48" rx="5" fill="none" stroke="currentColor" stroke-width="1.4"/>
<text x="74" y="124" class="label" font-weight="600">2&#8195;Maintenance</text>
<text x="74" y="142" class="label">holds before an iteration &#8658; holds before the next</text>
<text x="452" y="132" class="muted">= inductive step</text>
<!-- loop-back arrow on maintenance -->
<path d="M 420 116 C 444 116, 444 140, 420 140" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.6" marker-end="url(#cm)"/>
<text x="452" y="150" class="muted">applied once per iteration</text>
<!-- arrow up -->
<line x1="240" y1="100" x2="240" y2="68" stroke="currentColor" stroke-width="1.4" marker-end="url(#cm)"/>
<!-- top rung: termination -->
<rect x="60" y="12" width="360" height="48" rx="5" fill="#5aa46a" fill-opacity="0.12" stroke="#5aa46a" stroke-width="1.6"/>
<text x="74" y="32" class="label" font-weight="600">3&#8195;Termination</text>
<text x="74" y="50" class="label">invariant at exit + exit condition &#8658; postcondition</text>
<text x="452" y="32" class="muted">= the induction stops,</text>
<text x="452" y="46" class="muted">and the claim is used</text>
</svg>

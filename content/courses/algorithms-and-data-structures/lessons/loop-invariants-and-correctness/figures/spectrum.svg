<svg viewBox="0 0 640 232" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
<style>.label { fill: currentColor; } .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }</style>
<defs><marker id="cm2" markerWidth="7" markerHeight="7" refX="5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 z" fill="currentColor"/></marker></defs>
<!-- axis -->
<line x1="30" y1="150" x2="610" y2="150" stroke="currentColor" stroke-width="1.4" marker-end="url(#cm2)"/>
<text x="608" y="170" text-anchor="end" class="muted">claims about the loop, by logical strength</text>
<!-- usable band -->
<rect x="330" y="140" width="140" height="20" rx="3" fill="#5aa46a" fill-opacity="0.25"/>
<!-- zone 1: trivially true -->
<line x1="90" y1="150" x2="90" y2="112" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5"/>
<rect x="34" y="52" width="130" height="60" rx="5" fill="none" stroke="currentColor" opacity="0.8"/>
<text x="99" y="72" text-anchor="middle" class="label">i &#8804; n + 1</text>
<text x="99" y="90" text-anchor="middle" class="muted">true, maintained,</text>
<text x="99" y="104" text-anchor="middle" class="muted">nothing follows at exit</text>
<text x="99" y="188" text-anchor="middle" class="muted">too weak</text>
<text x="99" y="202" text-anchor="middle" class="muted">to conclude</text>
<!-- zone 2: true but not inductive -->
<line x1="250" y1="150" x2="250" y2="112" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5"/>
<rect x="188" y="52" width="130" height="60" rx="5" fill="none" stroke="currentColor" opacity="0.8"/>
<text x="253" y="72" text-anchor="middle" class="label">s = (i&#8722;1)&#178;</text>
<text x="253" y="90" text-anchor="middle" class="muted">true at every checkpoint,</text>
<text x="253" y="104" text-anchor="middle" class="muted">cannot reprove itself</text>
<text x="253" y="188" text-anchor="middle" class="muted">too weak</text>
<text x="253" y="202" text-anchor="middle" class="muted">to maintain</text>
<!-- zone 3: usable -->
<line x1="400" y1="150" x2="400" y2="112" stroke="#5aa46a" stroke-dasharray="3 3"/>
<rect x="332" y="52" width="140" height="60" rx="5" fill="#5aa46a" fill-opacity="0.12" stroke="#5aa46a" stroke-width="1.6"/>
<text x="402" y="72" text-anchor="middle" class="label" font-size="11">s = (i&#8722;1)&#178; and t = 2i&#8722;1</text>
<text x="402" y="90" text-anchor="middle" class="muted">inductive: reproves itself;</text>
<text x="402" y="104" text-anchor="middle" class="muted">sufficient at exit</text>
<text x="402" y="188" text-anchor="middle" fill="#5aa46a" font-weight="600" font-size="11">usable in a proof</text>
<!-- zone 4: false -->
<line x1="550" y1="150" x2="550" y2="112" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5"/>
<rect x="486" y="52" width="130" height="60" rx="5" fill="none" stroke="currentColor" opacity="0.8"/>
<text x="551" y="72" text-anchor="middle" class="label" font-size="11">A[1..i&#8722;1] holds the</text>
<text x="551" y="86" text-anchor="middle" class="label" font-size="11">i&#8722;1 smallest elements</text>
<text x="551" y="104" text-anchor="middle" class="muted">false at a checkpoint</text>
<text x="551" y="188" text-anchor="middle" class="muted">too strong:</text>
<text x="551" y="202" text-anchor="middle" class="muted">not an invariant at all</text>
</svg>

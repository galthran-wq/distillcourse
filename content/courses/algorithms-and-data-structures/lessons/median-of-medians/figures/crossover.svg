<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" font-family="system-ui, sans-serif">
  <!-- axes -->
  <g stroke="currentColor" stroke-opacity="0.6">
    <line x1="60" y1="260" x2="560" y2="260"/>
    <line x1="60" y1="260" x2="60" y2="36"/>
  </g>
  <!-- x ticks: n = 2^4 … 2^24 -->
  <g stroke="currentColor" stroke-opacity="0.6">
    <line x1="143" y1="260" x2="143" y2="264"/>
    <line x1="227" y1="260" x2="227" y2="264"/>
    <line x1="310" y1="260" x2="310" y2="264"/>
    <line x1="393" y1="260" x2="393" y2="264"/>
    <line x1="477" y1="260" x2="477" y2="264"/>
    <line x1="560" y1="260" x2="560" y2="264"/>
  </g>
  <g fill="currentColor" font-size="11" text-anchor="middle" opacity="0.7">
    <text x="143" y="277">16</text>
    <text x="227" y="277">256</text>
    <text x="310" y="277">4 096</text>
    <text x="393" y="277" font-weight="600" opacity="1">65 536</text>
    <text x="477" y="277">1M</text>
    <text x="560" y="277">16M</text>
  </g>
  <text x="310" y="294" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">n, log scale</text>
  <!-- y ticks -->
  <g stroke="currentColor" stroke-opacity="0.6">
    <line x1="56" y1="225.5" x2="60" y2="225.5"/>
    <line x1="56" y1="122" x2="60" y2="122"/>
  </g>
  <g fill="currentColor" font-size="11" text-anchor="end" opacity="0.7">
    <text x="52" y="229">4</text>
    <text x="52" y="126">16</text>
  </g>
  <text x="20" y="150" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle" transform="rotate(-90 20 150)">comparisons ÷ n</text>
  <!-- n lg n: comparisons per element = lg n, a straight line on this axis -->
  <line x1="60" y1="260" x2="560" y2="53" stroke="currentColor" stroke-opacity="0.65" stroke-width="2"/>
  <text x="545" y="46" font-size="12" fill="currentColor" opacity="0.75" text-anchor="end">n lg n — full sort</text>
  <!-- 4n: randomized quickselect -->
  <line x1="60" y1="225.5" x2="560" y2="225.5" stroke="#4c8dd6" stroke-width="2"/>
  <text x="120" y="243" font-size="12" fill="#4c8dd6">4n — randomized quickselect (expected)</text>
  <!-- 16n: MomSelect -->
  <line x1="60" y1="122" x2="560" y2="122" stroke="#e2903a" stroke-width="2"/>
  <text x="68" y="112" font-size="12" fill="#e2903a">16n — MomSelect (worst case)</text>
  <!-- crossover -->
  <line x1="393" y1="122" x2="393" y2="260" stroke="currentColor" stroke-dasharray="3 3" stroke-opacity="0.5"/>
  <circle cx="393" cy="122" r="4.5" fill="#e2903a"/>
  <text x="386" y="96" font-size="12" font-weight="600" fill="currentColor" text-anchor="end">n = 2¹⁶ = 65 536</text>
  <text x="400" y="148" font-size="11" fill="currentColor" opacity="0.6">16n &lt; n lg n from here</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 310" font-family="system-ui, sans-serif">
  <!-- guaranteed <= x region: columns 1-4, rows 1-3 -->
  <rect x="56" y="46" width="252" height="122" rx="6" fill="#4c8dd6" fill-opacity="0.12" stroke="#4c8dd6" stroke-dasharray="4 3" stroke-opacity="0.7"/>
  <!-- guaranteed >= x region: columns 4-7, rows 3-5 -->
  <rect x="260" y="124" width="252" height="122" rx="6" fill="#5aa46a" fill-opacity="0.12" stroke="#5aa46a" stroke-dasharray="4 3" stroke-opacity="0.7"/>

  <!-- order arrow, left margin -->
  <text x="30" y="66" font-size="11" opacity="0.55" fill="currentColor" text-anchor="middle">small</text>
  <line x1="30" y1="76" x2="30" y2="216" stroke="currentColor" stroke-opacity="0.4"/>
  <path d="M 26 210 L 30 218 L 34 210 Z" fill="currentColor" fill-opacity="0.4"/>
  <text x="30" y="234" font-size="11" opacity="0.55" fill="currentColor" text-anchor="middle">large</text>

  <!-- dots: 7 columns (cx 80..488 step 68), 5 rows (cy 70..222 step 38) -->
  <g fill="currentColor" fill-opacity="0.45">
    <circle cx="80" cy="70" r="7"/><circle cx="80" cy="108" r="7"/><circle cx="80" cy="184" r="7"/><circle cx="80" cy="222" r="7"/>
    <circle cx="148" cy="70" r="7"/><circle cx="148" cy="108" r="7"/><circle cx="148" cy="184" r="7"/><circle cx="148" cy="222" r="7"/>
    <circle cx="216" cy="70" r="7"/><circle cx="216" cy="108" r="7"/><circle cx="216" cy="184" r="7"/><circle cx="216" cy="222" r="7"/>
    <circle cx="284" cy="70" r="7"/><circle cx="284" cy="108" r="7"/><circle cx="284" cy="184" r="7"/><circle cx="284" cy="222" r="7"/>
    <circle cx="352" cy="70" r="7"/><circle cx="352" cy="108" r="7"/><circle cx="352" cy="184" r="7"/><circle cx="352" cy="222" r="7"/>
    <circle cx="420" cy="70" r="7"/><circle cx="420" cy="108" r="7"/><circle cx="420" cy="184" r="7"/><circle cx="420" cy="222" r="7"/>
    <circle cx="488" cy="70" r="7"/><circle cx="488" cy="108" r="7"/><circle cx="488" cy="184" r="7"/><circle cx="488" cy="222" r="7"/>
  </g>
  <!-- median row -->
  <g fill="#e2903a">
    <circle cx="80" cy="146" r="7"/><circle cx="148" cy="146" r="7"/><circle cx="216" cy="146" r="7"/>
    <circle cx="352" cy="146" r="7"/><circle cx="420" cy="146" r="7"/><circle cx="488" cy="146" r="7"/>
  </g>
  <!-- the pivot x -->
  <circle cx="284" cy="146" r="9" fill="#e2903a" stroke="currentColor" stroke-width="1.5"/>
  <text x="284" y="151" font-size="11" font-weight="600" fill="currentColor" text-anchor="middle">x</text>

  <text x="62" y="38" font-size="12" fill="#4c8dd6">3 · ⌈g/2⌉ ≥ 3n/10 elements ≤ x</text>
  <text x="508" y="262" font-size="12" fill="#5aa46a" text-anchor="end">≥ 3n/10 elements ≥ x</text>
  <text x="530" y="150" font-size="11" fill="#e2903a">medians</text>

  <text x="300" y="278" font-size="11" opacity="0.55" fill="currentColor" text-anchor="middle">each column: one group of 5, sorted small → large;</text>
  <text x="300" y="294" font-size="11" opacity="0.55" fill="currentColor" text-anchor="middle">columns arranged by group median (a thought experiment — the algorithm never does this)</text>
</svg>

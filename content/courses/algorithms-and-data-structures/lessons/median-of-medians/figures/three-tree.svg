<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 270" font-family="system-ui, sans-serif">
  <!-- edges -->
  <g stroke="currentColor" stroke-opacity="0.4">
    <line x1="200" y1="54" x2="110" y2="90"/>
    <line x1="200" y1="54" x2="290" y2="90"/>
    <line x1="110" y1="114" x2="60" y2="150"/>
    <line x1="110" y1="114" x2="160" y2="150"/>
    <line x1="290" y1="114" x2="240" y2="150"/>
    <line x1="290" y1="114" x2="345" y2="150"/>
  </g>
  <!-- nodes -->
  <g fill="none" stroke="currentColor" stroke-opacity="0.5">
    <rect x="168" y="30" width="64" height="24" rx="5"/>
    <rect x="78" y="90" width="64" height="24" rx="5"/>
    <rect x="258" y="90" width="64" height="24" rx="5"/>
    <rect x="28" y="150" width="64" height="24" rx="5"/>
    <rect x="128" y="150" width="64" height="24" rx="5"/>
    <rect x="208" y="150" width="64" height="24" rx="5"/>
    <rect x="308" y="150" width="74" height="24" rx="5"/>
  </g>
  <g fill="currentColor" font-size="12" text-anchor="middle">
    <text x="200" y="46">cn</text>
    <text x="110" y="106">cn/3</text>
    <text x="290" y="106">2cn/3</text>
    <text x="60" y="166">cn/9</text>
    <text x="160" y="166">2cn/9</text>
    <text x="240" y="166">2cn/9</text>
    <text x="345" y="166">4cn/9</text>
    <text x="200" y="198" opacity="0.55">⋯</text>
  </g>
  <!-- level sums -->
  <line x1="428" y1="24" x2="428" y2="200" stroke="currentColor" stroke-opacity="0.25"/>
  <text x="492" y="20" font-size="11" opacity="0.55" fill="currentColor" text-anchor="middle">level sum</text>
  <g fill="#4c8dd6" font-size="13" text-anchor="middle">
    <text x="492" y="46">cn</text>
    <text x="492" y="106">cn</text>
    <text x="492" y="166">cn</text>
    <text x="492" y="198">⋮</text>
  </g>
  <line x1="440" y1="212" x2="545" y2="212" stroke="#4c8dd6" stroke-opacity="0.6"/>
  <text x="492" y="232" font-size="13" font-weight="600" fill="#4c8dd6" text-anchor="middle">Θ(n log n)</text>
  <text x="200" y="240" font-size="12" fill="currentColor" opacity="0.8" text-anchor="middle">1/3 + 2/3 = 1: level sums never decay, Θ(log n) levels</text>
</svg>

<svg viewBox="0 0 640 275" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
<style>.label { fill: currentColor; } .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }</style>
<defs>
<marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="currentColor" opacity="0.6"/></marker>
</defs>
<rect x="170" y="14" width="300" height="34" rx="6" fill="none" stroke="currentColor" stroke-width="1.4"/>
<text class="label" x="320" y="36" text-anchor="middle" font-weight="600">compare f(n) with the watershed n<tspan dy="-5" font-size="9">log</tspan><tspan dy="2" font-size="7">b</tspan><tspan dy="-2" font-size="9"> a</tspan></text>
<line x1="290" y1="48" x2="115" y2="110" stroke="currentColor" opacity="0.6" marker-end="url(#arr)"/>
<line x1="320" y1="48" x2="320" y2="110" stroke="currentColor" opacity="0.6" marker-end="url(#arr)"/>
<line x1="350" y1="48" x2="525" y2="110" stroke="currentColor" opacity="0.6" marker-end="url(#arr)"/>
<text class="muted" x="150" y="74" text-anchor="middle">f smaller by a factor n<tspan dy="-4" font-size="8">ε</tspan></text>
<text class="muted" x="328" y="84" text-anchor="start">f the same order</text>
<text class="muted" x="490" y="74" text-anchor="middle">f larger by n<tspan dy="-4" font-size="8">ε</tspan><tspan dy="4">, regularity holds</tspan></text>
<rect x="12" y="112" width="196" height="92" rx="6" fill="none" stroke="currentColor" stroke-width="1.4"/>
<rect x="222" y="112" width="196" height="92" rx="6" fill="none" stroke="currentColor" stroke-width="1.4"/>
<rect x="432" y="112" width="196" height="92" rx="6" fill="none" stroke="currentColor" stroke-width="1.4"/>
<text class="label" x="110" y="134" text-anchor="middle" font-weight="600">case 1 — leaf-dominated</text>
<text x="110" y="158" text-anchor="middle" fill="#e2903a" font-weight="600">T(n) = Θ(n<tspan dy="-5" font-size="9">log</tspan><tspan dy="2" font-size="7">b</tspan><tspan dy="-2" font-size="9"> a</tspan><tspan dy="5" font-size="12">)</tspan></text>
<text class="muted" x="110" y="182" text-anchor="middle" font-size="10.5">4T(n/2) + Θ(n) → Θ(n²)</text>
<text class="label" x="320" y="134" text-anchor="middle" font-weight="600">case 2 — balanced</text>
<text x="320" y="158" text-anchor="middle" fill="#e2903a" font-weight="600">T(n) = Θ(n<tspan dy="-5" font-size="9">log</tspan><tspan dy="2" font-size="7">b</tspan><tspan dy="-2" font-size="9"> a</tspan><tspan dy="5" font-size="12"> lg n)</tspan></text>
<text class="muted" x="320" y="182" text-anchor="middle" font-size="10.5">2T(n/2) + Θ(n) → Θ(n lg n)</text>
<text class="label" x="530" y="134" text-anchor="middle" font-weight="600">case 3 — root-dominated</text>
<text x="530" y="158" text-anchor="middle" fill="#e2903a" font-weight="600">T(n) = Θ(f(n))</text>
<text class="muted" x="530" y="182" text-anchor="middle" font-size="10.5">2T(n/2) + Θ(n²) → Θ(n²)</text>
<text class="muted" x="320" y="234" text-anchor="middle">regularity — a·f(n/b) ≤ c·f(n) for some c &lt; 1 — holds for every polynomial f that case 3 admits</text>
<text class="muted" x="320" y="254" text-anchor="middle">the separation must be polynomial: f = n lg n against watershed n fits no case, and the tree takes over</text>
</svg>

<svg viewBox="0 0 640 240" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
<style>.label { fill: currentColor; } .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }</style>
<line x1="540" y1="18" x2="540" y2="192" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5"/>
<text class="muted" x="100" y="18">target: the bound to reprove at n</text>
<rect x="100" y="24" width="440" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="1.4"/>
<text class="label" x="320" y="36" text-anchor="middle" font-size="11.5">cn lg n</text>
<text class="muted" x="100" y="64">the hypothesis, applied to both halves: 2 · c(n/2) lg(n/2)</text>
<rect x="100" y="70" width="352" height="16" rx="3" fill="#4c8dd6" opacity="0.85"/>
<text x="276" y="82" text-anchor="middle" font-size="11.5" fill="#fff">cn lg n − cn</text>
<rect x="452" y="70" width="88" height="16" rx="3" fill="none" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5"/>
<text class="muted" x="496" y="82" text-anchor="middle" font-size="10.5">slack: cn</text>
<text class="muted" x="100" y="110">plus this call's own Θ(n) cost</text>
<rect x="100" y="116" width="352" height="16" rx="3" fill="#4c8dd6" opacity="0.35"/>
<rect x="452" y="116" width="53" height="16" rx="3" fill="#e2903a" opacity="0.9"/>
<text x="512" y="128" font-size="11" fill="#e2903a">≤ c₂n</text>
<text class="muted" x="100" y="156">result of the inductive step</text>
<rect x="100" y="162" width="405" height="16" rx="3" fill="#4c8dd6" opacity="0.85"/>
<text x="302" y="174" text-anchor="middle" font-size="11.5" fill="#fff">cn lg n − (c − c₂)n</text>
<line x1="505" y1="188" x2="505" y2="196" stroke="currentColor" opacity="0.6"/>
<line x1="540" y1="188" x2="540" y2="196" stroke="currentColor" opacity="0.6"/>
<line x1="505" y1="196" x2="540" y2="196" stroke="currentColor" opacity="0.6"/>
<text class="label" x="522" y="212" text-anchor="end" font-size="11">(c − c₂)n ≥ 0 once c ≥ c₂</text>
<text class="muted" x="320" y="234" text-anchor="middle">the result fits under the target, so the hypothesis reproduces itself at n</text>
</svg>

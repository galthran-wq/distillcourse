<svg viewBox="0 0 640 220" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
<style>.label { fill: currentColor; } .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }</style>
<g transform="translate(12,0)">
<text class="label" x="93" y="20" text-anchor="middle">T(n) = 2T(n/2) + <tspan fill="#e2903a" font-weight="600">n²</tspan></text>
<text class="muted" x="20" y="35" font-size="10">per-level totals</text>
<rect x="20" y="40" width="150" height="14" rx="2" fill="#e2903a" opacity="0.9"/>
<text class="label" x="150" y="51" font-size="10.5" text-anchor="end" fill="#fff">n²</text>
<rect x="20" y="62" width="75" height="14" rx="2" fill="#4c8dd6" opacity="0.85"/>
<text class="label" x="101" y="73" font-size="10.5">n²/2</text>
<rect x="20" y="84" width="38" height="14" rx="2" fill="#4c8dd6" opacity="0.85"/>
<text class="label" x="64" y="95" font-size="10.5">n²/4</text>
<text class="muted" x="30" y="112" font-size="13">⋮</text>
<rect x="20" y="118" width="6" height="14" rx="2" fill="#4c8dd6" opacity="0.85"/>
<text class="label" x="32" y="129" font-size="10.5">≈ n (leaves)</text>
<text class="muted" x="93" y="152" text-anchor="middle" font-size="10.5">totals halve: sum &lt; 2n²</text>
<rect x="13" y="162" width="160" height="46" rx="5" fill="none" stroke="currentColor" opacity="0.8"/>
<text class="label" x="93" y="181" text-anchor="middle" font-weight="600">root-dominated</text>
<text class="label" x="93" y="199" text-anchor="middle">T(n) = Θ(n²)</text>
</g>
<g transform="translate(227,0)">
<text class="label" x="93" y="20" text-anchor="middle">T(n) = 2T(n/2) + <tspan fill="#e2903a" font-weight="600">n</tspan></text>
<rect x="20" y="40" width="110" height="14" rx="2" fill="#e2903a" opacity="0.9"/>
<text class="label" x="136" y="51" font-size="10.5">n</text>
<rect x="20" y="62" width="110" height="14" rx="2" fill="#e2903a" opacity="0.9"/>
<text class="label" x="136" y="73" font-size="10.5">n</text>
<rect x="20" y="84" width="110" height="14" rx="2" fill="#e2903a" opacity="0.9"/>
<text class="label" x="136" y="95" font-size="10.5">n</text>
<text class="muted" x="30" y="112" font-size="13">⋮</text>
<rect x="20" y="118" width="110" height="14" rx="2" fill="#e2903a" opacity="0.9"/>
<text class="label" x="136" y="129" font-size="10.5">n (leaves)</text>
<text class="muted" x="93" y="152" text-anchor="middle" font-size="10.5">totals equal: n × (lg n + 1)</text>
<rect x="13" y="162" width="160" height="46" rx="5" fill="none" stroke="currentColor" opacity="0.8"/>
<text class="label" x="93" y="181" text-anchor="middle" font-weight="600">balanced</text>
<text class="label" x="93" y="199" text-anchor="middle">T(n) = Θ(n lg n)</text>
</g>
<g transform="translate(442,0)">
<text class="label" x="93" y="20" text-anchor="middle">T(n) = 2T(n/2) + <tspan fill="#e2903a" font-weight="600">1</tspan></text>
<rect x="20" y="40" width="18" height="14" rx="2" fill="#4c8dd6" opacity="0.85"/>
<text class="label" x="44" y="51" font-size="10.5">1</text>
<rect x="20" y="62" width="36" height="14" rx="2" fill="#4c8dd6" opacity="0.85"/>
<text class="label" x="62" y="73" font-size="10.5">2</text>
<rect x="20" y="84" width="72" height="14" rx="2" fill="#4c8dd6" opacity="0.85"/>
<text class="label" x="98" y="95" font-size="10.5">4</text>
<text class="muted" x="30" y="112" font-size="13">⋮</text>
<rect x="20" y="118" width="150" height="14" rx="2" fill="#e2903a" opacity="0.9"/>
<text class="label" x="150" y="129" font-size="10.5" text-anchor="end" fill="#fff">n (leaves)</text>
<text class="muted" x="93" y="152" text-anchor="middle" font-size="10.5">totals double: sum &lt; 2n</text>
<rect x="13" y="162" width="160" height="46" rx="5" fill="none" stroke="currentColor" opacity="0.8"/>
<text class="label" x="93" y="181" text-anchor="middle" font-weight="600">leaf-dominated</text>
<text class="label" x="93" y="199" text-anchor="middle">T(n) = Θ(n)</text>
</g>
</svg>

<svg viewBox="0 0 580 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 10.5px; }
    .hot { fill: #e2903a; }
  </style>
  <defs>
    <marker id="cs-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor"/>
    </marker>
  </defs>

  <text class="label" x="290" y="24" text-anchor="middle" font-weight="600">the call stack while fact(5) is deepest in flight</text>

  <!-- stack limit -->
  <line x1="200" y1="60" x2="380" y2="60" stroke="#e2903a" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text class="hot" x="388" y="57" font-weight="600" font-size="11">stack limit</text>
  <text class="hot" x="388" y="71" font-size="10.5">one more frame past this</text>
  <text class="hot" x="388" y="84" font-size="10.5">line: stack overflow</text>
  <text class="muted" x="290" y="86" text-anchor="middle">⋮  deep recursion climbs here</text>

  <!-- frames, bottom-up -->
  <rect x="200" y="256" width="180" height="32" rx="4" fill="none" stroke="currentColor"/>
  <text class="label" x="210" y="276">main()</text>
  <text class="muted" x="372" y="276" text-anchor="end">paused at fact(5)</text>

  <rect x="200" y="222" width="180" height="32" rx="4" fill="none" stroke="currentColor"/>
  <text class="label" x="210" y="242">fact(5)</text>
  <text class="muted" x="372" y="242" text-anchor="end">n=5 · return addr</text>

  <rect x="200" y="188" width="180" height="32" rx="4" fill="none" stroke="currentColor"/>
  <text class="label" x="210" y="208">fact(4)</text>
  <text class="muted" x="372" y="208" text-anchor="end">n=4 · return addr</text>

  <rect x="200" y="154" width="180" height="32" rx="4" fill="none" stroke="currentColor"/>
  <text class="label" x="210" y="174">fact(3)</text>
  <text class="muted" x="372" y="174" text-anchor="end">n=3 · return addr</text>

  <rect x="200" y="120" width="180" height="32" rx="4" fill="none" stroke="currentColor"/>
  <text class="label" x="210" y="140">fact(2)</text>
  <text class="muted" x="372" y="140" text-anchor="end">n=2 · return addr</text>

  <rect x="200" y="94" width="180" height="24" rx="4" fill="none" stroke="#e2903a" stroke-width="2"/>
  <text class="hot" x="210" y="110" font-weight="600">fact(1)</text>
  <text class="muted" x="372" y="110" text-anchor="end">running now</text>

  <!-- push/pop annotations -->
  <line x1="150" y1="270" x2="150" y2="110" stroke="currentColor" stroke-width="1.5" marker-end="url(#cs-a)"/>
  <text class="muted" x="142" y="176" text-anchor="end">a call pushes</text>
  <text class="muted" x="142" y="189" text-anchor="end">one frame</text>

  <line x1="430" y1="110" x2="430" y2="270" stroke="currentColor" stroke-width="1.5" opacity="0.7" marker-end="url(#cs-a)"/>
  <text class="muted" x="440" y="176">a return pops the</text>
  <text class="muted" x="440" y="189">newest frame — LIFO</text>

  <text class="muted" x="290" y="308" text-anchor="middle">every frame below the top is paused, waiting on the one above it: depth 6 = 6 frames of memory</text>
</svg>

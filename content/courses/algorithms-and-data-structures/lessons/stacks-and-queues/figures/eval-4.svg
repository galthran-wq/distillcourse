<svg viewBox="0 0 640 310" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 10.5px; }
    .tok { fill: currentColor; font-size: 15px; }
    .done { fill: currentColor; opacity: 0.28; font-size: 15px; }
    .new { fill: #e2903a; font-size: 15px; font-weight: 600; }
    .hot { fill: #e2903a; }
  </style>

  <text class="label" x="320" y="30" text-anchor="middle" font-weight="600">read  * ( 4 * 5 )  — the ) collapses 4·5 to 20 the same way</text>
  <text class="done" x="60" y="70" text-anchor="middle">(</text>
  <text class="done" x="92" y="70" text-anchor="middle">1</text>
  <text class="done" x="124" y="70" text-anchor="middle">+</text>
  <text class="done" x="156" y="70" text-anchor="middle">(</text>
  <text class="done" x="188" y="70" text-anchor="middle">(</text>
  <text class="done" x="220" y="70" text-anchor="middle">2</text>
  <text class="done" x="252" y="70" text-anchor="middle">+</text>
  <text class="done" x="284" y="70" text-anchor="middle">3</text>
  <text class="done" x="316" y="70" text-anchor="middle">)</text>
  <text class="new" x="348" y="70" text-anchor="middle">*</text>
  <text class="new" x="380" y="70" text-anchor="middle">(</text>
  <text class="new" x="412" y="70" text-anchor="middle">4</text>
  <text class="new" x="444" y="70" text-anchor="middle">*</text>
  <text class="new" x="476" y="70" text-anchor="middle">5</text>
  <text class="new" x="508" y="70" text-anchor="middle">)</text>
  <text class="tok" x="540" y="70" text-anchor="middle">)</text>
  <text class="tok" x="572" y="70" text-anchor="middle">)</text>
  <line x1="44" y1="82" x2="596" y2="82" stroke="currentColor" stroke-width="1" opacity="0.25"/>
  <text class="muted" x="44" y="98">consumed tokens fade; this frame&#8217;s tokens are amber</text>
  <line x1="140" y1="272" x2="232" y2="272" stroke="currentColor" stroke-width="1.5"/>
  <rect x="150" y="242" width="72" height="30" rx="4" fill="none" stroke="currentColor"/>
  <text class="label" x="186" y="262" text-anchor="middle">1</text>
  <rect x="150" y="209" width="72" height="30" rx="4" fill="none" stroke="currentColor"/>
  <text class="label" x="186" y="229" text-anchor="middle">5</text>
  <rect x="150" y="176" width="72" height="30" rx="4" fill="none" stroke="#e2903a" stroke-width="2"/>
  <text class="hot" x="186" y="196" text-anchor="middle" font-weight="600">20</text>
  <text class="label" x="186" y="292" text-anchor="middle" font-weight="600">value stack</text>
  <line x1="410" y1="272" x2="502" y2="272" stroke="currentColor" stroke-width="1.5"/>
  <rect x="420" y="242" width="72" height="30" rx="4" fill="none" stroke="currentColor"/>
  <text class="label" x="456" y="262" text-anchor="middle">+</text>
  <rect x="420" y="209" width="72" height="30" rx="4" fill="none" stroke="#e2903a" stroke-width="2"/>
  <text class="hot" x="456" y="229" text-anchor="middle" font-weight="600">*</text>
  <text class="label" x="456" y="292" text-anchor="middle" font-weight="600">operator stack</text>
</svg>

<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 10.5px; }
    .hot { fill: #e2903a; }
    .blue { fill: #4c8dd6; }
  </style>
  <defs>
    <marker id="rg-hot2" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#e2903a"/>
    </marker>
    <marker id="rg-blue2" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4c8dd6"/>
    </marker>
  </defs>
  <text class="muted" x="24" y="60" font-size="11.5">enqueue a, b, c, d</text>
  <text class="label" x="24" y="78" font-weight="600" font-size="11.5">dequeue → a</text>
  <text class="label" x="24" y="96" font-weight="600" font-size="11.5">dequeue → b</text>
  <rect x="220" y="90" width="60" height="46" rx="4" fill="none" stroke="currentColor" stroke-dasharray="3 3" opacity="0.4"/>
  <text class="muted" x="250" y="152" text-anchor="middle">0</text>
  <rect x="288" y="90" width="60" height="46" rx="4" fill="none" stroke="currentColor" stroke-dasharray="3 3" opacity="0.4"/>
  <text class="muted" x="318" y="152" text-anchor="middle">1</text>
  <rect x="356" y="90" width="60" height="46" rx="4" fill="none" stroke="currentColor"/>
  <text class="label" x="386" y="118" text-anchor="middle" font-size="14">c</text>
  <text class="muted" x="386" y="152" text-anchor="middle">2</text>
  <rect x="424" y="90" width="60" height="46" rx="4" fill="none" stroke="currentColor"/>
  <text class="label" x="454" y="118" text-anchor="middle" font-size="14">d</text>
  <text class="muted" x="454" y="152" text-anchor="middle">3</text>
  <rect x="492" y="90" width="60" height="46" rx="4" fill="none" stroke="currentColor" stroke-dasharray="3 3" opacity="0.4"/>
  <text class="muted" x="522" y="152" text-anchor="middle">4</text>
  <line x1="368" y1="196" x2="368" y2="140" stroke="#4c8dd6" stroke-width="2" marker-end="url(#rg-blue2)"/>
  <text class="blue" x="386" y="212" text-anchor="middle" font-weight="600" font-size="11.5">head j = 2</text>
  <text class="blue" x="386" y="226" text-anchor="middle" font-size="10.5">front of the queue</text>
  <line x1="522" y1="46" x2="522" y2="86" stroke="#e2903a" stroke-width="2" marker-end="url(#rg-hot2)"/>
  <text class="hot" x="522" y="36" text-anchor="middle" font-weight="600" font-size="11.5">next in: (2+2) mod 5 = 4</text>
  <text class="muted" x="254" y="80" text-anchor="middle">slots 0, 1 freed</text>
  <text class="muted" x="24" y="240">count n = 2 · the head moved; no element did</text>
</svg>

<svg viewBox="0 0 720 280" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .head { fill: currentColor; font-size: 11px; font-weight: 600; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 10px; }
    .val { fill: currentColor; font-size: 13px; }
    .one { fill: currentColor; font-size: 13px; font-weight: 600; }
    .hot { fill: #e2903a; font-size: 13px; font-weight: 600; }
  </style>

  <text class="label" x="30" y="26" font-weight="600">Stack and queue operations, worst case Θ(·)</text>
  <text class="muted" x="690" y="26" text-anchor="end">scoreboard v2</text>

  <!-- header -->
  <text class="muted" x="365" y="42" text-anchor="middle">stack discipline</text>
  <text class="muted" x="580" y="42" text-anchor="middle">queue discipline</text>
  <text class="head" x="320" y="58" text-anchor="middle">push</text>
  <text class="head" x="410" y="58" text-anchor="middle">pop</text>
  <text class="head" x="530" y="58" text-anchor="middle">enqueue</text>
  <text class="head" x="630" y="58" text-anchor="middle">dequeue</text>
  <line x1="30" y1="66" x2="690" y2="66" stroke="currentColor" stroke-width="1"/>

  <!-- stripes -->
  <rect x="24" y="74" width="672" height="40" fill="currentColor" opacity="0.05" rx="4"/>
  <rect x="24" y="158" width="672" height="40" fill="currentColor" opacity="0.05" rx="4"/>

  <!-- row 1: pinned-front array -->
  <text class="label" x="30" y="92" font-weight="600">array, front pinned at slot 0</text>
  <text class="muted" x="30" y="106">top/tail index only</text>
  <text class="one" x="320" y="98" text-anchor="middle">1 ‡</text>
  <text class="one" x="410" y="98" text-anchor="middle">1</text>
  <text class="one" x="530" y="98" text-anchor="middle">1 ‡</text>
  <text class="val" x="630" y="98" text-anchor="middle">n</text>
  <text class="muted" x="655" y="98">shifts</text>

  <!-- row 2: circular buffer -->
  <text class="label" x="30" y="134" font-weight="600">circular buffer</text>
  <text class="muted" x="30" y="148">head j + count n, mod capacity</text>
  <text class="one" x="320" y="140" text-anchor="middle">1 ‡</text>
  <text class="one" x="410" y="140" text-anchor="middle">1</text>
  <text class="one" x="530" y="140" text-anchor="middle">1 ‡</text>
  <text class="hot" x="630" y="140" text-anchor="middle">1</text>

  <!-- row 3: linked list -->
  <text class="label" x="30" y="176" font-weight="600">linked list, head (+ tail)</text>
  <text class="muted" x="30" y="190">stack at head; enqueue tail, dequeue head</text>
  <text class="one" x="320" y="182" text-anchor="middle">1</text>
  <text class="one" x="410" y="182" text-anchor="middle">1</text>
  <text class="one" x="530" y="182" text-anchor="middle">1</text>
  <text class="one" x="630" y="182" text-anchor="middle">1</text>

  <line x1="30" y1="212" x2="690" y2="212" stroke="currentColor" stroke-width="1" opacity="0.4"/>
  <text class="muted" x="30" y="232">‡ the capacity wall from scoreboard v1: a full array must still be reallocated and copied — the next lesson's subject</text>
  <text class="muted" x="30" y="250">the circular buffer's dequeue is the repaired cell: the head index moves instead of the data</text>
  <text class="muted" x="30" y="268">reversing the linked orientation (dequeue at the tail) reopens a Θ(n) predecessor walk — refuted in the exercises</text>
</svg>

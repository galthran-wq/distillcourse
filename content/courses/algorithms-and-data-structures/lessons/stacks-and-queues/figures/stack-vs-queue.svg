<svg viewBox="0 0 680 310" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .lifo { fill: #e2903a; }
    .fifo { fill: #4c8dd6; }
  </style>
  <defs>
    <marker id="svq-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor"/>
    </marker>
    <marker id="svq-lifo" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#e2903a"/>
    </marker>
    <marker id="svq-fifo" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4c8dd6"/>
    </marker>
  </defs>

  <text class="label" x="340" y="26" text-anchor="middle" font-weight="600">insert a, b, c, d, in that order — then remove once</text>

  <!-- stack (left) -->
  <line x1="108" y1="120" x2="108" y2="268" stroke="currentColor" stroke-width="1.5"/>
  <line x1="196" y1="120" x2="196" y2="268" stroke="currentColor" stroke-width="1.5"/>
  <line x1="108" y1="268" x2="196" y2="268" stroke="currentColor" stroke-width="1.5"/>

  <rect x="118" y="230" width="68" height="30" rx="4" fill="none" stroke="currentColor"/>
  <text class="label" x="152" y="250" text-anchor="middle">a</text>
  <rect x="118" y="197" width="68" height="30" rx="4" fill="none" stroke="currentColor"/>
  <text class="label" x="152" y="217" text-anchor="middle">b</text>
  <rect x="118" y="164" width="68" height="30" rx="4" fill="none" stroke="currentColor"/>
  <text class="label" x="152" y="184" text-anchor="middle">c</text>
  <rect x="118" y="131" width="68" height="30" rx="4" fill="none" stroke="#e2903a" stroke-width="2"/>
  <text class="lifo" x="152" y="151" text-anchor="middle" font-weight="600">d</text>

  <!-- push arrow in -->
  <line x1="70" y1="86" x2="122" y2="122" stroke="currentColor" stroke-width="1.5" marker-end="url(#svq-a)"/>
  <text class="muted" x="66" y="76">insert (push)</text>

  <!-- pop arrow out -->
  <line x1="182" y1="122" x2="240" y2="86" stroke="#e2903a" stroke-width="2" marker-end="url(#svq-lifo)"/>
  <text class="lifo" x="204" y="64" font-weight="600">remove (pop) → d</text>
  <text class="muted" x="204" y="78">the newest element</text>

  <text class="label" x="152" y="292" text-anchor="middle" font-weight="600">stack — <tspan class="lifo">LIFO</tspan></text>
  <text class="muted" x="152" y="306" text-anchor="middle">both operations at one end</text>

  <!-- queue (right) -->
  <line x1="388" y1="164" x2="648" y2="164" stroke="currentColor" stroke-width="1.5"/>
  <line x1="388" y1="230" x2="648" y2="230" stroke="currentColor" stroke-width="1.5"/>

  <rect x="398" y="172" width="54" height="50" rx="4" fill="none" stroke="#4c8dd6" stroke-width="2"/>
  <text class="fifo" x="425" y="202" text-anchor="middle" font-weight="600">a</text>
  <rect x="460" y="172" width="54" height="50" rx="4" fill="none" stroke="currentColor"/>
  <text class="label" x="487" y="202" text-anchor="middle">b</text>
  <rect x="522" y="172" width="54" height="50" rx="4" fill="none" stroke="currentColor"/>
  <text class="label" x="549" y="202" text-anchor="middle">c</text>
  <rect x="584" y="172" width="54" height="50" rx="4" fill="none" stroke="currentColor"/>
  <text class="label" x="611" y="202" text-anchor="middle">d</text>

  <!-- enqueue arrow in at back -->
  <line x1="672" y1="120" x2="622" y2="166" stroke="currentColor" stroke-width="1.5" marker-end="url(#svq-a)"/>
  <text class="muted" x="668" y="104" text-anchor="end">insert (enqueue) at the back</text>

  <!-- dequeue arrow out at front -->
  <line x1="414" y1="166" x2="368" y2="120" stroke="#4c8dd6" stroke-width="2" marker-end="url(#svq-fifo)"/>
  <text class="fifo" x="356" y="64" font-weight="600">remove (dequeue) → a</text>
  <text class="muted" x="356" y="78">the oldest element</text>

  <text class="label" x="518" y="292" text-anchor="middle" font-weight="600">queue — <tspan class="fifo">FIFO</tspan></text>
  <text class="muted" x="518" y="306" text-anchor="middle">insert at one end, remove at the other</text>
</svg>

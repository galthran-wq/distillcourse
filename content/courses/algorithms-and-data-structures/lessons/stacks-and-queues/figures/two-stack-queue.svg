<svg viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 10.5px; }
    .hot { fill: #e2903a; }
    .blue { fill: #4c8dd6; }
    .badge { fill: none; stroke: #e2903a; stroke-width: 1.5; }
  </style>
  <defs>
    <marker id="tsq-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor"/>
    </marker>
    <marker id="tsq-hot" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#e2903a"/>
    </marker>
  </defs>

  <!-- inbox -->
  <line x1="130" y1="120" x2="130" y2="252" stroke="currentColor" stroke-width="1.5"/>
  <line x1="226" y1="120" x2="226" y2="252" stroke="currentColor" stroke-width="1.5"/>
  <line x1="130" y1="252" x2="226" y2="252" stroke="currentColor" stroke-width="1.5"/>
  <rect x="140" y="214" width="76" height="30" rx="4" fill="none" stroke="currentColor"/>
  <text class="label" x="178" y="234" text-anchor="middle">d</text>
  <rect x="140" y="181" width="76" height="30" rx="4" fill="none" stroke="currentColor"/>
  <text class="label" x="178" y="201" text-anchor="middle">e</text>
  <text class="label" x="178" y="274" text-anchor="middle" font-weight="600">inbox</text>
  <text class="muted" x="178" y="289" text-anchor="middle">enqueue pushes here</text>

  <!-- enqueue arrow -->
  <line x1="52" y1="112" x2="140" y2="172" stroke="currentColor" stroke-width="1.5" marker-end="url(#tsq-a)"/>
  <text class="label" x="30" y="88" font-weight="600">enqueue x: push</text>
  <circle class="badge" cx="46" cy="106" r="9"/>
  <text class="hot" x="46" y="110" text-anchor="middle" font-size="11" font-weight="600">1</text>

  <!-- flip arrow -->
  <path d="M 226 150 C 290 96, 380 96, 448 148" fill="none" stroke="#e2903a" stroke-width="2" marker-end="url(#tsq-hot)"/>
  <text class="hot" x="338" y="66" text-anchor="middle" font-weight="600">outbox empty? flip:</text>
  <text class="muted" x="338" y="81" text-anchor="middle">pop the inbox, push the outbox,</text>
  <text class="muted" x="338" y="94" text-anchor="middle">one element at a time — order reverses</text>
  <circle class="badge" cx="252" cy="132" r="9"/>
  <text class="hot" x="252" y="136" text-anchor="middle" font-size="11" font-weight="600">2</text>
  <circle class="badge" cx="424" cy="132" r="9"/>
  <text class="hot" x="424" y="136" text-anchor="middle" font-size="11" font-weight="600">3</text>

  <!-- outbox -->
  <line x1="452" y1="120" x2="452" y2="252" stroke="currentColor" stroke-width="1.5"/>
  <line x1="548" y1="120" x2="548" y2="252" stroke="currentColor" stroke-width="1.5"/>
  <line x1="452" y1="252" x2="548" y2="252" stroke="currentColor" stroke-width="1.5"/>
  <rect x="462" y="214" width="76" height="30" rx="4" fill="none" stroke="currentColor"/>
  <text class="label" x="500" y="234" text-anchor="middle">c</text>
  <rect x="462" y="181" width="76" height="30" rx="4" fill="none" stroke="#4c8dd6" stroke-width="2"/>
  <text class="blue" x="500" y="201" text-anchor="middle" font-weight="600">b</text>
  <text class="label" x="500" y="274" text-anchor="middle" font-weight="600">outbox</text>
  <text class="muted" x="500" y="289" text-anchor="middle">dequeue pops here</text>
  <text class="blue" x="556" y="201" font-size="10.5">b: oldest still inside,</text>
  <text class="blue" x="556" y="214" font-size="10.5">already on top</text>

  <!-- dequeue arrow -->
  <line x1="540" y1="172" x2="626" y2="112" stroke="currentColor" stroke-width="1.5" marker-end="url(#tsq-a)"/>
  <text class="label" x="556" y="88" font-weight="600">dequeue: pop</text>
  <circle class="badge" cx="632" cy="106" r="9"/>
  <text class="hot" x="632" y="110" text-anchor="middle" font-size="11" font-weight="600">4</text>

  <text class="muted" x="340" y="34" text-anchor="middle">state after enqueue a…e and one dequeue (returned a; b is next): each element makes moves ① ② ③ ④ exactly once</text>
</svg>

<svg viewBox="0 0 640 322" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .node { fill: none; stroke: currentColor; stroke-width: 1.5; }
    .key { fill: currentColor; text-anchor: middle; }
    .tri { fill: currentColor; fill-opacity: 0.08; stroke: currentColor; stroke-width: 1.1; opacity: 0.8; }
    .walk { stroke: #e2903a; stroke-width: 2.4; }
  </style>

  <text class="muted" x="30" y="26">find(a): first pass walks parent pointers to the root e &#8212; 4 steps</text>

  <!-- parent edges along the path (amber: the walk) -->
  <line class="walk" x1="92" y1="262" x2="164" y2="232"/>
  <path d="M 167 231 L 155 230 L 159 240 Z" fill="#e2903a"/>
  <line class="walk" x1="194" y1="219" x2="274" y2="177"/>
  <path d="M 277 175 L 265 176 L 270 185 Z" fill="#e2903a"/>
  <line class="walk" x1="304" y1="164" x2="384" y2="122"/>
  <path d="M 387 120 L 375 121 L 380 130 Z" fill="#e2903a"/>
  <line class="walk" x1="414" y1="109" x2="504" y2="67"/>
  <path d="M 507 65 L 495 66 L 500 75 Z" fill="#e2903a"/>

  <!-- subtrees riding on b and d -->
  <path class="tri" d="M 180 239 L 152 296 L 208 296 Z"/>
  <path class="tri" d="M 400 129 L 372 186 L 428 186 Z"/>

  <!-- nodes -->
  <circle class="node" cx="80" cy="268" r="14"/><text class="key" x="80" y="272">a</text>
  <circle class="node" cx="180" cy="225" r="14"/><text class="key" x="180" y="229">b</text>
  <circle class="node" cx="290" cy="170" r="14"/><text class="key" x="290" y="174">c</text>
  <circle class="node" cx="400" cy="115" r="14"/><text class="key" x="400" y="119">d</text>
  <circle class="node" cx="520" cy="60" r="14"/><text class="key" x="520" y="64">e</text>

  <text class="muted" x="468" y="92">root: parent[e] = e</text>
  <text class="muted" x="140" y="316" font-size="10">subtree of b</text>
  <text class="muted" x="435" y="200" font-size="10">subtree of d</text>
</svg>

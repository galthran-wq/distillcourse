<svg viewBox="0 0 640 322" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .node { fill: none; stroke: currentColor; stroke-width: 1.5; }
    .key { fill: currentColor; text-anchor: middle; }
    .tri { fill: currentColor; fill-opacity: 0.08; stroke: currentColor; stroke-width: 1.1; opacity: 0.8; }
    .edge { stroke: currentColor; stroke-width: 1.4; opacity: 0.75; fill: none; }
  </style>

  <text class="muted" x="30" y="26">after the find: a, b, c, d are all children of e; their subtrees rode along untouched</text>

  <!-- all-direct pointers to e -->
  <path class="edge" d="M 88 254 C 150 90 380 20 508 52"/>
  <path d="M 512 53 L 500 48 L 502 59 Z" fill="currentColor" opacity="0.75"/>
  <path class="edge" d="M 188 212 C 260 95 400 42 507 57"/>
  <path d="M 511 58 L 499 52 L 501 63 Z" fill="currentColor" opacity="0.75"/>
  <path class="edge" d="M 299 157 C 355 95 440 64 505 61"/>
  <path d="M 509 61 L 498 56 L 499 67 Z" fill="currentColor" opacity="0.75"/>
  <line class="edge" x1="414" y1="109" x2="504" y2="67"/>
  <path d="M 507 65 L 495 66 L 500 75 Z" fill="currentColor" opacity="0.75"/>

  <!-- subtrees riding on b and d -->
  <path class="tri" d="M 180 239 L 152 296 L 208 296 Z"/>
  <path class="tri" d="M 400 129 L 372 186 L 428 186 Z"/>

  <!-- nodes -->
  <circle class="node" cx="80" cy="268" r="14"/><text class="key" x="80" y="272">a</text>
  <circle class="node" cx="180" cy="225" r="14"/><text class="key" x="180" y="229">b</text>
  <circle class="node" cx="290" cy="170" r="14"/><text class="key" x="290" y="174">c</text>
  <circle class="node" cx="400" cy="115" r="14"/><text class="key" x="400" y="119">d</text>
  <circle class="node" cx="520" cy="60" r="14" stroke="#e2903a" stroke-width="2.2"/><text class="key" x="520" y="64">e</text>

  <text x="470" y="106" fill="#e2903a" font-size="11">the next find(a) costs 1 step</text>
  <text class="muted" x="140" y="312" font-size="10">subtree of b</text>
  <text class="muted" x="435" y="200" font-size="10">subtree of d</text>
</svg>

<svg viewBox="0 0 640 250" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .blob { fill: none; stroke: currentColor; stroke-width: 1.3; opacity: 0.65; }
    .el { fill: none; stroke: currentColor; stroke-width: 1.4; }
    .rep { fill: #e2903a; fill-opacity: 0.15; stroke: #e2903a; stroke-width: 2; }
    .lbl { fill: currentColor; text-anchor: middle; }
  </style>

  <!-- panel A: four groups -->
  <ellipse class="blob" cx="100" cy="75" rx="70" ry="40"/>
  <circle class="el" cx="55" cy="70" r="11"/><text class="lbl" x="55" y="74">a</text>
  <circle class="el" cx="100" cy="58" r="11"/><text class="lbl" x="100" y="62">b</text>
  <circle class="rep" cx="92" cy="94" r="11"/><text class="lbl" x="92" y="98">c</text>
  <circle class="el" cx="142" cy="82" r="11"/><text class="lbl" x="142" y="86">d</text>

  <ellipse class="blob" cx="95" cy="175" rx="58" ry="33"/>
  <circle class="el" cx="63" cy="168" r="11"/><text class="lbl" x="63" y="172">e</text>
  <circle class="rep" cx="95" cy="186" r="11"/><text class="lbl" x="95" y="190">f</text>
  <circle class="el" cx="127" cy="164" r="11"/><text class="lbl" x="127" y="168">g</text>

  <ellipse class="blob" cx="232" cy="82" rx="44" ry="30"/>
  <circle class="rep" cx="214" cy="78" r="11"/><text class="lbl" x="214" y="82">h</text>
  <circle class="el" cx="250" cy="90" r="11"/><text class="lbl" x="250" y="94">i</text>

  <ellipse class="blob" cx="232" cy="172" rx="26" ry="26"/>
  <circle class="rep" cx="232" cy="172" r="11"/><text class="lbl" x="232" y="176">j</text>

  <text class="muted" x="30" y="238">four groups; a ring marks each representative</text>

  <!-- center arrow -->
  <line x1="296" y1="122" x2="342" y2="122" stroke="currentColor" stroke-width="1.6"/>
  <path d="M 344 122 L 333 116.5 L 333 127.5 Z" fill="currentColor"/>
  <text class="lbl" x="320" y="108" font-size="12">union(g, i)</text>

  <!-- panel B: three groups -->
  <ellipse class="blob" cx="430" cy="75" rx="70" ry="40"/>
  <circle class="el" cx="385" cy="70" r="11"/><text class="lbl" x="385" y="74">a</text>
  <circle class="el" cx="430" cy="58" r="11"/><text class="lbl" x="430" y="62">b</text>
  <circle class="rep" cx="422" cy="94" r="11"/><text class="lbl" x="422" y="98">c</text>
  <circle class="el" cx="472" cy="82" r="11"/><text class="lbl" x="472" y="86">d</text>

  <ellipse class="blob" cx="498" cy="172" rx="102" ry="40"/>
  <circle class="el" cx="425" cy="166" r="11"/><text class="lbl" x="425" y="170">e</text>
  <circle class="rep" cx="457" cy="184" r="11"/><text class="lbl" x="457" y="188">f</text>
  <circle class="el" cx="489" cy="160" r="11"/><text class="lbl" x="489" y="164">g</text>
  <circle class="el" cx="532" cy="180" r="11"/><text class="lbl" x="532" y="184">h</text>
  <circle class="el" cx="567" cy="162" r="11"/><text class="lbl" x="567" y="166">i</text>

  <ellipse class="blob" cx="588" cy="78" rx="26" ry="26"/>
  <circle class="rep" cx="588" cy="78" r="11"/><text class="lbl" x="588" y="82">j</text>

  <!-- find arrow -->
  <path d="M 556 161 Q 512 152 473 179" fill="none" stroke="#4c8dd6" stroke-width="1.6"/>
  <path d="M 470 181 L 481 176 L 475 170 Z" fill="#4c8dd6"/>
  <text x="452" y="132" fill="#4c8dd6" font-size="11">find(i) = f</text>

  <text class="muted" x="360" y="238">after union(g, i): three groups</text>
</svg>

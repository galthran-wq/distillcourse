<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .cell { fill: none; stroke: currentColor; stroke-width: 0.8; opacity: 0.6; }
    .blocked { fill: currentColor; fill-opacity: 0.18; stroke: currentColor; stroke-width: 0.8; opacity: 0.7; }
    .full { fill: #4c8dd6; fill-opacity: 0.4; stroke: #4c8dd6; stroke-width: 1.2; }
    .virt { fill: #e2903a; fill-opacity: 0.15; stroke: #e2903a; stroke-width: 2; }
    .wire { stroke: #e2903a; stroke-width: 1.4; opacity: 0.8; }
  </style>

  <!-- virtual top -->
  <circle class="virt" cx="310" cy="38" r="13"/>
  <text x="332" y="42" fill="#e2903a" font-size="11">virtual top</text>
  <line class="wire" x1="303" y1="49" x2="265" y2="76"/>
  <line class="wire" x1="319" y1="48" x2="355" y2="76"/>

  <!-- blocked cells -->
  <rect class="blocked" x="190" y="76" width="30" height="30"/><rect class="blocked" x="220" y="76" width="30" height="30"/><rect class="blocked" x="280" y="76" width="30" height="30"/><rect class="blocked" x="310" y="76" width="30" height="30"/><rect class="blocked" x="370" y="76" width="30" height="30"/><rect class="blocked" x="400" y="76" width="30" height="30"/>
  <rect class="blocked" x="190" y="106" width="30" height="30"/><rect class="blocked" x="220" y="106" width="30" height="30"/><rect class="blocked" x="280" y="106" width="30" height="30"/><rect class="blocked" x="310" y="106" width="30" height="30"/><rect class="blocked" x="340" y="106" width="30" height="30"/><rect class="blocked" x="400" y="106" width="30" height="30"/>
  <rect class="blocked" x="190" y="136" width="30" height="30"/><rect class="blocked" x="220" y="136" width="30" height="30"/><rect class="blocked" x="310" y="136" width="30" height="30"/><rect class="blocked" x="340" y="136" width="30" height="30"/><rect class="blocked" x="400" y="136" width="30" height="30"/>
  <rect class="blocked" x="220" y="166" width="30" height="30"/><rect class="blocked" x="250" y="166" width="30" height="30"/><rect class="blocked" x="310" y="166" width="30" height="30"/><rect class="blocked" x="340" y="166" width="30" height="30"/><rect class="blocked" x="370" y="166" width="30" height="30"/><rect class="blocked" x="400" y="166" width="30" height="30"/>
  <rect class="blocked" x="220" y="196" width="30" height="30"/><rect class="blocked" x="250" y="196" width="30" height="30"/><rect class="blocked" x="340" y="196" width="30" height="30"/><rect class="blocked" x="370" y="196" width="30" height="30"/><rect class="blocked" x="400" y="196" width="30" height="30"/>
  <rect class="blocked" x="190" y="226" width="30" height="30"/><rect class="blocked" x="220" y="226" width="30" height="30"/><rect class="blocked" x="250" y="226" width="30" height="30"/><rect class="blocked" x="280" y="226" width="30" height="30"/><rect class="blocked" x="340" y="226" width="30" height="30"/><rect class="blocked" x="370" y="226" width="30" height="30"/><rect class="blocked" x="400" y="226" width="30" height="30"/>
  <rect class="blocked" x="190" y="256" width="30" height="30"/><rect class="blocked" x="220" y="256" width="30" height="30"/><rect class="blocked" x="250" y="256" width="30" height="30"/><rect class="blocked" x="280" y="256" width="30" height="30"/><rect class="blocked" x="370" y="256" width="30" height="30"/><rect class="blocked" x="400" y="256" width="30" height="30"/>
  <rect class="blocked" x="190" y="286" width="30" height="30"/><rect class="blocked" x="250" y="286" width="30" height="30"/><rect class="blocked" x="280" y="286" width="30" height="30"/><rect class="blocked" x="310" y="286" width="30" height="30"/><rect class="blocked" x="370" y="286" width="30" height="30"/><rect class="blocked" x="400" y="286" width="30" height="30"/>

  <!-- full (open, connected to top) cells -->
  <rect class="full" x="250" y="76" width="30" height="30"/>
  <rect class="full" x="340" y="76" width="30" height="30"/>
  <rect class="full" x="250" y="106" width="30" height="30"/>
  <rect class="full" x="250" y="136" width="30" height="30"/>
  <rect class="full" x="280" y="136" width="30" height="30"/>
  <rect class="full" x="280" y="166" width="30" height="30"/>
  <rect class="full" x="280" y="196" width="30" height="30"/>
  <rect class="full" x="310" y="196" width="30" height="30"/>
  <rect class="full" x="310" y="226" width="30" height="30"/>
  <rect class="full" x="310" y="256" width="30" height="30"/>
  <rect class="full" x="340" y="256" width="30" height="30"/>
  <rect class="full" x="340" y="286" width="30" height="30"/>

  <!-- open, not connected to top -->
  <rect class="cell" x="370" y="106" width="30" height="30"/>
  <rect class="cell" x="370" y="136" width="30" height="30"/>
  <rect class="cell" x="190" y="166" width="30" height="30"/>
  <rect class="cell" x="190" y="196" width="30" height="30"/>
  <rect class="cell" x="220" y="286" width="30" height="30"/>

  <!-- virtual bottom -->
  <circle class="virt" cx="310" cy="354" r="13"/>
  <text x="332" y="358" fill="#e2903a" font-size="11">virtual bottom</text>
  <line class="wire" x1="303" y1="343" x2="235" y2="316"/>
  <line class="wire" x1="317" y1="343" x2="355" y2="316"/>

  <!-- legend -->
  <rect class="blocked" x="30" y="120" width="16" height="16"/>
  <text class="muted" x="54" y="132">blocked</text>
  <rect class="cell" x="30" y="146" width="16" height="16"/>
  <text class="muted" x="54" y="158">open</text>
  <rect class="full" x="30" y="172" width="16" height="16"/>
  <text class="muted" x="54" y="184">open, connected</text>
  <text class="muted" x="54" y="198">to the top</text>

  <text x="470" y="196" fill="currentColor" font-size="12">percolates &#8660;</text>
  <text x="470" y="214" fill="currentColor" font-size="12">find(top) = find(bottom)</text>
  <text class="muted" x="470" y="238">one query, not one</text>
  <text class="muted" x="470" y="254">per top&#8211;bottom pair</text>
</svg>

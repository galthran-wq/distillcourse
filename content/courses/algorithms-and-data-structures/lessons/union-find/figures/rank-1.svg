<svg viewBox="0 0 640 240" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .node { fill: none; stroke: currentColor; stroke-width: 1.5; }
    .key { fill: currentColor; text-anchor: middle; }
    .tri { fill: currentColor; fill-opacity: 0.08; stroke: currentColor; stroke-width: 1.2; opacity: 0.8; }
    .badge { fill: currentColor; font-size: 11px; }
  </style>

  <text class="muted" x="320" y="24" text-anchor="middle">union(x, y) reaches two roots r and s: compare their ranks</text>

  <!-- tree A, rank 2 -->
  <circle class="node" cx="200" cy="72" r="14"/><text class="key" x="200" y="76">r</text>
  <path class="tri" d="M 200 86 L 148 182 L 252 182 Z"/>
  <text class="badge" x="164" y="56">rank 2</text>
  <text class="muted" x="176" y="156">x below</text>

  <!-- tree B, rank 1 -->
  <circle class="node" cx="460" cy="102" r="14"/><text class="key" x="460" y="106">s</text>
  <path class="tri" d="M 460 116 L 424 182 L 496 182 Z"/>
  <text class="badge" x="484" y="92">rank 1</text>
  <text class="muted" x="438" y="160">y below</text>

  <!-- comparison -->
  <line x1="240" y1="80" x2="420" y2="98" stroke="currentColor" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.5"/>
  <text x="308" y="72" fill="#e2903a" font-size="12">2 &gt; 1</text>

  <text class="muted" x="320" y="222" text-anchor="middle">two trees, two roots, unequal ranks</text>
</svg>

<svg viewBox="0 0 640 240" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .node { fill: none; stroke: currentColor; stroke-width: 1.5; }
    .key { fill: currentColor; text-anchor: middle; }
    .tri { fill: currentColor; fill-opacity: 0.08; stroke: currentColor; stroke-width: 1.2; opacity: 0.8; }
    .badge { fill: currentColor; font-size: 11px; }
  </style>

  <text class="muted" x="320" y="24" text-anchor="middle">the equal case: ranks 2 and 2, so parent[r] &#8592; s and rank[s] increments</text>

  <!-- tree A, rank 2, now linked under s -->
  <circle class="node" cx="200" cy="102" r="14"/><text class="key" x="200" y="106">r</text>
  <path class="tri" d="M 200 116 L 148 182 L 252 182 Z"/>
  <text class="badge" x="164" y="86">rank 2</text>

  <!-- tree B, rank 2 -> 3, the winner -->
  <circle class="node" cx="460" cy="72" r="14" stroke="#e2903a" stroke-width="2"/><text class="key" x="460" y="76">s</text>
  <path class="tri" d="M 460 86 L 408 182 L 512 182 Z"/>
  <text x="484" y="62" fill="#e2903a" font-size="11">rank 2 &#8594; 3</text>

  <!-- new parent edge r -> s -->
  <line x1="218" y1="97" x2="446" y2="78" stroke="#4c8dd6" stroke-width="2.2"/>
  <path d="M 449 78 L 437 73 L 437 84 Z" fill="#4c8dd6"/>
  <text x="270" y="72" fill="#4c8dd6" font-size="11">new parent pointer</text>

  <text class="muted" x="320" y="222" text-anchor="middle">only an equal-rank merge increments a rank: this is the step the doubling argument counts</text>
</svg>

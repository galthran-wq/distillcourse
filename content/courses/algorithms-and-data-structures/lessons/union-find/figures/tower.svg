<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .box { fill: none; stroke: currentColor; stroke-width: 1.4; }
    .val { fill: currentColor; text-anchor: middle; }
    .up { stroke: currentColor; stroke-width: 1.3; opacity: 0.7; }
  </style>

  <text class="muted" x="30" y="24">each rung is 2 raised to the rung below; lg* n counts the rungs</text>

  <!-- ladder, bottom to top -->
  <rect class="box" x="80" y="266" width="130" height="32"/>
  <text class="val" x="145" y="287">2</text>
  <text class="muted" x="228" y="287">lg* = 1</text>

  <line class="up" x1="145" y1="264" x2="145" y2="250"/>
  <path d="M 145 246 L 140 256 L 150 256 Z" fill="currentColor" opacity="0.7"/>
  <rect class="box" x="80" y="212" width="130" height="32"/>
  <text class="val" x="145" y="233">4 = 2<tspan dy="-5" font-size="9">2</tspan></text>
  <text class="muted" x="228" y="233">lg* = 2</text>

  <line class="up" x1="145" y1="210" x2="145" y2="196"/>
  <path d="M 145 192 L 140 202 L 150 202 Z" fill="currentColor" opacity="0.7"/>
  <rect class="box" x="80" y="158" width="130" height="32"/>
  <text class="val" x="145" y="179">16 = 2<tspan dy="-5" font-size="9">4</tspan></text>
  <text class="muted" x="228" y="179">lg* = 3</text>

  <line class="up" x1="145" y1="156" x2="145" y2="142"/>
  <path d="M 145 138 L 140 148 L 150 148 Z" fill="currentColor" opacity="0.7"/>
  <rect class="box" x="80" y="104" width="130" height="32"/>
  <text class="val" x="145" y="125">65,536 = 2<tspan dy="-5" font-size="9">16</tspan></text>
  <text class="muted" x="228" y="125">lg* = 4</text>

  <line class="up" x1="145" y1="102" x2="145" y2="88"/>
  <path d="M 145 84 L 140 94 L 150 94 Z" fill="currentColor" opacity="0.7"/>
  <rect x="80" y="50" width="130" height="32" fill="#e2903a" fill-opacity="0.12" stroke="#e2903a" stroke-width="2"/>
  <text class="val" x="145" y="71">2<tspan dy="-5" font-size="9">65,536</tspan></text>
  <text class="muted" x="228" y="71">lg* = 5</text>

  <!-- right annotation -->
  <text x="330" y="64" fill="#e2903a">2<tspan dy="-5" font-size="9">65,536</tspan><tspan dy="5"> has 19,729 decimal digits.</tspan></text>
  <text class="muted" x="330" y="86">atoms in the observable universe: about 10<tspan dy="-5" font-size="9">80</tspan></text>
  <text class="muted" x="330" y="102">&#8212; an 81-digit number, four rungs up this ladder</text>

  <line x1="330" y1="130" x2="610" y2="130" stroke="currentColor" opacity="0.3"/>

  <text x="330" y="158" fill="currentColor">&#945;(n) climbs even more slowly:</text>
  <text class="muted" x="330" y="182">&#945;(n) = 0 for n &#8804; 2, 1 for n = 3,</text>
  <text class="muted" x="330" y="200">2 for 4 &#8804; n &#8804; 7, 3 for 8 &#8804; n &#8804; 2,047,</text>
  <text class="muted" x="330" y="218">4 for every n from 2,048 up to A&#8324;(1)</text>
  <text x="330" y="248" fill="currentColor">A&#8324;(1) &gt; 2<tspan dy="-5" font-size="9">2,056</tspan><tspan dy="5">, a 620-digit number:</tspan></text>
  <text class="muted" x="330" y="268">&#945;(n) = 5 needs an input no memory</text>
  <text class="muted" x="330" y="286">made of this universe could hold</text>
</svg>

<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .idx { fill: currentColor; opacity: 0.55; font-size: 10px; text-anchor: middle; }
    .box { fill: none; stroke: currentColor; stroke-width: 1.2; }
    .key { fill: currentColor; text-anchor: middle; font-size: 12px; }
    .node { fill: none; stroke: currentColor; stroke-width: 1.4; }
    .edge { stroke: currentColor; stroke-width: 1.2; opacity: 0.75; }
    .hot { stroke: #e2903a; stroke-width: 2.2; opacity: 1; }
    .hotbox { fill: #e2903a; fill-opacity: 0.15; stroke: #e2903a; stroke-width: 2; }
  </style>

  <text class="muted" x="320" y="20" text-anchor="middle">one partition, stored two ways: {0, 5, 6}&#160;&#160;{1, 2, 7}&#160;&#160;{3, 4, 8, 9}</text>

  <!-- left: quick-find -->
  <text x="25" y="48" fill="currentColor">quick-find: id[p] is the representative</text>
  <rect class="box" x="25" y="58" width="26" height="26"/><text class="key" x="38" y="76">0</text>
  <rect class="box" x="51" y="58" width="26" height="26"/><text class="key" x="64" y="76">1</text>
  <rect class="box" x="77" y="58" width="26" height="26"/><text class="key" x="90" y="76">1</text>
  <rect class="box" x="103" y="58" width="26" height="26"/><text class="key" x="116" y="76">8</text>
  <rect class="box" x="129" y="58" width="26" height="26"/><text class="key" x="142" y="76">8</text>
  <rect class="box" x="155" y="58" width="26" height="26"/><text class="key" x="168" y="76">0</text>
  <rect class="box" x="181" y="58" width="26" height="26"/><text class="key" x="194" y="76">0</text>
  <rect class="box" x="207" y="58" width="26" height="26"/><text class="key" x="220" y="76">1</text>
  <rect class="box" x="233" y="58" width="26" height="26"/><text class="key" x="246" y="76">8</text>
  <rect class="box" x="259" y="58" width="26" height="26"/><text class="key" x="272" y="76">8</text>
  <text class="idx" x="38" y="98">0</text><text class="idx" x="64" y="98">1</text>
  <text class="idx" x="90" y="98">2</text><text class="idx" x="116" y="98">3</text>
  <text class="idx" x="142" y="98">4</text><text class="idx" x="168" y="98">5</text>
  <text class="idx" x="194" y="98">6</text><text class="idx" x="220" y="98">7</text>
  <text class="idx" x="246" y="98">8</text><text class="idx" x="272" y="98">9</text>

  <!-- flat stars -->
  <line class="edge" x1="42" y1="203" x2="58" y2="172"/>
  <line class="edge" x1="88" y1="203" x2="70" y2="172"/>
  <circle class="node" cx="64" cy="160" r="12"/><text class="key" x="64" y="164">0</text>
  <circle class="node" cx="38" cy="215" r="12"/><text class="key" x="38" y="219">5</text>
  <circle class="node" cx="92" cy="215" r="12"/><text class="key" x="92" y="219">6</text>

  <line class="edge" x1="132" y1="203" x2="148" y2="172"/>
  <line class="edge" x1="178" y1="203" x2="160" y2="172"/>
  <circle class="node" cx="154" cy="160" r="12"/><text class="key" x="154" y="164">1</text>
  <circle class="node" cx="128" cy="215" r="12"/><text class="key" x="128" y="219">2</text>
  <circle class="node" cx="182" cy="215" r="12"/><text class="key" x="182" y="219">7</text>

  <line class="edge" x1="222" y1="203" x2="242" y2="172"/>
  <line class="edge" x1="250" y1="202" x2="250" y2="173"/>
  <line class="edge" x1="278" y1="203" x2="258" y2="172"/>
  <circle class="node" cx="250" cy="160" r="12"/><text class="key" x="250" y="164">8</text>
  <circle class="node" cx="218" cy="215" r="12"/><text class="key" x="218" y="219">3</text>
  <circle class="node" cx="250" cy="215" r="12"/><text class="key" x="250" y="219">4</text>
  <circle class="node" cx="282" cy="215" r="12"/><text class="key" x="282" y="219">9</text>

  <text class="muted" x="25" y="300">every member sits one hop from its representative;</text>
  <text class="muted" x="25" y="315">a union must rewrite cells to keep it that way</text>

  <!-- right: forest -->
  <text x="352" y="48" fill="currentColor">forest: parent[p] is a parent, not the root</text>
  <rect class="box" x="352" y="58" width="26" height="26"/><text class="key" x="365" y="76">0</text>
  <rect class="box" x="378" y="58" width="26" height="26"/><text class="key" x="391" y="76">1</text>
  <rect class="box" x="404" y="58" width="26" height="26"/><text class="key" x="417" y="76">1</text>
  <rect class="box" x="430" y="58" width="26" height="26"/><text class="key" x="443" y="76">8</text>
  <rect class="box" x="456" y="58" width="26" height="26"/><text class="key" x="469" y="76">8</text>
  <rect class="box" x="482" y="58" width="26" height="26"/><text class="key" x="495" y="76">0</text>
  <rect class="box" x="508" y="58" width="26" height="26"/><text class="key" x="521" y="76">0</text>
  <rect class="box" x="534" y="58" width="26" height="26"/><text class="key" x="547" y="76">1</text>
  <rect class="box" x="560" y="58" width="26" height="26"/><text class="key" x="573" y="76">8</text>
  <rect class="hotbox" x="586" y="58" width="26" height="26"/><text class="key" x="599" y="76">4</text>
  <text class="idx" x="365" y="98">0</text><text class="idx" x="391" y="98">1</text>
  <text class="idx" x="417" y="98">2</text><text class="idx" x="443" y="98">3</text>
  <text class="idx" x="469" y="98">4</text><text class="idx" x="495" y="98">5</text>
  <text class="idx" x="521" y="98">6</text><text class="idx" x="547" y="98">7</text>
  <text class="idx" x="573" y="98">8</text><text class="idx" x="599" y="98">9</text>

  <!-- trees -->
  <line class="edge" x1="369" y1="203" x2="385" y2="172"/>
  <line class="edge" x1="415" y1="203" x2="397" y2="172"/>
  <circle class="node" cx="391" cy="160" r="12"/><text class="key" x="391" y="164">0</text>
  <circle class="node" cx="365" cy="215" r="12"/><text class="key" x="365" y="219">5</text>
  <circle class="node" cx="419" cy="215" r="12"/><text class="key" x="419" y="219">6</text>

  <line class="edge" x1="459" y1="203" x2="475" y2="172"/>
  <line class="edge" x1="505" y1="203" x2="487" y2="172"/>
  <circle class="node" cx="481" cy="160" r="12"/><text class="key" x="481" y="164">1</text>
  <circle class="node" cx="455" cy="215" r="12"/><text class="key" x="455" y="219">2</text>
  <circle class="node" cx="509" cy="215" r="12"/><text class="key" x="509" y="219">7</text>

  <line class="edge" x1="551" y1="196" x2="567" y2="165"/>
  <line class="edge hot" x1="591" y1="196" x2="580" y2="166"/>
  <line class="edge hot" x1="595" y1="250" x2="594" y2="220"/>
  <circle class="node" cx="574" cy="153" r="12"/><text class="key" x="574" y="157">8</text>
  <circle class="node" cx="545" cy="208" r="12"/><text class="key" x="545" y="212">3</text>
  <circle class="node" cx="595" cy="208" r="12"/><text class="key" x="595" y="212">4</text>
  <circle class="node" cx="595" cy="262" r="12"/><text class="key" x="595" y="266">9</text>

  <text class="muted" x="352" y="300">a union rewrites one cell (root to root), but</text>
  <text class="muted" x="352" y="315">find(9) must walk 9 &#8594; 4 &#8594; 8 to name the group</text>
</svg>

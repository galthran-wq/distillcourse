source: "Algorithms" by Jeff Erickson, 1st paperback edition (June 2019)
covers: >
  Full render of book page 5 (PDF page 23), containing both Figure 0.1
  (long multiplication and lattice multiplication of 934x314=293276, from
  the anonymous 1458 "Treviso Arithmetic" / L'Arte dell'Abbaco, the first
  printed mathematics book in the West) and Figure 0.2 (Eutocius's 6th
  century calculation of 1172(1/8) x 1172(1/8), transcribed from Greek and
  translated into modern notation by Johan Heiberg, 1891), both in section
  0.2 "Multiplication".
url: https://jeffe.cs.illinois.edu/teaching/algorithms/book/Algorithms-JeffE.pdf (page 23 of PDF = book page 5)
fetched_via: curl + npm run image capture (pdftoppm-based renderer)
notes: >
  Figure 0.1 (the Treviso lattice-multiplication facsimile) did not extract
  as a separate embedded bitmap object on this page -- only the Eutocius
  figure did -- so this whole-page 300dpi render is the only capture that
  contains it; use it for Figure 0.1 and crop from it if needed. Cleaner
  standalone crops of Figure 0.2's two halves are in
  algorithms-s1-eutocius-original-greek.png and
  algorithms-s1-eutocius-modern-transcription.png. Book states "See Image
  Credits at the end of the book" for both figures; original licence of the
  underlying 1458/1891 reproductions is public domain (age), Erickson's
  book itself is CC BY 4.0.

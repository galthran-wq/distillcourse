source: "Algorithms, 1st edition (June 2019), Jeff Erickson -- Chapter 5, Figure 5.1"
covers: >
  Full-page capture (printed page 188) showing Figure 5.1 in context with its
  caption: a small excerpt of Konrad Miller's 1872 restoration of the Tabula
  Peutingeriana (a medieval copy of a Roman road-network scroll/itinerarium),
  showing the Roman road from modern-day Birten through Koln and Bonn to
  Mainz. Erickson opens Chapter 5 ("Basic Graph Algorithms") with this as the
  oldest concrete example of a graph used for a shortest-route problem.

covers: >
  Clean crop of Figure 5.3 (printed page 189): reciprocal force diagrams
  (dotted lines) from Pierre Varignon's posthumous "Nouvelle mecanique, ou
  statique... " (project dated 1687), an early (pre-1725) example of a graph
  used to solve an equilibrium/statics problem -- ropes under tension meeting
  at points define a closed cycle in a "reciprocal" graph. These are the
  ancestor of what became known as Maxwell-Cremona diagrams.

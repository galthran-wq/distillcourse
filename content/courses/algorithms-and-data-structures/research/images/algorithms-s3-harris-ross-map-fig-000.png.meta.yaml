source: "Algorithms, by Jeff Erickson (1st edition, June 2019)"
covers: "Figure 10.1 (printed page 328), Chapter 10 'Maximum Flows & Minimum Cuts' opening"
url: "https://jeffe.cs.illinois.edu/teaching/algorithms/book/Algorithms-JeffE.pdf (PDF page 346); original source: Harris, T.E. and Ross, F.S., 'Fundamentals of a method for evaluating rail net capacities', RAND Corporation Research Memorandum RM-1573, 1955, http://www.dtic.mil/dtic/tr/fulltext/u2/093458.pdf"
fetched_via: curl
notes: >
  Captured via `npm run image -- capture <pdf> <out>.png 346 --dpi 180`.
  The page render produced two embedded bitmaps (-fig-000 and -fig-001); -fig-001
  was blank and was deleted. -fig-000 is the actual figure: a photostat/scan of
  RAND RM-1573 Fig. 7, "Traffic pattern: entire network available" — the
  declassified 1955 map of the Warsaw Pact rail network used by Harris and Ross
  to pose (informally) the max-flow / min-cut problem, marked "SECRET" with
  handwritten annotations, showing "The bottleneck" labeled on the map. Erickson's
  book credits this as a US Government work in the public domain, declassified
  1999 at Alexander Schrijver's request. Scan legibility: good — text and node
  labels readable at 180 dpi, some speckling/artifacts typical of a mid-century
  photostat scan, black and white.

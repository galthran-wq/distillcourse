source: "Algorithms, Part I (Princeton) — lecture slides 2.3 Quicksort, by Robert Sedgewick and Kevin Wayne"
covers: "Same PDF page as algorithmspa-s1-bentley-mcilroy-mailinglist (p.14, slides 53-56: 'Engineering a system sort', Yaroslavskiy's Sept-2009 post, the Oct-2009 OpenJDK changeset, dual-pivot partitioning) — re-rendered at 400 dpi instead of 200 so single quadrants survive cropping."

url: "https://algs4.cs.princeton.edu/lectures/keynote/23Quicksort-2x2.pdf"
fetched_via: "npm run image -- capture <url> <dest> 14 --dpi 400 --max-width 4000 --no-embedded (whole-page vector render; nothing extractable is stored as a bitmap on this page)"
notes: "4000x3091. Supersedes the 200-dpi capture for cropping work: at 200 dpi a single quadrant is only ~1000px wide and the monospace mail text softens when cut out. The paper masthead can be re-rendered even sharper by pointing pdftoppm at that region alone (-r 800 -x 880 -y 1650 -W 2350 -H 1140). The journal running head 'SOFTWARE—PRACTICE AND EXPERIENCE, VOL. 23(11), 1249-1265 (NOVEMBER 1993)' is present in the PDF text layer but masked out of the visible thumbnail, so the 1993 date is NOT visible in any crop."

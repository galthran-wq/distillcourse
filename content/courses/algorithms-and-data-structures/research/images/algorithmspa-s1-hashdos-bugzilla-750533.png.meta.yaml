notes: "Hunted, not pooled. The pooled candidate algorithmspa-s1-hashdos-bugreport (Princeton slides 3.4, p.10) shows only the Description comment body of this same ticket — no Bugzilla chrome, no 'Bug 750533', no 'Alias: CVE-2012-2739', no summary line — so it cannot carry the 'this is a real tracker page' reading, and its 8px monospace body is unreadable at a 380px float. Captured at a narrow viewport deliberately: Bugzilla's stacked narrow layout keeps the field text large relative to the frame width, which is what makes a 380px floated crop legible. Content is Red Hat's public tracker; no login needed."

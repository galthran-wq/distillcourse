source: "Algorithms, Part I & Part II (Princeton, Coursera), lecture slides by Robert Sedgewick and Kevin Wayne -- '6.5 Reductions' (Cook-Levin theorem / NP-completeness section)"
covers: "Slide 51/56, 'Implications of Cook-Levin theorem' -- portrait photos of Stephen Cook ('82 Turing award) and Leonid Levin inset next to the reduction tree showing 3-SAT at the root with IND-SET, VERTEX COVER, CLIQUE, HAM-CYCLE/PATH, TSP, EXACT COVER, SUBSET-SUM, PARTITION, KNAPSACK, BIN-PACKING all reducing to it. A companion slide 46/56 ('More poly-time reductions from 3-satisfiability') carries the same tree with a portrait of Dick Karp ('85 Turing award) instead."
url: "https://algs4.cs.princeton.edu/lectures/keynote/65Reductions.pdf (single-slide version), pages 46 and 51"
fetched_via: "npm run image -- capture (pdftoppm-based renderer in scripts/image.ts)"
notes: "180 dpi whole-page render; page 51 also stores an embedded figure bitmap (65p51-fig-001.png) worth checking at crop time for a cleaner portrait crop. The reduction-tree diagram itself is ordinary and should be redrawn in house style; only the Cook/Levin/Karp portrait photos are the reason to keep an original capture -- real photographs of the theorem's namesakes, Turing-award laureates, not available as a clean redraw target."

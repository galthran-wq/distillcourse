source: "Algorithms, Part I & Part II (Princeton, Coursera), lecture slides by Robert Sedgewick and Kevin Wayne -- '4.1 Undirected Graphs'"
covers: "Full-resolution slide 69/73, 'Bridges of Königsberg' -- Euler's 1736 problem statement (quoted) alongside a period-style engraved map of Königsberg (island Kneiphof, river branches, seven labeled bridges A-D) plus the abstracted multigraph Euler used to reason about it"
url: "https://algs4.cs.princeton.edu/lectures/keynote/41UndirectedGraphs.pdf (single-slide-per-page version; page 69 of 73). The paginated '2x2' handout version (4 slides/page) used elsewhere on the booksite has the same content on physical page 17 of 19."
fetched_via: "npm run image -- capture (pdftoppm-based renderer in scripts/image.ts)"
notes: "180 dpi whole-page render; nothing extractable as a separate embedded bitmap (vector-composited slide), so the page render is the source to crop the map illustration from. The engraved map of Königsberg is a reproduction of a historical illustration (public-domain, 18th-century subject matter) -- redrawing it in house style would destroy the point that this is literally Euler's original problem; the adjacent abstract graph, by contrast, is ordinary and can be redrawn."

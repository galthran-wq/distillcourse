source: "A Note on Two Problems in Connexion with Graphs, E. W. Dijkstra, Numerische Mathematik 1, 269-271 (1959)"
shows: >
  Original typeset opening page of the paper: title, byline "E. W. DIJKSTRA",
  journal header "Numerische Mathematik 1, 269-271 (1959)", the opening
  problem statement (n nodes, branches, at least one path between any two
  nodes), and the full text of Problem 1 (minimum spanning tree) through the
  start of the comparison with Kruskal/Loberman-Weinberger. Springer
  colophon mark in top right.
located: "Page 1 (p. 269) of the 3-page paper"
url: "https://ir.cwi.nl/pub/9256/9256D.pdf, page 1"
license: "publisher (c) Springer / Numerische Mathematik -- teaching use; CWI institutional repository hosts it openly for access, no explicit open license stated on the page"
quality: "Clean, fully legible 180dpi scan; classic 1959 letterpress typesetting, minor natural page toning, no damage or occlusion"
why_real: >
  This is the literal founding document of the algorithm the lesson teaches --
  a redrawing would just be "text," destroying the point of showing students
  that Dijkstra's algorithm was introduced in three succinct paragraphs of
  prose, with no pseudocode and no figures, in a two-and-a-half-page note.
  The historical typesetting, terse style, and even the archaic spelling
  ("Connexion") are the artifact.

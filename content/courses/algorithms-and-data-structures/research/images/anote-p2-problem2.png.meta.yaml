source: "A Note on Two Problems in Connexion with Graphs, E. W. Dijkstra, Numerische Mathematik 1, 269-271 (1959)"
shows: >
  Original typeset page containing the full statement of "Problem 2. Find
  the path of minimum total length between two given nodes P and Q" --
  this is the literal first publication of what is now called Dijkstra's
  algorithm. Includes the three-way node partition (A: finalized shortest
  distance known, B: frontier, C: unvisited), the three-way branch
  partition, Step 1 (relaxation) and Step 2 (select minimum-distance
  frontier node), plus Remark 1 (directed/asymmetric edge lengths) and the
  start of Remark 2 (bookkeeping advice).
located: "Page 2 (p. 270) of the 3-page paper"
url: "https://ir.cwi.nl/pub/9256/9256D.pdf, page 2"
license: "publisher (c) Springer / Numerische Mathematik -- teaching use; CWI institutional repository hosts it openly for access, no explicit open license stated on the page"
quality: "Clean, fully legible 180dpi scan; classic 1959 letterpress typesetting, no damage or occlusion"
why_real: >
  This page IS the primary source for the shortest-paths-dijkstra lesson --
  the exact original wording of the relaxation step and the frontier-set
  greedy selection that the modern algorithm still follows almost verbatim.
  Showing the original page (rather than a redrawn modern pseudocode box)
  lets students see there was no pseudocode at all: the algorithm was
  specified entirely in prose about "sets" of nodes and branches, which is
  itself a teaching point about how algorithmic thinking was communicated
  before pseudocode conventions existed.

notes: >
  Whole-page render; the page itself is a vector title slide with one embedded
  stock photo (JPEG, ~903x554 px source resolution per pdfimages) of the
  Sesame Street muppet 'The Count' (Count von Count), used as a pun for
  'Count Sketch'. This is a low-priority/optional candidate: it is decorative,
  not instructional, but it is a genuine photograph whose joke depends on the
  viewer recognizing the actual licensed character likeness — a redrawing
  would either lose recognizability or invite a fresh copyright question, so
  if used at all it should stay a real photo, small and captioned as a wink
  rather than as a teaching figure. Licence: publisher/franchise photo,
  status unknown — treat as fair-use-for-teaching-commentary at most, do not
  present as freely licensed.

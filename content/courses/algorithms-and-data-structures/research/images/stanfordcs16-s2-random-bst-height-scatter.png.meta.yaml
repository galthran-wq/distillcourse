source: "Stanford CS166 — Advanced Data Structures (Keith Schwarz), Lecture 08: Random Binary Search Trees"
covers: "Empirical scatter plot of measured randomly-built-BST heights vs. n (log-x axis, n from 10^0 to 10^21), with an overlaid trendline of slope approx 2.91 annotated 'the theory matches what we see IRL', confirming the lecture's theorem E[height] = gamma*lg(n) - O(log log n) with gamma approx 2.988."
url: "https://web.stanford.edu/class/archive/cs/cs166/cs166.1266/lectures/08/Condensed%20Slides.pdf, page 43"
fetched_via: curl (PDF) + npm run image capture (page render)
notes: "Full-page render at 180 dpi; the chart is a vector figure baked into the slide, not a separately embedded bitmap, so nothing extra was extractable. Heights were generated using Robson's O(log^4 n) expected-time algorithm for sampling heights of random n-node BSTs (cited on the same lecture's later slide) -- this is a real measured/simulated data plot, not a schematic, so a redrawing would lose the actual noise pattern that is the point of showing it (empirical confirmation of a nontrivial asymptotic constant). Licence: publisher (Stanford CS166 course materials) (c) -- teaching use; slides are freely posted on the public course site with no explicit reuse licence stated (unknown/assume teaching-use only)."

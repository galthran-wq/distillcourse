notes: "Captured at 180 dpi. Grayscale scan, legible typewritten math with handwritten symbol touch-ups (the &, quantifiers etc. were typed then hand-inked in places, visible as slightly heavier ink). Notably carries a handwritten marginal correction near the Gt_i,j transition-function formula reading approximately '(or states: (nondeterminism)' -- Cook's own handwritten fix to the typewritten text, which the modern Rohlfs transliteration (thecomplexit-cook1971.txt, footnote 5) flags as 'handwritten annotation I cannot decipher.' This page is the closest thing to 'the Cook-Levin construction in Cook's own hand' available."

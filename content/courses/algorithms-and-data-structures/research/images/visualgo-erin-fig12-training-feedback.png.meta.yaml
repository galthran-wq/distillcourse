source: "Erin Teo Yi Ling, NUS SoC B.Comp Dissertation, \"Teaching Algorithms with Web-based Technologies\" (2015), supervised in the VisuAlgo project by Steven Halim"
covers: >
  Figure 12 of the dissertation: a real screenshot of the VisuAlgo Training
  mode showing a wrongly-answered Selection Sort question — "click the
  sequence of integers that represent the content of the array [37, 3, 17,
  39, 11, 31, 5, 18] after 3 passes of Selection Sort," the student's (wrong,
  red-highlighted) answer, the correct answer, and the boxed "Click here to
  try out the visualization" link that jumps straight to the live sort
  animation preloaded with that exact array.
url: "https://visualgo.net/fyp/erin-report.pdf (page 25 of 64, embedded figure bitmap)"
fetched_via: curl
notes: >
  Real product screenshot (2015) documenting VisuAlgo's core closed-loop
  pedagogy: randomized auto-graded question -> instant feedback ->
  one-click jump to the exact live visualization that explains the mistake.
  This loop is described but not otherwise capturable from the live JS app
  itself (no static screenshot exists to fetch directly), so this archival
  screenshot is the only real artifact showing it in situ. The visual style
  (pink/white nav bar) is the 2015-era VisuAlgo skin; the current site has a
  modern flat redesign, so treat this as documentation of the *mechanism*,
  not the current pixel-for-pixel look.

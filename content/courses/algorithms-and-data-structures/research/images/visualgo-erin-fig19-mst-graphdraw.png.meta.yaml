notes: >
  Real product screenshot documenting a distinctive, easy-to-miss mechanism
  (user-submitted graphs feeding the quiz generator) that a redrawing would
  not credibly convey — it is a specific UI dialog with specific instructor-
  style instruction text, not a generic diagram. Same 2015-era visual skin
  caveat as the sibling capture from this dissertation.

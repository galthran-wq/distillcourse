source: "Erin Teo Yi Ling, NUS SoC B.Comp Dissertation, \"Teaching Algorithms with Web-based Technologies\" (2015), supervised in the VisuAlgo project by Steven Halim"
covers: >
  Figure 19 of the dissertation: a real screenshot of VisuAlgo's
  Minimum-Spanning-Tree graph-drawing modal, prompting a logged-in user to
  "draw a connected undirected weighted graph, preferably V > 7, minimize
  edge crossing, and make your graph challenging for Prim's/Kruskal's
  algorithm," with a "submit drawn graph to database for random graph and
  online quiz purposes" checkbox — i.e. VisuAlgo crowdsources some of its
  own quiz-graph pool from user submissions.
url: "https://visualgo.net/fyp/erin-report.pdf (page 33 of 64, embedded figure bitmap)"

source: "VisuAlgo (Steven Halim) — cited via: Halim, S. (2015). \"VisuAlgo – Visualising Data Structures and Algorithms Through Animation.\" Olympiads in Informatics, 9, 243–245."
covers: "Fig. 1 of the paper: a screenshot of the actual VisuAlgo landing page (circa 2015), showing the grid of visualization-module tiles with their now-canonical colour-coded icons (Sorting green bars, BST pink tree, Graph Data Structures red graph, Union-Find blue forest, MST orange graph, Suffix Array indigo table, etc.) and the top-nav Answers/Test/Training links."
url: "https://ioinformatics.org/journal/v9_2015_243_245.pdf (page 2 of 3)"
fetched_via: curl
notes: >
  This is the peer-reviewed short paper Steven Halim (VisuAlgo's creator, NUS)
  published introducing VisuAlgo's quiz system; it is the closest thing to an
  "official" historical documentation source with real screenshots (the live
  site itself is a JS app with no static screenshots to fetch — its own
  per-module og:image previews, e.g. https://visualgo.net/img/png/<slug>.png,
  are simplified flat-colour icons, not real interface screenshots, and were
  checked and rejected as image candidates for that reason). The module list
  shown (20 tiles) is the 2015 roster; the live site now has 26 modules
  (added bitmask, cyclefinding, matching, mvc, steinertree, tsp, reductions,
  polygon/convexhull split, etc. since) — treat the tile grid as illustrating
  the *interface pattern*, not a current module count.

source: "VisuAlgo (Steven Halim) — cited via: Halim, S. (2015). \"VisuAlgo – Visualising Data Structures and Algorithms Through Animation.\" Olympiads in Informatics, 9, 243–245."
covers: >
  Fig. 2 of the paper: a three-panel annotated screenshot of the real
  VisuAlgo Training/Quiz mode for the Minimum Spanning Tree module —
  (1) a randomly-generated MST question with a drawn weighted graph,
  (2) instant grading with the correct answer sequence shown after a wrong
  submission, and (3) the linked live "Exploration Mode" visualization
  (green tree edges, blue circled decision, right-hand pseudocode panel
  with the current line highlighted, bottom playback scrubber) that a
  student can jump to from the graded question to restudy the concept.
url: "https://ioinformatics.org/journal/v9_2015_243_245.pdf (page 3 of 3, embedded figure bitmap)"
fetched_via: curl
notes: >
  Real screenshot of the actual product UI (not a redrawing) — shows the
  pseudocode-panel-plus-canvas-plus-playback-scrubber layout that recurs
  identically across all 26 modules on the live site today, and the
  Training-mode quiz loop (randomized question -> instant grading ->
  jump-to-visualization) that is VisuAlgo's signature pedagogical feature
  beyond "just" animation. Captured via `npm run image -- capture` which
  pulled this as an embedded figure bitmap on PDF page 3 (kept in preference
  over the whole-page render, which was visually identical plus page
  furniture).

# Canon for "Algorithms and Data Structures" (course 1) — with access status.
# access values:
#   full          — the reading swarm read the whole source; raw text cached in research/texts/
#   summary-based — read via condensed/companion material only; FLAGGED for the human
#                   to obtain the real edition so research can be re-run against it
#   cited-only    — in the bibliography / course-2 proposal on reputation; not read
schema_version: 1
sources:
  # ── Primary textbooks ────────────────────────────────────────────────────
  - id: clrs4
    title: "T. H. Cormen, C. E. Leiserson, R. L. Rivest, C. Stein — Introduction to Algorithms, 4th ed., MIT Press, 2022"
    url: https://archive.org/download/introduction-to-algorithms_202503/Introduction%20to%20Algorithms.pdf
    access: full
    access_notes: >
      Entire book (printed pp. 3-1312) read in three shards via pdftotext from an
      open Internet Archive item; PDF page = printed page + 22. Text cache:
      research/texts/introduction-s1-ch1-15.txt plus the full PDF
      introduction-s1-full.pdf. Ligature/OCR-style artifacts throughout ("ûrst"
      for "first"); check exact formulas against the page render, not the text.
    role: "Backbone reference for every module: definitions, theorem statements, the canonical figures (three-panel O/Ω/Θ, heap dual view, red-black cases, rod cutting, cut property, Fig 9.3 groups of 5)."

  - id: sedgewick-wayne-book
    title: "R. Sedgewick, K. Wayne — Algorithms, 4th ed., Addison-Wesley, 2011"
    url: https://algs4.cs.princeton.edu/home/
    access: summary-based
    access_notes: >
      NOT the full book. Read via the official companion booksite
      (algs4.cs.princeton.edu), which self-describes as "condensed excerpts"
      (~40-60% of print depth: shorter proofs, fewer worked examples, some
      material book-only). All 6 chapter pages + all 29 subsection pages read.
      Ch. 6 "Context" is marked "under major construction"; 6.2 B-trees is an
      empty stub. The archive.org full scan is an unauthorized upload and was
      deliberately not used. HUMAN ACTION: obtain the print/ebook edition
      (Pearson/Addison-Wesley, or the purchase links on the booksite) so the
      reading swarm can be re-run against the complete text.
    role: "Code-first counterpoint to CLRS: API-table convention, empirical doubling method, real-world hooks (percolation, arbitrage, Kevin Bacon), war stories."

  - id: sedgewick-wayne-slides
    title: "R. Sedgewick, K. Wayne — Algorithms Part I & II lecture slides (Princeton/Coursera companion)"
    url: https://algs4.cs.princeton.edu/lectures/
    access: full
    access_notes: >
      Every published lecture-slide deck (keynote/*-2x2.pdf) downloaded and read;
      cached as research/texts/algorithmspa-*. Coverage uneven BY THE SOURCE'S
      DESIGN: no decks exist for 1.1, 1.2, 2.5, 5.4, 6.1, 6.3, 6.6 (booksite
      prose only). No Coursera video content accessed (paywalled).
    role: "War stories and real artifacts (HashDoS CVE, red-black lawsuit, dual-pivot mailing list, Guibas-Sedgewick scan) plus the accumulating comparison-table teaching device."

  - id: erickson
    title: "J. Erickson — Algorithms, 1st paperback ed., June 2019 (CC BY 4.0)"
    url: https://jeffe.cs.illinois.edu/teaching/algorithms/book/Algorithms-JeffE.pdf
    access: full
    access_notes: >
      Entire book (Ch. 0-12 + back matter) read in three shards; full PDF cached
      as research/texts/algorithms-s1-full.pdf / algorithms-s3-full.pdf with
      extracted text shards. CC BY 4.0 — figures may be adapted with attribution.
    role: "Proof-first spine for recursion, backtracking→DP arc, the generic-framework device (WhateverFirstSearch, safe-edge MST, Ford relaxation), NP-hardness reductions, and the deepest historical notes."

  - id: morin
    title: "P. Morin — Open Data Structures (pseudocode ed. 0.1G-beta), CC BY"
    url: https://opendatastructures.org/ods-python.pdf
    access: full
    access_notes: "Full 326-page PDF read via pdftotext -layout; no paywall."
    role: "Interface-before-implementation discipline (List/USet/SSet), the amortized dynamic-array proofs, 2-4-tree explanation of red-black rules, sorting lower bound incl. randomized case."

  - id: mit6006
    title: "E. Demaine, J. Ku, J. Solomon — MIT 6.006 Introduction to Algorithms, Spring 2020, OCW lecture notes L01-L20"
    url: https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/
    access: full
    access_notes: >
      All 20 lecture-note PDFs read; cached as research/texts/mit6-lec{1..20}.*.
      L21 is video-only (no notes), out of scope. Stale 6.046 files from an
      unrelated prior run were moved out of the cache.
    role: "The syllabus-shape sanity check for course 1 and the SRT BOT DP framework; source of the wall-clock asymptotics table, build-heap O(n) proof, and pseudopolynomial-time treatment."

  - id: mit6046
    title: "E. Demaine, S. Devadas, N. Lynch — MIT 6.046J Design and Analysis of Algorithms, Spring 2015, OCW lecture notes (24 lectures)"
    url: https://ocw.mit.edu/courses/6-046j-design-and-analysis-of-algorithms-spring-2015/
    access: full
    access_notes: >
      All 24 lecture-note PDFs read. OCR/extraction noisy in L19-20, L22-23
      (slide-deck transcripts) — re-derive formulas rather than quoting.
    role: "Course-2 boundary marker (what a follow-on covers) plus course-1 borrowings: interval scheduling exchange argument, median-of-medians, amortized methods, approximation-algorithms overview for the coping lesson."

  - id: cs166
    title: "K. Schwarz — Stanford CS166 Advanced Data Structures, lecture slides 00-18"
    url: https://web.stanford.edu/class/cs166/
    access: full
    access_notes: "All 19 condensed-slide decks read in full. Almost entirely course-2 material."
    role: "Grounds course-2 proposal modules A/B; course-1 borrowings: random-BST height empirical scatter, the 2-3-4↔red-black isometry pedagogy, Seidel-Sharir union-find analysis framing."

  - id: cmu15210
    title: "CMU 15-210 Parallel and Sequential Data Structures and Algorithms, lecture notes (S26)"
    url: https://www.cs.cmu.edu/~15210/schedule.html
    access: full
    access_notes: "All 23 notes PDFs + concurrency slides read; cached as research/texts/cmu15-*."
    role: "Grounds course-2 proposal module G (work/span, parallelism); course-1 borrowings: Skittles Lemma flavor of randomized analysis, universal-hashing framing, Borůvka contraction perspective for the MST lesson's outlook."

  # ── Primary papers (read) ───────────────────────────────────────────────
  - id: dijkstra1959
    title: "E. W. Dijkstra — A Note on Two Problems in Connexion with Graphs, Numerische Mathematik 1, 269-271, 1959"
    url: https://ir.cwi.nl/pub/9256/9256D.pdf
    access: full
    access_notes: "Complete 3-page paper read; cached as research/texts/anote-dijkstra1959.*. Original pages captured as images (anote-p1-title, anote-p2-problem2)."
    role: "Primary artifact for the Dijkstra lesson: the algorithm's first publication — prose only, no pseudocode, memory-frugality as the stated motivation; also the MST connection (Problem 1 = Prim's)."

  - id: cook1971
    title: "S. A. Cook — The Complexity of Theorem-Proving Procedures, STOC 1971, 151-158"
    url: https://www.cs.toronto.edu/~sacook/homepage/1971.pdf
    access: full
    access_notes: "Full 7-page transliteration read + original scanned offprint checked for the two image captures. Paper predates the terms 'NP', 'NP-complete', 'SAT'."
    role: "Primary artifact for the NP-completeness lesson: Theorem 1 is the Cook-Levin construction; the pre-terminology P-vs-NP statement is a quotable set piece."

  - id: karp1972
    title: "R. M. Karp — Reducibility Among Combinatorial Problems, 1972 (2010 reprint with Karp's retrospective)"
    url: https://www.cs.umd.edu/~gasarch/BLOGPAPERS/Karp.pdf
    access: full
    access_notes: "Front matter has a text layer; the 1972 body is a scan, OCR'd locally — prose reliable, dense math unreliable, Figure 1 captured as an image instead."
    role: "The 21-problems catalogue and Figure 1 reduction tree for the NP-completeness lesson; Karp's 2009 retrospective supplies the origin-story and still-open-problems material."

  - id: tarjan1972tr
    title: "R. E. Tarjan — On the Efficiency of a Good But Not Linear Set Union Algorithm, Cornell TR 72-148, 1972 (preprint of J.ACM 22(2), 1975)"
    url: https://ecommons.cornell.edu/bitstream/1813/5942/1/72-148.pdf
    access: full
    access_notes: >
      Scanned TR OCR'd page by page; prose reliable, formula-heavy proofs noisy —
      verify against page images. The published 1975 J.ACM version is paywalled
      (dl.acm.org 403) and was NOT accessed; this TR is its standard preprint.
      HUMAN ACTION (optional): obtain the J.ACM 1975 final version for exact
      theorem statements.
    role: "Primary artifact for the union-find lesson: names the Weighting and Collapsing Rules, hand-drawn Figures 1-2 (captured), and the 'first simple algorithm with such a complicated running time' quote."

  - id: williamson-shmoys
    title: "D. P. Williamson, D. B. Shmoys — The Design of Approximation Algorithms, Cambridge UP, 2011 (authors' free web edition)"
    url: https://www.designofapproxalgs.com/book.pdf
    access: full
    access_notes: "Entire book read in three shards (authorized free electronic edition)."
    role: "Grounds course-2 proposal module E; course 1 uses only its cleanest set pieces (vertex-cover 2-approximation, Christofides, definitions of PTAS/FPTAS) in the coping-with-NP-hardness lesson."

  - id: visualgo
    title: "S. Halim et al. — VisuAlgo (visualgo.net) + Halim 2015 Olympiads-in-Informatics paper"
    url: https://visualgo.net/en
    access: full
    access_notes: "All 26 module pages read live; the 2015 paper and a 2015 NUS FYP dissertation (interface screenshots) cached in research/texts/."
    role: "Demo-design reference: custom-input-first interaction pattern, adversarial example graphs ('Dijkstra killer', 'Bellman-Ford killer'), color conventions for traversal states."

  # ── Cited in course.yaml bibliography but NOT read by the swarm ─────────
  - id: dpv
    title: "S. Dasgupta, C. H. Papadimitriou, U. V. Vazirani — Algorithms, McGraw-Hill, 2008"
    url: https://cseweb.ucsd.edu/~dasgupta/book/index.html
    access: cited-only
    access_notes: "Free author draft exists at the URL; not read this round. Candidate for a future swarm pass if a second concise voice is wanted."
    role: "Bibliography entry; alternative concise treatment of paradigms and graphs."
  - id: kleinberg-tardos
    title: "J. Kleinberg, E. Tardos — Algorithm Design, Pearson, 2005"
    access: cited-only
    access_notes: "No legitimate free edition. HUMAN ACTION: purchase if its interval-scheduling / exchange-argument chapters should ground a re-run."
    role: "Bibliography entry; the standard reference for greedy exchange arguments and reductions-flavored design."
  - id: hoare1961
    title: "C. A. R. Hoare — Algorithm 64: Quicksort, CACM 4(7), 1961"
    access: cited-only
    access_notes: "Paywalled (ACM DL); one-page algorithm statement, cited for provenance in the sorting lesson's references."
    role: "Provenance citation for quicksort."
  - id: tarjan1972scc
    title: "R. E. Tarjan — Depth-First Search and Linear Graph Algorithms, SIAM J. Computing 1(2), 1972"
    access: cited-only
    access_notes: "Paywalled; cited for provenance in the DFS/SCC lessons."
    role: "Provenance citation for DFS edge classification and linear-time SCC."
  - id: guibas-sedgewick1978
    title: "L. J. Guibas, R. Sedgewick — A Dichromatic Framework for Balanced Trees, FOCS 1978"
    access: cited-only
    access_notes: "Not read in full; first page captured as an image (algorithmspa-s1-guibas-sedgewick-1979-fig-000) from the Princeton slides."
    role: "Primary artifact (title page) for the balanced-trees lesson; provenance of red-black trees."
  - id: kruskal1956
    title: "J. B. Kruskal — On the Shortest Spanning Subtree of a Graph…, Proc. AMS 7(1), 1956"
    access: cited-only
    access_notes: "Open at ams.org; not read this round."
    role: "Provenance citation for Kruskal's algorithm."
  - id: prim1957
    title: "R. C. Prim — Shortest Connection Networks and Some Generalizations, BSTJ 36(6), 1957"
    access: cited-only
    access_notes: "Not read; note Dijkstra 1959 (read) independently contains the same algorithm as its Problem 1."
    role: "Provenance citation for Prim's algorithm."
  - id: levin1973
    title: "L. A. Levin — Universal Sequential Search Problems, Probl. Inf. Transm. 9(3), 1973"
    access: cited-only
    access_notes: "English translation hard to source freely; cited for the independent Soviet discovery alongside Cook."
    role: "Provenance citation in the NP-completeness lesson."
  - id: garey-johnson
    title: "M. R. Garey, D. S. Johnson — Computers and Intractability, W. H. Freeman, 1979"
    access: cited-only
    access_notes: "No free edition. HUMAN ACTION: purchase if course 2's reduction-catalog module goes ahead."
    role: "The canonical NP-completeness reference catalog; further-reading pointer in the limits module."

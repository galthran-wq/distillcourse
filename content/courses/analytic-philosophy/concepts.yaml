concepts:
  # --- Module 1: Frege ---
  - id: function-argument-analysis
    name: Function–argument analysis
    definition: "Frege's replacement of subject–predicate form: a sentence is a function ('… loves …') applied to arguments, so the same content can be analysed in several ways and nested generality becomes expressible"
    introduced_in: frege-function-and-quantifier
  - id: concept-and-object
    name: Concept and object
    definition: "A concept is a function from objects to the two truth-values (an 'unsaturated' expression); an object is what a saturated name stands for; a concept can fall within a higher-level concept but never under one as an object does"
    introduced_in: frege-function-and-quantifier
  - id: quantifier-as-second-level-concept
    name: Quantifier as second-level concept
    definition: "$\\forall x\\,Fx$ says of the first-level concept $F$ that every object falls under it; generality is a concept of concepts, and $\\exists$ is defined as $\\neg\\forall\\neg$"
    introduced_in: frege-function-and-quantifier
  - id: existence-second-level
    name: Existence as a second-level concept
    definition: "'$F$s exist' asserts that the concept $F$ is instantiated ($\\exists x\\,Fx$); existence is never a property of an object — Kant's 'not a real predicate' made a theorem of the notation"
    introduced_in: frege-function-and-quantifier
  - id: logicism
    name: Logicism
    definition: "The thesis that the truths of arithmetic are truths of logic: number words are definable in purely logical terms and the Peano axioms follow from those definitions, so arithmetic is analytic and needs no intuition"
    introduced_in: frege-logicism
  - id: humes-principle
    name: Hume's principle
    definition: "The number of $F$s equals the number of $G$s iff there is a one–one correspondence between the $F$s and the $G$s: $\\#F = \\#G \\leftrightarrow F \\approx G$"
    introduced_in: frege-logicism
  - id: ancestral
    name: Ancestral of a relation
    definition: "The transitive closure of a relation defined in second-order logic: $R^*(a,b)$ iff $b$ has every $R$-hereditary property that every $R$-successor of $a$ has; used to define 'natural number' as 0 or an ancestral-successor of 0"
    introduced_in: frege-logicism
  - id: basic-law-v
    name: Basic Law V
    definition: "Frege's axiom that two concepts have the same extension iff the same objects fall under them; inconsistent, as Russell's 1902 letter showed with the concept 'extension that is not a member of itself'"
    introduced_in: frege-logicism
  - id: sense
    name: Sense (Sinn)
    definition: "The mode of presentation of a reference — what a competent speaker grasps and what differs between 'Hesperus' and 'Phosphorus' though the reference is the same; the sense of a sentence is a thought"
    introduced_in: frege-sense-and-reference
  - id: reference
    name: Reference (Bedeutung)
    definition: "What an expression stands for: an object for a name, a concept for a predicate, a truth-value for a sentence; a sentence's reference is a function of its parts' references"
    introduced_in: frege-sense-and-reference
  - id: mode-of-presentation
    name: Mode of presentation
    definition: "The way an object is given by an expression — $4$ and $8/2$ present one number two ways; the component of meaning that carries cognitive value"
    introduced_in: frege-sense-and-reference
  - id: indirect-reference
    name: Indirect reference
    definition: "Inside 'believes that …' and similar contexts an expression refers to its ordinary sense, so substitution of co-referring names fails there without any exception to the substitution law"
    introduced_in: frege-sense-and-reference
  - id: compositionality
    name: Compositionality
    definition: "The sense and the reference of a complex expression are determined by the senses and references of its parts and their mode of combination"
    introduced_in: frege-sense-and-reference
  - id: ontological-argument
    name: Ontological argument
    definition: "The argument that a being than which none greater can be conceived must exist, since existence is a perfection; diagnosed by the second-level account of existence as treating a concept of concepts as a property of a thing"
    introduced_in: ontological-argument-under-the-new-logic

  # --- Module 2: Russell and the Tractatus ---
  - id: definite-description
    name: Definite description
    definition: "A phrase of the form 'the $F$', analysed not as a name but as a quantifier phrase: 'the $F$ is $G$' is $\\exists x\\,(Fx \\wedge \\forall y(Fy \\to y=x) \\wedge Gx)$"
    introduced_in: russell-theory-of-descriptions
  - id: incomplete-symbol
    name: Incomplete symbol
    definition: "An expression that has no meaning in isolation and is defined only through the sentences it occurs in — a definite description, and on Russell's later view a class term"
    introduced_in: russell-theory-of-descriptions
  - id: scope
    name: Scope (primary and secondary occurrence)
    definition: "The ambiguity of a description under negation or an attitude verb: 'the King of France is not bald' is $\\exists x(\\ldots \\wedge \\neg Bx)$ (false) or $\\neg\\exists x(\\ldots \\wedge Bx)$ (true)"
    introduced_in: russell-theory-of-descriptions
  - id: logical-form-vs-grammatical-form
    name: Logical form versus grammatical form
    definition: "The thesis that a sentence's surface grammar can misrepresent its logical structure ('the King of France' looks like a subject and is not), and that analysis is the method of uncovering the latter"
    introduced_in: russell-theory-of-descriptions
  - id: acquaintance-and-description
    name: Knowledge by acquaintance and by description
    definition: "Russell's distinction between what is given directly (sense-data, universals, perhaps the self) and what is known only as 'the so-and-so'; every understood proposition is composed of constituents one is acquainted with"
    introduced_in: logical-constructions-and-acquaintance
  - id: logical-construction
    name: Logical construction
    definition: "An entity $e$ is a logical construction out of $b, c, d$ when every sentence mentioning $e$ can be rewritten as sentences about $b, c, d$ alone — the average woman, the table, the class, the self"
    introduced_in: logical-constructions-and-acquaintance
  - id: logical-atomism
    name: Logical atomism
    definition: "The view that the world consists of atomic facts and that every true proposition is a truth-function of atomic propositions, each of which pictures one such fact — Russell's 1918 and the Tractatus's shared frame"
    introduced_in: logical-constructions-and-acquaintance
  - id: theory-of-types
    name: Theory of types
    definition: "Russell's hierarchy of individuals, classes, classes of classes, on which a propositional function cannot take itself as argument; the principled response to the paradox that destroyed Basic Law V"
    introduced_in: logical-constructions-and-acquaintance
  - id: picture-theory
    name: Picture theory of the proposition
    definition: "A proposition is a fact whose elements stand for objects and whose structure shares a logical form with the state of affairs it depicts; it has sense if it pictures a possible fact, and is true if that fact obtains"
    introduced_in: tractatus-picture-theory
  - id: logical-form
    name: Logical form
    definition: "What a picture and the reality it depicts have in common and must have in common for the one to depict the other; it cannot itself be depicted, only displayed"
    introduced_in: tractatus-picture-theory
  - id: state-of-affairs
    name: State of affairs (Sachverhalt)
    definition: "A combination of simple objects that may or may not obtain; the world is the totality of obtaining states of affairs, and they are logically independent of one another"
    introduced_in: tractatus-picture-theory
  - id: saying-vs-showing
    name: Saying versus showing
    definition: "What a proposition says is the state of affairs it pictures; what it shows — its logical form, the formal properties of language and world — cannot be said by any proposition"
    introduced_in: tractatus-picture-theory
  - id: simple-object
    name: Simple object
    definition: "The Tractatus's indecomposable constituents of states of affairs, required (2.0211) so that whether a sentence has sense does not depend on whether another sentence is true; no example is ever given"
    introduced_in: tractatus-picture-theory
  - id: truth-function
    name: Truth-function
    definition: "A proposition whose truth-value is determined by the truth-values of its constituent propositions, expressed by agreement and disagreement with their $2^n$ truth-possibilities"
    introduced_in: tractatus-logic-as-tautology
  - id: tautology
    name: Tautology
    definition: "A proposition true under every truth-possibility of its elementary propositions; it says nothing, is senseless (sinnlos) but not nonsense (unsinnig), and every proposition of logic is one"
    introduced_in: tractatus-logic-as-tautology
  - id: joint-denial
    name: Joint denial $N(\\bar\\xi)$
    definition: "The single operation 'all of these are false' applied to any set of propositions; iterated, it generates every truth-function, and applied to all values of $fx$ it yields the quantifiers"
    introduced_in: tractatus-logic-as-tautology
  - id: truth-grounds-entailment
    name: Entailment as inclusion of truth-grounds
    definition: "$p$ follows from $q$ iff every truth-possibility that makes $q$ true makes $p$ true; inference needs no laws of inference, the relation is visible in the propositions' structure"
    introduced_in: tractatus-logic-as-tautology
  - id: logical-constants-do-not-represent
    name: Logical constants do not represent
    definition: "The Tractatus's 'fundamental thought' (4.0312): $\\neg$, $\\vee$, $\\forall$ stand for nothing in reality; '$p$' and '$\\neg p$' describe the same reality with opposite sense"
    introduced_in: tractatus-logic-as-tautology
  - id: formal-concept
    name: Formal concept
    definition: "A concept such as 'object', 'number', 'fact' that is expressed by a variable, not by a predicate; 'there are objects' is nonsense in the way '$2+2$ at three o'clock $=4$' is"
    introduced_in: tractatus-saying-showing-and-the-ladder
  - id: the-ladder
    name: The ladder (6.54)
    definition: "The Tractatus's verdict on itself: its sentences are nonsense that one climbs over and discards once one has seen the world rightly; read as ineffable insight or as resolute self-cancellation"
    introduced_in: tractatus-saying-showing-and-the-ladder
  - id: philosophy-as-activity
    name: Philosophy as activity
    definition: "Philosophy is not a body of doctrine but the logical clarification of thoughts (4.112): it makes propositions clear and says nothing itself"
    introduced_in: tractatus-saying-showing-and-the-ladder
  - id: resolute-reading
    name: Resolute reading
    definition: "The interpretation on which the Tractatus's nonsense is plain nonsense with nothing shown through it, the book being a therapy for the illusion that it says something; opposed to the ineffabilist reading"
    introduced_in: tractatus-saying-showing-and-the-ladder
  - id: iota-operator
    name: Description operator ($\\iota$)
    definition: "A term-forming operator 'the $x$ such that $\\varphi$' given either Russell's contextual elimination or a semantics that assigns a default when $\\varphi$ fails to be uniquely satisfied — the choice a proof assistant must make"
    introduced_in: descriptions-in-a-proof-checker

  # --- Module 3: Vienna Circle ---
  - id: verification-principle
    name: Verification principle
    definition: "A non-tautological sentence is cognitively meaningful iff some possible experience is relevant to its truth; strong form: conclusively verifiable; weak form: confirmable"
    introduced_in: verification-principle
  - id: cognitive-significance
    name: Cognitive significance
    definition: "The property of expressing a proposition that is true or false, as opposed to emotive, expressive or metaphysical surplus; what the verification criterion was meant to delimit"
    introduced_in: verification-principle
  - id: metaphysics-as-pseudo-statement
    name: Metaphysics as pseudo-statement
    definition: "The Circle's verdict that a sentence neither analytic nor empirically testable ('the Absolute is incapable of progress') is not false but without cognitive meaning, often a product of grammar"
    introduced_in: verification-principle
  - id: protocol-sentence
    name: Protocol sentence
    definition: "The basic observation report (about sense-contents for Schlick, about physical objects for Neurath) to which the criterion was to reduce or relate every meaningful statement; the Circle disagreed about its form"
    introduced_in: verification-principle
  - id: analytic-synthetic
    name: Analytic/synthetic distinction
    definition: "Kant's division of truths into those true by the meaning of their terms and those true by how the world is; the empiricists' version: analytic iff valid solely by the definitions of its symbols"
    introduced_in: a-priori-as-analytic
  - id: synthetic-a-priori
    name: Synthetic a priori
    definition: "Kant's class of truths that are informative yet knowable without experience — arithmetic and Euclidean geometry — which the empiricists declared empty"
    introduced_in: a-priori-as-analytic
  - id: truth-by-convention
    name: Truth by convention
    definition: "The account of necessity on which a necessary truth records a decision about the use of symbols; its denial is not false but a change of language"
    introduced_in: a-priori-as-analytic
  - id: principle-of-tolerance
    name: Principle of tolerance
    definition: "Carnap's rule (Logical Syntax §17): choose any logic or language, state its rules, judge it by consistency and usefulness — 'in logic there are no morals'"
    introduced_in: carnap-tolerance-and-frameworks
  - id: explication
    name: Explication
    definition: "Replacing a vague concept of ordinary use by an exact one that meets stated criteria of adequacy (warmth → temperature), the Carnapian form of analysis"
    introduced_in: carnap-tolerance-and-frameworks
  - id: internal-external-questions
    name: Internal and external questions
    definition: "A question asked inside a linguistic framework ('is there a prime between 10 and 20?') has a theoretical answer; the same words asked of the framework ('do numbers exist?') pose a practical question of adoption"
    introduced_in: carnap-tolerance-and-frameworks
  - id: linguistic-framework
    name: Linguistic framework
    definition: "A language with its forms of expression and rules of use — numbers, physical things, propositions — within which existence questions are settled and relative to which analytic truths hold"
    introduced_in: carnap-tolerance-and-frameworks
  - id: emotivism
    name: Emotivism
    definition: "The theory that ethical sentences express and evoke feeling and issue commands rather than state facts; 'stealing is wrong' = 'stealing!!'; neither true nor false"
    introduced_in: emotivism
  - id: open-question-argument
    name: Open question argument
    definition: "Moore's test: for any proposed definition of 'good' as a natural property $N$, 'this is $N$, but is it good?' remains an open question, so the definition is not an analysis"
    introduced_in: emotivism
  - id: non-cognitivism
    name: Non-cognitivism
    definition: "The family of views on which ethical (or religious) sentences do not express beliefs that are true or false; emotivism is its first analytic form, expressivism its later one"
    introduced_in: emotivism
  - id: frege-geach-problem
    name: Frege–Geach (embedding) problem
    definition: "'If stealing is wrong, getting your brother to steal is wrong' is a valid argument's premise, but on emotivism its antecedent expresses no feeling — so the sentence must have a content that force cannot supply"
    introduced_in: emotivism
  - id: operational-definition
    name: Operational definition
    definition: "A definition of a concept by the procedure that measures or verifies it (simultaneity by light signals); the physicist's form of the verification criterion"
    introduced_in: simultaneity-and-operational-definition
  - id: coordinative-definition
    name: Coordinative definition
    definition: "Reichenbach's and Schlick's name for the stipulation that links a theoretical term to a physical procedure (a unit of length to a rod, synchrony to a signalling rule); conventional, hence a 'relative a priori'"
    introduced_in: simultaneity-and-operational-definition
  - id: conventionality-of-simultaneity
    name: Conventionality of simultaneity
    definition: "The thesis that the choice of which distant events count as simultaneous is a free convention within special relativity; disputed, since the standard synchrony is the only one definable from the light-cone structure"
    introduced_in: simultaneity-and-operational-definition

  # --- Module 4: Quine ---
  - id: analyticity
    name: Analyticity (as Quine's target)
    definition: "Truth by virtue of meaning alone; Quine's claim is that every proposed definition of it — via synonymy, definition, interchangeability, semantical rules — presupposes it"
    introduced_in: two-dogmas-analyticity
  - id: synonymy
    name: Cognitive synonymy
    definition: "Sameness of meaning strong enough to turn 'no bachelor is married' into a logical truth by substitution; distinct from coextension, and the notion the circle of analyticity turns on"
    introduced_in: two-dogmas-analyticity
  - id: salva-veritate
    name: Interchangeability salva veritate
    definition: "Two terms are interchangeable if substituting one for the other in any sentence preserves truth; yields synonymy only in a language with 'necessarily', which presupposes analyticity"
    introduced_in: two-dogmas-analyticity
  - id: semantical-rule
    name: Semantical rule
    definition: "A rule of an artificial language that lists its analytic sentences; explains 'analytic-for-$L_0$' but not 'analytic for $L$' with $L$ variable — a list under a heading"
    introduced_in: two-dogmas-analyticity
  - id: confirmation-holism
    name: Confirmation holism
    definition: "Statements face the tribunal of experience not individually but as a corporate body; no single statement has its own set of confirming experiences (Duhem's thesis generalised)"
    introduced_in: holism-and-naturalism
  - id: web-of-belief
    name: Web of belief
    definition: "Quine's image of total science as a fabric impinging on experience only at its edges, with observation statements at the periphery and logic at the centre, any node revisable"
    introduced_in: holism-and-naturalism
  - id: naturalism
    name: Naturalism (Quine)
    definition: "Philosophy is continuous with science, at its abstract end; there is no first philosophy, and epistemology becomes a chapter of psychology"
    introduced_in: holism-and-naturalism
  - id: ontological-commitment
    name: Ontological commitment
    definition: "'To be is to be the value of a bound variable': a theory is committed to whatever its regimented quantifiers must range over for it to be true"
    introduced_in: holism-and-naturalism
  - id: posit
    name: Posit
    definition: "An entity introduced into a theory to simplify its account of experience — physical objects, classes, Homer's gods — differing in degree of usefulness, not in kind"
    introduced_in: holism-and-naturalism
  - id: auxiliary-hypothesis
    name: Auxiliary hypothesis
    definition: "A statement (initial conditions, instrument theory, 'no other bodies') that joins a law in deriving a prediction and can absorb a failed prediction in the law's place"
    introduced_in: neptune-vulcan-web-of-belief
  - id: minimum-mutilation
    name: Maxim of minimum mutilation
    definition: "Quine's rule of thumb for revision: disturb the total system as little as possible; conservatism and simplicity, added to holism rather than derived from it"
    introduced_in: neptune-vulcan-web-of-belief

  # --- Module 5: Later Wittgenstein ---
  - id: meaning-as-use
    name: Meaning as use
    definition: "'For a large class of cases … the meaning of a word is its use in the language' (PI §43): what a word means is what is done with it, not an object it names"
    introduced_in: meaning-as-use
  - id: language-game
    name: Language-game
    definition: "A whole consisting of language and the actions into which it is woven (PI §7) — the builders, giving orders, reporting; deliberately not defined, and plural"
    introduced_in: meaning-as-use
  - id: form-of-life
    name: Form of life
    definition: "The shared human practices and natural reactions against which a language-game is played; what must be accepted as given, and where agreement in judgements lies"
    introduced_in: meaning-as-use
  - id: augustinian-picture
    name: Augustinian picture of language
    definition: "Words name objects and sentences are combinations of names (PI §1); the picture the Tractatus shared and the Investigations dismantle"
    introduced_in: meaning-as-use
  - id: family-resemblance
    name: Family resemblance
    definition: "A concept held together by a network of overlapping similarities with no feature common to all instances (PI §§66–67) — games, numbers, language"
    introduced_in: family-resemblance-and-grammar
  - id: grammatical-investigation
    name: Grammatical investigation
    definition: "Philosophy as description of the rules for the use of words — 'essence is expressed by grammar' (§371) — in place of theory or explanation"
    introduced_in: family-resemblance-and-grammar
  - id: philosophy-as-therapy
    name: Philosophy as therapy
    definition: "Problems arise when language goes on holiday; the work is to show the fly the way out of the fly-bottle (§309) by assembling reminders, not by proving theses"
    introduced_in: family-resemblance-and-grammar
  - id: perspicuous-representation
    name: Perspicuous representation (Übersicht)
    definition: "A survey of the uses of a word that lets one see connections (§122); the form a grammatical investigation's result takes"
    introduced_in: family-resemblance-and-grammar
  - id: rule-following-paradox
    name: Rule-following paradox
    definition: "'No course of action could be determined by a rule, because every course of action can be made out to accord with the rule' (§201), with its answer: a way of grasping a rule that is not an interpretation"
    introduced_in: rule-following
  - id: interpretation-regress
    name: Regress of interpretations
    definition: "Any interpretation of a rule is itself a sign that needs interpreting, so interpretations 'hang in the air along with what they interpret' (§198)"
    introduced_in: rule-following
  - id: practice-and-custom
    name: Rule-following as practice
    definition: "Obeying a rule is a custom, a technique mastered in training; 'my spade is turned' (§217) and 'I obey the rule blindly' (§219) — the bedrock beneath justification"
    introduced_in: rule-following
  - id: kripkenstein
    name: Kripke's sceptical reading ('quus')
    definition: "The reading on which §201 poses a sceptical paradox — no fact about me fixes that I meant plus, not quus — answered by a sceptical solution in terms of community agreement"
    introduced_in: rule-following
  - id: private-language
    name: Private language
    definition: "A language whose words refer to what only the speaker can know — their immediate private sensations (§243); argued to be impossible"
    introduced_in: private-language-argument
  - id: criterion-of-correctness
    name: Criterion of correctness
    definition: "What a private ostensive definition lacks: a standard by which a later use of 'S' could be right or wrong, as opposed to seeming right (§258)"
    introduced_in: private-language-argument
  - id: beetle-in-the-box
    name: Beetle in the box
    definition: "If everyone's word 'beetle' meant the thing in their own box, the thing would drop out as irrelevant (§293): the object-and-name model fails for sensation words"
    introduced_in: private-language-argument
  - id: outward-criteria
    name: Outward criteria
    definition: "'An inner process stands in need of outward criteria' (§580): the use of a sensation word is tied to behaviour and circumstances, which is not the claim that the sensation is the behaviour"
    introduced_in: private-language-argument
  - id: imitation-game
    name: Imitation game
    definition: "Turing's 1950 replacement for 'can machines think?': an interrogator exchanging typed messages tries to tell a machine from a human"
    introduced_in: turing-test-as-grammar
  - id: criteria-vs-symptoms
    name: Criteria versus symptoms
    definition: "A criterion fixes the meaning of a term in a practice and is defeasible; a symptom is evidence correlated with it; the verificationist collapses the two (PI §354)"
    introduced_in: turing-test-as-grammar

  # --- Module 6: Ordinary-language philosophy ---
  - id: category-mistake
    name: Category mistake
    definition: "Representing a fact of one logical type as if it belonged to another — the University as one more building; the mind as one more substance"
    introduced_in: ryle-category-mistake
  - id: dispositional-analysis
    name: Dispositional analysis
    definition: "Mental predicates ('vain', 'believes') analysed as conditionals about what a person would do, as 'brittle' is about breaking; no inner episode is named"
    introduced_in: ryle-category-mistake
  - id: knowing-how-knowing-that
    name: Knowing how and knowing that
    definition: "Ryle's distinction between a capacity exercised in intelligent performance and propositional knowledge, with the regress argument that the first cannot reduce to the second"
    introduced_in: ryle-category-mistake
  - id: ghost-in-the-machine
    name: Ghost in the machine
    definition: "Ryle's name for the official Cartesian doctrine: an invisible mind inside and in charge of the body, posited as a para-mechanical cause"
    introduced_in: ryle-category-mistake
  - id: performative-utterance
    name: Performative utterance
    definition: "An utterance that performs an act rather than reporting one ('I name this ship…', 'I bet…'), assessed as happy or unhappy rather than as true or false"
    introduced_in: austin-speech-acts
  - id: felicity-conditions
    name: Felicity conditions
    definition: "The conditions a performative must meet to succeed: misfires (wrong person, wrong procedure) leave the act undone, abuses (insincerity) leave it done but hollow"
    introduced_in: austin-speech-acts
  - id: illocutionary-force
    name: Illocutionary force
    definition: "What is done in saying something — warning, promising, stating — as distinct from the locutionary content said and the perlocutionary effect achieved"
    introduced_in: austin-speech-acts
  - id: descriptive-fallacy
    name: Descriptive fallacy
    definition: "Austin's name for the assumption that every indicative sentence is a description that is true or false; the 'true/false fetish'"
    introduced_in: austin-speech-acts
  - id: presupposition
    name: Presupposition
    definition: "What a use of 'the $F$ is $G$' takes for granted rather than asserts — that there is one $F$; if it fails, the question of truth does not arise"
    introduced_in: strawson-on-referring
  - id: truth-value-gap
    name: Truth-value gap
    definition: "A use of a sentence that is neither true nor false because a presupposition fails; Strawson's replacement for Russell's 'false'"
    introduced_in: strawson-on-referring
  - id: sentence-vs-use
    name: Sentence, use and utterance
    definition: "Strawson's distinction: the sentence type is neither true nor false; a particular use of it on an occasion is; Russell analysed the sentence"
    introduced_in: strawson-on-referring
  - id: referential-attributive
    name: Referential and attributive uses
    definition: "Donnellan's distinction: 'the man drinking a martini' used to pick out a particular person (referential) versus whoever fits (attributive); the former succeeds even if the description is false of him"
    introduced_in: strawson-on-referring
  - id: conversational-implicature
    name: Conversational implicature
    definition: "What a speaker means beyond what the sentence says, derived by the hearer from the assumption that the speaker is being cooperative; cancellable and non-detachable"
    introduced_in: grice-conversational-implicature
  - id: cooperative-principle
    name: Cooperative principle and maxims
    definition: "Make your contribution as required by the accepted purpose of the exchange; spelled out as Quantity, Quality, Relation and Manner"
    introduced_in: grice-conversational-implicature
  - id: cancellability
    name: Cancellability
    definition: "The test that separates an implicature from an entailment: 'some left — in fact all did' is consistent, 'some left — in fact none did' is not"
    introduced_in: grice-conversational-implicature
  - id: common-sense-defence
    name: Defence of common sense
    definition: "Moore's claim that certain propositions ('here is a hand', 'the earth existed long before my birth') are known with more certainty than any philosophical premise that denies them"
    introduced_in: moore-common-sense
  - id: naturalistic-fallacy
    name: Naturalistic fallacy
    definition: "Moore's name for defining 'good' as any natural property; exposed by the open question argument, and overreaching if 'water is H2O' is a correct definition"
    introduced_in: moore-common-sense
  - id: paradox-of-analysis
    name: Paradox of analysis
    definition: "If 'A is C' is a correct analysis, A and C mean the same and the analysis is trivial; if they differ, it is incorrect — resolved by distinguishing sense from reference"
    introduced_in: moore-common-sense

  # --- Module 7: Kripke and Putnam ---
  - id: rigid-designator
    name: Rigid designator
    definition: "A term that designates the same object in every possible world in which that object exists; proper names are rigid, most descriptions are not"
    introduced_in: kripke-rigid-designation
  - id: necessary-vs-a-priori
    name: Necessary versus a priori
    definition: "Necessity is a metaphysical notion (could it have been otherwise?), a prioricity an epistemic one (can it be known without experience?); neither entails the other"
    introduced_in: kripke-rigid-designation
  - id: possible-worlds-stipulated
    name: Possible worlds as stipulations
    definition: "A possible world is a total way things might have been, specified by us ('suppose Nixon had lost'), not a distant planet observed through a telescope; transworld identity is given, not discovered"
    introduced_in: kripke-rigid-designation
  - id: necessity-of-identity
    name: Necessity of identity
    definition: "$\\forall x\\forall y\\,(x = y \\to \\Box\\,x = y)$, from $\\forall x\\,\\Box(x=x)$ and Leibniz's law; a true identity between rigid designators is necessary"
    introduced_in: kripke-rigid-designation
  - id: contingent-a-priori
    name: Contingent a priori
    definition: "'The standard metre bar is one metre long at $t_0$' is known a priori by whoever fixes the reference of 'one metre' by it, and is contingent, since the bar might have been longer"
    introduced_in: kripke-rigid-designation
  - id: descriptivism
    name: Description theory of names
    definition: "The view that a proper name is synonymous with, or has its reference fixed by, a description or cluster of descriptions the speaker associates with it (Frege, Russell, Searle)"
    introduced_in: kripke-against-descriptivism
  - id: cluster-theory
    name: Cluster theory
    definition: "The refined descriptivism on which a name refers to whatever satisfies most, or a weighted most, of the associated descriptions (Wittgenstein's 'Moses', Searle)"
    introduced_in: kripke-against-descriptivism
  - id: causal-historical-chain
    name: Causal-historical chain
    definition: "Kripke's picture: a name is given in a baptism and passed from speaker to speaker, each intending to use it as the previous one did; reference runs along the actual chain"
    introduced_in: kripke-against-descriptivism
  - id: reference-fixing-vs-meaning-giving
    name: Reference-fixing versus meaning-giving
    definition: "A description may be used to fix what a term refers to without being its meaning; the term then designates rigidly what the description happened to pick out"
    introduced_in: kripke-against-descriptivism
  - id: necessary-a-posteriori
    name: Necessary a posteriori
    definition: "A truth that could not have been otherwise but is known only by discovery — 'Hesperus is Phosphorus', 'water is H2O', 'gold has atomic number 79'"
    introduced_in: necessary-a-posteriori
  - id: natural-kind-term
    name: Natural-kind term
    definition: "A general term ('gold', 'water', 'tiger') that designates a kind rigidly, its reference fixed by samples and its essence discovered by science rather than given by a cluster of marks"
    introduced_in: necessary-a-posteriori
  - id: essentialism-of-origin
    name: Essentialism of origin
    definition: "An object could not have originated from different matter or different parents than it did; this table could not have been made of ice"
    introduced_in: necessary-a-posteriori
  - id: illusion-of-contingency
    name: Illusion of contingency
    definition: "The feeling that a necessary a posteriori truth might have been false is explained by a qualitatively identical epistemic situation in which a different truth held"
    introduced_in: necessary-a-posteriori
  - id: semantic-externalism
    name: Semantic externalism
    definition: "The thesis that what a term means and refers to depends on the speaker's environment and community, not on the speaker's psychological state alone"
    introduced_in: putnam-twin-earth
  - id: twin-earth
    name: Twin Earth
    definition: "Putnam's thought experiment: a planet identical to Earth except that 'water' is true of XYZ, so duplicates in the same psychological state mean different things"
    introduced_in: putnam-twin-earth
  - id: division-of-linguistic-labour
    name: Division of linguistic labour
    definition: "A term's criteria of application are held by experts and relied on by the community; the extension is fixed by the collective, not the individual"
    introduced_in: putnam-twin-earth
  - id: stereotype
    name: Stereotype
    definition: "The conventional, possibly inaccurate idea of a kind that a competent speaker must acquire (tigers are striped); not analytic, not a necessary condition"
    introduced_in: putnam-twin-earth
  - id: meaning-vector
    name: Meaning vector
    definition: "Putnam's normal form for meaning: syntactic markers, semantic markers, stereotype, extension — with extension as a component, so meaning determines it by construction"
    introduced_in: putnam-twin-earth
  - id: species-problem
    name: Species problem
    definition: "Biology's lack of a single species concept — biological, phylogenetic, morphological — and the non-transitivity ring species exhibit; species as lineages rather than kinds with an essence"
    introduced_in: natural-kinds-against-chemistry
  - id: hidden-structure
    name: Hidden structure
    definition: "The microstructural property that, where the local samples share one, fixes membership in a kind across possible worlds; where they share none, superficial characteristics decide"
    introduced_in: natural-kinds-against-chemistry

  # --- Module 8: After 1970 ---
  - id: modal-realism
    name: Modal realism
    definition: "Lewis's thesis that possible worlds are concrete, spatiotemporally isolated universes as real as ours, and that modal truths are truths about them"
    introduced_in: lewis-possible-worlds
  - id: counterpart-theory
    name: Counterpart theory
    definition: "Nothing exists in more than one world; 'Humphrey might have won' is true because a counterpart of Humphrey — similar to him — wins in another world"
    introduced_in: lewis-possible-worlds
  - id: ersatz-worlds
    name: Ersatz worlds
    definition: "Abstract stand-ins for possible worlds — maximal consistent sets of sentences, states, properties — that avoid modal realism at the cost of primitive modality"
    introduced_in: lewis-possible-worlds
  - id: identity-theory
    name: Mind–brain identity theory
    definition: "Mental states are identical with brain states, as heat is molecular motion: a contingent identity to be discovered by science"
    introduced_in: functionalism-and-its-objections
  - id: functionalism
    name: Functionalism
    definition: "A mental state is defined by its causal role between inputs, outputs and other states, and can be realised in different physical systems — software to the brain's hardware"
    introduced_in: functionalism-and-its-objections
  - id: multiple-realizability
    name: Multiple realisability
    definition: "The same mental state can be realised by different physical states (neurons, silicon), which defeats identifying mental state types with brain state types"
    introduced_in: functionalism-and-its-objections
  - id: kripke-modal-argument
    name: Kripke's modal argument against identity
    definition: "'Pain' and 'C-fibre firing' are rigid, so if identical, necessarily so; the appearance of contingency cannot be explained away as for heat, since pain has no appearance distinct from itself"
    introduced_in: functionalism-and-its-objections
  - id: original-position
    name: Original position
    definition: "Rawls's hypothetical choice situation in which free and equal parties select principles of justice for their society"
    introduced_in: rawls-original-position
  - id: veil-of-ignorance
    name: Veil of ignorance
    definition: "The constraint that parties in the original position do not know their class, talents, sex or conception of the good, so that the choice is fair"
    introduced_in: rawls-original-position
  - id: difference-principle
    name: Difference principle
    definition: "Social and economic inequalities are just only if they work to the greatest benefit of the least advantaged"
    introduced_in: rawls-original-position
  - id: reflective-equilibrium
    name: Reflective equilibrium
    definition: "The state reached by adjusting principles and considered judgements against each other until they cohere; Rawls's method of justification"
    introduced_in: rawls-original-position
  - id: maximin
    name: Maximin
    definition: "The decision rule that chooses the option whose worst outcome is best; Rawls's rule for the parties, against expected-utility maximisation"
    introduced_in: rawls-original-position
  - id: psychological-continuity
    name: Psychological continuity
    definition: "Overlapping chains of direct psychological connections — memories, intentions, character — whatever their cause"
    introduced_in: parfit-personal-identity
  - id: fission
    name: Fission
    definition: "The case in which one person's psychology is continued by two resulting persons; since identity is one–one, neither is the original, yet nothing that matters is lost"
    introduced_in: parfit-personal-identity
  - id: reductionism-about-persons
    name: Reductionism about persons
    definition: "A person's existence consists in the existence of a brain and body and a series of interrelated events; there is no further fact of identity"
    introduced_in: parfit-personal-identity
  - id: relation-r
    name: Relation R
    definition: "Psychological connectedness and/or continuity with the right (or any) cause — what matters in survival, which identity is R plus a uniqueness condition"
    introduced_in: parfit-personal-identity
  - id: justified-true-belief
    name: Justified true belief (JTB)
    definition: "The analysis: $S$ knows that $P$ iff $P$ is true, $S$ believes $P$, and $S$ is justified in believing $P$"
    introduced_in: gettier-problem
  - id: gettier-case
    name: Gettier case
    definition: "A situation in which a belief is justified and true but not knowledge, because its truth is disconnected from its justification — a justified false belief inferred to a truth"
    introduced_in: gettier-problem
  - id: epistemic-closure
    name: Closure of justification under entailment
    definition: "If $S$ is justified in believing $P$ and deduces $Q$ from $P$, then $S$ is justified in believing $Q$ — Gettier's second lemma"
    introduced_in: gettier-problem

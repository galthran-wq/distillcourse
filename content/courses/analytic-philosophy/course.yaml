schema_version: 1
slug: analytic-philosophy
title: Analytic Philosophy
tagline: "From Frege's quantifier to Putnam's Twin Earth: the main ideas of the analytic tradition, each as a claim, an argument, and the objection that reshaped it"
status: planned
audience: >
  A reader with a mathematics background — first-order logic and its
  notation, sets and functions, proof by contradiction — who reads
  philosophy for pleasure and has no philosophy coursework. Comfortable
  with $\forall x\,\exists y$ and with a truth table; wants each idea
  stated as a claim with its argument, in historical order, and wants to
  know what killed it or what survived. Not here for philosophy of
  mathematics, and not to be entertained with paradoxes.
tone: >
  Lively, plain and easy to follow, never stuffy and never padded. Read for
  pleasure: each lesson makes the reader want the next idea, and does it
  with the idea itself — the problem a philosopher faced, the move that
  answered it, the concrete case where it bites — not with hype. Plain
  sentences, everyday examples, "you" where it makes an explanation easier
  to follow; every sentence carries a fact, a step or a connection, the
  rest is cut. Every doctrine is stated as a claim, then its argument, then
  why it mattered, then what refuted or survived it, with the primary text
  quoted where the sentence itself is the evidence. Logic is used freely
  and written in the reader's notation; no paradox is a lesson's
  organising device. Philosophers appear as the people whose ideas these
  are, never as authorities; biography only where it dates a text or
  explains a reaction.
intro: >
  In 1879 a Jena mathematician replaced the subject–predicate sentence
  with the function and its argument, and for the first time a sentence
  with two "every"s in it could be written down and reasoned about. The
  tradition that grew from that notation asked one question in a dozen
  forms for the next century: what does a sentence have to be, and have
  to stand in what relation to the world and to its speakers, for it to
  say something true or false — and what follows, for mathematics, for
  science, for ethics and for the mind, from the answer? This course
  follows that question through the people who moved it: Frege, Russell,
  the early and the late Wittgenstein, the Vienna Circle, Quine, the
  Oxford philosophers of ordinary language, Kripke and Putnam.


  The answers form a chain, and the chain is the course. Frege's logic
  made meaning a theory; Russell showed that a sentence's grammar can
  hide a different logical form, and that analysis uncovers it; the
  Tractatus pushed the analysis to its limit, found that logic says
  nothing and that philosophy cannot say anything either, and threw away
  the ladder. Vienna took the Tractatus's account of logic as a licence to
  declare metaphysics meaningless and mathematics empty, and the licence
  failed on its own terms: Quine showed that the line between what a
  sentence means and what the world contributes cannot be drawn, and the
  later Wittgenstein showed that the whole picture of language as names
  for things was wrong from the first word. Oxford took that as a method
  and ran out of theory; Kripke and Putnam rebuilt theory on a
  distinction the tradition had collapsed — between what is necessary and
  what is known without experience — and found that meaning is not in the
  head at all.


  Each lesson is one idea: what it claims, the argument for it, why it
  mattered, and what refuted or survived it. The logic goes fast, because
  you already have it; the arguments go slowly, because they are the
  point. A short closing module glances at where the tools went after
  1970 — possible worlds, the mind as function, justice as a decision
  problem, persons without identity, and the three pages that reset the
  theory of knowledge — without developing any of it.
prerequisites:
  - text: "First-order logic as a working notation: $\\forall$, $\\exists$, $\\neg$, $\\to$, identity, and the habit of reading nested quantifiers"
  - text: "Sets, functions, bijections and cardinality at the level of a first proof-based course"
  - text: "Proof by contradiction and the difference between a valid argument and a sound one"
  - text: "No philosophy is assumed; Kant's 'analytic/synthetic' and 'a priori/a posteriori' are introduced where they are first needed"
spine:
  - step: "A new logic makes meaning a theory: sentences have function–argument form, quantifiers are concepts of concepts, so existence is never a property of a thing; from the same analysis numbers become properties of concepts and arithmetic a branch of logic, and a name carries a sense as well as a reference — the programme breaks in 1902, the tools survive"
    lessons: [frege-function-and-quantifier, frege-logicism, frege-sense-and-reference, ontological-argument-under-the-new-logic]
    label: "Frege's logic"
    years: "1879–1902"
    caption: "Function and argument; number as a property of a concept; Hesperus and Phosphorus; the ontological argument diagnosed"
  - step: "Analysis as the method: a sentence's grammar can hide its logical form, 'the F' is a quantifier phrase and not a name, and whatever is known only by description can be rebuilt as a logical construction out of what is known by acquaintance"
    lessons: [russell-theory-of-descriptions, logical-constructions-and-acquaintance]
    label: "Russell's analysis"
    years: "1905–1918"
    caption: "The King of France is not bald, twice; the average woman and the table as logical fictions"
  - step: "The limit of language drawn from inside: a proposition is a picture sharing form with a fact, logic is tautology and says nothing, so philosophy is an activity and the book's own sentences are a ladder to be thrown away — the method is clean enough to run on a machine"
    lessons: [tractatus-picture-theory, tractatus-logic-as-tautology, tractatus-saying-showing-and-the-ladder, descriptions-in-a-proof-checker]
    label: "The Tractatus"
    years: "1918–1929"
    caption: "Pictures, truth-tables, one operation $N$, the ladder; and a proof assistant deciding what $1/0$ means"
  - step: "Empiricism rebuilt on the Tractatus: a statement means its method of verification, necessity is analyticity, logic is a choice of framework, ethics expresses and does not state — and the criterion that was to end metaphysics lets anything through by one disjunction"
    lessons: [verification-principle, a-priori-as-analytic, carnap-tolerance-and-frameworks, emotivism, simultaneity-and-operational-definition]
    label: "The Vienna Circle"
    years: "1929–1946"
    caption: "Verification, tautology, tolerance, 'Stealing money!!'; and Einstein's clocks read as the criterion's trophy"
  - step: "The two dogmas fall: analyticity cannot be defined without presupposing itself, and statements face experience only as a body, so no statement is immune to revision and philosophy is continuous with science — a thesis that says something must give and not what"
    lessons: [two-dogmas-analyticity, holism-and-naturalism, neptune-vulcan-web-of-belief]
    label: "Quine"
    years: "1951–1969"
    caption: "The closed curve, the web of belief; Neptune found and Vulcan not"
  - step: "The naming picture dismantled: meaning is use, concepts have no essence and need no boundary, a rule does not contain its applications, nothing private can be a language — and philosophy describes grammar instead of building theories"
    lessons: [meaning-as-use, family-resemblance-and-grammar, rule-following, private-language-argument, turing-test-as-grammar]
    label: "The later Wittgenstein"
    years: "1929–1953"
    caption: "Five red apples, games, 1000–1004–1008, the beetle in the box; and Turing's game read as grammar"
  - step: "Ordinary language as the method: a category mistake dissolves the ghost in the machine, saying is a kind of doing, a sentence refers only in a use — and the method's own best tool, the theory of conversation, hands the logicians back their constants; Moore's common sense is the strand's ancestor"
    lessons: [ryle-category-mistake, austin-speech-acts, strawson-on-referring, grice-conversational-implicature, moore-common-sense]
    label: "Ordinary language"
    years: "1945–1967"
    caption: "Where is the University?; 'I name this ship'; presupposition; the maxims of conversation"
  - step: "Necessity and reference come apart from the a priori and from description: names and kind terms designate rigidly, true identities between them are necessary though discovered, reference runs through a causal chain, and meaning is fixed by the world and the community rather than the head"
    lessons: [kripke-rigid-designation, kripke-against-descriptivism, necessary-a-posteriori, putnam-twin-earth, natural-kinds-against-chemistry]
    label: "Kripke and Putnam"
    years: "1970–1975"
    caption: "Nixon might have lost; Gödel and Schmidt; water is H2O; Twin Earth; and the periodic table consulted"
  - step: "What the tradition did with its tools after 1970: possible worlds taken literally, the mind as a function with a modal objection, justice derived from a decision problem, survival without identity, and the three-page counterexample that reset the theory of knowledge — each glanced at, none developed"
    lessons: [lewis-possible-worlds, functionalism-and-its-objections, rawls-original-position, parfit-personal-identity, gettier-problem]
    label: "After 1970"
    years: "1963–1986"
    caption: "Counterparts, C-fibres, the veil of ignorance, teletransportation, and ten coins"
key_results:
  - text: "Existence is a second-level concept: '$F$s exist' says that the concept $F$ is instantiated, $\\exists x\\,Fx$, and is never a predicate of a thing — which is why 'the perfect being exists' cannot be read off the meaning of 'perfect'"
    lesson: frege-function-and-quantifier
  - text: "A statement of number is about a concept: 'there are exactly two $F$s' is $\\exists x\\exists y\\,(x\\neq y \\wedge Fx \\wedge Fy \\wedge \\forall z(Fz \\to z=x \\vee z=y))$, and from Hume's principle alone second-order logic yields the Peano axioms (Frege's theorem) — Basic Law V, which Russell's paradox destroyed, was needed only to prove Hume's principle"
    lesson: frege-logicism
  - text: "A name has a sense (its mode of presentation) as well as a reference; 'Hesperus = Phosphorus' is informative because the senses differ, and in 'believes that …' a name refers to its ordinary sense, which is why substitution of co-referring names fails there"
    lesson: frege-sense-and-reference
  - text: "'The $F$ is $G$' is $\\exists x\\,(Fx \\wedge \\forall y(Fy \\to y=x) \\wedge Gx)$: the description is not a name, the sentence is false when nothing is $F$, and 'the King of France is not bald' has two readings that differ in the scope of the negation"
    lesson: russell-theory-of-descriptions
  - text: "Every truth-function of elementary propositions is generated by repeated joint denial $N(\\bar\\xi)$, and a proposition true under every assignment is a tautology: senseless (sinnlos), not nonsense — logic says nothing about the world"
    lesson: tractatus-logic-as-tautology
  - text: "No statement-based verification criterion survives disjunction introduction: if $S$ is any sentence and $O$ an observation statement, $S$ together with '$S \\to O$' entails $O$, so 'the Absolute is lazy' is verifiable in principle under the 1936 criterion"
    lesson: verification-principle
  - text: "Analyticity, synonymy, definition and necessity define each other in a circle: interchangeability salva veritate yields synonymy only in a language with 'necessarily', and 'necessarily' presupposes analyticity"
    lesson: two-dogmas-analyticity
  - text: "Statements face experience as a corporate body, so any statement can be held true come what may by revising elsewhere, and none — logic included — is immune to revision"
    lesson: holism-and-naturalism
  - text: "'The meaning of a word is its use in the language' (PI §43): the shopkeeper's 'five red apples' needs three different uses and one object, and a concept like 'game' is held together by overlapping resemblances with no common essence"
    lesson: meaning-as-use
  - text: "Every course of action can be made out to accord with a rule, so if a rule were an interpretation nothing would accord or conflict with it; following a rule is a practice, and 1002 is 'determined' by a training, not by a fact in the mind"
    lesson: rule-following
  - text: "A word for a sensation defined by private ostension has no criterion of correctness — 'whatever is going to seem right to me is right, and that only means that here we can't talk about right' (PI §258)"
    lesson: private-language-argument
  - text: "The performative/constative distinction collapses on Austin's own tests; what survives is the three-fold analysis of an utterance into locutionary content, illocutionary force and perlocutionary effect"
    lesson: austin-speech-acts
  - text: "A proper name is a rigid designator, so a true identity between names is necessary — $\\forall x\\forall y\\,(x=y \\to \\Box\\, x=y)$ — although it may be known only a posteriori; necessary, a priori and analytic are three notions, not one"
    lesson: kripke-rigid-designation
  - text: "If 'Gödel' meant 'the man who proved incompleteness', then had Schmidt proved it everyone saying 'Gödel' would refer to Schmidt; they would not — reference runs through a causal-historical chain from a baptism, not through what speakers know"
    lesson: kripke-against-descriptivism
  - text: "Two speakers in the same psychological state can mean different things by 'water' (H2O here, XYZ on Twin Earth): either meaning is not a psychological state or meaning does not determine extension — 'meanings just ain't in the head'"
    lesson: putnam-twin-earth
  - text: "Justified true belief is not sufficient for knowledge: from a justified false belief $P$, disjunction introduction yields a justified belief $P \\vee Q$ that is true only because $Q$ is, and nobody would call that knowledge"
    lesson: gettier-problem
sources:
  - "G. Frege, Begriffsschrift (1879), Die Grundlagen der Arithmetik (1884), 'Über Sinn und Bedeutung' (1892) — in The Frege Reader, ed. M. Beaney, Blackwell, 1997"
  - "B. Russell, 'On Denoting', Mind 14 (1905), 479–493; The Philosophy of Logical Atomism (1918)"
  - "L. Wittgenstein, Tractatus Logico-Philosophicus (1921), side-by-side-by-side edition ed. K. Klement; Philosophical Investigations, trans. G. E. M. Anscombe, 3rd ed., Blackwell, 2001"
  - "A. J. Ayer, Language, Truth and Logic, 2nd ed., Gollancz, 1946 (with the 1946 Introduction)"
  - "R. Carnap, 'The Elimination of Metaphysics through Logical Analysis of Language' (1932); The Logical Syntax of Language (1934) §17; 'Empiricism, Semantics, and Ontology' (1950)"
  - "W. V. O. Quine, 'Two Dogmas of Empiricism', Philosophical Review 60 (1951), 20–43"
  - "G. Ryle, The Concept of Mind, Hutchinson, 1949; J. L. Austin, How to Do Things with Words, Oxford, 1962; P. F. Strawson, 'On Referring', Mind 59 (1950); H. P. Grice, 'Logic and Conversation' (1967/1975)"
  - "S. Kripke, Naming and Necessity, Harvard, 1980 (lectures of 1970)"
  - "H. Putnam, 'The Meaning of \"Meaning\"', Minnesota Studies in the Philosophy of Science 7 (1975), 131–193"
  - "E. L. Gettier, 'Is Justified True Belief Knowledge?', Analysis 23.6 (1963), 121–123"
  - "M. Beaney, Analytic Philosophy: A Very Short Introduction, Oxford, 2017; M. Beaney, 'Analysis' and its supplement 'Conceptions of Analysis in Analytic Philosophy', Stanford Encyclopedia of Philosophy"
  - "E. Zalta, 'Gottlob Frege'; A. Biletzki & A. Matar, 'Ludwig Wittgenstein'; T. Uebel, 'Vienna Circle'; G. Longworth, 'J. L. Austin' — Stanford Encyclopedia of Philosophy; A. Preston, 'Analytic Philosophy', Internet Encyclopedia of Philosophy"
  - "B. Magee, Men of Ideas, BBC, 1978 — conversations with A. Quinton, A. J. Ayer, B. Williams, W. V. O. Quine, J. Searle, H. Putnam"
  - "S. Soames, Philosophical Analysis in the Twentieth Century, 2 vols., Princeton, 2003; M. Beaney (ed.), The Oxford Handbook of the History of Analytic Philosophy, Oxford, 2013 (neither yet obtained; see research/sources.yaml)"
  - "Syllabi: B. Bayer, PHIL A465 (Loyola New Orleans, 2011); M. Raven, PHIL 316 (UVic, 2022); S. Yablo, 24.251 assignments (MIT OCW, 2011); 24.244 Modal Logic problem sets (MIT OCW, 2015)"
outcomes:
  - id: co-logical-form
    text: "Render an English sentence in quantifier notation by the function–argument analysis, and use the result to diagnose an argument whose grammar hides its logical form — the ontological argument, the King of France, 'the number of planets is necessarily 9'"
    bloom: apply
  - id: co-reconstruct
    text: "Reconstruct each central doctrine — descriptions, the picture theory, verification, analyticity, holism, meaning as use, rule-following, speech acts, rigid designation, externalism — as an explicit argument with its premises and the text that carries each"
    bloom: analyze
  - id: co-refutations
    text: "Evaluate, for each doctrine, the objection that ended or reshaped it — disjunction introduction, the circle of analyticity, the rule-following regress, Gödel and Schmidt, Twin Earth — and state precisely what survived"
    bloom: evaluate
  - id: co-chain
    text: "Explain the historical chain in which each position arose as the fix for a named flaw of the one before, from Frege's quantifier to Putnam's Twin Earth, and place a given thesis in it by decade and by what it answers"
    bloom: understand
  - id: co-three-notions
    text: "Distinguish the a priori, the necessary and the analytic, and classify a given statement — '$7+5=12$', 'Hesperus is Phosphorus', 'the metre bar is one metre long', 'water is H2O' — under each, with the argument for the classification"
    bloom: analyze
  - id: co-apply-tools
    text: "Apply the tradition's tools — logical analysis, a criterion of meaning, grammatical description, rigid designation — to a real argument, a running system or a scientific claim, and state where the idealisation departs from the artefact"
    bloom: apply

modules:
  # ---------------------------------------------------------------------
  - slug: frege
    title: "Frege: the new logic and the theory of meaning"
    outcomes: [co-logical-form, co-reconstruct, co-chain, co-apply-tools]
    lessons:
      - slug: frege-function-and-quantifier
        title: "The function–argument analysis and the quantifier"
        type: core
        status: drafted
        key_image: figures/two-readings.svg
        goal: "Apply Frege's function–argument analysis to render sentences with nested generality in quantifier notation, and demonstrate what the subject–predicate logic it replaced could not express"
        opening: >-
          Every student of mathematics writes 'for every ε there is a δ' without a second thought, and the step from 'every boy loves some girl' to 'some girl is loved by a boy' looks too obvious to need a rule. Yet in 1878 the logic in general use could state neither sentence, let alone license the step: for two thousand years a sentence had been parsed as a subject and a predicate, and a sentence with two 'every'/'some' words in it has no single subject. The question is what a sentence has to be taken apart into for such inferences to become mechanical.
        est_minutes: 32
        prerequisites: []
        concepts:
          introduces: [function-argument-analysis, concept-and-object, quantifier-as-second-level-concept, existence-second-level]
          reinforces: []
        key_ideas:
          - "Subject–predicate logic fails on multiple generality: 'every boy loves some girl' has two readings and no subject; Aristotle's syllogistic has two unrelated rules where one is needed"
          - "A sentence is a function applied to an argument: 'loves' is a two-place function from objects to the two truth-values; a concept is a function whose values are truth-values; 'unsaturated' expressions"
          - "Quantifiers are second-level concepts: $\\forall x\\,Fx$ says of the concept $F$ that every object falls under it; $\\exists$ is defined from $\\forall$ and $\\neg$"
          - "Existence is second-level: '$F$s exist' says $F$ is instantiated and is never a property of a thing — Kant's 'existence is not a real predicate', now a theorem of the notation"
          - "What survived: everything but the two-dimensional notation and the truth-values as objects; what it bought: a lingua characteristica, not a calculus"
        demo: null
        notes: "C3 easy opener: the reader already owns the notation; the news is the date and what the notation replaced. Keep Frege's 2-D script to one figure. No Russell's paradox here."

      - slug: frege-logicism
        title: "Logicism: number as a property of concepts"
        type: core
        status: drafted
        key_image: figures/what-stood.svg
        goal: "Explain Frege's claim that arithmetic is logic by deriving the definition of number from statements of the form 'there are $n$ $F$s', and state what Russell's 1902 letter did and did not destroy"
        opening: >-
          'How many things are on this desk?' has no answer until someone says what to count: one book, 150 pages, 38,000 words. So a statement of number is not about the desk; it is about whatever was counted under. Kant had held that $7+5=12$ rests on an intuition of time that no definition could replace. If instead the number words could be defined from logic alone, arithmetic would be as certain, and as free of intuition, as 'no bachelor is married' — and the question is whether the definitions can be written down without smuggling a number into them.
        est_minutes: 40
        prerequisites: [frege-function-and-quantifier]
        concepts:
          introduces: [logicism, humes-principle, ancestral, basic-law-v]
          reinforces: [concept-and-object, quantifier-as-second-level-concept]
        key_ideas:
          - "A statement of number is a second-level claim about a concept: the same army is one army, three divisions, nine regiments; 'exactly two $F$s' written in pure logic without the numeral 2"
          - "Equinumerosity as one-one correspondence; Hume's principle $\\#F = \\#G \\leftrightarrow F \\approx G$; $0 = \\#[x \\neq x]$, $1 = \\#[x = 0]$, successor, and the ancestral of a relation as the definition of 'natural number'"
          - "Why it mattered: against Kant, arithmetic is analytic — a priori knowledge with no appeal to intuition (Bolzano on the intermediate value theorem)"
          - "Basic Law V identifies concepts by their extensions; Russell's letter of 16 June 1902 shows it inconsistent while vol. 2 is in press; Frege's appendix and abandonment"
          - "What survived: Frege's theorem — Peano arithmetic follows from Hume's principle in second-order logic, Basic Law V was used only to get Hume's principle; the argument form 'definitions must be eliminable and conservative'"
        demo: null
        notes: "This is the one lesson that touches philosophy of mathematics, and it is here because logicism is Frege's claim and its collapse is the tradition's first refutation. The paradox is one section (the event), not the lesson's frame. Keep the cardinality material to what Hume's principle needs; the reader has Cantor."

      - slug: frege-sense-and-reference
        title: "Sense and reference"
        type: core
        status: drafted
        key_image: figures/two-routes.svg
        goal: "Explain the distinction between sense and reference and use it to account for informative identities and for the failure of substitution in belief reports"
        opening: >-
          'Hesperus is Phosphorus' took astronomers to establish; 'Hesperus is Hesperus' takes nobody. Yet if a name's whole job is to stand for its object, both sentences say the same thing about the same planet. And someone who believes Mark Twain wrote Huckleberry Finn and has never heard of Samuel Clemens cannot be said to believe Clemens wrote it, although Clemens is Twain. A theory on which meaning is standing-for cannot tell these pairs apart; the question is what else a name carries.
        est_minutes: 36
        prerequisites: [frege-function-and-quantifier]
        concepts:
          introduces: [sense, reference, mode-of-presentation, indirect-reference, compositionality]
          reinforces: [concept-and-object, function-argument-analysis]
        key_ideas:
          - "Two puzzles: $a=a$ versus $a=b$ in cognitive value; substitution of co-referring names fails under 'believes that'"
          - "Sense as mode of presentation: the same reference given two ways ($4$ and $8/2$; the morning star and the evening star); sense without reference (Pegasus, 'the least rapidly convergent series')"
          - "Sense and reference for every expression: a predicate refers to a concept, a sentence refers to its truth-value and expresses a thought; the two compose in parallel (the 'John loves Mary' tree)"
          - "Indirect reference: inside 'believes that', an expression refers to its ordinary sense — substitution is rescued by a type-shift, not abandoned"
          - "Why it mattered: the first theory of meaning; what came of it: Russell's attack (1905) and the description theory of names that Kripke would refute (1970)"
        demo: null

      - slug: ontological-argument-under-the-new-logic
        title: "The ontological argument under the new logic"
        type: core
        status: drafted
        key_image: figures/countermodel.svg
        goal: "Analyze Anselm's and Descartes's ontological argument with the second-level account of existence, and state where a modal reformulation escapes that diagnosis"
        opening: >-
          A medieval argument claims to prove that a perfect being exists from the meaning of 'perfect' alone: a being that lacked existence would be less than perfect, so the most perfect being cannot lack it. Something is wrong, since the same form proves a perfect island and a scariest devil; but for eight centuries nobody could say which step fails without disputing a premise. The analysis of 'exists' as a property of concepts rather than of things is a tool built for exactly this; the task is to run it on the argument and see what it shows.
        est_minutes: 30
        prerequisites: [frege-function-and-quantifier]
        concepts:
          introduces: [ontological-argument]
          reinforces: [existence-second-level, concept-and-object, quantifier-as-second-level-concept]
        key_ideas:
          - "The argument in Anselm (Proslogion II) and Descartes (Meditation V), and the two parodies (Gaunilo's island; the scariest devil) that show the form proves too much"
          - "Kant's 'existence is not a real predicate': a hundred real thalers contain no more than a hundred possible ones"
          - "The Fregean diagnosis: 'existence is a perfection' treats a second-level concept as a first-level one; in notation the premise cannot even be written"
          - "Where the artefact departs: the modal version (Plantinga 1974) and Gödel's higher-order proof, formalised and checked by computer in 2013, where a 'positive property' operator does the work the diagnosis forbids — and the machine's own finding that the axioms are inconsistent"
          - "Which results the reading used: second-level existence, the concept/object distinction, the levels; which it did not need: sense and reference"
        demo: null
        notes: "APPLICATION lesson (L16) for the Frege module: a real argument of 1078 and 1641, and its 2013 computer formalisation, read against the module's analysis of existence. Russell's descriptive version (On Denoting n.14) is the FORWARD exercise."

  # ---------------------------------------------------------------------
  - slug: logical-atomism
    title: "Russell and the Tractatus: logical atomism"
    outcomes: [co-logical-form, co-reconstruct, co-refutations, co-chain, co-apply-tools]
    lessons:
      - slug: russell-theory-of-descriptions
        title: "The theory of descriptions"
        type: core
        status: planned
        goal: "Construct the logical form of a sentence containing a definite description and use it to explain informative identities, negative existentials and the two readings of a negated description"
        opening: >-
          'The present King of France is bald' is a grammatical English sentence with a subject, and France has no king. If the sentence is about nothing, how can it be false rather than meaningless; and if 'the King of France' must stand for something for the sentence to mean anything, what does it stand for? One answer gives every such phrase a shadowy object that subsists without existing. The task is to find a reading of 'the so-and-so' on which the sentence comes out false, the shadow is unnecessary, and 'the number which added to $n$ gives $m$' still works in arithmetic.
        est_minutes: 42
        prerequisites: [frege-function-and-quantifier, frege-sense-and-reference]
        concepts:
          introduces: [definite-description, incomplete-symbol, scope, logical-form-vs-grammatical-form]
          reinforces: [existence-second-level, sense, reference]
        key_ideas:
          - "Three cases a theory must handle: George IV and the author of Waverley; the King of France and excluded middle; 'the round square does not exist'"
          - "Meinong's subsistent objects and Frege's conventional null denotation rejected; 'the F is G' as $\\exists x\\,(Fx \\wedge \\forall y(Fy\\to y=x) \\wedge Gx)$, the description analysed away"
          - "Descriptions are incomplete symbols: they mean nothing in isolation and contribute to the sentence; identity becomes useful ('no one outside a logic-book wishes to say $x=x$')"
          - "Scope: primary and secondary occurrence; 'the King of France is not bald' false on one reading, true on the other, the wig joke; the touchy yacht owner"
          - "What came of it: Ramsey's 'paradigm of philosophy', the programme of eliminative analysis; what refuted or refined it: Strawson's presupposition (1950), Donnellan, Kripke on names as descriptions"
        demo: null
        notes: "The primary text is on disk (research/texts/russell-on-denoting.txt). Russell writes quantification in awkward English; the lesson writes it in the reader's notation at once. The three puzzles are tests, not the lesson's organising device."

      - slug: logical-constructions-and-acquaintance
        title: "Logical constructions and the programme of analysis"
        type: core
        status: planned
        goal: "Explain Russell's programme of analysis — entities known only by description replaced by logical constructions out of what is known by acquaintance — and evaluate the objection that general propositions cannot be reduced that way"
        opening: >-
          'The average British woman has 1.9 children' is true, and no woman has 1.9 children. Nobody is tempted to add an average woman to the census: the sentence is shorthand for a sum and a division over actual women. Russell proposed that the same move accounts for the table, the English State, the class of all classes and matter itself — each a convenient fiction whose sentences can be rewritten as sentences about something more basic. The question is what the basic things are, how one knows when the rewriting is finished, and whether every sentence survives it.
        est_minutes: 36
        prerequisites: [russell-theory-of-descriptions, frege-logicism]
        concepts:
          introduces: [acquaintance-and-description, logical-construction, logical-atomism, theory-of-types]
          reinforces: [definite-description, incomplete-symbol, basic-law-v]
        key_ideas:
          - "Knowledge by acquaintance and by description: every proposition we understand is built from constituents we are acquainted with; matter and other minds are known only by description"
          - "Classes as logical fictions and the theory of types as the principled response to the paradox (one section); the average woman, the English State, the table as logical constructions — 'wherever possible, substitute constructions for inferred entities'"
          - "The atomist picture: atomic facts, truth-functions of atomic propositions, and 'that is all' — the world fully described by its atoms"
          - "Why it mattered: the method the Tractatus radicalised and Vienna's phenomenalism inherited (the Aufbau)"
          - "What refuted it: same-level versus new-level analysis (Stebbing), 'every economist is fallible' cannot be a list of facts about economists (Black); what survived: contextual definition and the maxim"
        demo: null
        notes: "The Philosophy of Logical Atomism lectures are not on disk (see research/sources.yaml); the atomist picture is reconstructed from Russell's 1905 closing paragraphs, Beaney Ch. 2, Ayer Ch. 3 and the IEP. Keep types to one section — the course is not built around the paradox."

      - slug: tractatus-picture-theory
        title: "The picture theory of the proposition"
        type: core
        status: planned
        goal: "Explain how, in the Tractatus, a proposition represents a possible fact by sharing its logical form, and derive from that account why the form itself cannot be stated"
        opening: >-
          A sentence you have never heard before — 'the kettle is to the left of the lamp' — is understood at once, and understood whether or not it is true. A list of names could not do that: 'kettle, lamp, left' makes no claim. A Paris courtroom in 1914 modelled a traffic accident with toy cars and dolls, and the model made a claim because the toys stood in a relation the cars might have stood in. The question is what a sentence must share with the world for its arrangement of words to be a claim about an arrangement of things.
        est_minutes: 45
        prerequisites: [logical-constructions-and-acquaintance]
        concepts:
          introduces: [picture-theory, logical-form, state-of-affairs, saying-vs-showing, simple-object]
          reinforces: [logical-atomism, sense, logical-form-vs-grammatical-form]
        key_ideas:
          - "The world is the totality of facts, not of things (1–1.21); states of affairs are combinations of objects, and are independent of one another (2.061–2.062)"
          - "A picture is a fact whose elements stand for objects and whose structure is the structure of what it depicts; sense is independent of truth (2.1–2.225); 'that $a$ stands to $b$ in a certain relation says that $aRb$' (3.1432)"
          - "The argument for simple objects from the determinacy of sense (2.0211–2.0212, 3.23): if there were no simples, whether a sentence had sense would depend on whether another sentence was true"
          - "A picture cannot depict its own pictorial form: it displays it (2.172) — the first appearance of showing against saying, which the next two lessons extend"
          - "What refuted it: no elementary proposition was ever exhibited; two colours at one point are incompatible (6.3751), so elementary propositions are not independent — the 1929 crack; what survived: the compositional, truth-conditional account of understanding (4.024)"
        demo: null
        notes: "Three lessons for the Tractatus is the dossier's weight, not padding: picture (2–4.1), logic (4.2–6.13), limits (4.11–7). Use the Ogden/Pears-McGuinness double rendering where wording matters (research/texts/tlp.html)."

      - slug: tractatus-logic-as-tautology
        title: "Logic as tautology"
        type: core
        status: planned
        goal: "Demonstrate that every truth-function is generated by one operation of joint denial and explain why the Tractatus concludes that the propositions of logic say nothing about the world"
        opening: >-
          'Either it is raining or it is not' is true whatever the weather, and tells you nothing about it. Logic is full of such truths, and Frege and Russell had treated them as the most general truths about the world, derived from self-evident axioms as geometry is from Euclid's. But a truth that no possible observation could contradict is a strange kind of truth about the world. The question is what makes a logical truth true, and whether 'true about the world' is even the right description.
        est_minutes: 45
        prerequisites: [tractatus-picture-theory]
        concepts:
          introduces: [truth-function, tautology, joint-denial, truth-grounds-entailment, logical-constants-do-not-represent]
          reinforces: [picture-theory, saying-vs-showing, quantifier-as-second-level-concept]
        key_ideas:
          - "Truth-possibilities and truth-tables (4.31, 4.442): a proposition is the expression of agreement and disagreement with the $2^n$ truth-possibilities of its $n$ elementary propositions"
          - "Tautology and contradiction are the limiting cases — true under all, under none — and say nothing: sinnlos but not unsinnig, like $0$ in arithmetic (4.46–4.4611)"
          - "Entailment is inclusion of truth-grounds (5.11–5.12): no laws of inference are needed, 'every logical proposition is a modus ponens in signs'"
          - "One operation generates everything: $N(\\bar\\xi)$, joint denial over any set of propositions, gives $\\neg$, $\\vee$, $\\wedge$ and, applied to all values of $fx$, the quantifiers (5.5–5.52; Sheffer's stroke made infinitary); the general form $[\\bar p, \\bar\\xi, N(\\bar\\xi)]$"
          - "'My fundamental thought is that the logical constants do not represent' (4.0312): $\\neg$ corresponds to nothing in reality; what came of it: Vienna's account of the a priori; what refuted it: generality cannot be an infinite conjunction, and the decision method of 6.1203 stops at propositional logic (Church 1936)"
        demo:
          component: TruthFunctionBuilder
          spec: >
            A workbench over two or three elementary propositions showing their
            truth-table columns. The only operation offered is N (joint denial)
            applied to a chosen set of the columns already on the bench; each
            application adds a column. The prose sets targets before explaining:
            build ¬p, then p ∨ q, then p → q, then a tautology, from N alone, and
            watch the tautology's column come out all-T. A counter shows how many
            applications each target took; a 'reveal' shows Wittgenstein's
            derivation. Presets: 'negation', 'disjunction', 'excluded middle'.
            Everything client-side, keyboard-operable.

      - slug: tractatus-saying-showing-and-the-ladder
        title: "The limits of language and the ladder"
        type: core
        status: planned
        goal: "Explain why the Tractatus places ethics, the subject and its own sentences outside what can be said, and evaluate the self-refutation objection and the two readings of the ladder"
        opening: >-
          A book whose preface claims to have solved the problems of philosophy ends by declaring its own sentences nonsense and telling the reader to throw them away. The author meant it: the same account of sense that makes 'the kettle is left of the lamp' a picture makes 'the world is the totality of facts' picture nothing. Either the account is wrong, or there is a way for nonsense to do work. The question is how a limit to what can be said can be drawn at all from inside language, and what is supposed to lie on the far side.
        est_minutes: 36
        prerequisites: [tractatus-logic-as-tautology]
        concepts:
          introduces: [formal-concept, the-ladder, philosophy-as-activity, resolute-reading]
          reinforces: [saying-vs-showing, tautology, logical-form]
        key_ideas:
          - "The preface: a limit cannot be drawn to thought, since one would have to think both sides; it is drawn in language, and the far side is 'simply nonsense'"
          - "Formal concepts (4.126–4.1272): 'object', 'number', 'fact' are variables, not predicates; 'there are objects' and 'there are $\\aleph_0$ objects' are nonsense in the same way as 'two plus two at three o'clock equals four'"
          - "Ethics, the will, death and the subject lie outside the world (5.6–5.641, 6.4–6.522): 'the limits of my language mean the limits of my world'; the mystical is that the world is, not how"
          - "Philosophy is an activity of clarification, not a doctrine (4.112); the correct method (6.53) and the ladder (6.54); Russell's hierarchy-of-languages escape and why it was refused"
          - "What came of it: Vienna read 6.53 as a programme; what refuted it: the 1931 self-charge of dogmatism and the colour-exclusion crack; the ineffabilist and resolute readings of the ladder, each stated at its strongest"
        demo: null

      - slug: descriptions-in-a-proof-checker
        title: "Definite descriptions and the tautology test in a proof assistant"
        type: core
        status: planned
        goal: "Analyze how a working proof assistant handles 'the $x$ such that $\\varphi$' when nothing or several things satisfy $\\varphi$, and compare its choice with Frege's, Russell's and the Tractatus's"
        opening: >-
          Type $1/0$ into a modern proof assistant and it returns $0$, with no error. Mathematicians find this scandalous until they ask what the alternative is: every theorem about division would need a side condition, or the expression would have to be meaningless, or it would have to stand for nothing at all — and the software must pick one and make every proof go through. This is the King of France again, with a compiler enforcing the answer; the task is to read the implementation against the three theories that proposed each option.
        est_minutes: 32
        prerequisites: [russell-theory-of-descriptions, tractatus-logic-as-tautology]
        concepts:
          introduces: [iota-operator]
          reinforces: [definite-description, scope, tautology, truth-function, theory-of-types]
        key_ideas:
          - "Three answers to an empty description: Frege's conventional denotation (the null class), Russell's elimination (the sentence is false), and a truth-value gap — and a fourth the engineers chose: a total function with a default value"
          - "The artefact: Lean 4 and Mathlib define $x/0 = 0$ and $0^{-1} = 0$, and prove $a/b = a\\cdot b^{-1}$ for all $b$; Isabelle's `THE` and Lean's `Classical.choose` are description operators with Hilbert's $\\iota$/$\\varepsilon$ semantics; Principia's $\\ast 14$ is the contextual definition in Russell's form"
          - "Scope survives the implementation: 'the inverse of $A$ is invertible' is true in Lean for a singular $A$ on one reading of the default, and the user has to know which"
          - "The tautology test: 6.1203's method is Lean's `decide` for propositional formulas; the assistant needs explicit inference rules the Tractatus said were superfluous, and a type hierarchy the Tractatus said was unnecessary (3.333)"
          - "Where the idealisation departs: totality by default is Frege's 'artificial' option in working clothes; predicate-logic validity is undecidable, so the Tractatus's 'no surprises in logic' holds only where 6.1203 does"
        demo: null
        notes: "APPLICATION lesson (L16) for the module: a deployed system (Lean/Mathlib, Isabelle) read against descriptions, scope and the tautology decision method. Mathlib's division convention and Hilbert's ι are documented in public sources not in the dossier; see research/sources.yaml."

  # ---------------------------------------------------------------------
  - slug: vienna-circle
    title: "The Vienna Circle: logical empiricism"
    outcomes: [co-reconstruct, co-refutations, co-three-notions, co-chain, co-apply-tools]
    lessons:
      - slug: verification-principle
        title: "The verification principle and the elimination of metaphysics"
        type: core
        status: planned
        goal: "Formulate the verification criterion of meaning in its strong and weak versions and demonstrate, with the disjunction-introduction counterexample, why every statement-based formulation failed"
        opening: >-
          'The Absolute enters into, but is itself incapable of, evolution and progress.' 'There are mountains on the far side of the moon' — written in 1936, before any rocket. Both sentences are grammatical; neither could be checked by the people who wrote them. Yet the second is plainly a statement about something and the first is hard to call one. The Vienna philosophers proposed a test that would separate the two and, with it, reclassify most of the history of philosophy as neither true nor false. The task is to state the test precisely enough to apply, and then find out what it lets through.
        est_minutes: 42
        prerequisites: [tractatus-saying-showing-and-the-ladder]
        concepts:
          introduces: [verification-principle, cognitive-significance, metaphysics-as-pseudo-statement, protocol-sentence]
          reinforces: [tautology, philosophy-as-activity, logical-form-vs-grammatical-form]
        key_ideas:
          - "The dictum 'the sense of a proposition is the method of its verification' (Wittgenstein to Schlick, December 1929) and its source in 6.53; the Circle, the 1929 manifesto, the exodus"
          - "Metaphysics from grammar: 'Nothing nothings' read as a quantifier mistake (Carnap 1932), substance and Being from the subject–predicate form, the Goya picture whose authorship is disputable and whose 'reality' is not"
          - "Strong verifiability kills laws of nature ('arsenic is poisonous') and history; falsifiability fails symmetrically; the weak criterion: some observation is relevant"
          - "The weak criterion fails by disjunction introduction: $S$ with $S \\to O$ entails $O$, so 'the Absolute is lazy' qualifies (1946 Introduction); the direct/indirect repair; Hempel's 1950 verdict"
          - "Self-refutation and the metalanguage reply; what survived: the pragmatic maxim ('what difference would it make if true?'), the anti-metaphysical habit, and the demarcation question Popper reposed"
        demo: null
        notes: "Primary text on disk: research/texts/ayer-lt-l.txt (OCR; check quotes). Uebel's SEP entry is partisan for the Circle's left wing — state the plurality once and move on."

      - slug: a-priori-as-analytic
        title: "Necessary truth as analytic truth"
        type: core
        status: planned
        goal: "Explain the logical empiricists' account of mathematical and logical necessity as analyticity, and evaluate it against Mill's inductivism and Kant's synthetic a priori"
        opening: >-
          An empiricist says all knowledge comes from experience, and no experience could ever show that $7+5 \\neq 12$: count five pairs and get nine, and you conclude that you miscounted or that a pair coalesced, never that arithmetic failed. So either mathematics is the best-confirmed empirical theory there is, or it is not knowledge about the world at all. Kant had taken a third way — necessary yet informative — and built a theory of space and time on it; non-Euclidean geometry and relativity had just made that theory look false. The question is how a truth can be necessary and still cost nothing.
        est_minutes: 36
        prerequisites: [frege-logicism, tractatus-logic-as-tautology, verification-principle]
        concepts:
          introduces: [analytic-synthetic, synthetic-a-priori, truth-by-convention]
          reinforces: [tautology, logicism, truth-function]
        key_ideas:
          - "Kant's two distinctions — analytic/synthetic, a priori/a posteriori — and the cell he filled: $7+5=12$ and geometry as synthetic a priori"
          - "Mill's horn: mathematics as very well confirmed generalisation; refuted because a counter-instance is always reinterpreted ('the one explanation which would in no circumstances be adopted is that ten is not always the product of two and five')"
          - "The empiricist's horn: a proposition is analytic when its validity depends solely on the definitions of its symbols; the Tractatus's tautologies as the model; logicism not needed for the thesis"
          - "Geometry as a system of definitions, which geometry fits physical space an empirical question — 'they are all true' if consistent; why tautologies surprise us ($91\\times 79 = 7189$; a being of infinite intellect would take no interest in logic)"
          - "What refuted it: the distinction itself is neither analytic nor empirical (Stebbing); Quine's circle (1951); what survived: the separation of 'true by convention' from 'true by intuition', and Kant's cell left empty"
        demo: null

      - slug: carnap-tolerance-and-frameworks
        title: "Carnap: tolerance, explication and linguistic frameworks"
        type: core
        status: planned
        goal: "Explain Carnap's principle of tolerance and the internal/external distinction, and apply them to 'do numbers exist?' and 'do electrons exist?'"
        opening: >-
          Two mathematicians, one of whom rejects the law of excluded middle, each think the other is doing logic wrong. Two philosophers argue whether numbers really exist, while agreeing that there is a prime between 10 and 20. In both disputes something has gone wrong with the question, and a test of meaning only says that the metaphysical version is meaningless, not what the disputants are actually doing. Carnap's proposal is that each side has chosen a language and mistaken a choice for a discovery; the task is to see what that proposal does to the questions and what it costs.
        est_minutes: 34
        prerequisites: [a-priori-as-analytic]
        concepts:
          introduces: [principle-of-tolerance, explication, internal-external-questions, linguistic-framework]
          reinforces: [analytic-synthetic, truth-by-convention, verification-principle]
        key_ideas:
          - "The Principle of Tolerance (Logical Syntax §17): 'in logic there are no morals' — choose a language by its rules, judge it by consistency and fruitfulness; intuitionist and classical logic as two languages"
          - "Explication: replacing a vague concept by an exact one with criteria of adequacy (warmth → temperature, 'analytic' → 'analytic-in-$L$'); the Aufbau's quasi-analysis as Frege's abstraction by equivalence relation, one paragraph"
          - "Internal and external questions (1950): 'is there a prime between 10 and 20?' is answered inside the number framework; 'do numbers exist?' asked outside it is a practical question about adopting the framework, not a theoretical one"
          - "Why it mattered: the relative a priori — logic is prior to experience within a framework and revisable across frameworks; Kuhn's paradigms in Carnap's own encyclopedia"
          - "What refuted it: Quine's argument that the framework/fact line is the analytic/synthetic line (next module); what survived: explication as conceptual engineering, the pragmatics of theory choice"
        demo: null
        notes: "Carnap's own texts are not on disk; the lesson is grounded in Uebel's SEP entry §§2.3, 3.2, 3.4, 3.6 and Beaney Ch. 6 'explication'. Flagged in research/sources.yaml for a reading pass."

      - slug: emotivism
        title: "Emotivism: ethics and theology under the criterion"
        type: core
        status: planned
        goal: "Explain the emotive theory of ethical sentences, derive it from the verification criterion together with the open question argument, and evaluate the embedding objection to it"
        opening: >-
          'Stealing money is wrong' is a sentence anyone can assert, deny or argue about; it is not a tautology, and no observation of the theft adds a property called wrongness to the facts of who took what. Under a criterion that admits only tautologies and testable claims, the sentence has nowhere to go. One option is to say that it reports the speaker's feelings; but then 'you merely disapprove of it' would be a refutation of it, and it is not. The question is what the sentence does, if it states nothing.
        est_minutes: 36
        prerequisites: [verification-principle]
        concepts:
          introduces: [emotivism, open-question-argument, non-cognitivism, frege-geach-problem]
          reinforces: [verification-principle, cognitive-significance, analytic-synthetic]
        key_ideas:
          - "Four things found in ethical writing — definitions, descriptions of moral experience, exhortations, judgements — and only the first is philosophy"
          - "Naturalist definitions fail the open question test: 'X is pleasant, but is it good?' is not self-contradictory; intuitionism makes ethics unverifiable; so the sentence is neither analytic nor empirical"
          - "The emotive theory: 'you acted wrongly in stealing that money' = 'you stole that money' in a tone of horror; 'Stealing money!!'; expressing a feeling versus asserting one, and why the theory is not subjectivism"
          - "Disputes about value are disputes about fact or they end in abuse; theology: 'God exists' is neither true nor false, so atheism and agnosticism go too; ethics as psychology and sociology"
          - "What refuted it: 'if stealing is wrong, then getting your brother to steal is wrong' — the embedding (Frege–Geach) problem, since the antecedent expresses nothing; Stevenson's disagreement in attitude; what survived: expressivism, and the return of normative theory in 1971"
        demo: null

      - slug: simultaneity-and-operational-definition
        title: "Operational definitions: Einstein's simultaneity read against the verification principle"
        type: core
        status: planned
        goal: "Analyze the 1905 definition of distant simultaneity by light signals as the verificationists read it, and state where that reading of relativity was wrong"
        opening: >-
          Two lightning strokes hit the ends of a moving train; the observer on the embankment calls them simultaneous and the passenger does not, and relativity says neither is mistaken. The 1905 paper had reached that conclusion by first asking what 'simultaneous at a distance' could mean, and answering with a procedure using light signals. To the Vienna philosophers this looked like their criterion winning a Nobel prize: a metaphysical notion replaced by the method of its verification. The task is to read the 1905 definition against the criterion and decide how much of that story the physics supports.
        est_minutes: 32
        prerequisites: [verification-principle, a-priori-as-analytic, carnap-tolerance-and-frameworks]
        concepts:
          introduces: [operational-definition, coordinative-definition, conventionality-of-simultaneity]
          reinforces: [verification-principle, truth-by-convention, linguistic-framework, synthetic-a-priori]
        key_ideas:
          - "The artefact: §1 of the 1905 paper — a clock at A and a clock at B are synchronous by definition when the light signal's out-and-back times are equal; 'simultaneous' is given a procedure, not a nature"
          - "What the Circle took from it: Mach's precept vindicated, Euclid's geometry refuted as a claim about space, Kant's synthetic a priori emptied by physics (the a-priori-as-analytic lesson's missing premise supplied)"
          - "The coordinative-definition reading (Schlick, Reichenbach): the synchrony rule is a convention like a choice of unit; the relative a priori"
          - "Where the reading departs from the physics: synchrony is not a free convention once the theory's own light-cone structure is in place (the standard rule is the unique one definable from it); Einstein's definition fixes a concept inside a theory rather than reducing it to observations; what 'simultaneous' means on a spacelike separation is a fact about a framework, not about verification"
          - "Which module results the reading used: the criterion, convention, frameworks; what the episode foreshadows: operationalism's own failure when 'the' operation turns out to be several (gold tested by Archimedes and by the periodic table — the Kripke–Putnam module)"
        demo: null
        notes: "APPLICATION lesson (L16) for the module: a physicist's definition read against the criterion. Einstein 1905 §1, the 1916 popular exposition's train, and the conventionality debate (Reichenbach 1928; Malament 1977) are not in the dossier — see research/sources.yaml. The SEP Vienna Circle entry §3.7 carries the critique of the Schlick–Reichenbach reading."

  # ---------------------------------------------------------------------
  - slug: quine
    title: "Quine: the two dogmas"
    outcomes: [co-reconstruct, co-refutations, co-three-notions, co-chain, co-apply-tools]
    lessons:
      - slug: two-dogmas-analyticity
        title: "The circle of analyticity"
        type: core
        status: planned
        goal: "Formulate Quine's argument that analyticity cannot be defined without presupposing synonymy, necessity or itself, and evaluate the Grice–Strawson and Carnapian replies"
        opening: >-
          'No bachelor is married' is supposed to be true by meaning alone, 'there are brick houses on Elm Street' true by meaning plus the world. The whole settlement that made mathematics certain and metaphysics meaningless rests on sorting statements into these two bins. Try to say what puts a sentence in the first: 'bachelor' means 'unmarried man' — but what does 'means the same as' come to? The dictionary reports it, interchangeability presupposes it, and 'necessarily' restates it. The question is whether the sorting can be defined at all, and what follows if it cannot.
        est_minutes: 42
        prerequisites: [a-priori-as-analytic, carnap-tolerance-and-frameworks, frege-sense-and-reference]
        concepts:
          introduces: [analyticity, synonymy, salva-veritate, semantical-rule]
          reinforces: [analytic-synthetic, sense, reference, explication, linguistic-framework]
        key_ideas:
          - "Two classes of analytic statement: logical truths ('no unmarried man is married') and those reducible to logical truths by synonym substitution ('no bachelor is married'); the second class is the problem"
          - "Meaning is not reference ('creature with a heart' and 'creature with a kidney'; the evening star); so synonymy, not coextension, is wanted; definition presupposes it (the lexicographer's cart before the horse), except for stipulation"
          - "Interchangeability salva veritate gives synonymy only if the language has 'necessarily'; 'necessarily all bachelors are unmarried' is true only if the sentence is analytic — the closed curve in space"
          - "Semantical rules: 'analytic-for-$L_0$' is a list, and 'analytic for $L$' with $L$ variable is what was to be explained; meaning postulates 'identified only by appearing on a list so headed'"
          - "What refuted or limited it: Grice and Strawson (a distinction everyone applies cannot be empty), Carnap (an explication need not model natural language; Quine's second argument needs extensionalism); what survived: 'analytic' as a matter of degree, and the a priori waiting to be re-separated from the necessary (Kripke)"
        demo: null
        notes: "Primary text on disk: research/texts/quine_two_dogmas.txt. Putnam's reply (pp. 173–177 of 'The Meaning of Meaning') is the FORWARD exercise's doorstep."

      - slug: holism-and-naturalism
        title: "Confirmation holism and naturalised philosophy"
        type: core
        status: planned
        goal: "Explain why statements face experience only as a body, derive from this the revisability of every statement including logic, and state what Quine's naturalism does to the boundary between philosophy and science"
        opening: >-
          A verificationist needs each statement to carry its own set of confirming experiences. But no experiment tests one statement: the prediction that a needle will move follows only from the hypothesis plus the theory of the instrument plus the assumption that nothing else is interfering, and when the needle stays still any one of them may be blamed. If that is right, 'the meaning of a statement is its method of verification' is not imprecise but false, and the question is what remains of the difference between fact and meaning, and between science and philosophy, when nothing is confirmed alone.
        est_minutes: 40
        prerequisites: [two-dogmas-analyticity, verification-principle]
        concepts:
          introduces: [confirmation-holism, web-of-belief, naturalism, ontological-commitment, posit]
          reinforces: [verification-principle, analyticity, logical-construction, principle-of-tolerance]
        key_ideas:
          - "Radical reductionism from Locke to the Aufbau: the statement, not the term, as the unit (Frege's context principle), and the Aufbau's 'is at' that was never translated"
          - "Duhem's point and Quine's extension: 'our statements about the external world face the tribunal of sense experience not individually but only as a corporate body'; the two dogmas are one"
          - "The web: periphery and centre, 'any statement can be held true come what may'; no statement immune — excluded middle for quantum mechanics as Kepler over Ptolemy; physical objects and Homer's gods differ in degree as posits"
          - "To be is to be the value of a variable: ontological commitment read off regimented theory; classes admitted because physics needs them, no more and no less; philosophy continuous with science at its abstract end, epistemology a chapter of psychology"
          - "What refuted or limited it: holism gives no rule for which statement to revise (the next lesson's test); the 'maxim of minimum mutilation' is added, not derived; what survived: the end of the fact/meaning line as a line, and naturalism as the default of the next half-century"
        demo: null

      - slug: neptune-vulcan-web-of-belief
        title: "The web of belief tested: Neptune, Vulcan and the perihelion of Mercury"
        type: core
        status: planned
        goal: "Analyze two anomalies in Newtonian astronomy — Uranus's orbit in 1846 and Mercury's perihelion from 1859 to 1915 — as choices of which statement in a body of theory to revise, and state what holism does and does not predict about them"
        opening: >-
          In 1846 Uranus was not where Newton's law said it should be, and astronomers kept the law and added a planet; Neptune was found within a degree of the predicted spot. In 1859 Mercury was not where the law said either, and the same astronomer added a planet, Vulcan, which nobody ever found; sixty years later the law itself was replaced. The same anomaly, the same move, opposite outcomes. The question is whether an account of how evidence bears on belief can say which statement to give up, or only that something must.
        est_minutes: 32
        prerequisites: [holism-and-naturalism]
        concepts:
          introduces: [auxiliary-hypothesis, minimum-mutilation]
          reinforces: [confirmation-holism, web-of-belief, posit, verification-principle]
        key_ideas:
          - "The artefact: Le Verrier's 1846 prediction from Uranus's residuals, Galle's observation the same night; the 1859 residual of 38 (later 43) seconds of arc per century in Mercury's perihelion, the hypothesised planet Vulcan, forty years of false sightings; the 1915 general-relativistic value"
          - "Both episodes as the web: the same observation sentence false, the same conjunction of law, initial conditions and 'no other bodies' — the revision lands on the periphery in 1846 and, after sixty years of trying the periphery, on the centre in 1915"
          - "What holism predicts and what it does not: that some revision is always available (true both times), not which (silent both times); the scientists' criteria — a new posit must pay its way with an independent observation, and a law gives way only to a law"
          - "Which module results the episode uses: the corporate body, posits, the periphery/centre gradient, minimum mutilation; where the idealisation departs: 'conservatism' and 'simplicity' are the whole story of the choice and the theory names them without ranking them"
          - "What the episode sets up: a name fixed by a description that turned out false of nothing — 'Vulcan' — and one fixed by a true description — 'Neptune' — which the Kripke module will use for a different point"
        demo: null
        notes: "APPLICATION lesson (L16) for the module. The astronomical history (Le Verrier 1846, 1859; Roseveare 1982 on Mercury's perihelion) is not in the dossier; see research/sources.yaml. Ayer Ch. 5 pp. 93–94 (hypotheses saved with 'logically unlimited' freedom) is the 1936 anticipation to quote."

  # ---------------------------------------------------------------------
  - slug: later-wittgenstein
    title: "The later Wittgenstein"
    outcomes: [co-reconstruct, co-refutations, co-chain, co-apply-tools]
    lessons:
      - slug: meaning-as-use
        title: "Meaning as use and language-games"
        type: core
        status: planned
        goal: "Explain the claim that the meaning of a word is its use in the language, derive it from the failure of the naming picture on the shopkeeper's 'five red apples', and apply it to the Tractatus's demand for simple objects"
        opening: >-
          Hand a shopkeeper a slip reading 'five red apples'. He opens the drawer marked 'apples', finds 'red' on a colour chart, and counts aloud to five, taking one apple per numeral. Three words, three different things done with them, and only 'apples' had anything like an object to stand for. The picture of language that the Tractatus shared with Augustine — words name things, sentences combine names — explains none of this. The question is what, if not an object, a word's meaning is.
        est_minutes: 40
        prerequisites: [tractatus-picture-theory, tractatus-saying-showing-and-the-ladder]
        concepts:
          introduces: [meaning-as-use, language-game, form-of-life, augustinian-picture]
          reinforces: [picture-theory, simple-object, sense, reference]
        key_ideas:
          - "Augustine's picture (§1) and the shopkeeper: naming is one use among many, and 'what is the meaning of five?' has no object to point at — 'only how the word five is used'"
          - "The builders (§2) as the whole Augustinian language; teaching as training, not explanation; language-games and forms of life (§§7, 19, 23): giving orders, reporting, guessing riddles, thanking — not one function but a list"
          - "Words as tools (§§11–12): the uniform look of words hides diverse jobs, like handles in a locomotive cab; §43: for a large class of cases the meaning of a word is its use in the language; Excalibur and Mr N. N. (§§39–44) — meaning is not bearer"
          - "Against simples (§§46–64): 'composite' has no absolute sense, the standard metre is neither one metre long nor not, the broom sentence 'analysed' says no more — the Tractatus's demand for determinacy was a demand, not a discovery"
          - "What came of it: the second strand of the tradition; what refuted or refined it: 'use' is not yet a theory (Grice's intentions, Searle's acts), and a kind term's extension turns out to be fixed by what its samples are (Kripke, Putnam)"
        demo: null

      - slug: family-resemblance-and-grammar
        title: "Family resemblance and philosophy as grammar"
        type: core
        status: planned
        goal: "Explain why concepts such as 'game' and 'proposition' need no common essence and no sharp boundary, and state what that does to the method of philosophy — description of grammar in place of theory"
        opening: >-
          Board games, card games, ball games, a child throwing a ball at a wall, ring-a-ring-a-roses: try to write down what all and only games have in common, and every candidate — amusement, winning, skill, rules — excludes some games and admits non-games. Frege had insisted that a concept with no sharp boundary is no concept at all, as an area with no boundary is no area. Either 'game' is defective and most of our words with it, or the demand for a definition was wrong. The question is what a word with no essence has instead, and what a philosophy that cannot look for essences is for.
        est_minutes: 36
        prerequisites: [meaning-as-use]
        concepts:
          introduces: [family-resemblance, grammatical-investigation, philosophy-as-therapy, perspicuous-representation]
          reinforces: [meaning-as-use, language-game, concept-and-object, philosophy-as-activity]
        key_ideas:
          - "'Don't think, but look!' (§66): the walk through the games; a complicated network of overlapping similarities; the thread whose strength is in no single fibre (§67); the 'disjunction of common properties' reply dismissed"
          - "Blurred concepts against Frege (§§68–71): an indistinct photograph is still a picture; 'stand roughly there' is an exact enough instruction (§88) — exactness is relative to a purpose"
          - "The sublimity of logic (§§89–108): the crystalline purity was a requirement we imposed, not a discovery; 'we have got on to slippery ice' — 'back to the rough ground!'"
          - "Method (§§109–133): no theses, no explanation, description of grammar; 'a picture held us captive' (§115); bring words back from metaphysical to everyday use (§116); a perspicuous representation; 'I don't know my way about' (§123); philosophy leaves everything as it is (§124)"
          - "What refuted or limited it: natural kinds do have something in common, found by chemistry (Kripke, Putnam) — family resemblance is right about 'game' and wrong about 'gold'; what survived: prototype theory in psychology, and the suspicion of necessary-and-sufficient conditions that Gettier's paper would nonetheless ignore"
        demo: null

      - slug: rule-following
        title: "Rule-following"
        type: core
        status: planned
        goal: "Formulate the rule-following paradox of PI §§185–202 — every course of action can be made out to accord with a rule — and explain why the resolution lies in a practice rather than a further interpretation"
        opening: >-
          A pupil has learned to continue the series 2, 4, 6, … and does so correctly up to 1000. Then he writes 1000, 1004, 1008, and when corrected says 'but I went on in the same way'. Nothing in the examples he was shown rules his continuation out: infinitely many functions agree on the first five hundred values. Yet he is wrong, and we all know he is wrong. The question is what the rule 'add 2' contains, such that 1002 was already settled before anyone reached it — and whether anything at all could contain that.
        est_minutes: 45
        prerequisites: [family-resemblance-and-grammar]
        concepts:
          introduces: [rule-following-paradox, interpretation-regress, practice-and-custom, kripkenstein]
          reinforces: [meaning-as-use, form-of-life, grammatical-investigation, ancestral]
        key_ideas:
          - "Understanding is not a state or process (§§146–155): 'now I can go on!' on 1, 5, 11, 19, 29 is a signal, judged by what follows; the formula occurring to you is neither necessary nor sufficient"
          - "The deviant pupil (§185) and 'determines' (§189): $y=x^2$ determines $y$ for a given $x$ in a kind of training, not by a mental mechanism; the machine as symbol (§§193–197) — the possibility of movement is not a shadow of the movement"
          - "The paradox (§201): if every action can be made to accord with a rule, it can be made to conflict too, so there would be neither accord nor conflict — and the diagnosis: an interpretation hangs in the air with what it interprets; the regress of sign-posts (§§85, 198)"
          - "The resolution: a way of grasping a rule that is exhibited in obeying it, not an interpretation; 'obeying a rule is a practice' (§202), custom, training, 'my spade is turned' (§217), 'I obey the rule blindly' (§219), agreement in form of life (§§241–242)"
          - "What came of it: Kripke's sceptical reading (68 + 57 = 5 under 'quus') with a community solution, and the 'straight' readings that deny a sceptical problem exists; what it leaves for the next lesson: can a practice be private?"
        demo:
          component: RuleContinuation
          spec: >
            The reader is shown an initial segment of a sequence (preset: 2, 4, 6,
            …, 1000 compressed to its first and last terms) and types the next
            term. Whatever number they type, the panel instantly displays a
            closed-form rule (a low-degree polynomial or a piecewise 'add 2 up to
            1000, then add k' rule) that fits every shown term AND their entry,
            with the formula typeset. A counter shows how many distinct fitting
            rules the panel has produced so far; a 'challenge' button asks the
            reader to type a next term that NO rule could fit, and the panel
            always finds one. Presets: '+2', '1 5 11 19 29', 'quus at 57'. The
            prose asks the reader to try to lose before it explains §201.
            Client-side; fits on a phone.

      - slug: private-language-argument
        title: "The private-language argument"
        type: core
        status: planned
        goal: "Formulate the argument of PI §§243–315 that a language whose words refer to what only the speaker can know is impossible, and distinguish its conclusion from behaviourism"
        opening: >-
          Descartes began from what each of us knows best: the contents of our own mind, which no one else can inspect. Suppose you decide to record a recurring sensation by writing 'S' in a diary whenever it comes. You cannot define 'S' to anyone else, but surely you can define it to yourself by attending to the sensation as you write. The question is whether that act sets up a rule you could later follow correctly or incorrectly — and if not, whether 'S' is a word at all.
        est_minutes: 40
        prerequisites: [rule-following]
        concepts:
          introduces: [private-language, criterion-of-correctness, beetle-in-the-box, outward-criteria]
          reinforces: [rule-following-paradox, practice-and-custom, meaning-as-use, acquaintance-and-description]
        key_ideas:
          - "What 'private' means (§§243–255): not a code for what others could learn, but words for what only I can know; sensation words learned by replacing the natural expression — 'the verbal expression of pain replaces crying and does not describe it' (§244)"
          - "The diary (§258): private ostensive definition gives no criterion of correctness — 'whatever is going to seem right to me is right, and that only means that here we can't talk about right'; the memory of a timetable checked against the memory of the timetable (§265); the wheel that turns nothing (§271)"
          - "The beetle in the box (§293): if sensation words worked on the object-and-name model, the object would drop out as irrelevant — 'not a something, but not a nothing either' (§304)"
          - "Not behaviourism (§§307–308): the grammatical fiction is denied, not the sensation; 'an inner process stands in need of outward criteria' (§580); sensations are ascribed to the living and what behaves like it (§281)"
          - "What came of it: the end of the Cartesian starting point for the mind, Ryle's Oxford counterpart; what refuted or reshaped it: Ayer's Crusoe (1954), Kripke's community reading, and functionalism's attempt to keep the inner state by giving it a job"
        demo: null

      - slug: turing-test-as-grammar
        title: "Turing's imitation game read as a grammatical move"
        type: core
        status: planned
        goal: "Analyze the 1950 replacement of 'can machines think?' by the imitation game with the tools of meaning as use and outward criteria, and state where the game is a verificationist rather than a Wittgensteinian answer"
        opening: >-
          In 1950 a mathematician who had sat in Wittgenstein's Cambridge lectures opened a paper by declaring the question 'can machines think?' too meaningless to discuss, and replaced it with a game: can an interrogator typing questions tell the machine from the human? The replacement has been read as a definition, as a test, and as an evasion. The task is to read it against two accounts of what 'thinks' means — a word whose meaning is its use among living beings, and a word whose meaning is the method of its verification — and decide which the game answers to.
        est_minutes: 30
        prerequisites: [private-language-argument, verification-principle]
        concepts:
          introduces: [imitation-game, criteria-vs-symptoms]
          reinforces: [meaning-as-use, outward-criteria, verification-principle, family-resemblance]
        key_ideas:
          - "The artefact: §§1–2 of the 1950 paper (the game; 'the original question is too meaningless to deserve discussion') and §6's 'argument from consciousness' with its reply"
          - "The Wittgensteinian reading: 'we say only of a human being and what resembles one that it thinks' (§360); 'thinking' is a family of uses (§§327–339); 'an inner process stands in need of outward criteria' — the game supplies criteria, and that is grammar, not evidence"
          - "The verificationist reading: 'if I know that an object behaves in every way as a conscious being must, by definition, behave, then I know that it is really conscious — and this is an analytic proposition' (the 1936 formula); the game as an operational definition"
          - "Where the two come apart: criteria versus symptoms (§354) — a criterion is defeasible and belongs to a practice, a verification is a test; the game is a single test and so sides with 1936; 'my attitude towards him is an attitude towards a soul' is not a verdict the game can deliver"
          - "Which module results the reading uses: use, criteria, the private-language result on other minds; where the artefact departs: Turing's own 'objections' section argues as if the question were empirical after all; the Chinese room (1980) as the dispute's next form"
        demo: null
        notes: "APPLICATION lesson (L16) for the module. Turing's 1950 paper is not in the dossier (public, Mind 59: 433–460); see research/sources.yaml. Ayer's p. 140 formula is on disk (research/texts/languagetrut-s3-ch07-08.txt)."

  # ---------------------------------------------------------------------
  - slug: ordinary-language-philosophy
    title: "Ordinary-language philosophy"
    outcomes: [co-reconstruct, co-refutations, co-chain, co-apply-tools]
    lessons:
      - slug: ryle-category-mistake
        title: "Ryle's category mistake and the ghost in the machine"
        type: core
        status: planned
        goal: "Explain the category mistake and apply it to the Cartesian picture of mind as a second, inner substance, distinguishing Ryle's dispositional analysis from the behaviourism it was accused of"
        opening: >-
          A visitor is shown the colleges, the libraries and the laboratories of a university and then asks 'but where is the University?' — as though it were one more building. He has not made a factual error; he has put a word in the wrong category. Descartes's picture of a person as a body plus an invisible mind that steers it had resisted three centuries of attack on its facts. Ryle's claim is that it was never a factual error either, and the task is to say what kind of error it is and what talk about minds comes to without it.
        est_minutes: 36
        prerequisites: [private-language-argument]
        concepts:
          introduces: [category-mistake, dispositional-analysis, knowing-how-knowing-that, ghost-in-the-machine]
          reinforces: [outward-criteria, logical-construction, logical-form-vs-grammatical-form]
        key_ideas:
          - "The category mistake: the University, the team spirit, the Average Taxpayer — a term of one logical type treated as belonging to another; 'is this laptop hungry?'"
          - "The official doctrine: the ghost in the machine, a para-mechanical cause behind every performance; why its facts were never the problem"
          - "Knowing how is not knowing that: riding a bicycle without a proposition; the regress — if every intelligent act needed a prior act of considering a rule, no act could begin"
          - "Dispositions: 'brittle' names no inner event but a conditional about breaking; 'vain', 'believes', 'intends' analysed the same way; why this is not behaviourism (a disposition is not a behaviour) and why the charge stuck"
          - "What came of it: the first analytic philosophy of mind and the Oxford method; what refuted or displaced it: dispositions need a categorical base (identity theory, 1956–59) and inner states can be given a job (functionalism) — the closing module's glance"
        demo: null
        notes: "The Concept of Mind is not on disk; the lesson is grounded in Beaney Ch. 4 (laptop) and Ch. 6, the SEP 'Conceptions of analysis' §8, and the Magee–Williams conversation. Flagged in research/sources.yaml for a reading pass (Ch. 1 'Descartes' Myth' and Ch. 2 'Knowing How and Knowing That')."

      - slug: austin-speech-acts
        title: "Austin: performatives and speech acts"
        type: core
        status: planned
        goal: "Explain the performative/constative distinction, demonstrate why Austin's own tests collapse it, and apply the locutionary/illocutionary/perlocutionary analysis to an utterance"
        opening: >-
          'I name this ship the Queen Elizabeth', said while smashing the bottle, is neither true nor false; said by the wrong person, it is not false either — the ship simply does not get named. Logic from Frege to the Vienna Circle had treated every indicative sentence as a candidate for truth and consigned the rest to emotion. Here is an indicative sentence that does something instead of saying something, and the question is how many such sentences there are and what becomes of 'true' once saying is also a kind of doing.
        est_minutes: 40
        prerequisites: [verification-principle, meaning-as-use]
        concepts:
          introduces: [performative-utterance, felicity-conditions, illocutionary-force, descriptive-fallacy]
          reinforces: [meaning-as-use, emotivism, cognitive-significance, language-game]
        key_ideas:
          - "Performatives: 'I do', 'I bet you sixpence', 'I give and bequeath my watch' — assessed as happy or unhappy, not true or false; misfires (the purser, not the captain) and abuses (the insincere promise)"
          - "The collapse (lectures V–VII): statements misfire ('the present King of France'), performatives are assessed against facts ('I warn you the bull is about to charge'), and 'I state that' is both; the distinction cannot be drawn by grammar or by vocabulary"
          - "The replacement: locutionary act (what was said), illocutionary act (its force: warning, promising, stating), perlocutionary act (its effect: alarming, persuading); 'I'll be home for dinner' as promise and as prediction"
          - "The true/false fetish: 'France is hexagonal' is rough, 'Lord Raglan won the battle of Alma' is true in a schoolbook and exaggerated in a history — truth as a dimension of assessment among others; 'it takes two to make a truth'; the descriptive fallacy named"
          - "Why it mattered: speech-act theory (Searle), legal philosophy (Hart), linguistics; what refuted or reshaped it: the force/content split must be kept for logic to work (the same embedding problem that caught emotivism), and the method's own limit (the next two lessons)"
        demo: null

      - slug: strawson-on-referring
        title: "Strawson's presupposition against Russell's descriptions"
        type: core
        status: planned
        goal: "Formulate Strawson's objection that Russell analysed sentences rather than uses, explain presupposition and the truth-value gap, and evaluate Russell's reply"
        opening: >-
          Someone tells you today, in earnest, 'the King of France is wise'. On Russell's analysis you should answer 'that's false'. You would not; you would say 'there is no King of France' — the question of truth does not arise. The same sentence, uttered in 1670, would have been true or false. So the thing that is true or false seems not to be the sentence but a particular use of it. The task is to say what a use is, what 'the' presupposes rather than asserts, and whether Russell's logic was wrong or only aimed at a different target.
        est_minutes: 34
        prerequisites: [russell-theory-of-descriptions, austin-speech-acts]
        concepts:
          introduces: [presupposition, truth-value-gap, sentence-vs-use, referential-attributive]
          reinforces: [definite-description, scope, illocutionary-force, incomplete-symbol]
        key_ideas:
          - "Sentence, use of a sentence, utterance: the sentence 'the King of France is wise' is neither true nor false; a use of it in 1670 was true, a use today is a failed reference"
          - "Presupposition is not entailment: 'the F is G' presupposes that there is one F; if the presupposition fails the question of truth does not arise — a truth-value gap, where Russell has 'false'"
          - "The uniqueness clause does not belong in the assertion: 'the table is covered with books' does not claim there is only one table in the universe; context does the referring"
          - "Russell's reply (1957): Strawson's problem is egocentricity, not description; a logic serves mathematics and science, where 'the' must be eliminable; the two were answering different questions — the semantics/pragmatics split in its first form"
          - "What came of it: Donnellan's referential and attributive uses (1966: 'the man drinking a martini'), presupposition as a tool of linguistics, Kripke's speaker's versus semantic reference (1977); what survived on both sides, stated"
        demo: null
        notes: "'On Referring' and Russell's 'Mr Strawson on Referring' are not on disk; Beaney Ch. 6, Yablo's comprehension prompt and student example, and Kripke's n. 3 ground the lesson. Flagged in research/sources.yaml."

      - slug: grice-conversational-implicature
        title: "Grice's maxims: implicature and the end of the ordinary-language programme"
        type: core
        status: planned
        goal: "Apply Grice's cooperative principle and maxims to derive, as implicatures, the divergences between the logician's 'or', 'some' and 'if' and their ordinary use, and state what that does to the ordinary-language method"
        opening: >-
          A logic student learns that 'some' is compatible with 'all' and that '$p$ or $q$' is true when both hold; the ordinary speaker who says 'some of the guests left' is taken to mean that not all did, and 'she is in the kitchen or the garden' to mean the speaker does not know which. Ordinary-language philosophers took such divergences as proof that formal logic misdescribes English. Grice, one of their own, proposed that the logician was right about the words and that everything else is supplied by a theory of conversation. The task is to build that theory from one principle and see which divergences it recovers.
        est_minutes: 36
        prerequisites: [strawson-on-referring, austin-speech-acts]
        concepts:
          introduces: [conversational-implicature, cooperative-principle, cancellability]
          reinforces: [illocutionary-force, sentence-vs-use, presupposition, truth-function, meaning-as-use]
        key_ideas:
          - "The artefact: the 1967 William James lectures and their divergence table — '$\\wedge$' versus 'and then', '$\\vee$' versus 'I don't know which', '$\\exists$' versus 'not all', '$\\to$' versus the conditional of ordinary speech"
          - "The cooperative principle and the maxims (Quantity, Quality, Relation, Manner); the calculation: what is said, what the maxims demand, what the hearer must assume to keep the speaker cooperative; 'some of the guests left' implicates 'not all' by Quantity"
          - "Tests for an implicature: cancellable ('some left — in fact all did'), non-detachable, not part of what is said; conventional implicature ('he is an Englishman; he is, therefore, brave') as the contrast"
          - "Which module results the tool uses: Austin's force/content split made precise, Strawson's use/sentence line (the implicature is what the use adds to the sentence), Russell's 'the' re-examined; where it departs from the programme: it is a theory, and it hands the logician back the constants — Strawson's objection to Russell loses its best examples"
          - "Where the artefact runs today: implicature is a working notion in linguistics and in the evaluation of language models (scalar implicature tests), with the maxims as the standard; what remains contested: whether 'what is said' can be fixed without the maxims"
        demo: null
        notes: "APPLICATION lesson (L16) for the module: a real theory, in daily use in linguistics, built by the programme's own method and marking its limit. 'Logic and Conversation' itself is not on disk (Yablo's comprehension prompt and the student example are); see research/sources.yaml."

      - slug: moore-common-sense
        title: "Moore's common sense and the open question argument"
        type: extra
        status: planned
        goal: "Explain Moore's defence of common sense against idealism and his open question argument, and state which later positions each descends into"
        opening: >-
          'Here is one hand, and here is another': Moore offered that, hands raised, as a proof that external things exist, and insisted that he knew the premises better than any philosophical argument to the contrary. And of 'good' he claimed that it cannot be defined at all, since for any proposed definition 'X is pleasant, but is it good?' remains a real question. Both moves refuse to let a theory overrule what everyone already knows how to say; the question is what gives common sense that authority and whether the open question proves too much.
        est_minutes: 30
        prerequisites: [frege-sense-and-reference, emotivism]
        concepts:
          introduces: [common-sense-defence, naturalistic-fallacy, paradox-of-analysis]
          reinforces: [open-question-argument, sense, meaning-as-use]
        key_ideas:
          - "The rebellion of 1898–1903: Moore then Russell against the idealists' monism ('escaped from a hot house onto a windswept headland'); the refutation of idealism as a diagnosis of 'esse est percipi' as a definition"
          - "A Defence of Common Sense (1925) and the Proof (1939): propositions known with certainty against any argument for their denial; the reaction in On Certainty — 'I know' has no use here"
          - "Principia Ethica: 'good' is simple like 'yellow'; the open question argument and the naturalistic fallacy; the counter-case 'water is H2O' shows the argument proves too much — a definition can be correct and informative"
          - "The paradox of analysis (Langford 1942): an analysis is either trivial or incorrect; Frege's sense as the way out — informative by being transformative"
          - "Why it matters off the main path: the Cambridge strand (Stebbing's 1930 textbook, the journal Analysis, 1933) and Oxford's method descend from the Defence; Ayer's emotivism and Kripke's water both answer Principia Ethica"
        demo: null
        notes: "Off-path (type: extra) by the human's brief; no core lesson requires it. The emotivism lesson explains the open question argument in one paragraph on its own; this lesson deepens it."

  # ---------------------------------------------------------------------
  - slug: kripke-and-putnam
    title: "Reference and necessity: Kripke and Putnam"
    outcomes: [co-reconstruct, co-refutations, co-three-notions, co-chain, co-apply-tools]
    lessons:
      - slug: kripke-rigid-designation
        title: "Rigid designation and the necessary/a priori split"
        type: core
        status: planned
        goal: "Distinguish the a priori, the necessary and the analytic, define rigid designation, and derive from it that a true identity between names is necessary even when it was discovered"
        opening: >-
          Nixon won the 1968 election; he might have lost. 'The President in 1970 might not have been President' is true on one reading and absurd on another, while 'Nixon might not have been Nixon' is just absurd. Philosophers since Kant had treated 'necessary' and 'knowable without experience' as one notion under two names, and Quine had argued that necessity attaching to things rather than to sentences is incoherent. The question is what difference between a name and a description the two 'might' sentences are tracking, and what it does to the identification of the necessary with the a priori.
        est_minutes: 45
        prerequisites: [russell-theory-of-descriptions, a-priori-as-analytic, two-dogmas-analyticity]
        concepts:
          introduces: [rigid-designator, necessary-vs-a-priori, possible-worlds-stipulated, necessity-of-identity, contingent-a-priori]
          reinforces: [definite-description, scope, analytic-synthetic, analyticity, sense]
        key_ideas:
          - "Three notions: a priori (epistemic), necessary (metaphysical), analytic (semantic); Goldbach's conjecture is necessary if true and known a priori by nobody; 'can be known a priori' is not 'must be'"
          - "Possible worlds are stipulated, not discovered through a telescope: the two dice and their 36 states; 'transworld identification' is a pseudo-problem because we start from the object"
          - "A rigid designator designates the same object in every world where it designates at all; 'Nixon' is rigid, 'the President in 1970' is not; the intuitive test ('might not have been') and why rigidity is not a scope convention"
          - "The necessity of identity: from $\\forall x\\,\\Box(x=x)$ and Leibniz's law, $\\forall x\\forall y\\,(x=y \\to \\Box\\,x=y)$; so 'Hesperus = Phosphorus', an astronomical discovery, is necessary — necessary a posteriori, previewed"
          - "Reference-fixing versus meaning-giving: the standard metre bar is one metre long a priori and contingently; what came of it: metaphysics back in business; what refuted or refined it: Dummett's scope reply (answered in the Preface) and two-dimensional semantics"
        demo: null

      - slug: kripke-against-descriptivism
        title: "The refutation of descriptivism and the causal picture of reference"
        type: core
        status: planned
        goal: "Formulate the description theory of names as six theses, refute each with Kripke's counterexamples, and explain the causal-historical picture that replaces it"
        opening: >-
          Ask anyone what 'Gödel' means and they will say: the man who proved the incompleteness of arithmetic. Suppose the theorem was actually proved by a Viennese named Schmidt, whose manuscript Gödel took after Schmidt's death. On the theory of names that Frege and Russell left and Searle refined, 'Gödel' would then refer to Schmidt, and 'Gödel proved incompleteness' would be true. It is not: everyone saying 'Gödel' would be talking about the thief. The question is how a name reaches its bearer, if not through what its users know.
        est_minutes: 40
        prerequisites: [kripke-rigid-designation, frege-sense-and-reference]
        concepts:
          introduces: [descriptivism, cluster-theory, causal-historical-chain, reference-fixing-vs-meaning-giving]
          reinforces: [rigid-designator, sense, definite-description, necessary-vs-a-priori]
        key_ideas:
          - "The description theory as six theses and a non-circularity condition: the cluster of properties, uniqueness, majority fit, the a priori and the necessary truth of 'if $X$ exists, $X$ has most of the $\\varphi$s'; Searle's corporation with weighted votes"
          - "Thesis 6 falls to rigidity: Aristotle might not have taught Alexander; Hitler might have stayed in Linz; Thesis 5 survives only when a description fixed the reference (Neptune, Jack the Ripper)"
          - "Theses 2–4 fall to cases: Feynman ('a physicist'), Cicero and Catiline, Gödel and Schmidt, Peano's axioms (Dedekind's), Columbus, Jonah; the 'commonly attributed' repair is circular; Kneale's 'the man called Socrates' never gets reference off the ground"
          - "The picture, not a theory: an initial baptism by ostension or description, the name passed link to link with the intention to use it as the previous speaker did; the actual chain, not the speaker's belief about it; limits: Santa Claus, Madagascar, the aardvark named Napoleon"
          - "What came of it: reference without the head — externalism begins; what refuted or refined it: causal descriptivism, Evans on reference shift, Dummett's defence of sense"
        demo: null

      - slug: necessary-a-posteriori
        title: "Natural kinds and the necessary a posteriori"
        type: core
        status: planned
        goal: "Explain why 'water is H2O' and 'Hesperus is Phosphorus' are necessary yet known only by discovery, extend rigid designation to kind terms, and explain away the appearance of contingency"
        opening: >-
          Chemists discovered that water is H2O; nobody could have known it from an armchair. Yet try to describe a possible world in which water is not H2O: a world with a clear, drinkable liquid of some other composition is a world with no water in it, only a look-alike. The discovery seems both empirical and impossible to have come out otherwise, which Kant's categories forbid. The question is what kind of truth that is, and why it feels contingent when it is not.
        est_minutes: 42
        prerequisites: [kripke-against-descriptivism]
        concepts:
          introduces: [necessary-a-posteriori, natural-kind-term, essentialism-of-origin, illusion-of-contingency]
          reinforces: [rigid-designator, necessity-of-identity, necessary-vs-a-priori, family-resemblance, reference-fixing-vs-meaning-giving]
        key_ideas:
          - "Hesperus and Phosphorus: the identity is necessary (two rigid names, one object) and was discovered; the epistemic 'might' — 'the four-colour theorem might turn out false' — versus the metaphysical one"
          - "The illusion of contingency explained: a qualitatively identical epistemic situation in which the names fell on two bodies is not a world where Hesperus is not Phosphorus; where a description fixes reference ($D_1 = D_2$ contingent) while the names are rigid ($R_1 = R_2$ necessary)"
          - "Essences of origin: this table could not have been made of ice, Elizabeth II could not have been the Trumans' daughter (the sketch of footnote 56); what 'could not' means after the dice"
          - "Kind terms are rigid: gold is the element with atomic number 79, fool's gold with all the marks is not gold and blue gold with none of them is; tigers without stripes or legs; heat is molecular motion, with the sensation only fixing the reference"
          - "What came of it: essentialism rehabilitated after Quine, theoretical identifications as discoveries of essence; what refuted or limited it: Salmon's charge that the essentialism is assumed, not derived; two-dimensionalism's 'primary' and 'secondary' intensions"
        demo: null

      - slug: putnam-twin-earth
        title: "Twin Earth and semantic externalism"
        type: core
        status: planned
        goal: "Formulate the Twin Earth argument that two speakers in the same psychological state can mean different things, and explain the division of linguistic labour and the stereotype that replace meaning as a concept in the head"
        opening: >-
          Putnam could not tell an elm from a beech; his concept of each, he admitted, was 'common deciduous tree'. Yet when he said 'elm' he was talking about elms, and when he said 'beech', about beeches. Whatever fixed that was not in his head. Add a planet where the lakes are full of a liquid XYZ that looks and tastes like water, and a twin of yours in 1750 who has every thought you have: his word 'water' and yours differ in what they are true of. The task is to find which of two long-held assumptions about meaning has to go.
        est_minutes: 42
        prerequisites: [necessary-a-posteriori, two-dogmas-analyticity]
        concepts:
          introduces: [semantic-externalism, twin-earth, division-of-linguistic-labour, stereotype, meaning-vector]
          reinforces: [natural-kind-term, rigid-designator, sense, synonymy, analyticity]
        key_ideas:
          - "Two assumptions the tradition held together: (I) knowing a meaning is being in a psychological state; (II) meaning determines extension; methodological solipsism makes (I) 'narrow'; together they say the head fixes the extension"
          - "Twin Earth in 1750: Oscar and Oscar$_2$ are molecule-for-molecule twins in the same state, and 'water' is true of H2O for one and of XYZ for the other — so (I) and (II) cannot both hold; 'meanings just ain't in the head'"
          - "The division of linguistic labour: 'gold' is used by people who cannot test for gold, because the community contains people who can; words are steamships, not hammers; the extension is fixed socially and indexically ('the stuff around here')"
          - "What a speaker does have: a stereotype (gold is yellow; tigers are striped) one is obliged to acquire, neither analytic nor statistical; the meaning vector (syntactic markers, semantic markers, stereotype, extension), on which Earth and Twin Earth differ in the last entry only"
          - "What came of it: externalism about mind (Burge), the end of the Cartesian theatre for meaning; what it concedes and what refuted or limited it: 'important' in 'same liquid' is interest-relative, jade is two kinds, narrow content and two-dimensionalism as the internalist reply; Putnam's own later retreat"
        demo: null

      - slug: natural-kinds-against-chemistry
        title: "Natural-kind terms read against the periodic table and the species concept"
        type: core
        status: planned
        goal: "Evaluate the claims 'gold is the element with atomic number 79', 'water is H2O' and 'tigers are a species' against what chemistry and biology say, and state where the theory of rigid kind terms idealises"
        opening: >-
          'Water is H2O' is the textbook example of a discovered necessity. Tap water is a solution of ions, dissolved gases and several isotopes; pure water in a bottle is partly H3O+ and OH− at any instant; heavy water is D2O and is poisonous. 'Jade' names two unrelated minerals; biologists have no agreed definition of a species, and some of the candidates are not even transitive. The task is to take the three examples the theory rests on to the sciences that supposedly supply the essences, and see how much of the theory survives the visit.
        est_minutes: 34
        prerequisites: [putnam-twin-earth]
        concepts:
          introduces: [species-problem, hidden-structure]
          reinforces: [natural-kind-term, necessary-a-posteriori, division-of-linguistic-labour, stereotype, family-resemblance, rigid-designator]
        key_ideas:
          - "Gold: atomic number is the one case where the theory's essence is exactly the science's — isotopes and ions of Au are all gold, and the periodic table is the expert in the division of labour"
          - "Water: 'H2O' names a molecule, 'water' names a substance that is a mixture of isotopologues and a self-ionising equilibrium; what 'same liquid' has to tolerate (heavy water, ice, steam, sea water) and where the theory already said so ('important' is interest-relative)"
          - "Jade (jadeite and nephrite) as the case the theory predicted it could not handle, and the counterfactual it supplied: had XYZ been plentiful here, 'water' would be like 'jade'"
          - "Species: the biological, phylogenetic and morphological species concepts disagree; ring species break transitivity; species are lineages, not kinds with a microstructure — the one place where the family-resemblance account outperforms the essence account"
          - "Which module results the check used: rigidity of kind terms, the necessary a posteriori, Twin Earth's 'same$_L$', stereotypes; where the idealisation departs: 'the hidden structure' is a theory's choice of what to count as same, and chemistry and biology make that choice differently"
        demo: null
        notes: "APPLICATION lesson (L16) for the module: the theory's own three examples checked against the sciences (research-shaped). Chemistry and species-concept sources (IUPAC, the biological species concept literature, LaPorte 2004) are not in the dossier; see research/sources.yaml. Putnam's own concessions (pp. 157–160) are on disk."

  # ---------------------------------------------------------------------
  - slug: after-1970
    title: "After 1970: a glance"
    outcomes: [co-chain, co-apply-tools, co-refutations]
    lessons:
      - slug: lewis-possible-worlds
        title: "Lewis: possible worlds and counterparts"
        type: core
        status: planned
        goal: "Explain Lewis's modal realism and counterpart theory, state the benefit claimed for taking possible worlds literally, and evaluate the Humphrey objection"
        opening: >-
          Kripke used possible worlds freely while insisting that they are stipulated — 'little more than the miniworlds of school probability blown large'. Lewis asked what makes a sentence about what might have been true, if not something, and answered: other worlds, as real as this one and spatially isolated from it, where a counterpart of you lost the election you won. Almost nobody believes it; almost everybody uses the semantics it was built to ground. The question is what the extravagant answer buys and what the cheaper answers fail to pay for.
        est_minutes: 24
        prerequisites: [kripke-rigid-designation]
        concepts:
          introduces: [modal-realism, counterpart-theory, ersatz-worlds]
          reinforces: [possible-worlds-stipulated, rigid-designator, necessity-of-identity, ontological-commitment]
        key_ideas:
          - "The semantics everyone uses: '$\\Box p$' is true iff $p$ is true at every world; the question Quine would ask of it — what are the values of the world variable?"
          - "Modal realism (1986): worlds are concrete, spatiotemporally isolated, and ours is one of them; the argument is Quine's own — the theory that quantifies over them is the simplest, so we are committed to them"
          - "Counterpart theory (1968): nothing exists in two worlds; 'Humphrey might have won' is true because a counterpart of his won; the formal defect (universal instantiation fails for modal properties) and the objection that Humphrey 'could not care less' what a counterpart does"
          - "The cheaper answers: ersatz worlds — maximal consistent sets of sentences, properties, states of the dice — and the price each pays (primitive modality, or alien properties)"
          - "What came of it: the metaphysics of modality as a field; what remained: the incredulous stare, and the suspicion that a stipulated world was all the semantics ever needed"
        demo: null
        notes: "Glance lesson: short by design. Lewis's own texts are not on disk (Counterpart Theory 1968; On the Plurality of Worlds 1986); Kripke n. 13 and the Preface, Putnam's critique of possible-worlds semantics, the IEP §5b and the MIT 24.244 take-home are the grounding. Flagged in research/sources.yaml."

      - slug: functionalism-and-its-objections
        title: "Mind as function: identity theory, functionalism and the modal objection"
        type: core
        status: planned
        goal: "Explain the identity theory and functionalism as successive answers to Ryle's problem, and reconstruct Kripke's modal argument against the identity of pain with a brain state"
        opening: >-
          Ryle removed the ghost but left the question of what pain is. Neuroscience offered an answer in the 1950s: pain is a brain process, as heat is molecular motion. Computers offered a different one a decade later: a mind is to its brain as software is to hardware, so the same pain could run on different matter. Then the account of rigid names raised an objection to the first answer that the second had hoped to avoid. The task is to state the three positions and the one argument, without settling a problem the tradition itself calls wide open.
        est_minutes: 26
        prerequisites: [ryle-category-mistake, necessary-a-posteriori]
        concepts:
          introduces: [identity-theory, functionalism, multiple-realizability, kripke-modal-argument]
          reinforces: [category-mistake, dispositional-analysis, necessary-a-posteriori, rigid-designator, outward-criteria]
        key_ideas:
          - "The identity theory (Place 1956, Smart 1959): pain is C-fibre firing as lightning is electrical discharge — a contingent identity, discovered, and the answer to Ryle's missing categorical base"
          - "Functionalism (Putnam 1967): a mental state is a role — caused by injury, causing avoidance and belief — realisable in neurons or silicon; the software/hardware picture, and Aristotle's 'the soul of an axe is cutting'"
          - "The modal objection (Kripke, Lecture III): 'pain' and 'C-fibre firing' are rigid, so if identical then necessarily so; the heat case had an appearance to explain the feeling of contingency away, and pain has no appearance distinct from itself; the God-creating-the-world argument"
          - "What functionalism answers and what it does not: multiple realisability defeats type identity but the role analysis makes being a pain contingent, which Kripke calls absurd; the Chinese room (1980) and the bat (1974) as the next two moves, named only"
          - "Where the tradition left it: 'the mind–body problem is wide open and extremely confusing' — a posteriori physicalism and analytic functionalism as the two live replies"
        demo: null
        notes: "Glance lesson. Grounded in Kripke pp. 144–155 (on disk), Magee's conversations with Putnam (software/hardware) and Searle (intentionality), Ayer Ch. 7; Place 1956, Smart 1959, Putnam 1967, Nagel 1974 and Searle 1980 are not on disk — see research/sources.yaml."

      - slug: rawls-original-position
        title: "Rawls: justice as fairness and the original position"
        type: core
        status: planned
        goal: "Explain the original position and the veil of ignorance as a method for deriving principles of justice, state the two principles, and evaluate the maximin step against expected-utility reasoning"
        opening: >-
          After emotivism, an argument about justice was supposed to be a disagreement of feeling dressed up as a disagreement of fact. In 1971 a six-hundred-page book argued for two specific principles of justice from a decision problem: which rules would you choose for a society if you did not know which position in it you would occupy? The method is a thought experiment with a decision rule inside it, and a mathematician will notice at once that the decision rule is not the one decision theory recommends. The task is to see how the argument runs and what hangs on that rule.
        est_minutes: 26
        prerequisites: [emotivism]
        concepts:
          introduces: [original-position, veil-of-ignorance, difference-principle, reflective-equilibrium, maximin]
          reinforces: [emotivism, non-cognitivism, open-question-argument]
        key_ideas:
          - "The original position: parties choosing principles behind a veil of ignorance about their talents, class, sex and conception of the good; justice as what would be agreed there — a contract without a signing"
          - "The two principles: equal basic liberties; inequalities only where attached to offices open to all and to the greatest benefit of the least advantaged (the difference principle); lexical priority of the first"
          - "Why maximin: the parties cannot assign probabilities to positions, the stakes are grave, and the floor matters more than the mean; Harsanyi's reply (1975): equiprobability plus expected utility yields average utilitarianism, and maximin is 'irrational' as a general rule"
          - "Reflective equilibrium: principles and considered judgements adjusted against each other until they fit — the method of analysis after Quine, borrowed from the justification of induction"
          - "Why it mattered: normative theory returned to philosophy a generation after emotivism; what refuted or reshaped it: Nozick's entitlement theory (1974), Sen on what is being equalised, the communitarian objection to the unencumbered self — named, not developed"
        demo: null
        notes: "Glance lesson. No Rawls, Harsanyi or Nozick text is in the dossier (A Theory of Justice §§3–4, 11–13, 24–26; Harsanyi 1975; Nozick 1974 Ch. 7) — see research/sources.yaml; the brief must be grounded from those once staged."

      - slug: parfit-personal-identity
        title: "Parfit: personal identity is not what matters"
        type: core
        status: planned
        goal: "Formulate Parfit's fission argument that personal identity is not what matters in survival, relate it to the bodily and memory criteria it displaces, and state the reductionist conclusion"
        opening: >-
          A teletransporter scans you, destroys the original, and builds an exact copy on Mars. Is the person on Mars you? Now suppose the machine malfunctions and builds two copies. They cannot both be you — identity is one–one — and there is no reason to pick either, so neither is. Yet each stands to you exactly as a single copy would have, and a single copy seemed as good as survival. Either the answer to 'will I survive?' is not what we care about, or something has gone wrong in the setup. The task is to find which.
        est_minutes: 26
        prerequisites: [private-language-argument]
        concepts:
          introduces: [psychological-continuity, fission, reductionism-about-persons, relation-r]
          reinforces: [logical-construction, outward-criteria, necessity-of-identity]
        key_ideas:
          - "The criteria on offer: bodily identity (the 1936 analysis: two experiences belong to one self iff they contain organic sense-contents of the same body), Locke's memory criterion and its circularity, and what 'I' names (PI §404)"
          - "Teletransportation and the spectrum cases; fission: identity is one–one and transitive, so a double success is a failure of identity — and nothing that matters is lost"
          - "Relation R: psychological connectedness and continuity, with any cause; identity is R with a one–one constraint added, and the constraint is what we should not care about"
          - "Reductionism: a person's existence just consists in a brain and body and a series of connected events; no 'further fact'; the self as a logical construction, said the way Russell and Ayer said it, with the ethics drawn out (the self-interest theory weakened)"
          - "What refuted or reshaped it: animalism (we are organisms, and the organism does not fission), four-dimensionalism (Lewis: two persons were there all along, sharing stages), the narrative self — named only"
        demo: null
        notes: "Glance lesson. Reasons and Persons Part III (§§75–90) is not in the dossier; Ayer Ch. 7 (on disk) supplies the bodily criterion and PI §404 the grammar of 'I'. See research/sources.yaml."

      - slug: gettier-problem
        title: "Gettier's three pages: the analytic paper as artefact"
        type: core
        status: planned
        goal: "Analyze Gettier's two counterexamples to the justified-true-belief account as a proof that three conditions are not jointly sufficient, identify the logical moves they borrow, and evaluate the role intuition plays as data"
        opening: >-
          Since Plato, knowledge had been analysed as belief that is true and justified. In 1963 a three-page note constructed two cases — a job applicant counting coins, a friend who may own a Ford — in which all three conditions hold and nobody would say the person knows. The note proposed no repair; sixty years of repairs followed. The task is to read the three pages as one reads a short proof: find the two lemmas it assumes, the inference rule that does the work in each case, and the step at which the argument stops being logic and appeals to what 'we' would say.
        est_minutes: 30
        prerequisites: [russell-theory-of-descriptions, verification-principle]
        concepts:
          introduces: [justified-true-belief, gettier-case, epistemic-closure]
          reinforces: [definite-description, scope, verification-principle, family-resemblance, truth-function]
        key_ideas:
          - "The artefact: Analysis 23.6, pp. 121–123 — the JTB schema (a) with Chisholm's and Ayer's variants, the two lemmas (justification is fallible; justification is closed under known entailment), two cases, one paragraph of conclusion"
          - "Case I read with Russell: 'the man who will get the job has ten coins in his pocket' is a quantified sentence true of Smith and justified by evidence about Jones — the description's attributive reading does the work"
          - "Case II read with Ayer: '$P \\vee Q$' is justified by $P$ and true by $Q$ — disjunction introduction, the same rule that let 'the Absolute is lazy' through the verification criterion in 1946"
          - "What the proof assumes and does not argue: 'it is equally clear that Smith does not know' — intuition as data; what came of it: fourth conditions (no false lemmas, causal, reliabilist, defeasibility), knowledge-first, and the experimental challenge to the intuition and its replication record"
          - "Which course results the reading used: analysis as necessary and sufficient conditions, descriptions, the truth-functional connectives; where the artefact departs: 'know' may be a family-resemblance term that no conjunction of conditions captures — the Wittgensteinian objection the paper never meets"
        demo: null
        notes: "APPLICATION lesson (L16) for the module and the course's closing artefact. The paper is on disk (research/texts/gettier.txt) and both printed pages are in research/images.yaml (source: figures). Weinberg–Nichols–Stich 2001 and the replication record (Machery et al. 2017) are not in the dossier; see research/sources.yaml."

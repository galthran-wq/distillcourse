<svg viewBox="0 0 640 296" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .frame { fill: none; stroke: currentColor; stroke-opacity: 0.25; stroke-width: 1; }
    .ghost { fill: none; stroke: currentColor; stroke-opacity: 0.45; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .bbox { fill: none; stroke: #4c8dd6; stroke-width: 1.6; }
    .abox { fill: none; stroke: #e2903a; stroke-width: 1.8; }
    .arrow { stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.3; fill: none; }
    .within { stroke: #e2903a; stroke-width: 1.6; fill: none; stroke-dasharray: 5 3; }
    .strike { stroke: #e2903a; stroke-width: 2.4; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor" fill-opacity="0.6"/>
    </marker>
    <marker id="ah-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#e2903a"/>
    </marker>
  </defs>

  <text class="label" x="320" y="22" text-anchor="middle" font-weight="600">'Unicorns do not exist': two analyses</text>

  <!-- left: first-level reading, struck out -->
  <g transform="translate(10,36)">
    <rect class="frame" x="0" y="0" width="300" height="224" rx="6"/>
    <text class="muted" x="150" y="22" text-anchor="middle">existence as a property of a thing</text>
    <rect x="70" y="44" width="160" height="30" rx="5" fill="none" stroke="currentColor" stroke-opacity="0.6"/>
    <text class="label" x="150" y="64" text-anchor="middle">( ) does not exist</text>
    <path class="arrow" d="M150 150 L150 80" marker-end="url(#ah)"/>
    <circle class="ghost" cx="150" cy="172" r="20"/>
    <text class="label" x="150" y="177" text-anchor="middle">?</text>
    <text class="muted" x="150" y="210" text-anchor="middle">which object falls under it?</text>
    <line class="strike" x1="40" y1="30" x2="260" y2="200"/>
  </g>

  <!-- right: second-level reading -->
  <g transform="translate(330,36)">
    <rect class="frame" x="0" y="0" width="300" height="224" rx="6"/>
    <text class="muted" x="150" y="22" text-anchor="middle">existence as a property of a concept</text>
    <rect class="abox" x="60" y="40" width="180" height="38" rx="5"/>
    <text class="label" x="150" y="56" text-anchor="middle">no object falls under ( )</text>
    <text class="amber" x="150" y="71" text-anchor="middle">second level</text>
    <path class="within" d="M150 136 L150 82" marker-end="url(#ah-a)"/>
    <rect class="bbox" x="80" y="138" width="140" height="30" rx="5"/>
    <text class="label" x="150" y="158" text-anchor="middle">( ) is a unicorn</text>
    <text class="blue" x="150" y="186" text-anchor="middle">first level</text>
    <text class="label" x="150" y="212" text-anchor="middle" font-size="15">¬∃x Ux</text>
  </g>

  <text class="muted" x="320" y="284" text-anchor="middle">the sentence is about a concept, and says that nothing falls under it</text>
</svg>

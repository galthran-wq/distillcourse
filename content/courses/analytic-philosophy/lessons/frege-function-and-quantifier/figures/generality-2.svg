<svg viewBox="0 0 640 236" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="14">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .bbox { fill: none; stroke: #4c8dd6; stroke-width: 1.8; }
    .aline { stroke: #e2903a; stroke-width: 2; }
    .rule { stroke: currentColor; stroke-opacity: 0.2; stroke-width: 1; }
  </style>
  <text class="muted" x="20" y="24">step 2 of 2 · 'something' in place of the name</text>
  <rect class="bbox" x="40" y="44" width="130" height="32" rx="4"/>
  <text class="blue" x="105" y="65" text-anchor="middle">something</text>
  <line class="aline" x1="180" y1="82" x2="330" y2="82"/>
  <text class="label" x="255" y="65" text-anchor="middle">is lighter than</text>
  <line class="aline" x1="340" y1="82" x2="500" y2="82"/>
  <text class="label" x="420" y="65" text-anchor="middle">carbon dioxide</text>
  <line class="rule" x1="20" y1="102" x2="620" y2="102"/>
  <text class="muted" x="20" y="130">function</text>
  <text class="blue" x="100" y="130">some object falls under ( )</text>
  <text class="muted" x="400" y="130">second-level concept</text>
  <text class="muted" x="20" y="158">argument</text>
  <text class="amber" x="100" y="158">( ) is lighter than carbon dioxide</text>
  <text class="muted" x="400" y="158">first-level concept</text>
  <text class="muted" x="20" y="192">written</text>
  <text class="label" x="100" y="192" font-size="16">∃x F(x)</text>
  <text class="muted" x="400" y="192">value:</text>
  <text class="label" x="444" y="192">the True</text>
  <text class="muted" x="20" y="224">the roles swap: the concept is now the argument, and no object fills a gap</text>
</svg>

<svg viewBox="0 0 640 352" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .tier { fill: currentColor; opacity: 0.55; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; }
    .box { fill: none; stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.2; }
    .abox { fill: none; stroke: #e2903a; stroke-width: 1.8; }
    .bbox { fill: none; stroke: #4c8dd6; stroke-width: 1.6; }
    .dot { fill: currentColor; }
    .under { stroke: #4c8dd6; stroke-width: 1.5; fill: none; }
    .within { stroke: #e2903a; stroke-width: 1.6; fill: none; stroke-dasharray: 5 3; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .rule { stroke: currentColor; stroke-opacity: 0.15; stroke-width: 1; }
  </style>
  <defs>
    <marker id="ah-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#4c8dd6"/>
    </marker>
    <marker id="ah-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#e2903a"/>
    </marker>
  </defs>

  <!-- tier labels -->
  <text class="tier" x="16" y="40">SECOND-LEVEL</text>
  <text class="tier" x="16" y="54">CONCEPTS</text>
  <text class="tier" x="16" y="150">FIRST-LEVEL</text>
  <text class="tier" x="16" y="164">CONCEPTS</text>
  <text class="tier" x="16" y="262">OBJECTS</text>
  <line class="rule" x1="16" y1="100" x2="624" y2="100"/>
  <line class="rule" x1="16" y1="212" x2="624" y2="212"/>

  <!-- second level -->
  <rect class="abox" x="120" y="26" width="150" height="38" rx="5"/>
  <text class="label" x="195" y="42" text-anchor="middle">some object falls</text>
  <text class="label" x="195" y="57" text-anchor="middle">under ( ) · ∃x φx</text>
  <rect class="abox" x="290" y="26" width="150" height="38" rx="5"/>
  <text class="label" x="365" y="42" text-anchor="middle">every object falls</text>
  <text class="label" x="365" y="57" text-anchor="middle">under ( ) · ∀x φx</text>
  <rect class="abox" x="460" y="26" width="160" height="38" rx="5"/>
  <text class="label" x="540" y="42" text-anchor="middle">no object falls</text>
  <text class="label" x="540" y="57" text-anchor="middle">under ( ) · ¬∃x φx</text>

  <!-- first level -->
  <rect class="bbox" x="130" y="138" width="130" height="30" rx="5"/>
  <text class="label" x="195" y="158" text-anchor="middle">( ) is a boy</text>
  <rect class="bbox" x="290" y="138" width="150" height="30" rx="5"/>
  <text class="label" x="365" y="158" text-anchor="middle">( ) is self-identical</text>
  <rect class="bbox" x="475" y="138" width="130" height="30" rx="5"/>
  <text class="label" x="540" y="158" text-anchor="middle">( ) is a unicorn</text>

  <!-- falls within: first-level up to second-level -->
  <path class="within" d="M195 136 L195 68" marker-end="url(#ah-a)"/>
  <path class="within" d="M365 136 L365 68" marker-end="url(#ah-a)"/>
  <path class="within" d="M540 136 L540 68" marker-end="url(#ah-a)"/>
  <path class="under" d="M365 252 L365 172" marker-end="url(#ah-b)"/>

  <!-- objects -->
  <circle class="dot" cx="150" cy="258" r="4"/><text class="label" x="150" y="280" text-anchor="middle">b₁</text>
  <circle class="dot" cx="240" cy="258" r="4"/><text class="label" x="240" y="280" text-anchor="middle">b₂</text>
  <circle class="dot" cx="365" cy="258" r="4"/><text class="label" x="365" y="280" text-anchor="middle">the Moon</text>
  <text class="muted" x="540" y="262" text-anchor="middle">no object here</text>

  <!-- falls under: objects up to first-level -->
  <path class="under" d="M152 252 L185 172" marker-end="url(#ah-b)"/>
  <path class="under" d="M238 252 L205 172" marker-end="url(#ah-b)"/>

  <!-- legend -->
  <line class="under" x1="120" y1="318" x2="160" y2="318"/>
  <text class="blue" x="168" y="322">falls under</text>
  <text class="muted" x="270" y="322">object → first-level concept</text>
  <line class="within" x1="120" y1="338" x2="160" y2="338"/>
  <text class="amber" x="168" y="342">falls within</text>
  <text class="muted" x="270" y="342">first-level concept → second-level concept</text>
</svg>

<svg viewBox="0 0 640 268" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .stroke { stroke: currentColor; stroke-width: 2; fill: none; }
    .a-stroke { stroke: #e2903a; stroke-width: 2.4; fill: none; }
    .b-stroke { stroke: #4c8dd6; stroke-width: 2.4; fill: none; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .guide { stroke: currentColor; stroke-opacity: 0.4; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
    .rule { stroke: currentColor; stroke-opacity: 0.2; stroke-width: 1; }
    .frak { font-family: "UnifrakturMaguntia", "Old English Text MT", serif; font-style: italic; }
  </style>

  <text class="muted" x="20" y="22">the 1879 concept-script</text>

  <!-- judgement stroke and content stroke -->
  <line class="stroke" x1="60" y1="64" x2="60" y2="100"/>
  <line class="stroke" x1="60" y1="82" x2="130" y2="82"/>
  <!-- concavity with its letter -->
  <path class="a-stroke" d="M130 82 Q145 98 160 82"/>
  <text class="amber" x="145" y="72" text-anchor="middle" font-size="15">𝔞</text>
  <line class="stroke" x1="160" y1="82" x2="240" y2="82"/>
  <!-- condition stroke: top line goes on to the consequent, branch down to the antecedent -->
  <line class="stroke" x1="240" y1="82" x2="300" y2="82"/>
  <line class="b-stroke" x1="240" y1="82" x2="240" y2="132"/>
  <line class="stroke" x1="240" y1="132" x2="300" y2="132"/>
  <text class="label" x="308" y="87" font-size="16">G(𝔞)</text>
  <text class="label" x="308" y="137" font-size="16">F(𝔞)</text>

  <!-- annotations -->
  <path class="guide" d="M60 104 L60 168"/>
  <text class="muted" x="40" y="184">judgement stroke:</text>
  <text class="muted" x="40" y="199">this is asserted</text>
  <path class="guide" d="M145 92 L170 168"/>
  <text class="amber" x="160" y="184" font-size="12">concavity: every 𝔞</text>
  <text class="muted" x="160" y="199">generality, binding 𝔞</text>
  <path class="guide" d="M240 136 L300 168"/>
  <text class="blue" x="290" y="184" font-size="12">condition stroke</text>
  <text class="muted" x="290" y="199">the lower line is the condition,</text>
  <text class="muted" x="290" y="214">the upper line what follows</text>

  <!-- modern equivalent -->
  <line class="rule" x1="440" y1="40" x2="440" y2="230"/>
  <text class="muted" x="460" y="22">the same content today</text>
  <text class="label" x="460" y="112" font-size="18"><tspan class="amber">∀x</tspan>(Fx <tspan class="blue">→</tspan> Gx)</text>
  <text class="muted" x="460" y="140">read left to right;</text>
  <text class="muted" x="460" y="155">scope shown by brackets,</text>
  <text class="muted" x="460" y="170">not by position on the page</text>

  <text class="muted" x="20" y="252">'every F is G' as a two-dimensional drawing (left) and as a line of symbols (right)</text>
</svg>

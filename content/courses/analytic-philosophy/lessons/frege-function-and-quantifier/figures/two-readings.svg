<svg viewBox="0 0 640 316" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .node { fill: none; stroke: currentColor; stroke-opacity: 0.7; stroke-width: 1.2; }
    .hot { fill: none; stroke: #e2903a; stroke-width: 2.2; }
    .arrow { stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.3; fill: none; }
    .arrow-a { stroke: #e2903a; stroke-width: 1.6; fill: none; }
    .frame { fill: none; stroke: currentColor; stroke-opacity: 0.25; stroke-width: 1; }
    .yes { fill: #5aa46a; font-weight: 600; }
    .no { fill: #e2903a; font-weight: 600; }
    .amber { fill: #e2903a; font-weight: 600; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor" fill-opacity="0.6"/>
    </marker>
    <marker id="ah-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#e2903a"/>
    </marker>
  </defs>

  <!-- left panel: each boy loves his own girl -->
  <g transform="translate(10,0)">
    <rect class="frame" x="0" y="8" width="300" height="300" rx="6"/>
    <text class="label" x="150" y="30" text-anchor="middle" font-weight="600">Model 1: each boy loves a different girl</text>
    <text class="muted" x="60" y="56" text-anchor="middle">boys</text>
    <text class="muted" x="240" y="56" text-anchor="middle">girls</text>
    <circle class="node" cx="60" cy="86" r="16"/><text class="label" x="60" y="91" text-anchor="middle">b₁</text>
    <circle class="node" cx="60" cy="140" r="16"/><text class="label" x="60" y="145" text-anchor="middle">b₂</text>
    <circle class="node" cx="60" cy="194" r="16"/><text class="label" x="60" y="199" text-anchor="middle">b₃</text>
    <circle class="node" cx="240" cy="86" r="16"/><text class="label" x="240" y="91" text-anchor="middle">g₁</text>
    <circle class="node" cx="240" cy="140" r="16"/><text class="label" x="240" y="145" text-anchor="middle">g₂</text>
    <circle class="node" cx="240" cy="194" r="16"/><text class="label" x="240" y="199" text-anchor="middle">g₃</text>
    <path class="arrow" d="M78 86 L220 86" marker-end="url(#ah)"/>
    <path class="arrow" d="M78 140 L220 140" marker-end="url(#ah)"/>
    <path class="arrow" d="M78 194 L220 194" marker-end="url(#ah)"/>
    <text class="label" x="20" y="250">∀x(Bx → ∃y(Gy ∧ Lxy))</text>
    <text class="yes" x="280" y="250" text-anchor="end">true</text>
    <text class="label" x="20" y="280">∃y(Gy ∧ ∀x(Bx → Lxy))</text>
    <text class="no" x="280" y="280" text-anchor="end">false</text>
  </g>

  <!-- right panel: one girl loved by all -->
  <g transform="translate(330,0)">
    <rect class="frame" x="0" y="8" width="300" height="300" rx="6"/>
    <text class="label" x="150" y="30" text-anchor="middle" font-weight="600">Model 2: one girl is loved by every boy</text>
    <text class="muted" x="60" y="56" text-anchor="middle">boys</text>
    <text class="muted" x="240" y="56" text-anchor="middle">girls</text>
    <circle class="node" cx="60" cy="86" r="16"/><text class="label" x="60" y="91" text-anchor="middle">b₁</text>
    <circle class="node" cx="60" cy="140" r="16"/><text class="label" x="60" y="145" text-anchor="middle">b₂</text>
    <circle class="node" cx="60" cy="194" r="16"/><text class="label" x="60" y="199" text-anchor="middle">b₃</text>
    <circle class="node" cx="240" cy="86" r="16"/><text class="label" x="240" y="91" text-anchor="middle">g₁</text>
    <circle class="hot" cx="240" cy="140" r="16"/><text class="amber" x="240" y="145" text-anchor="middle">g₂</text>
    <circle class="node" cx="240" cy="194" r="16"/><text class="label" x="240" y="199" text-anchor="middle">g₃</text>
    <path class="arrow-a" d="M78 90 L221 136" marker-end="url(#ah-a)"/>
    <path class="arrow-a" d="M78 140 L220 140" marker-end="url(#ah-a)"/>
    <path class="arrow-a" d="M78 190 L221 144" marker-end="url(#ah-a)"/>
    <path class="arrow" d="M77 100 L222 186" marker-end="url(#ah)"/>
    <text class="label" x="20" y="250">∀x(Bx → ∃y(Gy ∧ Lxy))</text>
    <text class="yes" x="280" y="250" text-anchor="end">true</text>
    <text class="label" x="20" y="280">∃y(Gy ∧ ∀x(Bx → Lxy))</text>
    <text class="yes" x="280" y="280" text-anchor="end">true</text>
  </g>
</svg>

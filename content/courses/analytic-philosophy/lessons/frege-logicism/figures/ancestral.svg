<svg viewBox="0 0 640 220" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; font-size: 15px; font-weight: 600; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .dot { fill: currentColor; }
    .rel { stroke: #4c8dd6; stroke-width: 1.8; fill: none; }
    .blue { fill: #4c8dd6; font-size: 12px; font-weight: 600; }
    .region { fill: #e2903a; fill-opacity: 0.12; stroke: #e2903a; stroke-width: 1.8; }
    .amber { fill: #e2903a; font-weight: 600; }
    .guide { stroke: currentColor; stroke-opacity: 0.45; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
  </style>
  <defs>
    <marker id="ah-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#4c8dd6"/>
    </marker>
  </defs>

  <!-- the hereditary region F: holds b, c, d, not a -->
  <rect class="region" x="200" y="62" width="400" height="76" rx="30"/>
  <text class="amber" x="586" y="56" text-anchor="end">F</text>

  <!-- the chain -->
  <circle class="dot" cx="90" cy="100" r="6"/><text class="label" x="90" y="128" text-anchor="middle">a</text>
  <circle class="dot" cx="250" cy="100" r="6"/><text class="label" x="250" y="128" text-anchor="middle">b</text>
  <circle class="dot" cx="400" cy="100" r="6"/><text class="label" x="400" y="128" text-anchor="middle">c</text>
  <circle class="dot" cx="550" cy="100" r="6"/><text class="label" x="550" y="128" text-anchor="middle">d</text>

  <path class="rel" d="M98 100 L240 100" marker-end="url(#ah-b)"/>
  <path class="rel" d="M258 100 L390 100" marker-end="url(#ah-b)"/>
  <path class="rel" d="M408 100 L540 100" marker-end="url(#ah-b)"/>
  <text class="blue" x="145" y="92" text-anchor="middle">father of</text>
  <text class="blue" x="325" y="92" text-anchor="middle">father of</text>
  <text class="blue" x="475" y="92" text-anchor="middle">father of</text>

  <!-- annotations -->
  <path class="guide" d="M250 140 L250 172"/>
  <text class="muted" x="250" y="186" text-anchor="middle">1. F holds of every child of a</text>
  <path class="guide" d="M475 140 L475 194"/>
  <text class="muted" x="475" y="208" text-anchor="middle">2. no 'father of' arrow leads out of F</text>
  <text class="muted" x="550" y="34" text-anchor="middle">3. so F holds of d</text>
  <path class="guide" d="M550 40 L550 88"/>
</svg>

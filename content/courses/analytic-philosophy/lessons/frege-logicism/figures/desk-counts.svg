<svg viewBox="0 0 600 225" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .cover { fill: none; stroke: currentColor; stroke-opacity: 0.45; stroke-width: 1.3; }
    .faint { stroke: currentColor; stroke-opacity: 0.3; stroke-width: 1; }
    .hcover { fill: none; stroke: #e2903a; stroke-width: 2.4; }
    .hline { stroke: #e2903a; stroke-width: 2; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .count { fill: #e2903a; font-weight: 700; font-size: 20px; }
  </style>

  <!-- panel 1: the book as one book -->
  <g transform="translate(30,30)">
    <rect class="hcover" x="10" y="0" width="140" height="90" rx="4"/>
    <line class="faint" x1="24" y1="18" x2="136" y2="18"/>
    <line class="faint" x1="24" y1="30" x2="126" y2="30"/>
    <line class="faint" x1="24" y1="42" x2="132" y2="42"/>
    <line class="faint" x1="24" y1="54" x2="110" y2="54"/>
    <line class="faint" x1="16" y1="72" x2="144" y2="72"/>
    <line class="faint" x1="16" y1="77" x2="144" y2="77"/>
    <line class="faint" x1="16" y1="82" x2="144" y2="82"/>
    <text class="muted" x="80" y="124" text-anchor="middle">counted under</text>
    <text class="blue" x="80" y="144" text-anchor="middle">book on this desk</text>
    <text class="count" x="80" y="182" text-anchor="middle">1</text>
  </g>

  <!-- panel 2: the same book, pages highlighted -->
  <g transform="translate(220,30)">
    <rect class="cover" x="10" y="0" width="140" height="90" rx="4"/>
    <line class="faint" x1="24" y1="18" x2="136" y2="18"/>
    <line class="faint" x1="24" y1="30" x2="126" y2="30"/>
    <line class="faint" x1="24" y1="42" x2="132" y2="42"/>
    <line class="faint" x1="24" y1="54" x2="110" y2="54"/>
    <line class="hline" x1="16" y1="72" x2="144" y2="72"/>
    <line class="hline" x1="16" y1="77" x2="144" y2="77"/>
    <line class="hline" x1="16" y1="82" x2="144" y2="82"/>
    <text class="muted" x="80" y="124" text-anchor="middle">counted under</text>
    <text class="blue" x="80" y="144" text-anchor="middle">page of this book</text>
    <text class="count" x="80" y="182" text-anchor="middle">150</text>
  </g>

  <!-- panel 3: the same book, words highlighted -->
  <g transform="translate(410,30)">
    <rect class="cover" x="10" y="0" width="140" height="90" rx="4"/>
    <line class="hline" x1="24" y1="18" x2="44" y2="18"/><line class="hline" x1="50" y1="18" x2="78" y2="18"/><line class="hline" x1="84" y1="18" x2="104" y2="18"/><line class="hline" x1="110" y1="18" x2="136" y2="18"/>
    <line class="hline" x1="24" y1="30" x2="58" y2="30"/><line class="hline" x1="64" y1="30" x2="84" y2="30"/><line class="hline" x1="90" y1="30" x2="126" y2="30"/>
    <line class="hline" x1="24" y1="42" x2="40" y2="42"/><line class="hline" x1="46" y1="42" x2="88" y2="42"/><line class="hline" x1="94" y1="42" x2="132" y2="42"/>
    <line class="hline" x1="24" y1="54" x2="66" y2="54"/><line class="hline" x1="72" y1="54" x2="110" y2="54"/>
    <line class="faint" x1="16" y1="72" x2="144" y2="72"/>
    <line class="faint" x1="16" y1="77" x2="144" y2="77"/>
    <line class="faint" x1="16" y1="82" x2="144" y2="82"/>
    <text class="muted" x="80" y="124" text-anchor="middle">counted under</text>
    <text class="blue" x="80" y="144" text-anchor="middle">word in this book</text>
    <text class="count" x="80" y="182" text-anchor="middle">38,000</text>
  </g>

</svg>

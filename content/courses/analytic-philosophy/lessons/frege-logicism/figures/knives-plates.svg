<svg viewBox="0 0 640 240" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .plate { fill: none; stroke: currentColor; stroke-opacity: 0.7; stroke-width: 1.4; }
    .rim { fill: none; stroke: currentColor; stroke-opacity: 0.3; stroke-width: 1; }
    .knife { fill: none; stroke: currentColor; stroke-opacity: 0.7; stroke-width: 1.4; }
    .pair { fill: none; stroke: #4c8dd6; stroke-width: 1.8; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .amber { fill: #e2903a; font-weight: 700; }
    .f { font-family: "STIX Two Math", "Cambria Math", "Times New Roman", serif; font-size: 22px; fill: #e2903a; }
  </style>
  <defs>
    <marker id="ah-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#4c8dd6"/>
    </marker>
    <g id="setting">
      <circle class="plate" cx="0" cy="0" r="24"/>
      <circle class="rim" cx="0" cy="0" r="15"/>
      <rect class="knife" x="34" y="-26" width="7" height="52" rx="3"/>
      <path class="pair" d="M0 30 Q18 50 37 32" marker-end="url(#ah-b)"/>
    </g>
  </defs>

  <use href="#setting" x="50" y="70"/>
  <use href="#setting" x="135" y="70"/>
  <use href="#setting" x="220" y="70"/>
  <use href="#setting" x="305" y="70"/>
  <use href="#setting" x="390" y="70"/>

  <text class="label" x="30" y="148">F: plate on the table</text>
  <text class="label" x="30" y="168">G: knife on the table</text>
  <text class="blue" x="30" y="190">R: lies immediately to the right of</text>
  <text class="muted" x="30" y="214">every plate has a knife R-paired with it, every knife a plate; no sharing</text>

  <text class="muted" x="560" y="56" text-anchor="middle">no counting, yet</text>
  <text class="f" x="560" y="90" text-anchor="middle">#F = #G</text>
</svg>

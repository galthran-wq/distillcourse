<svg viewBox="0 0 640 230" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .box { fill: none; stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.3; }
    .sub { fill: none; stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .dot { fill: currentColor; }
    .bdot { fill: #4c8dd6; }
    .f { font-family: "STIX Two Math", "Cambria Math", "Times New Roman", serif; font-size: 18px; fill: currentColor; }
    .fa { fill: #e2903a; font-weight: 700; }
    .fb { fill: #4c8dd6; }
    .num { font-family: "STIX Two Math", "Cambria Math", "Times New Roman", serif; font-size: 26px; fill: #e2903a; font-weight: 700; }
    .tag { fill: currentColor; opacity: 0.55; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; }
  </style>
  <text class="tag" x="40" y="22">CONCEPT</text>
  <text class="tag" x="400" y="22">ITS NUMBER</text>
  <rect class="box" x="40" y="32" width="300" height="130" rx="6"/>
  <text class="f" x="54" y="58">x = 0 ∨ x = 1</text>
  <circle class="dot" cx="150" cy="105" r="6"/><text class="label" x="150" y="132" text-anchor="middle">0</text>
  <circle class="dot" cx="230" cy="105" r="6"/><text class="label" x="230" y="132" text-anchor="middle">1</text>
  <text class="f" x="400" y="100">#[x = 0 ∨ x = 1] = <tspan class="fa">2</tspan></text>
  <text class="muted" x="40" y="196">two objects under it, because 0 ≠ 1</text>
</svg>

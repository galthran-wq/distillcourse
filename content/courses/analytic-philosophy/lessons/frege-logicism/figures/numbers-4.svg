<svg viewBox="0 0 640 230" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .box { fill: none; stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.3; }
    .sub { fill: none; stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .dot { fill: currentColor; }
    .bdot { fill: #4c8dd6; }
    .f { font-family: "STIX Two Math", "Cambria Math", "Times New Roman", serif; font-size: 18px; fill: currentColor; }
    .fa { fill: #e2903a; font-weight: 700; }
    .fb { fill: #4c8dd6; }
    .num { font-family: "STIX Two Math", "Cambria Math", "Times New Roman", serif; font-size: 26px; fill: #e2903a; font-weight: 700; }
    .tag { fill: currentColor; opacity: 0.55; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; }
  </style>
  <text class="tag" x="40" y="22">CONCEPT</text>
  <text class="tag" x="400" y="22">ITS NUMBER</text>
  <rect class="box" x="40" y="32" width="300" height="130" rx="6"/>
  <text class="f" x="54" y="58">F</text>
  <rect class="sub" x="70" y="76" width="170" height="70" rx="5"/>
  <text class="f" x="78" y="94" style="font-size:14px">Fx ∧ x ≠ a</text>
  <circle class="dot" cx="110" cy="105" r="6"/><text class="label" x="110" y="132" text-anchor="middle"></text>
  <circle class="dot" cx="160" cy="105" r="6"/><text class="label" x="160" y="132" text-anchor="middle"></text>
  <circle class="dot" cx="205" cy="105" r="6"/><text class="label" x="205" y="132" text-anchor="middle"></text>
  <circle class="bdot" cx="290" cy="105" r="6"/><text class="fb" x="290" y="132" text-anchor="middle">a</text>
  <text class="f" x="400" y="72">n = #F</text>
  <text class="f" x="400" y="104">m = #[Fx ∧ x ≠ a]</text>
  <text class="f" x="400" y="140"><tspan class="fa">P(m, n)</tspan></text>
  <text class="muted" x="40" y="196">remove one object that falls under F: the number of what is left immediately precedes #F</text>
</svg>

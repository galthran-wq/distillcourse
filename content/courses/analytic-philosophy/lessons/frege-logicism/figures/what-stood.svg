<svg viewBox="0 0 640 250" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; font-weight: 600; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .dead { fill: none; stroke: currentColor; stroke-opacity: 0.4; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .deadtxt { fill: currentColor; opacity: 0.45; font-weight: 600; }
    .strike { stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.6; }
    .live { fill: none; stroke: #4c8dd6; stroke-width: 1.6; }
    .subj { fill: none; stroke: #e2903a; stroke-width: 2; }
    .amber { fill: #e2903a; font-weight: 700; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .arrow { stroke: currentColor; stroke-opacity: 0.7; stroke-width: 1.5; fill: none; }
    .deadarrow { stroke: currentColor; stroke-opacity: 0.35; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .q { fill: none; stroke: #4c8dd6; stroke-width: 1.2; stroke-dasharray: 5 4; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor" fill-opacity="0.7"/>
    </marker>
  </defs>

  <!-- Basic Law V: fell -->
  <rect class="dead" x="20" y="60" width="150" height="56" rx="6"/>
  <text class="deadtxt" x="95" y="84" text-anchor="middle">Basic Law V</text>
  <text class="muted" x="95" y="102" text-anchor="middle">inconsistent (1902)</text>
  <line class="strike" x1="34" y1="80" x2="156" y2="80"/>
  <path class="deadarrow" d="M172 88 L218 88" marker-end="url(#ah)"/>
  <text class="muted" x="195" y="78" text-anchor="middle">proved</text>

  <!-- Hume's principle -->
  <rect class="live" x="222" y="60" width="180" height="56" rx="6"/>
  <text class="blue" x="312" y="84" text-anchor="middle">Hume's principle</text>
  <text class="muted" x="312" y="102" text-anchor="middle">#F = #G ↔ F ≈ G</text>

  <!-- definitions + second-order logic -->
  <rect class="live" x="222" y="150" width="180" height="56" rx="6"/>
  <text class="blue" x="312" y="174" text-anchor="middle">definitions of 0, P, Nat</text>
  <text class="muted" x="312" y="192" text-anchor="middle">in second-order logic</text>

  <!-- Peano -->
  <rect class="subj" x="470" y="100" width="150" height="62" rx="6"/>
  <text class="amber" x="545" y="128" text-anchor="middle">Peano axioms</text>
  <text class="muted" x="545" y="146" text-anchor="middle">all of arithmetic</text>
  <path class="arrow" d="M404 92 L466 120" marker-end="url(#ah)"/>
  <path class="arrow" d="M404 176 L466 146" marker-end="url(#ah)"/>

  <!-- open question -->
  <rect class="q" x="200" y="10" width="224" height="34" rx="6"/>
  <text class="blue" x="312" y="32" text-anchor="middle">is Hume's principle logic?</text>
  <line class="q" x1="312" y1="44" x2="312" y2="58"/>

  <text class="muted" x="20" y="236">what the letter of 16 June 1902 removed</text>
  <text class="muted" x="620" y="236" text-anchor="end">what stands without it</text>
</svg>

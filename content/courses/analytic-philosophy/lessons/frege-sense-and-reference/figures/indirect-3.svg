<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .bold { fill: currentColor; font-weight: 600; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .an { fill: none; stroke: #e2903a; stroke-width: 1.5; }
    .bn { fill: none; stroke: #4c8dd6; stroke-width: 1.5; }
    .gn { fill: none; stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.2; }
    .aa { stroke: #e2903a; stroke-width: 1.8; fill: none; }
    .ba { stroke: #4c8dd6; stroke-width: 1.8; fill: none; }
  </style>
  <defs>
    <marker id="ah-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e2903a"/></marker>
    <marker id="ah-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4c8dd6"/></marker>
  </defs>

  <rect x="16" y="26" width="608" height="48" rx="6" fill="#e2903a" fill-opacity="0.08" stroke="#e2903a" stroke-width="1.6"/>
  <text class="amber" x="30" y="56">John believes that</text>
  <text class="bold" x="190" y="56" font-size="15">Mark Twain</text>
  <text class="label" x="290" y="56" font-size="15">wrote Huckleberry Finn</text>

  <path class="aa" d="M225 66 L130 196" marker-end="url(#ah-a)"/>
  <text class="amber" x="190" y="134">refers to</text>

  <rect class="an" x="30" y="200" width="180" height="44" rx="6"/>
  <text class="amber" x="120" y="219" text-anchor="middle">sense of 'Mark Twain'</text>
  <text class="muted" x="120" y="236" text-anchor="middle">the author of this novel</text>
  <text class="muted" x="238" y="227" text-anchor="middle" font-size="16">≠</text>
  <rect class="gn" x="266" y="200" width="180" height="44" rx="6"/>
  <text class="label" x="356" y="219" text-anchor="middle">sense of 'Samuel Clemens'</text>
  <text class="muted" x="356" y="236" text-anchor="middle">the man in the survey</text>
  <rect class="bn" x="470" y="200" width="150" height="44" rx="6"/>
  <text class="blue" x="545" y="219" text-anchor="middle">the man</text>
  <text class="muted" x="545" y="236" text-anchor="middle">born 1835 in Missouri</text>

  <text class="label" x="320" y="286" text-anchor="middle">may replace 'Mark Twain' here: only an expression with the same sense</text>
</svg>

<svg viewBox="0 0 640 290" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .side { fill: none; stroke: currentColor; stroke-opacity: 0.7; stroke-width: 1.4; }
    .mb { stroke: currentColor; stroke-width: 1.6; }
    .ma { stroke: #e2903a; stroke-width: 2; }
    .mc { stroke: #4c8dd6; stroke-width: 2; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .bold { fill: currentColor; font-weight: 600; }
    .abox { fill: none; stroke: #e2903a; stroke-width: 1.6; }
    .bbox { fill: none; stroke: #4c8dd6; stroke-width: 1.6; }
    .ptr { fill: none; stroke-width: 1.2; stroke-dasharray: 4 3; }
  </style>

  <!-- triangle -->
  <polygon class="side" points="40,250 360,250 210,40"/>
  <!-- medians: a from left vertex, b from right vertex, c from top vertex -->
  <line class="ma" x1="40" y1="250" x2="285" y2="145"/>
  <line class="mb" x1="360" y1="250" x2="125" y2="145"/>
  <line class="mc" x1="210" y1="40" x2="200" y2="250"/>
  <circle cx="203.3" cy="180" r="4.5" fill="currentColor"/>

  <text class="amber" x="82" y="222">a</text>
  <text class="bold" x="318" y="222">b</text>
  <text class="blue" x="214" y="92">c</text>
  <text class="muted" x="200" y="274" text-anchor="middle">each line joins a corner to the midpoint of the opposite side</text>

  <!-- the two names -->
  <rect class="abox" x="410" y="70" width="210" height="44" rx="5"/>
  <text class="amber" x="515" y="90" text-anchor="middle">the intersection of a and b</text>
  <text class="muted" x="515" y="106" text-anchor="middle">one way of being given</text>
  <rect class="bbox" x="410" y="186" width="210" height="44" rx="5"/>
  <text class="blue" x="515" y="206" text-anchor="middle">the intersection of b and c</text>
  <text class="muted" x="515" y="222" text-anchor="middle">another way of being given</text>
  <path class="ptr" stroke="#e2903a" d="M410 100 L212 176"/>
  <path class="ptr" stroke="#4c8dd6" d="M410 202 L212 183"/>
  <text class="label" x="515" y="156" text-anchor="middle">one point</text>
</svg>

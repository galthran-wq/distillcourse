<svg viewBox="0 0 640 230" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .bold { fill: currentColor; font-weight: 600; }
    .amber { fill: #e2903a; font-weight: 600; }
    .an { fill: none; stroke: #e2903a; stroke-width: 1.5; }
    .ghost { fill: none; stroke: currentColor; stroke-opacity: 0.45; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .aa { stroke: #e2903a; stroke-width: 1.5; fill: none; }
    .da { stroke: currentColor; stroke-opacity: 0.45; stroke-width: 1.3; fill: none; stroke-dasharray: 4 3; }
  </style>
  <defs>
    <marker id="ah-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e2903a"/></marker>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="currentColor" fill-opacity="0.45"/></marker>
  </defs>

  <text class="muted" x="110" y="20" text-anchor="middle">expression</text>
  <text class="amber" x="350" y="20" text-anchor="middle">sense</text>
  <text class="muted" x="560" y="20" text-anchor="middle">reference</text>

  <g transform="translate(0,34)">
    <text class="bold" x="110" y="28" text-anchor="middle">'Odysseus'</text>
    <path class="aa" d="M214 24 L252 24" marker-end="url(#ah-a)"/>
    <rect class="an" x="256" y="6" width="188" height="34" rx="17"/>
    <text class="label" x="350" y="28" text-anchor="middle">grasped by every reader</text>
    <path class="da" d="M448 24 L536 24" marker-end="url(#ah)"/>
    <circle class="ghost" cx="560" cy="24" r="18"/>
    <text class="muted" x="560" y="28" text-anchor="middle">?</text>
  </g>
  <g transform="translate(0,96)">
    <text class="bold" x="110" y="20" text-anchor="middle">'the least rapidly</text>
    <text class="bold" x="110" y="36" text-anchor="middle">convergent series'</text>
    <path class="aa" d="M214 24 L252 24" marker-end="url(#ah-a)"/>
    <rect class="an" x="256" y="6" width="188" height="34" rx="17"/>
    <text class="label" x="350" y="28" text-anchor="middle">fully understood</text>
    <path class="da" d="M448 24 L536 24" marker-end="url(#ah)"/>
    <circle class="ghost" cx="560" cy="24" r="18"/>
    <text class="muted" x="560" y="28" text-anchor="middle">none</text>
  </g>
  <g transform="translate(0,158)">
    <text class="bold" x="110" y="20" text-anchor="middle">'the present</text>
    <text class="bold" x="110" y="36" text-anchor="middle">King of France'</text>
    <path class="aa" d="M214 24 L252 24" marker-end="url(#ah-a)"/>
    <rect class="an" x="256" y="6" width="188" height="34" rx="17"/>
    <text class="label" x="350" y="28" text-anchor="middle">fully understood</text>
    <path class="da" d="M448 24 L536 24" marker-end="url(#ah)"/>
    <circle class="ghost" cx="560" cy="24" r="18"/>
    <text class="muted" x="560" y="28" text-anchor="middle">none</text>
  </g>
</svg>

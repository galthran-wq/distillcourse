<svg viewBox="0 0 640 250" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .frame { fill: none; stroke: currentColor; stroke-opacity: 0.25; stroke-width: 1; }
    .rule { stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.2; }
    .hl { fill: #e2903a; fill-opacity: 0.18; }
    .amber { fill: #e2903a; font-weight: 600; }
    .green { fill: #5aa46a; font-weight: 600; }
  </style>

  <rect class="frame" x="10" y="10" width="300" height="196" rx="6"/>
  <text class="muted" x="30" y="36">premise</text>
  <text class="label" x="30" y="58">Mark Twain was an author.</text>
  <text class="muted" x="30" y="86">premise</text>
  <text class="label" x="30" y="108">Mark Twain = Samuel Clemens.</text>
  <line class="rule" x1="30" y1="124" x2="290" y2="124"/>
  <text class="muted" x="30" y="146">conclusion</text>
  <text class="label" x="30" y="168">Samuel Clemens was an author.</text>
  <text class="green" x="160" y="232" text-anchor="middle">valid: substitution holds</text>

  <rect class="frame" x="330" y="10" width="300" height="196" rx="6"/>
  <rect class="hl" x="346" y="44" width="124" height="20" rx="3"/>
  <rect class="hl" x="346" y="154" width="124" height="20" rx="3"/>
  <text class="muted" x="350" y="36">premise</text>
  <text class="label" x="350" y="58"><tspan class="amber">John believes that</tspan> Mark Twain</text>
  <text class="label" x="350" y="74">wrote Huckleberry Finn.</text>
  <text class="muted" x="350" y="96">premise</text>
  <text class="label" x="350" y="114">Mark Twain = Samuel Clemens.</text>
  <line class="rule" x1="350" y1="128" x2="610" y2="128"/>
  <text class="muted" x="350" y="148">conclusion</text>
  <text class="label" x="350" y="168"><tspan class="amber">John believes that</tspan> Samuel Clemens</text>
  <text class="label" x="350" y="184">wrote Huckleberry Finn.</text>
  <text class="amber" x="480" y="232" text-anchor="middle">invalid: substitution fails</text>
</svg>

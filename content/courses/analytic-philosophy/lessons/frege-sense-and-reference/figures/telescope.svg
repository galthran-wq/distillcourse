<svg viewBox="0 0 640 230" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .bold { fill: currentColor; font-weight: 600; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .tube { fill: none; stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.4; }
    .ray { stroke: currentColor; stroke-opacity: 0.35; stroke-width: 1; stroke-dasharray: 4 3; }
  </style>

  <!-- the Moon -->
  <circle cx="60" cy="90" r="30" fill="none" stroke="currentColor" stroke-width="1.8"/>
  <text class="bold" x="60" y="146" text-anchor="middle">the Moon</text>
  <text class="muted" x="60" y="164" text-anchor="middle">reference</text>

  <line class="ray" x1="92" y1="78" x2="190" y2="78"/>
  <line class="ray" x1="92" y1="102" x2="190" y2="102"/>

  <!-- telescope: objective lens and the real image inside the tube -->
  <rect class="tube" x="190" y="64" width="250" height="52" rx="3"/>
  <ellipse cx="196" cy="90" rx="6" ry="24" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <circle cx="330" cy="90" r="12" fill="none" stroke="#e2903a" stroke-width="2"/>
  <text class="amber" x="330" y="146" text-anchor="middle">the image inside the telescope</text>
  <text class="muted" x="330" y="164" text-anchor="middle">sense</text>
  <text class="muted" x="330" y="184" text-anchor="middle">one-sided, depends on where the telescope stands,</text>
  <text class="muted" x="330" y="200" text-anchor="middle">yet the same image for every observer who looks</text>

  <!-- eye with its retinal image -->
  <path d="M470 90 Q510 58 550 90 Q510 122 470 90 Z" class="tube"/>
  <circle cx="510" cy="90" r="9" fill="none" stroke="currentColor" stroke-opacity="0.6"/>
  <circle cx="544" cy="90" r="4" fill="#4c8dd6"/>
  <text class="blue" x="560" y="146" text-anchor="middle">the retinal image</text>
  <text class="muted" x="560" y="164" text-anchor="middle">idea</text>
  <text class="muted" x="560" y="184" text-anchor="middle">each observer's own</text>
</svg>

<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .an { fill: none; stroke: #e2903a; stroke-width: 1.5; }
    .bn { fill: none; stroke: #4c8dd6; stroke-width: 1.5; }
    .ae { stroke: #e2903a; stroke-opacity: 0.7; stroke-width: 1.3; }
    .be { stroke: #4c8dd6; stroke-opacity: 0.7; stroke-width: 1.3; }
    .det { stroke: currentColor; stroke-opacity: 0.45; stroke-width: 1.2; stroke-dasharray: 4 3; fill: none; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="currentColor" fill-opacity="0.5"/></marker>
  </defs>

  <text class="amber" x="160" y="22" text-anchor="middle">sense</text>
  <text class="blue" x="480" y="22" text-anchor="middle">reference</text>

  <!-- sense tree -->
  <line class="ae" x1="60" y1="222" x2="150" y2="74"/>
  <line class="ae" x1="211" y1="128" x2="175" y2="74"/>
  <line class="ae" x1="160" y1="222" x2="200" y2="152"/>
  <line class="ae" x1="260" y1="222" x2="222" y2="152"/>
  <rect class="an" x="90" y="40" width="140" height="34" rx="5"/>
  <text class="amber" x="160" y="55" text-anchor="middle">s[jLm]</text>
  <text class="muted" x="160" y="69" text-anchor="middle">a thought</text>
  <rect class="an" x="166" y="128" width="90" height="24" rx="5"/>
  <text class="amber" x="211" y="145" text-anchor="middle">s[Lm]</text>
  <rect class="an" x="30" y="222" width="60" height="24" rx="5"/>
  <text class="amber" x="60" y="239" text-anchor="middle">s[j]</text>
  <rect class="an" x="130" y="222" width="60" height="24" rx="5"/>
  <text class="amber" x="160" y="239" text-anchor="middle">s[L]</text>
  <rect class="an" x="230" y="222" width="60" height="24" rx="5"/>
  <text class="amber" x="260" y="239" text-anchor="middle">s[m]</text>

  <!-- reference tree -->
  <line class="be" x1="380" y1="222" x2="470" y2="74"/>
  <line class="be" x1="530" y1="122" x2="495" y2="74"/>
  <line class="be" x1="480" y1="222" x2="515" y2="158"/>
  <line class="be" x1="580" y1="222" x2="545" y2="158"/>
  <rect class="bn" x="410" y="40" width="140" height="34" rx="5"/>
  <text class="blue" x="480" y="55" text-anchor="middle">d[jLm]</text>
  <text class="muted" x="480" y="69" text-anchor="middle">the True</text>
  <rect class="bn" x="452" y="122" width="156" height="36" rx="5"/>
  <text class="blue" x="530" y="138" text-anchor="middle">d[Lm]</text>
  <text class="muted" x="530" y="152" text-anchor="middle">concept ( ) loves Mary</text>
  <rect class="bn" x="350" y="222" width="60" height="24" rx="5"/>
  <text class="blue" x="380" y="239" text-anchor="middle">John</text>
  <rect class="bn" x="430" y="222" width="100" height="24" rx="5"/>
  <text class="blue" x="480" y="239" text-anchor="middle">( ) loves [ ]</text>
  <rect class="bn" x="550" y="222" width="60" height="24" rx="5"/>
  <text class="blue" x="580" y="239" text-anchor="middle">Mary</text>

  <path class="det" d="M232 57 L406 57" marker-end="url(#ah)"/>
  <text class="muted" x="320" y="50" text-anchor="middle">determines</text>

  <text class="muted" x="60" y="266" text-anchor="middle">'John'</text>
  <text class="muted" x="160" y="266" text-anchor="middle">'loves'</text>
  <text class="muted" x="260" y="266" text-anchor="middle">'Mary'</text>
  <text class="muted" x="380" y="266" text-anchor="middle">'John'</text>
  <text class="muted" x="480" y="266" text-anchor="middle">'loves'</text>
  <text class="muted" x="580" y="266" text-anchor="middle">'Mary'</text>
  <text class="muted" x="320" y="292" text-anchor="middle">the same three words, read twice; each tree combines its leaves by applying functions</text>
</svg>

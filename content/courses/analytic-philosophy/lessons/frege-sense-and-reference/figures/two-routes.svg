<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .bold { fill: currentColor; font-weight: 600; }
    .abox { fill: none; stroke: #e2903a; stroke-width: 1.6; }
    .bbox { fill: none; stroke: #4c8dd6; stroke-width: 1.6; }
    .hz { stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.2; }
    .arrow { stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.3; fill: none; }
    .aa { stroke: #e2903a; stroke-width: 1.6; fill: none; }
    .ba { stroke: #4c8dd6; stroke-width: 1.6; fill: none; }
  </style>
  <defs>
    <marker id="ah-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e2903a"/></marker>
    <marker id="ah-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4c8dd6"/></marker>
  </defs>

  <!-- names -->
  <text class="amber" x="120" y="30" text-anchor="middle" font-size="15">'Hesperus'</text>
  <text class="blue" x="520" y="30" text-anchor="middle" font-size="15">'Phosphorus'</text>
  <path class="aa" d="M120 38 L120 60" marker-end="url(#ah-a)"/>
  <path class="ba" d="M520 38 L520 60" marker-end="url(#ah-b)"/>
  <text class="muted" x="128" y="54">expresses</text>
  <text class="muted" x="528" y="54">expresses</text>

  <!-- sense boxes with sky scenes -->
  <rect class="abox" x="20" y="64" width="200" height="120" rx="6"/>
  <line class="hz" x1="36" y1="140" x2="204" y2="140"/>
  <path d="M60 140 A16 16 0 0 1 92 140" fill="none" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.2"/>
  <circle cx="130" cy="98" r="5" fill="#e2903a"/>
  <text class="muted" x="76" y="156" text-anchor="middle">Sun set</text>
  <text class="muted" x="120" y="172" text-anchor="middle">west, after sunset</text>
  <text class="muted" x="120" y="80" text-anchor="middle">the bright evening body</text>

  <rect class="bbox" x="420" y="64" width="200" height="120" rx="6"/>
  <line class="hz" x1="436" y1="140" x2="604" y2="140"/>
  <path d="M548 140 A16 16 0 0 1 580 140" fill="none" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.2"/>
  <circle cx="510" cy="98" r="5" fill="#4c8dd6"/>
  <text class="muted" x="564" y="156" text-anchor="middle">Sun rising</text>
  <text class="muted" x="520" y="172" text-anchor="middle">east, before sunrise</text>
  <text class="muted" x="520" y="80" text-anchor="middle">the bright morning body</text>

  <text class="amber" x="120" y="202" text-anchor="middle">sense 1</text>
  <text class="blue" x="520" y="202" text-anchor="middle">sense 2</text>

  <!-- reference -->
  <path class="aa" d="M150 206 L290 252" marker-end="url(#ah-a)"/>
  <path class="ba" d="M490 206 L350 252" marker-end="url(#ah-b)"/>
  <text class="muted" x="196" y="244" text-anchor="middle">presents</text>
  <text class="muted" x="444" y="244" text-anchor="middle">presents</text>
  <circle cx="320" cy="262" r="14" fill="none" stroke="currentColor" stroke-width="1.8"/>
  <text class="bold" x="320" y="294" text-anchor="middle">Venus: one reference</text>
</svg>

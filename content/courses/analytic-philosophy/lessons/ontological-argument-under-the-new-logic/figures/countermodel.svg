<svg viewBox="0 0 640 366" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .tag { fill: currentColor; opacity: 0.55; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; }
    .frame { fill: none; stroke: currentColor; stroke-opacity: 0.35; stroke-width: 1.2; }
    .empty { fill: none; stroke: #4c8dd6; stroke-width: 1.6; stroke-dasharray: 5 3; }
    .dot { fill: currentColor; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .amber { fill: #e2903a; font-weight: 600; }
    .green { fill: #5aa46a; font-weight: 600; }
    .rule { stroke: currentColor; stroke-opacity: 0.15; stroke-width: 1; }
    .f { font-family: "STIX Two Math", "Cambria Math", "Times New Roman", serif; font-size: 15px; fill: currentColor; }
  </style>

  <text class="tag" x="24" y="24">ONE INTERPRETATION</text>
  <rect class="frame" x="20" y="34" width="600" height="140" rx="8"/>
  <text class="muted" x="36" y="56">domain: four ordinary objects</text>
  <circle class="dot" cx="60" cy="100" r="4"/><text class="label" x="60" y="124" text-anchor="middle">a</text>
  <circle class="dot" cx="100" cy="88" r="4"/><text class="label" x="100" y="112" text-anchor="middle">b</text>
  <circle class="dot" cx="80" cy="140" r="4"/><text class="label" x="94" y="146">c</text>
  <circle class="dot" cx="130" cy="130" r="4"/><text class="label" x="144" y="136">d</text>

  <ellipse class="empty" cx="260" cy="110" rx="70" ry="42"/>
  <text class="blue" x="260" y="104" text-anchor="middle">perfect being</text>
  <text class="muted" x="260" y="122" text-anchor="middle">nothing inside</text>
  <ellipse class="empty" cx="410" cy="110" rx="70" ry="42"/>
  <text class="blue" x="410" y="104" text-anchor="middle">best island</text>
  <text class="muted" x="410" y="122" text-anchor="middle">nothing inside</text>
  <ellipse class="empty" cx="550" cy="110" rx="64" ry="42"/>
  <text class="blue" x="550" y="104" text-anchor="middle">scariest devil</text>
  <text class="muted" x="550" y="122" text-anchor="middle">nothing inside</text>

  <!-- truth-value table -->
  <text class="tag" x="24" y="206">WHAT IS TRUE IN IT</text>
  <line class="rule" x1="20" y1="216" x2="620" y2="216"/>
  <text class="label" x="36" y="240">every mark (omnipotent, most excellent, scariest, …) holds of nothing</text>
  <line class="rule" x1="20" y1="252" x2="620" y2="252"/>
  <text class="label" x="36" y="276">each definition, 'D(x) ↔ its marks', is</text>
  <text class="green" x="560" y="276" text-anchor="middle">true</text>
  <line class="rule" x1="20" y1="288" x2="620" y2="288"/>
  <text class="label" x="36" y="312">∃y (y = x) holds of a, b, c, d, so 'every perfect being exists' is</text>
  <text class="green" x="560" y="312" text-anchor="middle">true</text>
  <line class="rule" x1="20" y1="324" x2="620" y2="324"/>
  <text class="label" x="36" y="348">the conclusion: some object is a perfect being (or island, or devil)</text>
  <text class="amber" x="560" y="348" text-anchor="middle">false</text>
</svg>

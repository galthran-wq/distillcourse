<svg viewBox="0 0 640 370" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11.5px; }
    .tier { fill: currentColor; opacity: 0.55; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; }
    .rule { stroke: currentColor; stroke-opacity: 0.15; stroke-width: 1; }
    .abox { fill: none; stroke: #e2903a; stroke-width: 1.8; }
    .bbox { fill: none; stroke: #4c8dd6; stroke-width: 1.6; }
    .box { fill: none; stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.2; }
    .ghost { fill: none; stroke: currentColor; stroke-opacity: 0.4; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .mark { stroke: #4c8dd6; stroke-width: 1.2; fill: none; }
    .within { stroke: #e2903a; stroke-width: 1.6; fill: none; stroke-dasharray: 5 3; }
    .strike { stroke: #e2903a; stroke-width: 2.4; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .f { font-family: "STIX Two Math", "Cambria Math", "Times New Roman", serif; font-size: 15px; fill: currentColor; }
    .dot { fill: currentColor; opacity: 0.5; }
  </style>
  <defs>
    <marker id="ah-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#e2903a"/>
    </marker>
  </defs>

  <text class="tier" x="16" y="40">SECOND-LEVEL</text>
  <text class="tier" x="16" y="54">CONCEPTS</text>
  <text class="tier" x="16" y="150">FIRST-LEVEL</text>
  <text class="tier" x="16" y="164">CONCEPTS</text>
  <text class="tier" x="16" y="314">OBJECTS</text>
  <line class="rule" x1="16" y1="90" x2="624" y2="90"/>
  <line class="rule" x1="16" y1="270" x2="624" y2="270"/>

  <!-- second level -->
  <rect class="abox" x="200" y="24" width="180" height="44" rx="5"/>
  <text class="label" x="290" y="42" text-anchor="middle">( ) is instantiated</text>
  <text class="f" x="290" y="61" text-anchor="middle">∃x φ(x)</text>

  <!-- the concept D and its marks -->
  <rect class="bbox" x="200" y="116" width="180" height="32" rx="5"/>
  <text class="label" x="290" y="137" text-anchor="middle"><tspan class="blue">D</tspan>: ( ) is a perfect being</text>
  <path class="within" d="M290 114 L290 72" marker-end="url(#ah-a)"/>
  <text class="amber" x="300" y="98">the conclusion: D falls within it</text>

  <rect class="box" x="120" y="196" width="104" height="28" rx="5"/>
  <text class="label" x="172" y="215" text-anchor="middle">omnipotent</text>
  <rect class="box" x="238" y="196" width="104" height="28" rx="5"/>
  <text class="label" x="290" y="215" text-anchor="middle">omniscient</text>
  <rect class="box" x="356" y="196" width="104" height="28" rx="5"/>
  <text class="label" x="408" y="215" text-anchor="middle">benevolent</text>
  <path class="mark" d="M172 194 L260 150"/>
  <path class="mark" d="M290 194 L290 150"/>
  <path class="mark" d="M408 194 L320 150"/>
  <text class="blue" x="290" y="246" text-anchor="middle">marks: what the concept contains</text>

  <!-- candidate marks for 'exists' -->
  <rect class="ghost" x="486" y="112" width="130" height="40" rx="5"/>
  <text class="f" x="551" y="137" text-anchor="middle">∃y D(y)</text>
  <line class="strike" x1="490" y1="150" x2="612" y2="114"/>
  <text class="muted" x="551" y="168" text-anchor="middle">no gap: a sentence,</text>
  <text class="muted" x="551" y="182" text-anchor="middle">not a mark</text>

  <rect class="ghost" x="486" y="196" width="130" height="28" rx="5"/>
  <text class="f" x="551" y="215" text-anchor="middle">∃y (y = ( ))</text>
  <text class="muted" x="551" y="242" text-anchor="middle">a mark everything has</text>

  <!-- objects -->
  <circle class="dot" cx="200" cy="310" r="4"/>
  <circle class="dot" cx="260" cy="318" r="4"/>
  <circle class="dot" cx="330" cy="306" r="4"/>
  <circle class="dot" cx="390" cy="320" r="4"/>
  <text class="muted" x="290" y="350" text-anchor="middle">whether any object falls under the concept is not fixed by its marks</text>
</svg>

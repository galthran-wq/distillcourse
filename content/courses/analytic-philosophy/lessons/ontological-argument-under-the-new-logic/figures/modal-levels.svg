<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .tier { fill: currentColor; opacity: 0.55; font-size: 10.5px; font-weight: 600; letter-spacing: 0.04em; }
    .frame { fill: none; stroke: currentColor; stroke-opacity: 0.25; stroke-width: 1; }
    .rule { stroke: currentColor; stroke-opacity: 0.15; stroke-width: 1; }
    .abox { fill: none; stroke: #e2903a; stroke-width: 1.8; }
    .bbox { fill: none; stroke: #4c8dd6; stroke-width: 1.6; }
    .slot { fill: none; stroke: currentColor; stroke-opacity: 0.45; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .down { stroke: #e2903a; stroke-width: 1.6; fill: none; }
    .up { stroke: #5aa46a; stroke-width: 1.8; fill: none; stroke-dasharray: 5 3; }
    .strike { stroke: #e2903a; stroke-width: 2.4; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .green { fill: #5aa46a; font-weight: 600; }
    .fm { font-family: "STIX Two Math", "Cambria Math", "Times New Roman", serif; font-size: 16px; }
    .head { fill: currentColor; font-weight: 600; }
  </style>
  <defs>
    <marker id="ah-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#e2903a"/>
    </marker>
    <marker id="ah-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#5aa46a"/>
    </marker>
  </defs>

  <!-- left panel -->
  <rect class="frame" x="10" y="10" width="300" height="250" rx="6"/>
  <text class="head" x="160" y="32" text-anchor="middle">'existence is a perfection'</text>
  <text class="tier" x="22" y="70">SECOND</text>
  <text class="tier" x="22" y="82">LEVEL</text>
  <text class="tier" x="22" y="180">FIRST</text>
  <text class="tier" x="22" y="192">LEVEL</text>
  <line class="rule" x1="20" y1="120" x2="300" y2="120"/>
  <rect class="abox" x="110" y="52" width="160" height="40" rx="5"/>
  <text class="label" x="190" y="70" text-anchor="middle">( ) is instantiated</text>
  <text class="amber fm" x="190" y="87" text-anchor="middle">∃x φ(x)</text>
  <rect class="slot" x="110" y="160" width="160" height="40" rx="5"/>
  <text class="label" x="190" y="178" text-anchor="middle">a mark of</text>
  <text class="label" x="190" y="194" text-anchor="middle">'perfect being'</text>
  <path class="down" d="M190 94 L190 156" marker-end="url(#ah-a)"/>
  <line class="strike" x1="150" y1="112" x2="230" y2="140"/>
  <text class="amber" x="160" y="228" text-anchor="middle">a concept of concepts</text>
  <text class="amber" x="160" y="244" text-anchor="middle">put where a mark of objects goes</text>

  <!-- right panel -->
  <rect class="frame" x="330" y="10" width="300" height="250" rx="6"/>
  <text class="head" x="480" y="32" text-anchor="middle">'necessary existence is positive'</text>
  <text class="tier" x="342" y="70">SECOND</text>
  <text class="tier" x="342" y="82">LEVEL</text>
  <text class="tier" x="342" y="180">FIRST</text>
  <text class="tier" x="342" y="192">LEVEL</text>
  <line class="rule" x1="340" y1="120" x2="620" y2="120"/>
  <rect class="abox" x="430" y="52" width="160" height="40" rx="5"/>
  <text class="label" x="510" y="70" text-anchor="middle">( ) is positive</text>
  <text class="amber fm" x="510" y="87" text-anchor="middle">P(φ)</text>
  <rect class="bbox" x="430" y="160" width="160" height="40" rx="5"/>
  <text class="label" x="510" y="178" text-anchor="middle">( ) exists necessarily</text>
  <text class="blue fm" x="510" y="195" text-anchor="middle">NE(x)</text>
  <path class="up" d="M510 156 L510 96" marker-end="url(#ah-g)"/>
  <text class="green" x="480" y="228" text-anchor="middle">a property of objects</text>
  <text class="green" x="480" y="244" text-anchor="middle">falling within a concept of concepts</text>

  <text class="muted" x="320" y="286" text-anchor="middle">the level check rejects the left premise and passes the right one</text>
</svg>

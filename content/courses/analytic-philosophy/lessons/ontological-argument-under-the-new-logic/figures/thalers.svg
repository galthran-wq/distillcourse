<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .tag { fill: currentColor; opacity: 0.55; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; }
    .poss { fill: none; stroke: #4c8dd6; stroke-width: 1.4; stroke-dasharray: 4 3; }
    .real { fill: #e2903a; fill-opacity: 0.18; stroke: #e2903a; stroke-width: 1.6; }
    .frame { fill: none; stroke: currentColor; stroke-opacity: 0.25; stroke-width: 1; }
    .arrow { stroke: currentColor; stroke-width: 2.4; fill: none; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>

  <rect class="frame" x="20" y="16" width="230" height="230" rx="6"/>
  <text class="blue" x="135" y="40" text-anchor="middle">a hundred possible thalers</text>
  <text class="muted" x="135" y="58" text-anchor="middle">the concept, thought</text>
    <ellipse class="poss" cx="135" cy="200" rx="44" ry="9"/>
    <ellipse class="poss" cx="135" cy="189" rx="44" ry="9"/>
    <ellipse class="poss" cx="135" cy="178" rx="44" ry="9"/>
    <ellipse class="poss" cx="135" cy="167" rx="44" ry="9"/>
    <ellipse class="poss" cx="135" cy="156" rx="44" ry="9"/>
    <ellipse class="poss" cx="135" cy="145" rx="44" ry="9"/>
    <ellipse class="poss" cx="135" cy="134" rx="44" ry="9"/>
    <ellipse class="poss" cx="135" cy="123" rx="44" ry="9"/>
    <ellipse class="poss" cx="135" cy="112" rx="44" ry="9"/>
    <ellipse class="poss" cx="135" cy="101" rx="44" ry="9"/>

  <text class="label" x="135" y="232" text-anchor="middle">100 coins</text>

  <path class="arrow" d="M270 128 L362 128" marker-end="url(#ah)"/>
  <text class="label" x="316" y="116" text-anchor="middle" font-weight="600">+ exists</text>
  <text class="muted" x="316" y="150" text-anchor="middle">coins added: 0</text>

  <rect class="frame" x="390" y="16" width="230" height="230" rx="6"/>
  <text class="amber" x="505" y="40" text-anchor="middle">a hundred real thalers</text>
  <text class="muted" x="505" y="58" text-anchor="middle">the concept, instantiated</text>
    <ellipse class="real" cx="505" cy="200" rx="44" ry="9"/>
    <ellipse class="real" cx="505" cy="189" rx="44" ry="9"/>
    <ellipse class="real" cx="505" cy="178" rx="44" ry="9"/>
    <ellipse class="real" cx="505" cy="167" rx="44" ry="9"/>
    <ellipse class="real" cx="505" cy="156" rx="44" ry="9"/>
    <ellipse class="real" cx="505" cy="145" rx="44" ry="9"/>
    <ellipse class="real" cx="505" cy="134" rx="44" ry="9"/>
    <ellipse class="real" cx="505" cy="123" rx="44" ry="9"/>
    <ellipse class="real" cx="505" cy="112" rx="44" ry="9"/>
    <ellipse class="real" cx="505" cy="101" rx="44" ry="9"/>

  <text class="label" x="505" y="232" text-anchor="middle">100 coins</text>

  <text class="muted" x="320" y="280" text-anchor="middle">same content on both sides: 'exists' changes nothing in what the concept contains</text>
</svg>

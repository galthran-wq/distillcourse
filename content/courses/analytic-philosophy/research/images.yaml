# Image pool for the analytic-philosophy course, captured by the source-reading
# swarm (October 2026) and indexed by the architect. Every entry's capture
# sits under research/images/ — nobody re-reads the source later.
#
# The swarm surfaced only two candidates, both from one reader (Gettier 1963),
# and they are not duplicates of each other: page 1 and page 2 of the
# three-page paper. Both are kept. Page 3 (the conclusion) was not captured.
#
# House rule (docs/figures.md): a scan is a figure only when what is VISIBLE,
# not what is readable, is the evidence. These two pass only in the lesson
# whose subject is the paper as an artefact (gettier-problem): the typeset
# page — the journal header, the lettered schemata set as displayed logic, the
# three-page brevity — is itself the point there. They are planned nowhere
# else.
#
# WANTED (no capture yet; the figure-artist hunts them when the lesson is
# written, and records them here): the Vienna Circle's 1929 manifesto title page
# for verification-principle; the Analysis 23.6 page 123 for gettier-problem.

images:
  - id: isjustified-gettier-p1
    capture: research/images/isjustified-gettier-p1-1.png
    shows: "Page 121 of the original journal printing: running head 'ANALYSIS 23.6 / JUNE 1963', title, byline, the three lettered schemata (a) (b) (c) set as displayed 'S knows that P IFF (i) (ii) (iii)' blocks, the two stated lemmas, footnotes to Plato, Chisholm and Ayer"
    source: "E. L. Gettier, 'Is Justified True Belief Knowledge?', Analysis 23.6 (June 1963), p. 121"
    located: "PDF page 1 of the JSTOR copy hosted at fitelson.org"
    url: "https://fitelson.org/proseminar/gettier.pdf"
    license: "Unknown — Analysis / Oxford University Press copyright (JSTOR copy); teaching use of a page image of a 1963 journal article; confirm before publication"
    quality: "938x1546 render at ~150 dpi, fully legible, black on white; a JSTOR download banner at the foot ('This content downloaded from … All use subject to …') must be cropped out. Verified by eye after capture."
    note: "Planned as a `source:` figure in gettier-problem, floated beside the prose that reads schema (a): the reader must be able to see the three IFF blocks and the two lemma sentences."

  - id: isjustified-gettier-p2
    capture: research/images/isjustified-gettier-p2-2.png
    shows: "Page 122: the end of the preamble, Case I (Smith, Jones, the job, ten coins; propositions (d) and (e)) and the opening of Case II (Jones's Ford; propositions (f) and (g))"
    source: "E. L. Gettier, 'Is Justified True Belief Knowledge?', Analysis 23.6 (June 1963), p. 122"
    located: "PDF page 2 of the JSTOR copy hosted at fitelson.org"
    url: "https://fitelson.org/proseminar/gettier.pdf"
    license: "Unknown — Analysis / Oxford University Press copyright (JSTOR copy); teaching use; confirm before publication"
    quality: "938x1546 render at ~150 dpi, fully legible; JSTOR banner at the foot to crop. Same capture process as page 1."
    note: "Planned as a `source:` figure in gettier-problem, centred, where the lesson reads Case I: the reader must be able to see the lettered propositions (d)–(g) as displayed lines."

  - id: begriffsschrift-1879-p52
    capture: research/images/begriffsschrift-1879-p52.png
    shows: "Printed p. 52 of the 1879 Begriffsschrift, Part II §22: formulas (60)–(63) in the two-dimensional notation — judgement strokes, conditions branching downward, concavities with Gothic a — each with its substitution table at the left; (62) is the judgement Frege says replaces Barbara, followed by one line of German prose and formula (63)"
    source: "G. Frege, Begriffsschrift, eine der arithmetischen nachgebildete Formelsprache des reinen Denkens (Halle a/S.: Louis Nebert, 1879), p. 52"
    located: "PDF page 66 of 109 (leaf 65) of archive.org item 11388662, the Bayerische Staatsbibliothek München copy, shelfmark Graph. 22 t"
    url: "https://archive.org/details/11388662"
    license: "Public domain (published 1879; author died 1925); archive.org item states no rights restriction"
    quality: "1560x2456 stored page bitmap extracted from the item PDF without re-rendering; crisp black ink on cream paper, faint show-through from the back of the leaf, fully legible. Verified by eye after capture."
    note: "Used, cropped to formulas (60)–(62), as the floated source figure begriffsschrift-1879-page in frege-function-and-quantifier, beside the paragraph on the two-dimensional notation."

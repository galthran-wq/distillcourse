# Research canon for the analytic-philosophy course, compiled October 2026 by
# the source-reading swarm; roles and access assigned by the architect.
# `role` = which lessons the source grounds. Staged copies live in
# research/texts/ (file stems given per entry, each with a .meta.yaml
# sidecar); image captures in research/images/, indexed in images.yaml.
# `authors` is read by `npm run validate` (rule source-in-prose): every
# surname listed here is flagged if it appears in a lesson body outside
# <References> and <Quote>. Keep the field to real authors.
#
# ACCESS SUMMARY.
# FULLY READ (on disk): Beaney VSI; SEP 'Conceptions of Analysis'; SEP Frege;
# Russell 'On Denoting'; SEP Wittgenstein; SEP Vienna Circle; Ayer LTL (all
# chapters + 1946 Introduction, OCR); Quine 'Two Dogmas'; Philosophical
# Investigations (Anscombe, OCR, Parts I and II); SEP Austin; Kripke, Naming
# and Necessity (whole); Putnam 'The Meaning of Meaning' (whole); Gettier
# 1963; IEP 'Analytic Philosophy'; Magee, Men of Ideas (dialogues 5–7, 9, 10,
# 12); Bayer and Raven syllabi; Yablo 24.251 assignments; MIT 24.244 sets.
#
# NOT FULLY READ — the human obtains a copy and the read is re-run:
#   1. Soames, Philosophical Analysis in the Twentieth Century, 2 vols —
#      NOT FOUND anywhere readable.
#   2. Beaney (ed.), The Oxford Handbook of the History of Analytic
#      Philosophy — NOT FOUND (paywalled; lending-restricted scan).
#   3. Tractatus, side-by-side-by-side edition — PARTIAL: shard 2
#      (propositions 1–4.466) read 58,400 of 120,747 characters; the
#      printed diagrams and tables are absent from the text layer.
#
# NOT READ AT ALL — primary texts the briefs point at through secondary
# summaries, each flagged in its lesson's brief; the closing module and the
# five application lessons depend on these most:
#   Frege's own three texts; Russell's Logical Atomism lectures; Carnap 1932,
#   1934 §17, 1950; Ryle, The Concept of Mind; Strawson 'On Referring' and
#   Russell's 1957 reply; Donnellan 1966; Grice 1967/1975; Grice & Strawson
#   1956; Hempel 1950; Lewis 1968 and 1986; Place 1956, Smart 1959, Putnam
#   1967, Nagel 1974, Searle 1980; Rawls 1971, Harsanyi 1975, Nozick 1974;
#   Parfit 1984; Turing 1950; Einstein 1905 §1 and the conventionality-of-
#   simultaneity literature; the Neptune/Vulcan/Mercury astronomical record;
#   Lean/Mathlib and Isabelle documentation on division by zero and the
#   description operator; Benzmüller & Woltzenlogel Paleo 2013/2016; the
#   species-concept literature (Hull 1978, Dupré 1981, LaPorte 2004); Moore
#   1903, 1925, 1939; Weinberg, Nichols & Stich 2001 and Machery et al. 2017.

sources:
  # ------------------------------------------------------------ primary
  - title: "Begriffsschrift (1879); Die Grundlagen der Arithmetik (1884); 'Über Sinn und Bedeutung' (1892)"
    authors: "Gottlob Frege"
    url: "https://www.wiley.com/en-us/The+Frege+Reader-p-9780631194453"
    kind: primary
    role: >
      Module 1 entire. Begriffsschrift Preface and §§1–12 (function and
      argument, generality) for frege-function-and-quantifier; Grundlagen
      §§46–69 (number as a property of a concept, Hume's principle, the
      definitions of 0, 1 and successor) and §§1–4, 62 for frege-logicism;
      'Sense and Reference' whole for frege-sense-and-reference.
    access: >
      NOT STAGED as primary text. The three were read through Zalta's SEP
      entry (research/texts/sep_frege.txt, complete, with the notation
      tables) and Beaney's VSI Ch. 1–3. Beaney's Frege Reader (Blackwell
      1997) is the edition to stage; Grundlagen §§62–69 and 'Sense and
      Reference' are short and public-domain in German (and in the
      Geach–Black translation).

  - title: "'On Denoting', Mind 14 (1905), 479–493"
    authors: "Bertrand Russell"
    url: "https://www.jstor.org/stable/2248381"
    kind: primary
    role: >
      russell-theory-of-descriptions (whole essay; the three puzzles, scope,
      the King of France, the yacht); logical-constructions-and-acquaintance
      (the closing paragraphs on acquaintance); descriptions-in-a-proof-
      checker (m − n as a contextual definition; Frege's conventional
      denotation rejected as 'artificial'); gettier-problem (Case I's
      description).
    access: >
      Full, on disk: research/texts/russell-on-denoting.txt (Logic Museum web
      transcription; typos; an editorial introduction by F. Franco in lines
      1–118 that is secondary and partly inaccurate — never cite it as
      Russell). No page numbers; cite by paragraph or the JSTOR locator.

  - title: "The Philosophy of Logical Atomism (1918 lectures); 'Mr Strawson on Referring', Mind 66 (1957)"

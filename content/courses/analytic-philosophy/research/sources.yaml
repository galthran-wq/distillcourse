  - title: "Tractatus Logico-Philosophicus (1921/1922), side-by-side-by-side edition (Ogden/Ramsey, Pears/McGuinness, German)"
    authors: "Ludwig Wittgenstein, Kevin C. Klement (ed.), Bertrand Russell (introduction)"
    url: "https://people.umass.edu/klement/tlp/"
    kind: primary
    role: >
      The three Tractatus lessons: tractatus-picture-theory (1–3.5, 4.0–4.1),

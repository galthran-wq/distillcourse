      §7 (Carnap, explication), §8 (Ryle, Austin, Strawson, connective
      analysis), §9 (Quine vs Carnap, Dummett's axiom).
    access: "Full, on disk: research/texts/beaney-s6.txt and beaney-s6.html."

  - title: "'Gottlob Frege', Stanford Encyclopedia of Philosophy"
    authors: "Edward N. Zalta"
    url: "https://plato.stanford.edu/entries/frege/"
    kind: encyclopedia
    role: >
      Module 1's technical grounding: §2.1–2.2 (function/argument,
      quantifiers vs Aristotle, existence as second-level), §2.3
      (definitions), §2.4 (Basic Law V, Russell's letter), §2.5–2.6 (number,
      Hume's principle, the ancestral, Frege's theorem), §2.7 (vs Kant;
      Bolzano and intuition), §3 (the puzzles, sense and denotation, the
      Twain/Clemens argument, the 'John loves Mary' tree).
    access: "Full, on disk: research/texts/sep_frege.txt and sep_frege.html (Frege's 2-D notation appears only as images in the original)."

  - title: "'Ludwig Wittgenstein', Stanford Encyclopedia of Philosophy"

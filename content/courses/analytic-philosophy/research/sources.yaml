  # ---------------------------------------------------------- secondary
  - title: "Analytic Philosophy: A Very Short Introduction (2017)"
    authors: "Michael Beaney"
    url: "https://global.oup.com/academic/product/analytic-philosophy-a-very-short-introduction-9780198778028"
    kind: textbook
    role: >
      The non-technical narrative check for Modules 1–2 and 6: Ch. 1 (number
      as concept-property, the study and the removals company), Ch. 2 (the
      four 'is a philosopher' cases, the devil parody, the average woman,
      K1–K5), Ch. 3 (Moore, paradox of analysis, Hesperus), Ch. 4 (saying/
      showing, the laptop, Carnap vs Heidegger), Ch. 6 (the post-war
      strands, Ryle/Austin/Strawson sketches, the name's history). Its
      favourites (Moore, Stebbing) feed moore-common-sense and the Stebbing
      objection in logical-constructions-and-acquaintance.
    access: "Full, on disk: research/texts/beaney-vsi-djvu.txt (OCR; the formal logic partly stripped) and analyticphil-s2-ch5-6.txt."

  - title: "'Analysis', Stanford Encyclopedia of Philosophy, supplement 'Conceptions of Analysis in Analytic Philosophy'"
    authors: "Michael Beaney"
    url: "https://plato.stanford.edu/entries/analysis/s6.html"
    kind: encyclopedia
    role: >
      The cross-cutting thread of what 'analysis' meant in each module:
      §2 (Frege), §3 (Russell, eliminativism), §4 (Moore, paradox of

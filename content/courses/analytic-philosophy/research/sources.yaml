    access: >
      Full, on disk: research/texts/ayer-lt-l.txt (whole, OCR) and the shards
      languagetrut-s1-ch01-03.txt, languagetrut-s2-ch04-06.txt,
      languagetrut-s3-ch07-08.txt (Penguin pagination). OCR is noisy

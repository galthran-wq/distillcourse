  - title: "Men of Ideas (BBC, 1978): conversations with Anthony Quinton, A. J. Ayer, Bernard Williams, W. V. O. Quine, John Searle, Hilary Putnam"
    authors: "Bryan Magee"
    url: "https://archive.org/details/menofideas0000mage"
    kind: secondary
    role: >
      Motivation, characterisation and balance-sheet verdicts in the
      speakers' own voices: Quinton on the two Wittgensteins (Module 5
      openings; the Paris courtroom model), Ayer on the Circle and 'nearly
      all of it was false' (verification-principle), Williams on the spell
      and shortcomings of linguistic philosophy (grice-conversational-
      implicature, moore-common-sense), Quine on ontology and naturalism
      (holism-and-naturalism), Searle on speech acts and intentionality
      (austin-speech-acts, functionalism-and-its-objections), Putnam on
      science, truth and functionalism (simultaneity-and-operational-
      definition, functionalism-and-its-objections).
    access: "Full, on disk: research/texts/magee-men-of-ideas.txt (whole, OCR) and the shards menof-s1-dialogues5-7.txt, menof-s2-quine-searle.txt, menof-s2-putnam.txt. Edited reading text, not verbatim transcript."

  - title: "Philosophical Analysis in the Twentieth Century, Vol. 1: The Dawn of Analysis; Vol. 2: The Age of Meaning (Princeton, 2003)"
    authors: "Scott Soames"
    url: "https://press.princeton.edu/books/paperback/9780691122441/philosophical-analysis-in-the-twentieth-century-volume-1"
    kind: textbook
    role: >
      Intended as the argument-level check for every core lesson (Soames
      reconstructs each doctrine as premises and objections, in the register
      this course uses) — especially Vol. 1 Parts 1–2 (Moore, Russell), 4
      (Tractatus), 5–6 (Vienna, Quine) and Vol. 2 Parts 1–2 (later
      Wittgenstein, Oxford), 3 (Grice), 5–6 (Kripke, Putnam).
    access: >
      NOT FOUND. No readable copy anywhere: not staged in research/texts/;
      archive.org holds only lending-restricted scans of Vol. 2
      (philosophicalana0000soam, philosophicalana0000soam_h4k8) whose
      full-text endpoint returns page chrome; the NDPR and Sainsbury pieces
      are reviews, not used. The human obtains both volumes (Princeton UP;
      411 pp. and 479 pp.) and stages them as PDFs; the research is then
      re-run against them and every brief's 'Sources to consult' gains a
      Soames pointer.

  - title: "The Oxford Handbook of the History of Analytic Philosophy (Oxford, 2013)"
    authors: "Michael Beaney (ed.)"
    url: "https://academic.oup.com/edited-volume/34298"
    kind: handbook
    role: >
      Intended for the historiography (the name's origin, the two post-war

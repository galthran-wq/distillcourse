# Concept registry for classical-ml-interview.
# Every concepts.introduces entry in course.yaml resolves here;
# introduced_in must match the declaring lesson.

concepts:
  # --- foundations ---
  - id: generalization-error
    name: Generalization error
    definition: "Expected loss of a fitted model on new draws from the data distribution, as opposed to its training error"
    introduced_in: bias-variance
  - id: bias-variance-decomposition
    name: Bias–variance decomposition
    definition: "Err(x0) = irreducible noise σ² + Bias²(f̂(x0)) + Var(f̂(x0)); the exact three-way split of expected squared prediction error"
    introduced_in: bias-variance
  - id: overfitting
    name: Overfitting
    definition: "Fitting noise in the training sample: training error keeps falling while generalization error rises"
    introduced_in: bias-variance
  - id: maximum-likelihood
    name: Maximum likelihood estimation
    definition: "Choose parameters maximizing the probability of the observed data; operationally, set the derivative of the log-likelihood to zero"
    introduced_in: mle-map
  - id: map-estimation
    name: MAP estimation
    definition: "Maximize likelihood × prior; equivalently MLE plus a log-prior penalty — the Bayesian reading of regularization"
    introduced_in: mle-map
  - id: gradient-descent
    name: Gradient descent
    definition: "Iterative minimization by stepping against the gradient: θ ← θ − η∇J(θ)"
    introduced_in: gradient-descent
  - id: stochastic-gradient-descent
    name: Stochastic gradient descent
    definition: "Gradient descent using a noisy gradient estimate from one example or a mini-batch per step"
    introduced_in: gradient-descent
  - id: convexity
    name: Convexity
    definition: "A function whose chords lie above its graph; local minima are global, which is why convex losses make classical models reliable to fit"
    introduced_in: gradient-descent
  - id: k-nearest-neighbors
    name: k-nearest neighbors
    definition: "Predict by voting (or averaging) among the k closest training points under a distance metric"
    introduced_in: knn-curse
  - id: bayes-error
    name: Bayes-optimal classifier and Bayes error
    definition: "The classifier predicting argmax_y P(y|x); its error rate is the irreducible floor for any classifier"
    introduced_in: knn-curse
  - id: curse-of-dimensionality
    name: Curse of dimensionality
    definition: "In high dimensions, volume concentrates near boundaries and pairwise distances concentrate, so local neighborhoods stop being local"
    introduced_in: knn-curse

  # --- linear regression ---
  - id: ordinary-least-squares
    name: Ordinary least squares
    definition: "The linear fit minimizing the residual sum of squares; closed form θ̂ = (XᵀX)⁻¹Xᵀy"
    introduced_in: ols
  - id: normal-equations
    name: Normal equations
    definition: "XᵀXθ = Xᵀy, the stationarity condition of the least-squares objective; residuals are orthogonal to the column space of X"
    introduced_in: ols
  - id: gauss-markov
    name: Gauss–Markov theorem
    definition: "Under exogeneity, homoscedasticity, and uncorrelated errors, OLS has minimum variance among linear unbiased estimators (BLUE)"
    introduced_in: ols
  - id: regularization
    name: Regularization
    definition: "Adding a complexity penalty to the training objective to trade a little bias for a large variance reduction"
    introduced_in: ridge-lasso
  - id: ridge-regression
    name: Ridge regression
    definition: "Least squares plus an L2 penalty λ‖β‖²; closed form (XᵀX+λI)⁻¹Xᵀy, shrinking low-variance principal directions most"
    introduced_in: ridge-lasso
  - id: lasso
    name: Lasso
    definition: "Least squares plus an L1 penalty λ‖β‖₁; induces exact zeros, doing continuous variable selection"
    introduced_in: ridge-lasso
  - id: soft-thresholding
    name: Soft thresholding
    definition: "The lasso's orthonormal-case solution sign(β̂)(|β̂|−λ)₊: shift toward zero and clip — the algebraic source of sparsity"
    introduced_in: ridge-lasso
  - id: multicollinearity
    name: Multicollinearity
    definition: "Near-linear dependence among predictors; coefficients become unstable with inflated variance (measured by VIF) though predictions may be fine"
    introduced_in: regression-diagnostics
  - id: heteroscedasticity
    name: Heteroscedasticity
    definition: "Error variance that changes with x; OLS stays unbiased but standard errors and Gauss–Markov optimality break"
    introduced_in: regression-diagnostics
  - id: leverage
    name: Leverage and influence
    definition: "How far a point's predictors sit from the bulk of X (leverage) and how much removing it changes the fit (influence)"
    introduced_in: regression-diagnostics
  - id: r-squared
    name: R² and adjusted R²
    definition: "Fraction of response variance explained by the fit; the adjusted version penalizes added predictors"
    introduced_in: regression-diagnostics

  # --- linear classification ---
  - id: logistic-regression
    name: Logistic regression
    definition: "Linear model for the log-odds of a binary label; p(y=1|x) = σ(wᵀx), fit by maximizing the Bernoulli likelihood"
    introduced_in: logistic-regression
  - id: log-odds
    name: Log-odds (logit)
    definition: "log(p/(1−p)); the quantity logistic regression models linearly, mapping (0,1) to the whole real line"
    introduced_in: logistic-regression
  - id: cross-entropy-loss
    name: Cross-entropy (log) loss
    definition: "−[y log p + (1−y) log(1−p)]; the negative Bernoulli log-likelihood, convex in the linear parameters"
    introduced_in: logistic-regression
  - id: naive-bayes
    name: Naive Bayes
    definition: "Generative classifier assuming features are conditionally independent given the class: p(x|y) = Π_j p(x_j|y)"
    introduced_in: naive-bayes
  - id: conditional-independence
    name: Conditional independence
    definition: "X ⊥ Y given Z: once Z is known, X carries no further information about Y — the assumption naive Bayes makes per feature pair"
    introduced_in: naive-bayes
  - id: laplace-smoothing
    name: Laplace smoothing
    definition: "Add pseudo-counts to every count estimate so unseen events get nonzero probability; fixes naive Bayes' zero-frequency failure"
    introduced_in: naive-bayes
  - id: gaussian-discriminant-analysis
    name: Gaussian discriminant analysis (LDA/QDA)
    definition: "Fit one Gaussian per class plus priors and classify by Bayes' rule; shared covariance gives linear boundaries (LDA), per-class covariance quadratic ones (QDA)"
    introduced_in: lda-gda
  - id: generative-vs-discriminative
    name: Generative vs discriminative modeling
    definition: "Model p(x,y) and invert by Bayes' rule, versus model p(y|x) directly; efficiency when assumptions hold vs robustness when they don't"
    introduced_in: lda-gda
  - id: exponential-family
    name: Exponential family
    definition: "Distributions of the form b(x)exp(ηᵀT(x) − a(η)); Bernoulli, Gaussian, Poisson and most classical likelihoods fit it"
    introduced_in: glm
  - id: generalized-linear-model
    name: Generalized linear model
    definition: "Exponential-family response whose natural parameter is linear in x; unifies linear, logistic, and Poisson regression"
    introduced_in: glm
  - id: link-function
    name: Link function
    definition: "The map between the linear predictor and the response mean; canonical links (identity, logit, log) fall out of the exponential family"
    introduced_in: glm

  # --- evaluation ---
  - id: confusion-matrix
    name: Confusion matrix
    definition: "2×2 (or k×k) table of predicted vs true labels; TP/FP/FN/TN, from which every classification rate derives"
    introduced_in: classification-metrics
  - id: precision-recall
    name: Precision and recall
    definition: "Precision = TP/(TP+FP), recall = TP/(TP+FN); the pair that stays informative under class imbalance, combined by the F-score"
    introduced_in: classification-metrics
  - id: roc-auc
    name: ROC curve and AUC
    definition: "TPR vs FPR traced over all thresholds; AUC equals the probability a random positive scores above a random negative"
    introduced_in: classification-metrics
  - id: calibration
    name: Calibration
    definition: "Predicted probabilities matching observed frequencies; assessed by reliability curves, scored properly by log-loss or Brier"
    introduced_in: classification-metrics
  - id: cross-validation
    name: Cross-validation
    definition: "Estimate test error by rotating held-out folds; k-fold with k=5 or 10 as the standard bias–variance compromise"
    introduced_in: cross-validation-bootstrap
  - id: bootstrap
    name: Bootstrap
    definition: "Resample n points with replacement to approximate an estimator's sampling distribution; each resample omits ≈1/e ≈ 36.8% of points"
    introduced_in: cross-validation-bootstrap
  - id: nested-cross-validation
    name: Nested cross-validation
    definition: "An outer CV loop measuring performance of the whole tuning procedure, with hyperparameter selection confined to inner folds"
    introduced_in: cross-validation-bootstrap
  - id: hoeffding-inequality
    name: Hoeffding's inequality
    definition: "P[|ν−μ| > ε] ≤ 2exp(−2ε²N): a sample mean concentrates exponentially fast around its expectation"
    introduced_in: learning-theory
  - id: vc-dimension
    name: VC dimension
    definition: "The largest number of points a hypothesis class can shatter; the effective complexity that replaces the hypothesis count in bounds"
    introduced_in: learning-theory
  - id: generalization-bound
    name: VC generalization bound
    definition: "With probability 1−δ, E_out ≤ E_in + Ω(N, H, δ), where Ω grows with VC dimension and shrinks with sample size"
    introduced_in: learning-theory

  # --- SVM ---
  - id: maximum-margin
    name: Maximum margin
    definition: "Among separating hyperplanes, choose the one maximizing the distance to the nearest points; margin = 2/‖w‖ under the canonical scaling"
    introduced_in: svm-max-margin
  - id: hinge-loss
    name: Hinge loss
    definition: "max(0, 1 − y·f(x)): zero beyond the margin, linear inside it; soft-margin SVM = hinge loss + L2 penalty"
    introduced_in: svm-max-margin
  - id: slack-variables
    name: Slack variables
    definition: "ξᵢ ≥ 0 measuring each point's margin violation; C prices total slack against margin width"
    introduced_in: svm-max-margin
  - id: support-vectors
    name: Support vectors
    definition: "The training points on or inside the margin; they alone determine the SVM solution"
    introduced_in: svm-max-margin
  - id: lagrangian-duality
    name: Lagrangian duality
    definition: "Turn a constrained minimization into a maximization over multipliers; for the SVM QP the dual is a problem in α alone"
    introduced_in: svm-dual-kernels
  - id: kkt-conditions
    name: KKT conditions
    definition: "Stationarity, feasibility, and complementary slackness at a constrained optimum; complementary slackness is why only margin points get α > 0"
    introduced_in: svm-dual-kernels
  - id: kernel-trick
    name: Kernel trick
    definition: "Replace inner products with K(x,x') = ⟨φ(x),φ(x')⟩ to work in an implicit feature space; valid iff the Gram matrix is PSD (Mercer)"
    introduced_in: svm-dual-kernels

  # --- trees and ensembles ---
  - id: decision-tree
    name: Decision tree (CART)
    definition: "Axis-aligned recursive binary partition grown greedily by impurity reduction; leaves predict a class or a mean"
    introduced_in: decision-trees
  - id: gini-impurity
    name: Gini impurity
    definition: "Σ p_k(1−p_k): the probability two random draws from a node disagree; CART's default split criterion"
    introduced_in: decision-trees
  - id: information-gain
    name: Entropy and information gain
    definition: "Node impurity −Σ p_k log p_k; information gain is the impurity drop from a split"
    introduced_in: decision-trees
  - id: cost-complexity-pruning
    name: Cost-complexity pruning
    definition: "Minimize error + α·|leaves| over subtrees; α traces a nested family selected by cross-validation — the tree's lasso"
    introduced_in: decision-trees
  - id: bagging
    name: Bagging
    definition: "Fit the same learner on B bootstrap resamples and average/vote; reduces variance of unstable low-bias learners"
    introduced_in: bagging-random-forests
  - id: random-forest
    name: Random forest
    definition: "Bagged trees plus random feature subsampling (m ≈ √p) at each split, decorrelating trees to break the variance floor"
    introduced_in: bagging-random-forests
  - id: out-of-bag-error
    name: Out-of-bag error
    definition: "Test-error estimate from predicting each point using only the ~1/3 of trees whose bootstrap sample omitted it; no held-out set needed"
    introduced_in: bagging-random-forests
  - id: variable-importance
    name: Variable importance
    definition: "Split-gain accumulation or OOB permutation degradation per feature; each with known biases (cardinality, correlation)"
    introduced_in: bagging-random-forests
  - id: weak-learner
    name: Weak learner
    definition: "A classifier only slightly better than chance (error ½−γ); boosting's raw material, canonically a decision stump"
    introduced_in: adaboost
  - id: boosting
    name: Boosting
    definition: "Fit learners sequentially, each correcting its predecessors, and combine by weighted vote/sum; reduces bias where bagging reduces variance"
    introduced_in: adaboost
  - id: adaboost
    name: AdaBoost
    definition: "Boosting with multiplicative example reweighting and vote weights α = ½ln((1−ε)/ε); equals forward-stagewise exponential-loss minimization"
    introduced_in: adaboost
  - id: exponential-loss
    name: Exponential loss
    definition: "L(y,f) = exp(−y f(x)); the loss whose stagewise minimization reproduces AdaBoost exactly"
    introduced_in: adaboost
  - id: gradient-boosting
    name: Gradient boosting
    definition: "Boosting as gradient descent in function space: each stage fits a tree to the loss's negative gradient at current predictions"
    introduced_in: gradient-boosting
  - id: pseudo-residuals
    name: Pseudo-residuals
    definition: "−∂L/∂f(xᵢ) evaluated at the current model; for squared error, exactly the ordinary residuals"
    introduced_in: gradient-boosting
  - id: shrinkage
    name: Shrinkage (learning rate)
    definition: "Scale each new tree by ν ≪ 1; small ν with many iterations generalizes better than large steps"
    introduced_in: gradient-boosting
  - id: newton-boosting
    name: Second-order (Newton) boosting
    definition: "Boosting on a second-order Taylor expansion of the loss with per-example g and h; XGBoost's core"
    introduced_in: xgboost
  - id: split-gain
    name: XGBoost split gain
    definition: "Gain = ½[G_L²/(H_L+λ) + G_R²/(H_R+λ) − G²/(H+λ)] − γ; the structure-score improvement of a candidate split"
    introduced_in: xgboost

  # --- unsupervised ---
  - id: k-means
    name: k-means (Lloyd's algorithm)
    definition: "Alternate nearest-center assignment and mean update to locally minimize within-cluster squared distance"
    introduced_in: kmeans
  - id: distortion
    name: Distortion (inertia)
    definition: "J = Σᵢ ‖xᵢ − μ_c(i)‖²; the single objective both k-means steps decrease, guaranteeing convergence"
    introduced_in: kmeans
  - id: k-means-plus-plus
    name: k-means++ seeding
    definition: "Choose initial centers with probability proportional to squared distance from existing ones; spreads seeds and bounds expected distortion"
    introduced_in: kmeans
  - id: hierarchical-clustering
    name: Hierarchical (agglomerative) clustering
    definition: "Repeatedly merge the two closest clusters under a linkage rule, producing a dendrogram cut at any height"
    introduced_in: hierarchical-dbscan
  - id: linkage
    name: Linkage criteria
    definition: "How cluster distance is defined for merging: single (min), complete (max), average, Ward (variance increase) — each with characteristic artifacts"
    introduced_in: hierarchical-dbscan
  - id: dbscan
    name: DBSCAN
    definition: "Density-based clustering via core points (≥ minPts within ε); finds arbitrary shapes, labels sparse points noise, needs no k"
    introduced_in: hierarchical-dbscan
  - id: silhouette
    name: Silhouette score
    definition: "(b−a)/max(a,b) per point, comparing mean intra-cluster distance a to nearest-other-cluster distance b; averages to a clustering quality score"
    introduced_in: hierarchical-dbscan
  - id: gaussian-mixture-model
    name: Gaussian mixture model
    definition: "Density Σ_k π_k N(x|μ_k,Σ_k) with a latent component indicator per point; clustering becomes posterior inference"
    introduced_in: gmm-em
  - id: em-algorithm
    name: EM algorithm
    definition: "Alternate expected complete-data log-likelihood (E) and its maximization (M); each iteration cannot decrease the observed-data likelihood"
    introduced_in: gmm-em
  - id: responsibilities
    name: Responsibilities
    definition: "γ(z_nk) = posterior probability component k generated point n; the E-step's soft assignments"
    introduced_in: gmm-em
  - id: elbo
    name: Evidence lower bound (ELBO)
    definition: "log p(x) ≥ E_q[log p(x,z)/q(z)] by Jensen; tight when q equals the posterior — the inequality behind EM's monotonicity"
    introduced_in: gmm-em
  - id: principal-component-analysis
    name: Principal component analysis
    definition: "Orthogonal directions of maximal projected variance: the top eigenvectors of the covariance matrix, equivalently the SVD's right singular vectors"
    introduced_in: pca
  - id: explained-variance
    name: Explained variance ratio
    definition: "λ_j / Σλ: the share of total variance carried by component j; the scree plot's y-axis and the basis for choosing dimensionality"
    introduced_in: pca
  - id: svd
    name: Singular value decomposition
    definition: "X = UDVᵀ; V holds the principal directions and UD the scores — the numerically stable route to PCA"
    introduced_in: pca
  - id: t-sne
    name: t-SNE
    definition: "Embed points so Student-t neighbor probabilities in the map match Gaussian neighbor probabilities in the original space, minimizing KL"
    introduced_in: tsne
  - id: perplexity
    name: Perplexity
    definition: "2^H(P_i): the effective number of neighbors each point's Gaussian is calibrated to; t-SNE's main knob, typically 5–50"
    introduced_in: tsne
  - id: crowding-problem
    name: Crowding problem
    definition: "A 2D map lacks volume for moderate high-dimensional distances, crushing points together; heavy-tailed map kernels are the fix"
    introduced_in: tsne

  # --- practical ---
  - id: categorical-encoding
    name: Categorical encoding
    definition: "Turning categories into numbers: one-hot, ordinal, and target encoding — the last leaking label information unless computed out-of-fold"
    introduced_in: feature-engineering
  - id: feature-scaling
    name: Feature scaling
    definition: "Standardization or min-max normalization; required by distance- and penalty-based models, irrelevant to trees"
    introduced_in: feature-engineering
  - id: feature-selection
    name: Feature selection
    definition: "Filter (per-feature scores), wrapper (search with CV), and embedded (L1, tree importance) strategies for pruning the feature set"
    introduced_in: feature-engineering
  - id: class-imbalance
    name: Class imbalance
    definition: "Skewed label frequencies that make accuracy vacuous; handled by metric choice, class weights, resampling, and threshold moving"
    introduced_in: imbalance-leakage
  - id: resampling
    name: Resampling for imbalance
    definition: "Undersample the majority, oversample the minority, or synthesize (SMOTE); distorts calibration, so correct priors afterwards"
    introduced_in: imbalance-leakage
  - id: data-leakage
    name: Data leakage
    definition: "Information unavailable at prediction time entering training — target leakage, contamination, temporal and group leakage — inflating offline scores"
    introduced_in: imbalance-leakage

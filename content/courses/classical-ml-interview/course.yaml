schema_version: 1
slug: classical-ml-interview
title: Classical Machine Learning (Interview Preparation)
tagline: Dense reviews of the classical-ML canon plus the interview questions asked on each topic
status: planned
audience: >
  Engineers who have seen classical ML before and are preparing for ML /
  data-science interviews. They want tight thesis-style reviews — definitions,
  formulas, trade-offs, the derivations interviewers actually request — not a
  slow build-up from scratch.
tone: >
  Dry, precise, engineering register. Facts first, no ceremony. Each lesson is
  a compressed review followed by canonical interview questions worked in
  full; end-of-lesson exercises ARE real interview questions with complete
  solutions.
intro: >
  A review course for classical machine learning organized the way interviews
  are: per topic, a dense summary of the key results — definitions, formulas,
  trade-offs — followed by the canonical interview questions on that topic,
  worked in full.


  The derivations interviewers ask for are done on the page: the OLS normal
  equations, the bias–variance decomposition, why L1 sparsifies, the SVM dual
  and kernel trick, EM for Gaussian mixtures, PCA via eigendecomposition, why
  bagging reduces variance, and the gradient-boosting and XGBoost objectives.
  Rarely-asked heavy theory (VC bounds, GLM theory) sits in optional extra
  chapters off the core path.
prerequisites:
  - text: "Linear algebra: matrix multiplication, eigenvalues/eigenvectors, comfortable matrix notation"
  - text: "Multivariable calculus: gradients, partial derivatives, Lagrange multipliers seen once"
  - text: "Probability: distributions, expectation, variance, Bayes' rule, independence"
  - text: "Prior exposure to ML at the level of a first course or on-the-job use; this is a review, not a first introduction"
key_results:
  - text: "Expected test error decomposes exactly as irreducible noise + squared bias + variance"
    lesson: bias-variance
  - text: "Every standard regularizer is the log of a prior: MAP with a Gaussian prior is ridge, with a Laplace prior is lasso"
    lesson: mle-map
  - text: "The OLS estimator has closed form (XᵀX)⁻¹Xᵀy and is the minimum-variance linear unbiased estimator (Gauss–Markov)"
    lesson: ols
  - text: "The L1 penalty produces exact zeros (soft thresholding at the diamond's corners); the L2 penalty only shrinks"
    lesson: ridge-lasso
  - text: "The SVM dual depends on data only through inner products, so a kernel substitutes an implicit feature space at no extra cost; only support vectors carry the solution"
    lesson: svm-dual-kernels
  - text: "Averaging B trees with pairwise correlation ρ leaves variance floor ρσ²; random forests attack ρ by feature subsampling"
    lesson: bagging-random-forests
  - text: "AdaBoost is forward-stagewise additive modeling under exponential loss, with training error bounded by exp(−2Σγ_t²)"
    lesson: adaboost
  - text: "Gradient boosting is gradient descent in function space: each tree fits the negative gradient of the loss (for squared error, the residuals)"
    lesson: gradient-boosting
  - text: "Each EM iteration provably increases the observed-data likelihood via the ELBO / Jensen argument"
    lesson: gmm-em
  - text: "The direction of maximum projected variance is the top eigenvector of the covariance matrix"
    lesson: pca
sources:
  - T. Hastie, R. Tibshirani, J. Friedman, The Elements of Statistical Learning, 2nd ed., Springer, 2009
  - G. James, D. Witten, T. Hastie, R. Tibshirani, J. Taylor, An Introduction to Statistical Learning with Applications in Python, Springer, 2023
  - C. M. Bishop, Pattern Recognition and Machine Learning, Springer, 2006
  - K. P. Murphy, Probabilistic Machine Learning — An Introduction, MIT Press, 2022
  - A. Ng, T. Ma, CS229 Lecture Notes, Stanford, 2023
  - K. Q. Weinberger, CS4780 Machine Learning Lecture Notes, Cornell, 2018
  - Y. S. Abu-Mostafa, Learning From Data (Caltech CS156 lectures), 2012
  - L. Breiman, "Random Forests," Machine Learning 45, 2001
  - Y. Freund, R. E. Schapire, "A Decision-Theoretic Generalization of On-Line Learning and an Application to Boosting," JCSS 55, 1997
  - 'J. H. Friedman, "Greedy Function Approximation: A Gradient Boosting Machine," Annals of Statistics 29, 2001'
  - 'T. Chen, C. Guestrin, "XGBoost: A Scalable Tree Boosting System," KDD 2016'
  - C. Cortes, V. Vapnik, "Support-Vector Networks," Machine Learning 20, 1995
  - A. P. Dempster, N. M. Laird, D. B. Rubin, "Maximum Likelihood from Incomplete Data via the EM Algorithm," JRSS-B 39, 1977
  - L. van der Maaten, G. Hinton, "Visualizing Data using t-SNE," JMLR 9, 2008
  - T. G. Dietterich, "Ensemble Methods in Machine Learning," MCS 2000
  - N. Singh, K. Huo, Ace the Data Science Interview, 2021
  - C. Huyen, Introduction to Machine Learning Interviews, free web book
  - J. Starmer, StatQuest — Machine Learning playlist (YouTube)
  - V. Powell, L. Lehe, "Principal Component Analysis Explained Visually," Setosa.io

outcomes:
  - id: co-derivations
    text: >
      Reproduce the canonical whiteboard derivations — OLS normal equations,
      bias–variance decomposition, lasso soft thresholding, SVM dual, EM
      updates, PCA eigendecomposition, boosting objectives — with every step
      shown
    bloom: apply
  - id: co-mechanics
    text: >
      Execute the classical algorithms by hand on small inputs: a Lloyd's
      iteration, an AdaBoost round, a tree split by impurity, a naive Bayes
      prediction with smoothing
    bloom: apply
  - id: co-tradeoffs
    text: >
      Compare methods and justify model selection under stated constraints —
      L1 vs L2, generative vs discriminative, bagging vs boosting, k-means vs
      GMM, PCA vs t-SNE — in the terms interviewers probe
    bloom: analyze
  - id: co-evaluation
    text: >
      Design and defend evaluation and validation protocols: metric choice
      under imbalance, cross-validation setup, leakage detection, calibration
    bloom: evaluate

modules:
  - slug: foundations
    title: "Statistical learning foundations"
    outcomes: [co-derivations, co-tradeoffs]
    lessons:
      - slug: bias-variance
        title: "The bias–variance decomposition"
        type: core
        status: drafted
        goal: "Derive the bias–variance decomposition of expected test error and use it to diagnose underfitting and overfitting"
        opening: "Expected prediction error at a point splits exactly into three terms — irreducible noise, squared bias, and variance — and every modeling choice in classical machine learning trades one term against another."
        est_minutes: 24
        prerequisites: []
        concepts:
          introduces: [generalization-error, bias-variance-decomposition, overfitting]
          reinforces: []
        key_ideas:
          - "The full decomposition proof: add and subtract E[f̂], cross terms vanish"
          - "The U-shaped test-error curve: bias falls, variance rises with flexibility"
          - "Diagnosis from learning curves: high bias vs high variance and what fixes each"
          - "Interview phrasing: the decomposition as the answer skeleton for a dozen questions"
        demo:
          component: BiasVarianceExplorer
          spec: >
            Polynomial degree slider (0-9) fitting noisy samples of a fixed
            smooth target; left panel shows data + fit, right panel plots
            train and test error vs degree with the current degree marked.
            Presets: underfit (degree 0), sweet spot, overfit (degree 9).
            Resample button draws a fresh training set so the fit's variance
            across samples is visible at high degree.

      - slug: mle-map
        title: "Maximum likelihood and MAP estimation"
        type: core
        status: drafted
        goal: "Compute maximum-likelihood and MAP estimates for standard models and connect priors to regularization penalties"
        opening: "Most classical estimators are maximum-likelihood estimates in disguise, and every standard regularizer is the log of a prior."
        est_minutes: 22
        prerequisites: []
        concepts:
          introduces: [maximum-likelihood, map-estimation]
          reinforces: []
        key_ideas:
          - "The two-step MLE recipe: write the log-likelihood, set the derivative to zero"
          - "Worked estimates: Bernoulli (coin), Gaussian mean and variance"
          - "MAP = MLE plus log-prior; Beta prior = hallucinated pseudo-counts"
          - "Gaussian prior gives L2, Laplace prior gives L1 — stated here, used all course"
        demo: null

      - slug: gradient-descent
        title: "Gradient descent and convex optimization"
        type: core
        status: drafted
        goal: "Explain how batch gradient descent, SGD, and Newton's method minimize training loss and when each is appropriate"
        opening: "Nearly every model in this course is fit by minimizing a loss, and three iterative schemes — batch gradient descent, stochastic gradient descent, and Newton's method — cover almost all of classical practice."
        est_minutes: 22
        prerequisites: [mle-map]
        concepts:
          introduces: [gradient-descent, stochastic-gradient-descent, convexity]
          reinforces: [maximum-likelihood]
        key_ideas:
          - "GD as repeated first-order Taylor steps; the learning rate's failure modes"
          - "SGD: noisy but cheap; mini-batches and why they dominate in practice"
          - "Newton's method: second-order step, quadratic convergence, O(d³) cost"
          - "Convexity: definition, why it guarantees global optima, which classical losses are convex"
        demo:
          component: GradientDescentExplorer
          spec: >
            2D loss-contour plot (elongated quadratic bowl) with a start
            point; learning-rate slider and step button animate the descent
            trajectory. Presets: small lr (slow zig-zag), good lr, divergent
            lr, Newton step (one jump to the minimum). Readout of loss per
            iteration.

      - slug: knn-curse
        title: "k-nearest neighbors and the curse of dimensionality"
        type: core
        status: drafted
        goal: "Apply k-NN as a bias–variance dial and quantify why distance-based methods fail in high dimensions"
        opening: "The simplest classifier — vote among the nearest training points — is asymptotically within a factor of two of optimal, and high dimensionality is exactly what breaks it."
        est_minutes: 24
        prerequisites: [bias-variance]
        concepts:
          introduces: [k-nearest-neighbors, bayes-error, curse-of-dimensionality]
          reinforces: [bias-variance-decomposition, overfitting]
        key_ideas:
          - "k-NN mechanics; k as the bias–variance knob (k=1 overfits, k=n underfits)"
          - "The Bayes-optimal classifier and Bayes error as the floor; Cover–Hart 2× bound for 1-NN"
          - "Curse of dimensionality with numbers: neighborhood edge length r^(1/p), distance concentration"
          - "Practical consequences: feature scaling, dimensionality reduction, when k-NN is the right answer"
        demo:
          component: KnnBoundaryExplorer
          spec: >
            Two-class 2D scatter (mixture data, fixed); k slider from 1 to 51
            redraws the k-NN decision boundary and reports train and test
            error. Presets: k=1 (islands around noise points), k=15 (smooth),
            k=51 (oversmoothed). Instruction line: watch the noise islands
            vanish as k grows.

  - slug: linear-regression
    title: "Linear regression"
    outcomes: [co-derivations, co-tradeoffs]
    lessons:
      - slug: ols
        title: "Ordinary least squares"
        type: core
        status: drafted
        goal: "Derive the OLS normal equations by matrix calculus and state the Gauss–Markov guarantees and their assumptions"
        opening: "The least-squares estimator has a closed form, (XᵀX)⁻¹Xᵀy, and its derivation is among the most common whiteboard requests in classical-ML interviews."
        est_minutes: 26
        prerequisites: [mle-map]
        concepts:
          introduces: [ordinary-least-squares, normal-equations, gauss-markov]
          reinforces: [maximum-likelihood]
        key_ideas:
          - "Matrix-calculus derivation of ∇J = XᵀXθ − Xᵀy = 0, every step shown"
          - "Geometric view: ŷ is the orthogonal projection of y onto the column space of X"
          - "Least squares = MLE under i.i.d. Gaussian noise"
          - "Gauss–Markov: BLUE under exogeneity, homoscedasticity, no perfect collinearity"
          - "When XᵀX is singular (collinearity, p>n) — the door to ridge"
        demo: null

      - slug: ridge-lasso
        title: "Ridge and lasso regularization"
        type: core
        status: drafted
        goal: "Explain why the L1 penalty produces exact zeros while L2 only shrinks, using constraint geometry, soft thresholding, and Bayesian priors"
        opening: "Adding a penalty on coefficient size trades bias for variance; the shape of the penalty — disk or diamond — decides whether coefficients shrink or vanish."
        est_minutes: 28
        prerequisites: [ols, bias-variance]
        concepts:
          introduces: [regularization, ridge-regression, lasso, soft-thresholding]
          reinforces: [bias-variance-decomposition, map-estimation, ordinary-least-squares]
        key_ideas:
          - "Ridge closed form (XᵀX+λI)⁻¹Xᵀy; SVD view: shrink direction j by d_j²/(d_j²+λ)"
          - "Orthonormal case: ridge shrinks proportionally, lasso soft-thresholds to exact zeros"
          - "The diamond-vs-disk constraint picture — corners are where zeros happen"
          - "Bayesian reading: Gaussian prior = ridge, Laplace prior = lasso"
          - "Elastic net, standardization before penalizing, λ chosen by CV"
        demo:
          component: CoefficientPathExplorer
          spec: >
            λ slider on a fixed 8-feature regression problem; two panels show
            ridge and lasso coefficient paths side by side with the current λ
            as a vertical marker. Lasso coefficients visibly hit exactly zero
            one by one; ridge paths approach but never touch zero. Preset λ
            values: none, moderate, heavy.

      - slug: regression-diagnostics
        title: "Linear regression assumptions and diagnostics"
        type: core
        status: drafted
        goal: "Analyze violations of the linear-model assumptions — collinearity, heteroscedasticity, outliers, leverage — and select the standard remedies"
        opening: "The OLS guarantees hold only under explicit assumptions, and interviewers probe exactly the cases where each assumption breaks."
        est_minutes: 24
        prerequisites: [ols]
        concepts:
          introduces: [multicollinearity, heteroscedasticity, leverage, r-squared]
          reinforces: [ordinary-least-squares, gauss-markov]
        key_ideas:
          - "The assumption checklist: linearity, independence, homoscedasticity, no perfect collinearity"
          - "Multicollinearity: inflated coefficient variance, VIF, remedies (drop, combine, ridge)"
          - "Residual plots, heteroscedasticity, robust standard errors, transformations"
          - "Outliers vs high-leverage points; influence"
          - "R² vs adjusted R²; what coefficients and p-values do and do not mean"
        demo: null

  - slug: linear-classification
    title: "Linear classification"
    outcomes: [co-derivations, co-mechanics, co-tradeoffs]
    lessons:
      - slug: logistic-regression
        title: "Logistic regression"
        type: core
        status: drafted
        goal: "Derive the logistic-regression gradient from the Bernoulli likelihood and explain why cross-entropy, not squared error, is the right loss"
        opening: "Logistic regression models the log-odds as a linear function; maximum likelihood then yields a convex loss whose gradient has exactly the least-squares form (y − p)x."
        est_minutes: 26
        prerequisites: [mle-map, gradient-descent]
        concepts:
          introduces: [logistic-regression, log-odds, cross-entropy-loss]
          reinforces: [maximum-likelihood, gradient-descent, convexity]
        key_ideas:
          - "Sigmoid from log-odds; decision boundary is linear"
          - "Bernoulli likelihood → cross-entropy; gradient derivation with σ' = σ(1−σ)"
          - "Why not squared error: non-convexity and vanishing gradients"
          - "Separable data makes weights diverge — regularization as the fix"
          - "Coefficients as log odds ratios; multinomial softmax extension"
        demo: null

      - slug: naive-bayes
        title: "Naive Bayes"
        type: core
        status: drafted
        goal: "Construct a naive Bayes classifier from the conditional-independence assumption and compute smoothed predictions by hand"
        opening: "Naive Bayes assumes features are conditionally independent given the class; the assumption is false almost everywhere, and the classifier works anyway."
        est_minutes: 22
        prerequisites: [mle-map]
        concepts:
          introduces: [naive-bayes, conditional-independence, laplace-smoothing]
          reinforces: [maximum-likelihood, map-estimation]
        key_ideas:
          - "Bayes' rule plus the factorization p(x|y) = Π p(x_j|y); why 'naive'"
          - "MLE parameters are counts; a fully worked spam/text example"
          - "The zero-count failure and Laplace smoothing as pseudo-counts"
          - "Event models: Bernoulli, multinomial, Gaussian NB"
          - "Naive Bayes is a linear classifier; when it wins (small data, high dimensions, streaming)"
        demo: null

      - slug: lda-gda
        title: "Generative versus discriminative: LDA and QDA"
        type: core
        status: drafted
        goal: "Analyze the generative–discriminative trade-off using Gaussian discriminant analysis as the worked case"
        opening: "Fitting one Gaussian per class and applying Bayes' rule produces exactly the logistic-regression functional form — but the two fits give different parameters, and that difference is the generative–discriminative trade-off."
        est_minutes: 24
        prerequisites: [naive-bayes, logistic-regression]
        concepts:
          introduces: [gaussian-discriminant-analysis, generative-vs-discriminative]
          reinforces: [logistic-regression, naive-bayes, maximum-likelihood]
        key_ideas:
          - "GDA model and its closed-form MLE; shared covariance → linear boundary (LDA)"
          - "Derivation: shared-Σ Gaussians give a sigmoid posterior"
          - "QDA: per-class covariances, quadratic boundaries, the bias–variance reading"
          - "GDA vs logistic regression: efficiency when the model is right, robustness when it is wrong"
          - "What generative buys: missing features, class priors, semi-supervised use"
        demo: null

      - slug: glm
        title: "Generalized linear models"
        type: extra
        status: drafted
        goal: "Construct GLMs from the exponential family and derive linear, logistic, and Poisson regression as special cases"
        opening: "One recipe — an exponential-family response with a linear natural parameter — generates linear regression, logistic regression, and Poisson regression from the same three assumptions."
        est_minutes: 28
        prerequisites: [logistic-regression, ols]
        concepts:
          introduces: [exponential-family, generalized-linear-model, link-function]
          reinforces: [maximum-likelihood, logistic-regression, cross-entropy-loss]
        key_ideas:
          - "Exponential family form; Bernoulli and Gaussian rewritten into it"
          - "The three GLM assumptions; canonical links fall out"
          - "Poisson regression for counts; the insurance-claims worked case"
          - "Deviance as the right GLM loss; calibration beats MSE for rate models"
        demo: null

      - slug: logreg-lab
        title: "Logistic regression from scratch"
        type: lab
        status: drafted
        goal: "Implement logistic regression end to end in numpy — stable log-loss, a hand-derived gradient, batch gradient descent, L2, Newton/IRLS and a rank-based ROC-AUC — and use it to classify real tumors against held-out labels"
        opening: "Every derivation from this module becomes running code: you derive the gradient and the Hessian yourself, build the classifier and its scorer piece by verified piece, then point them at real diagnostic data and beat a server-scored AUC threshold."
        est_minutes: 15
        prerequisites: [logistic-regression, gradient-descent]
        concepts:
          introduces: []
          reinforces: [logistic-regression, cross-entropy-loss, gradient-descent]
        key_ideas:
          - "log(sigmoid) overflows on saturated logits; logaddexp is the stable form"
          - "The (p − y)x gradient — derived by hand, refereed by finite differences"
          - "Feature standardization decides whether gradient descent converges at all"
          - "Newton/IRLS: the σ(1−σ)-weighted Hessian converges in single-digit steps where GD needs thousands"
          - "AUC is a rank statistic; tied scores share averaged ranks"
        demo: null
        lab:
          est_hours: 4.5
          checkpoints:
            - id: sigmoid
              kind: exact
              text: "Elementwise sigmoid"
            - id: log-loss
              kind: exact
              text: "Numerically stable log-loss via logaddexp"
            - id: grad
              kind: exact
              text: "Gradient of the loss in (w, b)"
            - id: fit-gd
              kind: exact
              text: "Batch gradient-descent trainer with loss history"
            - id: l2
              kind: exact
              text: "L2-penalized loss and gradient (intercept unpenalized)"
            - id: newton
              kind: exact
              required: false
              text: "Newton/IRLS: derive the Hessian, train in eight steps"
            - id: auc
              kind: exact
              text: "ROC-AUC as a rank statistic, ties handled"
            - id: beat-auc
              kind: metric
              required: false
              text: "Beat the AUC threshold on held-out tumors with your own model"
            - id: why-not-mse
              kind: review
              text: "Written answer: why cross-entropy, not squared error"

  - slug: evaluation
    title: "Evaluation and validation"
    outcomes: [co-evaluation]
    lessons:
      - slug: classification-metrics
        title: "Classification metrics: ROC, precision–recall, and calibration"
        type: core
        status: drafted
        goal: "Select the right classification metric for a task and compute confusion-matrix, ROC, PR, and calibration quantities by hand"
        opening: "Accuracy fails on exactly the problems that matter — a 99.9%-accurate rare-disease screen can be useless — so classifier evaluation is a menu of metrics, each correct for a different question."
        est_minutes: 28
        prerequisites: [logistic-regression]
        concepts:
          introduces: [confusion-matrix, precision-recall, roc-auc, calibration]
          reinforces: [logistic-regression, cross-entropy-loss]
        key_ideas:
          - "Confusion matrix and every derived rate (TPR/FPR/precision/NPV) in one table"
          - "Threshold sweep → ROC curve; AUC as ranking probability; when ROC misleads"
          - "PR curves under imbalance; F-beta and why the harmonic mean"
          - "Proper scoring rules: log-loss, Brier; calibration curves"
          - "Choosing thresholds from costs, not defaults"
        demo:
          component: ThresholdMetricsExplorer
          spec: >
            Two overlapping score histograms (negatives, positives) with a
            draggable threshold; live confusion matrix, precision, recall,
            F1, and the current point traced on ROC and PR curves side by
            side. Class-imbalance preset (1:100) shows ROC barely moving
            while precision collapses. Instruction: drag the threshold and
            watch which metrics move.

      - slug: cross-validation-bootstrap
        title: "Cross-validation and the bootstrap"
        type: core
        status: drafted
        goal: "Design validation protocols — hold-out, k-fold, LOOCV, nested CV, bootstrap — and justify the choice of k and the one-standard-error rule"
        opening: "Training error is a biased estimate of test error; resampling — cross-validation and the bootstrap — is how classical ML measures generalization honestly."
        est_minutes: 26
        prerequisites: [bias-variance, classification-metrics]
        concepts:
          introduces: [cross-validation, bootstrap, nested-cross-validation]
          reinforces: [bias-variance-decomposition, overfitting, generalization-error]
        key_ideas:
          - "Hold-out, k-fold, LOOCV; the bias–variance trade-off in the choice of k"
          - "Bootstrap resampling; the 1 − 1/e ≈ 0.632 in-sample probability"
          - "Selecting hyperparameters honestly: selection bias, nested CV, one-SE rule"
          - "CV done wrong: filtering features on all data first (the classic leakage)"
          - "Time-series and grouped data: when random folds are invalid"
        demo: null

      - slug: learning-theory
        title: "Generalization theory: Hoeffding, VC dimension, and bounds"
        type: extra
        status: drafted
        goal: "Explain how the VC generalization bound connects model complexity, sample size, and the train–test gap"
        opening: "Learning from a finite sample is feasible because empirical error concentrates around true error — Hoeffding's inequality plus the growth function turn that claim into a quantitative bound."
        est_minutes: 32
        prerequisites: [cross-validation-bootstrap]
        concepts:
          introduces: [hoeffding-inequality, vc-dimension, generalization-bound]
          reinforces: [generalization-error, overfitting, bias-variance-decomposition]
        key_ideas:
          - "Hoeffding for one hypothesis; the union bound and the 1000-coins trap"
          - "Growth function and break points replace the hypothesis count M"
          - "VC dimension; the perceptron in d dimensions has VC dim d+1"
          - "The bound E_out ≤ E_in + Ω(N, H, δ) and the N ≥ 10·d_vc rule of thumb"
        demo: null

  - slug: svm-kernels
    title: "Support vector machines and kernels"
    outcomes: [co-derivations, co-tradeoffs]
    lessons:
      - slug: svm-max-margin
        title: "Maximum margin and the soft-margin SVM"
        type: core
        status: drafted
        goal: "Formulate the hard- and soft-margin SVM as a quadratic program and interpret C, slack, and the hinge-loss view"
        opening: "Among all separating hyperplanes, the SVM picks the one with maximum margin; slack variables and the parameter C extend the same idea to non-separable data."
        est_minutes: 26
        prerequisites: [logistic-regression]
        concepts:
          introduces: [maximum-margin, hinge-loss, slack-variables, support-vectors]
          reinforces: [cross-entropy-loss, regularization, convexity]
        key_ideas:
          - "Geometric margin; normalizing to y(wᵀx+b) ≥ 1 gives margin 2/‖w‖"
          - "Hard-margin QP; why maximize the margin at all"
          - "Slack variables and C; one outlier swinging the hard-margin plane"
          - "ERM view: hinge loss + L2 penalty is the same problem"
          - "Hinge vs logistic loss: margins vs probabilities"
        demo:
          component: SvmMarginExplorer
          spec: >
            2D two-class points (draggable) with the soft-margin SVM
            boundary, margin lines, and highlighted support vectors; C slider
            on a log scale redraws margin width and slack. Presets: separable
            (wide margin), one outlier (watch C decide whether to bend),
            heavy overlap. Instruction: drag a point into the margin and
            watch it become a support vector.

      - slug: svm-dual-kernels
        title: "The SVM dual and the kernel trick"
        type: core
        status: drafted
        goal: "Derive the SVM dual via Lagrange multipliers and KKT conditions and explain how kernels give nonlinear boundaries at no extra cost"
        opening: "Solving the margin QP through its Lagrangian dual reveals that the classifier depends on the data only through inner products — replace those with a kernel and the SVM becomes nonlinear for free."
        est_minutes: 32
        prerequisites: [svm-max-margin]
        concepts:
          introduces: [lagrangian-duality, kkt-conditions, kernel-trick]
          reinforces: [maximum-margin, hinge-loss, support-vectors]
        key_ideas:
          - "Full dual derivation: Lagrangian, stationarity w = Σαᵢyᵢxᵢ, dual objective"
          - "Complementary slackness: αᵢ > 0 only on the margin — support vectors fall out of KKT"
          - "Soft margin changes one thing: the box constraint 0 ≤ α ≤ C"
          - "Kernels: polynomial and RBF; Mercer's PSD condition; feature spaces of dimension 10¹⁶ at O(d) cost"
          - "γ and C as the RBF-SVM bias–variance dials"
        demo:
          component: KernelBoundaryExplorer
          spec: >
            2D two-class data that is not linearly separable (ring inside a
            disk); RBF-SVM decision boundary with γ and C sliders on log
            scales; support vectors highlighted, train/test error readout.
            Presets: γ too small (underfit, nearly linear), balanced, γ too
            large (islands around individual points). Instruction: push γ up
            until the boundary memorizes single points.

  - slug: trees-ensembles
    title: "Trees, forests, and boosting"
    outcomes: [co-derivations, co-mechanics, co-tradeoffs]
    lessons:
      - slug: decision-trees
        title: "Decision trees"
        type: core
        status: drafted
        goal: "Construct classification and regression trees by greedy impurity minimization and prune them with cost-complexity pruning"
        opening: "A decision tree fits by asking one greedy question at a time — which split most reduces impurity — and controls overfitting by pruning the result."
        est_minutes: 26
        prerequisites: [bias-variance]
        concepts:
          introduces: [decision-tree, gini-impurity, information-gain, cost-complexity-pruning]
          reinforces: [overfitting, bias-variance-decomposition]
        key_ideas:
          - "Recursive binary splitting; a split chosen by hand on a small table"
          - "Impurity measures: Gini, entropy, misclassification — and why the last is bad for growing"
          - "Regression trees: RSS splits, leaf means"
          - "Cost-complexity (weakest-link) pruning; α as the tree's lasso"
          - "Pros/cons ledger: interpretable, mixed data, no scaling needed vs unstable, axis-aligned, weak alone"
        demo:
          component: TreeDepthExplorer
          spec: >
            2D two-class data; max-depth slider (1-10) redraws the CART
            partition as nested axis-aligned rectangles plus train/test
            error curves vs depth. Presets: stump, depth 3 (best test
            error), depth 10 (memorized). Instruction: find the depth where
            test error turns back up.

      - slug: bagging-random-forests
        title: "Bagging and random forests"
        type: core
        status: drafted
        goal: "Explain how bagging reduces variance and why random forests decorrelate trees, using the correlated-average variance formula"
        opening: "Averaging B identically distributed trees leaves bias unchanged and cuts variance only down to a floor set by the between-tree correlation — random forests exist to attack that floor."
        est_minutes: 28
        prerequisites: [decision-trees, cross-validation-bootstrap]
        concepts:
          introduces: [bagging, random-forest, out-of-bag-error, variable-importance]
          reinforces: [bootstrap, decision-tree, bias-variance-decomposition]
        key_ideas:
          - "Var of a correlated average: ρσ² + (1−ρ)σ²/B — the whole story in one formula"
          - "Bagging: bootstrap + aggregate; why it needs unstable, low-bias learners"
          - "Random forests: m ≈ √p feature subsampling to push ρ down"
          - "OOB error: the free ~1/3 hold-out; more trees never overfit (Breiman's convergence)"
          - "Variable importance: Gini decrease vs permutation, and their biases"
        demo: null

      - slug: adaboost
        title: "AdaBoost"
        type: core
        status: drafted
        goal: "Compute AdaBoost rounds by hand and derive the algorithm's equivalence to forward-stagewise additive modeling under exponential loss"
        opening: "AdaBoost turns a learner barely better than chance into a strong classifier by reweighting mistakes; the algorithm is exactly stagewise minimization of an exponential loss."
        est_minutes: 30
        prerequisites: [decision-trees]
        concepts:
          introduces: [weak-learner, boosting, adaboost, exponential-loss]
          reinforces: [decision-tree, overfitting]
        key_ideas:
          - "The algorithm: weighted error ε, vote weight α = ½ln((1−ε)/ε), multiplicative reweighting"
          - "Two rounds worked fully by hand on a 10-point stump problem"
          - "The derivation: forward-stagewise exponential-loss minimization reproduces α and the weights"
          - "Training error ≤ exp(−2Σγ_t²); test error keeps falling after train error hits zero (margins)"
          - "Boosting vs bagging: bias reduction vs variance reduction; label-noise sensitivity"
        demo: null

      - slug: gradient-boosting
        title: "Gradient boosting"
        type: core
        status: drafted
        goal: "Derive gradient boosting as gradient descent in function space and explain the roles of shrinkage, tree depth, and subsampling"
        opening: "Gradient boosting fits each new tree to the negative gradient of the loss at the current predictions — for squared error, literally the residuals — turning boosting into gradient descent in function space."
        est_minutes: 28
        prerequisites: [adaboost, gradient-descent]
        concepts:
          introduces: [gradient-boosting, pseudo-residuals, shrinkage]
          reinforces: [gradient-descent, adaboost, decision-tree]
        key_ideas:
          - "Treat the N fitted values as parameters; the negative gradient for squared error is the residual"
          - "The generic algorithm: fit tree to pseudo-residuals, per-leaf line search"
          - "Pseudo-residuals per loss: squared, absolute, Huber, deviance (one table)"
          - "Shrinkage ν vs iterations M: small ν + large M wins; stochastic subsampling"
          - "Tree depth caps interaction order — why depth 3-6 stumps-and-a-bit dominate"
        demo:
          component: BoostingStagesExplorer
          spec: >
            1D noisy regression dataset; iteration slider (0-100) shows the
            accumulated boosted fit thickening toward the target curve, with
            a second panel showing the current residuals the next tree will
            fit. Learning-rate toggle (0.1 vs 1.0) at fixed M shows the
            shrinkage trade-off. Instruction: watch residuals shrink toward
            noise as iterations grow.

      - slug: xgboost
        title: "XGBoost"
        type: core
        status: drafted
        goal: "Derive the XGBoost split-gain formula from the second-order objective and enumerate its regularization and systems refinements"
        opening: "XGBoost replaces the first-order gradient step with a Newton step: a second-order Taylor expansion of the loss gives closed-form leaf weights and an exact split-gain formula."
        est_minutes: 26
        prerequisites: [gradient-boosting]
        concepts:
          introduces: [newton-boosting, split-gain]
          reinforces: [gradient-boosting, regularization, pseudo-residuals]
        key_ideas:
          - "Regularized objective: loss + γT + ½λ‖w‖²"
          - "Second-order Taylor → optimal leaf weight −G/(H+λ), structure score −½ΣG²/(H+λ) + γT"
          - "The split-gain formula, derived by before/after subtraction — the canonical interview ask"
          - "Sparsity-aware default directions for missing values; approximate/histogram splits"
          - "XGBoost vs vanilla GBM vs LightGBM/CatBoost in one comparison table"
        demo: null

  - slug: unsupervised
    title: "Clustering and dimensionality reduction"
    outcomes: [co-derivations, co-mechanics, co-tradeoffs]
    lessons:
      - slug: kmeans
        title: "k-means clustering"
        type: core
        status: drafted
        goal: "Apply Lloyd's algorithm by hand and prove it converges by coordinate descent on the distortion objective"
        opening: "k-means alternates two moves — assign each point to its nearest center, recompute each center as the mean of its points — and each move can only decrease the same objective, so the algorithm converges."
        est_minutes: 24
        prerequisites: [knn-curse]
        concepts:
          introduces: [k-means, distortion, k-means-plus-plus]
          reinforces: [k-nearest-neighbors]
        key_ideas:
          - "The distortion objective J; both steps minimize J in one block of variables"
          - "Convergence proof by monotone decrease; local optima and restarts"
          - "k-means++ seeding; choosing k (elbow, silhouette pointer)"
          - "Failure modes: non-spherical clusters, unequal sizes/densities, unscaled features"
          - "k-means vs k-NN — the perennial name-confusion question"
        demo:
          component: KMeansStepper
          spec: >
            2D scatter with k=3; step button alternates assignment
            (points recolor) and update (centroids move) one half-step at a
            time; distortion J readout decreases monotonically. Reseed
            button restarts with new random centers to show different local
            optima. Presets: well-separated blobs, elongated clusters
            (failure), mouse-shaped data.

      - slug: hierarchical-dbscan
        title: "Hierarchical clustering and DBSCAN"
        type: core
        status: drafted
        goal: "Compare linkage-based hierarchical clustering and density-based DBSCAN and select the right paradigm for a data shape"
        opening: "Not every cluster is a blob: linkage hierarchies and density-based clustering recover structure k-means cannot, at the price of different hyperparameters."
        est_minutes: 22
        prerequisites: [kmeans]
        concepts:
          introduces: [hierarchical-clustering, linkage, dbscan, silhouette]
          reinforces: [k-means, distortion]
        key_ideas:
          - "Agglomerative clustering; single/complete/average/Ward linkage and their artifacts (chaining vs crowding)"
          - "Dendrograms: what cutting at a height means, what horizontal position does not mean"
          - "DBSCAN: core/border/noise points, ε and minPts, arbitrary shapes, no k needed"
          - "Cluster evaluation: silhouette score, ARI when labels exist"
          - "Paradigm selection table: k-means vs hierarchical vs DBSCAN vs GMM"
        demo: null

      - slug: gmm-em
        title: "Gaussian mixtures and the EM algorithm"
        type: core
        status: drafted
        goal: "Derive the EM updates for a Gaussian mixture and explain why each iteration increases the likelihood"
        opening: "Replacing k-means' hard assignments with posterior probabilities gives the Gaussian mixture model; EM alternates computing those responsibilities with weighted maximum likelihood, and each iteration provably increases the likelihood."
        est_minutes: 32
        prerequisites: [kmeans, mle-map]
        concepts:
          introduces: [gaussian-mixture-model, em-algorithm, responsibilities, elbo]
          reinforces: [k-means, maximum-likelihood]
        key_ideas:
          - "GMM as a latent-variable model; why direct MLE is stuck (log of a sum)"
          - "E-step responsibilities via Bayes' rule; M-step weighted MLE — derived, not stated"
          - "The ELBO / Jensen argument: E-step closes the KL gap, M-step lifts the bound"
          - "k-means as the σ²→0 limit of EM"
          - "Pitfalls: singularities (σ→0 spikes), local optima, slow convergence on overlapping components"
        demo:
          component: EmStepper
          spec: >
            2D Old-Faithful-style scatter with two Gaussian components drawn
            as ellipses; step button alternates E-step (points recolor by
            responsibility, soft blends visible) and M-step (ellipses move
            and reshape); log-likelihood readout increases monotonically.
            Compare toggle: k-means hard assignment on the same data.
            Instruction: watch boundary points hold intermediate colors.

      - slug: pca
        title: "Principal component analysis"
        type: core
        status: drafted
        goal: "Derive PCA as variance maximization solved by the covariance eigendecomposition and apply it correctly — centering, scaling, choosing components"
        opening: "The direction that maximizes projected variance is the top eigenvector of the covariance matrix; everything else in PCA — SVD, scree plots, reconstruction — follows from that one Lagrange computation."
        est_minutes: 28
        prerequisites: [knn-curse]
        concepts:
          introduces: [principal-component-analysis, explained-variance, svd]
          reinforces: [curse-of-dimensionality, ridge-regression]
        key_ideas:
          - "The derivation: maximize uᵀΣu subject to ‖u‖=1 → Σu = λu, every step shown"
          - "Equivalent view: minimum reconstruction error; PCA via SVD and why SVD is used in practice"
          - "Explained variance ratios, scree plots, choosing the number of components"
          - "Practice: center always, scale when units differ; PCA before k-NN/k-means; PCR link"
          - "Limitations: linear, variance ≠ relevance, components uninterpretable; PCA vs LDA"
        demo:
          component: PcaExplorer
          spec: >
            Draggable 2D point cloud with live principal axes overlaid
            (lengths proportional to explained variance) and a bar chart of
            variance explained per component; a projection toggle collapses
            points onto PC1 to show reconstruction. Presets: correlated
            cloud, isotropic cloud (axes unstable), two elongated blobs.
            Instruction: drag points and watch the axes chase the variance.

      - slug: tsne
        title: "t-SNE and neighbor embeddings"
        type: core
        status: drafted
        goal: "Explain how t-SNE preserves local neighborhoods, why heavy tails fix the crowding problem, and when to prefer it over PCA"
        opening: "t-SNE matches neighbor distributions between the original space and a 2D map; a heavy-tailed kernel in the map is what keeps moderate-distance points from crushing into the center."
        est_minutes: 22
        prerequisites: [pca]
        concepts:
          introduces: [t-sne, perplexity, crowding-problem]
          reinforces: [principal-component-analysis, curse-of-dimensionality]
        key_ideas:
          - "Gaussian neighbor probabilities p_ij; Student-t map probabilities q_ij; asymmetric KL cost favors local structure"
          - "Perplexity as effective neighbor count; the 5-50 range"
          - "The crowding problem: 2D lacks room for mid-range distances; heavy tails as the fix"
          - "Reading t-SNE maps: cluster sizes and inter-cluster distances mean little; axes mean nothing"
          - "PCA vs t-SNE decision rule: preprocessing/features vs visualization; non-parametric, non-convex caveats"
        demo:
          component: PerplexityExplorer
          spec: >
            Precomputed t-SNE embeddings of one small labeled dataset at
            perplexities 2, 5, 30, 100 plus the PCA projection; a selector
            crossfades between them with points colored by class. Readout
            names the artifact at each extreme (shattered micro-clusters at
            2; merged blobs at 100). Instruction: find the perplexity where
            class structure is clearest.

  - slug: practical
    title: "The practical round: features, imbalance, leakage"
    outcomes: [co-evaluation, co-tradeoffs]
    lessons:
      - slug: feature-engineering
        title: "Feature engineering and selection"
        type: core
        status: drafted
        goal: "Select encoding, scaling, and feature-selection strategies for a modeling task and identify where each can leak information"
        opening: "Model quality is bounded by feature quality; encoding, scaling, and selecting features are engineering decisions with failure modes interviewers probe directly."
        est_minutes: 26
        prerequisites: [ridge-lasso, cross-validation-bootstrap]
        concepts:
          introduces: [categorical-encoding, feature-scaling, feature-selection]
          reinforces: [lasso, cross-validation, multicollinearity]
        key_ideas:
          - "Categorical encodings: one-hot, ordinal/label, target encoding — and target encoding's leakage trap (K-fold/ordered fixes)"
          - "Scaling: standardize vs min-max; which models need it (distance/penalty-based) and which don't (trees)"
          - "Missing data: deletion, imputation, missingness indicators; what trees do natively"
          - "Selection: filter vs wrapper vs embedded (L1); stepwise caveats"
          - "Interactions, binning, log transforms — when manual features still beat the model"
        demo: null

      - slug: imbalance-leakage
        title: "Class imbalance and data leakage"
        type: core
        status: drafted
        goal: "Analyze class imbalance and data leakage scenarios and select mitigations that survive deployment"
        opening: "The two most common ways a good-looking model fails in production are class imbalance handled with the wrong metric and information leaking from the future into training."
        est_minutes: 26
        prerequisites: [classification-metrics, cross-validation-bootstrap]
        concepts:
          introduces: [class-imbalance, resampling, data-leakage]
          reinforces: [precision-recall, roc-auc, calibration, cross-validation]
        key_ideas:
          - "Imbalance playbook: metric first (PR, cost-weighted), then class weights, resampling/SMOTE, threshold moving"
          - "Resampling distorts calibration — recalibrate or correct priors after"
          - "Leakage taxonomy: target leakage, train-test contamination, temporal leakage, group leakage"
          - "Detection heuristics: too-good scores, suspicious feature importance, performance collapse on time-split"
          - "The ESL wrong-way-CV case: filtering features on all data before CV"
        demo: null

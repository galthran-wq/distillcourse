<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; font-size: 13px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .small { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .box   { fill: none; stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.4; }
    .boxa  { fill: none; stroke: #e2903a; stroke-width: 1.8; }
    .boxb  { fill: none; stroke: #4c8dd6; stroke-width: 1.8; }
    .arrow { stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.4; fill: none; }
    .arrowa { stroke: #e2903a; stroke-width: 1.8; fill: none; }
    .arrowb { stroke: #4c8dd6; stroke-width: 1.4; fill: none; }
    .txt   { fill: currentColor; font-size: 12px; }
  </style>

  <!-- ===== AdaBoost: sequential ===== -->
  <text class="label" x="46" y="34" font-weight="bold">AdaBoost: sequential, coupled through the weights</text>

  <rect class="box" x="46" y="70" width="64" height="36" rx="4"/>
  <text class="txt" x="78" y="92" text-anchor="middle">data</text>

  <rect class="boxa" x="150" y="70" width="70" height="36" rx="4"/>
  <text class="txt" x="185" y="87" text-anchor="middle">stump h&#8321;</text>
  <text class="small" x="185" y="101" text-anchor="middle">&#945;&#8321;</text>

  <rect class="boxa" x="288" y="70" width="70" height="36" rx="4"/>
  <text class="txt" x="323" y="87" text-anchor="middle">stump h&#8322;</text>
  <text class="small" x="323" y="101" text-anchor="middle">&#945;&#8322;</text>

  <rect class="boxa" x="426" y="70" width="70" height="36" rx="4"/>
  <text class="txt" x="461" y="87" text-anchor="middle">stump h&#8323;</text>
  <text class="small" x="461" y="101" text-anchor="middle">&#945;&#8323;</text>

  <rect class="box" x="530" y="62" width="96" height="52" rx="4"/>
  <text class="txt" x="578" y="83" text-anchor="middle">sign &#8721; &#945;&#8348;h&#8348;</text>
  <text class="small" x="578" y="100" text-anchor="middle">weighted vote</text>

  <line class="arrow" x1="110" y1="88" x2="146" y2="88"/>
  <path class="arrow" d="M146 88 l-6 -3 l0 6 z" fill="currentColor" fill-opacity="0.6"/>

  <line class="arrowa" x1="220" y1="88" x2="284" y2="88"/>
  <path d="M284 88 l-6 -3 l0 6 z" fill="#e2903a"/>
  <text class="small" x="252" y="80" text-anchor="middle" fill="#e2903a" opacity="1">reweight</text>

  <line class="arrowa" x1="358" y1="88" x2="422" y2="88"/>
  <path d="M422 88 l-6 -3 l0 6 z" fill="#e2903a"/>
  <text class="small" x="390" y="80" text-anchor="middle" fill="#e2903a" opacity="1">reweight</text>

  <line class="arrow" x1="496" y1="88" x2="526" y2="88"/>
  <path class="arrow" d="M526 88 l-6 -3 l0 6 z" fill="currentColor" fill-opacity="0.6"/>

  <text class="muted" x="46" y="136">each round&#8217;s data distribution is set by the previous round&#8217;s mistakes; T rounds = T dependent fits</text>

  <!-- ===== Bagging: parallel ===== -->
  <text class="label" x="46" y="176" font-weight="bold">Bagging: parallel, coupled only at the vote</text>

  <rect class="box" x="46" y="228" width="64" height="40" rx="4"/>
  <text class="txt" x="78" y="252" text-anchor="middle">data</text>

  <rect class="boxb" x="180" y="192" width="96" height="28" rx="4"/>
  <text class="txt" x="228" y="210" text-anchor="middle">resample 1</text>
  <rect class="boxb" x="180" y="234" width="96" height="28" rx="4"/>
  <text class="txt" x="228" y="252" text-anchor="middle">resample 2</text>
  <rect class="boxb" x="180" y="276" width="96" height="28" rx="4"/>
  <text class="txt" x="228" y="294" text-anchor="middle">resample B</text>

  <rect class="box" x="330" y="192" width="96" height="28" rx="4"/>
  <text class="txt" x="378" y="210" text-anchor="middle">deep tree 1</text>
  <rect class="box" x="330" y="234" width="96" height="28" rx="4"/>
  <text class="txt" x="378" y="252" text-anchor="middle">deep tree 2</text>
  <rect class="box" x="330" y="276" width="96" height="28" rx="4"/>
  <text class="txt" x="378" y="294" text-anchor="middle">deep tree B</text>

  <rect class="box" x="500" y="228" width="126" height="40" rx="4"/>
  <text class="txt" x="563" y="246" text-anchor="middle">plain majority</text>
  <text class="small" x="563" y="261" text-anchor="middle">vote / average</text>

  <!-- fan out -->
  <line class="arrowb" x1="110" y1="240" x2="176" y2="206"/>
  <line class="arrowb" x1="110" y1="248" x2="176" y2="248"/>
  <line class="arrowb" x1="110" y1="256" x2="176" y2="290"/>
  <!-- resample -> tree -->
  <line class="arrow" x1="276" y1="206" x2="326" y2="206"/>
  <line class="arrow" x1="276" y1="248" x2="326" y2="248"/>
  <line class="arrow" x1="276" y1="290" x2="326" y2="290"/>
  <!-- fan in -->
  <line class="arrow" x1="426" y1="206" x2="496" y2="240"/>
  <line class="arrow" x1="426" y1="248" x2="496" y2="248"/>
  <line class="arrow" x1="426" y1="290" x2="496" y2="256"/>

  <text class="muted" x="46" y="326">bootstrap resamples are drawn independently; the B fits never see each other until the vote</text>
</svg>

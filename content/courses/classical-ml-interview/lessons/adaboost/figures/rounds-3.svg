<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; font-size: 13px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .small { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .axis  { stroke: currentColor; stroke-opacity: 0.35; stroke-width: 1; fill: none; }
    .stump { stroke: currentColor; stroke-width: 2.2; }
    .stumpdim { stroke: currentColor; stroke-width: 1.6; stroke-opacity: 0.3; stroke-dasharray: 5 4; }
    .ring  { stroke: currentColor; stroke-width: 1.6; stroke-dasharray: 4 3; fill: none; opacity: 0.85; }
    .pt    { fill: currentColor; opacity: 0.6; font-size: 11px; }
  </style>

  <rect class="axis" x="50" y="50" width="400" height="280" rx="3"/>
  <line class="axis" x1="170" y1="330" x2="170" y2="336"/>
  <text class="small" x="170" y="348" text-anchor="middle">3</text>
  <line class="axis" x1="330" y1="330" x2="330" y2="336"/>
  <text class="small" x="330" y="348" text-anchor="middle">7</text>
  <text class="muted" x="445" y="348" text-anchor="end">x&#8321;</text>
  <text class="muted" x="38" y="62">x&#8322;</text>

  <circle cx="60" cy="356" r="5" fill="#e2903a"/>
  <text class="small" x="70" y="360">y = +1</text>
  <circle cx="125" cy="356" r="5" fill="#4c8dd6"/>
  <text class="small" x="135" y="360">y = &#8722;1</text>

  <!-- stump 1 dimmed, stump 2 active -->
  <line class="stumpdim" x1="170" y1="50" x2="170" y2="330"/>
  <line class="stump" x1="330" y1="50" x2="330" y2="330"/>
  <text class="small" x="322" y="66" text-anchor="end">+1</text>
  <text class="small" x="338" y="66">&#8722;1</text>

  <!-- misses ringed: F, G, H -->
  <circle class="ring" cx="210" cy="246" r="12"/>
  <circle class="ring" cx="250" cy="302" r="12"/>
  <circle class="ring" cx="290" cy="218" r="12"/>

  <!-- points, weights as after round 1 -->
  <circle cx="90"  cy="246" r="7.0" fill="#e2903a"/>
  <circle cx="130" cy="274" r="7.0" fill="#e2903a"/>
  <circle cx="210" cy="106" r="10.6" fill="#e2903a"/>
  <circle cx="250" cy="162" r="10.6" fill="#e2903a"/>
  <circle cx="290" cy="78"  r="10.6" fill="#e2903a"/>
  <circle cx="210" cy="246" r="7.0" fill="#4c8dd6"/>
  <circle cx="250" cy="302" r="7.0" fill="#4c8dd6"/>
  <circle cx="290" cy="218" r="7.0" fill="#4c8dd6"/>
  <circle cx="410" cy="134" r="7.0" fill="#4c8dd6"/>
  <circle cx="370" cy="274" r="7.0" fill="#4c8dd6"/>

  <text class="pt" x="90"  y="231" text-anchor="middle">A</text>
  <text class="pt" x="130" y="259" text-anchor="middle">B</text>
  <text class="pt" x="210" y="91"  text-anchor="middle">C</text>
  <text class="pt" x="250" y="147" text-anchor="middle">D</text>
  <text class="pt" x="290" y="63"  text-anchor="middle">E</text>
  <text class="pt" x="210" y="231" text-anchor="middle">F</text>
  <text class="pt" x="250" y="322" text-anchor="middle">G</text>
  <text class="pt" x="290" y="203" text-anchor="middle">H</text>
  <text class="pt" x="410" y="119" text-anchor="middle">I</text>
  <text class="pt" x="370" y="259" text-anchor="middle">J</text>

  <!-- panel -->
  <text class="label" x="470" y="76" font-weight="bold">Round 2</text>
  <text class="muted" x="470" y="100">h&#8322; = +1 iff x&#8321; &lt; 7</text>
  <text class="muted" x="470" y="122">(h&#8321; now scores &#949; = &#189;)</text>
  <text class="muted" x="470" y="144">misses: F, G, H</text>
  <text class="muted" x="470" y="162">(weight 1/14 each)</text>
  <text class="label" x="470" y="192">&#949;&#8322; = 3/14 &#8776; 0.21</text>
  <text class="label" x="470" y="214">&#945;&#8322; = &#189; ln(11/3)</text>
  <text class="label" x="470" y="234">&#8776; 0.65</text>
</svg>

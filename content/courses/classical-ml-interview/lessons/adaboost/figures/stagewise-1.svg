<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; font-size: 13px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .math  { fill: currentColor; font-size: 14px; }
    .sub   { fill: currentColor; font-size: 10px; }
    .hot   { fill: #e2903a; }
    .badgehot { fill: none; stroke: #e2903a; stroke-width: 2; }
    .badge { fill: none; stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.4; }
    .num   { fill: currentColor; opacity: 0.7; font-size: 12px; }
    .numhot { fill: #e2903a; font-size: 12px; font-weight: bold; }
  </style>

  <text class="label" x="320" y="34" text-anchor="middle" font-weight="bold">Stage t: F&#8348;&#8331;&#8321; is frozen; choose &#945; and h</text>

  <!-- row 1 (active) -->
  <circle class="badgehot" cx="44" cy="72" r="11"/>
  <text class="numhot" x="44" y="76" text-anchor="middle">1</text>
  <text class="math hot" x="66" y="76">min</text>
  <text class="sub hot" x="94" y="82">&#945;, h</text>
  <text class="math hot" x="120" y="76">&#8721;&#7522; exp( &#8722;y&#7522; F&#8348;&#8331;&#8321;(x&#7522;) &#8722; &#945; y&#7522; h(x&#7522;) )</text>
  <text class="muted" x="66" y="98">the stagewise exponential-loss objective: one new term per stage</text>
</svg>

<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; font-size: 13px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .math  { fill: currentColor; font-size: 14px; }
    .sub   { fill: currentColor; font-size: 10px; }
    .hot   { fill: #e2903a; }
    .badgehot { fill: none; stroke: #e2903a; stroke-width: 2; }
    .badge { fill: none; stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.4; }
    .num   { fill: currentColor; opacity: 0.7; font-size: 12px; }
    .numhot { fill: #e2903a; font-size: 12px; font-weight: bold; }
    .box   { fill: none; stroke: #e2903a; stroke-width: 1.8; }
  </style>

  <text class="label" x="320" y="34" text-anchor="middle" font-weight="bold">Stage t: F&#8348;&#8331;&#8321; is frozen; choose &#945; and h</text>

  <!-- row 1 (done) -->
  <circle class="badge" cx="44" cy="72" r="11"/>
  <text class="num" x="44" y="76" text-anchor="middle">1</text>
  <text class="math" x="66" y="76">min</text>
  <text class="sub" x="94" y="82">&#945;, h</text>
  <text class="math" x="120" y="76">&#8721;&#7522; exp( &#8722;y&#7522; F&#8348;&#8331;&#8321;(x&#7522;) &#8722; &#945; y&#7522; h(x&#7522;) )</text>
  <text class="muted" x="66" y="98">the stagewise exponential-loss objective: one new term per stage</text>

  <!-- row 2 (done) -->
  <circle class="badge" cx="44" cy="142" r="11"/>
  <text class="num" x="44" y="146" text-anchor="middle">2</text>
  <text class="math" x="66" y="146">= &#8721;&#7522; w&#7522;&#8317;&#7511;&#8318; exp(&#8722;&#945; y&#7522; h(x&#7522;)),</text>
  <text class="math" x="310" y="146">w&#7522;&#8317;&#7511;&#8318; = exp(&#8722;y&#7522; F&#8348;&#8331;&#8321;(x&#7522;))</text>
  <text class="muted" x="66" y="168">the frozen factor = AdaBoost&#8217;s weights</text>

  <!-- row 3 (done) -->
  <circle class="badge" cx="44" cy="212" r="11"/>
  <text class="num" x="44" y="216" text-anchor="middle">3</text>
  <text class="math" x="66" y="216">= e&#8315;&#7525;(1 &#8722; &#949;) + e&#7525;&#949;</text>
  <text class="muted" x="252" y="216">best h: minimize the weighted error &#949;</text>

  <!-- row 4 (active): solve for alpha -->
  <circle class="badgehot" cx="44" cy="272" r="11"/>
  <text class="numhot" x="44" y="276" text-anchor="middle">4</text>
  <text class="math" x="66" y="276">d/d&#945; = 0  &#8658;  e&#178;&#7525; = (1&#8722;&#949;)/&#949;  &#8658;</text>
  <rect class="box" x="322" y="256" width="164" height="30" rx="4"/>
  <text class="math hot" x="334" y="276">&#945; = &#189; ln( (1&#8722;&#949;)/&#949; )</text>
  <text class="muted" x="500" y="276">= AdaBoost&#8217;s vote</text>
</svg>

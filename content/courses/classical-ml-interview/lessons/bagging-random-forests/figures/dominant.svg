<svg viewBox="0 0 640 250" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; font-size: 13px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .panel { stroke: currentColor; stroke-opacity: 0.35; stroke-width: 1; fill: none; }
    .edge  { stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.2; }
    .root  { fill: #e2903a; fill-opacity: 0.22; stroke: #e2903a; stroke-width: 1.4; }
    .roottext { fill: #e2903a; font-size: 13px; font-weight: 600; }
    .leaf  { fill: none; stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1; }
    .leaftext { fill: currentColor; opacity: 0.55; font-size: 11px; }
  </style>

  <text class="label" x="160" y="22" text-anchor="middle">bagging: every root is the strong feature x&#8321;</text>
  <text class="label" x="480" y="22" text-anchor="middle">random forest (m = &#8730;p): roots diverge</text>

  <rect class="panel" x="20" y="34" width="280" height="176" rx="4"/>
  <rect class="panel" x="340" y="34" width="280" height="176" rx="4"/>

  <!-- left: three trees, all rooted x1 -->
  <g>
    <!-- tree 1 -->
    <line class="edge" x1="70" y1="78" x2="46" y2="118"/><line class="edge" x1="70" y1="78" x2="94" y2="118"/>
    <rect class="root" x="48" y="56" width="44" height="24" rx="4"/><text class="roottext" x="70" y="73" text-anchor="middle">x&#8321;</text>
    <rect class="leaf" x="28" y="118" width="36" height="20" rx="3"/><text class="leaftext" x="46" y="132" text-anchor="middle">x&#8324;</text>
    <rect class="leaf" x="76" y="118" width="36" height="20" rx="3"/><text class="leaftext" x="94" y="132" text-anchor="middle">x&#8322;</text>
    <!-- tree 2 -->
    <line class="edge" x1="160" y1="78" x2="136" y2="118"/><line class="edge" x1="160" y1="78" x2="184" y2="118"/>
    <rect class="root" x="138" y="56" width="44" height="24" rx="4"/><text class="roottext" x="160" y="73" text-anchor="middle">x&#8321;</text>
    <rect class="leaf" x="118" y="118" width="36" height="20" rx="3"/><text class="leaftext" x="136" y="132" text-anchor="middle">x&#8322;</text>
    <rect class="leaf" x="166" y="118" width="36" height="20" rx="3"/><text class="leaftext" x="184" y="132" text-anchor="middle">x&#8329;</text>
    <!-- tree 3 -->
    <line class="edge" x1="250" y1="78" x2="226" y2="118"/><line class="edge" x1="250" y1="78" x2="274" y2="118"/>
    <rect class="root" x="228" y="56" width="44" height="24" rx="4"/><text class="roottext" x="250" y="73" text-anchor="middle">x&#8321;</text>
    <rect class="leaf" x="208" y="118" width="36" height="20" rx="3"/><text class="leaftext" x="226" y="132" text-anchor="middle">x&#8327;</text>
    <rect class="leaf" x="256" y="118" width="36" height="20" rx="3"/><text class="leaftext" x="274" y="132" text-anchor="middle">x&#8322;</text>
    <text class="muted" x="160" y="168" text-anchor="middle">every resample still contains x&#8321;, so every</text>
    <text class="muted" x="160" y="184" text-anchor="middle">root scan picks it: similar trees, high &#961;</text>
  </g>

  <!-- right: three trees, roots differ -->
  <g>
    <!-- tree 1 -->
    <line class="edge" x1="390" y1="78" x2="366" y2="118"/><line class="edge" x1="390" y1="78" x2="414" y2="118"/>
    <rect class="root" x="368" y="56" width="44" height="24" rx="4"/><text class="roottext" x="390" y="73" text-anchor="middle">x&#8321;</text>
    <rect class="leaf" x="348" y="118" width="36" height="20" rx="3"/><text class="leaftext" x="366" y="132" text-anchor="middle">x&#8323;</text>
    <rect class="leaf" x="396" y="118" width="36" height="20" rx="3"/><text class="leaftext" x="414" y="132" text-anchor="middle">x&#8328;</text>
    <!-- tree 2 -->
    <line class="edge" x1="480" y1="78" x2="456" y2="118"/><line class="edge" x1="480" y1="78" x2="504" y2="118"/>
    <rect class="root" x="458" y="56" width="44" height="24" rx="4"/><text class="roottext" x="480" y="73" text-anchor="middle">x&#8327;</text>
    <rect class="leaf" x="438" y="118" width="36" height="20" rx="3"/><text class="leaftext" x="456" y="132" text-anchor="middle">x&#8321;</text>
    <rect class="leaf" x="486" y="118" width="36" height="20" rx="3"/><text class="leaftext" x="504" y="132" text-anchor="middle">x&#8322;</text>
    <!-- tree 3 -->
    <line class="edge" x1="570" y1="78" x2="546" y2="118"/><line class="edge" x1="570" y1="78" x2="594" y2="118"/>
    <rect class="root" x="548" y="56" width="44" height="24" rx="4"/><text class="roottext" x="570" y="73" text-anchor="middle">x&#8323;</text>
    <rect class="leaf" x="528" y="118" width="36" height="20" rx="3"/><text class="leaftext" x="546" y="132" text-anchor="middle">x&#8329;</text>
    <rect class="leaf" x="576" y="118" width="36" height="20" rx="3"/><text class="leaftext" x="594" y="132" text-anchor="middle">x&#8321;</text>
    <text class="muted" x="480" y="168" text-anchor="middle">a split's candidate set omits x&#8321; with prob (p&#8722;m)/p,</text>
    <text class="muted" x="480" y="184" text-anchor="middle">so tree structures diverge: &#961; drops</text>
  </g>

  <text class="muted" x="320" y="238" text-anchor="middle">the subsampling is drawn fresh at every split, not once per tree</text>
</svg>

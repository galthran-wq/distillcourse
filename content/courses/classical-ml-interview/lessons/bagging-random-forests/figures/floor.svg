<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; font-size: 13px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .axis  { stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1; fill: none; }
    .c07 { stroke: #e2903a; stroke-width: 2.4; fill: none; }
    .c03 { stroke: #4c8dd6; stroke-width: 2.2; fill: none; }
    .c00 { stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.8; fill: none; }
    .fl  { stroke-dasharray: 4 4; stroke-width: 1.2; fill: none; }
    .arrow { stroke: #5aa46a; stroke-width: 2; fill: none; }
    .arrowhead { fill: #5aa46a; }
  </style>

  <!-- axes -->
  <line class="axis" x1="55" y1="250" x2="610" y2="250"/>
  <line class="axis" x1="55" y1="250" x2="55" y2="24"/>
  <text class="muted" x="332" y="284" text-anchor="middle">number of trees B</text>
  <text class="muted" x="26" y="140" transform="rotate(-90 26 140)" text-anchor="middle">Var(ensemble) / &#963;&#178;</text>
  <text class="muted" x="55" y="266" text-anchor="middle">1</text>
  <text class="muted" x="257.5" y="266" text-anchor="middle">10</text>
  <text class="muted" x="482.5" y="266" text-anchor="middle">20</text>
  <text class="muted" x="48" y="34" text-anchor="end">1.0</text>
  <text class="muted" x="48" y="254" text-anchor="end">0</text>

  <!-- floors -->
  <line class="fl" x1="55" y1="96" x2="610" y2="96" stroke="#e2903a" stroke-opacity="0.7"/>
  <line class="fl" x1="55" y1="184" x2="610" y2="184" stroke="#4c8dd6" stroke-opacity="0.7"/>

  <!-- curves v(B) = rho + (1-rho)/B -->
  <polyline class="c07" points="55.0,30.0 77.5,63.0 100.0,74.0 122.5,79.5 145.0,82.8 167.5,85.0 190.0,86.6 212.5,87.8 235.0,88.7 257.5,89.4 280.0,90.0 302.5,90.5 325.0,90.9 347.5,91.3 370.0,91.6 392.5,91.9 415.0,92.1 437.5,92.3 460.0,92.5 482.5,92.7 505.0,92.9 527.5,93.0 550.0,93.1 572.5,93.3 595.0,93.4"/>
  <polyline class="c03" points="55.0,30.0 77.5,107.0 100.0,132.7 122.5,145.5 145.0,153.2 167.5,158.3 190.0,162.0 212.5,164.8 235.0,166.9 257.5,168.6 280.0,170.0 302.5,171.2 325.0,172.2 347.5,173.0 370.0,173.7 392.5,174.4 415.0,174.9 437.5,175.4 460.0,175.9 482.5,176.3 505.0,176.7 527.5,177.0 550.0,177.3 572.5,177.6 595.0,177.8"/>
  <polyline class="c00" points="55.0,30.0 77.5,140.0 100.0,176.7 122.5,195.0 145.0,206.0 167.5,213.3 190.0,218.6 212.5,222.5 235.0,225.6 257.5,228.0 280.0,230.0 302.5,231.7 325.0,233.1 347.5,234.3 370.0,235.3 392.5,236.2 415.0,237.1 437.5,237.8 460.0,238.4 482.5,239.0 505.0,239.5 527.5,240.0 550.0,240.4 572.5,240.8 595.0,241.2"/>

  <!-- curve labels -->
  <text class="label" x="440" y="82" fill="#e2903a">&#961; = 0.7 &#8594; floor 0.7&#963;&#178;</text>
  <text class="label" x="440" y="170" fill="#4c8dd6">&#961; = 0.3 &#8594; floor 0.3&#963;&#178;</text>
  <text class="muted" x="440" y="232">&#961; = 0 (i.i.d.) &#8594; &#963;&#178;/B &#8594; 0</text>

  <!-- feature-subsampling arrow: pushes the 0.7 floor down toward the 0.3 floor -->
  <line class="arrow" x1="330" y1="102" x2="330" y2="172"/>
  <polygon class="arrowhead" points="330,180 325,170 335,170"/>
  <text class="label" x="342" y="132" fill="#5aa46a">feature subsampling</text>
  <text class="label" x="342" y="148" fill="#5aa46a">pushes the floor down</text>
</svg>

  <text class="formula" x="60" y="34">Var(Z&#772;) = Var( (Z&#8321; + &#8230; + Z&#8342;)/B ) = (1/B&#178;) &#183; &#931;&#7522; &#931;&#11388; Cov(Z&#7522;, Z&#11388;)</text>


<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; font-size: 13px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .panel { stroke: currentColor; stroke-opacity: 0.35; stroke-width: 1; fill: none; }
    .bar { fill: currentColor; opacity: 0.35; }
    .junk { fill: #e2903a; }
    .sig  { fill: #4c8dd6; }
    .junktext { fill: #e2903a; font-size: 12px; }
    .sigtext  { fill: #4c8dd6; font-size: 12px; }
  </style>

  <text class="label" x="165" y="22" text-anchor="middle">impurity (Gini) importance</text>
  <text class="label" x="480" y="22" text-anchor="middle">OOB permutation importance</text>
  <text class="muted" x="165" y="40" text-anchor="middle">summed over training splits</text>
  <text class="muted" x="480" y="40" text-anchor="middle">error increase on shuffled OOB data</text>

  <!-- left panel: bars from x=95 -->
  <g>
    <text class="sigtext" x="88" y="76" text-anchor="end">x&#8321; (signal)</text>
    <rect class="sig" x="95" y="62" width="150" height="20" rx="2"/>
    <text class="muted" x="88" y="112" text-anchor="end">x&#8322;</text>
    <rect class="bar" x="95" y="98" width="62" height="20" rx="2"/>
    <text class="muted" x="88" y="148" text-anchor="end">x&#8323;</text>
    <rect class="bar" x="95" y="134" width="44" height="20" rx="2"/>
    <text class="junktext" x="88" y="184" text-anchor="end">ID (200 levels,</text>
    <text class="junktext" x="88" y="198" text-anchor="end">pure noise)</text>
    <rect class="junk" x="95" y="176" width="205" height="20" rx="2"/>
  </g>
  <text class="junktext" x="95" y="226">ranked first: many levels = many chances at a lucky split</text>

  <!-- right panel: bars from x=410 -->
  <g>
    <text class="sigtext" x="403" y="76" text-anchor="end">x&#8321; (signal)</text>
    <rect class="sig" x="410" y="62" width="190" height="20" rx="2"/>
    <text class="muted" x="403" y="112" text-anchor="end">x&#8322;</text>
    <rect class="bar" x="410" y="98" width="66" height="20" rx="2"/>
    <text class="muted" x="403" y="148" text-anchor="end">x&#8323;</text>
    <rect class="bar" x="410" y="134" width="46" height="20" rx="2"/>
    <text class="junktext" x="403" y="190" text-anchor="end">ID</text>
    <rect class="junk" x="410" y="176" width="7" height="20" rx="2"/>
  </g>
  <text class="junktext" x="410" y="226">&#8776; 0: shuffling noise leaves OOB error unchanged</text>

  <text class="muted" x="320" y="252" text-anchor="middle">same forest, same features: the two measures disagree exactly on the high-cardinality junk column</text>
</svg>

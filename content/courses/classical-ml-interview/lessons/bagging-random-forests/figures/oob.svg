<svg viewBox="0 0 640 270" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; font-size: 13px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .inbag { fill: none; stroke: currentColor; stroke-opacity: 0.3; stroke-width: 1.2; }
    .inbagtext { fill: currentColor; opacity: 0.35; font-size: 12px; }
    .oob { fill: #e2903a; fill-opacity: 0.18; stroke: #e2903a; stroke-width: 1.6; }
    .oobtext { fill: #e2903a; font-size: 12px; font-weight: 600; }
    .pt { fill: #e2903a; }
    .flow { stroke: #e2903a; stroke-width: 1.6; fill: none; }
    .ah { fill: #e2903a; }
    .box { fill: none; stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.2; }
  </style>

  <!-- the tracked point -->
  <circle class="pt" cx="60" cy="36" r="5"/>
  <text class="label" x="74" y="41">training point x&#8327;</text>
  <text class="muted" x="320" y="41">each tree's resample omits it with prob (1 &#8722; 1/n)&#8319; &#8776; 0.368</text>

  <!-- 9 trees: T3, T6, T8 are OOB -->
  <g>
    <rect class="inbag" x="40"  y="86" width="52" height="34" rx="4"/><text class="inbagtext" x="66"  y="107" text-anchor="middle">T&#8321;</text>
    <rect class="inbag" x="104" y="86" width="52" height="34" rx="4"/><text class="inbagtext" x="130" y="107" text-anchor="middle">T&#8322;</text>
    <rect class="oob"   x="168" y="86" width="52" height="34" rx="4"/><text class="oobtext" x="194" y="107" text-anchor="middle">T&#8323;</text>
    <rect class="inbag" x="232" y="86" width="52" height="34" rx="4"/><text class="inbagtext" x="258" y="107" text-anchor="middle">T&#8324;</text>
    <rect class="inbag" x="296" y="86" width="52" height="34" rx="4"/><text class="inbagtext" x="322" y="107" text-anchor="middle">T&#8325;</text>
    <rect class="oob"   x="360" y="86" width="52" height="34" rx="4"/><text class="oobtext" x="386" y="107" text-anchor="middle">T&#8326;</text>
    <rect class="inbag" x="424" y="86" width="52" height="34" rx="4"/><text class="inbagtext" x="450" y="107" text-anchor="middle">T&#8327;</text>
    <rect class="oob"   x="488" y="86" width="52" height="34" rx="4"/><text class="oobtext" x="514" y="107" text-anchor="middle">T&#8328;</text>
    <rect class="inbag" x="552" y="86" width="52" height="34" rx="4"/><text class="inbagtext" x="578" y="107" text-anchor="middle">T&#8329;</text>
  </g>
  <text class="muted" x="66" y="140">grayed: bootstrap sample contained x&#8327; &#8212; their votes on x&#8327; are training-set votes</text>
  <text class="oobtext" x="66" y="158">amber: never saw x&#8327; (&#8776; 0.368&#183;B trees) &#8212; honest votes</text>

  <!-- arrows from OOB trees to the vote box -->
  <line class="flow" x1="194" y1="120" x2="288" y2="196"/>
  <line class="flow" x1="386" y1="120" x2="326" y2="196"/>
  <line class="flow" x1="514" y1="120" x2="352" y2="196"/>
  <polygon class="ah" points="308,200 300,190 314,188"/>

  <rect class="box" x="170" y="200" width="300" height="34" rx="4"/>
  <text class="label" x="320" y="221" text-anchor="middle">OOB prediction for x&#8327; = vote of T&#8323;, T&#8326;, T&#8328; only</text>

  <text class="muted" x="320" y="258" text-anchor="middle">OOB error = average loss of these predictions over all n training points</text>
</svg>

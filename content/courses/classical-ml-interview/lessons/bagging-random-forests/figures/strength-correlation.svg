<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; font-size: 13px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .axis  { stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1; fill: none; }
    .s { stroke: #e2903a; stroke-width: 2.4; fill: none; }
    .r { stroke: #4c8dd6; stroke-width: 2.4; fill: none; }
    .band { fill: #5aa46a; fill-opacity: 0.14; stroke: #5aa46a; stroke-opacity: 0.5; stroke-dasharray: 3 3; }
  </style>

  <!-- axes -->
  <line class="axis" x1="60" y1="250" x2="610" y2="250"/>
  <line class="axis" x1="60" y1="250" x2="60" y2="24"/>
  <text class="muted" x="335" y="284" text-anchor="middle">features tried per split, m (schematic scale)</text>
  <text class="muted" x="62" y="266">1</text>
  <text class="muted" x="128" y="266" text-anchor="middle">&#8730;p</text>
  <text class="muted" x="330" y="266" text-anchor="middle">p/3</text>
  <text class="muted" x="600" y="266" text-anchor="middle">p (= bagging)</text>

  <!-- sweet-spot band -->
  <rect class="band" x="87" y="24" width="105" height="226"/>
  <text class="label" x="140" y="42" text-anchor="middle" fill="#5aa46a">error-minimizing m</text>

  <!-- strength curve: rises fast, plateaus -->
  <polyline class="s" points="60,140 87,100.4 114,85 141,80 168,76.2 222,74.5 276,74 330,73 384,72.4 438,71.8 492,71.2 546,70.7 600,69.6"/>
  <!-- correlation curve: keeps climbing -->
  <polyline class="r" points="60,223.6 87,206 114,190.6 141,180 168,166.4 222,157 276,148.8 330,138 384,130 438,122.4 492,112 546,102.6 600,82.8"/>

  <text class="label" x="410" y="60" fill="#e2903a">strength s(m): plateaus early &#8212;</text>
  <text class="label" x="410" y="76" fill="#e2903a">trees stay almost as accurate</text>
  <text class="label" x="300" y="196" fill="#4c8dd6">correlation &#961;&#772;(m): keeps climbing &#8212;</text>
  <text class="label" x="300" y="212" fill="#4c8dd6">large m re-correlates the forest</text>
</svg>

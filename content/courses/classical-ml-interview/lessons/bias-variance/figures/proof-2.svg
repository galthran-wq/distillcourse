<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .muted   { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .formula { fill: currentColor; font-size: 16px; }
    .strike  { stroke: currentColor; stroke-opacity: 0.7; stroke-width: 1.6; }
  </style>

  <text class="muted" x="40" y="30">setup: y = f + ε with E[ε] = 0, Var(ε) = σ², ε independent of D · all expectations over D and ε</text>
  <text class="muted" x="40" y="50">shorthand at the fixed test point x₀:  f = f(x₀),  f̂ = f̂_D(x₀),  f̄ = E_D[ f̂ ]</text>

  <text class="formula" x="40" y="100">E[(y − f̂)²]  =  E[( f + ε − f̂ )²]</text>
  <text class="muted" x="600" y="100" text-anchor="end">substitute y = f + ε</text>

  <text class="formula" x="76" y="142">=  E[( <tspan fill="#4c8dd6">(f − f̄)</tspan> + <tspan fill="#e2903a">(f̄ − f̂)</tspan> + ε )²]</text>
  <text class="muted" x="600" y="142" text-anchor="end">insert − f̄ + f̄, then group</text>
  <text class="muted" x="40" y="326" font-size="12.5" opacity="0.8">step 2: add and subtract the average prediction f̄</text>
</svg>

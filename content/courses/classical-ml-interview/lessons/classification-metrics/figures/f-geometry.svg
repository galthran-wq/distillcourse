<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; font-size: 12.5px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .tiny  { fill: currentColor; opacity: 0.55; font-size: 10px; }
    .axis  { stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.2; fill: none; }
    .lvl   { stroke: #4c8dd6; stroke-width: 1.6; fill: none; opacity: 0.85; }
  </style>

  <text class="label" x="150" y="30" text-anchor="middle" font-weight="600">arithmetic mean (P+R)/2</text>
  <text class="label" x="430" y="30" text-anchor="middle" font-weight="600">harmonic mean F₁ = 2PR/(P+R)</text>

  <!-- left panel: arithmetic level lines -->
  <path class="axis" d="M50 50 L50 250 L250 250"/>
  <polyline class="lvl" points="50.0,170.0 130.0,250.0"/>
  <polyline class="lvl" points="50.0,90.0 210.0,250.0"/>
  <polyline class="lvl" points="90.0,50.0 250.0,210.0"/>
  <polyline class="lvl" points="170.0,50.0 250.0,130.0"/>
  <text class="tiny" x="58" y="188">.2</text>
  <text class="tiny" x="58" y="108">.4</text>
  <text class="tiny" x="104" y="64">.6</text>
  <text class="tiny" x="184" y="64">.8</text>
  <circle cx="230" cy="230" r="4.5" fill="#e2903a"/>
  <text x="222" y="216" text-anchor="end" fill="#e2903a" font-size="12">(0.9, 0.1): mean = 0.50</text>
  <text class="muted" x="150" y="268" text-anchor="middle">precision P</text>
  <text class="muted" x="36" y="150" text-anchor="middle" transform="rotate(-90 36 150)">recall R</text>

  <!-- right panel: harmonic level curves -->
  <path class="axis" d="M330 50 L330 250 L530 250"/>
  <polyline class="lvl" points="353.7,121.6 356.2,165.4 359.3,186.8 362.9,198.9 367.0,206.4 371.6,211.5 376.7,215.0 382.2,217.6 388.3,219.5 394.8,221.1 401.7,222.3 409.1,223.2 416.9,224.0 425.1,224.7 433.8,225.2 442.9,225.7 452.3,226.1 462.2,226.4 472.6,226.7 483.3,227.0 494.4,227.2 505.8,227.4 517.7,227.6 530.0,227.8"/>
  <polyline class="lvl" points="381.4,70.0 385.1,103.9 389.2,126.6 393.7,142.5 398.7,154.2 404.0,163.0 409.8,169.8 415.9,175.2 422.5,179.5 429.4,183.1 436.8,186.0 444.5,188.5 452.5,190.6 461.0,192.4 469.8,194.0 478.9,195.3 488.4,196.5 498.3,197.5 508.5,198.5 519.1,199.3 530.0,200.0"/>
  <polyline class="lvl" points="419.8,69.0 424.8,86.6 430.2,100.5 435.9,111.6 442.0,120.8 448.4,128.4 455.2,134.8 462.2,140.2 469.6,144.8 477.3,148.8 485.3,152.2 493.6,155.3 502.3,157.9 511.2,160.3 520.5,162.4 530.0,164.3"/>
  <polyline class="lvl" points="465.9,55.4 471.9,66.6 478.2,76.2 484.8,84.5 491.7,91.7 498.8,98.0 506.2,103.5 513.9,108.4 521.8,112.8 530.0,116.7"/>
  <text class="tiny" x="368" y="234">.2</text>
  <text class="tiny" x="404" y="207">.4</text>
  <text class="tiny" x="447" y="176">.6</text>
  <text class="tiny" x="494" y="132">.8</text>
  <circle cx="510" cy="230" r="4.5" fill="#e2903a"/>
  <text x="502" y="216" text-anchor="end" fill="#e2903a" font-size="12">(0.9, 0.1): F₁ = 0.18</text>
  <text class="muted" x="430" y="268" text-anchor="middle">precision P</text>
  <text class="muted" x="316" y="150" text-anchor="middle" transform="rotate(-90 316 150)">recall R</text>

  <text class="muted" x="320" y="298" text-anchor="middle">harmonic level curves hug the axes: F₁ stays near min(P, R), so one weak component sinks the score</text>
</svg>

<svg viewBox="0 0 640 480" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; font-size: 12.5px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .tiny  { fill: currentColor; opacity: 0.55; font-size: 10px; }
    .axis  { stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.2; fill: none; }
    .guide { stroke: currentColor; stroke-opacity: 0.4; stroke-width: 1; stroke-dasharray: 3 3; }
  </style>

  <!-- column headers -->
  <text class="label" x="135" y="24" text-anchor="middle" font-weight="600">balanced: 1,000 + / 1,000 −</text>
  <text class="label" x="405" y="24" text-anchor="middle" font-weight="600">imbalanced: 1,000 + / 100,000 −</text>

  <!-- ROC row -->
  <text class="muted" x="30" y="125" text-anchor="middle" transform="rotate(-90 30 125)">ROC: TPR vs FPR</text>

  <!-- ROC left -->
  <path class="axis" d="M60 50 L60 200 L210 200"/>
  <line class="guide" x1="60" y1="200" x2="210" y2="50"/>
  <polyline fill="none" stroke="#e2903a" stroke-width="2.2" points="60.0,200.0 60.3,177.0 61.0,156.8 62.3,140.0 64.2,125.9 66.5,113.8 69.4,103.6 72.8,94.8 76.7,87.3 81.1,80.8 86.0,75.3 91.5,70.6 97.5,66.5 104.0,63.1 111.0,60.3 118.6,57.9 126.7,55.9 135.3,54.3 144.4,53.0 154.0,52.0 164.2,51.2 174.8,50.7 186.0,50.3 197.8,50.1 210.0,50.0"/>
  <circle cx="75" cy="90.2" r="4" fill="#e2903a"/>
  <text class="tiny" x="84" y="106">t = 0.5: TPR .73, FPR .10</text>
  <text class="tiny" x="84" y="119">TP 730, FP 100</text>

  <!-- ROC right -->
  <path class="axis" d="M330 50 L330 200 L480 200"/>
  <line class="guide" x1="330" y1="200" x2="480" y2="50"/>
  <polyline fill="none" stroke="#e2903a" stroke-width="2.2" points="330.0,200.0 330.3,177.0 331.0,156.8 332.3,140.0 334.2,125.9 336.5,113.8 339.4,103.6 342.8,94.8 346.7,87.3 351.1,80.8 356.0,75.3 361.5,70.6 367.5,66.5 374.0,63.1 381.0,60.3 388.6,57.9 396.7,55.9 405.3,54.3 414.4,53.0 424.0,52.0 434.2,51.2 444.8,50.7 456.0,50.3 467.8,50.1 480.0,50.0"/>
  <circle cx="345" cy="90.2" r="4" fill="#e2903a"/>
  <text class="tiny" x="354" y="106">t = 0.5: TPR .73, FPR .10</text>
  <text class="tiny" x="354" y="119">TP 730, FP 10,000</text>

  <!-- identical annotation -->
  <text class="label" x="270" y="120" text-anchor="middle">same</text>
  <text class="label" x="270" y="136" text-anchor="middle">curve</text>

  <!-- PR row -->
  <text class="muted" x="30" y="345" text-anchor="middle" transform="rotate(-90 30 345)">PR: precision vs recall</text>

  <!-- PR left -->
  <path class="axis" d="M60 270 L60 420 L210 420"/>
  <line class="guide" x1="60" y1="345" x2="210" y2="345"/>
  <text class="tiny" x="205" y="340" text-anchor="end">baseline = prevalence = 0.5</text>
  <polyline fill="none" stroke="#e2903a" stroke-width="2.2" points="85.2,271.9 98.8,273.1 112.2,274.6 124.3,276.3 135.0,278.2 144.6,280.2 153.0,282.3 160.5,284.6 167.1,286.9 173.0,289.4 178.2,292.0 182.7,294.6 186.8,297.4 190.4,300.1 193.5,303.0 196.3,305.8 198.7,308.7 200.8,311.6 202.6,314.6 204.1,317.5 205.5,320.4 206.6,323.3 207.5,326.1 208.2,329.0 208.8,331.8 209.3,334.5 209.6,337.2 209.8,339.9 210.0,342.5 210.0,345.0"/>
  <circle cx="169.8" cy="288.0" r="4" fill="#e2903a"/>
  <text class="tiny" x="163" y="278" text-anchor="end">t = 0.5: P = 730/830 = 0.88</text>

  <!-- PR right -->
  <path class="axis" d="M330 270 L330 420 L480 420"/>
  <line class="guide" x1="330" y1="418.5" x2="480" y2="418.5"/>
  <text class="tiny" x="475" y="432" text-anchor="end">baseline = prevalence ≈ 0.01</text>
  <polyline fill="none" stroke="#e2903a" stroke-width="2.2" points="355.2,353.5 368.8,371.6 382.2,383.9 394.3,392.1 405.0,397.8 414.6,401.9 423.0,404.9 430.5,407.2 437.1,409.1 443.0,410.6 448.2,411.7 452.7,412.7 456.8,413.6 460.4,414.3 463.5,414.9 466.3,415.4 468.7,415.8 470.8,416.2 472.6,416.5 474.1,416.8 475.5,417.1 476.6,417.3 477.5,417.5 478.2,417.7 478.8,417.9 479.3,418.0 479.6,418.2 479.8,418.3 480.0,418.4 480.0,418.5"/>
  <circle cx="439.8" cy="409.8" r="4" fill="#e2903a"/>
  <text class="tiny" x="440" y="398">t = 0.5: P = 730/10,730 = 0.07</text>

  <!-- collapse annotation -->
  <text class="label" x="270" y="340" text-anchor="middle">precision</text>
  <text class="label" x="270" y="356" text-anchor="middle">collapses</text>

  <!-- shared axis labels -->
  <text class="muted" x="135" y="216" text-anchor="middle">FPR</text>
  <text class="muted" x="405" y="216" text-anchor="middle">FPR</text>
  <text class="muted" x="135" y="446" text-anchor="middle">recall</text>
  <text class="muted" x="405" y="446" text-anchor="middle">recall</text>

  <text class="muted" x="320" y="470" text-anchor="middle">one classifier, two prevalences: TPR and FPR do not move, precision divides TP by TP + a 100× larger FP</text>
</svg>

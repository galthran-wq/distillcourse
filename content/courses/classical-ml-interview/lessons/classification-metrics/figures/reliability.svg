<svg viewBox="0 0 520 340" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; font-size: 12.5px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .tiny  { fill: currentColor; opacity: 0.55; font-size: 10px; }
    .axis  { stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.2; fill: none; }
    .guide { stroke: currentColor; stroke-opacity: 0.4; stroke-width: 1; stroke-dasharray: 3 3; }
  </style>

  <!-- axes -->
  <path class="axis" d="M60 40 L60 280 L380 280"/>
  <text class="muted" x="60" y="296" text-anchor="middle">0</text>
  <text class="muted" x="220" y="296" text-anchor="middle">0.5</text>
  <text class="muted" x="380" y="296" text-anchor="middle">1</text>
  <text class="muted" x="52" y="284" text-anchor="end">0</text>
  <text class="muted" x="52" y="164" text-anchor="end">0.5</text>
  <text class="muted" x="52" y="46" text-anchor="end">1</text>
  <text class="label" x="220" y="316" text-anchor="middle">mean predicted probability in bin</text>
  <text class="label" x="20" y="160" text-anchor="middle" transform="rotate(-90 20 160)">observed fraud fraction in bin</text>

  <!-- perfect calibration diagonal -->
  <line class="guide" x1="60" y1="280" x2="380" y2="40"/>
  <text class="muted" x="285" y="140" transform="rotate(-37 285 140)">perfect calibration</text>

  <!-- raw (overconfident) model: bin centers .15 .4 .6 .8 .95 vs observed .011 .071 .263 .69 .88 -->
  <polyline fill="none" stroke="#e2903a" stroke-width="2.2" points="108,277.4 188,263.0 252,216.9 316,114.4 364,68.8"/>
  <circle cx="108" cy="277.4" r="4" fill="#e2903a"/>
  <circle cx="188" cy="263.0" r="4" fill="#e2903a"/>
  <circle cx="252" cy="216.9" r="4" fill="#e2903a"/>
  <circle cx="316" cy="114.4" r="4" fill="#e2903a"/>
  <circle cx="364" cy="68.8" r="4" fill="#e2903a"/>
  <text x="238" y="250" fill="#e2903a" font-size="12.5" font-weight="600">raw scores: Brier 0.095</text>
  <text class="tiny" x="196" y="276">bin .3–.5 claims ≈ .4, delivers .07</text>

  <!-- recalibrated model: predictions equal observed frequencies, on the diagonal -->
  <polyline fill="none" stroke="#4c8dd6" stroke-width="2" points="63.5,277.4 82.7,263.0 144.2,216.9 280.8,114.4 341.6,68.8"/>
  <circle cx="63.5" cy="277.4" r="4" fill="#4c8dd6"/>
  <circle cx="82.7" cy="263.0" r="4" fill="#4c8dd6"/>
  <circle cx="144.2" cy="216.9" r="4" fill="#4c8dd6"/>
  <circle cx="280.8" cy="114.4" r="4" fill="#4c8dd6"/>
  <circle cx="341.6" cy="68.8" r="4" fill="#4c8dd6"/>
  <text x="76" y="212" fill="#4c8dd6" font-size="12.5">recalibrated: Brier 0.052</text>
  <text class="tiny" x="76" y="227">same ranking, same ROC</text>

  <text class="muted" x="220" y="336" text-anchor="middle">the fraud model's five score bins: every bin's observed rate falls below its predicted rate — overconfidence</text>
</svg>

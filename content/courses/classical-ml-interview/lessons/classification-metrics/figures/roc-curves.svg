<svg viewBox="0 0 520 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; font-size: 12.5px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .axis  { stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.2; fill: none; }
    .guide { stroke: currentColor; stroke-opacity: 0.4; stroke-width: 1; stroke-dasharray: 3 3; }
  </style>

  <!-- axes -->
  <path class="axis" d="M60 40 L60 280 L380 280"/>
  <text class="muted" x="60" y="296" text-anchor="middle">0</text>
  <text class="muted" x="220" y="296" text-anchor="middle">0.5</text>
  <text class="muted" x="380" y="296" text-anchor="middle">1</text>
  <text class="muted" x="52" y="284" text-anchor="end">0</text>
  <text class="muted" x="52" y="164" text-anchor="end">0.5</text>
  <text class="muted" x="52" y="46" text-anchor="end">1</text>
  <text class="label" x="220" y="316" text-anchor="middle">FPR (false-positive rate)</text>
  <text class="label" x="20" y="160" text-anchor="middle" transform="rotate(-90 20 160)">TPR (true-positive rate)</text>

  <!-- chance diagonal -->
  <line class="guide" x1="60" y1="280" x2="380" y2="40"/>
  <text class="muted" x="240" y="180" transform="rotate(-37 240 180)">chance: AUC = 0.5</text>

  <!-- anti-diagonal for EER -->
  <line x1="60" y1="40" x2="380" y2="280" stroke="currentColor" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="2 4"/>

  <!-- mediocre classifier -->
  <polyline fill="none" stroke="#4c8dd6" stroke-width="2.2" points="60.0,280.0 60.4,277.6 61.4,272.7 63.2,266.5 65.7,259.2 68.9,251.2 72.8,242.5 77.4,233.4 82.8,224.0 88.8,214.2 95.6,204.3 103.0,194.2 111.2,184.1 120.1,173.9 129.7,163.8 140.0,153.7 151.0,143.8 162.8,134.0 175.2,124.3 188.4,114.9 202.2,105.8 216.8,97.0 232.1,88.5 248.1,80.3 264.8,72.6 282.2,65.4 300.4,58.7 319.2,52.7 338.8,47.4 359.0,42.9 380.0,40.0"/>
  <text x="196" y="132" fill="#4c8dd6" font-size="12.5">mediocre: AUC = 0.70</text>

  <!-- good classifier -->
  <polyline fill="none" stroke="#e2903a" stroke-width="2.4" points="60.0,280.0 60.4,250.4 61.4,223.1 63.2,199.6 65.7,179.2 68.9,161.4 72.8,145.8 77.4,132.0 82.8,119.9 88.8,109.1 95.6,99.6 103.0,91.2 111.2,83.8 120.1,77.3 129.7,71.5 140.0,66.4 151.0,62.0 162.8,58.1 175.2,54.8 188.4,51.9 202.2,49.4 216.8,47.3 232.1,45.5 248.1,44.1 264.8,42.9 282.2,41.9 300.4,41.2 319.2,40.7 338.8,40.3 359.0,40.1 380.0,40.0"/>
  <text x="120" y="60" fill="#e2903a" font-size="12.5" font-weight="600">good: AUC = 0.91</text>

  <!-- EER marker on good curve -->
  <circle cx="114.7" cy="81.0" r="4" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text class="muted" x="126" y="98">EER ≈ 0.17: FPR = FNR</text>

  <text class="muted" x="220" y="264" text-anchor="middle">every point on a curve is one threshold's (FPR, TPR)</text>
</svg>

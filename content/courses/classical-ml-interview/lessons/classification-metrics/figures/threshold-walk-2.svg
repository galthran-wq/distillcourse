<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; font-size: 12.5px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .tiny  { fill: currentColor; opacity: 0.55; font-size: 10px; }
    .axis  { stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.2; fill: none; }
    .guide { stroke: currentColor; stroke-opacity: 0.4; stroke-width: 1; stroke-dasharray: 3 3; }
  </style>

  <!-- legend -->
  <rect x="50" y="24" width="11" height="11" fill="#4c8dd6" opacity="0.85" rx="2"/>
  <text class="label" x="66" y="34">legitimate (900)</text>
  <rect x="180" y="24" width="11" height="11" fill="#e2903a" opacity="0.9" rx="2"/>
  <text class="label" x="196" y="34">fraud (100)</text>
  <text class="tiny" x="50" y="50">bar heights scaled within each class; counts above bars</text>

  <!-- flagged region -->
  <rect x="170" y="66" width="180" height="194" fill="currentColor" opacity="0.05"/>

  <!-- histogram -->
  <rect x="57" y="140" width="21" height="120" fill="#4c8dd6" opacity="0.85" rx="2"/>
  <rect x="82" y="239" width="21" height="21" fill="#e2903a" opacity="0.9" rx="2"/>
  <text class="tiny" x="67.5" y="136" text-anchor="middle">640</text>
  <text class="tiny" x="92.5" y="235" text-anchor="middle">7</text>
  <text class="muted" x="80" y="277" text-anchor="middle">0–.3</text>
  <rect x="117" y="228" width="21" height="32" fill="#4c8dd6" opacity="0.85" rx="2"/>
  <rect x="142" y="221" width="21" height="39" fill="#e2903a" opacity="0.9" rx="2"/>
  <text class="tiny" x="127.5" y="224" text-anchor="middle">170</text>
  <text class="tiny" x="152.5" y="217" text-anchor="middle">13</text>
  <text class="muted" x="140" y="277" text-anchor="middle">.3–.5</text>
  <rect x="177" y="247" width="21" height="13" fill="#4c8dd6" opacity="0.85" rx="2"/>
  <rect x="202" y="185" width="21" height="75" fill="#e2903a" opacity="0.9" rx="2"/>
  <text class="tiny" x="187.5" y="243" text-anchor="middle">70</text>
  <text class="tiny" x="212.5" y="181" text-anchor="middle">25</text>
  <text class="muted" x="200" y="277" text-anchor="middle">.5–.7</text>
  <rect x="237" y="257" width="21" height="3" fill="#4c8dd6" opacity="0.85" rx="2"/>
  <rect x="262" y="140" width="21" height="120" fill="#e2903a" opacity="0.9" rx="2"/>
  <text class="tiny" x="247.5" y="253" text-anchor="middle">18</text>
  <text class="tiny" x="272.5" y="136" text-anchor="middle">40</text>
  <text class="muted" x="260" y="277" text-anchor="middle">.7–.9</text>
  <rect x="297" y="259" width="21" height="1" fill="#4c8dd6" opacity="0.85" rx="2"/>
  <rect x="322" y="215" width="21" height="45" fill="#e2903a" opacity="0.9" rx="2"/>
  <text class="tiny" x="307.5" y="255" text-anchor="middle">2</text>
  <text class="tiny" x="332.5" y="211" text-anchor="middle">15</text>
  <text class="muted" x="320" y="277" text-anchor="middle">.9–1</text>
  <path class="axis" d="M45 260 L355 260"/>
  <text class="muted" x="200" y="296" text-anchor="middle">model score</text>

  <!-- threshold -->
  <line x1="170" y1="66" x2="170" y2="266" stroke="currentColor" stroke-width="1.8" stroke-dasharray="5 3"/>
  <text class="label" x="176" y="76" text-anchor="start" font-weight="600">t = 0.5</text>
  <text class="tiny" x="176" y="90" text-anchor="start">score ≥ t ⇒ flag</text>

  <!-- confusion matrix -->
  <text class="label" x="515" y="44" text-anchor="middle">confusion matrix at t = 0.5</text>
  <text class="muted" x="485" y="64" text-anchor="middle">fraud</text>
  <text class="muted" x="545" y="64" text-anchor="middle">legit</text>
  <text class="muted" x="450" y="86" text-anchor="end">flag</text>
  <text class="muted" x="450" y="111" text-anchor="end">pass</text>
  <rect x="455" y="70" width="120" height="50" fill="none" stroke="currentColor" stroke-opacity="0.4" rx="3"/>
  <line x1="515" y1="70" x2="515" y2="120" stroke="currentColor" stroke-opacity="0.4"/>
  <line x1="455" y1="95" x2="575" y2="95" stroke="currentColor" stroke-opacity="0.4"/>
  <text x="485" y="87" text-anchor="middle" fill="#e2903a" font-weight="600">80</text>
  <text x="545" y="87" text-anchor="middle" fill="currentColor">90</text>
  <text x="485" y="112" text-anchor="middle" fill="currentColor">20</text>
  <text x="545" y="112" text-anchor="middle" fill="currentColor">810</text>
  <text class="label" x="455" y="142"><tspan fill="#e2903a">TPR = 80/100 = 0.80</tspan></text>
  <text class="label" x="455" y="159"><tspan fill="#4c8dd6">FPR = 90/900 = 0.10</tspan></text>
  <text class="label" x="455" y="176">precision = 80/170 = 0.47</text>

  <!-- ROC inset -->
  <text class="muted" x="530" y="200" text-anchor="middle">ROC, one point per t</text>
  <path class="axis" d="M470 190 L470 310 L590 310"/>
  <line class="guide" x1="470" y1="310" x2="590" y2="190"/>
  <text class="tiny" x="470" y="322" text-anchor="middle">0</text>
  <text class="tiny" x="590" y="322" text-anchor="middle">1</text>
  <text class="tiny" x="462" y="314" text-anchor="end">0</text>
  <text class="tiny" x="462" y="196" text-anchor="end">1</text>
  <text x="530" y="334" text-anchor="middle" fill="#4c8dd6" font-size="11">FPR</text>
  <text x="452" y="255" text-anchor="middle" fill="#e2903a" font-size="11" transform="rotate(-90 452 255)">TPR</text>
  <polyline points="504.7,198.4 482,214" fill="none" stroke="#e2903a" stroke-width="1.3" opacity="0.5"/>
  <circle cx="504.7" cy="198.4" r="3" fill="#e2903a" opacity="0.55"/>
  <circle cx="482" cy="214" r="4.5" fill="#e2903a"/>
  <circle cx="482" cy="214" r="7" fill="none" stroke="#e2903a" stroke-width="1.3"/>
  <text class="tiny" x="492" y="218" text-anchor="start">(0.10, 0.80)</text>
</svg>

<svg viewBox="0 0 640 310" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; font-size: 13px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .box   { stroke: currentColor; stroke-opacity: 0.45; fill: none; }
    .arrow { stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.4; fill: none; }
    .bar   { fill: #4c8dd6; opacity: 0.8; }
  </style>

  <!-- original sample -->
  <text class="muted" x="30" y="40">original sample</text>
  <rect class="box" x="30" y="52" width="120" height="90" rx="6"/>
  <text class="label" x="90" y="76" text-anchor="middle">Z = {z₁, z₂, z₃}</text>
  <circle cx="60" cy="112" r="10" fill="#e2903a" opacity="0.9"/><text class="muted" x="60" y="134" text-anchor="middle">z₁</text>
  <circle cx="90" cy="112" r="10" fill="#4c8dd6" opacity="0.9"/><text class="muted" x="90" y="134" text-anchor="middle">z₂</text>
  <circle cx="120" cy="112" r="10" fill="#5aa46a" opacity="0.9"/><text class="muted" x="120" y="134" text-anchor="middle">z₃</text>
  <text class="muted" x="30" y="170">α̂ = 0.58 on Z</text>

  <!-- resamples -->
  <text class="muted" x="230" y="26">resample n = 3 with replacement, B times</text>
  <path class="arrow" d="M 152 80 L 218 52"/><polygon points="218,52 208,53 212,61" fill="currentColor" opacity="0.5"/>
  <path class="arrow" d="M 152 100 L 218 128"/><polygon points="218,128 208,127 212,119" fill="currentColor" opacity="0.5"/>
  <path class="arrow" d="M 152 120 L 218 232"/><polygon points="218,232 209,228 214,221" fill="currentColor" opacity="0.5"/>

  <rect class="box" x="222" y="38" width="140" height="46" rx="6"/>
  <text class="label" x="232" y="56">Z*¹</text>
  <circle cx="284" cy="61" r="9" fill="#e2903a" opacity="0.9"/>
  <circle cx="310" cy="61" r="9" fill="#5aa46a" opacity="0.9"/>
  <circle cx="336" cy="61" r="9" fill="#5aa46a" opacity="0.9"/>
  <text class="label" x="400" y="66">→ α̂*¹ = 0.51</text>

  <rect class="box" x="222" y="108" width="140" height="46" rx="6"/>
  <text class="label" x="232" y="126">Z*²</text>
  <circle cx="284" cy="131" r="9" fill="#4c8dd6" opacity="0.9"/>
  <circle cx="310" cy="131" r="9" fill="#e2903a" opacity="0.9"/>
  <circle cx="336" cy="131" r="9" fill="#4c8dd6" opacity="0.9"/>
  <text class="label" x="400" y="136">→ α̂*² = 0.67</text>

  <text class="label" x="292" y="188" text-anchor="middle">⋮</text>

  <rect class="box" x="222" y="210" width="140" height="46" rx="6"/>
  <text class="label" x="232" y="228">Z*ᴮ</text>
  <circle cx="284" cy="233" r="9" fill="#5aa46a" opacity="0.9"/>
  <circle cx="310" cy="233" r="9" fill="#e2903a" opacity="0.9"/>
  <circle cx="336" cy="233" r="9" fill="#e2903a" opacity="0.9"/>
  <text class="label" x="400" y="238">→ α̂*ᴮ = 0.55</text>

  <text class="muted" x="292" y="282" text-anchor="middle">repeats are the point: each resample re-weights the data</text>

  <!-- histogram -->
  <text class="muted" x="555" y="96" text-anchor="middle">B values of α̂*</text>
  <g>
    <rect class="bar" x="500" y="196" width="16" height="14"/>
    <rect class="bar" x="518" y="166" width="16" height="44"/>
    <rect class="bar" x="536" y="126" width="16" height="84"/>
    <rect class="bar" x="554" y="140" width="16" height="70"/>
    <rect class="bar" x="572" y="176" width="16" height="34"/>
    <rect class="bar" x="590" y="198" width="16" height="12"/>
    <line x1="494" y1="210" x2="612" y2="210" stroke="currentColor" stroke-opacity="0.35"/>
  </g>
  <path class="arrow" d="M 518 232 L 518 222 M 518 227 L 588 227 M 588 232 L 588 222"/>
  <text class="label" x="553" y="252" text-anchor="middle">SE_B(α̂)</text>
  <text class="muted" x="553" y="270" text-anchor="middle">= sd of the B values</text>
</svg>

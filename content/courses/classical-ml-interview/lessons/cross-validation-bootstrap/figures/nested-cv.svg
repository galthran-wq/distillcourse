<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; font-size: 13px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .train { fill: #4c8dd6; opacity: 0.8; }
    .test  { fill: #e2903a; opacity: 0.9; }
    .inval { fill: #5aa46a; opacity: 0.85; }
    .zoom  { stroke: currentColor; stroke-opacity: 0.3; stroke-dasharray: 3 3; }
    .arrow { stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.4; fill: none; }
  </style>

  <text class="label" x="100" y="28">outer loop: 5 folds, each scored once</text>
  <rect class="train" x="100" y="40" width="84" height="24" rx="3"/>
  <rect class="train" x="188" y="40" width="84" height="24" rx="3"/>
  <rect class="train" x="276" y="40" width="84" height="24" rx="3"/>
  <rect class="train" x="364" y="40" width="84" height="24" rx="3"/>
  <rect class="test"  x="452" y="40" width="84" height="24" rx="3"/>
  <text class="muted" x="272" y="82">outer-train (4 folds)</text>
  <text x="494" y="82" fill="#e2903a" font-size="12" text-anchor="middle">outer test</text>

  <line class="zoom" x1="100" y1="66" x2="100" y2="140"/>
  <line class="zoom" x1="448" y1="66" x2="452" y2="140"/>

  <text class="label" x="100" y="128">inner loop, on outer-train only: 4-fold CV for every λ in the grid</text>
  <rect class="inval" x="100" y="140" width="84" height="24" rx="3"/>
  <rect class="train" x="188" y="140" width="84" height="24" rx="3"/>
  <rect class="train" x="276" y="140" width="84" height="24" rx="3"/>
  <rect class="train" x="364" y="140" width="84" height="24" rx="3"/>
  <text class="muted" x="100" y="182"><tspan fill="#5aa46a">inner validation fold</tspan> rotates ×4 · best mean score picks λ*</text>

  <path class="arrow" d="M 274 192 L 274 214"/><polygon points="274,216 269,207 279,207" fill="currentColor" opacity="0.5"/>
  <text class="label" x="100" y="234">refit on all of outer-train with λ*  →  score once on the outer test fold  →  e₅</text>

  <path class="arrow" d="M 274 244 L 274 266"/><polygon points="274,268 269,259 279,259" fill="currentColor" opacity="0.5"/>
  <text class="label" x="100" y="288">rotate the outer fold: report mean(e₁ … e₅) ± SE</text>
  <text class="muted" x="100" y="310">the estimate covers the whole recipe — tuning included; no λ is chosen by a fold that scores it</text>
</svg>

<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; font-size: 13px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .formula { fill: currentColor; font-size: 15px; }
    .pt   { fill: currentColor; opacity: 0.3; }
    .slot { stroke: currentColor; stroke-opacity: 0.35; stroke-dasharray: 3 3; fill: none; }
    .slotfull { stroke: currentColor; stroke-opacity: 0.5; fill: none; }
    .arrow { stroke: #4c8dd6; stroke-width: 1.6; fill: none; }
  </style>

  <text class="muted" x="60" y="34">original sample, n = 5</text>
  <circle class="pt" cx="200" cy="60" r="11"/><text class="muted" x="200" y="88" text-anchor="middle">z₁</text>
  <circle class="pt" cx="260" cy="60" r="11"/><text class="muted" x="260" y="88" text-anchor="middle">z₂</text>
  <circle cx="320" cy="60" r="11" fill="#e2903a" opacity="0.9"/><text x="320" y="88" text-anchor="middle" fill="#e2903a" font-size="12">z₃ (tracked)</text>
  <circle class="pt" cx="380" cy="60" r="11"/><text class="muted" x="380" y="88" text-anchor="middle">z₄</text>
  <circle class="pt" cx="440" cy="60" r="11"/><text class="muted" x="440" y="88" text-anchor="middle">z₅</text>

  <text class="muted" x="60" y="126">bootstrap sample Z*: n draws with replacement</text>
  <path class="arrow" d="M 440 74 C 400 110, 240 110, 202 138"/>
  <polygon points="202,138 210,131 213,139" fill="#4c8dd6"/>
  <rect class="slotfull" x="183" y="140" width="34" height="34" rx="4"/>
  <text class="label" x="200" y="162" text-anchor="middle">z₅</text>
  <rect class="slot" x="243" y="140" width="34" height="34" rx="4"/>
  <rect class="slot" x="303" y="140" width="34" height="34" rx="4"/>
  <rect class="slot" x="363" y="140" width="34" height="34" rx="4"/>
  <rect class="slot" x="423" y="140" width="34" height="34" rx="4"/>

  <text class="formula" x="60" y="220">one draw is uniform over the 5 points, so it misses z₃ with probability</text>
  <text class="formula" x="60" y="248">1 − 1/n = 4/5</text>
  <text class="muted" x="60" y="284">step 1: one draw, one miss probability</text>
</svg>

<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; font-size: 13px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .train { fill: #4c8dd6; opacity: 0.8; }
    .val   { fill: #e2903a; opacity: 0.9; }
    .cell  { stroke: currentColor; stroke-opacity: 0.25; fill: none; }
  </style>

  <text class="muted" x="320" y="20" text-anchor="middle"><tspan fill="#4c8dd6">train</tspan> · <tspan fill="#e2903a">held out for validation</tspan></text>

  <!-- hold-out -->
  <text class="label" x="12" y="58">hold-out</text>
  <rect class="train" x="120" y="40" width="306" height="26" rx="3"/>
  <rect class="val" x="430" y="40" width="130" height="26" rx="3"/>
  <text class="muted" x="120" y="84">one 70/30 split · one fit · one score</text>

  <!-- 5-fold -->
  <text class="label" x="12" y="162">5-fold</text>
  <g>
    <rect class="val"   x="120" y="104" width="84" height="16" rx="3"/>
    <rect class="train" x="208" y="104" width="84" height="16" rx="3"/>
    <rect class="train" x="296" y="104" width="84" height="16" rx="3"/>
    <rect class="train" x="384" y="104" width="84" height="16" rx="3"/>
    <rect class="train" x="472" y="104" width="84" height="16" rx="3"/>
    <text class="muted" x="566" y="117">e₁</text>
  </g>
  <g>
    <rect class="train" x="120" y="126" width="84" height="16" rx="3"/>
    <rect class="val"   x="208" y="126" width="84" height="16" rx="3"/>
    <rect class="train" x="296" y="126" width="84" height="16" rx="3"/>
    <rect class="train" x="384" y="126" width="84" height="16" rx="3"/>
    <rect class="train" x="472" y="126" width="84" height="16" rx="3"/>
    <text class="muted" x="566" y="139">e₂</text>
  </g>
  <g>
    <rect class="train" x="120" y="148" width="84" height="16" rx="3"/>
    <rect class="train" x="208" y="148" width="84" height="16" rx="3"/>
    <rect class="val"   x="296" y="148" width="84" height="16" rx="3"/>
    <rect class="train" x="384" y="148" width="84" height="16" rx="3"/>
    <rect class="train" x="472" y="148" width="84" height="16" rx="3"/>
    <text class="muted" x="566" y="161">e₃</text>
  </g>
  <g>
    <rect class="train" x="120" y="170" width="84" height="16" rx="3"/>
    <rect class="train" x="208" y="170" width="84" height="16" rx="3"/>
    <rect class="train" x="296" y="170" width="84" height="16" rx="3"/>
    <rect class="val"   x="384" y="170" width="84" height="16" rx="3"/>
    <rect class="train" x="472" y="170" width="84" height="16" rx="3"/>
    <text class="muted" x="566" y="183">e₄</text>
  </g>
  <g>
    <rect class="train" x="120" y="192" width="84" height="16" rx="3"/>
    <rect class="train" x="208" y="192" width="84" height="16" rx="3"/>
    <rect class="train" x="296" y="192" width="84" height="16" rx="3"/>
    <rect class="train" x="384" y="192" width="84" height="16" rx="3"/>
    <rect class="val"   x="472" y="192" width="84" height="16" rx="3"/>
    <text class="muted" x="566" y="205">e₅</text>
  </g>
  <text class="muted" x="120" y="228">each fold held out once · five fits · CV = (e₁ + … + e₅)/5</text>

  <!-- LOOCV -->
  <text class="label" x="12" y="285">LOOCV</text>
  <g>
    <rect class="val" x="120" y="268" width="18" height="26" rx="2"/>
    <rect class="train" x="142" y="268" width="18" height="26" rx="2"/>
    <rect class="train" x="164" y="268" width="18" height="26" rx="2"/>
    <rect class="train" x="186" y="268" width="18" height="26" rx="2"/>
    <rect class="train" x="208" y="268" width="18" height="26" rx="2"/>
    <rect class="train" x="230" y="268" width="18" height="26" rx="2"/>
    <rect class="train" x="252" y="268" width="18" height="26" rx="2"/>
    <rect class="train" x="274" y="268" width="18" height="26" rx="2"/>
    <rect class="train" x="296" y="268" width="18" height="26" rx="2"/>
    <rect class="train" x="318" y="268" width="18" height="26" rx="2"/>
    <rect class="train" x="340" y="268" width="18" height="26" rx="2"/>
    <rect class="train" x="362" y="268" width="18" height="26" rx="2"/>
    <rect class="train" x="384" y="268" width="18" height="26" rx="2"/>
    <rect class="train" x="406" y="268" width="18" height="26" rx="2"/>
    <rect class="train" x="428" y="268" width="18" height="26" rx="2"/>
    <rect class="train" x="450" y="268" width="18" height="26" rx="2"/>
    <rect class="train" x="472" y="268" width="18" height="26" rx="2"/>
    <rect class="train" x="494" y="268" width="18" height="26" rx="2"/>
    <rect class="train" x="516" y="268" width="18" height="26" rx="2"/>
    <rect class="train" x="538" y="268" width="18" height="26" rx="2"/>
  </g>
  <text class="muted" x="120" y="316">k = n: one point held out per fold · n fits</text>
</svg>

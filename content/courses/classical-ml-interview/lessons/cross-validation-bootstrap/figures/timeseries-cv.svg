<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; font-size: 13px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .train { fill: #4c8dd6; opacity: 0.8; }
    .val   { fill: #e2903a; opacity: 0.9; }
    .empty { stroke: currentColor; stroke-opacity: 0.25; fill: none; }
    .strike { stroke: currentColor; stroke-width: 2; stroke-opacity: 0.8; }
  </style>

  <text class="label" x="100" y="24">forward chaining: train on the past, validate on the next block</text>

  <!-- fold 1: train 1-4, val 5 -->
  <g>
    <rect class="train" x="100" y="38" width="40" height="20" rx="3"/><rect class="train" x="144" y="38" width="40" height="20" rx="3"/><rect class="train" x="188" y="38" width="40" height="20" rx="3"/><rect class="train" x="232" y="38" width="40" height="20" rx="3"/>
    <rect class="val" x="276" y="38" width="40" height="20" rx="3"/>
    <rect class="empty" x="320" y="38" width="40" height="20" rx="3"/><rect class="empty" x="364" y="38" width="40" height="20" rx="3"/><rect class="empty" x="408" y="38" width="40" height="20" rx="3"/><rect class="empty" x="452" y="38" width="40" height="20" rx="3"/><rect class="empty" x="496" y="38" width="40" height="20" rx="3"/>
    <text class="muted" x="548" y="53">fold 1</text>
  </g>
  <g>
    <rect class="train" x="100" y="66" width="40" height="20" rx="3"/><rect class="train" x="144" y="66" width="40" height="20" rx="3"/><rect class="train" x="188" y="66" width="40" height="20" rx="3"/><rect class="train" x="232" y="66" width="40" height="20" rx="3"/><rect class="train" x="276" y="66" width="40" height="20" rx="3"/>
    <rect class="val" x="320" y="66" width="40" height="20" rx="3"/>
    <rect class="empty" x="364" y="66" width="40" height="20" rx="3"/><rect class="empty" x="408" y="66" width="40" height="20" rx="3"/><rect class="empty" x="452" y="66" width="40" height="20" rx="3"/><rect class="empty" x="496" y="66" width="40" height="20" rx="3"/>
    <text class="muted" x="548" y="81">fold 2</text>
  </g>
  <g>
    <rect class="train" x="100" y="94" width="40" height="20" rx="3"/><rect class="train" x="144" y="94" width="40" height="20" rx="3"/><rect class="train" x="188" y="94" width="40" height="20" rx="3"/><rect class="train" x="232" y="94" width="40" height="20" rx="3"/><rect class="train" x="276" y="94" width="40" height="20" rx="3"/><rect class="train" x="320" y="94" width="40" height="20" rx="3"/>
    <rect class="val" x="364" y="94" width="40" height="20" rx="3"/>
    <rect class="empty" x="408" y="94" width="40" height="20" rx="3"/><rect class="empty" x="452" y="94" width="40" height="20" rx="3"/><rect class="empty" x="496" y="94" width="40" height="20" rx="3"/>
    <text class="muted" x="548" y="109">fold 3</text>
  </g>
  <g>
    <rect class="train" x="100" y="122" width="40" height="20" rx="3"/><rect class="train" x="144" y="122" width="40" height="20" rx="3"/><rect class="train" x="188" y="122" width="40" height="20" rx="3"/><rect class="train" x="232" y="122" width="40" height="20" rx="3"/><rect class="train" x="276" y="122" width="40" height="20" rx="3"/><rect class="train" x="320" y="122" width="40" height="20" rx="3"/><rect class="train" x="364" y="122" width="40" height="20" rx="3"/>
    <rect class="val" x="408" y="122" width="40" height="20" rx="3"/>
    <rect class="empty" x="452" y="122" width="40" height="20" rx="3"/><rect class="empty" x="496" y="122" width="40" height="20" rx="3"/>
    <text class="muted" x="548" y="137">fold 4</text>
  </g>
  <text class="muted" x="100" y="166">time →   every <tspan fill="#e2903a">validation block</tspan> lies after its <tspan fill="#4c8dd6">training window</tspan>; the origin rolls forward</text>

  <text class="label" x="100" y="212">shuffled k-fold on the same series</text>
  <g>
    <rect class="train" x="100" y="226" width="40" height="20" rx="3"/>
    <rect class="val"   x="144" y="226" width="40" height="20" rx="3"/>
    <rect class="train" x="188" y="226" width="40" height="20" rx="3"/>
    <rect class="train" x="232" y="226" width="40" height="20" rx="3"/>
    <rect class="val"   x="276" y="226" width="40" height="20" rx="3"/>
    <rect class="train" x="320" y="226" width="40" height="20" rx="3"/>
    <rect class="train" x="364" y="226" width="40" height="20" rx="3"/>
    <rect class="val"   x="408" y="226" width="40" height="20" rx="3"/>
    <rect class="train" x="452" y="226" width="40" height="20" rx="3"/>
    <rect class="train" x="496" y="226" width="40" height="20" rx="3"/>
  </g>
  <line class="strike" x1="94" y1="252" x2="542" y2="220"/>
  <text class="muted" x="100" y="280">train blocks at t = 3, 4 and t = 6, 7 sit <tspan fill="currentColor" font-weight="bold">after</tspan> validation blocks at t = 2 and t = 5:</text>
  <text class="muted" x="100" y="298">the model is fit on the future of the points it is scored on</text>
</svg>

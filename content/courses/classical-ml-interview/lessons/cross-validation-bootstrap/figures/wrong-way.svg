<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; font-size: 13px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .box   { stroke: currentColor; stroke-opacity: 0.5; fill: none; }
    .loop  { stroke: currentColor; stroke-opacity: 0.4; stroke-dasharray: 4 4; fill: none; }
    .arrow { stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.4; fill: none; }
  </style>

  <text class="label" x="160" y="26" text-anchor="middle">wrong: screen outside the loop</text>

  <rect class="box" x="20" y="40" width="280" height="58" rx="6"/>
  <text class="label" x="32" y="62">1 · keep the 100 of 5,000 predictors</text>
  <text class="label" x="32" y="82">most correlated with <tspan fill="#e2903a">all N labels</tspan></text>

  <path class="arrow" d="M 160 98 L 160 116"/><polygon points="160,118 155,109 165,109" fill="currentColor" opacity="0.5"/>

  <rect class="loop" x="20" y="120" width="280" height="76" rx="6"/>
  <text class="muted" x="32" y="140">for each of 5 folds:</text>
  <text class="label" x="32" y="162">2 · fit on 4 folds, using the 100 winners</text>
  <text class="label" x="32" y="182">3 · score the held-out fold</text>

  <path class="arrow" d="M 160 196 L 160 214"/><polygon points="160,216 155,207 165,207" fill="currentColor" opacity="0.5"/>

  <text class="label" x="32" y="240">reported CV error ≈ <tspan fill="#e2903a" font-weight="bold">3%</tspan></text>
  <text class="label" x="32" y="264">true error rate = 50% (labels are noise)</text>
  <text class="muted" x="32" y="290">the held-out fold's labels helped choose</text>
  <text class="muted" x="32" y="306">the features it is then scored on</text>

  <text class="label" x="480" y="26" text-anchor="middle">right: screen inside the loop</text>

  <rect class="loop" x="340" y="40" width="280" height="156" rx="6"/>
  <text class="muted" x="352" y="62">for each of 5 folds:</text>
  <text class="label" x="352" y="88">1 · screen 5,000 → 100 using the</text>
  <text class="label" x="352" y="108">     <tspan fill="#5aa46a">4 training folds only</tspan></text>
  <text class="label" x="352" y="134">2 · fit on those folds</text>
  <text class="label" x="352" y="160">3 · score the held-out fold</text>
  <text class="muted" x="352" y="184">(its labels touched nothing)</text>

  <path class="arrow" d="M 480 196 L 480 214"/><polygon points="480,216 475,207 485,207" fill="currentColor" opacity="0.5"/>

  <text class="label" x="352" y="240">reported CV error ≈ <tspan fill="#5aa46a" font-weight="bold">50%</tspan> — honest</text>
  <text class="muted" x="352" y="266">every data-dependent step re-runs per fold;</text>
  <text class="muted" x="352" y="284">the screening cost is part of the estimate</text>
</svg>

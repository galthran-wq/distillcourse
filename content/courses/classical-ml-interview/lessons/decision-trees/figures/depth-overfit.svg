<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; font-size: 13px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .axis  { stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.2; fill: none; }
    .test  { stroke: currentColor; stroke-width: 2.6; fill: none; }
    .train { stroke: #5aa46a; stroke-width: 2; stroke-dasharray: 6 4; fill: none; }
    .guide { stroke: #e2903a; stroke-width: 1.6; stroke-dasharray: 4 3; }
  </style>

  <!-- axes -->
  <path class="axis" d="M80 270 L600 270"/>
  <path class="axis" d="M80 270 L80 60"/>
  <text class="muted" x="340" y="300" text-anchor="middle">tree depth</text>
  <text class="muted" x="72" y="64" text-anchor="end">error</text>

  <!-- depth ticks -->
  <text class="muted" x="80" y="288" text-anchor="middle">1</text>
  <text class="muted" x="191" y="288" text-anchor="middle">3</text>
  <text class="muted" x="302" y="288" text-anchor="middle">5</text>
  <text class="muted" x="413" y="288" text-anchor="middle">7</text>
  <text class="muted" x="524" y="288" text-anchor="middle">9</text>

  <!-- CV-chosen depth -->
  <line class="guide" x1="191" y1="270" x2="191" y2="88"/>
  <text x="191" y="78" text-anchor="middle" fill="#e2903a" font-weight="bold" font-size="13">CV choice</text>

  <!-- test error: U-shaped -->
  <polyline class="test" points="80,90 135.5,130 191,152.5 246.5,150 302,145 357.5,140 413,132.5 468.5,127.5 524,122.5 579.5,120"/>
  <text class="label" x="586" y="112">test</text>

  <!-- train error: monotone down -->
  <polyline class="train" points="80,110 135.5,150 191,185 246.5,210 302,230 357.5,245 413,255 468.5,262.5 524,267.5 579.5,270"/>
  <text x="586" y="266" fill="#5aa46a" font-size="13">train</text>

  <!-- annotations -->
  <text class="muted" x="300" y="105">right of the minimum: extra leaves fit noise;</text>
  <text class="muted" x="300" y="121">train keeps falling, test climbs back up</text>
</svg>

<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; font-size: 13px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .node  { fill: none; stroke: currentColor; stroke-opacity: 0.7; stroke-width: 1.4; }
    .edge  { stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.2; }
    .axis  { stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.2; fill: none; }
    .cut   { stroke: currentColor; stroke-width: 1.6; }
  </style>

  <!-- ================= left: the tree ================= -->
  <text class="muted" x="150" y="24" text-anchor="middle">the tree</text>

  <!-- root -->
  <rect class="node" x="103" y="38" width="94" height="26" rx="5"/>
  <text class="label" x="150" y="55" text-anchor="middle">x&#8321; &#8804; 3</text>

  <!-- edges from root -->
  <line class="edge" x1="125" y1="64" x2="85" y2="118"/>
  <line class="edge" x1="175" y1="64" x2="215" y2="118"/>
  <text class="muted" x="93" y="90" text-anchor="end">yes</text>
  <text class="muted" x="207" y="90">no</text>

  <!-- left leaf R1 (amber) -->
  <rect x="48" y="120" width="74" height="40" rx="5" fill="#e2903a" fill-opacity="0.18" stroke="#e2903a" stroke-width="1.6"/>
  <text x="85" y="137" text-anchor="middle" fill="#e2903a" font-weight="bold">R&#8321;</text>
  <text class="muted" x="85" y="153" text-anchor="middle">c&#8321;</text>

  <!-- right internal node -->
  <rect class="node" x="168" y="120" width="94" height="26" rx="5"/>
  <text class="label" x="215" y="137" text-anchor="middle">x&#8322; &#8804; 2</text>

  <!-- edges from internal node -->
  <line class="edge" x1="192" y1="146" x2="165" y2="198"/>
  <line class="edge" x1="238" y1="146" x2="265" y2="198"/>
  <text class="muted" x="170" y="172" text-anchor="end">yes</text>
  <text class="muted" x="258" y="172">no</text>

  <!-- leaf R2 (blue) -->
  <rect x="128" y="200" width="74" height="40" rx="5" fill="#4c8dd6" fill-opacity="0.18" stroke="#4c8dd6" stroke-width="1.6"/>
  <text x="165" y="217" text-anchor="middle" fill="#4c8dd6" font-weight="bold">R&#8322;</text>
  <text class="muted" x="165" y="233" text-anchor="middle">c&#8322;</text>

  <!-- leaf R3 (green) -->
  <rect x="228" y="200" width="74" height="40" rx="5" fill="#5aa46a" fill-opacity="0.18" stroke="#5aa46a" stroke-width="1.6"/>
  <text x="265" y="217" text-anchor="middle" fill="#5aa46a" font-weight="bold">R&#8323;</text>
  <text class="muted" x="265" y="233" text-anchor="middle">c&#8323;</text>

  <text class="muted" x="150" y="278" text-anchor="middle">each leaf carries a constant c&#8344;</text>

  <!-- ================= right: the partition ================= -->
  <text class="muted" x="480" y="24" text-anchor="middle">the partition</text>

  <!-- region fills -->
  <rect x="360" y="90" width="120" height="160" fill="#e2903a" fill-opacity="0.18"/>
  <rect x="480" y="170" width="120" height="80" fill="#4c8dd6" fill-opacity="0.18"/>
  <rect x="480" y="90" width="120" height="80" fill="#5aa46a" fill-opacity="0.18"/>

  <!-- cuts -->
  <line class="cut" x1="480" y1="90" x2="480" y2="250"/>
  <line class="cut" x1="480" y1="170" x2="600" y2="170"/>

  <!-- region labels -->
  <text x="420" y="175" text-anchor="middle" fill="#e2903a" font-weight="bold">R&#8321;</text>
  <text x="540" y="215" text-anchor="middle" fill="#4c8dd6" font-weight="bold">R&#8322;</text>
  <text x="540" y="135" text-anchor="middle" fill="#5aa46a" font-weight="bold">R&#8323;</text>

  <!-- axes -->
  <path class="axis" d="M360 90 L360 250 L600 250"/>
  <text class="muted" x="602" y="268" text-anchor="end">x&#8321;</text>
  <text class="muted" x="348" y="98" text-anchor="end">x&#8322;</text>
  <!-- ticks -->
  <line class="axis" x1="480" y1="250" x2="480" y2="256"/>
  <text class="muted" x="480" y="270" text-anchor="middle">3</text>
  <line class="axis" x1="354" y1="170" x2="360" y2="170"/>
  <text class="muted" x="348" y="174" text-anchor="end">2</text>
</svg>

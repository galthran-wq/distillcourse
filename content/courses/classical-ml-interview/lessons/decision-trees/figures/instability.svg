<svg viewBox="0 0 640 310" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; font-size: 13px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .node  { fill: none; stroke: currentColor; stroke-opacity: 0.7; stroke-width: 1.4; }
    .root  { fill: none; stroke: #e2903a; stroke-width: 1.8; }
    .edge  { stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.2; }
    .leaf  { fill: currentColor; opacity: 0.55; font-size: 12px; }
  </style>

  <!-- ============ panel A: all rows ============ -->
  <text class="label" x="160" y="28" text-anchor="middle" font-weight="bold">all 10 machines</text>

  <rect class="root" x="95" y="44" width="130" height="28" rx="5"/>
  <text x="160" y="63" text-anchor="middle" fill="#e2903a" font-weight="bold">temp &#8804; 27</text>

  <line class="edge" x1="130" y1="72" x2="95" y2="116"/>
  <line class="edge" x1="190" y1="72" x2="225" y2="116"/>

  <rect class="node" x="30" y="118" width="130" height="28" rx="5"/>
  <text class="label" x="95" y="137" text-anchor="middle">vibration?</text>
  <text class="leaf" x="225" y="137" text-anchor="middle">fails (4)</text>

  <line class="edge" x1="65" y1="146" x2="45" y2="188"/>
  <line class="edge" x1="125" y1="146" x2="145" y2="188"/>

  <text class="leaf" x="45" y="207" text-anchor="middle">OK (4)</text>
  <rect class="node" x="90" y="190" width="120" height="28" rx="5"/>
  <text class="label" x="150" y="209" text-anchor="middle">temp &#8804; 22.5</text>

  <text class="muted" x="160" y="252" text-anchor="middle">root scores: temp 0.167,</text>
  <text class="muted" x="160" y="268" text-anchor="middle">vibration 0.320</text>

  <!-- divider -->
  <line x1="320" y1="30" x2="320" y2="280" stroke="currentColor" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- ============ panel B: row 8 removed ============ -->
  <text class="label" x="480" y="28" text-anchor="middle" font-weight="bold">machine 8 deleted</text>

  <rect class="root" x="415" y="44" width="130" height="28" rx="5"/>
  <text x="480" y="63" text-anchor="middle" fill="#e2903a" font-weight="bold">vibration?</text>

  <line class="edge" x1="450" y1="72" x2="415" y2="116"/>
  <line class="edge" x1="510" y1="72" x2="545" y2="116"/>

  <text class="leaf" x="415" y="137" text-anchor="middle">OK (4)</text>
  <rect class="node" x="480" y="118" width="130" height="28" rx="5"/>
  <text class="label" x="545" y="137" text-anchor="middle">temp &#8804; 22.5</text>

  <line class="edge" x1="515" y1="146" x2="495" y2="188"/>
  <line class="edge" x1="575" y1="146" x2="595" y2="188"/>

  <text class="leaf" x="495" y="207" text-anchor="middle">OK (1)</text>
  <text class="leaf" x="595" y="207" text-anchor="middle">fails (4)</text>

  <text class="muted" x="480" y="252" text-anchor="middle">root scores: vibration 0.178,</text>
  <text class="muted" x="480" y="268" text-anchor="middle">temp 0.185 &#8212; the argmin flips</text>
</svg>

<svg viewBox="0 0 640 310" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; font-size: 13px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .node  { fill: none; stroke: currentColor; stroke-opacity: 0.7; stroke-width: 1.4; }
    .edge  { stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.2; }
  </style>

  <!-- parent node -->
  <rect class="node" x="200" y="30" width="180" height="60" rx="6"/>
  <!-- 6 positives (amber), 2 negatives (blue) -->
  <circle cx="228" cy="52" r="7" fill="#e2903a"/>
  <circle cx="250" cy="52" r="7" fill="#e2903a"/>
  <circle cx="272" cy="52" r="7" fill="#e2903a"/>
  <circle cx="294" cy="52" r="7" fill="#e2903a"/>
  <circle cx="316" cy="52" r="7" fill="#e2903a"/>
  <circle cx="338" cy="52" r="7" fill="#e2903a"/>
  <circle cx="360" cy="52" r="7" fill="#4c8dd6"/>
  <circle cx="360" cy="74" r="7" fill="#4c8dd6"/>
  <text class="muted" x="228" y="79">6 + / 2 &#8722;, predict +</text>

  <!-- edges -->
  <line class="edge" x1="250" y1="90" x2="180" y2="140"/>
  <line class="edge" x1="330" y1="90" x2="400" y2="140"/>

  <!-- left child: pure -->
  <rect class="node" x="90" y="142" width="180" height="60" rx="6"/>
  <circle cx="130" cy="164" r="7" fill="#e2903a"/>
  <circle cx="152" cy="164" r="7" fill="#e2903a"/>
  <circle cx="174" cy="164" r="7" fill="#e2903a"/>
  <text class="muted" x="118" y="191">3 + / 0 &#8722;, pure, err 0</text>

  <!-- right child: still majority + -->
  <rect class="node" x="310" y="142" width="190" height="60" rx="6"/>
  <circle cx="350" cy="164" r="7" fill="#e2903a"/>
  <circle cx="372" cy="164" r="7" fill="#e2903a"/>
  <circle cx="394" cy="164" r="7" fill="#e2903a"/>
  <circle cx="416" cy="164" r="7" fill="#4c8dd6"/>
  <circle cx="438" cy="164" r="7" fill="#4c8dd6"/>
  <text class="muted" x="338" y="191">3 + / 2 &#8722;, predict +, err 2</text>

  <!-- tallies -->
  <text class="label" x="122" y="248" font-weight="bold">error:</text>
  <text class="label" x="172" y="248">2/8 &#8594; 2/8</text>
  <text class="muted" x="258" y="248">unchanged</text>
  <text x="122" y="276" fill="#e2903a" font-weight="bold" font-size="13">Gini:</text>
  <text x="172" y="276" fill="#e2903a" font-size="13">0.375 &#8594; 0.300</text>
  <text class="muted" x="290" y="276">drops: the split counts as progress</text>
</svg>

<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; font-size: 13px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .axis  { stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.2; fill: none; }
  </style>
  <!-- legend -->
  <circle cx="138" cy="40" r="6" fill="#e2903a"/>
  <text class="label" x="150" y="44">fails</text>
  <circle cx="205" cy="40" r="6" fill="#4c8dd6"/>
  <text class="label" x="217" y="44">OK</text>
  <text class="muted" x="434" y="44" text-anchor="end">root: 5 fail / 5 OK, G = 0.500</text>

  <!-- rows -->
  <text class="muted" x="122" y="104" text-anchor="end">vib high</text>
  <text class="muted" x="122" y="164" text-anchor="end">vib low</text>
  <line x1="168.0" y1="75" x2="168.0" y2="185" stroke="currentColor" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="206.0" y1="75" x2="206.0" y2="185" stroke="currentColor" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="234.5" y1="75" x2="234.5" y2="185" stroke="currentColor" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="253.5" y1="75" x2="253.5" y2="185" stroke="currentColor" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="272.5" y1="75" x2="272.5" y2="185" stroke="currentColor" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="339.0" y1="75" x2="339.0" y2="185" stroke="currentColor" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="367.5" y1="75" x2="367.5" y2="185" stroke="currentColor" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="396.0" y1="75" x2="396.0" y2="185" stroke="currentColor" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="3 3"/>
  <circle cx="320.0" cy="100" r="6" fill="#e2903a"/>
  <circle cx="377.0" cy="100" r="6" fill="#e2903a"/>
  <circle cx="244.0" cy="100" r="6" fill="#e2903a"/>
  <circle cx="187.0" cy="100" r="6" fill="#4c8dd6"/>
  <circle cx="415.0" cy="100" r="6" fill="#e2903a"/>
  <circle cx="282.0" cy="160" r="6" fill="#4c8dd6"/>
  <circle cx="149.0" cy="160" r="6" fill="#4c8dd6"/>
  <circle cx="358.0" cy="160" r="6" fill="#e2903a"/>
  <circle cx="225.0" cy="160" r="6" fill="#4c8dd6"/>
  <circle cx="263.0" cy="160" r="6" fill="#4c8dd6"/>

  <!-- axis -->
  <path class="axis" d="M130 200 L445 200"/>
  <line class="axis" x1="168" y1="200" x2="168" y2="206"/>
  <line class="axis" x1="263" y1="200" x2="263" y2="206"/>
  <line class="axis" x1="358" y1="200" x2="358" y2="206"/>
  <text class="muted" x="168" y="220" text-anchor="middle">20</text>
  <text class="muted" x="263" y="220" text-anchor="middle">25</text>
  <text class="muted" x="358" y="220" text-anchor="middle">30</text>
  <text class="muted" x="287" y="238" text-anchor="middle">temperature (&#176;C)</text>
  <line x1="301" y1="75" x2="301" y2="185" stroke="#e2903a" stroke-width="2.4"/>
  <text x="301" y="68" text-anchor="middle" fill="#e2903a" font-weight="bold" font-size="13">t = 27</text>
  <line x1="215" y1="200" x2="215" y2="252" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.2"/>
  <line x1="370" y1="200" x2="370" y2="252" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.2"/>
  <rect x="140" y="254" width="160" height="46" rx="6" fill="#e2903a" fill-opacity="0.12" stroke="#e2903a" stroke-width="1.6"/>
  <text x="220" y="272" text-anchor="middle" fill="currentColor" font-size="13">temp &#8804; 27: 1 fail / 5 OK</text>
  <text x="220" y="290" text-anchor="middle" fill="#e2903a" font-weight="bold" font-size="13">G = 0.278 &#8594; recurse</text>
  <rect x="320" y="254" width="150" height="46" rx="6" fill="none" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.4"/>
  <text x="395" y="272" text-anchor="middle" fill="currentColor" font-size="13">temp &#62; 27: 4 fail / 0 OK</text>
  <text x="395" y="290" text-anchor="middle" fill="currentColor" opacity="0.55" font-size="12">pure leaf: predict fails</text>
  <path d="M300 322 C 250 340, 190 335, 185 304" fill="none" stroke="#e2903a" stroke-width="1.8"/>
  <path d="M185 304 l -5 10 l 11 1 z" fill="#e2903a"/>
  <text x="310" y="330" fill="currentColor" opacity="0.55" font-size="12">same scan, six rows</text>

  <!-- right panel -->
  <text class="label" x="460" y="80" font-weight="bold">apply the winner</text>
  <text class="muted" x="460" y="104">right child is pure:</text>
  <text class="muted" x="460" y="122">done, a leaf</text>
  <text class="muted" x="460" y="146">left child is impure:</text>
  <text class="muted" x="460" y="164">rerun the whole scan</text>
  <text class="muted" x="460" y="182">on its 6 rows only</text>

</svg>

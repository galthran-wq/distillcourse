<svg viewBox="0 0 600 310" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; font-size: 13px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .axis  { stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.2; fill: none; }
    .truth { stroke: #4c8dd6; stroke-width: 2.2; fill: none; }
    .tree  { stroke: #e2903a; stroke-width: 2.4; fill: none; }
  </style>

  <!-- axes -->
  <path class="axis" d="M170 40 L170 270 L470 270"/>
  <text class="muted" x="472" y="288" text-anchor="end">x&#8321;</text>
  <text class="muted" x="158" y="48" text-anchor="end">x&#8322;</text>

  <!-- true diagonal boundary -->
  <line class="truth" x1="180" y1="262" x2="452" y2="52"/>
  <text x="428" y="42" fill="#4c8dd6" font-size="13" text-anchor="middle">true boundary x&#8322; = x&#8321;</text>

  <!-- staircase approximation -->
  <polyline class="tree" points="180,247 219,247 219,217 258,217 258,187 297,187 297,157 336,157 336,127 375,127 375,96 414,96 414,66 452,66"/>
  <text x="196" y="222" fill="#e2903a" font-size="13">tree boundary</text>

  <!-- one step called out -->
  <text class="muted" x="360" y="182">each stair =</text>
  <text class="muted" x="360" y="198">one more split</text>

  <!-- class labels -->
  <text class="muted" x="222" y="90">class A</text>
  <text class="muted" x="392" y="240">class B</text>
</svg>

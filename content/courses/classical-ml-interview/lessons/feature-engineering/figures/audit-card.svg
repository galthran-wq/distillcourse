<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <text x="20" y="24" fill="currentColor" font-size="13">audit: computable at prediction time, from information available then?</text>

  <!-- feature 1: yes -->
  <rect x="20" y="40" width="440" height="36" rx="5" fill="none" stroke="currentColor" opacity="0.7"/>
  <text x="32" y="57" fill="currentColor">txn_count_1h</text>
  <text x="32" y="71" fill="currentColor" opacity="0.55" font-size="11">customer&#8217;s transactions in the hour before t</text>
  <rect x="478" y="44" width="142" height="28" rx="5" fill="none" stroke="#5aa46a" stroke-width="1.6"/>
  <text x="549" y="62" text-anchor="middle" fill="#5aa46a">YES &#8212; past only</text>

  <!-- feature 2: depends -->
  <rect x="20" y="88" width="440" height="36" rx="5" fill="none" stroke="currentColor" opacity="0.7"/>
  <text x="32" y="105" fill="currentColor">mean_amount_30d</text>
  <text x="32" y="119" fill="currentColor" opacity="0.55" font-size="11">30-day average &#8212; only rows with timestamp &lt; t, current row excluded</text>
  <rect x="478" y="92" width="142" height="28" rx="5" fill="none" stroke="#4c8dd6" stroke-width="1.6"/>
  <text x="549" y="110" text-anchor="middle" fill="#4c8dd6">DEPENDS: as-of cutoff</text>

  <!-- feature 3: no -->
  <rect x="20" y="136" width="440" height="36" rx="5" fill="none" stroke="#e2903a" stroke-width="1.8"/>
  <text x="32" y="153" fill="currentColor">chargebacks_7d_after</text>
  <text x="32" y="167" fill="currentColor" opacity="0.55" font-size="11">chargebacks filed in the 7 days after t &#8212; a consequence of the label</text>
  <rect x="478" y="140" width="142" height="28" rx="5" fill="none" stroke="#e2903a" stroke-width="1.6"/>
  <text x="549" y="158" text-anchor="middle" fill="#e2903a">NO &#8212; future info</text>

  <!-- timeline -->
  <line x1="60" y1="220" x2="580" y2="220" stroke="currentColor"/>
  <line x1="320" y1="208" x2="320" y2="232" stroke="currentColor"/>
  <text x="320" y="248" text-anchor="middle" fill="currentColor" font-size="11">t &#8212; prediction time</text>
  <text x="180" y="212" text-anchor="middle" fill="currentColor" opacity="0.55" font-size="11">past: exists at t</text>
  <rect x="322" y="212" width="256" height="16" fill="#e2903a" opacity="0.18"/>
  <text x="450" y="224" text-anchor="middle" fill="#e2903a" font-size="11">future: does not exist at t</text>

  <!-- trace from failing feature to future region -->
  <path d="M 470 172 C 500 190, 560 190, 566 206" fill="none" stroke="#e2903a" stroke-width="1.6" stroke-dasharray="4 3"/>
  <path d="M 560 200 L 566 208 L 572 199" fill="none" stroke="#e2903a" stroke-width="1.6"/>
</svg>

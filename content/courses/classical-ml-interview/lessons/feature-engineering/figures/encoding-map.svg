<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="currentColor" stroke-width="1.5"/>
    </marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#e2903a" stroke-width="1.8"/>
    </marker>
  </defs>

  <text x="20" y="22" fill="#e2903a" font-size="12">example routed in amber: merchant_id &#183; 10,000 levels &#183; gradient-boosted trees</text>

  <!-- Q1 -->
  <rect x="20" y="40" width="190" height="34" rx="5" fill="none" stroke="currentColor"/>
  <text x="115" y="61" text-anchor="middle" fill="currentColor">levels truly ordered?</text>
  <!-- yes -> ordinal -->
  <line x1="210" y1="57" x2="388" y2="57" stroke="currentColor" marker-end="url(#arr)"/>
  <text x="250" y="51" fill="currentColor" opacity="0.55" font-size="11">yes (S &lt; M &lt; L)</text>
  <rect x="392" y="40" width="228" height="34" rx="5" fill="none" stroke="currentColor"/>
  <text x="506" y="61" text-anchor="middle" fill="currentColor">ordinal integer codes</text>

  <!-- no -> Q2 -->
  <line x1="115" y1="74" x2="115" y2="108" stroke="#e2903a" stroke-width="1.8" marker-end="url(#arrA)"/>
  <text x="123" y="95" fill="#e2903a" font-size="11">no</text>
  <rect x="20" y="112" width="190" height="34" rx="5" fill="none" stroke="currentColor"/>
  <text x="115" y="133" text-anchor="middle" fill="currentColor">cardinality small? (&#8776; &#8804; 15)</text>
  <!-- yes -> one-hot -->
  <line x1="210" y1="129" x2="388" y2="129" stroke="currentColor" marker-end="url(#arr)"/>
  <text x="250" y="123" fill="currentColor" opacity="0.55" font-size="11">yes</text>
  <rect x="392" y="112" width="228" height="46" rx="5" fill="none" stroke="currentColor"/>
  <text x="506" y="131" text-anchor="middle" fill="currentColor">one-hot</text>
  <text x="506" y="149" text-anchor="middle" fill="currentColor" opacity="0.55" font-size="11">drop one level if unpenalized linear</text>

  <!-- no -> Q3 -->
  <line x1="115" y1="146" x2="115" y2="184" stroke="#e2903a" stroke-width="1.8" marker-end="url(#arrA)"/>
  <text x="123" y="170" fill="#e2903a" font-size="11">no: 10,000 levels</text>
  <rect x="20" y="188" width="190" height="34" rx="5" fill="none" stroke="currentColor"/>
  <text x="115" y="209" text-anchor="middle" fill="currentColor">model family?</text>

  <!-- linear branch -->
  <line x1="210" y1="198" x2="388" y2="188" stroke="currentColor" marker-end="url(#arr)"/>
  <text x="252" y="188" fill="currentColor" opacity="0.55" font-size="11">linear</text>
  <rect x="392" y="170" width="228" height="40" rx="5" fill="none" stroke="currentColor"/>
  <text x="506" y="187" text-anchor="middle" fill="currentColor">feature hashing, or</text>
  <text x="506" y="203" text-anchor="middle" fill="currentColor">out-of-fold target encoding</text>

  <!-- tree branch (amber) -->
  <line x1="210" y1="215" x2="388" y2="248" stroke="#e2903a" stroke-width="1.8" marker-end="url(#arrA)"/>
  <text x="252" y="243" fill="#e2903a" font-size="11">trees</text>
  <rect x="392" y="228" width="228" height="46" rx="5" fill="none" stroke="#e2903a" stroke-width="1.8"/>
  <text x="506" y="247" text-anchor="middle" fill="currentColor">native categorical splits, or</text>
  <text x="506" y="264" text-anchor="middle" fill="#e2903a" font-size="11">target encoding (out-of-fold / ordered)</text>
</svg>

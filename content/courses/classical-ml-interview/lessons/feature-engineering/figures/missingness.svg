<svg viewBox="0 0 640 220" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <!-- MCAR panel -->
  <rect x="14" y="14" width="192" height="192" rx="6" fill="none" stroke="currentColor" opacity="0.6"/>
  <text x="110" y="40" text-anchor="middle" fill="currentColor" font-size="13">MCAR</text>
  <text x="110" y="58" text-anchor="middle" fill="currentColor" opacity="0.55" font-size="11">missing at pure random</text>
  <text x="110" y="90" text-anchor="middle" fill="currentColor" font-size="11">sensor drops 3% of</text>
  <text x="110" y="106" text-anchor="middle" fill="currentColor" font-size="11">readings, uniformly</text>
  <rect x="30" y="146" width="160" height="40" rx="5" fill="none" stroke="#5aa46a"/>
  <text x="110" y="163" text-anchor="middle" fill="#5aa46a" font-size="11">delete or impute:</text>
  <text x="110" y="179" text-anchor="middle" fill="#5aa46a" font-size="11">either is unbiased</text>

  <!-- MAR panel -->
  <rect x="224" y="14" width="192" height="192" rx="6" fill="none" stroke="currentColor" opacity="0.6"/>
  <text x="320" y="40" text-anchor="middle" fill="currentColor" font-size="13">MAR</text>
  <text x="320" y="58" text-anchor="middle" fill="currentColor" opacity="0.55" font-size="11">depends on observed columns</text>
  <text x="320" y="90" text-anchor="middle" fill="currentColor" font-size="11">younger users skip</text>
  <text x="320" y="106" text-anchor="middle" fill="currentColor" font-size="11">the income field</text>
  <rect x="240" y="146" width="160" height="40" rx="5" fill="none" stroke="#4c8dd6"/>
  <text x="320" y="163" text-anchor="middle" fill="#4c8dd6" font-size="11">impute from the</text>
  <text x="320" y="179" text-anchor="middle" fill="#4c8dd6" font-size="11">observed features (age)</text>

  <!-- MNAR panel -->
  <rect x="434" y="14" width="192" height="192" rx="6" fill="none" stroke="#e2903a" stroke-width="1.8"/>
  <text x="530" y="40" text-anchor="middle" fill="currentColor" font-size="13">MNAR</text>
  <text x="530" y="58" text-anchor="middle" fill="currentColor" opacity="0.55" font-size="11">depends on the hidden value</text>
  <text x="530" y="90" text-anchor="middle" fill="currentColor" font-size="11">highest earners</text>
  <text x="530" y="106" text-anchor="middle" fill="currentColor" font-size="11">decline to answer</text>
  <rect x="450" y="140" width="160" height="52" rx="5" fill="none" stroke="#e2903a"/>
  <text x="530" y="157" text-anchor="middle" fill="#e2903a" font-size="11">impute + indicator column:</text>
  <text x="530" y="173" text-anchor="middle" fill="#e2903a" font-size="11">the gap itself is signal</text>
  <text x="530" y="187" text-anchor="middle" fill="currentColor" opacity="0.55" font-size="10">(trees: keep NaN, native routing)</text>
</svg>

<svg viewBox="0 0 640 250" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <!-- header -->
  <text x="24" y="26" fill="currentColor" opacity="0.55" font-size="11">model</text>
  <text x="280" y="26" text-anchor="middle" fill="currentColor" opacity="0.55" font-size="11">scale?</text>
  <text x="340" y="26" fill="currentColor" opacity="0.55" font-size="11">mechanism</text>
  <line x1="20" y1="34" x2="620" y2="34" stroke="currentColor" opacity="0.5"/>

  <g fill="currentColor">
    <text x="24" y="58">k-NN, k-means</text>
    <text x="280" y="58" text-anchor="middle" fill="#e2903a">yes</text>
    <text x="340" y="58">distance &#8214;x &#8722; x&#8242;&#8214; sums raw squared units</text>

    <text x="24" y="88">SVM with RBF kernel</text>
    <text x="280" y="88" text-anchor="middle" fill="#e2903a">yes</text>
    <text x="340" y="88">kernel exp(&#8722;&#947;&#8214;x &#8722; x&#8242;&#8214;&#178;) is a distance in disguise</text>

    <text x="24" y="118">PCA</text>
    <text x="280" y="118" text-anchor="middle" fill="#e2903a">yes</text>
    <text x="340" y="118">variance carries units&#178;; big-unit axis = PC1</text>

    <text x="24" y="148">ridge, lasso, elastic net</text>
    <text x="280" y="148" text-anchor="middle" fill="#e2903a">yes</text>
    <text x="340" y="148">penalty &#8214;&#946;&#8214; adds coefficients in raw units</text>

    <text x="24" y="178">anything trained by GD</text>
    <text x="280" y="178" text-anchor="middle" fill="#e2903a">yes*</text>
    <text x="340" y="178">mismatched scales elongate the loss bowl</text>

    <text x="24" y="208">trees, forests, boosting</text>
    <text x="280" y="208" text-anchor="middle" fill="#5aa46a">no</text>
    <text x="340" y="208">splits x &#8804; t read order only; monotone-invariant</text>
  </g>

  <line x1="20" y1="188" x2="620" y2="188" stroke="currentColor" opacity="0.25" stroke-dasharray="3 3"/>
  <text x="24" y="236" fill="currentColor" opacity="0.55" font-size="11">* unpenalized optimum unchanged; convergence speed is not &#8212; and with a penalty the optimum moves too</text>
</svg>

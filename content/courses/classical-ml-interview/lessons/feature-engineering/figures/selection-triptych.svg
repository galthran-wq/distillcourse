<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <defs>
    <marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="currentColor" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- FILTER -->
  <text x="110" y="26" text-anchor="middle" fill="currentColor" font-size="13">filter</text>
  <rect x="24" y="38" width="172" height="34" rx="5" fill="none" stroke="currentColor"/>
  <text x="110" y="55" text-anchor="middle" fill="currentColor" font-size="11">score each feature vs y</text>
  <text x="110" y="67" text-anchor="middle" fill="currentColor" opacity="0.55" font-size="10">correlation / mutual info</text>
  <line x1="110" y1="72" x2="110" y2="88" stroke="currentColor" marker-end="url(#arrS)"/>
  <rect x="24" y="92" width="172" height="26" rx="5" fill="none" stroke="currentColor"/>
  <text x="110" y="109" text-anchor="middle" fill="currentColor" font-size="11">keep top k &#8594; fit model</text>
  <text x="110" y="140" text-anchor="middle" fill="currentColor" font-size="11">cost: p scores &#8212; cheapest</text>
  <text x="110" y="156" text-anchor="middle" fill="currentColor" opacity="0.55" font-size="10">blind to interactions + redundancy</text>

  <!-- WRAPPER -->
  <text x="320" y="26" text-anchor="middle" fill="currentColor" font-size="13">wrapper</text>
  <rect x="234" y="38" width="172" height="34" rx="5" fill="none" stroke="currentColor"/>
  <text x="320" y="55" text-anchor="middle" fill="currentColor" font-size="11">search subsets greedily</text>
  <text x="320" y="67" text-anchor="middle" fill="currentColor" opacity="0.55" font-size="10">forward / backward stepwise</text>
  <line x1="320" y1="72" x2="320" y2="88" stroke="currentColor" marker-end="url(#arrS)"/>
  <rect x="234" y="92" width="172" height="26" rx="5" fill="none" stroke="currentColor"/>
  <text x="320" y="109" text-anchor="middle" fill="currentColor" font-size="11">CV-score each candidate set</text>
  <path d="M 410 105 C 432 100, 432 60, 410 55" fill="none" stroke="currentColor" opacity="0.5" marker-end="url(#arrS)"/>
  <text x="320" y="140" text-anchor="middle" fill="currentColor" font-size="11">cost: many fits &#8212; dearest</text>
  <text x="320" y="156" text-anchor="middle" fill="currentColor" opacity="0.55" font-size="10">honest, if the loop sits inside folds</text>

  <!-- EMBEDDED -->
  <text x="530" y="26" text-anchor="middle" fill="currentColor" font-size="13">embedded</text>
  <rect x="444" y="38" width="172" height="34" rx="5" fill="none" stroke="currentColor"/>
  <text x="530" y="55" text-anchor="middle" fill="currentColor" font-size="11">fit a selecting model once</text>
  <text x="530" y="67" text-anchor="middle" fill="currentColor" opacity="0.55" font-size="10">lasso / tree importances</text>
  <line x1="530" y1="72" x2="530" y2="88" stroke="currentColor" marker-end="url(#arrS)"/>
  <rect x="444" y="92" width="172" height="26" rx="5" fill="none" stroke="currentColor"/>
  <text x="530" y="109" text-anchor="middle" fill="currentColor" font-size="11">zeros / rankings select</text>
  <text x="530" y="140" text-anchor="middle" fill="currentColor" font-size="11">cost: one fit</text>
  <text x="530" y="156" text-anchor="middle" fill="currentColor" opacity="0.55" font-size="10">arbitrary pick in correlated groups</text>

  <!-- placement band -->
  <rect x="24" y="180" width="592" height="42" rx="6" fill="none" stroke="#5aa46a" stroke-width="1.8"/>
  <text x="320" y="198" text-anchor="middle" fill="#5aa46a">all three read labels &#8594; the whole selector runs inside each CV fold,</text>
  <text x="320" y="214" text-anchor="middle" fill="#5aa46a">as a pipeline stage refit per fold</text>

  <g opacity="0.45">
    <rect x="24" y="240" width="592" height="34" rx="6" fill="none" stroke="currentColor" stroke-dasharray="4 3"/>
    <text x="320" y="261" text-anchor="middle" fill="currentColor">select once on all data, then cross-validate the survivors</text>
    <line x1="120" y1="257" x2="520" y2="257" stroke="#e2903a" stroke-width="2"/>
    <text x="590" y="262" fill="#e2903a" font-size="14">&#10007;</text>
  </g>
</svg>

<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <text x="20" y="24" fill="currentColor" font-size="13">frame 1 &#183; naive: level mean over all rows &#8212; own row included</text>

  <!-- table header -->
  <text x="40" y="52" text-anchor="middle" fill="currentColor" opacity="0.55" font-size="11">row</text>
  <text x="95" y="52" text-anchor="middle" fill="currentColor" opacity="0.55" font-size="11">city</text>
  <text x="150" y="52" text-anchor="middle" fill="currentColor" opacity="0.55" font-size="11">y</text>
  <text x="212" y="52" text-anchor="middle" fill="currentColor" opacity="0.55" font-size="11">enc</text>
  <line x1="20" y1="60" x2="250" y2="60" stroke="currentColor" opacity="0.5"/>

  <!-- highlight row 7 -->
  <rect x="22" y="222" width="228" height="22" rx="4" fill="#e2903a" opacity="0.18"/>

  <!-- rows -->
  <g fill="currentColor">
    <text x="40" y="80" text-anchor="middle">1</text><text x="95" y="80" text-anchor="middle">Paris</text><text x="150" y="80" text-anchor="middle">1</text><text x="212" y="80" text-anchor="middle">0.67</text>
    <text x="40" y="106" text-anchor="middle">2</text><text x="95" y="106" text-anchor="middle">Paris</text><text x="150" y="106" text-anchor="middle">0</text><text x="212" y="106" text-anchor="middle">0.67</text>
    <text x="40" y="132" text-anchor="middle">3</text><text x="95" y="132" text-anchor="middle">Paris</text><text x="150" y="132" text-anchor="middle">1</text><text x="212" y="132" text-anchor="middle">0.67</text>
    <text x="40" y="158" text-anchor="middle">4</text><text x="95" y="158" text-anchor="middle">Lyon</text><text x="150" y="158" text-anchor="middle">0</text><text x="212" y="158" text-anchor="middle">0.33</text>
    <text x="40" y="184" text-anchor="middle">5</text><text x="95" y="184" text-anchor="middle">Lyon</text><text x="150" y="184" text-anchor="middle">1</text><text x="212" y="184" text-anchor="middle">0.33</text>
    <text x="40" y="210" text-anchor="middle">6</text><text x="95" y="210" text-anchor="middle">Lyon</text><text x="150" y="210" text-anchor="middle">0</text><text x="212" y="210" text-anchor="middle">0.33</text>
    <text x="40" y="238" text-anchor="middle">7</text><text x="95" y="238" text-anchor="middle">Nice</text><text x="150" y="238" text-anchor="middle" fill="#e2903a">1</text><text x="212" y="238" text-anchor="middle" fill="#e2903a">1.00</text>
  </g>

  <!-- own-label arrow on row 7 -->
  <path d="M 158 232 C 170 224, 183 224, 193 231" fill="none" stroke="#e2903a" stroke-width="1.8"/>
  <path d="M 186 227 L 193 231 L 185 235" fill="none" stroke="#e2903a" stroke-width="1.8"/>

  <!-- right panel -->
  <text x="290" y="80" fill="currentColor">enc(row) = mean of y over all rows of its level</text>
  <text x="290" y="102" fill="currentColor" opacity="0.55" font-size="11">Paris: (1+0+1)/3 = 0.67&#160;&#160;&#160;Lyon: (0+1+0)/3 = 0.33</text>
  <text x="290" y="140" fill="#e2903a">Nice occurs once: enc = its own label, copied into x</text>
  <text x="290" y="162" fill="currentColor" opacity="0.55" font-size="11">every row&#8217;s own y enters its encoding, at weight 1/n of its level</text>
  <text x="290" y="200" fill="currentColor" font-size="11">train/validation: split on enc &#8805; 0.9 &#8594; row 7 perfect</text>
  <text x="290" y="218" fill="currentColor" font-size="11">production: next Nice row gets 1.00 whatever its label</text>
</svg>

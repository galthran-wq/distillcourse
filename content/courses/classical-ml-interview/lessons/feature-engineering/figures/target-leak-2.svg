<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <text x="20" y="24" fill="currentColor" font-size="13">frame 2 &#183; K-fold: each row encoded from the other fold only</text>

  <!-- table header -->
  <text x="40" y="52" text-anchor="middle" fill="currentColor" opacity="0.55" font-size="11">row</text>
  <text x="95" y="52" text-anchor="middle" fill="currentColor" opacity="0.55" font-size="11">city</text>
  <text x="150" y="52" text-anchor="middle" fill="currentColor" opacity="0.55" font-size="11">y</text>
  <text x="212" y="52" text-anchor="middle" fill="currentColor" opacity="0.55" font-size="11">enc</text>
  <text x="245" y="52" text-anchor="middle" fill="#4c8dd6" font-size="11">fold</text>
  <line x1="20" y1="60" x2="260" y2="60" stroke="currentColor" opacity="0.5"/>

  <!-- highlight row 7 -->
  <rect x="22" y="222" width="228" height="22" rx="4" fill="#e2903a" opacity="0.18"/>

  <!-- rows -->
  <g fill="currentColor">
    <text x="40" y="80" text-anchor="middle">1</text><text x="95" y="80" text-anchor="middle">Paris</text><text x="150" y="80" text-anchor="middle">1</text><text x="212" y="80" text-anchor="middle">0.50</text><text x="245" y="80" text-anchor="middle" fill="#4c8dd6">A</text>
    <text x="40" y="106" text-anchor="middle">2</text><text x="95" y="106" text-anchor="middle">Paris</text><text x="150" y="106" text-anchor="middle">0</text><text x="212" y="106" text-anchor="middle">1.00</text><text x="245" y="106" text-anchor="middle" fill="#4c8dd6">B</text>
    <text x="40" y="132" text-anchor="middle">3</text><text x="95" y="132" text-anchor="middle">Paris</text><text x="150" y="132" text-anchor="middle">1</text><text x="212" y="132" text-anchor="middle">1.00</text><text x="245" y="132" text-anchor="middle" fill="#4c8dd6">B</text>
    <text x="40" y="158" text-anchor="middle">4</text><text x="95" y="158" text-anchor="middle">Lyon</text><text x="150" y="158" text-anchor="middle">0</text><text x="212" y="158" text-anchor="middle">0.00</text><text x="245" y="158" text-anchor="middle" fill="#4c8dd6">A</text>
    <text x="40" y="184" text-anchor="middle">5</text><text x="95" y="184" text-anchor="middle">Lyon</text><text x="150" y="184" text-anchor="middle">1</text><text x="212" y="184" text-anchor="middle">0.00</text><text x="245" y="184" text-anchor="middle" fill="#4c8dd6">A</text>
    <text x="40" y="210" text-anchor="middle">6</text><text x="95" y="210" text-anchor="middle">Lyon</text><text x="150" y="210" text-anchor="middle">0</text><text x="212" y="210" text-anchor="middle">0.50</text><text x="245" y="210" text-anchor="middle" fill="#4c8dd6">B</text>
    <text x="40" y="238" text-anchor="middle">7</text><text x="95" y="238" text-anchor="middle">Nice</text><text x="150" y="238" text-anchor="middle">1</text><text x="212" y="238" text-anchor="middle" fill="#e2903a">0.33</text><text x="245" y="238" text-anchor="middle" fill="#4c8dd6">A</text>
  </g>

  <!-- right panel -->
  <text x="290" y="80" fill="currentColor">fold A rows use fold B statistics, and vice versa</text>
  <text x="290" y="102" fill="#4c8dd6" font-size="11">row 1 (A): Paris in B = rows 2,3 &#8594; (0+1)/2 = 0.50</text>
  <text x="290" y="120" fill="#4c8dd6" font-size="11">row 4 (A): Lyon in B = row 6 &#8594; 0.00</text>
  <text x="290" y="158" fill="#e2903a">row 7: no Nice in fold B &#8594; fallback,</text>
  <text x="290" y="176" fill="#e2903a">fold B global mean (0+1+0)/3 = 0.33</text>
  <text x="290" y="214" fill="currentColor" opacity="0.55" font-size="11">no row&#8217;s own label enters its value; fold statistics</text>
  <text x="290" y="230" fill="currentColor" opacity="0.55" font-size="11">still share training labels &#8212; small residual leak remains</text>
</svg>

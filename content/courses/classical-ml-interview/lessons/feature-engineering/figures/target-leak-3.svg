<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <text x="20" y="24" fill="currentColor" font-size="13">frame 3 &#183; ordered: running mean of preceding rows + prior</text>

  <!-- table header -->
  <text x="40" y="52" text-anchor="middle" fill="currentColor" opacity="0.55" font-size="11">row</text>
  <text x="95" y="52" text-anchor="middle" fill="currentColor" opacity="0.55" font-size="11">city</text>
  <text x="150" y="52" text-anchor="middle" fill="currentColor" opacity="0.55" font-size="11">y</text>
  <text x="212" y="52" text-anchor="middle" fill="currentColor" opacity="0.55" font-size="11">enc</text>
  <line x1="20" y1="60" x2="260" y2="60" stroke="currentColor" opacity="0.5"/>

  <!-- time arrow down the table -->
  <line x1="256" y1="72" x2="256" y2="240" stroke="#4c8dd6" stroke-width="1.5"/>
  <path d="M 251 233 L 256 242 L 261 233" fill="none" stroke="#4c8dd6" stroke-width="1.5"/>
  <text x="266" y="90" fill="#4c8dd6" font-size="11" transform="rotate(90 266 90)">time</text>

  <!-- highlight row 7 -->
  <rect x="22" y="222" width="228" height="22" rx="4" fill="#e2903a" opacity="0.18"/>

  <!-- rows -->
  <g fill="currentColor">
    <text x="40" y="80" text-anchor="middle">1</text><text x="95" y="80" text-anchor="middle">Paris</text><text x="150" y="80" text-anchor="middle">1</text><text x="212" y="80" text-anchor="middle">0.50</text>
    <text x="40" y="106" text-anchor="middle">2</text><text x="95" y="106" text-anchor="middle">Paris</text><text x="150" y="106" text-anchor="middle">0</text><text x="212" y="106" text-anchor="middle">0.75</text>
    <text x="40" y="132" text-anchor="middle">3</text><text x="95" y="132" text-anchor="middle">Paris</text><text x="150" y="132" text-anchor="middle">1</text><text x="212" y="132" text-anchor="middle">0.50</text>
    <text x="40" y="158" text-anchor="middle">4</text><text x="95" y="158" text-anchor="middle">Lyon</text><text x="150" y="158" text-anchor="middle">0</text><text x="212" y="158" text-anchor="middle">0.50</text>
    <text x="40" y="184" text-anchor="middle">5</text><text x="95" y="184" text-anchor="middle">Lyon</text><text x="150" y="184" text-anchor="middle">1</text><text x="212" y="184" text-anchor="middle">0.25</text>
    <text x="40" y="210" text-anchor="middle">6</text><text x="95" y="210" text-anchor="middle">Lyon</text><text x="150" y="210" text-anchor="middle">0</text><text x="212" y="210" text-anchor="middle">0.50</text>
    <text x="40" y="238" text-anchor="middle">7</text><text x="95" y="238" text-anchor="middle">Nice</text><text x="150" y="238" text-anchor="middle">1</text><text x="212" y="238" text-anchor="middle" fill="#e2903a">0.50</text>
  </g>

  <!-- right panel -->
  <text x="290" y="80" fill="currentColor">enc(row i) = (S&#8249;&#7522; + a&#183;p) / (n&#8249;&#7522; + a),&#160; a = 1, p = 0.5</text>
  <text x="290" y="102" fill="currentColor" opacity="0.55" font-size="11">S&#8249;&#7522;, n&#8249;&#7522;: label sum and count of preceding same-level rows</text>
  <text x="290" y="130" fill="#4c8dd6" font-size="11">row 2: one Paris above, y = 1 &#8594; (1 + 0.5)/2 = 0.75</text>
  <text x="290" y="148" fill="#4c8dd6" font-size="11">row 5: one Lyon above, y = 0 &#8594; (0 + 0.5)/2 = 0.25</text>
  <text x="290" y="186" fill="#e2903a">row 7: no Nice history &#8594; prior 0.50</text>
  <text x="290" y="214" fill="currentColor" opacity="0.55" font-size="11">a stream computed strictly from the past: no label,</text>
  <text x="290" y="230" fill="currentColor" opacity="0.55" font-size="11">own or later, can reach its own row &#8212; the strict fix</text>
</svg>

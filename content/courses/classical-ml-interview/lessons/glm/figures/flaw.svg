<svg viewBox="0 0 640 270" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- ===== left panel: binary response ===== -->
  <text x="165" y="18" text-anchor="middle" font-size="12" font-weight="600" fill="currentColor">Binary y: the line leaves [0, 1]</text>
  <rect x="40" y="28" width="250" height="32" fill="currentColor" opacity="0.06"/>
  <rect x="40" y="190" width="250" height="32" fill="currentColor" opacity="0.06"/>
  <line x1="40" y1="28" x2="40" y2="222" stroke="currentColor"/>
  <line x1="40" y1="222" x2="290" y2="222" stroke="currentColor"/>
  <line x1="40" y1="60" x2="290" y2="60" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5"/>
  <line x1="40" y1="190" x2="290" y2="190" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5"/>
  <text x="34" y="64" text-anchor="end" font-size="11" fill="currentColor">1</text>
  <text x="34" y="194" text-anchor="end" font-size="11" fill="currentColor">0</text>
  <text x="286" y="236" text-anchor="end" font-size="11" fill="currentColor" opacity="0.55">x</text>
  <text x="46" y="42" font-size="10" fill="currentColor" opacity="0.55">p &gt; 1: impossible</text>
  <text x="152" y="216" font-size="10" fill="currentColor" opacity="0.55">p &lt; 0: impossible</text>
  <g fill="currentColor">
    <circle cx="58" cy="190" r="4"/><circle cx="76" cy="190" r="4"/><circle cx="94" cy="190" r="4"/><circle cx="112" cy="190" r="4"/><circle cx="134" cy="190" r="4"/>
    <circle cx="196" cy="60" r="4"/><circle cx="216" cy="60" r="4"/><circle cx="236" cy="60" r="4"/><circle cx="256" cy="60" r="4"/><circle cx="274" cy="60" r="4"/>
  </g>
  <line x1="46" y1="214" x2="284" y2="36" stroke="#4c8dd6" stroke-width="2"/>
  <path d="M 46 189 C 110 187, 140 165, 165 125 C 190 85, 220 63, 284 61" fill="none" stroke="#e2903a" stroke-width="2.5"/>

  <!-- ===== right panel: count response ===== -->
  <text x="490" y="18" text-anchor="middle" font-size="12" font-weight="600" fill="currentColor">Count y: negative predictions, growing spread</text>
  <rect x="360" y="190" width="250" height="32" fill="currentColor" opacity="0.06"/>
  <line x1="360" y1="28" x2="360" y2="222" stroke="currentColor"/>
  <line x1="360" y1="190" x2="610" y2="190" stroke="currentColor"/>
  <text x="354" y="194" text-anchor="end" font-size="11" fill="currentColor">0</text>
  <text x="606" y="185" text-anchor="end" font-size="11" fill="currentColor" opacity="0.55">x</text>
  <text x="368" y="214" font-size="10" fill="currentColor" opacity="0.55">y &lt; 0: impossible</text>
  <text x="392" y="52" font-size="10" fill="currentColor" opacity="0.55">spread grows with the mean</text>
  <g fill="currentColor">
    <circle cx="375" cy="185" r="3.5"/><circle cx="390" cy="187" r="3.5"/><circle cx="405" cy="182" r="3.5"/>
    <circle cx="420" cy="184" r="3.5"/><circle cx="435" cy="176" r="3.5"/><circle cx="450" cy="181" r="3.5"/>
    <circle cx="465" cy="170" r="3.5"/><circle cx="480" cy="177" r="3.5"/><circle cx="495" cy="158" r="3.5"/>
    <circle cx="510" cy="172" r="3.5"/><circle cx="525" cy="146" r="3.5"/><circle cx="540" cy="166" r="3.5"/>
    <circle cx="555" cy="128" r="3.5"/><circle cx="570" cy="155" r="3.5"/><circle cx="585" cy="105" r="3.5"/>
    <circle cx="600" cy="140" r="3.5"/><circle cx="608" cy="88" r="3.5"/>
  </g>
  <line x1="368" y1="206" x2="608" y2="80" stroke="#4c8dd6" stroke-width="2"/>
  <path d="M 372 186 C 450 182, 500 170, 540 145 C 570 125, 595 95, 610 70" fill="none" stroke="#e2903a" stroke-width="2.5"/>

  <!-- ===== legend ===== -->
  <g font-size="11">
    <line x1="170" y1="256" x2="200" y2="256" stroke="#e2903a" stroke-width="2.5"/>
    <text x="206" y="260" fill="currentColor">GLM mean (sigmoid / exponential)</text>
    <line x1="410" y1="256" x2="440" y2="256" stroke="#4c8dd6" stroke-width="2"/>
    <text x="446" y="260" fill="currentColor">least-squares line</text>
  </g>
</svg>

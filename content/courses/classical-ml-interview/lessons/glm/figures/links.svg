<svg viewBox="0 0 640 225" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- panel 1: Gaussian, identity -->
  <text x="125" y="18" text-anchor="middle" font-size="12" font-weight="600" fill="currentColor">Gaussian: identity link</text>
  <text x="125" y="34" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">mean = &#951;</text>
  <line x1="55" y1="45" x2="55" y2="185" stroke="currentColor"/>
  <line x1="55" y1="185" x2="200" y2="185" stroke="currentColor"/>
  <text x="197" y="199" text-anchor="end" font-size="11" fill="currentColor" opacity="0.55">&#951;</text>
  <rect x="47" y="45" width="4" height="140" fill="#4c8dd6" opacity="0.8"/>
  <line x1="60" y1="180" x2="195" y2="50" stroke="#e2903a" stroke-width="2.5"/>
  <text x="125" y="215" text-anchor="middle" font-size="11" fill="currentColor">&#956; &#8712; (&#8722;&#8734;, &#8734;)</text>

  <!-- panel 2: Bernoulli, logit -->
  <text x="330" y="18" text-anchor="middle" font-size="12" font-weight="600" fill="currentColor">Bernoulli: logit link</text>
  <text x="330" y="34" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">mean = &#963;(&#951;)</text>
  <line x1="260" y1="45" x2="260" y2="185" stroke="currentColor"/>
  <line x1="260" y1="185" x2="405" y2="185" stroke="currentColor"/>
  <text x="402" y="199" text-anchor="end" font-size="11" fill="currentColor" opacity="0.55">&#951;</text>
  <line x1="260" y1="60" x2="405" y2="60" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5"/>
  <line x1="260" y1="180" x2="405" y2="180" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5"/>
  <text x="253" y="64" text-anchor="end" font-size="10" fill="currentColor" opacity="0.55">1</text>
  <text x="253" y="184" text-anchor="end" font-size="10" fill="currentColor" opacity="0.55">0</text>
  <rect x="252" y="60" width="4" height="120" fill="#4c8dd6" opacity="0.8"/>
  <path d="M 265 178 C 305 176, 320 150, 332 120 C 345 90, 360 64, 400 62" fill="none" stroke="#e2903a" stroke-width="2.5"/>
  <text x="330" y="215" text-anchor="middle" font-size="11" fill="currentColor">&#956; &#8712; (0, 1)</text>

  <!-- panel 3: Poisson, log -->
  <text x="535" y="18" text-anchor="middle" font-size="12" font-weight="600" fill="currentColor">Poisson: log link</text>
  <text x="535" y="34" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">mean = exp(&#951;)</text>
  <line x1="465" y1="45" x2="465" y2="185" stroke="currentColor"/>
  <line x1="465" y1="185" x2="610" y2="185" stroke="currentColor"/>
  <text x="607" y="199" text-anchor="end" font-size="11" fill="currentColor" opacity="0.55">&#951;</text>
  <rect x="457" y="45" width="4" height="135" fill="#4c8dd6" opacity="0.8"/>
  <path d="M 470 180 C 520 178, 550 165, 570 130 C 585 100, 595 70, 600 52" fill="none" stroke="#e2903a" stroke-width="2.5"/>
  <text x="535" y="215" text-anchor="middle" font-size="11" fill="currentColor">&#956; &#8712; (0, &#8734;)</text>
</svg>

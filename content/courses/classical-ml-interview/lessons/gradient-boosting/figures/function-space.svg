<svg viewBox="0 0 620 308" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- left panel: parameter space -->
  <text x="160" y="20" font-size="13" fill="currentColor" text-anchor="middle">parameter space: gradient descent</text>
  <g stroke="currentColor" fill="none" opacity="0.4">
    <ellipse cx="160" cy="140" rx="100" ry="62"/>
    <ellipse cx="160" cy="140" rx="66" ry="40"/>
    <ellipse cx="160" cy="140" rx="34" ry="20"/>
  </g>
  <circle cx="160" cy="140" r="3" fill="currentColor" opacity="0.6"/>
  <!-- descent path -->
  <polyline points="70,86 130,168 118,120 158,154 150,136 160,143" fill="none" stroke="#e2903a" stroke-width="2"/>
  <circle cx="70" cy="86" r="4" fill="#e2903a"/>
  <text x="62" y="76" font-size="11" fill="#e2903a">start</text>
  <!-- formula -->
  <text x="160" y="238" font-size="15" fill="currentColor" text-anchor="middle">&#952; &#8592; &#952; &#8722; <tspan fill="#e2903a">&#951;</tspan> <tspan fill="#4c8dd6">&#8711;J(&#952;)</tspan></text>
  <text x="160" y="260" font-size="11.5" fill="currentColor" opacity="0.55" text-anchor="middle">coordinates: the d entries of &#952;</text>
  <text x="160" y="276" font-size="11.5" fill="currentColor" opacity="0.55" text-anchor="middle"><tspan fill="#4c8dd6">gradient</tspan> computable in closed form</text>

  <!-- divider -->
  <line x1="308" y1="26" x2="308" y2="282" stroke="currentColor" opacity="0.25"/>

  <!-- right panel: function space -->
  <text x="466" y="20" font-size="13" fill="currentColor" text-anchor="middle">function space: gradient boosting</text>
  <!-- fitted-value cells -->
  <g>
    <rect x="346" y="52" width="44" height="30" rx="4" fill="none" stroke="currentColor" opacity="0.7"/>
    <rect x="394" y="52" width="44" height="30" rx="4" fill="none" stroke="currentColor" opacity="0.7"/>
    <rect x="442" y="52" width="44" height="30" rx="4" fill="none" stroke="currentColor" opacity="0.7"/>
    <rect x="490" y="52" width="44" height="30" rx="4" fill="none" stroke="currentColor" opacity="0.7"/>
    <rect x="538" y="52" width="44" height="30" rx="4" fill="none" stroke="currentColor" opacity="0.7"/>
  </g>
  <text x="368" y="71" font-size="11.5" fill="currentColor" text-anchor="middle">F(x&#8321;)</text>
  <text x="416" y="71" font-size="11.5" fill="currentColor" text-anchor="middle">F(x&#8322;)</text>
  <text x="464" y="71" font-size="11.5" fill="currentColor" text-anchor="middle">F(x&#8323;)</text>
  <text x="512" y="71" font-size="11.5" fill="currentColor" text-anchor="middle">F(x&#8324;)</text>
  <text x="560" y="71" font-size="11.5" fill="currentColor" text-anchor="middle">F(x&#8325;)</text>
  <text x="338" y="71" font-size="11.5" fill="currentColor" opacity="0.55" text-anchor="end">n fitted values:</text>
  <!-- negative-gradient arrows per coordinate -->
  <g stroke="#4c8dd6" stroke-width="2">
    <line x1="368" y1="118" x2="368" y2="94"/>
    <line x1="416" y1="118" x2="416" y2="100"/>
    <line x1="464" y1="98" x2="464" y2="118"/>
    <line x1="512" y1="118" x2="512" y2="96"/>
    <line x1="560" y1="104" x2="560" y2="118"/>
  </g>
  <g fill="#4c8dd6">
    <path d="M 368 90 l -4 7 h 8 z"/>
    <path d="M 416 96 l -4 7 h 8 z"/>
    <path d="M 464 122 l -4 -7 h 8 z"/>
    <path d="M 512 92 l -4 7 h 8 z"/>
    <path d="M 560 122 l -4 -7 h 8 z"/>
  </g>
  <text x="466" y="140" font-size="11.5" fill="#4c8dd6" text-anchor="middle">&#8722;g&#7522; = pseudo-residuals r&#7522;, one per point</text>
  <!-- tree approximating the gradient -->
  <g stroke="#e2903a" stroke-width="1.6" fill="none">
    <line x1="398" y1="164" x2="370" y2="188"/>
    <line x1="398" y1="164" x2="426" y2="188"/>
  </g>
  <circle cx="398" cy="162" r="7" fill="none" stroke="#e2903a" stroke-width="1.6"/>
  <rect x="358" y="188" width="24" height="15" rx="3" fill="none" stroke="#e2903a" stroke-width="1.6"/>
  <rect x="414" y="188" width="24" height="15" rx="3" fill="none" stroke="#e2903a" stroke-width="1.6"/>
  <text x="452" y="176" font-size="11.5" fill="#e2903a">one tree h fit to (r&#8321;, &#8230;, r&#8345;)</text>
  <text x="452" y="192" font-size="11.5" fill="currentColor" opacity="0.55">defined at every x,</text>
  <text x="452" y="206" font-size="11.5" fill="currentColor" opacity="0.55">not only the n points</text>
  <!-- formula -->
  <text x="466" y="238" font-size="15" fill="currentColor" text-anchor="middle">F &#8592; F + <tspan fill="#e2903a">&#957;</tspan> <tspan fill="#e2903a">h</tspan>,&#8201; <tspan fill="#e2903a">h</tspan> &#8776; <tspan fill="#4c8dd6">&#8722;g</tspan></text>
  <text x="466" y="260" font-size="11.5" fill="currentColor" opacity="0.55" text-anchor="middle">coordinates: the n fitted values F(x&#7522;)</text>
  <text x="466" y="276" font-size="11.5" fill="currentColor" opacity="0.55" text-anchor="middle">step direction restricted to the tree family</text>
  <!-- tally -->
  <text x="310" y="300" font-size="12" fill="currentColor" text-anchor="middle">same update rule; only the space changed</text>
</svg>

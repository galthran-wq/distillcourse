<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; font-size: 13px; }
    .head  { fill: currentColor; font-size: 13px; font-weight: 600; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .axis  { stroke: currentColor; stroke-opacity: 0.35; stroke-width: 1; fill: none; }
    .tree  { stroke: currentColor; stroke-width: 2; fill: none; }
    .new   { stroke: #e2903a; stroke-width: 2.5; fill: none; }
  </style>
  <text class="muted" x="60" y="36">dissimilarity matrix</text>
  <text class="muted" x="480" y="36">dendrogram</text>

  <text class="head" x="60" y="100">merge history complete</text>
  <text class="muted" x="60" y="128">four merges, recorded with their heights:</text>
  <text class="muted" x="60" y="150">{D,E} at 1&#160;&#160;&#160;{A,B} at 2</text>
  <text class="muted" x="60" y="172">{A,B,C} at 3&#160;&#160;&#160;{A,B,C,D,E} at 4</text>
  <text class="muted" x="60" y="206">the tree encodes every partition at once:</text>
  <text class="muted" x="60" y="228">cut at a height h to read one off</text>

  <path class="axis" d="M360 260 L360 60"/>
  <line class="axis" x1="356" y1="260" x2="360" y2="260"/><text class="muted" x="351" y="264" text-anchor="end">0</text>
  <line class="axis" x1="356" y1="215" x2="360" y2="215"/><text class="muted" x="351" y="219" text-anchor="end">1</text>
  <line class="axis" x1="356" y1="170" x2="360" y2="170"/><text class="muted" x="351" y="174" text-anchor="end">2</text>
  <line class="axis" x1="356" y1="125" x2="360" y2="125"/><text class="muted" x="351" y="129" text-anchor="end">3</text>
  <line class="axis" x1="356" y1="80" x2="360" y2="80"/><text class="muted" x="351" y="84" text-anchor="end">4</text>

  <circle cx="390" cy="260" r="3.5" fill="currentColor"/>
  <circle cx="440" cy="260" r="3.5" fill="currentColor"/>
  <circle cx="490" cy="260" r="3.5" fill="currentColor"/>
  <circle cx="540" cy="260" r="3.5" fill="currentColor"/>
  <circle cx="590" cy="260" r="3.5" fill="currentColor"/>
  <path class="tree" d="M540 260 L540 215 L590 215 L590 260"/>
  <path class="tree" d="M390 260 L390 170 L440 170 L440 260"/>
  <path class="tree" d="M415 170 L415 125 L490 125 L490 260"/>
  <path class="new" d="M452 125 L452 80 L565 80 L565 215"/>
  <text class="label" x="390" y="280" text-anchor="middle">A</text>
  <text class="label" x="440" y="280" text-anchor="middle">B</text>
  <text class="label" x="490" y="280" text-anchor="middle">C</text>
  <text class="label" x="540" y="280" text-anchor="middle">D</text>
  <text class="label" x="590" y="280" text-anchor="middle">E</text>

  <text class="muted" x="320" y="308" text-anchor="middle">step 5 — the final merge at height 4; n &#8722; 1 = 4 merges built the whole tree</text>
</svg>

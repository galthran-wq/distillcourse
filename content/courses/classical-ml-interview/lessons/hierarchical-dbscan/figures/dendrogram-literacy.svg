<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; font-size: 13px; }
    .head  { fill: currentColor; font-size: 13px; font-weight: 600; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .axis  { stroke: currentColor; stroke-opacity: 0.35; stroke-width: 1; fill: none; }
    .tree  { stroke: currentColor; stroke-width: 2; fill: none; }
    .cut   { stroke: #5aa46a; stroke-width: 2; stroke-dasharray: 5 4; fill: none; }
  </style>

  <!-- correct reading -->
  <text x="20" y="46" fill="#5aa46a" font-size="15" font-weight="700">&#10003;</text>
  <text class="head" x="38" y="46">read fusion heights</text>
  <text class="muted" x="38" y="66">C joins {A,B} at height 3;</text>
  <text class="muted" x="38" y="84">the two groups fuse only at 4</text>

  <!-- wrong reading -->
  <text x="20" y="126" fill="currentColor" font-size="15" font-weight="700">&#10007;</text>
  <text class="head" x="38" y="126">read horizontal adjacency</text>
  <text class="muted" x="38" y="146">&#8220;C is drawn next to D,</text>
  <text class="muted" x="38" y="164">so C and D are similar&#8221;</text>
  <line x1="36" y1="150" x2="228" y2="150" stroke="currentColor" stroke-width="1.4" stroke-opacity="0.7"/>
  <text class="muted" x="38" y="192">false: C and D fuse at the top,</text>
  <text class="muted" x="38" y="210">and every subtree may flip &#8212;</text>
  <text class="muted" x="38" y="228">2&#8308; = 16 leaf orders draw this tree</text>

  <!-- dendrogram -->
  <path class="axis" d="M330 250 L330 50"/>
  <line class="axis" x1="326" y1="250" x2="330" y2="250"/><text class="muted" x="321" y="254" text-anchor="end">0</text>
  <line class="axis" x1="326" y1="208" x2="330" y2="208"/><text class="muted" x="321" y="212" text-anchor="end">1</text>
  <line class="axis" x1="326" y1="166" x2="330" y2="166"/><text class="muted" x="321" y="170" text-anchor="end">2</text>
  <line class="axis" x1="326" y1="124" x2="330" y2="124"/><text class="muted" x="321" y="128" text-anchor="end">3</text>
  <line class="axis" x1="326" y1="82" x2="330" y2="82"/><text class="muted" x="321" y="86" text-anchor="end">4</text>

  <path class="tree" d="M370 250 L370 166 L420 166 L420 250"/>
  <path class="tree" d="M395 166 L395 124 L470 124 L470 250"/>
  <path class="tree" d="M520 250 L520 208 L570 208 L570 250"/>
  <path class="tree" d="M432 124 L432 82 L545 82 L545 208"/>

  <text class="label" x="370" y="270" text-anchor="middle">A</text>
  <text class="label" x="420" y="270" text-anchor="middle">B</text>
  <text class="label" x="470" y="270" text-anchor="middle">C</text>
  <text class="label" x="520" y="270" text-anchor="middle">D</text>
  <text class="label" x="570" y="270" text-anchor="middle">E</text>

  <!-- cut line -->
  <line class="cut" x1="340" y1="103" x2="600" y2="103"/>
  <text x="600" y="98" fill="#5aa46a" font-size="12" text-anchor="end">cut at h = 3.5</text>
  <text x="600" y="118" fill="#5aa46a" font-size="12" text-anchor="end">&#8594; {A,B,C}, {D,E}</text>

  <!-- flip arrows under D,E -->
  <path d="M520 292 C 535 302, 555 302, 570 292" fill="none" stroke="currentColor" stroke-opacity="0.45" stroke-width="1.2"/>
  <text class="muted" x="545" y="314" text-anchor="middle" font-size="11">order is arbitrary</text>
</svg>

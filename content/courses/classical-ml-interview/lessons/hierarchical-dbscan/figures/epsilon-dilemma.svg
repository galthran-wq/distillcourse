<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .head  { fill: currentColor; font-size: 13px; font-weight: 600; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .note  { font-size: 12px; }
    .axis  { stroke: currentColor; stroke-opacity: 0.35; stroke-width: 1; fill: none; }
  </style>

  <!-- left: two densities, one epsilon -->
  <text class="head" x="20" y="24">one &#949;, two densities</text>

  <!-- dense cluster -->
  <circle cx="75" cy="110" r="3.5" fill="currentColor"/><circle cx="86" cy="112" r="3.5" fill="currentColor"/>
  <circle cx="80" cy="122" r="3.5" fill="currentColor"/><circle cx="92" cy="120" r="3.5" fill="currentColor"/>
  <circle cx="70" cy="120" r="3.5" fill="currentColor"/><circle cx="88" cy="131" r="3.5" fill="currentColor"/>
  <circle cx="78" cy="133" r="3.5" fill="currentColor"/><circle cx="97" cy="110" r="3.5" fill="currentColor"/>
  <circle cx="96" cy="130" r="3.5" fill="currentColor"/><circle cx="84" cy="101" r="3.5" fill="currentColor"/>
  <!-- strays between -->
  <circle cx="140" cy="135" r="3.5" fill="currentColor" opacity="0.55"/>
  <circle cx="168" cy="148" r="3.5" fill="currentColor" opacity="0.55"/>
  <!-- sparse cluster -->
  <circle cx="200" cy="120" r="3.5" fill="currentColor"/><circle cx="245" cy="135" r="3.5" fill="currentColor"/>
  <circle cx="215" cy="165" r="3.5" fill="currentColor"/><circle cx="265" cy="170" r="3.5" fill="currentColor"/>
  <circle cx="230" cy="200" r="3.5" fill="currentColor"/><circle cx="275" cy="205" r="3.5" fill="currentColor"/>

  <!-- small epsilon on a dense and a sparse point -->
  <circle cx="80" cy="122" r="17" fill="none" stroke="#e2903a" stroke-width="1.8"/>
  <circle cx="245" cy="135" r="17" fill="none" stroke="#e2903a" stroke-width="1.8"/>
  <!-- large epsilon on the sparse point -->
  <circle cx="245" cy="135" r="58" fill="none" stroke="#4c8dd6" stroke-width="1.6" stroke-dasharray="5 4"/>

  <text class="note" x="20" y="60" fill="#e2903a">small &#949;: dense cluster found,</text>
  <text class="note" x="20" y="76" fill="#e2903a">sparse points all become noise</text>
  <text class="note" x="160" y="248" fill="#4c8dd6">large &#949;: sparse cluster found, but the</text>
  <text class="note" x="160" y="264" fill="#4c8dd6">dense cluster chains through the strays</text>

  <!-- right: k-distance plot -->
  <text class="head" x="380" y="24">the k-distance heuristic</text>
  <path class="axis" d="M380 250 L620 250"/>
  <path class="axis" d="M380 250 L380 55"/>
  <text class="muted" x="380" y="46">distance to 3rd nearest neighbor</text>
  <text class="muted" x="500" y="270" text-anchor="middle">points, sorted by that distance, descending</text>

  <polyline points="385,80 400,95 412,110 424,130 436,168 448,196 470,208 500,215 530,220 560,224 590,227 612,228"
            fill="none" stroke="currentColor" stroke-width="2" stroke-opacity="0.7"/>
  <circle cx="436" cy="168" r="5" fill="#e2903a"/>
  <line x1="380" y1="168" x2="431" y2="168" stroke="#e2903a" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text class="note" x="366" y="172" fill="#e2903a" text-anchor="end">&#949;</text>
  <text class="muted" x="404" y="70">noise, sparse points</text>
  <text class="muted" x="500" y="200">cluster points</text>
  <text class="note" x="452" y="150" fill="#e2903a">knee</text>

  <text class="muted" x="320" y="292" text-anchor="middle">one density threshold must serve every cluster; the knee of the k-distance curve is the standard compromise</text>
</svg>

  </style>

  <!-- panel 1: single -->
  <g transform="translate(8,0)">
    <text class="head" x="75" y="20" text-anchor="middle">single</text>
    <rect class="box" x="0" y="28" width="150" height="150" rx="6"/>
    <circle cx="6" cy="110" r="3.5" fill="#e2903a"/>
    <circle cx="22" cy="90" r="3.5" fill="#4c8dd6"/><circle cx="34" cy="81" r="3.5" fill="#4c8dd6"/><circle cx="46" cy="73" r="3.5" fill="#4c8dd6"/><circle cx="58" cy="66" r="3.5" fill="#4c8dd6"/><circle cx="70" cy="60" r="3.5" fill="#4c8dd6"/><circle cx="82" cy="55" r="3.5" fill="#4c8dd6"/><circle cx="94" cy="51" r="3.5" fill="#4c8dd6"/><circle cx="106" cy="48" r="3.5" fill="#4c8dd6"/>
    <circle cx="116" cy="60" r="3.5" fill="#4c8dd6"/><circle cx="124" cy="74" r="3.5" fill="#4c8dd6"/>
    <circle cx="120" cy="95" r="3.5" fill="#4c8dd6"/><circle cx="132" cy="90" r="3.5" fill="#4c8dd6"/><circle cx="128" cy="102" r="3.5" fill="#4c8dd6"/><circle cx="140" cy="98" r="3.5" fill="#4c8dd6"/><circle cx="134" cy="110" r="3.5" fill="#4c8dd6"/><circle cx="122" cy="112" r="3.5" fill="#4c8dd6"/><circle cx="142" cy="108" r="3.5" fill="#4c8dd6"/>
    <text class="muted" x="75" y="196" text-anchor="middle">chaining: one short link</text>
    <text class="muted" x="75" y="210" text-anchor="middle">welds all; the cut peels a stray</text>
  </g>

  <!-- panel 2: complete -->
  <g transform="translate(166,0)">
    <text class="head" x="75" y="20" text-anchor="middle">complete</text>

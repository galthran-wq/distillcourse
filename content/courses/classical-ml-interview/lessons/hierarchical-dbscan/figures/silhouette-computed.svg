<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; font-size: 13px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .note  { font-size: 12px; }
  </style>

  <!-- edges from C -->
  <line x1="210" y1="150" x2="90" y2="90" stroke="#e2903a" stroke-width="1.8"/>
  <line x1="210" y1="150" x2="110" y2="200" stroke="#e2903a" stroke-width="1.8"/>
  <line x1="210" y1="150" x2="330" y2="100" stroke="#4c8dd6" stroke-width="1.8"/>
  <line x1="210" y1="150" x2="330" y2="210" stroke="#4c8dd6" stroke-width="1.8"/>
  <text class="note" x="140" y="112" fill="#e2903a">8</text>
  <text class="note" x="158" y="188" fill="#e2903a">3</text>
  <text class="note" x="272" y="118" fill="#4c8dd6">4</text>
  <text class="note" x="272" y="192" fill="#4c8dd6">6</text>

  <!-- nodes -->
  <circle cx="90" cy="90" r="6" fill="#e2903a"/>
  <circle cx="110" cy="200" r="6" fill="#e2903a"/>
  <circle cx="210" cy="150" r="7" fill="none" stroke="#e2903a" stroke-width="2.5"/>
  <circle cx="330" cy="100" r="6" fill="#4c8dd6"/>
  <circle cx="330" cy="210" r="6" fill="#4c8dd6"/>
  <text class="label" x="76" y="76">A</text>
  <text class="label" x="94" y="222">B</text>
  <text class="label" x="206" y="132">C</text>
  <text class="label" x="344" y="98">D</text>
  <text class="label" x="344" y="222">E</text>
  <text class="note" x="60" y="42" fill="#e2903a">own cluster {A, B, C}</text>
  <text class="note" x="300" y="42" fill="#4c8dd6">other cluster {D, E}</text>

  <!-- formulas -->
  <text class="note" x="420" y="90" fill="#e2903a">a(C) = (8 + 3) / 2 = 5.5</text>
  <text class="muted" x="420" y="106">mean distance to own cluster</text>
  <text class="note" x="420" y="140" fill="#4c8dd6">b(C) = (4 + 6) / 2 = 5.0</text>
  <text class="muted" x="420" y="156">mean distance to nearest other</text>
  <text class="label" x="420" y="192">s(C) = (b &#8722; a) / max(a, b)</text>
  <text class="label" x="420" y="214">= &#8722;0.5 / 5.5 = &#8722;0.09</text>

  <!-- scale bar -->
  <line x1="60" y1="264" x2="580" y2="264" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.5"/>
  <line x1="60" y1="258" x2="60" y2="270" stroke="currentColor" stroke-opacity="0.35"/>
  <line x1="320" y1="258" x2="320" y2="270" stroke="currentColor" stroke-opacity="0.35"/>
  <line x1="580" y1="258" x2="580" y2="270" stroke="currentColor" stroke-opacity="0.35"/>
  <text class="muted" x="60" y="286" text-anchor="middle">&#8722;1&#160;&#160;wrong cluster</text>
  <text class="muted" x="320" y="286" text-anchor="middle">0&#160;&#160;on the fence</text>
  <text class="muted" x="580" y="286" text-anchor="middle">+1&#160;&#160;well placed</text>
  <circle cx="297" cy="264" r="5" fill="#e2903a"/>
  <text class="note" x="297" y="250" fill="#e2903a" text-anchor="middle">s(C)</text>
</svg>

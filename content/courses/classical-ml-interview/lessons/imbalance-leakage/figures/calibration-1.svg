<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; font-size: 13px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .axis  { stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.2; fill: none; }
    .diag  { stroke: currentColor; stroke-opacity: 0.4; stroke-dasharray: 3 3; fill: none; }
    .pt    { fill: #e2903a; }
  </style>

  <text class="label" x="20" y="26"><tspan fill="#e2903a" font-weight="bold">1 · training world, π = 0.5</tspan> — calibrated</text>

  <!-- table -->
  <text class="muted" x="20" y="62">p̂ (trained 1:1)</text>
  <text class="muted" x="150" y="62">observed</text>
  <text class="muted" x="235" y="62">corrected</text>
  <text class="label" x="20" y="88">0.50</text><text class="muted" x="150" y="88">—</text><text class="muted" x="235" y="88">—</text>
  <text class="label" x="20" y="113">0.70</text><text class="muted" x="150" y="113">—</text><text class="muted" x="235" y="113">—</text>
  <text class="label" x="20" y="138">0.90</text><text class="muted" x="150" y="138">—</text><text class="muted" x="235" y="138">—</text>
  <text class="label" x="20" y="163">0.98</text><text class="muted" x="150" y="163">—</text><text class="muted" x="235" y="163">—</text>

  <text class="muted" x="20" y="210">on data at the training prior,</text>
  <text class="muted" x="20" y="228">each score bin's positive fraction</text>
  <text class="muted" x="20" y="246">matches its predicted value</text>

  <!-- reliability axes -->
  <path class="axis" d="M 340 40 L 340 280 L 580 280"/>
  <path class="diag" d="M 340 280 L 580 40"/>
  <text class="muted" x="460" y="304" text-anchor="middle">predicted probability</text>
  <text class="muted" transform="rotate(-90 318 160)" x="318" y="160" text-anchor="middle">observed positive fraction</text>
  <text class="muted" x="336" y="294">0</text>
  <text class="muted" x="576" y="294">1</text>

  <circle class="pt" cx="460" cy="160" r="4.5"/>
  <circle class="pt" cx="508" cy="112" r="4.5"/>
  <circle class="pt" cx="556" cy="64" r="4.5"/>
  <circle class="pt" cx="575" cy="45" r="4.5"/>
</svg>

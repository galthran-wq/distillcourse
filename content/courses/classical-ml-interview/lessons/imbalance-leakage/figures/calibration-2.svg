<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; font-size: 13px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .axis  { stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.2; fill: none; }
    .diag  { stroke: currentColor; stroke-opacity: 0.4; stroke-dasharray: 3 3; fill: none; }
    .pt    { fill: #e2903a; }
    .ghost { fill: none; stroke: #e2903a; stroke-opacity: 0.35; stroke-dasharray: 2 2; }
    .drop  { stroke: #4c8dd6; stroke-opacity: 0.6; stroke-width: 1.2; stroke-dasharray: 3 3; }
  </style>

  <text class="label" x="20" y="26"><tspan fill="#e2903a" font-weight="bold">2 · deployment, π = 0.01</tspan> — probabilities inflated</text>

  <!-- table -->
  <text class="muted" x="20" y="62">p̂ (trained 1:1)</text>
  <text class="muted" x="150" y="62"><tspan fill="#4c8dd6">observed</tspan></text>
  <text class="muted" x="235" y="62">corrected</text>
  <text class="label" x="20" y="88">0.50</text><text class="label" x="150" y="88" fill="#4c8dd6">0.010</text><text class="muted" x="235" y="88">—</text>
  <text class="label" x="20" y="113">0.70</text><text class="label" x="150" y="113" fill="#4c8dd6">0.023</text><text class="muted" x="235" y="113">—</text>
  <text class="label" x="20" y="138">0.90</text><text class="label" x="150" y="138" fill="#4c8dd6">0.083</text><text class="muted" x="235" y="138">—</text>
  <text class="label" x="20" y="163">0.98</text><text class="label" x="150" y="163" fill="#4c8dd6">0.331</text><text class="muted" x="235" y="163">—</text>

  <text class="muted" x="20" y="210">at 1% prevalence the same scores</text>
  <text class="muted" x="20" y="228">overstate every bin: predicted 0.90,</text>
  <text class="muted" x="20" y="246">observed 0.083</text>

  <!-- reliability axes -->
  <path class="axis" d="M 340 40 L 340 280 L 580 280"/>
  <path class="diag" d="M 340 280 L 580 40"/>
  <text class="muted" x="460" y="304" text-anchor="middle">predicted probability</text>
  <text class="muted" transform="rotate(-90 318 160)" x="318" y="160" text-anchor="middle">observed positive fraction</text>
  <text class="muted" x="336" y="294">0</text>
  <text class="muted" x="576" y="294">1</text>

  <!-- ghosts of frame 1 -->
  <circle class="ghost" cx="460" cy="160" r="4.5"/>
  <circle class="ghost" cx="508" cy="112" r="4.5"/>
  <circle class="ghost" cx="556" cy="64" r="4.5"/>
  <circle class="ghost" cx="575" cy="45" r="4.5"/>

  <!-- drops -->
  <line class="drop" x1="460" y1="160" x2="460" y2="278"/>
  <line class="drop" x1="508" y1="112" x2="508" y2="274"/>
  <line class="drop" x1="556" y1="64" x2="556" y2="260"/>
  <line class="drop" x1="575" y1="45" x2="575" y2="201"/>

  <!-- observed points -->
  <circle class="pt" cx="460" cy="278" r="4.5"/>
  <circle class="pt" cx="508" cy="274" r="4.5"/>
  <circle class="pt" cx="556" cy="260" r="4.5"/>
  <circle class="pt" cx="575" cy="201" r="4.5"/>
</svg>

<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; font-size: 13px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .axis  { stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.2; fill: none; }
    .diag  { stroke: currentColor; stroke-opacity: 0.4; stroke-dasharray: 3 3; fill: none; }
    .pt    { fill: #e2903a; }
    .ghost { fill: none; stroke: #e2903a; stroke-opacity: 0.35; stroke-dasharray: 2 2; }
    .move  { stroke: #5aa46a; stroke-opacity: 0.7; stroke-width: 1.3; fill: none; }
  </style>

  <text class="label" x="20" y="26"><tspan fill="#e2903a" font-weight="bold">3 · prior correction</tspan> — back on the diagonal</text>

  <!-- table -->
  <text class="muted" x="20" y="62">p̂ (trained 1:1)</text>
  <text class="muted" x="150" y="62">observed</text>
  <text class="muted" x="235" y="62"><tspan fill="#5aa46a">corrected</tspan></text>
  <text class="label" x="20" y="88">0.50</text><text class="muted" x="150" y="88">0.010</text><text class="label" x="235" y="88" fill="#5aa46a">0.010</text>
  <text class="label" x="20" y="113">0.70</text><text class="muted" x="150" y="113">0.023</text><text class="label" x="235" y="113" fill="#5aa46a">0.023</text>
  <text class="label" x="20" y="138">0.90</text><text class="muted" x="150" y="138">0.083</text><text class="label" x="235" y="138" fill="#5aa46a">0.083</text>
  <text class="label" x="20" y="163">0.98</text><text class="muted" x="150" y="163">0.331</text><text class="label" x="235" y="163" fill="#5aa46a">0.331</text>

  <text class="muted" x="20" y="210">divide by training prior, multiply by</text>
  <text class="muted" x="20" y="228">deployment prior, renormalize:</text>
  <text class="muted" x="20" y="246">corrected p̂ = observed fraction</text>

  <!-- reliability axes -->
  <path class="axis" d="M 340 40 L 340 280 L 580 280"/>
  <path class="diag" d="M 340 280 L 580 40"/>
  <text class="muted" x="460" y="304" text-anchor="middle">predicted probability</text>
  <text class="muted" transform="rotate(-90 318 160)" x="318" y="160" text-anchor="middle">observed positive fraction</text>
  <text class="muted" x="336" y="294">0</text>
  <text class="muted" x="576" y="294">1</text>

  <!-- ghosts of frame 2 (uncorrected) -->
  <circle class="ghost" cx="460" cy="278" r="4.5"/>
  <circle class="ghost" cx="508" cy="274" r="4.5"/>
  <circle class="ghost" cx="556" cy="260" r="4.5"/>
  <circle class="ghost" cx="575" cy="201" r="4.5"/>

  <!-- moves onto diagonal -->
  <line class="move" x1="455" y1="278" x2="349" y2="278"/><polygon points="345,278 353,274 353,282" fill="#5aa46a" opacity="0.7"/>
  <line class="move" x1="503" y1="274" x2="352" y2="274"/><polygon points="348,274 356,270 356,278" fill="#5aa46a" opacity="0.7"/>
  <line class="move" x1="551" y1="260" x2="367" y2="260"/><polygon points="363,260 371,256 371,264" fill="#5aa46a" opacity="0.7"/>
  <line class="move" x1="570" y1="201" x2="426" y2="201"/><polygon points="422,201 430,197 430,205" fill="#5aa46a" opacity="0.7"/>

  <!-- corrected points on the diagonal -->
  <circle class="pt" cx="342" cy="278" r="4.5"/>
  <circle class="pt" cx="346" cy="274" r="4.5"/>
  <circle class="pt" cx="360" cy="260" r="4.5"/>
  <circle class="pt" cx="419" cy="201" r="4.5"/>
</svg>

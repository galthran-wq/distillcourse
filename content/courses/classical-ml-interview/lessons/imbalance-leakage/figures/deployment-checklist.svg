<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; font-size: 13px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .card  { stroke: currentColor; stroke-opacity: 0.4; fill: none; }
    .cbox  { stroke: #5aa46a; stroke-width: 1.5; fill: none; }
    .check { stroke: #5aa46a; stroke-width: 2; fill: none; }
  </style>

  <rect class="card" x="30" y="16" width="580" height="268" rx="8"/>
  <text class="label" x="52" y="46" font-weight="bold">before shipping a classifier</text>

  <rect class="cbox" x="52" y="66" width="16" height="16" rx="3"/>
  <path class="check" d="M 55 74 L 60 79 L 66 69"/>
  <text class="label" x="82" y="79">metric matches the cost structure, baseline stated</text>
  <text class="muted" x="588" y="79" text-anchor="end">classification metrics</text>

  <rect class="cbox" x="52" y="108" width="16" height="16" rx="3"/>
  <path class="check" d="M 55 116 L 60 121 L 66 111"/>
  <text class="label" x="82" y="121">threshold derived from costs, not 0.5</text>
  <text class="muted" x="588" y="121" text-anchor="end">classification metrics</text>

  <rect class="cbox" x="52" y="150" width="16" height="16" rx="3"/>
  <path class="check" d="M 55 158 L 60 163 L 66 153"/>
  <text class="label" x="82" y="163">calibration verified on deployment priors; corrected after resampling</text>
  <text class="muted" x="588" y="163" text-anchor="end">this chapter</text>

  <rect class="cbox" x="52" y="192" width="16" height="16" rx="3"/>
  <path class="check" d="M 55 200 L 60 205 L 66 195"/>
  <text class="label" x="82" y="205">split respects time and groups; transforms inside the folds</text>
  <text class="muted" x="588" y="205" text-anchor="end">cross-validation</text>

  <rect class="cbox" x="52" y="234" width="16" height="16" rx="3"/>
  <path class="check" d="M 55 242 L 60 247 L 66 237"/>
  <text class="label" x="82" y="247">every feature passes the as-of availability audit</text>
  <text class="muted" x="588" y="247" text-anchor="end">feature engineering</text>
</svg>

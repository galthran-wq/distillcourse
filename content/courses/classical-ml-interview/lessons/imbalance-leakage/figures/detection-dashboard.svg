<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; font-size: 13px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .card  { stroke: currentColor; stroke-opacity: 0.4; fill: none; }
  </style>

  <rect class="card" x="10" y="14" width="300" height="128" rx="6"/>
  <text class="label" x="26" y="42"><tspan fill="#e2903a" font-weight="bold">score too good</tspan></text>
  <text class="muted" x="26" y="66">AUC 0.99 where good models live near 0.75</text>
  <text class="label" x="26" y="94"><tspan fill="#5aa46a">test:</tspan> re-split by time, rebuild features</text>
  <text class="label" x="26" y="114">as-of t, and rerun</text>

  <rect class="card" x="330" y="14" width="300" height="128" rx="6"/>
  <text class="label" x="346" y="42"><tspan fill="#e2903a" font-weight="bold">one feature dominates</tspan></text>
  <text class="muted" x="346" y="66">importance several times the runner-up</text>
  <text class="label" x="346" y="94"><tspan fill="#5aa46a">test:</tspan> audit its provenance and</text>
  <text class="label" x="346" y="114">timestamps; drop it and refit</text>

  <rect class="card" x="10" y="158" width="300" height="128" rx="6"/>
  <text class="label" x="26" y="186"><tspan fill="#e2903a" font-weight="bold">time-split collapse</tspan></text>
  <text class="muted" x="26" y="210">shuffled CV ≫ forward-chained score</text>
  <text class="label" x="26" y="238"><tspan fill="#5aa46a">test:</tspan> the gap itself measures the</text>
  <text class="label" x="26" y="258">temporal leak</text>

  <rect class="card" x="330" y="158" width="300" height="128" rx="6"/>
  <text class="label" x="346" y="186"><tspan fill="#e2903a" font-weight="bold">availability audit fails</tspan></text>
  <text class="muted" x="346" y="210">value not computable at prediction time</text>
  <text class="label" x="346" y="238"><tspan fill="#5aa46a">test:</tspan> rebuild with a strict as-of</text>
  <text class="label" x="346" y="258">cutoff and re-score</text>

  <text class="muted" x="320" y="320" text-anchor="middle">in production: monitor train/serve skew — live feature and score distributions against offline</text>
</svg>

<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; font-size: 13px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .box   { stroke: currentColor; stroke-opacity: 0.5; fill: none; }
    .arrow { stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.4; fill: none; }
    .reflex { stroke: currentColor; stroke-opacity: 0.45; stroke-width: 1.4; stroke-dasharray: 5 4; fill: none; }
  </style>

  <!-- five ordered boxes -->
  <rect class="box" x="20" y="16" width="390" height="56" rx="6"/>
  <text class="label" x="34" y="38"><tspan fill="#e2903a" font-weight="bold">1 · fix the metric</tspan></text>
  <text class="muted" x="34" y="58">PR curve, recall at fixed precision, cost matrix; never raw accuracy</text>

  <path class="arrow" d="M 215 72 L 215 88"/><polygon points="215,92 210,83 220,83" fill="currentColor" opacity="0.5"/>

  <rect class="box" x="20" y="92" width="390" height="56" rx="6"/>
  <text class="label" x="34" y="114"><tspan fill="#e2903a" font-weight="bold">2 · fix the threshold</tspan></text>
  <text class="muted" x="34" y="134">derived from the cost ratio, not 0.5; needs no retraining</text>

  <path class="arrow" d="M 215 148 L 215 164"/><polygon points="215,168 210,159 220,159" fill="currentColor" opacity="0.5"/>

  <rect class="box" x="20" y="168" width="390" height="56" rx="6"/>
  <text class="label" x="34" y="190"><tspan fill="#e2903a" font-weight="bold">3 · reweight the loss</tspan></text>
  <text class="muted" x="34" y="210">class weights ≈ duplicating minority rows; one hyperparameter</text>

  <path class="arrow" d="M 215 224 L 215 240"/><polygon points="215,244 210,235 220,235" fill="currentColor" opacity="0.5"/>

  <rect class="box" x="20" y="244" width="390" height="56" rx="6"/>
  <text class="label" x="34" y="266"><tspan fill="#e2903a" font-weight="bold">4 · resample the training set</tspan></text>
  <text class="muted" x="34" y="286">undersample / oversample / SMOTE; pay the calibration bill</text>

  <path class="arrow" d="M 215 300 L 215 316"/><polygon points="215,320 210,311 220,311" fill="currentColor" opacity="0.5"/>

  <rect class="box" x="20" y="320" width="390" height="56" rx="6"/>
  <text class="label" x="34" y="342"><tspan fill="#e2903a" font-weight="bold">5 · change the data or the problem</tspan></text>
  <text class="muted" x="34" y="362">collect minority labels; anomaly detection near 1 : 10⁶</text>

  <!-- cost gradient rail -->
  <path class="arrow" d="M 440 30 L 440 360"/><polygon points="440,366 435,356 445,356" fill="currentColor" opacity="0.5"/>
  <text class="muted" x="452" y="34">free: evaluation and</text>
  <text class="muted" x="452" y="50">decision rule only</text>
  <text class="muted" x="452" y="196">changes the fitted model</text>
  <text class="muted" x="452" y="346">changes the problem</text>

  <!-- reflex path -->
  <path class="reflex" d="M 560 70 C 610 140, 610 220, 418 268"/>
  <polygon points="414,269 425,264 424,274" fill="currentColor" opacity="0.45"/>
  <text class="muted" x="470" y="88" text-decoration="line-through">the reflex: resample first</text>
  <text class="label" x="590" y="180" fill="#e2903a" font-weight="bold" font-size="15">✗</text>
  <text class="muted" x="482" y="104">skips the two free moves</text>
</svg>

<svg viewBox="0 0 640 250" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; font-size: 13px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .panel { stroke: currentColor; stroke-opacity: 0.35; fill: none; }
    .maj   { fill: #4c8dd6; }
    .majgone { fill: none; stroke: #4c8dd6; stroke-opacity: 0.45; stroke-dasharray: 2 2; }
    .min   { fill: #e2903a; }
    .synth { fill: none; stroke: #e2903a; stroke-width: 1.6; }
    .seg   { stroke: #e2903a; stroke-opacity: 0.5; stroke-width: 1.2; stroke-dasharray: 3 3; }
  </style>

  <!-- panel 1: undersample -->
  <text class="label" x="107" y="18" text-anchor="middle">undersample majority</text>
  <rect class="panel" x="10" y="28" width="195" height="190" rx="6"/>
  <!-- kept majority -->
  <circle class="maj" cx="110" cy="68" r="3.5"/><circle class="maj" cx="150" cy="73" r="3.5"/>
  <circle class="maj" cx="120" cy="98" r="3.5"/><circle class="maj" cx="160" cy="108" r="3.5"/>
  <circle class="maj" cx="135" cy="128" r="3.5"/><circle class="maj" cx="170" cy="98" r="3.5"/>
  <circle class="maj" cx="105" cy="113" r="3.5"/><circle class="maj" cx="145" cy="88" r="3.5"/>
  <!-- removed majority -->
  <circle class="majgone" cx="130" cy="78" r="3.5"/><circle class="majgone" cx="165" cy="88" r="3.5"/>
  <circle class="majgone" cx="175" cy="118" r="3.5"/><circle class="majgone" cx="115" cy="133" r="3.5"/>
  <circle class="majgone" cx="155" cy="148" r="3.5"/><circle class="majgone" cx="125" cy="63" r="3.5"/>
  <circle class="majgone" cx="180" cy="78" r="3.5"/><circle class="majgone" cx="140" cy="113" r="3.5"/>
  <!-- minority -->
  <circle class="min" cx="45" cy="148" r="4"/><circle class="min" cx="60" cy="163" r="4"/>
  <circle class="min" cx="40" cy="173" r="4"/><circle class="min" cx="70" cy="143" r="4"/>
  <text class="muted" x="107" y="208" text-anchor="middle">dashed = dropped rows</text>

  <!-- panel 2: oversample -->
  <text class="label" x="322" y="18" text-anchor="middle">oversample minority</text>
  <rect class="panel" x="225" y="28" width="195" height="190" rx="6"/>
  <circle class="maj" cx="325" cy="68" r="3.5"/><circle class="maj" cx="365" cy="73" r="3.5"/>
  <circle class="maj" cx="335" cy="98" r="3.5"/><circle class="maj" cx="375" cy="108" r="3.5"/>
  <circle class="maj" cx="350" cy="128" r="3.5"/><circle class="maj" cx="385" cy="98" r="3.5"/>
  <circle class="maj" cx="320" cy="113" r="3.5"/><circle class="maj" cx="360" cy="88" r="3.5"/>
  <circle class="maj" cx="345" cy="78" r="3.5"/><circle class="maj" cx="380" cy="88" r="3.5"/>
  <circle class="maj" cx="390" cy="118" r="3.5"/><circle class="maj" cx="330" cy="133" r="3.5"/>
  <circle class="maj" cx="370" cy="148" r="3.5"/><circle class="maj" cx="340" cy="63" r="3.5"/>
  <circle class="maj" cx="395" cy="78" r="3.5"/><circle class="maj" cx="355" cy="113" r="3.5"/>
  <!-- minority with stacked duplicates -->
  <circle class="synth" cx="264" cy="144" r="4"/><circle class="synth" cx="262" cy="146" r="4"/><circle class="min" cx="260" cy="148" r="4"/>
  <circle class="synth" cx="279" cy="159" r="4"/><circle class="synth" cx="277" cy="161" r="4"/><circle class="min" cx="275" cy="163" r="4"/>
  <circle class="synth" cx="259" cy="169" r="4"/><circle class="synth" cx="257" cy="171" r="4"/><circle class="min" cx="255" cy="173" r="4"/>
  <circle class="synth" cx="289" cy="139" r="4"/><circle class="synth" cx="287" cy="141" r="4"/><circle class="min" cx="285" cy="143" r="4"/>
  <text class="muted" x="322" y="208" text-anchor="middle">each row copied ×3</text>

  <!-- panel 3: SMOTE -->
  <text class="label" x="537" y="18" text-anchor="middle">SMOTE</text>
  <rect class="panel" x="440" y="28" width="195" height="190" rx="6"/>
  <circle class="maj" cx="540" cy="68" r="3.5"/><circle class="maj" cx="580" cy="73" r="3.5"/>
  <circle class="maj" cx="550" cy="98" r="3.5"/><circle class="maj" cx="590" cy="108" r="3.5"/>
  <circle class="maj" cx="565" cy="128" r="3.5"/><circle class="maj" cx="600" cy="98" r="3.5"/>
  <circle class="maj" cx="535" cy="113" r="3.5"/><circle class="maj" cx="575" cy="88" r="3.5"/>
  <circle class="maj" cx="560" cy="78" r="3.5"/><circle class="maj" cx="595" cy="88" r="3.5"/>
  <circle class="maj" cx="605" cy="118" r="3.5"/><circle class="maj" cx="545" cy="133" r="3.5"/>
  <circle class="maj" cx="585" cy="148" r="3.5"/><circle class="maj" cx="555" cy="63" r="3.5"/>
  <!-- minority + one outlier inside majority -->
  <circle class="min" cx="475" cy="148" r="4"/><circle class="min" cx="490" cy="163" r="4"/>
  <circle class="min" cx="470" cy="173" r="4"/><circle class="min" cx="500" cy="143" r="4"/>
  <circle class="min" cx="558" cy="106" r="4"/>
  <!-- neighbor segments with synthetic points -->
  <line class="seg" x1="475" y1="148" x2="490" y2="163"/><circle class="synth" cx="482" cy="155" r="3.5"/>
  <line class="seg" x1="490" y1="163" x2="470" y2="173"/><circle class="synth" cx="480" cy="168" r="3.5"/>
  <line class="seg" x1="475" y1="148" x2="500" y2="143"/><circle class="synth" cx="488" cy="146" r="3.5"/>
  <!-- artifact segment to the outlier -->
  <line class="seg" x1="500" y1="143" x2="558" y2="106"/><circle class="synth" cx="532" cy="123" r="3.5"/>
  <text class="label" x="530" y="177" fill="#e2903a" font-weight="bold" font-size="14">✗</text>
  <path d="M 533 168 L 533 132" stroke="currentColor" stroke-opacity="0.4" stroke-width="1"/>
  <text class="muted" x="537" y="192" text-anchor="middle">synthetic positive inside</text>
  <text class="muted" x="537" y="206" text-anchor="middle">the majority region</text>
</svg>

<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; font-size: 13px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .cell  { stroke: currentColor; stroke-opacity: 0.4; fill: none; }
    .head  { fill: currentColor; font-size: 13px; font-weight: bold; }
  </style>

  <!-- column headers -->
  <text class="head" x="230" y="30" text-anchor="middle">carried by the features</text>
  <text class="head" x="510" y="30" text-anchor="middle">carried by the split</text>

  <!-- row headers -->
  <text class="head" transform="rotate(-90 24 115)" x="24" y="115" text-anchor="middle">label information</text>
  <text class="head" transform="rotate(-90 24 255)" x="24" y="255" text-anchor="middle">test-row information</text>

  <!-- cells -->
  <rect class="cell" x="50" y="48" width="310" height="126" rx="6"/>
  <text class="label" x="66" y="76"><tspan fill="#e2903a" font-weight="bold">target leakage</tspan></text>
  <text class="label" x="66" y="100">a feature caused by the label</text>
  <text class="muted" x="66" y="124">antibiotics_given → infection;</text>
  <text class="muted" x="66" y="142">chargebacks after the transaction</text>

  <rect class="cell" x="376" y="48" width="248" height="126" rx="6"/>
  <text class="label" x="392" y="76"><tspan fill="#e2903a" font-weight="bold">temporal leakage</tspan></text>
  <text class="label" x="392" y="100">future rows train the past</text>
  <text class="muted" x="392" y="124">shuffled time series;</text>
  <text class="muted" x="392" y="142">whole-history aggregates</text>

  <rect class="cell" x="50" y="188" width="310" height="126" rx="6"/>
  <text class="label" x="66" y="216"><tspan fill="#e2903a" font-weight="bold">train–test contamination</tspan></text>
  <text class="label" x="66" y="240">a transform fitted on all rows</text>
  <text class="muted" x="66" y="264">feature screen, scaler, target encoder,</text>
  <text class="muted" x="66" y="282">SMOTE run before the split</text>

  <rect class="cell" x="376" y="188" width="248" height="126" rx="6"/>
  <text class="label" x="392" y="216"><tspan fill="#e2903a" font-weight="bold">group leakage</tspan></text>
  <text class="label" x="392" y="240">one entity on both sides</text>
  <text class="muted" x="392" y="264">same patient in train and test;</text>
  <text class="muted" x="392" y="282">duplicated rows</text>
</svg>

<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; font-size: 13px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .axis  { stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.4; fill: none; }
    .tline { stroke: currentColor; stroke-opacity: 0.45; stroke-dasharray: 4 3; stroke-width: 1.2; }
    .feat  { fill: #e2903a; fill-opacity: 0.35; stroke: #e2903a; }
    .lab   { fill: #4c8dd6; fill-opacity: 0.35; stroke: #4c8dd6; }
  </style>

  <!-- leaky version -->
  <text class="label" x="40" y="46">leaky: mean_amount over the <tspan font-style="italic">whole</tspan> history</text>
  <rect class="feat" x="120" y="58" width="440" height="18" rx="3"/>
  <line x1="120" y1="67" x2="560" y2="67" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.6"/>
  <text class="label" x="585" y="72" fill="#e2903a" font-weight="bold" font-size="15">✗</text>
  <text class="muted" x="392" y="94">the window covers the label window: each row summarizes its own future</text>

  <!-- correct version -->
  <text class="label" x="40" y="126">correct: mean_amount_30d, as-of t</text>
  <rect class="feat" x="230" y="138" width="148" height="18" rx="3"/>
  <text class="label" x="585" y="152" fill="#5aa46a" font-weight="bold" font-size="15">✓</text>
  <text class="muted" x="230" y="174">window ends strictly at t, current row excluded</text>

  <!-- label window -->
  <rect class="lab" x="382" y="138" width="88" height="18" rx="3"/>
  <text class="muted" x="382" y="132" fill="#4c8dd6">label window (next 7 days)</text>

  <!-- time axis -->
  <path class="axis" d="M 40 210 L 600 210"/>
  <polygon points="606,210 596,205 596,215" fill="currentColor" opacity="0.5"/>
  <text class="muted" x="600" y="232" text-anchor="end">time</text>

  <!-- prediction time marker -->
  <line class="tline" x1="380" y1="52" x2="380" y2="212"/>
  <text class="label" x="380" y="232" text-anchor="middle">prediction time t</text>
</svg>

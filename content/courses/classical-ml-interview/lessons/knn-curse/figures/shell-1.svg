  <text class="label" x="330" y="104">shell volume fraction:</text>
  <text class="label" x="330" y="130">1 − (1 − 0.1)<tspan dy="-6" font-size="10">2</tspan><tspan dy="6">&#160;=&#160;</tspan><tspan fill="#e2903a" font-weight="bold">0.19</tspan></text>
  <rect x="330" y="156" width="240" height="18" rx="4" fill="none" stroke="currentColor" stroke-opacity="0.5"/>
  <rect x="330" y="156" width="45.6" height="18" rx="4" fill="#e2903a" fill-opacity="0.75"/>

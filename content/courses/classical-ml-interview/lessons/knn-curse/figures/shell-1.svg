    .axis  { stroke: currentColor; stroke-opacity: 0.35; stroke-width: 1; fill: none; }
    .guide { stroke: currentColor; stroke-opacity: 0.4; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
  </style>

  <path fill-rule="evenodd" fill="#e2903a" fill-opacity="0.4" d="M 48 128 a 92 92 0 1 0 184 0 a 92 92 0 1 0 -184 0 Z M 57.2 128 a 82.8 82.8 0 1 0 165.6 0 a 82.8 82.8 0 1 0 -165.6 0 Z"/>
  <circle cx="140" cy="128" r="92" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.5"/>
  <circle cx="140" cy="128" r="82.8" fill="none" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text class="muted" x="140" y="132" text-anchor="middle">interior</text>

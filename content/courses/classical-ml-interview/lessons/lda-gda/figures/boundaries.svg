<svg viewBox="0 0 640 310" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- panel titles -->
  <text x="160" y="20" text-anchor="middle" font-size="13" fill="currentColor">shared &#931;: linear boundary (LDA)</text>
  <text x="480" y="20" text-anchor="middle" font-size="13" fill="currentColor">per-class &#931;&#8342;: quadratic boundary (QDA)</text>
  <line x1="322" y1="30" x2="322" y2="295" stroke="currentColor" opacity="0.15"/>

  <!-- LEFT: identical tilted ellipses, vertical boundary x1 = 2 -->
  <g stroke="#4c8dd6" fill="none" stroke-width="1.5">
    <ellipse cx="110" cy="200" rx="52" ry="30" transform="rotate(-45 110 200)"/>
    <ellipse cx="110" cy="200" rx="28" ry="16" transform="rotate(-45 110 200)" opacity="0.6"/>
  </g>
  <circle cx="110" cy="200" r="3.5" fill="#4c8dd6"/>
  <text x="82" y="196" font-size="12" fill="#4c8dd6">&#956;&#8320;</text>
  <text x="72" y="262" font-size="12" fill="#4c8dd6">class 0</text>

  <g stroke="#e2903a" fill="none" stroke-width="1.5">
    <ellipse cx="230" cy="140" rx="52" ry="30" transform="rotate(-45 230 140)"/>
    <ellipse cx="230" cy="140" rx="28" ry="16" transform="rotate(-45 230 140)" opacity="0.6"/>
  </g>
  <circle cx="230" cy="140" r="3.5" fill="#e2903a"/>
  <text x="242" y="136" font-size="12" fill="#e2903a">&#956;&#8321;</text>
  <text x="238" y="86" font-size="12" fill="#e2903a">class 1</text>

  <line x1="170" y1="42" x2="170" y2="288" stroke="currentColor" stroke-width="2"/>
  <text x="176" y="56" font-size="12" fill="currentColor">x&#8321; = 2</text>
  <circle cx="170" cy="170" r="3" fill="currentColor"/>
  <text x="150" y="292" font-size="11" fill="currentColor" opacity="0.55">boundary passes through the</text>
  <text x="150" y="305" font-size="11" fill="currentColor" opacity="0.55">midpoint of the means (equal priors)</text>

  <!-- RIGHT: tight round class vs broad tilted class, curved boundary -->
  <g stroke="#4c8dd6" fill="none" stroke-width="1.5">
    <ellipse cx="420" cy="210" rx="38" ry="38"/>
    <ellipse cx="420" cy="210" rx="20" ry="20" opacity="0.6"/>
  </g>
  <circle cx="420" cy="210" r="3.5" fill="#4c8dd6"/>
  <text x="380" y="268" font-size="12" fill="#4c8dd6">class 0: small &#931;&#8320;</text>

  <g stroke="#e2903a" fill="none" stroke-width="1.5">
    <ellipse cx="540" cy="120" rx="78" ry="30" transform="rotate(-25 540 120)"/>
    <ellipse cx="540" cy="120" rx="44" ry="17" transform="rotate(-25 540 120)" opacity="0.6"/>
  </g>
  <circle cx="540" cy="120" r="3.5" fill="#e2903a"/>
  <text x="530" y="62" font-size="12" fill="#e2903a">class 1: large &#931;&#8321;</text>

  <path d="M 445 42 C 485 120 490 200 430 288" fill="none" stroke="currentColor" stroke-width="2"/>
  <text x="452" y="300" font-size="11" fill="currentColor" opacity="0.55">the boundary bends around the tighter class</text>
</svg>

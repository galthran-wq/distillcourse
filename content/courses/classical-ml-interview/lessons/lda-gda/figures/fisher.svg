<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- two correlated class clouds (same shared covariance, tilted 45°) -->
  <g stroke="#4c8dd6" fill="none" stroke-width="1.5">
    <ellipse cx="150" cy="150" rx="58" ry="26" transform="rotate(-45 150 150)"/>
    <ellipse cx="150" cy="150" rx="30" ry="14" transform="rotate(-45 150 150)" opacity="0.6"/>
  </g>
  <circle cx="150" cy="150" r="3.5" fill="#4c8dd6"/>
  <text x="120" y="146" font-size="12" fill="#4c8dd6">&#956;&#8320;</text>

  <g stroke="#e2903a" fill="none" stroke-width="1.5">
    <ellipse cx="270" cy="90" rx="58" ry="26" transform="rotate(-45 270 90)"/>
    <ellipse cx="270" cy="90" rx="30" ry="14" transform="rotate(-45 270 90)" opacity="0.6"/>
  </g>
  <circle cx="270" cy="90" r="3.5" fill="#e2903a"/>
  <text x="282" y="86" font-size="12" fill="#e2903a">&#956;&#8321;</text>

  <!-- naive mean-difference direction -->
  <line x1="150" y1="150" x2="258" y2="96" stroke="currentColor" stroke-width="1.5" opacity="0.55"/>
  <polygon points="266,92 252,94 258,104" fill="currentColor" opacity="0.55"/>
  <text x="330" y="118" font-size="12" fill="currentColor" opacity="0.55">&#956;&#8321; &#8722; &#956;&#8320; = (2, 1)</text>

  <!-- Fisher / LDA direction -->
  <line x1="150" y1="150" x2="272" y2="150" stroke="#e2903a" stroke-width="2"/>
  <polygon points="282,150 268,144 268,156" fill="#e2903a"/>
  <text x="330" y="152" font-size="12" fill="#e2903a">&#931;&#8315;&#185;(&#956;&#8321; &#8722; &#956;&#8320;) &#8733; (2, 0)</text>

  <!-- left strip: projection on the naive direction -->
  <line x1="60" y1="250" x2="300" y2="250" stroke="currentColor" opacity="0.4"/>
  <path d="M 80 250 Q 145 192 210 250" fill="none" stroke="#4c8dd6" stroke-width="1.5"/>
  <path d="M 130 250 Q 195 192 260 250" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <text x="180" y="272" text-anchor="middle" font-size="11" fill="currentColor">projected on &#956;&#8321; &#8722; &#956;&#8320;: classes overlap</text>

  <!-- right strip: projection on the corrected direction -->
  <line x1="360" y1="250" x2="600" y2="250" stroke="currentColor" opacity="0.4"/>
  <path d="M 370 250 Q 412 192 454 250" fill="none" stroke="#4c8dd6" stroke-width="1.5"/>
  <path d="M 468 250 Q 510 192 552 250" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <text x="480" y="272" text-anchor="middle" font-size="11" fill="currentColor">projected on &#931;&#8315;&#185;(&#956;&#8321; &#8722; &#956;&#8320;): classes separate</text>
</svg>

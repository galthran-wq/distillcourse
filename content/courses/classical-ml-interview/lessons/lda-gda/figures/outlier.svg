<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- class 0 (blue) cluster -->
  <g fill="#4c8dd6">
    <circle cx="140" cy="170" r="4"/>
    <circle cx="160" cy="200" r="4"/>
    <circle cx="185" cy="180" r="4"/>
    <circle cx="150" cy="222" r="4"/>
    <circle cx="200" cy="212" r="4"/>
    <circle cx="175" cy="150" r="4"/>
    <circle cx="128" cy="196" r="4"/>
    <circle cx="206" cy="164" r="4"/>
    <circle cx="168" cy="238" r="4"/>
  </g>
  <text x="120" y="262" font-size="12" fill="#4c8dd6">class 0</text>

  <!-- class 1 (amber) cluster -->
  <g fill="#e2903a">
    <circle cx="372" cy="100" r="4"/>
    <circle cx="396" cy="130" r="4"/>
    <circle cx="420" cy="104" r="4"/>
    <circle cx="382" cy="146" r="4"/>
    <circle cx="430" cy="140" r="4"/>
    <circle cx="406" cy="80" r="4"/>
    <circle cx="446" cy="116" r="4"/>
    <circle cx="360" cy="124" r="4"/>
  </g>
  <text x="420" y="170" font-size="12" fill="#e2903a">class 1</text>

  <!-- the outlier: far away, on the correct side -->
  <circle cx="596" cy="44" r="5" fill="#e2903a"/>
  <line x1="560" y1="28" x2="588" y2="40" stroke="currentColor" stroke-width="1" opacity="0.55"/>
  <text x="500" y="24" font-size="12" fill="currentColor">outlier (correct side)</text>

  <!-- boundary without the outlier: both fits agree -->
  <line x1="250" y1="40" x2="320" y2="270" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.5"/>
  <text x="228" y="288" font-size="11" fill="currentColor" opacity="0.55">both fits without the outlier</text>

  <!-- logistic with outlier: essentially unchanged -->
  <line x1="258" y1="40" x2="328" y2="270" stroke="#4c8dd6" stroke-width="2"/>
  <text x="212" y="46" font-size="12" fill="#4c8dd6" text-anchor="end">logistic: unchanged,</text>
  <text x="212" y="60" font-size="12" fill="#4c8dd6" text-anchor="end">y &#8722; p &#8776; 0 out there</text>

  <!-- LDA with outlier: tilted and shifted -->
  <line x1="272" y1="20" x2="422" y2="270" stroke="#e2903a" stroke-width="2"/>
  <text x="392" y="252" font-size="12" fill="#e2903a">LDA: moved,</text>
  <text x="392" y="266" font-size="12" fill="#e2903a">&#956;&#770;&#8321; and &#931;&#770; shifted</text>
</svg>

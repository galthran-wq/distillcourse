<svg viewBox="0 0 560 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- axes -->
  <line x1="55" y1="280" x2="545" y2="280" stroke="currentColor" stroke-width="1"/>
  <line x1="55" y1="280" x2="55" y2="60" stroke="currentColor" stroke-width="1"/>
  <text x="24" y="170" font-size="12" fill="currentColor" opacity="0.55" text-anchor="middle" transform="rotate(-90 24 170)">expected coins (of 1000)</text>
  <text x="300" y="318" font-size="12" fill="currentColor" opacity="0.55" text-anchor="middle">heads in 10 flips</text>

  <!-- y ticks -->
  <line x1="51" y1="195" x2="55" y2="195" stroke="currentColor"/>
  <text x="47" y="199" font-size="11" fill="currentColor" text-anchor="end">100</text>
  <line x1="51" y1="109" x2="55" y2="109" stroke="currentColor"/>
  <text x="47" y="113" font-size="11" fill="currentColor" text-anchor="end">200</text>

  <!-- bars: expected counts 1000·C(10,k)/1024, scale 0.853 px per coin -->
  <rect x="66"  y="279" width="32" height="1"   fill="#4c8dd6"/>
  <rect x="109" y="272" width="32" height="8"   fill="#4c8dd6"/>
  <rect x="152" y="243" width="32" height="37"  fill="#4c8dd6"/>
  <rect x="195" y="180" width="32" height="100" fill="#4c8dd6"/>
  <rect x="238" y="105" width="32" height="175" fill="#4c8dd6"/>
  <rect x="281" y="70"  width="32" height="210" fill="#4c8dd6"/>
  <rect x="324" y="105" width="32" height="175" fill="#4c8dd6"/>
  <rect x="367" y="180" width="32" height="100" fill="#4c8dd6"/>
  <rect x="410" y="243" width="32" height="37"  fill="#4c8dd6"/>
  <rect x="453" y="272" width="32" height="8"   fill="#4c8dd6"/>
  <rect x="496" y="277" width="32" height="3"   fill="#e2903a"/>

  <!-- x labels -->
  <text x="82"  y="296" font-size="11" fill="currentColor" text-anchor="middle">0</text>
  <text x="125" y="296" font-size="11" fill="currentColor" text-anchor="middle">1</text>
  <text x="168" y="296" font-size="11" fill="currentColor" text-anchor="middle">2</text>
  <text x="211" y="296" font-size="11" fill="currentColor" text-anchor="middle">3</text>
  <text x="254" y="296" font-size="11" fill="currentColor" text-anchor="middle">4</text>
  <text x="297" y="296" font-size="11" fill="currentColor" text-anchor="middle">5</text>
  <text x="340" y="296" font-size="11" fill="currentColor" text-anchor="middle">6</text>
  <text x="383" y="296" font-size="11" fill="currentColor" text-anchor="middle">7</text>
  <text x="426" y="296" font-size="11" fill="currentColor" text-anchor="middle">8</text>
  <text x="469" y="296" font-size="11" fill="currentColor" text-anchor="middle">9</text>
  <text x="512" y="296" font-size="11" fill="#e2903a" text-anchor="middle" font-weight="600">10</text>

  <!-- callout to the extreme bar -->
  <line x1="470" y1="215" x2="508" y2="272" stroke="#e2903a" stroke-width="1"/>
  <text x="468" y="200" font-size="12" fill="#e2903a" text-anchor="end">the coin that</text>
  <text x="468" y="214" font-size="12" fill="#e2903a" text-anchor="end">looks perfect: ≈1 expected</text>

  <!-- tally -->
  <text x="70" y="60" font-size="13" fill="currentColor">one fixed coin:&#160;&#160;P(10 of 10 heads) = 1/1024 ≈ 0.001</text>
  <text x="70" y="80" font-size="13" fill="#e2903a" font-weight="600">best of 1000 coins:&#160;&#160;P(some coin lands 10 of 10) ≈ 0.62</text>
</svg>

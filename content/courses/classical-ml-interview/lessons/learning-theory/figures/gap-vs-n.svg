<svg viewBox="0 0 560 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- axes -->
  <line x1="50" y1="280" x2="545" y2="280" stroke="currentColor" stroke-width="1"/>
  <line x1="50" y1="280" x2="50" y2="30" stroke="currentColor" stroke-width="1"/>
  <text x="300" y="312" font-size="12" fill="currentColor" opacity="0.55" text-anchor="middle">N (training examples)</text>
  <text x="20" y="155" font-size="12" fill="currentColor" opacity="0.55" text-anchor="middle" transform="rotate(-90 20 155)">error</text>

  <!-- shaded gap between E_in and E_out -->
  <path d="M 60 70 C 140 135, 200 158, 240 165 C 320 174, 440 180, 530 182
           L 530 189 C 440 191, 320 195, 240 200 C 200 204, 140 215, 60 255 Z"
        fill="#e2903a" opacity="0.12"/>

  <!-- asymptote -->
  <line x1="50" y1="185" x2="545" y2="185" stroke="currentColor" stroke-width="1" stroke-dasharray="3 3" opacity="0.4"/>
  <text x="540" y="177" font-size="11" fill="currentColor" opacity="0.55" text-anchor="end">best achievable in &#8459;</text>

  <!-- VC bound (dashed, always above E_out) -->
  <path d="M 60 32 C 140 95, 200 118, 240 130 C 320 144, 440 153, 530 158"
        fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5 4" opacity="0.6"/>
  <text x="250" y="112" font-size="12" fill="currentColor" opacity="0.7">VC bound: E&#7522;&#8345; + &#937;(N)</text>

  <!-- E_out -->
  <path d="M 60 70 C 140 135, 200 158, 240 165 C 320 174, 440 180, 530 182"
        fill="none" stroke="#e2903a" stroke-width="2"/>
  <text x="497" y="170" font-size="12" fill="#e2903a">E&#8338;&#7524;&#8348;</text>

  <!-- E_in -->
  <path d="M 60 255 C 140 215, 200 204, 240 200 C 320 195, 440 191, 530 189"
        fill="none" stroke="#4c8dd6" stroke-width="2"/>
  <text x="497" y="207" font-size="12" fill="#4c8dd6">E&#7522;&#8345;</text>

  <!-- gap annotation -->
  <line x1="330" y1="230" x2="300" y2="187" stroke="currentColor" stroke-width="1" opacity="0.5"/>
  <text x="334" y="242" font-size="12" fill="currentColor">gap shrinks like &#8730;(d&#7525;&#7580; ln N / N)</text>

  <!-- N = 10 d_vc marker -->
  <line x1="240" y1="280" x2="240" y2="130" stroke="currentColor" stroke-width="1" stroke-dasharray="3 3" opacity="0.5"/>
  <text x="240" y="296" font-size="11" fill="currentColor" text-anchor="middle">N &#8776; 10&#183;d&#7525;&#7580;</text>
</svg>

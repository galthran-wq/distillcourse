<svg viewBox="0 0 560 340" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- axes -->
  <line x1="50" y1="300" x2="545" y2="300" stroke="currentColor" stroke-width="1"/>
  <line x1="50" y1="300" x2="50" y2="30" stroke="currentColor" stroke-width="1"/>
  <text x="300" y="332" font-size="12" fill="currentColor" opacity="0.55" text-anchor="middle">N (points)</text>
  <text x="18" y="165" font-size="12" fill="currentColor" opacity="0.55" text-anchor="middle" transform="rotate(-90 18 165)">log&#8322; m&#8341;(N)</text>

  <!-- ticks -->
  <line x1="170" y1="300" x2="170" y2="304" stroke="currentColor"/>
  <text x="170" y="317" font-size="11" fill="currentColor" text-anchor="middle">5</text>
  <line x1="290" y1="300" x2="290" y2="304" stroke="currentColor"/>
  <text x="290" y="317" font-size="11" fill="currentColor" text-anchor="middle">10</text>
  <line x1="410" y1="300" x2="410" y2="304" stroke="currentColor"/>
  <text x="410" y="317" font-size="11" fill="currentColor" text-anchor="middle">15</text>
  <line x1="530" y1="300" x2="530" y2="304" stroke="currentColor"/>
  <text x="530" y="317" font-size="11" fill="currentColor" text-anchor="middle">20</text>
  <line x1="46" y1="235" x2="50" y2="235" stroke="currentColor"/>
  <text x="42" y="239" font-size="11" fill="currentColor" text-anchor="end">5</text>
  <line x1="46" y1="170" x2="50" y2="170" stroke="currentColor"/>
  <text x="42" y="174" font-size="11" fill="currentColor" text-anchor="end">10</text>
  <line x1="46" y1="105" x2="50" y2="105" stroke="currentColor"/>
  <text x="42" y="109" font-size="11" fill="currentColor" text-anchor="end">15</text>
  <line x1="46" y1="40" x2="50" y2="40" stroke="currentColor"/>
  <text x="42" y="44" font-size="11" fill="currentColor" text-anchor="end">20</text>

  <!-- convex sets: m = 2^N, a straight line on the log scale -->
  <line x1="50" y1="300" x2="530" y2="40" stroke="#e2903a" stroke-width="2"/>
  <text x="285" y="140" font-size="12" fill="#e2903a">convex sets: 2&#7480; &#8212; no break point</text>

  <!-- positive intervals: m = N²/2 + N/2 + 1 -->
  <polyline points="74,287 98,274 122,263.5 146,255 194,242 242,232.3 290,224.5 338,218.1 386,212.5 434,207.7 482,203.4 530,199.6"
    fill="none" stroke="#4c8dd6" stroke-width="2"/>
  <text x="352" y="196" font-size="12" fill="#4c8dd6">positive intervals: &#189;N&#178;+&#189;N+1</text>

  <!-- positive rays: m = N + 1 -->
  <polyline points="74,287 98,279.4 122,274 170,266.4 218,261 290,255 410,248 530,242.9"
    fill="none" stroke="#5aa46a" stroke-width="2"/>
  <text x="392" y="268" font-size="12" fill="#5aa46a">positive rays: N+1</text>

  <!-- break point markers -->
  <circle cx="98" cy="279.4" r="4.5" fill="none" stroke="#5aa46a" stroke-width="2"/>
  <line x1="98" y1="279.4" x2="128" y2="248" stroke="#5aa46a" stroke-width="1" opacity="0.6"/>
  <text x="131" y="244" font-size="11" fill="#5aa46a">break point k=2: m(2)=3 &lt; 4</text>

  <circle cx="122" cy="263.5" r="4.5" fill="none" stroke="#4c8dd6" stroke-width="2"/>
  <line x1="122" y1="263.5" x2="160" y2="226" stroke="#4c8dd6" stroke-width="1" opacity="0.6"/>
  <text x="163" y="222" font-size="11" fill="#4c8dd6">break point k=3: m(3)=7 &lt; 8</text>
</svg>

<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; font-size: 13px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .bnd   { stroke: #e2903a; stroke-width: 2.4; fill: none; }
    .cont  { stroke: currentColor; stroke-opacity: 0.45; stroke-width: 1.2; stroke-dasharray: 4 3; fill: none; }
  </style>

  <!-- probability contours: lines 0.6x + 0.8y = c -->
  <line class="cont" x1="60" y1="278.8" x2="378.3" y2="40"/>
  <line class="bnd"  x1="136.7" y1="290" x2="470" y2="40"/>
  <line class="cont" x1="228.3" y1="290" x2="561.7" y2="40"/>

  <text class="muted" x="330" y="36" text-anchor="middle">p = 0.1</text>
  <text class="label" x="452" y="32" text-anchor="middle"><tspan fill="#e2903a">w&#7488;x = 0&#8201;&#8201;(p = &#189;)</tspan></text>
  <text class="muted" x="580" y="36" text-anchor="middle">p = 0.9</text>

  <!-- class 0: blue open circles -->
  <g fill="none" stroke="#4c8dd6" stroke-width="2">
    <circle cx="120" cy="80" r="5"/>
    <circle cx="180" cy="120" r="5"/>
    <circle cx="150" cy="180" r="5"/>
    <circle cx="230" cy="90" r="5"/>
    <circle cx="260" cy="150" r="5"/>
    <circle cx="110" cy="200" r="5"/>
    <circle cx="320" cy="70" r="5"/>
    <circle cx="210" cy="220" r="5"/>
    <circle cx="290" cy="190" r="5"/>
  </g>
  <text class="label" x="118" y="126"><tspan fill="#4c8dd6">y = 0</tspan></text>

  <!-- class 1: amber filled dots -->
  <g fill="#e2903a">
    <circle cx="480" cy="120" r="5"/>
    <circle cx="430" cy="200" r="5"/>
    <circle cx="520" cy="180" r="5"/>
    <circle cx="380" cy="250" r="5"/>
    <circle cx="460" cy="260" r="5"/>
    <circle cx="540" cy="100" r="5"/>
    <circle cx="350" cy="180" r="5"/>
    <circle cx="300" cy="260" r="5"/>
    <circle cx="330" cy="120" r="5"/>
  </g>
  <text class="label" x="500" y="236"><tspan fill="#e2903a">y = 1</tspan></text>

  <text class="muted" x="320" y="312" text-anchor="middle">p depends on x only through w&#7488;x, so equal-probability sets are lines parallel to the boundary</text>
</svg>

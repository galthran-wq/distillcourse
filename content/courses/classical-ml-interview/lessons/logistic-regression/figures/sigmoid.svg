<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; font-size: 13px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .axis  { stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.2; fill: none; }
    .curve { stroke: #e2903a; stroke-width: 2.4; fill: none; }
    .guide { stroke: currentColor; stroke-opacity: 0.4; stroke-width: 1; stroke-dasharray: 3 3; }
  </style>

  <text class="label" x="175" y="30" text-anchor="middle">log-odds scale: z = w&#7488;x, linear in x</text>
  <text class="label" x="485" y="30" text-anchor="middle">probability scale: p = &#963;(z)</text>

  <!-- left panel: log-odds line -->
  <path class="axis" d="M55 240 L295 240"/>
  <path class="axis" d="M55 240 L55 60"/>
  <line class="guide" x1="55" y1="150" x2="295" y2="150"/>
  <line class="guide" x1="175" y1="240" x2="175" y2="150"/>
  <line class="curve" x1="55" y1="217.5" x2="295" y2="82.5"/>
  <circle cx="175" cy="150" r="4" fill="#e2903a"/>
  <text class="muted" x="47" y="244" text-anchor="end">&#8722;6</text>
  <text class="muted" x="47" y="154" text-anchor="end">0</text>
  <text class="muted" x="47" y="66" text-anchor="end">+6</text>
  <text class="muted" x="175" y="258" text-anchor="middle">x</text>
  <text class="muted" x="185" y="140">z = 0 here</text>

  <!-- right panel: sigmoid -->
  <path class="axis" d="M365 240 L605 240"/>
  <path class="axis" d="M365 240 L365 60"/>
  <line class="guide" x1="365" y1="60" x2="605" y2="60"/>
  <line class="guide" x1="365" y1="150" x2="605" y2="150"/>
  <line class="guide" x1="485" y1="240" x2="485" y2="150"/>
  <polyline class="curve" points="365.0,239.6 371.0,239.4 377.0,239.2 383.0,238.9 389.0,238.5 395.0,238.0 401.0,237.3 407.0,236.4 413.0,235.2 419.0,233.6 425.0,231.5 431.0,228.7 437.0,225.0 443.0,220.4 449.0,214.5 455.0,207.2 461.0,198.3 467.0,188.0 473.0,176.2 479.0,163.4 485.0,150.0 491.0,136.6 497.0,123.8 503.0,112.0 509.0,101.7 515.0,92.8 521.0,85.5 527.0,79.6 533.0,75.0 539.0,71.3 545.0,68.5 551.0,66.4 557.0,64.8 563.0,63.6 569.0,62.7 575.0,62.0 581.0,61.5 587.0,61.1 593.0,60.8 599.0,60.6 605.0,60.4"/>
  <circle cx="485" cy="150" r="4" fill="#e2903a"/>
  <text class="muted" x="365" y="258">&#8722;6</text>
  <text class="muted" x="485" y="258" text-anchor="middle">0</text>
  <text class="muted" x="605" y="258" text-anchor="end">+6</text>
  <text class="muted" x="518" y="258" text-anchor="middle">z</text>
  <text class="muted" x="357" y="244" text-anchor="end">0</text>
  <text class="muted" x="357" y="154" text-anchor="end">&#189;</text>
  <text class="muted" x="357" y="66" text-anchor="end">1</text>
  <text class="muted" x="392" y="225">z &#8594; &#8722;&#8734;: p &#8594; 0</text>
  <text class="muted" x="597" y="80" text-anchor="end">z &#8594; +&#8734;: p &#8594; 1</text>
  <text class="label" x="495" y="170"><tspan fill="#e2903a">z = 0 &#8660; p = &#189;</tspan></text>

  <text class="muted" x="320" y="290" text-anchor="middle">one model, two scales: a line for the log-odds is a sigmoid for the probability</text>
</svg>

<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; font-size: 13px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .axis  { stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.2; fill: none; }
    .fline { stroke: currentColor; stroke-opacity: 0.8; stroke-width: 1.2; }
  </style>

  <path class="axis" d="M50 270 L370 270"/>

  <rect x="70" y="110" width="60" height="160" fill="#e2903a" fill-opacity="0.8"/>
  <rect x="70" y="90" width="60" height="20" fill="#e2903a" fill-opacity="0.15" stroke="#e2903a" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text class="label" x="140" y="195"><tspan fill="#e2903a">n_H = 8 observed</tspan></text>
  <text class="muted" x="140" y="104">+ (α−1) = 1 hallucinated</text>
  <text class="label" x="100" y="292" text-anchor="middle">heads</text>

  <rect x="260" y="230" width="60" height="40" fill="#4c8dd6" fill-opacity="0.8"/>
  <rect x="260" y="210" width="60" height="20" fill="#4c8dd6" fill-opacity="0.15" stroke="#4c8dd6" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text class="muted" x="328" y="224">+ (β−1) = 1 hallucinated</text>
  <text class="label" x="290" y="292" text-anchor="middle">tails</text>
  <text class="label" x="328" y="252"><tspan fill="#4c8dd6">n_T = 2 observed</tspan></text>

  <text class="label" x="466" y="100" text-anchor="end" font-size="16">θ̂_MAP  =</text>
  <text class="label" x="545" y="90" text-anchor="middle" font-size="15"><tspan fill="#e2903a">n_H + (α−1)</tspan></text>
  <line class="fline" x1="480" y1="97" x2="612" y2="97"/>
  <text class="label" x="546" y="114" text-anchor="middle" font-size="14">n + (α−1) + (β−1)</text>

  <text class="label" x="466" y="155" text-anchor="end" font-size="15">=</text>
  <text class="label" x="478" y="155" font-size="15"><tspan fill="#e2903a">(8 + 1)</tspan> / (10 + 2)  =  0.75</text>

  <text class="muted" x="466" y="195">θ̂_MLE = 8/10 = 0.8</text>
  <text class="muted" x="466" y="212">(for comparison)</text>

  <text class="muted" x="50" y="311">the prior adds fake flips to the tally; the MLE recipe runs on the padded counts</text>
</svg>

<svg viewBox="0 0 640 250" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .muted   { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .formula { fill: currentColor; font-size: 16px; }
  </style>

  <text class="muted" x="40" y="32">data D: 10 independent flips with unknown P(heads) = θ · n_H = 6 heads, n_T = 4 tails</text>

  <text class="formula" x="40" y="90">step 1 · likelihood:   L(θ) = P(D | θ) = θ·(1−θ)·θ·θ·(1−θ)·… = <tspan fill="#e2903a">θ⁶ (1−θ)⁴</tspan></text>

  <text class="formula" x="40" y="140">step 2 · log:   ℓ(θ) = log L(θ) = <tspan fill="#4c8dd6">6 log θ + 4 log(1−θ)</tspan></text>

  <text class="formula" x="40" y="190">step 3 · solve:   ℓ′(θ) = 6/θ − 4/(1−θ) = 0   ⇒</text>
  <rect x="448" y="169" width="132" height="30" rx="4" fill="none" stroke="#e2903a" stroke-width="1.6"/>
  <text class="formula" x="458" y="190" fill="#e2903a">θ̂ = 6/10 = 0.6</text>

  <text class="muted" x="40" y="236" opacity="0.8">step 3: in general θ̂ = n_H / (n_H + n_T) = n_H / n — the empirical frequency</text>
</svg>

<svg viewBox="0 0 640 250" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- message -->
  <text x="320" y="22" text-anchor="middle" font-size="12" fill="currentColor">message: &#8220;win money, win now&#8221; &#8594; tokens [win, money, win, now]</text>

  <!-- panel 1: Bernoulli -->
  <text x="112" y="56" text-anchor="middle" font-size="12" fill="currentColor">Bernoulli: which words</text>
  <g stroke="currentColor" stroke-width="0.9" fill="none" opacity="0.8">
    <rect x="22" y="66" width="30" height="26"/>
    <rect x="52" y="66" width="30" height="26"/>
    <rect x="82" y="66" width="30" height="26"/>
    <rect x="112" y="66" width="30" height="26"/>
    <rect x="142" y="66" width="30" height="26"/>
    <rect x="172" y="66" width="30" height="26"/>
  </g>
  <rect x="22" y="66" width="30" height="26" fill="#e2903a" fill-opacity="0.18" stroke="#e2903a" stroke-width="1.4"/>
  <g font-size="12" fill="currentColor">
    <text x="37" y="83" text-anchor="middle" fill="#e2903a">1</text>
    <text x="67" y="83" text-anchor="middle">1</text>
    <text x="97" y="83" text-anchor="middle" opacity="0.5">0</text>
    <text x="127" y="83" text-anchor="middle">1</text>
    <text x="157" y="83" text-anchor="middle" opacity="0.5">0</text>
    <text x="187" y="83" text-anchor="middle" opacity="0.5">0</text>
  </g>
  <g font-size="8.5" fill="currentColor" opacity="0.55">
    <text x="37" y="104" text-anchor="middle">win</text>
    <text x="67" y="104" text-anchor="middle">money</text>
    <text x="97" y="104" text-anchor="middle">prize</text>
    <text x="127" y="104" text-anchor="middle">now</text>
    <text x="157" y="104" text-anchor="middle">meeting</text>
    <text x="187" y="104" text-anchor="middle">report</text>
  </g>
  <text x="112" y="126" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.55">repeated &#8220;win&#8221; is still 1</text>
  <text x="112" y="140" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.55">absences multiply in (1 &#8722; &#966;)</text>

  <!-- panel 2: Multinomial -->
  <text x="330" y="56" text-anchor="middle" font-size="12" fill="currentColor">Multinomial: how often</text>
  <g stroke="currentColor" stroke-width="0.9" fill="none" opacity="0.8">
    <rect x="240" y="66" width="30" height="26"/>
    <rect x="270" y="66" width="30" height="26"/>
    <rect x="300" y="66" width="30" height="26"/>
    <rect x="330" y="66" width="30" height="26"/>
    <rect x="360" y="66" width="30" height="26"/>
    <rect x="390" y="66" width="30" height="26"/>
  </g>
  <rect x="240" y="66" width="30" height="26" fill="#e2903a" fill-opacity="0.18" stroke="#e2903a" stroke-width="1.4"/>
  <g font-size="12" fill="currentColor">
    <text x="255" y="83" text-anchor="middle" fill="#e2903a">2</text>
    <text x="285" y="83" text-anchor="middle">1</text>
    <text x="315" y="83" text-anchor="middle" opacity="0.5">0</text>
    <text x="345" y="83" text-anchor="middle">1</text>
    <text x="375" y="83" text-anchor="middle" opacity="0.5">0</text>
    <text x="405" y="83" text-anchor="middle" opacity="0.5">0</text>
  </g>
  <g font-size="8.5" fill="currentColor" opacity="0.55">
    <text x="255" y="104" text-anchor="middle">win</text>
    <text x="285" y="104" text-anchor="middle">money</text>
    <text x="315" y="104" text-anchor="middle">prize</text>
    <text x="345" y="104" text-anchor="middle">now</text>
    <text x="375" y="104" text-anchor="middle">meeting</text>
    <text x="405" y="104" text-anchor="middle">report</text>
  </g>
  <text x="330" y="126" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.55">&#8220;win&#8221; contributes its factor twice</text>
  <text x="330" y="140" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.55">absent words drop out</text>

  <!-- panel 3: Gaussian -->
  <text x="540" y="56" text-anchor="middle" font-size="12" fill="currentColor">Gaussian: length &#8467;</text>
  <!-- axes -->
  <line x1="458" y1="130" x2="628" y2="130" stroke="currentColor" stroke-width="1"/>
  <!-- spam bell centered ~ l=30 -> x=488, ham bell centered l=80 -> x=570 wide -->
  <path d="M 462 129 C 478 129 476 76 488 76 C 500 76 498 129 514 129" fill="none" stroke="#e2903a" stroke-width="1.8"/>
  <path d="M 512 129 C 542 129 540 100 570 100 C 600 100 598 129 628 129" fill="none" stroke="#4c8dd6" stroke-width="1.8"/>
  <text x="488" y="70" text-anchor="middle" font-size="9.5" fill="#e2903a">spam N(30, 10&#178;)</text>
  <text x="577" y="93" text-anchor="middle" font-size="9.5" fill="#4c8dd6">ham N(80, 25&#178;)</text>
  <!-- observation l=25 -> x=480 -->
  <line x1="480" y1="130" x2="480" y2="82" stroke="currentColor" stroke-width="1" stroke-dasharray="3 3" opacity="0.5"/>
  <text x="480" y="143" text-anchor="middle" font-size="9.5" fill="currentColor">&#8467; = 25</text>
  <text x="540" y="160" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.55">per-class mean and variance</text>

  <!-- combination line -->
  <text x="320" y="196" text-anchor="middle" font-size="11" fill="currentColor">factors multiply across models:</text>
  <text x="320" y="216" text-anchor="middle" font-size="12" fill="currentColor">p(x | y) = &#8719;&#11388; p(x&#11388; | y) &#183; N(&#8467;; &#956;, &#963;&#178; of the class)</text>
  <text x="320" y="236" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.55">one classifier, mixed event models &#8212; each feature its own factor</text>
</svg>

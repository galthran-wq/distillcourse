<svg viewBox="0 0 560 240" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <marker id="gen-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="currentColor" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- class node -->
  <circle cx="280" cy="42" r="20" fill="#e2903a" fill-opacity="0.15" stroke="#e2903a" stroke-width="1.5"/>
  <text x="280" y="47" text-anchor="middle" font-size="14" fill="#e2903a" font-style="italic">y</text>
  <text x="312" y="38" font-size="11" fill="currentColor" opacity="0.55">1. draw a class from the prior</text>

  <!-- fan arrows -->
  <line x1="266" y1="58" x2="106" y2="118" stroke="currentColor" stroke-width="1.2" marker-end="url(#gen-arrow)"/>
  <line x1="272" y1="61" x2="196" y2="118" stroke="currentColor" stroke-width="1.2" marker-end="url(#gen-arrow)"/>
  <line x1="280" y1="62" x2="280" y2="118" stroke="currentColor" stroke-width="1.2" marker-end="url(#gen-arrow)"/>
  <line x1="292" y1="59" x2="452" y2="118" stroke="currentColor" stroke-width="1.2" marker-end="url(#gen-arrow)"/>

  <!-- feature nodes -->
  <rect x="74" y="122" width="52" height="26" rx="5" fill="#4c8dd6" fill-opacity="0.12" stroke="#4c8dd6" stroke-width="1.3"/>
  <text x="100" y="139" text-anchor="middle" font-size="12" fill="#4c8dd6" font-style="italic">x<tspan font-size="9" dy="3">1</tspan></text>
  <rect x="164" y="122" width="52" height="26" rx="5" fill="#4c8dd6" fill-opacity="0.12" stroke="#4c8dd6" stroke-width="1.3"/>
  <text x="190" y="139" text-anchor="middle" font-size="12" fill="#4c8dd6" font-style="italic">x<tspan font-size="9" dy="3">2</tspan></text>
  <rect x="254" y="122" width="52" height="26" rx="5" fill="#4c8dd6" fill-opacity="0.12" stroke="#4c8dd6" stroke-width="1.3"/>
  <text x="280" y="139" text-anchor="middle" font-size="12" fill="#4c8dd6" font-style="italic">x<tspan font-size="9" dy="3">3</tspan></text>
  <text x="372" y="140" text-anchor="middle" font-size="14" fill="currentColor" opacity="0.55">&#8943;</text>
  <rect x="428" y="122" width="52" height="26" rx="5" fill="#4c8dd6" fill-opacity="0.12" stroke="#4c8dd6" stroke-width="1.3"/>
  <text x="454" y="139" text-anchor="middle" font-size="12" fill="#4c8dd6" font-style="italic">x<tspan font-size="9" dy="3">d</tspan></text>

  <text x="280" y="168" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">2. draw each feature from the class&#8217;s own table &#8212; no edges between features</text>

  <!-- factored formula, colors bind node to factor -->
  <text x="280" y="204" text-anchor="middle" font-size="14" fill="currentColor">
    <tspan font-style="italic">p</tspan>(<tspan font-style="italic">y</tspan>, <tspan font-style="italic">x</tspan><tspan font-size="10" dy="3">1</tspan><tspan dy="-3">, &#8230;, </tspan><tspan font-style="italic">x</tspan><tspan font-size="10" dy="3">d</tspan><tspan dy="-3">) = </tspan><tspan fill="#e2903a" font-style="italic">p</tspan><tspan fill="#e2903a">(</tspan><tspan fill="#e2903a" font-style="italic">y</tspan><tspan fill="#e2903a">)</tspan> &#183; <tspan fill="#4c8dd6" font-style="italic">p</tspan><tspan fill="#4c8dd6">(</tspan><tspan fill="#4c8dd6" font-style="italic">x</tspan><tspan fill="#4c8dd6" font-size="10" dy="3">1</tspan><tspan fill="#4c8dd6" dy="-3"> | </tspan><tspan fill="#4c8dd6" font-style="italic">y</tspan><tspan fill="#4c8dd6">)</tspan> &#183; <tspan fill="#4c8dd6" font-style="italic">p</tspan><tspan fill="#4c8dd6">(</tspan><tspan fill="#4c8dd6" font-style="italic">x</tspan><tspan fill="#4c8dd6" font-size="10" dy="3">2</tspan><tspan fill="#4c8dd6" dy="-3"> | </tspan><tspan fill="#4c8dd6" font-style="italic">y</tspan><tspan fill="#4c8dd6">)</tspan> &#8943; <tspan fill="#4c8dd6" font-style="italic">p</tspan><tspan fill="#4c8dd6">(</tspan><tspan fill="#4c8dd6" font-style="italic">x</tspan><tspan fill="#4c8dd6" font-size="10" dy="3">d</tspan><tspan fill="#4c8dd6" dy="-3"> | </tspan><tspan fill="#4c8dd6" font-style="italic">y</tspan><tspan fill="#4c8dd6">)</tspan>
  </text>
  <text x="280" y="226" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">one amber prior factor, d blue one-dimensional factors</text>
</svg>

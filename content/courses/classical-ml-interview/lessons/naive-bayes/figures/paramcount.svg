<svg viewBox="0 0 620 270" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <marker id="pc-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="currentColor" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- left: full joint table -->
  <text x="130" y="24" text-anchor="middle" font-size="13" fill="currentColor">full table for p(x | y)</text>

  <!-- header row -->
  <text x="47" y="48" font-size="10" fill="currentColor" opacity="0.55" font-style="italic">x&#8321; x&#8322; x&#8323; x&#8324; x&#8325;</text>
  <text x="185" y="48" font-size="10" fill="currentColor" opacity="0.55">p</text>

  <!-- 6 pattern rows of 5 cells + prob cell -->
  <g stroke="currentColor" stroke-width="0.8" fill="none" opacity="0.7">
    <g>
      <rect x="45" y="54" width="120" height="18"/>
      <rect x="45" y="72" width="120" height="18"/>
      <rect x="45" y="90" width="120" height="18"/>
      <rect x="45" y="108" width="120" height="18"/>
      <rect x="45" y="126" width="120" height="18"/>
      <rect x="45" y="144" width="120" height="18"/>
      <line x1="69" y1="54" x2="69" y2="162"/>
      <line x1="93" y1="54" x2="93" y2="162"/>
      <line x1="117" y1="54" x2="117" y2="162"/>
      <line x1="141" y1="54" x2="141" y2="162"/>
      <rect x="171" y="54" width="30" height="108"/>
      <line x1="171" y1="72" x2="201" y2="72"/>
      <line x1="171" y1="90" x2="201" y2="90"/>
      <line x1="171" y1="108" x2="201" y2="108"/>
      <line x1="171" y1="126" x2="201" y2="126"/>
      <line x1="171" y1="144" x2="201" y2="144"/>
    </g>
  </g>
  <g font-size="10" fill="currentColor" opacity="0.6">
    <text x="57" y="67" text-anchor="middle">0</text><text x="81" y="67" text-anchor="middle">0</text><text x="105" y="67" text-anchor="middle">0</text><text x="129" y="67" text-anchor="middle">0</text><text x="153" y="67" text-anchor="middle">0</text>
    <text x="57" y="85" text-anchor="middle">0</text><text x="81" y="85" text-anchor="middle">0</text><text x="105" y="85" text-anchor="middle">0</text><text x="129" y="85" text-anchor="middle">0</text><text x="153" y="85" text-anchor="middle">1</text>
    <text x="57" y="103" text-anchor="middle">0</text><text x="81" y="103" text-anchor="middle">0</text><text x="105" y="103" text-anchor="middle">0</text><text x="129" y="103" text-anchor="middle">1</text><text x="153" y="103" text-anchor="middle">0</text>
    <text x="57" y="121" text-anchor="middle">0</text><text x="81" y="121" text-anchor="middle">0</text><text x="105" y="121" text-anchor="middle">0</text><text x="129" y="121" text-anchor="middle">1</text><text x="153" y="121" text-anchor="middle">1</text>
    <text x="57" y="139" text-anchor="middle">0</text><text x="81" y="139" text-anchor="middle">0</text><text x="105" y="139" text-anchor="middle">1</text><text x="129" y="139" text-anchor="middle">0</text><text x="153" y="139" text-anchor="middle">0</text>
    <text x="57" y="157" text-anchor="middle">0</text><text x="81" y="157" text-anchor="middle">0</text><text x="105" y="157" text-anchor="middle">1</text><text x="129" y="157" text-anchor="middle">0</text><text x="153" y="157" text-anchor="middle">1</text>
  </g>
  <text x="123" y="180" text-anchor="middle" font-size="14" fill="currentColor" opacity="0.6">&#8942;</text>
  <text x="123" y="200" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">2&#7496; rows</text>

  <!-- cross-out -->
  <g stroke="currentColor" stroke-width="2" opacity="0.5">
    <line x1="42" y1="50" x2="204" y2="166"/>
    <line x1="204" y1="50" x2="42" y2="166"/>
  </g>

  <text x="123" y="228" text-anchor="middle" font-size="12" fill="currentColor">2&#7496; &#8722; 1 numbers per class</text>
  <text x="123" y="246" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">d = 30: &#8776; 1.07 billion &#8212; unlearnable</text>

  <!-- center arrow -->
  <line x1="242" y1="108" x2="318" y2="108" stroke="currentColor" stroke-width="2" marker-end="url(#pc-arrow)"/>
  <text x="280" y="96" text-anchor="middle" font-size="11" fill="currentColor">assume</text>
  <text x="280" y="130" text-anchor="middle" font-size="11" fill="#e2903a">p(x|y) = &#8719;&#11388; p(x&#11388;|y)</text>

  <!-- right: d small tables -->
  <text x="470" y="24" text-anchor="middle" font-size="13" fill="currentColor">one small table per feature</text>

  <g stroke="#e2903a" stroke-width="1.2" fill="#e2903a" fill-opacity="0.08">
    <rect x="352" y="54" width="88" height="20" rx="3"/>
    <rect x="352" y="92" width="88" height="20" rx="3"/>
    <rect x="352" y="130" width="88" height="20" rx="3"/>
  </g>
  <g font-size="11" fill="currentColor">
    <text x="396" y="68" text-anchor="middle">p(x&#8321;=1 | y) = &#966;&#8321;</text>
    <text x="396" y="106" text-anchor="middle">p(x&#8322;=1 | y) = &#966;&#8322;</text>
    <text x="396" y="144" text-anchor="middle">p(x&#8323;=1 | y) = &#966;&#8323;</text>
  </g>
  <text x="396" y="172" text-anchor="middle" font-size="14" fill="currentColor" opacity="0.6">&#8942;</text>
  <text x="396" y="196" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">d tables, one number each</text>

  <text x="470" y="228" text-anchor="middle" font-size="12" fill="#e2903a">d numbers per class</text>
  <text x="470" y="246" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">d = 30: 30 &#8212; learnable from small corpora</text>
</svg>

<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
  </style>

  <!-- left panel: two nearly parallel columns -->
  <line x1="80" y1="220" x2="245" y2="98" stroke="#e2903a" stroke-width="2.2"/>
  <polygon points="252,93 241.2,96.5 247.9,105.5 " fill="#e2903a"/>
  <text x="256" y="92" fill="#e2903a" font-size="14">x·₁</text>

  <line x1="80" y1="220" x2="252" y2="123" stroke="#4c8dd6" stroke-width="2.2"/>
  <polygon points="260,118 249.7,122.2 255.2,131.9" fill="#4c8dd6"/>
  <text x="264" y="122" fill="#4c8dd6" font-size="14">x·₂</text>

  <text class="muted" x="60" y="252">x·₂ ≈ c·x·₁: the columns span (almost) a line,</text>
  <text class="muted" x="60" y="268">and XᵀX is (almost) singular</text>

  <!-- right panel: flat-bottomed valley contours -->
  <g transform="translate(475,140) rotate(-22)">
    <ellipse cx="0" cy="0" rx="130" ry="36" fill="none" stroke="currentColor" opacity="0.35" stroke-width="1.2"/>
    <ellipse cx="0" cy="0" rx="98"  ry="25" fill="none" stroke="currentColor" opacity="0.45" stroke-width="1.2"/>
    <ellipse cx="0" cy="0" rx="66"  ry="15" fill="none" stroke="currentColor" opacity="0.55" stroke-width="1.2"/>
    <ellipse cx="0" cy="0" rx="34"  ry="6"  fill="none" stroke="currentColor" opacity="0.65" stroke-width="1.2"/>
    <line x1="-124" y1="0" x2="124" y2="0" stroke="#e2903a" stroke-width="1.8" stroke-dasharray="4 3"/>
  </g>
  <text x="382" y="242" fill="#e2903a" font-size="12.5">the valley floor: near-minimizers of J(θ)</text>
  <text class="muted" x="382" y="260">exact collinearity flattens the floor completely</text>
  <text class="muted" x="382" y="52">contours of J(θ)</text>
</svg>

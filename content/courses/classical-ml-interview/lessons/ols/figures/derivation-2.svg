<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .muted   { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .formula { fill: currentColor; font-size: 16px; }
    .prev    { fill: currentColor; opacity: 0.45; font-size: 16px; }
  </style>

  <text class="prev" x="40" y="64">J(θ) = ½‖Xθ − y‖² = ½(Xθ − y)ᵀ(Xθ − y) = ½ <tspan fill="#e2903a" opacity="1">θᵀXᵀXθ</tspan> − <tspan fill="#4c8dd6" opacity="1">yᵀXθ</tspan> + ½ yᵀy</text>

  <text class="formula" x="40" y="134">∇J(θ) = <tspan fill="#e2903a">XᵀXθ</tspan> − <tspan fill="#4c8dd6">Xᵀy</tspan></text>
  <text x="240" y="128" fill="#e2903a" font-size="12">∇(θᵀAθ) = 2Aθ with A = XᵀX symmetric (the ½ cancels the 2)</text>
  <text x="240" y="146" fill="#4c8dd6" font-size="12">∇(aᵀθ) = a with a = Xᵀy</text>
  <text class="muted" x="240" y="164">½ yᵀy is constant in θ: gradient 0</text>

  <text class="muted" x="40" y="310" opacity="0.8">step 2: differentiate term by term with the two identities</text>
</svg>

<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .muted   { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .formula { fill: currentColor; font-size: 16px; }
    .prev    { fill: currentColor; opacity: 0.45; font-size: 16px; }
  </style>

  <text class="prev" x="40" y="64">J(θ) = ½‖Xθ − y‖² = ½(Xθ − y)ᵀ(Xθ − y) = ½ θᵀXᵀXθ − yᵀXθ + ½ yᵀy</text>
  <text class="prev" x="40" y="134">∇J(θ) = XᵀXθ − Xᵀy</text>

  <text class="formula" x="40" y="200">set ∇J(θ) = 0:   <tspan fill="#e2903a">XᵀXθ = Xᵀy</tspan></text>
  <text class="muted" x="40" y="228">the normal equations: p linear equations in the p unknowns θ · equivalently Xᵀ(y − Xθ) = 0</text>

  <text class="muted" x="40" y="310" opacity="0.8">step 3: a stationary point of a convex J is a global minimum, so set the gradient to zero</text>
</svg>

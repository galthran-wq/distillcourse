<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .muted   { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .formula { fill: currentColor; font-size: 16px; }
    .prev    { fill: currentColor; opacity: 0.45; font-size: 16px; }
  </style>

  <text class="prev" x="40" y="64">J(θ) = ½‖Xθ − y‖² = ½(Xθ − y)ᵀ(Xθ − y) = ½ θᵀXᵀXθ − yᵀXθ + ½ yᵀy</text>
  <text class="prev" x="40" y="134">∇J(θ) = XᵀXθ − Xᵀy</text>
  <text class="prev" x="40" y="200">set ∇J(θ) = 0:   XᵀXθ = Xᵀy</text>

  <rect x="34" y="240" width="192" height="34" rx="4" fill="none" stroke="#e2903a" stroke-width="1.8"/>
  <text class="formula" x="44" y="263" fill="#e2903a">θ̂ = (XᵀX)⁻¹ Xᵀy</text>
  <text class="muted" x="244" y="252">valid iff rank(X) = p, which makes XᵀX invertible</text>
  <text class="muted" x="244" y="270">Hessian ∇²J = XᵀX ⪰ 0 ⇒ convex ⇒ global minimum</text>

  <text class="muted" x="40" y="310" opacity="0.8">step 4: solve, and record the invertibility condition the closed form depends on</text>
</svg>

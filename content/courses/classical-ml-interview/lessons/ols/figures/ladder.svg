<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .claim { fill: currentColor; font-size: 14px; }
    .box   { fill: none; stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.4; }
    .up    { stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.4; }
  </style>

  <!-- rung 1 (bottom) -->
  <rect class="box" x="40" y="272" width="560" height="44" rx="5"/>
  <text class="claim" x="54" y="292">1 · closed form   θ̂ = (XᵀX)⁻¹Xᵀy exists, unique</text>
  <text class="muted" x="54" y="309">needs only rank(X) = p — a fact about X, no statistics at all</text>

  <line class="up" x1="320" y1="272" x2="320" y2="250"/>
  <path d="M320 246 l-4 8 l8 0 z" fill="currentColor" fill-opacity="0.5"/>

  <!-- rung 2 -->
  <rect class="box" x="40" y="200" width="560" height="44" rx="5"/>
  <text class="claim" x="54" y="220">2 · unbiased   E[θ̂ | X] = θ</text>
  <text x="54" y="237" fill="#e2903a" font-size="12">adds: y = Xθ + ε (linearity)  and  E[ε | X] = 0 (exogeneity)</text>

  <line class="up" x1="320" y1="200" x2="320" y2="178"/>
  <path d="M320 174 l-4 8 l8 0 z" fill="currentColor" fill-opacity="0.5"/>

  <!-- rung 3 -->
  <rect class="box" x="40" y="128" width="560" height="44" rx="5"/>
  <text class="claim" x="54" y="148">3 · BLUE (Gauss–Markov)   minimum variance among linear unbiased</text>
  <text x="54" y="165" fill="#e2903a" font-size="12">adds: Var(ε | X) = σ²I — homoscedastic, uncorrelated errors</text>

  <line class="up" x1="320" y1="128" x2="320" y2="106"/>
  <path d="M320 102 l-4 8 l8 0 z" fill="currentColor" fill-opacity="0.5"/>

  <!-- rung 4 (top) -->
  <rect class="box" x="40" y="56" width="560" height="44" rx="5"/>
  <text class="claim" x="54" y="76">4 · exact inference   θ̂ ~ N(θ, σ²(XᵀX)⁻¹), exact t and F tests</text>
  <text x="54" y="93" fill="#e2903a" font-size="12">adds: ε | X Gaussian — the only rung that needs normality</text>

  <text class="muted" x="40" y="34" opacity="0.8">read bottom-up: each guarantee keeps the ones below and adds one assumption</text>
</svg>

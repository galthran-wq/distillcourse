<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .cell  { fill: currentColor; font-size: 12.5px; }
    .box   { fill: none; stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.4; }
    .arrow { stroke: currentColor; stroke-opacity: 0.7; stroke-width: 1.6; }
  </style>

  <!-- panel 1: data table -->
  <rect class="box" x="30" y="48" width="170" height="160" rx="5"/>
  <text class="cell" x="44" y="70" font-weight="600">area (ft²)   price ($1k)</text>
  <line x1="44" y1="78" x2="186" y2="78" stroke="currentColor" stroke-opacity="0.4"/>
  <text class="cell" x="44" y="96">2104            400</text>
  <text class="cell" x="44" y="114">1600            330</text>
  <text class="cell" x="44" y="132">2400            369</text>
  <text class="cell" x="44" y="150">1416            232</text>
  <text class="cell" x="44" y="168">3000            540</text>
  <text class="muted" x="44" y="192">⋮  47 houses (CS229 §1.1)</text>
  <text class="muted" x="30" y="36">X (with ones column), y</text>

  <!-- arrow 1 -->
  <line class="arrow" x1="200" y1="128" x2="248" y2="128"/>
  <path d="M252 128 l-9 -4 l0 8 z" fill="currentColor" fill-opacity="0.7"/>

  <!-- panel 2: closed form and fitted coefficients -->
  <rect class="box" x="256" y="82" width="176" height="92" rx="5"/>
  <text x="270" y="110" fill="#e2903a" font-size="14.5">θ̂ = (XᵀX)⁻¹Xᵀy</text>
  <text class="cell" x="270" y="138">θ̂₀ = 71.27</text>
  <text class="cell" x="270" y="158">θ̂₁ = 0.1345</text>
  <text class="muted" x="256" y="36">two matrix products,</text>
  <text class="muted" x="256" y="52">one 2×2 solve</text>

  <!-- arrow 2 -->
  <line class="arrow" x1="432" y1="128" x2="480" y2="128"/>
  <path d="M484 128 l-9 -4 l0 8 z" fill="currentColor" fill-opacity="0.7"/>

  <!-- panel 3: prediction -->
  <rect class="box" x="488" y="82" width="132" height="92" rx="5"/>
  <text class="cell" x="500" y="106">new house:</text>
  <text class="cell" x="500" y="124">x = 2500 ft²</text>
  <text x="500" y="152" fill="#e2903a" font-size="13.5">ŷ ≈ 407.5</text>
  <text class="muted" x="500" y="168">≈ $408,000</text>
  <text class="muted" x="488" y="36">ŷ = 71.27</text>
  <text class="muted" x="488" y="52">+ 0.1345 · 2500</text>

  <text class="muted" x="30" y="240" opacity="0.8">the same two products and one solve fit 3 points or 47 houses; prediction is one inner product</text>
</svg>

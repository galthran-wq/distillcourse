<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
  </style>

  <!-- the plane col(X) -->
  <polygon points="90,230 330,275 590,230 350,185" fill="currentColor" opacity="0.08"/>
  <polygon points="90,230 330,275 590,230 350,185" fill="none" stroke="currentColor" opacity="0.35"/>
  <text class="muted" x="520" y="255">col(X)</text>

  <!-- basis columns inside the plane -->
  <line x1="220" y1="238" x2="344" y2="251" stroke="currentColor" stroke-width="1.4" opacity="0.55"/>
  <polygon points="352,252 342.7,255.1 343.5,247.1" fill="currentColor" opacity="0.55"/>
  <line x1="220" y1="238" x2="310" y2="212" stroke="currentColor" stroke-width="1.4" opacity="0.55"/>
  <polygon points="318,210 310.4,216.3 308.2,208.6" fill="currentColor" opacity="0.55"/>
  <text class="muted" x="356" y="264">x·₁</text>
  <text class="muted" x="322" y="206">x·₂</text>

  <!-- y-hat inside plane (amber) -->
  <line x1="220" y1="238" x2="421" y2="222.7" stroke="#e2903a" stroke-width="2.4"/>
  <polygon points="430,222 420.3,226.8 419.7,218.8" fill="#e2903a"/>
  <text x="352" y="246" fill="#e2903a" font-size="14">ŷ = Hy</text>

  <!-- y above plane -->
  <line x1="220" y1="238" x2="423" y2="75.6" stroke="currentColor" stroke-width="2.4"/>
  <polygon points="430,70 424.7,79.3 419.7,73.1" fill="currentColor"/>
  <text x="404" y="60" fill="currentColor" font-size="14">y</text>

  <!-- residual (blue, dashed) from y-hat tip up to y tip -->
  <line x1="430" y1="214" x2="430" y2="86" stroke="#4c8dd6" stroke-width="2" stroke-dasharray="4 3"/>
  <polygon points="430,78 426,87 434,87" fill="#4c8dd6"/>
  <text x="440" y="150" fill="#4c8dd6" font-size="14">r = y − ŷ</text>

  <!-- right-angle mark at the foot -->
  <polyline points="420,221.5 420.8,211.5 430,212.3" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.7"/>

  <text class="muted" x="90" y="60">ŷ is the point of col(X) closest to y</text>
  <text x="90" y="82" fill="#4c8dd6" font-size="13">Xᵀr = 0: the residual is orthogonal to every column</text>
</svg>

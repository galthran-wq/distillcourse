<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .axis  { stroke: currentColor; stroke-width: 1; opacity: 0.7; }
  </style>

  <!-- axes -->
  <line class="axis" x1="60" y1="250" x2="430" y2="250"/>
  <line class="axis" x1="60" y1="250" x2="60" y2="35"/>
  <text class="muted" x="425" y="268">x</text>
  <text class="muted" x="44" y="42">y</text>
  <text class="muted" x="156" y="268">1</text>
  <text class="muted" x="256" y="268">2</text>
  <text class="muted" x="356" y="268">3</text>
  <text class="muted" x="42" y="170">1</text>
  <text class="muted" x="42" y="86">2</text>

  <!-- fitted line y-hat = 2/3 + x/2, from x=0 to x=3.5 -->
  <line x1="60" y1="194" x2="410" y2="47" stroke="#4c8dd6" stroke-width="2"/>
  <text x="332" y="42" fill="#4c8dd6" font-size="12.5">ŷ = 2⁄3 + x⁄2</text>

  <!-- residual segments (amber) -->
  <line x1="160" y1="166" x2="160" y2="152" stroke="#e2903a" stroke-width="3"/>
  <line x1="260" y1="82"  x2="260" y2="110" stroke="#e2903a" stroke-width="3"/>
  <line x1="360" y1="82"  x2="360" y2="68"  stroke="#e2903a" stroke-width="3"/>
  <text x="168" y="164" fill="#e2903a" font-size="12">r₁ = −1⁄6</text>
  <text x="268" y="102" fill="#e2903a" font-size="12">r₂ = 1⁄3</text>
  <text x="290" y="76"  fill="#e2903a" font-size="12">r₃ = −1⁄6</text>

  <!-- data points -->
  <circle cx="160" cy="166" r="4" fill="currentColor"/>
  <circle cx="260" cy="82"  r="4" fill="currentColor"/>
  <circle cx="360" cy="82"  r="4" fill="currentColor"/>

  <!-- tally panel -->
  <text x="470" y="90"  fill="currentColor" font-size="14">RSS = r₁² + r₂² + r₃²</text>
  <text x="470" y="122" fill="currentColor" font-size="14">= 1⁄36 + 4⁄36 + 1⁄36</text>
  <rect x="462" y="140" width="120" height="30" rx="4" fill="none" stroke="#e2903a" stroke-width="1.6"/>
  <text x="470" y="160" fill="#e2903a" font-size="14">= 1⁄6 ≈ 0.167</text>
  <text class="muted" x="470" y="196">candidate ŷ = x: RSS = 1</text>
  <text class="muted" x="470" y="214">candidate ŷ = 0.5 + 0.5x: 0.25</text>

  <text class="muted" x="60" y="292" opacity="0.8">OLS minimizes the sum of squared vertical gaps between data and line</text>
</svg>

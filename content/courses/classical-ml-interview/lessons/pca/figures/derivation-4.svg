<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .f     { fill: currentColor; font-size: 15px; }
    .step  { fill: currentColor; opacity: 0.55; font-size: 11.5px; font-weight: 600; letter-spacing: 0.04em; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .axis  { stroke: currentColor; stroke-opacity: 0.18; stroke-width: 1; }
  </style>

  <!-- left: unit circle; u has snapped to the top eigenvector -->
  <line class="axis" x1="35" y1="150" x2="195" y2="150"/>
  <line class="axis" x1="115" y1="70" x2="115" y2="230"/>
  <circle cx="115" cy="150" r="72" fill="none" stroke="currentColor" stroke-opacity="0.4"/>
  <g fill="currentColor" opacity="0.3">
    <circle cx="167" cy="98" r="3"/><circle cx="141" cy="124" r="3"/><circle cx="89" cy="176" r="3"/>
    <circle cx="63" cy="202" r="3"/><circle cx="141" cy="176" r="3"/><circle cx="89" cy="124" r="3"/>
  </g>
  <line x1="115" y1="150" x2="162.4" y2="102.6" stroke="#e2903a" stroke-width="2.5"/>
  <polygon points="165.9,99.1 162.0,109.4 155.6,103.0" fill="#e2903a"/>
  <text x="172" y="95" fill="#e2903a" font-weight="600">u&#8321;</text>
  <text x="115" y="262" text-anchor="middle" fill="#e2903a" font-size="12">achieved variance = &#955;&#8321; = 3.33</text>

  <!-- ledger, steps 1-3 (dimmed) -->
  <g opacity="0.55">
    <text class="step" x="235" y="52">1 &#183; OBJECTIVE AND CONSTRAINT</text>
    <text class="f" x="235" y="74">Var(u&#7488;x) = u&#7488;&#931;&#770;u,&#160;&#160;&#160;<tspan fill="#4c8dd6">u&#7488;u = 1</tspan></text>
    <text class="step" x="235" y="108">2 &#183; LAGRANGIAN, ONE MULTIPLIER</text>
    <text class="f" x="235" y="130">L(u, &#955;) = u&#7488;&#931;&#770;u &#8722; &#955;&#8201;<tspan fill="#4c8dd6">(u&#7488;u &#8722; 1)</tspan></text>
    <text class="step" x="235" y="164">3 &#183; SET THE GRADIENT TO ZERO</text>
    <text class="f" x="235" y="186">&#8711;&#7524;L = 2&#931;&#770;u &#8722; 2&#955;u = 0&#160;&#160;&#8658;&#160;&#160;&#931;&#770;u = &#955;u</text>
  </g>

  <!-- step 4 -->
  <text class="step" x="235" y="224">4 &#183; READ OFF THE VALUE</text>
  <text class="f" x="235" y="248">u&#7488;&#931;&#770;u = u&#7488;(&#955;u) = &#955;&#160;&#160;&#8594;&#160;&#160;<tspan fill="#e2903a" font-weight="600">choose &#955;&#8321; = 3.33</tspan></text>
  <text class="muted" x="235" y="272">the objective at an eigenvector is its eigenvalue: take the largest</text>
</svg>

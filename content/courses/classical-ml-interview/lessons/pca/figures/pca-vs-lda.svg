<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .head  { fill: currentColor; font-size: 12px; font-weight: 600; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
  </style>

  <!-- legend -->
  <circle cx="60" cy="52" r="4" fill="#4c8dd6"/><text class="muted" x="70" y="56">class 0</text>
  <circle cx="60" cy="72" r="4" fill="#5aa46a"/><text class="muted" x="70" y="76">class 1</text>

  <!-- class 0 cloud (blue), elongated along x -->
  <g fill="#4c8dd6">
    <circle cx="130" cy="97"  r="4"/><circle cx="160" cy="111" r="4"/><circle cx="190" cy="95"  r="4"/>
    <circle cx="220" cy="115" r="4"/><circle cx="250" cy="101" r="4"/><circle cx="280" cy="113" r="4"/>
    <circle cx="310" cy="95"  r="4"/><circle cx="340" cy="109" r="4"/><circle cx="370" cy="97"  r="4"/>
    <circle cx="400" cy="114" r="4"/><circle cx="430" cy="102" r="4"/><circle cx="270" cy="93"  r="4"/>
  </g>
  <!-- class 1 cloud (green), same elongation, shifted down -->
  <g fill="#5aa46a">
    <circle cx="130" cy="172" r="4"/><circle cx="160" cy="158" r="4"/><circle cx="190" cy="175" r="4"/>
    <circle cx="220" cy="156" r="4"/><circle cx="250" cy="170" r="4"/><circle cx="280" cy="159" r="4"/>
    <circle cx="310" cy="176" r="4"/><circle cx="340" cy="161" r="4"/><circle cx="370" cy="174" r="4"/>
    <circle cx="400" cy="157" r="4"/><circle cx="430" cy="169" r="4"/><circle cx="290" cy="177" r="4"/>
  </g>

  <!-- PCA direction: horizontal, amber -->
  <line x1="90" y1="135" x2="462" y2="135" stroke="#e2903a" stroke-width="2.5"/>
  <polygon points="470,135 460,130.5 460,139.5" fill="#e2903a"/>
  <text x="478" y="131" fill="#e2903a" font-weight="600" font-size="12">PC1</text>
  <text x="478" y="146" fill="#e2903a" font-size="11">(max variance)</text>

  <!-- Fisher direction: vertical -->
  <line x1="280" y1="215" x2="280" y2="63" stroke="currentColor" stroke-width="2"/>
  <polygon points="280,55 275.5,65 284.5,65" fill="currentColor"/>
  <text class="head" x="290" y="64">Fisher / LDA direction</text>

  <!-- bottom left: projection onto PC1 -->
  <text class="head" x="180" y="258" text-anchor="middle">projected onto PC1</text>
  <line x1="60" y1="330" x2="300" y2="330" stroke="currentColor" stroke-opacity="0.35"/>
  <path d="M70 330 Q 180 262 290 330" fill="none" stroke="#4c8dd6" stroke-width="2"/>
  <path d="M76 330 Q 186 266 296 330" fill="none" stroke="#5aa46a" stroke-width="2"/>
  <text class="muted" x="180" y="348" text-anchor="middle">classes fully overlap</text>

  <!-- bottom right: projection onto Fisher direction -->
  <text class="head" x="460" y="258" text-anchor="middle">projected onto the Fisher direction</text>
  <line x1="340" y1="330" x2="580" y2="330" stroke="currentColor" stroke-opacity="0.35"/>
  <path d="M380 330 Q 420 268 460 330" fill="none" stroke="#4c8dd6" stroke-width="2"/>
  <path d="M460 330 Q 500 268 540 330" fill="none" stroke="#5aa46a" stroke-width="2"/>
  <text class="muted" x="460" y="348" text-anchor="middle">classes separate</text>
</svg>

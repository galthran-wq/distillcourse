<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; font-size: 12px; }
    .head  { fill: currentColor; font-size: 13px; font-weight: 600; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
  </style>

  <!-- left: the geometry for one point -->
  <line x1="55" y1="265" x2="271" y2="49" stroke="#e2903a" stroke-width="2"/>
  <polygon points="275,45 271.1,55.3 264.7,49.0" fill="#e2903a"/>
  <text x="280" y="44" fill="#e2903a" font-weight="600">u&#8321; (PC1)</text>

  <circle cx="100" cy="220" r="3" fill="currentColor"/>
  <text class="muted" x="90" y="234">0</text>

  <!-- origin -> x -->
  <line x1="100" y1="220" x2="210" y2="165" stroke="currentColor" stroke-opacity="0.55" stroke-width="1.5"/>
  <circle cx="210" cy="165" r="4.5" fill="currentColor"/>
  <text class="label" x="218" y="172">x = (2, 1)</text>

  <!-- projection -->
  <circle cx="182.5" cy="137.5" r="4.5" fill="#e2903a"/>
  <text class="label" x="176" y="128" text-anchor="end">x&#770; = (u&#7488;x)&#8201;u</text>

  <!-- residual, dashed, with right-angle marker -->
  <line x1="210" y1="165" x2="182.5" y2="137.5" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/>
  <path d="M176.8 143.2 L182.5 148.8 L188.2 143.2" fill="none" stroke="currentColor" stroke-opacity="0.6"/>

  <!-- squared-length labels -->
  <text class="muted" x="166" y="207">&#8214;x&#8214;&#178; = 5</text>
  <text transform="translate(126,168) rotate(-45)" fill="#e2903a" font-size="12">(u&#7488;x)&#178; = 4.5</text>
  <text class="label" x="228" y="140">&#8214;x &#8722; x&#770;&#8214;&#178; = 0.5</text>
  <line x1="226" y1="144" x2="200" y2="152" stroke="currentColor" stroke-opacity="0.4"/>

  <!-- right: the identity, per point and averaged -->
  <text class="head" x="340" y="70">total = kept + lost</text>
  <text class="label" x="340" y="100">per point:&#160;&#160;&#8214;x&#8214;&#178; = (u&#7488;x)&#178; + &#8214;x &#8722; x&#770;&#8214;&#178;</text>
  <text class="muted" x="340" y="122">5 = 4.5 + 0.5</text>
  <text class="label" x="340" y="154">averaged:&#160;&#160;tr &#931;&#770; = &#955;&#8321; + &#955;&#8322;</text>
  <text class="muted" x="340" y="176">4.00 = 3.33 + 0.67</text>

  <!-- variance bar -->
  <text class="muted" x="340" y="208" font-size="11">average over the six points</text>
  <rect x="340" y="215" width="216.5" height="25" fill="#e2903a"/>
  <rect x="556.5" y="215" width="43.5" height="25" fill="currentColor" opacity="0.22"/>
  <text x="448" y="258" text-anchor="middle" fill="#e2903a" font-size="12" font-weight="600">kept on PC1 = &#955;&#8321; = 3.33</text>
  <text class="muted" x="600" y="276" text-anchor="end">lost = &#955;&#8322; = 0.67</text>
</svg>

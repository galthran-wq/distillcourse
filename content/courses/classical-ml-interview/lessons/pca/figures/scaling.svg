<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .head  { fill: currentColor; font-size: 12.5px; font-weight: 600; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
  </style>

  <!-- left panel: raw units -->
  <text class="head" x="150" y="40" text-anchor="middle">raw units (x&#8321; in grams)</text>
  <g fill="currentColor">
    <circle cx="30"  cy="144" r="3.5"/><circle cx="60"  cy="154" r="3.5"/><circle cx="90"  cy="147" r="3.5"/>
    <circle cx="120" cy="156" r="3.5"/><circle cx="135" cy="143" r="3.5"/><circle cx="150" cy="148" r="3.5"/>
    <circle cx="175" cy="153" r="3.5"/><circle cx="205" cy="145" r="3.5"/><circle cx="220" cy="157" r="3.5"/>
    <circle cx="235" cy="146" r="3.5"/><circle cx="265" cy="154" r="3.5"/><circle cx="75"  cy="152" r="3.5"/>
  </g>
  <line x1="34" y1="150" x2="262" y2="150" stroke="#e2903a" stroke-width="2.5"/>
  <polygon points="270,150 260,145.5 260,154.5" fill="#e2903a"/>
  <text x="150" y="186" text-anchor="middle" fill="#e2903a" font-weight="600" font-size="12.5">PC1 = the gram axis</text>
  <text class="muted" x="150" y="202" text-anchor="middle">explained variance &#8776; 99.99%</text>

  <!-- transformation arrow -->
  <line x1="285" y1="150" x2="347" y2="150" stroke="currentColor" stroke-width="2.5"/>
  <polygon points="355,150 345,145.5 345,154.5" fill="currentColor"/>
  <text class="head" x="320" y="128" text-anchor="middle">standardize</text>
  <text class="muted" x="320" y="142" text-anchor="middle">&#247; sd per feature</text>

  <!-- right panel: standardized -->
  <text class="head" x="490" y="40" text-anchor="middle">standardized (unit variance)</text>
  <g fill="currentColor">
    <circle cx="410" cy="220" r="3.5"/><circle cx="430" cy="190" r="3.5"/><circle cx="450" cy="200" r="3.5"/>
    <circle cx="470" cy="160" r="3.5"/><circle cx="490" cy="140" r="3.5"/><circle cx="490" cy="170" r="3.5"/>
    <circle cx="510" cy="120" r="3.5"/><circle cx="530" cy="130" r="3.5"/><circle cx="550" cy="95"  r="3.5"/>
    <circle cx="570" cy="85"  r="3.5"/><circle cx="520" cy="150" r="3.5"/><circle cx="460" cy="175" r="3.5"/>
  </g>
  <line x1="410" y1="230" x2="564.3" y2="75.7" stroke="#e2903a" stroke-width="2.5"/>
  <polygon points="570,70 566.1,80.3 559.7,73.9" fill="#e2903a"/>
  <text x="490" y="262" text-anchor="middle" fill="#e2903a" font-weight="600" font-size="12.5">PC1 = the correlated direction</text>
  <text class="muted" x="490" y="278" text-anchor="middle">explained variance 75%</text>
</svg>

<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; font-size: 12px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .axis  { stroke: currentColor; stroke-opacity: 0.35; stroke-width: 1; fill: none; }
    .guide { stroke: currentColor; stroke-opacity: 0.4; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
  </style>

  <!-- axes -->
  <path class="axis" d="M70 250 L600 250"/>
  <path class="axis" d="M70 250 L70 40"/>
  <line class="axis" x1="66" y1="250" x2="70" y2="250"/><text class="muted" x="61" y="254" text-anchor="end">0</text>
  <line class="axis" x1="66" y1="197.5" x2="70" y2="197.5"/><text class="muted" x="61" y="201.5" text-anchor="end">25</text>
  <line class="axis" x1="66" y1="145" x2="70" y2="145"/><text class="muted" x="61" y="149" text-anchor="end">50</text>
  <line class="axis" x1="66" y1="92.5" x2="70" y2="92.5"/><text class="muted" x="61" y="96.5" text-anchor="end">75</text>
  <line class="axis" x1="66" y1="40" x2="70" y2="40"/><text class="muted" x="61" y="44" text-anchor="end">100</text>
  <text class="muted" transform="translate(28,190) rotate(-90)">% of total variance</text>
  <text class="muted" x="350" y="284" text-anchor="middle">component j</text>

  <!-- per-component bars (amber) -->
  <rect x="85"  y="139.75" width="30" height="110.25" fill="#e2903a"/>
  <rect x="147" y="194.9"  width="30" height="55.1"  fill="#e2903a"/>
  <rect x="209" y="226.4"  width="30" height="23.6"  fill="#e2903a"/>
  <rect x="271" y="239.5"  width="30" height="10.5"  fill="#e2903a"/>
  <rect x="333" y="244.75" width="30" height="5.25"  fill="#e2903a"/>
  <rect x="395" y="247.4"  width="30" height="2.6"   fill="#e2903a"/>
  <rect x="457" y="248.4"  width="30" height="1.6"   fill="#e2903a"/>
  <rect x="519" y="248.95" width="30" height="1.05"  fill="#e2903a"/>
  <text class="muted" x="100" y="266" text-anchor="middle">1</text>
  <text class="muted" x="162" y="266" text-anchor="middle">2</text>
  <text class="muted" x="224" y="266" text-anchor="middle">3</text>
  <text class="muted" x="286" y="266" text-anchor="middle">4</text>
  <text class="muted" x="348" y="266" text-anchor="middle">5</text>
  <text class="muted" x="410" y="266" text-anchor="middle">6</text>
  <text class="muted" x="472" y="266" text-anchor="middle">7</text>
  <text class="muted" x="534" y="266" text-anchor="middle">8</text>

  <!-- 90% convention line -->
  <path class="guide" d="M70 61 L596 61"/>
  <text class="muted" x="598" y="65">90%</text>

  <!-- cumulative curve (blue) -->
  <polyline points="100,139.75 162,84.6 224,61 286,50.5 348,45.25 410,42.6 472,41.05 534,40"
    fill="none" stroke="#4c8dd6" stroke-width="2"/>
  <circle cx="100" cy="139.75" r="3.5" fill="#4c8dd6"/>
  <circle cx="162" cy="84.6"  r="3.5" fill="#4c8dd6"/>
  <circle cx="224" cy="61"    r="3.5" fill="#4c8dd6"/>
  <circle cx="286" cy="50.5"  r="3.5" fill="#4c8dd6"/>
  <circle cx="348" cy="45.25" r="3.5" fill="#4c8dd6"/>
  <circle cx="410" cy="42.6"  r="3.5" fill="#4c8dd6"/>
  <circle cx="472" cy="41.05" r="3.5" fill="#4c8dd6"/>
  <circle cx="534" cy="40"    r="3.5" fill="#4c8dd6"/>
  <circle cx="224" cy="61" r="7.5" fill="none" stroke="#e2903a" stroke-width="1.8"/>

  <!-- labels -->
  <text x="118" y="128" fill="#e2903a" font-size="12" font-weight="600">per-component share &#955;&#11388;/&#931;&#955;&#8342;</text>
  <text x="300" y="78" fill="#4c8dd6" font-size="12" font-weight="600">cumulative share</text>
  <text class="muted" x="224" y="214" text-anchor="middle">elbow</text>
  <line x1="224" y1="218" x2="224" y2="224" stroke="currentColor" stroke-opacity="0.45"/>
</svg>

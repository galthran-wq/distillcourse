<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .head  { fill: currentColor; font-size: 11.5px; font-weight: 600; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 10px; }
    .row   { fill: currentColor; opacity: 0.7; font-size: 9.5px; }
    .cell  { fill: none; stroke: currentColor; stroke-opacity: 0.25; }
  </style>

  <!-- left: the 17x4 table, schematically -->
  <text class="muted" x="92"  y="56" text-anchor="middle">En</text>
  <text class="muted" x="120" y="56" text-anchor="middle">Wa</text>
  <text class="muted" x="148" y="56" text-anchor="middle">Sc</text>
  <text class="muted" x="176" y="56" text-anchor="middle">NI</text>
  <g>
    <text class="row" x="74" y="76"  text-anchor="end">fresh potatoes</text>
    <text class="row" x="74" y="98"  text-anchor="end">fresh fruit</text>
    <text class="row" x="74" y="120" text-anchor="end">alcoholic drinks</text>
    <text class="row" x="74" y="142" text-anchor="end">cheese</text>
    <text class="row" x="74" y="164" text-anchor="end">fish</text>
    <text class="row" x="74" y="186" text-anchor="end">sugars</text>
    <text class="row" x="74" y="208" text-anchor="end">cereals</text>
    <text class="row" x="74" y="230" text-anchor="end">&#8942;</text>
  </g>
  <g class="cell">
    <rect x="78"  y="62" width="28" height="22"/><rect x="106" y="62" width="28" height="22"/><rect x="134" y="62" width="28" height="22"/><rect x="162" y="62" width="28" height="22"/>
    <rect x="78"  y="84" width="28" height="22"/><rect x="106" y="84" width="28" height="22"/><rect x="134" y="84" width="28" height="22"/><rect x="162" y="84" width="28" height="22"/>
    <rect x="78"  y="106" width="28" height="22"/><rect x="106" y="106" width="28" height="22"/><rect x="134" y="106" width="28" height="22"/><rect x="162" y="106" width="28" height="22"/>
    <rect x="78"  y="128" width="28" height="22"/><rect x="106" y="128" width="28" height="22"/><rect x="134" y="128" width="28" height="22"/><rect x="162" y="128" width="28" height="22"/>
    <rect x="78"  y="150" width="28" height="22"/><rect x="106" y="150" width="28" height="22"/><rect x="134" y="150" width="28" height="22"/><rect x="162" y="150" width="28" height="22"/>
    <rect x="78"  y="172" width="28" height="22"/><rect x="106" y="172" width="28" height="22"/><rect x="134" y="172" width="28" height="22"/><rect x="162" y="172" width="28" height="22"/>
    <rect x="78"  y="194" width="28" height="22"/><rect x="106" y="194" width="28" height="22"/><rect x="134" y="194" width="28" height="22"/><rect x="162" y="194" width="28" height="22"/>
    <rect x="78"  y="216" width="28" height="22"/><rect x="106" y="216" width="28" height="22"/><rect x="134" y="216" width="28" height="22"/><rect x="162" y="216" width="28" height="22"/>
  </g>
  <text class="muted" x="120" y="262" text-anchor="middle">17 foods &#215; 4 countries</text>

  <!-- arrow -->
  <line x1="202" y1="150" x2="242" y2="150" stroke="currentColor" stroke-width="2.5"/>
  <polygon points="250,150 240,145.5 240,154.5" fill="currentColor"/>
  <text class="head" x="226" y="138" text-anchor="middle">PCA</text>

  <!-- right top: PC1 strip -->
  <text class="head" x="280" y="66">scores on PC1</text>
  <line x1="280" y1="105" x2="620" y2="105" stroke="currentColor" stroke-opacity="0.35"/>
  <circle cx="345" cy="105" r="4.5" fill="#4c8dd6"/>
  <circle cx="370" cy="105" r="4.5" fill="#4c8dd6"/>
  <circle cx="398" cy="105" r="4.5" fill="#4c8dd6"/>
  <circle cx="580" cy="105" r="4.5" fill="#e2903a"/>
  <text class="muted" x="342" y="90">Scotland</text>
  <text class="muted" x="370" y="126" text-anchor="middle">England</text>
  <text class="muted" x="404" y="90">Wales</text>
  <text x="580" y="90" text-anchor="middle" fill="#e2903a" font-size="10.5" font-weight="600">N. Ireland</text>
  <text class="muted" x="620" y="122" text-anchor="end">PC1</text>

  <!-- right bottom: PC1-PC2 plane -->
  <line x1="300" y1="270" x2="560" y2="270" stroke="currentColor" stroke-opacity="0.35"/>
  <line x1="310" y1="170" x2="310" y2="278" stroke="currentColor" stroke-opacity="0.35"/>
  <circle cx="368" cy="200" r="4.5" fill="#4c8dd6"/>
  <circle cx="382" cy="225" r="4.5" fill="#4c8dd6"/>
  <circle cx="398" cy="243" r="4.5" fill="#4c8dd6"/>
  <circle cx="530" cy="222" r="4.5" fill="#e2903a"/>
  <text class="muted" x="368" y="190" text-anchor="middle">Sc</text>
  <text class="muted" x="371" y="229" text-anchor="end">En</text>
  <text class="muted" x="404" y="255">Wa</text>
  <text x="530" y="207" text-anchor="middle" fill="#e2903a" font-size="10.5" font-weight="600">NI</text>
  <text class="muted" x="558" y="284" text-anchor="end">PC1</text>
  <text class="muted" x="298" y="178" text-anchor="end">PC2</text>
</svg>

<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .muted { fill: currentColor; opacity: 0.55; font-size: 11.5px; }
    .pt { fill: currentColor; opacity: 0.75; }
    .ax { stroke: currentColor; stroke-width: 1; opacity: 0.7; }
  </style>

  <!-- left: the data -->
  <text x="40" y="22" font-size="12.5" font-weight="600">the data: x₂ ≈ x₁</text>
  <line class="ax" x1="40" y1="250" x2="40" y2="45"/>
  <line class="ax" x1="40" y1="250" x2="285" y2="250"/>
  <text class="muted" x="278" y="266">x₁</text>
  <text class="muted" x="22" y="52">x₂</text>
  <line x1="55" y1="240" x2="262" y2="60" stroke="#e2903a" stroke-width="1.6" stroke-dasharray="5 4" opacity="0.85"/>
  <text class="muted" x="62" y="74">corr(x₁, x₂) ≈ 0.999</text>
  <circle class="pt" cx="62" cy="232" r="3"/><circle class="pt" cx="78" cy="219" r="3"/><circle class="pt" cx="95" cy="208" r="3"/><circle class="pt" cx="112" cy="190" r="3"/><circle class="pt" cx="128" cy="180" r="3"/><circle class="pt" cx="145" cy="163" r="3"/><circle class="pt" cx="162" cy="152" r="3"/><circle class="pt" cx="180" cy="135" r="3"/><circle class="pt" cx="198" cy="124" r="3"/><circle class="pt" cx="215" cy="105" r="3"/><circle class="pt" cx="232" cy="95" r="3"/><circle class="pt" cx="250" cy="77" r="3"/>

  <!-- right: the coefficients -->
  <text x="360" y="22" font-size="12.5" font-weight="600">the coefficients: joint uncertainty</text>
  <line class="ax" x1="368" y1="258" x2="368" y2="42"/>
  <line class="ax" x1="360" y1="252" x2="620" y2="252"/>
  <text class="muted" x="612" y="268">β₁</text>
  <text class="muted" x="348" y="50">β₂</text>

  <ellipse cx="0" cy="0" rx="115" ry="16" transform="translate(487,147) rotate(41.4)" fill="none" stroke="currentColor" opacity="0.4" stroke-width="1.2"/>
  <ellipse cx="0" cy="0" rx="78" ry="10.5" transform="translate(487,147) rotate(41.4)" fill="none" stroke="currentColor" opacity="0.5" stroke-width="1.2"/>
  <ellipse cx="0" cy="0" rx="40" ry="5.5" transform="translate(487,147) rotate(41.4)" fill="none" stroke="currentColor" opacity="0.6" stroke-width="1.2"/>
  <line x1="374" y1="48" x2="602" y2="249" stroke="#e2903a" stroke-width="1.6" stroke-dasharray="5 4" opacity="0.9"/>
  <g transform="translate(420,76) rotate(41.4)">
    <text x="0" y="-8" fill="#e2903a" font-size="12">β₁ + β₂ = 2</text>
  </g>

  <circle cx="572" cy="222" r="4" fill="#4c8dd6"/>
  <text x="580" y="212" fill="#4c8dd6" font-size="12">fit A: (2, 0)</text>
  <circle cx="402" cy="72" r="4" fill="#4c8dd6"/>
  <text x="414" y="68" fill="#4c8dd6" font-size="12">fit B: (−3, 5)</text>

  <text class="muted" x="378" y="284">the split slides along the long axis; the sum barely moves</text>
</svg>

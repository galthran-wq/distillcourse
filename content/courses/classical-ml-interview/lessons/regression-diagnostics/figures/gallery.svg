<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .pt { fill: currentColor; opacity: 0.75; }
    .ax { stroke: currentColor; stroke-width: 1; opacity: 0.7; }
    .zero { stroke: currentColor; stroke-width: 1; stroke-dasharray: 3 3; opacity: 0.45; }
  </style>

  <!-- panel A: well-behaved -->
  <g>
    <text x="34" y="20" font-size="12.5"><tspan font-weight="600">well-behaved</tspan><tspan class="muted"> — even band: assumptions pass</tspan></text>
    <line class="ax" x1="34" y1="32" x2="34" y2="168"/>
    <line class="ax" x1="34" y1="168" x2="300" y2="168"/>
    <line class="zero" x1="34" y1="100" x2="300" y2="100"/>
    <text class="muted" x="300" y="184" text-anchor="end">fitted value</text>
    <circle class="pt" cx="52" cy="92" r="3"/><circle class="pt" cx="68" cy="114" r="3"/><circle class="pt" cx="84" cy="88" r="3"/><circle class="pt" cx="100" cy="108" r="3"/><circle class="pt" cx="116" cy="95" r="3"/><circle class="pt" cx="132" cy="113" r="3"/><circle class="pt" cx="148" cy="84" r="3"/><circle class="pt" cx="164" cy="105" r="3"/><circle class="pt" cx="180" cy="117" r="3"/><circle class="pt" cx="196" cy="91" r="3"/><circle class="pt" cx="212" cy="102" r="3"/><circle class="pt" cx="228" cy="86" r="3"/><circle class="pt" cx="244" cy="110" r="3"/><circle class="pt" cx="260" cy="98" r="3"/><circle class="pt" cx="276" cy="106" r="3"/><circle class="pt" cx="290" cy="90" r="3"/>
  </g>

  <!-- panel B: curved -->
  <g transform="translate(320,0)">
    <text x="34" y="20" font-size="12.5"><tspan fill="#e2903a" font-weight="600">curved</tspan><tspan class="muted"> — missing non-linearity (GM1)</tspan></text>
    <line class="ax" x1="34" y1="32" x2="34" y2="168"/>
    <line class="ax" x1="34" y1="168" x2="300" y2="168"/>
    <line class="zero" x1="34" y1="100" x2="300" y2="100"/>
    <text class="muted" x="300" y="184" text-anchor="end">fitted value</text>
    <path d="M 52 66 Q 171 203 290 56" fill="none" stroke="#e2903a" stroke-width="1.6" stroke-dasharray="5 4" opacity="0.85"/>
    <circle class="pt" cx="52" cy="66" r="3"/><circle class="pt" cx="72" cy="80" r="3"/><circle class="pt" cx="92" cy="98" r="3"/><circle class="pt" cx="112" cy="114" r="3"/><circle class="pt" cx="132" cy="126" r="3"/><circle class="pt" cx="152" cy="130" r="3"/><circle class="pt" cx="172" cy="128" r="3"/><circle class="pt" cx="192" cy="118" r="3"/><circle class="pt" cx="212" cy="104" r="3"/><circle class="pt" cx="232" cy="88" r="3"/><circle class="pt" cx="252" cy="74" r="3"/><circle class="pt" cx="272" cy="62" r="3"/><circle class="pt" cx="290" cy="56" r="3"/>
  </g>

  <!-- panel C: funnel -->
  <g transform="translate(0,200)">
    <text x="34" y="20" font-size="12.5"><tspan fill="#e2903a" font-weight="600">funnel</tspan><tspan class="muted"> — heteroscedasticity (GM3)</tspan></text>
    <line class="ax" x1="34" y1="32" x2="34" y2="168"/>
    <line class="ax" x1="34" y1="168" x2="300" y2="168"/>
    <line class="zero" x1="34" y1="100" x2="300" y2="100"/>
    <text class="muted" x="300" y="184" text-anchor="end">fitted value</text>
    <line x1="46" y1="94" x2="296" y2="52" stroke="#e2903a" stroke-width="1.4" stroke-dasharray="5 4" opacity="0.85"/>
    <line x1="46" y1="106" x2="296" y2="148" stroke="#e2903a" stroke-width="1.4" stroke-dasharray="5 4" opacity="0.85"/>
    <circle class="pt" cx="52" cy="99" r="3"/><circle class="pt" cx="68" cy="104" r="3"/><circle class="pt" cx="84" cy="95" r="3"/><circle class="pt" cx="100" cy="106" r="3"/><circle class="pt" cx="116" cy="92" r="3"/><circle class="pt" cx="132" cy="110" r="3"/><circle class="pt" cx="148" cy="86" r="3"/><circle class="pt" cx="164" cy="116" r="3"/><circle class="pt" cx="180" cy="80" r="3"/><circle class="pt" cx="196" cy="121" r="3"/><circle class="pt" cx="212" cy="74" r="3"/><circle class="pt" cx="228" cy="127" r="3"/><circle class="pt" cx="244" cy="66" r="3"/><circle class="pt" cx="260" cy="133" r="3"/><circle class="pt" cx="276" cy="58" r="3"/><circle class="pt" cx="290" cy="140" r="3"/>
  </g>

  <!-- panel D: tracking -->
  <g transform="translate(320,200)">
    <text x="34" y="20" font-size="12.5"><tspan fill="#e2903a" font-weight="600">tracking</tspan><tspan class="muted"> — correlated errors (GM3)</tspan></text>
    <line class="ax" x1="34" y1="32" x2="34" y2="168"/>
    <line class="ax" x1="34" y1="168" x2="300" y2="168"/>
    <line class="zero" x1="34" y1="100" x2="300" y2="100"/>
    <text class="muted" x="300" y="184" text-anchor="end">time order</text>
    <polyline points="52,100 68,82 84,72 100,73 116,84 132,101 148,117 164,127 180,128 196,117 212,101 228,84 244,73 260,74 276,87 290,100" fill="none" stroke="#e2903a" stroke-width="1.4" opacity="0.7"/>
    <circle class="pt" cx="52" cy="100" r="3"/><circle class="pt" cx="68" cy="82" r="3"/><circle class="pt" cx="84" cy="72" r="3"/><circle class="pt" cx="100" cy="73" r="3"/><circle class="pt" cx="116" cy="84" r="3"/><circle class="pt" cx="132" cy="101" r="3"/><circle class="pt" cx="148" cy="117" r="3"/><circle class="pt" cx="164" cy="127" r="3"/><circle class="pt" cx="180" cy="128" r="3"/><circle class="pt" cx="196" cy="117" r="3"/><circle class="pt" cx="212" cy="101" r="3"/><circle class="pt" cx="228" cy="84" r="3"/><circle class="pt" cx="244" cy="73" r="3"/><circle class="pt" cx="260" cy="74" r="3"/><circle class="pt" cx="276" cy="87" r="3"/><circle class="pt" cx="290" cy="100" r="3"/>
  </g>
</svg>

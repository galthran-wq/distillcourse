<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .pt { fill: currentColor; opacity: 0.7; }
    .ax { stroke: currentColor; stroke-width: 1; opacity: 0.7; }
    .without { stroke: #4c8dd6; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .with { stroke: #e2903a; stroke-width: 1.8; }
  </style>

  <!-- panel 1: outlier -->
  <g transform="translate(12,0)">
    <text x="24" y="20" font-size="12.5" font-weight="600">outlier</text>
    <line class="ax" x1="24" y1="210" x2="24" y2="34"/>
    <line class="ax" x1="24" y1="210" x2="200" y2="210"/>
    <line class="without" x1="26" y1="171" x2="196" y2="52"/>
    <line class="with" x1="26" y1="162" x2="196" y2="48"/>
    <circle class="pt" cx="30" cy="168" r="3"/><circle class="pt" cx="40" cy="160" r="3"/><circle class="pt" cx="50" cy="155" r="3"/><circle class="pt" cx="60" cy="146" r="3"/><circle class="pt" cx="70" cy="143" r="3"/><circle class="pt" cx="80" cy="132" r="3"/><circle class="pt" cx="90" cy="128" r="3"/><circle class="pt" cx="100" cy="120" r="3"/><circle class="pt" cx="110" cy="114" r="3"/><circle class="pt" cx="120" cy="105" r="3"/>
    <circle cx="75" cy="40" r="4.5" fill="#e2903a"/>
    <text class="muted" x="24" y="232">large residual, low leverage</text>
    <text class="muted" x="24" y="248">fit shifts only slightly</text>
  </g>

  <!-- panel 2: high leverage -->
  <g transform="translate(226,0)">
    <text x="24" y="20" font-size="12.5" font-weight="600">high leverage</text>
    <line class="ax" x1="24" y1="210" x2="24" y2="34"/>
    <line class="ax" x1="24" y1="210" x2="200" y2="210"/>
    <line class="without" x1="26" y1="171" x2="196" y2="52"/>
    <line class="with" x1="26" y1="170" x2="196" y2="51"/>
    <circle class="pt" cx="30" cy="168" r="3"/><circle class="pt" cx="40" cy="160" r="3"/><circle class="pt" cx="50" cy="155" r="3"/><circle class="pt" cx="60" cy="146" r="3"/><circle class="pt" cx="70" cy="143" r="3"/><circle class="pt" cx="80" cy="132" r="3"/><circle class="pt" cx="90" cy="128" r="3"/><circle class="pt" cx="100" cy="120" r="3"/><circle class="pt" cx="110" cy="114" r="3"/><circle class="pt" cx="120" cy="105" r="3"/>
    <circle cx="180" cy="64" r="4.5" fill="#e2903a"/>
    <text class="muted" x="24" y="232">far out in x, on trend</text>
    <text class="muted" x="24" y="248">fit unchanged — for now</text>
  </g>

  <!-- panel 3: influential -->
  <g transform="translate(440,0)">
    <text x="24" y="20" font-size="12.5" font-weight="600">influential (both)</text>
    <line class="ax" x1="24" y1="210" x2="24" y2="34"/>
    <line class="ax" x1="24" y1="210" x2="200" y2="210"/>
    <line class="without" x1="26" y1="171" x2="196" y2="52"/>
    <line class="with" x1="26" y1="152" x2="196" y2="111"/>
    <circle class="pt" cx="30" cy="168" r="3"/><circle class="pt" cx="40" cy="160" r="3"/><circle class="pt" cx="50" cy="155" r="3"/><circle class="pt" cx="60" cy="146" r="3"/><circle class="pt" cx="70" cy="143" r="3"/><circle class="pt" cx="80" cy="132" r="3"/><circle class="pt" cx="90" cy="128" r="3"/><circle class="pt" cx="100" cy="120" r="3"/><circle class="pt" cx="110" cy="114" r="3"/><circle class="pt" cx="120" cy="105" r="3"/>
    <circle cx="180" cy="150" r="4.5" fill="#e2903a"/>
    <text class="muted" x="24" y="232">far out in x, off trend</text>
    <text class="muted" x="24" y="248">slope rewritten</text>
  </g>

  <!-- legend -->
  <g font-size="11.5">
    <circle cx="60" cy="278" r="4.5" fill="#e2903a"/>
    <text x="70" y="282" fill="currentColor" opacity="0.75">added point</text>
    <line x1="200" y1="278" x2="232" y2="278" stroke="#e2903a" stroke-width="1.8"/>
    <text x="240" y="282" fill="currentColor" opacity="0.75">fit with it</text>
    <line x1="360" y1="278" x2="392" y2="278" stroke="#4c8dd6" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="400" y="282" fill="currentColor" opacity="0.75">fit without it</text>
  </g>
</svg>

<svg viewBox="0 0 560 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .muted { fill: currentColor; opacity: 0.55; font-size: 11.5px; }
    .ax { stroke: currentColor; stroke-width: 1; opacity: 0.7; }
    .tick { stroke: currentColor; stroke-width: 1; opacity: 0.5; }
  </style>

  <line class="ax" x1="70" y1="50" x2="70" y2="250"/>
  <line class="ax" x1="70" y1="250" x2="520" y2="250"/>

  <!-- y ticks -->
  <line class="tick" x1="66" y1="217" x2="70" y2="217"/><text class="muted" x="60" y="221" text-anchor="end">0.60</text>
  <line class="tick" x1="66" y1="183" x2="70" y2="183"/><text class="muted" x="60" y="187" text-anchor="end">0.65</text>
  <line class="tick" x1="66" y1="150" x2="70" y2="150"/><text class="muted" x="60" y="154" text-anchor="end">0.70</text>
  <line class="tick" x1="66" y1="117" x2="70" y2="117"/><text class="muted" x="60" y="121" text-anchor="end">0.75</text>

  <!-- x ticks -->
  <line class="tick" x1="70" y1="250" x2="70" y2="254"/><text class="muted" x="70" y="268" text-anchor="middle">0</text>
  <line class="tick" x1="160" y1="250" x2="160" y2="254"/><text class="muted" x="160" y="268" text-anchor="middle">2</text>
  <line class="tick" x1="250" y1="250" x2="250" y2="254"/><text class="muted" x="250" y="268" text-anchor="middle">4</text>
  <line class="tick" x1="340" y1="250" x2="340" y2="254"/><text class="muted" x="340" y="268" text-anchor="middle">6</text>
  <line class="tick" x1="430" y1="250" x2="430" y2="254"/><text class="muted" x="430" y="268" text-anchor="middle">8</text>
  <line class="tick" x1="520" y1="250" x2="520" y2="254"/><text class="muted" x="520" y="268" text-anchor="middle">10</text>
  <text class="muted" x="295" y="290" text-anchor="middle">junk features added (n = 50, 5 real predictors)</text>

  <!-- R² curve -->
  <polyline points="70,150 115,146 160,142 205,138.7 250,135.3 295,132 340,129.3 385,126.7 430,124 475,122 520,120"
    fill="none" stroke="#4c8dd6" stroke-width="2"/>
  <circle cx="70" cy="150" r="3.5" fill="#4c8dd6"/>
  <text x="330" y="112" fill="#4c8dd6" font-size="12.5">R² — never falls</text>

  <!-- adjusted R² curve -->
  <polyline points="70,173 115,173.3 160,174 205,175.5 250,177.1 295,178.7 340,181.3 385,184 430,186.9 475,190.8 520,195"
    fill="none" stroke="#e2903a" stroke-width="2"/>
  <circle cx="70" cy="173" r="3.5" fill="#e2903a"/>
  <text x="310" y="208" fill="#e2903a" font-size="12.5">adjusted R² — falls on junk</text>
</svg>

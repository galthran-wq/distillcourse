<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .muted { fill: currentColor; opacity: 0.55; font-size: 11.5px; }
    .box { fill: none; stroke: currentColor; stroke-width: 1.2; opacity: 0.8; }
    .num { fill: currentColor; }
  </style>

  <!-- pipeline -->
  <rect class="box" x="18" y="40" width="200" height="58" rx="6"/>
  <text x="118" y="64" text-anchor="middle" font-weight="600">1. regress xⱼ on</text>
  <text x="118" y="84" text-anchor="middle" font-weight="600">the other features</text>

  <line x1="222" y1="69" x2="242" y2="69" stroke="currentColor" stroke-width="1.4"/>
  <polygon points="250,69 240,64.5 240,73.5" fill="currentColor"/>

  <rect class="box" x="254" y="40" width="118" height="58" rx="6"/>
  <text x="313" y="64" text-anchor="middle" font-weight="600">2. read off</text>
  <text x="313" y="86" text-anchor="middle" fill="#e2903a" font-weight="600">Rⱼ²</text>

  <line x1="376" y1="69" x2="396" y2="69" stroke="currentColor" stroke-width="1.4"/>
  <polygon points="404,69 394,64.5 394,73.5" fill="currentColor"/>

  <rect class="box" x="408" y="40" width="214" height="58" rx="6"/>
  <text x="515" y="64" text-anchor="middle" font-weight="600">3. VIFⱼ = 1 / (1 − <tspan fill="#e2903a">Rⱼ²</tspan>)</text>
  <text x="515" y="86" text-anchor="middle" class="muted">SE inflated by √VIFⱼ</text>

  <text class="muted" x="18" y="126">VIFⱼ = 1: xⱼ uncorrelated with the rest &#183; flag when VIFⱼ &gt; 5–10</text>

  <!-- worked table -->
  <text x="140" y="164" class="muted">feature</text>
  <text x="270" y="164" class="muted" text-anchor="middle">Rⱼ²</text>
  <text x="370" y="164" class="muted" text-anchor="middle">VIFⱼ</text>
  <text x="470" y="164" class="muted" text-anchor="middle">verdict</text>
  <line x1="130" y1="172" x2="530" y2="172" stroke="currentColor" opacity="0.4"/>

  <text class="num" x="140" y="196">x₁</text>
  <text class="num" x="270" y="196" text-anchor="middle">0.30</text>
  <text class="num" x="370" y="196" text-anchor="middle">1.4</text>
  <text x="470" y="196" text-anchor="middle" fill="#5aa46a">fine</text>

  <text class="num" x="140" y="222">x₂</text>
  <text class="num" x="270" y="222" text-anchor="middle">0.75</text>
  <text class="num" x="370" y="222" text-anchor="middle">4.0</text>
  <text x="470" y="222" text-anchor="middle" fill="#5aa46a">fine</text>

  <text class="num" x="140" y="248">x₃</text>
  <text class="num" x="270" y="248" text-anchor="middle">0.90</text>
  <text class="num" x="370" y="248" text-anchor="middle" font-weight="600">10.0</text>
  <text x="470" y="248" text-anchor="middle" fill="#e2903a" font-weight="600">flag</text>

  <text class="num" x="140" y="274">x₄</text>
  <text class="num" x="270" y="274" text-anchor="middle">0.95</text>
  <text class="num" x="370" y="274" text-anchor="middle" font-weight="600">20.0</text>
  <text x="470" y="274" text-anchor="middle" fill="#e2903a" font-weight="600">flag</text>
</svg>

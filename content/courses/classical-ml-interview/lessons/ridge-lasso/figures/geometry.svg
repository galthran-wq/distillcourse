<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .axis  { stroke: currentColor; stroke-width: 1; opacity: 0.6; }
    .ell   { stroke: currentColor; stroke-width: 1.2; fill: none; opacity: 0.55; }
  </style>

  <text x="88" y="24" fill="currentColor" font-size="13.5">lasso: ‖β‖₁ ≤ t</text>
  <text x="408" y="24" fill="currentColor" font-size="13.5">ridge: ‖β‖₂² ≤ t²</text>

  <!-- left panel axes -->
  <line class="axis" x1="60" y1="150" x2="300" y2="150"/>
  <line class="axis" x1="160" y1="45" x2="160" y2="255"/>
  <text class="muted" x="290" y="167">β₁</text>
  <text class="muted" x="167" y="55">β₂</text>

  <!-- L1 ball -->
  <polygon points="100,150 160,90 220,150 160,210" fill="#4c8dd6" fill-opacity="0.15" stroke="#4c8dd6" stroke-width="2"/>

  <!-- RSS contours around the OLS point -->
  <ellipse class="ell" cx="255" cy="65" rx="98" ry="36" transform="rotate(-14.8 255 65)"/>
  <ellipse class="ell" cx="255" cy="65" rx="60" ry="22" transform="rotate(-14.8 255 65)"/>
  <ellipse class="ell" cx="255" cy="65" rx="24" ry="9"  transform="rotate(-14.8 255 65)"/>
  <circle cx="255" cy="65" r="3.5" fill="currentColor"/>
  <text x="263" y="55" fill="currentColor" font-size="12">β̂ (OLS)</text>

  <!-- contact at the corner -->
  <circle cx="160" cy="90" r="4.5" fill="#e2903a"/>
  <text x="62" y="82" fill="#e2903a" font-size="12">β̂ lasso</text>

  <text class="muted" x="42" y="280">the growing ellipse meets the diamond at a corner → β₁ = 0 exactly</text>

  <!-- right panel axes -->
  <line class="axis" x1="380" y1="150" x2="618" y2="150"/>
  <line class="axis" x1="480" y1="45" x2="480" y2="255"/>
  <text class="muted" x="608" y="167">β₁</text>
  <text class="muted" x="487" y="55">β₂</text>

  <!-- L2 ball -->
  <circle cx="480" cy="150" r="60" fill="#4c8dd6" fill-opacity="0.15" stroke="#4c8dd6" stroke-width="2"/>

  <!-- RSS contours -->
  <ellipse class="ell" cx="575" cy="65" rx="67" ry="30" transform="rotate(-41.8 575 65)"/>
  <ellipse class="ell" cx="575" cy="65" rx="40" ry="18" transform="rotate(-41.8 575 65)"/>
  <ellipse class="ell" cx="575" cy="65" rx="16" ry="7"  transform="rotate(-41.8 575 65)"/>
  <circle cx="575" cy="65" r="3.5" fill="currentColor"/>
  <text x="583" y="55" fill="currentColor" font-size="12">β̂ (OLS)</text>

  <!-- contact off-axis -->
  <circle cx="525" cy="110" r="4.5" fill="#e2903a"/>
  <text x="530" y="128" fill="#e2903a" font-size="12">β̂ ridge</text>

  <text class="muted" x="362" y="280">tangency on the smooth disk is off-axis → β₁, β₂ both ≠ 0</text>
</svg>

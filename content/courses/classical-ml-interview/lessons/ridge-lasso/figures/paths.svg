<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .axis  { stroke: currentColor; stroke-width: 1; opacity: 0.6; }
    .coef  { stroke: currentColor; stroke-width: 1.5; fill: none; opacity: 0.55; }
  </style>

  <text x="65" y="34" fill="currentColor" font-size="13.5">ridge: shrink, never exactly 0</text>
  <text x="370" y="34" fill="currentColor" font-size="13.5">lasso: hit exact 0, one at a time</text>

  <!-- left panel -->
  <line class="axis" x1="60" y1="270" x2="310" y2="270"/>
  <line class="axis" x1="60" y1="270" x2="60" y2="60"/>
  <line x1="60" y1="170" x2="310" y2="170" stroke="currentColor" stroke-width="1" stroke-dasharray="3 3" opacity="0.5"/>
  <text class="muted" x="285" y="288">λ →</text>
  <text class="muted" x="34" y="174">0</text>

  <path class="coef" d="M65,75 C130,105 210,150 305,164"/>
  <path d="M65,108 C130,130 210,158 305,166" fill="none" stroke="#e2903a" stroke-width="2.2"/>
  <path class="coef" d="M65,139 C130,152 210,164 305,168"/>
  <path class="coef" d="M65,195 C130,186 210,176 305,172.5"/>
  <path class="coef" d="M65,226 C130,208 210,182 305,174"/>

  <!-- right panel -->
  <line class="axis" x1="365" y1="270" x2="615" y2="270"/>
  <line class="axis" x1="365" y1="270" x2="365" y2="60"/>
  <line x1="365" y1="170" x2="615" y2="170" stroke="currentColor" stroke-width="1" stroke-dasharray="3 3" opacity="0.5"/>
  <text class="muted" x="590" y="288">λ →</text>
  <text class="muted" x="339" y="174">0</text>

  <polyline class="coef" points="370,75 480,122 588,170 612,170"/>
  <polyline points="370,108 455,140 508,170 612,170" fill="none" stroke="#e2903a" stroke-width="2.2"/>
  <polyline class="coef" points="370,139 434,170 612,170"/>
  <polyline class="coef" points="370,195 452,170 612,170"/>
  <polyline class="coef" points="370,226 483,191 545,170 612,170"/>

  <!-- zero-hit markers -->
  <circle cx="434" cy="170" r="3" fill="currentColor" opacity="0.7"/>
  <circle cx="452" cy="170" r="3" fill="currentColor" opacity="0.7"/>
  <circle cx="508" cy="170" r="3" fill="#e2903a"/>
  <circle cx="545" cy="170" r="3" fill="currentColor" opacity="0.7"/>
  <circle cx="588" cy="170" r="3" fill="currentColor" opacity="0.7"/>

  <text class="muted" x="88" y="308">amber: the same coefficient in both panels — decays smoothly on the left, dies at a finite λ on the right</text>
</svg>

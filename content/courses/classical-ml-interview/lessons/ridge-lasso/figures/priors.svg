<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .axis  { stroke: currentColor; stroke-width: 1; opacity: 0.6; }
  </style>

  <!-- axis -->
  <line class="axis" x1="70" y1="260" x2="580" y2="260"/>
  <line class="axis" x1="320" y1="256" x2="320" y2="264"/>
  <text class="muted" x="316" y="278">0</text>
  <text class="muted" x="572" y="278">βⱼ</text>

  <!-- Gaussian density (support blue) -->
  <polyline fill="none" stroke="#4c8dd6" stroke-width="2"
    points="80,259.9 110,259.7 140,258.2 155,256.4 170,253.0 185,247.3 200,238.4 215,225.5 230,208.2 245,187.0 260,163.2 275,139.6 290,119.3 305,105.3 320,100.4 335,105.3 350,119.3 365,139.6 380,163.2 395,187.0 410,208.2 425,225.5 440,238.4 455,247.3 470,253.0 485,256.4 500,258.2 530,259.7 560,259.9"/>

  <!-- Laplace density (amber) -->
  <polyline fill="none" stroke="#e2903a" stroke-width="2.2"
    points="80,256.3 110,254.0 140,250.0 170,243.6 200,232.9 215,225.2 230,215.4 245,202.7 260,186.4 275,165.5 290,138.7 305,104.2 320,60 335,104.2 350,138.7 365,165.5 380,186.4 395,202.7 410,215.4 425,225.2 440,232.9 470,243.6 500,250.0 530,254.0 560,256.3"/>

  <text x="336" y="66" fill="#e2903a" font-size="12.5">Laplace: cusp and extra mass at 0</text>
  <text x="150" y="130" fill="#4c8dd6" font-size="12.5">Gaussian</text>
  <text class="muted" x="480" y="236">Laplace tails heavier</text>

  <text x="80"  y="306" fill="#4c8dd6" font-size="12.5">−log Gaussian ∝ βⱼ² → L2 penalty (ridge)</text>
  <text x="350" y="306" fill="#e2903a" font-size="12.5">−log Laplace ∝ |βⱼ| → L1 penalty (lasso)</text>
</svg>

<svg viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .axis  { stroke: currentColor; stroke-width: 1; opacity: 0.6; }
  </style>

  <!-- axes -->
  <line class="axis" x1="100" y1="190" x2="445" y2="190"/>
  <line class="axis" x1="270" y1="22" x2="270" y2="358"/>
  <text class="muted" x="400" y="210">β̂ⱼ (OLS)</text>
  <text class="muted" x="278" y="34">penalized estimate</text>

  <!-- lambda ticks -->
  <line class="axis" x1="228" y1="186" x2="228" y2="194"/>
  <line class="axis" x1="312" y1="186" x2="312" y2="194"/>
  <text class="muted" x="216" y="208">−λ</text>
  <text class="muted" x="308" y="208">λ</text>

  <!-- identity guide -->
  <line x1="119" y1="341" x2="421" y2="39" stroke="currentColor" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.5"/>

  <!-- frame 2: identity shifted toward zero by lambda -->
  <line x1="270" y1="232" x2="421" y2="81" stroke="#e2903a" stroke-width="2.5"/>
  <line x1="119" y1="299" x2="270" y2="148" stroke="#e2903a" stroke-width="2.5"/>

  <!-- gap marker: the vertical distance to the identity is lambda -->
  <line x1="375" y1="85" x2="375" y2="123" stroke="currentColor" stroke-width="1.2" opacity="0.7"/>
  <line x1="371" y1="85" x2="379" y2="85" stroke="currentColor" stroke-width="1.2" opacity="0.7"/>
  <line x1="371" y1="123" x2="379" y2="123" stroke="currentColor" stroke-width="1.2" opacity="0.7"/>
  <text x="383" y="108" fill="currentColor" font-size="12">λ</text>

  <!-- sign-flip callout -->
  <line x1="291" y1="224" x2="316" y2="248" stroke="currentColor" stroke-width="1" opacity="0.5"/>
  <text class="muted" x="320" y="256">0 &lt; β̂ⱼ &lt; λ: the shifted</text>
  <text class="muted" x="320" y="272">estimate flips sign</text>

  <text x="460" y="80" fill="currentColor" font-size="13">2. subtract λ</text>
  <text x="460" y="102" fill="#e2903a" font-size="12.5">estimate = β̂ⱼ ∓ λ</text>
  <text class="muted" x="460" y="122">every magnitude drops</text>
  <text class="muted" x="460" y="138">by the same λ</text>
</svg>

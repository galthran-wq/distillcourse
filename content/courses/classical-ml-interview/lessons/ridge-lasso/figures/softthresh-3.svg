<svg viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .axis  { stroke: currentColor; stroke-width: 1; opacity: 0.6; }
  </style>

  <!-- axes -->
  <line class="axis" x1="100" y1="190" x2="445" y2="190"/>
  <line class="axis" x1="270" y1="22" x2="270" y2="358"/>
  <text class="muted" x="400" y="210">β̂ⱼ (OLS)</text>
  <text class="muted" x="278" y="34">penalized estimate</text>

  <!-- lambda ticks -->
  <line class="axis" x1="228" y1="186" x2="228" y2="194"/>
  <line class="axis" x1="312" y1="186" x2="312" y2="194"/>
  <text class="muted" x="216" y="208">−λ</text>
  <text class="muted" x="308" y="208">λ</text>

  <!-- identity guide -->
  <line x1="119" y1="341" x2="421" y2="39" stroke="currentColor" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.5"/>

  <!-- ridge: proportional shrink beta/(1+lambda), lambda = 1 -->
  <line x1="119" y1="266" x2="421" y2="114" stroke="#4c8dd6" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- best subset: hard threshold at lambda -->
  <line x1="119" y1="341" x2="228" y2="232" stroke="#5aa46a" stroke-width="2" stroke-dasharray="2 3"/>
  <line x1="312" y1="148" x2="421" y2="39" stroke="#5aa46a" stroke-width="2" stroke-dasharray="2 3"/>
  <line x1="228" y1="194" x2="312" y2="194" stroke="#5aa46a" stroke-width="2" stroke-dasharray="2 3"/>

  <!-- frame 3: lasso soft threshold, clipped at zero -->
  <polyline points="119,299 228,190 312,190 421,81" fill="none" stroke="#e2903a" stroke-width="2.5"/>
  <text x="230" y="178" fill="#e2903a" font-size="11.5">exact 0 on [−λ, λ]</text>

  <text x="460" y="80" fill="currentColor" font-size="13">3. clip at zero</text>
  <text x="460" y="104" fill="#e2903a" font-size="12">lasso: (|β̂ⱼ|−λ)₊</text>
  <text x="460" y="126" fill="#4c8dd6" font-size="12">ridge: β̂ⱼ ⁄ (1+λ)</text>
  <text x="460" y="148" fill="#5aa46a" font-size="12">subset: hard cut</text>
  <text class="muted" x="460" y="172">only the amber curve</text>
  <text class="muted" x="460" y="188">is both continuous</text>
  <text class="muted" x="460" y="204">and exactly zero</text>
</svg>

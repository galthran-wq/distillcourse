<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .pt { fill: currentColor; opacity: 0.65; }
  </style>

  <!-- feature cloud (rows of centered X in 2 dimensions) -->
  <circle class="pt" cx="158" cy="201" r="3.5"/>
  <circle class="pt" cx="167" cy="175" r="3.5"/>
  <circle class="pt" cx="196" cy="199" r="3.5"/>
  <circle class="pt" cx="197" cy="167" r="3.5"/>
  <circle class="pt" cx="225" cy="190" r="3.5"/>
  <circle class="pt" cx="213" cy="144" r="3.5"/>
  <circle class="pt" cx="240" cy="164" r="3.5"/>
  <circle class="pt" cx="238" cy="136" r="3.5"/>
  <circle class="pt" cx="269" cy="165" r="3.5"/>
  <circle class="pt" cx="270" cy="134" r="3.5"/>
  <circle class="pt" cx="293" cy="146" r="3.5"/>
  <circle class="pt" cx="290" cy="108" r="3.5"/>
  <circle class="pt" cx="315" cy="124" r="3.5"/>
  <circle class="pt" cx="321" cy="101" r="3.5"/>
  <circle class="pt" cx="343" cy="124" r="3.5"/>
  <circle class="pt" cx="347" cy="97"  r="3.5"/>

  <!-- principal direction u1 (high variance) -->
  <line x1="250" y1="150" x2="353" y2="99" stroke="#e2903a" stroke-width="2.5"/>
  <polygon points="353,99 345.9,107.1 342.3,99.9" fill="#e2903a"/>
  <text x="358" y="88" fill="#e2903a" font-size="12.5">u₁</text>

  <!-- principal direction u2 (low variance) -->
  <line x1="250" y1="150" x2="230" y2="110" stroke="#4c8dd6" stroke-width="2.5"/>
  <polygon points="230,110 238.1,117.1 230.9,120.7" fill="#4c8dd6"/>
  <text x="210" y="103" fill="#4c8dd6" font-size="12.5">u₂</text>

  <!-- shrink-factor panel -->
  <text x="420" y="90"  fill="#e2903a" font-size="13">along u₁: d₁² = 16</text>
  <text x="420" y="110" fill="#e2903a" font-size="13">keep 16⁄18 ≈ 0.89</text>
  <text x="420" y="150" fill="#4c8dd6" font-size="13">along u₂: d₂² = 1</text>
  <text x="420" y="170" fill="#4c8dd6" font-size="13">keep 1⁄3 ≈ 0.33</text>
  <text class="muted" x="420" y="205">λ = 2, factor dⱼ²∕(dⱼ²+λ)</text>
  <text class="muted" x="420" y="223">df(λ) = 0.89 + 0.33 ≈ 1.2</text>

  <text class="muted" x="70" y="270">ridge shrinks the fit most along the direction the data barely covers (u₂)</text>
</svg>

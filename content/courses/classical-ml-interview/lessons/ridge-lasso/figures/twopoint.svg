<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .axis  { stroke: currentColor; stroke-width: 1; opacity: 0.7; }
  </style>

  <text x="55" y="28" fill="currentColor" font-size="13.5">OLS: exact fit of the 2 train points</text>
  <text x="370" y="28" fill="currentColor" font-size="13.5">ridge, λ = 0.3: slope shrunk 1.6 → 1.0</text>

  <!-- left panel axes -->
  <line class="axis" x1="40" y1="240" x2="300" y2="240"/>
  <line class="axis" x1="40" y1="240" x2="40" y2="60"/>
  <text class="muted" x="293" y="257">x</text>

  <!-- OLS line y = -0.4 + 1.6x -->
  <line x1="75" y1="224" x2="257" y2="58" stroke="#e2903a" stroke-width="2"/>
  <text x="200" y="52" fill="#e2903a" font-size="12">ŷ = −0.4 + 1.6x</text>

  <!-- test errors (blue) -->
  <line x1="75"  y1="196" x2="75"  y2="224" stroke="#4c8dd6" stroke-width="2"/>
  <line x1="145" y1="164" x2="145" y2="160" stroke="#4c8dd6" stroke-width="2"/>
  <line x1="215" y1="116" x2="215" y2="96"  stroke="#4c8dd6" stroke-width="2"/>
  <line x1="250" y1="104" x2="250" y2="64"  stroke="#4c8dd6" stroke-width="2"/>

  <!-- test points (blue) -->
  <circle cx="75"  cy="196" r="4" fill="#4c8dd6"/>
  <circle cx="145" cy="164" r="4" fill="#4c8dd6"/>
  <circle cx="215" cy="116" r="4" fill="#4c8dd6"/>
  <circle cx="250" cy="104" r="4" fill="#4c8dd6"/>

  <!-- train points -->
  <circle cx="110" cy="192" r="4.5" fill="currentColor"/>
  <circle cx="180" cy="128" r="4.5" fill="currentColor"/>

  <text x="40" y="272" fill="currentColor" font-size="12.5">train RSS = 0</text>
  <text x="40" y="290" fill="#4c8dd6" font-size="12.5">test SSE = 1.75</text>

  <!-- right panel axes -->
  <line class="axis" x1="355" y1="240" x2="615" y2="240"/>
  <line class="axis" x1="355" y1="240" x2="355" y2="60"/>
  <text class="muted" x="608" y="257">x</text>

  <!-- ridge line y = 0.5 + x -->
  <line x1="369" y1="212" x2="586" y2="88" stroke="#e2903a" stroke-width="2"/>
  <text x="522" y="76" fill="#e2903a" font-size="12">ŷ = 0.5 + x</text>

  <!-- train residuals (now nonzero) -->
  <line x1="425" y1="192" x2="425" y2="180" stroke="currentColor" stroke-width="2" opacity="0.6"/>
  <line x1="495" y1="128" x2="495" y2="140" stroke="currentColor" stroke-width="2" opacity="0.6"/>

  <!-- test errors (blue, tiny) -->
  <line x1="390" y1="196" x2="390" y2="200" stroke="#4c8dd6" stroke-width="2"/>
  <line x1="460" y1="164" x2="460" y2="160" stroke="#4c8dd6" stroke-width="2"/>
  <line x1="530" y1="116" x2="530" y2="120" stroke="#4c8dd6" stroke-width="2"/>
  <line x1="565" y1="104" x2="565" y2="100" stroke="#4c8dd6" stroke-width="2"/>

  <!-- test points -->
  <circle cx="390" cy="196" r="4" fill="#4c8dd6"/>
  <circle cx="460" cy="164" r="4" fill="#4c8dd6"/>
  <circle cx="530" cy="116" r="4" fill="#4c8dd6"/>
  <circle cx="565" cy="104" r="4" fill="#4c8dd6"/>

  <!-- train points -->
  <circle cx="425" cy="192" r="4.5" fill="currentColor"/>
  <circle cx="495" cy="128" r="4.5" fill="currentColor"/>

  <text x="355" y="272" fill="currentColor" font-size="12.5">train RSS = 0.18</text>
  <text x="355" y="290" fill="#4c8dd6" font-size="12.5">test SSE = 0.04</text>

  <text class="muted" x="430" y="308">● train (black)&#160;&#160;● test (blue)</text>
</svg>

<svg viewBox="0 0 620 310" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; font-size: 13px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .small { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .done  { fill: currentColor; opacity: 0.45; font-size: 13px; }
    .div   { stroke: currentColor; stroke-opacity: 0.25; stroke-width: 1; }
    .badge-done { fill: none; stroke: currentColor; stroke-opacity: 0.4; }
  </style>
  <text class="muted" x="24" y="36">primal:  min ½‖w‖²   s.t.   y&#7522;(w&#7488;x&#7522; + b) − 1 ≥ 0,   i = 1…n</text>
  <line class="div" x1="24" y1="48" x2="596" y2="48"/>
  <line class="div" x1="352" y1="60" x2="352" y2="296"/>

  <circle class="badge-done" cx="32" cy="76" r="9"/>
  <text x="32" y="80" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.5">1</text>
  <text class="done" x="48" y="80">L = ½‖w‖² − Σ&#7522; α&#7522;[y&#7522;(w&#7488;x&#7522;+b) − 1]</text>

  <circle class="badge-done" cx="32" cy="120" r="9"/>
  <text x="32" y="124" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.5">2</text>
  <text class="done" x="48" y="124">∂L/∂w = 0   →   w = Σ&#7522; α&#7522;y&#7522;x&#7522;</text>

  <circle class="badge-done" cx="32" cy="164" r="9"/>
  <text x="32" y="168" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.5">3</text>
  <text class="done" x="48" y="168">∂L/∂b = 0   →   Σ&#7522; α&#7522;y&#7522; = 0</text>

  <circle cx="32" cy="208" r="9" fill="#e2903a"/>
  <text x="32" y="212" text-anchor="middle" font-size="11" fill="#fff">4</text>
  <text class="label" x="48" y="212" font-size="12">sub 2, 3:  L = Σα&#7522; − ½ΣΣ α&#7522;α&#7527;y&#7522;y&#7527;⟨x&#7522;,x&#7527;⟩</text>

  <text class="label" x="368" y="80" font-weight="bold">step 4 — substitute back</text>
  <text class="muted" x="368" y="108">½‖w‖²  =  ½ΣΣ α&#7522;α&#7527;y&#7522;y&#7527;⟨x&#7522;,x&#7527;⟩</text>
  <text class="muted" x="368" y="132">Σα&#7522;y&#7522;w&#7488;x&#7522;  =  ΣΣ α&#7522;α&#7527;y&#7522;y&#7527;⟨x&#7522;,x&#7527;⟩</text>
  <text class="muted" x="368" y="156">b · Σα&#7522;y&#7522;  =  0    (step 3)</text>
  <line x1="368" y1="151" x2="466" y2="151" stroke="#4c8dd6" stroke-width="1.4"/>
  <text class="muted" x="368" y="186">the two quadratic terms combine:</text>
  <text class="label" x="368" y="208">½ΣΣ − ΣΣ  =  −½ΣΣ</text>
  <text class="muted" x="368" y="236">what is left depends on w, b</text>
  <text class="muted" x="368" y="254">through nothing at all</text>
</svg>

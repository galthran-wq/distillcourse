<svg viewBox="0 0 620 360" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; font-size: 13px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .small { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .node  { stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.2; fill: none; }
    .flow  { stroke: currentColor; stroke-opacity: 0.55; stroke-width: 1.2; fill: none; }
  </style>
  <defs>
    <marker id="pn-arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="currentColor" fill-opacity="0.55"/>
    </marker>
  </defs>

  <!-- input -->
  <rect class="node" x="225" y="300" width="110" height="30" rx="4"/>
  <text class="label" x="280" y="320" text-anchor="middle">new input x</text>

  <!-- kernel comparisons -->
  <line class="flow" x1="268" y1="300" x2="124" y2="224" marker-end="url(#pn-arr)"/>
  <line class="flow" x1="274" y1="300" x2="238" y2="224" marker-end="url(#pn-arr)"/>
  <line class="flow" x1="286" y1="300" x2="356" y2="224" marker-end="url(#pn-arr)"/>
  <line class="flow" x1="292" y1="300" x2="472" y2="224" marker-end="url(#pn-arr)"/>
  <text x="140" y="270" fill="#e2903a" font-size="12">K(x, x&#8321;)</text>
  <text x="230" y="256" fill="#e2903a" font-size="12">K(x, x&#8322;)</text>
  <text x="330" y="256" fill="#e2903a" font-size="12">K(x, x&#8323;)</text>
  <text x="430" y="270" fill="#e2903a" font-size="12">K(x, x&#8324;)</text>

  <!-- support vector row -->
  <rect class="node" x="78" y="192" width="84" height="32" rx="4"/>
  <text class="label" x="120" y="213" text-anchor="middle">x&#8321;</text>
  <rect class="node" x="198" y="192" width="84" height="32" rx="4"/>
  <text class="label" x="240" y="213" text-anchor="middle">x&#8322;</text>
  <rect class="node" x="318" y="192" width="84" height="32" rx="4"/>
  <text class="label" x="360" y="213" text-anchor="middle">x&#8323;</text>
  <rect class="node" x="438" y="192" width="84" height="32" rx="4"/>
  <text class="label" x="480" y="213" text-anchor="middle">x&#8324;</text>
  <text class="muted" x="300" y="182" text-anchor="middle">stored support vectors (α &gt; 0)</text>

  <!-- weighted sum -->
  <line class="flow" x1="120" y1="192" x2="238" y2="128" marker-end="url(#pn-arr)"/>
  <line class="flow" x1="240" y1="192" x2="278" y2="128" marker-end="url(#pn-arr)"/>
  <line class="flow" x1="360" y1="192" x2="322" y2="128" marker-end="url(#pn-arr)"/>
  <line class="flow" x1="480" y1="192" x2="362" y2="128" marker-end="url(#pn-arr)"/>
  <text x="150" y="150" fill="#4c8dd6" font-size="12">α&#8321;y&#8321;</text>
  <text x="238" y="162" fill="#4c8dd6" font-size="12">α&#8322;y&#8322;</text>
  <text x="330" y="162" fill="#4c8dd6" font-size="12">α&#8323;y&#8323;</text>
  <text x="428" y="150" fill="#4c8dd6" font-size="12">α&#8324;y&#8324;</text>

  <rect class="node" x="210" y="96" width="180" height="32" rx="4"/>
  <text class="label" x="300" y="117" text-anchor="middle">f(x) = Σ α&#7522;y&#7522;K(x&#7522;, x) + b</text>

  <line class="flow" x1="300" y1="96" x2="300" y2="56" marker-end="url(#pn-arr)"/>
  <text class="label" x="300" y="40" text-anchor="middle">ŷ = sign f(x)</text>

  <!-- discarded points -->
  <circle cx="562" cy="300" r="4" fill="currentColor" opacity="0.25"/>
  <circle cx="580" cy="312" r="4" fill="currentColor" opacity="0.25"/>
  <circle cx="570" cy="326" r="4" fill="currentColor" opacity="0.25"/>
  <text class="small" x="571" y="270" text-anchor="middle">α = 0 points:</text>
  <text class="small" x="571" y="285" text-anchor="middle">not stored</text>
</svg>

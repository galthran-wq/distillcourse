<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; font-size: 13px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .small { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .axis  { stroke: currentColor; stroke-opacity: 0.35; stroke-width: 1; fill: none; }
    .bnd   { stroke: currentColor; stroke-width: 2; fill: none; }
    .sv    { fill: none; stroke: #5aa46a; stroke-width: 1.6; }
  </style>

  <!-- panel 1: gamma too small -->
  <rect class="axis" x="16" y="24" width="192" height="210" rx="3"/>
  <g>
    <circle cx="104" cy="123" r="4" fill="#4c8dd6"/><circle cx="122" cy="133" r="4" fill="#4c8dd6"/>
    <circle cx="110" cy="141" r="4" fill="#4c8dd6"/><circle cx="118" cy="115" r="4" fill="#4c8dd6"/>
    <circle cx="96" cy="133" r="4" fill="#4c8dd6"/>
    <circle cx="174" cy="129" r="4" fill="#e2903a"/><circle cx="156" cy="173" r="4" fill="#e2903a"/>
    <circle cx="112" cy="191" r="4" fill="#e2903a"/><circle cx="68" cy="173" r="4" fill="#e2903a"/>
    <circle cx="50" cy="129" r="4" fill="#e2903a"/><circle cx="68" cy="85" r="4" fill="#e2903a"/>
    <circle cx="112" cy="67" r="4" fill="#e2903a"/><circle cx="156" cy="85" r="4" fill="#e2903a"/>
    <path class="bnd" d="M 30 200 C 80 160, 140 110, 196 60"/>
    <circle class="sv" cx="68" cy="173" r="7.5"/><circle class="sv" cx="96" cy="133" r="7.5"/><circle class="sv" cx="156" cy="85" r="7.5"/>
  </g>
  <text class="label" x="112" y="256" text-anchor="middle">γ too small</text>
  <text class="small" x="112" y="274" text-anchor="middle">near-linear · train err 23%</text>

  <!-- panel 2: gamma right -->
  <rect class="axis" x="224" y="24" width="192" height="210" rx="3"/>
  <g>
    <circle cx="312" cy="123" r="4" fill="#4c8dd6"/><circle cx="330" cy="133" r="4" fill="#4c8dd6"/>
    <circle cx="318" cy="141" r="4" fill="#4c8dd6"/><circle cx="326" cy="115" r="4" fill="#4c8dd6"/>
    <circle cx="304" cy="133" r="4" fill="#4c8dd6"/>
    <circle cx="382" cy="129" r="4" fill="#e2903a"/><circle cx="364" cy="173" r="4" fill="#e2903a"/>
    <circle cx="320" cy="191" r="4" fill="#e2903a"/><circle cx="276" cy="173" r="4" fill="#e2903a"/>
    <circle cx="258" cy="129" r="4" fill="#e2903a"/><circle cx="276" cy="85" r="4" fill="#e2903a"/>
    <circle cx="320" cy="67" r="4" fill="#e2903a"/><circle cx="364" cy="85" r="4" fill="#e2903a"/>
    <circle class="bnd" cx="320" cy="129" r="42"/>
    <circle class="sv" cx="330" cy="133" r="7.5"/><circle class="sv" cx="304" cy="133" r="7.5"/>
    <circle class="sv" cx="276" cy="173" r="7.5"/><circle class="sv" cx="364" cy="85" r="7.5"/>
  </g>
  <text class="label" x="320" y="256" text-anchor="middle">γ right</text>
  <text class="small" x="320" y="274" text-anchor="middle">follows the ring · train 0%, test 3%</text>

  <!-- panel 3: gamma too large -->
  <rect class="axis" x="432" y="24" width="192" height="210" rx="3"/>
  <g>
    <circle cx="520" cy="123" r="4" fill="#4c8dd6"/><circle cx="538" cy="133" r="4" fill="#4c8dd6"/>
    <circle cx="526" cy="141" r="4" fill="#4c8dd6"/><circle cx="534" cy="115" r="4" fill="#4c8dd6"/>
    <circle cx="512" cy="133" r="4" fill="#4c8dd6"/>
    <circle cx="590" cy="129" r="4" fill="#e2903a"/><circle cx="572" cy="173" r="4" fill="#e2903a"/>
    <circle cx="528" cy="191" r="4" fill="#e2903a"/><circle cx="484" cy="173" r="4" fill="#e2903a"/>
    <circle cx="466" cy="129" r="4" fill="#e2903a"/><circle cx="484" cy="85" r="4" fill="#e2903a"/>
    <circle cx="528" cy="67" r="4" fill="#e2903a"/><circle cx="572" cy="85" r="4" fill="#e2903a"/>
    <circle class="bnd" cx="520" cy="123" r="11"/><circle class="bnd" cx="538" cy="133" r="11"/>
    <circle class="bnd" cx="526" cy="141" r="11"/><circle class="bnd" cx="534" cy="115" r="11"/>
    <circle class="bnd" cx="512" cy="133" r="11"/>
    <circle class="sv" cx="520" cy="123" r="7.5"/><circle class="sv" cx="538" cy="133" r="7.5"/>
    <circle class="sv" cx="526" cy="141" r="7.5"/><circle class="sv" cx="534" cy="115" r="7.5"/>
    <circle class="sv" cx="512" cy="133" r="7.5"/>
  </g>
  <text class="label" x="528" y="256" text-anchor="middle">γ too large</text>
  <text class="small" x="528" y="274" text-anchor="middle">islands per point · train 0%, test 16%</text>
</svg>

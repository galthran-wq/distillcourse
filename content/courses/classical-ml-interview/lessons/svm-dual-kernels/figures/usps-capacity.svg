<svg viewBox="0 0 640 370" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; font-size: 13px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .small { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .axis  { stroke: currentColor; stroke-opacity: 0.3; stroke-width: 1; }
  </style>

  <text class="label" x="90" y="36">feature-space dimension <tspan class="small">(log scale)</tspan></text>
  <line class="axis" x1="90" y1="104" x2="558" y2="104"/>
  <polyline points="90,98.5 168,90.6 246,85.2 324,74.0 402,62.9 480,55.5 558,48.1" fill="none" stroke="#e2903a" stroke-width="2"/>
  <circle cx="90" cy="98.5" r="3.5" fill="#e2903a"/><circle cx="558" cy="48.1" r="3.5" fill="#e2903a"/>
  <text class="small" x="98" y="92">256</text>
  <text class="small" x="500" y="46">~10¹⁶</text>

  <text class="label" x="90" y="136">test error, %</text>
  <line class="axis" x1="90" y1="216" x2="558" y2="216"/>
  <polyline points="90,150.9 168,190.5 246,192.1 324,192.7 402,192.7 480,193.2 558,192.7" fill="none" stroke="#4c8dd6" stroke-width="2"/>
  <circle cx="90" cy="150.9" r="3.5" fill="#4c8dd6"/><circle cx="558" cy="192.7" r="3.5" fill="#4c8dd6"/>
  <text class="small" x="98" y="150">12.0</text>
  <text class="small" x="524" y="188">4.3</text>
  <text class="small" x="230" y="188">4.4</text>

  <text class="label" x="90" y="248">support vectors <tspan class="small">(mean per classifier)</tspan></text>
  <line class="axis" x1="90" y1="330" x2="558" y2="330"/>
  <polyline points="90,269.2 168,291.4 246,285.0 324,279.8 402,276.8 480,273.8 558,272.2" fill="none" stroke="#5aa46a" stroke-width="2"/>
  <circle cx="90" cy="269.2" r="3.5" fill="#5aa46a"/><circle cx="558" cy="272.2" r="3.5" fill="#5aa46a"/>
  <text class="small" x="98" y="266">200</text>
  <text class="small" x="524" y="268">190</text>
  <text class="small" x="160" y="308">127</text>

  <text class="small" x="90" y="352" text-anchor="middle">1</text>
  <text class="small" x="168" y="352" text-anchor="middle">2</text>
  <text class="small" x="246" y="352" text-anchor="middle">3</text>
  <text class="small" x="324" y="352" text-anchor="middle">4</text>
  <text class="small" x="402" y="352" text-anchor="middle">5</text>
  <text class="small" x="480" y="352" text-anchor="middle">6</text>
  <text class="small" x="558" y="352" text-anchor="middle">7</text>
  <text class="muted" x="324" y="368" text-anchor="middle">polynomial degree, USPS digits (Cortes &amp; Vapnik 1995, Table 2)</text>
</svg>

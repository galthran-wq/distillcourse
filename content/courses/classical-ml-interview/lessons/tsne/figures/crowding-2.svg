<svg viewBox="0 0 640 270" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- left panel: high-D space (constant across frames) -->
  <text x="140" y="24" font-size="12" text-anchor="middle" fill="currentColor" opacity="0.55">high-D space (D = 10)</text>
  <circle cx="140" cy="150" r="32" fill="none" stroke="#4c8dd6" stroke-dasharray="3 3" opacity="0.5"/>
  <circle cx="140" cy="150" r="72" fill="none" stroke="#e2903a" stroke-dasharray="3 3" opacity="0.5"/>
  <circle cx="140" cy="150" r="4" fill="currentColor"/>
  <text x="140" y="110" font-size="11" text-anchor="middle" fill="#4c8dd6">radius r</text>
  <text x="140" y="70" font-size="11" text-anchor="middle" fill="#e2903a">radius 2r</text>
  <g fill="#4c8dd6">
    <circle cx="170.1" cy="139.1" r="4"/><circle cx="115.5" cy="129.4" r="4"/><circle cx="134.4" cy="181.5" r="4"/>
  </g>
  <g fill="#e2903a">
    <circle cx="212" cy="150" r="4"/><circle cx="198.2" cy="107.7" r="4"/><circle cx="162.2" cy="81.5" r="4"/>
    <circle cx="117.8" cy="81.5" r="4"/><circle cx="81.8" cy="107.7" r="4"/><circle cx="68" cy="150" r="4"/>
    <circle cx="81.8" cy="192.3" r="4"/><circle cx="117.8" cy="218.5" r="4"/><circle cx="162.2" cy="218.5" r="4"/>
    <circle cx="198.2" cy="192.3" r="4"/>
  </g>
  <text x="140" y="246" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.55">within r: 1 unit of volume</text>
  <text x="140" y="261" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.55">r to 2r: 2¹⁰ − 1 = 1023 units</text>

  <!-- right panel: frame 2, Gaussian kernel crushes the mid shell inward -->
  <text x="470" y="24" font-size="12" text-anchor="middle" fill="currentColor" opacity="0.55">2D map, Gaussian kernel</text>
  <circle cx="470" cy="150" r="32" fill="none" stroke="#4c8dd6" stroke-dasharray="3 3" opacity="0.3"/>
  <circle cx="470" cy="150" r="72" fill="none" stroke="#e2903a" stroke-dasharray="3 3" opacity="0.3"/>
  <circle cx="470" cy="150" r="4" fill="currentColor"/>
  <g fill="#4c8dd6">
    <circle cx="500.1" cy="139.1" r="4"/><circle cx="445.5" cy="129.4" r="4"/><circle cx="464.4" cy="181.5" r="4"/>
  </g>
  <!-- mid-shell points pulled in to radius ~41: jammed against the near shell -->
  <g fill="#e2903a">
    <circle cx="511" cy="150" r="4"/><circle cx="503.2" cy="125.9" r="4"/><circle cx="482.7" cy="111" r="4"/>
    <circle cx="457.3" cy="111" r="4"/><circle cx="436.8" cy="125.9" r="4"/><circle cx="429" cy="150" r="4"/>
    <circle cx="436.8" cy="174.1" r="4"/><circle cx="457.3" cy="189" r="4"/><circle cx="482.7" cy="189" r="4"/>
    <circle cx="503.2" cy="174.1" r="4"/>
  </g>
  <text x="470" y="246" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.55">mid shell crushed onto the near shell:</text>
  <text x="470" y="261" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.55">the map collapses toward its center</text>
</svg>

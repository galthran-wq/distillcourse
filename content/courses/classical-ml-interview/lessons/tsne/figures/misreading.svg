<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrm" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="currentColor"/>
    </marker>
  </defs>
  <!-- the map frame -->
  <rect x="10" y="10" width="470" height="240" rx="6" fill="none" stroke="currentColor" opacity="0.25"/>

  <!-- cluster A: amber, large and spread -->
  <g fill="#e2903a">
    <circle cx="80" cy="120" r="4"/><circle cx="150" cy="112" r="4"/><circle cx="100" cy="158" r="4"/>
    <circle cx="140" cy="178" r="4"/><circle cx="72" cy="168" r="4"/><circle cx="118" cy="140" r="4"/>
    <circle cx="160" cy="148" r="4"/><circle cx="95" cy="196" r="4"/><circle cx="138" cy="200" r="4"/>
    <circle cx="112" cy="105" r="4"/>
  </g>
  <text x="118" y="222" font-size="11" text-anchor="middle" fill="#e2903a">A</text>
  <!-- cluster B: blue, tight -->
  <g fill="#4c8dd6">
    <circle cx="318" cy="72" r="4"/><circle cx="330" cy="64" r="4"/><circle cx="342" cy="74" r="4"/>
    <circle cx="322" cy="86" r="4"/><circle cx="336" cy="88" r="4"/><circle cx="328" cy="78" r="4"/>
    <circle cx="344" cy="86" r="4"/><circle cx="315" cy="82" r="4"/>
  </g>
  <text x="330" y="52" font-size="11" text-anchor="middle" fill="#4c8dd6">B</text>
  <!-- cluster C: green -->
  <g fill="#5aa46a">
    <circle cx="388" cy="180" r="4"/><circle cx="402" cy="174" r="4"/><circle cx="414" cy="184" r="4"/>
    <circle cx="392" cy="196" r="4"/><circle cx="406" cy="200" r="4"/><circle cx="418" cy="192" r="4"/>
    <circle cx="398" cy="186" r="4"/><circle cx="410" cy="178" r="4"/>
  </g>
  <text x="403" y="220" font-size="11" text-anchor="middle" fill="#5aa46a">C</text>

  <!-- struck-out claim 1: density -->
  <text x="30" y="42" font-size="12" fill="currentColor">A is bigger, so more diverse</text>
  <line x1="28" y1="38" x2="196" y2="38" stroke="currentColor" stroke-width="1.5"/>
  <text x="204" y="42" font-size="13" fill="currentColor">✗</text>
  <line x1="100" y1="50" x2="110" y2="95" stroke="currentColor" opacity="0.4" marker-end="url(#arrm)"/>

  <!-- struck-out claim 2: gap -->
  <line x1="172" y1="122" x2="303" y2="92" stroke="currentColor" stroke-dasharray="3 3" opacity="0.4"/>
  <text x="238" y="128" font-size="12" text-anchor="middle" fill="currentColor">gap = dissimilarity</text>
  <line x1="182" y1="124" x2="294" y2="124" stroke="currentColor" stroke-width="1.5"/>
  <text x="302" y="128" font-size="13" fill="currentColor">✗</text>

  <!-- struck-out claim 3: axes -->
  <line x1="30" y1="238" x2="210" y2="238" stroke="currentColor" opacity="0.4" marker-end="url(#arrm)"/>
  <text x="252" y="242" font-size="12" text-anchor="middle" fill="currentColor">x-axis = a feature</text>
  <line x1="200" y1="238" x2="304" y2="238" stroke="currentColor" stroke-width="1.5"/>
  <text x="312" y="242" font-size="13" fill="currentColor">✗</text>

  <!-- the valid claim -->
  <text x="492" y="78" font-size="12" fill="#5aa46a">✓ these points are</text>
  <text x="504" y="94" font-size="12" fill="#5aa46a">mutual neighbors</text>
  <line x1="488" y1="82" x2="356" y2="80" stroke="#5aa46a" opacity="0.6" marker-end="url(#arrm)"/>
  <text x="492" y="130" font-size="11" fill="currentColor" opacity="0.55">the one claim the</text>
  <text x="492" y="145" font-size="11" fill="currentColor" opacity="0.55">map licenses</text>
</svg>

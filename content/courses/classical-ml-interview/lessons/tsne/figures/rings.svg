<svg viewBox="0 0 640 250" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- panel 1: data -->
  <text x="105" y="26" font-size="12" text-anchor="middle" fill="currentColor" opacity="0.55">data: nested rings</text>
  <!-- inner ring (amber) -->
  <g fill="#e2903a">
    <circle cx="131" cy="135" r="4"/><circle cx="123.4" cy="153.4" r="4"/>
    <circle cx="105" cy="161" r="4"/><circle cx="86.6" cy="153.4" r="4"/>
    <circle cx="79" cy="135" r="4"/><circle cx="86.6" cy="116.6" r="4"/>
    <circle cx="105" cy="109" r="4"/><circle cx="123.4" cy="116.6" r="4"/>
  </g>
  <!-- outer ring (blue) -->
  <g fill="#4c8dd6">
    <circle cx="163" cy="135" r="4"/><circle cx="155.2" cy="164" r="4"/>
    <circle cx="134" cy="185.2" r="4"/><circle cx="105" cy="193" r="4"/>
    <circle cx="76" cy="185.2" r="4"/><circle cx="54.8" cy="164" r="4"/>
    <circle cx="47" cy="135" r="4"/><circle cx="54.8" cy="106" r="4"/>
    <circle cx="76" cy="84.8" r="4"/><circle cx="105" cy="76.8" r="4"/>
    <circle cx="134" cy="84.8" r="4"/><circle cx="155.2" cy="106" r="4"/>
  </g>

  <!-- panel 2: PCA to 1D -->
  <text x="325" y="26" font-size="12" text-anchor="middle" fill="currentColor" opacity="0.55">PCA to 1D: classes mix</text>
  <line x1="235" y1="140" x2="415" y2="140" stroke="currentColor" opacity="0.4"/>
  <!-- outer projections (blue), x-components scaled 1.3 around 325 -->
  <g fill="#4c8dd6">
    <circle cx="400.4" cy="137" r="4"/><circle cx="390.3" cy="144" r="4"/>
    <circle cx="362.7" cy="136" r="4"/><circle cx="325" cy="145" r="4"/>
    <circle cx="287.3" cy="136" r="4"/><circle cx="259.7" cy="144" r="4"/>
    <circle cx="249.6" cy="137" r="4"/><circle cx="259.7" cy="133" r="4"/>
    <circle cx="287.3" cy="146" r="4"/><circle cx="325" cy="134" r="4"/>
    <circle cx="362.7" cy="145" r="4"/><circle cx="390.3" cy="134" r="4"/>
  </g>
  <!-- inner projections (amber), overlap the middle of the outer range -->
  <g fill="#e2903a">
    <circle cx="358.8" cy="140" r="4"/><circle cx="348.9" cy="146" r="4"/>
    <circle cx="325" cy="140" r="4"/><circle cx="301.1" cy="146" r="4"/>
    <circle cx="291.2" cy="140" r="4"/><circle cx="301.1" cy="134" r="4"/>
    <circle cx="325" cy="129" r="4"/><circle cx="348.9" cy="134" r="4"/>
  </g>
  <text x="325" y="185" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.55">inner range lands inside outer:</text>
  <text x="325" y="200" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.55">apparent neighbors from opposite rings</text>

  <!-- panel 3: t-SNE -->
  <text x="540" y="26" font-size="12" text-anchor="middle" fill="currentColor" opacity="0.55">t-SNE: two islands</text>
  <g fill="#e2903a">
    <circle cx="505" cy="98" r="4"/><circle cx="521" cy="106" r="4"/>
    <circle cx="493" cy="112" r="4"/><circle cx="511" cy="120" r="4"/>
    <circle cx="527" cy="92" r="4"/><circle cx="497" cy="94" r="4"/>
    <circle cx="516" cy="88" r="4"/><circle cx="503" cy="126" r="4"/>
  </g>
  <g fill="#4c8dd6">
    <circle cx="580" cy="178" r="4"/><circle cx="596" cy="186" r="4"/>
    <circle cx="568" cy="192" r="4"/><circle cx="586" cy="200" r="4"/>
    <circle cx="602" cy="172" r="4"/><circle cx="572" cy="174" r="4"/>
    <circle cx="591" cy="168" r="4"/><circle cx="578" cy="206" r="4"/>
    <circle cx="600" cy="198" r="4"/><circle cx="564" cy="182" r="4"/>
    <circle cx="608" cy="185" r="4"/><circle cx="588" cy="212" r="4"/>
  </g>
  <text x="540" y="238" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.55">every point's neighbors kept; rings drift apart</text>
</svg>

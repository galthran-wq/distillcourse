<svg viewBox="0 0 640 240" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="currentColor"/>
    </marker>
  </defs>
  <!-- axes -->
  <line x1="60" y1="190" x2="605" y2="190" stroke="currentColor" opacity="0.6" marker-end="url(#arr)"/>
  <line x1="60" y1="190" x2="60" y2="28" stroke="currentColor" opacity="0.6" marker-end="url(#arr)"/>
  <text x="600" y="182" font-size="11" text-anchor="end" fill="currentColor" opacity="0.55">map distance d</text>
  <text x="68" y="36" font-size="11" fill="currentColor" opacity="0.55">similarity</text>
  <text x="52" y="44" font-size="11" text-anchor="end" fill="currentColor" opacity="0.55">1</text>
  <text x="52" y="164" font-size="11" text-anchor="end" fill="currentColor" opacity="0.55">0.2</text>

  <!-- Gaussian curve (blue) -->
  <polyline fill="none" stroke="#4c8dd6" stroke-width="2" points="60,40 92.5,49 125,73 157.5,105 190,135 222.5,159 255,174 287.5,183 320,187 385,190 450,190 580,190"/>
  <text x="150" y="66" font-size="12" fill="#4c8dd6">Gaussian exp(−d²)</text>

  <!-- Student-t curve (amber) -->
  <polyline fill="none" stroke="#e2903a" stroke-width="2" points="60,40 92.5,49 125,70 157.5,94 190,115 222.5,132 255,144 287.5,153 320,160 385,169 450,175 515,179 580,181"/>
  <text x="392" y="150" font-size="12" fill="#e2903a">Student-t 1/(1+d²)</text>
  <text x="500" y="169" font-size="11" fill="#e2903a" opacity="0.8">heavy tail</text>

  <!-- construction: same similarity 0.2, two distances -->
  <line x1="60" y1="160" x2="320" y2="160" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5"/>
  <line x1="225" y1="160" x2="225" y2="190" stroke="#4c8dd6" stroke-dasharray="3 3" opacity="0.7"/>
  <line x1="320" y1="160" x2="320" y2="190" stroke="#e2903a" stroke-dasharray="3 3" opacity="0.7"/>
  <text x="218" y="203" font-size="11" text-anchor="middle" fill="#4c8dd6">d = 1.27</text>
  <text x="330" y="203" font-size="11" text-anchor="middle" fill="#e2903a">d = 2.0</text>
  <line x1="244" y1="211" x2="303" y2="211" stroke="currentColor" opacity="0.7" marker-end="url(#arr)"/>
  <text x="273" y="228" font-size="11.5" text-anchor="middle" fill="currentColor">same similarity, larger map distance</text>
</svg>

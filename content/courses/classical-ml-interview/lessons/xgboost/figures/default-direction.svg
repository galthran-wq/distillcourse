<svg viewBox="0 0 640 270" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .title { fill: currentColor; font-size: 12.5px; font-weight: bold; }
    .node  { fill: none; stroke: currentColor; stroke-opacity: 0.55; stroke-width: 1.4; }
    .txt   { fill: currentColor; font-size: 11.5px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .edge  { stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.2; }
    .miss  { stroke: #e2903a; stroke-width: 2; stroke-dasharray: 5 3; fill: none; }
    .hot   { fill: #e2903a; }
    .ok    { fill: #5aa46a; }
    .okbox { fill: none; stroke: #5aa46a; stroke-width: 2; }
  </style>

  <text class="title" x="160" y="24" text-anchor="middle">try 1: missing block &#8594; left</text>
  <rect class="node" x="110" y="40" width="100" height="26" rx="5"/>
  <text class="txt" x="160" y="57" text-anchor="middle">x &lt; 4 ?</text>
  <line class="edge" x1="134" y1="66" x2="90" y2="120"/>
  <line class="edge" x1="186" y1="66" x2="230" y2="120"/>
  <rect class="node" x="55" y="120" width="70" height="26" rx="5"/>
  <text class="txt" x="90" y="137" text-anchor="middle">left</text>
  <rect class="node" x="195" y="120" width="70" height="26" rx="5"/>
  <text class="txt" x="230" y="137" text-anchor="middle">right</text>
  <path class="miss" d="M 40 60 C 40 90, 60 105, 80 118"/>
  <text class="hot" x="30" y="48" font-size="11">missing</text>
  <text class="muted" x="160" y="180" text-anchor="middle">objective score &#8722;3.1</text>

  <text class="title" x="480" y="24" text-anchor="middle">try 2: missing block &#8594; right</text>
  <rect class="node" x="430" y="40" width="100" height="26" rx="5"/>
  <text class="txt" x="480" y="57" text-anchor="middle">x &lt; 4 ?</text>
  <line class="edge" x1="454" y1="66" x2="410" y2="120"/>
  <line class="edge" x1="506" y1="66" x2="550" y2="120"/>
  <rect class="node" x="375" y="120" width="70" height="26" rx="5"/>
  <text class="txt" x="410" y="137" text-anchor="middle">left</text>
  <rect class="node" x="515" y="120" width="70" height="26" rx="5"/>
  <text class="txt" x="550" y="137" text-anchor="middle">right</text>
  <path class="miss" d="M 600 60 C 600 90, 580 105, 560 118"/>
  <text class="hot" x="580" y="48" font-size="11">missing</text>
  <text class="muted" x="480" y="180" text-anchor="middle">objective score &#8722;4.6, lower = better</text>
  <rect class="okbox" x="388" y="192" width="184" height="26" rx="5"/>
  <text class="ok" x="480" y="209" text-anchor="middle" font-weight="bold">kept as the default direction</text>

  <text class="muted" x="320" y="250" text-anchor="middle">only present values are scanned; the missing block is routed wholesale both ways and the node stores the winner</text>
</svg>

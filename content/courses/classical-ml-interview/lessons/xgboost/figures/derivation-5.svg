<svg viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; font-size: 13px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11.5px; }
    .math  { fill: currentColor; font-size: 13.5px; }
    .g     { fill: #e2903a; }
    .h     { fill: #4c8dd6; }
    .badgehot { fill: none; stroke: #e2903a; stroke-width: 2; }
    .badge { fill: none; stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.4; }
    .num   { fill: currentColor; opacity: 0.7; font-size: 12px; }
    .numhot { fill: #e2903a; font-size: 12px; font-weight: bold; }
  </style>
  <text class="label" x="320" y="28" text-anchor="middle" font-weight="bold">From the loss to the split gain in five moves</text>
  <circle class="badge" cx="40" cy="64" r="11"/>
  <text class="num" x="40" y="68" text-anchor="middle">1</text>
  <text class="math" x="62" y="68">obj⁽ᵗ⁾ ≈ Σᵢ [ <tspan class="g">gᵢ</tspan> f(xᵢ) + ½ <tspan class="h">hᵢ</tspan> f(xᵢ)² ] + γT + ½λ Σⱼ wⱼ²</text>
  <text class="muted" x="62" y="90">Taylor to second order around ŷ⁽ᵗ⁻¹⁾:  <tspan class="g">gᵢ = ∂l</tspan>,  <tspan class="h">hᵢ = ∂²l</tspan>;  constant terms dropped</text>
  <circle class="badge" cx="40" cy="130" r="11"/>
  <text class="num" x="40" y="134" text-anchor="middle">2</text>
  <text class="math" x="62" y="134">= Σⱼ [ <tspan class="g">Gⱼ</tspan> wⱼ + ½ (<tspan class="h">Hⱼ</tspan> + λ) wⱼ² ] + γT</text>
  <text class="muted" x="62" y="156">group by leaf: on leaf j the tree is constant, f(xᵢ) = wⱼ;  <tspan class="g">Gⱼ = Σ gᵢ</tspan>,  <tspan class="h">Hⱼ = Σ hᵢ</tspan> over the leaf</text>
  <circle class="badge" cx="40" cy="196" r="11"/>
  <text class="num" x="40" y="200" text-anchor="middle">3</text>
  <text class="math" x="62" y="200">wⱼ* = −<tspan class="g">Gⱼ</tspan> / (<tspan class="h">Hⱼ</tspan> + λ)</text>
  <text class="muted" x="62" y="222">each leaf is an independent parabola in wⱼ; the vertex is the closed-form weight</text>
  <path d="M 470 176 Q 528 268 586 176" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.6"/>
  <line x1="462" y1="234" x2="594" y2="234" stroke="currentColor" opacity="0.4"/>
  <circle cx="528" cy="222" r="4" fill="#e2903a"/>
  <line x1="528" y1="222" x2="528" y2="234" stroke="#e2903a" stroke-dasharray="3 3" opacity="0.7"/>
  <text class="muted" x="528" y="248" text-anchor="middle">w*</text>
  <text class="muted" x="600" y="238">w</text>
  <circle class="badge" cx="40" cy="262" r="11"/>
  <text class="num" x="40" y="266" text-anchor="middle">4</text>
  <text class="math" x="62" y="266">obj* = −½ Σⱼ <tspan class="g">Gⱼ</tspan>²/(<tspan class="h">Hⱼ</tspan> + λ) + γT</text>
  <text class="muted" x="62" y="288">the structure score: every wⱼ* plugged back in — one number rating the tree shape, lower = better</text>
  <circle class="badgehot" cx="40" cy="330" r="11"/>
  <text class="numhot" x="40" y="334" text-anchor="middle">5</text>
  <text class="math" x="62" y="334">Gain = ½[ <tspan class="g">G<tspan dy="3.5" font-size="9.5">L</tspan><tspan dy="-3.5">​</tspan></tspan>²/(<tspan class="h">H<tspan dy="3.5" font-size="9.5">L</tspan><tspan dy="-3.5">​</tspan></tspan>+λ) + <tspan class="g">G<tspan dy="3.5" font-size="9.5">R</tspan><tspan dy="-3.5">​</tspan></tspan>²/(<tspan class="h">H<tspan dy="3.5" font-size="9.5">R</tspan><tspan dy="-3.5">​</tspan></tspan>+λ) − <tspan class="g">G</tspan>²/(<tspan class="h">H</tspan>+λ) ] − γ</text>
  <text class="muted" x="62" y="356">score before the split minus score after: split only if the gain beats the γ toll of the extra leaf</text>
</svg>

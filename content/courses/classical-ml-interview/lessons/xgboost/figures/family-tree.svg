<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .node  { fill: none; stroke: currentColor; stroke-opacity: 0.55; stroke-width: 1.4; }
    .hotnode { fill: none; stroke: #e2903a; stroke-width: 2; }
    .name  { fill: currentColor; font-size: 12.5px; font-weight: bold; }
    .yr    { fill: currentColor; opacity: 0.55; font-size: 10.5px; }
    .lab   { fill: currentColor; opacity: 0.8; font-size: 11px; }
    .edge  { stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.4; }
  </style>

  <rect class="node" x="80" y="16" width="150" height="30" rx="6"/>
  <text class="name" x="155" y="36" text-anchor="middle">AdaBoost <tspan class="yr">1997</tspan></text>

  <line class="edge" x1="155" y1="46" x2="155" y2="90"/>
  <path d="M 151 84 L 155 92 L 159 84 Z" fill="currentColor" fill-opacity="0.5"/>
  <text class="lab" x="172" y="64">any differentiable loss: fit trees to the negative gradient;</text>
  <text class="lab" x="172" y="79">exponential loss becomes the special case</text>

  <rect class="node" x="80" y="92" width="150" height="30" rx="6"/>
  <text class="name" x="155" y="112" text-anchor="middle">GBM <tspan class="yr">2001</tspan></text>

  <line class="edge" x1="155" y1="122" x2="155" y2="166"/>
  <path d="M 151 160 L 155 168 L 159 160 Z" fill="currentColor" fill-opacity="0.5"/>
  <text class="lab" x="172" y="140">Newton step (g, h) + explicit penalty &#947;T + &#189;&#955;&#8214;w&#8214;&#178;</text>
  <text class="lab" x="172" y="155">+ sparsity-aware splits + the systems layer</text>

  <rect class="hotnode" x="80" y="168" width="150" height="30" rx="6"/>
  <text class="name" x="155" y="188" text-anchor="middle">XGBoost <tspan class="yr">2016</tspan></text>

  <line class="edge" x1="130" y1="198" x2="105" y2="252"/>
  <path d="M 102 246 L 104 254 L 109 249 Z" fill="currentColor" fill-opacity="0.5"/>
  <line class="edge" x1="180" y1="198" x2="330" y2="252"/>
  <path d="M 323 250 L 332 253 L 328 245 Z" fill="currentColor" fill-opacity="0.5"/>

  <rect class="node" x="30" y="254" width="155" height="30" rx="6"/>
  <text class="name" x="107" y="274" text-anchor="middle">LightGBM <tspan class="yr">2017</tspan></text>
  <text class="lab" x="30" y="306">histogram splits, leaf-wise</text>
  <text class="lab" x="30" y="320">growth, GOSS sampling</text>

  <rect class="node" x="260" y="254" width="150" height="30" rx="6"/>
  <text class="name" x="335" y="274" text-anchor="middle">CatBoost <tspan class="yr">2018</tspan></text>
  <text class="lab" x="260" y="306">ordered target statistics,</text>
  <text class="lab" x="260" y="320">ordered boosting</text>

  <text class="lab" x="450" y="264">each edge = the one idea added;</text>
  <text class="lab" x="450" y="279">everything upstream is inherited</text>
</svg>

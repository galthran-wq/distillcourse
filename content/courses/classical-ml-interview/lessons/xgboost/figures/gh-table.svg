<svg viewBox="0 0 640 214" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12.5">
  <style>
    .head  { fill: currentColor; opacity: 0.55; font-size: 11.5px; }
    .cell  { fill: currentColor; font-size: 12.5px; }
    .hot   { fill: #e2903a; }
    .g     { fill: #e2903a; }
    .h     { fill: #4c8dd6; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
  </style>

  <text class="head" x="28" y="30">loss</text>
  <text class="head" x="120" y="30">l(y, &#375;)</text>
  <text class="head" x="318" y="30">g&#7522; = &#8706;l/&#8706;&#375;</text>
  <text class="head" x="418" y="30">h&#7522; = &#8706;&#178;l/&#8706;&#375;&#178;</text>
  <text class="head" x="518" y="30">leaf w* at &#955; = 0</text>
  <line x1="24" y1="40" x2="616" y2="40" stroke="currentColor" opacity="0.4"/>

  <text class="cell" x="28" y="72">squared</text>
  <text class="cell" x="120" y="72">&#189;(&#375; &#8722; y)&#178;</text>
  <text class="cell g" x="318" y="72">&#375; &#8722; y</text>
  <text class="cell h" x="418" y="72">1</text>
  <text class="cell" x="518" y="72">mean residual</text>
  <text class="muted" x="120" y="94">the expansion is exact: no error term</text>
  <text class="hot" x="360" y="94" font-size="11.5">= GBM&#8217;s leaf: gradient boosting is the h &#8801; 1, &#955; = 0 special case</text>
  <line x1="24" y1="108" x2="616" y2="108" stroke="currentColor" opacity="0.25"/>

  <text class="cell" x="28" y="140">logistic</text>
  <text class="cell" x="120" y="140">&#8722;y ln p &#8722; (1&#8722;y) ln(1&#8722;p)</text>
  <text class="cell g" x="318" y="140">p &#8722; y</text>
  <text class="cell h" x="418" y="140">p(1&#8722;p)</text>
  <text class="cell" x="518" y="140">&#931;(y&#8722;p) / &#931;p(1&#8722;p)</text>
  <text class="muted" x="120" y="162">p = &#963;(&#375;), the score &#375; lives in log-odds space</text>
  <text class="muted" x="360" y="162">= one Newton step: what GBM&#8217;s log-loss leaves already take</text>
  <line x1="24" y1="176" x2="616" y2="176" stroke="currentColor" opacity="0.4"/>

  <text class="muted" x="28" y="200">every quantity below (G, H, w*, Gain) is built from these two derivatives, summed over a leaf</text>
</svg>

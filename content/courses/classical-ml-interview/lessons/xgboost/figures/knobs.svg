<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="11.5">
  <style>
    .title { fill: currentColor; font-size: 12.5px; font-weight: bold; }
    .leaf  { fill: none; stroke: #e2903a; stroke-width: 1.6; }
    .node  { fill: none; stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.4; }
    .val   { fill: #e2903a; font-size: 12px; font-weight: bold; }
    .txt   { fill: currentColor; font-size: 11px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 10.5px; }
    .edge  { stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.2; }
    .dead  { stroke: currentColor; stroke-opacity: 0.3; stroke-width: 1.2; stroke-dasharray: 4 3; }
  </style>

  <!-- panel A: lambda 0, gamma 0 -->
  <text class="title" x="106" y="26" text-anchor="middle">&#955; = 0, &#947; = 0</text>
  <rect class="node" x="76" y="44" width="60" height="24" rx="5"/>
  <text class="txt" x="106" y="60" text-anchor="middle">root</text>
  <line class="edge" x1="92" y1="68" x2="56" y2="118"/>
  <line class="edge" x1="120" y1="68" x2="156" y2="108"/>
  <text class="muted" x="130" y="94">gain 8.33</text>
  <rect class="leaf" x="22" y="118" width="66" height="24" rx="5"/>
  <text class="val" x="55" y="134" text-anchor="middle">+1.50</text>
  <rect class="node" x="128" y="108" width="56" height="24" rx="5"/>
  <text class="txt" x="156" y="124" text-anchor="middle">node</text>
  <line class="edge" x1="142" y1="132" x2="120" y2="182"/>
  <line class="edge" x1="170" y1="132" x2="192" y2="182"/>
  <text class="muted" x="176" y="160">gain 0.52</text>
  <rect class="leaf" x="86" y="182" width="66" height="24" rx="5"/>
  <text class="val" x="119" y="198" text-anchor="middle">&#8722;1.00</text>
  <rect class="leaf" x="162" y="182" width="66" height="24" rx="5"/>
  <text class="val" x="195" y="198" text-anchor="middle">&#8722;2.25</text>
  <text class="muted" x="106" y="244" text-anchor="middle">full-size leaf weights,</text>
  <text class="muted" x="106" y="258" text-anchor="middle">every positive-gain split kept</text>

  <!-- panel B: lambda 5, gamma 0 -->
  <text class="title" x="320" y="26" text-anchor="middle">&#955; = 0.5, &#947; = 0</text>
  <rect class="node" x="290" y="44" width="60" height="24" rx="5"/>
  <text class="txt" x="320" y="60" text-anchor="middle">root</text>
  <line class="edge" x1="306" y1="68" x2="270" y2="118"/>
  <line class="edge" x1="334" y1="68" x2="370" y2="108"/>
  <text class="muted" x="344" y="94">gain 7.14</text>
  <rect class="leaf" x="236" y="118" width="66" height="24" rx="5"/>
  <text class="val" x="269" y="134" text-anchor="middle">+1.29</text>
  <rect class="node" x="342" y="108" width="56" height="24" rx="5"/>
  <text class="txt" x="370" y="124" text-anchor="middle">node</text>
  <line class="edge" x1="356" y1="132" x2="334" y2="182"/>
  <line class="edge" x1="384" y1="132" x2="406" y2="182"/>
  <text class="muted" x="390" y="160">gain 0.06</text>
  <rect class="leaf" x="300" y="182" width="66" height="24" rx="5"/>
  <text class="val" x="333" y="198" text-anchor="middle">&#8722;0.67</text>
  <rect class="leaf" x="376" y="182" width="66" height="24" rx="5"/>
  <text class="val" x="409" y="198" text-anchor="middle">&#8722;1.80</text>
  <text class="muted" x="320" y="244" text-anchor="middle">same shape, every weight</text>
  <text class="muted" x="320" y="258" text-anchor="middle">shrunk by H/(H+&#955;); gains damped too</text>

  <!-- panel C: lambda 0, gamma 2 -->
  <text class="title" x="534" y="26" text-anchor="middle">&#955; = 0, &#947; = 2</text>
  <rect class="node" x="504" y="44" width="60" height="24" rx="5"/>
  <text class="txt" x="534" y="60" text-anchor="middle">root</text>
  <line class="edge" x1="520" y1="68" x2="484" y2="118"/>
  <line class="edge" x1="548" y1="68" x2="584" y2="118"/>
  <text class="muted" x="556" y="94">8.33 &#8722; &#947; &gt; 0</text>
  <rect class="leaf" x="450" y="118" width="66" height="24" rx="5"/>
  <text class="val" x="483" y="134" text-anchor="middle">+1.50</text>
  <rect class="leaf" x="550" y="118" width="66" height="24" rx="5"/>
  <text class="val" x="583" y="134" text-anchor="middle">&#8722;1.83</text>
  <line class="dead" x1="569" y1="142" x2="547" y2="192"/>
  <line class="dead" x1="597" y1="142" x2="619" y2="192"/>
  <rect x="516" y="192" width="60" height="22" rx="5" fill="none" stroke="currentColor" stroke-opacity="0.3" stroke-dasharray="4 3"/>
  <rect x="586" y="192" width="48" height="22" rx="5" fill="none" stroke="currentColor" stroke-opacity="0.3" stroke-dasharray="4 3"/>
  <text class="muted" x="534" y="244" text-anchor="middle">sub-split gain 0.52 &lt; &#947; = 2:</text>
  <text class="muted" x="534" y="258" text-anchor="middle">pruned away, one leaf remains</text>
</svg>

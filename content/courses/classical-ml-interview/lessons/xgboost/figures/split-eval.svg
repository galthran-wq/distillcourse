<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12.5">
  <style>
    .label { fill: currentColor; font-size: 12.5px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .math  { fill: currentColor; font-size: 12.5px; }
    .hot   { fill: #e2903a; }
    .ok    { fill: #5aa46a; }
    .sub   { font-size: 9px; }
  </style>

  <line x1="60" y1="52" x2="600" y2="52" stroke="currentColor" opacity="0.4"/>
  <text class="muted" x="606" y="56">x</text>
  <circle cx="80" cy="52" r="4" fill="currentColor"/>
  <circle cx="180" cy="52" r="4" fill="currentColor"/>
  <circle cx="280" cy="52" r="4" fill="currentColor"/>
  <circle cx="380" cy="52" r="4" fill="currentColor"/>
  <circle cx="480" cy="52" r="4" fill="currentColor"/>
  <circle cx="580" cy="52" r="4" fill="currentColor"/>
  <line x1="330" y1="30" x2="330" y2="120" stroke="#e2903a" stroke-width="2" stroke-dasharray="4 3"/>
  <text class="hot" x="330" y="22" text-anchor="middle" font-size="11.5">candidate split</text>

  <text class="muted" x="40" y="82">g&#7522;</text>
  <text class="label" x="80" y="82" text-anchor="middle">&#8722;2</text>
  <text class="label" x="180" y="82" text-anchor="middle">&#8722;1.5</text>
  <text class="label" x="280" y="82" text-anchor="middle">&#8722;1</text>
  <text class="label" x="380" y="82" text-anchor="middle">1</text>
  <text class="label" x="480" y="82" text-anchor="middle">2</text>
  <text class="label" x="580" y="82" text-anchor="middle">2.5</text>
  <text class="muted" x="40" y="102">h&#7522;</text>
  <text class="label" x="80" y="102" text-anchor="middle">1</text>
  <text class="label" x="180" y="102" text-anchor="middle">1</text>
  <text class="label" x="280" y="102" text-anchor="middle">1</text>
  <text class="label" x="380" y="102" text-anchor="middle">1</text>
  <text class="label" x="480" y="102" text-anchor="middle">1</text>
  <text class="label" x="580" y="102" text-anchor="middle">1</text>

  <rect x="66" y="120" width="230" height="30" rx="5" fill="none" stroke="currentColor" stroke-opacity="0.4"/>
  <text class="math" x="88" y="140">G<tspan class="sub" dy="3">L</tspan><tspan dy="-3">&#8203;</tspan> = &#8722;4.5&#160;&#160;&#160;H<tspan class="sub" dy="3">L</tspan><tspan dy="-3">&#8203;</tspan> = 3</text>
  <rect x="364" y="120" width="230" height="30" rx="5" fill="none" stroke="currentColor" stroke-opacity="0.4"/>
  <text class="math" x="392" y="140">G<tspan class="sub" dy="3">R</tspan><tspan dy="-3">&#8203;</tspan> = 5.5&#160;&#160;&#160;H<tspan class="sub" dy="3">R</tspan><tspan dy="-3">&#8203;</tspan> = 3</text>
  <text class="math" x="66" y="176">parent: G = 1,&#160;&#160;H = 6</text>
  <text class="muted" x="420" y="176">penalties: &#955; = 1,&#160;&#160;&#947; = 1</text>

  <text class="math" x="66" y="210">G<tspan class="sub" dy="3">L</tspan><tspan dy="-3">&#8203;</tspan>&#178;/(H<tspan class="sub" dy="3">L</tspan><tspan dy="-3">&#8203;</tspan>+&#955;) = 20.25/4 = 5.0625</text>
  <text class="math" x="290" y="210">G<tspan class="sub" dy="3">R</tspan><tspan dy="-3">&#8203;</tspan>&#178;/(H<tspan class="sub" dy="3">R</tspan><tspan dy="-3">&#8203;</tspan>+&#955;) = 30.25/4 = 7.5625</text>
  <text class="math" x="514" y="210">G&#178;/(H+&#955;) = 1/7</text>

  <text class="math" x="66" y="246">Gain = &#189;(5.0625 + 7.5625 &#8722; 0.1429) &#8722; &#947; = 6.24 &#8722; 1 = <tspan class="hot" font-weight="bold">5.24</tspan></text>

  <rect x="66" y="266" width="180" height="30" rx="5" fill="none" stroke="#5aa46a" stroke-width="2"/>
  <text class="ok" x="82" y="286" font-weight="bold">5.24 &gt; 0 &#8594; split</text>
  <text class="muted" x="262" y="286">children take w<tspan class="sub" dy="3">L</tspan><tspan dy="-3">&#8203;</tspan>* = 4.5/4 = 1.125,&#160;&#160;w<tspan class="sub" dy="3">R</tspan><tspan dy="-3">&#8203;</tspan>* = &#8722;5.5/4 = &#8722;1.375</text>
</svg>

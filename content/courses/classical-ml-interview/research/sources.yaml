# Research canon for classical-ml-interview.
# Compiled July 2026 from a source-reading swarm; chapter/section pointers in
# the per-lesson briefs are verified against the actual texts by the readers.
# "role" = which lessons/modules the source grounds.

sources:
  - title: "The Elements of Statistical Learning, 2nd ed. (12th printing, 2017)"
    author: "T. Hastie, R. Tibshirani, J. Friedman"
    url: "https://hastie.su.domains/ElemStatLearn/"
    kind: textbook
    role: >
      The rigorous backbone. Grounds bias-variance (7.3, Fig 7.2), Gauss-Markov
      (3.2.2), ridge/lasso incl. the SVD-shrinkage view and Fig 3.11 geometry
      (3.4), SVM primal/dual/KKT and kernels (12.2-12.3), AdaBoost =
      forward-stagewise exponential loss (10.1-10.5), gradient boosting
      (10.9-10.12, Table 10.2), EM worked mixture (8.5), bagging (8.7), random
      forests (ch. 15), PCA via SVD (14.5.1), curse of dimensionality (2.5),
      decision theory (2.4), CV/bootstrap (7.10-7.11).
    access: >
      Free. Official author PDF via hastie.su.domains download page (764 pp,
      corrected 12th printing). Full text read by the swarm.

  - title: "An Introduction to Statistical Learning with Applications in Python (2023)"
    author: "G. James, D. Witten, T. Hastie, R. Tibshirani, J. Taylor"
    url: "https://www.statlearning.com/"
    kind: textbook
    role: >
      The accessible layer and worked-dataset supply. Grounds bias-variance
      curves (2.2.2), regression diagnostics (ch. 3 potential problems),
      CV/bootstrap incl. LOOCV shortcut and 0.632 (ch. 5), subset selection /
      ridge / lasso with the Credit running example (ch. 6), trees with the
      Hitters example and pruning (8.1), bagging/RF/boosting comparison (8.2),
      clustering and PCA (ch. 12).
    access: >
      Free. Official PDF at statlearning.com (613 pp, first printing July
      2023). Full text read by the swarm.

  - title: "Pattern Recognition and Machine Learning (2006)"
    author: "C. M. Bishop"
    url: "https://www.microsoft.com/en-us/research/publication/pattern-recognition-machine-learning/"
    kind: textbook
    role: >
      Probabilistic derivations. Grounds MLE/MAP as curve fitting (1.2.5-1.2.6),
      decision theory and base rates (1.5), curse of dimensionality (1.4),
      generative classifiers -> sigmoid (4.2), kernels via dual representations
      (6.1-6.2), SVM max margin (7.1), K-means on Old Faithful (9.1), EM for
      GMM and the general KL/lower-bound derivation (9.2-9.4), PCA (12.1).
    access: >
      Free. Author-endorsed PDF from Microsoft Research (758 pp). Full text
      read by the swarm.

  - title: "Probabilistic Machine Learning: An Introduction (2022, draft 2025)"
    author: "K. P. Murphy"
    url: "https://probml.github.io/pml-book/book1.html"
    kind: textbook
    role: >
      Modern probabilistic reference and the evaluation-metrics anchor. Grounds
      decision theory / ROC / PR / F-beta / proper scoring / calibration
      (5.1), Bayes-rule worked examples (2.3), naive Bayes incl. MNIST
      templates (9.3), LDA <-> logistic connection and generative-vs-
      discriminative trade-offs (9.2, 9.4), logistic regression (ch. 10),
      ridge/lasso (ch. 11), GLMs with the insurance worked example (ch. 12),
      trees/bagging/boosting (ch. 18), PCA (20.1), clustering (ch. 21).
    access: >
      Free. CC-BY-NC-ND draft PDF from author's GitHub releases (860 pp).
      Full text read by the swarm.

  - title: "CS229 Lecture Notes (June 2023)"
    author: "A. Ng, T. Ma (Stanford)"
    url: "https://cs229.stanford.edu/main_notes.pdf"
    kind: lecture-notes
    role: >
      The whiteboard-derivation register interviews mimic. Grounds OLS via
      matrix calculus (1.2), probabilistic interpretation (1.3), logistic
      gradient (2.1), GLMs (ch. 3), GDA and naive Bayes with the Laplace-
      smoothing failure case (ch. 4), kernels (ch. 5), SVM primal/dual/SMO
      (ch. 6), bias-variance and double descent (ch. 8), k-means coordinate
      descent (ch. 10), EM via Jensen/ELBO (ch. 11), PCA via Lagrange (ch. 12).
    access: >
      Free. Official PDF (227 pp, June 11 2023). Full text read by the swarm.

  - title: "CS4780 Machine Learning for Intelligent Systems, lecture notes (2018fa)"
    author: "K. Q. Weinberger (Cornell)"
    url: "https://www.cs.cornell.edu/courses/cs4780/2018fa/lectures/"
    kind: lecture-notes
    role: >
      Proof-first compact notes. Grounds k-NN / Cover-Hart / curse numbers
      (lec 2), MLE/MAP coin-toss arc (lec 4), naive Bayes generative story
      (lec 5), ERM loss/regularizer taxonomy (lec 10), the full bias-variance
      decomposition proof (lec 12), kernel-trick induction proof and kernel
      SVM dual (lec 13-14), decision trees with entropy-from-KL (lec 17),
      bagging with the bootstrap-marginal proof (lec 18), AnyBoost/AdaBoost
      derivation (lec 19). NOTE: no EM lecture exists in this source.
    access: >
      Free. All 21 lecture-note pages read by the swarm (HTML).

  - title: "Learning From Data (Caltech CS156 lectures + slides)"
    author: "Y. S. Abu-Mostafa"
    url: "https://work.caltech.edu/telecourse.html"
    kind: lecture-course
    role: >
      Generalization-theory spine for the learning-theory extra: Hoeffding and
      the 1000-coins trap (lec 2), growth function/break point (lec 5-6), VC
      dimension of the perceptron d+1 and the E_out <= E_in + Omega bound
      (lec 7), bias-variance with the sine N=2 toy (lec 8), overfitting /
      regularization / validation triad (lec 11-13) incl. the one-line
      validation-bias proof.
    access: >
      Free. Lecture slide PDFs and videos on the course site; slides 01-13
      read by the swarm.

  - title: "Random Forests (2001)"
    author: "L. Breiman"
    url: "https://link.springer.com/article/10.1023/A:1010933404324"
    kind: primary-paper
    role: >
      Primary source for bagging-random-forests: the PE* <= rho(1-s^2)/s^2
      strength-correlation bound (Thm 2.3), no-overfitting convergence
      (Thm 1.2), OOB estimates (3.1), Forest-RI and the small-F story
      (sec 4, 6, Figs 1-3), label-noise robustness vs AdaBoost (Table 4),
      permutation variable importance (sec 10).
    access: >
      Free mirrors of the Machine Learning 45:5-32 paper (e.g.
      https://www.stat.berkeley.edu/~breiman/randomforest2001.pdf). Full
      text read by the swarm.

  - title: "A Decision-Theoretic Generalization of On-Line Learning and an Application to Boosting (1997)"
    author: "Y. Freund, R. E. Schapire"
    url: "https://www.face-rec.org/algorithms/Boosting-Ensemble/decision-theoretic_generalization.pdf"
    kind: primary-paper
    role: >
      AdaBoost's origin: the algorithm box (Fig 2), the training-error bound
      2^T prod sqrt(eps(1-eps)) and its exp(-2 sum gamma^2) form (Thm 6,
      Eqs 21-23). Note the paper's beta_t notation vs the textbook
      1/2 ln((1-eps)/eps) convention; the margin-based generalization theory
      is a later (1998) paper, not this one.
    access: >
      Free mirror above (JCSS 55:119-139). Canonical URL at UCSD 404s;
      Springer paywalled. Full text read by the swarm.

  - title: "Greedy Function Approximation: A Gradient Boosting Machine (2001)"
    author: "J. H. Friedman"
    url: "https://projecteuclid.org/journals/annals-of-statistics/volume-29/issue-5/Greedy-function-approximation-A-gradient-boosting-machine/10.1214/aos/1013203451.full"
    kind: primary-paper
    role: >
      Gradient boosting's origin: functional gradient descent (sec 2-3,
      Algorithm 1), LS/LAD/Huber/logistic specializations (sec 4), per-leaf
      line search (4.3), shrinkage nu-M trade-off (sec 5, Fig 1, Table 1),
      tree size = interaction order (sec 7), feature importance and partial
      dependence (sec 8).
    access: >
      Free at Project Euclid (open access). Swarm read a scanned mirror via
      OCR; equations cross-checked.

  - title: "XGBoost: A Scalable Tree Boosting System (2016)"
    author: "T. Chen, C. Guestrin"
    url: "https://arxiv.org/abs/1603.02754"
    kind: primary-paper
    role: >
      The xgboost lesson's core: regularized objective (Eq 2), second-order
      Taylor (Eq 3), optimal leaf weight and structure score (Eqs 5-6), the
      split-gain formula (Eq 7), sparsity-aware default directions (Alg 3,
      Fig 4), weighted quantile sketch, systems ablations (Table 3).
    access: >
      Free arXiv PDF. Full text incl. appendix read by the swarm.

  - title: "Support-Vector Networks (1995)"
    author: "C. Cortes, V. Vapnik"
    url: "https://link.springer.com/article/10.1007/BF00994018"
    kind: primary-paper
    role: >
      SVM's origin: optimal hyperplane and dual QP (sec 2), soft margin
      (sec 3), kernel 'convolution of the dot-product' and Mercer (sec 4),
      the full Kuhn-Tucker dual derivation (Appendix A), the E[#SV]/N bound
      (Eq 5), and the USPS Table 2 dimensionality gem (degree-7 polynomial,
      ~10^16-dim feature space, error flat).
    access: >
      Springer version paywalled; full text recovered by the swarm via a
      Wayback Machine snapshot of an NCSU-hosted copy
      (web.archive.org/web/20240802151030/https://ise.ncsu.edu/wp-content/uploads/sites/9/2022/08/Cortes-Vapnik1995_Article_Support-vectorNetworks.pdf).

  - title: "Maximum Likelihood from Incomplete Data via the EM Algorithm (1977)"
    author: "A. P. Dempster, N. M. Laird, D. B. Rubin"
    url: "https://rss.onlinelibrary.wiley.com/doi/10.1111/j.2517-6161.1977.tb01600.x"
    kind: primary-paper
    role: >
      EM's origin for gmm-em: the Q-function definition (Eq 2.17), the
      Jensen/monotonicity theorem (Lemma 1, Thm 1), rate of convergence =
      fraction of missing information, the 197-animal multinomial worked
      example (Table 1), finite mixtures (4.3), and discussion gems (Murray's
      saddle point, Sundberg's slow-convergence warning).
    access: >
      Wiley paywalled; scanned copies circulate (JRSS-B 39:1-38). Swarm read
      a full scan via OCR including the Discussion.

  - title: "Visualizing Data using t-SNE (2008)"
    author: "L. van der Maaten, G. Hinton"
    url: "https://www.jmlr.org/papers/volume9/vandermaaten08a/vandermaaten08a.pdf"
    kind: primary-paper
    role: >
      The tsne lesson's single deep source: SNE and perplexity (sec 2), the
      crowding problem and the Student-t fix (3.2-3.3, Fig 1), optimization
      recipe (3.4, Alg 1), MNIST/COIL-20 results (4.3), the named weaknesses
      list (6.2) that answers 'when NOT to use t-SNE'.
    access: >
      Free JMLR PDF. Full text read by the swarm.

  - title: "Ensemble Methods in Machine Learning (2000)"
    author: "T. G. Dietterich"
    url: "https://web.engr.oregonstate.edu/~tgd/publications/mcs-ensembles.pdf"
    kind: primary-paper
    role: >
      The 'why ensembles work' frame for the ensembles module: statistical /
      computational / representational reasons (Fig 2), the binomial
      majority-vote calculation (21 voters at 0.3 -> 0.026), the diagonal-
      boundary representational argument (Fig 4), boosting-vs-bagging under
      20% label noise (Tables 1-2).
    access: >
      Free author PDF. Full text read by the swarm.

  - title: "Ace the Data Science Interview (2021)"
    author: "N. Singh, K. Huo"
    url: "https://www.acethedatascienceinterview.com/"
    kind: interview-bank
    role: >
      Company-attributed interview questions used as exercise material:
      Uber L1-vs-L2 and fraud-metrics, Airbnb PCA derivation, Netflix EM,
      Two Sigma multicollinearity/VIF, Google biased-coin hypothesis test,
      Facebook Bayes coin. Grounds which questions are actually asked and at
      what difficulty.
    access: >
      Paywalled book (no legal free copy). Swarm reconstructed Ch. 5-8
      question sets from the co-author's public blog excerpts on
      nicksingh.com (40 prob/stats, 30 ML, 30 SQL question posts). Cite
      questions from those public excerpts only.

  - title: "Introduction to Machine Learning Interviews (free web book)"
    author: "C. Huyen"
    url: "https://huyenchip.com/ml-interviews-book/"
    kind: interview-bank
    role: >
      The difficulty-graded ([E]/[M]/[H]) question taxonomy used to calibrate
      exercises across every lesson: math (5.1), prob/stats (5.2), workflows
      incl. sampling/leakage/metrics (ch. 7), classical algorithms k-NN /
      k-means / EM-GMM / trees / bagging-boosting / kernels (8.1). Also the
      'how/why/when over what' question philosophy.
    access: >
      Free (Honkit site). All Part II leaf pages read by the swarm.

  - title: "StatQuest: Machine Learning playlist"
    author: "J. Starmer"
    url: "https://www.youtube.com/playlist?list=PLblh5JKOoLUICTaGLRoHQDuF_7q2GfuJF"
    kind: video-course
    role: >
      Supply of minimal hand-computable toy examples and canonical teaching
      figures to recreate (in dry register): heart-disease stump dataset for
      AdaBoost/trees, drug-dosage data for regression trees and neural nets,
      two-point ridge overfit demo, ROC-threshold walk, k-fold target
      encoding, CatBoost ordered encoding. 106 videos; ~15 transcripts read.
    access: >
      Free on YouTube. Playlist metadata plus representative transcripts
      read by the swarm; figure details verified by narration only.

  - title: "Principal Component Analysis Explained Visually"
    author: "V. Powell, L. Lehe (Setosa.io)"
    url: "https://setosa.io/ev/principal-component-analysis/"
    kind: interactive-explainer
    role: >
      Interaction design template for the PCA demo (draggable points with
      live PC axes; 3D best-viewing-angle analogy) and the 'Eating in the UK'
      17-dimensional outlier case study (Northern Ireland via PC1/PC2).
    access: >
      Free web page; page text and underlying script.js (live covariance SVD)
      read by the swarm.

concepts:
  # ── Module 1: generalization ─────────────────────────────────────────
  - id: risk
    name: Risk
    definition: "Expected loss of a predictor on a fresh draw from the data distribution: R(f) = E[L(f(X), Y)]"
    introduced_in: statistical-learning
  - id: empirical-risk-minimization
    name: Empirical risk minimization
    definition: "Choosing the predictor in a hypothesis class that minimizes average loss on the training sample"
    introduced_in: statistical-learning
  - id: bayes-predictor
    name: Bayes predictor
    definition: "The risk-minimizing predictor given the true distribution: E[Y|X=x] under squared loss, the most probable class under 0–1 loss"
    introduced_in: statistical-learning
  - id: generalization-error
    name: Generalization error
    definition: "The gap between a fitted model's training error and its risk on unseen data"
    introduced_in: statistical-learning
  - id: overfitting
    name: Overfitting
    definition: "Fitting sample-specific noise so that training error falls while risk rises"
    introduced_in: statistical-learning
  - id: bias-variance-decomposition
    name: Bias–variance decomposition
    definition: "Expected squared prediction error = irreducible noise + squared bias + variance"
    introduced_in: bias-variance
  - id: k-nearest-neighbors
    name: k-nearest neighbors
    definition: "Predict by averaging (or voting among) the k closest training points; k dials bias against variance"
    introduced_in: knn-curse
  - id: bayes-error
    name: Bayes error
    definition: "The risk of the Bayes predictor — the floor no classifier can beat"
    introduced_in: knn-curse
  - id: curse-of-dimensionality
    name: Curse of dimensionality
    definition: "In high dimensions, neighborhoods that capture any data cease to be local; local methods need exponentially many samples"
    introduced_in: knn-curse

  # ── Module 2: estimation ─────────────────────────────────────────────
  - id: maximum-likelihood
    name: Maximum likelihood
    definition: "Estimate parameters by maximizing the probability of the observed data: argmax_θ log p(data|θ)"
    introduced_in: mle-map
  - id: map-estimation
    name: MAP estimation
    definition: "Maximum a-posteriori estimation: maximize log-likelihood plus log-prior; priors act as penalties"
    introduced_in: mle-map
  - id: score-function
    name: Score function
    definition: "The gradient of the log-likelihood in the parameter, ∂/∂θ log p(x|θ); has mean zero under regularity"
    introduced_in: fisher-information
  - id: fisher-information
    name: Fisher information
    definition: "Variance of the score (equivalently expected negative curvature of the log-likelihood): how much one observation says about θ"
    introduced_in: fisher-information
  - id: cramer-rao-bound
    name: Cramér–Rao bound
    definition: "No unbiased estimator has variance below 1/(n I(θ))"
    introduced_in: fisher-information
  - id: asymptotic-efficiency
    name: Asymptotic efficiency
    definition: "An estimator whose limiting variance attains the Cramér–Rao floor; the MLE is asymptotically efficient under regularity"
    introduced_in: fisher-information
  - id: gradient-descent
    name: Gradient descent
    definition: "Iteratively step against the loss gradient: θ ← θ − η∇L(θ)"
    introduced_in: gradient-descent
  - id: stochastic-gradient-descent
    name: Stochastic gradient descent
    definition: "Gradient descent on one (or a few) samples' gradient — an unbiased, cheap estimate of the full gradient"
    introduced_in: gradient-descent
  - id: convexity
    name: Convexity
    definition: "A function whose chords lie above it; local minima are global, which is why classical losses are chosen convex"
    introduced_in: gradient-descent
  - id: exponential-family
    name: Exponential family
    definition: "Distributions of the form h(x)exp(η·T(x) − A(η)); the family with fixed-size sufficient statistics"
    introduced_in: glm
  - id: generalized-linear-model
    name: Generalized linear model
    definition: "An exponential-family response whose natural parameter is linear in the features"
    introduced_in: glm
  - id: link-function
    name: Link function
    definition: "The map between a GLM's mean and its linear predictor; the canonical link makes the two coincide with the natural parameter"
    introduced_in: glm
  - id: deviance
    name: Deviance
    definition: "Twice the log-likelihood gap to the saturated model — the GLM's native generalization of squared error"
    introduced_in: glm

  # ── Module 3: the linear model ───────────────────────────────────────
  - id: ordinary-least-squares
    name: Ordinary least squares
    definition: "The linear fit minimizing residual sum of squares; closed form β̂ = (XᵀX)⁻¹Xᵀy"
    introduced_in: ols
  - id: normal-equations
    name: Normal equations
    definition: "XᵀXβ = Xᵀy — the stationarity condition of least squares; residuals orthogonal to the columns of X"
    introduced_in: ols
  - id: gauss-markov
    name: Gauss–Markov theorem
    definition: "Under exogeneity, homoscedasticity, and full rank, OLS is the minimum-variance linear unbiased estimator"
    introduced_in: ols
  - id: regularization
    name: Regularization
    definition: "Penalizing model complexity in the fitting objective to trade bias for variance"
    introduced_in: ridge-lasso
  - id: ridge-regression
    name: Ridge regression
    definition: "L2-penalized least squares: (XᵀX+λI)⁻¹Xᵀy; shrinks every direction, hardest where data variance is smallest"
    introduced_in: ridge-lasso
  - id: lasso
    name: Lasso
    definition: "L1-penalized least squares; sets coefficients exactly to zero via soft thresholding"
    introduced_in: ridge-lasso
  - id: soft-thresholding
    name: Soft thresholding
    definition: "S(z,γ) = sign(z)(|z|−γ)₊ — the lasso's coordinate-wise update; shrink toward zero, then clip"
    introduced_in: ridge-lasso
  - id: multicollinearity
    name: Multicollinearity
    definition: "Near-linear dependence among predictors; coefficients become ill-determined and their variances inflate"
    introduced_in: regression-diagnostics
  - id: heteroscedasticity
    name: Heteroscedasticity
    definition: "Non-constant noise variance across inputs, violating a Gauss–Markov assumption"
    introduced_in: regression-diagnostics
  - id: leverage
    name: Leverage
    definition: "The diagonal h_ii of the hat matrix: how strongly observation i pulls its own fitted value"
    introduced_in: regression-diagnostics
  - id: r-squared
    name: R²
    definition: "Fraction of response variance explained by the fit; inflates with predictors unless adjusted"
    introduced_in: regression-diagnostics
  - id: basis-expansion
    name: Basis expansion
    definition: "Replacing x with fixed derived features h(x) — polynomials, splines — so a linear fit produces a nonlinear function"
    introduced_in: splines-gams
  - id: smoothing-spline
    name: Smoothing spline
    definition: "The minimizer of RSS + λ∫f″² over all twice-differentiable functions — a natural cubic spline, fit by generalized ridge"
    introduced_in: splines-gams
  - id: effective-degrees-of-freedom
    name: Effective degrees of freedom
    definition: "trace of the smoother matrix — one complexity scale for splines, ridge, and local fits alike"
    introduced_in: splines-gams
  - id: generalized-additive-model
    name: Generalized additive model
    definition: "A sum of one-dimensional smooth functions of each feature, fitted by backfitting"
    introduced_in: splines-gams

  # ── Module 4: boundaries ─────────────────────────────────────────────
  - id: logistic-regression
    name: Logistic regression
    definition: "Model the log-odds as linear in features; fit by maximizing the Bernoulli likelihood"
    introduced_in: logistic-regression
  - id: log-odds
    name: Log-odds
    definition: "log(p/(1−p)) — the scale on which logistic regression is linear"
    introduced_in: logistic-regression
  - id: cross-entropy-loss
    name: Cross-entropy loss
    definition: "Negative Bernoulli log-likelihood: −[y log p + (1−y) log(1−p)]; convex in the weights"
    introduced_in: logistic-regression
  - id: naive-bayes
    name: Naive Bayes
    definition: "Generative classifier assuming features independent given the class; parameters are smoothed counts"
    introduced_in: naive-bayes
  - id: conditional-independence
    name: Conditional independence
    definition: "p(x₁,…,x_d|y) = Π p(x_j|y) — the factorization that collapses naive Bayes' parameter count"
    introduced_in: naive-bayes
  - id: laplace-smoothing
    name: Laplace smoothing
    definition: "Adding pseudo-counts to category estimates — MAP with a Dirichlet prior — to avoid zero probabilities"
    introduced_in: naive-bayes
  - id: gaussian-discriminant-analysis
    name: Gaussian discriminant analysis
    definition: "Fit a Gaussian per class and classify by Bayes' rule; shared covariance gives LDA (linear), per-class gives QDA (quadratic)"
    introduced_in: lda-gda
  - id: generative-vs-discriminative
    name: Generative vs discriminative
    definition: "Model p(x,y) and derive the boundary, or model p(y|x) directly — efficiency when the model is right vs robustness when it is wrong"
    introduced_in: lda-gda
  - id: maximum-margin
    name: Maximum margin
    definition: "Among separating hyperplanes, choose the one farthest from the closest points; margin = 2/‖w‖ after normalization"
    introduced_in: svm-max-margin
  - id: hinge-loss
    name: Hinge loss
    definition: "max(0, 1 − y f(x)) — the convex surrogate whose penalized minimization is the soft-margin SVM"
    introduced_in: svm-max-margin
  - id: slack-variables
    name: Slack variables
    definition: "Per-point margin violations ξᵢ ≥ 0 that make the margin problem feasible on non-separable data, priced by C"
    introduced_in: svm-max-margin
  - id: support-vectors
    name: Support vectors
    definition: "The training points with nonzero dual weight — on or inside the margin — that alone determine the SVM boundary"
    introduced_in: svm-max-margin
  - id: lagrangian-duality
    name: Lagrangian duality
    definition: "Reformulating a constrained optimum through multipliers; for the SVM it exposes dependence on inner products only"
    introduced_in: svm-dual-kernels
  - id: kkt-conditions
    name: KKT conditions
    definition: "Stationarity, feasibility, and complementary slackness — the optimality conditions that identify support vectors"
    introduced_in: svm-dual-kernels
  - id: kernel-trick
    name: Kernel trick
    definition: "Replace inner products with a PSD kernel K(x,x′) and compute in an implicit, possibly infinite, feature space"
    introduced_in: svm-dual-kernels

  # ── Module 5: evaluation ─────────────────────────────────────────────
  - id: confusion-matrix
    name: Confusion matrix
    definition: "The 2×2 table of predicted vs actual classes from which every classification rate derives"
    introduced_in: classification-metrics
  - id: precision-recall
    name: Precision and recall
    definition: "Precision = TP/(TP+FP); recall = TP/(TP+FN); the pair that survives class imbalance"
    introduced_in: classification-metrics
  - id: roc-auc
    name: ROC and AUC
    definition: "TPR vs FPR across thresholds; the area equals the probability a random positive outranks a random negative"
    introduced_in: classification-metrics
  - id: calibration
    name: Calibration
    definition: "Predicted probabilities matching observed frequencies; measured by reliability curves and proper scoring rules"
    introduced_in: classification-metrics
  - id: cross-validation
    name: Cross-validation
    definition: "Estimate risk by rotating held-out folds; k trades bias of the estimate against its variance"
    introduced_in: cross-validation-bootstrap
  - id: bootstrap
    name: Bootstrap
    definition: "Resample the data with replacement to estimate an estimator's sampling variability"
    introduced_in: cross-validation-bootstrap
  - id: nested-cross-validation
    name: Nested cross-validation
    definition: "An outer loop measuring, an inner loop selecting — so hyperparameter choice never sees the measuring folds"
    introduced_in: cross-validation-bootstrap
  - id: optimism
    name: Optimism of training error
    definition: "E[in-sample error] − E[training error] = (2/N)ΣCov(ŷᵢ,yᵢ) — the computable bias of training error"
    introduced_in: cross-validation-bootstrap
  - id: class-imbalance
    name: Class imbalance
    definition: "Skewed class frequencies that break accuracy and default thresholds; handled by metrics, weights, resampling"
    introduced_in: imbalance-leakage
  - id: resampling-methods
    name: Resampling for imbalance
    definition: "Over/under-sampling the training classes; shifts the implied prior and distorts calibration unless corrected"
    introduced_in: imbalance-leakage
  - id: data-leakage
    name: Data leakage
    definition: "Information from outside the training fold (targets, future, groups) contaminating fitting — the classic cause of too-good scores"
    introduced_in: imbalance-leakage
  - id: categorical-encoding
    name: Categorical encoding
    definition: "Turning categories into numbers — one-hot, ordinal, target encoding — each with its own leakage and collinearity traps"
    introduced_in: feature-engineering
  - id: feature-scaling
    name: Feature scaling
    definition: "Standardizing feature ranges; mandatory for distance- and penalty-based methods, irrelevant to trees"
    introduced_in: feature-engineering
  - id: feature-selection
    name: Feature selection
    definition: "Filters, wrappers, and embedded (L1) methods for discarding features — legitimately only inside the validation fold"
    introduced_in: feature-engineering

  # ── Module 6: local models ───────────────────────────────────────────
  - id: kernel-smoother
    name: Kernel smoother
    definition: "The Nadaraya–Watson estimate: a kernel-weighted local average of the responses"
    introduced_in: kernel-smoothing
  - id: local-linear-regression
    name: Local linear regression
    definition: "A weighted least-squares line fitted at each target point; kills the kernel smoother's boundary bias"
    introduced_in: kernel-smoothing
  - id: bandwidth
    name: Bandwidth
    definition: "The width of the local neighborhood — the smoother's bias–variance dial"
    introduced_in: kernel-smoothing
  - id: loess
    name: LOESS
    definition: "Cleveland's robust local regression: local linear fits, bisquare-reweighted so outliers lose their vote"
    introduced_in: kernel-smoothing
  - id: decision-tree
    name: Decision tree
    definition: "Recursive binary partition of feature space; each leaf predicts a constant"
    introduced_in: decision-trees
  - id: gini-impurity
    name: Gini impurity
    definition: "Σ p_k(1−p_k) — a node's class mixing, the default splitting criterion"
    introduced_in: decision-trees
  - id: information-gain
    name: Information gain
    definition: "Entropy reduction from a split — the alternative impurity criterion"
    introduced_in: decision-trees
  - id: cost-complexity-pruning
    name: Cost-complexity pruning
    definition: "Minimize error + α·(leaf count) over subtrees; α chosen by cross-validation"
    introduced_in: decision-trees

  # ── Module 7: ensembles ──────────────────────────────────────────────
  - id: bagging
    name: Bagging
    definition: "Average models fitted on bootstrap resamples; cuts variance, leaves bias"
    introduced_in: bagging-random-forests
  - id: random-forest
    name: Random forest
    definition: "Bagged trees with random feature subsets per split, decorrelating the trees to break the variance floor"
    introduced_in: bagging-random-forests
  - id: out-of-bag-error
    name: Out-of-bag error
    definition: "Error estimated on the ~37% of points each bootstrap tree never saw — cross-validation for free"
    introduced_in: bagging-random-forests
  - id: variable-importance
    name: Variable importance
    definition: "Split-improvement or permutation-based scores ranking features by their contribution to an ensemble"
    introduced_in: bagging-random-forests
  - id: weak-learner
    name: Weak learner
    definition: "A classifier guaranteed only to beat chance by a margin γ; boosting's raw material"
    introduced_in: adaboost
  - id: boosting
    name: Boosting
    definition: "Sequentially fitting learners to the current model's mistakes and combining them additively"
    introduced_in: adaboost
  - id: adaboost
    name: AdaBoost
    definition: "Boosting with multiplicative reweighting and vote weight ½ln((1−ε)/ε); equals stagewise exponential-loss minimization"
    introduced_in: adaboost
  - id: exponential-loss
    name: Exponential loss
    definition: "exp(−y f(x)) — the margin-based loss AdaBoost secretly minimizes"
    introduced_in: adaboost
  - id: gradient-boosting
    name: Gradient boosting
    definition: "Gradient descent in function space: each tree fits the negative gradient of the loss at current predictions"
    introduced_in: gradient-boosting
  - id: pseudo-residuals
    name: Pseudo-residuals
    definition: "The negative loss gradient per training point — ordinary residuals when the loss is squared error"
    introduced_in: gradient-boosting
  - id: shrinkage
    name: Shrinkage
    definition: "Scaling each boosting step by ν < 1; small ν with many rounds generalizes better"
    introduced_in: gradient-boosting
  - id: newton-boosting
    name: Newton boosting
    definition: "Boosting on a second-order Taylor expansion of the loss, using per-point gradients and Hessians"
    introduced_in: xgboost
  - id: split-gain
    name: Split gain
    definition: "½[G_L²/(H_L+λ) + G_R²/(H_R+λ) − G²/(H+λ)] − γ — XGBoost's exact criterion for a candidate split"
    introduced_in: xgboost
  - id: partial-dependence
    name: Partial dependence
    definition: "The model's average prediction as one feature varies, marginalizing (not conditioning) over the rest"
    introduced_in: shap-interpretability
  - id: permutation-importance
    name: Permutation importance
    definition: "The performance drop when one feature's values are shuffled — importance measured by damage"
    introduced_in: shap-interpretability
  - id: shapley-value
    name: Shapley value
    definition: "The unique additive attribution satisfying local accuracy, missingness, and consistency — a feature's average marginal contribution over orderings"
    introduced_in: shap-interpretability

  # ── Module 8: unsupervised ───────────────────────────────────────────
  - id: k-means
    name: k-means
    definition: "Alternate nearest-center assignment and center recomputation; coordinate descent on total within-cluster squared distance"
    introduced_in: kmeans
  - id: distortion
    name: Distortion
    definition: "Σᵢ‖xᵢ − μ_{c(i)}‖² — the objective both k-means steps monotonically decrease"
    introduced_in: kmeans
  - id: k-means-plus-plus
    name: k-means++
    definition: "Seeding centers by D²-weighted sampling; expected distortion within O(log K) of optimal"
    introduced_in: kmeans
  - id: hierarchical-clustering
    name: Hierarchical clustering
    definition: "Agglomerative merging of closest clusters into a dendrogram; cutting at a height yields a partition"
    introduced_in: hierarchical-dbscan
  - id: linkage
    name: Linkage
    definition: "The between-cluster distance rule — single, complete, average, Ward — each with characteristic artifacts"
    introduced_in: hierarchical-dbscan
  - id: dbscan
    name: DBSCAN
    definition: "Density-based clustering via core/border/noise points; finds arbitrary shapes, needs no k"
    introduced_in: hierarchical-dbscan
  - id: silhouette
    name: Silhouette score
    definition: "(b−a)/max(a,b) per point — cohesion vs separation, averaged to score a clustering"
    introduced_in: hierarchical-dbscan
  - id: gaussian-mixture-model
    name: Gaussian mixture model
    definition: "A weighted sum of Gaussians as a latent-variable density; clusters are posterior responsibilities"
    introduced_in: gmm-em
  - id: em-algorithm
    name: EM algorithm
    definition: "Alternate expected complete-data log-likelihood (E) with its maximization (M); the observed likelihood never decreases"
    introduced_in: gmm-em
  - id: responsibilities
    name: Responsibilities
    definition: "Posterior probabilities that component k generated point i — EM's soft assignments"
    introduced_in: gmm-em
  - id: elbo
    name: Evidence lower bound
    definition: "log p(X|θ) = L(q,θ) + KL(q‖posterior): the decomposition that proves EM's monotonicity"
    introduced_in: gmm-em
  - id: principal-component-analysis
    name: Principal component analysis
    definition: "Project onto the top eigenvectors of the covariance — the directions of maximum variance and minimum reconstruction error"
    introduced_in: pca
  - id: explained-variance
    name: Explained variance
    definition: "Eigenvalue shares telling how much variance each principal component captures"
    introduced_in: pca
  - id: svd
    name: Singular value decomposition
    definition: "X = UDVᵀ; the numerically right way to compute PCA and the source of its low-rank optimality"
    introduced_in: pca
  - id: graph-laplacian
    name: Graph Laplacian
    definition: "L = D − W for a similarity graph; f'Lf = ½Σw_ij(fᵢ−f_j)², zero-eigenspace spans connected components"
    introduced_in: spectral-clustering
  - id: spectral-clustering
    name: Spectral clustering
    definition: "Embed points by the Laplacian's smallest eigenvectors, then run k-means in the embedding"
    introduced_in: spectral-clustering
  - id: normalized-cut
    name: Normalized cut
    definition: "Cut weight balanced by cluster volume — the graph-cut objective spectral clustering relaxes"
    introduced_in: spectral-clustering
  - id: eigengap
    name: Eigengap heuristic
    definition: "Choose k where the Laplacian's eigenvalues jump — small λ₁..λ_k, large λ_{k+1}"
    introduced_in: spectral-clustering
  - id: t-sne
    name: t-SNE
    definition: "Match high-dimensional Gaussian neighbor probabilities with heavy-tailed 2D ones by minimizing KL"
    introduced_in: tsne
  - id: perplexity
    name: Perplexity
    definition: "The effective neighbor count 2^H setting each point's bandwidth in t-SNE"
    introduced_in: tsne
  - id: crowding-problem
    name: Crowding problem
    definition: "2D lacks volume for moderate distances; without heavy tails, mid-range neighbors crush into the center"
    introduced_in: tsne
  - id: umap
    name: UMAP
    definition: "kNN-graph embedding via fuzzy set union and cross-entropy layout; t-SNE's kernel is its a=b=1 case"
    introduced_in: tsne

  # ── Module 9: learning theory ────────────────────────────────────────
  - id: pac-learning
    name: PAC learning
    definition: "Probably approximately correct: with probability 1−δ over samples, risk within ε of the best in class, at sample size polynomial in 1/ε, 1/δ"
    introduced_in: learning-theory
  - id: hoeffding-inequality
    name: Hoeffding's inequality
    definition: "The mean of n bounded variables deviates by ε with probability at most 2exp(−2nε²)"
    introduced_in: learning-theory
  - id: union-bound
    name: Union bound
    definition: "P(∪Aᵢ) ≤ ΣP(Aᵢ) — the price of guarding every hypothesis at once"
    introduced_in: learning-theory
  - id: generalization-bound
    name: Generalization bound
    definition: "A high-probability bound on risk minus empirical risk, uniform over a hypothesis class"
    introduced_in: learning-theory
  - id: no-free-lunch
    name: No Free Lunch theorem
    definition: "For every learner there is a distribution on which it fails; learning requires inductive bias"
    introduced_in: learning-theory
  - id: vc-dimension
    name: VC dimension
    definition: "The largest point-set size the class can shatter (realize all labelings of)"
    introduced_in: vc-dimension
  - id: growth-function
    name: Growth function
    definition: "The maximum number of distinct labelings the class realizes on n points"
    introduced_in: vc-dimension
  - id: sauer-lemma
    name: Sauer's lemma
    definition: "Growth is either 2ⁿ forever or bounded by (en/d)^d once n > d — the polynomial/exponential dichotomy"
    introduced_in: vc-dimension
  - id: rademacher-complexity
    name: Rademacher complexity
    definition: "Expected best correlation of the class with random ±1 labels on the sample — data-dependent capacity"
    introduced_in: rademacher-stability
  - id: uniform-stability
    name: Uniform stability
    definition: "Replacing one training point changes the learned loss by at most β; β = o(1/√n) implies generalization"
    introduced_in: rademacher-stability
  - id: margin-bound
    name: Margin bound
    definition: "Risk ≤ margin training loss + a capacity term in 1/ρ — independent of dimension (SVM) or rounds (boosting)"
    introduced_in: margin-bounds
  - id: margin-distribution
    name: Margin distribution
    definition: "The empirical CDF of per-example margins; boosting provably shifts its mass right"
    introduced_in: margin-bounds

  # ── Module 10: uncertainty ───────────────────────────────────────────
  - id: posterior-predictive
    name: Posterior predictive
    definition: "The prediction distribution after integrating out parameters; its variance adds parameter uncertainty to noise"
    introduced_in: bayesian-linear-regression
  - id: marginal-likelihood
    name: Marginal likelihood
    definition: "p(data|model), parameters integrated out — the quantity that scores models and tunes hyperparameters"
    introduced_in: bayesian-linear-regression
  - id: bayesian-occam
    name: Bayesian Occam's razor
    definition: "Complex models spread probability over many datasets, so the marginal likelihood automatically favors adequate simplicity"
    introduced_in: bayesian-linear-regression
  - id: gaussian-process
    name: Gaussian process
    definition: "A distribution over functions: any finite set of values is jointly Gaussian with covariance given by a kernel"
    introduced_in: gaussian-processes
  - id: covariance-function
    name: Covariance function
    definition: "The GP's kernel k(x,x′): the prior's statement of smoothness, scale, and periodicity"
    introduced_in: gaussian-processes
  - id: conformal-prediction
    name: Conformal prediction
    definition: "Wrap any model: calibrate a score quantile on held-out data and output the set of labels scoring below it"
    introduced_in: conformal-prediction
  - id: conformal-score
    name: Conformal score
    definition: "s(x,y) measuring how badly the model fits candidate label y; the guarantee holds for any score, usefulness depends on it"
    introduced_in: conformal-prediction
  - id: marginal-coverage
    name: Marginal coverage
    definition: "P(Y ∈ C(X)) ≥ 1−α on average over everything — not per group, not per input"
    introduced_in: conformal-prediction

  # ── Module 11: epilogue ──────────────────────────────────────────────
  - id: double-descent
    name: Double descent
    definition: "Test risk falls, spikes at the interpolation threshold, then falls again as capacity grows past it"
    introduced_in: double-descent
  - id: interpolation-threshold
    name: Interpolation threshold
    definition: "The capacity at which the model first fits the training data exactly — where risk peaks"
    introduced_in: double-descent
  - id: min-norm-interpolation
    name: Minimum-norm interpolation
    definition: "Among all interpolating solutions, the smallest-norm one — what gradient descent from zero finds"
    introduced_in: double-descent
  - id: benign-overfitting
    name: Benign overfitting
    definition: "Interpolating noise with negligible excess risk; possible when covariance spectra have high effective rank"
    introduced_in: double-descent

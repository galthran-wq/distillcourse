          reinforces: [k-nearest-neighbors, curse-of-dimensionality]
        key_ideas:
          - "The distortion objective J; both steps minimize J in one block of variables — the convergence proof"
          - "Local optima and restarts; k-means++ seeding with its O(log K) guarantee, stated"
          - "Vector quantization: compressing a photograph with K centroids, bit-count arithmetic included"
          - "Choosing K: why reconstruction error cannot do it; elbow, silhouette, gap (pointers)"
          - "Failure geometry: unequal densities, elongated clusters, unscaled features — and the standardization-can-destroy-clusters counterexample"
        demo:
          component: KMeansStepper
          spec: >-
            2D scatter with k=3; step button alternates assignment (points

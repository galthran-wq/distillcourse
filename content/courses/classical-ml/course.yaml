    outcomes: [co-derive, co-frame, co-implement]
    lessons:
      - slug: bagging-random-forests
        title: "Bagging and random forests"
        type: core
        status: drafted
        key_image: figures/variance-floor.svg
        goal: "Explain how bagging reduces variance and why random forests decorrelate trees, using the correlated-average variance formula"
        opening: "Averaging B identically distributed trees leaves bias unchanged and cuts variance only down to a floor set by the between-tree correlation — random forests exist to attack that floor."
        est_minutes: 38
        prerequisites: [decision-trees, cross-validation-bootstrap]
        concepts:
          introduces: [bagging, random-forest, out-of-bag-error, variable-importance]
          reinforces: [bootstrap, decision-tree, bias-variance-decomposition]
        key_ideas:
          - "Var of a correlated average: ρσ² + (1−ρ)σ²/B — derived, then read as the whole story"
          - "Bagging: bootstrap + aggregate; why it needs unstable, low-bias learners; where it can hurt under 0–1 loss"
          - "Random forests: m ≈ √p feature subsampling pushes ρ down; Breiman's strength/correlation frame"
          - "OOB error ≈ free cross-validation; more trees never overfit (the convergence theorem, stated)"
          - "Variable importance: Gini vs permutation, and their biases"
        demo: null
      - slug: adaboost
        title: "AdaBoost"
        type: core
        status: drafted
        key_image: figures/rounds-3.svg
        goal: "Compute AdaBoost rounds by hand and derive the algorithm's equivalence to forward-stagewise additive modeling under exponential loss"
        opening: "AdaBoost turns a learner barely better than chance into a strong classifier by reweighting mistakes; the algorithm is exactly stagewise minimization of an exponential loss."
        est_minutes: 40
        prerequisites: [decision-trees]
        concepts:
          introduces: [weak-learner, boosting, adaboost, exponential-loss]
          reinforces: [decision-tree, overfitting, cross-entropy-loss]
        key_ideas:
          - "The algorithm: weighted error ε, vote weight α = ½ln((1−ε)/ε), multiplicative reweighting; two rounds worked by hand"
          - "The derivation: stagewise exponential-loss minimization reproduces α and the weights exactly"
          - "Training error ≤ exp(−2Σγ_t²), proved by the telescoping-normalizer argument"
          - "The stump that alone gets 45.8% error reaches 5.8% after 400 rounds — and test error keeps falling after training error hits zero: the debt named for module 9"
          - "Exponential loss vs deviance: label-noise sensitivity; bagging vs boosting as variance vs bias tools"
        demo: null
      - slug: gradient-boosting
        title: "Gradient boosting"
        type: core
        status: drafted
        key_image: figures/function-space.svg
        goal: "Derive gradient boosting as gradient descent in function space and explain the roles of shrinkage, tree depth, and subsampling"
        opening: "Gradient boosting fits each new tree to the negative gradient of the loss at the current predictions — for squared error, literally the residuals — turning boosting into gradient descent in function space."
        est_minutes: 38
        prerequisites: [adaboost, gradient-descent]
        concepts:
          introduces: [gradient-boosting, pseudo-residuals, shrinkage]
          reinforces: [gradient-descent, adaboost, decision-tree, exponential-loss]
        key_ideas:
          - "Treat the N fitted values as parameters; the negative gradient for squared error is the residual — Friedman's move, derived"
          - "The generic algorithm: fit tree to pseudo-residuals, per-leaf line search; the loss/gradient table"
          - "Shrinkage ν vs iterations M: Friedman's own curves — small ν always generalizes better; stochastic subsampling"
          - "Tree depth caps interaction order (ANOVA argument); why depth 4–8 dominates"
          - "Robust losses: LAD and Huber boosting survive the outliers squared error cannot"
        demo:

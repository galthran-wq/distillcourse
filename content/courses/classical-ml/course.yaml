          - "Multicollinearity: the flat RSS valley, inflated variance, VIF; the Credit-data 12× standard-error demonstration"
          - "Residual plots and heteroscedasticity; robust (LAD/Huber) regression and the potoroo one-typo case"
          - "Leverage h_ii, outliers vs influence; the hat matrix does double duty (LOOCV preview)"
          - "R² vs adjusted R²; what coefficients and p-values do and do not mean (the shark-attack confounder)"

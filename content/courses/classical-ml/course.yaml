  - slug: boundaries
    title: "Three roads to a boundary"
    outcomes: [co-derive, co-frame, co-implement]
    lessons:
      - slug: logistic-regression
        title: "Logistic regression"
        type: core
        status: drafted
        key_image: figures/challenger.svg
        goal: "Derive the logistic-regression loss and gradient from the Bernoulli likelihood and analyze its behavior on separable data"
        opening: "Logistic regression models the log-odds as a linear function; maximum likelihood then yields a convex loss whose gradient has exactly the least-squares form (y − p)x."
        est_minutes: 38
        prerequisites: [glm, regression-diagnostics]
        concepts:
          introduces: [logistic-regression, log-odds, cross-entropy-loss]
          reinforces: [maximum-likelihood, gradient-descent, convexity, generalized-linear-model]
        key_ideas:
          - "Sigmoid from log-odds; the decision boundary is linear; coefficients are log odds ratios"
          - "Bernoulli likelihood → cross-entropy; gradient derived with σ′ = σ(1−σ); convexity proved"
          - "Newton = IRLS: the weighted least-squares inner loop, derived"
          - "Separable data drives weights to infinity — regularization as the fix"
          - "The Challenger O-rings worked end to end: 23 launches, failure probability 0.9996 at 31°F"
        demo: null
      - slug: naive-bayes
        title: "Naive Bayes"
        type: core
        status: drafted
        key_image: figures/class-fan.svg
        goal: "Construct a naive Bayes classifier from the conditional-independence assumption and compute smoothed predictions by hand"
        opening: "Naive Bayes assumes features are conditionally independent given the class; the assumption is false almost everywhere, and the classifier works anyway."
        est_minutes: 32
        prerequisites: [mle-map, logistic-regression]
        concepts:
          introduces: [naive-bayes, conditional-independence, laplace-smoothing]
          reinforces: [maximum-likelihood, map-estimation, bayes-predictor]
        key_ideas:
          - "Bayes' rule plus the factorization p(x|y) = Π p(x_j|y); parameter count collapses from exponential to linear"
          - "MLE parameters are counts; a fully worked text-classification example"
          - "The zero-count failure and Laplace smoothing as MAP with a Dirichlet prior — the module-2 machinery reused"
          - "Event models: Bernoulli, multinomial, Gaussian NB; naive Bayes is linear in log-space"
          - "Why biased densities can still give correct boundaries (decision vs estimation)"
        demo: null
      - slug: lda-gda
        title: "Generative versus discriminative: LDA and QDA"
        type: core
        status: drafted
        key_image: figures/generative-picture.svg
        goal: "Derive LDA and QDA from class-conditional Gaussians and analyze the generative–discriminative trade-off against logistic regression"
        opening: "Fitting one Gaussian per class and applying Bayes' rule produces exactly the logistic functional form — but the two fits give different parameters, and that difference is the generative–discriminative trade-off."
        est_minutes: 36
        prerequisites: [naive-bayes, logistic-regression]
        concepts:
          introduces: [gaussian-discriminant-analysis, generative-vs-discriminative]
          reinforces: [logistic-regression, naive-bayes, maximum-likelihood, bias-variance-decomposition]
        key_ideas:
          - "GDA model and closed-form MLE; shared covariance → linear boundary (LDA), derived"
          - "Per-class covariances → QDA; the bias–variance reading of the LDA/QDA choice"
          - "Same functional form, different estimates: efficiency when the Gaussian holds, robustness when it does not"
          - "What generative buys: missing features, class priors, outlier detection"
          - "Fisher's 1936 view: LDA as the projection maximizing between/within scatter"
        demo: null
      - slug: svm-max-margin
        title: "Maximum margin and the soft-margin SVM"
        type: core
        status: drafted
        key_image: figures/margin-diagram.svg
        goal: "Formulate the hard- and soft-margin SVM as a quadratic program and interpret C, slack, and the hinge-loss view"
        opening: "Among all separating hyperplanes, the SVM picks the one with maximum margin; slack variables and the parameter C extend the same idea to non-separable data."
        est_minutes: 36
        prerequisites: [logistic-regression]
        concepts:
          introduces: [maximum-margin, hinge-loss, slack-variables, support-vectors]
          reinforces: [cross-entropy-loss, regularization, convexity]
        key_ideas:
          - "The third road: no likelihood at all — geometry picks the boundary; perceptron non-uniqueness as the motivating flaw"
          - "Geometric margin; normalizing to y(wᵀx+b) ≥ 1 gives margin 2/‖w‖; the hard-margin QP"
          - "Slack variables and C; one outlier swinging the hard-margin plane"
          - "ERM view: hinge loss + L2 penalty is the same problem; the loss-function zoo in one figure"
          - "Margin as a generalization claim — the IOU module 9 will pay"
        demo:
          component: SvmMarginExplorer
          spec: >-
            2D two-class points (draggable) with the soft-margin boundary,
            margin lines, and highlighted support vectors; C slider on a log
            scale. Task: drag a non-support point around and verify the
            boundary ignores it, then drag it into the margin and watch it
            take hold — falsifying "every point matters". Presets:
            separable, one outlier, heavy overlap.
      - slug: svm-dual-kernels
        title: "The SVM dual and the kernel trick"
        type: core
        status: drafted
        key_image: figures/ring-lift.svg
        goal: "Derive the SVM dual via Lagrange multipliers and KKT conditions and explain how kernels give nonlinear boundaries at no extra cost"
        opening: "Solving the margin QP through its Lagrangian dual reveals that the classifier depends on the data only through inner products — replace those with a kernel and the SVM becomes nonlinear for free."
        est_minutes: 42
        prerequisites: [svm-max-margin]
        concepts:
          introduces: [lagrangian-duality, kkt-conditions, kernel-trick]
          reinforces: [maximum-margin, hinge-loss, support-vectors, convexity]
        key_ideas:
          - "Full dual derivation: Lagrangian, stationarity w = Σαᵢyᵢxᵢ, the dual QP — every step shown"
          - "Complementary slackness: αᵢ > 0 exactly on the margin — support vectors fall out of KKT"
          - "Soft margin changes one thing: the box constraint 0 ≤ α ≤ C"
          - "Kernels: polynomial (explicit feature map computed), RBF (infinite-dimensional); Mercer's condition; kernel algebra"
          - "The XOR worked example; the 'skin of the orange' warning — kernels do not repeal the curse; the overfitting debt named for module 9"
        demo:
          component: KernelBoundaryExplorer
          spec: >-
            2D ring-inside-disk data; RBF-SVM boundary with γ and C sliders
            (log scales); support vectors highlighted, train/test error
            readout. Task: push γ up until the boundary memorizes single
            points (islands), then find the γ giving best test error —
            locating the threshold where flexibility turns into overfitting.
      - slug: spam-filter
        title: "The spam filter: three boundaries on one corpus"
        type: core
        status: drafted
        key_image: figures/concordance.svg
        goal: "Compare naive Bayes, logistic regression, LDA, and an RBF-SVM on the ESL spam corpus and interpret what each fitted boundary claims about the data"
        opening: "The 4,601-message spam corpus — 57 word and character frequencies from one Hewlett-Packard employee's mailbox — is where this module's three roads meet: every classifier just built fits it, and their disagreements are interpretable."
        est_minutes: 30
        prerequisites: [lda-gda, svm-dual-kernels]
        concepts:
          introduces: []
          reinforces: [naive-bayes, logistic-regression, gaussian-discriminant-analysis, kernel-trick, generative-vs-discriminative]
        key_ideas:
          - "The artifact: ESL's running spam benchmark; error ladder across this module's methods"
          - "Reading fitted models: 'george', 'hp', '!' as top features — and why the strongest features are leakage (the recipient's own name)"
          - "Independence violated, Gaussians wrong, boundaries still useful — the decision-vs-estimation point made on real data"
          - "Departures from the idealization: adversarial drift, non-iid mail, asymmetric costs — the module-5 agenda"
        demo: null
      - slug: logreg-lab
        title: "Lab: logistic regression from scratch"
        type: lab
        status: drafted
        key_image: figures/residual-pull.svg
        goal: "Implement logistic regression end to end in numpy — stable log-loss, hand-derived gradient, gradient descent, L2, Newton/IRLS, and a rank-based ROC-AUC — and classify real tumors against held-out labels"
        opening: "Every derivation from this module becomes running code: you derive the gradient and the Hessian yourself, build the classifier and its scorer piece by verified piece, then point them at real diagnostic data and beat a server-scored AUC threshold."
        est_minutes: 12
        prerequisites: [logistic-regression, gradient-descent]
        concepts:
          introduces: []
          reinforces: [logistic-regression, cross-entropy-loss, gradient-descent]
        key_ideas:
          - "log(sigmoid) overflows on saturated logits; logaddexp is the stable form"
          - "The (p − y)x gradient — derived by hand, refereed by finite differences"
          - "Newton/IRLS converges in single-digit steps where GD needs thousands"
          - "Separable subsets drive ‖w‖ to infinity — watched live, fixed by L2"
          - "AUC is a rank statistic; tied scores share averaged ranks"
        demo: null
        lab:
          est_hours: 4.5
          checkpoints:
            - id: sigmoid
              kind: exact
              text: "Elementwise sigmoid"
            - id: log-loss
              kind: exact
              text: "Numerically stable log-loss via logaddexp"
            - id: grad
              kind: exact
              text: "Gradient of the loss in (w, b), checked against finite differences"
            - id: fit-gd
              kind: exact
              text: "Batch gradient-descent trainer with loss history"
            - id: l2
              kind: exact
              text: "L2-penalized loss and gradient (intercept unpenalized)"
            - id: separable-divergence
              kind: exact
              text: "Demonstrate ‖w‖ growth without bound on synthetic separable two-cluster data, tamed by L2"
            - id: newton
              kind: exact
              required: false
              text: "Newton/IRLS: derive the Hessian; eight steps vs two thousand of GD, verified"
            - id: auc
              kind: exact
              text: "ROC-AUC as a rank statistic, ties handled"
            - id: beat-auc
              kind: metric
              required: false
              text: "Beat the AUC threshold on held-out tumors with your own model"
            - id: why-not-mse
              kind: review
              text: "Written answer: why cross-entropy, not squared error"
              required: false

  - slug: evaluation
    title: "Evaluation and validation"
    outcomes: [co-evaluate]
    lessons:
      - slug: classification-metrics
        title: "Classification metrics: ROC, precision–recall, and calibration"
        type: core
        status: drafted
        key_image: figures/confusion-map.svg
        goal: "Select the right classification metric for a task and compute confusion-matrix, ROC, PR, and calibration quantities by hand"
        opening: "Accuracy fails on exactly the problems that matter — a 99.9%-accurate rare-disease screen can be useless — so classifier evaluation is a menu of metrics, each correct for a different question."
        est_minutes: 38
        prerequisites: [logistic-regression]
        concepts:
          introduces: [confusion-matrix, precision-recall, roc-auc, calibration]
          reinforces: [logistic-regression, cross-entropy-loss, bayes-predictor]
        key_ideas:
          - "Confusion matrix and every derived rate in one table; the Default-data 75%-missed-defaulters worked case"
          - "Threshold sweep → ROC; AUC as ranking probability (proved); where ROC misleads"
          - "PR curves under imbalance; F-beta and why the harmonic mean"
          - "Proper scoring rules: log-loss, Brier; calibration curves; Platt scaling and its failure case"
          - "Thresholds from costs, not defaults — expected-loss minimization from module 1"
        demo:
          component: ThresholdMetricsExplorer
          spec: >-
            Two overlapping score histograms (negatives, positives) with a
            draggable threshold; live confusion matrix, precision, recall,
            F1, and the current point traced on ROC and PR curves. Task:
            hit precision ≥ 0.9 at maximum recall; then switch to the 1:100
            imbalance preset and watch ROC barely move while precision
            collapses — falsifying "AUC is all you need".
      - slug: cross-validation-bootstrap
        title: "Cross-validation and the bootstrap"
        type: core
        status: drafted
        key_image: figures/protocol-gallery.svg
        goal: "Design validation protocols — hold-out, k-fold, LOOCV, nested CV, bootstrap — and justify the choice of k and the one-standard-error rule"
        opening: "Training error is a biased estimate of test error, and the size of that bias — the optimism — can be computed; resampling is how classical ML measures generalization honestly."
        est_minutes: 40
        prerequisites: [bias-variance, classification-metrics, regression-diagnostics, splines-gams]
        concepts:
          introduces: [cross-validation, bootstrap, nested-cross-validation, optimism]
          reinforces: [bias-variance-decomposition, overfitting, generalization-error, effective-degrees-of-freedom]
        key_ideas:
          - "Optimism of training error = (2/N)ΣCov(ŷᵢ,yᵢ); Cp/AIC as corrected training error"
          - "Hold-out, k-fold, LOOCV; bias–variance in the choice of k; the leverage shortcut for linear smoothers"
          - "Bootstrap resampling; the 63.2% in-sample rate; .632 estimator and its breakdown case"
          - "Selection bias and nested CV; the one-standard-error rule; time-series and grouped folds"
          - "CV estimates expected error well and conditional error poorly — what the number actually means"
        demo: null

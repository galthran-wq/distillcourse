          - "E-step responsibilities via Bayes' rule; M-step weighted MLE — derived, not stated"
          - "The ELBO decomposition log p = L(q,θ) + KL(q‖p): E-step closes the gap, M-step lifts the bound — monotonicity proved"
          - "k-means as the σ²→0 limit; the 1977 Dempster–Laird–Rubin genetics example with its 0.1328 convergence ratio"
          - "Pathologies: likelihood singularities (σ→0 spikes), label switching, slow convergence when components overlap"

          - "Resampling distorts calibration — the prior-correction formula, derived"
          - "Leakage taxonomy: target, temporal, group, train-test contamination — each with a real case"
          - "Detection heuristics: too-good scores, suspicious importances, collapse on time-split"
          - "The KDDCUP99 fragility case: 6.2% → 18% from shuffling training order"

          reinforces: [maximum-likelihood, cramer-rao-bound, bias-variance-decomposition]
        key_ideas:
          - "Matrix-calculus derivation of ∇J = XᵀXβ − Xᵀy = 0, every step shown"
          - "Geometric view: ŷ is the orthogonal projection of y onto the column space of X; residuals ⊥ columns"
          - "Least squares = MLE under iid Gaussian noise; sampling distribution of β̂ and its covariance σ²(XᵀX)⁻¹"
          - "Gauss–Markov proved in full: BLUE under exogeneity, homoscedasticity, full rank"
          - "When XᵀX is singular (collinearity, p>n) — the door to ridge"

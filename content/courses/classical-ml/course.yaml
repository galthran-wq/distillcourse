          - "The smoothing spline: penalized RSS over all functions has a finite-dimensional minimizer — a generalized ridge regression"
          - "Effective df = trace of the smoother matrix: one scale for splines, ridge, and k-NN alike"
          - "GAMs: sum of one-dimensional smooths, fitted by backfitting on partial residuals"
          - "The bone-density and phoneme set pieces: real curves no global polynomial fits"

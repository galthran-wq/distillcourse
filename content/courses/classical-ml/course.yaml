              text: "Recover the six generating centers of the blob data with a seeded-restart pipeline of your own design"
              required: false

  - slug: learning-theory
    title: "Statistical learning theory"
    outcomes: [co-theory]
    lessons:
      - slug: learning-theory
        title: "PAC learning and finite hypothesis classes"
        type: core
        status: planned
        goal: "Derive the finite-class PAC bounds from Hoeffding's inequality and the union bound, and state No Free Lunch as the reason inductive bias is mandatory"
        opening: "Every method so far was validated empirically; this module proves guarantees, and the first one is elementary — for a finite hypothesis class, empirical risk concentrates around true risk uniformly, at a cost logarithmic in the class size."
        est_minutes: 42
        prerequisites: [bias-variance, cross-validation-bootstrap]
        concepts:
          introduces: [pac-learning, hoeffding-inequality, union-bound, generalization-bound, no-free-lunch]
          reinforces: [empirical-risk-minimization, generalization-error, overfitting, bias-variance-decomposition]
        key_ideas:
          - "Hoeffding for one hypothesis; the 1000-coins trap showing why one bound is not enough"
          - "Union bound over the class: log|H|/ε² sample complexity (realizable: log|H|/ε) — both proved"
          - "The estimation/approximation decomposition — the theory's version of bias–variance"
          - "No Free Lunch, proved by the averaging argument: no learner wins without bias"
          - "The gap: every interesting class is infinite — the flaw the next lesson repairs"
        demo: null
      - slug: vc-dimension
        title: "VC dimension and the fundamental theorem"
        type: core
        status: planned
        goal: "Compute VC dimensions, prove Sauer's lemma, and state the fundamental theorem tying finite VC dimension to PAC learnability"
        opening: "An infinite hypothesis class can behave like a finite one: what matters is not how many hypotheses exist but how many labelings they realize on n points — and that count is either 2ⁿ forever or a polynomial, with nothing in between."
        est_minutes: 44
        prerequisites: [learning-theory]
        concepts:
          introduces: [vc-dimension, growth-function, sauer-lemma]
          reinforces: [pac-learning, hoeffding-inequality, union-bound, generalization-bound]
        key_ideas:
          - "Shattering; VC dims computed by hand: thresholds 1, intervals 2, rectangles 4, halfspaces d+1 (via Radon)"
          - "The one-parameter class with infinite VC dimension (sin ωx) — parameters ≠ capacity"
          - "Sauer's lemma proved; the polynomial/exponential dichotomy"
          - "The fundamental theorem: finite VC ⟺ learnable, with the Θ((d + log 1/δ)/ε²) rates and the lower bound stated"
          - "Applying it: the VC bound on the course's own models — and where it goes vacuous (kernels, boosting)"
        demo: null
      - slug: rademacher-stability
        title: "Rademacher complexity and stability"
        type: core
        status: planned
        goal: "Derive Rademacher-complexity generalization bounds and prove that Tikhonov-regularized algorithms are stable, connecting regularization directly to generalization"
        opening: "Two refinements replace counting with geometry: Rademacher complexity measures how well a class correlates with random noise on the actual data, and algorithmic stability bounds generalization with no capacity measure at all — regularization is stability."
        est_minutes: 44
        prerequisites: [vc-dimension, ridge-lasso]
        concepts:
          introduces: [rademacher-complexity, uniform-stability]
          reinforces: [vc-dimension, regularization, ridge-regression, kernel-trick, generalization-bound]
        key_ideas:
          - "Rademacher complexity defined; the master bound via McDiarmid (proof roadmap, key steps shown)"
          - "Computed for linear classes: the ‖w‖≤Λ ball has complexity rΛ/√n — no dimension anywhere"
          - "The kernel version: √(Tr[K])Λ/n — an infinite-dimensional feature space with a finite bound"
          - "Uniform stability: definition, the stability⇒generalization theorem, and β ≤ σ²r²/(mλ) for ridge/SVM/KRR"
          - "Two lenses, one lesson: capacity bounds the class, stability bounds the algorithm"
        demo: null
      - slug: margin-bounds
        title: "Margin bounds: why kernels and boosting generalize"
        type: core
        status: planned
        goal: "Derive margin-based generalization bounds and use them to settle the module's two debts: infinite-dimensional kernel machines and AdaBoost's post-zero-error improvement"
        opening: "Two facts the course left unexplained — a kernel SVM working in an infinite-dimensional feature space, and AdaBoost's test error falling for hundreds of rounds after training error reaches zero — have the same explanation, and it is the margin."
        est_minutes: 44
        prerequisites: [rademacher-stability, svm-dual-kernels, adaboost]
        concepts:
          introduces: [margin-bound, margin-distribution]
          reinforces: [maximum-margin, kernel-trick, adaboost, rademacher-complexity, vc-dimension, support-vectors]
        key_ideas:
          - "The margin loss; the SVM margin bound O(√(r²Λ²/ρ² /n)) — dimension absent, derived via contraction"
          - "Debt 1 paid: the kernel bound depends on Tr[K] and the margin, not on feature dimension"
          - "Boosting margins: L1-margin, the ensemble bound independent of T; AdaBoost provably pushes margin mass right"
          - "Debt 2 paid: test error falls because margins keep growing after training error is zero"
          - "Honesty section: bounds are loose; Breiman's min-margin LP counterexample; what the theory does and does not claim"
        demo: null
      - slug: bounds-vs-practice
        title: "Bounds against practice: the margin experiment"
        type: core
        status: planned
        goal: "Test the module's explanations against data: reproduce the boosting-margin experiment and compute the bounds numerically to judge which survive"
        opening: "The margin theory makes measurable claims: run AdaBoost for a thousand rounds, plot the margin distribution at rounds 5, 100, and 1000, and the curves must march right while test error falls — this lesson runs the experiment and prices every bound in the module."
        est_minutes: 30
        prerequisites: [margin-bounds]
        concepts:
          introduces: []
          reinforces: [margin-distribution, margin-bound, vc-dimension, rademacher-complexity, adaboost, bagging]
        key_ideas:
          - "The artifact: Schapire–Freund–Bartlett–Lee Figure 1 reproduced — error curves over margin CDFs"
          - "Numbers into bounds: the VC bound goes vacuous at these sample sizes; the margin bound is loose but directionally right"
          - "The delta-function construction: zero training error with O(1/n) margins and no generalization — voting is not smoothing"
          - "What an engineer keeps: margins as a diagnostic, bounds as explanations, CV as the measurement"
        demo: null

  - slug: uncertainty
    title: "Predictions with guarantees"
    outcomes: [co-evaluate, co-derive, co-implement]
    lessons:
      - slug: bayesian-linear-regression
        title: "Bayesian linear regression"
        type: core
        status: planned
        goal: "Derive the posterior and posterior-predictive distributions for linear regression and use the marginal likelihood for model selection"
        opening: "Keep the full posterior instead of its mode and the linear model prices its own uncertainty: the predictive variance splits into noise plus a parameter-uncertainty term that grows away from the data and shrinks as data accumulates."
        est_minutes: 40
        prerequisites: [ridge-lasso, mle-map]
        concepts:
          introduces: [posterior-predictive, marginal-likelihood, bayesian-occam]
          reinforces: [map-estimation, ridge-regression, maximum-likelihood, cramer-rao-bound]
        key_ideas:
          - "Conjugate Gaussian posterior derived by completing the square; MAP = ridge recovered as the mode"
          - "Sequential updating: the prior-to-posterior film as data arrives one point at a time"
          - "Posterior predictive: σ² + xᵀΣx — error bars that widen off the data, plotted"
          - "Marginal likelihood and Bayesian Occam's razor: complexity penalized automatically"
          - "The flaw that remains: everything is conditional on the model — the exit conformal will take"
        demo: null
      - slug: gaussian-processes
        title: "Gaussian processes"
        type: core
        status: planned
        goal: "Derive GP regression from Bayesian linear regression via the kernel trick and fit hyperparameters by maximizing the marginal likelihood"
        opening: "Push Bayesian linear regression through the kernel trick and the prior becomes a distribution over functions: a Gaussian process, whose posterior mean and variance have closed forms and whose kernel is chosen by the data itself."
        est_minutes: 44
        prerequisites: [bayesian-linear-regression, svm-dual-kernels]
        concepts:
          introduces: [gaussian-process, covariance-function]
          reinforces: [kernel-trick, posterior-predictive, marginal-likelihood, bayesian-occam]
        key_ideas:
          - "Weight space to function space: the equivalence proved; a GP is Bayesian linear regression with an implicit basis"
          - "The predictive equations derived by Gaussian conditioning; Algorithm 2.1 (Cholesky, O(n³))"
          - "Kernels as assumptions: SE, Matérn, periodic; samples from each prior; kernel algebra"
          - "Hyperparameters by marginal likelihood: data-fit vs complexity, the two-local-optima example"
          - "GPs vs SVMs vs ridge: one kernel machine family, three losses"
        demo:
          component: GpPosteriorExplorer
          spec: >-
            1D GP with SE kernel; click to add observations, posterior mean
            and 95% band update live; lengthscale presets (short/medium/
            long) and a noise toggle. Task: pin the band below a stated
            width over [0,1] using as few points as possible, then switch
            lengthscale and verify the same points no longer suffice — the
            prior is doing real work.
      - slug: conformal-prediction
        title: "Conformal prediction"
        type: core
        status: planned
        goal: "Construct split-conformal prediction sets, prove the coverage guarantee from exchangeability, and choose score functions for regression and classification"
        opening: "One held-out quantile turns any model's scores into prediction sets with guaranteed coverage: no distributional assumptions, no model correctness — only exchangeability — and the proof fits in a paragraph."
        est_minutes: 40
        prerequisites: [cross-validation-bootstrap, classification-metrics]
        concepts:
          introduces: [conformal-prediction, conformal-score, marginal-coverage]
          reinforces: [calibration, cross-validation, posterior-predictive, precision-recall]
        key_ideas:
          - "The four-step recipe: heuristic score → calibration quantile → prediction set; the fox-squirrel worked example"
          - "The coverage theorem proved: exchangeability makes the test score uniform among calibration scores"
          - "Scores matter: softmax threshold vs APS; conformalized quantile regression for intervals"
          - "Marginal vs conditional coverage: the two-group counterexample; group-balanced calibration"
          - "Calibration-set size: coverage is Beta-distributed; why n≈1000 is the working rule"
        demo: null
      - slug: mauna-loa
        title: "Forecasting CO₂: the Mauna Loa Gaussian process"
        type: core
        status: planned
        goal: "Build the Mauna Loa CO₂ model — a composite kernel fitted by marginal likelihood — and evaluate its 20-year extrapolation against what actually happened"
        opening: "Forty-five years of atmospheric CO₂ measurements from one Hawaiian observatory, one composite kernel — trend, seasonal, medium-term, noise — and every hyperparameter chosen by the marginal likelihood alone: the canonical Gaussian-process application, checkable against the atmosphere itself."
        est_minutes: 30
        prerequisites: [gaussian-processes]
        concepts:
          introduces: []
          reinforces: [gaussian-process, covariance-function, marginal-likelihood, bayesian-occam]
        key_ideas:
          - "The artifact: Rasmussen & Williams §5.4.3 — the 11-hyperparameter composite kernel, term by term"
          - "Kernel engineering as hypothesis writing: each additive term is a claim about the atmosphere"
          - "The extrapolation with honestly widening bands — and the check against post-2003 data"
          - "Departures from the idealization: the trend is not stationary, the model knows no physics"
        demo: null
      - slug: gp-lab
        title: "Lab: Gaussian process regression with conformal intervals"
        type: lab
        status: planned
        goal: "Implement GP regression via Cholesky factorization — predictive mean, variance, log marginal likelihood, hyperparameter selection — then wrap any model in split-conformal intervals and verify empirical coverage"
        opening: "Uncertainty becomes code twice over: your own GP delivers error bars that believe the kernel, your own conformal wrapper delivers coverage that believes nothing, and the lab ends by measuring both on held-out data."
        est_minutes: 12
        prerequisites: [gaussian-processes, conformal-prediction]
        concepts:
          introduces: []
          reinforces: [gaussian-process, covariance-function, marginal-likelihood, conformal-prediction, marginal-coverage]
        key_ideas:
          - "Algorithm 2.1 verbatim: Cholesky solve, never a matrix inverse"
          - "The log marginal likelihood as one number that ranks kernels"
          - "Split conformal in twelve lines; coverage measured, not assumed"
          - "GP bands vs conformal bands on the same data: assumptions priced"

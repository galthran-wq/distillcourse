schema_version: 1
slug: classical-ml
title: Classical Machine Learning
tagline: Why a finite sample guarantees anything about the future — the classical canon, derived in full
status: planned
audience: >
  Engineers who want classical machine learning as a discipline, not a
  checklist: full derivations, the theory that explains why the methods
  generalize, and labs that rebuild the toolkit from scratch. Comfortable
  with linear algebra, multivariable calculus, and probability; no prior
  ML coursework assumed, but the pace is set for readers who can follow a
  proof.
tone: >
  Dry, precise, engineering register. Declarative statements of fact; no
  rhetorical questions, no teasers. Derivations carried through with every
  step visible. Second person only in instructions.
intro: >
  Every method in this course answers one question: why does a model fitted
  to a finite sample say anything about data it has never seen? A lookup
  table that memorizes the training set achieves zero training error and
  learns nothing — so training error alone guarantees nothing, and whatever
  separates learning from fitting must come from somewhere else: from
  restricting the model, penalizing its complexity, averaging its
  fluctuations, or measuring it honestly on data it never touched.


  The course develops the classical toolkit as successive answers to that
  question. Estimation theory says how well any procedure can do
  (Cramér–Rao); the linear model trades bias for variance explicitly
  (ridge, lasso, splines); three roads lead to a classification boundary
  (likelihood, generative modeling, the margin); resampling makes
  measurement honest; trees and smoothers give up the global formula and
  pay in variance; ensembles win it back by averaging and boosting. Then
  the payoff: a full module of learning theory — PAC bounds, VC dimension,
  Rademacher complexity, stability, margins — that settles debts the
  methods left open, including why a kernel machine in an
  infinite-dimensional feature space does not overfit and why AdaBoost's
  test error keeps falling after training error hits zero. The course
  closes with prediction under honest uncertainty (Bayesian regression,
  Gaussian processes, conformal prediction) and with the places the
  classical story breaks: double descent, benign overfitting, and why
  boosted trees still beat deep learning on tables.
prerequisites:
  - text: "Linear algebra: matrix multiplication, eigenvalues and eigenvectors, projections, comfortable matrix notation"
  - text: "Multivariable calculus: gradients, partial derivatives, Lagrange multipliers seen at least once"
  - text: "Probability: distributions, expectation, variance, Bayes' rule, independence, the Gaussian"
  - text: "Python and numpy at working-engineer level (labs are notebook assignments)"
key_results:
  - text: "A memorizing predictor attains zero training error and chance-level risk — training error alone guarantees nothing"
    lesson: statistical-learning
  - text: "Expected test error decomposes exactly as irreducible noise plus squared bias plus variance"
    lesson: bias-variance
  - text: "No unbiased estimator beats the Cramér–Rao floor $1/(n I(\\theta))$; the MLE attains it asymptotically"
    lesson: fisher-information
  - text: "The OLS estimator $(X^TX)^{-1}X^Ty$ is the minimum-variance linear unbiased estimator (Gauss–Markov)"
    lesson: ols
  - text: "The $\\ell_1$ penalty soft-thresholds coefficients to exact zeros; the $\\ell_2$ penalty only shrinks"
    lesson: ridge-lasso
  - text: "The SVM dual depends on data only through inner products, so a kernel buys an implicit feature space at no cost"
    lesson: svm-dual-kernels
  - text: "Averaging $B$ trees with pairwise correlation $\\rho$ leaves a variance floor $\\rho\\sigma^2$; random forests attack $\\rho$"
    lesson: bagging-random-forests
  - text: "AdaBoost is stagewise minimization of exponential loss, with training error at most $\\exp(-2\\sum_t \\gamma_t^2)$"
    lesson: adaboost
  - text: "Each EM iteration provably increases the observed-data likelihood"
    lesson: gmm-em
  - text: "The direction of maximum projected variance is the top eigenvector of the covariance matrix"
    lesson: pca
  - text: "Finite VC dimension is equivalent to PAC learnability, with matching upper and lower sample-complexity bounds"
    lesson: vc-dimension
  - text: "Margin bounds independent of dimension and of round count explain why kernel SVMs and boosting resist overfitting"
    lesson: margin-bounds
  - text: "Split-conformal prediction sets cover with probability at least $1-\\alpha$ for any model and any distribution"
    lesson: conformal-prediction
  - text: "Past the interpolation threshold, test risk can descend a second time — the classical U-curve is one half of the picture"
    lesson: double-descent

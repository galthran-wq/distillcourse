  - slug: epilogue
    title: "Where the classical story breaks"
    outcomes: [co-limits]
    lessons:
      - slug: double-descent
        title: "Double descent and benign overfitting"
        type: core
        status: planned
        goal: "Explain the double-descent risk curve, derive why minimum-norm interpolation can generalize, and analyze what the classical bounds fail to capture"
        opening: "The U-shaped test-error curve this course opened with is one half of the picture: push model capacity past the interpolation threshold and test error can fall a second time — on the same data, with zero training error throughout."
        est_minutes: 42
        prerequisites: [vc-dimension, ridge-lasso, splines-gams]
        concepts:
          introduces: [double-descent, interpolation-threshold, min-norm-interpolation, benign-overfitting]
          reinforces: [bias-variance-decomposition, overfitting, generalization-bound, ridge-regression, vc-dimension]
        key_ideas:
          - "The curve: Belkin's RFF-on-MNIST spike at N=n (88% error) and second descent to 2%, below the classical optimum"
          - "The mechanism: among interpolants, gradient descent finds the minimum-norm one, and more parameters mean smaller norm — the 1D ReLU example worked"
          - "Ridgeless asymptotics: the exact risk formula with its pole at γ=1; when optimal ridge is λ→0"
          - "Benign overfitting: the effective-rank conditions, stated and read"
          - "Why uniform convergence cannot explain it: the bounds are two-sided, interpolation is not — what survives (norms, margins, stability)"
        demo: null
      - slug: random-features
        title: "Random features: kernels meet networks"
        type: core
        status: planned
        goal: "Derive random Fourier features from Bochner's theorem and explain how they bridge kernel machines, double descent, and infinite-width networks"
        opening: "A random projection followed by a cosine is an unbiased estimate of a kernel: sample enough of them and a linear model on random features is a kernel machine — and a one-hidden-layer network whose first layer nobody trained."
        est_minutes: 38
        prerequisites: [double-descent, svm-dual-kernels, gaussian-processes]
        concepts:
          introduces: [random-fourier-features]
          reinforces: [kernel-trick, gaussian-process, double-descent, min-norm-interpolation]
        key_ideas:
          - "Bochner's theorem: shift-invariant PSD kernels are Fourier transforms of distributions — sample the frequency"
          - "The construction and its uniform approximation guarantee; the Gaussian/Laplacian/Cauchy sampling table"
          - "O(N·d) kernel machines become O(D+d) linear models: the benchmark numbers (Forest Cover, 44h → 25min)"
          - "The bridge read both ways: RFF models are where double descent was first demonstrated; infinite random features recover the kernel, infinite-width networks recover a GP"
          - "What 'classical vs deep' actually contrasts: fixed random features vs learned features"
        demo: null
      - slug: tabular-showdown
        title: "The tabular showdown: trees versus deep learning"
        type: core
        status: planned
        goal: "Evaluate the evidence that tree ensembles beat deep learning on tabular data and attribute the gap to inductive biases the course has named"
        opening: "On 45 curated tabular datasets, tuned tree ensembles beat tuned neural networks at every hyperparameter budget — and the three reasons why are inductive biases this course has spent eleven modules naming."
        est_minutes: 34
        prerequisites: [xgboost, double-descent]
        concepts:
          introduces: []
          reinforces: [gradient-boosting, random-forest, bias-variance-decomposition, curse-of-dimensionality, regularization]
        key_ideas:
          - "The artifact: Grinsztajn et al.'s benchmark — normalized score vs search budget, trees on top throughout"
          - "Finding 1: targets are irregular; smoothing them hurts trees, not networks — spectral bias meets piecewise-constant fits"
          - "Finding 2: tabular data is full of uninformative features; MLPs are not robust to them, trees are"
          - "Finding 3: rotating the feature basis reverses the ranking — tabular columns are a meaningful basis, and rotation-invariant learners pay for ignoring that"
          - "The close: the course's one question answered per regime — what constrains, what averages, what measures"
        demo: null

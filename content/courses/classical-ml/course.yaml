        goal: "Derive the EM updates for a Gaussian mixture and prove each iteration increases the likelihood"
        opening: "Replacing k-means' hard assignments with posterior probabilities gives the Gaussian mixture model; EM alternates computing those responsibilities with weighted maximum likelihood, and each iteration provably increases the likelihood."

        title: "Ridge and lasso regularization"
        type: core
        status: drafted
        key_image: figures/three-operators.svg
        goal: "Explain why the L1 penalty produces exact zeros while L2 only shrinks, using constraint geometry, soft thresholding, and Bayesian priors"
        opening: "Adding a penalty on coefficient size trades bias for variance; the shape of the penalty — disk or diamond — decides whether coefficients shrink or vanish."
        est_minutes: 40
        prerequisites: [ols, bias-variance]
        concepts:
          introduces: [regularization, ridge-regression, lasso, soft-thresholding]
          reinforces: [bias-variance-decomposition, map-estimation, ordinary-least-squares, gauss-markov]
        key_ideas:
          - "Ridge closed form (XᵀX+λI)⁻¹Xᵀy; SVD view: direction j shrinks by d_j²/(d_j²+λ) — small-variance directions shrink hardest"
          - "Ridge's bias–variance ledger computed exactly; the existence of a λ>0 beating OLS in MSE"
          - "Orthonormal case: ridge shrinks proportionally, best subset hard-thresholds, lasso soft-thresholds — one table"
          - "The diamond-vs-disk constraint picture; lasso path is piecewise linear; elastic net"
          - "Bayesian reading: Gaussian prior = ridge, Laplace prior = lasso; standardize before penalizing"
        demo: null
      - slug: regression-diagnostics
        title: "Linear regression assumptions and diagnostics"
        type: core
        status: drafted
        key_image: figures/potoroo.svg
        goal: "Analyze violations of the linear-model assumptions — collinearity, heteroscedasticity, outliers, leverage — and select the standard remedies"

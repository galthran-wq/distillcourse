        title: "Basis expansions, splines, and additive models"
        type: core
        status: drafted
        key_image: figures/df-ruler.svg
        goal: "Construct spline bases and smoothing splines, measure their complexity in effective degrees of freedom, and extend them to additive models by backfitting"
        opening: "The linear model is linear in coefficients, not in inputs: replace x with a spline basis and the same least-squares machinery fits curves — with a penalty whose effective degrees of freedom put every smoother on one complexity scale."
        est_minutes: 40
        prerequisites: [ridge-lasso, regression-diagnostics, glm]
        concepts:

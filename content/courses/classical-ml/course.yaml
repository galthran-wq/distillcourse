spine:
  - step: >-
      A finite sample can be fitted perfectly and teach nothing: risk, not
      training error, is the object of learning, and every estimator pays
      for flexibility in variance.
    label: Fitting is not learning
    years: "1950–1970"
    caption: >-
      A lookup table scores 100% on the data it saw and 50% on everything
      else; a rule barely better than a coin toss, applied to nearest
      neighbors, comes within a factor of two of the best possible
      classifier.
    lessons: [statistical-learning, bias-variance, knn-curse, zipcode-digits]
  - step: >-
      Estimation has a common engine — the likelihood — and a floor: Fisher
      information bounds what any unbiased estimator can achieve, and
      maximum likelihood attains it in the limit.
    label: Estimation is likelihood
    years: "1912–1946"
    caption: >-
      One recipe (write the log-likelihood, set the derivative to zero)
      produces the sample mean, the regression line, and the logistic
      classifier; the Cramér–Rao bound says nothing systematically beats it.
    lessons: [mle-map, fisher-information, gradient-descent, glm, insurance-claims]
  - step: >-
      The linear model makes the bias–variance trade explicit: least
      squares projects, penalties shrink, and basis expansions buy
      flexibility while the penalty keeps the variance bill payable.
    label: The linear model as projection
    years: "1805–1996"
    caption: >-
      On 97 prostate-cancer patients, plain least squares, ridge, and the
      lasso give three different answers to the same question — and the
      lasso's answer uses only three of eight measurements.
    lessons: [ols, ridge-lasso, regression-diagnostics, splines-gams, prostate-study, regularization-lab]
  - step: >-
      Three independent principles — model the log-odds, model each class,
      maximize the margin — all arrive at a linear boundary, and their
      disagreements are exactly the generative–discriminative and
      probability–geometry trade-offs.
    label: Three roads to a boundary
    years: "1936–1995"
    caption: >-
      Fisher's discriminant (1936), the logistic model, and Vapnik's
      maximum-margin hyperplane (1995) draw three different lines through
      the same two clouds of points — and each is optimal for a different
      reason.
    lessons: [logistic-regression, naive-bayes, lda-gda, svm-max-margin, svm-dual-kernels, spam-filter, logreg-lab]
  - step: >-
      Measurement is part of the method: the metric defines the task,
      resampling estimates risk honestly, and leakage — not underfitting —
      is how good-looking models fail.
    label: Measurement is part of the method
    years: "1974–1997"
    caption: >-
      Screening features on the full dataset before cross-validating
      reports 3% error on a problem whose true error is 50% — a blunder
      published in top journals, reproduced here so it is never repeated.
    lessons: [classification-metrics, cross-validation-bootstrap, imbalance-leakage, feature-engineering, wrong-way-cv, validation-lab]
  - step: >-
      Giving up the global formula: local averages and recursive partitions
      fit anything, and pay for it in variance — the flaw the next step
      resolves.
    label: Local and recursive models
    years: "1979–1984"
    caption: >-
      A weighted average that follows the data recovers a curve no
      parametric family contains; a tree of yes/no questions reads its own
      reasoning aloud — and one changed training point redraws it.
    lessons: [kernel-smoothing, decision-trees, spam-tree]
  - step: >-
      The ensemble resolution: averaging kills the variance trees pay,
      boosting drives bias down by stagewise refitting, and a second-order
      objective turns boosting into the workhorse of tabular ML.
    label: The ensemble resolution
    years: "1996–2016"
    caption: >-
      Four hundred coin-toss-grade stumps, reweighted round by round, beat
      a full-grown tree; on the same spam corpus the race finishes bagging
      5.4%, random forest 4.9%, gradient boosting 4.5%.
    lessons: [bagging-random-forests, adaboost, gradient-boosting, xgboost, shap-interpretability, spam-ensembles, boosting-lab]
  - step: >-
      Structure without labels: the same machinery — means, likelihoods,
      eigenvectors — organizes data when no target exists, and its failure
      modes are geometric.
    label: Structure without labels
    years: "1901–2018"
    caption: >-
      Clustering a gene-expression matrix finds coarse tumor structure that
      survives resampling — and shows why a flag is not a finding; an
      eigenvector of a graph separates clusters no centroid can.
    lessons: [kmeans, hierarchical-dbscan, gmm-em, pca, spectral-clustering, tsne, tumor-microarray, clustering-lab]
  - step: >-
      Why any of it works: concentration plus a capacity measure turns
      finite samples into guarantees, and margin bounds settle the two
      debts the methods left open — infinite-dimensional kernels and
      boosting's unreasonable test curve.
    label: Why it works
    years: "1971–2002"
    caption: >-
      A bound with no dimension in it explains the kernel SVM; a bound with
      no round count in it explains AdaBoost — both were mysteries the
      U-curve could not touch.
    lessons: [learning-theory, vc-dimension, rademacher-stability, margin-bounds, bounds-vs-practice]
  - step: >-
      Predictions with guarantees: put the distribution back — a posterior
      over functions prices its own uncertainty, and conformal calibration
      makes any model's error bars honest without believing its
      assumptions.
    label: Predictions with guarantees
    years: "1996–2021"
    caption: >-
      A Gaussian process extrapolates atmospheric CO₂ twenty years out with
      bands that widen honestly; a conformal wrapper turns any classifier's
      scores into sets that cover 90% of the time, provably.
    lessons: [bayesian-linear-regression, gaussian-processes, conformal-prediction, mauna-loa, gp-lab]
  - step: >-
      Where the classical story breaks: interpolating models generalize,
      uniform convergence cannot explain it, random features bridge kernels
      to networks — and on tables, the classical ensemble still wins.
    label: Where the classical story breaks
    years: "2017–2022"
    caption: >-
      A model with zero training error was supposed to generalize poorly;
      past the interpolation threshold, test error falls again — and on 45
      tabular datasets the boosted tree still beats the neural network.
    lessons: [double-descent, random-features, tabular-showdown]

outcomes:
  - id: co-frame
    text: >-
      Place any classical method on the bias–variance and generalization
      axis: state what it constrains, what it estimates, and where its
      error comes from
    bloom: analyze
  - id: co-derive
    text: >-
      Reproduce the canonical derivations in full — OLS normal equations,
      bias–variance decomposition, Cramér–Rao bound, lasso soft
      thresholding, SVM dual, EM updates, PCA eigendecomposition, boosting
      objectives, GP posterior
    bloom: apply
  - id: co-implement
    text: >-
      Implement the classical toolkit from scratch in numpy — penalized
      linear models, logistic regression, boosted trees, k-means and EM,
      GP regression with conformal intervals — and verify each against
      held-out checkpoints
    bloom: create
  - id: co-evaluate
    text: >-
      Design honest measurement: choose metrics under imbalance, build
      leak-free validation protocols, and calibrate or conformalize a
      model's uncertainty
    bloom: evaluate
  - id: co-theory
    text: >-
      Prove the finite-sample guarantees — Hoeffding, VC, Rademacher,
      stability, margin bounds — and use them to explain why kernel
      machines and boosting generalize
    bloom: analyze
  - id: co-limits
    text: >-
      Judge where the classical account fails — double descent, benign
      overfitting, the tabular showdown — and which classical explanations
      survive the evidence
    bloom: evaluate

modules:
  - slug: generalization
    title: "Generalization: risk, bias, and variance"
    outcomes: [co-frame, co-derive]
    lessons:
      - slug: statistical-learning
        title: "The statistical learning problem"
        type: core
        status: drafted
        key_image: figures/mixture-3.svg
        goal: "Explain why minimizing training error is not the same as learning, using risk, the Bayes predictor, and the memorizing counterexample"
        opening: "A predictor that memorizes its training set achieves zero training error and predicts no better than chance on everything else — so whatever learning is, it is not the minimization of training error."
        est_minutes: 34
        prerequisites: []
        concepts:
          introduces: [risk, empirical-risk-minimization, bayes-predictor, generalization-error, overfitting]
          reinforces: []
        key_ideas:
          - "The setup: data from an unknown distribution, a loss, and risk as expected loss on a fresh draw"
          - "The Bayes predictor: conditional mean under squared loss, majority class under 0–1 loss — the floor no method beats"
          - "The memorizer: zero empirical risk, chance-level true risk (the papaya example, worked)"
          - "ERM over a restricted class as the fix; inductive bias is the price of generalizing"
          - "Least squares vs 1-nearest-neighbor on the same two-class data: two extreme bias–variance postures"
        demo: null
      - slug: bias-variance
        title: "The bias–variance decomposition"
        type: core
        status: drafted
        key_image: figures/spaghetti-4.svg
        goal: "Derive the bias–variance decomposition of expected test error and use it to diagnose underfitting and overfitting"
        opening: "Expected prediction error at a point splits exactly into three terms — irreducible noise, squared bias, and variance — and every modeling choice in classical machine learning trades one term against another."
        est_minutes: 36
        prerequisites: [statistical-learning]
        concepts:
          introduces: [bias-variance-decomposition]
          reinforces: [risk, generalization-error, overfitting, bayes-predictor]
        key_ideas:
          - "The full decomposition proof: add and subtract E[f̂], cross terms vanish — every step shown"
          - "The U-shaped test-error curve: bias falls and variance rises with flexibility"
          - "Closed forms for k-NN and linear fits; why 0–1 loss does not decompose additively"
          - "Diagnosis from learning curves: high bias vs high variance and what fixes each"
          - "A well-aimed biased estimator can beat the unbiased one in MSE (shrinkage preview)"
        demo:
          component: BiasVarianceExplorer
          spec: >-
            Polynomial degree slider (0–9) fitting noisy samples of a fixed
            smooth target; left panel data + fit, right panel train/test
            error vs degree with the current degree marked. Resample button
            draws a fresh training set. Tasks in prose: (1) find the degree
            minimizing test error; (2) at degree 9, resample five times and
            watch the fit swing — that swing is the variance term. Presets:
            underfit, sweet spot, overfit.
      - slug: knn-curse
        title: "Nearest neighbors and the curse of dimensionality"
        type: core
        status: drafted
        key_image: figures/knn-vote.svg
        goal: "Analyze k-NN as a bias–variance dial and quantify why local methods fail in high dimensions"
        opening: "The simplest classifier — vote among the nearest training points — is asymptotically within a factor of two of optimal, and high dimensionality is exactly what breaks it."
        est_minutes: 36
        prerequisites: [bias-variance]
        concepts:
          introduces: [k-nearest-neighbors, bayes-error, curse-of-dimensionality]
          reinforces: [bias-variance-decomposition, overfitting, bayes-predictor]
        key_ideas:
          - "k-NN mechanics; k as the bias–variance knob, with the exact k-NN decomposition from the previous lesson"
          - "Cover–Hart: asymptotic 1-NN error at most twice the Bayes error — proof sketch included"
          - "The curse quantified: edge length r^{1/p}, median distance to nearest neighbor, volume in the shell"
          - "The matching lower bound: sample size must scale exponentially in dimension — the curse is real, not an artifact"
          - "Why k-NN still works on real data: low intrinsic dimension (manifolds), the door to what follows"
        demo:
          component: KnnBoundaryExplorer
          spec: >-
            Two-class 2D mixture scatter (fixed); k slider 1–51 redraws the
            k-NN boundary and reports train and test error. Task: find the
            k minimizing test error, then set k=1 and identify the noise
            islands that vanish as k grows. Presets: k=1, k=15, k=51.
      - slug: zipcode-digits
        title: "Handwritten ZIP codes: a first benchmark"
        type: core
        status: drafted
        key_image: figures/error-ladder.svg
        goal: "Evaluate nearest-neighbor classification on the USPS digit benchmark and explain why invariance engineering beats raw distance"
        opening: "The US Postal Service's handwritten digits — 16×16 grids scanned from live mail — were classical ML's proving ground, and a nearest-neighbor rule with the right distance beat carefully engineered neural networks on them."
        est_minutes: 30
        prerequisites: [knn-curse]
        concepts:
          introduces: []
          reinforces: [k-nearest-neighbors, curse-of-dimensionality, bayes-error, bias-variance-decomposition]
        key_ideas:
          - "The benchmark: 256-dimensional pixel vectors, real handwriting, published error ladder (1-NN 5.5% → tangent distance 2.6% → 0.7% ensembles)"
          - "Why 1-NN works at all in 256 dimensions: digits live near a low-dimensional manifold"
          - "Tangent distance: building rotation/thickness invariance into the metric = injecting bias to cut variance"
          - "Where the idealization fails: non-iid mail streams, segmentation errors, rejection options"
        demo: null

  - slug: estimation
    title: "Likelihood and estimation"
    outcomes: [co-derive, co-frame]
    lessons:
      - slug: mle-map
        title: "Maximum likelihood and MAP estimation"
        type: core
        status: drafted
        key_image: figures/penalty-dictionary.svg
        goal: "Compute maximum-likelihood and MAP estimates for standard models and connect priors to regularization penalties"
        opening: "Most classical estimators are maximum-likelihood estimates in disguise, and every standard regularizer is the log of a prior."
        est_minutes: 34
        prerequisites: [statistical-learning]
        concepts:
          introduces: [maximum-likelihood, map-estimation]
          reinforces: [risk, empirical-risk-minimization]
        key_ideas:
          - "The two-step MLE recipe: write the log-likelihood, set the derivative to zero"
          - "Worked estimates: Bernoulli, Gaussian mean and variance (with the 1/n bias), categorical"
          - "MLE minimizes KL divergence to the empirical distribution — the ERM connection made exact"
          - "MAP = MLE plus log-prior; Beta prior = pseudo-counts; the black-swan zero-count failure"
          - "Gaussian prior gives L2, Laplace prior gives L1 — stated here, used all course"
        demo: null
      - slug: fisher-information
        title: "Fisher information and the Cramér–Rao bound"
        type: core
        status: drafted
        key_image: figures/floor-plot.svg
        goal: "Derive the Cramér–Rao lower bound from the score function and explain when the MLE attains it"
        opening: "Before asking which estimator to use, ask how well any estimator can possibly do: the Cramér–Rao bound puts a floor under the variance of every unbiased estimator, and the floor is one over the Fisher information."
        est_minutes: 38
        prerequisites: [mle-map, bias-variance]
        concepts:
          introduces: [score-function, fisher-information, cramer-rao-bound, asymptotic-efficiency]
          reinforces: [maximum-likelihood, bias-variance-decomposition]
        key_ideas:
          - "The score function, its zero mean, and Fisher information as its variance (and as expected negative curvature)"
          - "The Cramér–Rao proof: one Cauchy–Schwarz application, every step shown"
          - "Worked cases: Bernoulli, Poisson (X̄ is best possible), Gaussian variance (bound honest but unattainable)"
          - "Regularity matters: Uniform(0,θ) beats the 'bound' because support depends on θ"
          - "Asymptotic normality and efficiency of the MLE; biased estimators can still win in MSE"
        demo: null
      - slug: gradient-descent
        title: "Gradient descent and convex optimization"
        type: core
        status: drafted
        key_image: figures/gd-newton-3.svg
        goal: "Explain how batch gradient descent, SGD, and Newton's method minimize training loss and when each is appropriate"
        opening: "Nearly every model in this course is fit by minimizing a loss, and three iterative schemes — batch gradient descent, stochastic gradient descent, and Newton's method — cover almost all of classical practice."
        est_minutes: 38
        prerequisites: [mle-map]
        concepts:
          introduces: [gradient-descent, stochastic-gradient-descent, convexity]
          reinforces: [maximum-likelihood, empirical-risk-minimization]
        key_ideas:
          - "GD as repeated first-order steps; convergence on the elongated quadratic, learning-rate failure modes"
          - "Convexity: definition, first-order characterization, which classical losses are convex and why it buys global optima"
          - "SGD: one sample's gradient is an unbiased estimate of the risk gradient — learning directly on the population"
          - "Newton's method: quadratic convergence, O(d³) cost, the IRLS preview"
          - "The O(1/√T) convex-Lipschitz rate, stated with its meaning (proof deferred to a starred section)"
        demo:
          component: GradientDescentExplorer
          spec: >-
            2D loss-contour plot (elongated quadratic) with a start point;
            learning-rate slider and step button animate the trajectory.
            Task: find the largest learning rate that still converges, then
            compare against the Newton preset (one jump). Presets: slow
            zig-zag, good lr, divergent lr, Newton step. Loss-per-iteration
            readout.
      - slug: glm
        title: "Generalized linear models"
        type: core
        status: drafted
        key_image: figures/poisson-link-panels.svg
        goal: "Construct GLMs from the exponential family and derive linear, logistic, and Poisson regression as special cases"
        opening: "One recipe — an exponential-family response with a linear natural parameter — generates linear regression, logistic regression, and Poisson regression from the same three assumptions."
        est_minutes: 36
        prerequisites: [mle-map, gradient-descent]
        concepts:
          introduces: [exponential-family, generalized-linear-model, link-function, deviance]
          reinforces: [maximum-likelihood, gradient-descent, fisher-information]
        key_ideas:
          - "Exponential family form; Bernoulli, Gaussian, Poisson rewritten into it; log-partition derivatives give mean and variance"
          - "The three GLM assumptions; canonical links fall out rather than being chosen"
          - "The universal gradient (y−μ)x: one derivation covers least squares, logistic, Poisson"
          - "Deviance as the GLM's native loss; Fisher scoring = IRLS"
          - "Sufficient statistics and why exponential families are the ones with fixed-size summaries"
        demo: null
      - slug: insurance-claims
        title: "Insurance claims: Poisson regression at scale"
        type: core
        status: drafted
        key_image: figures/ranking-flip.svg
        goal: "Apply the GLM machinery to a real 678k-policy claims dataset and explain why deviance, not squared error, ranks the models"
        opening: "On 678,000 real French motor-insurance policies — 94% of them with zero claims — ridge regression predicts negative claim counts and squared error ranks it above the model that cannot; the GLM framework exists for exactly this data."
        est_minutes: 28
        prerequisites: [glm]
        concepts:
          introduces: []
          reinforces: [generalized-linear-model, deviance, link-function, maximum-likelihood]
        key_ideas:
          - "The artifact: Murphy's insurance-claims study — dummy, ridge, and Poisson models on one long-tailed target"
          - "Why the Gaussian likelihood is the wrong noise model for counts; the log link keeps rates positive"
          - "Deviance vs MSE: the metric that ranks the models correctly, computed by hand on the example"
          - "Calibration plots for rate models; where the idealization departs (exposure, non-iid portfolios, drift)"
        demo: null

  - slug: linear-model
    title: "The linear model"
    outcomes: [co-derive, co-implement, co-frame]
    lessons:
      - slug: ols
        title: "Ordinary least squares"
        type: core
        status: drafted
        key_image: figures/projection.svg
        goal: "Derive the OLS normal equations by matrix calculus and by projection geometry, and prove the Gauss–Markov theorem"
        opening: "The least-squares estimator has a closed form, (XᵀX)⁻¹Xᵀy, three independent derivations — calculus, geometry, likelihood — and a minimum-variance guarantee with explicit fine print."
        est_minutes: 38
        prerequisites: [mle-map, fisher-information]
        concepts:

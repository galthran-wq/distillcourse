<svg viewBox="0 0 620 185" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
<!-- panel 1: prior precision -->
<line x1="25" y1="80" x2="135" y2="80" stroke="currentColor" stroke-opacity="0.3"/>
<line x1="80" y1="25" x2="80" y2="135" stroke="currentColor" stroke-opacity="0.3"/>
<text x="138" y="84" font-size="9" fill="currentColor" opacity="0.55">w₁</text>
<text x="84" y="24" font-size="9" fill="currentColor" opacity="0.55">w₂</text>
<circle cx="80" cy="80" r="26" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5"/>
<text x="80" y="158" font-size="12" text-anchor="middle" fill="currentColor">prior&#160;&#160;τ⁻²I</text>
<text x="80" y="173" font-size="10" text-anchor="middle" fill="currentColor" opacity="0.55">same in every direction</text>
<text x="157" y="87" font-size="18" text-anchor="middle" fill="currentColor" opacity="0.7">+</text>
<!-- panel 2: first rank-one slab -->
<line x1="180" y1="80" x2="290" y2="80" stroke="currentColor" stroke-opacity="0.3"/>
<line x1="235" y1="25" x2="235" y2="135" stroke="currentColor" stroke-opacity="0.3"/>
<rect x="185" y="74" width="100" height="12" rx="6" fill="#e2903a" fill-opacity="0.35" stroke="#e2903a" stroke-width="1.4" transform="rotate(-25 235 80)"/>
<text x="235" y="158" font-size="12" text-anchor="middle" fill="currentColor">+&#160;&#160;σ⁻²x₁x₁ᵀ</text>
<text x="235" y="173" font-size="10" text-anchor="middle" fill="currentColor" opacity="0.55">precision along x₁ only</text>
<text x="312" y="87" font-size="18" text-anchor="middle" fill="currentColor" opacity="0.7">+</text>
<!-- panel 3: second rank-one slab -->
<line x1="335" y1="80" x2="445" y2="80" stroke="currentColor" stroke-opacity="0.3"/>
<line x1="390" y1="25" x2="390" y2="135" stroke="currentColor" stroke-opacity="0.3"/>
<rect x="340" y="74" width="100" height="12" rx="6" fill="#e2903a" fill-opacity="0.35" stroke="#e2903a" stroke-width="1.4" transform="rotate(-75 390 80)"/>
<text x="390" y="158" font-size="12" text-anchor="middle" fill="currentColor">+&#160;&#160;σ⁻²x₂x₂ᵀ</text>
<text x="390" y="173" font-size="10" text-anchor="middle" fill="currentColor" opacity="0.55">along x₂ only</text>
<text x="467" y="87" font-size="18" text-anchor="middle" fill="currentColor" opacity="0.7">=</text>
<!-- panel 4: posterior precision -->
<line x1="490" y1="80" x2="600" y2="80" stroke="currentColor" stroke-opacity="0.3"/>
<line x1="545" y1="25" x2="545" y2="135" stroke="currentColor" stroke-opacity="0.3"/>
<ellipse cx="545" cy="80" rx="40" ry="22" fill="#e2903a" fill-opacity="0.15" stroke="#e2903a" stroke-width="2" transform="rotate(-50 545 80)"/>
<text x="545" y="158" font-size="12" text-anchor="middle" fill="currentColor">=&#160;&#160;S₂⁻¹</text>
<text x="545" y="173" font-size="10" text-anchor="middle" fill="currentColor" opacity="0.55">every eigenvalue grew</text>
</svg>

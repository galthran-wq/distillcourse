<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .muted   { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .formula { fill: currentColor; font-size: 16px; }
    .strike  { stroke: currentColor; stroke-opacity: 0.7; stroke-width: 1.6; }
  </style>

  <text class="muted" x="40" y="30">setup: y = f + ε with E[ε] = 0, Var(ε) = σ², ε independent of S · all expectations over S and ε</text>
  <text class="muted" x="40" y="50">shorthand at the fixed test point x₀:  f = f(x₀),  f̂ = f̂_S(x₀),  f̄ = E_S[ f̂ ]</text>

  <text class="formula" x="40" y="100">E[(y − f̂)²]  =  E[( f + ε − f̂ )²]</text>
  <text class="muted" x="600" y="100" text-anchor="end">substitute y = f + ε</text>

  <text class="formula" x="76" y="142">=  E[( <tspan fill="#4c8dd6">(f − f̄)</tspan> + <tspan fill="#e2903a">(f̄ − f̂)</tspan> + ε )²]</text>
  <text class="muted" x="600" y="142" text-anchor="end">insert − f̄ + f̄, then group</text>

  <text class="formula" x="76" y="184">=  <tspan fill="#4c8dd6">(f − f̄)²</tspan> + <tspan fill="#e2903a">E[(f̄ − f̂)²]</tspan> + E[ε²]  +  two cross terms:</text>
  <text class="formula" x="120" y="222">2 (f − f̄) E[ f̄ − f̂ ]</text>
  <line class="strike" x1="112" y1="217" x2="292" y2="217"/>
  <text class="formula" x="380" y="222">2 E[( f − f̂ ) ε]</text>
  <line class="strike" x1="372" y1="217" x2="512" y2="217"/>
  <text class="muted" x="120" y="242">= 0:  f̄ is the mean of f̂ over S</text>
  <text class="muted" x="380" y="242">= 0:  ε ⊥ S and E[ε] = 0</text>
  <text class="muted" x="40" y="326" font-size="12.5" opacity="0.8">step 3: expand the square — both cross terms vanish</text>
</svg>

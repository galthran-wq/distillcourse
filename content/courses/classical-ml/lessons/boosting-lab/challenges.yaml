          def f(X_tr, y_tr, X_te, y_te, M, nus):
              import numpy as np
              out = np.empty((len(nus), M + 1))
              for i, nu in enumerate(nus):
                  f0, stumps = _boost(X_tr, y_tr, M, nu)
                  staged = _staged(f0, stumps, nu, X_tr)
                  out[i] = np.mean((staged - y_tr) ** 2, axis=1)
              return out

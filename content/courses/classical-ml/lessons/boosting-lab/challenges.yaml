    inputs_code: |
      # A Friedman-flavored surface: smooth term, step, interaction, noise.
      def make(n, rng):
          X = rng.uniform(-2, 2, size=(n, 5))
          y = (np.sin(1.5 * X[:, 0]) + (X[:, 1] > 0.3)
               + 0.5 * X[:, 2] * X[:, 3] + 0.3 * rng.normal(size=n))
          return X, y
      X_tr, y_tr = make(240, rng)
      X_te, y_te = make(160, rng)
      inputs = (X_tr, y_tr, X_te, y_te, 120, (1.0, 0.1))
    wrong:
      - hint: "Held-out means held out: the curves score the staged predictions on (X_te, y_te). The curve you returned falls forever, which is the training-error shape - section 2 proved training MSE cannot rise, so a curve with no minimum is measuring the wrong rows."

    kind: exact
    seed: 8
    atol: 1.0e-9
    inputs_code: |
      # Two continuous features and one coarse integer-valued one: the
      # coarse column has duplicated values AND carries the winning
      # split on this draw, so midpoint placement and tie handling are
      # both visible in the output.
      X = np.column_stack([rng.normal(size=40),
                           rng.uniform(-2, 2, size=40),
                           rng.integers(0, 5, size=40).astype(float)])
      y = 1.5 * (X[:, 1] > 0.4) - 0.5 * X[:, 2] + 0.2 * rng.normal(size=40)
      Xq = np.column_stack([rng.normal(size=12),
                            rng.uniform(-2, 2, size=12),
                            rng.integers(0, 5, size=12).astype(float)])
      inputs = (X, y, Xq)
    wrong:
      - hint: "The threshold is the midpoint between the two neighboring distinct values, not the last value on the left. A stump split AT a data value sends every future row that lands between the two training values to the wrong leaf."
        code: |
          def f(X, y, Xq):
              import numpy as np
              n = len(y)
              best_rss, best = np.inf, None
              for j in range(X.shape[1]):
                  order = np.argsort(X[:, j], kind="stable")
                  xs, ys = X[order, j], y[order]
                  cum, cumsq = np.cumsum(ys), np.cumsum(ys * ys)
                  nl = np.arange(1, n)
                  sl, s2l = cum[:-1], cumsq[:-1]
                  sr, s2r = cum[-1] - sl, cumsq[-1] - s2l
                  rss = (s2l - sl * sl / nl) + (s2r - sr * sr / (n - nl))
                  ok = np.flatnonzero(xs[1:] > xs[:-1])
                  if len(ok) == 0:
                      continue
                  i = ok[np.argmin(rss[ok])]
                  if rss[i] < best_rss:
                      best_rss = rss[i]
                      best = (float(j), float(xs[i]),
                              float(sl[i] / (i + 1)), float(sr[i] / (n - i - 1)))
              j, t, cl, cr = best
              return np.array(best), np.where(Xq[:, int(j)] <= t, cl, cr)
      - hint: "RSS sums squared deviations over rows. Averaging each side's variance instead unweights the counts, so a two-row leaf suddenly counts as much as a two-hundred-row one and the scan favors splits that isolate tiny pure groups."

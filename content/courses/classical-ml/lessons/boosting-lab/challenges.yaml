          def _staged(f0, stumps, nu, X):
              import numpy as np
              out = np.empty((len(stumps) + 1, len(X)))
              f_hat = np.full(len(X), float(f0))
              out[0] = f_hat
              for m in range(len(stumps)):
                  j, t, cl, cr = stumps[m]

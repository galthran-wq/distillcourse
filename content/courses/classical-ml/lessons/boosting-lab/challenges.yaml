  staged-predict:
    kind: exact
    seed: 303
    atol: 1.0e-6
    inputs_code: |
      # A hand-built model: staged prediction is pure accumulation, so
      # the stumps need not come from any fit.
      stumps = np.column_stack([
          rng.integers(0, 4, size=12).astype(float),
          rng.normal(size=12),
          rng.normal(size=12),
          rng.normal(size=12)])
      Xq = rng.normal(size=(9, 4))
      inputs = (0.7, stumps, 0.4, Xq)
    wrong:
      - hint: "Row 0 is the constant f0 - the model after ZERO stumps - and the matrix has M+1 rows. Starting the rows at one stump drops the baseline every curve in section 4 is anchored to."
        code: |
          def f(f0, stumps, nu, X):
              import numpy as np
              out = np.empty((len(stumps), len(X)))
              f_hat = np.full(len(X), float(f0))
              for m in range(len(stumps)):
                  j, t, cl, cr = stumps[m]
                  f_hat = f_hat + nu * np.where(X[:, int(j)] <= t, cl, cr)
                  out[m] = f_hat
              return out
      - hint: "The prefix models accumulate nu times each stump - the same nu the model was trained with. Summing raw stump outputs replays training at nu = 1 on a model fitted at nu."
        code: |
          def f(f0, stumps, nu, X):
              import numpy as np
              out = np.empty((len(stumps) + 1, len(X)))
              f_hat = np.full(len(X), float(f0))
              out[0] = f_hat
              for m in range(len(stumps)):
                  j, t, cl, cr = stumps[m]
                  f_hat = f_hat + np.where(X[:, int(j)] <= t, cl, cr)
                  out[m + 1] = f_hat
              return out

        code: |
          def f(X, y, Xq):
              import numpy as np
              n = len(y)
              best_rss, best = np.inf, None
              for j in range(X.shape[1]):
                  order = np.argsort(X[:, j], kind="stable")
                  xs, ys = X[order, j], y[order]
                  for i in range(1, n - 1):
                      if xs[i + 1] <= xs[i]:
                          continue
                      t = (xs[i] + xs[i + 1]) / 2
                      left, right = ys[:i], ys[i:]
                      rss = float(((left - left.mean()) ** 2).sum()
                                  + ((right - right.mean()) ** 2).sum())
                      if rss < best_rss:
                          best_rss = rss
                          best = (float(j), float(t),
                                  float(left.mean()), float(right.mean()))
              j, t, cl, cr = best
              return np.array(best), np.where(Xq[:, int(j)] <= t, cl, cr)

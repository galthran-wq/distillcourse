  why-small-nu:
    kind: review
    rubric: |
      The question: with the same stumps and the same data, nu = 0.1 run
      for several times the rounds reached a LOWER held-out error than
      nu = 1.0 at its own optimum (in section 4's run the unshrunk curve
      was measured well past its minimum; nu = 0.1's minimum was still
      capped by the round budget). The answer must explain the mechanism
      in 3-6 sentences, not restate the plot.

      Pass if the answer engages the greediness/optimization-path
      mechanism in some recognizable form: each round's stump is a greedy
      choice fitted partly to noise; at nu = 1 that choice is committed
      in full, so the residuals handed to later rounds have the noise of
      early choices baked in, while small nu commits only a fraction -
      the residuals change slowly, many correlated stumps effectively
      average over the same structure (or: later rounds can correct or
      outvote early mistakes; or: the model follows a slower, less greedy
      path through function space that passes closer to well-generalizing
      fits, with early stopping selecting a point on that better path).
      Statements of the nu-M budget trade (reaching the same training fit
      costs ~1/nu times the rounds) count toward, but do not by
      themselves constitute, the mechanism.

      Fail if the answer only asserts "smaller steps overfit less",
      "it's regularization", or "it converges more carefully" without
      saying what a full-strength commitment does to later rounds; or if
      it attributes the effect to stump depth, to randomness/subsampling
      (this lab uses none), or to the size of the dataset.

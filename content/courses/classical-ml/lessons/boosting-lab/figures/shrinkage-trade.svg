<svg viewBox="0 0 520 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .fast { stroke: #4c8dd6; }
    .slow { stroke: #e2903a; }
  </style>

  <!-- axes -->
  <line x1="50" y1="30" x2="50" y2="250" stroke="currentColor" stroke-width="1.5"/>
  <line x1="50" y1="250" x2="490" y2="250" stroke="currentColor" stroke-width="1.5"/>
  <text class="muted" x="50" y="20">held-out error</text>
  <text class="muted" x="308" y="266" text-anchor="middle">rounds</text>

  <!-- guides at the two minima -->
  <line x1="168" y1="199" x2="168" y2="250" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5"/>
  <line x1="448" y1="224" x2="448" y2="250" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5"/>
  <text class="muted" x="168" y="266" text-anchor="middle">189</text>
  <text class="muted" x="448" y="266" text-anchor="middle">795</text>

  <!-- nu = 1.0: fast descent, overshoots its minimum -->
  <path class="fast" d="M 55 45 C 70 130, 110 193, 150 198 C 195 203, 330 182, 475 156"
        fill="none" stroke-width="2.5"/>
  <circle cx="168" cy="199" r="4" fill="#4c8dd6"/>
  <text x="183" y="188" fill="#4c8dd6">0.503</text>
  <text x="470" y="142" text-anchor="end" fill="#4c8dd6" font-weight="600">ν = 1.0</text>

  <!-- nu = 0.1: slow descent, still going at the budget -->
  <path class="slow" d="M 55 45 C 90 80, 130 120, 190 155 C 280 195, 380 217, 470 226"
        fill="none" stroke-width="2.5"/>
  <circle cx="448" cy="224" r="4" fill="#e2903a"/>
  <text x="440" y="212" text-anchor="end" fill="#e2903a">0.447</text>
  <text x="248" y="150" fill="#e2903a" font-weight="600">ν = 0.1</text>

  <text class="muted" x="270" y="292" text-anchor="middle">smaller steps take longer — and land lower</text>
</svg>

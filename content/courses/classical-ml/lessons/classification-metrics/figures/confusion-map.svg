<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 390" font-family="system-ui, sans-serif">
  <text x="20" y="24" font-size="13" font-weight="bold" fill="currentColor">LDA on the Default training data, threshold 0.5</text>

  <!-- column headers (truth) -->
  <text x="280" y="62" font-size="12" fill="#e2903a" text-anchor="middle" font-weight="bold">defaulted &#183; 333</text>
  <text x="400" y="62" font-size="12" fill="currentColor" opacity="0.55" text-anchor="middle">paid &#183; 9,667</text>
  <text x="340" y="44" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">truth</text>

  <!-- row labels (prediction) -->
  <text x="212" y="98" font-size="10" fill="currentColor" opacity="0.55" text-anchor="end">predicted</text>
  <text x="212" y="124" font-size="12" fill="#4c8dd6" text-anchor="end" font-weight="bold">flagged &#183; 104</text>
  <text x="212" y="204" font-size="12" fill="currentColor" opacity="0.55" text-anchor="end">passed &#183; 9,896</text>

  <!-- cells -->
  <rect x="220" y="80" width="120" height="80" fill="#e2903a" fill-opacity="0.15" stroke="currentColor" stroke-opacity="0.4"/>
  <rect x="340" y="80" width="120" height="80" fill="none" stroke="currentColor" stroke-opacity="0.4"/>
  <rect x="220" y="160" width="120" height="80" fill="none" stroke="currentColor" stroke-opacity="0.4"/>
  <rect x="340" y="160" width="120" height="80" fill="none" stroke="currentColor" stroke-opacity="0.4"/>
  <text x="280" y="125" font-size="14" font-weight="bold" fill="currentColor" text-anchor="middle">TP&#8202;=&#8202;81</text>
  <text x="400" y="125" font-size="14" fill="currentColor" text-anchor="middle">FP&#8202;=&#8202;23</text>
  <text x="280" y="205" font-size="14" fill="currentColor" text-anchor="middle">FN&#8202;=&#8202;252</text>
  <text x="400" y="205" font-size="14" fill="currentColor" text-anchor="middle">TN&#8202;=&#8202;9,644</text>

  <!-- row brackets: prediction-conditioned rates -->
  <path d="M 466 85 L 471 85 L 471 155 L 466 155" fill="none" stroke="#4c8dd6" stroke-width="1.5"/>
  <text x="480" y="114" font-size="11" fill="#4c8dd6">precision (PPV) = 81/104 = 0.779</text>
  <text x="480" y="130" font-size="11" fill="currentColor" opacity="0.55">FDR = 23/104 = 0.221</text>

  <path d="M 466 165 L 471 165 L 471 235 L 466 235" fill="none" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="480" y="194" font-size="11" fill="currentColor">NPV = 9,644/9,896 = 0.975</text>
  <text x="480" y="210" font-size="11" fill="currentColor" opacity="0.55">FOR = 252/9,896 = 0.025</text>

  <!-- column brackets, pointing to the two truth-conditioned lines below -->
  <path d="M 225 248 L 225 253 L 335 253 L 335 248" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <path d="M 345 248 L 345 253 L 455 253 L 455 248" fill="none" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.5"/>
  <line x1="280" y1="253" x2="280" y2="266" stroke="#e2903a" stroke-width="1.5"/>
  <line x1="400" y1="253" x2="400" y2="292" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.5"/>

  <text x="120" y="278" font-size="11" fill="#e2903a">defaulted column: recall (TPR) = 81/333 = 0.243 &#183; miss rate (FNR) = 252/333 = 0.757</text>
  <text x="120" y="304" font-size="11" fill="currentColor" opacity="0.7">paid column: FPR = 23/9,667 = 0.0024 &#183; specificity (TNR) = 0.9976</text>

  <!-- bottom summary -->
  <text x="340" y="344" font-size="12" fill="currentColor" text-anchor="middle" font-weight="bold">accuracy = (81 + 9,644)/10,000 = 0.9725, with 252 of 333 defaulters missed</text>
  <text x="340" y="366" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">every rate divides its cells by its bracket&#8217;s total: amber by a truth column, blue by a prediction row</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" font-family="system-ui, sans-serif">
  <text x="20" y="26" font-size="12" fill="currentColor">expected cost, per 10,000 customers</text>
  <text x="580" y="26" font-size="11" fill="currentColor" opacity="0.7" text-anchor="end">Bayes threshold: flag when p &gt; 1/(1+c)</text>
  <text x="580" y="43" font-size="11" fill="currentColor" opacity="0.7" text-anchor="end">c = 1 &#8594; t* = 0.5&#160;&#160;&#160;&#160;c = 4 &#8594; t* = 0.2</text>

  <line x1="60" y1="250" x2="540" y2="250" stroke="currentColor" stroke-opacity="0.5"/>

  <!-- group 1: c = 1 -->
  <rect x="110" y="205" width="56" height="45" fill="#4c8dd6" fill-opacity="0.75"/>
  <rect x="178" y="189" width="56" height="61" fill="#e2903a" fill-opacity="0.75"/>
  <text x="138" y="197" font-size="12" font-weight="bold" fill="currentColor" text-anchor="middle">275 &#10003;</text>
  <text x="206" y="181" font-size="12" fill="currentColor" text-anchor="middle">373</text>
  <text x="138" y="268" font-size="11" fill="currentColor" text-anchor="middle">t = 0.5</text>
  <text x="206" y="268" font-size="11" fill="currentColor" text-anchor="middle">t = 0.2</text>
  <text x="172" y="292" font-size="12" fill="currentColor" text-anchor="middle">equal costs (c = 1)</text>

  <!-- group 2: c = 4 -->
  <rect x="350" y="82" width="56" height="168" fill="#4c8dd6" fill-opacity="0.75"/>
  <rect x="418" y="122" width="56" height="128" fill="#e2903a" fill-opacity="0.75"/>
  <text x="378" y="74" font-size="12" fill="currentColor" text-anchor="middle">1,031</text>
  <text x="446" y="114" font-size="12" font-weight="bold" fill="currentColor" text-anchor="middle">787 &#10003;</text>
  <text x="378" y="268" font-size="11" fill="currentColor" text-anchor="middle">t = 0.5</text>
  <text x="446" y="268" font-size="11" fill="currentColor" text-anchor="middle">t = 0.2</text>
  <text x="412" y="292" font-size="12" fill="currentColor" text-anchor="middle">missed default = 4 &#215; false alarm (c = 4)</text>

  <text x="300" y="314" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">cost = FP + c &#183; FN from the two published Default matrices; the winner follows the loss</text>
</svg>

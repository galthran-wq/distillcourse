<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" font-family="system-ui, sans-serif">
  <text x="290" y="26" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">class densities: y = 0 ~ Unif(0, 1), y = 1 ~ Unif(0.5, 1.5)</text>
  <text x="18" y="50" font-size="11" fill="currentColor" opacity="0.55">p(y = 1 | x)</text>

  <!-- overlap band -->
  <rect x="213" y="60" width="154" height="220" fill="currentColor" fill-opacity="0.06"/>

  <!-- axes -->
  <line x1="60" y1="280" x2="520" y2="280" stroke="currentColor" stroke-opacity="0.5"/>
  <line x1="60" y1="280" x2="60" y2="40" stroke="currentColor" stroke-opacity="0.5"/>
  <text x="60" y="296" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">0</text>
  <text x="213" y="296" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">0.5</text>
  <text x="367" y="296" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">1</text>
  <text x="520" y="296" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">1.5</text>
  <text x="290" y="312" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">x</text>
  <text x="52" y="284" font-size="10" fill="currentColor" opacity="0.55" text-anchor="end">0</text>
  <text x="52" y="174" font-size="10" fill="currentColor" opacity="0.55" text-anchor="end">&#189;</text>
  <text x="52" y="64" font-size="10" fill="currentColor" opacity="0.55" text-anchor="end">1</text>

  <!-- true conditional: three-level step -->
  <polyline points="60,280 213,280" fill="none" stroke="#e2903a" stroke-width="2.5"/>
  <line x1="213" y1="280" x2="213" y2="170" stroke="#e2903a" stroke-width="1.5" stroke-dasharray="3 3" stroke-opacity="0.6"/>
  <polyline points="213,170 367,170" fill="none" stroke="#e2903a" stroke-width="2.5"/>
  <line x1="367" y1="170" x2="367" y2="60" stroke="#e2903a" stroke-width="1.5" stroke-dasharray="3 3" stroke-opacity="0.6"/>
  <polyline points="367,60 520,60" fill="none" stroke="#e2903a" stroke-width="2.5"/>
  <text x="445" y="50" font-size="11" fill="#e2903a" text-anchor="middle">true p(y = 1 | x)</text>

  <!-- Platt sigmoid of the SVM score -->
  <polyline points="60,269.6 106,261.8 152,248.8 198,229.2 244,202.1 290,170 336,137.9 382,110.8 428,91.2 474,78.3 520,70.3" fill="none" stroke="#4c8dd6" stroke-width="2"/>
  <text x="470" y="118" font-size="11" fill="#4c8dd6" text-anchor="middle">Platt: &#963;(a f(x) + b)</text>

  <text x="290" y="90" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">overlap: truth flat at &#189;</text>
  <text x="290" y="103" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">(log-odds 0); every</text>
  <text x="290" y="116" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">sigmoid climbs through</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="system-ui, sans-serif">
  <rect x="100" y="50" width="320" height="320" fill="none" stroke="currentColor" stroke-opacity="0.4"/>
  <line x1="100" y1="370" x2="420" y2="50" stroke="currentColor" stroke-dasharray="4 3" stroke-opacity="0.5"/>
  <text x="404" y="66" font-size="10" fill="currentColor" opacity="0.55" text-anchor="end">calibrated</text>

  <!-- ticks -->
  <text x="100" y="386" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">0</text>
  <text x="260" y="386" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">0.5</text>
  <text x="420" y="386" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">1</text>
  <text x="92" y="374" font-size="10" fill="currentColor" opacity="0.55" text-anchor="end">0</text>
  <text x="92" y="214" font-size="10" fill="currentColor" opacity="0.55" text-anchor="end">0.5</text>
  <text x="92" y="58" font-size="10" fill="currentColor" opacity="0.55" text-anchor="end">1</text>
  <text x="260" y="399" font-size="11" fill="currentColor" text-anchor="middle">stated probability of spam (bin mean)</text>
  <text x="34" y="210" font-size="11" fill="currentColor" text-anchor="middle" transform="rotate(-90 34 210)">observed spam rate in bin</text>

  <!-- naive Bayes (amber) -->
  <polyline points="101.6,342.8 146.7,226.6 177.4,156.6 210.4,278.5 240.8,178 274.1,137.4 306.7,253.5 341,144.1 377.8,167.4 418.1,74"
    fill="none" stroke="#e2903a" stroke-width="1.5" stroke-opacity="0.5"/>
  <circle cx="101.6" cy="342.8" r="7" fill="#e2903a"/>
  <circle cx="146.7" cy="226.6" r="3.5" fill="#e2903a"/>
  <circle cx="177.4" cy="156.6" r="3.5" fill="#e2903a"/>
  <circle cx="210.4" cy="278.5" r="3.5" fill="#e2903a"/>
  <circle cx="240.8" cy="178" r="3.5" fill="#e2903a"/>
  <circle cx="274.1" cy="137.4" r="3.5" fill="#e2903a"/>
  <circle cx="306.7" cy="253.5" r="3.5" fill="#e2903a"/>
  <circle cx="341" cy="144.1" r="3.5" fill="#e2903a"/>
  <circle cx="377.8" cy="167.4" r="3.5" fill="#e2903a"/>
  <circle cx="418.1" cy="74" r="5.5" fill="#e2903a"/>

  <!-- logistic (blue) -->
  <polyline points="105.1,364.2 145.4,333.5 175.8,299 210.7,251.6 244.6,266.6 279.5,235.3 312.5,173.2 340.6,119.1 375.5,82.3 414.6,55.8"
    fill="none" stroke="#4c8dd6" stroke-width="1.5" stroke-opacity="0.5"/>
  <circle cx="105.1" cy="364.2" r="6" fill="#4c8dd6"/>
  <circle cx="145.4" cy="333.5" r="3.5" fill="#4c8dd6"/>
  <circle cx="175.8" cy="299" r="3.5" fill="#4c8dd6"/>
  <circle cx="210.7" cy="251.6" r="3.5" fill="#4c8dd6"/>
  <circle cx="244.6" cy="266.6" r="3.5" fill="#4c8dd6"/>
  <circle cx="279.5" cy="235.3" r="3.5" fill="#4c8dd6"/>
  <circle cx="312.5" cy="173.2" r="3.5" fill="#4c8dd6"/>
  <circle cx="340.6" cy="119.1" r="3.5" fill="#4c8dd6"/>
  <circle cx="375.5" cy="82.3" r="3.5" fill="#4c8dd6"/>
  <circle cx="414.6" cy="55.8" r="5" fill="#4c8dd6"/>

  <!-- annotations for the two big NB bins -->
  <text x="114" y="330" font-size="10" fill="currentColor">926 msgs: stated 0.005,</text>
  <text x="114" y="343" font-size="10" fill="currentColor">observed 0.085</text>
  <text x="408" y="94" font-size="10" fill="currentColor" text-anchor="end">481 msgs: stated 0.994,</text>
  <text x="408" y="107" font-size="10" fill="currentColor" text-anchor="end">observed 0.925</text>

  <!-- legend -->
  <circle cx="446" cy="140" r="4.5" fill="#e2903a"/>
  <text x="456" y="144" font-size="11" fill="currentColor">naive Bayes</text>
  <circle cx="446" cy="162" r="4.5" fill="#4c8dd6"/>
  <text x="456" y="166" font-size="11" fill="currentColor">logistic</text>
  <text x="440" y="192" font-size="10" fill="currentColor" opacity="0.55">naive Bayes still</text>
  <text x="440" y="205" font-size="10" fill="currentColor" opacity="0.55">ranks at AUC 0.951</text>
</svg>

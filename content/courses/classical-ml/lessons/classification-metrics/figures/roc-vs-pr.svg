<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="system-ui, sans-serif">
  <text x="160" y="30" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">ROC: both prevalences, one curve</text>
  <text x="480" y="30" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">PR: the same classifier, twice</text>

  <!-- left: ROC -->
  <rect x="60" y="60" width="200" height="200" fill="none" stroke="currentColor" stroke-opacity="0.4"/>
  <line x1="60" y1="260" x2="260" y2="60" stroke="currentColor" stroke-dasharray="3 3" stroke-opacity="0.4"/>
  <polyline points="60,260 64,190 70,136 80,100 100,80 140,68 260,60" fill="none" stroke="#e2903a" stroke-width="2.5"/>
  <circle cx="80" cy="100" r="5" fill="#e2903a"/>
  <text x="90" y="96" font-size="10" fill="currentColor">TPR 0.8, FPR 0.1</text>
  <text x="160" y="280" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">FPR</text>
  <text x="52" y="164" font-size="10" fill="currentColor" opacity="0.55" text-anchor="end">TPR</text>
  <text x="160" y="304" font-size="11" fill="currentColor" text-anchor="middle">1:1 and 1:100 draw this same curve</text>

  <!-- right: PR -->
  <rect x="380" y="60" width="200" height="200" fill="none" stroke="currentColor" stroke-opacity="0.4"/>
  <!-- prevalence floors -->
  <line x1="380" y1="160" x2="580" y2="160" stroke="#e2903a" stroke-dasharray="3 3" stroke-opacity="0.5"/>
  <text x="576" y="156" font-size="9" fill="#e2903a" text-anchor="end" opacity="0.8">floor &#960; = 0.5</text>
  <line x1="380" y1="258" x2="580" y2="258" stroke="#4c8dd6" stroke-dasharray="3 3" stroke-opacity="0.5"/>
  <text x="384" y="254" font-size="9" fill="#4c8dd6" opacity="0.8">floor &#960; = 0.0099</text>
  <!-- 1:1 curve: (recall, precision) -->
  <polyline points="387,70 450,71 504,75 540,82 560,96 572,119 580,160" fill="none" stroke="#e2903a" stroke-width="2.5"/>
  <!-- 1:100 curve -->
  <polyline points="387,225 450,230 504,238 540,245 560,251 572,255 580,258" fill="none" stroke="#4c8dd6" stroke-width="2.5"/>
  <circle cx="540" cy="82" r="5" fill="#e2903a"/>
  <text x="534" y="76" font-size="10" fill="currentColor" text-anchor="end">precision 0.89</text>
  <circle cx="540" cy="245" r="5" fill="#4c8dd6"/>
  <text x="534" y="237" font-size="10" fill="currentColor" text-anchor="end">precision 0.074</text>
  <text x="480" y="280" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">recall</text>
  <text x="372" y="164" font-size="10" fill="currentColor" opacity="0.55" text-anchor="end">precision</text>
  <text x="480" y="304" font-size="11" fill="currentColor" text-anchor="middle">amber 1:1, blue 1:100 &#8212; same TPR and FPR everywhere</text>
</svg>

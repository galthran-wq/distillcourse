<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" font-family="system-ui, sans-serif">
  <!-- axes -->
  <line x1="60" y1="280" x2="520" y2="280" stroke="currentColor" stroke-opacity="0.5"/>
  <line x1="60" y1="280" x2="60" y2="40" stroke="currentColor" stroke-opacity="0.5"/>
  <text x="60" y="296" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">0</text>
  <text x="290" y="296" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">0.5</text>
  <text x="520" y="296" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">1</text>
  <text x="290" y="312" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">stated probability q, on a case with y = 1</text>
  <text x="52" y="284" font-size="10" fill="currentColor" opacity="0.55" text-anchor="end">0</text>
  <text x="52" y="224" font-size="10" fill="currentColor" opacity="0.55" text-anchor="end">1</text>
  <text x="52" y="164" font-size="10" fill="currentColor" opacity="0.55" text-anchor="end">2</text>
  <text x="52" y="104" font-size="10" fill="currentColor" opacity="0.55" text-anchor="end">3</text>
  <text x="52" y="44" font-size="10" fill="currentColor" opacity="0.55" text-anchor="end">4</text>
  <text x="18" y="28" font-size="11" fill="currentColor" opacity="0.55">penalty</text>

  <!-- Brier cap guide -->
  <line x1="60" y1="220" x2="520" y2="220" stroke="#4c8dd6" stroke-dasharray="3 3" stroke-opacity="0.5"/>
  <text x="524" y="223" font-size="10" fill="#4c8dd6">cap: 1</text>

  <!-- Brier curve -->
  <polyline points="60,220 106,231.4 152,241.6 198,250.6 244,258.4 290,265 336,270.4 382,274.6 428,277.6 474,279.4 520,280" fill="none" stroke="#4c8dd6" stroke-width="2"/>
  <text x="112" y="268" font-size="11" fill="#4c8dd6">Brier: (1 &#8722; q)&#178;</text>

  <!-- log-loss curve -->
  <polyline points="69.2,45.3 73.8,69.6 83,100.3 96.8,128.4 115.2,152.8 142.8,177.1 175,196.8 221,217 290,238.4 359,254.2 428,266.6 474,273.7 520,280" fill="none" stroke="#e2903a" stroke-width="2"/>
  <text x="150" y="112" font-size="11" fill="#e2903a">log-loss: &#8722;log q</text>
  <text x="100" y="55" font-size="10" fill="#e2903a">unbounded: q = 10&#8315;&#8313; costs 20.7 nats</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="system-ui, sans-serif">
  <text x="20" y="28" font-size="13" font-weight="bold" fill="currentColor">2 &#183; t = 0.50: three more points land (TP 2&#8594;4, FP 0&#8594;1)</text>

  <!-- score strip -->
  <text x="30" y="140" font-size="10" fill="#e2903a">positives</text>
  <text x="30" y="176" font-size="10" fill="#4c8dd6">negatives</text>
  <line x1="30" y1="210" x2="290" y2="210" stroke="currentColor" stroke-opacity="0.5"/>
  <text x="30" y="228" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">0</text>
  <text x="160" y="228" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">0.5</text>
  <text x="290" y="228" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">1</text>
  <text x="160" y="246" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">score s(x)</text>

  <rect x="160" y="125" width="130" height="80" fill="currentColor" fill-opacity="0.06"/>
  <line x1="160" y1="118" x2="160" y2="212" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="160" y="112" font-size="11" font-weight="bold" fill="currentColor" text-anchor="middle">t</text>

  <circle cx="264" cy="150" r="6" fill="#e2903a"/>
  <circle cx="238" cy="150" r="6" fill="#e2903a"/>
  <circle cx="212" cy="150" r="6" fill="#e2903a"/>
  <circle cx="173" cy="150" r="6" fill="#e2903a"/>
  <circle cx="134" cy="150" r="6" fill="#e2903a"/>
  <circle cx="186" cy="185" r="6" fill="#4c8dd6"/>
  <circle cx="147" cy="185" r="6" fill="#4c8dd6"/>
  <circle cx="108" cy="185" r="6" fill="#4c8dd6"/>
  <circle cx="82" cy="185" r="6" fill="#4c8dd6"/>
  <circle cx="56" cy="185" r="6" fill="#4c8dd6"/>

  <!-- counts -->
  <text x="390" y="130" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">counts at t</text>
  <rect x="330" y="140" width="60" height="34" fill="#e2903a" fill-opacity="0.12" stroke="currentColor" stroke-opacity="0.4"/>
  <rect x="390" y="140" width="60" height="34" fill="none" stroke="currentColor" stroke-opacity="0.4"/>
  <rect x="330" y="174" width="60" height="34" fill="none" stroke="currentColor" stroke-opacity="0.4"/>
  <rect x="390" y="174" width="60" height="34" fill="none" stroke="currentColor" stroke-opacity="0.4"/>
  <text x="360" y="162" font-size="12" fill="currentColor" text-anchor="middle">TP 4</text>
  <text x="420" y="162" font-size="12" fill="currentColor" text-anchor="middle">FP 1</text>
  <text x="360" y="196" font-size="12" fill="currentColor" text-anchor="middle">FN 1</text>
  <text x="420" y="196" font-size="12" fill="currentColor" text-anchor="middle">TN 4</text>
  <text x="390" y="236" font-size="11" fill="#e2903a" text-anchor="middle">TPR = 4/5 = 0.8</text>
  <text x="390" y="252" font-size="11" fill="#4c8dd6" text-anchor="middle">FPR = 1/5 = 0.2</text>

  <!-- ROC -->
  <rect x="480" y="70" width="140" height="140" fill="none" stroke="currentColor" stroke-opacity="0.4"/>
  <line x1="480" y1="210" x2="620" y2="70" stroke="currentColor" stroke-dasharray="3 3" stroke-opacity="0.4"/>
  <text x="550" y="232" font-size="10" fill="#4c8dd6" text-anchor="middle">FPR</text>
  <text x="472" y="142" font-size="10" fill="#e2903a" text-anchor="end">TPR</text>
  <polyline points="480,210 480,154" fill="none" stroke="#e2903a" stroke-width="2"/>
  <polyline points="480,154 508,98" fill="none" stroke="#e2903a" stroke-width="2" stroke-dasharray="4 3" stroke-opacity="0.6"/>
  <circle cx="480" cy="154" r="4" fill="#e2903a" fill-opacity="0.5"/>
  <circle cx="508" cy="98" r="4" fill="#e2903a"/>
  <text x="518" y="96" font-size="10" fill="currentColor">(0.2, 0.8)</text>
</svg>

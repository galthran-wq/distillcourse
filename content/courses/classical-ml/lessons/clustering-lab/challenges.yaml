checkpoints:
  assign-step:
    kind: exact
    seed: 41
    atol: 1.0e-9
    inputs_code: |
      X = rng.normal(size=(80, 2)) * 2.0
      C = rng.normal(size=(6, 2)) * 2.0
      inputs = (X, C)
    wrong:
      - hint: "argmin over the wrong axis: this finds each CENTROID's nearest point — shape (K,), not (n,). The distance matrix is (n, K); reduce over the centroid axis."
        code: |
          def f(X, C):
              import numpy as np
              return ((X[:, None, :] - C[None, :, :]) ** 2).sum(-1).argmin(0)
  update-step:
    kind: exact
    seed: 43
    atol: 1.0e-9
    inputs_code: |
      # Clusters 2 and 4 are empty by construction: the repair path is part
      # of the checkpoint, and with two dead centroids the claimed-point
      # rule (the second repair must skip the point the first one took) is
      # graded too, not left to chance.
      X = rng.normal(size=(40, 2)) * 3.0
      labels = rng.integers(0, 5, size=40)
      labels[labels == 2] = 1
      labels[labels == 4] = 0
      inputs = (X, labels, 5)
    wrong:
      - hint: "Each centroid is the mean of ITS OWN cluster's points: divide each cluster's sum by that cluster's size, not by K."
        code: |
          def f(X, labels, K):
              import numpy as np
              C = np.zeros((K, X.shape[1]))
              np.add.at(C, labels, X)
              return C / K
      - hint: "The empty cluster was left at the origin. The spec re-seeds a dead centroid on the point farthest from its own cluster's new centroid."
        code: |
          def f(X, labels, K):
              import numpy as np
              C = np.zeros((K, X.shape[1]))
              for k in range(K):
                  if np.any(labels == k):
                      C[k] = X[labels == k].mean(0)
              return C
      - hint: "Both dead centroids landed on the same point: each repair took the overall farthest point, so the second claimed the point the first had already spent. A claimed point is off the menu — each later repair takes the farthest point still unclaimed."
        code: |
          def f(X, labels, K):
              import numpy as np
              C = np.zeros((K, X.shape[1]))
              for k in range(K):
                  if np.any(labels == k):
                      C[k] = X[labels == k].mean(0)
              d2 = ((X - C[labels]) ** 2).sum(1)
              for k in range(K):
                  if not np.any(labels == k):
                      C[k] = X[np.argmax(d2)]
              return C
  lloyd-loop:
    kind: exact
    seed: 47
    atol: 1.0e-6
    inputs_code: |
      # Three well-separated groups; C0 takes one point from each, so the
      # loop exercises plain alternation, not the repair path.
      X = rng.normal(size=(120, 2))
      X[:40] += np.array([4.0, 0.0])
      X[40:80] += np.array([-4.0, 1.0])
      C0 = X[[0, 40, 80]].copy()
      inputs = (X, C0, 25)
    wrong:
      - hint: "Distortion is measured right after the assignment, against the centroids the points were just assigned to. Measuring the UPDATED centroids against the pre-update labels is half an iteration later, and the whole history shifts."
        code: |
          def f(X, C0, iters):
              import numpy as np
              C = C0.copy()
              J = np.empty(iters)
              for t in range(iters):
                  labels = ((X[:, None, :] - C[None, :, :]) ** 2).sum(-1).argmin(1)
                  C = np.array([X[labels == k].mean(0) for k in range(len(C))])
                  J[t] = ((X - C[labels]) ** 2).sum(1).mean()
              return C, labels, J
      - hint: "J here is the MEAN squared distance over the n points, not the sum."
        code: |
          def f(X, C0, iters):
              import numpy as np
              C = C0.copy()
              J = np.empty(iters)
              for t in range(iters):
                  labels = ((X[:, None, :] - C[None, :, :]) ** 2).sum(-1).argmin(1)
                  J[t] = ((X - C[labels]) ** 2).sum(1).sum()
                  C = np.array([X[labels == k].mean(0) for k in range(len(C))])
              return C, labels, J
  kmeanspp:
    kind: exact
    seed: 53
    atol: 1.0e-9
    inputs_code: |
      X = rng.normal(size=(60, 2))
      X[:20] += np.array([6.0, 0.0])
      X[20:40] -= np.array([6.0, 0.0])
      inputs = (X, 4, np.random.default_rng(1234))
    wrong:
      - hint: "D-squared sampling: the weight is the SQUARED distance to the nearest chosen center. Weighting by plain distance under-favors far regions and draws a different center sequence."
        code: |
          def f(X, K, rng):
              import numpy as np
              n = len(X)
              C = np.empty((K, X.shape[1]))
              C[0] = X[rng.integers(n)]
              d2 = ((X - C[0]) ** 2).sum(1)
              for k in range(1, K):
                  d = np.sqrt(d2)
                  C[k] = X[rng.choice(n, p=d / d.sum())]
                  d2 = np.minimum(d2, ((X - C[k]) ** 2).sum(1))
              return C
      - hint: "D2 is the distance to the nearest center chosen SO FAR — refresh it with np.minimum after every draw, or every center after the first is sampled by distance to the first alone."
        code: |
          def f(X, K, rng):
              import numpy as np
              n = len(X)
              C = np.empty((K, X.shape[1]))
              C[0] = X[rng.integers(n)]
              d2 = ((X - C[0]) ** 2).sum(1)
              for k in range(1, K):
                  C[k] = X[rng.choice(n, p=d2 / d2.sum())]
              return C
  image-vq:
    kind: exact
    seed: 3
    atol: 1.0e-6
    inputs_code: |
      img = np.load("data/photo.npy").astype(np.float64) / 255.0
      inputs = (img, 4, 15)
    wrong:
      - hint: "The bit ledger has two entries: n*log2(K) index bits AND 24 bits for each of the K codebook colors. The codebook term is missing."
        code: |
          def f(img, K, iters):
              import numpy as np
              px = img.reshape(-1, 3)
              n = len(px)
              C = px[np.linspace(0, n - 1, K).astype(int)].copy()
              for _ in range(iters):
                  labels = ((px[:, None, :] - C[None, :, :]) ** 2).sum(-1).argmin(1)
                  C = np.array([px[labels == k].mean(0) for k in range(K)])
              return C, labels.reshape(img.shape[:2]), float(np.log2(K))
      - hint: "The index map was re-assigned against the returned codebook — half an iteration past the contract. kmeans returns the labels computed inside its final iteration, before the last update; pass them through as-is, and here exactly one pixel of 30,000 switches sides if you re-assign."
        code: |
          def f(img, K, iters):
              import numpy as np
              px = img.reshape(-1, 3)
              n = len(px)
              C = px[np.linspace(0, n - 1, K).astype(int)].copy()
              for _ in range(iters):
                  labels = ((px[:, None, :] - C[None, :, :]) ** 2).sum(-1).argmin(1)
                  C = np.array([px[labels == k].mean(0) for k in range(K)])
              labels = ((px[:, None, :] - C[None, :, :]) ** 2).sum(-1).argmin(1)
              return C, labels.reshape(img.shape[:2]), (24.0 * K + n * np.log2(K)) / n
      - hint: "The index map must be the (h, w) reshape of the final labels. A flat (n,) vector holds the right numbers in the wrong shape — nothing can look a pixel up in it by position."
        code: |
          def f(img, K, iters):
              import numpy as np
              px = img.reshape(-1, 3)
              n = len(px)
              C = px[np.linspace(0, n - 1, K).astype(int)].copy()
              for _ in range(iters):
                  labels = ((px[:, None, :] - C[None, :, :]) ** 2).sum(-1).argmin(1)
                  C = np.array([px[labels == k].mean(0) for k in range(K)])
              return C, labels, (24.0 * K + n * np.log2(K)) / n
  e-step:
    kind: exact
    seed: 59
    atol: 1.0e-6
    inputs_code: |
      # The last point sits hundreds of standard deviations from every
      # component: its densities underflow to exactly 0.0 in float64, so an
      # implementation that exponentiates before normalizing produces nan
      # and cannot match.
      X = np.vstack([rng.normal(size=(60, 2)) * 2.0, [[500.0, -500.0]]])
      pi = np.array([0.5, 0.3, 0.2])
      mu = np.array([[-2.0, 0.0], [2.0, 1.0], [0.0, -2.0]])
      Sigma = np.array([[[1.0, 0.3], [0.3, 0.8]],
                        [[0.5, 0.0], [0.0, 1.5]],
                        [[2.0, -0.4], [-0.4, 0.6]]])
      inputs = (X, pi, mu, Sigma)
    wrong:
      - hint: "The mixing weights are missing: each component's density is weighted by pi_k in both the responsibilities and the log-evidence."
        code: |
          def f(X, pi, mu, Sigma):
              import numpy as np
              n, d = X.shape
              K = len(pi)
              logw = np.empty((n, K))
              for k in range(K):
                  diff = X - mu[k]
                  _, logdet = np.linalg.slogdet(Sigma[k])
                  maha = (diff * np.linalg.solve(Sigma[k], diff.T).T).sum(1)
                  logw[:, k] = -0.5 * (d * np.log(2 * np.pi) + logdet + maha)
              m = logw.max(1, keepdims=True)
              logpx = (m + np.log(np.exp(logw - m).sum(1, keepdims=True))).ravel()
              return np.exp(logw - logpx[:, None]), logpx
      - hint: "The ln|Sigma_k| normalizer is missing: without it, components with different covariance volumes are compared as if their densities had equal height."
        code: |
          def f(X, pi, mu, Sigma):
              import numpy as np
              n, d = X.shape
              K = len(pi)
              logw = np.empty((n, K))
              for k in range(K):
                  diff = X - mu[k]
                  maha = (diff * np.linalg.solve(Sigma[k], diff.T).T).sum(1)
                  logw[:, k] = np.log(pi[k]) - 0.5 * (d * np.log(2 * np.pi) + maha)
              m = logw.max(1, keepdims=True)
              logpx = (m + np.log(np.exp(logw - m).sum(1, keepdims=True))).ravel()
              return np.exp(logw - logpx[:, None]), logpx
  m-step:
    kind: exact
    seed: 61
    atol: 1.0e-9
    inputs_code: |
      X = rng.normal(size=(50, 2)) * 1.5
      R = rng.random((50, 3))
      R = R / R.sum(1, keepdims=True)
      inputs = (X, R)
    wrong:
      - hint: "pi must sum to 1: the mixing weight is N_k / n, not the raw effective count N_k."
        code: |
          def f(X, R):
              import numpy as np
              n, d = X.shape
              Nk = R.sum(0)
              mu = (R.T @ X) / Nk[:, None]
              Sigma = np.empty((R.shape[1], d, d))
              for k in range(R.shape[1]):
                  diff = X - mu[k]
                  Sigma[k] = (R[:, k, None] * diff).T @ diff / Nk[k] + 1e-6 * np.eye(d)
              return Nk, mu, Sigma
      - hint: "The covariance is centered on the component's own WEIGHTED mean mu_k, not on the plain mean of X — re-center before the outer product."
        code: |
          def f(X, R):
              import numpy as np
              n, d = X.shape
              Nk = R.sum(0)
              pi = Nk / n
              mu = (R.T @ X) / Nk[:, None]
              xbar = X.mean(0)
              Sigma = np.empty((R.shape[1], d, d))
              for k in range(R.shape[1]):
                  diff = X - xbar
                  Sigma[k] = (R[:, k, None] * diff).T @ diff / Nk[k] + 1e-6 * np.eye(d)
              return pi, mu, Sigma
      - hint: "The EPS * I covariance floor is missing. It is added to EVERY Sigma_k, unconditionally — it is what closes off the singular collapse section 9 asks about, not a repair applied when trouble shows."
        code: |
          def f(X, R):
              import numpy as np
              n, d = X.shape
              Nk = R.sum(0)
              pi = Nk / n
              mu = (R.T @ X) / Nk[:, None]
              Sigma = np.empty((R.shape[1], d, d))
              for k in range(R.shape[1]):
                  diff = X - mu[k]
                  Sigma[k] = (R[:, k, None] * diff).T @ diff / Nk[k]
              return pi, mu, Sigma
      - hint: "Sigma_k is normalized by the component's own effective count N_k, not by n. Dividing by n shrinks every covariance by the factor pi_k — the weighted outer products are averaged over the component's share of the data, not the whole dataset."
        code: |
          def f(X, R):
              import numpy as np
              n, d = X.shape
              Nk = R.sum(0)
              pi = Nk / n
              mu = (R.T @ X) / Nk[:, None]
              Sigma = np.empty((R.shape[1], d, d))
              for k in range(R.shape[1]):
                  diff = X - mu[k]
                  Sigma[k] = (R[:, k, None] * diff).T @ diff / n + 1e-6 * np.eye(d)
              return pi, mu, Sigma
  em-monotone:
    kind: exact
    seed: 67
    atol: 1.0e-6
    inputs_code: |
      # Old Faithful, standardized, from a deliberately crossed start: each
      # mean begins inside the wrong regime, so EM has visible work to do.
      raw = np.loadtxt("data/faithful.csv", delimiter=",")
      X = (raw - raw.mean(0)) / raw.std(0)
      pi0 = np.array([0.5, 0.5])
      mu0 = np.array([[-1.0, 1.0], [1.0, -1.0]])
      Sigma0 = np.stack([np.eye(2), np.eye(2)])
      inputs = (X, pi0, mu0, Sigma0, 50)
    wrong:
      - hint: "Record the log-likelihood the E-step just computed, BEFORE the M-step moves the parameters: ll[t] belongs to the parameters iteration t started from. Recording after the update shifts the whole history by one step."
        code: |
          def f(X, pi0, mu0, Sigma0, iters):
              import numpy as np

              def e(X, pi, mu, Sigma):
                  n, d = X.shape
                  K = len(pi)
                  logw = np.empty((n, K))
                  for k in range(K):
                      diff = X - mu[k]
                      _, logdet = np.linalg.slogdet(Sigma[k])
                      maha = (diff * np.linalg.solve(Sigma[k], diff.T).T).sum(1)
                      logw[:, k] = np.log(pi[k]) - 0.5 * (d * np.log(2 * np.pi) + logdet + maha)
                  m = logw.max(1, keepdims=True)
                  logpx = (m + np.log(np.exp(logw - m).sum(1, keepdims=True))).ravel()
                  return np.exp(logw - logpx[:, None]), logpx

              def m(X, R):
                  n, d = X.shape
                  Nk = R.sum(0)
                  mu = (R.T @ X) / Nk[:, None]
                  Sigma = np.empty((R.shape[1], d, d))
                  for k in range(R.shape[1]):
                      diff = X - mu[k]
                      Sigma[k] = (R[:, k, None] * diff).T @ diff / Nk[k] + 1e-6 * np.eye(d)
                  return Nk / n, mu, Sigma

              pi, mu_, Sigma = pi0, mu0, Sigma0
              ll = np.empty(iters)
              for t in range(iters):
                  R, _ = e(X, pi, mu_, Sigma)
                  pi, mu_, Sigma = m(X, R)
                  _, logpx = e(X, pi, mu_, Sigma)
                  ll[t] = logpx.mean()
              return pi, mu_, Sigma, ll
  singularity-hunt:
    kind: review
    rubric: |
      The question: describe a concrete initialization of a 2-component GMM
      that drives the log-likelihood to +infinity without a guard, name the
      runaway parameter and the mechanism, and state what in their m_step
      prevents it.

      Pass if the answer contains BOTH of:
      (a) the collapse mechanism — one component's mean placed on (or
      shrinking onto) a single data point with its covariance (or variance)
      going to zero, so that point's density, which scales like
      1/sqrt(det(Sigma)), grows without bound while the other component
      keeps the remaining points' likelihood bounded; naming the covariance
      or its determinant/eigenvalues as the runaway quantity is sufficient;
      (b) the guard — the epsilon * I floor added to every covariance in the
      M-step (accept: eigenvalue/variance lower bound, covariance
      regularization; a MAP/Wishart prior also passes).

      Fail if the answer only says "bad initialization gives a bad local
      optimum" (that is a different failure), attributes the blow-up to the
      mean or the mixing weight running away, or names restarts alone as
      the fix.
  recover-centers:
    kind: metric
    metric: rmse
    threshold: -0.2
    holdout: data/blobs.csv
    labels_code: |
      labels = np.loadtxt("private/blob_centers.csv", delimiter=",").ravel()

<svg viewBox="0 0 520 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .kmeans { stroke: #e2903a; }
    .em { stroke: #4c8dd6; }
  </style>

  <!-- axes -->
  <line x1="50" y1="30" x2="50" y2="250" stroke="currentColor" stroke-width="1.5"/>
  <line x1="50" y1="250" x2="490" y2="250" stroke="currentColor" stroke-width="1.5"/>
  <text class="muted" x="270" y="268" text-anchor="middle">iteration</text>

  <!-- k-means: distortion staircase, only ever down -->
  <path class="kmeans" d="M 55 50 H 95 V 112 H 135 V 158 H 175 V 188 H 215 V 202 H 255 V 209 H 295 V 212 H 468"
        fill="none" stroke-width="2.5"/>
  <circle cx="468" cy="212" r="4" fill="#e2903a"/>
  <text x="468" y="234" text-anchor="end" fill="#e2903a" font-weight="600">k-means: distortion J</text>

  <!-- EM: log-likelihood staircase, only ever up -->
  <path class="em" d="M 55 240 H 95 V 178 H 135 V 132 H 175 V 104 H 215 V 90 H 255 V 83 H 295 V 80 H 468"
        fill="none" stroke-width="2.5"/>
  <circle cx="468" cy="80" r="4" fill="#4c8dd6"/>
  <text x="468" y="66" text-anchor="end" fill="#4c8dd6" font-weight="600">EM: log-likelihood</text>

  <!-- the theorem, stated at the first step of each curve -->
  <text x="102" y="90" font-size="12" fill="#e2903a" opacity="0.8">never rises</text>
  <text x="102" y="216" font-size="12" fill="#4c8dd6" opacity="0.8">never falls</text>

  <text class="muted" x="270" y="292" text-anchor="middle">two staircases, one argument — monotone at every step, or the bug is yours</text>
</svg>

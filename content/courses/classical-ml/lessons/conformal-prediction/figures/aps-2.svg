<svg viewBox="0 0 620 260" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="30" y="26" font-size="13" font-weight="bold" fill="currentColor">step 1 — add A: mass 0.45 &lt; q̂, keep going</text>

  <!-- softmax bars, sorted descending -->
  <text x="60" y="48" font-size="11" fill="currentColor" opacity="0.55">softmax f̂(x), sorted</text>
  <rect x="70" y="49" width="40" height="81" fill="#4c8dd6"/>
  <rect x="140" y="74" width="40" height="56" fill="currentColor" opacity="0.35"/>
  <rect x="210" y="101" width="40" height="29" fill="currentColor" opacity="0.35"/>
  <rect x="280" y="116" width="40" height="14" fill="currentColor" opacity="0.35"/>
  <text x="90" y="146" font-size="11" text-anchor="middle" fill="#4c8dd6">A 0.45</text>
  <text x="160" y="146" font-size="11" text-anchor="middle" fill="currentColor">B 0.31</text>
  <text x="230" y="146" font-size="11" text-anchor="middle" fill="currentColor">C 0.16</text>
  <text x="300" y="146" font-size="11" text-anchor="middle" fill="currentColor">D 0.08</text>

  <!-- cumulative-mass strip -->
  <text x="60" y="174" font-size="11" fill="currentColor" opacity="0.55">cumulative mass</text>
  <rect x="60" y="180" width="500" height="24" fill="none" stroke="currentColor" stroke-width="1" opacity="0.5"/>
  <rect x="60" y="180" width="225" height="24" fill="#4c8dd6" opacity="0.8"/>
  <text x="172" y="197" font-size="11" text-anchor="middle" fill="#fff">A</text>
  <text x="285" y="174" font-size="11" text-anchor="middle" fill="#4c8dd6">0.45</text>
  <line x1="60" y1="208" x2="60" y2="214" stroke="currentColor" stroke-width="1"/>
  <line x1="310" y1="208" x2="310" y2="214" stroke="currentColor" stroke-width="1"/>
  <line x1="560" y1="208" x2="560" y2="214" stroke="currentColor" stroke-width="1"/>
  <text x="60" y="228" font-size="11" text-anchor="middle" fill="currentColor">0</text>
  <text x="310" y="228" font-size="11" text-anchor="middle" fill="currentColor">0.5</text>
  <text x="560" y="228" font-size="11" text-anchor="middle" fill="currentColor">1</text>

  <!-- quantile bar -->
  <line x1="485" y1="164" x2="485" y2="214" stroke="#e2903a" stroke-width="1.6" stroke-dasharray="5 3"/>
  <text x="485" y="250" font-size="12" text-anchor="middle" fill="#e2903a">q̂ = 0.85</text>
</svg>

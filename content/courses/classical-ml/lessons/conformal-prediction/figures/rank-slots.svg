<svg viewBox="0 0 620 250" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- test ball -->
  <circle cx="310" cy="52" r="8" fill="#e2903a"/>
  <text x="326" y="56" font-size="12" fill="#e2903a">s_test lands in each gap with probability 1/10</text>

  <!-- fan of arrows from the ball to the 10 gaps -->
  <g stroke="#e2903a" stroke-width="0.9" opacity="0.55">
    <line x1="310" y1="62" x2="72"  y2="138"/>
    <line x1="310" y1="62" x2="102" y2="138"/>
    <line x1="310" y1="62" x2="137" y2="138"/>
    <line x1="310" y1="62" x2="177" y2="138"/>
    <line x1="310" y1="62" x2="220" y2="138"/>
    <line x1="310" y1="62" x2="262" y2="138"/>
    <line x1="310" y1="62" x2="317" y2="138"/>
    <line x1="310" y1="62" x2="385" y2="138"/>
    <line x1="310" y1="62" x2="465" y2="138"/>
    <line x1="310" y1="62" x2="535" y2="138"/>
  </g>

  <!-- covered region: the 8 gaps at or below s(8) -->
  <rect x="58" y="140" width="364" height="30" rx="4" fill="#5aa46a" opacity="0.14"/>

  <!-- score axis with the 9 sorted calibration scores -->
  <line x1="60" y1="155" x2="560" y2="155" stroke="currentColor" stroke-width="1"/>
  <circle cx="85" cy="155" r="5" fill="currentColor" opacity="0.7"/>
  <circle cx="120" cy="155" r="5" fill="currentColor" opacity="0.7"/>
  <circle cx="155" cy="155" r="5" fill="currentColor" opacity="0.7"/>
  <circle cx="200" cy="155" r="5" fill="currentColor" opacity="0.7"/>
  <circle cx="240" cy="155" r="5" fill="currentColor" opacity="0.7"/>
  <circle cx="285" cy="155" r="5" fill="currentColor" opacity="0.7"/>
  <circle cx="350" cy="155" r="5" fill="currentColor" opacity="0.7"/>
  <circle cx="420" cy="155" r="5" fill="currentColor" opacity="0.7"/>
  <circle cx="510" cy="155" r="5" fill="currentColor" opacity="0.7"/>
  <text x="85" y="185" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.55">s₍₁₎</text>
  <text x="420" y="185" font-size="11" text-anchor="middle" fill="currentColor">s₍₈₎ = q̂</text>
  <text x="510" y="185" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.55">s₍₉₎</text>

  <!-- counting annotation -->
  <text x="240" y="215" font-size="12" text-anchor="middle" fill="#5aa46a">covered: s_test ≤ s₍₈₎ — 8 gaps of 10</text>
  <text x="497" y="215" font-size="12" text-anchor="middle" fill="currentColor" opacity="0.55">missed: 2 gaps</text>
  <text x="310" y="240" font-size="13" text-anchor="middle" fill="currentColor">P(Y_test ∈ C(X_test)) = 8/10 ≥ 1 − α = 0.8</text>
</svg>

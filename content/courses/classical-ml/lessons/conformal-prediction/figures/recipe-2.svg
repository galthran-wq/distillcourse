<svg viewBox="0 0 620 250" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="30" y="26" font-size="13" font-weight="bold" fill="currentColor">step 2 — take the ⌈(n+1)(1−α)⌉/n quantile</text>

  <!-- quantile bar -->
  <line x1="420" y1="42" x2="420" y2="140" stroke="#e2903a" stroke-width="1.6" stroke-dasharray="5 3"/>
  <text x="428" y="52" font-size="12" fill="#e2903a">q̂ = s₍₈₎ = 0.72</text>
  <text x="428" y="68" font-size="11" fill="#e2903a" opacity="0.8">⌈10 × 0.8⌉ = 8th of 9</text>

  <!-- score axis -->
  <line x1="60" y1="110" x2="560" y2="110" stroke="currentColor" stroke-width="1"/>
  <line x1="60" y1="110" x2="60" y2="116" stroke="currentColor" stroke-width="1"/>
  <line x1="310" y1="110" x2="310" y2="116" stroke="currentColor" stroke-width="1"/>
  <line x1="560" y1="110" x2="560" y2="116" stroke="currentColor" stroke-width="1"/>
  <text x="60" y="130" font-size="11" text-anchor="middle" fill="currentColor">0</text>
  <text x="310" y="130" font-size="11" text-anchor="middle" fill="currentColor">0.5</text>
  <text x="560" y="130" font-size="11" text-anchor="middle" fill="currentColor">1</text>
  <text x="310" y="148" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.55">conformal score s (large = model badly wrong)</text>

  <!-- calibration scores -->
  <circle cx="85" cy="103" r="5" fill="currentColor" opacity="0.7"/>
  <circle cx="120" cy="103" r="5" fill="currentColor" opacity="0.7"/>
  <circle cx="155" cy="103" r="5" fill="currentColor" opacity="0.7"/>
  <circle cx="200" cy="103" r="5" fill="currentColor" opacity="0.7"/>
  <circle cx="240" cy="103" r="5" fill="currentColor" opacity="0.7"/>
  <circle cx="285" cy="103" r="5" fill="currentColor" opacity="0.7"/>
  <circle cx="350" cy="103" r="5" fill="currentColor" opacity="0.7"/>
  <circle cx="420" cy="103" r="5" fill="currentColor" opacity="0.7"/>
  <circle cx="420" cy="103" r="8" fill="none" stroke="#e2903a" stroke-width="1.6"/>
  <circle cx="510" cy="103" r="5" fill="currentColor" opacity="0.7"/>
  <text x="85" y="88" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.55">s₍₁₎ = 0.05</text>
  <text x="510" y="88" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.55">s₍₉₎ = 0.90</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="system-ui, sans-serif">
  <text x="20" y="24" font-size="12" font-weight="bold" fill="currentColor">Outer loop: measures (round 2 of 5 shown)</text>

  <!-- outer folds -->
  <rect x="40" y="38" width="100" height="26" fill="#4c8dd6" rx="3"/>
  <rect x="144" y="38" width="100" height="26" fill="#e2903a" rx="3"/>
  <rect x="248" y="38" width="100" height="26" fill="#4c8dd6" rx="3"/>
  <rect x="352" y="38" width="100" height="26" fill="#4c8dd6" rx="3"/>
  <rect x="456" y="38" width="100" height="26" fill="#4c8dd6" rx="3"/>
  <text x="194" y="55" font-size="10" fill="white" text-anchor="middle">test fold</text>
  <text x="90" y="55" font-size="10" fill="white" text-anchor="middle">train</text>
  <text x="298" y="55" font-size="10" fill="white" text-anchor="middle">train</text>
  <text x="402" y="55" font-size="10" fill="white" text-anchor="middle">train</text>
  <text x="506" y="55" font-size="10" fill="white" text-anchor="middle">train</text>

  <!-- bracket from the four train blocks down to the inner box -->
  <path d="M 40 70 L 40 78 L 556 78 L 556 70" fill="none" stroke="currentColor" stroke-opacity="0.5"/>
  <line x1="298" y1="78" x2="298" y2="92" stroke="currentColor" stroke-opacity="0.5"/>
  <text x="306" y="90" font-size="10" fill="currentColor" opacity="0.7">the four train blocks only &#8212; the amber fold is sealed off</text>

  <!-- inner box -->
  <rect x="60" y="96" width="476" height="118" fill="none" stroke="currentColor" stroke-opacity="0.5" rx="6" stroke-dasharray="5 3"/>
  <text x="74" y="116" font-size="12" font-weight="bold" fill="currentColor">Inner loop: selects</text>
  <!-- mini folds -->
  <g>
    <rect x="74" y="128" width="52" height="12" fill="#5aa46a" rx="2"/><rect x="128" y="128" width="52" height="12" fill="#4c8dd6" rx="2"/><rect x="182" y="128" width="52" height="12" fill="#4c8dd6" rx="2"/><rect x="236" y="128" width="52" height="12" fill="#4c8dd6" rx="2"/>
    <rect x="74" y="143" width="52" height="12" fill="#4c8dd6" rx="2"/><rect x="128" y="143" width="52" height="12" fill="#5aa46a" rx="2"/><rect x="182" y="143" width="52" height="12" fill="#4c8dd6" rx="2"/><rect x="236" y="143" width="52" height="12" fill="#4c8dd6" rx="2"/>
    <rect x="74" y="158" width="52" height="12" fill="#4c8dd6" rx="2"/><rect x="128" y="158" width="52" height="12" fill="#4c8dd6" rx="2"/><rect x="182" y="158" width="52" height="12" fill="#5aa46a" rx="2"/><rect x="236" y="158" width="52" height="12" fill="#4c8dd6" rx="2"/>
    <rect x="74" y="173" width="52" height="12" fill="#4c8dd6" rx="2"/><rect x="128" y="173" width="52" height="12" fill="#4c8dd6" rx="2"/><rect x="182" y="173" width="52" height="12" fill="#4c8dd6" rx="2"/><rect x="236" y="173" width="52" height="12" fill="#5aa46a" rx="2"/>
  </g>
  <text x="74" y="200" font-size="10" fill="currentColor" opacity="0.7">inner CV over the &#955; grid (green = inner validation)</text>
  <text x="310" y="146" font-size="11" fill="currentColor">inner CV(&#955;) minimized</text>
  <text x="310" y="163" font-size="11" fill="currentColor">&#8594; &#955;*&#8322; chosen in here</text>
  <text x="310" y="186" font-size="10" fill="currentColor" opacity="0.7">then refit at &#955;*&#8322; on all four train blocks</text>

  <!-- evaluation arrow -->
  <defs><marker id="arrn" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#e2903a"/></marker></defs>
  <path d="M 536 155 L 596 155 L 596 51 L 566 51" fill="none" stroke="#e2903a" stroke-width="1.6" marker-end="url(#arrn)"/>
  <text x="604" y="120" font-size="10" fill="#e2903a" text-anchor="middle" transform="rotate(-90 604 120)">score on the test fold</text>

  <!-- error boxes -->
  <text x="20" y="248" font-size="12" font-weight="bold" fill="currentColor">Five outer rounds, five held-out errors</text>
  <rect x="40" y="262" width="54" height="24" fill="none" stroke="currentColor" stroke-opacity="0.5" rx="3"/>
  <rect x="102" y="262" width="54" height="24" fill="none" stroke="#e2903a" rx="3"/>
  <rect x="164" y="262" width="54" height="24" fill="none" stroke="currentColor" stroke-opacity="0.5" rx="3"/>
  <rect x="226" y="262" width="54" height="24" fill="none" stroke="currentColor" stroke-opacity="0.5" rx="3"/>
  <rect x="288" y="262" width="54" height="24" fill="none" stroke="currentColor" stroke-opacity="0.5" rx="3"/>
  <text x="67" y="278" font-size="11" fill="currentColor" text-anchor="middle">e&#8321;</text>
  <text x="129" y="278" font-size="11" fill="#e2903a" text-anchor="middle">e&#8322;</text>
  <text x="191" y="278" font-size="11" fill="currentColor" text-anchor="middle">e&#8323;</text>
  <text x="253" y="278" font-size="11" fill="currentColor" text-anchor="middle">e&#8324;</text>
  <text x="315" y="278" font-size="11" fill="currentColor" text-anchor="middle">e&#8325;</text>
  <path d="M 350 274 L 396 274" fill="none" stroke="currentColor" stroke-opacity="0.6" marker-end="url(#arrn)"/>
  <ellipse cx="470" cy="274" rx="62" ry="20" fill="none" stroke="#e2903a" stroke-width="2"/>
  <text x="470" y="278" font-size="12" fill="currentColor" text-anchor="middle">(1/5) &#931; e&#8342;</text>
  <text x="470" y="312" font-size="10.5" fill="currentColor" text-anchor="middle">the one number that may be reported</text>
  <text x="20" y="312" font-size="10" fill="currentColor" opacity="0.7">each round may pick a different &#955;* &#8212; allowed:</text>
  <text x="20" y="326" font-size="10" fill="currentColor" opacity="0.7">the report grades the procedure, not one fit</text>
</svg>

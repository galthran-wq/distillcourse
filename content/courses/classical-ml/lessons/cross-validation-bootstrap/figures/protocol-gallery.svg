<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="system-ui, sans-serif">
  <!-- legend -->
  <rect x="20" y="14" width="12" height="12" fill="#4c8dd6" rx="2"/>
  <text x="38" y="24" font-size="11" fill="currentColor">train</text>
  <rect x="80" y="14" width="12" height="12" fill="#e2903a" rx="2"/>
  <text x="98" y="24" font-size="11" fill="currentColor">validation</text>

  <!-- Row 1: hold-out -->
  <text x="20" y="56" font-size="12" font-weight="bold" fill="currentColor">Hold-out</text>
  <rect x="90" y="44" width="30" height="20" fill="#4c8dd6" rx="2"/>
  <rect x="121" y="44" width="30" height="20" fill="#4c8dd6" rx="2"/>
  <rect x="152" y="44" width="30" height="20" fill="#4c8dd6" rx="2"/>
  <rect x="183" y="44" width="30" height="20" fill="#4c8dd6" rx="2"/>
  <rect x="214" y="44" width="30" height="20" fill="#4c8dd6" rx="2"/>
  <rect x="245" y="44" width="30" height="20" fill="#4c8dd6" rx="2"/>
  <rect x="276" y="44" width="30" height="20" fill="#4c8dd6" rx="2"/>
  <rect x="307" y="44" width="30" height="20" fill="#e2903a" rx="2"/>
  <rect x="338" y="44" width="30" height="20" fill="#e2903a" rx="2"/>
  <rect x="369" y="44" width="30" height="20" fill="#e2903a" rx="2"/>
  <text x="90" y="80" font-size="10" fill="currentColor" opacity="0.7">one split, one score</text>
  <text x="430" y="50" font-size="10.5" fill="currentColor">scores a model trained on 0.7n;</text>
  <text x="430" y="64" font-size="10.5" fill="currentColor">one arbitrary draw &#8212; high variance,</text>
  <text x="430" y="78" font-size="10.5" fill="currentColor">and 30% of the data never trains</text>

  <!-- Row 2: 5-fold -->
  <text x="20" y="132" font-size="12" font-weight="bold" fill="currentColor">5-fold CV</text>
  <g>
    <rect x="90" y="112" width="60" height="14" fill="#e2903a" rx="2"/><rect x="152" y="112" width="60" height="14" fill="#4c8dd6" rx="2"/><rect x="214" y="112" width="60" height="14" fill="#4c8dd6" rx="2"/><rect x="276" y="112" width="60" height="14" fill="#4c8dd6" rx="2"/><rect x="338" y="112" width="60" height="14" fill="#4c8dd6" rx="2"/>
    <rect x="90" y="129" width="60" height="14" fill="#4c8dd6" rx="2"/><rect x="152" y="129" width="60" height="14" fill="#e2903a" rx="2"/><rect x="214" y="129" width="60" height="14" fill="#4c8dd6" rx="2"/><rect x="276" y="129" width="60" height="14" fill="#4c8dd6" rx="2"/><rect x="338" y="129" width="60" height="14" fill="#4c8dd6" rx="2"/>
    <rect x="90" y="146" width="60" height="14" fill="#4c8dd6" rx="2"/><rect x="152" y="146" width="60" height="14" fill="#4c8dd6" rx="2"/><rect x="214" y="146" width="60" height="14" fill="#e2903a" rx="2"/><rect x="276" y="146" width="60" height="14" fill="#4c8dd6" rx="2"/><rect x="338" y="146" width="60" height="14" fill="#4c8dd6" rx="2"/>
    <rect x="90" y="163" width="60" height="14" fill="#4c8dd6" rx="2"/><rect x="152" y="163" width="60" height="14" fill="#4c8dd6" rx="2"/><rect x="214" y="163" width="60" height="14" fill="#4c8dd6" rx="2"/><rect x="276" y="163" width="60" height="14" fill="#e2903a" rx="2"/><rect x="338" y="163" width="60" height="14" fill="#4c8dd6" rx="2"/>
    <rect x="90" y="180" width="60" height="14" fill="#4c8dd6" rx="2"/><rect x="152" y="180" width="60" height="14" fill="#4c8dd6" rx="2"/><rect x="214" y="180" width="60" height="14" fill="#4c8dd6" rx="2"/><rect x="276" y="180" width="60" height="14" fill="#4c8dd6" rx="2"/><rect x="338" y="180" width="60" height="14" fill="#e2903a" rx="2"/>
  </g>
  <text x="90" y="212" font-size="10" fill="currentColor" opacity="0.7">every point validates exactly once; five scores averaged</text>
  <text x="430" y="134" font-size="10.5" fill="currentColor">trains on 0.8n &#8212; a small upward</text>
  <text x="430" y="148" font-size="10.5" fill="currentColor">bias, read off the learning curve;</text>
  <text x="430" y="162" font-size="10.5" fill="currentColor">averaging five moderately different</text>
  <text x="430" y="176" font-size="10.5" fill="currentColor">fits tames the variance</text>

  <!-- Row 3: LOOCV -->
  <text x="20" y="262" font-size="12" font-weight="bold" fill="currentColor">LOOCV</text>
  <text x="20" y="276" font-size="10" fill="currentColor" opacity="0.7">(k = n)</text>
  <g>
    <rect x="90" y="248" width="14" height="20" fill="#4c8dd6" rx="2"/><rect x="105" y="248" width="14" height="20" fill="#4c8dd6" rx="2"/><rect x="120" y="248" width="14" height="20" fill="#4c8dd6" rx="2"/><rect x="135" y="248" width="14" height="20" fill="#4c8dd6" rx="2"/><rect x="150" y="248" width="14" height="20" fill="#4c8dd6" rx="2"/><rect x="165" y="248" width="14" height="20" fill="#4c8dd6" rx="2"/><rect x="180" y="248" width="14" height="20" fill="#e2903a" rx="2"/><rect x="195" y="248" width="14" height="20" fill="#4c8dd6" rx="2"/><rect x="210" y="248" width="14" height="20" fill="#4c8dd6" rx="2"/><rect x="225" y="248" width="14" height="20" fill="#4c8dd6" rx="2"/><rect x="240" y="248" width="14" height="20" fill="#4c8dd6" rx="2"/><rect x="255" y="248" width="14" height="20" fill="#4c8dd6" rx="2"/><rect x="270" y="248" width="14" height="20" fill="#4c8dd6" rx="2"/><rect x="285" y="248" width="14" height="20" fill="#4c8dd6" rx="2"/><rect x="300" y="248" width="14" height="20" fill="#4c8dd6" rx="2"/><rect x="315" y="248" width="14" height="20" fill="#4c8dd6" rx="2"/><rect x="330" y="248" width="14" height="20" fill="#4c8dd6" rx="2"/><rect x="345" y="248" width="14" height="20" fill="#4c8dd6" rx="2"/><rect x="360" y="248" width="14" height="20" fill="#4c8dd6" rx="2"/><rect x="375" y="248" width="14" height="20" fill="#4c8dd6" rx="2"/>
  </g>
  <text x="90" y="284" font-size="10" fill="currentColor" opacity="0.7">one point out per fit &#8212; n fits (one fit, for linear smoothers)</text>
  <text x="430" y="252" font-size="10.5" fill="currentColor">trains on n &#8722; 1: nearly unbiased;</text>
  <text x="430" y="266" font-size="10.5" fill="currentColor">the n fits are nearly identical, so</text>
  <text x="430" y="280" font-size="10.5" fill="currentColor">their errors are correlated and the</text>
  <text x="430" y="294" font-size="10.5" fill="currentColor">average keeps a high variance</text>
</svg>

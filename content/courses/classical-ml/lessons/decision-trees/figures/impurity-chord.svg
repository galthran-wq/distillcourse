<svg viewBox="0 0 480 290" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- axes -->
  <line x1="50" y1="240" x2="430" y2="240" stroke="currentColor" opacity="0.6"/>
  <line x1="50" y1="240" x2="50" y2="40" stroke="currentColor" opacity="0.6"/>
  <text x="50" y="256" font-size="10" text-anchor="middle" opacity="0.55">0</text>
  <text x="126" y="256" font-size="10" text-anchor="middle" opacity="0.55">0.2</text>
  <text x="176.7" y="256" font-size="10" text-anchor="middle" opacity="0.55">&#8531;</text>
  <text x="240" y="256" font-size="10" text-anchor="middle" opacity="0.55">0.5</text>
  <text x="430" y="256" font-size="10" text-anchor="middle" opacity="0.55">1</text>
  <text x="240" y="278" font-size="11" text-anchor="middle" opacity="0.7">p = class-1 fraction; parent (80,20) split into (40,0) and (40,20)</text>

  <!-- curves -->
  <polyline points="50,240 240,40 430,240" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <path d="M 50 240 Q 240 -160 430 240" fill="none" stroke="#e2903a" stroke-width="2"/>
  <text x="348" y="104" font-size="11" fill="#e2903a">Gini</text>
  <text x="308" y="176" font-size="11" opacity="0.85">misclassification</text>

  <!-- parent guide -->
  <line x1="126" y1="240" x2="126" y2="60" stroke="currentColor" opacity="0.35" stroke-dasharray="3 3"/>

  <!-- Gini chord: (0,0) to (1/3, 4/9) -->
  <line x1="50" y1="240" x2="176.7" y2="62.2" stroke="#4c8dd6" stroke-width="1.5" stroke-dasharray="5 3"/>
  <circle cx="50" cy="240" r="4" fill="#4c8dd6"/>
  <circle cx="176.7" cy="62.2" r="4" fill="#4c8dd6"/>
  <circle cx="126" cy="112" r="4" fill="#e2903a"/>
  <circle cx="126" cy="133.3" r="3.5" fill="#4c8dd6"/>
  <!-- gain arrow on Gini -->
  <line x1="126" y1="112" x2="126" y2="133.3" stroke="#e2903a" stroke-width="2"/>
  <text x="134" y="127" font-size="10" fill="#e2903a">gain 0.053</text>

  <!-- misclassification: children sit on the same linear branch -->
  <circle cx="176.7" cy="106.7" r="4" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <circle cx="126" cy="160" r="4" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="150" y="200" font-size="10" opacity="0.8">chord lies on the curve: gain 0</text>
  <line x1="160" y1="190" x2="140" y2="166" stroke="currentColor" opacity="0.5"/>

  <!-- child labels -->
  <text x="58" y="234" font-size="10" opacity="0.8">(40,0)</text>
  <text x="184" y="58" font-size="10" opacity="0.8">(40,20)</text>
  <text x="96" y="98" font-size="10" opacity="0.8">parent</text>
</svg>

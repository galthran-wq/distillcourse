<svg viewBox="0 0 640 230" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="40" y="18" font-size="11">Replace x&#8321; by log&#8321;&#8320; x&#8321;: the threshold moves, no point changes sides.</text>

  <!-- left-child bands -->
  <rect x="50" y="57" width="154.4" height="36" rx="3" fill="#4c8dd6" opacity="0.12"/>
  <rect x="50" y="152" width="292.9" height="36" rx="3" fill="#4c8dd6" opacity="0.12"/>

  <!-- connectors: same point on both scales -->
  <g stroke="currentColor" opacity="0.18">
    <line x1="60" y1="80" x2="60" y2="165"/>
    <line x1="117.8" y1="80" x2="216.5" y2="165"/>
    <line x1="175.6" y1="80" x2="308.1" y2="165"/>
    <line x1="233.3" y1="80" x2="373.1" y2="165"/>
    <line x1="291.1" y1="80" x2="423.5" y2="165"/>
    <line x1="348.9" y1="80" x2="464.6" y2="165"/>
    <line x1="406.7" y1="80" x2="499.5" y2="165"/>
    <line x1="464.4" y1="80" x2="529.6" y2="165"/>
    <line x1="522.2" y1="80" x2="556.2" y2="165"/>
    <line x1="580" y1="80" x2="580" y2="165"/>
  </g>

  <!-- raw axis -->
  <text x="50" y="45" font-size="11" opacity="0.7">raw scale x&#8321;</text>
  <line x1="50" y1="75" x2="590" y2="75" stroke="currentColor" opacity="0.6"/>
  <g fill="currentColor">
    <circle cx="60" cy="75" r="4.5"/>
    <circle cx="117.8" cy="75" r="4.5"/>
    <circle cx="175.6" cy="75" r="4.5"/>
    <circle cx="233.3" cy="75" r="4.5"/>
    <circle cx="291.1" cy="75" r="4.5"/>
    <circle cx="348.9" cy="75" r="4.5"/>
    <circle cx="406.7" cy="75" r="4.5"/>
    <circle cx="464.4" cy="75" r="4.5"/>
    <circle cx="522.2" cy="75" r="4.5"/>
    <circle cx="580" cy="75" r="4.5"/>
  </g>
  <text x="60" y="105" font-size="10" text-anchor="middle" opacity="0.55">1</text>
  <text x="580" y="105" font-size="10" text-anchor="middle" opacity="0.55">10</text>
  <line x1="204.4" y1="50" x2="204.4" y2="100" stroke="#e2903a" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="212" y="56" font-size="10" fill="#e2903a">x&#8321; &lt; 3.5</text>

  <!-- log axis -->
  <text x="50" y="140" font-size="11" opacity="0.7">log scale log&#8321;&#8320; x&#8321;</text>
  <line x1="50" y1="170" x2="590" y2="170" stroke="currentColor" opacity="0.6"/>
  <g fill="currentColor">
    <circle cx="60" cy="170" r="4.5"/>
    <circle cx="216.5" cy="170" r="4.5"/>
    <circle cx="308.1" cy="170" r="4.5"/>
    <circle cx="373.1" cy="170" r="4.5"/>
    <circle cx="423.5" cy="170" r="4.5"/>
    <circle cx="464.6" cy="170" r="4.5"/>
    <circle cx="499.5" cy="170" r="4.5"/>
    <circle cx="529.6" cy="170" r="4.5"/>
    <circle cx="556.2" cy="170" r="4.5"/>
    <circle cx="580" cy="170" r="4.5"/>
  </g>
  <text x="60" y="200" font-size="10" text-anchor="middle" opacity="0.55">0</text>
  <text x="580" y="200" font-size="10" text-anchor="middle" opacity="0.55">1</text>
  <line x1="342.9" y1="145" x2="342.9" y2="195" stroke="#e2903a" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="350.9" y="151" font-size="10" fill="#e2903a">log&#8321;&#8320; x&#8321; &lt; 0.544</text>

  <text x="320" y="222" font-size="10" text-anchor="middle" opacity="0.7">3 points left of the threshold, 7 right &#8212; on both scales</text>
</svg>

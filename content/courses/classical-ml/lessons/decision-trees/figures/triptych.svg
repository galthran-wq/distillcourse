<svg viewBox="0 0 640 248" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- panel titles -->
  <text x="114" y="18" font-size="11" text-anchor="middle" opacity="0.55" letter-spacing="1">PARTITION</text>
  <text x="330" y="18" font-size="11" text-anchor="middle" opacity="0.55" letter-spacing="1">TREE</text>
  <text x="535" y="18" font-size="11" text-anchor="middle" opacity="0.55" letter-spacing="1">SURFACE</text>

  <!-- ===== Panel A: partition ===== -->
  <g>
    <rect x="24" y="120" width="72" height="90" fill="#4c8dd6" opacity="0.40"/>
    <rect x="24" y="30" width="72" height="90" fill="#4c8dd6" opacity="0.15"/>
    <rect x="96" y="30" width="63" height="180" fill="#e2903a" opacity="0.35"/>
    <rect x="159" y="102" width="45" height="108" fill="#5aa46a" opacity="0.35"/>
    <rect x="159" y="30" width="45" height="72" fill="#e2903a" opacity="0.12"/>
    <!-- split lines -->
    <line x1="96" y1="30" x2="96" y2="210" stroke="currentColor" stroke-width="1.5"/>
    <line x1="24" y1="120" x2="96" y2="120" stroke="currentColor" stroke-width="1.5"/>
    <line x1="159" y1="30" x2="159" y2="210" stroke="currentColor" stroke-width="1.5"/>
    <line x1="159" y1="102" x2="204" y2="102" stroke="currentColor" stroke-width="1.5"/>
    <!-- frame -->
    <rect x="24" y="30" width="180" height="180" fill="none" stroke="currentColor" opacity="0.6"/>
    <!-- region labels -->
    <text x="60" y="169" font-size="12" text-anchor="middle">R1</text>
    <text x="60" y="79" font-size="12" text-anchor="middle">R2</text>
    <text x="127" y="124" font-size="12" text-anchor="middle">R3</text>
    <text x="181" y="160" font-size="12" text-anchor="middle">R4</text>
    <text x="181" y="70" font-size="12" text-anchor="middle">R5</text>
    <!-- ticks -->
    <text x="96" y="224" font-size="11" text-anchor="middle" opacity="0.7">t1</text>
    <text x="159" y="224" font-size="11" text-anchor="middle" opacity="0.7">t3</text>
    <text x="14" y="124" font-size="11" text-anchor="middle" opacity="0.7">t2</text>
    <text x="214" y="106" font-size="11" text-anchor="middle" opacity="0.7">t4</text>
    <text x="114" y="240" font-size="12" text-anchor="middle" opacity="0.7">X1</text>
    <text x="10" y="40" font-size="12" text-anchor="middle" opacity="0.7">X2</text>
  </g>

  <!-- ===== Panel B: tree ===== -->
  <g font-size="10">
    <!-- edges -->
    <line x1="300" y1="60" x2="258" y2="89" stroke="currentColor"/>
    <line x1="330" y1="60" x2="365" y2="89" stroke="currentColor"/>
    <line x1="248" y1="111" x2="238" y2="140" stroke="currentColor"/>
    <line x1="268" y1="111" x2="285" y2="140" stroke="currentColor"/>
    <line x1="355" y1="111" x2="338" y2="142" stroke="currentColor"/>
    <line x1="380" y1="111" x2="398" y2="139" stroke="currentColor"/>
    <line x1="388" y1="161" x2="380" y2="192" stroke="currentColor"/>
    <line x1="410" y1="161" x2="424" y2="192" stroke="currentColor"/>
    <!-- internal nodes -->
    <rect x="283" y="38" width="64" height="22" rx="4" fill="none" stroke="currentColor"/>
    <text x="315" y="53" text-anchor="middle">X1 &lt; t1</text>
    <rect x="226" y="89" width="64" height="22" rx="4" fill="none" stroke="currentColor"/>
    <text x="258" y="104" text-anchor="middle">X2 &lt; t2</text>
    <rect x="333" y="89" width="64" height="22" rx="4" fill="none" stroke="currentColor"/>
    <text x="365" y="104" text-anchor="middle">X1 &lt; t3</text>
    <rect x="366" y="139" width="64" height="22" rx="4" fill="none" stroke="currentColor"/>
    <text x="398" y="154" text-anchor="middle">X2 &lt; t4</text>
    <!-- leaves -->
    <circle cx="238" cy="153" r="13" fill="#4c8dd6" opacity="0.40" stroke="currentColor"/>
    <text x="238" y="157" text-anchor="middle">R1</text>
    <circle cx="285" cy="153" r="13" fill="#4c8dd6" opacity="0.15" stroke="currentColor"/>
    <text x="285" y="157" text-anchor="middle">R2</text>
    <circle cx="338" cy="155" r="13" fill="#e2903a" opacity="0.35" stroke="currentColor"/>
    <text x="338" y="159" text-anchor="middle">R3</text>
    <circle cx="380" cy="205" r="13" fill="#5aa46a" opacity="0.35" stroke="currentColor"/>
    <text x="380" y="209" text-anchor="middle">R4</text>
    <circle cx="424" cy="205" r="13" fill="#e2903a" opacity="0.12" stroke="currentColor"/>
    <text x="424" y="209" text-anchor="middle">R5</text>
  </g>

  <!-- ===== Panel C: piecewise-constant surface (oblique) ===== -->
  <g stroke="currentColor" stroke-width="0.6">
    <!-- R2 (back left, blue, h=55) -->
    <rect x="475" y="122.5" width="48" height="55" fill="#4c8dd6" opacity="0.28"/>
    <polygon points="523,177.5 543,150 543,95 523,122.5" fill="#4c8dd6" opacity="0.18"/>
    <polygon points="475,122.5 523,122.5 543,95 495,95" fill="#4c8dd6" opacity="0.45"/>
    <!-- R5 (back right, amber pale, h=90) -->
    <rect x="569" y="82" width="30" height="90" fill="#e2903a" opacity="0.18"/>
    <polygon points="599,172 615,150 615,60 599,82" fill="#e2903a" opacity="0.12"/>
    <polygon points="569,82 599,82 615,60 585,60" fill="#e2903a" opacity="0.30"/>
    <!-- R3 (middle, amber, h=35) -->
    <rect x="503" y="170" width="42" height="35" fill="#e2903a" opacity="0.28"/>
    <polygon points="545,205 585,150 585,115 545,170" fill="#e2903a" opacity="0.18"/>
    <polygon points="503,170 545,170 585,115 543,115" fill="#e2903a" opacity="0.45"/>
    <!-- R4 (front right, green, h=70) -->
    <rect x="545" y="135" width="30" height="70" fill="#5aa46a" opacity="0.28"/>
    <polygon points="575,205 599,172 599,102 575,135" fill="#5aa46a" opacity="0.18"/>
    <polygon points="545,135 575,135 599,102 569,102" fill="#5aa46a" opacity="0.45"/>
    <!-- R1 (front left, blue, h=20) -->
    <rect x="455" y="185" width="48" height="20" fill="#4c8dd6" opacity="0.32"/>
    <polygon points="503,205 523,177.5 523,157.5 503,185" fill="#4c8dd6" opacity="0.18"/>
    <polygon points="455,185 503,185 523,157.5 475,157.5" fill="#4c8dd6" opacity="0.45"/>
  </g>
  <text x="537" y="232" font-size="11" text-anchor="middle" opacity="0.6">height = leaf constant c&#8344;</text>
</svg>

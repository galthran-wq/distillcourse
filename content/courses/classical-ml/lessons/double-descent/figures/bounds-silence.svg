<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300" font-family="system-ui, sans-serif" font-size="12">
  <!-- regime split -->
  <rect x="390" y="34" width="216" height="232" fill="currentColor" opacity="0.05"/>
  <line x1="390" y1="34" x2="390" y2="266" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5"/>
  <text x="300" y="24" text-anchor="middle" font-size="11" opacity="0.7" fill="currentColor">classical regime</text>
  <text x="498" y="24" text-anchor="middle" font-size="11" fill="currentColor">interpolating regime: training error 0</text>

  <!-- row 1: finite-class -->
  <text x="8" y="66" font-size="12" fill="currentColor">Hoeffding + union bound</text>
  <text x="8" y="80" font-size="11" opacity="0.55" fill="currentColor">module 9, finite classes</text>
  <line x1="210" y1="72" x2="390" y2="72" stroke="currentColor" stroke-width="4" opacity="0.7"/>
  <line x1="390" y1="72" x2="606" y2="72" stroke="currentColor" stroke-width="1.5" stroke-dasharray="2 4" opacity="0.4"/>
  <text x="398" y="52" font-size="11" opacity="0.7" fill="currentColor">silent: two-sided uniform convergence</text>
  <text x="398" y="66" font-size="11" opacity="0.7" fill="currentColor">cannot hold over the interpolating class</text>

  <!-- row 2: VC -->
  <text x="8" y="124" font-size="12" fill="currentColor">VC dimension</text>
  <text x="8" y="138" font-size="11" opacity="0.55" fill="currentColor">growth-function bound</text>
  <line x1="210" y1="130" x2="390" y2="130" stroke="currentColor" stroke-width="4" opacity="0.7"/>
  <line x1="390" y1="130" x2="606" y2="130" stroke="currentColor" stroke-width="1.5" stroke-dasharray="2 4" opacity="0.4"/>
  <text x="398" y="110" font-size="11" opacity="0.7" fill="currentColor">vacuous: the class shatters the sample,</text>
  <text x="398" y="124" font-size="11" opacity="0.7" fill="currentColor">so the certificate reads ≥ 1</text>

  <!-- row 3: stability -->
  <text x="8" y="182" font-size="12" fill="currentColor">Uniform stability</text>
  <text x="8" y="196" font-size="11" opacity="0.55" fill="currentColor">stability coefficient ≤ c²rₓ²/(nλ)</text>
  <line x1="210" y1="188" x2="390" y2="188" stroke="currentColor" stroke-width="4" opacity="0.7"/>
  <line x1="390" y1="188" x2="500" y2="188" stroke="currentColor" stroke-width="4" opacity="0.35"/>
  <line x1="500" y1="188" x2="606" y2="188" stroke="currentColor" stroke-width="1.5" stroke-dasharray="2 4" opacity="0.4"/>
  <text x="398" y="168" font-size="11" opacity="0.7" fill="currentColor">speaks at fixed λ &gt; 0; blows up</text>
  <text x="398" y="182" font-size="11" opacity="0.7" fill="currentColor">in the ridgeless limit λ → 0</text>

  <!-- row 4: norms and margins -->
  <text x="8" y="240" font-size="12" fill="#e2903a">Norms and margins</text>
  <text x="8" y="254" font-size="11" opacity="0.55" fill="currentColor">Rademacher ball, margin bounds</text>
  <line x1="210" y1="246" x2="606" y2="246" stroke="#e2903a" stroke-width="4"/>
  <text x="398" y="226" font-size="11" fill="#e2903a">still speaks: priced by ‖β̂‖, which is</text>
  <text x="398" y="240" font-size="11" fill="#e2903a">finite — and falling — past the threshold</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" font-family="system-ui, sans-serif" font-size="12">
  <!-- coefficient plane axes -->
  <line x1="60" y1="290" x2="560" y2="290" stroke="currentColor" stroke-width="1" opacity="0.4"/>
  <line x1="60" y1="290" x2="60" y2="30" stroke="currentColor" stroke-width="1" opacity="0.4"/>
  <text x="556" y="306" text-anchor="end" font-size="11" opacity="0.55" fill="currentColor">β₁</text>
  <text x="46" y="38" text-anchor="end" font-size="11" opacity="0.55" fill="currentColor">β₂</text>

  <!-- solution set: all interpolants (blue line), perpendicular to row space -->
  <line x1="262" y1="38.5" x2="448" y2="286.5" stroke="#4c8dd6" stroke-width="2"/>
  <text x="278" y="40" fill="#4c8dd6">all interpolants: Xβ = y</text>
  <text x="278" y="56" fill="#4c8dd6" font-size="11">an affine space of dimension p − n</text>

  <!-- row space through origin (amber) -->
  <line x1="60" y1="290" x2="352" y2="71" stroke="#e2903a" stroke-width="1.6" stroke-dasharray="6 3" opacity="0.8"/>
  <text x="104" y="204" fill="#e2903a">row space of X</text>
  <text x="104" y="220" fill="#e2903a" font-size="11">every iterate lives here</text>

  <!-- GD iterates from origin along row space toward intersection -->
  <circle cx="60" cy="290" r="4.5" fill="currentColor"/>
  <text x="72" y="298" font-size="11" fill="currentColor">β⁽⁰⁾ = 0</text>
  <circle cx="156" cy="218" r="3.5" fill="#e2903a"/>
  <circle cx="228" cy="164" r="3.5" fill="#e2903a"/>
  <circle cx="270" cy="132.5" r="3.5" fill="#e2903a"/>
  <circle cx="292" cy="116" r="3.5" fill="#e2903a"/>
  <circle cx="303" cy="107.8" r="3.5" fill="#e2903a"/>
  <!-- limit: min-norm solution at intersection -->
  <circle cx="310" cy="102.5" r="5" fill="#5aa46a"/>
  <text x="322" y="94" fill="#5aa46a">β̂ = the min-norm interpolant</text>
  <text x="322" y="110" fill="#5aa46a" font-size="11">the one least-squares solution in the row space</text>

  <!-- right-angle marker at intersection -->
  <path d="M300.4,109.7 L307.6,119.3 L317.2,112.1" fill="none" stroke="currentColor" stroke-width="1" opacity="0.6"/>

  <!-- distance arc: closest point to origin -->
  <path d="M310,102.5 A312.5,312.5 0 0 1 364,217" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="2 4" opacity="0.45"/>
  <text x="384" y="230" font-size="11" opacity="0.55" fill="currentColor">no other interpolant is closer to 0</text>
</svg>

<svg viewBox="0 0 560 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .axis { stroke: currentColor; opacity: 0.35; }
    .name { fill: currentColor; }
    .val { fill: #4c8dd6; font-size: 12px; }
  </style>

  <!-- the floor: ratio 1.0, where an estimator attaining the bound sits -->
  <line x1="345" y1="40" x2="345" y2="252" stroke="#e2903a" stroke-width="1.5"/>
  <text x="345" y="32" fill="#e2903a" text-anchor="middle" font-size="12">Cramér–Rao floor</text>

  <!-- axis: empirical variance divided by the floor -->
  <line class="axis" x1="170" y1="252" x2="520" y2="252"/>
  <line class="axis" x1="170" y1="252" x2="170" y2="258"/>
  <line class="axis" x1="345" y1="252" x2="345" y2="258"/>
  <line class="axis" x1="520" y1="252" x2="520" y2="258"/>
  <text class="muted" x="170" y="271" text-anchor="middle">0</text>
  <text class="muted" x="345" y="271" text-anchor="middle">1</text>
  <text class="muted" x="520" y="271" text-anchor="middle">2</text>
  <text class="muted" x="345" y="290" text-anchor="middle">empirical variance across 4,000 replicates ÷ 1/(n I(θ₀))</text>

  <!-- rows: one estimator each, measured at n = 25 -->
  <text class="name" x="160" y="65" text-anchor="end">Poisson sample mean</text>
  <circle cx="346.6" cy="60" r="5" fill="#4c8dd6"/>
  <text class="val" x="359" y="65">1.01</text>

  <text class="name" x="160" y="105" text-anchor="end">Gaussian variance MLE</text>
  <circle cx="340.1" cy="100" r="5" fill="#4c8dd6"/>
  <text class="val" x="353" y="105">0.97</text>

  <text class="name" x="160" y="145" text-anchor="end">Poisson S²</text>
  <line x1="345" y1="140" x2="516" y2="140" stroke="#4c8dd6" stroke-width="1" stroke-dasharray="3 3" opacity="0.6"/>
  <path d="M516 135 526 140 516 145 Z" fill="#4c8dd6"/>
  <text class="val" x="531" y="145">7.6</text>

  <text class="name" x="160" y="185" text-anchor="end">0.8 × Poisson mean</text>
  <circle cx="283.1" cy="180" r="5" fill="#4c8dd6"/>
  <text class="val" x="296" y="185">0.65</text>
  <text class="muted" x="296" y="199">biased: the bound never governed it</text>

  <text class="name" x="160" y="225" text-anchor="end">Uniform(0, θ) max</text>
  <circle cx="184.5" cy="220" r="5" fill="#4c8dd6"/>
  <text class="val" x="197" y="225">0.08</text>
  <text class="muted" x="197" y="239">support moves with θ: no bound at all</text>
</svg>

<svg viewBox="0 0 640 252" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- grid -->
  <rect x="10" y="26" width="620" height="212" rx="6" fill="none" stroke="currentColor"/>
  <line x1="10" y1="54" x2="630" y2="54" stroke="currentColor" opacity="0.5"/>
  <line x1="10" y1="116" x2="630" y2="116" stroke="currentColor" opacity="0.3"/>
  <line x1="10" y1="178" x2="630" y2="178" stroke="currentColor" opacity="0.3"/>
  <line x1="148" y1="26" x2="148" y2="238" stroke="currentColor" opacity="0.3"/>
  <line x1="310" y1="26" x2="310" y2="238" stroke="currentColor" opacity="0.3"/>
  <line x1="472" y1="26" x2="472" y2="238" stroke="currentColor" opacity="0.3"/>

  <!-- column headers -->
  <text x="229" y="44" text-anchor="middle" font-size="12" font-weight="600" fill="currentColor">linear / penalized</text>
  <text x="391" y="44" text-anchor="middle" font-size="12" font-weight="600" fill="currentColor">distance (k-NN, SVM)</text>
  <text x="551" y="44" text-anchor="middle" font-size="12" font-weight="600" fill="currentColor">trees / ensembles</text>

  <!-- row headers -->
  <text x="20" y="80" font-size="12" font-weight="600" fill="currentColor">&#8804; ~15 levels</text>
  <text x="20" y="96" font-size="10" fill="currentColor" opacity="0.55">unordered</text>
  <text x="20" y="142" font-size="12" font-weight="600" fill="currentColor">100s+ levels</text>
  <text x="20" y="158" font-size="10" fill="currentColor" opacity="0.55">unordered</text>
  <text x="20" y="204" font-size="12" font-weight="600" fill="currentColor">ordered levels</text>
  <text x="20" y="220" font-size="10" fill="currentColor" opacity="0.55">small &#60; med &#60; large</text>

  <!-- row 1 -->
  <text x="229" y="80" text-anchor="middle" font-size="12" fill="currentColor">one-hot, drop one</text>
  <text x="229" y="97" text-anchor="middle" font-size="10" fill="#e2903a">K columns sum to the intercept</text>
  <text x="391" y="80" text-anchor="middle" font-size="12" fill="currentColor">one-hot, then scale</text>
  <text x="391" y="97" text-anchor="middle" font-size="10" fill="#e2903a">each level adds an axis</text>
  <text x="551" y="80" text-anchor="middle" font-size="12" fill="currentColor">one-hot or native</text>
  <text x="551" y="97" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.55">no scaling needed</text>

  <!-- row 2 -->
  <text x="229" y="142" text-anchor="middle" font-size="12" fill="currentColor">target, out-of-fold + blend</text>
  <text x="229" y="159" text-anchor="middle" font-size="10" fill="#e2903a">the column contains y</text>
  <text x="391" y="142" text-anchor="middle" font-size="12" fill="currentColor">target, out-of-fold</text>
  <text x="391" y="159" text-anchor="middle" font-size="10" fill="#e2903a">the column contains y</text>
  <text x="551" y="142" text-anchor="middle" font-size="12" fill="currentColor">target, ordered variant</text>
  <text x="551" y="159" text-anchor="middle" font-size="10" fill="#e2903a">naive means leak</text>

  <!-- row 3 -->
  <text x="229" y="204" text-anchor="middle" font-size="12" fill="currentColor">ordinal codes</text>
  <text x="229" y="221" text-anchor="middle" font-size="10" fill="#e2903a">spacing is read as fact</text>
  <text x="391" y="204" text-anchor="middle" font-size="12" fill="currentColor">ordinal, scaled</text>
  <text x="391" y="221" text-anchor="middle" font-size="10" fill="#e2903a">spacing enters the distance</text>
  <text x="551" y="204" text-anchor="middle" font-size="12" fill="currentColor">ordinal codes</text>
  <text x="551" y="221" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.55">only the order is read</text>
</svg>

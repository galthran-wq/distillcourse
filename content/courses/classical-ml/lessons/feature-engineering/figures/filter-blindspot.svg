<svg viewBox="0 0 640 262" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- panel titles -->
  <text x="165" y="20" text-anchor="middle" font-size="12" font-weight="600" fill="currentColor">marginal: x&#8321; against y</text>
  <text x="505" y="20" text-anchor="middle" font-size="12" font-weight="600" fill="currentColor">joint: x&#8321; against y &#8722; 2x&#8322;</text>

  <!-- ===== left panel ===== -->
  <line x1="60" y1="125" x2="270" y2="125" stroke="currentColor" opacity="0.35"/>
  <line x1="165" y1="45" x2="165" y2="205" stroke="currentColor" opacity="0.35"/>
  <text x="272" y="140" font-size="10" fill="currentColor" opacity="0.55">x&#8321;</text>
  <text x="152" y="42" font-size="10" fill="currentColor" opacity="0.55">y</text>
  <text x="95" y="222" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.55">&#8722;1</text>
  <text x="235" y="222" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.55">+1</text>

  <!-- four equal clusters -->
  <g fill="#4c8dd6">
    <circle cx="88" cy="51" r="4"/><circle cx="100" cy="57" r="4"/><circle cx="93" cy="63" r="4"/><circle cx="103" cy="48" r="4"/><circle cx="96" cy="55" r="4"/>
    <circle cx="228" cy="51" r="4"/><circle cx="240" cy="57" r="4"/><circle cx="233" cy="63" r="4"/><circle cx="243" cy="48" r="4"/><circle cx="236" cy="55" r="4"/>
    <circle cx="88" cy="191" r="4"/><circle cx="100" cy="197" r="4"/><circle cx="93" cy="203" r="4"/><circle cx="103" cy="188" r="4"/><circle cx="96" cy="195" r="4"/>
    <circle cx="228" cy="191" r="4"/><circle cx="240" cy="197" r="4"/><circle cx="233" cy="203" r="4"/><circle cx="243" cy="188" r="4"/><circle cx="236" cy="195" r="4"/>
  </g>

  <!-- flat least-squares line -->
  <line x1="62" y1="125" x2="268" y2="125" stroke="#e2903a" stroke-width="2.2"/>
  <text x="165" y="245" text-anchor="middle" font-size="12" font-weight="600" fill="#e2903a">least-squares fit is flat: corr(x&#8321;, y) = 0</text>

  <!-- ===== right panel ===== -->
  <line x1="400" y1="125" x2="610" y2="125" stroke="currentColor" opacity="0.35"/>
  <line x1="505" y1="45" x2="505" y2="205" stroke="currentColor" opacity="0.35"/>
  <text x="612" y="140" font-size="10" fill="currentColor" opacity="0.55">x&#8321;</text>
  <text x="470" y="42" font-size="10" fill="currentColor" opacity="0.55">y &#8722; 2x&#8322;</text>
  <text x="435" y="222" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.55">&#8722;1</text>
  <text x="575" y="222" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.55">+1</text>

  <!-- unit-slope line -->
  <line x1="411" y1="219" x2="599" y2="31" stroke="#e2903a" stroke-width="2.2"/>

  <!-- points sit exactly on the line (jitter along it) -->
  <g fill="#4c8dd6">
    <circle cx="427" cy="203" r="4"/><circle cx="432" cy="198" r="4"/><circle cx="437" cy="193" r="4"/><circle cx="442" cy="188" r="4"/><circle cx="447" cy="183" r="4"/>
    <circle cx="563" cy="67" r="4"/><circle cx="568" cy="62" r="4"/><circle cx="573" cy="57" r="4"/><circle cx="578" cy="52" r="4"/><circle cx="583" cy="47" r="4"/>
  </g>

  <text x="505" y="245" text-anchor="middle" font-size="12" font-weight="600" fill="#e2903a">y &#8722; 2x&#8322; = x&#8321;, exactly &#8212; no residual</text>
</svg>

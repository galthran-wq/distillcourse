<svg viewBox="0 0 640 220" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="200" y="24" text-anchor="middle" font-size="12" font-weight="600" fill="currentColor">fuel efficiency, mpg (illustrative)</text>

  <!-- column headers -->
  <text x="170" y="52" text-anchor="middle" font-size="11" fill="currentColor">European</text>
  <text x="290" y="52" text-anchor="middle" font-size="11" fill="currentColor">American</text>
  <!-- row headers -->
  <text x="100" y="94" text-anchor="end" font-size="11" fill="currentColor">car</text>
  <text x="100" y="158" text-anchor="end" font-size="11" fill="currentColor">truck</text>

  <!-- cells -->
  <rect x="112" y="62" width="116" height="52" rx="4" fill="none" stroke="currentColor" opacity="0.7"/>
  <text x="170" y="93" text-anchor="middle" font-size="14" fill="currentColor">30</text>
  <rect x="232" y="62" width="116" height="52" rx="4" fill="none" stroke="currentColor" opacity="0.7"/>
  <text x="290" y="93" text-anchor="middle" font-size="14" fill="currentColor">26</text>
  <rect x="112" y="126" width="116" height="52" rx="4" fill="none" stroke="currentColor" opacity="0.7"/>
  <text x="170" y="157" text-anchor="middle" font-size="14" fill="currentColor">22</text>
  <rect x="232" y="126" width="116" height="52" rx="4" fill="none" stroke="#e2903a" stroke-width="1.8"/>
  <text x="290" y="148" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">main effects say 18</text>
  <text x="290" y="168" text-anchor="middle" font-size="14" font-weight="600" fill="#e2903a">data say 13</text>

  <!-- annotation -->
  <text x="392" y="80" font-size="11" fill="currentColor">additive fit: 30 &#8722; 8 (truck) &#8722; 4 (American)</text>
  <text x="392" y="98" font-size="11" fill="currentColor">= 18 in the last cell, forced by construction</text>
  <text x="392" y="130" font-size="11" fill="#e2903a">the missing &#8722;5 has exactly one home:</text>
  <text x="392" y="148" font-size="11" fill="#e2903a" font-family="ui-monospace, monospace">x_truck &#183; x_american</text>
  <path d="M388 138 L356 148" stroke="#e2903a" fill="none" stroke-width="1.4"/>
  <path d="M356 148 l8 -1 -4 -6 z" fill="#e2903a"/>

  <text x="320" y="206" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.55">three cells fix the main effects; the fourth is then a prediction, not a choice</text>
</svg>

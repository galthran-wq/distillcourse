<svg viewBox="0 0 640 200" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- raw rows -->
  <rect x="10" y="88" width="72" height="44" rx="6" fill="none" stroke="currentColor"/>
  <text x="46" y="107" text-anchor="middle" font-size="12" font-weight="600" fill="currentColor">raw</text>
  <text x="46" y="122" text-anchor="middle" font-size="12" font-weight="600" fill="currentColor">rows</text>

  <!-- split line -->
  <line x1="100" y1="52" x2="100" y2="168" stroke="#4c8dd6" stroke-dasharray="4 3" stroke-width="1.6"/>
  <text x="100" y="44" text-anchor="middle" font-size="11" font-weight="600" fill="#4c8dd6">split first</text>
  <text x="100" y="182" text-anchor="middle" font-size="10" fill="#4c8dd6">train / held-out</text>

  <!-- stage boxes -->
  <rect x="118" y="88" width="84" height="44" rx="6" fill="none" stroke="currentColor"/>
  <text x="160" y="114" text-anchor="middle" font-size="12" font-weight="600" fill="currentColor">encode</text>
  <text x="160" y="150" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.55">category means</text>

  <path d="M202 110 L216 110" stroke="currentColor" fill="none"/>
  <path d="M216 110 l-6 -4 v8 z" fill="currentColor"/>

  <rect x="220" y="88" width="84" height="44" rx="6" fill="none" stroke="currentColor"/>
  <text x="262" y="114" text-anchor="middle" font-size="12" font-weight="600" fill="currentColor">impute</text>
  <text x="262" y="150" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.55">fill values</text>

  <path d="M304 110 L318 110" stroke="currentColor" fill="none"/>
  <path d="M318 110 l-6 -4 v8 z" fill="currentColor"/>

  <rect x="322" y="88" width="84" height="44" rx="6" fill="none" stroke="currentColor"/>
  <text x="364" y="114" text-anchor="middle" font-size="12" font-weight="600" fill="currentColor">scale</text>
  <text x="364" y="150" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.55">&#956;, &#963;</text>

  <path d="M406 110 L420 110" stroke="currentColor" fill="none"/>
  <path d="M420 110 l-6 -4 v8 z" fill="currentColor"/>

  <rect x="424" y="88" width="84" height="44" rx="6" fill="none" stroke="currentColor"/>
  <text x="466" y="114" text-anchor="middle" font-size="12" font-weight="600" fill="currentColor">select</text>
  <text x="466" y="150" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.55">chosen set</text>

  <path d="M508 110 L522 110" stroke="currentColor" fill="none"/>
  <path d="M522 110 l-6 -4 v8 z" fill="currentColor"/>

  <rect x="526" y="88" width="104" height="44" rx="6" fill="none" stroke="currentColor"/>
  <text x="578" y="114" text-anchor="middle" font-size="12" font-weight="600" fill="currentColor">model</text>
  <text x="578" y="150" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.55">weights</text>

  <!-- fit bracket -->
  <path d="M118 76 v-8 h512 v8" stroke="#e2903a" fill="none" stroke-width="1.8"/>
  <text x="374" y="58" text-anchor="middle" font-size="12" font-weight="600" fill="#e2903a">fitted on training rows only &#8212; applied, frozen, to the rest</text>

  <!-- arrow raw -> encode -->
  <path d="M82 110 L114 110" stroke="currentColor" fill="none"/>
  <path d="M114 110 l-6 -4 v8 z" fill="currentColor"/>
</svg>

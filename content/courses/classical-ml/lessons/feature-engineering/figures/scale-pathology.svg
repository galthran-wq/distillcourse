<svg viewBox="0 0 640 262" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- panel titles -->
  <text x="170" y="20" text-anchor="middle" font-size="12" font-weight="600" fill="currentColor">raw features</text>
  <text x="480" y="20" text-anchor="middle" font-size="12" font-weight="600" fill="currentColor">standardized</text>

  <!-- ===== left panel ===== -->
  <line x1="45" y1="40" x2="45" y2="200" stroke="currentColor" opacity="0.55"/>
  <line x1="45" y1="200" x2="295" y2="200" stroke="currentColor" opacity="0.55"/>
  <!-- y ticks -->
  <text x="38" y="44" text-anchor="end" font-size="10" fill="currentColor" opacity="0.55">1</text>
  <text x="38" y="204" text-anchor="end" font-size="10" fill="currentColor" opacity="0.55">0</text>
  <!-- x ticks: -10 -8 -6 -4 -2 -->
  <text x="45" y="216" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.55">-10</text>
  <text x="100" y="216" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.55">-8</text>
  <text x="156" y="216" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.55">-6</text>
  <text x="212" y="216" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.55">-4</text>
  <text x="267" y="216" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.55">-2</text>
  <text x="170" y="232" text-anchor="middle" font-size="11" fill="currentColor">log&#8321;&#8320; &#955;</text>

  <!-- lambda = 1/m marker -->
  <line x1="212" y1="40" x2="212" y2="200" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5"/>
  <text x="216" y="52" font-size="10" fill="currentColor" opacity="0.55">&#955; = 1/m, m = 10&#8308;</text>

  <!-- beta2 / 1e4 (amber) -->
  <polyline points="45,47.6 72.8,93.3 83.9,129.1 100.6,173.3 128.3,196.9 156.1,199.7 183.9,200 211.7,200 239.4,200 267.2,200 295,200"
    fill="none" stroke="#e2903a" stroke-width="2"/>
  <text x="120" y="110" font-size="11" font-weight="600" fill="#e2903a">&#946;&#8322; / 10&#8308;</text>
  <text x="252" y="192" font-size="10" fill="#e2903a">invisible</text>

  <!-- beta1 (blue) -->
  <polyline points="45,193.9 72.8,157.3 83.9,128.8 100.6,93.3 128.3,74.6 156.1,72.3 183.9,72 211.7,72 239.4,72.2 267.2,73 295,81.4"
    fill="none" stroke="#4c8dd6" stroke-width="2"/>
  <text x="176" y="64" font-size="11" font-weight="600" fill="#4c8dd6">&#946;&#8321;</text>

  <text x="170" y="252" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">risk 0.20 at every realistic &#955;</text>

  <!-- ===== right panel ===== -->
  <line x1="355" y1="40" x2="355" y2="200" stroke="currentColor" opacity="0.55"/>
  <line x1="355" y1="200" x2="605" y2="200" stroke="currentColor" opacity="0.55"/>
  <text x="348" y="44" text-anchor="end" font-size="10" fill="currentColor" opacity="0.55">1</text>
  <text x="348" y="204" text-anchor="end" font-size="10" fill="currentColor" opacity="0.55">0</text>
  <text x="355" y="216" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.55">-10</text>
  <text x="410" y="216" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.55">-8</text>
  <text x="466" y="216" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.55">-6</text>
  <text x="522" y="216" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.55">-4</text>
  <text x="577" y="216" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.55">-2</text>
  <text x="480" y="232" text-anchor="middle" font-size="11" fill="currentColor">log&#8321;&#8320; &#955;</text>

  <!-- beta2 tilde (amber) -->
  <polyline points="355,40 521.7,40.1 549.4,40.8 577.2,47.1 605,77.9"
    fill="none" stroke="#e2903a" stroke-width="2"/>
  <text x="430" y="58" font-size="11" font-weight="600" fill="#e2903a">&#946;&#8322; = the whole model</text>

  <!-- beta1 tilde (blue) -->
  <polyline points="355,200 521.7,199.9 549.4,199 577.2,191.6 605,161.4"
    fill="none" stroke="#4c8dd6" stroke-width="2"/>
  <text x="470" y="188" font-size="11" font-weight="600" fill="#4c8dd6">&#946;&#8321;</text>

  <text x="480" y="252" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">risk &#8776; 0 for every &#955; &#8804; 10&#8315;&#179;</text>
</svg>

<svg viewBox="0 0 640 250" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- table -->
  <rect x="20" y="28" width="200" height="160" rx="6" fill="none" stroke="currentColor"/>
  <text x="50" y="46" text-anchor="middle" font-size="12" font-weight="600" fill="currentColor">city</text>
  <text x="110" y="46" text-anchor="middle" font-size="12" font-weight="600" fill="currentColor">y</text>
  <text x="175" y="46" text-anchor="middle" font-size="12" font-weight="600" fill="#e2903a">enc</text>
  <line x1="20" y1="54" x2="220" y2="54" stroke="currentColor" opacity="0.5"/>

  <text x="50" y="76" text-anchor="middle" font-size="12" fill="currentColor">A</text>
  <text x="110" y="76" text-anchor="middle" font-size="12" fill="currentColor">1</text>
  <text x="175" y="76" text-anchor="middle" font-size="12" fill="currentColor">0.5</text>
  <text x="50" y="102" text-anchor="middle" font-size="12" fill="currentColor">A</text>
  <text x="110" y="102" text-anchor="middle" font-size="12" fill="currentColor">0</text>
  <text x="175" y="102" text-anchor="middle" font-size="12" fill="currentColor">0.5</text>
  <text x="50" y="128" text-anchor="middle" font-size="12" fill="currentColor">B</text>
  <text x="110" y="128" text-anchor="middle" font-size="12" fill="currentColor">1</text>
  <text x="175" y="128" text-anchor="middle" font-size="12" fill="currentColor">0.5</text>
  <text x="50" y="154" text-anchor="middle" font-size="12" fill="currentColor">B</text>
  <text x="110" y="154" text-anchor="middle" font-size="12" fill="currentColor">0</text>
  <text x="175" y="154" text-anchor="middle" font-size="12" fill="currentColor">0.5</text>

  <rect x="24" y="162" width="192" height="22" rx="4" fill="none" stroke="#e2903a" stroke-width="1.4"/>
  <text x="50" y="178" text-anchor="middle" font-size="12" font-weight="600" fill="#e2903a">C</text>
  <text x="110" y="178" text-anchor="middle" font-size="12" font-weight="600" fill="#e2903a">1</text>
  <text x="175" y="178" text-anchor="middle" font-size="12" font-weight="600" fill="#e2903a">1.0</text>
  <text x="232" y="178" font-size="11" fill="#e2903a">singleton: enc = its own y</text>

  <!-- arrow: y column feeds enc column, over all rows -->
  <path d="M110 192 C 110 218, 175 218, 175 192" stroke="#e2903a" fill="none" stroke-width="1.6"/>
  <path d="M175 192 l-5 7 h10 z" fill="#e2903a"/>
  <text x="142" y="234" text-anchor="middle" font-size="11" fill="#e2903a">mean of y per category &#8212; computed on all rows</text>

  <!-- experiment header -->
  <text x="500" y="42" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">2,000 rows &#183; coin-flip labels &#183; 1,000 categories</text>

  <!-- folds -->
  <g>
    <rect x="380" y="56" width="40" height="28" rx="4" fill="none" stroke="currentColor"/>
    <text x="400" y="74" text-anchor="middle" font-size="11" fill="currentColor">F1</text>
    <rect x="428" y="56" width="40" height="28" rx="4" fill="none" stroke="currentColor"/>
    <text x="448" y="74" text-anchor="middle" font-size="11" fill="currentColor">F2</text>
    <rect x="476" y="56" width="40" height="28" rx="4" fill="none" stroke="currentColor"/>
    <text x="496" y="74" text-anchor="middle" font-size="11" fill="currentColor">F3</text>
    <rect x="524" y="56" width="40" height="28" rx="4" fill="none" stroke="currentColor"/>
    <text x="544" y="74" text-anchor="middle" font-size="11" fill="currentColor">F4</text>
    <rect x="572" y="56" width="40" height="28" rx="4" fill="none" stroke="#4c8dd6" stroke-width="1.6"/>
    <text x="592" y="74" text-anchor="middle" font-size="11" font-weight="600" fill="#4c8dd6">val</text>
  </g>

  <path d="M496 92 L496 128" stroke="currentColor" fill="none"/>
  <path d="M496 128 l-4 -6 h8 z" fill="currentColor"/>

  <!-- score box -->
  <rect x="396" y="132" width="200" height="52" rx="6" fill="none" stroke="currentColor"/>
  <text x="496" y="155" text-anchor="middle" font-size="13" fill="currentColor" opacity="0.55">5-fold CV: &#8212;</text>
  <text x="496" y="173" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.55">not yet run</text>
</svg>

<svg viewBox="0 0 620 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- left panel: floor attained -->
  <text x="165" y="28" font-size="12.5" text-anchor="middle" fill="#e2903a">floor attained</text>
  <text x="52" y="52" font-size="11" fill="currentColor" opacity="0.55">&#8467;&#8242;(&#952;)</text>
  <!-- zero line of the score -->
  <line x1="55" y1="145" x2="278" y2="145" stroke="currentColor" stroke-width="1" stroke-dasharray="3 3" opacity="0.5"/>
  <text x="278" y="160" font-size="11" text-anchor="end" fill="currentColor">W</text>
  <text x="165" y="160" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.55">&#964;(&#952;)</text>
  <!-- the exact linear relation, and every draw on it -->
  <line x1="58" y1="211.3" x2="262" y2="84.9" stroke="currentColor" stroke-width="1.5" opacity="0.5"/>
  <circle cx="70" cy="203.9" r="4" fill="#e2903a"/>
  <circle cx="88" cy="192.7" r="4" fill="#e2903a"/>
  <circle cx="104" cy="182.8" r="4" fill="#e2903a"/>
  <circle cx="118" cy="174.1" r="4" fill="#e2903a"/>
  <circle cx="135" cy="163.6" r="4" fill="#e2903a"/>
  <circle cx="150" cy="154.3" r="4" fill="#e2903a"/>
  <circle cx="165" cy="145.0" r="4" fill="#e2903a"/>
  <circle cx="180" cy="135.7" r="4" fill="#e2903a"/>
  <circle cx="196" cy="125.8" r="4" fill="#e2903a"/>
  <circle cx="212" cy="115.9" r="4" fill="#e2903a"/>
  <circle cx="228" cy="105.9" r="4" fill="#e2903a"/>
  <circle cx="248" cy="93.5" r="4" fill="#e2903a"/>
  <text x="165" y="268" font-size="11.5" text-anchor="middle" fill="#e2903a">&#8467;&#8242; = a(&#952;)[W &#8722; &#964;(&#952;)] with probability 1</text>
  <text x="165" y="284" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.55">|corr| = 1: Cauchy&#8211;Schwarz is an equality</text>

  <!-- right panel: floor not attained -->
  <text x="465" y="28" font-size="12.5" text-anchor="middle" fill="#4c8dd6">floor not attained</text>
  <text x="352" y="52" font-size="11" fill="currentColor" opacity="0.55">&#8467;&#8242;(&#952;)</text>
  <line x1="355" y1="145" x2="578" y2="145" stroke="currentColor" stroke-width="1" stroke-dasharray="3 3" opacity="0.5"/>
  <text x="578" y="160" font-size="11" text-anchor="end" fill="currentColor">W</text>
  <text x="465" y="160" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.55">&#964;(&#952;)</text>
  <!-- best linear fit only: draws scatter around it -->
  <line x1="358" y1="211.3" x2="562" y2="84.9" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5 4" opacity="0.4"/>
  <circle cx="370" cy="197.2" r="4" fill="#4c8dd6"/>
  <circle cx="388" cy="206.0" r="4" fill="#4c8dd6"/>
  <circle cx="404" cy="176.9" r="4" fill="#4c8dd6"/>
  <circle cx="418" cy="165.9" r="4" fill="#4c8dd6"/>
  <circle cx="435" cy="139.4" r="4" fill="#4c8dd6"/>
  <circle cx="450" cy="148.8" r="4" fill="#4c8dd6"/>
  <circle cx="465" cy="173.9" r="4" fill="#4c8dd6"/>
  <circle cx="480" cy="146.7" r="4" fill="#4c8dd6"/>
  <circle cx="496" cy="152.7" r="4" fill="#4c8dd6"/>
  <circle cx="512" cy="122.3" r="4" fill="#4c8dd6"/>
  <circle cx="528" cy="116.2" r="4" fill="#4c8dd6"/>
  <circle cx="548" cy="98.4" r="4" fill="#4c8dd6"/>
  <text x="465" y="268" font-size="11.5" text-anchor="middle" fill="#4c8dd6">score correlated with W, but not a function of it</text>
  <text x="465" y="284" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.55">|corr| &#60; 1: strict inequality, Var(W) &#62; [&#964;&#8242;]&#178;/(nI)</text>
</svg>

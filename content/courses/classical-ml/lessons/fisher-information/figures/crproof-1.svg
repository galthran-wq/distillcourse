<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- the two random variables -->
  <rect x="40" y="30" width="250" height="70" rx="6" fill="none" stroke="#e2903a" stroke-width="2"/>
  <text x="165" y="55" font-size="13" text-anchor="middle" fill="#e2903a" font-weight="bold">W(X)</text>
  <text x="165" y="72" font-size="11.5" text-anchor="middle" fill="currentColor">any unbiased estimator: E&#952;W = &#952;</text>
  <text x="165" y="88" font-size="11.5" text-anchor="middle" fill="currentColor">spread: Var&#952;(W) = ?</text>
  <rect x="350" y="30" width="250" height="70" rx="6" fill="none" stroke="#4c8dd6" stroke-width="2"/>
  <text x="475" y="55" font-size="13" text-anchor="middle" fill="#4c8dd6" font-weight="bold">S = &#8467;&#8242;(&#952;)</text>
  <text x="475" y="72" font-size="11.5" text-anchor="middle" fill="currentColor">the sample score: mean 0,</text>
  <text x="475" y="88" font-size="11.5" text-anchor="middle" fill="currentColor">Var&#952;(S) = nI(&#952;)</text>
  <line x1="290" y1="65" x2="350" y2="65" stroke="currentColor" stroke-width="1.5"/>
  <text x="320" y="56" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.55">Cov</text>
  <!-- step 1 -->
  <text x="60" y="160" font-size="12" fill="currentColor" font-weight="bold">step 1 &#8212; the covariance is a derivative:</text>
  <text x="90" y="188" font-size="14" fill="currentColor">Cov&#952;(W, S)  =  (d/d&#952;) E&#952;[W]  =  (d/d&#952;) &#952;  =  1</text>
  <text x="90" y="212" font-size="11" fill="currentColor" opacity="0.55">whatever W is, its covariance with the score is fixed by its mean</text>
</svg>

<svg viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- axis -->
  <line x1="40" y1="260" x2="560" y2="260" stroke="currentColor" stroke-width="1"/>
  <text x="558" y="276" font-size="11" text-anchor="end" fill="currentColor">&#952;</text>
  <text x="30" y="50" font-size="11" fill="currentColor" opacity="0.55">&#8467;(&#952;)</text>
  <!-- shared maximizer (drawn in two pieces so the label between them stays clear) -->
  <line x1="300" y1="70" x2="300" y2="182" stroke="currentColor" stroke-width="1" stroke-dasharray="3 3" opacity="0.5"/>
  <line x1="300" y1="218" x2="300" y2="260" stroke="currentColor" stroke-width="1" stroke-dasharray="3 3" opacity="0.5"/>
  <text x="300" y="276" font-size="11" text-anchor="middle" fill="currentColor">&#952;&#770;</text>
  <!-- flat log-likelihood (small information) -->
  <path d="M 60 180 Q 300 -40 540 180" fill="none" stroke="#4c8dd6" stroke-width="2"/>
  <text x="426" y="225" font-size="11.5" fill="#4c8dd6">flat: |&#8467;&#8243;| small, I(&#952;) small</text>
  <text x="426" y="240" font-size="11" fill="#4c8dd6" opacity="0.75">one draw barely narrows &#952;</text>
  <!-- sharp log-likelihood (large information) -->
  <path d="M 180 250 Q 300 -110 420 250" fill="none" stroke="#e2903a" stroke-width="2.5"/>
  <text x="300" y="196" font-size="11.5" text-anchor="middle" fill="#e2903a">sharp: |&#8467;&#8243;| large, I(&#952;) large</text>
  <text x="300" y="211" font-size="11" text-anchor="middle" fill="#e2903a" opacity="0.75">one draw pins &#952; down</text>
  <!-- peak marker -->
  <circle cx="300" cy="70" r="4" fill="currentColor"/>
  <text x="310" y="66" font-size="11" fill="currentColor" opacity="0.55">same maximum, different certainty</text>
</svg>

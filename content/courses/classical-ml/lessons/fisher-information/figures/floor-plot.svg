<svg viewBox="0 0 620 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- axes -->
  <line x1="60" y1="270" x2="580" y2="270" stroke="currentColor" stroke-width="1"/>
  <line x1="60" y1="270" x2="60" y2="40" stroke="currentColor" stroke-width="1"/>
  <text x="578" y="288" font-size="11" text-anchor="end" fill="currentColor">&#955;</text>
  <text x="52" y="40" font-size="11" text-anchor="end" fill="currentColor" transform="rotate(-90 52 40)"></text>
  <text x="66" y="34" font-size="11" fill="currentColor" opacity="0.55">variance of the estimator (Poisson, n = 10)</text>
  <!-- x ticks -->
  <text x="60" y="288" font-size="10.5" text-anchor="middle" fill="currentColor" opacity="0.55">0</text>
  <text x="393" y="288" font-size="10.5" text-anchor="middle" fill="currentColor" opacity="0.55">1</text>
  <!-- S^2 curve: strictly above the floor -->
  <polyline points="60,270 143,257.2 227,235.3 310,204.3 393,164.1 477,114.8 560,56.4"
    fill="none" stroke="#4c8dd6" stroke-width="2"/>
  <text x="415" y="98" font-size="11.5" fill="#4c8dd6">S&#178;: unbiased, above the floor</text>
  <text x="415" y="113" font-size="11" fill="#4c8dd6" opacity="0.75">&#955;/n + 2&#955;&#178;/(n&#8722;1)</text>
  <!-- the floor: 1/(nI) = lambda/n, with Xbar sitting on it -->
  <line x1="60" y1="270" x2="560" y2="220.7" stroke="#e2903a" stroke-width="2.5"/>
  <circle cx="160" cy="260.1" r="4" fill="#e2903a"/>
  <circle cx="260" cy="250.3" r="4" fill="#e2903a"/>
  <circle cx="360" cy="240.4" r="4" fill="#e2903a"/>
  <circle cx="460" cy="230.6" r="4" fill="#e2903a"/>
  <text x="330" y="212" font-size="11.5" fill="#e2903a">the floor 1/(nI(&#955;)) = &#955;/n</text>
  <text x="330" y="227" font-size="11" fill="#e2903a" opacity="0.85">X&#772; sits exactly on it &#8658; best unbiased</text>
  <!-- biased shrinkage estimator: below the floor -->
  <line x1="60" y1="270" x2="560" y2="238.5" stroke="#5aa46a" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="340" y="302" font-size="11.5" fill="#5aa46a">dashed: 0.8&#183;X&#772; &#8212; biased, below the floor:</text>
  <text x="340" y="317" font-size="11" fill="#5aa46a" opacity="0.85">the bound binds only the unbiased</text>
</svg>

<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- left panel: theta fixed, x varies -->
  <text x="170" y="22" font-size="12" text-anchor="middle" fill="currentColor">&#952; fixed at 2, x varies</text>
  <line x1="40" y1="240" x2="300" y2="240" stroke="currentColor" stroke-width="1"/>
  <text x="298" y="256" font-size="11" text-anchor="end" fill="currentColor">x</text>
  <!-- zero line for the score -->
  <line x1="40" y1="150" x2="300" y2="150" stroke="currentColor" stroke-width="1" stroke-dasharray="3 3" opacity="0.5"/>
  <text x="34" y="154" font-size="11" text-anchor="end" fill="currentColor" opacity="0.55">0</text>
  <!-- density p(x|theta), N(2,1) -->
  <polyline points="45,237 73,230.5 100,217 128,197.5 156,178.5 184,170 212,178.5 239,197.5 267,217 281,225 295,230.5"
    fill="none" stroke="#4c8dd6" stroke-width="2"/>
  <text x="94" y="207" font-size="11" fill="#4c8dd6">p(x | &#952;)</text>
  <!-- score line s = x - theta -->
  <line x1="45" y1="220" x2="295" y2="80" stroke="#e2903a" stroke-width="2"/>
  <text x="238" y="92" font-size="11.5" fill="#e2903a">s(x; &#952;) = x &#8722; &#952;</text>
  <!-- zero crossing at x = theta -->
  <circle cx="184" cy="150" r="4" fill="#e2903a"/>
  <line x1="184" y1="150" x2="184" y2="240" stroke="currentColor" stroke-width="1" stroke-dasharray="3 3" opacity="0.5"/>
  <text x="184" y="256" font-size="11" text-anchor="middle" fill="currentColor">x = &#952;</text>
  <text x="45" y="278" font-size="11" fill="currentColor" opacity="0.55">density-weighted average of s: exactly 0</text>
  <!-- right panel: x fixed, theta varies -->
  <text x="480" y="22" font-size="12" text-anchor="middle" fill="currentColor">data x&#8320; fixed at 2.8, &#952; varies</text>
  <line x1="350" y1="240" x2="620" y2="240" stroke="currentColor" stroke-width="1"/>
  <text x="618" y="256" font-size="11" text-anchor="end" fill="currentColor">&#952;</text>
  <line x1="350" y1="150" x2="620" y2="150" stroke="currentColor" stroke-width="1" stroke-dasharray="3 3" opacity="0.5"/>
  <text x="344" y="154" font-size="11" text-anchor="end" fill="currentColor" opacity="0.55">0</text>
  <!-- score in theta: s = x0 - theta -->
  <line x1="355" y1="78" x2="605" y2="218" stroke="#e2903a" stroke-width="2"/>
  <text x="362" y="66" font-size="11.5" fill="#e2903a">s(x&#8320;; &#952;) = x&#8320; &#8722; &#952;</text>
  <!-- zero at theta = x0 (the MLE) -->
  <circle cx="483.5" cy="150" r="4" fill="#e2903a"/>
  <line x1="483.5" y1="150" x2="483.5" y2="240" stroke="currentColor" stroke-width="1" stroke-dasharray="3 3" opacity="0.5"/>
  <text x="483.5" y="256" font-size="11" text-anchor="middle" fill="currentColor">&#952;&#770; = x&#8320;</text>
  <text x="500" y="192" font-size="11" fill="currentColor" opacity="0.55">the MLE: where the</text>
  <text x="500" y="206" font-size="11" fill="currentColor" opacity="0.55">score crosses zero</text>
</svg>

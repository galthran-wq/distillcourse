<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- left panel: the support moves with theta -->
  <text x="160" y="22" font-size="12" text-anchor="middle" fill="currentColor">the density: support [0, &#952;] moves with &#952;</text>
  <line x1="40" y1="250" x2="290" y2="250" stroke="currentColor" stroke-width="1"/>
  <text x="288" y="266" font-size="11" text-anchor="end" fill="currentColor">x</text>
  <!-- theta = 1 box (blue) -->
  <path d="M 40 250 L 40 100 L 173 100 L 173 250" fill="none" stroke="#4c8dd6" stroke-width="2"/>
  <text x="52" y="92" font-size="11.5" fill="#4c8dd6">&#952; = 1: height 1/&#952; = 1</text>
  <text x="173" y="266" font-size="11" text-anchor="middle" fill="#4c8dd6">1</text>
  <!-- theta = 1.5 box (amber) -->
  <path d="M 40 250 L 40 150 L 240 150 L 240 250" fill="none" stroke="#e2903a" stroke-width="2"/>
  <text x="180" y="142" font-size="11.5" fill="#e2903a">&#952; = 1.5</text>
  <text x="240" y="266" font-size="11" text-anchor="middle" fill="#e2903a">1.5</text>
  <!-- arrow showing the edge moving -->
  <line x1="176" y1="200" x2="232" y2="200" stroke="currentColor" stroke-width="1.2"/>
  <path d="M 232 200 l -7 -4 l 0 8 z" fill="currentColor"/>
  <text x="204" y="192" font-size="10.5" text-anchor="middle" fill="currentColor" opacity="0.55">the edge IS &#952;</text>
  <!-- right panel: variance curves -->
  <text x="480" y="22" font-size="12" text-anchor="middle" fill="currentColor">n = 10: the estimator beats the claimed floor 12&#215;</text>
  <line x1="340" y1="250" x2="620" y2="250" stroke="currentColor" stroke-width="1"/>
  <line x1="340" y1="250" x2="340" y2="50" stroke="currentColor" stroke-width="1"/>
  <text x="618" y="266" font-size="11" text-anchor="end" fill="currentColor">&#952;</text>
  <text x="346" y="46" font-size="11" fill="currentColor" opacity="0.55">variance</text>
  <!-- naive bound theta^2/n (dashed) -->
  <polyline points="340,230 410,205.1 480,170 550,124.9 620,70"
    fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5 4" opacity="0.7"/>
  <text x="452" y="120" font-size="11.5" fill="currentColor">the claimed floor &#952;&#178;/n</text>
  <text x="452" y="135" font-size="11" fill="currentColor" opacity="0.55">(void: regularity fails)</text>
  <!-- estimator variance theta^2/(n(n+2)) -->
  <polyline points="340,248.3 410,246.3 480,243.3 550,239.4 620,235"
    fill="none" stroke="#e2903a" stroke-width="2.5"/>
  <text x="400" y="228" font-size="11.5" fill="#e2903a">Var of (n+1)&#183;max(X)/n = &#952;&#178;/(n(n+2))</text>
  <text x="340" y="266" font-size="10.5" text-anchor="middle" fill="currentColor" opacity="0.55">0.5</text>
  <text x="480" y="266" font-size="10.5" text-anchor="middle" fill="currentColor" opacity="0.55">1</text>
</svg>

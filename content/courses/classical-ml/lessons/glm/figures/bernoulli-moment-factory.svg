<svg viewBox="0 0 560 312" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- panel 1: the log-partition A(eta) = log(1 + e^eta) -->
  <text x="40" y="16" font-size="12" fill="currentColor">A(&#951;) = log(1 + e<tspan dy="-4" font-size="9">&#951;</tspan><tspan dy="4">)</tspan></text>
  <text x="520" y="16" font-size="11" fill="currentColor" opacity="0.55" text-anchor="end">the log-partition</text>
  <polyline fill="none" stroke="currentColor" stroke-width="1.8"
    points="40.0,90.0 60.0,90.0 80.0,89.9 100.0,89.9 120.0,89.8 140.0,89.7 160.0,89.5 180.0,89.2 200.0,88.6 220.0,87.9 240.0,86.7 260.0,85.0 280.0,82.6 300.0,79.6 320.0,76.0 340.0,71.9 360.0,67.4 380.0,62.5 400.0,57.5 420.0,52.4 440.0,47.2 460.0,42.0 480.0,36.7 500.0,31.4 520.0,26.1"/>
  <line x1="40" y1="90" x2="520" y2="90" stroke="currentColor" stroke-width="0.75" opacity="0.35"/>

  <!-- differentiate arrow 1 -->
  <text x="280" y="105" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">differentiate once &#8595;</text>

  <!-- panel 2: A'(eta) = sigmoid, the mean -->
  <text x="40" y="118" font-size="12" fill="#e2903a">A&#8242;(&#951;) = &#963;(&#951;) = E[y]</text>
  <text x="520" y="118" font-size="11" fill="currentColor" opacity="0.55" text-anchor="end">the mean &#8212; a sigmoid</text>
  <line x1="40" y1="122" x2="520" y2="122" stroke="currentColor" stroke-width="0.75" stroke-dasharray="3 3" opacity="0.4"/>
  <text x="34" y="126" font-size="10" fill="currentColor" opacity="0.55" text-anchor="end">1</text>
  <polyline fill="none" stroke="#e2903a" stroke-width="1.8"
    points="40.0,179.9 60.0,179.8 80.0,179.6 100.0,179.4 120.0,179.0 140.0,178.3 160.0,177.2 180.0,175.6 200.0,173.1 220.0,169.4 240.0,164.4 260.0,158.1 280.0,151.0 300.0,143.9 320.0,137.6 340.0,132.6 360.0,128.9 380.0,126.4 400.0,124.8 420.0,123.7 440.0,123.0 460.0,122.6 480.0,122.4 500.0,122.2 520.0,122.1"/>
  <line x1="40" y1="180" x2="520" y2="180" stroke="currentColor" stroke-width="0.75" opacity="0.35"/>
  <text x="34" y="184" font-size="10" fill="currentColor" opacity="0.55" text-anchor="end">0</text>

  <!-- differentiate arrow 2 -->
  <text x="280" y="195" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">differentiate again &#8595;</text>

  <!-- panel 3: A''(eta) = sigma(1-sigma), the variance -->
  <text x="40" y="208" font-size="12" fill="#4c8dd6">A&#8243;(&#951;) = &#963;(&#951;)(1&#8722;&#963;(&#951;)) = Var[y] = I(&#951;)</text>
  <text x="520" y="208" font-size="11" fill="currentColor" opacity="0.55" text-anchor="end">the variance &#8212; and the Fisher information</text>
  <line x1="40" y1="214" x2="520" y2="214" stroke="currentColor" stroke-width="0.75" stroke-dasharray="3 3" opacity="0.4"/>
  <text x="34" y="218" font-size="10" fill="currentColor" opacity="0.55" text-anchor="end">&#188;</text>
  <polyline fill="none" stroke="#4c8dd6" stroke-width="1.8"
    points="40.0,267.5 60.0,267.1 80.0,266.6 100.0,265.7 120.0,264.2 140.0,261.9 160.0,258.2 180.0,252.9 200.0,245.3 220.0,235.8 240.0,225.5 260.0,217.2 280.0,214.0 300.0,217.2 320.0,225.5 340.0,235.8 360.0,245.3 380.0,252.9 400.0,258.2 420.0,261.9 440.0,264.2 460.0,265.7 480.0,266.6 500.0,267.1 520.0,267.5"/>
  <line x1="40" y1="268" x2="520" y2="268" stroke="currentColor" stroke-width="0.75" opacity="0.35"/>

  <!-- shared x axis -->
  <line x1="280" y1="20" x2="280" y2="272" stroke="currentColor" stroke-width="0.75" stroke-dasharray="3 3" opacity="0.25"/>
  <text x="40" y="290" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">&#8722;6</text>
  <text x="280" y="290" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">0</text>
  <text x="520" y="290" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">6</text>
  <text x="280" y="306" font-size="11" fill="currentColor" text-anchor="middle">natural parameter &#951;</text>
</svg>

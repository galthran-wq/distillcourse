<svg viewBox="0 0 520 200" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- vertical log-likelihood scale -->
  <line x1="70" y1="20" x2="70" y2="180" stroke="currentColor" stroke-width="1" opacity="0.6"/>
  <text x="30" y="102" font-size="11" fill="currentColor" opacity="0.7" transform="rotate(-90 30 102)" text-anchor="middle">log-likelihood &#8467;</text>

  <!-- saturated model tick -->
  <line x1="62" y1="45" x2="330" y2="45" stroke="#e2903a" stroke-width="2"/>
  <text x="340" y="42" font-size="12.5" fill="#e2903a">saturated model: &#956;&#7522; = y&#7522;</text>
  <text x="340" y="57" font-size="11" fill="currentColor" opacity="0.55">one mean per row &#8212; the ceiling</text>

  <!-- fitted model tick -->
  <line x1="62" y1="140" x2="330" y2="140" stroke="#4c8dd6" stroke-width="2"/>
  <text x="340" y="137" font-size="12.5" fill="#4c8dd6">fitted GLM: &#956;&#7522; = A&#8242;(&#373;<tspan font-size="9" dy="-4">&#8890;</tspan><tspan dy="4">x&#7522;)</tspan></text>
  <text x="340" y="152" font-size="11" fill="currentColor" opacity="0.55">d parameters for n rows</text>

  <!-- the gap -->
  <line x1="200" y1="49" x2="200" y2="136" stroke="currentColor" stroke-width="1.4"/>
  <path d="M196 55 L200 49 L204 55" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <path d="M196 130 L200 136 L204 130" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <text x="210" y="90" font-size="12.5" fill="currentColor">gap &#215; 2 = deviance D(y, &#956;&#770;)</text>
  <text x="210" y="106" font-size="11" fill="currentColor" opacity="0.55">Gaussian, &#963;&#178; = 1: D = &#931;(y&#7522; &#8722; &#956;&#770;&#7522;)&#178; = RSS</text>
</svg>

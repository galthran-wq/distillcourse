<svg viewBox="0 0 560 250" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- left panel: identity link on counts -->
  <text x="155" y="18" font-size="12.5" fill="currentColor" text-anchor="middle">identity link: &#956; = &#951; = w<tspan font-size="9" dy="-5">&#8890;</tspan><tspan dy="5">x</tspan></text>

  <line x1="40" y1="170" x2="270" y2="170" stroke="currentColor" stroke-width="1" opacity="0.6"/>
  <text x="34" y="174" font-size="10" fill="currentColor" opacity="0.55" text-anchor="end">0</text>
  <line x1="40" y1="40" x2="40" y2="210" stroke="currentColor" stroke-width="1" opacity="0.6"/>
  <text x="26" y="120" font-size="11" fill="currentColor" opacity="0.7" transform="rotate(-90 26 120)" text-anchor="middle">expected count &#956;</text>

  <!-- data: mostly zeros, a few positive counts at the left -->
  <circle cx="60" cy="110" r="3.5" fill="currentColor" opacity="0.6"/>
  <circle cx="80" cy="140" r="3.5" fill="currentColor" opacity="0.6"/>
  <circle cx="100" cy="140" r="3.5" fill="currentColor" opacity="0.6"/>
  <circle cx="120" cy="170" r="3.5" fill="currentColor" opacity="0.6"/>
  <circle cx="145" cy="170" r="3.5" fill="currentColor" opacity="0.6"/>
  <circle cx="170" cy="170" r="3.5" fill="currentColor" opacity="0.6"/>
  <circle cx="195" cy="170" r="3.5" fill="currentColor" opacity="0.6"/>
  <circle cx="220" cy="170" r="3.5" fill="currentColor" opacity="0.6"/>
  <circle cx="245" cy="170" r="3.5" fill="currentColor" opacity="0.6"/>

  <!-- fitted straight line, exiting below zero -->
  <line x1="45" y1="92" x2="265" y2="202" stroke="#4c8dd6" stroke-width="2"/>
  <rect x="40" y="171" width="230" height="39" fill="#4c8dd6" opacity="0.10"/>
  <text x="155" y="196" font-size="11" fill="#4c8dd6" text-anchor="middle">&#956; &lt; 0: a count no data can take</text>

  <!-- right panel: log link -->
  <text x="415" y="18" font-size="12.5" fill="currentColor" text-anchor="middle">log link: &#956; = e<tspan font-size="9" dy="-5">w&#8890;x</tspan></text>

  <line x1="300" y1="170" x2="530" y2="170" stroke="currentColor" stroke-width="1" opacity="0.6"/>
  <text x="294" y="174" font-size="10" fill="currentColor" opacity="0.55" text-anchor="end">0</text>
  <line x1="300" y1="40" x2="300" y2="210" stroke="currentColor" stroke-width="1" opacity="0.6"/>

  <!-- same data, shifted -->
  <circle cx="320" cy="110" r="3.5" fill="currentColor" opacity="0.6"/>
  <circle cx="340" cy="140" r="3.5" fill="currentColor" opacity="0.6"/>
  <circle cx="360" cy="140" r="3.5" fill="currentColor" opacity="0.6"/>
  <circle cx="380" cy="170" r="3.5" fill="currentColor" opacity="0.6"/>
  <circle cx="405" cy="170" r="3.5" fill="currentColor" opacity="0.6"/>
  <circle cx="430" cy="170" r="3.5" fill="currentColor" opacity="0.6"/>
  <circle cx="455" cy="170" r="3.5" fill="currentColor" opacity="0.6"/>
  <circle cx="480" cy="170" r="3.5" fill="currentColor" opacity="0.6"/>
  <circle cx="505" cy="170" r="3.5" fill="currentColor" opacity="0.6"/>

  <!-- exponential mean curve, positive everywhere -->
  <path d="M 305 50 C 355 126, 405 154, 460 163 C 490 167, 510 168, 525 168.6" fill="none" stroke="#e2903a" stroke-width="2"/>
  <text x="415" y="196" font-size="11" fill="#e2903a" text-anchor="middle">&#956; &gt; 0 for every w and every x</text>

  <!-- shared x label -->
  <text x="280" y="238" font-size="11" fill="currentColor" text-anchor="middle">feature x (e.g. driver age) &#8594;</text>
</svg>

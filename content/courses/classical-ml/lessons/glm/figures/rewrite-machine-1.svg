<svg viewBox="0 0 560 252" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- constant template row -->
  <text x="280" y="22" font-size="14" fill="currentColor" text-anchor="middle">p(y | &#951;) = <tspan fill="#5aa46a">h(y)</tspan> &#183; exp( <tspan fill="#e2903a">&#951;</tspan> &#183; T(y) &#8722; <tspan fill="#4c8dd6">A(&#951;)</tspan> )</text>
  <line x1="40" y1="34" x2="520" y2="34" stroke="currentColor" stroke-width="0.75" opacity="0.3"/>

  <!-- member -->
  <text x="40" y="58" font-size="13" font-weight="600" fill="currentColor">Bernoulli(&#966;)</text>
  <text x="520" y="58" font-size="11" fill="currentColor" opacity="0.55" text-anchor="end">y &#8712; {0, 1}, success probability &#966;</text>

  <text x="280" y="90" font-size="14" fill="currentColor" text-anchor="middle">p(y | &#966;) = &#966;<tspan font-size="10" dy="-5">y</tspan><tspan dy="5"> (1&#8722;&#966;)</tspan><tspan font-size="10" dy="-5">1&#8722;y</tspan></text>

  <text x="280" y="114" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">exponentiate the log, collect the coefficient of y &#8595;</text>

  <text x="280" y="142" font-size="14" fill="currentColor" text-anchor="middle">= <tspan fill="#5aa46a">1</tspan> &#183; exp( <tspan fill="#e2903a">log&#8201;[&#966;/(1&#8722;&#966;)]</tspan> &#183; y + <tspan fill="#4c8dd6">log(1&#8722;&#966;)</tspan> )</text>

  <!-- ledger -->
  <rect x="40" y="158" width="480" height="82" rx="6" fill="none" stroke="currentColor" stroke-width="0.9" opacity="0.45"/>
  <text x="58" y="180" font-size="12.5" fill="#e2903a">&#951; = log&#8201;[&#966;/(1&#8722;&#966;)] &#8212; the log-odds</text>
  <text x="58" y="203" font-size="12.5" fill="#4c8dd6">A(&#951;) = log(1 + e<tspan font-size="9" dy="-4">&#951;</tspan><tspan dy="4">)</tspan></text>
  <text x="58" y="226" font-size="12.5" fill="#5aa46a">h(y) = 1</text>
  <text x="330" y="180" font-size="12.5" fill="currentColor">T(y) = y</text>
  <text x="330" y="207" font-size="12.5" fill="currentColor">solve for &#966;: &#966; = 1/(1+e<tspan font-size="9" dy="-4">&#8722;&#951;</tspan><tspan dy="4">)</tspan> = &#963;(&#951;)</text>
  <text x="330" y="226" font-size="11" fill="currentColor" opacity="0.55">the sigmoid, produced by algebra</text>
</svg>

<svg viewBox="0 0 620 210" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- panel titles -->
  <text x="126" y="18" font-size="12.5" fill="currentColor" text-anchor="middle">exponential family</text>
  <text x="456" y="18" font-size="12.5" fill="currentColor" text-anchor="middle">Cauchy (heavy tails)</text>

  <!-- separator -->
  <line x1="310" y1="12" x2="310" y2="198" stroke="currentColor" stroke-width="1" stroke-dasharray="3 3" opacity="0.3"/>

  <!-- left: sample row -->
  <g stroke="currentColor" fill="none" stroke-width="1.2" opacity="0.75">
    <rect x="25" y="34" width="34" height="22" rx="4"/>
    <rect x="67" y="34" width="34" height="22" rx="4"/>
    <rect x="109" y="34" width="34" height="22" rx="4"/>
    <rect x="193" y="34" width="34" height="22" rx="4"/>
  </g>
  <text x="42" y="49" font-size="12" fill="currentColor" text-anchor="middle">y&#8321;</text>
  <text x="84" y="49" font-size="12" fill="currentColor" text-anchor="middle">y&#8322;</text>
  <text x="126" y="49" font-size="12" fill="currentColor" text-anchor="middle">y&#8323;</text>
  <text x="168" y="49" font-size="12" fill="currentColor" text-anchor="middle" opacity="0.55">&#8943;</text>
  <text x="210" y="49" font-size="12" fill="currentColor" text-anchor="middle">y&#8345;</text>

  <!-- left: converging arrows -->
  <g stroke="currentColor" stroke-width="1.1" fill="none" opacity="0.55">
    <line x1="42" y1="60" x2="98" y2="114"/>
    <path d="M92.5 112.5 L98 114 L94.5 109.5"/>
    <line x1="84" y1="60" x2="114" y2="114"/>
    <path d="M109.5 111.5 L114 114 L112 109"/>
    <line x1="126" y1="60" x2="126" y2="114"/>
    <path d="M122.5 108.5 L126 114 L129.5 108.5"/>
    <line x1="210" y1="60" x2="154" y2="114"/>
    <path d="M157.5 109.5 L154 114 L159.5 112.5"/>
  </g>

  <!-- left: the sum box -->
  <rect x="76" y="118" width="100" height="30" rx="5" fill="none" stroke="#e2903a" stroke-width="1.8"/>
  <text x="126" y="138" font-size="13" fill="#e2903a" text-anchor="middle">&#931;&#7522; T(y&#7522;)</text>
  <text x="126" y="166" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">one running sum &#8212; fixed size for every n</text>
  <text x="126" y="182" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">the likelihood sees the sample only through it</text>

  <!-- right: sample row -->
  <g stroke="currentColor" fill="none" stroke-width="1.2" opacity="0.75">
    <rect x="355" y="34" width="34" height="22" rx="4"/>
    <rect x="397" y="34" width="34" height="22" rx="4"/>
    <rect x="439" y="34" width="34" height="22" rx="4"/>
    <rect x="523" y="34" width="34" height="22" rx="4"/>
  </g>
  <text x="372" y="49" font-size="12" fill="currentColor" text-anchor="middle">y&#8321;</text>
  <text x="414" y="49" font-size="12" fill="currentColor" text-anchor="middle">y&#8322;</text>
  <text x="456" y="49" font-size="12" fill="currentColor" text-anchor="middle">y&#8323;</text>
  <text x="498" y="49" font-size="12" fill="currentColor" text-anchor="middle" opacity="0.55">&#8943;</text>
  <text x="540" y="49" font-size="12" fill="currentColor" text-anchor="middle">y&#8345;</text>

  <!-- right: straight-down arrows, no collapse -->
  <g stroke="currentColor" stroke-width="1.1" fill="none" opacity="0.55">
    <line x1="372" y1="60" x2="372" y2="114"/>
    <path d="M368.5 108.5 L372 114 L375.5 108.5"/>
    <line x1="414" y1="60" x2="414" y2="114"/>
    <path d="M410.5 108.5 L414 114 L417.5 108.5"/>
    <line x1="456" y1="60" x2="456" y2="114"/>
    <path d="M452.5 108.5 L456 114 L459.5 108.5"/>
    <line x1="540" y1="60" x2="540" y2="114"/>
    <path d="M536.5 108.5 L540 114 L543.5 108.5"/>
  </g>

  <!-- right: the "summary" is the ordered list itself -->
  <g stroke="#4c8dd6" fill="none" stroke-width="1.8">
    <rect x="355" y="118" width="34" height="22" rx="4"/>
    <rect x="397" y="118" width="34" height="22" rx="4"/>
    <rect x="439" y="118" width="34" height="22" rx="4"/>
    <rect x="523" y="118" width="34" height="22" rx="4"/>
  </g>
  <text x="372" y="133" font-size="11.5" fill="#4c8dd6" text-anchor="middle">y<tspan font-size="8.5" dy="3">(1)</tspan></text>
  <text x="414" y="133" font-size="11.5" fill="#4c8dd6" text-anchor="middle">y<tspan font-size="8.5" dy="3">(2)</tspan></text>
  <text x="456" y="133" font-size="11.5" fill="#4c8dd6" text-anchor="middle">y<tspan font-size="8.5" dy="3">(3)</tspan></text>
  <text x="498" y="133" font-size="12" fill="#4c8dd6" text-anchor="middle" opacity="0.7">&#8943;</text>
  <text x="540" y="133" font-size="11.5" fill="#4c8dd6" text-anchor="middle">y<tspan font-size="8.5" dy="3">(n)</tspan></text>
  <text x="456" y="166" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">smallest sufficient statistic: the whole ordered list</text>
  <text x="456" y="182" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">grows with n &#8212; nothing smaller works</text>
</svg>

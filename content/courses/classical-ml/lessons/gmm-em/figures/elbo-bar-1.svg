<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 322" font-family="system-ui, sans-serif">
<text x="14" y="20" font-size="13" font-weight="600" fill="currentColor">1 · any q: ln p(X|θ) = ℒ(q,θ) + KL(q ∥ p)</text>
<rect x="210" y="156.0" width="90" height="136.0" rx="3" fill="#e2903a" opacity="0.85"/>
<rect x="210" y="92.0" width="90" height="64.0" rx="3" fill="#4c8dd6" opacity="0.85"/>
<line x1="150" y1="92.0" x2="360" y2="92.0" stroke="currentColor" stroke-width="1.6"/>
<text x="144" y="96.0" font-size="12" fill="currentColor" text-anchor="end">ln p(X|θ<tspan font-size="9" dy="-4">old</tspan><tspan dy="4"> </tspan>)</text>
<text x="312" y="228.0" font-size="12" fill="#e2903a">ℒ(q, θ)</text>
<text x="312" y="128.0" font-size="12" fill="#4c8dd6">KL(q ∥ p(Z|X,θ))</text>
<line x1="190" y1="292" x2="320" y2="292" stroke="currentColor" opacity="0.4"/>
<text x="380" y="80" font-size="12" fill="currentColor">KL ≥ 0, so ℒ is a</text>
<text x="380" y="98" font-size="12" fill="currentColor">lower bound on ln p(X|θ)</text>
<text x="380" y="116" font-size="12" fill="currentColor">for every choice of q.</text>
</svg>
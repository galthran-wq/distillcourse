<line x1="150" y1="92.0" x2="360" y2="92.0" stroke="currentColor" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.5"/>
<text x="144" y="96.0" font-size="11" fill="currentColor" opacity="0.55" text-anchor="end">ln p(X|θ<tspan font-size="9" dy="-4">old</tspan><tspan dy="4"> </tspan>)</text>
<text x="144" y="52.0" font-size="12" fill="currentColor" text-anchor="end">ln p(X|θ<tspan font-size="9" dy="-4">new</tspan><tspan dy="4"> </tspan>)</text>
<text x="312" y="198.4" font-size="12" fill="#e2903a">ℒ(q, θ)</text>
<text x="312" y="76.4" font-size="12" fill="#4c8dd6">KL(q ∥ p(Z|X,θ))</text>
<line x1="190" y1="292" x2="320" y2="292" stroke="currentColor" opacity="0.4"/>
<text x="380" y="170" font-size="12" fill="currentColor">ℒ rises to its maximum over θ.</text>
<text x="380" y="188" font-size="12" fill="currentColor">The stale q no longer equals the</text>
<text x="380" y="206" font-size="12" fill="currentColor">new posterior, so a fresh KL gap</text>
<text x="380" y="224" font-size="12" fill="currentColor">opens — and ln p rises by ℒ's</text>
<text x="380" y="242" font-size="12" fill="currentColor">gain plus that gap.</text>

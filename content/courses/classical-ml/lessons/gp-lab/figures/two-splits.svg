<svg viewBox="0 0 490 315" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .head { fill: currentColor; font-size: 12.5px; }
    .name { fill: currentColor; }
    .axis { stroke: currentColor; opacity: 0.35; }
    .gp { fill: #4c8dd6; }
    .cf { fill: #e2903a; }
  </style>

  <!-- block 1: the split the conformal theorem is entitled to -->
  <text class="head" x="16" y="48">months held out at random — exchangeable</text>

  <rect class="gp" x="200" y="62" width="230" height="13" rx="3"/>
  <text class="name" x="190" y="72" text-anchor="end">GP band, SE kernel</text>
  <text class="muted" x="190" y="86" text-anchor="end">2.97 ppm wide</text>
  <text class="gp" x="438" y="72" font-size="12">0.96</text>

  <rect class="cf" x="200" y="100" width="216" height="13" rx="3"/>
  <text class="name" x="190" y="110" text-anchor="end">conformal band</text>
  <text class="muted" x="190" y="124" text-anchor="end">2.55 ppm wide</text>
  <text class="cf" x="424" y="110" font-size="12">0.90</text>

  <!-- block 2: the same code, asked to forecast -->
  <text class="head" x="16" y="158">forecast — fit through 1993, test 1998–2003</text>

  <rect class="gp" x="200" y="172" width="240" height="13" rx="3"/>
  <text class="name" x="190" y="182" text-anchor="end">GP band, composite kernel</text>
  <text class="muted" x="190" y="196" text-anchor="end">4.78 ppm wide</text>
  <text class="gp" x="448" y="182" font-size="12">1.00</text>

  <rect class="cf" x="200" y="210" width="69" height="13" rx="3"/>
  <text class="name" x="190" y="220" text-anchor="end">conformal band</text>
  <text class="muted" x="190" y="234" text-anchor="end">1.33 ppm wide</text>
  <text class="cf" x="277" y="220" font-size="12">0.29</text>

  <!-- the promise both bands were making -->
  <line class="axis" x1="416" y1="34" x2="416" y2="248" stroke-dasharray="3 3" opacity="0.5"/>
  <text class="muted" x="416" y="26" text-anchor="middle">nominal 90%</text>

  <!-- coverage axis -->
  <line class="axis" x1="200" y1="258" x2="440" y2="258"/>
  <line class="axis" x1="200" y1="258" x2="200" y2="264"/>
  <line class="axis" x1="320" y1="258" x2="320" y2="264"/>
  <line class="axis" x1="440" y1="258" x2="440" y2="264"/>
  <text class="muted" x="200" y="277" text-anchor="middle">0</text>
  <text class="muted" x="320" y="277" text-anchor="middle">0.5</text>
  <text class="muted" x="440" y="277" text-anchor="middle">1</text>
  <text class="muted" x="320" y="298" text-anchor="middle">share of held-out months the band contains</text>
</svg>

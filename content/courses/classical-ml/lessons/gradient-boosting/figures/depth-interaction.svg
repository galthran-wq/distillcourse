<svg viewBox="0 0 620 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- left: sum of stumps, additive -->
  <text x="160" y="20" font-size="13" fill="currentColor" text-anchor="middle">sum of stumps (J = 2): additive</text>
  <!-- the two stumps -->
  <text x="96" y="48" font-size="11.5" fill="currentColor" opacity="0.7" text-anchor="middle">stump on x&#8321;</text>
  <polyline points="56,76 96,76 96,62 136,62" fill="none" stroke="#4c8dd6" stroke-width="2"/>
  <text x="60" y="72" font-size="10.5" fill="#4c8dd6">a</text>
  <text x="128" y="58" font-size="10.5" fill="#4c8dd6">b</text>
  <text x="160" y="72" font-size="14" fill="currentColor" text-anchor="middle">+</text>
  <text x="226" y="48" font-size="11.5" fill="currentColor" opacity="0.7" text-anchor="middle">stump on x&#8322;</text>
  <polyline points="186,62 226,62 226,76 266,76" fill="none" stroke="#4c8dd6" stroke-width="2"/>
  <text x="190" y="58" font-size="10.5" fill="#4c8dd6">c</text>
  <text x="258" y="72" font-size="10.5" fill="#4c8dd6">d</text>
  <!-- resulting surface: value = row + column -->
  <rect x="90" y="96" width="140" height="140" fill="none" stroke="currentColor" opacity="0.7"/>
  <line x1="160" y1="96" x2="160" y2="236" stroke="currentColor" opacity="0.5"/>
  <line x1="90" y1="166" x2="230" y2="166" stroke="currentColor" opacity="0.5"/>
  <text x="125" y="136" font-size="12" fill="currentColor" text-anchor="middle">a + c</text>
  <text x="195" y="136" font-size="12" fill="currentColor" text-anchor="middle">b + c</text>
  <text x="125" y="206" font-size="12" fill="currentColor" text-anchor="middle">a + d</text>
  <text x="195" y="206" font-size="12" fill="currentColor" text-anchor="middle">b + d</text>
  <text x="160" y="252" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">x&#8321; &#8594;&#160;&#160;(x&#8322; &#8595;)</text>
  <text x="160" y="272" font-size="11.5" fill="currentColor" text-anchor="middle">each cell = row effect + column effect:</text>
  <text x="160" y="287" font-size="11.5" fill="currentColor" text-anchor="middle">no cell can deviate on its own</text>

  <line x1="308" y1="26" x2="308" y2="282" stroke="currentColor" opacity="0.25"/>

  <!-- right: one depth-2 tree, interaction -->
  <text x="464" y="20" font-size="13" fill="currentColor" text-anchor="middle">one deeper tree (J = 3): interaction</text>
  <!-- tree glyph -->
  <text x="464" y="48" font-size="11.5" fill="currentColor" opacity="0.7" text-anchor="middle">split x&#8321;, then x&#8322; inside one branch</text>
  <g stroke="#e2903a" stroke-width="1.6" fill="none">
    <line x1="464" y1="56" x2="438" y2="74"/>
    <line x1="464" y1="56" x2="490" y2="74"/>
    <line x1="490" y1="74" x2="476" y2="90"/>
    <line x1="490" y1="74" x2="504" y2="90"/>
  </g>
  <g fill="#e2903a">
    <circle cx="464" cy="56" r="2.4"/>
    <circle cx="438" cy="74" r="2.4"/>
    <circle cx="490" cy="74" r="2.4"/>
    <circle cx="476" cy="90" r="2.4"/>
    <circle cx="504" cy="90" r="2.4"/>
  </g>
  <!-- resulting surface -->
  <rect x="394" y="96" width="140" height="140" fill="none" stroke="currentColor" opacity="0.7"/>
  <line x1="464" y1="96" x2="464" y2="236" stroke="#e2903a" stroke-width="1.8"/>
  <line x1="464" y1="166" x2="534" y2="166" stroke="#e2903a" stroke-width="1.8"/>
  <text x="429" y="171" font-size="12" fill="currentColor" text-anchor="middle">&#947;&#8321;</text>
  <text x="499" y="136" font-size="12" fill="currentColor" text-anchor="middle">&#947;&#8322;</text>
  <text x="499" y="206" font-size="12" fill="#e2903a" text-anchor="middle">&#947;&#8323;</text>
  <text x="464" y="252" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">x&#8321; &#8594;&#160;&#160;(x&#8322; &#8595;)</text>
  <text x="464" y="272" font-size="11.5" fill="currentColor" text-anchor="middle">x&#8322; matters only when x&#8321; is large:</text>
  <text x="464" y="287" font-size="11.5" fill="currentColor" text-anchor="middle">a joint (x&#8321;, x&#8322;) effect &#8212; interaction order 2</text>
</svg>

<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; font-size: 13px; }
    .head  { fill: currentColor; font-size: 13px; font-weight: 600; }
    .cell  { fill: currentColor; font-size: 13px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .dim   { fill: currentColor; opacity: 0.35; font-size: 13px; }
    .axis  { stroke: currentColor; stroke-opacity: 0.35; stroke-width: 1; fill: none; }
    .tree  { stroke: currentColor; stroke-width: 2; fill: none; }
    .new   { stroke: #e2903a; stroke-width: 2.5; fill: none; }
  </style>
  <text class="muted" x="60" y="36">dissimilarity matrix</text>
  <text class="muted" x="480" y="36">dendrogram</text>

  <text class="head" x="100" y="64" text-anchor="middle">A</text>
  <text class="head" x="148" y="64" text-anchor="middle">B</text>
  <text class="head" x="196" y="64" text-anchor="middle">C</text>
  <text class="head" x="256" y="64" text-anchor="middle">{D,E}</text>
  <text class="head" x="64" y="100" text-anchor="end">A</text>
  <text class="head" x="64" y="132" text-anchor="end">B</text>
  <text class="head" x="64" y="164" text-anchor="end">C</text>
  <text class="head" x="64" y="196" text-anchor="end">{D,E}</text>

  <text class="cell" x="100" y="100" text-anchor="middle">0</text>
  <text class="cell" x="148" y="100" text-anchor="middle" fill="#e2903a" font-weight="600">2</text>
  <text class="cell" x="196" y="100" text-anchor="middle">8</text>
  <text class="cell" x="256" y="100" text-anchor="middle">9</text>

  <text class="dim" x="100" y="132" text-anchor="middle">2</text>
  <text class="cell" x="148" y="132" text-anchor="middle">0</text>
  <text class="cell" x="196" y="132" text-anchor="middle">3</text>
  <text class="cell" x="256" y="132" text-anchor="middle">7</text>

  <text class="dim" x="100" y="164" text-anchor="middle">8</text>
  <text class="dim" x="148" y="164" text-anchor="middle">3</text>
  <text class="cell" x="196" y="164" text-anchor="middle">0</text>
  <text class="cell" x="256" y="164" text-anchor="middle">4</text>

  <text class="dim" x="100" y="196" text-anchor="middle">9</text>
  <text class="dim" x="148" y="196" text-anchor="middle">7</text>
  <text class="dim" x="196" y="196" text-anchor="middle">4</text>
  <text class="cell" x="256" y="196" text-anchor="middle">0</text>

  <rect x="128" y="82" width="40" height="26" rx="4" fill="none" stroke="#e2903a" stroke-width="2"/>

  <text class="muted" x="60" y="242">new row d({D,E}, ·) = min of the two old rows: 9, 7, 4</text>

  <path class="axis" d="M360 260 L360 60"/>
  <line class="axis" x1="356" y1="260" x2="360" y2="260"/><text class="muted" x="351" y="264" text-anchor="end">0</text>
  <line class="axis" x1="356" y1="215" x2="360" y2="215"/><text class="muted" x="351" y="219" text-anchor="end">1</text>
  <line class="axis" x1="356" y1="170" x2="360" y2="170"/><text class="muted" x="351" y="174" text-anchor="end">2</text>
  <line class="axis" x1="356" y1="125" x2="360" y2="125"/><text class="muted" x="351" y="129" text-anchor="end">3</text>
  <line class="axis" x1="356" y1="80" x2="360" y2="80"/><text class="muted" x="351" y="84" text-anchor="end">4</text>

  <circle cx="390" cy="260" r="3.5" fill="currentColor"/>
  <circle cx="440" cy="260" r="3.5" fill="currentColor"/>
  <circle cx="490" cy="260" r="3.5" fill="currentColor"/>
  <circle cx="540" cy="260" r="3.5" fill="currentColor"/>
  <circle cx="590" cy="260" r="3.5" fill="currentColor"/>
  <path class="new" d="M540 260 L540 215 L590 215 L590 260"/>
  <text class="label" x="390" y="280" text-anchor="middle">A</text>
  <text class="label" x="440" y="280" text-anchor="middle">B</text>
  <text class="label" x="490" y="280" text-anchor="middle">C</text>
  <text class="label" x="540" y="280" text-anchor="middle">D</text>
  <text class="label" x="590" y="280" text-anchor="middle">E</text>

  <text class="muted" x="320" y="308" text-anchor="middle">step 2 — D,E fused at height 1; smallest entry is now d(A,B) = 2</text>
</svg>

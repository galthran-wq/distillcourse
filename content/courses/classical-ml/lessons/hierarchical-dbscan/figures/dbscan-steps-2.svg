<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; font-size: 13px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .note  { font-size: 12px; }
  </style>
  <text class="label" x="36" y="22">&#949; = 1, minPts = 3 (counts include the point itself)</text>

  <!-- epsilon circles: around core P1, border P5, noise P11 (constant across frames) -->
  <circle cx="90" cy="270" r="40" fill="none" stroke="#e2903a" stroke-width="1.8"/>
  <circle cx="170" cy="270" r="40" fill="none" stroke="#4c8dd6" stroke-width="1.8"/>
  <circle cx="210" cy="50" r="40" fill="none" stroke="currentColor" stroke-opacity="0.45" stroke-width="1.4" stroke-dasharray="4 3"/>

  <!-- cluster 1: cores amber, borders blue -->
  <circle cx="90" cy="270" r="4.5" fill="#e2903a"/>
  <circle cx="90" cy="230" r="4.5" fill="#e2903a"/>
  <circle cx="130" cy="270" r="4.5" fill="#e2903a"/>
  <circle cx="130" cy="230" r="4.5" fill="#e2903a"/>
  <circle cx="170" cy="270" r="4.5" fill="#4c8dd6"/>
  <!-- cluster 2 -->
  <circle cx="290" cy="150" r="4.5" fill="#e2903a"/>
  <circle cx="330" cy="150" r="4.5" fill="#e2903a"/>
  <circle cx="290" cy="110" r="4.5" fill="#e2903a"/>
  <circle cx="330" cy="110" r="4.5" fill="#e2903a"/>
  <circle cx="250" cy="150" r="4.5" fill="#4c8dd6"/>
  <!-- unresolved strays -->
  <circle cx="210" cy="50" r="4.5" fill="currentColor" fill-opacity="0.45"/>
  <circle cx="410" cy="270" r="4.5" fill="currentColor" fill-opacity="0.45"/>

  <!-- point ids -->
  <text class="muted" x="80" y="284">P1</text>
  <text class="muted" x="80" y="222">P2</text>
  <text class="muted" x="136" y="284">P3</text>
  <text class="muted" x="136" y="222">P4</text>
  <text class="muted" x="176" y="284">P5</text>
  <text class="muted" x="280" y="166">P6</text>
  <text class="muted" x="336" y="166">P7</text>
  <text class="muted" x="280" y="102">P8</text>
  <text class="muted" x="336" y="102">P9</text>
  <text class="muted" x="240" y="166">P10</text>
  <text class="muted" x="222" y="44">P11</text>
  <text class="muted" x="420" y="264">P12</text>

  <!-- callout -->
  <text class="note" x="36" y="212" fill="#e2903a">|N(P1)| = 3 &#8805; 3: core</text>
  <text class="note" x="176" y="322" fill="#4c8dd6">|N(P5)| = 2, but P3 is core: border</text>

  <!-- legend -->
  <circle cx="452" cy="80" r="4.5" fill="#e2903a"/>
  <text class="note" x="464" y="84" fill="currentColor">core: &#8805; minPts in its &#949;-ball</text>
  <circle cx="452" cy="106" r="4.5" fill="#4c8dd6"/>
  <text class="note" x="464" y="110" fill="currentColor">border: too few, but within &#949;</text>
  <text class="note" x="464" y="126" fill="currentColor" opacity="0.55">of some core point</text>
  <circle cx="452" cy="150" r="4.5" fill="currentColor" fill-opacity="0.45"/>
  <text class="note" x="464" y="154" fill="currentColor">not yet resolved</text>

  <text class="muted" x="452" y="192">border points: P5 (via P3),</text>
  <text class="muted" x="452" y="208">P10 (via P6)</text>

  <text class="muted" x="320" y="326" text-anchor="middle">step 2 &#8212; non-core points inside a core point&#8217;s &#949;-ball attach as border</text>
</svg>

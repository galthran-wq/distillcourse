<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .head  { fill: currentColor; font-size: 13px; font-weight: 600; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .note  { font-size: 11.5px; }
    .edge  { stroke: currentColor; stroke-opacity: 0.45; stroke-width: 1.6; fill: none; }
  </style>

  <!-- triangle -->
  <path class="edge" d="M320 60 L150 250"/>
  <path class="edge" d="M320 60 L490 250"/>
  <path class="edge" d="M150 250 L490 250"/>
  <circle cx="320" cy="60" r="5" fill="#e2903a"/>
  <circle cx="150" cy="250" r="5" fill="#e2903a"/>
  <circle cx="490" cy="250" r="5" fill="#e2903a"/>

  <!-- vertices: the three axioms -->
  <text class="head" x="320" y="42" text-anchor="middle">scale invariance</text>
  <text class="head" x="140" y="274" text-anchor="middle">richness</text>
  <text class="head" x="500" y="274" text-anchor="middle">consistency</text>

  <!-- edges: algorithms achieving exactly that pair -->
  <text class="note" x="196" y="136" fill="#4c8dd6" text-anchor="end">single linkage,</text>
  <text class="note" x="196" y="150" fill="#4c8dd6" text-anchor="end">stop at &#945; &#183; max distance</text>
  <text class="muted" x="196" y="164" text-anchor="end">(gives up consistency)</text>

  <text class="note" x="444" y="136" fill="#4c8dd6">single linkage,</text>
  <text class="note" x="444" y="150" fill="#4c8dd6">stop at k clusters;</text>
  <text class="note" x="444" y="164" fill="#4c8dd6">k-means at fixed k</text>
  <text class="muted" x="444" y="178">(gives up richness)</text>

  <text class="note" x="320" y="294" fill="#4c8dd6" text-anchor="middle">single linkage, stop at distance r</text>
  <text class="note" x="320" y="308" fill="currentColor" opacity="0.55" text-anchor="middle">(gives up scale invariance)</text>

  <!-- center -->
  <text x="320" y="176" text-anchor="middle" fill="currentColor" font-size="15" font-weight="700">&#10007;</text>
  <text class="note" x="320" y="196" fill="currentColor" text-anchor="middle">all three at once:</text>
  <text class="note" x="320" y="211" fill="currentColor" text-anchor="middle">no clustering function exists</text>
</svg>

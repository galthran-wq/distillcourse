<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="14">
  <style>
    .head  { fill: currentColor; font-size: 13px; font-weight: 600; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .oval  { stroke: currentColor; stroke-opacity: 0.45; stroke-width: 1.4; fill: none; }
    .A { fill: #e2903a; font-weight: 600; }
    .B { fill: #4c8dd6; font-weight: 600; }
    .C { fill: #5aa46a; font-weight: 600; }
  </style>

  <text class="head" x="120" y="30" text-anchor="middle">cluster 1</text>
  <ellipse class="oval" cx="120" cy="120" rx="82" ry="62"/>
  <text class="A" x="80" y="104" text-anchor="middle">A</text>
  <text class="A" x="120" y="104" text-anchor="middle">A</text>
  <text class="A" x="160" y="104" text-anchor="middle">A</text>
  <text class="A" x="90" y="146" text-anchor="middle">A</text>
  <text class="A" x="126" y="146" text-anchor="middle">A</text>
  <text class="B" x="158" y="146" text-anchor="middle">B</text>
  <text class="muted" x="120" y="212" text-anchor="middle">majority A: 5 of 6</text>

  <text class="head" x="320" y="30" text-anchor="middle">cluster 2</text>
  <ellipse class="oval" cx="320" cy="120" rx="82" ry="62"/>
  <text class="A" x="280" y="104" text-anchor="middle">A</text>
  <text class="B" x="320" y="104" text-anchor="middle">B</text>
  <text class="B" x="360" y="104" text-anchor="middle">B</text>
  <text class="B" x="290" y="146" text-anchor="middle">B</text>
  <text class="B" x="326" y="146" text-anchor="middle">B</text>
  <text class="C" x="358" y="146" text-anchor="middle">C</text>
  <text class="muted" x="320" y="212" text-anchor="middle">majority B: 4 of 6</text>

  <text class="head" x="512" y="30" text-anchor="middle">cluster 3</text>
  <ellipse class="oval" cx="512" cy="120" rx="76" ry="62"/>
  <text class="C" x="478" y="104" text-anchor="middle">C</text>
  <text class="C" x="512" y="104" text-anchor="middle">C</text>
  <text class="C" x="546" y="104" text-anchor="middle">C</text>
  <text class="A" x="494" y="146" text-anchor="middle">A</text>
  <text class="A" x="530" y="146" text-anchor="middle">A</text>
  <text class="muted" x="512" y="212" text-anchor="middle">majority C: 3 of 5</text>

  <text class="muted" x="320" y="244" text-anchor="middle">17 labeled objects (classes A, B, C by color) in three clusters &#8212; purity = (5 + 4 + 3) / 17 = 0.71</text>
</svg>

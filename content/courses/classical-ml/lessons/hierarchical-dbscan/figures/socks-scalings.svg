<svg viewBox="0 0 640 290" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .head  { fill: currentColor; font-size: 13px; font-weight: 600; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .note  { font-size: 11px; }
    .axis  { stroke: currentColor; stroke-opacity: 0.35; stroke-width: 1; fill: none; }
    .hullA { stroke: #e2903a; stroke-width: 1.6; stroke-dasharray: 5 4; fill: none; }
    .hullB { stroke: #4c8dd6; stroke-width: 1.6; stroke-dasharray: 5 4; fill: none; }
    .pt    { fill: currentColor; }
  </style>

  <!-- panel 1: raw counts -->
  <text class="head" x="105" y="24" text-anchor="middle">raw counts</text>
  <path class="axis" d="M20 216 L196 216"/>
  <path class="axis" d="M20 216 L20 180"/>
  <text class="muted" x="196" y="232" text-anchor="end">socks: 5&#8211;13</text>
  <text class="muted" x="20" y="172">computers: 0&#8211;1</text>
  <circle class="pt" cx="80" cy="210" r="3.5"/>
  <circle class="pt" cx="92" cy="198" r="3.5"/>
  <circle class="pt" cx="104" cy="210" r="3.5"/>
  <circle class="pt" cx="80" cy="198" r="3.5"/>
  <circle class="pt" cx="152" cy="210" r="3.5"/>
  <circle class="pt" cx="164" cy="198" r="3.5"/>
  <circle class="pt" cx="176" cy="210" r="3.5"/>
  <circle class="pt" cx="152" cy="198" r="3.5"/>
  <ellipse class="hullA" cx="92" cy="204" rx="26" ry="17"/>
  <ellipse class="hullB" cx="164" cy="204" rx="26" ry="17"/>
  <text class="note" x="105" y="254" fill="currentColor" opacity="0.75" text-anchor="middle">socks own the distance:</text>
  <text class="note" x="105" y="268" fill="currentColor" opacity="0.75" text-anchor="middle">split by sock volume</text>

  <!-- panel 2: standardized -->
  <text class="head" x="315" y="24" text-anchor="middle">standardized (&#247; sd)</text>
  <path class="axis" d="M228 216 L400 216"/>
  <path class="axis" d="M228 216 L228 56"/>
  <text class="muted" x="400" y="232" text-anchor="end">socks span 2.5 sd</text>
  <text class="muted" x="232" y="42">computers span 1.9 sd</text>
  <circle class="pt" cx="244" cy="205" r="3.5"/>
  <circle class="pt" cx="262" cy="64" r="3.5"/>
  <circle class="pt" cx="279" cy="205" r="3.5"/>
  <circle class="pt" cx="244" cy="64" r="3.5"/>
  <circle class="pt" cx="349" cy="205" r="3.5"/>
  <circle class="pt" cx="367" cy="64" r="3.5"/>
  <circle class="pt" cx="384" cy="205" r="3.5"/>
  <circle class="pt" cx="349" cy="64" r="3.5"/>
  <ellipse class="hullA" cx="308" cy="64" rx="82" ry="14"/>
  <ellipse class="hullB" cx="316" cy="205" rx="86" ry="14"/>
  <text class="note" x="315" y="254" fill="currentColor" opacity="0.75" text-anchor="middle">an equal vote per feature:</text>
  <text class="note" x="315" y="268" fill="currentColor" opacity="0.75" text-anchor="middle">split by computer ownership</text>

  <!-- panel 3: dollars -->
  <text class="head" x="525" y="24" text-anchor="middle">dollars spent</text>
  <path class="axis" d="M436 216 L604 216"/>
  <path class="axis" d="M436 216 L436 56"/>
  <text class="muted" x="604" y="232" text-anchor="end">socks: $10&#8211;26</text>
  <text class="muted" x="440" y="50">computers: $0 or $1000</text>
  <circle class="pt" cx="480" cy="210" r="3.5"/>
  <circle class="pt" cx="485" cy="70" r="3.5"/>
  <circle class="pt" cx="490" cy="210" r="3.5"/>
  <circle class="pt" cx="480" cy="70" r="3.5"/>
  <circle class="pt" cx="510" cy="210" r="3.5"/>
  <circle class="pt" cx="515" cy="70" r="3.5"/>
  <circle class="pt" cx="520" cy="210" r="3.5"/>
  <circle class="pt" cx="510" cy="70" r="3.5"/>
  <ellipse class="hullA" cx="498" cy="70" rx="32" ry="13"/>
  <ellipse class="hullB" cx="500" cy="210" rx="34" ry="13"/>
  <text class="note" x="525" y="254" fill="currentColor" opacity="0.75" text-anchor="middle">computers own the distance:</text>
  <text class="note" x="525" y="268" fill="currentColor" opacity="0.75" text-anchor="middle">socks are a rounding error</text>

  <text class="muted" x="320" y="286" text-anchor="middle">the same eight shoppers under three unit choices &#8212; the dissimilarities, and the clustering, follow the units</text>
</svg>

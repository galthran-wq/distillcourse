<svg viewBox="0 0 560 190" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- the feature being built for one row -->
  <rect x="170" y="26" width="220" height="32" rx="5" fill="none" stroke="currentColor"/>
  <text x="280" y="46" text-anchor="middle" font-size="12" fill="currentColor">feature: customer's mean amount</text>

  <!-- timeline -->
  <line x1="30" y1="140" x2="518" y2="140" stroke="currentColor"/>
  <path d="M530 140 l-9 -4.5 v9 z" fill="currentColor"/>
  <text x="524" y="128" text-anchor="end" font-size="10.5" fill="currentColor" opacity="0.55">time</text>

  <!-- the row's prediction time -->
  <line x1="330" y1="66" x2="330" y2="152" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5"/>
  <text x="336" y="80" font-size="11" fill="currentColor" opacity="0.55">prediction time t</text>

  <!-- transactions before t feed the feature legitimately -->
  <g stroke="currentColor" opacity="0.35">
    <line x1="70" y1="136" x2="210" y2="60"/>
    <line x1="115" y1="136" x2="235" y2="60"/>
    <line x1="160" y1="136" x2="260" y2="60"/>
    <line x1="215" y1="136" x2="285" y2="60"/>
    <line x1="275" y1="136" x2="310" y2="60"/>
  </g>
  <circle cx="70" cy="140" r="4" fill="currentColor"/>
  <circle cx="115" cy="140" r="4" fill="currentColor"/>
  <circle cx="160" cy="140" r="4" fill="currentColor"/>
  <circle cx="215" cy="140" r="4" fill="currentColor"/>
  <circle cx="275" cy="140" r="4" fill="currentColor"/>

  <!-- transactions after t cross the line into the feature: the leak -->
  <g stroke="#e2903a" stroke-width="1.4" stroke-dasharray="3 3">
    <line x1="385" y1="136" x2="335" y2="60"/>
    <line x1="445" y1="136" x2="350" y2="60"/>
    <line x1="495" y1="136" x2="365" y2="60"/>
  </g>
  <circle cx="385" cy="140" r="4" fill="#e2903a"/>
  <circle cx="445" cy="140" r="4" fill="#e2903a"/>
  <circle cx="495" cy="140" r="4" fill="#e2903a"/>
  <text x="438" y="176" text-anchor="middle" font-size="11" fill="#e2903a">later than t: the row's own future</text>

  <!-- the as-of window -->
  <g stroke="#5aa46a" stroke-width="1.5">
    <line x1="58" y1="158" x2="322" y2="158"/>
    <line x1="58" y1="154" x2="58" y2="162"/>
    <line x1="322" y1="154" x2="322" y2="162"/>
  </g>
  <text x="190" y="176" text-anchor="middle" font-size="11" fill="#5aa46a">as-of window: strictly before t</text>
</svg>

<svg viewBox="0 0 640 190" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- axis: test error 0..50%, x = 50 + err*10.8 -->
  <line x1="50" y1="120" x2="600" y2="120" stroke="currentColor" opacity="0.4"/>
  <g font-size="11" fill="currentColor" opacity="0.55">
    <text x="50" y="140" text-anchor="middle">0</text>
    <text x="158" y="140" text-anchor="middle">10</text>
    <text x="266" y="140" text-anchor="middle">20</text>
    <text x="374" y="140" text-anchor="middle">30</text>
    <text x="482" y="140" text-anchor="middle">40</text>
    <text x="590" y="140" text-anchor="middle">50</text>
    <text x="325" y="162" text-anchor="middle">test error, % (KDDCUP99, same method family, same data)</text>
  </g>
  <line x1="50" y1="116" x2="50" y2="124" stroke="currentColor" opacity="0.4"/>
  <line x1="158" y1="116" x2="158" y2="124" stroke="currentColor" opacity="0.4"/>
  <line x1="266" y1="116" x2="266" y2="124" stroke="currentColor" opacity="0.4"/>
  <line x1="374" y1="116" x2="374" y2="124" stroke="currentColor" opacity="0.4"/>
  <line x1="482" y1="116" x2="482" y2="124" stroke="currentColor" opacity="0.4"/>
  <line x1="590" y1="116" x2="590" y2="124" stroke="currentColor" opacity="0.4"/>

  <!-- baseline: 50 random rows, 8% -->
  <circle cx="136.4" cy="120" r="5" fill="#4c8dd6"/>
  <line x1="136.4" y1="115" x2="136.4" y2="96" stroke="#4c8dd6" opacity="0.6"/>
  <text x="136.4" y="74" text-anchor="middle" font-size="11" fill="#4c8dd6">8% — least squares</text>
  <text x="136.4" y="88" text-anchor="middle" font-size="11" fill="#4c8dd6">on 50 random rows</text>

  <!-- CVM family: 6.2, 18, 49 -->
  <circle cx="117" cy="120" r="5" fill="#e2903a"/>
  <line x1="117" y1="125" x2="110" y2="176" stroke="#e2903a" opacity="0.6"/>
  <text x="104" y="186" text-anchor="middle" font-size="11" fill="#e2903a">6.2% — as published</text>

  <circle cx="244.4" cy="120" r="5" fill="#e2903a"/>
  <line x1="244.4" y1="115" x2="244.4" y2="56" stroke="#e2903a" opacity="0.6"/>
  <text x="244.4" y="48" text-anchor="middle" font-size="11" fill="#e2903a">18% — training rows shuffled</text>

  <circle cx="579.2" cy="120" r="5" fill="#e2903a"/>
  <line x1="579.2" y1="115" x2="579.2" y2="96" stroke="#e2903a" opacity="0.6"/>
  <text x="574" y="74" text-anchor="end" font-size="11" fill="#e2903a">49% — regularization</text>
  <text x="574" y="88" text-anchor="end" font-size="11" fill="#e2903a">nudged by 15%</text>

  <!-- connecting hint -->
  <text x="325" y="24" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.55">one published number, three perturbations</text>
</svg>

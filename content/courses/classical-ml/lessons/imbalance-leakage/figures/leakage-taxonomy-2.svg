<svg viewBox="0 0 640 240" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- pipeline: rows -> features -> split(train/test) -> fit -> score -->
  <rect x="12" y="88" width="96" height="52" rx="6" fill="none" stroke="currentColor"/>
  <text x="60" y="118" text-anchor="middle" font-size="12" fill="currentColor">raw rows</text>
  <rect x="26" y="152" width="68" height="24" rx="4" fill="none" stroke="currentColor" opacity="0.55"/>
  <text x="60" y="168" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">labels y</text>
  <path d="M108 114 L128 114" stroke="currentColor" fill="none"/>
  <path d="M128 114 l-6 -4 v8 z" fill="currentColor"/>
  <rect x="134" y="88" width="108" height="52" rx="6" fill="none" stroke="currentColor"/>
  <text x="188" y="118" text-anchor="middle" font-size="12" fill="currentColor">build features</text>
  <path d="M242 114 L264 114" stroke="currentColor" fill="none"/>
  <path d="M264 114 l-6 -4 v8 z" fill="currentColor"/>
  <text x="328" y="50" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">the split</text>
  <rect x="272" y="58" width="112" height="46" rx="6" fill="none" stroke="#4c8dd6" stroke-width="1.5"/>
  <text x="328" y="86" text-anchor="middle" font-size="12" fill="#4c8dd6">train</text>
  <rect x="272" y="118" width="112" height="46" rx="6" fill="none" stroke="currentColor"/>
  <text x="328" y="146" text-anchor="middle" font-size="12" fill="currentColor">test</text>
  <path d="M384 81 L406 81" stroke="currentColor" fill="none"/>
  <path d="M406 81 l-6 -4 v8 z" fill="currentColor"/>
  <rect x="412" y="58" width="96" height="46" rx="6" fill="none" stroke="currentColor"/>
  <text x="460" y="86" text-anchor="middle" font-size="12" fill="currentColor">fit model</text>
  <path d="M508 81 C 520 81, 526 92, 530 100" stroke="currentColor" fill="none"/>
  <path d="M530 100 l-2 -7 l-6 4 z" fill="currentColor"/>
  <path d="M384 141 C 450 141, 500 134, 528 126" stroke="currentColor" fill="none"/>
  <path d="M528 126 l-7 -1 l2 7 z" fill="currentColor"/>
  <rect x="532" y="88" width="96" height="52" rx="6" fill="none" stroke="currentColor"/>
  <text x="580" y="118" text-anchor="middle" font-size="12" fill="currentColor">score</text>
  <text x="14" y="26" font-size="13" font-weight="600" fill="#e2903a">2 · temporal leakage</text>
  <path d="M340 118 L340 108" stroke="#e2903a" stroke-width="2" stroke-dasharray="4 3" fill="none"/>
  <path d="M340 104 l-5 7 h10 z" fill="#e2903a"/>
  <text x="392" y="116" font-size="11" fill="#e2903a">future rows train the past</text>
  <text x="392" y="130" font-size="11" fill="#e2903a">(shuffled split on a time series)</text>
</svg>

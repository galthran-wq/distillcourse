<svg viewBox="0 0 640 200" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- box 1: metric -->
  <rect x="14" y="52" width="132" height="66" rx="6" fill="none" stroke="currentColor"/>
  <text x="80" y="76" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor">1 · fix the metric</text>
  <text x="80" y="94" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">PR curve, expected cost</text>
  <text x="80" y="134" text-anchor="middle" font-size="11" fill="#5aa46a">free — changes the report</text>

  <path d="M150 85 L166 85" stroke="currentColor" fill="none"/>
  <path d="M166 85 l-6 -4 v8 z" fill="currentColor"/>

  <!-- box 2: weights -->
  <rect x="172" y="52" width="132" height="66" rx="6" fill="none" stroke="currentColor"/>
  <text x="238" y="76" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor">2 · weight the loss</text>
  <text x="238" y="94" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">w+, w− in the likelihood</text>

  <path d="M308 85 L324 85" stroke="currentColor" fill="none"/>
  <path d="M324 85 l-6 -4 v8 z" fill="currentColor"/>

  <!-- box 3: resampling, with tax stamp -->
  <rect x="330" y="52" width="132" height="66" rx="6" fill="none" stroke="currentColor"/>
  <text x="396" y="76" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor">3 · resample</text>
  <text x="396" y="94" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">down / up / SMOTE</text>
  <g transform="rotate(-3 317 132)">
    <rect x="180" y="122" width="274" height="21" rx="4" fill="none" stroke="#e2903a" stroke-width="1.6"/>
    <text x="317" y="137" text-anchor="middle" font-size="11" font-weight="600" fill="#e2903a">tax on 2 and 3: b ← b − δ</text>
  </g>

  <path d="M466 85 L482 85" stroke="currentColor" fill="none"/>
  <path d="M482 85 l-6 -4 v8 z" fill="currentColor"/>

  <!-- box 4: threshold -->
  <rect x="488" y="52" width="138" height="66" rx="6" fill="none" stroke="currentColor"/>
  <text x="557" y="76" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor">4 · move the threshold</text>
  <text x="557" y="94" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">flag when p &gt; a/(a+c)</text>
  <text x="557" y="134" text-anchor="middle" font-size="11" fill="#5aa46a">free — changes the decision</text>

  <!-- reduction arc: moves 2 and 3 land on move 4 -->
  <path d="M238 152 C 300 186, 490 186, 553 152" stroke="#4c8dd6" fill="none" stroke-dasharray="3 3"/>
  <path d="M553 152 l-7 1 l4 6 z" fill="#4c8dd6"/>
  <text x="396" y="192" text-anchor="middle" font-size="11" fill="#4c8dd6">for the decision, moves 2 and 3 reduce to move 4</text>
  <text x="320" y="24" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.55">evaluation → objective → data → decision</text>
</svg>

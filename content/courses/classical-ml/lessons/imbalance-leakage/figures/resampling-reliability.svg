<svg viewBox="0 0 640 250" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- panel 1: trained at true prevalence -->
  <g>
    <text x="110" y="26" text-anchor="middle" font-size="12" font-weight="600" fill="currentColor">trained at π = 1/11</text>
    <rect x="30" y="40" width="160" height="160" fill="none" stroke="currentColor" opacity="0.4"/>
    <path d="M30 200 L190 40" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5" fill="none"/>
    <circle cx="46" cy="184" r="4" fill="#4c8dd6"/>
    <circle cx="78" cy="152" r="4" fill="#4c8dd6"/>
    <circle cx="110" cy="120" r="4" fill="#4c8dd6"/>
    <circle cx="142" cy="88" r="4" fill="#4c8dd6"/>
    <circle cx="174" cy="56" r="4" fill="#4c8dd6"/>
    <text x="110" y="222" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">stated probability</text>
    <text x="22" y="124" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55" transform="rotate(-90 22 124)">observed rate</text>
  </g>
  <!-- panel 2: after 10x upsampling -->
  <g>
    <text x="320" y="26" text-anchor="middle" font-size="12" font-weight="600" fill="#e2903a">after 10× upsampling</text>
    <rect x="240" y="40" width="160" height="160" fill="none" stroke="currentColor" opacity="0.4"/>
    <path d="M240 200 L400 40" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5" fill="none"/>
    <path d="M240 200 L248 199.2 L272 196.1 L288 193.4 L304 190 L320 185.4 L336 179.2 L352 169.8 L368 154.2 L384 124.2 L392 95.2 L396.8 66.9 L400 40"
      stroke="#e2903a" fill="none" stroke-width="1.5"/>
    <circle cx="256" cy="198.2" r="4" fill="#e2903a"/>
    <circle cx="288" cy="193.4" r="4" fill="#e2903a"/>
    <circle cx="320" cy="185.4" r="4" fill="#e2903a"/>
    <circle cx="352" cy="169.8" r="4" fill="#e2903a"/>
    <circle cx="384" cy="124.2" r="4" fill="#e2903a"/>
    <text x="382" y="112" text-anchor="end" font-size="11" fill="#e2903a">stated 0.9,</text>
    <text x="382" y="125" text-anchor="end" font-size="11" fill="#e2903a">observed 0.47</text>
    <text x="320" y="222" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">stated probability</text>
  </g>
  <!-- panel 3: intercept corrected -->
  <g>
    <text x="530" y="26" text-anchor="middle" font-size="12" font-weight="600" fill="currentColor">after b − ln 10</text>
    <rect x="450" y="40" width="160" height="160" fill="none" stroke="currentColor" opacity="0.4"/>
    <path d="M450 200 L610 40" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5" fill="none"/>
    <circle cx="451.8" cy="198.2" r="4" fill="#5aa46a"/>
    <circle cx="456.6" cy="193.4" r="4" fill="#5aa46a"/>
    <circle cx="464.6" cy="185.4" r="4" fill="#5aa46a"/>
    <circle cx="480.2" cy="169.8" r="4" fill="#5aa46a"/>
    <circle cx="525.8" cy="124.2" r="4" fill="#5aa46a"/>
    <text x="530" y="222" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">stated probability</text>
  </g>
</svg>

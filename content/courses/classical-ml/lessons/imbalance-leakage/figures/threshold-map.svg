<svg viewBox="0 0 640 240" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="60" y="20" font-size="12" fill="currentColor">stated by the balanced-trained model, p̃</text>
  <text x="330" y="42" text-anchor="middle" font-size="11.5" font-weight="600" fill="#e2903a">threshold ½</text>

  <!-- top axis -->
  <line x1="60" y1="72" x2="600" y2="72" stroke="currentColor"/>
  <line x1="60" y1="68" x2="60" y2="76" stroke="currentColor"/>
  <line x1="195" y1="68" x2="195" y2="76" stroke="currentColor"/>
  <line x1="330" y1="68" x2="330" y2="76" stroke="currentColor"/>
  <line x1="465" y1="68" x2="465" y2="76" stroke="currentColor"/>
  <line x1="600" y1="68" x2="600" y2="76" stroke="currentColor"/>
  <text x="60" y="58" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.55">0</text>
  <text x="195" y="58" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.55">0.25</text>
  <text x="330" y="58" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.55">0.5</text>
  <text x="465" y="58" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.55">0.75</text>
  <text x="600" y="58" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.55">1</text>

  <!-- chords: the same log-odds shift applied to every stated score -->
  <g stroke="#4c8dd6" stroke-width="1.3" opacity="0.75">
    <line x1="114" y1="72" x2="61.9" y2="172"/>
    <line x1="222" y1="72" x2="67.1" y2="172"/>
    <line x1="438" y1="72" x2="96.3" y2="172"/>
    <line x1="546" y1="72" x2="177.6" y2="172"/>
    <line x1="583.8" y1="72" x2="330" y2="172"/>
    <line x1="594.6" y1="72" x2="467.1" y2="172"/>
  </g>
  <g fill="#4c8dd6" opacity="0.75">
    <circle cx="114" cy="72" r="2.8"/><circle cx="61.9" cy="172" r="2.8"/>
    <circle cx="222" cy="72" r="2.8"/><circle cx="67.1" cy="172" r="2.8"/>
    <circle cx="438" cy="72" r="2.8"/><circle cx="96.3" cy="172" r="2.8"/>
    <circle cx="546" cy="72" r="2.8"/><circle cx="177.6" cy="172" r="2.8"/>
    <circle cx="583.8" cy="72" r="2.8"/><circle cx="330" cy="172" r="2.8"/>
    <circle cx="594.6" cy="72" r="2.8"/><circle cx="467.1" cy="172" r="2.8"/>
  </g>

  <!-- the amber chord: stated ½ lands on the prevalence -->
  <line x1="330" y1="72" x2="76.2" y2="172" stroke="#e2903a" stroke-width="2"/>
  <circle cx="330" cy="72" r="3.2" fill="#e2903a"/>
  <circle cx="76.2" cy="172" r="3.2" fill="#e2903a"/>

  <!-- bottom axis -->
  <line x1="60" y1="172" x2="600" y2="172" stroke="currentColor"/>
  <line x1="60" y1="168" x2="60" y2="176" stroke="currentColor"/>
  <line x1="330" y1="168" x2="330" y2="176" stroke="currentColor"/>
  <line x1="600" y1="168" x2="600" y2="176" stroke="currentColor"/>
  <text x="60" y="192" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.55">0</text>
  <text x="103" y="192" text-anchor="middle" font-size="10.5" font-weight="600" fill="#e2903a">π = 0.03</text>
  <text x="330" y="192" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.55">0.5</text>
  <text x="600" y="192" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.55">1</text>

  <text x="60" y="216" font-size="12" fill="currentColor">honest probability, p</text>
  <text x="230" y="216" font-size="11" fill="currentColor" opacity="0.55">every chord: the same δ = log((1−π)/π) ≈ 3.5 off the log-odds</text>
</svg>

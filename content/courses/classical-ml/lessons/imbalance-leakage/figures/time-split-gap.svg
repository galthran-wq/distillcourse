<svg viewBox="0 0 520 240" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- y axis: accuracy 50..100, y = 196 - (acc-50)*2.8 -->
  <line x1="52" y1="40" x2="52" y2="196" stroke="currentColor" opacity="0.4"/>
  <line x1="52" y1="196" x2="500" y2="196" stroke="currentColor" opacity="0.4"/>
  <text x="46" y="200" text-anchor="end" font-size="11" fill="currentColor" opacity="0.55">50%</text>
  <text x="46" y="130" text-anchor="end" font-size="11" fill="currentColor" opacity="0.55">75%</text>
  <line x1="52" y1="126" x2="500" y2="126" stroke="currentColor" opacity="0.15"/>
  <text x="46" y="60" text-anchor="end" font-size="11" fill="currentColor" opacity="0.55">100%</text>
  <text x="20" y="118" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55" transform="rotate(-90 20 118)">test accuracy</text>

  <!-- stationary group: random 88, time 84 -->
  <rect x="96" y="89.6" width="44" height="106.4" fill="#4c8dd6" opacity="0.85"/>
  <text x="118" y="83" text-anchor="middle" font-size="12" fill="#4c8dd6">88</text>
  <rect x="152" y="100.8" width="44" height="95.2" fill="#e2903a" opacity="0.85"/>
  <text x="174" y="94" text-anchor="middle" font-size="12" fill="#e2903a">84</text>
  <text x="146" y="216" text-anchor="middle" font-size="12" fill="currentColor">stationary data</text>

  <!-- drifting group: random 87, time 65 -->
  <rect x="316" y="92.4" width="44" height="103.6" fill="#4c8dd6" opacity="0.85"/>
  <text x="338" y="86" text-anchor="middle" font-size="12" fill="#4c8dd6">87</text>
  <rect x="372" y="154" width="44" height="42" fill="#e2903a" opacity="0.85"/>
  <text x="394" y="148" text-anchor="middle" font-size="12" fill="#e2903a">65</text>
  <text x="366" y="216" text-anchor="middle" font-size="12" fill="currentColor">drifting data</text>

  <!-- gap bracket on drifting -->
  <path d="M426 92.4 h12 v61.6 h-12" stroke="currentColor" fill="none" opacity="0.7"/>
  <text x="446" y="120" font-size="11" fill="currentColor">22-point</text>
  <text x="446" y="134" font-size="11" fill="currentColor">gap: the</text>
  <text x="446" y="148" font-size="11" fill="currentColor">diagnostic</text>

  <!-- legend -->
  <rect x="96" y="30" width="12" height="12" fill="#4c8dd6" opacity="0.85"/>
  <text x="113" y="40" font-size="11" fill="currentColor">shuffled split</text>
  <rect x="200" y="30" width="12" height="12" fill="#e2903a" opacity="0.85"/>
  <text x="217" y="40" font-size="11" fill="currentColor">forward (time) split</text>
</svg>

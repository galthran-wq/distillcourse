<svg viewBox="0 0 620 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- y axis: frequency 0 at y=240, 0.4 at y=40 (500 px per unit) -->
  <line x1="60" y1="30" x2="60" y2="262" stroke="currentColor" stroke-width="1" opacity="0.6"/>
  <line x1="60" y1="240" x2="590" y2="240" stroke="currentColor" stroke-width="1" opacity="0.6"/>
  <text x="52" y="244" font-size="10" fill="currentColor" opacity="0.55" text-anchor="end">0</text>
  <text x="52" y="144" font-size="10" fill="currentColor" opacity="0.55" text-anchor="end">0.2</text>
  <text x="52" y="44" font-size="10" fill="currentColor" opacity="0.55" text-anchor="end">0.4</text>
  <text x="26" y="140" font-size="11" fill="currentColor" opacity="0.7" transform="rotate(-90 26 140)" text-anchor="middle">mean claim frequency</text>
  <text x="325" y="290" font-size="11" fill="currentColor" opacity="0.7" text-anchor="middle">test policies sorted by predicted rate, split into tenths &#8594;</text>

  <!-- decile x positions: 90 + 50*(k-1), k=1..10 -->
  <!-- observed frequencies: .03 .04 .05 .06 .07 .08 .10 .13 .18 .30 -->
  <g fill="currentColor">
    <circle cx="90" cy="225" r="4"/><circle cx="140" cy="220" r="4"/>
    <circle cx="190" cy="215" r="4"/><circle cx="240" cy="210" r="4"/>
    <circle cx="290" cy="205" r="4"/><circle cx="340" cy="200" r="4"/>
    <circle cx="390" cy="190" r="4"/><circle cx="440" cy="175" r="4"/>
    <circle cx="490" cy="150" r="4"/><circle cx="540" cy="90" r="4"/>
  </g>

  <!-- Poisson mean prediction per decile: tracks observed -->
  <path d="M 90 225 L 140 220 L 190 216 L 240 210 L 290 206 L 340 200 L 390 191 L 440 177 L 490 155 L 540 95"
        fill="none" stroke="#e2903a" stroke-width="2"/>

  <!-- ridge mean prediction per decile: negative in decile 1, compressed at the top -->
  <path d="M 90 250 L 140 230 L 190 215 L 240 205 L 290 200 L 340 195 L 390 190 L 440 180 L 490 170 L 540 145"
        fill="none" stroke="#4c8dd6" stroke-width="2"/>

  <!-- annotations -->
  <text x="96" y="264" font-size="10.5" fill="#4c8dd6">negative predicted rate</text>
  <text x="96" y="277" font-size="10.5" fill="#4c8dd6">for the safest tenth</text>
  <text x="368" y="130" font-size="10.5" fill="#4c8dd6" text-anchor="end">ridge compresses the risky tail:</text>
  <text x="368" y="143" font-size="10.5" fill="#4c8dd6" text-anchor="end">10,693 claims forecast, 11,935 observed</text>
  <line x1="374" y1="138" x2="530" y2="144" stroke="#4c8dd6" stroke-width="1" opacity="0.6"/>
  <text x="524" y="70" font-size="10.5" fill="#e2903a" text-anchor="end">Poisson tracks each tenth;</text>
  <text x="524" y="83" font-size="10.5" fill="#e2903a" text-anchor="end">forecast total 11,930</text>

  <!-- legend -->
  <circle cx="80" cy="42" r="4" fill="currentColor"/>
  <text x="90" y="46" font-size="10.5" fill="currentColor" opacity="0.8">observed frequency</text>
  <line x1="200" y1="42" x2="222" y2="42" stroke="#e2903a" stroke-width="2"/>
  <text x="228" y="46" font-size="10.5" fill="currentColor" opacity="0.8">Poisson prediction</text>
  <line x1="335" y1="42" x2="357" y2="42" stroke="#4c8dd6" stroke-width="2"/>
  <text x="363" y="46" font-size="10.5" fill="currentColor" opacity="0.8">ridge prediction</text>
</svg>

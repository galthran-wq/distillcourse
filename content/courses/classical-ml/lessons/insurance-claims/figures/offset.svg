<svg viewBox="0 0 560 232" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- shared banner -->
  <text x="280" y="20" font-size="12" fill="currentColor" text-anchor="middle">same features x &#8658; same rate &#955;(x) = e<tspan font-size="9" dy="-5">w&#8890;x</tspan><tspan dy="5"> = 0.1 claims per year</tspan></text>

  <!-- policy A card -->
  <rect x="40" y="38" width="210" height="86" rx="6" fill="none" stroke="currentColor" opacity="0.5"/>
  <text x="145" y="60" font-size="12" fill="currentColor" text-anchor="middle">policy A &#8212; insured 6 months</text>
  <text x="145" y="80" font-size="11.5" fill="currentColor" opacity="0.75" text-anchor="middle">exposure t = 0.5</text>
  <text x="145" y="108" font-size="13" fill="#e2903a" text-anchor="middle">E[y] = t&#183;&#955; = 0.05</text>

  <!-- policy B card -->
  <rect x="310" y="38" width="210" height="86" rx="6" fill="none" stroke="currentColor" opacity="0.5"/>
  <text x="415" y="60" font-size="12" fill="currentColor" text-anchor="middle">policy B &#8212; insured 2 years</text>
  <text x="415" y="80" font-size="11.5" fill="currentColor" opacity="0.75" text-anchor="middle">exposure t = 2</text>
  <text x="415" y="108" font-size="13" fill="#e2903a" text-anchor="middle">E[y] = t&#183;&#955; = 0.20</text>

  <!-- arrow between -->
  <line x1="252" y1="81" x2="304" y2="81" stroke="currentColor" stroke-width="1.5" opacity="0.6"/>
  <path d="M 304 81 l -7 -4 v 8 z" fill="currentColor" opacity="0.6"/>
  <text x="279" y="70" font-size="10.5" fill="currentColor" opacity="0.7" text-anchor="middle">&#215;4 exposure</text>
  <text x="279" y="140" font-size="11" fill="currentColor" opacity="0.8" text-anchor="middle">same risk, four times the expected count &#8212; the model must know t</text>

  <!-- formula -->
  <text x="280" y="180" font-size="14" fill="currentColor" text-anchor="middle">log &#956; = w<tspan font-size="10" dy="-6">&#8890;</tspan><tspan dy="6">x</tspan> + <tspan fill="#e2903a">log t</tspan></text>
  <line x1="316" y1="190" x2="352" y2="190" stroke="#e2903a" stroke-width="1.5"/>
  <text x="334" y="210" font-size="10.5" fill="#e2903a" text-anchor="middle">the offset: a regressor whose</text>
  <text x="334" y="223" font-size="10.5" fill="#e2903a" text-anchor="middle">coefficient is fixed at 1 &#8212; nothing to fit</text>
</svg>

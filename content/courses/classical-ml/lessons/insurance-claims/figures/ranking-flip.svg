<svg viewBox="0 0 660 352" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- block headers -->
  <text x="200" y="22" font-size="12.5" fill="#4c8dd6" text-anchor="middle" font-weight="600">ridge</text>
  <text x="480" y="22" font-size="12.5" fill="#e2903a" text-anchor="middle" font-weight="600">Poisson GLM</text>
  <line x1="130" y1="30" x2="330" y2="30" stroke="#4c8dd6" stroke-width="1.5" opacity="0.6"/>
  <line x1="410" y1="30" x2="610" y2="30" stroke="#e2903a" stroke-width="1.5" opacity="0.6"/>

  <!-- column headers -->
  <text x="30" y="50" font-size="11" fill="currentColor" opacity="0.7">policy</text>
  <text x="105" y="50" font-size="11" fill="currentColor" opacity="0.7" text-anchor="middle">y</text>
  <text x="160" y="50" font-size="11" fill="currentColor" opacity="0.7" text-anchor="middle">&#956;&#770;</text>
  <text x="235" y="50" font-size="11" fill="currentColor" opacity="0.7" text-anchor="middle">(y&#8722;&#956;&#770;)&#178;</text>
  <text x="305" y="50" font-size="11" fill="currentColor" opacity="0.7" text-anchor="middle">dev</text>
  <text x="440" y="50" font-size="11" fill="currentColor" opacity="0.7" text-anchor="middle">&#956;&#770;</text>
  <text x="515" y="50" font-size="11" fill="currentColor" opacity="0.7" text-anchor="middle">(y&#8722;&#956;&#770;)&#178;</text>
  <text x="585" y="50" font-size="11" fill="currentColor" opacity="0.7" text-anchor="middle">dev</text>
  <line x1="20" y1="58" x2="640" y2="58" stroke="currentColor" stroke-width="1" opacity="0.4"/>

  <!-- data rows: y at 78, 100, 122, 144, 166, 188 -->
  <g font-size="11.5" fill="currentColor">
    <text x="30" y="78">1&#160;&#160;safe</text>
    <text x="105" y="78" text-anchor="middle">0</text>
    <text x="160" y="78" text-anchor="middle">&#8722;0.04</text>
    <text x="235" y="78" text-anchor="middle">0.002</text>
    <text x="305" y="78" text-anchor="middle">&#8212;&#8224;</text>
    <text x="440" y="78" text-anchor="middle">0.05</text>
    <text x="515" y="78" text-anchor="middle">0.003</text>
    <text x="585" y="78" text-anchor="middle">0.10</text>

    <text x="30" y="100">2&#160;&#160;safe</text>
    <text x="105" y="100" text-anchor="middle">0</text>
    <text x="160" y="100" text-anchor="middle">0.04</text>
    <text x="235" y="100" text-anchor="middle">0.002</text>
    <text x="305" y="100" text-anchor="middle">0.08</text>
    <text x="440" y="100" text-anchor="middle">0.06</text>
    <text x="515" y="100" text-anchor="middle">0.004</text>
    <text x="585" y="100" text-anchor="middle">0.12</text>

    <text x="30" y="122">3&#160;&#160;average</text>
    <text x="105" y="122" text-anchor="middle">0</text>
    <text x="160" y="122" text-anchor="middle">0.10</text>
    <text x="235" y="122" text-anchor="middle">0.010</text>
    <text x="305" y="122" text-anchor="middle">0.20</text>
    <text x="440" y="122" text-anchor="middle">0.10</text>
    <text x="515" y="122" text-anchor="middle">0.010</text>
    <text x="585" y="122" text-anchor="middle">0.20</text>

    <text x="30" y="144">4&#160;&#160;risky</text>
    <text x="105" y="144" text-anchor="middle">0</text>
    <text x="160" y="144" text-anchor="middle">0.16</text>
    <text x="235" y="144" text-anchor="middle">0.026</text>
    <text x="305" y="144" text-anchor="middle">0.32</text>
    <text x="440" y="144" text-anchor="middle">0.48</text>
    <text x="515" y="144" text-anchor="middle">0.230</text>
    <text x="585" y="144" text-anchor="middle">0.96</text>

    <text x="30" y="166">5&#160;&#160;risky</text>
    <text x="105" y="166" text-anchor="middle">0</text>
    <text x="160" y="166" text-anchor="middle">0.18</text>
    <text x="235" y="166" text-anchor="middle">0.032</text>
    <text x="305" y="166" text-anchor="middle">0.36</text>
    <text x="440" y="166" text-anchor="middle">0.52</text>
    <text x="515" y="166" text-anchor="middle">0.270</text>
    <text x="585" y="166" text-anchor="middle">1.04</text>

    <text x="30" y="188">6&#160;&#160;risky</text>
    <text x="105" y="188" text-anchor="middle" font-weight="600">1</text>
    <text x="160" y="188" text-anchor="middle">0.24</text>
    <text x="235" y="188" text-anchor="middle">0.578</text>
    <text x="305" y="188" text-anchor="middle" font-weight="600">1.33</text>
    <text x="440" y="188" text-anchor="middle">0.62</text>
    <text x="515" y="188" text-anchor="middle">0.144</text>
    <text x="585" y="188" text-anchor="middle">0.20</text>
  </g>

  <line x1="20" y1="200" x2="640" y2="200" stroke="currentColor" stroke-width="1" opacity="0.4"/>

  <!-- totals -->
  <g font-size="11.5" fill="currentColor">
    <text x="30" y="224" opacity="0.8">MSE (mean of 6)</text>
    <rect x="207" y="210" width="56" height="19" rx="4" fill="#e2903a" opacity="0.22"/>
    <text x="235" y="224" text-anchor="middle" font-weight="600">0.108</text>
    <text x="515" y="224" text-anchor="middle">0.110</text>

    <text x="30" y="252" opacity="0.8">mean deviance</text>
    <text x="305" y="252" text-anchor="middle">0.459</text>
    <text x="336" y="252" font-size="9.5" opacity="0.65">(over 5)</text>
    <rect x="557" y="238" width="56" height="19" rx="4" fill="#e2903a" opacity="0.22"/>
    <text x="585" y="252" text-anchor="middle" font-weight="600">0.436</text>
  </g>
  <text x="235" y="240" font-size="10" fill="#e2903a" text-anchor="middle">squared error&#8217;s pick</text>
  <text x="585" y="268" font-size="10" fill="#e2903a" text-anchor="middle">the likelihood&#8217;s pick</text>

  <!-- footnotes -->
  <line x1="20" y1="282" x2="640" y2="282" stroke="currentColor" stroke-width="1" opacity="0.25"/>
  <text x="20" y="300" font-size="10.5" fill="currentColor" opacity="0.7">&#8224; &#956;&#770; = &#8722;0.04 &#8804; 0: the Poisson deviance is undefined, so the row is dropped from ridge&#8217;s average</text>
  <text x="20" y="316" font-size="10.5" fill="currentColor" opacity="0.7">&#8195;(the published protocol) &#8212; ridge is excused from the row it disqualified itself on, and still loses.</text>
  <text x="20" y="338" font-size="10.5" fill="currentColor" opacity="0.7">Row 6 decides: ridge called the realized claim a 0.24 rate and pays 1.33; squared error charges both models least there.</text>
</svg>

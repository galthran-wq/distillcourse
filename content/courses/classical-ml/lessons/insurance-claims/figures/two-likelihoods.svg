<svg viewBox="0 0 620 268" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- ========== left panel: Gaussian ========== -->
  <text x="160" y="18" font-size="12.5" fill="currentColor" text-anchor="middle">what the Gaussian N(0.1, 0.1) asserts</text>
  <text x="160" y="33" font-size="10" fill="currentColor" opacity="0.6" text-anchor="middle">variance matched to the Poisson, not fitted</text>

  <!-- axes -->
  <line x1="40" y1="210" x2="290" y2="210" stroke="currentColor" stroke-width="1" opacity="0.6"/>
  <!-- x ticks: -1 at 40, 0 at 100, 1 at 160, 2 at 220, 3 at 280 -->
  <text x="40" y="226" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">&#8722;1</text>
  <text x="100" y="226" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">0</text>
  <text x="160" y="226" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">1</text>
  <text x="220" y="226" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">2</text>
  <text x="280" y="226" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">3</text>

  <!-- data bars: share of policies at each count -->
  <rect x="88" y="70" width="24" height="140" fill="currentColor" opacity="0.22"/>
  <rect x="148" y="202" width="24" height="8" fill="currentColor" opacity="0.22"/>
  <rect x="208" y="208" width="24" height="2" fill="currentColor" opacity="0.22"/>
  <text x="100" y="62" font-size="10" fill="currentColor" opacity="0.7" text-anchor="middle">94% of policies</text>

  <!-- Gaussian density, mean 0.1 (x=106), sd 0.316 (19 px); peak height 115 above axis -->
  <path d="M 46 209.8 C 60 209.5, 74 206, 84 190 C 92 175, 98 130, 106 95 C 114 130, 120 175, 128 190 C 138 206, 152 209.5, 166 209.8 L 172 210"
        fill="none" stroke="#4c8dd6" stroke-width="2"/>
  <!-- shaded mass below zero: area under curve left of x=100 -->
  <path d="M 46 209.8 C 60 209.5, 74 206, 84 190 C 90 178, 95 145, 100 118 L 100 210 L 46 210 Z"
        fill="#4c8dd6" opacity="0.28"/>
  <text x="44" y="96" font-size="11" fill="#4c8dd6">37.6% of its</text>
  <text x="44" y="110" font-size="11" fill="#4c8dd6">mass below 0</text>
  <line x1="72" y1="116" x2="90" y2="180" stroke="#4c8dd6" stroke-width="1" opacity="0.7"/>

  <text x="160" y="250" font-size="10.5" fill="#4c8dd6" text-anchor="middle">a density: probability of y = 0 exactly is zero</text>

  <!-- ========== right panel: Poisson ========== -->
  <text x="460" y="18" font-size="12.5" fill="currentColor" text-anchor="middle">what the Poisson(0.1) asserts</text>

  <line x1="340" y1="210" x2="590" y2="210" stroke="currentColor" stroke-width="1" opacity="0.6"/>
  <text x="340" y="226" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">&#8722;1</text>
  <text x="400" y="226" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">0</text>
  <text x="460" y="226" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">1</text>
  <text x="520" y="226" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">2</text>
  <text x="580" y="226" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">3</text>

  <!-- same data bars -->
  <rect x="388" y="70" width="24" height="140" fill="currentColor" opacity="0.22"/>
  <rect x="448" y="202" width="24" height="8" fill="currentColor" opacity="0.22"/>
  <rect x="508" y="208" width="24" height="2" fill="currentColor" opacity="0.22"/>

  <!-- Poisson pmf stems at 0, 1, 2: p = 0.905, 0.090, 0.005 -->
  <line x1="400" y1="210" x2="400" y2="75" stroke="#e2903a" stroke-width="2.5"/>
  <circle cx="400" cy="75" r="4" fill="#e2903a"/>
  <line x1="460" y1="210" x2="460" y2="196.5" stroke="#e2903a" stroke-width="2.5"/>
  <circle cx="460" cy="196.5" r="4" fill="#e2903a"/>
  <circle cx="520" cy="209" r="3" fill="#e2903a"/>
  <text x="413" y="72" font-size="11" fill="#e2903a">p(0) = 0.905</text>
  <text x="473" y="192" font-size="11" fill="#e2903a">p(1) = 0.090</text>
  <text x="530" y="200" font-size="10" fill="#e2903a">p(2) = 0.005</text>

  <text x="460" y="250" font-size="10.5" fill="#e2903a" text-anchor="middle">support on 0, 1, 2, &#8230; &#8212; no mass below zero</text>

  <!-- shared x label -->
  <text x="310" y="243" font-size="11" fill="currentColor" opacity="0.7" text-anchor="middle">y</text>
</svg>

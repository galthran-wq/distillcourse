<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250">
  <!-- original -->
  <text x="16" y="30" font-family="system-ui, sans-serif" font-size="13" fill="currentColor">original: 43,200 pixels &#215; 24 bits</text>
  <rect x="16" y="38" width="560" height="26" rx="4" fill="currentColor" opacity="0.35"/>
  <text x="584" y="56" font-family="system-ui, sans-serif" font-size="13" fill="currentColor" text-anchor="end" dx="-8">1,036,800 bits</text>

  <!-- K = 4 -->
  <text x="16" y="102" font-family="system-ui, sans-serif" font-size="13" fill="currentColor">K = 4: codebook 4 &#215; 24 + indices 43,200 &#215; 2</text>
  <rect x="16" y="110" width="2" height="26" fill="#4c8dd6"/>
  <rect x="18" y="110" width="46.7" height="26" rx="3" fill="#e2903a"/>
  <text x="74" y="128" font-family="system-ui, sans-serif" font-size="13" fill="currentColor">86,496 bits &#8212; 8.3% of the original</text>

  <!-- K = 16 -->
  <text x="16" y="174" font-family="system-ui, sans-serif" font-size="13" fill="currentColor">K = 16: codebook 16 &#215; 24 + indices 43,200 &#215; 4</text>
  <rect x="16" y="182" width="2" height="26" fill="#4c8dd6"/>
  <rect x="18" y="182" width="93.4" height="26" rx="3" fill="#e2903a"/>
  <text x="121" y="200" font-family="system-ui, sans-serif" font-size="13" fill="currentColor">173,184 bits &#8212; 16.7% of the original</text>

  <!-- legend -->
  <rect x="16" y="228" width="10" height="10" fill="#4c8dd6"/>
  <text x="32" y="237" font-family="system-ui, sans-serif" font-size="12" fill="currentColor" opacity="0.7">codebook: K centers at 24 bits</text>
  <rect x="360" y="228" width="10" height="10" fill="#e2903a"/>
  <text x="376" y="237" font-family="system-ui, sans-serif" font-size="12" fill="currentColor" opacity="0.7">indices: log&#8322;K bits per pixel</text>
</svg>

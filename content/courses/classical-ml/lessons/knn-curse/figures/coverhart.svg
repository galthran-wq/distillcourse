<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <!-- left: the conditional distribution at the query -->
  <text x="20" y="24" font-size="13">at the query x: &#951;(x) = 0.7</text>
  <rect x="30" y="46" width="44" height="112" fill="#4c8dd6"/>
  <rect x="30" y="158" width="44" height="48" fill="#5aa46a"/>
  <rect x="30" y="46" width="44" height="160" fill="none" stroke="currentColor" opacity="0.55"/>
  <text x="82" y="106" fill="#4c8dd6">P[Y = 1] = 0.7</text>
  <text x="82" y="186" fill="#5aa46a">P[Y = 0] = 0.3</text>

  <!-- middle: two independent draws from the same bias -->
  <text x="230" y="70">true label of x:</text>
  <text x="230" y="86">Y ~ Bernoulli(0.7)</text>
  <text x="230" y="150">nearest neighbor&#8217;s label:</text>
  <text x="230" y="166">Y&#8242; ~ Bernoulli(&#951;(x&#8321;)) &#8776; Bernoulli(0.7)</text>
  <text x="230" y="182" opacity="0.55" font-size="11">(x&#8321; &#8594; x as n &#8594; &#8734;)</text>
  <line x1="80" y1="80" x2="222" y2="80" stroke="currentColor" opacity="0.4"/>
  <line x1="80" y1="150" x2="222" y2="150" stroke="currentColor" opacity="0.4"/>
  <text x="230" y="220">disagree with probability</text>
  <text x="230" y="238">0.7&#183;0.3 + 0.3&#183;0.7 = 2&#951;(1&#8722;&#951;)</text>
  <text x="230" y="256" fill="#e2903a">= 0.42</text>

  <!-- right: the error ladder as bars (scale: 300 px per unit error) -->
  <text x="440" y="24" font-size="13">error at x</text>
  <rect x="440" y="46"  width="90"  height="18" fill="#5aa46a"/>
  <text x="536" y="60">Bayes: min(&#951;, 1&#8722;&#951;) = 0.30</text>
  <rect x="440" y="86"  width="126" height="18" fill="#e2903a"/>
  <text x="440" y="122" fill="#e2903a">1-NN, n &#8594; &#8734;: 0.42</text>
  <rect x="440" y="146" width="180" height="18" fill="none" stroke="currentColor" stroke-dasharray="3 3" opacity="0.7"/>
  <text x="440" y="182" opacity="0.7">cap: 2 &#215; Bayes = 0.60</text>
  <text x="440" y="220">2&#951;(1&#8722;&#951;) &#8804; 2 min(&#951;, 1&#8722;&#951;)</text>
  <text x="440" y="238">at every x</text>
</svg>

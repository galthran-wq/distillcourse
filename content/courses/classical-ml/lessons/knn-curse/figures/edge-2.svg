<svg viewBox="0 0 480 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <text x="20" y="24" font-size="13">a neighborhood capturing 10% of uniform data in [0,1]&#7496;</text>
  <!-- shape zone: d = 3, isometric cube -->
  <g stroke="currentColor" opacity="0.6" fill="none">
    <rect x="60" y="75" width="150" height="150"/>
    <rect x="95" y="40" width="150" height="150"/>
    <line x1="60" y1="75" x2="95" y2="40"/>
    <line x1="210" y1="75" x2="245" y2="40"/>
    <line x1="60" y1="225" x2="95" y2="190"/>
    <line x1="210" y1="225" x2="245" y2="190"/>
  </g>
  <g fill="#e2903a" opacity="0.85">
    <rect x="60" y="155" width="70" height="70"/>
    <polygon points="60,155 76,139 146,139 130,155"/>
    <polygon points="130,155 146,139 146,209 130,225"/>
  </g>
  <text x="300" y="100" font-size="14">d = 3</text>
  <text x="300" y="122">volume 0.1 &#8658; edge 0.1^(1/3)</text>
  <text x="300" y="140" fill="#e2903a" font-weight="bold">&#8776; 0.46</text>
  <!-- axis-coverage bar -->
  <text x="60" y="253" opacity="0.7" font-size="11">share of each axis the neighborhood spans</text>
  <line x1="60" y1="268" x2="420" y2="268" stroke="currentColor" opacity="0.4"/>
  <line x1="60" y1="262" x2="60" y2="274" stroke="currentColor" opacity="0.55"/>
  <line x1="420" y1="262" x2="420" y2="274" stroke="currentColor" opacity="0.55"/>
  <rect x="60" y="264" width="167" height="8" fill="#e2903a"/>
  <text x="56" y="290" opacity="0.55" font-size="11">0</text>
  <text x="416" y="290" opacity="0.55" font-size="11">1</text>
  <text x="233" y="290" fill="#e2903a" font-size="11">0.46</text>
</svg>

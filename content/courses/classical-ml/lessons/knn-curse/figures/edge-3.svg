<svg viewBox="0 0 480 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <text x="20" y="24" font-size="13">a neighborhood capturing 10% of uniform data in [0,1]&#7496;</text>
  <!-- shape zone: d = 10, one line per axis -->
  <g>
    <line x1="60" y1="60"  x2="240" y2="60"  stroke="currentColor" opacity="0.4"/><rect x="60" y="57"  width="143" height="6" fill="#e2903a"/>
    <line x1="60" y1="80"  x2="240" y2="80"  stroke="currentColor" opacity="0.4"/><rect x="60" y="77"  width="143" height="6" fill="#e2903a"/>
    <line x1="60" y1="100" x2="240" y2="100" stroke="currentColor" opacity="0.4"/><rect x="60" y="97"  width="143" height="6" fill="#e2903a"/>
    <line x1="60" y1="120" x2="240" y2="120" stroke="currentColor" opacity="0.4"/><rect x="60" y="117" width="143" height="6" fill="#e2903a"/>
    <line x1="60" y1="140" x2="240" y2="140" stroke="currentColor" opacity="0.4"/><rect x="60" y="137" width="143" height="6" fill="#e2903a"/>
    <line x1="60" y1="160" x2="240" y2="160" stroke="currentColor" opacity="0.4"/><rect x="60" y="157" width="143" height="6" fill="#e2903a"/>
    <line x1="60" y1="180" x2="240" y2="180" stroke="currentColor" opacity="0.4"/><rect x="60" y="177" width="143" height="6" fill="#e2903a"/>
    <line x1="60" y1="200" x2="240" y2="200" stroke="currentColor" opacity="0.4"/><rect x="60" y="197" width="143" height="6" fill="#e2903a"/>
    <line x1="60" y1="220" x2="240" y2="220" stroke="currentColor" opacity="0.4"/><rect x="60" y="217" width="143" height="6" fill="#e2903a"/>
    <line x1="60" y1="240" x2="240" y2="240" stroke="currentColor" opacity="0.4"/><rect x="60" y="237" width="143" height="6" fill="#e2903a"/>
  </g>
  <text x="60" y="48" opacity="0.7" font-size="11">all ten coordinate axes, each 80% covered</text>
  <text x="300" y="100" font-size="14">d = 10</text>
  <text x="300" y="122">volume 0.1 &#8658; edge 0.1^(1/10)</text>
  <text x="300" y="140" fill="#e2903a" font-weight="bold">&#8776; 0.80</text>
  <!-- axis-coverage bar -->
  <text x="60" y="253" opacity="0.7" font-size="11">share of each axis the neighborhood spans</text>
  <line x1="60" y1="268" x2="420" y2="268" stroke="currentColor" opacity="0.4"/>
  <line x1="60" y1="262" x2="60" y2="274" stroke="currentColor" opacity="0.55"/>
  <line x1="420" y1="262" x2="420" y2="274" stroke="currentColor" opacity="0.55"/>
  <rect x="60" y="264" width="286" height="8" fill="#e2903a"/>
  <text x="56" y="290" opacity="0.55" font-size="11">0</text>
  <text x="416" y="290" opacity="0.55" font-size="11">1</text>
  <text x="352" y="290" fill="#e2903a" font-size="11">0.80</text>
</svg>

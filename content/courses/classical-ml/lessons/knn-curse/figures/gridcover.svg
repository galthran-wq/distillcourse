<svg viewBox="0 0 640 370" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <!-- unit square covered by a T×T grid, T = 5 -->
  <text x="110" y="20" font-size="13">[0,1]&#178; covered by T&#178; = 25 boxes of edge &#949; = 1/T</text>
  <!-- empty cells shaded -->
  <rect x="290" y="30" width="60" height="60" fill="currentColor" fill-opacity="0.12"/>
  <rect x="170" y="150" width="60" height="60" fill="currentColor" fill-opacity="0.12"/>
  <rect x="350" y="210" width="60" height="60" fill="currentColor" fill-opacity="0.12"/>
  <rect x="110" y="270" width="60" height="60" fill="currentColor" fill-opacity="0.12"/>
  <!-- grid -->
  <g stroke="currentColor" opacity="0.45">
    <rect x="110" y="30" width="300" height="300" fill="none"/>
    <line x1="170" y1="30" x2="170" y2="330"/>
    <line x1="230" y1="30" x2="230" y2="330"/>
    <line x1="290" y1="30" x2="290" y2="330"/>
    <line x1="350" y1="30" x2="350" y2="330"/>
    <line x1="110" y1="90" x2="410" y2="90"/>
    <line x1="110" y1="150" x2="410" y2="150"/>
    <line x1="110" y1="210" x2="410" y2="210"/>
    <line x1="110" y1="270" x2="410" y2="270"/>
  </g>
  <!-- training sample -->
  <g fill="#e2903a">
    <circle cx="145" cy="60" r="3.5"/><circle cx="200" cy="75" r="3.5"/><circle cx="255" cy="55" r="3.5"/><circle cx="395" cy="80" r="3.5"/>
    <circle cx="130" cy="125" r="3.5"/><circle cx="215" cy="140" r="3.5"/><circle cx="285" cy="120" r="3.5"/><circle cx="250" cy="145" r="3.5"/><circle cx="325" cy="150" r="3.5"/><circle cx="400" cy="115" r="3.5"/>
    <circle cx="150" cy="195" r="3.5"/><circle cx="270" cy="180" r="3.5"/><circle cx="325" cy="195" r="3.5"/><circle cx="395" cy="170" r="3.5"/>
    <circle cx="125" cy="240" r="3.5"/><circle cx="195" cy="255" r="3.5"/><circle cx="240" cy="235" r="3.5"/><circle cx="335" cy="250" r="3.5"/>
    <circle cx="185" cy="320" r="3.5"/><circle cx="280" cy="305" r="3.5"/><circle cx="345" cy="322" r="3.5"/><circle cx="395" cy="300" r="3.5"/>
  </g>
  <!-- query in a hit cell -->
  <circle cx="265" cy="130" r="4" fill="#4c8dd6"/>
  <line x1="265" y1="130" x2="253" y2="143" stroke="#4c8dd6" stroke-width="1.5"/>
  <text x="425" y="120" fill="#4c8dd6">x in a hit box:</text>
  <text x="425" y="136">&#8214;x &#8722; x&#8321;&#8214; &#8804; &#8730;2 &#183; &#949;</text>
  <line x1="278" y1="128" x2="418" y2="122" stroke="currentColor" opacity="0.3"/>
  <!-- query in an empty cell -->
  <circle cx="205" cy="185" r="4" fill="#4c8dd6"/>
  <line x1="205" y1="185" x2="213" y2="146" stroke="#4c8dd6" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="425" y="196" fill="#4c8dd6">x in a missed box (shaded):</text>
  <text x="425" y="212">only &#8214;x &#8722; x&#8321;&#8214; &#8804; &#8730;2</text>
  <line x1="218" y1="188" x2="418" y2="198" stroke="currentColor" opacity="0.3"/>
  <text x="425" y="260" opacity="0.7" font-size="11">expected probability mass of the</text>
  <text x="425" y="275" opacity="0.7" font-size="11">missed boxes &#8804; T&#178;/(e&#183;n)</text>
  <text x="110" y="355" opacity="0.55" font-size="12">nearness is bought cell by cell: a finer grid needs a bigger sample to keep every box hit</text>
</svg>

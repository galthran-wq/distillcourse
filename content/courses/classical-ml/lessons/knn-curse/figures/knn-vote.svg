<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <!-- shared 12-point layout, two panels: k = 3 and k = 11 -->
  <g id="panelA" transform="translate(10,30)">
    <text x="140" y="-8" text-anchor="middle" font-size="13">k = 3</text>
    <circle cx="150" cy="150" r="38" fill="none" stroke="#e2903a" stroke-dasharray="3 3" stroke-width="1.5"/>
    <circle cx="170" cy="140" r="4" fill="#4c8dd6"/>
    <circle cx="135" cy="170" r="4" fill="#4c8dd6"/>
    <circle cx="190" cy="180" r="4" fill="#4c8dd6"/>
    <circle cx="95"  cy="110" r="4" fill="#4c8dd6"/>
    <circle cx="150" cy="235" r="4" fill="#4c8dd6"/>
    <circle cx="230" cy="80"  r="4" fill="#4c8dd6"/>
    <circle cx="150" cy="115" r="4" fill="#5aa46a"/>
    <circle cx="110" cy="150" r="4" fill="#5aa46a"/>
    <circle cx="200" cy="130" r="4" fill="#5aa46a"/>
    <circle cx="135" cy="205" r="4" fill="#5aa46a"/>
    <circle cx="215" cy="190" r="4" fill="#5aa46a"/>
    <circle cx="85"  cy="190" r="4" fill="#5aa46a"/>
    <path d="M 150 142 L 156 150 L 150 158 L 144 150 Z" fill="#e2903a"/>
    <text x="158" y="163" fill="#e2903a" font-size="11">x</text>
    <text x="45" y="272">vote:</text>
    <text x="79" y="272" fill="#4c8dd6">blue 2</text>
    <text x="122" y="272">&#183;</text>
    <text x="132" y="272" fill="#5aa46a">green 1</text>
    <text x="181" y="272">&#8594;</text>
    <text x="200" y="272" fill="#4c8dd6">blue</text>
  </g>
  <g id="panelB" transform="translate(340,30)">
    <text x="140" y="-8" text-anchor="middle" font-size="13">k = 11</text>
    <circle cx="150" cy="150" r="95" fill="none" stroke="#e2903a" stroke-dasharray="3 3" stroke-width="1.5"/>
    <circle cx="170" cy="140" r="4" fill="#4c8dd6"/>
    <circle cx="135" cy="170" r="4" fill="#4c8dd6"/>
    <circle cx="190" cy="180" r="4" fill="#4c8dd6"/>
    <circle cx="95"  cy="110" r="4" fill="#4c8dd6"/>
    <circle cx="150" cy="235" r="4" fill="#4c8dd6"/>
    <circle cx="230" cy="80"  r="4" fill="#4c8dd6"/>
    <circle cx="150" cy="115" r="4" fill="#5aa46a"/>
    <circle cx="110" cy="150" r="4" fill="#5aa46a"/>
    <circle cx="200" cy="130" r="4" fill="#5aa46a"/>
    <circle cx="135" cy="205" r="4" fill="#5aa46a"/>
    <circle cx="215" cy="190" r="4" fill="#5aa46a"/>
    <circle cx="85"  cy="190" r="4" fill="#5aa46a"/>
    <path d="M 150 142 L 156 150 L 150 158 L 144 150 Z" fill="#e2903a"/>
    <text x="243" y="76" font-size="11" opacity="0.55">left out</text>
    <text x="45" y="272">vote:</text>
    <text x="79" y="272" fill="#5aa46a">green 6</text>
    <text x="128" y="272">&#183;</text>
    <text x="138" y="272" fill="#4c8dd6">blue 5</text>
    <text x="180" y="272">&#8594;</text>
    <text x="199" y="272" fill="#5aa46a">green</text>
  </g>
  <text x="320" y="328" text-anchor="middle" opacity="0.55" font-size="12">same query, same 12 training points &#8212; the prediction flips with k</text>
</svg>

<svg viewBox="0 0 480 250" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="14" y="22" font-size="12.5" fill="currentColor"><tspan font-weight="bold">x₂ unrecorded:</tspan> delete it from μ and Σ</text>

  <!-- 2-D class ellipses -->
  <ellipse cx="150" cy="95" rx="48" ry="26" transform="rotate(-25 150 95)" fill="none" stroke="#4c8dd6" stroke-width="1.5"/>
  <ellipse cx="300" cy="70" rx="48" ry="26" transform="rotate(-25 300 70)" fill="none" stroke="#4c8dd6" stroke-width="1.5"/>
  <text x="80" y="60" font-size="11" fill="#4c8dd6">class 0</text>
  <text x="352" y="46" font-size="11" fill="#4c8dd6">class 1</text>

  <!-- projections to the x1 axis -->
  <line x1="150" y1="105" x2="150" y2="186" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5"/>
  <line x1="300" y1="80" x2="300" y2="186" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5"/>
  <line x1="40" y1="190" x2="440" y2="190" stroke="currentColor" opacity="0.6"/>
  <text x="448" y="194" font-size="11" fill="currentColor" opacity="0.7">x₁</text>

  <!-- marginal bells -->
  <path d="M 90 190 C 120 190, 125 148, 150 148 C 175 148, 180 190, 210 190" fill="none" stroke="#e2903a" stroke-width="2"/>
  <path d="M 240 190 C 270 190, 275 148, 300 148 C 325 148, 330 190, 360 190" fill="none" stroke="#e2903a" stroke-width="2"/>
  <text x="118" y="140" font-size="11" fill="#e2903a">𝒩(0, 1)</text>
  <text x="268" y="140" font-size="11" fill="#e2903a">𝒩(2, 1)</text>

  <!-- boundary -->
  <line x1="225" y1="120" x2="225" y2="190" stroke="currentColor" stroke-width="1.4" opacity="0.6"/>
  <text x="232" y="118" font-size="11" fill="currentColor" opacity="0.7">boundary x₁ = 1</text>

  <text x="146" y="208" font-size="11" fill="currentColor" opacity="0.7">0</text>
  <text x="221" y="208" font-size="11" fill="currentColor" opacity="0.7">1</text>
  <text x="296" y="208" font-size="11" fill="currentColor" opacity="0.7">2</text>
  <text x="14" y="238" font-size="11.5" fill="currentColor" opacity="0.7">a Gaussian's marginal is Gaussian: drop the missing row and column</text>
</svg>

<svg viewBox="0 0 480 250" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <marker id="bp-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#e2903a"/>
    </marker>
  </defs>
  <text x="14" y="22" font-size="12.5" fill="currentColor"><tspan font-weight="bold">prior shift:</tspan> retune one term of b</text>

  <g fill="none" stroke="currentColor" stroke-width="1.3" opacity="0.5">
    <ellipse cx="150" cy="150" rx="42" ry="24" transform="rotate(-25 150 150)"/>
    <ellipse cx="300" cy="105" rx="42" ry="24" transform="rotate(-25 300 105)"/>
  </g>
  <text x="96" y="192" font-size="11" fill="currentColor" opacity="0.7">class 0</text>
  <text x="336" y="76" font-size="11" fill="currentColor" opacity="0.7">class 1</text>

  <line x1="225" y1="44" x2="225" y2="220" stroke="#e2903a" stroke-width="2"/>
  <text x="231" y="56" font-size="11" fill="#e2903a">π₁ = ½ : x₁ = 1</text>

  <line x1="142" y1="44" x2="142" y2="220" stroke="#e2903a" stroke-width="1.6" stroke-dasharray="4 3"/>
  <text x="20" y="56" font-size="11" fill="#e2903a">π₁ = 0.9 :</text>
  <text x="20" y="70" font-size="11" fill="#e2903a">x₁ = −0.10</text>

  <path d="M 219 78 L 152 78" fill="none" stroke="#e2903a" stroke-width="1.4" marker-end="url(#bp-arrow)"/>
  <text x="160" y="94" font-size="11" fill="#e2903a">b + ln 9</text>

  <text x="14" y="240" font-size="11.5" fill="currentColor" opacity="0.7">the boundary slides toward the now-rarer class</text>
</svg>

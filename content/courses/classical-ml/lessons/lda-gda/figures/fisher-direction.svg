<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrB" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4c8dd6"/>
    </marker>
    <marker id="arrA" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#e2903a"/>
    </marker>
  </defs>

  <text x="20" y="24" font-size="13" fill="currentColor"><tspan font-weight="bold">two candidate projections</tspan> (strongly correlated clouds, ρ = 0.9)</text>

  <!-- clouds: shared Sigma with rho = 0.9, elongated along the diagonal -->
  <g fill="none" stroke="currentColor" stroke-width="1.4" opacity="0.55">
    <ellipse cx="120" cy="210" rx="74" ry="17" transform="rotate(-45 120 210)"/>
    <ellipse cx="192" cy="174" rx="74" ry="17" transform="rotate(-45 192 174)"/>
  </g>
  <g fill="currentColor" opacity="0.8">
    <circle cx="120" cy="210" r="3.5"/>
    <circle cx="192" cy="174" r="3.5"/>
  </g>
  <text x="76" y="234" font-size="11" fill="currentColor">μ₀</text>
  <text x="200" y="166" font-size="11" fill="currentColor">μ₁</text>

  <!-- direction 1: raw mean difference -->
  <line x1="120" y1="210" x2="216" y2="162" stroke="#4c8dd6" stroke-width="2" marker-end="url(#arrB)"/>
  <text x="150" y="120" font-size="11.5" fill="#4c8dd6">μ₁ − μ₀</text>

  <!-- direction 2: Fisher -->
  <line x1="120" y1="210" x2="207" y2="273" stroke="#e2903a" stroke-width="2" marker-end="url(#arrA)"/>
  <text x="60" y="296" font-size="11.5" fill="#e2903a">S_W⁻¹(μ₁ − μ₀) : Fisher's direction</text>

  <!-- right: 1-D projections -->
  <text x="380" y="70" font-size="12" fill="#4c8dd6" font-weight="bold">projected on μ₁ − μ₀</text>
  <line x1="380" y1="120" x2="610" y2="120" stroke="currentColor" opacity="0.4"/>
  <rect x="384" y="98" width="138" height="14" rx="4" fill="none" stroke="#4c8dd6" stroke-width="1.5"/>
  <rect x="462" y="106" width="138" height="14" rx="4" fill="#4c8dd6" opacity="0.35"/>
  <text x="380" y="142" font-size="11" fill="currentColor" opacity="0.7">separation / spread = 1.7 — heavy overlap</text>

  <text x="380" y="190" font-size="12" fill="#e2903a" font-weight="bold">projected on S_W⁻¹(μ₁ − μ₀)</text>
  <line x1="380" y1="240" x2="610" y2="240" stroke="currentColor" opacity="0.4"/>
  <rect x="384" y="218" width="102" height="14" rx="4" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <rect x="478" y="226" width="102" height="14" rx="4" fill="#e2903a" opacity="0.35"/>
  <text x="380" y="262" font-size="11" fill="currentColor" opacity="0.7">separation / spread = 2.7 — the maximum J(a)</text>

  <text x="380" y="296" font-size="11" fill="currentColor" opacity="0.55">S_W⁻¹ discounts separation along the within-class spread</text>
</svg>

<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="24" y="30" font-size="13.5" fill="currentColor"><tspan font-weight="bold">1 · write the posterior log-odds.</tspan> Bayes' rule on top and bottom</text>

  <!-- role labels with pointer lines -->
  <text x="130" y="102" font-size="11.5" fill="#e2903a" text-anchor="middle">prior odds</text>
  <line x1="130" y1="108" x2="130" y2="136" stroke="#e2903a" stroke-width="1"/>
  <text x="360" y="102" font-size="11.5" fill="#4c8dd6" text-anchor="middle">density ratio — the data's vote</text>
  <line x1="360" y1="108" x2="360" y2="136" stroke="#4c8dd6" stroke-width="1"/>

  <!-- main formula -->
  <g font-size="16" fill="currentColor">
    <text x="40" y="158">a(x)  =  ln</text>
    <text x="122" y="150" font-size="14" fill="#e2903a" text-anchor="middle">π₁</text>
    <line x1="110" y1="155" x2="134" y2="155" stroke="#e2903a" stroke-width="1.2"/>
    <text x="122" y="170" font-size="14" fill="#e2903a" text-anchor="middle">π₀</text>
    <text x="148" y="158">+  ln</text>
    <text x="300" y="150" font-size="14" fill="#4c8dd6" text-anchor="middle">N(x; μ₁, Σ)</text>
    <line x1="200" y1="155" x2="400" y2="155" stroke="#4c8dd6" stroke-width="1.2"/>
    <text x="300" y="170" font-size="14" fill="#4c8dd6" text-anchor="middle">N(x; μ₀, Σ)</text>
  </g>

  <text x="430" y="158" font-size="13" fill="currentColor" opacity="0.55">then p(y=1|x) = σ(a(x))</text>

  <text x="24" y="240" font-size="12.5" fill="currentColor">The evidence p(x) sits in both posteriors and cancels in the ratio; only the priors</text>
  <text x="24" y="258" font-size="12.5" fill="currentColor">and the two class densities remain. Nothing is assumed yet beyond the model.</text>
</svg>

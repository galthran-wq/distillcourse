<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="24" y="30" font-size="13.5" fill="currentColor"><tspan font-weight="bold">2 · shared Σ, first use:</tspan> the normalizers cancel</text>

  <!-- cancelled normalizer note -->
  <g font-size="12" fill="#5aa46a">
    <text x="360" y="100" text-anchor="middle">(2π)^(d/2) |Σ|^(1/2) is identical in both densities — gone</text>
    <line x1="360" y1="106" x2="360" y2="132" stroke="#5aa46a" stroke-width="1"/>
  </g>

  <!-- main formula: only exponents survive -->
  <g font-size="15.5" fill="currentColor">
    <text x="40" y="158">a(x)  =  ln</text>
    <text x="118" y="150" font-size="13.5" fill="#e2903a" text-anchor="middle">π₁</text>
    <line x1="107" y1="155" x2="129" y2="155" stroke="#e2903a" stroke-width="1.2"/>
    <text x="118" y="170" font-size="13.5" fill="#e2903a" text-anchor="middle">π₀</text>
    <text x="142" y="158">−  ½ (x−μ₁)ᵀΣ⁻¹(x−μ₁)  +  ½ (x−μ₀)ᵀΣ⁻¹(x−μ₀)</text>
  </g>

  <text x="24" y="240" font-size="12.5" fill="currentColor">The log of each Gaussian is its normalizer plus its exponent; with one Σ the</text>
  <text x="24" y="258" font-size="12.5" fill="currentColor">normalizers are equal and the log-ratio keeps only the two quadratic forms.</text>
</svg>

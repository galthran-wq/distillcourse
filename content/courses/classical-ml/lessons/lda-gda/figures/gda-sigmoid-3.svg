<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="24" y="30" font-size="13.5" fill="currentColor"><tspan font-weight="bold">3 · shared Σ, second use:</tspan> expand — the quadratic terms cancel</text>

  <!-- the two expansions, aligned -->
  <g font-size="15" fill="currentColor">
    <text x="40" y="150">− ½ [</text>
    <text x="92" y="150" fill="#e2903a">xᵀΣ⁻¹x</text>
    <text x="162" y="150">−  2 μ₁ᵀΣ⁻¹x  +  μ₁ᵀΣ⁻¹μ₁ ]</text>
    <text x="40" y="192">+ ½ [</text>
    <text x="92" y="192" fill="#e2903a">xᵀΣ⁻¹x</text>
    <text x="162" y="192">−  2 μ₀ᵀΣ⁻¹x  +  μ₀ᵀΣ⁻¹μ₀ ]</text>
  </g>

  <!-- strike-throughs -->
  <line x1="88" y1="145" x2="158" y2="145" stroke="#e2903a" stroke-width="2"/>
  <line x1="88" y1="187" x2="158" y2="187" stroke="#e2903a" stroke-width="2"/>

  <!-- the condition on the cancellation -->
  <g font-size="12" fill="#e2903a">
    <path d="M 120 138 C 130 116, 200 96, 280 96" fill="none" stroke="#e2903a" stroke-width="1"/>
    <text x="288" y="84">same matrix Σ⁻¹, opposite signs:</text>
    <text x="288" y="100">the cancellation IS the shared-Σ hypothesis</text>
  </g>

  <text x="24" y="240" font-size="12.5" fill="currentColor">With per-class Σₖ the two struck terms carry different matrices and a genuine</text>
  <text x="24" y="258" font-size="12.5" fill="currentColor">quadratic survives — that classifier is QDA, and its boundary is a conic.</text>
</svg>

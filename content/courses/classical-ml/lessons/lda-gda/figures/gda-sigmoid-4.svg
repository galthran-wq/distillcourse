<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="24" y="30" font-size="13.5" fill="currentColor"><tspan font-weight="bold">4 · collect.</tspan> what survives is affine in x</text>

  <!-- boxed result -->
  <rect x="34" y="100" width="572" height="52" rx="6" fill="none" stroke="currentColor" opacity="0.7"/>
  <g font-size="15.5" fill="currentColor">
    <text x="48" y="132">a(x)  =</text>
    <text x="112" y="132" fill="#e2903a">(μ₁−μ₀)ᵀΣ⁻¹</text>
    <text x="222" y="132">x</text>
    <text x="240" y="132" fill="#4c8dd6">−  ½ (μ₁+μ₀)ᵀΣ⁻¹(μ₁−μ₀)  +  ln(π₁/π₀)</text>
  </g>

  <!-- naming lines -->
  <g font-size="13">
    <line x1="163" y1="140" x2="163" y2="168" stroke="#e2903a" stroke-width="1"/>
    <text x="163" y="184" fill="#e2903a" text-anchor="middle" font-weight="bold">wᵀ  =  (Σ⁻¹(μ₁−μ₀))ᵀ</text>
    <line x1="420" y1="140" x2="420" y2="168" stroke="#4c8dd6" stroke-width="1"/>
    <text x="420" y="184" fill="#4c8dd6" text-anchor="middle" font-weight="bold">b</text>
  </g>

  <text x="24" y="234" font-size="12.5" fill="currentColor">So p(y=1|x) = σ(wᵀx + b): logistic regression's functional form, parameters from class statistics.</text>
  <text x="24" y="258" font-size="12.5" fill="currentColor" opacity="0.55">running example: w = (2, 0)ᵀ, b = −2 — boundary x₁ = 1, and σ(2·1.5 − 2) = σ(1) = 0.731</text>
</svg>

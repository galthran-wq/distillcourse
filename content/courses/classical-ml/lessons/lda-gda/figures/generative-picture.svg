<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="16" y="26" font-size="13" fill="currentColor"><tspan font-weight="bold">generative:</tspan> fit each class, invert</text>
  <text x="332" y="26" font-size="13" fill="currentColor"><tspan font-weight="bold">discriminative:</tspan> fit the boundary directly</text>

  <!-- left panel frame -->
  <rect x="14" y="40" width="298" height="280" rx="5" fill="none" stroke="currentColor" opacity="0.35"/>
  <!-- right panel frame -->
  <rect x="328" y="40" width="298" height="280" rx="5" fill="none" stroke="currentColor" opacity="0.35"/>

  <!-- LEFT: fitted ellipses (shared Sigma: same shape and orientation) -->
  <g fill="none" stroke="#e2903a" stroke-width="1.6" opacity="0.75">
    <ellipse cx="96" cy="218" rx="66" ry="38" transform="rotate(-45 96 218)"/>
    <ellipse cx="168" cy="182" rx="66" ry="38" transform="rotate(-45 168 182)"/>
  </g>
  <!-- class means -->
  <g fill="#e2903a">
    <circle cx="96" cy="218" r="3.5"/>
    <circle cx="168" cy="182" r="3.5"/>
  </g>
  <text x="52" y="292" font-size="11" fill="#e2903a">μ̂₀</text>
  <text x="176" y="172" font-size="11" fill="#e2903a">μ̂₁</text>

  <!-- LEFT: LDA boundary x1 = 1 -->
  <line x1="132" y1="52" x2="132" y2="312" stroke="#e2903a" stroke-width="2"/>
  <text x="138" y="64" font-size="11" fill="#e2903a">posteriors cross here</text>

  <!-- LEFT points: class 0 open, class 1 filled -->
  <g fill="none" stroke="currentColor" stroke-width="1.3" opacity="0.8">
    <circle cx="63.6" cy="254" r="3.5"/><circle cx="81.6" cy="207.2" r="3.5"/>
    <circle cx="103.2" cy="228.8" r="3.5"/><circle cx="115.8" cy="191" r="3.5"/>
    <circle cx="49.2" cy="236" r="3.5"/><circle cx="128.4" cy="205.4" r="3.5"/>
    <circle cx="97.8" cy="183.8" r="3.5"/><circle cx="76.2" cy="263" r="3.5"/>
    <circle cx="123" cy="243.2" r="3.5"/><circle cx="90.6" cy="212.6" r="3.5"/>
    <circle cx="58.2" cy="212.6" r="3.5"/><circle cx="108.6" cy="200" r="3.5"/>
  </g>
  <g fill="currentColor" opacity="0.8">
    <circle cx="193.2" cy="149.6" r="3.2"/><circle cx="162.6" cy="196.4" r="3.2"/>
    <circle cx="177" cy="176.6" r="3.2"/><circle cx="209.4" cy="164" r="3.2"/>
    <circle cx="150" cy="183.8" r="3.2"/><circle cx="202.2" cy="142.4" r="3.2"/>
    <circle cx="169.8" cy="205.4" r="3.2"/><circle cx="144.6" cy="205.4" r="3.2"/>
    <circle cx="186" cy="196.4" r="3.2"/><circle cx="157.2" cy="160.4" r="3.2"/>
    <circle cx="214.8" cy="131.6" r="3.2"/><circle cx="182.4" cy="156.8" r="3.2"/>
  </g>
  <text x="24" y="310" font-size="11" fill="currentColor" opacity="0.55">shared Σ: one ellipse shape, two centers</text>

  <!-- RIGHT points (same data, +316 in x) -->
  <g fill="none" stroke="currentColor" stroke-width="1.3" opacity="0.8">
    <circle cx="379.6" cy="254" r="3.5"/><circle cx="397.6" cy="207.2" r="3.5"/>
    <circle cx="419.2" cy="228.8" r="3.5"/><circle cx="431.8" cy="191" r="3.5"/>
    <circle cx="365.2" cy="236" r="3.5"/><circle cx="444.4" cy="205.4" r="3.5"/>
    <circle cx="413.8" cy="183.8" r="3.5"/><circle cx="392.2" cy="263" r="3.5"/>
    <circle cx="439" cy="243.2" r="3.5"/><circle cx="406.6" cy="212.6" r="3.5"/>
    <circle cx="374.2" cy="212.6" r="3.5"/><circle cx="424.6" cy="200" r="3.5"/>
  </g>
  <g fill="currentColor" opacity="0.8">
    <circle cx="509.2" cy="149.6" r="3.2"/><circle cx="478.6" cy="196.4" r="3.2"/>
    <circle cx="493" cy="176.6" r="3.2"/><circle cx="525.4" cy="164" r="3.2"/>
    <circle cx="466" cy="183.8" r="3.2"/><circle cx="518.2" cy="142.4" r="3.2"/>
    <circle cx="485.8" cy="205.4" r="3.2"/><circle cx="460.6" cy="205.4" r="3.2"/>
    <circle cx="502" cy="196.4" r="3.2"/><circle cx="473.2" cy="160.4" r="3.2"/>
    <circle cx="530.8" cy="131.6" r="3.2"/><circle cx="498.4" cy="156.8" r="3.2"/>
  </g>

  <!-- RIGHT: logistic boundary, slightly rotated -->
  <line x1="437" y1="52" x2="448" y2="312" stroke="#4c8dd6" stroke-width="2"/>
  <text x="454" y="64" font-size="11" fill="#4c8dd6">conditional-likelihood line</text>
  <text x="340" y="310" font-size="11" fill="currentColor" opacity="0.55">no model of x — a different line by a few degrees</text>
</svg>

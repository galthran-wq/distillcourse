<svg viewBox="0 0 640 270" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <marker id="inf-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#e2903a"/>
    </marker>
  </defs>

  <!-- left panel: generative -->
  <text x="14" y="24" font-size="12.5" fill="currentColor" font-weight="bold">generative fit: every point counts</text>
  <rect x="10" y="34" width="296" height="200" rx="5" fill="none" stroke="currentColor" opacity="0.3"/>
  <g fill="currentColor" opacity="0.8">
    <circle cx="60" cy="195" r="3.5"/><circle cx="75" cy="182" r="3.5"/><circle cx="90" cy="198" r="3.5"/>
    <circle cx="102" cy="186" r="3.5"/><circle cx="70" cy="207" r="3.5"/>
  </g>
  <g fill="currentColor" opacity="0.8">
    <circle cx="150" cy="128" r="3.5"/><circle cx="165" cy="112" r="3.5"/><circle cx="180" cy="125" r="3.5"/>
    <circle cx="192" cy="108" r="3.5"/><circle cx="160" cy="140" r="3.5"/><circle cx="200" cy="120" r="3.5"/>
  </g>
  <text x="42" y="228" font-size="11" fill="currentColor" opacity="0.7">class 0</text>
  <text x="140" y="95" font-size="11" fill="currentColor" opacity="0.7">class 1</text>
  <path d="M 170 122 h 12 M 176 116 v 12" stroke="#e2903a" stroke-width="1.6"/>
  <circle cx="272" cy="58" r="4.5" fill="#e2903a"/>
  <path d="M 266 64 L 190 112" fill="none" stroke="#e2903a" stroke-width="1.4" marker-end="url(#inf-arrow)"/>
  <path d="M 153 132 L 168 125" fill="none" stroke="#e2903a" stroke-width="1.2" opacity="0.7" marker-end="url(#inf-arrow)"/>
  <path d="M 197 116 L 184 119" fill="none" stroke="#e2903a" stroke-width="1.2" opacity="0.7" marker-end="url(#inf-arrow)"/>
  <text x="190" y="52" font-size="11" fill="#e2903a">far, correct — full weight</text>
  <text x="20" y="256" font-size="11.5" fill="currentColor" opacity="0.7">every xᵢ enters μ̂₁ and Σ̂, distance is no discount</text>

  <!-- right panel: conditional -->
  <text x="338" y="24" font-size="12.5" fill="currentColor" font-weight="bold">conditional fit: uncertain points count</text>
  <rect x="334" y="34" width="296" height="200" rx="5" fill="none" stroke="currentColor" opacity="0.3"/>
  <line x1="452" y1="44" x2="408" y2="228" stroke="#4c8dd6" stroke-width="2"/>
  <g fill="currentColor" opacity="0.8">
    <circle cx="384" cy="195" r="3.5"/><circle cx="399" cy="182" r="3.5"/><circle cx="414" cy="198" r="3.5"/>
    <circle cx="426" cy="186" r="3.5"/><circle cx="394" cy="207" r="3.5"/>
  </g>
  <g fill="currentColor" opacity="0.8">
    <circle cx="474" cy="128" r="3.5"/><circle cx="489" cy="112" r="3.5"/><circle cx="504" cy="125" r="3.5"/>
    <circle cx="516" cy="108" r="3.5"/><circle cx="484" cy="140" r="3.5"/><circle cx="524" cy="120" r="3.5"/>
  </g>
  <circle cx="426" cy="186" r="8" fill="none" stroke="#4c8dd6" stroke-width="1.4" opacity="0.7"/>
  <circle cx="474" cy="128" r="8" fill="none" stroke="#4c8dd6" stroke-width="1.4" opacity="0.7"/>
  <circle cx="484" cy="140" r="8" fill="none" stroke="#4c8dd6" stroke-width="1.4" opacity="0.7"/>
  <circle cx="596" cy="58" r="4.5" fill="currentColor" opacity="0.25"/>
  <text x="478" y="62" font-size="11" fill="currentColor" opacity="0.6">(y − p)x ≈ 0</text>
  <text x="344" y="256" font-size="11.5" fill="currentColor" opacity="0.7">only points near the boundary pull on the line</text>
</svg>

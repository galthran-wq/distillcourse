<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="195" y="26" font-size="12.5" fill="currentColor" text-anchor="middle" font-weight="bold">Σ₀ = Σ₁ — same shapes</text>
  <text x="480" y="26" font-size="12.5" fill="currentColor" text-anchor="middle" font-weight="bold">Σ₀ ≠ Σ₁ — tight class, broad class</text>

  <text x="30" y="130" font-size="12.5" fill="currentColor" font-weight="bold">LDA</text>
  <text x="30" y="305" font-size="12.5" fill="currentColor" font-weight="bold">QDA</text>

  <!-- cell frames -->
  <rect x="70" y="40" width="250" height="160" rx="5" fill="none" stroke="currentColor" opacity="0.3"/>
  <rect x="70" y="215" width="250" height="160" rx="5" fill="none" stroke="currentColor" opacity="0.3"/>
  <rect x="355" y="40" width="250" height="160" rx="5" fill="none" stroke="currentColor" opacity="0.3"/>
  <rect x="355" y="215" width="250" height="160" rx="5" fill="none" stroke="currentColor" opacity="0.3"/>

  <!-- TOP LEFT: equal shapes, LDA line -->
  <g fill="none" stroke="#4c8dd6" stroke-width="1.5" opacity="0.8">
    <ellipse cx="140" cy="140" rx="42" ry="24" transform="rotate(-20 140 140)"/>
    <ellipse cx="250" cy="95" rx="42" ry="24" transform="rotate(-20 250 95)"/>
  </g>
  <line x1="211" y1="68" x2="170" y2="190" stroke="#e2903a" stroke-width="2"/>
  <text x="82" y="58" font-size="11" fill="currentColor" opacity="0.7">the truth is a line — LDA's family contains it</text>

  <!-- BOTTOM LEFT: equal shapes, QDA nearly the same line -->
  <g fill="none" stroke="#4c8dd6" stroke-width="1.5" opacity="0.8">
    <ellipse cx="140" cy="315" rx="42" ry="24" transform="rotate(-20 140 315)"/>
    <ellipse cx="250" cy="270" rx="42" ry="24" transform="rotate(-20 250 270)"/>
  </g>
  <path d="M 212 243 C 199 280, 185 322, 171 365" fill="none" stroke="#e2903a" stroke-width="2"/>
  <text x="82" y="233" font-size="11" fill="currentColor" opacity="0.7">≈ the same line: extra parameters buy wobble</text>

  <!-- TOP RIGHT: unequal shapes, LDA forced line -->
  <circle cx="435" cy="140" r="20" fill="none" stroke="#4c8dd6" stroke-width="1.5" opacity="0.8"/>
  <ellipse cx="530" cy="105" rx="62" ry="34" transform="rotate(-15 530 105)" fill="none" stroke="#4c8dd6" stroke-width="1.5" opacity="0.8"/>
  <line x1="487" y1="68" x2="452" y2="190" stroke="#e2903a" stroke-width="2"/>
  <text x="367" y="58" font-size="11" fill="currentColor" opacity="0.7">a line cannot bend — it slices the broad class</text>

  <!-- BOTTOM RIGHT: unequal shapes, QDA conic wraps the tight class -->
  <circle cx="435" cy="315" r="20" fill="none" stroke="#4c8dd6" stroke-width="1.5" opacity="0.8"/>
  <ellipse cx="530" cy="280" rx="62" ry="34" transform="rotate(-15 530 280)" fill="none" stroke="#4c8dd6" stroke-width="1.5" opacity="0.8"/>
  <path d="M 400 240 C 470 250, 485 300, 460 345 C 445 368, 405 368, 385 352" fill="none" stroke="#e2903a" stroke-width="2"/>
  <text x="367" y="235" font-size="11" fill="currentColor" opacity="0.7">the conic wraps the tight class</text>

  <text x="70" y="393" font-size="12" fill="currentColor" opacity="0.55">left column: QDA's flexibility is pure variance. right column: LDA's stability is pure bias.</text>
</svg>

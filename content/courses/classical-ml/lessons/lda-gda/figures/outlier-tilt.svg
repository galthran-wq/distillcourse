<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="20" y="24" font-size="13" fill="currentColor"><tspan font-weight="bold">one outlier, correct side:</tspan> who moves?</text>

  <!-- clouds -->
  <g fill="none" stroke="currentColor" stroke-width="1.4" opacity="0.55">
    <ellipse cx="140" cy="185" rx="52" ry="30" transform="rotate(-15 140 185)"/>
    <ellipse cx="300" cy="120" rx="52" ry="30" transform="rotate(-15 300 120)"/>
  </g>
  <text x="96" y="238" font-size="11" fill="currentColor">class 0</text>
  <text x="286" y="80" font-size="11" fill="currentColor">class 1</text>

  <!-- the outlier -->
  <circle cx="565" cy="55" r="4.5" fill="#e2903a"/>
  <circle cx="565" cy="55" r="9" fill="none" stroke="#e2903a" stroke-width="1.2" opacity="0.6"/>
  <text x="410" y="40" font-size="11.5" fill="#e2903a">added far on class 1's own correct side</text>

  <!-- boundaries -->
  <line x1="238" y1="45" x2="192" y2="265" stroke="currentColor" stroke-width="1.6" stroke-dasharray="4 4" opacity="0.6"/>
  <text x="150" y="288" font-size="11" fill="currentColor" opacity="0.7">both fits, before</text>

  <line x1="276" y1="45" x2="178" y2="265" stroke="#e2903a" stroke-width="2"/>
  <text x="284" y="60" font-size="11.5" fill="#e2903a">LDA after: μ̂₁ and Σ̂ moved, the line tilts</text>

  <line x1="243" y1="45" x2="197" y2="265" stroke="#4c8dd6" stroke-width="2"/>
  <text x="256" y="210" font-size="11.5" fill="#4c8dd6">logistic after: (y − p)x ≈ 0, the line stays</text>
</svg>

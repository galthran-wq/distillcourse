<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="24" y="26" font-size="13" fill="currentColor"><tspan font-weight="bold">the covariance budget:</tspan> parameters of each generative classifier (2 classes)</text>

  <!-- left panel: d = 10 -->
  <text x="160" y="56" font-size="12.5" fill="currentColor" text-anchor="middle" font-weight="bold">d = 10</text>
  <line x1="50" y1="240" x2="280" y2="240" stroke="currentColor" opacity="0.5"/>
  <rect x="70" y="203" width="48" height="37" rx="3" fill="#5aa46a" opacity="0.85"/>
  <rect x="141" y="149" width="48" height="91" rx="3" fill="#e2903a" opacity="0.9"/>
  <rect x="212" y="83" width="48" height="157" rx="3" fill="#4c8dd6" opacity="0.85"/>
  <g font-size="11.5" fill="currentColor" text-anchor="middle">
    <text x="94" y="196">31</text>
    <text x="165" y="142">76</text>
    <text x="236" y="76">131</text>
    <text x="94" y="258">NB diag</text>
    <text x="165" y="258">LDA</text>
    <text x="236" y="258">QDA</text>
  </g>

  <!-- right panel: d = 100 -->
  <text x="480" y="56" font-size="12.5" fill="currentColor" text-anchor="middle" font-weight="bold">d = 100</text>
  <line x1="370" y1="240" x2="600" y2="240" stroke="currentColor" opacity="0.5"/>
  <rect x="390" y="235" width="48" height="5" rx="2" fill="#5aa46a" opacity="0.85"/>
  <rect x="461" y="159" width="48" height="81" rx="3" fill="#e2903a" opacity="0.9"/>
  <rect x="532" y="80" width="48" height="160" rx="3" fill="#4c8dd6" opacity="0.85"/>
  <g font-size="11.5" fill="currentColor" text-anchor="middle">
    <text x="414" y="228">301</text>
    <text x="485" y="152">5,251</text>
    <text x="556" y="73">10,301</text>
    <text x="414" y="258">NB diag</text>
    <text x="485" y="258">LDA</text>
    <text x="556" y="258">QDA</text>
  </g>

  <text x="24" y="286" font-size="12" fill="currentColor" opacity="0.55">one full covariance costs d(d+1)/2 — 5,050 numbers at d = 100 — and QDA buys it per class</text>
</svg>

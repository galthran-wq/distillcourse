<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <marker id="pc-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="currentColor" opacity="0.65"/>
    </marker>
  </defs>

  <text x="14" y="22" font-size="13" fill="currentColor"><tspan font-weight="bold">center each class on its own mean,</tspan> then average the scatters</text>

  <!-- class 0 scatter -->
  <g fill="currentColor">
    <circle cx="55" cy="138" r="3"/><circle cx="68" cy="130" r="3"/><circle cx="78" cy="136" r="3"/>
    <circle cx="85" cy="122" r="3"/><circle cx="95" cy="128" r="3"/><circle cx="100" cy="115" r="3"/>
    <circle cx="108" cy="124" r="3"/><circle cx="115" cy="110" r="3"/><circle cx="122" cy="118" r="3"/>
    <circle cx="130" cy="104" r="3"/><circle cx="138" cy="112" r="3"/><circle cx="146" cy="100" r="3"/>
    <circle cx="120" cy="132" r="3"/><circle cx="90" cy="142" r="3"/><circle cx="60" cy="125" r="3"/>
  </g>
  <ellipse cx="103" cy="121" rx="58" ry="26" transform="rotate(-20 103 121)" fill="none" stroke="#4c8dd6" stroke-width="1.6"/>
  <path d="M 98 121 h 10 M 103 116 v 10" stroke="currentColor" stroke-width="1.4"/>
  <text x="40" y="182" font-size="11.5" fill="currentColor">class 0, centered at μ̂₀</text>
  <text x="40" y="197" font-size="11.5" fill="#4c8dd6">scatter Σ̂₀, n₀ = 15</text>

  <!-- class 1 scatter -->
  <g fill="currentColor">
    <circle cx="295" cy="148" r="3"/><circle cx="312" cy="128" r="3"/><circle cx="322" cy="125" r="3"/>
    <circle cx="338" cy="102" r="3"/><circle cx="350" cy="95" r="3"/>
  </g>
  <ellipse cx="323" cy="120" rx="46" ry="20" transform="rotate(-40 323 120)" fill="none" stroke="#4c8dd6" stroke-width="1.6"/>
  <path d="M 318 120 h 10 M 323 115 v 10" stroke="currentColor" stroke-width="1.4"/>
  <text x="268" y="182" font-size="11.5" fill="currentColor">class 1, centered at μ̂₁</text>
  <text x="268" y="197" font-size="11.5" fill="#4c8dd6">scatter Σ̂₁, n₁ = 5</text>

  <!-- converging weighted arrows -->
  <path d="M 150 205 C 250 235, 380 235, 462 175" fill="none" stroke="currentColor" opacity="0.65" marker-end="url(#pc-arrow)"/>
  <text x="280" y="245" font-size="12" fill="currentColor">× ¾</text>
  <path d="M 372 200 C 420 215, 445 200, 470 165" fill="none" stroke="currentColor" opacity="0.65" marker-end="url(#pc-arrow)"/>
  <text x="428" y="222" font-size="12" fill="currentColor">× ¼</text>

  <!-- pooled -->
  <ellipse cx="540" cy="112" rx="58" ry="26" transform="rotate(-20 540 112)" fill="none" stroke="#4c8dd6" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.45"/>
  <ellipse cx="540" cy="112" rx="46" ry="20" transform="rotate(-40 540 112)" fill="none" stroke="#4c8dd6" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.45"/>
  <ellipse cx="540" cy="112" rx="55" ry="25" transform="rotate(-25 540 112)" fill="none" stroke="#e2903a" stroke-width="2.2"/>
  <text x="474" y="52" font-size="12" fill="#e2903a">pooled  Σ̂ = ¾ Σ̂₀ + ¼ Σ̂₁</text>
</svg>

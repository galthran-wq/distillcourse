<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 340" fill="currentColor" font-family="system-ui, sans-serif">
<rect x="20" y="34" width="580" height="266" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
<text x="30" y="24" font-size="12" opacity="0.55">all samples of size n, weighted by their probability under Dⁿ</text>
<ellipse cx="150" cy="120" rx="78" ry="40" transform="rotate(-15 150 120)" fill="#4c8dd6" opacity="0.22" stroke="#4c8dd6" stroke-width="1.5"/>
<text x="150" y="124" text-anchor="middle" font-size="12" fill="#4c8dd6">M(h₁)</text>
<ellipse cx="300" cy="105" rx="64" ry="34" transform="rotate(10 300 105)" fill="#4c8dd6" opacity="0.22" stroke="#4c8dd6" stroke-width="1.5"/>
<text x="300" y="109" text-anchor="middle" font-size="12" fill="#4c8dd6">M(h₂)</text>
<ellipse cx="420" cy="150" rx="80" ry="42" transform="rotate(-8 420 150)" fill="#4c8dd6" opacity="0.22" stroke="#4c8dd6" stroke-width="1.5"/>
<text x="420" y="154" text-anchor="middle" font-size="12" fill="#4c8dd6">M(h₃)</text>
<ellipse cx="215" cy="205" rx="66" ry="36" transform="rotate(12 215 205)" fill="#4c8dd6" opacity="0.22" stroke="#4c8dd6" stroke-width="1.5"/>
<text x="215" y="209" text-anchor="middle" font-size="12" fill="#4c8dd6">M(h₄)</text>
<ellipse cx="355" cy="225" rx="72" ry="34" transform="rotate(-18 355 225)" fill="#4c8dd6" opacity="0.22" stroke="#4c8dd6" stroke-width="1.5"/>
<text x="355" y="229" text-anchor="middle" font-size="12" fill="#4c8dd6">M(h₅)</text>
<text x="300" y="278" text-anchor="middle" font-size="12" fill="#4c8dd6">each oval: samples on which one bad hypothesis looks perfect — mass ≤ (1−ε)ⁿ</text>
<circle cx="510" cy="80" r="4" fill="#5aa46a"/>
<text x="505" y="66" text-anchor="end" font-size="12" fill="#5aa46a">S outside every oval → ERM is ε-good</text>
<text x="310" y="326" text-anchor="middle" font-size="12">union bound: total misleading mass ≤ (number of bad hypotheses) × (1−ε)ⁿ</text>
</svg>

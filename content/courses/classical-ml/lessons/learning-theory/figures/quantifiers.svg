<svg viewBox="0 0 620 180" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- box 1: the learner's commitment -->
  <rect x="16" y="40" width="180" height="88" rx="6" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <circle cx="30" cy="40" r="10" fill="#e2903a"/>
  <text x="30" y="44" font-size="12" fill="white" text-anchor="middle" font-weight="bold">1</text>
  <text x="48" y="62" font-size="12.5" fill="#e2903a" font-weight="bold">fixed first</text>
  <text x="30" y="84" font-size="12" fill="currentColor">the class H</text>
  <text x="30" y="100" font-size="12" fill="currentColor">the sample size n(ε, δ)</text>
  <text x="30" y="116" font-size="12" fill="currentColor">the learning algorithm</text>

  <line x1="198" y1="84" x2="222" y2="84" stroke="currentColor" stroke-width="1.5"/>
  <polygon points="228,84 219,80 219,88" fill="currentColor"/>

  <!-- box 2: the adversary -->
  <rect x="230" y="40" width="172" height="88" rx="6" fill="none" stroke="#4c8dd6" stroke-width="1.5"/>
  <circle cx="244" cy="40" r="10" fill="#4c8dd6"/>
  <text x="244" y="44" font-size="12" fill="white" text-anchor="middle" font-weight="bold">2</text>
  <text x="262" y="62" font-size="12.5" fill="#4c8dd6" font-weight="bold">then the adversary</text>
  <text x="244" y="84" font-size="12" fill="currentColor">picks any distribution D,</text>
  <text x="244" y="100" font-size="12" fill="currentColor">seeing H and n(ε, δ)</text>

  <line x1="404" y1="84" x2="428" y2="84" stroke="currentColor" stroke-width="1.5"/>
  <polygon points="434,84 425,80 425,88" fill="currentColor"/>

  <!-- box 3: the guarantee -->
  <rect x="436" y="40" width="170" height="88" rx="6" fill="none" stroke="#5aa46a" stroke-width="1.5"/>
  <circle cx="450" cy="40" r="10" fill="#5aa46a"/>
  <text x="450" y="44" font-size="12" fill="white" text-anchor="middle" font-weight="bold">3</text>
  <text x="468" y="62" font-size="12.5" fill="#5aa46a" font-weight="bold">must still hold</text>
  <text x="450" y="84" font-size="12" fill="currentColor">R(h) ≤ min R(h′) + ε</text>
  <text x="450" y="100" font-size="12" fill="currentColor">with prob. ≥ 1 − δ</text>

  <text x="310" y="160" font-size="12" fill="currentColor" text-anchor="middle" opacity="0.7">n(ε, δ) is chosen before D exists — one sample size defeats every distribution</text>
</svg>

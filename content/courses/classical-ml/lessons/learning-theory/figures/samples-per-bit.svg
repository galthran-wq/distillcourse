<svg viewBox="0 0 560 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- axes -->
  <line x1="60" y1="280" x2="532" y2="280" stroke="currentColor" stroke-width="1" opacity="0.7"/>
  <line x1="60" y1="280" x2="60" y2="36" stroke="currentColor" stroke-width="1" opacity="0.7"/>

  <!-- y ticks: n = 0, 500, 1000 -->
  <line x1="56" y1="280" x2="60" y2="280" stroke="currentColor"/>
  <line x1="56" y1="187.7" x2="60" y2="187.7" stroke="currentColor"/>
  <line x1="56" y1="95.4" x2="60" y2="95.4" stroke="currentColor"/>
  <text x="52" y="284" font-size="11" fill="currentColor" text-anchor="end" opacity="0.55">0</text>
  <text x="52" y="191.7" font-size="11" fill="currentColor" text-anchor="end" opacity="0.55">500</text>
  <text x="52" y="99.4" font-size="11" fill="currentColor" text-anchor="end" opacity="0.55">1,000</text>

  <!-- x ticks: bits = 0, 8, 16, 24.6 -->
  <line x1="60" y1="280" x2="60" y2="284" stroke="currentColor"/>
  <line x1="191.4" y1="280" x2="191.4" y2="284" stroke="currentColor"/>
  <line x1="322.9" y1="280" x2="322.9" y2="284" stroke="currentColor"/>
  <line x1="464.1" y1="280" x2="464.1" y2="284" stroke="currentColor"/>
  <text x="60" y="296" font-size="11" fill="currentColor" text-anchor="middle" opacity="0.55">0</text>
  <text x="191.4" y="296" font-size="11" fill="currentColor" text-anchor="middle" opacity="0.55">8</text>
  <text x="322.9" y="296" font-size="11" fill="currentColor" text-anchor="middle" opacity="0.55">16</text>
  <text x="464.1" y="296" font-size="11" fill="currentColor" text-anchor="middle" opacity="0.55">24.6</text>

  <!-- axis titles -->
  <text x="296" y="312" font-size="12" fill="currentColor" text-anchor="middle">description length log₂|H| (bits)</text>
  <text x="60" y="24" font-size="12" fill="currentColor" text-anchor="start">samples n at ε = 0.1, δ = 0.01</text>

  <!-- dashed guides at the two worked classes -->
  <line x1="322.9" y1="280" x2="322.9" y2="128.7" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5"/>
  <line x1="464.1" y1="280" x2="464.1" y2="73.7" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5"/>

  <!-- agnostic line: n = (b·ln2 + ln 200)/0.02, ≈35 samples per bit -->
  <line x1="60" y1="231.1" x2="520" y2="52.0" stroke="#e2903a" stroke-width="2"/>
  <!-- realizable line: n = (b·ln2 + ln 100)/0.1, ≈7 samples per bit -->
  <line x1="60" y1="271.5" x2="520" y2="235.7" stroke="#4c8dd6" stroke-width="2"/>

  <!-- legend -->
  <line x1="80" y1="48" x2="104" y2="48" stroke="#e2903a" stroke-width="2"/>
  <text x="110" y="52" font-size="12" fill="currentColor">agnostic: ≈35 samples per bit</text>
  <line x1="80" y1="66" x2="104" y2="66" stroke="#4c8dd6" stroke-width="2"/>
  <text x="110" y="70" font-size="12" fill="currentColor">realizable: ≈7 samples per bit</text>

  <!-- off-chart note -->
  <text x="84" y="104" font-size="11" fill="currentColor" opacity="0.55">1 KB programs (8,192 bits), same slopes:</text>
  <text x="84" y="120" font-size="11" fill="currentColor" opacity="0.55">n = 284,179 / 56,829</text>

  <!-- worked points: thresholds, 16 bits -->
  <circle cx="322.9" cy="128.7" r="4" fill="#e2903a"/>
  <circle cx="322.9" cy="251.0" r="4" fill="#4c8dd6"/>
  <text x="331" y="134" font-size="11" fill="currentColor" text-anchor="start">thresholds · 820</text>
  <text x="314" y="248" font-size="11" fill="currentColor" text-anchor="end">157</text>

  <!-- worked points: rectangles, 24.6 bits -->
  <circle cx="464.1" cy="73.7" r="4" fill="#e2903a"/>
  <circle cx="464.1" cy="240.0" r="4" fill="#4c8dd6"/>
  <text x="456" y="70" font-size="11" fill="currentColor" text-anchor="end">rectangles · 1,118</text>
  <text x="456" y="233" font-size="11" fill="currentColor" text-anchor="end">217</text>
</svg>

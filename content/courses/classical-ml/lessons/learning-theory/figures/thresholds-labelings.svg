<svg viewBox="0 0 620 270" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- theta candidate -->
  <text x="260" y="46" font-size="13" fill="#e2903a" text-anchor="middle">θ</text>
  <line x1="260" y1="52" x2="260" y2="150" stroke="#e2903a" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- number line -->
  <line x1="60" y1="96" x2="560" y2="96" stroke="currentColor" stroke-width="1" opacity="0.7"/>
  <polygon points="566,96 557,92 557,100" fill="currentColor" opacity="0.7"/>

  <!-- the five points -->
  <circle cx="110" cy="96" r="4" fill="currentColor"/>
  <circle cx="210" cy="96" r="4" fill="currentColor"/>
  <circle cx="310" cy="96" r="4" fill="currentColor"/>
  <circle cx="410" cy="96" r="4" fill="currentColor"/>
  <circle cx="510" cy="96" r="4" fill="currentColor"/>
  <text x="110" y="80" font-size="11" fill="currentColor" text-anchor="middle" opacity="0.55">x = 1</text>
  <text x="210" y="80" font-size="11" fill="currentColor" text-anchor="middle" opacity="0.55">2</text>
  <text x="310" y="80" font-size="11" fill="currentColor" text-anchor="middle" opacity="0.55">3</text>
  <text x="410" y="80" font-size="11" fill="currentColor" text-anchor="middle" opacity="0.55">4</text>
  <text x="510" y="80" font-size="11" fill="currentColor" text-anchor="middle" opacity="0.55">5</text>

  <!-- the six intervals the points cut theta's line into -->
  <rect x="60" y="104" width="46" height="8" rx="2" fill="currentColor" opacity="0.15"/>
  <rect x="114" y="104" width="92" height="8" rx="2" fill="currentColor" opacity="0.15"/>
  <rect x="214" y="104" width="92" height="8" rx="2" fill="#e2903a" opacity="0.6"/>
  <rect x="314" y="104" width="92" height="8" rx="2" fill="currentColor" opacity="0.15"/>
  <rect x="414" y="104" width="92" height="8" rx="2" fill="currentColor" opacity="0.15"/>
  <rect x="514" y="104" width="46" height="8" rx="2" fill="currentColor" opacity="0.15"/>
  <text x="310" y="132" font-size="11" fill="currentColor" text-anchor="middle" opacity="0.55">the 5 points cut the θ-line into 6 intervals; every θ inside one interval labels identically</text>
  <text x="310" y="147" font-size="11" fill="currentColor" text-anchor="middle" opacity="0.55">and crossing a point flips exactly one sign</text>

  <!-- the label vector this theta produces -->
  <text x="60" y="172" font-size="11" fill="currentColor" opacity="0.55">label vector at this θ:</text>
  <text x="110" y="194" font-size="16" fill="#4c8dd6" text-anchor="middle" font-weight="bold">−</text>
  <text x="210" y="194" font-size="16" fill="#4c8dd6" text-anchor="middle" font-weight="bold">−</text>
  <text x="310" y="194" font-size="16" fill="#e2903a" text-anchor="middle" font-weight="bold">+</text>
  <text x="410" y="194" font-size="16" fill="#e2903a" text-anchor="middle" font-weight="bold">+</text>
  <text x="510" y="194" font-size="16" fill="#e2903a" text-anchor="middle" font-weight="bold">+</text>

  <!-- the count -->
  <text x="60" y="228" font-size="12" fill="currentColor">hypotheses: one per real θ — uncountably many</text>
  <text x="60" y="252" font-size="12" fill="currentColor">distinct label vectors on these 5 points: <tspan fill="#e2903a" font-weight="bold">6</tspan> of 2⁵ = 32 conceivable</text>
</svg>

<svg viewBox="0 0 620 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- legend -->
  <circle cx="180" cy="18" r="4" fill="#4c8dd6"/>
  <text x="189" y="22" font-size="12" fill="currentColor">R(h) true risk</text>
  <circle cx="320" cy="18" r="4" fill="#e2903a"/>
  <text x="329" y="22" font-size="12" fill="currentColor">R̂(h) on this sample</text>

  <!-- panel titles -->
  <text x="160" y="48" font-size="12.5" fill="currentColor" text-anchor="middle" font-weight="bold">an ε-representative sample</text>
  <text x="460" y="48" font-size="12.5" fill="currentColor" text-anchor="middle" font-weight="bold">a misleading sample</text>

  <!-- left panel: bands (±ε around true risk) -->
  <rect x="54" y="62" width="16" height="76" rx="3" fill="currentColor" opacity="0.12"/>
  <rect x="92" y="118" width="16" height="76" rx="3" fill="currentColor" opacity="0.12"/>
  <rect x="130" y="42" width="16" height="76" rx="3" fill="currentColor" opacity="0.12"/>
  <rect x="168" y="88" width="16" height="76" rx="3" fill="currentColor" opacity="0.12"/>
  <rect x="206" y="137" width="16" height="76" rx="3" fill="currentColor" opacity="0.12"/>
  <rect x="244" y="72" width="16" height="76" rx="3" fill="currentColor" opacity="0.12"/>

  <!-- epsilon bracket at h1 -->
  <line x1="44" y1="100" x2="44" y2="138" stroke="currentColor" stroke-width="1" opacity="0.7"/>
  <line x1="41" y1="100" x2="47" y2="100" stroke="currentColor" stroke-width="1" opacity="0.7"/>
  <line x1="41" y1="138" x2="47" y2="138" stroke="currentColor" stroke-width="1" opacity="0.7"/>
  <text x="36" y="123" font-size="12" fill="currentColor" text-anchor="end">ε</text>

  <!-- left panel: true (blue) and empirical (amber) risks -->
  <circle cx="62" cy="100" r="4" fill="#4c8dd6"/><circle cx="62" cy="84" r="4" fill="#e2903a"/>
  <circle cx="100" cy="156" r="4" fill="#4c8dd6"/><circle cx="100" cy="171" r="4" fill="#e2903a"/>
  <circle cx="138" cy="80" r="4" fill="#4c8dd6"/><circle cx="138" cy="69" r="4" fill="#e2903a"/>
  <circle cx="176" cy="126" r="4" fill="#4c8dd6"/><circle cx="176" cy="145" r="4" fill="#e2903a"/>
  <circle cx="214" cy="175" r="4" fill="#4c8dd6"/><circle cx="214" cy="160" r="4" fill="#e2903a"/>
  <circle cx="252" cy="110" r="4" fill="#4c8dd6"/><circle cx="252" cy="118" r="4" fill="#e2903a"/>

  <!-- left panel: hypothesis labels -->
  <text x="62" y="232" font-size="11" fill="currentColor" text-anchor="middle" opacity="0.55">h₁</text>
  <text x="100" y="232" font-size="11" fill="currentColor" text-anchor="middle" opacity="0.55">h₂</text>
  <text x="138" y="232" font-size="11" fill="currentColor" text-anchor="middle" opacity="0.55">h₃</text>
  <text x="176" y="232" font-size="11" fill="currentColor" text-anchor="middle" opacity="0.55">h₄</text>
  <text x="214" y="232" font-size="11" fill="currentColor" text-anchor="middle" opacity="0.55">h₅</text>
  <text x="252" y="232" font-size="11" fill="currentColor" text-anchor="middle" opacity="0.55">h₆</text>
  <text x="160" y="262" font-size="12" fill="currentColor" text-anchor="middle">every gap ≤ ε — no selection can be misled</text>

  <!-- right panel: same class, another sample; bands identical -->
  <rect x="354" y="62" width="16" height="76" rx="3" fill="currentColor" opacity="0.12"/>
  <rect x="392" y="118" width="16" height="76" rx="3" fill="currentColor" opacity="0.12"/>
  <rect x="430" y="42" width="16" height="76" rx="3" fill="currentColor" opacity="0.12"/>
  <rect x="468" y="88" width="16" height="76" rx="3" fill="currentColor" opacity="0.12"/>
  <rect x="506" y="137" width="16" height="76" rx="3" fill="currentColor" opacity="0.12"/>
  <rect x="544" y="72" width="16" height="76" rx="3" fill="currentColor" opacity="0.12"/>

  <circle cx="362" cy="100" r="4" fill="#4c8dd6"/><circle cx="362" cy="106" r="4" fill="#e2903a"/>
  <circle cx="400" cy="156" r="4" fill="#4c8dd6"/><circle cx="400" cy="162" r="4" fill="#e2903a"/>
  <circle cx="438" cy="80" r="4" fill="#4c8dd6"/><circle cx="438" cy="185" r="4" fill="#e2903a"/>
  <circle cx="476" cy="126" r="4" fill="#4c8dd6"/><circle cx="476" cy="132" r="4" fill="#e2903a"/>
  <circle cx="514" cy="175" r="4" fill="#4c8dd6"/><circle cx="514" cy="158" r="4" fill="#e2903a"/>
  <circle cx="552" cy="110" r="4" fill="#4c8dd6"/><circle cx="552" cy="104" r="4" fill="#e2903a"/>

  <text x="362" y="232" font-size="11" fill="currentColor" text-anchor="middle" opacity="0.55">h₁</text>
  <text x="400" y="232" font-size="11" fill="currentColor" text-anchor="middle" opacity="0.55">h₂</text>
  <text x="438" y="232" font-size="11" fill="currentColor" text-anchor="middle" opacity="0.55">h₃</text>
  <text x="476" y="232" font-size="11" fill="currentColor" text-anchor="middle" opacity="0.55">h₄</text>
  <text x="514" y="232" font-size="11" fill="currentColor" text-anchor="middle" opacity="0.55">h₅</text>
  <text x="552" y="232" font-size="11" fill="currentColor" text-anchor="middle" opacity="0.55">h₆</text>

  <!-- escape annotation -->
  <line x1="452" y1="250" x2="441" y2="192" stroke="currentColor" stroke-width="1" opacity="0.6"/>
  <polygon points="440,188 437,197 445,196" fill="currentColor" opacity="0.6"/>
  <text x="460" y="262" font-size="12" fill="currentColor" text-anchor="middle">h₃ escaped its band and looks best — ERM returns it</text>
</svg>

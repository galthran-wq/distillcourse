<svg viewBox="0 0 620 270" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- row 1: a threshold rule -->
  <line x1="24" y1="58" x2="136" y2="58" stroke="currentColor" stroke-width="1" opacity="0.7"/>
  <circle cx="86" cy="58" r="4" fill="#e2903a"/>
  <text x="50" y="50" font-size="12" fill="currentColor" opacity="0.7" text-anchor="middle">−</text>
  <text x="116" y="50" font-size="12" fill="currentColor" opacity="0.7" text-anchor="middle">+</text>
  <text x="152" y="52" font-size="12.5" fill="currentColor">thresholds sign(x − θ)</text>
  <text x="152" y="68" font-size="11" fill="currentColor" opacity="0.55">one 16-bit parameter</text>
  <rect x="344" y="38" width="100" height="36" rx="5" fill="none" stroke="#4c8dd6" stroke-width="1.5"/>
  <text x="394" y="60" font-size="13" fill="#4c8dd6" text-anchor="middle" font-weight="bold">16 bits</text>

  <!-- row 2: an axis-aligned rectangle -->
  <rect x="30" y="106" width="106" height="58" rx="4" fill="none" stroke="currentColor" opacity="0.6"/>
  <rect x="58" y="120" width="44" height="30" rx="3" fill="none" stroke="#e2903a" stroke-width="1.8"/>
  <circle cx="72" cy="131" r="3" fill="currentColor"/>
  <circle cx="90" cy="142" r="3" fill="currentColor"/>
  <circle cx="44" cy="155" r="3" fill="currentColor" opacity="0.55"/>
  <text x="152" y="130" font-size="12.5" fill="currentColor">axis-aligned rectangles</text>
  <text x="152" y="146" font-size="11" fill="currentColor" opacity="0.55">four corners on a 100-grid</text>
  <rect x="344" y="118" width="100" height="36" rx="5" fill="none" stroke="#4c8dd6" stroke-width="1.5"/>
  <text x="394" y="140" font-size="13" fill="#4c8dd6" text-anchor="middle" font-weight="bold">24.6 bits</text>

  <!-- row 3: arbitrary code -->
  <rect x="30" y="190" width="106" height="54" rx="5" fill="none" stroke="currentColor" opacity="0.6"/>
  <rect x="40" y="200" width="60" height="4" rx="2" fill="#e2903a" opacity="0.8"/>
  <rect x="40" y="210" width="80" height="4" rx="2" fill="currentColor" opacity="0.45"/>
  <rect x="40" y="220" width="48" height="4" rx="2" fill="currentColor" opacity="0.45"/>
  <rect x="40" y="230" width="70" height="4" rx="2" fill="currentColor" opacity="0.45"/>
  <text x="152" y="210" font-size="12.5" fill="currentColor">every program of ≤ 1 kilobyte</text>
  <text x="152" y="226" font-size="11" fill="currentColor" opacity="0.55">trees, digit classifiers, anything</text>
  <rect x="344" y="198" width="100" height="36" rx="5" fill="none" stroke="#4c8dd6" stroke-width="1.5"/>
  <text x="394" y="220" font-size="13" fill="#4c8dd6" text-anchor="middle" font-weight="bold">8,192 bits</text>

  <!-- convergence into the one formula -->
  <line x1="446" y1="56" x2="472" y2="116" stroke="currentColor" stroke-width="1" opacity="0.6"/>
  <polygon points="474,121 465,118 472,112" fill="currentColor" opacity="0.6"/>
  <line x1="446" y1="136" x2="472" y2="136" stroke="currentColor" stroke-width="1" opacity="0.6"/>
  <polygon points="476,136 468,132 468,140" fill="currentColor" opacity="0.6"/>
  <line x1="446" y1="216" x2="472" y2="156" stroke="currentColor" stroke-width="1" opacity="0.6"/>
  <polygon points="474,151 472,160 465,154" fill="currentColor" opacity="0.6"/>

  <rect x="478" y="88" width="130" height="96" rx="6" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="543" y="116" font-size="13" fill="currentColor" text-anchor="middle" font-weight="bold">n(ε, δ)</text>
  <text x="543" y="136" font-size="11" fill="currentColor" text-anchor="middle" opacity="0.55">reads only</text>
  <text x="543" y="158" font-size="12.5" fill="#e2903a" text-anchor="middle">ln|H| = bits · ln 2</text>
  <text x="543" y="204" font-size="11" fill="currentColor" text-anchor="middle" opacity="0.55">what a hypothesis computes</text>
  <text x="543" y="219" font-size="11" fill="currentColor" text-anchor="middle" opacity="0.55">never enters</text>
</svg>

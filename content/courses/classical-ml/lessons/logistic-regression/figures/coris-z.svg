<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 285" font-family="system-ui, sans-serif">
<text x="60" y="20" font-size="12" fill="currentColor">Z scores of the seven CORIS predictors, joint fit</text>
<!-- guides: Z = 0 and the significance band -->
<line x1="230" y1="38" x2="230" y2="248" stroke="currentColor" opacity="0.3"/>
<line x1="120" y1="38" x2="120" y2="248" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5"/>
<line x1="340" y1="38" x2="340" y2="248" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5"/>
<text x="120" y="34" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">Z = &#8722;2</text>
<text x="230" y="34" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">0</text>
<text x="340" y="34" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">Z = +2</text>
<!-- rows: bar per predictor, 55 px per Z unit -->
<text x="115" y="64" font-size="12" fill="#e2903a" text-anchor="end">sbp</text>
<rect x="230" y="55" width="56.3" height="10" rx="2" fill="#e2903a"/>
<text x="292" y="64" font-size="11" fill="currentColor" opacity="0.55">1.02</text>
<text x="115" y="92" font-size="12" fill="currentColor" text-anchor="end">tobacco</text>
<rect x="230" y="83" width="166.9" height="10" rx="2" fill="#4c8dd6"/>
<text x="403" y="92" font-size="11" fill="currentColor" opacity="0.55">3.03</text>
<text x="115" y="120" font-size="12" fill="currentColor" text-anchor="end">ldl</text>
<rect x="230" y="111" width="177.0" height="10" rx="2" fill="#4c8dd6"/>
<text x="413" y="120" font-size="11" fill="currentColor" opacity="0.55">3.22</text>
<text x="115" y="148" font-size="12" fill="currentColor" text-anchor="end">famhist</text>
<rect x="230" y="139" width="229.8" height="10" rx="2" fill="#4c8dd6"/>
<text x="466" y="148" font-size="11" fill="currentColor" opacity="0.55">4.18</text>
<text x="115" y="176" font-size="12" fill="#e2903a" text-anchor="end">obesity</text>
<rect x="164.7" y="167" width="65.3" height="10" rx="2" fill="#e2903a"/>
<text x="159" y="176" font-size="11" fill="currentColor" opacity="0.55" text-anchor="end">&#8722;1.19</text>
<text x="115" y="204" font-size="12" fill="currentColor" text-anchor="end">alcohol</text>
<rect x="230" y="195" width="7.5" height="10" rx="2" fill="#4c8dd6"/>
<text x="244" y="204" font-size="11" fill="currentColor" opacity="0.55">0.14</text>
<text x="115" y="232" font-size="12" fill="currentColor" text-anchor="end">age</text>
<rect x="230" y="223" width="230.1" height="10" rx="2" fill="#4c8dd6"/>
<text x="466" y="232" font-size="11" fill="currentColor" opacity="0.55">4.18</text>
<text x="60" y="272" font-size="11" fill="#e2903a">amber: established risk factors that fail |Z| &#8805; 2 in the joint fit &#8212; obesity with the wrong sign</text>
</svg>

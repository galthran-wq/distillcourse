<circle cx="410" cy="115" r="4" fill="#4c8dd6"/>
<circle cx="445" cy="140" r="4" fill="#4c8dd6"/>
<circle cx="390" cy="140" r="4" fill="#4c8dd6"/>
<circle cx="430" cy="170" r="4" fill="#4c8dd6"/>

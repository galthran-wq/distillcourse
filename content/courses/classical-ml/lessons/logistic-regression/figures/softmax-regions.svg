<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="system-ui, sans-serif">
<text x="60" y="18" font-size="12" fill="currentColor">three classes, three pairwise boundaries, one shared point</text>
<rect x="60" y="30" width="480" height="245" rx="6" fill="none" stroke="currentColor" opacity="0.35"/>
<!-- three pairwise boundaries meeting where all probabilities tie -->
<line x1="300" y1="150" x2="300" y2="42" stroke="currentColor" stroke-width="1.8" opacity="0.8"/>
<line x1="300" y1="150" x2="148" y2="268" stroke="currentColor" stroke-width="1.8" opacity="0.8"/>
<line x1="300" y1="150" x2="452" y2="268" stroke="currentColor" stroke-width="1.8" opacity="0.8"/>
<circle cx="300" cy="150" r="3.5" fill="currentColor"/>
<text x="310" y="146" font-size="11" fill="currentColor" opacity="0.55">p = (&#8531;, &#8531;, &#8531;)</text>
<!-- boundary labels -->
<text x="308" y="52" font-size="11" fill="currentColor" opacity="0.55">(&#946;&#8321;&#8722;&#946;&#8322;)&#7488;x = 0</text>
<text x="66" y="262" font-size="11" fill="currentColor" opacity="0.55">(&#946;&#8321;&#8722;&#946;&#8323;)&#7488;x = 0</text>
<text x="446" y="262" font-size="11" fill="currentColor" opacity="0.55" text-anchor="end">(&#946;&#8322;&#8722;&#946;&#8323;)&#7488;x = 0</text>
<!-- region labels and sample points -->
<text x="165" y="95" font-size="13" font-weight="bold" fill="#e2903a">&#375; = 1</text>
<circle cx="150" cy="115" r="4" fill="#e2903a"/>

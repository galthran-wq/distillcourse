<!-- three boundaries through the same gap -->
<line x1="205" y1="55" x2="307" y2="259" stroke="#e2903a" stroke-width="2.2"/>
<line x1="95" y1="67" x2="415" y2="243" stroke="#4c8dd6" stroke-width="2"/>
<line x1="175" y1="51" x2="335" y2="259" stroke="#5aa46a" stroke-width="2"/>

<!-- legend -->
<text x="497" y="94" font-size="12" fill="#e2903a" font-weight="bold">1&#160; model p(y=1|x)</text>
<text x="497" y="110" font-size="11" fill="currentColor" opacity="0.55">this lesson</text>
<text x="497" y="150" font-size="12" fill="#4c8dd6">2&#160; model p(x|y)</text>
<text x="497" y="166" font-size="11" fill="currentColor" opacity="0.55">model each class</text>
<text x="497" y="206" font-size="12" fill="#5aa46a">3&#160; maximize margin</text>
<text x="497" y="222" font-size="11" fill="currentColor" opacity="0.55">widest gap</text>

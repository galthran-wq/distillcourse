<circle cx="160.2" cy="188.9" r="4" fill="none" stroke="currentColor" stroke-width="1.6" opacity="0.75"/>
<circle cx="189.7" cy="214.3" r="4" fill="none" stroke="currentColor" stroke-width="1.6" opacity="0.75"/>
<circle cx="178.2" cy="180.8" r="4" fill="none" stroke="currentColor" stroke-width="1.6" opacity="0.75"/>
<circle cx="174.1" cy="223.1" r="4" fill="none" stroke="currentColor" stroke-width="1.6" opacity="0.75"/>

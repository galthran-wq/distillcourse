<circle cx="119.7" cy="198.9" r="4" fill="none" stroke="currentColor" stroke-width="1.6" opacity="0.75"/>
<!-- class 1: filled dots -->
<circle cx="307.0" cy="112.1" r="4" fill="currentColor" opacity="0.75"/>
<circle cx="349.7" cy="100.1" r="4" fill="currentColor" opacity="0.75"/>
<circle cx="269.5" cy="91.0" r="4" fill="currentColor" opacity="0.75"/>
<circle cx="343.5" cy="107.9" r="4" fill="currentColor" opacity="0.75"/>
<circle cx="299.1" cy="92.6" r="4" fill="currentColor" opacity="0.75"/>
<circle cx="315.6" cy="84.0" r="4" fill="currentColor" opacity="0.75"/>
<circle cx="376.8" cy="84.0" r="4" fill="currentColor" opacity="0.75"/>
<circle cx="344.0" cy="128.0" r="4" fill="currentColor" opacity="0.75"/>

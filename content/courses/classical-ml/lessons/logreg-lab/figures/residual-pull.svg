<svg viewBox="0 0 560 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="14">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .axis { stroke: currentColor; opacity: 0.35; }
  </style>

  <!-- p = 0 baseline and p = 1 guide -->
  <line class="axis" x1="40" y1="250" x2="520" y2="250"/>
  <line class="axis" x1="40" y1="50" x2="520" y2="50" stroke-dasharray="3 3"/>
  <text class="muted" x="32" y="254" text-anchor="end">0</text>
  <text class="muted" x="32" y="54" text-anchor="end">1</text>
  <text class="muted" x="532" y="254">z</text>

  <!-- sigmoid -->
  <polyline fill="none" stroke="#e2903a" stroke-width="3" stroke-linejoin="round"
    points="40,249.5 80,248.7 120,246.4 160,240.5 180,234.8 200,226.2 220,213.5 230,205.5 240,196.2 250,185.8 260,174.5 270,162.4 280,150 290,137.6 300,125.5 310,114.2 320,103.8 330,94.5 340,86.5 360,73.8 380,65.2 400,59.5 440,53.6 480,51.3 520,50.5"/>
  <text x="170" y="212" text-anchor="middle" fill="#e2903a">σ(z)</text>

  <!-- data points: labels y sit on the 0/1 lines -->
  <circle cx="120" cy="250" r="4" fill="currentColor"/>
  <circle cx="340" cy="250" r="4" fill="currentColor"/>
  <circle cx="240" cy="50" r="4" fill="currentColor"/>
  <circle cx="440" cy="50" r="4" fill="currentColor"/>
  <text class="muted" x="240" y="34" text-anchor="middle">y = 1</text>
  <text class="muted" x="340" y="272" text-anchor="middle">y = 0</text>

  <!-- residual pulls: from the label y to the model's p -->
  <line x1="240" y1="58" x2="240" y2="186" stroke="#4c8dd6" stroke-width="2.5"/>
  <polygon points="240,196 235,185 245,185" fill="#4c8dd6"/>
  <line x1="340" y1="242" x2="340" y2="97" stroke="#4c8dd6" stroke-width="2.5"/>
  <polygon points="340,87 335,98 345,98" fill="#4c8dd6"/>
  <text x="352" y="170" fill="#4c8dd6">p − y</text>

  <!-- confident-correct examples barely pull -->
  <text class="muted" x="120" y="272" text-anchor="middle">pull ≈ 0</text>
  <text class="muted" x="440" y="76" text-anchor="middle">pull ≈ 0</text>

  <text class="muted" x="280" y="308" text-anchor="middle">gradient = mean (p − y)·x — the wrong examples pull hardest</text>
</svg>

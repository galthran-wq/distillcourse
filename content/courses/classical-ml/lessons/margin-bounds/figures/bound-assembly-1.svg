  <text x="180" y="226" text-anchor="middle" font-size="13" fill="#4c8dd6">R̂ₛ(norm ball) ≤ rΛ/√n = Λ√Tr[K]/n</text>
  <text class="small" x="180" y="243" text-anchor="middle">no dimension anywhere (Mohri Thms. 5.10, 6.12)</text>
  <rect x="352" y="206" width="256" height="44" rx="5" fill="currentColor" opacity="0.05"/>
  <text class="small" x="480" y="226" text-anchor="middle">contraction: composing with a c-Lipschitz</text>

<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; font-size: 13px; }
    .small { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .slot  { stroke: currentColor; stroke-opacity: 0.35; stroke-width: 1.2; stroke-dasharray: 5 4; fill: none; }
  </style>
  <text class="label" x="24" y="28" font-weight="bold">2 — contraction scales the brick by 1/ρ</text>

  <text class="label" x="30" y="124" font-size="15">R(h) ≤</text>
  <rect class="slot" x="96" y="98" width="130" height="40" rx="5"/>
  <text class="small" x="161" y="122" text-anchor="middle">loss term</text>
  <text class="label" x="238" y="124">+</text>
  <!-- filled capacity slot -->
  <rect x="256" y="98" width="170" height="40" rx="5" fill="#e2903a" opacity="0.12"/>
  <rect x="256" y="98" width="170" height="40" rx="5" fill="none" stroke="#e2903a" stroke-width="1.8"/>
  <text x="341" y="123" text-anchor="middle" font-size="14" fill="#e2903a">2 · (1/ρ) · rΛ/√n</text>
  <text class="label" x="438" y="124">+</text>
  <rect class="slot" x="456" y="98" width="150" height="40" rx="5"/>
  <text class="small" x="531" y="122" text-anchor="middle">concentration</text>

  <!-- the move -->
  <path d="M 180 206 C 220 176, 280 156, 330 142" fill="none" stroke="#e2903a" stroke-width="1.6" stroke-dasharray="4 3"/>
  <text class="small" x="30" y="196">the brick, wrapped: Φρ is 1/ρ-Lipschitz, so the ramp-composed</text>
  <text class="small" x="30" y="211">class costs at most 1/ρ times the ball’s complexity;</text>
  <text class="small" x="30" y="226">the labels vanish because σᵢyᵢ is distributed as σᵢ</text>
  <rect x="352" y="206" width="256" height="44" rx="5" fill="currentColor" opacity="0.05"/>
  <text class="small" x="480" y="226" text-anchor="middle">steeper demand (smaller ρ)</text>
  <text class="small" x="480" y="241" text-anchor="middle">= bigger capacity charge</text>
</svg>

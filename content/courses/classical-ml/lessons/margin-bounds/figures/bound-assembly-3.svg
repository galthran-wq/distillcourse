<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; font-size: 13px; }
    .small { fill: currentColor; opacity: 0.55; font-size: 11px; }
  </style>
  <text class="label" x="24" y="28" font-weight="bold">3 — the inequality completes (Mohri Cor. 5.11 / 6.13)</text>

  <text class="label" x="30" y="124" font-size="15">R(h) ≤</text>
  <!-- loss slot filled -->
  <rect x="96" y="98" width="130" height="40" rx="5" fill="currentColor" opacity="0.06"/>
  <rect x="96" y="98" width="130" height="40" rx="5" fill="none" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.4"/>
  <text x="161" y="123" text-anchor="middle" font-size="14" fill="currentColor">R̂ₛ,ρ(h)</text>
  <text class="label" x="238" y="124">+</text>
  <rect x="256" y="98" width="170" height="40" rx="5" fill="#e2903a" opacity="0.12"/>
  <rect x="256" y="98" width="170" height="40" rx="5" fill="none" stroke="#e2903a" stroke-width="1.8"/>
  <text x="341" y="123" text-anchor="middle" font-size="14" fill="#e2903a">2 · (1/ρ) · rΛ/√n</text>
  <text class="label" x="438" y="124">+</text>
  <rect x="456" y="98" width="150" height="40" rx="5" fill="currentColor" opacity="0.06"/>
  <rect x="456" y="98" width="150" height="40" rx="5" fill="none" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.4"/>
  <text x="531" y="123" text-anchor="middle" font-size="13" fill="currentColor">3√(ln(2/δ)/2n)</text>

  <text class="small" x="96" y="160">ramp loss at level ρ:</text>
  <text class="small" x="96" y="175">errors and low-confidence hits</text>
  <text class="small" x="456" y="160">empirical-capacity variant</text>
  <text class="small" x="456" y="175">(Λ is measured on the sample)</text>

  <rect x="30" y="206" width="578" height="44" rx="5" fill="currentColor" opacity="0.05"/>
  <text class="small" x="319" y="226" text-anchor="middle">uniform over all h in the ball — the selection charge is inside; ρ fixed in advance</text>
  <text class="small" x="319" y="241" text-anchor="middle">(uniform over ρ costs one extra √(log log₂(2r/ρ)/n) term — Thm. 5.9)</text>
</svg>

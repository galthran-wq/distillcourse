<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; font-size: 13px; }
    .small { fill: currentColor; opacity: 0.55; font-size: 11px; }
  </style>
  <text class="label" x="24" y="28" font-weight="bold">4 — evaluated: RBF-SVM on ring data, n = 2000, δ = 0.05</text>

  <text class="label" x="30" y="124" font-size="15">R(h) ≤</text>
  <rect x="96" y="98" width="130" height="40" rx="5" fill="currentColor" opacity="0.06"/>
  <rect x="96" y="98" width="130" height="40" rx="5" fill="none" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.4"/>
  <text x="161" y="123" text-anchor="middle" font-size="15" fill="currentColor">0.000</text>
  <text class="label" x="238" y="124">+</text>
  <rect x="256" y="98" width="170" height="40" rx="5" fill="#e2903a" opacity="0.12"/>
  <rect x="256" y="98" width="170" height="40" rx="5" fill="none" stroke="#e2903a" stroke-width="1.8"/>
  <text x="341" y="123" text-anchor="middle" font-size="15" fill="#e2903a">0.26</text>
  <text class="label" x="438" y="124">+</text>
  <rect x="456" y="98" width="150" height="40" rx="5" fill="currentColor" opacity="0.06"/>
  <rect x="456" y="98" width="150" height="40" rx="5" fill="none" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.4"/>
  <text x="531" y="123" text-anchor="middle" font-size="15" fill="currentColor">0.09</text>

  <text class="small" x="96" y="160">no training margin below ρ = 1</text>
  <text class="small" x="266" y="160">2 · 5.8/√2000, from measured</text>
  <text class="small" x="266" y="175">Λ = 5.8, r = 1 (kernel diagonal)</text>
  <text class="small" x="466" y="160">3√(ln 40/4000)</text>

  <rect x="30" y="200" width="360" height="52" rx="5" fill="#5aa46a" opacity="0.10"/>
  <rect x="30" y="200" width="360" height="52" rx="5" fill="none" stroke="#5aa46a" stroke-width="1.6"/>
  <text x="210" y="222" text-anchor="middle" font-size="14" fill="#5aa46a" font-weight="bold">R(h) ≤ 0.35 — a number, at last</text>
  <text class="small" x="210" y="241" text-anchor="middle">measured test error 0.000: loose, but finite and shrinking in n</text>
  <rect x="410" y="200" width="198" height="52" rx="5" fill="currentColor" opacity="0.05"/>
  <text class="small" x="509" y="222" text-anchor="middle">the VC bound on the same</text>
  <text class="small" x="509" y="238" text-anchor="middle">machine: ∞ at every n</text>
</svg>

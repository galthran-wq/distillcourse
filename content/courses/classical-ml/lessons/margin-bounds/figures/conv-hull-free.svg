<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; font-size: 12px; }
    .small { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .level { stroke: currentColor; stroke-opacity: 0.3; stroke-width: 1; stroke-dasharray: 4 3; }
  </style>

  <!-- LEFT: hull picture in the space of value vectors on the sample -->
  <text class="label" x="24" y="24" font-weight="bold">value vectors (g(x₁), …, g(xₙ)) of the class</text>
  <!-- hull -->
  <polygon points="90,110 190,60 300,110 240,200 120,190" fill="#e2903a" opacity="0.08"/>
  <polygon points="90,110 190,60 300,110 240,200 120,190" fill="none" stroke="#e2903a" stroke-width="1.4" stroke-opacity="0.7"/>
  <text class="small" x="168" y="140">conv(H)</text>
  <!-- vertices: base hypotheses -->
  <circle cx="90" cy="110" r="5" fill="#e2903a"/>
  <circle cx="190" cy="60" r="5" fill="#e2903a"/>
  <circle cx="300" cy="110" r="5" fill="#e2903a"/>
  <circle cx="240" cy="200" r="5" fill="#e2903a"/>
  <circle cx="120" cy="190" r="5" fill="#e2903a"/>
  <text class="small" x="70" y="98">h₁</text>
  <text class="small" x="184" y="48">h₂</text>
  <text class="small" x="308" y="104">h₃</text>
  <text class="small" x="248" y="214">h₄</text>
  <text class="small" x="98" y="206">h₅</text>
  <!-- noise direction sigma and level lines of the linear functional -->
  <line x1="60" y1="250" x2="118" y2="216" stroke="#4c8dd6" stroke-width="2"/>
  <polygon points="118,216 106,218 112,228" fill="#4c8dd6"/>
  <text x="46" y="266" font-size="12" fill="#4c8dd6">σ (one noise draw)</text>
  <line class="level" x1="96" y1="30" x2="36" y2="132" stroke="#4c8dd6"/>
  <line class="level" x1="176" y1="24" x2="86" y2="178" stroke="#4c8dd6"/>
  <line class="level" x1="256" y1="18" x2="146" y2="206" stroke="#4c8dd6"/>
  <!-- maximizing vertex ringed -->
  <circle cx="190" cy="60" r="10" fill="none" stroke="#5aa46a" stroke-width="2"/>
  <text x="204" y="66" font-size="11" fill="#5aa46a">σ·g maximal at a vertex</text>

  <!-- RIGHT: the equality and its consequence -->
  <rect x="370" y="60" width="244" height="52" rx="6" fill="currentColor" opacity="0.06"/>
  <rect x="370" y="60" width="244" height="52" rx="6" fill="none" stroke="currentColor" stroke-opacity="0.45"/>
  <text class="label" x="492" y="83" text-anchor="middle" font-weight="bold">R̂ₛ(conv(H)) = R̂ₛ(H)</text>
  <text class="small" x="492" y="101" text-anchor="middle">σ·g is linear in g: no mixture beats the best vertex</text>

  <rect x="370" y="140" width="244" height="66" rx="6" fill="none" stroke="#5aa46a" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="492" y="165" text-anchor="middle" font-size="13" fill="#5aa46a" font-weight="bold">capacity charged for H once</text>
  <text x="492" y="184" text-anchor="middle" font-size="12" fill="#5aa46a">the round count T never enters</text>
  <text class="small" x="370" y="238">expressiveness grows with mixing;</text>
  <text class="small" x="370" y="253">noise-chasing ability does not</text>
</svg>

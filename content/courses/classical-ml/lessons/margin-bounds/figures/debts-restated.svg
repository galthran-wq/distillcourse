<svg viewBox="0 0 640 310" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; font-size: 12px; }
    .small { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .axis  { stroke: currentColor; stroke-opacity: 0.4; stroke-width: 1.1; fill: none; }
    .curve { stroke-width: 2; fill: none; }
    .bridge { stroke: currentColor; stroke-opacity: 0.45; stroke-width: 1.2; fill: none; }
  </style>

  <!-- left panel: debt 1 (kernel SVM) -->
  <text class="label" x="24" y="22" font-weight="bold">debt 1 — the kernel machine (module 4)</text>
  <line class="axis" x1="40" y1="180" x2="220" y2="180"/>
  <line class="axis" x1="40" y1="180" x2="40" y2="42"/>
  <text class="small" x="46" y="52">error</text>
  <text class="small" x="60" y="196">flexibility</text>
  <!-- axis break to infinity -->
  <line class="axis" x1="226" y1="180" x2="233" y2="173"/>
  <line class="axis" x1="232" y1="180" x2="239" y2="173"/>
  <line class="axis" x1="241" y1="180" x2="268" y2="180"/>
  <text class="label" x="272" y="184">∞</text>
  <!-- test U-curve and train curve -->
  <path class="curve" stroke="#e2903a" d="M 46 76 C 90 130, 130 148, 160 144 C 190 140, 208 110, 218 84"/>
  <path class="curve" stroke="#4c8dd6" d="M 46 84 C 100 150, 160 168, 218 174"/>
  <text x="150" y="120" font-size="11" fill="#e2903a">test</text>
  <text x="110" y="168" font-size="11" fill="#4c8dd6">train</text>
  <!-- ? pin -->
  <line x1="278" y1="172" x2="278" y2="102" stroke="#e2903a" stroke-width="1.4" stroke-dasharray="4 3"/>
  <circle cx="278" cy="88" r="12" fill="none" stroke="#e2903a" stroke-width="2"/>
  <text x="278" y="93" text-anchor="middle" font-size="13" font-weight="bold" fill="#e2903a">?</text>
  <text class="small" x="40" y="216">p = ∞, n = 64 — measured test error 3.9%</text>

  <!-- right panel: debt 2 (AdaBoost) -->
  <text class="label" x="352" y="22" font-weight="bold">debt 2 — AdaBoost (module 7)</text>
  <line class="axis" x1="368" y1="180" x2="608" y2="180"/>
  <line class="axis" x1="368" y1="180" x2="368" y2="42"/>
  <text class="small" x="374" y="52">error</text>
  <text class="small" x="540" y="196">rounds T</text>
  <!-- train hits zero at ~105 -->
  <path class="curve" stroke="#4c8dd6" d="M 372 70 C 385 130, 400 168, 420 178 L 606 178"/>
  <text x="470" y="172" font-size="11" fill="#4c8dd6">train = 0</text>
  <!-- test keeps falling -->
  <path class="curve" stroke="#e2903a" d="M 372 56 C 390 96, 410 116, 440 122 C 500 132, 560 138, 606 141"/>
  <text x="500" y="120" font-size="11" fill="#e2903a">test, still falling</text>
  <line x1="420" y1="180" x2="420" y2="60" stroke="currentColor" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="3 3"/>
  <text class="small" x="424" y="66">T = 105</text>
  <text class="small" x="368" y="212">895 more rounds after zero training error —</text>
  <text class="small" x="368" y="226">test error 10.9% → 9.0%</text>

  <!-- bridge to the one mechanism -->
  <path class="bridge" d="M 160 226 L 160 240 L 480 240 L 480 226"/>
  <line class="bridge" x1="320" y1="240" x2="320" y2="252"/>
  <rect x="150" y="254" width="340" height="42" rx="6" fill="currentColor" opacity="0.06"/>
  <rect x="150" y="254" width="340" height="42" rx="6" fill="none" stroke="currentColor" stroke-opacity="0.4"/>
  <text class="label" x="320" y="272" text-anchor="middle" font-weight="bold">one mechanism: the margin</text>
  <text class="small" x="320" y="289" text-anchor="middle">not which class was searched — how confidently the sample is fit</text>
</svg>

<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; font-size: 12px; }
    .small { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .axis  { stroke: currentColor; stroke-opacity: 0.4; stroke-width: 1.1; fill: none; }
  </style>

  <text class="label" x="24" y="24" font-weight="bold">2n delta functions + constants: a vote that fits any labels</text>

  <!-- zero axis of the normalized vote -->
  <line class="axis" x1="40" y1="150" x2="420" y2="150"/>
  <text class="small" x="430" y="154">f̄ = 0</text>

  <!-- training points with their delta spikes; labels alternate arbitrarily -->
  <!-- positive points: spike up; negative: spike down -->
  <g stroke="#e2903a" stroke-width="1.6" fill="none">
    <path d="M 70 150 L 76 92 L 82 150"/>
    <path d="M 118 150 L 124 208 L 130 150"/>
    <path d="M 166 150 L 172 92 L 178 150"/>
    <path d="M 214 150 L 220 92 L 226 150"/>
    <path d="M 262 150 L 268 208 L 274 150"/>
    <path d="M 310 150 L 316 208 L 322 150"/>
    <path d="M 358 150 L 364 92 L 370 150"/>
  </g>
  <!-- the labeled training points on the axis -->
  <g font-size="12">
    <text x="76" y="170" text-anchor="middle" fill="#e2903a">+</text>
    <text x="124" y="140" text-anchor="middle" fill="#4c8dd6">−</text>
    <text x="172" y="170" text-anchor="middle" fill="#e2903a">+</text>
    <text x="220" y="170" text-anchor="middle" fill="#e2903a">+</text>
    <text x="268" y="140" text-anchor="middle" fill="#4c8dd6">−</text>
    <text x="316" y="140" text-anchor="middle" fill="#4c8dd6">−</text>
    <text x="364" y="170" text-anchor="middle" fill="#e2903a">+</text>
  </g>
  <text class="small" x="40" y="66">one spike per training point (its own delta function),</text>
  <text class="small" x="40" y="80">constants added to balance the vote</text>

  <!-- the normalized vote hugging ±1/n -->
  <line x1="52" y1="143" x2="408" y2="143" stroke="currentColor" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="2 3"/>
  <line x1="52" y1="157" x2="408" y2="157" stroke="currentColor" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="2 3"/>
  <text class="small" x="414" y="136">+1/n</text>
  <text class="small" x="414" y="172">−1/n</text>
  <text class="label" x="40" y="216">every training point is classified correctly — with normalized margin exactly 1/n</text>

  <!-- verdict box -->
  <rect x="452" y="56" width="164" height="132" rx="6" fill="none" stroke="currentColor" stroke-opacity="0.45" stroke-dasharray="5 4"/>
  <rect x="452" y="56" width="164" height="132" rx="6" fill="currentColor" opacity="0.05"/>
  <text class="label" x="462" y="78" font-weight="bold">the bound’s verdict</text>
  <text class="small" x="462" y="99">at any ρ ≳ 1/n:</text>
  <text class="label" x="462" y="119">R̂ₛ,ρ = 1</text>
  <text class="small" x="462" y="141">certificate vacuous —</text>
  <text class="small" x="462" y="156">correctly: the vote is</text>
  <text class="small" x="462" y="171">a memorizer</text>
</svg>

<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; font-size: 12px; }
    .small { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .frame { stroke: currentColor; stroke-opacity: 0.3; stroke-width: 1; fill: none; }
    .band  { stroke-width: 1.2; stroke-dasharray: 4 3; fill: none; }
  </style>

  <!-- LEFT: l2 margin -->
  <rect class="frame" x="24" y="34" width="280" height="200" rx="4"/>
  <text class="label" x="30" y="24" font-weight="bold">SVM: w on the ℓ₂ ball</text>
  <!-- separating line (diagonal), Euclidean corridor shaded -->
  <polygon points="120,54 168,54 96,214 48,214" fill="#4c8dd6" opacity="0.10"/>
  <line x1="144" y1="54" x2="72" y2="214" stroke="#4c8dd6" stroke-width="2"/>
  <line class="band" x1="120" y1="54" x2="48" y2="214" stroke="#4c8dd6"/>
  <line class="band" x1="168" y1="54" x2="96" y2="214" stroke="#4c8dd6"/>
  <!-- perpendicular margin arrow -->
  <line x1="120" y1="130" x2="143" y2="140" stroke="#4c8dd6" stroke-width="1.4"/>
  <text x="98" y="122" font-size="11" fill="#4c8dd6">ρ₂: Euclidean</text>
  <text x="98" y="136" font-size="11" fill="#4c8dd6">distance</text>
  <!-- points: minus left, plus right -->
  <circle cx="66" cy="110" r="4" fill="none" stroke="currentColor" stroke-width="1.6"/>
  <circle cx="86" cy="164" r="4" fill="none" stroke="currentColor" stroke-width="1.6"/>
  <circle cx="52" cy="188" r="4" fill="none" stroke="currentColor" stroke-width="1.6"/>
  <circle cx="98" cy="86"  r="4" fill="none" stroke="currentColor" stroke-width="1.6"/>
  <circle cx="196" cy="90" r="4" fill="#e2903a"/>
  <circle cx="228" cy="130" r="4" fill="#e2903a"/>
  <circle cx="176" cy="160" r="4" fill="#e2903a"/>
  <circle cx="252" cy="190" r="4" fill="#e2903a"/>
  <text class="small" x="52" y="252">margin = ℓ₂ distance of the closest point</text>
  <text class="small" x="52" y="267">to the hyperplane</text>

  <!-- RIGHT: l1 margin -->
  <rect class="frame" x="336" y="34" width="280" height="200" rx="4"/>
  <text class="label" x="342" y="24" font-weight="bold">boosting: α on the ℓ₁ ball</text>
  <!-- different optimal line: near-vertical, l-infinity slab -->
  <polygon points="446,54 494,54 482,214 434,214" fill="#e2903a" opacity="0.10"/>
  <line x1="470" y1="54" x2="458" y2="214" stroke="#e2903a" stroke-width="2"/>
  <line class="band" x1="446" y1="54" x2="434" y2="214" stroke="#e2903a"/>
  <line class="band" x1="494" y1="54" x2="482" y2="214" stroke="#e2903a"/>
  <!-- horizontal (axis-aligned) margin arrow -->
  <line x1="466" y1="134" x2="489" y2="134" stroke="#e2903a" stroke-width="1.4"/>
  <text x="497" y="130" font-size="11" fill="#e2903a">ρ₁: ℓ∞</text>
  <text x="497" y="144" font-size="11" fill="#e2903a">distance</text>
  <!-- same points, shifted frame -->
  <circle cx="378" cy="110" r="4" fill="none" stroke="currentColor" stroke-width="1.6"/>
  <circle cx="398" cy="164" r="4" fill="none" stroke="currentColor" stroke-width="1.6"/>
  <circle cx="364" cy="188" r="4" fill="none" stroke="currentColor" stroke-width="1.6"/>
  <circle cx="410" cy="86"  r="4" fill="none" stroke="currentColor" stroke-width="1.6"/>
  <circle cx="508" cy="90" r="4" fill="#e2903a"/>
  <circle cx="540" cy="130" r="4" fill="#e2903a"/>
  <circle cx="488" cy="160" r="4" fill="#e2903a"/>
  <circle cx="564" cy="190" r="4" fill="#e2903a"/>
  <text class="small" x="364" y="252">same points, ℓ₁-normalized weights:</text>
  <text class="small" x="364" y="267">a different optimal hyperplane</text>
</svg>

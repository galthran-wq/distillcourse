<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; font-size: 12px; }
    .small { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .axis  { stroke: currentColor; stroke-opacity: 0.4; stroke-width: 1.1; fill: none; }
  </style>

  <!-- axes: u from -1.5 to 2 maps x = 70 + (u+1.5)*140 ; loss 0..1.5 maps y = 250 - v*120 -->
  <line class="axis" x1="60" y1="250" x2="590" y2="250"/>
  <line class="axis" x1="280" y1="258" x2="280" y2="60"/>
  <text class="small" x="470" y="272">confidence margin u = y·h(x)</text>
  <text class="small" x="286" y="70">loss</text>
  <!-- ticks -->
  <line class="axis" x1="280" y1="250" x2="280" y2="255"/>
  <text class="small" x="280" y="268" text-anchor="middle">0</text>
  <line class="axis" x1="378" y1="250" x2="378" y2="255"/>
  <text class="label" x="378" y="268" text-anchor="middle">ρ</text>
  <line class="axis" x1="66" y1="130" x2="74" y2="130"/>
  <text class="small" x="58" y="134" text-anchor="end">1</text>

  <!-- upper bound: threshold step 1(u <= rho), dotted currentColor -->
  <polyline points="70,128 378,128 378,250" fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="2 3" opacity="0.55"/>
  <text class="small" x="86" y="118">1(u ≤ ρ)</text>

  <!-- 0-1 loss: solid currentColor step -->
  <polyline points="70,132 280,132 280,250 588,250" fill="none" stroke="currentColor" stroke-width="2"/>
  <text class="label" x="140" y="150">0–1 loss 1(u ≤ 0)</text>

  <!-- hinge, blue dashed: 1 - u/rho, clipped at loss 1.5 -->
  <polyline points="231,70 378,250 588,250" fill="none" stroke="#4c8dd6" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="196" y="86" font-size="12" fill="#4c8dd6">hinge (1 − u/ρ)₊</text>

  <!-- ramp, amber -->
  <polyline points="70,136 280,136 378,250 588,250" fill="none" stroke="#e2903a" stroke-width="2.6"/>
  <text x="392" y="182" font-size="12" fill="#e2903a" font-weight="bold">ramp Φρ(u)</text>
  <line x1="390" y1="186" x2="342" y2="196" stroke="#e2903a" stroke-width="1" opacity="0.7"/>

  <!-- annotations: the two jobs -->
  <text class="small" x="70" y="292">left of 0: Φρ ≥ the 0–1 loss → E[Φρ] dominates the risk</text>
  <text class="small" x="70" y="308">slope −1/ρ on (0, ρ): Lipschitz 1/ρ → contraction charges ℛ(H)/ρ</text>
  <!-- sandwich formula -->
  <rect x="404" y="86" width="180" height="26" rx="4" fill="currentColor" opacity="0.06"/>
  <text class="label" x="494" y="103" text-anchor="middle">1(u≤0) ≤ Φρ(u) ≤ 1(u≤ρ)</text>
</svg>

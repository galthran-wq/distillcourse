<svg viewBox="0 0 500 200" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- axes -->
  <line x1="50" y1="160" x2="470" y2="160" stroke="currentColor" stroke-width="1"/>
  <line x1="50" y1="160" x2="50" y2="25" stroke="currentColor" stroke-width="1"/>
  <text x="50" y="175" font-size="11" fill="currentColor" text-anchor="middle">0</text>
  <text x="190" y="175" font-size="11" fill="currentColor" text-anchor="middle">100</text>
  <text x="330" y="175" font-size="11" fill="currentColor" text-anchor="middle">200</text>
  <text x="470" y="175" font-size="11" fill="currentColor" text-anchor="middle">300</text>
  <text x="260" y="192" font-size="12" fill="currentColor" text-anchor="middle">n (flips)</text>
  <text x="44" y="34" font-size="11" fill="currentColor" text-anchor="end">1</text>
  <text x="44" y="99" font-size="11" fill="currentColor" text-anchor="end">&#189;</text>
  <text x="44" y="164" font-size="11" fill="currentColor" text-anchor="end">0</text>
  <text x="62" y="34" font-size="12" fill="currentColor">P(no heads) = 0.99&#8319;,&#8202; &#952;* = 0.01</text>

  <!-- the curve -->
  <polyline fill="none" stroke="#e2903a" stroke-width="2" points="50,30 64,42.4 78,53.7 92,63.8 106,73.0 120,81.3 134,88.9 148,95.7 162,101.8 176,107.4 190,112.4 218,121.1 246,128.2 274,134.0 302,138.7 330,142.6 358,145.7 386,148.3 414,150.5 442,152.2 470,153.6"/>

  <!-- half-probability guide -->
  <line x1="50" y1="95" x2="146.6" y2="95" stroke="currentColor" stroke-width="1" stroke-dasharray="3 3" opacity="0.5"/>
  <line x1="146.6" y1="95" x2="146.6" y2="160" stroke="currentColor" stroke-width="1" stroke-dasharray="3 3" opacity="0.5"/>
  <text x="160" y="148" font-size="11" fill="currentColor" opacity="0.55">n = 69: still even odds</text>

  <!-- the lesson's sample -->
  <line x1="97.6" y1="67.6" x2="97.6" y2="160" stroke="#e2903a" stroke-width="1" stroke-dasharray="3 3" opacity="0.5"/>
  <circle cx="97.6" cy="67.6" r="4" fill="#e2903a"/>
  <text x="106" y="64" font-size="12" fill="#e2903a">n = 34: 0.71</text>

  <!-- the slow tail -->
  <circle cx="330" cy="142.6" r="3" fill="currentColor" opacity="0.55"/>
  <text x="330" y="134" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">n = 200: 0.13</text>
</svg>

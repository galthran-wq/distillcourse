<svg viewBox="0 0 500 210" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- ambient space of all distributions -->
  <rect x="30" y="22" width="440" height="166" rx="30" fill="none" stroke="currentColor" stroke-width="1" opacity="0.35"/>
  <text x="48" y="44" font-size="11" fill="currentColor" opacity="0.55">all distributions on X</text>

  <!-- model family: a one-parameter curve -->
  <path d="M 70 155 Q 250 95 430 130" fill="none" stroke="#4c8dd6" stroke-width="2"/>
  <text x="366" y="152" font-size="12" fill="#4c8dd6" text-anchor="middle">model family p(&#183; | &#952;)</text>

  <!-- rejected candidates: longer dashed reaches -->
  <line x1="280" y1="55" x2="142" y2="135" stroke="currentColor" stroke-width="1" stroke-dasharray="3 3" opacity="0.3"/>
  <line x1="280" y1="55" x2="358" y2="120" stroke="currentColor" stroke-width="1" stroke-dasharray="3 3" opacity="0.3"/>
  <circle cx="142" cy="135" r="3" fill="currentColor" opacity="0.4"/>
  <circle cx="358" cy="120" r="3" fill="currentColor" opacity="0.4"/>

  <!-- the projection -->
  <line x1="280" y1="55" x2="250" y2="119" stroke="#e2903a" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="250" cy="119" r="4" fill="#e2903a"/>
  <circle cx="280" cy="55" r="4" fill="currentColor"/>
  <text x="292" y="52" font-size="12" fill="currentColor">p&#770;&#8347; &#8212; the data's histogram</text>
  <text x="300" y="90" font-size="11" fill="#e2903a">KL(p&#770;&#8347; &#8214; p(&#183;|&#952;)) minimized</text>
  <text x="236" y="108" font-size="12" fill="#e2903a" text-anchor="end">p(&#183; | &#952;&#770;)</text>
</svg>

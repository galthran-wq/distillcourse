<svg viewBox="0 0 500 210" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- axes -->
  <line x1="50" y1="170" x2="470" y2="170" stroke="currentColor" stroke-width="1"/>
  <line x1="50" y1="170" x2="50" y2="25" stroke="currentColor" stroke-width="1"/>
  <text x="50" y="185" font-size="11" fill="currentColor" text-anchor="middle">0</text>
  <text x="155" y="185" font-size="11" fill="currentColor" text-anchor="middle">10</text>
  <text x="260" y="185" font-size="11" fill="currentColor" text-anchor="middle">20</text>
  <text x="365" y="185" font-size="11" fill="currentColor" text-anchor="middle">30</text>
  <text x="470" y="185" font-size="11" fill="currentColor" text-anchor="middle">40</text>
  <text x="260" y="202" font-size="12" fill="currentColor" text-anchor="middle">n (flips)</text>
  <text x="44" y="34" font-size="11" fill="currentColor" text-anchor="end">1</text>
  <text x="44" y="104" font-size="11" fill="currentColor" text-anchor="end">&#189;</text>
  <text x="44" y="174" font-size="11" fill="currentColor" text-anchor="end">0</text>
  <text x="62" y="38" font-size="12" fill="currentColor">&#955; = (a+b)/(a+b+n),&#8202; a = b = 2</text>

  <!-- prior weight lambda = 4/(4+n) -->
  <polyline fill="none" stroke="#e2903a" stroke-width="2" points="50,30 60.5,58 71,76.7 81.5,90 92,100 102.5,107.8 113,114 123.5,119.1 134,123.3 155,130 176,135 197,138.9 218,142 260,146.7 302,150 344,152.5 386,154.4 428,156 470,157.3"/>
  <text x="466" y="149" font-size="12" fill="#e2903a" text-anchor="end">prior weight &#955;</text>

  <!-- data weight 1 - lambda = n/(4+n) -->
  <polyline fill="none" stroke="#4c8dd6" stroke-width="2" points="50,170 60.5,142 71,123.3 81.5,110 92,100 102.5,92.2 113,86 123.5,80.9 134,76.7 155,70 176,65 197,61.1 218,58 260,53.3 302,50 344,47.5 386,45.6 428,44 470,42.7"/>
  <text x="466" y="59" font-size="12" fill="#4c8dd6" text-anchor="end">data weight 1 &#8722; &#955;</text>

  <!-- equal-weight crossing at n = a + b = 4 -->
  <line x1="50" y1="100" x2="92" y2="100" stroke="currentColor" stroke-width="1" stroke-dasharray="3 3" opacity="0.5"/>
  <line x1="92" y1="100" x2="92" y2="170" stroke="currentColor" stroke-width="1" stroke-dasharray="3 3" opacity="0.5"/>
  <text x="97" y="164" font-size="11" fill="currentColor" opacity="0.55">n = 4: equal weight</text>

  <!-- the running coin -->
  <circle cx="123.5" cy="119.1" r="4" fill="#e2903a"/>
  <text x="131" y="112" font-size="12" fill="#e2903a">n = 7: &#955; = 4/11</text>
</svg>

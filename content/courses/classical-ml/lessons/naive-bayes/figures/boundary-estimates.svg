<svg viewBox="0 0 620 262" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="310" y="22" font-size="13" text-anchor="middle" fill="currentColor">the eight fitted estimates θ̂ⱼ|c on [0, 1]</text>

  <!-- boundary guides -->
  <g stroke="currentColor" opacity="0.35" stroke-dasharray="3 3">
    <line x1="90" y1="48" x2="90" y2="212"/>
    <line x1="570" y1="48" x2="570" y2="212"/>
  </g>
  <text x="90" y="42" font-size="11.5" text-anchor="middle" fill="#e2903a">0 = “never”</text>
  <text x="570" y="42" font-size="11.5" text-anchor="middle" fill="#e2903a">1 = “always”</text>

  <!-- spam row -->
  <line x1="90" y1="100" x2="570" y2="100" stroke="currentColor" opacity="0.6"/>
  <text x="82" y="104" font-size="12" text-anchor="end" fill="currentColor">spam</text>
  <!-- meeting 0/3 at 0 -->
  <circle cx="90" cy="100" r="5" fill="#e2903a"/>
  <text x="90" y="84" font-size="11.5" text-anchor="middle" fill="#e2903a">meeting 0/3</text>
  <!-- deadline 1/3 -->
  <circle cx="250" cy="100" r="4" fill="#4c8dd6"/>
  <text x="250" y="84" font-size="11.5" text-anchor="middle" fill="#4c8dd6">deadline 1/3</text>
  <!-- free 2/3 -->
  <circle cx="410" cy="100" r="4" fill="#4c8dd6"/>
  <text x="410" y="84" font-size="11.5" text-anchor="middle" fill="#4c8dd6">free 2/3</text>
  <!-- money 3/3 at 1 -->
  <circle cx="570" cy="100" r="5" fill="#e2903a"/>
  <text x="570" y="84" font-size="11.5" text-anchor="middle" fill="#e2903a">money 3/3</text>

  <!-- ham row -->
  <line x1="90" y1="180" x2="570" y2="180" stroke="currentColor" opacity="0.6"/>
  <text x="82" y="184" font-size="12" text-anchor="end" fill="currentColor">ham</text>
  <!-- free 0/3 at 0 -->
  <circle cx="90" cy="180" r="5" fill="#e2903a"/>
  <text x="90" y="164" font-size="11.5" text-anchor="middle" fill="#e2903a">free 0/3</text>
  <!-- money 1/3 -->
  <circle cx="250" cy="180" r="4" fill="#4c8dd6"/>
  <text x="250" y="164" font-size="11.5" text-anchor="middle" fill="#4c8dd6">money 1/3</text>
  <!-- deadline 2/3 -->
  <circle cx="410" cy="180" r="4" fill="#4c8dd6"/>
  <text x="410" y="164" font-size="11.5" text-anchor="middle" fill="#4c8dd6">deadline 2/3</text>
  <!-- meeting 3/3 at 1 -->
  <circle cx="570" cy="180" r="5" fill="#e2903a"/>
  <text x="570" y="164" font-size="11.5" text-anchor="middle" fill="#e2903a">meeting 3/3</text>

  <!-- axis ticks under ham row -->
  <g font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">
    <text x="90" y="204">0</text>
    <text x="250" y="204">1/3</text>
    <text x="410" y="204">2/3</text>
    <text x="570" y="204">1</text>
  </g>

  <text x="310" y="244" font-size="12" text-anchor="middle" fill="currentColor">interior estimates err gradually; the four on the boundary assert impossibilities</text>
</svg>

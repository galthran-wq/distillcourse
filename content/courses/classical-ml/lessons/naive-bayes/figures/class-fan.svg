<svg viewBox="0 0 600 268" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- class node -->
  <circle cx="300" cy="52" r="22" fill="none" stroke="#e2903a" stroke-width="1.8"/>
  <text x="300" y="57" font-size="14" text-anchor="middle" fill="#e2903a" font-style="italic">y</text>
  <text x="345" y="45" font-size="12" fill="currentColor" opacity="0.55">the class: spam or ham</text>

  <!-- fan edges -->
  <g stroke="currentColor" stroke-width="1.2" opacity="0.7">
    <line x1="288" y1="71" x2="97" y2="148"/>
    <line x1="294" y1="74" x2="199" y2="148"/>
    <line x1="300" y1="74" x2="300" y2="148"/>
    <line x1="308" y1="73" x2="411" y2="148"/>
    <line x1="313" y1="70" x2="513" y2="148"/>
  </g>
  <g fill="currentColor">
    <path d="M 97 148 l 2 -9 l 6 6 z"/>
    <path d="M 199 148 l 1.5 -9 l 6.5 5 z"/>
    <path d="M 300 148 l -4 -8 l 8 0 z"/>
    <path d="M 411 148 l -6.5 -5 l 1.5 -4 z"/>
    <path d="M 513 148 l -8 -3 l 2 -6 z"/>
  </g>

  <!-- feature nodes -->
  <g fill="none" stroke="#4c8dd6" stroke-width="1.6">
    <rect x="70" y="150" width="54" height="32" rx="5"/>
    <rect x="172" y="150" width="54" height="32" rx="5"/>
    <rect x="273" y="150" width="54" height="32" rx="5"/>
    <rect x="384" y="150" width="54" height="32" rx="5"/>
    <rect x="486" y="150" width="54" height="32" rx="5"/>
  </g>
  <g font-size="13" text-anchor="middle" fill="#4c8dd6" font-style="italic">
    <text x="97" y="171">x₁</text>
    <text x="199" y="171">x₂</text>
    <text x="300" y="171">x₃</text>
    <text x="513" y="171">x₅₇</text>
  </g>
  <text x="411" y="171" font-size="13" text-anchor="middle" fill="#4c8dd6">⋯</text>

  <text x="300" y="207" font-size="12" text-anchor="middle" fill="currentColor">edges leave y only: given the class, no feature depends on any other</text>

  <!-- factored likelihood, color-matched -->
  <text x="300" y="242" font-size="14" text-anchor="middle" fill="currentColor">
    p(<tspan fill="#4c8dd6" font-style="italic">x₁, …, x₅₇</tspan> | <tspan fill="#e2903a" font-style="italic">y</tspan>)
    = p(<tspan fill="#4c8dd6" font-style="italic">x₁</tspan> | <tspan fill="#e2903a" font-style="italic">y</tspan>)
    · p(<tspan fill="#4c8dd6" font-style="italic">x₂</tspan> | <tspan fill="#e2903a" font-style="italic">y</tspan>)
    ⋯ p(<tspan fill="#4c8dd6" font-style="italic">x₅₇</tspan> | <tspan fill="#e2903a" font-style="italic">y</tspan>)
  </text>
</svg>

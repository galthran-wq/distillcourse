<svg viewBox="0 0 560 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="90" y="26" font-size="13" fill="currentColor">remaining doubt P(ham | x) for “free money deadline”, log scale</text>

  <!-- gridlines -->
  <g stroke="currentColor" opacity="0.25" stroke-dasharray="3 3">
    <line x1="90" y1="84" x2="520" y2="84"/>
    <line x1="90" y1="128" x2="520" y2="128"/>
    <line x1="90" y1="172" x2="520" y2="172"/>
    <line x1="90" y1="216" x2="520" y2="216"/>
  </g>
  <line x1="90" y1="260" x2="520" y2="260" stroke="currentColor" opacity="0.7"/>
  <g font-size="11" fill="currentColor" opacity="0.55" text-anchor="end">
    <text x="82" y="88">10⁻¹</text>
    <text x="82" y="132">10⁻²</text>
    <text x="82" y="176">10⁻³</text>
    <text x="82" y="220">10⁻⁴</text>
    <text x="82" y="264">10⁻⁵</text>
  </g>

  <!-- bars: doubt shrinking as the word is duplicated -->
  <g fill="#e2903a" opacity="0.85">
    <rect x="132" y="94" width="56" height="166" rx="3"/>
    <rect x="232" y="114" width="56" height="146" rx="3"/>
    <rect x="332" y="156" width="56" height="104" rx="3"/>
    <rect x="432" y="240" width="56" height="20" rx="3"/>
  </g>
  <g font-size="12" fill="currentColor" text-anchor="middle">
    <text x="160" y="88">0.059</text>
    <text x="260" y="108">0.020</text>
    <text x="360" y="150">0.0023</text>
    <text x="460" y="234">0.00003</text>
  </g>
  <g font-size="12" fill="currentColor" text-anchor="middle">
    <text x="160" y="280">“free” ×1</text>
    <text x="260" y="280">×2</text>
    <text x="360" y="280">×4</text>
    <text x="460" y="280">×8</text>
  </g>
  <text x="305" y="298" font-size="12" text-anchor="middle" fill="currentColor" opacity="0.55">same message, same evidence — each copy multiplies the posterior odds by 3</text>
</svg>

<svg viewBox="0 0 620 232" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="310" y="22" font-size="13" text-anchor="middle" fill="currentColor">p(x | y = c) with x₁ unobserved at prediction time</text>

  <!-- top row: full factored product -->
  <g font-family="ui-monospace, monospace" font-size="12">
    <g opacity="0.45">
      <rect x="60" y="44" width="92" height="32" rx="5" fill="none" stroke="currentColor" stroke-dasharray="4 3"/>
      <text x="106" y="64" text-anchor="middle" fill="currentColor">p(x₁|c)</text>
    </g>
    <text x="163" y="64" font-size="13" fill="currentColor">·</text>
    <rect x="176" y="44" width="92" height="32" rx="5" fill="none" stroke="currentColor"/>
    <text x="222" y="64" text-anchor="middle" fill="currentColor">p(x₂|c)</text>
    <text x="279" y="64" font-size="13" fill="currentColor">·</text>
    <rect x="292" y="44" width="92" height="32" rx="5" fill="none" stroke="currentColor"/>
    <text x="338" y="64" text-anchor="middle" fill="currentColor">p(x₃|c)</text>
    <text x="398" y="64" font-size="13" fill="currentColor">⋯</text>
    <rect x="424" y="44" width="100" height="32" rx="5" fill="none" stroke="currentColor"/>
    <text x="474" y="64" text-anchor="middle" fill="currentColor">p(x₅₇|c)</text>
  </g>
  <text x="106" y="38" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.55">x₁ never arrived</text>

  <!-- sum-out annotation under the grayed factor -->
  <line x1="106" y1="80" x2="106" y2="106" stroke="currentColor" stroke-width="1.5"/>
  <path d="M 106 112 l -4 -8 l 8 0 z" fill="currentColor"/>
  <text x="118" y="102" font-size="12" fill="currentColor">sum over both values: p(x₁=0|c) + p(x₁=1|c) = 1</text>

  <!-- bottom row: surviving product, amber -->
  <g font-family="ui-monospace, monospace" font-size="12">
    <text x="152" y="164" text-anchor="end" fill="currentColor">score uses</text>
    <rect x="176" y="140" width="92" height="32" rx="5" fill="none" stroke="#e2903a"/>
    <text x="222" y="160" text-anchor="middle" fill="currentColor">p(x₂|c)</text>
    <text x="279" y="160" font-size="13" fill="currentColor">·</text>
    <rect x="292" y="140" width="92" height="32" rx="5" fill="none" stroke="#e2903a"/>
    <text x="338" y="160" text-anchor="middle" fill="currentColor">p(x₃|c)</text>
    <text x="398" y="160" font-size="13" fill="currentColor">⋯</text>
    <rect x="424" y="140" width="100" height="32" rx="5" fill="none" stroke="#e2903a"/>
    <text x="474" y="160" text-anchor="middle" fill="currentColor">p(x₅₇|c)</text>
  </g>

  <text x="310" y="212" font-size="12" text-anchor="middle" fill="currentColor">the factor of an unobserved feature drops out; the other 56 keep their values</text>
</svg>

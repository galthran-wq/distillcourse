<svg viewBox="0 0 600 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- ham cloud: open circles -->
  <g fill="none" stroke="currentColor" stroke-width="1.4" opacity="0.65">
    <circle cx="140" cy="205" r="4"/><circle cx="165" cy="240" r="4"/><circle cx="180" cy="190" r="4"/>
    <circle cx="195" cy="265" r="4"/><circle cx="210" cy="220" r="4"/><circle cx="230" cy="250" r="4"/>
    <circle cx="155" cy="225" r="4"/><circle cx="245" cy="210" r="4"/><circle cx="200" cy="180" r="4"/>
    <circle cx="175" cy="255" r="4"/><circle cx="225" cy="190" r="4"/><circle cx="255" cy="245" r="4"/>
  </g>
  <!-- spam cloud: filled circles -->
  <g fill="currentColor" opacity="0.65">
    <circle cx="360" cy="95" r="4"/><circle cx="385" cy="130" r="4"/><circle cx="400" cy="70" r="4"/>
    <circle cx="420" cy="110" r="4"/><circle cx="440" cy="140" r="4"/><circle cx="455" cy="85" r="4"/>
    <circle cx="470" cy="120" r="4"/><circle cx="390" cy="55" r="4"/><circle cx="430" cy="60" r="4"/>
    <circle cx="480" cy="95" r="4"/><circle cx="405" cy="150" r="4"/><circle cx="365" cy="125" r="4"/>
  </g>
  <text x="200" y="292" font-size="12" text-anchor="middle" fill="currentColor" opacity="0.55">ham (○)</text>
  <text x="420" y="35" font-size="12" text-anchor="middle" fill="currentColor" opacity="0.55">spam (●)</text>

  <!-- naive Bayes boundary -->
  <line x1="250" y1="40" x2="390" y2="300" stroke="#e2903a" stroke-width="2"/>
  <text x="245" y="30" font-size="12.5" fill="#e2903a" text-anchor="end">naive Bayes: w from per-word counts</text>
  <!-- logistic boundary -->
  <line x1="285" y1="40" x2="355" y2="300" stroke="#4c8dd6" stroke-width="2"/>
  <text x="368" y="312" font-size="12.5" fill="#4c8dd6">logistic regression: β from the conditional likelihood</text>

  <text x="30" y="60" font-size="12" fill="currentColor">both boundaries are hyperplanes:</text>
  <text x="30" y="76" font-size="12" fill="currentColor">σ(b + w·x) = ½, two estimates</text>
  <text x="30" y="92" font-size="12" fill="currentColor">of one functional form</text>
</svg>

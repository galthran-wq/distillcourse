<svg viewBox="0 0 620 312" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- left: the full joint table, grayed -->
  <text x="105" y="26" font-size="13" text-anchor="middle" fill="currentColor">full joint p(x | spam)</text>
  <g opacity="0.45">
    <rect x="25" y="38" width="160" height="196" rx="5" fill="none" stroke="currentColor"/>
    <line x1="25" y1="64" x2="185" y2="64" stroke="currentColor"/>
    <text x="35" y="55" font-size="11.5" fill="currentColor" font-family="ui-monospace, monospace">x (57 bits)</text>
    <text x="150" y="55" font-size="11.5" fill="currentColor" font-family="ui-monospace, monospace">p</text>
    <text x="35" y="84" font-size="11.5" fill="currentColor" font-family="ui-monospace, monospace">000…0000</text>
    <text x="143" y="84" font-size="11.5" fill="currentColor" font-family="ui-monospace, monospace">p₁</text>
    <text x="35" y="106" font-size="11.5" fill="currentColor" font-family="ui-monospace, monospace">000…0001</text>
    <text x="143" y="106" font-size="11.5" fill="currentColor" font-family="ui-monospace, monospace">p₂</text>
    <text x="35" y="128" font-size="11.5" fill="currentColor" font-family="ui-monospace, monospace">000…0010</text>
    <text x="143" y="128" font-size="11.5" fill="currentColor" font-family="ui-monospace, monospace">p₃</text>
    <text x="100" y="165" font-size="15" fill="currentColor" text-anchor="middle">⋮</text>
    <text x="35" y="200" font-size="11.5" fill="currentColor" font-family="ui-monospace, monospace">111…1111</text>
    <text x="140" y="200" font-size="11.5" fill="currentColor" font-family="ui-monospace, monospace">p…</text>
  </g>
  <text x="105" y="256" font-size="12" text-anchor="middle" fill="currentColor">2⁵⁷ − 1 free numbers per class</text>
  <text x="105" y="274" font-size="12" text-anchor="middle" fill="currentColor" opacity="0.55">≈ 1.4 × 10¹⁷</text>

  <!-- middle arrow -->
  <line x1="205" y1="140" x2="285" y2="140" stroke="currentColor" stroke-width="1.5"/>
  <path d="M 285 140 l -8 -4 l 0 8 z" fill="currentColor"/>
  <text x="245" y="118" font-size="11.5" text-anchor="middle" fill="currentColor">assume the features</text>
  <text x="245" y="132" font-size="11.5" text-anchor="middle" fill="currentColor">independent given y</text>

  <!-- right: one small table per feature, amber -->
  <text x="450" y="26" font-size="13" text-anchor="middle" fill="currentColor">57 per-feature tables</text>
  <g stroke="#e2903a" fill="none">
    <rect x="310" y="42" width="280" height="34" rx="5"/>
    <rect x="310" y="86" width="280" height="34" rx="5"/>
    <rect x="310" y="130" width="280" height="34" rx="5"/>
    <rect x="310" y="200" width="280" height="34" rx="5"/>
  </g>
  <text x="322" y="63" font-size="12" fill="currentColor">word 1</text>
  <text x="578" y="63" font-size="12" fill="currentColor" text-anchor="end">P(present | spam) = θ₁ — one number</text>
  <text x="322" y="107" font-size="12" fill="currentColor">word 2</text>
  <text x="578" y="107" font-size="12" fill="currentColor" text-anchor="end">P(present | spam) = θ₂ — one number</text>
  <text x="322" y="151" font-size="12" fill="currentColor">word 3</text>
  <text x="578" y="151" font-size="12" fill="currentColor" text-anchor="end">P(present | spam) = θ₃ — one number</text>
  <text x="450" y="186" font-size="15" fill="currentColor" text-anchor="middle">⋮</text>
  <text x="322" y="221" font-size="12" fill="currentColor">word 57</text>
  <text x="578" y="221" font-size="12" fill="currentColor" text-anchor="end">P(present | spam) = θ₅₇ — one number</text>
  <text x="450" y="256" font-size="12" text-anchor="middle" fill="#e2903a">57 free numbers per class</text>

  <!-- bottom tally -->
  <line x1="25" y1="282" x2="595" y2="282" stroke="currentColor" opacity="0.3" stroke-dasharray="3 3"/>
  <text x="310" y="302" font-size="12.5" text-anchor="middle" fill="currentColor">both classes + the prior:  2(2⁵⁷ − 1) + 1   →   2 · 57 + 1 = 115</text>
</svg>

<svg viewBox="0 0 620 292" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="310" y="22" font-size="13" text-anchor="middle" fill="currentColor">add-one smoothing on the spam column: (Nⱼ + 1) / (3 + 2)</text>

  <!-- shared vertical guides at 0, 1/2, 1 -->
  <g stroke="currentColor" opacity="0.25" stroke-dasharray="3 3">
    <line x1="130" y1="44" x2="130" y2="238"/>
    <line x1="330" y1="44" x2="330" y2="238"/>
    <line x1="530" y1="44" x2="530" y2="238"/>
  </g>
  <g font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">
    <text x="130" y="254">0</text>
    <text x="330" y="254">1/2</text>
    <text x="530" y="254">1</text>
  </g>

  <!-- row: meeting 0/3 -> 1/5  (0 -> 0.2): x 130 -> 210 -->
  <text x="122" y="66" font-size="12" text-anchor="end" fill="currentColor">meeting</text>
  <line x1="130" y1="62" x2="196" y2="62" stroke="#e2903a" stroke-width="2.5"/>
  <path d="M 204 62 l -9 -4.5 l 0 9 z" fill="#e2903a"/>
  <circle cx="130" cy="62" r="4.5" fill="#4c8dd6"/>
  <circle cx="210" cy="62" r="4.5" fill="#e2903a"/>
  <text x="222" y="66" font-size="11.5" fill="#e2903a">0/3 → 1/5, moved 0.20</text>

  <!-- row: deadline 1/3 -> 2/5 (0.333 -> 0.4): x 263 -> 290 -->
  <text x="122" y="118" font-size="12" text-anchor="end" fill="currentColor">deadline</text>
  <line x1="263" y1="114" x2="280" y2="114" stroke="#4c8dd6" stroke-width="1.5" opacity="0.8"/>
  <path d="M 286 114 l -8 -4 l 0 8 z" fill="#4c8dd6" opacity="0.8"/>
  <circle cx="263" cy="114" r="4.5" fill="#4c8dd6"/>
  <circle cx="290" cy="114" r="4.5" fill="#e2903a"/>
  <text x="302" y="118" font-size="11.5" fill="currentColor" opacity="0.7">1/3 → 2/5, moved 0.07</text>

  <!-- row: free 2/3 -> 3/5 (0.667 -> 0.6): x 397 -> 370 -->
  <text x="122" y="170" font-size="12" text-anchor="end" fill="currentColor">free</text>
  <line x1="397" y1="166" x2="380" y2="166" stroke="#4c8dd6" stroke-width="1.5" opacity="0.8"/>
  <path d="M 374 166 l 8 -4 l 0 8 z" fill="#4c8dd6" opacity="0.8"/>
  <circle cx="397" cy="166" r="4.5" fill="#4c8dd6"/>
  <circle cx="370" cy="166" r="4.5" fill="#e2903a"/>
  <text x="409" y="170" font-size="11.5" fill="currentColor" opacity="0.7">2/3 → 3/5, moved 0.07</text>

  <!-- row: money 3/3 -> 4/5 (1 -> 0.8): x 530 -> 450 -->
  <text x="122" y="222" font-size="12" text-anchor="end" fill="currentColor">money</text>
  <line x1="530" y1="218" x2="464" y2="218" stroke="#e2903a" stroke-width="2.5"/>
  <path d="M 456 218 l 9 -4.5 l 0 9 z" fill="#e2903a"/>
  <circle cx="530" cy="218" r="4.5" fill="#4c8dd6"/>
  <circle cx="450" cy="218" r="4.5" fill="#e2903a"/>
  <text x="442" y="204" font-size="11.5" text-anchor="end" fill="#e2903a">3/3 → 4/5, moved 0.20</text>

  <text x="310" y="280" font-size="12" text-anchor="middle" fill="currentColor">every count gains one fictitious occurrence and one fictitious non-occurrence</text>
</svg>

<svg viewBox="0 0 620 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="24" y="28" font-size="13.5" fill="currentColor"><tspan font-weight="bold">1 · count.</tspan> documents containing each word, per class</text>

  <!-- table frame -->
  <rect x="24" y="46" width="360" height="170" rx="5" fill="none" stroke="currentColor" opacity="0.7"/>
  <line x1="24" y1="80" x2="384" y2="80" stroke="currentColor" opacity="0.7"/>
  <line x1="134" y1="46" x2="134" y2="216" stroke="currentColor" opacity="0.35"/>
  <line x1="214" y1="46" x2="214" y2="216" stroke="currentColor" opacity="0.35"/>
  <line x1="294" y1="46" x2="294" y2="216" stroke="currentColor" opacity="0.35"/>
  <!-- header -->
  <g font-size="12" fill="currentColor">
    <text x="36" y="68">word</text>
    <text x="174" y="68" text-anchor="middle">spam (3)</text>
    <text x="254" y="68" text-anchor="middle">ham (3)</text>
    <text x="339" y="68" text-anchor="middle" opacity="0.4">log-ratio</text>
  </g>
  <!-- rows -->
  <g font-size="12.5" fill="currentColor">
    <text x="36" y="103">money</text>
    <text x="174" y="103" text-anchor="middle">3</text>
    <text x="254" y="103" text-anchor="middle">1</text>
    <text x="36" y="137">free</text>
    <text x="174" y="137" text-anchor="middle">2</text>
    <text x="254" y="137" text-anchor="middle">0</text>
    <text x="36" y="171">meeting</text>
    <text x="174" y="171" text-anchor="middle">0</text>
    <text x="254" y="171" text-anchor="middle">3</text>
    <text x="36" y="205">deadline</text>
    <text x="174" y="205" text-anchor="middle">1</text>
    <text x="254" y="205" text-anchor="middle">2</text>
  </g>
  <!-- highlight the zeros -->
  <circle cx="254" cy="133" r="12" fill="none" stroke="#e2903a" stroke-width="1.6"/>
  <circle cx="174" cy="167" r="12" fill="none" stroke="#e2903a" stroke-width="1.6"/>

  <!-- annotation -->
  <text x="410" y="68" font-size="12" fill="currentColor">6 documents: 3 spam, 3 ham.</text>
  <text x="410" y="86" font-size="12" fill="currentColor">The MLE divides by the class</text>
  <text x="410" y="102" font-size="12" fill="currentColor">size: θ̂ = count / 3.</text>
  <g stroke="#e2903a" stroke-width="1.2" fill="none">
    <path d="M 402 140 C 330 138 300 134 268 133"/>
    <path d="M 402 152 C 330 160 250 164 188 167"/>
  </g>
  <text x="410" y="144" font-size="12" fill="#e2903a">two zero counts:</text>
  <text x="410" y="160" font-size="12" fill="#e2903a">each becomes θ̂ = 0,</text>
  <text x="410" y="176" font-size="12" fill="#e2903a">a certainty the data</text>
  <text x="410" y="192" font-size="12" fill="#e2903a">never earned</text>

  <text x="24" y="252" font-size="12" fill="currentColor" opacity="0.55">unsmoothed estimates:  money 3/3 · 1/3   free 2/3 · 0   meeting 0 · 3/3   deadline 1/3 · 2/3</text>
  <text x="24" y="290" font-size="12.5" fill="currentColor">θ̂(meeting | spam) = 0 and θ̂(money | spam) = 1: the fitted model calls both impossible to violate.</text>
</svg>

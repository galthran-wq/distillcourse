<svg viewBox="0 0 620 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="24" y="28" font-size="13.5" fill="currentColor"><tspan font-weight="bold">2 · smooth.</tspan> every count +1, every denominator +2</text>

  <!-- table frame (identical layout) -->
  <rect x="24" y="46" width="360" height="170" rx="5" fill="none" stroke="currentColor" opacity="0.7"/>
  <line x1="24" y1="80" x2="384" y2="80" stroke="currentColor" opacity="0.7"/>
  <line x1="134" y1="46" x2="134" y2="216" stroke="currentColor" opacity="0.35"/>
  <line x1="214" y1="46" x2="214" y2="216" stroke="currentColor" opacity="0.35"/>
  <line x1="294" y1="46" x2="294" y2="216" stroke="currentColor" opacity="0.35"/>
  <!-- header -->
  <g font-size="12" fill="currentColor">
    <text x="36" y="68">word</text>
    <text x="174" y="68" text-anchor="middle">spam</text>
    <text x="254" y="68" text-anchor="middle">ham</text>
    <text x="339" y="68" text-anchor="middle" opacity="0.4">log-ratio</text>
  </g>
  <!-- rows: smoothed estimates, pseudo-counts in green -->
  <g font-size="12.5" fill="currentColor">
    <text x="36" y="103">money</text>
    <text x="166" y="103" text-anchor="middle">4/5</text>
    <text x="246" y="103" text-anchor="middle">2/5</text>
    <text x="36" y="137">free</text>
    <text x="166" y="137" text-anchor="middle">3/5</text>
    <text x="246" y="137" text-anchor="middle">1/5</text>
    <text x="36" y="171">meeting</text>
    <text x="166" y="171" text-anchor="middle">1/5</text>
    <text x="246" y="171" text-anchor="middle">4/5</text>
    <text x="36" y="205">deadline</text>
    <text x="166" y="205" text-anchor="middle">2/5</text>
    <text x="246" y="205" text-anchor="middle">3/5</text>
  </g>
  <g font-size="9.5" fill="#5aa46a">
    <text x="186" y="96">3+1</text>
    <text x="266" y="96">1+1</text>
    <text x="186" y="130">2+1</text>
    <text x="266" y="130">0+1</text>
    <text x="186" y="164">0+1</text>
    <text x="266" y="164">3+1</text>
    <text x="186" y="198">1+1</text>
    <text x="266" y="198">2+1</text>
  </g>

  <!-- annotation -->
  <text x="410" y="68" font-size="12" fill="currentColor">θ̂ = (count + 1) / (3 + 2):</text>
  <text x="410" y="86" font-size="12" fill="currentColor">one fictitious document</text>
  <text x="410" y="102" font-size="12" fill="currentColor">with the word, one without,</text>
  <text x="410" y="118" font-size="12" fill="currentColor">added to each class.</text>
  <text x="410" y="150" font-size="12" fill="#5aa46a">no estimate is 0 or 1:</text>
  <text x="410" y="166" font-size="12" fill="#5aa46a">the zeros became 1/5,</text>
  <text x="410" y="182" font-size="12" fill="#5aa46a">the certainties 4/5</text>

  <text x="24" y="252" font-size="12" fill="currentColor" opacity="0.55">the pseudo-counts are a Beta(2, 2) prior on each θ — MAP estimation, not a patch</text>
  <text x="24" y="290" font-size="12.5" fill="currentColor">Rare words move a lot (0 → 1/5); well-observed ones barely (3/3 → 4/5). The prior governs small counts only.</text>
</svg>

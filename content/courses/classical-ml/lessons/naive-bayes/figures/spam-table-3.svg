<svg viewBox="0 0 620 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="24" y="28" font-size="13.5" fill="currentColor"><tspan font-weight="bold">3 · score.</tspan> the message “free money deadline”, one log-ratio per word</text>

  <!-- table frame (identical layout) -->
  <rect x="24" y="46" width="360" height="170" rx="5" fill="none" stroke="currentColor" opacity="0.7"/>
  <line x1="24" y1="80" x2="384" y2="80" stroke="currentColor" opacity="0.7"/>
  <line x1="134" y1="46" x2="134" y2="216" stroke="currentColor" opacity="0.35"/>
  <line x1="214" y1="46" x2="214" y2="216" stroke="currentColor" opacity="0.35"/>
  <line x1="294" y1="46" x2="294" y2="216" stroke="currentColor" opacity="0.35"/>
  <!-- header -->
  <g font-size="12" fill="currentColor">
    <text x="36" y="68">word</text>
    <text x="174" y="68" text-anchor="middle">spam</text>
    <text x="254" y="68" text-anchor="middle">ham</text>
    <text x="339" y="68" text-anchor="middle">log-ratio</text>
  </g>
  <!-- rows -->
  <g font-size="12.5" fill="currentColor">
    <text x="36" y="103">money ✓</text>
    <text x="174" y="103" text-anchor="middle">4/5</text>
    <text x="254" y="103" text-anchor="middle">2/5</text>
    <text x="36" y="137">free ✓</text>
    <text x="174" y="137" text-anchor="middle">3/5</text>
    <text x="254" y="137" text-anchor="middle">1/5</text>
    <text x="36" y="171" opacity="0.55">meeting —</text>
    <text x="174" y="171" text-anchor="middle" opacity="0.55">1/5</text>
    <text x="254" y="171" text-anchor="middle" opacity="0.55">4/5</text>
    <text x="36" y="205">deadline ✓</text>
    <text x="174" y="205" text-anchor="middle">2/5</text>
    <text x="254" y="205" text-anchor="middle">3/5</text>
  </g>
  <g font-size="12.5" text-anchor="middle">
    <text x="339" y="103" fill="#e2903a">+0.69</text>
    <text x="339" y="137" fill="#e2903a">+1.10</text>
    <text x="339" y="171" fill="#e2903a">+1.39</text>
    <text x="339" y="205" fill="#4c8dd6">−0.41</text>
  </g>

  <!-- annotation: the sum -->
  <text x="410" y="68" font-size="12" fill="currentColor">present word: ln(θ̂ₛ / θ̂ₕ)</text>
  <text x="410" y="86" font-size="12" fill="currentColor">absent word:</text>
  <text x="410" y="102" font-size="12" fill="currentColor">ln((1−θ̂ₛ)/(1−θ̂ₕ))</text>
  <text x="410" y="118" font-size="12" fill="currentColor" opacity="0.55">(“meeting” absent favors spam)</text>

  <line x1="404" y1="136" x2="600" y2="136" stroke="currentColor" opacity="0.3" stroke-dasharray="3 3"/>
  <text x="410" y="158" font-size="12.5" fill="currentColor">sum s = 2.77   (prior term 0)</text>
  <rect x="404" y="172" width="196" height="34" rx="5" fill="none" stroke="#e2903a" stroke-width="1.6"/>
  <text x="502" y="193" font-size="12.5" text-anchor="middle" fill="#e2903a">σ(2.77) = 16/17 ≈ 0.94 → spam</text>

  <text x="24" y="252" font-size="12" fill="currentColor" opacity="0.55">check by products: p(x | spam) = 96/625,  p(x | ham) = 6/625,  ratio 16 = e²·⁷⁷</text>
  <text x="24" y="290" font-size="12.5" fill="currentColor">The verdict is a sum of per-word votes plus a prior — no term sees more than one feature.</text>
</svg>

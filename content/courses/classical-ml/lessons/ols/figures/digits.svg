<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- axes -->
  <line x1="70" y1="300" x2="600" y2="300" stroke="currentColor" stroke-width="1"/>
  <line x1="70" y1="300" x2="70" y2="50" stroke="currentColor" stroke-width="1"/>
  <!-- y ticks: correct digits 0, 8, 16 -->
  <line x1="66" y1="300" x2="70" y2="300" stroke="currentColor"/>
  <line x1="66" y1="180" x2="70" y2="180" stroke="currentColor"/>
  <line x1="66" y1="60" x2="70" y2="60" stroke="currentColor"/>
  <text x="60" y="304" font-size="11" text-anchor="end" fill="currentColor">0</text>
  <text x="60" y="184" font-size="11" text-anchor="end" fill="currentColor">8</text>
  <text x="60" y="64" font-size="11" text-anchor="end" fill="currentColor">16</text>
  <text x="24" y="170" font-size="11.5" fill="currentColor" transform="rotate(-90 24 170)" text-anchor="middle">correct digits in &#946;&#770;</text>
  <!-- x ticks: kappa(X) = 1, 10^4, 10^8, 10^12, 10^16 -->
  <line x1="70" y1="300" x2="70" y2="304" stroke="currentColor"/>
  <line x1="200" y1="300" x2="200" y2="304" stroke="currentColor"/>
  <line x1="330" y1="300" x2="330" y2="304" stroke="currentColor"/>
  <line x1="460" y1="300" x2="460" y2="304" stroke="currentColor"/>
  <line x1="590" y1="300" x2="590" y2="304" stroke="currentColor"/>
  <text x="70" y="318" font-size="11" text-anchor="middle" fill="currentColor">1</text>
  <text x="200" y="318" font-size="11" text-anchor="middle" fill="currentColor">10&#8308;</text>
  <text x="330" y="318" font-size="11" text-anchor="middle" fill="currentColor">10&#8312;</text>
  <text x="460" y="318" font-size="11" text-anchor="middle" fill="currentColor">10&#185;&#178;</text>
  <text x="590" y="318" font-size="11" text-anchor="middle" fill="currentColor">10&#185;&#8310;</text>
  <text x="600" y="334" font-size="11.5" text-anchor="end" fill="currentColor">&#954;(X)</text>
  <!-- guide at kappa = 10^8 -->
  <line x1="330" y1="300" x2="330" y2="130" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5"/>
  <!-- QR / SVD: digits = 16 - log10(kappa) -->
  <line x1="70" y1="60" x2="590" y2="300" stroke="#4c8dd6" stroke-width="2.5"/>
  <!-- normal equations: digits = 16 - 2 log10(kappa), floored at 0 -->
  <line x1="70" y1="60" x2="330" y2="300" stroke="#e2903a" stroke-width="2.5"/>
  <line x1="330" y1="300" x2="590" y2="300" stroke="#e2903a" stroke-width="2.5" opacity="0.45"/>
  <!-- the two verdicts at kappa = 10^8 -->
  <circle cx="330" cy="180" r="4" fill="#4c8dd6"/>
  <circle cx="330" cy="300" r="4" fill="#e2903a"/>
  <text x="342" y="176" font-size="12" fill="#4c8dd6">QR: 8 digits left</text>
  <text x="342" y="286" font-size="12" fill="#e2903a">normal equations: none</text>
  <!-- series labels -->
  <text x="200" y="112" font-size="12" fill="#4c8dd6">solve from X (QR, SVD): pay &#954;(X) once</text>
  <text x="80" y="250" font-size="12" fill="#e2903a">invert X&#7488;X: pay &#954;(X)&#178;</text>
  <text x="80" y="267" font-size="11.5" fill="#e2903a" opacity="0.85">digits go at twice the rate</text>
</svg>

<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4c8dd6"/>
    </marker>
  </defs>
  <!-- all linear estimators -->
  <rect x="30" y="30" width="580" height="240" rx="8" fill="none" stroke="currentColor" stroke-width="1" opacity="0.5"/>
  <text x="46" y="54" font-size="12" fill="currentColor" opacity="0.7">all linear estimators &#946;&#771; = Cy</text>
  <!-- the unbiased affine subspace: a band -->
  <polygon points="80,225 500,85 545,112 125,252" fill="currentColor" opacity="0.05"/>
  <line x1="80" y1="225" x2="500" y2="85" stroke="currentColor" stroke-width="1" stroke-dasharray="5 4" opacity="0.6"/>
  <line x1="125" y1="252" x2="545" y2="112" stroke="currentColor" stroke-width="1" stroke-dasharray="5 4" opacity="0.6"/>
  <text x="330" y="75" font-size="12" fill="currentColor">unbiased: CX = I&#8346;</text>
  <!-- variance contours around OLS -->
  <g fill="none" stroke="currentColor" opacity="0.3">
    <ellipse cx="300" cy="172" rx="46" ry="17" transform="rotate(-18 300 172)"/>
    <ellipse cx="300" cy="172" rx="92" ry="34" transform="rotate(-18 300 172)"/>
    <ellipse cx="300" cy="172" rx="138" ry="51" transform="rotate(-18 300 172)"/>
  </g>
  <!-- OLS at the minimum -->
  <circle cx="300" cy="172" r="5" fill="#e2903a"/>
  <text x="204" y="205" font-size="12" fill="#e2903a" font-weight="bold">OLS: C = (X&#7488;X)&#8315;&#185;X&#7488;</text>
  <!-- a competitor, one D away -->
  <line x1="306" y1="169" x2="432" y2="127" stroke="#4c8dd6" stroke-width="1.8" marker-end="url(#arrB)"/>
  <circle cx="438" cy="125" r="5" fill="#4c8dd6"/>
  <text x="366" y="132" font-size="12" fill="#4c8dd6">+ D, with DX = 0</text>
  <text x="448" y="147" font-size="12" fill="#4c8dd6">&#946;&#771; = [(X&#7488;X)&#8315;&#185;X&#7488; + D] y</text>
  <!-- the ledger -->
  <text x="46" y="300" font-size="12.5" fill="currentColor">Cov(&#946;&#771;) = &#963;&#178;[(X&#7488;X)&#8315;&#185; + DD&#7488;]&#8195;&#8212;&#8195;every step away from OLS adds the PSD term DD&#7488;</text>
</svg>

  <text x="70" y="128" font-size="11.5" fill="currentColor" opacity="0.55">the two middle terms merged: y&#7488;X&#946; is a scalar, so y&#7488;X&#946; = (y&#7488;X&#946;)&#7488; = &#946;&#7488;X&#7488;y</text>

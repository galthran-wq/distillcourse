<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- steps 1-2 (done, dimmed) -->
  <g opacity="0.4">
    <text x="40" y="40" font-size="12" fill="currentColor" font-weight="bold">step 1 &#8212; expand the square:</text>
    <text x="70" y="72" font-size="15" fill="currentColor">RSS(&#946;) = (y &#8722; X&#946;)&#7488;(y &#8722; X&#946;) =</text>
    <text x="330" y="72" font-size="15" fill="currentColor">y&#7488;y</text>
    <text x="378" y="72" font-size="15" fill="currentColor">&#8722; 2&#946;&#7488;X&#7488;y</text>
    <text x="472" y="72" font-size="15" fill="currentColor">+ &#946;&#7488;X&#7488;X&#946;</text>
    <text x="40" y="160" font-size="12" fill="currentColor" font-weight="bold">step 2 &#8212; differentiate term by term:</text>
    <text x="70" y="192" font-size="15" fill="currentColor">&#8711;&#946; RSS =</text>
    <text x="330" y="192" font-size="15" fill="currentColor">0</text>
    <text x="378" y="192" font-size="15" fill="currentColor">&#8722; 2X&#7488;y</text>
    <text x="472" y="192" font-size="15" fill="currentColor">+ 2X&#7488;X&#946;</text>
  </g>
  <!-- step 3: set to zero -->
  <text x="40" y="262" font-size="12" fill="currentColor" font-weight="bold">step 3 &#8212; set the gradient to zero and divide by 2:</text>
  <rect x="230" y="278" width="180" height="40" rx="6" fill="none" stroke="#e2903a" stroke-width="2"/>
  <text x="320" y="304" font-size="16" text-anchor="middle" fill="#e2903a">X&#7488;X&#946; = X&#7488;y</text>
  <text x="424" y="298" font-size="11.5" fill="currentColor">the normal equations:</text>
  <text x="424" y="313" font-size="11.5" fill="currentColor">p linear equations in p unknowns</text>
</svg>

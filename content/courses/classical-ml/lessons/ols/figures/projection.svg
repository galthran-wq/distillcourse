<svg viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/>
    </marker>
    <marker id="arrAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e2903a"/>
    </marker>
  </defs>
  <!-- the plane col(X) -->
  <polygon points="50,255 310,170 585,255 325,345" fill="currentColor" opacity="0.06"/>
  <polygon points="50,255 310,170 585,255 325,345" fill="none" stroke="currentColor" stroke-width="1" opacity="0.5"/>
  <text x="78" y="332" font-size="12" fill="currentColor" opacity="0.7">col(X) &#8838; &#8477;&#8319;: the span of the p columns</text>
  <!-- column vectors inside the plane -->
  <line x1="165" y1="272" x2="298" y2="311" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="165" y1="272" x2="272" y2="218" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="304" y="322" font-size="12" fill="currentColor">x&#8321;</text>
  <text x="278" y="214" font-size="12" fill="currentColor">x&#8322;</text>
  <!-- y (out of the plane) -->
  <line x1="165" y1="272" x2="446" y2="74" stroke="currentColor" stroke-width="2" marker-end="url(#arr)"/>
  <text x="454" y="72" font-size="13" fill="currentColor" font-weight="bold">y</text>
  <!-- y-hat (the projection, in the plane) -->
  <line x1="165" y1="272" x2="446" y2="250" stroke="#e2903a" stroke-width="2.5" marker-end="url(#arrAmber)"/>
  <text x="428" y="272" font-size="13" fill="#e2903a" font-weight="bold">&#375; = X&#946;&#770; = Hy</text>
  <!-- residual, perpendicular to the plane -->
  <line x1="450" y1="244" x2="450" y2="84" stroke="#4c8dd6" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="458" y="168" font-size="12.5" fill="#4c8dd6">r = y &#8722; &#375;</text>
  <text x="458" y="184" font-size="11" fill="#4c8dd6" opacity="0.85">X&#7488;r = 0</text>
  <!-- right-angle mark at the foot -->
  <path d="M 450 236 L 437 239 L 437 251" fill="none" stroke="#4c8dd6" stroke-width="1.2" opacity="0.8"/>
  <!-- takeaway -->
  <text x="50" y="40" font-size="12" fill="currentColor" opacity="0.7">&#375; is the point of col(X) nearest to y;</text>
  <text x="50" y="56" font-size="12" fill="currentColor" opacity="0.7">&#8220;residual &#8869; every column&#8221; is the normal equations</text>
</svg>

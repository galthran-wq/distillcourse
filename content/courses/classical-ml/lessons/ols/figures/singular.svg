<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrC" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/>
    </marker>
    <marker id="arrA2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e2903a"/>
    </marker>
  </defs>
  <!-- left panel: collapsed column space -->
  <text x="40" y="34" font-size="12" fill="currentColor" font-weight="bold">data space &#8477;&#8319;</text>
  <line x1="40" y1="284" x2="290" y2="86" stroke="currentColor" stroke-width="1" opacity="0.5"/>
  <text x="150" y="292" font-size="11.5" fill="currentColor" opacity="0.7">col(X): a line, not a plane</text>
  <!-- the two collinear columns -->
  <line x1="70" y1="257" x2="118" y2="219" stroke="currentColor" stroke-width="1.5" marker-end="url(#arrC)"/>
  <line x1="70" y1="257" x2="166" y2="181" stroke="currentColor" stroke-width="1.5" marker-end="url(#arrC)"/>
  <text x="120" y="243" font-size="11.5" fill="currentColor">x&#8321;</text>
  <text x="172" y="192" font-size="11.5" fill="currentColor">x&#8322; = 2x&#8321;</text>
  <!-- y and its projection -->
  <line x1="70" y1="257" x2="250" y2="68" stroke="currentColor" stroke-width="2" marker-end="url(#arrC)"/>
  <text x="256" y="66" font-size="12.5" fill="currentColor" font-weight="bold">y</text>
  <line x1="70" y1="257" x2="272" y2="96" stroke="#e2903a" stroke-width="2.5" marker-end="url(#arrA2)"/>
  <text x="255" y="130" font-size="12.5" fill="#e2903a" font-weight="bold">&#375;</text>
  <line x1="272" y1="96" x2="252" y2="71" stroke="#4c8dd6" stroke-width="1.8" stroke-dasharray="4 3"/>
  <text x="60" y="64" font-size="11.5" fill="#e2903a">the projection &#375; is still unique</text>
  <!-- divider -->
  <line x1="320" y1="30" x2="320" y2="300" stroke="currentColor" stroke-width="1" opacity="0.2"/>
  <!-- right panel: coefficient space -->
  <text x="350" y="34" font-size="12" fill="currentColor" font-weight="bold">coefficient space</text>
  <line x1="340" y1="230" x2="590" y2="230" stroke="currentColor" stroke-width="1"/>
  <line x1="380" y1="290" x2="380" y2="60" stroke="currentColor" stroke-width="1"/>
  <text x="588" y="246" font-size="11" text-anchor="end" fill="currentColor">&#946;&#8321;</text>
  <text x="368" y="68" font-size="11" text-anchor="end" fill="currentColor">&#946;&#8322;</text>
  <!-- the solution set -->
  <line x1="360" y1="130" x2="580" y2="240" stroke="#4c8dd6" stroke-width="2" stroke-dasharray="6 4"/>
  <circle cx="560" cy="230" r="4.5" fill="#4c8dd6"/>
  <circle cx="380" cy="140" r="4.5" fill="#4c8dd6"/>
  <text x="488" y="264" font-size="11" fill="#4c8dd6">(&#265;, 0)</text>
  <text x="390" y="136" font-size="11" fill="#4c8dd6">(0, &#265;/2)</text>
  <text x="430" y="102" font-size="11.5" fill="#4c8dd6">&#946;&#8321; + 2&#946;&#8322; = &#265;: every point gives the same &#375;</text>
  <!-- minimum-norm choice -->
  <line x1="380" y1="230" x2="416" y2="158" stroke="#5aa46a" stroke-width="1.2" stroke-dasharray="2 3"/>
  <circle cx="416" cy="158" r="4.5" fill="#5aa46a"/>
  <text x="428" y="176" font-size="11.5" fill="#5aa46a">the minimum-norm solution</text>
</svg>

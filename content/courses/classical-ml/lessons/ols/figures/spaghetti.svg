<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- axes -->
  <line x1="60" y1="290" x2="600" y2="290" stroke="currentColor" stroke-width="1"/>
  <line x1="60" y1="290" x2="60" y2="40" stroke="currentColor" stroke-width="1"/>
  <text x="598" y="308" font-size="11" text-anchor="end" fill="currentColor">x</text>
  <text x="48" y="48" font-size="11" text-anchor="end" fill="currentColor">y</text>
  <!-- sixteen least-squares fits, one per noise draw (blue, thin) -->
  <g stroke="#4c8dd6" stroke-width="1.2" opacity="0.4">
    <line x1="70" y1="236" x2="570" y2="124"/>
    <line x1="70" y1="263" x2="570" y2="96"/>
    <line x1="70" y1="244" x2="570" y2="118"/>
    <line x1="70" y1="258" x2="570" y2="103"/>
    <line x1="70" y1="228" x2="570" y2="131"/>
    <line x1="70" y1="252" x2="570" y2="109"/>
    <line x1="70" y1="240" x2="570" y2="120"/>
    <line x1="70" y1="266" x2="570" y2="92"/>
    <line x1="70" y1="233" x2="570" y2="127"/>
    <line x1="70" y1="249" x2="570" y2="105"/>
    <line x1="70" y1="256" x2="570" y2="119"/>
    <line x1="70" y1="238" x2="570" y2="99"/>
    <line x1="70" y1="261" x2="570" y2="112"/>
    <line x1="70" y1="231" x2="570" y2="122"/>
    <line x1="70" y1="247" x2="570" y2="130"/>
    <line x1="70" y1="254" x2="570" y2="88"/>
  </g>
  <!-- the true line (amber, thick) -->
  <line x1="70" y1="250" x2="570" y2="110" stroke="#e2903a" stroke-width="3"/>
  <!-- the average of the fits (green, dashed), sitting on the truth -->
  <line x1="70" y1="247" x2="570" y2="107" stroke="#5aa46a" stroke-width="1.8" stroke-dasharray="6 5"/>
  <!-- labels -->
  <text x="80" y="70" font-size="12" fill="#4c8dd6">one thin line per noise draw: the fit swings with &#949;</text>
  <text x="80" y="87" font-size="11.5" fill="#4c8dd6" opacity="0.85">the spread of the lines is Cov(&#946;&#770;) = &#963;&#178;(X&#7488;X)&#8315;&#185;</text>
  <text x="352" y="216" font-size="12" fill="#e2903a">the true line E[y] = X&#946;</text>
  <text x="352" y="233" font-size="12" fill="#5aa46a">dashed: the fits&#8217; average &#8212; E[&#946;&#770;] = &#946;</text>
</svg>

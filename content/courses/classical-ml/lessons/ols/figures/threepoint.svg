<svg viewBox="0 0 480 310" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- axes -->
  <line x1="60" y1="270" x2="450" y2="270" stroke="currentColor" stroke-width="1"/>
  <line x1="60" y1="270" x2="60" y2="50" stroke="currentColor" stroke-width="1"/>
  <text x="448" y="288" font-size="11" text-anchor="end" fill="currentColor">x</text>
  <text x="48" y="58" font-size="11" text-anchor="end" fill="currentColor">y</text>
  <!-- x ticks at 0,1,2 -->
  <line x1="100" y1="270" x2="100" y2="274" stroke="currentColor"/>
  <line x1="260" y1="270" x2="260" y2="274" stroke="currentColor"/>
  <line x1="420" y1="270" x2="420" y2="274" stroke="currentColor"/>
  <text x="100" y="288" font-size="10.5" text-anchor="middle" fill="currentColor" opacity="0.55">0</text>
  <text x="260" y="288" font-size="10.5" text-anchor="middle" fill="currentColor" opacity="0.55">1</text>
  <text x="420" y="288" font-size="10.5" text-anchor="middle" fill="currentColor" opacity="0.55">2</text>
  <!-- y ticks at 1,2 -->
  <line x1="56" y1="200" x2="60" y2="200" stroke="currentColor"/>
  <line x1="56" y1="130" x2="60" y2="130" stroke="currentColor"/>
  <text x="50" y="204" font-size="10.5" text-anchor="end" fill="currentColor" opacity="0.55">1</text>
  <text x="50" y="134" font-size="10.5" text-anchor="end" fill="currentColor" opacity="0.55">2</text>
  <!-- fitted line y = 7/6 + x/2 (amber) -->
  <line x1="76" y1="193.6" x2="444" y2="113.1" stroke="#e2903a" stroke-width="2.5"/>
  <text x="300" y="110" font-size="12" fill="#e2903a">&#375; = 7/6 + x/2</text>
  <!-- residual segments (blue dashed) -->
  <line x1="100" y1="200" x2="100" y2="188.3" stroke="#4c8dd6" stroke-width="2" stroke-dasharray="3 3"/>
  <line x1="260" y1="130" x2="260" y2="153.3" stroke="#4c8dd6" stroke-width="2" stroke-dasharray="3 3"/>
  <line x1="420" y1="130" x2="420" y2="118.3" stroke="#4c8dd6" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="108" y="198" font-size="11" fill="#4c8dd6">r&#8321; = &#8722;1/6</text>
  <text x="268" y="146" font-size="11" fill="#4c8dd6">r&#8322; = +1/3</text>
  <text x="342" y="132" font-size="11" fill="#4c8dd6">r&#8323; = &#8722;1/6</text>
  <!-- data points -->
  <circle cx="100" cy="200" r="4.5" fill="currentColor"/>
  <circle cx="260" cy="130" r="4.5" fill="currentColor"/>
  <circle cx="420" cy="130" r="4.5" fill="currentColor"/>
  <!-- the two orthogonality facts, visible in the numbers -->
  <text x="72" y="66" font-size="11.5" fill="#4c8dd6">&#931; r&#7522; = 0&#8195;and&#8195;&#931; x&#7522; r&#7522; = 0</text>
  <text x="72" y="82" font-size="11" fill="currentColor" opacity="0.55">the residuals are orthogonal to both columns of X</text>
</svg>

<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; font-size: 12px; }
    .head  { fill: currentColor; font-size: 12.5px; font-weight: 600; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .axis  { stroke: currentColor; stroke-opacity: 0.3; stroke-width: 1; fill: none; }
  </style>

  <!-- left panel: the centered cloud with its principal axes -->
  <line class="axis" x1="40" y1="165" x2="262" y2="165"/>
  <line class="axis" x1="150" y1="55" x2="150" y2="277"/>
  <text class="muted" x="266" y="169">x&#8321;</text>
  <text class="muted" x="144" y="48">x&#8322;</text>

  <!-- PC1 axis, length ~ sqrt(lambda1) -->
  <line x1="81.3" y1="233.7" x2="215" y2="100" stroke="#e2903a" stroke-width="2.5"/>
  <polygon points="218.7,96.3 214.8,106.6 208.4,100.2" fill="#e2903a"/>
  <text x="214" y="78" text-anchor="end" fill="#e2903a" font-weight="600" font-size="12.5">PC1, &#955;&#8321; = 3.33</text>

  <!-- PC2 axis, length ~ sqrt(lambda2) -->
  <line x1="176.3" y1="191.3" x2="127" y2="142" stroke="#4c8dd6" stroke-width="2.5"/>
  <polygon points="123.7,138.7 127.6,149.0 134.0,142.6" fill="#4c8dd6"/>
  <text x="118" y="130" text-anchor="end" fill="#4c8dd6" font-weight="600" font-size="12.5">PC2, &#955;&#8322; = 0.67</text>

  <!-- the six centered points -->
  <circle cx="226" cy="89"  r="4.5" fill="currentColor"/>
  <circle cx="188" cy="127" r="4.5" fill="currentColor"/>
  <circle cx="112" cy="203" r="4.5" fill="currentColor"/>
  <circle cx="74"  cy="241" r="4.5" fill="currentColor"/>
  <circle cx="188" cy="203" r="4.5" fill="currentColor"/>
  <circle cx="112" cy="127" r="4.5" fill="currentColor"/>
  <text class="muted" x="150" y="305" text-anchor="middle">the six centered points, axes drawn at the mean</text>

  <!-- right panel: two projections compared -->
  <text class="head" x="340" y="76" fill="#e2903a">projections onto PC1</text>
  <line class="axis" x1="340" y1="110" x2="620" y2="110" stroke-opacity="0.45"/>
  <line x1="480" y1="104" x2="480" y2="116" stroke="currentColor" stroke-opacity="0.45"/>
  <circle cx="565" cy="110" r="4" fill="#e2903a"/>
  <circle cx="522" cy="110" r="4" fill="#e2903a"/>
  <circle cx="438" cy="110" r="4" fill="#e2903a"/>
  <circle cx="395" cy="110" r="4" fill="#e2903a"/>
  <circle cx="480" cy="104" r="4" fill="#e2903a"/>
  <circle cx="480" cy="116" r="4" fill="#e2903a"/>
  <text class="muted" x="395" y="132" text-anchor="middle">&#8722;2.83</text>
  <text class="muted" x="438" y="132" text-anchor="middle">&#8722;1.41</text>
  <text class="muted" x="480" y="132" text-anchor="middle">0, 0</text>
  <text class="muted" x="522" y="132" text-anchor="middle">1.41</text>
  <text class="muted" x="565" y="132" text-anchor="middle">2.83</text>
  <text class="label" x="620" y="152" text-anchor="end" font-weight="600">variance = 10/3 &#8776; 3.33</text>

  <text class="head" x="340" y="190" fill="#4c8dd6">projections onto the x&#8321;-axis</text>
  <line class="axis" x1="340" y1="222" x2="620" y2="222" stroke-opacity="0.45"/>
  <line x1="480" y1="216" x2="480" y2="228" stroke="currentColor" stroke-opacity="0.45"/>
  <circle cx="540" cy="222" r="4" fill="#4c8dd6"/>
  <circle cx="510" cy="217" r="4" fill="#4c8dd6"/>
  <circle cx="510" cy="227" r="4" fill="#4c8dd6"/>
  <circle cx="450" cy="217" r="4" fill="#4c8dd6"/>
  <circle cx="450" cy="227" r="4" fill="#4c8dd6"/>
  <circle cx="420" cy="222" r="4" fill="#4c8dd6"/>
  <text class="muted" x="420" y="244" text-anchor="middle">&#8722;2</text>
  <text class="muted" x="450" y="244" text-anchor="middle">&#8722;1, &#8722;1</text>
  <text class="muted" x="510" y="244" text-anchor="middle">1, 1</text>
  <text class="muted" x="540" y="244" text-anchor="middle">2</text>
  <text class="label" x="620" y="264" text-anchor="end" font-weight="600">variance = 2.00</text>
</svg>

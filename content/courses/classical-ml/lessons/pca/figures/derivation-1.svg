<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .f     { fill: currentColor; font-size: 15px; }
    .step  { fill: currentColor; opacity: 0.55; font-size: 11.5px; font-weight: 600; letter-spacing: 0.04em; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .axis  { stroke: currentColor; stroke-opacity: 0.18; stroke-width: 1; }
  </style>

  <!-- left: unit circle of candidate directions over the faint cloud -->
  <line class="axis" x1="35" y1="150" x2="195" y2="150"/>
  <line class="axis" x1="115" y1="70" x2="115" y2="230"/>
  <circle cx="115" cy="150" r="72" fill="none" stroke="currentColor" stroke-opacity="0.4"/>
  <g fill="currentColor" opacity="0.3">
    <circle cx="167" cy="98" r="3"/><circle cx="141" cy="124" r="3"/><circle cx="89" cy="176" r="3"/>
    <circle cx="63" cy="202" r="3"/><circle cx="141" cy="176" r="3"/><circle cx="89" cy="124" r="3"/>
  </g>
  <line x1="115" y1="150" x2="179" y2="126.7" stroke="#e2903a" stroke-width="2.5"/>
  <polygon points="182.7,125.4 174.8,133.0 171.8,124.6" fill="#e2903a"/>
  <text x="189" y="122" fill="#e2903a" font-weight="600">u</text>
  <text class="muted" x="115" y="262" text-anchor="middle">candidate directions: the unit circle</text>

  <!-- ledger, step 1 -->
  <text class="step" x="235" y="58">1 &#183; OBJECTIVE AND CONSTRAINT</text>
  <text class="f" x="235" y="82">Var(u&#7488;x) = u&#7488;&#931;&#770;u,&#160;&#160;&#160;<tspan fill="#4c8dd6">u&#7488;u = 1</tspan></text>
  <text class="muted" x="235" y="104">u along x&#8321;-axis: 2.00&#160;&#160;&#160;&#160;u at 45&#176;: 3.33</text>
  <text class="muted" x="235" y="126">maximize over unit u &#8212; unbounded without the <tspan fill="#4c8dd6" opacity="1">blue</tspan> constraint</text>
</svg>

<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; font-size: 12px; }
    .head  { fill: currentColor; font-size: 13px; font-weight: 600; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .blk   { stroke: currentColor; stroke-opacity: 0.6; fill: none; }
  </style>

  <!-- X block -->
  <rect class="blk" x="55" y="60" width="80" height="130" rx="3"/>
  <text class="label" x="95" y="130" text-anchor="middle" font-weight="600" font-size="14">X</text>
  <text class="muted" x="95" y="206" text-anchor="middle">n &#215; d, centered</text>

  <text class="label" x="160" y="130" text-anchor="middle" font-size="15">=</text>

  <!-- U block with first q columns shaded -->
  <rect x="185" y="60" width="26" height="130" fill="#e2903a" opacity="0.35"/>
  <rect class="blk" x="185" y="60" width="80" height="130" rx="3"/>
  <text class="label" x="225" y="130" text-anchor="middle" font-weight="600" font-size="14">U</text>
  <text class="muted" x="225" y="206" text-anchor="middle">left singular</text>
  <text class="muted" x="225" y="219" text-anchor="middle">vectors u&#8342;</text>

  <!-- D block: diagonal, with top-left q x q shaded -->
  <rect x="290" y="60" width="21" height="21" fill="#e2903a" opacity="0.35"/>
  <rect class="blk" x="290" y="60" width="65" height="65" rx="3"/>
  <circle cx="298" cy="68"  r="2.4" fill="currentColor"/>
  <circle cx="309" cy="79"  r="2.4" fill="currentColor"/>
  <circle cx="320" cy="90"  r="2.4" fill="currentColor" opacity="0.65"/>
  <circle cx="331" cy="101" r="2.4" fill="currentColor" opacity="0.45"/>
  <circle cx="342" cy="112" r="2.4" fill="currentColor" opacity="0.3"/>
  <text class="label" x="322" y="146" text-anchor="middle" font-weight="600" font-size="14">D</text>
  <text class="muted" x="322" y="162" text-anchor="middle">diagonal</text>

  <!-- V^T block with first q rows shaded -->
  <rect x="380" y="60" width="65" height="21" fill="#e2903a" opacity="0.35"/>
  <rect class="blk" x="380" y="60" width="65" height="65" rx="3"/>
  <text class="label" x="412" y="146" text-anchor="middle" font-weight="600" font-size="14">V&#7488;</text>
  <text class="muted" x="412" y="162" text-anchor="middle">rows = principal</text>
  <text class="muted" x="412" y="175" text-anchor="middle">directions v&#8342;&#7488;</text>

  <!-- truncation callout -->
  <rect x="470" y="60" width="14" height="14" fill="#e2903a" opacity="0.35"/>
  <text class="label" x="492" y="71">keep the top q of each:</text>
  <text class="label" x="492" y="88">the best rank-q</text>
  <text class="label" x="492" y="105">approximation of X</text>
  <text class="muted" x="492" y="124">(Eckart&#8211;Young)</text>

  <!-- the two identities -->
  <text class="label" x="55" y="250">covariance:&#160;&#160;&#931;&#770; = V (D&#178;/n) V&#7488;&#160;&#160;&#8658;&#160;&#160;<tspan fill="#e2903a" font-weight="600">&#955;&#8342; = d&#8342;&#178;/n</tspan></text>
  <text class="label" x="330" y="250">scores:&#160;&#160;Z = XV = UD</text>

  <!-- warning: never form X^T X -->
  <line x1="55" y1="268" x2="590" y2="268" stroke="currentColor" stroke-opacity="0.2"/>
  <text class="label" x="55" y="292" font-weight="600">never form X&#7488;X:</text>
  <text class="label" x="185" y="292">&#954;(X&#7488;X) = &#954;(X)&#178; &#8212; squaring the condition number drowns the</text>
  <text class="label" x="185" y="310">small-d&#8342; directions in rounding error; run the SVD on X itself</text>
</svg>

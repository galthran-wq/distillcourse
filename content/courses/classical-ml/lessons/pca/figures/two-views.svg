<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; font-size: 12px; }
    .head  { fill: currentColor; font-size: 13px; font-weight: 600; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .axis  { stroke: currentColor; stroke-opacity: 0.18; stroke-width: 1; }
  </style>

  <!-- left: the six centered points, PC1 line, residual perpendiculars -->
  <line class="axis" x1="25" y1="160" x2="245" y2="160"/>
  <line class="axis" x1="130" y1="55" x2="130" y2="272"/>

  <!-- PC1 line through the origin at 45 degrees, amber -->
  <line x1="45" y1="245" x2="222" y2="68" stroke="#e2903a" stroke-width="2.5"/>
  <polygon points="226,64 222.5,74.5 215.5,67.5" fill="#e2903a"/>
  <text x="232" y="60" fill="#e2903a" font-weight="600" font-size="12.5">u&#8321;</text>

  <!-- the four on-line points -->
  <circle cx="210" cy="80"  r="4.5" fill="currentColor"/>
  <circle cx="170" cy="120" r="4.5" fill="currentColor"/>
  <circle cx="90"  cy="200" r="4.5" fill="currentColor"/>
  <circle cx="50"  cy="240" r="4.5" fill="currentColor"/>

  <!-- the two off-line points with dashed residual perpendiculars to the line -->
  <circle cx="170" cy="200" r="4.5" fill="currentColor"/>
  <circle cx="90"  cy="120" r="4.5" fill="currentColor"/>
  <line x1="170" y1="200" x2="130" y2="160" stroke="#4c8dd6" stroke-width="1.8" stroke-dasharray="4 3"/>
  <line x1="90"  y1="120" x2="130" y2="160" stroke="#4c8dd6" stroke-width="1.8" stroke-dasharray="4 3"/>
  <!-- their common projection: the origin -->
  <circle cx="130" cy="160" r="4" fill="#e2903a"/>
  <!-- right-angle markers where the residuals meet the line -->
  <path d="M137.8 152.2 L145.6 160 L137.8 167.8" fill="none" stroke="currentColor" stroke-opacity="0.55" stroke-width="1"/>

  <text class="muted" x="178" y="216">residual &#8869; u&#8321;</text>
  <text class="muted" x="25" y="290">four points lie on the line (residual 0);</text>
  <text class="muted" x="25" y="304">the two off it project to the mean</text>

  <!-- right: the identity ledger -->
  <text class="head" x="330" y="66">one identity, two problems</text>
  <text class="label" x="330" y="96">total&#160;=&#160;<tspan fill="#e2903a" font-weight="600">kept along u</tspan>&#160;+&#160;<tspan fill="#4c8dd6" font-weight="600">lost across u</tspan></text>
  <text class="muted" x="330" y="118">tr &#931;&#770; (fixed)&#160;&#160;&#160;u&#7488;&#931;&#770;u (maximize)&#160;&#160;&#160;mean &#8214;x&#8722;x&#770;&#8214;&#178; (minimize)</text>
  <text class="label" x="330" y="148">at u = u&#8321;:&#160;&#160;4.00&#160;=&#160;<tspan fill="#e2903a" font-weight="600">3.33</tspan>&#160;+&#160;<tspan fill="#4c8dd6" font-weight="600">0.67</tspan></text>
  <text class="label" x="330" y="172">at u = x&#8321;-axis:&#160;&#160;4.00&#160;=&#160;2.00&#160;+&#160;2.00</text>

  <!-- variance bar at u1 -->
  <text class="muted" x="330" y="204" font-size="11">the split at u&#8321; (best possible: lost = &#955;&#8322;)</text>
  <rect x="330" y="212" width="216.5" height="24" fill="#e2903a"/>
  <rect x="546.5" y="212" width="43.5" height="24" fill="#4c8dd6"/>
  <text x="438" y="254" text-anchor="middle" fill="#e2903a" font-size="12" font-weight="600">kept = &#955;&#8321; = 3.33</text>
  <text x="590" y="272" text-anchor="end" fill="#4c8dd6" font-size="12" font-weight="600">lost = &#955;&#8322; = 0.67</text>
</svg>

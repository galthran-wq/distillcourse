<text x="434" y="208" font-size="12" fill="currentColor" opacity="0.55" text-anchor="middle">&#8734;</text>
<text x="560" y="208" font-size="12" fill="#5aa46a" text-anchor="middle">&#923;&#8730;(Tr[K])/n</text>

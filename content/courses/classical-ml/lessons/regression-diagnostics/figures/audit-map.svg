<svg viewBox="0 0 672 418" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .lab { fill: currentColor; font-size: 12.5px; }
    .ax { stroke: currentColor; stroke-width: 1; opacity: 0.7; fill: none; }
    .guide { stroke: currentColor; stroke-width: 1; stroke-dasharray: 3 3; opacity: 0.5; fill: none; }
  </style>
  <text class="muted" x="130" y="34" text-anchor="middle">THE GUARANTEE</text>
  <text class="muted" x="330" y="34" text-anchor="middle">PAID FOR BY</text>
  <text class="muted" x="530" y="34" text-anchor="middle">AUDITED WITH</text>
  <rect x="26" y="52" width="208" height="66" rx="6" class="ax"/>
  <text class="lab" x="130" y="78" text-anchor="middle" font-size="12">existence &amp; uniqueness</text>
  <text x="130" y="98" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.75">&#946;&#770; = (X&#7488;X)&#8315;&#185;X&#7488;y</text>
  <line x1="234" y1="85" x2="252" y2="85" stroke="currentColor" opacity="0.5" stroke-width="1.2"/>
  <rect x="252" y="52" width="166" height="66" rx="6" fill="none" stroke="#e2903a" stroke-width="1.6"/>
  <text x="335" y="78" text-anchor="middle" font-size="12" fill="#e2903a">GM3</text>
  <text x="335" y="97" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.65">full column rank</text>
  <line x1="418" y1="85" x2="436" y2="85" stroke="currentColor" opacity="0.5" stroke-width="1.2"/>
  <text x="440" y="78" font-size="11.5" fill="#4c8dd6">VIF; the flat RSS valley</text>
  <text x="440" y="110" font-size="10.5" fill="currentColor" opacity="0.6">near-failure: SEs inflate, signs swing</text>
  <rect x="26" y="140" width="208" height="66" rx="6" class="ax"/>
  <text class="lab" x="130" y="166" text-anchor="middle" font-size="12">unbiasedness</text>
  <text x="130" y="186" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.75">E[&#946;&#770;] = &#946;</text>
  <line x1="234" y1="173" x2="252" y2="173" stroke="currentColor" opacity="0.5" stroke-width="1.2"/>
  <rect x="252" y="140" width="166" height="66" rx="6" fill="none" stroke="#e2903a" stroke-width="1.6"/>
  <text x="335" y="166" text-anchor="middle" font-size="12" fill="#e2903a">GM1</text>
  <text x="335" y="185" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.65">E[&#949;] = 0 (mean model right)</text>
  <line x1="418" y1="173" x2="436" y2="173" stroke="currentColor" opacity="0.5" stroke-width="1.2"/>
  <text x="440" y="166" font-size="11.5" fill="#4c8dd6">curvature in residuals vs fitted</text>
  <text x="440" y="198" font-size="10.5" fill="currentColor" opacity="0.6">failure: the fit is biased everywhere</text>
  <line x1="130" y1="118" x2="130" y2="137" stroke="currentColor" opacity="0.5" stroke-width="1.2" marker-end="url(#arr)"/>
  <rect x="26" y="228" width="208" height="66" rx="6" class="ax"/>
  <text class="lab" x="130" y="254" text-anchor="middle" font-size="12">covariance formula, BLUE</text>
  <text x="130" y="274" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.75">Cov(&#946;&#770;) = &#963;&#178;(X&#7488;X)&#8315;&#185;</text>
  <line x1="234" y1="261" x2="252" y2="261" stroke="currentColor" opacity="0.5" stroke-width="1.2"/>
  <rect x="252" y="228" width="166" height="66" rx="6" fill="none" stroke="#e2903a" stroke-width="1.6"/>
  <text x="335" y="254" text-anchor="middle" font-size="12" fill="#e2903a">GM2</text>
  <text x="335" y="273" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.65">Cov(&#949;) = &#963;&#178;I</text>
  <line x1="418" y1="261" x2="436" y2="261" stroke="currentColor" opacity="0.5" stroke-width="1.2"/>
  <text x="440" y="248" font-size="11.5" fill="#4c8dd6">funnel: unequal variance;</text>
  <text x="440" y="263" font-size="11.5" fill="#4c8dd6">tracking: correlated errors</text>
  <text x="440" y="286" font-size="10.5" fill="currentColor" opacity="0.6">failure: SEs, t, p wrong; WLS beats OLS</text>
  <line x1="130" y1="206" x2="130" y2="225" stroke="currentColor" opacity="0.5" stroke-width="1.2" marker-end="url(#arr)"/>
  <rect x="26" y="316" width="208" height="66" rx="6" class="ax"/>
  <text class="lab" x="130" y="342" text-anchor="middle" font-size="12">exact t and F pivots</text>
  <text x="130" y="362" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.75">&#946;&#770;&#11388; / se &#8764; t&#8345;&#8331;&#8346;</text>
  <line x1="234" y1="349" x2="252" y2="349" stroke="currentColor" opacity="0.5" stroke-width="1.2"/>
  <rect x="252" y="316" width="166" height="66" rx="6" fill="none" stroke="#e2903a" stroke-width="1.6"/>
  <text x="335" y="342" text-anchor="middle" font-size="12" fill="#e2903a">normality</text>
  <text x="335" y="361" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.65">&#949; Gaussian (beyond GM)</text>
  <line x1="418" y1="349" x2="436" y2="349" stroke="currentColor" opacity="0.5" stroke-width="1.2"/>
  <text x="440" y="342" font-size="11.5" fill="#4c8dd6">studentized residuals beyond &#177;3</text>
  <text x="440" y="374" font-size="10.5" fill="currentColor" opacity="0.6">failure: t/F only approximate</text>
  <line x1="130" y1="294" x2="130" y2="313" stroke="currentColor" opacity="0.5" stroke-width="1.2" marker-end="url(#arr)"/>
  <defs><marker id="arr" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L6,3.5 L0,7 z" fill="currentColor" opacity="0.6"/></marker></defs>
  <text class="muted" x="330" y="406" text-anchor="middle">each step adds one assumption: a violation costs the guarantees at and below its row, never above</text>
</svg>

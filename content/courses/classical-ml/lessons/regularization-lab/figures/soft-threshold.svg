<svg viewBox="0 0 560 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="14">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .axis { stroke: currentColor; opacity: 0.35; }
  </style>

  <!-- axes: input z (horizontal), penalized estimate (vertical) -->
  <line class="axis" x1="28" y1="170" x2="452" y2="170"/>
  <line class="axis" x1="240" y1="20" x2="240" y2="288"/>
  <text class="muted" x="452" y="190">z</text>
  <text class="muted" x="232" y="34" text-anchor="end">estimate</text>

  <!-- OLS identity: no shrinkage -->
  <line x1="42" y1="308" x2="438" y2="32" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.5"/>
  <text class="muted" x="446" y="37">OLS</text>

  <!-- ridge: multiplicative shrinkage, never zero -->
  <line x1="42" y1="273.5" x2="438" y2="66.5" stroke="#4c8dd6" stroke-width="2.5"/>
  <text x="446" y="72" fill="#4c8dd6">ridge</text>

  <!-- lasso: soft threshold S(z, γ), flat at zero on [−γ, γ] -->
  <polyline points="42,239 141,170 339,170 438,101" fill="none" stroke="#e2903a" stroke-width="3" stroke-linejoin="round"/>
  <text x="446" y="106" fill="#e2903a">lasso S(z, γ)</text>

  <!-- the flat interval -->
  <line class="axis" x1="141" y1="172" x2="141" y2="180"/>
  <line class="axis" x1="339" y1="172" x2="339" y2="180"/>
  <text class="muted" x="141" y="196" text-anchor="middle">−γ</text>
  <text class="muted" x="339" y="196" text-anchor="middle">γ</text>
  <text x="128" y="118" text-anchor="middle" fill="#e2903a" font-size="13">exactly zero for |z| ≤ γ</text>
  <line x1="146" y1="128" x2="168" y2="157" stroke="#e2903a" stroke-width="1.5" opacity="0.7"/>
  <polygon points="171,162 161,157 168,152" fill="#e2903a" opacity="0.7"/>

  <text class="muted" x="252" y="312" text-anchor="middle">ridge rescales; the lasso's flat interval makes exact zeros</text>
</svg>

<svg viewBox="0 0 648 312" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- legend -->
  <g font-size="11" fill="currentColor">
    <rect x="120" y="8" width="12" height="12" fill="#4c8dd6"/>
    <text x="137" y="18">bagging</text>
    <rect x="205" y="8" width="12" height="12" fill="#5aa46a"/>
    <text x="222" y="18">random forest</text>
    <rect x="322" y="8" width="12" height="12" fill="#e2903a"/>
    <text x="339" y="18">gradient boosting</text>
    <rect x="462" y="8" width="12" height="12" fill="none" stroke="currentColor"/>
    <text x="479" y="18">XGBoost</text>
  </g>

  <!-- y axis -->
  <line x1="60" y1="30" x2="60" y2="230" stroke="currentColor"/>
  <line x1="60" y1="230" x2="600" y2="230" stroke="currentColor"/>
  <g fill="currentColor" font-size="11" text-anchor="end">
    <text x="54" y="234">0</text>
    <text x="54" y="134">50</text>
    <text x="54" y="34">100</text>
  </g>
  <line x1="60" y1="130" x2="600" y2="130" stroke="currentColor" stroke-dasharray="3 3" opacity="0.35"/>
  <text x="14" y="24" fill="currentColor" font-size="11">still wrong (%)</text>

  <!-- group 1: 50–70% of bagged trees wrong -->
  <rect x="110" y="30" width="24" height="200" fill="#4c8dd6"/>
  <rect x="140" y="118" width="24" height="112" fill="#5aa46a"/>
  <rect x="170" y="162" width="24" height="68" fill="#e2903a"/>
  <rect x="200" y="148" width="24" height="82" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="122" y="26" fill="currentColor" font-size="10" opacity="0.55" text-anchor="middle">100</text>
  <text x="152" y="114" fill="currentColor" font-size="10" opacity="0.55" text-anchor="middle">56</text>
  <text x="182" y="158" fill="currentColor" font-size="10" opacity="0.55" text-anchor="middle">34</text>
  <text x="212" y="144" fill="currentColor" font-size="10" opacity="0.55" text-anchor="middle">41</text>

  <!-- group 2: 70–90% wrong -->
  <rect x="300" y="30" width="24" height="200" fill="#4c8dd6"/>
  <rect x="330" y="42" width="24" height="188" fill="#5aa46a"/>
  <rect x="360" y="72" width="24" height="158" fill="#e2903a"/>
  <rect x="390" y="90" width="24" height="140" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="312" y="26" fill="currentColor" font-size="10" opacity="0.55" text-anchor="middle">100</text>
  <text x="342" y="38" fill="currentColor" font-size="10" opacity="0.55" text-anchor="middle">94</text>
  <text x="372" y="68" fill="currentColor" font-size="10" opacity="0.55" text-anchor="middle">79</text>
  <text x="402" y="86" fill="currentColor" font-size="10" opacity="0.55" text-anchor="middle">70</text>

  <!-- group 3: 90–100% wrong -->
  <rect x="480" y="30" width="24" height="200" fill="#4c8dd6"/>
  <rect x="510" y="30" width="24" height="200" fill="#5aa46a"/>
  <rect x="540" y="42" width="24" height="188" fill="#e2903a"/>
  <rect x="570" y="30" width="24" height="200" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="492" y="26" fill="currentColor" font-size="10" opacity="0.55" text-anchor="middle">100</text>
  <text x="522" y="26" fill="currentColor" font-size="10" opacity="0.55" text-anchor="middle">100</text>
  <text x="552" y="38" fill="currentColor" font-size="10" opacity="0.55" text-anchor="middle">94</text>
  <text x="582" y="26" fill="currentColor" font-size="10" opacity="0.55" text-anchor="middle">100</text>

  <!-- group labels -->
  <g fill="currentColor" font-size="11" text-anchor="middle">
    <text x="167" y="250">50–70% of bagged</text>
    <text x="167" y="264">trees wrong</text>
    <text x="167" y="280" opacity="0.55">32 messages · disagreement</text>
    <text x="357" y="250">70–90%</text>
    <text x="357" y="280" opacity="0.55">33 messages · shared error</text>
    <text x="537" y="250">90–100%</text>
    <text x="537" y="280" opacity="0.55">17 messages · near-unanimous</text>
  </g>
  <g fill="currentColor" font-size="10" opacity="0.55" text-anchor="middle">
    <text x="167" y="298">variance territory</text>
    <text x="357" y="298">bias territory</text>
    <text x="537" y="298">no method's territory</text>
  </g>
</svg>

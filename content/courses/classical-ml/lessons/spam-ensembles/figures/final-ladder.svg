<svg viewBox="0 0 640 312" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- vertical guides -->
  <g stroke="currentColor" stroke-dasharray="3 3" opacity="0.25">
    <line x1="200" y1="36" x2="200" y2="284"/>
    <line x1="300" y1="36" x2="300" y2="284"/>
    <line x1="400" y1="36" x2="400" y2="284"/>
    <line x1="500" y1="36" x2="500" y2="284"/>
    <line x1="600" y1="36" x2="600" y2="284"/>
  </g>
  <line x1="200" y1="284" x2="600" y2="284" stroke="currentColor"/>
  <g fill="currentColor" font-size="11" text-anchor="middle">
    <text x="200" y="298">4</text>
    <text x="300" y="298">6</text>
    <text x="400" y="298">8</text>
    <text x="500" y="298">10</text>
    <text x="600" y="298">12</text>
  </g>
  <text x="400" y="311" fill="currentColor" font-size="11" text-anchor="middle">test error (%), 1,536 held-out messages</text>
  <!-- legend -->
  <g font-size="10" fill="currentColor" opacity="0.8">
    <circle cx="330" cy="18" r="4" fill="#e2903a"/>
    <text x="340" y="22">ours (whiskers ±1 SE)</text>
    <circle cx="480" cy="18" r="4" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <text x="490" y="22">published (ESL)</text>
  </g>

  <!-- rows -->
  <g font-size="11">
    <!-- naive Bayes -->
    <text x="8" y="52" fill="currentColor">naive Bayes</text>
    <text x="192" y="52" fill="currentColor" opacity="0.55" text-anchor="end">M4</text>
    <line x1="522" y1="48" x2="578" y2="48" stroke="#e2903a" opacity="0.4"/>
    <circle cx="550" cy="48" r="4" fill="#e2903a"/>
    <!-- pruned tree -->
    <text x="8" y="74" fill="currentColor">pruned tree</text>
    <text x="192" y="74" fill="currentColor" opacity="0.55" text-anchor="end">M6</text>
    <circle cx="465" cy="70" r="4" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <line x1="387" y1="70" x2="443" y2="70" stroke="#e2903a" opacity="0.4"/>
    <circle cx="415" cy="70" r="4" fill="#e2903a"/>
    <!-- logistic raw -->
    <text x="8" y="96" fill="currentColor">logistic, raw features</text>
    <text x="192" y="96" fill="currentColor" opacity="0.55" text-anchor="end">M4</text>
    <circle cx="380" cy="92" r="4" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <!-- LDA -->
    <text x="8" y="118" fill="currentColor">LDA</text>
    <text x="192" y="118" fill="currentColor" opacity="0.55" text-anchor="end">M4</text>
    <line x1="302" y1="114" x2="358" y2="114" stroke="#e2903a" opacity="0.4"/>
    <circle cx="330" cy="114" r="4" fill="#e2903a"/>
    <!-- logistic log -->
    <text x="8" y="140" fill="currentColor">logistic, log features</text>
    <text x="192" y="140" fill="currentColor" opacity="0.55" text-anchor="end">M4</text>
    <line x1="267" y1="136" x2="323" y2="136" stroke="#e2903a" opacity="0.4"/>
    <circle cx="295" cy="136" r="4" fill="#e2903a"/>
    <!-- bagging -->
    <text x="8" y="162" fill="currentColor">bagging</text>
    <text x="192" y="162" fill="currentColor" opacity="0.55" text-anchor="end">M7</text>
    <circle cx="270" cy="158" r="4" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <line x1="237" y1="158" x2="293" y2="158" stroke="#e2903a" opacity="0.4"/>
    <circle cx="265" cy="158" r="4" fill="#e2903a"/>
    <!-- GAM -->
    <text x="8" y="184" fill="currentColor">additive logistic (GAM)</text>
    <text x="192" y="184" fill="currentColor" opacity="0.55" text-anchor="end">M3</text>
    <circle cx="265" cy="180" r="4" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <!-- RBF-SVM -->
    <text x="8" y="206" fill="currentColor">RBF-SVM</text>
    <text x="192" y="206" fill="currentColor" opacity="0.55" text-anchor="end">M4</text>
    <line x1="232" y1="202" x2="288" y2="202" stroke="#e2903a" opacity="0.4"/>
    <circle cx="260" cy="202" r="4" fill="#e2903a"/>
    <!-- random forest -->
    <text x="8" y="228" fill="currentColor">random forest</text>
    <text x="192" y="228" fill="currentColor" opacity="0.55" text-anchor="end">M7</text>
    <circle cx="244" cy="224" r="6" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <line x1="216" y1="224" x2="272" y2="224" stroke="#e2903a" opacity="0.4"/>
    <circle cx="244" cy="224" r="4" fill="#e2903a"/>
    <!-- gradient boosting -->
    <text x="8" y="250" fill="currentColor">gradient boosting</text>
    <text x="192" y="250" fill="currentColor" opacity="0.55" text-anchor="end">M7</text>
    <circle cx="225" cy="246" r="4" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <line x1="216" y1="246" x2="272" y2="246" stroke="#e2903a" opacity="0.4"/>
    <circle cx="244" cy="246" r="4" fill="#e2903a"/>
    <!-- XGBoost -->
    <text x="8" y="272" fill="currentColor">XGBoost</text>
    <text x="192" y="272" fill="currentColor" opacity="0.55" text-anchor="end">M7</text>
    <line x1="196.5" y1="268" x2="252.5" y2="268" stroke="#e2903a" opacity="0.4"/>
    <circle cx="224.5" cy="268" r="4" fill="#e2903a"/>
  </g>
</svg>

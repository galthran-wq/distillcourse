  <text x="480" y="34" fill="currentColor" font-size="12" text-anchor="middle" font-weight="bold">random forest, m = 7</text>
  <g stroke="currentColor" stroke-dasharray="3 3" opacity="0.35">
    <line x1="360" y1="76" x2="600" y2="76"/>

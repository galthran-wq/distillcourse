<svg viewBox="0 0 560 252" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- formula header -->
  <text x="280" y="24" fill="currentColor" font-size="14" text-anchor="middle" font-style="italic">Var = ρσ² + (1−ρ)σ²/B</text>
  <line x1="222" y1="30" x2="252" y2="30" stroke="#e2903a" stroke-width="2"/>
  <text x="280" y="44" fill="currentColor" font-size="10" opacity="0.55" text-anchor="middle">the floor term — the only part B cannot remove</text>

  <!-- table frame -->
  <g stroke="currentColor" opacity="0.3">
    <line x1="30" y1="82" x2="530" y2="82"/>
    <line x1="30" y1="126" x2="530" y2="126"/>
    <line x1="30" y1="170" x2="530" y2="170"/>
    <line x1="250" y1="60" x2="250" y2="214"/>
    <line x1="390" y1="60" x2="390" y2="214"/>
  </g>
  <!-- column heads -->
  <text x="320" y="74" fill="#4c8dd6" font-size="12" text-anchor="middle" font-weight="bold">bagging</text>
  <text x="460" y="74" fill="#5aa46a" font-size="12" text-anchor="middle" font-weight="bold">forest, m = 7</text>

  <!-- rows -->
  <text x="38" y="106" fill="currentColor" font-size="12">single-tree test error</text>
  <text x="38" y="119" fill="currentColor" font-size="10" opacity="0.55">the σ²-side: tree strength</text>
  <text x="320" y="108" fill="currentColor" font-size="13" text-anchor="middle">10.0%</text>
  <text x="460" y="108" fill="currentColor" font-size="13" text-anchor="middle">11.2%</text>
  <text x="504" y="108" fill="currentColor" font-size="11" opacity="0.55">worse</text>

  <text x="38" y="150" fill="currentColor" font-size="12">pair agreement (proxy for ρ)</text>
  <text x="38" y="163" fill="currentColor" font-size="10" opacity="0.55">test-set vectors — overstates ρ</text>
  <text x="320" y="152" fill="currentColor" font-size="13" text-anchor="middle">0.77</text>
  <text x="460" y="152" fill="#e2903a" font-size="13" text-anchor="middle" font-weight="bold">0.70</text>
  <text x="504" y="152" fill="#e2903a" font-size="11">lower</text>

  <text x="38" y="194" fill="currentColor" font-size="12">ensemble plateau</text>
  <text x="38" y="207" fill="currentColor" font-size="10" opacity="0.55">test error, large B</text>
  <text x="320" y="196" fill="currentColor" font-size="13" text-anchor="middle">5.3%</text>
  <text x="460" y="196" fill="#5aa46a" font-size="13" text-anchor="middle" font-weight="bold">4.9%</text>
  <text x="504" y="196" fill="#5aa46a" font-size="11">lower</text>

  <!-- verdict -->
  <text x="280" y="238" fill="currentColor" font-size="11" text-anchor="middle">weaker trees, better ensemble ⇒ the gain can only come through ρ</text>
</svg>

<svg viewBox="0 0 620 245" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="40" y="28" font-size="12.5" fill="currentColor">the distribution of Y at a fixed x</text>
  <text x="320" y="28" font-size="12.5" fill="currentColor">expected squared error of guessing c</text>

  <!-- left: three atoms -->
  <line x1="40" y1="212" x2="250" y2="212" stroke="currentColor" opacity="0.4"/>
  <line x1="70" y1="212" x2="70" y2="82" stroke="#4c8dd6" stroke-width="4"/>
  <circle cx="70" cy="82" r="3.5" fill="#4c8dd6"/>
  <line x1="100" y1="212" x2="100" y2="134" stroke="#4c8dd6" stroke-width="4"/>
  <circle cx="100" cy="134" r="3.5" fill="#4c8dd6"/>
  <line x1="220" y1="212" x2="220" y2="160" stroke="#4c8dd6" stroke-width="4"/>
  <circle cx="220" cy="160" r="3.5" fill="#4c8dd6"/>
  <text x="70" y="74" font-size="11" fill="#4c8dd6" text-anchor="middle">0.5</text>
  <text x="100" y="126" font-size="11" fill="#4c8dd6" text-anchor="middle">0.3</text>
  <text x="220" y="152" font-size="11" fill="#4c8dd6" text-anchor="middle">0.2</text>
  <text x="70" y="228" font-size="11" fill="currentColor" text-anchor="middle">1</text>
  <text x="100" y="228" font-size="11" fill="currentColor" text-anchor="middle">2</text>
  <text x="220" y="228" font-size="11" fill="currentColor" text-anchor="middle">6</text>
  <text x="245" y="228" font-size="11" fill="currentColor" opacity="0.55" text-anchor="end">y</text>
  <line x1="109" y1="212" x2="109" y2="66" stroke="#e2903a" stroke-dasharray="3 3"/>
  <text x="109" y="56" font-size="12" fill="#e2903a" text-anchor="middle">E[Y | x] = 2.3</text>

  <!-- right: risk parabola -->
  <line x1="320" y1="212" x2="600" y2="212" stroke="currentColor" opacity="0.4"/>
  <path d="M320 81.5 L340 109 L360 131.9 L380 150.4 L400 164.3 L420 173.8 L440 178.7 L452 179.5 L460 179.2 L480 175.1 L500 166.6 L520 153.5 L540 136 L560 113.9 L580 87.4 L600 56.3" fill="none" stroke="#e2903a" stroke-width="2.2"/>
  <line x1="452" y1="212" x2="452" y2="179.5" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5"/>
  <line x1="320" y1="179.5" x2="600" y2="179.5" stroke="#5aa46a" stroke-dasharray="6 4" stroke-width="1.8"/>
  <circle cx="452" cy="179.5" r="4" fill="#e2903a"/>
  <text x="452" y="228" font-size="11" fill="currentColor" text-anchor="middle">c = 2.3</text>
  <text x="360" y="228" font-size="11" fill="currentColor" text-anchor="middle">0</text>
  <text x="560" y="228" font-size="11" fill="currentColor" text-anchor="middle">5</text>
  <text x="596" y="228" font-size="11" fill="currentColor" opacity="0.55" text-anchor="end">c</text>
  <text x="596" y="172" font-size="11.5" fill="#5aa46a" text-anchor="end">Var(Y | x) = 3.61 &#8212; the floor</text>
  <text x="500" y="120" font-size="11.5" fill="#e2903a">(c &#8722; 2.3)&#178; + 3.61</text>

<svg viewBox="0 0 560 280" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="14" y="18" font-size="12" fill="currentColor">where ERM searches</text>

  <!-- all functions -->
  <rect x="20" y="36" width="520" height="216" rx="14" fill="none" stroke="currentColor" opacity="0.35"/>
  <text x="36" y="60" font-size="12" fill="currentColor" opacity="0.7">all functions f : X &#8594; {0, 1}</text>

  <!-- over-permissive class holding the memorizers -->
  <ellipse cx="152" cy="166" rx="112" ry="58" fill="none" stroke="#e2903a" stroke-width="1.6"/>
  <text x="152" y="132" font-size="12" fill="#e2903a" text-anchor="middle">functions = 1 on a finite set</text>
  <circle cx="128" cy="164" r="4" fill="#e2903a"/>
  <circle cx="156" cy="178" r="4" fill="#e2903a"/>
  <circle cx="176" cy="158" r="4" fill="#e2903a"/>
  <text x="152" y="202" font-size="11" fill="currentColor" opacity="0.75" text-anchor="middle">memorizers, one per sample</text>
  <text x="152" y="240" font-size="11" fill="#e2903a" text-anchor="middle">every sample fits perfectly; fit certifies nothing</text>

  <!-- the committed class -->
  <rect x="322" y="100" width="186" height="122" rx="12" fill="none" stroke="#4c8dd6" stroke-width="2"/>
  <text x="415" y="92" font-size="12" fill="#4c8dd6" text-anchor="middle">class H: axis-aligned rectangles</text>
  <circle cx="452" cy="140" r="4" fill="#4c8dd6"/>
  <text x="452" y="128" font-size="11" fill="#4c8dd6" text-anchor="middle">ERM&#8217;s pick</text>
  <circle cx="382" cy="170" r="4" fill="#5aa46a"/>
  <text x="382" y="192" font-size="11" fill="#5aa46a" text-anchor="middle">f*, the Bayes classifier</text>
  <text x="415" y="240" font-size="11" fill="#4c8dd6" text-anchor="middle">chosen before the data</text>
</svg>

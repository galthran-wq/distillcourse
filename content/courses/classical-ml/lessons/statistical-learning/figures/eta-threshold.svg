<svg viewBox="0 0 520 272" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="14" y="18" font-size="12" fill="currentColor">class mass per softness bin, split at &#951;(x)</text>
  <rect x="277" y="9" width="8" height="8" fill="#4c8dd6"/>
  <text x="290" y="17" font-size="11" fill="currentColor" opacity="0.75">correct mass</text>
  <rect x="368" y="9" width="8" height="8" fill="#e2903a"/>
  <text x="381" y="17" font-size="11" fill="currentColor" opacity="0.75">error = min{&#951;, 1&#8722;&#951;}</text>

  <!-- baseline and scale marks -->
  <line x1="95" y1="220" x2="445" y2="220" stroke="currentColor" opacity="0.4"/>
  <text x="88" y="224" font-size="11" fill="currentColor" opacity="0.55" text-anchor="end">0</text>
  <text x="88" y="44" font-size="11" fill="currentColor" opacity="0.55" text-anchor="end">1</text>

  <!-- hard: eta = 0.9, predict tasty; error = 1 - eta = 0.1 (top) -->
  <rect x="105" y="58" width="70" height="162" fill="#4c8dd6"/>
  <rect x="105" y="40" width="70" height="18" fill="#e2903a"/>
  <text x="101" y="62" font-size="11" fill="currentColor" opacity="0.8" text-anchor="end">&#951; = 0.9</text>
  <text x="179" y="53" font-size="11" fill="#e2903a">0.1</text>

  <!-- firm: eta = 0.6, predict tasty; error = 0.4 (top) -->
  <rect x="235" y="112" width="70" height="108" fill="#4c8dd6"/>
  <rect x="235" y="40" width="70" height="72" fill="#e2903a"/>
  <text x="231" y="116" font-size="11" fill="currentColor" opacity="0.8" text-anchor="end">&#951; = 0.6</text>
  <text x="309" y="80" font-size="11" fill="#e2903a">0.4</text>

  <!-- mushy: eta = 0.2, predict not-tasty; error = eta = 0.2 (bottom) -->
  <rect x="365" y="40" width="70" height="144" fill="#4c8dd6"/>
  <rect x="365" y="184" width="70" height="36" fill="#e2903a"/>
  <text x="361" y="188" font-size="11" fill="currentColor" opacity="0.8" text-anchor="end">&#951; = 0.2</text>
  <text x="439" y="206" font-size="11" fill="#e2903a">0.2</text>

  <!-- threshold -->
  <line x1="95" y1="130" x2="445" y2="130" stroke="currentColor" stroke-dasharray="6 4" opacity="0.6"/>
  <text x="450" y="134" font-size="11" fill="currentColor">threshold &#189;</text>

  <!-- bin labels and predictions -->
  <text x="140" y="240" font-size="11" fill="currentColor" text-anchor="middle">hard (0.3)</text>
  <text x="140" y="256" font-size="11" fill="#4c8dd6" text-anchor="middle">predict tasty</text>
  <text x="270" y="240" font-size="11" fill="currentColor" text-anchor="middle">firm (0.4)</text>
  <text x="270" y="256" font-size="11" fill="#4c8dd6" text-anchor="middle">predict tasty</text>
  <text x="400" y="240" font-size="11" fill="currentColor" text-anchor="middle">mushy (0.3)</text>
  <text x="400" y="256" font-size="11" fill="#4c8dd6" text-anchor="middle">predict not-tasty</text>
</svg>

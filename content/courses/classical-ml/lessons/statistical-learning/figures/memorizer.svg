<svg viewBox="0 0 560 270" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="20" y="30" font-size="13" font-weight="600" fill="currentColor">on the training sample</text>
  <text x="330" y="30" font-size="13" font-weight="600" fill="currentColor">on a fresh draw</text>

  <!-- left panel -->
  <rect x="20" y="48" width="170" height="170" fill="currentColor" fill-opacity="0.07"/>
  <rect x="20" y="48" width="170" height="170" fill="none" stroke="currentColor" opacity="0.35"/>
  <rect x="45" y="73" width="120" height="120" fill="#e2903a" fill-opacity="0.12"/>
  <rect x="45" y="73" width="120" height="120" fill="none" stroke="#e2903a" opacity="0.6"/>
  <text x="52" y="88" font-size="11" fill="#e2903a">y = 1 (tasty)</text>
  <text x="26" y="63" font-size="11" fill="currentColor" opacity="0.55">y = 0</text>
  <circle cx="70" cy="100" r="3.5" fill="#e2903a"/>
  <circle cx="95" cy="140" r="3.5" fill="#e2903a"/>
  <circle cx="120" cy="95" r="3.5" fill="#e2903a"/>
  <circle cx="105" cy="170" r="3.5" fill="#e2903a"/>
  <circle cx="140" cy="120" r="3.5" fill="#e2903a"/>
  <circle cx="80" cy="165" r="3.5" fill="#e2903a"/>
  <circle cx="130" cy="155" r="3.5" fill="#e2903a"/>
  <circle cx="32" cy="70" r="3.5" fill="#4c8dd6"/>
  <circle cx="120" cy="60" r="3.5" fill="#4c8dd6"/>
  <circle cx="170" cy="208" r="3.5" fill="#4c8dd6"/>
  <circle cx="60" cy="206" r="3.5" fill="#4c8dd6"/>
  <circle cx="180" cy="100" r="3.5" fill="#4c8dd6"/>
  <circle cx="28" cy="150" r="3.5" fill="#4c8dd6"/>
  <text x="20" y="240" font-size="12.5" fill="currentColor">R&#770;(h&#8347;) = 0: every stored point</text>
  <text x="20" y="256" font-size="12.5" fill="currentColor">returns its stored label</text>

  <!-- arrow -->
  <line x1="204" y1="133" x2="310" y2="133" stroke="currentColor" stroke-width="2"/>
  <polygon points="310,127 322,133 310,139" fill="currentColor"/>
  <text x="263" y="122" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">same h&#8347;</text>

  <!-- right panel -->
  <rect x="330" y="48" width="170" height="170" fill="currentColor" fill-opacity="0.07"/>
  <rect x="330" y="48" width="170" height="170" fill="none" stroke="currentColor" opacity="0.35"/>
  <rect x="355" y="73" width="120" height="120" fill="#e2903a" fill-opacity="0.28"/>
  <rect x="355" y="73" width="120" height="120" fill="none" stroke="#e2903a"/>
  <text x="336" y="63" font-size="11" fill="currentColor" opacity="0.55">truth 0, h&#8347; says 0 &#10003;</text>
  <text x="415" y="125" font-size="12" fill="currentColor" text-anchor="middle">truth: 1</text>
  <text x="415" y="142" font-size="12" fill="currentColor" text-anchor="middle">h&#8347; says: 0 &#10007;</text>
  <text x="415" y="160" font-size="11" fill="currentColor" text-anchor="middle">wrong on this whole region</text>
  <circle cx="380" cy="100" r="3.5" fill="#e2903a" opacity="0.25"/>
  <circle cx="405" cy="180" r="3.5" fill="#e2903a" opacity="0.25"/>
  <circle cx="450" cy="120" r="3.5" fill="#e2903a" opacity="0.25"/>
  <circle cx="442" cy="185" r="3.5" fill="#e2903a" opacity="0.25"/>
  <circle cx="342" cy="70" r="3.5" fill="#4c8dd6" opacity="0.25"/>
  <circle cx="430" cy="60" r="3.5" fill="#4c8dd6" opacity="0.25"/>
  <circle cx="480" cy="208" r="3.5" fill="#4c8dd6" opacity="0.25"/>
  <circle cx="490" cy="100" r="3.5" fill="#4c8dd6" opacity="0.25"/>
  <text x="330" y="240" font-size="12.5" fill="currentColor">R(h&#8347;) = area 1 / area 2 = 1/2:</text>
  <text x="330" y="256" font-size="12.5" fill="currentColor">the stored points have probability 0</text>

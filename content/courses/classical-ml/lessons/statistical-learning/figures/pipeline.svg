  <text x="355" y="79" font-size="12.5" fill="currentColor" text-anchor="middle">algorithm <tspan font-style="italic">A</tspan></text>

  <line x1="404" y1="66" x2="418" y2="66" stroke="currentColor" stroke-width="1.5"/>
  <polygon points="418,61.5 426,66 418,70.5" fill="currentColor"/>

  <rect x="428" y="40" width="76" height="52" rx="6" fill="none" stroke="currentColor" opacity="0.6"/>

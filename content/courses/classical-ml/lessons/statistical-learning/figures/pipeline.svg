<svg viewBox="0 0 660 158" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <rect x="8" y="40" width="100" height="52" rx="6" fill="none" stroke="currentColor" opacity="0.6"/>

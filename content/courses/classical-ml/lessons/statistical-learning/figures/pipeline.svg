  <text x="58" y="79" font-size="12.5" fill="currentColor" text-anchor="middle">distribution <tspan font-style="italic">D</tspan></text>
  <text x="58" y="108" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">never observed</text>

  <line x1="110" y1="66" x2="124" y2="66" stroke="currentColor" stroke-width="1.5"/>

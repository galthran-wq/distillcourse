<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; font-size: 13px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .small { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .axis  { stroke: currentColor; stroke-opacity: 0.35; stroke-width: 1; fill: none; }
    .guide { stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.2; stroke-dasharray: 4 3; fill: none; }
    .bnd   { stroke: currentColor; stroke-width: 2.2; fill: none; }
  </style>
  <defs><clipPath id="ar"><rect x="18" y="24" width="372" height="300"/></clipPath></defs>
  <rect class="axis" x="18" y="24" width="372" height="300" rx="3"/>
<g clip-path="url(#ar)">
  <line class="bnd" x1="18" y1="93.2" x2="258" y2="324"/>
  <line class="guide" x1="18" y1="150.9" x2="198" y2="324"/>
  <line class="guide" x1="18" y1="35.5" x2="318" y2="324"/>

  <circle cx="330" cy="120" r="4" fill="#e2903a"/>
  <circle cx="282" cy="174" r="4" fill="#e2903a"/>
  <text class="small" x="292" y="170">α = 0</text>

  <circle cx="204" cy="214" r="4" fill="#e2903a"/>
  <circle cx="204" cy="214" r="7.5" fill="none" stroke="#5aa46a" stroke-width="1.8"/>
  <text class="small" x="216" y="212">0 &lt; α &lt; C,  ξ = 0</text>

  <circle cx="160" cy="200" r="4" fill="#e2903a"/>
  <circle cx="160" cy="200" r="7.5" fill="none" stroke="#5aa46a" stroke-width="1.8"/>
  <text class="small" x="172" y="192">α = C,  0 &lt; ξ &lt; 1</text>

  <circle cx="100" cy="235" r="4" fill="#e2903a"/>
  <circle cx="100" cy="235" r="7.5" fill="none" stroke="#5aa46a" stroke-width="1.8"/>
  <text class="small" x="46" y="222">α = C,  ξ &gt; 1</text>

  <circle cx="66" cy="255" r="4" fill="#4c8dd6"/>
  <circle cx="60" cy="300" r="4" fill="#4c8dd6"/>
  <circle cx="130" cy="305" r="4" fill="#4c8dd6"/>
  <text class="small" x="52" y="278">α = 0</text>

  <circle cx="117" cy="246" r="4" fill="#4c8dd6"/>
  <circle cx="117" cy="246" r="7.5" fill="none" stroke="#5aa46a" stroke-width="1.8"/>
  <text class="small" x="98" y="266">0 &lt; α &lt; C</text>
</g>
  <text class="muted" x="404" y="48">complementary slackness:</text>
  <text class="label" x="404" y="70">α&#7522;[y&#7522;f(x&#7522;) − 1 + ξ&#7522;] = 0</text>
  <text class="label" x="404" y="92">(C − α&#7522;) ξ&#7522; = 0</text>

  <text class="label" x="404" y="132">α = 0  →  y f ≥ 1</text>
  <text class="muted" x="404" y="150">outside the margin — no vote</text>
  <text class="label" x="404" y="182">0 &lt; α &lt; C  →  y f = 1</text>
  <text class="muted" x="404" y="200">exactly on a margin line</text>
  <text class="label" x="404" y="232">α = C  →  y f ≤ 1</text>
  <text class="muted" x="404" y="250">inside the band or misclassified</text>

  <circle cx="410" cy="284" r="6" fill="none" stroke="#5aa46a" stroke-width="1.8"/>
  <text class="small" x="424" y="288">support vector: α &gt; 0</text>
</svg>

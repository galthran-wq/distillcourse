<svg viewBox="0 0 620 170" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; font-size: 13px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .box   { fill: none; stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.2; }
    .arrow { stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.2; }
  </style>

  <text class="muted" x="24" y="30">start from a kernel; every arrow is a closure rule</text>

  <!-- box 1: x^T z -->
  <rect class="box" x="24" y="62" width="72" height="32" rx="5"/>
  <text class="label" x="60" y="83" text-anchor="middle">x&#7488;z</text>
  <text class="muted" x="60" y="116" text-anchor="middle">feature map:</text>
  <text class="muted" x="60" y="131" text-anchor="middle">identity</text>

  <!-- arrow 1 -->
  <line class="arrow" x1="96" y1="78" x2="130" y2="78"/>
  <path d="M130 78 l-6 -3.5 v7 z" fill="currentColor" fill-opacity="0.6"/>
  <text class="muted" x="113" y="56" text-anchor="middle">c&#183;k&#8321;</text>

  <!-- box 2: 2γ x^T z -->
  <rect class="box" x="134" y="62" width="88" height="32" rx="5"/>
  <text class="label" x="178" y="83" text-anchor="middle">2&#947;&#183;x&#7488;z</text>

  <!-- arrow 2 -->
  <line class="arrow" x1="222" y1="78" x2="258" y2="78"/>
  <path d="M258 78 l-6 -3.5 v7 z" fill="currentColor" fill-opacity="0.6"/>
  <text class="muted" x="240" y="56" text-anchor="middle">exp(k&#8321;)</text>

  <!-- box 3: exp(2γ x^T z) -->
  <rect class="box" x="262" y="62" width="118" height="32" rx="5"/>
  <text class="label" x="321" y="83" text-anchor="middle">exp(2&#947; x&#7488;z)</text>

  <!-- arrow 3 -->
  <line class="arrow" x1="380" y1="78" x2="418" y2="78"/>
  <path d="M418 78 l-6 -3.5 v7 z" fill="currentColor" fill-opacity="0.6"/>
  <text class="muted" x="399" y="44" text-anchor="middle">g(x)&#183;k&#8321;&#183;g(z)</text>
  <text class="muted" x="399" y="58" text-anchor="middle">g(u) = exp(&#8722;&#947;&#8214;u&#8214;&#178;)</text>

  <!-- box 4: RBF, accent -->
  <rect x="422" y="62" width="174" height="32" rx="5" fill="none" stroke="#e2903a" stroke-width="1.6"/>
  <text x="509" y="83" text-anchor="middle" fill="#e2903a">exp(&#8722;&#947;&#8214;x &#8722; z&#8214;&#178;)</text>
  <text class="muted" x="509" y="116" text-anchor="middle">the RBF kernel:</text>
  <text class="muted" x="509" y="131" text-anchor="middle">every Gram matrix PSD</text>
</svg>

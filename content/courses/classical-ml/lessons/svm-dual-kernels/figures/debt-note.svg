<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; font-size: 12px; }
    .small { fill: currentColor; opacity: 0.6; font-size: 11px; }
    .axis  { stroke: currentColor; stroke-opacity: 0.45; stroke-width: 1.2; fill: none; }
    .curve { stroke-width: 2; fill: none; }
  </style>

  <!-- axes -->
  <line class="axis" x1="40" y1="230" x2="330" y2="230"/>
  <line class="axis" x1="40" y1="230" x2="40" y2="40"/>
  <text class="small" x="44" y="52">error</text>
  <text class="small" x="60" y="250">flexibility (feature dimension)</text>

  <!-- axis break and infinity mark -->
  <line class="axis" x1="336" y1="230" x2="344" y2="222"/>
  <line class="axis" x1="342" y1="230" x2="350" y2="222"/>
  <line class="axis" x1="352" y1="230" x2="392" y2="230"/>
  <text class="label" x="396" y="234">∞</text>
  <text class="small" x="330" y="250">RBF feature space</text>

  <!-- U-curve: test error -->
  <path class="curve" stroke="#e2903a" d="M 48 90 C 110 170, 160 190, 200 185 C 250 178, 290 120, 322 65"/>
  <text x="240" y="120" font-size="12" fill="#e2903a">test error</text>

  <!-- train error -->
  <path class="curve" stroke="#4c8dd6" d="M 48 100 C 130 190, 220 215, 322 222"/>
  <text x="120" y="205" font-size="12" fill="#4c8dd6">train error</text>

  <!-- the ? pin at infinity -->
  <line x1="400" y1="215" x2="400" y2="120" stroke="#e2903a" stroke-width="1.6" stroke-dasharray="4 3"/>
  <circle cx="400" cy="104" r="14" fill="none" stroke="#e2903a" stroke-width="2"/>
  <text x="400" y="110" text-anchor="middle" font-size="15" font-weight="bold" fill="#e2903a">?</text>
  <text class="small" x="360" y="270">the U-curve predicts disaster here;</text>
  <text class="small" x="360" y="286">the demo's test error is 0.04</text>

  <!-- IOU box -->
  <rect x="428" y="42" width="196" height="150" rx="6" fill="currentColor" opacity="0.06"/>
  <rect x="428" y="42" width="196" height="150" rx="6" fill="none" stroke="currentColor" stroke-opacity="0.4" stroke-dasharray="5 4"/>
  <text class="label" x="440" y="66" font-weight="bold">IOU — paid in module 9</text>
  <text class="label" x="440" y="96">R(h) ≤ R̂ᵨ(h)</text>
  <text class="label" x="470" y="122">+ 2√(Tr[K]Λ²/ρ²) / m</text>
  <text class="label" x="470" y="148">+ 3√(log(2/δ) / 2m)</text>
  <text class="small" x="440" y="176">no dimension appears anywhere</text>
  <line x1="428" y1="118" x2="414" y2="112" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.2"/>
</svg>

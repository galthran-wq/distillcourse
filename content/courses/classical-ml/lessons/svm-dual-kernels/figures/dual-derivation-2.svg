<svg viewBox="0 0 620 310" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; font-size: 13px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .small { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .done  { fill: currentColor; opacity: 0.45; font-size: 13px; }
    .div   { stroke: currentColor; stroke-opacity: 0.25; stroke-width: 1; }
    .badge-done { fill: none; stroke: currentColor; stroke-opacity: 0.4; }
  </style>
  <text class="muted" x="24" y="36">primal:  min ½‖w‖²   s.t.   y&#7522;(w&#7488;x&#7522; + b) − 1 ≥ 0,   i = 1…m</text>
  <line class="div" x1="24" y1="48" x2="596" y2="48"/>
  <line class="div" x1="352" y1="60" x2="352" y2="296"/>

  <circle class="badge-done" cx="32" cy="76" r="9"/>
  <text x="32" y="80" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.5">1</text>
  <text class="done" x="48" y="80">L = ½‖w‖² − Σ&#7522; α&#7522;[y&#7522;(w&#7488;x&#7522;+b) − 1]</text>

  <circle cx="32" cy="120" r="9" fill="#e2903a"/>
  <text x="32" y="124" text-anchor="middle" font-size="11" fill="#fff">2</text>
  <text class="label" x="48" y="124">∂L/∂w = 0   →   w = Σ&#7522; α&#7522;y&#7522;x&#7522;</text>

  <text class="label" x="368" y="80" font-weight="bold">step 2 — stationarity in w</text>
  <text class="muted" x="368" y="108">∂L/∂w = w − Σα&#7522;y&#7522;x&#7522; = 0</text>
  <rect x="366" y="122" width="150" height="26" rx="4" fill="none" stroke="#5aa46a" stroke-width="1.6"/>
  <text class="label" x="376" y="140">w = Σ&#7522; α&#7522;y&#7522;x&#7522;</text>
  <text class="muted" x="368" y="172">the weight vector is a weighted</text>
  <text class="muted" x="368" y="190">sum of training points; α&#7522; is the</text>
  <text class="muted" x="368" y="208">weight point i carries in the solution</text>
</svg>

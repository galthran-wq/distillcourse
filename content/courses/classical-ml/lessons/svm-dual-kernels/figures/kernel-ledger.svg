<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; font-size: 13px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .small { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .axis  { stroke: currentColor; stroke-opacity: 0.35; stroke-width: 1; fill: none; }
  </style>

  <rect class="axis" x="16" y="20" width="300" height="240" rx="4"/>
  <text class="label" x="32" y="48" font-weight="bold">explicit route: build φ, then dot</text>
  <text class="label" x="32" y="80" font-size="12">φ(x) = (1, √2x&#8321;, √2x&#8322;, x&#8321;², x&#8322;², √2x&#8321;x&#8322;)</text>
  <text class="muted" x="32" y="108">x = (1, 2):  φ(x) = (1, 1.41, 2.83, 1, 4, 2.83)</text>
  <text class="muted" x="32" y="130">z = (3, 1):  φ(z) = (1, 4.24, 1.41, 9, 1, 4.24)</text>
  <text class="label" x="32" y="162">⟨φ(x), φ(z)⟩</text>
  <text class="label" x="32" y="184">= 1 + 6 + 4 + 9 + 4 + 12 = <tspan font-weight="bold">36</tspan></text>
  <text class="small" x="32" y="216">cost: 12 coordinates + 6-term dot product;</text>
  <text class="small" x="32" y="234">in 1000 dims, degree 3: ≈ 10⁹ coordinates</text>

  <rect class="axis" x="356" y="20" width="268" height="240" rx="4"/>
  <text x="372" y="48" font-weight="bold" fill="#e2903a">kernel route: dot, then square</text>
  <text x="372" y="80" font-size="12" fill="#e2903a">K(x, z) = (1 + x&#7488;z)²</text>
  <text class="muted" x="372" y="108">x&#7488;z = 1·3 + 2·1 = 5</text>
  <text class="label" x="372" y="140">K = (1 + 5)²</text>
  <text class="label" x="372" y="162">= <tspan font-weight="bold">36</tspan></text>
  <text class="small" x="372" y="216">cost: 2 multiplies, 2 adds, 1 square;</text>
  <text class="small" x="372" y="234">in 1000 dims: 1000 multiplies + a cube</text>

  <text class="label" x="330" y="145" font-size="20" text-anchor="middle">=</text>
  <text class="muted" x="320" y="300" text-anchor="middle">both routes compute the same inner product; only the first ever builds a feature vector</text>
</svg>

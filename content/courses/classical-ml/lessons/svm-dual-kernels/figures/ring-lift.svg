  <text class="label" x="360" y="42">two coordinates of φ(x): a line suffices</text>
  <text class="small" x="554" y="278">x₁²</text>
  <text class="small" x="338" y="64">x₂²</text>
  <text class="small" x="420.7" y="194.3">x₁² + x₂² = 2.5</text>

  <text class="label" x="320" y="330" text-anchor="middle">(x&#7488;z + 1)²  =  1 + 2x₁z₁ + 2x₂z₂ + x₁²z₁² + x₂²z₂² + 2x₁x₂·z₁z₂  =  ⟨φ(x), φ(z)⟩</text>

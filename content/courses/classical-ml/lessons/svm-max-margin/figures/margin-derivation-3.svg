<svg viewBox="0 0 620 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; font-size: 13px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .small { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .axis  { stroke: currentColor; stroke-opacity: 0.35; stroke-width: 1; fill: none; }
    .guide { stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.2; stroke-dasharray: 4 3; fill: none; }
    .bnd   { stroke: currentColor; stroke-width: 2.2; fill: none; }
    .cand  { stroke: currentColor; stroke-opacity: 0.35; stroke-width: 1.3; fill: none; }
  </style>
  <defs><clipPath id="dv"><rect x="18" y="24" width="320" height="252"/></clipPath></defs>
  <rect class="axis" x="18" y="24" width="320" height="252" rx="3"/>
<g clip-path="url(#dv)">
  <line class="bnd" x1="18.0" y1="92.7" x2="261.8" y2="276.0"/>
  <line class="guide" x1="338.0" y1="161.5" x2="155.1" y2="24.0"/>
  <line x1="164.3" y1="202.7" x2="246.6" y2="92.7" stroke="#e2903a" stroke-width="1.8"/>
  <line x1="246.6" y1="92.7" x2="244.7" y2="101.5" stroke="#e2903a" stroke-width="1.8"/>
  <line x1="246.6" y1="92.7" x2="238.6" y2="97.0" stroke="#e2903a" stroke-width="1.8"/>
  <text class="muted" x="213.4" y="149.7">distance 2.4</text>
  <circle cx="246.6" cy="92.7" r="4.5" fill="#e2903a"/>
  <text class="label" x="255.6" y="96.7" font-style="italic">x</text>
  <line x1="63.7" y1="127.1" x2="75.7" y2="111.1" stroke="#4c8dd6" stroke-width="2.0"/>
  <line x1="75.7" y1="111.1" x2="73.9" y2="119.9" stroke="#4c8dd6" stroke-width="2.0"/>
  <line x1="75.7" y1="111.1" x2="67.8" y2="115.3" stroke="#4c8dd6" stroke-width="2.0"/>
  <text x="81.7" y="109.1" fill="#4c8dd6" font-size="13">w = (¼, ⅓)</text>
  <text class="muted" x="280.9" y="256.0" text-anchor="middle">wᵀx + b = 0</text>
  <text class="muted" x="78.0" y="41.2">wᵀx + b = 1</text>
</g>
  <text class="label" x="356" y="50">step 3 — pin the nearest point to 1</text>
  <text class="label" x="356" y="80">rescale by 1/12:</text>
  <text class="label" x="356" y="104">w = (¼, ⅓),  b = −1</text>
  <text class="label" x="356" y="136">wᵀx + b = 1  (by choice of scale)</text>
  <text class="label" x="356" y="160">‖w‖ = 5/12</text>
  <rect x="346" y="182" width="248" height="58" rx="5" fill="none" stroke="#e2903a" stroke-width="1.6"/>
  <text class="label" x="356" y="206">distance = 1/‖w‖ = 12/5 = 2.4</text>
  <text class="label" x="356" y="230">margin band width = 2/‖w‖</text>
</svg>

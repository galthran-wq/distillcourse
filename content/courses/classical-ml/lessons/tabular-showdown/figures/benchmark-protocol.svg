<svg viewBox="0 0 640 252" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- module-5 law bracket (over validation + test boxes) -->
  <path d="M256 50 v-8 h226 v8" stroke="#e2903a" fill="none" stroke-width="1.8"/>
  <text x="369" y="32" text-anchor="middle" font-size="11.5" font-weight="600" fill="#e2903a">module 5's law: selection and scoring never share a split</text>

  <!-- pipeline boxes -->
  <rect x="8" y="58" width="90" height="46" rx="6" fill="none" stroke="currentColor"/>
  <text x="53" y="85" text-anchor="middle" font-size="12" font-weight="600" fill="currentColor">45 datasets</text>
  <text x="53" y="118" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.55">kept by exclusion</text>

  <path d="M98 81 L114 81" stroke="currentColor" fill="none"/>
  <path d="M114 81 l-6 -4 v8 z" fill="currentColor"/>

  <rect x="118" y="58" width="118" height="46" rx="6" fill="none" stroke="currentColor"/>
  <text x="177" y="85" text-anchor="middle" font-size="12" font-weight="600" fill="currentColor">random search</text>
  <text x="177" y="118" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.55">&#8776;400 draws / model / dataset</text>

  <path d="M236 81 L252 81" stroke="currentColor" fill="none"/>
  <path d="M252 81 l-6 -4 v8 z" fill="currentColor"/>

  <rect x="256" y="58" width="110" height="46" rx="6" fill="none" stroke="currentColor"/>
  <text x="311" y="85" text-anchor="middle" font-size="12" font-weight="600" fill="currentColor">validation picks</text>
  <text x="311" y="118" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.55">best of first n draws</text>

  <path d="M366 81 L382 81" stroke="currentColor" fill="none"/>
  <path d="M382 81 l-6 -4 v8 z" fill="currentColor"/>

  <rect x="386" y="58" width="96" height="46" rx="6" fill="none" stroke="currentColor"/>
  <text x="434" y="85" text-anchor="middle" font-size="12" font-weight="600" fill="currentColor">test scores it</text>
  <text x="434" y="118" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.55">chooses nothing</text>

  <path d="M482 81 L498 81" stroke="currentColor" fill="none"/>
  <path d="M498 81 l-6 -4 v8 z" fill="currentColor"/>

  <rect x="502" y="58" width="130" height="46" rx="6" fill="none" stroke="currentColor"/>
  <text x="567" y="85" text-anchor="middle" font-size="12" font-weight="600" fill="currentColor">15 reshuffles</text>
  <text x="567" y="118" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.55">a band, not a point</text>

  <!-- measured-object bracket (under search ... reshuffles) -->
  <path d="M118 128 v8 h514 v-8" stroke="#4c8dd6" fill="none" stroke-width="1.6"/>
  <text x="375" y="152" text-anchor="middle" font-size="11.5" font-weight="600" fill="#4c8dd6">the tuning run itself, variance included, is the measured object</text>

  <path d="M375 158 L375 170" stroke="currentColor" fill="none"/>
  <path d="M375 170 l-4 -6 h8 z" fill="currentColor"/>

  <!-- output: score-vs-budget curves -->
  <line x1="180" y1="238" x2="460" y2="238" stroke="currentColor" opacity="0.6"/>
  <line x1="180" y1="172" x2="180" y2="238" stroke="currentColor" opacity="0.6"/>
  <text x="186" y="182" font-size="10" fill="currentColor" opacity="0.55">normalized score</text>
  <text x="320" y="250" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.55">random-search budget n (log scale)</text>

  <path d="M186 200 C 250 190, 340 183, 454 180" stroke="#e2903a" fill="none" stroke-width="2"/>
  <path d="M186 228 C 250 218, 340 209, 454 204" stroke="#4c8dd6" fill="none" stroke-width="2"/>
  <text x="330" y="180" text-anchor="middle" font-size="10.5" font-weight="600" fill="#e2903a">tree ensembles</text>
  <text x="330" y="224" text-anchor="middle" font-size="10.5" font-weight="600" fill="#4c8dd6">deep models</text>
</svg>

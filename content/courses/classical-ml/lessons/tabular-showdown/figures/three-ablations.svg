<svg viewBox="0 0 640 264" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- row separators -->
  <line x1="8" y1="88" x2="632" y2="88" stroke="currentColor" opacity="0.15"/>
  <line x1="8" y1="176" x2="632" y2="176" stroke="currentColor" opacity="0.15"/>

  <!-- ══ row 1: smooth the target ══ -->
  <path d="M16 58 h14 v-22 h10 v14 h12 v-26 h10 v22 h12 v-12 h12 v-12 h10 v24 h12 v-8 h12"
        stroke="currentColor" fill="none" stroke-width="1.6"/>
  <text x="68" y="76" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.55">y(x): steps and spikes</text>

  <text x="178" y="30" text-anchor="middle" font-size="11" font-weight="600" fill="currentColor">Gaussian-smooth y</text>
  <path d="M134 44 L202 44" stroke="currentColor" fill="none"/>
  <path d="M202 44 l-7 -4 v8 z" fill="currentColor"/>
  <text x="170" y="60" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.55">lengthscale &#8467;</text>

  <path d="M220 56 C 248 24, 272 60, 296 38 S 326 34, 332 42" stroke="currentColor" fill="none" stroke-width="1.6"/>
  <text x="276" y="76" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.55">the fine structure erased</text>

  <text x="348" y="38" font-size="12" fill="currentColor"><tspan font-weight="600" fill="#e2903a">trees</tspan> fall sharply; <tspan font-weight="600" fill="#4c8dd6">networks</tspan> barely move</text>
  <text x="348" y="60" font-size="11.5" font-weight="600" fill="currentColor">&#8658; the real targets were irregular</text>

  <!-- ══ row 2: add junk columns ══ -->
  <g stroke="currentColor" fill="none" opacity="0.7">
    <rect x="20" y="104" width="15" height="10"/><rect x="39" y="104" width="15" height="10"/><rect x="58" y="104" width="15" height="10"/><rect x="77" y="104" width="15" height="10"/><rect x="96" y="104" width="15" height="10"/>
    <rect x="20" y="118" width="15" height="10"/><rect x="39" y="118" width="15" height="10"/><rect x="58" y="118" width="15" height="10"/><rect x="77" y="118" width="15" height="10"/><rect x="96" y="118" width="15" height="10"/>
    <rect x="20" y="132" width="15" height="10"/><rect x="39" y="132" width="15" height="10"/><rect x="58" y="132" width="15" height="10"/><rect x="77" y="132" width="15" height="10"/><rect x="96" y="132" width="15" height="10"/>
  </g>
  <text x="66" y="162" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.55">the table's columns</text>

  <text x="170" y="100" text-anchor="middle" font-size="11" font-weight="600" fill="currentColor">append noise columns</text>
  <path d="M134 132 L202 132" stroke="currentColor" fill="none"/>
  <path d="M202 132 l-7 -4 v8 z" fill="currentColor"/>
  <text x="170" y="148" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.55">N(0,1), unrelated to y</text>

  <g stroke="currentColor" fill="none" opacity="0.7">
    <rect x="216" y="104" width="15" height="10"/><rect x="235" y="104" width="15" height="10"/><rect x="254" y="104" width="15" height="10"/>
    <rect x="216" y="118" width="15" height="10"/><rect x="235" y="118" width="15" height="10"/><rect x="254" y="118" width="15" height="10"/>
    <rect x="216" y="132" width="15" height="10"/><rect x="235" y="132" width="15" height="10"/><rect x="254" y="132" width="15" height="10"/>
  </g>
  <g stroke="currentColor" fill="none" opacity="0.35" stroke-dasharray="3 2">
    <rect x="277" y="104" width="15" height="10"/><rect x="296" y="104" width="15" height="10"/><rect x="315" y="104" width="15" height="10"/>
    <rect x="277" y="118" width="15" height="10"/><rect x="296" y="118" width="15" height="10"/><rect x="315" y="118" width="15" height="10"/>
    <rect x="277" y="132" width="15" height="10"/><rect x="296" y="132" width="15" height="10"/><rect x="315" y="132" width="15" height="10"/>
  </g>
  <text x="303" y="162" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.55">junk</text>

  <text x="348" y="126" font-size="12" fill="currentColor"><tspan font-weight="600" fill="#4c8dd6">networks</tspan> degrade; <tspan font-weight="600" fill="#e2903a">boosted trees</tspan> shrug</text>
  <text x="348" y="148" font-size="11.5" font-weight="600" fill="currentColor">&#8658; tables are full of uninformative features</text>

  <!-- ══ row 3: rotate the basis ══ -->
  <line x1="28" y1="196" x2="28" y2="244" stroke="currentColor" opacity="0.6"/>
  <line x1="20" y1="244" x2="116" y2="244" stroke="currentColor" opacity="0.6"/>
  <line x1="70" y1="200" x2="70" y2="242" stroke="#e2903a" stroke-dasharray="4 3" stroke-width="1.6"/>
  <circle cx="44" cy="212" r="3.5" fill="currentColor"/><circle cx="52" cy="230" r="3.5" fill="currentColor"/><circle cx="60" cy="218" r="3.5" fill="currentColor"/>
  <circle cx="84" cy="210" r="3.5" fill="none" stroke="currentColor"/><circle cx="94" cy="228" r="3.5" fill="none" stroke="currentColor"/><circle cx="104" cy="216" r="3.5" fill="none" stroke="currentColor"/>
  <text x="72" y="258" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.55">a split on a named column</text>

  <text x="170" y="206" text-anchor="middle" font-size="11" font-weight="600" fill="currentColor">rotate: x &#8614; Qx</text>
  <path d="M134 220 L202 220" stroke="currentColor" fill="none"/>
  <path d="M202 220 l-7 -4 v8 z" fill="currentColor"/>
  <text x="170" y="236" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.55">same information, new basis</text>

  <line x1="224" y1="196" x2="224" y2="244" stroke="currentColor" opacity="0.6"/>
  <line x1="216" y1="244" x2="312" y2="244" stroke="currentColor" opacity="0.6"/>
  <line x1="244" y1="244" x2="298" y2="198" stroke="#e2903a" stroke-dasharray="4 3" stroke-width="1.6"/>
  <circle cx="240" cy="216" r="3.5" fill="currentColor"/><circle cx="252" cy="234" r="3.5" fill="currentColor"/><circle cx="262" cy="222" r="3.5" fill="currentColor"/>
  <circle cx="278" cy="206" r="3.5" fill="none" stroke="currentColor"/><circle cx="288" cy="224" r="3.5" fill="none" stroke="currentColor"/><circle cx="298" cy="214" r="3.5" fill="none" stroke="currentColor"/>
  <text x="264" y="258" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.55">no column means anything</text>

  <text x="348" y="214" font-size="12" fill="currentColor">the ranking reverses: <tspan font-weight="600" fill="#4c8dd6">networks</tspan> above <tspan font-weight="600" fill="#e2903a">trees</tspan></text>
  <text x="348" y="236" font-size="11.5" font-weight="600" fill="currentColor">&#8658; the columns were a meaningful basis</text>
</svg>

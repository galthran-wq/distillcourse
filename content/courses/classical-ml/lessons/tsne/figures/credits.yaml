  - file: umap-comparison-grid.png
    title: "Figure 4 — A comparison of several dimension reduction algorithms. We note that UMAP successfully reflects much of the large scale global structure that is well represented by Laplacian Eigenmaps and PCA (particularly for MNIST and Fashion-MNIST), while also preserving the local fine structure similar to t-SNE and LargeVis."
    credit: "Leland McInnes, John Healy & James Melville, \"UMAP: Uniform Manifold Approximation and Projection for Dimension Reduction\", arXiv:1802.03426 (v1 February 2018; v3 September 2020)"
    source_url: "https://arxiv.org/abs/1802.03426"

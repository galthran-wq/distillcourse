<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="system-ui, sans-serif">
  <text x="20" y="24" font-size="13.5" fill="currentColor">The analysis ledger</text>

  <rect x="20" y="40" width="295" height="252" rx="6" fill="#5aa46a" opacity="0.08"/>
  <rect x="20" y="40" width="295" height="252" rx="6" fill="none" stroke="#5aa46a" opacity="0.6"/>
  <text x="36" y="64" font-size="12.5" fill="#5aa46a">Established</text>

  <text x="36" y="92" font-size="11.5" fill="currentColor">Coarse structure is real: leukemia splits off</text>
  <text x="36" y="107" font-size="11.5" fill="currentColor">first; melanoma, ovarian, colon cohere</text>
  <text x="36" y="122" font-size="11" fill="currentColor" opacity="0.55">co-clustering 0.80&#8211;0.93 across 50 bootstraps</text>

  <text x="36" y="150" font-size="11.5" fill="currentColor">Two &#8220;breast&#8221; samples belong with the</text>
  <text x="36" y="165" font-size="11.5" fill="currentColor">melanomas &#8212; a hypothesis worth a re-check</text>
  <text x="36" y="180" font-size="11" fill="currentColor" opacity="0.55">every linkage, every method, 98% of resamples;</text>
  <text x="36" y="194" font-size="11" fill="currentColor" opacity="0.55">later cell-line work concurs (its reading disputed)</text>

  <text x="36" y="222" font-size="11.5" fill="currentColor">p &#8811; n is no computational obstacle</text>
  <text x="36" y="237" font-size="11" fill="currentColor" opacity="0.55">every spectrum here came from a 64&#215;64 problem,</text>
  <text x="36" y="251" font-size="11" fill="currentColor" opacity="0.55">in milliseconds (the Gram trick)</text>

  <rect x="329" y="40" width="291" height="252" rx="6" fill="#e2903a" opacity="0.08"/>
  <rect x="329" y="40" width="291" height="252" rx="6" fill="none" stroke="#e2903a" opacity="0.6"/>
  <text x="345" y="64" font-size="12.5" fill="#e2903a">Not established</text>

  <text x="345" y="92" font-size="11.5" fill="currentColor">A number of clusters</text>
  <text x="345" y="107" font-size="11" fill="currentColor" opacity="0.55">no kink in the distortion curve; silhouette &#8804; 0.09</text>
  <text x="345" y="121" font-size="11" fill="currentColor" opacity="0.55">at every K; K = 4 was a choice, not a finding</text>

  <text x="345" y="150" font-size="11.5" fill="currentColor">&#8220;Cluster = cancer type&#8221;</text>
  <text x="345" y="165" font-size="11" fill="currentColor" opacity="0.55">ARI against the labels &#8804; 0.28 at every K tried;</text>
  <text x="345" y="179" font-size="11" fill="currentColor" opacity="0.55">the linkage alone reshapes the tree</text>

  <text x="345" y="208" font-size="11.5" fill="currentColor">Any subtype or causal claim</text>
  <text x="345" y="223" font-size="11" fill="currentColor" opacity="0.55">n = 64 from one platform; standardizing or not</text>
  <text x="345" y="237" font-size="11" fill="currentColor" opacity="0.55">moves the partition (ARI 0.73 between reruns);</text>
  <text x="345" y="251" font-size="11" fill="currentColor" opacity="0.55">fine branch structure dissolves under resampling</text>

  <text x="20" y="312" font-size="11" fill="currentColor" opacity="0.55">Each entry cites the computation that supports it; nothing rests on the picture alone.</text>
</svg>

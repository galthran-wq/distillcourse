  nested-cv:
    kind: exact
    seed: 7
    atol: 1.0e-9
    inputs_code: |
      # The referee problem once more: the fully nested report should
      # straddle the 50% truth, and the picks expose the inner selection.
      X = rng.normal(size=(50, 5000))
      y = np.repeat([1.0, -1.0], 25)
      inputs = (X, y, [10, 25, 50, 100, 200], 5, 7)
    wrong:
      - hint: "The inner choice is the argmin, not the one-SE pick: the contract selects with YOUR one_se_pick — the smallest grid size whose inner CV mean clears the band anchored at the minimum — and the picks in your output disagree."
        code: |
          def _kfold(y, k, seed):
              import numpy as np
              rng = np.random.default_rng(seed)
              folds = np.empty(len(y), dtype=np.int64)
              for c in np.unique(y):
                  rows = np.flatnonzero(y == c)
                  perm = rng.permutation(rows)
                  folds[perm] = np.arange(len(perm)) % k
              return folds
          def _screen(Xtr, ytr, n_keep):
              import numpy as np
              Xc = Xtr - Xtr.mean(0)
              yc = ytr - ytr.mean()
              r = (Xc.T @ yc) / (np.sqrt((Xc ** 2).sum(0)) * np.sqrt((yc ** 2).sum()))
              return np.argsort(r)[-n_keep:]
          def _fold_errs(X, y, n_keep, folds, k):
              import numpy as np
              out = np.empty(k)
              for f_ in range(k):
                  tr, va = folds != f_, folds == f_
                  kept = _screen(X[tr], y[tr], n_keep)
                  Xtr_k, Xva_k = X[tr][:, kept], X[va][:, kept]
                  d2 = ((Xva_k[:, None, :] - Xtr_k[None, :, :]) ** 2).sum(-1)
                  out[f_] = np.mean(y[tr][np.argmin(d2, axis=1)] != y[va])
              return out
          def f(X, y, grid, k, seed):
              import numpy as np
              outer = _kfold(y, k, seed)
              errors = np.empty(k)
              picks = np.empty(k)
              for f_ in range(k):
                  tr, va = outer != f_, outer == f_
                  inner = _kfold(y[tr], k, seed)
                  tbl = np.column_stack([_fold_errs(X[tr], y[tr], nk, inner, k)
                                         for nk in grid])
                  i = int(np.argmin(tbl.mean(0)))
                  picks[f_] = grid[i]
                  kept = _screen(X[tr], y[tr], int(grid[i]))
                  Xtr_k, Xva_k = X[tr][:, kept], X[va][:, kept]
                  d2 = ((Xva_k[:, None, :] - Xtr_k[None, :, :]) ** 2).sum(-1)
                  errors[f_] = np.mean(y[tr][np.argmin(d2, axis=1)] != y[va])
              return errors, picks
      - hint: "The inner assignment must be a FRESH deal of the training rows — kfold_indices(y[tr], k, seed) — not the outer assignment's own entries restricted to them (outer[tr]). Reusing the outer entries is a different protocol: the inner CV runs on the outer deal's leftover folds, and the picks drift."
        code: |
          def _kfold(y, k, seed):
              import numpy as np
              rng = np.random.default_rng(seed)
              folds = np.empty(len(y), dtype=np.int64)
              for c in np.unique(y):
                  rows = np.flatnonzero(y == c)
                  perm = rng.permutation(rows)
                  folds[perm] = np.arange(len(perm)) % k
              return folds
          def _screen(Xtr, ytr, n_keep):
              import numpy as np
              Xc = Xtr - Xtr.mean(0)
              yc = ytr - ytr.mean()
              r = (Xc.T @ yc) / (np.sqrt((Xc ** 2).sum(0)) * np.sqrt((yc ** 2).sum()))
              return np.argsort(r)[-n_keep:]
          def _fold_errs_ids(X, y, n_keep, folds):
              import numpy as np
              ids = np.unique(folds)
              out = np.empty(len(ids))
              for i, fid in enumerate(ids):
                  tr, va = folds != fid, folds == fid
                  kept = _screen(X[tr], y[tr], n_keep)
                  Xtr_k, Xva_k = X[tr][:, kept], X[va][:, kept]
                  d2 = ((Xva_k[:, None, :] - Xtr_k[None, :, :]) ** 2).sum(-1)
                  out[i] = np.mean(y[tr][np.argmin(d2, axis=1)] != y[va])
              return out
          def f(X, y, grid, k, seed):
              import numpy as np
              outer = _kfold(y, k, seed)
              errors = np.empty(k)
              picks = np.empty(k)
              for f_ in range(k):
                  tr, va = outer != f_, outer == f_
                  inner = outer[tr]
                  tbl = np.column_stack([_fold_errs_ids(X[tr], y[tr], nk, inner)
                                         for nk in grid])
                  mean = tbl.mean(0)
                  se = tbl.std(0, ddof=1) / np.sqrt(tbl.shape[0])
                  i_min = int(np.argmin(mean))
                  i = int(np.flatnonzero(mean <= mean[i_min] + se[i_min])[0])
                  picks[f_] = grid[i]
                  kept = _screen(X[tr], y[tr], int(grid[i]))
                  Xtr_k, Xva_k = X[tr][:, kept], X[va][:, kept]
                  d2 = ((Xva_k[:, None, :] - Xtr_k[None, :, :]) ** 2).sum(-1)
                  errors[f_] = np.mean(y[tr][np.argmin(d2, axis=1)] != y[va])
              return errors, picks
      - hint: "The size was chosen by one CV over ALL fifty rows — so every outer fold grades a choice its own labels voted for, and the picks come out identical across folds. The choice must be re-made inside each outer fold, by an inner CV on that fold's training rows alone."
        code: |
          def _kfold(y, k, seed):
              import numpy as np
              rng = np.random.default_rng(seed)
              folds = np.empty(len(y), dtype=np.int64)
              for c in np.unique(y):
                  rows = np.flatnonzero(y == c)
                  perm = rng.permutation(rows)
                  folds[perm] = np.arange(len(perm)) % k
              return folds
          def _screen(Xtr, ytr, n_keep):
              import numpy as np
              Xc = Xtr - Xtr.mean(0)
              yc = ytr - ytr.mean()
              r = (Xc.T @ yc) / (np.sqrt((Xc ** 2).sum(0)) * np.sqrt((yc ** 2).sum()))
              return np.argsort(r)[-n_keep:]
          def _fold_errs(X, y, n_keep, folds, k):
              import numpy as np
              out = np.empty(k)
              for f_ in range(k):
                  tr, va = folds != f_, folds == f_
                  kept = _screen(X[tr], y[tr], n_keep)
                  Xtr_k, Xva_k = X[tr][:, kept], X[va][:, kept]
                  d2 = ((Xva_k[:, None, :] - Xtr_k[None, :, :]) ** 2).sum(-1)
                  out[f_] = np.mean(y[tr][np.argmin(d2, axis=1)] != y[va])
              return out
          def f(X, y, grid, k, seed):
              import numpy as np
              folds = _kfold(y, k, seed)
              tbl = np.column_stack([_fold_errs(X, y, nk, folds, k) for nk in grid])
              mean = tbl.mean(0)
              se = tbl.std(0, ddof=1) / np.sqrt(k)
              i_min = int(np.argmin(mean))
              i = int(np.flatnonzero(mean <= mean[i_min] + se[i_min])[0])
              pick = int(grid[i])
              errors = np.empty(k)
              for f_ in range(k):
                  tr, va = folds != f_, folds == f_
                  kept = _screen(X[tr], y[tr], pick)
                  Xtr_k, Xva_k = X[tr][:, kept], X[va][:, kept]
                  d2 = ((Xva_k[:, None, :] - Xtr_k[None, :, :]) ** 2).sum(-1)
                  errors[f_] = np.mean(y[tr][np.argmin(d2, axis=1)] != y[va])
              return errors, np.full(k, float(pick))
  leakage-gap:
    kind: metric
    metric: rmse
    threshold: -0.02
    labels_code: |
      # The reference study's own thirty reports — wrong-way, tuned
      # shortcut, nested; ten seeds each — frozen at authoring time.
      # Data-dependent per seed, so the bar cannot be met by typing the
      # three protocols' typical values: block-constant guesses score
      # near 0.03 RMSE against these, above the 0.02 bar, while a study
      # run through correct checkpointed functions reproduces them
      # report for report.
      labels = np.loadtxt("private/reports.csv")
  why-the-gap:
    kind: review
    rubric: |
      The question: the wrong-way pipeline used disjoint folds and refit
      the classifier every round, yet reported ~3-5% on a problem whose
      true error is 50%. Name the assumption honest cross-validation makes
      about the held-out fold, how the full-data screen violates it, and
      why disjoint folds do not restore it.

      Pass if the answer states, in some phrasing, that CV's validity
      requires the held-out fold to be independent of (exchangeable with a
      fresh draw, conditional on) the FITTED RULE, that the rule includes
      the screening step's kept feature set, and that screening on all
      rows makes the kept set a function of the held-out fold's labels —
      so conditional on the kept features the held-out labels are no
      longer fresh (they correlate with the kept columns although the
      population correlations are zero). Accept equivalent phrasings:
      "selection is fitting and ran outside the folds", "the hypothesis
      was chosen after seeing the validation data", exchangeability of
      folds conditional on the selection.
      The answer must also convey why row-disjointness is not enough: the
      dependence enters through the label-dependent selection, not
      through shared rows.

      Fail if the answer only invokes "overfitting", "data leakage", or
      "double dipping" without naming what became dependent on what; if it
      attributes the gap to the classifier choice, the fold count, or
      small n; or if it claims the folds shared rows.

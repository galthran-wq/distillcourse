              Xc = X[tr0] - X[tr0].mean(0)
              yc = y[tr0] - y[tr0].mean()
              r = (Xc.T @ yc) / (np.sqrt((Xc ** 2).sum(0)) * np.sqrt((yc ** 2).sum()))

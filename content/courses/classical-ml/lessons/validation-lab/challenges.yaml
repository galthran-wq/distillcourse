checkpoints:
  kfold-indices:
    kind: exact
    seed: 111
    atol: 1.0e-9
    inputs_code: |
      # Imbalanced on purpose: 15 vs 8 with k=5 makes the stratification
      # and the remainder-dealing both visible in the output.
      y = np.repeat([0.0, 1.0], [15, 8])
      rng.shuffle(y)
      inputs = (y, 5, 11)
    wrong:
      - hint: "One permutation over all rows ignores the classes — where the positives land is luck. Permute and deal each class separately, in np.unique(y) order."
        code: |
          def f(y, k, seed):
              import numpy as np
              rng = np.random.default_rng(seed)
              perm = rng.permutation(len(y))
              folds = np.empty(len(y), dtype=np.int64)
              folds[perm] = np.arange(len(y)) % k
              return folds
      - hint: "Dealing each class in blocks of n_c // k piles the remainder into the last fold — here it ends up with half the positives. The j-th shuffled row of a class goes to fold j % k."
        code: |
          def f(y, k, seed):
              import numpy as np
              rng = np.random.default_rng(seed)
              folds = np.empty(len(y), dtype=np.int64)
              for c in np.unique(y):
                  rows = np.flatnonzero(y == c)
                  perm = rng.permutation(rows)
                  size = max(len(rows) // k, 1)
                  folds[perm] = np.minimum(np.arange(len(rows)) // size, k - 1)
              return folds
      - hint: "Re-creating np.random.default_rng(seed) inside the per-class loop restarts the random stream for every class, so each class is shuffled by the same draws and the assignment silently changes. The contract creates the generator ONCE, before the loop; every class then consumes the one stream in np.unique(y) order."
        code: |
          def f(y, k, seed):
              import numpy as np
              folds = np.empty(len(y), dtype=np.int64)
              for c in np.unique(y):
                  rng = np.random.default_rng(seed)
                  rows = np.flatnonzero(y == c)
                  perm = rng.permutation(rows)
                  folds[perm] = np.arange(len(perm)) % k
              return folds
  cv-score:
    kind: exact
    seed: 222
    atol: 1.0e-6
    inputs_code: |
      # A deterministic least-squares fit-callable: the checkpoint grades
      # the protocol around it, not the model inside it.
      def fit_ls(Xtr, ytr):
          A = np.column_stack([np.ones(len(Xtr)), Xtr])
          coef = np.linalg.lstsq(A, ytr, rcond=None)[0]
          return lambda Xv: np.column_stack([np.ones(len(Xv)), Xv]) @ coef
      def mse_in(y_true, y_pred):
          return float(np.mean((y_true - y_pred) ** 2))
      X = rng.normal(size=(40, 3))
      y = X @ np.array([1.0, -2.0, 0.5]) + rng.normal(size=40)
      folds = rng.permutation(np.arange(40) % 5)
      inputs = (fit_ls, X, y, folds, mse_in)
    wrong:
      - hint: "The roles are swapped: fold f is the VALIDATION set. Fit on every row outside fold f, score on fold f — not the reverse."
        code: |
          def f(fit_fn, X, y, folds, err):
              import numpy as np
              k = int(folds.max()) + 1
              out = np.empty(k)
              for fold in range(k):
                  tr, va = folds == fold, folds != fold
                  predict = fit_fn(X[tr], y[tr])
                  out[fold] = err(y[va], predict(X[va]))
              return out
      - hint: "Fold f's error must be computed on rows the fit never saw: predict on X[folds == f]. Scoring the fit on its own training rows is the optimism this module opened with."
        code: |
          def f(fit_fn, X, y, folds, err):
              import numpy as np
              k = int(folds.max()) + 1
              out = np.empty(k)
              for fold in range(k):
                  tr = folds != fold
                  predict = fit_fn(X[tr], y[tr])
                  out[fold] = err(y[tr], predict(X[tr]))
              return out
  bootstrap-se:
    kind: exact
    seed: 333
    atol: 1.0e-6
    inputs_code: |
      mpg = np.loadtxt("data/auto.csv", delimiter=",", skiprows=1)[:, 0]
      inputs = (mpg, np.median, 500, 7)
    wrong:
      - hint: "The replicates' spread is the ddof=1 standard deviation — numpy's std defaults to ddof=0."
        code: |
          def f(x, stat, B, seed):
              import numpy as np
              rng = np.random.default_rng(seed)
              n = len(x)
              stats = np.array([stat(x[rng.integers(0, n, size=n)]) for _ in range(B)])
              return float(stats.std())
      - hint: "A full-size draw WITHOUT replacement is the whole sample reordered — every replicate statistic is identical and the SE collapses to zero. rng.integers(0, n, size=n) draws with replacement."
        code: |
          def f(x, stat, B, seed):
              import numpy as np
              rng = np.random.default_rng(seed)
              n = len(x)
              stats = np.array([stat(x[rng.permutation(n)]) for _ in range(B)])
              return float(stats.std(ddof=1))
      - hint: "The SE is the replicates' spread about their OWN mean, std(ddof=1) — not the root-mean-square distance from the full-sample statistic."
        code: |
          def f(x, stat, B, seed):
              import numpy as np
              rng = np.random.default_rng(seed)
              n = len(x)
              stats = np.array([stat(x[rng.integers(0, n, size=n)]) for _ in range(B)])
              return float(np.sqrt(np.mean((stats - stat(x)) ** 2)))
  one-se-rule:
    kind: exact
    seed: 401
    atol: 1.0e-9
    inputs_code: |
      # A U-shaped truth under uneven fold noise: the argmin sits in the
      # complex half, the band reaches well back toward simplicity, and
      # the per-column scatter varies enough to expose a mis-anchored band.
      base = 0.55 + 0.25 * np.linspace(-1.0, 0.5, 12) ** 2
      scale = rng.uniform(0.05, 0.16, size=12)
      tbl = base + rng.normal(0.0, 1.0, size=(10, 12)) * scale
      inputs = (tbl,)
    wrong:
      - hint: "Within the one-SE band you take the SIMPLEST setting — the smallest index that clears it, not the last one inside the band."
        code: |
          def f(fold_errors):
              import numpy as np
              k = fold_errors.shape[0]
              mean = fold_errors.mean(0)
              se = fold_errors.std(0, ddof=1) / np.sqrt(k)
              i_min = int(np.argmin(mean))
              i_pick = int(np.flatnonzero(mean <= mean[i_min] + se[i_min])[-1])
              return mean, se, i_min, i_pick
      - hint: "The band is one number, anchored at the minimum: mean[i_min] + se[i_min]. Testing each column against its own SE moves the bar per column."
        code: |
          def f(fold_errors):
              import numpy as np
              k = fold_errors.shape[0]
              mean = fold_errors.mean(0)
              se = fold_errors.std(0, ddof=1) / np.sqrt(k)
              i_min = int(np.argmin(mean))
              i_pick = int(np.flatnonzero(mean <= mean[i_min] + se)[0])
              return mean, se, i_min, i_pick
      - hint: "The standard error of a mean over k folds is sd/sqrt(k), not sd/k."
        code: |
          def f(fold_errors):
              import numpy as np
              k = fold_errors.shape[0]
              mean = fold_errors.mean(0)
              se = fold_errors.std(0, ddof=1) / k
              i_min = int(np.argmin(mean))
              i_pick = int(np.flatnonzero(mean <= mean[i_min] + se[i_min])[0])
              return mean, se, i_min, i_pick
  screen-then-cv:
    kind: exact
    seed: 8
    atol: 1.0e-9
    inputs_code: |
      # The ESL referee problem: pure noise, so the truth is 50% and the
      # expected output is the size of the leak.
      X = rng.normal(size=(50, 5000))
      y = np.repeat([1.0, -1.0], 25)
      inputs = (X, y, 100, 5, 8)
    wrong:
      - hint: "np.argsort ascends: [:n_keep] keeps the hundred most ANTI-correlated columns. The largest signed correlations sit at the END of the order."
        code: |
          def _kfold(y, k, seed):
              import numpy as np
              rng = np.random.default_rng(seed)
              folds = np.empty(len(y), dtype=np.int64)
              for c in np.unique(y):
                  rows = np.flatnonzero(y == c)
                  perm = rng.permutation(rows)
                  folds[perm] = np.arange(len(perm)) % k
              return folds
          def f(X, y, n_keep, k, seed):
              import numpy as np
              Xc = X - X.mean(0)
              yc = y - y.mean()
              r = (Xc.T @ yc) / (np.sqrt((Xc ** 2).sum(0)) * np.sqrt((yc ** 2).sum()))
              kept = np.argsort(r)[:n_keep]
              Xk = X[:, kept]
              folds = _kfold(y, k, seed)
              out = np.empty(k)
              for fold in range(k):
                  tr, va = folds != fold, folds == fold
                  d2 = ((Xk[va][:, None, :] - Xk[tr][None, :, :]) ** 2).sum(-1)
                  out[fold] = np.mean(y[tr][np.argmin(d2, axis=1)] != y[va])
              return float(out.mean())
      - hint: "\"Keep the strongest\" read as |r| keeps the most anti-correlated columns too — a legitimate screen in general, and the exact ambiguity the wrong-way lesson's reproduction had to bracket (its |r| variant reports ~1% where the signed one reports ~5%). This lab's contract is the lesson's protocol: the n_keep largest SIGNED correlations, np.argsort(r)[-n_keep:] with no absolute value."
        code: |
          def _kfold(y, k, seed):
              import numpy as np
              rng = np.random.default_rng(seed)
              folds = np.empty(len(y), dtype=np.int64)
              for c in np.unique(y):
                  rows = np.flatnonzero(y == c)
                  perm = rng.permutation(rows)
                  folds[perm] = np.arange(len(perm)) % k
              return folds
          def f(X, y, n_keep, k, seed):
              import numpy as np
              Xc = X - X.mean(0)
              yc = y - y.mean()
              r = (Xc.T @ yc) / (np.sqrt((Xc ** 2).sum(0)) * np.sqrt((yc ** 2).sum()))
              kept = np.argsort(np.abs(r))[-n_keep:]
              Xk = X[:, kept]
              folds = _kfold(y, k, seed)
              out = np.empty(k)
              for fold in range(k):
                  tr, va = folds != fold, folds == fold
                  d2 = ((Xk[va][:, None, :] - Xk[tr][None, :, :]) ** 2).sum(-1)
                  out[fold] = np.mean(y[tr][np.argmin(d2, axis=1)] != y[va])
              return float(out.mean())
  screen-within-cv:
    kind: exact
    seed: 5
    atol: 1.0e-9

<svg viewBox="0 0 560 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="14">
  <style>
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .axis { stroke: currentColor; opacity: 0.35; }
  </style>

  <!-- axes: seed (horizontal), 5-fold CV error report (vertical) -->
  <line class="axis" x1="48" y1="290" x2="470" y2="290"/>
  <line class="axis" x1="48" y1="40" x2="48" y2="290"/>
  <text class="muted" x="478" y="294">seed</text>
  <text class="muted" x="42" y="294" text-anchor="end">0</text>
  <text class="muted" x="42" y="198" text-anchor="end">.25</text>
  <text class="muted" x="42" y="102" text-anchor="end">.50</text>

  <!-- the truth every classifier is bound to: 50% error on pure noise -->
  <line x1="48" y1="97.7" x2="470" y2="97.7" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.5"/>
  <text class="muted" x="478" y="102">truth 0.5</text>

  <!-- right way: screen inside each fold (measured, seeds 0-9) -->
  <g fill="#4c8dd6">
    <circle cx="70" cy="136.2" r="4.5"/><circle cx="110" cy="113.1" r="4.5"/>
    <circle cx="150" cy="105.4" r="4.5"/><circle cx="190" cy="90" r="4.5"/>
    <circle cx="230" cy="51.5" r="4.5"/><circle cx="270" cy="97.7" r="4.5"/>
    <circle cx="310" cy="113.1" r="4.5"/><circle cx="350" cy="74.6" r="4.5"/>
    <circle cx="390" cy="136.2" r="4.5"/><circle cx="430" cy="82.3" r="4.5"/>
  </g>
  <text x="70" y="34" fill="#4c8dd6">screen inside each fold</text>

  <!-- wrong way: screen on all rows first (measured, same seeds, same folds) -->
  <g stroke="#e2903a" stroke-width="2">
    <path d="M66 270.6 74 278.6 M66 278.6 74 270.6"/>
    <path d="M106 286 114 294 M106 294 114 286"/>
    <path d="M146 239.9 154 247.9 M146 247.9 154 239.9"/>
    <path d="M186 278.3 194 286.3 M186 286.3 194 278.3"/>
    <path d="M226 270.6 234 278.6 M226 278.6 234 270.6"/>
    <path d="M266 270.6 274 278.6 M266 278.6 274 270.6"/>
    <path d="M306 270.6 314 278.6 M306 278.6 314 270.6"/>
    <path d="M346 262.9 354 270.9 M346 270.9 354 262.9"/>
    <path d="M386 247.5 394 255.5 M386 255.5 394 247.5"/>
    <path d="M426 262.9 434 270.9 M426 270.9 434 262.9"/>
  </g>
  <text x="70" y="235" fill="#e2903a">screen on all rows first</text>

  <text class="muted" x="259" y="314" text-anchor="middle">same data, same folds, same classifier — one step moved across the fold boundary</text>
</svg>

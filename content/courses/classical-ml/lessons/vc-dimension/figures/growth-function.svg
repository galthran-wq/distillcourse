  <polyline fill="none" stroke="#e2903a" stroke-width="2" points="60,300 78,290.7 96,285.2 114,281.3 132,278.3 150,275.9 168,273.8 186,272 204,270.4 222,269 240,267.7 258,266.5 276,265.5 294,264.5 312,263.5 330,262.7 348,261.9 366,261.1 384,260.4 402,259.7 420,259 438,258.4 456,257.8 474,257.2 492,256.7 510,256.1 528,255.6 546,255.1 564,254.7 582,254.2 600,253.8"/>

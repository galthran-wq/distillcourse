  <line x1="60" y1="300" x2="612" y2="300" stroke="currentColor" stroke-width="1"/>
  <line x1="60" y1="300" x2="60" y2="14" stroke="currentColor" stroke-width="1"/>
  <text x="336" y="330" font-size="12" fill="currentColor" text-anchor="middle">n (points)</text>
  <text x="16" y="24" font-size="12" fill="currentColor">log&#8322; &#964;(n)</text>
  <!-- x ticks -->
  <g font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">
    <text x="60" y="314">0</text><text x="240" y="314">10</text><text x="420" y="314">20</text><text x="600" y="314">30</text>
  </g>
  <!-- y ticks -->
  <g font-size="11" fill="currentColor" opacity="0.55" text-anchor="end">
    <text x="54" y="304">0</text><text x="54" y="211">10</text><text x="54" y="117">20</text><text x="54" y="24">30</text>
  </g>

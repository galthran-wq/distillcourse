<svg viewBox="0 0 560 340" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="280" y="26" font-size="13" fill="currentColor" text-anchor="middle">4 points, one interior: the surround labeling has no line</text>
  <polygon points="160,90 420,115 295,275" fill="currentColor" opacity="0.07"/>
  <polygon points="160,90 420,115 295,275" fill="none" stroke="#e2903a" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="160" cy="90" r="6" fill="#e2903a"/>
  <text x="143" y="79" font-size="13" fill="#e2903a" text-anchor="middle">+</text>
  <circle cx="420" cy="115" r="6" fill="#e2903a"/>
  <text x="438" y="107" font-size="13" fill="#e2903a" text-anchor="middle">+</text>
  <circle cx="295" cy="275" r="6" fill="#e2903a"/>
  <text x="295" y="302" font-size="13" fill="#e2903a" text-anchor="middle">+</text>
  <circle cx="292" cy="158" r="6" fill="#4c8dd6"/>

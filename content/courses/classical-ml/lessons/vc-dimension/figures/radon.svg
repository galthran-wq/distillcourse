<svg viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="150" y="24" font-size="12" fill="currentColor" text-anchor="middle">convex position: pair vs pair</text>
  <text x="450" y="24" font-size="12" fill="currentColor" text-anchor="middle">one interior: point vs triangle</text>
  <!-- left panel: 4 convex points, diagonal partition -->
  <g>
    <line x1="60" y1="130" x2="250" y2="145" stroke="#e2903a" stroke-width="1.5"/>
    <line x1="150" y1="55" x2="158" y2="230" stroke="#4c8dd6" stroke-width="1.5"/>
    <circle cx="60" cy="130" r="5.5" fill="#e2903a"/>
    <circle cx="250" cy="145" r="5.5" fill="#e2903a"/>
    <circle cx="150" cy="55" r="5.5" fill="#4c8dd6"/>
    <circle cx="158" cy="230" r="5.5" fill="#4c8dd6"/>
    <circle cx="153" cy="137" r="5" fill="none" stroke="#5aa46a" stroke-width="2"/>
    <text x="170" y="122" font-size="11" fill="#5aa46a">in both hulls</text>
    <text x="42" y="112" font-size="11" fill="#e2903a">X&#8321;</text>
    <text x="126" y="52" font-size="11" fill="#4c8dd6">X&#8322;</text>
  </g>
  <!-- right panel: triangle + interior point -->
  <g>
    <polygon points="360,70 555,95 455,235" fill="currentColor" opacity="0.07"/>
    <polygon points="360,70 555,95 455,235" fill="none" stroke="#e2903a" stroke-width="1.5"/>
    <circle cx="360" cy="70" r="5.5" fill="#e2903a"/>
    <circle cx="555" cy="95" r="5.5" fill="#e2903a"/>
    <circle cx="455" cy="235" r="5.5" fill="#e2903a"/>
    <circle cx="452" cy="128" r="5.5" fill="#4c8dd6"/>
    <circle cx="452" cy="128" r="9" fill="none" stroke="#5aa46a" stroke-width="2"/>
    <text x="470" y="160" font-size="11" fill="#5aa46a">X&#8322; lies inside X&#8321;'s hull</text>
    <text x="345" y="54" font-size="11" fill="#e2903a">X&#8321;</text>
    <text x="470" y="118" font-size="11" fill="#4c8dd6">X&#8322;</text>
  </g>
  <text x="300" y="284" font-size="11.5" fill="currentColor" text-anchor="middle">d + 2 points always admit such a split, so no halfspace puts X&#8321; on one side and X&#8322; on the other</text>
</svg>

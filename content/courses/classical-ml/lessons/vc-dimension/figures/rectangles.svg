<svg viewBox="0 0 380 360" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- top: diamond shattered -->
  <text x="190" y="18" font-size="12" fill="currentColor" text-anchor="middle">the diamond: every subset is catchable</text>
  <rect x="150" y="38" width="80" height="152" rx="3" fill="none" stroke="#e2903a" stroke-width="1.8"/>
  <circle cx="190" cy="50" r="5.5" fill="#e2903a"/>
  <circle cx="190" cy="180" r="5.5" fill="#e2903a"/>
  <circle cx="300" cy="115" r="5.5" fill="#4c8dd6"/>
  <circle cx="80" cy="115" r="5.5" fill="#4c8dd6"/>
  <text x="316" y="119" font-size="12" fill="#4c8dd6">&#8722;</text>
  <text x="58" y="119" font-size="12" fill="#4c8dd6">&#8722;</text>
  <text x="190" y="212" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">shown: {top, bottom} in, {left, right} out</text>
  <!-- bottom: 5th point trapped -->
  <text x="190" y="238" font-size="12" fill="currentColor" text-anchor="middle">any 5 points: one is trapped</text>
  <rect x="60" y="255" width="270" height="90" rx="3" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.5"/>
  <circle cx="60" cy="295" r="5" fill="#e2903a"/>
  <circle cx="330" cy="305" r="5" fill="#e2903a"/>
  <circle cx="200" cy="255" r="5" fill="#e2903a"/>
  <circle cx="195" cy="345" r="5" fill="#e2903a"/>
  <circle cx="200" cy="300" r="5" fill="#4c8dd6"/>
  <text x="212" y="292" font-size="12" fill="#4c8dd6">&#8722; ?</text>
</svg>

<svg viewBox="0 0 560 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- axes -->
  <g stroke="currentColor" stroke-width="1.2" fill="none">
    <line x1="70" y1="40" x2="70" y2="272"/>
    <line x1="70" y1="272" x2="525" y2="272"/>
    <polyline points="66,46 70,40 74,46"/>
    <polyline points="519,268 525,272 519,276"/>
  </g>
  <text x="62" y="50" font-size="11.5" fill="currentColor" text-anchor="end">samples n</text>
  <text x="297" y="296" font-size="11.5" fill="currentColor" text-anchor="middle">d = VCdim(&#8459;)</text>
  <!-- the band between the two bounds -->
  <polygon points="70,235 515,60 515,175 70,252" fill="#e2903a" opacity="0.10"/>
  <g stroke="#4c8dd6" stroke-width="1.6" fill="none">
    <line x1="70" y1="235" x2="515" y2="60"/>
    <line x1="70" y1="252" x2="515" y2="175"/>
  </g>
  <!-- the true sample complexity, pinned inside -->
  <path d="M 70,244 C 160,232 240,214 300,193 C 360,172 440,146 515,120" fill="none" stroke="#e2903a" stroke-width="2"/>
  <text x="255" y="180" font-size="12" fill="#e2903a" text-anchor="middle">n<tspan dy="3" font-size="9.5">&#8459;</tspan><tspan dy="-3">(&#949;, &#948;)</tspan></text>
  <line x1="256" y1="186" x2="258" y2="201" stroke="#e2903a" stroke-width="1" opacity="0.6"/>
  <!-- labels for the two bounds -->
  <text x="86" y="64" font-size="12" fill="#4c8dd6">upper bound: C&#8322;&#8202;(d + ln 1/&#948;)/&#949;&#178;</text>
  <text x="86" y="80" font-size="11" fill="#4c8dd6" opacity="0.75">symmetrization + Sauer &#8212; ERM succeeds with this many</text>
  <text x="515" y="222" font-size="12" fill="#4c8dd6" text-anchor="end">lower bound: C&#8321;&#8202;(d + ln 1/&#948;)/&#949;&#178;</text>
  <text x="515" y="238" font-size="11" fill="#4c8dd6" opacity="0.75" text-anchor="end">adversary on a shattered set &#8212; no algorithm with fewer</text>
</svg>

<svg viewBox="0 0 620 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- left: the split of H_C on c1 -->
  <text x="120" y="26" font-size="12.5" fill="currentColor" text-anchor="middle">H<tspan dy="3" font-size="10">C</tspan><tspan dy="-3"> split on the first point</tspan></text>
  <g font-size="12" fill="currentColor" text-anchor="middle">
    <text x="70" y="52" opacity="0.55">c&#8321;</text><text x="105" y="52" opacity="0.55">c&#8322;</text><text x="140" y="52" opacity="0.55">c&#8323;</text>
  </g>
  <!-- paired rows (differ only at c1): amber -->
  <rect x="50" y="60" width="110" height="44" rx="4" fill="#e2903a" opacity="0.14"/>
  <rect x="50" y="152" width="110" height="44" rx="4" fill="#e2903a" opacity="0.14"/>
  <g font-size="13" fill="currentColor" text-anchor="middle">
    <text x="70" y="76">0</text><text x="105" y="76">0</text><text x="140" y="76">0</text>
    <text x="70" y="98">1</text><text x="105" y="98">0</text><text x="140" y="98">0</text>
    <text x="70" y="124">0</text><text x="105" y="124">1</text><text x="140" y="124">0</text>
    <text x="70" y="168">0</text><text x="105" y="168">0</text><text x="140" y="168">1</text>
    <text x="70" y="190">1</text><text x="105" y="190">0</text><text x="140" y="190">1</text>
    <text x="70" y="216">0</text><text x="105" y="216">1</text><text x="140" y="216">1</text>
  </g>
  <text x="172" y="86" font-size="11" fill="#e2903a">pair</text>
  <text x="172" y="178" font-size="11" fill="#e2903a">pair</text>
  <g font-size="11.5">
    <text x="30" y="252" fill="#4c8dd6">Y&#8320; = distinct tails {00, 10, 01, 11}: 4</text>
    <text x="30" y="272" fill="#e2903a">Y&#8321; = doubled tails {00, 01}: 2</text>
    <text x="30" y="296" fill="currentColor">|H<tspan dy="3" font-size="9.5">C</tspan><tspan dy="-3">| = 4 + 2 = 6 &#8804; &#934;</tspan><tspan dy="3" font-size="9.5">2</tspan><tspan dy="-3">(3) = 7</tspan></text>
  </g>
  <!-- right: the recursion is Pascal's -->
  <text x="465" y="26" font-size="12.5" fill="currentColor" text-anchor="middle">the count obeys Pascal's recursion</text>
  <text x="465" y="52" font-size="12" fill="currentColor" text-anchor="middle">&#934;<tspan dy="3" font-size="9.5">d</tspan><tspan dy="-3">(n) = &#934;</tspan><tspan dy="3" font-size="9.5">d</tspan><tspan dy="-3">(n&#8722;1) + &#934;</tspan><tspan dy="3" font-size="9.5">d&#8722;1</tspan><tspan dy="-3">(n&#8722;1)</tspan></text>
  <g font-size="12" fill="currentColor" text-anchor="middle">
    <text x="400" y="86" opacity="0.55">d = 0</text><text x="465" y="86" opacity="0.55">d = 1</text><text x="530" y="86" opacity="0.55">d = 2</text>
    <text x="352" y="112" opacity="0.55">n = 1</text><text x="400" y="112">1</text><text x="465" y="112">2</text><text x="530" y="112">2</text>
    <text x="352" y="142" opacity="0.55">n = 2</text><text x="400" y="142">1</text><text x="465" y="142">3</text><text x="530" y="142">4</text>
    <text x="352" y="172" opacity="0.55">n = 3</text><text x="400" y="172">1</text><text x="465" y="172">4</text><text x="530" y="172">7</text>
    <text x="352" y="202" opacity="0.55">n = 4</text><text x="400" y="202">1</text><text x="465" y="202">5</text><text x="530" y="202">11</text>
  </g>
  <circle cx="530" cy="198" r="13" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <line x1="527" y1="185" x2="528" y2="178" stroke="#e2903a" stroke-width="1.3"/>
  <line x1="519" y1="191" x2="476" y2="172" stroke="#e2903a" stroke-width="1.3"/>
  <text x="345" y="245" font-size="11.5" fill="currentColor">&#934;<tspan dy="3" font-size="9.5">d</tspan><tspan dy="-3">(n) = &#931;</tspan><tspan dy="3" font-size="9.5">i&#8804;d</tspan><tspan dy="-3"> C(n, i): the number of</tspan></text>
  <text x="345" y="263" font-size="11.5" fill="currentColor">subsets of size &#8804; d &#8212; Sauer's bound</text>
</svg>

<svg viewBox="0 0 620 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="310" y="24" font-size="13" fill="currentColor" text-anchor="middle">step 2 &#183; ghost sample: a second draw replaces R</text>
  <text x="310" y="56" font-size="12.5" fill="currentColor" text-anchor="middle">&#8804; E sup<tspan dy="3" font-size="10">h</tspan><tspan dy="-3">&#8201;[ R&#770;</tspan><tspan dy="3" font-size="10">S&#8242;</tspan><tspan dy="-3">(h) &#8722; R&#770;</tspan><tspan dy="3" font-size="10">S</tspan><tspan dy="-3">(h) ]</tspan></text>
  <text x="90" y="128" font-size="11" fill="#4c8dd6">S: the n observed points</text>
  <text x="56" y="154" font-size="12" fill="#4c8dd6" text-anchor="middle">S</text>
  <g fill="#4c8dd6">
    <circle cx="90" cy="150" r="5"/><circle cx="132" cy="150" r="5"/><circle cx="174" cy="150" r="5"/><circle cx="216" cy="150" r="5"/><circle cx="258" cy="150" r="5"/><circle cx="300" cy="150" r="5"/><circle cx="342" cy="150" r="5"/><circle cx="384" cy="150" r="5"/>
  </g>
  <text x="56" y="214" font-size="12" fill="#e2903a" text-anchor="middle">S&#8242;</text>
  <g fill="#e2903a">
    <circle cx="90" cy="210" r="5"/><circle cx="132" cy="210" r="5"/><circle cx="174" cy="210" r="5"/><circle cx="216" cy="210" r="5"/><circle cx="258" cy="210" r="5"/><circle cx="300" cy="210" r="5"/><circle cx="342" cy="210" r="5"/><circle cx="384" cy="210" r="5"/>
  </g>
  <text x="90" y="240" font-size="11" fill="#e2903a">S&#8242;: a ghost sample &#8212; n imaginary fresh points</text>
  <g font-size="11.5" fill="currentColor">
    <text x="424" y="142">S&#8242; is never drawn; it</text>
    <text x="424" y="158">exists only inside the</text>
    <text x="424" y="174">expectation E</text>
  </g>
  <text x="310" y="284" font-size="11.5" fill="currentColor" opacity="0.55" text-anchor="middle">R(h) is the expectation of the ghost empirical risk: the unobservable becomes n more points &#8212; 2n in play</text>
</svg>

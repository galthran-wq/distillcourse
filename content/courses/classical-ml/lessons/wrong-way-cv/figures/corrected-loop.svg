<svg viewBox="0 0 640 275" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- LEFT: the corrected outer loop -->
  <rect x="40" y="26" width="250" height="26" rx="4" fill="none" stroke="currentColor" opacity="0.8"/>
  <text x="165" y="43" font-size="12" fill="currentColor" text-anchor="middle">50 samples &#215; 5,000 noise features</text>
  <line x1="165" y1="52" x2="165" y2="66" stroke="currentColor" opacity="0.6"/>
  <path d="M 161 62 L 165 68 L 169 62" fill="none" stroke="currentColor" opacity="0.6"/>
  <text x="175" y="63" font-size="11" fill="currentColor" opacity="0.55">split first</text>

  <!-- fold strip -->
  <g>
    <rect x="50" y="72" width="46" height="24" fill="none" stroke="currentColor" opacity="0.6"/>
    <rect x="96" y="72" width="46" height="24" fill="none" stroke="currentColor" opacity="0.6"/>
    <rect x="142" y="72" width="46" height="24" fill="none" stroke="currentColor" opacity="0.6"/>
    <rect x="188" y="72" width="46" height="24" fill="#4c8dd6" opacity="0.25"/>
    <rect x="188" y="72" width="46" height="24" fill="none" stroke="#4c8dd6"/>
    <rect x="234" y="72" width="46" height="24" fill="none" stroke="currentColor" opacity="0.6"/>
    <text x="211" y="88" font-size="10.5" fill="currentColor" text-anchor="middle">val</text>
  </g>
  <line x1="165" y1="100" x2="165" y2="114" stroke="currentColor" opacity="0.6"/>
  <path d="M 161 110 L 165 116 L 169 110" fill="none" stroke="currentColor" opacity="0.6"/>

  <!-- each-round box -->
  <rect x="40" y="118" width="250" height="102" rx="6" fill="none" stroke="#4c8dd6" stroke-width="1.6"/>
  <text x="165" y="136" font-size="11.5" fill="currentColor" text-anchor="middle">each round, on <tspan fill="#4c8dd6" font-weight="600">the 40 training rows</tspan>:</text>
  <text x="56" y="157" font-size="11.5" fill="currentColor">1. <tspan font-weight="600">screen</tspan> on the 40 labels: keep the top k</text>
  <text x="56" y="176" font-size="11.5" fill="currentColor">2. fit 1-NN on the survivors</text>
  <text x="56" y="195" font-size="11.5" fill="currentColor">3. score the held-out 10</text>

  <line x1="165" y1="224" x2="165" y2="238" stroke="currentColor" opacity="0.6"/>
  <path d="M 161 234 L 165 240 L 169 234" fill="none" stroke="currentColor" opacity="0.6"/>
  <text x="165" y="258" font-size="13" font-weight="600" fill="#4c8dd6" text-anchor="middle">average the 5 fold scores &#8594; &#8776;50%</text>

  <!-- connector from the screen step to the inset -->
  <path d="M 292 153 C 316 150 322 146 338 140" fill="none" stroke="currentColor" opacity="0.5" stroke-dasharray="4 3"/>

  <!-- RIGHT: the extra level a tuned k demands -->
  <rect x="344" y="72" width="256" height="148" rx="6" fill="none" stroke="currentColor" opacity="0.7" stroke-dasharray="5 4"/>
  <text x="472" y="93" font-size="12" font-weight="600" fill="currentColor" text-anchor="middle">if k must be tuned: one more level</text>
  <text x="472" y="112" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">inside each round, split the 40 again</text>
  <g>
    <rect x="388" y="120" width="42" height="20" fill="none" stroke="currentColor" opacity="0.6"/>
    <rect x="430" y="120" width="42" height="20" fill="none" stroke="currentColor" opacity="0.6"/>
    <rect x="472" y="120" width="42" height="20" fill="currentColor" opacity="0.18"/>
    <rect x="472" y="120" width="42" height="20" fill="none" stroke="currentColor" opacity="0.6"/>
    <rect x="514" y="120" width="42" height="20" fill="none" stroke="currentColor" opacity="0.6"/>
    <text x="493" y="134" font-size="9.5" fill="currentColor" text-anchor="middle">inner</text>
  </g>
  <text x="472" y="162" font-size="11.5" fill="currentColor" text-anchor="middle">inner CV over the k-grid picks k;</text>
  <text x="472" y="179" font-size="11.5" fill="currentColor" text-anchor="middle"><tspan font-weight="600">the outer fold never sees the choice</tspan></text>
  <text x="472" y="203" font-size="10.5" fill="currentColor" opacity="0.55" text-anchor="middle">the outer score grades the whole recipe</text>
</svg>

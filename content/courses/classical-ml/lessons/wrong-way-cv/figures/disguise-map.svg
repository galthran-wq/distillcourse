<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- generic pipeline -->
  <rect x="30" y="30" width="90" height="30" rx="4" fill="none" stroke="currentColor" opacity="0.8"/>
  <text x="75" y="49" font-size="12" fill="currentColor" text-anchor="middle">raw table</text>
  <line x1="120" y1="45" x2="150" y2="45" stroke="currentColor" opacity="0.6"/>
  <path d="M 146 41 L 152 45 L 146 49" fill="none" stroke="currentColor" opacity="0.6"/>

  <rect x="154" y="30" width="120" height="30" rx="4" fill="none" stroke="#e2903a" stroke-width="1.8"/>
  <text x="214" y="49" font-size="12" fill="#e2903a" font-weight="600" text-anchor="middle">fitted step</text>
  <line x1="274" y1="45" x2="304" y2="45" stroke="currentColor" opacity="0.6"/>
  <path d="M 300 41 L 306 45 L 300 49" fill="none" stroke="currentColor" opacity="0.6"/>

  <rect x="308" y="30" width="130" height="30" rx="4" fill="none" stroke="currentColor" opacity="0.8"/>
  <text x="373" y="49" font-size="12" fill="currentColor" text-anchor="middle">split into folds</text>
  <line x1="438" y1="45" x2="468" y2="45" stroke="currentColor" opacity="0.6"/>
  <path d="M 464 41 L 470 45 L 464 49" fill="none" stroke="currentColor" opacity="0.6"/>

  <rect x="472" y="30" width="110" height="30" rx="4" fill="none" stroke="currentColor" opacity="0.8"/>
  <text x="527" y="49" font-size="12" fill="currentColor" text-anchor="middle">fit + score</text>

  <!-- leak arc: scored rows already fed the fitted step -->
  <path d="M 527 62 C 480 105 280 105 222 66" fill="none" stroke="#e2903a" stroke-width="1.6" stroke-dasharray="4 3"/>
  <path d="M 228 74 L 220 64 L 232 64" fill="none" stroke="#e2903a" stroke-width="1.6"/>
  <text x="374" y="112" font-size="11.5" fill="#e2903a" text-anchor="middle">computed from all rows &#8212; including the ones later scored</text>

  <!-- five occupants of the slot -->
  <text x="30" y="146" font-size="11.5" fill="currentColor" opacity="0.55">what sits in the amber box, in real pipelines:</text>
  <g fill="#e2903a" opacity="0.85">
    <rect x="34" y="166" width="8" height="8"/>
    <rect x="34" y="199" width="8" height="8"/>
    <rect x="34" y="232" width="8" height="8"/>
    <rect x="34" y="265" width="8" height="8"/>
    <rect x="34" y="298" width="8" height="8"/>
  </g>
  <g fill="currentColor" font-size="12">
    <text x="52" y="174">a scaler&#8217;s &#956; and &#963;</text>
    <text x="52" y="207">an imputer&#8217;s fill values</text>
    <text x="52" y="240">a feature screen&#8217;s kept set &#8212; the pure case</text>
    <text x="52" y="273">hyperparameters tuned against a shared test set</text>
    <text x="52" y="306">a benchmark&#8217;s surviving entries (KDDCUP99)</text>
  </g>
  <g fill="#e2903a" font-size="11" text-anchor="end">
    <text x="610" y="174">reads: test rows</text>
    <text x="610" y="207">reads: test rows</text>
    <text x="610" y="240">reads: validation labels</text>
    <text x="610" y="273">reads: test labels, via the literature</text>
    <text x="610" y="306">reads: test labels, via the leaderboard</text>
  </g>
</svg>

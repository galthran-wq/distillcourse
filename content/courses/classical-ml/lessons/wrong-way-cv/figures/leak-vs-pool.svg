<svg viewBox="0 0 600 275" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- axes -->
  <line x1="100" y1="35" x2="100" y2="205" stroke="currentColor"/>
  <line x1="100" y1="205" x2="560" y2="205" stroke="currentColor"/>
  <g stroke="currentColor">
    <line x1="96" y1="205" x2="100" y2="205"/>
    <line x1="96" y1="176.7" x2="100" y2="176.7"/>
    <line x1="96" y1="148.3" x2="100" y2="148.3"/>
    <line x1="96" y1="120" x2="100" y2="120"/>
    <line x1="96" y1="91.7" x2="100" y2="91.7"/>
    <line x1="96" y1="63.3" x2="100" y2="63.3"/>
    <line x1="96" y1="35" x2="100" y2="35"/>
  </g>
  <g fill="currentColor" font-size="10.5" text-anchor="end">
    <text x="92" y="209">0%</text>
    <text x="92" y="180.7">10%</text>
    <text x="92" y="152.3">20%</text>
    <text x="92" y="124">30%</text>
    <text x="92" y="95.7">40%</text>
    <text x="92" y="67.3">50%</text>
    <text x="92" y="39">60%</text>
  </g>

  <!-- truth guide -->
  <line x1="100" y1="63.3" x2="560" y2="63.3" stroke="currentColor" opacity="0.4" stroke-dasharray="4 3"/>
  <text x="104" y="58" font-size="10.5" fill="currentColor" opacity="0.55">truth 50%</text>

  <!-- gap markers -->
  <line x1="170" y1="66" x2="170" y2="186" stroke="currentColor" opacity="0.4" stroke-dasharray="3 3"/>
  <text x="178" y="128" font-size="10.5" fill="currentColor" opacity="0.7">47 pts</text>
  <line x1="340" y1="55" x2="340" y2="100" stroke="currentColor" opacity="0.4" stroke-dasharray="3 3"/>
  <text x="348" y="82" font-size="10.5" fill="currentColor" opacity="0.7">21 pts</text>
  <text x="518" y="70" font-size="10.5" fill="currentColor" opacity="0.7">6 pts</text>

  <!-- right way: flat near the truth -->
  <polyline points="170,59.1 340,48.6 510,57.1" fill="none" stroke="#4c8dd6" stroke-width="1.6"/>
  <g fill="#4c8dd6">
    <circle cx="170" cy="59.1" r="4"/>
    <circle cx="340" cy="48.6" r="4"/>
    <circle cx="510" cy="57.1" r="4"/>
  </g>
  <text x="340" y="36" font-size="11.5" font-weight="600" fill="#4c8dd6" text-anchor="middle">right way: screen inside each fold</text>

  <!-- wrong way: dose set by the pool -->
  <polyline points="170,192.8 340,106.7 510,73.8" fill="none" stroke="#e2903a" stroke-width="1.6"/>
  <g fill="#e2903a">
    <circle cx="170" cy="192.8" r="4"/>
    <circle cx="340" cy="106.7" r="4"/>
    <circle cx="510" cy="73.8" r="4"/>
  </g>
  <text x="300" y="152" font-size="11.5" font-weight="600" fill="#e2903a">wrong way: screen on all rows, then split</text>

  <!-- setting labels -->
  <g fill="currentColor" font-size="11" text-anchor="middle">
    <text x="170" y="226">p = 5,000</text>
    <text x="170" y="241">keep 100</text>
    <text x="340" y="226">p = 500</text>
    <text x="340" y="241">keep 100</text>
    <text x="510" y="226">p = 50</text>
    <text x="510" y="241">keep 10</text>
  </g>
  <text x="330" y="265" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">5-fold CV error of both protocols, 20 repetitions per setting (seeds 200&#8211;219)</text>
</svg>

    <circle cx="388.9" cy="154" r="4"/>
    <circle cx="402.8" cy="154" r="4"/>
    <circle cx="444.4" cy="154" r="4"/>
    <circle cx="458.3" cy="154" r="4"/>
    <circle cx="472.1" cy="154" r="4"/>
    <circle cx="569.2" cy="154" r="4"/>
  </g>
  <line x1="419.4" y1="140" x2="419.4" y2="172" stroke="#4c8dd6" stroke-width="2.5"/>
  <text x="428" y="184" font-size="11" fill="#4c8dd6">mean 50.4%</text>

  <!-- axis -->
  <line x1="70" y1="190" x2="590" y2="190" stroke="currentColor"/>
  <g stroke="currentColor">
    <line x1="70" y1="190" x2="70" y2="195"/>
    <line x1="139.3" y1="190" x2="139.3" y2="195"/>
    <line x1="208.7" y1="190" x2="208.7" y2="195"/>
    <line x1="278" y1="190" x2="278" y2="195"/>
    <line x1="347.3" y1="190" x2="347.3" y2="195"/>
    <line x1="416.7" y1="190" x2="416.7" y2="195"/>

    <circle cx="111.6" cy="88" r="4"/>
    <circle cx="125.5" cy="80" r="4"/>
    <circle cx="139.3" cy="80" r="4"/>
  </g>
  <line x1="106.1" y1="66" x2="106.1" y2="98" stroke="#e2903a" stroke-width="2.5"/>
  <text x="152" y="84" font-size="11" fill="#e2903a">mean 5.2%</text>

  <!-- right-way row -->
  <text x="160" y="134" font-size="11.5" font-weight="600" fill="#4c8dd6">split, then screen inside each fold (right way)</text>
  <g fill="#4c8dd6">

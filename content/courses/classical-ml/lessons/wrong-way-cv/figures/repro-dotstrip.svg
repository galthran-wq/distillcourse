    <line x1="555.3" y1="190" x2="555.3" y2="195"/>
  </g>
  <g fill="currentColor" font-size="11" text-anchor="middle">
    <text x="70" y="208">0%</text>
    <text x="139.3" y="208">10%</text>
    <text x="208.7" y="208">20%</text>
    <text x="278" y="208">30%</text>

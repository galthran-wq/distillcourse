<svg viewBox="0 0 620 260" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="60" y="20" font-size="13" font-weight="600" fill="currentColor">Wrong way: the kept 100, re-measured on a held-out fold of 10</text>
  <text x="60" y="38" font-size="11" fill="currentColor" opacity="0.55">count of features (of the kept 100)</text>

  <!-- bars: held-out-fold correlations of the 100 kept, screened on all 50 -->
  <g fill="#e2903a" opacity="0.85">
    <rect x="216.0" y="183.5" width="26.0" height="26.5"/>
    <rect x="242.0" y="183.5" width="26.0" height="26.5"/>
    <rect x="268.0" y="165.9" width="26.0" height="44.1"/>
    <rect x="294.0" y="165.9" width="26.0" height="44.1"/>
    <rect x="320.0" y="174.7" width="26.0" height="35.3"/>
    <rect x="346.0" y="112.9" width="26.0" height="97.1"/>
    <rect x="372.0" y="86.5" width="26.0" height="123.5"/>
    <rect x="398.0" y="68.8" width="26.0" height="141.2"/>
    <rect x="424.0" y="60.0" width="26.0" height="150.0"/>
    <rect x="450.0" y="148.2" width="26.0" height="61.8"/>
    <rect x="476.0" y="130.6" width="26.0" height="79.4"/>
    <rect x="502.0" y="174.7" width="26.0" height="35.3"/>
    <rect x="528.0" y="192.4" width="26.0" height="17.6"/>
  </g>

  <!-- zero guide -->
  <line x1="320" y1="52" x2="320" y2="210" stroke="currentColor" opacity="0.5" stroke-dasharray="3 3"/>
  <!-- mean marker -->
  <line x1="399.8" y1="52" x2="399.8" y2="210" stroke="currentColor" stroke-width="1.6"/>
  <text x="112" y="72" font-size="11.5" fill="currentColor">mean 0.31 &#8212; not 0:</text>
  <text x="112" y="87" font-size="11.5" fill="currentColor">these 10 labels helped</text>
  <text x="112" y="102" font-size="11.5" fill="currentColor">pick the features</text>
  <path d="M 250 96 C 320 110 360 90 394 76" fill="none" stroke="currentColor" opacity="0.5"/>
  <path d="M 388 74 L 396 75 L 391 82" fill="none" stroke="currentColor" opacity="0.5"/>

  <!-- axis -->
  <line x1="60" y1="210" x2="580" y2="210" stroke="currentColor"/>
  <g stroke="currentColor">
    <line x1="60" y1="210" x2="60" y2="215"/>
    <line x1="190" y1="210" x2="190" y2="215"/>
    <line x1="320" y1="210" x2="320" y2="215"/>
    <line x1="450" y1="210" x2="450" y2="215"/>
    <line x1="580" y1="210" x2="580" y2="215"/>
  </g>
  <g fill="currentColor" font-size="11" text-anchor="middle">
    <text x="60" y="228">&#8722;1</text>
    <text x="190" y="228">&#8722;0.5</text>
    <text x="320" y="228">0</text>
    <text x="450" y="228">0.5</text>
    <text x="580" y="228">1</text>
  </g>
  <text x="320" y="248" font-size="11.5" fill="currentColor" opacity="0.55" text-anchor="middle">correlation with the class labels of the held-out 10</text>
</svg>

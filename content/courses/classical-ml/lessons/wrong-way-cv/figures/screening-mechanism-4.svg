  <line x1="319.7" y1="52" x2="319.7" y2="210" stroke="currentColor" stroke-width="1.6" opacity="0.9"/>
  <text x="452" y="72" font-size="11.5" fill="currentColor">mean &#8776; 0: the fold&#8217;s labels</text>
  <text x="452" y="87" font-size="11.5" fill="currentColor">played no part in the</text>
  <text x="452" y="102" font-size="11.5" fill="currentColor">selection</text>


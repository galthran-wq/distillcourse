<svg viewBox="0 0 640 285" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- panel titles -->
  <text x="155" y="22" font-size="13" font-weight="600" fill="#e2903a" text-anchor="middle">The wrong way</text>
  <text x="475" y="22" font-size="13" font-weight="600" fill="#4c8dd6" text-anchor="middle">The right way</text>

  <!-- LEFT: wrong pipeline -->
  <rect x="40" y="34" width="230" height="28" rx="4" fill="none" stroke="currentColor" opacity="0.8"/>
  <text x="155" y="52" font-size="12" fill="currentColor" text-anchor="middle">50 samples &#215; 5,000 noise features</text>
  <line x1="155" y1="62" x2="155" y2="76" stroke="currentColor" opacity="0.6"/>
  <path d="M 151 72 L 155 78 L 159 72" fill="none" stroke="currentColor" opacity="0.6"/>

  <rect x="40" y="80" width="230" height="38" rx="4" fill="none" stroke="#e2903a" stroke-width="1.6"/>
  <text x="155" y="95" font-size="11.5" fill="currentColor" text-anchor="middle">screen: keep the 100 features most</text>
  <text x="155" y="110" font-size="11.5" fill="currentColor" text-anchor="middle">correlated with <tspan fill="#e2903a" font-weight="600">all 50 labels</tspan></text>
  <line x1="155" y1="118" x2="155" y2="132" stroke="currentColor" opacity="0.6"/>
  <path d="M 151 128 L 155 134 L 159 128" fill="none" stroke="currentColor" opacity="0.6"/>

  <!-- fold strip -->
  <g>
    <rect x="40" y="136" width="46" height="24" fill="none" stroke="currentColor" opacity="0.6"/>
    <rect x="86" y="136" width="46" height="24" fill="none" stroke="currentColor" opacity="0.6"/>
    <rect x="132" y="136" width="46" height="24" fill="none" stroke="currentColor" opacity="0.6"/>
    <rect x="178" y="136" width="46" height="24" fill="#e2903a" opacity="0.25"/>
    <rect x="178" y="136" width="46" height="24" fill="none" stroke="#e2903a"/>
    <rect x="224" y="136" width="46" height="24" fill="none" stroke="currentColor" opacity="0.6"/>
    <text x="201" y="152" font-size="10.5" fill="currentColor" text-anchor="middle">val</text>
  </g>
  <text x="155" y="177" font-size="11.5" fill="currentColor" text-anchor="middle">5-fold CV of 1-NN on the kept 100</text>

  <!-- leak arrow from validation fold back up into the screen -->
  <path d="M 214 134 C 250 122 268 112 260 100" fill="none" stroke="#e2903a" stroke-width="1.6" stroke-dasharray="4 3"/>
  <path d="M 255 106 L 259 98 L 265 104" fill="none" stroke="#e2903a" stroke-width="1.6"/>
  <text x="285" y="130" font-size="10.5" fill="#e2903a">already</text>
  <text x="285" y="143" font-size="10.5" fill="#e2903a">seen</text>

  <text x="155" y="207" font-size="13.5" font-weight="600" fill="#e2903a" text-anchor="middle">reports 3% (ESL) &#183; 5% (ours)</text>

  <!-- RIGHT: right pipeline -->
  <rect x="360" y="34" width="230" height="28" rx="4" fill="none" stroke="currentColor" opacity="0.8"/>
  <text x="475" y="52" font-size="12" fill="currentColor" text-anchor="middle">50 samples &#215; 5,000 noise features</text>
  <line x1="475" y1="62" x2="475" y2="76" stroke="currentColor" opacity="0.6"/>
  <path d="M 471 72 L 475 78 L 479 72" fill="none" stroke="currentColor" opacity="0.6"/>

  <!-- fold strip first -->
  <g>
    <rect x="360" y="80" width="46" height="24" fill="none" stroke="currentColor" opacity="0.6"/>
    <rect x="406" y="80" width="46" height="24" fill="none" stroke="currentColor" opacity="0.6"/>
    <rect x="452" y="80" width="46" height="24" fill="none" stroke="currentColor" opacity="0.6"/>
    <rect x="498" y="80" width="46" height="24" fill="#4c8dd6" opacity="0.25"/>
    <rect x="498" y="80" width="46" height="24" fill="none" stroke="#4c8dd6"/>
    <rect x="544" y="80" width="46" height="24" fill="none" stroke="currentColor" opacity="0.6"/>
    <text x="521" y="96" font-size="10.5" fill="currentColor" text-anchor="middle">val</text>
  </g>
  <text x="475" y="120" font-size="11.5" fill="currentColor" text-anchor="middle" opacity="0.55">split first</text>
  <line x1="475" y1="126" x2="475" y2="138" stroke="currentColor" opacity="0.6"/>
  <path d="M 471 134 L 475 140 L 479 134" fill="none" stroke="currentColor" opacity="0.6"/>

  <rect x="360" y="142" width="230" height="38" rx="4" fill="none" stroke="#4c8dd6" stroke-width="1.6"/>
  <text x="475" y="157" font-size="11.5" fill="currentColor" text-anchor="middle">each round: screen on <tspan fill="#4c8dd6" font-weight="600">the 40 only</tspan>,</text>
  <text x="475" y="172" font-size="11.5" fill="currentColor" text-anchor="middle">fit 1-NN, score the held-out 10</text>

  <text x="475" y="207" font-size="13.5" font-weight="600" fill="#4c8dd6" text-anchor="middle">reports &#8776;50%</text>

  <!-- shared truth line -->
  <line x1="40" y1="228" x2="600" y2="228" stroke="currentColor" opacity="0.3" stroke-dasharray="3 3"/>
  <text x="320" y="252" font-size="12" fill="currentColor" opacity="0.55" text-anchor="middle">truth: the features are independent of the labels &#8212; no classifier can beat 50%</text>
  <text x="320" y="272" font-size="12" fill="currentColor" text-anchor="middle">the only difference between the panels: <tspan font-weight="600">when the screening happens</tspan></text>
</svg>

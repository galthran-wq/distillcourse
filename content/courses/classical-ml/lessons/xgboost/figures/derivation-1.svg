<svg viewBox="0 0 620 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- frame 1: the second-order expansion names one g and one h per point -->
  <text x="310" y="20" font-size="13" fill="currentColor" text-anchor="middle">1 · expand the loss to second order at each point</text>

  <!-- five instance chips -->
  <g>
    <circle cx="130" cy="66" r="14" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <circle cx="220" cy="66" r="14" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <circle cx="310" cy="66" r="14" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <circle cx="400" cy="66" r="14" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <circle cx="490" cy="66" r="14" fill="none" stroke="currentColor" stroke-width="1.5"/>
  </g>
  <text x="130" y="70" font-size="11" fill="currentColor" text-anchor="middle">1</text>
  <text x="220" y="70" font-size="11" fill="currentColor" text-anchor="middle">2</text>
  <text x="310" y="70" font-size="11" fill="currentColor" text-anchor="middle">3</text>
  <text x="400" y="70" font-size="11" fill="currentColor" text-anchor="middle">4</text>
  <text x="490" y="70" font-size="11" fill="currentColor" text-anchor="middle">5</text>

  <!-- per-point g, h labels -->
  <text x="130" y="98" font-size="12" text-anchor="middle"><tspan fill="#e2903a">g&#8321;</tspan><tspan fill="currentColor">, </tspan><tspan fill="#4c8dd6">h&#8321;</tspan></text>
  <text x="220" y="98" font-size="12" text-anchor="middle"><tspan fill="#e2903a">g&#8322;</tspan><tspan fill="currentColor">, </tspan><tspan fill="#4c8dd6">h&#8322;</tspan></text>
  <text x="310" y="98" font-size="12" text-anchor="middle"><tspan fill="#e2903a">g&#8323;</tspan><tspan fill="currentColor">, </tspan><tspan fill="#4c8dd6">h&#8323;</tspan></text>
  <text x="400" y="98" font-size="12" text-anchor="middle"><tspan fill="#e2903a">g&#8324;</tspan><tspan fill="currentColor">, </tspan><tspan fill="#4c8dd6">h&#8324;</tspan></text>
  <text x="490" y="98" font-size="12" text-anchor="middle"><tspan fill="#e2903a">g&#8325;</tspan><tspan fill="currentColor">, </tspan><tspan fill="#4c8dd6">h&#8325;</tspan></text>

  <!-- one point's expansion, dissected -->
  <text x="310" y="160" font-size="15" fill="currentColor" text-anchor="middle">l(y&#7522;, &#375;&#7522; + f(x&#7522;))  &#8776;  const + <tspan fill="#e2903a">g&#7522;</tspan> f(x&#7522;) + &#189; <tspan fill="#4c8dd6">h&#7522;</tspan> f(x&#7522;)&#178;</text>
  <text x="310" y="186" font-size="11.5" fill="currentColor" opacity="0.55" text-anchor="middle"><tspan fill="#e2903a">slope</tspan> and <tspan fill="#4c8dd6">curvature</tspan> of the loss at the current prediction &#375;&#7522;</text>

  <!-- objective line -->
  <line x1="80" y1="220" x2="540" y2="220" stroke="currentColor" opacity="0.25"/>
  <text x="310" y="256" font-size="14" fill="currentColor" text-anchor="middle">obj &#8776; &#931;&#7522; [ <tspan fill="#e2903a">g&#7522;</tspan> f(x&#7522;) + &#189; <tspan fill="#4c8dd6">h&#7522;</tspan> f(x&#7522;)&#178; ] + &#947;T + &#189;&#955; &#931;&#11388; w&#11388;&#178;</text>
  <text x="310" y="282" font-size="11.5" fill="currentColor" opacity="0.55" text-anchor="middle">the loss knows the new tree f only through one g and one h per point</text>
</svg>

<svg viewBox="0 0 620 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- frame 2: fix a structure, regroup the sum by leaf -->
  <text x="310" y="20" font-size="13" fill="currentColor" text-anchor="middle">2 · fix a tree structure q, regroup the sum by leaf</text>

  <!-- five instance chips (unchanged layout) -->
  <g>
    <circle cx="130" cy="66" r="14" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <circle cx="220" cy="66" r="14" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <circle cx="310" cy="66" r="14" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <circle cx="400" cy="66" r="14" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <circle cx="490" cy="66" r="14" fill="none" stroke="currentColor" stroke-width="1.5"/>
  </g>
  <text x="130" y="70" font-size="11" fill="currentColor" text-anchor="middle">1</text>
  <text x="220" y="70" font-size="11" fill="currentColor" text-anchor="middle">2</text>
  <text x="310" y="70" font-size="11" fill="currentColor" text-anchor="middle">3</text>
  <text x="400" y="70" font-size="11" fill="currentColor" text-anchor="middle">4</text>
  <text x="490" y="70" font-size="11" fill="currentColor" text-anchor="middle">5</text>

  <!-- routing arrows: 1 -> leaf1, 4 -> leaf2, 2,3,5 -> leaf3 -->
  <g stroke="currentColor" stroke-width="1.2" opacity="0.5" fill="none">
    <path d="M 130 82 L 140 138"/>
    <path d="M 400 82 L 310 138"/>
    <path d="M 220 82 L 448 138"/>
    <path d="M 310 82 L 462 138"/>
    <path d="M 490 82 L 486 138"/>
  </g>

  <!-- three leaf boxes with G, H sums -->
  <rect x="90" y="142" width="110" height="58" rx="6" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <rect x="255" y="142" width="110" height="58" rx="6" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <rect x="412" y="142" width="140" height="58" rx="6" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="145" y="162" font-size="11.5" fill="currentColor" text-anchor="middle" opacity="0.55">leaf 1: I&#8321; = {1}</text>
  <text x="310" y="162" font-size="11.5" fill="currentColor" text-anchor="middle" opacity="0.55">leaf 2: I&#8322; = {4}</text>
  <text x="482" y="162" font-size="11.5" fill="currentColor" text-anchor="middle" opacity="0.55">leaf 3: I&#8323; = {2, 3, 5}</text>
  <text x="145" y="186" font-size="12.5" text-anchor="middle"><tspan fill="#e2903a">G&#8321;=g&#8321;</tspan><tspan fill="currentColor">  </tspan><tspan fill="#4c8dd6">H&#8321;=h&#8321;</tspan></text>
  <text x="310" y="186" font-size="12.5" text-anchor="middle"><tspan fill="#e2903a">G&#8322;=g&#8324;</tspan><tspan fill="currentColor">  </tspan><tspan fill="#4c8dd6">H&#8322;=h&#8324;</tspan></text>
  <text x="482" y="186" font-size="12.5" text-anchor="middle"><tspan fill="#e2903a">G&#8323;=g&#8322;+g&#8323;+g&#8325;</tspan><tspan fill="currentColor"> </tspan><tspan fill="#4c8dd6">H&#8323;=&#8230;</tspan></text>

  <!-- objective line, regrouped -->
  <line x1="80" y1="220" x2="540" y2="220" stroke="currentColor" opacity="0.25"/>
  <text x="310" y="256" font-size="14" fill="currentColor" text-anchor="middle">obj = &#931;&#11388; [ <tspan fill="#e2903a">G&#11388;</tspan> w&#11388; + &#189; (<tspan fill="#4c8dd6">H&#11388;</tspan> + &#955;) w&#11388;&#178; ] + &#947;T</text>
  <text x="310" y="282" font-size="11.5" fill="currentColor" opacity="0.55" text-anchor="middle">the &#955; penalty joins each leaf&#8217;s quadratic term; the leaves no longer interact</text>
</svg>

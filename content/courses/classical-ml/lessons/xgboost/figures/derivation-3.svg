<svg viewBox="0 0 620 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- frame 3: each leaf is a one-variable parabola; jump to its vertex -->
  <text x="310" y="20" font-size="13" fill="currentColor" text-anchor="middle">3 · each leaf is one parabola in w&#11388; &#8212; jump to its vertex</text>

  <!-- five instance chips, dimmed -->
  <g opacity="0.35">
    <circle cx="130" cy="66" r="14" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <circle cx="220" cy="66" r="14" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <circle cx="310" cy="66" r="14" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <circle cx="400" cy="66" r="14" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <circle cx="490" cy="66" r="14" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <text x="130" y="70" font-size="11" fill="currentColor" text-anchor="middle">1</text>
    <text x="220" y="70" font-size="11" fill="currentColor" text-anchor="middle">2</text>
    <text x="310" y="70" font-size="11" fill="currentColor" text-anchor="middle">3</text>
    <text x="400" y="70" font-size="11" fill="currentColor" text-anchor="middle">4</text>
    <text x="490" y="70" font-size="11" fill="currentColor" text-anchor="middle">5</text>
  </g>

  <!-- parabola for one leaf -->
  <g>
    <!-- axes -->
    <line x1="150" y1="210" x2="470" y2="210" stroke="currentColor" opacity="0.4"/>
    <line x1="310" y1="98" x2="310" y2="216" stroke="currentColor" opacity="0.4"/>
    <text x="474" y="214" font-size="11.5" fill="currentColor" opacity="0.55">w&#11388;</text>
    <!-- parabola: vertex at (250, 192), opening up -->
    <path d="M 160 108 Q 250 276 340 108" fill="none" stroke="currentColor" stroke-width="1.8"/>
    <!-- vertex marker -->
    <circle cx="250" cy="192" r="4" fill="#e2903a"/>
    <line x1="250" y1="192" x2="250" y2="210" stroke="#e2903a" stroke-dasharray="3 3" opacity="0.7"/>
    <line x1="250" y1="192" x2="310" y2="192" stroke="currentColor" stroke-dasharray="3 3" opacity="0.4"/>
    <text x="250" y="228" font-size="13" fill="#e2903a" text-anchor="middle">w&#11388;* = &#8722;G&#11388; / (H&#11388;+&#955;)</text>
    <text x="326" y="196" font-size="12" fill="currentColor">depth  &#8722;&#189; G&#11388;&#178;/(H&#11388;+&#955;)</text>
    <!-- curve label -->
    <text x="410" y="124" font-size="12.5" fill="currentColor" text-anchor="start"><tspan fill="#e2903a">G&#11388;</tspan> w&#11388; + &#189;(<tspan fill="#4c8dd6">H&#11388;</tspan>+&#955;) w&#11388;&#178;</text>
  </g>

  <!-- summary line -->
  <line x1="80" y1="242" x2="540" y2="242" stroke="currentColor" opacity="0.25"/>
  <text x="310" y="270" font-size="13.5" fill="currentColor" text-anchor="middle">curvature <tspan fill="#4c8dd6">H&#11388;</tspan> plus penalty &#955; set the width; the vertex is the leaf weight</text>
  <text x="310" y="292" font-size="11.5" fill="currentColor" opacity="0.55" text-anchor="middle">bigger &#955; &#8594; stiffer parabola &#8594; smaller |w&#11388;*|: ridge shrinkage inside the tree</text>
</svg>

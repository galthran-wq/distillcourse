<svg viewBox="0 0 620 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- frame 4: substitute every vertex back — the structure score -->
  <text x="310" y="20" font-size="13" fill="currentColor" text-anchor="middle">4 · substitute every vertex back: one number scores the whole shape</text>

  <!-- five instance chips, dimmed -->
  <g opacity="0.35">
    <circle cx="130" cy="66" r="14" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <circle cx="220" cy="66" r="14" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <circle cx="310" cy="66" r="14" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <circle cx="400" cy="66" r="14" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <circle cx="490" cy="66" r="14" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <text x="130" y="70" font-size="11" fill="currentColor" text-anchor="middle">1</text>
    <text x="220" y="70" font-size="11" fill="currentColor" text-anchor="middle">2</text>
    <text x="310" y="70" font-size="11" fill="currentColor" text-anchor="middle">3</text>
    <text x="400" y="70" font-size="11" fill="currentColor" text-anchor="middle">4</text>
    <text x="490" y="70" font-size="11" fill="currentColor" text-anchor="middle">5</text>
  </g>

  <!-- three leaf boxes, each contributing its minimized term -->
  <rect x="90" y="122" width="110" height="58" rx="6" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <rect x="255" y="122" width="110" height="58" rx="6" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <rect x="412" y="122" width="140" height="58" rx="6" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="145" y="142" font-size="11.5" fill="currentColor" text-anchor="middle" opacity="0.55">leaf 1</text>
  <text x="310" y="142" font-size="11.5" fill="currentColor" text-anchor="middle" opacity="0.55">leaf 2</text>
  <text x="482" y="142" font-size="11.5" fill="currentColor" text-anchor="middle" opacity="0.55">leaf 3</text>
  <text x="145" y="166" font-size="12.5" fill="currentColor" text-anchor="middle">&#8722;&#189; <tspan fill="#e2903a">G&#8321;&#178;</tspan>/(<tspan fill="#4c8dd6">H&#8321;</tspan>+&#955;)</text>
  <text x="310" y="166" font-size="12.5" fill="currentColor" text-anchor="middle">&#8722;&#189; <tspan fill="#e2903a">G&#8322;&#178;</tspan>/(<tspan fill="#4c8dd6">H&#8322;</tspan>+&#955;)</text>
  <text x="482" y="166" font-size="12.5" fill="currentColor" text-anchor="middle">&#8722;&#189; <tspan fill="#e2903a">G&#8323;&#178;</tspan>/(<tspan fill="#4c8dd6">H&#8323;</tspan>+&#955;)</text>

  <!-- plus a toll per leaf -->
  <text x="145" y="200" font-size="12" fill="#5aa46a" text-anchor="middle">+ &#947;</text>
  <text x="310" y="200" font-size="12" fill="#5aa46a" text-anchor="middle">+ &#947;</text>
  <text x="482" y="200" font-size="12" fill="#5aa46a" text-anchor="middle">+ &#947;</text>

  <!-- score line -->
  <line x1="80" y1="220" x2="540" y2="220" stroke="currentColor" opacity="0.25"/>
  <text x="310" y="256" font-size="14.5" fill="currentColor" text-anchor="middle">score(q) = &#8722;&#189; &#931;&#11388; <tspan fill="#e2903a">G&#11388;&#178;</tspan>/(<tspan fill="#4c8dd6">H&#11388;</tspan>+&#955;) + <tspan fill="#5aa46a">&#947;T</tspan></text>
  <text x="310" y="282" font-size="11.5" fill="currentColor" opacity="0.55" text-anchor="middle">lower is better &#8212; an impurity for arbitrary losses, with the leaf count taxed at <tspan fill="#5aa46a">&#947;</tspan> each</text>
</svg>

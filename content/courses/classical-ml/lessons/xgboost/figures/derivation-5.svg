<svg viewBox="0 0 620 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- frame 5: the split gain is score-before minus score-after, minus the toll -->
  <text x="310" y="20" font-size="13" fill="currentColor" text-anchor="middle">5 · a split is scored by subtraction: before &#8722; after, minus the toll</text>

  <!-- before: one parent leaf -->
  <text x="160" y="52" font-size="11.5" fill="currentColor" opacity="0.55" text-anchor="middle">before: one leaf</text>
  <rect x="100" y="62" width="120" height="52" rx="6" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="160" y="84" font-size="12.5" text-anchor="middle"><tspan fill="#e2903a">G</tspan><tspan fill="currentColor">, </tspan><tspan fill="#4c8dd6">H</tspan></text>
  <text x="160" y="104" font-size="12" fill="currentColor" text-anchor="middle">&#8722;&#189;<tspan fill="#e2903a">G&#178;</tspan>/(<tspan fill="#4c8dd6">H</tspan>+&#955;)</text>

  <!-- arrow through a gamma toll gate -->
  <line x1="232" y1="88" x2="368" y2="88" stroke="currentColor" stroke-width="1.6"/>
  <path d="M 368 88 l -9 -5 v 10 z" fill="currentColor"/>
  <rect x="282" y="70" width="36" height="36" rx="5" fill="none" stroke="#5aa46a" stroke-width="1.8"/>
  <text x="300" y="93" font-size="14" fill="#5aa46a" text-anchor="middle">&#947;</text>
  <text x="300" y="122" font-size="11" fill="#5aa46a" text-anchor="middle">toll: one extra leaf</text>

  <!-- after: two children -->
  <text x="470" y="52" font-size="11.5" fill="currentColor" opacity="0.55" text-anchor="middle">after: two leaves</text>
  <rect x="386" y="62" width="80" height="52" rx="6" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <rect x="476" y="62" width="80" height="52" rx="6" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="426" y="84" font-size="12.5" text-anchor="middle"><tspan fill="#e2903a">G<tspan font-size="9" dy="3">L</tspan></tspan><tspan fill="currentColor" dy="-3">, </tspan><tspan fill="#4c8dd6">H<tspan font-size="9" dy="3">L</tspan></tspan></text>
  <text x="516" y="84" font-size="12.5" text-anchor="middle"><tspan fill="#e2903a">G<tspan font-size="9" dy="3">R</tspan></tspan><tspan fill="currentColor" dy="-3">, </tspan><tspan fill="#4c8dd6">H<tspan font-size="9" dy="3">R</tspan></tspan></text>
  <text x="426" y="106" font-size="11" fill="currentColor" text-anchor="middle" opacity="0.55">left sums</text>
  <text x="516" y="106" font-size="11" fill="currentColor" text-anchor="middle" opacity="0.55">right sums</text>

  <!-- gain formula -->
  <line x1="80" y1="150" x2="540" y2="150" stroke="currentColor" opacity="0.25"/>
  <text x="310" y="190" font-size="15" fill="currentColor" text-anchor="middle">Gain = &#189; [ <tspan fill="#e2903a">G<tspan font-size="10" dy="3">L</tspan><tspan dy="-3">&#178;</tspan></tspan>/(<tspan fill="#4c8dd6">H<tspan font-size="10" dy="3">L</tspan></tspan><tspan dy="-3">+&#955;) + </tspan><tspan fill="#e2903a">G<tspan font-size="10" dy="3">R</tspan><tspan dy="-3">&#178;</tspan></tspan>/(<tspan fill="#4c8dd6">H<tspan font-size="10" dy="3">R</tspan></tspan><tspan dy="-3">+&#955;) &#8722; </tspan><tspan fill="#e2903a">G&#178;</tspan>/(<tspan fill="#4c8dd6">H</tspan>+&#955;) ] &#8722; <tspan fill="#5aa46a">&#947;</tspan></text>

  <!-- annotations -->
  <text x="310" y="226" font-size="12" fill="currentColor" text-anchor="middle">children&#8217;s scores &#8212; what the two new leaves earn &#8212; against the one leaf they replace</text>
  <text x="310" y="252" font-size="12" fill="currentColor" text-anchor="middle">split taken only if Gain &gt; 0: the improvement must <tspan fill="#5aa46a">pay the toll &#947;</tspan></text>
  <text x="310" y="284" font-size="11.5" fill="currentColor" opacity="0.55" text-anchor="middle">G = G<tspan font-size="8.5" dy="2.5">L</tspan><tspan dy="-2.5"> + G</tspan><tspan font-size="8.5" dy="2.5">R</tspan><tspan dy="-2.5"> and H likewise: one linear scan over sorted feature values scores every candidate</tspan></text>
</svg>

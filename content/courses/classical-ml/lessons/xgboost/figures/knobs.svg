<svg viewBox="0 0 620 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- the gain formula read as three knobs -->
  <text x="310" y="22" font-size="13" fill="currentColor" text-anchor="middle">the same formula, read as three knobs</text>

  <!-- the gain formula, with lambda / gamma / h highlighted -->
  <text x="310" y="66" font-size="16" fill="currentColor" text-anchor="middle">Gain = &#189; [ G<tspan font-size="11" dy="3">L</tspan><tspan dy="-3">&#178;</tspan>/(<tspan fill="#4c8dd6">H<tspan font-size="11" dy="3">L</tspan></tspan><tspan dy="-3">+</tspan><tspan fill="#e2903a">&#955;</tspan>) + G<tspan font-size="11" dy="3">R</tspan><tspan dy="-3">&#178;</tspan>/(<tspan fill="#4c8dd6">H<tspan font-size="11" dy="3">R</tspan></tspan><tspan dy="-3">+</tspan><tspan fill="#e2903a">&#955;</tspan>) &#8722; G&#178;/(<tspan fill="#4c8dd6">H</tspan>+<tspan fill="#e2903a">&#955;</tspan>) ] &#8722; <tspan fill="#5aa46a">&#947;</tspan></text>

  <!-- three columns -->
  <line x1="216" y1="96" x2="216" y2="310" stroke="currentColor" opacity="0.2"/>
  <line x1="412" y1="96" x2="412" y2="310" stroke="currentColor" opacity="0.2"/>

  <!-- lambda column -->
  <text x="118" y="112" font-size="14" fill="#e2903a" text-anchor="middle">&#955;  (every denominator)</text>
  <text x="118" y="134" font-size="11.5" fill="currentColor" text-anchor="middle">shrinks each leaf weight by</text>
  <text x="118" y="152" font-size="12.5" fill="currentColor" text-anchor="middle">H/(H+<tspan fill="#e2903a">&#955;</tspan>) &#8212; ridge in the tree</text>
  <!-- sparkline: w* vs lambda, decaying curve -->
  <g>
    <line x1="48" y1="272" x2="192" y2="272" stroke="currentColor" opacity="0.4"/>
    <line x1="48" y1="188" x2="48" y2="276" stroke="currentColor" opacity="0.4"/>
    <path d="M 48 196 C 90 200 110 240 190 262" fill="none" stroke="#e2903a" stroke-width="2"/>
    <text x="120" y="292" font-size="10.5" fill="currentColor" opacity="0.55" text-anchor="middle">&#955; &#8594;</text>
    <text x="40" y="196" font-size="10.5" fill="currentColor" opacity="0.55" text-anchor="end">|w*|</text>
  </g>
  <text x="118" y="310" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">small-H leaves shrink hardest</text>

  <!-- gamma column -->
  <text x="314" y="112" font-size="14" fill="#5aa46a" text-anchor="middle">&#947;  (subtracted once)</text>
  <text x="314" y="134" font-size="11.5" fill="currentColor" text-anchor="middle">a flat tax per new leaf:</text>
  <text x="314" y="152" font-size="12.5" fill="currentColor" text-anchor="middle">a split must earn its <tspan fill="#5aa46a">&#947;</tspan></text>
  <!-- sparkline: kept splits vs gamma, step-down -->
  <g>
    <line x1="244" y1="272" x2="388" y2="272" stroke="currentColor" opacity="0.4"/>
    <line x1="244" y1="188" x2="244" y2="276" stroke="currentColor" opacity="0.4"/>
    <path d="M 244 196 H 286 V 216 H 322 V 240 H 352 V 260 H 388" fill="none" stroke="#5aa46a" stroke-width="2"/>
    <text x="316" y="292" font-size="10.5" fill="currentColor" opacity="0.55" text-anchor="middle">&#947; &#8594;</text>
    <text x="236" y="196" font-size="10.5" fill="currentColor" opacity="0.55" text-anchor="end">leaves</text>
  </g>
  <text x="314" y="310" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">pruning becomes arithmetic</text>

  <!-- h column -->
  <text x="510" y="112" font-size="14" fill="#4c8dd6" text-anchor="middle">h&#7522;  (inside every sum)</text>
  <text x="510" y="134" font-size="11.5" fill="currentColor" text-anchor="middle">curvature weights each point;</text>
  <text x="510" y="152" font-size="12.5" fill="currentColor" text-anchor="middle">confident points fade out</text>
  <!-- sparkline: h = p(1-p) bump -->
  <g>
    <line x1="440" y1="272" x2="584" y2="272" stroke="currentColor" opacity="0.4"/>
    <line x1="440" y1="188" x2="440" y2="276" stroke="currentColor" opacity="0.4"/>
    <path d="M 442 270 Q 512 130 582 270" fill="none" stroke="#4c8dd6" stroke-width="2"/>
    <text x="512" y="292" font-size="10.5" fill="currentColor" opacity="0.55" text-anchor="middle">p: 0 &#8594; 1</text>
    <text x="432" y="196" font-size="10.5" fill="currentColor" opacity="0.55" text-anchor="end">h</text>
  </g>
  <text x="510" y="310" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">h = p(1&#8722;p) for the deviance</text>
</svg>

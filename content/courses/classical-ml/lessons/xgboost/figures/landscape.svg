<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- four boosting systems x five design axes -->
  <text x="320" y="20" font-size="13" fill="currentColor" text-anchor="middle">four boosters, five design axes</text>

  <!-- column x-centers: 78 (system, left-aligned at 30), 200, 300, 392, 482, 578 -->
  <g font-size="10.5" fill="currentColor" opacity="0.55">
    <text x="200" y="52" text-anchor="middle">objective</text>
    <text x="300" y="52" text-anchor="middle">split search</text>
    <text x="392" y="52" text-anchor="middle">growth</text>
    <text x="482" y="52" text-anchor="middle">missing</text>
    <text x="578" y="52" text-anchor="middle">categoricals</text>
  </g>
  <line x1="26" y1="62" x2="614" y2="62" stroke="currentColor" opacity="0.35"/>

  <!-- row: vanilla GBM -->
  <g font-size="11.5" fill="currentColor">
    <text x="30" y="90">GBM (2001)</text>
    <text x="200" y="90" text-anchor="middle">1st-order</text>
    <text x="300" y="90" text-anchor="middle">exact</text>
    <text x="392" y="90" text-anchor="middle">depth-wise</text>
    <text x="482" y="90" text-anchor="middle">impute first</text>
    <text x="578" y="90" text-anchor="middle">encode first</text>
  </g>
  <line x1="26" y1="102" x2="614" y2="102" stroke="currentColor" opacity="0.15"/>

  <!-- row: XGBoost (highlighted) -->
  <rect x="22" y="110" width="596" height="34" rx="5" fill="#e2903a" opacity="0.12"/>
  <g font-size="11.5" fill="currentColor">
    <text x="30" y="132" fill="#e2903a">XGBoost (2016)</text>
    <text x="200" y="132" text-anchor="middle">2nd-order + &#937;</text>
    <text x="300" y="132" text-anchor="middle">exact / quantile</text>
    <text x="392" y="132" text-anchor="middle">depth-wise</text>
    <text x="482" y="132" text-anchor="middle">learned</text>
    <text x="578" y="132" text-anchor="middle">encode first</text>
  </g>
  <line x1="26" y1="150" x2="614" y2="150" stroke="currentColor" opacity="0.15"/>

  <!-- row: LightGBM -->
  <g font-size="11.5" fill="currentColor">
    <text x="30" y="176">LightGBM (2017)</text>
    <text x="200" y="176" text-anchor="middle">2nd-order</text>
    <text x="300" y="176" text-anchor="middle">histogram</text>
    <text x="392" y="176" text-anchor="middle">leaf-wise</text>
    <text x="482" y="176" text-anchor="middle">learned</text>
    <text x="578" y="176" text-anchor="middle">native bins</text>
  </g>
  <line x1="26" y1="188" x2="614" y2="188" stroke="currentColor" opacity="0.15"/>

  <!-- row: CatBoost -->
  <g font-size="11.5" fill="currentColor">
    <text x="30" y="214">CatBoost (2018)</text>
    <text x="200" y="214" text-anchor="middle">2nd-order</text>
    <text x="300" y="214" text-anchor="middle">histogram</text>
    <text x="392" y="214" text-anchor="middle">symmetric</text>
    <text x="482" y="214" text-anchor="middle">learned</text>
    <text x="578" y="214" text-anchor="middle">ordered target</text>
  </g>

  <text x="320" y="246" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">all four fit the same model class &#8212; additive trees; the rows differ in objective, search, and data handling</text>
</svg>

<svg viewBox="0 0 620 250" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- exact scan vs h-weighted quantile candidates on one sorted feature -->
  <text x="310" y="20" font-size="13" fill="currentColor" text-anchor="middle">candidate splits on one feature, sorted by value</text>

  <!-- shared point positions (x of 14 sorted points), radii proportional to h on the lower strip -->
  <!-- strip 1: exact greedy -->
  <text x="60" y="66" font-size="12" fill="currentColor" text-anchor="end">exact</text>
  <line x1="80" y1="80" x2="580" y2="80" stroke="currentColor" opacity="0.4"/>
  <g fill="currentColor" opacity="0.75">
    <circle cx="96" cy="80" r="3.5"/><circle cx="118" cy="80" r="3.5"/><circle cx="132" cy="80" r="3.5"/>
    <circle cx="170" cy="80" r="3.5"/><circle cx="196" cy="80" r="3.5"/><circle cx="230" cy="80" r="3.5"/>
    <circle cx="286" cy="80" r="3.5"/><circle cx="330" cy="80" r="3.5"/><circle cx="356" cy="80" r="3.5"/>
    <circle cx="420" cy="80" r="3.5"/><circle cx="472" cy="80" r="3.5"/><circle cx="500" cy="80" r="3.5"/>
    <circle cx="544" cy="80" r="3.5"/><circle cx="566" cy="80" r="3.5"/>
  </g>
  <!-- a tick between every adjacent pair -->
  <g stroke="#e2903a" stroke-width="1.5">
    <line x1="107" y1="70" x2="107" y2="90"/><line x1="125" y1="70" x2="125" y2="90"/><line x1="151" y1="70" x2="151" y2="90"/>
    <line x1="183" y1="70" x2="183" y2="90"/><line x1="213" y1="70" x2="213" y2="90"/><line x1="258" y1="70" x2="258" y2="90"/>
    <line x1="308" y1="70" x2="308" y2="90"/><line x1="343" y1="70" x2="343" y2="90"/><line x1="388" y1="70" x2="388" y2="90"/>
    <line x1="446" y1="70" x2="446" y2="90"/><line x1="486" y1="70" x2="486" y2="90"/><line x1="522" y1="70" x2="522" y2="90"/>
    <line x1="555" y1="70" x2="555" y2="90"/>
  </g>
  <text x="330" y="112" font-size="11.5" fill="currentColor" opacity="0.55" text-anchor="middle"><tspan fill="#e2903a">every gap</tspan> between adjacent sorted values is scored &#8212; n&#8722;1 candidates per feature</text>

  <!-- strip 2: h-weighted quantiles -->
  <text x="60" y="156" font-size="12" fill="currentColor" text-anchor="end">quantile</text>
  <line x1="80" y1="170" x2="580" y2="170" stroke="currentColor" opacity="0.4"/>
  <!-- same x positions, radius encodes h -->
  <g fill="#4c8dd6" opacity="0.8">
    <circle cx="96" cy="170" r="6"/><circle cx="118" cy="170" r="2"/><circle cx="132" cy="170" r="5"/>
    <circle cx="170" cy="170" r="2.5"/><circle cx="196" cy="170" r="2"/><circle cx="230" cy="170" r="2"/>
    <circle cx="286" cy="170" r="2.5"/><circle cx="330" cy="170" r="2"/><circle cx="356" cy="170" r="6.5"/>
    <circle cx="420" cy="170" r="6"/><circle cx="472" cy="170" r="2"/><circle cx="500" cy="170" r="5.5"/>
    <circle cx="544" cy="170" r="2"/><circle cx="566" cy="170" r="2"/>
  </g>
  <!-- few candidate marks, evenly spaced in h-mass, hence unevenly in x -->
  <g stroke="#e2903a" stroke-width="2">
    <line x1="112" y1="158" x2="112" y2="182"/>
    <line x1="146" y1="158" x2="146" y2="182"/>
    <line x1="340" y1="158" x2="340" y2="182"/>
    <line x1="390" y1="158" x2="390" y2="182"/>
    <line x1="448" y1="158" x2="448" y2="182"/>
    <line x1="524" y1="158" x2="524" y2="182"/>
  </g>
  <text x="330" y="204" font-size="11.5" fill="currentColor" opacity="0.55" text-anchor="middle">a few dozen <tspan fill="#e2903a">candidates</tspan>, spaced so each bucket holds equal <tspan fill="#4c8dd6">h-mass</tspan> (dot size = h&#7522;)</text>
  <text x="330" y="230" font-size="11.5" fill="currentColor" opacity="0.55" text-anchor="middle">candidates crowd where curvature does &#8212; not where points do</text>
</svg>

<svg viewBox="0 0 620 268" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- the loss for one point as a function of its prediction, with the two local models at the current prediction -->

  <!-- axis -->
  <line x1="60" y1="220" x2="595" y2="220" stroke="currentColor" opacity="0.4"/>
  <text x="590" y="236" font-size="11.5" fill="currentColor" opacity="0.55" text-anchor="end">prediction for this point</text>

  <!-- loss curve -->
  <path d="M94.8,39.9 L102.8,53.2 L110.9,65.5 L118.9,76.9 L127.0,87.6 L135.0,97.4 L143.0,106.5 L151.1,114.9 L159.1,122.7 L167.2,129.9 L175.2,136.6 L183.3,142.7 L191.3,148.3 L199.4,153.5 L207.4,158.2 L215.5,162.5 L223.5,166.4 L231.6,170.0 L239.6,173.3 L247.7,176.2 L255.7,178.8 L263.8,181.2 L271.8,183.3 L279.9,185.2 L287.9,186.8 L296.0,188.3 L304.0,189.5 L312.0,190.6 L320.1,191.4 L328.1,192.2 L336.2,192.7 L344.2,193.1 L352.3,193.4 L360.3,193.6 L368.4,193.6 L376.4,193.5 L384.5,193.4 L392.5,193.1 L400.6,192.7 L408.6,192.3 L416.7,191.8 L424.7,191.2 L432.8,190.5 L440.8,189.7 L448.9,188.9 L456.9,188.1 L465.0,187.2 L473.0,186.2 L481.0,185.2 L489.1,184.2 L497.1,183.1 L505.2,181.9 L513.2,180.8 L521.3,179.5 L529.3,178.3 L537.4,177.0 L545.4,175.7 L553.5,174.4 L561.5,173.1 L569.6,171.7 L577.6,170.3"
        fill="none" stroke="currentColor" stroke-width="2" opacity="0.75"/>
  <text x="106" y="36" font-size="11.5" fill="currentColor" opacity="0.55">loss l(y, ŷ)</text>

  <!-- first-order model: the tangent line -->
  <path d="M113.3,90.8 L283.0,216.7" fill="none" stroke="#4c8dd6" stroke-width="2"/>
  <text transform="rotate(36.5 208 188)" x="208" y="188" font-size="11.5" fill="#4c8dd6" text-anchor="middle">first order: slope g</text>

  <!-- second-order model: the tangent parabola -->
  <path d="M92.3,44.5 L102.9,59.2 L113.5,73.1 L124.1,86.1 L134.7,98.2 L145.3,109.5 L155.9,119.9 L166.5,129.4 L177.1,138.1 L187.7,145.8 L198.3,152.8 L209.0,158.8 L219.6,164.0 L230.2,168.3 L240.8,171.8 L251.4,174.4 L262.0,176.1 L272.6,176.9 L283.2,176.9 L293.8,176.0 L304.4,174.2 L315.0,171.6 L325.6,168.1 L336.2,163.7 L346.8,158.5 L357.4,152.4 L368.1,145.5 L378.7,137.6 L389.3,128.9 L399.9,119.3 L410.5,108.9"
        fill="none" stroke="#e2903a" stroke-width="2"/>
  <text x="398" y="100" font-size="11.5" fill="#e2903a">second order: curvature h</text>

  <!-- current prediction: both models touch the loss here -->
  <line x1="181.4" y1="141.3" x2="181.4" y2="220" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5"/>
  <circle cx="181.4" cy="141.3" r="4" fill="currentColor"/>
  <text x="181" y="236" font-size="11.5" fill="currentColor" text-anchor="middle">ŷ&#8288;⁽ᵗ⁻¹⁾</text>

  <!-- the parabola's vertex: the Newton step -->
  <line x1="277.6" y1="177.0" x2="277.6" y2="220" stroke="#e2903a" stroke-dasharray="3 3" opacity="0.6"/>
  <circle cx="277.6" cy="177.0" r="4" fill="#e2903a"/>
  <text x="283" y="236" font-size="11.5" fill="#e2903a" text-anchor="middle">ŷ&#8288;⁽ᵗ⁻¹⁾ − g/h</text>

  <text x="310" y="260" font-size="11.5" fill="currentColor" opacity="0.55" text-anchor="middle">both models match value and slope at the dot; only the <tspan fill="#e2903a">parabola</tspan> has a minimum of its own, at −g/h</text>
</svg>

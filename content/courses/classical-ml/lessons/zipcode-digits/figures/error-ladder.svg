<svg viewBox="0 0 640 430" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- Panel A: USPS -->
  <text x="8" y="18" font-size="12" fill="currentColor" font-weight="600">USPS test set</text>
  <text x="110" y="18" font-size="11" fill="currentColor" opacity="0.55">7,291 train / 2,007 test digits</text>

  <!-- bars: scale 72 px per % ; baseline x=150 -->
  <text x="144" y="52" font-size="12" fill="currentColor" text-anchor="end">1-NN, Euclidean</text>
  <rect x="150" y="38" width="396" height="20" fill="#e2903a" opacity="0.85" rx="3"/>
  <text x="454" y="52" font-size="12" fill="#fff" font-weight="600" text-anchor="end">5.5%</text>
  <text x="252" y="52" font-size="11" fill="#fff" opacity="0.9">this module</text>

  <text x="144" y="86" font-size="12" fill="currentColor" text-anchor="end">conv net, hand-built</text>
  <rect x="150" y="72" width="353" height="20" fill="currentColor" opacity="0.3" rx="3"/>
  <text x="497" y="86" font-size="12" fill="currentColor" text-anchor="end">4.9%</text>
  <text x="252" y="86" font-size="11" fill="currentColor" opacity="0.7">years of architecture work</text>

  <text x="144" y="120" font-size="12" fill="currentColor" text-anchor="end">1-NN, tangent distance</text>
  <rect x="150" y="106" width="187" height="20" fill="#e2903a" rx="3"/>
  <text x="322" y="120" font-size="12" fill="#fff" font-weight="600" text-anchor="end">2.6%</text>
  <text x="345" y="120" font-size="11" fill="currentColor" opacity="0.7">this module + invariance</text>

  <!-- human reference line at 2.5% -->
  <line x1="330" y1="30" x2="330" y2="142" stroke="#5aa46a" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="336" y="34" font-size="11" fill="#5aa46a">human transcriber ≈ 2.5%</text>

  <!-- axis A -->
  <line x1="150" y1="142" x2="550" y2="142" stroke="currentColor" stroke-width="1" opacity="0.5"/>
  <g font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">
    <text x="150" y="156">0</text>
    <text x="222" y="156">1</text>
    <text x="294" y="156">2</text>
    <text x="366" y="156">3</text>
    <text x="438" y="156">4</text>
    <text x="510" y="156">5</text>
    <text x="580" y="156">% error</text>
  </g>

  <!-- Panel B: MNIST -->
  <text x="8" y="204" font-size="12" fill="currentColor" font-weight="600">MNIST test set</text>
  <text x="122" y="204" font-size="11" fill="currentColor" opacity="0.55">60,000 train / 10,000 test digits — note the finer scale; ±0.1 standard error</text>

  <!-- bars: scale 360 px per % ; baseline x=150 -->
  <text x="144" y="238" font-size="12" fill="currentColor" text-anchor="end">1-NN, tangent distance</text>
  <rect x="150" y="224" width="396" height="20" fill="#e2903a" rx="3"/>
  <text x="454" y="238" font-size="12" fill="#fff" font-weight="600" text-anchor="end">1.1%</text>
  <text x="252" y="238" font-size="11" fill="#fff" opacity="0.9">this module</text>

  <text x="144" y="272" font-size="12" fill="currentColor" text-anchor="end">SVM, degree-9 kernel</text>
  <rect x="150" y="258" width="288" height="20" fill="#4c8dd6" rx="3"/>
  <text x="432" y="272" font-size="12" fill="#fff" font-weight="600" text-anchor="end">0.8%</text>
  <text x="252" y="272" font-size="11" fill="#fff" opacity="0.9">module 4</text>

  <text x="144" y="306" font-size="12" fill="currentColor" text-anchor="end">LeNet-5</text>
  <rect x="150" y="292" width="288" height="20" fill="currentColor" opacity="0.3" rx="3"/>
  <text x="432" y="306" font-size="12" fill="currentColor" text-anchor="end">0.8%</text>
  <text x="252" y="306" font-size="11" fill="currentColor" opacity="0.7">convolutional net</text>

  <text x="144" y="340" font-size="12" fill="currentColor" text-anchor="end">boosted LeNet-4</text>
  <rect x="150" y="326" width="252" height="20" fill="#4c8dd6" rx="3"/>
  <text x="396" y="340" font-size="12" fill="#fff" font-weight="600" text-anchor="end">0.7%</text>
  <text x="252" y="340" font-size="11" fill="#fff" opacity="0.9">module 7</text>

  <!-- axis B -->
  <line x1="150" y1="362" x2="550" y2="362" stroke="currentColor" stroke-width="1" opacity="0.5"/>
  <g font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">
    <text x="150" y="376">0</text>
    <text x="330" y="376">0.5</text>
    <text x="510" y="376">1</text>
    <text x="580" y="376">% error</text>
  </g>

  <text x="8" y="406" font-size="11" fill="currentColor" opacity="0.55">Sources: ESL Table 13.1 (USPS); LeCun et al. 1998 (MNIST).</text>
  <text x="8" y="422" font-size="11" fill="currentColor" opacity="0.55">At ±0.1 standard error, the 0.8% and 0.7% rungs are statistically equivalent.</text>
</svg>

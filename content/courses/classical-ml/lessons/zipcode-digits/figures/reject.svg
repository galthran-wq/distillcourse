<svg viewBox="0 0 640 310" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- ============ left panel: margin histograms ============ -->
  <text x="40" y="18" font-size="12" fill="currentColor" font-weight="600">vote margin separates errors</text>
  <!-- legend -->
  <rect x="40" y="28" width="10" height="10" fill="#4c8dd6"/>
  <text x="54" y="37" font-size="10" fill="currentColor" opacity="0.7">correct (1,894), share of group</text>
  <rect x="40" y="43" width="10" height="10" fill="#e2903a"/>
  <text x="54" y="52" font-size="10" fill="currentColor" opacity="0.7">wrong (113), share of group</text>

  <!-- axes -->
  <line x1="40" y1="250" x2="306" y2="250" stroke="currentColor" stroke-width="1" opacity="0.5"/>
  <!-- bars: 10 bins, bin slot 26px from x=40; blue and amber side by side (11px each) -->
  <!-- correct shares: .003 .006 .011 .015 .016 .022 .039 .043 .078 .768 (x260 px) -->
  <!-- wrong shares:   .150 .088 .115 .088 .097 .115 .080 .106 .062 .097 -->
  <g fill="#4c8dd6">
    <rect x="41" y="249.2" width="11" height="0.8"/>
    <rect x="67" y="248.4" width="11" height="1.6"/>
    <rect x="93" y="247.1" width="11" height="2.9"/>
    <rect x="119" y="246.1" width="11" height="3.9"/>
    <rect x="145" y="245.8" width="11" height="4.2"/>
    <rect x="171" y="244.3" width="11" height="5.7"/>
    <rect x="197" y="239.9" width="11" height="10.1"/>
    <rect x="223" y="238.8" width="11" height="11.2"/>
    <rect x="249" y="229.7" width="11" height="20.3"/>
    <rect x="275" y="50.3" width="11" height="199.7"/>
  </g>
  <g fill="#e2903a">
    <rect x="53" y="211" width="11" height="39"/>
    <rect x="79" y="227.1" width="11" height="22.9"/>
    <rect x="105" y="220.1" width="11" height="29.9"/>
    <rect x="131" y="227.1" width="11" height="22.9"/>
    <rect x="157" y="224.8" width="11" height="25.2"/>
    <rect x="183" y="220.1" width="11" height="29.9"/>
    <rect x="209" y="229.2" width="11" height="20.8"/>
    <rect x="235" y="222.4" width="11" height="27.6"/>
    <rect x="261" y="233.9" width="11" height="16.1"/>
    <rect x="287" y="224.8" width="11" height="25.2"/>
  </g>
  <!-- x ticks -->
  <g font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">
    <text x="53" y="264">0.1</text>
    <text x="118" y="264">0.35</text>
    <text x="183" y="264">0.6</text>
    <text x="248" y="264">0.85</text>
    <text x="299" y="264">1.0</text>
  </g>
  <text x="173" y="284" font-size="11" fill="currentColor" opacity="0.7" text-anchor="middle">vote margin η̂ (share of 20 nearest agreeing)</text>
  <!-- accept threshold -->
  <line x1="281" y1="30" x2="281" y2="250" stroke="currentColor" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.6"/>
  <text x="276" y="86" font-size="10" fill="currentColor" opacity="0.7" text-anchor="end">accept: η̂ ≥ 0.95</text>

  <!-- ============ right panel: error vs reject ============ -->
  <text x="370" y="18" font-size="12" fill="currentColor" font-weight="600">the error–reject trade</text>
  <!-- axes -->
  <line x1="370" y1="250" x2="610" y2="250" stroke="currentColor" stroke-width="1" opacity="0.5"/>
  <line x1="370" y1="250" x2="370" y2="30" stroke="currentColor" stroke-width="1" opacity="0.5"/>
  <g font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">
    <text x="370" y="264">0</text>
    <text x="430" y="264">10</text>
    <text x="490" y="264">20</text>
    <text x="550" y="264">30</text>
    <text x="610" y="264">40</text>
  </g>
  <g font-size="10" fill="currentColor" opacity="0.55" text-anchor="end">
    <text x="364" y="253">0</text>
    <text x="364" y="180">2</text>
    <text x="364" y="106">4</text>
    <text x="364" y="33">6</text>
  </g>
  <text x="490" y="284" font-size="11" fill="currentColor" opacity="0.7" text-anchor="middle">% of digits rejected to hand sorting</text>
  <text x="352" y="140" font-size="11" fill="currentColor" opacity="0.7" text-anchor="middle" transform="rotate(-90 352 140)">% error on accepted</text>

  <!-- human line at 2.5% -->
  <line x1="370" y1="158.3" x2="610" y2="158.3" stroke="#5aa46a" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="608" y="152" font-size="10" fill="#5aa46a" text-anchor="end">human 2.5% (no reject)</text>

  <!-- curve -->
  <polyline points="370,43.4 386.8,99.5 411.4,134.0 425.2,163.4 445,177.0 457.6,185.8 469.6,199.7 485.8,209.3 501.4,217.3 532,222.5 586.6,235.7"
    fill="none" stroke="#e2903a" stroke-width="2"/>
  <circle cx="370" cy="43.4" r="4" fill="#e2903a"/>
  <text x="378" y="42" font-size="10" fill="currentColor" opacity="0.7">no reject: 5.6%</text>
  <circle cx="532" cy="222.5" r="4.5" fill="#e2903a"/>
  <text x="525" y="242" font-size="10" fill="#e2903a" text-anchor="end">η̂ ≥ 0.95: reject 27%, err 0.75%</text>
</svg>

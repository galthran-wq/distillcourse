<svg viewBox="0 0 620 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- top strip: three rotated copies of one digit -->
  <rect x="170" y="16" width="80" height="80" rx="6" fill="none" stroke="currentColor" opacity="0.4"/>
  <rect x="260" y="16" width="80" height="80" rx="6" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <rect x="350" y="16" width="80" height="80" rx="6" fill="none" stroke="currentColor" opacity="0.4"/>
  <text x="210" y="75" font-size="54" fill="currentColor" text-anchor="middle" transform="rotate(-15 210 56)">3</text>
  <text x="300" y="75" font-size="54" fill="currentColor" text-anchor="middle">3</text>
  <text x="390" y="75" font-size="54" fill="currentColor" text-anchor="middle" transform="rotate(15 390 56)">3</text>
  <text x="210" y="112" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">−15°</text>
  <text x="300" y="112" font-size="11" fill="#e2903a" text-anchor="middle">0° (stored image x)</text>
  <text x="390" y="112" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">+15°</text>

  <!-- pixel-space plane -->
  <rect x="60" y="132" width="500" height="168" rx="6" fill="none" stroke="currentColor" opacity="0.35"/>
  <text x="548" y="292" font-size="11" fill="currentColor" opacity="0.55" text-anchor="end">pixel space ℝ²⁵⁶ (schematic)</text>

  <text x="310" y="210" font-size="12" fill="currentColor" opacity="0.7" text-anchor="middle">to the eye: one digit, three times</text>
  <text x="310" y="228" font-size="12" fill="currentColor" opacity="0.7" text-anchor="middle">to the Euclidean metric: three points, far apart</text>
</svg>

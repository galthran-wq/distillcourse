<svg viewBox="0 0 620 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- top strip: three rotated copies of one digit -->
  <rect x="170" y="16" width="80" height="80" rx="6" fill="none" stroke="currentColor" opacity="0.4"/>
  <rect x="260" y="16" width="80" height="80" rx="6" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <rect x="350" y="16" width="80" height="80" rx="6" fill="none" stroke="currentColor" opacity="0.4"/>
  <text x="210" y="75" font-size="54" fill="currentColor" text-anchor="middle" transform="rotate(-15 210 56)">3</text>
  <text x="300" y="75" font-size="54" fill="currentColor" text-anchor="middle">3</text>
  <text x="390" y="75" font-size="54" fill="currentColor" text-anchor="middle" transform="rotate(15 390 56)">3</text>
  <text x="210" y="112" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">−15°</text>
  <text x="300" y="112" font-size="11" fill="#e2903a" text-anchor="middle">0° (stored image x)</text>
  <text x="390" y="112" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">+15°</text>

  <!-- pixel-space plane -->
  <rect x="60" y="132" width="500" height="168" rx="6" fill="none" stroke="currentColor" opacity="0.35"/>
  <text x="548" y="292" font-size="11" fill="currentColor" opacity="0.55" text-anchor="end">pixel space ℝ²⁵⁶ (schematic)</text>

  <!-- rotation orbit of x -->
  <path d="M 130 260 Q 300 170 470 250" fill="none" stroke="#5aa46a" stroke-width="2"/>
  <circle cx="198" cy="231" r="4" fill="currentColor"/>
  <circle cx="300" cy="212" r="4.5" fill="#e2903a"/>
  <circle cx="402" cy="225" r="4" fill="currentColor"/>
  <text x="190" y="248" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">−15°</text>
  <text x="300" y="200" font-size="11" fill="#e2903a" text-anchor="middle">x</text>
  <text x="410" y="242" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">+15°</text>
  <text x="128" y="282" font-size="11" fill="#5aa46a">orbit of the '3' under rotation</text>

  <!-- tangent line at x -->
  <line x1="170" y1="215.8" x2="430" y2="208.2" stroke="#e2903a" stroke-width="1.8"/>
  <line x1="235" y1="209" x2="235" y2="219" stroke="#e2903a" stroke-width="1.2"/>
  <line x1="365" y1="205.2" x2="365" y2="215.2" stroke="#e2903a" stroke-width="1.2"/>
  <text x="235" y="201" font-size="10" fill="#e2903a" text-anchor="middle">α = −0.1</text>
  <text x="365" y="198" font-size="10" fill="#e2903a" text-anchor="middle">α = +0.1</text>
  <text x="436" y="203" font-size="11" fill="#e2903a">tangent line x + αT</text>

  <!-- second image x' with its orbit and tangent line -->
  <path d="M 310 288 Q 420 238 545 280" fill="none" stroke="#4c8dd6" stroke-width="2" opacity="0.6"/>
  <circle cx="424" cy="261" r="4.5" fill="#4c8dd6"/>
  <text x="436" y="277" font-size="11" fill="#4c8dd6">x′</text>
  <line x1="334" y1="264.1" x2="514" y2="257.9" stroke="#4c8dd6" stroke-width="1.8"/>
  <text x="552" y="247" font-size="11" fill="#4c8dd6" text-anchor="end">x′ + α′T′</text>

  <!-- Euclidean distance between the points -->
  <line x1="300" y1="212" x2="424" y2="261" stroke="currentColor" stroke-width="1.2" stroke-dasharray="1.5 3" opacity="0.6"/>

  <!-- tangent distance: shortest segment between the two lines -->
  <line x1="350" y1="210.5" x2="350" y2="263.5" stroke="#e2903a" stroke-width="1.6" stroke-dasharray="4 3"/>

  <!-- legend -->
  <line x1="75" y1="150" x2="105" y2="150" stroke="#e2903a" stroke-width="1.6" stroke-dasharray="4 3"/>
  <text x="110" y="154" font-size="10" fill="#e2903a">tangent distance: shortest line to line</text>
  <line x1="75" y1="170" x2="105" y2="170" stroke="currentColor" stroke-width="1.2" stroke-dasharray="1.5 3" opacity="0.6"/>
  <text x="110" y="174" font-size="10" fill="currentColor" opacity="0.7">Euclidean: point to point, charges the rotation</text>
</svg>

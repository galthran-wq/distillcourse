# Canon for classical-ml. Access notes record what the reading swarm could
# actually read; three sources (flagged NOT FULLY READ) need the human to
# obtain publisher copies so their reading can be re-run.
sources:
  - title: "The Elements of Statistical Learning, 2nd ed."
    authors: "T. Hastie, R. Tibshirani, J. Friedman"
    year: 2009
    url: "https://hastie.su.domains/ElemStatLearn/"
    access: "full — official free PDF (corrected 12th printing) read cover to cover; local copy in research/texts/"
    role: "Backbone of modules 1, 3, 5–8: bias–variance, shrinkage, splines, model assessment, trees, boosting, random forests, unsupervised chapters; the running datasets (prostate, spam, ZIP digits, NCI microarray)"
  - title: "An Introduction to Statistical Learning with Applications in Python (ISLP)"
    authors: "G. James, D. Witten, T. Hastie, R. Tibshirani, J. Taylor"
    year: 2023
    url: "https://www.statlearning.com/"
    access: "full — official free PDF read cover to cover; local copy in research/texts/"
    role: "Gentler parallel track and the LAB CANON: its per-chapter Python labs and applied exercises ground the course's lab designs (CV/bootstrap, regularized regression, trees/ensembles, unsupervised)"
  - title: "Pattern Recognition and Machine Learning"
    authors: "C. M. Bishop"
    year: 2006
    url: "https://www.microsoft.com/en-us/research/wp-content/uploads/2006/01/Bishop-Pattern-Recognition-and-Machine-Learning-2006.pdf"
    access: "full — official free PDF read cover to cover; local copy in research/texts/"
    role: "Derivation-first source for modules 2, 8, 10: MLE/MAP, exponential family, EM/ELBO, Bayesian linear regression, sequential updating figures, k-means/GMM worked examples (Old Faithful)"
  - title: "Probabilistic Machine Learning: An Introduction"
    authors: "K. P. Murphy"
    year: 2022
    url: "https://probml.github.io/pml-book/book1.html"
    access: "full — CC-BY-NC-ND PDF read cover to cover; local copy in research/texts/"
    role: "Modern unifying reference across all modules: GLM insurance-claims application, ridge/lasso paths, kernels/GPs/SVMs, trees and XGBoost derivation, PCA/clustering, curse-of-dimensionality arithmetic"
  - title: "Understanding Machine Learning: From Theory to Algorithms"
    authors: "S. Shalev-Shwartz, S. Ben-David"
    year: 2014
    url: "https://www.cs.huji.ac.il/~shais/UnderstandingMachineLearning/"
    access: "full — official free personal-use PDF read cover to cover; local copy in research/texts/"
    role: "Primary theory text for module 9: PAC learning, No Free Lunch, VC/Sauer with full proofs, SRM/MDL, stability via RLM, boosting theory; also the papaya/memorizer opener of module 1"
  - title: "Foundations of Machine Learning, 2nd ed."
    authors: "M. Mohri, A. Rostamizadeh, A. Talwalkar"
    year: 2018
    url: "https://cs.nyu.edu/~mohri/mlbook/"
    access: "full — CC-BY-NC-ND PDF read cover to cover; local copy in research/texts/"
    role: "Second theory pillar (module 9): Rademacher complexity machinery, Talagrand contraction, dimension-free SVM margin bounds, kernel Tr[K] bounds, boosting L1-margin theory, stability corollaries"
  - title: "Statistical Inference, 2nd ed."
    authors: "G. Casella, R. L. Berger"
    year: 2002
    url: "https://archive.org/details/statisticalinfer0000case"
    access: "full — scanned PDF read via page images + OCR; PDF page = printed page + 26; local copy in research/texts/"
    role: "Mathematical-statistics rigor for module 2: score/Fisher information, Cramér–Rao with attainment and regularity counterexamples, MLE asymptotics, superefficiency; Challenger O-ring logistic case"
  - title: "Gaussian Processes for Machine Learning"
    authors: "C. E. Rasmussen, C. K. I. Williams"
    year: 2006
    url: "http://gaussianprocess.org/gpml/"
    access: "full — official free PDF read cover to cover; local copy in research/texts/"
    role: "Module 10 core: GP regression equations, Algorithm 2.1, covariance-function catalogue, marginal-likelihood model selection, the Mauna Loa CO₂ application; grounds the GP lab"
  - title: "CS229 Lecture Notes"
    authors: "A. Ng, T. Ma"
    year: 2023
    url: "https://cs229.stanford.edu/main_notes.pdf"
    access: "full — read cover to cover; local copy in research/texts/"
    role: "Compact derivations cross-checking modules 2, 4, 8 (GLM construction, GDA vs logistic, kernels/SMO, EM/ELBO, PCA); its problem sets are lab-canon precedent for implementing logistic regression, k-means, EM"
  - title: "A Gentle Introduction to Conformal Prediction and Distribution-Free Uncertainty Quantification"
    authors: "A. N. Angelopoulos, S. Bates"
    year: 2023
    url: "https://arxiv.org/abs/2107.07511"
    access: "full — arXiv v6 read in full incl. appendices"
    role: "Module 10: the split-conformal recipe and coverage proof, score-function catalogue, conditional-coverage caveats, calibration-set sizing; its runnable notebooks ground the conformal half of the GP lab"
  - title: "Random Forests"
    authors: "L. Breiman"
    year: 2001
    url: "https://www.stat.berkeley.edu/~breiman/randomforest2001.pdf"
    access: "full — author-hosted PDF read in full"
    role: "Module 7 primary source: strength/correlation bound, convergence (no overfitting from more trees), OOB estimates, permutation importance, Forest-RI"
  - title: "A Decision-Theoretic Generalization of On-Line Learning and an Application to Boosting"
    authors: "Y. Freund, R. E. Schapire"
    year: 1997
    url: "https://cseweb.ucsd.edu/~yfreund/papers/adaboost.pdf"
    access: "full — author-hosted PDF read via OCR (Type-3 fonts); formulas checked against page images"
    role: "Module 7: the original AdaBoost pseudocode, the exponential training-error bound, the optimal-β derivation; historical artifact images"
  - title: "Boosting the Margin: A New Explanation for the Effectiveness of Voting Methods"
    authors: "R. E. Schapire, Y. Freund, P. Bartlett, W. S. Lee"
    year: 1998
    url: "https://cseweb.ucsd.edu/~yfreund/papers/BoostingtheMargin.pdf"
    access: "full — author-hosted PDF read in full"
    role: "Module 9's second debt: margin distributions, ensemble margin bounds independent of T, the delta-function counterexample; the experiment module 9's application lesson reproduces"
  - title: "Greedy Function Approximation: A Gradient Boosting Machine"
    authors: "J. H. Friedman"
    year: 2001
    url: "https://web.archive.org/web/20151007015327/http://statweb.stanford.edu/~jhf/ftp/trebst.pdf"
    access: "full — author preprint via Wayback, read via OCR"
    role: "Module 7: function-space gradient descent, per-leaf line search, shrinkage evidence (Fig. 1), tree-size/interaction argument, partial dependence, garnet case study"
  - title: "XGBoost: A Scalable Tree Boosting System"
    authors: "T. Chen, C. Guestrin"
    year: 2016
    url: "https://arxiv.org/abs/1603.02754"
    access: "full — arXiv PDF read in full"
    role: "Module 7: second-order objective, leaf-weight and split-gain derivations, sparsity-aware splits, weighted quantile sketch, systems benchmarks"
  - title: "A Unified Approach to Interpreting Model Predictions (SHAP)"
    authors: "S. Lundberg, S.-I. Lee"
    year: 2017
    url: "https://arxiv.org/abs/1705.07874"
    access: "full — arXiv PDF read (supplementary proofs not included in the arXiv rendering)"
    role: "Module 7 extra lesson: additive attribution class, the three axioms + uniqueness, Kernel SHAP, the sickness-score and max-game worked examples"
  - title: "Maximum Likelihood from Incomplete Data via the EM Algorithm"
    authors: "A. P. Dempster, N. M. Laird, D. B. Rubin"
    year: 1977
    url: "https://web.mit.edu/6.435/www/Dempster77.pdf"
    access: "full — JSTOR scan read in full incl. published discussion"
    role: "Module 8: the original EM formulation, GEM monotonicity theorem, the 197-animal genetics worked example and its convergence-rate table; historical artifact images"
  - title: "Robust Locally Weighted Regression and Smoothing Scatterplots"
    authors: "W. S. Cleveland"
    year: 1979
    url: "https://sites.stat.washington.edu/courses/stat527/s13/readings/Cleveland_JASA_1979.pdf"
    access: "full — openly hosted JSTOR scan read in full"
    role: "Module 6: LOESS defined, robustness iteration, span selection, the abrasion-outlier and lead/ZPP set pieces"
  - title: "A Tutorial on Spectral Clustering"
    authors: "U. von Luxburg"
    year: 2007
    url: "https://arxiv.org/abs/0711.0189"
    access: "full — arXiv PDF read in full"
    role: "Module 8: Laplacian properties with proofs, RatioCut/Ncut relaxations, graph-construction practice, eigengap heuristic, the L_rw recommendation"
  - title: "Visualizing Data using t-SNE"
    authors: "L. van der Maaten, G. Hinton"
    year: 2008
    url: "https://www.jmlr.org/papers/volume9/vandermaaten08a/vandermaaten08a.pdf"
    access: "full — JMLR open-access PDF read in full"
    role: "Module 8: SNE→t-SNE derivation, crowding problem, optimization tricks, the MNIST/COIL-20 showcases"
  - title: "UMAP: Uniform Manifold Approximation and Projection for Dimension Reduction"
    authors: "L. McInnes, J. Healy, J. Melville"
    year: 2018
    url: "https://arxiv.org/abs/1802.03426"
    access: "full — arXiv v3 read in full"
    role: "Module 8: the computational (graph-construction + layout) view, hyperparameter behavior, t-SNE relationship (Appendix C), honest weaknesses (§6)"
  - title: "How to Use t-SNE Effectively"
    authors: "M. Wattenberg, F. Viégas, I. Johnson"
    year: 2016
    url: "https://distill.pub/2016/misread-tsne/"
    access: "full — article text + companion repo's precomputed figure frames (CC-BY 2.0)"
    role: "Module 8: the misreading catalogue — hyperparameter sensitivity, cluster sizes/distances mean nothing, clusters from pure noise"
  - title: "Reconciling Modern Machine-Learning Practice and the Classical Bias–Variance Trade-off"
    authors: "M. Belkin, D. Hsu, S. Ma, S. Mandal"
    year: 2019
    url: "https://arxiv.org/abs/1812.11118"
    access: "full — arXiv v2 read in full"
    role: "Module 11: the double-descent curve, RFF-on-MNIST evidence, min-norm inductive-bias mechanism, the 1D ReLU norm example"
  - title: "Surprises in High-Dimensional Ridgeless Least Squares Interpolation"
    authors: "T. Hastie, A. Montanari, S. Rosset, R. Tibshirani"
    year: 2022
    url: "https://hastie.su.domains/Papers/21-AOS2133.pdf"
    access: "full — main text read in full (proofs live in a separate supplement, not fetched)"
    role: "Module 11: exact ridgeless risk asymptotics, GD = min-norm (Prop. 1), benign-overfitting corollary, optimal-ridge-can-be-zero results"
  - title: "Random Features for Large-Scale Kernel Machines"
    authors: "A. Rahimi, B. Recht"
    year: 2007
    url: "https://proceedings.neurips.cc/paper/2007/file/013a006f03dbc5392effeb8f18fda755-Paper.pdf"
    access: "full — NeurIPS proceedings PDF read in full incl. appendix proofs"
    role: "Module 11: Bochner's theorem, the RFF construction and uniform guarantee, kernel↔random-network bridge, benchmark numbers"
  - title: "Why Do Tree-Based Models Still Outperform Deep Learning on Tabular Data?"
    authors: "L. Grinsztajn, E. Oyallon, G. Varoquaux"
    year: 2022
    url: "https://arxiv.org/abs/2207.08815"
    access: "full — arXiv PDF read in full incl. appendices"
    role: "Module 11 closer: the 45-dataset benchmark, the three inductive-bias findings (irregular targets, uninformative features, rotation non-invariance)"
  - title: "A Visual Introduction to Machine Learning, Part 1"
    authors: "S. Yee, T. Chu (R2D3)"
    year: 2015
    url: "https://r2d3.us/visual-intro-to-machine-learning-part-1/"
    access: "full — page text extracted; figures are the site's own precomputed renders"
    role: "Module 6 pedagogy reference: the SF/NY tree build, the ball-drop visualization idea, the plain-language overfitting framing"

  # ── NOT FULLY READ — human to obtain from publishers, then re-run reading ──
  - title: "Generalized Additive Models"
    authors: "T. Hastie, R. Tibshirani"
    year: 1990
    url: "https://www.taylorfrancis.com/books/mono/10.1201/9780203753781/generalized-additive-models-hastie"
    access: "NOT FULLY READ — toc-only. Publisher (Taylor & Francis) paywalled; Internet Archive scan is print-disabled-restricted. Supplemented by the freely available 1986 Statistical Science paper (read in full, research/texts/generalizeda-1986paper.pdf) and the CRAN gam package docs. HUMAN: obtain the monograph (ISBN 0-412-34390-8) to re-run the reading."
    role: "Module 3 splines-gams lesson: backfitting, local scoring, the kyphosis case study — currently grounded in the 1986 paper + ESL ch. 9 instead"
  - title: "Support-Vector Networks"
    authors: "C. Cortes, V. Vapnik"
    year: 1995
    url: "https://doi.org/10.1007/BF00994018"
    access: "NOT FULLY READ — not found open. Springer abstract-only; every open mirror tried 403/404'd. Module 4's SVM lessons are grounded in ESL ch. 12, Bishop ch. 7, Mohri ch. 5–6, SSBD ch. 15 instead. HUMAN: obtain via Springer (Machine Learning 20, 273–297) to add the original's soft-margin framing and historical material."
    role: "Intended primary source for the soft-margin SVM's original statement (module 4)"
  - title: "An Introduction to the Bootstrap"
    authors: "B. Efron, R. Tibshirani"
    year: 1993
    url: "https://archive.org/details/introductiontobo0000efro"
    access: "NOT FULLY READ — not found open. Archive.org item is access-restricted (print-disabled lending only), no legitimate open copy located. Module 5's bootstrap material is grounded in ESL ch. 7–8 and ISLP ch. 5 instead. HUMAN: obtain the Chapman & Hall/CRC book to deepen the bootstrap lesson (jackknife, BCa intervals)."
    role: "Intended primary source for bootstrap theory (module 5)"

concepts:
  - id: discrete-sequence
    name: Discrete-time sequence
    definition: A value indexed by an integer sample number, with physical meaning supplied by units and a sample period.
    introduced_in: sampled-sequences
  - id: sampling-period
    name: Sampling period
    definition: The physical time $T_s$ between successive samples, with sample rate $f_s=1/T_s$.
    introduced_in: sampled-sequences
  - id: lti-system
    name: Linear time-invariant system
    definition: A system obeying superposition and commuting with integer shifts.
    introduced_in: impulse-response-and-convolution
  - id: impulse-response
    name: Impulse response
    definition: The output $h[n]$ of an LTI system to the unit impulse, sufficient to determine every response.
    introduced_in: impulse-response-and-convolution
  - id: linear-convolution
    name: Linear convolution
    definition: The sum $y[n]=\sum_m x[m]h[n-m]$ that gives the output of an LTI system.
    introduced_in: impulse-response-and-convolution
  - id: difference-equation
    name: Difference equation
    definition: A recurrence relating present output to current and past input and output samples.
    introduced_in: difference-equations-and-stability
  - id: bibo-stability
    name: BIBO stability
    definition: The property that every bounded input produces a bounded output; for discrete-time LTI systems this is equivalent to absolute summability of $h[n]$.
    introduced_in: difference-equations-and-stability
  - id: system-identification
    name: System identification
    definition: Estimation and validation of a dynamical model from ordered input-output records under a declared preprocessing, model-selection, and evaluation protocol.
    introduced_in: perching-glider-system-identification
  - id: complex-exponential
    name: Complex exponential
    definition: The rotating mode $e^{j\omega n}$ whose real and imaginary projections are discrete sinusoids; frequency is modulo $2\pi$, and a nonzero complex value's principal phase is displayed in $(-\pi,\pi]$ with $-\pi$ mapped to $+\pi$.
    introduced_in: complex-sinusoids-and-phasors
  - id: dtft
    name: Discrete-time Fourier transform
    definition: The $2\pi$-periodic representation $X(e^{j\omega})=\sum_n x[n]e^{-j\omega n}$; it is an ordinary continuous function for finite or absolutely summable sequences, while broader signal classes may require mean-square or generalized interpretations.
    introduced_in: dtft-and-frequency-response
  - id: frequency-response
    name: Frequency response
    definition: For a stable LTI system with $h\in\ell^1$, the complex gain $H(e^{j\omega})=\sum_m h[m]e^{-j\omega m}$ applied exactly to an eternal complex exponential and to a sinusoid after startup transients have settled.
    introduced_in: dtft-and-frequency-response
  - id: sampling
    name: Sampling
    definition: The mapping of a continuous-time signal to values spaced by $T_s$, represented ideally by multiplication with an impulse train.
    introduced_in: sampling-aliasing-and-reconstruction
  - id: aliasing
    name: Aliasing
    definition: Indistinguishability caused when shifted spectral replicas overlap or distinct frequencies yield the same discrete samples.
    introduced_in: sampling-aliasing-and-reconstruction
  - id: dft
    name: Discrete Fourier transform
    definition: The $N$ orthogonal complex frequency coefficients of an $N$-sample record under an explicit normalization.
    introduced_in: dft-bins-symmetry-and-scaling
  - id: circular-convolution
    name: Circular convolution
    definition: Convolution modulo $N$, corresponding to pointwise multiplication of $N$-point DFT coefficients.
    introduced_in: dft-bins-symmetry-and-scaling
  - id: fft
    name: Fast Fourier transform
    definition: A factorized algorithm for evaluating a DFT in order $N\log N$ work for suitable lengths.
    introduced_in: fft-factorization-and-layout
  - id: analysis-window
    name: Analysis window
    definition: A finite weighting $w[n]$ applied to a record or frame before spectral analysis.
    introduced_in: windows-leakage-and-resolution
  - id: spectral-leakage
    name: Spectral leakage
    definition: Spreading caused when finite observation convolves a signal spectrum with the window transform.
    introduced_in: windows-leakage-and-resolution
  - id: spectral-resolution
    name: Spectral resolution
    definition: The ability of a finite observation and window to support distinct frequency claims, not merely the spacing of plotted FFT samples.
    introduced_in: peak-estimation-and-zero-padding
  - id: random-process
    name: Random process
    definition: A probabilistic model for an indexed family of random variables, distinct from one observed realization.
    introduced_in: correlation-psd-and-welch
  - id: autocorrelation
    name: Autocorrelation
    definition: Expected similarity between a wide-sense stationary process and a lagged copy.
    introduced_in: correlation-psd-and-welch
  - id: power-spectral-density
    name: Power spectral density
    definition: Average power per unit frequency, Fourier-dual to autocorrelation under stationarity conditions.
    introduced_in: correlation-psd-and-welch
  - id: welch-estimator
    name: Welch estimator
    definition: A PSD estimator that averages overlapping windowed periodograms to trade resolution for lower variance.
    introduced_in: correlation-psd-and-welch
  - id: stft
    name: Short-time Fourier transform
    definition: A time-indexed sequence of windowed spectra whose frame and overlap conventions govern localization and reconstruction.
    introduced_in: stft-spectrograms-and-reconstruction
  - id: parametric-spectrum
    name: Parametric spectrum
    definition: A spectrum inferred from a finite-dimensional generative model such as AR or a sinusoidal subspace model.
    introduced_in: parametric-spectral-estimation
  - id: z-transform
    name: z-transform
    definition: The complex-variable transform $X(z)=\sum_n x[n]z^{-n}$ together with its region of convergence.
    introduced_in: z-transform-poles-zeros-and-roc
  - id: pole-zero-model
    name: Pole-zero model
    definition: A rational transfer-function representation whose roots connect frequency response, transients, causality, and stability.
    introduced_in: z-transform-poles-zeros-and-roc
  - id: fir-filter
    name: FIR filter
    definition: An LTI filter with a finite impulse response and a feedforward realization.
    introduced_in: fir-filter-design-and-verification
  - id: linear-phase
    name: Linear phase
    definition: Phase proportional to frequency over a band, giving constant delay there; exact for symmetric or antisymmetric FIR coefficients.
    introduced_in: fir-filter-design-and-verification
  - id: iir-filter
    name: IIR filter
    definition: A recursive filter whose impulse response can persist indefinitely.
    introduced_in: iir-filter-design-and-bilinear-mapping
  - id: block-convolution
    name: FFT block convolution
    definition: Linear convolution computed in finite FFT blocks with explicit padding and overlap bookkeeping.
    introduced_in: fast-convolution-and-streaming-blocks
  - id: finite-wordlength
    name: Finite-wordlength realization
    definition: A structure implemented with quantized coefficients and states, finite accumulator range, and specified rounding or saturation.
    introduced_in: finite-word-realizations
  - id: quantization
    name: Quantization
    definition: Mapping a value to a finite representation and bounding or modeling the resulting error.
    introduced_in: finite-word-realizations
  - id: minimum-phase
    name: Minimum-phase factor
    definition: A causal stable factor whose zeros lie inside the unit circle and whose inverse is also causal and stable.
    introduced_in: minimum-phase-and-allpass-structures
  - id: multirate-system
    name: Multirate system
    definition: A signal-processing system containing decimation, interpolation, or rational sample-rate conversion.
    introduced_in: decimation-interpolation-and-antialiasing
  - id: polyphase-decomposition
    name: Polyphase decomposition
    definition: A partition of filter coefficients by residue class that exposes low-rate computation around rate changers.
    introduced_in: polyphase-rational-conversion
  - id: perfect-reconstruction
    name: Perfect reconstruction
    definition: Analysis/synthesis behavior that cancels aliasing and recovers the input up to allowed gain and delay.
    introduced_in: perfect-reconstruction-filter-banks
  - id: wavelet-filter-bank
    name: Wavelet filter bank
    definition: A recursively decimated analysis bank that produces nonuniform, often dyadic, time-frequency resolution.
    introduced_in: wavelet-and-paraunitary-banks
  - id: analytic-signal
    name: Analytic signal
    definition: A complex signal with no negative-frequency content whose real part is the original real signal.
    introduced_in: analytic-signals-and-quadrature
  - id: quadrature-processing
    name: Quadrature processing
    definition: Joint in-phase and quadrature processing that represents and translates a complex baseband signal.
    introduced_in: analytic-signals-and-quadrature
  - id: dither
    name: Dither
    definition: Random signal added before quantization to decorrelate error from the input at the cost of additional noise.
    introduced_in: finite-word-realizations
  - id: subband-analysis
    name: Subband analysis
    definition: A signal representation partitioned into frequency channels whose coefficients can be inspected, processed, quantized, and recombined without requiring a critically sampled perfect-reconstruction construction.
    introduced_in: stft-spectrograms-and-reconstruction
  - id: adaptive-filter
    name: Adaptive filter
    definition: A filter whose coefficients are updated by a data-driven recurrence to minimize a declared error criterion.
    introduced_in: adaptive-filters-and-lms
  - id: lms-algorithm
    name: LMS algorithm
    definition: Steepest descent on mean-square error with the gradient replaced by its one-sample instantaneous estimate, $\mathbf{w}[n+1]=\mathbf{w}[n]+\mu e[n]\mathbf{x}[n]$.
    introduced_in: adaptive-filters-and-lms

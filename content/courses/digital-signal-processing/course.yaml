schema_version: 1
slug: digital-signal-processing
title: Digital Signal Processing
tagline: Signals, spectra, filters, and multirate systems under real implementation constraints
status: planned
audience: Busy engineers and technically mature programmers with algebra, trigonometry, complex arithmetic, calculus, elementary probability, and basic Python/NumPy fluency; no prior DSP course is assumed.
tone: Dry, precise engineering register. Concrete computations precede formalism when they expose the need; derivations, boundary cases, measured artifacts, and implementation checks carry the argument.
intro: "The governing question is how a finite stream of samples can support a trustworthy claim about a physical signal and a reliable implemented system. The answer has a fixed shape: time-domain LTI structure makes sample operations predictable; Fourier and z-domain representations expose frequency, causality, and stability; finite-record and stochastic methods bound what spectra can say; filter and multirate structures convert specifications into efficient computations; five measured applications test where the ideal model stops matching the artifact."
prerequisites:
  - text: Algebra and trigonometry, including geometric series, logarithms, radians, and rational expressions
  - text: Complex arithmetic and Euler’s identity in rectangular and polar form
  - text: Single-variable calculus, including differentiation, integration, and convergence
  - text: "Elementary probability: mean, variance, covariance, and independence"
  - text: Ability to read and modify short Python/NumPy notebooks and interpret linear and logarithmic plots
key_results:
  - text: An LTI system is determined by its impulse response, with $y[n]=\sum_m x[m]h[n-m]$.
    lesson: impulse-response-and-convolution
  - text: "A causal LTI system is BIBO stable exactly when its impulse response is absolutely summable: $\\sum_k|h[k]|<\\infty$."
    lesson: difference-equations-and-stability
  - text: With a known uniform sampling period, a declared bandlimited signal class, the complete ideal sample sequence, and a declared reconstruction band, strict spectral-replica separation permits exact reconstruction; aliasing cannot be undone after sampling.
    lesson: sampling-aliasing-and-reconstruction
  - text: The DTFT diagonalizes convolution, while the z-transform adds region of convergence, causality, and stability.
    lesson: z-transform-poles-zeros-and-roc
  - text: The $N$-point DFT samples a finite record's DTFT at $\omega_k=2\pi k/N$, and DFT-domain multiplication computes circular convolution.
    lesson: dft-bins-symmetry-and-scaling
  - text: FFT factorization reduces suitable DFT computations from order $N^2$ to order $N\log N$ without changing the transform.
    lesson: fft-factorization-and-layout
  - text: Finite observation convolves the spectrum with the window transform, forcing a measurable leakage–resolution–noise-bandwidth tradeoff.
    lesson: windows-leakage-and-resolution
  - text: Zero padding densifies samples of the same DTFT; record duration, not FFT length, sets resolving power.
    lesson: peak-estimation-and-zero-padding
  - text: A raw periodogram remains variable; Welch averaging reduces variance by spending record length and frequency resolution.
    lesson: correlation-psd-and-welch
  - text: Window-hop pairs satisfying the COLA condition make the STFT exactly invertible.
    lesson: stft-spectrograms-and-reconstruction
  - text: Coefficient symmetry gives an FIR filter exact linear phase with delay $(N-1)/2$ samples; the minimax design equalizes its ripple extrema.
    lesson: fir-filter-design-and-verification
  - text: The bilinear transform maps the analog left half-plane one-to-one onto the unit disk, preserving stability while warping frequency as $\omega=2\arctan(\Omega T_s/2)$.
    lesson: iir-filter-design-and-bilinear-mapping
  - text: An $N$-point circular convolution equals linear convolution exactly when $N\ge L_x+L_h-1$; overlap scheduling extends the identity to unbounded streams.
    lesson: fast-convolution-and-streaming-blocks
  - text: Filter realization is part of filter design because finite-word direct forms and second-order sections are not numerically equivalent.
    lesson: finite-word-realizations
  - text: Downsampling by $M$ stretches the spectrum and sums $M$ shifted copies, so anti-alias filtering must precede the rate change.
    lesson: decimation-interpolation-and-antialiasing
  - text: Polyphase and noble identities preserve a rate converter while moving arithmetic to the lowest necessary sample rate.
    lesson: polyphase-rational-conversion
  - text: Under busy-signal conditions quantization error acts as white noise of variance $q^2/12$ — about 6 dB of SNR per bit — and dither purchases those conditions at low level for a stated noise cost.
    lesson: quantization-dither-and-subband-allocation
  - text: An analytic signal suppresses the negative-frequency image so complex mixing can translate one spectral direction, while I/Q mismatch makes the rejected image measurable again.
    lesson: analytic-signals-and-quadrature
spine:
  - step: A sample array becomes evidence only when index, units, acquisition rate, and between-sample assumptions are explicit.
    label: Samples carry contracts
    caption: The opening records what the numbers mean before transforming them.
    lessons:
      - sampled-sequences
  - step: Impulse decomposition and convolution make LTI behavior predictable; recurrence adds memory whose stability must be tested against measured dynamics.
    label: One response predicts a system
    caption: Skywalker X8 flight tests close the first time-domain loop with a measured identification audit.
    lessons:
      - impulse-response-and-convolution
      - difference-equations-and-stability
      - perching-glider-system-identification
  - step: Complex modes and the DTFT turn LTI behavior into magnitude and phase, and sampling becomes spectral replication with an irreversible overlap boundary.
    label: Modes expose frequency
    caption: Rotation, response, and sampling share one frequency axis.
    lessons:
      - complex-sinusoids-and-phasors
      - dtft-and-frequency-response
      - sampling-aliasing-and-reconstruction
  - step: The DFT supplies finite coordinates and the FFT computes them efficiently; a DTMF receiver turns coefficients into a constrained decision.
    label: Finite coordinates become computation
    caption: Indexing, scaling, factorization, and latency meet in one receiver.
    lessons:
      - dft-bins-symmetry-and-scaling
      - fft-factorization-and-layout
      - phone-channel-dtmf-receiver
  - step: Finite records trade leakage against resolution, and isolated-tone interpolation cannot manufacture observation time.
    label: Observation limits spectra
    caption: Window metrics replace visual preference with measurement.
    lessons:
      - windows-leakage-and-resolution
      - peak-estimation-and-zero-padding
  - step: Random and changing signals require PSD estimators and local spectra whose bias, variance, time resolution, and reconstruction are declared.
    label: Spectra become estimates
    caption: Recorded audio tests stationary, stochastic, and short-time claims.
    lessons:
      - correlation-psd-and-welch
      - stft-spectrograms-and-reconstruction
      - parametric-spectral-estimation
      - recorded-audio-spectral-analysis
  - step: The z-plane connects response to causality and stability; FIR and IIR methods approximate specifications with different phase and order costs.
    label: Specifications become filters
    caption: Poles, zeros, ripples, and delay turn a desired response into coefficients.
    lessons:
      - z-transform-poles-zeros-and-roc
      - fir-filter-design-and-verification
      - iir-filter-design-and-bilinear-mapping
  - step: Streaming blocks and finite words make implementation structure observable; an ECG cascade tests morphology, delay, transients, and stability.
    label: Structures face machines
    caption: Equivalent formulas separate under latency and quantization.
    lessons:
      - fast-convolution-and-streaming-blocks
      - finite-word-realizations
      - minimum-phase-and-allpass-structures
      - ecg-cleanup-under-morphology-constraints
  - step: Rate changes are filtering problems, and polyphase schedules and filter-bank matrices remove redundant work while controlling alias transfer.
    label: Rates become channel structures
    caption: Rational conversion opens an optional rigorous reconstruction-bank and wavelet branch.
    lessons:
      - decimation-interpolation-and-antialiasing
      - polyphase-rational-conversion
      - perfect-reconstruction-filter-banks
      - wavelet-and-paraunitary-banks
  - step: Quadrature transport and finite-bit subbands close an end-to-end audio link whose alias, reconstruction, rate, noise, computation, and latency budgets must agree.
    label: The full link closes
    caption: Communication and compression expose accumulated departures from ideal DSP.
    lessons:
      - analytic-signals-and-quadrature
      - quantization-dither-and-subband-allocation
      - streaming-audio-resampling-and-subband-link
sources:
  - Alan V. Oppenheim, Ronald W. Schafer, and John R. Buck, Discrete-Time Signal Processing, Second Edition (the locally researched accessible edition)
  - Richard G. Lyons, Understanding Digital Signal Processing, Third Edition
  - P. P. Vaidyanathan, Multirate Systems and Filter Banks
  - Sophocles J. Orfanidis, Introduction to Signal Processing, Second Edition
  - Steven W. Smith, The Scientist and Engineer’s Guide to Digital Signal Processing
  - Dennis Freeman, Signals and Systems, MIT 6.003, Fall 2011
  - Brad Osgood, The Fourier Transform and Its Applications, EE 261
  - Alan V. Oppenheim, Discrete-Time Signal Processing, MIT 6.341, Fall 2005
  - Petre Stoica and Randolph Moses, Spectral Analysis of Signals
  - Julius O. Smith III, Spectral Audio Signal Processing
  - Fredric J. Harris, On the Use of Windows for Harmonic Analysis with the Discrete Fourier Transform
  - James W. Cooley and John W. Tukey, An Algorithm for the Machine Calculation of Complex Fourier Series
  - Jack Schaedler, Seeing Circles, Sines, and Signals
  - International Telecommunication Union, ITU-T Recommendations Q.23 and Q.24 (11/1988)
  - Bogdan Løw-Hansen and Richard Hann, System identification campaign - Skywalker X8 UAV, DataverseNO, Version 1.0
  - "Bernard Widrow et al., Adaptive Noise Cancelling: Principles and Applications, Proceedings of the IEEE 63(12), 1975"
outcomes:
  - id: time-domain
    text: Analyze discrete-time LTI systems with sequence operations, impulse responses, convolution, difference equations, and stability tests.
    bloom: analyze
  - id: transforms
    text: Analyze signals and systems with complex exponentials, the DTFT, the z-transform, and pole-zero geometry.
    bloom: analyze
  - id: sampling
    text: Evaluate sample-rate, anti-alias, reconstruction, and frequency-mapping choices for continuous-to-discrete acquisition.
    bloom: evaluate
  - id: finite-spectra
    text: Evaluate DFT/FFT measurements with correct indexing, scaling, windowing, leakage, resolution, and calibration.
    bloom: evaluate
  - id: stochastic-spectra
    text: Evaluate PSD and STFT estimates through stationarity, bias, variance, overlap, time-frequency resolution, and model mismatch.
    bloom: evaluate
  - id: filter-design
    text: Design FIR and IIR filters and select streaming and finite-word realizations that satisfy response, delay, cost, and stability constraints.
    bloom: create
  - id: multirate
    text: Design efficient decimators, interpolators, rational converters, and analysis/synthesis filter banks with polyphase structures.
    bloom: create
  - id: communications
    text: Design quadrature and subband signal chains that meet image-rejection, distortion, bit-rate, computation, and latency budgets.
    bloom: create
  - id: validation
    text: Evaluate a DSP system against a measured or reproducible artifact and state where finite data, noise, rate, precision, or model mismatch defeats the idealization.
    bloom: evaluate
modules:
  - slug: discrete-signals-and-systems
    title: Discrete Signals and Systems
    outcomes:
      - time-domain
      - validation
    lessons:
      - slug: sampled-sequences
        title: Sampled Sequences and Physical Units
        type: core
        status: drafted
        goal: Analyze a measured waveform as a discrete sequence with explicit index, time, amplitude, and rate units.
        opening: A numeric sample array becomes a signal only when its index, units, sample period, and acquisition assumptions are stated.
        est_minutes: 32
        prerequisites: []
        concepts:
          introduces:
            - discrete-sequence
            - sampling-period
          reinforces: []
        key_ideas:
          - Sample index $n$ is dimensionless while $nT_s$ is time
          - Amplitude units and integer codes are different representations
          - Finite records do not imply periodic extension
          - Between-sample behavior is not part of the sequence
        demo: null
        key_image: figures/same-codes-two-rates.svg
        notes: "Front-load polish: one eight-sample microphone record, literal arrays, synchronized plots, and a mislabeled-axis repair task."
      - slug: impulse-response-and-convolution
        title: Impulse Response and Convolution
        type: core
        status: drafted
        goal: Compute and interpret the output of a discrete-time LTI system by convolution.
        opening: An LTI system is completely determined by its response to one unit impulse, and convolution assembles the response to every input.
        est_minutes: 36
        prerequisites:
          - sampled-sequences
        concepts:
          introduces:
            - lti-system
            - impulse-response
            - linear-convolution
          reinforces:
            - discrete-sequence
        key_ideas:
          - Linearity and time invariance are separate tests
          - Every sequence is a weighted sum of shifted impulses
          - $y[n]=\sum_m x[m]h[n-m]$
          - Finite buffers require an explicit boundary convention
        demo:
          component: EchoKernelLab
          spec: "Identification task: tune the causal three-tap kernel h=[0.70,0.25,0.10] on an eternal constant input whose steady-state observation reveals only the tap sum, then validate on a held-out unit impulse; startup edge transients are not observed. The impulse's three displayed output equations form a rank-3 identity design for the taps. Use normalized L2 error E=||y_hat-y||_2/max(||y||_2,epsilon): if both target and prediction are zero set E=0, while a nonzero prediction for a zero target fails. Pass when every tap is within 0.01 and the held-out impulse error is below 0.01."
        key_image: figures/impulse-decomposition.svg
        notes: "Second polished opener: at f_s=8 kHz, convolve x[0]=1 V, x[1]=2 V with h[0]=1, h[1]=0.5, h[2]=0.25 (both zero outside their stated indices) to get y=[1,2.5,1.25,0.5] V; verify it numerically, then identify an echo kernel."
      - slug: difference-equations-and-stability
        title: Difference Equations and Stability
        type: core
        status: drafted
        goal: Analyze a causal difference equation through its modes, impulse response, and BIBO stability condition.
        opening: Feedback gives a discrete-time system memory and economy, but its recurrence can hide a mode that grows beyond the displayed record.
        est_minutes: 38
        prerequisites:
          - impulse-response-and-convolution
        concepts:
          introduces:
            - difference-equation
            - bibo-stability
          reinforces:
            - lti-system
            - impulse-response
        key_ideas:
          - Initial conditions are part of a recursive computation
          - Homogeneous modes determine decay or growth
          - BIBO stability requires absolute summability of $h[n]$
          - Finite traces cannot establish asymptotic stability
        demo:
          component: FeedbackStabilityLab
          spec: "Tune the normalized all-pole resonator H(z)=1/(1-2r cos(omega_0)z^-1+r^2 z^-2), sampled at f_s=1000 samples/s and driven by x[n]=delta[n] from y[-1]=y[-2]=0, over output indices n=0,...,N-1. The requested frequency is f_0=180 Hz=0.180 cycles/sample, so omega_0=2 pi f_0/f_s; implement y[n]=x[n]+a_1 y[n-1]+a_2 y[n-2] with a_1=2r cos(omega_0), a_2=-r^2 (left-side denominator coefficients [1,-a_1,-a_2]). Pass only when relative frequency error is strictly below 1%, r<=0.98, and the first integer N_1%=ceil(log(0.01)/log(r)) is strictly below 200; the joint integer boundary is r<=0.01^(1/199)=0.977124..., so the 0.001 grid's largest passing radius is 0.977. Then set f_0=0.180, r=1.002 and extend the same impulse computation from 100 to 1000 samples to falsify the claim that a bounded 100-sample display proves BIBO stability."
        key_image: figures/finite-trace-stability.svg
      - slug: perching-glider-system-identification
        title: Longitudinal System Identification from Skywalker X8 UAV Flight Tests
        type: synthesis
        status: drafted
        goal: Evaluate a low-order discrete model against measured Skywalker X8 longitudinal flight-test records and identify where its assumptions fail.
        opening: A fitted recurrence is useful only when it predicts held-out flight measurements and its residuals expose the physics it omits.
        est_minutes: 40
        prerequisites:
          - difference-equations-and-stability
        concepts:
          introduces:
            - system-identification
          reinforces:
            - discrete-sequence
            - sampling-period
            - difference-equation
            - bibo-stability
        key_ideas:
          - Creator-designated training and validation maneuvers prevent leakage across records
          - Residual structure by time and excitation diagnoses model mismatch
          - Training error does not measure validation performance
          - Strong wind and manual channel synchronization limit physical and delay claims
        demo: null
        key_image: figures/time-ordered-holdout.svg
        notes: "APPLICATION — primary artifact: the CC0 DataverseNO Version 1.0 Skywalker X8 flight-test dataset, using seven creator-designated longitudinal training maneuvers and two creator-designated longitudinal validation maneuvers at 40 Hz. A frozen pitch-rate ARX(2,1,1) beats the matched-order input-free AR(2) baseline in one-step and free-run RMSE/NRMSE on both validation maneuvers; equal-maneuver macro NRMSE falls by 12.0% one-step and 60.3% free-run, while structured residual autocorrelation limits adequacy to predictively better but structurally incomplete. Idealization gap: strong wind, manually synchronized multirate channels, correlated sensor error, and maneuver shift. MIT 6.003 perching-glider rasters remain contextual motivation from a different vehicle and are neither digitized nor compared numerically."
  - slug: fourier-representation-and-computation
    title: Fourier Representation and Computation
    outcomes:
      - transforms
      - sampling
      - finite-spectra
      - validation
    lessons:
      - slug: complex-sinusoids-and-phasors
        title: Complex Sinusoids and Phasors
        type: core
        status: drafted
        goal: Analyze amplitude, phase, and discrete frequency with complex exponentials and quadrature components.
        opening: A complex exponential packages sinusoidal rotation into one mode whose magnitude and angle can be propagated algebraically.
        est_minutes: 34
        prerequisites:
          - difference-equations-and-stability
          - perching-glider-system-identification
        concepts:
          introduces:
            - complex-exponential
          reinforces:
            - difference-equation
        key_ideas:
          - The engineering phasor $P=Ae^{j\phi}$ is twice the positive-frequency coefficient $C_+=(A/2)e^{j\phi}$ of a real cosine
          - Discrete frequency is periodic modulo $2\pi$
          - On a declared non-DC/non-Nyquist orthogonal integer-cycle record, $I=(2/N)\sum x[n]\cos(\omega n)$ and $Q=-(2/N)\sum x[n]\sin(\omega n)$ give $P=I+jQ$
          - Principal phase is displayed in $(-\pi,\pi]$, compared by circular error, and left undefined at zero magnitude
        demo:
          component: QuadratureDetectorLab
          spec: >-
            Use the noise-free record x[n]=A cos(omega0 n+phi), n=0,...,19, with fixed nonzero A=1,
            omega0=0.3 pi radians/sample=0.15 cycles/sample, and N=20 (exactly three cycles). With
            c[n]=cos(omega0 n) and s[n]=sin(omega0 n), compute I=(2/N) sum x[n]c[n] and
            Q=-(2/N) sum x[n]s[n]; the minus sign follows the exp(-j omega n) analysis convention, so
            P=I+jQ, Ahat_IQ=hypot(I,Q), and phihat=atan2(Q,I). Display principal phase in (-180,180],
            mapping -180 to +180, and compare phase by circular error. The sine-only estimator is
            Ahat_sine=abs(Q), with phase unidentifiable; at phi=0 or +/-180 degrees it is falsified when
            abs(Q)<1e-12 and relative amplitude error>0.99. Initialize at phi=37 degrees. The New seeded
            phase control starts from unsigned seed 0x6d2b79f5, advances
            seed=(imul(seed,1664525)+1013904223)>>>0, and sets
            phaseDeg=round(seed/2^32*360-180), yielding -176, 58, -66, 176, 47, 103 first. Regression-test
            all 1,441 phases from -180 through +180 degrees inclusive in 0.25-degree steps; the demo passes
            only if every point has relative amplitude error<0.01 and circular phase error<2 degrees
            (equality fails), aggregating by the maxima, expected as 8.881784197001252e-16 and 0 degrees.
            Phase is never scored when recovered magnitude is zero; A=1 excludes that case. Do not imply
            noisy, off-bin, DC, Nyquist, or arbitrary-window performance.
        key_image: figures/phasor-projections.svg
      - slug: dtft-and-frequency-response
        title: DTFT and Frequency Response
        type: core
        status: drafted
        goal: Analyze LTI behavior with the DTFT, transform properties, magnitude, phase, and group delay.
        opening: Complex exponentials are LTI eigenfunctions, so their gains across frequency form a complete steady-state description.
        est_minutes: 40
        prerequisites:
          - complex-sinusoids-and-phasors
          - impulse-response-and-convolution
        concepts:
          introduces:
            - dtft
            - frequency-response
          reinforces:
            - complex-exponential
            - linear-convolution
            - lti-system
        key_ideas:
          - Finite and absolutely summable sequences have continuous, $2\pi$-periodic DTFTs; broader classes require weaker or generalized interpretations
          - For a stable LTI system with $h\in\ell^1$, convolution becomes multiplication, while $H(e^{j\omega})$ describes eternal modes or settled sinusoidal response rather than causal-start boundary samples
          - Time shift changes phase without changing magnitude
          - On a connected nonzero-response band with differentiable unwrapped phase and nearly constant magnitude, group delay approximates the delay of a sufficiently narrowband envelope
        demo: null
        key_image: figures/dtft-frequency-circle.svg
      - slug: sampling-aliasing-and-reconstruction
        title: Sampling, Aliasing, and Reconstruction
        type: core
        status: drafted
        goal: Evaluate whether sampling preserves a bandlimited signal and specify the anti-alias and reconstruction conditions.
        opening: Sampling multiplies a continuous signal by an impulse train, which replicates its spectrum and makes overlap irreversible.
        est_minutes: 40
        prerequisites:
          - dtft-and-frequency-response
        concepts:
          introduces:
            - sampling
            - aliasing
          reinforces:
            - sampling-period
            - dtft
            - frequency-response
        key_ideas:
          - Sampling creates spectral replicas at multiples of $f_s$
          - With known uniform $T_s$, a declared bandlimited signal class, the complete ideal sample sequence, and a declared reconstruction band, strict replica separation permits exact reconstruction
          - Equality at Nyquist is safe only with an explicit endpoint convention such as zero boundary spectrum; it is not a phase-independent guarantee for endpoint sinusoids
          - Digital filtering cannot undo analog aliasing
        demo:
          component: AliasThresholdLab
          spec: >-
            Test ordinary ideal lowpass reconstruction for the arbitrary real signal class known a priori to satisfy |f|<=B=4.0 kHz, not model-based sparse-tone recovery. Display x(t)=cos(2pi*0.7t+20deg)+0.75cos(2pi*1.8t-35deg)+0.50cos(2pi*3.1t+45deg)+0.35cos(2pi*4.0t+phi), with frequencies in kHz and t in ms, and test each of 0.7, 1.8, 3.1, and 4.0 kHz separately at phases 0, 45, and 90 degrees. Sweep f_s from 6.00 to 10.00 kHz on the exact 0.25 kHz grid. Ideal sample-only reconstruction preserves f<f_s/2, reconstructs the signed baseband alias for f>f_s/2, and at equality reconstructs cos(phi)cos(2pi f t). On M=512 common, unaligned times t_m=20m/M ms, score E=||x_hat-x||_2/max(||x||_2,Number.EPSILON) and E_dB=20log10(E), flooring exact zero at -120 dB only for display. PASS requires unfloored E<1e-3 for every tone-phase case, every tone strictly below Nyquist, and f_s/2-B>=0.50 kHz; 9.00 kHz is the unique lowest grid pass. At 8.00 kHz and phi=90 degrees the nonzero 4 kHz tone samples to zero, falsifying equality; over continuous rates 8 kHz is only an unsafe infimum, so no smallest strict passing rate exists.
        key_image: figures/sampling-replicas.svg
      - slug: dft-bins-symmetry-and-scaling
        title: DFT Bins, Symmetry, and Scaling
        type: core
        status: drafted
        goal: Compute and interpret a finite DFT with explicit indexing, normalization, symmetry, and circular-convolution conventions.
        opening: The DFT samples one period of a finite record’s spectrum and therefore inherits both periodic indexing and implementation conventions.
        est_minutes: 40
        prerequisites:
          - dtft-and-frequency-response
        concepts:
          introduces:
            - dft
            - circular-convolution
          reinforces:
            - dtft
            - complex-exponential
        key_ideas:
          - Bin $k$ maps to $kf_s/N$ only after $f_s$ and $N$ are known
          - Real data produce conjugate-symmetric coefficients
          - Forward and inverse scale factors must be declared
          - DFT multiplication produces circular convolution
        demo:
          component: PaddingVsDataLab
          spec: Use zero padding to reduce one-tone peak-location error below 0.1 original bins, then try and fail to resolve a two-tone pair hidden by the unchanged record. Two stable maxima under a phase perturbation are the resolution threshold.
        key_image: figures/dtft-dft-bin-samples.svg
      - slug: fft-factorization-and-layout
        title: FFT Factorization and Machine Layout
        type: core
        status: drafted
        goal: Construct a factored FFT and account for arithmetic, storage, ordering, and scaling.
        opening: Repeated roots of unity let a DFT be decomposed into short transforms without changing the coefficients it computes.
        est_minutes: 40
        prerequisites:
          - dft-bins-symmetry-and-scaling
        concepts:
          introduces:
            - fft
          reinforces:
            - dft
            - circular-convolution
        key_ideas:
          - Direct DFT cost is order $N^2$
          - Composite lengths factor into stages
          - Butterflies permit in-place updates
          - Bit reversal and scaling are observable interface contracts
        demo:
          component: FftBudgetLab
          spec: Choose a mixed-radix plan for N=960 that uses at least eight times fewer complex multiply-adds than direct evaluation and matches a small direct DFT below 1e-10 relative error. Missing permutations or scaling fail; the task falsifies power-of-two-only FFT reasoning.
        key_image: figures/fft-even-odd-factorization-4.svg
      - slug: phone-channel-dtmf-receiver
        title: Phone-Channel DTMF Receiver
        type: synthesis
        status: drafted
        goal: Design an auditable finite-latency DTMF decision contract from finite Fourier evidence with explicit tolerance, rejection, timing, and cost gates.
        opening: A DTMF receiver must turn finite Fourier evidence into a key-or-reject decision while keeping spectral features, temporal qualification, latency, and cost on declared coordinates.
        est_minutes: 40
        prerequisites:
          - fft-factorization-and-layout
          - sampling-aliasing-and-reconstruction
        concepts:
          introduces: []
          reinforces:
            - complex-exponential
            - frequency-response
            - dft
            - fft
            - sampling
        key_ideas:
          - One accepted low-group tone and one accepted high-group tone encode a candidate key; every failed or ambiguous gate returns reject
          - A 205-sample spectral-feature frame is distinct from the at-least-320-sample temporal qualification required by the named 40 ms profile boundary
          - The AT&T column of Q.24 Annex A is a named laboratory profile whose 23–40 ms interval is neither mandatory operation nor mandatory rejection
          - Exact-nominal correlations and ordinary FFT-grid bins are different coordinates, so operation and latency ledgers must declare what each path computes
        demo:
          component: DtmfDecisionLab
          spec: Choose one frozen synthetic trial and enable independent pair, detuning, twist, duration, and pause gates until its declared key-or-reject contract is satisfied. Keep the frozen receiver decision beside the teaching-contract decision; the hard accepted case must still display its measured 50 ms received-onset latency failure, and gray 24-39 ms cases remain unscored. Interruption remains part of the full receiver contract but is not inferred from cards that lack active-span interruption fields.
        key_image: figures/dtmf-key-decision-grid.svg
        notes: >-
          APPLICATION — artifact: deterministic synthetic DTMF PCM passed through the course's 101-tap 300–3400 Hz FIR, not a deployed receiver, standards-conforming implementation, real recording, reverberant path, or clipping test. The lesson's single move is an explicit row-plus-column key-or-reject contract using the named AT&T column of Q.24 Annex A; 23–40 ms is a gray region, an N=205 frame supplies spectral features only, and temporal qualification requires at least 320 received samples. Exact-nominal correlations and FFT-grid bins remain distinct coordinate choices with separate operation ledgers. A separate frozen receiver study uses a 160-sample exact-nominal record and 5 ms temporal blocks: clean passes at 512/512 against >=99%, and the active-tone 10 dB split with independent low/high offsets inside +/-1.5% passes at 1023/1024 against >=95%. All-negative rejection fails at 637/640: one two-low trial emits B, one low-twist trial emits 5, and one 38 ms-pause trial emits 2. Maximum accepted hard-set latency from received-signal onset is 50 ms, failing the <=40 ms target; source-onset reporting separately includes the FIR's 50-sample (6.25 ms) group delay and declared alignment. These are deterministic synthetic partial results, not statistical-confidence, real-channel, or standards-conformance evidence. The next lesson owns window choice; this lesson exposes leakage and hands off the repair.
  - slug: spectral-measurement
    title: Spectral Measurement
    outcomes:
      - finite-spectra
      - stochastic-spectra
      - validation
    lessons:
      - slug: windows-leakage-and-resolution
        title: Windows, Leakage, and Resolution
        type: core
        status: planned
        goal: Evaluate analysis windows from main-lobe width, sidelobes, coherent gain, scalloping, and equivalent noise bandwidth.
        opening: Finite observation convolves the desired spectrum with the window transform, so every leakage repair changes resolution and calibration.
        est_minutes: 40
        prerequisites:
          - dft-bins-symmetry-and-scaling
        concepts:
          introduces:
            - analysis-window
            - spectral-leakage
          reinforces:
            - dft
            - frequency-response
        key_ideas:
          - Leakage is caused by finite observation, not sampling
          - Endpoint smoothness controls far sidelobes
          - Narrow main lobes and low sidelobes conflict
          - Coherent gain and ENBW calibrate signal and noise
        demo:
          component: WeakToneWindowLab
          spec: Detect a -40 dB tone 5.5 original bins from a stronger tone by choosing window and record length before relative phase is randomized. Pass only when the weak peak remains at least 3 dB above local leakage for every tested phase; rectangular-window failure falsifies narrowest-is-best.
      - slug: peak-estimation-and-zero-padding
        title: Peak Estimation and Zero-Padding Limits
        type: core
        status: planned
        goal: Estimate sinusoidal frequency and amplitude without confusing spectral interpolation with physical resolution.
        opening: A sampled main lobe can locate one isolated tone between bins, but denser FFT samples do not add observation time or separate unresolved components.
        est_minutes: 36
        prerequisites:
          - windows-leakage-and-resolution
          - fft-factorization-and-layout
        concepts:
          introduces:
            - spectral-resolution
          reinforces:
            - analysis-window
            - spectral-leakage
            - fft
        key_ideas:
          - Record duration sets resolving power
          - Zero padding interpolates the same DTFT
          - Peak interpolation is window-dependent and biased
          - Relative phase can create false two-peak resolution
        demo: null
      - slug: correlation-psd-and-welch
        title: Correlation, PSD, and Welch Estimation
        type: core
        status: planned
        goal: Evaluate a stationary power-spectrum estimate through autocorrelation, bias, variance, leakage, overlap, and resolution.
        opening: Random power is an ensemble property, so one finite periodogram must be treated as an estimator rather than a deterministic transform result.
        est_minutes: 40
        prerequisites:
          - peak-estimation-and-zero-padding
          - dtft-and-frequency-response
        concepts:
          introduces:
            - random-process
            - autocorrelation
            - power-spectral-density
            - welch-estimator
          reinforces:
            - analysis-window
            - spectral-resolution
        key_ideas:
          - PSD is the DTFT of autocorrelation for WSS processes
          - A raw periodogram is not a consistent estimator
          - Averaging reduces variance at a resolution cost
          - Overlapped frames are correlated evidence
        demo:
          component: WelchTradeoffLab
          spec: Configure Welch estimation to separate tones 0.04 cycles/sample apart while coefficient of variation stays below 0.30 over at least 50 seeded noise trials. Extremely short and long frames expose the resolution-variance frontier and falsify the claim that a longer raw periodogram becomes stable.
      - slug: stft-spectrograms-and-reconstruction
        title: STFT, Spectrograms, and Reconstruction
        type: core
        status: planned
        goal: Design an STFT with window, hop, FFT length, and reconstruction conditions matched to a changing signal.
        opening: Welch averaging discards frame order; the STFT retains it so spectral change becomes visible and, under overlap conditions, reversible.
        est_minutes: 40
        prerequisites:
          - correlation-psd-and-welch
        concepts:
          introduces:
            - stft
            - subband-analysis
          reinforces:
            - analysis-window
            - dft
            - welch-estimator
        key_ideas:
          - Window length trades time for frequency localization
          - FFT length changes display sampling, not window resolution
          - Hop size samples the time axis
          - COLA/WOLA conditions govern reconstruction, and the channel view supplies a minimal non-gating subband model
        demo:
          component: ColaReconstructionLab
          spec: Choose window and hop for normalized reconstruction error below -100 dB and overlap-sum deviation below 1e-10 away from boundaries, then change only the hop until modulation appears. A non-COLA 50% overlap falsifies overlap-alone reconstruction.
      - slug: parametric-spectral-estimation
        title: Parametric Spectral Estimation
        type: extra
        status: planned
        goal: Evaluate AR and subspace spectral estimates against order, conditioning, identifiability, and model mismatch.
        opening: A generative model can resolve structure beyond a nonparametric main lobe only by spending stronger assumptions that must be tested.
        est_minutes: 40
        prerequisites:
          - correlation-psd-and-welch
        concepts:
          introduces:
            - parametric-spectrum
          reinforces:
            - power-spectral-density
            - bibo-stability
            - autocorrelation
        key_ideas:
          - AR spectra are rational all-pole models
          - Yule–Walker links covariance to prediction
          - MUSIC separates signal and noise subspaces
          - Model order and mismatch can invent peaks
        demo: null
      - slug: recorded-audio-spectral-analysis
        title: Recorded Audio Spectral Analysis
        type: synthesis
        status: planned
        goal: Defend spectral-analysis parameters on measured music and speech and verify reconstruction.
        opening: A useful spectral report must make windows, peak models, stochastic estimates, and STFT reconstruction agree on a recording that violates stationary-tone assumptions.
        est_minutes: 40
        prerequisites:
          - stft-spectrograms-and-reconstruction
        concepts:
          introduces: []
          reinforces:
            - analysis-window
            - spectral-leakage
            - spectral-resolution
            - random-process
            - autocorrelation
            - power-spectral-density
            - welch-estimator
            - stft
        key_ideas:
          - Instrument harmonics test leakage and dynamic range
          - Speech tests changing formants and voicing
          - Autocorrelation, Welch, and repeated frames expose estimator variability
          - A reconstruction null test checks conventions
        demo: null
        notes: "APPLICATION — artifact: captured real oboe spectra and speech spectrograms, with a rights-cleared replacement recording if reuse is not cleared. Results: windows, peak calibration, PSD/Welch, STFT, reconstruction. Idealization gap: attacks, vibrato, inharmonicity, formant motion, colored noise, and phase evolution."
  - slug: filter-design-and-implementation
    title: Filter Design and Implementation
    outcomes:
      - transforms
      - filter-design
      - validation
    lessons:
      - slug: z-transform-poles-zeros-and-roc
        title: z-Transform, Poles, Zeros, and ROC
        type: core
        status: planned
        goal: Analyze sequences and rational systems using region of convergence, pole-zero geometry, causality, and stability.
        opening: The DTFT describes behavior on the unit circle; the z-transform records which causal and transient structure produces that boundary response.
        est_minutes: 40
        prerequisites:
          - dtft-and-frequency-response
          - difference-equations-and-stability
        concepts:
          introduces:
            - z-transform
            - pole-zero-model
          reinforces:
            - frequency-response
            - bibo-stability
        key_ideas:
          - A rational expression without its ROC is incomplete
          - The DTFT exists when the unit circle lies in the ROC
          - Causal stable rational systems have poles inside the unit circle
          - Pole-zero vectors predict magnitude and phase
        demo: null
      - slug: fir-filter-design-and-verification
        title: FIR Filter Design and Verification
        type: core
        status: planned
        goal: Design and densely verify a linear-phase FIR filter from ripple, attenuation, transition-width, and delay requirements.
        opening: An ideal frequency response becomes implementable only after approximation error, causality, delay, and a dense verification grid are budgeted.
        est_minutes: 40
        prerequisites:
          - z-transform-poles-zeros-and-roc
          - windows-leakage-and-resolution
        concepts:
          introduces:
            - fir-filter
            - linear-phase
          reinforces:
            - analysis-window
            - frequency-response
            - impulse-response
        key_ideas:
          - Ideal sinc responses are infinite and noncausal
          - Window families map transition width to sidelobes
          - Symmetry yields exact linear phase
          - Equiripple and least-squares optimize different errors
        demo:
          component: FirSpecSearchLab
          spec: Meet 0.1 dB passband ripple and 60 dB stopband attenuation over a fixed transition using the fewest odd taps among window and equiripple designs. Dense-grid verification is required; rectangular truncations falsify the claim that more taps remove Gibbs peak ripple.
      - slug: iir-filter-design-and-bilinear-mapping
        title: IIR Filter Design and Bilinear Mapping
        type: core
        status: planned
        goal: Design a stable IIR filter and judge its magnitude, phase, order, and transient tradeoffs.
        opening: Feedback meets sharp magnitude requirements with fewer states than an FIR, but analog mapping and nonlinear phase add new constraints.
        est_minutes: 40
        prerequisites:
          - z-transform-poles-zeros-and-roc
        concepts:
          introduces:
            - iir-filter
          reinforces:
            - pole-zero-model
            - frequency-response
            - z-transform
        key_ideas:
          - Analog prototypes trade flatness and ripple
          - The bilinear transform preserves stability
          - Prewarping corrects selected frequency edges
          - High-Q poles increase sensitivity and settling time
        demo: null
      - slug: fast-convolution-and-streaming-blocks
        title: Fast Convolution and Streaming Blocks
        type: core
        status: planned
        goal: Implement long FIR filtering with overlap-add or overlap-save while preserving linear convolution.
        opening: FFT factorization makes long kernels practical only when padding, valid regions, state, latency, and normalization are scheduled correctly.
        est_minutes: 38
        prerequisites:
          - fir-filter-design-and-verification
          - fft-factorization-and-layout
        concepts:
          introduces:
            - block-convolution
          reinforces:
            - linear-convolution
            - fft
            - fir-filter
            - circular-convolution
            - linear-phase
        key_ideas:
          - Circular wrap is eliminated by padding and overlap
          - OLA sums tails while OLS discards corrupted prefixes
          - Block length trades latency against throughput
          - The direct/FFT crossover is hardware-dependent
        demo: null
      - slug: finite-word-realizations
        title: Finite-Word Realizations
        type: core
        status: planned
        goal: Evaluate a filter realization under coefficient quantization, roundoff, overflow, limit cycles, bounded dither, and section ordering.
        opening: Algebraically equivalent transfer functions cease to be equivalent when coefficients and states live on a finite grid.
        est_minutes: 40
        prerequisites:
          - iir-filter-design-and-bilinear-mapping
        concepts:
          introduces:
            - finite-wordlength
            - quantization
            - dither
          reinforces:
            - iir-filter
            - pole-zero-model
            - z-transform
        key_ideas:
          - Second-order sections localize sensitivity
          - Scaling protects internal states
          - Coefficient rounding moves poles and zeros
          - Feedback can sustain zero-input limit cycles, while small seeded dither can expose or decorrelate grid-locked error
        demo:
          component: FixedPointStructureLab
          spec: Choose word length and second-order-section ordering so every quantized pole radius is below 0.999 and passband error stays below 0.5 dB. Compare direct form at the same bit budget to falsify numerical equivalence of algebraically equal transfer functions.
      - slug: minimum-phase-and-allpass-structures
        title: Minimum-Phase and Allpass Structures
        type: extra
        status: planned
        goal: Analyze magnitude-equivalent systems through minimum-phase factors, allpass sections, Hilbert transformers, and analytic-signal construction.
        opening: The same magnitude response can carry very different phase and delay, and factorization isolates those degrees of freedom.
        est_minutes: 40
        prerequisites:
          - z-transform-poles-zeros-and-roc
          - iir-filter-design-and-bilinear-mapping
        concepts:
          introduces:
            - minimum-phase
          reinforces:
            - pole-zero-model
            - frequency-response
        key_ideas:
          - Reciprocal-conjugate zero choices preserve magnitude
          - Minimum phase concentrates energy earliest
          - Allpass sections change phase at unit magnitude
          - Hilbert transformers create quadrature pairs
        demo: null
      - slug: ecg-cleanup-under-morphology-constraints
        title: ECG Cleanup Under Morphology Constraints
        type: synthesis
        status: planned
        goal: Design and validate an ECG filter cascade that suppresses interference without erasing diagnostic waveform structure.
        opening: A filter specification is incomplete until its delay, ringing, startup transient, block behavior, and finite-word realization are tested on the measured waveform.
        est_minutes: 40
        prerequisites:
          - fast-convolution-and-streaming-blocks
          - finite-word-realizations
        concepts:
          introduces: []
          reinforces:
            - fir-filter
            - iir-filter
            - linear-phase
            - block-convolution
            - finite-wordlength
        key_ideas:
          - Baseline drift needs highpass behavior
          - Mains interference needs a narrow rejection mechanism
          - Broadband noise and QRS energy overlap
          - Morphology and timing are acceptance criteria
        demo: null
        notes: "APPLICATION — artifact: MIT 6.003 measured ECG trace and spectrum. Results: z-plane reasoning, FIR/IIR design, phase, fast convolution, SOS and fixed-point checks. Idealization gap: noise overlaps cardiac content, mains drifts, causal filters delay events, and sharp filters ring around QRS impulses."
  - slug: multirate-communications-and-compression
    title: Multirate Communications and Compression
    outcomes:
      - multirate
      - communications
      - validation
    lessons:
      - slug: decimation-interpolation-and-antialiasing
        title: Decimation, Interpolation, and Anti-Alias Filtering
        type: core
        status: planned
        goal: Analyze integer sample-rate changes and specify filters that prevent folding and suppress images.
        opening: Changing a sample rate changes the spectral coordinate system and is valid only when the discarded or inserted degrees of freedom are filtered correctly.
        est_minutes: 40
        prerequisites:
          - sampling-aliasing-and-reconstruction
          - fir-filter-design-and-verification
        concepts:
          introduces:
            - multirate-system
          reinforces:
            - sampling
            - aliasing
            - fir-filter
            - sampling-period
        key_ideas:
          - Downsampling stretches and sums spectra
          - Upsampling inserts zeros and creates images
          - Anti-alias filtering precedes decimation
          - Anti-image filtering completes interpolation
        demo: null
      - slug: polyphase-rational-conversion
        title: Polyphase Rational Sample-Rate Conversion
        type: core
        status: planned
        goal: Design an efficient $L/M$ converter using polyphase components, noble identities, and a low-rate schedule.
        opening: The spectral filter specifies what a rate converter must do; polyphase structure removes products that cannot contribute to retained outputs.
        est_minutes: 40
        prerequisites:
          - decimation-interpolation-and-antialiasing
        concepts:
          introduces:
            - polyphase-decomposition
          reinforces:
            - multirate-system
            - fir-filter
        key_ideas:
          - Expansion, filtering, and decimation implement $L/M$
          - Polyphase components partition coefficients by residue
          - Noble identities move filters across rate changers
          - 44.1 kHz to 48 kHz uses $160/147$
        demo:
          component: PolyphaseEquivalenceLab
          spec: Transform a direct L/M converter into a polyphase schedule with output difference below 1e-10 and at most 35% of the direct multiply count. Counting products by inserted zeros fails the budget and falsifies unavoidable high-rate filtering.
      - slug: perfect-reconstruction-filter-banks
        title: Perfect-Reconstruction Filter Banks
        type: extra
        status: planned
        goal: Design and test an analysis/synthesis bank that cancels aliasing and reconstructs a delayed input.
        opening: Polyphase branches become frequency channels whose coupled alias terms must cancel, even when each individual filter looks acceptable.
        est_minutes: 40
        prerequisites:
          - polyphase-rational-conversion
        concepts:
          introduces:
            - perfect-reconstruction
          reinforces:
            - polyphase-decomposition
            - aliasing
        key_ideas:
          - Critical sampling removes redundancy
          - Analysis and synthesis jointly determine alias transfer
          - Perfect reconstruction permits gain and delay
          - Subband quantization breaks exact cancellation
        demo:
          component: PerfectReconstructionLab
          spec: Tune a two-channel bank to reconstruction error below -100 dB and alias below -90 dB, then perturb one synthesis coefficient until error exceeds -40 dB while individual magnitude plots remain similar. This falsifies good-looking filters as a guarantee of reconstruction.
      - slug: wavelet-and-paraunitary-banks
        title: Wavelet and Paraunitary Filter Banks
        type: extra
        status: planned
        goal: Analyze paraunitary, cosine-modulated, and dyadic wavelet banks as structured perfect-reconstruction systems.
        opening: Energy-preserving matrix structure and nonuniform tiling extend the two-channel reconstruction conditions without burdening the core implementation path.
        est_minutes: 40
        prerequisites:
          - perfect-reconstruction-filter-banks
        concepts:
          introduces:
            - wavelet-filter-bank
          reinforces:
            - perfect-reconstruction
            - polyphase-decomposition
        key_ideas:
          - Paraunitary banks preserve energy
          - Cosine modulation generates channels from one prototype
          - Dyadic banks trade time and frequency resolution by scale
          - Critical sampling remains sensitive to coefficient error
        demo: null
      - slug: analytic-signals-and-quadrature
        title: Analytic Signals and Quadrature Communication
        type: core
        status: planned
        goal: Construct an analytic signal and use I/Q processing for modulation, demodulation, and image rejection.
        opening: Complex baseband separates positive and negative frequency so a passband channel can be translated and filtered without an unwanted mirror.
        est_minutes: 40
        prerequisites:
          - complex-sinusoids-and-phasors
          - dtft-and-frequency-response
          - fir-filter-design-and-verification
        concepts:
          introduces:
            - analytic-signal
            - quadrature-processing
          reinforces:
            - frequency-response
            - fir-filter
        key_ideas:
          - Analytic signals suppress negative-frequency content
          - I and Q are orthogonal projections
          - Complex mixing translates one spectral direction
          - Gain and phase imbalance create image leakage
        demo:
          component: IqImbalanceLab
          spec: Correct gain and phase imbalance until EVM is below 5% and image rejection exceeds 40 dB, then find where phase error first pushes EVM over 10%. The uncorrected real mixer falsifies one-sideband isolation.
      - slug: quantization-dither-and-subband-allocation
        title: Quantization, Dither, and Subband Allocation
        type: core
        status: planned
        goal: Evaluate quantizer, dither, and subband bit-allocation choices against distortion, noise, overload, and rate.
        opening: Coding reduces the data rate only by accepting error, and the common white-noise model fails when low-level signal structure locks to the quantizer.
        est_minutes: 40
        prerequisites:
          - stft-spectrograms-and-reconstruction
          - finite-word-realizations
          - polyphase-rational-conversion
          - analytic-signals-and-quadrature
        concepts:
          introduces: []
          reinforces:
            - random-process
            - autocorrelation
            - power-spectral-density
            - quantization
            - dither
            - subband-analysis
            - analytic-signal
            - quadrature-processing
            - polyphase-decomposition
        key_ideas:
          - Step size and overload are separate failures
          - $q^2/12$ is a conditional noise model
          - Dither trades deterministic distortion for noise
          - Equivalent direct and polyphase channel schedules preserve subband statistics while unequal bits exploit unequal signal importance
        demo:
          component: DitherWhitenessLab
          spec: Quantize low-level speech at 3 bits and tune seeded dither until absolute input/error correlation is below 0.05 and the largest deterministic spur falls by at least 10 dB, while reporting the SNR cost. The undithered record falsifies universal white quantization noise.
        notes: "Keep one rate–distortion decision throughline: separate overload from granular error, test the white-noise hypothesis, then allocate a fixed bit budget across measured subbands. Put longer high-resolution-noise and coding-gain derivations in starred optional material."
      - slug: adaptive-filters-and-lms
        title: Adaptive FIR Filters and the LMS Algorithm
        type: extra
        status: planned
        goal: Analyze LMS adaptation of an FIR filter through steepest descent, step-size stability, and misadjustment, and apply it to interference cancellation.
        opening: An adaptive filter replaces a fixed coefficient design by a recurrence on the coefficients themselves, and its convergence is governed by the input's autocorrelation.
        est_minutes: 40
        prerequisites:
          - impulse-response-and-convolution
          - correlation-psd-and-welch
        concepts:
          introduces:
            - adaptive-filter
            - lms-algorithm
          reinforces:
            - impulse-response
            - linear-convolution
            - autocorrelation
            - random-process
            - fir-filter
        key_ideas:
          - The Wiener solution minimizes mean-square error through the input autocorrelation and cross-correlation
          - LMS replaces the true gradient by its one-sample instantaneous estimate
          - Step size trades convergence speed against misadjustment and is bounded by input power
          - Adaptation tracks changing environments that a fixed design cannot
        demo: null
        notes: "Extra branch: no core lesson may require it. Anchor the scalar LMS derivation in Orfanidis §24.1 (in corpus); the FIR case and the noise-cancelling structure follow Widrow et al. 1975 (research/texts/widrow-1975-adaptive-noise.pdf), whose measured 60 Hz ECG cancellation links back to ecg-cleanup-under-morphology-constraints and whose speech application can run on audio-clips-v1."
      - slug: streaming-audio-resampling-and-subband-link
        title: Streaming Audio Resampling and Subband Link
        type: synthesis
        status: planned
        goal: Evaluate an end-to-end audio link under alias, rate, reconstruction, quantization, channel, computation, and latency constraints.
        opening: The course closes by placing sampling, filters, polyphase scheduling, filter banks, I/Q transport, and quantization inside one finite-buffer system.
        est_minutes: 40
        prerequisites:
          - analytic-signals-and-quadrature
          - quantization-dither-and-subband-allocation
          - finite-word-realizations
          - polyphase-rational-conversion
          - fast-convolution-and-streaming-blocks
        concepts:
          introduces: []
          reinforces:
            - multirate-system
            - aliasing
            - polyphase-decomposition
            - block-convolution
            - finite-wordlength
            - stft
            - subband-analysis
            - analytic-signal
            - quadrature-processing
            - quantization
            - dither
        key_ideas:
          - Rate and latency ledgers must close end to end
          - Polyphase work counts exclude discarded products
          - Oversampled subband analysis exposes where allocated quantization noise enters without requiring a perfect-reconstruction proof
          - Carrier and clock errors accumulate with filter delay
        demo: null
        notes: "APPLICATION — artifact: a rights-cleared speech/music clip passed through a 44.1↔48 kHz converter, an oversampled analysis/synthesis subband stage, and a noisy quadrature link. Results: multirate spectra, polyphase cost, measured subband recombination, I/Q transport, dither and bit allocation. Idealization gap: clock ratios, finite filters, coefficient rounding, packet overhead, synchronization, and perceptual distortion accumulate. Rigorous perfect-reconstruction-bank theory is optional enrichment, not a gate."

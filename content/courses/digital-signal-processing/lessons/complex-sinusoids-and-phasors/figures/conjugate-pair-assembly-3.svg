<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Conjugate-pair assembly, real sum</title>
  <desc id="desc">At a pi-over-four snapshot with peak amplitude two, unit-magnitude positive- and negative-frequency conjugate coefficients cancel their opposite imaginary coordinates and sum to the real value square root of two.</desc>
  <defs>
    <marker id="arrow-amber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#e2903a"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4c8dd6"/>
    </marker>
    <marker id="arrow-ink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="currentColor"/>
    </marker>
  </defs>
  <style>
    .ink { fill: currentColor; }
    .line { fill: none; stroke: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .amber { fill: #e2903a; }
    .blue { fill: #4c8dd6; }
    .ghost { opacity: 0.2; }
    .small { font-size: 11px; }
    .body { font-size: 12px; }
    .phone { display: none; }
    @media (max-width: 480px) {
      .desktop { display: none; }
      .phone { display: inline; }
      .phone text { font-size: 13px; }
      .phone > text:first-child { font-size: 14px; }
    }
  </style>

  <g class="desktop">
  <text class="ink" x="20" y="25" font-size="18" font-weight="700">Conjugate-pair assembly</text>
  <text class="muted" x="620" y="25" text-anchor="end" font-size="12">A = 2 · α = ωn + φ = π/4 snapshot</text>

  <rect x="20" y="42" width="600" height="45" rx="6" class="line" stroke-width="1" opacity="0.45"/>
  <text class="ink body" x="34" y="69" font-weight="650">engineering phasor P = Ae^(jφ)</text>
  <text class="amber body" x="294" y="69" text-anchor="middle" font-weight="650">C₊ = P/2</text>
  <text class="blue body" x="490" y="69" text-anchor="middle" font-weight="650">C₋ = P*/2</text>

  <!-- Fixed complex-plane scaffold. -->
  <g>
    <circle cx="170" cy="205" r="90" class="line" stroke-width="1.2" opacity="0.42"/>
    <line x1="42" y1="205" x2="332" y2="205" class="line" stroke-width="1.2"/>
    <line x1="170" y1="306" x2="170" y2="104" class="line" stroke-width="1.2"/>
    <text class="muted small" x="332" y="220" text-anchor="end">real</text>
    <text class="muted small" x="159" y="113" text-anchor="end">imaginary</text>
    <text class="muted small" x="176" y="220">0</text>
    <circle cx="170" cy="205" r="3" fill="currentColor"/>
  </g>

  <!-- Step 1: positive-frequency component, endpoint (1/sqrt(2), +1/sqrt(2)). -->
  <g id="positive-component">
    <line x1="233.64" y1="141.36" x2="233.64" y2="205" stroke="#e2903a" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.7"/>
    <line x1="170" y1="205" x2="233.64" y2="141.36" stroke="#e2903a" stroke-width="3" marker-end="url(#arrow-amber)"/>
    <path d="M220 205 A50 50 0 0 0 205.36 169.64" fill="none" stroke="#e2903a" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
    <circle cx="233.64" cy="141.36" r="4" fill="#e2903a"/>
    <text class="amber small" x="240" y="132" font-weight="650">e^(jπ/4)</text>

    <rect x="365" y="106" width="255" height="55" rx="6" fill="#e2903a" fill-opacity="0.08" stroke="#e2903a" stroke-width="1.3"/>
    <text class="amber body" x="379" y="124" font-weight="700">1 · positive component</text>
    <text class="ink small" x="379" y="141">C₊e^(jωn) · +ω · CCW</text>
    <text class="ink small" x="379" y="155">|C₊| = A/2 = 1 · Im = +1/√2</text>
  </g>

  <!-- Step 2: conjugate remains active. -->
  <g id="negative-component">
    <line x1="233.64" y1="268.64" x2="233.64" y2="205" stroke="#4c8dd6" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.7"/>
    <line x1="170" y1="205" x2="233.64" y2="268.64" stroke="#4c8dd6" stroke-width="3" marker-end="url(#arrow-blue)"/>
    <path d="M220 205 A50 50 0 0 1 205.36 240.36" fill="none" stroke="#4c8dd6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
    <circle cx="233.64" cy="268.64" r="4" fill="#4c8dd6"/>
    <text class="blue small" x="240" y="284" font-weight="650">e^(−jπ/4)</text>

    <rect x="365" y="172" width="255" height="55" rx="6" fill="#4c8dd6" fill-opacity="0.08" stroke="#4c8dd6" stroke-width="1.3"/>
    <text class="blue body" x="379" y="190" font-weight="700">2 · negative conjugate</text>
    <text class="ink small" x="379" y="207">C₋e^(−jωn) · −ω · CW</text>
    <text class="ink small" x="379" y="221">C₋ = C₊* · |C₋| = 1 · Im = −1/√2</text>
  </g>

  <!-- Step 3: activate only the real-result group relative to frame 2. -->
  <g id="real-sum">
    <line x1="170" y1="205" x2="297.28" y2="205" stroke="currentColor" stroke-width="4" marker-end="url(#arrow-ink)"/>
    <circle cx="297.28" cy="205" r="4" fill="currentColor"/>
    <text class="ink small" x="301" y="195" font-weight="700">√2 real</text>

    <rect x="365" y="238" width="255" height="67" rx="6" fill="currentColor" fill-opacity="0.035" stroke="currentColor" stroke-width="1.3"/>
    <text class="ink body" x="379" y="256" font-weight="700">3 · real cosine</text>
    <text class="ink small" x="379" y="273">x[n] = 2 cos(α) = √2</text>
    <text class="ink small" x="379" y="288">Im: +1/√2 − 1/√2 = 0</text>
    <text class="ink small" x="379" y="301">|C₊| + |C₋| = 1 + 1 = A</text>
  </g>
  </g>

  <!-- Phone composition: 320 x 165 design units scaled to the shared 640 x 330 canvas. -->
  <g class="phone" transform="scale(2)" aria-hidden="true">
    <text class="ink" x="8" y="15" font-size="12" font-weight="700">Conjugate pair</text>
    <text class="muted" x="312" y="15" text-anchor="end" font-size="11">A=2 · α=π/4</text>

    <rect x="8" y="19" width="304" height="34" rx="4" class="line" stroke-width="0.8" opacity="0.45"/>
    <text class="ink" x="16" y="33" font-size="11" font-weight="650">P = Ae^(jφ)</text>
    <text class="amber" x="106" y="33" font-size="11" font-weight="650">C₊ = P/2</text>
    <text class="blue" x="192" y="33" font-size="11" font-weight="650">C₋ = P*/2</text>
    <text class="blue" x="16" y="47" font-size="11" font-weight="650">C₋ = C₊*</text>
    <text class="ink" x="102" y="47" font-size="11">each |C| = A/2 = 1</text>

    <g>
      <circle cx="68" cy="108" r="36" class="line" stroke-width="0.8" opacity="0.42"/>
      <line x1="20" y1="108" x2="132" y2="108" class="line" stroke-width="0.9"/>
      <line x1="68" y1="64" x2="68" y2="152" class="line" stroke-width="0.9"/>
      <text class="muted" x="131" y="121" text-anchor="end" font-size="11">real</text>
      <circle cx="68" cy="108" r="2" fill="currentColor"/>
    </g>

    <g>
      <line x1="68" y1="108" x2="93.46" y2="82.54" stroke="#e2903a" stroke-width="2" marker-end="url(#arrow-amber)"/>
      <path d="M88 108 A20 20 0 0 0 82.14 93.86" fill="none" stroke="#e2903a" stroke-width="1.2" marker-end="url(#arrow-amber)"/>
      <text class="amber" x="98" y="79" font-size="11" font-weight="650">+π/4</text>
      <rect x="142" y="61" width="170" height="28" rx="4" fill="#e2903a" fill-opacity="0.08" stroke="#e2903a" stroke-width="0.9"/>
      <text class="amber" x="150" y="73" font-size="11" font-weight="700">+ω · CCW · C₊</text>
      <text class="ink" x="150" y="85" font-size="11">|C₊|=1 · Im=+1/√2</text>
    </g>

    <g>
      <line x1="68" y1="108" x2="93.46" y2="133.46" stroke="#4c8dd6" stroke-width="2" marker-end="url(#arrow-blue)"/>
      <path d="M88 108 A20 20 0 0 1 82.14 122.14" fill="none" stroke="#4c8dd6" stroke-width="1.2" marker-end="url(#arrow-blue)"/>
      <text class="blue" x="98" y="143" font-size="11" font-weight="650">−π/4</text>
      <rect x="142" y="94" width="170" height="28" rx="4" fill="#4c8dd6" fill-opacity="0.08" stroke="#4c8dd6" stroke-width="0.9"/>
      <text class="blue" x="150" y="106" font-size="11" font-weight="700">−ω · CW · C₋</text>
      <text class="ink" x="150" y="118" font-size="11">|C₋|=1 · Im=−1/√2</text>
    </g>

    <g>
      <line x1="68" y1="108" x2="118.91" y2="108" stroke="currentColor" stroke-width="2.6" marker-end="url(#arrow-ink)"/>
      <text class="ink" x="123" y="103" font-size="11" font-weight="700">√2</text>
      <rect x="142" y="127" width="170" height="30" rx="4" fill="currentColor" fill-opacity="0.035" stroke="currentColor" stroke-width="0.9"/>
      <text class="ink" x="150" y="139" font-size="11" font-weight="700">real cosine · √2</text>
      <text class="ink" x="150" y="152" font-size="11">Im: +1/√2 − 1/√2 = 0</text>
    </g>
  </g>
</svg>

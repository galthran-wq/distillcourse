<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Quarter-turn phasor and its synchronized projections</title>
  <desc id="desc">The unit complex mode exp j pi n over two advances counterclockwise through 1, j, minus 1, and minus j at n equals 0 through 3. Separate unconnected stem plots show its real cosine samples 1, 0, minus 1, 0 and imaginary sine samples 0, 1, 0, minus 1. Its magnitude is one at every sample.</desc>
  <style>
    .ink { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.58; }
    .axis { fill: none; stroke: currentColor; stroke-opacity: 0.45; }
    .orbit { fill: none; stroke: currentColor; stroke-opacity: 0.58; }
    .spoke { fill: none; stroke: currentColor; stroke-opacity: 0.38; }
    .guide { fill: none; stroke: currentColor; stroke-opacity: 0.14; stroke-dasharray: 3 4; }
    .panel { fill: currentColor; fill-opacity: 0.035; stroke: currentColor; stroke-opacity: 0.14; }
    .amber { fill: #e2903a; }
    .amber-stroke { fill: none; stroke: #e2903a; }
    .blue { fill: #4c8dd6; }
    .blue-stroke { fill: none; stroke: #4c8dd6; }
    .mobile-layout { display: none; }
    @media (max-width: 480px) {
      .desktop-layout { display: none; }
      .mobile-layout { display: inline; }
    }
  </style>
  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="currentColor"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#e2903a"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#4c8dd6"/>
    </marker>
  </defs>

  <g class="desktop-layout">
  <text class="ink" x="20" y="23" font-size="17" font-weight="760">quarter-turn mode</text>
  <text class="muted" x="20" y="43" font-size="12.5">z[n] = exp(jπn/2) · ω = π/2 rad/sample</text>

  <g aria-label="Unit-circle orbit through four integer samples">
    <circle class="orbit" cx="145" cy="166" r="67" stroke-width="1.6"/>
    <line class="axis" x1="61" y1="166" x2="229" y2="166" stroke-width="1.2"/>
    <line class="axis" x1="145" y1="82" x2="145" y2="250" stroke-width="1.2"/>

    <line class="spoke" x1="145" y1="166" x2="212" y2="166" stroke-width="2"/>
    <line class="spoke" x1="145" y1="166" x2="145" y2="99" stroke-width="2"/>
    <line class="spoke" x1="145" y1="166" x2="78" y2="166" stroke-width="2"/>
    <line class="spoke" x1="145" y1="166" x2="145" y2="233" stroke-width="2"/>

    <circle cx="212" cy="166" r="4.5" fill="currentColor"/>
    <circle cx="145" cy="99" r="4.5" fill="currentColor"/>
    <circle cx="78" cy="166" r="4.5" fill="currentColor"/>
    <circle cx="145" cy="233" r="4.5" fill="currentColor"/>

    <g class="ink" font-size="12" font-weight="720">
      <text x="225" y="158">n=0 · 1</text>
      <text x="145" y="70" text-anchor="middle">n=1 · j</text>
      <text x="65" y="158" text-anchor="end">n=2 · −1</text>
      <text x="145" y="258" text-anchor="middle">n=3 · −j</text>
    </g>
    <g class="muted" font-size="10.5">
      <text x="225" y="174">φ=0</text>
      <text x="145" y="84" text-anchor="middle">φ=π/2</text>
      <text x="65" y="174" text-anchor="end">φ=+π</text>
      <text x="145" y="273" text-anchor="middle">φ=−π/2</text>
    </g>

    <path d="M211 166 A66 66 0 0 0 181 109" fill="none" stroke="currentColor" stroke-width="1.8" marker-end="url(#arrow-ink)"/>
    <text class="ink" x="205" y="139" text-anchor="middle" font-size="10.5" font-weight="680">counterclockwise</text>
  </g>

  <g aria-label="Projection cues">
    <text class="amber" x="274" y="91" text-anchor="middle" font-size="10.5" font-weight="680">horizontal</text>
    <line class="amber-stroke" x1="247" y1="99" x2="294" y2="99" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrow-amber)"/>
    <text class="blue" x="269" y="192" text-anchor="end" font-size="10.5" font-weight="680">vertical</text>
    <path d="M277 166V190H294" class="blue-stroke" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrow-blue)"/>
  </g>

  <g aria-label="Real cosine projection stem plot">
    <rect class="panel" x="299" y="51" width="326" height="110" rx="6"/>
    <text class="amber" x="310" y="70" font-size="13" font-weight="760">Re · cosine</text>
    <text class="amber" x="615" y="70" text-anchor="end" font-size="11.5" font-weight="680">[1, 0, −1, 0] · round dots</text>

    <line class="guide" x1="332" y1="82" x2="612" y2="82"/>
    <line class="axis" x1="332" y1="115" x2="612" y2="115" stroke-width="1.2"/>
    <line class="guide" x1="332" y1="148" x2="612" y2="148"/>
    <g class="muted" font-size="10" text-anchor="end">
      <text x="326" y="86">+1</text>
      <text x="326" y="119">0</text>
      <text x="326" y="152">−1</text>
    </g>

    <g class="guide">
      <line x1="348" y1="78" x2="348" y2="269"/>
      <line x1="432" y1="78" x2="432" y2="269"/>
      <line x1="516" y1="78" x2="516" y2="269"/>
      <line x1="600" y1="78" x2="600" y2="269"/>
    </g>
    <g class="amber-stroke" stroke-width="2.6" stroke-linecap="round">
      <line x1="348" y1="115" x2="348" y2="82"/>
      <line x1="516" y1="115" x2="516" y2="148"/>
    </g>
    <g class="amber" aria-label="Samples 1, 0, minus 1, 0">
      <circle cx="348" cy="82" r="4.2"/>
      <circle cx="432" cy="115" r="4.2"/>
      <circle cx="516" cy="148" r="4.2"/>
      <circle cx="600" cy="115" r="4.2"/>
    </g>
  </g>

  <g aria-label="Imaginary sine projection stem plot">
    <rect class="panel" x="299" y="169" width="326" height="111" rx="6"/>
    <text class="blue" x="310" y="188" font-size="13" font-weight="760">Im · sine</text>
    <text class="blue" x="615" y="188" text-anchor="end" font-size="11.5" font-weight="680">[0, 1, 0, −1] · square dots</text>

    <line class="guide" x1="332" y1="200" x2="612" y2="200"/>
    <line class="axis" x1="332" y1="233" x2="612" y2="233" stroke-width="1.2"/>
    <line class="guide" x1="332" y1="266" x2="612" y2="266"/>
    <g class="muted" font-size="10" text-anchor="end">
      <text x="326" y="204">+1</text>
      <text x="326" y="237">0</text>
      <text x="326" y="270">−1</text>
    </g>
    <g class="blue-stroke" stroke-width="2.6" stroke-linecap="square">
      <line x1="432" y1="233" x2="432" y2="200"/>
      <line x1="600" y1="233" x2="600" y2="266"/>
    </g>
    <g class="blue" aria-label="Samples 0, 1, 0, minus 1">
      <rect x="344" y="229" width="8" height="8"/>
      <rect x="428" y="196" width="8" height="8"/>
      <rect x="512" y="229" width="8" height="8"/>
      <rect x="596" y="262" width="8" height="8"/>
    </g>
    <g class="muted" font-size="10.5" text-anchor="middle">
      <text x="348" y="294">n=0</text>
      <text x="432" y="294">n=1</text>
      <text x="516" y="294">n=2</text>
      <text x="600" y="294">n=3</text>
    </g>
  </g>

  <rect x="174" y="304" width="292" height="29" rx="6" fill="currentColor" fill-opacity="0.045" stroke="currentColor" stroke-opacity="0.2"/>
  <text class="ink" x="320" y="324" text-anchor="middle" font-size="14" font-weight="760">|z[n]|=1 at every n</text>
  </g>

  <g class="mobile-layout" aria-label="Phone layout of the quarter-turn orbit and its projections">
    <text class="ink" x="20" y="30" font-size="30" font-weight="760">quarter-turn mode</text>
    <text class="muted" x="20" y="65" font-size="26">ω = π/2 rad/sample</text>

    <g aria-label="Unit-circle orbit through 1, j, minus 1, and minus j">
      <circle class="orbit" cx="145" cy="181" r="56" stroke-width="2.6"/>
      <line class="axis" x1="72" y1="181" x2="218" y2="181" stroke-width="2"/>
      <line class="axis" x1="145" y1="108" x2="145" y2="254" stroke-width="2"/>
      <line class="spoke" x1="145" y1="181" x2="201" y2="181" stroke-width="3"/>
      <line class="spoke" x1="145" y1="181" x2="145" y2="125" stroke-width="3"/>
      <line class="spoke" x1="145" y1="181" x2="89" y2="181" stroke-width="3"/>
      <line class="spoke" x1="145" y1="181" x2="145" y2="237" stroke-width="3"/>
      <circle cx="201" cy="181" r="6" fill="currentColor"/>
      <circle cx="145" cy="125" r="6" fill="currentColor"/>
      <circle cx="89" cy="181" r="6" fill="currentColor"/>
      <circle cx="145" cy="237" r="6" fill="currentColor"/>
      <path d="M198 181 A54 54 0 0 0 174 134" fill="none" stroke="currentColor" stroke-width="3" marker-end="url(#arrow-ink)"/>
      <text class="ink" x="145" y="96" text-anchor="middle" font-size="26" font-weight="680">counterclockwise</text>
      <g class="ink" font-size="26" font-weight="720">
        <text x="145" y="127" text-anchor="middle">n=1 · j</text>
        <text x="203" y="176">n=0 · 1</text>
        <text x="15" y="170">n=2</text>
        <text x="15" y="205">−1 · φ=+π</text>
        <text x="145" y="270" text-anchor="middle">n=3 · −j</text>
      </g>
    </g>

    <line class="amber-stroke" x1="264" y1="149" x2="302" y2="149" stroke-width="3" stroke-dasharray="5 4" marker-end="url(#arrow-amber)"/>
    <line class="blue-stroke" x1="264" y1="278" x2="302" y2="278" stroke-width="3" stroke-dasharray="5 4" marker-end="url(#arrow-blue)"/>

    <g aria-label="Real cosine projection 1, 0, minus 1, 0">
      <text class="amber" x="310" y="76" font-size="26" font-weight="760">Re · cosine</text>
      <text class="amber" x="310" y="110" font-size="26" font-weight="680">[1, 0, −1, 0]</text>
      <line class="guide" x1="345" y1="129" x2="620" y2="129"/>
      <line class="axis" x1="345" y1="149" x2="620" y2="149" stroke-width="2"/>
      <line class="guide" x1="345" y1="169" x2="620" y2="169"/>
      <g class="amber-stroke" stroke-width="4" stroke-linecap="round">
        <line x1="365" y1="149" x2="365" y2="129"/><line x1="525" y1="149" x2="525" y2="169"/>
      </g>
      <g class="amber">
        <circle cx="365" cy="129" r="6"/><circle cx="445" cy="149" r="6"/><circle cx="525" cy="169" r="6"/><circle cx="605" cy="149" r="6"/>
      </g>
    </g>

    <g aria-label="Imaginary sine projection 0, 1, 0, minus 1">
      <text class="blue" x="310" y="205" font-size="26" font-weight="760">Im · sine</text>
      <text class="blue" x="310" y="239" font-size="26" font-weight="680">[0, 1, 0, −1]</text>
      <line class="guide" x1="345" y1="258" x2="620" y2="258"/>
      <line class="axis" x1="345" y1="278" x2="620" y2="278" stroke-width="2"/>
      <line class="guide" x1="345" y1="298" x2="620" y2="298"/>
      <g class="blue-stroke" stroke-width="4" stroke-linecap="square">
        <line x1="445" y1="278" x2="445" y2="258"/><line x1="605" y1="278" x2="605" y2="298"/>
      </g>
      <g class="blue">
        <rect x="359" y="272" width="12" height="12"/><rect x="439" y="252" width="12" height="12"/><rect x="519" y="272" width="12" height="12"/><rect x="599" y="292" width="12" height="12"/>
      </g>
      <g class="muted" font-size="26" text-anchor="middle">
        <text x="365" y="329">n=0</text><text x="445" y="329">n=1</text><text x="525" y="329">n=2</text><text x="605" y="329">n=3</text>
      </g>
    </g>

    <rect x="43" y="299" width="204" height="36" rx="8" fill="currentColor" fill-opacity="0.045" stroke="currentColor" stroke-opacity="0.2"/>
    <text class="ink" x="145" y="326" text-anchor="middle" font-size="26" font-weight="760">|z[n]|=1</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 330" role="img" aria-labelledby="correlation-to-psd-2-title correlation-to-psd-2-desc" data-mobile-scroll="welch-estimation">
  <title id="correlation-to-psd-2-title">Lag-one alignment leaves five products</title>
  <desc id="correlation-to-psd-2-desc">The lower record shifts by one sample; five pairs remain and the two unpaired endpoints are dimmed.</desc>
  <g font-family="system-ui, sans-serif" fill="currentColor">
    <text x="28" y="31" font-size="16" font-weight="700">2 · shift only the lower row to lag 1</text>
    <text x="28" y="53" font-size="12" opacity=".62">one endpoint pair disappears · five products survive</text>
    <line x1="58" y1="112" x2="408" y2="112" stroke="currentColor" stroke-width="1.5" opacity=".35"/>
    <line x1="58" y1="222" x2="408" y2="222" stroke="currentColor" stroke-width="1.5" opacity=".35"/>
    <text x="28" y="95" font-size="12" fill="#e2903a" font-weight="700">x[n]</text>
    <text x="28" y="205" font-size="12" fill="#4c8dd6" font-weight="700">x*[n−1]</text>
    <text x="455" y="93" font-size="12" font-weight="700">lag estimate</text>
    <rect x="446" y="104" width="145" height="92" rx="8" fill="none" stroke="currentColor" opacity=".2"/>
    <text x="518" y="132" text-anchor="middle" font-size="12" opacity=".55">not accumulated yet</text>
    <text x="518" y="158" text-anchor="middle" font-size="16" fill="#e2903a" font-weight="700">r̂[1]</text>
    <text x="518" y="181" text-anchor="middle" font-size="12">5 products ÷ N</text>
    <g fill="#e2903a"><circle cx="88" cy="112" r="6" opacity=".2"/><circle cx="148" cy="112" r="6"/><circle cx="208" cy="112" r="6"/><circle cx="268" cy="112" r="6"/><circle cx="328" cy="112" r="6"/><circle cx="388" cy="112" r="6"/></g>
    <g fill="#4c8dd6"><circle cx="88" cy="222" r="6"/><circle cx="148" cy="222" r="6"/><circle cx="208" cy="222" r="6"/><circle cx="268" cy="222" r="6"/><circle cx="328" cy="222" r="6"/><circle cx="388" cy="222" r="6" opacity=".2"/></g>
    <g stroke="currentColor" stroke-width="2" opacity=".72">
      <line x1="148" y1="122" x2="88" y2="212"/><line x1="208" y1="122" x2="148" y2="212"/><line x1="268" y1="122" x2="208" y2="212"/><line x1="328" y1="122" x2="268" y2="212"/><line x1="388" y1="122" x2="328" y2="212"/>
    </g>
    <path d="M92 244 H384" stroke="#4c8dd6" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="238" y="274" text-anchor="middle" font-size="13">available count is N − 1</text>
    <text x="238" y="297" text-anchor="middle" font-size="12" opacity=".58">the denominator remains N under the biased convention</text>
  </g>
</svg>

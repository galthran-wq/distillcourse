<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 330" role="img" aria-labelledby="correlation-to-psd-4-title correlation-to-psd-4-desc" data-mobile-scroll="welch-estimation">
  <title id="correlation-to-psd-4-title">Estimated lags transform to an estimated spectrum</title>
  <desc id="correlation-to-psd-4-desc">Mirrored estimated autocorrelation lags transform by a DTFT into an estimated PSD, while population autocorrelation and PSD remain separately labeled ensemble objects.</desc>
  <defs><marker id="a4" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#5aa46a"/></marker></defs>
  <g font-family="system-ui, sans-serif" fill="currentColor">
    <text x="28" y="31" font-size="16" font-weight="700">4 · transform the lag sequence</text>
    <text x="28" y="53" font-size="12" opacity=".62">hats stay on estimates · population objects stay separate</text>
    <line x1="58" y1="112" x2="408" y2="112" stroke="currentColor" stroke-width="1.5" opacity=".35"/><line x1="58" y1="222" x2="408" y2="222" stroke="currentColor" stroke-width="1.5" opacity=".35"/>
    <text x="28" y="95" font-size="12" fill="#e2903a" font-weight="700">x[n]</text><text x="28" y="205" font-size="12" fill="#4c8dd6" font-weight="700">x*[n−1]</text>
    <g fill="#e2903a"><circle cx="88" cy="112" r="6" opacity=".2"/><circle cx="148" cy="112" r="6"/><circle cx="208" cy="112" r="6"/><circle cx="268" cy="112" r="6"/><circle cx="328" cy="112" r="6"/><circle cx="388" cy="112" r="6"/></g>
    <g fill="#4c8dd6"><circle cx="88" cy="222" r="6"/><circle cx="148" cy="222" r="6"/><circle cx="208" cy="222" r="6"/><circle cx="268" cy="222" r="6"/><circle cx="328" cy="222" r="6"/><circle cx="388" cy="222" r="6" opacity=".2"/></g>
    <g stroke="currentColor" stroke-width="2" opacity=".35"><line x1="148" y1="122" x2="88" y2="212"/><line x1="208" y1="122" x2="148" y2="212"/><line x1="268" y1="122" x2="208" y2="212"/><line x1="328" y1="122" x2="268" y2="212"/><line x1="388" y1="122" x2="328" y2="212"/></g>
    <g transform="translate(62 270)"><line x1="0" y1="0" x2="230" y2="0" stroke="currentColor" opacity=".35"/><circle cx="20" cy="3" r="4" fill="#e2903a"/><circle cx="65" cy="-12" r="4" fill="#e2903a"/><circle cx="110" cy="-24" r="5" fill="#e2903a"/><circle cx="155" cy="-12" r="4" fill="#e2903a"/><circle cx="200" cy="3" r="4" fill="#e2903a"/><text x="110" y="24" text-anchor="middle" font-size="12" fill="#e2903a" font-weight="700">estimated lags r̂[ℓ]</text></g>
    <path d="M310 270 H388" stroke="#5aa46a" stroke-width="2.2" marker-end="url(#a4)"/><text x="349" y="255" text-anchor="middle" font-size="12" fill="#5aa46a" font-weight="700">DTFT</text>
    <g transform="translate(408 220)"><line x1="0" y1="60" x2="170" y2="60" stroke="currentColor" opacity=".35"/><path d="M0 51 C24 47 30 15 48 20 C69 27 76 44 94 40 C112 36 117 11 136 17 C151 21 159 43 170 47" fill="none" stroke="#5aa46a" stroke-width="3"/><text x="85" y="84" text-anchor="middle" font-size="12" fill="#5aa46a" font-weight="700">estimated PSD Ŝ(f)</text></g>
    <rect x="441" y="77" width="143" height="104" rx="8" fill="none" stroke="currentColor" opacity=".22"/><text x="512" y="102" text-anchor="middle" font-size="12" font-weight="700">population pair</text><text x="512" y="128" text-anchor="middle" font-size="13">r[ℓ] ↔ S(f)</text><text x="512" y="151" text-anchor="middle" font-size="12" opacity=".58">ensemble quantities</text><text x="512" y="171" text-anchor="middle" font-size="12" opacity=".58">WSS model required</text>
  </g>
</svg>

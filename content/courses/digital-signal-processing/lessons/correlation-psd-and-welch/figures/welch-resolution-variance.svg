<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" role="img" aria-labelledby="welch-resolution-variance-title welch-resolution-variance-desc" data-mobile-scroll="welch-estimation">
  <title id="welch-resolution-variance-title">Welch resolution and variance frontier</title>
  <desc id="welch-resolution-variance-desc">Frozen Welch settings plot Hann equivalent noise bandwidth against empirical coefficient of variation. Resolution status comes from the declared two-peak and one-decibel-valley test: segment lengths 64 through 4096 separate the tones, while length 32 merges them. Joint acceptance additionally requires coefficient of variation below 0.30, so length 4096 fails variability.</desc>
  <g font-family="system-ui, sans-serif" fill="currentColor">
    <text x="28" y="28" font-size="17" font-weight="750">Resolution and variance set a two-sided target</text>
    <text x="28" y="49" font-size="12" opacity=".62">N=16,384 · periodic Hann · 96 seeded complex-noise trials · CV probed at f=0.3125</text>
    <rect x="85" y="140" width="450" height="190" fill="#5aa46a" opacity=".07"/>
    <text x="99" y="161" font-size="12" fill="#5aa46a" font-weight="750">green band = CV PASS; ✓ also passes resolution</text>
    <g stroke="currentColor" opacity=".1">
      <line x1="85" x2="535" y1="330" y2="330"/><line x1="85" x2="535" y1="266.7" y2="266.7"/><line x1="85" x2="535" y1="203.3" y2="203.3"/><line x1="85" x2="535" y1="140" y2="140"/><line x1="85" x2="535" y1="76.7" y2="76.7"/>
      <line x1="85" x2="85" y1="65" y2="330"/><line x1="182.9" x2="182.9" y1="65" y2="330"/><line x1="280.8" x2="280.8" y1="65" y2="330"/><line x1="378.6" x2="378.6" y1="65" y2="330"/><line x1="476.5" x2="476.5" y1="65" y2="330"/>
    </g>
    <line x1="85" x2="535" y1="330" y2="330" stroke="currentColor" stroke-width="1.4"/><line x1="85" x2="85" y1="65" y2="330" stroke="currentColor" stroke-width="1.4"/>
    <line x1="85" x2="535" y1="140" y2="140" stroke="#e2903a" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="531" y="132" text-anchor="end" font-size="12" fill="#e2903a" font-weight="750">CV &lt; 0.30</text>
    <line x1="500.6" x2="500.6" y1="65" y2="330" stroke="#4c8dd6" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="493" y="84" text-anchor="end" font-size="12" fill="#4c8dd6" font-weight="750">tone spacing Δf = 0.04</text>
    <text x="493" y="101" text-anchor="end" font-size="12" fill="#4c8dd6">reference scale, not a pass boundary</text>
    <g font-size="12" opacity=".62" text-anchor="end"><text x="76" y="334">0.00</text><text x="76" y="271">0.10</text><text x="76" y="207">0.20</text><text x="76" y="144">0.30</text><text x="76" y="81">0.40</text></g>
    <g font-size="12" opacity=".62" text-anchor="middle"><text x="85" y="352">0.0003</text><text x="182.9" y="352">0.001</text><text x="280.8" y="352">0.003</text><text x="378.6" y="352">0.01</text><text x="476.5" y="352">0.03</text></g>
    <text x="310" y="390" text-anchor="middle" font-size="13" fill="#4c8dd6" font-weight="700">Hann ENBW (cycles/sample) → broader</text>
    <text x="85" y="63" font-size="13" fill="#e2903a" font-weight="700">empirical CV at noise-only bin ↑</text>
    <path d="M101.9 74.8 L160.8 160.8 L278.6 250.1 L396.3 291.7 L455.2 301.1 L514 308" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 4" opacity=".48"/>
    <g fill="#5aa46a" stroke="#5aa46a" stroke-width="2">
      <circle cx="455.2" cy="301.1" r="6"/><rect x="390.3" y="285.7" width="12" height="12" rx="1"/><path d="M278.6 243.1 l7 7 -7 7 -7 -7z"/><path d="M160.8 153.8 l7 14 h-14z"/>
    </g>
    <g fill="none" stroke="currentColor" stroke-width="2.2"><path d="M95.9 68.8 l12 12 M107.9 68.8 l-12 12"/><path d="M508 302 l12 12 M520 302 l-12 12"/></g>
    <path d="M106 80 L116 88" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".65"/>
    <text x="116" y="94" font-size="12" text-anchor="start" font-weight="750">M=4096 · separated</text>
    <text x="116" y="110" font-size="12" text-anchor="start" font-weight="750">CV 0.403 FAIL</text>
    <text x="171" y="181" font-size="12" fill="#5aa46a" font-weight="750">M=2048 · 0.267 ✓</text>
    <text x="387" y="280" font-size="12" text-anchor="end" fill="#5aa46a" font-weight="750">M=128 · 0.060 ✓</text>
    <text x="450" y="320" font-size="12" text-anchor="end" fill="#5aa46a" font-weight="750">M=64 · 0.046 ✓</text>
    <path d="M514 302 L520 270" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".65"/>
    <text x="520" y="250" font-size="12" font-weight="750">M=32 · merged</text>
    <text x="520" y="266" font-size="12" font-weight="750">resolution FAIL</text>
    <g font-size="12" font-weight="700"><text x="291" y="204">M=512 · separated</text><circle cx="278.6" cy="217.1" r="5" fill="none" stroke="currentColor" stroke-width="2"/><text x="291" y="220">0% · CV 0.178 ✓</text><circle cx="278.6" cy="241.2" r="5" fill="none" stroke="#4c8dd6" stroke-width="2"/><text x="291" y="244" fill="#4c8dd6">50% · CV 0.140 ✓</text><circle cx="278.6" cy="250.1" r="5" fill="#5aa46a"/><text x="291" y="264" fill="#5aa46a">75% · CV 0.126 ✓</text></g>
    <text x="91" y="410" font-size="12" opacity=".6">Point shape identifies M; ✓/✕ duplicates pass status. Frozen source: welch-study.mjs.</text>
  </g>
</svg>

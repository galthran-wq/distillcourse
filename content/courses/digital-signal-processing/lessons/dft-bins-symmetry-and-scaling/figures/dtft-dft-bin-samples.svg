<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" role="img" aria-labelledby="title desc">
  <title id="title">The DFT samples one period of a finite record's DTFT</title>
  <desc id="desc">For the eight-sample record x of n equals negative one to the n, an amber DTFT magnitude curve is sampled at eight equally spaced blue DFT bins. Only bin four is nonzero, with magnitude eight. A lower ledger maps the bins to signed frequencies when the sampling rate is eight kilohertz.</desc>
  <style>
    .mobile-layout { display: none; }
    @media (max-width: 420px) {
      .desktop-layout { display: none; }
      .mobile-layout { display: inline; }
    }
  </style>

  <g class="desktop-layout">

  <g id="plot-axes" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <line x1="60" y1="220" x2="590" y2="220" stroke-width="1.5"/>
    <line x1="60" y1="220" x2="60" y2="62" stroke-width="1.5"/>
    <line x1="56" y1="70" x2="64" y2="70" opacity="0.65"/>
    <line x1="56" y1="145" x2="590" y2="145" opacity="0.12" stroke-dasharray="3 5"/>
    <line x1="60" y1="216" x2="60" y2="224"/>
    <line x1="325" y1="216" x2="325" y2="224"/>
    <line x1="590" y1="216" x2="590" y2="224"/>
  </g>

  <g fill="currentColor" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text id="record-heading" x="44" y="27" font-size="16" font-weight="700">DFT bins sample a record DTFT</text>
    <text x="596" y="27" text-anchor="end" font-size="13" font-weight="600">N = 8 · x[n] = (−1)ⁿ · n = 0,…,7</text>

    <line x1="45" y1="49" x2="73" y2="49" stroke="#e2903a" stroke-width="3"/>
    <text x="81" y="53" font-size="13">record DTFT |X₈(eʲω)|</text>
    <line x1="309" y1="56" x2="309" y2="42" stroke="#4c8dd6" stroke-width="2"/>
    <circle cx="309" cy="42" r="3.5" fill="#4c8dd6"/>
    <text x="319" y="53" font-size="13">DFT samples X[k]</text>

    <text x="46" y="75" text-anchor="end" font-size="12">8</text>
    <text x="46" y="224" text-anchor="end" font-size="12">0</text>
    <text x="18" y="151" text-anchor="middle" font-size="12" font-weight="600" transform="rotate(-90 18 151)">magnitude</text>
  </g>


,208.0 L470.8,205.5 L473.4,203.3 L476.1,201.5 L478.7,200.0 L481.4,198.8 L484.0,198.0 L486.6,197.5 L489.3,197.4 L491.9,197.6 L494.6,198.2 L497.3,199.1 L499.9,200.3 L502.6,201.8 L505.2,203.5 L507.9,205.5 L510.5,207.6 L513.1,209.9 L515.8,212.4 L518.5,214.9 L521.1,217.4 L523.8,220.0 L526.4,217.5 L529.0,215.0 L531.7,212.7 L534.4,210.5 L537.0,208.4 L539.6,206.6 L542.3,205.0 L545.0,203.6 L547.6,202.5 L550.3,201.7 L552.9,201.1 L555.5,200.9 L558.2,200.9 L560.9,201.3 L563.5,201.9 L566.1,202.9 L568.8,204.0 L571.5,205.5 L574.1,207.1 L576.8,208.9 L579.4,210.9 L582.0,213.1 L584.7,215.3 L587.4,217.6 L590.0,220.0" fill="none" stroke="#e2903a" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"/>
  <g id="periodic-continuations" fill="none" stroke="#e2903a" stroke-width="2.25" stroke-linecap="round" opacity="0.38" stroke-dasharray="3 4">
    <path d="M44 205 Q52 210 60 220"/>
    <path d="M590 220 Q598 210 606 205"/>
  </g>

  <g id="dft-stems" fill="none" stroke="#4c8dd6" stroke-width="2.25">
    <line x1="60" y1="220" x2="60" y2="220"/>
    <line x1="126.25" y1="220" x2="126.25" y2="220"/>
    <line x1="192.5" y1="220" x2="192.5" y2="220"/>
    <line x1="258.75" y1="220" x2="258.75" y2="220"/>
    <line x1="325" y1="220" x2="325" y2="70"/>
    <line x1="391.25" y1="220" x2="391.25" y2="220"/>
    <line x1="457.5" y1="220" x2="457.5" y2="220"/>
    <line x1="523.75" y1="220" x2="523.75" y2="220"/>
  </g>
  <g id="dft-dots" fill="#4c8dd6" stroke="currentColor" stroke-width="0.7">
    <circle cx="60" cy="220" r="4.2"/>
    <circle cx="126.25" cy="220" r="4.2"/>
    <circle cx="192.5" cy="220" r="4.2"/>
    <circle cx="258.75" cy="220" r="4.2"/>
    <circle cx="325" cy="70" r="4.8"/>
    <circle cx="391.25" cy="220" r="4.2"/>
    <circle cx="457.5" cy="220" r="4.2"/>
    <circle cx="523.75" cy="220" r="4.2"/>
  </g>

  <g fill="currentColor" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <path d="M337 78 L330 73" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="341" y="84" font-size="13" font-weight="700">X[4] = 8</text>

    <text x="60" y="239" text-anchor="middle" font-size="12">0</text>
    <text x="325" y="239" text-anchor="middle" font-size="12">π</text>
    <text x="590" y="239" text-anchor="middle" font-size="12">2π</text>
    <text x="590" y="184" text-anchor="end" font-size="12" font-weight="600">ω (rad/sample)</text>

    <text x="42" y="262" text-anchor="end" font-size="12" font-weight="700">k</text>
    <text x="60" y="262" text-anchor="middle" font-size="12">0</text>
    <text x="126.25" y="262" text-anchor="middle" font-size="12">1</text>
    <text x="192.5" y="262" text-anchor="middle" font-size="12">2</text>
    <text x="258.75" y="262" text-anchor="middle" font-size="12">3</text>
    <text x="325" y="262" text-anchor="middle" font-size="12" font-weight="700">4</text>
    <text x="391.25" y="262" text-anchor="middle" font-size="12">5</text>
    <text x="457.5" y="262" text-anchor="middle" font-size="12">6</text>
    <text x="523.75" y="262" text-anchor="middle" font-size="12">7</text>

    <rect x="43" y="273" width="554" height="51" rx="7" fill="currentColor" opacity="0.055"/>
    <text x="57" y="289" font-size="12" font-weight="600">ωₖ = 2πk/8</text>
    <text x="583" y="289" text-anchor="end" font-size="11.5">0 and 2π are the same periodic coordinate</text>
    <text x="57" y="305" font-size="11.5">fₖ = k fₛ/N only after fₛ is known · here fₛ = 8 kHz</text>
    <text x="57" y="320" font-size="11.5">signed fₖ = [0, +1, +2, +3, −4, −3, −2, −1] kHz</text>
  </g>
  </g>

  <g class="mobile-layout" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="42" y="25" fill="currentColor" font-size="24" font-weight="700">DTFT curve and eight DFT samples</text>
    <text x="42" y="49" fill="currentColor" font-size="23" font-weight="600">N=8 · x[n]=(−1)ⁿ · n=0,…,7</text>
    <line x1="42" y1="68" x2="70" y2="68" stroke="#e2903a" stroke-width="4"/>
    <text x="78" y="74" fill="currentColor" font-size="23">|X₈(eʲω)|</text>
    <line x1="333" y1="76" x2="333" y2="60" stroke="#4c8dd6" stroke-width="3"/>
    <circle cx="333" cy="60" r="5" fill="#4c8dd6"/>
    <text x="347" y="74" fill="currentColor" font-size="23">X[k]</text>

    <g transform="translate(0 52) scale(1 0.66)">
      <use href="#plot-axes"/>
      <use href="#dtft-curve"/>
      <use href="#periodic-continuations"/>
      <use href="#dft-stems"/>
      <use href="#dft-dots"/>
    </g>

    <g fill="currentColor" font-size="23">
      <text x="47" y="103" text-anchor="end">8</text>
      <text x="47" y="202" text-anchor="end">0</text>
      <text x="18" y="154" text-anchor="middle" font-weight="600" transform="rotate(-90 18 154)">magnitude</text>
      <path d="M339 104 L330 101" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <text x="344" y="112" font-weight="700">X[4]=8</text>
      <text x="60" y="220" text-anchor="middle">0</text>
      <text x="325" y="220" text-anchor="middle">π</text>
      <text x="590" y="220" text-anchor="middle">2π</text>
      <text x="590" y="167" text-anchor="end" font-weight="600">ω (rad/sample)</text>

      <text x="42" y="242" text-anchor="end" font-weight="700">k</text>
      <text x="60" y="242" text-anchor="middle">0</text>
      <text x="126.25" y="242" text-anchor="middle">1</text>
      <text x="192.5" y="242" text-anchor="middle">2</text>
      <text x="258.75" y="242" text-anchor="middle">3</text>
      <text x="325" y="242" text-anchor="middle" font-weight="700">4</text>
      <text x="391.25" y="242" text-anchor="middle">5</text>
      <text x="457.5" y="242" text-anchor="middle">6</text>
      <text x="523.75" y="242" text-anchor="middle">7</text>

      <rect x="36" y="249" width="568" height="77" rx="8" fill="currentColor" opacity="0.055"/>
      <text x="49" y="266" font-weight="600">ωₖ=2πk/8</text>
      <text x="590" y="266" text-anchor="end">0≡2π (same point)</text>
      <text x="49" y="293">fₖ=kfₛ/N only after fₛ is known</text>
      <text x="49" y="320">fₛ=8 kHz: [0,+1,+2,+3,−4,−3,−2,−1] kHz</text>
    </g>
  </g>
</svg>

<svg viewBox="0 0 328 454" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Second traversal of a first-order feedback loop</title>
  <desc id="desc">The direct term is revealed. A second traversal reads the old state before writing the new one and completes h of one equals a.</desc>
  <defs>
    <marker id="arrow-ink" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="currentColor"/></marker>
    <marker id="arrow-amber" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#e2903a"/></marker>
  </defs>
  <style>
    .ink { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.58; }
    .panel { fill: currentColor; fill-opacity: 0.025; stroke: currentColor; stroke-opacity: 0.18; }
    .future { fill: currentColor; fill-opacity: 0.018; stroke: currentColor; stroke-opacity: 0.25; stroke-dasharray: 4 3; }
    .revealed { fill: #4c8dd6; fill-opacity: 0.09; stroke: #4c8dd6; stroke-width: 1.5; }
    .active { fill: #e2903a; fill-opacity: 0.12; stroke: #e2903a; stroke-width: 2; }
    .revealed-text { fill: #4c8dd6; }
    .active-text { fill: #e2903a; }
    .sample { fill: #5aa46a; }
  </style>

  <text class="ink" x="164" y="22" text-anchor="middle" font-size="17" font-weight="760">y[n] = x[n] + a y[n−1]</text>
  <text class="muted" x="164" y="43" text-anchor="middle" font-size="13">initial rest y[−1]=0 · h[n]=aⁿu[n]</text>

  <rect class="panel" x="6" y="55" width="316" height="147" rx="8"/>
  <rect x="120" y="66" width="89" height="23" rx="11.5" fill="#e2903a" fill-opacity="0.14" stroke="#e2903a" stroke-width="1.3"/>
  <text class="active-text" x="164.5" y="82" text-anchor="middle" font-size="12" font-weight="780">TRAVERSAL 2</text>

  <text class="ink" x="13" y="116" font-size="12.5" font-weight="720">input x[n]</text>
  <line x1="81" y1="112" x2="88" y2="112" stroke="currentColor" stroke-width="1.5" marker-end="url(#arrow-ink)"/>
  <circle cx="105" cy="112" r="16" fill="none" stroke="#e2903a" stroke-width="2.2"/>
  <text class="active-text" x="105" y="118" text-anchor="middle" font-size="18" font-weight="760">+</text>
  <text class="muted" x="105" y="98" text-anchor="middle" font-size="12.5">sum</text>
  <line x1="122" y1="112" x2="234" y2="112" stroke="#e2903a" stroke-width="2.2" marker-end="url(#arrow-amber)"/>
  <text class="ink" x="315" y="116" text-anchor="end" font-size="12.5" font-weight="720">output y[n]</text>

  <circle cx="211" cy="112" r="3.5" fill="#e2903a"/>
  <line x1="211" y1="116" x2="211" y2="158" stroke="#e2903a" stroke-width="2.2" marker-end="url(#arrow-amber)"/>
  <text class="active-text" x="258" y="141" text-anchor="middle" font-size="12.5" font-weight="720">2 · WRITE NEW</text>
  <text class="active-text" x="258" y="156" text-anchor="middle" font-size="12.5" font-weight="720">y[n]</text>
  <rect x="190" y="164" width="123" height="32" rx="5" fill="#e2903a" fill-opacity="0.09" stroke="#e2903a" stroke-width="1.7"/>
  <text class="ink" x="251.5" y="178" text-anchor="middle" font-size="12.5" font-weight="700">unit delay</text>
  <text class="ink" x="251.5" y="192" text-anchor="middle" font-size="12.5" font-weight="700">stored state</text>
  <line x1="190" y1="180" x2="180" y2="180" stroke="#e2903a" stroke-width="2.2" marker-end="url(#arrow-amber)"/>
  <text class="active-text" x="145" y="142" text-anchor="middle" font-size="12.5" font-weight="720">1 · READ OLD</text>
  <text class="active-text" x="145" y="157" text-anchor="middle" font-size="12.5" font-weight="720">y[n−1]</text>
  <rect x="112" y="166" width="60" height="28" rx="5" fill="#e2903a" fill-opacity="0.09" stroke="#e2903a" stroke-width="1.7"/>
  <text class="ink" x="142" y="185" text-anchor="middle" font-size="12.5" font-weight="700">gain a</text>
  <path d="M112 180 H102 Q94 180 94 169 V139 Q94 129 105 129" fill="none" stroke="#e2903a" stroke-width="2.2" marker-end="url(#arrow-amber)"/>

  <text class="ink" x="164" y="224" text-anchor="middle" font-size="13.5" font-weight="780">ONE TERM ENTERS y[n] EACH TRAVERSAL</text>

  <g transform="translate(8 236)">
    <rect class="revealed" x="0" y="0" width="150" height="70" rx="7"/>
    <text class="revealed-text" x="10" y="18" font-size="12.5" font-weight="800">REVEALED · DELAY 0</text>
    <text class="ink" x="75" y="42" text-anchor="middle" font-size="15" font-weight="740">x[n]</text>
    <text class="revealed-text" x="75" y="62" text-anchor="middle" font-size="13" font-weight="760">h[0] = 1</text>
  </g>
  <g transform="translate(170 236)">
    <rect class="active" x="0" y="0" width="150" height="70" rx="7"/>
    <text class="active-text" x="10" y="18" font-size="12.5" font-weight="800">CURRENT · DELAY 1</text>
    <text class="ink" x="75" y="42" text-anchor="middle" font-size="15" font-weight="740">a x[n−1]</text>
    <text class="sample" x="75" y="62" text-anchor="middle" font-size="13" font-weight="800">h[1] = a · DONE</text>
  </g>
  <g transform="translate(8 314)">
    <rect class="future" x="0" y="0" width="150" height="70" rx="7"/>
    <text class="muted" x="10" y="18" font-size="12.5" font-weight="760">NEXT · DELAY 2</text>
    <text class="muted" x="75" y="42" text-anchor="middle" font-size="15" font-weight="720">a² x[n−2]</text>
    <text class="muted" x="75" y="62" text-anchor="middle" font-size="13">h[2] = a²</text>
  </g>
  <g transform="translate(170 314)">
    <rect class="future" x="0" y="0" width="150" height="70" rx="7"/>
    <text class="muted" x="10" y="18" font-size="12.5" font-weight="760">WAIT · DELAY 3</text>
    <text class="muted" x="75" y="42" text-anchor="middle" font-size="15" font-weight="720">a³ x[n−3]</text>
    <text class="muted" x="75" y="62" text-anchor="middle" font-size="13">h[3] = a³</text>
  </g>

  <text class="muted" x="164" y="414" text-anchor="middle" font-size="13" font-weight="740">TAIL CONTINUES AFTER a³x[n−3]</text>
  <text class="muted" x="164" y="437" text-anchor="middle" font-size="13">+ a⁴x[n−4] + a⁵x[n−5] + ···</text>
</svg>

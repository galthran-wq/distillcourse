  <g aria-label="Finite partial sums and infinite-tail verdicts">
    <rect class="panel" x="45" y="225" width="166" height="72" rx="5"/>
    <text class="amber" x="55" y="244" font-size="12" font-weight="750">ρ=.999 · decaying</text>
    <text class="ink" x="55" y="262" font-size="11">Σ₀⁹⁹ |h[n]| = 95.208</text>
    <text class="ink" x="55" y="278" font-size="11">Σ₀∞ |h[n]| = 1000</text>
    <text class="green" x="201" y="292" text-anchor="end" font-size="11" font-weight="750">finite → BIBO stable</text>

    <rect class="panel" x="217" y="225" width="166" height="72" rx="5"/>
    <text class="ink" x="227" y="244" font-size="12" font-weight="750">ρ=1.000 · persistent</text>
    <text class="ink" x="227" y="262" font-size="11">Σ₀⁹⁹ |h[n]| = 100.000</text>
    <text class="ink" x="227" y="278" font-size="11">Σ₀∞ |h[n]| diverges</text>
    <text class="muted" x="373" y="292" text-anchor="end" font-size="11" font-weight="750">not BIBO stable</text>

    <rect class="panel" x="389" y="225" width="166" height="72" rx="5"/>
    <text class="blue" x="399" y="244" font-size="12" font-weight="750">ρ=1.001 · growing</text>
    <text class="ink" x="399" y="262" font-size="11">Σ₀⁹⁹ |h[n]| = 105.116</text>
    <text class="ink" x="399" y="278" font-size="11">Σ₀∞ |h[n]| diverges</text>
    <text class="muted" x="545" y="292" text-anchor="end" font-size="11" font-weight="750">not BIBO stable</text>
  </g>

  <rect x="38" y="302" width="524" height="31" rx="6" fill="#5aa46a" fill-opacity="0.09" stroke="#5aa46a" stroke-width="1.3"/>
  <text class="ink" x="300" y="322" text-anchor="middle" font-size="14" font-weight="700">
    finite prefix: all bounded · infinite tail: <tspan class="green">summable only for ρ&lt;1</tspan>
  </text>
</svg>

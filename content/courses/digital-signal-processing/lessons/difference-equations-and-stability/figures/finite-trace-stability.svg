<svg viewBox="0 0 600 340" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">A bounded finite trace cannot prove BIBO stability</title>
  <desc id="desc">One hundred integer samples of 0.999 to the n, 1 to the n, and 1.001 to the n share the same scale. They end at 0.906, 1.000, and 1.104. Their 100-sample absolute sums are 95.208, 100, and 105.116, but only the radius 0.999 infinite tail has a finite absolute sum.</desc>
  <style>
    .ink { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.58; }
    .axis { fill: none; stroke: currentColor; stroke-opacity: 0.55; }
    .guide { fill: none; stroke: currentColor; stroke-opacity: 0.16; stroke-dasharray: 3 3; }
    .panel { fill: currentColor; fill-opacity: 0.035; stroke: currentColor; stroke-opacity: 0.18; }
    .amber { fill: #e2903a; }
    .amber-stroke { fill: none; stroke: #e2903a; }
    .blue { fill: #4c8dd6; }
    .blue-stroke { fill: none; stroke: #4c8dd6; }
    .green { fill: #5aa46a; }
  </style>
  <defs>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#e2903a"/>
    </marker>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="currentColor"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#4c8dd6"/>
    </marker>
  </defs>

  <text class="ink" x="300" y="21" text-anchor="middle" font-size="18" font-weight="750">finite traces are evidence, not proof</text>
  <text class="muted" x="300" y="41" text-anchor="middle" font-size="12">100 displayed integer samples · one shared scale 0.88–1.12 · dots only</text>
  <text class="muted" x="520" y="98" text-anchor="middle" font-size="10">continuation beyond display</text>


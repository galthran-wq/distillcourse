<svg viewBox="0 0 640 390" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">One continuous DTFT period on the frequency circle</title>
  <desc id="desc">For the finite sequence x equals 1, 2, minus 1, the frequency ring identifies minus pi with plus pi. Exact values are X at zero equals 2, X at pi over two equals 2 minus j2, and X at pi equals minus 2. A continuous magnitude curve is shown without a sampled grid; this continuity claim is scoped to the finite, absolutely summable sequence.</desc>
  <style>
    .ink { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.58; }
    .axis { fill: none; stroke: currentColor; stroke-opacity: 0.48; }
    .guide { fill: none; stroke: currentColor; stroke-opacity: 0.16; stroke-dasharray: 3 4; }
    .panel { fill: currentColor; fill-opacity: 0.035; stroke: currentColor; stroke-opacity: 0.16; }
    .amber { fill: #e2903a; }
    .amber-stroke { fill: none; stroke: #e2903a; }
    .blue { fill: #4c8dd6; }
    .blue-stroke { fill: none; stroke: #4c8dd6; }
    .mobile-layout { display: none; }
    @media (max-width: 480px) {
      .desktop-layout { display: none; }
      .mobile-layout { display: inline; }
    }
  </style>
  <defs>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#e2903a"/>
    </marker>
    <path id="magnitude-curve" d="M70 270 L75.6 269.9 L81.3 269.4 L86.9 268.7 L92.5 267.7 L98.1 266.5 L103.8 265 L109.4 263.5 L115 261.7 L120.6 259.9 L126.3 258 L131.9 256.2 L137.5 254.3 L143.1 252.4 L148.8 250.6 L154.4 249 L160 247.4 L165.6 246 L171.3 244.7 L176.9 243.6 L182.5 242.7 L188.1 242 L193.8 241.4 L199.4 241.1 L205 241 L210.6 241.1 L216.3 241.4 L221.9 242 L227.5 242.7 L233.1 243.6 L238.8 244.7 L244.4 246 L250 247.4 L255.6 249 L261.3 250.6 L266.9 252.4 L272.5 254.3 L278.1 256.2 L283.8 258 L289.4 259.9 L295 261.7 L300.6 263.5 L306.3 265 L311.9 266.5 L317.5 267.7 L323.1 268.7 L328.8 269.4 L334.4 269.9 L340 270 L345.6 269.9 L351.3 269.4 L356.9 268.7 L362.5 267.7 L368.1 266.5 L373.8 265 L379.4 263.5 L385 261.7 L390.6 259.9 L396.3 258 L401.9 256.2 L407.5 254.3 L413.1 252.4 L418.8 250.6 L424.4 249 L430 247.4 L435.6 246 L441.3 244.7 L446.9 243.6 L452.5 242.7 L458.1 242 L463.8 241.4 L469.4 241.1 L475 241 L480.6 241.1 L486.3 241.4 L491.9 242 L497.5 242.7 L503.1 243.6 L508.8 244.7 L514.4 246 L520 247.4 L525.6 249 L531.3 250.6 L536.9 252.4 L542.5 254.3 L548.1 256.2 L553.8 258 L559.4 259.9 L565 261.7 L570.6 263.5 L576.3 265 L581.9 266.5 L587.5 267.7 L593.1 268.7 L598.8 269.4 L604.4 269.9 L610 270"/>
  </defs>

  <g class="desktop-layout">
    <text class="ink" x="20" y="24" font-size="17" font-weight="760">frequency modulo 2π</text>
    <text class="muted" x="620" y="24" text-anchor="end" font-size="12">finite x=[1, 2, −1] ⇒ finite support ⇒ ℓ¹</text>
    <text class="muted" x="20" y="43" font-size="12">ω (rad/sample) wraps around the ring · the ring is not an X-plane locus</text>

    <g aria-label="Frequency ring with one pi equals minus pi seam">
      <circle class="axis" cx="145" cy="122" r="62" stroke-width="1.8"/>
      <line class="axis" x1="70" y1="122" x2="220" y2="122"/>
      <line class="axis" x1="145" y1="47" x2="145" y2="197"/>
      <circle cx="207" cy="122" r="4.5" fill="currentColor"/>
      <circle cx="145" cy="60" r="4.5" fill="currentColor"/>
      <circle cx="83" cy="122" r="5.5" fill="var(--panel)" stroke="currentColor" stroke-width="2"/>
      <text class="ink" x="218" y="126" font-size="12" font-weight="700">0</text>
      <text class="ink" x="145" y="54" text-anchor="middle" font-size="12" font-weight="700">π/2</text>
      <text class="ink" x="74" y="126" text-anchor="end" font-size="12" font-weight="700">π = −π</text>
      <line class="amber-stroke" x1="145" y1="122" x2="187" y2="80" stroke-width="3" marker-end="url(#arrow-amber)"/>
      <text class="amber" x="193" y="78" font-size="13" font-weight="760">ω</text>
      <path d="M201 130 A58 58 0 0 1 176 70" class="amber-stroke" stroke-width="1.8" marker-end="url(#arrow-amber)"/>
      <text class="amber" x="177" y="151" font-size="11" font-weight="680">increasing ω</text>
      <text class="muted" x="145" y="178" text-anchor="middle" font-size="11">one frequency seam</text>
    </g>

    <g aria-label="Exact transform checkpoints">
      <rect class="panel" x="275" y="52" width="350" height="140" rx="6"/>
      <text class="muted" x="290" y="71" font-size="11">checkpoint on ω ring</text>
      <g class="ink" font-size="12" font-weight="700">
        <text x="290" y="96">0</text><text x="290" y="132">π/2</text><text x="290" y="168">π = −π</text>
      </g>
      <g class="blue" font-size="13" font-weight="720">
        <text x="365" y="96">X(eʲ⁰) = 2</text>
        <text x="365" y="132">X(eʲπ⁄²) = 2 − j2</text>
        <text x="365" y="168">X(eʲπ) = −2</text>
      </g>
      <line class="guide" x1="320" y1="103" x2="610" y2="103"/>
      <line class="guide" x1="320" y1="139" x2="610" y2="139"/>
    </g>

    <g aria-label="Continuous magnitude curve for the finite sequence">
      <text class="blue" x="20" y="218" font-size="14" font-weight="760">|X(eʲω)|</text>
      <text class="ink" x="620" y="218" text-anchor="end" font-size="12" font-weight="680">continuous curve · grid not shown</text>
      <line class="guide" x1="70" y1="241" x2="610" y2="241"/>
      <line class="guide" x1="70" y1="270" x2="610" y2="270"/>
      <line class="axis" x1="70" y1="340" x2="610" y2="340" stroke-width="1.3"/>
      <line class="axis" x1="70" y1="232" x2="70" y2="340" stroke-width="1.3"/>
      <text class="muted" x="63" y="245" text-anchor="end" font-size="10">2√2</text>
      <text class="muted" x="63" y="274" text-anchor="end" font-size="10">2</text>
      <use href="#magnitude-curve" class="blue-stroke" stroke-width="3" stroke-linejoin="round"/>
      <g class="muted" font-size="10.5" text-anchor="middle">
        <text x="70" y="357">−π</text><text x="205" y="357">−π/2</text><text x="340" y="357">0</text><text x="475" y="357">π/2</text><text x="610" y="357">+π</text>
      </g>
      <text class="ink" x="340" y="377" text-anchor="middle" font-size="11" font-weight="680">−π ≡ +π · one shared seam</text>
      <text class="muted" x="620" y="377" text-anchor="end" font-size="10.5">ω (rad/sample)</text>
    </g>
  </g>

  <g class="mobile-layout">
    <text class="ink" x="20" y="30" font-size="30" font-weight="760">frequency modulo 2π</text>
    <text class="muted" x="20" y="62" font-size="26">finite x=[1,2,−1] ⇒ finite support ⇒ ℓ¹</text>
    <text class="muted" x="20" y="93" font-size="26">ω (rad/sample) · frequency ring, not X-plane</text>

    <g aria-label="Phone frequency ring">
      <circle class="axis" cx="135" cy="155" r="42" stroke-width="3"/>
      <line class="axis" x1="86" y1="155" x2="184" y2="155" stroke-width="2"/>
      <line class="axis" x1="135" y1="106" x2="135" y2="204" stroke-width="2"/>
      <circle cx="177" cy="155" r="6" fill="currentColor"/>
      <circle cx="135" cy="113" r="6" fill="currentColor"/>
      <circle cx="93" cy="155" r="7" fill="none" stroke="currentColor" stroke-width="3"/>
      <text class="ink" x="189" y="163" font-size="26" font-weight="700">0</text>
      <text class="ink" x="128" y="123" text-anchor="end" font-size="26" font-weight="700">π/2</text>
      <text class="ink" x="88" y="163" text-anchor="end" font-size="26" font-weight="700">π=−π</text>
      <line class="amber-stroke" x1="135" y1="155" x2="165" y2="125" stroke-width="5" marker-end="url(#arrow-amber)"/>
      <text class="amber" x="175" y="130" font-size="26" font-weight="760">ω</text>
      <path d="M174 164 A42 42 0 0 1 158 120" class="amber-stroke" stroke-width="3" marker-end="url(#arrow-amber)"/>
      <text class="muted" x="135" y="201" text-anchor="middle" font-size="26">one seam</text>
    </g>

    <g aria-label="Phone exact transform checkpoints" font-size="26">
      <g class="ink" font-weight="700">
        <text x="275" y="126">0</text><text x="275" y="165">π/2</text><text x="275" y="204">π=−π</text>
      </g>
      <g class="blue" font-weight="720">
        <text x="365" y="126">X(eʲ⁰)=2</text>
        <text x="365" y="165">X(eʲπ⁄²)=2−j2</text>
        <text x="365" y="204">X(eʲπ)=−2</text>
      </g>
    </g>

    <g aria-label="Phone continuous magnitude curve for finite x">
      <text class="blue" x="20" y="238" font-size="26" font-weight="760">|X(eʲω)|</text>
      <text class="ink" x="155" y="238" font-size="26" font-weight="680">continuous curve</text>
      <text class="muted" x="620" y="238" text-anchor="end" font-size="26">grid not shown</text>
      <line class="guide" x1="70" y1="265" x2="610" y2="265"/>
      <line class="guide" x1="70" y1="294" x2="610" y2="294"/>
      <line class="axis" x1="70" y1="340" x2="610" y2="340" stroke-width="2"/>
      <line class="axis" x1="70" y1="256" x2="70" y2="340" stroke-width="2"/>
      <text class="muted" x="63" y="270" text-anchor="end" font-size="26">2√2</text>
      <text class="muted" x="63" y="299" text-anchor="end" font-size="26">2</text>
      <use href="#magnitude-curve" class="blue-stroke" stroke-width="5" stroke-linejoin="round" transform="translate(0 24)"/>
      <g class="muted" font-size="26">
        <text x="70" y="371" text-anchor="middle">−π</text>
        <text x="205" y="371" text-anchor="middle">−π/2</text>
        <text x="340" y="371" text-anchor="middle">0</text>
        <text x="475" y="371" text-anchor="middle">π/2</text>
        <text x="610" y="371" text-anchor="end">+π=−π</text>
      </g>
    </g>
  </g>
</svg>

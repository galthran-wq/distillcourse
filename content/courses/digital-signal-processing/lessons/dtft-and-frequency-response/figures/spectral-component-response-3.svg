<svg class="frame3" viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Three-tap averager response, including its exact null</title>
  <desc id="desc">Frame three retains the DC and pi-over-three results and activates the eternal two-pi-over-three mode. Its response is exactly zero, so the output is zero and phase is undefined.</desc>
  <defs>
    <marker id="a1" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7Z" fill="#e2903a"/></marker>
    <marker id="b1" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7Z" fill="#4c8dd6"/></marker>
  </defs>
  <style>
    .ink{fill:currentColor}.muted{fill:currentColor;opacity:.55}.line{fill:none;stroke:currentColor}.amber{fill:#e2903a}.blue{fill:#4c8dd6}.green{fill:#5aa46a}.stage{opacity:.16}.frame1 .r1,.frame2 .r1,.frame2 .r2,.frame3 .r1,.frame3 .r2,.frame3 .r3{opacity:1}.small{font-size:11px}.body{font-size:12px}.phone{display:none}
    @media(max-width:480px){.desktop{display:none}.phone{display:inline}.phone .pt{font-size:11px}.phone .tiny{font-size:9.5px}}
  </style>
  <g class="desktop">
    <text class="pt ink" x="20" y="24" font-size="18" font-weight="700">Three-tap averager</text>
    <text class="pt muted small" x="620" y="24" text-anchor="end">eternal modes · direct eigenfunction calculation · no startup gate</text>
    <rect x="20" y="38" width="600" height="42" rx="6" class="line" stroke-width="1" opacity=".4"/>
    <text class="pt ink body" x="34" y="56" font-weight="650">h[n] = ⅓(δ[n] + δ[n−1] + δ[n−2])</text>
    <text class="pt ink body" x="606" y="56" text-anchor="end" font-weight="650">H(e^(jω)) = ⅓(1 + e^(−jω) + e^(−j2ω))</text>
    <text class="pt muted small" x="34" y="72">amber: input mode at n=0</text><text class="pt muted small" x="606" y="72" text-anchor="end">blue: output mode · green: verified response</text>
    <text class="pt muted small" x="30" y="99">MODE / INPUT STEM + PHASOR</text><text class="pt muted small" x="216" y="99">COMPLEX RESPONSE</text><text class="pt muted small" x="435" y="99">OUTPUT STEM + PHASOR</text>
    <g class="stage r1">
      <rect x="20" y="108" width="600" height="65" rx="6" fill="currentColor" fill-opacity=".025" stroke="currentColor" stroke-opacity=".25"/><text class="pt ink body" x="34" y="127" font-weight="700">ω = 0</text><line x1="35" y1="156" x2="92" y2="156" class="line" stroke-width="1" opacity=".45"/><line x1="58" y1="156" x2="58" y2="132" stroke="#e2903a" stroke-width="2.3"/><circle cx="58" cy="132" r="3" fill="#e2903a"/><line x1="112" y1="145" x2="147" y2="145" stroke="#e2903a" stroke-width="2.5" marker-end="url(#a1)"/><text class="pt amber small" x="112" y="163" font-weight="650">e^(j0n) = 1</text>
      <rect x="196" y="118" width="216" height="45" rx="5" fill="#5aa46a" fill-opacity=".07" stroke="#5aa46a" stroke-width="1.2"/><text class="pt ink body" x="209" y="137" font-weight="650">H(e^(j0)) = 1</text><text class="pt green small" x="209" y="154" font-weight="700">gain 1 · phase 0</text><line x1="437" y1="156" x2="480" y2="156" class="line" stroke-width="1" opacity=".45"/><line x1="456" y1="156" x2="456" y2="132" stroke="#4c8dd6" stroke-width="2.3"/><circle cx="456" cy="132" r="3" fill="#4c8dd6"/><line x1="500" y1="145" x2="535" y2="145" stroke="#4c8dd6" stroke-width="2.5" marker-end="url(#b1)"/><text class="pt blue body" x="552" y="149" font-weight="700">1</text>
    </g>
    <g class="stage r2">
      <rect x="20" y="181" width="600" height="65" rx="6" fill="currentColor" fill-opacity=".025" stroke="currentColor" stroke-opacity=".25"/><text class="pt ink body" x="34" y="200" font-weight="700">ω = π/3</text><line x1="35" y1="229" x2="92" y2="229" class="line" stroke-width="1" opacity=".45"/><line x1="68" y1="229" x2="68" y2="205" stroke="#e2903a" stroke-width="2.3"/><circle cx="68" cy="205" r="3" fill="#e2903a"/><line x1="112" y1="218" x2="147" y2="218" stroke="#e2903a" stroke-width="2.5" marker-end="url(#a1)"/><text class="pt amber small" x="105" y="238" font-weight="650">e^(jπn/3)</text>
      <rect x="196" y="191" width="216" height="45" rx="5" fill="#5aa46a" fill-opacity=".07" stroke="#5aa46a" stroke-width="1.2"/><text class="pt ink body" x="209" y="210" font-weight="650">H(e^(jπ/3)) = ⅔e^(−jπ/3)</text><text class="pt green small" x="209" y="227" font-weight="700">gain ⅔ · phase −π/3</text><line x1="437" y1="229" x2="480" y2="229" class="line" stroke-width="1" opacity=".45"/><line x1="456" y1="229" x2="456" y2="213" stroke="#4c8dd6" stroke-width="2.3"/><circle cx="456" cy="213" r="3" fill="#4c8dd6"/><line x1="500" y1="202" x2="512" y2="222" stroke="#4c8dd6" stroke-width="2.5" marker-end="url(#b1)"/><text class="pt blue small" x="535" y="239" text-anchor="middle" font-weight="700">output ⅔e^(j(πn/3−π/3))</text>
    </g>
    <g class="stage r3">
      <rect x="20" y="254" width="600" height="65" rx="6" fill="currentColor" fill-opacity=".025" stroke="currentColor" stroke-opacity=".25"/><text class="pt ink body" x="34" y="273" font-weight="700">ω = 2π/3</text><line x1="35" y1="302" x2="92" y2="302" class="line" stroke-width="1" opacity=".45"/><line x1="80" y1="302" x2="80" y2="278" stroke="#e2903a" stroke-width="2.3"/><circle cx="80" cy="278" r="3" fill="#e2903a"/><line x1="112" y1="291" x2="147" y2="291" stroke="#e2903a" stroke-width="2.5" marker-end="url(#a1)"/><text class="pt amber small" x="101" y="311" font-weight="650">e^(j2πn/3)</text>
      <rect x="196" y="264" width="216" height="45" rx="5" fill="currentColor" fill-opacity=".025" stroke="currentColor" stroke-width="1.2"/><text class="pt ink body" x="209" y="283" font-weight="650">H(e^(j2π/3)) = 0</text><text class="pt ink small" x="209" y="300" font-weight="700">gain 0 · phase undefined</text><line x1="437" y1="302" x2="480" y2="302" class="line" stroke-width="1" opacity=".45"/><circle cx="456" cy="302" r="7" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M451 297l10 10m0-10-10 10" class="line" stroke-width="1.8"/><text class="pt blue body" x="500" y="285" font-weight="700">output 0</text><text class="pt ink small" x="500" y="303" font-weight="700">response null</text>
    </g>
    <text class="pt muted small" x="320" y="345" text-anchor="middle">Each row is an eternal complex mode; a causal gate would add edge transients.</text>
  </g>
  <g class="phone" transform="scale(2)" aria-hidden="true">
    <text class="pt ink" x="8" y="10" font-weight="700">Averager eigenvalues</text><text class="pt muted tiny" x="312" y="10" text-anchor="end">eternal modes · no gate</text><rect x="8" y="15" width="304" height="24" rx="4" class="line" stroke-width=".7" opacity=".4"/><text class="pt ink tiny" x="15" y="25" font-weight="650">h[n]=⅓(δ[n]+δ[n−1]+δ[n−2])</text><text class="pt ink tiny" x="15" y="35">H(e^(jω))=⅓(1+e^(−jω)+e^(−j2ω))</text>
    <g class="stage r1"><rect x="8" y="44" width="304" height="38" rx="4" fill="currentColor" fill-opacity=".025" stroke="currentColor" stroke-opacity=".25"/><text class="pt ink" x="14" y="57" font-weight="700">ω=0</text><line x1="55" y1="66" x2="73" y2="66" stroke="#e2903a" stroke-width="1.5" marker-end="url(#a1)"/><text class="pt ink tiny" x="86" y="57" font-weight="650">H=1</text><text class="pt green tiny" x="86" y="72" font-weight="700">gain 1 · phase 0</text><line x1="235" y1="66" x2="253" y2="66" stroke="#4c8dd6" stroke-width="1.5" marker-end="url(#b1)"/><text class="pt blue" x="270" y="69" font-weight="700">1</text></g>
    <g class="stage r2"><rect x="8" y="87" width="304" height="38" rx="4" fill="currentColor" fill-opacity=".025" stroke="currentColor" stroke-opacity=".25"/><text class="pt ink" x="14" y="100" font-weight="700">ω=π/3</text><line x1="55" y1="110" x2="73" y2="110" stroke="#e2903a" stroke-width="1.5" marker-end="url(#a1)"/><text class="pt ink tiny" x="86" y="100" font-weight="650">H=⅔e^(−jπ/3)</text><text class="pt green tiny" x="86" y="115" font-weight="700">gain ⅔ · phase −π/3</text><line x1="230" y1="95" x2="238" y2="109" stroke="#4c8dd6" stroke-width="1.5" marker-end="url(#b1)"/><text class="pt blue tiny" x="205" y="119" font-weight="700">y=⅔e^(j(πn/3−π/3))</text></g>
    <g class="stage r3"><rect x="8" y="130" width="304" height="38" rx="4" fill="currentColor" fill-opacity=".025" stroke="currentColor" stroke-opacity=".25"/><text class="pt ink" x="14" y="143" font-weight="700">ω=2π/3</text><line x1="61" y1="153" x2="79" y2="153" stroke="#e2903a" stroke-width="1.5" marker-end="url(#a1)"/><text class="pt ink tiny" x="92" y="143" font-weight="650">H=0</text><text class="pt ink tiny" x="92" y="158" font-weight="700">gain 0 · phase undefined</text><circle cx="230" cy="151" r="5" fill="none" stroke="currentColor"/><path d="M226 147l8 8m0-8-8 8" class="line"/><text class="pt blue tiny" x="270" y="146" font-weight="700">y=0</text><text class="pt ink tiny" x="243" y="159">response null</text></g>
    <text class="pt muted tiny" x="160" y="178" text-anchor="middle">direct eigenfunction calculation · causal edges excluded</text>
  </g>
</svg>

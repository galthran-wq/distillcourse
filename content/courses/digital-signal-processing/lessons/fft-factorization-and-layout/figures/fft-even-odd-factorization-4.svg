<svg class="frame4" viewBox="0 0 640 370" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Eight-point DFT factorized into three radix-two stages</title>
  <desc id="desc">A fixed dataflow starts with a direct eight-by-eight product ledger, then reveals the even-odd combine, the two four-point branches, and the four two-point leaves one stage per frame.</desc>
  <style>
    .t{font-family:system-ui,sans-serif;fill:currentColor}
    .small{font-size:10px}.label{font-size:11px}.head{font-size:13px;font-weight:650}
    .muted{opacity:.55}.ghost{opacity:.12}.reveal{opacity:0}
    .frame2 .step2,.frame3 .step2,.frame4 .step2{opacity:1}
    .frame3 .step3,.frame4 .step3{opacity:1}
    .frame4 .step4{opacity:1}
    .wire{fill:none;stroke:currentColor;stroke-width:1.15;stroke-linecap:round}
    .upper{fill:none;stroke:#e2903a;stroke-width:1.8;stroke-linecap:round}
    .lower{fill:none;stroke:#4c8dd6;stroke-width:1.8;stroke-linecap:round}
    .upperNode{fill:#e2903a}.lowerNode{fill:#4c8dd6}.okNode{fill:#5aa46a}
  </style>
  <defs>
    <pattern id="products" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.35" fill="currentColor"/>
    </pattern>
    <g id="stage1">
      <text x="158" y="87" text-anchor="middle" class="t label" fill="#e2903a">four DFT₂ leaves</text>
      <path class="upper" d="M96 102H220M96 122L220 102M96 142H220M96 162L220 142M96 190H220M96 210L220 190M96 230H220M96 250L220 230"/>
      <path class="lower" d="M96 122H220M96 102L220 122M96 162H220M96 142L220 162M96 210H220M96 190L220 210M96 250H220M96 230L220 250"/>
      <g class="upperNode"><circle cx="220" cy="102" r="3"/><circle cx="220" cy="142" r="3"/><circle cx="220" cy="190" r="3"/><circle cx="220" cy="230" r="3"/></g>
      <g class="lowerNode"><circle cx="220" cy="122" r="3"/><circle cx="220" cy="162" r="3"/><circle cx="220" cy="210" r="3"/><circle cx="220" cy="250" r="3"/></g>
      <text x="158" y="263" text-anchor="middle" class="t small muted">W₂⁰ in each pair</text>
    </g>
    <g id="stage2">
      <text x="290" y="87" text-anchor="middle" class="t label" fill="#e2903a">two DFT₄ branches</text>
      <path class="upper" d="M220 102H360M220 142L360 102M220 122H360M220 162L360 122M220 190H360M220 230L360 190M220 210H360M220 250L360 210"/>
      <path class="lower" d="M220 142H360M220 102L360 142M220 162H360M220 122L360 162M220 230H360M220 190L360 230M220 250H360M220 210L360 250"/>
      <g class="upperNode"><circle cx="360" cy="102" r="3"/><circle cx="360" cy="122" r="3"/><circle cx="360" cy="190" r="3"/><circle cx="360" cy="210" r="3"/></g>
      <g class="lowerNode"><circle cx="360" cy="142" r="3"/><circle cx="360" cy="162" r="3"/><circle cx="360" cy="230" r="3"/><circle cx="360" cy="250" r="3"/></g>
      <text x="290" y="263" text-anchor="middle" class="t small muted">W₄⁰, W₄¹</text>
    </g>
    <g id="stage3">
      <text x="430" y="87" text-anchor="middle" class="t label" fill="#e2903a">E/O combine</text>
      <path class="upper" d="M360 102H500M360 190L500 102M360 122H500M360 210L500 122M360 142H500M360 230L500 142M360 162H500M360 250L500 162"/>
      <path class="lower" d="M360 190H500M360 102L500 190M360 210H500M360 122L500 210M360 230H500M360 142L500 230M360 250H500M360 162L500 250"/>
      <path class="upper" d="M500 102H580M500 122H580M500 142H580M500 162H580"/>
      <path class="lower" d="M500 190H580M500 210H580M500 230H580M500 250H580"/>
      <g class="upperNode"><circle cx="500" cy="102" r="3"/><circle cx="500" cy="122" r="3"/><circle cx="500" cy="142" r="3"/><circle cx="500" cy="162" r="3"/></g>
      <g class="lowerNode"><circle cx="500" cy="190" r="3"/><circle cx="500" cy="210" r="3"/><circle cx="500" cy="230" r="3"/><circle cx="500" cy="250" r="3"/></g>
      <g class="okNode"><circle cx="580" cy="102" r="3.4"/><circle cx="580" cy="122" r="3.4"/><circle cx="580" cy="142" r="3.4"/><circle cx="580" cy="162" r="3.4"/><circle cx="580" cy="190" r="3.4"/><circle cx="580" cy="210" r="3.4"/><circle cx="580" cy="230" r="3.4"/><circle cx="580" cy="250" r="3.4"/></g>
      <text x="430" y="263" text-anchor="middle" class="t small muted">W₈⁰, W₈¹, W₈², W₈³</text>
    </g>
    <g id="badge2">
      <rect x="165" y="33" width="145" height="30" rx="5" fill="#4c8dd6" fill-opacity=".12" stroke="#4c8dd6"/>
      <text x="237.5" y="52" text-anchor="middle" class="t label" fill="#4c8dd6"><tspan font-weight="700">2</tspan> split E / O</text>
    </g>
    <g id="badge3">
      <rect x="320" y="33" width="145" height="30" rx="5" fill="#4c8dd6" fill-opacity=".12" stroke="#4c8dd6"/>
      <text x="392.5" y="52" text-anchor="middle" class="t label" fill="#4c8dd6"><tspan font-weight="700">3</tspan> recurse DFT₄</text>
    </g>
    <g id="badge4">
      <rect x="475" y="33" width="145" height="30" rx="5" fill="#4c8dd6" fill-opacity=".12" stroke="#4c8dd6"/>
      <text x="547.5" y="52" text-anchor="middle" class="t label" fill="#4c8dd6"><tspan font-weight="700">4</tspan> open DFT₂</text>
    </g>
  </defs>

  <text x="20" y="20" class="t head">The same DFT, opened one reusable stage at a time</text>
  <rect x="10" y="33" width="145" height="30" rx="5" fill="#e2903a" fill-opacity=".12" stroke="#e2903a"/>
  <text x="82.5" y="52" text-anchor="middle" class="t label" fill="#e2903a"><tspan font-weight="700">1</tspan> direct sums</text>
  <use href="#badge2" class="ghost"/><use href="#badge3" class="ghost"/><use href="#badge4" class="ghost"/>
  <use href="#badge2" class="reveal step2"/><use href="#badge3" class="reveal step3"/><use href="#badge4" class="reveal step4"/>

  <text x="20" y="75" class="t small muted">bit-reversed source order</text>
  <text x="620" y="75" text-anchor="end" class="t small muted">natural X[k]</text>
  <g class="label">
    <text class="t" x="20" y="106">x[0]</text><text class="t" x="20" y="126">x[4]</text><text class="t" x="20" y="146">x[2]</text><text class="t" x="20" y="166">x[6]</text>
    <text class="t" x="20" y="194">x[1]</text><text class="t" x="20" y="214">x[5]</text><text class="t" x="20" y="234">x[3]</text><text class="t" x="20" y="254">x[7]</text>
    <text class="t" x="588" y="106">X[0]</text><text class="t" x="588" y="126">X[1]</text><text class="t" x="588" y="146">X[2]</text><text class="t" x="588" y="166">X[3]</text>
    <text class="t" x="588" y="194">X[4]</text><text class="t" x="588" y="214">X[5]</text><text class="t" x="588" y="234">X[6]</text><text class="t" x="588" y="254">X[7]</text>
  </g>
  <g fill="currentColor"><circle cx="90" cy="102" r="3"/><circle cx="90" cy="122" r="3"/><circle cx="90" cy="142" r="3"/><circle cx="90" cy="162" r="3"/><circle cx="90" cy="190" r="3"/><circle cx="90" cy="210" r="3"/><circle cx="90" cy="230" r="3"/><circle cx="90" cy="250" r="3"/></g>
  <g class="wire ghost"><path d="M90 102H96M90 122H96M90 142H96M90 162H96M90 190H96M90 210H96M90 230H96M90 250H96"/></g>
  <use href="#stage1" class="ghost"/><use href="#stage2" class="ghost"/><use href="#stage3" class="ghost"/>
  <use href="#stage3" class="reveal step2"/><use href="#stage2" class="reveal step3"/><use href="#stage1" class="reveal step4"/>

  <text x="320" y="282" text-anchor="middle" class="t label">
    <tspan fill="#e2903a">E[q]</tspan><tspan> ± W₈</tspan><tspan baseline-shift="super" font-size="8">q</tspan><tspan fill="#4c8dd6"> O[q]</tspan><tspan> → X[q], X[q+4]  ·  q=0,1,2,3</tspan>
  </text>
  <rect x="20" y="301" width="48" height="48" rx="3" fill="url(#products)" stroke="currentColor" opacity=".75"/>
  <text x="44" y="361" text-anchor="middle" class="t small muted">8 × 8</text>
  <text x="84" y="317" class="t label"><tspan font-weight="650">Direct:</tspan> 64 complex product slots + 56 additions</text>
  <text x="84" y="339" class="t label"><tspan font-weight="650">Three radix-2 stages:</tspan> 12 twiddle slots + 24 additions</text>
  <line x1="410" y1="314" x2="438" y2="314" class="upper"/><text x="445" y="318" class="t small" fill="#e2903a">upper / even arm</text>
  <line x1="410" y1="337" x2="438" y2="337" class="lower"/><text x="445" y="341" class="t small" fill="#4c8dd6">lower / odd arm</text>
  <text x="620" y="361" text-anchor="end" class="t small muted">12 is not total work</text>
</svg>

<svg viewBox="0 0 640 390" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <style>
    .ink { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.58; }
    .line { fill: none; stroke: currentColor; }
    .guide { fill: none; stroke: currentColor; stroke-opacity: 0.2; stroke-dasharray: 3 3; }
    .panel { fill: currentColor; fill-opacity: 0.035; stroke: currentColor; stroke-opacity: 0.16; }
    .amber { fill: #e2903a; }
    .amber-line { fill: none; stroke: #e2903a; }
    .blue { fill: #4c8dd6; }
    .blue-line { fill: none; stroke: #4c8dd6; }
    .green { fill: #5aa46a; }
    .green-line { fill: none; stroke: #5aa46a; }
  </style>
  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="currentColor"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#4c8dd6"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#e2903a"/>
    </marker>
  </defs>

  <text class="ink" x="320" y="26" text-anchor="middle" font-size="18" font-weight="750">one response assembles every LTI output</text>
  <rect class="panel" x="132" y="42" width="376" height="40" rx="7"/>
  <text class="ink" x="320" y="68" text-anchor="middle" font-size="18" font-weight="700">
    x[n] = <tspan class="amber">δ[n] + 2δ[n−1]</tspan>
  </text>

  <line class="amber-line" x1="320" y1="82" x2="320" y2="101" stroke-width="1.8" marker-end="url(#arrow-amber)"/>
  <text class="muted" x="332" y="98" font-size="12">decompose into two terms</text>

  <text class="amber" x="104" y="112" text-anchor="middle" font-size="12" font-weight="700">weighted impulses</text>
  <text class="ink" x="259" y="112" text-anchor="middle" font-size="12" font-weight="700">same LTI system T</text>
  <text class="blue" x="481" y="112" text-anchor="middle" font-size="12" font-weight="700">shifted responses</text>

  <!-- first impulse branch -->
  <rect class="panel" x="20" y="122" width="600" height="66" rx="6"/>
  <text class="amber" x="104" y="161" text-anchor="middle" font-size="18" font-weight="700">δ[n]</text>
  <line class="line" x1="145" y1="154" x2="209" y2="154" stroke-width="1.6" marker-end="url(#arrow-ink)"/>
  <rect x="216" y="134" width="86" height="40" rx="6" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <text class="ink" x="259" y="160" text-anchor="middle" font-size="17" font-weight="750">T</text>
  <line class="blue-line" x1="302" y1="154" x2="350" y2="154" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
  <text class="blue" x="398" y="160" text-anchor="end" font-size="17" font-weight="700">h[n]</text>
  <g font-size="15" text-anchor="middle">
    <rect x="410" y="134" width="46" height="40" rx="3" fill="#4c8dd6" fill-opacity="0.18" stroke="#4c8dd6"/>
    <rect x="456" y="134" width="46" height="40" rx="3" fill="#4c8dd6" fill-opacity="0.18" stroke="#4c8dd6"/>
    <rect x="502" y="134" width="46" height="40" rx="3" fill="#4c8dd6" fill-opacity="0.18" stroke="#4c8dd6"/>
    <rect x="548" y="134" width="46" height="40" rx="3" fill="none" stroke="currentColor" stroke-opacity="0.18"/>
    <text class="ink" x="433" y="160">1</text><text class="ink" x="479" y="160">0.5</text>
    <text class="ink" x="525" y="160">0.25</text><text class="muted" x="571" y="160">0</text>
  </g>

  <!-- delayed weighted impulse branch -->
  <rect class="panel" x="20" y="202" width="600" height="66" rx="6"/>
  <text class="amber" x="104" y="241" text-anchor="middle" font-size="18" font-weight="700">2δ[n−1]</text>
  <line class="line" x1="158" y1="234" x2="209" y2="234" stroke-width="1.6" marker-end="url(#arrow-ink)"/>
  <rect x="216" y="214" width="86" height="40" rx="6" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <text class="ink" x="259" y="240" text-anchor="middle" font-size="17" font-weight="750">T</text>
  <line class="blue-line" x1="302" y1="234" x2="320" y2="234" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
  <text class="blue" x="398" y="240" text-anchor="end" font-size="17" font-weight="700">2h[n−1]</text>
  <g font-size="15" text-anchor="middle">
    <rect x="410" y="214" width="46" height="40" rx="3" fill="none" stroke="currentColor" stroke-opacity="0.18"/>
    <rect x="456" y="214" width="46" height="40" rx="3" fill="#4c8dd6" fill-opacity="0.18" stroke="#4c8dd6"/>
    <rect x="502" y="214" width="46" height="40" rx="3" fill="#4c8dd6" fill-opacity="0.18" stroke="#4c8dd6"/>
    <rect x="548" y="214" width="46" height="40" rx="3" fill="#4c8dd6" fill-opacity="0.18" stroke="#4c8dd6"/>
    <text class="muted" x="433" y="240">0</text><text class="ink" x="479" y="240">2</text>
    <text class="ink" x="525" y="240">1</text><text class="ink" x="571" y="240">0.5</text>
  </g>

  <text class="muted" x="119" y="288" font-size="12">linearity keeps weights and addition</text>
  <text class="muted" x="402" y="288" font-size="12">time invariance keeps shifts</text>
  <path class="guide" d="M410 276H594"/>
  <text class="ink" x="602" y="286" text-anchor="middle" font-size="22" font-weight="750">+</text>

  <!-- assembled output -->
  <rect x="20" y="302" width="600" height="70" rx="7" fill="#5aa46a" fill-opacity="0.10" stroke="#5aa46a" stroke-width="1.5"/>
  <text class="green" x="398" y="330" text-anchor="end" font-size="16" font-weight="750">y[n] = h[n] + 2h[n−1]</text>
  <g font-size="16" font-weight="700" text-anchor="middle">
    <rect x="410" y="310" width="46" height="40" rx="3" fill="#5aa46a" fill-opacity="0.20" stroke="#5aa46a"/>
    <rect x="456" y="310" width="46" height="40" rx="3" fill="#5aa46a" fill-opacity="0.20" stroke="#5aa46a"/>
    <rect x="502" y="310" width="46" height="40" rx="3" fill="#5aa46a" fill-opacity="0.20" stroke="#5aa46a"/>
    <rect x="548" y="310" width="46" height="40" rx="3" fill="#5aa46a" fill-opacity="0.20" stroke="#5aa46a"/>
    <text class="ink" x="433" y="336">1</text><text class="ink" x="479" y="336">2.5</text>
    <text class="ink" x="525" y="336">1.25</text><text class="ink" x="571" y="336">0.5</text>
  </g>
  <text class="muted" x="398" y="362" text-anchor="end" font-size="12">sample index n</text>
  <g class="muted" font-size="12" text-anchor="middle">
    <text x="433" y="366">0</text><text x="479" y="366">1</text><text x="525" y="366">2</text><text x="571" y="366">3</text>
  </g>
</svg>

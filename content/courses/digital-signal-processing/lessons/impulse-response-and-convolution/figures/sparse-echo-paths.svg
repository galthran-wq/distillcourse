<svg viewBox="0 0 640 460" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <style>
    .ink { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.58; }
    .line { fill: none; stroke: currentColor; }
    .guide { fill: none; stroke: currentColor; stroke-opacity: 0.2; stroke-dasharray: 3 3; }
    .panel { fill: currentColor; fill-opacity: 0.035; stroke: currentColor; stroke-opacity: 0.16; }
    .amber { fill: #e2903a; }
    .amber-line { fill: none; stroke: #e2903a; }
    .blue { fill: #4c8dd6; }
    .blue-line { fill: none; stroke: #4c8dd6; }
    .green { fill: #5aa46a; }
    .green-line { fill: none; stroke: #5aa46a; }
  </style>
  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="currentColor"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#e2903a"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#4c8dd6"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#5aa46a"/>
    </marker>
  </defs>

  <text class="ink" x="320" y="25" text-anchor="middle" font-size="18" font-weight="750">three separated taps become three physical paths</text>
  <text class="ink" x="320" y="50" text-anchor="middle" font-size="15" font-weight="650">h[n] = δ[n] + aδ[n−400] + bδ[n−960]</text>
  <text class="muted" x="320" y="71" text-anchor="middle" font-size="13">f<tspan baseline-shift="sub" font-size="10">s</tspan> = 8 kHz · T<tspan baseline-shift="sub" font-size="10">s</tspan> = 0.125 ms · a and b are dimensionless gains</text>

  <!-- input fan and three paths -->
  <text class="ink" x="18" y="167" font-size="14" font-weight="700">input x[n]</text>
  <line class="line" x1="104" y1="162" x2="120" y2="162" stroke-width="1.6"/>
  <path class="line" d="M120 162V105M120 162V219" stroke-width="1.4"/>
  <circle cx="120" cy="162" r="4" fill="currentColor"/>

  <g>
    <text class="amber" x="136" y="94" font-size="14" font-weight="750">dry · gain 1</text>
    <line class="amber-line" x1="120" y1="105" x2="220" y2="105" stroke-width="2" marker-end="url(#arrow-amber)"/>
    <rect x="228" y="86" width="196" height="38" rx="5" fill="#e2903a" fill-opacity="0.10" stroke="#e2903a"/>
    <text class="ink" x="326" y="110" text-anchor="middle" font-size="14" font-weight="650">0 samples / 0 ms</text>
    <line class="amber-line" x1="424" y1="105" x2="525" y2="154" stroke-width="2" marker-end="url(#arrow-amber)"/>
  </g>
  <g>
    <text class="blue" x="136" y="149" font-size="14" font-weight="750">early echo · gain a</text>
    <line class="blue-line" x1="120" y1="162" x2="220" y2="162" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <rect x="228" y="143" width="196" height="38" rx="5" fill="#4c8dd6" fill-opacity="0.10" stroke="#4c8dd6"/>
    <text class="ink" x="326" y="167" text-anchor="middle" font-size="14" font-weight="650">400 samples / 50 ms</text>
    <line class="blue-line" x1="424" y1="162" x2="522" y2="162" stroke-width="2" marker-end="url(#arrow-blue)"/>
  </g>
  <g>
    <text class="green" x="136" y="206" font-size="14" font-weight="750">late echo · gain b</text>
    <line class="green-line" x1="120" y1="219" x2="220" y2="219" stroke-width="2" marker-end="url(#arrow-green)"/>
    <rect x="228" y="200" width="196" height="38" rx="5" fill="#5aa46a" fill-opacity="0.10" stroke="#5aa46a"/>
    <text class="ink" x="326" y="224" text-anchor="middle" font-size="14" font-weight="650">960 samples / 120 ms</text>
    <line class="green-line" x1="424" y1="219" x2="525" y2="170" stroke-width="2" marker-end="url(#arrow-green)"/>
  </g>

  <circle cx="542" cy="162" r="17" fill="none" stroke="currentColor" stroke-width="1.7"/>
  <text class="ink" x="542" y="168" text-anchor="middle" font-size="20" font-weight="750">Σ</text>
  <line class="line" x1="559" y1="162" x2="608" y2="162" stroke-width="1.8" marker-end="url(#arrow-ink)"/>
  <text class="ink" x="620" y="146" text-anchor="end" font-size="14" font-weight="700">output</text>
  <text class="ink" x="620" y="179" text-anchor="end" font-size="15" font-weight="700">y[n]</text>

  <rect class="panel" x="20" y="262" width="600" height="182" rx="7"/>
  <text class="ink" x="320" y="286" text-anchor="middle" font-size="14" font-weight="700">y[n] = x[n] + ax[n−400] + bx[n−960]</text>
  <text class="muted" x="320" y="306" text-anchor="middle" font-size="12">one transient, copied onto one ordinary integer line</text>

  <!-- proportional linear axis: 0 at 86, 400 at 280.2, 960 at 552 -->
  <line class="line" x1="64" y1="371" x2="590" y2="371" stroke-width="1.5" marker-end="url(#arrow-ink)"/>
  <text class="muted" x="600" y="376" font-size="12">n</text>
  <line class="guide" x1="86" y1="337" x2="86" y2="378"/>
  <line class="guide" x1="280.2" y1="337" x2="280.2" y2="378"/>
  <line class="guide" x1="552" y1="337" x2="552" y2="378"/>

  <!-- three copies of the same transient glyph -->
  <path class="amber-line" d="M74 371L78 362L82 345L86 336L90 350L94 361L100 371" stroke-width="2.5"/>
  <circle cx="86" cy="336" r="4" fill="#e2903a"/>
  <text class="amber" x="86" y="326" text-anchor="middle" font-size="12" font-weight="750">dry</text>
  <path class="blue-line" d="M268.2 371L272.2 362L276.2 345L280.2 336L284.2 350L288.2 361L294.2 371" stroke-width="2.5"/>
  <circle cx="280.2" cy="336" r="4" fill="#4c8dd6"/>
  <text class="blue" x="280.2" y="326" text-anchor="middle" font-size="12" font-weight="750">early echo</text>
  <path class="green-line" d="M540 371L544 362L548 345L552 336L556 350L560 361L566 371" stroke-width="2.5"/>
  <circle cx="552" cy="336" r="4" fill="#5aa46a"/>
  <text class="green" x="552" y="326" text-anchor="middle" font-size="12" font-weight="750">late echo</text>

  <g font-size="12" text-anchor="middle">
    <line class="line" x1="86" y1="367" x2="86" y2="377"/>
    <line class="line" x1="280.2" y1="367" x2="280.2" y2="377"/>
    <line class="line" x1="552" y1="367" x2="552" y2="377"/>
    <text class="ink" x="86" y="394" font-weight="650">0 samples</text>
    <text class="amber" x="86" y="411">0 ms</text>
    <text class="ink" x="280.2" y="394" font-weight="650">400 samples</text>
    <text class="blue" x="280.2" y="411">50 ms</text>
    <text class="ink" x="552" y="394" font-weight="650">960 samples</text>
    <text class="green" x="552" y="411">120 ms</text>
  </g>
  <text class="ink" x="320" y="436" text-anchor="middle" font-size="13" font-weight="750">linear time axis · no wrap</text>
</svg>

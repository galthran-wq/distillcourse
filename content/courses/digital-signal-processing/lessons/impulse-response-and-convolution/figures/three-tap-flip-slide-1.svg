<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Flip-and-slide convolution at output index zero</title>
  <desc id="desc">The input x of m equals one and two at indices zero and one. The reversed kernel h of minus m overlaps only x at index zero, producing y of zero equal to one.</desc>
  <style>
    .ink { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.56; }
    .ghost { fill: none; stroke: currentColor; stroke-width: 1; stroke-dasharray: 3 3; opacity: 0.24; }
    .amber-box { fill: #e2903a; fill-opacity: 0.11; stroke: #e2903a; stroke-width: 1.5; }
    .blue-box { fill: #4c8dd6; fill-opacity: 0.11; stroke: #4c8dd6; stroke-width: 1.5; }
    .active { fill: none; stroke: #5aa46a; stroke-width: 2.2; }
  </style>

  <text class="ink" x="320" y="24" text-anchor="middle" font-size="15" font-weight="700">flip → shift → multiply → sum</text>
  <text class="muted" x="320" y="46" text-anchor="middle" font-size="11.5">stored h = [1, 0.5, 0.25] · read left-to-right as h[n−m]</text>
  <line x1="28" y1="55" x2="612" y2="55" stroke="currentColor" opacity="0.16" />

  <text x="105" y="76" text-anchor="end" font-size="12" font-weight="700" fill="#e2903a">input x[m]</text>
  <text class="muted" x="105" y="94" text-anchor="end" font-size="10.5">x = [1, 2]</text>
  <rect class="ghost" x="125" y="67" width="48" height="38" rx="5" />
  <rect class="ghost" x="185" y="67" width="48" height="38" rx="5" />
  <rect class="amber-box" x="245" y="67" width="48" height="38" rx="5" />
  <rect class="amber-box" x="305" y="67" width="48" height="38" rx="5" />
  <rect class="ghost" x="365" y="67" width="48" height="38" rx="5" />
  <rect class="ghost" x="425" y="67" width="48" height="38" rx="5" />
  <rect class="ghost" x="485" y="67" width="48" height="38" rx="5" />
  <g class="ink" text-anchor="middle" font-size="13" font-weight="650">
    <text x="149" y="91" opacity="0.35">0</text><text x="209" y="91" opacity="0.35">0</text>
    <text x="269" y="91" fill="#e2903a">1</text><text x="329" y="91" fill="#e2903a">2</text>
    <text x="389" y="91" opacity="0.35">0</text><text x="449" y="91" opacity="0.35">0</text><text x="509" y="91" opacity="0.35">0</text>
  </g>
  <g class="muted" text-anchor="middle" font-size="10.5">
    <text x="149" y="120">−2</text><text x="209" y="120">−1</text><text x="269" y="120">0</text><text x="329" y="120">1</text><text x="389" y="120">2</text><text x="449" y="120">3</text><text x="509" y="120">4</text>
  </g>
  <text class="muted" x="548" y="120" font-size="10.5">sample index m</text>

  <text x="105" y="150" text-anchor="end" font-size="12" font-weight="700" fill="#4c8dd6">shifted kernel</text>
  <text class="ink" x="105" y="168" text-anchor="end" font-size="11.5" font-weight="650">n=0: h[−m]</text>
  <rect class="blue-box" x="125" y="139" width="48" height="38" rx="5" />
  <rect class="blue-box" x="185" y="139" width="48" height="38" rx="5" />
  <rect class="blue-box" x="245" y="139" width="48" height="38" rx="5" />
  <rect class="ghost" x="305" y="139" width="48" height="38" rx="5" />
  <rect class="ghost" x="365" y="139" width="48" height="38" rx="5" />
  <rect class="ghost" x="425" y="139" width="48" height="38" rx="5" />
  <rect class="ghost" x="485" y="139" width="48" height="38" rx="5" />
  <g text-anchor="middle" font-size="13" font-weight="650">
    <text x="149" y="163" fill="#4c8dd6">0.25</text><text x="209" y="163" fill="#4c8dd6">0.5</text><text x="269" y="163" fill="#4c8dd6">1</text>
    <text class="ink" x="329" y="163" opacity="0.35">0</text><text class="ink" x="389" y="163" opacity="0.35">0</text><text class="ink" x="449" y="163" opacity="0.35">0</text><text class="ink" x="509" y="163" opacity="0.35">0</text>
  </g>

  <rect class="active" x="241" y="63" width="56" height="118" rx="7" />
  <text x="269" y="134" text-anchor="middle" font-size="14" font-weight="800" fill="#5aa46a">×</text>

  <text class="muted" x="105" y="219" text-anchor="end" font-size="11">overlap products</text>
  <rect x="125" y="195" width="365" height="44" rx="6" fill="currentColor" fill-opacity="0.035" stroke="currentColor" stroke-opacity="0.16" />
  <text class="ink" x="307" y="222" text-anchor="middle" font-size="13" font-weight="600">m=0: 1×1 = <tspan fill="#5aa46a" font-weight="750">1</tspan></text>
  <rect x="505" y="195" width="107" height="44" rx="6" fill="#5aa46a" fill-opacity="0.13" stroke="#5aa46a" stroke-width="1.5" />
  <text x="558" y="210" text-anchor="middle" font-size="10.5" fill="#5aa46a" font-weight="700">OUTPUT n=0</text>
  <text class="ink" x="558" y="229" text-anchor="middle" font-size="14" font-weight="750">y[0] = 1</text>

  <g transform="translate(125 259)">
    <rect class="ghost" x="0" y="-10" width="20" height="15" rx="3" />
    <text class="muted" x="29" y="2" font-size="10.5">zero extension</text>
    <line x1="132" y1="-3" x2="152" y2="-3" stroke="#5aa46a" stroke-width="2" />
    <text class="muted" x="161" y="2" font-size="10.5">active overlap</text>
  </g>
  <text class="muted" x="320" y="286" text-anchor="middle" font-size="10.5">Only aligned cells multiply; no line implies values between integer samples.</text>
</svg>

<svg font-family="system-ui,sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 330" role="img" aria-labelledby="title desc" focusable="false" data-mobile-scroll="peak-estimation">
  <title id="title">Parabolic interpolation error falls with padding</title>
  <desc id="desc">Worst absolute frequency error across a one-bin sweep is shown for rectangular, periodic Hann, and periodic Blackman windows as padding increases from one to thirty-two times.</desc>
  <style>
    .t{fill:currentColor}.muted{opacity:.58}.axis{stroke:currentColor;stroke-width:1;opacity:.58}.grid{stroke:currentColor;stroke-width:1;opacity:.13}.series{fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.rect{stroke:#e2903a}.hann{stroke:#4c8dd6}.black{stroke:currentColor;stroke-dasharray:5 4}.dot{stroke-width:1}
  </style>
  <text class="t" x="90" y="23" font-size="15" font-weight="700">Worst error over a one-original-bin sweep</text>
  <text x="90" y="41" font-size="12" class="t muted">absolute frequency error (original-bin units, log scale)</text>
  <g aria-hidden="true">
    <line class="grid" x1="90" y1="57.4" x2="490" y2="57.4"/><text class="t" x="80" y="61.4" font-size="12" text-anchor="end">10⁻¹</text><line class="grid" x1="90" y1="119.9" x2="490" y2="119.9"/><text class="t" x="80" y="123.9" font-size="12" text-anchor="end">10⁻³</text><line class="grid" x1="90" y1="182.5" x2="490" y2="182.5"/><text class="t" x="80" y="186.5" font-size="12" text-anchor="end">10⁻⁵</text><line class="grid" x1="90" y1="245" x2="490" y2="245"/><text class="t" x="80" y="249" font-size="12" text-anchor="end">10⁻⁷</text>
    <line class="axis" x1="90" y1="48" x2="90" y2="245"/><line class="axis" x1="90" y1="245" x2="490" y2="245"/>
    <line class="grid" x1="90" y1="48" x2="90" y2="245"/><line class="axis" x1="90" y1="245" x2="90" y2="250"/><text class="t" x="90" y="267" font-size="12" text-anchor="middle">1</text><line class="grid" x1="170" y1="48" x2="170" y2="245"/><line class="axis" x1="170" y1="245" x2="170" y2="250"/><text class="t" x="170" y="267" font-size="12" text-anchor="middle">2</text><line class="grid" x1="250" y1="48" x2="250" y2="245"/><line class="axis" x1="250" y1="245" x2="250" y2="250"/><text class="t" x="250" y="267" font-size="12" text-anchor="middle">4</text><line class="grid" x1="330" y1="48" x2="330" y2="245"/><line class="axis" x1="330" y1="245" x2="330" y2="250"/><text class="t" x="330" y="267" font-size="12" text-anchor="middle">8</text><line class="grid" x1="410" y1="48" x2="410" y2="245"/><line class="axis" x1="410" y1="245" x2="410" y2="250"/><text class="t" x="410" y="267" font-size="12" text-anchor="middle">16</text><line class="grid" x1="490" y1="48" x2="490" y2="245"/><line class="axis" x1="490" y1="245" x2="490" y2="250"/><text class="t" x="490" y="267" font-size="12" text-anchor="middle">32</text>
    <polyline class="series rect" points="90,50.4 170,88.2 250,119.3 330,148.1 410,176.5 490,204.8"/>
    <polyline class="series hann" points="90,82.3 170,113.3 250,142.2 330,170.5 410,198.8 490,227.1"/>
    <polyline class="series black" points="90,94.2 170,123.5 250,152.0 330,180.3 410,208.5 490,236.8"/>
    <circle cx="90" cy="50.4" r="3.3" fill="#e2903a" stroke="currentColor" class="dot"/><circle cx="170" cy="88.2" r="3.3" fill="#e2903a" stroke="currentColor" class="dot"/><circle cx="250" cy="119.3" r="3.3" fill="#e2903a" stroke="currentColor" class="dot"/><circle cx="330" cy="148.1" r="3.3" fill="#e2903a" stroke="currentColor" class="dot"/><circle cx="410" cy="176.5" r="3.3" fill="#e2903a" stroke="currentColor" class="dot"/><circle cx="490" cy="204.8" r="3.3" fill="#e2903a" stroke="currentColor" class="dot"/><rect x="86.8" y="79.1" width="6.4" height="6.4" fill="#4c8dd6" stroke="currentColor" class="dot"/><rect x="166.8" y="110.1" width="6.4" height="6.4" fill="#4c8dd6" stroke="currentColor" class="dot"/><rect x="246.8" y="139" width="6.4" height="6.4" fill="#4c8dd6" stroke="currentColor" class="dot"/><rect x="326.8" y="167.3" width="6.4" height="6.4" fill="#4c8dd6" stroke="currentColor" class="dot"/><rect x="406.8" y="195.60000000000002" width="6.4" height="6.4" fill="#4c8dd6" stroke="currentColor" class="dot"/><rect x="486.8" y="223.9" width="6.4" height="6.4" fill="#4c8dd6" stroke="currentColor" class="dot"/>
    <path d="M90 90.2l4 7h-8z" fill="currentColor"/><path d="M170 119.5l4 7h-8z" fill="currentColor"/><path d="M250 148l4 7h-8z" fill="currentColor"/><path d="M330 176.3l4 7h-8z" fill="currentColor"/><path d="M410 204.5l4 7h-8z" fill="currentColor"/><path d="M490 232.8l4 7h-8z" fill="currentColor"/>
  </g>
  <text class="t" x="505" y="208" font-size="12" font-weight="650" fill="#e2903a">Rectangular</text>
  <text class="t" x="505" y="228" font-size="12" font-weight="650" fill="#4c8dd6">Hann</text>
  <text class="t" x="505" y="247" font-size="12" font-weight="650">Blackman</text>
  <text class="t" x="290" y="291" font-size="13" text-anchor="middle">padding factor L/N</text>
  <text x="90" y="315" font-size="11" class="t muted">N = 64 · noiseless analytic tone · three-sample dB parabola</text>
</svg>

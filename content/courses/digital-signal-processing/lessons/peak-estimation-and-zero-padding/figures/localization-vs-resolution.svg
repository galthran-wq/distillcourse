<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 320" role="img" aria-labelledby="title desc" focusable="false">
  <title id="title">Choose localization or resolution</title>
  <desc id="desc">A decision splits an isolated peak toward denser FFT sampling and interpolation, while overlapping tones require a longer acquired record for a narrower physical lobe.</desc>
  <defs><marker id="arrow-accent" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l8 4-8 4z" fill="#e2903a"/></marker><marker id="arrow-support" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l8 4-8 4z" fill="#4c8dd6"/></marker></defs>
  <style>
    svg{font-family:system-ui,sans-serif}
    text{fill:currentColor}.muted{opacity:.6}.card{fill:currentColor;fill-opacity:.035;stroke:currentColor;stroke-opacity:.22;stroke-width:1.2}.pill{fill:currentColor;fill-opacity:.06;stroke:currentColor;stroke-opacity:.2}.flow{fill:none;stroke-width:2}
  </style>
  <rect x="130" y="18" width="360" height="48" rx="6" class="card"/>
  <text x="310" y="47" font-size="16" font-weight="700" text-anchor="middle">What must the spectrum support?</text>
  <path d="M310 66V82H164V99" class="flow" stroke="#e2903a" marker-end="url(#arrow-accent)"/><path d="M310 82H456V99" class="flow" stroke="#4c8dd6" marker-end="url(#arrow-support)"/>
  <rect x="22" y="101" width="276" height="196" rx="8" class="card"/>
  <rect x="322" y="101" width="276" height="196" rx="8" class="card"/>
  <text x="42" y="130" font-size="12" font-weight="750" letter-spacing=".7" fill="#e2903a">LOCALIZATION</text>
  <text x="42" y="157" font-size="16" font-weight="700">One isolated peak</text>
  <rect x="42" y="174" width="236" height="38" rx="5" class="pill"/>
  <text x="160" y="198" font-size="13" text-anchor="middle">keep N fixed · increase L</text>
  <path d="M160 212V230" class="flow" stroke="#e2903a" marker-end="url(#arrow-accent)"/>
  <text x="160" y="251" font-size="14" font-weight="700" text-anchor="middle" fill="#e2903a">Interpolate the peak</text>
  <text x="160" y="275" font-size="12" text-anchor="middle" class="muted">denser coordinates · same lobe</text>
  <text x="342" y="130" font-size="12" font-weight="750" letter-spacing=".7" fill="#4c8dd6">RESOLUTION</text>
  <text x="342" y="157" font-size="16" font-weight="700">Overlapping tones</text>
  <rect x="342" y="174" width="236" height="38" rx="5" class="pill"/>
  <text x="460" y="198" font-size="13" text-anchor="middle">acquire a longer record N</text>
  <path d="M460 212V230" class="flow" stroke="#4c8dd6" marker-end="url(#arrow-support)"/>
  <text x="460" y="251" font-size="14" font-weight="700" text-anchor="middle" fill="#4c8dd6">Narrow the physical lobe</text>
  <text x="460" y="275" font-size="12" text-anchor="middle" class="muted">more observation · new evidence</text>
</svg>

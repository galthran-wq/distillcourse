<svg viewBox="0 0 760 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Creator-designated Skywalker X8 training and validation maneuver partition</title>
  <desc id="desc">Seven whole training files, each with its own reset, may determine the model before it is frozen. Two separate validation files judge the frozen model only. Random row splits, a final twenty percent split, and lags across file boundaries are rejected.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="currentColor"/>
    </marker>
  </defs>
  <style>
    .ink { fill: currentColor; }
    .line { fill: none; stroke: currentColor; }
    .muted { fill: currentColor; opacity: 0.58; }
    .train-text { fill: #e2903a; }
    .valid-text { fill: #4c8dd6; }
    .train-box { fill: #e2903a; fill-opacity: 0.09; stroke: #e2903a; }
    .valid-box { fill: #4c8dd6; fill-opacity: 0.09; stroke: #4c8dd6; }
    .small { font-size: 12px; }
    .file { fill: currentColor; font-size: 15px; font-weight: 650; }
  </style>

  <text class="ink" x="20" y="25" font-size="18" font-weight="700">Creator-designated files: maneuver partition</text>
  <text class="muted" x="740" y="25" text-anchor="end" font-size="12">time runs → inside each file</text>

  <!-- Training is the amber subject: seven whole records may choose the model. -->
  <rect x="18" y="43" width="414" height="188" rx="8" class="train-box" stroke-width="1.4"/>
  <text class="train-text" x="32" y="65" font-size="14" font-weight="750">TRAIN — choices allowed</text>
  <text class="muted small" x="418" y="65" text-anchor="end">7 independent files</text>

  <!-- Four 3211 training maneuvers. Each leading bar is its own n=0 reset. -->
  <g>
    <rect x="32" y="78" width="91" height="48" rx="5" class="train-box" stroke-width="1.2"/>
    <line x1="42" y1="86" x2="42" y2="118" stroke="currentColor" stroke-width="3"/>
    <text class="train-text file" x="79" y="108" text-anchor="middle">3211_1</text>

    <rect x="130" y="78" width="91" height="48" rx="5" class="train-box" stroke-width="1.2"/>
    <line x1="140" y1="86" x2="140" y2="118" stroke="currentColor" stroke-width="3"/>
    <text class="train-text file" x="177" y="108" text-anchor="middle">3211_2</text>

    <rect x="228" y="78" width="91" height="48" rx="5" class="train-box" stroke-width="1.2"/>
    <line x1="238" y1="86" x2="238" y2="118" stroke="currentColor" stroke-width="3"/>
    <text class="train-text file" x="275" y="108" text-anchor="middle">3211_3</text>

    <rect x="326" y="78" width="91" height="48" rx="5" class="train-box" stroke-width="1.2"/>
    <line x1="336" y1="86" x2="336" y2="118" stroke="currentColor" stroke-width="3"/>
    <text class="train-text file" x="373" y="108" text-anchor="middle">3211_4</text>
  </g>

  <!-- Three doublet training maneuvers. The gaps are file boundaries, not missing time. -->
  <g>
    <rect x="49" y="139" width="112" height="48" rx="5" class="train-box" stroke-width="1.2"/>
    <line x1="59" y1="147" x2="59" y2="179" stroke="currentColor" stroke-width="3"/>
    <text class="train-text file" x="108" y="169" text-anchor="middle">doublet_1</text>

    <rect x="168" y="139" width="112" height="48" rx="5" class="train-box" stroke-width="1.2"/>
    <line x1="178" y1="147" x2="178" y2="179" stroke="currentColor" stroke-width="3"/>
    <text class="train-text file" x="227" y="169" text-anchor="middle">doublet_2</text>

    <rect x="287" y="139" width="112" height="48" rx="5" class="train-box" stroke-width="1.2"/>
    <line x1="297" y1="147" x2="297" y2="179" stroke="currentColor" stroke-width="3"/>
    <text class="train-text file" x="346" y="169" text-anchor="middle">doublet_3</text>
  </g>

  <line x1="32" y1="202" x2="43" y2="202" stroke="currentColor" stroke-width="3"/>
  <text class="muted" x="50" y="206" font-size="12">leading bar = reset n=0 · no lag crosses a block</text>

  <!-- Training-only choices collect at one frozen checkpoint. -->
  <path class="line" d="M432 137 H449" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="456" y="89" width="112" height="96" rx="7" class="line" stroke-width="1.5"/>
  <text class="ink" x="512" y="112" text-anchor="middle" font-size="13" font-weight="700">TRAINING ONLY</text>
  <text class="muted" x="512" y="134" text-anchor="middle" font-size="12">integrity · order</text>
  <text class="muted" x="512" y="151" text-anchor="middle" font-size="12">lag · fit</text>
  <text class="ink" x="512" y="174" text-anchor="middle" font-size="13" font-weight="750">FREEZE →</text>

  <!-- The gate is deliberately stronger than the surrounding lines. -->
  <line x1="583" y1="54" x2="583" y2="222" stroke="currentColor" stroke-width="3"/>
  <line x1="590" y1="54" x2="590" y2="222" stroke="currentColor" stroke-width="1" opacity="0.45"/>
  <text class="ink" x="587" y="43" text-anchor="middle" font-size="11" font-weight="750">NO RETURN</text>

  <!-- Validation is blue and judgment-only: two untouched, separately reset maneuvers. -->
  <rect x="607" y="43" width="135" height="188" rx="8" class="valid-box" stroke-width="1.4"/>
  <text class="valid-text" x="675" y="65" text-anchor="middle" font-size="14" font-weight="750">VALIDATE</text>
  <text class="valid-text" x="675" y="81" text-anchor="middle" font-size="11" font-weight="650">judge only</text>

  <rect x="619" y="94" width="111" height="48" rx="5" class="valid-box" stroke-width="1.2"/>
  <line x1="629" y1="102" x2="629" y2="134" stroke="currentColor" stroke-width="3"/>
  <text class="valid-text file" x="677" y="124" text-anchor="middle">3211_5</text>

  <rect x="619" y="154" width="111" height="48" rx="5" class="valid-box" stroke-width="1.2"/>
  <line x1="629" y1="162" x2="629" y2="194" stroke="currentColor" stroke-width="3"/>
  <text class="valid-text file" x="677" y="184" text-anchor="middle">doublet_4</text>
  <text class="valid-text" x="675" y="219" text-anchor="middle" font-size="11" font-weight="650">separate resets</text>

  <path class="line" d="M568 137 H579" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M601 137 H607" stroke="#4c8dd6" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Rejected shortcuts are visually separate from the valid path. -->
  <rect x="18" y="250" width="724" height="63" rx="7" class="line" stroke-width="1" stroke-dasharray="4 4" opacity="0.55"/>
  <text class="muted" x="32" y="274" font-size="11" font-weight="750">REJECTED</text>

  <g transform="translate(126 282)">
    <circle r="10" class="line" stroke-width="1.3" opacity="0.65"/>
    <path d="M-4 -4 L4 4 M4 -4 L-4 4" class="line" stroke-width="1.5"/>
    <text class="ink" x="18" y="5" font-size="13">not random rows</text>
  </g>
  <g transform="translate(335 282)">
    <circle r="10" class="line" stroke-width="1.3" opacity="0.65"/>
    <path d="M-4 -4 L4 4 M4 -4 L-4 4" class="line" stroke-width="1.5"/>
    <text class="ink" x="18" y="5" font-size="13">not final 20%</text>
  </g>
  <g transform="translate(535 282)">
    <circle r="10" class="line" stroke-width="1.3" opacity="0.65"/>
    <path d="M-4 -4 L4 4 M4 -4 L-4 4" class="line" stroke-width="1.5"/>
    <text class="ink" x="18" y="5" font-size="13">no cross-file lag</text>
  </g>
</svg>

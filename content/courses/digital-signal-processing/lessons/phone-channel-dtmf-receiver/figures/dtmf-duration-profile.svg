<svg viewBox="0 0 640 240" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <title>AT&amp;T duration profile with boundary fixtures</title>
  <desc>A duration number line assigns times through 23 milliseconds to non-operation, times strictly between 23 and 40 milliseconds to an unspecified region, and times from 40 milliseconds to the operation-duration side. Fixtures at 20, 25, and 45 milliseconds occupy the three regions.</desc>
  <defs>
    <pattern id="gray-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="currentColor" stroke-width="2" opacity="0.12"/>
    </pattern>
  </defs>
  <style>
    .ink { fill: currentColor; }
    .line { fill: none; stroke: currentColor; }
    .muted { fill: currentColor; opacity: 0.58; }
    .small { font-size: 11px; }
    .label { font-size: 12px; }
    .body { font-size: 13px; }
    .heading { font-size: 14px; font-weight: 650; }
  </style>

  <text class="heading ink" x="320" y="19" text-anchor="middle">AT&amp;T profile · duration gate</text>

  <!-- The axis is an original number-line construction, not a reproduction of a standards table. -->
  <rect x="50" y="82" width="248.4" height="42" rx="5" fill="currentColor" opacity="0.08"/>
  <rect x="50" y="82" width="248.4" height="42" rx="5" class="line" stroke-width="1.5"/>
  <rect x="298.4" y="82" width="183.6" height="42" fill="url(#gray-hatch)" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5 4"/>
  <rect x="482" y="82" width="108" height="42" rx="5" fill="#5aa46a" opacity="0.15"/>
  <path d="M482 82 H585 Q590 82 590 87 V119 Q590 124 585 124 H482 Z" fill="none" stroke="#5aa46a" stroke-width="2"/>

  <text class="body ink" x="174" y="108" text-anchor="middle" font-weight="650">non-operation</text>
  <text class="label ink" x="390" y="101" text-anchor="middle">23–40 ms</text>
  <text class="small muted" x="390" y="117" text-anchor="middle">unspecified</text>
  <text class="small ink" x="536" y="101" text-anchor="middle" font-weight="650">operation</text>
  <text class="small ink" x="536" y="117" text-anchor="middle">duration only</text>

  <!-- Closed boundary marks and inclusive labels assign 23 ms left and 40 ms right. -->
  <path d="M298.4 71 V135" class="line" stroke-width="2"/>
  <circle cx="298.4" cy="124" r="3.5" fill="currentColor"/>
  <path d="M482 71 V135" fill="none" stroke="#5aa46a" stroke-width="2.5"/>
  <circle cx="482" cy="124" r="4" fill="#5aa46a"/>
  <text class="label ink" x="286" y="150" text-anchor="end">≤23 ms / ≤184 samples</text>
  <text class="label ink" x="586" y="150" text-anchor="end">≥40 ms / ≥320 samples</text>

  <!-- Fixture pins use distinct shapes and levels as well as labels. -->
  <path d="M266 82 V48" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/>
  <path d="M261 43 l10 10 M271 43 l-10 10" class="line" stroke-width="2" stroke-linecap="round"/>
  <text class="label ink" x="250" y="42" text-anchor="end" font-weight="650">20 ms / 160</text>
  <text class="small muted" x="250" y="58" text-anchor="end">must reject</text>

  <path d="M320 124 V188" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/>
  <path d="M320 176 l6 6 -6 6 -6 -6 Z" fill="url(#gray-hatch)" stroke="currentColor" stroke-width="1.5"/>
  <text class="label ink" x="320" y="207" text-anchor="middle" font-weight="650">25 ms / 200</text>
  <text class="small muted" x="320" y="223" text-anchor="middle">indeterminate · exclude from conformance</text>

  <path d="M536 82 V48" stroke="#5aa46a" stroke-width="1.8"/>
  <path d="M531 47 l4 4 8 -10" fill="none" stroke="#5aa46a" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="label ink" x="578" y="42" text-anchor="end" font-weight="650">45 ms / 360</text>
  <text class="small muted" x="578" y="58" text-anchor="end">duration gate passes</text>

  <path d="M50 130 V136 M590 130 V136" class="line" opacity="0.45"/>
  <text class="small muted" x="50" y="150" text-anchor="middle">0</text>
  <text class="small muted" x="590" y="170" text-anchor="middle">50 ms</text>
</svg>

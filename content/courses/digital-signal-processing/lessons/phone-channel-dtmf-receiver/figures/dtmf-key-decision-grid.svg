<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <title>DTMF key decision grid</title>
  <desc>A four-by-four DTMF grid highlights the 770 hertz row and 1336 hertz column as candidate key 5. Only a candidate whose gates all pass reaches KEY; missing, duplicate, ambiguous, or failed evidence reaches REJECT.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L8 4 L0 8 Z" fill="currentColor"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L8 4 L0 8 Z" fill="#5aa46a"/>
    </marker>
  </defs>
  <style>
    .ink { fill: currentColor; }
    .line { fill: none; stroke: currentColor; }
    .muted { fill: currentColor; opacity: 0.58; }
    .small { font-size: 11px; }
    .label { font-size: 12px; }
    .body { font-size: 13px; }
    .key { font-size: 16px; font-weight: 650; }
    .heading { font-size: 14px; font-weight: 650; }
  </style>

  <text class="heading ink" x="280" y="18" text-anchor="middle">high group</text>
  <path d="M126 27 H434" class="line" opacity="0.35"/>
  <text class="label ink" x="163" y="52" text-anchor="middle">1209 Hz</text>
  <text class="label" x="241" y="52" text-anchor="middle" fill="#4c8dd6" font-weight="650">1336 Hz</text>
  <text class="label ink" x="319" y="52" text-anchor="middle">1477 Hz</text>
  <text class="label ink" x="397" y="52" text-anchor="middle">1633 Hz</text>

  <text class="heading ink" x="18" y="162" text-anchor="middle" transform="rotate(-90 18 162)">low group</text>
  <path d="M32 70 V254" class="line" opacity="0.35"/>
  <text class="label ink" x="102" y="97" text-anchor="end">697 Hz</text>
  <text class="label" x="102" y="143" text-anchor="end" fill="#e2903a" font-weight="650">770 Hz</text>
  <text class="label ink" x="102" y="189" text-anchor="end">852 Hz</text>
  <text class="label ink" x="102" y="235" text-anchor="end">941 Hz</text>

  <!-- Shape and line style preserve the selected row and column without color. -->
  <rect x="119" y="116" width="321" height="48" rx="5" fill="#e2903a" opacity="0.12"/>
  <path d="M119 116 H440 M119 164 H440" stroke="#e2903a" stroke-width="2" fill="none"/>
  <rect x="200" y="66" width="82" height="192" rx="5" fill="#4c8dd6" opacity="0.10"/>
  <path d="M200 66 V258 M282 66 V258" stroke="#4c8dd6" stroke-width="2" stroke-dasharray="5 4" fill="none"/>

  <!-- Original frequency matrix; no standards artwork or table styling is reproduced. -->
  <g class="line" stroke-width="1.2" opacity="0.72">
    <rect x="126" y="72" width="74" height="42" rx="5"/>
    <rect x="204" y="72" width="74" height="42" rx="5"/>
    <rect x="282" y="72" width="74" height="42" rx="5"/>
    <rect x="360" y="72" width="74" height="42" rx="5"/>
    <rect x="126" y="118" width="74" height="42" rx="5"/>
    <rect x="204" y="118" width="74" height="42" rx="5"/>
    <rect x="282" y="118" width="74" height="42" rx="5"/>
    <rect x="360" y="118" width="74" height="42" rx="5"/>
    <rect x="126" y="164" width="74" height="42" rx="5"/>
    <rect x="204" y="164" width="74" height="42" rx="5"/>
    <rect x="282" y="164" width="74" height="42" rx="5"/>
    <rect x="360" y="164" width="74" height="42" rx="5"/>
    <rect x="126" y="210" width="74" height="42" rx="5"/>
    <rect x="204" y="210" width="74" height="42" rx="5"/>
    <rect x="282" y="210" width="74" height="42" rx="5"/>
    <rect x="360" y="210" width="74" height="42" rx="5"/>
  </g>
  <g class="key ink" text-anchor="middle">
    <text x="163" y="99">1</text><text x="241" y="99">2</text><text x="319" y="99">3</text><text x="397" y="99">A</text>
    <text x="163" y="145">4</text><text x="241" y="145">5</text><text x="319" y="145">6</text><text x="397" y="145">B</text>
    <text x="163" y="191">7</text><text x="241" y="191">8</text><text x="319" y="191">9</text><text x="397" y="191">C</text>
    <text x="163" y="237">*</text><text x="241" y="237">0</text><text x="319" y="237">#</text><text x="397" y="237">D</text>
  </g>
  <rect x="207" y="121" width="68" height="36" rx="5" fill="none" stroke="#5aa46a" stroke-width="3"/>
  <path d="M256 139 l5 5 10 -12" fill="none" stroke="#5aa46a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <text class="heading ink" x="544" y="40" text-anchor="middle">one from each group</text>
  <path d="M440 139 H466" class="line" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="474" y="116" width="140" height="46" rx="6" fill="none" stroke="#5aa46a" stroke-width="2"/>
  <text class="body ink" x="544" y="136" text-anchor="middle">candidate 5</text>
  <text class="small muted" x="544" y="152" text-anchor="middle">770 + 1336 Hz</text>

  <path d="M544 162 V188" class="line" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="474" y="196" width="140" height="46" rx="6" fill="#e2903a" opacity="0.14" stroke="#e2903a" stroke-width="2"/>
  <text class="body ink" x="544" y="224" text-anchor="middle" font-weight="650">all gates pass</text>

  <path d="M526 242 V278" fill="none" stroke="#5aa46a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text class="small" x="513" y="263" text-anchor="end" fill="#5aa46a">yes</text>
  <rect x="474" y="286" width="104" height="44" rx="6" fill="#5aa46a" opacity="0.15" stroke="#5aa46a" stroke-width="2"/>
  <path d="M491 307 l5 5 10 -12" fill="none" stroke="#5aa46a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="heading ink" x="536" y="314" text-anchor="middle">KEY</text>

  <path d="M590 242 V349 H578" class="line" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text class="small muted" x="598" y="264">no</text>
  <rect x="474" y="342" width="104" height="44" rx="6" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="5 4"/>
  <path d="M491 356 l14 14 M505 356 l-14 14" class="line" stroke-width="2.2" stroke-linecap="round"/>
  <text class="heading ink" x="541" y="370" text-anchor="middle">REJECT</text>

  <text class="heading ink" x="62" y="290">reject directly</text>
  <g class="label ink">
    <rect x="62" y="306" width="100" height="30" rx="5" fill="none" stroke="currentColor" stroke-dasharray="4 3" opacity="0.7"/>
    <text x="112" y="326" text-anchor="middle">lone tone</text>
    <rect x="174" y="306" width="136" height="30" rx="5" fill="none" stroke="currentColor" stroke-dasharray="4 3" opacity="0.7"/>
    <text x="242" y="326" text-anchor="middle">two in one group</text>
    <rect x="322" y="306" width="116" height="30" rx="5" fill="none" stroke="currentColor" stroke-dasharray="4 3" opacity="0.7"/>
    <text x="380" y="326" text-anchor="middle">failed gate</text>
  </g>
  <path d="M438 321 H454 V364 H466" class="line" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text class="small muted" x="62" y="360">missing or ambiguous evidence</text>
</svg>

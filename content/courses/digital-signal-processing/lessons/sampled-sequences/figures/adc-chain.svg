<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <style>
    .ink { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.58; }
    .box { fill: none; stroke: currentColor; stroke-opacity: 0.24; stroke-width: 1.25; }
    .physical-box { fill: none; stroke: #e2903a; stroke-width: 1.5; }
    .code-box { fill: none; stroke: #4c8dd6; stroke-width: 1.5; }
    .cal-box { fill: none; stroke: #5aa46a; stroke-width: 1.5; }
    .line { fill: none; stroke: currentColor; stroke-width: 1.4; }
    .physical-line { fill: none; stroke: #e2903a; stroke-width: 1.8; }
    .code-line { fill: none; stroke: #4c8dd6; stroke-width: 1.8; }
    .amber { fill: #e2903a; }
    .blue { fill: #4c8dd6; }
    .green { fill: #5aa46a; }
  </style>

  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e2903a"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4c8dd6"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5aa46a"/>
    </marker>
  </defs>

  <text class="muted" x="20" y="24" font-size="12" font-weight="650" letter-spacing="1.1">ACQUISITION</text>
  <line x1="112" y1="20" x2="620" y2="20" stroke="currentColor" stroke-opacity="0.16"/>

  <!-- physical signal path -->
  <rect class="physical-box" x="18" y="54" width="104" height="104" rx="6"/>
  <text class="amber" x="70" y="78" text-anchor="middle" font-size="12" font-weight="750">MICROPHONE</text>
  <text class="ink" x="70" y="108" text-anchor="middle" font-size="17" font-style="italic">x<tspan baseline-shift="sub" font-size="11">c</tspan>(t)</text>
  <text class="muted" x="70" y="132" text-anchor="middle" font-size="12">physical voltage</text>
  <text class="amber" x="70" y="150" text-anchor="middle" font-size="12" font-weight="650">V</text>

  <line class="physical-line" x1="122" y1="106" x2="139" y2="106" marker-end="url(#arrow-amber)"/>

  <rect class="physical-box" x="143" y="54" width="112" height="104" rx="6"/>
  <text class="amber" x="199" y="78" text-anchor="middle" font-size="12" font-weight="750">ANTIALIAS</text>
  <text class="ink" x="199" y="105" text-anchor="middle" font-size="14">analog filter</text>
  <text class="muted" x="199" y="130" text-anchor="middle" font-size="12">passband B</text>
  <text class="muted" x="199" y="149" text-anchor="middle" font-size="12">B &lt; f<tspan baseline-shift="sub" font-size="9">s</tspan>/2</text>

  <line class="physical-line" x1="255" y1="106" x2="272" y2="106" marker-end="url(#arrow-amber)"/>

  <rect class="physical-box" x="276" y="54" width="92" height="104" rx="6"/>
  <text class="amber" x="322" y="78" text-anchor="middle" font-size="12" font-weight="750">SAMPLE</text>
  <text class="ink" x="322" y="105" text-anchor="middle" font-size="13">t<tspan baseline-shift="sub" font-size="9">n</tspan> = t<tspan baseline-shift="sub" font-size="9">0</tspan> + nT<tspan baseline-shift="sub" font-size="9">s</tspan></text>
  <text class="muted" x="322" y="132" text-anchor="middle" font-size="12">f<tspan baseline-shift="sub" font-size="9">s</tspan> = 1/T<tspan baseline-shift="sub" font-size="9">s</tspan></text>

  <line class="physical-line" x1="368" y1="106" x2="385" y2="106" marker-end="url(#arrow-amber)"/>

  <rect class="box" x="389" y="54" width="112" height="104" rx="6"/>
  <rect x="389" y="54" width="56" height="4" rx="2" fill="#e2903a"/>
  <rect x="445" y="54" width="56" height="4" rx="2" fill="#4c8dd6"/>
  <text class="ink" x="445" y="78" text-anchor="middle" font-size="12" font-weight="750">QUANTIZE</text>
  <text class="ink" x="445" y="104" text-anchor="middle" font-size="12">[V<tspan baseline-shift="sub" font-size="9">min</tspan>, V<tspan baseline-shift="sub" font-size="9">max</tspan>]</text>
  <text class="muted" x="445" y="129" text-anchor="middle" font-size="12">q V / code</text>
  <text class="amber" x="445" y="150" text-anchor="middle" font-size="12" font-weight="650">! clipping loses data</text>

  <line class="code-line" x1="501" y1="106" x2="518" y2="106" marker-end="url(#arrow-blue)"/>

  <rect class="code-box" x="522" y="54" width="100" height="104" rx="6"/>
  <text class="blue" x="572" y="78" text-anchor="middle" font-size="12" font-weight="750">BUFFER</text>
  <text class="ink" x="572" y="107" text-anchor="middle" font-size="17" font-style="italic">c[n]</text>
  <text class="muted" x="572" y="132" text-anchor="middle" font-size="12">integer code</text>
  <text class="blue" x="572" y="150" text-anchor="middle" font-size="12" font-weight="650">not volts</text>

  <!-- calibration path -->
  <path d="M 572 158 V 176 H 274 V 194" fill="none" stroke="#4c8dd6" stroke-width="1.4" stroke-dasharray="3 3"/>
  <text class="muted" x="20" y="213" font-size="12" font-weight="650" letter-spacing="1.1">CALIBRATION</text>
  <line x1="118" y1="209" x2="248" y2="209" stroke="currentColor" stroke-opacity="0.16"/>

  <text class="blue" x="274" y="217" text-anchor="middle" font-size="15" font-weight="700">c[n]</text>
  <line class="line" x1="302" y1="212" x2="329" y2="212" marker-end="url(#arrow-ink)"/>
  <rect class="cal-box" x="334" y="188" width="112" height="48" rx="6"/>
  <text class="green" x="390" y="207" text-anchor="middle" font-size="12" font-weight="750">CALIBRATE</text>
  <text class="muted" x="390" y="226" text-anchor="middle" font-size="12">offset c<tspan baseline-shift="sub" font-size="9">0</tspan> · step q</text>
  <line x1="446" y1="212" x2="473" y2="212" stroke="#5aa46a" stroke-width="1.8" marker-end="url(#arrow-green)"/>
  <text class="green" x="548" y="208" text-anchor="middle" font-size="14" font-weight="700">x[n] = (c[n] − c<tspan baseline-shift="sub" font-size="10">0</tspan>)q</text>
  <text class="muted" x="548" y="230" text-anchor="middle" font-size="12">voltage estimate · V</text>

  <rect x="248" y="253" width="374" height="31" rx="5" fill="currentColor" opacity="0.055"/>
  <text class="ink" x="435" y="274" text-anchor="middle" font-size="12" font-weight="600">unsaturated codes only · calibration cannot undo clipping</text>
</svg>

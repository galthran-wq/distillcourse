<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">A possible microphone trace and the discrete samples retained from it</title>
  <desc id="desc">The left panel shows a muted continuous curve passing through eight amber sample instants. The right panel shows the same eight values as separate stems with blank, unrepresented gaps.</desc>
  <style>
    .text { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.58; }
    .panel { fill: currentColor; opacity: 0.035; }
    .border { fill: none; stroke: currentColor; stroke-opacity: 0.14; }
    .axis { fill: none; stroke: currentColor; stroke-opacity: 0.42; stroke-width: 1.2; }
    .guide { stroke: currentColor; stroke-opacity: 0.18; stroke-width: 1; stroke-dasharray: 3 3; }
    .candidate { fill: none; stroke: currentColor; stroke-opacity: 0.48; stroke-width: 2.2; }
    .stem { stroke: currentColor; stroke-opacity: 0.48; stroke-width: 1.5; }
    .sample { fill: #e2903a; stroke: #e2903a; }
  </style>

  <rect class="panel" x="14" y="12" width="300" height="256" rx="6"/>
  <rect class="border" x="14" y="12" width="300" height="256" rx="6"/>
  <rect class="panel" x="326" y="12" width="300" height="256" rx="6"/>
  <rect class="border" x="326" y="12" width="300" height="256" rx="6"/>

  <g aria-label="Possible continuous microphone input">
    <text class="text" x="164" y="35" text-anchor="middle" font-size="14" font-weight="650">one possible continuous input x<tspan baseline-shift="sub" font-size="10">c</tspan>(t)</text>
    <text class="muted" x="164" y="53" text-anchor="middle" font-size="11.5">the path is a candidate, not retained data</text>

    <g transform="translate(27 76)" class="axis" aria-label="microphone glyph">
      <rect x="4" y="0" width="14" height="26" rx="7" stroke-width="1.5"/>
      <path d="M0 14v3a11 11 0 0 0 22 0v-3M11 28v8M5 36h12" stroke-width="1.5"/>
    </g>
    <text class="muted" x="38" y="121" text-anchor="middle" font-size="9.8">microphone</text>
    <text class="muted" x="38" y="133" text-anchor="middle" font-size="9.8">input</text>

    <line class="axis" x1="74" y1="148" x2="296" y2="148"/>
    <line class="axis" x1="74" y1="70" x2="74" y2="216"/>
    <text class="muted" x="69" y="76" text-anchor="end" font-size="10.5">voltage</text>
    <text class="muted" x="296" y="166" text-anchor="end" font-size="10.5">time t</text>

    <g>
      <line class="guide" x1="74" y1="69" x2="74" y2="216"/>
      <line class="guide" x1="104" y1="69" x2="104" y2="216"/>
      <line class="guide" x1="134" y1="69" x2="134" y2="216"/>
      <line class="guide" x1="164" y1="69" x2="164" y2="216"/>
      <line class="guide" x1="194" y1="69" x2="194" y2="216"/>
      <line class="guide" x1="224" y1="69" x2="224" y2="216"/>
      <line class="guide" x1="254" y1="69" x2="254" y2="216"/>
      <line class="guide" x1="284" y1="69" x2="284" y2="216"/>
    </g>

    <path class="candidate" d="M74 148 C84 148 94 103 104 103 C114 103 124 148 134 148 C144 148 154 193 164 193 C174 193 184 148 194 148 C204 148 214 103 224 103 C234 103 244 148 254 148 C264 148 274 193 284 193"/>
    <g>
      <circle class="sample" cx="74" cy="148" r="4.5"/>
      <circle class="sample" cx="104" cy="103" r="4.5"/>
      <circle class="sample" cx="134" cy="148" r="4.5"/>
      <circle class="sample" cx="164" cy="193" r="4.5"/>
      <circle class="sample" cx="194" cy="148" r="4.5"/>
      <circle class="sample" cx="224" cy="103" r="4.5"/>
      <circle class="sample" cx="254" cy="148" r="4.5"/>
      <circle class="sample" cx="284" cy="193" r="4.5"/>
    </g>
    <text x="184" y="225" text-anchor="middle" font-size="11.5" fill="#e2903a" font-weight="600">sample instants t<tspan baseline-shift="sub" font-size="9">n</tspan></text>
  </g>

  <g aria-label="Discrete sequence with unrepresented gaps">
    <text class="text" x="476" y="35" text-anchor="middle" font-size="14" font-weight="650">discrete sequence x[n]</text>
    <text class="muted" x="476" y="53" text-anchor="middle" font-size="11.5">retained values: [0, 1, 0, −1, 0, 1, 0, −1]</text>

    <line class="axis" x1="344" y1="148" x2="608" y2="148"/>
    <line class="axis" x1="350" y1="70" x2="350" y2="207"/>
    <text class="muted" x="344" y="77" text-anchor="end" font-size="10.5">x[n]</text>

    <g>
      <line class="stem" x1="360" y1="148" x2="360" y2="148"/>
      <line class="stem" x1="394" y1="148" x2="394" y2="103"/>
      <line class="stem" x1="428" y1="148" x2="428" y2="148"/>
      <line class="stem" x1="462" y1="148" x2="462" y2="193"/>
      <line class="stem" x1="496" y1="148" x2="496" y2="148"/>
      <line class="stem" x1="530" y1="148" x2="530" y2="103"/>
      <line class="stem" x1="564" y1="148" x2="564" y2="148"/>
      <line class="stem" x1="598" y1="148" x2="598" y2="193"/>
      <circle class="sample" cx="360" cy="148" r="4.5"/>
      <circle class="sample" cx="394" cy="103" r="4.5"/>
      <circle class="sample" cx="428" cy="148" r="4.5"/>
      <circle class="sample" cx="462" cy="193" r="4.5"/>
      <circle class="sample" cx="496" cy="148" r="4.5"/>
      <circle class="sample" cx="530" cy="103" r="4.5"/>
      <circle class="sample" cx="564" cy="148" r="4.5"/>
      <circle class="sample" cx="598" cy="193" r="4.5"/>
    </g>

    <g class="muted" font-size="10.5" text-anchor="middle">
      <text x="360" y="211">0</text><text x="394" y="211">1</text>
      <text x="428" y="211">2</text><text x="462" y="211">3</text>
      <text x="496" y="211">4</text><text x="530" y="211">5</text>
      <text x="564" y="211">6</text><text x="598" y="211">7</text>
    </g>
    <text class="muted" x="598" y="226" text-anchor="end" font-size="10.5">sample index n</text>

    <path class="axis" d="M501 234v6h24v-6"/>
    <text class="text" x="513" y="257" text-anchor="middle" font-size="11.5" font-weight="600">not represented by x[n]</text>
  </g>
</svg>

<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <style>
    .ink { fill: currentColor; }
    .line { fill: none; stroke: currentColor; }
    .muted { fill: currentColor; opacity: 0.58; }
    .panel { fill: none; stroke: currentColor; stroke-opacity: 0.18; stroke-width: 1.25; }
    .guide { fill: none; stroke: currentColor; stroke-opacity: 0.22; stroke-dasharray: 3 3; }
    .amber { fill: #e2903a; }
    .blue { fill: #4c8dd6; }
    .stem { stroke: currentColor; stroke-width: 2; }
    .dot { fill: currentColor; }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/>
    </marker>
  </defs>

  <text class="ink" x="320" y="22" text-anchor="middle" font-size="15" font-weight="650">same eight codes · same sample indices</text>

  <!-- 8 kHz panel -->
  <g>
    <rect class="panel" x="16" y="38" width="282" height="260" rx="7"/>
    <text class="amber" x="157" y="68" text-anchor="middle" font-size="23" font-weight="750">f<tspan baseline-shift="sub" font-size="15">s</tspan> = 8 kHz</text>
    <text class="muted" x="157" y="88" text-anchor="middle" font-size="12">T<tspan baseline-shift="sub" font-size="9">s</tspan> = 125 µs</text>

    <line class="guide" x1="48" y1="119" x2="270" y2="119"/>
    <line class="line" x1="48" y1="159" x2="270" y2="159" stroke-width="1.25"/>
    <line class="guide" x1="48" y1="199" x2="270" y2="199"/>
    <text class="muted" x="39" y="123" text-anchor="end" font-size="12">1</text>
    <text class="muted" x="39" y="163" text-anchor="end" font-size="12">0</text>
    <text class="muted" x="39" y="203" text-anchor="end" font-size="12">−1</text>

    <g class="stem">
      <line x1="54" y1="159" x2="54" y2="159"/><line x1="84" y1="159" x2="84" y2="119"/>
      <line x1="114" y1="159" x2="114" y2="159"/><line x1="144" y1="159" x2="144" y2="199"/>
      <line x1="174" y1="159" x2="174" y2="159"/><line x1="204" y1="159" x2="204" y2="119"/>
      <line x1="234" y1="159" x2="234" y2="159"/><line x1="264" y1="159" x2="264" y2="199"/>
    </g>
    <g class="dot">
      <circle cx="54" cy="159" r="4"/><circle cx="84" cy="119" r="4"/><circle cx="114" cy="159" r="4"/><circle cx="144" cy="199" r="4"/>
      <circle cx="174" cy="159" r="4"/><circle cx="204" cy="119" r="4"/><circle cx="234" cy="159" r="4"/><circle cx="264" cy="199" r="4"/>
    </g>
    <g class="muted" font-size="12" text-anchor="middle">
      <text x="54" y="219">0</text><text x="84" y="219">1</text><text x="114" y="219">2</text><text x="144" y="219">3</text>
      <text x="174" y="219">4</text><text x="204" y="219">5</text><text x="234" y="219">6</text><text x="264" y="219">7</text>
    </g>
    <text class="muted" x="159" y="239" text-anchor="middle" font-size="12">sample index n</text>
    <text class="ink" x="157" y="264" text-anchor="middle" font-size="15" font-weight="650">sample-span 0.875 ms</text>
    <text class="amber" x="157" y="286" text-anchor="middle" font-size="16" font-weight="700">modeled f<tspan baseline-shift="sub" font-size="11">0</tspan> = 2 kHz</text>
  </g>

  <!-- 48 kHz panel -->
  <g>
    <rect class="panel" x="342" y="38" width="282" height="260" rx="7"/>
    <text class="blue" x="483" y="68" text-anchor="middle" font-size="23" font-weight="750">f<tspan baseline-shift="sub" font-size="15">s</tspan> = 48 kHz</text>
    <text class="muted" x="483" y="88" text-anchor="middle" font-size="12">T<tspan baseline-shift="sub" font-size="9">s</tspan> = 20.833 µs</text>

    <line class="guide" x1="374" y1="119" x2="596" y2="119"/>
    <line class="line" x1="374" y1="159" x2="596" y2="159" stroke-width="1.25"/>
    <line class="guide" x1="374" y1="199" x2="596" y2="199"/>
    <text class="muted" x="365" y="123" text-anchor="end" font-size="12">1</text>
    <text class="muted" x="365" y="163" text-anchor="end" font-size="12">0</text>
    <text class="muted" x="365" y="203" text-anchor="end" font-size="12">−1</text>

    <g class="stem">
      <line x1="380" y1="159" x2="380" y2="159"/><line x1="410" y1="159" x2="410" y2="119"/>
      <line x1="440" y1="159" x2="440" y2="159"/><line x1="470" y1="159" x2="470" y2="199"/>
      <line x1="500" y1="159" x2="500" y2="159"/><line x1="530" y1="159" x2="530" y2="119"/>
      <line x1="560" y1="159" x2="560" y2="159"/><line x1="590" y1="159" x2="590" y2="199"/>
    </g>
    <g class="dot">
      <circle cx="380" cy="159" r="4"/><circle cx="410" cy="119" r="4"/><circle cx="440" cy="159" r="4"/><circle cx="470" cy="199" r="4"/>
      <circle cx="500" cy="159" r="4"/><circle cx="530" cy="119" r="4"/><circle cx="560" cy="159" r="4"/><circle cx="590" cy="199" r="4"/>
    </g>
    <g class="muted" font-size="12" text-anchor="middle">
      <text x="380" y="219">0</text><text x="410" y="219">1</text><text x="440" y="219">2</text><text x="470" y="219">3</text>
      <text x="500" y="219">4</text><text x="530" y="219">5</text><text x="560" y="219">6</text><text x="590" y="219">7</text>
    </g>
    <text class="muted" x="485" y="239" text-anchor="middle" font-size="12">sample index n</text>
    <text class="ink" x="483" y="264" text-anchor="middle" font-size="15" font-weight="650">sample-span ≈ 0.146 ms</text>
    <text class="blue" x="483" y="286" text-anchor="middle" font-size="16" font-weight="700">modeled f<tspan baseline-shift="sub" font-size="11">0</tspan> = 12 kHz</text>
  </g>

  <!-- changed field and consequences -->
  <text class="muted" x="320" y="57" text-anchor="middle" font-size="11">rate</text>
  <text class="ink" x="320" y="76" text-anchor="middle" font-size="15" font-weight="750">×6</text>
  <line class="line" x1="302" y1="84" x2="338" y2="84" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="16" y="313" width="608" height="35" rx="6" fill="currentColor" opacity="0.055"/>
  <text class="ink" x="320" y="336" text-anchor="middle" font-size="15" font-weight="650">
    unchanged codes <tspan class="muted">·</tspan> f<tspan baseline-shift="sub" font-size="10">0</tspan> ×6 <tspan class="muted">·</tspan> sample-span ÷6
  </text>
</svg>

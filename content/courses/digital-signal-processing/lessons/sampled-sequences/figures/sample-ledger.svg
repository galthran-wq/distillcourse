<svg viewBox="0 0 640 310" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Five-field record contract for an eight-sample sequence</title>
  <desc id="desc">Five aligned cards distinguish sample index, physical time, integer code, calibrated amplitude, and acquisition metadata. A correction strip crosses out index n measured in milliseconds and replaces it with either sample index n or time n times T sub s.</desc>
  <style>
    .text { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.58; }
    .card { fill: currentColor; fill-opacity: 0.035; stroke: currentColor; stroke-opacity: 0.16; }
    .strip { fill: currentColor; fill-opacity: 0.035; stroke: currentColor; stroke-opacity: 0.14; }
    .rule { stroke: currentColor; stroke-opacity: 0.16; }
    .amber { fill: #e2903a; }
    .blue { fill: #4c8dd6; }
    .green { fill: #5aa46a; }
  </style>

  <text class="text" x="320" y="24" text-anchor="middle" font-size="15" font-weight="650">one stored record · five declared fields</text>

  <g aria-label="Index field">
    <rect class="card" x="16" y="40" width="112" height="166" rx="5"/>
    <text class="amber" x="72" y="64" text-anchor="middle" font-size="13" font-weight="700">INDEX n</text>
    <line class="rule" x1="27" y1="75" x2="117" y2="75"/>
    <text class="text" x="28" y="98" font-size="11.5">n = 0, 1, …, 7</text>
    <text class="muted" x="28" y="122" font-size="10.5">domain</text>
    <text class="text" x="28" y="139" font-size="11">integers</text>
    <text class="muted" x="28" y="166" font-size="10.5">unit</text>
    <text class="text" x="28" y="183" font-size="11">none</text>
  </g>

  <g aria-label="Physical time field">
    <rect class="card" x="140" y="40" width="112" height="166" rx="5"/>
    <text class="blue" x="196" y="64" text-anchor="middle" font-size="12.5" font-weight="700">TIME nT<tspan baseline-shift="sub" font-size="9">s</tspan></text>
    <line class="rule" x1="151" y1="75" x2="241" y2="75"/>
    <text class="text" x="152" y="98" font-size="11">t<tspan baseline-shift="sub" font-size="8">n</tspan> = t<tspan baseline-shift="sub" font-size="8">0</tspan> + nT<tspan baseline-shift="sub" font-size="8">s</tspan></text>
    <text class="muted" x="152" y="122" font-size="10.5">spacing</text>
    <text class="text" x="152" y="139" font-size="11">T<tspan baseline-shift="sub" font-size="8">s</tspan> = 1 / f<tspan baseline-shift="sub" font-size="8">s</tspan></text>
    <text class="muted" x="152" y="166" font-size="10.5">unit</text>
    <text class="text" x="152" y="183" font-size="11">s or ms</text>
  </g>

  <g aria-label="Integer code field">
    <rect class="card" x="264" y="40" width="112" height="166" rx="5"/>
    <text class="text" x="320" y="64" text-anchor="middle" font-size="12.5" font-weight="700">INTEGER CODE</text>
    <line class="rule" x1="275" y1="75" x2="365" y2="75"/>
    <text class="text" x="276" y="98" font-size="11">c[n] = [0, 1, 0, −1,</text>
    <text class="text" x="276" y="116" font-size="11">0, 1, 0, −1]</text>
    <text class="muted" x="276" y="143" font-size="10.5">representation</text>
    <text class="text" x="276" y="160" font-size="11">converter code</text>
    <text class="muted" x="276" y="184" font-size="10.5">not yet volts</text>
  </g>

  <g aria-label="Calibrated amplitude field">
    <rect class="card" x="388" y="40" width="112" height="166" rx="5"/>
    <text class="green" x="444" y="64" text-anchor="middle" font-size="12.5" font-weight="700">AMPLITUDE x[n]</text>
    <line class="rule" x1="399" y1="75" x2="489" y2="75"/>
    <text class="text" x="400" y="98" font-size="10.7">x[n] =</text>
    <text class="text" x="400" y="116" font-size="10.7">(c[n] − c<tspan baseline-shift="sub" font-size="8">0</tspan>)q</text>
    <text class="muted" x="400" y="143" font-size="10.5">calibration</text>
    <text class="text" x="400" y="160" font-size="11">offset c<tspan baseline-shift="sub" font-size="8">0</tspan>, scale q</text>
    <text class="muted" x="400" y="184" font-size="10.5">q: V/code · x: V</text>
  </g>

  <g aria-label="Acquisition field">
    <rect class="card" x="512" y="40" width="112" height="166" rx="5"/>
    <text class="text" x="568" y="64" text-anchor="middle" font-size="12.5" font-weight="700">ACQUISITION</text>
    <line class="rule" x1="523" y1="75" x2="613" y2="75"/>
    <text class="text" x="524" y="98" font-size="10.8">f<tspan baseline-shift="sub" font-size="8">s</tspan> declared</text>
    <text class="text" x="524" y="119" font-size="10.8">analog passband</text>
    <text class="text" x="524" y="140" font-size="10.8">converter range</text>
    <text class="text" x="524" y="161" font-size="10.8">clipping checked</text>
    <text class="muted" x="524" y="184" font-size="10.3">reconstruction rule?</text>
  </g>

  <g aria-label="Axis label correction">
    <rect class="strip" x="16" y="222" width="608" height="72" rx="5"/>
    <text class="muted" x="30" y="245" font-size="10.5" font-weight="650">AXIS CHECK</text>

    <text class="text" x="130" y="269" text-anchor="middle" font-size="13" font-weight="600">n (ms)</text>
    <line x1="101" y1="258" x2="159" y2="272" stroke="currentColor" stroke-width="2"/>
    <line x1="101" y1="272" x2="159" y2="258" stroke="currentColor" stroke-width="2"/>
    <text class="muted" x="130" y="286" text-anchor="middle" font-size="10">incorrect: index + time unit</text>

    <text class="muted" x="213" y="268" text-anchor="middle" font-size="11">replace with</text>
    <text class="amber" x="315" y="263" text-anchor="middle" font-size="12.5" font-weight="650">sample index n</text>
    <text class="muted" x="407" y="263" text-anchor="middle" font-size="11">or</text>
    <text class="blue" x="516" y="263" text-anchor="middle" font-size="12.5" font-weight="650">time t = nT<tspan baseline-shift="sub" font-size="9">s</tspan> (ms)</text>
    <text class="muted" x="415" y="285" text-anchor="middle" font-size="10.5">choose the coordinate the ticks actually show</text>
  </g>
</svg>

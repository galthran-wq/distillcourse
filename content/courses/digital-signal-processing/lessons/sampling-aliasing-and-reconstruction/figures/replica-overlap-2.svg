<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 390" role="img" aria-labelledby="title desc">
  <title id="title">Separated sampled-spectrum replicas at 1000 hertz</title>
  <desc id="desc">Frame two adds triangular replicas centered at minus and plus 1000 hertz. Their nearest supports leave a 200 hertz gap around the central 400 hertz band.</desc>
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto-start-reverse"><path d="M0,0 L6,3 L0,6 Z" fill="currentColor"/></marker>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#e2903a" stroke-width="2"/></pattern>
  </defs>
  <g font-family="system-ui, sans-serif" fill="currentColor">
    <rect x="20" y="15" width="28" height="24" rx="5" fill="#e2903a"/>
    <text x="34" y="32" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">2</text>
    <text x="58" y="33" font-size="17" font-weight="700">Sampling adds neighboring copies</text>

    <rect x="20" y="48" width="600" height="42" rx="6" fill="currentColor" opacity="0.055"/>
    <text x="32" y="65" font-size="13">Normalized replica display: TₛXₛ(f) = Σₖ X_c(f − kfₛ)</text>
    <text x="32" y="82" font-size="12" opacity="0.62">Physical spectrum: Xₛ(f) = (1/Tₛ) × shown</text>
    <rect x="455" y="56" width="153" height="25" rx="5" fill="#e2903a" opacity="0.13"/>
    <text x="531.5" y="73" text-anchor="middle" font-size="13" font-weight="650" fill="#e2903a">1/Tₛ = fₛ = 1000 s⁻¹</text>

    <text x="17" y="197" text-anchor="middle" font-size="12" transform="rotate(-90 17 197)">normalized amplitude</text>
    <line x1="52" y1="258" x2="609" y2="258" stroke="currentColor" stroke-width="1.4"/>
    <path d="M604 254 L612 258 L604 262" fill="none" stroke="currentColor" stroke-width="1.4"/>
    <text x="606" y="246" text-anchor="end" font-size="13">f (Hz)</text>
    <line x1="52" y1="118" x2="52" y2="258" stroke="currentColor" stroke-width="1.2"/>

    <g stroke="currentColor" stroke-width="1" opacity="0.28" stroke-dasharray="3 3">
      <line x1="70.4" y1="106" x2="70.4" y2="258"/>
      <line x1="144" y1="106" x2="144" y2="258"/>
      <line x1="254.4" y1="106" x2="254.4" y2="258"/>
      <line x1="328" y1="106" x2="328" y2="258"/>
      <line x1="401.6" y1="106" x2="401.6" y2="258"/>
      <line x1="512" y1="106" x2="512" y2="258"/>
      <line x1="585.6" y1="106" x2="585.6" y2="258"/>
    </g>
    <g font-size="11" opacity="0.68" text-anchor="middle">
      <text x="70.4" y="274">−1400</text>
      <text x="144" y="274">−1000</text>
      <text x="254.4" y="274">−400</text>
      <text x="328" y="274">0</text>
      <text x="401.6" y="274">400</text>
      <text x="512" y="274">1000</text>
      <text x="585.6" y="274">1400</text>
    </g>

    <path d="M70.4 258 L144 126 L217.6 258 Z" fill="#e2903a" fill-opacity="0.08" stroke="#e2903a" stroke-width="2.6" stroke-dasharray="6 4" stroke-linejoin="round"/>
    <path d="M438.4 258 L512 126 L585.6 258 Z" fill="#e2903a" fill-opacity="0.08" stroke="#e2903a" stroke-width="2.6" stroke-dasharray="6 4" stroke-linejoin="round"/>
    <path d="M254.4 258 L328 126 L401.6 258 Z" fill="#4c8dd6" fill-opacity="0.12" stroke="#4c8dd6" stroke-width="3" stroke-linejoin="round"/>
    <text x="144" y="115" text-anchor="middle" font-size="13" font-weight="700" fill="#e2903a">k = −1 · −fₛ</text>
    <text x="328" y="115" text-anchor="middle" font-size="13" font-weight="700" fill="#4c8dd6">k = 0</text>
    <text x="512" y="115" text-anchor="middle" font-size="13" font-weight="700" fill="#e2903a">k = +1 · +fₛ</text>
    <text x="246" y="247" text-anchor="end" font-size="13" font-weight="650">−B</text>
    <text x="410" y="247" font-size="13" font-weight="650">B</text>
    <line x1="328" y1="126" x2="328" y2="258" stroke="#4c8dd6" stroke-width="1" stroke-dasharray="3 3" opacity="0.48"/>
    <line x1="401.6" y1="229" x2="438.4" y2="229" stroke="currentColor" stroke-width="1.4" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="420" y="218" text-anchor="middle" font-size="12" font-weight="700">200 Hz gap</text>

    <g transform="translate(93 294)" font-size="12">
      <line x1="0" y1="0" x2="27" y2="0" stroke="#4c8dd6" stroke-width="3"/>
      <text x="34" y="4">central copy</text>
      <line x1="145" y1="0" x2="172" y2="0" stroke="#e2903a" stroke-width="2.5" stroke-dasharray="5 4"/>
      <text x="179" y="4">neighbors</text>
      <line x1="294" y1="0" x2="321" y2="0" stroke="currentColor" stroke-width="3.5"/>
      <text x="328" y="4">summed overlap</text>
    </g>

    <rect x="20" y="315" width="600" height="57" rx="6" fill="currentColor" opacity="0.055"/>
    <text x="34" y="338" font-size="14" font-weight="750">SEPARATED · fₛ − 2B = 200 Hz</text>
    <text x="34" y="359" font-size="13" opacity="0.7">Strict edge: fₛ = 2B = 800 Hz; equality is not phase-safe.</text>
  </g>
</svg>

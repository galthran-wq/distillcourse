<svg viewBox="0 0 640 410" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Sinc reconstruction frame 3: Add the left neighbor</title>
  <desc id="desc">Frame 3 uses normalized sinc of v equal to sine pi v over pi v, with sinc zero defined as one. The active sample indices are {−1, 0, 1}. Each weighted kernel equals its sample value at its own integer instant and zero at every other integer instant. The reference waveform is sinc of open parenthesis u minus one half close parenthesis over two, whose displayed samples from n minus two through two are minus 0.1801, 0.3001, 0.9003, 0.9003, and 0.3001. Only the active terms form the running partial sum; inactive sample values are not yet matched. The kernel's unit height is distinct from the continuous-time reconstruction filter gain T sub s.</desc>
  <style>
    .ink{fill:currentColor}.muted{fill:currentColor;opacity:.58}.blue{fill:#4c8dd6}.amber{fill:#e2903a}
    .axis{fill:none;stroke:currentColor;stroke-opacity:.52}.guide{stroke:currentColor;stroke-opacity:.13;stroke-dasharray:3 4}
    .stem{stroke:currentColor;stroke-opacity:.46;stroke-width:1.5}.sample{fill:var(--panel,transparent);stroke:currentColor;stroke-width:1.8}
    .kernel-old{fill:none;stroke:#4c8dd6;stroke-width:1.7;stroke-opacity:.55}.kernel-new{fill:none;stroke:#e2903a;stroke-width:2.5}
    .sum{fill:none;stroke:currentColor;stroke-width:3.4;stroke-linejoin:round;stroke-linecap:round}
    .reference{fill:none;stroke:#4c8dd6;stroke-width:2.4;stroke-dasharray:7 5;stroke-linejoin:round}
    .strong{font-weight:740}.small{font-size:11px}.label{font-size:12px}.title{font-size:16px}
    .mobile-layout{display:none}
    @media(max-width:480px){.desktop-layout{display:none}.mobile-layout{display:inline}.mobile-layout .ref-label{display:none}}
  </style>

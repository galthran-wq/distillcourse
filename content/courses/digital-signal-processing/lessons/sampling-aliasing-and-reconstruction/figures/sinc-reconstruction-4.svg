<svg viewBox="0 0 640 410" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Sinc reconstruction frame 4: Add the outer pair; tails still continue</title>
  <desc id="desc">Frame 4 uses normalized sinc of v equal to sine pi v over pi v, with sinc zero defined as one. The active sample indices are {−2, −1, 0, 1, 2}. Each weighted kernel equals its sample value at its own integer instant and zero at every other integer instant. The reference waveform is sinc of open parenthesis u minus one half close parenthesis over two, whose displayed samples from n minus two through two are minus 0.1801, 0.3001, 0.9003, 0.9003, and 0.3001. The five-term running sum is explicitly compared with the dashed exact infinite-sum reference, and distant sample tails remain required. The kernel's unit height is distinct from the continuous-time reconstruction filter gain T sub s.</desc>

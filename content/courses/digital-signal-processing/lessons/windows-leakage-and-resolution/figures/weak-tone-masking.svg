<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="title desc">
  <title id="title">The rectangular-window strong kernel masks the weak tone at the worst tested phase</title>
  <desc id="desc">For N equals 128, the exact strong-only and full two-tone DTFT traces are compared at weak phase 90 degrees. In the declared neighborhood from q 25.5 to 26.5, local leakage is -24.71 decibels, the observed peak is -26.33 decibels, and the margin is -1.62 decibels, so the inclusive 3 decibel criterion fails.</desc>

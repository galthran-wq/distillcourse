schema_version: 1
policy:
  engineering_imaginary_unit: j
  dtft_sign: "analysis uses exp(-j omega n); synthesis uses exp(+j omega n)"
  dft_scale: "forward DFT unscaled; inverse DFT scaled by 1/N unless a library translation is stated"
  frequency_centering: "store bins in unshifted order 0..N-1; label any fftshift view explicitly"
  psd_units: "state power per radians/sample or power/Hz and include the conversion factor"
families:
  - family: indices-and-sequences
    first_lesson: sampled-sequences
    domain: discrete time
    symbols: ["n: integer time index", "k: DFT-bin index", "x[n], y[n]: sequences", "delta[n]: unit impulse"]
    spoken: "x at n; delta at n"
    example: "For x[0]=2 and x[3]=-1, x[n]=2 delta[n]-delta[n-3]; n is dimensionless."
    common_confusion: "Brackets denote discrete indices, not continuous-time function arguments; k acquires a physical frequency only after fs and N are known."
    source_translation: "Rename a source's dummy index if it collides with the course's bin k or decimation factor M."
  - family: continuous-versus-discrete-time
    first_lesson: sampled-sequences
    domain: acquisition boundary
    symbols: ["t: seconds", "x_c(t): continuous-time signal", "T_s: sampling period", "f_s=1/T_s: samples/second"]
    spoken: "x sub c of t; sampling period; sampling frequency"
    example: "At fs=8 kHz, sample n=12 is assigned physical time nTs=1.5 ms."
    common_confusion: "Never call n a time in seconds, and never infer values between samples without a reconstruction model."
    source_translation: "Translate sources that write x(t) for a stored sample array into x_c(t) before sampling and x[n] afterward."
  - family: frequency-axes
    first_lesson: complex-sinusoids-and-phasors
    domain: continuous and discrete frequency
    symbols: ["f: hertz", "Omega=2 pi f: radians/second", "omega=Omega T_s: radians/sample", "f_k=k f_s/N: bin-center frequency"]
    spoken: "capital omega; omega; f sub k"
    example: "A 1 kHz tone sampled at 8 kHz has omega=pi/4 radians/sample; in an N=16 DFT it is centered at k=2."
    common_confusion: "Omega is dimensional, omega is dimensionless and 2 pi-periodic, and k is an index."
    source_translation: "Convert every imported normalized-frequency convention—cycles/sample, radians/sample, or normalized-to-Nyquist—before comparing values."
  - family: systems-and-convolution
    first_lesson: impulse-response-and-convolution
    domain: discrete-time systems
    symbols: ["T{x}: system action", "h[n]: impulse response", "x*h: convolution", "sum_m x[m]h[n-m]: convolution sum"]
    spoken: "T of x; h at n; x convolved with h"
    example: "For x=[1,2] and h=[1,-1], x*h=[1,1,-2]."
    common_confusion: "The local dummy m is not the later uppercase M used for decimation, and finite buffers need an explicit boundary rule."
    source_translation: "Rewrite sources using k as the convolution dummy to m so DFT-bin k remains unambiguous."
  - family: complex-number-and-phase
    first_lesson: complex-sinusoids-and-phasors
    domain: complex plane
    symbols: ["j=sqrt(-1)", "exp(j theta): unit phasor", "Re{z}, Im{z}", "angle z: principal phase in (-pi,pi]"]
    spoken: "j; e to the j theta; real part; phase of z"
    example: "exp(j pi/2)=j has real projection 0, imaginary projection 1, and phase pi/2."
    common_confusion: "Phase is modulo 2 pi and undefined at zero magnitude; display the principal value in (-pi,pi], mapping -pi to +pi, and compare phases with circular error. Use engineering j consistently."
    source_translation: "Convert mathematical sources' i to j without changing the Fourier sign convention, then normalize displayed nonzero-magnitude phase to (-pi,pi]."
  - family: frequency-response
    first_lesson: dtft-and-frequency-response
    domain: unit circle
    symbols: ["H(exp(j omega)): DT frequency response", "|H(exp(j omega))|: magnitude", "angle H(exp(j omega)): phase", "tau_g(omega)=-d angle(H(exp(j omega)))/d omega: group delay"]
    spoken: "H on the unit circle; magnitude H; group delay"
    example: "For h=[1,1,1]/3, H(exp(j 2pi/3))=0."
    common_confusion: "H(exp(j omega)) is H(z) restricted to the unit circle; do not silently abbreviate it as H(omega), and group delay is not generally phase divided by frequency."
    source_translation: "Unwrap phase only on a connected nonzero-magnitude region before differentiating; require differentiability there, never bridge a response zero, and preserve any source delay convention explicitly."
  - family: fourier-transform-pair
    first_lesson: dtft-and-frequency-response
    domain: DTFT and finite DFT
    symbols: ["x[n] <-> X(exp(j omega))", "X[k]: N-point DFT", "W_N=exp(-j2pi/N): twiddle"]
    spoken: "x transforms to X; X at bin k; W sub N"
    example: "The N-point DFT samples the finite record's DTFT at omega_k=2pi k/N under the declared sign and scale."
    common_confusion: "Keep DTFT parentheses and DFT brackets distinct; a denser DFT grid is not a different window resolution."
    source_translation: "Translate source sign, forward/inverse scale, centered-bin order, and phase origin into the course convention before importing a result."
  - family: z-transform
    first_lesson: z-transform-poles-zeros-and-roc
    domain: complex z-plane
    symbols: ["X(z)=sum_n x[n]z^(-n)", "ROC: region of convergence", "p_i: poles", "z_i: zeros"]
    spoken: "X of z; region of convergence; pole p sub i"
    example: "1/(1-0.5z^-1) with |z|>0.5 represents (0.5)^n u[n]."
    common_confusion: "The same rational expression can represent different sequences under different ROCs; z_i is a zero, not the transform variable."
    source_translation: "Record whether a source states ROC explicitly or silently assumes causal rational systems."
  - family: windows-and-frames
    first_lesson: windows-leakage-and-resolution
    domain: finite records
    symbols: ["w[n]: analysis window", "W(exp(j omega)): window DTFT", "R: hop size", "ell: frame index", "x_ell[n]=x[n+ell R]w[n]: frame"]
    spoken: "w at n; hop R; frame ell"
    example: "A length-256 frame with R=128 advances 16 ms at fs=8 kHz."
    common_confusion: "N is a frame or FFT length only when stated; zero padding changes grid density, not the window's resolving power."
    source_translation: "State periodic versus symmetric window endpoints, centering, coherent gain, and phase origin for every imported window plot."
  - family: random-signals
    first_lesson: correlation-psd-and-welch
    domain: stochastic discrete time
    symbols: ["E{.}: expectation", "mu_x: mean", "r_xx[ell]: autocorrelation", "S_xx(exp(j omega)): PSD", "sigma_x^2: variance"]
    spoken: "expected value; r x x at lag ell; S x x"
    example: "For unit-variance white noise, r_xx[ell]=delta[ell] and the two-sided PSD is flat at 1 in power per radians/sample."
    common_confusion: "A sample average estimates an expectation; ell denotes lag here and frame index only in the STFT family."
    source_translation: "Translate biased/unbiased correlation, one-/two-sided PSD, per-Hz/per-radian units, and any 2pi factor before comparison."
  - family: filter-specifications
    first_lesson: fir-filter-design-and-verification
    domain: design constraints
    symbols: ["omega_p, omega_s: band edges", "delta_p, delta_s: ripple bounds", "A_s: stopband attenuation in dB", "H_d: desired response"]
    spoken: "passband edge; stopband edge; delta p; A sub s"
    example: "A lowpass may require omega_p=0.3pi, omega_s=0.4pi, delta_p=0.01, and A_s=60 dB on a dense verification grid."
    common_confusion: "Linear ripple and decibels are not interchangeable, and transition-band values are deliberately unspecified."
    source_translation: "Convert source peak-to-peak ripple, absolute ripple, and dB attenuation to one declared inequality before comparing designs."
  - family: quantization
    first_lesson: finite-word-realizations
    domain: amplitude grid
    symbols: ["b: bit depth", "q: quantization step", "e[n]=x_q[n]-x[n]: error", "Q{.}: quantizer"]
    spoken: "b bits; step q; quantization error"
    example: "For a rounding quantizer with q=1/8 and no overload, |e[n]| is at most q/2."
    common_confusion: "Use q for step size and reserve delta[n] for the impulse; granular error bounds do not apply during overload."
    source_translation: "State midrise/midtread, rounding/truncation, saturation/wrap, full-scale convention, and whether dither is subtractive."
  - family: multirate-polyphase
    first_lesson: decimation-interpolation-and-antialiasing
    domain: multiple sample-rate grids
    symbols: ["downarrow M: downsample by M", "uparrow L: upsample by L", "E_r(z): rth polyphase component", "L/M: rational rate ratio"]
    spoken: "down by M; up by L; E sub r"
    example: "48 kHz to 44.1 kHz uses L/M=147/160 after reducing the rate ratio."
    common_confusion: "Downsampling is not anti-alias filtering, and zero insertion is not complete interpolation until anti-image filtering."
    source_translation: "Write a sample rate on every block edge and verify whether a source states output/input or input/output ratio."
  - family: stft-and-filter-banks
    first_lesson: stft-spectrograms-and-reconstruction
    domain: time-frequency coefficients
    symbols: ["X[ell,k]: STFT coefficient", "g[n]: synthesis window", "H_k(z): analysis-channel filter", "F_k(z): synthesis-channel filter"]
    spoken: "X at frame ell, bin k; analysis filter k"
    example: "With N=256 and R=128, X[3,10] is the coefficient at frame 3 and bin 10; reconstruction uses the declared synthesis window g."
    common_confusion: "COLA for one window is not automatically WOLA for an analysis/synthesis pair, and ell is a frame index rather than correlation lag."
    source_translation: "Translate analysis centering, conjugation, phase origin, FFT scale, endpoint padding, and synthesis normalization before using source formulas."

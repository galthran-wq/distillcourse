schema_version: 1
sources:
  - title: Discrete-Time Signal Processing, 3rd Edition
    author: Alan V. Oppenheim and Ronald W. Schafer
    url: https://www.pearson.com/en-us/subject-catalog/p/discrete-time-signal-processing/P200000003226/9780137549771
    kind: textbook
    edition: "Locally researched accessible artifact: Second Edition (1999), Alan V. Oppenheim, Ronald W. Schafer, and John R. Buck. The initial canon named the Third Edition; all dossier chapter/page pointers use the Second Edition unless explicitly reverified."
    role: Rigorous core for discrete sequences, LTI convolution, DTFT and z-transform, DFT/FFT, sampling, structures, FIR/IIR design, multirate processing, random-signal review, and finite-word counterexamples.
    access: full
    where: User-provided complete local PDF at /home/ubuntu/oppenheim.pdf (895 physical PDF pages).
  - title: Understanding Digital Signal Processing, 3rd Edition
    author: Richard G. Lyons
    url: https://www.pearson.com/en-us/subject-catalog/p/understanding-digital-signal-processing/P200000000443?view=educator
    kind: textbook
    edition: Third Edition.
    role: Engineer-facing intuition and implementation checks for sampling, DFT/FFT conventions, FIR/IIR structures, quadrature signals, multirate processing, quantization, and numerical debugging.
    access: full
    where: User-provided complete local PDF at /home/ubuntu/UnderstandingDigitalSignalProcessing.pdf (858 physical PDF pages).
  - title: Multirate Systems and Filter Banks
    author: P. P. Vaidyanathan
    url: https://authors.library.caltech.edu/records/rmhds-22q28
    kind: textbook
    edition: Original Prentice Hall book; complete author-repository edition with rights reverted to the author.
    role: Authoritative derivations for decimation, interpolation, polyphase and noble identities, maximally decimated and perfect-reconstruction banks, paraunitary systems, subband quantization, and wavelets.
    access: full
    where: "CaltechAUTHORS, the California Institute of Technology's official repository, marks the record as an open book and provides the complete published work as downloadable PDFs: front matter, Chapters 1–14, Appendices A–E, glossary, summaries, bibliography, topic references, and index. Record: https://authors.library.caltech.edu/records/rmhds-22q28. The record notes that Prentice Hall's rights reverted to P. P. Vaidyanathan."
  - title: Introduction to Signal Processing
    author: Sophocles J. Orfanidis
    url: https://www.ece.rutgers.edu/~orfanidi/intro2sp/
    kind: textbook
    edition: Second Edition, 2023 author-hosted PDF.
    role: Open computational backbone for convolution, transforms, z-domain systems, FFT spectral analysis, FIR/IIR design, sample-rate conversion, smoothing, coding, and reproducible numerical work.
    access: full
    where: "Rutgers ECE's official Sophocles J. Orfanidis page at https://ece.rutgers.edu/orfanidis links the complete second edition and states that Orfanidis acquired the necessary licenses and made his books freely available. The linked legal full PDF is hosted by Rutgers Box at https://rutgers.app.box.com/s/92is8ajwe2b0liokflkqx1ul2fqqqa7l (direct PDF endpoint: https://rutgers.app.box.com/shared/static/92is8ajwe2b0liokflkqx1ul2fqqqa7l.pdf)."
  - title: The Scientist and Engineer's Guide to Digital Signal Processing
    author: Steven W. Smith
    url: http://www.dspguide.com/
    kind: textbook
    edition: Complete official electronic edition; 34 chapters, including chapters omitted from one print hardcover.
    role: Low-floor physical and numerical explanations for sample arrays, convolution, Fourier analysis, quantization, practical filters, fast convolution, audio applications, and implementation judgment.
    access: full
    where: The author/publisher's official site provides the complete book for free legal reading as browsable HTML and downloadable chapter PDFs at https://www.dspguide.com/pdfbook.htm. Its permissions page at https://www.dspguide.com/copyrite.htm explicitly permits downloading any or all of the electronic book for personal use.
  - title: Signals and Systems, MIT 6.003, Fall 2011
    author: Dennis Freeman
    url: https://ocw.mit.edu/courses/6-003-signals-and-systems-fall-2011/
    kind: syllabus
    edition: Fall 2011 MIT OpenCourseWare offering.
    role: Representation-first systems sequence and solved problems; anchors sampling, recurrence, frequency response, DTMF, measured flight-system identification, ECG filtering, audio-CD, and communications applications.
    access: full
    where: MIT OpenCourseWare's official course page at https://ocw.mit.edu/courses/6-003-signals-and-systems-fall-2011/ provides the syllabus, calendar, readings, 25 downloadable lecture-note PDFs, 25 lecture videos, 14 problem sets with solutions, and exams with solutions. The complete non-video course package is downloadable at https://ocw.mit.edu/courses/6-003-signals-and-systems-fall-2011/6.003-fall-2011.zip; video files are separately downloadable from the official course download page. MIT OCW publishes the course under its linked Creative Commons license.
  - title: The Fourier Transform and Its Applications, EE 261
    author: Brad Osgood
    url: https://see.stanford.edu/materials/lsoftaee261/book-fall-07.pdf
    kind: lecture-notes
    edition: Stanford Engineering Everywhere Fall 2007 complete course notes.
    role: Mathematical bridge for Fourier projection and duality, convolution, impulse-train sampling and interpolation, DFT indexing, FFT, and normalization discipline.
    access: full
    where: Stanford Engineering Everywhere hosts Brad Osgood's complete EE 261 lecture-note book at the official, legal URL https://see.stanford.edu/materials/lsoftaee261/book-fall-07.pdf.
  - title: Discrete-Time Signal Processing, MIT 6.341, Fall 2005
    author: Alan V. Oppenheim
    url: https://ocw.mit.edu/courses/6-341-discrete-time-signal-processing-fall-2005/
    kind: lecture-notes
    edition: Fall 2005 MIT OpenCourseWare offering; posted notes omit Lectures 1, 14, and 23 beyond schedule titles.
    role: Proof-conscious graduate ordering, counterexamples, structure and finite-precision distinctions, spectral-estimation misconceptions, multirate/polyphase projects, and STFT/filter-bank unification.
    access: full
    where: MIT OpenCourseWare's official course site provides the complete published course corpus at https://ocw.mit.edu/courses/6-341-discrete-time-signal-processing-fall-2005/. The lecture notes, problem sets and solutions, exams and solutions, and project files are individually downloadable, and MIT also provides a complete course package at https://ocw.mit.edu/courses/6-341-discrete-time-signal-processing-fall-2005/download/.
  - title: Spectral Analysis of Signals
    author: Petre Stoica and Randolph Moses
    url: https://user.it.uu.se/~pst23965/ref.html
    kind: textbook
    edition: Complete author-hosted Prentice Hall book PDF.
    role: Primary statistical source for PSD, periodograms and correlograms, Welch/refined nonparametric methods, AR/MA/ARMA models, MUSIC/ESPRIT, conditioning, model order, and measured-data studies.
    access: full
    where: Petre Stoica's official Uppsala University publications page at https://user.it.uu.se/~pst23965/ref.html identifies the book by Petre Stoica and Randolph Moses and explicitly links it as “AVAILABLE FOR DOWNLOAD.” The legal full-reading PDF is https://user.it.uu.se/~pst23965/SAS-new.pdf.
  - title: Spectral Audio Signal Processing
    author: Julius O. Smith III
    url: https://ccrma.stanford.edu/~jos/sasp/
    kind: textbook
    edition: Official maintained Stanford CCRMA linked-HTML edition; book publication 2011 with maintained 2026 pages.
    role: Primary computational-audio source for windows, peak estimation, PSD/Welch, STFT and WOLA, fast convolution, filter-bank duality, phase handling, and measured oboe/speech evidence.
    access: full
    where: "Julius O. Smith III's complete official online book is freely readable as linked HTML at Stanford CCRMA: https://ccrma.stanford.edu/~jos/sasp/. The root page is the detailed nested table of contents and links directly to every chapter, section, appendix, bibliography, and index page without authentication."
  - title: On the Use of Windows for Harmonic Analysis with the Discrete Fourier Transform
    author: Fredric J. Harris
    url: http://www.cs.cmu.edu/afs/cs/user/bhiksha/WWW/courses/dsp/spring2013/WWW/schedule/readings/windows_comparison2_harris.pdf
    kind: survey
    edition: Proceedings of the IEEE, vol. 66, no. 1, 1978.
    role: Canonical concentrated source for finite-record leakage, DFT-even conventions, coherent gain, ENBW, scalloping, resolution bandwidth, and the unequal-tone window experiment.
    access: full
    where: Carnegie Mellon University's School of Computer Science hosts the complete paper as a course reading at http://www.cs.cmu.edu/afs/cs/user/bhiksha/WWW/courses/dsp/spring2013/WWW/schedule/readings/windows_comparison2_harris.pdf (the same file is also available over HTTPS at https://www.cs.cmu.edu/afs/cs/user/bhiksha/WWW/courses/dsp/spring2013/WWW/schedule/readings/windows_comparison2_harris.pdf).
  - title: An Algorithm for the Machine Calculation of Complex Fourier Series
    author: James W. Cooley and John W. Tukey
    url: https://www.ams.org/journals/mcom/1965-19-090/S0025-5718-1965-0178586-1/S0025-5718-1965-0178586-1.pdf
    kind: primary-paper
    edition: Mathematics of Computation, vol. 19, no. 90, 1965.
    role: Primary historical source for composite FFT factorization, operation count, mixed radix, in-place stages, bit-reversed ordering, and machine-layout tradeoffs.
    access: full
    where: "The American Mathematical Society provides the complete article on its official Mathematics of Computation journal host at https://www.ams.org/journals/mcom/1965-19-090/S0025-5718-1965-0178586-1/S0025-5718-1965-0178586-1.pdf (DOI: https://doi.org/10.1090/S0025-5718-1965-0178586-1)."
  - title: "Seeing Circles, Sines, and Signals: A Compact Primer on Digital Signal Processing"
    author: Jack Schaedler
    url: https://jackschaedler.github.io/circles-sines-signals/
    kind: visual-resource
    edition: Complete interactive web primer, official repository commit b4f16340fd56495482366511e686374bf55255c2.
    role: Interaction and figure grammar for samples, phasors, alias families, DFT dot products, zero padding, and leakage; rigorous sources supply the missing normalization and boundary qualifications.
    access: full
    where: Jack Schaedler publishes the complete interactive primer at https://jackschaedler.github.io/circles-sines-signals/. Its linked public source repository is https://github.com/jackschaedler/circles-sines-signals; the repository README identifies the work as distributed under the Eclipse Public License 1.0.
  - title: "ITU-T Recommendations Q.23 and Q.24: DTMF Sending and Reception"
    author: International Telecommunication Union
    url: https://www.itu.int/rec/T-REC-Q.23
    kind: standard
    edition: Q.23 (11/1988) and Q.24 (11/1988), both currently listed by ITU-T as in force.
    role: Primary standards source for the DTMF frequency groups and keypad allocation, sending-frequency tolerance and distortion limit, receiver pair-validity rule, received-level/twist considerations, and timing parameters.
    access: full
    where: "Official ITU-T records provide freely readable English PDFs: Q.23 at https://www.itu.int/rec/T-REC-Q.23-198811-I and Q.24 at https://www.itu.int/rec/T-REC-Q.24-198811-I. Access permits verification, not republication: the recommendations remain ITU-copyrighted, and no redistribution or adaptation permission is inferred."

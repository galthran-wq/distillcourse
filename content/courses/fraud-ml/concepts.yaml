# Concept registry for fraud-ml. Append-mostly; every id referenced from
# course.yaml resolves here and introduced_in names the lesson that declares
# it under `introduces`. Concepts the classical-ml prerequisite already owns
# (precision-recall, roc-auc, calibration, class-imbalance, resampling-methods,
# data-leakage, cross-validation, gradient-boosting, shapley-value, k-means,
# pca) are NOT re-registered: this course applies them and says so in the
# briefs, never re-introduces them.
concepts:
  # ── module 1: the problem ───────────────────────────────────────────────
  - id: fraud-detection-system
    name: Layered fraud detection system
    definition: "The layers around a payment forced by its deadline and its label loop: terminal checks and blocking rules in real time, scoring rules and the data-driven model in near real time, human investigators offline"
    introduced_in: fraud-detection-system
  - id: alert-feedback-interaction
    name: Alert–feedback interaction
    definition: "Investigators label only the transactions the detector alerted (plus recent ones of the alerted cards), so the fastest labels are a sample the model itself chose"
    introduced_in: fraud-detection-system
  - id: verification-latency
    name: Verification latency
    definition: "The delay δ between a transaction and the moment its true label becomes known, through investigation or a customer dispute; unreported transactions are read as genuine"
    introduced_in: fraud-detection-system
  - id: card-not-present-fraud
    name: Card-not-present fraud
    definition: "Fraud on remote (internet, mail, phone) card payments using stolen credentials; over half of card losses on under a sixth of volume"
    introduced_in: financial-crime-typology
  - id: money-laundering-stages
    name: Placement, layering, integration
    definition: "The three stages of laundering — introducing illicit cash, moving it through transactions to obscure its origin, spending it — detected at transaction, account, business and ring level"
    introduced_in: financial-crime-typology
  - id: superimposition-fraud
    name: Superimposition fraud
    definition: "Fraudulent activity mixed into a legitimate account's own stream (as opposed to subscription fraud, where the whole account is fraudulent); account takeover is the card instance"
    introduced_in: financial-crime-typology
  - id: base-rate-funnel
    name: Base-rate funnel
    definition: "The arithmetic by which prevalence caps precision: at 1 in 1,000, a 99%-sensitive and 99%-specific detector flags ~11 per thousand of which ~1 is fraud"
    introduced_in: economics-of-detection
  - id: cost-matrix
    name: Cost matrix
    definition: "The four costs c_TN, c_FP, c_FN, c_TP of a detection decision; the fraud-specific form has a fixed alert cost and a false-negative cost that may depend on the amount"
    introduced_in: economics-of-detection
  - id: inspection-budget
    name: Inspection budget
    definition: "The number k of alerts investigators can work per period; alerts are a ranking cut at k, not a classification, and utility is maximised over the budget"
    introduced_in: economics-of-detection
  - id: transaction-simulator
    name: Transaction simulator
    definition: "The handbook's generator: customers and terminals on a grid, Poisson transaction counts, Gaussian amounts, three scripted fraud scenarios (amount > 220, compromised terminals for 28 days, ×5 amounts for 14 days)"
    introduced_in: canonical-datasets
  - id: label-completeness
    name: Label completeness
    definition: "Whether every positive in a dataset is labelled: card fraud labels are near-complete through disputes, laundering labels are radically incomplete, and a synthetic world's labels are complete by construction"
    introduced_in: canonical-datasets
  # ── module 2: rare positives ────────────────────────────────────────────
  - id: average-precision
    name: Average precision
    definition: "AP = Σ_n (R_n − R_{n−1}) P_n over the ranked list, the step-wise area under the precision–recall curve; a random ranker's AP equals the prevalence"
    introduced_in: alert-budget-metrics
  - id: precision-at-k
    name: Precision at k
    definition: "The fraction of the k highest-scored transactions of a day that are fraud; bounded above by (frauds that day)/k"
    introduced_in: alert-budget-metrics
  - id: card-precision-at-k
    name: Card precision at k
    definition: "Precision at k computed over cards (max score and max label per card per day), with cards already detected removed from later days; the operational metric for an investigator budget of k cards"
    introduced_in: alert-budget-metrics
  - id: delay-period
    name: Delay period
    definition: "The block between the training window and the test window whose labels were not yet available at training time; its width is the verification latency"
    introduced_in: delayed-labels-prequential
  - id: prequential-validation
    name: Prequential validation
    definition: "Forward-in-time folds each shifted one block into the past, every fold keeping the same train/delay/test geometry as the deployment; the estimate with the best agreement to the test week"
    introduced_in: delayed-labels-prequential
  - id: known-card-removal
    name: Known-card removal
    definition: "Dropping from each test day the transactions of cards whose fraud was already known at (day − delay), because the bank would have blocked them"
    introduced_in: delayed-labels-prequential
  - id: undersampling-calibration
    name: Undersampling calibration correction
    definition: "With negative-keep rate β, the undersampled posterior is p_s = p/(p + β(1−p)); the inverse p' = βp_s/(βp_s − p_s + 1) restores the full-data probability without changing the ranking"
    introduced_in: undersampling-calibration
  - id: matched-threshold
    name: Matched threshold
    definition: "τ' = βτ_s/((β−1)τ_s + 1), the threshold on the corrected probability p' that reproduces exactly the decisions of threshold τ_s on the undersampled posterior; for τ_s equal to the undersampled prior it equals the original prior"
    introduced_in: undersampling-calibration
  - id: imbalance-ratio
    name: Imbalance ratio
    definition: "IR = |positives|/|negatives| of a training set; the heuristic class-weight 1/IR and the sampling target of a rebalancing technique"
    introduced_in: imbalance-techniques-revisited
  - id: balanced-bagging
    name: Balanced bagging
    definition: "Bagging in which each bootstrap is rebalanced by random undersampling before its base learner is fitted; its gains on card data come from tree diversity, not from rebalancing"
    introduced_in: imbalance-techniques-revisited
  - id: example-dependent-cost
    name: Example-dependent cost
    definition: "A cost matrix whose false-negative entry is the transaction's own amount while the alert costs are a fixed administrative sum C_a"
    introduced_in: example-dependent-cost
  - id: savings-metric
    name: Savings
    definition: "(Cost_l − Cost(f))/Cost_l, the fraction of the do-nothing cost (the total fraud amount) a detector saves; can be negative"
    introduced_in: example-dependent-cost
  - id: bayes-minimum-risk
    name: Bayes-minimum-risk decision
    definition: "Flag a transaction iff its expected alert cost is at most its expected fraud loss: C_a ≤ Amt · P(fraud | x); the constant-cost special case is the threshold 1/(1 + C_FN/C_FP)"
    introduced_in: example-dependent-cost
  # ── module 3: features ──────────────────────────────────────────────────
  - id: rfm-aggregates
    name: RFM aggregates
    definition: "Recency, frequency and monetary summaries of an entity's past transactions at one or more aggregation levels (merchant, category, country, currency, global)"
    introduced_in: transaction-aggregates
  - id: windowed-aggregation
    name: Windowed aggregation
    definition: "Count and sum (or mean) over the entity's strictly earlier transactions within the last t_p hours or days"
    introduced_in: transaction-aggregates
  - id: conditional-aggregation
    name: Conditional aggregation
    definition: "A windowed aggregate restricted to the entity's earlier transactions that share a categorical value — type, country, merchant group — with the current one; the semantics differ from a fixed-merchant aggregate"
    introduced_in: transaction-aggregates
  - id: periodic-time-feature
    name: Periodic time feature
    definition: "A von Mises fit to an entity's clock times giving a circular mean and a confidence arc; the feature is whether the current time falls inside the arc"
    introduced_in: behavioural-profiles
  - id: peer-group-analysis
    name: Peer-group analysis
    definition: "Inter-account profiling: an account's statistic compared to the mean of k similar accounts at the same time, scored by a t-statistic"
    introduced_in: behavioural-profiles
  - id: break-point-analysis
    name: Break-point analysis
    definition: "Intra-account profiling: a fixed window split into an old and a new part, ranked by the t-test between their means"
    introduced_in: behavioural-profiles
  - id: delayed-terminal-risk
    name: Delayed terminal risk
    definition: "A terminal's fraud rate over the window [t − (d + w), t − d], computed as the difference of two rolling sums, so that only labels known by the delay d enter"
    introduced_in: point-in-time-features
  - id: point-in-time-join
    name: Point-in-time join
    definition: "An as-of join that attaches to each row the last feature value recorded up to, and never after, the row's timestamp"
    introduced_in: point-in-time-features
  - id: feature-store
    name: Feature store
    definition: "A time-keyed log of entity features that serves the same values to batch training (as-of a timestamp) and online scoring (latest value)"
    introduced_in: point-in-time-features
  - id: training-serving-skew
    name: Training–serving skew
    definition: "A difference between the feature values a model was trained on and the ones it receives in production, for the same logical feature"
    introduced_in: point-in-time-features
  # ── module 4: supervised ────────────────────────────────────────────────
  - id: weight-of-evidence
    name: Weight of evidence
    definition: "WOE of a bin = ln(share of non-frauds in the bin / share of frauds in the bin); the encoding that makes a logistic regression monotone in each variable"
    introduced_in: scorecards-woe
  - id: information-value
    name: Information value
    definition: "IV = Σ_bins (Dist_good − Dist_bad) · WOE, a variable's univariate predictive strength; < 0.02 useless, > 0.3 strong"
    introduced_in: scorecards-woe
  - id: points-scorecard
    name: Points scorecard
    definition: "Score = Offset + Factor · ln(odds) with Factor = pdo/ln 2, distributed as points per attribute; 20 points per doubling of the odds is the convention"
    introduced_in: scorecards-woe
  - id: best-estimated-vs-optimal
    name: Best-estimated vs optimal parameters
    definition: "The triplet of a model's performance at default parameters, at the parameters validation selects, and at the parameters that are truly optimal on the test — the gap is the cost of selection"
    introduced_in: gbm-model-selection
  - id: random-search
    name: Random search
    definition: "Sampling hyperparameter combinations at random instead of on a grid; explores important parameters at more distinct values for the same budget"
    introduced_in: gbm-model-selection
  - id: feed-forward-detector
    name: Feed-forward detector
    definition: "An MLP on engineered transaction features with a sigmoid output read as P(fraud), trained with binary cross-entropy and early stopping"
    introduced_in: neural-tabular-detectors
  - id: early-stopping-on-validation
    name: Early stopping on validation
    definition: "Stop training when the validation loss has not improved for patience + 1 epochs, keeping the best checkpoint"
    introduced_in: neural-tabular-detectors
  - id: entity-embedding
    name: Entity embedding
    definition: "A learned k-dimensional vector per categorical value, equivalent to a linear layer on the one-hot input; dimension ⌈log₂|C|⌉ by convention"
    introduced_in: neural-tabular-detectors
  # ── module 5: anomaly ───────────────────────────────────────────────────
  - id: point-contextual-collective-anomaly
    name: Point, contextual and collective anomalies
    definition: "An instance anomalous on its own; anomalous only given a context (user, season); or a group anomalous together though no member is"
    introduced_in: anomaly-detection-framing
  - id: label-regime
    name: Label regime
    definition: "Supervised (both classes labelled), semi-supervised (normal only), or unsupervised (none, with the assumption that normal dominates)"
    introduced_in: anomaly-detection-framing
  - id: anomaly-assumption
    name: Detector assumption
    definition: "The one statement about normal data each anomaly-detection family relies on — dense neighbourhoods, cluster membership, a stochastic model, a low-dimensional subspace — which doubles as its failure condition"
    introduced_in: anomaly-detection-framing
  - id: knn-distance-score
    name: kth-neighbour distance score
    definition: "Distance to the kth nearest neighbour (or count within a radius) as an anomaly score; fails where density varies"
    introduced_in: density-and-distance-scores
  - id: local-outlier-factor
    name: Local outlier factor
    definition: "The ratio of the average local density of a point's k neighbours to its own local density; high values are anomalies relative to their neighbourhood"
    introduced_in: density-and-distance-scores
  - id: mahalanobis-score
    name: Mahalanobis score
    definition: "(x − x̄)ᵀ S⁻¹ (x − x̄), the multivariate z-score; the statistical family's point-anomaly score and the robust-PCA score when q = p"
    introduced_in: density-and-distance-scores
  - id: isolation-path-length
    name: Isolation path length
    definition: "The number of random axis-parallel splits needed to isolate a point in an isolation tree; expected length c(n) = 2H(n−1) − 2(n−1)/n for a normal point"
    introduced_in: isolation-forest
  - id: isolation-score
    name: Isolation score
    definition: "s(x, n) = 2^{−E[h(x)]/c(n)}: near 1 for anomalies, 0.5 at the average path length, well below 0.5 for normal points"
    introduced_in: isolation-forest
  - id: swamping-masking
    name: Swamping and masking
    definition: "Normal points near anomalies that get isolated with them (swamping) and dense anomaly clusters that hide (masking); both cleared by sub-sampling to ψ = 256"
    introduced_in: isolation-forest
  - id: one-class-svm
    name: One-class SVM
    definition: "Separate the data from the origin in feature space by a hyperplane w·φ(x) − ρ = 0, with ν bounding the fraction of outliers; SVDD is the smallest enclosing sphere"
    introduced_in: one-class-and-reconstruction
  - id: reconstruction-error
    name: Reconstruction error
    definition: "The squared error between a point and its autoencoder reconstruction, used as an anomaly score after training on normal data"
    introduced_in: one-class-and-reconstruction
  - id: semi-supervised-fusion
    name: Semi-supervised fusion
    definition: "Combining an unsupervised score with a supervised model by score fusion, by adding the score as a feature, or by a shared-code network with a supervised head"
    introduced_in: one-class-and-reconstruction
  # ── module 6: graphs ────────────────────────────────────────────────────
  - id: transaction-graph
    name: Transaction graph
    definition: "A bipartite graph of cardholders and merchants (or accounts) whose edges are transactions with time-decayed weights; the tripartite form promotes each transaction to a node"
    introduced_in: fraud-as-a-graph
  - id: entity-resolution
    name: Entity resolution
    definition: "Adding edges between entities that share an identifier (card, device, address) so that accounts controlled by one person become one connected object"
    introduced_in: fraud-as-a-graph
  - id: laundering-motif
    name: Laundering motif
    definition: "A small subgraph pattern of money movement: fan-in, fan-out, gather-scatter, scatter-gather, cycle, random, bipartite, stack"
    introduced_in: fraud-as-a-graph
  - id: homophily-test
    name: Homophily test
    definition: "Comparing the observed fraction of cross-labelled edges to the 2lf expected under independence; dyadicity D and heterophilicity H as the two ratios"
    introduced_in: neighbourhood-and-centrality
  - id: egonet-features
    name: Egonet features
    definition: "Degree, triangles, density and their aggregates over a node's one-hop neighbourhood, including counts by neighbour label; paths of length k from A^k"
    introduced_in: neighbourhood-and-centrality
  - id: centrality-measures
    name: Centrality measures
    definition: "Closeness (inverse average geodesic distance), betweenness (share of shortest paths through the node) and PageRank as rankings of a node's position"
    introduced_in: neighbourhood-and-centrality
  - id: community-detection
    name: Community detection
    definition: "Partitioning a graph into densely connected groups by modularity (Louvain) or edge betweenness (Girvan–Newman); used to narrow a fraud search, not to assign it"
    introduced_in: communities-and-components
  - id: connected-components
    name: Connected components
    definition: "The maximal sets of nodes joined by any path, computed deterministically by union-find; run on entity-resolution edges alone they are the fraud rings"
    introduced_in: communities-and-components
  - id: identifier-degree-cap
    name: Identifier degree cap
    definition: "Excluding identifiers shared by more than a threshold of users (a coffee-shop IP, a library device) before shared-identifier edges are drawn, because a high-degree identifier links everyone"
    introduced_in: communities-and-components
  - id: relational-neighbour-classifier
    name: Relational neighbour classifier
    definition: "P(c | n) ∝ Σ_j w(n, n_j)·[label_j = c] over a node's neighbours; its probabilistic form uses the neighbours' class probabilities"
    introduced_in: guilt-by-association
  - id: random-walk-with-restart
    name: Random walk with restart
    definition: "ξ = αQξ + (1 − α)z with Q column-normalised and z the restart distribution; with z on known-fraud nodes it is fraud-personalised PageRank, solved by power iteration"
    introduced_in: guilt-by-association
  - id: exposure-score
    name: Exposure score
    definition: "The stationary mass a cardholder, merchant or transaction receives from a random walk restarting at labelled fraudulent transactions, with edge weights decayed by age"
    introduced_in: guilt-by-association
  - id: collective-inference
    name: Collective inference
    definition: "Joint labelling of linked nodes by iterating a relational model — Gibbs sampling, iterative classification, relaxation labelling, loopy belief propagation"
    introduced_in: guilt-by-association
  - id: message-passing
    name: Message passing
    definition: "Gather the neighbours' vectors, aggregate them (sum, mean or max), update the node's vector with a learned function; k layers reach k hops"
    introduced_in: graph-neural-networks
  - id: gcn-layer
    name: GCN layer
    definition: "H' = σ(Â H W) with Â = D̃^{−1/2}(A + I)D̃^{−1/2}; with a skip term X W̃ and zero graph weights it reduces to logistic regression on the node's own features"
    introduced_in: graph-neural-networks
  - id: neighbourhood-sampling
    name: Neighbourhood sampling
    definition: "Mini-batching a large graph by sampling each training node's k-hop neighbourhood and masking the loss to the nodes whose neighbourhoods are complete"
    introduced_in: graph-neural-networks
  # ── module 7: sequences and drift ───────────────────────────────────────
  - id: landmark-sequence
    name: Landmark sequence
    definition: "The fixed-length sequence of a landmark entity's (the cardholder's) previous transactions, padded with a sentinel row where history is short"
    introduced_in: sequence-models-for-transactions
  - id: sequence-detector
    name: Sequence detector
    definition: "A 1-D convolution, LSTM or attention model that reads the landmark sequence and scores the last transaction; competitive with aggregates on the simulator, better only on constrained (card-present) streams"
    introduced_in: sequence-models-for-transactions
  - id: hidden-markov-features
    name: Hidden-Markov likelihood features
    definition: "Likelihoods of a transaction sequence under HMMs fitted per perspective (genuine vs fraud, cardholder vs merchant, amount vs time delta) used as features for a supervised model"
    introduced_in: sequence-models-for-transactions
  - id: concept-drift-types
    name: Concept drift types
    definition: "A change in p(X) (virtual drift), in p(y) (prior shift) or in p(y | X) (real drift); only the last moves the decision boundary"
    introduced_in: concept-drift
  - id: drift-patterns
    name: Drift patterns
    definition: "Sudden, incremental, gradual and reoccurring change over time, as distinct from an outlier that is not drift"
    introduced_in: concept-drift
  - id: day-distinguishability
    name: Day distinguishability
    definition: "A label-free shift measure: pool two days' transactions, label each by its day, and read a classifier's AUC at telling them apart as the distance between the days"
    introduced_in: concept-drift
  - id: window-size-tradeoff
    name: Window-size trade-off
    definition: "On a changing stream a longer estimation window lowers variance and raises staleness; the right size depends on the unknown rate of change, so no fixed window is right forever"
    introduced_in: concept-drift
  - id: cumulative-sum-tests
    name: CUSUM and Page–Hinkley tests
    definition: "Memoryless detectors on a stream of numbers: CUSUM g_t = max(0, g_{t−1} + x_t − δ) alarms when g_t > λ; Page–Hinkley alarms when the cumulative deviation from the running mean exceeds its running minimum by λ"
    introduced_in: change-detectors
  - id: drift-detection-method
    name: Drift detection method (DDM)
    definition: "Bands on a learner's running error rate at p_min + 2σ_min (warning) and p_min + 3σ_min (drift), from the binomial variance of the error"
    introduced_in: change-detectors
  - id: adwin
    name: ADWIN
    definition: "An adaptive window that drops its older sub-window whenever two sub-window means differ by more than the Hoeffding cut ε_cut = √((1/2m) ln(4|W|/δ)), m the harmonic mean of their sizes; O(log W) memory"
    introduced_in: change-detectors
  - id: detector-run-length
    name: Detector run-length measures
    definition: "Mean time between false alarms on a stable stream (MTFA), mean time to detection after a change of size θ (MTD), missed-detection rate (MDR); ARL(0) = MTFA"
    introduced_in: change-detectors
  - id: prequential-stream-evaluation
    name: Prequential stream evaluation
    definition: "Interleaved test-then-train: predict each item, score, then learn from it; the landmark version is pessimistic, so a sliding window or fading factor tracks current performance"
    introduced_in: stream-learning-and-adaptation
  - id: forgetting-strategy
    name: Forgetting strategy
    definition: "How a stream learner drops old data: a fixed or variable window, a fading factor, reservoir sampling, or the fraud rule of keeping every past fraud and windowing the genuine"
    introduced_in: stream-learning-and-adaptation
  - id: adaptive-ensemble
    name: Adaptive ensemble
    definition: "A pool of models whose weights fall on error and whose members are added on an ensemble error and pruned below a threshold (DWM); streaming bagging by Poisson(1) copies"
    introduced_in: stream-learning-and-adaptation
  # ── module 8: adversary and feedback ────────────────────────────────────
  - id: minimum-cost-camouflage
    name: Minimum-cost camouflage
    definition: "The cheapest set of feature edits whose log-odds reduction closes the gap to the classifier's threshold — a 0-1 knapsack solved by dynamic programming over discretised log-odds"
    introduced_in: adversarial-classification
  - id: adversary-aware-classifier
    name: Adversary-aware classifier
    definition: "A classifier that replaces P(x' | +) by the mass of all pre-images that the adversary's optimal strategy would have camouflaged into x'"
    introduced_in: adversarial-classification
  - id: arms-race
    name: Arms race
    definition: "The repeated classifier–adversary game: the adversary's best edits lose their value once the classifier retrains and regain it once dropped, so utility oscillates rather than converging"
    introduced_in: adversarial-classification
  - id: sample-selection-bias
    name: Sample selection bias
    definition: "Training on a sample whose inclusion depends on the features, the label, or both; alert feedback is complete bias because selection depends on the label through the previous model"
    introduced_in: alert-feedback-selection-bias
  - id: feedback-samples
    name: Feedback samples
    definition: "F_t: all recent transactions of the cards alerted on day t, labelled by investigators at once; biased, few, fresh"
    introduced_in: alert-feedback-selection-bias
  - id: delayed-samples
    name: Delayed samples
    definition: "D_{t−δ}: all transactions of day t − δ, labelled by disputes or silence after the delay; unbiased, many, stale"
    introduced_in: alert-feedback-selection-bias
  - id: feedback-delayed-aggregation
    name: Feedback–delayed aggregation
    definition: "P_A(+|x) = αP_F(+|x) + (1 − α)P_D(+|x): two classifiers trained separately on feedbacks and on delayed samples, averaged; beats pooling them on alert precision"
    introduced_in: alert-feedback-selection-bias
  # ── module 9: governance ────────────────────────────────────────────────
  - id: decision-zones
    name: Decision zones
    definition: "Probability bands mapped to actions — approve, step up, review, decline — with automatic decisions at the extremes and a referral band for analysts"
    introduced_in: score-to-action
  - id: decision-table
    name: Decision table
    definition: "A rule set laid out as conditions × actions, contracted and minimised by merging columns; exposes conflicts and gaps mechanically"
    introduced_in: score-to-action
  - id: investigation-frontier
    name: Investigation frontier
    definition: "The stepwise boundary in the probability × amount plane above which expected fraud amount P · Amt justifies an investigation"
    introduced_in: score-to-action
  - id: false-positive-harm
    name: False-positive harm
    definition: "The cost of friction a wrong alert imposes: a blocked card, a lost customer, a de-risked segment; measured per group as well as in total"
    introduced_in: score-to-action
  - id: alert-attribution
    name: Alert attribution
    definition: "A decomposition of one alert's score into per-feature contributions that sum to the score (Shapley values), read against each feature's baseline"
    introduced_in: alert-explanations
  - id: rule-extraction
    name: Rule extraction
    definition: "Deriving an if-then rule set from an opaque model, decompositionally (from its parts) or pedagogically (from its input–output behaviour), judged by accuracy, conciseness and fidelity"
    introduced_in: alert-explanations
  - id: reason-code
    name: Reason code
    definition: "A short, customer-facing statement of the main factors behind a decision, the practical form of 'meaningful information about the logic involved'"
    introduced_in: alert-explanations
  - id: stability-index
    name: Stability index
    definition: "SSI = Σ_i (observed_i − expected_i) ln(observed_i/expected_i) over score or variable bins, the information value between two periods; < 0.10 green, 0.10–0.25 yellow, ≥ 0.25 red"
    introduced_in: model-risk-monitoring
  - id: performance-backtest
    name: Performance backtest
    definition: "Contrasting ex-ante predictions with ex-post outcomes each period: a ranking metric with absolute-change or bootstrap traffic lights, and a calibration test per probability pool"
    introduced_in: model-risk-monitoring
  - id: champion-challenger
    name: Champion–challenger
    definition: "Running a candidate model in parallel with the production model on live traffic before a direct, phased or parallel changeover; one stage of the model life cycle"
    introduced_in: model-risk-monitoring
  # ── module 10: EU regulation ────────────────────────────────────────────
  - id: transaction-monitoring-duty
    name: Transaction-monitoring duty
    definition: "AMLR Art 26 and Rec 72: ongoing scrutiny of all transactions against the customer's profile and expected activity, with risk-based intensity; Art 34(2)'s four triggers for closer examination"
    introduced_in: aml-transaction-monitoring-duty
  - id: suspicious-transaction-report
    name: Suspicious transaction report
    definition: "The report to the financial intelligence unit under AMLR Art 69 of any suspicion regardless of amount, with the three-working-day refraining rule of Art 71 and the tipping-off ban of Art 73"
    introduced_in: aml-transaction-monitoring-duty
  - id: linked-transactions
    name: Linked transactions
    definition: "AMLR Art 2(1)(20): transactions with identical or similar origin, destination, purpose or characteristics over a period, aggregated for thresholds — the legal hook for structuring detection"
    introduced_in: aml-transaction-monitoring-duty
  - id: assessment-record
    name: Assessment record
    definition: "AMLR Art 77: the record of every Art 69(2) assessment, kept five years whether or not a report was filed — the alert disposition as a legal record"
    introduced_in: aml-transaction-monitoring-duty
  - id: non-outsourceable-decision
    name: Non-outsourceable decision
    definition: "AMLR Art 18(3): the detection criteria, the customer risk profile, the onboarding and transaction decisions and the report can never be outsourced; a bought model is not outsourcing but liability stays"
    introduced_in: aml-automated-decisions-and-supervision
  - id: meaningful-human-intervention
    name: Meaningful human intervention
    definition: "AMLR Art 76(5): automated decisions to enter, refuse, maintain or exit a relationship, or to change due diligence, require meaningful human intervention, an explanation and a way to challenge"
    introduced_in: aml-automated-decisions-and-supervision
  - id: fiu-feedback-loop
    name: FIU feedback loop
    definition: "The financial intelligence unit's powers and duties under AMLD6: suspension (5 and 10 working days), monitoring orders, alerts, and at least annual feedback on report quality to each reporting entity"
    introduced_in: aml-automated-decisions-and-supervision
  - id: strong-customer-authentication
    name: Strong customer authentication
    definition: "PSD2 Art 4(30) and Art 97: two or more independent elements (knowledge, possession, inherence), dynamically linked to amount and payee for remote payments"
    introduced_in: psd2-sca-tra
  - id: transaction-risk-analysis
    name: Transaction risk analysis
    definition: "RTS Art 18: the exemption from SCA for a remote payment scored low-risk in real time, allowed only while the PSP's fraud rate is under the Annex reference and the amount under the band's threshold"
    introduced_in: psd2-sca-tra
  - id: fraud-rate-reference
    name: Reference fraud rate
    definition: "RTS Art 19 and Annex: the value-weighted rolling 90-day fraud rate per transaction type and band (cards 0.13% / 0.06% / 0.01% at EUR 100 / 250 / 500), with Art 20's two-quarter cessation and one-quarter reset"
    introduced_in: psd2-sca-tra
  - id: liability-shift
    name: Liability shift
    definition: "PSD2 Arts 73–74: the payer bears at most EUR 50 of an unauthorised payment and nothing if SCA was not required; the refund is due by the next business day"
    introduced_in: psd2-sca-tra
  - id: high-risk-ai-system
    name: High-risk AI system
    definition: "An AI system in an Annex III area (or a regulated product) that is subject to the AI Act's Arts 9–15 requirements and the provider and deployer duties; Art 6(3) exempts systems that do not materially influence the decision unless they profile natural persons"
    introduced_in: eu-ai-act-fraud
  - id: annex-iii-fraud-carve-out
    name: Annex III fraud carve-out
    definition: "Annex III 5(b): creditworthiness scoring of natural persons is high-risk 'with the exception of AI systems used for the purpose of detecting financial fraud' — a purpose-based clause of one entry only"
    introduced_in: eu-ai-act-fraud
  - id: post-market-monitoring
    name: Post-market monitoring
    definition: "AI Act Art 72: a documented system that collects and analyses performance data over the lifetime of a high-risk system, with Art 73's serious-incident deadlines"
    introduced_in: eu-ai-act-fraud
  - id: right-to-explanation
    name: Right to explanation
    definition: "AI Act Art 86: a person subject to a decision based mainly on a high-risk system's output may obtain clear and meaningful explanations of the system's role and the main elements of the decision"
    introduced_in: eu-ai-act-fraud
  - id: legitimate-interest-fraud
    name: Legitimate interest in fraud prevention
    definition: "GDPR Art 6(1)(f) with Recital 47: processing strictly necessary for preventing fraud is a legitimate interest, subject to the balancing test and reasonable expectations"
    introduced_in: gdpr-financial-crime-data
  - id: solely-automated-decision
    name: Solely automated decision
    definition: "GDPR Art 22: a decision based solely on automated processing with legal or similarly significant effect, which the data subject has the right not to be subject to unless contract, law with safeguards or explicit consent applies"
    introduced_in: gdpr-financial-crime-data
  - id: data-minimisation-audit
    name: Data-minimisation audit
    definition: "Checking a feature set against GDPR Art 5(1)(c) (adequate, relevant, limited to what is necessary), Art 9 special categories and Art 22(4)"
    introduced_in: gdpr-financial-crime-data
  - id: travel-rule
    name: Travel rule
    definition: "Regulation 2023/1113 Arts 4 and 14: the originator and beneficiary information that must accompany a transfer of funds or crypto-assets, with the EUR 1,000 logic for funds and no threshold for crypto"
    introduced_in: transfer-of-funds-crypto
  - id: self-hosted-address
    name: Self-hosted address
    definition: "A distributed-ledger address not held by a crypto-asset service provider; above EUR 1,000 the provider must assess whether its customer controls it"
    introduced_in: transfer-of-funds-crypto
  # ── module 11: system ───────────────────────────────────────────────────
  - id: latency-budget
    name: Latency budget
    definition: "The sub-second share of an authorisation's few seconds that the model and its feature lookups may spend; what cannot fit is precomputed"
    introduced_in: real-time-scoring-architecture
  - id: streaming-aggregation
    name: Streaming aggregation
    definition: "Minute-scale entity features computed in a sliding window with a short period, written to the online store as events arrive"
    introduced_in: real-time-scoring-architecture
  - id: parity-check
    name: Parity check
    definition: "Replaying a day's events through the serving path and diffing the features it computes against the batch features the model was trained on"
    introduced_in: real-time-scoring-architecture
  - id: label-source
    name: Label source
    definition: "Where a training label comes from — investigator feedback, a customer dispute, a filed report and its reply, or silence — each with its own settling time"
    introduced_in: label-maturation
  - id: alert-disposition-record
    name: Alert disposition record
    definition: "The per-alert row holding score, attributions, action, investigator disposition and timestamps; the feedback label and the audit record are the same row"
    introduced_in: label-maturation
  - id: training-set-as-of
    name: Training set as of a date
    definition: "The rows, features and labels that were knowable on date t: features from the store as of each row, labels settled by t − δ, cards blocked since removed"
    introduced_in: label-maturation

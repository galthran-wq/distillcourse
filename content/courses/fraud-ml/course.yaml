        goal: "Explain one-class SVM and SVDD as boundary estimators and the autoencoder reconstruction error as an anomaly score, and evaluate the handbook's unsupervised and semi-supervised results"
        opening: "An autoencoder trained on the simulator's transactions reconstructs genuine ones with mean squared error $6.9\\times10^{-5}$ and frauds with $1.83\\times10^{-3}$, a 27-fold gap that yields ROC-AUC 0.84 with zero labels and average precision 0.18."

  - slug: sequences-drift
    title: "Sequences, streams and drift"
    outcomes: [co-adapt]
    lessons:
      - slug: sequence-models-for-transactions
        title: "Sequence models over an entity's transactions"
        type: core
        status: planned
        goal: "Construct fixed-length transaction sequences per cardholder and evaluate 1-D convolutions, LSTMs and attention against hand-built aggregates on card-present and e-commerce data"
        opening: "A payment of EUR 60 at a petrol station is ordinary; the same payment thirty minutes after one in another country is not. Aggregates summarise a card's past in fixed windows, but the order of events is lost. Can a model read a card's last ten payments as a sequence, and on which kind of payments does the order carry information that the aggregates do not?"
        est_minutes: 45
        prerequisites: [neural-tabular-detectors, behavioural-profiles]
        concepts:
          introduces: [landmark-sequence, sequence-detector, hidden-markov-features]
          reinforces: [feed-forward-detector, windowed-aggregation, rfm-aggregates]
        key_ideas:
          - "The landmark is the customer id; sequence length 5–10 because a compromised account carries about four frauds; the padding-row trick and groupby-shift"
          - "Conv1d shape arithmetic (5,15) → (4,100) → (3,50); the LSTM's final state; attention weights that go near one-hot on the last transaction"
          - "Card-present vs e-commerce: the LSTM lifts F2F AUCPR 0.138 → 0.200 and leaves ECOM at 0.179 vs 0.180; with aggregates the gain vanishes; only 25% of the two models' true positives overlap"
          - "Why: card-present payments obey opening hours and geography, e-commerce does not"
          - "Multi-perspective HMM likelihoods as eight features (+15%); the simulator shows no sequence gain because its fraud is already in the aggregates"
        demo: null
      - slug: concept-drift
        title: "Concept drift: what changes in a transaction stream and how to see it"
        type: core
        status: planned
        goal: "Classify a change in a transaction stream as a change in the inputs, the base rate or the input–label relation and as sudden, incremental, gradual or reoccurring, and measure the distance between two days without their labels"
        opening: "A detector trained in June scores well on July and badly on October. Fraudsters have changed their methods, the bank launched a new product, and a holiday season began — but which of these is the model's problem? What kinds of change can a transaction stream undergo, how does each show up, and how can you measure that two days differ before any of their labels have arrived?"
        est_minutes: 40
        prerequisites: [delayed-labels-prequential, gbm-model-selection]
        concepts:
          introduces: [concept-drift-types, drift-patterns, day-distinguishability, window-size-tradeoff]
          reinforces: [prequential-validation, delay-period, imbalance-ratio]
        key_ideas:
          - "Three things that can change — $p(x)$, $p(y)$, $p(y \\mid x)$ — and only the last moves the decision boundary; the news-site triad and the fraud instances (a new product, a fraud wave, a scheme that changes its features)"
          - "Sudden, incremental, gradual, reoccurring, and the outlier that is not drift; the simulator's scenario 2 going stale after 28 days as sudden-then-gone"
          - "Measuring shift without labels: train a classifier to tell day A from day B and read its AUC as the distance; the weekly structure that appears; Hellinger distance between feature histograms"
          - "Every estimate on a stream trades variance against reaction time — a longer window averages more noise and more stale data — and no fixed window is right forever"
          - "The delayed-label caveat: a change in $p(y \\mid x)$ is visible only δ days after it happened"
        demo: null
      - slug: change-detectors
        title: "Change detectors on the error stream: CUSUM, Page–Hinkley, DDM and ADWIN"
        type: core
        status: planned
        goal: "Derive the CUSUM, Page–Hinkley, DDM and ADWIN tests from the problem of telling a real change in a running error rate from noise, and evaluate a detector by its mean time between false alarms, time to detection and missed detections"
        opening: "Every day a few more labels arrive and the detector's error on them can be measured. Some days it is high by chance; some days it is high because the stream has changed. A rule is needed that watches the running error and raises an alarm when the change is real, quickly, without crying wolf on a stable stream. What statistic does that, and what does it cost in delay and false alarms?"
        est_minutes: 45
        prerequisites: [concept-drift]
        concepts:
          introduces: [cumulative-sum-tests, drift-detection-method, adwin, detector-run-length]
          reinforces: [window-size-tradeoff, drift-patterns, verification-latency]
        key_ideas:
          - "How to judge a detector before building one: mean time between false alarms on a stable stream, mean time to detection after a change of size θ, missed-detection rate — and why they cannot all be good at once"
          - "CUSUM $g_t = \\max(0, g_{t-1} + x_t - \\delta)$ and Page–Hinkley $m_T - \\min_t m_t > \\lambda$: memoryless, O(1), with δ and λ as the knobs that trade delay against false alarms"
          - "DDM: the running error of a learner has binomial variance, so bands at $p_{min} + 2\\sigma_{min}$ (warning) and $3\\sigma_{min}$ (drift) — and its slow reaction after a long calm stretch"
          - "Two windows and a test: a reference window against a sliding one with a normal test; ADWIN drops the older sub-window when the means differ by more than the Hoeffding cut $\\epsilon_{cut}$, no window size to guess, O(log W)"
          - "What each one does on a stream whose labels come δ days late: the alarm fires δ days after the fact"
        demo:
          component: DriftDetectorTuner
          spec: >-
            A seeded error stream with a planted mean shift at a hidden
            step and a drift-free stretch before it; the reader sets the
            Page–Hinkley δ and λ and sees the statistic, the alarm step and
            the false alarms on the stable stretch. Task: detect the shift
            within 50 steps with zero false alarms on the stable stretch;
            then switch to the "gradual" preset and find that no setting
            achieves both — the delay/false-alarm trade the lesson derives.
      - slug: stream-learning-and-adaptation
        title: "Learning on a stream: prequential scoring, forgetting and adaptive ensembles"
        type: core
        status: planned
        goal: "Design how a detector on a transaction stream remembers, forgets and replaces itself — windows, fading, blind vs triggered replacement, weighted ensembles, a retraining cadence — and score it with a prequential evaluation that moves with the stream"
        opening: "A detector cannot be retrained from scratch on every change, and a model that forgets everything after each alarm has too few frauds to learn from. How should a learner on a stream remember and forget, when should it replace itself, and how do you score a learner that keeps changing while the stream it is scored on changes too?"
        est_minutes: 45
        prerequisites: [change-detectors]
        concepts:
          introduces: [prequential-stream-evaluation, forgetting-strategy, adaptive-ensemble]
          reinforces: [prequential-validation, drift-detection-method, adwin, imbalance-ratio]
        key_ideas:
          - "Scoring first: predict, then learn, on every item; why the whole-stream average is pessimistic (an error falling like $1/\\sqrt{t}$ reads as $2/\\sqrt{t}$) and hides adaptation; sliding and fading windows; Kappa against chance and against 'same as yesterday'"
          - "Memory: fixed windows, landmark windows, reservoir sampling, fading factors; recency is not relevance when concepts reoccur"
          - "Blind vs informed adaptation: forget at a constant rate, or replace on a detector's alarm — globally, or only the subtree that changed"
          - "Ensembles: multiply a wrong expert's weight by β and add a new one on an ensemble error; bagging on a stream by Poisson(1) copies; low diversity wins before a drift and high diversity right after"
          - "The fraud instance: daily retraining on a 90-day window with every past fraud kept, because yesterday alone holds too few frauds; retraining vs incremental updating; ★ Hoeffding trees with ADWIN at the nodes"
        demo: null
      - slug: drift-strategies-on-worldline
        title: "Updating strategies on 422 days of Worldline data"
        type: core
        status: planned
        goal: "Evaluate the static, update and forget strategies with three balancers over 422 daily chunks of real card data and attribute the rank ordering to drift and to the fraud count per chunk"
        opening: "Over 422 days of real card payments, six ways of handling time — train once; retrain daily, weekly or fortnightly on a window; keep every past fraud; three rebalancing methods — are ranked day by day. Which ordering comes out, and what does the ordering measure about the stream?"
        est_minutes: 35
        prerequisites: [stream-learning-and-adaptation, sequence-models-for-transactions]
        concepts:
          introduces: []
          reinforces: [concept-drift-types, forgetting-strategy, adaptive-ensemble, sequence-detector, imbalance-ratio, prequential-stream-evaluation]
        key_ideas:
          - "The artifact: 2.2M transactions, daily chunks of about 5,200, 90-day aggregates, strategies ranked per chunk and summed (Friedman rank sums)"
          - "Random forest beats NNET and SVM; daily update beats weekly and fortnightly at the same window; a one-day window is worst because it holds a handful of frauds"
          - "Keeping all past frauds plus 30 days of genuine; SMOTE pairs with Update, EasyEnsemble with Forget; the static model last for every balancer"
          - "Departures: labels assumed instant, e-commerce only, one dataset; what the Elliptic collapse and the day-shift matrix add"
        demo: null
      - slug: drift-detector-lab
        title: "Lab: a stream-learning toolkit — change detectors and an adaptive classifier"
        type: lab
        status: planned
        goal: "Build a stream-learning toolkit — a bit-stream generator with planted abrupt and gradual changes, four change detectors compared by false alarms and detection delay, a windowed prequential scorer, and a streaming naive Bayes that adapts on alarm — and run it on a drifting transaction stream"
        opening: "The lab builds a stream-learning toolkit: a bit-stream generator with planted abrupt and gradual changes, four change detectors compared by false alarms and detection delay over random runs, a prequential scorer with a sliding window, and a streaming naive Bayes that resets on alarm — run on a drifting synthetic stream and then on the simulator."
        est_minutes: 12
        prerequisites: [drift-strategies-on-worldline]
        concepts:
          introduces: []
          reinforces: [cumulative-sum-tests, drift-detection-method, adwin, detector-run-length, prequential-stream-evaluation, forgetting-strategy]
        key_ideas:
          - "A seeded bit stream whose probability of a 1 changes abruptly or along a sigmoid, averaged over runs"
          - "Page–Hinkley, DDM, a two-window normal test and ADWIN's Hoeffding cut, each scored by MTFA, MTD and missed detections"
          - "A windowed and a fading prequential accuracy against a hold-out curve"
          - "A streaming Gaussian naive Bayes whose statistics reset on a detector's alarm, scored on a stream with planted concept changes"
        demo: null
        lab:
          est_hours: 4.5
          checkpoints:
            - id: drift-bit-stream
              kind: exact
              text: "Seeded Bernoulli bit-stream generator with an abrupt change and a sigmoid gradual change at given positions and widths"
            - id: page-hinkley
              kind: exact
              text: "The Page–Hinkley statistic and alarm on a stream, with δ and λ, resetting after an alarm"
            - id: ddm-bands
              kind: exact
              text: "DDM's running error rate with its warning and drift bands from the binomial standard deviation"
            - id: two-window-test
              kind: exact
              text: "A reference-window vs sliding-window normal test at a given false-alarm probability"
            - id: adwin-cut
              kind: exact
              text: "ADWIN's Hoeffding cut on every split of a window and the window that remains after the cut"
            - id: detector-scorecard
              kind: exact
              text: "Mean time between false alarms, mean time to detection and missed-detection rate of each detector over seeded random runs of the generator"
            - id: prequential-scorer
              kind: exact
              text: "Prequential accuracy with a sliding window and with a fading factor over a stream of (prediction, label) pairs"
            - id: streaming-naive-bayes
              kind: exact
              text: "A Gaussian naive Bayes updated one item at a time, with predict-then-learn, whose per-class statistics reset when a detector fires"
            - id: which-detector-for-fraud
              kind: review
              text: "Written answer: which detector to put on a fraud detector's error stream given labels that arrive a week late, and what its alarm can and cannot mean"
            - id: beat-prequential-kappa
              kind: metric
              text: "Beat the windowed prequential Kappa bar on a held-out drifting transaction stream with an adaptive learner of your design"
              required: false
        notes: "Canon grounding (MOA book ch. 5 Exercise 5.7: bit-stream generator with abrupt/gradual change, Page–Hinkley, DDM and the window tests compared by the 5.3.1 measures over random runs; Gavaldà Lecture 7 Exercise 1: a streaming naive Bayes made adaptive with ADWIN; MOA Tutorial 5 §7 drift exercises with prequential curves; Carta OML1 exercises on windowed/fading prequential accuracy vs hold-out and OML2's hand-written CUSUM), dataset and checkpoint detail live in research/drift-detector-lab.md (LAB PLAN)."

  - slug: adversary
    title: "The adversary and the feedback loop"
    outcomes: [co-adapt]
    lessons:
      - slug: adversarial-classification
        title: "Adversarial classification: evasion as a knapsack and the arms race"
        type: core
        status: planned
        goal: "Formulate evasion against a cost-sensitive classifier as a minimum-cost camouflage problem, derive the adversary-aware classifier, and explain why the repeated game oscillates instead of converging"
        opening: "A spam filter is published, and within weeks spammers are inserting ordinary words until each message passes. A fraud detector is used, and fraudsters learn to keep amounts under what it flags. If the adversary knows the classifier and pays a cost per feature changed, what is their cheapest way through, what should the classifier do knowing that, and does the back-and-forth ever settle?"
        est_minutes: 45
        prerequisites: [example-dependent-cost, concept-drift]
        concepts:
          introduces: [minimum-cost-camouflage, adversary-aware-classifier, arms-race]
          reinforces: [bayes-minimum-risk, cost-matrix, concept-drift-types]
        key_ideas:
          - "Why ordinary drift handling is not enough: the change in the data is a function of the classifier"
          - "The game: classifier utility with measurement costs, adversary utility minus edit cost; single-shot sequential play because the general equilibrium is intractable"
          - "The gap = log-odds minus threshold; closing it at per-feature prices is a 0-1 knapsack with a pseudo-linear DP over discretised log-odds; the adversary acts only if the cost is below the payoff"
          - "The adversary-aware classifier sums the pre-images that would have been camouflaged into x′; false negatives 481 → 93 with zero false positives"
          - "The repeated game: good words lose their log-odds and regain them, utility oscillates with period 2; the fraud anecdotes (paying the first bill, roving calling dens); the AI Act's statutory list of attacks"
        demo:
          component: CamouflageKnapsack
          spec: >-
            A message with eight candidate word edits, each showing its
            log-odds reduction and its cost, a log-odds gap bar and a
            budget. The reader picks edits to close the gap under budget
            (the knapsack); on success the classifier retrains and the
            edits' log-odds reductions shrink. Task: get three rounds of
            spam through; then find that from round four no affordable
            edit set closes the gap — the adversary-aware bound the reader
            loses against.
      - slug: alert-feedback-selection-bias
        title: "Alert-feedback selection bias and learning from feedbacks plus delayed samples"
        type: core
        status: planned
        goal: "Analyze the sample selection bias created by labelling only alerted transactions, show why importance weighting cannot remove it, and derive the feedback-plus-delayed-sample learning strategy"
        opening: "The freshest labels a detector gets are the investigators' verdicts on the hundred payments it ranked highest yesterday. Training on them means training on a sample the model chose, in which fraud is far more common and the features look nothing like the stream. Can the bias be weighted away, and if not, how should yesterday's verdicts and last week's complete labels be combined?"
        est_minutes: 45
        prerequisites: [delayed-labels-prequential, stream-learning-and-adaptation]
        concepts:
          introduces: [sample-selection-bias, feedback-samples, delayed-samples, feedback-delayed-aggregation]
          reinforces: [alert-feedback-interaction, verification-latency, prequential-validation, undersampling-calibration]
        key_ideas:
          - "Feedbacks $F_t$ = all recent transactions of the alerted cards; delayed samples $D_{t-\\delta}$ = everything from day $t-\\delta$ with silence read as genuine; the stacked-bar timeline of what is labelled when"
          - "Three kinds of selection bias; the importance weight $P(s=1)/P(s=1 \\mid x,y)$ fixes a covariate shift on amount > 500 and does nothing for alerts, because the selection depends on the label"
          - "Why active learning is not an option: investigators must see the most suspicious, not the most informative"
          - "Two classifiers averaged, $P_A = \\alpha P_F + (1-\\alpha)P_D$: alert precision 0.77 vs 0.61 pooled; the feedback model has the worst AUC and the best alert precision; more investigators raise NCP_k (the hiring case)"
          - "The card id must leave the feature vector because real cards are blocked after their first detected fraud"
        demo: null
      - slug: arms-race-replay
        title: "The arms race and the feedback loop replayed on the simulator"
        type: core
        status: planned
        goal: "Evaluate the oscillating repeated game and the feedback-versus-delayed-sample comparison by reproducing both as a computational study on the handbook simulator, and state where the simulator departs from the papers"
        opening: "On the simulator, a fraudster who learns the detector's amount threshold and spends just under it, and a detector that retrains only on what its investigators returned, can both be replayed. What does the replay show about how fast each side moves, and where does the simulator fall short of the two papers it imitates?"
        est_minutes: 35
        prerequisites: [adversarial-classification, alert-feedback-selection-bias]
        concepts:
          introduces: []
          reinforces: [arms-race, minimum-cost-camouflage, feedback-delayed-aggregation, sample-selection-bias, transaction-simulator]
        key_ideas:
          - "The artifact: the period-2 utility oscillation and the F / D / pooled / averaged comparison re-run on the simulator's scenario 1 and 3 frauds"
          - "An adaptive scenario: fraudsters shift amounts below the learned split; the detector's retraining cadence against the fraudster's"
          - "Feedback-only training: top-k alerts → labels → retrain; the training set's fraud share and feature distribution drift away from the stream"
          - "Departures: the simulator's fraudster has one knob, the papers' had a cost model; alerts are raised by ranking, not online"
        demo: null

  - slug: governance
    title: "Decisions, explanations and monitoring"
    outcomes: [co-govern]
    lessons:
      - slug: score-to-action
        title: "From score to action: routing, decision tables and the inspection frontier"
        type: core
        status: planned
        goal: "Design the decision policy that turns a fraud probability into decline, step-up or review, including a probability-by-amount investigation frontier and a rule table verified for conflicts and gaps"
        opening: "A model gives a payment a 0.93 probability of fraud. The bank can let it through, ask the customer for a second factor, decline it, or send it to an investigator — and each action has a cost, a legal limit and a queue behind it. How does a probability and an amount become one of four actions, and how are the rules that do it checked for conflicts and gaps?"
        est_minutes: 40
        prerequisites: [example-dependent-cost, alert-feedback-selection-bias]
        concepts:
          introduces: [decision-zones, decision-table, investigation-frontier, false-positive-harm]
          reinforces: [inspection-budget, bayes-minimum-risk, savings-metric]
        key_ideas:
          - "Expected fraud amount = P × amount: 90% of EUR 10 is EUR 9 and not an investigation, 25% of EUR 10,000 is EUR 2,500 and is; the stepwise frontier over probability and amount bands"
          - "Traffic-light zones with a referral band: automatic decisions at the extremes, analysts in the middle who may overrule"
          - "Decision tables: eight card rules collapse to four columns and reveal that card-not-present is always fraud; a conflict and a gap found mechanically"
          - "The cost of friction: blocked cards, de-risking, false-positive rates per group; 10,000 false alarms a day on a million accounts"
          - "Routing, mitigation first, then notification, then the audit trail"
        demo: null
      - slug: alert-explanations
        title: "Explaining an alert: attributions, rules and reason codes"
        type: core
        status: planned
        goal: "Produce an explanation for an individual alert — Shapley attributions, extracted rules, attention weights, scorecard points — and judge which satisfies an investigator, a customer and a supervisor"
        opening: "An alert that says 'score 0.93' tells the investigator nothing to act on, tells the customer nothing they can contest, and tells the supervisor nothing about the logic. What form of explanation does each of the three need, which methods produce them from a boosted ensemble, a network or a scorecard, and which explanations are honest about what the model did?"
        est_minutes: 40
        prerequisites: [score-to-action, gbm-model-selection]
        concepts:
          introduces: [alert-attribution, rule-extraction, reason-code]
          reinforces: [decision-zones, weight-of-evidence, points-scorecard]
        key_ideas:
          - "The same alert as 'terminal risk over 30 days 0.075 and 14 transactions today, against a base of 0.003' — an attribution that sums to the score"
          - "Shapley attributions restated: three axioms, additivity, the top-5 contributions a cloud service returns per prediction"
          - "Opening the black box: Hinton diagrams, backward elimination, decompositional vs pedagogical rule extraction with fidelity (a+d)/(a+b+c+d), two-stage models"
          - "Attention weights as per-prediction weights over history; scorecard points as the explanation that needs no method"
          - "Three audiences: the investigator's narrative, the customer's 'meaningful information about the logic', the supervisor's decision record"
        demo: null
      - slug: model-risk-monitoring
        title: "Model risk: backtesting, stability indices and the life cycle"
        type: core
        status: planned
        goal: "Compute population and performance stability tests for a deployed detector and design its monitoring, champion–challenger and retirement life cycle"
        opening: "A detector that scored well last quarter is in production now, and the fraudsters, the customers and the products have all changed since. Which numbers should be computed every week to tell whether its inputs have shifted, whether its ranking still works and whether its probabilities still mean what they say — and what happens to the model when a number turns red?"
        est_minutes: 45
        prerequisites: [change-detectors, score-to-action]
        concepts:
          introduces: [stability-index, performance-backtest, champion-challenger]
          reinforces: [drift-detection-method, concept-drift-types, undersampling-calibration]
        key_ideas:
          - "Inputs first: the stability index Σ(obs − exp)·ln(obs/exp) — the information value again — with 0.10 and 0.25 as the lights; population, then per variable; 0.0605 is green, 0.304 on one variable is red"
          - "Then the ranking: performance per period with absolute-change lights (5%, 10%) or a bootstrap over pooled train and out-of-time samples at 95% / 99%"
          - "Then the probabilities: the binomial critical rate and Hosmer–Lemeshow, and the independence assumption that network effects break"
          - "What the error-stream detectors of module 7 add and what the stability index sees that they cannot"
          - "Life cycle: development, testing, staging in parallel, production, retirement; direct, phased and parallel changeover; the documentation test"
        demo: null
      - slug: fraudfinder-monitoring-read
        title: "A deployed pipeline's monitoring read against the theory"
        type: core
        status: planned
        goal: "Evaluate the monitoring and deployment gates of a published cloud reference pipeline against this module's results and locate the gates that pass a constant model"
        opening: "A cloud vendor publishes a reference pipeline for real-time fraud detection: feature store, training pipeline, endpoint, monitoring job. It gates deployment on accuracy above 0.95 and monitors nine of its twenty-five features. Read against this module, where does it do what the theory says and where would it pass a model that never alerts?"
        est_minutes: 35
        prerequisites: [model-risk-monitoring, alert-explanations, point-in-time-features]
        concepts:
          introduces: []
          reinforces: [stability-index, performance-backtest, champion-challenger, training-serving-skew, decision-zones]
        key_ideas:
          - "The artifact: the pipeline DAG, the metric gate, the monitoring job, the serving handler"
          - "Skew vs drift as the pipeline uses them; the training table as the skew baseline; what thresholds of 0.5 and 0.05 would catch"
          - "The accuracy gate against the average-precision gate of the sibling track; the explanation spec; the request/response log as the audit record"
          - "Departures: synthetic data with AUC 1.0, a feature contract hand-copied in four places, a cold customer filled with zeros"
        demo: null

  - slug: eu-regulation
    title: "The European regulatory frame"
    outcomes: [co-govern]
    lessons:
      - slug: aml-transaction-monitoring-duty
        title: "The AML rulebook I: what must be monitored, reported and recorded"
        type: core
        status: planned
        goal: "Identify in the AML Regulation every obligation that defines what a transaction-monitoring system must watch, what counts as suspicion, what must be reported to the financial intelligence unit and when, and what record must exist for every alert"
        opening: "From July 2027 every bank, payment firm and crypto exchange in the Union is bound by one regulation to watch its customers' transactions and report suspicion. What exactly does that duty require a monitoring system to look at, what counts as suspicion, what must be filed and when, and what record must exist for every alert, including the ones closed as nothing?"
        est_minutes: 45
        prerequisites: [score-to-action, alert-feedback-selection-bias]
        concepts:
          introduces: [transaction-monitoring-duty, suspicious-transaction-report, linked-transactions, assessment-record]
          reinforces: [decision-zones, money-laundering-stages, feedback-samples]
        key_ideas:
          - "Why one regulation: the directive it replaces was transposed 27 ways; the package (AMLR, AMLD6, AMLA, the travel rule) and the date 10 July 2027"
          - "Monitoring covers all products with risk-based intensity (Rec 72, Art 26): against the customer's own profile and expected activity — the per-customer baseline written into law"
          - "Art 34(2)'s four triggers (complex, unusually large, unusual pattern, no apparent purpose) and Art 69(2)'s suspicion bases, read as a feature taxonomy; 'linked transactions' as the legal hook for structuring"
          - "The report: Art 69 regardless of amount, Art 71's three-working-day silence rule, Art 73 no tipping-off, the FIU's 5-day and 24-hour requests"
          - "Art 77: the assessment record kept five years whether or not a report was filed — every alert disposition, including the false positives, is a record"
        demo: null
      - slug: aml-automated-decisions-and-supervision
        title: "The AML rulebook II: automated decisions, outsourcing and the supervisor"
        type: core
        status: planned
        goal: "Classify what a model may decide alone under the AML Regulation, which decisions can never be outsourced to a vendor, what the financial intelligence unit and the new EU authority may demand to see, and what a breach costs"
        opening: "A bank buys a vendor's model, lets it close alerts automatically and refuse customers it scores high. Which of those steps can a model make at all under the AML rules, which can never be handed to a vendor, what can the financial intelligence unit and the new EU authority demand to see, and what does a breach cost?"
        est_minutes: 40
        prerequisites: [aml-transaction-monitoring-duty, alert-explanations]
        concepts:
          introduces: [non-outsourceable-decision, meaningful-human-intervention, fiu-feedback-loop]
          reinforces: [transaction-monitoring-duty, suspicious-transaction-report, alert-attribution, performance-backtest]
        key_ideas:
          - "Art 76(5): automated decisions, profiling and AI are allowed — on Chapter III data, with meaningful human intervention for entry, refusal, exit and CDD changes, with explanation and challenge; Rec 152's ban on deciding on irrelevant special-category data"
          - "Art 18(3): the detection criteria, the risk profile, the onboarding decision and the report can never leave the bank; buying software is not outsourcing (Rec 47) but liability stays"
          - "Art 75: information-sharing partnerships, where AI-generated information is shared only with human oversight and after a DPIA"
          - "The FIU loop (AMLD6): 5- and 10-working-day suspensions, monitoring orders, annual feedback on report quality — the label loop in statute; AMLA Art 18(1)(d) access to 'decision-making processes developed by algorithms'"
          - "Fines: 10% of turnover or EUR 10m for a bank, periodic penalties of 3% of daily turnover; Art 10(1): a new model is risk-assessed before launch"
        demo: null
      - slug: psd2-sca-tra
        title: "PSD2, strong customer authentication and the transaction-risk-analysis exemption"
        type: core
        status: planned
        goal: "Derive the constraint the PSD2 RTS places on a fraud model — the value-weighted 90-day fraud rate per exemption band, its cessation rule and the liability shift — and compute a lawful exemption policy"
        opening: "An online card payment of EUR 240 can go through without the customer typing a second code — but only if the issuer's fraud model is good enough, and 'good enough' is written into law as a number. What is that number, how is it computed over which transactions, what happens when it is exceeded, and who pays for the fraud that slips through?"
        est_minutes: 45
        prerequisites: [alert-budget-metrics, model-risk-monitoring]
        concepts:
          introduces: [strong-customer-authentication, transaction-risk-analysis, fraud-rate-reference, liability-shift]
          reinforces: [precision-at-k, performance-backtest, decision-zones]
        key_ideas:
          - "Art 97: two independent factors on access, initiation and any remote action with fraud risk; dynamic linking to amount and payee; MOTO out of scope (Rec 95)"
          - "RTS Art 2: monitoring is mandatory and must weigh compromised credentials, amount, known scenarios, malware, device logs; Art 18: no SCA if the fraud rate is under the reference, the amount under the band, and six real-time flags are clear — 'a risk scoring for each individual transaction' in statute"
          - "Art 19: rate = fraudulent value / all remote value over 90 days, SCA'd and exempted flows both in the denominator, recovered funds still counted; the Annex (0.13% / 0.06% / 0.01% for cards at EUR 100 / 250 / 500)"
          - "Art 20's controller: trip after two quarters above, resume after one below; Art 3's yearly audit of the model and the rate"
          - "Arts 72–74: refund by the next business day, the EUR 50 cap, no payer loss without SCA — why the issuer's precision is a liability choice"
        demo:
          component: FraudRateCeiling
          spec: >-
            A stream of seeded remote transactions with scores and amounts;
            the reader sets a score threshold below which payments are
            exempted in the EUR 100/250/500 bands and sees exempted volume
            and the rolling 90-day value-weighted fraud rate per band
            against the Annex reference rates, with a quarter-by-quarter
            trip indicator. Task: maximise exempted volume at EUR 250
            without tripping the 0.06% line for two consecutive quarters;
            then raise the band to EUR 500 and find no threshold does it —
            the precision the law demands, found by hand.
      - slug: eu-ai-act-fraud
        title: "The AI Act and fraud detection: the high-risk line and what sits on each side"
        type: core
        status: planned
        goal: "Classify a financial-crime model under the AI Act — the Annex III credit-scoring entry and its fraud carve-out, the Article 6(3) derogation and its profiling override — and map the high-risk obligations onto the pipeline"
        opening: "The AI Act lists AI that scores the creditworthiness of natural persons as high-risk, and in the same line excepts AI 'used for the purpose of detecting financial fraud'. Is a transaction-fraud model high-risk, and an account-opening-fraud model, and a laundering model that profiles customers? And when a system is high-risk, which documents, logs, metrics and human-oversight controls does the pipeline owe?"
        est_minutes: 45
        prerequisites: [aml-automated-decisions-and-supervision]
        concepts:
          introduces: [high-risk-ai-system, annex-iii-fraud-carve-out, post-market-monitoring, right-to-explanation]
          reinforces: [performance-backtest, alert-attribution, non-outsourceable-decision]
        key_ideas:
          - "Annex III 5(b) and its clause; 5(a) and 5(c) with no exception; 1(a)'s verification exclusion; Rec 42's suspicious-transaction analytics; Rec 58's narrower 'provided for by Union law' wording — how narrow the carve-out is"
          - "Art 6(3)'s four conditions and the rule that a profiling system is high-risk regardless; Art 6(4) and Art 49(2): a non-high-risk claim is documented, registered and public; Art 80 fines a misclassification"
          - "Arts 9–15 as pipeline artefacts: a risk register, a data sheet with bias and feedback-loop checks (Art 10), logs, declared metrics per group (Art 13), oversight with automation bias named (Art 14), poisoning and evasion (Art 15(5))"
          - "A bank's deeming: QMS, documentation and logs satisfied by financial-services rules except risk management, post-market monitoring and incident reporting (Art 17(4)); the prudential supervisor as market surveillance; a FRIA for 5(b)/(c)"
          - "Art 86's right to explanation beside GDPR Art 22; Art 99's ladder; a pre-determined retraining policy is not a substantial modification (Art 43(4))"
        demo: null
      - slug: gdpr-financial-crime-data
        title: "GDPR for fraud data: lawful basis, Article 22 and minimisation against feature richness"
        type: core
        status: planned
        goal: "Classify a fraud-scoring decision by its lawful basis, its Article 22 status and its information duties, and audit a feature set against data minimisation and special-category rules"
        opening: "A fraud model declines a payment with no human involved, using a feature store that holds everything the bank knows about the customer. GDPR gives the customer a right not to be subject to such a decision, requires every feature to be necessary, and forbids some features outright. On what legal basis does the model run, when may it decide alone, and which of its features must go?"
        est_minutes: 40
        prerequisites: [eu-ai-act-fraud]
        concepts:
          introduces: [legitimate-interest-fraud, solely-automated-decision, data-minimisation-audit]
          reinforces: [right-to-explanation, reason-code, non-outsourceable-decision, feature-store]
        key_ideas:
          - "Art 6(1)(b)/(c)/(f) for fraud processing; Recital 47's one line on fraud prevention as a legitimate interest, and the balancing test that still binds; Art 6(4) for reusing logs; PSD2 Art 94 as the sector's own basis"
          - "Art 22(1)–(4) and Recital 71: the credit-refusal example, the fraud carve-out through a law with safeguards, human intervention, explanation, challenge; why 'necessary for the contract' is what a decline would argue"
          - "Art 9 and Art 22(4): no special-category features in the automated decision; Art 35: the DPIA whose trigger mirrors Art 22"
          - "Art 5(1)(c) against the feature store: minimisation, purpose limitation, storage limitation; Arts 13(2)(f)/15(1)(h) 'meaningful information about the logic'"
        demo: null
      - slug: transfer-of-funds-crypto
        title: "The Transfer of Funds Regulation and the crypto travel rule"
        type: extra
        status: planned
        goal: "Identify the originator and beneficiary data that must travel with a funds or crypto transfer under Regulation 2023/1113, the threshold logic, and the missing-information checks a receiving institution must run"
        opening: "A EUR 900 transfer inside the Union needs only two account numbers to travel with it; a EUR 50 crypto transfer must carry the sender's name, address and ledger address, and a transfer to a wallet nobody custodies obliges the exchange to find out who controls it. Which fields the law makes travel with money, and what the receiving institution must check, are the inputs of a screening model."
        est_minutes: 30
        prerequisites: [aml-transaction-monitoring-duty]
        concepts:
          introduces: [travel-rule, self-hosted-address]
          reinforces: [transaction-monitoring-duty, suspicious-transaction-report, linked-transactions]
        key_ideas:
          - "Art 4/14: name, account or ledger address, address or document or date and place of birth, LEI; a unique identifier for off-ledger transfers"
          - "EUR 1,000 logic for funds with linked-transaction aggregation and cash overrides; no threshold for crypto (Rec 30's structuring argument)"
          - "Art 7/16: admissible characters, detection of missing fields, execute / reject / return / suspend, the repeat-offender escalation ladder"
          - "Art 23 sanctions screening; mixers and privacy wallets as risk factors; ledger analytics and know-your-transaction"
        demo: null
      - slug: tra-exemption-engine
        title: "A PSD2-compliant transaction-risk-analysis exemption engine"
        type: core
        status: planned
        goal: "Design and run a TRA exemption engine — a per-transaction risk score, the Annex exemption bands, the rolling 90-day value-weighted fraud rate and the cessation controller — on the simulator and state where it departs from the RTS"
        opening: "Build what the PSD2 rules describe in words: a per-transaction risk score, the three amount bands, a rolling 90-day fraud rate weighted by value, and a switch that turns the exemption off after two bad quarters — then run it on the simulator and see how much friction a given model precision buys and where the legal ceiling bites first."
        est_minutes: 40
        prerequisites: [psd2-sca-tra, gdpr-financial-crime-data, example-dependent-cost]
        concepts:
          introduces: []
          reinforces: [transaction-risk-analysis, fraud-rate-reference, bayes-minimum-risk, savings-metric, performance-backtest]
        key_ideas:
          - "The artifact: RTS Arts 18–21 and the Annex as code — bands, 90-day rate, two-quarter trip, one-quarter reset, quarterly report"
          - "Value weighting vs count weighting: a few large frauds move the rate; recovered funds still count; SCA'd flows dilute the denominator"
          - "The simulator study: exempted volume vs precision per band; the band at which no threshold is lawful; savings against the EUR 50 liability"
          - "Departures: the simulator's fraud is not remote-card fraud, the real rate is audited yearly, the controller's hysteresis is the law's, not a design choice"
        demo: null

  - slug: system
    title: "The system"
    outcomes: [co-govern, co-adapt]
    lessons:
      - slug: real-time-scoring-architecture
        title: "Real-time scoring: latency budgets, feature stores and the rule layers"
        type: core
        status: planned
        goal: "Design the serving path of a fraud detector — latency budget, batch and streaming features from one store, rule layers around the model, daily retraining — and verify offline/online parity"
        opening: "A card authorisation must be answered within a few seconds and the model's share of that is under one. The features it needs — the card's last 30 days, the terminal's last week, the last 15 minutes — cannot be computed when the payment arrives. Where must they be computed, where stored, how kept identical to what the model was trained on, and what runs before and after the model in the same second?"
        est_minutes: 40
        prerequisites: [point-in-time-features, score-to-action, stream-learning-and-adaptation]
        concepts:
          introduces: [latency-budget, streaming-aggregation, parity-check]
          reinforces: [feature-store, training-serving-skew, fraud-detection-system, forgetting-strategy]
        key_ideas:
          - "The layers again with their clocks: milliseconds, sub-second, daily, weeks; what each may compute"
          - "Day-scale features in batch SQL, minute-scale features in a streaming window: one 60-minute sliding window with a 1-minute period yields 15/30/60-minute aggregates by conditional sums; the new-records filter"
          - "Serving: message → store lookup → payload → score → log; the handler that always acknowledges; a missing feature filled with zero turns a new customer into a 'no activity' customer"
          - "Parity: replay the day's stream through the serving path and diff it against the batch features; retraining at the end of the day"
        demo: null
      - slug: label-maturation
        title: "Label maturation: chargebacks, reports and the training set as of a date"
        type: core
        status: planned
        goal: "Design the labelling pipeline of a deployed detector — which outcomes become labels, when each settles, how alert dispositions are recorded — and assemble a training set as of a date"
        opening: "A card fraud label can arrive from an investigator in days, from a customer dispute up to thirteen months later, or never; a laundering label arrives when a report is filed, and most laundering is never labelled. Which outcomes become training labels, when does each settle, how are alert dispositions recorded, and how do you assemble the training set as it was known on a given date?"
        est_minutes: 40
        prerequisites: [alert-feedback-selection-bias, point-in-time-features, aml-transaction-monitoring-duty]
        concepts:
          introduces: [label-source, alert-disposition-record, training-set-as-of]
          reinforces: [feedback-samples, delayed-samples, label-completeness, verification-latency, assessment-record]
        key_ideas:
          - "Label sources and their clocks: investigator feedback (days), a dispute (up to 13 months under PSD2 Art 71), a report and the FIU's reply (a year), silence"
          - "The insurance funnel: small claims never labelled; laundering labels radically incomplete against a synthetic world's transitive taint"
          - "The alert ledger: every disposition recorded, kept whether or not anything was reported — the feedback label and the audit trail are the same row"
          - "A training set as of date t: features from the store as of each row, labels settled by t − δ, cards blocked since removed; the retraining cadence"
        demo: null
      - slug: eu-transaction-monitoring-design
        title: "Designing an end-to-end EU transaction-monitoring system"
        type: core
        status: planned
        goal: "Design a transaction-monitoring system for an EU payment institution by reading a cloud reference architecture and a graph-analytics workflow against every result and obligation of this course, naming each component's clock, data, metric and legal hook"
        opening: "A reference architecture from a cloud vendor and a graph-analytics workflow from a database vendor each show a working skeleton. Neither has a delay block, an alert budget, a feedback classifier, a graph propagator, a fraud-rate controller or an audit record. Design the monitoring system of an EU payment institution by adding each one and saying which result or which article requires it."
        est_minutes: 45
        prerequisites: [real-time-scoring-architecture, label-maturation, tra-exemption-engine, communities-and-components]
        concepts:
          introduces: []
          reinforces: [fraud-detection-system, latency-budget, feature-store, feedback-delayed-aggregation, transaction-monitoring-duty, fraud-rate-reference, high-risk-ai-system, connected-components]
        key_ideas:
          - "The artifacts: the cloud architecture diagram and notebooks; the explore–hypothesise–encode–resolve–label workflow"
          - "Layer by layer: rules, score, graph exposure, queue; the clocks; the stores; the retraining and feedback loop"
          - "The legal overlay: Art 18(3) in-house decisions, Art 76(5) human intervention, Art 77 records, RTS Arts 19–21 reporting, AI Act Arts 9–15 artefacts, GDPR Art 22"
          - "Departures from the reference: vendor stack, synthetic data, no graph, no regulation — what a real institution adds"
        demo: null
      - slug: pipeline-capstone-lab
        title: "Lab: the pipeline on the simulator stream"
        type: lab
        status: planned
        goal: "Assemble the full detector on the handbook simulator's stream — point-in-time feature lookup, daily scoring with a top-k alert queue, feedbacks and delayed labels feeding a retraining cadence, a stability monitor, the PSD2 fraud-rate controller and an alert ledger — and report cumulative card precision over the stream"
        opening: "Every lab so far built a part; this one runs them as a system over a simulated stream: features as of each day, a model retrained on what the investigators returned, alerts capped at the budget, a monitor and a controller watching the result, and a ledger that records why each alert was raised."
        est_minutes: 12
        prerequisites: [eu-transaction-monitoring-design, cost-aware-evaluation-lab, point-in-time-feature-lab]
        concepts:
          introduces: []
          reinforces: [point-in-time-join, feedback-delayed-aggregation, card-precision-at-k, stability-index, fraud-rate-reference, alert-disposition-record]
        key_ideas:
          - "A feature log and an as-of lookup serving every day's scoring rows"
          - "The daily loop: score, alert top k, receive feedbacks now and delayed labels after δ, retrain on both"
          - "A stability index per period and a 90-day value-weighted fraud-rate controller with hysteresis"
          - "Cumulative card precision at 100 over the stream as the one number the system is judged by"
        demo: null
        lab:
          est_hours: 5
          checkpoints:
            - id: feature-asof-lookup
              kind: exact
              text: "Point-in-time lookup from a timestamped feature log for a day's scoring rows"
            - id: daily-alert-queue
              kind: exact
              text: "One day's scoring, the top-k alert queue with one alert per card, and the feedback rows it generates"
            - id: label-arrival
              kind: exact
              text: "Feedbacks available at once, delayed labels available after δ days, blocked cards removed from later days"
            - id: feedback-delayed-retrain
              kind: exact
              text: "Daily retraining on feedbacks and delayed samples as two models averaged, versus one pooled model"
            - id: stability-monitor
              kind: exact
              text: "A population stability index of the score distribution per period against the training baseline, with traffic-light thresholds"
            - id: fraud-rate-controller
              kind: exact
              text: "The rolling 90-day value-weighted fraud rate per exemption band with the two-quarter trip and one-quarter reset"
            - id: alert-ledger
              kind: exact
              text: "A per-alert record: score, top attributions, action, disposition, timestamps — kept whether or not the alert was escalated"
            - id: parity-report
              kind: review
              text: "Written answer: the feature on which the replayed serving path and the batch features disagree, and why"
            - id: cumulative-card-precision
              kind: metric
              text: "Beat the cumulative card-precision-at-100 bar over the held-out stream with your assembled system"
              required: false
        notes: "Canon grounding (FraudFinder notebooks 02, 04 and 07: batch features → point-in-time training table → online scoring from the store; Dal Pozzolo 2018 Algorithm 1), dataset and checkpoint detail live in research/pipeline-capstone-lab.md (LAB PLAN)."

schema_version: 1
slug: fraud-ml
title: Fraud and Financial-Crime ML
tagline: Detectors that survive one positive in a thousand, labels that arrive weeks late, an adversary who adapts, and an EU regulator who reads the logs
status: planned
audience: >
  Engineers who have finished classical-ml (gradient boosting, calibration,
  cross-validation, the imbalance playbook, SHAP) and want financial-crime
  detection as a discipline: evaluation under rarity and an alert budget,
  transaction features computed as of the moment, supervised, anomaly, graph
  and sequence detectors, the adversary and the feedback loop, and the EU
  legal frame the model ships into. Comfortable with numpy, pandas and a
  notebook; no banking background assumed.
tone: >
  Dry, precise, engineering register — the classical-ml voice. Declarative
  statements of fact; no rhetorical questions, no teasers. Derivations and
  worked tables carried through; legal text quoted short and read as a
  constraint on the pipeline, never summarized as policy. Second person only
  in instructions.
intro: >
  A fraud detector is not a classifier that happens to see rare positives.
  It is the fourth layer of a system — terminal checks, blocking rules,
  scoring rules, then the model, then human investigators — in which the
  humans can open about a hundred alerts a day out of hundreds of thousands
  of transactions, the labels they produce arrive a week or more later, the
  labels only ever cover what the model chose to show them, and the people
  being detected read the detector's behaviour and change theirs. Every
  method in this course is an answer to one question: what does a detector
  have to be, and how must it be judged, when it sits inside that loop?


  The answer has a shape. Under one positive in a thousand and a fixed alert
  budget, accuracy and most of the ROC curve measure nothing, so the course
  begins by replacing them with precision at the budget, amount-weighted
  cost, and validation that runs forward in time with a delay block
  (modules 1–2). A raw transaction carries no signal; the signal is the
  distance from the entity's own history, computed only from what was
  knowable at the time (module 3). On those features the supervised
  detectors — scorecards, boosted trees, feed-forward nets — turn out to
  differ less from each other than the metrics differ from one another
  (module 4). Supervised models see only yesterday's fraud, so anomaly
  scores by isolation and reconstruction cover the unlabeled frontier
  (module 5); fraud is organised, so the graph around a transaction is
  propagated and learned (module 6); the data drift and the fraudster
  adapts, so the model is re-estimated on a cadence, watched for change,
  and trained on labels it knows are biased by its own alerts (modules
  7–8). A score becomes a decision under a budget, with an explanation and
  a monitoring record (module 9), and in the EU that loop is written into
  law: the AML single rulebook, PSD2's fraud-rate ceiling on friction, the
  AI Act's high-risk regime, GDPR Article 22 and the travel rule (module
  10). The capstone assembles the system (module 11). Case studies run on
  named public data — the ULB handbook simulator and Worldline replay,
  PaySim, the ULB credit-card set, Elliptic — and six labs make the learner
  build the harness, the features, the scorecard, the anomaly scorers, the
  graph propagator and the pipeline.
prerequisites:
  - text: "classical-ml, or equivalent: logistic regression, gradient-boosted trees and XGBoost, ROC/PR curves and calibration, cross-validation, the class-imbalance playbook, feature encoding, k-means and PCA — assumed and applied, never re-taught"
    course: classical-ml
  - text: "Neural-network basics (an MLP, backpropagation, Adam, dropout) at the level of having trained one; modules 4–7 use them"
  - text: "Linear algebra for graphs: sparse matrices, matrix powers, eigenvectors, power iteration"
  - text: "Python, numpy and pandas at working-engineer level, including time-based groupby and rolling operations (labs are notebook assignments)"
key_results:
  - text: "A detector sits between rule layers and human investigators who review about $k \\approx 100$ alerts a day; precision at that budget, not accuracy, is the objective, and labels return weeks later only for what was alerted"
    lesson: fraud-detection-system
  - text: "At one positive in a thousand, 99% sensitivity and 99% specificity give about 9 true frauds per 100 alerts; the base rate, not the error rates, sets the precision"
    lesson: economics-of-detection
  - text: "Investigator capacity of 0.1–1% of daily volume makes every ROC point with $\\mathrm{FPR} > 0.01$ operationally unreachable; average precision and card precision at $k$ are the metrics that see the reachable region"
    lesson: alert-budget-metrics
  - text: "Validation must run forward in time with a delay block the width of the label latency and with known-compromised cards removed from the test days; prequential folds agree with the test week where random folds and AUC-selected depth do not"
    lesson: delayed-labels-prequential
  - text: "Undersampling with negative-keep rate $\\beta$ biases the posterior to $p_s = p/(p + \\beta(1-p))$; the inverse map $p' = \\beta p_s/(\\beta p_s - p_s + 1)$ restores calibration without changing the ranking, and every rebalancing technique in the handbook raises ROC-AUC while lowering average precision"
    lesson: imbalance-techniques-revisited
  - text: "With $C_{FN} = $ amount and $C_{FP} = C_{TP} = C_a$, the Bayes-minimum-risk rule flags a transaction iff $C_a \\le \\mathrm{Amt}\\cdot P(\\text{fraud}\\mid x)$, and savings against doing nothing can be negative"
    lesson: example-dependent-cost
  - text: "Windowed aggregates over the entity's own history — count and amount over 1/7/30 days, conditional on type and country — more than triple the savings of raw features; a terminal risk computed over $[t-(d+w),\\,t-d]$ uses only labels known at $t$"
    lesson: transaction-aggregates
  - text: "On real card data a prequentially tuned depth-6 decision tree matches XGBoost on card precision at 100 at one to two orders of magnitude lower training cost; the metric, not the model class, decides the ranking"
    lesson: gbm-model-selection
  - text: "Isolation Forest scores a point by its expected path length under random axis-parallel splits, normalised by $c(n) = 2H(n-1) - 2(n-1)/n$: $s = 2^{-E[h]/c(n)}$, with sub-sampling to $\\psi = 256$ clearing swamping and masking"
    lesson: isolation-forest
  - text: "Guilt by association is a random walk with restart from the known-fraud nodes, $\\xi = \\alpha Q\\xi + (1-\\alpha)z$, a sparse linear system solved by power iteration; nine such exposure features alone reach AUC 0.92 on Worldline data"
    lesson: guilt-by-association
  - text: "Sequence models add signal only where the sequence is constrained: an LSTM lifts card-present AUCPR from 0.14 to 0.20 and leaves e-commerce unchanged, and hand-built aggregates close the gap either way"
    lesson: sequence-models-for-transactions
  - text: "A statically trained detector ranks last for every balancer and metric over 422 days; daily re-estimation with all past frauds retained ranks first"
    lesson: concept-drift
  - text: "Feedback labels are selected by the model that is then trained on them; importance weighting cannot correct that bias because selection depends on the label, and a separate feedback classifier averaged with a delayed-sample classifier beats pooling them"
    lesson: alert-feedback-selection-bias
  - text: "Under the PSD2 RTS the TRA exemption is lawful only while the 90-day value-weighted fraud rate stays under the band's reference rate (0.13% / 0.06% / 0.01% for cards at EUR 100 / 250 / 500); two breached quarters suspend it, and model precision therefore sets the legally allowed friction"
    lesson: psd2-sca-tra
  - text: "The AI Act lists credit scoring of natural persons as high-risk and carves out 'AI systems used for the purpose of detecting financial fraud' (Annex III 5(b)); a system that profiles natural persons under any Annex III heading is high-risk regardless of the Article 6(3) derogation"
    lesson: eu-ai-act-fraud

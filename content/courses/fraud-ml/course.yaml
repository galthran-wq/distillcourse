spine:
  - step: >-
      A fraud detector is one layer of a system: rules run before it,
      investigators with a budget of about a hundred alerts a day run after
      it, and the labels those investigators produce come back weeks later
      and only for what was alerted — every later difficulty is a
      consequence of that loop.
    label: The detector inside the loop
    years: "2002–2021"
    caption: >-
      A Belgian e-commerce stream carries about 400,000 payments a day with
      roughly a thousand frauds on some 300 cards; investigators open about
      a hundred alerts; a label returns in days to weeks; and the public
      datasets the field runs on are two days of PCA components, a
      simulator, a mobile-money replay and a Bitcoin graph.
    lessons: [fraud-detection-system, financial-crime-typology, economics-of-detection, canonical-datasets]
  - step: >-
      With one positive in a thousand and a hundred alerts a day, accuracy
      and 99.9% of the ROC curve measure nothing: the honest metrics are
      precision at the budget and cost in money, the honest validation runs
      forward in time with a delay block, the probabilities of a model
      trained on an undersampled stream are wrong by a closed-form factor,
      and under those the imbalance toolkit mostly stops helping.
    label: Rare positives, honest metrics
    years: "2002–2022"
    caption: >-
      On the handbook's simulator every rebalancing technique raises
      ROC-AUC and lowers average precision; a depth-50 tree wins on
      validation AUC and loses on the test week; the undersampled
      classifier's probabilities are restored by the β correction the lab
      implements.
    lessons: [alert-budget-metrics, delayed-labels-prequential, undersampling-calibration, imbalance-techniques-revisited, example-dependent-cost, ulb-handbook-benchmark, cost-aware-evaluation-lab]
  - step: >-
      A raw transaction has no fraud signal; the signal is the deviation
      from the entity's own history, which means windowed aggregates over
      the cardholder and the terminal, computed from what was known at
      scoring time — including labels that had not yet arrived.
    label: Features are context
    years: "2009–2023"
    caption: >-
      Count and amount over the last 1/7/30 days, conditional on type and
      country, lift savings 201% over raw fields and a periodic
      time-of-day flag adds 13% more; a terminal's fraud rate is shifted
      back seven days so that it uses only labels an investigator had
      produced.
    lessons: [transaction-aggregates, behavioural-profiles, point-in-time-features, paysim-feature-matrix, point-in-time-feature-lab]
  - step: >-
      On honest features under honest metrics, supervised detection is a
      model-selection problem: a scorecard the regulator can read, a
      boosted tree as the robust default, a feed-forward net for what
      trees cannot do — and the gap between model classes is smaller than
      the gap between metrics.
    label: Supervised detectors compared
    years: "2015–2022"
    caption: >-
      On Worldline data a tuned depth-6 tree matches XGBoost on card
      precision at 100 at a hundredth of the compute; the neural net wins
      ROC-AUC and ties the rest; the scorecard's points are a logistic
      regression on weights of evidence rescaled to 20 points per doubling
      of the odds.
    lessons: [scorecards-woe, gbm-model-selection, neural-tabular-detectors, worldline-model-comparison, scorecard-vs-gbm-lab]
  - step: >-
      Supervised models detect only the fraud they were shown; new fraud
      enters as a departure from normality scored by distance, isolation
      or reconstruction, which buys a decent ROC-AUC and a poor precision —
      a complement to the supervised score, not its replacement.
    label: The unlabeled frontier
    years: "2000–2022"
    caption: >-
      An autoencoder trained with zero labels reaches ROC-AUC 0.84 and
      average precision 0.18 on the simulator; a k-means cluster on the
      ULB set is 71% fraud against a 0.2% base rate and still floods the
      queue; adding the reconstruction error to a supervised model moves
      nothing.
    lessons: [anomaly-detection-framing, density-and-distance-scores, isolation-forest, one-class-and-reconstruction, ulb-unsupervised-scores, anomaly-scorers-lab]
  - step: >-
      Fraud is organised: the cardholders, merchants, devices and accounts
      around a transaction carry signal no per-row feature sees, found by
      testing whether fraud clusters, summarising and partitioning the
      neighbourhood, propagating known fraud through the graph as a random
      walk with restart, or learning the neighbourhood with a graph network.
    label: The graph around the transaction
    years: "2015–2023"
    caption: >-
      Nine exposure scores propagated from labelled fraudulent transactions
      reach AUC 0.92 alone and lift a random forest from 0.953 to 0.986;
      211 users found by components on shared-identifier edges carry 13% of
      a network's volume; on the Elliptic Bitcoin graph a random forest on
      hand-aggregated neighbour features beats a GCN, and every model
      collapses when a dark market shuts down.
    lessons: [fraud-as-a-graph, neighbourhood-and-centrality, communities-and-components, guilt-by-association, graph-neural-networks, elliptic-illicit-nodes, graph-propagation-lab]
  - step: >-
      The transaction stream drifts and the fraud evolves, so a model
      trained once ranks last: the sequence of an entity's events is itself
      a feature, change is measured on the features before labels arrive
      and detected on the error stream once they do, and the learner
      remembers, forgets and replaces itself on a cadence that the stream's
      own evaluation has to score.
    label: Drift and sequence
    years: "2004–2020"
    caption: >-
      Over 422 days of Worldline data the static model is last for every
      balancer; daily retraining beats weekly; an LSTM helps on
      card-present transactions and not on e-commerce; a classifier that
      tells Tuesday's transactions from Sunday's exposes the weekly cycle;
      Page–Hinkley and ADWIN trade detection delay against false alarms on
      a bit stream the lab generates.
    lessons: [sequence-models-for-transactions, concept-drift, change-detectors, stream-learning-and-adaptation, drift-strategies-on-worldline, drift-detector-lab]
  - step: >-
      The adversary reads the detector and edits the cheapest features
      until the score crosses the threshold, and the detector labels only
      what it chose to show the investigators — so the training data is
      biased by the model itself, and the correction is to know which
      samples it selected.
    label: The adversary and the feedback loop
    years: "2004–2018"
    caption: >-
      Against naive Bayes the spammer's cheapest edit lets every one of
      481 messages through; the adversary-aware classifier recovers all
      but 93. Importance weighting fixes a covariate shift on amount > 500
      and fails on alert feedback, because the selection depends on the
      label.
    lessons: [adversarial-classification, alert-feedback-selection-bias, arms-race-replay]
  - step: >-
      A score becomes an action under a budget — decline, step up, or
      review — must be explained to an investigator and to the customer,
      and must be monitored for stability and recalibrated; the model is a
      managed asset with a life cycle, not a file.
    label: From score to governed decision
    years: "2015–2023"
    caption: >-
      A 90% probability on EUR 10 is not worth an investigation and 25% on
      EUR 10,000 is; eight rules collapse to four decision-table columns
      and expose a conflict; a stability index above 0.25 is a red light;
      a deployed pipeline monitors 9 of its 25 features and gates on
      accuracy 0.95 that a constant model passes.
    lessons: [score-to-action, alert-explanations, model-risk-monitoring, fraudfinder-monitoring-read]
  - step: >-
      In the EU the loop is written into law: the AML rulebook fixes what
      is monitored, reported and recorded, which decisions a model may
      make and which may never leave the bank; PSD2 caps the fraud rate a
      risk-based exemption may run at; the AI Act decides whether the model
      is high-risk; GDPR Article 22 governs the automated decision; and the
      travel rule fixes which fields travel with a transfer.
    label: The regulator reads the logs
    years: "2015–2027"
    caption: >-
      Detection criteria, the onboarding decision and the suspicious
      transaction report cannot be outsourced; a card exemption at EUR 250
      is lawful while the 90-day value-weighted fraud rate stays under
      0.06%; credit scoring of natural persons is high-risk and fraud
      detection is carved out by one clause.
    lessons: [aml-transaction-monitoring-duty, aml-automated-decisions-and-supervision, psd2-sca-tra, eu-ai-act-fraud, gdpr-financial-crime-data, transfer-of-funds-crypto, tra-exemption-engine]
  - step: >-
      The system assembles it all: real-time scoring on point-in-time
      features served from one store, labels that mature over weeks and
      feed a retraining cadence, monitoring that closes the loop, and a
      record the regulator can audit.
    label: The system
    years: "2018–2024"
    caption: >-
      A decision within six seconds, features from a store that answers
      "what was known at t", daily retraining on feedbacks plus delayed
      samples, a 90-day fraud-rate controller and an alert ledger: the
      pipeline the course argued for, built on the simulator.
    lessons: [real-time-scoring-architecture, label-maturation, eu-transaction-monitoring-design, pipeline-capstone-lab]

outcomes:
  - id: co-frame
    text: "Explain why financial-crime detection differs from generic classification: the layered system, the investigator budget, delayed and selected labels, and an adapting adversary"
    bloom: understand
  - id: co-evaluate
    text: "Evaluate a detector under extreme imbalance with budget-aware and amount-weighted metrics and delay-aware temporal validation, and diagnose when a reported gain is a metric artifact"
    bloom: evaluate
  - id: co-features
    text: "Construct point-in-time-correct entity features from raw transaction logs and audit a feature pipeline for label and temporal leakage"
    bloom: create
  - id: co-detect
    text: "Build supervised, anomaly, graph and sequence detectors and attribute their differences to the data regime rather than the model class"
    bloom: create
  - id: co-adapt
    text: "Analyze drift, adversarial adaptation and alert-feedback selection bias in a deployed detector and design its detection, retraining and labelling strategy"
    bloom: analyze
  - id: co-govern
    text: "Design decision policies, explanations and monitoring that satisfy the EU frame — AMLR, PSD2 and its RTS, the AI Act, GDPR Article 22, the travel rule — and locate each obligation in the pipeline"
    bloom: create

modules:
  - slug: problem
    title: "The fraud detection problem"
    outcomes: [co-frame]
    lessons:
      - slug: fraud-detection-system
        title: "The layered fraud detection system"
        type: core
        status: drafted
        key_image: figures/clock-4.svg
        goal: "Explain why a payment network's deadline, its investigators' capacity and the way labels arrive force a fast rule stage before authorisation, a learned model after it, and a feedback loop that only ever labels what was alerted"
        opening: "A payment network sees about four hundred thousand card payments a day and must answer each one within a second or two. Around a thousand of those payments are fraud, the team that can phone a cardholder and check can handle about a hundred cases a day, and whether a payment really was fraud is only known days or weeks later, if anyone ever says. Where in that flow can a learned model sit, what can it be asked to do, and what does it get back?"
        est_minutes: 35
        prerequisites: []
        concepts:
          introduces: [fraud-detection-system, alert-feedback-interaction, verification-latency]
          reinforces: []
        key_ideas:
          - "The authorisation deadline forces checks that run in milliseconds (terminal checks, blocking rules) to sit before the answer and anything slower to sit after it"
          - "A hundred investigators' cases a day out of four hundred thousand payments make the model's output a ranking cut at k, not a yes/no"
          - "Labels come from the investigators' calls and from customer complaints, days to weeks later; silence is read as genuine"
          - "The investigators only ever see what the model ranked highest, so the freshest labels are a sample the model chose — the loop every later lesson lives inside"
          - "Rules are edited by people and must be precise; the model is retrained, not edited"
        demo: null
      - slug: financial-crime-typology
        title: "A typology of financial crime as learning problems"
        type: core
        status: drafted
        key_image: figures/typology.svg
        goal: "Classify the major financial-crime types — card fraud, account takeover, laundering, mules, sanctions evasion — by the unit that carries the label, where the label comes from, how late it arrives and whether the signal is in one record, one entity's history or the connections between entities"
        opening: "Stolen card numbers used online, a customer's own account emptied by someone who took it over, cash from drug sales turned into apartment purchases, a student paid to let money pass through their account, a sanctioned company paying through a cousin's firm: all of these land on a bank as 'financial crime'. Which of them can a classifier learn from examples, which show up only as a change in one person's habits, which are visible only in the connections between accounts, and which arrive with no reliable labels at all?"
        est_minutes: 35
        prerequisites: [fraud-detection-system]
        concepts:
          introduces: [card-not-present-fraud, money-laundering-stages, superimposition-fraud]
          reinforces: [fraud-detection-system, verification-latency]
        key_ideas:
          - "Five traits of fraud — uncommon, well considered, concealed, time-evolving, organised — and the difficulty each one hands the detector"
          - "Card-present vs card-not-present fraud: over half of the losses on under a sixth of the volume, and a label that usually does arrive"
          - "A whole account that is fraudulent vs fraud mixed into a legitimate account's own stream; account takeover is the second kind"
          - "Laundering as placement, layering, integration: judged at the pattern level, discovered years later if ever, with structuring as the adversary's reply to a reporting threshold"
          - "Each type as (unit, label source, delay, structure) — the table the rest of the course fills in"
        demo: null
      - slug: economics-of-detection
        title: "The economics of detection: base rates, costs and the alert budget"
        type: core
        status: drafted
        key_image: figures/funnel-3.svg
        goal: "Compute the precision, expected cost and value of a detector from its error rates, the base rate and the number of alerts a team can work, and explain why hit rate is not a target"
        opening: "A detector catches 99 of every 100 frauds and wrongly flags 1 of every 100 genuine payments. On a stream where one payment in a thousand is fraud, what share of its alerts are actually fraud, what does each alert and each miss cost, and how many alerts a day should the bank pay people to look at?"
        est_minutes: 35
        prerequisites: [fraud-detection-system]
        concepts:
          introduces: [base-rate-funnel, cost-matrix, inspection-budget]
          reinforces: [alert-feedback-interaction]
        key_ideas:
          - "The base-rate funnel: 1,000 payments → 1 fraud → about 11 flagged → about 1 true; prevalence, not error rates, sets the precision"
          - "Four outcomes with four costs; a fixed alert cost against a miss that costs the amount; the do-nothing policy as the baseline every detector is measured against"
          - "A million accounts at 1% false alarms a day is 10,000 calls a day — why automatic action waits for very strong evidence"
          - "Hit rate is not a target: 100% hit rate means too few inspections; the budget that maximises total utility is the one to staff"
          - "The value of catching a fraud falls with delay while the evidence for it grows"
        demo: null
      - slug: canonical-datasets
        title: "The canonical datasets: ULB, the handbook simulator, PaySim, Elliptic, AMLworld"
        type: core
        status: drafted
        key_image: figures/scorecard.svg
        goal: "Analyze what each public financial-crime dataset contains, how its labels were produced, and which part of the detection loop it hides"
        opening: "No bank publishes its transactions, so the published results of this field come from a handful of public datasets: two days of anonymised card payments, a simulator, a replayed mobile-money log, a Bitcoin transaction graph and a synthetic laundering world. Before any number from them is trusted, what does each one actually contain, where did its labels come from, and which part of the detection loop does it leave out?"
        est_minutes: 40
        prerequisites: [financial-crime-typology, economics-of-detection]
        concepts:
          introduces: [transaction-simulator, label-completeness]
          reinforces: [verification-latency, money-laundering-stages, alert-feedback-interaction]
        key_ideas:
          - "ULB 2013: 284,807 transactions, 492 frauds (0.172%), 28 PCA components, Time and Amount — released with the undersampling-calibration paper; no entity, no feature names, two days"
          - "The handbook simulator: a 100×100 grid, three scripted fraud scenarios (amount > 220; terminals compromised for 28 days; ×5 amounts for 14 days), 0.84% fraud, labels complete and instant"
          - "PaySim: an aggregate-level replay of a mobile-money log; the 2016 paper injects no fraud, so the Kaggle label is a later addition"
          - "Elliptic: 203k Bitcoin transactions, 2% illicit, 49 time steps with no edges between them; AMLworld: eight laundering patterns, transitive taint, labels no real bank has"
          - "What each hides — the delay, the feedback loop, the entity, the adversary — read against the module's loop"
        demo: null

  - slug: rare-positives
    title: "Rare positives: evaluation and imbalance"
    outcomes: [co-evaluate]
    lessons:
      - slug: alert-budget-metrics
        title: "Metrics under an alert budget: average precision and card precision at k"
        type: core
        status: drafted
        key_image: figures/roc-sliver-3.svg
        goal: "Compute average precision and card precision at k for a ranked day of transactions and explain why the ROC curve's reachable region is a sliver"
        opening: "A model has scored the day's 8,300 payments and the investigators can open 100 of them. Accuracy says nothing useful when 99% of payments are genuine, and the usual summary of a ranking, the area under the ROC curve, averages over thresholds the team will never use. What number should you compute from the ranked list so that a better number means more fraud caught within the hundred?"
        est_minutes: 45
        prerequisites: [economics-of-detection]
        concepts:
          introduces: [average-precision, precision-at-k, card-precision-at-k]
          reinforces: [inspection-budget, base-rate-funnel]
        key_ideas:
          - "The 10-transaction toy: a useless and a good classifier tie on misclassification error; the PR curve dips 0.5 → 0.33 → 0.5"
          - "Why ROC is blind here: 100 checks over 8,300 payments is FPR ≤ 0.012, so the curve's right 99% describes operating points nobody will use"
          - "Average precision as a step sum; a random ranker's AP equals the prevalence; PR dominance iff ROC dominance, but PR is the zoom on the reachable corner"
          - "P@k per day with its ceiling (55 frauds → at most 0.55 at k = 100); one alert per card, not per transaction; detected cards removed from later days (0.286 → 0.241)"
          - "Report all three — AUC, AP, CP@k — because they answer different questions"
        demo:
          component: RankingBudgetExplorer
          spec: >-
            Ten transactions (two fraud) with draggable rank order; live
            ROC-AUC, average precision and P@3 as the reader reorders.
            Task: find an ordering that raises ROC-AUC while lowering AP,
            then an ordering with the same AUC and P@3 = 0 — the reader
            falsifies "AUC orders classifiers" by construction before the
            prose explains which region of the curve the budget can reach.
      - slug: delayed-labels-prequential
        title: "Temporal validation with delayed labels: prequential folds"
        type: core
        status: drafted
        key_image: figures/folds-2.svg
        goal: "Design a train/delay/test validation for a transaction stream and explain why prequential folds estimate the test week where random folds and AUC-selected depth do not"
        opening: "You want to know how well the model will do on next week's payments. But a payment's label arrives a week or more after the payment, so the latest labelled data ends a week before today, and some of the cards in next week's data are ones the bank already blocked. How do you cut the history into training and test sets so that the test number predicts what next week will show?"
        est_minutes: 45
        prerequisites: [alert-budget-metrics]
        concepts:
          introduces: [delay-period, prequential-validation, known-card-removal]
          reinforces: [card-precision-at-k, verification-latency, average-precision]
        key_ideas:
          - "Why a random split lies: it trains on the future and tests on cards the bank would have blocked"
          - "Blocks: training, a delay block whose labels were not yet known, test; old blocks dropped because the stream moves"
          - "Test-day construction: remove the transactions of cards known compromised at day − delay; remaining frauds fall from 74–91 to 41–60"
          - "Validation must mimic the test: shift the whole geometry back; hold-out vs repeated hold-out vs prequential, and why the same-period estimate understates variance 3–8×"
          - "The overfitting set piece: training AUC climbs to depth 50 while test AP peaks at depth 4–6, and validation AUC still picks 50"
        demo: null
      - slug: undersampling-calibration
        title: "The undersampled posterior and its correction"
        type: core
        status: drafted
        key_image: figures/map.svg
        goal: "Derive the bias that keeping a fraction β of the genuine transactions introduces into a classifier's posterior, the closed-form map that undoes it, and the matched threshold under which the corrected decisions are unchanged"
        opening: "To train on a stream with one fraud in five hundred payments you throw away most of the genuine payments and keep all the frauds. The model then says 'probability of fraud 0.5' for a payment that, on the real stream, is fraud perhaps once in fifty times. Can the number it outputs be turned back into the real probability, and does doing so change which payments it ranks highest?"
        est_minutes: 40
        prerequisites: [delayed-labels-prequential]
        concepts:
          introduces: [undersampling-calibration, matched-threshold]
          reinforces: [base-rate-funnel, average-precision]
        key_ideas:
          - "Undersampling as a selection variable that depends on the class only: $p(x \\mid y)$ unchanged, the prior shifted"
          - "$p_s = p/(p + \\beta(1-p))$ by Bayes; the inverse $p' = \\beta p_s/(\\beta p_s - p_s + 1)$; the worked table of 1,000 positives in 10,000"
          - "The map is monotone, so the ranking and ROC-AUC do not move; only calibration and the Brier score do"
          - "The bias is largest where the classes overlap (the two Gaussian tasks, μ = 3 vs 15) and grows as β shrinks"
          - "The matched threshold $\\tau' = \\beta\\tau_s/((\\beta-1)\\tau_s + 1)$ equals the original prior, so corrected probabilities with the moved threshold give the same decisions"
        demo: null
      - slug: imbalance-techniques-revisited
        title: "Rebalancing under honest metrics"
        type: core
        status: drafted
        key_image: figures/surface-3.svg
        goal: "Evaluate class weights, resampling, synthetic oversampling and balanced ensembles on card data under average precision and card precision at k, and explain why a technique that raises ROC-AUC lowers precision"
        opening: "The standard toolkit for rare classes — class weights, oversampling, synthetic minority points, undersampling, rebalanced ensembles — was mostly judged by ROC-AUC and balanced accuracy. Under precision at the top hundred and average precision, on a forward-in-time split, which of those techniques still help a fraud detector, and why would a technique raise one metric while lowering another?"
        est_minutes: 40
        prerequisites: [undersampling-calibration]
        concepts:
          introduces: [imbalance-ratio, balanced-bagging]
          reinforces: [average-precision, card-precision-at-k, prequential-validation, undersampling-calibration]
        key_ideas:
          - "What every technique does geometrically: it moves the decision boundary into the majority region, which raises recall at a threshold and manufactures false positives"
          - "On the 2-D toy, class weighting lifts balanced accuracy 0.64 → 0.90 for a logistic regression while AUC and AP do not move"
          - "On transactions: class weight, SMOTE, RUS, SMOTE+RUS all raise AUC and lower AP; the best imbalance ratio for AP and CP@100 is the natural one"
          - "Balanced bagging gains come from tree diversity, not rebalancing; XGBoost is the most robust because boosting on residuals already upweights the minority"
          - "Samplers go inside the prequential pipeline so that only training folds are resampled"
        demo: null
      - slug: example-dependent-cost
        title: "Example-dependent cost-sensitive learning and the Bayes-minimum-risk threshold"
        type: core
        status: drafted
        key_image: figures/threshold.svg
        goal: "Derive the Bayes-minimum-risk decision rule for a transaction whose false-negative cost is its amount, and compute the savings of a detector against doing nothing"
        opening: "A missed fraud costs the bank the amount that was stolen, which runs from a few euros to thousands, while every alert costs the same few euros of an investigator's time whether it was fraud or not. A threshold of 0.5 on the fraud probability treats a EUR 10 payment and a EUR 10,000 payment alike. What decision rule accounts for the amount, and how do you measure a detector in money against the bank that does nothing?"
        est_minutes: 40
        prerequisites: [imbalance-techniques-revisited]
        concepts:
          introduces: [example-dependent-cost, savings-metric, bayes-minimum-risk]
          reinforces: [cost-matrix, undersampling-calibration]
        key_ideas:
          - "The cost matrix with $C_{FN} = \\mathrm{Amt}$, $C_{TP} = C_{FP} = C_a$, $C_{TN} = 0$; a constant 100×$C_a$ miss cost as the alternative and what it gets wrong"
          - "Savings = (Cost of doing nothing − Cost of the detector)/Cost of doing nothing, with doing nothing costing the total fraud amount; savings can be negative"
          - "Elkan's constant-cost threshold $1/(1 + C_{FN}/C_{FP})$ as the special case; the per-transaction rule flag iff $C_a \\le \\mathrm{Amt}\\cdot P(\\text{fraud}\\mid x)$"
          - "Why the rule needs calibrated probabilities — the undersampling correction is now load-bearing"
          - "Fitting with costs vs deciding with costs; resampling does not improve savings because it distorts the cost distribution"
        demo: null
      - slug: ulb-handbook-benchmark
        title: "The handbook benchmark: five models, three metrics, simulated and real data"
        type: core
        status: drafted
        key_image: figures/real-rankings.svg
        goal: "Evaluate five baseline models on simulated and Worldline card data and attribute every ranking reversal to the metric and the data regime"
        opening: "Five standard classifiers — logistic regression, a shallow tree, an unpruned tree, a random forest and a boosted ensemble — are trained on a simulated week and on a week of real card payments, each scored three ways. Which one is best? The answer depends on the metric and the data, and the module's results should say exactly why."
        est_minutes: 35
        prerequisites: [delayed-labels-prequential, imbalance-techniques-revisited]
        concepts:
          introduces: []
          reinforces: [average-precision, card-precision-at-k, prequential-validation, known-card-removal, transaction-simulator]
        key_ideas:
          - "The artifact: 67k training transactions with 598 frauds, a one-week delay, a one-week test, five models scored by AUC, AP and CP@100"
          - "The unpruned tree beats the depth-2 tree on AUC (0.788 vs 0.763) and loses on AP (0.309 vs 0.496): overfitting that one metric rewards"
          - "The depth-2 tree reads the simulator's amount > 220 rule off the data (threshold 218.67); on real data it finds terminal risk × burst"
          - "Real data: 0.25% fraud, about 3 frauds per compromised card, random CP@100 ≈ 0.0025, logistic regression ≈ 0.15; PR curves squashed to the floor"
          - "Departures from the idealisation: a one-week delay is a simplification; labels in the replay are complete; the simulator's fraud is scripted"
        demo: null
      - slug: cost-aware-evaluation-lab
        title: "Lab: a budget- and cost-aware evaluation harness"
        type: lab
        status: drafted
        goal: "Build an evaluation harness — prequential split with delay and known-card removal, average precision, card precision at k, savings, the Bayes-minimum-risk threshold and the undersampling correction — and use it to referee a model selection on the simulator"
        opening: "The lab builds the scorer every later lab is judged by: forward-in-time folds with a delay block, precision at the investigators' budget, savings in money and probabilities corrected for the undersampling the model was trained on — then uses it to settle which depth of tree to ship."
        est_minutes: 12
        prerequisites: [example-dependent-cost, ulb-handbook-benchmark]
        concepts:
          introduces: []
          reinforces: [prequential-validation, card-precision-at-k, savings-metric, bayes-minimum-risk, undersampling-calibration]
        key_ideas:
          - "A step-sum average precision and a per-day card precision with detected-card removal, checked against the handbook's numbers"
          - "Folds that shift the training start back by the delay plus the test width"
          - "Savings with FN cost = amount; the per-transaction BMR decision"
          - "The β correction turns an undersampled model's scores back into probabilities without touching the ranking"
        demo: null
        lab:
          est_hours: 4
          checkpoints:
            - id: average-precision
              kind: exact
              text: "Average precision as the step sum over the ranked list, a block of tied scores opened as one cut, no interpolation"
            - id: savings-metric
              kind: exact
              text: "Cost and savings with the false-negative cost equal to the amount, a fixed alert cost charged on caught frauds too, and the cheaper trivial policy as the baseline"
            - id: prequential-split
              kind: exact
              text: "Train/test role matrix with a delay block and per-day known-card removal, the whole geometry shifted back one block per fold"
            - id: card-precision-top-k
              kind: exact
              text: "Card precision at k per day — one alert per card, detected cards removed from later days"
            - id: undersampling-correction
              kind: exact
              text: "The β correction that maps an undersampled model's posteriors back to the stream, with the matched threshold and β measured as the genuine keep rate"
            - id: bmr-threshold
              kind: exact
              text: "Bayes-minimum-risk decisions from an undersampled model's scores — corrected with your β map, decided per transaction from the amount, priced with your savings over a range of alert costs"
            - id: prequential-selection
              kind: exact
              text: "Validation ROC-AUC, AP and CP@k of every candidate on prequential folds shifted back by the delay plus the validation block, with the pick of each metric"
            - id: why-auc-spares-depth-50
              kind: review
              text: "Written answer: why validation ROC-AUC scores the fully grown tree level with the best depths while average precision ranks it last"
            - id: beat-holdout-week
              kind: metric
              text: "Beat a ROC-AUC bar over the card-days of a held-out week from a second simulator run, with a model chosen on your own prequential folds"
              required: false
        notes: "Canon grounding (CS6890 PS3, HKU FITE7410 A2 cost comparison, the handbook's shared_functions), dataset and checkpoint detail live in research/cost-aware-evaluation-lab.md (LAB PLAN)."

  - slug: features
    title: "Features from transactions"
    outcomes: [co-features]
    lessons:
      - slug: transaction-aggregates
        title: "Entity history aggregates: RFM, windows and conditional sums"
        type: core
        status: drafted
        key_image: figures/window-4.svg
        goal: "Construct windowed count and amount aggregates over a cardholder's and a terminal's earlier transactions, overall and conditional on type and country, and explain why each one carries signal the raw record does not"
        opening: "A single card payment record says: card 4471, terminal 9023, EUR 184, Tuesday 14:07. Nothing in those four fields says whether it is fraud; the same payment is normal for one cardholder and alarming for another. How do you turn a card's and a terminal's past into numbers that stand next to the payment, computed only from what happened before it?"
        est_minutes: 45
        prerequisites: [delayed-labels-prequential]
        concepts:
          introduces: [rfm-aggregates, windowed-aggregation, conditional-aggregation]
          reinforces: [delay-period, card-not-present-fraud]
        key_ideas:
          - "Why the raw fields fail: identifiers are categorical with no order, amounts mean nothing without the card's usual amount, and a tree on raw fields learns nothing a rule did not"
          - "Recency, frequency, monetary over the entity: the probe-then-spend pattern as recent-low then recent-high"
          - "Windowed count and sum over the last $t_p$ hours, strictly earlier rows only; the seven-row worked table whose first row is all zeros"
          - "Conditional aggregates: the same window restricted to the same type, country or merchant group — and the two different semantics of 'at the merchant'"
          - "The handbook's 14 features and the sanity check that a customer's 30-day mean converges to its generating parameters; ★ why the card ID itself is dropped"
        demo: null
      - slug: behavioural-profiles
        title: "Behavioural profiles: periodic time, peer groups and break points"
        type: core
        status: drafted
        key_image: figures/clock.svg
        goal: "Construct profile-deviation features — a von Mises time-of-day flag, peer-group and break-point statistics, inter-event time — and explain why each is a contextual anomaly score with the entity as the context"
        opening: "A cardholder usually pays at 22:00, 23:00, 02:00 and 03:00. The average of those clock times is 12:30, an hour at which they never pay, so a feature built on 'distance from the usual time' with ordinary arithmetic would flag their most ordinary purchases. How should a 'usual time', a 'usual peer' and a 'usual self' be computed so that a departure from each is a feature a detector can use?"
        est_minutes: 40
        prerequisites: [transaction-aggregates]
        concepts:
          introduces: [periodic-time-feature, peer-group-analysis, break-point-analysis]
          reinforces: [rfm-aggregates, windowed-aggregation]
        key_ideas:
          - "Clock time lives on a circle: the circular mean, the von Mises fit, the confidence arc, and the binary 'inside the arc' feature; at least seven days of history"
          - "Peer-group analysis is inter-account (Christmas spending is not flagged because the peers spend too); break-point analysis is intra-account (old window vs new window, a t-test)"
          - "Time since the previous event, because frauds come in bursts; the cumulative-spend line and its slope change"
          - "The same value is normal in one context and anomalous in another — the cardholder is the context, which is what makes these features different from the aggregates"
        demo:
          component: CircularMeanClock
          spec: >-
            A 24-hour clock on which the reader places up to six transaction
            times; the arithmetic mean and the circular (von Mises) mean are
            drawn as two hands, the fitted concentration as a shaded arc.
            Task: place four times so the arithmetic hand points at an hour
            with no transactions while the circular hand sits among them;
            then add one 06:00 transaction and read off whether it falls
            inside the 90% arc.
      - slug: point-in-time-features
        title: "Point-in-time correctness: label-derived features, as-of joins and parity"
        type: core
        status: drafted
        key_image: figures/shift-3.svg
        goal: "Design a feature pipeline whose training rows contain only what was known at each transaction's timestamp — including a terminal risk shifted by the label delay — and whose serving path computes the same values"
        opening: "A terminal's fraud rate over the last month is a strong feature, but the frauds of the last week are not yet known when today's payment is scored. If the training table is built from the final labels, the feature there contains information the live system will never have, and the offline score is a fiction. How do you build every feature so that each training row holds only what was knowable at that row's moment, and the serving path computes the same value?"
        est_minutes: 45
        prerequisites: [transaction-aggregates]
        concepts:
          introduces: [delayed-terminal-risk, point-in-time-join, feature-store, training-serving-skew]
          reinforces: [delay-period, verification-latency, windowed-aggregation]
        key_ideas:
          - "Two kinds of leak: using the future (a window that includes later rows) and using labels that had not arrived (a terminal's fraud rate from today's labels)"
          - "The terminal risk over $[t-(d+w),\\,t-d]$ as the difference of two rolling sums; the delay $d$ is the label latency, and the tree that splits on it at 0.075 is reading a feature the live system can compute"
          - "The as-of join: the last value recorded up to, never after, the row's timestamp; a read-instances table of (entity, timestamp, label)"
          - "One store answering both reads — batch features over days, streaming features over minutes — so training and serving see the same numbers"
          - "Training–serving skew made concrete: a pipeline that trains on zero-filled minute features and serves real ones; the parity check that replays a day through the serving path"
        demo: null
      - slug: paysim-feature-matrix
        title: "From PaySim logs to a feature matrix"
        type: core
        status: drafted
        key_image: figures/generator.svg
        goal: "Analyze the PaySim mobile-money log as an artifact — what its generator replays, what its fraud flag encodes — and construct a feature matrix whose signal survives that reading"
        opening: "A six-million-row mobile-money log on Kaggle carries 8,213 rows marked fraud. Before building features on it: what did the simulator that produced it actually replay from the real service, how did the fraud flag get there, and which patterns in the data are signal and which are artefacts of the generator?"
        est_minutes: 35
        prerequisites: [behavioural-profiles, point-in-time-features, canonical-datasets]
        concepts:
          introduces: []
          reinforces: [rfm-aggregates, windowed-aggregation, periodic-time-feature, transaction-simulator, label-completeness]
        key_ideas:
          - "The artifact: the Kaggle PaySim log read against the 2016 paper — an aggregate replay per day and hour of five transaction types, with no fraud injected in the paper"
          - "What the data shows: fraud only in TRANSFER and CASH_OUT, uniform over time steps while genuine traffic has a daily rhythm, no extreme amounts among frauds"
          - "Features that survive: the type gate, hour of day from step mod 24, origin and destination balance deltas, per-account windowed counts; features that are generator artefacts"
          - "Departure from the idealisation: no delay, no feedback loop, no adversary, a label that is a generator flag"
        demo: null
      - slug: point-in-time-feature-lab
        title: "Lab: a point-in-time feature pipeline"
        type: lab
        status: drafted
        goal: "Build a feature pipeline that turns raw transaction logs into windowed aggregates, conditional aggregates, a delayed terminal risk and a periodic time flag, joined point-in-time onto every scoring row"
        opening: "The lab builds the feature pipeline: windowed aggregates over each entity's past, conditional sums, a terminal risk shifted by the label delay and a circular time feature, joined onto every scoring row as of its own timestamp — and a shipped reference pipeline hides one leak for the learner to find."
        est_minutes: 12
        prerequisites: [paysim-feature-matrix]
        concepts:
          introduces: []
          reinforces: [windowed-aggregation, conditional-aggregation, delayed-terminal-risk, periodic-time-feature, point-in-time-join, training-serving-skew]
        key_ideas:
          - "Time-based rolling windows over strictly earlier rows, checked against the seven-row worked table"
          - "A terminal risk as the difference of two rolling sums shifted by the delay"
          - "A von Mises time flag checked against the worked example"
          - "An as-of join that never reads the future"
        demo: null
        lab:
          est_hours: 4.5
          checkpoints:
            - id: calendar-flags
              kind: exact
              text: "Weekend and night flags from the transaction timestamp"
            - id: customer-windows
              kind: exact
              text: "Count and mean amount over the customer's previous 1, 7 and 30 days, strictly earlier rows only"
            - id: conditional-aggregates
              kind: exact
              text: "Count and sum over the card's earlier payments in the last 24 hours of the same type and in the same country"
            - id: terminal-risk-delayed
              kind: exact
              text: "Terminal payment count and fraud rate over a window ending one label delay before any (terminal, time) query, as a difference of two prefix sums"
            - id: periodic-time-flag
              kind: exact
              text: "Circular mean, von Mises concentration and the inside-the-interval flag for a customer's clock times"
            - id: point-in-time-join
              kind: exact
              text: "As-of join of the nightly feature log onto scoring rows — the record with the largest stamp at or before each timestamp, none if there is none"
            - id: find-the-leak
              kind: review
              text: "Written answer: name the leak in the shipped reference pipeline and the row on which it first shows"
            - id: feature-lift
              kind: metric
              text: "Beat a ROC-AUC bar on a hold-out week whose labels have not arrived, by adding columns to your matrix in front of a frozen logistic regression"
              required: false
        notes: "Canon grounding (FraudFinder notebook 02's batch windows and delayed terminal risk; HKU FITE7410 A1 Part I feature engineering on PaySim), dataset and checkpoint detail live in research/point-in-time-feature-lab.md (LAB PLAN)."

  - slug: supervised
    title: "Supervised detectors"
    outcomes: [co-detect]
    lessons:
      - slug: scorecards-woe
        title: "Logistic scorecards: weights of evidence, information value and points"
        type: core
        status: drafted
        key_image: figures/scorecard.svg
        goal: "Construct a points-based fraud scorecard from coarse-classified variables through weights of evidence to a scaled logistic regression, and explain why its one-coefficient-per-variable form is what a reviewer can check"
        opening: "A regulator, an investigator and a customer all need to see why a payment scored high, and a model with hundreds of interacting splits cannot show them. A scorecard gives each value of each variable a number of points and adds them up. How are the points derived from data so that the card is both a valid classifier and a table a reviewer can check line by line?"
        est_minutes: 45
        prerequisites: [example-dependent-cost]
        concepts:
          introduces: [weight-of-evidence, information-value, points-scorecard]
          reinforces: [cost-matrix, bayes-minimum-risk]
        key_ideas:
          - "Why bins: a variable's fraud risk is not monotone in its raw value (the age curve), and a reviewer can read a bin but not a spline"
          - "Coarse classification: equal-interval vs equal-frequency bins, the odds pivot table, two binnings compared by chi-squared (583 vs 662)"
          - "WOE = ln(share of non-frauds / share of frauds) per bin; IV = Σ(Dist_good − Dist_bad)·WOE; the 2,000-row age table with IV 0.6502; one monotone coefficient per variable"
          - "Score = Offset + Factor·ln(odds); 20 points per doubling of the odds gives Factor 28.85 and Offset −12.87 at 100 points for 50:1; points per attribute"
          - "Variable selection under sign constraints, latency and legal limits; filters are univariate"
        demo: null
      - slug: gbm-model-selection
        title: "Tree ensembles and prequential model selection"
        type: core
        status: drafted
        key_image: figures/triplet.svg
        goal: "Evaluate decision trees, random forests and XGBoost under prequential selection on simulated and real card data, and explain why a tuned single tree matches the boosted ensemble on card precision at a hundredth of the cost"
        opening: "A boosted tree ensemble with the right depth, learning rate and number of trees beats a single tree, but the right values depend on the data and the metric, and every candidate costs minutes to hours of compute. How do you choose the settings for next week's data when the only labels you have are a week old, and how much does the choice buy over a well-tuned single tree?"
        est_minutes: 40
        prerequisites: [imbalance-techniques-revisited]
        concepts:
          introduces: [best-estimated-vs-optimal, random-search]
          reinforces: [prequential-validation, card-precision-at-k, average-precision, imbalance-ratio]
        key_ideas:
          - "Model selection as the argmax of validation performance; default, best-estimated and optimal parameters as a triplet, and the gap between the last two as the cost of selecting"
          - "The decision tree on the simulator: AUC picks depth 50, AP picks 3, CP@100 picks 5; the optimum is 4/4/5 — the metric sets the model"
          - "Random search: 10 of 18 XGBoost combinations in 690 s against 1,251 s for the grid, same scores, because the important parameter gets more distinct values"
          - "Real data: XGBoost's selected 100 trees give CP@100 0.235 where 50 would give 0.249; a depth-6 tree gives 0.232 for 1,617 s of grid against 8,788 s"
          - "Prequential folds give AP std 0.022 where repeated hold-out gives 0.0065 — the honest uncertainty of the choice"
        demo: null
      - slug: neural-tabular-detectors
        title: "Feed-forward networks on transaction features"
        type: core
        status: drafted
        key_image: figures/loss-curves.svg
        goal: "Construct and tune a feed-forward network on engineered transaction features and explain what has to be done to make it competitive with a tree ensemble and what it buys that trees cannot"
        opening: "On a table of engineered features, boosted trees usually win and are cheaper to train. Yet banks train neural networks on the same tables. What has to be done to make a feed-forward network competitive on transaction features — scaling, optimiser, stopping, regularisation, categorical inputs — and what does the network buy that the trees cannot?"
        est_minutes: 40
        prerequisites: [gbm-model-selection]
        concepts:
          introduces: [feed-forward-detector, early-stopping-on-validation, entity-embedding]
          reinforces: [prequential-validation, average-precision, card-precision-at-k]
        key_ideas:
          - "Scaling matters for the first layer and not for trees; log1p for the heavy-tailed amount; without scaling the learning rate must drop tenfold and the result is still worse"
          - "SGD needs 251 epochs where Adam needs 13 to a better optimum; early stopping with patience on validation loss; dropout 0.2 helps, 0.4 hurts"
          - "An embedding of dimension k is a linear layer on a one-hot input; terminal and weekday embeddings add nothing over the aggregates on the simulator — a null result"
          - "The benchmark: NN 0.876 / 0.675 / 0.303 vs XGBoost 0.869 / 0.687 / 0.303 after a 162-network grid costing 7,350 s"
          - "What the network buys: incremental updating, representation learning from raw sequences, averaging weights across institutions, diversity for stacking"
        demo: null
      - slug: worldline-model-comparison
        title: "Eight models on Worldline data: the metric-dependent ranking"
        type: core
        status: drafted
        key_image: figures/leaderboards.svg
        goal: "Evaluate the eight-model comparison on real card data and attribute each leaderboard to the metric, the validation design and the compute spent"
        opening: "Eight model families are trained and tuned on the same weeks of real card payments and scored by three metrics. The random forest, the attention-LSTM and a depth-six tree each top one of the three leaderboards. What in the validation design, the metrics and the compute spent produces three different winners from one experiment?"
        est_minutes: 35
        prerequisites: [neural-tabular-detectors, scorecards-woe]
        concepts:
          introduces: []
          reinforces: [best-estimated-vs-optimal, card-precision-at-k, average-precision, prequential-validation, feed-forward-detector]
        key_ideas:
          - "The artifact: the real-world model-selection chapter and the global table — DT, LR, RF, XGB, FFNN, CNN, LSTM, LSTM+attention × three metrics"
          - "Overfitting reproduced on real data: test AP peaks at depth 4–5 while training keeps rising to 50; the optimal depth is higher than on the simulator"
          - "Sequential nets beat tree ensembles on AP (0.104 vs 0.095), tie on CP@100, lose on AUC; attention adds little"
          - "Departures: labels in the replay are complete, grids are four folds, and the best LSTM came from the slowest schedule"
        demo: null
      - slug: scorecard-vs-gbm-lab
        title: "Lab: a scorecard and a boosted tree under the same referee"
        type: lab
        status: planned
        goal: "Build a weight-of-evidence scorecard from scratch, train a gradient-boosted detector on the same prequential folds, and choose between them by savings and card precision with a written case for the choice"
        opening: "Two detectors built by the learner — a points scorecard assembled table by table and a boosted tree tuned by random search — scored by the same forward-in-time referee, with the choice between them argued in money."
        est_minutes: 12
        prerequisites: [worldline-model-comparison, cost-aware-evaluation-lab]
        concepts:
          introduces: []
          reinforces: [weight-of-evidence, information-value, points-scorecard, best-estimated-vs-optimal, savings-metric]
        key_ideas:
          - "Equal-frequency bins, WOE and IV reproduced against the textbook's age table"
          - "Points per attribute from Factor and Offset; a score that adds"
          - "The boosted tree tuned by random search on prequential folds with the module-2 harness"
          - "The choice argued as a cost comparison, not a metric comparison"
        demo: null
        lab:
          est_hours: 4
          checkpoints:
            - id: equal-frequency-bins
              kind: exact
              text: "Equal-frequency binning of a numeric variable with the bin edges and counts"
            - id: woe-iv
              kind: exact
              text: "Weight of evidence per bin and the variable's information value, checked against the textbook's 2,000-row age table"
            - id: chi2-binning-compare
              kind: exact
              text: "Chi-squared comparison of two candidate binnings of the same variable"
            - id: scorecard-points
              kind: exact
              text: "Factor and Offset for 20 points per doubling of the odds, and the points of every attribute of a fitted logistic regression on WOE features"
            - id: fit-scorecard
              kind: exact
              text: "The full scorecard: bins → WOE → logistic fit → points, scoring a held-out transaction table"
            - id: tuned-gbm
              kind: exact
              text: "Random search over a boosted-tree grid on prequential folds with the module-2 harness, returning the best-validation configuration per metric"
            - id: which-to-ship
              kind: review
              text: "Written answer: which detector to ship, argued in savings and investigation cost, naming what the other one buys"
            - id: beat-savings
              kind: metric
              text: "Beat the savings bar on the held-out week with either detector"
              required: false
        notes: "Canon grounding (HKU FITE7410 A2: two supervised algorithms and a practical cost-based comparison; CS6890 PS3; the scorecard checkpoints are built from Baesens' worked tables, which are not an assignment), dataset and checkpoint detail live in research/scorecard-vs-gbm-lab.md (LAB PLAN)."

  - slug: anomaly
    title: "The unlabeled frontier: anomaly detection"
    outcomes: [co-detect]
    lessons:
      - slug: anomaly-detection-framing
        title: "Anomaly types, label regimes and the assumption behind each detector"
        type: core
        status: planned
        goal: "Classify anomalies as point, contextual or collective and detectors by label regime and key assumption, and predict from the assumption which detector fails on which data geometry"
        opening: "A supervised detector finds the kinds of fraud it was shown. A new scheme produces payments unlike any labelled fraud, and the only thing known about them is that they are unlike the normal ones. What does 'unlike normal' mean for a payment, what has to be assumed about normal data to detect departures from it, and when does each assumption break?"
        est_minutes: 35
        prerequisites: [behavioural-profiles]
        concepts:
          introduces: [point-contextual-collective-anomaly, label-regime, anomaly-assumption]
          reinforces: [peer-group-analysis, superimposition-fraud]
        key_ideas:
          - "Point, contextual and collective anomalies with card examples: an amount far above the person's normal; EUR 1,000 a week in December vs July; a run of small payments that is suspicious only as a run"
          - "Supervised, semi-supervised (normal only), unsupervised (none, assuming normal dominates) — and where the rarity assumption breaks"
          - "The two fuzzy balls: a boundary around one cardholder's normal weeks vs a second ball of fraud weeks; what each can and cannot find"
          - "Each family's one assumption — dense neighbourhoods, cluster membership, a stochastic model, a subspace — doubles as its failure condition: the three 2-D thought experiments"
        demo: null
      - slug: density-and-distance-scores
        title: "Distance and density scores: kth-neighbour distance, LOF and Mahalanobis"
        type: core
        status: planned
        goal: "Compute kth-nearest-neighbour, local-outlier-factor and Mahalanobis anomaly scores and explain the varying-density failure that LOF repairs"
        opening: "The simplest way to score how unusual a payment is: measure how far it sits from its nearest neighbours in feature space. A point at the edge of a sparse but legitimate group then scores higher than a true outlier beside a dense group. How do you score distance relative to the local crowd, and what do the statistical versions of the same idea assume?"
        est_minutes: 40
        prerequisites: [anomaly-detection-framing]
        concepts:
          introduces: [knn-distance-score, local-outlier-factor, mahalanobis-score]
          reinforces: [anomaly-assumption, break-point-analysis]
        key_ideas:
          - "kth-neighbour distance and count-within-radius as scores; the $O(N^2)$ cost and its pruning"
          - "The varying-density failure (a point near a dense cluster hidden by a sparse one) and LOF as the ratio of the neighbours' local density to the point's own"
          - "z-score, the 1.5-IQR fence and 3σ coincide on Gaussian data (99.3% vs 99.7%); Grubbs' test; Mahalanobis as its multivariate form"
          - "Histogram profiles miss the rare combination of common values; the robust-PCA score is Mahalanobis in a subspace"
          - "What both distance and density miss: a dense cluster of anomalies larger than k"
        demo: null
      - slug: isolation-forest
        title: "Isolation Forest"
        type: core
        status: planned
        goal: "Derive the Isolation Forest anomaly score from expected path length under random partitioning and explain why sub-sampling improves detection"
        opening: "Scoring every point by its distance to every other costs time quadratic in the data, which a stream of hundreds of thousands of payments a day cannot pay. Anomalies are few and different: a random axis-aligned cut separates them from the rest in fewer tries than a normal point. Can 'how many random cuts does it take' be turned into a score, and why does a tiny random sub-sample of the data make it better?"
        est_minutes: 40
        prerequisites: [density-and-distance-scores]
        concepts:
          introduces: [isolation-path-length, isolation-score, swamping-masking]
          reinforces: [knn-distance-score, anomaly-assumption]
        key_ideas:
          - "Random axis-parallel splits: 4 cuts for the outlier against 12 for a normal point; averaged over 1,000 trees, 4.02 vs 12.82"
          - "An isolation tree is a binary search tree, so the expected path of a normal point is the unsuccessful-search length $c(n) = 2H(n-1) - 2(n-1)/n$"
          - "$s = 2^{-E[h]/c(n)}$: 0.5 at the average path, near 1 for anomalies; why neither $n$ nor $\\log n$ would do as the normaliser"
          - "Swamping and masking: AUC 0.67 on 4,096 points, 0.91 on a 128-point sub-sample; ψ = 256, t = 100, height limit ⌈log₂ψ⌉, the $c(\\text{Size})$ adjustment at a truncated leaf"
          - "Linear time, 511 nodes per tree; what it misses (anomaly clusters, irrelevant dimensions) and the kurtosis fix"
        demo:
          component: IsolationSplitter
          spec: >-
            A 2-D cloud with one planted outlier; a click on any point grows
            a random isolation tree around it frame by frame and reports the
            path length; a counter accumulates the mean over trees. Task:
            before clicking, predict which of three marked points isolates
            fastest, then verify; then switch to the "masked cluster" preset
            and lower the sub-sample ψ until the planted anomaly cluster's
            mean path drops below the normal points' — the swamping effect
            the reader removes by hand.
      - slug: one-class-and-reconstruction
        title: "One-class boundaries and reconstruction error: ν-SVM, SVDD and autoencoders"
        type: core
        status: planned
        goal: "Explain one-class SVM and SVDD as boundary estimators and the autoencoder reconstruction error as an anomaly score, and evaluate what each delivers on transactions with and without labels"
        opening: "If no labels exist, a model can still be fitted to the normal payments alone: a boundary that encloses them, or a network trained to reproduce them. A payment outside the boundary, or one the network reproduces badly, is suspect. How are the boundary and the reconstruction trained, how good are their scores on transactions with no labels at all, and does adding such a score to a supervised model help?"
        est_minutes: 45
        prerequisites: [isolation-forest, neural-tabular-detectors]
        concepts:
          introduces: [one-class-svm, reconstruction-error, semi-supervised-fusion]
          reinforces: [isolation-score, feed-forward-detector, average-precision]
        key_ideas:
          - "ν-SVM: separate the data from the origin in feature space, with ν bounding the outlier fraction; SVDD as the smallest enclosing sphere; what a boundary cannot find (anomalies inside a ring)"
          - "A replicator network / autoencoder 15-100-20-100-15 trained on genuine rows: the untrained error 0.93 falling to 8e-5; frauds reconstruct 27× worse than genuine"
          - "Scores with zero labels: Isolation Forest 0.808 / 0.164 / 0.19 vs autoencoder 0.836 / 0.18 / 0.217 vs supervised 0.859 / 0.646 / 0.28 — AUC decent, precision poor, and why"
          - "Semi-supervised fusion three ways; adding the reconstruction error as a feature moves 0.646 → 0.651: a null result reported honestly"
        demo: null
      - slug: ulb-unsupervised-scores
        title: "Unsupervised scores on the ULB credit-card set"
        type: core
        status: planned
        goal: "Evaluate Isolation Forest, an autoencoder and a k-means cluster rule on the ULB credit-card data against a supervised baseline, and explain why a cluster that is 71% fraud still floods the queue"
        opening: "On the public two-day credit-card set, a k-means cluster picked for its fraud share is 71% fraud on the test split, against a base rate of 0.2%. Alerting every member of that cluster still floods the queue. What do isolation, reconstruction and clustering scores actually deliver on real card data, judged by the metrics investigators use?"
        est_minutes: 35
        prerequisites: [one-class-and-reconstruction, canonical-datasets]
        concepts:
          introduces: []
          reinforces: [isolation-score, reconstruction-error, local-outlier-factor, average-precision, label-regime]
        key_ideas:
          - "The artifact: two course assignments on the 284,807-row set — k-means (k = 3 under SMOTE, 4 under ROSE) and an autoencoder/VAE scored by F1"
          - "Resampling before clustering leaks the resampler into the clusters; the elbow moves with the preprocessing"
          - "Scores compared under AP and precision at a budget; AUC flatters every unsupervised method"
          - "Departures: no time axis beyond seconds, PCA'd features with no entity, a two-day window — what the set cannot test"
        demo: null
      - slug: anomaly-scorers-lab
        title: "Lab: an Isolation Forest and an autoencoder from scratch"
        type: lab
        status: planned
        goal: "Build an Isolation Forest and a numpy autoencoder as anomaly scorers, verify each against the paper's constants and a finite-difference referee, and score the ULB credit-card set under average precision"
        opening: "Two scorers that use no labels — random isolation trees and a reconstruction network — built from the formulas, checked against the paper's constants and a finite-difference referee, and ranked on the real card set by average precision."
        est_minutes: 12
        prerequisites: [ulb-unsupervised-scores]
        concepts:
          introduces: []
          reinforces: [isolation-path-length, isolation-score, swamping-masking, reconstruction-error, average-precision]
        key_ideas:
          - "c(n) and the score as closed forms checked at n = 2, 256, 4096"
          - "A random iTree with a height limit; the path length with the c(Size) adjustment at a truncated leaf"
          - "A tied-weight autoencoder with its gradient refereed by finite differences"
          - "Both scores on the ULB set under AP, with the supervised number as the ceiling"
        demo: null
        lab:
          est_hours: 4.5
          checkpoints:
            - id: path-normaliser
              kind: exact
              text: "The normaliser c(n) from the harmonic number and the score s(x, n) from an expected path length"
            - id: itree-build
              kind: exact
              text: "A random isolation tree on a seeded sub-sample with a height limit"
            - id: path-length
              kind: exact
              text: "Path length of a point through a tree, adding c(Size) at a truncated external node"
            - id: iforest-score
              kind: exact
              text: "The forest: t trees on ψ-sub-samples, mean path length, the anomaly score for a matrix of points"
            - id: autoencoder-forward-loss
              kind: exact
              text: "Forward pass and mean-squared reconstruction loss of a tied-weight autoencoder"
            - id: autoencoder-gradient
              kind: exact
              text: "Backpropagation through the autoencoder, refereed by finite differences"
            - id: train-autoencoder
              kind: exact
              text: "Training loop on genuine transactions only; reconstruction error as the anomaly score"
            - id: why-auc-flatters
              kind: review
              text: "Written answer: why both unsupervised scores reach a respectable ROC-AUC and a poor average precision"
            - id: beat-ap-bar
              kind: metric
              text: "Beat the average-precision bar on the held-out ULB split with either scorer or any combination"
              required: false
        notes: "Canon grounding (CS6890 PS4: autoencoder and VAE on the ULB set scored by F1; HKU FITE7410 A1 Part II: k-means cluster analysis on the same set), dataset and checkpoint detail live in research/anomaly-scorers-lab.md (LAB PLAN)."

  - slug: graphs
    title: "Networks and money movement"
    outcomes: [co-detect]
    lessons:
      - slug: fraud-as-a-graph
        title: "Transactions as a graph: nodes, edges, shared identifiers and laundering motifs"
        type: core
        status: planned
        goal: "Construct a bipartite or tripartite graph from a transaction log, add edges for shared identifiers, and classify laundering typologies as motifs in it"
        opening: "Eight rows of a transfer table look ordinary one at a time; drawn as accounts and arrows, they show money leaving A, passing through C and D and returning to A. Fraud is organised, and a per-row feature cannot see the organisation. How do you turn a transaction log into a graph, what should be a node and an edge, what do shared cards, devices and addresses add, and which shapes in the graph are the laundering patterns investigators look for?"
        est_minutes: 40
        prerequisites: [financial-crime-typology]
        concepts:
          introduces: [transaction-graph, entity-resolution, laundering-motif]
          reinforces: [money-laundering-stages, card-not-present-fraud]
        key_ideas:
          - "Why rows cannot see rings: the eight-row table and the cycle A → C → D → A that one drawing exposes"
          - "Nodes = accounts, or cardholders and merchants; edges = transactions with weights that decay with age; the tripartite trick that turns a labelled edge into a node so labels can seed anything"
          - "Shared identifiers as new edges — the same card, device or address — and why a coffee-shop IP would link everyone"
          - "The eight laundering patterns (fan-in, fan-out, gather-scatter, scatter-gather, cycle, random, bipartite, stack); only 19% of a synthetic world's laundering follows one"
          - "Two ways fraud is social — opportunistic spread and organised collaboration — and why a fraudster cannot fake their position in the whole graph"
        demo: null
      - slug: neighbourhood-and-centrality
        title: "Neighbourhood and centrality features"
        type: core
        status: planned
        goal: "Test whether fraud clusters in a graph, then compute degree, triangle, density, path-count, closeness and betweenness features for a 20-node toy network and explain what each one tells a classifier"
        opening: "Before a node's neighbours are used to judge it, one fact has to be checked: do fraudulent nodes actually sit next to other fraudulent nodes in this graph, or next to honest ones? If they do cluster, what numbers about a node's neighbourhood — how many neighbours, how many of them fraudulent, how tightly knit, how central in the whole network — can be handed to an ordinary classifier?"
        est_minutes: 40
        prerequisites: [fraud-as-a-graph]
        concepts:
          introduces: [homophily-test, egonet-features, centrality-measures]
          reinforces: [transaction-graph, entity-resolution]
        key_ideas:
          - "The homophily test: 5 cross-labelled edges where 8 are expected under independence, p = 0.03; dyadicity and heterophilicity; auction fraud is heterophilous (fraudsters trade with honest people), accounting fraud homophilous"
          - "Degree by neighbour class, triangles by alter label, egonet density 2M/(N(N−1)); pairs of egonet features against a power-law fit"
          - "A^k counts k-hop paths; closeness as inverse farness; betweenness as the share of shortest paths through the node"
          - "Recursive aggregates (mean, min, max of neighbours' features) as the cheap approximation of the neighbourhood"
          - "All of it in one feature table for the 20-node toy — what a random forest on it can and cannot learn"
        demo: null
      - slug: communities-and-components
        title: "Communities and connected components: narrowing the search to rings"
        type: core
        status: planned
        goal: "Compute Louvain communities and union-find components on a payment graph, explain why modularity narrows a fraud search but cannot assign a ring, and design entity-resolution edges on which components are the rings"
        opening: "A payment network has 204,000 users and a few hundred known fraudsters. Investigators cannot look at every user, and a fraud ring is a group, not a node. How do you cut the graph into groups so that the few groups containing a known fraudster are where to look, and how do you then draw rings whose membership an auditor can check line by line?"
        est_minutes: 40
        prerequisites: [neighbourhood-and-centrality]
        concepts:
          introduces: [community-detection, connected-components, identifier-degree-cap]
          reinforces: [entity-resolution, egonet-features]
        key_ideas:
          - "Cuts: MinCut isolates one node, RatioCut and MinMaxCut fix that; modularity Q = Σ(e_ii − a_i²) = 0.41 on the toy split; Louvain's two phases"
          - "Louvain on 204k users: 11,500 communities, 200 (1.7%) with any known fraud — a 98% cut of the search; the resolution limit and the non-determinism that make it unfit for assignment"
          - "Connected components by union-find are deterministic and explainable: 'a path connects them'"
          - "The high-degree identifier problem and the cap of 10; entity-resolution rules encoded as edges, then components on those edges alone: 28,000 components, 211 flagged users carrying 13% of volume"
          - "Explore, hypothesise, encode, resolve, label, validate — a method, with the validation that needs no labels"
        demo:
          component: IdentifierDegreeCap
          spec: >-
            A small user–identifier graph (users, cards, devices, one
            coffee-shop IP) with a slider for the identifier degree cap;
            shared-identifier edges between users appear only through
            identifiers under the cap, and connected components recolour
            live. Task: find the smallest cap at which the two planted
            fraud rings stay separate from the honest users, then the cap
            at which everything collapses into one component — the
            high-degree identifier problem found by hand.
      - slug: guilt-by-association
        title: "Guilt by association: relational classifiers and random walks with restart"
        type: core
        status: planned
        goal: "Derive the fraud-personalised PageRank as a random walk with restart on the transaction graph, implement it by power iteration with time-decayed weights, and explain why plain PageRank is useless for fraud"
        opening: "A cardholder has never been flagged, but three of the shops they paid at were used by cards later confirmed stolen. How much suspicion should flow from the confirmed frauds across the graph to this cardholder, how far, and how fast should it fade with time — computed for a million nodes before the next payment arrives?"
        est_minutes: 45
        prerequisites: [communities-and-components]
        concepts:
          introduces: [relational-neighbour-classifier, random-walk-with-restart, exposure-score, collective-inference]
          reinforces: [transaction-graph, centrality-measures, homophily-test]
        key_ideas:
          - "The relational neighbour classifier P(c | n) ∝ Σ w(n, n_j)[class = c] (2/5, 3/5) and its probabilistic form (0.45); one hop only"
          - "Plain PageRank tracks degree and ranks nothing useful; restarting the walk only at known-fraud nodes turns ξ = αQξ + (1−α)z into an exposure score; power iteration, never inversion; the toy ranking D, F, E, G above I"
          - "Edge weights exp(−γh) for day, week, month; the tripartite Q; the cold-start update for a brand-new cardholder–merchant pair"
          - "Nine exposure features reach AUC 0.920 alone and lift a random forest from 0.953 to 0.986; the anticipating and forgiving effects"
          - "★ Gibbs sampling, iterative classification, relaxation labelling, loopy belief propagation — one paragraph each"
        demo:
          component: RestartWalkPropagator
          spec: >-
            The textbook's 20-node toy network with click-to-toggle fraud
            seeds and a step button that runs one power iteration of
            ξ ← αQξ + (1−α)z, node sizes tracking ξ. Task: with the given
            seeds, step until the ranking stabilises and read off which
            legitimate node outranks a fraudulent one; then find a seed
            set of two nodes that flips that order — the reader discovers
            that restart placement, not degree, decides the ranking.
      - slug: graph-neural-networks
        title: "Graph convolutional networks for node classification"
        type: core
        status: planned
        goal: "Derive the GCN layer as neighbourhood aggregation with a normalised adjacency, show that a skip connection makes it at least a logistic regression, and evaluate when it beats hand-aggregated neighbour features"
        opening: "Hand-built neighbourhood features summarise a node's neighbours with fixed statistics — counts, means, maxima — chosen in advance. Could a network learn which summary of the neighbourhood matters, the way a convolution learns which summary of nearby pixels matters, and what does one layer of such a network compute?"
        est_minutes: 40
        prerequisites: [guilt-by-association, neural-tabular-detectors]
        concepts:
          introduces: [message-passing, gcn-layer, neighbourhood-sampling]
          reinforces: [egonet-features, random-walk-with-restart, feed-forward-detector]
        key_ideas:
          - "Gather, aggregate, update; AX as sum aggregation; A^k as k-hop walks; sum, mean and max aggregation and the graph pairs each cannot tell apart"
          - "Why an adjacency matrix is not an input: not permutation-invariant, and n² of mostly zeros; adjacency lists; mini-batching by neighbourhood sampling with a masked loss"
          - "One layer $H' = \\sigma(\\hat A H W)$ with $\\hat A = \\tilde D^{-1/2}(A+I)\\tilde D^{-1/2}$; two layers see two hops; with zero graph weights a Skip-GCN is exactly logistic regression on the node's own features"
          - "Depth: best at two layers, deeper dilutes; a global node for long range; attention as a learned weighted sum"
        demo: null
      - slug: elliptic-illicit-nodes
        title: "Illicit-node classification on the Elliptic Bitcoin graph"
        type: core
        status: planned
        goal: "Evaluate the Elliptic benchmark — random forest, MLP, GCN, Skip-GCN, EvolveGCN on 49 time steps — and explain the collapse of every model at the dark-market shutdown"
        opening: "On 203,769 Bitcoin transactions, 2% labelled illicit, a random forest on the given features beats a two-layer graph network, every model's overall F1 sits above 0.93, and at the 43rd fortnight all of them fall to zero. What in the dataset, the features and the time split produces each of those three facts?"
        est_minutes: 35
        prerequisites: [graph-neural-networks, canonical-datasets]
        concepts:
          introduces: []
          reinforces: [gcn-layer, egonet-features, message-passing, label-completeness, average-precision]
        key_ideas:
          - "The artifact: a temporal 70:30 split, 94 local plus 72 one-hop aggregated features, weighted cross-entropy 0.3/0.7"
          - "Aggregated features help every model; GCN embeddings concatenated help LR and RF; Skip-GCN > GCN says the inputs were already informative"
          - "Micro-F1 0.96–0.98 beside illicit-F1 0.45–0.80: the accuracy trap in a graph setting"
          - "Step 43: a dark market closes and even a random forest retrained each step with oracle labels does not recover — change the module cannot fix"
        demo: null
      - slug: graph-propagation-lab
        title: "Lab: fraud propagation and a GCN on a transaction graph"
        type: lab
        status: planned
        goal: "Build a graph fraud scorer — sparse adjacency, connected components, a fraud-personalised random walk with restart with time-decayed weights, egonet features and a two-layer GCN in numpy — and score an Elliptic subset"
        opening: "From an edge list to an exposure score and a graph network: union-find for the rings, power iteration for the walk, a normalised adjacency for the layer, all refereed on a 20-node toy before the Bitcoin graph."

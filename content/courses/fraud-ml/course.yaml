  - slug: graphs
    title: "Networks and money movement"
    outcomes: [co-detect]
    lessons:
      - slug: fraud-as-a-graph
        title: "Transactions as a graph: entities, motifs and entity resolution"
        type: core
        status: planned
        goal: "Construct a bipartite or tripartite graph from a transaction log, resolve entities through shared identifiers, and classify laundering typologies as motifs"
        opening: "Eight rows of a transaction table hide a cycle A → C → D → A that one glance at the graph exposes, and the same graph exposes which two cardholders share a card, a device or an address."
        est_minutes: 36
        prerequisites: [financial-crime-typology]
        concepts:
          introduces: [transaction-graph, entity-resolution, laundering-motif, homophily-test]
          reinforces: [money-laundering-stages]
        key_ideas:
          - "Nodes = accounts or cardholders and merchants; edges = transactions with time-decayed weights; the tripartite trick turns labelled edges into nodes"
          - "AMLworld's eight patterns: fan-in/out, gather-scatter, scatter-gather, cycle, random, bipartite, stack; only 19% of its laundering follows one"
          - "Entity resolution as new edges: shared card, shared device; the high-degree identifier problem (coffee-shop IP) and a degree cap of 10"
          - "Homophily test: 5 cross-labelled edges where 8 expected, p = 0.03; dyadicity and heterophilicity; auction fraud is heterophilous"
        demo:
          component: IdentifierDegreeCap
          spec: >-
            A small user–identifier graph (users, cards, devices, one
            coffee-shop IP) with a slider for the identifier degree cap;
            shared-identifier edges between users appear only through
            identifiers under the cap, and connected components recolour
            live. Task: find the smallest cap at which the two planted
            fraud rings stay separate from the honest users, then the cap
            at which everything collapses into one component — the
            high-degree identifier problem found by hand.
      - slug: graph-features-and-communities
        title: "Neighbourhood, centrality and community features"
        type: core
        status: planned
        goal: "Compute degree, triangle, egonet, path-count, closeness, betweenness and community features on a toy network and explain which ones narrow a fraud search and which ones rank suspects"
        opening: "On a 20-node toy network every feature a classifier could take from the graph — degree by class, triangles, closeness, betweenness, paths of length three — is one table, and on a 204,000-user payment graph a single Louvain run leaves 1.7% of communities containing any known fraud."
        est_minutes: 38
        prerequisites: [fraud-as-a-graph]
        concepts:
          introduces: [egonet-features, centrality-measures, community-detection, connected-components]
          reinforces: [transaction-graph, entity-resolution]
        key_ideas:
          - "Degree, triangles by alter label, density 2M/(N(N−1)); A^k counts k-hop paths; closeness as inverse farness; betweenness"
          - "OddBall: egonet feature pairs with power-law fits; recursive (ReFeX) aggregates"
          - "Connected components by union-find are deterministic and auditable; Louvain's modularity Q = Σ(e_ii − a_i²) = 0.41 on the toy split; the resolution limit"
          - "Search-space reduction: 11,500 communities, 200 with fraud; WCC on entity-resolution edges alone: 211 risk users with 13% of volume"
        demo: null
      - slug: guilt-by-association
        title: "Guilt by association: relational classifiers and random walks with restart"
        type: core
        status: planned
        goal: "Derive the fraud-personalised PageRank as a random walk with restart on the transaction graph, implement it by power iteration with time-decayed weights, and explain why plain PageRank is useless for fraud"
        opening: "Plain PageRank tracks degree and ranks nothing useful for fraud; restarting the walk only at known-fraud nodes turns the same iteration into an exposure score that ranks a legitimate node above a fraudulent one for a reason the graph makes visible."
        est_minutes: 40
        prerequisites: [graph-features-and-communities]
        concepts:
          introduces: [relational-neighbour-classifier, random-walk-with-restart, exposure-score, collective-inference]
          reinforces: [transaction-graph, centrality-measures]
        key_ideas:
          - "Relational neighbour P(c|n) ∝ Σ w(n,n_j)[class = c] (2/5, 3/5); probabilistic RN 0.45; link features for a logistic regression"
          - "ξ = αQξ + (1−α)z with α = 0.85, Q column-normalised, z = 1 on fraud nodes; power iteration, not inversion; Table 5.12's ranking D, F, E, G above I"
          - "APATE: edge weights exp(−γh) for day/week/month, the tripartite Q, the cold-start local update ξ_tx = ξ_cch/(Σw+1) + ξ_mc/(Σw+1)"
          - "Nine exposure features reach AUC 0.920 alone; Gotcha's anticipating and forgiving effects; Gibbs, relaxation labelling and loopy BP in one paragraph each"
        demo:
          component: RestartWalkPropagator
          spec: >-
            The textbook's 20-node toy network with click-to-toggle fraud
            seeds and a step button that runs one power iteration of
            ξ ← αQξ + (1−α)z, node sizes tracking ξ. Task: with the given
            seeds, step until the ranking stabilises and read off which
            legitimate node outranks a fraudulent one; then find a seed
            set of two nodes that flips that order — the reader discovers
            that restart placement, not degree, decides the ranking.
      - slug: graph-neural-networks
        title: "Graph convolutional networks for node classification"
        type: core
        status: planned
        goal: "Derive the GCN layer as neighbourhood aggregation with a normalised adjacency, show that a skip connection makes it at least a logistic regression, and evaluate when it beats hand-aggregated neighbour features"
        opening: "One GCN layer is $H' = \\sigma(\\hat A H W)$ with $\\hat A = \\tilde D^{-1/2}(A+I)\\tilde D^{-1/2}$; two layers see two hops; and with zero weights on the graph term a Skip-GCN is exactly logistic regression on the node's own features."
        est_minutes: 38
        prerequisites: [guilt-by-association, neural-tabular-detectors]
        concepts:
          introduces: [message-passing, gcn-layer, neighbourhood-sampling]
          reinforces: [egonet-features, random-walk-with-restart, feed-forward-detector]
        key_ideas:
          - "Gather, aggregate, update; AX as sum aggregation; A^k as k-hop walks; sum/mean/max aggregation and the pairs each cannot distinguish"
          - "Why adjacency matrices are not permutation-invariant inputs; adjacency lists; mini-batching by neighbourhood sampling with a masked loss"
          - "Depth: best at 2 layers, deeper dilutes; a global node for long range; attention as a learned weighted sum"
          - "Elliptic: Skip-GCN 0.705 vs GCN 0.628 illicit F1, RF 0.788 on 72 hand-aggregated one-hop features; EvolveGCN 0.720"
        demo: null
      - slug: elliptic-illicit-nodes
        title: "Illicit-node classification on the Elliptic Bitcoin graph"
        type: core
        status: planned
        goal: "Evaluate the Elliptic benchmark — random forest, MLP, GCN, Skip-GCN, EvolveGCN on 49 time steps — and explain the collapse of every model at the dark-market shutdown"
        opening: "On 203,769 Bitcoin transactions with 2% labelled illicit, a random forest on the given features reaches illicit-class F1 0.788 against the GCN's 0.628, the micro-averaged F1 of every model sits above 0.93, and at time step 43 all of them fall to zero."
        est_minutes: 32
        prerequisites: [graph-neural-networks, canonical-datasets]
        concepts:
          introduces: []
          reinforces: [gcn-layer, egonet-features, message-passing, label-completeness, average-precision]
        key_ideas:
          - "The artifact: Weber et al. 2019 — temporal 70:30 split, 94 local + 72 one-hop features, weighted cross-entropy 0.3/0.7"
          - "Aggregated features help every model; GCN embeddings concatenated help LR and RF; Skip-GCN > GCN says the inputs were already informative"
          - "Micro-F1 0.96–0.98 beside illicit-F1 0.45–0.80: the accuracy trap in a graph setting"
          - "Step 43: a dark market closes and even an RF retrained each step with oracle labels does not recover — drift the module cannot fix"
        demo: null
      - slug: graph-propagation-lab
        title: "Lab: fraud propagation and a GCN on a transaction graph"
        type: lab
        status: planned
        goal: "Build a graph fraud scorer — sparse adjacency, connected components, a fraud-personalised random walk with restart with time-decayed weights, egonet features and a two-layer GCN in numpy — and score an Elliptic subset"
        opening: "From an edge list to an exposure score and a graph network: union-find for the components, power iteration for the walk, a normalised adjacency for the layer, all refereed on a 20-node toy before the Bitcoin graph."
        est_minutes: 12
        prerequisites: [elliptic-illicit-nodes]
        concepts:
          introduces: []
          reinforces: [connected-components, random-walk-with-restart, exposure-score, egonet-features, gcn-layer]
        key_ideas:
          - "A sparse column-normalised transition matrix from an edge list with exponential time decay"
          - "The restart walk converging by power iteration, checked against the textbook's 20-node table"
          - "Egonet features from A, A² and A³"
          - "A two-layer GCN with a finite-difference gradient referee, trained on a temporal split"
        demo: null
        lab:
          est_hours: 4.5
          checkpoints:
            - id: sparse-adjacency
              kind: exact
              text: "Sparse adjacency and column-normalised transition matrix from an edge list, with exponential time-decay weights"
            - id: connected-components
              kind: exact
              text: "Weakly connected components by union-find, component sizes sorted"
            - id: restart-walk
              kind: exact
              text: "Fraud-personalised PageRank by power iteration from a seed vector, checked against the 20-node toy ranking"
            - id: egonet-features
              kind: exact
              text: "Degree, triangles and 2- and 3-hop path counts per node from powers of the adjacency"
            - id: gcn-forward
              kind: exact
              text: "Normalised adjacency and the forward pass of a two-layer GCN with a skip term"
            - id: gcn-gradient
              kind: exact
              text: "Backpropagation through the GCN, refereed by finite differences"
            - id: train-on-time-split
              kind: exact
              text: "Training on the first time steps and scoring the later ones, with a weighted cross-entropy for the illicit class"
            - id: why-rf-wins
              kind: review
              text: "Written answer: why a random forest on hand-aggregated neighbour features beats the GCN here"
            - id: beat-illicit-f1
              kind: metric
              text: "Beat the illicit-class F1 bar on the held-out time steps with any combination of walk scores, egonet features and the GCN"
              required: false
        notes: "Canon grounding (CS6890 PS2: TrustRank from a bad-node file on a payment graph; CS6890 PS1: GCN embeddings; Neo4j GraphAcademy module 2: WCC on entity-resolution edges and guilt by association), dataset and checkpoint detail live in research/graph-propagation-lab.md (LAB PLAN)."

  - slug: sequences-drift
    title: "Sequences, streams and drift"
    outcomes: [co-adapt]
    lessons:
      - slug: sequence-models-for-transactions
        title: "Sequence models over an entity's transactions"
        type: core
        status: planned
        goal: "Construct fixed-length transaction sequences per cardholder and evaluate 1-D convolutions, LSTMs and attention against hand-built aggregates on card-present and e-commerce data"
        opening: "An LSTM over the previous nine transactions of a card lifts card-present AUCPR from 0.138 to 0.200 and leaves e-commerce at 0.179 against 0.180 — the sequence carries signal only where physical constraints make it consistent."
        est_minutes: 40
        prerequisites: [neural-tabular-detectors, behavioural-profiles]
        concepts:
          introduces: [landmark-sequence, sequence-detector, hidden-markov-features]
          reinforces: [feed-forward-detector, windowed-aggregation, rfm-aggregates]
        key_ideas:
          - "Landmark = customer id; seq_len 5–10 because a compromised account carries ~4 frauds; the padding-row trick and groupby-shift"
          - "Conv1d shape arithmetic (5,15) → (4,100) → (3,50); LSTM final state; attention weights near one-hot on the last transaction"
          - "Jurgovsky: F2F vs ECOM, BASE/TDELTA/AGG; with aggregates the LSTM gain vanishes; TP-set Jaccard 25% between RF and LSTM"
          - "Multi-perspective HMM likelihoods as eight features (+15%); t-STIDE window counts; the simulator shows no sequence gain"
        demo: null
      - slug: concept-drift
        title: "Concept drift: taxonomy, detection and adaptation"
        type: core
        status: planned
        goal: "Classify drift as real, virtual or prior shift, detect it with CUSUM, Page–Hinkley, DDM and ADWIN on an error stream, and design a windowing, forgetting and ensemble strategy for a transaction stream"
        opening: "Over 422 days of card transactions the model trained once ranks last for every balancer and every metric, the model retrained daily on a 90-day window ranks near the top, and the one trained on yesterday alone ranks worst of the adaptive ones because yesterday held too few frauds."
        est_minutes: 40
        prerequisites: [delayed-labels-prequential, gbm-model-selection]
        concepts:
          introduces: [concept-drift-types, drift-detector, forgetting-strategy]
          reinforces: [prequential-validation, delay-period, imbalance-ratio]
        key_ideas:
          - "p(y|x) vs p(x) vs p(y) drift; sudden, incremental, gradual, reoccurring, and the outlier that is not drift"
          - "Day-distinguishability: train a classifier to tell day A from day B; its AUC is the distance; the weekly cycle appears"
          - "CUSUM and Page–Hinkley on the error stream; DDM's warning/drift bands at 2σ and 3σ; ADWIN's two-subwindow cut"
          - "Static vs Update vs Forget (keep all past frauds, recent genuine); DWM and weighted ensembles; prequential evaluation with a sliding window"
        demo:
          component: DriftDetectorTuner
          spec: >-
            A seeded error stream with a planted mean shift at a hidden
            step and a drift-free stretch before it; the reader sets the
            Page–Hinkley δ and λ and sees the statistic, the alarm step and
            the false alarms on the stable stretch. Task: detect the shift
            within 50 steps with zero false alarms on the stable stretch;
            then switch to the "gradual" preset and find that no setting
            achieves both — the delay/false-alarm trade the lesson derives.
      - slug: drift-strategies-on-worldline
        title: "Updating strategies on 422 days of Worldline data"
        type: core
        status: planned
        goal: "Evaluate the static, update and forget strategies with three balancers over 422 daily chunks of real card data and attribute the rank ordering to drift and to the fraud count per chunk"
        opening: "Ranked over 422 daily test chunks, EasyEnsemble with forgetting and daily updates is first on average precision, ROC-AUC and precision at rank, and the static model is last for every balancer; the ordering is the drift measured."
        est_minutes: 30
        prerequisites: [concept-drift, sequence-models-for-transactions]
        concepts:
          introduces: []
          reinforces: [concept-drift-types, forgetting-strategy, drift-detector, sequence-detector, imbalance-ratio]
        key_ideas:
          - "The artifact: Dal Pozzolo et al. 2014 — 2.2M transactions, daily chunks of ~5,200, 90-day aggregates, Friedman rank sums"
          - "Random forest beats NNET and SVM; daily update beats weekly and 15-day at the same K; K = 1 is worst"
          - "Keeping all past frauds plus 30 days of genuine; SMOTE pairs with Update, EasyEnsemble with Forget; the compute cost of each"
          - "Departures: labels assumed instant, e-commerce only, one dataset; what the Elliptic collapse and the day-shift heat map add"
        demo: null

  - slug: adversary
    title: "The adversary and the feedback loop"
    outcomes: [co-adapt]
    lessons:
      - slug: adversarial-classification
        title: "Adversarial classification: evasion as a knapsack and the arms race"
        type: core
        status: planned
        goal: "Formulate evasion against a cost-sensitive classifier as a minimum-cost camouflage problem, derive the adversary-aware classifier, and explain why the repeated game oscillates instead of converging"
        opening: "Against a naive Bayes filter the cheapest set of word insertions that crosses the log-odds threshold is a knapsack, the adversary buys log-odds reduction at per-feature prices until the gap closes, and the untouched classifier then passes every one of 481 spam messages."
        est_minutes: 38
        prerequisites: [example-dependent-cost, concept-drift]
        concepts:
          introduces: [minimum-cost-camouflage, adversary-aware-classifier, arms-race]
          reinforces: [bayes-minimum-risk, cost-matrix, concept-drift-types]
        key_ideas:
          - "Game: classifier utility U_C with measurement costs, adversary utility U_A minus edit cost W; single-shot sequential play"
          - "Gap = log-odds minus threshold; MCC as a 0-1 knapsack with a pseudo-linear DP over discretised log-odds; act iff cost < ΔU_A"
          - "Adversary-aware: P_A(x'|+) sums the pre-images that would have been camouflaged to x'; FN 481 → 93 with 0 false positives"
          - "Repeated game: good words lose their log-odds and regain them, utility oscillates with period 2; Provost's probing anecdotes; the AI Act's threat list"
        demo:
          component: CamouflageKnapsack
          spec: >-
            A message with eight candidate word edits, each showing its
            log-odds reduction and its cost, a log-odds gap bar and a
            budget. The reader picks edits to close the gap under budget
            (the knapsack); on success the classifier retrains and the
            edits' log-odds reductions shrink. Task: get three rounds of
            spam through; then find that from round four no affordable
            edit set closes the gap — the adversary-aware bound the reader
            loses against.
      - slug: alert-feedback-selection-bias
        title: "Alert-feedback selection bias and learning from feedbacks plus delayed samples"
        type: core
        status: planned
        goal: "Analyze the sample selection bias created by labelling only alerted transactions, show why importance weighting cannot remove it, and derive the feedback-plus-delayed-sample learning strategy"
        opening: "Investigators label the transactions the model ranked highest, so the freshest labels are a sample selected by the previous classifier — biased in class prior, in features and in their joint — and a reweighting that fixes a covariate shift on amount > 500 does nothing here because the selection depends on the label."
        est_minutes: 38
        prerequisites: [delayed-labels-prequential, concept-drift]
        concepts:
          introduces: [sample-selection-bias, feedback-samples, delayed-samples, feedback-delayed-aggregation]
          reinforces: [alert-feedback-interaction, verification-latency, prequential-validation]
        key_ideas:
          - "Feedbacks F_t = all recent transactions of alerted cards; delayed samples D_{t−δ}; silence read as genuine"
          - "Three bias types; importance weight P(s=1)/P(s=1|x,y) and the sanity check that works for amount > 500 and fails for alerts"
          - "Active learning is not an option: investigators must see the most suspicious, not the most informative"
          - "P_A = αP_F + (1−α)P_D: AW beats pooled W (P_k 0.77 vs 0.61); F has the worst AUC and the best alert precision; NCP_k rises with k (hiring case)"
        demo: null
      - slug: arms-race-replay
        title: "The arms race and the feedback loop replayed on the simulator"
        type: core
        status: planned
        goal: "Evaluate Dalvi's oscillating repeated game and Dal Pozzolo's feedback-versus-delayed-sample comparison by reproducing both as a computational study on the handbook simulator, and state where the simulator departs from the papers"
        opening: "With the simulator's amount rule under a static detector, a fraudster who learns the threshold and spends 219 instead of 221 is invisible after one retraining and visible again after the next, and a model trained on alert feedback alone drifts away from the stream it is meant to score."
        est_minutes: 32
        prerequisites: [adversarial-classification, alert-feedback-selection-bias]
        concepts:
          introduces: []
          reinforces: [arms-race, minimum-cost-camouflage, feedback-delayed-aggregation, sample-selection-bias, transaction-simulator]
        key_ideas:
          - "The artifact: Dalvi Fig. 3 (period-2 utility oscillation) and Dal Pozzolo Table III (F, D, W, AW) re-run on the simulator's scenario 1 and 3 frauds"
          - "An adaptive scenario: fraudsters shift amounts below the learned split; the detector's retraining cadence vs the fraudster's"
          - "Feedback-only training: top-k alerts → labels → retrain; the training set's fraud share and feature distribution drift from the stream"
          - "Departures: the simulator's fraudster has one knob, the papers' had a cost model; alerts are raised by ranking, not online"
        demo: null

  - slug: governance
    title: "Decisions, explanations and governance"
    outcomes: [co-govern]
    lessons:
      - slug: score-to-action
        title: "From score to action: routing, decision tables and the inspection frontier"
        type: core
        status: planned
        goal: "Design the decision policy that turns a fraud probability into decline, step-up or review, including a probability-by-amount investigation frontier and a verified rule table"
        opening: "A 90% fraud probability on a EUR 10 transaction is worth EUR 9 of expected fraud and not an investigation; 25% on EUR 10,000 is worth EUR 2,500 and is — the action is a function of probability and amount, drawn as a frontier."
        est_minutes: 36
        prerequisites: [example-dependent-cost, alert-feedback-selection-bias]
        concepts:
          introduces: [decision-zones, decision-table, investigation-frontier, false-positive-harm]
          reinforces: [inspection-budget, bayes-minimum-risk, savings-metric]
        key_ideas:
          - "Traffic-light zones with a referral band; automatic decisions at the extremes, analysts in the middle who may overrule"
          - "Decision tables: eight card rules collapse to four columns and reveal that card-not-present is always fraud; conflicts and gaps found mechanically"
          - "Expected fraud amount = P × amount; the stepwise frontier; hit rate is not a target; routing, mitigation first, audit trail"
          - "The cost of friction: blocked cards, de-risking, per-group false-positive rates; 10,000 false alarms a day on a million accounts"
        demo: null
      - slug: alert-explanations

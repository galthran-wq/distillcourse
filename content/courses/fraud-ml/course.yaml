spine:
  - step: >-
      A fraud detector is the fourth layer of a five-layer system: rules
      run before it, investigators with a budget of about a hundred alerts a
      day run after it, and the labels those investigators produce come
      back weeks later and only for what was alerted — every later
      difficulty is a consequence of that loop.
    label: The detector inside the loop
    years: "2002–2021"
    caption: >-
      Worldline's Belgian e-commerce stream carries about 400,000
      transactions a day with roughly a thousand frauds on some 300 cards;
      investigators open about a hundred alerts; a label returns in days
      to weeks; and the public datasets the field runs on are two days of
      PCA components, a simulator, and a Bitcoin graph.
    lessons: [fraud-detection-system, financial-crime-typology, economics-of-detection, canonical-datasets]
  - step: >-
      With one positive in a thousand and a hundred alerts a day, accuracy
      and 99.9% of the ROC curve measure nothing: the honest metrics are
      precision at the budget and amount-weighted cost, the honest
      validation runs forward in time with a delay block, and under those
      the imbalance toolkit mostly stops helping.
    label: Rare positives, honest metrics
    years: "2002–2022"
    caption: >-
      On the handbook's simulator every rebalancing technique raises
      ROC-AUC and lowers average precision; a depth-50 tree wins on
      validation AUC and loses on the test week; the undersampled
      classifier's probabilities are wrong by a closed-form factor that
      the lab restores.
    lessons: [alert-budget-metrics, delayed-labels-prequential, imbalance-techniques-revisited, example-dependent-cost, ulb-handbook-benchmark, cost-aware-evaluation-lab]
  - step: >-
      A raw transaction has no fraud signal; the signal is the deviation
      from the entity's own history, which means windowed aggregates over
      the cardholder and the terminal, computed from what was known at
      scoring time — including labels that had not yet arrived.
    label: Features are context
    years: "2009–2023"
    caption: >-
      Count and amount over the last 1/7/30 days, conditional on type and
      country, lift savings 201% over raw fields and a periodic
      time-of-day flag adds 13% more; a terminal's fraud rate is shifted
      back seven days so that it uses only labels an investigator had
      produced.
    lessons: [transaction-aggregates, behavioural-profiles, point-in-time-features, paysim-feature-matrix, point-in-time-feature-lab]
  - step: >-
      On honest features under honest metrics, supervised detection is a
      model-selection problem: a scorecard the regulator can read, a
      boosted tree as the robust default, a feed-forward net for what
      trees cannot do — and the gap between model classes is smaller than
      the gap between metrics.
    label: Supervised detectors compared
    years: "2015–2022"
    caption: >-
      On Worldline data a tuned depth-6 tree matches XGBoost on card
      precision at 100 at a hundredth of the compute; the neural net wins
      ROC-AUC and ties the rest; the scorecard's points are a logistic
      regression on weights of evidence rescaled to 20 points per doubling
      of the odds.
    lessons: [scorecards-woe, gbm-model-selection, neural-tabular-detectors, worldline-model-comparison, scorecard-vs-gbm-lab]
  - step: >-
      Supervised models detect only the fraud they were shown; new fraud
      enters as a departure from normality scored by distance, isolation
      or reconstruction, which buys a decent ROC-AUC and a poor precision —
      a complement to the supervised score, not its replacement.
    label: The unlabeled frontier
    years: "2000–2022"
    caption: >-
      An autoencoder trained with zero labels reaches ROC-AUC 0.84 and
      average precision 0.18 on the simulator; a k-means cluster on the
      ULB set is 71% fraud against a 0.2% base rate and still floods the
      queue; adding the reconstruction error to a supervised model moves
      nothing.
    lessons: [anomaly-detection-framing, density-and-distance-scores, isolation-forest, one-class-and-reconstruction, ulb-unsupervised-scores, anomaly-scorers-lab]
  - step: >-
      Fraud is organised: the cardholders, merchants, devices and accounts
      around a transaction carry signal no per-row feature sees, recovered
      by propagating known fraud through the graph as a random walk with
      restart, or by learning the neighbourhood with a graph network.
    label: The graph around the transaction
    years: "2015–2023"
    caption: >-
      Nine exposure scores propagated from labelled fraudulent transactions
      reach AUC 0.92 alone and lift a random forest from 0.953 to 0.986;
      on the Elliptic Bitcoin graph a random forest on hand-aggregated
      neighbour features beats a GCN, and every model collapses when a
      dark market shuts down.
    lessons: [fraud-as-a-graph, graph-features-and-communities, guilt-by-association, graph-neural-networks, elliptic-illicit-nodes, graph-propagation-lab]
  - step: >-
      The transaction stream drifts and the fraud evolves, so a model
      trained once ranks last: the detector is re-estimated on a cadence,
      the sequence of an entity's events is itself a feature, and change
      is detected with a statistic that fires on the error stream.
    label: Drift and sequence
    years: "2014–2020"
    caption: >-
      Over 422 days of Worldline data the static model is last for every
      balancer; daily retraining beats weekly; an LSTM helps on
      card-present transactions and not on e-commerce; a classifier that
      tells Tuesday's transactions from Sunday's exposes the weekly cycle
      as drift.
    lessons: [sequence-models-for-transactions, concept-drift, drift-strategies-on-worldline]
  - step: >-
      The adversary reads the detector and edits the cheapest features
      until the score crosses the threshold, and the detector labels only
      what it chose to show the investigators — so the training data is
      biased by the model itself, and the correction is to know which
      samples it selected.
    label: The adversary and the feedback loop
    years: "2004–2018"
    caption: >-
      Against naive Bayes the spammer's cheapest edit lets every one of
      481 messages through; the adversary-aware classifier recovers all
      but 93. Importance weighting fixes a covariate shift on amount > 500
      and fails on alert feedback, because the selection depends on the
      label.
    lessons: [adversarial-classification, alert-feedback-selection-bias, arms-race-replay]
  - step: >-
      A score becomes an action under a budget — decline, step up, or
      review — must be explained to an investigator and to the customer,
      and must be monitored for stability and recalibrated; the model is a
      managed asset with a life cycle, not a file.
    label: From score to governed decision
    years: "2015–2023"
    caption: >-
      A 90% probability on EUR 10 is not worth an investigation and 25% on
      EUR 10,000 is; eight rules collapse to four decision-table columns
      and expose a conflict; a stability index above 0.25 is a red light;
      a deployed pipeline monitors 9 of its 25 features and gates on
      accuracy 0.95 that a constant model passes.
    lessons: [score-to-action, alert-explanations, model-risk-monitoring, fraudfinder-monitoring-read]
  - step: >-
      In the EU the loop is written into law: the AML rulebook fixes what
      is monitored, reported, recorded and never outsourced; PSD2 caps the
      fraud rate a risk-based exemption may run at; the AI Act decides
      whether the model is high-risk; GDPR Article 22 governs the
      automated decision; and the travel rule fixes which fields travel
      with a transfer.
    label: The regulator reads the logs
    years: "2015–2027"
    caption: >-
      Detection criteria, the onboarding decision and the suspicious
      transaction report cannot be outsourced; a card exemption at EUR 250
      is lawful while the 90-day value-weighted fraud rate stays under
      0.06%; credit scoring of natural persons is high-risk and fraud
      detection is carved out by one clause.
    lessons: [eu-aml-single-rulebook, psd2-sca-tra, eu-ai-act-fraud, gdpr-financial-crime-data, transfer-of-funds-crypto, tra-exemption-engine]
  - step: >-
      The system assembles it all: real-time scoring on point-in-time
      features served from one store, labels that mature over weeks and
      feed a retraining cadence, monitoring that closes the loop, and a
      record the regulator can audit.
    label: The system
    years: "2018–2024"
    caption: >-
      A decision within six seconds, features from a store that answers
      "what was known at t", daily retraining on feedbacks plus delayed
      samples, a 90-day fraud-rate controller and an alert ledger: the
      pipeline the course argued for, built on the simulator.
    lessons: [real-time-scoring-architecture, label-maturation, eu-transaction-monitoring-design, pipeline-capstone-lab]

outcomes:
  - id: co-frame
    text: "Explain why financial-crime detection differs from generic classification: the layered system, the investigator budget, delayed and selected labels, and an adapting adversary"
    bloom: understand
  - id: co-evaluate
    text: "Evaluate a detector under extreme imbalance with budget-aware and amount-weighted metrics and delay-aware temporal validation, and diagnose when a reported gain is a metric artifact"
    bloom: evaluate
  - id: co-features
    text: "Construct point-in-time-correct entity features from raw transaction logs and audit a feature pipeline for label and temporal leakage"
    bloom: create
  - id: co-detect
    text: "Build supervised, anomaly, graph and sequence detectors and attribute their differences to the data regime rather than the model class"
    bloom: create
  - id: co-adapt
    text: "Analyze drift, adversarial adaptation and alert-feedback selection bias in a deployed detector and design its retraining and labelling strategy"
    bloom: analyze
  - id: co-govern
    text: "Design decision policies, explanations and monitoring that satisfy the EU frame — AMLR, PSD2 and its RTS, the AI Act, GDPR Article 22, the travel rule — and locate each obligation in the pipeline"
    bloom: create

modules:
  - slug: problem
    title: "The fraud detection problem"
    outcomes: [co-frame]
    lessons:
      - slug: fraud-detection-system
        title: "The layered fraud detection system"
        type: core
        status: planned
        goal: "Explain the five-layer fraud detection system and locate the model, the investigator budget and the delayed-label feedback loop within it"
        opening: "A fraud score is produced in under a second by the fourth of five layers, is acted on by investigators who can open about a hundred alerts a day, and is corrected by labels that return days to weeks later for the alerted transactions only."
        est_minutes: 30
        prerequisites: []
        concepts:
          introduces: [fraud-detection-system, alert-feedback-interaction, verification-latency]
          reinforces: []
        key_ideas:
          - "Terminal checks and blocking rules in milliseconds, scoring rules and the data-driven model in near real time, investigators offline"
          - "The investigator budget k: alerts are a ranking, not a classification, and precise alerts are the objective"
          - "Labels come from investigation and complaints; silence is read as genuine; the delay is a design parameter"
          - "Blocking rules must be fast and precise; scoring rules catch known patterns; the model is retrained, not edited"
        demo: null
      - slug: financial-crime-typology
        title: "A typology of financial crime as learning problems"
        type: core
        status: planned
        goal: "Classify the major financial-crime types — card fraud, account takeover, laundering, mules, sanctions evasion — by the learning problem each poses"
        opening: "Fraud is uncommon, well considered, concealed, time-evolving and organised, and each of those five traits names a difficulty the detector inherits: scarce labels, camouflage, drift, and relational structure."
        est_minutes: 32
        prerequisites: [fraud-detection-system]
        concepts:
          introduces: [card-not-present-fraud, money-laundering-stages, superimposition-fraud]
          reinforces: [fraud-detection-system]
        key_ideas:
          - "Card-present vs card-not-present; CNP is over half of losses on under 15% of volume"
          - "Placement, layering, integration; structuring as adaptation to a reporting threshold; levels transaction/account/business/ring"
          - "Subscription vs superimposed fraud: the whole account vs calls mixed into a legitimate stream — account takeover is superimposition"
          - "Each type as (unit, label source, delay, structure): the table the rest of the course fills in"
        demo: null
      - slug: economics-of-detection
        title: "The economics of detection: base rates, costs and the alert budget"
        type: core
        status: planned
        goal: "Compute the precision, expected cost and inspection value of a detector from its error rates, the base rate and the alert budget"
        opening: "A detector that is 99% sensitive and 99% specific, applied to a stream with one fraud per thousand transactions, produces alerts of which about nine in a hundred are fraud."
        est_minutes: 32
        prerequisites: [fraud-detection-system]
        concepts:
          introduces: [base-rate-funnel, cost-matrix, inspection-budget]
          reinforces: [alert-feedback-interaction]
        key_ideas:
          - "The base-rate funnel: 1,000 → 1 fraud → ~11 flagged → ~1 true; precision is set by prevalence"
          - "Cost matrix with four outcomes; fixed vs amount-dependent false-negative cost; the do-nothing baseline"
          - "Hit rate is not a target: 100% hit rate means too few inspections; the optimal budget maximises total utility"
          - "Value of detection decays with delay while evidence accrues; 1% false alarms on a million accounts is 10,000 calls a day"
        demo: null
      - slug: canonical-datasets
        title: "The canonical datasets: ULB, the handbook simulator, PaySim, Elliptic, AMLworld"
        type: core
        status: planned
        goal: "Analyze what each public financial-crime dataset contains, how its labels were produced, and which of the detection loop's difficulties it hides"
        opening: "The field runs on five public datasets, and each omits a different part of the loop: two days of PCA components without time, a simulator with three scripted fraud scenarios, a mobile-money log whose fraud was added after the paper, a Bitcoin graph with no feature names, and a laundering world with complete labels that no real bank has."
        est_minutes: 34
        prerequisites: [financial-crime-typology, economics-of-detection]
        concepts:
          introduces: [transaction-simulator, label-completeness]
          reinforces: [verification-latency, money-laundering-stages]
        key_ideas:
          - "ULB 2013: 284,807 transactions, 492 frauds (0.172%), 28 PCA components, Time and Amount — released by the undersampling-calibration paper"
          - "The handbook simulator: 100×100 grid, three scenarios (amount > 220; compromised terminals for 28 days; ×5 amounts for 14 days), 0.84% fraud"
          - "PaySim: aggregate replay of a mobile-money log; the 2016 paper injects no fraud"
          - "Elliptic: 203k transactions, 2% illicit, 49 time steps with no edges between them; AMLworld: 8 patterns, transitive taint, 1 in 800–1,750"
        demo: null

  - slug: rare-positives
    title: "Rare positives: imbalance and evaluation"
    outcomes: [co-evaluate]
    lessons:
      - slug: alert-budget-metrics
        title: "Metrics under an alert budget: average precision and card precision at k"
        type: core
        status: planned
        goal: "Compute average precision and card precision at k for a ranked day of transactions and explain why the ROC curve's reachable region is a sliver"
        opening: "Investigators who check 100 transactions of 8,300 a day reach a false-positive rate of at most one percent, so 99% of the ROC curve describes operating points that will never be used."
        est_minutes: 38
        prerequisites: [economics-of-detection]
        concepts:
          introduces: [average-precision, precision-at-k, card-precision-at-k]
          reinforces: [inspection-budget, base-rate-funnel]
        key_ideas:
          - "The 10-transaction toy: MME ties a useless and a good classifier; the PR curve dips 0.5 → 0.33 → 0.5"
          - "AP as a step sum, random AP = prevalence; PR dominance iff ROC dominance; PR as the zoom at low FPR"
          - "P@k per day with the remaining-fraud ceiling (55 frauds → max 0.55 at k=100); CP@k with one alert per card"
          - "Removing detected cards from later days: mean CP@100 falls 0.286 → 0.241 — the number the rest of the course reports"
        demo:
          component: RankingBudgetExplorer
          spec: >-
            Ten transactions (two fraud) with draggable rank order; live
            ROC-AUC, average precision and P@3 as the reader reorders.
            Task: find an ordering that raises ROC-AUC while lowering AP,
            then an ordering with the same AUC and P@3 = 0 — the reader
            falsifies "AUC orders classifiers" by construction before the
            prose explains which region of the curve the budget can reach.
      - slug: delayed-labels-prequential
        title: "Temporal validation with delayed labels: prequential folds"
        type: core
        status: planned
        goal: "Design a train/delay/test validation for a transaction stream and explain why prequential folds estimate the test week where random folds and AUC-selected depth do not"
        opening: "The test week's labels did not exist when the model was trained, so a validation that mimics the test must shift its own training window back by the label delay plus the test width, and must drop the cards the bank already knew were compromised."
        est_minutes: 38
        prerequisites: [alert-budget-metrics]
        concepts:
          introduces: [delay-period, prequential-validation, known-card-removal]
          reinforces: [card-precision-at-k, verification-latency]
        key_ideas:
          - "Blocks: training, delay (labels not yet known), test; older blocks dropped for drift"
          - "Test-day construction: remove transactions of cards known compromised at day − delay; remaining frauds 74–91 → 41–60"
          - "Hold-out vs repeated hold-out vs prequential: the same-period repeated hold-out understates variance 3–8×"
          - "Overfitting set piece: train AUC climbs to depth 50, test AP peaks at 4–6; AUC still selects depth 50 on validation"
        demo: null
      - slug: imbalance-techniques-revisited
        title: "Imbalance techniques under honest metrics and the undersampling correction"
        type: core
        status: planned
        goal: "Derive the posterior bias introduced by undersampling and its inverse correction, and evaluate when cost-sensitive learning, resampling and balanced ensembles help under AP and card precision"
        opening: "Every rebalancing technique in the handbook raises ROC-AUC on the transaction data and lowers average precision, and the undersampled model's probabilities are wrong by a factor that has a closed form."
        est_minutes: 40
        prerequisites: [delayed-labels-prequential]
        concepts:
          introduces: [undersampling-calibration, imbalance-ratio, balanced-bagging]
          reinforces: [average-precision, card-precision-at-k, prequential-validation]
        key_ideas:
          - "Class-dependent selection keeps p(x|y) and shifts the prior: p_s = p/(p + β(1−p)); inverse p' = βp_s/(βp_s − p_s + 1); monotone so AUC unchanged"
          - "Bias is largest where the classes overlap; the matched threshold τ' = β τ_s/((β−1)τ_s + 1) equals the original prior"
          - "Transaction data: class weight, SMOTE, RUS, SMOTE+RUS all raise AUC and lower AP; balanced bagging gains come from diversity"
          - "XGBoost is the most robust: residual-based boosting upweights the minority implicitly; samplers go inside the prequential pipeline"
        demo: null
      - slug: example-dependent-cost
        title: "Example-dependent cost-sensitive learning and the Bayes-minimum-risk threshold"
        type: core
        status: planned
        goal: "Derive the Bayes-minimum-risk decision rule for a transaction whose false-negative cost is its amount, and compute the savings of a detector against doing nothing"
        opening: "A missed fraud costs the transaction amount and a flagged transaction costs a fixed administrative sum, so the optimal decision depends on the amount: flag iff $C_a \\le \\mathrm{Amt}\\cdot P(\\text{fraud}\\mid x)$."
        est_minutes: 36
        prerequisites: [imbalance-techniques-revisited]
        concepts:
          introduces: [example-dependent-cost, savings-metric, bayes-minimum-risk]
          reinforces: [cost-matrix, undersampling-calibration]
        key_ideas:
          - "Cost matrix C_FN = Amt, C_TP = C_FP = C_a, C_TN = 0; Cost(f) summed over examples; Hand's constant 100×C_a by contrast"
          - "Savings = (Cost_l − Cost(f))/Cost_l with Cost_l = total fraud amount; savings can be negative"
          - "Elkan's constant-cost threshold 1/(1 + C(2,1)/C(1,2)) as the special case; the BMR rule per transaction"
          - "Cost-sensitive LR and DT; resampling does not improve savings because it distorts the cost distribution"
        demo: null
      - slug: ulb-handbook-benchmark
        title: "The handbook benchmark: five models, three metrics, simulated and real data"
        type: core
        status: planned
        goal: "Evaluate the handbook's five baseline models on simulated and Worldline data and attribute every ranking reversal to the metric and the data regime"
        opening: "On the simulator an unlimited-depth tree beats a depth-2 tree on ROC-AUC (0.788 vs 0.763) and loses on average precision (0.309 vs 0.496); on 400,000 real transactions a day the precision of every model falls below 0.1 and card precision at 100 is the only number investigators can use."
        est_minutes: 32
        prerequisites: [delayed-labels-prequential, imbalance-techniques-revisited]
        concepts:
          introduces: []
          reinforces: [average-precision, card-precision-at-k, prequential-validation, known-card-removal, transaction-simulator]
        key_ideas:
          - "The artifact: Handbook Ch3–4 — LR/DT2/DT∞/RF/XGB on 67k training transactions with 598 frauds, a one-week delay and a one-week test"
          - "The depth-2 tree reads the simulator's amount > 220 rule off the data (threshold 218.67); on real data it finds terminal risk × burst"
          - "Real data: 0.25% fraud, ~3 frauds per compromised card, random CP@100 ≈ 0.0025, LR ≈ 0.15; the PR curves squashed to the floor"
          - "Departures from the idealisation: a one-week delay is a simplification; labels in the real replay are complete; the simulator's fraud is scripted"
        demo: null
      - slug: cost-aware-evaluation-lab
        title: "Lab: a budget- and cost-aware evaluation harness"
        type: lab
        status: planned
        goal: "Build an evaluation harness — prequential split with delay and known-card removal, average precision, card precision at k, savings, the Bayes-minimum-risk threshold and the undersampling correction — and use it to referee a model selection on the simulator"
        opening: "The harness you build here is the referee for every later lab: forward-in-time folds with a delay block, precision at the investigator's budget, amount-weighted savings, and probabilities corrected for the undersampling you trained on."
        est_minutes: 12
        prerequisites: [example-dependent-cost, ulb-handbook-benchmark]
        concepts:
          introduces: []
          reinforces: [prequential-validation, card-precision-at-k, savings-metric, bayes-minimum-risk, undersampling-calibration]
        key_ideas:
          - "A step-sum average precision and a per-day card precision with detected-card removal, checked against the handbook's numbers"
          - "Folds that shift the training start back by the delay plus the test width"
          - "Savings with FN cost = amount; the per-transaction BMR decision"
          - "The β correction turns an undersampled model's scores back into probabilities without touching the ranking"
        demo: null
        lab:
          est_hours: 4
          checkpoints:
            - id: average-precision
              kind: exact
              text: "Average precision as the step sum over the ranked list, no interpolation"
            - id: savings-metric
              kind: exact
              text: "Cost and savings with the false-negative cost equal to the amount and a fixed administrative cost"
            - id: prequential-split
              kind: exact
              text: "Train/delay/test index generator with known-compromised-card removal, shifted back one block per fold"
            - id: card-precision-top-k
              kind: exact
              text: "Card precision at k per day — one alert per card, detected cards removed from later days — averaged over the test week"
            - id: bmr-threshold
              kind: exact
              text: "Per-transaction Bayes-minimum-risk decision from a calibrated probability and the amount"
            - id: undersampling-correction
              kind: exact
              text: "The β correction that maps an undersampled model's posteriors back to the full-data prior, with the matched threshold"
            - id: prequential-selection
              kind: exact
              text: "Model selection over a depth grid by validation AP and by validation ROC-AUC on prequential folds — two different winners"
            - id: why-auc-picks-fifty
              kind: review
              text: "Written answer: why validation ROC-AUC selects the overfitted tree and card precision does not"
            - id: beat-card-precision
              kind: metric
              text: "Beat the card-precision-at-100 bar on the held-out simulator week with any model, scored by your own harness"
              required: false
        notes: "Canon grounding (CS6890 PS3, HKU FITE7410 A2 cost comparison, the handbook's shared_functions), dataset and checkpoint detail live in research/cost-aware-evaluation-lab.md (LAB PLAN)."

  - slug: features
    title: "Features from transactions"
    outcomes: [co-features]
    lessons:
      - slug: transaction-aggregates
        title: "Entity-centric aggregation: RFM, windowed counts and delayed terminal risk"
        type: core
        status: planned
        goal: "Construct windowed count and amount aggregates over a cardholder's and a terminal's history, including a terminal risk that uses only labels known at scoring time"
        opening: "A transaction record — amount, time, customer id, terminal id — has no fraud signal of its own; the signal is how far it sits from the entity's own recent behaviour, which is a set of windowed aggregates computed over earlier rows only."
        est_minutes: 38
        prerequisites: [delayed-labels-prequential]
        concepts:
          introduces: [rfm-aggregates, windowed-aggregation, delayed-terminal-risk]
          reinforces: [delay-period, verification-latency]
        key_ideas:
          - "RFM over the entity: recency, frequency, monetary; the probe-then-spend pattern as recent-low then recent-high"
          - "Whitrow aggregation: count and sum over the last t_p hours grouped by card, then by type/merchant group/country; Bahnsen's 7-row worked table"
          - "The handbook's 14 features; customer 0's 30-day mean converging to its generating parameters"
          - "Terminal risk over [t−(d+w), t−d] as a difference of two rolling sums: the delay is the label latency"
          - "★ Identifiers: card ID dropped because blocked cards leak; terminal embeddings add nothing over aggregates"
        demo: null
      - slug: behavioural-profiles
        title: "Behavioural profiles: periodic time, peer groups and break points"
        type: core
        status: planned
        goal: "Construct profile-deviation features — a von Mises time-of-day flag, peer-group and break-point statistics, inter-event time — and explain why each is a contextual anomaly score"
        opening: "Transactions at 02:00, 03:00, 22:00 and 23:00 have an arithmetic mean of 12:30, an hour at which the customer never transacts; a feature built on clock time must be built on the circle."
        est_minutes: 34
        prerequisites: [transaction-aggregates]
        concepts:
          introduces: [periodic-time-feature, peer-group-analysis, break-point-analysis]
          reinforces: [rfm-aggregates, windowed-aggregation]
        key_ideas:
          - "Circular mean and von Mises confidence interval; the binary 'inside the expected window' feature; at least seven days of history"
          - "Peer-group analysis is inter-account (Christmas spending not flagged); break-point analysis is intra-account (t-test old vs new window)"
          - "tdelta between consecutive events because frauds come in bursts; trading entropy; the cumulative-spend line and its slope change"
          - "Contextual anomaly: same value normal in one context, anomalous in another — the user is the context"
        demo:
          component: CircularMeanClock
          spec: >-
            A 24-hour clock on which the reader places up to six transaction
            times; the arithmetic mean and the circular (von Mises) mean are
            drawn as two hands, the fitted concentration as a shaded arc.
            Task: place four times so the arithmetic hand points at an hour
            with no transactions while the circular hand sits among them;
            then add one 06:00 transaction and read off whether it falls
            inside the 90% arc.
      - slug: point-in-time-features
        title: "Point-in-time correctness: as-of joins, feature stores and parity"
        type: core
        status: planned
        goal: "Design a feature pipeline whose training rows contain only what was known at each transaction's timestamp and whose serving path computes the same values"
        opening: "A feature joined to a training row must be the value that existed at that row's timestamp, which for a label-derived feature means the value after the label delay, and the serving path must reproduce that value or the offline score is a fiction."
        est_minutes: 36
        prerequisites: [transaction-aggregates]
        concepts:
          introduces: [point-in-time-join, feature-store, training-serving-skew]
          reinforces: [delayed-terminal-risk, delay-period]
        key_ideas:
          - "The as-of join: last value up to but not after t; the read-instances table of (entity, timestamp, label)"
          - "Batch features over days in SQL, streaming features over minutes in a sliding window; one store answers both reads"
          - "Training/serving skew: FraudFinder trains on zero-filled minute features and serves real ones; the parity check the series omits"
          - "Label time travel: train on a date whose labels have settled; the feature log keyed by feature_time"
        demo: null
      - slug: paysim-feature-matrix
        title: "From PaySim logs to a feature matrix"
        type: core
        status: planned
        goal: "Analyze the PaySim mobile-money log as an artifact — what its generator replays, what its fraud label encodes — and construct a feature matrix whose signal survives that reading"
        opening: "Of PaySim's 6.4 million rows, every one of the 8,213 frauds is a TRANSFER or a CASH_OUT, the fraud is uniform over time steps while genuine traffic has a daily rhythm, and the balance columns disagree with the amounts in ways the generator never intended as signal."
        est_minutes: 32
        prerequisites: [behavioural-profiles, point-in-time-features, canonical-datasets]
        concepts:
          introduces: []
          reinforces: [rfm-aggregates, windowed-aggregation, periodic-time-feature, transaction-simulator, label-completeness]
        key_ideas:
          - "The artifact: the Kaggle PaySim log read against the 2016 paper — aggregate replay per day/hour, five types, no fraud injected in the paper"
          - "HKU's EDA findings: fraud only in TRANSFER/CASH_OUT, step mod 24, per-account counts, no extreme amounts among frauds"
          - "Features that survive: type gate, hour-of-day, origin and destination balance deltas, per-account windowed counts; features that are artefacts"
          - "Departure from the idealisation: no delay, no feedback loop, a label that is a generator flag"
        demo: null
      - slug: point-in-time-feature-lab
        title: "Lab: a point-in-time feature pipeline"
        type: lab
        status: planned
        goal: "Build a feature pipeline that turns raw transaction logs into the handbook's windowed aggregates, Bahnsen's conditional aggregates, a delayed terminal risk and a periodic time flag, joined point-in-time onto every scoring row"
        opening: "The pipeline you build here produces, for every transaction, only numbers that existed at its timestamp — and the one leak the shipped reference pipeline hides is yours to find."
        est_minutes: 12
        prerequisites: [paysim-feature-matrix]
        concepts:
          introduces: []
          reinforces: [windowed-aggregation, delayed-terminal-risk, periodic-time-feature, point-in-time-join, training-serving-skew]
        key_ideas:
          - "Time-based rolling windows over strictly earlier rows, checked against Bahnsen's seven-row table"
          - "A terminal risk as the difference of two rolling sums shifted by the delay"
          - "A von Mises time flag checked against the paper's worked example"
          - "An as-of join that never reads the future"
        demo: null
        lab:
          est_hours: 4
          checkpoints:
            - id: calendar-flags
              kind: exact
              text: "Weekend and night flags from the transaction timestamp"
            - id: customer-windows
              kind: exact
              text: "Count and mean amount over the customer's previous 1, 7 and 30 days, strictly earlier rows only"
            - id: conditional-aggregates
              kind: exact
              text: "Count and sum over the last 24 hours restricted to the same type and the same country"
            - id: terminal-risk-delayed
              kind: exact
              text: "Terminal fraud rate over a window shifted back by the label delay, as a difference of two rolling sums"
            - id: periodic-time-flag
              kind: exact
              text: "Circular mean, von Mises concentration and the inside-the-interval flag for a customer's clock times"
            - id: point-in-time-join
              kind: exact
              text: "As-of join of a timestamped feature log onto scoring rows — last value up to, never after, each timestamp"
            - id: find-the-leak
              kind: review
              text: "Written answer: name the leak in the shipped reference pipeline and the row on which it first shows"
            - id: feature-lift
              kind: metric
              text: "Beat the average-precision bar of a fixed logistic regression on the held-out week using your feature matrix"
              required: false
        notes: "Canon grounding (FraudFinder notebook 02's batch windows and delayed terminal risk; HKU FITE7410 A1 Part I feature engineering on PaySim), dataset and checkpoint detail live in research/point-in-time-feature-lab.md (LAB PLAN)."

  - slug: supervised
    title: "Supervised detectors"
    outcomes: [co-detect]
    lessons:
      - slug: scorecards-woe
        title: "Logistic scorecards: weights of evidence, information value and points"
        type: core
        status: planned
        goal: "Construct a points-based fraud scorecard from coarse-classified variables through weights of evidence to a scaled logistic regression, and explain why its monotone one-coefficient-per-variable form is what a regulator can read"
        opening: "A scorecard is a logistic regression on weights of evidence, rescaled so that the score rises 20 points each time the odds of fraud halve; every step from raw variable to points is a table a reviewer can check."
        est_minutes: 36
        prerequisites: [example-dependent-cost]
        concepts:
          introduces: [weight-of-evidence, information-value, points-scorecard]
          reinforces: [cost-matrix]
        key_ideas:
          - "Coarse classification: equal-interval vs equal-frequency bins, odds pivot tables, chi-squared comparison (583 vs 662)"
          - "WOE = ln(Dist non-fraud / Dist fraud); IV = Σ(DistG − DistB)·WOE; the 2,000-row age example with IV 0.6502"
          - "Score = Offset + Factor·ln(odds); 20 points per doubling gives Factor 28.85, Offset −12.87 at 100 points for 50:1"
          - "Variable selection under sign constraints and operational latency; filters are univariate"
        demo: null
      - slug: gbm-model-selection
        title: "Tree ensembles and prequential model selection"
        type: core
        status: planned
        goal: "Evaluate decision trees, random forests and XGBoost under prequential selection on simulated and real card data, and explain why a tuned tree matches the boosted ensemble on card precision at a hundredth of the cost"
        opening: "Under prequential selection on real card data the best-validation XGBoost scores card precision 0.235 at 100 where 50 trees would have scored 0.249, a tuned depth-7 tree scores 0.232, and the grid for the tree took 1,617 seconds against 8,788 for the ensemble."
        est_minutes: 36
        prerequisites: [imbalance-techniques-revisited]
        concepts:
          introduces: [best-estimated-vs-optimal, random-search]
          reinforces: [prequential-validation, card-precision-at-k, average-precision, imbalance-ratio]
        key_ideas:
          - "Model selection = argmax of validation performance; the triplet default / best-estimated / optimal parameters per metric"
          - "Decision tree: AUC picks depth 50, AP picks 3, CP@100 picks 5; optimal 4/4/5 — the metric sets the model"
          - "Random search: 10 of 18 XGBoost combinations in 690 s vs 1,251 s with the same scores (Bergstra and Bengio)"
          - "XGBoost's robustness to imbalance; prequential folds give AP std 0.022 where repeated hold-out gives 0.0065"
        demo: null
      - slug: neural-tabular-detectors
        title: "Feed-forward networks on transaction features"
        type: core
        status: planned
        goal: "Construct and tune a feed-forward network on engineered transaction features and explain when a network earns its place against a tree ensemble that already wins"
        opening: "On static tabular features a tree ensemble wins, and the four reasons to train a network anyway are incremental updating, representation learning, federated averaging and diversity for stacking — none of which is accuracy."
        est_minutes: 36
        prerequisites: [gbm-model-selection]
        concepts:
          introduces: [feed-forward-detector, early-stopping-on-validation, entity-embedding]
          reinforces: [prequential-validation, average-precision, card-precision-at-k]
        key_ideas:
          - "Input scaling matters for the first layer and not for trees; log1p for heavy-tailed amount; SGD 251 epochs vs Adam 13 to a better optimum"
          - "Early stopping with patience on validation loss; dropout 0.2 helps and 0.4 hurts; batch size and epochs interact"
          - "An embedding of dimension k is a linear layer on one-hot input; terminal and weekday embeddings add nothing over aggregates on the simulator"
          - "Benchmark: NN 0.876 / 0.675 / 0.303 vs XGBoost 0.869 / 0.687 / 0.303 — a 162-network grid cost 7,350 s"
        demo: null
      - slug: worldline-model-comparison
        title: "Eight models on Worldline data: the metric-dependent ranking"
        type: core
        status: planned
        goal: "Evaluate the handbook's eight-model comparison on real card data and attribute each ranking to the metric, the validation design and the compute spent"
        opening: "On the same real test weeks the random forest has the best ROC-AUC of the tree models, the LSTM with attention the best average precision, and a depth-6 decision tree ties the field on card precision at 100 — three leaderboards from one table."
        est_minutes: 30
        prerequisites: [neural-tabular-detectors, scorecards-woe]
        concepts:
          introduces: []
          reinforces: [best-estimated-vs-optimal, card-precision-at-k, average-precision, prequential-validation, feed-forward-detector]
        key_ideas:
          - "The artifact: Handbook Ch5 real-world model selection and Ch7.5's global table — DT, LR, RF, XGB, FFNN, CNN, LSTM, LSTM+attention × three metrics"
          - "Overfitting reproduced on real data: test AP peaks at depth 4–5 while train keeps rising to 50; optimal depth higher than on the simulator"
          - "Sequential nets beat tree ensembles on AP (0.104 vs 0.095), tie on CP@100, lose on AUC; attention adds little"
          - "Departures: labels are complete in the replay, grids are 4 folds, the best LSTM came from the slowest schedule"
        demo: null
      - slug: scorecard-vs-gbm-lab
        title: "Lab: a scorecard and a boosted tree under the same referee"
        type: lab
        status: planned
        goal: "Build a weight-of-evidence scorecard from scratch, train a gradient-boosted detector on the same prequential folds, and choose between them by savings and card precision with a written case for the choice"
        opening: "Two detectors, one referee: the scorecard you build table by table and the boosted tree you tune, scored by the harness from module 2 on the same forward-in-time folds, with the decision argued in money."
        est_minutes: 12
        prerequisites: [worldline-model-comparison, cost-aware-evaluation-lab]
        concepts:
          introduces: []
          reinforces: [weight-of-evidence, information-value, points-scorecard, best-estimated-vs-optimal, savings-metric]
        key_ideas:
          - "Equal-frequency bins, WOE and IV reproduced against the textbook's age table"
          - "Points per attribute from Factor and Offset; a score that adds"
          - "The boosted tree tuned by random search on prequential folds with the module-2 harness"
          - "The choice argued as a cost comparison, not a metric comparison"
        demo: null
        lab:
          est_hours: 4
          checkpoints:
            - id: equal-frequency-bins
              kind: exact
              text: "Equal-frequency binning of a numeric variable with the bin edges and counts"
            - id: woe-iv
              kind: exact
              text: "Weight of evidence per bin and the variable's information value, checked against the textbook's 2,000-row age table"
            - id: chi2-binning-compare
              kind: exact
              text: "Chi-squared comparison of two candidate binnings of the same variable"
            - id: scorecard-points
              kind: exact
              text: "Factor and Offset for 20 points per doubling of the odds, and the points of every attribute of a fitted logistic regression on WOE features"
            - id: fit-scorecard
              kind: exact
              text: "The full scorecard: bins → WOE → logistic fit → points, scoring a held-out transaction table"
            - id: tuned-gbm
              kind: exact
              text: "Random search over a boosted-tree grid on prequential folds with the module-2 harness, returning the best-validation configuration per metric"
            - id: which-to-ship
              kind: review
              text: "Written answer: which detector to ship, argued in savings and investigation cost, naming what the other one buys"
            - id: beat-savings
              kind: metric
              text: "Beat the savings bar on the held-out week with either detector"
              required: false
        notes: "Canon grounding (HKU FITE7410 A2: two supervised algorithms and a practical cost-based comparison; Baesens' worked scorecard; CS6890 PS3), dataset and checkpoint detail live in research/scorecard-vs-gbm-lab.md (LAB PLAN)."

  - slug: anomaly
    title: "The unlabeled frontier: anomaly detection"
    outcomes: [co-detect]
    lessons:
      - slug: anomaly-detection-framing
        title: "Anomaly types, label regimes and the assumption behind each detector"
        type: core
        status: planned
        goal: "Classify anomalies as point, contextual or collective and detectors by label regime and key assumption, and predict from the assumption which detector fails on which data geometry"
        opening: "A supervised detector finds only the fraud it was shown; new fraud enters as a departure from normality, and every anomaly detector encodes one assumption about what normal looks like that doubles as a statement of when it fails."
        est_minutes: 34
        prerequisites: [behavioural-profiles]
        concepts:
          introduces: [point-contextual-collective-anomaly, label-regime, anomaly-assumption]
          reinforces: [peer-group-analysis, superimposition-fraud]
        key_ideas:
          - "Point, contextual (user or season as context) and collective anomalies with the card examples; EUR 1,000 a week in December vs July"
          - "Supervised / semi-supervised / unsupervised; the rarity assumption and where it breaks (worm traffic)"
          - "Breiman's two fuzzy balls: the unsupervised boundary around normal vs the supervised second ball"
          - "Three 2-D thought experiments: which family succeeds on a tight cluster, a ring with central anomalies, a tight anomalous cluster"
        demo: null
      - slug: density-and-distance-scores
        title: "Distance and density scores: kth-neighbour distance, LOF and Mahalanobis"
        type: core
        status: planned
        goal: "Compute kth-nearest-neighbour, local-outlier-factor and Mahalanobis anomaly scores and explain the varying-density failure that LOF repairs"
        opening: "A point near a dense cluster can have a larger kth-neighbour distance than an outlier beside a sparse one, so a global distance score ranks it wrong; the repair is to compare each point's density to its neighbours' densities."
        est_minutes: 36
        prerequisites: [anomaly-detection-framing]
        concepts:
          introduces: [knn-distance-score, local-outlier-factor, mahalanobis-score]
          reinforces: [anomaly-assumption, break-point-analysis]
        key_ideas:
          - "z-score, 1.5-IQR and 3σ coincide for Gaussian data (99.3% vs 99.7%); Grubbs' test; Mahalanobis as its multivariate form"
          - "kth-NN distance, count within radius, the O(N²) cost and its pruning"
          - "LOF = ratio of neighbours' local density to the point's; COF for line structures; what both miss (a dense anomaly cluster)"
          - "Histogram profiles miss the rare combination of common values; robust PCA score as Mahalanobis in a subspace"
        demo: null
      - slug: isolation-forest
        title: "Isolation Forest"
        type: core
        status: planned
        goal: "Derive the Isolation Forest anomaly score from expected path length under random partitioning and explain why sub-sampling improves detection"
        opening: "Anomalies are few and different, so random axis-parallel splits isolate them in fewer cuts than normal points: 4 against 12 on the paper's Gaussian, and the expected number of cuts is the score."
        est_minutes: 36
        prerequisites: [density-and-distance-scores]
        concepts:
          introduces: [isolation-path-length, isolation-score, swamping-masking]
          reinforces: [knn-distance-score, anomaly-assumption]
        key_ideas:
          - "iTree as a binary search tree; c(n) = 2H(n−1) − 2(n−1)/n from unsuccessful-search path length"
          - "s = 2^(−E[h]/c(n)): 0.5 when E[h] = c(n), near 1 for anomalies; why neither n nor log n normalises"
          - "Swamping and masking: Mulcross AUC 0.67 on 4,096 points, 0.91 on a 128-point sub-sample; ψ = 256, t = 100, height limit ⌈log₂ψ⌉"
          - "Linear time, 511 nodes per tree; kNN misses anomaly clusters larger than k; the curse of dimensionality and kurtosis selection"
        demo:
          component: IsolationSplitter
          spec: >-
            A 2-D cloud with one planted outlier; a click on any point grows
            a random isolation tree around it frame by frame and reports the
            path length; a counter accumulates the mean over trees. Task:
            before clicking, predict which of three marked points isolates
            fastest, then verify; then switch to the "masked cluster" preset
            and lower the sub-sample ψ until the planted anomaly cluster's
            mean path drops below the normal points' — the swamping effect
            the reader removes by hand.
      - slug: one-class-and-reconstruction

          - "Performance traffic lights: absolute change 5%/10%, or a bootstrap over pooled train and out-of-time samples at 95%/99%"
          - "Calibration backtests: binomial critical rate, Hosmer–Lemeshow; the independence assumption that network effects break"
          - "Life cycle: development, testing, staging in parallel, production, retirement; direct, phased and parallel changeover; the documentation test"

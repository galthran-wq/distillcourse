          - "Replicator network / autoencoder: 15-100-20-100-15, MSE as score; the untrained 0.93 falling to 8e-5"
          - "Isolation Forest 0.808 / 0.164 / 0.19 vs AE 0.836 / 0.18 / 0.217 vs supervised 0.859 / 0.646 / 0.28"
          - "Semi-supervised W1A/W1B/W2: adding the reconstruction error as a feature moves 0.646 → 0.651 — a null result reported honestly"

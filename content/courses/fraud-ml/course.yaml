  - slug: eu-regulation
    title: "The European regulatory frame"
    outcomes: [co-govern]
    lessons:
      - slug: eu-aml-single-rulebook
        title: "The EU AML single rulebook: AMLR, AMLD6 and AMLA as constraints on the model"
        type: core
        status: planned
        goal: "Identify in the AML package every obligation that binds a transaction-monitoring model — monitoring scope, suspicion criteria, non-outsourceable decisions, automated-decision safeguards, records, supervisory access — and map each to a pipeline component"
        opening: "From 10 July 2027 the detection criteria, the customer risk decision, the onboarding decision and the suspicious transaction report cannot be outsourced, every automated decision to refuse or exit a customer needs meaningful human intervention, and a supervisor may demand the documents of a decision 'developed by algorithms'."
        est_minutes: 40
        prerequisites: [score-to-action, model-risk-monitoring]
        concepts:
          introduces: [transaction-monitoring-duty, suspicious-transaction-report, non-outsourceable-decision, fiu-feedback-loop]
          reinforces: [decision-zones, performance-backtest, alert-attribution]
        key_ideas:
          - "AMLR Rec 72 and Art 26: monitoring covers all products, intensity risk-based; Art 34(2)'s four triggers read as an anomaly spec; Art 69(2)'s suspicion bases as a feature taxonomy"
          - "Art 18(3): detection criteria, risk profile, onboarding and STR filing stay in-house; a bought model is not outsourcing (Rec 47) but liability stays"
          - "Art 76(5): automated decisions and profiling allowed with human intervention, explanation and challenge; Art 77: the assessment record kept whether or not an STR was filed, five years"
          - "AMLD6: FIU triage, 5- and 10-working-day suspension windows, annual STR-quality feedback; AMLA Art 18(1)(d) algorithm access; fines of 10% of turnover"
        demo: null
      - slug: psd2-sca-tra
        title: "PSD2, strong customer authentication and the transaction-risk-analysis exemption"
        type: core
        status: planned
        goal: "Derive the constraint the PSD2 RTS places on a fraud model — the value-weighted 90-day fraud rate per exemption band, its cessation rule and the liability shift — and compute a lawful exemption policy"
        opening: "A remote card payment of EUR 240 may skip strong customer authentication only while the issuer's rolling 90-day fraud rate on such payments, measured by value and counting recovered funds, stays under 0.06%; two quarters above it suspend the exemption and the model's precision therefore sets the friction the law allows."
        est_minutes: 40
        prerequisites: [alert-budget-metrics, model-risk-monitoring]
        concepts:
          introduces: [strong-customer-authentication, transaction-risk-analysis, fraud-rate-reference, liability-shift]
          reinforces: [precision-at-k, performance-backtest, decision-zones]
        key_ideas:
          - "Art 97: SCA on access, initiation, remote action; dynamic linking to amount and payee; MOTO out of scope (Rec 95)"
          - "RTS Art 2 mandatory monitoring factors; Art 18 TRA: fraud rate ≤ reference, amount ≤ ETV, six real-time flags, a per-transaction risk score; the Annex table"
          - "Art 19: rate = fraudulent value / all remote value over 90 days, SCA'd and exempted flows both in the denominator; Art 20's two-quarter trip and one-quarter reset; yearly external audit"
          - "Art 73/74: refund by next business day, EUR 50 payer cap, no payer loss without SCA — why issuers invest in scoring"
        demo:
          component: FraudRateCeiling
          spec: >-
            A stream of seeded remote transactions with scores and amounts;
            the reader sets a score threshold below which payments are
            exempted in the EUR 100/250/500 bands and sees exempted volume
            and the rolling 90-day value-weighted fraud rate per band
            against the Annex reference rates, with a quarter-by-quarter
            trip indicator. Task: maximise exempted volume at EUR 250
            without tripping the 0.06% line for two consecutive quarters;
            then raise the band to EUR 500 and find no threshold does it —
            the precision the law demands, found by hand.
      - slug: eu-ai-act-fraud
        title: "The AI Act and fraud detection: the high-risk line and what sits on each side"
        type: core
        status: planned
        goal: "Classify a financial-crime model under the AI Act — the Annex III credit-scoring entry and its fraud carve-out, the Article 6(3) derogation and its profiling override — and map the high-risk obligations onto the pipeline"
        opening: "Annex III lists 'AI systems intended to be used to evaluate the creditworthiness of natural persons or establish their credit score, with the exception of AI systems used for the purpose of detecting financial fraud'; that clause, and the rule that any Annex III system which profiles natural persons is high-risk regardless, decide what the pipeline owes."
        est_minutes: 40
        prerequisites: [eu-aml-single-rulebook, alert-explanations]
        concepts:
          introduces: [high-risk-ai-system, annex-iii-fraud-carve-out, post-market-monitoring, right-to-explanation]
          reinforces: [performance-backtest, alert-attribution, non-outsourceable-decision]
        key_ideas:
          - "Annex III 5(a)/(b)/(c), 1(a)'s verification exclusion, Rec 42's suspicious-transaction risk analytics, Rec 59's FIU exclusion; Rec 58's 'provided for by Union law' wording"
          - "Art 6(3)'s four conditions and the profiling override; Art 6(4) documentation; Art 49(2) registration of a non-high-risk claim; Art 80 re-evaluation and fines"
          - "Arts 9–15 as pipeline artefacts: risk register, data-governance sheet with bias and feedback-loop checks (Art 10), logs, declared metrics (Art 13), human oversight and automation bias (Art 14), poisoning and evasion (Art 15(5))"
          - "Financial institutions: QMS deemed by CRD rules except risk management, post-market monitoring and incident reporting (Art 17(4)); the prudential supervisor as market surveillance; FRIA for 5(b)/(c); Art 86 explanation; Art 99 penalties"
        demo: null
      - slug: gdpr-financial-crime-data
        title: "GDPR for fraud data: lawful basis, Article 22 and minimisation against feature richness"
        type: core
        status: planned
        goal: "Classify a fraud-scoring decision by its lawful basis, its Article 22 status and its information duties, and audit a feature set against data minimisation and special-category rules"
        opening: "Processing strictly necessary for preventing fraud is a legitimate interest by Recital 47, a decision based solely on automated processing with significant effect is one the data subject has a right not to be subject to by Article 22(1), and the two sentences bound what a decline model may do on its own."
        est_minutes: 36
        prerequisites: [eu-ai-act-fraud]
        concepts:
          introduces: [legitimate-interest-fraud, solely-automated-decision, data-minimisation-audit]
          reinforces: [right-to-explanation, reason-code, non-outsourceable-decision]
        key_ideas:
          - "Art 6(1)(b)/(c)/(f) for fraud processing; the balancing test and reasonable expectations; Art 6(4) compatibility for reusing logs"
          - "Art 22(1)–(4) and Rec 71: the credit-refusal example, the fraud and tax-evasion carve-out through a law with safeguards, human intervention, explanation, challenge"
          - "Art 9 and Art 22(4): no special-category features in the automated decision; Art 35 DPIA mirrors Art 22's trigger"
          - "Art 5(1)(c) against the feature store: minimisation, purpose limitation, storage limitation; Art 13(2)(f)/15(1)(h) 'meaningful information about the logic'"
        demo: null
      - slug: transfer-of-funds-crypto
        title: "The Transfer of Funds Regulation and the crypto travel rule"
        type: extra
        status: planned
        goal: "Identify the originator and beneficiary data that must travel with a funds or crypto transfer under Regulation 2023/1113, the threshold logic, and the missing-information checks a receiving institution must run"
        opening: "For a bank transfer inside the Union the account numbers suffice until a EUR 1,000 threshold is crossed; for a crypto transfer there is no threshold, the information need not sit on the chain, and a transfer to a self-hosted address above EUR 1,000 obliges the provider to assess who controls the address."
        est_minutes: 30
        prerequisites: [eu-aml-single-rulebook]
        concepts:
          introduces: [travel-rule, self-hosted-address]
          reinforces: [transaction-monitoring-duty, suspicious-transaction-report]
        key_ideas:
          - "Art 4/14: name, account or ledger address, address or document or date and place of birth, LEI; UTI for off-ledger transfers"
          - "EUR 1,000 logic for funds with linked-transaction aggregation and cash overrides; no threshold for crypto (Rec 30's structuring argument)"
          - "Art 7/16: admissible characters, detection of missing fields, execute/reject/return/suspend, the repeat-offender escalation ladder"
          - "Art 23 sanctions screening; mixers and privacy wallets as risk factors; DLT analytics and know-your-transaction"
        demo: null
      - slug: tra-exemption-engine
        title: "A PSD2-compliant transaction-risk-analysis exemption engine"
        type: core
        status: planned
        goal: "Design and run a TRA exemption engine — a per-transaction risk score, the Annex exemption bands, the rolling 90-day value-weighted fraud rate and the cessation controller — on the simulator and state where it departs from the RTS"
        opening: "An exemption engine is a threshold on a risk score, a band table, a rolling value-weighted fraud rate per band and a controller that trips after two bad quarters; run on the simulator it shows how much friction a given precision buys and where the legal ceiling bites first."
        est_minutes: 34
        prerequisites: [psd2-sca-tra, gdpr-financial-crime-data, example-dependent-cost]
        concepts:
          introduces: []
          reinforces: [transaction-risk-analysis, fraud-rate-reference, bayes-minimum-risk, savings-metric, performance-backtest]
        key_ideas:
          - "The artifact: RTS Arts 18–21 and the Annex as code — bands, 90-day rate, two-quarter trip, one-quarter reset, quarterly report"
          - "Value weighting vs count weighting: a few large frauds move the rate; recovered funds still count; SCA'd flows dilute the denominator"
          - "The simulator study: exempted volume vs precision per band; the band at which no threshold is lawful; savings against the EUR 50 liability"
          - "Departures: the simulator's fraud is not remote-card fraud, the real rate is audited yearly, the controller's hysteresis is the law's, not a design choice"
        demo: null

  - slug: system
    title: "The system"
    outcomes: [co-govern, co-adapt]
    lessons:
      - slug: real-time-scoring-architecture
        title: "Real-time scoring: latency budgets, feature stores and the rule layers"
        type: core
        status: planned
        goal: "Design the serving path of a fraud detector — latency budget, batch and streaming features from one store, rule layers around the model, daily retraining — and verify offline/online parity"
        opening: "A card authorisation decides in under six seconds and the model's part of it in under one, so the aggregates it reads were computed before the transaction arrived, the minute-scale ones by a streaming window, and both from the same store the training set was built from."
        est_minutes: 36
        prerequisites: [point-in-time-features, score-to-action, concept-drift]
        concepts:
          introduces: [latency-budget, streaming-aggregation, parity-check]
          reinforces: [feature-store, training-serving-skew, fraud-detection-system, forgetting-strategy]
        key_ideas:
          - "The five layers again with their clocks: ms, sub-second, daily, weeks; what each may compute"
          - "Sliding windows with a period: one 60-minute window yields 15/30/60-minute aggregates by conditional sums; the new-records filter"
          - "Serving: message → store lookup → payload → score → log; the handler that returns 204 always; null-to-zero as a silent cold-start bug"
          - "Parity check: replay the day's stream through the serving path and diff it against the batch features; daily retraining at end of day"
        demo: null
      - slug: label-maturation
        title: "Label maturation: chargebacks, reports and the training set as of a date"
        type: core
        status: planned
        goal: "Design the labelling pipeline of a deployed detector — which outcomes become labels, when each settles, how alert dispositions are recorded — and assemble a training set as of a date"
        opening: "A card fraud label settles when the customer disputes within 13 months, an investigator confirms within days, or nobody says anything and the silence is read as genuine; a laundering label settles when a report is filed, and most laundering is never labelled at all."
        est_minutes: 34
        prerequisites: [alert-feedback-selection-bias, eu-aml-single-rulebook]
        concepts:
          introduces: [label-source, alert-disposition-record, training-set-as-of]
          reinforces: [feedback-samples, delayed-samples, label-completeness, verification-latency, suspicious-transaction-report]
        key_ideas:
          - "Label sources and their clocks: feedback (days), dispute (up to 13 months), STR and FIU feedback (a year), silence"
          - "The insurance funnel: small claims never labelled; real AML labels radically incomplete against AMLworld's transitive taint"
          - "The alert ledger: assessment record kept whether or not reported (AMLR Art 77); dispositions as the feedback label and as the audit trail"
          - "Assembling a training set as of date t: features from the store, labels settled by t − δ, cards blocked since removed; retraining cadence"
        demo: null
      - slug: eu-transaction-monitoring-design
        title: "Designing an end-to-end EU transaction-monitoring system"
        type: core
        status: planned
        goal: "Design a transaction-monitoring system for an EU payment institution by reading FraudFinder's reference architecture and Neo4j's graph workflow against every result and obligation of this course, naming each component's clock, data, metric and legal hook"
        opening: "The reference architecture on the page — stream, warehouse, batch and streaming features, one store, training, registry, endpoint, monitoring — is a correct skeleton with no delay block, no alert budget, no feedback classifier, no graph, no fraud-rate controller and no record a supervisor could read; this lesson adds each one and says which result or article requires it."
        est_minutes: 36
        prerequisites: [real-time-scoring-architecture, label-maturation, tra-exemption-engine, graph-features-and-communities]
        concepts:
          introduces: []
          reinforces: [fraud-detection-system, latency-budget, feature-store, feedback-delayed-aggregation, transaction-monitoring-duty, fraud-rate-reference, high-risk-ai-system]
        key_ideas:
          - "The artifacts: FraudFinder's architecture diagram and notebooks; Neo4j's explore–hypothesise–encode–resolve–label workflow"
          - "Layer by layer: rules, score, graph exposure, queue; the clocks; the stores; the retraining and feedback loop"
          - "The legal overlay: Art 18(3) in-house decisions, Art 76(5) human intervention, Art 77 records, RTS Art 19–21 reporting, AI Act Arts 9–15 artefacts, GDPR Art 22"
          - "Departures from the reference: vendor stack, synthetic data, no graph, no regulation — what a real institution adds"
        demo: null
      - slug: pipeline-capstone-lab
        title: "Lab: the pipeline on the simulator stream"
        type: lab
        status: planned
        goal: "Assemble the full detector on the handbook simulator's stream — point-in-time feature lookup, daily scoring with a top-k alert queue, feedbacks and delayed labels feeding a retraining cadence, a stability monitor, the PSD2 fraud-rate controller and an alert ledger — and report cumulative card precision over the stream"
        opening: "Every lab so far built a part; this one runs them as a system over a simulated stream: features as of each day, a model retrained on what the investigators returned, alerts capped at the budget, a monitor and a controller watching the result, and a ledger that records why each alert was raised."
        est_minutes: 12
        prerequisites: [eu-transaction-monitoring-design, cost-aware-evaluation-lab, point-in-time-feature-lab]
        concepts:
          introduces: []
          reinforces: [point-in-time-join, feedback-delayed-aggregation, card-precision-at-k, stability-index, fraud-rate-reference, alert-disposition-record]
        key_ideas:
          - "A feature log and an as-of lookup serving every day's scoring rows"
          - "The daily loop: score, alert top k, receive feedbacks now and delayed labels after δ, retrain on both"
          - "A stability index per period and a 90-day value-weighted fraud-rate controller with hysteresis"
          - "Cumulative card precision at 100 over the stream as the one number the system is judged by"
        demo: null
        lab:
          est_hours: 5
          checkpoints:
            - id: feature-asof-lookup
              kind: exact
              text: "Point-in-time lookup from a timestamped feature log for a day's scoring rows"
            - id: daily-alert-queue
              kind: exact
              text: "One day's scoring, the top-k alert queue with one alert per card, and the feedback rows it generates"
            - id: label-arrival
              kind: exact
              text: "Feedbacks available at once, delayed labels available after δ days, blocked cards removed from later days"
            - id: feedback-delayed-retrain
              kind: exact
              text: "Daily retraining on feedbacks and delayed samples as two models averaged, versus one pooled model"
            - id: stability-monitor
              kind: exact
              text: "A population stability index of the score distribution per period against the training baseline, with traffic-light thresholds"
            - id: fraud-rate-controller
              kind: exact
              text: "The rolling 90-day value-weighted fraud rate per exemption band with the two-quarter trip and one-quarter reset"
            - id: alert-ledger
              kind: exact
              text: "A per-alert record: score, top attributions, action, disposition, timestamps — kept whether or not the alert was escalated"
            - id: parity-report
              kind: review
              text: "Written answer: the feature on which the replayed serving path and the batch features disagree, and why"
            - id: cumulative-card-precision
              kind: metric
              text: "Beat the cumulative card-precision-at-100 bar over the held-out stream with your assembled system"
              required: false
        notes: "Canon grounding (FraudFinder notebooks 02, 04 and 07: batch features → point-in-time training table → online scoring from the store; Dal Pozzolo 2018 Algorithm 1), dataset and checkpoint detail live in research/pipeline-capstone-lab.md (LAB PLAN)."

        goal: "Compute population and performance stability tests for a deployed detector and design its monitoring, champion–challenger and retirement life cycle"
        opening: "A system stability index of 0.0605 is green and one of 0.304 on a single variable is red: the detector that scored well last quarter is backtested every period against ex-post outcomes because the fraudsters have changed since."

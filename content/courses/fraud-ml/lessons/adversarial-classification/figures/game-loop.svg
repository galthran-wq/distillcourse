<svg viewBox="0 0 640 290" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="currentColor" opacity="0.7"/></marker>
<marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e2903a"/></marker>
<marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4c8dd6"/></marker>
</defs>
<rect x="20.0" y="70.0" width="176.0" height="96.0" rx="4" stroke="currentColor" stroke-width="1.4" fill="none"/>
<text x="108.0" y="94.0" text-anchor="middle" font-size="13" fill="currentColor" font-weight="600">1. Classifier</text>
<text x="108.0" y="124.0" text-anchor="middle" font-size="11.5" fill="currentColor">fits on mail collected</text>
<text x="108.0" y="141.0" text-anchor="middle" font-size="11.5" fill="currentColor">before any attack</text>
<rect x="232.0" y="70.0" width="176.0" height="96.0" rx="4" stroke="#e2903a" stroke-width="1.4" fill="none"/>
<text x="320.0" y="94.0" text-anchor="middle" font-size="13" fill="currentColor" font-weight="600">2. Adversary</text>
<text x="320.0" y="116.0" text-anchor="middle" font-size="11.5" fill="currentColor">edits each caught spam</text>
<text x="320.0" y="133.0" text-anchor="middle" font-size="11.5" fill="currentColor">in the cheapest way that</text>
<text x="320.0" y="150.0" text-anchor="middle" font-size="11.5" fill="currentColor">is still worth it</text>
<rect x="444.0" y="70.0" width="176.0" height="96.0" rx="4" stroke="#e2903a" stroke-width="1.4" fill="none"/>
<text x="532.0" y="94.0" text-anchor="middle" font-size="13" fill="currentColor" font-weight="600">3. Classifier</text>
<text x="532.0" y="124.0" text-anchor="middle" font-size="11.5" fill="currentColor">answers again,</text>
<text x="532.0" y="141.0" text-anchor="middle" font-size="11.5" fill="currentColor">knowing that edit</text>
<line x1="198.0" y1="118.0" x2="228.0" y2="118.0" stroke="#e2903a" stroke-width="2" marker-end="url(#ara)"/>
<line x1="410.0" y1="118.0" x2="440.0" y2="118.0" stroke="#e2903a" stroke-width="2" marker-end="url(#ara)"/>
<path d="M20,52 L20,44 L620,44 L620,52" fill="none" stroke="#e2903a" stroke-width="1.2"/>
<text x="320.0" y="34.0" text-anchor="middle" font-size="12" fill="#e2903a">single shot: one move each, both sides knowing every parameter of the other</text>
<path d="M532,170 C532,250 320,250 320,176" fill="none" stroke="#4c8dd6" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arb)"/>
<text x="426.0" y="262.0" text-anchor="middle" font-size="11.5" fill="#4c8dd6">repeated game: the adversary relearns what the classifier</text>
<text x="426.0" y="278.0" text-anchor="middle" font-size="11.5" fill="#4c8dd6">now outputs, and replies again</text>
</svg>

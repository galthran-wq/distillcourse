<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="currentColor" opacity="0.7"/></marker>
<marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e2903a"/></marker>
<marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4c8dd6"/></marker>
</defs>
<text x="20.0" y="24.0" text-anchor="start" font-size="12" fill="currentColor" font-weight="600">one word's log-odds under the naive Bayes the spammer fits each round</text>
<line x1="70.0" y1="112.0" x2="630.0" y2="112.0" stroke="currentColor" stroke-width="1" opacity="0.5"/>
<text x="64.0" y="68.0" text-anchor="end" font-size="10.5" fill="currentColor" opacity="0.55">spammy</text>
<text x="64.0" y="162.0" text-anchor="end" font-size="10.5" fill="currentColor" opacity="0.55">good</text>
<text x="64.0" y="116.0" text-anchor="end" font-size="10.5" fill="currentColor" opacity="0.55">0</text>
<text x="150.0" y="196.0" text-anchor="middle" font-size="12" fill="currentColor" font-weight="600">round 1</text>
<rect x="132.0" y="112.0" width="36.0" height="48.0" rx="2" stroke="#e2903a" stroke-width="1" fill="#e2903a" fill-opacity="0.55"/>
<text x="150.0" y="214.0" text-anchor="middle" font-size="10.5" fill="currentColor">good under the last</text>
<text x="150.0" y="228.0" text-anchor="middle" font-size="10.5" fill="currentColor">model: the spammer</text>
<text x="150.0" y="242.0" text-anchor="middle" font-size="10.5" fill="#e2903a" font-weight="600">inserts it</text>
<text x="290.0" y="196.0" text-anchor="middle" font-size="12" fill="currentColor" font-weight="600">round 2</text>
<rect x="272.0" y="64.0" width="36.0" height="48.0" rx="2" stroke="#4c8dd6" stroke-width="1" fill="#4c8dd6" fill-opacity="0.55"/>
<text x="290.0" y="214.0" text-anchor="middle" font-size="10.5" fill="currentColor">refitted on round 1,</text>
<text x="290.0" y="228.0" text-anchor="middle" font-size="10.5" fill="currentColor">where it filled spam:</text>
<text x="290.0" y="242.0" text-anchor="middle" font-size="10.5" fill="#4c8dd6" font-weight="600">dropped</text>
<text x="430.0" y="196.0" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.35">round 3</text>
<text x="570.0" y="196.0" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.35">round 4</text>
<text x="20.0" y="274.0" text-anchor="start" font-size="11.5" fill="currentColor" opacity="0.7">the classifier's utility per round (schematic: two levels, not to scale)</text>
<line x1="70.0" y1="298.0" x2="630.0" y2="298.0" stroke="currentColor" stroke-width="1" stroke-dasharray="2 4" opacity="0.3"/>
<line x1="70.0" y1="322.0" x2="630.0" y2="322.0" stroke="currentColor" stroke-width="1" stroke-dasharray="2 4" opacity="0.3"/>
<path d="M150.0,322.0 L290.0,298.0" fill="none" stroke="#e2903a" stroke-width="1.6"/>
<circle cx="150.0" cy="322.0" r="4" fill="#e2903a"/>
<circle cx="290.0" cy="298.0" r="4" fill="#e2903a"/>
</svg>

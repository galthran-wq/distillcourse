<svg viewBox="0 0 720 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .bold { fill: currentColor; font-weight: 600; }
    .muted { fill: currentColor; opacity: 0.55; }
    .axis { stroke: currentColor; stroke-width: 1; fill: none; }
    .guide { stroke: currentColor; stroke-dasharray: 3 3; opacity: 0.5; fill: none; }
    .box { fill: none; stroke: currentColor; stroke-width: 1; }
  </style>
<rect x="6" y="10" width="228" height="300" rx="6" fill="none" stroke="currentColor" stroke-width="1"/>
<rect x="6" y="10" width="228" height="48" rx="6" fill="#e2903a" fill-opacity="0.25"/>
<text class="bold" x="18.0" y="31.0" text-anchor="start" font-size="14">investigator</text>
<text class="muted" x="18.0" y="49.0" text-anchor="start" font-size="11">what to check, against this card</text>
<text class="label" x="16.0" y="82.0" text-anchor="start" font-size="11.5">€102.55 at 17:34, 8 Aug</text>
<text class="label" x="16.0" y="102.0" text-anchor="start" font-size="11.5">this card, last 30 days:</text>
<text class="label" x="16.0" y="122.0" text-anchor="start" font-size="11.5">59 payments, mean €19.24,</text>
<text class="label" x="16.0" y="142.0" text-anchor="start" font-size="11.5">two above €40: €70.90 (2 Aug)</text>
<text class="label" x="16.0" y="162.0" text-anchor="start" font-size="11.5">and €88.15 (3 Aug)</text>
<text class="label" x="16.0" y="182.0" text-anchor="start" font-size="11.5"></text>
<text class="label" x="16.0" y="202.0" text-anchor="start" font-size="11.5">against this card’s own past:</text>
<text class="label" x="16.0" y="222.0" text-anchor="start" font-size="11.5">amount +9.39 of the log-odds</text>
<text class="label" x="16.0" y="242.0" text-anchor="start" font-size="11.5"></text>
<text class="label" x="16.0" y="262.0" text-anchor="start" font-size="11.5">call the holder: ask about</text>
<text class="label" x="16.0" y="282.0" text-anchor="start" font-size="11.5">8 Aug, 3 Aug and 2 Aug</text>
<rect x="246" y="10" width="228" height="300" rx="6" fill="none" stroke="currentColor" stroke-width="1"/>
<rect x="246" y="10" width="228" height="48" rx="6" fill="#4c8dd6" fill-opacity="0.25"/>
<text class="bold" x="258.0" y="31.0" text-anchor="start" font-size="14">cardholder</text>
<text class="muted" x="258.0" y="49.0" text-anchor="start" font-size="11">why, in words they can contest</text>
<text class="label" x="256.0" y="82.0" text-anchor="start" font-size="11.5">Your card payment of</text>
<text class="label" x="256.0" y="102.0" text-anchor="start" font-size="11.5">€102.55 was stopped.</text>
<text class="label" x="256.0" y="122.0" text-anchor="start" font-size="11.5"></text>
<text class="label" x="256.0" y="142.0" text-anchor="start" font-size="11.5">Main reasons:</text>
<text class="label" x="256.0" y="162.0" text-anchor="start" font-size="11.5">· the amount is far above</text>
<text class="label" x="256.0" y="182.0" text-anchor="start" font-size="11.5">&#160;&#160;what this card usually spends</text>
<text class="label" x="256.0" y="202.0" text-anchor="start" font-size="11.5">· it follows a recent rise</text>
<text class="label" x="256.0" y="222.0" text-anchor="start" font-size="11.5">&#160;&#160;in this card’s spending</text>
<text class="label" x="256.0" y="242.0" text-anchor="start" font-size="11.5"></text>
<text class="label" x="256.0" y="262.0" text-anchor="start" font-size="11.5">How to confirm it was you,</text>
<text class="label" x="256.0" y="282.0" text-anchor="start" font-size="11.5">and how to have it corrected</text>
<rect x="486" y="10" width="228" height="300" rx="6" fill="none" stroke="currentColor" stroke-width="1"/>
<rect x="486" y="10" width="228" height="48" rx="6" fill="#5aa46a" fill-opacity="0.25"/>
<text class="bold" x="498.0" y="31.0" text-anchor="start" font-size="14">supervisor</text>
<text class="muted" x="498.0" y="49.0" text-anchor="start" font-size="11">what ran, and can it be re-run</text>
<text class="label" x="496.0" y="82.0" text-anchor="start" font-size="11.5">payment 1245017, 8 Aug 17:34</text>
<text class="label" x="496.0" y="102.0" text-anchor="start" font-size="11.5">model: booster, trained 25–31 Jul</text>
<text class="label" x="496.0" y="122.0" text-anchor="start" font-size="11.5">inputs: the 15 values served</text>
<text class="label" x="496.0" y="142.0" text-anchor="start" font-size="11.5">score 2.57 log-odds, p 0.929</text>
<text class="label" x="496.0" y="162.0" text-anchor="start" font-size="11.5">base −7.83 (training sample)</text>
<text class="label" x="496.0" y="182.0" text-anchor="start" font-size="11.5">avg30 +6.13 · amount +4.32</text>
<text class="label" x="496.0" y="202.0" text-anchor="start" font-size="11.5">other 13: −0.05; sum checks</text>
<text class="label" x="496.0" y="222.0" text-anchor="start" font-size="11.5">zone and action taken</text>
<text class="label" x="496.0" y="242.0" text-anchor="start" font-size="11.5">overrides: who, when, grounds</text>
<text class="label" x="496.0" y="262.0" text-anchor="start" font-size="11.5">disposition, when it arrives</text>
<text class="label" x="496.0" y="282.0" text-anchor="start" font-size="11.5"></text>
</svg>

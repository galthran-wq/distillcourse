    inputs_code: |
      X = rng.normal(size=(64, 2))
      X[:3] += rng.uniform(4.0, 6.0, size=(3, 2))
      inputs = (X, 6, np.random.default_rng(int(rng.integers(1_000_000))))
    wrong:
      - hint: "Drew the split from the whole sample's range of the attribute. The split is uniform between the minimum and maximum among the rows at this node; a cut outside them separates nothing."
        code: |
          import numpy as np
          def table(t, e=0):
              if "size" in t:
                  return np.array([[e, -1, 0.0, t["size"]]])
              return np.vstack([[e, t["attr"], t["split"], 0], table(t["left"], e + 1), table(t["right"], e + 1)])
          def f(X, l, rng):
              lo, hi = X.min(axis=0), X.max(axis=0)
              def grow(X, e):
                  if e >= l or len(X) <= 1 or np.all(X == X[0]):
                      return {"size": len(X)}
                  q = int(rng.integers(X.shape[1]))
                  p = float(rng.uniform(lo[q], hi[q]))
                  m = X[:, q] < p
                  return {"attr": q, "split": p, "left": grow(X[m], e + 1), "right": grow(X[~m], e + 1)}
              return table(grow(X, 0))

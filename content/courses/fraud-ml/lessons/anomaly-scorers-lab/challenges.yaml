  why-auc-flatters:
    kind: review
    rubric: |
      The question: on the last 8 hours of day 1 of the ULB card file, an
      isolation forest, a tied-weight autoencoder and the plain distance from
      the training mean (all fitted on the first 16 hours) reach a ROC-AUC
      level with a logistic regression trained on labels (0.93 to 0.94), and an
      average precision between a seventh and a quarter of the regression's
      (0.09 to 0.17 against 0.63). The learner must explain how both hold.

      Pass if the answer contains both:
      (a) what the metrics weight: ROC-AUC is the probability that a random
          fraud outscores a random genuine payment, an average over the whole
          ranking dominated by the mass of ordinary genuine payments (or: it
          weights every false-positive rate equally, including rates far
          beyond the alert budget); average precision is set by precision at
          the top of the ranking, among the few hundred highest scores, where
          a small number of genuine payments ranked above the frauds drives it
          down while barely moving the false-positive rate / AUC;
      (b) why label-free scores fail exactly there: the top of their ranking
          is filled with genuine payments that are unusual / extreme in some
          direction, because the score adds up departures from normal along
          all inputs (or: has no way to know which directions of departure
          mark fraud), so "outside normal" is not "toward fraud"; the
          regression learns from labels which directions matter. Stating that
          most frauds lie far above the typical genuine payment (which wins
          the AUC) while the most extreme genuine payments outrank many frauds
          (which costs AP) satisfies (b) when tied to the absence of labels.

      Fail if the answer only says the unsupervised scores are weaker, noisier
      or untrained; or blames class imbalance as such for inflating AUC
      (AUC does not depend on class sizes); or attributes the gap to
      overfitting, the time split, or too few trees / epochs.


  path-normaliser:
    kind: exact
    seed: 5101
    atol: 1.0e-9
    inputs_code: |
      ns = [0, 1, 2, 3, 16, 135, 256, 4096]
      h = np.round(rng.uniform(0.5, 16.0, 40), 3)
      inputs = (ns, h, 256)
    wrong:
      - hint: "Used H(n) where the formula has H(n - 1): c(n) = 2 H(n-1) - 2(n-1)/n, which equals 2(H(n) - 1); c(2) must come out exactly 1."
        code: |
          import numpy as np
          def f(ns, h, n):
              def c(m):
                  return 0.0 if m <= 1 else 2.0 * np.sum(1.0 / np.arange(1, m + 1)) - 2.0 * (m - 1) / m
              return np.array([c(m) for m in ns]), 2.0 ** (-np.asarray(h, float) / c(n))
      - hint: "Approximated the harmonic number by ln i + 0.5772. The approximation is good from about ten points up; in c(n) = 2 H(n-1) - 2(n-1)/n it gives c(2) = 0.15 where one cut is certain. Sum 1/2 + ... + 1/n exactly."
        code: |
          import numpy as np
          def f(ns, h, n):
              def c(m):
                  return 0.0 if m <= 1 else 2.0 * (np.log(m - 1) + 0.5772156649) - 2.0 * (m - 1) / m
              return np.array([c(m) for m in ns]), 2.0 ** (-np.asarray(h, float) / c(n))
      - hint: "Took the natural logarithm for the harmonic number and dropped Euler's constant: H(i) is about ln i + 0.5772, and only for large i; sum it exactly."
        code: |
          import numpy as np
          def f(ns, h, n):
              def c(m):
                  return 0.0 if m <= 1 else 2.0 * np.log(m - 1) - 2.0 * (m - 1) / m
              return np.array([c(m) for m in ns]), 2.0 ** (-np.asarray(h, float) / c(n))
      - hint: "Raised e, not 2, to the power: s = 2^(-E[h]/c(n)), so that a typical path scores exactly 0.5."
        code: |
          import numpy as np
          def f(ns, h, n):
              def c(m):
                  return 0.0 if m <= 1 else 2.0 * np.sum(1.0 / np.arange(2, m + 1))
              return np.array([c(m) for m in ns]), np.exp(-np.asarray(h, float) / c(n))


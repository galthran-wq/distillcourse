  path-length:
    kind: exact
    seed: 5303
    atol: 1.0e-9
    inputs_code: |
      # A hand-made tree over 3 columns: external nodes at depths 1 to 4,
      # holding 1 to 6 rows, so several of them are truncated.
      def node(depth):
          if depth == 4 or (depth >= 1 and rng.random() < 0.3):
              return {"size": int(rng.integers(1, 7))}
          return {"attr": int(rng.integers(3)), "split": float(rng.normal(0.0, 0.7)),
                  "left": node(depth + 1), "right": node(depth + 1)}
      tree = node(0)
      X = rng.normal(size=(50, 3))
      inputs = (X, tree)
    wrong:
      - hint: "Stopped the count at the external node. A node still holding Size rows is charged the cuts its subtree would have taken: h = e + c(Size), with c(1) = 0."
        code: |
          import numpy as np
          def f(X, tree, e=0):
              if "size" in tree:
                  return np.full(len(X), float(e))
              m = X[:, tree["attr"]] < tree["split"]
              out = np.empty(len(X))
              out[m] = f(X[m], tree["left"], e + 1); out[~m] = f(X[~m], tree["right"], e + 1)
              return out
      - hint: "Counted nodes, not edges: the root is at depth 0, and a point that is cut off by the first split has travelled one edge."
        code: |
          import numpy as np
          def c(m):
              return 0.0 if m <= 1 else 2.0 * np.sum(1.0 / np.arange(2, m + 1))
          def f(X, tree, e=1):
              if "size" in tree:
                  return np.full(len(X), e + c(tree["size"]))
              m = X[:, tree["attr"]] < tree["split"]
              out = np.empty(len(X))
              out[m] = f(X[m], tree["left"], e + 1); out[~m] = f(X[~m], tree["right"], e + 1)
              return out
      - hint: "Sent the points the wrong way: rows with x[attr] < split go left, as they did when the tree was built."
        code: |
          import numpy as np
          def c(m):
              return 0.0 if m <= 1 else 2.0 * np.sum(1.0 / np.arange(2, m + 1))
          def f(X, tree, e=0):
              if "size" in tree:
                  return np.full(len(X), e + c(tree["size"]))
              m = X[:, tree["attr"]] >= tree["split"]
              out = np.empty(len(X))
              out[m] = f(X[m], tree["left"], e + 1); out[~m] = f(X[~m], tree["right"], e + 1)
              return out

  iforest-score:
    kind: exact
    seed: 5404
    atol: 1.0e-6
    inputs_code: |
      X = rng.normal(size=(2000, 8))
      X[:20] = rng.normal(4.0, 0.5, size=(20, 8)) * rng.choice([-1.0, 1.0], size=(20, 8))
      X_score = np.vstack([X[:20], X[-40:]])
      inputs = (X, X_score, 50, 128, np.random.default_rng(int(rng.integers(1_000_000))))
    wrong:
      - hint: "Drew the sub-samples with replacement. Each tree's sample is drawn without replacement, rng.choice(N, psi, replace=False): a duplicated row can never be cut from its copy and sits in a node that looks like a crowd."
        code: |
          import numpy as np
          def c(m):
              return 0.0 if m <= 1 else 2.0 * np.sum(1.0 / np.arange(2, m + 1))
          def grow(X, e, l, rng):
              if e >= l or len(X) <= 1 or np.all(X == X[0]):
                  return {"size": len(X)}
              q = int(rng.integers(X.shape[1])); p = float(rng.uniform(X[:, q].min(), X[:, q].max()))
              m = X[:, q] < p
              return {"attr": q, "split": p, "left": grow(X[m], e + 1, l, rng), "right": grow(X[~m], e + 1, l, rng)}
          def path(X, t, e=0):
              if "size" in t:
                  return np.full(len(X), e + c(t["size"]))
              m = X[:, t["attr"]] < t["split"]; out = np.empty(len(X))
              out[m] = path(X[m], t["left"], e + 1); out[~m] = path(X[~m], t["right"], e + 1)
              return out
          def f(X_fit, X_score, t, psi, rng):
              psi = min(psi, len(X_fit)); l = int(np.ceil(np.log2(psi))); h = np.zeros(len(X_score))
              for _ in range(t):
                  idx = rng.choice(len(X_fit), psi, replace=True)
                  h += path(X_score, grow(X_fit[idx], 0, l, rng))
              return 2.0 ** (-(h / t) / c(psi))

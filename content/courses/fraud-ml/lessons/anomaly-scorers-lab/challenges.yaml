  autoencoder-forward-loss:
    kind: exact
    seed: 5505
    atol: 1.0e-9
    inputs_code: |
      X = rng.normal(size=(6, 5))
      W = rng.normal(0.0, 0.6, size=(5, 3))
      b1 = rng.normal(0.0, 0.2, size=3)
      b2 = rng.normal(0.0, 0.2, size=5)
      inputs = (X, W, b1, b2)
    wrong:
      - hint: "Summed the squared differences over the columns. Each row's error is their mean over the d columns, so that errors of payments described by different numbers of columns stay comparable."
        code: |
          import numpy as np
          def f(X, W, b1, b2):
              Z = np.tanh(X @ W + b1); Xh = Z @ W.T + b2
              return Z, Xh, np.sum((Xh - X) ** 2, axis=1)
      - hint: "Put a tanh on the output. The decoder is linear, Z W^T + b2: the inputs are standardised columns that take any real value, and a tanh output cannot leave (-1, 1)."
        code: |
          import numpy as np
          def f(X, W, b1, b2):
              Z = np.tanh(X @ W + b1); Xh = np.tanh(Z @ W.T + b2)
              return Z, Xh, np.mean((Xh - X) ** 2, axis=1)
      - hint: "Left the code bias out of the tanh. The code is tanh(X W + b1): the bias shifts the pre-activation, not the code."
        code: |
          import numpy as np
          def f(X, W, b1, b2):
              Z = np.tanh(X @ W) + b1; Xh = Z @ W.T + b2
              return Z, Xh, np.mean((Xh - X) ** 2, axis=1)

  autoencoder-gradient:
    kind: exact
    seed: 5606
    atol: 1.0e-9
    inputs_code: |
      X = rng.normal(size=(8, 5))
      W = rng.normal(0.0, 0.6, size=(5, 3))
      b1 = rng.normal(0.0, 0.2, size=3)
      b2 = rng.normal(0.0, 0.2, size=5)
      inputs = (X, W, b1, b2)
    wrong:
      - hint: "Kept only the encoder's use of W. The decoder uses W too, as W^T, and the gradient of a tied weight is the sum of both contributions."
        code: |
          import numpy as np
          def f(X, W, b1, b2):
              Z = np.tanh(X @ W + b1); G = 2 * (Z @ W.T + b2 - X) / X.size
              dA = (G @ W) * (1 - Z ** 2)
              return X.T @ dA, dA.sum(0), G.sum(0)
      - hint: "Kept only the decoder's use of W. The encoder uses W too, inside the tanh, and the gradient of a tied weight is the sum of both contributions."
        code: |
          import numpy as np
          def f(X, W, b1, b2):
              Z = np.tanh(X @ W + b1); G = 2 * (Z @ W.T + b2 - X) / X.size
              dA = (G @ W) * (1 - Z ** 2)
              return G.T @ Z, dA.sum(0), G.sum(0)
      - hint: "Took the tanh derivative at the wrong place: tanh'(a) = 1 - tanh(a)^2, so the factor is 1 - Z^2 of the code, not 1 - A^2 of the pre-activation."
        code: |
          import numpy as np
          def f(X, W, b1, b2):
              A = X @ W + b1; Z = np.tanh(A); G = 2 * (Z @ W.T + b2 - X) / X.size
              dA = (G @ W) * (1 - A ** 2)
              return X.T @ dA + G.T @ Z, dA.sum(0), G.sum(0)
      - hint: "Divided by the number of rows only. L is the mean of n*d squared differences, so each carries a factor 1/(n d)."
        code: |
          import numpy as np
          def f(X, W, b1, b2):
              Z = np.tanh(X @ W + b1); G = 2 * (Z @ W.T + b2 - X) / len(X)
              dA = (G @ W) * (1 - Z ** 2)
              return X.T @ dA + G.T @ Z, dA.sum(0), G.sum(0)
      - hint: "Averaged over the rows twice: the 1/(n d) of the loss enters once, at the residual, and the sums over rows that follow are sums, not means."
        code: |
          import numpy as np
          def f(X, W, b1, b2):
              Z = np.tanh(X @ W + b1); G = 2 * (Z @ W.T + b2 - X) / X.size
              dA = (G @ W) * (1 - Z ** 2)
              n = len(X)
              return (X.T @ dA + G.T @ Z) / n, dA.mean(0), G.mean(0)
      - hint: "Lost the factor 2 of the square: the derivative of (x_hat - x)^2 is 2 (x_hat - x)."
        code: |
          import numpy as np
          def f(X, W, b1, b2):
              Z = np.tanh(X @ W + b1); G = (Z @ W.T + b2 - X) / X.size
              dA = (G @ W) * (1 - Z ** 2)
              return X.T @ dA + G.T @ Z, dA.sum(0), G.sum(0)

  train-autoencoder:
    kind: exact
    seed: 5707
    atol: 1.0e-6
    inputs_code: |
      # Genuine rows near a curve in 6 columns with unrelated units; a few
      # frauds off the curve, in training and among the rows scored.
      def curve(m):
          t = rng.uniform(-1.0, 1.0, m)
          return (np.c_[t, t ** 2, np.sin(3 * t), 0.5 * t, -t ** 2, np.cos(2 * t)]
                  * [1.0, 2.0, 0.5, 4.0, 1.0, 3.0] + [0.0, 3.0, -1.0, 5.0, 0.0, 2.0]
                  + rng.normal(0.0, 0.05, (m, 6)))
      X_train = curve(400)
      y_train = np.zeros(400)
      y_train[:24] = 1.0
      X_train[:24] += rng.normal(0.0, 1.5, (24, 6))
      X_score = curve(40)
      X_score[:10] += rng.normal(0.0, 1.5, (10, 6))
      inputs = (X_train, y_train, X_score, 2, 0.1, 15, 32, 7)
    wrong:
      - hint: "Trained on every training row. The network learns to reproduce whatever it is fitted to, frauds included; keep the rows with y_train == 0."
        code: |
          import numpy as np
          def f(X_train, y_train, X_score, k, lr, epochs, bs, seed):
              mean, std = X_train.mean(0), X_train.std(0)
              rng = np.random.default_rng(seed); X = (X_train - mean) / std
              n, d = X.shape; W = rng.normal(0, 1 / np.sqrt(d), (d, k)); b1 = np.zeros(k); b2 = np.zeros(d)
              for _ in range(epochs):
                  o = rng.permutation(n)
                  for s in range(0, n, bs):
                      B = X[o[s:s + bs]]; Z = np.tanh(B @ W + b1); G = 2 * (Z @ W.T + b2 - B) / B.size
                      dA = (G @ W) * (1 - Z ** 2)
                      W -= lr * (B.T @ dA + G.T @ Z); b1 -= lr * dA.sum(0); b2 -= lr * G.sum(0)
              S = (X_score - mean) / std
              return np.mean((np.tanh(S @ W + b1) @ W.T + b2 - S) ** 2, axis=1)
      - hint: "Did not standardise. Columns in large units dominate the squared error and the tanh saturates; place the training rows and the scored rows with the genuine training rows' mean and standard deviation."
        code: |
          import numpy as np
          def f(X_train, y_train, X_score, k, lr, epochs, bs, seed):
              X = X_train[y_train == 0]
              rng = np.random.default_rng(seed)
              n, d = X.shape; W = rng.normal(0, 1 / np.sqrt(d), (d, k)); b1 = np.zeros(k); b2 = np.zeros(d)
              for _ in range(epochs):
                  o = rng.permutation(n)
                  for s in range(0, n, bs):
                      B = X[o[s:s + bs]]; Z = np.tanh(B @ W + b1); G = 2 * (Z @ W.T + b2 - B) / B.size
                      dA = (G @ W) * (1 - Z ** 2)
                      W -= lr * (B.T @ dA + G.T @ Z); b1 -= lr * dA.sum(0); b2 -= lr * G.sum(0)
              S = X_score
              return np.mean((np.tanh(S @ W + b1) @ W.T + b2 - S) ** 2, axis=1)
      - hint: "Standardised the scored rows with their own mean and standard deviation, the ULB lesson's flood: every payment has to be placed in the coordinates the network was trained in, the genuine training rows'."
        code: |
          import numpy as np
          def f(X_train, y_train, X_score, k, lr, epochs, bs, seed):
              G0 = X_train[y_train == 0]; mean, std = G0.mean(0), G0.std(0)
              rng = np.random.default_rng(seed); X = (G0 - mean) / std
              n, d = X.shape; W = rng.normal(0, 1 / np.sqrt(d), (d, k)); b1 = np.zeros(k); b2 = np.zeros(d)
              for _ in range(epochs):
                  o = rng.permutation(n)
                  for s in range(0, n, bs):
                      B = X[o[s:s + bs]]; Z = np.tanh(B @ W + b1); G = 2 * (Z @ W.T + b2 - B) / B.size
                      dA = (G @ W) * (1 - Z ** 2)
                      W -= lr * (B.T @ dA + G.T @ Z); b1 -= lr * dA.sum(0); b2 -= lr * G.sum(0)
              S = (X_score - X_score.mean(0)) / X_score.std(0)
              return np.mean((np.tanh(S @ W + b1) @ W.T + b2 - S) ** 2, axis=1)

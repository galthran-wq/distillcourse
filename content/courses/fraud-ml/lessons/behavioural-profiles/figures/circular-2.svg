<text x="210.9" y="93.1" fill="#e2903a" font-size="11">R̄ = 0.86</text>
<g opacity="0.3"><text x="370" y="60" fill="currentColor" font-weight="600" font-size="12.5">1. Each time becomes an arrow</text>
<text x="370" y="77" fill="currentColor" font-size="11.5" opacity="0.75">22:00 → 330°, 23:00 → 345°,</text>
<text x="370" y="92" fill="currentColor" font-size="11.5" opacity="0.75">02:00 → 30°, 03:00 → 45°;</text>
<text x="370" y="107" fill="currentColor" font-size="11.5" opacity="0.75">each arrow has length 1</text>
</g>
<g opacity="1"><text x="370" y="122" fill="#e2903a" font-weight="600" font-size="12.5">2. Average the arrows</text>
<text x="370" y="139" fill="currentColor" font-size="11.5" opacity="0.75">mean of the first coordinates 0.851</text>
<text x="370" y="154" fill="currentColor" font-size="11.5" opacity="0.75">mean of the second coordinates 0.112</text>
<text x="370" y="169" fill="currentColor" font-size="11.5" opacity="0.75">length of the average R̄ = 0.86</text>
</g>
<g opacity="0.3"><text x="370" y="184" fill="currentColor" font-weight="600" font-size="12.5">3. Its direction is the circular mean</text>
<text x="370" y="201" fill="currentColor" font-size="11.5" opacity="0.75">angle 7.5° = 7.5 / 15 h</text>
<text x="370" y="216" fill="currentColor" font-size="11.5" opacity="0.75">= 00:30, among the payments</text>
<text x="370" y="231" fill="currentColor" font-size="11.5" opacity="0.75"></text>
</g>
<g opacity="0.3"><text x="370" y="246" fill="currentColor" font-weight="600" font-size="12.5">4. A von Mises fit gives the 90% arc</text>
<text x="370" y="263" fill="currentColor" font-size="11.5" opacity="0.75">concentration κ̂ = 3.9 from R̄ = 0.86</text>
<text x="370" y="278" fill="currentColor" font-size="11.5" opacity="0.75">90% of the fitted mass in</text>
<text x="370" y="293" fill="currentColor" font-size="11.5" opacity="0.75">21:03 – 03:57</text>
</g>

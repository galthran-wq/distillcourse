<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .bold { fill: currentColor; font-weight: 600; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .small { fill: currentColor; font-size: 11.5px; }
    .axis { stroke: currentColor; stroke-width: 1; fill: none; }
    .guide { stroke: currentColor; stroke-dasharray: 3 3; opacity: 0.5; fill: none; }
    .box { stroke: currentColor; stroke-width: 1; fill: none; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker>
    <marker id="arA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2903a"/></marker>
  </defs>
  <text class="bold" x="20" y="26" text-anchor="start" style="fill:#4c8dd6">aggregate file, from the real log</text>
  <text class="muted" x="24" y="50" text-anchor="start">step</text>
  <text class="muted" x="96" y="50" text-anchor="start">type</text>
  <text class="muted" x="180" y="50" text-anchor="start">count</text>
  <text class="muted" x="236" y="50" text-anchor="start">mean</text>
  <text class="muted" x="300" y="50" text-anchor="start">sd</text>
  <rect x="18" y="58" width="350" height="24" rx="4" fill="#4c8dd6" fill-opacity="0.12" stroke="#4c8dd6"/>
  <text class="small" x="24" y="75" text-anchor="start">day 1, 15h</text>
  <text class="small" x="96" y="75" text-anchor="start">PAYMENT</text>
  <text class="small" x="180" y="75" text-anchor="start">8,703</text>
  <text class="small" x="236" y="75" text-anchor="start">180,000</text>
  <text class="small" x="300" y="75" text-anchor="start">15,000</text>
  <text class="muted" x="24" y="100" text-anchor="start">day 1, 15h</text>
  <text class="muted" x="96" y="100" text-anchor="start">TRANSFER</text>
  <text class="muted" x="180" y="100" text-anchor="start">…</text>
  <text class="muted" x="236" y="100" text-anchor="start">…</text>
  <text class="muted" x="300" y="100" text-anchor="start">…</text>
  <text class="muted" x="24" y="120" text-anchor="start">day 1, 16h</text>
  <text class="muted" x="96" y="120" text-anchor="start">PAYMENT</text>
  <text class="muted" x="180" y="120" text-anchor="start">…</text>
  <text class="muted" x="236" y="120" text-anchor="start">…</text>
  <text class="muted" x="300" y="120" text-anchor="start">…</text>
  <text class="small" x="20" y="158" text-anchor="start">one row per hour × type: how many,</text>
  <text class="small" x="20" y="174" text-anchor="start">how large, how spread</text>
  <path d="M368,70 L390,70 L390,120 L410,120" class="axis" marker-end="url(#ar)"/>
  <rect x="412" y="98" width="210" height="48" rx="5" class="box"/>
  <text class="bold" x="517" y="118" text-anchor="middle">agents (clients)</text>
  <text class="small" x="517" y="136" text-anchor="middle">draw type, amount, counterparty</text>
  <path d="M517,146 L517,190" class="axis" marker-end="url(#ar)"/>
  <text class="bold" x="20" y="214" text-anchor="start">synthetic rows</text>
  <text class="muted" x="24" y="236" text-anchor="start">step</text>
  <text class="muted" x="74" y="236" text-anchor="start">type</text>
  <text class="muted" x="150" y="236" text-anchor="start">amount</text>
  <text class="muted" x="224" y="236" text-anchor="start">nameOrig</text>
  <text class="muted" x="330" y="236" text-anchor="start">nameDest</text>
  <text class="muted" x="440" y="236" text-anchor="start">balances</text>
  <rect x="20" y="244" width="44" height="24" rx="4" fill="#4c8dd6" fill-opacity="0.13" stroke="#4c8dd6"/>
  <text class="small" x="24" y="261" text-anchor="start">15</text>
  <rect x="70" y="244" width="70" height="24" rx="4" fill="#4c8dd6" fill-opacity="0.13" stroke="#4c8dd6"/>
  <text class="small" x="74" y="261" text-anchor="start">PAYMENT</text>
  <rect x="146" y="244" width="68" height="24" rx="4" fill="#4c8dd6" fill-opacity="0.13" stroke="#4c8dd6"/>
  <text class="small" x="150" y="261" text-anchor="start">172,410</text>
  <rect x="220" y="244" width="100" height="24" rx="4" fill="#e2903a" fill-opacity="0.13" stroke="#e2903a"/>
  <text class="small" x="224" y="261" text-anchor="start">C4291…</text>
  <rect x="326" y="244" width="104" height="24" rx="4" fill="#e2903a" fill-opacity="0.13" stroke="#e2903a"/>
  <text class="small" x="330" y="261" text-anchor="start">M1591…</text>
  <rect x="436" y="244" width="120" height="24" rx="4" fill="#e2903a" fill-opacity="0.13" stroke="#e2903a"/>
  <text class="small" x="440" y="261" text-anchor="start">190,220 → 17,810</text>
  <text class="small" x="24" y="292" text-anchor="start" style="fill:#4c8dd6">blue: matched to the log’s hourly aggregates</text>
  <text class="small" x="24" y="310" text-anchor="start" style="fill:#e2903a">amber: invented by the agents, never checked against the log</text>
</svg>

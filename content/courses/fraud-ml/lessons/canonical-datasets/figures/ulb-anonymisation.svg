<svg viewBox="0 0 760 312" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .bold { fill: currentColor; font-weight: 600; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .small { fill: currentColor; font-size: 11.5px; }
    .axis { stroke: currentColor; stroke-width: 1; fill: none; }
    .guide { stroke: currentColor; stroke-dasharray: 3 3; opacity: 0.5; fill: none; }
    .box { stroke: currentColor; stroke-width: 1; fill: none; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker>
    <marker id="arA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2903a"/></marker>
  </defs>
  <text class="bold" x="20" y="28" text-anchor="start">what the card processor holds</text>
  <text class="muted" x="20" y="44" text-anchor="start">(typical fields; the originals are not disclosed)</text>
  <rect x="20" y="53" width="220" height="24" rx="4" class="box" opacity="0.6"/>
  <text class="label" x="30" y="70" text-anchor="start">card identifier</text>
  <rect x="20" y="83" width="220" height="24" rx="4" class="box" opacity="0.6"/>
  <text class="label" x="30" y="100" text-anchor="start">time of payment</text>
  <rect x="20" y="113" width="220" height="24" rx="4" class="box" opacity="0.6"/>
  <text class="label" x="30" y="130" text-anchor="start">amount</text>
  <rect x="20" y="143" width="220" height="24" rx="4" class="box" opacity="0.6"/>
  <text class="label" x="30" y="160" text-anchor="start">merchant, terminal, country,</text>
  <rect x="20" y="173" width="220" height="24" rx="4" class="box" opacity="0.6"/>
  <text class="label" x="30" y="190" text-anchor="start">merchant category, derived</text>
  <rect x="20" y="203" width="220" height="24" rx="4" class="box" opacity="0.6"/>
  <text class="label" x="30" y="220" text-anchor="start">features (undisclosed)</text>
  <rect x="20" y="233" width="220" height="24" rx="4" class="box" opacity="0.6"/>
  <text class="label" x="30" y="250" text-anchor="start">fraud verdict</text>
  <text class="bold" x="470" y="28" text-anchor="start">what the released file holds</text>
  <text class="muted" x="470" y="44" text-anchor="start">284,807 rows, 31 columns</text>
  <rect x="470" y="83" width="120" height="24" rx="4" stroke="currentColor" stroke-width="1.5" fill="none"/>
  <text class="bold" x="480" y="100" text-anchor="start">Time</text>
  <text class="muted" x="600" y="104" text-anchor="start">seconds since the first row</text>
  <rect x="470" y="143" width="120" height="24" rx="4" stroke="#e2903a" stroke-width="1.5" fill="none"/>
  <text class="bold" x="480" y="160" text-anchor="start">V1 … V28</text>
  <text class="muted" x="600" y="164" text-anchor="start">28 principal components</text>
  <rect x="470" y="113" width="120" height="24" rx="4" stroke="currentColor" stroke-width="1.5" fill="none"/>
  <text class="bold" x="480" y="130" text-anchor="start">Amount</text>
  <text class="muted" x="600" y="134" text-anchor="start">the payment amount</text>
  <rect x="470" y="233" width="120" height="24" rx="4" stroke="currentColor" stroke-width="1.5" fill="none"/>
  <text class="bold" x="480" y="250" text-anchor="start">Class</text>
  <text class="muted" x="600" y="254" text-anchor="start">1 = fraud (492 rows)</text>
  <path d="M240,95 L466,95" class="axis" marker-end="url(#ar)"/>
  <path d="M240,125 L466,125" class="axis" marker-end="url(#ar)"/>
  <path d="M240,155 L330,200" stroke="#e2903a" fill="none"/>
  <path d="M240,185 L330,200" stroke="#e2903a" fill="none"/>
  <path d="M240,215 L330,200" stroke="#e2903a" fill="none"/>
  <rect x="330" y="186" width="70" height="26" rx="4" fill="#e2903a" fill-opacity="0.15" stroke="#e2903a"/>
  <text class="bold" x="365" y="204" text-anchor="middle">PCA</text>
  <path d="M400,196 L466,158" stroke="#e2903a" fill="none" marker-end="url(#arA)"/>
  <path d="M240,245 L466,245" class="axis" marker-end="url(#ar)"/>
  <path d="M240,65 L300,65" class="guide"/>
  <path d="M300,58 l12,12 M312,58 l-12,12" stroke="currentColor" stroke-width="2"/>
  <text class="small" x="320" y="69" text-anchor="start">dropped: no card history, no card-level ranking</text>
  <text class="muted" x="20" y="300" text-anchor="start">Two days of September 2013, online payments by European cardholders.</text>
</svg>

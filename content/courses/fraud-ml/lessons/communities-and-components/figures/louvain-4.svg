<text x="200.0" y="165.0" text-anchor="middle" font-size="14" fill="#ffffff" font-weight="600">ABC</text>
<circle cx="440.0" cy="160.0" r="46" fill="#4c8dd6" fill-opacity="0.85" stroke="#4c8dd6" stroke-width="1.4"/>
<text x="440.0" y="165.0" text-anchor="middle" font-size="14" fill="#ffffff" font-weight="600">DEFG</text>
<line x1="240.0" y1="160.0" x2="394.0" y2="160.0" stroke="currentColor" stroke-width="2.5" opacity="0.7"/>
<text x="317.0" y="150.0" text-anchor="middle" font-size="12" fill="currentColor">4</text>
<path d="M180,124 C150,70 250,70 220,124" fill="none" stroke="#e2903a" stroke-width="2"/>

<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
<text x="16.0" y="24.0" text-anchor="start" font-size="13" fill="currentColor" font-weight="600">phase 2: each community becomes one node, and phase 1 runs again</text>

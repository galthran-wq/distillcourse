<text x="16.0" y="260.0" text-anchor="start" font-size="12" fill="currentColor" font-weight="600">merge the two? ΔQ = 4/54 − 44 × 64/(2 × 54²) = −0.41: no.</text>
<text x="16.0" y="282.0" text-anchor="start" font-size="12" fill="currentColor">No move helps, so the algorithm stops with two communities and Q = 0.41.</text>
<text x="16.0" y="304.0" text-anchor="start" font-size="12" fill="currentColor" opacity="0.75">On a large graph phase 2 repeats many times, and each pass is one level of a hierarchy.</text>

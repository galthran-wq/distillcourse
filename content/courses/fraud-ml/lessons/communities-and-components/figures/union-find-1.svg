<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
<text x="16.0" y="24.0" text-anchor="start" font-size="13" fill="currentColor" font-weight="600">make-set: every user is its own component</text>
<circle cx="40.0" cy="90.0" r="14" fill="none" stroke="currentColor" stroke-width="1.4"/>
<text x="40.0" y="94.5" text-anchor="middle" font-size="11.5" fill="currentColor" font-weight="600">U1</text>
<circle cx="90.0" cy="90.0" r="14" fill="#e2903a" fill-opacity="0.85" stroke="#e2903a" stroke-width="1.4"/>
<text x="90.0" y="94.5" text-anchor="middle" font-size="11.5" fill="#ffffff" font-weight="600">U2</text>
<circle cx="140.0" cy="90.0" r="14" fill="none" stroke="currentColor" stroke-width="1.4"/>
<text x="140.0" y="94.5" text-anchor="middle" font-size="11.5" fill="currentColor" font-weight="600">U3</text>
<circle cx="190.0" cy="90.0" r="14" fill="none" stroke="currentColor" stroke-width="1.4"/>
<text x="190.0" y="94.5" text-anchor="middle" font-size="11.5" fill="currentColor" font-weight="600">U4</text>
<circle cx="240.0" cy="90.0" r="14" fill="none" stroke="currentColor" stroke-width="1.4"/>
<text x="240.0" y="94.5" text-anchor="middle" font-size="11.5" fill="currentColor" font-weight="600">U5</text>
<circle cx="290.0" cy="90.0" r="14" fill="none" stroke="currentColor" stroke-width="1.4"/>
<text x="290.0" y="94.5" text-anchor="middle" font-size="11.5" fill="currentColor" font-weight="600">U6</text>
<circle cx="340.0" cy="90.0" r="14" fill="#e2903a" fill-opacity="0.85" stroke="#e2903a" stroke-width="1.4"/>
<text x="340.0" y="94.5" text-anchor="middle" font-size="11.5" fill="#ffffff" font-weight="600">U7</text>
<circle cx="390.0" cy="90.0" r="14" fill="none" stroke="currentColor" stroke-width="1.4"/>
<text x="390.0" y="94.5" text-anchor="middle" font-size="11.5" fill="currentColor" font-weight="600">U8</text>
<circle cx="440.0" cy="90.0" r="14" fill="none" stroke="currentColor" stroke-width="1.4"/>
<text x="440.0" y="94.5" text-anchor="middle" font-size="11.5" fill="currentColor" font-weight="600">U9</text>
<text x="16.0" y="225.0" text-anchor="start" font-size="11.5" fill="currentColor" opacity="0.65">parent pointers: a node with no arrow is a root, and its id names the component</text>
<text x="500.0" y="60.0" text-anchor="start" font-size="12" fill="currentColor" font-weight="600">edges, in order</text>
<text x="500.0" y="84.0" text-anchor="start" font-size="12" fill="#e2903a" font-weight="600">→ U1 – U2</text>
<text x="500.0" y="104.0" text-anchor="start" font-size="12" fill="currentColor" opacity="0.55"> U2 – U3</text>
<text x="500.0" y="124.0" text-anchor="start" font-size="12" fill="currentColor" opacity="0.55"> U1 – U3</text>
<text x="500.0" y="144.0" text-anchor="start" font-size="12" fill="currentColor" opacity="0.55"> U6 – U7</text>
<text x="500.0" y="164.0" text-anchor="start" font-size="12" fill="currentColor" opacity="0.55"> U7 – U8</text>
<text x="500.0" y="184.0" text-anchor="start" font-size="12" fill="currentColor" opacity="0.55"> U6 – U8</text>
<text x="16.0" y="255.0" text-anchor="start" font-size="12" fill="currentColor">find(x) follows the arrows to a root; union(x, y) points one root at the other.</text>
<text x="16.0" y="275.0" text-anchor="start" font-size="12" fill="currentColor">Nine users, nine roots.</text>
</svg>

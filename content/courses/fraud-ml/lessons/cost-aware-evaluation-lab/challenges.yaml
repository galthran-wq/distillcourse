          from sklearn.metrics import roc_auc_score
          def split(days, cards, labels, start, n_folds, dtr, ddel, dte):
              roles = np.zeros((n_folds, len(days)), dtype=np.int64)
              for j in range(n_folds):
                  s = start - j * dte
                  roles[j, (days >= s) & (days < s + dtr)] = 1
                  for i in range(dte):
                      d = s + dtr + ddel + i
                      known = cards[(labels == 1) & (days >= s) & (days <= d - ddel - 1)]
                      roles[j, (days == d) & ~np.isin(cards, known)] = 2
              return roles
          def ap(y, s):
              o = np.argsort(-s, kind="stable"); s, y = s[o], y[o].astype(float)
              last = np.r_[s[1:] != s[:-1], True]
              tp = np.cumsum(y)[last]; n = np.flatnonzero(last) + 1
              return float(np.sum(np.diff(np.r_[0.0, tp / y.sum()]) * tp / n))
          def f(days, cards, labels, candidates, fit_and_score, deploy_start, n_folds, dtr, ddel, dval, k):
              roles = split(days, cards, labels, deploy_start - ddel - dval, n_folds, dtr, ddel, dval)
              table = np.zeros((len(candidates), n_folds, 3))
              for c, cand in enumerate(candidates):
                  ys, ss = [], []
                  for j in range(n_folds):
                      tr, va = np.flatnonzero(roles[j] == 1), np.flatnonzero(roles[j] == 2)
                      ss.append(fit_and_score(tr, cand)[va]); ys.append(labels[va])
                  y, s = np.concatenate(ys), np.concatenate(ss)
                  table[c, :, 0] = roc_auc_score(y, s)
                  table[c, :, 1] = ap(y, s)
              return table, table.mean(axis=1).argmax(axis=0)

  why-auc-spares-depth-50:
    kind: review
    rubric: |
      The question: on prequential validation folds of a simulated card
      stream, a fully grown decision tree (max_depth 50, trained on one
      week) scores a ROC-AUC level with the best depths while its average
      precision is the worst of the depth grid. The learner must explain
      the disagreement from the shape of that tree's scores.

      Pass if the answer contains both:
      (a) the structure: a fully grown tree has (near-)pure leaves, so on
          new data it outputs essentially two scores (0 and 1, or a handful
          of values) — a small top block and a large tied bottom block that
          still holds part of the frauds. "Few distinct scores", "pure
          leaves give 0/1 probabilities" or "massive ties" are sufficient;
      (b) what each metric does with it: ROC-AUC credits the top block's
          recall at a very low false-positive rate and treats the tied
          bottom block as one straight segment / half-correct pairs (it is
          the mean of TPR and TNR for a two-score model), so the frauds left
          in the bottom block cost it little; AP reaches those frauds only
          when the whole tied block is opened, at base-rate precision, so
          they add almost nothing and AP is capped near (top-block recall) x
          (top-block precision). Stating that AP weights the top of the
          ranking / the precision at each fraud while AUC weights all
          false-positive rates equally, including ones far beyond the alert
          budget, satisfies (b) when tied to the bottom block.

      Fail if the answer only says the tree overfits, has high variance, or
      memorises training data without saying what its ranking looks like;
      or claims AUC is inflated by class imbalance as such (AUC is
      insensitive to class sizes); or attributes the gap to the delay block,
      known-card removal or the fold geometry.


                  ts = np.full(len(c), -np.inf); np.maximum.at(ts, inv, s[r])
                  tl = np.zeros(len(c)); np.maximum.at(tl, inv, y[r])
                  top = np.lexsort((c, -ts))[:k]; hit = tl[top] == 1
                  out.append(hit.sum() / k); det = np.concatenate([det, c[top][hit]])
              return np.mean(out)
          def _split(day, card, y, st, nf, dtr, dd, dte):
              folds = []

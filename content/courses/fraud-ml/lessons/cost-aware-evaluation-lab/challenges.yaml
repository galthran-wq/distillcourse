checkpoints:
  average-precision:
    kind: exact
    seed: 2101
    atol: 1.0e-9
    inputs_code: |
      n = 2000
      labels = (rng.random(n) < 0.03).astype(float)
      labels[:3] = 1.0
      # Two-decimal scores: blocks of tied rows, so the tie rule is tested.
      scores = np.round(rng.beta(2, 5, n) + 0.3 * labels * rng.random(n), 2)
      inputs = (labels, scores)
    wrong:
      - hint: "Joined the precision-recall points with trapezoids. AP is a step sum: each recall gain is multiplied by the precision at the cut that reached it, never by an average of two neighbouring precisions."
        code: |
          import numpy as np
          def f(labels, scores):
              labels = np.asarray(labels, float); scores = np.asarray(scores, float)
              o = np.argsort(-scores, kind="stable"); s, y = scores[o], labels[o]
              last = np.r_[s[1:] != s[:-1], True]
              tp = np.cumsum(y)[last]; n = np.flatnonzero(last) + 1
              p = np.r_[1.0, tp / n]; r = np.r_[0.0, tp / y.sum()]
              return float(np.sum(np.diff(r) * (p[1:] + p[:-1]) / 2))
      - hint: "Treated every row as its own cut. Rows with equal scores form one block the team opens whole: every fraud in it is reached at the precision after the whole block."
        code: |
          import numpy as np
          def f(labels, scores):
              labels = np.asarray(labels, float); scores = np.asarray(scores, float)
              y = labels[np.argsort(-scores, kind="stable")]
              tp = np.cumsum(y)
              p = tp / np.arange(1, len(y) + 1)
              return float(np.sum(p * y) / y.sum())
      - hint: "Averaged the precision over every cut of the list. AP averages it only at the cuts where recall moves, that is at the frauds."
        code: |
          import numpy as np
          def f(labels, scores):
              labels = np.asarray(labels, float); scores = np.asarray(scores, float)
              o = np.argsort(-scores, kind="stable"); s, y = scores[o], labels[o]
              last = np.r_[s[1:] != s[:-1], True]
              tp = np.cumsum(y)[last]; n = np.flatnonzero(last) + 1
              return float(np.mean(tp / n))

  savings-metric:
    kind: exact
    seed: 2202
    atol: 1.0e-6
    inputs_code: |
      n = 200
      amounts = np.round(rng.lognormal(3.5, 1.0, n), 2)
      labels = np.zeros(n, dtype=np.int64)
      frauds = rng.choice(n, 6, replace=False)
      labels[frauds] = 1
      decisions = (rng.random(n) < 0.08).astype(np.int64)
      decisions[frauds[:2]] = 1
      # €0.25 makes flagging everything the cheaper trivial policy; €5 and
      # €40 make it flagging nothing.
      c_a = np.array([0.25, 5.0, 40.0])
      inputs = (amounts, labels, decisions, c_a)
    wrong:
      - hint: "A caught fraud was priced at zero. The call is made on a caught fraud too: a true positive costs the alert cost, like a false positive."
        code: |
          import numpy as np
          def f(amounts, labels, decisions, c_a):
              a = np.asarray(amounts, float); y = np.asarray(labels, float); d = np.asarray(decisions, float)
              c_a = np.atleast_1d(np.asarray(c_a, float))
              cost = np.sum(y * (1 - d) * a) + np.sum((1 - y) * d) * c_a
              base = np.minimum(np.sum(y * a), len(a) * c_a)
              return cost, base, (base - cost) / base
      - hint: "The baseline is always the cost of flagging everything. It is the cheaper of flagging nothing (the fraud amount) and flagging everything (N times the alert cost) — on card data almost always flagging nothing."
        code: |
          import numpy as np
          def f(amounts, labels, decisions, c_a):
              a = np.asarray(amounts, float); y = np.asarray(labels, float); d = np.asarray(decisions, float)
              c_a = np.atleast_1d(np.asarray(c_a, float))
              cost = np.sum(y * (1 - d) * a) + d.sum() * c_a
              base = len(a) * c_a
              return cost, base, (base - cost) / base
      - hint: "The baseline is always the cost of flagging nothing. With a cheap enough alert, flagging everything costs less, and the baseline is the cheaper of the two."
        code: |
          import numpy as np
          def f(amounts, labels, decisions, c_a):
              a = np.asarray(amounts, float); y = np.asarray(labels, float); d = np.asarray(decisions, float)
              c_a = np.atleast_1d(np.asarray(c_a, float))
              cost = np.sum(y * (1 - d) * a) + d.sum() * c_a
              base = np.full_like(c_a, np.sum(y * a))
              return cost, base, (base - cost) / base
      - hint: "Divided the saving by the detector's cost. Savings is a share of the baseline cost: (baseline - cost) / baseline."
        code: |
          import numpy as np
          def f(amounts, labels, decisions, c_a):
              a = np.asarray(amounts, float); y = np.asarray(labels, float); d = np.asarray(decisions, float)
              c_a = np.atleast_1d(np.asarray(c_a, float))
              cost = np.sum(y * (1 - d) * a) + d.sum() * c_a
              base = np.minimum(np.sum(y * a), len(a) * c_a)
              return cost, base, (base - cost) / cost

  prequential-split:
    kind: exact
    seed: 2304
    atol: 0.5
    inputs_code: |
      n = 600
      days = np.sort(rng.integers(0, 30, n))
      cards = rng.integers(0, 25, n)
      labels = np.zeros(n, dtype=np.int64)
      for card, first in zip(rng.choice(25, 14, replace=False), rng.integers(0, 26, 14)):
          window = (cards == card) & (days >= first) & (days < first + 8)
          labels[window & (rng.random(n) < 0.6)] = 1
      inputs = (days, cards, labels, 14, 3, 5, 3, 4)
    wrong:
      - hint: "Removed cards using every label up to the day before the test day. On test day d only the labels of days up to d - delay - 1 have arrived; a card whose fraud was later is still scored."
        code: |
          import numpy as np
          def f(days, cards, labels, start, n_folds, dtr, ddel, dte):
              roles = np.zeros((n_folds, len(days)), dtype=np.int64)
              for j in range(n_folds):
                  s = start - j * dte
                  roles[j, (days >= s) & (days < s + dtr)] = 1
                  for i in range(dte):
                      d = s + dtr + ddel + i
                      known = cards[(labels == 1) & (days >= s) & (days <= d - 1)]
                      roles[j, (days == d) & ~np.isin(cards, known)] = 2
              return roles
      - hint: "Froze the known-card list at the end of training. The list grows through the test week: on test day d it holds every card with a fraud up to day d - delay - 1."
        code: |
          import numpy as np
          def f(days, cards, labels, start, n_folds, dtr, ddel, dte):
              roles = np.zeros((n_folds, len(days)), dtype=np.int64)
              for j in range(n_folds):
                  s = start - j * dte
                  roles[j, (days >= s) & (days < s + dtr)] = 1
                  known = cards[(labels == 1) & (days >= s) & (days < s + dtr)]
                  for i in range(dte):
                      d = s + dtr + ddel + i
                      roles[j, (days == d) & ~np.isin(cards, known)] = 2
              return roles
      - hint: "Counted frauds from before the fold's training block. This lab starts the known-card count at s_j, the fold's first training day, so that every fold is cleaned with the same lookback whatever stream history precedes it: on test day d the list holds the cards with a fraud on a day from s_j to d - delay - 1."
        code: |
          import numpy as np

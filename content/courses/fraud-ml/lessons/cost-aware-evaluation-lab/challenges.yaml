          def f(fit_fn, configs, X, y, day, card, start_train_test, n_folds, d_train, d_delay, d_valid, k):
              folds = _split(day, card, y, start_train_test, n_folds, d_train, d_delay, d_valid)
              sc = np.empty((3, len(configs), n_folds))
              for j, c in enumerate(configs):
                  for i, (tr, va) in enumerate(folds):
                      s = fit_fn(c, X[tr], y[tr])(X[va])

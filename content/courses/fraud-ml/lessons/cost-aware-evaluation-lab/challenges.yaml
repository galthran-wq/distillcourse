  card-precision-top-k:
    kind: exact
    seed: 2404
    atol: 1.0e-9
    inputs_code: |
      # Seven days over 30 cards: six of 40 transactions and, on day 3, a
      # sparse day of 3. About half the cards are compromised all week, so
      # detected-card removal bites; a few genuine cards score high every
      # day, so removing the wrong cards does. Scores are rounded to one
      # decimal so that cards tie at the cut, as tree scores do.
      day = np.repeat(np.arange(7), [40, 40, 40, 3, 40, 40, 40])
      n = len(day)
      card = rng.integers(0, 30, n)
      bad = rng.random(30) < 0.5
      hot = rng.random(30) < 0.25
      y = (bad[card] & (rng.random(n) < 0.3)).astype(int)
      y[day == 3] = [1, 0, 0]
      scores = np.round(rng.random(n) + 0.3 * y + 0.6 * hot[card], 1)
      inputs = (day, card, y, scores, 4)
    wrong:
      - hint: "That is transaction precision at k: the top k transactions, a card counted as often as it appears. Collapse each day to one row per card first (max score, max label)."
        code: |
          def f(day, card, y, scores, k):
              import numpy as np
              out = []
              for d in np.unique(day):
                  rows = np.flatnonzero(day == d)
                  top = rows[np.argsort(-scores[rows], kind="stable")[:k]]
                  out.append(y[top].sum() / k)
              return np.array(out)
      - hint: "Detected cards were never removed: a compromised card in the top k on day d is blocked and must be dropped from every later day, or the detector is credited with it again."
        code: |
          def f(day, card, y, scores, k):
              import numpy as np
              out = []
              for d in np.unique(day):
                  rows = day == d
                  cards, inv = np.unique(card[rows], return_inverse=True)
                  ts = np.full(len(cards), -np.inf); np.maximum.at(ts, inv, scores[rows])
                  tl = np.zeros(len(cards)); np.maximum.at(tl, inv, y[rows])
                  top = np.lexsort((cards, -ts))[:k]
                  out.append((tl[top] == 1).sum() / k)
              return np.array(out)
      - hint: "Every alerted card was removed from later days. Only the compromised ones are blocked; a genuine card that was called is cleared and stays in the pool."
        code: |
          def f(day, card, y, scores, k):
              import numpy as np
              gone = np.array([], dtype=card.dtype)
              out = []
              for d in np.unique(day):
                  rows = (day == d) & ~np.isin(card, gone)
                  cards, inv = np.unique(card[rows], return_inverse=True)
                  ts = np.full(len(cards), -np.inf); np.maximum.at(ts, inv, scores[rows])
                  tl = np.zeros(len(cards)); np.maximum.at(tl, inv, y[rows])
                  top = np.lexsort((cards, -ts))[:k]
                  out.append((tl[top] == 1).sum() / k)
                  gone = np.concatenate([gone, cards[top]])
              return np.array(out)
      - hint: "A card's score is its MAXIMUM transaction score — the most suspicious transaction is the one that triggers the call — not the mean of its scores."
        code: |
          def f(day, card, y, scores, k):
              import numpy as np
              gone = np.array([], dtype=card.dtype)
              out = []
              for d in np.unique(day):
                  rows = (day == d) & ~np.isin(card, gone)
                  cards, inv = np.unique(card[rows], return_inverse=True)
                  ts = np.bincount(inv, weights=scores[rows]) / np.bincount(inv)
                  tl = np.zeros(len(cards)); np.maximum.at(tl, inv, y[rows])
                  top = np.lexsort((cards, -ts))[:k]
                  hit = tl[top] == 1
                  out.append(hit.sum() / k)
                  gone = np.concatenate([gone, cards[top][hit]])
              return np.array(out)
      - hint: "Ties were broken toward the larger card id (an ascending argsort reversed). The rule is score descending, then the SMALLER card id first: np.lexsort((cards, -top_score))."
        code: |
          def f(day, card, y, scores, k):
              import numpy as np
              gone = np.array([], dtype=card.dtype)
              out = []
              for d in np.unique(day):
                  rows = (day == d) & ~np.isin(card, gone)
                  cards, inv = np.unique(card[rows], return_inverse=True)
                  ts = np.full(len(cards), -np.inf); np.maximum.at(ts, inv, scores[rows])
                  tl = np.zeros(len(cards)); np.maximum.at(tl, inv, y[rows])
                  top = np.argsort(ts, kind="stable")[::-1][:k]
                  hit = tl[top] == 1
                  out.append(hit.sum() / k)
                  gone = np.concatenate([gone, cards[top][hit]])
              return np.array(out)
      - hint: "On a day with fewer than k cards the denominator is still k: the investigators had k calls and used fewer. Dividing by min(k, number of cards) credits the detector with calls it never made."
        code: |
          def f(day, card, y, scores, k):
              import numpy as np
              gone = np.array([], dtype=card.dtype)
              out = []
              for d in np.unique(day):
                  rows = (day == d) & ~np.isin(card, gone)
                  cards, inv = np.unique(card[rows], return_inverse=True)
                  ts = np.full(len(cards), -np.inf); np.maximum.at(ts, inv, scores[rows])
                  tl = np.zeros(len(cards)); np.maximum.at(tl, inv, y[rows])
                  top = np.lexsort((cards, -ts))[:k]
                  hit = tl[top] == 1
                  out.append(hit.sum() / min(k, len(cards)))
                  gone = np.concatenate([gone, cards[top][hit]])
              return np.array(out)
  bmr-threshold:
    kind: exact
    seed: 2505
    atol: 1.0e-6
    inputs_code: |
      # 200 transactions: log-normal amounts around 30, skewed probabilities.
      n = 200
      amount = np.round(rng.lognormal(3.5, 1.0, n), 2)
      p = rng.beta(0.5, 4.0, n)
      y = (rng.random(n) < p).astype(float)
      inputs = (amount, p, y, 10.0)
    wrong:
      - hint: "A fixed threshold of 0.5 on p ignores the amount. The minimum-risk rule flags exactly when C_a <= amount * p: a large transaction is worth a call at a small probability."
        code: |
          def f(amount, p, y, C_a):
              import numpy as np
              dec = (p >= 0.5).astype(float)
              cost = float(np.sum(y * (1 - dec) * amount + dec * C_a))
              cl = float(min(np.sum(y * amount), len(amount) * C_a))
              return dec, cost, (cl - cost) / cl
      - hint: "The comparison is reversed: flag when the expected loss of passing, amount * p, is AT LEAST the alert cost C_a."
        code: |
          def f(amount, p, y, C_a):
              import numpy as np
              dec = (amount * p <= C_a).astype(float)
              cost = float(np.sum(y * (1 - dec) * amount + dec * C_a))
              cl = float(min(np.sum(y * amount), len(amount) * C_a))
              return dec, cost, (cl - cost) / cl
  undersampling-correction:
    kind: exact
    seed: 2606
    atol: 1.0e-9
    inputs_code: |
      # 3,000 training rows at 4% fraud, genuine rows kept at rate 0.3 —
      # deliberately NOT a balanced undersample — and 250 scores to correct.
      N = 3000
      y_full = (rng.random(N) < 0.04).astype(int)
      kept = (y_full == 1) | (rng.random(N) < 0.3)
      p_s = rng.random(250)
      inputs = (p_s, y_full, kept, 0.5)
    wrong:
      - hint: "beta is the keep rate of the genuine rows (kept genuine / all genuine), not the class ratio N+/N- of the full data. The two coincide only for an undersample that comes out exactly balanced."
        code: |
          def f(p_s, y_full, kept, tau_s):
              import numpy as np
              b = (y_full == 1).sum() / (y_full == 0).sum()
              return b * p_s / (b * p_s - p_s + 1), float(b * tau_s / ((b - 1) * tau_s + 1)), float(b)
      - hint: "beta is not the class ratio of the sample (frauds / genuine rows kept): it is the probability a genuine row survived, kept genuine / all genuine."
        code: |
          def f(p_s, y_full, kept, tau_s):
              import numpy as np
              b = (y_full[kept] == 1).sum() / (y_full[kept] == 0).sum()
              return b * p_s / (b * p_s - p_s + 1), float(b * tau_s / ((b - 1) * tau_s + 1)), float(b)
      - hint: "Multiplying by beta is not enough: the odds divide by beta, so p' = beta p_s / (beta p_s - p_s + 1), and the threshold maps the same way."
        code: |
          def f(p_s, y_full, kept, tau_s):
              import numpy as np
              g = y_full == 0
              b = kept[g].sum() / g.sum()
              return b * p_s, float(b * tau_s), float(b)
      - hint: "That is the forward map p_s = p / (p + beta (1 - p)), which inflates the scores further. The correction is its inverse, beta p_s / (beta p_s - p_s + 1)."
        code: |
          def f(p_s, y_full, kept, tau_s):
              import numpy as np
              g = y_full == 0
              b = kept[g].sum() / g.sum()
              fwd = lambda u: u / (u + b * (1 - u))
              return fwd(p_s), float(fwd(tau_s)), float(b)
  prequential-selection:
    kind: exact
    seed: 2707
    atol: 1.0e-6
    inputs_code: |
      # A 40-day stream of 60 rows a day over 120 cards, four features of
      # which the last is noise, about 10% fraud. The fit-callable is a
      # deterministic numpy discriminant on the first `config` features: the
      # checkpoint grades the protocol around the model, not the model.
      n = 40 * 60
      day = np.repeat(np.arange(40), 60)
      card = rng.integers(0, 120, n)
      X = rng.normal(size=(n, 4))
      logit = -2.6 + X @ np.array([1.2, -0.8, 0.5, 0.0])
      y = (rng.random(n) < 1 / (1 + np.exp(-logit))).astype(int)
      def fit_fn(m, X_train, y_train):
          Xm = X_train[:, :m]
          w = np.linalg.solve(np.cov(Xm.T).reshape(m, m) + 1e-3 * np.eye(m),
                              Xm[y_train == 1].mean(0) - Xm[y_train == 0].mean(0))
          return lambda X_new: X_new[:, :m] @ w
      # deployment trains from day 28; 3 folds of train 5 / delay 3 / valid 4; k = 3
      inputs = (fit_fn, [1, 2, 3, 4], X, y, day, card, 28, 3, 5, 3, 4, 3)
    wrong:

checkpoints:
  average-precision:
    kind: exact
    seed: 2101
    atol: 1.0e-9
    inputs_code: |
      # 2,000 rows, about 3% fraud, scores rounded to two decimals so that
      # ties between frauds and genuine rows are everywhere, as with a tree.
      n = 2000
      y = (rng.random(n) < 0.03).astype(int)
      scores = np.round(0.25 * y + 0.8 * rng.random(n), 2)
      inputs = (y, scores)
    wrong:
      - hint: "Joining the PR points by straight lines (the trapezoidal area) credits precisions no threshold reaches. AP is the area under the steps: each recall increment times the precision at that threshold."
        code: |
          def f(y, scores):
              import numpy as np
              order = np.argsort(-scores, kind="stable")
              ys, ss = y[order], scores[order]
              last = np.r_[ss[1:] != ss[:-1], True]
              tp = np.cumsum(ys)[last]
              prec = tp / (np.flatnonzero(last) + 1)
              rec = tp / ys.sum()
              r, p = np.r_[0.0, rec], np.r_[prec[0], prec]
              return float(np.sum(np.diff(r) * (p[1:] + p[:-1]) / 2))
      - hint: "Tied scores were split by sort order: the precision at each fraud's rank is right only without ties. A threshold is a distinct score value, so every row sharing a score enters the alert set together — take precision and recall at the last row of each tie group."
        code: |
          def f(y, scores):
              import numpy as np
              ys = y[np.argsort(-scores, kind="stable")]
              ranks = np.flatnonzero(ys == 1) + 1
              return float(np.mean(np.arange(1, len(ranks) + 1) / ranks))
      - hint: "That is the plain mean of the precisions at every threshold. Each precision must be weighted by the recall step R_n - R_{n-1}, which is zero at thresholds that add only genuine rows."
        code: |
          def f(y, scores):
              import numpy as np
              order = np.argsort(-scores, kind="stable")
              ys, ss = y[order], scores[order]
              last = np.r_[ss[1:] != ss[:-1], True]
              tp = np.cumsum(ys)[last]
              return float(np.mean(tp / (np.flatnonzero(last) + 1)))
  savings-metric:
    kind: exact
    seed: 2202
    atol: 1.0e-6
    inputs_code: |
      # 50 rows priced at C_a = 5 (flagging everything is the cheaper
      # trivial policy) and at C_a = 40 (passing everything is).
      n = 50
      y = (rng.random(n) < 0.25).astype(float)
      amount = np.round(np.where(y == 1, rng.uniform(5, 150, n), rng.uniform(1, 120, n)), 2)
      decisions = (amount * (0.5 * y + 0.3 * rng.random(n)) > 15).astype(float)
      inputs = (amount, y, decisions)
    wrong:
      - hint: "A caught fraud still costs the call: C_TP = C_a. The flag term is c_i * C_a for every flagged row, fraud or not."
        code: |
          def f(amount, y, decisions):
              import numpy as np
              out = []
              for ca in (5.0, 40.0):
                  cost = float(np.sum(y * (1 - decisions) * amount + (1 - y) * decisions * ca))
                  cl = float(min(np.sum(y * amount), len(amount) * ca))
                  out += [cost, cl, (cl - cost) / cl]
              return tuple(out)
      - hint: "The baseline is the CHEAPER of the two trivial policies, min(sum of fraud amounts, N * C_a). At a low alert cost flagging everything costs less than passing everything."
        code: |
          def f(amount, y, decisions):
              import numpy as np
              out = []
              for ca in (5.0, 40.0):
                  cost = float(np.sum(y * (1 - decisions) * amount + decisions * ca))
                  cl = float(np.sum(y * amount))
                  out += [cost, cl, (cl - cost) / cl]
              return tuple(out)
      - hint: "Cost_l is not the cost of flagging everything: it is min(sum of fraud amounts, N * C_a), and on card data the fraud total is usually the smaller."
        code: |
          def f(amount, y, decisions):
              import numpy as np
              out = []
              for ca in (5.0, 40.0):
                  cost = float(np.sum(y * (1 - decisions) * amount + decisions * ca))
                  cl = float(len(amount) * ca)
                  out += [cost, cl, (cl - cost) / cl]
              return tuple(out)
  prequential-split:
    kind: exact
    seed: 2303
    atol: 1.0e-9
    inputs_code: |
      # A 30-day mini-stream, rows sorted by day; 40% of the cards ever see
      # fraud. Folds: start 14, three of them, train 4 / delay 2 / test 4 —
      # a test block longer than delay + 1, so the known set grows inside it.
      n, n_cards = 600, 25
      day = np.sort(rng.integers(0, 30, n))
      card = rng.integers(0, n_cards, n)
      bad = rng.random(n_cards) < 0.4
      y = (bad[card] & (rng.random(n) < 0.3)).astype(int)
      inputs = (day, card, y, 14, 3, 4, 2, 4)
    wrong:
      - hint: "On test day T the bank knows only the frauds of days up to T - delta - 1; the last delta days are still being disputed. Using labels up to T - 1 removes cards the bank cannot have known about."
        code: |
          def f(day, card, y, start_train, n_folds, d_train, d_delay, d_test):
              import numpy as np
              out = []
              for i in range(n_folds):
                  s = start_train - i * d_test
                  out.append(np.flatnonzero((day >= s) & (day < s + d_train)))
                  t0 = s + d_train + d_delay
                  te = []
                  for T in range(t0, t0 + d_test):
                      known = np.unique(card[(y == 1) & (day >= s) & (day <= T - 1)])
                      te.append(np.flatnonzero((day == T) & ~np.isin(card, known)))
                  out.append(np.sort(np.concatenate(te)))
              return tuple(out)
      - hint: "Off by one day: on test day T the labels of day T - delta are still in transit. The known set counts frauds on days s .. T - delta - 1, not s .. T - delta."
        code: |

                      kn = np.unique(card[(y == 1) & (day >= s) & (day <= T - dd - 1)])
                      te.append(np.flatnonzero((day == T) & ~np.isin(card, kn)))
                  folds.append((tr, np.sort(np.concatenate(te))))
              return folds
          def f(fit_fn, configs, X, y, day, card, start_train_test, n_folds, d_train, d_delay, d_valid, k):
              folds = _split(day, card, y, start_train_test - d_valid, n_folds, d_train, d_delay, d_valid)
              sc = np.empty((3, len(configs), n_folds))
              for j, c in enumerate(configs):
                  for i, (tr, va) in enumerate(folds):
                      s = fit_fn(c, X[tr], y[tr])(X[va])
                      sc[:, j, i] = (_ap(y[va], s), roc_auc_score(y[va], s), _cp(day[va], card[va], y[va], s, k))
              m = sc.mean(axis=2)
              return m, sc.std(axis=2, ddof=1), m.argmax(axis=1)
      - hint: "np.std divides by n by default (ddof=0), the population formula. Over a handful of folds the spread is a sample estimate: pass ddof=1."
        code: |
          import numpy as np
          from sklearn.metrics import roc_auc_score
          def _ap(y, s):
              o = np.argsort(-s, kind="stable"); y, s = y[o], s[o]
              last = np.r_[s[1:] != s[:-1], True]
              tp = np.cumsum(y)[last]
              return float(np.sum(np.diff(np.r_[0.0, tp / y.sum()]) * tp / (np.flatnonzero(last) + 1)))
          def _cp(day, card, y, s, k):
              det = np.array([], dtype=card.dtype); out = []
              for d in np.unique(day):
                  r = (day == d) & ~np.isin(card, det)
                  c, inv = np.unique(card[r], return_inverse=True)
                  ts = np.full(len(c), -np.inf); np.maximum.at(ts, inv, s[r])
                  tl = np.zeros(len(c)); np.maximum.at(tl, inv, y[r])
                  top = np.lexsort((c, -ts))[:k]; hit = tl[top] == 1
                  out.append(hit.sum() / k); det = np.concatenate([det, c[top][hit]])
              return np.mean(out)
          def _split(day, card, y, st, nf, dtr, dd, dte):
              folds = []
              for i in range(nf):
                  s = st - i * dte
                  tr = np.flatnonzero((day >= s) & (day < s + dtr)); t0 = s + dtr + dd; te = []
                  for T in range(t0, t0 + dte):
                      kn = np.unique(card[(y == 1) & (day >= s) & (day <= T - dd - 1)])
                      te.append(np.flatnonzero((day == T) & ~np.isin(card, kn)))
                  folds.append((tr, np.sort(np.concatenate(te))))
              return folds
          def f(fit_fn, configs, X, y, day, card, start_train_test, n_folds, d_train, d_delay, d_valid, k):
              folds = _split(day, card, y, start_train_test - (d_delay + d_valid), n_folds, d_train, d_delay, d_valid)
              sc = np.empty((3, len(configs), n_folds))
              for j, c in enumerate(configs):
                  for i, (tr, va) in enumerate(folds):
                      s = fit_fn(c, X[tr], y[tr])(X[va])
                      sc[:, j, i] = (_ap(y[va], s), roc_auc_score(y[va], s), _cp(day[va], card[va], y[va], s, k))
              m = sc.mean(axis=2)
              return m, sc.std(axis=2), m.argmax(axis=1)
  why-auc-forgives-depth-fifty:
    kind: review
    rubric: |
      The question: on prequential folds, validation ROC-AUC scores the
      depth-50 (fully grown) decision tree level with the best depth and
      above depth 20, while average precision ranks it last. Why?

      Pass if the answer contains BOTH halves:
      (1) ROC-AUC side — the fully grown tree outputs (near-)binary scores,
      so its ROC curve has essentially one interior point and the area is
      set by that point (equivalently (1 + TPR - FPR)/2, or "the straight
      segment / trapezoid credits half of the tied pairs"); its point has a
      high recall at a small false-positive rate, so the area is competitive.
      Accept any correct statement that the area rewards the tied block /
      the region far beyond the alert budget rather than the top of the
      ranking.
      (2) AP side — AP weights precision at each fraud's rank (the top of
      the ranking), and the deep tree's top block has low precision and/or
      the frauds left in the tied low block are credited at near-prevalence
      precision; or equivalently AP reads the top of the ranking, where the
      deep tree is worst.

      Fail if the answer only says "overfitting", "the deep tree memorises
      the training week" or "AUC is misleading under imbalance" without
      the score-tie / ROC-geometry mechanism, or if it claims the deep
      tree's ranking is genuinely better at the top.

      - hint: "Removed cards known up to day d - delay. The labels of day d - delay arrive during day d, too late for that morning's scoring: a card is known on d if its fraud is on a day up to d - delay - 1."
        code: |
          import numpy as np
          def f(days, cards, labels, start, n_folds, dtr, ddel, dte):
              roles = np.zeros((n_folds, len(days)), dtype=np.int64)
              for j in range(n_folds):
                  s = start - j * dte

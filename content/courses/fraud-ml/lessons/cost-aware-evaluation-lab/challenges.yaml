  card-precision-top-k:
    kind: exact
    seed: 2404
    atol: 1.0e-9
    inputs_code: |
      counts = rng.poisson(1.5, (7, 60)).ravel()
      days = np.repeat(np.repeat(np.arange(7), 60), counts)
      cards = np.repeat(np.tile(np.arange(60), 7), counts)
      compromised = np.isin(cards, rng.choice(60, 14, replace=False))
      labels = (compromised & (rng.random(len(days)) < 0.5)).astype(np.int64)
      scores = rng.random(len(days)) + 0.6 * labels * rng.random(len(days))
      perm = rng.permutation(len(days))
      inputs = (days[perm], cards[perm], scores[perm], labels[perm], 4)
    wrong:
      - hint: "Ranked transactions, not cards. Collapse each day to one row per card (maximum score, maximum label) before taking the top k: a card with three alerts is one call."
        code: |
          import numpy as np
          def f(days, cards, scores, labels, k):
              out = []
              for d in np.unique(days):
                  m = days == d
                  top = np.argsort(-scores[m], kind="stable")[:k]
                  out.append(labels[m][top].sum() / k)
              return np.array(out)
      - hint: "Credited the same card on several days. A compromised card found in the top k is blocked: remove its payments from every later day before ranking."
        code: |
          import numpy as np
          import pandas as pd
          def f(days, cards, scores, labels, k):
              fr = pd.DataFrame({"day": days, "card": cards, "score": scores, "label": labels})
              out = []
              for _, t in fr.groupby("day", sort=True):
                  pc = t.groupby("card")[["score", "label"]].max().sort_values("score", ascending=False).head(k)
                  out.append((pc.label == 1).sum() / k)
              return np.array(out)
      - hint: "Removed every called card from later days. Only the compromised cards found are blocked; a genuine card that was called and cleared stays in the stream."
        code: |
          import numpy as np
          import pandas as pd
          def f(days, cards, scores, labels, k):
              fr = pd.DataFrame({"day": days, "card": cards, "score": scores, "label": labels})
              gone, out = set(), []
              for _, t in fr.groupby("day", sort=True):
                  t = t[~t.card.isin(gone)]
                  pc = t.groupby("card")[["score", "label"]].max().sort_values("score", ascending=False).head(k)
                  out.append((pc.label == 1).sum() / k)
                  gone.update(pc.index)
              return np.array(out)
      - hint: "Ranked cards by their mean score. A card's most suspicious payment decides whether it is called: collapse with the maximum score."
        code: |
          import numpy as np
          import pandas as pd
          def f(days, cards, scores, labels, k):
              fr = pd.DataFrame({"day": days, "card": cards, "score": scores, "label": labels})
              gone, out = set(), []
              for _, t in fr.groupby("day", sort=True):
                  t = t[~t.card.isin(gone)]
                  pc = t.groupby("card").agg(score=("score", "mean"), label=("label", "max"))
                  pc = pc.sort_values("score", ascending=False).head(k)
                  found = pc.index[pc.label == 1]
                  out.append(len(found) / k)
                  gone.update(found)
              return np.array(out)

  undersampling-correction:
    kind: exact
    seed: 2606
    atol: 1.0e-9
    inputs_code: |
      p_s = rng.random(50)
      inputs = (p_s, 0.5, 400, 49_600, 3_600)
    wrong:
      - hint: "Multiplied by beta without renormalising. The odds are multiplied by beta, not the probability: p' = beta p_s / (beta p_s - p_s + 1)."
        code: |
          import numpy as np
          def f(p_s, tau_s, n_fraud, n_gen, n_kept):
              b = n_kept / n_gen
              return b * np.asarray(p_s, float), float(b * tau_s)
      - hint: "Used the stream's class ratio as beta. Beta is the keep rate of genuine rows, kept / genuine in the stream; it equals the class ratio only when the training set was cut to exactly balanced."
        code: |
          import numpy as np
          def f(p_s, tau_s, n_fraud, n_gen, n_kept):
              b = n_fraud / n_gen
              g = lambda p: b * p / (b * p - p + 1)
              return g(np.asarray(p_s, float)), float(g(tau_s))
      - hint: "Used the training set's class ratio as beta. Beta is the share of the stream's genuine rows that were kept, kept / genuine in the stream."
        code: |
          import numpy as np
          def f(p_s, tau_s, n_fraud, n_gen, n_kept):
              b = n_fraud / n_kept
              g = lambda p: b * p / (b * p - p + 1)
              return g(np.asarray(p_s, float)), float(g(tau_s))

  bmr-threshold:
    kind: exact
    seed: 2505
    atol: 1.0e-9
    inputs_code: |
      n = 400
      amounts = np.round(rng.lognormal(3.5, 1.3, n), 2)
      # Scores of a model that kept 3,000 of 59,700 genuine rows (beta ~ 5%).
      p_s = rng.beta(0.6, 3, n)
      beta = 3_000 / 59_700
      labels = (rng.random(n) < beta * p_s / (beta * p_s - p_s + 1)).astype(np.int64)
      labels[:3] = 1
      inputs = (amounts, labels, p_s, 300, 59_700, 3_000, np.array([1.0, 5.0, 20.0]))
    wrong:
      - hint: "Decided on the raw undersampled scores. p_s overstates the fraud probability by up to 1 / beta, so the cost rule alerts far too often; correct p_s with undersampling_correction before comparing Amt * p with C_a."
        code: |
          import numpy as np
          def f(amounts, labels, p_s, n_fraud, n_gen, n_kept, c_a):
              a = np.asarray(amounts, float); y = np.asarray(labels, float)
              c_a = np.asarray(c_a, float)
              d = (c_a[:, None] <= a * np.asarray(p_s, float)).astype(np.int64)
              cost = np.array([np.sum(y * (1 - r) * a) + r.sum() * c for r, c in zip(d, c_a)])
              base = np.minimum(np.sum(y * a), len(a) * c_a)
              return d, (base - cost) / base
      - hint: "Alerted on a corrected probability of at least 0.5. The cost rule compares the expected loss Amt * p with the alert cost: alert iff C_a <= Amt * p, a threshold of C_a / Amt that differs for every payment."
        code: |
          import numpy as np
          def f(amounts, labels, p_s, n_fraud, n_gen, n_kept, c_a):
              a = np.asarray(amounts, float); y = np.asarray(labels, float)
              c_a = np.asarray(c_a, float); b = n_kept / n_gen; ps = np.asarray(p_s, float)
              p = b * ps / (b * ps - ps + 1)
              d = np.tile((p >= 0.5).astype(np.int64), (len(c_a), 1))
              cost = np.array([np.sum(y * (1 - r) * a) + r.sum() * c for r, c in zip(d, c_a)])
              base = np.minimum(np.sum(y * a), len(a) * c_a)
              return d, (base - cost) / base
      - hint: "The comparison is reversed. Alert when the expected loss of leaving the payment, Amt * p, is at least the alert cost: C_a <= Amt * p."
        code: |
          import numpy as np
          def f(amounts, labels, p_s, n_fraud, n_gen, n_kept, c_a):
              a = np.asarray(amounts, float); y = np.asarray(labels, float)
              c_a = np.asarray(c_a, float); b = n_kept / n_gen; ps = np.asarray(p_s, float)
              p = b * ps / (b * ps - ps + 1)
              d = (c_a[:, None] > a * p).astype(np.int64)
              cost = np.array([np.sum(y * (1 - r) * a) + r.sum() * c for r, c in zip(d, c_a)])
              base = np.minimum(np.sum(y * a), len(a) * c_a)
              return d, (base - cost) / base

  prequential-selection:
    kind: exact
    seed: 2707
    atol: 1.0e-6
    inputs_code: |
      counts = rng.poisson(0.6, (41, 150)).ravel()
      days = np.repeat(np.repeat(np.arange(41), 150), counts)
      cards = np.repeat(np.tile(np.arange(150), 41), counts)
      labels = np.zeros(len(days), dtype=np.int64)
      for d0 in range(41):
          for card in rng.choice(150, 2, replace=False):
              window = (cards == card) & (days >= d0) & (days < d0 + 6)
              labels[window & (rng.random(len(days)) < 0.5)] = 1
      # One feature, informative through its magnitude: frauds sit in both
      # tails. A candidate is a number of quantile bins of a histogram model.
      x = rng.normal(0, 1, len(days)) + labels * rng.choice([-2.5, 2.5], len(days))

      def fit_and_score(train_idx, n_bins):
          edges = np.quantile(x[train_idx], np.linspace(0, 1, n_bins + 1)[1:-1])
          b = np.searchsorted(edges, x[train_idx])
          rate = ((np.bincount(b, weights=labels[train_idx], minlength=n_bins) + 0.5)
                  / (np.bincount(b, minlength=n_bins) + 1.0))
          return rate[np.searchsorted(edges, x)] + 1e-6 * x

      inputs = (days, cards, labels, [1, 2, 4, 8, 32], fit_and_score, 30, 3, 5, 3, 4, 3)
    wrong:
      - hint: "Validated on the deployment geometry itself, the folds whose test blocks are the test weeks. The validation folds start delta_delay + delta_valid days before deploy_start, so the freshest fully labelled week validates and the test weeks stay untouched."

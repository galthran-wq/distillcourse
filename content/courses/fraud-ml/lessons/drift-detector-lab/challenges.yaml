  which-detector-for-fraud:
    kind: review
    rubric: |
      The question: which detector on a deployed fraud model, with labels a
      week late, and what its alarm can and cannot mean.
      Pass if the answer does all three:
      (1) it states the delay of the stream it chose: c + δ + MTD for slow
      labels, about a day plus MTD for fast-label CP@k or a label-free stream,
      and what that stream cannot see;
      (2) it deals with the daily swing of the number of compromised cards or
      the fraud share, by feeding a quantity normalised to the budget or the
      day (CP@k or a share of compromised cards missed, not the raw error
      rate), or by comparing the same weekdays;
      (3) it names a detector and gives a reason tied to this stream, and
      states a false-alarm rate or MTFA chosen and checked by simulation or
      replay on a stable stretch.
      "ADWIN because it has no parameters" alone fails: it has them (alpha,
      the check interval, the choice of cut), and on a short series the
      Hoeffding cut is nearly blind. Do not fail an answer for choosing a
      different detector than the model answer when its reason holds, or for
      wording or length.

      - hint: "One draw per item against the mixed probability. The distribution is right, but the checker needs the two draws of the contract: n uniforms for the concept, then n for the bit."
        code: |
          def f(n, p_a, p_b, position, width, seed):
              import numpy as np
              rng = np.random.default_rng(seed)
              mix = 1.0 / (1.0 + np.exp(-4.0 * (np.arange(n) - position) / width))
              return (rng.random(n) < (1 - mix) * p_a + mix * p_b).astype(np.int64), mix

<svg viewBox="0 0 620 204" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
<style>
.label { fill: currentColor; }
.bold { fill: currentColor; font-weight: 600; }
.muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
.small { fill: currentColor; font-size: 11px; }
.axis { stroke: currentColor; stroke-width: 1; fill: none; }
.guide { stroke: currentColor; stroke-dasharray: 3 3; opacity: 0.5; fill: none; }
.cell { stroke: currentColor; stroke-opacity: 0.35; fill: none; }
</style>
<rect x="14.0" y="26.0" width="84.0" height="36.0" rx="2" fill="#4c8dd6" fill-opacity="0.22"/>
<text x="56.0" y="50.0" text-anchor="middle" class="bold">RF</text>
<rect x="106.0" y="26.0" width="96.0" height="36.0" rx="2" fill="#4c8dd6" fill-opacity="0.22"/>
<text x="154.0" y="50.0" text-anchor="middle" class="bold">Under</text>
<rect x="210.0" y="26.0" width="96.0" height="36.0" rx="2" fill="#4c8dd6" fill-opacity="0.22"/>
<text x="258.0" y="50.0" text-anchor="middle" class="bold">Daily</text>
<rect x="314.0" y="26.0" width="96.0" height="36.0" rx="2" fill="#4c8dd6" fill-opacity="0.22"/>
<text x="362.0" y="50.0" text-anchor="middle" class="bold">5M</text>
<rect x="418.0" y="26.0" width="96.0" height="36.0" rx="2" fill="#e2903a" fill-opacity="0.22"/>
<text x="466.0" y="50.0" text-anchor="middle" class="bold">Update</text>
<rect x="522.0" y="26.0" width="96.0" height="36.0" rx="2" fill="#4c8dd6" fill-opacity="0.22"/>
<text x="570.0" y="50.0" text-anchor="middle" class="bold">90K</text>
<text x="14.0" y="16.0" text-anchor="start" class="muted">One row of every chart below:</text>
<text x="14.0" y="88.0" text-anchor="start" class="bold">RF</text>
<text x="82.0" y="88.0" text-anchor="start" class="small">the learner: random forest, neural network or SVM</text>
<text x="14.0" y="108.0" text-anchor="start" class="bold">Under</text>
<text x="82.0" y="108.0" text-anchor="start" class="small">the balancer applied to each training set: Under, SMOTE or EasyEnsemble</text>
<text x="14.0" y="128.0" text-anchor="start" class="bold">Daily</text>
<text x="82.0" y="128.0" text-anchor="start" class="small">how often a new model is built: Daily, Weekly, 15days, or One (never again)</text>
<text x="14.0" y="148.0" text-anchor="start" class="bold">5M</text>
<text x="82.0" y="148.0" text-anchor="start" class="small">how many of the newest models vote: M</text>
<text x="14.0" y="168.0" text-anchor="start" class="bold">Update</text>
<text x="82.0" y="168.0" text-anchor="start" class="small">what the training set is: Static, Update or Forget</text>
<text x="14.0" y="188.0" text-anchor="start" class="bold">90K</text>
<text x="82.0" y="188.0" text-anchor="start" class="small">how many days it reaches back: K, or K_gen of genuine payments under Forget</text>
</svg>

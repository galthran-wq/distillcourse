<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .bold { fill: currentColor; font-weight: 600; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .cell { fill: currentColor; fill-opacity: 0.05; stroke: currentColor; stroke-opacity: 0.35; }
  </style>

  <!-- left panel: fixed miss cost -->
  <text class="bold" x="180" y="24" text-anchor="middle">a miss costs the same for every fraud</text>
  <text class="muted" x="125" y="50" text-anchor="middle">alert</text>
  <text class="muted" x="235" y="50" text-anchor="middle">no alert</text>
  <text class="muted" x="63" y="88" text-anchor="end">fraud</text>
  <text class="muted" x="63" y="158" text-anchor="end">genuine</text>
  <rect class="cell" x="70" y="58" width="110" height="60" rx="4"/>
  <rect class="cell" x="180" y="58" width="110" height="60" rx="4" style="fill:#4c8dd6;fill-opacity:0.18"/>
  <rect class="cell" x="70" y="128" width="110" height="60" rx="4"/>
  <rect class="cell" x="180" y="128" width="110" height="60" rx="4" style="fill:#4c8dd6;fill-opacity:0.18"/>
  <text class="label" x="125" y="86" text-anchor="middle">c_TP = Cₐ</text>
  <text class="muted" x="125" y="104" text-anchor="middle">the call</text>
  <text x="235" y="86" text-anchor="middle" font-weight="600" fill="#e2903a">c_FN = c</text>
  <text class="muted" x="235" y="104" text-anchor="middle">one fixed price</text>
  <text class="label" x="125" y="156" text-anchor="middle">c_FP = Cₐ</text>
  <text class="muted" x="125" y="174" text-anchor="middle">the call</text>
  <text class="label" x="235" y="156" text-anchor="middle">c_TN = 0</text>

  <!-- right panel: amount-dependent miss cost -->
  <text class="bold" x="510" y="24" text-anchor="middle">a miss costs its amount</text>
  <text class="muted" x="455" y="50" text-anchor="middle">alert</text>
  <text class="muted" x="565" y="50" text-anchor="middle">no alert</text>
  <text class="muted" x="393" y="88" text-anchor="end">fraud</text>
  <text class="muted" x="393" y="158" text-anchor="end">genuine</text>
  <rect class="cell" x="400" y="58" width="110" height="60" rx="4"/>
  <rect class="cell" x="510" y="58" width="110" height="60" rx="4" style="fill:#4c8dd6;fill-opacity:0.18"/>
  <rect class="cell" x="400" y="128" width="110" height="60" rx="4"/>
  <rect class="cell" x="510" y="128" width="110" height="60" rx="4" style="fill:#4c8dd6;fill-opacity:0.18"/>
  <text class="label" x="455" y="86" text-anchor="middle">c_TP = Cₐ</text>
  <text class="muted" x="455" y="104" text-anchor="middle">the call</text>
  <text x="565" y="86" text-anchor="middle" font-weight="600" font-size="12" fill="#e2903a">c_FN = amount</text>
  <text class="muted" x="565" y="104" text-anchor="middle">set per payment</text>
  <text class="label" x="455" y="156" text-anchor="middle">c_FP = Cₐ</text>
  <text class="muted" x="455" y="174" text-anchor="middle">the call</text>
  <text class="label" x="565" y="156" text-anchor="middle">c_TN = 0</text>

  <!-- do-nothing bracket -->
  <path d="M180,198 L180,206 L290,206 L290,198" fill="none" stroke="#4c8dd6" stroke-width="1.4"/>
  <path d="M510,198 L510,206 L620,206 L620,198" fill="none" stroke="#4c8dd6" stroke-width="1.4"/>
  <text x="320" y="236" text-anchor="middle" fill="#4c8dd6">doing nothing lives in the blue column: it pays c_FN on every fraud and nothing else</text>
  <text class="muted" x="320" y="262" text-anchor="middle">rows: what the payment really was · columns: what the bank decided</text>
  <text class="muted" x="320" y="280" text-anchor="middle">only the amber cell differs between the two conventions</text>
</svg>

  <g opacity="1"><rect x="255" y="206" width="96" height="44" rx="5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-opacity="0.6"/><text class="label" x="303" y="225" text-anchor="middle">nominee</text><text class="muted" x="303" y="241" text-anchor="middle">bank C</text></g>
  <g opacity="1"><rect x="400" y="128" width="96" height="44" rx="5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-opacity="0.6"/><text class="label" x="448" y="147" text-anchor="middle">shell co. X</text><text class="muted" x="448" y="163" text-anchor="middle">bank D</text></g>

<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .bold { fill: currentColor; font-weight: 600; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .guide { stroke: currentColor; stroke-dasharray: 3 3; opacity: 0.5; fill: none; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor" opacity="0.6"/>
    </marker>
  </defs>
  <!-- baseline y=230; scale 180px per 26,000 -> 25,000 = 173, 10,000 = 69, 4,900 = 34 -->
  <text class="bold" x="40" y="24">one deposit</text>
  <text class="bold" x="250" y="24">the same money split across five mule accounts</text>

  <!-- threshold line -->
  <line x1="20" y1="161" x2="620" y2="161" stroke="#e2903a" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="620" y="153" text-anchor="end" fill="#e2903a" font-size="12" font-weight="600">reporting threshold: $10,000</text>

  <!-- baseline -->
  <line x1="20" y1="230" x2="620" y2="230" stroke="currentColor" stroke-width="1" opacity="0.6"/>

  <!-- left: one deposit -->
  <rect x="60" y="57" width="70" height="173" rx="3" fill="#4c8dd6" fill-opacity="0.3" stroke="#4c8dd6" stroke-width="1.2"/>
  <text class="label" x="95" y="50" text-anchor="middle">$25,000</text>
  <text class="label" x="95" y="248" text-anchor="middle">one account</text>
  <text x="95" y="266" text-anchor="middle" fill="#e2903a" font-weight="600">reported</text>

  <line x1="200" y1="40" x2="200" y2="290" class="guide"/>

  <!-- right: five deposits -->
  <g>
    <rect x="240" y="196" width="50" height="34" rx="3" fill="#4c8dd6" fill-opacity="0.3" stroke="#4c8dd6" stroke-width="1.2"/>
    <rect x="315" y="196" width="50" height="34" rx="3" fill="#4c8dd6" fill-opacity="0.3" stroke="#4c8dd6" stroke-width="1.2"/>
    <rect x="390" y="196" width="50" height="34" rx="3" fill="#4c8dd6" fill-opacity="0.3" stroke="#4c8dd6" stroke-width="1.2"/>
    <rect x="465" y="196" width="50" height="34" rx="3" fill="#4c8dd6" fill-opacity="0.3" stroke="#4c8dd6" stroke-width="1.2"/>
    <rect x="540" y="196" width="50" height="34" rx="3" fill="#4c8dd6" fill-opacity="0.3" stroke="#4c8dd6" stroke-width="1.2"/>
  </g>
  <g class="label" text-anchor="middle" font-size="12">
    <text x="265" y="189">$4,900</text>
    <text x="340" y="189">$4,900</text>
    <text x="415" y="189">$4,900</text>
    <text x="490" y="189">$4,900</text>
    <text x="565" y="189">$4,900</text>
    <text x="265" y="248">mule 1</text>
    <text x="340" y="248">mule 2</text>
    <text x="415" y="248">mule 3</text>
    <text x="490" y="248">mule 4</text>
    <text x="565" y="248">mule 5</text>
  </g>
  <text class="muted" x="415" y="266" text-anchor="middle">each at a different bank; each deposit alone is unremarkable</text>

  <!-- converging arrows to destination -->
  <g stroke="currentColor" stroke-width="1.1" opacity="0.6" fill="none" marker-end="url(#arr)">
    <path d="M265,272 L405,300"/>
    <path d="M340,272 L408,300"/>
    <path d="M415,272 L415,300"/>
    <path d="M490,272 L422,300"/>
    <path d="M565,272 L425,300"/>
  </g>
  <text class="bold" x="415" y="320" text-anchor="middle">one destination: $24,500, no report filed</text>
</svg>

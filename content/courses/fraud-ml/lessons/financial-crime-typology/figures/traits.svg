<text x="262" y="259" font-family="system-ui, sans-serif" font-size="12" text-anchor="start" fill="currentColor">relational structure: signal in neighbours</text>
<line x1="512" y1="254" x2="526" y2="254" stroke="currentColor" stroke-width="0.8" opacity="0.5"/>
<text x="620" y="259" font-family="system-ui, sans-serif" font-size="11" text-anchor="end" fill="currentColor" opacity="0.7">module 6</text>
<line x1="20" y1="290" x2="620" y2="290" stroke="currentColor" stroke-width="0.6" opacity="0.3" stroke-dasharray="3 3"/>
<text x="30" y="312" font-family="system-ui, sans-serif" font-size="12" text-anchor="start" fill="currentColor" font-weight="600" opacity="0.55">appears in many forms</text>
<text x="262" y="312" font-family="system-ui, sans-serif" font-size="12" text-anchor="start" fill="currentColor" opacity="0.55">no single unit, label or model</text>
<text x="620" y="312" font-family="system-ui, sans-serif" font-size="11" text-anchor="end" fill="currentColor" opacity="0.55">this lesson’s table</text>

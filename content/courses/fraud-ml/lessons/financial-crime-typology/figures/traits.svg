<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .bold { fill: currentColor; font-weight: 600; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor" opacity="0.6"/>
    </marker>
  </defs>
  <text class="muted" x="20" y="22">trait of the crime</text>
  <text class="muted" x="210" y="22">what it hands the detector</text>

  <!-- row 1 -->
  <rect x="20" y="36" width="150" height="40" rx="5" fill="#4c8dd6" fill-opacity="0.15" stroke="#4c8dd6" stroke-width="1.2"/>
  <text class="bold" x="95" y="61" text-anchor="middle">uncommon</text>
  <line x1="172" y1="56" x2="206" y2="56" stroke="currentColor" stroke-width="1.2" opacity="0.6" marker-end="url(#arr)"/>
  <text class="label" x="212" y="52">few positives, fewer still known as such</text>
  <text class="muted" x="212" y="68">too few labelled examples to learn from</text>

  <!-- row 2 -->
  <rect x="20" y="88" width="150" height="40" rx="5" fill="#4c8dd6" fill-opacity="0.15" stroke="#4c8dd6" stroke-width="1.2"/>
  <text class="bold" x="95" y="113" text-anchor="middle">well considered</text>
  <line x1="172" y1="108" x2="206" y2="108" stroke="currentColor" stroke-width="1.2" opacity="0.6" marker-end="url(#arr)"/>
  <text class="label" x="212" y="104">planned to pass the checks it knows about</text>
  <text class="muted" x="212" y="120">a method is used until it is caught, then replaced</text>

  <!-- row 3 -->
  <rect x="20" y="140" width="150" height="40" rx="5" fill="#4c8dd6" fill-opacity="0.15" stroke="#4c8dd6" stroke-width="1.2"/>
  <text class="bold" x="95" y="165" text-anchor="middle">concealed</text>
  <line x1="172" y1="160" x2="206" y2="160" stroke="currentColor" stroke-width="1.2" opacity="0.6" marker-end="url(#arr)"/>
  <text class="label" x="212" y="156">fraudulent and genuine records overlap</text>
  <text class="muted" x="212" y="172">no single field separates them</text>

  <!-- row 4 -->
  <rect x="20" y="192" width="150" height="40" rx="5" fill="#4c8dd6" fill-opacity="0.15" stroke="#4c8dd6" stroke-width="1.2"/>
  <text class="bold" x="95" y="217" text-anchor="middle">time-evolving</text>
  <line x1="172" y1="212" x2="206" y2="212" stroke="currentColor" stroke-width="1.2" opacity="0.6" marker-end="url(#arr)"/>
  <text class="label" x="212" y="208">what was learned last month stops matching</text>
  <text class="muted" x="212" y="224">the training data describe a crime that has moved on</text>

  <!-- row 5 -->
  <rect x="20" y="244" width="150" height="40" rx="5" fill="#4c8dd6" fill-opacity="0.15" stroke="#4c8dd6" stroke-width="1.2"/>
  <text class="bold" x="95" y="269" text-anchor="middle">organised</text>
  <line x1="172" y1="264" x2="206" y2="264" stroke="currentColor" stroke-width="1.2" opacity="0.6" marker-end="url(#arr)"/>
  <text class="label" x="212" y="260">several people and accounts act together</text>
  <text class="muted" x="212" y="276">the evidence sits in links, not in one record</text>

  <!-- what the imbalance playbook covers -->
  <path d="M552,38 L560,38 L560,74 L552,74" fill="none" stroke="#e2903a" stroke-width="1.6"/>
  <text x="568" y="52" fill="#e2903a" font-weight="600" font-size="12">imbalance</text>
  <text x="568" y="67" fill="#e2903a" font-weight="600" font-size="12">playbook</text>
  <path d="M552,90 L560,90 L560,282 L552,282" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.5"/>
  <text class="muted" x="568" y="180">not</text>
  <text class="muted" x="568" y="195">addressed</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2903a"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4c8dd6"/></marker></defs>
<text x="20" y="24" font-family="system-ui, sans-serif" font-size="13" text-anchor="start" fill="currentColor" font-weight="600">Five traits of fraud, and the difficulty each hands the detector</text>
<text x="20" y="50" font-family="system-ui, sans-serif" font-size="11" text-anchor="start" fill="currentColor" opacity="0.55">trait</text>
<text x="250" y="50" font-family="system-ui, sans-serif" font-size="11" text-anchor="start" fill="currentColor" opacity="0.55">difficulty for the learner</text>
<text x="620" y="50" font-family="system-ui, sans-serif" font-size="11" text-anchor="end" fill="currentColor" opacity="0.55">treated in</text>
<rect x="20" y="66" width="180" height="24" rx="4" stroke="currentColor" fill="none" stroke-width="1" fill-opacity="0"/>
<text x="30" y="83" font-family="system-ui, sans-serif" font-size="12" text-anchor="start" fill="currentColor" font-weight="600">uncommon</text>
<line x1="200" y1="78" x2="248" y2="78" stroke="currentColor" stroke-width="0.8" opacity="0.5"/>
<rect x="20" y="114" width="180" height="24" rx="4" stroke="currentColor" fill="none" stroke-width="1" fill-opacity="0"/>
<text x="30" y="131" font-family="system-ui, sans-serif" font-size="12" text-anchor="start" fill="currentColor" font-weight="600">well considered</text>
<line x1="200" y1="126" x2="248" y2="142" stroke="currentColor" stroke-width="0.8" opacity="0.5"/>
<rect x="20" y="146" width="180" height="24" rx="4" stroke="currentColor" fill="none" stroke-width="1" fill-opacity="0"/>
<text x="30" y="163" font-family="system-ui, sans-serif" font-size="12" text-anchor="start" fill="currentColor" font-weight="600">imperceptibly concealed</text>
<line x1="200" y1="158" x2="248" y2="142" stroke="currentColor" stroke-width="0.8" opacity="0.5"/>
<rect x="20" y="194" width="180" height="24" rx="4" stroke="currentColor" fill="none" stroke-width="1" fill-opacity="0"/>
<text x="30" y="211" font-family="system-ui, sans-serif" font-size="12" text-anchor="start" fill="currentColor" font-weight="600">time-evolving</text>
<line x1="200" y1="206" x2="248" y2="206" stroke="currentColor" stroke-width="0.8" opacity="0.5"/>
<rect x="20" y="242" width="180" height="24" rx="4" stroke="currentColor" fill="none" stroke-width="1" fill-opacity="0"/>
<text x="30" y="259" font-family="system-ui, sans-serif" font-size="12" text-anchor="start" fill="currentColor" font-weight="600">carefully organised</text>
<line x1="200" y1="254" x2="248" y2="254" stroke="currentColor" stroke-width="0.8" opacity="0.5"/>
<rect x="250" y="64" width="262" height="28" rx="5" stroke="#e2903a" fill="#e2903a" stroke-width="1.4" fill-opacity="0.10"/>
<text x="262" y="83" font-family="system-ui, sans-serif" font-size="12" text-anchor="start" fill="currentColor">scarce positives, scarcer labels</text>
<line x1="512" y1="78" x2="526" y2="78" stroke="currentColor" stroke-width="0.8" opacity="0.5"/>
<text x="620" y="83" font-family="system-ui, sans-serif" font-size="11" text-anchor="end" fill="currentColor" opacity="0.7">modules 1–2, 5</text>
<rect x="250" y="128" width="262" height="28" rx="5" stroke="#e2903a" fill="#e2903a" stroke-width="1.4" fill-opacity="0.10"/>
<text x="262" y="147" font-family="system-ui, sans-serif" font-size="12" text-anchor="start" fill="currentColor">camouflage: fraud overlaps normal</text>
<line x1="512" y1="142" x2="526" y2="142" stroke="currentColor" stroke-width="0.8" opacity="0.5"/>
<text x="620" y="147" font-family="system-ui, sans-serif" font-size="11" text-anchor="end" fill="currentColor" opacity="0.7">modules 3, 8</text>
<rect x="250" y="192" width="262" height="28" rx="5" stroke="#e2903a" fill="#e2903a" stroke-width="1.4" fill-opacity="0.10"/>
<text x="262" y="211" font-family="system-ui, sans-serif" font-size="12" text-anchor="start" fill="currentColor">drift: last month’s pattern is stale</text>
<line x1="512" y1="206" x2="526" y2="206" stroke="currentColor" stroke-width="0.8" opacity="0.5"/>
<text x="620" y="211" font-family="system-ui, sans-serif" font-size="11" text-anchor="end" fill="currentColor" opacity="0.7">module 7</text>

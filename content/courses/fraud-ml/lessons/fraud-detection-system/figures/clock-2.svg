<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .title { fill: currentColor; font-weight: 600; font-size: 13px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .axis { stroke: currentColor; stroke-width: 1.2; fill: none; }
    .guide { stroke: currentColor; stroke-dasharray: 3 3; opacity: 0.5; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <!-- time axis, identical in every frame -->
  <line class="axis" x1="20" y1="246" x2="624" y2="246" marker-end="url(#arr)"/>
  <text class="muted" x="20" y="286">time since the payment arrived (not to scale)</text>
  <line class="axis" x1="20" y1="241" x2="20" y2="251"/>
  <text class="muted" x="20" y="264" text-anchor="start">0</text>
  <line class="axis" x1="155" y1="241" x2="155" y2="251"/>
  <text class="muted" x="155" y="264" text-anchor="middle">~10 ms</text>
  <line class="axis" x1="320" y1="241" x2="320" y2="251"/>
  <text class="muted" x="320" y="264" text-anchor="middle">~1 s</text>
  <line class="axis" x1="478" y1="241" x2="478" y2="251"/>
  <text class="muted" x="478" y="264" text-anchor="middle">1 day</text>
  <text class="muted" x="610" y="264" text-anchor="end">weeks</text>
  <!-- the authorisation answer -->
  <line class="guide" x1="160" y1="30" x2="160" y2="240"/>
  <text class="label" x="160" y="22" text-anchor="middle" font-weight="600">answer sent: accept / deny</text>
  <g>
    <rect x="24" y="44" width="128" height="186" rx="5" fill="#4c8dd6" fill-opacity="0.14" stroke="#4c8dd6" stroke-width="1.5" stroke-opacity="0.9"/>
    <text class="title" x="88.0" y="64" text-anchor="middle">milliseconds</text>
    <text class="label" x="88.0" y="88" text-anchor="middle">terminal checks:</text>
    <text class="label" x="88.0" y="105" text-anchor="middle">PIN, card status,</text>
    <text class="label" x="88.0" y="122" text-anchor="middle">balance, limit</text>
    <text class="label" x="88.0" y="156" text-anchor="middle">blocking rules</text>
    <line x1="36" y1="198" x2="140" y2="198" stroke="#4c8dd6" stroke-width="1" opacity="0.6"/>
    <text class="label" x="88.0" y="217" text-anchor="middle" font-weight="600">→ deny payment</text>
  </g>
  <g>
    <rect x="168" y="44" width="148" height="186" rx="5" fill="#e2903a" fill-opacity="0.14" stroke="#e2903a" stroke-width="1.5" stroke-opacity="0.9"/>
    <text class="title" x="242.0" y="64" text-anchor="middle">under a second</text>
    <text class="label" x="242.0" y="88" text-anchor="middle">history features</text>
    <text class="label" x="242.0" y="105" text-anchor="middle">model score</text>
    <text class="label" x="242.0" y="156" text-anchor="middle">on the accepted</text>
    <text class="label" x="242.0" y="173" text-anchor="middle">payment</text>
    <line x1="180" y1="198" x2="304" y2="198" stroke="#e2903a" stroke-width="1" opacity="0.6"/>
    <text class="label" x="242.0" y="217" text-anchor="middle" font-weight="600">→ alert, block card</text>
  </g>
</svg>

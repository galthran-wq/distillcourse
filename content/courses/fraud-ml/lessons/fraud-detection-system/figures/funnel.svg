<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .bold { fill: currentColor; font-weight: 600; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .guide { stroke: currentColor; stroke-dasharray: 3 3; opacity: 0.5; fill: none; }
  </style>
  <defs>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="currentColor" stroke-width="1.5" opacity="0.35"/>
    </pattern>
  </defs>

  <!-- row 1: the day's payments -->
  <text class="bold" x="20" y="28">400,000 payments a day</text>
  <rect x="20" y="38" width="600" height="26" rx="3" fill="#4c8dd6" fill-opacity="0.22" stroke="#4c8dd6" stroke-width="1.2"/>
  <rect x="617" y="38" width="3" height="26" fill="#e2903a"/>
  <text class="label" x="612" y="56" text-anchor="end">1,000 fraud: 0.25%, the amber sliver →</text>

  <!-- zoom into the sliver -->
  <path class="guide" d="M617,64 L20,104 M620,64 L620,104"/>

  <!-- row 2: the frauds -->
  <text class="muted" x="612" y="97" text-anchor="end">zoom ×400</text>
  <rect x="20" y="104" width="600" height="26" rx="3" fill="#e2903a" fill-opacity="0.35" stroke="#e2903a" stroke-width="1.2"/>
  <text class="label" x="320" y="122" text-anchor="middle">1,000 fraudulent payments, about 3 on each compromised card</text>

  <!-- regroup by card -->
  <path class="guide" d="M20,130 L20,176 M620,130 L620,176"/>
  <text class="muted" x="320" y="158" text-anchor="middle">grouped by card</text>

  <!-- row 3: the compromised cards -->
  <text class="bold" x="20" y="170">about 300 compromised cards</text>
  <rect x="20" y="176" width="200" height="30" rx="3" fill="#e2903a" stroke="#e2903a" stroke-width="1.2"/>
  <rect x="220" y="176" width="400" height="30" rx="3" fill="url(#hatch)" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.2"/>
  <text x="120" y="196" text-anchor="middle" font-weight="600" fill="#ffffff">100 called</text>
  <text class="label" x="420" y="196" text-anchor="middle">200 nobody calls today</text>

  <!-- capacity bracket -->
  <path d="M20,216 L20,224 L220,224 L220,216" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text class="label" x="20" y="244">the team's capacity: k ≈ 100 cards a day</text>
  <text class="muted" x="20" y="264">a perfect ranking fills all 100 calls with fraud cards</text>
  <text class="muted" x="20" y="282">and still leaves two-thirds of the compromised cards unvisited</text>
</svg>

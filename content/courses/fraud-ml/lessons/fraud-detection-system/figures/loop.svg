<svg viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .bold { fill: currentColor; font-weight: 600; font-size: 14px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .node { fill: currentColor; fill-opacity: 0.05; stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.3; }
    .flow { stroke: currentColor; stroke-width: 1.5; fill: none; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
    <marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e2903a"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4c8dd6"/>
    </marker>
  </defs>

  <!-- the day's payments enter the model -->
  <text class="muted" x="12" y="146">the day's</text>
  <text class="muted" x="12" y="161">payments</text>
  <line class="flow" x1="12" y1="172" x2="74" y2="172" marker-end="url(#a)"/>

  <!-- nodes -->
  <rect class="node" x="78" y="146" width="130" height="54" rx="6"/>
  <text class="bold" x="143" y="168" text-anchor="middle">model</text>
  <text class="muted" x="143" y="186" text-anchor="middle">ranks the cards</text>

  <rect class="node" x="255" y="30" width="130" height="54" rx="6"/>
  <text class="bold" x="320" y="52" text-anchor="middle">alerts</text>
  <text class="muted" x="320" y="70" text-anchor="middle">top k ≈ 100 cards</text>

  <rect class="node" x="432" y="146" width="150" height="54" rx="6"/>
  <text class="bold" x="507" y="168" text-anchor="middle">investigators</text>
  <text class="muted" x="507" y="186" text-anchor="middle">phone the cardholders</text>

  <rect class="node" x="255" y="262" width="130" height="54" rx="6"/>
  <text class="bold" x="320" y="284" text-anchor="middle">training set</text>
  <text class="muted" x="320" y="302" text-anchor="middle">all labels so far</text>

  <!-- model -> alerts -->
  <path class="flow" d="M160,146 L262,86" marker-end="url(#a)"/>
  <text class="label" x="200" y="108" text-anchor="end">cut at k</text>

  <!-- alerts -> investigators: the selection -->
  <path d="M385,70 L470,144" stroke="#e2903a" stroke-width="3" fill="none" marker-end="url(#am)"/>
  <text x="430" y="92" fill="#e2903a" font-weight="600">labels only</text>
  <text x="430" y="108" fill="#e2903a" font-weight="600">what was alerted</text>

  <!-- investigators -> training set -->
  <path class="flow" d="M490,200 L385,282" marker-end="url(#a)"/>
  <text class="label" x="450" y="250">feedbacks Fₜ,</text>
  <text class="label" x="450" y="266">the same day</text>

  <!-- training set -> model -->
  <path class="flow" d="M262,282 L165,202" marker-end="url(#a)"/>
  <text class="label" x="190" y="262" text-anchor="end">retrain at</text>
  <text class="label" x="190" y="278" text-anchor="end">end of day</text>

  <!-- the slow channel -->
  <rect x="432" y="300" width="196" height="64" rx="6" fill="#4c8dd6" fill-opacity="0.12" stroke="#4c8dd6" stroke-width="1.3"/>
  <text class="label" x="530" y="320" text-anchor="middle">every payment of day t − δ</text>
  <text class="label" x="530" y="337" text-anchor="middle">disputed = fraud,</text>
  <text class="label" x="530" y="354" text-anchor="middle">silence = genuine</text>
  <line x1="432" y1="318" x2="389" y2="304" stroke="#4c8dd6" stroke-width="1.5" marker-end="url(#ab)"/>
  <text class="muted" x="320" y="340" text-anchor="middle">delayed samples,</text>
  <text class="muted" x="320" y="355" text-anchor="middle">δ days late</text>
</svg>

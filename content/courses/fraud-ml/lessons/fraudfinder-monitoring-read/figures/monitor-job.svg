<svg viewBox="0 0 660 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .bold { fill: currentColor; font-weight: 600; }
    .muted { fill: currentColor; opacity: 0.55; }
    .axis { stroke: currentColor; stroke-width: 1; fill: none; }
    .guide { stroke: currentColor; stroke-dasharray: 3 3; opacity: 0.5; fill: none; }
    .box { fill: none; stroke: currentColor; stroke-width: 1; }
    .flow { stroke: currentColor; stroke-width: 1.2; fill: none; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
<rect x="10" y="20" width="150" height="56" rx="5" class="box"/>
<text class="bold" x="85.0" y="38.0" text-anchor="middle" font-size="11.5">training table</text>
<text class="muted" x="85.0" y="52.0" text-anchor="middle" font-size="10.5">yesterday's payments</text>
<text class="muted" x="85.0" y="66.0" text-anchor="middle" font-size="10.5">histogram per feature</text>
<rect x="10" y="130" width="150" height="56" rx="5" class="box"/>
<text class="bold" x="85.0" y="148.0" text-anchor="middle" font-size="11.5">endpoint requests</text>
<text class="muted" x="85.0" y="162.0" text-anchor="middle" font-size="10.5">each payment's 25 inputs</text>
<text class="muted" x="85.0" y="176.0" text-anchor="middle" font-size="10.5">and its score</text>
<rect x="195" y="130" width="130" height="56" rx="5" class="box"/>
<text class="bold" x="260.0" y="148.0" text-anchor="middle" font-size="11.5">random half</text>
<text class="muted" x="260.0" y="162.0" text-anchor="middle" font-size="10.5">sample rate 0.5</text>
<text class="muted" x="260.0" y="176.0" text-anchor="middle" font-size="10.5">logged to a table</text>
<rect x="360" y="60" width="140" height="70" rx="5" fill="#4c8dd6" fill-opacity="0.12" stroke="#4c8dd6"/>
<text class="bold" x="430.0" y="78.0" text-anchor="middle" font-size="11.5">skew, hourly</text>
<text class="muted" x="430.0" y="92.0" text-anchor="middle" font-size="10.5">this hour vs training</text>
<text class="label" x="430.0" y="106.0" text-anchor="middle" font-size="10.5">distance &gt; 0.5 ?</text>
<rect x="360" y="150" width="140" height="70" rx="5" fill="#4c8dd6" fill-opacity="0.12" stroke="#4c8dd6"/>
<text class="bold" x="430.0" y="168.0" text-anchor="middle" font-size="11.5">drift, hourly</text>
<text class="muted" x="430.0" y="182.0" text-anchor="middle" font-size="10.5">this hour vs earlier</text>
<text class="label" x="430.0" y="196.0" text-anchor="middle" font-size="10.5">serving, &gt; 0.05 ?</text>
<rect x="535" y="105" width="115" height="56" rx="5" class="box"/>
<text class="bold" x="592.5" y="123.0" text-anchor="middle" font-size="11.5">email</text>
<text class="muted" x="592.5" y="137.0" text-anchor="middle" font-size="10.5">names the feature</text>
<rect x="195" y="240" width="305" height="62" rx="5" class="guide" style="opacity:0.8"/>
<text class="bold" x="347.5" y="258.0" text-anchor="middle" font-size="11.5">labels: none joined</text>
<text class="muted" x="347.5" y="272.0" text-anchor="middle" font-size="10.5">no ranking backtest, no calibration pools,</text>
<text class="muted" x="347.5" y="286.0" text-anchor="middle" font-size="10.5">no index on the frauds</text>
<line class="flow" x1="160" y1="158" x2="195" y2="158" marker-end="url(#arr)"/>
<line class="flow" x1="325" y1="150" x2="360" y2="100" marker-end="url(#arr)"/>
<line class="flow" x1="325" y1="165" x2="360" y2="185" marker-end="url(#arr)"/>
<line class="flow" x1="160" y1="48" x2="360" y2="85" marker-end="url(#arr)"/>
<line class="flow" x1="500" y1="95" x2="535" y2="125" marker-end="url(#arr)"/>
<line class="flow" x1="500" y1="185" x2="535" y2="145" marker-end="url(#arr)"/>
<text class="muted" x="347.0" y="262.0" text-anchor="start"></text>
<text class="bold" x="510.0" y="262.0" text-anchor="start" font-size="12" fill="#e2903a">missing</text>
<text class="muted" x="360.0" y="48.0" text-anchor="start" font-size="10.5">per feature, 9 of the 25</text>
<text class="muted" x="10.0" y="320.0" text-anchor="start" font-size="10.5">Distance: Jensen–Shannon between two histograms on equal-width bins; inputs and their attributions both watched.</text>
</svg>

<text class="muted" x="20.0" y="176.0" text-anchor="start" font-size="10.5">every block is half fraud and spans the whole day; a card's frauds land in all three</text>
<text class="bold" x="20.0" y="200.0" text-anchor="start" font-size="12.5">Deployment: forward in time, a delay block, the stream's fraud rate</text>

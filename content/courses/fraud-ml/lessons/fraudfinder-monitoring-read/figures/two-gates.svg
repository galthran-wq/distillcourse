<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .bold { fill: currentColor; font-weight: 600; }
    .muted { fill: currentColor; opacity: 0.55; }
    .axis { stroke: currentColor; stroke-width: 1; fill: none; }
    .guide { stroke: currentColor; stroke-dasharray: 3 3; opacity: 0.5; fill: none; }
    .box { fill: none; stroke: currentColor; stroke-width: 1; }
    .flow { stroke: currentColor; stroke-width: 1.2; fill: none; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
<text class="bold" x="60.0" y="24.0" text-anchor="start" font-size="13">Gate on accuracy</text>
<text class="muted" x="60.0" y="40.0" text-anchor="start" font-size="11">first track: deploy if accuracy &gt; 0.95</text>
<line class="axis" x1="60" y1="250" x2="60" y2="60"/>
<line class="axis" x1="60" y1="250" x2="280" y2="250"/>

<text class="label" x="278.0" y="64.5" text-anchor="end" font-size="11">gate 0.95</text>
<text class="label" x="210.0" y="103.8" text-anchor="start" font-size="11">accuracy 0.98</text>
<text class="muted" x="140.0" y="266.0" text-anchor="middle" font-size="10">constant score, never alerts</text>
<text class="bold" x="235.0" y="140.0" text-anchor="middle" font-size="13" fill="#e2903a">passes</text>
<text class="bold" x="380.0" y="24.0" text-anchor="start" font-size="13">Gate on average precision</text>
<text class="muted" x="380.0" y="40.0" text-anchor="start" font-size="11">second track: deploy if AP &gt; 0.2</text>
<line class="axis" x1="380" y1="250" x2="380" y2="60"/>

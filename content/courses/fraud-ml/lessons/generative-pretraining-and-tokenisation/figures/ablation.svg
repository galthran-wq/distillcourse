<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="none" stroke="currentColor"/></marker><marker id="ara" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="none" stroke="#e2903a"/></marker><marker id="arb" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="none" stroke="#4c8dd6"/></marker></defs>

<text class="s" x="20.0" y="22.0" text-anchor="start">frozen embedding into a small network; four public tasks, each on its own scale</text>
<circle cx="230.0" cy="42.0" r="5" fill="#4c8dd6" opacity="1" stroke="none"/>

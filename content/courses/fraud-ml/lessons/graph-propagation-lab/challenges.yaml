  why-rf-wins:
    kind: review
    rubric: |
      Pass if the answer makes BOTH of these points:
      (1) the 72 aggregate columns are themselves one round of message
      passing / a fixed neighbourhood aggregation (gather the neighbours'
      columns, aggregate with max/min/std/correlation), so the forest
      already sees the one-hop neighbourhood the GCN layer would compute;
      (2) the GCN ends in a logistic regression (one linear score through a
      sigmoid/softmax) on its hidden layer and skip term, while a forest
      splits columns at thresholds and combines them non-linearly, which
      suits these tabular columns better.
      A further point that strengthens but is not required: the normalised
      sum dilutes a few suspicious neighbours among many, where a max keeps
      them.
      Fail if the answer says only that the GCN underfits, is too small, or
      needs more training or tuning, without naming what the aggregates are
      and what the output layer is. Fail if it claims the graph carries no
      information. Do not grade style or length.

  rank-the-test-steps:
    kind: metric
    metric: roc_auc
    threshold: 0.915
    labels_code: |
      # Build time only. The test labels are read from the original files
      # the solution downloaded into the cache; nothing derived from them is
      # stored in the repository (the licence forbids sharing a derivative).
      import os
      from pathlib import Path
      import pandas as pd
      d = Path(os.environ.get("ELLIPTIC_DIR", Path.home() / ".cache" / "distill" / "elliptic"))
      step = pd.read_csv(d / "elliptic_txs_features.csv.zip", header=None, usecols=[1])[1].to_numpy()
      cls = pd.read_csv(d / "elliptic_txs_classes.csv.zip", dtype=str)["class"].to_numpy()
      keep = (step >= 35) & (cls != "unknown")
      labels = (cls[keep] == "1").astype(float)

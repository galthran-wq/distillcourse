<svg viewBox="0 0 700 360" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
<text x="16" y="24" font-size="13" fill="currentColor" font-weight="600">one node, five neighbours, unit weights</text>
<line x1="230" y1="190" x2="230.0" y2="70.0" stroke="currentColor" opacity="0.45" stroke-width="1.3"/>
<circle cx="230.0" cy="70.0" r="20" fill="#e2903a" fill-opacity="0.85"/><text x="230.0" y="74.0" text-anchor="middle" font-size="11.5" font-weight="600" fill="#ffffff">fraud</text>
<line x1="230" y1="190" x2="344.1" y2="152.9" stroke="currentColor" opacity="0.45" stroke-width="1.3"/>
<circle cx="344.1" cy="152.9" r="20" fill="none" stroke="currentColor" stroke-width="1.3"/><text x="344.1" y="156.9" text-anchor="middle" font-size="11.5" fill="currentColor">legit</text>
<line x1="230" y1="190" x2="300.5" y2="287.1" stroke="currentColor" opacity="0.45" stroke-width="1.3"/>
<circle cx="300.5" cy="287.1" r="20" fill="#e2903a" fill-opacity="0.85"/><text x="300.5" y="291.1" text-anchor="middle" font-size="11.5" font-weight="600" fill="#ffffff">fraud</text>
<line x1="230" y1="190" x2="159.5" y2="287.1" stroke="currentColor" opacity="0.45" stroke-width="1.3"/>
<circle cx="159.5" cy="287.1" r="20" fill="none" stroke="currentColor" stroke-width="1.3"/><text x="159.5" y="291.1" text-anchor="middle" font-size="11.5" fill="currentColor">legit</text>
<line x1="230" y1="190" x2="115.9" y2="152.9" stroke="currentColor" opacity="0.45" stroke-width="1.3"/>
<circle cx="115.9" cy="152.9" r="20" fill="none" stroke="currentColor" stroke-width="1.3"/><text x="115.9" y="156.9" text-anchor="middle" font-size="11.5" fill="currentColor">legit</text>
<circle cx="230" cy="190" r="22" fill="none" stroke="currentColor" stroke-width="2"/><text x="230" y="195" text-anchor="middle" font-size="15" font-weight="600" fill="currentColor">?</text>
<text x="410" y="120" font-size="13" fill="currentColor" font-weight="600">labels on the neighbours</text>
<text x="410" y="150" font-size="13" fill="currentColor">fraud weight: 1 + 1 = 2</text>
<text x="410" y="180" font-size="13" fill="currentColor">legit weight: 1 + 1 + 1 = 3</text>
<text x="410" y="210" font-size="13" fill="currentColor">Z = 2 + 3 = 5</text>
<text x="410" y="240" font-size="13" fill="#e2903a" font-weight="600">P(fraud | ?) = 2/5 = 0.40</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 214" font-family="system-ui, sans-serif">
  <defs>
    <marker id="pa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <!-- one fold -->
  <text x="20" y="20" font-size="14" font-weight="600" fill="currentColor">One prequential fold: resample the training block only</text>
  <rect x="20" y="38" width="170" height="40" rx="5" fill="none" stroke="currentColor" opacity="0.8"/>
  <text x="105" y="63" font-size="12" text-anchor="middle" fill="currentColor">training block</text>
  <rect x="196" y="38" width="110" height="40" rx="5" fill="none" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5"/>
  <text x="251" y="63" font-size="12" text-anchor="middle" fill="currentColor" opacity="0.7">delay block</text>
  <rect x="312" y="38" width="170" height="40" rx="5" fill="#4c8dd6" fill-opacity="0.15" stroke="#4c8dd6"/>
  <text x="397" y="63" font-size="12" text-anchor="middle" fill="currentColor">validation block</text>
  <line x1="105" y1="78" x2="105" y2="110" stroke="currentColor" marker-end="url(#pa)"/>
  <rect x="40" y="114" width="130" height="40" rx="5" fill="#e2903a" fill-opacity="0.18" stroke="#e2903a"/>
  <text x="105" y="139" font-size="12" text-anchor="middle" fill="currentColor">sampler</text>
  <line x1="170" y1="134" x2="226" y2="134" stroke="currentColor" marker-end="url(#pa)"/>
  <rect x="230" y="114" width="100" height="40" rx="5" fill="none" stroke="currentColor" opacity="0.8"/>
  <text x="280" y="139" font-size="12" text-anchor="middle" fill="currentColor">model</text>
  <line x1="330" y1="134" x2="376" y2="134" stroke="currentColor" marker-end="url(#pa)"/>
  <line x1="397" y1="78" x2="397" y2="110" stroke="#4c8dd6" marker-end="url(#pa)"/>
  <rect x="380" y="114" width="240" height="40" rx="5" fill="#4c8dd6" fill-opacity="0.15" stroke="#4c8dd6"/>
  <text x="500" y="132" font-size="12" text-anchor="middle" fill="currentColor">score untouched payments:</text>
  <text x="500" y="147" font-size="12" text-anchor="middle" fill="currentColor">AUC, AP, CP@100</text>
  <text x="20" y="186" font-size="12" fill="currentColor" opacity="0.7">The sampler is refitted inside every fold, on that fold's training block alone.</text>
  <text x="20" y="202" font-size="12" fill="currentColor" opacity="0.7">The validation block keeps the stream's payments and base rate: nothing added, nothing dropped.</text>
</svg>

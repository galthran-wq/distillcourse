<svg viewBox="0 0 620 280" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .bold { fill: currentColor; font-weight: 600; }
    .muted { fill: currentColor; opacity: 0.55; }
    .axis { stroke: currentColor; stroke-width: 1; fill: none; }
    .guide { stroke: currentColor; stroke-dasharray: 3 3; opacity: 0.5; fill: none; }
    .box { fill: none; stroke: currentColor; stroke-width: 1; }
    .flow { stroke: currentColor; stroke-width: 1.2; fill: none; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
<text class="bold" x="20.0" y="22.0" text-anchor="start" font-size="13">2. Pool the cards, draw two samples of the same sizes</text>
<rect x="40" y="44" width="240" height="78" rx="5" fill="#4c8dd6" fill-opacity="0.10" stroke="#4c8dd6"/>
<text class="bold" x="160.0" y="66.0" text-anchor="middle" font-size="12">development week, days 42–48</text>
<text class="label" x="160.0" y="86.0" text-anchor="middle" font-size="11.5">4,000 cards · 52,361 payments</text>
<text class="bold" x="160.0" y="108.0" text-anchor="middle" font-size="12.5">AP 0.575</text>
<rect x="340" y="44" width="240" height="78" rx="5" fill="#e2903a" fill-opacity="0.10" stroke="#e2903a"/>
<text class="bold" x="460.0" y="66.0" text-anchor="middle" font-size="12">week from day 84</text>
<text class="label" x="460.0" y="86.0" text-anchor="middle" font-size="11.5">3,876 cards · 49,216 payments</text>
<text class="bold" x="460.0" y="108.0" text-anchor="middle" font-size="12.5">AP 0.359</text>
<path class="flow" d="M160,122 L280,170" marker-end="url(#arr)"/>
<path class="flow" d="M460,122 L340,170" marker-end="url(#arr)"/>
<rect x="200" y="172" width="220" height="40" rx="5" class="box"/>
<text class="bold" x="310.0" y="190.0" text-anchor="middle" font-size="12">one pool of 7,876 cards</text>
<text class="muted" x="310.0" y="205.0" text-anchor="middle" font-size="11">each card with all its payments</text>
<path class="flow" d="M250,212 L150,246" marker-end="url(#arr)"/>
<path class="flow" d="M370,212 L470,246" marker-end="url(#arr)"/>
<text class="label" x="150.0" y="262.0" text-anchor="middle" font-size="11.5">draw 4,000 cards with replacement</text>
<text class="label" x="470.0" y="262.0" text-anchor="middle" font-size="11.5">draw 3,876 cards with replacement</text>
<text class="bold" x="310.0" y="262.0" text-anchor="middle" font-size="11.5">AP difference</text>
</svg>

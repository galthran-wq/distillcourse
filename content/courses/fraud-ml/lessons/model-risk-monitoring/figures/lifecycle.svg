<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .bold { fill: currentColor; font-weight: 600; }
    .muted { fill: currentColor; opacity: 0.55; }
    .axis { stroke: currentColor; stroke-width: 1; fill: none; }
    .guide { stroke: currentColor; stroke-dasharray: 3 3; opacity: 0.5; fill: none; }
    .box { fill: none; stroke: currentColor; stroke-width: 1; }
    .flow { stroke: currentColor; stroke-width: 1.2; fill: none; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
<rect x="10" y="30" width="114" height="74" rx="5" class="box"/>
<text class="bold" x="67.0" y="52.0" text-anchor="middle" font-size="12.5">development</text>
<text class="muted" x="67.0" y="70.0" text-anchor="middle" font-size="10.5">fitted and selected</text>
<text class="muted" x="67.0" y="83.0" text-anchor="middle" font-size="10.5">on prequential folds</text>
<line class="flow" x1="124" y1="67" x2="138" y2="67" marker-end="url(#arr)"/>
<rect x="138" y="30" width="114" height="74" rx="5" class="box"/>
<text class="bold" x="195.0" y="52.0" text-anchor="middle" font-size="12.5">testing</text>
<text class="muted" x="195.0" y="70.0" text-anchor="middle" font-size="10.5">latency, missing and</text>
<text class="muted" x="195.0" y="83.0" text-anchor="middle" font-size="10.5">extreme inputs,</text>
<text class="muted" x="195.0" y="96.0" text-anchor="middle" font-size="10.5">dummy cases</text>
<line class="flow" x1="252" y1="67" x2="266" y2="67" marker-end="url(#arr)"/>
<rect x="266" y="30" width="114" height="74" rx="5" fill="#e2903a" fill-opacity="0.12" stroke="#e2903a"/>
<text class="bold" x="323.0" y="52.0" text-anchor="middle" font-size="12.5">staging</text>
<text class="muted" x="323.0" y="70.0" text-anchor="middle" font-size="10.5">champion acts;</text>
<text class="muted" x="323.0" y="83.0" text-anchor="middle" font-size="10.5">challenger scores</text>
<text class="muted" x="323.0" y="96.0" text-anchor="middle" font-size="10.5">the same payments</text>
<line class="flow" x1="380" y1="67" x2="394" y2="67" marker-end="url(#arr)"/>
<rect x="394" y="30" width="114" height="74" rx="5" class="box"/>
<text class="bold" x="451.0" y="52.0" text-anchor="middle" font-size="12.5">production</text>
<text class="muted" x="451.0" y="70.0" text-anchor="middle" font-size="10.5">the weekly</text>
<text class="muted" x="451.0" y="83.0" text-anchor="middle" font-size="10.5">monitor runs</text>
<line class="flow" x1="508" y1="67" x2="522" y2="67" marker-end="url(#arr)"/>
<rect x="522" y="30" width="114" height="74" rx="5" class="box"/>
<text class="bold" x="579.0" y="52.0" text-anchor="middle" font-size="12.5">retirement</text>
<text class="muted" x="579.0" y="70.0" text-anchor="middle" font-size="10.5">kept in a</text>
<text class="muted" x="579.0" y="83.0" text-anchor="middle" font-size="10.5">repository</text>
<path class="flow" d="M420,104 C420,168 67,168 67,106" marker-end="url(#arr)"/>
<text class="label" x="244.0" y="172.0" text-anchor="middle" font-size="11">ranking red: a retrained challenger starts over</text>
<path class="flow" d="M470,104 C470,136 494,136 494,106" marker-end="url(#arr)"/>
<text class="label" x="510.0" y="128.0" text-anchor="start" font-size="11">calibration red:</text>
<text class="label" x="510.0" y="142.0" text-anchor="start" font-size="11">recalibrate in place</text>
<text class="bold" x="20.0" y="206.0" text-anchor="start" font-size="12">Changeover: weight on the new model over time</text>
<line class="axis" x1="30" y1="300" x2="195" y2="300"/>
<line class="axis" x1="30" y1="228" x2="30" y2="300"/>

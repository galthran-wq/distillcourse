<text class="muted" x="26.0" y="304.0" text-anchor="end" font-size="10">0</text>
<line class="axis" x1="235" y1="300" x2="400" y2="300"/>
<line class="axis" x1="235" y1="228" x2="235" y2="300"/>
<polyline points="235,300 265,300 265,276 305,276 305,252 345,252 345,228 395,228" fill="none" stroke="#e2903a" stroke-width="2"/>
<text class="label" x="317.0" y="318.0" text-anchor="middle" font-size="11.5">phased, by segment</text>
<text class="muted" x="231.0" y="232.0" text-anchor="end" font-size="10">1</text>
<text class="muted" x="231.0" y="304.0" text-anchor="end" font-size="10">0</text>
<line class="axis" x1="440" y1="300" x2="605" y2="300"/>
<line class="axis" x1="440" y1="228" x2="440" y2="300"/>
<polyline points="440,300 470,300 570,228 600,228" fill="none" stroke="#e2903a" stroke-width="2"/>
<text class="label" x="522.0" y="318.0" text-anchor="middle" font-size="11.5">parallel, over months</text>
<text class="muted" x="436.0" y="232.0" text-anchor="end" font-size="10">1</text>
<text class="muted" x="436.0" y="304.0" text-anchor="end" font-size="10">0</text>

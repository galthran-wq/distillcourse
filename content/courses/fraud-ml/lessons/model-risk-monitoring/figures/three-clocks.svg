<svg viewBox="0 0 640 312" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .bold { fill: currentColor; font-weight: 600; }
    .muted { fill: currentColor; opacity: 0.55; }
    .axis { stroke: currentColor; stroke-width: 1; fill: none; }
    .guide { stroke: currentColor; stroke-dasharray: 3 3; opacity: 0.5; fill: none; }
    .box { fill: none; stroke: currentColor; stroke-width: 1; }
    .flow { stroke: currentColor; stroke-width: 1.2; fill: none; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
<rect x="12" y="10" width="196" height="232" rx="5" fill="#4c8dd6" fill-opacity="0.08" stroke="#4c8dd6" stroke-width="1.2"/>
<text class="bold" x="110.0" y="32.0" text-anchor="middle" font-size="14">Inputs</text>
<text class="label" x="110.0" y="50.0" text-anchor="middle" font-size="12">has the population moved?</text>
<text class="muted" x="24.0" y="76.0" text-anchor="start" font-size="11">computed from</text>
<text class="label" x="24.0" y="92.0" text-anchor="start" font-size="12">this week's payments,</text>
<text class="label" x="24.0" y="107.0" text-anchor="start" font-size="12">no labels needed</text>
<text class="muted" x="24.0" y="130.0" text-anchor="start" font-size="11">ready</text>
<text class="label" x="24.0" y="146.0" text-anchor="start" font-size="12">the same day</text>
<text class="muted" x="24.0" y="172.0" text-anchor="start" font-size="11">measured by</text>
<text class="label" x="24.0" y="188.0" text-anchor="start" font-size="12">stability index on the</text>
<text class="label" x="24.0" y="203.0" text-anchor="start" font-size="12">score and on each input</text>
<text class="bold" x="24.0" y="232.0" text-anchor="start" font-size="11">lights: 0.10 and 0.25</text>
<rect x="222" y="10" width="196" height="232" rx="5" fill="#e2903a" fill-opacity="0.08" stroke="#e2903a" stroke-width="1.2"/>
<text class="bold" x="320.0" y="32.0" text-anchor="middle" font-size="14">Ranking</text>
<text class="label" x="320.0" y="50.0" text-anchor="middle" font-size="12">does the order still work?</text>
<text class="muted" x="234.0" y="76.0" text-anchor="start" font-size="11">computed from</text>
<text class="label" x="234.0" y="92.0" text-anchor="start" font-size="12">latest fully labelled week</text>
<text class="muted" x="234.0" y="130.0" text-anchor="start" font-size="11">ready</text>
<text class="label" x="234.0" y="146.0" text-anchor="start" font-size="12">δ days after the week</text>
<text class="muted" x="234.0" y="172.0" text-anchor="start" font-size="11">measured by</text>
<text class="label" x="234.0" y="188.0" text-anchor="start" font-size="12">AP and CP@k against the</text>
<text class="label" x="234.0" y="203.0" text-anchor="start" font-size="12">spread of ordinary weeks</text>
<text class="bold" x="234.0" y="232.0" text-anchor="start" font-size="11">lights: 99% line, CUSUM alarm</text>
<rect x="432" y="10" width="196" height="232" rx="5" fill="#5aa46a" fill-opacity="0.08" stroke="#5aa46a" stroke-width="1.2"/>
<text class="bold" x="530.0" y="32.0" text-anchor="middle" font-size="14">Probabilities</text>
<text class="label" x="530.0" y="50.0" text-anchor="middle" font-size="12">do they mean what they say?</text>
<text class="muted" x="444.0" y="76.0" text-anchor="start" font-size="11">computed from</text>
<text class="label" x="444.0" y="92.0" text-anchor="start" font-size="12">latest labelled week,</text>
<text class="label" x="444.0" y="107.0" text-anchor="start" font-size="12">split into probability pools</text>
<text class="muted" x="444.0" y="130.0" text-anchor="start" font-size="11">ready</text>
<text class="label" x="444.0" y="146.0" text-anchor="start" font-size="12">δ days after the week</text>
<text class="muted" x="444.0" y="172.0" text-anchor="start" font-size="11">measured by</text>
<text class="label" x="444.0" y="188.0" text-anchor="start" font-size="12">observed against predicted</text>
<text class="label" x="444.0" y="203.0" text-anchor="start" font-size="12">fraud rate in each pool</text>
<text class="bold" x="444.0" y="232.0" text-anchor="start" font-size="11">lights: 90%, 95%, 99%</text>
<line class="axis" x1="20" y1="270" x2="620" y2="270" marker-end="url(#arr)"/>
<line class="axis" x1="60" y1="265" x2="60" y2="275"/>
<text class="muted" x="60.0" y="290.0" text-anchor="middle" font-size="11">week t scored</text>
<line class="axis" x1="250" y1="265" x2="250" y2="275"/>
<text class="muted" x="250.0" y="290.0" text-anchor="middle" font-size="11">week t ends</text>
<line class="axis" x1="470" y1="265" x2="470" y2="275"/>
<text class="muted" x="470.0" y="290.0" text-anchor="middle" font-size="11">+ δ: its labels complete</text>
<circle cx="250" cy="270" r="4" fill="#4c8dd6"/>
<circle cx="470" cy="270" r="4" fill="#e2903a"/>
<circle cx="480" cy="270" r="4" fill="#5aa46a"/>
</svg>

<svg viewBox="0 0 660 420" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .bold { fill: currentColor; font-weight: 600; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .small { fill: currentColor; font-size: 11px; }
    .axis { stroke: currentColor; stroke-width: 1; fill: none; }
    .guide { stroke: currentColor; stroke-dasharray: 3 3; opacity: 0.5; fill: none; }
  </style>
<text class="bold" x="330.0" y="22.0" text-anchor="middle">what comes naturally to a network, beside a tree ensemble</text>
<rect x="20" y="40" width="300" height="165" rx="6" fill="none" stroke="currentColor" stroke-opacity="0.35"/>
<text class="bold" x="32.0" y="62.0" text-anchor="start">1  update the same model</text>
<rect x="340" y="40" width="300" height="165" rx="6" fill="none" stroke="currentColor" stroke-opacity="0.35"/>
<text class="bold" x="352.0" y="62.0" text-anchor="start">2  learn from raw sequences</text>
<rect x="20" y="220" width="300" height="165" rx="6" fill="none" stroke="currentColor" stroke-opacity="0.35"/>
<text class="bold" x="32.0" y="242.0" text-anchor="start">3  average weights across banks</text>
<rect x="340" y="220" width="300" height="165" rx="6" fill="none" stroke="currentColor" stroke-opacity="0.35"/>
<text class="bold" x="352.0" y="242.0" text-anchor="start">4  a partner unlike the trees</text>
<rect x="34" y="85" width="50" height="26" rx="3" fill="none" fill-opacity="0.3" stroke="currentColor" stroke-opacity="0.5"/>
<text class="small" x="59.0" y="102.0" text-anchor="middle">day t−2</text>
<rect x="90" y="85" width="50" height="26" rx="3" fill="none" fill-opacity="0.3" stroke="currentColor" stroke-opacity="0.5"/>
<text class="small" x="115.0" y="102.0" text-anchor="middle">day t−1</text>
<rect x="146" y="85" width="50" height="26" rx="3" fill="#4c8dd6" fill-opacity="0.3" stroke="currentColor" stroke-opacity="0.5"/>
<text class="small" x="171.0" y="102.0" text-anchor="middle">day t</text>
<rect x="242" y="85" width="66" height="26" rx="3" fill="#e2903a" fill-opacity="0.3" stroke="#e2903a"/>
<text class="small" x="275.0" y="102.0" text-anchor="middle">weights</text>
<path d="M198.0,98.0 L239.0,98.0" stroke="currentColor" stroke-width="1.4" fill="none"/>
<text class="muted" x="218.0" y="124.0" text-anchor="middle">a few steps</text>
<text class="small" x="32.0" y="140.0" text-anchor="start">network: further gradient steps on the</text>
<text class="small" x="32.0" y="156.0" text-anchor="start">same weights; the model keeps its size</text>
<text class="muted" x="32.0" y="180.0" text-anchor="start">boosting: append trees for the new day;</text>
<text class="muted" x="32.0" y="195.0" text-anchor="start">the old trees keep their old splits</text>
<rect x="354" y="85" width="24" height="24" rx="3" fill="none" stroke="currentColor" stroke-opacity="0.6"/>
<text class="muted" x="366.0" y="101.0" text-anchor="middle">p1</text>
<rect x="382" y="85" width="24" height="24" rx="3" fill="none" stroke="currentColor" stroke-opacity="0.6"/>
<text class="muted" x="394.0" y="101.0" text-anchor="middle">p2</text>
<rect x="410" y="85" width="24" height="24" rx="3" fill="none" stroke="currentColor" stroke-opacity="0.6"/>
<text class="muted" x="422.0" y="101.0" text-anchor="middle">p3</text>
<rect x="438" y="85" width="24" height="24" rx="3" fill="none" stroke="currentColor" stroke-opacity="0.6"/>
<text class="muted" x="450.0" y="101.0" text-anchor="middle">p4</text>
<rect x="466" y="85" width="24" height="24" rx="3" fill="none" stroke="currentColor" stroke-opacity="0.6"/>
<text class="muted" x="478.0" y="101.0" text-anchor="middle">p5</text>
<path d="M496.0,97.0 L516.0,97.0" stroke="currentColor" stroke-width="1.4" fill="none"/>
<rect x="520" y="85" width="110" height="24" rx="3" fill="#e2903a" fill-opacity="0.3" stroke="#e2903a"/>
<text class="small" x="575.0" y="101.0" text-anchor="middle">learned summary</text>
<text class="small" x="352.0" y="140.0" text-anchor="start">the card's last payments go in raw; the</text>
<text class="small" x="352.0" y="156.0" text-anchor="start">summary and the classifier are trained</text>
<text class="small" x="352.0" y="172.0" text-anchor="start">together, by one loss</text>
<text class="muted" x="352.0" y="195.0" text-anchor="start">trees: a split passes no gradient back</text>
<rect x="40" y="254" width="60" height="24" rx="3" fill="#4c8dd6" fill-opacity="0.25" stroke="currentColor" stroke-opacity="0.5"/>
<text class="small" x="70.0" y="270.0" text-anchor="middle">bank A</text>
<path d="M70.0,280.0 L140.0,298.0" stroke="currentColor" stroke-width="1" fill="none" opacity="0.6"/>
<rect x="110" y="254" width="60" height="24" rx="3" fill="#4c8dd6" fill-opacity="0.25" stroke="currentColor" stroke-opacity="0.5"/>
<text class="small" x="140.0" y="270.0" text-anchor="middle">bank B</text>
<path d="M140.0,280.0 L140.0,298.0" stroke="currentColor" stroke-width="1" fill="none" opacity="0.6"/>
<rect x="180" y="254" width="60" height="24" rx="3" fill="#4c8dd6" fill-opacity="0.25" stroke="currentColor" stroke-opacity="0.5"/>
<text class="small" x="210.0" y="270.0" text-anchor="middle">bank C</text>
<path d="M210.0,280.0 L140.0,298.0" stroke="currentColor" stroke-width="1" fill="none" opacity="0.6"/>
<rect x="90" y="298" width="100" height="24" rx="3" fill="#e2903a" fill-opacity="0.3" stroke="#e2903a"/>
<text class="small" x="140.0" y="314.0" text-anchor="middle">mean of weights</text>
<text class="small" x="32.0" y="340.0" text-anchor="start">same architecture, local data, only the</text>
<text class="small" x="32.0" y="355.0" text-anchor="start">finished weights travel, once per round</text>
<text class="muted" x="32.0" y="374.0" text-anchor="start">trees: banks share split statistics per tree</text>
<rect x="360" y="262" width="80" height="24" rx="3" fill="#4c8dd6" fill-opacity="0.25" stroke="currentColor" stroke-opacity="0.5"/>
<text class="small" x="400.0" y="278.0" text-anchor="middle">XGBoost</text>
<rect x="360" y="296" width="80" height="24" rx="3" fill="#e2903a" fill-opacity="0.3" stroke="#e2903a"/>
<text class="small" x="400.0" y="312.0" text-anchor="middle">network</text>
<path d="M442.0,274.0 L490.0,292.0" stroke="currentColor" stroke-width="1.2" fill="none"/>
<path d="M442.0,308.0 L490.0,294.0" stroke="currentColor" stroke-width="1.2" fill="none"/>
<rect x="492" y="280" width="110" height="26" rx="3" fill="#5aa46a" fill-opacity="0.25" stroke="#5aa46a"/>
<text class="small" x="547.0" y="297.0" text-anchor="middle">average of scores</text>
<text class="small" x="352.0" y="348.0" text-anchor="start">another kind of model, partly different</text>
<text class="small" x="352.0" y="364.0" text-anchor="start">frauds: the average can beat both</text>
</svg>

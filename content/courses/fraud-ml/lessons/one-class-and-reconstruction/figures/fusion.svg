<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .bold { fill: currentColor; font-weight: 600; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .flow { stroke: currentColor; stroke-width: 1.2; fill: none; }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
  <!-- W1A -->
  <text class="bold" x="120" y="26" text-anchor="middle">1. average the two scores</text>
  <rect x="80" y="44" width="80" height="26" rx="4" fill="none" stroke="currentColor"/><text class="label" x="120" y="62" text-anchor="middle">15 inputs</text>
  <rect x="20" y="110" width="90" height="34" rx="4" fill="#4c8dd6" fill-opacity="0.15" stroke="#4c8dd6"/><text fill="#4c8dd6" x="65" y="131" text-anchor="middle">labelled net</text>
  <rect x="130" y="110" width="90" height="34" rx="4" fill="#e2903a" fill-opacity="0.15" stroke="#e2903a"/><text fill="#e2903a" x="175" y="131" text-anchor="middle">autoencoder</text>
  <path class="flow" d="M105,70 L70,108" marker-end="url(#ar)"/><path class="flow" d="M135,70 L170,108" marker-end="url(#ar)"/>
  <text fill="#4c8dd6" x="65" y="166" text-anchor="middle" font-size="11">P(fraud)</text><text fill="#e2903a" x="175" y="166" text-anchor="middle" font-size="11">error</text>
  <path class="flow" d="M65,172 L110,206" marker-end="url(#ar)"/><path class="flow" d="M175,172 L130,206" marker-end="url(#ar)"/>
  <rect x="70" y="208" width="100" height="30" rx="4" fill="none" stroke="currentColor"/><text class="label" x="120" y="228" text-anchor="middle">mean of ranks</text>
  <text class="muted" x="120" y="262" text-anchor="middle">two models, joined at the output</text>
  <!-- W1B -->
  <text class="bold" x="360" y="26" text-anchor="middle">2. the error as a 16th input</text>
  <rect x="320" y="44" width="80" height="26" rx="4" fill="none" stroke="currentColor"/><text class="label" x="360" y="62" text-anchor="middle">15 inputs</text>
  <rect x="380" y="100" width="90" height="34" rx="4" fill="#e2903a" fill-opacity="0.15" stroke="#e2903a"/><text fill="#e2903a" x="425" y="121" text-anchor="middle">autoencoder</text>
  <path class="flow" d="M375,70 L415,98" marker-end="url(#ar)"/>
  <path class="flow" d="M345,70 L330,176" marker-end="url(#ar)"/><path class="flow" d="M425,134 L380,176" marker-end="url(#ar)"/>
  <text fill="#e2903a" x="430" y="160" font-size="11">error</text>
  <rect x="290" y="178" width="120" height="34" rx="4" fill="#4c8dd6" fill-opacity="0.15" stroke="#4c8dd6"/><text fill="#4c8dd6" x="350" y="199" text-anchor="middle">labelled net</text>
  <path class="flow" d="M350,212 L350,236" marker-end="url(#ar)"/><text fill="#4c8dd6" x="350" y="250" text-anchor="middle" font-size="11">P(fraud)</text>
  <text class="muted" x="360" y="272" text-anchor="middle">two models, joined at the input</text>
  <!-- W2 -->
  <text class="bold" x="600" y="26" text-anchor="middle">3. one code, two heads</text>
  <rect x="560" y="44" width="80" height="26" rx="4" fill="none" stroke="currentColor"/><text class="label" x="600" y="62" text-anchor="middle">15 inputs</text>
  <path class="flow" d="M600,70 L600,98" marker-end="url(#ar)"/>
  <rect x="555" y="100" width="90" height="30" rx="4" fill="#e2903a" fill-opacity="0.15" stroke="#e2903a"/><text fill="#e2903a" x="600" y="120" text-anchor="middle">encoder → code</text>
  <path class="flow" d="M585,130 L545,170" marker-end="url(#ar)"/><path class="flow" d="M615,130 L655,170" marker-end="url(#ar)"/>
  <rect x="490" y="172" width="100" height="30" rx="4" fill="#e2903a" fill-opacity="0.15" stroke="#e2903a"/><text fill="#e2903a" x="540" y="192" text-anchor="middle">decoder</text>
  <rect x="610" y="172" width="100" height="30" rx="4" fill="#4c8dd6" fill-opacity="0.15" stroke="#4c8dd6"/><text fill="#4c8dd6" x="660" y="192" text-anchor="middle">fraud head</text>
  <text fill="#e2903a" x="540" y="220" text-anchor="middle" font-size="11">squared error</text><text fill="#4c8dd6" x="660" y="220" text-anchor="middle" font-size="11">cross-entropy</text>
  <text class="muted" x="600" y="244" text-anchor="middle">every row trains the decoder,</text>
  <text class="muted" x="600" y="258" text-anchor="middle">labelled rows also the head;</text>
  <text class="muted" x="600" y="272" text-anchor="middle">both losses shape the code</text>
</svg>

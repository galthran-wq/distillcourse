<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .bold { fill: currentColor; font-weight: 600; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .small { fill: currentColor; font-size: 11px; }
    .axis { stroke: currentColor; stroke-width: 1; fill: none; }
    .guide { stroke: currentColor; stroke-dasharray: 3 3; opacity: 0.5; fill: none; }
    .box { fill: none; stroke: currentColor; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <text class="muted" x="20.0" y="26.0" text-anchor="start">copied from the real log</text>
  <rect x="20" y="40" width="170" height="62" rx="5" fill="#4c8dd6" fill-opacity="0.12" stroke="#4c8dd6"/>
  <text x="30.0" y="60.0" text-anchor="start" fill="#4c8dd6" font-weight="600">aggregate file</text>
  <text class="small" x="30.0" y="77.0" text-anchor="start">per day × hour × type:</text>
  <text class="small" x="30.0" y="91.0" text-anchor="start">count, mean, sd of amount</text>
  <rect x="20" y="116" width="170" height="62" rx="5" fill="#4c8dd6" fill-opacity="0.12" stroke="#4c8dd6"/>
  <text x="30.0" y="136.0" text-anchor="start" fill="#4c8dd6" font-weight="600">repetitions file</text>
  <text class="small" x="30.0" y="153.0" text-anchor="start">how often a client</text>
  <text class="small" x="30.0" y="167.0" text-anchor="start">may act again</text>
  <rect x="20" y="192" width="170" height="62" rx="5" fill="#4c8dd6" fill-opacity="0.12" stroke="#4c8dd6"/>
  <text x="30.0" y="212.0" text-anchor="start" fill="#4c8dd6" font-weight="600">initial-balance file</text>
  <text class="small" x="30.0" y="229.0" text-anchor="start">distribution of</text>
  <text class="small" x="30.0" y="243.0" text-anchor="start">starting balances</text>
  <path class="axis" d="M190,71 L240,64" marker-end="url(#arr)"/>
  <path class="axis" d="M190,147 L240,87" marker-end="url(#arr)"/>
  <path class="axis" d="M190,223 L240,110" marker-end="url(#arr)"/>
  <rect class="box" x="244" y="36" width="160" height="102" rx="6"/>
  <text class="bold" x="324.0" y="58.0" text-anchor="middle">the step loop</text>
  <text class="small" x="324.0" y="78.0" text-anchor="middle">744 hourly steps; each</text>
  <text class="small" x="324.0" y="92.0" text-anchor="middle">step creates clients who</text>
  <text class="small" x="324.0" y="106.0" text-anchor="middle">draw a type, an amount</text>
  <text class="small" x="324.0" y="120.0" text-anchor="middle">and a counterparty</text>
  <rect x="244" y="160" width="160" height="62" rx="6" fill="#e2903a" fill-opacity="0.15" stroke="#e2903a"/>
  <text x="324.0" y="180.0" text-anchor="middle" fill="#e2903a" font-weight="600">fraud agents</text>
  <text class="small" x="324.0" y="197.0" text-anchor="middle">take over an account,</text>
  <text class="small" x="324.0" y="211.0" text-anchor="middle">TRANSFER, then CASH_OUT</text>
  <text class="muted" x="324.0" y="236.0" text-anchor="middle">added for the Kaggle run</text>
  <rect x="244" y="248" width="160" height="44" rx="6" fill="none" stroke="currentColor" stroke-dasharray="4 3"/>
  <text class="bold" x="324.0" y="266.0" text-anchor="middle">rule layer</text>
  <text class="small" x="324.0" y="282.0" text-anchor="middle">stops some large transfers</text>
  <path class="axis" d="M404,87 L452,132" marker-end="url(#arr)"/>
  <path d="M404,191 L452,242" stroke="#e2903a" fill="none" marker-end="url(#arr)"/>
  <path class="axis" d="M404,270 L452,264" marker-end="url(#arr)"/>
  <text class="muted" x="540.0" y="26.0" text-anchor="middle">one row of the log</text>
  <rect x="458" y="34" width="164" height="19" rx="3" fill="#4c8dd6" fill-opacity="0.18" stroke="#4c8dd6"/>
  <text x="466.0" y="48.0" text-anchor="start" fill="#4c8dd6" font-size="11" font-weight="600">step</text>
  <rect x="458" y="56" width="164" height="19" rx="3" fill="#4c8dd6" fill-opacity="0.18" stroke="#4c8dd6"/>
  <text x="466.0" y="70.0" text-anchor="start" fill="#4c8dd6" font-size="11" font-weight="600">type</text>
  <rect x="458" y="78" width="164" height="19" rx="3" fill="#4c8dd6" fill-opacity="0.18" stroke="#4c8dd6"/>
  <text x="466.0" y="92.0" text-anchor="start" fill="#4c8dd6" font-size="11" font-weight="600">amount</text>
  <rect x="458" y="100" width="164" height="19" rx="3" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.35"/>
  <text class="small" x="466.0" y="114.0" text-anchor="start">nameOrig</text>
  <rect x="458" y="122" width="164" height="19" rx="3" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.35"/>
  <text class="small" x="466.0" y="136.0" text-anchor="start">oldbalanceOrg</text>
  <rect x="458" y="144" width="164" height="19" rx="3" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.35"/>
  <text class="small" x="466.0" y="158.0" text-anchor="start">newbalanceOrig</text>
  <rect x="458" y="166" width="164" height="19" rx="3" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.35"/>
  <text class="small" x="466.0" y="180.0" text-anchor="start">nameDest</text>
  <rect x="458" y="188" width="164" height="19" rx="3" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.35"/>
  <text class="small" x="466.0" y="202.0" text-anchor="start">oldbalanceDest</text>
  <rect x="458" y="210" width="164" height="19" rx="3" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.35"/>
  <text class="small" x="466.0" y="224.0" text-anchor="start">newbalanceDest</text>
  <rect x="458" y="232" width="164" height="19" rx="3" fill="#e2903a" fill-opacity="0.18" stroke="#e2903a"/>
  <text x="466.0" y="246.0" text-anchor="start" fill="#e2903a" font-size="11" font-weight="600">isFraud</text>
  <rect x="458" y="254" width="164" height="19" rx="3" fill="none" stroke="currentColor" stroke-dasharray="4 3"/>
  <text class="small" x="466.0" y="268.0" text-anchor="start">isFlaggedFraud</text>
  <rect x="20" y="300" width="11" height="11" rx="2" fill="#4c8dd6"/>  <text class="small" x="37.0" y="310.0" text-anchor="start">matched to the log's hourly totals</text>
  <rect x="20" y="318" width="11" height="11" rx="2" fill="currentColor" fill-opacity="0.25"/>  <text class="small" x="37.0" y="328.0" text-anchor="start">agents' bookkeeping, never checked against the log</text>
  <rect x="458" y="296" width="11" height="11" rx="2" fill="#e2903a"/>  <text class="small" x="475.0" y="306.0" text-anchor="start">written by the script</text>
  <rect x="458" y="314" width="11" height="11" rx="2" fill="none" stroke="currentColor" stroke-dasharray="3 2"/>  <text class="small" x="475.0" y="324.0" text-anchor="start">written by the rule</text>
</svg>

<svg viewBox="0 0 640 415" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .bold { fill: currentColor; font-weight: 600; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .small { fill: currentColor; font-size: 11px; }
    .axis { stroke: currentColor; stroke-width: 1; fill: none; }
    .guide { stroke: currentColor; stroke-dasharray: 3 3; opacity: 0.5; fill: none; }
    .box { fill: none; stroke: currentColor; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <text class="muted" x="30.0" y="22.0" text-anchor="start">column</text>
  <text class="muted" x="350.0" y="22.0" text-anchor="start">why</text>
  <text x="20.0" y="46.0" text-anchor="start" fill="#5aa46a" font-weight="600">kept</text>
  <rect x="20" y="52" width="600" height="20" rx="3" fill="#5aa46a" fill-opacity="0.12"/>
  <text class="small" x="30.0" y="66.0" text-anchor="start">rows: TRANSFER and CASH_OUT only</text>
  <text class="small" x="350.0" y="66.0" text-anchor="start">the only types fraud occurs in</text>
  <rect x="20" y="75" width="600" height="20" rx="3" fill="#5aa46a" fill-opacity="0.12"/>
  <text class="small" x="30.0" y="89.0" text-anchor="start">log amount</text>
  <text class="small" x="350.0" y="89.0" text-anchor="start">a field of the transaction</text>
  <rect x="20" y="98" width="600" height="20" rx="3" fill="#5aa46a" fill-opacity="0.12"/>
  <text class="small" x="30.0" y="112.0" text-anchor="start">amount ÷ sender's balance before</text>
  <text class="small" x="350.0" y="112.0" text-anchor="start">known at scoring; 1 means the account is emptied</text>
  <rect x="20" y="121" width="600" height="20" rx="3" fill="#5aa46a" fill-opacity="0.12"/>
  <text class="small" x="30.0" y="135.0" text-anchor="start">receiver's earlier rows: count, sum</text>
  <text class="small" x="350.0" y="135.0" text-anchor="start">as-of, over earlier steps: the one entity with a past</text>
  <rect x="20" y="144" width="600" height="20" rx="3" fill="#5aa46a" fill-opacity="0.12"/>
  <text class="small" x="30.0" y="158.0" text-anchor="start">receiver never seen before</text>
  <text class="small" x="350.0" y="158.0" text-anchor="start">the same count, = 0</text>
  <text x="20.0" y="187.0" text-anchor="start" fill="#e2903a" font-weight="600">kept, marked as the generator's</text>
  <rect x="20" y="193" width="600" height="20" rx="3" fill="#e2903a" fill-opacity="0.12"/>
  <text class="small" x="30.0" y="207.0" text-anchor="start">hour of day, step mod 24</text>
  <text class="small" x="350.0" y="207.0" text-anchor="start">fraud has no clock here; real fraud has hours</text>
  <text class="bold" x="20.0" y="236.0" text-anchor="start">dropped</text>
  <rect x="20" y="242" width="600" height="20" rx="3" fill="currentColor" fill-opacity="0.05"/>
  <text class="small" x="30" y="256" opacity="0.7">newbalanceOrig, newbalanceDest, balance errors</text>
  <text class="small" x="350.0" y="256.0" text-anchor="start">written by the outcome, after scoring</text>
  <rect x="20" y="265" width="600" height="20" rx="3" fill="currentColor" fill-opacity="0.05"/>
  <text class="small" x="30" y="279" opacity="0.7">isFlaggedFraud</text>
  <text class="small" x="350.0" y="279.0" text-anchor="start">the rule layer's decision, 16 rows</text>
  <rect x="20" y="288" width="600" height="20" rx="3" fill="currentColor" fill-opacity="0.05"/>
  <text class="small" x="30" y="302" opacity="0.7">twin: same-amount TRANSFER earlier this hour</text>
  <text class="small" x="350.0" y="302.0" text-anchor="start">same-step file order is not time order</text>
  <rect x="20" y="311" width="600" height="20" rx="3" fill="currentColor" fill-opacity="0.05"/>
  <text class="small" x="30" y="325" opacity="0.7">oldbalanceDest</text>
  <text class="small" x="350.0" y="325.0" text-anchor="start">0 for every merchant and every new account</text>
  <rect x="20" y="334" width="600" height="20" rx="3" fill="currentColor" fill-opacity="0.05"/>
  <text class="small" x="30" y="348" opacity="0.7">nameOrig, nameDest as values</text>
  <text class="small" x="350.0" y="348.0" text-anchor="start">identifiers: group by them, never feed them</text>
  <rect x="20" y="357" width="600" height="20" rx="3" fill="currentColor" fill-opacity="0.05"/>
  <text class="small" x="30" y="371" opacity="0.7">step, day, traffic in the hour</text>
  <text class="small" x="350.0" y="371.0" text-anchor="start">only the empty days; a step never recurs</text>
  <rect x="20" y="380" width="600" height="20" rx="3" fill="currentColor" fill-opacity="0.05"/>
  <text class="small" x="30" y="394" opacity="0.7">sender windows, sender's hour arc</text>
  <text class="small" x="350.0" y="394.0" text-anchor="start">99.85% of senders appear once</text>
</svg>

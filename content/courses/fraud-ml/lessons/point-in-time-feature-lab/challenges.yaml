              half = []
              for k in kappas:
                  f = np.exp(k * (np.cos(theta) - 1))
                  mass = np.r_[0.0, np.cumsum((f[1:] + f[:-1]) / 2 * np.diff(theta))]
                  half.append(np.interp(alpha, mass / mass[-1], theta))
              return np.interp(np.asarray(kappa, dtype=float), kappas, np.array(half)) * 24 / (2 * np.pi)
          def f(history_hours, query_hours, alpha=0.9):
              theta = np.nan_to_num(np.asarray(history_hours, dtype=float)) * 2 * np.pi / 24
              c_bar = np.mean(np.cos(theta), axis=1); s_bar = np.mean(np.sin(theta), axis=1)
              mu = (np.arctan2(s_bar, c_bar) % (2 * np.pi)) * 24 / (2 * np.pi)
              kappa = kappa_from_rbar(np.hypot(c_bar, s_bar)); c = arc_half_width(kappa, alpha)
              dist = np.abs((np.asarray(query_hours, dtype=float) - mu + 12) % 24 - 12)
              return mu, kappa, c, (dist <= c).astype(np.int64)

  point-in-time-join:
    kind: exact
    seed: 3606
    atol: 0.5
    inputs_code: |
      # A feature log of 12 entities, one record per half hour at most,
      # shuffled; rows on the same half-hour grid (ties with the stamps),
      # some before an entity's first record, some for entities never logged.
      ents, stamps = [], []
      for e in range(12):
          s = np.sort(rng.choice(200, rng.integers(5, 25), replace=False)) * 1800
          ents.append(np.full(len(s), e)); stamps.append(s)
      log_entity, log_t = np.concatenate(ents), np.concatenate(stamps)
      p = rng.permutation(len(log_t))
      log_entity, log_t = log_entity[p], log_t[p]
      row_entity = rng.integers(0, 14, 300)
      row_t = rng.integers(0, 210, 300) * 1800 + rng.choice([0, 0, 0, 600], 300)
      inputs = (row_entity, row_t, log_entity, log_t)
    wrong:
      - hint: "Read the entity's latest record. A row receives what the store held at the row's moment: the record with the largest stamp at or before the row's timestamp, not the newest record in the log."

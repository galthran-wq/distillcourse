              out = np.full(len(row_entity), -1)
              for i, (e, t) in enumerate(zip(row_entity, row_t)):
                  idx = np.flatnonzero(log_entity == e)
                  if len(idx):
                      out[i] = idx[np.argmin(np.abs(log_t[idx] - t))]
              return out
      - hint: "Ignored the entity. The search runs within the row's own entity's records; when that entity has nothing at or before t, the row gets -1, not another entity's record."

  periodic-time-flag:
    kind: exact
    seed: 3505
    atol: 1.0e-6
    inputs_code: |
      m, k = 60, 20
      habit = rng.uniform(0, 24, m)
      habit[:20] = rng.uniform(-3, 3, 20) % 24          # a third of the cards straddle midnight
      conc = rng.uniform(0.5, 8, m)
      n_times = rng.integers(2, k + 1, m)
      hours = np.full((m, k), np.nan)
      for r in range(m):
          draws = rng.vonmises(habit[r] * np.pi / 12, conc[r], n_times[r]) % (2 * np.pi)
          hours[r, :n_times[r]] = np.round(draws * 12 / np.pi, 4)
      query = (habit + rng.normal(0, 4, m)) % 24
      inputs = (hours, query, 0.9)
    wrong:
      - hint: "Averaged the hours as numbers. Clock time lives on a circle: 23:00 and 01:00 average to noon arithmetically. Average the unit vectors (cos, sin) of the angles and take the direction of their mean."
        code: |
          import numpy as np
          from scipy.special import i0e, i1e
          _G = np.r_[0.0, np.geomspace(1e-3, 1e3, 3000)]
          def kappa_from_rbar(rbar):
              rbar = np.asarray(rbar, dtype=float)
              a = i1e(_G) / i0e(_G)
              k = np.interp(rbar, a, _G)
              for _ in range(3):
                  A = i1e(k) / i0e(k)
                  dA = 1 - A / np.maximum(k, 1e-12) - A**2
                  k = np.clip(k - (A - rbar) / np.maximum(dA, 1e-12), 0.0, 1e3)
              return k
          def arc_half_width(kappa, alpha=0.9):
              theta = np.linspace(0, np.pi, 4001)
              kappas = np.r_[0.0, np.geomspace(1e-3, 1e3, 400)]
              half = []
              for k in kappas:
                  f = np.exp(k * (np.cos(theta) - 1))
                  mass = np.r_[0.0, np.cumsum((f[1:] + f[:-1]) / 2 * np.diff(theta))]
                  half.append(np.interp(alpha, mass / mass[-1], theta))
              return np.interp(np.asarray(kappa, dtype=float), kappas, np.array(half)) * 24 / (2 * np.pi)
          def f(history_hours, query_hours, alpha=0.9):
              h = np.asarray(history_hours, dtype=float)
              theta = h * 2 * np.pi / 24
              c_bar = np.nanmean(np.cos(theta), axis=1); s_bar = np.nanmean(np.sin(theta), axis=1)
              mu = np.nanmean(h, axis=1)
              kappa = kappa_from_rbar(np.hypot(c_bar, s_bar)); c = arc_half_width(kappa, alpha)
              dist = np.abs((np.asarray(query_hours, dtype=float) - mu + 12) % 24 - 12)
              return mu, kappa, c, (dist <= c).astype(np.int64)

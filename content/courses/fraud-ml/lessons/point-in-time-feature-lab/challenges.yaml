  find-the-leak:
    kind: review
    rubric: |
      The question: a shipped reference pipeline builds the same 18-column
      feature matrix as the learner's on a simulated card log (label delay 7
      days, nightly terminal job readable at 00:30, as-of join), and a frozen
      logistic regression scores better on it offline (test-week ROC-AUC
      0.915 vs 0.833). The learner must name the leaking feature and why it
      leaks, give the first row where it differs from their own matrix, and
      say what happens to it at serving time.

      The facts: the reference's nightly terminal job computes
      TERMINAL_RISK_1DAY/7DAY/30DAY over the terminal's payments in the last
      w days before the snapshot (strictly earlier rows), with NO shift by
      the 7-day label delay, so it reads labels that had not arrived. The
      first row (log order = time order) where a TERMINAL_RISK column
      differs is row index 2398, 2018-04-02 04:51:34, terminal 2074; the
      reference reads 0.2 there, the honest pipeline 0. The TERMINAL_NB_TX
      columns differ too (unshifted vs shifted window) but are not a leak:
      payment counts need no label.

      Pass if the answer contains all three:
      (a) the feature: the terminal fraud rate / terminal risk (any or all
          of its windows), with the reason — it uses labels of the last 7
          days / of payments after t - delay / labels not yet known at
          scoring time / no delay shift. "Strictly earlier rows is not
          enough for labels" or "the window ends at the snapshot instead of
          delay days before" are equivalent. Naming only the terminal counts
          (NB_TX), a card window, the conditional aggregates, the periodic
          flag or the calendar flags fails (a).
      (b) the row: terminal 2074 and a timestamp of 2 April 2018 at 04:51
          (seconds optional), or row index 2398. Accept the row identified
          by its index or by (terminal, time). If the learner reports a
          different row but explicitly restricts to a single window column,
          accept 2398 / terminal 2074 only; any other row fails (b).
      (c) serving: the live system cannot compute that value (the labels do
          not exist yet; it would be missing, or 0, or the delayed value), so
          the model relies on a signal it never gets in time; and an offline
          score cannot reveal it because training and test rows carry the
          same leak. Either half of (c) with the other implied is enough.

      Not required for a pass: the explanation of why the NB_TX difference
      is harmless. Do not fail an answer for wording, length or for
      mentioning that the counts also differ. Fail an answer that calls the
      NB_TX difference the leak and does not name the risk.


              out = np.full(len(row_entity), -1)
              for i, e in enumerate(row_entity):
                  idx = np.flatnonzero(log_entity == e)
                  if len(idx):
                      out[i] = idx[np.argmax(log_t[idx])]
              return out
      - hint: "Excluded a record stamped at exactly the row's time. The record is readable from its stamp on: a row at 00:30:00 reads the record stamped 00:30:00 (largest stamp <= t)."
        code: |
          import numpy as np

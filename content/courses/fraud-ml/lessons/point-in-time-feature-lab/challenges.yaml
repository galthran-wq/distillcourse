              log_entity = np.asarray(log_entity, dtype=np.int64); log_t = np.asarray(log_t, dtype=np.int64)
              row_entity = np.asarray(row_entity, dtype=np.int64)
              order = np.lexsort((log_t, log_entity))
              composite = log_entity[order] * 10**11 + log_t[order]
              pos = np.searchsorted(composite, row_entity * 10**11 + np.asarray(row_t, dtype=np.int64), side="right") - 1
              hit = np.maximum(pos, 0)

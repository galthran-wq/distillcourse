  terminal-risk-delayed:
    kind: exact
    seed: 3404
    atol: 1.0e-6
    inputs_code: |
      n = 900
      term = rng.integers(0, 12, n)
      t = rng.integers(0, 60 * 24, n) * 3600
      start = rng.integers(5, 50, 12)                    # each terminal's compromise day
      fraud = ((t // 86400 >= start[term]) & (t // 86400 < start[term] + 10)).astype(float)
      fraud[rng.random(n) < 0.02] = 1.0
      # Queries on the same hourly grid (window edges fall on payments), plus
      # two terminals with no payments at all.
      q_term = rng.integers(0, 14, 300)
      q_t = rng.integers(0, 62 * 24, 300) * 3600
      p = rng.permutation(n)
      inputs = (term[p], t[p], fraud[p], q_term, q_t, 5)
    wrong:
      - hint: "No delay: the window ends at the query time. At time t the labels known are those of payments up to t - delay; the window is (t - delay - w, t - delay]."
        code: |
          import numpy as np
          def f(term, t, fraud, q_term, q_t, delay_days):
              term, t, fraud = np.asarray(term), np.asarray(t), np.asarray(fraud, float)
              q_term, q_t = np.asarray(q_term), np.asarray(q_t)
              same = q_term[:, None] == term[None, :]
              cols = []
              for w in (1, 7, 30):
                  m = same & (t[None, :] > q_t[:, None] - w * 86400) & (t[None, :] <= q_t[:, None])
                  n = m.sum(1).astype(float); fr = (m * fraud[None, :]).sum(1)

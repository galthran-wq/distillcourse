checkpoints:
  calendar-flags:
    kind: exact
    seed: 3101
    atol: 0.5
    inputs_code: |
      start = np.datetime64("2018-01-01T00:00:00")
      random = start + rng.integers(0, 730 * 86400, 180).astype("timedelta64[s]")
      # Hour and weekday boundaries: 05:59:59, 06:00:00, 06:59:59 on a Friday,
      # Saturday, Sunday and Monday.
      edges = np.array([f"2018-06-{d:02d}T{hms}" for d in (1, 2, 3, 4)
                        for hms in ("05:59:59", "06:00:00", "06:59:59", "00:00:00", "23:59:59")],
                       dtype="datetime64[s]")
      ts = np.concatenate([random, edges])
      inputs = (ts[rng.permutation(len(ts))],)
    wrong:
      - hint: "Night includes the 06:00 hour. Night is before 06:00: a payment at 06:00:00 or 06:30 is a morning payment, so the test is hour < 6, not hour <= 6."
        code: |
          import numpy as np, pandas as pd
          def f(timestamps):
              ts = pd.DatetimeIndex(pd.to_datetime(timestamps))
              return np.asarray((ts.dayofweek >= 5).astype(np.int64)), np.asarray((ts.hour <= 6).astype(np.int64))
      - hint: "The weekend flag misses Saturday. pandas numbers Monday 0 to Sunday 6, so the weekend is dayofweek >= 5; dayofweek > 5 keeps only Sunday."
        code: |
          import numpy as np, pandas as pd
          def f(timestamps):
              ts = pd.DatetimeIndex(pd.to_datetime(timestamps))
              return np.asarray((ts.dayofweek > 5).astype(np.int64)), np.asarray((ts.hour < 6).astype(np.int64))

  customer-windows:
    kind: exact
    seed: 3202
    atol: 1.0e-6
    inputs_code: |
      n = 500
      card = rng.integers(0, 15, n)
      # Whole hours over 40 days: payments exactly 1 or 7 days apart and
      # same-card payments at the same second both occur.
      t = rng.integers(0, 40 * 24, n) * 3600
      amount = np.round(rng.lognormal(3.5, 0.8, n), 2)
      inputs = (card, t, amount)
    wrong:
      - hint: "The payment is inside its own window. The window holds the card's payments strictly before t: (t - w, t), not (t - w, t] as rolling(\"7d\") gives without closed=\"neither\"."
        code: |
          import numpy as np
          def f(card, t, amount):
              card = np.asarray(card); t = np.asarray(t); amount = np.asarray(amount, float)
              same = card[:, None] == card[None, :]
              cols = []
              for w in (1, 7, 30):
                  m = same & (t[None, :] > t[:, None] - w * 86400) & (t[None, :] <= t[:, None])
                  n = m.sum(1).astype(float); s = (m * amount[None, :]).sum(1)
                  cols += [n, np.where(n > 0, s / np.maximum(n, 1), 0.0)]
              return np.column_stack(cols)
      - hint: "A payment exactly w before is inside the window. The window is open at both ends: t - w < t_j, so a payment 24 hours earlier is not in the 1-day window."
        code: |
          import numpy as np
          def f(card, t, amount):
              card = np.asarray(card); t = np.asarray(t); amount = np.asarray(amount, float)
              same = card[:, None] == card[None, :]
              cols = []
              for w in (1, 7, 30):
                  m = same & (t[None, :] >= t[:, None] - w * 86400) & (t[None, :] < t[:, None])
                  n = m.sum(1).astype(float); s = (m * amount[None, :]).sum(1)
                  cols += [n, np.where(n > 0, s / np.maximum(n, 1), 0.0)]
              return np.column_stack(cols)
      - hint: "Same-second payments counted as earlier. Two payments of a card at the same second are not before each other; ordering them by row position puts one inside the other's window."
        code: |
          import numpy as np
          def f(card, t, amount):
              card = np.asarray(card); t = np.asarray(t); amount = np.asarray(amount, float)
              order = np.lexsort((t, card)); rank = np.empty(len(t), int); rank[order] = np.arange(len(t))
              same = card[:, None] == card[None, :]
              cols = []
              for w in (1, 7, 30):
                  m = same & (t[None, :] > t[:, None] - w * 86400) & (rank[None, :] < rank[:, None])
                  n = m.sum(1).astype(float); s = (m * amount[None, :]).sum(1)
                  cols += [n, np.where(n > 0, s / np.maximum(n, 1), 0.0)]
              return np.column_stack(cols)
      - hint: "Assumed the rows arrive in time order. The checker's rows are shuffled: \"earlier\" means an earlier timestamp, not an earlier row of the input; sort by (card, time) and scatter the results back."
        code: |
          import numpy as np
          def f(card, t, amount):
              card = np.asarray(card); t = np.asarray(t); amount = np.asarray(amount, float)
              same = card[:, None] == card[None, :]
              before = np.tri(len(t), k=-1, dtype=bool)
              cols = []
              for w in (1, 7, 30):
                  m = same & before & (t[None, :] > t[:, None] - w * 86400)
                  n = m.sum(1).astype(float); s = (m * amount[None, :]).sum(1)
                  cols += [n, np.where(n > 0, s / np.maximum(n, 1), 0.0)]
              return np.column_stack(cols)

  conditional-aggregates:
    kind: exact
    seed: 3303
    atol: 1.0e-6
    inputs_code: |
      # The seven-payment card (card 0, hours from 1 Jan 2018), then 300
      # payments of eight more cards; rows shuffled.
      t7 = np.array([18*60+20, 20*60+35, 22*60+30, 24*60+50, 43*60+18, 47*60+45, 48*60]) * 60
      type7 = np.array(["POS", "POS", "ATM", "POS", "POS", "POS", "POS"])
      country7 = np.array(["LU", "LU", "LU", "DE", "DE", "DE", "LU"])
      amount7 = np.array([250.0, 400.0, 250.0, 50.0, 100.0, 150.0, 10.0])
      n = 300
      card = np.r_[np.zeros(7, int), rng.integers(1, 9, n)]
      t = np.r_[t7, rng.integers(0, 10 * 24 * 4, n) * 900]
      amount = np.r_[amount7, np.round(rng.lognormal(3.5, 0.8, n), 2)]
      tx_type = np.r_[type7, rng.choice(["POS", "ATM", "ONLINE"], n, p=[0.6, 0.2, 0.2])]
      country = np.r_[country7, rng.choice(["LU", "DE", "FR"], n, p=[0.5, 0.3, 0.2])]
      p = rng.permutation(len(t))
      inputs = (card[p], t[p], amount[p], tx_type[p], country[p], 86400)
    wrong:
      - hint: "Conditioned on the type only. The key is the pair (type, country): the seven-payment card's fourth payment, its first in Germany, has an empty window although POS payments precede it."
        code: |
          import numpy as np
          def f(card, t, amount, tx_type, country, width):
              card = np.asarray(card); t = np.asarray(t); amount = np.asarray(amount, float); g = np.asarray(tx_type)
              m = (card[:, None] == card[None, :]) & (g[:, None] == g[None, :])
              m &= (t[None, :] > t[:, None] - width) & (t[None, :] < t[:, None])
              return m.sum(1).astype(float), (m * amount[None, :]).sum(1)
      - hint: "Conditioned on the country only. The key is the pair (type, country): the seven-payment card's third payment, its first cash withdrawal, has an empty window although Luxembourg payments precede it."
        code: |
          import numpy as np
          def f(card, t, amount, tx_type, country, width):
              card = np.asarray(card); t = np.asarray(t); amount = np.asarray(amount, float); g = np.asarray(country)
              m = (card[:, None] == card[None, :]) & (g[:, None] == g[None, :])
              m &= (t[None, :] > t[:, None] - width) & (t[None, :] < t[:, None])
              return m.sum(1).astype(float), (m * amount[None, :]).sum(1)
      - hint: "Left the card out of the key. The window holds the card's own earlier payments of the same type and country; keyed on (type, country) alone it counts every card's payments of that kind."
        code: |
          import numpy as np
          def f(card, t, amount, tx_type, country, width):
              t = np.asarray(t); amount = np.asarray(amount, float)
              a, b = np.asarray(tx_type), np.asarray(country)
              m = (a[:, None] == a[None, :]) & (b[:, None] == b[None, :])
              m &= (t[None, :] > t[:, None] - width) & (t[None, :] < t[:, None])
              return m.sum(1).astype(float), (m * amount[None, :]).sum(1)
      - hint: "The payment is inside its own conditional window. As for the plain window, only the card's strictly earlier payments count."
        code: |
          import numpy as np
          def f(card, t, amount, tx_type, country, width):
              card = np.asarray(card); t = np.asarray(t); amount = np.asarray(amount, float)
              a, b = np.asarray(tx_type), np.asarray(country)
              m = (card[:, None] == card[None, :]) & (a[:, None] == a[None, :]) & (b[:, None] == b[None, :])

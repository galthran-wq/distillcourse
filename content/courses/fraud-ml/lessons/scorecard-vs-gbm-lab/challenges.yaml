                  for c, cand in enumerate(cands):
                      s = fit_and_score(tr, cand)[te]
                      t[c, j] = (ap(labels[te], s), cp(days[te], cards[te], s, labels[te], k))
              return t.mean(axis=1)
          def f(grid, n_draws, seed, fit_and_score, days, cards, labels, deploy_start, n_folds, dtr, ddel, dte, k):
              drawn = np.random.default_rng(seed).choice(len(grid), n_draws, replace=False)
              cands = [grid[i] for i in drawn]
              V = table(split(days, cards, labels, deploy_start - ddel - dte, n_folds, dtr, ddel, dte), n_folds, cands, fit_and_score, days, cards, labels, k)
              T = V.copy()
              best = V.argmax(axis=0)
              return drawn, V, T, drawn[best], T[best, [0, 1]], T.max(axis=0)

  which-to-ship:
    kind: review
    rubric: |
      The question: the learner built a WOE points scorecard and tuned a
      boosted tree by random search on prequential folds, then scored both
      on the same three test folds of a simulated card log by average
      precision, card precision at 20 and savings (Bayes-minimum-risk alerts
      at an investigator cost C_a, against the cheaper trivial policy),
      with savings also shown over C_a from 1 to 20 euros. They must
      recommend one detector to a head of fraud operations.

      On the reference run the boosted tree saves about 0.45 of the
      baseline cost at C_a = 5 euros against about 0.19 for the card (fold
      spreads 0.02 and 0.06); average precision about 0.47 against 0.14;
      card precision at 20 about 0.30 against 0.19 (spreads 0.03-0.04). The
      savings gap widens with the alert cost: about 0.54 against 0.37 at 2
      euros, 0.28 against 0.05 at 15 euros. A learner's own numbers may
      differ somewhat (different binning, shortlist or refit choices); judge
      consistency with the numbers they quote, not equality with these.

      Pass if the answer contains all three:
      (a) numbers from a run — at least a savings figure (or cost in euros)
          for each detector, plus at least one ranking metric (AP or CP@20);
      (b) a money comparison: the savings gap stated and related to the
          spread over folds (or otherwise argued to be real rather than
          noise), and a statement of how the comparison moves with the
          alert cost (e.g. at 2 and 15 euros) or why it does not;
      (c) the named trade-off: what the losing detector buys that the
          numbers do not price — for the card, reviewability /
          line-by-line explanations / regulatory acceptability / visible
          sign checks; for the tree, the extra savings or precision — and
          a condition under which the choice would reverse.

      Fail if the verdict has no cost or savings figure; if it is decided
      on ROC-AUC or a single ranking metric alone; if it reads a gap
      smaller than the fold spread as decisive; or if it names no
      trade-off.


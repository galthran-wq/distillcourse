<svg viewBox="0 0 600 250" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .bold { fill: currentColor; font-weight: 600; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .axis { stroke: currentColor; stroke-width: 1; fill: none; }
    .guide { stroke: currentColor; stroke-dasharray: 3 3; opacity: 0.5; fill: none; }
    .cell { stroke: currentColor; stroke-opacity: 0.35; fill: none; }
  </style>
  <rect x="186.0" y="19.0" width="128.0" height="30.0" rx="5" class="cell"/>
  <text x="250.0" y="38.0" text-anchor="middle" class="label">online payment?</text>
  <rect x="66.0" y="95.0" width="108.0" height="30.0" rx="5" class="cell"/>

  <rect x="25.0" y="175.0" width="70.0" height="30.0" rx="5" class="cell"/>
  <text x="60.0" y="194.0" text-anchor="middle" class="label">leaf</text>
  <rect x="145.0" y="175.0" width="70.0" height="30.0" rx="5" class="cell"/>
  <text x="180.0" y="194.0" text-anchor="middle" class="label">leaf</text>
  <rect x="285.0" y="175.0" width="70.0" height="30.0" rx="5" fill="#e2903a" fill-opacity="0.28"/>
  <text x="320.0" y="194.0" text-anchor="middle" class="label">leaf</text>
  <rect x="405.0" y="175.0" width="70.0" height="30.0" rx="5" fill="#e2903a" fill-opacity="0.28"/>
  <text x="440.0" y="194.0" text-anchor="middle" class="label">leaf</text>
  <line x1="214.0" y1="50.0" x2="140.0" y2="94.0" class="axis"/>
  <line x1="286.0" y1="50.0" x2="360.0" y2="94.0" class="axis"/>
  <line x1="100.0" y1="126.0" x2="70.0" y2="174.0" class="axis"/>
  <line x1="140.0" y1="126.0" x2="170.0" y2="174.0" class="axis"/>
  <line x1="360.0" y1="126.0" x2="330.0" y2="174.0" class="axis"/>

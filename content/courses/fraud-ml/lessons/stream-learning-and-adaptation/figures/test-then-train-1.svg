<svg viewBox="0 0 600 262" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .bold { fill: currentColor; font-weight: 600; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .axis { stroke: currentColor; stroke-width: 1; fill: none; }
    .guide { stroke: currentColor; stroke-dasharray: 3 3; opacity: 0.5; fill: none; }
    .cell { stroke: currentColor; stroke-opacity: 0.35; fill: none; }
  </style>
  <text x="20.0" y="22.0" text-anchor="start" class="label">Learner: for each terminal, say the label it last saw there (genuine if none).</text>
  <text x="20.0" y="42.0" text-anchor="start" class="bold" style="fill:#4c8dd6">Predict, then score, then learn</text>
  <text x="20.0" y="70.0" text-anchor="start" class="muted">item</text>
  <text x="78.0" y="70.0" text-anchor="start" class="muted">memory when it predicts</text>
  <text x="278.0" y="70.0" text-anchor="start" class="muted">prediction</text>
  <text x="378.0" y="70.0" text-anchor="start" class="muted">true label</text>
  <text x="478.0" y="70.0" text-anchor="start" class="muted">right?</text>
  <line x1="20.0" y1="76.0" x2="580.0" y2="76.0" class="axis"/>
  <text x="20.0" y="98.0" text-anchor="start" class="label">1  T7</text>
  <text x="78.0" y="98.0" text-anchor="start" class="label">empty</text>
  <text x="278.0" y="98.0" text-anchor="start" class="label">genuine</text>
  <text x="378.0" y="98.0" text-anchor="start" class="label">genuine</text>
  <text x="478.0" y="98.0" text-anchor="start" class="label" style="fill:#5aa46a" font-weight="600">right</text>
  <text x="20.0" y="128.0" text-anchor="start" class="label">2  T3</text>
  <text x="278.0" y="128.0" text-anchor="start" class="muted">…</text>
  <text x="20.0" y="158.0" text-anchor="start" class="label">3  T3</text>
  <text x="278.0" y="158.0" text-anchor="start" class="muted">…</text>
  <text x="20.0" y="188.0" text-anchor="start" class="label">4  T7</text>
  <text x="278.0" y="188.0" text-anchor="start" class="muted">…</text>
  <line x1="20.0" y1="214.0" x2="580.0" y2="214.0" class="axis"/>
  <text x="20.0" y="240.0" text-anchor="start" class="muted">The prediction goes out first. The label, when it arrives, is scored, then learned from.</text>
</svg>

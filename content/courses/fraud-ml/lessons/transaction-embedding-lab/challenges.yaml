  slice-sampler:
    kind: exact
    seed: 101
    atol: 0.5
    inputs_code: |
      # Histories shorter than, equal to and longer than max_len, and one of exactly min_len.
      inputs = ([40, 64, 65, 200, 15, 1000], 5, 15, 64, 2024)
    wrong:
      - hint: "An over-long length is clipped to the history's length instead of being drawn from the lengths that fit, so draws pile up on the longest slice."
        code: |
          def f(ns, k, min_len, max_len, seed):
              import numpy as np
              rng = np.random.default_rng(seed)
              out = []
              for n in ns:
                  for _ in range(k):
                      length = min(int(rng.integers(min_len, max_len + 1)), n)
                      start = int(rng.integers(0, n - length + 1))
                      out.append((start, length))
              return np.array(out)
      - hint: "The start is drawn from the whole history, so a slice can run past its last event."
        code: |
          def f(ns, k, min_len, max_len, seed):
              import numpy as np
              rng = np.random.default_rng(seed)
              out = []
              for n in ns:
                  for _ in range(k):
                      length = int(rng.integers(min_len, min(max_len, n) + 1))
                      start = int(rng.integers(0, n))
                      out.append((start, length))
              return np.array(out)

  coles-loss:
    kind: exact
    seed: 202
    atol: 1.0e-6
    inputs_code: |
      # Four clients, two slices each, rows of unequal length; the clients share
      # a common direction, so some negative pairs fall inside the margin.
      common = rng.normal(size=16)
      centres = common + 0.7 * rng.normal(size=(4, 16))
      z = np.repeat(centres, 2, axis=0) + 0.35 * rng.normal(size=(8, 16))
      z = z * rng.uniform(0.5, 2.0, size=(8, 1))
      inputs = (z, np.repeat(np.arange(4), 2), 0.8)
    wrong:
      - hint: "Each row is paired with itself: the diagonal entered the positive pairs."
        code: |
          def f(z, client_ids, margin):
              import torch
              import torch.nn.functional as F
              z = F.normalize(torch.tensor(z), dim=1)
              ids = torch.tensor(client_ids)
              d2 = (2 - 2 * z @ z.T).clamp(min=1e-12)
              same = ids[:, None] == ids[None, :]
              neg = 0.5 * (margin - d2.sqrt()[~same]).clamp(min=0) ** 2
              return torch.cat([0.5 * d2[same], neg]).mean().item()
      - hint: "The negative term has no clamp at zero: pairs beyond the margin are pulled back towards it."
        code: |
          def f(z, client_ids, margin):
              import torch
              import torch.nn.functional as F
              z = F.normalize(torch.tensor(z), dim=1)
              ids = torch.tensor(client_ids)
              d2 = (2 - 2 * z @ z.T).clamp(min=1e-12)
              same = ids[:, None] == ids[None, :]
              off = ~torch.eye(len(z), dtype=torch.bool)
              neg = 0.5 * (margin - d2.sqrt()[~same]) ** 2
              return torch.cat([0.5 * d2[same & off], neg]).mean().item()
      - hint: "The rows were not normalised: 2 - 2 u.v is the squared distance only between unit vectors."
        code: |
          def f(z, client_ids, margin):

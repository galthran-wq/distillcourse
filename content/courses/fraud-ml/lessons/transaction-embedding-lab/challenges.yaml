  paired-client-bootstrap:
    kind: exact
    seed: 707
    atol: 1.0e-9
    inputs_code: |
      # 40 clients with three rows each, in shuffled row order; two targets; model b less noisy than a.
      client_ids = rng.permutation(np.repeat(np.arange(100, 140), 3))
      signal = rng.normal(size=(120, 2))
      y = (signal + rng.normal(size=(120, 2)) > 1.2).astype(int)
      a = signal + 1.5 * rng.normal(size=(120, 2))
      b = signal + 1.0 * rng.normal(size=(120, 2))
      inputs = (y, a, b, client_ids, 300, 7)
    wrong:
      - hint: "Rows were resampled instead of clients: a client's rows are not independent, and the interval comes out too narrow."
        code: |
          def f(y, score_a, score_b, client_ids, n_boot, seed):
              import numpy as np
              from sklearn.metrics import roc_auc_score
              rng = np.random.default_rng(seed)
              stats = []
              for _ in range(n_boot):
                  rows = rng.integers(0, len(y), len(y))
                  d = [roc_auc_score(y[rows, j], score_b[rows, j]) - roc_auc_score(y[rows, j], score_a[rows, j])
                       for j in range(y.shape[1]) if y[rows, j].min() != y[rows, j].max()]
                  stats.append(np.mean(d))
              return np.percentile(stats, [2.5, 97.5])
      - hint: "Each model's interval was taken separately and the ends subtracted; the statistic must be the difference on the same draw."
        code: |
          def f(y, score_a, score_b, client_ids, n_boot, seed):
              import numpy as np
              from sklearn.metrics import roc_auc_score
              rng = np.random.default_rng(seed)
              _, inv = np.unique(client_ids, return_inverse=True)
              members = [np.flatnonzero(inv == c) for c in range(inv.max() + 1)]
              sa, sb = [], []
              for _ in range(n_boot):
                  rows = np.concatenate([members[c] for c in rng.integers(0, len(members), len(members))])
                  keep = [j for j in range(y.shape[1]) if y[rows, j].min() != y[rows, j].max()]
                  sa.append(np.mean([roc_auc_score(y[rows, j], score_a[rows, j]) for j in keep]))
                  sb.append(np.mean([roc_auc_score(y[rows, j], score_b[rows, j]) for j in keep]))
              return np.percentile(sb, [2.5, 97.5]) - np.percentile(sa, [2.5, 97.5])


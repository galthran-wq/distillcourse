  window-aggregates:
    kind: exact
    seed: 606
    atol: 1.0e-6
    inputs_code: |
      # Fourteen events over 120 days; cuts before every event, exactly at an event, after the last.
      T0 = 1640995200
      t = np.sort(T0 + rng.integers(0, 120 * 86400, 14))
      seq = {"t": t, "amount": np.round(rng.lognormal(7, 1.5, 14), 2), "event_type": rng.integers(1, 5, 14),
             "src_type11": rng.integers(1, 4, 14), "dst_type11": rng.integers(1, 4, 14),
             "dst_type12": rng.integers(1, 7, 14)}
      cuts = np.array([T0 - 86400, t[9], T0 + 121 * 86400])
      inputs = (seq, cuts, (30, 90, 10000), [2, 1, 3], [1, 3])
    wrong:
      - hint: "searchsorted(side='right') at the cut lets an event stamped exactly at the cut into the window."
        code: |
          def f(seq, cuts, windows, top_types, top_src):
              import numpy as np
              t, la = seq["t"], np.log1p(seq["amount"])
              it = (seq["event_type"][:, None] == np.asarray(top_types)[None, :]).astype(float)
              isr = (seq["src_type11"][:, None] == np.asarray(top_src)[None, :]).astype(float)
              V = np.column_stack([np.ones(len(t)), la, la ** 2, it, it * la[:, None], isr])
              P = np.vstack([np.zeros(V.shape[1]), np.cumsum(V, axis=0)])
              hi = np.searchsorted(t, cuts, side="right")
              out, k = [], len(top_types)
              for w in windows:
                  lo = np.searchsorted(t, cuts - w * 86400, side="left")
                  S = P[hi] - P[lo]
                  n = S[:, 0]
                  mean = S[:, 1] / np.maximum(n, 1)
                  var = np.maximum(S[:, 2] / np.maximum(n, 1) - mean ** 2, 0.0)
                  dist = np.array([len(np.unique(seq["dst_type12"][a:b])) for a, b in zip(lo, hi)], float)
                  out += [n[:, None], mean[:, None], var[:, None], dist[:, None], S[:, 3:3 + k], S[:, 3 + k:3 + 2 * k], S[:, 3 + 2 * k:]]
              last = np.where(hi > 0, (cuts - t[np.maximum(hi - 1, 0)]) / 86400, 9999.0)
              return np.column_stack(out + [last[:, None]])
      - hint: "The prefix array has no leading zero row, and indexing it with hi - 1 and lo - 1 wraps to the last row when lo or hi is 0."
        code: |
          def f(seq, cuts, windows, top_types, top_src):
              import numpy as np
              t, la = seq["t"], np.log1p(seq["amount"])
              it = (seq["event_type"][:, None] == np.asarray(top_types)[None, :]).astype(float)
              isr = (seq["src_type11"][:, None] == np.asarray(top_src)[None, :]).astype(float)

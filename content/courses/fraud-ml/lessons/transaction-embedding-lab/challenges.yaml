                  gru = nn.GRU(2 + sum(e.embedding_dim for e in emb.values()), hidden, batch_first=True)
                  def enc(batch):
                      x = [torch.cat([num] + [emb[k](c[k]) for k in emb], 1) for num, c in batch]
                      out, h = gru(nn.utils.rnn.pack_sequence(x, enforce_sorted=False))
                      return F.normalize(h[-1], dim=1), out
                  rng = np.random.default_rng(seed)
                  params = list(emb.parameters()) + list(gru.parameters())
                  opt = torch.optim.Adam(params, lr=hyper["lr"])
                  pool = np.flatnonzero(n_usable)
                  losses = []
                  for _ in range(n_steps):
                      batch, ids = [], []
                      for j, c in enumerate(rng.choice(pool, hyper["batch_clients"], replace=False)):
                          n = int(n_usable[c])
                          for _ in range(hyper["k"]):
                              L = int(rng.integers(hyper["min_len"], min(hyper["max_len"], n) + 1))
                              st = int(rng.integers(0, n - L + 1))
                              batch.append(feat(seqs[c], np.arange(st, st + L)))
                              ids.append(j)
                      z, _ = enc(batch)
                      ids = torch.tensor(ids)
                      d2 = (2 - 2 * z @ z.T).clamp(min=1e-12)
                      d = d2.sqrt()
                      same = ids[:, None] == ids[None, :]
                      off = ~torch.eye(len(z), dtype=torch.bool)
                      idx = d.detach().masked_fill(same, float("inf")).topk(hyper["n_hard"], dim=1, largest=False).indices
                      neg = 0.5 * (hyper["margin"] - d.gather(1, idx)).clamp(min=0) ** 2
                      loss = torch.cat([0.5 * d2[same & off], neg.reshape(-1)]).mean()
                      loss.backward()
                      opt.step()
                      losses.append(loss.item())
                  rows = []
                  with torch.no_grad():
                      for q, c in zip(query, cuts):
                          s = seqs[q]
                          _, out = enc([feat(s, np.arange(len(s["t"])))])
                          S = F.normalize(nn.utils.rnn.pad_packed_sequence(out, batch_first=True)[0][0], dim=1).numpy()
                          n = np.searchsorted(s["t"], c, side="left")
                          r = S[np.maximum(n - 1, 0)].copy()
                          r[n == 0] = 0
                          rows.append(r)
                  return np.asarray(losses), np.concatenate(rows)
              finally:
                  torch.set_default_dtype(torch.float32)

  what-the-interval-licenses:
    kind: review
    rubric: |
      The learner read three label budgets (all, 10%, 3% of training clients),
      each with two 95% client-bootstrap intervals of a difference in mean
      ROC-AUC (embedding minus aggregates, rank average minus aggregates), and
      a point-in-time trap that moved the embedding's score.
      Pass when the answer does all of the following:
      (a) reads each interval against zero: an interval containing zero
          licenses neither "better" nor "worse"; one clear of zero licenses
          the reading for those clients and months. Numbers may be the
          learner's own; judge the reading, not the values. In the reference
          run both intervals span zero at all labels and are clear of zero at
          10% and 3%.
      (b) treats "pretraining pays when labels are scarce" as a pattern across
          budgets, not as a single interval;
      (c) names at least two sources of variation or selection the client
          bootstrap does not cover: one pretraining seed, one draw of the
          labelled clients, fixed model settings, the over-sampled buyers
          (half the clients against about a fifth naturally), several
          comparisons at once, the particular months;
      (d) refuses the fraud reading (the data has no fraud label) and the
          comparison with the published 0.78-0.82 (different cut and mix);
      (e) says the trap would have inflated the embedding's score and so the
          embedding-minus-aggregates difference.
      Fail an answer that declares "the embedding wins" or "the fusion wins"
      at full labels without reference to an interval, or that reads
      overlapping per-model intervals instead of the paired difference.
      A reasonable omission of one point in (c) is acceptable if (a), (d) and
      (e) are clearly met.


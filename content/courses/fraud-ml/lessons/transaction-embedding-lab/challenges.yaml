  pretrain-and-embed:
    kind: exact
    seed: 909
    atol: 1.0e-5
    inputs_code: |
      # 24 short histories, three of them unusable; 12 steps of a 4-unit encoder,
      # then the embeddings of four clients at three cuts each.
      vocab = {"event_type": 5, "src_type11": 4, "dst_type11": 6, "dst_type12": 9}
      T0 = 1640995200
      seqs = []
      for _ in range(24):
          n = int(rng.integers(20, 50))
          seq = {"t": T0 + np.cumsum(rng.integers(600, 3 * 86400, n)), "amount": np.round(rng.lognormal(8, 2, n), 2)}
          for k, m in vocab.items():
              seq[k] = rng.integers(0, m, n)
          seqs.append(seq)
      n_usable = np.array([len(s["t"]) - int(rng.integers(0, 10)) for s in seqs])
      n_usable[[2, 7, 13]] = 0
      hyper = {"batch_clients": 6, "k": 2, "min_len": 5, "max_len": 12, "margin": 0.8, "n_hard": 2, "lr": 0.01}
      query = [0, 5, 9, 17]
      cuts = [seqs[q]["t"][[3, 10, 19]] for q in query]
      inputs = (7, vocab, 4, seqs, n_usable, 12, (8.0, 2.0), hyper, query, cuts)
    wrong:
      - hint: "The gradients were never cleared: each step's update carries every earlier step's gradient too."
        code: |
          def f(seed, vocab, hidden, seqs, n_usable, n_steps, scale, hyper, query, cuts):
              import numpy as np

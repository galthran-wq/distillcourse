  hard-negatives:
    kind: exact
    seed: 303
    atol: 1.0e-6
    inputs_code: |
      # Four clients, two slices each, as for the loss; three hard negatives per row.
      common = rng.normal(size=16)
      centres = common + 0.7 * rng.normal(size=(4, 16))
      z = np.repeat(centres, 2, axis=0) + 0.35 * rng.normal(size=(8, 16))
      z = z * rng.uniform(0.5, 2.0, size=(8, 1))
      inputs = (z, np.repeat(np.arange(4), 2), 0.8, 3)
    wrong:
      - hint: "Only the row itself is excluded, so a slice of the same client can be picked as a hard negative."
        code: |
          def f(z, client_ids, margin, n_hard):
              import torch
              import torch.nn.functional as F
              u = F.normalize(torch.tensor(z), dim=1)
              ids = torch.tensor(client_ids)
              d2 = (2 - 2 * u @ u.T).clamp(min=1e-12)
              d = d2.sqrt()
              same = ids[:, None] == ids[None, :]
              off = ~torch.eye(len(u), dtype=torch.bool)
              idx = torch.cdist(u, u).masked_fill(~off, float("inf")).topk(n_hard, dim=1, largest=False).indices
              neg = 0.5 * (margin - d.gather(1, idx)).clamp(min=0) ** 2
              return idx.numpy().astype(float), torch.cat([0.5 * d2[same & off], neg.reshape(-1)]).mean().item()
      - hint: "The farthest other-client slices were taken instead of the nearest: they sit beyond the margin and carry no gradient."
        code: |
          def f(z, client_ids, margin, n_hard):
              import torch
              import torch.nn.functional as F
              u = F.normalize(torch.tensor(z), dim=1)
              ids = torch.tensor(client_ids)
              d2 = (2 - 2 * u @ u.T).clamp(min=1e-12)
              d = d2.sqrt()
              same = ids[:, None] == ids[None, :]
              off = ~torch.eye(len(u), dtype=torch.bool)
              idx = torch.cdist(u, u).masked_fill(same, -1.0).topk(n_hard, dim=1, largest=True).indices
              neg = 0.5 * (margin - d.gather(1, idx)).clamp(min=0) ** 2
              return idx.numpy().astype(float), torch.cat([0.5 * d2[same & off], neg.reshape(-1)]).mean().item()

  slice-encoder:
    kind: exact
    seed: 404
    atol: 1.0e-6
    inputs_code: |
      # Five sequences of unequal length, unsorted, one of a single event; a GRU of 6 units.
      vocab = {"event_type": 5, "src_type11": 4, "dst_type11": 6, "dst_type12": 9}
      batch = []
      for L in [7, 3, 11, 1, 5]:
          cats = {k: rng.integers(0, n, L) for k, n in vocab.items()}
          batch.append((rng.normal(size=(L, 2)), cats))
      inputs = (3, vocab, 6, batch)
    wrong:
      - hint: "The batch was padded and run without packing: a short sequence's final state is its state after the padding."
        code: |
          def f(seed, vocab, hidden, batch):
              import torch
              import torch.nn.functional as F
              from torch import nn
              torch.set_default_dtype(torch.float64)
              try:
                  torch.manual_seed(seed)
                  emb = nn.ModuleDict({k: nn.Embedding(n, min(32, 4 + int(n ** 0.5))) for k, n in vocab.items()})
                  gru = nn.GRU(2 + sum(e.embedding_dim for e in emb.values()), hidden, batch_first=True)
                  with torch.no_grad():
                      x = [torch.cat([torch.tensor(num)] + [emb[k](torch.as_tensor(c[k])) for k in emb], dim=1) for num, c in batch]
                      _, h = gru(nn.utils.rnn.pad_sequence(x, batch_first=True))
                      return F.normalize(h[-1], dim=1).numpy()
              finally:
                  torch.set_default_dtype(torch.float32)
      - hint: "The mean of the states was returned instead of the state after the last event."
        code: |

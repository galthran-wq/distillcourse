  embed-at-cuts:
    kind: exact
    seed: 505
    atol: 1.0e-6
    inputs_code: |
      # Six clients, three cuts each: before every event, exactly at an event,
      # after the last; one client has a single event. A GRU of 3 units.
      vocab = {"event_type": 5, "src_type11": 4, "dst_type11": 6, "dst_type12": 9}
      T0 = 1640995200
      seqs, cuts = [], []
      for n in [6, 12, 1, 9, 20, 4]:
          t = T0 + np.cumsum(rng.integers(600, 4 * 86400, n))
          seq = {"t": t, "amount": np.round(rng.lognormal(8, 2, n), 2)}
          for k, m in vocab.items():
              seq[k] = rng.integers(0, m, n)
          seqs.append(seq)
          cuts.append(np.array([t[0] - 3600, t[n // 2], t[-1] + 86400]))
      inputs = (5, vocab, 3, seqs, cuts, (8.0, 2.0))
    wrong:
      - hint: "searchsorted(side='right') counts an event stamped exactly at the cut as before it: that event belongs to the month being predicted."
        code: |
          def f(seed, vocab, hidden, seqs, cuts, scale):
              import numpy as np
              import torch
              import torch.nn.functional as F
              from torch import nn
              torch.set_default_dtype(torch.float64)
              try:
                  torch.manual_seed(seed)
                  emb = nn.ModuleDict({k: nn.Embedding(n, min(32, 4 + int(n ** 0.5))) for k, n in vocab.items()})
                  gru = nn.GRU(2 + sum(e.embedding_dim for e in emb.values()), hidden, batch_first=True)
                  out = []
                  with torch.no_grad():
                      for s, c in zip(seqs, cuts):
                          t = s["t"]
                          gap = np.diff(t, prepend=t[:1])
                          num = torch.tensor(np.stack([(np.log1p(s["amount"]) - scale[0]) / scale[1], np.log1p(gap / 3600) / 4], 1))
                          x = torch.cat([num] + [emb[k](torch.as_tensor(s[k])) for k in emb], 1)
                          S = F.normalize(gru(x[None])[0][0], dim=1).numpy()
                          n = np.searchsorted(t, c, side="right")
                          r = S[np.maximum(n - 1, 0)].copy()
                          r[n == 0] = 0
                          out.append(r)
                  return np.concatenate(out)
              finally:
                  torch.set_default_dtype(torch.float32)
      - hint: "The state read is the one after the first event at or after the cut, not the last one before it: the row sees an event of the month it predicts."
        code: |
          def f(seed, vocab, hidden, seqs, cuts, scale):
              import numpy as np
              import torch
              import torch.nn.functional as F
              from torch import nn
              torch.set_default_dtype(torch.float64)
              try:
                  torch.manual_seed(seed)
                  emb = nn.ModuleDict({k: nn.Embedding(n, min(32, 4 + int(n ** 0.5))) for k, n in vocab.items()})
                  gru = nn.GRU(2 + sum(e.embedding_dim for e in emb.values()), hidden, batch_first=True)
                  out = []
                  with torch.no_grad():
                      for s, c in zip(seqs, cuts):
                          t = s["t"]
                          gap = np.diff(t, prepend=t[:1])
                          num = torch.tensor(np.stack([(np.log1p(s["amount"]) - scale[0]) / scale[1], np.log1p(gap / 3600) / 4], 1))
                          x = torch.cat([num] + [emb[k](torch.as_tensor(s[k])) for k in emb], 1)
                          S = F.normalize(gru(x[None])[0][0], dim=1).numpy()
                          n = np.searchsorted(t, c, side="left")

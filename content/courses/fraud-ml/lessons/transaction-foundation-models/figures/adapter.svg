<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
<style>
.l{fill:currentColor}.b{fill:currentColor;font-weight:600}.m{fill:currentColor;opacity:.6;font-size:11px}.s{fill:currentColor;font-size:11px}
.ax{stroke:currentColor;stroke-width:1;fill:none}.g{stroke:currentColor;stroke-dasharray:3 3;opacity:.4;fill:none}
.bx{fill:none;stroke:currentColor;stroke-width:1;opacity:.7}.ln{stroke:currentColor;stroke-width:1;fill:none;opacity:.5}
.mono{fill:currentColor;font-family:ui-monospace, monospace;font-size:11px}
</style>
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="none" stroke="currentColor"/></marker><marker id="ara" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="none" stroke="#e2903a"/></marker><marker id="arb" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="none" stroke="#4c8dd6"/></marker></defs>
<rect x="40.0" y="40.0" width="150.0" height="150.0" rx="2" fill="currentColor" stroke="currentColor" stroke-width="1" opacity="0.15"/>
<rect x="40.0" y="40.0" width="150.0" height="150.0" rx="2" fill="none" stroke="currentColor" stroke-width="1" opacity="0.7"/>
<text class="b" x="115.0" y="110.0" text-anchor="middle">W</text>
<text class="s" x="115.0" y="128.0" text-anchor="middle">512 × 512</text>
<text class="s" x="115.0" y="210.0" text-anchor="middle">frozen: 262,144 numbers</text>
<text class="b" x="225.0" y="120.0" text-anchor="middle">+</text>
<rect x="260.0" y="40.0" width="14.0" height="150.0" rx="1" fill="#e2903a" stroke="#e2903a" stroke-width="1" opacity="0.85"/>
<text class="b" x="267.0" y="32.0" text-anchor="middle" style="fill:#e2903a">B</text>
<text class="s" x="267.0" y="210.0" text-anchor="middle" style="fill:#e2903a">512 × 8</text>
<text class="m" x="267.0" y="226.0" text-anchor="middle" style="fill:#e2903a">starts at zero</text>
<text class="b" x="292.0" y="120.0" text-anchor="middle">×</text>
<rect x="310.0" y="108.0" width="150.0" height="14.0" rx="1" fill="#e2903a" stroke="#e2903a" stroke-width="1" opacity="0.85"/>
<text class="s" x="385.0" y="100.0" text-anchor="middle" style="fill:#e2903a">A   8 × 512</text>
<text class="b" x="500.0" y="104.0" text-anchor="start" style="fill:#e2903a">trained:</text>
<text class="l" x="500.0" y="122.0" text-anchor="start" style="fill:#e2903a">8,192 numbers</text>
<text class="l" x="500.0" y="140.0" text-anchor="start" style="fill:#e2903a">3.1% of W</text>
<text class="s" x="320.0" y="252.0" text-anchor="middle">the layer computes  W x + B A x;  only A and B learn from the task's labels</text>
</svg>

<svg viewBox="0 0 640 350" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
<style>
.l{fill:currentColor}.b{fill:currentColor;font-weight:600}.m{fill:currentColor;opacity:.6;font-size:11px}.s{fill:currentColor;font-size:11px}
.ax{stroke:currentColor;stroke-width:1;fill:none}.g{stroke:currentColor;stroke-dasharray:3 3;opacity:.4;fill:none}
.bx{fill:none;stroke:currentColor;stroke-width:1;opacity:.7}.ln{stroke:currentColor;stroke-width:1;fill:none;opacity:.5}
.mono{fill:currentColor;font-family:ui-monospace, monospace;font-size:11px}
</style>
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="none" stroke="currentColor"/></marker><marker id="ara" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="none" stroke="#e2903a"/></marker><marker id="arb" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="none" stroke="#4c8dd6"/></marker></defs>
<text class="b" x="20.0" y="24.0" text-anchor="start">GPU-days per run (logarithmic)</text>
<text class="s" x="20.0" y="64.0" text-anchor="start">public model, pretraining</text>
<text class="m" x="242.0" y="64.0" text-anchor="end">L4</text>
<rect x="250.0" y="52.0" width="56.0" height="16.0" rx="2" fill="currentColor" stroke="none" stroke-width="1" opacity="0.35"/>
<rect x="306.0" y="52.0" width="9.0" height="16.0" rx="2" fill="currentColor" stroke="none" stroke-width="1" opacity="0.85"/>
<text class="s" x="321.0" y="65.0" text-anchor="start">0.06–0.08</text>
<text class="s" x="20.0" y="98.0" text-anchor="start">digital bank 10M, pretraining</text>
<text class="m" x="242.0" y="98.0" text-anchor="end">H100</text>
<rect x="250.0" y="86.0" width="252.4" height="16.0" rx="2" fill="#e2903a" stroke="none" stroke-width="1" opacity="0.85"/>
<text class="s" x="508.4" y="99.0" text-anchor="start">32</text>
<text class="s" x="20.0" y="132.0" text-anchor="start">digital bank 100M, pretraining</text>
<text class="m" x="242.0" y="132.0" text-anchor="end">H100</text>
<rect x="250.0" y="120.0" width="313.2" height="16.0" rx="2" fill="#e2903a" stroke="none" stroke-width="1" opacity="0.85"/>
<text class="s" x="569.2" y="133.0" text-anchor="start">224</text>
<text class="s" x="20.0" y="166.0" text-anchor="start">digital bank 1B, pretraining</text>
<text class="m" x="242.0" y="166.0" text-anchor="end">H100</text>
<rect x="250.0" y="154.0" width="334.9" height="16.0" rx="2" fill="#e2903a" stroke="none" stroke-width="1" opacity="0.85"/>
<text class="s" x="590.9" y="167.0" text-anchor="start">448</text>
<text class="s" x="20.0" y="200.0" text-anchor="start">adapters, one task (1/8)</text>
<text class="m" x="242.0" y="200.0" text-anchor="end">if H100</text>
<rect x="250.0" y="188.0" width="187.3" height="16.0" rx="2" fill="#e2903a" stroke="none" stroke-width="1" opacity="0.35"/>
<rect x="437.3" y="188.0" width="82.5" height="16.0" rx="2" fill="#e2903a" stroke="none" stroke-width="1" opacity="0.85"/>
<text class="s" x="525.9" y="201.0" text-anchor="start">4–56</text>
<text class="s" x="20.0" y="234.0" text-anchor="start">lender, one joint-fusion run</text>
<text class="m" x="242.0" y="234.0" text-anchor="end">A100</text>
<rect x="250.0" y="222.0" width="269.9" height="16.0" rx="2" fill="#4c8dd6" stroke="none" stroke-width="1" opacity="0.85"/>
<text class="s" x="525.9" y="235.0" text-anchor="start">56</text>
<text class="s" x="20.0" y="268.0" text-anchor="start">lender, one daily scoring pass</text>
<text class="m" x="242.0" y="268.0" text-anchor="end">A100</text>
<rect x="250.0" y="256.0" width="223.0" height="16.0" rx="2" fill="#4c8dd6" stroke="none" stroke-width="1" opacity="0.85"/>
<text class="s" x="479.0" y="269.0" text-anchor="start">12.5 every day</text>
<path class="ax" d="M250.0,294.0 L610.0,294.0"/>
<path class="ax" d="M250.0,294.0 L250.0,298.0"/>
<text class="s" x="250.0" y="311.0" text-anchor="middle">0.01</text>
<path class="g" d="M250.0,46.0 L250.0,294.0"/>
<path class="ax" d="M322.0,294.0 L322.0,298.0"/>
<text class="s" x="322.0" y="311.0" text-anchor="middle">0.1</text>
<path class="g" d="M322.0,46.0 L322.0,294.0"/>
<path class="ax" d="M394.0,294.0 L394.0,298.0"/>
<text class="s" x="394.0" y="311.0" text-anchor="middle">1</text>
<path class="g" d="M394.0,46.0 L394.0,294.0"/>
<path class="ax" d="M466.0,294.0 L466.0,298.0"/>
<text class="s" x="466.0" y="311.0" text-anchor="middle">10</text>
<path class="g" d="M466.0,46.0 L466.0,294.0"/>
<path class="ax" d="M538.0,294.0 L538.0,298.0"/>
<text class="s" x="538.0" y="311.0" text-anchor="middle">100</text>
<path class="g" d="M538.0,46.0 L538.0,294.0"/>
<path class="ax" d="M610.0,294.0 L610.0,298.0"/>
<text class="s" x="610.0" y="311.0" text-anchor="middle">1,000</text>
<path class="g" d="M610.0,46.0 L610.0,294.0"/>
<text class="m" x="20.0" y="332.0" text-anchor="start">GPU types differ in speed: H100 fastest, A100 between, L4 slowest.</text>
<text class="m" x="20.0" y="347.0" text-anchor="start">The bars order the runs; they do not price them in one currency.</text>
</svg>

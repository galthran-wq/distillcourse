<rect x="400.0" y="118.0" width="80.0" height="26.0" rx="4" fill="none" stroke="#e2903a" stroke-width="1.5" opacity="0.9"/>
<text class="mono" x="440.0" y="135.0" text-anchor="middle">dt=85</text>
<path class="ln" d="M372.0,131.0 L398.0,131.0" marker-end="url(#ar)"/>
<text class="b" x="500.0" y="135.0" text-anchor="start" style="fill:#e2903a">re-encode</text>
<text class="b" x="20.0" y="184.0" text-anchor="start">client C</text>
<text class="m" x="20.0" y="202.0" text-anchor="start">silent 45 days, now 46</text>
<rect x="290.0" y="170.0" width="80.0" height="26.0" rx="4" fill="none" stroke="currentColor" stroke-width="1" opacity="0.6"/>
<text class="mono" x="330.0" y="187.0" text-anchor="middle">dt=104</text>
<rect x="400.0" y="170.0" width="80.0" height="26.0" rx="4" fill="none" stroke="currentColor" stroke-width="1" opacity="0.9"/>
<text class="mono" x="440.0" y="187.0" text-anchor="middle">dt=104</text>
<path class="ln" d="M372.0,183.0 L398.0,183.0" marker-end="url(#ar)"/>
<text class="s" x="500.0" y="187.0" text-anchor="start">keep yesterday's</text>
<text class="m" x="20.0" y="232.0" text-anchor="start">now token = ⌊8 ln(1 + silence in seconds / 8)⌋ at the cut-off;</text>
<text class="m" x="20.0" y="248.0" text-anchor="start">after g days of silence it moves on about 8/g of days</text>
</svg>

<svg viewBox="0 0 640 275" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
<style>
.l{fill:currentColor}.b{fill:currentColor;font-weight:600}.m{fill:currentColor;opacity:.6;font-size:11px}.s{fill:currentColor;font-size:11px}
.ax{stroke:currentColor;stroke-width:1;fill:none}.g{stroke:currentColor;stroke-dasharray:3 3;opacity:.4;fill:none}
.bx{fill:none;stroke:currentColor;stroke-width:1;opacity:.7}.ln{stroke:currentColor;stroke-width:1;fill:none;opacity:.5}
.mono{fill:currentColor;font-family:ui-monospace, monospace;font-size:11px}
</style>
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="none" stroke="currentColor"/></marker><marker id="ara" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="none" stroke="#e2903a"/></marker><marker id="arb" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="none" stroke="#4c8dd6"/></marker></defs>
<text class="b" x="20.0" y="24.0" text-anchor="start">a daily job, yesterday's run and today's</text>
<text class="m" x="330.0" y="48.0" text-anchor="middle">yesterday</text>
<text class="m" x="440.0" y="48.0" text-anchor="middle">today</text>
<text class="b" x="20.0" y="80.0" text-anchor="start">client A</text>
<text class="m" x="20.0" y="98.0" text-anchor="start">new event since yesterday</text>
<rect x="290.0" y="66.0" width="80.0" height="26.0" rx="4" fill="none" stroke="currentColor" stroke-width="1" opacity="0.6"/>
<text class="mono" x="330.0" y="83.0" text-anchor="middle">dt=74</text>
<rect x="400.0" y="66.0" width="80.0" height="26.0" rx="4" fill="none" stroke="#e2903a" stroke-width="1.5" opacity="0.9"/>
<text class="mono" x="440.0" y="83.0" text-anchor="middle">dt=63</text>
<path class="ln" d="M372.0,79.0 L398.0,79.0" marker-end="url(#ar)"/>
<text class="b" x="500.0" y="83.0" text-anchor="start" style="fill:#e2903a">re-encode</text>
<text class="b" x="20.0" y="132.0" text-anchor="start">client B</text>
<text class="m" x="20.0" y="150.0" text-anchor="start">silent 3 days, now 4</text>
<rect x="290.0" y="118.0" width="80.0" height="26.0" rx="4" fill="none" stroke="currentColor" stroke-width="1" opacity="0.6"/>

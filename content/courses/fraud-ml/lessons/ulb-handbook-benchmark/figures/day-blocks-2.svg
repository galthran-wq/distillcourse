    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .axis { stroke: currentColor; stroke-width: 1; fill: none; }
    .guide { stroke: currentColor; stroke-dasharray: 3 3; opacity: 0.5; fill: none; }
  </style>
  <text class="bold" x="40.0" y="28.0" text-anchor="start">the 100 cards the team calls on day 129, filled block by block</text>
  <rect x="40.0" y="50" width="150.0" height="44" rx="3" fill="#e2903a" fill-opacity="0.85" stroke="currentColor" stroke-opacity="0.4"/>
  <text class="label" x="44.0" y="115.0" text-anchor="start" font-size="12">leaves 2 and 4, 95% fraud or more: 25 cards, 21 compromised</text>
  <line x1="42.0" y1="96" x2="42.0" y2="103" class="guide"/>
  <rect x="190.0" y="50" width="132.0" height="44" rx="3" fill="#4c8dd6" fill-opacity="0.85" stroke="currentColor" stroke-opacity="0.4"/>
  <text class="label" x="194.0" y="133.0" text-anchor="start" font-size="12">leaf 3, 9% fraud: 22 cards, 2 compromised</text>
  <line x1="192.0" y1="96" x2="192.0" y2="121" class="guide"/>
  <rect x="322.0" y="50" width="318.0" height="44" rx="3" fill="none" stroke="currentColor" stroke-opacity="0.25" stroke-dasharray="3 3"/>
  <line x1="640" y1="42" x2="640" y2="100" stroke="currentColor" stroke-width="2"/>
  <text class="muted" x="640.0" y="38.0" text-anchor="end">k = 100</text>
  <text class="bold" x="40.0" y="190.0" text-anchor="start">compromised cards in the hundred so far: 23</text>

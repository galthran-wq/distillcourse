<svg viewBox="0 0 680 350" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .bold { fill: currentColor; font-weight: 600; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .axis { stroke: currentColor; stroke-width: 1; fill: none; }
    .guide { stroke: currentColor; stroke-dasharray: 3 3; opacity: 0.5; fill: none; }
  </style>
  <text class="bold" x="20.0" y="26.0" text-anchor="start">what each benchmark puts in front of the models</text>
  <text class="bold" x="330.0" y="52.0" text-anchor="middle">simulator week</text>
  <text class="bold" x="560.0" y="52.0" text-anchor="middle">real week</text>
  <text class="label" x="20.0" y="80.0" text-anchor="start">rarity</text>
  <text x="330.0" y="80.0" text-anchor="middle" fill="#e2903a" font-size="12" font-weight="600">0.66%, three times real</text>
  <text x="560.0" y="80.0" text-anchor="middle" fill="#5aa46a" font-size="12" font-weight="600">0.2%</text>
  <line x1="20" y1="89" x2="660" y2="89" stroke="currentColor" stroke-opacity="0.1"/>
  <text class="label" x="20.0" y="108.0" text-anchor="start">class overlap</text>
  <text x="330.0" y="108.0" text-anchor="middle" fill="#e2903a" font-size="12" font-weight="600">weak: scripted</text>
  <text x="560.0" y="108.0" text-anchor="middle" fill="#5aa46a" font-size="12" font-weight="600">present</text>
  <line x1="20" y1="117" x2="660" y2="117" stroke="currentColor" stroke-opacity="0.1"/>
  <text class="label" x="20.0" y="136.0" text-anchor="start">label delay</text>
  <text x="330.0" y="136.0" text-anchor="middle" fill="#e2903a" font-size="12" font-weight="600">fixed 7 days</text>
  <text x="560.0" y="136.0" text-anchor="middle" fill="#e2903a" font-size="12" font-weight="600">fixed 7 days</text>
  <line x1="20" y1="145" x2="660" y2="145" stroke="currentColor" stroke-opacity="0.1"/>
  <text class="label" x="20.0" y="164.0" text-anchor="start">drift</text>
  <text class="muted" x="330.0" y="164.0" text-anchor="middle">not tested</text>
  <text class="muted" x="560.0" y="164.0" text-anchor="middle">not tested</text>
  <line x1="20" y1="173" x2="660" y2="173" stroke="currentColor" stroke-opacity="0.1"/>
  <text class="label" x="20.0" y="192.0" text-anchor="start">adversary</text>
  <text class="muted" x="330.0" y="192.0" text-anchor="middle">absent</text>
  <text class="muted" x="560.0" y="192.0" text-anchor="middle">not tested</text>
  <line x1="20" y1="201" x2="660" y2="201" stroke="currentColor" stroke-opacity="0.1"/>
  <text class="label" x="20.0" y="220.0" text-anchor="start">alert feedback</text>
  <text class="muted" x="330.0" y="220.0" text-anchor="middle">absent</text>
  <text class="muted" x="560.0" y="220.0" text-anchor="middle">not modelled</text>
  <line x1="20" y1="229" x2="660" y2="229" stroke="currentColor" stroke-opacity="0.1"/>
  <text class="label" x="20.0" y="248.0" text-anchor="start">entity history</text>
  <text x="330.0" y="248.0" text-anchor="middle" fill="#e2903a" font-size="12" font-weight="600">12 aggregates</text>
  <text x="560.0" y="248.0" text-anchor="middle" fill="#e2903a" font-size="12" font-weight="600">12 aggregates</text>
  <line x1="20" y1="257" x2="660" y2="257" stroke="currentColor" stroke-opacity="0.1"/>
  <text class="label" x="20.0" y="276.0" text-anchor="start">scoring speed</text>
  <text class="muted" x="330.0" y="276.0" text-anchor="middle">training time only</text>
  <text class="muted" x="560.0" y="276.0" text-anchor="middle">training time only</text>
  <line x1="20" y1="285" x2="660" y2="285" stroke="currentColor" stroke-opacity="0.1"/>
  <text class="label" x="20.0" y="304.0" text-anchor="start">re-runnable</text>
  <text x="330.0" y="304.0" text-anchor="middle" fill="#5aa46a" font-size="12" font-weight="600">yes</text>
  <text class="muted" x="560.0" y="304.0" text-anchor="middle">no</text>
  <line x1="20" y1="313" x2="660" y2="313" stroke="currentColor" stroke-opacity="0.1"/>
  <text class="muted" x="20.0" y="346.0" text-anchor="start">green: as in deployment, or available; amber: simplified; grey: absent, not tested or unavailable</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330">
<text x="20.0" y="24.0" font-family="system-ui, sans-serif" font-size="13" text-anchor="start" fill="currentColor" font-weight="600">Test-week ROC curves of the two trees</text>
<rect x="70" y="50" width="240" height="240" fill="none" stroke="currentColor" stroke-width="1" opacity="0.5"/>
<rect x="70" y="50" width="2.9" height="240" fill="#5aa46a" fill-opacity="0.18"/>
<text x="70.0" y="306.0" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle" fill="currentColor" >0</text>
<text x="64.0" y="294.0" font-family="system-ui, sans-serif" font-size="11" text-anchor="end" fill="currentColor" >0</text>
<text x="190.0" y="306.0" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle" fill="currentColor" >0.5</text>
<text x="64.0" y="174.0" font-family="system-ui, sans-serif" font-size="11" text-anchor="end" fill="currentColor" >0.5</text>
<text x="310.0" y="306.0" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle" fill="currentColor" >1</text>
<text x="64.0" y="54.0" font-family="system-ui, sans-serif" font-size="11" text-anchor="end" fill="currentColor" >1</text>
<text x="190.0" y="324.0" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" fill="currentColor" >false-positive rate</text>
<text x="30.0" y="170.0" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" fill="currentColor" transform="rotate(-90 30 170.0)">recall</text>
<line x1="70" y1="290" x2="310" y2="50" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5"/>
<path d="M70.0,290.0 L70.0,260.7 L70.0,175.3 L70.4,163.5 L310.0,50.0" fill="none" stroke="#4c8dd6" stroke-width="2.2"/>
<path d="M70.0,290.0 L70.8,151.0 L310.0,50.0" fill="none" stroke="#e2903a" stroke-width="2.2"/>
<circle cx="70.4" cy="163.5" r="4" fill="#4c8dd6"/>
<circle cx="70.8" cy="151.0" r="4" fill="#e2903a"/>
<text x="74.0" y="44.0" font-family="system-ui, sans-serif" font-size="11" text-anchor="start" fill="#5aa46a" >FPR ≤ 0.012: reachable at k = 100</text>
<text x="340.0" y="80.0" font-family="system-ui, sans-serif" font-size="12" text-anchor="start" fill="#e2903a" font-weight="600">DT∞: one interior point</text>
<text x="340.0" y="96.0" font-family="system-ui, sans-serif" font-size="11" text-anchor="start" fill="currentColor" >recall 0.579 at FPR 0.0034</text>
<text x="340.0" y="112.0" font-family="system-ui, sans-serif" font-size="11" text-anchor="start" fill="currentColor" >AUC = (1 + 0.579 − 0.0034)/2 = 0.788</text>
<text x="340.0" y="146.0" font-family="system-ui, sans-serif" font-size="12" text-anchor="start" fill="#4c8dd6" font-weight="600">DT2: three interior points</text>
<text x="340.0" y="162.0" font-family="system-ui, sans-serif" font-size="11" text-anchor="start" fill="currentColor" >last one: recall 0.527 at FPR 0.0016</text>
<text x="340.0" y="178.0" font-family="system-ui, sans-serif" font-size="11" text-anchor="start" fill="currentColor" >AUC ≈ (1 + 0.527 − 0.0016)/2 = 0.763</text>
<text x="340.0" y="220.0" font-family="system-ui, sans-serif" font-size="11" text-anchor="start" fill="currentColor" opacity="0.55">Above the last point each curve is a</text>
<text x="340.0" y="236.0" font-family="system-ui, sans-serif" font-size="11" text-anchor="start" fill="currentColor" opacity="0.55">straight line to (1, 1): one block of</text>
<text x="340.0" y="252.0" font-family="system-ui, sans-serif" font-size="11" text-anchor="start" fill="currentColor" opacity="0.55">57,000+ tied rows, credited half its pairs.</text>
<text x="340.0" y="268.0" font-family="system-ui, sans-serif" font-size="11" text-anchor="start" fill="currentColor" opacity="0.55">The 0.025 AUC gap is the recall gap ÷ 2.</text>
</svg>

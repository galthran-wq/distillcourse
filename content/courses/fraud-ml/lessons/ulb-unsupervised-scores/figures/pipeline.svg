<svg viewBox="0 0 640 422" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .bold { fill: currentColor; font-weight: 600; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .axis { stroke: currentColor; stroke-width: 1; fill: none; }
    .guide { stroke: currentColor; stroke-dasharray: 3 3; opacity: 0.5; fill: none; }
    .box { stroke: currentColor; stroke-width: 1; fill: none; }
  </style>
  <rect x="60" y="20" width="440" height="40" rx="5" fill="none" stroke="currentColor" stroke-width="1"/>
  <circle cx="38" cy="40" r="11" fill="none" stroke="currentColor" stroke-width="1"/>
  <text class="label" x="38.0" y="44.0" text-anchor="middle" font-size="12" fill-opacity="1">1</text>
  <text class="bold" x="72.0" y="37.0" text-anchor="start">split 70/30 at random</text>
  <text class="muted" x="72.0" y="53.0" text-anchor="start">199,364 training, 85,443 test payments</text>
  <line x1="280" y1="60" x2="280" y2="70" stroke="currentColor" stroke-width="1"/>
  <rect x="60" y="70" width="440" height="40" rx="5" fill="none" stroke="#e2903a" stroke-width="2"/>
  <circle cx="38" cy="90" r="11" fill="#e2903a" stroke="#e2903a" stroke-width="1"/>
  <text class="label" x="38.0" y="94.0" text-anchor="middle" font-size="12">2</text>
  <text class="bold" x="72.0" y="87.0" text-anchor="start">resample the training split</text>
  <text class="muted" x="72.0" y="103.0" text-anchor="start">SMOTE or ROSE: the training set becomes 43% or 50% fraud</text>
  <line x1="280" y1="110" x2="280" y2="120" stroke="currentColor" stroke-width="1"/>
  <rect x="60" y="120" width="440" height="40" rx="5" fill="none" stroke="currentColor" stroke-width="1"/>
  <circle cx="38" cy="140" r="11" fill="none" stroke="currentColor" stroke-width="1"/>
  <text class="label" x="38.0" y="144.0" text-anchor="middle" font-size="12" fill-opacity="1">3</text>
  <text class="bold" x="72.0" y="137.0" text-anchor="start">standardise the resampled set</text>
  <text class="muted" x="72.0" y="153.0" text-anchor="start">with its own mean and standard deviation</text>
  <line x1="280" y1="160" x2="280" y2="170" stroke="currentColor" stroke-width="1"/>
  <rect x="60" y="170" width="440" height="40" rx="5" fill="none" stroke="currentColor" stroke-width="1"/>
  <circle cx="38" cy="190" r="11" fill="none" stroke="currentColor" stroke-width="1"/>
  <text class="label" x="38.0" y="194.0" text-anchor="middle" font-size="12" fill-opacity="1">4</text>
  <text class="bold" x="72.0" y="187.0" text-anchor="start">k-means at the elbow</text>
  <text class="muted" x="72.0" y="203.0" text-anchor="start">k = 3 (SMOTE), k = 4 (ROSE), 25 random starts</text>
  <line x1="280" y1="210" x2="280" y2="220" stroke="currentColor" stroke-width="1"/>
  <rect x="60" y="220" width="440" height="40" rx="5" fill="none" stroke="currentColor" stroke-width="1"/>
  <circle cx="38" cy="240" r="11" fill="none" stroke="currentColor" stroke-width="1"/>
  <text class="label" x="38.0" y="244.0" text-anchor="middle" font-size="12" fill-opacity="1">5</text>
  <text class="bold" x="72.0" y="237.0" text-anchor="start">name the clusters</text>
  <text class="muted" x="72.0" y="253.0" text-anchor="start">"fraud" if its training rows are mostly fraud</text>
  <line x1="280" y1="260" x2="280" y2="270" stroke="currentColor" stroke-width="1"/>
  <rect x="60" y="270" width="440" height="40" rx="5" fill="none" stroke="#e2903a" stroke-width="2"/>
  <circle cx="38" cy="290" r="11" fill="#e2903a" stroke="#e2903a" stroke-width="1"/>
  <text class="label" x="38.0" y="294.0" text-anchor="middle" font-size="12">6</text>
  <text class="bold" x="72.0" y="287.0" text-anchor="start">standardise the test split</text>
  <text class="muted" x="72.0" y="303.0" text-anchor="start">with the test split’s own mean and standard deviation</text>
  <line x1="280" y1="310" x2="280" y2="320" stroke="currentColor" stroke-width="1"/>
  <rect x="60" y="320" width="440" height="40" rx="5" fill="none" stroke="currentColor" stroke-width="1"/>
  <circle cx="38" cy="340" r="11" fill="none" stroke="currentColor" stroke-width="1"/>
  <text class="label" x="38.0" y="344.0" text-anchor="middle" font-size="12" fill-opacity="1">7</text>
  <text class="bold" x="72.0" y="337.0" text-anchor="start">assign each test payment</text>
  <text class="muted" x="72.0" y="353.0" text-anchor="start">to the nearest cluster centre</text>
  <line x1="280" y1="360" x2="280" y2="370" stroke="currentColor" stroke-width="1"/>
  <rect x="60" y="370" width="440" height="40" rx="5" fill="none" stroke="currentColor" stroke-width="1"/>
  <circle cx="38" cy="390" r="11" fill="none" stroke="currentColor" stroke-width="1"/>
  <text class="label" x="38.0" y="394.0" text-anchor="middle" font-size="12" fill-opacity="1">8</text>
  <text class="bold" x="72.0" y="387.0" text-anchor="start">alert</text>
  <text class="muted" x="72.0" y="403.0" text-anchor="start">every payment in a cluster named "fraud"</text>
  <text fill="#e2903a" font-size="13" x="512.0" y="88.0" text-anchor="start">labels enter</text>
  <text fill="#e2903a" font-size="13" x="512.0" y="103.0" text-anchor="start">the clusters</text>
  <text fill="#e2903a" font-size="13" x="512.0" y="288.0" text-anchor="start">test payments in</text>
  <text fill="#e2903a" font-size="13" x="512.0" y="303.0" text-anchor="start">other coordinates</text>
</svg>

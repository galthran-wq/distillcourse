<svg viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .bold { fill: currentColor; font-weight: 600; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .small { fill: currentColor; font-size: 11px; }
    .axis { stroke: currentColor; stroke-width: 1; fill: none; }
    .guide { stroke: currentColor; stroke-dasharray: 3 3; opacity: 0.25; fill: none; }
  </style>
<text class="bold" x="300.0" y="24.0" text-anchor="middle">the frauds two models catch at the same recall</text>
<circle cx="263.1" cy="150" r="95" fill="#4c8dd6" fill-opacity="0.18" stroke="#4c8dd6" stroke-width="1.5"/>
<circle cx="336.9" cy="150" r="95" fill="#e2903a" fill-opacity="0.18" stroke="#e2903a" stroke-width="1.5"/>
<text class="small" x="204.2" y="144.0" text-anchor="middle" fill="#4c8dd6">forest only</text>
<text class="bold" x="204.2" y="162.0" text-anchor="middle">48%</text>
<text class="small" x="395.8" y="144.0" text-anchor="middle" fill="#e2903a">LSTM only</text>
<text class="bold" x="395.8" y="162.0" text-anchor="middle">48%</text>
<text class="small" x="300.0" y="144.0" text-anchor="middle">both</text>
<text class="bold" x="300.0" y="162.0" text-anchor="middle">52%</text>
<text class="muted" x="300.0" y="272.0" text-anchor="middle">Each circle: one model's caught frauds (same count). Jaccard index 0.35 = both ÷ either.</text>
<text class="muted" x="300.0" y="288.0" text-anchor="middle">Percentages are shares of one model's catches.</text>
</svg>

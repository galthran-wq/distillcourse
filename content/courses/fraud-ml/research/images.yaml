# Index of the captured real-image pool under research/images/.
# One entry per file on disk (27 files); nobody re-reads the sources later —
# this index plus the captures IS the pool. Licences recorded exactly as the
# readers stated them; "teaching use" = publisher-copyright material used
# under teaching-use practice, to be reviewed before publication. Three
# captures the readers' candidate lists omitted (anomalydetec-ecg-collective,
# realisticsyn-fig4, realisticsyn-fig6) were found on disk, viewed and
# indexed here; no duplicates were found, so nothing was deleted.
images:

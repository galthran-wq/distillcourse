concepts:
  - id: surprisal
    name: Surprisal
    definition: "Information content of one event: -log2 p, in bits"
    introduced_in: what-is-surprise
  - id: entropy
    name: Entropy
    definition: "Expected surprisal of a distribution"
    introduced_in: entropy-as-average-surprise
  - id: conditional-entropy
    name: Conditional entropy
    definition: "Average uncertainty H(X|Y) left in X after observing Y"
    introduced_in: joint-and-conditional-entropy
  - id: entropy-rate
    name: Entropy rate
    definition: "Per-symbol entropy of a source given unlimited context, in the long-sequence limit"
    introduced_in: entropy-of-english
  - id: prefix-code
    name: Prefix code
    definition: "A code where no codeword is a prefix of another, decodable without separators; equivalently, outcomes sit only at the leaves of a binary code tree"
    introduced_in: prefix-codes
  - id: kraft-inequality
    name: Kraft inequality
    definition: "Codeword lengths L_i are achievable by a prefix code iff sum of 2^-L_i <= 1; McMillan extends the bound to all uniquely decodable codes"
    introduced_in: kraft-inequality
  - id: huffman-coding
    name: Huffman coding
    definition: "Greedy construction of an optimal prefix code by merging least likely symbols"
    introduced_in: huffman-by-hand
  - id: source-coding-theorem
    name: Source coding theorem
    definition: "Lossless codes need at least H(X) bits per symbol on average, and block codes can get arbitrarily close"
    introduced_in: source-coding-theorem-lite
  - id: typical-set
    name: Typical set
    definition: "The ~2^{nH} long sequences of near-average surprisal that together carry almost all the probability of a source"
    introduced_in: source-coding-theorem-lite
  - id: arithmetic-coding
    name: Arithmetic coding
    definition: "Coding a whole message as a subinterval of [0,1) whose width is the message probability, so codeword lengths need not be whole bits"
    introduced_in: arithmetic-coding
  - id: lempel-ziv
    name: Lempel-Ziv coding
    definition: "Replacing repeated text with pointers into earlier output (LZ77) or into a dictionary of previously parsed phrases (LZ78)"
    introduced_in: dictionary-coding
  - id: universal-coding
    name: Universal coding
    definition: "A code that reaches the entropy rate of every source in a class without being told which source it is reading"
    introduced_in: dictionary-coding
  - id: canonical-code
    name: Canonical prefix code
    definition: "A prefix code fixed entirely by its codeword lengths plus an ordering rule, so only the lengths need to be transmitted"
    introduced_in: deflate-and-zstd
  - id: asymmetric-numeral-systems
    name: Asymmetric numeral systems
    definition: "A finite-state entropy coder that packs a message into a single large integer, reaching arithmetic-coding efficiency at table-lookup speed"
    introduced_in: deflate-and-zstd
  - id: mutual-information
    name: Mutual information
    definition: "Bits of uncertainty about one variable removed by knowing another: I(X;Y) = H(X) - H(X|Y)"
    introduced_in: mutual-information
  - id: data-processing-inequality
    name: Data-processing inequality
    definition: "If T depends on Y only through X (Y -> X -> T), then I(T;Y) <= I(X;Y): processing cannot create information"
    introduced_in: data-processing-inequality
  - id: fano-inequality
    name: Fano's inequality
    definition: "A lower bound on error probability in terms of conditional entropy, H(X|Y) <= H(Pe) + Pe log2(|X|-1); the engine of every converse in the course"
    introduced_in: fano-inequality
  - id: mi-estimation-bias
    name: Mutual-information estimation bias
    definition: "The upward bias of a plug-in mutual-information estimate, which reports shared information between independent variables at finite sample size"
    introduced_in: estimating-mutual-information
  - id: channel-capacity
    name: Channel capacity
    definition: "The largest mutual information a channel p(y|x) admits over input distributions: C = max_p(x) I(X;Y), in bits per channel use"
    introduced_in: channel-capacity
  - id: noisy-channel-coding-theorem
    name: Noisy-channel coding theorem
    definition: "Reliable communication is achievable at every rate below capacity C and impossible above it"
    introduced_in: noisy-channel-coding
  - id: linear-block-code
    name: Linear block code
    definition: "A code whose codewords are the null space of a parity-check matrix, so decoding starts from the syndrome of the received word"
    introduced_in: hamming-codes
  - id: minimum-distance
    name: Minimum distance
    definition: "The smallest Hamming distance between two codewords; it fixes guaranteed correction but not the noise level a code can actually survive"
    introduced_in: hamming-codes
  - id: sparse-graph-codes
    name: Sparse-graph codes
    definition: "Codes defined by a sparse parity-check graph and decoded by iterative belief propagation — turbo, LDPC and repeat-accumulate families"
    introduced_in: deployed-codes
  - id: coding-efficiency
    name: Coding efficiency
    definition: "The fraction of a channel's capacity a code actually uses: information transmitted divided by capacity"
    introduced_in: neural-coding
  - id: kl-divergence
    name: KL divergence
    definition: "Expected extra bits per symbol from coding true distribution p with a code built for q"
    introduced_in: kl-divergence
  - id: cross-entropy
    name: Cross-entropy
    definition: "Expected bits per symbol when events from p are coded with q's code: H(p,q) = H(p) + KL(p||q)"
    introduced_in: cross-entropy-loss
  - id: kolmogorov-complexity
    name: Kolmogorov complexity
    definition: "The length of the shortest program that prints a string; the ultimate, uncomputable compression limit, defined up to an additive constant"
    introduced_in: kolmogorov-complexity
  - id: bits-per-byte
    name: Bits per byte
    definition: "A model's cross-entropy converted to a tokenizer-independent compression rate, so predictors over different vocabularies can be compared"
    introduced_in: language-models-as-compressors
  - id: max-entropy-principle
    name: Maximum entropy principle
    definition: "Given expectation constraints, adopt the entropy-maximizing distribution; it is exponential in the constrained quantities"
    introduced_in: max-entropy-principle
  - id: landauer-principle
    name: Landauer's principle
    definition: "Erasing one bit of information dissipates at least kT ln 2 of heat, giving Shannon information a physical, thermodynamic price"
    introduced_in: thermodynamics-of-information
  - id: rate-distortion
    name: Rate-distortion function
    definition: "The least rate for lossy coding within a fidelity bound: R(D) = min over p(x-hat|x) of I(X;X-hat) subject to expected distortion <= D"
    introduced_in: rate-distortion
  - id: minimum-description-length
    name: Minimum description length
    definition: "Model selection by minimizing total code length L(H) + L(D|H): model bits plus data-given-model bits"
    introduced_in: minimum-description-length
  - id: information-bottleneck
    name: Information bottleneck
    definition: "Encoder objective minimizing I(X;T) - beta I(T;Y): compress X while preserving information about a target Y"
    introduced_in: information-bottleneck
  - id: infonce
    name: InfoNCE bound
    definition: "Contrastive N-way classification loss whose value bounds mutual information: I(X;Y) >= log2 N - L_N"
    introduced_in: infonce
  - id: nonlinear-transform-coding
    name: Nonlinear transform coding
    definition: "Lossy coding in which a learned nonlinear transform, quantizer and entropy model are trained jointly against rate plus lambda times distortion"
    introduced_in: learned-image-compression

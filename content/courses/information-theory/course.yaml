schema_version: 1
slug: information-theory
title: Information Theory
tagline: Surprisal, entropy, coding limits, and the information view of ML losses
status: in_progress
audience: >
  Engineers comfortable with logs and probability basics; no prior
  information theory. Expects precise statements, computations, and minimal
  ceremony.
tone: >
  Dry, precise, engineering register. Declarative statements of fact; no
  rhetorical questions, no teasers. Second person only in instructions.
intro: >
  Information theory assigns numbers to uncertainty. From a single axiom —
  information over independent events adds — it derives a measure of the
  information in one event (surprisal), the average information of a source
  (entropy), and hard limits on lossless compression that no algorithm can
  beat. The same quantities structure modern machine learning: the
  cross-entropy loss minimized when training a classifier or a language
  model is a coding cost, and a better predictive model is, by construction,
  a better compressor.


  The course covers the discrete theory: surprisal and entropy, prefix codes
  and the Huffman algorithm, the Kraft inequality and the source coding
  theorem, conditional entropy and mutual information, and the
  KL-divergence/cross-entropy toolkit as used in ML. Continuous entropy,
  channel capacity, and error-correcting codes are out of scope.
prerequisites:
  - text: Logarithms and exponents, comfortable manipulation
  - text: "Basic discrete probability: distributions, independence, conditional probability"
  - text: Reading mathematical notation (sums, expectations)
key_results:
  - text: Additivity over independent events forces the logarithmic form of information
    lesson: what-is-surprise
  - text: "Entropy is bounded: 0 <= H(X) <= log2 n, with equality at certainty and at the uniform distribution"
    lesson: entropy-as-average-surprise
  - text: A set of prefix codeword lengths is achievable iff the Kraft budget sum 2^-li <= 1 holds
    lesson: kraft-inequality
  - text: "Source coding theorem: no lossless code averages fewer bits per symbol than the entropy"
    lesson: source-coding-theorem-lite
  - text: "Chain rule: H(X,Y) = H(X) + H(Y|X); mutual information is the resulting drop in uncertainty"
    lesson: mutual-information
  - text: Cross-entropy decomposes as H(p,q) = H(p) + KL(p||q), so minimizing the loss minimizes model-data divergence
    lesson: cross-entropy-loss
sources:
  - C. E. Shannon, "A Mathematical Theory of Communication," Bell System Technical Journal, 1948
  - T. M. Cover, J. A. Thomas, Elements of Information Theory, 2nd ed., Wiley, 2006
  - D. J. C. MacKay, Information Theory, Inference, and Learning Algorithms, Cambridge University Press, 2003
outcomes:
  - id: co-quantify
    text: Compute surprisal and entropy for discrete distributions
    bloom: apply
  - id: co-coding
    text: Explain why entropy bounds lossless compression and build a Huffman code by hand
    bloom: analyze
  - id: co-relate
    text: Compute conditional entropy and mutual information to quantify what one variable reveals about another
    bloom: apply
  - id: co-ml
    text: Analyze cross-entropy loss and KL divergence as coding costs, connecting ML training objectives to compression
    bloom: analyze

modules:
  - slug: foundations
    title: "Surprisal and entropy"
    outcomes: [co-quantify]
    lessons:
      - slug: what-is-surprise
        title: "Surprisal"
        type: core
        status: drafted
        goal: "Compute the surprisal of an event from its probability"
        opening: "An event's information content is determined by its probability alone: the less probable the event, the more information its occurrence carries."
        est_minutes: 13
        prerequisites: []
        concepts:
          introduces: [surprisal]
          reinforces: []
        key_ideas:
          - Rare events carry more information than common ones
          - Independent surprises should add, which forces a logarithm
          - "surprisal = -log2 p, measured in bits"
        demo:
          component: SurprisalSlider
          spec: >
            Slider for p in (0,1]; live readout of -log2 p with a log-curve
            plot; preset buttons for coin flip, die roll, certain event.

      - slug: entropy-as-average-surprise
        title: "Entropy"
        type: core
        status: drafted
        goal: "Compute the entropy of a discrete distribution as expected surprisal"
        opening: "Entropy extends surprisal from single events to whole distributions: it is the expected surprisal of one draw."
        est_minutes: 15
        prerequisites: [what-is-surprise]
        concepts:
          introduces: [entropy]
          reinforces: [surprisal]
        key_ideas:
          - Entropy is the probability-weighted average of surprisal
          - Uniform distributions maximize entropy; certainty gives zero
        demo:
          component: EntropyExplorer
          spec: >
            Draggable bar chart of a 4-outcome distribution (auto-renormalized);
            live H(X) readout; buttons for uniform / certain / skewed presets.

  - slug: coding
    title: "Source coding"
    outcomes: [co-coding]
    lessons:
      - slug: guessing-games-and-codes
        title: "Prefix codes"
        type: worked-practice
        status: planned
        goal: "Construct a binary code from a yes/no question strategy"
        opening: "A yes/no question strategy over a finite outcome set and a binary prefix code are the same object; expected question count equals expected codeword length."
        est_minutes: 16
        prerequisites: [entropy-as-average-surprise]
        concepts:
          introduces: [prefix-code]
          reinforces: [entropy, surprisal]
        key_ideas:
          - A question strategy is a binary code in disguise
          - Good codes give short question-paths to likely outcomes
        demo:
          component: QuestionTreeBuilder
          spec: >
            Click-to-build binary decision tree over 4 weighted outcomes;
            shows expected question count vs. entropy lower bound.

      - slug: huffman-by-hand
        title: "Huffman coding"
        type: worked-practice
        status: planned
        goal: "Build an optimal prefix code with the Huffman algorithm"
        opening: "The Huffman algorithm builds a minimum-expected-length prefix code by repeatedly merging the two least probable symbols."
        est_minutes: 18
        prerequisites: [guessing-games-and-codes]
        concepts:
          introduces: [huffman-coding]
          reinforces: [prefix-code, entropy]
        key_ideas:
          - Merge the lowest-probability pair, repeat
          - Expected length lands within 1 bit of entropy
        demo: null
        notes: "Worked example on {A:.5, B:.25, C:.15, D:.1}; learner generates on a fresh distribution."

      - slug: kraft-inequality
        title: "The Kraft inequality"
        type: core
        status: planned
        goal: "Apply the Kraft inequality to decide whether a set of codeword lengths is achievable"
        opening: "Binary prefix codewords of lengths l1..ln exist if and only if the sum of 2^-li is at most 1: codeword lengths spend a fixed budget."
        est_minutes: 15
        prerequisites: [guessing-games-and-codes, huffman-by-hand]
        concepts:
          introduces: [kraft-inequality]
          reinforces: [prefix-code, huffman-coding]
        key_ideas:
          - Each codeword of length L spends 2^-L of a fixed budget of 1
          - "Kraft: lengths are achievable by a prefix code iff the budget isn't overspent"
          - Short codewords for some symbols force long codewords for others
        demo:
          component: CodewordBudget
          spec: >
            Learner adds/removes codewords of chosen lengths on a binary tree;
            a budget bar fills by 2^-L per codeword and turns red past 1.
            Presets: the impossible {1,2,2,2}, the tight {1,2,3,3}, Huffman's
            output for the previous lesson's distribution.

      - slug: source-coding-theorem-lite
        title: "The source coding theorem"
        type: core
        status: planned
        goal: "Explain why no lossless code can average fewer bits per symbol than the entropy"
        opening: "No lossless code achieves fewer expected bits per symbol than the source entropy. This lesson gives the argument."
        est_minutes: 18
        prerequisites: [kraft-inequality, entropy-as-average-surprise]
        concepts:
          introduces: [source-coding-theorem]
          reinforces: [kraft-inequality, entropy, prefix-code, huffman-coding]
        key_ideas:
          - Any prefix code implicitly bets on a distribution q with q(x) = 2^-length(x)
          - Betting on any q other than the true p can only lengthen your average codeword
          - Coding blocks of symbols squeezes Huffman's 1-bit overhead toward zero
        demo:
          component: BlockCodingGap
          spec: >
            Slider for block size n (1-8) on a biased coin with adjustable bias;
            plots best achievable bits per symbol vs. the entropy line, showing
            the per-symbol gap shrink as n grows. Presets: fair coin, 90/10 coin.

  - slug: shared-information
    title: "Shared information"
    outcomes: [co-relate]
    lessons:
      - slug: joint-and-conditional-entropy
        title: "Joint and conditional entropy"
        type: core
        status: planned
        goal: "Compute conditional entropy from a joint distribution table"
        opening: "Conditional entropy H(Y|X) is the uncertainty remaining in Y once X is observed; the chain rule decomposes joint uncertainty into sequential parts."
        est_minutes: 16
        prerequisites: [entropy-as-average-surprise]
        concepts:
          introduces: [conditional-entropy]
          reinforces: [entropy, surprisal]
        key_ideas:
          - A joint table assigns one probability to each pair of outcomes
          - Conditional entropy is the average leftover uncertainty after observing the other variable
          - "Chain rule: H(X,Y) = H(X) + H(Y|X)"
        demo:
          component: JointEntropyGrid
          spec: >
            2x2 joint-probability grid (sky x rain) with draggable cell masses,
            auto-renormalized; live readouts of H(rain), H(rain|sky), and their
            difference. Presets: independent, perfectly linked, realistic.

      - slug: mutual-information
        title: "Mutual information"
        type: core
        status: planned
        goal: "Compute the mutual information between two variables as the drop in uncertainty"
        opening: "Mutual information I(X;Y) = H(X) - H(X|Y) quantifies, in bits, how much observing one variable reduces uncertainty about the other."
        est_minutes: 16
        prerequisites: [joint-and-conditional-entropy]
        concepts:
          introduces: [mutual-information]
          reinforces: [conditional-entropy, entropy]
        key_ideas:
          - "I(X;Y) = H(X) - H(X|Y): the bits one variable removes from the other's uncertainty"
          - Mutual information is symmetric, and zero exactly when the variables are independent
          - Correlation can miss dependence; mutual information cannot
        demo:
          component: MutualInfoDial
          spec: >
            Dependence slider morphs a 2x2 joint distribution from independent
            to perfectly coupled; stacked-bar view splits H(X) into H(X|Y) and
            I(X;Y) live. Presets: independent, noisy channel, lockstep.

      - slug: entropy-of-english
        title: "Entropy of English text"
        type: worked-practice
        status: planned
        goal: "Estimate the entropy of English text with Shannon's guessing game"
        opening: "English text carries roughly one bit of information per letter while ASCII spends eight; the gap is redundancy, and Shannon's guessing game measures it."
        est_minutes: 15
        prerequisites: [joint-and-conditional-entropy, guessing-games-and-codes]
        concepts:
          introduces: [entropy-rate]
          reinforces: [conditional-entropy, entropy, surprisal]
        key_ideas:
          - Context slashes uncertainty; the entropy rate is per-symbol entropy given unlimited context
          - Shannon's game turns human next-letter guesses into an entropy estimate
          - Redundancy is the gap between raw encoding size and the entropy rate
        demo: null
        notes: >-
          Worked example: play the guessing game on a short sentence, tally
          guess counts, convert to a bits-per-letter estimate; learner repeats
          on a fresh sentence. No demo — the guessing game runs in prose (D1).

  - slug: information-in-ml
    title: "Information theory in ML"
    outcomes: [co-ml]
    lessons:
      - slug: kl-divergence
        title: "KL divergence"
        type: core
        status: planned
        goal: "Compute the KL divergence between two distributions as expected extra bits"
        opening: "KL divergence D(p||q) is the expected extra code length paid when data distributed as p is encoded with a code optimized for q."
        est_minutes: 16
        prerequisites: [source-coding-theorem-lite]
        concepts:
          introduces: [kl-divergence]
          reinforces: [entropy, surprisal, huffman-coding, source-coding-theorem]
        key_ideas:
          - Coding with the wrong distribution q costs extra bits over coding with the true p
          - "KL(p||q) is exactly that expected overhead — always >= 0, zero iff p = q"
          - KL is asymmetric because it matters which distribution is real
        demo:
          component: KLMismatch
          spec: >
            Two draggable 4-bar distributions, true p and model q; live readouts
            of H(p), cross-entropy H(p,q), and their gap KL(p||q). Presets:
            perfect model, overconfident model, missing-outcome disaster.

      - slug: cross-entropy-loss
        title: "Cross-entropy"
        type: core
        status: planned
        goal: "Explain why minimizing cross-entropy loss drives a model's predictions toward the true label distribution"
        opening: "Cross-entropy decomposes as H(p,q) = H(p) + KL(p||q); minimizing cross-entropy loss minimizes the divergence of the model from the data distribution."
        est_minutes: 16
        prerequisites: [kl-divergence]
        concepts:
          introduces: [cross-entropy]
          reinforces: [kl-divergence, entropy, surprisal]
        key_ideas:
          - Log-loss on one example is the surprisal your model assigns to the truth
          - "Cross-entropy decomposes: H(p,q) = H(p) + KL(p||q)"
          - Minimizing cross-entropy minimizes KL, since H(p) is out of the model's hands
        demo: null
        notes: >-
          Reuse KLMismatch mentally rather than a new demo; the decomposition is
          a static identity best carried by a figure (D1). Include the
          confident-wrong-prediction blowup as a worked example.

      - slug: compression-is-prediction
        title: "Compression as prediction"
        type: synthesis
        status: planned
        goal: "Explain why a better predictive model is exactly a better compressor, and vice versa"
        opening: "A predictive model defines a compressor and a compressor defines a predictive model; cross-entropy on a stream equals achievable compressed size in bits."
        est_minutes: 18
        prerequisites: [cross-entropy-loss, entropy-of-english, source-coding-theorem-lite]
        concepts:
          introduces: []
          reinforces: [cross-entropy, kl-divergence, source-coding-theorem, entropy-rate, prefix-code, kraft-inequality]
        key_ideas:
          - A predictive model's cross-entropy on a stream is its achievable compressed size in bits
          - Every compressor implicitly carries a probability model, spending its Kraft budget
          - The whole course in one line - entropy floors, model mismatch costs KL, prediction pays in bits
        demo:
          component: PredictiveCompressor
          spec: >
            Textarea for learner-typed text; toggle between three models
            (uniform bytes, letter frequencies, bigram) and watch bits/char and
            total compressed size respond. Presets: English sentence, repeated
            character, random keyboard mash. Sandbox culmination per D4.

schema_version: 1
slug: information-theory
title: Information Theory
tagline: Surprisal, entropy, the coding and channel limits, and the information-theoretic principles behind modern learning
status: in_progress
audience: >
  Engineers comfortable with logs and probability basics; no prior
  information theory. Expects precise statements, computations, and minimal
  ceremony.
tone: >
  Dry, precise, engineering register. Declarative statements of fact; no
  rhetorical questions, no teasers. Second person only in instructions.
intro: >
  Information theory assigns numbers to uncertainty. From a single axiom —
  information over independent events adds — it derives a measure of the
  information in one event (surprisal), the average information of a source
  (entropy), and hard limits that no algorithm or physical device can beat:
  how few bits a source can be compressed into, and how fast information can
  cross a noisy channel. The same quantities structure modern machine
  learning: the cross-entropy loss minimized when training a classifier or a
  language model is a coding cost, and a better predictive model is, by
  construction, a better compressor.


  The course builds the discrete theory in three passes. The classical core:
  surprisal and entropy; prefix codes, the Kraft inequality, Huffman coding
  and the source coding theorem; joint and conditional entropy, mutual
  information, and the data-processing inequality; and the second half of
  Shannon's theory — channel capacity and the noisy-channel coding theorem,
  which give mutual information its own operational limit. The machine-learning
  reinterpretation: KL divergence and cross-entropy as coding costs,
  compression as prediction, and Kolmogorov complexity as the uncomputable
  ceiling under both. The optimization principles in current use: maximum
  entropy (statistical mechanics and softmax), rate-distortion theory (lossy
  compression and neural codecs), minimum description length (model selection
  and scaling laws), the information bottleneck, and the InfoNCE bound behind
  contrastive representation learning. A closing pair applies the same measures
  outside engineering: the mutual information a neural spike train carries, and
  the thermodynamic cost of a bit.


  Scope: the treatment is discrete. Differential (continuous) entropy appears
  only where a named result needs it — the Gaussian channel and the Gaussian
  rate-distortion function — and is stated without measure-theoretic
  machinery. Explicit error-correcting code constructions beyond the Hamming
  (7,4) example, and the full random-coding proof of the channel coding
  theorem, are out of scope; the theorem is stated with its argument sketched.
prerequisites:
  - text: Logarithms and exponents, comfortable manipulation
  - text: "Basic discrete probability: distributions, independence, conditional probability"
  - text: Reading mathematical notation (sums, expectations)
key_results:
  - text: Additivity over independent events forces the logarithmic form of information
    lesson: what-is-surprise
  - text: "Entropy is bounded: 0 <= H(X) <= log2 n, with equality at certainty and at the uniform distribution"
    lesson: entropy-as-average-surprise
  - text: A set of prefix codeword lengths is achievable iff the Kraft budget sum 2^-li <= 1 holds
    lesson: kraft-inequality
  - text: "Source coding theorem: no lossless code averages fewer bits per symbol than the entropy"
    lesson: source-coding-theorem-lite
  - text: "Chain rule: H(X,Y) = H(X) + H(Y|X); mutual information I(X;Y) = H(X) - H(X|Y) is the resulting drop in uncertainty"
    lesson: mutual-information
  - text: "Data-processing inequality: no function of X can increase its information about Y — I(T;Y) <= I(X;Y) for Y -> X -> T"
    lesson: data-processing-inequality
  - text: "The entropy rate of printed English is on the order of one bit per letter; roughly 75% of English text is redundancy"
    lesson: entropy-of-english
  - text: "Channel capacity C = max over inputs of I(X;Y); the binary symmetric channel has C = 1 - H(p)"
    lesson: channel-capacity
  - text: "Noisy-channel coding theorem: every rate below capacity is achievable with vanishing error, and no rate above it is"
    lesson: noisy-channel-coding
  - text: Cross-entropy decomposes as H(p,q) = H(p) + KL(p||q), so minimizing the loss minimizes model-data divergence
    lesson: cross-entropy-loss
  - text: "A predictive model's cross-entropy on a stream is its achievable compressed size: language-model training is a compression objective"
    lesson: compression-is-prediction
  - text: "Kolmogorov complexity K(x) — the length of the shortest program printing x — is the ultimate compression limit, is uncomputable, and equals entropy in expectation"
    lesson: kolmogorov-complexity
  - text: "The maximum-entropy distribution under expectation constraints has exponential form — the Boltzmann distribution and the softmax layer are the same solution"
    lesson: max-entropy-principle
  - text: "Rate-distortion function R(D) = min I(X;X-hat) subject to expected distortion <= D gives the least rate for lossy reconstruction within fidelity D"
    lesson: rate-distortion
  - text: "Two-part description length L(H) + L(D|H) turns model selection into compression; the parameter cost grows like (k/2) log2 n"
    lesson: minimum-description-length
  - text: "Information bottleneck: minimize I(X;T) - beta I(T;Y) to keep the bits of X that inform a target Y and discard the rest"
    lesson: information-bottleneck
  - text: "InfoNCE: an N-way contrastive classification loss lower-bounds mutual information, I(X;Y) >= log2 N - L_N"
    lesson: infonce
  - text: "Landauer's principle: erasing one bit of information dissipates at least kT ln 2 of heat, giving a bit a physical price"
    lesson: thermodynamics-of-information
sources:
  - C. E. Shannon, "A Mathematical Theory of Communication," Bell System Technical Journal, 1948
  - C. E. Shannon, "Prediction and Entropy of Printed English," Bell System Technical Journal, 1951
  - T. M. Cover, J. A. Thomas, Elements of Information Theory, 2nd ed., Wiley, 2006
  - D. J. C. MacKay, Information Theory, Inference, and Learning Algorithms, Cambridge University Press, 2003
  - Y. Polyanskiy, Y. Wu, Lecture Notes on Information Theory (MIT 6.441 / UIUC), 2016
  - E. T. Jaynes, "Information Theory and Statistical Mechanics," Physical Review 106, 1957
  - P. Grünwald, "A Tutorial Introduction to the Minimum Description Length Principle," in Advances in Minimum Description Length, MIT Press, 2004
  - N. Tishby, F. C. Pereira, W. Bialek, "The Information Bottleneck Method," 1999
  - A. van den Oord, Y. Li, O. Vinyals, "Representation Learning with Contrastive Predictive Coding," 2018
  - G. Delétang, A. Ruoss, et al., "Language Modeling Is Compression," ICLR 2024
  - J. Ballé, V. Laparra, E. P. Simoncelli, "End-to-end Optimized Image Compression," ICLR 2017
  - A. Shen, V. A. Uspensky, N. Vereshchagin, Kolmogorov Complexity and Algorithmic Randomness, AMS, 2017
  - A. Borst, F. E. Theunissen, "Information Theory and Neural Coding," Nature Neuroscience 2, 1999
  - J. M. R. Parrondo, J. M. Horowitz, T. Sagawa, "Thermodynamics of Information," Nature Physics 11, 2015
outcomes:
  - id: co-quantify
    text: Compute surprisal and entropy for discrete distributions
    bloom: apply
  - id: co-coding
    text: Explain why entropy bounds lossless compression and build a Huffman code by hand
    bloom: analyze
  - id: co-relate
    text: Compute conditional entropy and mutual information, and apply the data-processing inequality to bound what one variable reveals about another
    bloom: analyze
  - id: co-channel
    text: Compute the capacity of a discrete channel and explain the noisy-channel coding theorem
    bloom: analyze
  - id: co-ml
    text: Analyze cross-entropy loss, KL divergence, and description length as coding costs, connecting ML objectives to compression and its algorithmic limit
    bloom: analyze
  - id: co-principles
    text: Analyze the information-theoretic optimization principles used in modern inference and learning — maximum entropy, rate-distortion, minimum description length, the information bottleneck, and contrastive mutual-information bounds
    bloom: analyze
  - id: co-sciences
    text: Apply mutual information and entropy to quantify systems in the natural sciences — neural codes and the thermodynamic cost of information
    bloom: apply

modules:
  - slug: foundations
    title: "Surprisal and entropy"
    outcomes: [co-quantify]
    lessons:
      - slug: what-is-surprise
        title: "Surprisal"
        type: core
        status: drafted
        goal: "Compute the surprisal of an event from its probability"
        opening: "An event's information content is determined by its probability alone: the less probable the event, the more information its occurrence carries."
        est_minutes: 13
        prerequisites: []
        concepts:
          introduces: [surprisal]
          reinforces: []
        key_ideas:
          - Rare events carry more information than common ones
          - Independent surprises should add, which forces a logarithm
          - "surprisal = -log2 p, measured in bits"
        demo:
          component: SurprisalSlider
          spec: >
            Slider for p in (0,1]; live readout of -log2 p with a log-curve
            plot; preset buttons for coin flip, die roll, certain event.

      - slug: entropy-as-average-surprise
        title: "Entropy"
        type: core
        status: drafted
        goal: "Compute the entropy of a discrete distribution as expected surprisal"
        opening: "Entropy extends surprisal from single events to whole distributions: it is the expected surprisal of one draw."
        est_minutes: 15
        prerequisites: [what-is-surprise]
        concepts:
          introduces: [entropy]
          reinforces: [surprisal]
        key_ideas:
          - Entropy is the probability-weighted average of surprisal
          - Uniform distributions maximize entropy; certainty gives zero
        demo:
          component: EntropyExplorer
          spec: >
            Draggable bar chart of a 4-outcome distribution (auto-renormalized);
            live H(X) readout; buttons for uniform / certain / skewed presets.

  - slug: coding
    title: "Source coding"
    outcomes: [co-coding]
    lessons:
      - slug: prefix-codes
        title: "Prefix codes and code trees"
        type: core
        status: planned
        goal: "Construct a prefix code from a decoding strategy and compute its expected length"
        opening: "A yes/no question strategy over a finite outcome set and a binary prefix code are the same object: each outcome sits at a leaf of a decision tree, and its depth is the length of its codeword."
        est_minutes: 16
        prerequisites: [entropy-as-average-surprise]
        concepts:
          introduces: [prefix-code]
          reinforces: [entropy, surprisal]
        key_ideas:
          - "A question strategy is a binary decision tree: depth = questions asked = codeword length"
          - Prefix-free means outcomes sit at leaves only, so a concatenated stream decodes without separators
          - "Expected codeword length L = sum of p times length is the cost to minimize; entropy is the floor (proved two lessons on)"
          - Good strategies split probability mass near in half, giving likely outcomes short codewords
        demo: null
        notes: >-
          Re-split from the previous pass's merged prefix-codes lesson: this
          half owns the tree/code correspondence and expected length; the Kraft
          inequality is now the next lesson. Build the tree on
          {A:.5, B:.25, C:.15, D:.1} via a FigureSequence, not a demo.

      - slug: kraft-inequality
        title: "The Kraft inequality"
        type: core
        status: planned
        goal: "Apply the Kraft inequality to decide whether a set of codeword lengths is achievable by a prefix code"
        opening: "A codeword of length L claims the fraction 2^-L of a fixed budget of one, and a prefix code exists with a given set of lengths exactly when those fractions sum to at most one — the Kraft inequality."
        est_minutes: 18
        prerequisites: [prefix-codes]
        concepts:
          introduces: [kraft-inequality]
          reinforces: [prefix-code, entropy]
        key_ideas:
          - Each codeword of length L claims 2^-L of the tree below it; prefix-free means those subtrees are disjoint
          - "Necessity: disjoint subtrees force the budget sum 2^-li <= 1"
          - "Sufficiency: given lengths obeying the budget, assign codewords shortest-first to build the code"
          - McMillan extends the same bound to every uniquely decodable code, so prefix codes lose nothing
          - "Equality sum 2^-li = 1 marks a complete code with no wasted nodes"
        demo:
          component: CodewordBudget
          spec: >
            Learner adds/removes codewords of chosen lengths on a binary tree;
            a budget bar fills by 2^-L per codeword and turns red past 1.
            Presets: the impossible {1,2,2,2}, the tight {1,2,3,3}, and the
            question tree for {A:.5, B:.25, C:.15, D:.1}.

      - slug: huffman-by-hand
        title: "Huffman coding"
        type: worked-practice
        status: planned
        goal: "Build an optimal prefix code with the Huffman algorithm"
        opening: "The Huffman algorithm builds a minimum-expected-length prefix code by repeatedly merging the two least probable symbols."
        est_minutes: 18
        prerequisites: [kraft-inequality]
        concepts:
          introduces: [huffman-coding]
          reinforces: [prefix-code, kraft-inequality, entropy]
        key_ideas:
          - Merge the lowest-probability pair, repeat
          - Expected length lands within 1 bit of entropy
        demo: null
        notes: "Worked example on {A:.5, B:.25, C:.15, D:.1}; learner generates on a fresh distribution."

      - slug: source-coding-theorem-lite
        title: "The source coding theorem"
        type: core
        status: planned
        goal: "Explain why no lossless code can average fewer bits per symbol than the entropy"
        opening: "No lossless code achieves fewer expected bits per symbol than the source entropy. This lesson gives the argument."
        est_minutes: 18
        prerequisites: [huffman-by-hand, entropy-as-average-surprise]
        concepts:
          introduces: [source-coding-theorem, typical-set]
          reinforces: [kraft-inequality, entropy, prefix-code, huffman-coding]
        key_ideas:
          - Any prefix code implicitly bets on a distribution q with q(x) = 2^-length(x)
          - Betting on any q other than the true p can only lengthen your average codeword
          - "A long block of symbols concentrates on ~2^{nH} typical sequences, so nH bits suffice"
          - Coding blocks of symbols squeezes Huffman's 1-bit overhead toward zero
        demo:
          component: BlockCodingGap
          spec: >
            Slider for block size n (1-8) on a biased coin with adjustable bias;
            plots best achievable bits per symbol vs. the entropy line, showing
            the per-symbol gap shrink as n grows. Presets: fair coin, 90/10 coin.

  - slug: shared-information
    title: "Shared information"
    outcomes: [co-relate]
    lessons:
      - slug: joint-and-conditional-entropy
        title: "Joint and conditional entropy"
        type: core
        status: planned
        goal: "Compute conditional entropy from a joint distribution table"
        opening: "Conditional entropy H(Y|X) is the uncertainty remaining in Y once X is observed; the chain rule decomposes joint uncertainty into sequential parts."
        est_minutes: 16
        prerequisites: [entropy-as-average-surprise]
        concepts:
          introduces: [conditional-entropy]
          reinforces: [entropy, surprisal]
        key_ideas:
          - A joint table assigns one probability to each pair of outcomes
          - Conditional entropy is the average leftover uncertainty after observing the other variable
          - "Chain rule: H(X,Y) = H(X) + H(Y|X)"
        demo:
          component: JointEntropyGrid
          spec: >
            2x2 joint-probability grid (sky x rain) with draggable cell masses,
            auto-renormalized; live readouts of H(rain), H(rain|sky), and their
            difference. Presets: independent, perfectly linked, realistic.

      - slug: mutual-information
        title: "Mutual information"
        type: core
        status: planned
        goal: "Compute the mutual information between two variables as the drop in uncertainty"
        opening: "Mutual information I(X;Y) = H(X) - H(X|Y) quantifies, in bits, how much observing one variable reduces uncertainty about the other."
        est_minutes: 16
        prerequisites: [joint-and-conditional-entropy]
        concepts:
          introduces: [mutual-information]
          reinforces: [conditional-entropy, entropy]
        key_ideas:
          - "I(X;Y) = H(X) - H(X|Y): the bits one variable removes from the other's uncertainty"
          - Mutual information is symmetric, and zero exactly when the variables are independent
          - Correlation can miss dependence; mutual information cannot
        demo:
          component: MutualInfoDial
          spec: >
            Dependence slider morphs a 2x2 joint distribution from independent
            to perfectly coupled; stacked-bar view splits H(X) into H(X|Y) and
            I(X;Y) live. Presets: independent, noisy channel, lockstep.

      - slug: data-processing-inequality
        title: "The data-processing inequality"
        type: core
        status: planned
        goal: "Apply the data-processing inequality to bound how much a representation reveals about a target"
        opening: "For any variable T computed from X, no processing can increase information about a third variable Y: if Y, X, T form a Markov chain, then I(T;Y) <= I(X;Y)."
        est_minutes: 16
        prerequisites: [mutual-information]
        concepts:
          introduces: [data-processing-inequality]
          reinforces: [mutual-information, conditional-entropy]
        key_ideas:
          - "For a Markov chain Y -> X -> T, I(T;Y) <= I(X;Y): processing only loses information"
          - The proof expands I(Y;X,T) two ways with the chain rule and kills the Markov term
          - Equality holds exactly when T is a sufficient statistic for Y
          - "Post-processing cannot manufacture information: a learned feature of X knows no more about Y than X did"
        demo: null
        notes: >-
          Pulled out of the previous pass's information-bottleneck lesson, where
          it was crammed in as a sub-result. Standalone here so channel coding,
          rate-distortion, and the bottleneck can all cite it. Static theorem —
          use figures/FigureSequence, no demo.

      - slug: entropy-of-english
        title: "Entropy of English text"
        type: worked-practice
        status: planned
        goal: "Estimate the entropy of English text with Shannon's guessing game"
        opening: "English text carries roughly one bit of information per letter while ASCII spends eight; the gap is redundancy, and Shannon's guessing game measures it."
        est_minutes: 15
        prerequisites: [joint-and-conditional-entropy, prefix-codes]
        concepts:
          introduces: [entropy-rate]
          reinforces: [conditional-entropy, entropy, surprisal]
        key_ideas:
          - Context slashes uncertainty; the entropy rate is per-symbol entropy given unlimited context
          - Shannon's game turns human next-letter guesses into an entropy estimate
          - Redundancy is the gap between raw encoding size and the entropy rate
        demo: null
        notes: >-
          Worked example: play the guessing game on a short sentence, tally
          guess counts, convert to a bits-per-letter estimate; learner repeats
          on a fresh sentence. No demo — the guessing game runs in prose (D1).

  - slug: channels
    title: "Channels and capacity"
    outcomes: [co-channel]
    lessons:
      - slug: channel-capacity
        title: "Channel capacity"
        type: core
        status: planned
        goal: "Compute the capacity of a discrete memoryless channel"
        opening: "A noisy channel is a conditional distribution p(y|x), and its capacity is the largest mutual information any input distribution can push through it: C = max over p(x) of I(X;Y)."
        est_minutes: 18
        prerequisites: [mutual-information]
        concepts:
          introduces: [channel-capacity]
          reinforces: [mutual-information, conditional-entropy, entropy]
        key_ideas:
          - A discrete channel is a transition table p(y|x); noise is the conditional entropy H(Y|X)
          - "Capacity is mutual information maximized over the input: C = max_p(x) I(X;Y), in bits per use"
          - "Binary symmetric channel: C = 1 - H(p), zero at p = 1/2 and one at p = 0"
          - "Binary erasure channel: C = 1 - e, the fraction of symbols that survive"
          - Capacity is the channel counterpart of entropy — the second of Shannon's two limits
        demo:
          component: ChannelCapacityDial
          spec: >
            Toggle between a binary symmetric channel and a binary erasure
            channel; slider for the noise parameter with a live capacity
            readout, plus an I(X;Y)-vs-input-bias curve for the fixed channel
            showing the maximum at the uniform input. Presets: noiseless,
            BSC p=0.1, BSC p=0.5 (zero capacity), BEC e=0.5.

      - slug: noisy-channel-coding
        title: "The noisy-channel coding theorem"
        type: core
        status: planned
        goal: "Explain why capacity is the exact threshold between reliable and unreliable communication"
        opening: "Reliable communication is possible at every rate below the channel capacity and impossible above it: capacity is a sharp threshold, not a soft trade-off."
        est_minutes: 20
        prerequisites: [channel-capacity, data-processing-inequality]
        concepts:
          introduces: [noisy-channel-coding-theorem, fano-inequality]
          reinforces: [channel-capacity, mutual-information, typical-set, entropy]
        key_ideas:
          - Redundancy added the right way beats noise; the amount alone does not
          - "Achievability: random codebooks plus joint-typicality decoding make error vanish for any rate below C"
          - "Converse: Fano's inequality bounds error below when the rate exceeds C, so capacity cannot be crossed"
          - "The Hamming (7,4) code is a concrete rate-4/7 single-error-correcting code"
          - Capacity gives mutual information its operational meaning, mirroring entropy and source coding
        demo:
          component: ChannelCodingThreshold
          spec: >
            Precomputed on a binary symmetric channel: sliders for rate R and
            blocklength n; a plot of achievable block-error probability against
            R shows the cliff at C, dropping to 0 for R<C and rising to 1/2 for
            R>C as n grows. Presets: below capacity, at capacity, above capacity.

  - slug: information-in-ml
    title: "Information theory in machine learning"
    outcomes: [co-ml]
    lessons:
      - slug: kl-divergence
        title: "KL divergence"
        type: core
        status: planned
        goal: "Compute the KL divergence between two distributions as expected extra bits"
        opening: "KL divergence D(p||q) is the expected extra code length paid when data distributed as p is encoded with a code optimized for q."
        est_minutes: 16
        prerequisites: [source-coding-theorem-lite]
        concepts:
          introduces: [kl-divergence]
          reinforces: [entropy, surprisal, huffman-coding, source-coding-theorem]
        key_ideas:
          - Coding with the wrong distribution q costs extra bits over coding with the true p
          - "KL(p||q) is exactly that expected overhead — always >= 0, zero iff p = q"
          - KL is asymmetric because it matters which distribution is real
        demo:
          component: KLMismatch
          spec: >
            Two draggable 4-bar distributions, true p and model q; live readouts
            of H(p), cross-entropy H(p,q), and their gap KL(p||q). Presets:
            perfect model, overconfident model, missing-outcome disaster.

      - slug: cross-entropy-loss
        title: "Cross-entropy"
        type: core
        status: planned
        goal: "Explain why minimizing cross-entropy loss drives a model's predictions toward the true label distribution"
        opening: "Cross-entropy decomposes as H(p,q) = H(p) + KL(p||q); minimizing cross-entropy loss minimizes the divergence of the model from the data distribution."
        est_minutes: 16
        prerequisites: [kl-divergence]
        concepts:
          introduces: [cross-entropy]
          reinforces: [kl-divergence, entropy, surprisal]
        key_ideas:
          - Log-loss on one example is the surprisal your model assigns to the truth
          - "Cross-entropy decomposes: H(p,q) = H(p) + KL(p||q)"
          - Minimizing cross-entropy minimizes KL, since H(p) is out of the model's hands
        demo: null
        notes: >-
          Reuse KLMismatch mentally rather than a new demo; the decomposition is
          a static identity best carried by a figure (D1). Include the
          confident-wrong-prediction blowup as a worked example.

      - slug: compression-is-prediction
        title: "Compression as prediction"
        type: synthesis
        status: planned
        goal: "Explain why a better predictive model is exactly a better compressor, and vice versa"
        opening: "A predictive model defines a compressor and a compressor defines a predictive model; cross-entropy on a stream equals achievable compressed size in bits."
        est_minutes: 18
        prerequisites: [cross-entropy-loss, entropy-of-english, source-coding-theorem-lite]
        concepts:
          introduces: []
          reinforces: [cross-entropy, kl-divergence, source-coding-theorem, entropy-rate, prefix-code, kraft-inequality]
        key_ideas:
          - A predictive model's cross-entropy on a stream is its achievable compressed size in bits
          - Every compressor implicitly carries a probability model, spending its Kraft budget
          - The whole course in one line - entropy floors, model mismatch costs KL, prediction pays in bits
        demo:
          component: PredictiveCompressor
          spec: >
            Textarea for learner-typed text; toggle between three models
            (uniform bytes, letter frequencies, bigram) and watch bits/char and
            total compressed size respond. Presets: English sentence, repeated
            character, random keyboard mash. Sandbox culmination per D4.

      - slug: kolmogorov-complexity
        title: "Kolmogorov complexity"
        type: core
        status: planned
        goal: "Explain Kolmogorov complexity as the shortest-program limit under all compression"
        opening: "The Kolmogorov complexity of a string is the length of the shortest program that prints it: the single number under which no compressor, however clever, can push the string."
        est_minutes: 18
        prerequisites: [compression-is-prediction, source-coding-theorem-lite]
        concepts:
          introduces: [kolmogorov-complexity]
          reinforces: [source-coding-theorem, cross-entropy, entropy]
        key_ideas:
          - "K(x) = length of the shortest program printing x; regularity is exactly compressibility"
          - The invariance theorem makes K well-defined up to an additive constant across languages
          - A counting argument shows almost every string is incompressible, so most data has no short description
          - K is uncomputable — the ideal compressor cannot be run — via Berry's paradox
          - "Expected K equals entropy for a computable source, and the ideal predictor (Solomonoff) is the compression ceiling under compression-is-prediction"
        demo: null
        notes: >-
          New lesson. The uncomputable ceiling under compression-is-prediction
          and the theoretical parent of MDL (ideal MDL = two-part Kolmogorov
          code). No demo — K is uncomputable; carry it with figures (the
          incompressibility count, the invariance additive constant, Berry's
          paradox).

  - slug: principles
    title: "Optimization principles in inference and learning"
    outcomes: [co-principles]
    lessons:
      - slug: max-entropy-principle
        title: "The maximum entropy principle"
        type: core
        status: planned
        goal: "Derive the maximum-entropy distribution under expectation constraints"
        opening: "Among all distributions consistent with known expectation constraints, exactly one maximizes entropy, and it has exponential form; choosing any other distribution assumes information you do not have."
        est_minutes: 18
        prerequisites: [entropy-as-average-surprise, kl-divergence]
        concepts:
          introduces: [max-entropy-principle]
          reinforces: [entropy, kl-divergence, surprisal]
        key_ideas:
          - Constraints leave many candidate distributions; entropy ranks them by how little extra they assume
          - "The maximizer is exponential in the constrained quantities: p(x) proportional to exp(-sum of lambda_r f_r(x)), normalized by a partition function"
          - Gibbs' inequality (D >= 0) proves optimality without calculus of variations
          - The Boltzmann distribution of statistical mechanics and the softmax layer are instances of the same solution
        demo:
          component: MaxEntDice
          spec: >
            Slider for the target mean of a six-sided die; shows the
            maximum-entropy distribution tilting exponentially, with live
            lambda and H readouts. Presets: mean 3.5 (uniform), Jaynes' 4.5
            (Brandeis dice), mean 2.

      - slug: rate-distortion
        title: "Rate-distortion theory"
        type: core
        status: planned
        goal: "Compute the rate-distortion function of a source under a fidelity constraint"
        opening: "Lossy compression trades bits for fidelity, and the rate-distortion function R(D) = min I(X;X-hat) subject to expected distortion at most D is the fewest bits per symbol that buy reconstruction within tolerance D."
        est_minutes: 19
        prerequisites: [mutual-information, kl-divergence, source-coding-theorem-lite]
        concepts:
          introduces: [rate-distortion]
          reinforces: [mutual-information, kl-divergence, entropy, conditional-entropy]
        key_ideas:
          - Perfect reconstruction is unnecessary; a distortion measure d(x,x-hat) sets the tolerance
          - "R(D) = min over test channels p(x-hat|x) of I(X;X-hat) subject to E[d] <= D — mutual information is the rate"
          - "Bernoulli(p) source under Hamming distortion: R(D) = H(p) - H(D) for D <= p, then zero"
          - "Gaussian source under squared error: R(D) = (1/2) log2(sigma^2 / D)"
          - Neural image codecs minimize rate + lambda*distortion directly, the trade-off made trainable
        demo:
          component: RateDistortionCurve
          spec: >
            Bernoulli(p) source under Hamming distortion; slider for allowed
            distortion D traces R(D) = H(p) - H(D) down to zero at D = p, with a
            toggle to the Gaussian curve (1/2) log2(sigma^2/D). Presets: fair
            source, biased source, near-lossless vs. coarse.

      - slug: minimum-description-length
        title: "Minimum description length"
        type: core
        status: planned
        goal: "Apply two-part code lengths to select a model that neither underfits nor overfits"
        opening: "Model selection is a compression problem: the best hypothesis for a dataset minimizes the total description length L(H) + L(D|H) — the bits to state the model plus the bits to state the data given the model."
        est_minutes: 19
        prerequisites: [source-coding-theorem-lite, compression-is-prediction, kolmogorov-complexity]
        concepts:
          introduces: [minimum-description-length]
          reinforces: [source-coding-theorem, cross-entropy, kraft-inequality, kl-divergence, kolmogorov-complexity]
        key_ideas:
          - "L(D|H) = -log2 P(D|H): fit is measured in bits via the code-probability correspondence"
          - A richer model shortens L(D|H) but lengthens L(H); the total is U-shaped in model complexity
          - Encoding k parameters to the precision the data supports costs about (k/2) log2 n bits
          - Practical MDL is the computable approximation of the uncomputable ideal (Kolmogorov) two-part code
          - Charging a neural model its own parameter bits gives the adjusted compression rate, an MDL reading of scaling laws
        demo:
          component: TwoPartCode
          spec: >
            Fixed noisy dataset; slider for polynomial degree k; stacked live
            readout of L(H), L(D|H), and the total, with the U-shaped total
            curve traced. Presets: underfit (k=0), the sweet spot, an
            interpolating degree.

      - slug: information-bottleneck
        title: "The information bottleneck"
        type: core
        status: planned
        goal: "Analyze the information bottleneck objective as a trade-off between compression and preserved relevant information"
        opening: "The information bottleneck makes relevant compression precise: choose a stochastic encoder mapping X to T that minimizes I(X;T) - beta I(T;Y), keeping the bits of X that inform the target Y and discarding the rest."
        est_minutes: 19
        prerequisites: [rate-distortion, data-processing-inequality, kl-divergence]
        concepts:
          introduces: [information-bottleneck]
          reinforces: [mutual-information, data-processing-inequality, rate-distortion, conditional-entropy, kl-divergence]
        key_ideas:
          - Rate-distortion needs a hand-picked distortion function; the bottleneck replaces it with a second mutual information, I(T;Y)
          - "Minimize I(X;T) - beta I(T;Y): compress X while keeping information about the target Y"
          - Sweeping beta traces a frontier in the information plane (I(X;T) vs I(T;Y)), capped by the data-processing inequality
          - "The optimal encoder's effective distortion measure emerges as a KL divergence — derived from the objective, not assumed"
        demo:
          component: InformationPlane
          spec: >
            Beta slider on a precomputed toy joint (4 input symbols, binary
            label); a point traces the information-plane frontier with live
            I(X;T) and I(T;Y) readouts against the I(X;Y) ceiling. Presets:
            collapse (beta near 0), the knee, copy (beta large).

      - slug: infonce
        title: "The InfoNCE bound"
        type: core
        status: planned
        goal: "Derive the InfoNCE lower bound on mutual information from a contrastive classification loss"
        opening: "A classifier trained to pick the true partner of a context out of N candidates yields a mutual-information estimate: I(X;Y) >= log2 N - L_N, where L_N is the contrastive cross-entropy loss."
        est_minutes: 17
        prerequisites: [mutual-information, cross-entropy-loss, information-bottleneck]
        concepts:
          introduces: [infonce]
          reinforces: [mutual-information, cross-entropy, kl-divergence, information-bottleneck]
        key_ideas:
          - Joint-table mutual information does not scale to images or audio; a bound computable from samples does
          - The optimal contrastive classifier recovers the density ratio p(y|x)/p(y), not the distributions themselves
          - "I(X;Y) >= log2 N - L_N: a low contrastive loss certifies high mutual information"
          - The bound cannot exceed log2 N, so weak losses with few negatives saturate — more candidates raise the ceiling
        demo:
          component: InfoNCESaturation
          spec: >
            Sliders for candidate count N and dependence strength on a toy
            discrete pair; plots the bound log2 N - L_N against the true
            I(X;Y), showing the bound clip at log2 N. Presets: weak dependence,
            strong dependence with small N (saturated), strong with large N.

  - slug: natural-sciences
    title: "Information in the natural sciences"
    outcomes: [co-sciences]
    lessons:
      - slug: neural-coding
        title: "Mutual information of a neural code"
        type: extra
        status: planned
        goal: "Estimate the information a neural spike code carries about a stimulus"
        opening: "A neuron is a noisy channel from stimulus to spike train, and the mutual information I(S;R) = H(R) - H(R|S) measures, in bits, how much its response reveals about what it saw."
        est_minutes: 17
        prerequisites: [channel-capacity, mutual-information]
        concepts:
          introduces: [coding-efficiency]
          reinforces: [mutual-information, channel-capacity, conditional-entropy]
        key_ideas:
          - A stimulus-response table is a channel; the direct method computes I(S;R) = H(R) - H(R|S) from it
          - Recorded single neurons carry on the order of one bit per spike
          - "Coding efficiency = information transmitted / channel capacity: how much of the available channel the code uses"
          - Naturalistic stimuli raise efficiency; mutual information is only meaningful relative to a stimulus ensemble
        demo: null
        notes: >-
          New worked-application lesson. Keep it discrete and computable: a
          small stimulus-response joint, the direct method H(R) - H(R|S), bits
          per spike, and coding efficiency against capacity. Mention the
          Gaussian-channel bound methods (Borst and Theunissen) but do not
          derive continuous channel capacity. Real numbers from the review's
          Table 2 (fly H1, ~1 bit/spike), cited not invented.

      - slug: thermodynamics-of-information
        title: "Thermodynamics of information"
        type: extra
        status: planned
        goal: "Explain Landauer's principle and compute the work bound of a Szilard engine"
        opening: "Information has a physical price: Landauer's principle sets the minimum heat dissipated when one bit is erased at kT ln 2, and Szilard's engine shows one bit of information is worth exactly that much extractable work."
        est_minutes: 18
        prerequisites: [entropy-as-average-surprise, mutual-information, max-entropy-principle]
        concepts:
          introduces: [landauer-principle]
          reinforces: [entropy, mutual-information, max-entropy-principle]
        key_ideas:
          - Shannon entropy and thermodynamic entropy are the same quantity in different units (k ln 2 per bit)
          - "Landauer's principle: erasing one bit dissipates at least kT ln 2 of heat"
          - Szilard's one-molecule engine converts one measured bit into kT ln 2 of work
          - Maxwell's demon does not violate the second law once the cost of resetting its memory is charged
          - "The feedback second law W >= Delta F - kT (ln 2) I(X;M) prices measured information in the same mutual-information currency"
        demo: null
        notes: >-
          New lesson closing the entropy concept at the physical level and
          pairing with max-entropy (the physics face of the theory). The
          Szilard cycle is a process — use a FigureSequence, not a demo.
          Landauer kT ln 2, Szilard extraction, demon resolution (Bennett),
          feedback second law (Sagawa-Ueda) as the mutual-information payoff.

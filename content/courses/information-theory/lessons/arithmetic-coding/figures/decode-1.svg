  <line x1="190" y1="83.0" x2="270" y2="83.0" stroke="currentColor" opacity="0.3"/>
  <rect x="190" y="60.0" width="80" height="230.0" fill="none" stroke="currentColor" opacity="0.45"/>
  <text class="lbl" x="182" y="65.0" text-anchor="end">1</text>

<svg viewBox="0 0 600 306" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <style>
    .lbl { fill: currentColor; font-size: 12px; }
    .hd { fill: currentColor; font-size: 13px; font-weight: bold; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .amb { fill: #e2903a; font-size: 12px; }
    .blu { fill: #4c8dd6; font-size: 16px; font-weight: bold; }
    .box { fill: none; stroke: currentColor; opacity: 0.7; }
  </style>
  <defs>
    <marker id="big" markerWidth="9" markerHeight="9" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 z" fill="#e2903a"/>
    </marker>
  </defs>

  <text class="lbl" x="20" y="22">one file of bytes, |X| = 256, coded two ways</text>

  <!-- panel A: block Huffman -->
  <rect class="box" x="20" y="36" width="250" height="186" rx="5"/>
  <text class="hd" x="145" y="60" text-anchor="middle">block Huffman</text>
  <text class="amb" x="36" y="88">n = 3 symbols per block</text>
  <text class="amb" x="36" y="110">codeword table: 256³ entries</text>
  <text class="muted" x="36" y="128">= 16,777,216 codewords, stored</text>
  <text class="lbl" x="36" y="156">cost per symbol: H + 1/n</text>
  <text class="blu" x="36" y="188">+ 0.33 bits</text>
  <text class="muted" x="36" y="206">of overhead per symbol</text>

  <!-- the changed pair, joined -->
  <line x1="274" y1="129" x2="326" y2="129" stroke="#e2903a" stroke-width="3" marker-end="url(#big)"/>
  <text class="amb" x="300" y="117" text-anchor="middle" font-size="11">n grows</text>

  <!-- panel B: arithmetic -->
  <rect class="box" x="330" y="36" width="250" height="186" rx="5"/>
  <text class="hd" x="455" y="60" text-anchor="middle">arithmetic</text>
  <text class="amb" x="346" y="88">n = 1,000,000 symbols</text>
  <text class="amb" x="346" y="110">codeword table: none</text>
  <text class="muted" x="346" y="128">256 ranges, read once per symbol</text>
  <text class="lbl" x="346" y="156">cost per symbol: H + 2/n</text>
  <text class="blu" x="346" y="188">+ 0.000002 bits</text>
  <text class="muted" x="346" y="206">of overhead per symbol</text>

  <line x1="20" y1="248" x2="580" y2="248" stroke="currentColor" opacity="0.25"/>
  <text class="lbl" x="20" y="272">the constant doubled, 1 bit to 2; the denominator went from 3 to a million</text>
  <text class="muted" x="20" y="292">n is the block a table can hold on the left, the whole file on the right</text>
</svg>

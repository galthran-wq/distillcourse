<svg viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <style>
    .lbl { fill: currentColor; font-size: 12px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .amb { fill: #e2903a; font-size: 12px; }
    .blu { fill: #4c8dd6; font-size: 12px; }
  </style>

  <text class="lbl" x="20" y="24">naming a point inside the final interval of "eaii!"</text>

  <!-- grid lines at the 15-bit boundaries -->
  <g stroke="currentColor" opacity="0.18">
    <line x1="148.2" y1="52" x2="148.2" y2="238"/>
    <line x1="392.3" y1="52" x2="392.3" y2="238"/>
  </g>

  <!-- row 1: the message interval -->
  <rect x="60" y="60" width="480" height="26" fill="#4c8dd6" opacity="0.85" rx="3"/>
  <text class="muted" x="60" y="52">0.23354</text>
  <text class="muted" x="540" y="52" text-anchor="end">0.2336</text>
  <text x="300" y="78" font-size="12" fill="#ffffff" text-anchor="middle">message interval, width w = 0.00006</text>

  <!-- row 2: the 14-bit cell, sticking out on the left -->
  <rect x="10" y="122" width="382.3" height="26" fill="none" stroke="currentColor"
        stroke-dasharray="4 3" opacity="0.6" rx="3"/>
  <line x1="10" y1="122" x2="10" y2="148" stroke="currentColor" opacity="0.25"/>
  <text class="muted" x="20" y="114">14-bit cell [3826/16384, 3827/16384): too wide, it hangs off the left end</text>
  <text class="muted" x="200" y="140">2&#8315;&#185;&#8308; = 0.000061 &gt; w</text>

  <!-- row 3: the 15-bit cells -->
  <rect x="-96" y="184" width="244.2" height="26" fill="currentColor" opacity="0.07" rx="3"/>
  <rect x="148.2" y="184" width="244.1" height="26" fill="#e2903a" opacity="0.9" rx="3"/>
  <rect x="392.3" y="184" width="244.1" height="26" fill="currentColor" opacity="0.07" rx="3"/>
  <text x="270" y="202" font-size="12" fill="#ffffff" text-anchor="middle">0.001110111100101</text>
  <text class="amb" x="148.2" y="176">15-bit cell [7653/32768, 7654/32768): fits inside</text>
  <text class="muted" x="20" y="228">the codeword is the 15 bits after the binary point: 001110111100101</text>

  <line x1="20" y1="248" x2="580" y2="248" stroke="currentColor" opacity="0.25"/>
  <text class="lbl" x="20" y="270">&#8722;log&#8322; w = 14.02 bits &#8594; the bound &#8968;&#8722;log&#8322; w&#8969; + 1 = 16 bits always suffices</text>
  <text class="muted" x="20" y="290">here 15 bits happen to be enough; no interval of width w ever needs more than 16.</text>
</svg>

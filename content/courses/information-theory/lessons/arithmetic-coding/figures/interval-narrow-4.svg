<svg viewBox="0 0 600 340" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <style>
    .lbl { fill: currentColor; font-size: 12px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .amb { fill: #e2903a; font-size: 12px; }
    .ambb { fill: #e2903a; font-size: 13px; font-weight: bold; }
    .inb { fill: #ffffff; font-size: 12px; font-weight: bold; }
  </style>

  <text class="lbl" x="20" y="24">encoding the message "eaii!" under the model {a .2, e .3, i .1, o .2, u .1, ! .1}</text>
  <text class="ambb" x="580" y="46" text-anchor="end">step 4 of 5: encode i</text>
  <rect x="190" y="244.0" width="80" height="46.0" fill="currentColor" opacity="0.07"/>
  <text class="muted" x="230" y="271.0" text-anchor="middle">a</text>
  <rect x="190" y="175.0" width="80" height="69.0" fill="currentColor" opacity="0.07"/>
  <text class="muted" x="230" y="213.5" text-anchor="middle">e</text>
  <rect x="190" y="152.0" width="80" height="23.0" fill="#e2903a" opacity="0.9"/>
  <text class="inb" x="230" y="167.5" text-anchor="middle">i</text>
  <rect x="190" y="106.0" width="80" height="46.0" fill="currentColor" opacity="0.07"/>
  <text class="muted" x="230" y="133.0" text-anchor="middle">o</text>
  <rect x="190" y="83.0" width="80" height="23.0" fill="currentColor" opacity="0.07"/>
  <text class="muted" x="230" y="98.5" text-anchor="middle">u</text>
  <rect x="190" y="60.0" width="80" height="23.0" fill="currentColor" opacity="0.07"/>
  <text class="muted" x="230" y="75.5" text-anchor="middle">!</text>
  <line x1="190" y1="244.0" x2="270" y2="244.0" stroke="currentColor" opacity="0.3"/>
  <line x1="190" y1="175.0" x2="270" y2="175.0" stroke="currentColor" opacity="0.3"/>
  <line x1="190" y1="152.0" x2="270" y2="152.0" stroke="currentColor" opacity="0.3"/>
  <line x1="190" y1="106.0" x2="270" y2="106.0" stroke="currentColor" opacity="0.3"/>
  <line x1="190" y1="83.0" x2="270" y2="83.0" stroke="currentColor" opacity="0.3"/>
  <rect x="190" y="60.0" width="80" height="230.0" fill="none" stroke="currentColor" opacity="0.45"/>
  <text class="lbl" x="182" y="65.0" text-anchor="end">0.236</text>
  <text class="lbl" x="182" y="294.0" text-anchor="end">0.23</text>
  <text class="muted" x="182" y="51.0" text-anchor="end">high</text>
  <text class="muted" x="182" y="308.0" text-anchor="end">low</text>
  <text class="muted" x="320" y="104">the chosen band, redrawn full height:</text>
  <text class="amb" x="320" y="128">new interval [0.233, 0.2336)</text>
  <text class="lbl" x="320" y="152">width w = 0.0006</text>
  <text class="lbl" x="320" y="176">&#8722;log&#8322; w = 10.70 bits</text>
  <line x1="320" y1="196" x2="560" y2="196" stroke="currentColor" opacity="0.25"/>
  <text class="muted" x="320" y="220">message so far</text>
  <text class="lbl" x="320" y="244" font-size="15">eaii</text>
  <text class="muted" x="20" y="324">width after each step = probability of the message so far; the scale is re-expanded every step.</text>
</svg>

<svg viewBox="0 70 600 190" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <style>
    .lbl { fill: currentColor; font-size: 12px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .amb { fill: #e2903a; font-size: 12px; }
    .box { fill: none; stroke: currentColor; }
  </style>
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="currentColor"/>
    </marker>
    <marker id="aha" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#e2903a"/>
    </marker>
  </defs>

  <!-- input -->
  <text class="lbl" x="14" y="104">next symbol</text>
  <line x1="16" y1="116" x2="112" y2="116" stroke="currentColor" marker-end="url(#ah)"/>

  <!-- MODEL box -->
  <rect class="box" x="118" y="84" width="140" height="64" rx="5"/>
  <text class="lbl" x="188" y="110" text-anchor="middle" font-weight="bold">MODEL</text>
  <text class="muted" x="188" y="130" text-anchor="middle">counts, contexts, weights</text>

  <!-- interface arrow -->
  <line x1="258" y1="116" x2="336" y2="116" stroke="#e2903a" stroke-width="2" marker-end="url(#aha)"/>
  <text class="amb" x="298" y="102" text-anchor="middle">cum_freq[ ]</text>
  <text class="amb" x="298" y="170" text-anchor="middle" font-weight="bold">the only interface</text>

  <!-- CODER box -->
  <rect class="box" x="342" y="84" width="140" height="64" rx="5"/>
  <text class="lbl" x="412" y="110" text-anchor="middle" font-weight="bold">CODER</text>
  <text class="muted" x="412" y="130" text-anchor="middle">low, high, pending bits</text>

  <!-- output -->
  <line x1="482" y1="116" x2="536" y2="116" stroke="currentColor" marker-end="url(#ah)"/>
  <text class="lbl" x="544" y="120">bits</text>

  <!-- update feedback -->
  <path d="M188,148 L188,196 L94,196 L94,122" fill="none" stroke="currentColor"
        opacity="0.5" stroke-dasharray="4 3" marker-end="url(#ah)"/>
  <text class="muted" x="200" y="200">counts updated after each symbol</text>

  <line x1="16" y1="220" x2="584" y2="220" stroke="currentColor" opacity="0.25"/>
  <text class="lbl" x="16" y="242">the coder never learns what a symbol means, so any model can be swapped in</text>
</svg>

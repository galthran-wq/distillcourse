<svg viewBox="0 0 340 210" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <style>
    .lbl { fill: currentColor; font-size: 11px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 10px; }
    .val { font-size: 11px; }
  </style>

  <text class="lbl" x="16" y="20" font-weight="bold">cost of the 5-symbol message "eaii!"</text>

  <text class="lbl" x="16" y="42">arithmetic code, model of Table I</text>
  <rect x="16" y="48" width="280.4" height="16" rx="2" fill="#e2903a" opacity="0.9"/>
  <text class="val" x="302" y="60" fill="#e2903a">14.02</text>

  <text class="lbl" x="16" y="94">flat code over the 6-symbol alphabet</text>
  <rect x="16" y="100" width="258.4" height="16" rx="2" fill="currentColor" opacity="0.25"/>
  <text class="val" x="280" y="112" fill="currentColor" opacity="0.7">12.92</text>

  <text class="lbl" x="16" y="146">arithmetic code, message's own frequencies</text>
  <rect x="16" y="152" width="192.2" height="16" rx="2" fill="#4c8dd6" opacity="0.9"/>
  <text class="val" x="214" y="164" fill="#4c8dd6">9.61</text>

  <text class="muted" x="16" y="194">bits; the coder is identical in rows 1 and 3.</text>
</svg>

<svg viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <style>
    .lbl { fill: currentColor; font-size: 12px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .amb { fill: #e2903a; font-size: 12px; }
    .blu { fill: #4c8dd6; font-size: 12px; }
  </style>

  <text class="lbl" x="20" y="24">source p = (0.99, 0.01); message = 10 copies of the probable symbol</text>

  <!-- legend -->
  <rect x="20" y="38" width="12" height="12" rx="2" fill="#4c8dd6"/>
  <text class="muted" x="38" y="48">information in the message</text>
  <rect x="230" y="38" width="12" height="12" rx="2" fill="#e2903a"/>
  <text class="muted" x="248" y="48">overhead</text>

  <!-- row A: symbol code -->
  <text class="lbl" x="20" y="86">Huffman, one codeword per symbol</text>
  <g>
    <rect x="20" y="96" width="440" height="26" fill="#e2903a" opacity="0.9" rx="3"/>
    <g stroke="#ffffff" opacity="0.55">
      <line x1="64" y1="96" x2="64" y2="122"/>
      <line x1="108" y1="96" x2="108" y2="122"/>
      <line x1="152" y1="96" x2="152" y2="122"/>
      <line x1="196" y1="96" x2="196" y2="122"/>
      <line x1="240" y1="96" x2="240" y2="122"/>
      <line x1="284" y1="96" x2="284" y2="122"/>
      <line x1="328" y1="96" x2="328" y2="122"/>
      <line x1="372" y1="96" x2="372" y2="122"/>
      <line x1="416" y1="96" x2="416" y2="122"/>
    </g>
    <rect x="20" y="96" width="6.4" height="26" fill="#4c8dd6"/>
  </g>
  <text class="lbl" x="470" y="114">10 bits</text>
  <text class="muted" x="20" y="140">ten codewords of one bit; 0.986 bits of overhead in every one of them</text>

  <!-- row B: arithmetic code -->
  <text class="lbl" x="20" y="188">arithmetic, one interval per message</text>
  <rect x="20" y="198" width="6.4" height="26" fill="#4c8dd6" rx="1"/>
  <rect x="26.4" y="198" width="88" height="26" fill="#e2903a" opacity="0.9" rx="3"/>
  <text class="lbl" x="124" y="216">2.1 bits</text>
  <text class="muted" x="20" y="242">0.145 bits of information plus at most 2 bits, paid once for the whole message</text>

  <line x1="20" y1="262" x2="580" y2="262" stroke="currentColor" opacity="0.25"/>
  <text class="lbl" x="20" y="284">the overhead moved from per symbol to per message</text>
</svg>

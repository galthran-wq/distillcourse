<svg viewBox="0 0 600 340" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <style>
    .lbl { fill: currentColor; font-size: 12px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .amb { fill: #e2903a; font-size: 12px; }
    .ambb { fill: #e2903a; font-size: 13px; font-weight: bold; }
    .inb { fill: #ffffff; font-size: 12px; font-weight: bold; }
  </style>

  <text class="lbl" x="20" y="24">renormalizing a fixed-width code interval</text>
  <text class="ambb" x="580" y="46" text-anchor="end">3 of 3: the middle-half expansion</text>
  <rect x="210" y="60.0" width="70" height="230.0" fill="none" stroke="currentColor" opacity="0.45"/>
  <line x1="184" y1="232.5" x2="288" y2="232.5" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5"/>
  <text class="muted" x="180" y="236.5" text-anchor="end">First_qtr</text>
  <line x1="184" y1="175.0" x2="288" y2="175.0" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5"/>
  <text class="muted" x="180" y="179.0" text-anchor="end">Half</text>
  <line x1="184" y1="117.5" x2="288" y2="117.5" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5"/>
  <text class="muted" x="180" y="121.5" text-anchor="end">Third_qtr</text>
  <text class="muted" x="180" y="64.0" text-anchor="end">Top_value</text>
  <text class="muted" x="180" y="294.0" text-anchor="end">0</text>
  <rect x="224" y="152.0" width="42" height="69.0" fill="none" stroke="#e2903a" stroke-dasharray="4 3" opacity="0.7"/>
  <text x="218" y="190.5" font-size="11" fill="#e2903a" opacity="0.7" text-anchor="end">before</text>
  <rect x="224" y="129.0" width="42" height="138.0" fill="#e2903a" opacity="0.9"/>
  <text x="294" y="133.0" font-size="11" fill="#e2903a">high</text>
  <text x="294" y="271.0" font-size="11" fill="#e2903a">low</text>
  <text class="lbl" x="330" y="104">The interval sat inside [First_qtr, Third_qtr),</text>
  <text class="lbl" x="330" y="126">so double it about Half instead:</text>
  <text class="lbl" x="330" y="148">[0.30, 0.60] becomes [0.10, 0.70].</text>
  <text class="lbl" x="330" y="170">No bit is emitted; a pending-bit counter</text>
  <text class="lbl" x="330" y="192">records that the next bit emitted is</text>
  <text class="lbl" x="330" y="214">followed by one opposite bit.</text>
  <text class="muted" x="20" y="324">low and high are c-bit integers; the constant Half is the midpoint of the code range, not of the message.</text>
</svg>

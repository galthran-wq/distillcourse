<svg viewBox="0 0 560 240" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .lbl { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .amber { fill: #e2903a; }
    .blue { fill: #4c8dd6; }
    .guide { stroke: currentColor; stroke-dasharray: 3 3; opacity: 0.5; }
    .ax { stroke: currentColor; stroke-opacity: 0.5; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="currentColor"/>
    </marker>
    <marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#e2903a"/>
    </marker>
  </defs>
  <text class="muted" x="110" y="44" text-anchor="middle">input x</text>
  <text class="muted" x="290" y="44" text-anchor="middle">output y</text>
  <circle cx="110" cy="80" r="14" fill="none" stroke="currentColor" stroke-opacity="0.6"/>
  <text class="lbl" x="110" y="84" text-anchor="middle">0</text>
  <circle cx="110" cy="190" r="14" fill="none" stroke="currentColor" stroke-opacity="0.6"/>
  <text class="lbl" x="110" y="194" text-anchor="middle">1</text>
  <circle cx="290" cy="80" r="14" fill="none" stroke="currentColor" stroke-opacity="0.6"/>
  <text class="lbl" x="290" y="84" text-anchor="middle">0</text>
  <circle cx="290" cy="190" r="14" fill="none" stroke="currentColor" stroke-opacity="0.6"/>
  <text class="lbl" x="290" y="194" text-anchor="middle">1</text>
  <circle cx="290" cy="135" r="14" fill="none" stroke="#e2903a" stroke-width="1.6"/>
  <text class="amber" x="290" y="140" text-anchor="middle">?</text>
  <line class="ax" x1="126" y1="80" x2="272" y2="80" marker-end="url(#ah)"/>
  <line class="ax" x1="126" y1="190" x2="272" y2="190" marker-end="url(#ah)"/>
  <text class="muted" x="199" y="72" text-anchor="middle">1 &#8722; e</text>
  <text class="muted" x="199" y="206" text-anchor="middle">1 &#8722; e</text>
  <line x1="124" y1="92" x2="274" y2="128" stroke="#e2903a" stroke-width="1.6" marker-end="url(#aha)"/>
  <line x1="124" y1="178" x2="274" y2="142" stroke="#e2903a" stroke-width="1.6" marker-end="url(#aha)"/>
  <text class="amber" x="180" y="104" text-anchor="middle" font-size="11">e</text>
  <text class="amber" x="180" y="176" text-anchor="middle" font-size="11">e</text>
  <text class="muted" x="350" y="104">no arrow runs 0 &#8594; 1 or 1 &#8594; 0:</text>
  <text class="muted" x="350" y="122">a symbol is never received as</text>
  <text class="muted" x="350" y="140">the other symbol, only as ?</text>
  <text class="lbl" x="350" y="172">the receiver knows which</text>
  <text class="lbl" x="350" y="190">uses failed</text>
</svg>

<svg viewBox="0 0 560 240" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .lbl { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .amber { fill: #e2903a; }
    .blue { fill: #4c8dd6; }
    .guide { stroke: currentColor; stroke-dasharray: 3 3; opacity: 0.5; }
    .ax { stroke: currentColor; stroke-opacity: 0.5; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="currentColor"/>
    </marker>
    <marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#e2903a"/>
    </marker>
  </defs>
  <text class="muted" x="120" y="46" text-anchor="middle">input x</text>
  <text class="muted" x="280" y="46" text-anchor="middle">output y</text>
  <circle cx="120" cy="82" r="14" fill="none" stroke="currentColor" stroke-opacity="0.6"/>
  <text class="lbl" x="120" y="86" text-anchor="middle">0</text>
  <circle cx="120" cy="162" r="14" fill="none" stroke="currentColor" stroke-opacity="0.6"/>
  <text class="lbl" x="120" y="166" text-anchor="middle">1</text>
  <circle cx="280" cy="82" r="14" fill="none" stroke="currentColor" stroke-opacity="0.6"/>
  <text class="lbl" x="280" y="86" text-anchor="middle">0</text>
  <circle cx="280" cy="162" r="14" fill="none" stroke="currentColor" stroke-opacity="0.6"/>
  <text class="lbl" x="280" y="166" text-anchor="middle">1</text>
  <line class="ax" x1="136" y1="82" x2="262" y2="82" marker-end="url(#ah)"/>
  <line class="ax" x1="136" y1="162" x2="262" y2="162" marker-end="url(#ah)"/>
  <text class="muted" x="199" y="74" text-anchor="middle">1 &#8722; p</text>
  <text class="muted" x="199" y="178" text-anchor="middle">1 &#8722; p</text>
  <line x1="133" y1="94" x2="267" y2="150" stroke="#e2903a" stroke-width="1.6" marker-end="url(#aha)"/>
  <line x1="133" y1="150" x2="267" y2="94" stroke="#e2903a" stroke-width="1.6" marker-end="url(#aha)"/>
  <text class="amber" x="154" y="120" font-size="11">p</text>
  <text class="amber" x="154" y="158" font-size="11">p</text>
  <text class="muted" x="382" y="46">p(y | x)</text>
  <text class="muted" x="452" y="70" text-anchor="middle">y = 0</text>
  <text class="muted" x="512" y="70" text-anchor="middle">y = 1</text>
  <line class="ax" x1="382" y1="78" x2="536" y2="78"/>
  <line class="ax" x1="420" y1="56" x2="420" y2="140"/>
  <text class="muted" x="412" y="104" text-anchor="end">x = 0</text>
  <text class="muted" x="412" y="132" text-anchor="end">x = 1</text>
  <text class="lbl" x="452" y="104" text-anchor="middle">1 &#8722; p</text>
  <text class="amber" x="512" y="104" text-anchor="middle">p</text>
  <text class="amber" x="452" y="132" text-anchor="middle">p</text>
  <text class="lbl" x="512" y="132" text-anchor="middle">1 &#8722; p</text>
  <text class="muted" x="382" y="176">each row is a distribution over y</text>
  <text class="muted" x="382" y="194">both have entropy H(p), so</text>
  <text class="lbl" x="382" y="214">H(Y | X) = H(p)</text>
  <text class="muted" x="120" y="214" text-anchor="middle">amber = the flips</text>
</svg>

<svg viewBox="0 0 540 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .lbl { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .amber { fill: #e2903a; }
    .blue { fill: #4c8dd6; }
    .ball { fill: none; stroke: currentColor; stroke-opacity: 0.45; }
  </style>
  <defs>
    <marker id="ra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#e2903a"/>
    </marker>
  </defs>

  <circle class="ball" cx="250" cy="150" r="90"/>

  <line x1="250" y1="150" x2="335" y2="119" stroke="#e2903a" stroke-width="2" marker-end="url(#ra)"/>
  <text class="amber" x="292" y="122" text-anchor="middle" font-size="13">C</text>

  <circle cx="250" cy="150" r="4.5" fill="#e2903a"/>
  <text class="amber" x="252" y="167">p*(y)</text>

  <circle cx="172" cy="105" r="4" fill="#4c8dd6"/>
  <text class="blue" x="164" y="96" text-anchor="end">p(y | x&#8321;)</text>
  <text class="muted" x="164" y="110" text-anchor="end">D = C</text>

  <circle cx="305" cy="222" r="4" fill="#4c8dd6"/>
  <text class="blue" x="314" y="226">p(y | x&#8322;)</text>
  <text class="muted" x="314" y="240">D = C</text>

  <circle cx="205" cy="190" r="3.5" fill="currentColor" opacity="0.55"/>
  <text class="muted" x="232" y="203" text-anchor="middle">unused input</text>
  <text class="muted" x="232" y="216" text-anchor="middle">D &#8804; C</text>

  <text class="muted" x="20" y="32">smallest ball containing every row of the transition table;</text>
  <text class="muted" x="20" y="48">its centre is the output distribution of an optimal input</text>
  <text class="muted" x="20" y="285">distance = divergence D(row &#8214; centre), measured in bits</text>
</svg>

<svg viewBox="0 0 560 255" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .lbl { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .amber { fill: #e2903a; }
    .blue { fill: #4c8dd6; }
    .guide { stroke: currentColor; stroke-dasharray: 3 3; opacity: 0.5; }
    .ax { stroke: currentColor; stroke-opacity: 0.5; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="currentColor"/>
    </marker>
    <marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#e2903a"/>
    </marker>
  </defs>
  <text class="muted" x="100" y="40">1000 equiprobable binary symbols per second, each flipped with probability 0.01</text>
  <rect x="100" y="96" width="367.6" height="36" rx="3" fill="#e2903a" fill-opacity="0.85"/>
  <rect x="467.6" y="96" width="32.4" height="36" rx="3" fill="#4c8dd6" fill-opacity="0.85"/>
  <rect x="100" y="96" width="400" height="36" rx="3" fill="none" stroke="currentColor" stroke-opacity="0.4"/>
  <line class="guide" x1="496.0" y1="70" x2="496.0" y2="96"/>
  <text class="muted" x="490.0" y="66" text-anchor="end">naive accounting: 990 bits/s</text>
  <line class="guide" x1="467.6" y1="132" x2="467.6" y2="156"/>
  <text class="amber" x="461.6" y="170" text-anchor="end" font-weight="600">919 bits/s transmitted</text>
  <text class="blue" x="500" y="190" text-anchor="end">81 bits/s of equivocation H(X | Y)</text>
  <text class="muted" x="90" y="118" text-anchor="end">1000 bits/s in</text>
  <text class="muted" x="100" y="216">the 1% of symbols that are wrong cost 8% of the channel:</text>
  <text class="lbl" x="100" y="236">H(X | Y) = H(0.01) = 0.081 bits per symbol, not 0.01</text>
</svg>

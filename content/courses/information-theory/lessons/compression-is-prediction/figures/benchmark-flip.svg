<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11.5px; }
    .gzip { fill: #4c8dd6; }
    .count { fill: #e2903a; }
    .axis { stroke: currentColor; opacity: 0.45; }
    .guide { stroke: currentColor; opacity: 0.5; stroke-dasharray: 3 3; }
  </style>

  <!-- LEFT PANEL: text file -->
  <g transform="translate(0,0)">
    <text class="label" x="16" y="28" font-weight="600">a 20,942-byte text file</text>
    <text class="muted" x="16" y="46">axis: 0 to 100% of raw size</text>

    <!-- 2.0 px per % ; baseline y = 240 -->
    <line class="axis" x1="120" y1="240" x2="295" y2="240"/>
    <rect class="gzip" x="140" y="162" width="52" height="78" rx="3" opacity="0.9"/>
    <rect class="count" x="225" y="118" width="52" height="122" rx="3" opacity="0.9"/>
    <text class="label" x="166" y="152" text-anchor="middle">39%</text>
    <text class="label" x="251" y="108" text-anchor="middle">61%</text>
    <text class="muted" x="166" y="258" text-anchor="middle">gzip</text>
    <text class="muted" x="251" y="258" text-anchor="middle">count-based</text>
    <text class="muted" x="251" y="272" text-anchor="middle">coder</text>
    <text class="label" x="166" y="290" text-anchor="middle">winner</text>
  </g>

  <line class="axis" x1="320" y1="20" x2="320" y2="280"/>

  <!-- RIGHT PANEL: sparse file -->
  <g transform="translate(320,0)">
    <text class="label" x="16" y="28" font-weight="600">10⁶ characters, 99% zeros</text>
    <text class="muted" x="16" y="46">axis: 0 to 3% of raw size</text>

    <!-- 40 px per % ; baseline y = 240 -->
    <line class="axis" x1="120" y1="240" x2="295" y2="240"/>
    <rect class="gzip" x="140" y="156" width="52" height="84" rx="3" opacity="0.9"/>
    <rect class="count" x="225" y="184" width="52" height="56" rx="3" opacity="0.9"/>
    <text class="label" x="166" y="146" text-anchor="middle">2.1%</text>
    <text class="label" x="251" y="174" text-anchor="middle">1.4%</text>
    <line class="guide" x1="120" y1="200" x2="295" y2="200"/>
    <text class="muted" x="16" y="196">ideal 1.01%</text>
    <text class="muted" x="16" y="211">the entropy</text>
    <text class="muted" x="166" y="258" text-anchor="middle">gzip</text>
    <text class="muted" x="251" y="258" text-anchor="middle">count-based</text>
    <text class="muted" x="251" y="272" text-anchor="middle">coder</text>
    <text class="label" x="251" y="290" text-anchor="middle">winner</text>
  </g>
</svg>

<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11.5px; }
    .claim { fill: #e2903a; }
    .model { fill: #4c8dd6; }
    .axis { stroke: currentColor; opacity: 0.45; }
  </style>
  <defs>
    <pattern id="waste" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="currentColor" stroke-width="1.6" opacity="0.45"/>
    </pattern>
  </defs>

  <!-- budget frame -->
  <text class="muted" x="150" y="30">a budget of one, claimed at 1/2 per bit of codeword length</text>
  <line class="axis" x1="150" y1="42" x2="590" y2="42"/>
  <line class="axis" x1="150" y1="38" x2="150" y2="46"/>
  <line class="axis" x1="590" y1="38" x2="590" y2="46"/>
  <text class="muted" x="150" y="58" text-anchor="middle">0</text>
  <text class="muted" x="590" y="58" text-anchor="middle">1</text>

  <!-- row 1: what the code claims -->
  <text class="label" x="12" y="88" font-weight="600">code lengths</text>
  <text class="muted" x="12" y="104">1, 3, 3, 3 bits</text>

  <rect class="claim" x="150" y="70" width="220" height="34" rx="3" opacity="0.9"/>
  <rect class="claim" x="370" y="70" width="55" height="34" rx="3" opacity="0.9"/>
  <rect class="claim" x="425" y="70" width="55" height="34" rx="3" opacity="0.9"/>
  <rect class="claim" x="480" y="70" width="55" height="34" rx="3" opacity="0.9"/>
  <rect x="535" y="70" width="55" height="34" rx="3" fill="url(#waste)"/>
  <rect x="535" y="70" width="55" height="34" rx="3" fill="none" stroke="currentColor" stroke-width="1" opacity="0.5"/>

  <text class="label" x="260" y="92" text-anchor="middle">A: 1/2</text>
  <text class="muted" x="397" y="122" text-anchor="middle">B</text>
  <text class="muted" x="452" y="122" text-anchor="middle">C</text>
  <text class="muted" x="507" y="122" text-anchor="middle">D</text>
  <text class="muted" x="452" y="138" text-anchor="middle">1/8 each</text>
  <text class="muted" x="562" y="122" text-anchor="middle">unclaimed</text>
  <text class="muted" x="562" y="138" text-anchor="middle">1/8</text>

  <!-- row 2: the implied model -->
  <text class="label" x="12" y="196" font-weight="600">implied model</text>
  <text class="muted" x="12" y="212">after normalizing</text>

  <rect class="model" x="150" y="178" width="251" height="34" rx="3" opacity="0.9"/>
  <rect class="model" x="401" y="178" width="63" height="34" rx="3" opacity="0.9"/>
  <rect class="model" x="464" y="178" width="63" height="34" rx="3" opacity="0.9"/>
  <rect class="model" x="527" y="178" width="63" height="34" rx="3" opacity="0.9"/>
  <text class="label" x="275" y="200" text-anchor="middle">A: 4/7</text>
  <text class="muted" x="432" y="230" text-anchor="middle">B</text>
  <text class="muted" x="495" y="230" text-anchor="middle">C</text>
  <text class="muted" x="558" y="230" text-anchor="middle">D</text>
  <text class="muted" x="495" y="246" text-anchor="middle">1/7 each</text>

  <!-- payoff -->
  <text class="label" x="320" y="282" text-anchor="middle">the unclaimed eighth is not saved: it costs 0.193 bits on every file</text>
</svg>

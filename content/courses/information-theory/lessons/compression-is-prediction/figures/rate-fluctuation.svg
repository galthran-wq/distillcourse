<svg viewBox="0 0 480 210" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="52" y="18" font-size="11" fill="currentColor">measured bits per character</text>

  <!-- plot frame -->
  <line x1="52" y1="28" x2="52" y2="170" stroke="currentColor"/>
  <line x1="52" y1="170" x2="466" y2="170" stroke="currentColor"/>

  <!-- y ticks: 0, 0.1, 0.2, 0.3 bits/char -->
  <g font-size="10" fill="currentColor">
    <line x1="48" y1="170" x2="52" y2="170" stroke="currentColor"/>
    <text x="45" y="173" text-anchor="end">0</text>
    <line x1="48" y1="123.3" x2="52" y2="123.3" stroke="currentColor"/>
    <text x="45" y="126.3" text-anchor="end">0.1</text>
    <line x1="48" y1="76.7" x2="52" y2="76.7" stroke="currentColor"/>
    <text x="45" y="79.7" text-anchor="end">0.2</text>
    <line x1="48" y1="30" x2="52" y2="30" stroke="currentColor"/>
    <text x="45" y="33" text-anchor="end">0.3</text>
  </g>

  <!-- x ticks: n = 10 ... 10^6, log spaced -->
  <g font-size="10" fill="currentColor" text-anchor="middle">
    <line x1="66" y1="170" x2="66" y2="174" stroke="currentColor"/>
    <text x="66" y="186">10</text>
    <line x1="144" y1="170" x2="144" y2="174" stroke="currentColor"/>
    <text x="144" y="186">100</text>
    <line x1="222" y1="170" x2="222" y2="174" stroke="currentColor"/>
    <text x="222" y="186">1k</text>
    <line x1="300" y1="170" x2="300" y2="174" stroke="currentColor"/>
    <text x="300" y="186">10k</text>
    <line x1="378" y1="170" x2="378" y2="174" stroke="currentColor"/>
    <text x="378" y="186">100k</text>
    <line x1="456" y1="170" x2="456" y2="174" stroke="currentColor"/>
    <text x="456" y="186">1M</text>
  </g>
  <text x="259" y="203" font-size="11" fill="currentColor" text-anchor="middle">stream length n, characters (log scale)</text>

  <!-- +/- 1 s.d. band of the measured rate, sd = 0.660 / sqrt(n) -->
  <path d="M66,34.9 L144,101.5 L222,122.6 L300,129.2 L378,131.3 L456,132.0
           L456,132.6 L378,133.3 L300,135.4 L222,142.0 L144,163.1 L66,170 Z"
        fill="#e2903a" fill-opacity="0.18" stroke="#e2903a" stroke-width="1"/>
  <text x="196" y="88" font-size="11" fill="#e2903a">±1 s.d. of the measured rate</text>
  <line x1="272" y1="92" x2="272" y2="126" stroke="#e2903a" stroke-width="1" opacity="0.7"/>

  <!-- the cross-entropy the rate converges on -->
  <line x1="52" y1="132.3" x2="466" y2="132.3" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5"/>
  <line x1="400" y1="150" x2="400" y2="134" stroke="currentColor" opacity="0.5"/>
  <text x="466" y="161" font-size="11" fill="currentColor" text-anchor="end">cross-entropy 0.0808 bits/char</text>

  <!-- two ten-character streams from the same source -->
  <line x1="76" y1="62" x2="76" y2="34" stroke="#4c8dd6" stroke-width="1.2"/>
  <path d="M76,30 L72.5,38 L79.5,38 Z" fill="#4c8dd6"/>
  <text x="84" y="52" font-size="11" fill="#4c8dd6">ten characters with two 1s: 1.34 bits/char, off the top</text>
  <circle cx="66" cy="163.2" r="3" fill="#4c8dd6"/>
  <text x="74" y="160" font-size="11" fill="#4c8dd6">ten 0s: 0.015</text>
</svg>

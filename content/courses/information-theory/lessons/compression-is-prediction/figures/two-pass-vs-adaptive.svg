<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11.5px; }
    .total { fill: currentColor; font-size: 12px; }
    .data { fill: #e2903a; }
    .header { fill: #4c8dd6; }
    .guide { stroke: currentColor; opacity: 0.5; stroke-dasharray: 3 3; }
  </style>

  <text class="muted" x="12" y="24">one 200-character English message, three schemes, drawn to scale</text>

  <!-- row 1: fixed code, no model -->
  <text class="label" x="12" y="66" font-weight="600">fixed code</text>
  <rect class="data" x="150" y="50" width="323" height="28" rx="3" opacity="0.5"/>
  <text class="total" x="481" y="69">952 bits</text>
  <text class="muted" x="150" y="94">4.76 bits/char, no model sent and none assumed</text>

  <!-- row 2: two-pass -->
  <text class="label" x="12" y="140" font-weight="600">two-pass</text>
  <rect class="header" x="150" y="124" width="147" height="28" rx="3" opacity="0.9"/>
  <rect class="data" x="297" y="124" width="273" height="28" rx="3" opacity="0.9"/>
  <text class="total" x="578" y="143">1,238</text>
  <text class="muted" x="150" y="168">header: 27 counts at 16 bits = 432</text>
  <text class="muted" x="360" y="168">data at 4.03 bits/char = 806</text>

  <!-- row 3: adaptive -->
  <text class="label" x="12" y="216" font-weight="600">adaptive</text>
  <rect class="data" x="150" y="200" width="273" height="28" rx="3" opacity="0.9"/>
  <rect x="423" y="200" width="34" height="28" rx="3" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <text class="total" x="486" y="219">≈ 906</text>
  <text class="muted" x="150" y="244">no header; same 806 data bits plus a regret of about 100</text>

  <!-- comparison guide at 952 bits -->
  <line class="guide" x1="473" y1="44" x2="473" y2="256"/>
  <text class="muted" x="473" y="272" text-anchor="middle">952 bits: the price of sending no model at all</text>

  <text class="label" x="320" y="294" text-anchor="middle">the two-pass scheme does not break even until 592 characters</text>
</svg>

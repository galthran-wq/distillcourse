<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <style>
    .lbl   { fill: currentColor; font-size: 12px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .axis  { stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.2; fill: none; }
    .curve { stroke: #e2903a; stroke-width: 2.5; fill: none; }
    .guide { stroke: currentColor; stroke-opacity: 0.4; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
    .dot   { fill: #e2903a; }
  </style>

  <!-- axes -->
  <path class="axis" d="M70 270 L595 270"/>
  <path class="axis" d="M70 270 L70 34"/>
  <text class="muted" x="330" y="308" text-anchor="middle">q(true) &#8212; the probability the model put on the label that occurred (log scale)</text>
  <text class="muted" x="42" y="30">bits</text>

  <!-- x ticks: decades from 1e-6 to 1 -->
  <g class="axis">
    <path d="M70 270 L70 275"/>
    <path d="M155 270 L155 275"/>
    <path d="M240 270 L240 275"/>
    <path d="M325 270 L325 275"/>
    <path d="M410 270 L410 275"/>
    <path d="M495 270 L495 275"/>
    <path d="M580 270 L580 275"/>
  </g>
  <g class="muted" text-anchor="middle">
    <text x="70"  y="289">10&#8315;&#8310;</text>
    <text x="155" y="289">10&#8315;&#8309;</text>
    <text x="240" y="289">10&#8315;&#8308;</text>
    <text x="325" y="289">0.001</text>
    <text x="410" y="289">0.01</text>
    <text x="495" y="289">0.1</text>
    <text x="580" y="289">1</text>
  </g>

  <!-- y ticks -->
  <g class="axis">
    <path d="M65 270 L70 270"/>
    <path d="M65 212.5 L70 212.5"/>
    <path d="M65 155 L70 155"/>
    <path d="M65 97.5 L70 97.5"/>
    <path d="M65 40 L70 40"/>
  </g>
  <g class="muted" text-anchor="end">
    <text x="58" y="274">0</text>
    <text x="58" y="216">5</text>
    <text x="58" y="159">10</text>
    <text x="58" y="101">15</text>
    <text x="58" y="44">20</text>
  </g>

  <!-- the loss: a straight line on a log axis -->
  <path class="curve" d="M70 40.8 L580 270"/>
  <text x="95" y="200" fill="#e2903a" font-size="12" font-weight="600">loss = &#8722;log&#8322; q(true)</text>
  <text class="muted" x="95" y="220">no ceiling: q(true) = 0 costs &#8734;</text>

  <!-- marked model outputs -->
  <path class="guide" d="M554 270 L554 258.5 L490 258.5"/>
  <circle class="dot" cx="554" cy="258.5" r="4"/>
  <text class="lbl" x="500" y="250" text-anchor="end">0.5 &#8594; 1 bit</text>

  <path class="guide" d="M410 270 L410 193.6 L340 193.6"/>
  <circle class="dot" cx="410" cy="193.6" r="4"/>
  <text class="lbl" x="422" y="190">0.01 &#8594; 6.6 bits</text>

  <path class="guide" d="M70 40.8 L70 40.8"/>
  <circle class="dot" cx="70" cy="40.8" r="4"/>
  <text class="lbl" x="84" y="44">10&#8315;&#8310; &#8594; 19.9 bits</text>

  <!-- slope annotation -->
  <path class="axis" d="M155 248 L240 248"/>
  <path d="M155 248 L163 244 L163 252 Z" fill="currentColor" opacity="0.5"/>
  <path d="M240 248 L232 244 L232 252 Z" fill="currentColor" opacity="0.5"/>
  <text class="muted" x="197" y="242" text-anchor="middle">one decade = 3.32 bits, everywhere</text>

  <text class="lbl" x="595" y="120" text-anchor="end">confident and right: loss &#8594; 0</text>
</svg>

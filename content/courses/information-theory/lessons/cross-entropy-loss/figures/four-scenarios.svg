<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <style>
    .lbl   { fill: currentColor; font-size: 12px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .tot   { fill: currentColor; font-size: 12px; font-weight: 600; }
    .match { fill: #4c8dd6; }
    .miss  { fill: #e2903a; }
    .inner { fill: #ffffff; font-size: 9px; }
  </style>

  <!-- column headers: whose words are being sent -->
  <text class="lbl" x="150" y="24">Bob's words</text>
  <text class="muted" x="150" y="40">p = (1/2, 1/4, 1/8, 1/8)</text>
  <text class="lbl" x="410" y="24">Alice's words</text>
  <text class="muted" x="410" y="40">q = (1/8, 1/2, 1/4, 1/8)</text>

  <!-- row headers: whose code is in use -->
  <text class="lbl" x="8" y="118">Bob's code</text>
  <text class="muted" x="8" y="134">lengths 1, 2, 3, 3</text>
  <text class="lbl" x="8" y="278">Alice's code</text>
  <text class="muted" x="8" y="294">lengths 3, 1, 2, 3</text>

  <!-- ============ row 1: Bob's code ============ -->
  <!-- (1,1) Bob's code on Bob's words: 1.75 bits -->
  <g>
    <rect class="match" x="150" y="70"    width="30" height="49"   rx="2"/>
    <rect class="match" x="150" y="120.5" width="60" height="24"   rx="2"/>
    <rect class="match" x="150" y="146"   width="90" height="11.5" rx="2"/>
    <rect class="match" x="150" y="158.5" width="90" height="11.5" rx="2"/>
    <text class="inner" x="156" y="99">dog</text>
    <text class="inner" x="156" y="137">cat</text>
    <text class="inner" x="156" y="155">fish</text>
    <text class="inner" x="156" y="167">bird</text>
    <text class="tot" x="150" y="190">H(p) = 1.75 bits</text>
    <text class="muted" x="150" y="206">matched: the entropy</text>
  </g>

  <!-- (1,2) Bob's code on Alice's words: 2.25 bits -->
  <g>
    <rect class="miss" x="410" y="70"    width="30" height="11.5" rx="2"/>
    <rect class="miss" x="410" y="83"    width="60" height="49"   rx="2"/>
    <rect class="miss" x="410" y="133.5" width="90" height="24"   rx="2"/>
    <rect class="miss" x="410" y="158.5" width="90" height="11.5" rx="2"/>
    <text class="inner" x="416" y="79">dog</text>
    <text class="inner" x="416" y="112">cat</text>
    <text class="inner" x="416" y="150">fish</text>
    <text class="inner" x="416" y="167">bird</text>
    <text class="tot" x="410" y="190">H(q, p) = 2.25 bits</text>
    <text class="muted" x="410" y="206">+0.50 over her entropy</text>
  </g>

  <!-- ============ row 2: Alice's code ============ -->
  <!-- (2,1) Alice's code on Bob's words: 2.375 bits -->
  <g>
    <rect class="miss" x="150" y="230"   width="90" height="49"   rx="2"/>
    <rect class="miss" x="150" y="280.5" width="30" height="24"   rx="2"/>
    <rect class="miss" x="150" y="306"   width="60" height="11.5" rx="2"/>
    <rect class="miss" x="150" y="318.5" width="90" height="11.5" rx="2"/>
    <text class="inner" x="156" y="259">dog</text>
    <text class="inner" x="156" y="297">cat</text>
    <text class="inner" x="156" y="315">fish</text>
    <text class="inner" x="156" y="327">bird</text>
    <text class="tot" x="150" y="350">H(p, q) = 2.375 bits</text>
    <text class="muted" x="150" y="366">+0.625 over his entropy</text>
  </g>

  <!-- (2,2) Alice's code on Alice's words: 1.75 bits -->
  <g>
    <rect class="match" x="410" y="230"   width="90" height="11.5" rx="2"/>
    <rect class="match" x="410" y="243"   width="30" height="49"   rx="2"/>
    <rect class="match" x="410" y="293.5" width="60" height="24"   rx="2"/>
    <rect class="match" x="410" y="318.5" width="90" height="11.5" rx="2"/>
    <text class="inner" x="416" y="239">dog</text>
    <text class="inner" x="416" y="272">cat</text>
    <text class="inner" x="416" y="310">fish</text>
    <text class="inner" x="416" y="327">bird</text>
    <text class="tot" x="410" y="350">H(q) = 1.75 bits</text>
    <text class="muted" x="410" y="366">matched: the entropy</text>
  </g>

  <!-- reading key -->
  <text class="muted" x="8" y="396">bar height = how often the word is said (the data); bar width = its codeword length (the model);</text>
  <text class="muted" x="8" y="412">shaded area = expected bits per word. Both entropies are 1.75, but the two mismatches are not equal.</text>
</svg>

<svg viewBox="0 0 640 310" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <style>
    .lbl   { fill: currentColor; font-size: 12px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .axis  { stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.2; fill: none; }
    .true  { fill: #e2903a; }
    .other { fill: #4c8dd6; opacity: 0.6; }
    .amber { fill: #e2903a; font-size: 12px; }
    .guide { stroke: #e2903a; stroke-width: 1.2; stroke-dasharray: 3 3; fill: none; }
  </style>

  <text class="lbl" x="30" y="24">two predictions that agree on the true class and disagree on the rest</text>

  <!-- panel A -->
  <text class="lbl" x="40" y="52">prediction A</text>
  <path class="axis" d="M40 200 L300 200"/>
  <rect class="true"  x="60"  y="109"   width="46" height="91"/>
  <rect class="other" x="130" y="174"   width="46" height="26"/>
  <rect class="other" x="200" y="187"   width="46" height="13"/>
  <text class="amber" x="83"  y="101" text-anchor="middle">0.70</text>
  <text class="lbl"   x="153" y="166" text-anchor="middle">0.20</text>
  <text class="lbl"   x="223" y="179" text-anchor="middle">0.10</text>
  <text class="muted" x="83"  y="216" text-anchor="middle">cat</text>
  <text class="muted" x="153" y="216" text-anchor="middle">dog</text>
  <text class="muted" x="223" y="216" text-anchor="middle">fox</text>
  <text class="amber" x="83"  y="232" text-anchor="middle" font-size="11">true label</text>

  <text class="amber" x="40" y="258">log score &#8722;log&#8322; 0.70 = 0.515 bits</text>
  <text class="lbl"   x="40" y="278" fill="#4c8dd6">Brier 0.30&#178; + 0.20&#178; + 0.10&#178; = 0.140</text>

  <!-- panel B -->
  <text class="lbl" x="360" y="52">prediction B</text>
  <path class="axis" d="M360 200 L620 200"/>
  <rect class="true"  x="380" y="109"   width="46" height="91"/>
  <rect class="other" x="450" y="193.5" width="46" height="6.5"/>
  <rect class="other" x="520" y="167.5" width="46" height="32.5"/>
  <text class="amber" x="403" y="101" text-anchor="middle">0.70</text>
  <text class="lbl"   x="473" y="186" text-anchor="middle">0.05</text>
  <text class="lbl"   x="543" y="160" text-anchor="middle">0.25</text>
  <text class="muted" x="403" y="216" text-anchor="middle">cat</text>
  <text class="muted" x="473" y="216" text-anchor="middle">dog</text>
  <text class="muted" x="543" y="216" text-anchor="middle">fox</text>
  <text class="amber" x="403" y="232" text-anchor="middle" font-size="11">true label</text>

  <text class="amber" x="360" y="258">log score &#8722;log&#8322; 0.70 = 0.515 bits</text>
  <text class="lbl"   x="360" y="278" fill="#4c8dd6">Brier 0.30&#178; + 0.05&#178; + 0.25&#178; = 0.155</text>

  <!-- the identical amber bars, tied together -->
  <path class="guide" d="M106 128 L380 128"/>
  <text class="amber" x="243" y="122" text-anchor="middle" font-size="11">same bar</text>

  <text class="muted" x="320" y="302" text-anchor="middle">the log score bills only the amber bar; the Brier score also charges for how the losing mass was arranged</text>
</svg>

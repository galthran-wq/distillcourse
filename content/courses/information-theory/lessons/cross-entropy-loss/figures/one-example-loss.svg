<svg viewBox="0 0 680 280" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <style>
    .lbl   { fill: currentColor; font-size: 12px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .axis  { stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.2; fill: none; }
    .other { fill: #4c8dd6; opacity: 0.45; }
    .true  { fill: #4c8dd6; }
    .loss  { fill: #e2903a; }
    .guide { stroke: #e2903a; stroke-width: 1.2; stroke-dasharray: 3 3; fill: none; }
  </style>

  <!-- left: the model's output distribution -->
  <text class="lbl" x="30" y="26">the model's output q</text>
  <path class="axis" d="M40 210 L300 210"/>

  <rect class="other" x="60"  y="90"  width="54" height="120"/>
  <rect class="true"  x="150" y="176" width="54" height="34"/>
  <rect class="other" x="240" y="193" width="54" height="17"/>

  <text class="lbl"   x="87"  y="82"  text-anchor="middle">0.70</text>
  <text class="lbl"   x="177" y="168" text-anchor="middle">0.20</text>
  <text class="lbl"   x="267" y="185" text-anchor="middle">0.10</text>
  <text class="muted" x="87"  y="226" text-anchor="middle">cat</text>
  <text class="lbl"   x="177" y="226" text-anchor="middle" font-weight="600">dog</text>
  <text class="muted" x="267" y="226" text-anchor="middle">fox</text>
  <text class="muted" x="177" y="242" text-anchor="middle">true label</text>
  <text class="muted" x="30"  y="266">the other two bars are never billed</text>

  <!-- transfer arrow: up out of the true bar, then across -->
  <path class="guide" d="M177 164 L177 126 L370 126"/>
  <path d="M370 126 L360 122 L360 130 Z" fill="#e2903a"/>
  <text x="196" y="116" font-size="11" fill="#e2903a">take &#8722;log&#8322; of this one number</text>

  <!-- right: the loss as a height -->
  <text class="lbl" x="410" y="26">the bill for this example</text>
  <path class="axis" d="M410 210 L410 40"/>
  <g class="axis">
    <path d="M405 210 L410 210"/>
    <path d="M405 168 L410 168"/>
    <path d="M405 126 L410 126"/>
    <path d="M405 84  L410 84"/>
  </g>
  <g class="muted" text-anchor="end">
    <text x="400" y="214">0</text>
    <text x="400" y="172">1</text>
    <text x="400" y="130">2</text>
    <text x="400" y="88">3</text>
  </g>
  <text class="muted" x="382" y="34">bits</text>

  <rect class="loss" x="430" y="112.5" width="60" height="97.5" rx="2"/>
  <text x="460" y="104" text-anchor="middle" font-size="12" fill="#e2903a" font-weight="600">2.32 bits</text>
  <text class="lbl"   x="506" y="150">&#8722;log&#8322; 0.20 = 2.32</text>
  <text class="muted" x="506" y="166">the model's own</text>
  <text class="muted" x="506" y="180">surprisal at the truth</text>
  <text class="muted" x="410" y="266">if cat: 0.51 bits; if fox: 3.32 bits</text>
</svg>

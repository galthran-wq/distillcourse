<svg viewBox="0 0 620 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <style>
    .lbl   { fill: currentColor; font-size: 12px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .axis  { stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.2; fill: none; }
    .floor { fill: #4c8dd6; }
    .gap   { fill: #e2903a; }
    .inner { fill: #ffffff; font-size: 11px; }
  </style>

  <text class="lbl" x="30" y="26">one unchanged prediction q = (0.70, 0.20, 0.10), true class = 1, scored two ways</text>

  <!-- bar 1: hard label -->
  <text class="lbl" x="30" y="72">hard label   p = (1, 0, 0)</text>
  <rect class="gap" x="60" y="82" width="322" height="34" rx="3"/>
  <text class="inner" x="72" y="104">D(p&#8214;q) = 0.515</text>
  <text class="lbl" x="560" y="72" text-anchor="end">0.515 bits reported</text>
  <text class="muted" x="60" y="134">no floor: H(p) = 0, so the whole bill is the model's own mismatch</text>

  <!-- bar 2: smoothed label -->
  <text class="lbl" x="30" y="180">smoothed label   p = (0.90, 0.05, 0.05)</text>
  <rect class="floor" x="60" y="190" width="356" height="34" rx="3"/>
  <rect class="gap"   x="416" y="190" width="110" height="34" rx="3"/>
  <text class="inner" x="72" y="212">H(p) = 0.569</text>
  <text class="inner" x="424" y="212">0.176</text>
  <text class="lbl" x="560" y="180" text-anchor="end">0.745 bits reported</text>
  <text class="muted" x="60" y="242">floor first: only 0.176 bits of the bill belong to the model</text>

  <!-- shared axis -->
  <path class="axis" d="M60 258 L560 258"/>
  <g class="axis">
    <path d="M60 258 L60 263"/>
    <path d="M185 258 L185 263"/>
    <path d="M310 258 L310 263"/>
    <path d="M435 258 L435 263"/>
    <path d="M560 258 L560 263"/>
  </g>
  <g class="muted" text-anchor="middle">
    <text x="60"  y="276">0</text>
    <text x="185" y="276">0.2</text>
    <text x="310" y="276">0.4</text>
    <text x="435" y="276">0.6</text>
    <text x="560" y="276">0.8</text>
  </g>
  <text class="muted" x="310" y="294" text-anchor="middle">bits per example &#8212; smoothing raises the reported loss by 45% and lowers the model's excess by 66%</text>
</svg>

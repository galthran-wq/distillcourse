<svg viewBox="0 0 620 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <style>
    .lbl   { fill: currentColor; font-size: 12px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .axis  { stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.2; fill: none; }
    .truth { fill: #4c8dd6; }
    .model { fill: none; stroke: #e2903a; stroke-width: 2; }
    .floor { fill: #4c8dd6; }
  </style>

  <text class="lbl" x="20" y="24" font-weight="600">converged: q = p</text>

  <!-- left: distributions -->
  <text class="muted" x="20" y="46">truth p (blue, fixed)   model q (amber outline)</text>
  <path class="axis" d="M30 200 L330 200"/>
  <!-- A: p .5, q .5 -->
  <rect class="truth" x="40"  y="100" width="26" height="100"/>
  <rect class="model" x="70"  y="100" width="26" height="100"/>
  <!-- B: p .25, q .25 -->
  <rect class="truth" x="120" y="150" width="26" height="50"/>
  <rect class="model" x="150" y="150" width="26" height="50"/>
  <!-- C: p .15, q .15 -->
  <rect class="truth" x="200" y="170" width="26" height="30"/>
  <rect class="model" x="230" y="170" width="26" height="30"/>
  <!-- D: p .1, q .1 -->
  <rect class="truth" x="280" y="180" width="26" height="20"/>
  <rect class="model" x="310" y="180" width="26" height="20"/>
  <g class="muted" text-anchor="middle">
    <text x="68"  y="216">A</text>
    <text x="148" y="216">B</text>
    <text x="228" y="216">C</text>
    <text x="308" y="216">D</text>
  </g>
  <text class="muted" x="30" y="240">p = (.50, .25, .15, .10)</text>
  <text class="muted" x="30" y="256">q = (.50, .25, .15, .10)</text>

  <!-- right: the cost bar -->
  <text class="lbl" x="420" y="30" text-anchor="middle">H(p, q) = 1.743 bits</text>
  <path class="axis" d="M395 200 L395 60"/>
  <g class="axis">
    <path d="M390 200 L395 200"/>
    <path d="M390 133.3 L395 133.3"/>
    <path d="M390 66.7 L395 66.7"/>
  </g>
  <g class="muted" text-anchor="end">
    <text x="386" y="204">0</text>
    <text x="386" y="137">1</text>
    <text x="386" y="71">2</text>
  </g>
  <text class="muted" x="368" y="54">bits</text>

  <rect class="floor" x="410" y="83.7" width="70" height="116.3"/>
  <text x="492" y="80" font-size="12" fill="#e2903a">D(p&#8214;q) = 0</text>
  <text class="lbl" x="492" y="146">H(p) = 1.743</text>
  <text class="muted" x="492" y="162">the loss is now the entropy</text>
</svg>

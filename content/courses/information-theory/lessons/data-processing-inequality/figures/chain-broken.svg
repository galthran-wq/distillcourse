<svg viewBox="0 0 480 195" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <marker id="cb-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/>
    </marker>
    <marker id="cb-arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e2903a"/>
    </marker>
  </defs>

  <!-- the leaking path, drawn first so the nodes sit on top -->
  <path d="M 72 70 Q 232 8 392 70" fill="none" stroke="#e2903a" stroke-width="1.6"
        marker-end="url(#cb-arrow-amber)"/>
  <text x="232" y="26" text-anchor="middle" font-size="12" fill="#e2903a">the encoder read the realised label</text>

  <!-- nodes -->
  <rect x="40" y="70" width="64" height="32" rx="5" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="72" y="91" text-anchor="middle" font-size="14" fill="currentColor">Y</text>
  <text x="72" y="118" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">target</text>

  <rect x="200" y="70" width="64" height="32" rx="5" fill="none" stroke="#e2903a" stroke-width="1.4"/>
  <text x="232" y="91" text-anchor="middle" font-size="14" fill="#e2903a">X</text>
  <text x="232" y="118" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">data</text>

  <rect x="360" y="70" width="64" height="32" rx="5" fill="none" stroke="#4c8dd6" stroke-width="1.4"/>
  <text x="392" y="91" text-anchor="middle" font-size="14" fill="#4c8dd6">T</text>
  <text x="392" y="118" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">feature</text>

  <!-- chain arrows -->
  <line x1="106" y1="86" x2="196" y2="86" stroke="currentColor" stroke-width="1.2" marker-end="url(#cb-arrow)"/>
  <line x1="266" y1="86" x2="356" y2="86" stroke="currentColor" stroke-width="1.2" marker-end="url(#cb-arrow)"/>

  <!-- verdict -->
  <text x="240" y="152" text-anchor="middle" font-size="13" fill="currentColor">p(t | x, y) ≠ p(t | x)</text>
  <text x="240" y="176" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.55">no Markov chain, no bound: here I(T;Y) = 1 bit and I(X;Y) = 0</text>
</svg>

<svg viewBox="0 0 560 252" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <marker id="rc-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- chain of stages -->
  <rect x="25" y="18" width="70" height="30" rx="5" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="60" y="38" text-anchor="middle" font-size="13" fill="currentColor">Y</text>

  <rect x="135" y="18" width="70" height="30" rx="5" fill="none" stroke="#e2903a" stroke-width="1.4"/>
  <text x="170" y="38" text-anchor="middle" font-size="13" fill="#e2903a">X</text>

  <rect x="245" y="18" width="70" height="30" rx="5" fill="none" stroke="#4c8dd6" stroke-width="1.4"/>
  <text x="280" y="38" text-anchor="middle" font-size="13" fill="#4c8dd6">T₁</text>

  <rect x="355" y="18" width="70" height="30" rx="5" fill="none" stroke="#4c8dd6" stroke-width="1.4"/>
  <text x="390" y="38" text-anchor="middle" font-size="13" fill="#4c8dd6">T₂</text>

  <rect x="465" y="18" width="70" height="30" rx="5" fill="none" stroke="#4c8dd6" stroke-width="1.4"/>
  <text x="500" y="38" text-anchor="middle" font-size="13" fill="#4c8dd6">T₃</text>

  <line x1="95" y1="33" x2="131" y2="33" stroke="currentColor" stroke-width="1.2" marker-end="url(#rc-arrow)"/>
  <line x1="205" y1="33" x2="241" y2="33" stroke="currentColor" stroke-width="1.2" marker-end="url(#rc-arrow)"/>
  <line x1="315" y1="33" x2="351" y2="33" stroke="currentColor" stroke-width="1.2" marker-end="url(#rc-arrow)"/>
  <line x1="425" y1="33" x2="461" y2="33" stroke="currentColor" stroke-width="1.2" marker-end="url(#rc-arrow)"/>
  <text x="280" y="66" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">every arrow is one independent 10% bit flip</text>

  <!-- ceiling -->
  <line x1="120" y1="98" x2="545" y2="98" stroke="currentColor" stroke-width="1" stroke-dasharray="3 3" opacity="0.5"/>
  <text x="545" y="92" text-anchor="end" font-size="11" fill="currentColor" opacity="0.55">ceiling: what X knows about Y</text>

  <!-- bars: 226 px per bit, baseline y = 218 -->
  <rect x="153" y="98" width="34" height="120" rx="3" fill="#e2903a" opacity="0.85"/>
  <text x="170" y="92" text-anchor="middle" font-size="12" fill="#e2903a">0.531</text>

  <rect x="263" y="146" width="34" height="72" rx="3" fill="#4c8dd6" opacity="0.85"/>
  <text x="280" y="140" text-anchor="middle" font-size="12" fill="#4c8dd6">0.320</text>

  <rect x="373" y="173" width="34" height="45" rx="3" fill="#4c8dd6" opacity="0.85"/>
  <text x="390" y="167" text-anchor="middle" font-size="12" fill="#4c8dd6">0.198</text>

  <rect x="483" y="190" width="34" height="28" rx="3" fill="#4c8dd6" opacity="0.85"/>
  <text x="500" y="184" text-anchor="middle" font-size="12" fill="#4c8dd6">0.125</text>

  <line x1="120" y1="218" x2="545" y2="218" stroke="currentColor" stroke-width="1"/>
  <text x="20" y="150" font-size="11" fill="currentColor" opacity="0.55">bits</text>
  <text x="20" y="164" font-size="11" fill="currentColor" opacity="0.55">about Y</text>
  <text x="332" y="240" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">no stage can be taller than the stage on its left</text>
</svg>

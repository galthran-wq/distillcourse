<svg viewBox="0 0 560 236" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <marker id="sc-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- the three tosses -->
  <rect x="40" y="16" width="30" height="30" rx="4" fill="none" stroke="#4c8dd6" stroke-width="1.3"/>
  <text x="55" y="37" text-anchor="middle" font-size="14" fill="#4c8dd6">1</text>
  <rect x="76" y="16" width="30" height="30" rx="4" fill="none" stroke="#4c8dd6" stroke-width="1.3"/>
  <text x="91" y="37" text-anchor="middle" font-size="14" fill="#4c8dd6">0</text>
  <rect x="112" y="16" width="30" height="30" rx="4" fill="none" stroke="#4c8dd6" stroke-width="1.3"/>
  <text x="127" y="37" text-anchor="middle" font-size="14" fill="#4c8dd6">1</text>
  <text x="91" y="62" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">8 possible sequences</text>

  <line x1="160" y1="31" x2="252" y2="31" stroke="currentColor" stroke-width="1.2" marker-end="url(#sc-arrow)"/>
  <text x="206" y="22" text-anchor="middle" font-size="11" fill="currentColor">count the heads</text>

  <rect x="266" y="16" width="46" height="30" rx="4" fill="none" stroke="#4c8dd6" stroke-width="1.3"/>
  <text x="289" y="37" text-anchor="middle" font-size="14" fill="#4c8dd6">2</text>
  <text x="289" y="62" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">4 possible values</text>

  <!-- bars: 100 px per bit, left edge x = 150 -->
  <text x="16" y="106" font-size="11" fill="currentColor" opacity="0.55">about the data</text>
  <rect x="150" y="94" width="288" height="16" rx="3" fill="#4c8dd6" opacity="0.85"/>
  <text x="446" y="107" font-size="12" fill="currentColor">H = 2.880 bits</text>
  <rect x="150" y="116" width="199" height="16" rx="3" fill="#4c8dd6" opacity="0.5"/>
  <text x="357" y="129" font-size="12" fill="currentColor">H = 1.989 bits</text>
  <text x="150" y="147" font-size="11" fill="currentColor" opacity="0.55">0.891 bits of the sequence thrown away</text>

  <text x="16" y="180" font-size="11" fill="currentColor" opacity="0.55">about θ</text>
  <rect x="150" y="168" width="45" height="16" rx="3" fill="#e2903a" opacity="0.85"/>
  <text x="203" y="181" font-size="12" fill="currentColor">I(θ ; sequence) = 0.446 bits</text>
  <rect x="150" y="190" width="45" height="16" rx="3" fill="#e2903a" opacity="0.85"/>
  <text x="203" y="203" font-size="12" fill="currentColor">I(θ ; count) = 0.446 bits</text>
  <line x1="197" y1="164" x2="197" y2="210" stroke="#5aa46a" stroke-width="1.4" stroke-dasharray="3 3"/>
  <text x="150" y="224" font-size="11" fill="#5aa46a">nothing about θ lost</text>

  <line x1="150" y1="86" x2="150" y2="212" stroke="currentColor" stroke-width="1" opacity="0.35"/>
</svg>

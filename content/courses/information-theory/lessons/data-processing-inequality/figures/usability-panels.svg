<svg viewBox="0 0 600 286" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <marker id="up-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- LEFT PANEL: raw coordinates -->
  <rect x="14" y="14" width="256" height="230" rx="6" fill="none" stroke="currentColor" opacity="0.25"/>
  <text x="142" y="36" text-anchor="middle" font-size="13" fill="currentColor">raw X = (A, B, Z)</text>

  <!-- 2x2 grid over (A,B) -->
  <rect x="70" y="52" width="60" height="44" rx="3" fill="#4c8dd6" opacity="0.35"/>
  <rect x="130" y="52" width="60" height="44" rx="3" fill="#e2903a" opacity="0.35"/>
  <rect x="70" y="96" width="60" height="44" rx="3" fill="#e2903a" opacity="0.35"/>
  <rect x="130" y="96" width="60" height="44" rx="3" fill="#4c8dd6" opacity="0.35"/>
  <text x="100" y="80" text-anchor="middle" font-size="12" fill="currentColor">Y = 0</text>
  <text x="160" y="80" text-anchor="middle" font-size="12" fill="currentColor">Y = 1</text>
  <text x="100" y="124" text-anchor="middle" font-size="12" fill="currentColor">Y = 1</text>
  <text x="160" y="124" text-anchor="middle" font-size="12" fill="currentColor">Y = 0</text>
  <text x="56" y="80" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">A=0</text>
  <text x="56" y="124" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">A=1</text>
  <text x="100" y="46" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">B=0</text>
  <text x="160" y="46" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">B=1</text>
  <line x1="62" y1="148" x2="198" y2="44" stroke="currentColor" stroke-width="1.3" stroke-dasharray="4 3" opacity="0.7"/>
  <text x="212" y="146" font-size="11" fill="currentColor" opacity="0.55">any line</text>
  <text x="212" y="159" font-size="11" fill="currentColor" opacity="0.55">splits the</text>
  <text x="212" y="172" font-size="11" fill="currentColor" opacity="0.55">wrong pairs</text>

  <!-- Z strip -->
  <text x="34" y="186" font-size="11" fill="currentColor" opacity="0.55">Z</text>
  <rect x="70" y="174" width="72" height="14" rx="2" fill="#4c8dd6" opacity="0.6"/>
  <rect x="142" y="174" width="48" height="14" rx="2" fill="#e2903a" opacity="0.6"/>
  <text x="70" y="202" font-size="11" fill="currentColor" opacity="0.55">Z agrees with Y 60% of the time</text>

  <text x="34" y="226" font-size="12" fill="currentColor">best linear rule: <tspan font-size="12">70% correct</tspan></text>
  <text x="34" y="242" font-size="12" fill="#e2903a">I(X;Y) = 0.542 bits</text>

  <!-- ARROW -->
  <line x1="278" y1="128" x2="318" y2="128" stroke="currentColor" stroke-width="1.3" marker-end="url(#up-arrow)"/>
  <text x="298" y="106" text-anchor="middle" font-size="11" fill="currentColor">drop Z,</text>
  <text x="298" y="118" text-anchor="middle" font-size="11" fill="currentColor">XOR A, B</text>
  <text x="298" y="150" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">−0.011 bits</text>

  <!-- RIGHT PANEL: the derived feature -->
  <rect x="330" y="14" width="256" height="230" rx="6" fill="none" stroke="currentColor" opacity="0.25"/>
  <text x="458" y="36" text-anchor="middle" font-size="13" fill="currentColor">feature T = A ⊕ B</text>

  <line x1="458" y1="52" x2="458" y2="188" stroke="currentColor" stroke-width="1.3" stroke-dasharray="4 3" opacity="0.7"/>
  <text x="458" y="204" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">one threshold separates them</text>

  <text x="392" y="70" text-anchor="middle" font-size="12" fill="currentColor">T = 0</text>
  <rect x="352" y="80" width="86" height="20" rx="3" fill="#4c8dd6" opacity="0.65"/>
  <rect x="438" y="80" width="10" height="20" rx="3" fill="#e2903a" opacity="0.65"/>
  <text x="392" y="118" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">90% Y = 0</text>

  <text x="524" y="70" text-anchor="middle" font-size="12" fill="currentColor">T = 1</text>
  <rect x="470" y="80" width="10" height="20" rx="3" fill="#4c8dd6" opacity="0.65"/>
  <rect x="480" y="80" width="86" height="20" rx="3" fill="#e2903a" opacity="0.65"/>
  <text x="524" y="118" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">90% Y = 1</text>

  <text x="350" y="226" font-size="12" fill="currentColor">rule "guess Y = T": 90% correct</text>
  <text x="350" y="242" font-size="12" fill="#e2903a">I(T;Y) = 0.531 bits</text>

  <text x="300" y="272" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">fewer bits about Y on the right, twenty accuracy points more</text>
</svg>

<svg viewBox="0 0 620 314" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <style>
    .lbl { fill: currentColor; font-size: 12px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .cell { fill: currentColor; font-family: ui-monospace, monospace; font-size: 13px; font-weight: 600; }
    .on { fill: #ffffff; font-family: ui-monospace, monospace; font-size: 13px; font-weight: 600; }
  </style>

  <text class="lbl" x="20" y="22">The same byte, filled two ways</text>

  <!-- ============ panel A ============ -->
  <text class="lbl" x="20" y="52">A fixed-width field: HLIT = 29</text>
  <text class="cell" x="238" y="52">1 1 1 0 1</text>
  <path d="M 304 68 L 304 58" stroke="#e2903a" stroke-width="1.6"/>
  <path d="M 304 56 l -4 6 h 8 z" fill="#e2903a"/>
  <text x="316" y="70" font-size="11" fill="#e2903a">first bit taken: the value's lowest bit</text>

  <text class="muted" x="20" y="92">bit number</text>
  <text class="muted" x="20" y="112">the byte</text>
  <g>
    <text class="muted" x="128" y="86" text-anchor="middle">7</text>
    <text class="muted" x="180" y="86" text-anchor="middle">6</text>
    <text class="muted" x="232" y="86" text-anchor="middle">5</text>
    <text class="muted" x="284" y="86" text-anchor="middle">4</text>
    <text class="muted" x="336" y="86" text-anchor="middle">3</text>
    <text class="muted" x="388" y="86" text-anchor="middle">2</text>
    <text class="muted" x="440" y="86" text-anchor="middle">1</text>
    <text class="muted" x="492" y="86" text-anchor="middle">0</text>
  </g>
  <rect x="104" y="94" width="48" height="24" rx="3" fill="currentColor" fill-opacity="0.12"/>
  <rect x="156" y="94" width="48" height="24" rx="3" fill="currentColor" fill-opacity="0.12"/>
  <rect x="208" y="94" width="48" height="24" rx="3" fill="currentColor" fill-opacity="0.12"/>
  <rect x="260" y="94" width="48" height="24" rx="3" fill="#e2903a"/>
  <text class="on" x="284" y="111" text-anchor="middle">1</text>
  <rect x="312" y="94" width="48" height="24" rx="3" fill="#e2903a"/>
  <text class="on" x="336" y="111" text-anchor="middle">1</text>
  <rect x="364" y="94" width="48" height="24" rx="3" fill="#e2903a"/>
  <text class="on" x="388" y="111" text-anchor="middle">1</text>
  <rect x="416" y="94" width="48" height="24" rx="3" fill="#e2903a"/>
  <text class="on" x="440" y="111" text-anchor="middle">0</text>
  <rect x="468" y="94" width="48" height="24" rx="3" fill="#e2903a"/>
  <text class="on" x="492" y="111" text-anchor="middle">1</text>
  <text class="lbl" x="104" y="140">Read the byte in the usual order and the field is unchanged: 11101.</text>

  <line x1="20" y1="158" x2="600" y2="158" stroke="currentColor" stroke-opacity="0.25"/>

  <!-- ============ panel B ============ -->
  <text class="lbl" x="20" y="186">A Huffman codeword: 1110</text>
  <text class="cell" x="238" y="186">1 1 1 0</text>
  <path d="M 241 202 L 241 192" stroke="#4c8dd6" stroke-width="1.6"/>
  <path d="M 241 190 l -4 6 h 8 z" fill="#4c8dd6"/>
  <text x="253" y="204" font-size="11" fill="#4c8dd6">first bit taken: the code's highest bit</text>

  <text class="muted" x="20" y="220">bit number</text>
  <text class="muted" x="20" y="246">the byte</text>
  <g>
    <text class="muted" x="128" y="220" text-anchor="middle">7</text>
    <text class="muted" x="180" y="220" text-anchor="middle">6</text>
    <text class="muted" x="232" y="220" text-anchor="middle">5</text>
    <text class="muted" x="284" y="220" text-anchor="middle">4</text>
    <text class="muted" x="336" y="220" text-anchor="middle">3</text>
    <text class="muted" x="388" y="220" text-anchor="middle">2</text>
    <text class="muted" x="440" y="220" text-anchor="middle">1</text>
    <text class="muted" x="492" y="220" text-anchor="middle">0</text>
  </g>
  <rect x="104" y="228" width="48" height="24" rx="3" fill="currentColor" fill-opacity="0.12"/>
  <rect x="156" y="228" width="48" height="24" rx="3" fill="currentColor" fill-opacity="0.12"/>
  <rect x="208" y="228" width="48" height="24" rx="3" fill="currentColor" fill-opacity="0.12"/>
  <rect x="260" y="228" width="48" height="24" rx="3" fill="currentColor" fill-opacity="0.12"/>
  <rect x="312" y="228" width="48" height="24" rx="3" fill="#4c8dd6"/>
  <text class="on" x="336" y="245" text-anchor="middle">0</text>
  <rect x="364" y="228" width="48" height="24" rx="3" fill="#4c8dd6"/>
  <text class="on" x="388" y="245" text-anchor="middle">1</text>
  <rect x="416" y="228" width="48" height="24" rx="3" fill="#4c8dd6"/>
  <text class="on" x="440" y="245" text-anchor="middle">1</text>
  <rect x="468" y="228" width="48" height="24" rx="3" fill="#4c8dd6"/>
  <text class="on" x="492" y="245" text-anchor="middle">1</text>
  <text class="lbl" x="104" y="274">Read the byte in the usual order and the codeword is reversed: 0111.</text>

  <text class="muted" x="20" y="302">Both fill the byte from bit 0 upward. They differ only in which end of the element goes in first.</text>
</svg>

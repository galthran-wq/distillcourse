<svg viewBox="0 0 620 306" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <style>
    .lbl { fill: currentColor; font-size: 12px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .fld { fill: #ffffff; font-size: 11px; font-weight: 600; }
    .in  { fill: currentColor; font-size: 11px; }
  </style>

  <text class="lbl" x="20" y="22">One dynamic block of gzip -9 output, in the order the decoder reads it</text>

  <!-- row A: the fixed-width header fields -->
  <text class="muted" x="20" y="62">fixed fields</text>
  <text class="muted" x="118" y="48">BFINAL</text>
  <text class="muted" x="170" y="48">BTYPE</text>
  <text class="muted" x="222" y="48">HLIT</text>
  <text class="muted" x="274" y="48">HDIST</text>
  <text class="muted" x="332" y="48">HCLEN</text>
  <rect x="112" y="52" width="46" height="24" rx="3" fill="currentColor" fill-opacity="0.18"/>
  <text class="in" x="135" y="68" text-anchor="middle">1 bit</text>
  <rect x="164" y="52" width="46" height="24" rx="3" fill="currentColor" fill-opacity="0.18"/>
  <text class="in" x="187" y="68" text-anchor="middle">2 bits</text>
  <rect x="216" y="52" width="46" height="24" rx="3" fill="currentColor" fill-opacity="0.18"/>
  <text class="in" x="239" y="68" text-anchor="middle">5 bits</text>
  <rect x="268" y="52" width="52" height="24" rx="3" fill="currentColor" fill-opacity="0.18"/>
  <text class="in" x="294" y="68" text-anchor="middle">5 bits</text>
  <rect x="326" y="52" width="52" height="24" rx="3" fill="currentColor" fill-opacity="0.18"/>
  <text class="in" x="352" y="68" text-anchor="middle">4 bits</text>
  <text class="muted" x="392" y="63">= 286 literal/length codes, 30 distance</text>
  <text class="muted" x="392" y="76">codes, 17 code-length codes</text>

  <!-- row B: the two code descriptions -->
  <text class="muted" x="20" y="118">code tables</text>
  <rect x="112" y="102" width="150" height="30" rx="3" fill="#4c8dd6"/>
  <text class="fld" x="187" y="115" text-anchor="middle">17 &#215; 3 bits</text>
  <text class="fld" x="187" y="128" text-anchor="middle">the code-length code</text>
  <rect x="268" y="102" width="332" height="30" rx="3" fill="#e2903a"/>
  <text class="fld" x="434" y="115" text-anchor="middle">576 bits</text>
  <text class="fld" x="434" y="128" text-anchor="middle">316 code lengths, run-length coded with that code</text>

  <!-- row C: the data -->
  <text class="muted" x="20" y="176">data</text>
  <rect x="112" y="158" width="488" height="30" rx="3" fill="currentColor" fill-opacity="0.30"/>
  <text class="lbl" x="356" y="178" text-anchor="middle">203,900 bits: 5,374 literals and 8,776 matches, then end-of-block</text>

  <!-- tally -->
  <line x1="112" y1="206" x2="378" y2="206" stroke="#e2903a" stroke-width="1.5"/>
  <text x="112" y="224" font-size="12" fill="#e2903a">the model: 644 bits = 80 bytes</text>
  <line x1="112" y1="242" x2="600" y2="242" stroke="currentColor" stroke-opacity="0.4"/>
  <text class="lbl" x="112" y="260">the data: 25,487 bytes</text>

  <line x1="20" y1="278" x2="600" y2="278" stroke="currentColor" stroke-opacity="0.25"/>
  <text class="muted" x="20" y="296">A 112,425-byte text file. The model is 0.3% of the block; every earlier field exists to describe the next one.</text>
</svg>

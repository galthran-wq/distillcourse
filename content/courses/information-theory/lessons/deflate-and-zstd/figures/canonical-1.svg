<svg viewBox="0 0 620 336" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <style>
    .lbl { fill: currentColor; font-size: 12px; }
    .big { fill: currentColor; font-size: 15px; font-weight: 600; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .mono { fill: currentColor; font-family: ui-monospace, monospace; font-size: 13px; }
    .amb { fill: #e2903a; font-size: 12px; }
    .ambmono { fill: #e2903a; font-family: ui-monospace, monospace; font-size: 13px; font-weight: 600; }
    .step { fill: #e2903a; font-size: 12px; font-weight: 600; }
  </style>
  <text class="step" x="20" y="26">Given: the code lengths, in symbol order</text>
  <text class="muted" x="20" y="56">symbol</text>
  <text class="muted" x="20" y="88">length</text>
  <text class="big" x="136" y="56" text-anchor="middle">A</text>
  <rect x="110" y="70" width="52" height="26" rx="3" fill="#e2903a" fill-opacity="1"/>
  <text x="136" y="88" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">3</text>
  <text class="big" x="197" y="56" text-anchor="middle">B</text>
  <rect x="171" y="70" width="52" height="26" rx="3" fill="#e2903a" fill-opacity="1"/>
  <text x="197" y="88" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">3</text>
  <text class="big" x="258" y="56" text-anchor="middle">C</text>
  <rect x="232" y="70" width="52" height="26" rx="3" fill="#e2903a" fill-opacity="1"/>
  <text x="258" y="88" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">3</text>
  <text class="big" x="319" y="56" text-anchor="middle">D</text>
  <rect x="293" y="70" width="52" height="26" rx="3" fill="#e2903a" fill-opacity="1"/>
  <text x="319" y="88" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">3</text>
  <text class="big" x="380" y="56" text-anchor="middle">E</text>
  <rect x="354" y="70" width="52" height="26" rx="3" fill="#e2903a" fill-opacity="1"/>
  <text x="380" y="88" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">3</text>
  <text class="big" x="441" y="56" text-anchor="middle">F</text>
  <rect x="415" y="70" width="52" height="26" rx="3" fill="#e2903a" fill-opacity="1"/>
  <text x="441" y="88" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">2</text>
  <text class="big" x="502" y="56" text-anchor="middle">G</text>
  <rect x="476" y="70" width="52" height="26" rx="3" fill="#e2903a" fill-opacity="1"/>
  <text x="502" y="88" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">4</text>

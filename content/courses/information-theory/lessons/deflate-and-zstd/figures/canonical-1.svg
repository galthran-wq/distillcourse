  <line x1="20" y1="284" x2="600" y2="284" stroke="currentColor" stroke-opacity="0.25"/>
  <text class="lbl" x="20" y="304">Kraft budget: 1&#215;&#188; + 5&#215;&#8539; + 2&#215;(1/16) = 1.</text>
  <text class="muted" x="20" y="322">The lengths spend the budget exactly, so no code value is left unused.</text>

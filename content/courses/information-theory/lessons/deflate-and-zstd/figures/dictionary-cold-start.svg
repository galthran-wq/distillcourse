<svg viewBox="0 0 620 244" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <style>
    .lbl { fill: currentColor; font-size: 12px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .on { fill: #ffffff; font-size: 12px; font-weight: 600; }
  </style>

  <text class="lbl" x="20" y="22">Average size of one 178-byte JSON record, compressed on its own</text>

  <text class="lbl" x="20" y="62">uncompressed</text>
  <rect x="176" y="46" width="356" height="24" rx="3" fill="currentColor" fill-opacity="0.25"/>
  <text class="lbl" x="542" y="62">178.1 B</text>

  <text class="lbl" x="20" y="106">zstd -19</text>
  <rect x="176" y="90" width="318" height="24" rx="3" fill="#4c8dd6"/>
  <text class="on" x="335" y="106" text-anchor="middle">no history to point at</text>
  <text class="lbl" x="542" y="106">159.1 B</text>

  <text class="lbl" x="20" y="150">zstd -19, 8 KB dictionary</text>
  <rect x="176" y="134" width="124" height="24" rx="3" fill="#e2903a"/>
  <text class="lbl" x="542" y="150">61.8 B</text>
  <text class="muted" x="310" y="150">the dictionary is the history</text>

  <line x1="20" y1="176" x2="600" y2="176" stroke="currentColor" stroke-opacity="0.25"/>
  <text class="lbl" x="20" y="200">A pointer needs something to point at. On a 178-byte payload the window is empty,</text>
  <text class="lbl" x="20" y="220">so the dictionary supplies a past that the record never had.</text>
  <text class="muted" x="20" y="238">200 held-out records; the dictionary was trained on 1,000 others with zstd --train.</text>
</svg>

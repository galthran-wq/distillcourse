<svg viewBox="0 0 620 268" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <style>
    .lbl { fill: currentColor; font-size: 12px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .on { fill: #ffffff; font-size: 11px; font-weight: 600; }
  </style>

  <text class="lbl" x="20" y="22">The same file, the same format, two compression levels</text>

  <!-- gzip -1 -->
  <text class="lbl" x="20" y="72">gzip -1</text>
  <rect x="86" y="56" width="86" height="24" rx="3" fill="#4c8dd6"/>
  <text class="on" x="129" y="72" text-anchor="middle">3,841</text>
  <rect x="174" y="56" width="291" height="24" rx="3" fill="#e2903a"/>
  <text class="on" x="319" y="72" text-anchor="middle">13,030 matches &#183; 8.3 B each</text>
  <text class="lbl" x="478" y="72">31,748 bytes</text>

  <!-- gzip -9 -->
  <text class="lbl" x="20" y="124">gzip -9</text>
  <rect x="86" y="108" width="120" height="24" rx="3" fill="#4c8dd6"/>
  <text class="on" x="146" y="124" text-anchor="middle">5,374</text>
  <rect x="208" y="108" width="196" height="24" rx="3" fill="#e2903a"/>
  <text class="on" x="306" y="124" text-anchor="middle">8,776 matches &#183; 12.2 B each</text>
  <text class="lbl" x="478" y="124">25,586 bytes</text>

  <text class="muted" x="86" y="150">literals</text>
  <text class="muted" x="208" y="150">matches</text>

  <line x1="20" y1="176" x2="600" y2="176" stroke="currentColor" stroke-opacity="0.25"/>
  <text class="lbl" x="20" y="200">Both outputs are one dynamic block with the same three alphabets, read by the same decoder.</text>
  <text class="lbl" x="20" y="222">What the level changed is which matches the encoder looked for, and for how long.</text>
  <text class="muted" x="20" y="248">112,425 bytes of RFC 8878 text, gzip 1.12.</text>
</svg>

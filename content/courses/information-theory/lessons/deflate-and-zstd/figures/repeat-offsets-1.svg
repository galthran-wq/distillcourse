<svg viewBox="0 0 620 296" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <style>
    .lbl { fill: currentColor; font-size: 12px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .step { fill: #e2903a; font-size: 12px; font-weight: 600; }
    .val { fill: currentColor; font-family: ui-monospace, monospace; font-size: 17px; font-weight: 600; }
    .valon { fill: #ffffff; font-family: ui-monospace, monospace; font-size: 17px; font-weight: 600; }
  </style>
  <text class="step" x="20" y="24">Sequence 1 &#8212; distance 1111 has not been used before</text>
  <text class="lbl" x="20" y="56">11 literals, then a match 1111 bytes back</text>
  <text class="muted" x="360" y="56">written as offset_value 1114</text>
  <text class="muted" x="20" y="98">the three-slot cache, after this sequence</text>
  <text class="muted" x="176" y="120" text-anchor="middle">most recent offset</text>
  <rect x="96" y="128" width="160" height="40" rx="4" fill="#e2903a"/>
  <text class="valon" x="176" y="155" text-anchor="middle">1111</text>
  <text class="muted" x="340" y="120" text-anchor="middle">second</text>
  <rect x="272" y="128" width="136" height="40" rx="4" fill="currentColor" fill-opacity="0.14"/>
  <text class="val" x="340" y="155" text-anchor="middle">1</text>
  <text class="muted" x="492" y="120" text-anchor="middle">third</text>
  <rect x="424" y="128" width="136" height="40" rx="4" fill="currentColor" fill-opacity="0.14"/>
  <text class="val" x="492" y="155" text-anchor="middle">4</text>
  <text class="muted" x="20" y="206">cost of naming the offset</text>
  <text class="lbl" x="200" y="206" fill="#4c8dd6">offset code 10, then 10 raw bits</text>
  <text class="muted" x="20" y="232">raw offset bits spent so far</text>
  <text class="lbl" x="200" y="232">10</text>
  <line x1="20" y1="256" x2="600" y2="256" stroke="currentColor" stroke-opacity="0.25"/>
  <text class="muted" x="20" y="276">The trace of RFC 8878 Table 18. Slots start at 1, 4, 8 and always hold the three most recently used offsets.</text>
</svg>

<svg viewBox="0 0 620 254" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <style>
    .lbl { fill: currentColor; font-size: 12px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .on { fill: #ffffff; font-size: 11px; font-weight: 600; }
  </style>

  <text class="lbl" x="20" y="22">gzip -9 on 100,000 uniformly random bytes</text>

  <text class="muted" x="20" y="58">input</text>
  <rect x="86" y="42" width="480" height="22" rx="3" fill="currentColor" fill-opacity="0.2"/>
  <text class="lbl" x="326" y="58" text-anchor="middle">100,000 bytes with no repeated substring and flat byte frequencies</text>

  <text class="muted" x="20" y="112">output</text>
  <rect x="86" y="88" width="18" height="34" rx="2" fill="#4c8dd6"/>
  <rect x="108" y="88" width="10" height="34" rx="2" fill="#e2903a"/>
  <rect x="118" y="88" width="147" height="34" rx="2" fill="currentColor" fill-opacity="0.2"/>
  <rect x="267" y="88" width="10" height="34" rx="2" fill="#e2903a"/>
  <rect x="277" y="88" width="147" height="34" rx="2" fill="currentColor" fill-opacity="0.2"/>
  <rect x="426" y="88" width="10" height="34" rx="2" fill="#e2903a"/>
  <rect x="436" y="88" width="112" height="34" rx="2" fill="currentColor" fill-opacity="0.2"/>
  <rect x="550" y="88" width="10" height="34" rx="2" fill="#e2903a"/>
  <rect x="560" y="88" width="16" height="34" rx="2" fill="currentColor" fill-opacity="0.2"/>

  <text class="lbl" x="191" y="110" text-anchor="middle">32,789 B verbatim</text>
  <text class="lbl" x="350" y="110" text-anchor="middle">32,783 B</text>
  <text class="lbl" x="492" y="110" text-anchor="middle">32,781 B</text>

  <path d="M 113 132 L 113 148" stroke="#e2903a" stroke-width="1.4"/>
  <text x="126" y="152" font-size="11" fill="#e2903a">5-byte stored-block header: 3 bits of type, padding, LEN, NLEN</text>
  <text class="muted" x="20" y="140">gzip frame, 18 B</text>

  <line x1="20" y1="176" x2="600" y2="176" stroke="currentColor" stroke-opacity="0.25"/>
  <text class="lbl" x="20" y="200">Total output 100,038 bytes: four block headers of five bytes each, plus 18 bytes of gzip framing.</text>
  <text class="lbl" x="20" y="222">The expansion is 0.038% of the input, and no input can force more than 5 bytes per 32 KB.</text>
  <text class="muted" x="20" y="246">Measured with gzip 1.12; the last block holds the remaining 1,647 bytes.</text>
</svg>

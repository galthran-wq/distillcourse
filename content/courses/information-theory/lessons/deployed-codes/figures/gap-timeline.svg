  <text class="note" x="76.0" y="350.0" text-anchor="start">Deployed points read from the Deep Space Network handbook, at a bit error rate of 10⁻⁶;</text>
  <text class="note" x="76.0" y="370.0" text-anchor="start">the 2001 point is an ensemble threshold, not a measured code. Open marks on the axis:</text>
  <text class="note" x="76.0" y="390.0" text-anchor="start">1963, Gallager's codes with no affordable decoder; 2009, polar; 2016, 5G adopts both.</text>
  <text class="note" x="76.0" y="410.0" text-anchor="start">Every step after 1977 was bought by changing the decoder, not the distance.</text>

<svg viewBox="0 0 640 356" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .lab  { fill: currentColor; }
    .mut  { fill: currentColor; opacity: 0.55; font-size: 11.5px; }
    .note { fill: currentColor; opacity: 0.75; font-size: 12px; }
    .axis { stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.2; fill: none; }
    .guide{ stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
    .box  { stroke: currentColor; stroke-opacity: 0.65; stroke-width: 1.2; fill: none; }
  </style>
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 z" fill="currentColor" fill-opacity="0.6"/></marker>
    <marker id="aa" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 z" fill="#e2903a"/></marker>
    <marker id="ab" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 z" fill="#4c8dd6"/></marker>
  </defs>
  <rect x="28" y="34" width="196" height="120" rx="6" class="box"/>
  <text class="mut" x="126" y="52" text-anchor="middle">one combining step</text>
  <text class="mut" x="42" y="82" text-anchor="start">u1</text>
  <text class="mut" x="42" y="122" text-anchor="start">u2</text>
  <path d="M62 78 L104 78" class="axis"/>
  <path d="M62 118 L152 118" class="axis"/>
  <path d="M118 78 L152 78" class="axis"/>
  <path d="M104 92 L104 118" class="axis"/>
  <circle cx="111" cy="78" r="7" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.2"/>
  <text class="mut" x="111" y="82" text-anchor="middle" font-size="10">+</text>
  <rect x="152" y="66" width="26" height="24" rx="3" class="box"/>
  <text class="mut" x="165" y="83" text-anchor="middle" font-size="10">W</text>
  <rect x="152" y="106" width="26" height="24" rx="3" class="box"/>
  <text class="mut" x="165" y="123" text-anchor="middle" font-size="10">W</text>
  <text class="mut" x="186" y="82" text-anchor="start" fill="#4c8dd6">bad</text>
  <text class="mut" x="186" y="122" text-anchor="start" fill="#e2903a">good</text>
  <text class="mut" x="28" y="172" text-anchor="start">Two uses of W carry u1 through both</text>
  <text class="mut" x="28" y="188" text-anchor="start">and u2 through one, given u1: one</text>
  <text class="mut" x="28" y="204" text-anchor="start">synthetic channel worse, one better.</text>
  <path class="axis" d="M300.0 240.0 L588.0 240.0"/>
  <path class="axis" d="M300.0 240.0 L300.0 40.0"/>
  <path class="axis" d="M295.0 240.0 L300.0 240.0"/>
  <text class="mut" x="291.0" y="244.0" text-anchor="end">0</text>
  <path class="axis" d="M295.0 143.0 L300.0 143.0"/>
  <text class="mut" x="291.0" y="147.0" text-anchor="end">0.5</text>
  <path class="axis" d="M295.0 46.0 L300.0 46.0"/>
  <text class="mut" x="291.0" y="50.0" text-anchor="end">1</text>
  <text class="mut" x="444.0" y="30.0" text-anchor="middle">capacity of each synthetic channel</text>
  <text class="mut" x="444.0" y="262.0" text-anchor="middle">synthetic channels, sorted</text>
  <rect x="313.0" y="227.9" width="46.1" height="12.1" rx="2" fill="none" stroke="#4c8dd6" stroke-width="1.8"/>
  <text class="mut" x="336.0" y="220.9" text-anchor="middle" font-size="10.5" fill="#4c8dd6">0.0625</text>
  <rect x="385.0" y="155.1" width="46.1" height="84.9" rx="2" fill="none" stroke="#4c8dd6" stroke-width="1.8"/>
  <text class="mut" x="408.0" y="172.1" text-anchor="middle" font-size="10.5" fill="#4c8dd6">0.4375</text>
  <rect x="457.0" y="130.9" width="46.1" height="109.1" rx="2" fill="none" stroke="#e2903a" stroke-width="1.8"/>
  <text class="mut" x="480.0" y="147.9" text-anchor="middle" font-size="10.5" fill="#e2903a">0.5625</text>
  <rect x="529.0" y="58.1" width="46.1" height="181.9" rx="2" fill="none" stroke="#e2903a" stroke-width="1.8"/>
  <text class="mut" x="552.0" y="75.1" text-anchor="middle" font-size="10.5" fill="#e2903a">0.9375</text>
  <text class="lab" x="28" y="234" text-anchor="start" font-size="12.5">2 combining steps: n = 4</text>
  <text class="note" x="24" y="288" text-anchor="start">Two steps, four synthetic channels: 0.0625, 0.4375, 0.5625, 0.9375. The spread widens and</text>
  <text class="note" x="24" y="306" text-anchor="start">the mean does not move.</text>
</svg>

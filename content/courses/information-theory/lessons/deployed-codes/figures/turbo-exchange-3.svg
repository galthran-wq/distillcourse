<svg viewBox="0 0 640 392" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .lab  { fill: currentColor; }
    .mut  { fill: currentColor; opacity: 0.55; font-size: 11.5px; }
    .note { fill: currentColor; opacity: 0.75; font-size: 12px; }
    .axis { stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.2; fill: none; }
    .guide{ stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
    .box  { stroke: currentColor; stroke-opacity: 0.65; stroke-width: 1.2; fill: none; }
  </style>
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 z" fill="currentColor" fill-opacity="0.6"/></marker>
    <marker id="aa" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 z" fill="#e2903a"/></marker>
    <marker id="ab" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 z" fill="#4c8dd6"/></marker>
  </defs>
  <text class="mut" x="24" y="24" text-anchor="start">received from the channel</text>
  <rect x="60" y="34" width="140" height="26" rx="4" stroke="#4c8dd6" stroke-width="1.6" fill="none"/>
  <text class="mut" x="130" y="51" text-anchor="middle" fill="#4c8dd6">parity from encoder 1</text>
  <rect x="250" y="34" width="140" height="26" rx="4" stroke="#4c8dd6" stroke-width="1.6" fill="none"/>
  <text class="mut" x="320" y="51" text-anchor="middle" fill="#4c8dd6">the 8 message bits</text>
  <rect x="440" y="34" width="140" height="26" rx="4" stroke="#4c8dd6" stroke-width="1.6" fill="none"/>
  <text class="mut" x="510" y="51" text-anchor="middle" fill="#4c8dd6">parity from encoder 2</text>
  <path d="M130 60 L112 146" stroke="#4c8dd6" stroke-opacity="0.55" stroke-width="1.2" fill="none" marker-end="url(#ab)"/>
  <path d="M320 60 L178 146" stroke="#4c8dd6" stroke-opacity="0.55" stroke-width="1.2" fill="none" marker-end="url(#ab)"/>
  <path d="M320 60 L462 146" stroke="#4c8dd6" stroke-opacity="0.55" stroke-width="1.2" fill="none" marker-end="url(#ab)"/>
  <path d="M510 60 L528 146" stroke="#4c8dd6" stroke-opacity="0.55" stroke-width="1.2" fill="none" marker-end="url(#ab)"/>
  <rect x="45" y="148" width="190" height="66" rx="6" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.2" fill="none"/>
  <text class="lab" x="140" y="172" text-anchor="middle" font-size="12.5">decoder 1</text>
  <text class="mut" x="140" y="190" text-anchor="middle">forward-backward on</text>
  <text class="mut" x="140" y="205" text-anchor="middle">trellis 1, natural order</text>
  <rect x="405" y="148" width="190" height="66" rx="6" stroke="#e2903a" stroke-width="2.0" fill="none"/>
  <text class="lab" x="500" y="172" text-anchor="middle" font-size="12.5">decoder 2</text>
  <text class="mut" x="500" y="190" text-anchor="middle">forward-backward on</text>
  <text class="mut" x="500" y="205" text-anchor="middle">trellis 2, permuted order</text>
  <rect x="288" y="146" width="64" height="26" rx="4" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.2" fill="none"/>
  <text class="lab" x="320" y="164" text-anchor="middle" font-size="12.5">&#960;</text>
  <path d="M235 159 L284 159" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  <path d="M356 159 L401 159" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  <rect x="288" y="190" width="64" height="26" rx="4" stroke="#e2903a" stroke-width="2.0" fill="none"/>
  <text class="lab" x="320" y="208" text-anchor="middle" font-size="12.5">&#960;<tspan font-size='9' dy='-4'>-1</tspan></text>
  <path d="M401 203 L356 203" stroke="#e2903a" stroke-opacity="1" stroke-width="1.6" fill="none" marker-end="url(#aa)"/>
  <path d="M284 203 L239 203" stroke="#e2903a" stroke-opacity="1" stroke-width="1.6" fill="none" marker-end="url(#aa)"/>
  <text class="mut" x="320" y="232" text-anchor="middle" fill="#e2903a">extrinsic odds, put back in order</text>
  <text class="mut" x="196" y="285" text-anchor="end">trellis 1 path</text>
  <rect x="210" y="268" width="26" height="24" rx="3" fill="none" stroke="currentColor" stroke-opacity="0.55" stroke-width="1.2"/>
  <text class="lab" x="223" y="285" text-anchor="middle" font-size="12" fill="currentColor">0</text>
  <rect x="244" y="268" width="26" height="24" rx="3" fill="none" stroke="currentColor" stroke-opacity="0.55" stroke-width="1.2"/>
  <text class="lab" x="257" y="285" text-anchor="middle" font-size="12" fill="currentColor">1</text>
  <rect x="278" y="268" width="26" height="24" rx="3" fill="none" stroke="currentColor" stroke-opacity="0.55" stroke-width="1.2"/>
  <text class="lab" x="291" y="285" text-anchor="middle" font-size="12" fill="currentColor">1</text>
  <rect x="312" y="268" width="26" height="24" rx="3" fill="none" stroke="currentColor" stroke-opacity="0.55" stroke-width="1.2"/>
  <text class="lab" x="325" y="285" text-anchor="middle" font-size="12" fill="currentColor">0</text>
  <rect x="346" y="268" width="26" height="24" rx="3" fill="none" stroke="currentColor" stroke-opacity="0.55" stroke-width="1.2"/>
  <text class="lab" x="359" y="285" text-anchor="middle" font-size="12" fill="currentColor">1</text>
  <rect x="380" y="268" width="26" height="24" rx="3" fill="none" stroke="currentColor" stroke-opacity="0.55" stroke-width="1.2"/>
  <text class="lab" x="393" y="285" text-anchor="middle" font-size="12" fill="currentColor">0</text>
  <rect x="414" y="268" width="26" height="24" rx="3" fill="none" stroke="currentColor" stroke-opacity="0.55" stroke-width="1.2"/>
  <text class="lab" x="427" y="285" text-anchor="middle" font-size="12" fill="currentColor">0</text>
  <rect x="448" y="268" width="26" height="24" rx="3" fill="none" stroke="currentColor" stroke-opacity="0.55" stroke-width="1.2"/>
  <text class="lab" x="461" y="285" text-anchor="middle" font-size="12" fill="currentColor">1</text>
  <text class="mut" x="196" y="323" text-anchor="end">trellis 2 path</text>
  <rect x="210" y="306" width="26" height="24" rx="3" fill="none" stroke="currentColor" stroke-opacity="0.55" stroke-width="1.2"/>
  <text class="lab" x="223" y="323" text-anchor="middle" font-size="12" fill="currentColor">0</text>
  <rect x="244" y="306" width="26" height="24" rx="3" fill="none" stroke="currentColor" stroke-opacity="0.55" stroke-width="1.2"/>
  <text class="lab" x="257" y="323" text-anchor="middle" font-size="12" fill="currentColor">1</text>
  <rect x="278" y="306" width="26" height="24" rx="3" fill="none" stroke="currentColor" stroke-opacity="0.55" stroke-width="1.2"/>
  <text class="lab" x="291" y="323" text-anchor="middle" font-size="12" fill="currentColor">1</text>
  <rect x="312" y="306" width="26" height="24" rx="3" fill="none" stroke="currentColor" stroke-opacity="0.55" stroke-width="1.2"/>
  <text class="lab" x="325" y="323" text-anchor="middle" font-size="12" fill="currentColor">0</text>
  <rect x="346" y="306" width="26" height="24" rx="3" fill="none" stroke="#e2903a" stroke-width="1.8"/>
  <text class="lab" x="359" y="323" text-anchor="middle" font-size="12" fill="#e2903a">0</text>
  <rect x="380" y="306" width="26" height="24" rx="3" fill="none" stroke="currentColor" stroke-opacity="0.55" stroke-width="1.2"/>
  <text class="lab" x="393" y="323" text-anchor="middle" font-size="12" fill="currentColor">0</text>
  <rect x="414" y="306" width="26" height="24" rx="3" fill="none" stroke="#e2903a" stroke-width="1.8"/>
  <text class="lab" x="427" y="323" text-anchor="middle" font-size="12" fill="#e2903a">1</text>
  <rect x="448" y="306" width="26" height="24" rx="3" fill="none" stroke="currentColor" stroke-opacity="0.55" stroke-width="1.2"/>
  <text class="lab" x="461" y="323" text-anchor="middle" font-size="12" fill="currentColor">1</text>
  <text class="mut" x="530" y="345" text-anchor="start" fill="#e2903a">2 of 8 disagree</text>
  <text class="note" x="24" y="366" text-anchor="start">Decoder 2 treats those odds as priors, adds its own parity, and sends its odds back. Its</text>
  <text class="note" x="24" y="384" text-anchor="start">most probable path still disagrees with decoder 1's on two bits.</text>
</svg>

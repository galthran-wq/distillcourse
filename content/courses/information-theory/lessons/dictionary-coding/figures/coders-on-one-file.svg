<svg viewBox="0 0 600 224" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <style>
    .lbl { fill: currentColor; font-size: 12px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .amb { fill: #e2903a; font-size: 12px; }
    .blu { fill: #4c8dd6; font-size: 11px; }
  </style>

  <text class="lbl" x="20" y="22">one 20,942-byte text file, four coders, output as a share of the input</text>

  <!-- 5 px per percentage point, bars starting at x = 155 -->
  <text class="muted" x="145" y="62" text-anchor="end">Laplace-model coder</text>
  <rect x="155" y="50" width="310" height="18" rx="3" fill="currentColor" fill-opacity="0.3"/>
  <text class="muted" x="471" y="63">12,974 bytes · 62%</text>

  <text class="lbl" x="145" y="94" text-anchor="end">gzip</text>
  <rect x="155" y="82" width="195" height="18" rx="3" fill="#e2903a"/>
  <text class="amb" x="356" y="95">8,177 bytes · 39%</text>

  <text class="muted" x="145" y="126" text-anchor="end">bzip2</text>
  <rect x="155" y="114" width="180" height="18" rx="3" fill="currentColor" fill-opacity="0.3"/>
  <text class="muted" x="341" y="127">7,640 bytes · 36%</text>

  <text class="muted" x="145" y="158" text-anchor="end">ppmz</text>
  <rect x="155" y="146" width="160" height="18" rx="3" fill="currentColor" fill-opacity="0.3"/>
  <text class="muted" x="321" y="159">6,800 bytes · 32%</text>

  <!-- the target the theorems seem to promise -->
  <line x1="217" y1="42" x2="217" y2="176" stroke="#4c8dd6" stroke-dasharray="3 3"/>
  <text class="blu" x="217" y="192" text-anchor="middle">1 bit per character</text>
  <text class="muted" x="217" y="208" text-anchor="middle">the entropy rate of English: 12.5% of an 8-bit encoding</text>
</svg>

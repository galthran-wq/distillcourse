<svg viewBox="0 0 600 250" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <style>
    .lbl { fill: currentColor; font-size: 12px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .amb { fill: #e2903a; font-size: 12px; }
    .blu { fill: #4c8dd6; font-size: 12px; }
  </style>

  <text class="lbl" x="20" y="24">one instruction: copy 5 bytes from 2 back</text>

  <!-- output buffer: 2 existing bytes + 5 produced -->
  <g>
    <rect x="60" y="70" width="46" height="34" rx="3" fill="none" stroke="currentColor" stroke-opacity="0.35"/>
    <text x="83" y="93" text-anchor="middle" font-size="15" font-weight="600" fill="currentColor">X</text>
    <rect x="110" y="70" width="46" height="34" rx="3" fill="none" stroke="currentColor" stroke-opacity="0.35"/>
    <text x="133" y="93" text-anchor="middle" font-size="15" font-weight="600" fill="currentColor">Y</text>

    <rect x="160" y="70" width="46" height="34" rx="3" fill="#e2903a"/>
    <text x="183" y="93" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">X</text>
    <rect x="210" y="70" width="46" height="34" rx="3" fill="#e2903a"/>
    <text x="233" y="93" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">Y</text>
    <rect x="260" y="70" width="46" height="34" rx="3" fill="#e2903a"/>
    <text x="283" y="93" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">X</text>
    <rect x="310" y="70" width="46" height="34" rx="3" fill="#e2903a"/>
    <text x="333" y="93" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">Y</text>
    <rect x="360" y="70" width="46" height="34" rx="3" fill="#e2903a"/>
    <text x="383" y="93" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">X</text>
  </g>

  <text class="muted" x="60" y="58">already sent</text>
  <text class="amb" x="160" y="58">produced by the copy, one byte at a time</text>

  <!-- five read arcs, each two cells back -->
  <g stroke="#4c8dd6" stroke-width="1.3" fill="none">
    <path d="M 83 108 C 83 148, 183 148, 183 112"/>
    <path d="M 133 108 C 133 148, 233 148, 233 112"/>
    <path d="M 183 108 C 183 148, 283 148, 283 112"/>
    <path d="M 233 108 C 233 148, 333 148, 333 112"/>
    <path d="M 283 108 C 283 148, 383 148, 383 112"/>
  </g>
  <g fill="#4c8dd6">
    <path d="M 179 112 L 183 104 L 187 112 Z"/>
    <path d="M 229 112 L 233 104 L 237 112 Z"/>
    <path d="M 279 112 L 283 104 L 287 112 Z"/>
    <path d="M 329 112 L 333 104 L 337 112 Z"/>
    <path d="M 379 112 L 383 104 L 387 112 Z"/>
  </g>
  <text class="blu" x="424" y="146">each arrow reads 2 back</text>

  <line x1="20" y1="180" x2="580" y2="180" stroke="currentColor" stroke-opacity="0.2"/>

  <text class="lbl" x="20" y="204">The third arrow reads a cell the copy itself wrote, so the read pointer never</text>
  <text class="lbl" x="20" y="222">catches the write pointer and the length may exceed the distance without limit.</text>
  <text class="muted" x="20" y="240">Distance 1 stamps out one byte forever: run-length encoding is the degenerate match.</text>
</svg>

<svg viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <style>
    .lbl { fill: currentColor; font-size: 12px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .amb { fill: #e2903a; font-size: 12px; }
    .blu { fill: #4c8dd6; font-size: 12px; }
  </style>

  <text class="lbl" x="20" y="22">compressed size ÷ input size, against input length</text>

  <!-- axes: x 70..540 (10^1 .. 10^6), y: ratio 0 at 250, 2.0 at 50 -->
  <line x1="70" y1="250" x2="545" y2="250" stroke="currentColor" stroke-opacity="0.45"/>
  <line x1="70" y1="44" x2="70" y2="250" stroke="currentColor" stroke-opacity="0.45"/>

  <g class="muted">
    <text x="70" y="268" text-anchor="middle">10 B</text>
    <text x="164" y="268" text-anchor="middle">100 B</text>
    <text x="258" y="268" text-anchor="middle">1 KB</text>
    <text x="352" y="268" text-anchor="middle">10 KB</text>
    <text x="446" y="268" text-anchor="middle">100 KB</text>
    <text x="540" y="268" text-anchor="middle">1 MB</text>
  </g>
  <g stroke="currentColor" stroke-opacity="0.2">
    <line x1="164" y1="250" x2="164" y2="254"/><line x1="258" y1="250" x2="258" y2="254"/>
    <line x1="352" y1="250" x2="352" y2="254"/><line x1="446" y1="250" x2="446" y2="254"/>
    <line x1="540" y1="250" x2="540" y2="254"/>
  </g>
  <g class="muted">
    <text x="62" y="254" text-anchor="end">0</text>
    <text x="62" y="154" text-anchor="end">1.0</text>
    <text x="62" y="54" text-anchor="end">2.0</text>
  </g>

  <!-- ratio 1 -->
  <line x1="70" y1="150" x2="545" y2="150" stroke="currentColor" stroke-dasharray="3 3" stroke-opacity="0.5"/>
  <text class="muted" x="541" y="144" text-anchor="end">ratio 1: no compression</text>

  <!-- entropy rate -->
  <line x1="70" y1="222" x2="545" y2="222" stroke="currentColor" stroke-dasharray="3 3" stroke-opacity="0.5"/>
  <text class="muted" x="541" y="240" text-anchor="end">the source's entropy rate</text>

  <!-- model-based coder -->
  <line x1="70" y1="212" x2="545" y2="212" stroke="#4c8dd6" stroke-width="2"/>

  <!-- universal coder -->
  <path d="M 70 58 C 112 78, 134 120, 164 148 C 212 184, 258 200, 320 208 C 400 216, 470 220, 545 221"
        fill="none" stroke="#e2903a" stroke-width="2.2"/>
  <circle cx="164" cy="148" r="4" fill="#e2903a"/>
  <text class="amb" x="176" y="132">crosses 1 near a hundred bytes</text>

  <!-- legend, in the empty upper-right of the plot -->
  <rect x="352" y="58" width="12" height="3" fill="#e2903a"/>
  <text class="amb" x="372" y="64">universal coder: no model sent</text>
  <rect x="352" y="82" width="12" height="3" fill="#4c8dd6"/>
  <text class="blu" x="372" y="88">coder given the distribution</text>

  <text class="muted" x="80" y="76">expansion: the output is longer than the input</text>
</svg>

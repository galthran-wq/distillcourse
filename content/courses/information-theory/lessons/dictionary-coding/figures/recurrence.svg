<svg viewBox="0 0 600 260" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <style>
    .lbl { fill: currentColor; font-size: 12px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .amb { fill: #e2903a; font-size: 12px; }
    .blu { fill: #4c8dd6; font-size: 11px; }
  </style>

  <text class="lbl" x="20" y="24">occurrences of one block of probability q along a stationary sequence</text>

  <!-- the tape -->
  <rect x="30" y="70" width="500" height="30" rx="3" fill="none" stroke="currentColor" stroke-opacity="0.3"/>
  <g stroke="currentColor" stroke-opacity="0.12">
    <line x1="55" y1="70" x2="55" y2="100"/><line x1="80" y1="70" x2="80" y2="100"/>
    <line x1="105" y1="70" x2="105" y2="100"/><line x1="130" y1="70" x2="130" y2="100"/>
    <line x1="155" y1="70" x2="155" y2="100"/><line x1="180" y1="70" x2="180" y2="100"/>
    <line x1="205" y1="70" x2="205" y2="100"/><line x1="230" y1="70" x2="230" y2="100"/>
    <line x1="255" y1="70" x2="255" y2="100"/><line x1="280" y1="70" x2="280" y2="100"/>
    <line x1="305" y1="70" x2="305" y2="100"/><line x1="330" y1="70" x2="330" y2="100"/>
    <line x1="355" y1="70" x2="355" y2="100"/><line x1="380" y1="70" x2="380" y2="100"/>
    <line x1="405" y1="70" x2="405" y2="100"/><line x1="430" y1="70" x2="430" y2="100"/>
    <line x1="455" y1="70" x2="455" y2="100"/><line x1="480" y1="70" x2="480" y2="100"/>
    <line x1="505" y1="70" x2="505" y2="100"/>
  </g>

  <!-- occurrences of the block -->
  <rect x="55" y="70" width="25" height="30" fill="#e2903a"/>
  <rect x="155" y="70" width="25" height="30" fill="#e2903a"/>
  <rect x="205" y="70" width="25" height="30" fill="#e2903a"/>
  <rect x="330" y="70" width="25" height="30" fill="#e2903a"/>
  <rect x="480" y="70" width="25" height="30" fill="#e2903a"/>

  <text class="amb" x="30" y="62">the block, each time it occurs</text>
  <text class="muted" x="530" y="90">now</text>

  <!-- gaps -->
  <g stroke="#4c8dd6" stroke-width="1.2">
    <line x1="67" y1="118" x2="167" y2="118"/>
    <line x1="167" y1="118" x2="217" y2="118"/>
    <line x1="217" y1="118" x2="342" y2="118"/>
    <line x1="342" y1="118" x2="492" y2="118"/>
  </g>
  <g fill="#4c8dd6">
    <circle cx="67" cy="118" r="2.5"/><circle cx="167" cy="118" r="2.5"/>
    <circle cx="217" cy="118" r="2.5"/><circle cx="342" cy="118" r="2.5"/>
    <circle cx="492" cy="118" r="2.5"/>
  </g>
  <text class="blu" x="117" y="134" text-anchor="middle">100</text>
  <text class="blu" x="192" y="134" text-anchor="middle">50</text>
  <text class="blu" x="280" y="134" text-anchor="middle">125</text>
  <text class="blu" x="417" y="134" text-anchor="middle">150</text>
  <text class="blu" x="30" y="152">gaps between occurrences; Kac's lemma: they average 1/q</text>

  <!-- the pointer field -->
  <path d="M 492 160 L 492 178 L 250 178 L 250 190" fill="none" stroke="currentColor" stroke-opacity="0.4"/>
  <path d="M 246 182 L 250 191 L 254 182 Z" fill="currentColor" fill-opacity="0.4"/>
  <rect x="150" y="194" width="200" height="30" rx="3" fill="#e2903a"/>
  <text x="250" y="214" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">pointer ≈ log₂(1/q) bits</text>
  <text class="lbl" x="366" y="214">= the surprisal of the block</text>

  <text class="muted" x="20" y="248">Nothing is estimated: the distance the encoder measures is already the right code length.</text>
</svg>

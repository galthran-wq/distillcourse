<svg viewBox="0 0 600 268" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <style>
    .lbl { fill: currentColor; font-size: 12px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .fld { fill: #ffffff; font-size: 12px; font-weight: 600; }
    .amb { fill: #e2903a; font-size: 12px; }
  </style>

  <text class="lbl" x="20" y="24">one fixed-width match, at DEFLATE's window and match-length limits</text>

  <!-- field row: 14 px per bit -->
  <text class="muted" x="40" y="60">distance, 1…32768</text>
  <text class="muted" x="256" y="60">length, 3…258</text>
  <text class="muted" x="374" y="60">next literal byte</text>

  <rect x="40" y="68" width="210" height="34" rx="3" fill="#e2903a"/>
  <text class="fld" x="145" y="90" text-anchor="middle">15 bits</text>
  <rect x="252" y="68" width="112" height="34" rx="3" fill="#4c8dd6"/>
  <text class="fld" x="308" y="90" text-anchor="middle">8 bits</text>
  <rect x="366" y="68" width="112" height="34" rx="3" fill="currentColor" fill-opacity="0.35"/>
  <text class="lbl" x="422" y="90" text-anchor="middle">8 bits</text>
  <text class="amb" x="492" y="90">= 31 bits</text>

  <!-- comparison row: four literal bytes at the same 14 px per bit -->
  <text class="muted" x="40" y="140">what it retires: a length-3 match plus the trailing literal</text>
  <g>
    <rect x="40" y="148" width="110" height="34" rx="3" fill="none" stroke="currentColor" stroke-opacity="0.4"/>
    <text class="lbl" x="95" y="170" text-anchor="middle">8 bits</text>
    <rect x="152" y="148" width="110" height="34" rx="3" fill="none" stroke="currentColor" stroke-opacity="0.4"/>
    <text class="lbl" x="207" y="170" text-anchor="middle">8 bits</text>
    <rect x="264" y="148" width="110" height="34" rx="3" fill="none" stroke="currentColor" stroke-opacity="0.4"/>
    <text class="lbl" x="319" y="170" text-anchor="middle">8 bits</text>
    <rect x="376" y="148" width="110" height="34" rx="3" fill="none" stroke="currentColor" stroke-opacity="0.4"/>
    <text class="lbl" x="431" y="170" text-anchor="middle">8 bits</text>
  </g>
  <text class="lbl" x="500" y="170">= 32 bits</text>

  <line x1="486" y1="60" x2="486" y2="190" stroke="currentColor" stroke-dasharray="3 3" stroke-opacity="0.4"/>

  <text class="lbl" x="20" y="216">A match of length 3 retires four bytes, 32 bits, and beats the triple by one bit.</text>
  <text class="lbl" x="20" y="234">A match of length 2 retires three bytes, 24 bits, and loses to it by seven.</text>
  <text class="lbl" x="20" y="252">Hence DEFLATE's minimum match length of 3.</text>
</svg>

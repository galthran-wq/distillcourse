<svg viewBox="0 0 320 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <style>
    .lbl { fill: currentColor; font-size: 13px; }
    .muted { fill: currentColor; opacity: 0.6; font-size: 12px; }
    .amb { fill: #e2903a; font-size: 12px; }
    .blu { fill: #4c8dd6; font-size: 12px; }
  </style>

  <text class="lbl" x="12" y="20">gzip output, bytes</text>

  <line x1="20" y1="248" x2="308" y2="248" stroke="currentColor" stroke-opacity="0.4"/>

  <!-- scale: 60451 -> 160 px -->
  <text class="blu" x="80" y="46" text-anchor="middle">repeat inside</text>
  <text class="blu" x="80" y="60" text-anchor="middle">the 32 KB window</text>
  <rect x="40" y="230.3" width="34" height="17.7" rx="2" fill="#4c8dd6"/>
  <text class="blu" x="57" y="224" text-anchor="middle">6,687</text>
  <rect x="86" y="229.6" width="34" height="18.4" rx="2" fill="#4c8dd6"/>
  <text class="blu" x="103" y="224" text-anchor="middle">6,959</text>
  <text class="muted" x="57" y="264" text-anchor="middle">20 KB</text>
  <text class="muted" x="103" y="264" text-anchor="middle">×2</text>
  <text class="blu" x="80" y="284" text-anchor="middle">+272</text>

  <line x1="160" y1="40" x2="160" y2="256" stroke="currentColor" stroke-dasharray="3 3" stroke-opacity="0.3"/>

  <text class="amb" x="240" y="46" text-anchor="middle">repeat beyond it</text>
  <rect x="200" y="166.7" width="34" height="81.3" rx="2" fill="#e2903a"/>
  <text class="amb" x="217" y="160" text-anchor="middle">30,701</text>
  <rect x="246" y="88" width="34" height="160" rx="2" fill="#e2903a"/>
  <text class="amb" x="263" y="81" text-anchor="middle">60,451</text>
  <text class="muted" x="217" y="264" text-anchor="middle">100 KB</text>
  <text class="muted" x="263" y="264" text-anchor="middle">×2</text>
  <text class="amb" x="240" y="284" text-anchor="middle">+29,750</text>
</svg>

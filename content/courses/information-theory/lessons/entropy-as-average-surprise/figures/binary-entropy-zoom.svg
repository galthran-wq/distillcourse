<svg viewBox="0 0 640 384" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="14">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .axis { stroke: currentColor; stroke-width: 1.5; fill: none; }
    .tick { stroke: currentColor; stroke-width: 1; }
    .guide { stroke: currentColor; stroke-width: 1; stroke-dasharray: 4 4; opacity: 0.35; }
    .curve { stroke: #e2903a; stroke-width: 2.5; fill: none; stroke-linecap: round; }
    .tangent { stroke: #e2903a; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .mark { fill: #e2903a; }
    .accent-text { fill: #e2903a; font-weight: 600; }
  </style>

  <text class="label" x="100" y="28">H(p) bits</text>

  <!-- dashed guides to the marked point (0.99, 0.081) -->
  <line class="guide" x1="340" y1="274.8" x2="340" y2="320"/>
  <line class="guide" x1="160" y1="274.8" x2="340" y2="274.8"/>

  <!-- axes -->
  <line class="axis" x1="160" y1="320" x2="360" y2="320"/>
  <line class="axis" x1="160" y1="320" x2="160" y2="40"/>

  <!-- x ticks and labels -->
  <line class="tick" x1="160" y1="320" x2="160" y2="326"/>
  <line class="tick" x1="260" y1="320" x2="260" y2="326"/>
  <line class="tick" x1="360" y1="320" x2="360" y2="326"/>
  <text class="muted" x="160" y="342" text-anchor="middle">0.9</text>
  <text class="muted" x="260" y="342" text-anchor="middle">0.95</text>
  <text class="muted" x="360" y="342" text-anchor="middle">1</text>
  <text class="label" x="260" y="364" text-anchor="middle">p</text>

  <!-- y ticks and labels -->
  <line class="tick" x1="154" y1="320" x2="160" y2="320"/>
  <line class="tick" x1="154" y1="180" x2="160" y2="180"/>
  <line class="tick" x1="154" y1="40" x2="160" y2="40"/>
  <text class="muted" x="146" y="324" text-anchor="end">0</text>
  <text class="muted" x="146" y="184" text-anchor="end">0.25</text>
  <text class="muted" x="146" y="44" text-anchor="end">0.5</text>

  <!-- limiting tangent at the endpoint: vertical -->
  <line class="tangent" x1="360" y1="320" x2="360" y2="80"/>
  <text class="accent-text" x="372" y="96">tangent at p = 1: vertical</text>
  <text class="muted" x="372" y="114">H&#8242;(p) = log&#8322;((1&#8722;p)/p) &#8594; &#8722;&#8734;</text>

  <!-- H(p) on [0.9, 1] -->
  <path class="curve" d="M160,57.4 L170,66.3 L180,75.6 L190,85.1 L200,94.8 L210,104.8 L220,115.1 L230,125.7 L240,136.6 L250,147.9 L260,159.6 L270,171.7 L280,184.3 L290,197.4 L300,211.1 L310,225.6 L320,240.8 L330,257.1 L340,274.8 L345,284.3 L350,294.6 L355,305.9 L358,313.6 L359,316.5 L360,320"/>

  <!-- the 99/1 coin -->
  <circle class="mark" cx="340" cy="274.8" r="5"/>
  <text class="accent-text" x="330" y="268" text-anchor="end">H(0.99) &#8776; 0.081 bits</text>

  <text class="muted" x="320" y="380" text-anchor="middle">near p = 1 the curve is steep: 0.01 of mass away from certainty already buys 0.081 bits</text>
</svg>

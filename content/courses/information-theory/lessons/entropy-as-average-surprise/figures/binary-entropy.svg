<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="14">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .axis { stroke: currentColor; stroke-width: 1.5; fill: none; }
    .tick { stroke: currentColor; stroke-width: 1; }
    .guide { stroke: currentColor; stroke-width: 1; stroke-dasharray: 4 4; opacity: 0.35; }
    .curve { stroke: #e2903a; stroke-width: 2.5; fill: none; stroke-linecap: round; }
    .mark { fill: #e2903a; }
    .mark-open { fill: none; stroke: #e2903a; stroke-width: 2; }
    .accent-text { fill: #e2903a; font-weight: 600; }
  </style>

  <!-- dashed guides to the maximum -->
  <line class="guide" x1="340" y1="60" x2="340" y2="300"/>
  <line class="guide" x1="90" y1="60" x2="340" y2="60"/>

  <!-- axes -->
  <line class="axis" x1="90" y1="300" x2="600" y2="300"/>
  <line class="axis" x1="90" y1="300" x2="90" y2="45"/>

  <!-- x ticks and labels -->
  <line class="tick" x1="90" y1="300" x2="90" y2="306"/>
  <line class="tick" x1="340" y1="300" x2="340" y2="306"/>
  <line class="tick" x1="590" y1="300" x2="590" y2="306"/>
  <text class="muted" x="90" y="322" text-anchor="middle">0</text>
  <text class="muted" x="340" y="322" text-anchor="middle">0.5</text>
  <text class="muted" x="590" y="322" text-anchor="middle">1</text>
  <text class="label" x="345" y="345" text-anchor="middle">p</text>

  <!-- y ticks and labels -->
  <line class="tick" x1="84" y1="300" x2="90" y2="300"/>
  <line class="tick" x1="84" y1="180" x2="90" y2="180"/>
  <line class="tick" x1="84" y1="60" x2="90" y2="60"/>
  <text class="muted" x="76" y="304" text-anchor="end">0</text>
  <text class="muted" x="76" y="184" text-anchor="end">0.5</text>
  <text class="muted" x="76" y="64" text-anchor="end">1</text>
  <text class="label" x="40" y="36">H(p) bits</text>

  <!-- the curve H(p) = -p log2 p - (1-p) log2 (1-p) -->
  <path class="curve" d="M90.0,300.0 L91.0,295.0 L92.5,289.1 L95.0,280.6 L100.0,266.1 L105.0,253.3 L115.0,231.3 L125.0,212.2 L135.0,195.2 L140.0,187.4 L152.5,169.5 L165.0,153.6 L177.5,139.4 L190.0,126.7 L202.5,115.4 L215.0,105.3 L227.5,96.3 L240.0,88.5 L252.5,81.7 L265.0,75.8 L277.5,70.9 L290.0,67.0 L302.5,63.9 L315.0,61.7 L327.5,60.4 L340.0,60.0 L352.5,60.4 L365.0,61.7 L377.5,63.9 L390.0,67.0 L402.5,70.9 L415.0,75.8 L427.5,81.7 L440.0,88.5 L452.5,96.3 L465.0,105.3 L477.5,115.4 L490.0,126.7 L502.5,139.4 L515.0,153.6 L527.5,169.5 L540.0,187.4 L545.0,195.2 L555.0,212.2 L565.0,231.3 L575.0,253.3 L580.0,266.1 L585.0,280.6 L587.5,289.1 L589.0,295.0 L590.0,300.0"/>

  <!-- maximum at the fair coin -->
  <circle class="mark" cx="340" cy="60" r="5"/>
  <text class="accent-text" x="352" y="52">(0.5, 1 bit)</text>

  <!-- the 90/10 coin from the worked example -->
  <circle class="mark-open" cx="540" cy="187.4" r="5"/>
  <text class="accent-text" x="530" y="176" text-anchor="end">H(0.9) &#8776; 0.47</text>

  <text class="muted" x="345" y="359" text-anchor="middle">zero at certainty, maximal at the fair coin, steep near the endpoints</text>
</svg>

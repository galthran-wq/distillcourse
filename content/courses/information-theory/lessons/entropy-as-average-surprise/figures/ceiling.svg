<svg viewBox="0 0 360 270" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .uni   { fill: #e2903a; }
    .nonuni { fill: #4c8dd6; }
    .uni-text { fill: #e2903a; font-weight: 600; }
    .nonuni-text { fill: #4c8dd6; font-weight: 600; }
    .ceil  { stroke: currentColor; stroke-width: 1.5; stroke-dasharray: 3 3; opacity: 0.6; }
    .base  { stroke: currentColor; stroke-width: 1.2; }
  </style>

  <!-- legend -->
  <line class="ceil" x1="35" y1="24" x2="62" y2="24"/>
  <text class="muted" x="68" y="28">ceiling log&#8322; n</text>
  <rect class="uni" x="35" y="36" width="10" height="10" rx="2"/>
  <text class="muted" x="50" y="45">uniform</text>
  <rect class="nonuni" x="112" y="36" width="10" height="10" rx="2"/>
  <text class="muted" x="127" y="45">non-uniform</text>

  <!-- baseline -->
  <line class="base" x1="35" y1="225" x2="350" y2="225"/>

  <!-- coin: n = 2, H = 1, touches its ceiling -->
  <rect class="uni" x="50" y="201" width="40" height="24" rx="3"/>
  <line class="ceil" x1="44" y1="201" x2="96" y2="201"/>
  <text class="uni-text" x="70" y="193" text-anchor="middle">1</text>

  <!-- die: n = 6, H = log2 6 = 2.585, touches its ceiling -->
  <rect class="uni" x="125" y="163" width="40" height="62" rx="3"/>
  <line class="ceil" x1="119" y1="163" x2="171" y2="163"/>
  <text class="uni-text" x="145" y="155" text-anchor="middle">2.585</text>

  <!-- English letters: n = 27, H = 4.11 sits below the 4.75 ceiling -->
  <rect class="nonuni" x="200" y="126.4" width="40" height="98.6" rx="3"/>
  <line class="ceil" x1="194" y1="111" x2="246" y2="111"/>
  <text class="nonuni-text" x="196" y="130" text-anchor="end">4.11</text>
  <text class="muted" x="250" y="115">4.75</text>

  <!-- byte: n = 256, H = 8, touches its ceiling -->
  <rect class="uni" x="285" y="33" width="40" height="192" rx="3"/>
  <line class="ceil" x1="279" y1="33" x2="331" y2="33"/>
  <text class="uni-text" x="305" y="25" text-anchor="middle">8</text>

  <!-- names -->
  <text class="label" x="70" y="243" text-anchor="middle">coin</text>
  <text class="label" x="145" y="243" text-anchor="middle">die</text>
  <text class="label" x="220" y="243" text-anchor="middle">English</text>
  <text class="label" x="305" y="243" text-anchor="middle">byte</text>
  <text class="muted" x="70" y="259" text-anchor="middle">n = 2</text>
  <text class="muted" x="145" y="259" text-anchor="middle">n = 6</text>
  <text class="muted" x="220" y="259" text-anchor="middle">n = 27</text>
  <text class="muted" x="305" y="259" text-anchor="middle">n = 256</text>
</svg>

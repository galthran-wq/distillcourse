<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="14">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .p-bar { fill: #4c8dd6; }
    .h-text { fill: #e2903a; font-weight: 600; }
    .guide { stroke: currentColor; stroke-width: 1; stroke-dasharray: 3 3; opacity: 0.5; }
  </style>
  <text class="label" x="30" y="24" font-weight="600">Point mass: all the mass on A</text>
  <line class="guide" x1="90" y1="184" x2="570" y2="184"/>
  <text class="muted" x="84" y="188" text-anchor="end">1/4</text>
  <g transform="translate(60,44)">
    <text class="label" x="60" y="14" text-anchor="middle" font-weight="600">A</text>
    <text class="muted" x="60" y="32" text-anchor="middle">p = 1</text>
    <rect class="p-bar" x="44" y="50" width="32" height="120" rx="3"/>
  </g>
  <g transform="translate(200,44)">
    <text class="label" x="60" y="14" text-anchor="middle" font-weight="600">B</text>
    <text class="muted" x="60" y="32" text-anchor="middle">p = 0</text>
  </g>
  <g transform="translate(340,44)">
    <text class="label" x="60" y="14" text-anchor="middle" font-weight="600">C</text>
    <text class="muted" x="60" y="32" text-anchor="middle">p = 0</text>
  </g>
  <g transform="translate(480,44)">
    <text class="label" x="60" y="14" text-anchor="middle" font-weight="600">D</text>
    <text class="muted" x="60" y="32" text-anchor="middle">p = 0</text>
  </g>
  <line x1="70" y1="214" x2="590" y2="214" stroke="currentColor" stroke-width="1" opacity="0.35"/>
  <text class="h-text" x="320" y="262" text-anchor="middle" font-size="17">H = 0 bits</text>
  <text class="muted" x="320" y="286" text-anchor="middle">certainty: the only outcome that occurs has surprisal 0</text>
</svg>

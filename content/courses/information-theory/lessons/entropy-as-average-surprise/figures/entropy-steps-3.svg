<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="14">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .p-bar { fill: #4c8dd6; }
    .i-bar { fill: #e2903a; }
    .p-text { fill: #4c8dd6; font-weight: 600; }
    .i-text { fill: #e2903a; font-weight: 600; }
  </style>
  <text class="label" x="30" y="24" font-weight="600">Step 3: weight and sum</text>
  <g transform="translate(60,44)">
    <text class="label" x="60" y="14" text-anchor="middle" font-weight="600">A</text>
    <text class="muted" x="60" y="32" text-anchor="middle">p = 1/2</text>
    <rect class="p-bar" x="16" y="100" width="32" height="70" rx="3"/>
    <text class="p-text" x="32" y="188" text-anchor="middle" font-size="11">prob.</text>
    <rect class="i-bar" x="72" y="134" width="32" height="36" rx="3"/>
    <text class="i-text" x="88" y="188" text-anchor="middle" font-size="11">surprisal</text>
    <text class="i-text" x="60" y="212" text-anchor="middle" font-size="13">1 bit</text>
    <text x="60" y="236" text-anchor="middle" font-size="13"><tspan class="p-text">1/2</tspan><tspan class="label">·</tspan><tspan class="i-text">1</tspan><tspan class="label" dx="5">= 0.5</tspan></text>
  </g>
  <g transform="translate(200,44)">
    <text class="label" x="60" y="14" text-anchor="middle" font-weight="600">B</text>
    <text class="muted" x="60" y="32" text-anchor="middle">p = 1/4</text>
    <rect class="p-bar" x="16" y="135" width="32" height="35" rx="3"/>
    <text class="p-text" x="32" y="188" text-anchor="middle" font-size="11">prob.</text>
    <rect class="i-bar" x="72" y="98" width="32" height="72" rx="3"/>
    <text class="i-text" x="88" y="188" text-anchor="middle" font-size="11">surprisal</text>
    <text class="i-text" x="60" y="212" text-anchor="middle" font-size="13">2 bits</text>
    <text x="60" y="236" text-anchor="middle" font-size="13"><tspan class="p-text">1/4</tspan><tspan class="label">·</tspan><tspan class="i-text">2</tspan><tspan class="label" dx="5">= 0.5</tspan></text>
  </g>
  <g transform="translate(340,44)">
    <text class="label" x="60" y="14" text-anchor="middle" font-weight="600">C</text>
    <text class="muted" x="60" y="32" text-anchor="middle">p = 1/8</text>
    <rect class="p-bar" x="16" y="152.5" width="32" height="17.5" rx="3"/>
    <text class="p-text" x="32" y="188" text-anchor="middle" font-size="11">prob.</text>
    <rect class="i-bar" x="72" y="62" width="32" height="108" rx="3"/>
    <text class="i-text" x="88" y="188" text-anchor="middle" font-size="11">surprisal</text>
    <text class="i-text" x="60" y="212" text-anchor="middle" font-size="13">3 bits</text>
    <text x="60" y="236" text-anchor="middle" font-size="13"><tspan class="p-text">1/8</tspan><tspan class="label">·</tspan><tspan class="i-text">3</tspan><tspan class="label" dx="5">= 0.375</tspan></text>
  </g>
  <g transform="translate(480,44)">
    <text class="label" x="60" y="14" text-anchor="middle" font-weight="600">D</text>
    <text class="muted" x="60" y="32" text-anchor="middle">p = 1/8</text>
    <rect class="p-bar" x="16" y="152.5" width="32" height="17.5" rx="3"/>
    <text class="p-text" x="32" y="188" text-anchor="middle" font-size="11">prob.</text>
    <rect class="i-bar" x="72" y="62" width="32" height="108" rx="3"/>
    <text class="i-text" x="88" y="188" text-anchor="middle" font-size="11">surprisal</text>
    <text class="i-text" x="60" y="212" text-anchor="middle" font-size="13">3 bits</text>
    <text x="60" y="236" text-anchor="middle" font-size="13"><tspan class="p-text">1/8</tspan><tspan class="label">·</tspan><tspan class="i-text">3</tspan><tspan class="label" dx="5">= 0.375</tspan></text>
  </g>
  <line x1="70" y1="214" x2="590" y2="214" stroke="currentColor" stroke-width="1" opacity="0.35"/>
  <text class="label" x="320" y="304" text-anchor="middle" font-size="16">H = 0.5 + 0.5 + 0.375 + 0.375 = 1.75 bits</text>
  <text class="muted" x="320" y="322" text-anchor="middle">each surprisal (orange) weighted by its probability (blue), then summed</text>
</svg>

<svg viewBox="0 0 640 292" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 10px; }
    .title { fill: currentColor; font-size: 12px; font-weight: 600; }
    .p-bar { fill: #4c8dd6; }
    .base  { stroke: currentColor; stroke-width: 1.2; opacity: 0.6; }
    .zero  { stroke: currentColor; stroke-width: 2.5; opacity: 0.35; }
    .h-text { fill: #e2903a; font-weight: 600; font-size: 15px; }
  </style>

  <!-- panel 1: one outcome impossible -->
  <g transform="translate(15,0)">
    <text class="title" x="92" y="22" text-anchor="middle">one outcome impossible</text>
    <rect class="p-bar" x="25"  y="115"   width="26" height="95"   rx="3"/>
    <rect class="p-bar" x="61"  y="162.5" width="26" height="47.5" rx="3"/>
    <rect class="p-bar" x="97"  y="162.5" width="26" height="47.5" rx="3"/>
    <line class="zero" x1="135" y1="210" x2="157" y2="210"/>
    <line class="base" x1="18" y1="210" x2="166" y2="210"/>
    <text class="muted" x="38"  y="224" text-anchor="middle">.50</text>
    <text class="muted" x="74"  y="224" text-anchor="middle">.25</text>
    <text class="muted" x="110" y="224" text-anchor="middle">.25</text>
    <text class="muted" x="146" y="224" text-anchor="middle">0</text>
    <text class="label" x="38"  y="240" text-anchor="middle">A</text>
    <text class="label" x="74"  y="240" text-anchor="middle">B</text>
    <text class="label" x="110" y="240" text-anchor="middle">C</text>
    <text class="label" x="146" y="240" text-anchor="middle">D</text>
    <text class="h-text" x="92" y="266" text-anchor="middle">H = 1.50 bits</text>
  </g>

  <!-- panel 2: two heavy, two rare -->
  <g transform="translate(230,0)">
    <text class="title" x="92" y="22" text-anchor="middle">two heavy, two rare</text>
    <rect class="p-bar" x="25"  y="125.5" width="26" height="84.5" rx="3"/>
    <rect class="p-bar" x="61"  y="125.5" width="26" height="84.5" rx="3"/>
    <rect class="p-bar" x="97"  y="199.5" width="26" height="10.5" rx="3"/>
    <rect class="p-bar" x="133" y="199.5" width="26" height="10.5" rx="3"/>
    <line class="base" x1="18" y1="210" x2="166" y2="210"/>
    <text class="muted" x="38"  y="224" text-anchor="middle">.445</text>
    <text class="muted" x="74"  y="224" text-anchor="middle">.445</text>
    <text class="muted" x="110" y="224" text-anchor="middle">.055</text>
    <text class="muted" x="146" y="224" text-anchor="middle">.055</text>
    <text class="label" x="38"  y="240" text-anchor="middle">A</text>
    <text class="label" x="74"  y="240" text-anchor="middle">B</text>
    <text class="label" x="110" y="240" text-anchor="middle">C</text>
    <text class="label" x="146" y="240" text-anchor="middle">D</text>
    <text class="h-text" x="92" y="266" text-anchor="middle">H = 1.50 bits</text>
  </g>

  <!-- panel 3: one dominant -->
  <g transform="translate(445,0)">
    <text class="title" x="92" y="22" text-anchor="middle">one dominant</text>
    <rect class="p-bar" x="25"  y="88.4"  width="26" height="121.6" rx="3"/>
    <rect class="p-bar" x="61"  y="179.6" width="26" height="30.4"  rx="3"/>
    <rect class="p-bar" x="97"  y="191"   width="26" height="19"    rx="3"/>
    <rect class="p-bar" x="133" y="191"   width="26" height="19"    rx="3"/>
    <line class="base" x1="18" y1="210" x2="166" y2="210"/>
    <text class="muted" x="38"  y="224" text-anchor="middle">.64</text>
    <text class="muted" x="74"  y="224" text-anchor="middle">.16</text>
    <text class="muted" x="110" y="224" text-anchor="middle">.10</text>
    <text class="muted" x="146" y="224" text-anchor="middle">.10</text>
    <text class="label" x="38"  y="240" text-anchor="middle">A</text>
    <text class="label" x="74"  y="240" text-anchor="middle">B</text>
    <text class="label" x="110" y="240" text-anchor="middle">C</text>
    <text class="label" x="146" y="240" text-anchor="middle">D</text>
    <text class="h-text" x="92" y="266" text-anchor="middle">H = 1.50 bits</text>
  </g>

  <text class="muted" x="320" y="286" text-anchor="middle" font-size="11">
    three shapes, one entropy: H fixes neither the support size nor the probabilities
  </text>
</svg>

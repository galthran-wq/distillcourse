<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="14">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .p-bar { fill: #4c8dd6; }
    .i-bar { fill: #e2903a; }
    .p-text { fill: #4c8dd6; font-weight: 600; }
    .i-text { fill: #e2903a; font-weight: 600; }
  </style>

  <!-- column: sunny -->
  <g transform="translate(60,20)">
    <text class="label" x="60" y="14" text-anchor="middle" font-weight="600">Sunny</text>
    <text class="muted" x="60" y="32" text-anchor="middle">p = 1/2</text>
    <rect class="p-bar" x="20" y="90" width="34" height="70" rx="3"/>
    <rect class="i-bar" x="66" y="125" width="34" height="35" rx="3"/>
    <text class="muted" x="37" y="180" text-anchor="middle">prob.</text>
    <text class="muted" x="83" y="180" text-anchor="middle">surprisal</text>
    <text class="muted" x="60" y="205" text-anchor="middle">1 bit</text>
  </g>

  <!-- column: cloudy -->
  <g transform="translate(260,20)">
    <text class="label" x="60" y="14" text-anchor="middle" font-weight="600">Cloudy</text>
    <text class="muted" x="60" y="32" text-anchor="middle">p = 1/4</text>
    <rect class="p-bar" x="20" y="125" width="34" height="35" rx="3"/>
    <rect class="i-bar" x="66" y="90" width="34" height="70" rx="3"/>
    <text class="muted" x="37" y="180" text-anchor="middle">prob.</text>
    <text class="muted" x="83" y="180" text-anchor="middle">surprisal</text>
    <text class="muted" x="60" y="205" text-anchor="middle">2 bits</text>
  </g>

  <!-- column: rainy -->
  <g transform="translate(460,20)">
    <text class="label" x="60" y="14" text-anchor="middle" font-weight="600">Rainy</text>
    <text class="muted" x="60" y="32" text-anchor="middle">p = 1/4</text>
    <rect class="p-bar" x="20" y="125" width="34" height="35" rx="3"/>
    <rect class="i-bar" x="66" y="90" width="34" height="70" rx="3"/>
    <text class="muted" x="37" y="180" text-anchor="middle">prob.</text>
    <text class="muted" x="83" y="180" text-anchor="middle">surprisal</text>
    <text class="muted" x="60" y="205" text-anchor="middle">2 bits</text>
  </g>

  <!-- weighted-sum formula -->
  <text class="label" x="320" y="255" text-anchor="middle" font-size="16">
    H = <tspan class="p-text">1/2</tspan>&#183;<tspan class="i-text">1</tspan>
    + <tspan class="p-text">1/4</tspan>&#183;<tspan class="i-text">2</tspan>
    + <tspan class="p-text">1/4</tspan>&#183;<tspan class="i-text">2</tspan>
    = 1.5 bits per day
  </text>
  <text class="muted" x="320" y="280" text-anchor="middle">each surprisal (orange) weighted by its probability (blue)</text>
</svg>

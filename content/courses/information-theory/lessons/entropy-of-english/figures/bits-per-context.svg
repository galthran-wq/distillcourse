<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; font-size: 12px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .axis  { stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.2; fill: none; }
    .guide { stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
    .solid { stroke: #e2903a; stroke-width: 2.5; fill: none; }
    .dash  { stroke: #e2903a; stroke-width: 2; stroke-dasharray: 5 4; fill: none; }
    .dot   { fill: #e2903a; }
    .open  { fill: none; stroke: #e2903a; stroke-width: 2; }
    .amber { fill: #e2903a; font-size: 12px; font-weight: 600; }
    .blue  { stroke: #4c8dd6; stroke-width: 2.5; fill: none; }
    .bluet { fill: #4c8dd6; font-size: 12px; font-weight: 600; }
  </style>

  <!-- axes -->
  <path class="axis" d="M70 270 L580 270"/>
  <path class="axis" d="M70 270 L70 36"/>
  <text class="muted" x="62" y="274" text-anchor="end">0</text>
  <text class="muted" x="62" y="228" text-anchor="end">1</text>
  <text class="muted" x="62" y="182" text-anchor="end">2</text>
  <text class="muted" x="62" y="136" text-anchor="end">3</text>
  <text class="muted" x="62" y="90" text-anchor="end">4</text>
  <text class="muted" x="62" y="44" text-anchor="end">5</text>
  <text class="muted" x="34" y="30">bits per letter</text>
  <path class="axis" d="M65 224 L70 224 M65 178 L70 178 M65 132 L70 132 M65 86 L70 86 M65 40 L70 40"/>

  <!-- x ticks -->
  <path class="axis" d="M90 270 L90 275 M130 270 L130 275 M170 270 L170 275 M210 270 L210 275 M250 270 L250 275 M290 270 L290 275 M450 270 L450 275"/>
  <text class="muted" x="90" y="290" text-anchor="middle">0</text>
  <text class="muted" x="130" y="290" text-anchor="middle">1</text>
  <text class="muted" x="170" y="290" text-anchor="middle">2</text>
  <text class="muted" x="210" y="290" text-anchor="middle">3</text>
  <text class="muted" x="250" y="290" text-anchor="middle">4</text>
  <text class="muted" x="290" y="290" text-anchor="middle">5</text>
  <text class="muted" x="450" y="290" text-anchor="middle">99</text>
  <text class="muted" x="325" y="312" text-anchor="middle">letters of context known</text>

  <!-- axis break -->
  <path class="axis" d="M352 278 L364 262 M362 278 L374 262"/>

  <!-- the 1-bit guide -->
  <path class="guide" d="M70 224 L560 224"/>
  <text class="muted" x="100" y="218">entropy rate: of order 1 bit</text>

  <!-- computed rungs -->
  <path class="solid" d="M90 51 L130 85 L170 117 L210 127"/>
  <path class="dash" d="M210 127 L250 152 L290 172 L340 200"/>
  <path class="dash" d="M386 214 L450 226"/>

  <circle class="dot" cx="90" cy="51" r="4.5"/>
  <circle class="dot" cx="130" cy="85" r="4.5"/>
  <circle class="dot" cx="170" cy="117" r="4.5"/>
  <circle class="dot" cx="210" cy="127" r="4.5"/>
  <circle class="open" cx="290" cy="172" r="4.5"/>

  <text class="amber" x="98" y="44">4.76</text>
  <text class="amber" x="138" y="78">4.03</text>
  <text class="amber" x="178" y="110">3.32</text>
  <text class="amber" x="218" y="118">3.10</text>
  <text class="amber" x="302" y="160">2.14</text>
  <text class="muted" x="336" y="160">from word statistics</text>

  <!-- measured bounds at 99 letters -->
  <path class="blue" d="M450 210 L450 242 M442 210 L458 210 M442 242 L458 242"/>
  <text class="bluet" x="466" y="212">1.3</text>
  <text class="bluet" x="466" y="246">0.6</text>
  <text class="muted" x="450" y="196" text-anchor="middle">guessing game</text>

  <text class="muted" x="88" y="254">rungs computed from frequency tables</text>
</svg>

<svg viewBox="0 0 620 260" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="14">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .cell { fill: none; stroke: currentColor; stroke-width: 1.5; opacity: 0.35; }
    .cell-done { fill: none; stroke: currentColor; stroke-width: 1.5; }
    .cell-now { fill: none; stroke: #e2903a; stroke-width: 2; }
    .letter { fill: currentColor; font-size: 20px; font-weight: 600; }
    .letter-now { fill: #e2903a; font-size: 20px; font-weight: 600; }
    .wrong { fill: currentColor; opacity: 0.55; font-size: 13px; }
    .hit { fill: #5aa46a; font-size: 13px; font-weight: 600; }
    .tally-cell { fill: none; stroke: currentColor; stroke-width: 1; opacity: 0.35; }
    .tally { fill: currentColor; font-size: 14px; font-weight: 600; }
    .tally-now { fill: #e2903a; font-size: 14px; font-weight: 600; }
  </style>
  <text class="label" x="30" y="28" font-weight="600">Position 3: context IT</text>

  <!-- letter boxes -->
  <rect class="cell-done" x="40" y="52" width="48" height="48" rx="6"/>
  <rect class="cell-done" x="104" y="52" width="48" height="48" rx="6"/>
  <rect class="cell-now" x="168" y="52" width="48" height="48" rx="6"/>
  <rect class="cell" x="232" y="52" width="48" height="48" rx="6"/>
  <rect class="cell" x="296" y="52" width="48" height="48" rx="6"/>
  <text class="letter" x="64" y="86" text-anchor="middle">I</text>
  <text class="letter" x="128" y="86" text-anchor="middle">T</text>
  <text class="letter-now" x="192" y="86" text-anchor="middle">&#9251;</text>

  <!-- position numbers -->
  <text class="muted" x="64" y="120" text-anchor="middle">1</text>
  <text class="muted" x="128" y="120" text-anchor="middle">2</text>
  <text class="muted" x="192" y="120" text-anchor="middle">3</text>
  <text class="muted" x="256" y="120" text-anchor="middle">4</text>
  <text class="muted" x="320" y="120" text-anchor="middle">5</text>

  <!-- guess panel -->
  <text class="muted" x="420" y="56">guesses until correct</text>
  <text class="hit" x="420" y="84">1&#160;&#160;&#9251; (space)&#160;&#160;&#10003;</text>

  <!-- tally row -->
  <text class="muted" x="40" y="176">guesses per position</text>
  <rect class="tally-cell" x="40" y="186" width="48" height="30" rx="3"/>
  <rect class="tally-cell" x="104" y="186" width="48" height="30" rx="3"/>
  <rect class="tally-cell" x="168" y="186" width="48" height="30" rx="3"/>
  <rect class="tally-cell" x="232" y="186" width="48" height="30" rx="3"/>
  <rect class="tally-cell" x="296" y="186" width="48" height="30" rx="3"/>
  <text class="tally" x="64" y="207" text-anchor="middle">4</text>
  <text class="tally" x="128" y="207" text-anchor="middle">2</text>
  <text class="tally-now" x="192" y="207" text-anchor="middle">1</text>
</svg>

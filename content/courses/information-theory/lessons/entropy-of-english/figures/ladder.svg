<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .sym   { fill: currentColor; font-size: 14px; font-weight: 600; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .axis  { stroke: currentColor; stroke-opacity: 0.55; stroke-width: 1.2; fill: none; }
    .bar   { fill: #e2903a; }
    .band  { fill: #4c8dd6; fill-opacity: 0.35; stroke: #4c8dd6; stroke-width: 1.5; }
    .in    { fill: #241a0c; font-size: 12px; }
    .inval { fill: #241a0c; font-size: 12px; font-weight: 700; }
    .bval  { fill: #4c8dd6; font-size: 12px; font-weight: 700; }
  </style>

  <!-- F0 -->
  <text class="sym" x="70" y="52" text-anchor="end">F&#8320;</text>
  <rect class="bar" x="80" y="34" width="514" height="26" rx="3"/>
  <text class="in" x="88" y="52">nothing &#8212; 27 equiprobable symbols</text>
  <text class="inval" x="586" y="52" text-anchor="end">4.76</text>

  <!-- F1 -->
  <text class="sym" x="70" y="94" text-anchor="end">F&#8321;</text>
  <rect class="bar" x="80" y="76" width="435" height="26" rx="3"/>
  <text class="in" x="88" y="94">letter frequencies</text>
  <text class="inval" x="507" y="94" text-anchor="end">4.03</text>

  <!-- F2 -->
  <text class="sym" x="70" y="136" text-anchor="end">F&#8322;</text>
  <rect class="bar" x="80" y="118" width="359" height="26" rx="3"/>
  <text class="in" x="88" y="136">1 preceding letter (digrams)</text>
  <text class="inval" x="431" y="136" text-anchor="end">3.32</text>

  <!-- F3 -->
  <text class="sym" x="70" y="178" text-anchor="end">F&#8323;</text>
  <rect class="bar" x="80" y="160" width="335" height="26" rx="3"/>
  <text class="in" x="88" y="178">2 preceding letters (trigrams)</text>
  <text class="inval" x="407" y="178" text-anchor="end">3.10</text>

  <!-- F_word -->
  <text class="sym" x="70" y="220" text-anchor="end">F<tspan font-size="11">word</tspan></text>
  <rect class="bar" x="80" y="202" width="231" height="26" rx="3"/>
  <text class="in" x="88" y="220">word frequencies (Zipf fit)</text>
  <text class="inval" x="303" y="220" text-anchor="end">2.14</text>

  <!-- F_100 band -->
  <text class="sym" x="70" y="262" text-anchor="end">F<tspan font-size="11">100</tspan></text>
  <rect class="band" x="145" y="244" width="75" height="26" rx="3"/>
  <text class="bval" x="228" y="262">0.6 &#8211; 1.3</text>
  <text class="muted" x="292" y="262">99 preceding letters (guessing game)</text>

  <!-- axis -->
  <path class="axis" d="M80 282 L620 282"/>
  <path class="axis" d="M80 282 L80 287 M188 282 L188 287 M296 282 L296 287 M404 282 L404 287 M512 282 L512 287 M620 282 L620 287"/>
  <text class="muted" x="80" y="300" text-anchor="middle">0</text>
  <text class="muted" x="188" y="300" text-anchor="middle">1</text>
  <text class="muted" x="296" y="300" text-anchor="middle">2</text>
  <text class="muted" x="404" y="300" text-anchor="middle">3</text>
  <text class="muted" x="512" y="300" text-anchor="middle">4</text>
  <text class="muted" x="620" y="300" text-anchor="middle">5</text>
  <text class="muted" x="350" y="320" text-anchor="middle">bits per letter, 27-symbol alphabet</text>
</svg>

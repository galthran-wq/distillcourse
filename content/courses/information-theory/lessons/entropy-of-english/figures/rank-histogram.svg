<svg viewBox="0 0 560 310" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .axis  { stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.2; fill: none; }
    .bar   { fill: #e2903a; }
    .val   { fill: currentColor; font-size: 12px; font-weight: 600; }
    .blue  { fill: #4c8dd6; font-size: 12px; font-weight: 600; }
    .ptr   { stroke: #4c8dd6; stroke-width: 1; fill: none; }
    .empty { fill: none; stroke: currentColor; stroke-opacity: 0.35; stroke-width: 1; stroke-dasharray: 3 3; }
  </style>

  <!-- axes -->
  <path class="axis" d="M70 250 L520 250"/>
  <path class="axis" d="M70 250 L70 50"/>
  <path class="axis" d="M65 250 L70 250 M65 193 L70 193 M65 136 L70 136 M65 79 L70 79"/>
  <text class="muted" x="60" y="254" text-anchor="end">0</text>
  <text class="muted" x="60" y="197" text-anchor="end">0.2</text>
  <text class="muted" x="60" y="140" text-anchor="end">0.4</text>
  <text class="muted" x="60" y="83" text-anchor="end">0.6</text>
  <text class="muted" x="26" y="42">fraction of positions</text>

  <!-- bars -->
  <rect class="bar" x="90"  y="64"  width="44" height="186" rx="3"/>
  <rect class="bar" x="150" y="207" width="44" height="43"  rx="3"/>
  <rect class="bar" x="210" y="221" width="44" height="29"  rx="3"/>
  <rect class="bar" x="270" y="236" width="44" height="14"  rx="3"/>
  <rect class="bar" x="330" y="243" width="44" height="7"   rx="2"/>
  <rect class="bar" x="390" y="243" width="44" height="7"   rx="2"/>
  <rect class="empty" x="450" y="240" width="44" height="10" rx="2"/>

  <text class="val" x="112" y="56"  text-anchor="middle">.65</text>
  <text class="val" x="172" y="199" text-anchor="middle">.15</text>
  <text class="val" x="232" y="213" text-anchor="middle">.10</text>
  <text class="val" x="292" y="228" text-anchor="middle">.05</text>
  <text class="val" x="352" y="235" text-anchor="middle">.025</text>
  <text class="val" x="412" y="235" text-anchor="middle">.025</text>
  <text class="muted" x="472" y="232" text-anchor="middle">0</text>

  <!-- rank-1 callout -->
  <path class="ptr" d="M138 90 L188 90"/>
  <text class="blue" x="194" y="86">26 of 40 letters</text>
  <text class="blue" x="194" y="102">taken on the first guess</text>

  <!-- x labels -->
  <text class="muted" x="112" y="268" text-anchor="middle">1</text>
  <text class="muted" x="172" y="268" text-anchor="middle">2</text>
  <text class="muted" x="232" y="268" text-anchor="middle">3</text>
  <text class="muted" x="292" y="268" text-anchor="middle">4</text>
  <text class="muted" x="352" y="268" text-anchor="middle">5</text>
  <text class="muted" x="412" y="268" text-anchor="middle">6</text>
  <text class="muted" x="472" y="268" text-anchor="middle">7+</text>
  <text class="muted" x="295" y="292" text-anchor="middle">guess rank i</text>
</svg>

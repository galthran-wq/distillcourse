<svg viewBox="0 0 420 250" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .box   { fill: none; stroke: currentColor; stroke-opacity: 0.55; stroke-width: 1.4; }
    .rank  { fill: none; stroke: #e2903a; stroke-width: 2; }
    .txt   { fill: currentColor; font-size: 14px; font-weight: 600; letter-spacing: 2px; }
    .amb   { fill: #e2903a; font-size: 14px; font-weight: 600; letter-spacing: 2px; }
    .arrow { stroke: currentColor; stroke-opacity: 0.7; stroke-width: 1.4; fill: none; }
    .link  { stroke: currentColor; stroke-opacity: 0.45; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="currentColor" fill-opacity="0.7"/>
    </marker>
  </defs>

  <!-- encode row -->
  <text class="muted" x="20" y="30">text</text>
  <rect class="box" x="20" y="38" width="96" height="34" rx="4"/>
  <text class="txt" x="68" y="61" text-anchor="middle">IT&#9251;IS</text>

  <path class="arrow" d="M120 55 L150 55" marker-end="url(#ah)"/>

  <rect class="box" x="156" y="38" width="94" height="34" rx="4"/>
  <text class="muted" x="203" y="59" text-anchor="middle" font-size="12">predictor</text>

  <path class="arrow" d="M254 55 L284 55" marker-end="url(#ah)"/>

  <text class="muted" x="290" y="30">reduced text</text>
  <rect class="rank" x="290" y="38" width="110" height="34" rx="4"/>
  <text class="amb" x="345" y="61" text-anchor="middle">4 2 1 2 1</text>

  <!-- decode row -->
  <text class="muted" x="20" y="170">reduced text</text>
  <rect class="rank" x="20" y="178" width="110" height="34" rx="4"/>
  <text class="amb" x="75" y="201" text-anchor="middle">4 2 1 2 1</text>

  <path class="arrow" d="M134 195 L164 195" marker-end="url(#ah)"/>

  <rect class="box" x="170" y="178" width="94" height="34" rx="4"/>
  <text class="muted" x="217" y="199" text-anchor="middle" font-size="12">predictor</text>

  <path class="arrow" d="M268 195 L298 195" marker-end="url(#ah)"/>

  <text class="muted" x="304" y="170">text</text>
  <rect class="box" x="304" y="178" width="96" height="34" rx="4"/>
  <text class="txt" x="352" y="201" text-anchor="middle">IT&#9251;IS</text>

  <!-- the shared model -->
  <path class="link" d="M203 76 L203 110 L217 110 L217 174"/>
  <text class="muted" x="228" y="114">one model, both directions</text>

  <text class="muted" x="20" y="240">ranks are the only thing that crosses; the text is rebuilt, not transmitted</text>
</svg>

<svg viewBox="0 0 640 270" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; font-size: 13px; font-weight: 600; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .axis  { stroke: currentColor; stroke-opacity: 0.55; stroke-width: 1.2; fill: none; }
    .slot  { fill: currentColor; fill-opacity: 0.10; stroke: currentColor; stroke-opacity: 0.45; stroke-width: 1; }
    .info  { fill: #e2903a; }
    .in    { fill: #241a0c; font-size: 11px; font-weight: 700; }
    .red   { fill: currentColor; opacity: 0.75; font-size: 12px; }
  </style>

  <!-- top bar: fixed-width 27-symbol code -->
  <text class="label" x="90" y="40">fixed-width code, 27 symbols: 4.76 bits per letter</text>
  <rect class="slot" x="90" y="50" width="310" height="34" rx="3"/>
  <rect class="info" x="90" y="50" width="78" height="34" rx="3"/>
  <text class="in" x="96" y="71">1.2</text>
  <text class="red" x="180" y="71">redundancy &#8776; 75%</text>

  <!-- bottom bar: ASCII -->
  <text class="label" x="90" y="118">ASCII: 8 bits per letter</text>
  <rect class="slot" x="90" y="128" width="520" height="34" rx="3"/>
  <rect class="info" x="90" y="128" width="78" height="34" rx="3"/>
  <text class="in" x="96" y="149">1.2</text>
  <text class="red" x="180" y="149">redundancy &#8776; 85% &#8212; the same 1.2 bits in a wider slot</text>

  <!-- axis -->
  <path class="axis" d="M90 190 L610 190"/>
  <path class="axis" d="M90 190 L90 195 M220 190 L220 195 M350 190 L350 195 M480 190 L480 195 M610 190 L610 195"/>
  <text class="muted" x="90" y="208" text-anchor="middle">0</text>
  <text class="muted" x="220" y="208" text-anchor="middle">2</text>
  <text class="muted" x="350" y="208" text-anchor="middle">4</text>
  <text class="muted" x="480" y="208" text-anchor="middle">6</text>
  <text class="muted" x="610" y="208" text-anchor="middle">8</text>
  <text class="muted" x="350" y="230" text-anchor="middle">bits spent per letter</text>

  <text class="muted" x="90" y="256">amber = the 1.2 bits actually carried; the rest is removable without loss</text>
</svg>

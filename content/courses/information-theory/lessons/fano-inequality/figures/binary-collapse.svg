<svg viewBox="0 0 500 262" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- forbidden strip: Pe below 0.11 with H(X|Y) = 0.5 -->
  <rect x="60" y="120" width="42" height="80" fill="#4c8dd6" opacity="0.15"/>

  <!-- binary entropy curve, x = 60 + 380 p, y = 200 - 160 h -->
  <path d="M 60 200 L 79 154.2 L 102 120 L 136 84.5 L 174 58.9 L 212 44.6 L 250 40 L 288 44.6 L 326 58.9 L 364 84.5 L 398 120 L 421 154.2 L 440 200"
        fill="none" stroke="#e2903a" stroke-width="1.8"/>

  <!-- axes -->
  <line x1="60" y1="200" x2="460" y2="200" stroke="currentColor" stroke-width="1"/>
  <line x1="60" y1="200" x2="60" y2="30" stroke="currentColor" stroke-width="1"/>

  <line x1="60" y1="200" x2="60" y2="205" stroke="currentColor" stroke-width="1"/>
  <line x1="155" y1="200" x2="155" y2="205" stroke="currentColor" stroke-width="1"/>
  <line x1="250" y1="200" x2="250" y2="205" stroke="currentColor" stroke-width="1"/>
  <line x1="345" y1="200" x2="345" y2="205" stroke="currentColor" stroke-width="1"/>
  <line x1="440" y1="200" x2="440" y2="205" stroke="currentColor" stroke-width="1"/>
  <text x="60" y="218" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">0</text>
  <text x="155" y="218" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">0.25</text>
  <text x="250" y="218" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">0.5</text>
  <text x="345" y="218" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">0.75</text>
  <text x="440" y="218" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">1</text>
  <text x="250" y="238" text-anchor="middle" font-size="12" fill="currentColor">error probability P<tspan font-size="9" dy="3">e</tspan></text>

  <line x1="55" y1="200" x2="60" y2="200" stroke="currentColor" stroke-width="1"/>
  <line x1="55" y1="120" x2="60" y2="120" stroke="currentColor" stroke-width="1"/>
  <line x1="55" y1="40" x2="60" y2="40" stroke="currentColor" stroke-width="1"/>
  <text x="50" y="204" text-anchor="end" font-size="11" fill="currentColor" opacity="0.55">0</text>
  <text x="50" y="124" text-anchor="end" font-size="11" fill="currentColor" opacity="0.55">0.5</text>
  <text x="50" y="44" text-anchor="end" font-size="11" fill="currentColor" opacity="0.55">1</text>
  <text x="52" y="38" font-size="12" fill="currentColor">H(X | Y), bits</text>

  <!-- the 0.5-bit level -->
  <line x1="60" y1="120" x2="440" y2="120" stroke="currentColor" stroke-width="1" stroke-dasharray="3 3" opacity="0.6"/>
  <circle cx="102" cy="120" r="4" fill="#e2903a"/>
  <circle cx="398" cy="120" r="4" fill="#e2903a"/>
  <text x="102" y="112" text-anchor="middle" font-size="12" fill="#e2903a">0.11</text>
  <text x="398" y="112" text-anchor="middle" font-size="12" fill="#e2903a">0.89</text>

  <text x="81" y="256" text-anchor="middle" font-size="11" fill="#4c8dd6">no decoder</text>
  <text x="250" y="72" text-anchor="middle" font-size="12" fill="#e2903a">the binary entropy curve H<tspan font-size="9" dy="3">2</tspan><tspan dy="-3">(P</tspan><tspan font-size="9" dy="3">e</tspan><tspan dy="-3">)</tspan></text>
  <text x="250" y="16" text-anchor="middle" font-size="12" fill="currentColor">two symbols: the log(|X| &#8722; 1) term is zero and the bound is the curve itself</text>
</svg>

<svg viewBox="0 0 480 250" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="20" y="18" font-size="12" fill="currentColor">p(x | Y = 2), the posterior a decoder faces</text>

  <!-- bars: baseline y = 190, 200 px per unit probability -->
  <rect x="60" y="170" width="46" height="20" rx="3" fill="#4c8dd6" opacity="0.85"/>
  <text x="83" y="163" text-anchor="middle" font-size="12" fill="#4c8dd6">0.1</text>
  <text x="83" y="208" text-anchor="middle" font-size="12" fill="currentColor">x = 1</text>

  <rect x="150" y="50" width="46" height="140" rx="3" fill="#e2903a" opacity="0.85"/>
  <text x="173" y="44" text-anchor="middle" font-size="12" fill="#e2903a">0.7</text>
  <text x="173" y="208" text-anchor="middle" font-size="12" fill="currentColor">x = 2</text>

  <rect x="240" y="170" width="46" height="20" rx="3" fill="#4c8dd6" opacity="0.85"/>
  <text x="263" y="163" text-anchor="middle" font-size="12" fill="#4c8dd6">0.1</text>
  <text x="263" y="208" text-anchor="middle" font-size="12" fill="currentColor">x = 3</text>

  <rect x="330" y="170" width="46" height="20" rx="3" fill="#4c8dd6" opacity="0.85"/>
  <text x="353" y="163" text-anchor="middle" font-size="12" fill="#4c8dd6">0.1</text>
  <text x="353" y="208" text-anchor="middle" font-size="12" fill="currentColor">x = 4</text>

  <line x1="50" y1="190" x2="390" y2="190" stroke="currentColor" stroke-width="1"/>

  <!-- decoder's pick -->
  <text x="173" y="32" text-anchor="middle" font-size="11" fill="#e2903a">best guess</text>

  <!-- error mass brace over the three wrong bars -->
  <path d="M 240 226 L 240 232 L 376 232 L 376 226" fill="none" stroke="#4c8dd6" stroke-width="1.2"/>
  <path d="M 60 226 L 60 232 L 106 232 L 106 226" fill="none" stroke="#4c8dd6" stroke-width="1.2"/>
  <line x1="106" y1="232" x2="240" y2="232" stroke="#4c8dd6" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="410" y="236" font-size="12" fill="#4c8dd6">0.3 wrong</text>

  <text x="400" y="120" font-size="11" fill="currentColor" opacity="0.55">same shape</text>
  <text x="400" y="136" font-size="11" fill="currentColor" opacity="0.55">for every y</text>
</svg>

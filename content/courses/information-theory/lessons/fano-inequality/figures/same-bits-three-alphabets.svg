<svg viewBox="0 0 540 200" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="20" y="24" font-size="12" fill="currentColor">the same 4 bits of leftover uncertainty, three alphabet sizes</text>

  <!-- axis -->
  <line x1="60" y1="140" x2="500" y2="140" stroke="currentColor" stroke-width="1"/>
  <line x1="60" y1="140" x2="60" y2="145" stroke="currentColor" stroke-width="1"/>
  <line x1="165" y1="140" x2="165" y2="145" stroke="currentColor" stroke-width="1"/>
  <line x1="270" y1="140" x2="270" y2="145" stroke="currentColor" stroke-width="1"/>
  <line x1="375" y1="140" x2="375" y2="145" stroke="currentColor" stroke-width="1"/>
  <line x1="480" y1="140" x2="480" y2="145" stroke="currentColor" stroke-width="1"/>
  <text x="60" y="158" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">0</text>
  <text x="165" y="158" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">0.25</text>
  <text x="270" y="158" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">0.5</text>
  <text x="375" y="158" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">0.75</text>
  <text x="480" y="158" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">1</text>
  <text x="270" y="180" text-anchor="middle" font-size="12" fill="currentColor">smallest error probability the bound permits</text>

  <!-- 2^100 symbols: floor 0.038 -> x = 60 + 420*0.038 = 76 -->
  <line x1="76" y1="140" x2="76" y2="106" stroke="#4c8dd6" stroke-width="1.2" stroke-dasharray="3 3"/>
  <circle cx="76" cy="140" r="4.5" fill="#4c8dd6"/>
  <text x="76" y="98" text-anchor="middle" font-size="12" fill="#4c8dd6">0.038</text>
  <text x="76" y="82" text-anchor="middle" font-size="11" fill="#4c8dd6">2<tspan font-size="9" dy="-4">100</tspan><tspan dy="4"> symbols</tspan></text>

  <!-- 256 symbols: floor 0.38 -> x = 60 + 420*0.38 = 219.6 -->
  <line x1="220" y1="140" x2="220" y2="106" stroke="#e2903a" stroke-width="1.2" stroke-dasharray="3 3"/>
  <circle cx="220" cy="140" r="4.5" fill="#e2903a"/>
  <text x="220" y="98" text-anchor="middle" font-size="12" fill="#e2903a">0.38</text>
  <text x="220" y="82" text-anchor="middle" font-size="11" fill="#e2903a">256 symbols</text>

  <!-- 16 symbols: floor 0.9375 -> x = 60 + 420*0.9375 = 453.75 -->
  <line x1="454" y1="140" x2="454" y2="106" stroke="currentColor" stroke-width="1.2" stroke-dasharray="3 3"/>
  <circle cx="454" cy="140" r="4.5" fill="currentColor"/>
  <text x="454" y="98" text-anchor="middle" font-size="12" fill="currentColor">0.94</text>
  <text x="454" y="82" text-anchor="middle" font-size="11" fill="currentColor">16 symbols</text>

  <text x="270" y="52" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">4 bits is nearly nothing out of 100 and is everything out of 4</text>
</svg>

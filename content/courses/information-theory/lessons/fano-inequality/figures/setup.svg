<svg viewBox="0 0 560 216" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <marker id="fs-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- span bracket over X ... Y -->
  <path d="M 49 44 L 49 34 L 271 34 L 271 44" fill="none" stroke="#e2903a" stroke-width="1.2"/>
  <text x="160" y="26" text-anchor="middle" font-size="12" fill="#e2903a">H(X | Y) bits the observation leaves undecided</text>

  <!-- nodes -->
  <rect x="14" y="56" width="70" height="34" rx="5" fill="none" stroke="#e2903a" stroke-width="1.4"/>
  <text x="49" y="78" text-anchor="middle" font-size="13" fill="#e2903a">X</text>
  <text x="49" y="106" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">unknown</text>

  <rect x="112" y="56" width="96" height="34" rx="5" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="160" y="78" text-anchor="middle" font-size="13" fill="currentColor">p(y | x)</text>
  <text x="160" y="106" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">channel</text>

  <rect x="236" y="56" width="70" height="34" rx="5" fill="none" stroke="#e2903a" stroke-width="1.4"/>
  <text x="271" y="78" text-anchor="middle" font-size="13" fill="#e2903a">Y</text>
  <text x="271" y="106" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">observed</text>

  <rect x="334" y="56" width="96" height="34" rx="5" fill="none" stroke="#4c8dd6" stroke-width="1.4"/>
  <text x="382" y="78" text-anchor="middle" font-size="13" fill="#4c8dd6">g</text>
  <text x="382" y="106" text-anchor="middle" font-size="11" fill="#4c8dd6">any guessing rule</text>

  <rect x="458" y="56" width="86" height="34" rx="5" fill="none" stroke="#4c8dd6" stroke-width="1.4"/>
  <text x="501" y="78" text-anchor="middle" font-size="13" fill="#4c8dd6">X&#770; = g(Y)</text>

  <!-- arrows -->
  <line x1="84" y1="73" x2="108" y2="73" stroke="currentColor" stroke-width="1.2" marker-end="url(#fs-arrow)"/>
  <line x1="208" y1="73" x2="232" y2="73" stroke="currentColor" stroke-width="1.2" marker-end="url(#fs-arrow)"/>
  <line x1="306" y1="73" x2="330" y2="73" stroke="currentColor" stroke-width="1.2" marker-end="url(#fs-arrow)"/>
  <line x1="430" y1="73" x2="454" y2="73" stroke="currentColor" stroke-width="1.2" marker-end="url(#fs-arrow)"/>

  <!-- comparison back to X -->
  <path d="M 501 96 L 501 152 L 14 152 L 14 94" fill="none" stroke="#4c8dd6" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#fs-arrow)"/>
  <text x="275" y="170" text-anchor="middle" font-size="12" fill="#4c8dd6">P<tspan font-size="9" dy="3">e</tspan><tspan dy="-3"> = Pr[ X&#770; &#8800; X ], the fraction of guesses that miss</tspan></text>

  <text x="275" y="198" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">the bound relates the two labelled quantities and mentions g nowhere</text>
</svg>

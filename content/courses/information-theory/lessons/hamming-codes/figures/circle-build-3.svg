<svg viewBox="0 0 480 386" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .lab  { fill: currentColor; }
    .mut  { fill: currentColor; opacity: 0.55; font-size: 11.5px; }
    .note { fill: currentColor; opacity: 0.75; font-size: 12px; }
    .slot { fill: none; stroke: currentColor; stroke-opacity: 0.45; stroke-width: 1.2; }
    .bit  { font-size: 13px; font-weight: 600; fill: currentColor; }
  </style>

  <text class="lab" x="20" y="26" font-weight="600">encoding s = 1011</text>
  <circle cx="240" cy="120" r="90" fill="none" stroke="#e2903a" stroke-opacity="0.35" stroke-width="1.8"/>
  <circle cx="290" cy="205" r="90" fill="#4c8dd6" fill-opacity="0.07" stroke="#4c8dd6" stroke-width="3"/>
  <circle cx="190" cy="205" r="90" fill="none" stroke="#5aa46a" stroke-opacity="0.35" stroke-width="1.8"/>
  <circle cx="185" cy="145" r="13" fill="none" stroke="currentColor" stroke-opacity="0.45" stroke-width="1.2"/>
  <text class="bit" x="185" y="149.5" text-anchor="middle">1</text>
  <text class="mut" x="202" y="149">c₁</text>
  <circle cx="295" cy="145" r="13" fill="none" stroke="currentColor" stroke-opacity="0.45" stroke-width="1.2"/>
  <text class="bit" x="295" y="149.5" text-anchor="middle">0</text>
  <text class="mut" x="312" y="149">c₂</text>
  <circle cx="240" cy="177" r="13" fill="none" stroke="currentColor" stroke-opacity="0.45" stroke-width="1.2"/>
  <text class="bit" x="240" y="181.5" text-anchor="middle">1</text>
  <text class="mut" x="257" y="181">c₃</text>
  <circle cx="240" cy="228" r="13" fill="none" stroke="currentColor" stroke-opacity="0.45" stroke-width="1.2"/>
  <text class="bit" x="240" y="232.5" text-anchor="middle">1</text>
  <text class="mut" x="257" y="232">c₄</text>
  <circle cx="240" cy="95" r="13" fill="none" stroke="#e2903a" stroke-opacity="1" stroke-width="2.2"/>
  <text class="bit" x="240" y="99.5" text-anchor="middle" fill="#e2903a">0</text>
  <text class="mut" x="257" y="99">c₅</text>
  <circle cx="330" cy="232" r="13" fill="none" stroke="#4c8dd6" stroke-opacity="1" stroke-width="2.2"/>
  <text class="bit" x="330" y="236.5" text-anchor="middle" fill="#4c8dd6">0</text>
  <text class="mut" x="347" y="236">c₆</text>
  <circle cx="150" cy="232" r="13" class="slot" stroke-dasharray="3 3"/>
  <text class="mut" x="167" y="236">c₇</text>
  <text class="note" x="20" y="310">Check 2 (lower-right circle) holds c₂, c₃, c₄ and the slot c₆.</text>
  <text class="note" x="20" y="329">c₂+c₃+c₄ = 0+1+1 = 0 mod 2, so c₆ = 0.</text>
</svg>

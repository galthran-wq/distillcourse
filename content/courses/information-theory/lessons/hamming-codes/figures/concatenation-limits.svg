<svg viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .lab  { fill: currentColor; }
    .mut  { fill: currentColor; opacity: 0.55; font-size: 11.5px; }
    .note { fill: currentColor; opacity: 0.75; font-size: 12px; }
    .axis { stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.2; fill: none; }
    .guide{ stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
  </style>

  <path class="axis" d="M130 250 L560 250"/>
  <path class="axis" d="M130 250 L130 34"/>

  <path class="axis" d="M125 40 L130 40"/>
  <text class="mut" x="121" y="44" text-anchor="end">1</text>
  <path class="axis" d="M125 92.5 L130 92.5"/>
  <text class="mut" x="121" y="96.5" text-anchor="end">0.1</text>
  <path class="axis" d="M125 145 L130 145"/>
  <text class="mut" x="121" y="149" text-anchor="end">0.01</text>
  <path class="axis" d="M125 197.5 L130 197.5"/>
  <text class="mut" x="121" y="201.5" text-anchor="end">0.001</text>
  <path class="axis" d="M125 250 L130 250"/>
  <text class="mut" x="121" y="254" text-anchor="end">0.0001</text>
  <text class="mut" x="130" y="26">log scale</text>

  <path class="guide" d="M130 145 L560 145"/>
  <path class="guide" d="M130 197.5 L560 197.5"/>

  <path class="guide" stroke="#e2903a" d="M130 94.2 L560 94.2"/>
  <path fill="none" stroke="#e2903a" stroke-width="2.4"
        d="M130 65.1 L232.5 77.8 L335 84.9 L437.5 88.9 L540 91.2"/>
  <circle cx="130" cy="65.1" r="4" fill="#e2903a"/>
  <circle cx="232.5" cy="77.8" r="4" fill="#e2903a"/>
  <circle cx="335" cy="84.9" r="4" fill="#e2903a"/>
  <circle cx="437.5" cy="88.9" r="4" fill="#e2903a"/>
  <circle cx="540" cy="91.2" r="4" fill="#e2903a"/>
  <text class="mut" x="548" y="112" fill="#e2903a">rate → 0.093</text>

  <path fill="none" stroke="#4c8dd6" stroke-width="2.4"
        d="M130 40 L232.5 59.3 L335 96 L437.5 149.3 L540 218.7"/>
  <circle cx="130" cy="40" r="4" fill="#4c8dd6"/>
  <circle cx="232.5" cy="59.3" r="4" fill="#4c8dd6"/>
  <circle cx="335" cy="96" r="4" fill="#4c8dd6"/>
  <circle cx="437.5" cy="149.3" r="4" fill="#4c8dd6"/>
  <circle cx="540" cy="218.7" r="4" fill="#4c8dd6"/>
  <text class="mut" x="548" y="222" fill="#4c8dd6">d/n → 0</text>

  <text class="mut" x="104" y="272" text-anchor="end">stage m</text>
  <text class="mut" x="130" y="272" text-anchor="middle">2</text>
  <text class="mut" x="232.5" y="272" text-anchor="middle">3</text>
  <text class="mut" x="335" y="272" text-anchor="middle">4</text>
  <text class="mut" x="437.5" y="272" text-anchor="middle">5</text>
  <text class="mut" x="540" y="272" text-anchor="middle">6</text>

  <text class="mut" x="104" y="290" text-anchor="end">blocklength n</text>
  <text class="mut" x="130" y="290" text-anchor="middle">3</text>
  <text class="mut" x="232.5" y="290" text-anchor="middle">21</text>
  <text class="mut" x="335" y="290" text-anchor="middle">315</text>
  <text class="mut" x="437.5" y="290" text-anchor="middle">9765</text>
  <text class="mut" x="540" y="290" text-anchor="middle">615195</text>

  <text class="mut" x="104" y="308" text-anchor="end">distance d</text>
  <text class="mut" x="130" y="308" text-anchor="middle">3</text>
  <text class="mut" x="232.5" y="308" text-anchor="middle">9</text>
  <text class="mut" x="335" y="308" text-anchor="middle">27</text>
  <text class="mut" x="437.5" y="308" text-anchor="middle">81</text>
  <text class="mut" x="540" y="308" text-anchor="middle">243</text>

  <path d="M24 334 L48 334" stroke="#e2903a" stroke-width="2.4"/>
  <text class="mut" x="56" y="338">rate after stages 2…m: the product of (2ᵐ − 1 − m)/(2ᵐ − 1)</text>
  <path d="M24 354 L48 354" stroke="#4c8dd6" stroke-width="2.4"/>
  <text class="mut" x="56" y="358">relative distance d/n after the same stages</text>
  <text class="note" x="24" y="376">The rate stops falling; the relative distance does not.</text>
</svg>

<svg viewBox="0 0 600 262" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .lab  { fill: currentColor; }
    .mut  { fill: currentColor; opacity: 0.55; font-size: 11.5px; }
    .note { fill: currentColor; opacity: 0.75; font-size: 12px; }
    .axis { stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.2; fill: none; }
    .guide{ stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
  </style>
  <text class="mut" x="165" y="58" text-anchor="middle">c₁</text>
  <text class="mut" x="198" y="58" text-anchor="middle">c₂</text>
  <text class="mut" x="231" y="58" text-anchor="middle">c₃</text>
  <text class="mut" x="264" y="58" text-anchor="middle">c₄</text>
  <text class="mut" x="297" y="58" text-anchor="middle">c₅</text>
  <text class="mut" x="330" y="58" text-anchor="middle">c₆</text>
  <text class="mut" x="363" y="58" text-anchor="middle">c₇</text>
  <text class="lab" x="128" y="122" font-size="16" text-anchor="end">H =</text>
  <path class="axis" d="M152 66 L143 66 L143 168 L152 168"/>
  <path class="axis" d="M382 66 L391 66 L391 168 L382 168"/>
  <text x="165" y="87" text-anchor="middle" font-weight="600" fill="#e2903a">1</text>
  <text x="198" y="87" text-anchor="middle" font-weight="600" fill="#e2903a">1</text>
  <text x="231" y="87" text-anchor="middle" font-weight="600" fill="#e2903a">1</text>
  <text x="264" y="87" text-anchor="middle" font-weight="600" fill="#e2903a">0</text>
  <text x="297" y="87" text-anchor="middle" font-weight="600" fill="#e2903a">1</text>
  <text x="330" y="87" text-anchor="middle" font-weight="600" fill="#e2903a">0</text>
  <text x="363" y="87" text-anchor="middle" font-weight="600" fill="#e2903a">0</text>
  <text x="410" y="87" fill="#e2903a" font-size="12.5">check 1:  c₁+c₂+c₃+c₅</text>
  <text x="165" y="122" text-anchor="middle" font-weight="600" fill="#4c8dd6">0</text>
  <text x="198" y="122" text-anchor="middle" font-weight="600" fill="#4c8dd6">1</text>
  <text x="231" y="122" text-anchor="middle" font-weight="600" fill="#4c8dd6">1</text>
  <text x="264" y="122" text-anchor="middle" font-weight="600" fill="#4c8dd6">1</text>
  <text x="297" y="122" text-anchor="middle" font-weight="600" fill="#4c8dd6">0</text>
  <text x="330" y="122" text-anchor="middle" font-weight="600" fill="#4c8dd6">1</text>
  <text x="363" y="122" text-anchor="middle" font-weight="600" fill="#4c8dd6">0</text>
  <text x="410" y="122" fill="#4c8dd6" font-size="12.5">check 2:  c₂+c₃+c₄+c₆</text>
  <text x="165" y="157" text-anchor="middle" font-weight="600" fill="#5aa46a">1</text>
  <text x="198" y="157" text-anchor="middle" font-weight="600" fill="#5aa46a">0</text>
  <text x="231" y="157" text-anchor="middle" font-weight="600" fill="#5aa46a">1</text>
  <text x="264" y="157" text-anchor="middle" font-weight="600" fill="#5aa46a">1</text>
  <text x="297" y="157" text-anchor="middle" font-weight="600" fill="#5aa46a">0</text>
  <text x="330" y="157" text-anchor="middle" font-weight="600" fill="#5aa46a">0</text>
  <text x="363" y="157" text-anchor="middle" font-weight="600" fill="#5aa46a">1</text>
  <text x="410" y="157" fill="#5aa46a" font-size="12.5">check 3:  c₁+c₃+c₄+c₇</text>
  <path class="guide" d="M281 64 L281 170"/>
  <text class="mut" x="215" y="186" text-anchor="middle">four message bits</text>
  <text class="mut" x="330" y="186" text-anchor="middle">three parity bits</text>
  <text class="note" x="24" y="216">The seven columns are the seven non-zero 3-bit patterns, each used once: column 3 is (1,1,1),</text>
  <text class="note" x="24" y="235">column 5 is (1,0,0). A 7-bit word c is a codeword exactly when Hc = 0, so the code is the null</text>
  <text class="note" x="24" y="254">space of H — a 4-dimensional subspace holding 2⁴ = 16 codewords.</text>
</svg>

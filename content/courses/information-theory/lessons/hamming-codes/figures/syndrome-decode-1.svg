<svg viewBox="0 0 480 386" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .lab  { fill: currentColor; }
    .mut  { fill: currentColor; opacity: 0.55; font-size: 11.5px; }
    .note { fill: currentColor; opacity: 0.75; font-size: 12px; }
    .slot { fill: none; stroke: currentColor; stroke-opacity: 0.45; stroke-width: 1.2; }
    .bit  { font-size: 13px; font-weight: 600; fill: currentColor; }
  </style>

  <text class="lab" x="20" y="26" font-weight="600">received r = 1111001</text>
  <text class="mut" x="460" y="26" text-anchor="end">dashed = parity check violated</text>
  <circle cx="240" cy="120" r="90" fill="none" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.6"/>
  <circle cx="290" cy="205" r="90" fill="none" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.6"/>
  <circle cx="190" cy="205" r="90" fill="none" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.6"/>
  <circle cx="185" cy="145" r="13" fill="none" stroke="currentColor" stroke-opacity="0.45" stroke-width="1.2"/>
  <text class="bit" x="185" y="149.5" text-anchor="middle">1</text>
  <text class="mut" x="202" y="149">r₁</text>
  <circle cx="295" cy="145" r="13" fill="none" stroke="currentColor" stroke-opacity="0.45" stroke-width="1.2"/>
  <text class="bit" x="295" y="149.5" text-anchor="middle">1</text>
  <text class="mut" x="312" y="149">r₂</text>
  <circle cx="240" cy="177" r="13" fill="none" stroke="currentColor" stroke-opacity="0.45" stroke-width="1.2"/>
  <text class="bit" x="240" y="181.5" text-anchor="middle">1</text>
  <text class="mut" x="257" y="181">r₃</text>
  <circle cx="240" cy="228" r="13" fill="none" stroke="currentColor" stroke-opacity="0.45" stroke-width="1.2"/>
  <text class="bit" x="240" y="232.5" text-anchor="middle">1</text>
  <text class="mut" x="257" y="232">r₄</text>
  <circle cx="240" cy="95" r="13" fill="none" stroke="currentColor" stroke-opacity="0.45" stroke-width="1.2"/>
  <text class="bit" x="240" y="99.5" text-anchor="middle">0</text>
  <text class="mut" x="257" y="99">r₅</text>
  <circle cx="330" cy="232" r="13" fill="none" stroke="currentColor" stroke-opacity="0.45" stroke-width="1.2"/>
  <text class="bit" x="330" y="236.5" text-anchor="middle">0</text>
  <text class="mut" x="347" y="236">r₆</text>
  <circle cx="150" cy="232" r="13" fill="none" stroke="currentColor" stroke-opacity="0.45" stroke-width="1.2"/>
  <text class="bit" x="150" y="236.5" text-anchor="middle">1</text>
  <text class="mut" x="167" y="236">r₇</text>
  <text class="note" x="20" y="310">Seven bits arrive. Which of them the channel flipped is recorded</text>
  <text class="note" x="20" y="329">nowhere in the block; the decoder has only the three parity checks.</text>
</svg>

<svg viewBox="0 0 640 290" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- LEFT PANEL: first bracket takes n0 = 2 (optimal) -->
  <text x="14" y="20" font-size="12" fill="currentColor">first bracket takes 2</text>
  <text x="14" y="36" font-size="11" fill="currentColor" opacity="0.55">only n0 with (8 − n0)/3 an integer</text>

  <text x="20" y="62" font-size="12" fill="currentColor">.22</text>
  <text x="20" y="88" font-size="12" fill="currentColor">.20</text>
  <text x="20" y="114" font-size="12" fill="currentColor">.18</text>
  <text x="20" y="140" font-size="12" fill="currentColor">.15</text>
  <text x="20" y="166" font-size="12" fill="currentColor">.10</text>
  <text x="20" y="192" font-size="12" fill="currentColor">.08</text>
  <text x="20" y="218" font-size="12" fill="currentColor">.05</text>
  <text x="20" y="244" font-size="12" fill="currentColor">.02</text>

  <!-- bracket A: .05 + .02 -> .07 -->
  <path d="M48 214 L60 214 M48 240 L60 240 M60 214 L60 240 M60 227 L74 227"
        fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="78" y="231" font-size="12" fill="currentColor">.07</text>

  <!-- bracket B: .15 + .10 + .08 + .07 -> .40 -->
  <path d="M48 136 L112 136 M48 162 L112 162 M48 188 L112 188 M104 227 L112 227
           M112 136 L112 227 M112 181 L126 181"
        fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="130" y="185" font-size="12" fill="currentColor">.40</text>

  <!-- bracket C: .22 + .20 + .18 + .40 -> 1.00 -->
  <path d="M48 58 L172 58 M48 84 L172 84 M48 110 L172 110 M156 181 L172 181
           M172 58 L172 181 M172 119 L186 119"
        fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="190" y="123" font-size="12" fill="currentColor">1.00</text>

  <!-- lengths -->
  <text x="262" y="62" font-size="11" fill="currentColor" opacity="0.55">1</text>
  <text x="262" y="88" font-size="11" fill="currentColor" opacity="0.55">1</text>
  <text x="262" y="114" font-size="11" fill="currentColor" opacity="0.55">1</text>
  <text x="262" y="140" font-size="11" fill="currentColor" opacity="0.55">2</text>
  <text x="262" y="166" font-size="11" fill="currentColor" opacity="0.55">2</text>
  <text x="262" y="192" font-size="11" fill="currentColor" opacity="0.55">2</text>
  <text x="262" y="218" font-size="11" fill="currentColor" opacity="0.55">3</text>
  <text x="262" y="244" font-size="11" fill="currentColor" opacity="0.55">3</text>
  <text x="252" y="40" font-size="11" fill="currentColor" opacity="0.55">digits</text>

  <text x="14" y="272" font-size="12" fill="#e2903a" font-weight="600">L = 1.47 digits</text>

  <!-- divider -->
  <line x1="300" y1="14" x2="300" y2="278" stroke="currentColor" stroke-width="1"
        stroke-dasharray="3 3" opacity="0.5"/>

  <!-- RIGHT PANEL: first bracket takes 4 -->
  <text x="326" y="20" font-size="12" fill="currentColor">first bracket takes 4</text>
  <text x="326" y="36" font-size="11" fill="currentColor" opacity="0.55">the deficit lands at the root instead</text>

  <text x="332" y="62" font-size="12" fill="currentColor">.22</text>
  <text x="332" y="88" font-size="12" fill="currentColor">.20</text>
  <text x="332" y="114" font-size="12" fill="currentColor">.18</text>
  <text x="332" y="140" font-size="12" fill="currentColor">.15</text>
  <text x="332" y="166" font-size="12" fill="currentColor">.10</text>
  <text x="332" y="192" font-size="12" fill="currentColor">.08</text>
  <text x="332" y="218" font-size="12" fill="currentColor">.05</text>
  <text x="332" y="244" font-size="12" fill="currentColor">.02</text>

  <!-- bracket: four largest -> .75 -->
  <path d="M360 58 L412 58 M360 84 L412 84 M360 110 L412 110 M360 136 L412 136
           M412 58 L412 136 M412 97 L426 97"
        fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="430" y="101" font-size="12" fill="currentColor">.75</text>

  <!-- bracket: four smallest -> .25 -->
  <path d="M360 162 L412 162 M360 188 L412 188 M360 214 L412 214 M360 240 L412 240
           M412 162 L412 240 M412 201 L426 201"
        fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="430" y="205" font-size="12" fill="currentColor">.25</text>

  <!-- root joins only two -->
  <path d="M456 97 L486 97 M456 201 L486 201 M486 97 L486 201 M486 149 L500 149"
        fill="none" stroke="#4c8dd6" stroke-width="1.4"/>
  <text x="504" y="153" font-size="12" fill="currentColor">1.00</text>
  <text x="504" y="169" font-size="11" fill="#4c8dd6">2 of 4 root</text>
  <text x="504" y="183" font-size="11" fill="#4c8dd6">slots unused</text>

  <text x="592" y="40" font-size="11" fill="currentColor" opacity="0.55">digits</text>
  <text x="598" y="62" font-size="11" fill="currentColor" opacity="0.55">2</text>
  <text x="598" y="88" font-size="11" fill="currentColor" opacity="0.55">2</text>
  <text x="598" y="114" font-size="11" fill="currentColor" opacity="0.55">2</text>
  <text x="598" y="140" font-size="11" fill="currentColor" opacity="0.55">2</text>
  <text x="598" y="166" font-size="11" fill="currentColor" opacity="0.55">2</text>
  <text x="598" y="192" font-size="11" fill="currentColor" opacity="0.55">2</text>
  <text x="598" y="218" font-size="11" fill="currentColor" opacity="0.55">2</text>
  <text x="598" y="244" font-size="11" fill="currentColor" opacity="0.55">2</text>

  <text x="326" y="272" font-size="12" fill="#e2903a" font-weight="600">L = 2.00 digits</text>
</svg>

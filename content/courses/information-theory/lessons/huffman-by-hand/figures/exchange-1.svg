<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 360" font-family="system-ui, sans-serif">
  <text x="24" y="24" font-size="12" fill="currentColor" opacity="0.55">lengths (1, 2, 3, 3) assigned badly: the rarest symbol holds the shortest codeword</text>

  <!-- internal nodes -->
  <circle cx="215" cy="32" r="4" fill="currentColor"/>
  <circle cx="340" cy="108" r="4" fill="currentColor"/>
  <circle cx="450" cy="188" r="4" fill="currentColor"/>
  <line x1="215" y1="36" x2="90" y2="258" stroke="currentColor" stroke-width="1.4" opacity="0.6"/>
  <line x1="215" y1="36" x2="340" y2="104" stroke="currentColor" stroke-width="1.4" opacity="0.6"/>
  <line x1="340" y1="112" x2="230" y2="258" stroke="currentColor" stroke-width="1.4" opacity="0.6"/>
  <line x1="340" y1="112" x2="450" y2="184" stroke="currentColor" stroke-width="1.4" opacity="0.6"/>
  <line x1="450" y1="192" x2="390" y2="258" stroke="currentColor" stroke-width="1.4" opacity="0.6"/>
  <line x1="450" y1="192" x2="510" y2="258" stroke="currentColor" stroke-width="1.4" opacity="0.6"/>

  <!-- leaf slot 1 (depth 1): D -->
  <rect x="64" y="260" width="52" height="34" rx="5" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <text x="90" y="276" font-size="13" font-weight="600" fill="currentColor" text-anchor="middle">D</text>
  <text x="90" y="289" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">.1</text>
  <text x="90" y="308" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">len 1</text>

  <!-- leaf slot 2 (depth 2): B -->
  <rect x="204" y="260" width="52" height="34" rx="5" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <text x="230" y="276" font-size="13" font-weight="600" fill="currentColor" text-anchor="middle">B</text>
  <text x="230" y="289" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">.25</text>
  <text x="230" y="308" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">len 2</text>

  <!-- leaf slot 3 (depth 3): C -->
  <rect x="364" y="260" width="52" height="34" rx="5" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <text x="390" y="276" font-size="13" font-weight="600" fill="currentColor" text-anchor="middle">C</text>
  <text x="390" y="289" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">.15</text>
  <text x="390" y="308" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">len 3</text>

  <!-- leaf slot 4 (depth 3): A -->
  <rect x="484" y="260" width="52" height="34" rx="5" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <text x="510" y="276" font-size="13" font-weight="600" fill="currentColor" text-anchor="middle">A</text>
  <text x="510" y="289" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">.5</text>
  <text x="510" y="308" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">len 3</text>

  <!-- tally -->
  <text x="310" y="332" font-size="12.5" fill="currentColor" text-anchor="middle">L = .1&#183;1 + .25&#183;2 + .15&#183;3 + .5&#183;3 = <tspan font-weight="600">2.55 bits</tspan></text>
</svg>

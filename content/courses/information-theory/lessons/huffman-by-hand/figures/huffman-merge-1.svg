<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 360" font-family="system-ui, sans-serif">
  <text x="24" y="24" font-size="12" fill="currentColor" opacity="0.55">start: four weighted leaves, no merges yet</text>
  <text x="596" y="24" font-size="12" fill="currentColor" text-anchor="end">pool: <tspan font-weight="600">.5&#160;&#160;.25&#160;&#160;.15&#160;&#160;.1</tspan></text>

  <!-- leaf A -->
  <rect x="64" y="260" width="52" height="34" rx="5" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <text x="90" y="276" font-size="13" font-weight="600" fill="currentColor" text-anchor="middle">A</text>
  <text x="90" y="289" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">.5</text>

  <!-- leaf B -->
  <rect x="204" y="260" width="52" height="34" rx="5" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <text x="230" y="276" font-size="13" font-weight="600" fill="currentColor" text-anchor="middle">B</text>
  <text x="230" y="289" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">.25</text>

  <!-- leaf C -->
  <rect x="364" y="260" width="52" height="34" rx="5" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <text x="390" y="276" font-size="13" font-weight="600" fill="currentColor" text-anchor="middle">C</text>
  <text x="390" y="289" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">.15</text>

  <!-- leaf D -->
  <rect x="484" y="260" width="52" height="34" rx="5" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <text x="510" y="276" font-size="13" font-weight="600" fill="currentColor" text-anchor="middle">D</text>
  <text x="510" y="289" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">.1</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 360" font-family="system-ui, sans-serif">
  <text x="24" y="24" font-size="12" fill="currentColor" opacity="0.55">read the code off the tree: one bit per branch, root to leaf</text>
  <text x="596" y="24" font-size="12" fill="currentColor" text-anchor="end">0/1 labels: <tspan font-weight="600">an arbitrary choice</tspan></text>

  <!-- root 1.0 -->
  <rect x="192" y="20" width="46" height="24" rx="5" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <text x="215" y="36" font-size="12" font-weight="600" fill="currentColor" text-anchor="middle">1.0</text>
  <line x1="215" y1="44" x2="90" y2="260" stroke="currentColor" stroke-width="1.4" opacity="0.6"/>
  <line x1="215" y1="44" x2="340" y2="96" stroke="currentColor" stroke-width="1.4" opacity="0.6"/>
  <text x="132" y="158" font-size="11.5" font-weight="600" fill="#e2903a" text-anchor="middle">1</text>
  <text x="278" y="62" font-size="11.5" font-weight="600" fill="#e2903a" text-anchor="middle">0</text>

  <!-- node .50 -->
  <rect x="317" y="96" width="46" height="24" rx="5" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <text x="340" y="112" font-size="12" font-weight="600" fill="currentColor" text-anchor="middle">.50</text>
  <line x1="340" y1="120" x2="230" y2="260" stroke="currentColor" stroke-width="1.4" opacity="0.6"/>
  <line x1="340" y1="120" x2="450" y2="176" stroke="currentColor" stroke-width="1.4" opacity="0.6"/>
  <text x="272" y="186" font-size="11.5" font-weight="600" fill="#e2903a" text-anchor="middle">1</text>
  <text x="395" y="140" font-size="11.5" font-weight="600" fill="#e2903a" text-anchor="middle">0</text>

  <!-- node .25 -->
  <rect x="427" y="176" width="46" height="24" rx="5" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <text x="450" y="192" font-size="12" font-weight="600" fill="currentColor" text-anchor="middle">.25</text>
  <line x1="450" y1="200" x2="390" y2="260" stroke="currentColor" stroke-width="1.4" opacity="0.6"/>
  <line x1="450" y1="200" x2="510" y2="260" stroke="currentColor" stroke-width="1.4" opacity="0.6"/>
  <text x="408" y="226" font-size="11.5" font-weight="600" fill="#e2903a" text-anchor="middle">1</text>
  <text x="492" y="226" font-size="11.5" font-weight="600" fill="#e2903a" text-anchor="middle">0</text>

  <!-- leaf A -->
  <rect x="64" y="260" width="52" height="34" rx="5" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <text x="90" y="276" font-size="13" font-weight="600" fill="currentColor" text-anchor="middle">A</text>
  <text x="90" y="289" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">.5</text>
  <text x="90" y="316" font-size="12" font-family="ui-monospace, monospace" text-anchor="middle"><tspan fill="#e2903a" font-weight="600">1</tspan><tspan fill="currentColor" opacity="0.55" font-size="10.5">&#160;&#183;&#160;len 1</tspan></text>

  <!-- leaf B -->
  <rect x="204" y="260" width="52" height="34" rx="5" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <text x="230" y="276" font-size="13" font-weight="600" fill="currentColor" text-anchor="middle">B</text>
  <text x="230" y="289" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">.25</text>
  <text x="230" y="316" font-size="12" font-family="ui-monospace, monospace" text-anchor="middle"><tspan fill="#e2903a" font-weight="600">01</tspan><tspan fill="currentColor" opacity="0.55" font-size="10.5">&#160;&#183;&#160;len 2</tspan></text>

  <!-- leaf C -->
  <rect x="364" y="260" width="52" height="34" rx="5" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <text x="390" y="276" font-size="13" font-weight="600" fill="currentColor" text-anchor="middle">C</text>
  <text x="390" y="289" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">.15</text>
  <text x="390" y="316" font-size="12" font-family="ui-monospace, monospace" text-anchor="middle"><tspan fill="#e2903a" font-weight="600">001</tspan><tspan fill="currentColor" opacity="0.55" font-size="10.5">&#160;&#183;&#160;len 3</tspan></text>

  <!-- leaf D -->
  <rect x="484" y="260" width="52" height="34" rx="5" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <text x="510" y="276" font-size="13" font-weight="600" fill="currentColor" text-anchor="middle">D</text>
  <text x="510" y="289" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">.1</text>
  <text x="510" y="316" font-size="12" font-family="ui-monospace, monospace" text-anchor="middle"><tspan fill="#e2903a" font-weight="600">000</tspan><tspan fill="currentColor" opacity="0.55" font-size="10.5">&#160;&#183;&#160;len 3</tspan></text>

  <!-- tally -->
  <text x="310" y="350" font-size="12.5" fill="currentColor" text-anchor="middle">L = .5&#183;1 + .25&#183;2 + .15&#183;3 + .1&#183;3 = <tspan fill="#e2903a" font-weight="600">1.75 bits</tspan></text>
</svg>

<svg viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .axis  { stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.2; fill: none; }
    .guide { stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
    .line  { stroke: #e2903a; stroke-width: 2.5; fill: none; }
    .dot   { fill: #e2903a; }
    .lead  { stroke: #e2903a; stroke-opacity: 0.6; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
    .band  { stroke: #e2903a; stroke-opacity: 0.28; stroke-width: 11; fill: none; }
    .cap   { stroke: #e2903a; stroke-width: 1.6; fill: none; }
  </style>

  <!-- axes: x = log2 N in [0,17] mapped to 60..519 ; y = bits 0..17 mapped to 250..40 -->
  <path class="axis" d="M60 250 L530 250"/>
  <path class="axis" d="M60 250 L60 40"/>
  <text class="muted" x="60" y="288">candidates N per lineup (log scale)</text>
  <text class="muted" x="24" y="44">bits</text>

  <!-- y ticks 0, 4, 8, 12, 16 -->
  <path class="axis" d="M55 250 L60 250"/>
  <path class="axis" d="M55 200.6 L60 200.6"/>
  <path class="axis" d="M55 151.2 L60 151.2"/>
  <path class="axis" d="M55 101.8 L60 101.8"/>
  <path class="axis" d="M55 52.4 L60 52.4"/>
  <text class="muted" x="50" y="254" text-anchor="end">0</text>
  <text class="muted" x="50" y="204" text-anchor="end">4</text>
  <text class="muted" x="50" y="155" text-anchor="end">8</text>
  <text class="muted" x="50" y="105" text-anchor="end">12</text>
  <text class="muted" x="50" y="56" text-anchor="end">16</text>

  <!-- x ticks at N = 16, 256, 4096, 65536 -->
  <path class="axis" d="M168 250 L168 255"/>
  <path class="axis" d="M276 250 L276 255"/>
  <path class="axis" d="M384 250 L384 255"/>
  <path class="axis" d="M492 250 L492 255"/>
  <text class="muted" x="168" y="268" text-anchor="middle">16</text>
  <text class="muted" x="276" y="268" text-anchor="middle">256</text>
  <text class="muted" x="384" y="268" text-anchor="middle">4,096</text>
  <text class="muted" x="492" y="268" text-anchor="middle">65,536</text>

  <!-- CPC's candidate count is bounded, not reported: N between 8 and ~1024 -->
  <path class="band" d="M141 212.9 L330 126.5"/>

  <!-- the ceiling line: bits = log2 N -->
  <path class="line" d="M60 250 L519 40"/>
  <text x="150" y="118" fill="#e2903a" font-weight="600">ceiling = log&#8322; N</text>

  <!-- band end caps, perpendicular to the line -->
  <path class="cap" d="M137.7 205.7 L144.3 220.1"/>
  <path class="cap" d="M326.7 119.3 L333.3 133.7"/>
  <path class="lead" d="M238 175 L205 220"/>
  <text class="muted" x="150" y="236">CPC minibatch of 8: 3 to 10 bits</text>

  <!-- 128x span annotation from N = 256 (8 bits) to N = 32768 (15 bits) -->
  <path class="guide" d="M276 190.6 L465 190.6"/>
  <path class="guide" d="M276 184 L276 197"/>
  <path class="guide" d="M465 184 L465 197"/>
  <text class="muted" x="374" y="209" text-anchor="middle">128&#215; the candidates: +7 bits</text>

  <!-- deployed systems -->

  <circle class="dot" cx="411" cy="89.4" r="4"/>
  <path class="lead" d="M415 89.4 L540 89.4"/>
  <text class="muted" x="544" y="93">SimCLR: 13 bits</text>

  <circle class="dot" cx="465" cy="65" r="4"/>
  <path class="lead" d="M469 65 L540 65"/>
  <text class="muted" x="544" y="69">CLIP: 15 bits</text>

  <circle class="dot" cx="492" cy="52.4" r="4"/>
  <path class="lead" d="M496 52.4 L540 52.4"/>
  <text class="muted" x="544" y="45">MoCo queue: 16 bits</text>

  <text class="muted" x="530" y="204">one bit per doubling</text>
  <text class="muted" x="530" y="220">of N, whatever the pair</text>
</svg>

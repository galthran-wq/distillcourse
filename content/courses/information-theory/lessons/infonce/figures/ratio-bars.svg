<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .axis  { stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.2; fill: none; }
    .guide { stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
    .blue  { fill: #4c8dd6; }
    .amber { fill: #e2903a; }
    .op    { fill: currentColor; opacity: 0.7; font-size: 20px; }
  </style>

  <!-- panel titles -->
  <text class="label" x="130" y="34" text-anchor="middle">p(y | x = 0)</text>
  <text class="label" x="320" y="34" text-anchor="middle">p(y)</text>
  <text class="amber" x="510" y="34" text-anchor="middle" font-weight="600">r(x, y) = p(y | x) / p(y)</text>
  <text class="muted" x="130" y="52" text-anchor="middle">the conditional</text>
  <text class="muted" x="320" y="52" text-anchor="middle">the marginal</text>
  <text class="muted" x="510" y="52" text-anchor="middle">what the critic learns</text>

  <!-- operators between the panels -->
  <text class="op" x="225" y="170" text-anchor="middle">&#247;</text>
  <text class="op" x="415" y="170" text-anchor="middle">=</text>

  <!-- baseline -->
  <path class="axis" d="M40 235 L610 235"/>

  <!-- panel 1: conditional, scale 1.0 = 130px -->
  <rect class="blue" x="76" y="137.5" width="34" height="97.5" rx="3"/>
  <rect class="blue" x="130" y="202.5" width="34" height="32.5" rx="3"/>
  <text class="muted" x="93" y="130" text-anchor="middle">0.75</text>
  <text class="muted" x="147" y="195" text-anchor="middle">0.25</text>
  <text class="muted" x="93" y="252" text-anchor="middle">y = 0</text>
  <text class="muted" x="147" y="252" text-anchor="middle">y = 1</text>

  <!-- panel 2: marginal -->
  <rect class="blue" x="266" y="170" width="34" height="65" rx="3"/>
  <rect class="blue" x="320" y="170" width="34" height="65" rx="3"/>
  <text class="muted" x="283" y="162" text-anchor="middle">0.5</text>
  <text class="muted" x="337" y="162" text-anchor="middle">0.5</text>
  <text class="muted" x="283" y="252" text-anchor="middle">y = 0</text>
  <text class="muted" x="337" y="252" text-anchor="middle">y = 1</text>

  <!-- panel 3: the ratio, own scale 1.5 = 130px -->
  <path class="guide" d="M440 148.3 L600 148.3"/>
  <text class="muted" x="604" y="152">r = 1</text>
  <rect class="amber" x="456" y="105" width="34" height="130" rx="3"/>
  <rect class="amber" x="510" y="191.7" width="34" height="43.3" rx="3"/>
  <text class="muted" x="473" y="98" text-anchor="middle">1.5</text>
  <text class="muted" x="527" y="184" text-anchor="middle">0.5</text>
  <text class="muted" x="473" y="252" text-anchor="middle">y = 0</text>
  <text class="muted" x="527" y="252" text-anchor="middle">y = 1</text>

  <!-- readings -->
  <text class="muted" x="40" y="278">Above r = 1: this y is likelier with the context than without it. Below: rarer.</text>
  <text class="muted" x="40" y="294">The critic is fixed only up to a factor depending on x alone, so its scale carries nothing.</text>
</svg>

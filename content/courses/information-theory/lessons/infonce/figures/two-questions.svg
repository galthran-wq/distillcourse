<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .box   { stroke: currentColor; stroke-opacity: 0.45; stroke-width: 1.2; fill: none; }
    .guide { stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
    .amberf { fill: #e2903a; }
    .bluef  { fill: #4c8dd6; }
    .amber  { fill: #e2903a; }
  </style>

  <!-- left panel -->
  <rect class="box" x="20" y="24" width="285" height="200" rx="6"/>
  <text class="label" x="36" y="46" font-weight="600">representation T</text>
  <!-- class scatter: amber class left, blue class right, separable -->
  <path class="guide" d="M162 62 L162 156"/>
  <text class="muted" x="166" y="72">linearly separable</text>
  <circle class="amberf" cx="52" cy="84" r="4"/>
  <circle class="amberf" cx="74" cy="118" r="4"/>
  <circle class="amberf" cx="96" cy="72" r="4"/>
  <circle class="amberf" cx="112" cy="134" r="4"/>
  <circle class="amberf" cx="70" cy="150" r="4"/>
  <circle class="amberf" cx="134" cy="100" r="4"/>
  <circle class="amberf" cx="52" cy="124" r="4"/>
  <circle class="bluef" cx="186" cy="92" r="4"/>
  <circle class="bluef" cx="212" cy="136" r="4"/>
  <circle class="bluef" cx="238" cy="78" r="4"/>
  <circle class="bluef" cx="258" cy="126" r="4"/>
  <circle class="bluef" cx="196" cy="150" r="4"/>
  <circle class="bluef" cx="272" cy="98" r="4"/>
  <circle class="bluef" cx="228" cy="110" r="4"/>
  <!-- certificate bar -->
  <text class="muted" x="36" y="182">certified by InfoNCE at N = 256</text>
  <rect class="amberf" x="36" y="190" width="200" height="14" rx="3"/>
  <text class="muted" x="244" y="202">8 bits</text>

  <!-- right panel -->
  <rect class="box" x="335" y="24" width="285" height="200" rx="6"/>
  <text class="label" x="351" y="46" font-weight="600">T&#8242; = an invertible scramble of T</text>
  <!-- same points, coordinates permuted: classes interleaved -->
  <text class="muted" x="351" y="72">not linearly separable</text>
  <circle class="amberf" cx="367" cy="96" r="4"/>
  <circle class="bluef" cx="391" cy="132" r="4"/>
  <circle class="amberf" cx="415" cy="84" r="4"/>
  <circle class="bluef" cx="437" cy="150" r="4"/>
  <circle class="amberf" cx="459" cy="118" r="4"/>
  <circle class="bluef" cx="481" cy="88" r="4"/>
  <circle class="amberf" cx="505" cy="146" r="4"/>
  <circle class="bluef" cx="527" cy="104" r="4"/>
  <circle class="amberf" cx="551" cy="130" r="4"/>
  <circle class="bluef" cx="575" cy="76" r="4"/>
  <circle class="amberf" cx="597" cy="112" r="4"/>
  <circle class="bluef" cx="379" cy="76" r="4"/>
  <circle class="amberf" cx="543" cy="80" r="4"/>
  <circle class="bluef" cx="597" cy="150" r="4"/>
  <!-- certificate bar, identical -->
  <text class="muted" x="351" y="182">certified by InfoNCE at N = 256</text>
  <rect class="amberf" x="351" y="190" width="200" height="14" rx="3"/>
  <text class="muted" x="559" y="202">8 bits</text>

  <!-- the shared fact underneath -->
  <path class="guide" d="M162 240 L478 240"/>
  <text class="label" x="320" y="264" text-anchor="middle">I(X; T) = I(X; T&#8242;): an invertible map moves no information</text>
  <text class="muted" x="320" y="286" text-anchor="middle">Same certificate, same mutual information, different usable representation.</text>
  <text class="muted" x="320" y="304" text-anchor="middle">The bound measures dependence; only a downstream probe measures usability.</text>
</svg>

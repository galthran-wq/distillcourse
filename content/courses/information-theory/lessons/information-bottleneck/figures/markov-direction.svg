<svg viewBox="0 0 560 240" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <marker id="md-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#e2903a" />
    </marker>
    <marker id="md-arrow-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#4c8dd6" />
    </marker>
  </defs>

  <rect x="8" y="10" width="266" height="216" rx="6" fill="none" stroke="#e2903a" stroke-width="1.2" />
  <text x="24" y="32" font-size="12.5" fill="#e2903a">the bottleneck: T is computed from X</text>

  <circle cx="140" cy="72" r="17" fill="none" stroke="currentColor" stroke-width="1.2" />
  <text x="140" y="77" font-size="13" fill="currentColor" text-anchor="middle">X</text>
  <circle cx="66" cy="144" r="17" fill="none" stroke="currentColor" stroke-width="1.2" />
  <text x="66" y="149" font-size="13" fill="currentColor" text-anchor="middle">Y</text>
  <circle cx="214" cy="144" r="17" fill="none" stroke="#e2903a" stroke-width="1.4" />
  <text x="214" y="149" font-size="13" fill="#e2903a" text-anchor="middle">T</text>
  <line x1="128" y1="86" x2="80" y2="130" stroke="currentColor" stroke-width="1" opacity="0.6" marker-end="url(#md-arrow)" />
  <line x1="152" y1="86" x2="200" y2="130" stroke="#e2903a" stroke-width="1.4" marker-end="url(#md-arrow)" />
  <text x="70" y="104" font-size="11" fill="currentColor" opacity="0.55">p(y|x)</text>
  <text x="182" y="104" font-size="11" fill="#e2903a">p(t|x)</text>
  <text x="24" y="190" font-size="11.5" fill="currentColor">p(y, x, t) = p(x) p(y|x) p(t|x)</text>
  <text x="24" y="208" font-size="11" fill="currentColor" opacity="0.55">no factor joins t and y</text>

  <rect x="286" y="10" width="266" height="216" rx="6" fill="none" stroke="#4c8dd6" stroke-width="1.2" stroke-dasharray="4 3" />
  <text x="302" y="32" font-size="12.5" fill="#4c8dd6">not this: T generates X</text>
  <text x="524" y="33" font-size="15" fill="#4c8dd6" text-anchor="middle">✗</text>

  <circle cx="336" cy="108" r="17" fill="none" stroke="#4c8dd6" stroke-width="1.4" />
  <text x="336" y="113" font-size="13" fill="#4c8dd6" text-anchor="middle">T</text>
  <circle cx="420" cy="108" r="17" fill="none" stroke="currentColor" stroke-width="1.2" />
  <text x="420" y="113" font-size="13" fill="currentColor" text-anchor="middle">X</text>
  <circle cx="504" cy="108" r="17" fill="none" stroke="currentColor" stroke-width="1.2" />
  <text x="504" y="113" font-size="13" fill="currentColor" text-anchor="middle">Y</text>
  <line x1="355" y1="108" x2="399" y2="108" stroke="#4c8dd6" stroke-width="1.4" marker-end="url(#md-arrow-b)" />
  <line x1="439" y1="108" x2="483" y2="108" stroke="currentColor" stroke-width="1" opacity="0.6" marker-end="url(#md-arrow-b)" />
  <text x="360" y="98" font-size="11" fill="#4c8dd6">p(x|t)</text>
  <text x="444" y="98" font-size="11" fill="currentColor" opacity="0.55">p(y|x)</text>
  <text x="302" y="190" font-size="11.5" fill="currentColor">p(t, x, y) = p(t) p(x|t) p(y|x)</text>
  <text x="302" y="208" font-size="11" fill="currentColor" opacity="0.55">T is inferred here, not computed</text>
</svg>

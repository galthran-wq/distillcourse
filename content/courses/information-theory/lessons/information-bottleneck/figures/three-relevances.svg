<svg viewBox="0 0 560 250" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <marker id="tr-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="currentColor" opacity="0.75" />
    </marker>
  </defs>

  <text x="14" y="74" font-size="12" fill="currentColor">X: speech waveform, 16 kHz</text>
  <rect x="14" y="84" width="140" height="72" rx="6" fill="none" stroke="currentColor" stroke-width="1" opacity="0.55" />
  <polyline
    points="22,120 26,104 30,132 34,110 38,138 42,100 46,128 50,112 54,134 58,98 62,126 66,116 70,140 74,102 78,130 82,108 86,136 90,106 94,132 98,114 102,138 106,100 110,128 114,110 118,134 122,104 126,126 130,118 134,132 138,108 142,124 146,120"
    fill="none" stroke="#4c8dd6" stroke-width="1.4" />
  <text x="14" y="172" font-size="11" fill="currentColor" opacity="0.55">one distortion measure d(x, x̂)</text>
  <text x="14" y="186" font-size="11" fill="currentColor" opacity="0.55">must serve all three targets</text>

  <path d="M158,116 C196,116 200,49 244,49" fill="none" stroke="currentColor" stroke-width="1" opacity="0.75" marker-end="url(#tr-arrow)" />
  <path d="M158,120 C196,120 200,121 244,121" fill="none" stroke="currentColor" stroke-width="1" opacity="0.75" marker-end="url(#tr-arrow)" />
  <path d="M158,124 C196,124 200,193 244,193" fill="none" stroke="currentColor" stroke-width="1" opacity="0.75" marker-end="url(#tr-arrow)" />

  <rect x="248" y="22" width="298" height="54" rx="5" fill="none" stroke="currentColor" stroke-width="1" opacity="0.35" />
  <text x="260" y="41" font-size="12.5" fill="#e2903a">Y = the transcript</text>
  <text x="260" y="57" font-size="11" fill="currentColor" opacity="0.72">T keeps: which phonemes, in which order</text>
  <text x="260" y="70" font-size="11" fill="currentColor" opacity="0.55">T discards: pitch, timbre, room, rate</text>

  <rect x="248" y="94" width="298" height="54" rx="5" fill="none" stroke="currentColor" stroke-width="1" opacity="0.35" />
  <text x="260" y="113" font-size="12.5" fill="#e2903a">Y = the speaker's identity</text>
  <text x="260" y="129" font-size="11" fill="currentColor" opacity="0.72">T keeps: pitch, timbre, formant shape</text>
  <text x="260" y="142" font-size="11" fill="currentColor" opacity="0.55">T discards: the words themselves</text>

  <rect x="248" y="166" width="298" height="54" rx="5" fill="none" stroke="currentColor" stroke-width="1" opacity="0.35" />
  <text x="260" y="185" font-size="12.5" fill="#e2903a">Y = the part-of-speech tag</text>
  <text x="260" y="201" font-size="11" fill="currentColor" opacity="0.72">T keeps: the word's grammatical class</text>
  <text x="260" y="214" font-size="11" fill="currentColor" opacity="0.55">T discards: which word within the class</text>

  <text x="14" y="240" font-size="11.5" fill="currentColor" opacity="0.55">Relevance is a choice of Y, and the same X supports three incompatible choices.</text>
</svg>

<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="14">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .x-bar { fill: #e2903a; }
    .y-bar { fill: #4c8dd6; }
    .x-text { fill: #e2903a; font-weight: 600; }
    .y-text { fill: #4c8dd6; font-weight: 600; }
    .g-text { fill: #5aa46a; font-weight: 600; }
  </style>

  <!-- guides at the overlap edges -->
  <line x1="303" y1="30" x2="303" y2="216" stroke="currentColor" stroke-dasharray="3 3" opacity="0.4"/>
  <line x1="390" y1="30" x2="390" y2="216" stroke="currentColor" stroke-dasharray="3 3" opacity="0.4"/>

  <!-- H(X,Y): the whole interval -->
  <text class="label" x="100" y="59" text-anchor="end" font-weight="600">H(X,Y)</text>
  <rect x="110" y="40" width="420" height="28" rx="4" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.5"/>
  <text class="muted" x="536" y="59">1.5</text>

  <!-- H(X): left part -->
  <text class="x-text" x="100" y="107" text-anchor="end" font-size="13">H(X)</text>
  <rect class="x-bar" x="110" y="88" width="280" height="28" rx="4"/>
  <text class="muted" x="398" y="107">1.0</text>

  <!-- H(Y): right part -->
  <text class="y-text" x="100" y="155" text-anchor="end" font-size="13">H(Y)</text>
  <rect class="y-bar" x="303" y="136" width="227" height="28" rx="4"/>
  <text class="muted" x="536" y="155">0.811</text>

  <!-- overlap shading across the two marginal rows -->
  <rect x="303" y="88" width="87" height="76" fill="#5aa46a" fill-opacity="0.3"/>

  <!-- the crescents: conditional entropies -->
  <rect x="110" y="184" width="193" height="28" rx="4" fill="#e2903a" fill-opacity="0.4" stroke="#e2903a"/>
  <rect x="390" y="184" width="140" height="28" rx="4" fill="#4c8dd6" fill-opacity="0.4" stroke="#4c8dd6"/>
  <text class="x-text" x="206" y="232" text-anchor="middle" font-size="13">H(X|Y) = 0.689</text>
  <text class="y-text" x="460" y="232" text-anchor="middle" font-size="13">H(Y|X) = 0.5</text>

  <text class="g-text" x="346" y="262" text-anchor="middle" font-size="13">overlap 0.311 bits</text>
  <text class="muted" x="346" y="280" text-anchor="middle">(named in the next lesson)</text>
  <text class="muted" x="320" y="308" text-anchor="middle">H(X) and H(Y) together overshoot the 1.5-bit total by exactly the overlap</text>
</svg>

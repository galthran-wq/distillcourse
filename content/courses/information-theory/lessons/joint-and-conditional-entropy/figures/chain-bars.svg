<svg viewBox="0 0 640 270" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="14">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .m-bar { fill: #e2903a; }
    .c-bar { fill: #4c8dd6; }
    .m-text { fill: #e2903a; font-weight: 600; }
    .c-text { fill: #4c8dd6; font-weight: 600; }
  </style>

  <!-- guides marking the shared total -->
  <line x1="90" y1="34" x2="90" y2="218" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5"/>
  <line x1="510" y1="34" x2="510" y2="218" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5"/>

  <!-- total -->
  <text class="label" x="300" y="30" text-anchor="middle" font-weight="600">H(X,Y) = 1.5 bits</text>
  <rect x="90" y="40" width="420" height="30" rx="4" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.5"/>

  <!-- split 1: learn X first -->
  <text class="muted" x="80" y="131" text-anchor="end">learn X first</text>
  <text class="m-text" x="230" y="104" text-anchor="middle" font-size="13">H(X) = 1</text>
  <text class="c-text" x="440" y="104" text-anchor="middle" font-size="13">H(Y|X) = 0.5</text>
  <rect class="m-bar" x="90" y="112" width="280" height="30" rx="4"/>
  <rect class="c-bar" x="370" y="112" width="140" height="30" rx="4"/>

  <!-- split 2: learn Y first -->
  <text class="muted" x="80" y="203" text-anchor="end">learn Y first</text>
  <text class="m-text" x="204" y="176" text-anchor="middle" font-size="13">H(Y) = 0.811</text>
  <text class="c-text" x="414" y="176" text-anchor="middle" font-size="13">H(X|Y) = 0.689</text>
  <rect class="m-bar" x="90" y="184" width="227" height="30" rx="4"/>
  <rect class="c-bar" x="317" y="184" width="193" height="30" rx="4"/>

  <text class="muted" x="320" y="250" text-anchor="middle">one 1.5-bit total, split as marginal (orange) plus conditional (blue) in either order</text>
</svg>

<svg viewBox="0 0 640 310" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="14">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .p-bar { fill: #4c8dd6; }
    .n-bar { fill: currentColor; opacity: 0.22; }
    .p-text { fill: #4c8dd6; font-weight: 600; }
    .i-text { fill: #e2903a; font-weight: 600; }
  </style>
  <text class="label" x="30" y="26" font-weight="600">Step 3: sum the weighted row entropies</text>

  <!-- row: given clear -->
  <g transform="translate(30,72)">
    <text class="label" x="0" y="20" font-weight="600">X = clear</text>
    <text class="p-text" x="0" y="42" font-size="12">weight p(clear) = 1/2</text>
    <rect class="p-bar" x="150" y="0" width="200" height="28" rx="3"/>
    <text class="muted" x="250" y="48" text-anchor="middle">p(dry | clear) = 1, p(wet | clear) = 0</text>
    <text class="i-text" x="375" y="20" font-size="13">H(Y | X=clear) = 0 bits</text>
  </g>

  <!-- row: given overcast -->
  <g transform="translate(30,162)">
    <text class="label" x="0" y="20" font-weight="600">X = overcast</text>
    <text class="p-text" x="0" y="42" font-size="12">weight p(overcast) = 1/2</text>
    <rect class="p-bar" x="150" y="0" width="100" height="28" rx="3"/>
    <rect class="n-bar" x="250" y="0" width="100" height="28" rx="3"/>
    <text class="muted" x="250" y="48" text-anchor="middle">p(dry | overcast) = 1/2, p(wet | overcast) = 1/2</text>
    <text class="i-text" x="375" y="20" font-size="13">H(Y | X=overcast) = 1 bit</text>
  </g>

  <line x1="70" y1="232" x2="570" y2="232" stroke="currentColor" stroke-width="1" opacity="0.35"/>
  <text class="label" x="320" y="266" text-anchor="middle" font-size="16">H(Y | X) = <tspan class="p-text">1/2</tspan>&#183;<tspan class="i-text">0</tspan> + <tspan class="p-text">1/2</tspan>&#183;<tspan class="i-text">1</tspan> = 0.5 bits</text>
  <text class="muted" x="320" y="290" text-anchor="middle">row entropies (orange) weighted by row probabilities (blue), then summed</text>
</svg>

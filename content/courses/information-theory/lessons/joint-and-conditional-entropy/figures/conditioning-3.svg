<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="14">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .cell { fill: none; stroke: currentColor; stroke-opacity: 0.35; }
    .y-bar { fill: #4c8dd6; }
    .y-text { fill: #4c8dd6; font-weight: 600; }
    .a-text { fill: #e2903a; font-weight: 600; }
  </style>
  <text class="label" x="30" y="26" font-weight="600">Deterministic: H(Y|X) = 0</text>

  <g transform="translate(70,70)">
    <text class="label" x="40" y="-12" text-anchor="middle" font-weight="600">dry</text>
    <text class="label" x="120" y="-12" text-anchor="middle" font-weight="600">wet</text>
    <text class="label" x="-10" y="28" text-anchor="end" font-weight="600">clear</text>
    <text class="label" x="-10" y="74" text-anchor="end" font-weight="600">overcast</text>
    <rect class="cell" x="0" y="0" width="80" height="46" rx="4"/>
    <rect class="cell" x="80" y="0" width="80" height="46" rx="4"/>
    <rect class="cell" x="0" y="46" width="80" height="46" rx="4"/>
    <rect class="cell" x="80" y="46" width="80" height="46" rx="4"/>
    <text class="label" x="40" y="28" text-anchor="middle">3/4</text>
    <text class="muted" x="120" y="28" text-anchor="middle">0</text>
    <text class="muted" x="40" y="74" text-anchor="middle">0</text>
    <text class="label" x="120" y="74" text-anchor="middle">1/4</text>
    <text class="muted" x="80" y="120" text-anchor="middle">column sums 3/4, 1/4</text>
  </g>

  <g transform="translate(340,84)">
    <text class="y-text" x="0" y="0" font-size="13">H(Y) = 0.811 bits</text>
    <rect class="y-bar" x="0" y="8" width="227" height="24" rx="3"/>
    <text class="a-text" x="0" y="64" font-size="13">H(Y|X) = 0 bits</text>
    <line x1="0" y1="72" x2="0" y2="96" stroke="#e2903a" stroke-width="2.5"/>
  </g>

  <text class="muted" x="320" y="248" text-anchor="middle">every row is certain: the sky determines rain, and no uncertainty about Y remains</text>
  <text class="muted" x="320" y="272" text-anchor="middle">column sums, hence H(Y), are the same in all three frames; only the coupling changes</text>
</svg>

<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="14">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .cell { fill: none; stroke: currentColor; stroke-opacity: 0.35; }
    .m-text { fill: #4c8dd6; font-weight: 600; }
    .a-text { fill: #e2903a; font-weight: 600; }
  </style>

  <g transform="translate(120,84)">
    <!-- axis labels -->
    <text class="muted" x="100" y="-38" text-anchor="middle">rain Y</text>
    <text class="muted" x="-14" y="-14" text-anchor="end">sky X</text>
    <text class="label" x="50" y="-14" text-anchor="middle" font-weight="600">dry</text>
    <text class="label" x="150" y="-14" text-anchor="middle" font-weight="600">wet</text>
    <text class="label" x="-14" y="33" text-anchor="end" font-weight="600">clear</text>
    <text class="label" x="-14" y="89" text-anchor="end" font-weight="600">overcast</text>

    <!-- cells -->
    <rect x="0" y="0" width="100" height="56" rx="4" fill="#e2903a" fill-opacity="0.18" stroke="#e2903a" stroke-width="1.5"/>
    <rect class="cell" x="100" y="0" width="100" height="56" rx="4"/>
    <rect class="cell" x="0" y="56" width="100" height="56" rx="4"/>
    <rect class="cell" x="100" y="56" width="100" height="56" rx="4"/>
    <text class="a-text" x="50" y="33" text-anchor="middle">1/2</text>
    <text class="muted" x="150" y="33" text-anchor="middle">0</text>
    <text class="label" x="50" y="89" text-anchor="middle">1/4</text>
    <text class="label" x="150" y="89" text-anchor="middle">1/4</text>

    <!-- marginal p(x): row sums -->
    <line x1="212" y1="-4" x2="212" y2="116" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5"/>
    <text class="m-text" x="248" y="-14" text-anchor="middle" font-size="13">p(x)</text>
    <text class="m-text" x="248" y="33" text-anchor="middle">1/2</text>
    <text class="m-text" x="248" y="89" text-anchor="middle">1/2</text>

    <!-- marginal p(y): column sums -->
    <line x1="-4" y1="124" x2="204" y2="124" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5"/>
    <text class="m-text" x="-14" y="152" text-anchor="end" font-size="13">p(y)</text>
    <text class="m-text" x="50" y="152" text-anchor="middle">3/4</text>
    <text class="m-text" x="150" y="152" text-anchor="middle">1/4</text>
    <text class="muted" x="248" y="152" text-anchor="middle">1</text>
  </g>

  <!-- highlighted-cell annotation -->
  <g transform="translate(438,120)">
    <text class="a-text" x="0" y="0" font-size="13">cell (clear, dry): p = 1/2</text>
    <text class="label" x="0" y="24" font-size="13">surprisal 1 bit, weight 1/2</text>
    <text class="label" x="0" y="48" font-size="13">&#8594; 0.5 bits of H(X,Y)</text>
  </g>

  <text class="muted" x="320" y="300" text-anchor="middle">row sums give <tspan class="m-text">p(x)</tspan>, column sums give <tspan class="m-text">p(y)</tspan>; the four cells sum to 1</text>
</svg>

<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="14">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .y-bar { fill: #4c8dd6; }
    .a-bar { fill: #e2903a; }
    .y-text { fill: #4c8dd6; font-weight: 600; }
    .a-text { fill: #e2903a; font-weight: 600; }
  </style>

  <!-- the H(Y) guide, dropped through the conditional bars -->
  <line x1="430" y1="34" x2="430" y2="252" stroke="#4c8dd6" stroke-dasharray="3 3" opacity="0.6"/>

  <!-- marginal -->
  <text class="y-text" x="160" y="61" text-anchor="end" font-size="13">H(Y)</text>
  <rect class="y-bar" x="170" y="42" width="260" height="26" rx="3"/>
  <text class="muted" x="438" y="61">0.811 bits, before looking</text>

  <!-- row: clear -->
  <text class="label" x="160" y="119" text-anchor="end" font-size="13">H(Y | X = clear)</text>
  <line x1="170" y1="98" x2="170" y2="126" stroke="#e2903a" stroke-width="3"/>
  <text class="muted" x="180" y="119">0 bits &#183; weight 1/2 &#183; the sky settles it</text>

  <!-- row: overcast -->
  <text class="label" x="160" y="167" text-anchor="end" font-size="13">H(Y | X = overcast)</text>
  <rect class="a-bar" x="170" y="148" width="320" height="26" rx="3"/>
  <text class="a-text" x="498" y="167" font-size="12">1 bit &#183; weight 1/2</text>
  <text class="a-text" x="460" y="196" font-size="12">above H(Y)</text>

  <!-- the average -->
  <text class="label" x="160" y="235" text-anchor="end" font-size="13" font-weight="600">H(Y | X)</text>
  <rect x="170" y="216" width="160" height="26" rx="3" fill="#e2903a" fill-opacity="0.4" stroke="#e2903a" stroke-width="1.5"/>
  <text class="muted" x="338" y="235">0.5 bits = 1/2(0) + 1/2(1)</text>

  <text class="muted" x="320" y="284" text-anchor="middle">one row sits above the dashed H(Y) line; the average of the rows cannot</text>
</svg>

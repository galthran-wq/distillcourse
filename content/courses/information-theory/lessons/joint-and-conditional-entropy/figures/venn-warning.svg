<svg viewBox="0 0 640 350" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="14">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .a-text { fill: #e2903a; font-weight: 600; }
    .ring { fill: none; stroke: currentColor; stroke-opacity: 0.75; stroke-width: 1.5; }
  </style>

  <clipPath id="cA"><circle cx="140" cy="175" r="62"/></clipPath>
  <clipPath id="cX"><circle cx="432" cy="168" r="64"/></clipPath>
  <clipPath id="cY"><circle cx="508" cy="168" r="64"/></clipPath>

  <!-- LEFT PANEL: two variables -->
  <text class="label" x="170" y="46" text-anchor="middle" font-weight="600" font-size="13">two variables</text>
  <text class="muted" x="170" y="66" text-anchor="middle">all three regions are &#8805; 0</text>

  <circle cx="140" cy="175" r="62" fill="#e2903a" fill-opacity="0.14" stroke="#e2903a" stroke-width="1.5"/>
  <circle cx="230" cy="175" r="62" fill="#4c8dd6" fill-opacity="0.14" stroke="#4c8dd6" stroke-width="1.5"/>
  <g clip-path="url(#cA)">
    <circle cx="230" cy="175" r="62" fill="#5aa46a" fill-opacity="0.4"/>
  </g>
  <text class="label" x="118" y="180" text-anchor="middle" font-size="11">H(X|Y)</text>
  <text class="label" x="252" y="180" text-anchor="middle" font-size="11">H(Y|X)</text>
  <text class="muted" x="106" y="200" text-anchor="middle">0.689</text>
  <text class="muted" x="264" y="200" text-anchor="middle">0.5</text>
  <line x1="185" y1="140" x2="185" y2="108" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5"/>
  <text class="muted" x="185" y="100" text-anchor="middle">overlap 0.311</text>
  <text class="label" x="96" y="262" text-anchor="middle" font-size="12">H(X)</text>
  <text class="label" x="274" y="262" text-anchor="middle" font-size="12">H(Y)</text>
  <text class="muted" x="170" y="304" text-anchor="middle">0.689 + 0.311 + 0.5 = 1.5 = H(X,Y)</text>
  <text class="muted" x="170" y="324" text-anchor="middle">on the weather table</text>

  <!-- divider -->
  <line x1="315" y1="40" x2="315" y2="330" stroke="currentColor" stroke-dasharray="2 4" opacity="0.3"/>

  <!-- RIGHT PANEL: three variables -->
  <text class="label" x="470" y="46" text-anchor="middle" font-weight="600" font-size="13">three variables</text>
  <text class="muted" x="470" y="66" text-anchor="middle">the centre region is forced negative</text>

  <!-- the triple intersection, shaded -->
  <g clip-path="url(#cX)">
    <g clip-path="url(#cY)">
      <circle cx="470" cy="228" r="64" fill="#e2903a" fill-opacity="0.55"/>
    </g>
  </g>

  <circle class="ring" cx="432" cy="168" r="64"/>
  <circle class="ring" cx="508" cy="168" r="64"/>
  <circle class="ring" cx="470" cy="228" r="64"/>

  <text class="label" x="392" y="136" text-anchor="middle" font-size="12">X</text>
  <text class="label" x="548" y="136" text-anchor="middle" font-size="12">Y</text>
  <text class="label" x="470" y="284" text-anchor="middle" font-size="12">Z</text>
  <text class="a-text" x="470" y="196" text-anchor="middle" font-size="12">&#8722;1</text>

  <text class="muted" x="470" y="304" text-anchor="middle">X, Y independent fair bits, Z = X &#8853; Y:</text>
  <text class="muted" x="470" y="324" text-anchor="middle">the centre must hold &#8722;1 bit</text>
</svg>

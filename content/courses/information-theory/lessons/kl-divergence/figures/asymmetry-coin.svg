<svg viewBox="0 0 620 322" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <style>
    .lbl { fill: currentColor; font-size: 12px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .truth { fill: #4c8dd6; }
    .hd { fill: currentColor; font-size: 12px; font-weight: bold; }
  </style>

  <!--  left panel: truth = fair coin  -->
  <rect x="20" y="16" width="262" height="252" rx="6" fill="none" stroke="currentColor" opacity="0.25"/>
  <text class="hd" x="36" y="38">D(P&#8214;Q) = &#8734;</text>
  <text class="muted" x="36" y="55">fair-coin data, coded for &#8220;always heads&#8221;</text>

  <!-- bars: truth P (blue solid), model Q (amber outline) -->
  <text class="muted" x="36" y="76">heads</text>
  <rect class="truth" x="36" y="82" width="90" height="18" rx="3"/>
  <rect x="36" y="104" width="180" height="18" rx="3" fill="none" stroke="#e2903a" stroke-width="2"/>
  <text class="muted" x="36" y="142">tails</text>
  <rect class="truth" x="36" y="148" width="90" height="18" rx="3"/>
  <rect x="36" y="170" width="2" height="18" fill="none" stroke="#e2903a" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="48" y="184" font-size="11" fill="#e2903a" font-weight="bold">Q(tails) = 0</text>

  <text x="132" y="96" font-size="11" fill="#4c8dd6">P = 1/2</text>
  <text x="222" y="118" font-size="11" fill="#e2903a">Q = 1</text>
  <text x="132" y="162" font-size="11" fill="#4c8dd6">P = 1/2</text>

  <!-- the two terms -->
  <text class="lbl" x="36" y="216">&#189;&#183;log&#8322;(&#189;/1) = &#8722;0.5</text>
  <ellipse cx="150" cy="240" rx="112" ry="16" fill="none" stroke="#e2903a" stroke-width="2"/>
  <text x="150" y="244" font-size="12" fill="#e2903a" text-anchor="middle" font-weight="bold">&#189;&#183;log&#8322;(&#189;/0) = +&#8734;</text>

  <!--  right panel: truth = always heads  -->
  <rect x="338" y="16" width="262" height="252" rx="6" fill="none" stroke="currentColor" opacity="0.25"/>
  <text class="hd" x="354" y="38">D(Q&#8214;P) = 1 bit</text>
  <text class="muted" x="354" y="55">always-heads data, coded for the fair coin</text>

  <text class="muted" x="354" y="76">heads</text>
  <rect class="truth" x="354" y="82" width="180" height="18" rx="3"/>
  <rect x="354" y="104" width="90" height="18" rx="3" fill="none" stroke="#e2903a" stroke-width="2"/>
  <text class="muted" x="354" y="142">tails</text>
  <rect class="truth" x="354" y="148" width="2" height="18"/>
  <rect x="354" y="170" width="90" height="18" rx="3" fill="none" stroke="#e2903a" stroke-width="2"/>

  <text x="540" y="96" font-size="11" fill="#4c8dd6">Q = 1</text>
  <text x="450" y="118" font-size="11" fill="#e2903a">P = 1/2</text>
  <text x="366" y="162" font-size="11" fill="#4c8dd6">Q = 0</text>
  <text x="450" y="184" font-size="11" fill="#e2903a">P = 1/2</text>

  <text class="lbl" x="354" y="216">1&#183;log&#8322;(1/&#189;) = +1</text>
  <text class="lbl" x="354" y="244">0&#183;log&#8322;(0/&#189;) = 0 by convention</text>

  <!-- the swap -->
  <text x="310" y="140" font-size="20" fill="currentColor" text-anchor="middle" font-weight="bold">&#8800;</text>
  <path d="M292 158 L328 158" stroke="currentColor" stroke-width="1.5"/>
  <path d="M292 158 l7 -5 M292 158 l7 5 M328 158 l-7 -5 M328 158 l-7 5" stroke="currentColor" stroke-width="1.5" fill="none"/>
  <text x="310" y="178" font-size="11" fill="currentColor" text-anchor="middle" opacity="0.55">swap</text>

  <text x="310" y="296" font-size="12" fill="currentColor" text-anchor="middle">blue = the distribution generating the data &#183; amber = the distribution the code was built for</text>
  <text x="310" y="314" font-size="12" fill="currentColor" text-anchor="middle" font-weight="bold">the expectation is taken under whichever distribution is real</text>
</svg>

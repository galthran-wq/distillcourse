<svg viewBox="0 0 600 278" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <style>
    .lbl { fill: currentColor; font-size: 12px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .floor { fill: #4c8dd6; }
    .miss { fill: #e2903a; }
  </style>

  <!-- identity, colour-bound to the segments below -->
  <text class="lbl" x="60" y="22">expected length  =</text>
  <text x="182" y="22" font-size="12" fill="#4c8dd6">H(p)</text>
  <text class="lbl" x="216" y="22">+</text>
  <text x="230" y="22" font-size="12" fill="#e2903a">D(p&#8214;q)</text>

  <!-- top bar: the code built for q -->
  <text class="lbl" x="60" y="58">code built for q, lengths (1, 2, 3, 3)</text>
  <rect class="floor" x="60" y="66" width="292" height="30" rx="3"/>
  <rect class="miss" x="352" y="66" width="146" height="30" rx="3"/>
  <text x="70" y="86" font-size="12" fill="#ffffff">H(p) = 1.75</text>
  <text x="362" y="86" font-size="12" fill="#ffffff">0.875</text>
  <text class="lbl" x="506" y="86">2.625</text>
  <line x1="425" y1="98" x2="425" y2="116" stroke="#e2903a"/>
  <text x="425" y="130" font-size="11" fill="#e2903a" text-anchor="middle" font-weight="bold">avoidable: the price of the wrong bet</text>

  <!-- bottom bar: the code built for p -->
  <text class="lbl" x="60" y="164">code built for p, lengths (3, 3, 2, 1)</text>
  <rect class="floor" x="60" y="172" width="292" height="30" rx="3"/>
  <text x="70" y="192" font-size="12" fill="#ffffff">H(p) = 1.75</text>
  <text class="lbl" x="362" y="192">1.75</text>
  <line x1="206" y1="204" x2="206" y2="216" stroke="#4c8dd6"/>
  <text x="206" y="228" font-size="11" fill="#4c8dd6" text-anchor="middle" font-weight="bold">unavoidable: no lossless code goes below it</text>

  <!-- shared axis -->
  <line x1="60" y1="240" x2="560" y2="240" stroke="currentColor" opacity="0.4"/>
  <g stroke="currentColor" opacity="0.4">
    <line x1="60" y1="240" x2="60" y2="245"/>
    <line x1="227" y1="240" x2="227" y2="245"/>
    <line x1="393" y1="240" x2="393" y2="245"/>
    <line x1="560" y1="240" x2="560" y2="245"/>
  </g>
  <g class="muted" text-anchor="middle">
    <text x="60" y="258">0</text>
    <text x="227" y="258">1</text>
    <text x="393" y="258">2</text>
    <text x="560" y="258">3</text>
  </g>
  <text class="muted" x="310" y="274" text-anchor="middle">bits per symbol, source p = (1/8, 1/8, 1/4, 1/2)</text>
</svg>

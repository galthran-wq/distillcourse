<svg viewBox="0 0 600 364" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="60" y="22" font-size="13" fill="currentColor">a code built for q, used on data from p</text>
  <text x="545" y="22" font-size="13" font-weight="bold" fill="#e2903a" text-anchor="end">2 &#183; ideal lengths for p</text>
  <text x="60" y="42" font-size="11" fill="#e2903a">&#8467;q(x) = &#8722;log&#8322; q(x) &#8212; the code&#8217;s lengths</text>
  <text x="330" y="42" font-size="11" fill="#4c8dd6">&#8467;p(x) = &#8722;log&#8322; p(x) &#8212; ideal for p</text>

  <!-- grid -->
  <g stroke="currentColor" opacity="0.12">
    <line x1="60" y1="210" x2="560" y2="210"/>
    <line x1="60" y1="150" x2="560" y2="150"/>
    <line x1="60" y1="90" x2="560" y2="90"/>
  </g>

  <!-- axes -->
  <line x1="60" y1="270" x2="560" y2="270" stroke="currentColor"/>
  <line x1="60" y1="270" x2="60" y2="52" stroke="currentColor"/>
  <g font-size="11" fill="currentColor" text-anchor="end" opacity="0.55">
    <text x="53" y="274">0</text>
    <text x="53" y="214">1</text>
    <text x="53" y="154">2</text>
    <text x="53" y="94">3</text>
  </g>
  <text x="20" y="160" font-size="12" fill="currentColor" text-anchor="middle" transform="rotate(-90 20 160)">codeword length (bits)</text>

  <!-- amber bars: q-code lengths 1,2,3,3 -->
  <g fill="#e2903a">
    <rect x="94" y="210" width="32" height="60" rx="3"/>
    <rect x="214" y="150" width="32" height="120" rx="3"/>
    <rect x="334" y="90" width="32" height="180" rx="3"/>
    <rect x="454" y="90" width="32" height="180" rx="3"/>
  </g>
  <g font-size="11" fill="#e2903a" text-anchor="middle" font-weight="bold">
    <text x="110" y="202">1</text>
    <text x="230" y="142">2</text>
    <text x="350" y="82">3</text>
    <text x="470" y="82">3</text>
  </g>

  <!-- blue bars: ideal lengths for p 3,3,2,1 -->
  <g fill="#4c8dd6">
    <rect x="134" y="90" width="32" height="180" rx="3"/>
    <rect x="254" y="90" width="32" height="180" rx="3"/>
    <rect x="374" y="150" width="32" height="120" rx="3"/>
    <rect x="494" y="210" width="32" height="60" rx="3"/>
  </g>
  <g font-size="11" fill="#4c8dd6" text-anchor="middle" font-weight="bold">
    <text x="150" y="82">3</text>
    <text x="270" y="82">3</text>
    <text x="390" y="142">2</text>
    <text x="510" y="202">1</text>
  </g>

  <!-- symbol row -->
  <g font-size="12" fill="currentColor" text-anchor="middle" font-weight="bold">
    <text x="130" y="292">A</text>
    <text x="250" y="292">B</text>
    <text x="370" y="292">C</text>
    <text x="490" y="292">D</text>
  </g>

  <!-- q row -->
  <text x="52" y="310" font-size="11" fill="#e2903a" text-anchor="end">q(x)</text>
  <g font-size="11" fill="#e2903a" text-anchor="middle">
    <text x="130" y="310">1/2</text>
    <text x="250" y="310">1/4</text>
    <text x="370" y="310">1/8</text>
    <text x="490" y="310">1/8</text>
  </g>

  <!-- p row -->
  <text x="52" y="326" font-size="11" fill="#4c8dd6" text-anchor="end">p(x)</text>
  <g font-size="11" fill="#4c8dd6" text-anchor="middle">
    <text x="130" y="326">1/8</text>
    <text x="250" y="326">1/8</text>
    <text x="370" y="326">1/4</text>
    <text x="490" y="326">1/2</text>
  </g>
</svg>

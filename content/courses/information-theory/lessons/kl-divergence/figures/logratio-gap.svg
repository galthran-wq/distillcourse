<svg viewBox="0 0 560 292" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <style>
    .lbl { fill: currentColor; font-size: 12px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .model { fill: #e2903a; }
    .truth { fill: #4c8dd6; }
  </style>

  <!-- the log-ratio, colour-bound to the bars below -->
  <text class="lbl" x="24" y="26">log&#8322; p(x)/q(x)  =</text>
  <text x="136" y="26" font-size="12" fill="#e2903a">&#8722;log&#8322; q(x) (model)</text>
  <text class="lbl" x="272" y="26">&#8722;</text>
  <text x="288" y="26" font-size="12" fill="#4c8dd6">&#8722;log&#8322; p(x) (truth)</text>

  <!-- surprisal axis -->
  <text class="muted" x="62" y="96" text-anchor="middle">bits</text>
  <line x1="62" y1="104" x2="62" y2="200" stroke="currentColor" opacity="0.4"/>
  <g stroke="currentColor" opacity="0.4">
    <line x1="57" y1="200" x2="62" y2="200"/>
    <line x1="57" y1="170" x2="62" y2="170"/>
    <line x1="57" y1="140" x2="62" y2="140"/>
    <line x1="57" y1="110" x2="62" y2="110"/>
  </g>
  <g class="muted" text-anchor="end">
    <text x="52" y="204">0</text>
    <text x="52" y="174">1</text>
    <text x="52" y="144">2</text>
    <text x="52" y="114">3</text>
  </g>
  <line x1="62" y1="200" x2="500" y2="200" stroke="currentColor" opacity="0.4"/>

  <!-- symbol A: the model is less surprised than the truth -->
  <text class="lbl" x="145" y="66" text-anchor="middle">x = A:  p = 1/8, q = 1/2</text>
  <rect class="model" x="90" y="170" width="34" height="30" rx="3"/>
  <rect class="truth" x="138" y="110" width="34" height="90" rx="3"/>
  <line x1="90" y1="170" x2="190" y2="170" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5"/>
  <g stroke="currentColor" opacity="0.7">
    <line x1="190" y1="110" x2="190" y2="170"/>
    <line x1="185" y1="110" x2="195" y2="110"/>
    <line x1="185" y1="170" x2="195" y2="170"/>
  </g>
  <text class="muted" x="199" y="144">2 bits</text>
  <text class="muted" x="107" y="214" text-anchor="middle">model</text>
  <text class="muted" x="155" y="214" text-anchor="middle">truth</text>
  <text class="lbl" x="145" y="236" text-anchor="middle">log-ratio = 1 &#8722; 3 = &#8722;2 bits</text>
  <text class="muted" x="145" y="254" text-anchor="middle">summand = 1/8 &#215; (&#8722;2) = &#8722;0.25 bits</text>

  <!-- symbol D: the model is more surprised than the truth -->
  <text class="lbl" x="385" y="66" text-anchor="middle">x = D:  p = 1/2, q = 1/8</text>
  <rect class="model" x="330" y="110" width="34" height="90" rx="3"/>
  <rect class="truth" x="378" y="170" width="34" height="30" rx="3"/>
  <line x1="378" y1="170" x2="430" y2="170" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5"/>
  <g stroke="currentColor" opacity="0.7">
    <line x1="430" y1="110" x2="430" y2="170"/>
    <line x1="425" y1="110" x2="435" y2="110"/>
    <line x1="425" y1="170" x2="435" y2="170"/>
  </g>
  <text class="muted" x="439" y="144">2 bits</text>
  <text class="muted" x="347" y="214" text-anchor="middle">model</text>
  <text class="muted" x="395" y="214" text-anchor="middle">truth</text>
  <text class="lbl" x="385" y="236" text-anchor="middle">log-ratio = 3 &#8722; 1 = +2 bits</text>
  <text class="muted" x="385" y="254" text-anchor="middle">summand = 1/2 &#215; (+2) = +1.00 bits</text>

  <text class="muted" x="280" y="282" text-anchor="middle">weighted under p, which emits D four times as often as A</text>
</svg>

<svg viewBox="0 0 620 336" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <style>
    .lbl { fill: currentColor; font-size: 12px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .cell { fill: none; stroke: currentColor; stroke-opacity: 0.45; }
    .val { fill: currentColor; font-size: 13px; text-anchor: middle; }
  </style>

  <!--  left: the true joint  -->
  <text class="lbl" x="60" y="26" font-weight="bold">joint p(x, y)</text>
  <g class="muted" text-anchor="middle">
    <text x="105" y="48">dry</text>
    <text x="195" y="48">wet</text>
  </g>
  <text class="muted" x="54" y="84" text-anchor="end">clear</text>
  <text class="muted" x="54" y="134" text-anchor="end">overcast</text>

  <rect x="60" y="56" width="90" height="50" fill="#e2903a" opacity="0.22"/>
  <rect x="150" y="56" width="90" height="50" fill="#4c8dd6" opacity="0.22"/>
  <rect x="60" y="106" width="90" height="50" fill="#4c8dd6" opacity="0.22"/>
  <rect x="150" y="106" width="90" height="50" fill="#e2903a" opacity="0.22"/>
  <g class="cell">
    <rect x="60" y="56" width="90" height="50"/>
    <rect x="150" y="56" width="90" height="50"/>
    <rect x="60" y="106" width="90" height="50"/>
    <rect x="150" y="106" width="90" height="50"/>
  </g>
  <g class="val">
    <text x="105" y="86">1/2</text>
    <text x="195" y="86">0</text>
    <text x="105" y="136">1/4</text>
    <text x="195" y="136">1/4</text>
  </g>
  <g class="muted" text-anchor="middle">
    <text x="105" y="174">3/4</text>
    <text x="195" y="174">1/4</text>
    <text x="258" y="86">1/2</text>
    <text x="258" y="136">1/2</text>
  </g>

  <!--  right: the product of the marginals  -->
  <text class="lbl" x="360" y="26" font-weight="bold">product p(x)&#183;p(y)</text>
  <g class="muted" text-anchor="middle">
    <text x="405" y="48">dry</text>
    <text x="495" y="48">wet</text>
  </g>
  <text class="muted" x="354" y="84" text-anchor="end">clear</text>
  <text class="muted" x="354" y="134" text-anchor="end">overcast</text>

  <g class="cell">
    <rect x="360" y="56" width="90" height="50"/>
    <rect x="450" y="56" width="90" height="50"/>
    <rect x="360" y="106" width="90" height="50"/>
    <rect x="450" y="106" width="90" height="50"/>
  </g>
  <g class="val">
    <text x="405" y="86">3/8</text>
    <text x="495" y="86">1/8</text>
    <text x="405" y="136">3/8</text>
    <text x="495" y="136">1/8</text>
  </g>
  <g class="muted" text-anchor="middle">
    <text x="405" y="174">3/4</text>
    <text x="495" y="174">1/4</text>
    <text x="558" y="86">1/2</text>
    <text x="558" y="136">1/2</text>
  </g>
  <text class="muted" x="450" y="192" text-anchor="middle">same margins, different cells</text>

  <!-- comparison arrow -->
  <line x1="272" y1="106" x2="336" y2="106" stroke="currentColor" stroke-width="1.5"/>
  <path d="M336 106 l-8 -4 M336 106 l-8 4" stroke="currentColor" stroke-width="1.5" fill="none"/>
  <text class="muted" x="304" y="98" text-anchor="middle">vs</text>

  <!--  cell-by-cell divergence  -->
  <line x1="60" y1="212" x2="560" y2="212" stroke="currentColor" opacity="0.3"/>
  <text class="lbl" x="60" y="234">cell terms p log&#8322;(p / product):</text>
  <g font-size="12">
    <text x="60" y="258" fill="#e2903a">0.5&#183;log&#8322;(0.5/0.375) = +0.208</text>
    <text x="250" y="258" fill="#4c8dd6">0&#183;log&#8322;(0/0.125) = 0</text>
    <text x="400" y="258" fill="#4c8dd6">0.25&#183;log&#8322;(0.25/0.375) = &#8722;0.146</text>
    <text x="60" y="278" fill="#e2903a">0.25&#183;log&#8322;(0.25/0.125) = +0.250</text>
  </g>
  <text x="60" y="302" font-size="13" fill="currentColor" font-weight="bold">sum: I(X;Y) = D(joint &#8214; product) = 0.311 bits</text>
  <text class="muted" x="60" y="324">amber = cell heavier than independence predicts &#183; blue = cell lighter</text>
</svg>

<svg viewBox="0 0 620 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <style>
    .lbl { fill: currentColor; font-size: 12px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
  </style>

  <!-- forbidden region: above the Pinsker curve -->
  <path d="M70 250 L72.5 241.3 L74.9 237.6 L79.8 232.5 L84.7 228.6 L94.5 222.4 L106.8 216.1 L119 210.9 L143.5 202.1 L168 194.7 L217 182.3 L266 171.8 L315 162.6 L364 154.2 L413 146.6 L462 139.4 L511 132.7 L560 126.4 L560 40 L70 40 Z"
        fill="#e2903a" opacity="0.12"/>

  <!-- the bound -->
  <polyline points="70,250 72.5,241.3 74.9,237.6 79.8,232.5 84.7,228.6 94.5,222.4 106.8,216.1 119,210.9 143.5,202.1 168,194.7 217,182.3 266,171.8 315,162.6 364,154.2 413,146.6 462,139.4 511,132.7 560,126.4"
            fill="none" stroke="#e2903a" stroke-width="2"/>

  <text x="300" y="80" font-size="12" fill="#e2903a" font-weight="bold">no pair of distributions lands here</text>
  <text x="300" y="98" font-size="11" fill="#e2903a">a small divergence forces a small total variation</text>

  <!-- axes -->
  <line x1="70" y1="250" x2="580" y2="250" stroke="currentColor"/>
  <line x1="70" y1="250" x2="70" y2="40" stroke="currentColor"/>
  <g stroke="currentColor" opacity="0.4">
    <line x1="192.5" y1="250" x2="192.5" y2="255"/>
    <line x1="315" y1="250" x2="315" y2="255"/>
    <line x1="437.5" y1="250" x2="437.5" y2="255"/>
    <line x1="560" y1="250" x2="560" y2="255"/>
    <line x1="65" y1="197.5" x2="70" y2="197.5"/>
    <line x1="65" y1="145" x2="70" y2="145"/>
    <line x1="65" y1="92.5" x2="70" y2="92.5"/>
    <line x1="65" y1="40" x2="70" y2="40"/>
  </g>
  <g class="muted" text-anchor="middle">
    <text x="70" y="268">0</text>
    <text x="192.5" y="268">0.25</text>
    <text x="315" y="268">0.50</text>
    <text x="437.5" y="268">0.75</text>
    <text x="560" y="268">1.0</text>
  </g>
  <g class="muted" text-anchor="end">
    <text x="60" y="254">0</text>
    <text x="60" y="201">.25</text>
    <text x="60" y="149">.50</text>
    <text x="60" y="96">.75</text>
    <text x="60" y="44">1.0</text>
  </g>
  <text class="lbl" x="325" y="288" text-anchor="middle">D(p&#8214;q), bits</text>
  <text class="lbl" x="18" y="145" text-anchor="middle" transform="rotate(-90 18 145)">total variation TV(p, q)</text>

  <!-- curve label -->
  <text x="392" y="132" font-size="11" fill="#e2903a">TV = &#8730;(D &#183; ln2 / 2)</text>

  <!-- point: the 55/45 coin against the fair coin, essentially on the bound -->
  <circle cx="73.5" cy="239.5" r="4" fill="#4c8dd6"/>
  <line x1="77" y1="238" x2="140" y2="228" stroke="#4c8dd6" opacity="0.6"/>
  <text x="144" y="226" font-size="11" fill="#4c8dd6">(.55, .45) vs fair: D = 0.007 bits, TV = 0.050</text>
  <text x="144" y="241" font-size="11" fill="#4c8dd6" opacity="0.75">the bound gives 0.0500: attained</text>

  <!-- point: this lesson's mismatched pair -->
  <circle cx="499" cy="145" r="4" fill="#4c8dd6"/>
  <line x1="495" y1="147" x2="430" y2="170" stroke="#4c8dd6" opacity="0.6"/>
  <text x="426" y="184" font-size="11" fill="#4c8dd6" text-anchor="end">the mismatched pair: D = 0.875, TV = 0.500</text>

  <!-- the reverse direction has no bound -->
  <line x1="470" y1="229" x2="566" y2="229" stroke="currentColor" stroke-width="1.5" opacity="0.7"/>
  <path d="M566 229 l-8 -4 M566 229 l-8 4" stroke="currentColor" stroke-width="1.5" fill="none" opacity="0.7"/>
  <circle cx="470" cy="229" r="4" fill="currentColor" opacity="0.7"/>
  <text class="muted" x="566" y="222" text-anchor="end">D = &#8734; at TV = 0.10</text>
</svg>

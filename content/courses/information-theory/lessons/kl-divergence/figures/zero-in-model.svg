<svg viewBox="0 0 620 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <style>
    .lbl { fill: currentColor; font-size: 12px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .p { fill: #4c8dd6; }
    .q { fill: #e2903a; }
  </style>

  <text class="lbl" x="40" y="24">truth <tspan fill="#4c8dd6" font-weight="bold">p</tspan> and model <tspan fill="#e2903a" font-weight="bold">q</tspan></text>
  <text class="lbl" x="372" y="24">the code q pays for</text>

  <!--  bars  -->
  <line x1="52" y1="200" x2="330" y2="200" stroke="currentColor" opacity="0.5"/>
  <line x1="52" y1="200" x2="52" y2="66" stroke="currentColor" opacity="0.5"/>
  <g class="muted" text-anchor="end">
    <text x="46" y="204">0</text>
    <text x="46" y="144">.25</text>
    <text x="46" y="84">.50</text>
  </g>

  <!-- A -->
  <rect class="p" x="62" y="80" width="22" height="120" rx="3"/>
  <rect class="q" x="86" y="80" width="22" height="120" rx="3"/>
  <!-- B -->
  <rect class="p" x="127" y="140" width="22" height="60" rx="3"/>
  <rect class="q" x="151" y="128" width="22" height="72" rx="3"/>
  <!-- C -->
  <rect class="p" x="192" y="164" width="22" height="36" rx="3"/>
  <rect class="q" x="216" y="152" width="22" height="48" rx="3"/>
  <!-- D: the model's zero -->
  <rect class="p" x="257" y="176" width="22" height="24" rx="3"/>
  <rect x="281" y="176" width="22" height="24" rx="3" fill="none" stroke="#e2903a" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="292" y="170" font-size="11" fill="#e2903a" text-anchor="middle" font-weight="bold">q(D) = 0</text>

  <g class="lbl" text-anchor="middle" font-weight="bold">
    <text x="85" y="220">A</text>
    <text x="150" y="220">B</text>
    <text x="215" y="220">C</text>
    <text x="280" y="220">D</text>
  </g>
  <text x="52" y="240" font-size="11" fill="#4c8dd6">p = (.5, .25, .15, .1)</text>
  <text x="52" y="257" font-size="11" fill="#e2903a">q = (.5, .3, .2, 0)</text>

  <!--  code table  -->
  <g class="muted">
    <text x="356" y="48">symbol</text>
    <text x="424" y="48">q(x)</text>
    <text x="474" y="48">length &#8722;log&#8322; q(x)</text>
  </g>
  <line x1="356" y1="56" x2="596" y2="56" stroke="currentColor" opacity="0.3"/>

  <g class="lbl">
    <text x="356" y="80">A</text><text x="424" y="80">.50</text><text x="474" y="80">1.00 bits</text>
    <text x="356" y="106">B</text><text x="424" y="106">.30</text><text x="474" y="106">1.74 bits</text>
    <text x="356" y="132">C</text><text x="424" y="132">.20</text><text x="474" y="132">2.32 bits</text>
  </g>
  <rect x="350" y="142" width="246" height="30" rx="4" fill="#e2903a" opacity="0.14"/>
  <g font-size="12" fill="#e2903a" font-weight="bold">
    <text x="356" y="162">D</text><text x="424" y="162">0</text><text x="474" y="162">no codeword</text>
  </g>
  <text class="muted" x="356" y="190">D occurs once in ten draws and cannot be sent</text>

  <line x1="350" y1="206" x2="596" y2="206" stroke="currentColor" opacity="0.3"/>
  <text class="lbl" x="356" y="228">0 &#8722; 0.066 &#8722; 0.062 + <tspan fill="#e2903a" font-weight="bold">.1&#183;log&#8322;(.1/0)</tspan></text>
  <text x="356" y="250" font-size="12" fill="#e2903a" font-weight="bold">D(p&#8214;q) = +&#8734;</text>

  <text x="310" y="288" font-size="12" fill="currentColor" text-anchor="middle" font-weight="bold">three finite terms summing to &#8722;0.128 bits, and one that is not finite</text>
</svg>

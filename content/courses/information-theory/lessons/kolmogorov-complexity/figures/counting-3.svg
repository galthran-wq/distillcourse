<svg viewBox="0 0 560 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="14">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .frame { fill: currentColor; fill-opacity: 0.06; stroke: currentColor; stroke-opacity: 0.45; }
    .accent { fill: #e2903a; }
    .accent-text { fill: #e2903a; }
    .lead { stroke: #e2903a; stroke-opacity: 0.8; fill: none; }
  </style>

  <text class="label" x="40" y="34" font-weight="600">Step 3: the pigeonhole</text>

  <rect class="frame" x="40" y="52" width="240" height="240" rx="4"/>
  <text class="label" x="160" y="164" text-anchor="middle">K(x) ≥ 8182</text>
  <text class="muted" x="160" y="186" text-anchor="middle">for more than 99.9% of the square</text>

  <text class="label" x="304" y="96">2⁸¹⁹² strings of length 8192</text>
  <text class="muted" x="304" y="118">one point of the square per file;</text>
  <text class="muted" x="304" y="136">no structure assumed about any of them</text>

  <!-- the short-program minority: side 7.5 px = 1/1024 of the square's area -->
  <rect class="accent" x="40" y="284.5" width="7.5" height="7.5"/>
  <path class="lead" d="M 49 288 L 296 224"/>

  <text class="accent-text" x="304" y="212">programs shorter than 8182 bits</text>
  <text class="label" x="304" y="234">1 + 2 + 4 + ⋯ + 2⁸¹⁸¹ &lt; 2⁸¹⁸²</text>
  <text class="muted" x="304" y="256">and each program prints at most one file,</text>
  <text class="muted" x="304" y="274">so at most that many files have one</text>

  <text class="accent-text" x="304" y="304" font-weight="600">2⁸¹⁸² / 2⁸¹⁹² = 2⁻¹⁰: one file in 1,024</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" font-family="system-ui, sans-serif">
  <text x="20" y="20" font-size="12.5" fill="currentColor" font-weight="600">flip fair bits until a codeword is complete</text>
  <text x="540" y="20" font-size="11" fill="currentColor" opacity="0.55" text-anchor="end">code {0, 10} — sum ¾</text>

  <!-- the never-stopping region under 11 -->
  <rect x="404" y="150" width="122" height="86" rx="8" fill="#4c8dd6" fill-opacity="0.10" stroke="#4c8dd6" stroke-opacity="0.45" stroke-dasharray="4 3"/>

  <!-- tree skeleton -->
  <g stroke="currentColor" stroke-width="1.3" opacity="0.3">
    <line x1="280" y1="52" x2="160" y2="110"/>
    <line x1="160" y1="110" x2="100" y2="168"/><line x1="160" y1="110" x2="220" y2="168"/>
    <line x1="400" y1="110" x2="460" y2="168"/>
    <line x1="100" y1="168" x2="70" y2="226"/><line x1="100" y1="168" x2="130" y2="226"/>
    <line x1="220" y1="168" x2="190" y2="226"/><line x1="220" y1="168" x2="250" y2="226"/>
    <line x1="460" y1="168" x2="430" y2="226"/><line x1="460" y1="168" x2="490" y2="226"/>
  </g>

  <!-- highlighted walk: root -> 1 -> 10 -->
  <g stroke="#e2903a" stroke-width="2.4">
    <line x1="280" y1="52" x2="400" y2="110"/>
    <line x1="400" y1="110" x2="340" y2="168"/>
  </g>
  <g font-size="11" fill="#e2903a" font-weight="600">
    <text x="352" y="76" text-anchor="middle">½</text>
    <text x="386" y="140" text-anchor="middle">½</text>
  </g>

  <!-- bit labels -->
  <g font-size="9.5" fill="currentColor" opacity="0.5">
    <text x="212" y="78" text-anchor="middle">0</text><text x="338" y="90" text-anchor="middle">1</text>
    <text x="122" y="136" text-anchor="middle">0</text><text x="196" y="136" text-anchor="middle">1</text>
    <text x="360" y="126" text-anchor="middle">0</text><text x="436" y="136" text-anchor="middle">1</text>
  </g>

  <!-- nodes -->
  <g fill="currentColor" opacity="0.35">
    <circle cx="280" cy="52" r="3"/>
    <circle cx="400" cy="110" r="3"/>
    <circle cx="100" cy="168" r="3"/><circle cx="220" cy="168" r="3"/><circle cx="460" cy="168" r="3"/>
    <circle cx="70" cy="226" r="3"/><circle cx="130" cy="226" r="3"/><circle cx="190" cy="226" r="3"/><circle cx="250" cy="226" r="3"/>
    <circle cx="430" cy="226" r="3"/><circle cx="490" cy="226" r="3"/>
  </g>

  <!-- codeword pills -->
  <g font-family="ui-monospace, Menlo, monospace" font-size="11">
    <rect x="143" y="100" width="34" height="20" rx="6" fill="#e2903a"/>
    <text x="160" y="114" fill="#fff" text-anchor="middle">0</text>
    <rect x="321" y="158" width="38" height="20" rx="6" fill="#e2903a"/>
    <text x="340" y="172" fill="#fff" text-anchor="middle">10</text>
  </g>

  <g font-size="11" fill="#e2903a">
    <text x="112" y="94" text-anchor="middle">stop: ½</text>
    <text x="340" y="192" text-anchor="middle">stop: ½·½ = ¼</text>
  </g>
  <text x="465" y="252" font-size="11" fill="#4c8dd6" text-anchor="middle">never stops: ¼</text>

  <text x="20" y="284" font-size="12" fill="currentColor">½ + ¼ = ¾ is the chance of ever stopping &#8212; the slack ¼ is the chance of flipping forever</text>
</svg>

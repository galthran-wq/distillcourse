<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 312" font-family="system-ui, sans-serif">
  <text x="20" y="20" font-size="12.5" fill="currentColor" font-weight="600">every claim counted at the deepest level</text>
  <text x="540" y="20" font-size="11" fill="currentColor" opacity="0.55" text-anchor="end">lengths 1, 2, 3, 3 — ℓmax = 3</text>

  <!-- tree skeleton -->
  <g stroke="currentColor" stroke-width="1.3" opacity="0.3">
    <line x1="280" y1="52" x2="160" y2="110"/><line x1="280" y1="52" x2="400" y2="110"/>
    <line x1="160" y1="110" x2="100" y2="168"/><line x1="160" y1="110" x2="220" y2="168"/>
    <line x1="400" y1="110" x2="340" y2="168"/><line x1="400" y1="110" x2="460" y2="168"/>
    <line x1="100" y1="168" x2="70" y2="226"/><line x1="100" y1="168" x2="130" y2="226"/>
    <line x1="220" y1="168" x2="190" y2="226"/><line x1="220" y1="168" x2="250" y2="226"/>
    <line x1="340" y1="168" x2="310" y2="226"/><line x1="340" y1="168" x2="370" y2="226"/>
    <line x1="460" y1="168" x2="430" y2="226"/><line x1="460" y1="168" x2="490" y2="226"/>
  </g>

  <!-- bit labels -->
  <g font-size="9.5" fill="currentColor" opacity="0.5">
    <text x="212" y="78" text-anchor="middle">0</text><text x="348" y="78" text-anchor="middle">1</text>
    <text x="122" y="136" text-anchor="middle">0</text><text x="196" y="136" text-anchor="middle">1</text>
    <text x="362" y="136" text-anchor="middle">0</text><text x="436" y="136" text-anchor="middle">1</text>
    <text x="76" y="194" text-anchor="middle">0</text><text x="126" y="194" text-anchor="middle">1</text>
    <text x="196" y="194" text-anchor="middle">0</text><text x="246" y="194" text-anchor="middle">1</text>
    <text x="316" y="194" text-anchor="middle">0</text><text x="366" y="194" text-anchor="middle">1</text>
  </g>

  <!-- nodes -->
  <g fill="currentColor" opacity="0.35">
    <circle cx="280" cy="52" r="3"/>
    <circle cx="400" cy="110" r="3"/>
    <circle cx="100" cy="168" r="3"/><circle cx="220" cy="168" r="3"/><circle cx="460" cy="168" r="3"/>
    <circle cx="70" cy="226" r="4"/><circle cx="130" cy="226" r="4"/><circle cx="190" cy="226" r="4"/><circle cx="250" cy="226" r="4"/>
    <circle cx="310" cy="226" r="4"/><circle cx="370" cy="226" r="4"/>
  </g>

  <!-- codeword pills -->
  <g font-family="ui-monospace, Menlo, monospace" font-size="11">
    <rect x="143" y="100" width="34" height="20" rx="6" fill="#e2903a"/>
    <text x="160" y="114" fill="#fff" text-anchor="middle">0</text>
    <rect x="321" y="158" width="38" height="20" rx="6" fill="#e2903a"/>
    <text x="340" y="172" fill="#fff" text-anchor="middle">10</text>
    <rect x="407" y="216" width="46" height="20" rx="6" fill="#e2903a"/>
    <text x="430" y="230" fill="#fff" text-anchor="middle">110</text>
    <rect x="467" y="216" width="46" height="20" rx="6" fill="#e2903a"/>
    <text x="490" y="230" fill="#fff" text-anchor="middle">111</text>
  </g>

  <!-- descendant groups at depth 3 -->
  <g stroke="#e2903a" stroke-opacity="0.55" stroke-width="1.2" fill="none">
    <path d="M58 248 L58 256 L262 256 L262 248"/>
    <path d="M298 248 L298 256 L382 256 L382 248"/>
    <path d="M406 248 L406 256 L454 256 L454 248"/>
    <path d="M466 248 L466 256 L514 256 L514 248"/>
  </g>
  <g font-size="11.5" fill="#e2903a" text-anchor="middle">
    <text x="160" y="272">4 nodes</text>
    <text x="340" y="272">2</text>
    <text x="430" y="272">1</text>
    <text x="490" y="272">1</text>
  </g>

  <text x="20" y="299" font-size="12" fill="currentColor">4 + 2 + 1 + 1 = 8 = 2³ &#8212; disjoint, and depth 3 holds no more</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 600" font-family="system-ui, sans-serif">
  <!-- ============ panel A: unsorted placement gets stuck ============ -->
  <text x="40" y="26" font-size="12.5" fill="currentColor" font-weight="600">placed in the order 3, 3, 2, then 1 — every choice legal when it was made</text>
  <text x="580" y="26" font-size="11" fill="currentColor" opacity="0.55" text-anchor="end">lengths 1, 2, 3, 3 — sum 1</text>

  <g stroke="currentColor" stroke-width="1.3" opacity="0.3">
    <line x1="310" y1="44" x2="150" y2="104"/><line x1="310" y1="44" x2="470" y2="104"/>
    <line x1="150" y1="104" x2="70" y2="164"/><line x1="150" y1="104" x2="230" y2="164"/>
    <line x1="470" y1="104" x2="390" y2="164"/><line x1="470" y1="104" x2="550" y2="164"/>
    <line x1="70" y1="164" x2="30" y2="224"/><line x1="70" y1="164" x2="110" y2="224"/>
    <line x1="230" y1="164" x2="190" y2="224"/><line x1="230" y1="164" x2="270" y2="224"/>
    <line x1="390" y1="164" x2="350" y2="224"/><line x1="390" y1="164" x2="430" y2="224"/>
    <line x1="550" y1="164" x2="510" y2="224"/><line x1="550" y1="164" x2="590" y2="224"/>
  </g>
  <g font-size="9.5" fill="currentColor" opacity="0.5">
    <text x="222" y="70" text-anchor="middle">0</text><text x="398" y="70" text-anchor="middle">1</text>
    <text x="100" y="130" text-anchor="middle">0</text><text x="200" y="130" text-anchor="middle">1</text>
    <text x="420" y="130" text-anchor="middle">0</text><text x="520" y="130" text-anchor="middle">1</text>
    <text x="40" y="190" text-anchor="middle">0</text><text x="100" y="190" text-anchor="middle">1</text>
    <text x="200" y="190" text-anchor="middle">0</text><text x="260" y="190" text-anchor="middle">1</text>
    <text x="360" y="190" text-anchor="middle">0</text><text x="420" y="190" text-anchor="middle">1</text>
    <text x="520" y="190" text-anchor="middle">0</text><text x="580" y="190" text-anchor="middle">1</text>
  </g>
  <g fill="currentColor" opacity="0.35">
    <circle cx="310" cy="44" r="3"/>
    <circle cx="150" cy="104" r="3"/><circle cx="470" cy="104" r="3"/>
    <circle cx="70" cy="164" r="3"/><circle cx="230" cy="164" r="3"/><circle cx="390" cy="164" r="3"/><circle cx="550" cy="164" r="3"/>
    <circle cx="30" cy="224" r="3"/><circle cx="110" cy="224" r="3"/><circle cx="190" cy="224" r="3"/><circle cx="270" cy="224" r="3"/>
    <circle cx="350" cy="224" r="3"/><circle cx="430" cy="224" r="3"/><circle cx="510" cy="224" r="3"/><circle cx="590" cy="224" r="3"/>
  </g>

  <!-- claims of the three placed codewords -->
  <rect x="16" y="178" width="108" height="62" rx="6" fill="#e2903a" fill-opacity="0.08" stroke="#e2903a" stroke-opacity="0.45" stroke-dasharray="4 3"/>
  <rect x="170" y="208" width="40" height="32" rx="6" fill="#e2903a" fill-opacity="0.08" stroke="#e2903a" stroke-opacity="0.45" stroke-dasharray="4 3"/>
  <rect x="410" y="208" width="40" height="32" rx="6" fill="#e2903a" fill-opacity="0.08" stroke="#e2903a" stroke-opacity="0.45" stroke-dasharray="4 3"/>

  <rect x="51" y="154" width="38" height="20" rx="6" fill="#e2903a"/>
  <text x="70" y="168" font-size="11" fill="#fff" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">00</text>
  <rect x="171" y="214" width="38" height="20" rx="6" fill="#e2903a"/>
  <text x="190" y="228" font-size="11" fill="#fff" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">010</text>
  <rect x="411" y="214" width="38" height="20" rx="6" fill="#e2903a"/>
  <text x="430" y="228" font-size="11" fill="#fff" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">101</text>

  <!-- the stranded length-1 codeword -->
  <g stroke="#4c8dd6" stroke-width="2">
    <line x1="138" y1="92" x2="162" y2="116"/><line x1="162" y1="92" x2="138" y2="116"/>
    <line x1="458" y1="92" x2="482" y2="116"/><line x1="482" y1="92" x2="458" y2="116"/>
  </g>
  <text x="150" y="88" font-size="10.5" fill="#4c8dd6" text-anchor="middle">0 sits above 00 and 010</text>
  <text x="470" y="88" font-size="10.5" fill="#4c8dd6" text-anchor="middle">1 sits above 101</text>
  <rect x="266" y="256" width="88" height="22" rx="11" fill="#4c8dd6"/>
  <text x="310" y="271" font-size="11" fill="#fff" text-anchor="middle">length 1: ?</text>
  <text x="310" y="292" font-size="11.5" fill="currentColor" text-anchor="middle">both depth-1 nodes would be a prefix of a placed codeword</text>

  <!-- ============ panel B: sorted placement fits ============ -->
  <g transform="translate(0,300)">
    <line x1="16" y1="8" x2="604" y2="8" stroke="currentColor" stroke-opacity="0.2"/>
    <text x="40" y="34" font-size="12.5" fill="currentColor" font-weight="600">the same lengths sorted: 1, 2, 3, 3 — leftmost free node each time</text>
    <text x="580" y="34" font-size="11" fill="currentColor" opacity="0.55" text-anchor="end">lengths 1, 2, 3, 3 — sum 1</text>

    <g stroke="currentColor" stroke-width="1.3" opacity="0.3">
      <line x1="310" y1="52" x2="150" y2="112"/><line x1="310" y1="52" x2="470" y2="112"/>
      <line x1="150" y1="112" x2="70" y2="172"/><line x1="150" y1="112" x2="230" y2="172"/>
      <line x1="470" y1="112" x2="390" y2="172"/><line x1="470" y1="112" x2="550" y2="172"/>
      <line x1="70" y1="172" x2="30" y2="232"/><line x1="70" y1="172" x2="110" y2="232"/>
      <line x1="230" y1="172" x2="190" y2="232"/><line x1="230" y1="172" x2="270" y2="232"/>
      <line x1="390" y1="172" x2="350" y2="232"/><line x1="390" y1="172" x2="430" y2="232"/>
      <line x1="550" y1="172" x2="510" y2="232"/><line x1="550" y1="172" x2="590" y2="232"/>
    </g>
    <g font-size="9.5" fill="currentColor" opacity="0.5">
      <text x="222" y="78" text-anchor="middle">0</text><text x="398" y="78" text-anchor="middle">1</text>
      <text x="100" y="138" text-anchor="middle">0</text><text x="200" y="138" text-anchor="middle">1</text>
      <text x="420" y="138" text-anchor="middle">0</text><text x="520" y="138" text-anchor="middle">1</text>
      <text x="360" y="198" text-anchor="middle">0</text><text x="420" y="198" text-anchor="middle">1</text>
      <text x="520" y="198" text-anchor="middle">0</text><text x="580" y="198" text-anchor="middle">1</text>
    </g>
    <g fill="currentColor" opacity="0.35">
      <circle cx="310" cy="52" r="3"/>
      <circle cx="150" cy="112" r="3"/><circle cx="470" cy="112" r="3"/>
      <circle cx="70" cy="172" r="3"/><circle cx="230" cy="172" r="3"/><circle cx="390" cy="172" r="3"/><circle cx="550" cy="172" r="3"/>
      <circle cx="30" cy="232" r="3"/><circle cx="110" cy="232" r="3"/><circle cx="190" cy="232" r="3"/><circle cx="270" cy="232" r="3"/>
      <circle cx="350" cy="232" r="3"/><circle cx="430" cy="232" r="3"/><circle cx="510" cy="232" r="3"/><circle cx="590" cy="232" r="3"/>
    </g>

    <rect x="16" y="126" width="268" height="122" rx="6" fill="#e2903a" fill-opacity="0.08" stroke="#e2903a" stroke-opacity="0.45" stroke-dasharray="4 3"/>
    <rect x="326" y="186" width="128" height="62" rx="6" fill="#e2903a" fill-opacity="0.08" stroke="#e2903a" stroke-opacity="0.45" stroke-dasharray="4 3"/>
    <rect x="484" y="216" width="52" height="32" rx="6" fill="#e2903a" fill-opacity="0.08" stroke="#e2903a" stroke-opacity="0.45" stroke-dasharray="4 3"/>
    <rect x="564" y="216" width="52" height="32" rx="6" fill="#e2903a" fill-opacity="0.08" stroke="#e2903a" stroke-opacity="0.45" stroke-dasharray="4 3"/>

    <rect x="131" y="102" width="38" height="20" rx="6" fill="#4c8dd6"/>
    <text x="150" y="116" font-size="11" fill="#fff" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">0</text>
    <rect x="371" y="162" width="38" height="20" rx="6" fill="#e2903a"/>
    <text x="390" y="176" font-size="11" fill="#fff" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">10</text>
    <rect x="491" y="222" width="38" height="20" rx="6" fill="#e2903a"/>
    <text x="510" y="236" font-size="11" fill="#fff" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">110</text>
    <rect x="571" y="222" width="38" height="20" rx="6" fill="#e2903a"/>
    <text x="590" y="236" font-size="11" fill="#fff" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">111</text>

    <text x="310" y="278" font-size="11.5" fill="currentColor" text-anchor="middle">shortest first: every later codeword is placed below the free part of the tree</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 250" font-family="system-ui, sans-serif">
  <text x="40" y="24" font-size="12.5" fill="currentColor" font-weight="600">shorten A to length 1: its cost doubles to 1/2</text>

  <!-- rows: codeword lengths as unit cells -->
  <g font-size="12" fill="currentColor">
    <text x="52" y="76" text-anchor="end">A</text>
    <text x="52" y="110" text-anchor="end">B</text>
    <text x="52" y="144" text-anchor="end">C</text>
    <text x="52" y="178" text-anchor="end">D</text>
  </g>
  <!-- A: length 1 (shortened) -->
  <rect x="70" y="60" width="24" height="24" rx="3" fill="#e2903a"/>
  <text x="175" y="76" font-size="11" fill="#e2903a">cost 1/2</text>
  <!-- B: length 2 -->
  <rect x="70" y="94" width="24" height="24" rx="3" fill="#4c8dd6" opacity="0.85"/>
  <rect x="98" y="94" width="24" height="24" rx="3" fill="#4c8dd6" opacity="0.85"/>
  <text x="175" y="110" font-size="11" fill="currentColor">cost 1/4</text>
  <!-- C: length 2 -->
  <rect x="70" y="128" width="24" height="24" rx="3" fill="#4c8dd6" opacity="0.85"/>
  <rect x="98" y="128" width="24" height="24" rx="3" fill="#4c8dd6" opacity="0.85"/>
  <text x="175" y="144" font-size="11" fill="currentColor">cost 1/4</text>
  <!-- D: length 2 -->
  <rect x="70" y="162" width="24" height="24" rx="3" fill="#4c8dd6" opacity="0.85"/>
  <rect x="98" y="162" width="24" height="24" rx="3" fill="#4c8dd6" opacity="0.85"/>
  <text x="175" y="178" font-size="11" fill="currentColor">cost 1/4</text>

  <!-- budget bar -->
  <rect x="480" y="50" width="40" height="160" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.8"/>
  <line x1="474" y1="50" x2="526" y2="50" stroke="currentColor" stroke-width="2.2"/>
  <text x="468" y="54" font-size="11" fill="currentColor" text-anchor="end">budget = 1</text>
  <g stroke="#fff" stroke-opacity="0.5">
    <rect x="481" y="130" width="38" height="80" fill="#e2903a"/>
    <rect x="481" y="90" width="38" height="40" fill="#4c8dd6"/>
    <rect x="481" y="50" width="38" height="40" fill="#4c8dd6"/>
  </g>
  <rect x="481" y="10" width="38" height="40" fill="#e2903a" fill-opacity="0.3" stroke="#e2903a" stroke-dasharray="4 3"/>
  <g font-size="10" text-anchor="middle">
    <text x="500" y="173" fill="#fff">1/2</text>
    <text x="500" y="113" fill="#fff">1/4</text>
    <text x="500" y="73" fill="#fff">1/4</text>
    <text x="500" y="33" fill="#e2903a">1/4</text>
  </g>
  <text x="530" y="32" font-size="10" fill="#e2903a" text-anchor="start">over budget</text>

  <text x="310" y="238" font-size="11.5" fill="currentColor" text-anchor="middle">sum = 1/2 + 3 × 1/4 = 1.25 &gt; 1</text>
</svg>

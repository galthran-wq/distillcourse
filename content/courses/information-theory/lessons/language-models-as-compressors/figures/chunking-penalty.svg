<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11.5px; }
    .full { fill: currentColor; opacity: 0.32; }
    .chunk { fill: #4c8dd6; opacity: 0.9; }
    .delta { fill: #e2903a; font-size: 11.5px; font-weight: 600; }
    .axis { stroke: currentColor; opacity: 0.45; }
    .guide { stroke: currentColor; opacity: 0.45; stroke-dasharray: 3 3; }
  </style>

  <text class="label" x="16" y="22" font-weight="600">rate on enwik9 when the input is cut into 2048-byte chunks</text>

  <!-- axis: 0% at y=250, 100% at y=70, 1.8 px per % -->
  <line class="axis" x1="72" y1="250" x2="600" y2="250"/>
  <line class="guide" x1="72" y1="70" x2="600" y2="70"/>
  <text class="muted" x="66" y="74" text-anchor="end">100%</text>
  <text class="muted" x="66" y="164" text-anchor="end">50%</text>
  <text class="muted" x="66" y="254" text-anchor="end">0%</text>

  <rect class="full"  x="470" y="42" width="14" height="10" rx="2"/>
  <text class="muted" x="490" y="51">full context</text>
  <rect class="chunk" x="470" y="20" width="14" height="10" rx="2"/>
  <text class="muted" x="490" y="29">cut into 2048-byte chunks</text>

  <!-- gzip -->
  <g>
    <rect class="full"  x="120" y="191.9" width="40" height="58.1" rx="3"/>
    <rect class="chunk" x="176" y="163.4" width="40" height="86.6" rx="3"/>
    <text class="label" x="140" y="184" text-anchor="middle">32.3%</text>
    <text class="label" x="196" y="155" text-anchor="middle">48.1%</text>
    <text class="delta" x="168" y="132" text-anchor="middle">+15.8 points</text>
    <text class="label" x="168" y="274" text-anchor="middle" font-weight="600">gzip</text>
    <text class="muted" x="168" y="290" text-anchor="middle">32 KB window</text>
  </g>

  <!-- LZMA2 -->
  <g>
    <rect class="full"  x="295" y="208.6" width="40" height="41.4" rx="3"/>
    <rect class="chunk" x="351" y="160.0" width="40" height="90.0" rx="3"/>
    <text class="label" x="315" y="201" text-anchor="middle">23.0%</text>
    <text class="label" x="371" y="152" text-anchor="middle">50.0%</text>
    <text class="delta" x="343" y="129" text-anchor="middle">+27.0 points</text>
    <text class="label" x="343" y="274" text-anchor="middle" font-weight="600">LZMA2</text>
    <text class="muted" x="343" y="290" text-anchor="middle">effectively unbounded</text>
  </g>

  <!-- PNG -->
  <g>
    <rect class="full"  x="470" y="172.8" width="40" height="77.2" rx="3"/>
    <rect class="chunk" x="526" y="104.9" width="40" height="145.1" rx="3"/>
    <text class="label" x="490" y="165" text-anchor="middle">42.9%</text>
    <text class="label" x="546" y="97" text-anchor="middle">80.6%</text>
    <text class="delta" x="490" y="140" text-anchor="middle">+37.7 points</text>
    <text class="label" x="518" y="274" text-anchor="middle" font-weight="600">PNG</text>
    <text class="muted" x="518" y="290" text-anchor="middle">whole-image filters</text>
  </g>
</svg>

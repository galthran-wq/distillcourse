<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11.5px; }
    .axis { stroke: currentColor; opacity: 0.45; fill: none; }
    .guide { stroke: currentColor; opacity: 0.45; stroke-dasharray: 3 3; fill: none; }
    .gz { stroke: currentColor; opacity: 0.6; stroke-width: 2; fill: none; }
    .md { stroke: #e2903a; stroke-width: 2.2; fill: none; }
    .dot { fill: #e2903a; }
  </style>

  <text class="label" x="16" y="24" font-weight="600">total bits a recipient must be sent, against corpus size</text>

  <!-- plot: x 80..600 = 0..1000 GB (0.52 px/GB); y 280..60 = 0..350 GB (0.6286 px/GB) -->
  <line class="axis" x1="80" y1="280" x2="620" y2="280"/>
  <line class="axis" x1="80" y1="280" x2="80" y2="52"/>

  <text class="muted" x="74" y="284" text-anchor="end">0</text>
  <text class="muted" x="74" y="221" text-anchor="end">100 GB</text>
  <text class="muted" x="74" y="158" text-anchor="end">200 GB</text>
  <text class="muted" x="74" y="95" text-anchor="end">300 GB</text>
  <text class="muted" x="80" y="300">0</text>
  <text class="muted" x="600" y="300" text-anchor="middle">1 TB</text>
  <text class="muted" x="180" y="322" text-anchor="middle">corpus size</text>

  <!-- gzip: 0.323 N -->
  <line class="gz" x1="80" y1="280" x2="600" y2="77"/>
  <text class="label" x="596" y="66" text-anchor="end">gzip, 32.3% of the corpus</text>

  <!-- model: 140 GB + 0.083 N -->
  <line class="md" x1="80" y1="192" x2="600" y2="140"/>
  <text class="label" x="596" y="176" text-anchor="end">70B model + 140 GB of weights</text>

  <!-- the 140 GB intercept -->
  <line class="guide" x1="80" y1="192" x2="170" y2="192"/>
  <text class="muted" x="90" y="156">140 GB of weights,</text>
  <text class="muted" x="90" y="170">charged before any data is sent</text>

  <!-- crossover -->
  <line class="guide" x1="383" y1="162" x2="383" y2="280"/>
  <circle class="dot" cx="383" cy="162" r="4.5"/>
  <text class="label" x="383" y="302" text-anchor="middle" font-weight="600">583 GB: crossover</text>
  <text class="muted" x="383" y="318" text-anchor="middle">188 GB sent either way</text>

  <text class="muted" x="140" y="252">gzip sends less</text>
  <text class="muted" x="440" y="232">the model sends less</text>
</svg>

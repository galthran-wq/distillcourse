<svg viewBox="0 0 560 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11.5px; }
    .gz { fill: currentColor; opacity: 0.32; }
    .data { fill: #e2903a; opacity: 0.95; }
    .par { fill: #4c8dd6; opacity: 0.85; }
    .axis { stroke: currentColor; opacity: 0.45; }
    .guide { stroke: currentColor; opacity: 0.45; stroke-dasharray: 3 3; }
  </style>

  <text class="label" x="16" y="22" font-weight="600">Frame 3 — a 1 TB corpus, parameters charged</text>
  <text class="muted" x="16" y="40">the same 140 GB of weights, spread over a thousand times more data</text>

  <line class="axis" x1="96" y1="250" x2="530" y2="250"/>
  <line class="guide" x1="96" y1="70" x2="530" y2="70"/>
  <text class="muted" x="90" y="74" text-anchor="end">50%</text>
  <text class="muted" x="90" y="164" text-anchor="end">25%</text>
  <text class="muted" x="90" y="254" text-anchor="end">0%</text>
  <text class="muted" x="16" y="200">total bits sent,</text>
  <text class="muted" x="16" y="216">as a share of</text>
  <text class="muted" x="16" y="232">the corpus</text>

  <rect class="gz" x="180" y="133.7" width="70" height="116.3" rx="3"/>
  <text class="label" x="215" y="126" text-anchor="middle">32.3%</text>
  <text class="muted" x="215" y="270" text-anchor="middle">gzip</text>
  <text class="muted" x="215" y="286" text-anchor="middle">decoder: a few KB</text>

  <rect class="data" x="360" y="220.1" width="70" height="29.9" rx="3"/>
  <text class="muted" x="395" y="270" text-anchor="middle">70B model</text>
  <text class="muted" x="395" y="286" text-anchor="middle">weights: 140 GB</text>
  <rect class="par" x="360" y="169.7" width="70" height="50.4" rx="3"/>
  <text class="label" x="352" y="239" text-anchor="end" font-weight="600">8.3%</text>
  <text class="label" x="395" y="162" text-anchor="middle">22.3%</text>
  <text class="muted" x="438" y="176">140 GB of weights =</text>
  <text class="muted" x="438" y="192">14% of a 1 TB corpus</text>

  <rect class="data" x="96" y="296" width="14" height="10" rx="2"/>
  <text class="muted" x="116" y="305">compressed data</text>
  <rect class="par" x="250" y="296" width="14" height="10" rx="2"/>
  <text class="muted" x="270" y="305">model parameters</text>
  <text class="label" x="440" y="305" font-weight="600">model wins</text>
</svg>

<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11.5px; }
    .gen { fill: currentColor; opacity: 0.32; }
    .spec { fill: #4c8dd6; opacity: 0.9; }
    .model { fill: #e2903a; opacity: 0.95; }
    .val { fill: currentColor; font-size: 11.5px; }
    .axis { stroke: currentColor; opacity: 0.45; }
    .guide { stroke: currentColor; opacity: 0.45; stroke-dasharray: 3 3; }
  </style>

  <text class="label" x="16" y="22" font-weight="600">compression rate on three 1 GB corpora, matched 2048-byte chunks</text>

  <!-- axis: 0% at y=250, 100% at y=70, 1.8 px per % -->
  <line class="axis" x1="52" y1="250" x2="620" y2="250"/>
  <line class="guide" x1="52" y1="70" x2="620" y2="70"/>
  <text class="muted" x="46" y="74" text-anchor="end">100%</text>
  <text class="muted" x="46" y="164" text-anchor="end">50%</text>
  <text class="muted" x="46" y="254" text-anchor="end">0%</text>
  <text class="muted" x="56" y="62">raw size</text>
  <text class="muted" x="16" y="292">amber = the</text>
  <text class="muted" x="16" y="308">70B model</text>

  <!-- group 1: text, centre 190 -->
  <g>
    <rect class="gen"   x="131" y="163.4" width="34" height="86.6" rx="3"/>
    <rect class="spec"  x="173" y="160.0" width="34" height="90.0" rx="3"/>
    <rect class="model" x="215" y="235.1" width="34" height="14.9" rx="3"/>
    <text class="val" x="148" y="155" text-anchor="middle">48.1%</text>
    <text class="val" x="190" y="151" text-anchor="middle">50.0%</text>
    <text class="label" x="232" y="227" text-anchor="middle" font-weight="600">8.3%</text>
    <text class="muted" x="148" y="266" text-anchor="middle">gzip</text>
    <text class="muted" x="190" y="266" text-anchor="middle">LZMA2</text>
    <text class="muted" x="232" y="266" text-anchor="middle">model</text>
    <text class="label" x="190" y="292" text-anchor="middle" font-weight="600">text — enwik9</text>
    <text class="muted" x="190" y="308" text-anchor="middle">trained on text</text>
  </g>

  <!-- group 2: image, centre 380 -->
  <g>
    <rect class="gen"   x="321" y="126.5" width="34" height="123.5" rx="3"/>
    <rect class="spec"  x="363" y="138.9" width="34" height="111.1" rx="3"/>
    <rect class="model" x="405" y="163.6" width="34" height="86.4" rx="3"/>
    <text class="val" x="338" y="118" text-anchor="middle">68.6%</text>
    <text class="val" x="380" y="130" text-anchor="middle">61.7%</text>
    <text class="label" x="422" y="155" text-anchor="middle" font-weight="600">48.0%</text>
    <text class="muted" x="338" y="266" text-anchor="middle">gzip</text>
    <text class="muted" x="380" y="266" text-anchor="middle">PNG</text>
    <text class="muted" x="422" y="266" text-anchor="middle">model</text>
    <text class="label" x="380" y="292" text-anchor="middle" font-weight="600">image — ImageNet</text>
    <text class="muted" x="380" y="308" text-anchor="middle">never trained on images</text>
  </g>

  <!-- group 3: audio, centre 560 -->
  <g>
    <rect class="gen"   x="501" y="180.7" width="34" height="69.3" rx="3"/>
    <rect class="spec"  x="543" y="195.5" width="34" height="54.5" rx="3"/>
    <rect class="model" x="585" y="212.2" width="34" height="37.8" rx="3"/>
    <text class="val" x="518" y="172" text-anchor="middle">38.5%</text>
    <text class="val" x="560" y="187" text-anchor="middle">30.3%</text>
    <text class="label" x="602" y="204" text-anchor="middle" font-weight="600">21.0%</text>
    <text class="muted" x="518" y="266" text-anchor="middle">gzip</text>
    <text class="muted" x="560" y="266" text-anchor="middle">FLAC</text>
    <text class="muted" x="602" y="266" text-anchor="middle">model</text>
    <text class="label" x="560" y="292" text-anchor="middle" font-weight="600">audio — LibriSpeech</text>
    <text class="muted" x="560" y="308" text-anchor="middle">never trained on audio</text>
  </g>

  <text class="muted" x="620" y="62" text-anchor="end">on random bytes the model scores 100.8%</text>
</svg>

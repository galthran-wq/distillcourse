<svg viewBox="0 0 640 396" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 10px; }
    .box   { stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.2; fill: none; }
    .abox  { stroke: #e2903a; stroke-width: 1.4; fill: none; }
    .amber { fill: #e2903a; }
    .amberl{ stroke: #e2903a; stroke-width: 1.3; fill: none; }
    .flow  { stroke: currentColor; stroke-opacity: 0.55; stroke-width: 1.2; fill: none; }
    .wire  { stroke: currentColor; stroke-opacity: 0.35; stroke-width: 1.1; stroke-dasharray: 3 3; fill: none; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="currentColor" opacity="0.55"/>
    </marker>
    <marker id="aa" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#e2903a"/>
    </marker>
  </defs>

  <!-- ===== hyperprior branch (top) ===== -->
  <text class="amber" x="124" y="34" font-size="11" font-weight="600">hyperprior: a second latent whose only job is to price the first</text>

  <g>
    <rect class="abox" x="124" y="48" width="60" height="38" rx="5"/>
    <rect class="abox" x="204" y="48" width="38" height="38" rx="5"/>
    <rect class="abox" x="262" y="48" width="38" height="38" rx="5"/>
    <rect class="abox" x="320" y="48" width="60" height="38" rx="5" stroke-dasharray="4 3"/>
    <rect class="abox" x="400" y="48" width="38" height="38" rx="5"/>
    <rect class="abox" x="458" y="48" width="60" height="38" rx="5"/>
  </g>
  <g class="amber" text-anchor="middle" font-size="12">
    <text x="154" y="72">h&#8336;</text>
    <text x="223" y="72">Q</text>
    <text x="281" y="72">AE</text>
    <text x="350" y="72">0110&#8230;</text>
    <text x="419" y="72">AD</text>
    <text x="488" y="72">h&#8347;</text>
  </g>
  <g class="amberl" marker-end="url(#aa)">
    <path d="M184 67 L202 67"/><path d="M242 67 L260 67"/><path d="M300 67 L318 67"/>
    <path d="M380 67 L398 67"/><path d="M438 67 L456 67"/>
  </g>
  <text class="muted" x="196" y="102" text-anchor="middle">z</text>
  <text class="muted" x="410" y="102" text-anchor="middle">&#7825;</text>

  <!-- sigma-hat leaving h_s and feeding both coders -->
  <path class="amberl" marker-end="url(#aa)" d="M518 67 L546 67"/>
  <text class="amber" x="552" y="71" font-size="12">&#963;&#770;</text>
  <path class="amberl" d="M566 78 L566 140 L281 140"/>
  <path class="amberl" marker-end="url(#aa)" d="M281 140 L281 158"/>
  <path class="amberl" marker-end="url(#aa)" d="M419 140 L419 158"/>
  <text class="amber" x="300" y="132" font-size="11">the scales that set every codeword length</text>

  <!-- ===== main path (bottom) ===== -->
  <text class="label" x="12" y="182" font-size="12" font-weight="600">x</text>
  <g>
    <rect class="box" x="44" y="158" width="60" height="38" rx="5"/>
    <rect class="box" x="124" y="158" width="38" height="38" rx="5"/>
    <rect class="box" x="262" y="158" width="38" height="38" rx="5"/>
    <rect class="box" x="320" y="158" width="60" height="38" rx="5" stroke-dasharray="4 3"/>
    <rect class="box" x="400" y="158" width="38" height="38" rx="5"/>
    <rect class="box" x="458" y="158" width="60" height="38" rx="5"/>
  </g>
  <g class="label" text-anchor="middle" font-size="12">
    <text x="74" y="182">g&#8336;</text>
    <text x="143" y="182">Q</text>
    <text x="281" y="182">AE</text>
    <text x="350" y="182">0110&#8230;</text>
    <text x="419" y="182">AD</text>
    <text x="488" y="182">g&#8347;</text>
  </g>
  <g class="flow" marker-end="url(#a)">
    <path d="M24 177 L42 177"/>
    <path d="M104 177 L122 177"/>
    <path d="M162 177 L260 177"/>
    <path d="M300 177 L318 177"/>
    <path d="M380 177 L398 177"/>
    <path d="M438 177 L456 177"/>
    <path d="M518 177 L546 177"/>
  </g>
  <text class="label" x="554" y="182" font-size="12">x&#770;</text>
  <text class="muted" x="113" y="170" text-anchor="middle">y</text>
  <text class="muted" x="211" y="170" text-anchor="middle">&#375;</text>
  <text class="muted" x="448" y="170" text-anchor="middle">&#375;</text>

  <!-- branch from y up into h_a -->
  <path class="amberl" marker-end="url(#aa)" d="M113 158 L113 67 L122 67"/>

  <!-- distortion comparison arc -->
  <path class="wire" d="M554 196 L554 226 L16 226 L16 190"/>
  <text class="label" x="284" y="242" text-anchor="middle" font-size="11">D = E[d(x, x&#770;)]</text>

  <!-- ===== ownership labels ===== -->
  <path class="wire" d="M20 262 L620 262"/>
  <text class="muted" x="20" y="282" font-size="11" opacity="0.75">every box is a result this course already established:</text>

  <g class="muted" font-size="10">
    <text x="20" y="302">g&#8336;, g&#8347;</text>
    <text x="90" y="302">the test channel of rate-distortion, made trainable</text>

    <text x="20" y="320">Q</text>
    <text x="90" y="320">the fidelity loss priced as D in R + &#955;D</text>

    <text x="20" y="338">p(&#375; | &#963;&#770;)</text>
    <text x="90" y="338">the entropy model: its error is paid as D(m &#8214; p), in bits</text>

    <text x="20" y="356">AE, AD</text>
    <text x="90" y="356">arithmetic coding: fractional bits, within two of the total</text>

    <text x="20" y="374">h&#8336;, h&#8347;</text>
    <text x="90" y="374">side information, learned rather than hand-designed</text>
  </g>
</svg>

<svg viewBox="0 0 560 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .guide { stroke: currentColor; stroke-opacity: 0.18; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
    .axis  { stroke: currentColor; stroke-width: 1; }
    .amberl{ stroke: #e2903a; stroke-width: 2; fill: none; }
    .amber { fill: #e2903a; }
    .bluel { stroke: #4c8dd6; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
    .blue  { fill: #4c8dd6; }
  </style>

  <!-- y-axis title -->
  <text class="muted" x="70" y="30">bits per image</text>

  <!-- horizontal guides -->
  <path class="guide" d="M70 50 L520 50"/>
  <path class="guide" d="M70 95 L520 95"/>
  <path class="guide" d="M70 140 L520 140"/>
  <path class="guide" d="M70 185 L520 185"/>

  <!-- axes -->
  <line class="axis" x1="70" y1="40" x2="70" y2="275"/>
  <line class="axis" x1="70" y1="275" x2="520" y2="275"/>

  <!-- y tick labels -->
  <g class="muted" text-anchor="end">
    <text x="64" y="54">10&#8313;</text>
    <text x="64" y="99">10&#8312;</text>
    <text x="64" y="144">10&#8311;</text>
    <text x="64" y="189">10&#8310;</text>
    <text x="64" y="234">10&#8309;</text>
    <text x="64" y="279">10&#8308;</text>
  </g>

  <!-- the reported rate: the bitstream alone -->
  <path class="bluel" d="M70 230 L520 230"/>

  <!-- the honest two-part total per image -->
  <path class="amberl" d="M70 85.8 L102.2 108.3 L134.3 130.7 L166.5 152.9 L198.6 174.6 L230.8 194.8 L262.9 211.3 L295.1 222.0 L327.2 227.1 L359.4 229.0 L391.5 229.7 L423.7 229.9 L455.8 230 L520 230"/>

  <!-- curve label and the assumption it rests on -->
  <text x="156" y="108" style="fill:#e2903a">honest total per image: L(weights) / N + R</text>
  <text class="muted" x="156" y="124">decoder = 10&#8311; weights &#215; 16 bits = 1.6 &#215; 10&#8312; bits</text>

  <!-- break-even markers -->
  <circle class="amber" cx="276" cy="216.5" r="3.5"/>
  <path stroke="#e2903a" stroke-width="1" fill="none" opacity="0.7" d="M279 213 L286 206"/>
  <text x="290" y="203" font-size="11" style="fill:#e2903a">N &#8776; 1,600: the weights double the file</text>

  <circle class="amber" cx="404.6" cy="229.7" r="3.5"/>
  <path stroke="#e2903a" stroke-width="1" fill="none" opacity="0.7" d="M404.6 234 L404.6 242"/>
  <text x="516" y="255" text-anchor="end" font-size="11" style="fill:#e2903a">N &#8776; 160,000: they add 1%</text>

  <text x="76" y="255" font-size="11" style="fill:#4c8dd6">reported rate R &#8776; 10&#8309; bits (0.19 bpp, 768 &#215; 512)</text>

  <!-- x tick labels -->
  <g class="muted" text-anchor="middle">
    <text x="70" y="292">1</text>
    <text x="134.3" y="292">10</text>
    <text x="198.6" y="292">10&#178;</text>
    <text x="262.9" y="292">10&#179;</text>
    <text x="327.2" y="292">10&#8308;</text>
    <text x="391.5" y="292">10&#8309;</text>
    <text x="455.8" y="292">10&#8310;</text>
    <text x="520" y="292">10&#8311;</text>
  </g>
  <text class="muted" x="295" y="312" text-anchor="middle">images coded with the same decoder, N</text>
</svg>

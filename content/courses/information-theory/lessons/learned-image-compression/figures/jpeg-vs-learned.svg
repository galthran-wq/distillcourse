<svg viewBox="0 0 640 306" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .box   { stroke: currentColor; stroke-opacity: 0.45; stroke-width: 1.2; fill: none; }
    .abox  { stroke: #e2903a; stroke-width: 1.4; fill: none; }
    .amber { fill: #e2903a; }
    .flow  { stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.1; fill: none; }
  </style>

  <!-- stage headers -->
  <g class="muted" text-anchor="middle" font-size="11">
    <text x="164" y="20">1 &#183; analysis transform</text>
    <text x="298" y="20">2 &#183; quantizer</text>
    <text x="432" y="20">3 &#183; entropy model</text>
    <text x="566" y="20">4 &#183; synthesis transform</text>
  </g>
  <g class="label" text-anchor="middle" font-size="12" font-weight="600">
    <text x="164" y="36">g&#8336;</text>
    <text x="298" y="36">Q</text>
    <text x="432" y="36">p(&#375;)</text>
    <text x="566" y="36">g&#8347;</text>
  </g>

  <!-- row labels -->
  <text class="label" x="12" y="80" font-size="12" font-weight="600">JPEG</text>
  <text class="muted" x="12" y="96">1992</text>
  <text class="amber" x="12" y="196" font-size="12" font-weight="600">learned</text>
  <text class="muted" x="12" y="212">2018</text>

  <!-- JPEG row -->
  <g>
    <rect class="box" x="102" y="48" width="124" height="76" rx="5"/>
    <rect class="box" x="236" y="48" width="124" height="76" rx="5"/>
    <rect class="box" x="370" y="48" width="124" height="76" rx="5"/>
    <rect class="box" x="504" y="48" width="124" height="76" rx="5"/>
  </g>
  <g class="label" text-anchor="middle" font-size="11">
    <text x="164" y="72">8&#215;8 block DCT</text>
    <text x="164" y="88">one fixed basis</text>

    <text x="298" y="72">divide by a</text>
    <text x="298" y="88">quantisation table,</text>
    <text x="298" y="104">then round</text>

    <text x="432" y="72">Huffman tables,</text>
    <text x="432" y="88">factorised over</text>
    <text x="432" y="104">each 8&#215;8 block</text>

    <text x="566" y="72">8&#215;8 inverse DCT</text>
    <text x="566" y="88">the same fixed</text>
    <text x="566" y="104">basis, transposed</text>
  </g>

  <!-- learned row -->
  <g>
    <rect class="abox" x="102" y="164" width="124" height="76" rx="5"/>
    <rect class="abox" x="236" y="164" width="124" height="76" rx="5"/>
    <rect class="abox" x="370" y="164" width="124" height="76" rx="5"/>
    <rect class="abox" x="504" y="164" width="124" height="76" rx="5"/>
  </g>
  <g class="label" text-anchor="middle" font-size="11">
    <text x="164" y="188">four strided</text>
    <text x="164" y="204">convolutions</text>
    <text x="164" y="220">+ GDN</text>

    <text x="298" y="188">round to the</text>
    <text x="298" y="204">nearest integer</text>
    <text x="298" y="220">(no table)</text>

    <text x="432" y="188">a learned density,</text>
    <text x="432" y="204">conditioned on</text>
    <text x="432" y="220">side information</text>

    <text x="566" y="188">four upsampling</text>
    <text x="566" y="204">convolutions</text>
    <text x="566" y="220">+ IGDN</text>
  </g>

  <!-- flow arrows between stages, both rows -->
  <g class="flow">
    <path d="M226 86 L236 86"/><path d="M360 86 L370 86"/><path d="M494 86 L504 86"/>
    <path d="M226 202 L236 202"/><path d="M360 202 L370 202"/><path d="M494 202 L504 202"/>
  </g>

  <!-- verdict -->
  <path class="flow" stroke-dasharray="3 3" d="M102 260 L628 260"/>
  <text class="label" x="365" y="282" text-anchor="middle" font-size="12">Same four stages. JPEG&#8217;s numbers were fixed once, by a standards committee;</text>
  <text class="amber" x="365" y="298" text-anchor="middle" font-size="12">all four learned stages are chosen by gradient descent on one loss, R + &#955;D.</text>
</svg>

<svg viewBox="0 0 620 336" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .guide { stroke: currentColor; stroke-opacity: 0.4; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
    .axis  { stroke: currentColor; stroke-width: 1; }
    .gauss { stroke: currentColor; stroke-opacity: 0.45; stroke-width: 1.2; stroke-dasharray: 4 3; fill: none; }
    .amberl{ stroke: #e2903a; stroke-width: 2; fill: none; }
    .amber { fill: #e2903a; }
    .blue  { fill: #4c8dd6; }
  </style>

  <!-- legend -->
  <text class="muted" x="60" y="16">one latent coefficient, model scale &#963;&#770; = 1</text>
  <text class="amber" x="60" y="32" font-size="11">p&#7929; : density of &#7929; = y + u, u uniform on (&#8722;&#189;, &#189;)  &#8212; training</text>
  <text class="blue"  x="60" y="48" font-size="11">p&#375; (k) = P[&#375; = k] &#8212; deployment</text>

  <!-- axes -->
  <line class="axis" x1="60" y1="252" x2="580" y2="252"/>
  <line class="axis" x1="60" y1="252" x2="60" y2="60"/>

  <!-- the slab under the Gaussian whose area is the k = 0 bar -->
  <path fill="#4c8dd6" opacity="0.13" stroke="#4c8dd6" stroke-opacity="0.45" stroke-width="1"
        d="M274.3 252 L274.3 86.5 L310 64.5 L345.7 86.5 L345.7 252 Z"/>
  <!-- the same construction shifted one bin right: the k = 1 bar -->
  <path fill="none" stroke="#4c8dd6" stroke-opacity="0.8" stroke-width="1.3" stroke-dasharray="4 3"
        d="M345.7 252 L345.7 86.5 L381.4 138.3 L417.1 191.1 L417.1 252"/>

  <!-- probability bars at integers, tops on the amber curve -->
  <g class="blue">
    <rect x="299"   y="72"    width="22" height="180"   rx="2"/>
    <rect x="227.6" y="138.4" width="22" height="113.6" rx="2"/>
    <rect x="370.4" y="138.4" width="22" height="113.6" rx="2"/>
    <rect x="156.1" y="223.5" width="22" height="28.5"  rx="2"/>
    <rect x="441.9" y="223.5" width="22" height="28.5"  rx="2"/>
    <rect x="84.7"  y="249.1" width="22" height="2.9"   rx="1"/>
    <rect x="513.3" y="249.1" width="22" height="2.9"   rx="1"/>
  </g>

  <!-- the underlying Gaussian, muted -->
  <path class="gauss" d="M60 251.6 L95.7 249.9 L131.4 243.8 L167.1 226.6 L202.9 191.1 L238.6 138.3 L274.3 86.5 L310 64.5 L345.7 86.5 L381.4 138.3 L417.1 191.1 L452.9 226.6 L488.6 243.8 L524.3 249.9 L560 251.6"/>
  <text class="muted" x="384" y="72">N(0, &#963;&#770;)</text>

  <!-- the noise-convolved density: passes exactly through the bar tops -->
  <path class="amberl" d="M60 251.4 L95.7 249.1 L131.4 241.9 L167.1 223.5 L202.9 188.1 L238.6 138.4 L274.3 91.6 L310 72 L345.7 91.6 L381.4 138.4 L417.1 188.1 L452.9 223.5 L488.6 241.9 L524.3 249.1 L560 251.4"/>

  <!-- callouts on the two shaded slabs -->
  <text x="62" y="104" font-size="11" style="fill:#4c8dd6">shaded area = 0.383 = bar height</text>
  <path stroke="#4c8dd6" stroke-width="1" fill="none" opacity="0.6" d="M262 100 L268 100 L272 106"/>
  <text x="596" y="206" font-size="11" text-anchor="end" style="fill:#4c8dd6">same slab at k = 1: area 0.242</text>
  <path stroke="#4c8dd6" stroke-width="1" fill="none" opacity="0.6" d="M416 197 L406 203 L400 212"/>

  <!-- integer ticks -->
  <g class="muted" text-anchor="middle">
    <text x="95.7" y="268">&#8722;3</text>
    <text x="167.1" y="268">&#8722;2</text>
    <text x="238.6" y="268">&#8722;1</text>
    <text x="310" y="268">0</text>
    <text x="381.4" y="268">1</text>
    <text x="452.9" y="268">2</text>
    <text x="524.3" y="268">3</text>
  </g>
  <text class="muted" x="310" y="286" text-anchor="middle">quantised value k</text>

  <!-- the identity -->
  <text class="label" x="310" y="310" text-anchor="middle" font-size="12">The Gaussian&#8217;s mass on [k &#8722; &#189;, k + &#189;] equals the amber curve&#8217;s height at k.</text>
  <text class="label" x="310" y="328" text-anchor="middle" font-size="12">One density serves both: the relaxed objective and the shipped bitstream.</text>
</svg>

<svg viewBox="0 0 620 386" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <style>
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .amber { fill: #e2903a; }
    .blue  { fill: #4c8dd6; }
  </style>

  <text x="60" y="20" font-size="13" fill="currentColor">code lengths for one quantised latent coefficient</text>
  <text x="60" y="38" font-size="11" fill="#e2903a">&#8467;p(k) = &#8722;log&#8322; p(k): the model&#8217;s lengths</text>
  <text x="330" y="38" font-size="11" fill="#4c8dd6">&#8467;m(k) = &#8722;log&#8322; m(k): ideal for the true marginal</text>

  <!-- grid -->
  <g stroke="currentColor" opacity="0.12">
    <line x1="60" y1="228" x2="580" y2="228"/>
    <line x1="60" y1="186" x2="580" y2="186"/>
    <line x1="60" y1="144" x2="580" y2="144"/>
    <line x1="60" y1="102" x2="580" y2="102"/>
    <line x1="60" y1="60"  x2="580" y2="60"/>
  </g>

  <!-- axes -->
  <line x1="60" y1="270" x2="580" y2="270" stroke="currentColor"/>
  <line x1="60" y1="270" x2="60" y2="54" stroke="currentColor"/>
  <g font-size="11" fill="currentColor" text-anchor="end" opacity="0.55">
    <text x="53" y="274">0</text>
    <text x="53" y="232">1</text>
    <text x="53" y="190">2</text>
    <text x="53" y="148">3</text>
    <text x="53" y="106">4</text>
    <text x="53" y="64">5</text>
  </g>
  <text x="20" y="165" font-size="12" fill="currentColor" text-anchor="middle" transform="rotate(-90 20 165)">bits</text>

  <!-- gap bands: from the shorter top to the taller top -->
  <g>
    <rect x="86"  y="88.5"  width="68" height="42"   fill="#4c8dd6" opacity="0.15"/>
    <rect x="86"  y="88.5"  width="68" height="42"   fill="none" stroke="#4c8dd6" stroke-dasharray="3 3" opacity="0.5"/>
    <rect x="186" y="155"   width="68" height="17.4" fill="#4c8dd6" opacity="0.15"/>
    <rect x="186" y="155"   width="68" height="17.4" fill="none" stroke="#4c8dd6" stroke-dasharray="3 3" opacity="0.5"/>
    <rect x="286" y="214.5" width="68" height="24.6" fill="#e2903a" opacity="0.18"/>
    <rect x="286" y="214.5" width="68" height="24.6" fill="none" stroke="#e2903a" stroke-dasharray="3 3" opacity="0.5"/>
    <rect x="386" y="155"   width="68" height="17.4" fill="#4c8dd6" opacity="0.15"/>
    <rect x="386" y="155"   width="68" height="17.4" fill="none" stroke="#4c8dd6" stroke-dasharray="3 3" opacity="0.5"/>
    <rect x="486" y="88.5"  width="68" height="42"   fill="#4c8dd6" opacity="0.15"/>
    <rect x="486" y="88.5"  width="68" height="42"   fill="none" stroke="#4c8dd6" stroke-dasharray="3 3" opacity="0.5"/>
  </g>

  <!-- amber bars: model lengths 3.322, 2.322, 1.322, 2.322, 3.322 -->
  <g fill="#e2903a">
    <rect x="86"  y="130.5" width="32" height="139.5" rx="3"/>
    <rect x="186" y="172.4" width="32" height="97.6"  rx="3"/>
    <rect x="286" y="214.5" width="32" height="55.5"  rx="3"/>
    <rect x="386" y="172.4" width="32" height="97.6"  rx="3"/>
    <rect x="486" y="130.5" width="32" height="139.5" rx="3"/>
  </g>
  <g font-size="11" fill="#e2903a" text-anchor="middle" font-weight="bold">
    <text x="102" y="123">3.32</text>
    <text x="202" y="165">2.32</text>
    <text x="302" y="207">1.32</text>
    <text x="402" y="165">2.32</text>
    <text x="502" y="123">3.32</text>
  </g>

  <!-- blue bars: ideal lengths 4.322, 2.737, 0.737, 2.737, 4.322 -->
  <g fill="#4c8dd6">
    <rect x="122" y="88.5"  width="32" height="181.5" rx="3"/>
    <rect x="222" y="155"   width="32" height="115"   rx="3"/>
    <rect x="322" y="239.1" width="32" height="30.9"  rx="3"/>
    <rect x="422" y="155"   width="32" height="115"   rx="3"/>
    <rect x="522" y="88.5"  width="32" height="181.5" rx="3"/>
  </g>
  <g font-size="11" fill="#4c8dd6" text-anchor="middle" font-weight="bold">
    <text x="138" y="81">4.32</text>
    <text x="238" y="147">2.74</text>
    <text x="338" y="232">0.74</text>
    <text x="438" y="147">2.74</text>
    <text x="538" y="81">4.32</text>
  </g>

  <!-- value row -->
  <g font-size="12" fill="currentColor" text-anchor="middle" font-weight="bold">
    <text x="120" y="292">&#8722;2</text>
    <text x="220" y="292">&#8722;1</text>
    <text x="320" y="292">0</text>
    <text x="420" y="292">1</text>
    <text x="520" y="292">2</text>
  </g>

  <!-- m row -->
  <text x="52" y="310" font-size="11" fill="#4c8dd6" text-anchor="end">m(k)</text>
  <g font-size="11" fill="#4c8dd6" text-anchor="middle">
    <text x="120" y="310">0.05</text>
    <text x="220" y="310">0.15</text>
    <text x="320" y="310">0.60</text>
    <text x="420" y="310">0.15</text>
    <text x="520" y="310">0.05</text>
  </g>

  <!-- p row -->
  <text x="52" y="326" font-size="11" fill="#e2903a" text-anchor="end">p(k)</text>
  <g font-size="11" fill="#e2903a" text-anchor="middle">
    <text x="120" y="326">0.10</text>
    <text x="220" y="326">0.20</text>
    <text x="320" y="326">0.40</text>
    <text x="420" y="326">0.20</text>
    <text x="520" y="326">0.10</text>
  </g>

  <!-- gap row -->
  <text x="52" y="342" font-size="11" fill="currentColor" text-anchor="end" opacity="0.55">&#8467;p&#8722;&#8467;m</text>
  <g font-size="11" text-anchor="middle" font-weight="bold">
    <text x="120" y="342" fill="#4c8dd6">&#8722;1.00</text>
    <text x="220" y="342" fill="#4c8dd6">&#8722;0.42</text>
    <text x="320" y="342" fill="#e2903a">+0.59</text>
    <text x="420" y="342" fill="#4c8dd6">&#8722;0.42</text>
    <text x="520" y="342" fill="#4c8dd6">&#8722;1.00</text>
  </g>

  <!-- tally -->
  <text x="310" y="362" font-size="12" fill="currentColor" text-anchor="middle">D(m&#8214;p) = 0.60(+0.59) + 0.30(&#8722;0.42) + 0.10(&#8722;1.00) = <tspan font-weight="bold">0.126 bits per coefficient</tspan></text>
  <text x="310" y="380" font-size="12" fill="currentColor" text-anchor="middle" opacity="0.7">at 0.75 coefficients per pixel: <tspan font-weight="bold">0.095 bpp paid for nothing</tspan></text>
</svg>

<svg viewBox="0 0 640 272" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .amber { fill: #e2903a; }
    .bar   { fill: currentColor; opacity: 0.28; }
    .lead  { stroke: #e2903a; stroke-width: 1; fill: none; }
  </style>

  <!-- key -->
  <rect class="bar" x="60" y="14" width="14" height="12" rx="2"/>
  <text class="muted" x="80" y="24">latents &#375; &#8212; the picture</text>
  <rect class="amber" x="236" y="14" width="14" height="12" rx="2"/>
  <text class="muted" x="256" y="24">hyperprior &#7825; &#8212; the side information</text>
  <text class="muted" x="600" y="24" text-anchor="end">bars at true scale</text>

  <!-- 0.2 bpp -->
  <text class="muted" x="102" y="60" text-anchor="end">0.2 bpp</text>
  <rect class="bar"   x="110" y="46" width="54" height="22" rx="2"/>
  <rect class="amber" x="110" y="46" width="3"  height="22"/>
  <path class="lead" d="M111 44 L111 36 L186 36"/>
  <text class="amber" x="192" y="40" font-size="11">0.008 bpp &#8212; 4% of the file</text>

  <!-- 0.9 bpp -->
  <text class="muted" x="102" y="106" text-anchor="end">0.9 bpp</text>
  <rect class="bar"   x="110" y="92" width="243" height="22" rx="2"/>
  <rect class="amber" x="110" y="92" width="5.4" height="22"/>
  <path class="lead" d="M112 90 L112 82 L186 82"/>
  <text class="amber" x="192" y="86" font-size="11">0.020 bpp &#8212; 2.2%</text>

  <!-- 1.7 bpp -->
  <text class="muted" x="102" y="152" text-anchor="end">1.7 bpp</text>
  <rect class="bar"   x="110" y="138" width="459" height="22" rx="2"/>
  <rect class="amber" x="110" y="138" width="6.8" height="22"/>
  <path class="lead" d="M113 136 L113 128 L186 128"/>
  <text class="amber" x="192" y="132" font-size="11">0.025 bpp &#8212; 1.5%</text>

  <!-- axis -->
  <line x1="110" y1="176" x2="590" y2="176" stroke="currentColor" opacity="0.5"/>
  <g class="muted" text-anchor="middle">
    <text x="110" y="192">0</text>
    <text x="245" y="192">0.5</text>
    <text x="380" y="192">1.0</text>
    <text x="515" y="192">1.5</text>
  </g>
  <text class="muted" x="350" y="210" text-anchor="middle">total rate (bits per pixel), Kodak average</text>

  <!-- verdict -->
  <text class="label" x="320" y="240" text-anchor="middle" font-size="12">The side information is the smallest slice of the file, and it prices every other slice.</text>
  <text class="muted" x="320" y="258" text-anchor="middle">Values read off the paper&#8217;s measured curve; hyperprior model trained for squared error.</text>
</svg>

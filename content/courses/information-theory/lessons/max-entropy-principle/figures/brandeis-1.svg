<svg viewBox="0 0 600 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="60" y="24" font-size="13" fill="currentColor">the unconstrained die: uniform</text>
  <text x="545" y="24" font-size="13" font-weight="bold" fill="#e2903a" text-anchor="end">1 &#183; before the data</text>
  <text x="545" y="44" font-size="12" fill="currentColor" text-anchor="end">&#10216;i&#10217; = 3.5</text>
  <text x="545" y="61" font-size="12" fill="currentColor" text-anchor="end">H = 2.585 bits (the maximum)</text>

  <!-- axes -->
  <line x1="60" y1="280" x2="560" y2="280" stroke="currentColor"/>
  <line x1="60" y1="280" x2="60" y2="72" stroke="currentColor"/>
  <g font-size="11" fill="currentColor" text-anchor="end" opacity="0.55">
    <text x="53" y="284">0</text>
    <text x="53" y="184">.2</text>
    <text x="53" y="84">.4</text>
  </g>
  <g stroke="currentColor" opacity="0.12">
    <line x1="60" y1="180" x2="560" y2="180"/>
    <line x1="60" y1="80" x2="560" y2="80"/>
  </g>
  <text x="22" y="176" font-size="12" fill="currentColor" text-anchor="middle" transform="rotate(-90 22 176)">p&#7522;</text>

  <!-- uniform bars -->
  <g fill="#e2903a">
    <rect x="78" y="197" width="44" height="83" rx="3"/>
    <rect x="160" y="197" width="44" height="83" rx="3"/>
    <rect x="242" y="197" width="44" height="83" rx="3"/>
    <rect x="324" y="197" width="44" height="83" rx="3"/>
    <rect x="406" y="197" width="44" height="83" rx="3"/>
    <rect x="488" y="197" width="44" height="83" rx="3"/>
  </g>
  <g font-size="11" fill="#e2903a" text-anchor="middle" font-weight="bold">
    <text x="100" y="190">1/6</text>
    <text x="182" y="190">1/6</text>
    <text x="264" y="190">1/6</text>
    <text x="346" y="190">1/6</text>
    <text x="428" y="190">1/6</text>
    <text x="510" y="190">1/6</text>
  </g>

  <!-- mean marker -->
  <path d="M 305 280 l -6 12 l 12 0 z" fill="#e2903a"/>
  <text x="305" y="326" font-size="11" fill="#e2903a" text-anchor="middle">&#10216;i&#10217; = 3.5</text>

  <!-- face labels -->
  <g font-size="12" fill="currentColor" text-anchor="middle" font-weight="bold">
    <text x="100" y="300">1</text>
    <text x="182" y="300">2</text>
    <text x="264" y="300">3</text>
    <text x="346" y="300">4</text>
    <text x="428" y="300">5</text>
    <text x="510" y="300">6</text>
  </g>
</svg>

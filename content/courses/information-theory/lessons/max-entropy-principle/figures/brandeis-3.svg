<svg viewBox="0 0 600 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="60" y="24" font-size="13" fill="currentColor">the exponential family p&#7522; &#8733; x&#8305;: one knob, x</text>
  <text x="545" y="24" font-size="13" font-weight="bold" fill="#e2903a" text-anchor="end">3 &#183; tilt exponentially</text>
  <text x="545" y="44" font-size="12" fill="currentColor" text-anchor="end">x = 1.20: &#10216;i&#10217; = 4.02 &#60; 4.5</text>
  <text x="545" y="61" font-size="12" fill="currentColor" text-anchor="end">increase x</text>

  <!-- axes -->
  <line x1="60" y1="280" x2="560" y2="280" stroke="currentColor"/>
  <line x1="60" y1="280" x2="60" y2="72" stroke="currentColor"/>
  <g font-size="11" fill="currentColor" text-anchor="end" opacity="0.55">
    <text x="53" y="284">0</text>
    <text x="53" y="184">.2</text>
    <text x="53" y="84">.4</text>
  </g>
  <g stroke="currentColor" opacity="0.12">
    <line x1="60" y1="180" x2="560" y2="180"/>
    <line x1="60" y1="80" x2="560" y2="80"/>
  </g>
  <text x="22" y="176" font-size="12" fill="currentColor" text-anchor="middle" transform="rotate(-90 22 176)">p&#7522;</text>

  <!-- tilted bars, x = 1.2 -->
  <g fill="#e2903a">
    <rect x="78" y="230" width="44" height="50" rx="3"/>
    <rect x="160" y="220" width="44" height="60" rx="3"/>
    <rect x="242" y="207" width="44" height="73" rx="3"/>
    <rect x="324" y="193" width="44" height="87" rx="3"/>
    <rect x="406" y="176" width="44" height="104" rx="3"/>
    <rect x="488" y="155" width="44" height="125" rx="3"/>
  </g>

  <!-- constant-ratio callouts between neighboring bar tops -->
  <g stroke="#e2903a" fill="none" opacity="0.7">
    <path d="M 122 224 L 160 214"/>
    <path d="M 450 170 L 488 149"/>
  </g>
  <g font-size="11" fill="#e2903a" text-anchor="middle" font-weight="bold">
    <text x="141" y="208">&#215;1.2</text>
    <text x="469" y="145">&#215;1.2</text>
  </g>
  <text x="300" y="140" font-size="11" fill="currentColor" text-anchor="middle" opacity="0.55">every bar = 1.2 &#215; its left neighbor</text>

  <!-- mean marker and target -->
  <line x1="387" y1="72" x2="387" y2="280" stroke="#4c8dd6" stroke-dasharray="3 3" opacity="0.6"/>
  <text x="387" y="326" font-size="11" fill="#4c8dd6" text-anchor="middle">target 4.5</text>
  <path d="M 348 280 l -6 12 l 12 0 z" fill="#e2903a"/>
  <text x="330" y="310" font-size="11" fill="#e2903a" text-anchor="end">&#10216;i&#10217; = 4.02</text>

  <!-- face labels -->
  <g font-size="12" fill="currentColor" text-anchor="middle" font-weight="bold">
    <text x="100" y="300">1</text>
    <text x="182" y="300">2</text>
    <text x="264" y="300">3</text>
    <text x="346" y="300">4</text>
    <text x="428" y="300">5</text>
    <text x="510" y="300">6</text>
  </g>
</svg>

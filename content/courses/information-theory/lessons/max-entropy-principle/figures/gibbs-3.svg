<svg viewBox="0 0 600 310" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="545" y="24" font-size="13" font-weight="bold" fill="#e2903a" text-anchor="end">3 >1 &#183; two feasible pmfs<#183; the bound collapses to H(q)</text>
  <text x="60" y="24" font-size="12" fill="#4c8dd6">any feasible p (here: uniform on {3,4,5,6})</text>
  <text x="340" y="44" font-size="12" fill="#e2903a">the exponential tilt q&#7522; = e&#8315;&#7524;&#8305;/Z</text>

  <!-- left chart: p -->
  <line x1="60" y1="150" x2="255" y2="150" stroke="currentColor"/>
  <g fill="#4c8dd6">
    <rect x="131" y="80" width="20" height="70" rx="2"/>
    <rect x="164" y="80" width="20" height="70" rx="2"/>
    <rect x="197" y="80" width="20" height="70" rx="2"/>
    <rect x="230" y="80" width="20" height="70" rx="2"/>
  </g>
  <g font-size="10" fill="currentColor" text-anchor="middle" opacity="0.55">
    <text x="75" y="163">1</text><text x="108" y="163">2</text><text x="141" y="163">3</text>
    <text x="174" y="163">4</text><text x="207" y="163">5</text><text x="240" y="163">6</text>
  </g>
  <text x="60" y="182" font-size="12" fill="#4c8dd6" font-weight="bold">H(p) = 2.000 bits</text>

  <!-- right chart: q -->
  <line x1="350" y1="150" x2="545" y2="150" stroke="currentColor"/>
  <g fill="#e2903a">
    <rect x="360" y="135" width="20" height="15" rx="2"/>
    <rect x="393" y="128" width="20" height="22" rx="2"/>
    <rect x="426" y="118" width="20" height="32" rx="2"/>
    <rect x="459" y="104" width="20" height="46" rx="2"/>
    <rect x="492" y="83" width="20" height="67" rx="2"/>
    <rect x="525" y="53" width="20" height="97" rx="2"/>
  </g>
  <g font-size="10" fill="currentColor" text-anchor="middle" opacity="0.55">
    <text x="370" y="163">1</text><text x="403" y="163">2</text><text x="436" y="163">3</text>
    <text x="469" y="163">4</text><text x="502" y="163">5</text><text x="535" y="163">6</text>
  </g>
  <text x="545" y="182" font-size="12" fill="#e2903a" font-weight="bold" text-anchor="end">H(q) = 2.328 bits</text>

  <text x="300" y="202" font-size="12" fill="currentColor" text-anchor="middle">both satisfy &#931; i&#183;p&#7522; = 4.5 &#8212; the same expectation constraint</text>

  <!-- equation area -->
  <text x="300" y="228" font-size="13" fill="currentColor" text-anchor="middle" opacity="0.55">0 &#8804; D(p&#8214;q)  &#8658;  H(p) = &#8722;&#931; p&#7522; log&#8322; p&#7522; &#8804; &#8722;&#931; p&#7522; log&#8322; q&#7522;</text>
  <text x="300" y="252" font-size="13" fill="#e2903a" text-anchor="middle" font-weight="bold">&#8722;log&#8322; q&#7522; = 4.737 &#8722; 0.535&#183;i  &#8658;  &#8722;&#931; p&#7522; log&#8322; q&#7522; = 4.737 &#8722; 0.535&#183;4.5 = 2.328 = H(q)</text>
  <text x="300" y="272" font-size="12" fill="currentColor" text-anchor="middle" opacity="0.55">&#8722;log&#8322; q&#7522; is linear in the constrained quantity i, so the bound is the same number for every feasible p</text>
  <text x="300" y="296" font-size="13" fill="currentColor" text-anchor="middle" font-weight="bold">H(p) &#8804; H(q) for every feasible p &#8212; equality only at p = q</text>
</svg>

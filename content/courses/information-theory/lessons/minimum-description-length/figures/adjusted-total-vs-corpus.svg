<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <!-- axes -->
  <line x1="90" y1="300" x2="600" y2="300" stroke="currentColor" stroke-width="1.5" />
  <line x1="90" y1="300" x2="90" y2="45" stroke="currentColor" stroke-width="1.5" />

  <!-- y ticks: 10%, 100%, 1000%, 10000% (log) -->
  <g>
    <line x1="84" y1="285.4" x2="90" y2="285.4" stroke="currentColor" stroke-width="1" />
    <text x="76" y="289" text-anchor="end" fill="currentColor" opacity="0.55" font-size="12">10%</text>
    <line x1="90" y1="212.6" x2="600" y2="212.6" stroke="currentColor" stroke-width="1" stroke-dasharray="3 3" opacity="0.35" />
    <line x1="84" y1="212.6" x2="90" y2="212.6" stroke="currentColor" stroke-width="1" />
    <text x="76" y="216" text-anchor="end" fill="currentColor" opacity="0.55" font-size="12">100%</text>
    <line x1="84" y1="139.7" x2="90" y2="139.7" stroke="currentColor" stroke-width="1" />
    <text x="76" y="143" text-anchor="end" fill="currentColor" opacity="0.55" font-size="12">1,000%</text>
    <line x1="84" y1="66.9" x2="90" y2="66.9" stroke="currentColor" stroke-width="1" />
    <text x="76" y="70" text-anchor="end" fill="currentColor" opacity="0.55" font-size="12">10,000%</text>
  </g>
  <text x="14" y="34" fill="currentColor" font-size="13">total description length / raw size (log scale)</text>
  <text x="600" y="208" text-anchor="end" fill="currentColor" opacity="0.55" font-size="11">no compression</text>

  <!-- x ticks -->
  <g>
    <line x1="90" y1="300" x2="90" y2="306" stroke="currentColor" stroke-width="1" />
    <text x="90" y="322" text-anchor="middle" fill="currentColor" opacity="0.55" font-size="12">1 GB</text>
    <line x1="217.5" y1="300" x2="217.5" y2="306" stroke="currentColor" stroke-width="1" />
    <text x="217.5" y="322" text-anchor="middle" fill="currentColor" opacity="0.55" font-size="12">10 GB</text>
    <line x1="345" y1="300" x2="345" y2="306" stroke="currentColor" stroke-width="1" />
    <text x="345" y="322" text-anchor="middle" fill="currentColor" opacity="0.55" font-size="12">100 GB</text>
    <line x1="472.5" y1="300" x2="472.5" y2="306" stroke="currentColor" stroke-width="1" />
    <text x="472.5" y="322" text-anchor="middle" fill="currentColor" opacity="0.55" font-size="12">1 TB</text>
    <line x1="600" y1="300" x2="600" y2="306" stroke="currentColor" stroke-width="1" />
    <text x="600" y="322" text-anchor="middle" fill="currentColor" opacity="0.55" font-size="12">10 TB</text>
  </g>
  <text x="345" y="346" text-anchor="middle" fill="currentColor">corpus compressed, N bytes</text>

  <!-- gzip: flat 32.3% -->
  <line x1="90" y1="248.3" x2="600" y2="248.3" stroke="#4c8dd6" stroke-width="2.2" />
  <text x="96" y="242" fill="#4c8dd6" font-size="12.5">gzip: 32.3% at every N (its program is kilobytes)</text>

  <!-- model's raw rate asymptote 8.3% -->
  <line x1="90" y1="291.3" x2="600" y2="291.3" stroke="#e2903a" stroke-width="1.4" stroke-dasharray="4 4" opacity="0.7" />
  <text x="96" y="287" fill="#e2903a" opacity="0.8" font-size="11.5">raw rate 8.3% if the model bits are not charged</text>

  <!-- adjusted total for the 70B model: 0.083 + 1.4e11/N -->
  <path d="M90,56.2 L128.4,78.1 L179.1,107.1 L217.5,128.9 L255.9,150.6 L306.6,179.1 L345,200.1 L383.4,220.3 L434.1,244.6 L472.5,260.1 L510.9,272.0 L561.6,282.1 L600,286.4"
    fill="none" stroke="#e2903a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="90" cy="56.2" r="4" fill="#e2903a" />
  <text x="100" y="60" fill="#e2903a" font-size="12.5" font-weight="600">14,008% at 1 GB</text>
  <text x="100" y="76" fill="#e2903a" opacity="0.8" font-size="11.5">140 GB of parameters, 83 MB of data</text>
  <text x="330" y="164" fill="#e2903a" font-size="12.5">70B model + its own 140 GB, charged</text>

  <!-- crossover -->
  <circle cx="442.7" cy="248.3" r="4.5" fill="none" stroke="currentColor" stroke-width="1.8" />
  <line x1="442.7" y1="248.3" x2="442.7" y2="300" stroke="currentColor" stroke-width="1" stroke-dasharray="3 3" opacity="0.5" />
  <text x="450" y="268" fill="currentColor" font-size="12" font-weight="600">break-even &#8776; 0.6 TB</text>
</svg>

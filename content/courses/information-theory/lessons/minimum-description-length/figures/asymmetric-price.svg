<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="14">
  <!-- axes -->
  <line x1="90" y1="300" x2="600" y2="300" stroke="currentColor" stroke-width="1.5" />
  <line x1="90" y1="300" x2="90" y2="45" stroke="currentColor" stroke-width="1.5" />

  <!-- y gridlines + ticks: 1, 10, 100, 1,000, 10,000 (log scale) -->
  <g>
    <line x1="90" y1="300" x2="600" y2="300" stroke="currentColor" stroke-width="1" stroke-dasharray="3 3" opacity="0.15" />
    <line x1="84" y1="300" x2="90" y2="300" stroke="currentColor" stroke-width="1" />
    <text x="76" y="304" text-anchor="end" fill="currentColor" opacity="0.55" font-size="12">1</text>
    <line x1="90" y1="240" x2="600" y2="240" stroke="currentColor" stroke-width="1" stroke-dasharray="3 3" opacity="0.15" />
    <line x1="84" y1="240" x2="90" y2="240" stroke="currentColor" stroke-width="1" />
    <text x="76" y="244" text-anchor="end" fill="currentColor" opacity="0.55" font-size="12">10</text>
    <line x1="90" y1="180" x2="600" y2="180" stroke="currentColor" stroke-width="1" stroke-dasharray="3 3" opacity="0.15" />
    <line x1="84" y1="180" x2="90" y2="180" stroke="currentColor" stroke-width="1" />
    <text x="76" y="184" text-anchor="end" fill="currentColor" opacity="0.55" font-size="12">100</text>
    <line x1="90" y1="120" x2="600" y2="120" stroke="currentColor" stroke-width="1" stroke-dasharray="3 3" opacity="0.15" />
    <line x1="84" y1="120" x2="90" y2="120" stroke="currentColor" stroke-width="1" />
    <text x="76" y="124" text-anchor="end" fill="currentColor" opacity="0.55" font-size="12">1,000</text>
    <line x1="90" y1="60" x2="600" y2="60" stroke="currentColor" stroke-width="1" stroke-dasharray="3 3" opacity="0.15" />
    <line x1="84" y1="60" x2="90" y2="60" stroke="currentColor" stroke-width="1" />
    <text x="76" y="64" text-anchor="end" fill="currentColor" opacity="0.55" font-size="12">10,000</text>
  </g>
  <text x="14" y="34" fill="currentColor" font-size="13">excess bits (log scale)</text>

  <!-- x ticks: 0, 1000, 2000, 3000 -->
  <g>
    <line x1="90" y1="300" x2="90" y2="306" stroke="currentColor" stroke-width="1" />
    <text x="90" y="322" text-anchor="middle" fill="currentColor" opacity="0.55" font-size="12">0</text>
    <line x1="198.9" y1="300" x2="198.9" y2="306" stroke="currentColor" stroke-width="1" />
    <text x="198.9" y="322" text-anchor="middle" fill="currentColor" opacity="0.55" font-size="12">1,000</text>
    <line x1="307.8" y1="300" x2="307.8" y2="306" stroke="currentColor" stroke-width="1" />
    <text x="307.8" y="322" text-anchor="middle" fill="currentColor" opacity="0.55" font-size="12">2,000</text>
    <line x1="416.7" y1="300" x2="416.7" y2="306" stroke="currentColor" stroke-width="1" />
    <text x="416.7" y="322" text-anchor="middle" fill="currentColor" opacity="0.55" font-size="12">3,000</text>
  </g>
  <text x="345" y="346" text-anchor="middle" fill="currentColor">record length n (symbols)</text>

  <!-- dashed guide at n = 4,100 -->
  <line x1="536.4" y1="92" x2="536.4" y2="300" stroke="currentColor" stroke-width="1" stroke-dasharray="3 3" opacity="0.5" />
  <text x="536.4" y="322" text-anchor="middle" fill="currentColor" font-size="12">n = 4,100</text>

  <!-- blue underfit arm: 0.53 n bits (linear cost, curved on the log axis) -->
  <path d="M94.5,219.8 L96.5,209.9 L98.7,202.4 L100.9,196.5 L105.2,187.8 L111.8,178.5 L120.5,169.7 L133.6,160.4 L151,151.7 L177.1,142.4 L212,133.6 L264.2,124.3 L351.3,113.7 L438.4,106.2 L536.4,99.8"
    fill="none" stroke="#4c8dd6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  <text x="104" y="112" fill="#4c8dd6" font-size="12.5">underfit: &#8776; 0.53 n bits (linear)</text>

  <!-- amber overfit arm: log2 n bits -->
  <path d="M94.5,256.3 L100.9,250.7 L111.8,247.0 L133.6,243.8 L177.1,240.9 L264.2,238.4 L351.3,237.0 L438.4,236.0 L536.4,235.2"
    fill="none" stroke="#e2903a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  <text x="130" y="270" fill="#e2903a" font-size="12.5">overfit: log&#8322; n bits (logarithmic)</text>

  <!-- endpoints at n = 4,100 -->
  <circle cx="536.4" cy="99.8" r="4" fill="#4c8dd6" />
  <text x="545" y="98" text-anchor="start" fill="#4c8dd6" font-size="12" font-weight="600">&#8776; 2,200 bits</text>
  <circle cx="536.4" cy="235.2" r="4" fill="#e2903a" />
  <text x="545" y="239" text-anchor="start" fill="#e2903a" font-size="12" font-weight="600">12 bits</text>

  <!-- gap bracket between the two endpoints -->
  <line x1="590" y1="112" x2="590" y2="224" stroke="currentColor" stroke-width="1.2" />
  <path d="M586,116 L590,108 L594,116" fill="none" stroke="currentColor" stroke-width="1.2" />
  <path d="M586,220 L590,228 L594,220" fill="none" stroke="currentColor" stroke-width="1.2" />
  <text x="528" y="172" text-anchor="end" fill="currentColor" font-size="12.5" font-weight="600">&#8776; 180&#215; &#8212; two orders of magnitude</text>
</svg>

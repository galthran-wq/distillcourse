<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <!-- observed data -->
  <text x="30" y="34" fill="currentColor" opacity="0.55" font-size="12">observed</text>
  <g>
    <rect x="30" y="44" width="52" height="30" rx="4" fill="none" stroke="currentColor" stroke-width="1.4" />
    <text x="56" y="64" text-anchor="middle" fill="currentColor">&#8722;1</text>
    <rect x="98" y="44" width="52" height="30" rx="4" fill="none" stroke="currentColor" stroke-width="1.4" />
    <text x="124" y="64" text-anchor="middle" fill="currentColor">3</text>
    <rect x="166" y="44" width="52" height="30" rx="4" fill="none" stroke="currentColor" stroke-width="1.4" />
    <text x="192" y="64" text-anchor="middle" fill="currentColor">7</text>
    <rect x="234" y="44" width="52" height="30" rx="4" fill="none" stroke="currentColor" stroke-width="1.4" />
    <text x="260" y="64" text-anchor="middle" fill="currentColor">11</text>
    <line x1="84" y1="59" x2="94" y2="59" stroke="currentColor" stroke-width="1.2" />
    <line x1="152" y1="59" x2="162" y2="59" stroke="currentColor" stroke-width="1.2" />
    <line x1="220" y1="59" x2="230" y2="59" stroke="currentColor" stroke-width="1.2" />
  </g>

  <!-- branch A: add 4 -->
  <path d="M290,55 C310,55 312,30 330,30" fill="none" stroke="#e2903a" stroke-width="1.6" />
  <path d="M324,26 L332,30 L324,34" fill="none" stroke="#e2903a" stroke-width="1.6" />
  <rect x="336" y="15" width="52" height="30" rx="4" fill="none" stroke="#e2903a" stroke-width="1.4" />
  <text x="362" y="35" text-anchor="middle" fill="#e2903a">15</text>
  <rect x="396" y="15" width="52" height="30" rx="4" fill="none" stroke="#e2903a" stroke-width="1.4" />
  <text x="422" y="35" text-anchor="middle" fill="#e2903a">19</text>
  <text x="460" y="27" fill="#e2903a" font-size="12.5">H<tspan font-size="9.5" dy="3">a</tspan><tspan dy="-3"></tspan>: x &#8614; x + n, n = 4</text>
  <text x="460" y="43" fill="#e2903a" opacity="0.8" font-size="11.5">fits all four exactly</text>

  <!-- branch B: cubic map -->
  <path d="M290,63 C310,63 312,96 330,96" fill="none" stroke="#4c8dd6" stroke-width="1.6" />
  <path d="M324,92 L332,96 L324,100" fill="none" stroke="#4c8dd6" stroke-width="1.6" />
  <rect x="336" y="81" width="60" height="30" rx="4" fill="none" stroke="#4c8dd6" stroke-width="1.4" />
  <text x="366" y="101" text-anchor="middle" fill="#4c8dd6">&#8722;19.9</text>
  <rect x="404" y="81" width="60" height="30" rx="4" fill="none" stroke="#4c8dd6" stroke-width="1.4" />
  <text x="434" y="101" text-anchor="middle" fill="#4c8dd6">1043.8</text>
  <text x="476" y="93" fill="#4c8dd6" font-size="12.5">H<tspan font-size="9.5" dy="3">c</tspan><tspan dy="-3"></tspan>: x &#8614; cx&#179; + dx&#178; + e</text>
  <text x="476" y="109" fill="#4c8dd6" opacity="0.8" font-size="11.5">also fits all four exactly</text>
  <text x="336" y="130" fill="#4c8dd6" opacity="0.8" font-size="11.5">c = &#8722;1/11, d = 9/11, e = 23/11</text>

  <!-- divider -->
  <line x1="30" y1="150" x2="610" y2="150" stroke="currentColor" stroke-width="1" opacity="0.2" />
  <text x="30" y="172" fill="currentColor" font-size="12.5">bits to state the hypothesis (the data then follows with no further bits)</text>

  <!-- tally bars -->
  <text x="140" y="209" text-anchor="end" fill="#e2903a" font-size="12.5">H<tspan font-size="9.5" dy="3">a</tspan><tspan dy="-3"></tspan></text>
  <rect x="150" y="190" width="66.6" height="26" fill="#e2903a" opacity="0.85" />
  <rect x="216.6" y="190" width="66.6" height="26" fill="#e2903a" opacity="0.5" />
  <text x="183" y="207" text-anchor="middle" fill="currentColor" font-size="11">start 6.7</text>
  <text x="250" y="207" text-anchor="middle" fill="currentColor" font-size="11">n 6.7</text>
  <text x="293" y="208" fill="#e2903a" font-size="12.5" font-weight="600">13.3 bits</text>

  <text x="140" y="259" text-anchor="end" fill="#4c8dd6" font-size="12.5">H<tspan font-size="9.5" dy="3">c</tspan><tspan dy="-3"></tspan></text>
  <rect x="150" y="240" width="66.6" height="26" fill="#4c8dd6" opacity="0.85" />
  <rect x="216.6" y="240" width="103" height="26" fill="#4c8dd6" opacity="0.6" />
  <rect x="319.6" y="240" width="103" height="26" fill="#4c8dd6" opacity="0.45" />
  <rect x="422.6" y="240" width="113" height="26" fill="#4c8dd6" opacity="0.3" />
  <text x="183" y="257" text-anchor="middle" fill="currentColor" font-size="11">start 6.7</text>
  <text x="268" y="257" text-anchor="middle" fill="currentColor" font-size="11">c 10.3</text>
  <text x="371" y="257" text-anchor="middle" fill="currentColor" font-size="11">d 10.3</text>
  <text x="479" y="257" text-anchor="middle" fill="currentColor" font-size="11">e 11.3</text>
  <text x="545" y="258" fill="#4c8dd6" font-size="12.5" font-weight="600">38.6 bits</text>

  <!-- gap bracket -->
  <line x1="283.2" y1="284" x2="535.6" y2="284" stroke="currentColor" stroke-width="1.2" />
  <line x1="283.2" y1="278" x2="283.2" y2="290" stroke="currentColor" stroke-width="1.2" />
  <line x1="535.6" y1="278" x2="535.6" y2="290" stroke="currentColor" stroke-width="1.2" />
  <text x="409" y="305" text-anchor="middle" fill="currentColor" font-size="12.5" font-weight="600">25.2 bits shorter &#8212; odds of about 4 &#215; 10&#8311; to one</text>

  <!-- bits axis -->
  <line x1="150" y1="322" x2="600" y2="322" stroke="currentColor" stroke-width="1" opacity="0.45" />
  <g fill="currentColor" opacity="0.55" font-size="11">
    <line x1="150" y1="322" x2="150" y2="327" stroke="currentColor" stroke-width="1" />
    <text x="150" y="338" text-anchor="middle">0</text>
    <line x1="250" y1="322" x2="250" y2="327" stroke="currentColor" stroke-width="1" />
    <text x="250" y="338" text-anchor="middle">10</text>
    <line x1="350" y1="322" x2="350" y2="327" stroke="currentColor" stroke-width="1" />
    <text x="350" y="338" text-anchor="middle">20</text>
    <line x1="450" y1="322" x2="450" y2="327" stroke="currentColor" stroke-width="1" />
    <text x="450" y="338" text-anchor="middle">30</text>
    <line x1="550" y1="322" x2="550" y2="327" stroke="currentColor" stroke-width="1" />
    <text x="550" y="338" text-anchor="middle">40 bits</text>
  </g>
</svg>

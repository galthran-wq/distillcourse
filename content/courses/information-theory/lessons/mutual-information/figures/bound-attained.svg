<svg viewBox="0 0 600 244" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .lbl { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .amber { fill: #e2903a; }
    .blue { fill: #4c8dd6; }
  </style>

  <text class="lbl" x="20" y="22" font-size="13"><tspan font-weight="600">X</tspan> = one fair die roll, <tspan font-weight="600">Y</tspan> = 1 if X &#8805; 5, else 0</text>

  <!-- bits axis -->
  <line x1="110" y1="46" x2="530" y2="46" stroke="currentColor" stroke-opacity="0.4"/>
  <line x1="110" y1="43" x2="110" y2="49" stroke="currentColor" stroke-opacity="0.4"/>
  <line x1="260" y1="43" x2="260" y2="49" stroke="currentColor" stroke-opacity="0.4"/>
  <line x1="410" y1="43" x2="410" y2="49" stroke="currentColor" stroke-opacity="0.4"/>
  <text class="muted" x="110" y="36" text-anchor="middle">0</text>
  <text class="muted" x="260" y="36" text-anchor="middle">1</text>
  <text class="muted" x="410" y="36" text-anchor="middle">2</text>
  <text class="muted" x="540" y="36" text-anchor="start">bits</text>

  <!-- dashed guide at the shared 0.918 bits -->
  <line x1="247.7" y1="52" x2="247.7" y2="196" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5"/>

  <!-- H(X) bar -->
  <text class="lbl" x="100" y="88" text-anchor="end">H(X) = 2.585</text>
  <rect x="110" y="70" width="137.7" height="26" fill="#e2903a" opacity="0.9"/>
  <rect x="247.7" y="70" width="250.1" height="26" fill="#4c8dd6" opacity="0.85"/>
  <rect x="110" y="70" width="387.8" height="26" rx="2" fill="none" stroke="currentColor" stroke-opacity="0.4"/>
  <text class="blue" x="372" y="88" text-anchor="middle">H(X | Y) = 1.667</text>

  <!-- H(Y) bar -->
  <text class="lbl" x="100" y="140" text-anchor="end">H(Y) = 0.918</text>
  <rect x="110" y="122" width="137.7" height="26" fill="#e2903a" opacity="0.9"/>
  <rect x="110" y="122" width="137.7" height="26" rx="2" fill="none" stroke="currentColor" stroke-opacity="0.4"/>
  <text class="muted" x="258" y="140" text-anchor="start">H(Y | X) = 0: the roll fixes the indicator</text>

  <!-- the shared amber column named -->
  <line x1="178" y1="100" x2="178" y2="118" stroke="#e2903a" stroke-opacity="0.7"/>
  <text class="amber" x="178" y="184" text-anchor="middle" font-weight="600">I(X;Y) = 0.918</text>
  <line x1="178" y1="152" x2="178" y2="170" stroke="#e2903a" stroke-opacity="0.7"/>

  <text class="muted" x="110" y="214" text-anchor="start">The whole of H(Y) is shared, so I = min(H(X), H(Y)) = H(Y): the upper bound is attained.</text>
  <text class="muted" x="110" y="232" text-anchor="start">The other bound is slack: 1.667 bits of the die roll survive the observation.</text>
</svg>

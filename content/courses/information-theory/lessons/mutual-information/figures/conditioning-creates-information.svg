<svg viewBox="0 0 620 306" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .lbl { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .amber { fill: #e2903a; }
    .blue { fill: #4c8dd6; }
    .cell { stroke: currentColor; stroke-opacity: 0.35; }
  </style>

  <text class="lbl" x="20" y="24" font-size="13">X, Y independent fair bits; Z = X &#8853; Y</text>

  <!-- LEFT PANEL: the plain joint of (X, Y) -->
  <text class="lbl" x="146" y="56" text-anchor="middle" font-weight="600">Z not observed</text>
  <text class="muted" x="90" y="82" text-anchor="middle">y = 0</text>
  <text class="muted" x="146" y="82" text-anchor="middle">y = 1</text>
  <text class="muted" x="56" y="118" text-anchor="end">x = 0</text>
  <text class="muted" x="56" y="166" text-anchor="end">x = 1</text>

  <rect class="cell" x="62" y="90" width="56" height="48" fill="#4c8dd6" fill-opacity="0.18"/>
  <rect class="cell" x="118" y="90" width="56" height="48" fill="#4c8dd6" fill-opacity="0.18"/>
  <rect class="cell" x="62" y="138" width="56" height="48" fill="#4c8dd6" fill-opacity="0.18"/>
  <rect class="cell" x="118" y="138" width="56" height="48" fill="#4c8dd6" fill-opacity="0.18"/>
  <text class="lbl" x="90" y="118" text-anchor="middle">1/4</text>
  <text class="lbl" x="146" y="118" text-anchor="middle">1/4</text>
  <text class="lbl" x="90" y="166" text-anchor="middle">1/4</text>
  <text class="lbl" x="146" y="166" text-anchor="middle">1/4</text>

  <text class="blue" x="118" y="214" text-anchor="middle" font-weight="600">I(X;Y) = 0</text>
  <text class="muted" x="118" y="232" text-anchor="middle">every cell equals the product</text>
  <text class="muted" x="118" y="248" text-anchor="middle">of its marginals</text>

  <!-- arrow between panels -->
  <line x1="240" y1="138" x2="330" y2="138" stroke="currentColor" stroke-opacity="0.6"/>
  <polygon points="330,138 320,133 320,143" fill="currentColor" fill-opacity="0.6"/>
  <text class="muted" x="285" y="128" text-anchor="middle">observe Z = 0</text>

  <!-- RIGHT PANEL: the joint given Z = 0 -->
  <text class="lbl" x="446" y="56" text-anchor="middle" font-weight="600">Z = 0 observed</text>
  <text class="muted" x="390" y="82" text-anchor="middle">y = 0</text>
  <text class="muted" x="446" y="82" text-anchor="middle">y = 1</text>
  <text class="muted" x="356" y="118" text-anchor="end">x = 0</text>
  <text class="muted" x="356" y="166" text-anchor="end">x = 1</text>

  <rect class="cell" x="362" y="90" width="56" height="48" fill="#e2903a" fill-opacity="0.45"/>
  <rect class="cell" x="418" y="90" width="56" height="48" fill="none"/>
  <rect class="cell" x="362" y="138" width="56" height="48" fill="none"/>
  <rect class="cell" x="418" y="138" width="56" height="48" fill="#e2903a" fill-opacity="0.45"/>
  <text class="lbl" x="390" y="118" text-anchor="middle">1/2</text>
  <text class="lbl" x="446" y="118" text-anchor="middle">0</text>
  <text class="lbl" x="390" y="166" text-anchor="middle">0</text>
  <text class="lbl" x="446" y="166" text-anchor="middle">1/2</text>

  <text class="amber" x="418" y="214" text-anchor="middle" font-weight="600">I(X;Y | Z = 0) = 1 bit</text>
  <text class="muted" x="418" y="232" text-anchor="middle">x now determines y:</text>
  <text class="muted" x="418" y="248" text-anchor="middle">y = z &#8853; x</text>

  <!-- tally -->
  <line x1="40" y1="266" x2="580" y2="266" stroke="currentColor" stroke-opacity="0.25"/>
  <text class="muted" x="310" y="288" text-anchor="middle">Conditioning raised the shared information: I(X;Y) &#8722; I(X;Y | Z) = &#8722;1 bit, an &#8220;overlap&#8221; no area can hold.</text>
</svg>

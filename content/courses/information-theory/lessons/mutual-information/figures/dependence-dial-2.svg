<svg viewBox="0 0 560 170" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="40" y="24" font-size="13" fill="currentColor"><tspan font-weight="600">weakly coupled</tspan>: q = P(Y = X) = 0.75</text>


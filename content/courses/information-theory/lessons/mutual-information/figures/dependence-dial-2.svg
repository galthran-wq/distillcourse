  <rect x="112" y="108" width="56" height="48" rx="3" fill="currentColor" fill-opacity="0.26" stroke="currentColor" stroke-opacity="0.35"/>
  <text x="84" y="88" font-size="12" text-anchor="middle" fill="currentColor">0.375</text>

  <text x="50" y="136" font-size="11" text-anchor="end" fill="currentColor" opacity="0.55">x = 1</text>

  <rect x="56" y="60" width="56" height="48" rx="3" fill="currentColor" fill-opacity="0.26" stroke="currentColor" stroke-opacity="0.35"/>

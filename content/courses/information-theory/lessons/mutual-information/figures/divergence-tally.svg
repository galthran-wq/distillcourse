<svg viewBox="0 0 600 286" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .lbl { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .amber { fill: #e2903a; }
    .blue { fill: #4c8dd6; }
  </style>

  <text class="muted" x="20" y="24">weather table: every cell against the product of its marginals</text>

  <!-- column headers -->
  <text class="muted" x="20" y="56">cell</text>
  <text class="muted" x="205" y="56" text-anchor="middle">p(x, y)</text>
  <text class="muted" x="285" y="56" text-anchor="middle">p(x) p(y)</text>
  <text class="muted" x="355" y="56" text-anchor="middle">ratio</text>
  <text class="muted" x="430" y="56" text-anchor="middle">log&#8322; ratio</text>
  <text class="muted" x="525" y="56" text-anchor="middle">weight &#215; log&#8322;</text>
  <line x1="20" y1="64" x2="580" y2="64" stroke="currentColor" stroke-opacity="0.3"/>

  <!-- row 1: clear, dry -->
  <rect x="20" y="70" width="560" height="30" fill="#e2903a" fill-opacity="0.12"/>
  <text class="lbl" x="20" y="90">clear, dry</text>
  <text class="lbl" x="205" y="90" text-anchor="middle">1/2</text>
  <text class="lbl" x="285" y="90" text-anchor="middle">3/8</text>
  <text class="lbl" x="355" y="90" text-anchor="middle">4/3</text>
  <text class="amber" x="430" y="90" text-anchor="middle">+0.415</text>
  <text class="amber" x="525" y="90" text-anchor="middle">+0.208</text>

  <!-- row 2: clear, wet -->
  <text class="lbl" x="20" y="120">clear, wet</text>
  <text class="lbl" x="205" y="120" text-anchor="middle">0</text>
  <text class="lbl" x="285" y="120" text-anchor="middle">1/8</text>
  <text class="muted" x="355" y="120" text-anchor="middle">0</text>
  <text class="muted" x="430" y="120" text-anchor="middle">&#8212;</text>
  <text class="muted" x="525" y="120" text-anchor="middle">0 (weight 0)</text>

  <!-- row 3: overcast, dry -->
  <rect x="20" y="130" width="560" height="30" fill="#4c8dd6" fill-opacity="0.14"/>
  <text class="lbl" x="20" y="150">overcast, dry</text>
  <text class="lbl" x="205" y="150" text-anchor="middle">1/4</text>
  <text class="lbl" x="285" y="150" text-anchor="middle">3/8</text>
  <text class="lbl" x="355" y="150" text-anchor="middle">2/3</text>
  <text class="blue" x="430" y="150" text-anchor="middle">&#8722;0.585</text>
  <text class="blue" x="525" y="150" text-anchor="middle">&#8722;0.146</text>

  <!-- row 4: overcast, wet -->
  <rect x="20" y="160" width="560" height="30" fill="#e2903a" fill-opacity="0.12"/>
  <text class="lbl" x="20" y="180">overcast, wet</text>
  <text class="lbl" x="205" y="180" text-anchor="middle">1/4</text>
  <text class="lbl" x="285" y="180" text-anchor="middle">1/8</text>
  <text class="lbl" x="355" y="180" text-anchor="middle">2</text>
  <text class="amber" x="430" y="180" text-anchor="middle">+1.000</text>
  <text class="amber" x="525" y="180" text-anchor="middle">+0.250</text>

  <line x1="20" y1="200" x2="580" y2="200" stroke="currentColor" stroke-opacity="0.3"/>
  <text class="lbl" x="20" y="222" font-weight="600">sum</text>
  <text class="amber" x="525" y="222" text-anchor="middle" font-weight="600">0.311 bits</text>

  <text class="muted" x="20" y="252">One cell sits below what independence predicts (blue),</text>
  <text class="muted" x="20" y="270">two above it (amber); the weighted total cannot be negative.</text>
</svg>

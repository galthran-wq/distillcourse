<svg viewBox="0 0 600 336" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .lbl { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .amber { fill: #e2903a; }
    .blue { fill: #4c8dd6; }
    .cell { stroke: currentColor; stroke-opacity: 0.35; fill: none; }
  </style>

  <text class="muted" x="24" y="26">sky X &#8712; {clear, overcast}, ground Y &#8712; {dry, wet}</text>

  <!-- joint table -->
  <text class="muted" x="118" y="52" text-anchor="middle">dry</text>
  <text class="muted" x="173" y="52" text-anchor="middle">wet</text>
  <text class="muted" x="230" y="52" text-anchor="middle">p(x)</text>

  <rect class="cell" x="90" y="60" width="56" height="40"/>
  <rect class="cell" x="146" y="60" width="56" height="40"/>
  <rect class="cell" x="90" y="100" width="56" height="40"/>
  <rect class="cell" x="146" y="100" width="56" height="40"/>

  <text class="muted" x="84" y="85" text-anchor="end">clear</text>
  <text class="muted" x="84" y="125" text-anchor="end">overcast</text>
  <text class="muted" x="84" y="165" text-anchor="end">p(y)</text>

  <text class="lbl" x="118" y="85" text-anchor="middle">1/2</text>
  <text class="lbl" x="173" y="85" text-anchor="middle">0</text>
  <text class="lbl" x="118" y="125" text-anchor="middle">1/4</text>
  <text class="lbl" x="173" y="125" text-anchor="middle">1/4</text>

  <text class="muted" x="230" y="85" text-anchor="middle">1/2</text>
  <text class="muted" x="230" y="125" text-anchor="middle">1/2</text>
  <text class="muted" x="118" y="165" text-anchor="middle">3/4</text>
  <text class="muted" x="173" y="165" text-anchor="middle">1/4</text>

  <!-- entropy ledger -->
  <text class="muted" x="330" y="52">five entropies of this table, in bits</text>
  <text class="lbl" x="330" y="76">H(X) = 1</text>
  <text class="lbl" x="330" y="96">H(Y) = 0.811</text>
  <text class="lbl" x="330" y="116">H(X, Y) = 1.5</text>
  <text class="blue" x="330" y="136">H(Y | X) = 0.5</text>
  <text class="blue" x="330" y="156">H(X | Y) = 0.689</text>

  <line x1="24" y1="188" x2="576" y2="188" stroke="currentColor" stroke-opacity="0.25"/>

  <!-- three routes -->
  <text class="muted" x="24" y="212">three routes</text>

  <text class="lbl" x="24" y="242">H(X) &#8722; <tspan class="blue">H(X | Y)</tspan></text>
  <text class="lbl" x="208" y="242">= 1 &#8722; 0.689</text>
  <text class="amber" x="352" y="242" font-weight="600">= 0.311</text>

  <text class="lbl" x="24" y="272">H(Y) &#8722; <tspan class="blue">H(Y | X)</tspan></text>
  <text class="lbl" x="208" y="272">= 0.811 &#8722; 0.5</text>
  <text class="amber" x="352" y="272" font-weight="600">= 0.311</text>

  <text class="lbl" x="24" y="302">H(X) + H(Y) &#8722; H(X, Y)</text>
  <text class="lbl" x="208" y="302">= 1 + 0.811 &#8722; 1.5</text>
  <text class="amber" x="352" y="302" font-weight="600">= 0.311</text>

  <!-- brace tying the three results together -->
  <path d="M 432 232 h 8 v 30 h 8 h -8 v 30 h -8" fill="none" stroke="#e2903a" stroke-opacity="0.8"/>
  <text class="amber" x="456" y="268" font-weight="600">I(X;Y) = 0.311 bits</text>
</svg>

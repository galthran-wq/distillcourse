<circle cx="269.6" cy="96" r="4" fill="currentColor"/>
<text class="muted" x="279.6" y="100">lower bound → direct</text>
<text class="muted" x="196" y="126" text-anchor="end">salamander retina (spots)</text>
<circle cx="273.6" cy="122" r="4" fill="currentColor"/>

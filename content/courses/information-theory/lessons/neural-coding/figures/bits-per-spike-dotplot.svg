      <path d="M 0 1 L 9 5 L 0 9 z" fill="#e2903a"/>
    </marker>
  </defs>
<text class="lbl" x="24" y="28">bits per spike, by preparation and stimulus (Borst &amp; Theunissen, Table 2)</text>

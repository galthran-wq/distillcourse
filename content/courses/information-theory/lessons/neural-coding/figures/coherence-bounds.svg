<svg viewBox="0 0 560 232" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .lbl { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .amber { fill: #e2903a; }
    .blue { fill: #4c8dd6; }
    .ax { stroke: currentColor; stroke-opacity: 0.5; }
  </style>
  <text class="muted" x="80" y="30">fly HS cell, frequencies below 10 Hz</text>

  <!-- stacked coherence bar: coherence 0..1 maps to x 80..480 -->
  <rect x="80" y="48" width="240" height="26" rx="3" fill="#e2903a" fill-opacity="0.75"/>
  <rect x="320" y="48" width="120" height="26" rx="3" fill="#4c8dd6" fill-opacity="0.55"/>
  <rect x="440" y="48" width="40" height="26" rx="3" fill="currentColor" fill-opacity="0.18"/>
  <rect x="80" y="48" width="400" height="26" rx="3" fill="none" stroke="currentColor" stroke-opacity="0.55"/>
  <text class="lbl" x="200" y="66" text-anchor="middle">0.6</text>
  <text class="lbl" x="380" y="66" text-anchor="middle">0.3</text>
  <text class="lbl" x="460" y="66" text-anchor="middle">0.1</text>

  <!-- axis under the bar -->
  <line class="ax" x1="80" y1="84" x2="480" y2="84"/>
  <line class="ax" x1="80" y1="84" x2="80" y2="89"/>
  <text class="muted" x="80" y="102" text-anchor="middle">0</text>
  <line class="ax" x1="320" y1="84" x2="320" y2="89"/>
  <text class="muted" x="320" y="102" text-anchor="middle">0.6</text>
  <line class="ax" x1="440" y1="84" x2="440" y2="89"/>
  <text class="muted" x="440" y="102" text-anchor="middle">0.9</text>
  <line class="ax" x1="480" y1="84" x2="480" y2="89"/>
  <text class="muted" x="480" y="102" text-anchor="middle">1.0</text>
  <text class="muted" x="280" y="120" text-anchor="middle">coherence between stimulus and response</text>

  <!-- legend rows -->
  <rect x="80" y="146" width="12" height="12" rx="2" fill="#e2903a" fill-opacity="0.75"/>
  <text class="lbl" x="102" y="156">0.6 recovered by a linear filter: the lower bound, 21 bits/s</text>
  <rect x="80" y="172" width="12" height="12" rx="2" fill="#4c8dd6" fill-opacity="0.55"/>
  <text class="lbl" x="102" y="182">0.3 lost to a nonlinearity the filter cannot follow</text>
  <rect x="80" y="198" width="12" height="12" rx="2" fill="currentColor" fill-opacity="0.18" stroke="currentColor" stroke-opacity="0.4"/>
  <text class="lbl" x="102" y="208">0.1 lost to response noise: noise alone sets the upper bound, 73 bits/s</text>
</svg>

<svg viewBox="0 0 560 274" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .lbl { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .amber { fill: #e2903a; }
    .blue { fill: #4c8dd6; }
    .guide { stroke: currentColor; stroke-dasharray: 3 3; opacity: 0.5; }
    .ax { stroke: currentColor; stroke-opacity: 0.5; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="currentColor"/>
    </marker>
    <marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#e2903a"/>
    </marker>
  </defs>
<text class="lbl" x="24" y="28">transmitted information as a fraction of the response-entropy budget</text>
<text class="muted" x="24" y="60">one binary bin, the toy neuron of this lesson</text>
<text class="muted" x="214" y="93" text-anchor="end">uniform ensemble</text>
<rect x="226" y="78" width="252" height="20" rx="3" fill="none" stroke="currentColor" stroke-opacity="0.55"/>
<rect x="226" y="78" width="114.9" height="20" rx="3" fill="#e2903a" fill-opacity="0.75"/>
<text class="lbl" x="488" y="93">η = 46%</text>
<text class="muted" x="214" y="125" text-anchor="end">p(s₁) = 0.9</text>
<rect x="226" y="110" width="252" height="20" rx="3" fill="none" stroke="currentColor" stroke-opacity="0.55"/>
<rect x="226" y="110" width="62.2" height="20" rx="3" fill="#e2903a" fill-opacity="0.75"/>
<text class="lbl" x="488" y="125">η = 25%</text>
<text class="muted" x="24" y="146">frog auditory nerve (Rieke et al. 1995)</text>
<text class="muted" x="214" y="179" text-anchor="end">broadband noise, 46 bits/s</text>
<rect x="226" y="164" width="252" height="20" rx="3" fill="none" stroke="currentColor" stroke-opacity="0.55"/>
<rect x="226" y="164" width="50.4" height="20" rx="3" fill="#e2903a" fill-opacity="0.75"/>
<text class="lbl" x="488" y="179">η ≈ 20%</text>
<text class="muted" x="214" y="211" text-anchor="end">conspecific call, 133 bits/s</text>
<rect x="226" y="196" width="252" height="20" rx="3" fill="none" stroke="currentColor" stroke-opacity="0.55"/>
<rect x="226" y="196" width="226.8" height="20" rx="3" fill="#e2903a" fill-opacity="0.75"/>
<text class="lbl" x="488" y="211">η ≈ 90%</text>
<text class="muted" x="352" y="242" text-anchor="middle">outline = the most a spike train at that firing rate could carry</text>
<text class="amber" x="352" y="260" text-anchor="middle">amber = what the code actually transmits</text>
</svg>

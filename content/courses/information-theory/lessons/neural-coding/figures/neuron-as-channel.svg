<svg viewBox="0 0 600 244" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .lbl { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .amber { fill: #e2903a; }
    .blue { fill: #4c8dd6; }
    .guide { stroke: currentColor; stroke-dasharray: 3 3; opacity: 0.5; }
    .ax { stroke: currentColor; stroke-opacity: 0.5; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="currentColor"/>
    </marker>
    <marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#e2903a"/>
    </marker>
  </defs>
<text class="muted" x="128" y="42" text-anchor="middle">stimulus s</text>
<text class="muted" x="308" y="42" text-anchor="middle">binned response r</text>
<circle cx="128" cy="84" r="16" fill="none" stroke="currentColor" stroke-opacity="0.6"/>
<text class="lbl" x="128" y="88" text-anchor="middle">s₀</text>
<text class="muted" x="104" y="88" text-anchor="end">weak</text>
<circle cx="128" cy="174" r="16" fill="none" stroke="currentColor" stroke-opacity="0.6"/>
<text class="lbl" x="128" y="178" text-anchor="middle">s₁</text>
<text class="muted" x="104" y="178" text-anchor="end">strong</text>
<circle cx="308" cy="84" r="16" fill="none" stroke="currentColor" stroke-opacity="0.6"/>
<text class="lbl" x="308" y="88" text-anchor="middle">0</text>
<text class="muted" x="332" y="88">silent</text>
<circle cx="308" cy="174" r="16" fill="none" stroke="currentColor" stroke-opacity="0.6"/>
<text class="lbl" x="308" y="178" text-anchor="middle">1</text>
<text class="muted" x="332" y="178">spike</text>
<line class="ax" x1="146" y1="84" x2="288" y2="84" marker-end="url(#ah)"/>
<line class="ax" x1="146" y1="174" x2="288" y2="174" marker-end="url(#ah)"/>
<text class="muted" x="217" y="76" text-anchor="middle">7/8</text>
<text class="muted" x="217" y="190" text-anchor="middle">7/8</text>
<line x1="142" y1="98" x2="294" y2="160" stroke="#e2903a" stroke-width="1.6" marker-end="url(#aha)"/>
<line x1="142" y1="160" x2="294" y2="98" stroke="#e2903a" stroke-width="1.6" marker-end="url(#aha)"/>
<text class="amber" x="166" y="122" font-size="11">1/8</text>
<text class="amber" x="166" y="154" font-size="11">1/8</text>
<text class="muted" x="60" y="226">one bin of width Δt = 5 ms; the arrows are the whole neuron</text>
<text class="muted" x="424" y="42">p(r | s)</text>
<text class="muted" x="492" y="66" text-anchor="middle">r = 0</text>
<text class="muted" x="548" y="66" text-anchor="middle">r = 1</text>
<line class="ax" x1="424" y1="74" x2="574" y2="74"/>
<line class="ax" x1="462" y1="52" x2="462" y2="132"/>
<text class="muted" x="456" y="98" text-anchor="end">s = s₀</text>
<text class="muted" x="456" y="124" text-anchor="end">s = s₁</text>
<text class="lbl" x="492" y="98" text-anchor="middle">7/8</text>
<text class="amber" x="548" y="98" text-anchor="middle">1/8</text>
<text class="amber" x="492" y="124" text-anchor="middle">1/8</text>
<text class="lbl" x="548" y="124" text-anchor="middle">7/8</text>
<text class="amber" x="424" y="166" font-size="11">amber = the trial-to-trial noise</text>
<text class="lbl" x="424" y="190">H(R | S) = H(1/8)</text>
<text class="lbl" x="424" y="208">= 0.544 bits</text>
</svg>

<svg viewBox="0 0 560 262" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .lbl { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .amber { fill: #e2903a; }
    .blue { fill: #4c8dd6; }
    .guide { stroke: currentColor; stroke-dasharray: 3 3; opacity: 0.5; }
    .ax { stroke: currentColor; stroke-opacity: 0.5; }
  </style>
  <text class="muted" x="24" y="26">32 possible words, 200 trials per stimulus: predicted bias 0.11 bits</text>

  <!-- true value guide -->
  <line class="guide" x1="382" y1="44" x2="382" y2="206"/>
  <text class="muted" x="382" y="40" text-anchor="middle">true I = 0.45 bits</text>

  <!-- row 1: raw estimate -->
  <text class="lbl" x="162" y="70" text-anchor="end">raw estimate</text>
  <rect x="170" y="55" width="264" height="20" rx="3" fill="#e2903a" fill-opacity="0.75"/>
  <text class="amber" x="442" y="70">0.56</text>

  <!-- row 2: shuffled control -->
  <text class="lbl" x="162" y="106" text-anchor="end">shuffled control</text>
  <rect x="170" y="91" width="52" height="20" rx="3" fill="#4c8dd6" fill-opacity="0.75"/>
  <text class="blue" x="230" y="106">0.11</text>
  <text class="muted" x="266" y="106">stimuli re-paired at random, so the truth here is 0</text>

  <!-- separator -->
  <line class="ax" x1="170" y1="128" x2="500" y2="128" stroke-dasharray="2 3"/>

  <!-- row 3: difference -->
  <text class="lbl" x="162" y="156" text-anchor="end">difference</text>
  <rect x="170" y="141" width="212" height="20" rx="3" fill="none" stroke="#e2903a" stroke-width="1.6"/>
  <text class="amber" x="390" y="156">0.45</text>
  <text class="muted" x="176" y="180">the only part defensible as signal</text>

  <!-- axis -->
  <line class="ax" x1="170" y1="206" x2="500" y2="206"/>
  <line class="ax" x1="170" y1="206" x2="170" y2="211"/>
  <text class="muted" x="170" y="224" text-anchor="middle">0</text>
  <line class="ax" x1="264.3" y1="206" x2="264.3" y2="211"/>
  <text class="muted" x="264.3" y="224" text-anchor="middle">0.2</text>
  <line class="ax" x1="358.6" y1="206" x2="358.6" y2="211"/>
  <text class="muted" x="358.6" y="224" text-anchor="middle">0.4</text>
  <line class="ax" x1="452.9" y1="206" x2="452.9" y2="211"/>
  <text class="muted" x="452.9" y="224" text-anchor="middle">0.6</text>
  <text class="muted" x="335" y="244" text-anchor="middle">bits per word</text>
</svg>

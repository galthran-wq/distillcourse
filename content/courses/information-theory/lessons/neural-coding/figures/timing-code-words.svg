<svg viewBox="0 0 560 262" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .lbl { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .amber { fill: #e2903a; }
    .blue { fill: #4c8dd6; }
    .guide { stroke: currentColor; stroke-dasharray: 3 3; opacity: 0.5; }
    .ax { stroke: currentColor; stroke-opacity: 0.5; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="currentColor"/>
    </marker>
    <marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#e2903a"/>
    </marker>
  </defs>
<text class="lbl" x="24" y="28">the same spike count, two different words</text>
<line class="guide" x1="60" y1="54" x2="60" y2="196"/>
<line class="guide" x1="156" y1="54" x2="156" y2="196"/>
<line class="guide" x1="252" y1="54" x2="252" y2="196"/>
<text class="muted" x="108" y="50" text-anchor="middle">bin 1</text>
<text class="muted" x="204" y="50" text-anchor="middle">bin 2</text>
<text class="muted" x="52" y="97" text-anchor="end">s₀</text>
<line class="ax" x1="60" y1="72" x2="252" y2="72"/>
<line x1="108" y1="67" x2="108" y2="77" stroke="#e2903a" stroke-width="2.2"/>
<line class="ax" x1="60" y1="88" x2="252" y2="88"/>
<line x1="108" y1="83" x2="108" y2="93" stroke="#e2903a" stroke-width="2.2"/>
<line class="ax" x1="60" y1="104" x2="252" y2="104"/>
<line x1="108" y1="99" x2="108" y2="109" stroke="#e2903a" stroke-width="2.2"/>
<line class="ax" x1="60" y1="120" x2="252" y2="120"/>
<line x1="204" y1="115" x2="204" y2="125" stroke="#e2903a" stroke-width="2.2"/>
<text class="muted" x="52" y="173" text-anchor="end">s₁</text>
<line class="ax" x1="60" y1="148" x2="252" y2="148"/>
<line x1="204" y1="143" x2="204" y2="153" stroke="#e2903a" stroke-width="2.2"/>
<line class="ax" x1="60" y1="164" x2="252" y2="164"/>
<line x1="204" y1="159" x2="204" y2="169" stroke="#e2903a" stroke-width="2.2"/>
<line class="ax" x1="60" y1="180" x2="252" y2="180"/>
<line x1="204" y1="175" x2="204" y2="185" stroke="#e2903a" stroke-width="2.2"/>
<line class="ax" x1="60" y1="196" x2="252" y2="196"/>
<line x1="108" y1="191" x2="108" y2="201" stroke="#e2903a" stroke-width="2.2"/>
<text class="muted" x="60" y="216">every trial carries exactly one spike</text>
<text class="muted" x="300" y="72">p(word | s)</text>
<text class="muted" x="384" y="96" text-anchor="middle">10</text>
<text class="muted" x="444" y="96" text-anchor="middle">01</text>
<line class="ax" x1="300" y1="104" x2="474" y2="104"/>
<line class="ax" x1="348" y1="82" x2="348" y2="162"/>
<text class="muted" x="342" y="128" text-anchor="end">s = s₀</text>
<text class="muted" x="342" y="154" text-anchor="end">s = s₁</text>
<text class="lbl" x="384" y="128" text-anchor="middle">3/4</text>
<text class="lbl" x="444" y="128" text-anchor="middle">1/4</text>
<text class="lbl" x="384" y="154" text-anchor="middle">1/4</text>
<text class="lbl" x="444" y="154" text-anchor="middle">3/4</text>
<text class="lbl" x="300" y="192">Δt = 5 ms:  I = 1 − H(1/4) = 0.189 bits</text>
<rect x="294" y="204" width="200" height="26" rx="4" fill="none" stroke="#e2903a"/>
<text class="amber" x="302" y="221">Δt = 10 ms:  I = 0 bits</text>
<text class="muted" x="300" y="248">one bin sees only the count: 1 either way</text>
</svg>

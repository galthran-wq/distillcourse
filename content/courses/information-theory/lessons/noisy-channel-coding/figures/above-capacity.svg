<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .axis  { stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.2; fill: none; }
    .guide { stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
    .opt   { stroke: #e2903a; stroke-width: 2.5; fill: none; }
    .simple { stroke: #4c8dd6; stroke-width: 2; stroke-dasharray: 5 4; fill: none; }
    .dot   { fill: #e2903a; }
  </style>

  <!-- axes -->
  <path class="axis" d="M70 260 L610 260"/>
  <path class="axis" d="M70 260 L70 30"/>
  <text class="muted" x="340" y="292" text-anchor="middle">rate R (message bits per channel use)</text>
  <text class="muted" x="70" y="22" text-anchor="middle">p_b</text>

  <!-- x ticks -->
  <path class="axis" d="M70 260 L70 265"/>
  <path class="axis" d="M240 260 L240 265"/>
  <path class="axis" d="M410 260 L410 265"/>
  <path class="axis" d="M580 260 L580 265"/>
  <text class="muted" x="70" y="280" text-anchor="middle">0</text>
  <text class="muted" x="240" y="280" text-anchor="middle">1</text>
  <text class="muted" x="410" y="280" text-anchor="middle">2</text>
  <text class="muted" x="580" y="280" text-anchor="middle">3</text>

  <!-- y ticks -->
  <path class="axis" d="M65 260 L70 260"/>
  <path class="axis" d="M65 203 L70 203"/>
  <path class="axis" d="M65 146 L70 146"/>
  <path class="axis" d="M65 89 L70 89"/>
  <text class="muted" x="60" y="264" text-anchor="end">0</text>
  <text class="muted" x="60" y="207" text-anchor="end">0.1</text>
  <text class="muted" x="60" y="150" text-anchor="end">0.2</text>
  <text class="muted" x="60" y="93" text-anchor="end">0.3</text>

  <!-- the asymptote at R = C -->
  <path class="guide" d="M160 260 L160 40"/>
  <text class="muted" x="166" y="52">R = C = 0.531</text>
  <text class="muted" x="166" y="68">(zero-error limit)</text>

  <!-- Shannon's optimum: R = C / (1 - H2(p_b)) -->
  <path class="opt" d="M160 260 L168 254 L175 249 L196 231 L240 203 L301 174 L394 146 L500 124 L580 113"/>
  <text x="430" y="176" fill="#e2903a" font-weight="600">R = C / (1 − H₂(p_b))</text>

  <!-- the naive strategy: keep C/R of the bits, guess the rest -->
  <path class="simple" d="M160 260 L170 231 L183 203 L199 174 L220 146 L250 117 L296 89 L371 60"/>
  <text x="300" y="70" fill="#4c8dd6">discard-and-guess: R = C / (1 − 2p_b)</text>

  <!-- the uncoded point -->
  <circle class="dot" cx="240" cy="203" r="5"/>
  <path class="guide" d="M240 203 L268 218"/>
  <text class="muted" x="273" y="222">R = 1, p_b = 0.1: uncoded transmission,</text>
  <text class="muted" x="273" y="238">and nothing at rate 1 beats it</text>

  <text class="muted" x="340" y="312" text-anchor="middle">BSC with f = 0.1 — achievable pairs lie on or to the left of the amber curve</text>
</svg>

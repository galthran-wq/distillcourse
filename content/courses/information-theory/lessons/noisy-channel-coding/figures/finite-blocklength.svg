<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .axis  { stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.2; fill: none; }
    .guide { stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
    .cap   { stroke: #4c8dd6; stroke-width: 2; fill: none; }
    .rate  { stroke: #e2903a; stroke-width: 2.5; fill: none; }
    .dot   { fill: #e2903a; }
  </style>

  <!-- axes -->
  <path class="axis" d="M90 260 L610 260"/>
  <path class="axis" d="M90 260 L90 30"/>
  <text class="muted" x="350" y="292" text-anchor="middle">blocklength n (log scale)</text>
  <text class="muted" x="90" y="22" text-anchor="middle">rate</text>

  <!-- x ticks -->
  <path class="axis" d="M90 260 L90 265"/>
  <path class="axis" d="M215 260 L215 265"/>
  <path class="axis" d="M340 260 L340 265"/>
  <path class="axis" d="M465 260 L465 265"/>
  <path class="axis" d="M590 260 L590 265"/>
  <text class="muted" x="90" y="280" text-anchor="middle">100</text>
  <text class="muted" x="215" y="280" text-anchor="middle">1,000</text>
  <text class="muted" x="340" y="280" text-anchor="middle">10⁴</text>
  <text class="muted" x="465" y="280" text-anchor="middle">10⁵</text>
  <text class="muted" x="590" y="280" text-anchor="middle">10⁶</text>

  <!-- y ticks -->
  <path class="axis" d="M85 260 L90 260"/>
  <path class="axis" d="M85 199 L90 199"/>
  <path class="axis" d="M85 138 L90 138"/>
  <path class="axis" d="M85 77 L90 77"/>
  <text class="muted" x="80" y="264" text-anchor="end">0</text>
  <text class="muted" x="80" y="203" text-anchor="end">0.2</text>
  <text class="muted" x="80" y="142" text-anchor="end">0.4</text>
  <text class="muted" x="80" y="81" text-anchor="end">0.6</text>

  <!-- capacity line -->
  <path class="cap" d="M90 65 L610 65"/>
  <text x="614" y="62" fill="#4c8dd6" font-weight="600" text-anchor="end">C = 0.531</text>

  <!-- best rate at block error 1e-3 -->
  <path class="rate" d="M90 173 L128 142 L177 113 L215 99 L253 90 L302 81 L340 76 L400 72 L465 69 L525 67 L590 66"/>
  <circle class="dot" cx="90" cy="173" r="4"/>
  <circle class="dot" cx="215" cy="99" r="4"/>
  <circle class="dot" cx="340" cy="76" r="4"/>

  <path class="guide" d="M90 173 L150 190"/>
  <text class="muted" x="155" y="194">n = 100: 0.24 — under half of C</text>
  <path class="guide" d="M215 99 L245 122"/>
  <text class="muted" x="250" y="126">n = 1,000: 0.44</text>
  <path class="guide" d="M340 76 L370 100"/>
  <text class="muted" x="375" y="104">n = 10⁴: 0.50</text>

  <text x="300" y="46" fill="#e2903a" font-weight="600">deficit ≈ √(V/n) · Q⁻¹(ε)</text>
  <text class="muted" x="350" y="312" text-anchor="middle">BSC with f = 0.1, block error ε = 10⁻³, dispersion V = 0.90 bits² per use</text>
</svg>

<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .axis  { stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.2; fill: none; }
    .guide { stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
    .rep   { stroke: #e2903a; stroke-width: 2; fill: none; }
    .dot   { fill: #e2903a; }
    .capline { stroke: #4c8dd6; stroke-width: 2.5; fill: none; }
    .band  { fill: #4c8dd6; opacity: 0.09; }
  </style>

  <!-- achievable band: every rate below capacity, at every error level -->
  <rect class="band" x="70" y="30" width="276" height="240"/>

  <!-- axes -->
  <path class="axis" d="M70 270 L600 270"/>
  <path class="axis" d="M70 270 L70 30"/>
  <text class="muted" x="335" y="296" text-anchor="middle">rate R (message bits per channel use)</text>
  <text class="muted" x="70" y="22" text-anchor="middle">p_b</text>

  <!-- x ticks -->
  <path class="axis" d="M70 270 L70 275"/>
  <path class="axis" d="M346 270 L346 275"/>
  <path class="axis" d="M590 270 L590 275"/>
  <text class="muted" x="70" y="288" text-anchor="middle">0</text>
  <text class="muted" x="590" y="288" text-anchor="middle">1</text>

  <!-- y ticks: decades of decoded bit-error probability -->
  <path class="axis" d="M65 40 L70 40"/>
  <path class="axis" d="M65 86 L70 86"/>
  <path class="axis" d="M65 132 L70 132"/>
  <path class="axis" d="M65 178 L70 178"/>
  <path class="axis" d="M65 224 L70 224"/>
  <path class="axis" d="M65 270 L70 270"/>
  <text class="muted" x="60" y="44" text-anchor="end">1</text>
  <text class="muted" x="60" y="90" text-anchor="end">10⁻³</text>
  <text class="muted" x="60" y="136" text-anchor="end">10⁻⁶</text>
  <text class="muted" x="60" y="182" text-anchor="end">10⁻⁹</text>
  <text class="muted" x="60" y="228" text-anchor="end">10⁻¹²</text>
  <text class="muted" x="60" y="274" text-anchor="end">10⁻¹⁵</text>

  <!-- the repetition family R1 … R61 -->
  <path class="rep" d="M590 55 L243 64 L174 72 L144 79 L128 87 L105 109 L95 130 L87 165 L83 200 L80 235 L78.5 270"/>
  <circle class="dot" cx="590" cy="55" r="4"/>
  <circle class="dot" cx="243" cy="64" r="4"/>
  <circle class="dot" cx="174" cy="72" r="4"/>
  <circle class="dot" cx="144" cy="79" r="4"/>
  <circle class="dot" cx="128" cy="87" r="4"/>
  <circle class="dot" cx="105" cy="109" r="4"/>
  <circle class="dot" cx="95" cy="130" r="4"/>
  <circle class="dot" cx="87" cy="165" r="4"/>
  <circle class="dot" cx="83" cy="200" r="4"/>
  <circle class="dot" cx="80" cy="235" r="4"/>
  <circle class="dot" cx="78.5" cy="270" r="4"/>

  <text class="muted" x="583" y="46" text-anchor="end">R1 (uncoded): R = 1, p_b = 0.1</text>
  <text class="muted" x="255" y="60">R3: 1/3, 2.8 × 10⁻²</text>
  <text class="muted" x="186" y="70">R5: 1/5, 8.6 × 10⁻³</text>
  <text class="muted" x="117" y="107">R15</text>
  <text class="muted" x="99" y="197">R41</text>
  <text class="muted" x="92" y="266">R61: 1/61, 10⁻¹⁵</text>

  <!-- the capacity wall -->
  <path class="capline" d="M346 30 L346 270"/>
  <text x="352" y="44" fill="#4c8dd6" font-weight="600">C = 0.531</text>
  <text class="muted" x="352" y="60">everything in this band</text>
  <text class="muted" x="352" y="76">is achievable</text>

  <!-- the point the theorem promises -->
  <circle cx="304" cy="270" r="5" fill="none" stroke="#4c8dd6" stroke-width="2"/>
  <path class="guide" d="M304 270 L304 240 L250 240"/>
  <text class="muted" x="246" y="236" text-anchor="end">R = 0.45 at p_b = 10⁻¹⁵:</text>
  <text class="muted" x="246" y="252" text-anchor="end">a code exists here</text>

  <text class="muted" x="335" y="316" text-anchor="middle">BSC with f = 0.1 — repetition reaches 10⁻¹⁵ only at rate 1/61</text>
</svg>

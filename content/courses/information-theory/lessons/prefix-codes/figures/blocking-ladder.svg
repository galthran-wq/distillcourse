<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 244" font-family="system-ui, sans-serif">
  <text x="24" y="24" font-size="12" fill="currentColor" opacity="0.55">one draw from&#160;&#160;&#160;a: .7&#160;&#160;&#160;b: .15&#160;&#160;&#160;c: .15</text>

  <!-- bar 1: fixed 2-bit code -->
  <text x="160" y="71" font-size="12" fill="currentColor" text-anchor="end">fixed 2-bit code</text>
  <rect x="170" y="56" width="400" height="22" rx="3" fill="none" stroke="currentColor" stroke-width="1.3" opacity="0.8"/>
  <text x="578" y="71" font-size="12" fill="currentColor">2.00</text>

  <!-- bar 2: best symbol code -->
  <text x="160" y="111" font-size="12" fill="currentColor" text-anchor="end">best symbol code</text>
  <rect x="170" y="96" width="260" height="22" rx="3" fill="none" stroke="currentColor" stroke-width="1.3" opacity="0.8"/>
  <text x="438" y="111" font-size="12" fill="currentColor">1.30</text>
  <text x="176" y="111" font-size="11" font-family="ui-monospace, monospace" fill="currentColor" opacity="0.55">a=0  b=10  c=11</text>

  <!-- bar 3: best code on pairs -->
  <text x="160" y="151" font-size="12" fill="currentColor" text-anchor="end">best code on pairs</text>
  <rect x="170" y="136" width="239.5" height="22" rx="3" fill="#e2903a"/>
  <text x="448" y="151" font-size="12" fill="#e2903a" font-weight="600">1.1975</text>
  <text x="160" y="167" font-size="11" fill="currentColor" opacity="0.55" text-anchor="end">one codeword per pair</text>

  <!-- entropy floor, drawn over the bars so the crossing is visible -->
  <line x1="406" y1="42" x2="406" y2="192" stroke="#4c8dd6" stroke-width="1.4" stroke-dasharray="3 3"/>
  <text x="412" y="38" font-size="12" fill="#4c8dd6" font-weight="600">H = 1.181 bits</text>

  <!-- axis -->
  <line x1="170" y1="192" x2="590" y2="192" stroke="currentColor" stroke-width="1" opacity="0.4"/>
  <line x1="170" y1="192" x2="170" y2="197" stroke="currentColor" stroke-width="1" opacity="0.4"/>
  <line x1="270" y1="192" x2="270" y2="197" stroke="currentColor" stroke-width="1" opacity="0.4"/>
  <line x1="370" y1="192" x2="370" y2="197" stroke="currentColor" stroke-width="1" opacity="0.4"/>
  <line x1="470" y1="192" x2="470" y2="197" stroke="currentColor" stroke-width="1" opacity="0.4"/>
  <line x1="570" y1="192" x2="570" y2="197" stroke="currentColor" stroke-width="1" opacity="0.4"/>
  <text x="170" y="210" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">0</text>
  <text x="270" y="210" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">0.5</text>
  <text x="370" y="210" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">1.0</text>
  <text x="470" y="210" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">1.5</text>
  <text x="570" y="210" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">2.0</text>

  <text x="310" y="236" font-size="11.5" fill="currentColor" opacity="0.55" text-anchor="middle">coding pairs cuts the excess over H from 0.119 to 0.016 bits per symbol</text>
</svg>

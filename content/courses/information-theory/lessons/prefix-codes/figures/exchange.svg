<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 252" font-family="system-ui, sans-serif">
  <text x="30" y="26" font-size="12.5" fill="currentColor" font-weight="600">codewords assigned carelessly</text>
  <text x="340" y="26" font-size="12.5" fill="currentColor" font-weight="600">A and C swapped</text>

  <!-- highlight bands: the two rows that trade codewords -->
  <rect x="34" y="60" width="238" height="22" rx="3" fill="#e2903a" opacity="0.13"/>
  <rect x="34" y="108" width="238" height="22" rx="3" fill="#e2903a" opacity="0.13"/>
  <rect x="344" y="60" width="238" height="22" rx="3" fill="#e2903a" opacity="0.13"/>
  <rect x="344" y="108" width="238" height="22" rx="3" fill="#e2903a" opacity="0.13"/>

  <!-- left table -->
  <text x="46" y="52" font-size="11" fill="currentColor" opacity="0.55">outcome</text>
  <text x="140" y="52" font-size="11" fill="currentColor" opacity="0.55" text-anchor="end">p</text>
  <text x="166" y="52" font-size="11" fill="currentColor" opacity="0.55">code</text>
  <text x="264" y="52" font-size="11" fill="currentColor" opacity="0.55" text-anchor="end">len</text>
  <line x1="34" y1="57" x2="272" y2="57" stroke="currentColor" stroke-width="1" opacity="0.3"/>

  <text x="46" y="76" font-size="12.5" fill="currentColor" font-weight="600">A</text>
  <text x="140" y="76" font-size="12" fill="currentColor" text-anchor="end">.5</text>
  <text x="166" y="76" font-size="12" font-family="ui-monospace, monospace" fill="#e2903a" font-weight="600">001</text>
  <text x="264" y="76" font-size="12" fill="currentColor" text-anchor="end">3</text>

  <text x="46" y="100" font-size="12.5" fill="currentColor" font-weight="600">B</text>
  <text x="140" y="100" font-size="12" fill="currentColor" text-anchor="end">.25</text>
  <text x="166" y="100" font-size="12" font-family="ui-monospace, monospace" fill="currentColor">01</text>
  <text x="264" y="100" font-size="12" fill="currentColor" text-anchor="end">2</text>

  <text x="46" y="124" font-size="12.5" fill="currentColor" font-weight="600">C</text>
  <text x="140" y="124" font-size="12" fill="currentColor" text-anchor="end">.15</text>
  <text x="166" y="124" font-size="12" font-family="ui-monospace, monospace" fill="#e2903a" font-weight="600">1</text>
  <text x="264" y="124" font-size="12" fill="currentColor" text-anchor="end">1</text>

  <text x="46" y="148" font-size="12.5" fill="currentColor" font-weight="600">D</text>
  <text x="140" y="148" font-size="12" fill="currentColor" text-anchor="end">.1</text>
  <text x="166" y="148" font-size="12" font-family="ui-monospace, monospace" fill="currentColor">000</text>
  <text x="264" y="148" font-size="12" fill="currentColor" text-anchor="end">3</text>

  <line x1="34" y1="160" x2="272" y2="160" stroke="currentColor" stroke-width="1" opacity="0.3"/>
  <text x="34" y="180" font-size="11.5" fill="currentColor">L = .5&#183;3 + .25&#183;2 + .15&#183;1 + .1&#183;3 = <tspan font-weight="600">2.45</tspan></text>

  <!-- swap arrow -->
  <text x="310" y="98" font-size="11" fill="#e2903a" text-anchor="middle">swap</text>
  <line x1="286" y1="110" x2="326" y2="110" stroke="#e2903a" stroke-width="1.6"/>
  <path d="M 326 110 L 318 106.5 L 318 113.5 Z" fill="#e2903a"/>

  <!-- right table -->
  <text x="356" y="52" font-size="11" fill="currentColor" opacity="0.55">outcome</text>
  <text x="450" y="52" font-size="11" fill="currentColor" opacity="0.55" text-anchor="end">p</text>
  <text x="476" y="52" font-size="11" fill="currentColor" opacity="0.55">code</text>
  <text x="574" y="52" font-size="11" fill="currentColor" opacity="0.55" text-anchor="end">len</text>
  <line x1="344" y1="57" x2="582" y2="57" stroke="currentColor" stroke-width="1" opacity="0.3"/>

  <text x="356" y="76" font-size="12.5" fill="currentColor" font-weight="600">A</text>
  <text x="450" y="76" font-size="12" fill="currentColor" text-anchor="end">.5</text>
  <text x="476" y="76" font-size="12" font-family="ui-monospace, monospace" fill="#e2903a" font-weight="600">1</text>
  <text x="574" y="76" font-size="12" fill="currentColor" text-anchor="end">1</text>

  <text x="356" y="100" font-size="12.5" fill="currentColor" font-weight="600">B</text>
  <text x="450" y="100" font-size="12" fill="currentColor" text-anchor="end">.25</text>
  <text x="476" y="100" font-size="12" font-family="ui-monospace, monospace" fill="currentColor">01</text>
  <text x="574" y="100" font-size="12" fill="currentColor" text-anchor="end">2</text>

  <text x="356" y="124" font-size="12.5" fill="currentColor" font-weight="600">C</text>
  <text x="450" y="124" font-size="12" fill="currentColor" text-anchor="end">.15</text>
  <text x="476" y="124" font-size="12" font-family="ui-monospace, monospace" fill="#e2903a" font-weight="600">001</text>
  <text x="574" y="124" font-size="12" fill="currentColor" text-anchor="end">3</text>

  <text x="356" y="148" font-size="12.5" fill="currentColor" font-weight="600">D</text>
  <text x="450" y="148" font-size="12" fill="currentColor" text-anchor="end">.1</text>
  <text x="476" y="148" font-size="12" font-family="ui-monospace, monospace" fill="currentColor">000</text>
  <text x="574" y="148" font-size="12" fill="currentColor" text-anchor="end">3</text>

  <line x1="344" y1="160" x2="582" y2="160" stroke="currentColor" stroke-width="1" opacity="0.3"/>
  <text x="344" y="180" font-size="11.5" fill="currentColor">L = .5&#183;1 + .25&#183;2 + .15&#183;3 + .1&#183;3 = <tspan fill="#5aa46a" font-weight="600">1.75</tspan></text>

  <!-- the general tally -->
  <line x1="34" y1="204" x2="582" y2="204" stroke="currentColor" stroke-width="1" opacity="0.25"/>
  <text x="310" y="226" font-size="12" fill="currentColor" text-anchor="middle">change in L = (p(A) &#8722; p(C)) &#183; (len(C) &#8722; len(A)) = (.5 &#8722; .15) &#183; (1 &#8722; 3) = &#8722;0.70 bits</text>
  <text x="310" y="244" font-size="11.5" fill="currentColor" opacity="0.55" text-anchor="middle">the tree never changes shape, so the swapped code is still prefix-free</text>
</svg>

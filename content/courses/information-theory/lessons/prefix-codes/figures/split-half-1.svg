<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300" font-family="system-ui, sans-serif">
  <line x1="310" y1="20" x2="310" y2="210" stroke="currentColor" stroke-width="1" stroke-dasharray="3 3" opacity="0.25"/>

  <!-- left panel: bad first question -->
  <text x="40" y="30" font-size="12.5" fill="currentColor" font-weight="600">bad first question</text>

  <rect x="100" y="44" width="104" height="26" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="152" y="61" font-size="12.5" fill="currentColor" text-anchor="middle">Is it D?</text>

  <line x1="128" y1="70" x2="85" y2="106" stroke="currentColor" stroke-width="1.4" opacity="0.6"/>
  <text x="95" y="90" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">yes</text>
  <line x1="176" y1="70" x2="219" y2="106" stroke="currentColor" stroke-width="1.4" opacity="0.6"/>
  <text x="212" y="90" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">no</text>

  <rect x="55" y="108" width="60" height="30" rx="5" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <text x="85" y="127" font-size="12" fill="currentColor" text-anchor="middle">D · .1</text>
  <rect x="169" y="108" width="100" height="30" rx="5" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <text x="219" y="127" font-size="12" fill="currentColor" text-anchor="middle">A, B, C · .9</text>

  <!-- probability-mass bar -->
  <text x="52" y="160" font-size="11" fill="#e2903a" text-anchor="middle">.1</text>
  <text x="172" y="160" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">.9</text>
  <rect x="40" y="166" width="24" height="14" rx="3" fill="#e2903a"/>
  <rect x="64" y="166" width="216" height="14" rx="3" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.8"/>
  <text x="160" y="200" font-size="11.5" fill="currentColor" opacity="0.55" text-anchor="middle">mass split .10 / .90</text>
</svg>

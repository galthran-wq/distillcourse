<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 348" font-family="system-ui, sans-serif">
  <text x="24" y="24" font-size="12" fill="currentColor" opacity="0.55">one draw from&#160;&#160;&#160;A: .5&#160;&#160;&#160;B: .25&#160;&#160;&#160;C: .15&#160;&#160;&#160;D: .1</text>
  <text x="596" y="24" font-size="12" fill="currentColor" text-anchor="end">answer yes = <tspan fill="#e2903a" font-weight="600">1</tspan>, no = <tspan fill="#e2903a" font-weight="600">0</tspan></text>

  <!-- question 1 -->
  <rect x="120" y="40" width="96" height="26" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="168" y="57" font-size="12.5" fill="currentColor" text-anchor="middle">Is it A?</text>

  <line x1="140" y1="66" x2="74" y2="110" stroke="currentColor" stroke-width="1.4" opacity="0.6"/>
  <text x="92" y="92" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">yes</text>
  <text x="92" y="105" font-size="11.5" font-weight="600" fill="#e2903a" text-anchor="middle">1</text>
  <line x1="196" y1="66" x2="276" y2="114" stroke="currentColor" stroke-width="1.4" opacity="0.6"/>
  <text x="247" y="92" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">no</text>
  <text x="247" y="105" font-size="11.5" font-weight="600" fill="#e2903a" text-anchor="middle">0</text>

  <!-- leaf A -->
  <rect x="44" y="113" width="52" height="34" rx="5" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <text x="70" y="129" font-size="13" font-weight="600" fill="currentColor" text-anchor="middle">A</text>
  <text x="70" y="142" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">.5</text>
  <text x="70" y="162" font-size="12" font-family="ui-monospace, monospace" text-anchor="middle"><tspan fill="#e2903a" font-weight="600">1</tspan><tspan fill="currentColor" opacity="0.55" font-size="10.5">&#160;&#183;&#160;depth 1</tspan></text>

  <!-- question 2 -->
  <rect x="232" y="117" width="96" height="26" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="280" y="134" font-size="12.5" fill="currentColor" text-anchor="middle">Is it B?</text>

  <line x1="252" y1="143" x2="186" y2="187" stroke="currentColor" stroke-width="1.4" opacity="0.6"/>
  <text x="206" y="168" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">yes</text>
  <text x="206" y="181" font-size="11.5" font-weight="600" fill="#e2903a" text-anchor="middle">1</text>
  <line x1="308" y1="143" x2="388" y2="191" stroke="currentColor" stroke-width="1.4" opacity="0.6"/>
  <text x="359" y="168" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">no</text>
  <text x="359" y="181" font-size="11.5" font-weight="600" fill="#e2903a" text-anchor="middle">0</text>

  <!-- leaf B -->
  <rect x="156" y="190" width="52" height="34" rx="5" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <text x="182" y="206" font-size="13" font-weight="600" fill="currentColor" text-anchor="middle">B</text>
  <text x="182" y="219" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">.25</text>
  <text x="182" y="239" font-size="12" font-family="ui-monospace, monospace" text-anchor="middle"><tspan fill="#e2903a" font-weight="600">01</tspan><tspan fill="currentColor" opacity="0.55" font-size="10.5">&#160;&#183;&#160;depth 2</tspan></text>

  <!-- question 3 -->
  <rect x="344" y="194" width="96" height="26" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="392" y="211" font-size="12.5" fill="currentColor" text-anchor="middle">Is it C?</text>

  <line x1="364" y1="220" x2="298" y2="264" stroke="currentColor" stroke-width="1.4" opacity="0.6"/>
  <text x="318" y="245" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">yes</text>
  <text x="318" y="258" font-size="11.5" font-weight="600" fill="#e2903a" text-anchor="middle">1</text>
  <line x1="420" y1="220" x2="462" y2="264" stroke="currentColor" stroke-width="1.4" opacity="0.6"/>
  <text x="452" y="245" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">no</text>
  <text x="452" y="258" font-size="11.5" font-weight="600" fill="#e2903a" text-anchor="middle">0</text>

  <!-- leaf C -->
  <rect x="268" y="267" width="52" height="34" rx="5" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <text x="294" y="283" font-size="13" font-weight="600" fill="currentColor" text-anchor="middle">C</text>
  <text x="294" y="296" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">.15</text>
  <text x="294" y="316" font-size="12" font-family="ui-monospace, monospace" text-anchor="middle"><tspan fill="#e2903a" font-weight="600">001</tspan><tspan fill="currentColor" opacity="0.55" font-size="10.5">&#160;&#183;&#160;depth 3</tspan></text>

  <!-- leaf D -->
  <rect x="440" y="267" width="52" height="34" rx="5" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <text x="466" y="283" font-size="13" font-weight="600" fill="currentColor" text-anchor="middle">D</text>
  <text x="466" y="296" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">.1</text>
  <text x="466" y="316" font-size="12" font-family="ui-monospace, monospace" text-anchor="middle"><tspan fill="#e2903a" font-weight="600">000</tspan><tspan fill="currentColor" opacity="0.55" font-size="10.5">&#160;&#183;&#160;depth 3</tspan></text>

  <!-- expected question count -->
  <text x="310" y="342" font-size="12.5" fill="currentColor" text-anchor="middle">expected questions = .5·1 + .25·2 + .15·3 + .1·3 = <tspan fill="#e2903a" font-weight="600">1.75</tspan></text>
</svg>

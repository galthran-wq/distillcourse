<svg viewBox="0 0 520 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .axis  { stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.2; fill: none; }
    .rd    { stroke: #e2903a; stroke-width: 2.5; fill: none; }
    .hd    { stroke: #4c8dd6; stroke-width: 2; fill: none; }
    .guide { stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
    .sub   { stroke: #4c8dd6; stroke-width: 1.5; fill: none; }
  </style>

  <!-- axes -->
  <path class="axis" d="M60 260 L490 260"/>
  <path class="axis" d="M60 260 L60 30"/>
  <text class="muted" x="275" y="294" text-anchor="middle">distortion D</text>
  <text class="muted" x="34" y="24">R (bits)</text>
  <!-- x ticks -->
  <path class="axis" d="M60.0 260 L60.0 265"/>
  <text class="muted" x="60.0" y="279" text-anchor="middle">0</text>
  <path class="axis" d="M144.0 260 L144.0 265"/>
  <text class="muted" x="144.0" y="279" text-anchor="middle">0.1</text>
  <path class="axis" d="M228.0 260 L228.0 265"/>
  <text class="muted" x="228.0" y="279" text-anchor="middle">0.2</text>
  <path class="axis" d="M312.0 260 L312.0 265"/>
  <text class="muted" x="312.0" y="279" text-anchor="middle">0.3</text>
  <path class="axis" d="M396.0 260 L396.0 265"/>
  <text class="muted" x="396.0" y="279" text-anchor="middle">0.4</text>
  <path class="axis" d="M480.0 260 L480.0 265"/>
  <text class="muted" x="480.0" y="279" text-anchor="middle">0.5</text>
  <!-- y ticks -->
  <path class="axis" d="M55 260.0 L60 260.0"/>
  <text class="muted" x="50" y="264.0" text-anchor="end">0</text>
  <path class="axis" d="M55 145.0 L60 145.0"/>
  <text class="muted" x="50" y="149.0" text-anchor="end">0.5</text>
  <path class="axis" d="M55 30.0 L60 30.0"/>
  <text class="muted" x="50" y="34.0" text-anchor="end">1</text>

  <!-- lossless corner: dashed guide at H(p), amber dot at (0, H(p)) -->
  <path class="guide" d="M60 57.3 L490 57.3"/>
  <circle cx="60" cy="57.3" r="4" fill="#e2903a"/>
  <text x="72" y="49.3" class="label" font-weight="600">R(0) = H(0.3) &#8776; 0.881 bits</text>
  <text x="72" y="73.3" class="muted">the lossless corner</text>
</svg>

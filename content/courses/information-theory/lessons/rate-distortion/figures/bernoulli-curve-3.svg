<svg viewBox="0 0 520 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .axis  { stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.2; fill: none; }
    .rd    { stroke: #e2903a; stroke-width: 2.5; fill: none; }
    .hd    { stroke: #4c8dd6; stroke-width: 2; fill: none; }
    .guide { stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
    .sub   { stroke: #4c8dd6; stroke-width: 1.5; fill: none; }
  </style>

  <!-- axes -->
  <path class="axis" d="M60 260 L490 260"/>
  <path class="axis" d="M60 260 L60 30"/>
  <text class="muted" x="275" y="294" text-anchor="middle">distortion D</text>
  <text class="muted" x="34" y="24">R (bits)</text>
  <!-- x ticks -->
  <path class="axis" d="M60.0 260 L60.0 265"/>
  <text class="muted" x="60.0" y="279" text-anchor="middle">0</text>
  <path class="axis" d="M144.0 260 L144.0 265"/>
  <text class="muted" x="144.0" y="279" text-anchor="middle">0.1</text>
  <path class="axis" d="M228.0 260 L228.0 265"/>
  <text class="muted" x="228.0" y="279" text-anchor="middle">0.2</text>
  <path class="axis" d="M312.0 260 L312.0 265"/>
  <text class="muted" x="312.0" y="279" text-anchor="middle">0.3</text>
  <path class="axis" d="M396.0 260 L396.0 265"/>
  <text class="muted" x="396.0" y="279" text-anchor="middle">0.4</text>
  <path class="axis" d="M480.0 260 L480.0 265"/>
  <text class="muted" x="480.0" y="279" text-anchor="middle">0.5</text>
  <!-- y ticks -->
  <path class="axis" d="M55 260.0 L60 260.0"/>
  <text class="muted" x="50" y="264.0" text-anchor="end">0</text>
  <path class="axis" d="M55 145.0 L60 145.0"/>
  <text class="muted" x="50" y="149.0" text-anchor="end">0.5</text>
  <path class="axis" d="M55 30.0 L60 30.0"/>
  <text class="muted" x="50" y="34.0" text-anchor="end">1</text>

  <!-- lossless corner: dashed guide at H(p), amber dot at (0, H(p)) -->
  <path class="guide" d="M60 57.3 L490 57.3"/>
  <circle cx="60" cy="57.3" r="4" fill="#e2903a"/>
  <text x="72" y="49.3" class="label" font-weight="600">R(0) = H(0.3) &#8776; 0.881 bits</text>
  <text x="72" y="73.3" class="muted">the lossless corner</text>

  <!-- H(D): the entropy of the tolerated errors -->
  <path class="hd" d="M60.0 260.0 L70.5 237.7 L81.0 221.2 L91.5 206.9 L102.0 194.1 L112.5 182.4 L123.0 171.6 L133.5 161.5 L144.0 152.1 L154.5 143.3 L165.0 135.0 L175.5 127.1 L186.0 119.7 L196.5 112.7 L207.0 106.1 L217.5 99.9 L228.0 94.0 L238.5 88.4 L249.0 83.1 L259.5 78.1 L270.0 73.4 L280.5 69.0 L291.0 64.8 L301.5 60.9 L312.0 57.3 L322.5 53.9 L333.0 50.8 L343.5 47.8 L354.0 45.2 L364.5 42.7 L375.0 40.5 L385.5 38.5 L396.0 36.7 L406.5 35.1 L417.0 33.7 L427.5 32.6 L438.0 31.7 L448.5 30.9 L459.0 30.4 L469.5 30.1 L480.0 30.0"/>
  <text x="380" y="120" fill="#4c8dd6" font-weight="600">H(D)</text>
  <text x="285" y="107" fill="#4c8dd6" font-size="12">bits the tolerated errors carry</text>
  <!-- subtraction arrows at D = 0.1 and D = 0.2 -->
  <path class="sub" d="M144.0 57.3 L144.0 157.2"/>
  <path class="sub" d="M140.0 157.2 L144.0 165.2 L148.0 157.2" />
  <path class="sub" d="M228.0 57.3 L228.0 215.3"/>
  <path class="sub" d="M224.0 215.3 L228.0 223.3 L232.0 215.3" />
  <text x="232.2" y="140.3" fill="#4c8dd6" font-size="12">subtract H(D)</text>
  <text x="232.2" y="157" fill="#4c8dd6" font-size="12">H(0.1) = 0.469, H(0.2) = 0.722</text>

  <!-- R(D) = H(p) - H(D), flat at zero past D = p -->
  <path class="rd" d="M60.0 57.3 L70.5 79.6 L81.0 96.1 L91.5 110.4 L102.0 123.2 L112.5 134.9 L123.0 145.7 L133.5 155.8 L144.0 165.2 L154.5 174.0 L165.0 182.3 L175.5 190.2 L186.0 197.6 L196.5 204.6 L207.0 211.2 L217.5 217.4 L228.0 223.3 L238.5 228.9 L249.0 234.2 L259.5 239.2 L270.0 243.9 L280.5 248.3 L291.0 252.5 L301.5 256.4 L312.0 260.0 L480.0 260.0"/>
  <path class="guide" d="M60 165.2 L245 165.2"/>
  <circle cx="144.0" cy="165.2" r="4" fill="#e2903a"/>
  <text x="250" y="170" fill="#e2903a" font-size="12">R(0.1) = 0.881 &#8722; 0.469 = 0.412</text>
  <circle cx="312.0" cy="260" r="4" fill="#e2903a"/>
  <text x="75" y="244" fill="#e2903a" font-weight="600">R(D) = H(p) &#8722; H(D)</text>
  <text x="345" y="230" text-anchor="middle" fill="#e2903a" font-size="12">R = 0 at D = p = 0.3</text>
  <text x="345" y="246" text-anchor="middle" class="muted">guess the majority symbol: free</text>
</svg>

<svg viewBox="0 0 560 250" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- reconstruction node -->
  <rect x="30" y="92" width="132" height="44" rx="5" fill="none" stroke="#e2903a" stroke-width="1.6"/>
  <text x="96" y="112" text-anchor="middle" fill="#e2903a" font-size="14">X̂ ~ Ber(q)</text>
  <text x="96" y="129" text-anchor="middle" fill="#e2903a" font-size="12" opacity="0.85">q = (p − D)/(1 − 2D)</text>

  <!-- adder -->
  <circle cx="290" cy="114" r="20" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="290" y="120" text-anchor="middle" fill="currentColor" font-size="17">⊕</text>

  <!-- noise -->
  <rect x="228" y="24" width="124" height="40" rx="5" fill="none" stroke="#4c8dd6" stroke-width="1.6"/>
  <text x="290" y="49" text-anchor="middle" fill="#4c8dd6" font-size="14">Z ~ Ber(D)</text>
  <line x1="290" y1="64" x2="290" y2="92" stroke="#4c8dd6" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="300" y="82" fill="#4c8dd6" font-size="12" opacity="0.85">independent of X̂</text>

  <!-- source node -->
  <rect x="404" y="92" width="126" height="44" rx="5" fill="none" stroke="currentColor" stroke-width="1.6"/>
  <text x="467" y="112" text-anchor="middle" fill="currentColor" font-size="14">X ~ Ber(p)</text>
  <text x="467" y="129" text-anchor="middle" fill="currentColor" font-size="12" opacity="0.55">the source</text>

  <line x1="162" y1="114" x2="266" y2="114" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="310" y1="114" x2="400" y2="114" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>

  <text x="290" y="172" text-anchor="middle" fill="currentColor" font-size="12" opacity="0.55">drawn backwards: the source is the reconstruction plus an independent flip</text>
  <line x1="60" y1="188" x2="500" y2="188" stroke="currentColor" stroke-width="1" opacity="0.3"/>
  <text x="290" y="212" text-anchor="middle" fill="currentColor" font-size="14">P(X ≠ X̂) = P(Z = 1) = D</text>
  <text x="290" y="236" text-anchor="middle" fill="#e2903a" font-size="15">I(X; X̂) = H(p) − H(D)</text>
</svg>

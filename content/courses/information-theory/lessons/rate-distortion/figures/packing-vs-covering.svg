<svg viewBox="0 0 620 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <text x="160" y="22" text-anchor="middle" fill="currentColor" font-size="13">channel coding: pack</text>
  <text x="470" y="22" text-anchor="middle" fill="currentColor" font-size="13">lossy coding: cover</text>

  <circle cx="160" cy="128" r="86" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.6"/>
  <circle cx="160.0" cy="128.0" r="25" fill="#4c8dd6" fill-opacity="0.14" stroke="#4c8dd6" stroke-width="1.4"/>
  <circle cx="211.3" cy="128.0" r="25" fill="#4c8dd6" fill-opacity="0.14" stroke="#4c8dd6" stroke-width="1.4"/>
  <circle cx="108.8" cy="128.0" r="25" fill="#4c8dd6" fill-opacity="0.14" stroke="#4c8dd6" stroke-width="1.4"/>
  <circle cx="185.6" cy="172.6" r="25" fill="#4c8dd6" fill-opacity="0.14" stroke="#4c8dd6" stroke-width="1.4"/>
  <circle cx="134.4" cy="172.6" r="25" fill="#4c8dd6" fill-opacity="0.14" stroke="#4c8dd6" stroke-width="1.4"/>
  <circle cx="185.6" cy="83.4" r="25" fill="#4c8dd6" fill-opacity="0.14" stroke="#4c8dd6" stroke-width="1.4"/>
  <circle cx="134.4" cy="83.4" r="25" fill="#4c8dd6" fill-opacity="0.14" stroke="#4c8dd6" stroke-width="1.4"/>
  <circle cx="160.0" cy="128.0" r="2.5" fill="#4c8dd6"/>
  <circle cx="211.3" cy="128.0" r="2.5" fill="#4c8dd6"/>
  <circle cx="108.8" cy="128.0" r="2.5" fill="#4c8dd6"/>
  <circle cx="185.6" cy="172.6" r="2.5" fill="#4c8dd6"/>
  <circle cx="134.4" cy="172.6" r="2.5" fill="#4c8dd6"/>
  <circle cx="185.6" cy="83.4" r="2.5" fill="#4c8dd6"/>
  <circle cx="134.4" cy="83.4" r="2.5" fill="#4c8dd6"/>
  <text x="160" y="250" text-anchor="middle" fill="currentColor" opacity="0.55">one noise ball per codeword</text>
  <text x="160" y="268" text-anchor="middle" fill="currentColor" opacity="0.55">disjoint: no two are confusable</text>
  <text x="160" y="288" text-anchor="middle" fill="#4c8dd6">as many as fit: maximise I(X;Y)</text>

  <circle cx="470" cy="128" r="86" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.6" stroke-dasharray="4 3"/>
  <circle cx="470.0" cy="128.0" r="42" fill="#e2903a" fill-opacity="0.10" stroke="#e2903a" stroke-width="1.4"/>
  <circle cx="524.6" cy="128.0" r="42" fill="#e2903a" fill-opacity="0.10" stroke="#e2903a" stroke-width="1.4"/>
  <circle cx="415.4" cy="128.0" r="42" fill="#e2903a" fill-opacity="0.10" stroke="#e2903a" stroke-width="1.4"/>
  <circle cx="497.3" cy="175.5" r="42" fill="#e2903a" fill-opacity="0.10" stroke="#e2903a" stroke-width="1.4"/>
  <circle cx="442.7" cy="175.5" r="42" fill="#e2903a" fill-opacity="0.10" stroke="#e2903a" stroke-width="1.4"/>
  <circle cx="497.3" cy="80.5" r="42" fill="#e2903a" fill-opacity="0.10" stroke="#e2903a" stroke-width="1.4"/>

  <circle cx="524.6" cy="128.0" r="2.5" fill="#e2903a"/>
  <circle cx="415.4" cy="128.0" r="2.5" fill="#e2903a"/>
  <circle cx="497.3" cy="175.5" r="2.5" fill="#e2903a"/>
  <circle cx="442.7" cy="175.5" r="2.5" fill="#e2903a"/>
  <circle cx="497.3" cy="80.5" r="2.5" fill="#e2903a"/>
  <circle cx="442.7" cy="80.5" r="2.5" fill="#e2903a"/>
  <text x="470" y="250" text-anchor="middle" fill="currentColor" opacity="0.55">one distortion ball per codeword</text>
  <text x="470" y="268" text-anchor="middle" fill="currentColor" opacity="0.55">overlapping: every block has one near</text>
  <text x="470" y="288" text-anchor="middle" fill="#e2903a">as few as suffice: minimise I(X;X̂)</text>

  <text x="310" y="318" text-anchor="middle" fill="currentColor" font-size="13">both counts are 2<tspan dy="-5" font-size="10">nI</tspan><tspan dy="5">: the same exponent, optimised in opposite directions</tspan></text>
</svg>

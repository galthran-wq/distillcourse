<svg viewBox="0 0 600 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="60" y="22" font-size="13" fill="currentColor">block Huffman codes on the 90/10 coin</text>
  <text x="545" y="22" font-size="13" font-weight="bold" fill="#e2903a" text-anchor="end">block size n = 4</text>

  <!-- grid -->
  <g stroke="currentColor" opacity="0.12">
    <line x1="55" y1="258.2" x2="545" y2="258.2"/>
    <line x1="55" y1="203.6" x2="545" y2="203.6"/>
    <line x1="55" y1="149.1" x2="545" y2="149.1"/>
    <line x1="55" y1="94.5" x2="545" y2="94.5"/>
    <line x1="55" y1="40" x2="545" y2="40"/>
  </g>

  <!-- axes -->
  <line x1="55" y1="280" x2="545" y2="280" stroke="currentColor"/>
  <line x1="55" y1="280" x2="55" y2="34" stroke="currentColor"/>
  <g font-size="11" fill="currentColor" text-anchor="end" opacity="0.55">
    <text x="48" y="262">0.5</text>
    <text x="48" y="207.6">0.75</text>
    <text x="48" y="153.1">1.0</text>
    <text x="48" y="98.5">1.25</text>
    <text x="48" y="44">1.5</text>
  </g>
  <g stroke="currentColor">
    <line x1="70" y1="280" x2="70" y2="285"/>
    <line x1="134" y1="280" x2="134" y2="285"/>
    <line x1="198" y1="280" x2="198" y2="285"/>
    <line x1="262" y1="280" x2="262" y2="285"/>
    <line x1="326" y1="280" x2="326" y2="285"/>
    <line x1="390" y1="280" x2="390" y2="285"/>
    <line x1="454" y1="280" x2="454" y2="285"/>
    <line x1="518" y1="280" x2="518" y2="285"/>
  </g>
  <g font-size="11" fill="currentColor" text-anchor="middle" opacity="0.55">
    <text x="70" y="298">1</text>
    <text x="134" y="298">2</text>
    <text x="198" y="298">3</text>
    <text x="262" y="298">4</text>
    <text x="326" y="298">5</text>
    <text x="390" y="298">6</text>
    <text x="454" y="298">7</text>
    <text x="518" y="298">8</text>
  </g>
  <text x="300" y="316" font-size="12" fill="currentColor" text-anchor="middle">block size n</text>
  <text x="16" y="160" font-size="12" fill="currentColor" text-anchor="middle" transform="rotate(-90 16 160)">bits per symbol</text>

  <!-- guarantee curve H + 1/n -->
  <polyline points="70,46.8 134,155.9 198,192.2 262,210.4 326,221.3 390,228.6 454,233.8 518,237.7"
    fill="none" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5"/>
  <text x="470" y="222" font-size="11" fill="currentColor" opacity="0.55">H + 1/n</text>

  <!-- entropy line -->
  <line x1="55" y1="264.9" x2="545" y2="264.9" stroke="#4c8dd6" stroke-dasharray="4 3"/>
  <text x="60" y="259" font-size="11" fill="#4c8dd6">H &#8776; 0.469</text>

  <!-- data points -->
  <polyline points="70,149.1 134,226.5 262,259.8" fill="none" stroke="#e2903a" opacity="0.6"/>
  <circle cx="70" cy="149.1" r="4.5" fill="#e2903a"/>
  <text x="84" y="146.1" font-size="11" fill="#e2903a">1.000</text>
  <circle cx="134" cy="226.5" r="4.5" fill="#e2903a"/>
  <text x="148" y="223.5" font-size="11" fill="#e2903a">0.645</text>
  <circle cx="262" cy="259.8" r="4.5" fill="#e2903a"/>
  <text x="262" y="247.8" font-size="11" fill="#e2903a" text-anchor="middle">0.493</text>
  <text x="262" y="277" font-size="10" fill="#e2903a" text-anchor="middle">gap 0.024</text>
</svg>

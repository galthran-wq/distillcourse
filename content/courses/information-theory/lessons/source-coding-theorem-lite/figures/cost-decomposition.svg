<svg viewBox="0 0 600 268" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <style>
    .lbl { fill: currentColor; font-size: 12px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .floor { fill: #4c8dd6; }
    .miss { fill: #e2903a; }
  </style>

  <!-- the identity, colour-bound to the segments below -->
  <text class="lbl" x="60" y="22">L =</text>
  <text x="86" y="22" font-size="12" fill="#4c8dd6">H(p)</text>
  <text class="lbl" x="123" y="22">+</text>
  <text x="137" y="22" font-size="12" fill="#e2903a">D(p‖q)</text>
  <text class="lbl" x="191" y="22">+ slack</text>
  <text class="muted" x="250" y="22">both codes are complete, so slack = 0</text>

  <!-- top bar: balanced code -->
  <text class="lbl" x="60" y="58">balanced code, lengths (2, 2, 2, 2)</text>
  <rect class="floor" x="60" y="66" width="415" height="30" rx="3"/>
  <rect class="miss" x="475" y="66" width="61" height="30" rx="3"/>
  <text x="70" y="86" font-size="12" fill="#ffffff">H(p) = 1.743</text>
  <text x="505" y="112" font-size="11" fill="#e2903a" text-anchor="middle">0.257</text>
  <text class="muted" x="590" y="130" text-anchor="end">extra bits from betting wrong</text>
  <text class="lbl" x="542" y="86">L = 2.00</text>

  <!-- bottom bar: matched code -->
  <text class="lbl" x="60" y="152">matched code, lengths (1, 2, 3, 3)</text>
  <rect class="floor" x="60" y="160" width="415" height="30" rx="3"/>
  <rect class="miss" x="475" y="160" width="2" height="30"/>
  <text x="70" y="180" font-size="12" fill="#ffffff">H(p) = 1.743</text>
  <line x1="477" y1="190" x2="497" y2="208" stroke="#e2903a"/>
  <text x="501" y="212" font-size="11" fill="#e2903a">D = 0.007</text>
  <text class="lbl" x="542" y="180">L = 1.75</text>

  <!-- shared axis -->
  <line x1="60" y1="230" x2="536" y2="230" stroke="currentColor" opacity="0.4"/>
  <g stroke="currentColor" opacity="0.4">
    <line x1="60" y1="230" x2="60" y2="235"/>
    <line x1="179" y1="230" x2="179" y2="235"/>
    <line x1="298" y1="230" x2="298" y2="235"/>
    <line x1="417" y1="230" x2="417" y2="235"/>
    <line x1="536" y1="230" x2="536" y2="235"/>
  </g>
  <g class="muted" text-anchor="middle">
    <text x="60" y="248">0</text>
    <text x="179" y="248">0.5</text>
    <text x="298" y="248">1.0</text>
    <text x="417" y="248">1.5</text>
    <text x="536" y="248">2.0</text>
  </g>
  <text class="muted" x="298" y="264" text-anchor="middle">bits per symbol, source p = (.5, .25, .15, .1)</text>
</svg>

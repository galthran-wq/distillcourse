<svg viewBox="0 0 600 250" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <style>
    .lbl { fill: currentColor; font-size: 12px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .amb { fill: #e2903a; font-size: 11px; }
  </style>

  <text class="lbl" x="45" y="22">achievable bits per symbol, 90/10 coin</text>

  <!-- forbidden region and the wall -->
  <rect x="57" y="96" width="56" height="84" fill="currentColor" opacity="0.09"/>
  <text class="muted" x="85" y="138" text-anchor="middle" transform="rotate(-90 85 138)">unreachable</text>
  <line x1="113.1" y1="70" x2="113.1" y2="192" stroke="#4c8dd6" stroke-width="4"/>
  <text x="122" y="62" font-size="12" fill="#4c8dd6">H(X) = 0.469 — no lossless code goes left of this line</text>

  <!-- convergence arrow -->
  <text class="amb" x="380" y="102" text-anchor="middle">growing the block size moves the cost left</text>
  <line x1="515" y1="118" x2="128" y2="118" stroke="#e2903a"/>
  <path d="M134 114 L124 118 L134 122 Z" fill="#e2903a"/>

  <!-- crowded points, annotated together -->
  <line x1="131.5" y1="174" x2="180" y2="150" stroke="#e2903a" opacity="0.6"/>
  <line x1="113.8" y1="174" x2="180" y2="146" stroke="#e2903a" opacity="0.6"/>
  <text class="amb" x="186" y="150">n = 4: 0.493 · n = 6: 0.470</text>

  <!-- axis -->
  <line x1="57" y1="180" x2="565" y2="180" stroke="currentColor" opacity="0.6"/>
  <g stroke="currentColor" opacity="0.5">
    <line x1="136.9" y1="180" x2="136.9" y2="186"/>
    <line x1="213.8" y1="180" x2="213.8" y2="186"/>
    <line x1="290.8" y1="180" x2="290.8" y2="186"/>
    <line x1="367.7" y1="180" x2="367.7" y2="186"/>
    <line x1="444.6" y1="180" x2="444.6" y2="186"/>
    <line x1="521.5" y1="180" x2="521.5" y2="186"/>
  </g>
  <g class="muted" text-anchor="middle">
    <text x="136.9" y="202">0.5</text>
    <text x="213.8" y="202">0.6</text>
    <text x="290.8" y="202">0.7</text>
    <text x="367.7" y="202">0.8</text>
    <text x="444.6" y="202">0.9</text>
    <text x="521.5" y="202">1.0</text>
  </g>
  <text class="muted" x="311" y="224" text-anchor="middle">bits per symbol</text>

  <!-- the code costs -->
  <circle cx="521.5" cy="180" r="5" fill="#e2903a"/>
  <text class="amb" x="521.5" y="168" text-anchor="middle">n = 1: 1.000</text>
  <circle cx="248.5" cy="180" r="5" fill="#e2903a"/>
  <text class="amb" x="248.5" y="168" text-anchor="middle">n = 2: 0.645</text>
  <circle cx="131.5" cy="180" r="5" fill="#e2903a"/>
  <circle cx="113.8" cy="180" r="5" fill="#e2903a"/>

  <text class="muted" x="565" y="240" text-anchor="end">every symbol code lands in [H, H+1); block codes close the remaining gap</text>
</svg>

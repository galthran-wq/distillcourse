<svg viewBox="0 0 600 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <style>
    .lbl { fill: currentColor; font-size: 12px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .inbar { fill: #ffffff; font-size: 11px; }
    .surp { fill: #4c8dd6; }
    .gap { fill: #e2903a; opacity: 0.35; }
    .ceil { stroke: #e2903a; }
    .ceiltxt { fill: #e2903a; font-size: 11px; }
  </style>

  <!-- legend -->
  <rect class="surp" x="70" y="22" width="12" height="12" rx="2"/>
  <text class="muted" x="88" y="32">surprisal −log₂ p(x)</text>
  <rect class="gap" x="240" y="22" width="12" height="12"/>
  <text class="muted" x="258" y="32">rounding up to the integer length ⌈−log₂ p(x)⌉</text>

  <!-- y axis -->
  <line x1="62" y1="250" x2="62" y2="46" stroke="currentColor" opacity="0.4"/>
  <g stroke="currentColor" opacity="0.4">
    <line x1="57" y1="250" x2="62" y2="250"/>
    <line x1="57" y1="200" x2="62" y2="200"/>
    <line x1="57" y1="150" x2="62" y2="150"/>
    <line x1="57" y1="100" x2="62" y2="100"/>
    <line x1="57" y1="50" x2="62" y2="50"/>
  </g>
  <g class="muted" text-anchor="end">
    <text x="52" y="254">0</text>
    <text x="52" y="204">1</text>
    <text x="52" y="154">2</text>
    <text x="52" y="104">3</text>
    <text x="52" y="54">4</text>
  </g>
  <text class="muted" x="22" y="150" text-anchor="middle" transform="rotate(-90 22 150)">bits</text>
  <line x1="62" y1="250" x2="545" y2="250" stroke="currentColor" opacity="0.4"/>

  <!-- A: surprisal 1, ceiling 1 -->
  <rect class="surp" x="113" y="200" width="34" height="50" rx="2"/>
  <line class="ceil" x1="103" y1="200" x2="157" y2="200"/>
  <text class="muted" x="130" y="194" text-anchor="middle">1.000</text>
  <text class="lbl" x="130" y="270" text-anchor="middle">A, p = .5</text>
  <text class="ceiltxt" x="130" y="288" text-anchor="middle">ℓ = 1, no gap</text>

  <!-- B: surprisal 2, ceiling 2 -->
  <rect class="surp" x="228" y="150" width="34" height="100" rx="2"/>
  <line class="ceil" x1="218" y1="150" x2="272" y2="150"/>
  <text class="muted" x="245" y="144" text-anchor="middle">2.000</text>
  <text class="lbl" x="245" y="270" text-anchor="middle">B, p = .25</text>
  <text class="ceiltxt" x="245" y="288" text-anchor="middle">ℓ = 2, no gap</text>

  <!-- C: surprisal 2.737, ceiling 3 -->
  <rect class="gap" x="350" y="100" width="54" height="13.2"/>
  <rect class="surp" x="360" y="113.2" width="34" height="136.8" rx="2"/>
  <line class="ceil" x1="350" y1="100" x2="404" y2="100"/>
  <text class="inbar" x="377" y="132" text-anchor="middle">2.737</text>
  <text class="lbl" x="377" y="270" text-anchor="middle">C, p = .15</text>
  <text class="ceiltxt" x="377" y="288" text-anchor="middle">ℓ = 3, gap 0.263</text>

  <!-- D: surprisal 3.322, ceiling 4 -->
  <rect class="gap" x="465" y="50" width="54" height="33.9"/>
  <rect class="surp" x="475" y="83.9" width="34" height="166.1" rx="2"/>
  <line class="ceil" x1="465" y1="50" x2="519" y2="50"/>
  <text class="inbar" x="492" y="102" text-anchor="middle">3.322</text>
  <text class="lbl" x="492" y="270" text-anchor="middle">D, p = .1</text>
  <text class="ceiltxt" x="492" y="288" text-anchor="middle">ℓ = 4, gap 0.678</text>

  <!-- tally -->
  <text class="lbl" x="300" y="316" text-anchor="middle">expected rounding cost .15(0.263) + .1(0.678) = 0.107 bits, so L = 1.85 &lt; H + 1</text>
</svg>

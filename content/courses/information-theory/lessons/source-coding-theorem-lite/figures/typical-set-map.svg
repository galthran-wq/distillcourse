<svg viewBox="0 0 600 340" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <style>
    .lbl { fill: currentColor; font-size: 12px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .amb { fill: #e2903a; font-size: 11px; }
  </style>

  <text class="lbl" x="40" y="26">all 2¹⁰⁰ sequences of 100 flips of the 90/10 coin</text>
  <rect x="40" y="38" width="520" height="240" rx="8" fill="none" stroke="currentColor" opacity="0.5"/>
  <text class="muted" x="56" y="58">atypical: 24% of the probability at n = 100, and falling</text>

  <!-- the typical set -->
  <ellipse cx="300" cy="170" rx="88" ry="42" fill="#e2903a" fill-opacity="0.25" stroke="#e2903a"/>
  <text x="300" y="166" font-size="12" fill="#e2903a" text-anchor="middle" font-weight="600">typical set (ε = 0.1)</text>
  <text class="amb" x="300" y="184" text-anchor="middle">7 to 13 tails: ≈ 2⁵³ sequences</text>

  <!-- annotation on the typical set -->
  <line x1="383" y1="145" x2="410" y2="126" stroke="#e2903a" opacity="0.7"/>
  <text class="amb" x="548" y="116" text-anchor="end">a 2⁻⁴⁷ fraction of the box,</text>
  <text class="amb" x="548" y="132" text-anchor="end">holding 76% of the probability</text>

  <!-- all heads -->
  <circle cx="150" cy="112" r="4" fill="currentColor"/>
  <line x1="154" y1="110" x2="172" y2="100" stroke="currentColor" opacity="0.5"/>
  <text class="muted" x="176" y="90">all heads: p = 2.7·10⁻⁵, the single</text>
  <text class="muted" x="176" y="106">most probable sequence, and atypical</text>

  <!-- all tails -->
  <circle cx="505" cy="218" r="4" fill="currentColor"/>
  <line x1="501" y1="216" x2="487" y2="208" stroke="currentColor" opacity="0.5"/>
  <text class="muted" x="483" y="204" text-anchor="end">all tails: p ≈ 10⁻¹⁰⁰</text>

  <!-- indexing arrow -->
  <line x1="300" y1="250" x2="300" y2="219" stroke="#e2903a"/>
  <path d="M296 225 L300 216 L304 225 Z" fill="#e2903a"/>
  <text class="amb" x="300" y="266" text-anchor="middle">53 bits name a member of the region; 100 bits name a member of the box</text>

  <text class="muted" x="300" y="304" text-anchor="middle">membership rule: −(1/n)·log₂ p(x¹⁰⁰) within ε of H = 0.469 bits</text>
  <text class="muted" x="300" y="322" text-anchor="middle">as n grows and ε shrinks, the exponent falls to nH = 46.9 bits</text>
</svg>

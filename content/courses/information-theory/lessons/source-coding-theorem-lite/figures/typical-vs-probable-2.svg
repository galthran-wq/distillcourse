<svg viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <style>
    .lbl { fill: currentColor; font-size: 12px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .amb { fill: #e2903a; font-size: 11px; }
    .blu { fill: #4c8dd6; font-size: 11px; }
  </style>

  <text class="lbl" x="45" y="22">100 flips of the 90/10 coin</text>
  <text x="555" y="22" font-size="12" font-weight="bold" fill="#e2903a" text-anchor="end">2 / 3 — the typical band</text>

  <!-- NEW: the typical band and the entropy line -->
  <rect x="286.8" y="144" width="117.5" height="26" fill="#e2903a" fill-opacity="0.25" stroke="#e2903a"/>
  <text class="amb" x="345.6" y="138" text-anchor="middle">typical set, ε = 0.1</text>
  <line x1="345.6" y1="126" x2="345.6" y2="194" stroke="#4c8dd6" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text class="blu" x="345.6" y="214" text-anchor="middle">H = 0.469, where 90-heads/10-tails sequences land</text>

  <!-- the sequence in focus -->
  <text class="muted" x="159" y="96" text-anchor="middle">all heads, 0 tails</text>
  <text class="muted" x="159" y="112" text-anchor="middle">probability 0.9¹⁰⁰ = 2.7·10⁻⁵</text>
  <text class="muted" x="159" y="128" text-anchor="middle">−(1/n)·log₂ p = 0.152 bits</text>
  <line x1="159" y1="134" x2="159" y2="164" stroke="currentColor" opacity="0.5"/>
  <circle cx="159" cy="170" r="5" fill="#e2903a"/>

  <!-- axis -->
  <line x1="60" y1="170" x2="555" y2="170" stroke="currentColor" opacity="0.6"/>
  <g stroke="currentColor" opacity="0.5">
    <line x1="70" y1="170" x2="70" y2="176"/>
    <line x1="187.5" y1="170" x2="187.5" y2="176"/>
    <line x1="305" y1="170" x2="305" y2="176"/>
    <line x1="422.5" y1="170" x2="422.5" y2="176"/>
    <line x1="540" y1="170" x2="540" y2="176"/>
  </g>
  <g class="muted" text-anchor="middle">
    <text x="70" y="192">0</text>
    <text x="187.5" y="192">0.2</text>
    <text x="305" y="192">0.4</text>
    <text x="422.5" y="192">0.6</text>
    <text x="540" y="192">0.8</text>
  </g>
  <text class="muted" x="305" y="236" text-anchor="middle">per-symbol surprisal −(1/n)·log₂ p(x¹⁰⁰), in bits</text>
</svg>

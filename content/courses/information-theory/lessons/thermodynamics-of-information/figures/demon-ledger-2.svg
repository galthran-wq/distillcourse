<svg viewBox="0 0 600 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="20" y="24" font-size="13" fill="currentColor">the stored bit is the entry the naive ledger omits</text>
  <text x="580" y="24" font-size="13" font-weight="bold" fill="#e2903a" text-anchor="end">2 &#183; unbalanced books</text>

  <!-- engine -->
  <rect x="30" y="70" width="180" height="110" rx="4" fill="none" stroke="currentColor" stroke-width="2"/>
  <text x="120" y="120" font-size="12" fill="currentColor" text-anchor="middle">Szilard engine</text>
  <text x="120" y="138" font-size="11" fill="currentColor" text-anchor="middle" opacity="0.55">one bath at T</text>

  <!-- work out -->
  <line x1="212" y1="100" x2="278" y2="100" stroke="#e2903a" stroke-width="2"/>
  <path d="M 290 100 l -12 -5 l 0 10 z" fill="#e2903a"/>
  <text x="248" y="88" font-size="11" fill="#e2903a" text-anchor="middle">kT ln 2</text>
  <text x="296" y="104" font-size="11" fill="currentColor" opacity="0.55">lifted weight</text>

  <!-- memory, highlighted (the delta) -->
  <text x="120" y="212" font-size="11" fill="currentColor" text-anchor="middle" opacity="0.55">demon's memory</text>
  <rect x="85" y="222" width="70" height="46" rx="4" fill="none" stroke="currentColor"/>
  <rect x="100" y="225" width="40" height="40" rx="4" fill="none" stroke="#e2903a" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="105" y="230" width="30" height="30" rx="3" fill="none" stroke="#4c8dd6" stroke-width="1.5"/>
  <text x="120" y="252" font-size="15" font-weight="bold" fill="#e2903a" text-anchor="middle">L</text>
  <text x="120" y="290" font-size="11" fill="#e2903a" text-anchor="middle">still holds the bit</text>

  <!-- ledger -->
  <text x="320" y="80" font-size="13" font-weight="bold" fill="currentColor">balance sheet, one cycle</text>
  <text x="320" y="115" font-size="12" fill="currentColor">work extracted</text>
  <text x="570" y="115" font-size="12" font-weight="bold" fill="#e2903a" text-anchor="end">+kT ln 2</text>
  <text x="320" y="150" font-size="12" fill="currentColor">memory reset</text>
  <text x="570" y="150" font-size="12" fill="currentColor" text-anchor="end" opacity="0.55">&#8212;</text>
  <line x1="320" y1="168" x2="570" y2="168" stroke="currentColor" opacity="0.4"/>
  <text x="320" y="194" font-size="12" font-weight="bold" fill="currentColor">net work out</text>
  <text x="570" y="194" font-size="12" font-weight="bold" fill="#e2903a" text-anchor="end">+kT ln 2 ?</text>

  <text x="320" y="228" font-size="11" fill="currentColor">work drawn from a single heat bath:</text>
  <text x="320" y="245" font-size="11" fill="currentColor">the second law appears violated while the bit sits unpaid</text>
</svg>

<svg viewBox="0 0 560 224" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <title>Energy per elementary operation on a logarithmic axis, from the Landauer floor to one joule</title>

  <!-- axis -->
  <line x1="60" y1="140" x2="536" y2="140" stroke="currentColor" stroke-width="1" />
  <g stroke="currentColor" stroke-width="1" opacity="0.55">
    <line x1="60" y1="140" x2="60" y2="146" />
    <line x1="127.1" y1="140" x2="127.1" y2="146" />
    <line x1="194.3" y1="140" x2="194.3" y2="146" />
    <line x1="261.4" y1="140" x2="261.4" y2="146" />
    <line x1="328.6" y1="140" x2="328.6" y2="146" />
    <line x1="395.7" y1="140" x2="395.7" y2="146" />
    <line x1="462.9" y1="140" x2="462.9" y2="146" />
    <line x1="530" y1="140" x2="530" y2="146" />
  </g>
  <g fill="currentColor" opacity="0.55" font-size="11" text-anchor="middle">
    <text x="60" y="159">10⁻²¹</text>
    <text x="127.1" y="159">10⁻¹⁸</text>
    <text x="194.3" y="159">10⁻¹⁵</text>
    <text x="261.4" y="159">10⁻¹²</text>
    <text x="328.6" y="159">10⁻⁹</text>
    <text x="395.7" y="159">10⁻⁶</text>
    <text x="462.9" y="159">10⁻³</text>
    <text x="530" y="159">10⁰</text>
  </g>

  <!-- the two Landauer floors (amber: the subject) -->
  <g stroke="#e2903a" stroke-width="1.5">
    <line x1="70.2" y1="140" x2="70.2" y2="38" />
    <line x1="103.9" y1="140" x2="103.9" y2="62" />
  </g>
  <g fill="#e2903a">
    <circle cx="70.2" cy="38" r="3.5" />
    <circle cx="103.9" cy="62" r="3.5" />
    <text x="78.2" y="42" font-size="12">kT ln 2 = 2.9 × 10⁻²¹ J: one erased bit at 300 K</text>
    <text x="111.9" y="66" font-size="12">9 × 10⁻²⁰ J: clearing a 32-bit register</text>
  </g>

  <!-- what real devices spend (blue: the contrast series) -->
  <g stroke="#4c8dd6" stroke-width="1.5">
    <line x1="166.9" y1="140" x2="166.9" y2="86" />
    <line x1="328.6" y1="140" x2="328.6" y2="110" />
  </g>
  <g fill="#4c8dd6">
    <circle cx="166.9" cy="86" r="3.5" />
    <circle cx="328.6" cy="110" r="3.5" />
    <text x="174.9" y="90" font-size="12">6 × 10⁻¹⁷ J: one CMOS gate switch</text>
    <text x="336.6" y="114" font-size="12">≈ 10⁻⁹ J: one 32-bit DRAM access</text>
  </g>

  <!-- human scale -->
  <line x1="530" y1="140" x2="530" y2="128" stroke="currentColor" stroke-width="1.5" opacity="0.55" />
  <circle cx="530" cy="128" r="3.5" fill="currentColor" opacity="0.55" />
  <text x="522" y="132" font-size="12" fill="currentColor" opacity="0.55" text-anchor="end">1 J: lifting an apple 1 m</text>

  <!-- the gap that matters -->
  <g stroke="currentColor" stroke-width="1" opacity="0.55">
    <line x1="70.2" y1="176" x2="166.9" y2="176" />
    <line x1="70.2" y1="176" x2="70.2" y2="170" />
    <line x1="166.9" y1="176" x2="166.9" y2="170" />
  </g>
  <text x="118.5" y="194" font-size="12" fill="currentColor" text-anchor="middle">2 × 10⁴ erasure floors</text>

  <text x="298" y="215" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">energy per operation (joules, log scale)</text>
</svg>

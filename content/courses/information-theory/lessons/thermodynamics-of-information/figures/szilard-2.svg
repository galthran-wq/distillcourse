<svg viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="20" y="24" font-size="13" fill="currentColor">a thin partition drops in at the midpoint; the molecule is caught on one side</text>
  <text x="580" y="24" font-size="13" font-weight="bold" fill="#e2903a" text-anchor="end">2 &#183; partition</text>

  <!-- box -->
  <rect x="40" y="60" width="320" height="180" rx="4" fill="none" stroke="currentColor" stroke-width="2"/>

  <!-- partition (the delta) -->
  <line x1="200" y1="60" x2="200" y2="240" stroke="#e2903a" stroke-width="2.5"/>
  <text x="205" y="52" font-size="11" fill="#e2903a">partition</text>

  <!-- molecule -->
  <circle cx="150" cy="150" r="7" fill="#e2903a"/>
  <g stroke="#e2903a" stroke-width="1.5" opacity="0.6">
    <line x1="162" y1="138" x2="176" y2="124"/>
    <line x1="132" y1="160" x2="120" y2="170"/>
    <line x1="158" y1="164" x2="168" y2="176"/>
  </g>

  <text x="120" y="228" font-size="12" fill="currentColor" text-anchor="middle" opacity="0.55">V/2</text>
  <text x="280" y="228" font-size="12" fill="currentColor" text-anchor="middle" opacity="0.55">V/2</text>
  <text x="200" y="266" font-size="11" fill="currentColor" text-anchor="middle" opacity="0.55">heat bath at temperature T</text>

  <!-- memory -->
  <text x="495" y="100" font-size="11" fill="currentColor" text-anchor="middle" opacity="0.55">demon's memory M</text>
  <rect x="440" y="110" width="110" height="70" rx="4" fill="none" stroke="currentColor"/>
  <rect x="470" y="125" width="50" height="40" rx="3" fill="none" stroke="#4c8dd6" stroke-width="1.5"/>
  <text x="495" y="153" font-size="18" font-weight="bold" fill="#4c8dd6" text-anchor="middle">?</text>
</svg>

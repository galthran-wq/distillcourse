<svg viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="20" y="24" font-size="13" fill="currentColor">the partition, now a piston, is pushed outward; the bath supplies the heat</text>
  <text x="580" y="24" font-size="13" font-weight="bold" fill="#e2903a" text-anchor="end">4 &#183; expansion</text>

  <!-- box -->
  <rect x="40" y="60" width="320" height="180" rx="4" fill="none" stroke="currentColor" stroke-width="2"/>

  <!-- old partition position (ghost) -->
  <line x1="200" y1="60" x2="200" y2="240" stroke="currentColor" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.35"/>

  <!-- piston (the delta) -->
  <line x1="290" y1="60" x2="290" y2="240" stroke="#e2903a" stroke-width="2.5"/>
  <line x1="215" y1="150" x2="278" y2="150" stroke="#e2903a" stroke-width="2"/>
  <path d="M 290 150 l -13 -5 l 0 10 z" fill="#e2903a"/>
  <text x="248" y="138" font-size="12" font-weight="bold" fill="#e2903a" text-anchor="middle">W = kT ln 2</text>

  <!-- molecule -->
  <circle cx="150" cy="150" r="7" fill="#e2903a"/>
  <g stroke="#e2903a" stroke-width="1.5" opacity="0.6">
    <line x1="162" y1="138" x2="176" y2="124"/>
    <line x1="132" y1="160" x2="120" y2="170"/>
    <line x1="158" y1="164" x2="168" y2="176"/>
  </g>

  <text x="120" y="228" font-size="12" fill="currentColor" text-anchor="middle" opacity="0.55">V/2 &#8594; V</text>
  <text x="200" y="266" font-size="11" fill="currentColor" text-anchor="middle" opacity="0.55">heat bath at temperature T</text>

  <!-- heat inflow -->
  <line x1="330" y1="272" x2="330" y2="250" stroke="#4c8dd6" stroke-width="2"/>
  <path d="M 330 242 l -5 10 l 10 0 z" fill="#4c8dd6"/>
  <text x="340" y="262" font-size="11" fill="#4c8dd6">heat kT ln 2 in</text>

  <!-- memory -->
  <text x="495" y="100" font-size="11" fill="currentColor" text-anchor="middle" opacity="0.55">demon's memory M</text>
  <rect x="440" y="110" width="110" height="70" rx="4" fill="none" stroke="currentColor"/>
  <rect x="470" y="125" width="50" height="40" rx="3" fill="none" stroke="#4c8dd6" stroke-width="1.5"/>
  <text x="495" y="153" font-size="18" font-weight="bold" fill="#e2903a" text-anchor="middle">L</text>
</svg>

<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="14">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .edge { stroke: currentColor; stroke-opacity: 0.35; stroke-width: 1.5; fill: none; }
    .hot  { stroke: #e2903a; stroke-width: 2.5; fill: none; }
    .node { fill: currentColor; }
  </style>

  <!-- tree -->
  <circle class="node" cx="80" cy="140" r="4"/>
  <text class="label" x="80" y="122" text-anchor="middle" font-weight="600">start</text>

  <path class="hot"  d="M84 136 L 240 70"/>
  <path class="edge" d="M84 144 L 240 210"/>
  <circle class="node" cx="244" cy="68" r="4"/>
  <circle class="node" cx="244" cy="212" r="4"/>
  <text class="label" x="252" y="58">H</text>
  <text class="label" x="252" y="232">T</text>
  <text class="muted" x="150" y="86">p = 1/2 · 1 bit</text>

  <path class="hot"  d="M248 64 L 404 30"/>
  <path class="edge" d="M248 72 L 404 110"/>
  <circle class="node" cx="408" cy="28" r="4"/>
  <circle class="node" cx="408" cy="112" r="4"/>
  <text class="label" x="416" y="24">HH</text>
  <text class="label" x="416" y="124">HT</text>
  <text class="muted" x="310" y="26">p = 1/2 · 1 bit</text>

  <path class="edge" d="M248 208 L 404 180"/>
  <path class="edge" d="M248 216 L 404 250"/>
  <circle class="node" cx="408" cy="178" r="4"/>
  <circle class="node" cx="408" cy="252" r="4"/>
  <text class="label" x="416" y="182">TH</text>
  <text class="label" x="416" y="262">TT</text>

  <!-- totals for the highlighted path -->
  <g transform="translate(470,24)">
    <text class="label" y="0" font-weight="600">path H → HH</text>
    <text class="muted" y="24">probabilities multiply:</text>
    <text class="label" y="44">1/2 × 1/2 = 1/4</text>
    <text class="muted" y="72">surprisals add:</text>
    <text class="label" y="92">1 bit + 1 bit = 2 bits</text>
    <text class="muted" y="120">−log₂(1/4) = 2 ✓</text>
  </g>
</svg>

<svg viewBox="0 0 640 310" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .axis  { stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.2; fill: none; }
    .log   { stroke: #e2903a; stroke-width: 2.5; fill: none; }
    .lin   { stroke: #4c8dd6; stroke-width: 2; fill: none; }
    .inv   { stroke: currentColor; stroke-opacity: 0.45; stroke-width: 2; fill: none; }
  </style>

  <!-- axes -->
  <path class="axis" d="M70 250 L590 250"/>
  <path class="axis" d="M70 250 L70 30"/>
  <text class="muted" x="592" y="268">p</text>
  <text class="muted" x="44" y="34">f(p)</text>
  <!-- x ticks -->
  <path class="axis" d="M195 250 L195 255"/>
  <path class="axis" d="M320 250 L320 255"/>
  <path class="axis" d="M570 250 L570 255"/>
  <text class="muted" x="195" y="270" text-anchor="middle">1/4</text>
  <text class="muted" x="320" y="270" text-anchor="middle">1/2</text>
  <text class="muted" x="570" y="270" text-anchor="middle">1</text>
  <!-- y ticks -->
  <path class="axis" d="M65 180 L70 180"/>
  <path class="axis" d="M65 110 L70 110"/>
  <path class="axis" d="M65 40 L70 40"/>
  <text class="muted" x="58" y="184" text-anchor="end">1</text>
  <text class="muted" x="58" y="114" text-anchor="end">2</text>
  <text class="muted" x="58" y="44" text-anchor="end">3</text>

  <!-- candidate curves -->
  <path class="lin" d="M70 180 L570 250"/>
  <path class="inv" d="M195 40 L205 60.7 L220 86.7 L235 107.9 L255 130.8 L280 153.3 L310 174.2 L345 192.7 L385 208.9 L430 222.8 L480 234.6 L525 243.1 L570 250"/>
  <path class="log" d="M132.5 40 L140 51.4 L150 64.9 L160 76.8 L175 92.4 L195 110 L215 125.0 L240 141.1 L270 157.5 L305 173.8 L345 189.7 L390 204.9 L440 219.6 L495 233.6 L570 250"/>

  <!-- curve labels, color-matched -->
  <text x="128" y="74" text-anchor="end" fill="#e2903a" font-weight="600">&#8722;log&#8322; p</text>
  <text x="230" y="64" fill="currentColor" opacity="0.55" font-weight="600">1/p &#8722; 1</text>
  <text x="80" y="168" fill="#4c8dd6" font-weight="600">1 &#8722; p</text>

  <!-- frame annotation -->
  <text class="label" x="420" y="60" font-weight="600">three candidates</text>
  <text class="muted" x="420" y="80">all satisfy f(1) = 0</text>
  <text class="muted" x="420" y="98">all strictly decreasing</text>
</svg>

<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .axis  { stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1; }
    .map   { stroke: currentColor; stroke-opacity: 0.45; stroke-width: 1; stroke-dasharray: 3 3; }
    .hot   { stroke: #e2903a; stroke-width: 1.6; fill: none; }
    .hotx  { fill: #e2903a; }
  </style>

  <text class="muted" x="320" y="26" text-anchor="middle">the substitution t = &#8722;ln p, and what it does to the additivity requirement</text>

  <!-- p axis -->
  <line class="axis" x1="55" y1="90" x2="585" y2="90"/>
  <g class="axis">
    <line x1="90" y1="86" x2="90" y2="94"/><line x1="240" y1="86" x2="240" y2="94"/>
    <line x1="390" y1="86" x2="390" y2="94"/><line x1="540" y1="86" x2="540" y2="94"/>
  </g>
  <text class="label" x="90" y="74" text-anchor="middle">p = 1</text>
  <text class="label" x="240" y="74" text-anchor="middle">&#189;</text>
  <text class="label" x="390" y="74" text-anchor="middle">&#188;</text>
  <text class="label" x="540" y="74" text-anchor="middle">&#8539;</text>
  <text class="muted" x="600" y="94">p</text>

  <!-- mapping arrows -->
  <g class="map">
    <line x1="90" y1="100" x2="90" y2="188"/><line x1="240" y1="100" x2="240" y2="188"/>
    <line x1="390" y1="100" x2="390" y2="188"/><line x1="540" y1="100" x2="540" y2="188"/>
  </g>
  <g class="map">
    <path d="M86 182 L90 190 L94 182"/><path d="M236 182 L240 190 L244 182"/>
    <path d="M386 182 L390 190 L394 182"/><path d="M536 182 L540 190 L544 182"/>
  </g>

  <!-- t axis -->
  <line class="axis" x1="55" y1="200" x2="585" y2="200"/>
  <g class="axis">
    <line x1="90" y1="196" x2="90" y2="204"/><line x1="240" y1="196" x2="240" y2="204"/>
    <line x1="390" y1="196" x2="390" y2="204"/><line x1="540" y1="196" x2="540" y2="204"/>
  </g>
  <text class="label" x="90" y="218" text-anchor="middle">t = 0</text>
  <text class="label" x="240" y="218" text-anchor="middle">0.69</text>
  <text class="label" x="390" y="218" text-anchor="middle">1.39</text>
  <text class="label" x="540" y="218" text-anchor="middle">2.08</text>
  <text class="muted" x="600" y="204">t</text>

  <text class="label" x="320" y="296" text-anchor="middle">t = &#8722;ln p carries (0,1] onto [0,&#8734;): p = 1 lands at t = 0, and each halving of p adds ln 2 &#8776; 0.69</text>
  <text class="muted" x="320" y="316" text-anchor="middle">define g(t) = f(e&#8315;&#7511;), the same unknown function read on the new scale</text>
</svg>

<svg viewBox="0 0 640 240" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .miss  { fill: #4c8dd6; }
    .hit   { fill: #e2903a; }
    .cut   { stroke: currentColor; stroke-opacity: 0.35; stroke-width: 0.8; }
    .axis  { stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1; }
  </style>

  <text class="muted" x="320" y="34" text-anchor="middle">one submarine hidden in 64 squares; shots fired one square at a time, hit on the 49th</text>

  <!-- the stacked bar: 6 bits wide, 85 px per bit -->
  <rect class="miss" x="70" y="90" width="170" height="32" rx="3"/>
  <rect class="hit"  x="240" y="90" width="340" height="32" rx="3"/>

  <!-- one divider per miss: widths grow as the remaining squares run out -->
  <g class="cut">
    <line x1="71.9" y1="90" x2="71.9" y2="122"/><line x1="73.9" y1="90" x2="73.9" y2="122"/>
    <line x1="75.9" y1="90" x2="75.9" y2="122"/><line x1="77.9" y1="90" x2="77.9" y2="122"/>
    <line x1="80.0" y1="90" x2="80.0" y2="122"/><line x1="82.1" y1="90" x2="82.1" y2="122"/>
    <line x1="84.2" y1="90" x2="84.2" y2="122"/><line x1="86.4" y1="90" x2="86.4" y2="122"/>
    <line x1="88.6" y1="90" x2="88.6" y2="122"/><line x1="90.8" y1="90" x2="90.8" y2="122"/>
    <line x1="93.1" y1="90" x2="93.1" y2="122"/><line x1="95.5" y1="90" x2="95.5" y2="122"/>
    <line x1="97.8" y1="90" x2="97.8" y2="122"/><line x1="100.3" y1="90" x2="100.3" y2="122"/>
    <line x1="102.7" y1="90" x2="102.7" y2="122"/><line x1="105.3" y1="90" x2="105.3" y2="122"/>
    <line x1="107.9" y1="90" x2="107.9" y2="122"/><line x1="110.5" y1="90" x2="110.5" y2="122"/>
    <line x1="113.2" y1="90" x2="113.2" y2="122"/><line x1="115.9" y1="90" x2="115.9" y2="122"/>
    <line x1="118.8" y1="90" x2="118.8" y2="122"/><line x1="121.7" y1="90" x2="121.7" y2="122"/>
    <line x1="124.6" y1="90" x2="124.6" y2="122"/><line x1="127.6" y1="90" x2="127.6" y2="122"/>
    <line x1="130.7" y1="90" x2="130.7" y2="122"/><line x1="133.9" y1="90" x2="133.9" y2="122"/>
    <line x1="137.2" y1="90" x2="137.2" y2="122"/><line x1="140.6" y1="90" x2="140.6" y2="122"/>
    <line x1="144.0" y1="90" x2="144.0" y2="122"/><line x1="147.6" y1="90" x2="147.6" y2="122"/>
    <line x1="151.2" y1="90" x2="151.2" y2="122"/><line x1="155.0" y1="90" x2="155.0" y2="122"/>
    <line x1="158.9" y1="90" x2="158.9" y2="122"/><line x1="162.9" y1="90" x2="162.9" y2="122"/>
    <line x1="167.1" y1="90" x2="167.1" y2="122"/><line x1="171.4" y1="90" x2="171.4" y2="122"/>
    <line x1="175.8" y1="90" x2="175.8" y2="122"/><line x1="180.5" y1="90" x2="180.5" y2="122"/>
    <line x1="185.3" y1="90" x2="185.3" y2="122"/><line x1="190.3" y1="90" x2="190.3" y2="122"/>
    <line x1="195.5" y1="90" x2="195.5" y2="122"/><line x1="200.9" y1="90" x2="200.9" y2="122"/>
    <line x1="206.7" y1="90" x2="206.7" y2="122"/><line x1="212.6" y1="90" x2="212.6" y2="122"/>
    <line x1="218.9" y1="90" x2="218.9" y2="122"/><line x1="225.6" y1="90" x2="225.6" y2="122"/>
    <line x1="232.6" y1="90" x2="232.6" y2="122"/>
  </g>

  <text class="label" x="155" y="82" text-anchor="middle">48 misses</text>
  <text class="label" x="410" y="82" text-anchor="middle">the hit, 16 squares left</text>
  <text class="muted" x="155" y="142" text-anchor="middle">0.023 to 0.088 bits each, 2.00 bits in all</text>
  <text class="muted" x="410" y="142" text-anchor="middle">log&#8322; 16 = 4.00 bits</text>

  <!-- bits axis -->
  <line class="axis" x1="70" y1="164" x2="580" y2="164"/>
  <g class="axis">
    <line x1="70" y1="164" x2="70" y2="170"/><line x1="155" y1="164" x2="155" y2="170"/>
    <line x1="240" y1="164" x2="240" y2="170"/><line x1="325" y1="164" x2="325" y2="170"/>
    <line x1="410" y1="164" x2="410" y2="170"/><line x1="495" y1="164" x2="495" y2="170"/>
    <line x1="580" y1="164" x2="580" y2="170"/>
  </g>
  <text class="muted" x="70" y="184" text-anchor="middle">0</text>
  <text class="muted" x="155" y="184" text-anchor="middle">1</text>
  <text class="muted" x="240" y="184" text-anchor="middle">2</text>
  <text class="muted" x="325" y="184" text-anchor="middle">3</text>
  <text class="muted" x="410" y="184" text-anchor="middle">4</text>
  <text class="muted" x="495" y="184" text-anchor="middle">5</text>
  <text class="muted" x="580" y="184" text-anchor="middle">6</text>
  <text class="muted" x="600" y="168">bits</text>

  <text class="label" x="320" y="212" text-anchor="middle">log&#8322;(64/63) + log&#8322;(63/62) + &#8230; + log&#8322;(17/16) + log&#8322;(16/1) = log&#8322; 64</text>
  <text class="muted" x="320" y="232" text-anchor="middle">the factors cancel: 6 bits in total, whichever shot lands the hit</text>
</svg>

<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .axis  { stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.2; fill: none; }
    .log   { stroke: #e2903a; stroke-width: 2.5; fill: none; }
    .guide { stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
  </style>

  <!-- axes -->
  <path class="axis" d="M70 260 L590 260"/>
  <path class="axis" d="M70 260 L70 26"/>
  <text class="muted" x="592" y="278">p</text>
  <text class="muted" x="40" y="30">bits</text>
  <!-- x ticks -->
  <path class="axis" d="M320 260 L320 265"/>
  <path class="axis" d="M570 260 L570 265"/>
  <text class="muted" x="320" y="280" text-anchor="middle">1/2</text>
  <text class="muted" x="570" y="280" text-anchor="middle">1</text>
  <!-- y ticks -->
  <path class="axis" d="M65 222 L70 222"/>
  <path class="axis" d="M65 184 L70 184"/>
  <path class="axis" d="M65 146 L70 146"/>
  <path class="axis" d="M65 108 L70 108"/>
  <path class="axis" d="M65 70 L70 70"/>
  <path class="axis" d="M65 32 L70 32"/>
  <text class="muted" x="58" y="226" text-anchor="end">1</text>
  <text class="muted" x="58" y="188" text-anchor="end">2</text>
  <text class="muted" x="58" y="150" text-anchor="end">3</text>
  <text class="muted" x="58" y="112" text-anchor="end">4</text>
  <text class="muted" x="58" y="74" text-anchor="end">5</text>
  <text class="muted" x="58" y="36" text-anchor="end">6</text>

  <!-- the curve I(p) = -log2 p -->
  <path class="log" d="M78.5 36.6 L79.6 43.4 L82 55.7 L85 67.7 L90 82.9 L95 95.8 L102 109.5 L110 121.6 L121 134.5 L132.5 146 L143 154.7 L153.3 161.8 L170 171.4 L195 184 L220 194.2 L245 202.4 L270 209.4 L295 215.9 L320 222 L360 230.5 L400 237.4 L440 243.2 L480 248.2 L525 254 L570 260"/>
  <text x="150" y="120" fill="#e2903a" font-weight="600">I(p) = &#8722;log&#8322; p</text>

  <!-- marked events -->
  <path class="guide" d="M320 260 L320 222 L70 222"/>
  <circle cx="320" cy="222" r="4" fill="currentColor"/>
  <text class="label" x="332" y="202">coin flip</text>
  <text class="muted" x="332" y="218">p = 1/2 &#8594; 1 bit</text>

  <path class="guide" d="M153.3 260 L153.3 161.8 L70 161.8"/>
  <circle cx="153.3" cy="161.8" r="4" fill="currentColor"/>
  <text class="label" x="196" y="158">die roll</text>
  <text class="muted" x="196" y="174">p = 1/6 &#8594; 2.58 bits</text>

  <path class="guide" d="M79.6 43.4 L70 43.4"/>
  <circle cx="79.6" cy="43.4" r="4" fill="currentColor"/>
  <text class="label" x="94" y="42">ace of spades</text>
  <text class="muted" x="94" y="58">p = 1/52 &#8594; 5.70 bits</text>
</svg>

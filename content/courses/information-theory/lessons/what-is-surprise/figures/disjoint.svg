<svg viewBox="0 0 300 250" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; font-weight: 600; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .p-bar { fill: #4c8dd6; }
    .i-bar { fill: #e2903a; }
  </style>

  <!-- legend -->
  <rect class="p-bar" x="10" y="8" width="10" height="10" rx="2"/>
  <text class="muted" x="25" y="17">probability</text>
  <rect class="i-bar" x="110" y="8" width="10" height="10" rx="2"/>
  <text class="muted" x="125" y="17">surprisal</text>

  <!-- A = {1} -->
  <text class="label" x="10" y="52">A = {1}</text>
  <rect class="p-bar" x="90" y="40" width="30" height="13" rx="2"/>
  <text class="muted" x="126" y="51">p = 1/6</text>
  <rect class="i-bar" x="90" y="59" width="77" height="13" rx="2"/>
  <text class="muted" x="173" y="70">2.58 bits</text>

  <!-- B = {2} -->
  <text class="label" x="10" y="112">B = {2}</text>
  <rect class="p-bar" x="90" y="100" width="30" height="13" rx="2"/>
  <text class="muted" x="126" y="111">p = 1/6</text>
  <rect class="i-bar" x="90" y="119" width="77" height="13" rx="2"/>
  <text class="muted" x="173" y="130">2.58 bits</text>

  <!-- union -->
  <text class="label" x="10" y="172">A &#8746; B</text>
  <rect class="p-bar" x="90" y="160" width="60" height="13" rx="2"/>
  <text class="muted" x="156" y="171">p = 1/3</text>
  <rect class="i-bar" x="90" y="179" width="47" height="13" rx="2"/>
  <text class="muted" x="143" y="190">1.58 bits</text>

  <text class="muted" x="150" y="228" text-anchor="middle">probabilities add &#8594; the union is</text>
  <text class="muted" x="150" y="243" text-anchor="middle">less surprising than either part</text>
</svg>

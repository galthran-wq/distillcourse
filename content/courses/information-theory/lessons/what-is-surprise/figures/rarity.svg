<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="14">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .p-bar { fill: #4c8dd6; }
    .i-bar { fill: #e2903a; }
  </style>

  <!-- column: sunrise -->
  <g transform="translate(60,20)">
    <text class="label" x="60" y="14" text-anchor="middle" font-weight="600">Sunrise</text>
    <text class="muted" x="60" y="32" text-anchor="middle">p ≈ 1</text>
    <rect class="p-bar" x="20" y="160" width="34" height="140" transform="translate(0,-140)" rx="3"/>
    <rect class="i-bar" x="66" y="160" width="34" height="3" transform="translate(0,-3)" rx="1"/>
    <text class="muted" x="37" y="180" text-anchor="middle">prob.</text>
    <text class="muted" x="83" y="180" text-anchor="middle">info</text>
    <text class="muted" x="60" y="205" text-anchor="middle">≈ 0 bits</text>
  </g>

  <!-- column: coin flip -->
  <g transform="translate(260,20)">
    <text class="label" x="60" y="14" text-anchor="middle" font-weight="600">Coin flip</text>
    <text class="muted" x="60" y="32" text-anchor="middle">p = 1/2</text>
    <rect class="p-bar" x="20" y="160" width="34" height="70" transform="translate(0,-70)" rx="3"/>
    <rect class="i-bar" x="66" y="160" width="34" height="18" transform="translate(0,-18)" rx="3"/>
    <text class="muted" x="37" y="180" text-anchor="middle">prob.</text>
    <text class="muted" x="83" y="180" text-anchor="middle">info</text>
    <text class="muted" x="60" y="205" text-anchor="middle">1 bit</text>
  </g>

  <!-- column: lottery win -->
  <g transform="translate(460,20)">
    <text class="label" x="60" y="14" text-anchor="middle" font-weight="600">Lottery win</text>
    <text class="muted" x="60" y="32" text-anchor="middle">p = 1/1,000,000</text>
    <rect class="p-bar" x="20" y="160" width="34" height="2" transform="translate(0,-2)" rx="1"/>
    <rect class="i-bar" x="66" y="160" width="34" height="140" transform="translate(0,-140)" rx="3"/>
    <text class="muted" x="37" y="180" text-anchor="middle">prob.</text>
    <text class="muted" x="83" y="180" text-anchor="middle">info</text>
    <text class="muted" x="60" y="205" text-anchor="middle">≈ 20 bits</text>
  </g>

  <text class="muted" x="320" y="245" text-anchor="middle">as probability shrinks, information grows</text>
</svg>

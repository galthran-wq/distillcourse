<svg viewBox="0 0 640 200" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .whole { fill: #e2903a; }
    .part  { fill: #4c8dd6; }
  </style>

  <!-- whole event -->
  <text class="label" x="30" y="42" font-weight="600">ace of spades</text>
  <text class="muted" x="150" y="42">p = 1/52</text>
  <rect class="whole" x="30" y="52" width="456" height="26" rx="4"/>
  <text class="label" x="496" y="70">log&#8322; 52 &#8776; 5.70 bits</text>

  <!-- split into two independent facts -->
  <rect class="part" x="30" y="112" width="158" height="26" rx="4"/>
  <rect class="part" x="192" y="112" width="294" height="26" rx="4"/>
  <text class="label" x="496" y="130">2 + 3.70 = 5.70 &#10003;</text>
  <text class="muted" x="109" y="158" text-anchor="middle">suit (1 of 4): log&#8322; 4 = 2 bits</text>
  <text class="muted" x="339" y="158" text-anchor="middle">rank in suit (1 of 13): log&#8322; 13 &#8776; 3.70 bits</text>

  <text class="muted" x="320" y="188" text-anchor="middle">independent facts: probabilities multiply (1/4 &#183; 1/13 = 1/52), surprisals add</text>
</svg>

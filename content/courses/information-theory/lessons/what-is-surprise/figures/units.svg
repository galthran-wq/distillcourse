<svg viewBox="0 0 640 230" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .box   { stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.2; fill: none; }
    .hot   { stroke: #e2903a; stroke-width: 2; fill: none; }
    .arrow { stroke: currentColor; stroke-opacity: 0.7; stroke-width: 1.5; fill: none; }
    .big   { fill: currentColor; font-size: 20px; font-weight: 600; }
  </style>

  <text class="muted" x="320" y="28" text-anchor="middle">one event, three readings of the same surprisal: a fair-die roll, p = 1/6</text>

  <!-- hartleys -->
  <rect class="box" x="30" y="60" width="160" height="96" rx="6"/>
  <text class="big" x="110" y="98" text-anchor="middle">0.778</text>
  <text class="label" x="110" y="120" text-anchor="middle">hartleys</text>
  <text class="muted" x="110" y="140" text-anchor="middle">base 10</text>

  <!-- bits (the subject) -->
  <rect class="hot" x="240" y="60" width="160" height="96" rx="6"/>
  <text class="big" x="320" y="98" text-anchor="middle" fill="#e2903a">2.585</text>
  <text x="320" y="120" text-anchor="middle" fill="#e2903a" font-weight="600">bits</text>
  <text class="muted" x="320" y="140" text-anchor="middle">base 2</text>

  <!-- nats -->
  <rect class="box" x="450" y="60" width="160" height="96" rx="6"/>
  <text class="big" x="530" y="98" text-anchor="middle">1.792</text>
  <text class="label" x="530" y="120" text-anchor="middle">nats</text>
  <text class="muted" x="530" y="140" text-anchor="middle">base e</text>

  <!-- conversion arrows into bits -->
  <path class="arrow" d="M194 108 L233 108"/>
  <path class="arrow" d="M233 108 L226 104 M233 108 L226 112"/>
  <text class="label" x="213" y="96" text-anchor="middle" font-size="12">&#215; 3.322</text>

  <path class="arrow" d="M446 108 L407 108"/>
  <path class="arrow" d="M407 108 L414 104 M407 108 L414 112"/>
  <text class="label" x="427" y="96" text-anchor="middle" font-size="12">&#215; 1.443</text>

  <text class="muted" x="320" y="196" text-anchor="middle">changing the log base multiplies every value by one constant: a change of unit</text>
</svg>

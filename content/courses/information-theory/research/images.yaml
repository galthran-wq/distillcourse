      Summary, and the opening of the Introduction with footnotes citing Shannon
      (1948) and Fano/Kraft.
    source: 'D. A. Huffman, "A Method for the Construction of Minimum-Redundancy Codes", Proc. I.R.E. 1952'
    located: PDF page 1 (journal p. 1098)
    url: http://compression.ru/download/articles/huff/huffman_1952_minimum-redundancy-codes.pdf
    license: unknown (pre-1964 IRE journal scan; treat as publisher © — teaching use)
    quality: High-resolution embedded page bitmap (2400x3253), grayscale, clean scan, fully legible serif type.
    use: huffman-by-hand

  - id: amethod-p3-table1
    capture: research/images/amethod-p3-table1.png
    shows: >
      Table I "Optimum Binary Coding Procedure" — the 13-message worked example
      as Huffman originally presented it, a bracket-merge table across 12
      auxiliary ensembles — with Table II (final lengths and codewords,
      L_av = 3.42) and the river/water-borne-insect analogy paragraph.
    source: 'Huffman 1952'
    located: PDF page 3 (journal p. 1100)
    url: http://compression.ru/download/articles/huff/huffman_1952_minimum-redundancy-codes.pdf
    license: unknown (pre-1964 IRE scan; publisher © assumed — teaching use)
    quality: 2400x3222 grayscale scan; table rules and digits legible, the auxiliary-ensemble columns are dense.
    use: huffman-by-hand
    note: >
      Worth showing because the original presentation is a table of brackets,
      not the tree every modern textbook draws — the tree is a later invention.

  - id: amethod-p4-table3
    capture: research/images/amethod-p4-table3.png
    shows: >
      The "Generalization of the Method" section (D-ary Huffman coding, the
      (N − n0)/(D − 1) integer condition), Table III (D = 4 worked example on

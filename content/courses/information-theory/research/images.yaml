# Index of the captured real-image pool for the Information Theory course.
#
# Every file listed here already exists under research/images/. Nobody re-reads
# the source PDFs later — if a fact about an image is not written down here, it
# is lost. `use` names the lesson brief whose FIGURE PLAN carries a `source:`
# entry pointing at this id; `unassigned` means the reader surfaced it but no
# planned lesson currently needs it (keep, do not delete — later passes may).
#
# Rule of the house (docs/figures.md): sourced images are the THIRD tier. Use
# one only where a clean redrawing would falsify the point — a scan of an
# original statement, a photograph, a published plot of measured data. Anything
# schematic gets redrawn.
#
# Deleted as duplicates in this pass:
#   informationt-s2-zipf-latex-source.png — same idea as -zipf-emma (a Zipf plot
#   of real word counts); the Emma capture is the better artefact and one Zipf
#   plot is enough for this course.

schema_version: 1
images:

  # ---------------------------------------------------------------- Shannon 1948
  - id: amathematica-title-page
    capture: research/images/amathematica-title-page.png
    shows: >
      Opening page of the 1948 paper: the BSTJ reprint line ("Vol. 27,
      pp. 379-423, 623-656, July, October, 1948"), the title "A Mathematical
      Theory of Communication", the byline "By C. E. SHANNON", and the first
      paragraphs of the Introduction defining the bit and crediting Nyquist and
      Hartley.
    source: 'C. E. Shannon, "A Mathematical Theory of Communication", BSTJ 1948'
    located: page 1 (title page / opening of the Introduction)
    url: https://people.math.harvard.edu/~ctm/home/text/others/shannon/entropy/entropy.pdf
    license: publisher © (Bell System Technical Journal reprint) — teaching use
    quality: Clean vector typesetting rendered at 180 dpi, 1530x1980, fully legible.
    use: what-is-surprise

  - id: amathematica-fig1-schematic
    capture: research/images/amathematica-fig1-schematic.png
    shows: >
      Shannon's original five-box schematic of a general communication system
      (Information Source → Transmitter → Channel with Noise Source → Receiver →
      Destination), with his own caption.
    source: 'Shannon 1948'
    located: page 2, Figure 1
    url: https://people.math.harvard.edu/~ctm/home/text/others/shannon/entropy/entropy.pdf
    license: publisher © (BSTJ reprint) — teaching use
    quality: Clean 180 dpi vector render, 1530x1980, no scan artefacts.
    use: unassigned
    note: >
      The most-redrawn diagram in the field. Because every textbook already
      redraws it, the original page is what carries weight; but a lesson that
      only needs the block diagram should draw its own.

  - id: amathematica-theorem9-page16
    capture: research/images/amathematica-theorem9-page16.png
    shows: >
      The original statement of Theorem 9, the noiseless source coding theorem
      ("Let a source have entropy H … it is possible to encode the output of the
      source in such a way as to transmit at the average rate C/H − ε symbols
      per second … It is not possible to transmit at an average rate greater
      than C/H"), plus Theorem 8 above it.
    source: 'Shannon 1948'
    located: page 16, Theorem 9
    url: https://people.math.harvard.edu/~ctm/home/text/others/shannon/entropy/entropy.pdf
    license: publisher © (BSTJ reprint) — teaching use
    quality: 180 dpi vector render, fully legible.
    use: source-coding-theorem-lite

  - id: amathematica-theorem11-fig9-page22
    capture: research/images/amathematica-theorem11-fig9-page22.png
    shows: >
      The original wording of Theorem 11 (the noisy-channel coding theorem, both
      the H ≤ C and H > C branches) together with Shannon's Figure 9, the
      equivocation-versus-input-entropy diagram with the shaded ATTAINABLE
      REGION above a slope-1 line through C.
    source: 'Shannon 1948'
    located: page 22, Theorem 11 and Figure 9
    url: https://people.math.harvard.edu/~ctm/home/text/others/shannon/entropy/entropy.pdf
    license: publisher © (BSTJ reprint) — teaching use
    quality: 180 dpi vector render, diagram lines crisp, fully legible.
    use: noisy-channel-coding

  - id: amathematica-fig10-page23
    capture: research/images/amathematica-fig10-page23.png
    shows: >
      Shannon's "fan diagram" (Figure 10) — input messages left, received
      signals right, cross-lines showing the reasonable causes of each output,
      labelled with the four exponential counts 2^{H(x)T}, 2^{H(y)T},
      2^{Hy(x)T}, 2^{Hx(y)T} — beside the three-step random-coding proof
      paragraph.
    source: 'Shannon 1948'
    located: page 23, Figure 10
    url: https://people.math.harvard.edu/~ctm/home/text/others/shannon/entropy/entropy.pdf
    license: publisher © (BSTJ reprint) — teaching use
    quality: 180 dpi vector render, fully legible.
    use: unassigned
    note: The origin of the random-coding argument; redraw the counting picture, keep this as the provenance option.

  # ---------------------------------------------------------------- Huffman 1952
  - id: amethod-p1-title
    capture: research/images/amethod-p1-title.png
    shows: >
      Title page of the paper: "Proceedings of the I.R.E., September 1952"

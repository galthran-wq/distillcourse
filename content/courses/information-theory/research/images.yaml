    source: 'Huffman 1952'
    located: PDF page 4 (journal p. 1101)
    url: http://compression.ru/download/articles/huff/huffman_1952_minimum-redundancy-codes.pdf
    license: unknown (pre-1964 IRE scan; publisher © assumed — teaching use)
    quality: 2400x3245 grayscale scan, fully legible.
    use: unassigned
    note: The origin of the dummy-symbol padding rule for non-binary Huffman codes.


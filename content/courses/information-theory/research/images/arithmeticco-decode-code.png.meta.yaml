source: "Witten, Neal & Cleary, Arithmetic Coding for Data Compression, CACM 30(6), June 1987"
covers: "Page 8 (journal p.527): complete listing of arithmetic_decode.c -- start_decoding() and decode_symbol(), lines 155-215, the full canonical integer decoding routine including the cum-frequency lookup and the E1/E2/E3 bit-shifting/rescaling loop -- Figure 3 continued"
url: "PDF: https://web.stanford.edu/class/ee398a/handouts/papers/WittenACM87ArithmCoding.pdf, page 8"

why_real: >
  This page carries the original formal statement of the incremental
  parsing rule that IS the LZ78 algorithm (equation 12: x_1^n parsed into
  distinct phrases x_{n_{j-1}+1}^{n_j}, with the uniqueness/prefix
  conditions defining "incremental"), plus the integer-encoding step
  I(x) = pi(j)*alpha + I_A(x) that turns each phrase into a (pointer, symbol)
  codeword. A house-style redrawing could restate the algorithm in pseudocode,
  but the point of showing this page is that the "obvious" LZ78 dictionary
  algorithm taught today is a direct restatement of this exact 1978 formalism
  and notation - the primary-source proof text is the artifact, not a diagram.

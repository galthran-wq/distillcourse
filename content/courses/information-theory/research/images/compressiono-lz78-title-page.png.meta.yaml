why_real: >
  This is the primary-source title page of the LZ78 paper itself: authors,
  affiliations (Ziv at Bell Labs / Technion, Lempel at Sperry Research
  Center / Technion), the IEEE copyright/DOI-era stamp, and the exact
  published abstract wording. A redrawing would strip the historical
  artifact value of showing students the actual 1978 journal page that
  founded the LZ78/LZW lineage - the point is "this is the real paper,"
  which only the scan conveys.

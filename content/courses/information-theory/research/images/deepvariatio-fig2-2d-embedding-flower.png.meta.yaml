source: "Deep Variational Information Bottleneck" (Alemi, Fischer, Dillon, Murphy, ICLR 2017)
covers: "Figure 2, page 8 of PDF -- 2D Gaussian embedding visualization for three beta values"
url: "https://arxiv.org/pdf/1612.00410 (page 8)"
fetched_via: curl
notes: >
  Full-page render at 150 dpi. Three panels (a)-(c) plot the actual learned
  posteriors p(z|x) for 1000 real MNIST test images as 95%-confidence
  ellipses in a K=2 bottleneck, colored by true class, over a greyscale
  background of the trained classifier's predictive entropy at each point.
  This is genuine model output (not a schematic) -- the "flower" shape at
  small beta and the collapse into a single overlapping blob at beta=1 are
  specific findings of this trained model, not illustrative. Vector-graphic
  plot rendered to raster at capture time; legible at 150 dpi.

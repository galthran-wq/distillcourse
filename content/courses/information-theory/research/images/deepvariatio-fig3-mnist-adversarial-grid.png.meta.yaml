notes: >
  Full-page render at 150 dpi. Figure 3 is a 9-column x 3-row grid of real
  MNIST test-set "0" digit images (first column = original), each of the
  remaining 8 columns showing the actual adversarial perturbation the
  Carlini & Wagner L2 attack produced when targeting a different model
  (deterministic baseline, dropout, VIB at several beta values). Border
  color is the paper's own annotation: red = attack succeeded (0 relabeled
  as 1), green = attack failed, purple = misclassified to neither 0 nor 1.
  Figure 4 (bottom half of the same page) is a synthesizable line-plot of
  relative perturbation norms vs beta and is lower priority than Figure 3 --
  crop Figure 3 alone if only one figure is wanted.

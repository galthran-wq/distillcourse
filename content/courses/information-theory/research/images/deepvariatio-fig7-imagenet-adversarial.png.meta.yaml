notes: >
  Full-page render at 150 dpi via `npm run image -- pdf-page`. Contains real
  photographs from the ImageNet validation set (dog, guitar pick, soccer
  scene, boat harbor, etc.) with class-label and attack-success annotations
  overlaid by the authors (green=true label, red=predicted/target label,
  pink cross=attack failed to hit target). Whole page captured, not yet
  cropped to the individual figure region -- crop before use in a lesson.
  Panel (a): 30 correctly-classified originals. (b): adversarial examples vs
  the VIB (beta=0.01) network -- 13/30 attacks fail to reach the "soccer
  ball" target (pink crosses). (c): same attack vs deterministic baseline on
  precomputed features -- always succeeds. (d): same attack vs full
  unmodified Inception ResNet V2 -- always succeeds.

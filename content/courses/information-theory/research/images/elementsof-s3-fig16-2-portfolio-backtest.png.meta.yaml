source: "Elements of Information Theory, 2nd edition, Thomas M. Cover and Joy A. Thomas (Wiley, 2006)"
shows: >
  Figure 16.2: a real backtest — value S_n(b) of $1 invested on day 1 across
  a 14-year period (ending 2004) in a constant-rebalanced portfolio of
  Hewlett-Packard and Altria (Philip Morris) stock, plotted as a function of
  the fixed proportion b held in HPQ. Curve peaks at b ~ 0.51 (~51% HP / 49%
  Altria) reaching a growth factor of 18.7x, versus 11.8x (all HP) and 11.5x
  (all Altria) at the endpoints; the book's universal-portfolio algorithm
  (no hindsight) achieves 15.7x on the same data.
located: "book p. 643 (PDF p. 669 of elementsof.pdf), Figure 16.2, Section 16.7 Universal Portfolios"
why_real: >
  This is measured market data (real HP and Altria price relatives over an
  actual 14-year window), not an illustrative sketch -- the specific numbers
  (11.8x, 11.5x, 18.7x, 15.7x, b*~0.51) are the book's own reported empirical
  result and the whole pedagogical point (diversification beating either
  single stock in hindsight) lives in the exact shape/peak of this curve. A
  redrawing would need to either fabricate the underlying HP/Altria price
  series or just reproduce this same curve -- better to use the original.

source: "The Information Bottleneck Problem and Its Applications in Machine Learning" by Ziv Goldfeld and Yury Polyanskiy (2020)
covers: Page 28 of the survey, rendered whole at 600 dpi — carries Figure 11 as
  actually printed, captioned "Fig. 11 [Fig. 1 from [13]]" and reprinted from
  Goldfeld, van den Berg, Greenewald, Melnyk, Nguyen, Kingsbury & Polyanskiy,
  "Estimating information flow in neural networks" (ICML 2019), their Fig. 1.
url: PDF page render from https://arxiv.org/pdf/2004.14941, page 28
fetched_via: npm run image -- pdf-page … --dpi 600
notes: >
  Higher-resolution re-render of the same page as
  theinformati--fig11-quantization-misest (200 dpi). The figure is vector art
  with no separately embedded raster, so pdfimages extracts nothing and a page
  render is the only route to it; at 200 dpi the panel titles ("cell size =
  0.0001") and the five-entry layer legend are too soft to survive the crop to
  a ~2400px web figure. At 600 dpi the whole four-panel strip is crisp. The
  figure block occupies roughly x 600–4500, y 575–1290 of the 5100×6600 page;
  the printed caption, the page number 28 and the body text all fall below and
  above it, so a single rectangular crop takes the figure alone. This render is
  what estimating-mutual-information/figures/bin-size-artifact.png is cut from.

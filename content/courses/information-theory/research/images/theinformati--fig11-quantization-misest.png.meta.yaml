source: "The Information Bottleneck Problem and Its Applications in Machine Learning" by Ziv Goldfeld and Yury Polyanskiy (2020)
covers: Fig. 11 of the survey (p. 28), captioned "[Fig. 1 from [13]]" -- reprinted
  from Goldfeld, van den Berg, Greenewald, Melnyk, Nguyen, Kingsbury & Polyanskiy,
  "Estimating information flow in neural networks" (ICML 2019), their Fig. 1.
url: PDF page render from https://arxiv.org/pdf/2004.14941, page 28 (rendered whole
  page -- this figure is a vector plot with no separately embedded raster, so
  pdfimages found nothing extractable and only the page render is available)
fetched_via: npm run image -- capture
notes: >
  Whole-page capture; the figure occupies roughly the middle third of the page
  (4-panel plot of I(X;Q_m[T_l]) vs. epoch for quantization cell sizes 10^-4,
  10^-3, 10^-2, 10^-1). Shows that the measured "mutual information" trajectory
  depends entirely on the arbitrary quantization bin size chosen, converging to
  H(X)=ln(2^12)~8.3 for tiny bins -- this is the paper's key debunking evidence
  that estimator artifacts, not true MI, drove the earlier "compression" claims.
  Needs cropping to just the 4-panel figure block before use; a redrawing would
  need the exact same synthetic data replotted from [13] to be faithful, so the
  original is preferable. Full page render is legible at 200dpi.

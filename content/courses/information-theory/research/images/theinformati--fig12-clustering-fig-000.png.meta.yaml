source: "The Information Bottleneck Problem and Its Applications in Machine Learning" by Ziv Goldfeld and Yury Polyanskiy (2020)
covers: Fig. 12 of the survey (p. 31), an original figure (not reprinted) built by
  Goldfeld/Polyanskiy from data in Goldfeld, van den Berg, Greenewald, Melnyk,
  Nguyen, Kingsbury & Polyanskiy, "Estimating information flow in neural networks"
  (ICML 2019), their Fig. 5(a).
url: PDF page render/extract from https://arxiv.org/pdf/2004.14941, page 31
fetched_via: npm run image -- capture
notes: >
  Left: I(X;T_l^(sigma)) (rate-optimal estimator under injected Gaussian noise) and
  train/test loss vs. epoch for a noisy version of the [6] network, arrows marking
  4 epochs. Right: 4 scatter plots of the 5th hidden layer's 2-D representation at
  those exact epochs, colored by class, showing equilabeled points visibly
  clustering together as training progresses -- this is the direct visual evidence
  for the paper's central "compression = clustering" resolution of the whole
  compression-phase controversy. Clean embedded raster, full color.

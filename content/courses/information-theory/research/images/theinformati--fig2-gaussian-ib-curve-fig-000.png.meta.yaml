source: "The Information Bottleneck Problem and Its Applications in Machine Learning" by Ziv Goldfeld and Yury Polyanskiy (2020)
covers: Fig. 2 of the survey (p. 10), captioned "[Adapted from Fig. 3 of [25]]" --
  adapted from Chechik, Globerson, Tishby & Weiss, "Information bottleneck for
  Gaussian variables" (JMLR 2005), their Fig. 3.
url: PDF page render/extract from https://arxiv.org/pdf/2004.14941, page 10
fetched_via: npm run image -- capture
notes: >
  The exact Gaussian IB curve (blue) with suboptimal fixed-rank curves (dashed) and
  the critical beta_i* points marked by red circles -- this is the one fully solved,
  closed-form instance of the IB problem, so this specific published curve is the
  concrete numeric object (computed from eigenvalues lambda=0.1,0.5,0.7,0.9) that
  grounds Theorem 1 in the text. A redrawing could reproduce the shape but not
  faithfully without recomputing; keeping the original avoids introducing errors.
  Note: legend/axis labels are partially cropped at top-left in this raster extract
  (cut off before "Sigma log lambda_i" label) -- the full labels are visible in
  context on PDF page 10 if a cleaner crop is needed later.

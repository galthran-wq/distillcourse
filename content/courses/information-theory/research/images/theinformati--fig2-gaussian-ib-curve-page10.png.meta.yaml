source: "The Information Bottleneck Problem and Its Applications in Machine Learning" by Ziv Goldfeld and Yury Polyanskiy (arXiv:2004.14941v2, 2020)
covers: full render of PDF page 10, which carries Fig. 2 (the Gaussian IB curve) and its caption
url: https://arxiv.org/pdf/2004.14941, page 10
fetched_via: npm run image -- pdf-page … 10 --dpi 450
notes: >
  Re-capture requested by the quality note on
  theinformati--fig2-gaussian-ib-curve-fig-000.png. The embedded bitmap
  extracted from the page holds only the plotted curves: both axis labels
  (I(X;T), I(T;Y), Sigma log lambda_i) and the legend are drawn as page text
  on top of it, the suboptimal branches show as thin solid blue instead of
  the dashed green/red/orange the caption names, and the top-left label is
  cut. This 450 dpi page render carries the complete figure — axis labels,
  legend box, dashed colour-coded rank-1/2/3 branches, the four red critical
  points and the black tangent of slope 1 - lambda_1. Used to cut
  lessons/information-bottleneck/figures/gaussian-ib-curve.png.

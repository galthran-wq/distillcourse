source: "The Information Bottleneck Problem and Its Applications in Machine Learning" by Ziv Goldfeld and Yury Polyanskiy (2020)
covers: One panel (β=10^-3) of Fig. 4 of the survey (p. 14), captioned "[Fig. 2 from
  [31]]" -- reprinted from Alemi, Fischer, Dillon & Murphy, "Deep variational
  information bottleneck" (ICLR 2017), their Fig. 2.
url: PDF page render/extract from https://arxiv.org/pdf/2004.14941, page 14
fetched_via: npm run image -- capture
notes: >
  Real 2-D VIB embedding of 10^3 MNIST test images, colored by true digit class,
  with 95%-confidence Gaussian ellipses per point and background grayscale showing
  classifier entropy. This is panel (a) of a 3-panel figure (β=10^-3, 10^-1, 1)
  showing how larger beta collapses/overlaps the classes -- only this one panel
  was kept as the representative capture; panels (b) and (c) can be re-extracted
  from the same PDF page (page 14) if the lesson wants the full beta-sweep triptych.
  Clean embedded raster, full color, no scan artifacts.

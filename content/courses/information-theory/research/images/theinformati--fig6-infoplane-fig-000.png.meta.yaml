source: "The Information Bottleneck Problem and Its Applications in Machine Learning" by Ziv Goldfeld and Yury Polyanskiy (2020)
covers: Fig. 6 of the survey (p. 20), captioned "[Fig. 3 from [6]]" -- i.e. reprinted
  verbatim from Shwartz-Ziv & Tishby, "Opening the black box of deep neural networks
  via information" (arXiv:1703.00810, 2017), their Fig. 3.
url: PDF page render/extract from https://arxiv.org/pdf/2004.14941, page 20
fetched_via: npm run image -- capture (poppler pdfimages/pdftoppm under the hood)
notes: >
  This IS the canonical "information plane" plot that the entire IB-for-deep-learning
  literature is built around: I(X;T_l) on the x-axis, I(T_l;Y) on the y-axis, one
  colored trajectory per hidden layer of a 12-10-7-5-4-3-2 tanh classifier, epoch
  encoded by a black-to-yellow colormap, green dots/line marking the fitting-to-
  compression transition per layer. High-resolution clean extract (embedded raster,
  not a page-scan artifact), full color preserved.

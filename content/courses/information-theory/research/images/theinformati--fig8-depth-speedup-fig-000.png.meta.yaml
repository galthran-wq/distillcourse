notes: >
  Real information-plane trajectory for the deepest (6-hidden-layer) of six
  architectures of increasing depth trained on the same synthetic task; this is
  the evidence behind the (now-disputed) "computational benefit of depth" claim.
  Only the deepest-network panel was kept as representative; the other 5 depth
  panels are on the same PDF page (23) if needed. Clean embedded raster, full color.

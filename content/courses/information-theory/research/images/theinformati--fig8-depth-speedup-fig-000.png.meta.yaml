source: "The Information Bottleneck Problem and Its Applications in Machine Learning" by Ziv Goldfeld and Yury Polyanskiy (2020)
covers: One panel (six hidden layers, deepest architecture) of Fig. 8 of the survey
  (p. 23), captioned "[Fig. 5 from [6]]" -- reprinted from Shwartz-Ziv & Tishby,
  "Opening the black box of deep neural networks via information" (arXiv:1703.00810,
  2017), their Fig. 5.
url: PDF page render/extract from https://arxiv.org/pdf/2004.14941, page 23

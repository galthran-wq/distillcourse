notes: >
  Four-panel information-plane comparison (tanh vs ReLU, synthetic task vs MNIST)
  that is the central piece of counter-evidence in the whole survey: double-sided
  saturating nonlinearities (tanh, top-right / bottom-right) show the "compression"
  elbow; ReLU networks (top-left / bottom-left) do not compress at all, only the
  final sigmoidal layer does. This is the critical rebuttal figure the "balancing"
  framing of the survey hinges on. Clean high-res extract, full color.

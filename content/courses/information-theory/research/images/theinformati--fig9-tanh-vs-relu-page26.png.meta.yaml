source: "The Information Bottleneck Problem and Its Applications in Machine Learning" by Ziv Goldfeld and Yury Polyanskiy (2020)
covers: Page 26 of the survey, rendered whole at 500 dpi — carries Figure 9 as
  actually printed, captioned "Fig. 9 [Fig. 1 from [9]]" and reprinted from
  Saxe, Bansal, Dapello, Advani, Kolchinsky, Tracey & Cox, "On the information
  bottleneck theory of deep learning" (ICLR 2018), their Fig. 1.
url: PDF page render from https://arxiv.org/pdf/2004.14941, page 26
fetched_via: npm run image -- pdf-page … --dpi 500
notes: >
  Companion to theinformati--fig9-tanh-vs-relu-fig-000. The embedded bitmap that
  pdfimages extracts (fig-000) is the raw Saxe et al. artwork *before* the survey
  masks it: it is cropped at the left, so the "A"/"C" panel letters and the left
  column's y-axis labels are missing, and it carries the original I(X;T) / I(T;Y)
  axis text that the survey covers over. The survey overlays its own LaTeX axis
  labels, I(X;Q_m[T_l]) and I(Q_m[T_l];Y), which is what the reader of the paper
  sees. This page render is therefore the honest, complete copy of Figure 9 and is
  what the lesson figure is cut from. The printed caption also settles the column
  order: tanh left, ReLU right; synthetic task top, MNIST bottom — the opposite of
  what the fig-000 sidecar note guessed.

notes: >
  Shows, left to right: (1) a real photograph from the Kodak dataset (a lighthouse
  scene), (2) a visualization of a subset of the learned latent representation y
  from the factorized-prior model — visibly clustered/structured around edges and
  textures, (3) the per-element standard deviations sigma-hat predicted by the
  hyperprior model for the same latents, (4) the latents y divided elementwise by
  sigma-hat, which visibly "whitens" the structure. This is the paper's core
  empirical motivation for the hyperprior: it is real inference output from a real
  trained model on a real photograph, not a schematic — a redrawing could not
  claim to show what the network actually produced. Crop should isolate the row of
  four image panels near the top of the page (below the header, above the caption).

notes: >
  Two stacked rate-distortion plots aggregated over the Kodak dataset: top is PSNR
  (dB) vs bits-per-pixel, bottom is MS-SSIM (converted to dB) vs bpp. Each plot
  compares the paper's hyperprior and factorized-prior models (trained for MSE or
  MS-SSIM) against BPG, JPEG, Ballé (2017), Theis (2017), and Rippel and Bourdev
  (2017). This is measured experimental data, the paper's headline result — a
  redrawing would need to fabricate curve shapes/crossing points that only the
  authors' actual measurements can supply. Legible vector text and lines at 200
  dpi; crop out the two stacked plots (skip the surrounding caption/margin).

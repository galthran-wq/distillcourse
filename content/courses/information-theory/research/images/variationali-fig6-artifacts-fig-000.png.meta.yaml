notes: >
  Photograph of a WWII-era propeller plane (\"Sky Shooter\" nose art) reconstructed
  at 0.1864 bpp, PSNR=27.99, MS-SSIM=0.9803, from a model trained with an MS-SSIM
  distortion loss. Paired with fig-001 (MSE-trained reconstruction of the same
  photo at 0.1932 bpp) as the paper's qualitative case study of how the choice of
  distortion metric reallocates detail: the MS-SSIM model spends bits on the
  low-contrast grass and loses the high-contrast text on the fuselage, while the
  MSE model does the reverse. This is an actual compressed/decompressed photograph
  produced by the trained codec — the entire pedagogical point is the specific
  artifact pattern in real pixels, which a redrawing cannot reproduce. Clean, full
  resolution embedded bitmap, color, no visible scan artifacts.

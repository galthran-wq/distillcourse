notes: >
  Plots the measured amount of side information (bits spent encoding z-hat, the
  hyperprior) as a function of total bit rate, averaged over the Kodak set: side
  information stays below ~0.025 bpp even at the highest total rates (~1.7 bpp) —
  the paper's concrete number backing the claim that side information is "cheap."
  Real measured quantity from the trained model, not illustrative; a redrawing
  would have to invent the exact curve shape. Legible vector plot at 200 dpi;
  crop the top-left plot only, leaving the running body text below.

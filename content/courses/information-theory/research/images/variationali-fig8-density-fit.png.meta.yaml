notes: >
  Shows the paper's non-parametric, cumulative-based univariate density model
  (K=3) converging (gray intermediate fits) onto a target Gaussian-mixture density
  (dashed/solid target curve) — the actual numerical fit the authors ran to
  validate the density-model appendix (6.1), not a generic illustration. Lower
  priority than figures 2/5/6/7: it is a toy synthetic fit rather than a result on
  real images, so a house-style redraw of "here is a flexible learned density"
  would lose less of the point than the other candidates — include only if the
  lesson specifically covers the appendix's cumulative-parameterized density
  trick. Legible vector plot at 200 dpi.

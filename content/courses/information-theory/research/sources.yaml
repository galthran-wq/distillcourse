# Research canon for the Information Theory course.
# Originally retrofitted after hand-seeding; expanded July 2026 by a
# source-reading swarm, first for the applications module and then for the
# scope expansion (channel coding, rate-distortion, Kolmogorov complexity,
# neural coding, thermodynamics of information). Chapter/section pointers
# verified against the actual texts (see per-lesson briefs for exact
# locations). "role" = which lessons/modules the source grounds.

sources:
  - title: "A Mathematical Theory of Communication"
    author: "C. E. Shannon"
    url: "https://people.math.harvard.edu/~ctm/home/text/others/shannon/entropy/entropy.pdf"
    kind: primary-paper
    role: >
      The origin. Grounds surprisal and entropy (Part I, §6, and fig. 7, the
      binary entropy curve), the noiseless source coding theorem (Theorem 9,
      with the typical-set/AEP argument in Appendix 3), the
      approximations-to-English / redundancy discussion (§3), equivocation =
      conditional entropy (Part II, §12), and the noisy-channel coding theorem
      and its converse (Part II, §13, Theorem 11) with the BSC/erasure
      examples and the Hamming (7,4) code (§17). Touches every classical
      module.
    access: >
      Free. Corrected reprint PDF at the Harvard mirror above (verified 200).
      Original scans also free at Internet Archive:
      https://archive.org/details/bstj27-3-379 (Part I, pp. 379-423) and
      https://archive.org/details/bstj27-4-623 (Part II, pp. 623-656).
      Full 55-page paper read for this dossier (all parts and appendices).

  - title: "Elements of Information Theory, 2nd ed."
    author: "T. M. Cover, J. A. Thomas"
    url: "https://onlinelibrary.wiley.com/doi/book/10.1002/047174882X"
    kind: textbook
    role: >
      The rigorous reference. Grounds entropy/relative-entropy/mutual-
      information and the data-processing inequality (ch. 2: DPI §2.8,
      sufficient statistics §2.9, Fano §2.10), entropy rate and English
      (ch. 4 and §6.4/§6.6), the coding module (ch. 5: Kraft §5.2, optimal-code
      bounds §5.3-5.4, Huffman §5.6-5.8), channel capacity and the coding
      theorem (ch. 7: BSC/BEC §7.1, capacity §7.1-7.3, joint typicality and the
      theorem §7.6-7.7, Fano converse §7.9, Hamming §7.11), rate distortion
      (ch. 10: R(D) definitions §10.2, Bernoulli/Gaussian §10.3), maximum
      entropy (ch. 12), and Kolmogorov complexity / MDL (ch. 14). The
      wrong-code theorem (§5.4) is the spine linking cross-entropy, KL, and
      compression.
    access: >
      Not free / paywalled (Wiley; print + library). No legal full-text PDF.
      ToC, theorem statements, and 2nd-edition chapter numbering verified via
      publisher ToC and the official solutions manual; consult a library copy
      for the prose. Note 1st/2nd edition swap of ch. 11/12.

  - title: "Information Theory, Inference, and Learning Algorithms"
    author: "D. J. C. MacKay"
    url: "https://www.inference.org.uk/mackay/itila/"
    kind: textbook
    role: >
      The intuition-first reference and the one free full textbook. Grounds
      surprisal/entropy (ch. 2, §2.4), Gibbs' inequality (§2.6), the source
      coding theorem via typical sets (ch. 4), symbol codes = Kraft + Huffman
      (ch. 5), stream/arithmetic coding = compression-as-prediction (ch. 6),
      joint/conditional entropy + mutual information (ch. 8), channel capacity
      and the noisy-channel coding theorem (ch. 9-10, BSC/Z/erasure examples,
      joint-typicality proof), and Bayesian model comparison / Occam's razor as
      the MDL dual (ch. 28). Its fig. 8.1 vs 8.2 warning about Venn-style
      entropy diagrams informs our figures.
    access: >
      Free full PDF (verified 200): https://www.inference.org.uk/itprnn/book.pdf
      Contents page: https://www.inference.org.uk/mackay/itila/toc.html
      Author permits download for personal use; do not redistribute the PDF.

  - title: "Lecture Notes on Information Theory"
    author: "Y. Polyanskiy, Y. Wu"
    url: "https://people.lids.mit.edu/yp/homepage/data/itlectures_v6.pdf"
    kind: lecture-notes
    role: >
      Modern graduate reference for the channels and rate-distortion material.
      Grounds channel capacity as an information radius / saddle point (ch. 4),
      the noisy-channel coding theorem via achievability bounds and the Fano
      converse (ch. 14-16, BSC/BEC examples §16.4), rate-distortion (ch. 23-25:
      R(D) definition, Bernoulli/Gaussian closed forms §25.1, Blahut-Arimoto),
      and the finite-blocklength / dispersion viewpoint that gives the
      capacity threshold its sharp reading (ch. 20). Used to cross-check
      statements and for the channel-coding-threshold demo behaviour.
    access: >
      Free. MIT 6.441 / UIUC ECE 563 course notes (~300 pp.), OCW mirror also
      hosts a copy: https://ocw.mit.edu/courses/6-441-information-theory-spring-2016/
      Full notes read for this dossier with heaviest coverage on ch. 14-25.

  - title: "Prediction and Entropy of Printed English"
    author: "C. E. Shannon"
    url: "https://archive.org/details/bstj30-1-50"
    kind: primary-paper
    role: >
      The single source for the entropy-of-english lesson: the guessing-game
      method that turns human next-letter prediction into upper and lower
      bounds on the per-letter entropy rate of English (~1 bit/letter,
      redundancy ~75% with 100-letter context). Its "reduced text" predictive
      transducer (fig. 2) also foreshadows compression-is-prediction.
    access: >
      Free. Internet Archive scan (verified 200), BSTJ 30, pp. 50-64, 1951.
      PDF mirror: https://www.princeton.edu/~wbialek/rome/refs/shannon_51.pdf
      Full 15-page paper read for this dossier.

  - title: "Language Modeling Is Compression"
    author: "G. Delétang, A. Ruoss, et al. (Google DeepMind)"
    url: "https://arxiv.org/abs/2309.10668"
    kind: primary-paper
    role: >
      The modern ML-tail anchor for compression-is-prediction: §2 states the
      predictor <-> lossless-compressor equivalence precisely (arithmetic
      coding; Eq. 2 cross-entropy = expected code length) and the experiments
      measure a 70B language model as a general-purpose compressor (ImageNet
      to 43.4%, LibriSpeech to 16.4% of raw, beating PNG and FLAC). §3.3's
      parameter-adjusted (two-part-code) compression rate grounds the
      scaling-laws payoff of the minimum-description-length lesson. §2's
      "Universal Coding" ties the ceiling to Kolmogorov complexity / Solomonoff.
    access: >
      Free. arXiv:2309.10668 (verified 200), ICLR 2024. Full 17-page paper
      read incl. appendices; Table 1/2 cell values interleaved in extraction —
      spot-check against the PDF page image before quoting individual cells.

  - title: "Kolmogorov Complexity and Algorithmic Randomness"
    author: "A. Shen, V. A. Uspensky, N. Vereshchagin"
    url: "https://www.lirmm.fr/~ashen/kolmbook-eng-scan.pdf"
    kind: textbook
    role: >
      Primary source for the Kolmogorov-complexity lesson: the informal
      overview and ch. 1 build K(x) as the shortest-description length; the
      Solomonoff-Kolmogorov invariance theorem (K well-defined up to +O(1));
      the counting argument for incompressibility (ch. 1); non-computability of
      K via Berry's paradox and its Godel-incompleteness use; ch. 7 relates
      complexity to Shannon entropy (C(x)/N -> H); ch. 14.3 states the two-part
      code = MDL principle. The overview and ch. 7/14 are the lesson-ready
      prose; the theorem/proof body is deep background.
    access: >
      Free full PDF from the author's page (verified 200); published by AMS
      2017. Full text available; overview + ch. 1, 7, 14 read for this dossier.

  - title: "End-to-end Optimized Image Compression"
    author: "J. Ballé, V. Laparra, E. P. Simoncelli"
    url: "https://arxiv.org/abs/1611.01704"
    kind: primary-paper
    role: >
      The modern payoff for the rate-distortion lesson: a learned lossy image
      codec that jointly optimizes rate (entropy of the quantized code) and
      distortion, i.e. minimizes R + lambda*D directly. §1-3 give the
      rate-distortion framing, the additive-uniform-noise trick for
      differentiable quantization, the exact equivalence of the R + lambda*D
      objective to a variational-autoencoder loss (§3.1), and the empirical
      MS-SSIM/PSNR gains over JPEG/JPEG2000. Grounds the "rate-distortion made
      trainable" section; recreate the R-D plane (their fig. 2) schematically.
    access: >
      Free. arXiv:1611.01704 (verified 200), ICLR 2017. Full paper + appendix
      read for this dossier.

  - title: "Information Theory and Neural Coding"
    author: "A. Borst, F. E. Theunissen"
    url: "https://www.nature.com/articles/nn1199_947"
    kind: review-paper
    role: >
      Primary source for the neural-coding lesson. Defines the mutual
      information a spike train carries about a stimulus, the three equivalent
      decompositions I(R,S) = H(R) - H(R|S) = H(S) - H(S|R) = H(R)+H(S)-H(R,S)
      (Box 2), the direct estimation method (H(R) and H(R|S) from binarized
      spike trains), and coding efficiency = transmitted information / channel
      capacity. Table 2 gives the cross-species numbers (fly H1, monkey MT,
      etc.): ~1 bit/spike, efficiency stimulus-dependent. Continuous
      Gaussian-channel bound methods are present but out of our scope; use the
      discrete direct method and cite the numbers, do not re-derive continuous
      capacity.
    access: >
      Paywalled at Nature (Nat. Neurosci. 2, 947-957, 1999; DOI 10.1038/14731).
      Author/preprint PDFs circulate; abstract + figure/table structure and the
      boxed equations verified. Cite bits/spike and efficiency figures from
      Table 2 as the source's, not as universal constants.

  - title: "Thermodynamics of Information"
    author: "J. M. R. Parrondo, J. M. Horowitz, T. Sagawa"
    url: "https://www.nature.com/articles/nphys3230"
    kind: review-paper
    role: >
      Primary source for the thermodynamics-of-information lesson: Maxwell's
      demon and its resolution, the Szilard engine (W = kT ln 2 from one bit),
      Landauer's principle (erasing a bit costs kT ln 2), and the feedback
      second law W >= Delta F - kT (ln 2) I(X;M) that prices measured
      information in mutual-information units (Sagawa-Ueda). Grounds every
      computation in the lesson. Landauer 1961 and Bennett 1982 are the
      original results this review synthesizes.
    access: >
      Nature Physics 11, 131-139 (2015); paywalled, but widely mirrored (author
      PDFs, arXiv-adjacent). A companion 2023 survey by Parrondo
      (arXiv:2306.12447, "Thermodynamics of Information", Encyclopedia of
      Condensed Matter Physics 2nd ed.) is open access and was read for this
      dossier; the 2015 Nature Physics review is the citable primary.

  - title: "Information Theory and Statistical Mechanics"
    author: "E. T. Jaynes"
    url: "https://bayes.wustl.edu/etj/articles/theory.1.pdf"
    kind: primary-paper
    role: >
      Primary source for the maximum entropy principle: §2 derives the
      exponential/partition-function form of the max-ent distribution under
      expectation constraints; §3 recovers the Boltzmann distribution and all
      of equilibrium statistical mechanics as inference; §6 states max-ent as
      "a method of reasoning", not a law of physics. Grounds
      max-entropy-principle and, with the thermodynamics review, the physics
      applications.
    access: >
      Free. Phys. Rev. 106, 620-630 (1957); image-only scan at the WUSTL
      Jaynes archive (verified; 11 pages, read page-by-page). Companion paper
      II (Phys. Rev. 108, 171) not used.

  - title: "A Tutorial Introduction to the Minimum Description Length Principle"
    author: "P. Grünwald"
    url: "https://arxiv.org/abs/math/0406077"
    kind: tutorial-paper
    role: >
      Primary source for the MDL lesson: ch. 1 gives the crude two-part
      principle L(H)+L(D|H) with the three-bit-sequences and polynomial
      examples; ch. 2 §2.2 restates the Kraft/codelength-probability
      correspondence, §2.4 works crude MDL on Markov/Bernoulli models
      (the (k/2) log n parameter cost), §2.6 states refined MDL/NML and the
      Fisher-information complexity expansion (state only), §2.9-2.10 give
      the MDL-vs-BIC correction and honest failure modes. §1.2.1 and §2.9.4
      tie ideal MDL to Kolmogorov complexity (the kolmogorov-complexity lesson
      is its parent).
    access: >
      Free. arXiv:math/0406077 (80 pp.); appeared as ch. 1-2 of "Advances in
      Minimum Description Length", MIT Press 2004. Full text read.

  - title: "The Information Bottleneck Method"
    author: "N. Tishby, F. C. Pereira, W. Bialek"
    url: "https://arxiv.org/abs/physics/0004057"
    kind: primary-paper
    role: >
      Primary source for the information-bottleneck lesson: §1-2.1 recap
      rate-distortion and its flaw (a hand-picked distortion function); §3.1
      defines the objective L = I(X;T) - beta I(T;Y) with the data-processing
      bound I(T;Y) <= I(X;Y); §3.2 Theorem 4 shows the optimal encoder's
      effective distortion is an emergent KL divergence; §3.4 introduces the
      information plane and the beta-parameterized frontier.
    access: >
      Free. arXiv:physics/0004057 (16 pp., 1999). Full text read. Contains
      zero figures — all lesson visuals must be built from the math.

  - title: "Representation Learning with Contrastive Predictive Coding"
    author: "A. van den Oord, Y. Li, O. Vinyals (DeepMind)"
    url: "https://arxiv.org/abs/1807.03748"
    kind: primary-paper
    role: >
      Primary source for the InfoNCE lesson: §2.3 + Appendix A.1 define the
      InfoNCE loss, prove the optimal critic recovers the density ratio
      p(y|x)/p(y), and derive I(X;Y) >= log N - L_N. §3 gives the
      cross-modal empirical validation (audio/vision/text/RL) cited as the
      applications payoff.
    access: >
      Free. arXiv:1807.03748 (2018/19). Full text read incl. Appendix A.1
      derivation (eqs. 6-11).

  - title: "Channel Polarization / Polar Codes"
    author: "E. Arıkan"
    url: "https://arxiv.org/abs/0807.3917"
    kind: primary-paper
    role: >
      Optional modern payoff for noisy-channel-coding: the first explicit,
      low-complexity, provably capacity-achieving code construction for
      symmetric binary-input channels — the theoretical origin of the polar
      codes later adopted for 5G control channels. Cited in the coding-theorem
      lesson as "constructive codes that reach the Shannon limit exist"; the
      paper predates and does not mention 5G, so attribute the 5G framing
      elsewhere.
    access: >
      Free. arXiv:0807.3917 (IEEE Trans. Inf. Theory, 2009). Full paper read;
      only §I (overview, polarization plot fig. 4) is lesson-relevant.

  - title: "Visual Information Theory"
    author: "C. Olah"
    url: "https://colah.github.io/posts/2015-09-Visual-Information/"
    kind: web-resource
    role: >
      Figure-composition inspiration only (never quoted as a source of fact):
      the canonical area/overlap picture for entropy, cross-entropy, KL, and
      mutual information built visually from a codeword-space budget. Informs
      the figure plans for entropy, KL, cross-entropy, and mutual-information
      lessons. Recreate ideas in the house style; do not copy the drawings.
    access: >
      Free, live (verified 200). Distill-adjacent essay, 2015.

  - title: "Information-Theoretic Analysis of Generalization Capability of Learning Algorithms"
    author: "A. Xu, M. Raginsky"
    url: "https://arxiv.org/abs/1705.07809"
    kind: primary-paper
    role: >
      Not a lesson of its own; cited as a further-reading aside in the
      data-processing-inequality and information-bottleneck lessons. Establishes
      gen(mu, P_{W|S}) <= sqrt(2 sigma^2 I(S;W) / n): the mutual information
      between a learning algorithm's training set and its output hypothesis
      upper-bounds its expected overfitting — an information-theoretic
      generalization bound resting on the data-processing inequality.
    access: >
      Free. arXiv:1705.07809 (NeurIPS 2017). Full paper + appendices read.

  - title: "Transmission of Information"
    author: "R. V. L. Hartley"
    url: "https://archive.org/details/bstj7-3-535"
    kind: primary-paper
    role: >
      Historical: the pre-Shannon logarithmic measure of information and the
      base-10 unit (the hartley). Grounds one paragraph of the surprisal
      lesson (units), nothing more.
    access: >
      Free. BSTJ 7, pp. 535-563, 1928; Internet Archive scan (BSTJ vol. 7).

  # --- Added in the scope expansion (practical compression, code construction,
  # --- the IB controversy, learned codecs). Read in full by the source swarm;
  # --- see research/images.yaml for the captures taken from each.

  - title: "A Method for the Construction of Minimum-Redundancy Codes"
    author: "D. A. Huffman"
    url: "http://compression.ru/download/articles/huff/huffman_1952_minimum-redundancy-codes.pdf"
    kind: primary-paper
    role: >
      The origin of Huffman coding, and the grounding for huffman-by-hand.
      Four journal pages: the prefix ("instantaneous") requirement with its
      ambiguous-code counterexample; the three derived necessary conditions on
      an optimal code, each proved by an exchange argument (the ancestor of the
      modern greedy-correctness proof); the bottom-up merge procedure itself;
      the canonical 13-message worked example (Tables I-II, L_av = 3.42); and
      the D-ary generalization with the (N - n0)/(D - 1) integer padding rule.
      Also supplies the river/water-borne-insect analogy for why the 0/1
      labelling at each merge is arbitrary.
    access: >
      Free scan (Proc. I.R.E. 40(9), Sept. 1952, pp. 1098-1101). Page 1 has an
      OCR text layer; the technical pages were read from 300 dpi renders.
      Captures: amethod-p1-title, amethod-p3-table1, amethod-p4-table3.

  - title: "A Universal Algorithm for Sequential Data Compression"
    author: "J. Ziv, A. Lempel"
    url: "https://courses.cs.duke.edu/spring03/cps296.5/papers/ziv_lempel_1977_universal_algorithm.pdf"
    kind: primary-paper
    role: >
      LZ77, the direct ancestor of DEFLATE/gzip/PNG and the first half of
      dictionary-coding. §II defines the sliding-window buffer, the
      reproducible extension and its pointer, the fixed-length codeword
      (pointer, length, next symbol) with L_c = 1 + ceil(log(n - L_s)) +
      ceil(log L_s), and works a complete ternary example (L_s = 9, n = 18)
      through four encoding cycles. §III gives the non-probabilistic "source"
      model and the compression-ratio bounds; Theorem 2 is the universality
      result. The introduction states the scheme's own chief weakness —
      susceptibility to error propagation — which is why shipped formats wrap
      it in framing and checksums.
    access: >
      Free PDF (IEEE Trans. Inf. Theory IT-23(3), May 1977, pp. 337-343).
      Pages 2-6 have no text layer; read from 200 dpi renders. Capture:
      auniversal-title-page.

  - title: "Compression of Individual Sequences via Variable-Rate Coding"
    author: "J. Ziv, A. Lempel"
    url: "https://www.philippe-fournier-viger.com/spmf/lz78.pdf"
    kind: primary-paper
    role: >
      LZ78, the second half of dictionary-coding and the ancestor of LZW.
      Equation (12) is the incremental-parsing definition (each new phrase is
      the shortest unseen extension of an earlier phrase, coded as a
      (pointer, symbol) pair) — the literal origin of dictionary coding as
      taught today. Theorem 1 lower-bounds compression by the LZ phrase count
      c(x); Theorem 2 is the coding theorem; Theorem 3 identifies
      compressibility with finite-state complexity; Theorem 4 collapses both to
      Shannon entropy for ergodic sources. The u(k) construction (all binary
      words of each length, concatenated) is an incompressible sequence with a
      one-line description — a ready-made counterexample for
      kolmogorov-complexity.
    access: >
      Free PDF (IEEE Trans. Inf. Theory IT-24(5), Sept. 1978, pp. 530-536).
      Text layer only on page 1; the rest read via OCR of 300 dpi renders, so
      cross-check symbols against the page images before quoting equations.
      Captures: compressiono-lz78-title-page,
      compressiono-lz78-incremental-parsing.

  - title: "Arithmetic Coding for Data Compression"
    author: "I. H. Witten, R. M. Neal, J. G. Cleary"
    url: "https://web.stanford.edu/class/ee398a/handouts/papers/WittenACM87ArithmCoding.pdf"
    kind: primary-paper
    role: >
      The reference implementation paper and the spine of arithmetic-coding.
      Opens with the argument this course reuses: Huffman is optimal only for
      dyadic probabilities, and its worst case is a near-certain symbol that
      carries negligible information yet costs a full bit. Gives the decimal
      worked example ("eaii!" narrowing to [0.23354, 0.2336)), the idealized
      encode/decode pseudocode, complete working C, the finite-precision
      correctness proof (main text plus appendix), the underflow fix and its
      Max_frequency condition, the word-length constraints f <= c-2 and
      f+c <= p, and measured 1987 benchmarks against adaptive Huffman.
    access: >
      Free PDF (Communications of the ACM 30(6), June 1987, pp. 520-540); the
      article grants non-commercial educational copying. Full text read.
      Captures: arithmeticco-title-page, arithmeticco-fig1-table1,
      arithmeticco-fig1b-fig2, arithmeticco-encode-code,
      arithmeticco-decode-code, arithmeticco-fig5-underflow,
      arithmeticco-table2-perf.

  - title: "DEFLATE Compressed Data Format Specification version 1.3 (RFC 1951)"
    author: "L. P. Deutsch (IETF)"
    url: "https://www.rfc-editor.org/rfc/rfc1951.txt"
    kind: standard
    role: >
      The artifact deflate-and-zstd is read against. §3.1.1 fixes the
      bit-packing convention (fields LSB-first, Huffman codes MSB-first — the
      single most implementation-error-prone rule in the spec); §3.2.2 gives
      the canonical-code rules and the three-step construction with its A-H
      worked example, i.e. Kraft plus an ordering rule making the lengths
      sufficient; §3.2.3 gives the master decode loop and the overlapping
      back-reference that yields run-length coding for free; §3.2.5-3.2.7 give
      the merged literal/length alphabet, the fixed tables, and the
      code-length alphabet with its scrambled permutation order. §1.1 states
      the 5-bytes-per-32KB worst-case expansion, and §4 (explicitly
      non-normative) describes hash chains and lazy matching — the encoder
      freedom the format deliberately leaves open.
    access: >
      Free, no paywall. Plain text at the URL above; PDF at
      https://www.rfc-editor.org/rfc/rfc1951.pdf for page captures. The RFC
      itself grants permission to copy and distribute. Captures:
      rfc1951-titlepage, rfc1951-canonical-huffman-alg,
      rfc1951-huffman-algorithm, rfc1951-length-distance-table.

  - title: "Zstandard Compression and the application/zstd Media Type (RFC 8878)"
    author: "Y. Collet, M. Kucherawy, ed. (IETF)"
    url: "https://www.rfc-editor.org/rfc/rfc8878.txt"
    kind: standard
    role: >
      The modern half of deflate-and-zstd. §3.1.1 gives the frame and block
      layout and the window-size formula; §3.1.1.3-3.1.1.5 give the
      literals/sequences split, sequence execution, and the three-slot
      recent-offset cache that is zstd's signature departure from DEFLATE;
      §4.1 is the FSE/ANS entropy coder with its normalized-distribution header
      and spread rule; §4.2 is Huffman coding by weights (with the trick of
      inferring the last symbol's weight); §5-6 are the trained-dictionary
      format; §8 is the security section (compression-oracle attacks, decoder
      memory bounds); Appendix A gives the reference decoding tables as a
      conformance oracle.
    access: >
      Free, no paywall (Informational RFC, February 2021). Full text read.
      No captures taken — everything needed is schematic and should be redrawn.

  - title: "EE376A: Information Theory — Lecture Notes"
    author: "T. Weissman, I. Ochoa, K. Tatwawadi (Stanford)"
    url: "https://web.stanford.edu/class/ee376a/files/2017-18/lecture_notes.pdf"
    kind: lecture-notes
    role: >
      A compact, elementary cross-check on the classical core, useful where
      Cover & Thomas is paywalled. Ch. 1 has the three-symbol motivating
      example (naive 2 bits, then 1.3, then 1.1975 by blocking, against
      H = 1.181) that prefix-codes and source-coding-theorem-lite reuse; ch. 3
      proves the AEP straight from the law of large numbers; ch. 4 does Kraft,
      Shannon codes and Huffman optimality; ch. 5 derives AWGN capacity twice
      (analytically and by sphere packing); ch. 8-9 give rate-distortion with
      the nested-sphere covering picture and the source-channel separation
      theorem, including the two worked cases where uncoded transmission is
      exactly optimal.
    access: >
      Free PDF (75 pp., dated Feb 2016), clean LaTeX with no OCR issues. Full
      text read. Contains no exercises — it is a companion to a problem-set
      course, so all exercises in our lessons are ours.

  - title: "The Information Bottleneck Problem and Its Applications in Machine Learning"
    author: "Z. Goldfeld, Y. Polyanskiy"
    url: "https://arxiv.org/abs/2004.14941"
    kind: review-paper
    role: >
      The critical companion to Tishby's IB paper and the spine of
      estimating-mutual-information. §II-D gives the closed-form Gaussian IB
      solution and its equivalence to canonical correlation analysis; §III
      gives IB an operational meaning as remote source coding under log loss;
      §IV-B presents the deep-learning IB narrative (information plane,
      fitting/compression phases) as its proponents stated it; §IV-B.3 is the
      vacuousness theorem (in a deterministic network with continuous input,
      I(X;T) is infinite or a weight-independent constant); §V-A relays Saxe et
      al.'s rebuttal (compression appears only with saturating activations, and
      a linear student-teacher model separates compression from
      generalization); §V-B shows the quantized proxy is a function of bin
      size; §V-C resolves the dispute by showing "compression" tracks geometric
      clustering of representations.
    access: >
      Free. arXiv:2004.14941 (35 pp., IEEE JSAIT 2020). Full text read.

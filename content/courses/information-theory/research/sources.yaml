  - title: "Deep Variational Information Bottleneck"
    author: "A. A. Alemi, I. Fischer, J. V. Dillon, K. Murphy"
    url: "https://arxiv.org/abs/1612.00410"
    kind: primary-paper
    role: >
      The tractable form of the IB objective, used in information-bottleneck.
      §3 builds the variational sandwich: a decoder q(y|z) lower-bounds
      I(Z;Y), a marginal r(z) upper-bounds I(Z;X), and the pair gives the
      trainable loss (eq. 17) — reconstruction plus beta times a KL to the
      prior, optimized with the reparameterization trick. Appendix B shows the
      plain VAE is exactly this objective with beta fixed at 1, which is the
      bridge our learned-image-compression lesson uses. §4.1 gives the MNIST
      numbers (best performance where I(Z;X) is 10-100 bits) and the 2-D
      embedding figure.
    access: >
      Free. arXiv:1612.00410 (ICLR 2017), 19 pp. including appendices. Full
      text read. Captures: deepvariatio-fig1-ib-curves-mnist,
      -fig2-2d-embedding-flower, -fig3-mnist-adversarial-grid,
      -fig7-imagenet-adversarial, -fig8-imagenet-perturbation-diff.

  - title: "Auto-Encoding Variational Bayes"
    author: "D. P. Kingma, M. Welling"
    url: "https://arxiv.org/abs/1312.6114"
    kind: primary-paper
    role: >
      Background for learned-image-compression: eq. (1) decomposes
      log p(x) into a KL to the true posterior plus the evidence lower bound,
      and eq. (3) rewrites that bound as "negative reconstruction error minus
      KL to the prior" — the algebraic form the rate-distortion Lagrangian
      takes in a learned codec. Appendix B gives the closed-form Gaussian KL
      term used as the rate term. Cited for the identity, not for the
      generative-modelling results.
    access: >
      Free. arXiv:1312.6114 (ICLR 2014). Full text and appendices read.
      Captures: autoencoding-fig1-graphical-model, -fig2-lowerbound-comparison,
      -fig3-marginal-likelihood, -fig4a-frey-manifold, -fig4b-mnist-manifold,
      -fig5a-mnist-samples-2d.

  - title: "Variational Image Compression with a Scale Hyperprior"
    author: "J. Ballé, D. Minnen, S. Singh, S. J. Hwang, N. Johnston"
    url: "https://arxiv.org/abs/1802.01436"
    kind: primary-paper
    role: >
      The artifact learned-image-compression is built on, and the successor to
      the 2017 end-to-end paper already in this canon. §1 motivates the
      hyperprior with a purely classical analogy: JPEG factorizes its entropy
      model over fixed 8x8 blocks while HEVC transmits a variable block
      partition as side information — the hyperprior is that side information,
      learned. §2 shows rate equals a cross-entropy between the true code
      distribution and the entropy model, so any mismatch costs bits; §3 adds
      the second latent carrying per-coefficient scales; §4.2 reports the
      MS-SSIM-versus-MSE artifact comparison and the measurement that side
      information stays under about 0.025 bpp.
    access: >
      Free. arXiv:1802.01436 (ICLR 2018), 35 pp. including appendices. Full
      text read. Captures: variationali-fig2-latents, -fig5-rd-curves,
      -fig6-artifacts-fig-000/001, -fig7-side-info, -fig8-density-fit.

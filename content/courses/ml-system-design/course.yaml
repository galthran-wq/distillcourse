  - slug: ai-engineering
    title: "AI engineering"
    outcomes: [co-ai]
    lessons:
      - slug: foundation-models-in-production
        title: "Foundation models as system components"
        type: core
        status: planned
        goal: "Analyze what changes when the model is a foundation model — sampling and hallucination as system properties, per-token economics, and the model-selection workflow"
        opening: "A foundation model enters a system as a component nobody on the team trained: adaptation replaces training as the core activity, and the model's failure modes — sampling variance, hallucination, drift under provider updates — become system-design inputs."
        est_minutes: 36
        prerequisites: [requirements-and-metrics]
        concepts:
          introduces: [foundation-model-adaptation, hallucination, token-economics, model-selection-workflow]
          reinforces: [metrics-hierarchy, ml-lifecycle]
        key_ideas:
          - "The inversion: product-first iteration on a fixed model; the three-layer AI engineering stack"
          - "Sampling as a system property: temperature, top-p, logprobs — inconsistency is configured, not fixed"
          - "Hallucination's two working hypotheses (self-delusion, mismatched knowledge) and what each implies for mitigation"
          - "Token economics: cost per request, TTFT vs total latency, the API-vs-self-host cost crossover"
          - "Model selection: hard vs soft attributes, the filter→benchmark→experiment→monitor workflow, benchmark contamination (the Gemini CoT@32 comparison trap)"
        demo: null
      - slug: prompting-and-context
        title: "Prompting and context engineering"
        type: core
        status: planned
        goal: "Design prompts and context as versioned system components — in-context learning, context-window limits, decomposition, and injection defenses"
        opening: "A prompt is production configuration: it is versioned, tested, and attacked like any other interface the system exposes — and the context window it fills is a scarce resource with measurable failure modes."
        est_minutes: 36
        prerequisites: [foundation-models-in-production]
        concepts:
          introduces: [in-context-learning, context-window, prompt-injection, instruction-hierarchy]
          reinforces: [configuration-debt, foundation-model-adaptation]
        key_ideas:
          - "Prompt anatomy and in-context learning: zero/few-shot; the one-example flip (Santa Claus) — examples are behavior configuration"
          - "Context efficiency: needle-in-a-haystack, lost-in-the-middle — position in context is a ranking decision"
          - "Decomposition beats accretion: GoDaddy's 1,500-token prompt split into subtasks — better and cheaper"
          - "Prompt attacks: extraction, jailbreaks, indirect injection through retrieved data (the malicious-username SQL case), the divergence attack"
          - "Defenses in layers: instruction hierarchy (+63% robustness), isolation, approval gates — measured by violation rate AND false-refusal rate"
        demo: null
      - slug: retrieval-augmented-generation
        title: "Retrieval-augmented generation"
        type: core
        status: planned
        goal: "Design a RAG system — retriever choice, chunking, reranking — treating the index as swappable non-parametric memory"
        opening: "RAG bolts a retrieval system onto a frozen model so that knowledge lives in an index instead of in weights — which makes knowledge updatable, inspectable, and swappable at the cost of a second system to design."
        est_minutes: 38
        prerequisites: [prompting-and-context, embedding-based-search]
        concepts:
          introduces: [rag, chunking, hybrid-search]
          reinforces: [ann-search, ndcg, contrastive-learning, context-window]
        key_ideas:
          - "The original result: retrieval + generation beats extraction, and swapping the 2016 index for 2018 changes the answers — memory without retraining"
          - "Term-based vs embedding-based retrieval: BM25 and inverted indexes vs vector search — when the entity-heavy query wins for BM25"
          - "Chunking is where RAG quality is lost: sizes, overlap ('I left my wife a note'), contextual augmentation of chunks"
          - "Hybrid search and reranking: reciprocal rank fusion $\\sum 1/(k + r_i)$, two-stage retrieve-then-rerank"
          - "Evaluating the retriever separately: context precision/recall, nDCG revisited; and the finetune-vs-RAG decision — form vs facts"
        demo: null
      - slug: finetuning-and-adaptation
        title: "Fine-tuning and parameter-efficient adaptation"
        type: extra
        status: planned
        goal: "Judge when to fine-tune and how — memory math, LoRA and QLoRA, multi-adapter serving — after prompting and RAG have been exhausted"
        opening: "Fine-tuning is the last resort on the adaptation ladder, and the reasons are economic: it buys form — structured output, style, domain register — at the price of training infrastructure, base-model churn, and a model you now own."
        est_minutes: 36
        prerequisites: [retrieval-augmented-generation, distributed-training]
        concepts:
          introduces: [peft, lora]
          reinforces: [data-parallelism, quantization, distillation]
        key_ideas:
          - "The cautionary tale: BloombergGPT's $1.3M+ domain pretrain decisively beaten by zero-shot GPT-4 on its own benchmarks"
          - "The adaptation ladder: prompt → few-shot → RAG → fine-tune → combine, each step gated by an eval"
          - "Memory math revisited: full fine-tuning's optimizer bill vs LoRA's $W + (\\alpha/r)AB$ at 0.0027% of trainable parameters"
          - "QLoRA: 4-bit base + trained adapters — a 65B fine-tune on one 48GB GPU, with Guanaco's Elo receipts"
          - "Multi-LoRA serving arithmetic: 100 customer models as 1.68B parameters merged vs 23.3M as adapters"
        demo: null
      - slug: llm-evaluation
        title: "Evaluating LLM systems"
        type: core
        status: planned
        goal: "Build an evaluation pipeline for open-ended outputs — exact metrics where possible, AI judges with known biases, and comparative ranking"
        opening: "Open-ended generation breaks the evaluation toolkit this course has used so far: there is no single reference answer, the benchmarks are contaminated, and the cheapest capable grader is another model with measurable biases."
        est_minutes: 38
        prerequisites: [foundation-models-in-production, offline-evaluation]
        concepts:
          introduces: [ai-judge, pass-at-k, comparative-evaluation]
          reinforces: [slice-based-evaluation, metrics-hierarchy, baseline-ladder]
        key_ideas:
          - "Exact evaluation where it exists: functional correctness and pass@k; the exact-match trap (the Anne Frank date)"
          - "AI-as-judge: prompt design (criteria + discrete scale), and the measured biases — self-preference (+10–25%), position, verbosity"
          - "Comparative evaluation: win rates → Elo/Bradley-Terry; Chatbot Arena's messy reality (180 'hello' prompts) and the transitivity assumption"
          - "The pipeline: tie criteria to the business metric, slice, size the sample (3× smaller effect ≈ 10× more examples), evaluate the evaluator"
          - "Contamination: n-gram overlap and perplexity checks — 'a benchmark stops being useful the day it becomes public'"
        demo: null
      - slug: llm-inference
        title: "LLM inference optimization"
        type: core
        status: planned
        goal: "Apply the LLM serving toolkit — KV-cache budgeting, continuous batching, PagedAttention, quantization, speculative decoding — against TTFT and TPOT budgets"
        opening: "LLM inference is two different workloads in one request: a parallel, compute-bound prefill and a sequential, memory-bandwidth-bound decode — and nearly every serving optimization is an attack on the decode's memory traffic."
        est_minutes: 40
        prerequisites: [foundation-models-in-production, model-compression]
        concepts:
          introduces: [prefill-decode, kv-cache, continuous-batching, paged-attention, speculative-decoding]
          reinforces: [quantization, dynamic-batching, percentile-latency, token-economics]
        key_ideas:
          - "The metrics: TTFT (prefill), TPOT (decode), goodput vs throughput, MFU/MBU — what nvidia-smi does not tell you"
          - "KV cache sizing worked: $2 \\cdot B \\cdot S \\cdot L \\cdot H \\cdot bytes$ — Llama-2-13B at batch 32 needs 54GB, more than its weights"
          - "PagedAttention: fragmentation wastes 62–80% of cache memory; paging blocks like virtual memory reaches 96% utilization and 2–4× throughput"
          - "Batching evolution: static → dynamic → continuous (the bus that never waits); prompt caching's 79% TTFT / 90% cost cut"
          - "Attacking the decode: GQA/MQA (Character.AI's 20× cache cut), quantized KV, speculative decoding's draft-and-verify"
        demo:
          component: KVCacheBudget
          spec: >
            Inputs: model preset (Llama-2-7B/13B/70B — layers, heads, dims
            prefilled), batch size, context length, precision (FP16/INT8),
            attention mode (MHA/GQA-8/MQA). Live stacked bar: weights vs KV
            cache vs headroom against a selectable GPU (A100-40GB/80GB,
            H100). Readout of max batch that fits. Task line: fit
            Llama-2-13B at 4k context on one A100-80GB — find the max
            batch under MHA, then under GQA-8, then with INT8 KV; record
            the three numbers.
      - slug: ai-application-architecture
        title: "The AI application reference architecture"
        type: synthesis
        status: planned
        goal: "Assemble the reference architecture for an LLM application — context construction, guardrails, router and gateway, caches, agent patterns — and instrument it for feedback"
        opening: "The reference architecture for an AI application is built by adding one layer per failure: context for missing knowledge, guardrails for bad outputs, a router for cost, caches for latency, and agents last — because their errors compound."
        est_minutes: 38
        prerequisites: [retrieval-augmented-generation, llm-evaluation, llm-inference]
        concepts:
          introduces: [guardrails, model-router, semantic-caching, agent-pattern]
          reinforces: [rag, ai-judge, kv-cache, prompt-injection, monitoring-pyramid, degenerate-feedback-loop]
        key_ideas:
          - "The incremental build: bare model call → +context (RAG lesson) → +guardrails (evals lesson, inline) → +router/gateway → +caches (inference lesson) → +agents"
          - "Guardrails both ways: input (PII masking with a reverse map, injection screens) and output (quality, safety) — each adds latency the budget must absorb"
          - "Routing economics: RouteLLM-style small-vs-large routing at 2× cost cut; exact vs semantic caching and its false-hit risk"
          - "Agents last: the 95%-per-step → 60%-over-ten arithmetic; plan validation and write-action gates"
          - "Instrumentation: LLM-specific drift (system prompt, user behavior, provider model), implicit feedback done right (Midjourney) and wrong (Luma's reversed emojis)"
        demo: null

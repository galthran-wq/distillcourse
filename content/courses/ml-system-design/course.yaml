schema_version: 1
slug: ml-system-design
title: ML System Design
tagline: "From trained model to production system: data infrastructure, pipelines, serving, monitoring — and the LLM stack"
status: planned
audience: >
  Engineers who already know classical ML — logistic regression, boosting,
  the standard metrics — and now have to ship it: design the system around
  the model, keep it correct under load, and keep it useful as the world
  drifts. Practical register throughout; no basic-ML definitions, no
  proofs for their own sake. Comfort with Python, SQL, and the shape of a
  backend service is assumed.
tone: >
  Dry, precise, engineering register. Declarative statements of fact; no
  rhetorical questions, no teasers. Numbers carry their denominators; case
  studies are named and dated. Second person only in instructions.
intro: >
  A model that wins offline routinely fails in production, and the failure
  is almost never the model: it is the stale join table, the feature
  computed two different ways, the feedback loop the system feeds itself,
  the p99 latency nobody budgeted. This course answers one question — what
  does it take to build the system around a model so that its predictions
  stay useful — and the answer is a discipline, not a trick: a production
  ML system is a data system with a model inside, and it is designed layer
  by layer.


  The layers are the course. First the framing: business objective to ML
  task, a metrics chain that ends in money, a baseline that must be beaten,
  a design document that survives review. Then the substrate every ML
  system stands on — storage, replication, partitioning, queues, batch and
  stream processing — because feature freshness and serving latency are
  decided there, not in the model. Then the manufacturing of training
  data (labels, leakage, features, the train/serve boundary), training as
  an industrial pipeline, the model as a service under a latency budget,
  and the loop that keeps it alive: monitoring, drift, retraining. The
  course closes with the canonical system shapes — the retrieval–ranking
  funnel behind every recommender, search, feed, and ads system,
  dissected end to end on the canon's named designs — and with AI
  engineering, where foundation models invert the workflow (adaptation
  replaces training) but every prior layer returns: context construction
  is a data pipeline, evals are the metrics chain, inference optimization
  is the serving budget, and the reference architecture is the whole
  course in one diagram.
prerequisites:
  - text: "Classical ML at working level: linear/logistic regression, gradient boosting, train/validation/test splits, precision/recall/ROC-AUC"
    course: classical-ml
  - text: "Python and SQL at working-engineer level; comfort reading backend architecture diagrams"
  - text: "Basic probability: distributions, expectation, conditional probability"
key_results:
  - text: "The model is roughly 5% of a production ML system, and the surrounding 95% carries the debt: CACE — changing anything changes everything"
    lesson: ml-in-production
  - text: "Latency is a distribution, not a number: with 1-in-100 slow backend calls, a 100-call fan-out makes ~63% of user requests slow"
    lesson: requirements-and-metrics
  - text: "A heuristic gets you halfway to ML's value at a fraction of the cost — and defines the baseline every model must beat"
    lesson: problem-framing-and-baselines
  - text: "Hash partitioning spreads load but destroys range scans, and $hash(key) \\bmod N$ is the rebalancing anti-pattern: adding one node moves almost every key"
    lesson: partitioning
  - text: "A log-based broker makes messages replayable and ordered; change data capture makes one database the leader and every derived store a follower"
    lesson: queues-and-logs
  - text: "Random splits leak the future into training: split by time and by hash of a correlated key, or the offline number lies"
    lesson: data-leakage-and-splitting
  - text: "Training–serving skew decomposes into three measurable gaps — train vs holdout, holdout vs next-day, next-day vs live — and logging serving-time features closes them"
    lesson: training-serving-skew
  - text: "Comparing serving-log statistics against training statistics found silently missing features and bought Google Play a measured +2% install rate"
    lesson: data-validation
  - text: "A model can beat another on every slice and lose overall — Simpson's paradox makes slice-based evaluation mandatory, not optional"
    lesson: offline-evaluation
  - text: "A Thompson-sampling bandit reached the same confidence in under 12,000 samples that an A/B test needed 630,000 for"
    lesson: deployment-and-online-experiments
  - text: "Covariate, label, and concept shift are three decompositions of $P(X,Y)$: a change in $P(X)$, in $P(Y)$, or in $P(Y|X)$ itself"
    lesson: failures-and-drift
  - text: "Switching daily stateless retraining to daily stateful training cut Grubhub's compute cost 45× and raised purchase-through 20%"
    lesson: continual-learning
  - text: "The recommender funnel is a compute budget: millions of candidates retrieved cheaply, hundreds ranked expensively, tens re-ranked for the page"
    lesson: recommender-funnel
  - text: "Two ad variants sharing one campaign budget cannibalize each other mid-experiment; budget-split testing gives each arm its own spend so the revenue lift is measurable"
    lesson: design-ad-click-prediction
  - text: "A meme is harmless text over a harmless image: early fusion — one classifier over a joint representation — catches what two unimodal classifiers cannot"
    lesson: design-harmful-content
  - text: "RAG's index is swappable non-parametric memory: exchanging a 2016 for a 2018 Wikipedia index flips factual answers with zero retraining"
    lesson: retrieval-augmented-generation
  - text: "The KV cache for Llama-2-13B at batch 32 is 54 GB — larger than the weights; paging it like virtual memory lifts utilization from ~20–38% to 96%"
    lesson: llm-inference
  - text: "Per-step accuracy of 95% compounds to 60% over ten agent steps — the arithmetic that shapes every agentic architecture"
    lesson: ai-application-architecture
sources:
  - D. Sculley et al., "Hidden Technical Debt in Machine Learning Systems," NeurIPS 2015
  - M. Kleppmann, Designing Data-Intensive Applications, O'Reilly, 2017
  - C. Huyen, Designing Machine Learning Systems, O'Reilly, 2022
  - C. Huyen, AI Engineering, O'Reilly, 2025
  - "M. Zinkevich, Rules of Machine Learning: Best Practices for ML Engineering, Google, 2018"
  - "D. Baylor et al., \"TFX: A TensorFlow-Based Production-Scale Machine Learning Platform,\" KDD 2017"
  - V. Lakshmanan, S. Robinson, M. Munn, Machine Learning Design Patterns, O'Reilly, 2020
  - A. Burkov, Machine Learning Engineering, True Positive Inc., 2020
  - R. Crowe, H. Hapke, E. Caveness, D. Zhu, Machine Learning Production Systems, O'Reilly, 2024
  - V. Babushkin, A. Kravchenko, Machine Learning System Design, Manning, 2023
  - A. Aminian, A. Xu, Machine Learning System Design Interview, ByteByteGo, 2023
  - K. Pham, Machine Learning Design Interview, 2022
  - "C. Huyen et al., CS 329S: Machine Learning Systems Design, Stanford, Winter 2022"
  - P. Lewis et al., "Retrieval-Augmented Generation for Knowledge-Intensive NLP Tasks," NeurIPS 2020
  - W. Kwon et al., "Efficient Memory Management for Large Language Model Serving with PagedAttention," SOSP 2023
  - D. Martin, The System Design Primer, github.com/donnemartin/system-design-primer
  - G. Mohandas, Made With ML (MLOps Course), madewithml.com

spine:
  - step: >-
      A trained model is the small part: production ML differs from
      research in objectives, data, and time, and the surrounding system —
      framing, metrics, baselines, the written design — is where projects
      succeed or die.
    label: The model is the easy part
    years: "2015–2022"
    caption: >-
      Google's own accounting: the ML code is ~5% of the system, 60 of 96
      pipeline failures were not ML at all — and a heuristic gets you
      halfway before any model exists.
    lessons: [ml-in-production, requirements-and-metrics, problem-framing-and-baselines, the-design-document]
  - step: >-
      Every ML system stands on a data substrate — storage engines,
      replication, partitioning — whose tradeoffs decide what queries,
      what freshness, and what scale are even possible.
    label: The substrate at rest
    years: "2004–2017"
    caption: >-
      A column store scans a billion rows in seconds where a row store
      cannot; a stale replica promoted to leader leaked GitHub's private
      data; one hot celebrity key melts an even hash partition.
    lessons: [storage-and-data-models, replication, partitioning, consistency-and-transactions]
  - step: >-
      Data in motion: queues and logs decouple producers from consumers,
      change data capture keeps derived stores honest, and batch and
      stream processing are the two ways features get computed — a split
      every later module inherits.
    label: The substrate in motion
    years: "2004–2017"
    caption: >-
      A 6 TB disk buffers eleven hours of full-throttle writes, which is
      why Kafka can replay a week; the same duality — offline warehouse,
      online key-value store — is exactly a feature platform.
    lessons: [queues-and-logs, batch-and-stream-processing, feature-platform]
  - step: >-
      Training data is manufactured, not given: labels come from product
      mechanics or programmatic supervision, leakage enters through
      splits and preprocessing, features must survive unbounded
      vocabularies — and the train/serve boundary is where quality is
      silently lost.
    label: Data is manufactured
    caption: >-
      One radiologist writing labeling functions for 8 hours matched a
      year of hand labels; one differently-implemented transform degraded
      Spotify's recommendations for four undetected months.
    lessons: [labels-and-feedback-loops, data-leakage-and-splitting, features-at-scale, training-serving-skew, data-validation]
  - step: >-
      Training becomes an industrial process: every model traceable to its
      code, data, and config; parallelism chosen from a memory budget;
      evaluation on slices with calibration and validation gates; the
      whole loop orchestrated as a tested pipeline.
    label: Training as a pipeline
    years: "2015–2019"
    caption: >-
      TFX retrains on hundreds of billions of examples by warm-starting
      instead of from scratch, and blocks any model that fails its
      validation gate — the pattern every ML platform since has copied.
    lessons: [experiment-tracking-and-versioning, distributed-training, offline-evaluation, pipelines-and-orchestration, inside-tfx]
  - step: >-
      A model becomes a service: batch or online prediction, compressed to
      its latency budget, behind a model server with dynamic batching and
      caches, rolled out in stages and measured by online experiments —
      because offline metrics cannot see production.
    label: The model becomes a service
    caption: >-
      Roblox went from 100 to 3,015 inferences per second on the same CPUs
      — distillation, dynamic shapes, INT8 — and a bandit found the better
      variant with 2% of the samples an A/B test burns.
    lessons: [batch-and-online-prediction, model-compression, model-servers-and-scaling, deployment-and-online-experiments, serving-bert-at-scale]
  - step: >-
      Deployment is the beginning, not the end: distributions shift, the
      system feeds its own inputs, and models fail silently — so the loop
      is closed with layered monitoring, drift detection, and a retraining
      policy with explicit triggers.
    label: Closing the loop
    caption: >-
      A cumulative accuracy metric reads 93.7 while the true last-day
      value has fallen to 88.6; Grubhub's stateful daily retrain cut
      compute 45× — and Microsoft's Tay showed what retraining on live
      data can do in 16 hours.
    lessons: [failures-and-drift, monitoring-and-observability, continual-learning, drift-detection-in-practice, privacy-and-fairness]
  - step: >-
      The standard shapes: recommendation, search, feed, ads, and
      integrity systems assemble the same parts — cheap retrieval over
      millions, expensive ranking over hundreds, re-ranking for the page —
      and each shape is dissected end to end before the whole course
      composes into a single design.
    label: The canonical shapes
    caption: >-
      Two towers and a dot product retrieve from a hundred-million-item
      corpus in milliseconds; a CTR model that ranks perfectly but
      calibrates badly loses money on every ad auction it wins; a feed's
      one ordering score is a business-weighted sum of seven predicted
      reactions.
    lessons: [recommender-funnel, ranking-and-ctr, embedding-based-search, design-search-ranking, design-feed-ranking, design-ad-click-prediction, design-harmful-content, design-video-recommendations]
  - step: >-
      Foundation models invert the workflow — adaptation replaces training
      — but the discipline transfers: prompts and context are versioned
      system components, and retrieval turns a frozen model's knowledge
      into a swappable index.
    label: The foundation-model inversion
    years: "2020–2025"
    caption: >-
      Swapping a 2016 Wikipedia index for a 2018 one changes who the model
      says is prime minister — no retraining; repeating the word "poem"
      forever made ChatGPT leak its training data.
    lessons: [foundation-models-in-production, prompting-and-context, retrieval-augmented-generation, finetuning-and-adaptation]
  - step: >-
      Trust and cost at scale: open-ended outputs need an evaluation
      pipeline with judges whose biases are known; autoregressive decoding
      needs memory-bound serving economics; and the reference architecture
      assembles context, guardrails, routing, and caches into the course's
      final system.
    label: Trust and cost at scale
    years: "2022–2025"
    caption: >-
      GPT-4 prefers its own outputs by +10%; a 13B model's KV cache
      outweighs its weights; prompt caching cuts time-to-first-token 79% —
      and 95% per-step accuracy still compounds to 60% over ten steps.
    lessons: [llm-evaluation, llm-inference, ai-application-architecture]

outcomes:
  - id: co-frame
    text: >-
      Frame a business problem as an ML system — task formulation, metrics
      hierarchy ending in a business number, baseline ladder, and a design
      document that survives review
    bloom: analyze
  - id: co-substrate
    text: >-
      Choose storage, replication, partitioning, queueing, and
      batch/stream processing for stated load, freshness, and consistency
      requirements — and state what each choice forfeits
    bloom: analyze
  - id: co-data
    text: >-
      Design labeling, splitting, and feature pipelines that are leak-free
      and provably identical between training and serving
    bloom: create
  - id: co-train
    text: >-
      Operate training as an industrial process — tracked, versioned,
      distributed within a memory budget, evaluated on slices behind
      validation gates, orchestrated as a pipeline
    bloom: apply
  - id: co-serve
    text: >-
      Design a serving path — prediction mode, compression, model servers,
      staged rollout, online experiments — that meets stated latency,
      throughput, and cost budgets
    bloom: evaluate
  - id: co-operate
    text: >-
      Diagnose production failures — drift types, feedback loops, silent
      degradation — and design the monitoring stack and retraining policy
      that catch them
    bloom: analyze
  - id: co-design
    text: >-
      Produce complete end-to-end designs for the canonical system shapes
      — recommendation, search, and ads — from requirements through
      monitoring
    bloom: create
  - id: co-ai
    text: >-
      Design an LLM application stack — context construction and RAG, an
      evaluation pipeline, inference serving economics, and the guarded
      reference architecture — with cost/latency/quality tradeoffs made
      explicit
    bloom: create

modules:
  - slug: production-ml
    title: "The production ML problem"
    outcomes: [co-frame]
    lessons:
      - slug: ml-in-production
        title: "ML systems versus ML models"
        type: core
        status: drafted
        key_image: figures/course-map.svg
        goal: "Explain why a production ML system is mostly not the model, using the hidden-technical-debt taxonomy and the research-versus-production contrast"
        opening: "The model is roughly 5% of a production ML system; the other 95% — data collection, feature pipelines, serving, monitoring, configuration — is where the engineering effort, the cost, and the failures live."
        est_minutes: 28
        prerequisites: []
        concepts:
          introduces: [hidden-technical-debt, cace-principle, ml-lifecycle]
          reinforces: []
        key_ideas:
          - "Sculley's small-black-box diagram: ML code dwarfed by nine infrastructure components"
          - "Research vs production: objectives, throughput vs latency, static vs shifting data, stakes"
          - "The debt taxonomy: CACE, correction cascades, undeclared consumers, feedback loops, pipeline jungles, glue code"
          - "When ML — and when a heuristic, a lookup table, or nothing: the cost of a wrong prediction decides"
          - "The lifecycle is a loop, not a line: scoping → data → model → deploy → monitor → business analysis → repeat"
        demo: null
      - slug: requirements-and-metrics
        title: "Requirements, latency, and the metrics hierarchy"
        type: core
        status: drafted
        key_image: figures/metrics-chain.svg
        goal: "Derive system requirements and a metrics chain from a business objective — percentile latency, throughput, availability, and the offline-proxy → online → business hierarchy"
        opening: "A production system is specified by numbers — p99 latency, sustained throughput, availability — and a model is judged by a chain of metrics that ends in a business quantity, not in ROC-AUC."
        est_minutes: 34
        prerequisites: [ml-in-production]
        concepts:
          introduces: [percentile-latency, throughput, slo, metrics-hierarchy, objective-decoupling]
          reinforces: [ml-lifecycle]
        key_ideas:
          - "Latency is a distribution: p50/p99, tail amplification under fan-out, why means lie"
          - "Latency vs throughput: batching raises both at once — the counterintuitive tradeoff"
          - "Availability arithmetic: components in series multiply failure, in parallel multiply the nines"
          - "The metrics chain: loss → offline metric → online proxy → business metric, with a named gap at each link"
          - "Decoupling objectives: separate models per objective, weighted at serving time, beats one blended loss"
        demo:
          component: TailLatencyExplorer
          spec: >
            Reader sets per-backend p99 slowness (e.g. 1% of calls exceed 1s)
            and the fan-out N of one user request; live plot of the fraction
            of user requests that hit at least one slow call, 1-(1-p)^N.
            Task line: find the fan-out at which more than half of user
            requests are slow with a 1% slow backend, then find the
            per-backend rate needed to keep a 100-call page under 5%.
            Presets: single call, microservice page (N=30), feature fan-out
            (N=100).
      - slug: problem-framing-and-baselines
        title: "Problem framing and the baseline ladder"
        type: core
        status: drafted
        key_image: figures/baseline-ladder.svg
        goal: "Formulate a business problem as an ML task and select the baseline that must be beaten before any model earns its complexity"
        opening: "The same product need can be framed as classification, regression, or ranking, and the framing — not the model — decides label availability, retraining cost, and how the system can fail."
        est_minutes: 34
        prerequisites: [requirements-and-metrics]
        concepts:
          introduces: [problem-framing, baseline-ladder]
          reinforces: [metrics-hierarchy]
        key_ideas:
          - "Reframing changes maintenance: the next-app recommender as N-way classifier vs (user, app) regression"
          - "Objectives must be observable and attributable: clicks and purchases train models; 'satisfaction' does not"
          - "The baseline ladder: random, zero-rule, heuristic, human, existing system — an F1 of 0.90 can be exactly majority-class"
          - "Rule #1: launch without ML — a heuristic captures half the value and becomes the benchmark"
          - "The four phases of ML development, and why cost grows superlinearly as the accuracy target approaches 100%"
        demo: null
      - slug: the-design-document
        title: "The design document"
        type: core
        status: drafted
        key_image: figures/doc-skeleton.svg
        goal: "Produce a design document for a concrete ML system — problem definition, metrics, risks, baselines — and review one against a checklist"
        opening: "A design document is the cheapest place an ML system can fail: framing, metrics, risks, and rollout are decided on paper, before any pipeline exists."
        est_minutes: 32
        prerequisites: [problem-framing-and-baselines]
        concepts:
          introduces: [design-document]
          reinforces: [problem-framing, baseline-ladder, metrics-hierarchy]
        key_ideas:
          - "The document's skeleton: problem definition, metrics and losses, data, validation, baselines, risks and antigoals"
          - "Worked end to end on retail demand forecasting: an $800M/year delivered-vs-sold gap as the problem statement"
          - "Risks surface on paper: price-discrimination law and a 6-hour repricing cadence killed an elegant bandit design"
          - "Reviewing a design doc: what a reviewer checks, and why the doc is a living artifact"
        demo: null

  - slug: data-systems
    title: "Data systems fundamentals"
    outcomes: [co-substrate]
    lessons:
      - slug: storage-and-data-models
        title: "Storage engines and analytical processing"
        type: core
        status: drafted
        key_image: figures/row-vs-column.svg
        goal: "Select between row and column storage, transactional and analytical engines, and warehouse versus lake architectures for a given ML workload"
        opening: "Reading one user's row and scanning one column over a billion rows are opposite access patterns, and every storage engine is built for one of them at the expense of the other."
        est_minutes: 36
        prerequisites: [ml-in-production]
        concepts:
          introduces: [column-storage, oltp-olap, data-warehouse-lake, etl-elt]
          reinforces: []
        key_ideas:
          - "Row-major vs column-major: CSV vs Parquet, write path vs scan path, compression from sorted columns"
          - "OLTP vs OLAP: the access patterns, and why one database cannot serve both well"
          - "Under the hood in one section: log-structured (LSM) vs update-in-place (B-tree), write vs read amplification"
          - "Warehouse vs lake: schema-on-write vs schema-on-read, and where training data actually comes from"
          - "ETL → ELT: storage/compute decoupling moved the transform after the load"
        demo: null
      - slug: replication
        title: "Replication and consistency"
        type: core
        status: drafted
        key_image: figures/quorum-overlap.svg
        goal: "Explain leader-based replication, its lag anomalies, and the failover risks that asynchronous replication creates"
        opening: "Copying the same data to several nodes buys read throughput and fault tolerance, and pays for it with a new problem: the copies disagree, and the disagreement is visible to users."
        est_minutes: 36
        prerequisites: [storage-and-data-models]
        concepts:
          introduces: [replication-lag, read-your-writes, quorum, cap-theorem]
          reinforces: [slo]
        key_ideas:
          - "Leader-based replication: sync vs async followers, and what failover can silently destroy (GitHub 2012: a stale follower promoted to leader reissued primary keys)"
          - "Lag anomalies as guarantees: read-your-writes, monotonic reads, consistent prefix — each with its user-visible symptom"
          - "Multi-leader conflicts: last-write-wins loses data (Amazon's cart resurrected deleted items)"
          - "Leaderless quorums: w + r > n overlap, sloppy quorums, why quorum ≠ linearizable"
          - "CAP stated honestly — consistent or available when partitioned — and why ML systems mostly pick eventual consistency"
        demo: null
      - slug: partitioning
        title: "Partitioning and sharding"
        type: core
        status: drafted
        key_image: figures/rebalancing-strip.svg
        goal: "Design a partitioning scheme — key range or hash, with rebalancing and hot-key mitigation — for a dataset that outgrows one node"
        opening: "When data outgrows one machine, some key must decide which machine owns which records, and every choice of that key trades scan ability against load balance."
        est_minutes: 34
        prerequisites: [replication]
        concepts:
          introduces: [sharding, hot-key, rebalancing, consistent-hashing]
          reinforces: [replication-lag]
        key_ideas:
          - "Range vs hash partitioning: the encyclopedia-volume intuition vs even spread that kills range queries"
          - "Hot keys: a celebrity user melts a hash partition; the random-suffix mitigation and its read-side fan-out cost"
          - "hash mod N is the anti-pattern: adding a node moves almost everything; fixed partitions and consistent hashing move only what must move"
          - "Secondary indexes: document-partitioned (scatter/gather reads) vs term-partitioned (multi-partition writes)"
          - "Request routing: any-node-forwards, routing tier, partition-aware client — and where the assignment lives (ZooKeeper)"
        demo:
          component: ReshardingExplorer
          spec: >
            A ring of N nodes and 200 keys, colored by owning node under
            three schemes selectable as tabs: hash mod N, fixed partitions
            (32 partitions assigned to nodes), consistent hashing with
            virtual nodes. Buttons add or remove a node; readout shows the
            percentage of keys that moved. Task line: add one node under
            each scheme and record the moved fraction — find the scheme
            that keeps it near 1/N; then remove a node and check the claim
            still holds.
      - slug: consistency-and-transactions
        title: "Transactions, linearizability, and consensus"
        type: extra
        status: drafted
        key_image: figures/linearizability.svg
        goal: "Explain what isolation levels, linearizability, and consensus actually guarantee — and what they cost — for the rare ML-adjacent cases that need them"
        opening: "ACID's four letters make four different promises, and most systems quietly break the I: the anomalies that weak isolation permits are precise, reproducible, and occasionally catastrophic."
        est_minutes: 38
        prerequisites: [partitioning]
        concepts:
          introduces: [acid-isolation, linearizability, fencing-token]
          reinforces: [quorum, cap-theorem]
        key_ideas:
          - "ACID unpacked: atomicity is abortability, consistency is the application's job, isolation is the negotiable one"
          - "The anomaly zoo by example: dirty reads, read skew (Alice's $500), lost updates, write skew (the on-call doctors)"
          - "Unreliable clocks and process pauses: why a lease can expire mid-write, and fencing tokens as the general fix"
          - "Linearizability and the honest CAP; two-phase commit as a system of promises that blocks"
          - "What ZooKeeper actually sells: linearizable ops + total order + failure detection + notifications"
        demo: null
      - slug: queues-and-logs
        title: "Message queues and event logs"
        type: core
        status: drafted
        key_image: figures/two-broker-families.svg
        goal: "Contrast acknowledgment-based brokers with log-based brokers and use change data capture to keep derived systems consistent"
        opening: "Two services can exchange data three ways — a shared database, a synchronous call, or a message through a broker — and the third is what keeps N services from becoming an N² mesh of calls."
        est_minutes: 36
        prerequisites: [replication]
        concepts:
          introduces: [message-broker, event-log, change-data-capture, backpressure]
          reinforces: [replication-lag]
        key_ideas:
          - "Two broker families: AMQP-style (ack, delete, load-balance) vs log-based (Kafka: partition offsets, ordered, replayable)"
          - "The disk is the buffer: a 6TB drive holds ~11 hours of full-throughput writes — why Kafka retains days"
          - "Dual writes race and diverge; CDC makes the database the leader and search/cache/warehouse its followers"
          - "State/stream duality: the log is the truth, the table is a cache of the log"
          - "Backpressure and redelivery: what happens when a consumer falls behind or crashes mid-message"
        demo: null
      - slug: batch-and-stream-processing
        title: "Batch and stream processing"
        type: core
        status: drafted
        key_image: figures/event-vs-processing.svg
        goal: "Select between batch and stream processing for a feature pipeline, handling event time, windows, and reprocessing correctly"
        opening: "A feature computed over yesterday's data and a feature computed over the last thirty seconds are produced by two different machines — batch and stream processing — and most production failures at this layer come from confusing their clocks."
        est_minutes: 38
        prerequisites: [queues-and-logs, storage-and-data-models]
        concepts:
          introduces: [batch-processing, stream-processing, event-time, windowing, lambda-architecture, streaming-features]
          reinforces: [event-log, etl-elt]
        key_ideas:
          - "MapReduce's four steps generalize a Unix pipeline; dataflow engines (Spark/Flink) drop the materialization"
          - "Event time vs processing time: the Star Wars release-order analogy, stragglers, and windowing bugs"

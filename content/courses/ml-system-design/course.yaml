        opening: "No model can score a hundred million items in a hundred milliseconds, so every production recommender is a funnel: cheap retrieval narrows millions to hundreds, an expensive model ranks hundreds, and business logic re-orders the top few."
        est_minutes: 38
        prerequisites: [features-at-scale, batch-and-online-prediction]
        concepts:
          introduces: [candidate-generation, two-tower, ann-search, reranking]
          reinforces: [embeddings-as-features, online-prediction, percentile-latency]
        key_ideas:
          - "The funnel as latency arithmetic: per-item scoring cost × corpus size at each stage against the page's budget"
          - "Candidate sources: collaborative co-occurrence, content similarity, graph walks — real systems run several in parallel"
          - "Two-tower retrieval: user tower, item tower, dot product; in-batch negatives and the sampled-softmax popularity correction"
          - "ANN search: HNSW/IVF/hashing in one section — recall vs QPS vs index build time; precompute the item side, index it"
          - "Re-ranking is where the product lives: diversity, freshness, fairness; cold start via exploration traffic (TikTok's pools)"
        demo: null
      - slug: ranking-and-ctr
        title: "Ranking models and CTR prediction"
        type: core
        status: planned
        goal: "Design the ranking stage — pointwise CTR prediction with calibration, position-bias correction, and normalized cross-entropy evaluation"
        opening: "The ranking stage predicts a probability — click, watch, purchase — for each retrieved candidate, and because that probability is multiplied by money in an auction or an expected-value ranker, it must be calibrated, not merely ordered correctly."
        est_minutes: 38
        prerequisites: [recommender-funnel, offline-evaluation]
        concepts:
          introduces: [ctr-prediction, normalized-cross-entropy, position-bias]
          reinforces: [calibration, feature-cross, two-tower]
        key_ideas:
          - "Pointwise vs pairwise vs listwise; why pairwise ranks well (AUC) yet calibrates badly — and pointwise won production"
          - "Architectures as feature engineering: wide-and-deep (memorize + generalize), crosses learned instead of hand-built"
          - "NCE worked in full: the fixed-0.2 model beats the informative model on raw log loss and loses on NCE — normalizing by the base rate"
          - "Position bias: position as a training feature served constant; inverse propensity weighting in one paragraph"
          - "Multi-task heads to one score: the worked engagement-score table (click 23%×1 + like 48%×5 − block 0.0003%×50 = 4.66)"
        demo: null
      - slug: embedding-based-search
        title: "Embedding-based retrieval and search ranking"
        type: core
        status: planned
        goal: "Design an embedding-based retrieval system — contrastive training, the ranking-metric ladder, and the production indexing pipeline"
        opening: "Search over things that are not text — images, listings, videos — reduces to one mechanism: embed query and item into one space where similarity is dot product, then rank by the metrics that respect order."
        est_minutes: 36
        prerequisites: [recommender-funnel]
        concepts:
          introduces: [contrastive-learning, ndcg]
          reinforces: [embeddings-as-features, ann-search, two-tower]
        key_ideas:
          - "Contrastive training: query, positive, in-batch negatives → softmax over similarities; augmentation as free positives (visual search)"
          - "The metric ladder by counterexample: MRR ignores the list, precision@k ignores order, recall@k hides gaps — nDCG worked to 0.587"
          - "Airbnb's listing embeddings: skip-gram over click sessions, the booked-listing global context, same-market hard negatives"
          - "Average rank of the booked listing: an offline metric aligned with the business event"
          - "The two pipelines: offline indexing (embed corpus, build index, refresh) vs online query path — and their different freshness"
        demo: null
      - slug: design-search-ranking
        title: "End-to-end design: search ranking"
        type: worked-practice
        status: planned
        goal: "Produce a complete design for a search-ranking system — query understanding, fused multimodal retrieval, graded-relevance labels from sessions, and the indexing/query serving split"
        opening: "A search system answers a query the user just typed, and that changes every stage of the funnel: retrieval is conditioned on the query rather than the user, relevance is judged per query–item pair, and the offline metric must respect order within each result page."
        est_minutes: 34
        prerequisites: [embedding-based-search, ranking-and-ctr]
        concepts:
          introduces: [query-understanding]
          reinforces: [two-tower, ndcg, contrastive-learning, ann-search, natural-labels, metrics-hierarchy]
        key_ideas:
          - "Requirements and scale first: query volume, corpus size, the latency budget of a results page — and how a query-conditioned funnel differs from a user-conditioned one"
          - "Query understanding: normalization, tokenization, text embedding — and fusing text match with visual/content similarity into one candidate set (YouTube search's fused architecture)"
          - "Labels from sessions: clicks vs stays vs bookings as graded relevance; Airbnb's booking sessions revisited as the label source; the label choice fixes the metric"
          - "Ranking for search: two-tower scoring per query–listing pair, business-asymmetric costs (an empty page vs a bad first result), nDCG as the offline gate and session success online"
          - "Serving and operations: the indexing pipeline vs the query path, caching head queries, monitoring query drift and the null-result rate"
        demo: null
      - slug: design-feed-ranking
        title: "End-to-end design: feed ranking"
        type: worked-practice
        status: planned
        goal: "Produce a complete design for a personalized feed — multi-task reaction prediction, engagement-score aggregation, impression discounting, and feedback-loop monitoring"
        opening: "A feed ranks a small, fresh, mostly in-network inventory rather than a hundred-million-item corpus, so its hard problems move downstream: predicting many reaction types at once, blending them into one ordering score, and not showing the same post twice."
        est_minutes: 34
        prerequisites: [ranking-and-ctr, labels-and-feedback-loops]
        concepts:
          introduces: [engagement-score, impression-discounting]
          reinforces: [position-bias, natural-labels, degenerate-feedback-loop, objective-decoupling, calibration]
        key_ideas:
          - "Requirements: freshness dominates — a feed's inventory is hours old and partly exhausted per session; scale estimation for a professional-network-sized graph"
          - "Inventory and retrieval: in-network posts plus injected out-of-network candidates — a shallow funnel, and why feed retrieval is cheap where video retrieval is not"
          - "Multi-task reaction heads on a shared backbone: click, like, comment, share, hide, block — and the engagement score recalled from ranking-and-ctr, extended with where the weights come from and how experiments tune them"
          - "Impression discounting: a post seen and ignored is evidence — LinkedIn's decay factor, and the re-ranking layer that enforces variety across a session"
          - "The loop declared upfront: engagement labels come from what was shown; position features, exploration slots, and popularity-diversity monitoring as the design's own audit"
        demo: null
      - slug: design-ad-click-prediction
        title: "End-to-end design: ad click prediction"
        type: worked-practice
        status: planned
        goal: "Produce a complete design for an ads CTR system — auction context, delayed-click labels, downsampled training with calibrated serving, and budget-aware experiments"
        opening: "An ads system multiplies a predicted click probability by a bid inside an auction, which makes it the most numerically accountable ML system in production: every miscalibration is priced, and every millisecond of serving latency is a lost impression."
        est_minutes: 36
        prerequisites: [ranking-and-ctr, deployment-and-online-experiments]
        concepts:
          introduces: [ad-auction, budget-split-testing]
          reinforces: [ctr-prediction, normalized-cross-entropy, calibration, feature-cross, natural-labels, ab-testing]
        key_ideas:
          - "Requirements from the auction: expected value $P(\\text{click}) \\times \\text{bid}$, the waterfall serving model's brutal latency budget, and scale estimation from impressions per day"
          - "Data: the impression–click join, the delayed-click window (most clicks in five minutes, some hours later — any fixed window undercounts CTR), and negative downsampling as a pipeline decision that owes serving a correction"
          - "Features and model: crosses at ads scale recalled, hashing for campaign/creative vocabularies; NCE plus the calibration plot as the offline metric pair"
          - "The hidden feedback loop: the model picks which ads are shown, which picks the next training set — exploration budget and position features as loop-breakers"
          - "Experiments under interference: budget-split A/B so arms don't compete for one campaign budget; monitoring calibration drift as a direct revenue alarm"
        demo: null
      - slug: design-harmful-content
        title: "End-to-end design: harmful content detection"
        type: worked-practice
        status: planned
        goal: "Produce a complete design for a harmful-content system — multimodal fusion, multi-task classification under extreme imbalance, a human review queue, and enforcement with appeals"
        opening: "A harmful-content system classifies on the order of half a billion posts a day into violation categories where positives are rare, adversarial, and expensive to mislabel in either direction — and its output is an enforcement action against a person, not a ranking."
        est_minutes: 36
        prerequisites: [offline-evaluation, labels-and-feedback-loops]
        concepts:
          introduces: [multimodal-fusion, human-review-loop]
          reinforces: [slice-based-evaluation, natural-labels, active-learning, concept-drift, metrics-hierarchy]
        key_ideas:
          - "Requirements price the two errors separately: a missed harm and a wrongful takedown have different costs, so the operating contract is recall at a fixed precision, not accuracy"
          - "Framing choices with maintenance consequences: one binary model per violation class vs multi-label vs multi-task heads on a shared multimodal backbone"
          - "Fusion: early vs late — a meme is harmless text over a harmless image, and at ~500M posts/day there is enough data to learn the joint representation late fusion cannot"
          - "Data under extreme imbalance: user reports and appeal verdicts as label sources, imbalance handling recalled from classical ML, and the model as triage — ranking a human review queue by severity and uncertainty"
          - "Operations: enforcement and appeals as audited labels, prevalence as the online metric, and drift that is adversarial — evasion adapts to whatever ships, so retraining cadence is a security parameter"
        demo: null
      - slug: design-video-recommendations
        title: "End-to-end design: video recommendation"
        type: synthesis
        status: planned
        goal: "Produce a complete system design for video recommendation — requirements through monitoring — exercising the full course template"
        opening: "This lesson runs the whole course once, as a single design: a video-recommendation system taken from requirements and scale estimates through data, models, serving, experiments, and monitoring."
        est_minutes: 36
        prerequisites: [ranking-and-ctr, embedding-based-search, continual-learning]
        concepts:
          introduces: []
          reinforces: [candidate-generation, two-tower, ann-search, natural-labels, position-bias, engagement-score, ab-testing, degenerate-feedback-loop, continual-learning]
        key_ideas:
          - "Requirements and back-of-envelope scale: users, corpus, QPS, latency budget — numbers before boxes"
          - "Framing and labels: watch/skip as natural labels, implicit-signal pitfalls, the feedback loop declared upfront"
          - "The design: multi-source candidate generation, two-tower retrieval with ANN, multi-task ranker, re-ranking layer"
          - "Serving and freshness: index refresh cadence, feature freshness split, caching; experimentation and interleaving plan"
          - "Where real systems depart from the template: YouTube's multi-algorithm retrieval, continual training, exploration traffic"

<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <marker id="cb-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/>
    </marker>
    <marker id="cb-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4c8dd6"/>
    </marker>
    <marker id="cb-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e2903a"/>
    </marker>
  </defs>

  <!-- log partition: offset boxes 46..53 -->
  <g font-size="11" text-anchor="middle">
    <rect x="60" y="30" width="44" height="26" fill="none" stroke="currentColor" opacity="0.5"/>
    <text x="82" y="47" fill="currentColor">46</text>
    <rect x="104" y="30" width="44" height="26" fill="none" stroke="currentColor" opacity="0.5"/>
    <text x="126" y="47" fill="currentColor">47</text>
    <rect x="148" y="30" width="44" height="26" fill="none" stroke="currentColor" opacity="0.5"/>
    <text x="170" y="47" fill="currentColor">48</text>
    <rect x="192" y="30" width="44" height="26" fill="none" stroke="currentColor" opacity="0.5"/>
    <text x="214" y="47" fill="currentColor">49</text>
    <rect x="236" y="30" width="44" height="26" fill="none" stroke="currentColor" opacity="0.5"/>
    <text x="258" y="47" fill="currentColor">50</text>
    <rect x="280" y="30" width="44" height="26" fill="none" stroke="currentColor" opacity="0.5"/>
    <text x="302" y="47" fill="currentColor">51</text>
    <rect x="324" y="30" width="44" height="26" fill="none" stroke="currentColor" opacity="0.5"/>
    <text x="346" y="47" fill="currentColor">52</text>
    <rect x="368" y="30" width="44" height="26" fill="none" stroke="currentColor" opacity="0.5"/>
    <text x="390" y="47" fill="currentColor">53</text>
    <text x="470" y="47" font-size="10" fill="currentColor" opacity="0.55" text-anchor="start">log partition (offsets)</text>
  </g>

  <!-- barrier after offset 48 -->
  <line x1="192" y1="24" x2="192" y2="62" stroke="#4c8dd6" stroke-width="3"/>
  <text x="150" y="16" font-size="10" fill="#4c8dd6" text-anchor="middle">barrier after 48</text>

  <!-- crash marker at offset 52 -->
  <text x="346" y="16" font-size="10" fill="#e2903a" text-anchor="middle">crash while at 52</text>
  <path d="M 338 20 L 346 26 L 341 26 L 350 33" fill="none" stroke="#e2903a" stroke-width="1.6"/>

  <!-- replay bracket, offsets 49..52 -->
  <path d="M 194 62 v 6 h 172 v -6" fill="none" stroke="#e2903a" stroke-width="1.4"/>
  <text x="280" y="82" font-size="10" fill="#e2903a" text-anchor="middle">replayed after restore</text>

  <!-- processor boundary -->
  <rect x="100" y="100" width="310" height="140" rx="6" fill="none" stroke="currentColor" stroke-dasharray="5 4"/>
  <text x="255" y="118" font-size="11" fill="currentColor" text-anchor="middle">stream processor</text>
  <text x="255" y="132" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">the checkpointable world</text>

  <!-- events flowing in -->
  <line x1="130" y1="58" x2="130" y2="97" stroke="currentColor" stroke-width="1.4" marker-end="url(#cb-c)"/>

  <!-- operator state -->
  <g font-size="11" text-anchor="middle">
    <rect x="130" y="150" width="170" height="44" rx="4" fill="none" stroke="currentColor"/>
    <text x="215" y="168" fill="currentColor">operator state</text>
    <text x="215" y="183" fill="currentColor" opacity="0.55" font-size="10">counts per store</text>
  </g>

  <!-- snapshot (durable), below the boundary -->
  <g font-size="11" text-anchor="middle">
    <rect x="120" y="280" width="220" height="34" rx="4" fill="none" stroke="#4c8dd6"/>
    <text x="230" y="301" fill="#4c8dd6">checkpoint: state + offset 48</text>
  </g>
  <line x1="200" y1="194" x2="200" y2="277" stroke="#4c8dd6" stroke-width="1.4" marker-end="url(#cb-b)"/>
  <text x="192" y="264" font-size="10" fill="#4c8dd6" text-anchor="end">snapshot at each barrier</text>
  <line x1="260" y1="277" x2="260" y2="197" stroke="#e2903a" stroke-width="1.4" marker-end="url(#cb-a)"/>
  <text x="268" y="256" font-size="10" fill="#e2903a" text-anchor="start">on crash: restore,</text>
  <text x="268" y="269" font-size="10" fill="#e2903a" text-anchor="start">rewind to 49</text>

  <!-- the escaping side effect -->
  <line x1="300" y1="166" x2="467" y2="166" stroke="currentColor" stroke-width="1.4" marker-end="url(#cb-c)"/>
  <g font-size="11" text-anchor="middle">
    <rect x="470" y="146" width="150" height="38" rx="4" fill="none" stroke="currentColor"/>
    <text x="545" y="169" fill="currentColor">email sent at 51</text>
  </g>
  <text x="545" y="204" font-size="10" fill="#e2903a" text-anchor="middle">outside when the crash came:</text>
  <text x="545" y="218" font-size="10" fill="#e2903a" text-anchor="middle">replay sends it again</text>
</svg>

<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <marker id="ep-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- bands (under everything) -->
  <!-- processing-time window p in [45,50) -->
  <rect x="70" y="95" width="540" height="22.5" fill="#e2903a" opacity="0.14"/>
  <!-- event-time window e in [30,35] -->
  <rect x="340" y="50" width="45" height="270" fill="#4c8dd6" opacity="0.10" stroke="#4c8dd6" stroke-dasharray="3 3" stroke-opacity="0.5"/>

  <!-- axes -->
  <line x1="70" y1="320" x2="610" y2="320" stroke="currentColor" stroke-width="1.2" marker-end="url(#ep-c)"/>
  <line x1="70" y1="320" x2="70" y2="50" stroke="currentColor" stroke-width="1.2" marker-end="url(#ep-c)"/>
  <text x="340" y="345" font-size="11" fill="currentColor" text-anchor="middle">event time (min)</text>
  <text x="25" y="185" font-size="11" fill="currentColor" text-anchor="middle" transform="rotate(-90 25 185)">processing time (min)</text>

  <!-- diagonal: processed the instant it happened -->
  <line x1="70" y1="320" x2="610" y2="50" stroke="currentColor" stroke-width="1" stroke-dasharray="3 3" opacity="0.5"/>
  <text x="200" y="240" font-size="10" fill="currentColor" opacity="0.55" transform="rotate(-27 200 240)">processed the instant it happened</text>

  <!-- steady dots (blue), lag ~1.5 min -->
  <g fill="#4c8dd6">
    <circle cx="97" cy="300" r="3.5"/>
    <circle cx="124" cy="286" r="3.5"/>
    <circle cx="151" cy="273" r="3.5"/>
    <circle cx="178" cy="259" r="3.5"/>
    <circle cx="205" cy="246" r="3.5"/>
    <circle cx="232" cy="232" r="3.5"/>
    <circle cx="259" cy="219" r="3.5"/>
    <circle cx="286" cy="205" r="3.5"/>
    <circle cx="313" cy="192" r="3.5"/>
    <circle cx="475" cy="111" r="3.5"/>
    <circle cx="502" cy="97" r="3.5"/>
    <circle cx="529" cy="84" r="3.5"/>
    <circle cx="556" cy="70" r="3.5"/>
    <circle cx="583" cy="57" r="3.5"/>
  </g>

  <!-- backlog dots (amber): buffered during the outage, processed in a burst -->
  <g fill="#e2903a">
    <circle cx="340" cy="117.5" r="3.5"/>
    <circle cx="367" cy="114.8" r="3.5"/>
    <circle cx="394" cy="112.1" r="3.5"/>
    <circle cx="421" cy="109.4" r="3.5"/>
    <circle cx="448" cy="106.7" r="3.5"/>
  </g>

  <!-- outage bracket on the processing axis: p 30 to 45 -->
  <line x1="76" y1="185" x2="76" y2="117.5" stroke="#e2903a" stroke-width="2"/>
  <line x1="73" y1="185" x2="79" y2="185" stroke="#e2903a" stroke-width="2"/>
  <line x1="73" y1="117.5" x2="79" y2="117.5" stroke="#e2903a" stroke-width="2"/>
  <text x="84" y="148" font-size="10" fill="#e2903a">redeploy:</text>
  <text x="84" y="160" font-size="10" fill="#e2903a">consumer down</text>

  <!-- band labels -->
  <text x="608" y="90" font-size="10" fill="#e2903a" text-anchor="end">5-min processing-time window: 7 events &#8212; read as a 4&#215; spike</text>
  <text x="362" y="42" font-size="10" fill="#4c8dd6" text-anchor="middle">5-min event-time window: 2 events &#8212; the true rate</text>
</svg>

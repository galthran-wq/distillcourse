<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <marker id="lu-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/>
    </marker>
    <marker id="lu-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e2903a"/>
    </marker>
  </defs>

  <line x1="322" y1="34" x2="322" y2="300" stroke="currentColor" stroke-width="1" stroke-dasharray="3 3" opacity="0.35"/>
  <text x="160" y="22" font-size="12" font-weight="bold" fill="currentColor" text-anchor="middle">lambda architecture</text>
  <text x="480" y="22" font-size="12" font-weight="bold" fill="currentColor" text-anchor="middle">unified: one log, one engine</text>

  <!-- left panel -->
  <g font-size="11" text-anchor="middle">
    <rect x="14" y="133" width="72" height="40" rx="4" fill="none" stroke="currentColor"/>
    <text x="50" y="150" fill="currentColor">event</text>
    <text x="50" y="163" fill="currentColor">log</text>

    <rect x="106" y="55" width="132" height="46" rx="4" fill="none" stroke="#4c8dd6"/>
    <text x="172" y="73" fill="#4c8dd6">batch layer</text>
    <text x="172" y="86" fill="#4c8dd6" font-size="10">nightly, exact &#183; codebase A</text>

    <rect x="106" y="206" width="132" height="46" rx="4" fill="none" stroke="#e2903a"/>
    <text x="172" y="224" fill="#e2903a">speed layer</text>
    <text x="172" y="237" fill="#e2903a" font-size="10">streaming, approx. &#183; codebase B</text>

    <rect x="256" y="128" width="60" height="50" rx="4" fill="none" stroke="currentColor"/>
    <text x="286" y="148" fill="currentColor" font-size="10">merge at</text>
    <text x="286" y="161" fill="currentColor" font-size="10">query time</text>
  </g>
  <line x1="86" y1="140" x2="103" y2="90" stroke="currentColor" stroke-width="1.4" marker-end="url(#lu-c)"/>
  <line x1="86" y1="166" x2="103" y2="218" stroke="currentColor" stroke-width="1.4" marker-end="url(#lu-c)"/>
  <line x1="238" y1="85" x2="256" y2="132" stroke="currentColor" stroke-width="1.4" marker-end="url(#lu-c)"/>
  <line x1="238" y1="222" x2="256" y2="174" stroke="currentColor" stroke-width="1.4" marker-end="url(#lu-c)"/>

  <!-- the duplication flag -->
  <line x1="172" y1="101" x2="172" y2="206" stroke="#e2903a" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="172" y="290" font-size="10" fill="#e2903a" text-anchor="middle">the same feature logic, written twice &#8212;</text>
  <text x="172" y="303" font-size="10" fill="#e2903a" text-anchor="middle">every change must be mirrored by hand</text>

  <!-- right panel: vertical flow -->
  <g font-size="11" text-anchor="middle">
    <rect x="390" y="48" width="180" height="34" rx="4" fill="none" stroke="currentColor"/>
    <text x="480" y="69" fill="currentColor">replayable log</text>

    <rect x="390" y="127" width="180" height="48" rx="4" fill="none" stroke="#e2903a"/>
    <text x="480" y="146" fill="#e2903a">one stream engine, one codebase</text>
    <text x="480" y="160" fill="#e2903a" font-size="10">a bounded input = a batch run</text>

    <rect x="390" y="220" width="180" height="34" rx="4" fill="none" stroke="currentColor"/>
    <text x="480" y="241" fill="currentColor">derived features / views</text>
  </g>
  <line x1="480" y1="82" x2="480" y2="124" stroke="currentColor" stroke-width="1.4" marker-end="url(#lu-c)"/>
  <line x1="480" y1="175" x2="480" y2="217" stroke="currentColor" stroke-width="1.4" marker-end="url(#lu-c)"/>

  <!-- replay loop -->
  <path d="M 570 145 C 605 140 605 90 573 70" fill="none" stroke="#e2903a" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#lu-a)"/>
  <text x="600" y="115" font-size="10" fill="#e2903a" text-anchor="middle">reprocess:</text>
  <text x="600" y="128" font-size="10" fill="#e2903a" text-anchor="middle">replay from an</text>
  <text x="600" y="141" font-size="10" fill="#e2903a" text-anchor="middle">older offset</text>
</svg>

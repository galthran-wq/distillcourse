<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <marker id="ss-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4c8dd6"/>
    </marker>
    <marker id="ss-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e2903a"/>
    </marker>
  </defs>

  <!-- source log -->
  <g font-size="11" text-anchor="middle">
    <rect x="16" y="120" width="116" height="48" rx="4" fill="none" stroke="currentColor"/>
    <text x="74" y="140" fill="currentColor">order events</text>
    <text x="74" y="154" fill="currentColor" opacity="0.55" font-size="10">(log topic)</text>
  </g>

  <!-- batch path (blue) -->
  <g font-size="11" text-anchor="middle">
    <rect x="182" y="40" width="128" height="40" rx="4" fill="none" stroke="#4c8dd6"/>
    <text x="246" y="57" fill="#4c8dd6">nightly batch job</text>
    <text x="246" y="71" fill="#4c8dd6" font-size="10">full history, rerunnable</text>
    <rect x="352" y="40" width="128" height="40" rx="4" fill="none" stroke="#4c8dd6"/>
    <text x="416" y="57" fill="#4c8dd6">warehouse</text>
    <text x="416" y="71" fill="#4c8dd6" font-size="10">offline store</text>
  </g>
  <line x1="132" y1="132" x2="179" y2="66" stroke="#4c8dd6" stroke-width="1.4" marker-end="url(#ss-b)"/>
  <line x1="310" y1="60" x2="349" y2="60" stroke="#4c8dd6" stroke-width="1.4" marker-end="url(#ss-b)"/>
  <path d="M 480 60 C 520 60 530 100 542 122" fill="none" stroke="#4c8dd6" stroke-width="1.4" marker-end="url(#ss-b)"/>
  <text x="500" y="32" font-size="10" fill="#4c8dd6" text-anchor="middle">mean prep time, per store &#8212; static, updated nightly</text>

  <!-- streaming path (amber) -->
  <g font-size="11" text-anchor="middle">
    <rect x="182" y="212" width="128" height="40" rx="4" fill="none" stroke="#e2903a"/>
    <text x="246" y="229" fill="#e2903a">stream job</text>
    <text x="246" y="243" fill="#e2903a" font-size="10">10-min window</text>
    <rect x="352" y="212" width="128" height="40" rx="4" fill="none" stroke="#e2903a"/>
    <text x="416" y="229" fill="#e2903a">online KV store</text>
    <text x="416" y="243" fill="#e2903a" font-size="10">point reads, ~ms</text>
  </g>
  <line x1="132" y1="156" x2="179" y2="226" stroke="#e2903a" stroke-width="1.4" marker-end="url(#ss-a)"/>
  <line x1="310" y1="232" x2="349" y2="232" stroke="#e2903a" stroke-width="1.4" marker-end="url(#ss-a)"/>
  <path d="M 480 232 C 520 232 530 192 542 170" fill="none" stroke="#e2903a" stroke-width="1.4" marker-end="url(#ss-a)"/>
  <text x="500" y="272" font-size="10" fill="#e2903a" text-anchor="middle">orders in the last 10 min &#8212; streaming, seconds old</text>

  <!-- the meeting point -->
  <g font-size="11" text-anchor="middle">
    <rect x="536" y="120" width="94" height="52" rx="4" fill="none" stroke="currentColor"/>
    <text x="583" y="141" fill="currentColor">ETA model,</text>
    <text x="583" y="155" fill="currentColor">one request</text>
  </g>
</svg>

<svg viewBox="0 0 640 250" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <marker id="stj-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e2903a"/>
    </marker>
    <marker id="stj-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4c8dd6"/>
    </marker>
  </defs>

  <!-- incoming click events -->
  <text x="85" y="52" font-size="11" fill="#e2903a" text-anchor="middle">click events</text>
  <rect x="26" y="62" width="14" height="14" rx="2" fill="none" stroke="#e2903a"/>
  <rect x="52" y="62" width="14" height="14" rx="2" fill="none" stroke="#e2903a"/>
  <rect x="78" y="62" width="14" height="14" rx="2" fill="none" stroke="#e2903a"/>
  <line x1="98" y1="69" x2="177" y2="69" stroke="#e2903a" stroke-width="1.4" marker-end="url(#stj-a)"/>

  <!-- processor with local copy -->
  <rect x="180" y="36" width="220" height="120" rx="6" fill="none" stroke="currentColor"/>
  <text x="290" y="58" font-size="11" fill="currentColor" text-anchor="middle">stream processor</text>
  <g font-size="11" text-anchor="middle">
    <rect x="205" y="76" width="170" height="52" rx="4" fill="none" stroke="#4c8dd6"/>
    <text x="290" y="97" fill="#4c8dd6">local copy of</text>
    <text x="290" y="112" fill="#4c8dd6">user_profiles</text>
  </g>

  <!-- enriched output -->
  <line x1="400" y1="69" x2="577" y2="69" stroke="#e2903a" stroke-width="1.4" marker-end="url(#stj-a)"/>
  <text x="490" y="52" font-size="11" fill="#e2903a" text-anchor="middle">click + profile</text>
  <text x="490" y="88" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">profile as of (now &#8722; lag)</text>

  <!-- the table and its CDC feed -->
  <g font-size="11" text-anchor="middle">
    <rect x="40" y="190" width="180" height="44" rx="4" fill="none" stroke="currentColor"/>
    <text x="130" y="208" fill="currentColor">user_profiles table</text>
    <text x="130" y="223" fill="currentColor" opacity="0.55" font-size="10">OLTP leader</text>
  </g>
  <path d="M 222 204 C 268 200 278 168 286 132" fill="none" stroke="#4c8dd6" stroke-width="1.4" marker-end="url(#stj-b)"/>
  <text x="288" y="176" font-size="10" fill="#4c8dd6" text-anchor="start">CDC stream</text>
  <text x="288" y="189" font-size="10" fill="#4c8dd6" text-anchor="start">copy follows by its consumer lag</text>

  <!-- the lag becomes skew -->
  <text x="480" y="204" font-size="10" fill="#e2903a" text-anchor="middle">serving joined this older row;</text>
  <text x="480" y="218" font-size="10" fill="#e2903a" text-anchor="middle">training later joins the fresher one: skew</text>
</svg>

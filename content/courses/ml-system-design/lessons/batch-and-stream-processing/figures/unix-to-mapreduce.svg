<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <marker id="um-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- column headers -->
  <text x="170" y="24" font-size="12" font-weight="bold" fill="currentColor" text-anchor="middle">Unix pipeline</text>
  <text x="500" y="24" font-size="12" font-weight="bold" fill="currentColor" text-anchor="middle">MapReduce job</text>

  <!-- step badges -->
  <g font-size="11" text-anchor="middle">
    <circle cx="32" cy="70" r="11" fill="none" stroke="currentColor"/>
    <text x="32" y="74" fill="currentColor">1</text>
    <circle cx="32" cy="130" r="11" fill="none" stroke="currentColor"/>
    <text x="32" y="134" fill="currentColor">2</text>
    <circle cx="32" cy="190" r="11" fill="none" stroke="#e2903a"/>
    <text x="32" y="194" fill="#e2903a">3</text>
    <circle cx="32" cy="250" r="11" fill="none" stroke="currentColor"/>
    <text x="32" y="254" fill="currentColor">4</text>
  </g>

  <!-- left column: unix commands -->
  <g font-size="12" text-anchor="middle" font-family="ui-monospace, monospace">
    <rect x="70" y="53" width="200" height="34" rx="4" fill="none" stroke="currentColor"/>
    <text x="170" y="74" fill="currentColor">cat access.log</text>
    <rect x="70" y="113" width="200" height="34" rx="4" fill="none" stroke="currentColor"/>
    <text x="170" y="134" fill="currentColor">awk '{print $7}'</text>
    <rect x="70" y="173" width="200" height="34" rx="4" fill="none" stroke="#e2903a"/>
    <text x="170" y="194" fill="#e2903a">sort</text>
    <rect x="70" y="233" width="200" height="34" rx="4" fill="none" stroke="currentColor"/>
    <text x="170" y="254" fill="currentColor">uniq -c</text>
  </g>
  <line x1="170" y1="87" x2="170" y2="110" stroke="currentColor" stroke-width="1.4" marker-end="url(#um-c)"/>
  <line x1="170" y1="147" x2="170" y2="170" stroke="currentColor" stroke-width="1.4" marker-end="url(#um-c)"/>
  <line x1="170" y1="207" x2="170" y2="230" stroke="currentColor" stroke-width="1.4" marker-end="url(#um-c)"/>

  <!-- right column: mapreduce steps -->
  <g font-size="11" text-anchor="middle">
    <rect x="390" y="53" width="220" height="34" rx="4" fill="none" stroke="currentColor"/>
    <text x="500" y="70" fill="currentColor">input format parser</text>
    <text x="500" y="82" fill="currentColor" opacity="0.55" font-size="10">file &#8594; records (one per line)</text>
    <rect x="390" y="113" width="220" height="34" rx="4" fill="none" stroke="currentColor"/>
    <text x="500" y="130" fill="currentColor">mapper (your code)</text>
    <text x="500" y="142" fill="currentColor" opacity="0.55" font-size="10">record &#8594; (key, value)</text>
    <rect x="390" y="173" width="220" height="34" rx="4" fill="none" stroke="#e2903a"/>
    <text x="500" y="190" fill="#e2903a">shuffle (the framework's)</text>
    <text x="500" y="202" fill="#e2903a" opacity="0.75" font-size="10">sort by key &#8594; same key adjacent</text>
    <rect x="390" y="233" width="220" height="34" rx="4" fill="none" stroke="currentColor"/>
    <text x="500" y="250" fill="currentColor">reducer (your code)</text>
    <text x="500" y="262" fill="currentColor" opacity="0.55" font-size="10">adjacent same-key records &#8594; output</text>
  </g>
  <line x1="500" y1="87" x2="500" y2="110" stroke="currentColor" stroke-width="1.4" marker-end="url(#um-c)"/>
  <line x1="500" y1="147" x2="500" y2="170" stroke="currentColor" stroke-width="1.4" marker-end="url(#um-c)"/>
  <line x1="500" y1="207" x2="500" y2="230" stroke="currentColor" stroke-width="1.4" marker-end="url(#um-c)"/>

  <!-- toy data flowing between the columns -->
  <g font-size="10" text-anchor="middle" fill="currentColor" opacity="0.55" font-family="ui-monospace, monospace">
    <text x="330" y="134">/a  /b  /a</text>
    <text x="330" y="194">/a  /a  /b</text>
    <text x="330" y="254">2 /a &#183; 1 /b</text>
  </g>
  <text x="330" y="105" font-size="10" text-anchor="middle" fill="currentColor" opacity="0.55">the toy log, after each step</text>

  <!-- shared output -->
  <text x="320" y="300" font-size="11" text-anchor="middle" fill="currentColor">same four steps, same output &#8212; one runs on a laptop, the other on ten thousand machines</text>
</svg>

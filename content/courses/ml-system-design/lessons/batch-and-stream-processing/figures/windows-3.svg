<svg viewBox="0 0 640 250" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="60" y="20" font-size="12" font-weight="bold" fill="currentColor">sliding (30 min): a window ends at every event</text>
  <text x="60" y="38" font-size="11" fill="currentColor" opacity="0.55">feature: mean prep time over the 30 min before each order</text>

  <!-- axis and ticks -->
  <line x1="60" y1="70" x2="600" y2="70" stroke="currentColor" stroke-width="1.2"/>
  <g font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">
    <line x1="60" y1="70" x2="60" y2="76" stroke="currentColor"/>
    <line x1="150" y1="70" x2="150" y2="76" stroke="currentColor"/>
    <line x1="240" y1="70" x2="240" y2="76" stroke="currentColor"/>
    <line x1="330" y1="70" x2="330" y2="76" stroke="currentColor"/>
    <line x1="420" y1="70" x2="420" y2="76" stroke="currentColor"/>
    <line x1="510" y1="70" x2="510" y2="76" stroke="currentColor"/>
    <line x1="600" y1="70" x2="600" y2="76" stroke="currentColor"/>
    <text x="60" y="90">0</text><text x="150" y="90">10</text><text x="240" y="90">20</text>
    <text x="330" y="90">30</text><text x="420" y="90">40</text><text x="510" y="90">50</text>
    <text x="600" y="90">60 min</text>
  </g>

  <!-- the same 12 events in every frame -->
  <g fill="#4c8dd6">
    <circle cx="78" cy="70" r="4"/><circle cx="105" cy="70" r="4"/><circle cx="132" cy="70" r="4"/>
    <circle cx="177" cy="70" r="4"/><circle cx="240" cy="70" r="4"/><circle cx="267" cy="70" r="4"/>
    <circle cx="294" cy="70" r="4"/><circle cx="420" cy="70" r="4"/><circle cx="447" cy="70" r="4"/>
    <circle cx="474" cy="70" r="4"/><circle cx="501" cy="70" r="4"/><circle cx="582" cy="70" r="4"/>
  </g>

  <!-- rings around the anchoring events -->
  <circle cx="294" cy="70" r="8" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <circle cx="474" cy="70" r="8" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <circle cx="582" cy="70" r="8" fill="none" stroke="#e2903a" stroke-width="1.5"/>

  <!-- three of twelve sliding windows -->
  <g font-size="11">
    <rect x="61" y="105" width="233" height="22" rx="4" fill="none" stroke="#e2903a" stroke-dasharray="4 3"/>
    <text x="286" y="120" fill="#e2903a" text-anchor="end">7</text>
    <rect x="204" y="132" width="270" height="22" rx="4" fill="none" stroke="#e2903a"/>
    <text x="466" y="147" fill="#e2903a" text-anchor="end">6</text>
    <rect x="312" y="159" width="270" height="22" rx="4" fill="none" stroke="#e2903a"/>
    <text x="574" y="174" fill="#e2903a" text-anchor="end">5</text>
  </g>
  <text x="330" y="210" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">one window per event (ringed), ending at it &#8212; three of twelve drawn</text>
</svg>

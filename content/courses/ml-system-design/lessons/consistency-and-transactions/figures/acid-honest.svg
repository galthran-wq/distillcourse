<svg viewBox="0 0 620 250" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="11">
  <!-- four letter boxes -->
  <rect x="20" y="14" width="130" height="40" rx="5" fill="none" stroke="currentColor" opacity="0.7"/>
  <text x="85" y="39" text-anchor="middle" fill="currentColor" font-size="13" font-weight="600">A · atomicity</text>
  <rect x="170" y="14" width="130" height="40" rx="5" fill="none" stroke="currentColor" opacity="0.7"/>
  <text x="235" y="39" text-anchor="middle" fill="currentColor" font-size="13" font-weight="600">C · consistency</text>
  <rect x="320" y="14" width="130" height="40" rx="5" fill="none" stroke="#e2903a" stroke-width="2"/>
  <text x="385" y="39" text-anchor="middle" fill="#e2903a" font-size="13" font-weight="600">I · isolation</text>
  <rect x="470" y="14" width="130" height="40" rx="5" fill="none" stroke="currentColor" opacity="0.7"/>
  <text x="535" y="39" text-anchor="middle" fill="currentColor" font-size="13" font-weight="600">D · durability</text>
  <!-- glosses -->
  <text x="85" y="78" text-anchor="middle" fill="currentColor" opacity="0.55">abortability: a fault</text>
  <text x="85" y="92" text-anchor="middle" fill="currentColor" opacity="0.55">rolls the whole unit back,</text>
  <text x="85" y="106" text-anchor="middle" fill="currentColor" opacity="0.55">so retry is safe</text>
  <text x="235" y="78" text-anchor="middle" fill="currentColor" opacity="0.55">the application's</text>
  <text x="235" y="92" text-anchor="middle" fill="currentColor" opacity="0.55">invariants; the engine</text>
  <text x="235" y="106" text-anchor="middle" fill="currentColor" opacity="0.55">cannot check them</text>
  <text x="385" y="78" text-anchor="middle" fill="currentColor" opacity="0.55">graded: sold in levels</text>
  <text x="535" y="78" text-anchor="middle" fill="currentColor" opacity="0.55">risk reduction: a log,</text>
  <text x="535" y="92" text-anchor="middle" fill="currentColor" opacity="0.55">replicas — a stack of</text>
  <text x="535" y="106" text-anchor="middle" fill="currentColor" opacity="0.55">partial measures</text>
  <!-- the isolation dial -->
  <line x1="385" y1="114" x2="385" y2="224" stroke="currentColor" opacity="0.4"/>
  <circle cx="385" cy="122" r="4" fill="currentColor"/>
  <text x="395" y="126" fill="currentColor">serializable — the textbook meaning</text>
  <circle cx="385" cy="156" r="4" fill="currentColor"/>
  <text x="395" y="160" fill="currentColor">snapshot isolation</text>
  <circle cx="385" cy="190" r="4" fill="#e2903a"/>
  <text x="395" y="194" fill="#e2903a" font-weight="600">read committed — common default</text>
  <circle cx="385" cy="224" r="4" fill="currentColor" opacity="0.55"/>
  <text x="395" y="228" fill="currentColor" opacity="0.55">read uncommitted</text>
  <text x="375" y="126" text-anchor="end" fill="currentColor" opacity="0.55">stronger</text>
  <text x="375" y="228" text-anchor="end" fill="currentColor" opacity="0.55">weaker</text>
</svg>

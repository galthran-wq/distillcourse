<svg viewBox="0 0 560 180" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <!-- lane labels -->
  <text x="10" y="54" fill="currentColor">T1: deliver email</text>
  <text x="10" y="124" fill="currentColor">T2: render mailbox</text>
  <!-- lanes -->
  <line x1="130" y1="50" x2="540" y2="50" stroke="currentColor" opacity="0.4"/>
  <line x1="130" y1="120" x2="540" y2="120" stroke="currentColor" opacity="0.4"/>
  <!-- time arrow -->
  <line x1="130" y1="165" x2="530" y2="165" stroke="currentColor" opacity="0.55"/>
  <path d="M530 165 l-7 -3 v6 z" fill="currentColor" opacity="0.55"/>
  <text x="500" y="158" fill="currentColor" opacity="0.55">time</text>
  <!-- T1 events -->
  <line x1="175" y1="42" x2="175" y2="58" stroke="currentColor" stroke-width="2"/>
  <text x="175" y="32" text-anchor="middle" fill="currentColor">insert email</text>
  <line x1="400" y1="42" x2="400" y2="58" stroke="currentColor" stroke-width="2"/>
  <text x="400" y="32" text-anchor="middle" fill="currentColor">counter +1</text>
  <line x1="480" y1="42" x2="480" y2="58" stroke="currentColor" stroke-width="2"/>
  <text x="480" y="32" text-anchor="middle" fill="currentColor" font-weight="bold">commit</text>
  <!-- visibility guide -->
  <line x1="175" y1="58" x2="265" y2="112" stroke="#e2903a" stroke-dasharray="3 3" opacity="0.7"/>
  <!-- T2 event -->
  <line x1="265" y1="112" x2="265" y2="128" stroke="#e2903a" stroke-width="2"/>
  <ellipse cx="265" cy="120" rx="16" ry="13" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <text x="265" y="146" text-anchor="middle" fill="currentColor">reads: new email shown, counter = 0</text>
  <text x="265" y="98" text-anchor="middle" fill="#e2903a">sees T1's uncommitted insert</text>
</svg>

<svg viewBox="0 0 560 190" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <!-- lane labels -->
  <text x="10" y="54" fill="currentColor">T1: increment</text>
  <text x="10" y="124" fill="currentColor">T2: increment</text>
  <!-- lanes -->
  <line x1="110" y1="50" x2="540" y2="50" stroke="currentColor" opacity="0.4"/>
  <line x1="110" y1="120" x2="540" y2="120" stroke="currentColor" opacity="0.4"/>
  <!-- T1 events -->
  <line x1="150" y1="42" x2="150" y2="58" stroke="currentColor" stroke-width="2"/>
  <text x="150" y="32" text-anchor="middle" fill="currentColor">read x → 42</text>
  <line x1="300" y1="42" x2="300" y2="58" stroke="currentColor" stroke-width="2"/>
  <text x="300" y="32" text-anchor="middle" fill="currentColor">write x ← 43</text>
  <line x1="360" y1="42" x2="360" y2="58" stroke="currentColor" stroke-width="2"/>
  <text x="365" y="32" text-anchor="middle" fill="currentColor" font-weight="bold">commit</text>
  <!-- T2 events -->
  <line x1="200" y1="112" x2="200" y2="128" stroke="currentColor" stroke-width="2"/>
  <text x="200" y="146" text-anchor="middle" fill="currentColor">read x → 42</text>
  <line x1="440" y1="112" x2="440" y2="128" stroke="#e2903a" stroke-width="2"/>
  <ellipse cx="440" cy="120" rx="15" ry="12" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <text x="440" y="146" text-anchor="middle" fill="#e2903a">write x ← 43</text>
  <text x="440" y="162" text-anchor="middle" fill="currentColor" opacity="0.55">clobbers T1's increment</text>
  <!-- takeaway -->
  <text x="480" y="70" text-anchor="middle" fill="currentColor" font-weight="bold">final x = 43</text>
  <text x="480" y="86" text-anchor="middle" fill="currentColor" opacity="0.55">two increments ran</text>
</svg>

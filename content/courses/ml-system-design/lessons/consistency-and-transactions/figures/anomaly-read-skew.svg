<svg viewBox="0 0 560 190" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <!-- lane labels -->
  <text x="10" y="54" fill="currentColor">Alice: read balances</text>
  <text x="10" y="124" fill="currentColor">Transfer: $100 to acct 1</text>
  <!-- lanes -->
  <line x1="145" y1="50" x2="540" y2="50" stroke="currentColor" opacity="0.4"/>
  <line x1="145" y1="120" x2="540" y2="120" stroke="currentColor" opacity="0.4"/>
  <!-- Alice events -->
  <line x1="185" y1="42" x2="185" y2="58" stroke="#4c8dd6" stroke-width="2"/>
  <text x="185" y="32" text-anchor="middle" fill="#4c8dd6">acct 1 → $500</text>
  <line x1="450" y1="42" x2="450" y2="58" stroke="#e2903a" stroke-width="2"/>
  <ellipse cx="450" cy="50" rx="14" ry="12" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <text x="450" y="32" text-anchor="middle" fill="#e2903a">acct 2 → $400</text>
  <!-- transfer events -->
  <line x1="255" y1="112" x2="255" y2="128" stroke="currentColor" stroke-width="2"/>
  <text x="255" y="143" text-anchor="middle" fill="currentColor">acct 1 ← $600</text>
  <line x1="335" y1="112" x2="335" y2="128" stroke="currentColor" stroke-width="2"/>
  <text x="335" y="160" text-anchor="middle" fill="currentColor">acct 2 ← $400</text>
  <line x1="390" y1="112" x2="390" y2="128" stroke="currentColor" stroke-width="2"/>
  <text x="390" y="143" text-anchor="middle" fill="currentColor" font-weight="bold">commit</text>
  <!-- takeaway -->
  <text x="452" y="80" text-anchor="middle" fill="#e2903a" font-weight="bold">Alice's total: $900</text>
  <text x="452" y="96" text-anchor="middle" fill="currentColor" opacity="0.55">true total at every instant: $1,000</text>
</svg>

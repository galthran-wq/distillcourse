<svg viewBox="0 0 620 240" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <!-- quorum loops -->
  <rect x="48" y="88" width="304" height="64" rx="32" fill="none" stroke="#4c8dd6" stroke-width="1.5"/>
  <rect x="268" y="80" width="304" height="80" rx="38" fill="none" stroke="#e2903a" stroke-width="1.5" stroke-dasharray="5 3"/>
  <!-- quorum labels -->
  <text x="200" y="40" text-anchor="middle" fill="#4c8dd6" font-weight="600">election quorum, epoch 25</text>
  <text x="200" y="56" text-anchor="middle" fill="#4c8dd6">{n1, n2, n3} voted for the new leader</text>
  <text x="420" y="210" text-anchor="middle" fill="#e2903a" font-weight="600">decision quorum, epoch 24</text>
  <text x="420" y="226" text-anchor="middle" fill="#e2903a">the deposed leader asks {n3, n4, n5} to approve a write</text>
  <!-- nodes -->
  <circle cx="90" cy="120" r="17" fill="none" stroke="currentColor"/>
  <text x="90" y="124" text-anchor="middle" fill="currentColor">n1</text>
  <circle cx="200" cy="120" r="17" fill="none" stroke="currentColor"/>
  <text x="200" y="124" text-anchor="middle" fill="currentColor">n2</text>
  <circle cx="310" cy="120" r="17" fill="none" stroke="#5aa46a" stroke-width="2"/>
  <text x="310" y="124" text-anchor="middle" fill="#5aa46a" font-weight="600">n3</text>
  <circle cx="420" cy="120" r="17" fill="none" stroke="currentColor"/>
  <text x="420" y="124" text-anchor="middle" fill="currentColor">n4</text>
  <circle cx="530" cy="120" r="17" fill="none" stroke="currentColor"/>
  <text x="530" y="124" text-anchor="middle" fill="currentColor">n5</text>
  <!-- last epoch each node has seen -->
  <text x="90" y="149" text-anchor="middle" fill="currentColor" opacity="0.55" font-size="10">saw e25</text>
  <text x="200" y="149" text-anchor="middle" fill="currentColor" opacity="0.55" font-size="10">saw e25</text>
  <text x="310" y="149" text-anchor="middle" fill="#5aa46a" font-size="10" font-weight="600">saw e25</text>
  <text x="420" y="149" text-anchor="middle" fill="currentColor" opacity="0.55" font-size="10">saw e24</text>
  <text x="530" y="149" text-anchor="middle" fill="currentColor" opacity="0.55" font-size="10">saw e24</text>
  <!-- overlap annotation -->
  <text x="310" y="182" text-anchor="middle" fill="#5aa46a">n3 sits in both quorums and knows epoch 25: it rejects the epoch-24 proposal</text>
</svg>

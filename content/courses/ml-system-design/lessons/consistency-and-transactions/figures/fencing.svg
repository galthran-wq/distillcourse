<svg viewBox="0 0 560 220" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <!-- lane labels -->
  <text x="10" y="59" fill="currentColor">client 1</text>
  <text x="10" y="124" fill="currentColor">client 2</text>
  <text x="10" y="189" fill="currentColor">storage</text>
  <!-- lanes -->
  <line x1="80" y1="55" x2="540" y2="55" stroke="currentColor" opacity="0.4"/>
  <line x1="80" y1="120" x2="540" y2="120" stroke="currentColor" opacity="0.4"/>
  <line x1="80" y1="185" x2="540" y2="185" stroke="currentColor" opacity="0.4"/>
  <!-- client 1: lease with token 33, then pause -->
  <rect x="95" y="46" width="115" height="18" rx="4" fill="none" stroke="#4c8dd6" stroke-width="1.5"/>
  <text x="152" y="36" text-anchor="middle" fill="#4c8dd6">lease, token 33</text>
  <rect x="210" y="46" width="185" height="18" rx="4" fill="currentColor" opacity="0.18"/>
  <text x="302" y="36" text-anchor="middle" fill="currentColor" opacity="0.55">stop-the-world pause</text>
  <!-- client 2 acquires token 34 and writes -->
  <line x1="290" y1="112" x2="290" y2="128" stroke="currentColor" stroke-width="2"/>
  <text x="290" y="143" text-anchor="middle" fill="currentColor">lease, token 34</text>
  <line x1="345" y1="120" x2="345" y2="180" stroke="#5aa46a" stroke-width="1.5"/>
  <path d="M345 180 l-3 -7 h6 z" fill="#5aa46a"/>
  <text x="348" y="165" fill="#5aa46a">write + 34 ✓</text>
  <!-- client 1 wakes, writes with stale token -->
  <line x1="465" y1="55" x2="465" y2="180" stroke="#e2903a" stroke-width="1.5" stroke-dasharray="4 3"/>
  <path d="M465 180 l-3 -7 h6 z" fill="#e2903a"/>
  <text x="468" y="90" fill="#e2903a">write + 33</text>
  <!-- storage outcome -->
  <text x="300" y="207" text-anchor="middle" fill="#5aa46a">accepted; max token = 34</text>
  <text x="480" y="207" text-anchor="middle" fill="#e2903a" font-weight="bold">rejected: 33 &lt; 34</text>
</svg>

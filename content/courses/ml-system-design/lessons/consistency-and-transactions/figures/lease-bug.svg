<svg viewBox="0 0 560 220" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <!-- lane labels -->
  <text x="10" y="59" fill="currentColor">client 1</text>
  <text x="10" y="124" fill="currentColor">client 2</text>
  <text x="10" y="189" fill="currentColor">storage</text>
  <!-- lanes -->
  <line x1="80" y1="55" x2="540" y2="55" stroke="currentColor" opacity="0.4"/>
  <line x1="80" y1="120" x2="540" y2="120" stroke="currentColor" opacity="0.4"/>
  <line x1="80" y1="185" x2="540" y2="185" stroke="currentColor" opacity="0.4"/>
  <!-- client 1: lease held, then pause -->
  <rect x="95" y="46" width="115" height="18" rx="4" fill="none" stroke="#4c8dd6" stroke-width="1.5"/>
  <text x="152" y="36" text-anchor="middle" fill="#4c8dd6">holds lease</text>
  <rect x="210" y="46" width="185" height="18" rx="4" fill="currentColor" opacity="0.18"/>
  <text x="302" y="36" text-anchor="middle" fill="currentColor" opacity="0.55">stop-the-world pause</text>
  <text x="240" y="80" text-anchor="middle" fill="currentColor" opacity="0.55" font-size="11">lease expires meanwhile</text>
  <!-- client 2 acquires and writes -->
  <line x1="300" y1="112" x2="300" y2="128" stroke="currentColor" stroke-width="2"/>
  <text x="300" y="143" text-anchor="middle" fill="currentColor">acquires lease</text>
  <line x1="365" y1="120" x2="365" y2="180" stroke="currentColor" stroke-width="1.5"/>
  <path d="M365 180 l-3 -7 h6 z" fill="currentColor"/>
  <text x="368" y="165" fill="currentColor">write</text>
  <!-- client 1 wakes and writes -->
  <line x1="450" y1="55" x2="450" y2="180" stroke="#e2903a" stroke-width="1.5"/>
  <path d="M450 180 l-3 -7 h6 z" fill="#e2903a"/>
  <text x="453" y="90" fill="#e2903a">write (believes</text>
  <text x="453" y="104" fill="#e2903a">lease still valid)</text>
  <!-- storage outcome -->
  <text x="400" y="207" text-anchor="middle" fill="#e2903a" font-weight="bold">both writes accepted → file corrupted</text>
</svg>

<svg viewBox="0 0 560 235" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <!-- legend -->
  <text x="30" y="22" fill="currentColor" opacity="0.55">bar = request in flight; dot = the instant the operation takes effect</text>
  <!-- lane labels -->
  <text x="10" y="69" fill="currentColor">client A</text>
  <text x="10" y="134" fill="currentColor">client B</text>
  <text x="10" y="199" fill="currentColor">client C</text>
  <!-- A: read -->
  <rect x="230" y="56" width="100" height="18" rx="4" fill="none" stroke="currentColor" opacity="0.7"/>
  <text x="280" y="47" text-anchor="middle" fill="currentColor">read(x) → 1</text>
  <circle cx="295" cy="65" r="4" fill="#e2903a"/>
  <!-- B: read, begins after A's response -->
  <rect x="360" y="121" width="115" height="18" rx="4" fill="none" stroke="currentColor" opacity="0.7"/>
  <text x="418" y="156" text-anchor="middle" fill="currentColor">read(x) → must be 1</text>
  <circle cx="410" cy="130" r="4" fill="#e2903a"/>
  <!-- C: write -->
  <rect x="120" y="186" width="220" height="18" rx="4" fill="none" stroke="currentColor" opacity="0.7"/>
  <text x="230" y="221" text-anchor="middle" fill="currentColor">write(x ← 1)</text>
  <circle cx="270" cy="195" r="4" fill="#e2903a"/>
  <!-- guide: B starts after A returned -->
  <line x1="335" y1="69" x2="358" y2="121" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5"/>
  <text x="365" y="95" fill="currentColor" opacity="0.55" font-size="11">B begins after A's</text>
  <text x="365" y="108" fill="currentColor" opacity="0.55" font-size="11">response returned</text>
  <!-- ordering polyline through effect points -->
  <polyline points="270,195 295,65 410,130" fill="none" stroke="#e2903a" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.8"/>
  <text x="110" y="134" fill="#e2903a">effect points, in order</text>
</svg>

<svg viewBox="0 0 560 270" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <!-- lifeline headers -->
  <text x="110" y="22" text-anchor="middle" fill="currentColor" font-weight="bold">coordinator</text>
  <text x="330" y="22" text-anchor="middle" fill="currentColor" font-weight="bold">participant 1</text>
  <text x="490" y="22" text-anchor="middle" fill="currentColor" font-weight="bold">participant 2</text>
  <!-- lifelines -->
  <line x1="110" y1="30" x2="110" y2="240" stroke="currentColor" opacity="0.4"/>
  <line x1="330" y1="30" x2="330" y2="240" stroke="currentColor" opacity="0.4"/>
  <line x1="490" y1="30" x2="490" y2="240" stroke="currentColor" opacity="0.4"/>
  <!-- blocking window on participants -->
  <rect x="322" y="90" width="176" height="105" fill="#e2903a" opacity="0.12"/>
  <text x="412" y="138" text-anchor="middle" fill="#e2903a" font-size="11">in doubt: can neither commit nor</text>
  <text x="412" y="152" text-anchor="middle" fill="#e2903a" font-size="11">abort; row locks stay held</text>
  <!-- phase 1: prepare -->
  <line x1="110" y1="42" x2="326" y2="56" stroke="currentColor" stroke-width="1.5"/>
  <path d="M326 56 l-8 -1 l3 -5 z" fill="currentColor"/>
  <line x1="110" y1="42" x2="486" y2="64" stroke="currentColor" stroke-width="1.5"/>
  <path d="M486 64 l-8 -1 l3 -5 z" fill="currentColor"/>
  <text x="195" y="38" fill="currentColor">prepare?</text>
  <!-- yes replies -->
  <line x1="330" y1="90" x2="115" y2="104" stroke="#4c8dd6" stroke-width="1.5"/>
  <path d="M115 104 l8 1 l-3 5 z" fill="#4c8dd6"/>
  <line x1="490" y1="97" x2="115" y2="117" stroke="#4c8dd6" stroke-width="1.5"/>
  <path d="M115 117 l8 1 l-3 5 z" fill="#4c8dd6"/>
  <text x="165" y="90" fill="#4c8dd6">yes (a promise)</text>
  <!-- point of no return 1 -->
  <circle cx="330" cy="90" r="5" fill="#e2903a"/>
  <circle cx="490" cy="97" r="5" fill="#e2903a"/>
  <text x="338" y="82" fill="#e2903a" font-size="11">① surrenders the right to abort</text>
  <!-- point of no return 2 -->
  <circle cx="110" cy="140" r="5" fill="#e2903a"/>
  <text x="14" y="136" fill="#e2903a" font-size="11">② decision written</text>
  <text x="14" y="150" fill="#e2903a" font-size="11">to log: commit point</text>
  <!-- phase 2: commit -->
  <line x1="110" y1="162" x2="326" y2="186" stroke="currentColor" stroke-width="1.5"/>
  <path d="M326 186 l-8 -1 l3 -5 z" fill="currentColor"/>
  <line x1="110" y1="162" x2="486" y2="176" stroke="currentColor" stroke-width="1.5"/>
  <path d="M486 176 l-8 -1 l3 -5 z" fill="currentColor"/>
  <text x="125" y="180" fill="currentColor">commit (retried forever)</text>
  <!-- footnote -->
  <text x="280" y="260" text-anchor="middle" fill="currentColor" opacity="0.55">a coordinator crash between ① and delivery leaves participants waiting</text>
</svg>

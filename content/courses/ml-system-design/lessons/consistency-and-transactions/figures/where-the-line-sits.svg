<svg viewBox="0 0 560 250" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <!-- left column: needs coordination -->
  <rect x="30" y="30" width="235" height="175" rx="6" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <text x="147" y="52" text-anchor="middle" fill="#e2903a" font-weight="bold">needs linearizable coordination</text>
  <text x="46" y="82" fill="currentColor">· registry: production-model pointer</text>
  <text x="46" y="104" fill="currentColor">· scheduler: one active run (lock)</text>
  <text x="46" y="126" fill="currentColor">· quota and billing ledgers</text>
  <text x="46" y="148" fill="currentColor">· partition → node assignment</text>
  <text x="46" y="170" fill="currentColor">· leader election everywhere</text>
  <text x="147" y="196" text-anchor="middle" fill="currentColor" opacity="0.55" font-size="11">two nodes disagreeing = corruption</text>
  <!-- divider -->
  <line x1="280" y1="25" x2="280" y2="215" stroke="currentColor" stroke-dasharray="4 4" opacity="0.5"/>
  <text x="280" y="238" text-anchor="middle" fill="currentColor" opacity="0.55">the line</text>
  <!-- right column: tolerates eventual -->
  <rect x="295" y="30" width="235" height="175" rx="6" fill="none" stroke="#4c8dd6" stroke-width="1.5"/>
  <text x="412" y="52" text-anchor="middle" fill="#4c8dd6" font-weight="bold">tolerates eventual consistency</text>
  <text x="311" y="82" fill="currentColor">· feature-store reads</text>
  <text x="311" y="104" fill="currentColor">· prediction and feature caches</text>
  <text x="311" y="126" fill="currentColor">· metrics, dashboards, drift stats</text>
  <text x="311" y="148" fill="currentColor">· training-data and warehouse reads</text>
  <text x="311" y="170" fill="currentColor">· search and embedding indexes</text>
  <text x="412" y="196" text-anchor="middle" fill="currentColor" opacity="0.55" font-size="11">staleness only, bounded and monitored</text>
</svg>

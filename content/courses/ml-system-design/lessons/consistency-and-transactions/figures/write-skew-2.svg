<svg viewBox="0 0 560 240" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <!-- shift board -->
  <rect x="150" y="12" width="260" height="46" rx="5" fill="none" stroke="currentColor" opacity="0.7"/>
  <text x="280" y="31" text-anchor="middle" fill="currentColor">on call: Alice ✓ &#160; Bob ✓ &#160; (2)</text>
  <text x="280" y="49" text-anchor="middle" fill="currentColor" opacity="0.55">invariant: at least 1 doctor on call</text>
  <!-- lane labels -->
  <text x="10" y="129" fill="currentColor">Alice's txn</text>
  <text x="10" y="194" fill="currentColor">Bob's txn</text>
  <!-- lanes -->
  <line x1="100" y1="125" x2="540" y2="125" stroke="currentColor" opacity="0.4"/>
  <line x1="100" y1="190" x2="540" y2="190" stroke="currentColor" opacity="0.4"/>
  <!-- frame 1 -->
  <line x1="170" y1="117" x2="170" y2="133" stroke="#4c8dd6" stroke-width="2"/>
  <text x="170" y="107" text-anchor="middle" fill="#4c8dd6">count on-call → 2</text>
  <line x1="170" y1="182" x2="170" y2="198" stroke="#4c8dd6" stroke-width="2"/>
  <text x="170" y="216" text-anchor="middle" fill="#4c8dd6">count on-call → 2</text>
  <!-- frame 2: both checks pass -->
  <line x1="315" y1="117" x2="315" y2="133" stroke="#5aa46a" stroke-width="2"/>
  <text x="315" y="107" text-anchor="middle" fill="#5aa46a">2 ≥ 2 → may leave</text>
  <line x1="315" y1="182" x2="315" y2="198" stroke="#5aa46a" stroke-width="2"/>
  <text x="315" y="216" text-anchor="middle" fill="#5aa46a">2 ≥ 2 → may leave</text>
  <text x="280" y="86" text-anchor="middle" fill="currentColor" opacity="0.55">2 · both safety checks pass on the same premise</text>
</svg>

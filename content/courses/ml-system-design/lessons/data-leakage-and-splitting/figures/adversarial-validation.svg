<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- inputs -->
  <rect x="20" y="40" width="150" height="44" rx="5" fill="none" stroke="#4c8dd6" stroke-width="1.5"/>
  <text x="95" y="58" text-anchor="middle" font-size="12" fill="#4c8dd6">train set · tag 0</text>
  <text x="95" y="74" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">label column dropped</text>

  <rect x="20" y="110" width="150" height="44" rx="5" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <text x="95" y="128" text-anchor="middle" font-size="12" fill="#e2903a">test set · tag 1</text>
  <text x="95" y="144" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">label column dropped</text>

  <line x1="170" y1="62" x2="215" y2="90" stroke="currentColor"/>
  <line x1="170" y1="132" x2="215" y2="104" stroke="currentColor"/>
  <path d="M215 97 l-8 -2 l1 8 z" fill="currentColor" transform="rotate(-4 215 97)"/>

  <rect x="220" y="80" width="90" height="34" rx="5" fill="none" stroke="currentColor"/>
  <text x="265" y="101" text-anchor="middle" font-size="12" fill="currentColor">concat</text>

  <line x1="310" y1="97" x2="345" y2="97" stroke="currentColor"/>
  <path d="M345 97 l-8 -4 v8 z" fill="currentColor"/>

  <rect x="350" y="72" width="150" height="50" rx="5" fill="none" stroke="currentColor"/>
  <text x="425" y="93" text-anchor="middle" font-size="12" fill="currentColor">classifier predicts</text>
  <text x="425" y="109" text-anchor="middle" font-size="12" fill="currentColor">each row's tag</text>

  <line x1="500" y1="97" x2="535" y2="97" stroke="currentColor"/>
  <path d="M535 97 l-8 -4 v8 z" fill="currentColor"/>
  <text x="575" y="90" text-anchor="middle" font-size="12" fill="currentColor">cross-validated</text>
  <text x="575" y="106" text-anchor="middle" font-size="12" fill="currentColor">ROC-AUC</text>

  <!-- AUC scale -->
  <line x1="80" y1="210" x2="580" y2="210" stroke="currentColor"/>
  <g stroke="currentColor">
    <line x1="80" y1="204" x2="80" y2="216"/>
    <line x1="180" y1="204" x2="180" y2="216"/>
    <line x1="280" y1="204" x2="280" y2="216"/>
    <line x1="380" y1="204" x2="380" y2="216"/>
    <line x1="480" y1="204" x2="480" y2="216"/>
    <line x1="580" y1="204" x2="580" y2="216"/>
  </g>
  <text x="80" y="232" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.55">0.5</text>
  <text x="180" y="232" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.55">0.6</text>
  <text x="280" y="232" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.55">0.7</text>
  <text x="380" y="232" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.55">0.8</text>
  <text x="480" y="232" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.55">0.9</text>
  <text x="580" y="232" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.55">1.0</text>

  <circle cx="80" cy="210" r="6" fill="#5aa46a"/>
  <text x="80" y="174" text-anchor="middle" font-size="11.5" fill="#5aa46a">≈ 0.5: indistinguishable —</text>
  <text x="80" y="188" text-anchor="middle" font-size="11.5" fill="#5aa46a">split representative</text>

  <rect x="180" y="206" width="400" height="8" rx="3" fill="#e2903a" opacity="0.35"/>
  <circle cx="480" cy="210" r="6" fill="#e2903a"/>
  <text x="430" y="188" text-anchor="middle" font-size="11.5" fill="#e2903a">≥ 0.6: separable</text>

  <line x1="480" y1="216" x2="480" y2="248" stroke="#e2903a"/>
  <path d="M480 248 l-4 -7 h8 z" fill="#e2903a"/>
  <text x="480" y="266" text-anchor="middle" font-size="11.5" fill="currentColor">rank the classifier's feature importances:</text>
  <text x="480" y="282" text-anchor="middle" font-size="11.5" fill="currentColor" font-weight="600">the top features name the leak or the shift</text>
</svg>

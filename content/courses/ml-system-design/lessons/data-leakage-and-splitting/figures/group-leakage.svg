<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- left panel: split cuts through groups -->
  <text x="160" y="24" text-anchor="middle" font-size="12.5" fill="#e2903a" font-weight="600">split cuts through groups</text>

  <ellipse cx="90" cy="90" rx="52" ry="34" fill="none" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5"/>
  <text x="90" y="48" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">patient A</text>
  <circle cx="72" cy="86" r="4.5" fill="currentColor"/>
  <circle cx="94" cy="100" r="4.5" fill="currentColor"/>
  <circle cx="106" cy="80" r="5" fill="none" stroke="currentColor" stroke-width="2"/>

  <ellipse cx="230" cy="90" rx="52" ry="34" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <text x="230" y="48" text-anchor="middle" font-size="11" fill="#e2903a">patient B</text>
  <circle cx="212" cy="86" r="4.5" fill="currentColor"/>
  <circle cx="234" cy="100" r="4.5" fill="currentColor"/>
  <circle cx="246" cy="80" r="5" fill="none" stroke="#e2903a" stroke-width="2"/>

  <ellipse cx="160" cy="185" rx="52" ry="34" fill="none" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5"/>
  <text x="160" y="235" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">patient C</text>
  <circle cx="142" cy="181" r="4.5" fill="currentColor"/>
  <circle cx="164" cy="195" r="5" fill="none" stroke="currentColor" stroke-width="2"/>
  <circle cx="176" cy="175" r="4.5" fill="currentColor"/>

  <text x="160" y="262" text-anchor="middle" font-size="11" fill="#e2903a">patient B is seen in training and graded in test</text>

  <!-- divider -->
  <line x1="330" y1="20" x2="330" y2="260" stroke="currentColor" opacity="0.25"/>

  <!-- right panel: split along groups -->
  <text x="490" y="24" text-anchor="middle" font-size="12.5" fill="#5aa46a" font-weight="600">split along groups</text>

  <ellipse cx="420" cy="90" rx="52" ry="34" fill="none" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5"/>
  <text x="420" y="48" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">patient A → train</text>
  <circle cx="402" cy="86" r="4.5" fill="currentColor"/>
  <circle cx="424" cy="100" r="4.5" fill="currentColor"/>
  <circle cx="436" cy="80" r="4.5" fill="currentColor"/>

  <ellipse cx="560" cy="90" rx="52" ry="34" fill="none" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5"/>
  <text x="560" y="48" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">patient B → train</text>
  <circle cx="542" cy="86" r="4.5" fill="currentColor"/>
  <circle cx="564" cy="100" r="4.5" fill="currentColor"/>
  <circle cx="576" cy="80" r="4.5" fill="currentColor"/>

  <ellipse cx="490" cy="185" rx="52" ry="34" fill="none" stroke="#5aa46a" stroke-width="1.5"/>
  <text x="490" y="235" text-anchor="middle" font-size="11" fill="#5aa46a">patient C → test, whole</text>
  <circle cx="472" cy="181" r="5" fill="none" stroke="#5aa46a" stroke-width="2"/>
  <circle cx="494" cy="195" r="5" fill="none" stroke="#5aa46a" stroke-width="2"/>
  <circle cx="506" cy="175" r="5" fill="none" stroke="#5aa46a" stroke-width="2"/>

  <text x="490" y="262" text-anchor="middle" font-size="11" fill="#5aa46a">every test patient is genuinely unseen</text>
</svg>

<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- pipeline stage header -->
  <rect x="30" y="12" width="170" height="30" rx="5" fill="none" stroke="currentColor" opacity="0.6"/>
  <text x="115" y="31" text-anchor="middle" font-size="12" fill="currentColor" font-weight="600">COLLECTION</text>
  <line x1="200" y1="27" x2="230" y2="27" stroke="currentColor" opacity="0.6"/>
  <path d="M230 27 l-6 -4 v8 z" fill="currentColor" opacity="0.6"/>
  <rect x="235" y="12" width="170" height="30" rx="5" fill="none" stroke="currentColor" opacity="0.6"/>
  <text x="320" y="31" text-anchor="middle" font-size="12" fill="currentColor" font-weight="600">PREPROCESSING</text>
  <line x1="405" y1="27" x2="435" y2="27" stroke="currentColor" opacity="0.6"/>
  <path d="M435 27 l-6 -4 v8 z" fill="currentColor" opacity="0.6"/>
  <rect x="440" y="12" width="170" height="30" rx="5" fill="none" stroke="currentColor" opacity="0.6"/>
  <text x="525" y="31" text-anchor="middle" font-size="12" fill="currentColor" font-weight="600">THE SPLIT</text>

  <!-- collection routes -->
  <rect x="20" y="70" width="190" height="70" rx="5" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <text x="115" y="90" text-anchor="middle" font-size="12" fill="#e2903a" font-weight="600">label hidden in a feature</text>
  <text x="115" y="108" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">GDP = population ×</text>
  <text x="115" y="122" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">GDP per capita</text>

  <rect x="20" y="155" width="190" height="70" rx="5" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <text x="115" y="175" text-anchor="middle" font-size="12" fill="#e2903a" font-weight="600">generation process</text>
  <text x="115" y="193" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">the scanner encodes</text>
  <text x="115" y="207" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">the diagnosis</text>

  <!-- preprocessing route -->
  <rect x="225" y="70" width="190" height="70" rx="5" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <text x="320" y="90" text-anchor="middle" font-size="12" fill="#e2903a" font-weight="600">statistics across the boundary</text>
  <text x="320" y="108" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">scaler μ, σ fit on the full set</text>
  <text x="320" y="122" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">before splitting</text>

  <!-- split routes -->
  <rect x="430" y="70" width="190" height="70" rx="5" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <text x="525" y="90" text-anchor="middle" font-size="12" fill="#e2903a" font-weight="600">duplicates</text>
  <text x="525" y="108" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">3.3% of CIFAR-10's test set</text>
  <text x="525" y="122" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">was in its training set</text>

  <rect x="430" y="155" width="190" height="70" rx="5" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <text x="525" y="175" text-anchor="middle" font-size="12" fill="#e2903a" font-weight="600">groups cut apart</text>
  <text x="525" y="193" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">one patient's two scans,</text>
  <text x="525" y="207" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">one on each side</text>

  <rect x="430" y="240" width="190" height="70" rx="5" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <text x="525" y="260" text-anchor="middle" font-size="12" fill="#e2903a" font-weight="600">time ignored</text>
  <text x="525" y="278" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">a random split trains</text>
  <text x="525" y="292" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">on every test day's future</text>

  <!-- guards -->
  <text x="115" y="255" text-anchor="middle" font-size="11" fill="#5aa46a">guard: ask of every column,</text>
  <text x="115" y="270" text-anchor="middle" font-size="11" fill="#5aa46a">does it exist at prediction time?</text>
  <text x="320" y="255" text-anchor="middle" font-size="11" fill="#5aa46a">guard: split first,</text>
  <text x="320" y="270" text-anchor="middle" font-size="11" fill="#5aa46a">fit statistics on train only</text>
</svg>

<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- top: the trap -->
  <text x="30" y="26" font-size="12.5" fill="#e2903a" font-weight="600">the trap: mod 70, then mod 10</text>

  <line x1="40" y1="80" x2="620" y2="80" stroke="currentColor"/>
  <!-- ticks at multiples of 10 (scale: x = 40 + v*4) -->
  <g stroke="#4c8dd6">
    <line x1="40" y1="74" x2="40" y2="86"/>
    <line x1="80" y1="74" x2="80" y2="86"/>
    <line x1="120" y1="74" x2="120" y2="86"/>
    <line x1="160" y1="74" x2="160" y2="86"/>
    <line x1="200" y1="74" x2="200" y2="86"/>
    <line x1="240" y1="74" x2="240" y2="86"/>
    <line x1="280" y1="74" x2="280" y2="86"/>
    <line x1="320" y1="74" x2="320" y2="86"/>
    <line x1="360" y1="74" x2="360" y2="86"/>
    <line x1="400" y1="74" x2="400" y2="86"/>
    <line x1="440" y1="74" x2="440" y2="86"/>
    <line x1="480" y1="74" x2="480" y2="86"/>
    <line x1="520" y1="74" x2="520" y2="86"/>
    <line x1="560" y1="74" x2="560" y2="86"/>
    <line x1="600" y1="74" x2="600" y2="86"/>
  </g>
  <text x="40" y="100" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.55">0</text>
  <text x="320" y="100" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.55">70</text>
  <text x="600" y="100" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.55">140</text>
  <text x="620" y="66" text-anchor="end" font-size="10.5" fill="#4c8dd6">| multiples of 10</text>

  <!-- multiples of 70 -->
  <circle cx="40" cy="80" r="6" fill="#e2903a"/>
  <circle cx="320" cy="80" r="6" fill="#e2903a"/>
  <circle cx="600" cy="80" r="6" fill="#e2903a"/>
  <text x="30" y="66" font-size="10.5" fill="#e2903a">● hashes kept by mod 70 = 0</text>

  <text x="320" y="126" text-anchor="middle" font-size="11.5" fill="currentColor">every ● sits on a blue tick: h mod 10 = 0, which is always &lt; 8</text>
  <text x="320" y="142" text-anchor="middle" font-size="11.5" fill="#e2903a">the "80%" filter keeps 100% — validation (= 8) and test (= 9) are empty</text>

  <!-- bottom: the fix -->
  <text x="30" y="182" font-size="12.5" fill="#5aa46a" font-weight="600">the fix: mod 700 on the same sample</text>

  <!-- ten boxes for residues 0..630 -->
  <g font-size="10.5">
    <rect x="40" y="196" width="52" height="30" rx="4" fill="#5aa46a" opacity="0.25"/>
    <rect x="98" y="196" width="52" height="30" rx="4" fill="#5aa46a" opacity="0.25"/>
    <rect x="156" y="196" width="52" height="30" rx="4" fill="#5aa46a" opacity="0.25"/>
    <rect x="214" y="196" width="52" height="30" rx="4" fill="#5aa46a" opacity="0.25"/>
    <rect x="272" y="196" width="52" height="30" rx="4" fill="#5aa46a" opacity="0.25"/>
    <rect x="330" y="196" width="52" height="30" rx="4" fill="#5aa46a" opacity="0.25"/>
    <rect x="388" y="196" width="52" height="30" rx="4" fill="#5aa46a" opacity="0.25"/>
    <rect x="446" y="196" width="52" height="30" rx="4" fill="#5aa46a" opacity="0.25"/>
    <rect x="504" y="196" width="52" height="30" rx="4" fill="none" stroke="#4c8dd6" stroke-width="1.5"/>
    <rect x="562" y="196" width="52" height="30" rx="4" fill="none" stroke="#4c8dd6" stroke-width="1.5"/>
    <text x="66" y="215" text-anchor="middle" fill="currentColor">0</text>
    <text x="124" y="215" text-anchor="middle" fill="currentColor">70</text>
    <text x="182" y="215" text-anchor="middle" fill="currentColor">140</text>
    <text x="240" y="215" text-anchor="middle" fill="currentColor">210</text>
    <text x="298" y="215" text-anchor="middle" fill="currentColor">280</text>
    <text x="356" y="215" text-anchor="middle" fill="currentColor">350</text>
    <text x="414" y="215" text-anchor="middle" fill="currentColor">420</text>
    <text x="472" y="215" text-anchor="middle" fill="currentColor">490</text>
    <text x="530" y="215" text-anchor="middle" fill="currentColor">560</text>
    <text x="588" y="215" text-anchor="middle" fill="currentColor">630</text>
  </g>
  <text x="40" y="248" font-size="11" fill="currentColor" opacity="0.55">values of h mod 700 among the sampled hashes — ten classes, equally likely</text>
  <text x="269" y="274" text-anchor="middle" font-size="11.5" fill="#5aa46a">&lt; 560: train, exactly 8 of 10</text>
  <text x="559" y="274" text-anchor="middle" font-size="11.5" fill="#4c8dd6">val 560–629 · test 630–699</text>
</svg>

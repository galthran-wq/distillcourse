<svg viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="330" y="26" text-anchor="middle" font-size="11.5" fill="currentColor" opacity="0.55">the same model, the same weights</text>

  <!-- axes -->
  <text x="90" y="26" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">score</text>
  <line x1="90" y1="40" x2="90" y2="252" stroke="currentColor"/>
  <path d="M90 34 l-4 9 h8 z" fill="currentColor"/>
  <line x1="90" y1="252" x2="560" y2="252" stroke="currentColor"/>

  <!-- chance guide -->
  <line x1="90" y1="205" x2="560" y2="205" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5"/>
  <text x="556" y="200" text-anchor="end" font-size="11" fill="currentColor" opacity="0.55">chance</text>

  <!-- offline bar: real signal + leaked inflation -->
  <rect x="150" y="160" width="120" height="92" rx="3" fill="none" stroke="#4c8dd6" stroke-width="1.5"/>
  <text x="210" y="200" text-anchor="middle" font-size="12" fill="#4c8dd6">real signal</text>

  <rect x="150" y="72" width="120" height="88" rx="3" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <text x="210" y="96" text-anchor="middle" font-size="12" fill="#e2903a" font-weight="600">inflation:</text>
  <text x="210" y="112" text-anchor="middle" font-size="11.5" fill="#e2903a">the leaked channel</text>
  <text x="210" y="127" text-anchor="middle" font-size="10.5" fill="#e2903a">(body position,</text>
  <text x="210" y="140" text-anchor="middle" font-size="10.5" fill="#e2903a">hospital font)</text>

  <text x="210" y="62" text-anchor="middle" font-size="11" fill="currentColor">reported score</text>
  <text x="210" y="272" text-anchor="middle" font-size="12" fill="currentColor">offline validation</text>

  <!-- one-sidedness arrow -->
  <line x1="295" y1="165" x2="295" y2="95" stroke="#e2903a" stroke-width="2"/>
  <path d="M295 88 l-5 10 h10 z" fill="#e2903a"/>
  <text x="345" y="118" text-anchor="middle" font-size="11" fill="#e2903a">one-sided:</text>
  <text x="345" y="132" text-anchor="middle" font-size="11" fill="#e2903a">up, never down</text>

  <!-- production bar: the channel is gone -->
  <rect x="390" y="196" width="120" height="56" rx="3" fill="none" stroke="#4c8dd6" stroke-width="1.5"/>
  <text x="450" y="228" text-anchor="middle" font-size="11.5" fill="#4c8dd6">deployed score</text>

  <rect x="390" y="108" width="120" height="88" rx="3" fill="none" stroke="#e2903a" stroke-dasharray="4 3" opacity="0.55"/>
  <text x="450" y="145" text-anchor="middle" font-size="11" fill="#e2903a" opacity="0.8">channel absent</text>
  <text x="450" y="159" text-anchor="middle" font-size="11" fill="#e2903a" opacity="0.8">at the bedside</text>

  <text x="450" y="272" text-anchor="middle" font-size="12" fill="currentColor">production (new hospital)</text>
</svg>

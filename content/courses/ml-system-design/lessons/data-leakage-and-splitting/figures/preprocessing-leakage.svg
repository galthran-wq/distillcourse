<svg viewBox="0 0 640 310" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- left panel: leaky order -->
  <text x="160" y="24" text-anchor="middle" font-size="12.5" fill="#e2903a" font-weight="600">fit before split — leaky</text>

  <rect x="60" y="40" width="200" height="46" rx="5" fill="none" stroke="currentColor"/>
  <line x1="200" y1="40" x2="200" y2="86" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5"/>
  <text x="130" y="67" text-anchor="middle" font-size="12" fill="currentColor">train rows</text>
  <text x="230" y="67" text-anchor="middle" font-size="12" fill="#e2903a">test rows</text>

  <line x1="130" y1="86" x2="145" y2="120" stroke="currentColor"/>
  <path d="M145 120 l-7 -3 l2 8 z" fill="currentColor"/>
  <line x1="230" y1="86" x2="180" y2="120" stroke="#e2903a" stroke-width="2"/>
  <path d="M180 120 l8 -1 l-4 -7 z" fill="#e2903a"/>
  <text x="253" y="110" text-anchor="middle" font-size="11" fill="#e2903a">the leak: test rows</text>
  <text x="253" y="124" text-anchor="middle" font-size="11" fill="#e2903a">shape the constants</text>

  <rect x="90" y="124" width="140" height="34" rx="5" fill="none" stroke="#4c8dd6" stroke-width="1.5"/>
  <text x="160" y="145" text-anchor="middle" font-size="12" fill="#4c8dd6">fit scaler → μ, σ</text>

  <line x1="130" y1="158" x2="110" y2="192" stroke="#4c8dd6"/>
  <path d="M110 192 l7 -3 l-2 8 z" fill="#4c8dd6"/>
  <line x1="190" y1="158" x2="210" y2="192" stroke="#4c8dd6"/>
  <path d="M210 192 l-7 -3 l2 8 z" fill="#4c8dd6"/>

  <rect x="45" y="196" width="130" height="34" rx="5" fill="none" stroke="currentColor"/>
  <text x="110" y="217" text-anchor="middle" font-size="12" fill="currentColor">scale train</text>
  <rect x="185" y="196" width="130" height="34" rx="5" fill="none" stroke="currentColor"/>
  <text x="250" y="217" text-anchor="middle" font-size="12" fill="currentColor">scale test</text>

  <text x="160" y="262" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">every training row is transformed with</text>
  <text x="160" y="276" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">a summary of the test set</text>

  <!-- divider -->
  <line x1="330" y1="20" x2="330" y2="290" stroke="currentColor" opacity="0.25"/>

  <!-- right panel: correct order -->
  <text x="490" y="24" text-anchor="middle" font-size="12.5" fill="#5aa46a" font-weight="600">split, then fit — correct</text>

  <rect x="400" y="40" width="180" height="30" rx="5" fill="none" stroke="currentColor"/>
  <text x="490" y="59" text-anchor="middle" font-size="12" fill="currentColor">dataset → split first</text>

  <line x1="450" y1="70" x2="425" y2="96" stroke="currentColor"/>
  <path d="M425 96 l7 -3 l-2 8 z" fill="currentColor"/>
  <line x1="530" y1="70" x2="555" y2="96" stroke="currentColor"/>
  <path d="M555 96 l-7 -3 l2 8 z" fill="currentColor"/>

  <rect x="360" y="100" width="120" height="30" rx="5" fill="none" stroke="currentColor"/>
  <text x="420" y="119" text-anchor="middle" font-size="12" fill="currentColor">train split</text>
  <rect x="500" y="100" width="120" height="30" rx="5" fill="none" stroke="currentColor"/>
  <text x="560" y="119" text-anchor="middle" font-size="12" fill="currentColor">test split</text>

  <line x1="420" y1="130" x2="420" y2="156" stroke="#4c8dd6"/>
  <path d="M420 156 l-4 -7 h8 z" fill="#4c8dd6"/>

  <rect x="350" y="160" width="140" height="34" rx="5" fill="none" stroke="#4c8dd6" stroke-width="1.5"/>
  <text x="420" y="181" text-anchor="middle" font-size="12" fill="#4c8dd6">fit scaler on train only</text>

  <line x1="420" y1="194" x2="420" y2="220" stroke="#4c8dd6"/>
  <path d="M420 220 l-4 -7 h8 z" fill="#4c8dd6"/>
  <line x1="490" y1="177" x2="540" y2="177" stroke="#4c8dd6"/>
  <line x1="540" y1="177" x2="540" y2="220" stroke="#4c8dd6"/>
  <path d="M540 220 l-4 -7 h8 z" fill="#4c8dd6"/>
  <text x="545" y="172" font-size="11" fill="#4c8dd6">same μ, σ</text>

  <rect x="355" y="224" width="130" height="34" rx="5" fill="none" stroke="currentColor"/>
  <text x="420" y="245" text-anchor="middle" font-size="12" fill="currentColor">scale train</text>
  <rect x="495" y="224" width="130" height="34" rx="5" fill="none" stroke="currentColor"/>
  <text x="560" y="245" text-anchor="middle" font-size="12" fill="currentColor">scale test</text>

  <text x="490" y="282" text-anchor="middle" font-size="11" fill="#5aa46a">the constants know only the training split</text>
</svg>

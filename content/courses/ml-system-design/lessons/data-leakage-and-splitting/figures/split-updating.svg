<svg viewBox="0 0 640 310" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- row 1: fixed shift -->
  <text x="20" y="46" font-size="12" fill="currentColor" font-weight="600">fixed shift</text>
  <rect x="150" y="32" width="330" height="20" rx="4" fill="currentColor" opacity="0.18"/>
  <rect x="480" y="32" width="80" height="20" rx="4" fill="#4c8dd6" opacity="0.8"/>
  <line x1="560" y1="42" x2="590" y2="42" stroke="currentColor" opacity="0.6"/>
  <path d="M590 42 l-7 -4 v8 z" fill="currentColor" opacity="0.6"/>
  <text x="600" y="46" font-size="10.5" fill="currentColor" opacity="0.55">today</text>
  <text x="520" y="26" text-anchor="middle" font-size="10.5" fill="#4c8dd6">validation = last 2 weeks</text>
  <text x="150" y="70" font-size="11" fill="currentColor" opacity="0.55">window slides with the clock — freshest evaluation, noisiest baseline</text>

  <!-- row 2: fixed ratio -->
  <text x="20" y="136" font-size="12" fill="currentColor" font-weight="600">fixed ratio</text>
  <rect x="150" y="122" width="264" height="20" rx="4" fill="currentColor" opacity="0.18"/>
  <rect x="414" y="122" width="66" height="20" rx="4" fill="#4c8dd6" opacity="0.8"/>
  <rect x="480" y="122" width="64" height="20" rx="4" fill="none" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5"/>
  <text x="512" y="116" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.55">new data</text>
  <line x1="497" y1="132" x2="527" y2="132" stroke="currentColor" opacity="0.6"/>
  <path d="M527 132 l-7 -4 v8 z" fill="currentColor" opacity="0.6"/>
  <text x="150" y="160" font-size="11" fill="currentColor" opacity="0.55">new rows extend both sides at 80 : 20 — a hash split does this by itself</text>

  <!-- row 3: fixed set -->
  <text x="20" y="226" font-size="12" fill="currentColor" font-weight="600">fixed set</text>
  <rect x="150" y="212" width="410" height="20" rx="4" fill="currentColor" opacity="0.18"/>
  <rect x="270" y="212" width="80" height="20" rx="4" fill="#e2903a" opacity="0.85"/>
  <text x="310" y="206" text-anchor="middle" font-size="10.5" fill="#e2903a">golden set — frozen</text>
  <line x1="560" y1="222" x2="590" y2="222" stroke="currentColor" opacity="0.6"/>
  <path d="M590 222 l-7 -4 v8 z" fill="currentColor" opacity="0.6"/>
  <text x="150" y="250" font-size="11" fill="currentColor" opacity="0.55">never edited: the one measuring stick a March and an August model share;</text>
  <text x="150" y="265" font-size="11" fill="currentColor" opacity="0.55">outgrown means retired and replaced, never extended</text>

  <!-- legend -->
  <rect x="150" y="284" width="26" height="12" rx="3" fill="currentColor" opacity="0.18"/>
  <text x="182" y="294" font-size="10.5" fill="currentColor">train</text>
  <rect x="230" y="284" width="26" height="12" rx="3" fill="#4c8dd6" opacity="0.8"/>
  <text x="262" y="294" font-size="10.5" fill="currentColor">validation</text>
  <rect x="330" y="284" width="26" height="12" rx="3" fill="#e2903a" opacity="0.85"/>
  <text x="362" y="294" font-size="10.5" fill="currentColor">frozen benchmark</text>
</svg>

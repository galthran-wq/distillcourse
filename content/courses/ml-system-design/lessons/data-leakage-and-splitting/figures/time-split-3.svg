<svg viewBox="0 0 640 230" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="320" y="24" text-anchor="middle" font-size="12.5" fill="currentColor" font-weight="600">time split: trained on the past, evaluated on the future</text>

  <!-- axis -->
  <line x1="40" y1="150" x2="620" y2="150" stroke="currentColor"/>
  <path d="M620 150 l-8 -4 v8 z" fill="currentColor"/>
  <text x="628" y="154" font-size="11" fill="currentColor" opacity="0.55">t</text>

  <!-- week separators -->
  <line x1="160" y1="55" x2="160" y2="150" stroke="currentColor" stroke-dasharray="3 3" opacity="0.3"/>
  <line x1="280" y1="55" x2="280" y2="150" stroke="currentColor" stroke-dasharray="3 3" opacity="0.3"/>
  <line x1="400" y1="55" x2="400" y2="150" stroke="currentColor" stroke-dasharray="3 3" opacity="0.3"/>
  <text x="100" y="170" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">week 1</text>
  <text x="220" y="170" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">week 2</text>
  <text x="340" y="170" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">week 3</text>
  <text x="460" y="170" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">week 4</text>
  <text x="580" y="170" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">week 5</text>

  <!-- the cut -->
  <line x1="520" y1="42" x2="520" y2="160" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="510" y="40" text-anchor="end" font-size="11" fill="currentColor">train · weeks 1–4</text>
  <text x="530" y="40" font-size="11" fill="currentColor">val + test · week 5</text>

  <!-- events: filled = train, hollow = evaluation -->
  <circle cx="70" cy="120" r="4.5" fill="#4c8dd6"/>
  <circle cx="90" cy="95" r="4.5" fill="#4c8dd6"/>
  <circle cx="110" cy="130" r="4.5" fill="#e2903a"/>
  <circle cx="130" cy="105" r="4.5" fill="#4c8dd6"/>
  <circle cx="85" cy="70" r="4.5" fill="#4c8dd6"/>
  <circle cx="120" cy="80" r="4.5" fill="#4c8dd6"/>

  <circle cx="190" cy="110" r="4.5" fill="#4c8dd6"/>
  <circle cx="210" cy="85" r="4.5" fill="#e2903a"/>
  <circle cx="230" cy="125" r="4.5" fill="#4c8dd6"/>
  <circle cx="250" cy="100" r="4.5" fill="#e2903a"/>
  <circle cx="205" cy="65" r="4.5" fill="#4c8dd6"/>
  <circle cx="240" cy="75" r="4.5" fill="#4c8dd6"/>

  <circle cx="310" cy="115" r="4.5" fill="#e2903a"/>
  <circle cx="330" cy="90" r="4.5" fill="#4c8dd6"/>
  <circle cx="350" cy="128" r="4.5" fill="#e2903a"/>
  <circle cx="370" cy="102" r="4.5" fill="#4c8dd6"/>
  <circle cx="325" cy="68" r="4.5" fill="#e2903a"/>
  <circle cx="360" cy="78" r="4.5" fill="#4c8dd6"/>

  <circle cx="430" cy="112" r="4.5" fill="#e2903a"/>
  <circle cx="450" cy="88" r="4.5" fill="#4c8dd6"/>
  <circle cx="470" cy="126" r="4.5" fill="#e2903a"/>
  <circle cx="490" cy="104" r="4.5" fill="#e2903a"/>
  <circle cx="445" cy="66" r="4.5" fill="#4c8dd6"/>
  <circle cx="480" cy="76" r="4.5" fill="#4c8dd6"/>

  <circle cx="550" cy="118" r="5" fill="none" stroke="#e2903a" stroke-width="2"/>
  <circle cx="570" cy="92" r="5" fill="none" stroke="#e2903a" stroke-width="2"/>
  <circle cx="590" cy="124" r="5" fill="none" stroke="#4c8dd6" stroke-width="2"/>
  <circle cx="610" cy="100" r="5" fill="none" stroke="#e2903a" stroke-width="2"/>
  <circle cx="565" cy="70" r="5" fill="none" stroke="#e2903a" stroke-width="2"/>
  <circle cx="600" cy="80" r="5" fill="none" stroke="#4c8dd6" stroke-width="2"/>

  <!-- legend -->
  <circle cx="150" cy="200" r="4.5" fill="currentColor"/>
  <text x="160" y="204" font-size="11" fill="currentColor">filled = train</text>
  <circle cx="260" cy="200" r="5" fill="none" stroke="currentColor" stroke-width="2"/>
  <text x="271" y="204" font-size="11" fill="currentColor">hollow = evaluation</text>
  <text x="420" y="204" font-size="11" fill="#5aa46a">only the past is available at training time</text>
</svg>

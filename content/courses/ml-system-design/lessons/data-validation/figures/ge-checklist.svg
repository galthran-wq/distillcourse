<svg viewBox="0 0 600 310" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <rect x="15" y="14" width="570" height="282" rx="6" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="30" y="38" font-size="13" fill="currentColor">fact_sales — nightly validation run</text>
  <line x1="30" y1="48" x2="570" y2="48" stroke="currentColor" opacity="0.3"/>

  <text x="38" y="72" font-size="13" fill="#5aa46a">✓</text>
  <text x="62" y="72" font-size="12" fill="currentColor">columns match the ordered list</text>
  <text x="420" y="72" font-size="11" fill="currentColor" opacity="0.55">schema adherence</text>

  <text x="38" y="100" font-size="13" fill="#e2903a">✗</text>
  <text x="62" y="100" font-size="12" fill="#e2903a">row count in [2.6M, 3.4M] — observed 1.9M</text>
  <text x="420" y="100" font-size="11" fill="#e2903a">missing partition</text>

  <text x="38" y="128" font-size="13" fill="#5aa46a">✓</text>
  <text x="62" y="128" font-size="12" fill="currentColor">store_id never null</text>
  <text x="420" y="128" font-size="11" fill="currentColor" opacity="0.55">presence</text>

  <text x="38" y="156" font-size="13" fill="#5aa46a">✓</text>
  <text x="62" y="156" font-size="12" fill="currentColor">units_sold is int</text>
  <text x="420" y="156" font-size="11" fill="currentColor" opacity="0.55">type</text>

  <text x="38" y="184" font-size="13" fill="#5aa46a">✓</text>
  <text x="62" y="184" font-size="12" fill="currentColor">units_sold in [0, 5,000]</text>
  <text x="420" y="184" font-size="11" fill="currentColor" opacity="0.55">domain (range)</text>

  <text x="38" y="212" font-size="13" fill="#5aa46a">✓</text>
  <text x="62" y="212" font-size="12" fill="currentColor">channel ∈ {store, online}</text>
  <text x="420" y="212" font-size="11" fill="currentColor" opacity="0.55">domain (set)</text>

  <text x="38" y="240" font-size="13" fill="#5aa46a">✓</text>
  <text x="62" y="240" font-size="12" fill="currentColor">(store_id, sku_id, sale_date) unique</text>
  <text x="420" y="240" font-size="11" fill="currentColor" opacity="0.55">duplicate guard</text>

  <text x="38" y="268" font-size="13" fill="#5aa46a">✓</text>
  <text x="62" y="268" font-size="12" fill="currentColor">sale_date within the last day</text>
  <text x="420" y="268" font-size="11" fill="currentColor" opacity="0.55">freshness</text>

  <line x1="30" y1="108" x2="570" y2="108" stroke="#e2903a" stroke-dasharray="3 3" opacity="0.5"/>
</svg>

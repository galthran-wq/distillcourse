  <line x1="250" y1="135" x2="443" y2="135" stroke="#5aa46a" stroke-dasharray="3 3" opacity="0.6"/>
  <text x="310" y="128" font-size="10" fill="#5aa46a">100% vs 100%</text>

  <!-- A/B strip -->
  <rect x="20" y="240" width="580" height="56" rx="6" fill="none" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5"/>

<svg viewBox="0 0 620 250" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- one schema card -->
  <rect x="15" y="28" width="280" height="196" rx="6" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="27" y="18" font-size="12" fill="currentColor">one schema</text>

  <text x="30" y="56" font-size="12" fill="currentColor">store_id</text>
  <text x="150" y="56" font-size="11" fill="currentColor" opacity="0.55">INT · required</text>

  <text x="30" y="88" font-size="12" fill="currentColor">avg_sales_28d</text>
  <text x="150" y="88" font-size="11" fill="currentColor" opacity="0.55">FLOAT · required</text>

  <text x="30" y="126" font-size="12" fill="currentColor">clicked_install</text>
  <text x="150" y="126" font-size="11" fill="currentColor" opacity="0.55">INT · required</text>
  <text x="150" y="141" font-size="11" fill="#e2903a">not_in_environment: SERVING</text>

  <text x="30" y="178" font-size="12" fill="currentColor">position</text>
  <text x="150" y="178" font-size="11" fill="currentColor" opacity="0.55">INT · required</text>
  <text x="150" y="193" font-size="11" fill="#e2903a">not_in_environment: SERVING</text>

  <line x1="30" y1="68" x2="280" y2="68" stroke="currentColor" opacity="0.2"/>
  <line x1="30" y1="100" x2="280" y2="100" stroke="currentColor" opacity="0.2"/>
  <line x1="30" y1="152" x2="280" y2="152" stroke="currentColor" opacity="0.2"/>

  <!-- training overlay -->
  <rect x="330" y="28" width="275" height="88" rx="6" fill="none" stroke="#4c8dd6" stroke-width="1.5"/>
  <text x="342" y="48" font-size="12" fill="#4c8dd6">validated as TRAINING</text>
  <text x="342" y="70" font-size="11" fill="currentColor">requires: store_id · avg_sales_28d</text>
  <text x="342" y="86" font-size="11" fill="currentColor">requires: clicked_install · position</text>
  <text x="342" y="104" font-size="11" fill="currentColor" opacity="0.55">missing label = broken label join</text>

  <!-- serving overlay -->
  <rect x="330" y="136" width="275" height="88" rx="6" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <text x="342" y="156" font-size="12" fill="#e2903a">validated as SERVING</text>
  <text x="342" y="178" font-size="11" fill="currentColor">requires: store_id · avg_sales_28d</text>
  <text x="342" y="194" font-size="11" fill="currentColor">forbids: clicked_install · position</text>
  <text x="342" y="212" font-size="11" fill="currentColor" opacity="0.55">present label = leakage tripwire fires</text>

  <!-- connectors -->
  <line x1="295" y1="72" x2="328" y2="72" stroke="#4c8dd6" stroke-dasharray="3 3" opacity="0.7"/>
  <line x1="295" y1="180" x2="328" y2="180" stroke="#e2903a" stroke-dasharray="3 3" opacity="0.7"/>
</svg>

<svg viewBox="0 0 600 280" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <marker id="tp-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- anomaly -->
  <rect x="230" y="12" width="140" height="32" rx="5" fill="none" stroke="currentColor"/>
  <text x="300" y="32" font-size="12" text-anchor="middle" fill="currentColor">anomaly detected</text>

  <line x1="300" y1="44" x2="300" y2="66" stroke="currentColor" marker-end="url(#tp-arrow)"/>

  <!-- the question -->
  <rect x="155" y="68" width="290" height="34" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="300" y="89" font-size="12" text-anchor="middle" fill="currentColor">did the world change, or did the pipeline break?</text>

  <!-- branches -->
  <line x1="230" y1="102" x2="155" y2="136" stroke="currentColor" marker-end="url(#tp-arrow)"/>
  <line x1="370" y1="102" x2="445" y2="136" stroke="currentColor" marker-end="url(#tp-arrow)"/>
  <text x="165" y="122" font-size="11" fill="currentColor" opacity="0.55">world changed</text>
  <text x="370" y="122" font-size="11" fill="currentColor" opacity="0.55">pipeline broke</text>

  <!-- left verdict -->
  <rect x="45" y="140" width="220" height="34" rx="5" fill="none" stroke="#5aa46a" stroke-width="1.5"/>
  <text x="155" y="161" font-size="12" text-anchor="middle" fill="#5aa46a">evolve the schema</text>

  <rect x="45" y="186" width="220" height="66" rx="5" fill="none" stroke="currentColor" opacity="0.6"/>
  <text x="57" y="205" font-size="11" fill="currentColor">category: "EDUCATION"</text>
  <text x="57" y="220" font-size="11" fill="currentColor" opacity="0.55">a new app category exists</text>
  <text x="57" y="240" font-size="11" fill="#5aa46a">→ add value to domain</text>

  <!-- right verdict -->
  <rect x="335" y="140" width="220" height="34" rx="5" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <text x="445" y="161" font-size="12" text-anchor="middle" fill="#e2903a">block training, fix upstream</text>

  <rect x="335" y="186" width="220" height="66" rx="5" fill="none" stroke="currentColor" opacity="0.6"/>
  <text x="347" y="205" font-size="11" fill="currentColor">num_impressions: "NULL"</text>
  <text x="347" y="220" font-size="11" fill="currentColor" opacity="0.55">a producer serializes missing as text</text>
  <text x="347" y="240" font-size="11" fill="#e2903a">→ deprecate feature, file bug</text>
</svg>

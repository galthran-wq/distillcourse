<svg viewBox="0 0 640 230" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <marker id="vg-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor"/>
    </marker>
    <marker id="vg-arrow-g" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#5aa46a"/>
    </marker>
    <marker id="vg-arrow-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#e2903a"/>
    </marker>
  </defs>

  <!-- pipeline boxes -->
  <rect x="12" y="52" width="82" height="38" rx="5" fill="none" stroke="currentColor"/>
  <text x="53" y="75" font-size="12" text-anchor="middle" fill="currentColor">ingestion</text>

  <rect x="122" y="52" width="82" height="38" rx="5" fill="none" stroke="currentColor"/>
  <text x="163" y="75" font-size="12" text-anchor="middle" fill="currentColor">statistics</text>

  <rect x="232" y="52" width="96" height="38" rx="5" fill="none" stroke="currentColor"/>
  <text x="280" y="75" font-size="12" text-anchor="middle" fill="currentColor">schema check</text>

  <rect x="356" y="52" width="94" height="38" rx="5" fill="none" stroke="currentColor"/>
  <text x="403" y="75" font-size="12" text-anchor="middle" fill="currentColor">comparators</text>

  <!-- flow arrows -->
  <line x1="94" y1="71" x2="120" y2="71" stroke="currentColor" marker-end="url(#vg-arrow)"/>
  <line x1="204" y1="71" x2="230" y2="71" stroke="currentColor" marker-end="url(#vg-arrow)"/>
  <line x1="328" y1="71" x2="354" y2="71" stroke="currentColor" marker-end="url(#vg-arrow)"/>
  <line x1="450" y1="71" x2="476" y2="71" stroke="currentColor" marker-end="url(#vg-arrow)"/>

  <!-- the gate -->
  <rect x="478" y="44" width="14" height="54" rx="3" fill="#e2903a" opacity="0.9"/>
  <text x="485" y="36" font-size="12" text-anchor="middle" fill="#e2903a">the gate</text>

  <!-- trainer behind the gate -->
  <rect x="536" y="52" width="86" height="38" rx="5" fill="none" stroke="#4c8dd6" stroke-width="1.5"/>
  <text x="579" y="75" font-size="12" text-anchor="middle" fill="#4c8dd6">trainer</text>

  <!-- verdict: pass -->
  <line x1="492" y1="71" x2="533" y2="71" stroke="#5aa46a" stroke-width="1.5" marker-end="url(#vg-arrow-g)"/>
  <text x="512" y="63" font-size="11" text-anchor="middle" fill="#5aa46a">pass</text>

  <!-- verdict: alert -->
  <line x1="485" y1="98" x2="485" y2="132" stroke="#e2903a" stroke-width="1.5" marker-end="url(#vg-arrow-a)"/>
  <rect x="410" y="136" width="150" height="34" rx="5" fill="none" stroke="#e2903a"/>
  <text x="485" y="153" font-size="12" text-anchor="middle" fill="#e2903a">alert</text>
  <text x="485" y="166" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.55">human triage decides</text>

  <!-- verdict: block -->
  <line x1="460" y1="98" x2="400" y2="132" stroke="currentColor" stroke-width="1.5" marker-end="url(#vg-arrow)"/>
  <rect x="290" y="136" width="112" height="34" rx="5" fill="none" stroke="currentColor"/>
  <text x="346" y="153" font-size="12" text-anchor="middle" fill="currentColor">block</text>
  <text x="346" y="166" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.55">no training run</text>

  <!-- annotation -->
  <text x="12" y="122" font-size="11" fill="currentColor" opacity="0.55">every dataset, every run —</text>
  <text x="12" y="136" font-size="11" fill="currentColor" opacity="0.55">no human between data and trainer</text>

  <!-- baseline note -->
  <line x1="12" y1="196" x2="622" y2="196" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5"/>
  <text x="12" y="214" font-size="11" fill="currentColor" opacity="0.55">verdicts: pass → train · alert → evolve schema or fix pipeline · block → the batch never trains</text>
</svg>

<svg viewBox="0 0 640 372" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- row 1: the waterfall -->
  <text x="8" y="16" font-size="10" fill="currentColor" opacity="0.55">the waterfall: each buyer gets a timeout, unsold falls through</text>
  <rect x="8" y="26" width="122" height="46" rx="5" fill="none" stroke="currentColor"/>
  <text x="69" y="44" font-size="11" text-anchor="middle" fill="currentColor">publisher direct sale</text>
  <text x="69" y="60" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">high CPM</text>

  <line x1="130" y1="49" x2="152" y2="49" stroke="currentColor" stroke-width="1.2"/>
  <path d="M152 49 l-5 -3 v6 z" fill="currentColor"/>
  <text x="141" y="40" font-size="8" text-anchor="middle" fill="currentColor" opacity="0.55">unsold</text>

  <rect x="154" y="26" width="104" height="46" rx="5" fill="none" stroke="currentColor"/>
  <text x="206" y="44" font-size="11" text-anchor="middle" fill="currentColor">network 1</text>
  <text x="206" y="60" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">timeout t₁</text>

  <line x1="258" y1="49" x2="280" y2="49" stroke="currentColor" stroke-width="1.2"/>
  <path d="M280 49 l-5 -3 v6 z" fill="currentColor"/>
  <text x="269" y="40" font-size="8" text-anchor="middle" fill="currentColor" opacity="0.55">unsold</text>

  <rect x="282" y="26" width="136" height="46" rx="5" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <text x="350" y="44" font-size="11" text-anchor="middle" fill="#e2903a">our network</text>
  <text x="350" y="60" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">stage timeout ~150 ms</text>

  <line x1="418" y1="49" x2="440" y2="49" stroke="currentColor" stroke-width="1.2" stroke-dasharray="3 3"/>
  <path d="M440 49 l-5 -3 v6 z" fill="currentColor" opacity="0.6"/>
  <text x="446" y="46" font-size="9" fill="currentColor" opacity="0.55">next buyer,</text>
  <text x="446" y="58" font-size="9" fill="currentColor" opacity="0.55">lower price…</text>

  <!-- drop into the stage pipeline -->
  <line x1="350" y1="72" x2="350" y2="92" stroke="#e2903a" stroke-width="1.2"/>
  <line x1="350" y1="92" x2="56" y2="92" stroke="#e2903a" stroke-width="1.2"/>
  <line x1="56" y1="92" x2="56" y2="112" stroke="#e2903a" stroke-width="1.2"/>
  <path d="M56 112 l-3 -6 h6 z" fill="#e2903a"/>
  <text x="200" y="88" font-size="9" text-anchor="middle" fill="#e2903a">inside the stage</text>

  <!-- row 2: the stage pipeline -->
  <rect x="8" y="114" width="96" height="58" rx="5" fill="none" stroke="currentColor"/>
  <text x="56" y="132" font-size="11" text-anchor="middle" fill="currentColor">candidates</text>
  <text x="56" y="147" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">50–100k ads</text>
  <text x="56" y="160" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">from targeting</text>

  <line x1="104" y1="143" x2="120" y2="143" stroke="currentColor" stroke-width="1.2"/>
  <path d="M120 143 l-5 -3 v6 z" fill="currentColor"/>

  <rect x="122" y="114" width="118" height="58" rx="5" fill="none" stroke="currentColor"/>
  <text x="181" y="130" font-size="11" text-anchor="middle" fill="currentColor">feature assembly</text>
  <text x="181" y="145" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">batch aggregates</text>
  <text x="181" y="158" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">+ streaming counters</text>

  <line x1="240" y1="143" x2="256" y2="143" stroke="currentColor" stroke-width="1.2"/>
  <path d="M256 143 l-5 -3 v6 z" fill="currentColor"/>

  <rect x="258" y="114" width="112" height="58" rx="5" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <text x="314" y="130" font-size="11" text-anchor="middle" fill="#e2903a">CTR model</text>
  <text x="314" y="145" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">fan-out over replicas</text>
  <text x="314" y="158" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">50–100 ms</text>

  <line x1="370" y1="143" x2="386" y2="143" stroke="currentColor" stroke-width="1.2"/>
  <path d="M386 143 l-5 -3 v6 z" fill="currentColor"/>

  <rect x="388" y="114" width="118" height="58" rx="5" fill="none" stroke="currentColor"/>
  <text x="447" y="132" font-size="11" text-anchor="middle" fill="currentColor">correct</text>
  <text x="447" y="150" font-size="10" text-anchor="middle" fill="currentColor" opacity="0.75">q = p/(p+(1−p)/w)</text>

  <line x1="506" y1="143" x2="522" y2="143" stroke="currentColor" stroke-width="1.2"/>
  <path d="M522 143 l-5 -3 v6 z" fill="currentColor"/>

  <rect x="524" y="114" width="108" height="58" rx="5" fill="none" stroke="currentColor"/>
  <text x="578" y="132" font-size="11" text-anchor="middle" fill="currentColor">auction</text>
  <text x="578" y="147" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">rank by q × bid</text>
  <text x="578" y="160" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">→ ad served</text>

  <!-- row 3: label pipeline (return path) -->
  <line x1="578" y1="172" x2="578" y2="240" stroke="#4c8dd6" stroke-width="1.2"/>
  <path d="M578 240 l-3 -6 h6 z" fill="#4c8dd6"/>
  <text x="572" y="210" font-size="9" text-anchor="end" fill="#4c8dd6">impression logged</text>

  <rect x="468" y="242" width="164" height="50" rx="5" fill="none" stroke="#4c8dd6"/>
  <text x="550" y="260" font-size="11" text-anchor="middle" fill="#4c8dd6">impressions · clicks</text>
  <text x="550" y="275" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">two event streams</text>

  <line x1="468" y1="267" x2="440" y2="267" stroke="#4c8dd6" stroke-width="1.2"/>
  <path d="M440 267 l5 -3 v6 z" fill="#4c8dd6"/>

  <rect x="278" y="242" width="160" height="50" rx="5" fill="none" stroke="#4c8dd6"/>
  <text x="358" y="260" font-size="11" text-anchor="middle" fill="#4c8dd6">stream–stream join</text>
  <text x="358" y="275" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">label window W</text>

  <line x1="278" y1="267" x2="250" y2="267" stroke="#4c8dd6" stroke-width="1.2"/>
  <path d="M250 267 l5 -3 v6 z" fill="#4c8dd6"/>

  <rect x="96" y="242" width="152" height="50" rx="5" fill="none" stroke="#4c8dd6"/>
  <text x="172" y="260" font-size="11" text-anchor="middle" fill="#4c8dd6">training store</text>
  <text x="172" y="275" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">~50 TB/month, negatives 1:10</text>

  <path d="M96 267 L 40 267 L 40 190 L 290 190 L 290 174" fill="none" stroke="#4c8dd6" stroke-width="1.2" stroke-dasharray="4 3"/>
  <path d="M290 174 l-3 6 h6 z" fill="#4c8dd6"/>
  <text x="66" y="185" font-size="9" fill="#4c8dd6">retrain daily or faster</text>

  <!-- budget band -->
  <line x1="8" y1="336" x2="632" y2="336" stroke="currentColor" opacity="0.3" stroke-dasharray="3 3"/>
  <text x="320" y="356" font-size="10" text-anchor="middle" fill="currentColor" opacity="0.55">~40k requests/s ≈ 100 B/month · 50–100k candidates/request · model 50–100 ms inside one stage · log ~50 TB/month</text>
</svg>

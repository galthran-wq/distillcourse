<svg viewBox="0 0 640 316" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <line x1="318" y1="12" x2="318" y2="290" stroke="currentColor" opacity="0.2"/>

  <!-- LEFT: naive user split -->
  <text x="160" y="20" font-size="11" text-anchor="middle" fill="currentColor">user-split A/B: one shared tank</text>

  <rect x="105" y="34" width="110" height="66" rx="5" fill="none" stroke="currentColor"/>
  <rect x="107" y="62" width="106" height="36" fill="#4c8dd6" opacity="0.15"/>
  <text x="160" y="54" font-size="10" text-anchor="middle" fill="currentColor">campaign budget $B</text>
  <text x="160" y="86" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">one daily pool</text>

  <line x1="130" y1="100" x2="85" y2="140" stroke="#4c8dd6" stroke-width="1.2"/>
  <path d="M85 140 l1 -7 l5 4 z" fill="#4c8dd6"/>
  <line x1="190" y1="100" x2="235" y2="140" stroke="#e2903a" stroke-width="1.2"/>
  <path d="M235 140 l-6 -3 l5 -4 z" fill="#e2903a"/>

  <rect x="25" y="142" width="120" height="40" rx="5" fill="none" stroke="#4c8dd6"/>
  <text x="85" y="159" font-size="10" text-anchor="middle" fill="#4c8dd6">control arm</text>
  <text x="85" y="173" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">old model, 50% of users</text>

  <rect x="175" y="142" width="120" height="40" rx="5" fill="none" stroke="#e2903a"/>
  <text x="235" y="159" font-size="10" text-anchor="middle" fill="#e2903a">treatment arm</text>
  <text x="235" y="173" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">new model, spends faster</text>

  <!-- shared-day timeline -->
  <text x="25" y="212" font-size="9" fill="currentColor" opacity="0.55">the shared budget's day:</text>
  <rect x="25" y="220" width="270" height="14" rx="3" fill="none" stroke="currentColor" opacity="0.5"/>
  <rect x="25" y="220" width="185" height="14" rx="3" fill="#4c8dd6" opacity="0.25"/>
  <line x1="210" y1="214" x2="210" y2="240" stroke="#e2903a" stroke-width="1.4"/>
  <text x="210" y="250" font-size="9" text-anchor="middle" fill="#e2903a">exhausted 8 p.m.</text>
  <text x="253" y="231" font-size="8" text-anchor="middle" fill="currentColor" opacity="0.6">no bids, either arm</text>
  <text x="25" y="268" font-size="9" fill="currentColor">control's evening auctions run with thinner demand:</text>
  <text x="25" y="281" font-size="9" fill="currentColor">measured Δ = lift <tspan fill="#e2903a">+ transfer</tspan></text>

  <!-- RIGHT: budget split -->
  <text x="478" y="20" font-size="11" text-anchor="middle" fill="currentColor">budget-split: two independent half-tanks</text>

  <rect x="350" y="34" width="110" height="66" rx="5" fill="none" stroke="#4c8dd6"/>
  <rect x="352" y="70" width="106" height="28" fill="#4c8dd6" opacity="0.15"/>
  <text x="405" y="54" font-size="10" text-anchor="middle" fill="currentColor">sub-campaign $B/2</text>
  <text x="405" y="88" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">control's own pool</text>

  <rect x="496" y="34" width="110" height="66" rx="5" fill="none" stroke="#e2903a"/>
  <rect x="498" y="70" width="106" height="28" fill="#e2903a" opacity="0.15"/>
  <text x="551" y="54" font-size="10" text-anchor="middle" fill="currentColor">sub-campaign $B/2</text>
  <text x="551" y="88" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">treatment's own pool</text>

  <line x1="405" y1="100" x2="405" y2="140" stroke="#4c8dd6" stroke-width="1.2"/>
  <path d="M405 140 l-3 -6 h6 z" fill="#4c8dd6"/>
  <line x1="551" y1="100" x2="551" y2="140" stroke="#e2903a" stroke-width="1.2"/>
  <path d="M551 140 l-3 -6 h6 z" fill="#e2903a"/>

  <rect x="345" y="142" width="120" height="40" rx="5" fill="none" stroke="#4c8dd6"/>
  <text x="405" y="159" font-size="10" text-anchor="middle" fill="#4c8dd6">control arm</text>
  <text x="405" y="173" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">a whole marketplace</text>

  <rect x="491" y="142" width="120" height="40" rx="5" fill="none" stroke="#e2903a"/>
  <text x="551" y="159" font-size="10" text-anchor="middle" fill="#e2903a">treatment arm</text>
  <text x="551" y="173" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">a whole marketplace</text>

  <!-- independent pacing timelines -->
  <rect x="345" y="220" width="265" height="12" rx="3" fill="none" stroke="currentColor" opacity="0.5"/>
  <rect x="345" y="220" width="265" height="12" rx="3" fill="#4c8dd6" opacity="0.2"/>
  <text x="345" y="214" font-size="8" fill="#4c8dd6">control pool paces its own day</text>
  <rect x="345" y="242" width="265" height="12" rx="3" fill="none" stroke="currentColor" opacity="0.5"/>
  <rect x="345" y="242" width="265" height="12" rx="3" fill="#e2903a" opacity="0.2"/>
  <text x="345" y="266" font-size="8" fill="#e2903a">treatment pool paces its own day</text>

  <text x="345" y="281" font-size="9" fill="currentColor">arms cannot compete for spend: per-arm revenue is <tspan fill="#5aa46a">attributable</tspan></text>

  <text x="320" y="308" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">price of the fix: half the spend and events per arm → minimum detectable effect grows ~√2</text>
</svg>

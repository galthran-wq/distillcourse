<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- left: serving distribution -->
  <text x="70" y="24" font-size="11" text-anchor="middle" fill="currentColor">serving traffic</text>
  <rect x="45" y="40" width="50" height="140" rx="3" fill="currentColor" opacity="0.12"/>
  <rect x="45" y="176" width="50" height="4" fill="#e2903a"/>
  <text x="70" y="200" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">1 click : 99 no-click</text>
  <text x="70" y="213" font-size="10" text-anchor="middle" fill="currentColor">CTR 1.0%</text>

  <!-- arrow -->
  <line x1="115" y1="110" x2="185" y2="110" stroke="currentColor" stroke-width="1.4"/>
  <path d="M185 110 l-6 -4 v8 z" fill="currentColor"/>
  <text x="150" y="92" font-size="9" text-anchor="middle" fill="currentColor">keep 1 negative in 10</text>
  <text x="150" y="104" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">w = 0.1</text>

  <!-- right: training distribution -->
  <text x="235" y="24" font-size="11" text-anchor="middle" fill="currentColor">training set</text>
  <rect x="210" y="122" width="50" height="52" rx="3" fill="currentColor" opacity="0.12"/>
  <rect x="210" y="174" width="50" height="6" fill="#e2903a"/>
  <text x="235" y="200" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">1 click : 9.9 no-click</text>
  <text x="235" y="213" font-size="10" text-anchor="middle" fill="#e2903a">apparent CTR 9.2%</text>

  <!-- formula block -->
  <line x1="300" y1="40" x2="300" y2="210" stroke="currentColor" opacity="0.2"/>
  <text x="320" y="46" font-size="10" fill="currentColor" opacity="0.55">the model honestly learns the inflated rates —</text>
  <text x="320" y="60" font-size="10" fill="currentColor" opacity="0.55">so serving applies the inverse map before the auction:</text>
  <text x="460" y="94" font-size="15" text-anchor="middle" fill="currentColor">q = p / ( p + (1−p)/w )</text>
  <text x="460" y="120" font-size="11" text-anchor="middle" fill="currentColor"><tspan fill="#e2903a">raw p = 0.50</tspan>  →  <tspan fill="#5aa46a">q = 0.09</tspan></text>
  <text x="460" y="136" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">a constant log-odds shift of ln(1/w): monotone, nonlinear</text>

  <!-- calibration insets -->
  <text x="392" y="164" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">raw</text>
  <rect x="350" y="170" width="84" height="64" fill="none" stroke="currentColor" opacity="0.4"/>
  <line x1="350" y1="234" x2="434" y2="170" stroke="currentColor" stroke-width="1" stroke-dasharray="3 3" opacity="0.5"/>
  <path d="M350 234 C 368 190, 396 176, 420 172" fill="none" stroke="#e2903a" stroke-width="1.6"/>
  <text x="392" y="248" font-size="8" text-anchor="middle" fill="currentColor" opacity="0.55">predictions ~10× above clicks</text>

  <text x="530" y="164" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">corrected</text>
  <rect x="488" y="170" width="84" height="64" fill="none" stroke="currentColor" opacity="0.4"/>
  <line x1="488" y1="234" x2="572" y2="170" stroke="currentColor" stroke-width="1" stroke-dasharray="3 3" opacity="0.5"/>
  <path d="M488 234 C 516 213, 544 191, 570 172" fill="none" stroke="#5aa46a" stroke-width="1.6"/>
  <text x="530" y="248" font-size="8" text-anchor="middle" fill="currentColor" opacity="0.55">on the diagonal</text>

  <text x="320" y="284" font-size="10" text-anchor="middle" fill="currentColor" opacity="0.55">one contract, two systems: the pipeline downsampled, so serving corrects</text>
</svg>

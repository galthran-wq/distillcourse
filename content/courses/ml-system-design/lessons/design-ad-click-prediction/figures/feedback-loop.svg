<svg viewBox="0 0 560 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- loop boxes -->
  <rect x="30" y="36" width="112" height="46" rx="5" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <text x="86" y="55" font-size="11" text-anchor="middle" fill="#e2903a">CTR model</text>
  <text x="86" y="70" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">scores candidates</text>

  <line x1="142" y1="59" x2="218" y2="59" stroke="currentColor" stroke-width="1.2"/>
  <path d="M218 59 l-5 -3 v6 z" fill="currentColor"/>

  <rect x="220" y="36" width="100" height="46" rx="5" fill="none" stroke="currentColor"/>
  <text x="270" y="55" font-size="11" text-anchor="middle" fill="currentColor">auction</text>
  <text x="270" y="70" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">q × bid</text>

  <line x1="320" y1="59" x2="396" y2="59" stroke="currentColor" stroke-width="1.2"/>
  <path d="M396 59 l-5 -3 v6 z" fill="currentColor"/>
  <text x="358" y="50" font-size="8" text-anchor="middle" fill="currentColor" opacity="0.55">winners</text>

  <rect x="398" y="36" width="120" height="46" rx="5" fill="none" stroke="currentColor"/>
  <text x="458" y="55" font-size="11" text-anchor="middle" fill="currentColor">shown ads</text>
  <text x="458" y="70" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">impressions</text>

  <line x1="458" y1="82" x2="458" y2="152" stroke="currentColor" stroke-width="1.2"/>
  <path d="M458 152 l-3 -6 h6 z" fill="currentColor"/>

  <rect x="398" y="154" width="120" height="46" rx="5" fill="none" stroke="currentColor"/>
  <text x="458" y="173" font-size="11" text-anchor="middle" fill="currentColor">labels</text>
  <text x="458" y="188" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">clicks and silences</text>

  <line x1="398" y1="177" x2="144" y2="177" stroke="currentColor" stroke-width="1.2"/>
  <path d="M144 177 l5 -3 v6 z" fill="currentColor"/>

  <rect x="30" y="154" width="112" height="46" rx="5" fill="none" stroke="currentColor"/>
  <text x="86" y="173" font-size="11" text-anchor="middle" fill="currentColor">training set</text>
  <text x="86" y="188" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">retrain daily+</text>

  <line x1="86" y1="154" x2="86" y2="84" stroke="currentColor" stroke-width="1.2"/>
  <path d="M86 84 l-3 6 h6 z" fill="currentColor"/>

  <!-- dead end -->
  <line x1="270" y1="82" x2="270" y2="240" stroke="currentColor" stroke-width="1" stroke-dasharray="4 3" opacity="0.6"/>
  <path d="M270 240 l-3 -6 h6 z" fill="currentColor" opacity="0.6"/>
  <text x="278" y="228" font-size="8" fill="currentColor" opacity="0.55">losers</text>
  <rect x="196" y="242" width="148" height="42" rx="5" fill="none" stroke="currentColor" stroke-dasharray="4 3" opacity="0.6"/>
  <text x="270" y="260" font-size="10" text-anchor="middle" fill="currentColor" opacity="0.7">unshown ads</text>
  <text x="270" y="275" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">no labels, ever</text>

  <!-- breakers -->
  <line x1="358" y1="66" x2="358" y2="96" stroke="#5aa46a" stroke-width="1.2"/>
  <text x="304" y="110" font-size="9" fill="#5aa46a">breaker 1 · exploration slice:</text>
  <text x="304" y="122" font-size="9" fill="#5aa46a">some slots serve non-winners</text>

  <line x1="480" y1="200" x2="480" y2="222" stroke="#5aa46a" stroke-width="1.2"/>
  <text x="484" y="234" font-size="9" fill="#5aa46a" text-anchor="end">breaker 2 · position feature:</text>
  <text x="484" y="246" font-size="9" fill="#5aa46a" text-anchor="end">additive, served constant</text>

  <line x1="170" y1="177" x2="170" y2="216" stroke="#5aa46a" stroke-width="1.2"/>
  <text x="30" y="228" font-size="9" fill="#5aa46a">breaker 3 · importance weights</text>
  <text x="30" y="240" font-size="9" fill="#5aa46a">on any sampled traffic (kept at rate r → weight 1/r)</text>

  <text x="280" y="308" font-size="10" text-anchor="middle" fill="currentColor" opacity="0.55">the model selects its own future training data (Sculley §4); the breakers supply the withheld evidence</text>
</svg>

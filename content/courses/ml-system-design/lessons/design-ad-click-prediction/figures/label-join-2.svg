<svg viewBox="0 0 620 250" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="10" y="18" font-size="11" fill="currentColor">2 · clicks arrive on their own clock; the window W is drawn</text>

  <!-- window shading per row -->
  <rect x="120" y="42" width="360" height="16" fill="#4c8dd6" opacity="0.10"/>
  <rect x="120" y="76" width="360" height="16" fill="#4c8dd6" opacity="0.10"/>
  <rect x="120" y="110" width="360" height="16" fill="#4c8dd6" opacity="0.10"/>
  <rect x="120" y="144" width="360" height="16" fill="#4c8dd6" opacity="0.10"/>
  <rect x="120" y="178" width="360" height="16" fill="#4c8dd6" opacity="0.10"/>
  <line x1="480" y1="38" x2="480" y2="200" stroke="#4c8dd6" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="480" y="32" font-size="9" text-anchor="middle" fill="#4c8dd6">label window W = 15 min</text>

  <!-- axis -->
  <line x1="120" y1="210" x2="500" y2="210" stroke="currentColor" stroke-width="1"/>
  <line x1="512" y1="210" x2="560" y2="210" stroke="currentColor" stroke-width="1"/>
  <path d="M560 210 l-5 -3 v6 z" fill="currentColor"/>
  <line x1="502" y1="215" x2="508" y2="205" stroke="currentColor" stroke-width="1"/>
  <line x1="506" y1="215" x2="512" y2="205" stroke="currentColor" stroke-width="1"/>
  <text x="120" y="226" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">0</text>
  <text x="240" y="226" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">5 min</text>
  <text x="360" y="226" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">10 min</text>
  <text x="480" y="226" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">15 min</text>
  <text x="540" y="226" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">4 h</text>
  <text x="340" y="242" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">time since impression</text>

  <!-- rows with clicks -->
  <text x="108" y="54" font-size="10" text-anchor="end" fill="currentColor">imp 1</text>
  <line x1="120" y1="50" x2="560" y2="50" stroke="currentColor" opacity="0.15"/>
  <circle cx="120" cy="50" r="4" fill="#4c8dd6"/>
  <circle cx="156" cy="50" r="4" fill="#e2903a"/>
  <text x="156" y="41" font-size="8" text-anchor="middle" fill="#e2903a">90 s</text>

  <text x="108" y="88" font-size="10" text-anchor="end" fill="currentColor">imp 2</text>
  <line x1="120" y1="84" x2="560" y2="84" stroke="currentColor" opacity="0.15"/>
  <circle cx="120" cy="84" r="4" fill="#4c8dd6"/>
  <circle cx="216" cy="84" r="4" fill="#e2903a"/>
  <text x="216" y="75" font-size="8" text-anchor="middle" fill="#e2903a">4 min</text>

  <text x="108" y="122" font-size="10" text-anchor="end" fill="currentColor">imp 3</text>
  <line x1="120" y1="118" x2="560" y2="118" stroke="currentColor" opacity="0.15"/>
  <circle cx="120" cy="118" r="4" fill="#4c8dd6"/>
  <text x="300" y="114" font-size="8" text-anchor="middle" fill="currentColor" opacity="0.45">no click</text>

  <text x="108" y="156" font-size="10" text-anchor="end" fill="currentColor">imp 4</text>
  <line x1="120" y1="152" x2="560" y2="152" stroke="currentColor" opacity="0.15"/>
  <circle cx="120" cy="152" r="4" fill="#4c8dd6"/>
  <circle cx="384" cy="152" r="4" fill="#e2903a"/>
  <text x="384" y="143" font-size="8" text-anchor="middle" fill="#e2903a">11 min</text>

  <text x="108" y="190" font-size="10" text-anchor="end" fill="currentColor">imp 5</text>
  <line x1="120" y1="186" x2="560" y2="186" stroke="currentColor" opacity="0.15"/>
  <circle cx="120" cy="186" r="4" fill="#4c8dd6"/>
  <circle cx="540" cy="186" r="4" fill="#e2903a"/>
  <text x="540" y="177" font-size="8" text-anchor="middle" fill="#e2903a">4 h</text>

  <text x="120" y="36" font-size="9" fill="currentColor" opacity="0.55">most clicks land in the first 5 minutes; one straggles</text>
</svg>

<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="10" y="20" font-size="12" fill="currentColor">calibration ratio Σ predictions / Σ clicks, per slice, hourly</text>

  <!-- legend -->
  <line x1="90" y1="56" x2="106" y2="56" stroke="#e2903a" stroke-width="1.8"/>
  <text x="112" y="60" font-size="11" fill="#e2903a">slice: campaigns in country X</text>
  <line x1="90" y1="76" x2="106" y2="76" stroke="currentColor" stroke-width="1.6"/>
  <text x="112" y="80" font-size="11" fill="currentColor">all traffic</text>

  <!-- axes -->
  <line x1="76" y1="44" x2="76" y2="210" stroke="currentColor" stroke-width="1"/>
  <line x1="76" y1="210" x2="600" y2="210" stroke="currentColor" stroke-width="1"/>
  <text x="68" y="214" font-size="11" text-anchor="end" fill="currentColor" opacity="0.55">0.8</text>
  <text x="68" y="160" font-size="11" text-anchor="end" fill="currentColor" opacity="0.55">1.0</text>
  <text x="68" y="106" font-size="11" text-anchor="end" fill="currentColor" opacity="0.55">1.2</text>
  <text x="68" y="52" font-size="11" text-anchor="end" fill="currentColor" opacity="0.55">1.4</text>
  <line x1="76" y1="156" x2="600" y2="156" stroke="currentColor" opacity="0.25"/>

  <!-- day ticks: one per day, evenly spaced 36 px -->
  <g stroke="currentColor" opacity="0.55">
    <line x1="90" y1="210" x2="90" y2="215"/>
    <line x1="126" y1="210" x2="126" y2="215"/>
    <line x1="162" y1="210" x2="162" y2="215"/>
    <line x1="198" y1="210" x2="198" y2="215"/>
    <line x1="234" y1="210" x2="234" y2="215"/>
    <line x1="270" y1="210" x2="270" y2="215"/>
    <line x1="306" y1="210" x2="306" y2="215"/>
    <line x1="342" y1="210" x2="342" y2="215"/>
    <line x1="378" y1="210" x2="378" y2="215"/>
    <line x1="414" y1="210" x2="414" y2="215"/>
    <line x1="450" y1="210" x2="450" y2="215"/>
    <line x1="486" y1="210" x2="486" y2="215"/>
    <line x1="522" y1="210" x2="522" y2="215"/>
    <line x1="558" y1="210" x2="558" y2="215"/>
  </g>
  <g font-size="11" text-anchor="middle" fill="currentColor" opacity="0.55">
    <text x="90" y="229">1</text>
    <text x="126" y="229">2</text>
    <text x="162" y="229">3</text>
    <text x="198" y="229">4</text>
    <text x="234" y="229">5</text>
    <text x="270" y="229">6</text>
    <text x="306" y="229">7</text>
    <text x="342" y="229">8</text>
    <text x="378" y="229">9</text>
    <text x="414" y="229">10</text>
    <text x="450" y="229">11</text>
    <text x="486" y="229">12</text>
    <text x="522" y="229">13</text>
    <text x="558" y="229">14</text>
  </g>
  <text x="330" y="248" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.55">day of the two-week window</text>

  <!-- alarm band at ratio 1.1 -->
  <line x1="76" y1="129" x2="600" y2="129" stroke="#e2903a" stroke-width="1" stroke-dasharray="5 4" opacity="0.7"/>
  <text x="600" y="124" font-size="11" text-anchor="end" fill="#e2903a" opacity="0.85">alarm: ratio 1.1</text>

  <!-- overall line: one point per day, holding at 1.0 -->
  <path d="M90 156 L126 156 L162 153 L198 159 L234 153 L270 156 L306 159 L342 153 L378 156 L414 153 L450 159 L486 156 L522 153 L558 156"
        fill="none" stroke="currentColor" stroke-width="1.6"/>

  <!-- slice line: flat to day 8, then drifting; reaches the alarm line on day 11 -->
  <path d="M90 153 L126 159 L162 156 L198 153 L234 159 L270 153 L306 156 L342 153 L378 148 L414 140 L450 129 L486 107 L522 88 L558 75"
        fill="none" stroke="#e2903a" stroke-width="1.8"/>
  <g fill="#e2903a">
    <circle cx="90" cy="153" r="2"/>
    <circle cx="126" cy="159" r="2"/>
    <circle cx="162" cy="156" r="2"/>
    <circle cx="198" cy="153" r="2"/>
    <circle cx="234" cy="159" r="2"/>
    <circle cx="270" cy="153" r="2"/>
    <circle cx="306" cy="156" r="2"/>
    <circle cx="342" cy="153" r="2"/>
    <circle cx="378" cy="148" r="2"/>
    <circle cx="414" cy="140" r="2"/>
    <circle cx="486" cy="107" r="2"/>
    <circle cx="522" cy="88" r="2"/>
    <circle cx="558" cy="75" r="2"/>
  </g>

  <!-- the crossing: the first reading that touches the alarm line -->
  <circle cx="450" cy="129" r="5.5" fill="none" stroke="#e2903a" stroke-width="1.8"/>
  <line x1="440" y1="120" x2="447" y2="125" stroke="#e2903a" stroke-width="1.2"/>
  <text x="436" y="118" font-size="11" text-anchor="end" fill="#e2903a">first reading on the alarm line</text>

  <text x="600" y="56" font-size="11" text-anchor="end" fill="#e2903a">ratio 1.3 = this slice overpriced ~30%:</text>
  <text x="600" y="70" font-size="11" text-anchor="end" fill="#e2903a">winning auctions it should lose</text>

  <text x="10" y="272" font-size="11" fill="#5aa46a">computed hourly from logs — clicks arrive in minutes, no human labeling anywhere</text>
  <text x="10" y="290" font-size="11" fill="currentColor" opacity="0.55">the aggregate never leaves 1.0: why the ratio is monitored sliced — campaign, country, device, format</text>
</svg>

<svg viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="10" y="20" font-size="12" fill="currentColor">NCE = model log loss ÷ base-rate log loss</text>

  <!-- the region a model has no business being in -->
  <rect x="380" y="64" width="160" height="28" fill="#e2903a" opacity="0.12"/>

  <!-- the scale -->
  <line x1="60" y1="78" x2="540" y2="78" stroke="currentColor" stroke-width="1.2"/>
  <g stroke="currentColor" opacity="0.55">
    <line x1="60" y1="72" x2="60" y2="86"/>
    <line x1="220" y1="72" x2="220" y2="86"/>
    <line x1="380" y1="72" x2="380" y2="86"/>
    <line x1="540" y1="72" x2="540" y2="86"/>
  </g>
  <g font-size="11" text-anchor="middle" fill="currentColor" opacity="0.55">
    <text x="60" y="104">0</text>
    <text x="220" y="104">0.5</text>
    <text x="380" y="104">1.0</text>
    <text x="540" y="104">1.5</text>
  </g>

  <!-- the worked model -->
  <line x1="162" y1="54" x2="162" y2="72" stroke="#e2903a" stroke-width="1.2"/>
  <circle cx="162" cy="78" r="4.5" fill="#e2903a"/>
  <text x="162" y="46" font-size="11" text-anchor="middle" fill="#e2903a">worked model: 0.273 / 0.842 = 0.32</text>

  <text x="60" y="126" font-size="11" fill="currentColor">0: no loss at all</text>
  <text x="380" y="126" font-size="11" text-anchor="middle" fill="currentColor">1.0: the featureless floor — predict the base rate</text>
  <text x="540" y="146" font-size="11" text-anchor="end" fill="#e2903a">above 1.0: worse than knowing the CTR alone</text>

  <text x="10" y="176" font-size="11" fill="currentColor" opacity="0.55">denominator = the base rate's own loss: 0.842 bits on the worked dataset, 0.081 bits at a 1% CTR.</text>
  <text x="10" y="192" font-size="11" fill="currentColor" opacity="0.55">Raw log losses do not compare across those two regimes; the ratio does.</text>
</svg>

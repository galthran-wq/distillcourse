<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- member request -->
  <rect x="4" y="124" width="66" height="52" rx="5" fill="none" stroke="currentColor"/>
  <text x="37" y="145" font-size="11" text-anchor="middle" fill="currentColor">member</text>
  <text x="37" y="159" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">opens feed</text>

  <!-- arrows to the two sources -->
  <path d="M70 138 C 78 120, 78 100, 84 88" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <path d="M84 88 l-6 1 l3 5 z" fill="currentColor"/>
  <path d="M70 162 C 78 180, 78 200, 84 212" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <path d="M84 212 l-6 -1 l3 -5 z" fill="currentColor"/>

  <!-- in-network join -->
  <rect x="86" y="42" width="142" height="70" rx="5" fill="none" stroke="currentColor"/>
  <text x="157" y="60" font-size="11" text-anchor="middle" fill="currentColor">in-network join</text>
  <text x="157" y="74" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">~500 connections' recent</text>
  <text x="157" y="86" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">activity, seen posts filtered</text>
  <text x="157" y="100" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">→ ~1–2k candidates</text>

  <!-- out-of-network injection -->
  <rect x="86" y="188" width="142" height="70" rx="5" fill="none" stroke="currentColor"/>
  <text x="157" y="206" font-size="11" text-anchor="middle" fill="currentColor">out-of-network</text>
  <text x="157" y="220" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">followed topics · viral pool</text>
  <text x="157" y="232" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">· exploration</text>
  <text x="157" y="246" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">quota ~10–20% of slots</text>

  <!-- arrows into ranker -->
  <path d="M228 80 C 242 96, 240 120, 250 134" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <path d="M250 134 l-6 -1 l3 -5 z" fill="currentColor"/>
  <path d="M228 220 C 242 204, 240 180, 250 166" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <path d="M250 166 l-6 1 l3 5 z" fill="currentColor"/>

  <!-- multi-head ranker -->
  <rect x="252" y="110" width="130" height="80" rx="5" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <text x="317" y="128" font-size="11" text-anchor="middle" fill="#e2903a">multi-head ranker</text>
  <text x="317" y="142" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">7 calibrated heads</text>
  <text x="317" y="154" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">→ engagement score</text>
  <text x="317" y="170" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">scores all ~2k</text>
  <text x="317" y="182" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">in ~50 ms</text>

  <line x1="382" y1="150" x2="398" y2="150" stroke="currentColor" stroke-width="1.2"/>
  <path d="M398 150 l-5 -3 v6 z" fill="currentColor"/>

  <!-- re-rank -->
  <rect x="400" y="114" width="130" height="72" rx="5" fill="none" stroke="currentColor"/>
  <text x="465" y="132" font-size="11" text-anchor="middle" fill="currentColor">re-rank</text>
  <text x="465" y="147" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">impression discount</text>
  <text x="465" y="159" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">· author diversity</text>
  <text x="465" y="171" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">· exploration slot</text>

  <line x1="530" y1="150" x2="546" y2="150" stroke="currentColor" stroke-width="1.2"/>
  <path d="M546 150 l-5 -3 v6 z" fill="currentColor"/>

  <!-- feed -->
  <rect x="548" y="124" width="88" height="52" rx="5" fill="none" stroke="currentColor"/>
  <text x="592" y="145" font-size="11" text-anchor="middle" fill="currentColor">feed</text>
  <text x="592" y="160" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">~40 posts/fetch</text>

  <!-- feedback: labels (daily) to ranker -->
  <path d="M592 176 L 592 268 L 325 268 L 325 194" fill="none" stroke="#4c8dd6" stroke-width="1.2"/>
  <path d="M325 194 l-3 6 h6 z" fill="#4c8dd6"/>
  <text x="440" y="283" font-size="9" text-anchor="middle" fill="#4c8dd6">impressions + reactions → labels → daily warm-start retrain</text>

  <!-- feedback: impression counts (minutes) to re-rank -->
  <path d="M575 176 L 575 236 L 470 236 L 470 190" fill="none" stroke="#4c8dd6" stroke-width="1.2" stroke-dasharray="4 3"/>
  <path d="M470 190 l-3 6 h6 z" fill="#4c8dd6"/>
  <text x="568" y="231" font-size="9" text-anchor="end" fill="#4c8dd6">impression counts, near-line (minutes)</text>

  <!-- budget band -->
  <line x1="4" y1="308" x2="636" y2="308" stroke="currentColor" opacity="0.3" stroke-dasharray="3 3"/>
  <text x="320" y="326" font-size="10" text-anchor="middle" fill="currentColor" opacity="0.55">page 200 ms · ranking 50 ms · inventory: hours-fresh activity window · seen-state: minutes-fresh</text>
</svg>

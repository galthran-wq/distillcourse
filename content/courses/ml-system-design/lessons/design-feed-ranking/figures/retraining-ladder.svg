  <line x1="604" y1="66" x2="604" y2="316" stroke="currentColor" opacity="0.4" stroke-width="2"/>

  <!-- level 3 (top) -->
  <rect x="28" y="72" width="564" height="52" rx="5" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <text x="40" y="92" font-size="11" fill="#e2903a">level 3 — warm-start, in bulk</text>
  <text x="40" y="110" font-size="10" fill="currentColor" opacity="0.7">multi-head ranker: daily stateful fine-tune from the champion checkpoint</text>


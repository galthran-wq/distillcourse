<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- backbone -->
  <rect x="250" y="8" width="140" height="36" rx="5" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <text x="320" y="30" font-size="11" text-anchor="middle" fill="#e2903a">shared backbone</text>
  <path d="M266 44 C 220 56, 190 60, 170 66" fill="none" stroke="#e2903a" stroke-width="1.2"/>
  <path d="M170 66 l6 -3 l-2 -5 z" fill="#e2903a"/>
  <path d="M374 44 C 420 56, 450 60, 470 66" fill="none" stroke="#e2903a" stroke-width="1.2"/>
  <path d="M470 66 l-6 -3 l2 -5 z" fill="#e2903a"/>

  <!-- column headers -->
  <text x="170" y="82" font-size="11" text-anchor="middle" fill="currentColor">post A — photo</text>
  <text x="490" y="82" font-size="11" text-anchor="middle" fill="currentColor">post B — debate prompt</text>

  <!-- row labels -->
  <text x="10" y="112" font-size="11" fill="currentColor">click</text>
  <text x="10" y="140" font-size="11" fill="currentColor">like</text>
  <text x="10" y="168" font-size="11" fill="#e2903a">comment</text>
  <text x="10" y="196" font-size="11" fill="currentColor">share</text>
  <text x="10" y="224" font-size="11" fill="currentColor">hide</text>

  <!-- A probabilities -->
  <text x="110" y="112" font-size="11" text-anchor="middle" fill="currentColor">0.30</text>
  <text x="110" y="140" font-size="11" text-anchor="middle" fill="currentColor">0.40</text>
  <text x="110" y="168" font-size="11" text-anchor="middle" fill="#e2903a">0.01</text>
  <text x="110" y="196" font-size="11" text-anchor="middle" fill="currentColor">0.005</text>
  <text x="110" y="224" font-size="11" text-anchor="middle" fill="currentColor">0.0002</text>

  <!-- B probabilities -->
  <text x="420" y="112" font-size="11" text-anchor="middle" fill="currentColor">0.20</text>
  <text x="420" y="140" font-size="11" text-anchor="middle" fill="currentColor">0.15</text>
  <text x="420" y="168" font-size="11" text-anchor="middle" fill="#e2903a">0.08</text>
  <text x="420" y="196" font-size="11" text-anchor="middle" fill="currentColor">0.01</text>
  <text x="420" y="224" font-size="11" text-anchor="middle" fill="currentColor">0.001</text>

  <!-- per-head note -->
  <text x="320" y="112" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">one calibrated</text>
  <text x="320" y="124" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">probability</text>
  <text x="320" y="136" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">per head,</text>
  <text x="320" y="148" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">per post</text>

  <!-- footer -->
  <line x1="10" y1="300" x2="630" y2="300" stroke="currentColor" opacity="0.3" stroke-dasharray="3 3"/>
  <text x="320" y="320" font-size="10" text-anchor="middle" fill="currentColor" opacity="0.55">frame 1 — the model's output: per-head probabilities; no weights applied yet</text>
</svg>

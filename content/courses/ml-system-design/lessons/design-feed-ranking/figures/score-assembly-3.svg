<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- backbone -->
  <rect x="250" y="8" width="140" height="36" rx="5" fill="none" stroke="currentColor"/>
  <text x="320" y="30" font-size="11" text-anchor="middle" fill="currentColor">shared backbone</text>

  <!-- column headers -->
  <text x="170" y="82" font-size="11" text-anchor="middle" fill="currentColor">post A — photo</text>
  <text x="490" y="82" font-size="11" text-anchor="middle" fill="currentColor">post B — debate prompt</text>
  <text x="320" y="82" font-size="11" text-anchor="middle" fill="#4c8dd6">policy 2 weights</text>

  <!-- row labels -->
  <text x="10" y="112" font-size="11" fill="currentColor">click</text>
  <text x="10" y="140" font-size="11" fill="currentColor">like</text>
  <text x="10" y="168" font-size="11" fill="#e2903a">comment</text>
  <text x="10" y="196" font-size="11" fill="currentColor">share</text>
  <text x="10" y="224" font-size="11" fill="currentColor">hide</text>

  <!-- weights (changed rows in amber) -->
  <text x="320" y="112" font-size="11" text-anchor="middle" fill="#4c8dd6">× 1</text>
  <text x="320" y="140" font-size="11" text-anchor="middle" fill="#e2903a">× 2</text>
  <text x="320" y="168" font-size="11" text-anchor="middle" fill="#e2903a">× 30</text>
  <text x="320" y="196" font-size="11" text-anchor="middle" fill="#4c8dd6">× 20</text>
  <text x="320" y="224" font-size="11" text-anchor="middle" fill="#4c8dd6">× −20</text>

  <!-- A probs + term bars (45 px per unit) -->
  <text x="80" y="112" font-size="10" text-anchor="middle" fill="currentColor">0.30</text>
  <rect x="100" y="103" width="13.5" height="11" fill="#4c8dd6"/>
  <text x="120" y="112" font-size="9" fill="currentColor" opacity="0.55">0.30</text>
  <text x="80" y="140" font-size="10" text-anchor="middle" fill="currentColor">0.40</text>
  <rect x="100" y="131" width="36" height="11" fill="#4c8dd6"/>
  <text x="142" y="140" font-size="9" fill="currentColor" opacity="0.55">0.80</text>
  <text x="80" y="168" font-size="10" text-anchor="middle" fill="currentColor">0.01</text>
  <rect x="100" y="159" width="13.5" height="11" fill="#e2903a"/>
  <text x="120" y="168" font-size="9" fill="currentColor" opacity="0.55">0.30</text>
  <text x="80" y="196" font-size="10" text-anchor="middle" fill="currentColor">0.005</text>
  <rect x="100" y="187" width="4.5" height="11" fill="#4c8dd6"/>
  <text x="112" y="196" font-size="9" fill="currentColor" opacity="0.55">0.10</text>
  <text x="80" y="224" font-size="10" text-anchor="middle" fill="currentColor">0.0002</text>
  <rect x="102" y="215" width="3" height="11" fill="none" stroke="currentColor"/>
  <text x="112" y="224" font-size="9" fill="currentColor" opacity="0.55">−0.004</text>

  <!-- B probs + term bars -->
  <text x="400" y="112" font-size="10" text-anchor="middle" fill="currentColor">0.20</text>
  <rect x="420" y="103" width="9" height="11" fill="#4c8dd6"/>
  <text x="435" y="112" font-size="9" fill="currentColor" opacity="0.55">0.20</text>
  <text x="400" y="140" font-size="10" text-anchor="middle" fill="currentColor">0.15</text>
  <rect x="420" y="131" width="13.5" height="11" fill="#4c8dd6"/>
  <text x="440" y="140" font-size="9" fill="currentColor" opacity="0.55">0.30</text>
  <text x="400" y="168" font-size="10" text-anchor="middle" fill="currentColor">0.08</text>
  <rect x="420" y="159" width="108" height="11" fill="#e2903a"/>
  <text x="534" y="168" font-size="9" fill="currentColor" opacity="0.55">2.40</text>
  <text x="400" y="196" font-size="10" text-anchor="middle" fill="currentColor">0.01</text>
  <rect x="420" y="187" width="9" height="11" fill="#4c8dd6"/>
  <text x="435" y="196" font-size="9" fill="currentColor" opacity="0.55">0.20</text>
  <text x="400" y="224" font-size="10" text-anchor="middle" fill="currentColor">0.001</text>
  <rect x="422" y="215" width="4" height="11" fill="none" stroke="currentColor"/>
  <text x="432" y="224" font-size="9" fill="currentColor" opacity="0.55">−0.02</text>

  <!-- totals -->
  <line x1="60" y1="242" x2="280" y2="242" stroke="currentColor" opacity="0.3"/>
  <line x1="380" y1="242" x2="600" y2="242" stroke="currentColor" opacity="0.3"/>
  <text x="170" y="262" font-size="12" text-anchor="middle" fill="currentColor">S(A) = 1.50</text>
  <text x="490" y="262" font-size="12" text-anchor="middle" fill="currentColor">S(B) = 3.08</text>
  <rect x="454" y="272" width="72" height="20" rx="10" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <text x="490" y="286" font-size="10" text-anchor="middle" fill="#e2903a">B first</text>

  <!-- footer -->
  <line x1="10" y1="300" x2="630" y2="300" stroke="currentColor" opacity="0.3" stroke-dasharray="3 3"/>
  <text x="320" y="320" font-size="10" text-anchor="middle" fill="currentColor" opacity="0.55">frame 3 — policy 2 (like 5→2, comment 10→30): same probabilities, no retrain — the ordering flips</text>
</svg>

<svg viewBox="0 0 640 370" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- outer loop: creator boxes -->
  <rect x="40" y="16" width="220" height="40" rx="5" fill="none" stroke="#4c8dd6" stroke-width="1.5"/>
  <text x="150" y="40" font-size="11" text-anchor="middle" fill="#4c8dd6">creators adapt what they post</text>
  <rect x="440" y="16" width="180" height="40" rx="5" fill="none" stroke="#4c8dd6" stroke-width="1.5"/>
  <text x="530" y="40" font-size="11" text-anchor="middle" fill="#4c8dd6">creators observe reach</text>

  <!-- inner loop boxes -->
  <rect x="30" y="180" width="120" height="50" rx="5" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <text x="90" y="209" font-size="11" text-anchor="middle" fill="#e2903a">feed model</text>

  <rect x="260" y="110" width="140" height="50" rx="5" fill="none" stroke="currentColor"/>
  <text x="330" y="130" font-size="11" text-anchor="middle" fill="currentColor">ranked feed</text>
  <text x="330" y="145" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">exposure</text>

  <rect x="500" y="180" width="120" height="50" rx="5" fill="none" stroke="currentColor"/>
  <text x="560" y="200" font-size="11" text-anchor="middle" fill="currentColor">reader</text>
  <text x="560" y="214" font-size="11" text-anchor="middle" fill="currentColor">reactions</text>

  <rect x="260" y="280" width="140" height="50" rx="5" fill="none" stroke="currentColor"/>
  <text x="330" y="300" font-size="11" text-anchor="middle" fill="currentColor">training labels</text>
  <text x="330" y="315" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">minutes-fresh</text>

  <!-- inner loop arrows (clockwise, amber) -->
  <path d="M150 190 C 200 170, 220 155, 256 145" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <path d="M256 145 l-7 -1 l2 6 z" fill="#e2903a"/>
  <path d="M400 145 C 450 155, 480 168, 512 180" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <path d="M512 180 l-7 -1 l2 6 z" fill="#e2903a"/>
  <path d="M552 230 C 510 265, 460 285, 404 298" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <path d="M404 298 l7 2 l-1 -7 z" fill="#e2903a"/>
  <path d="M260 305 C 190 300, 130 270, 96 234" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <path d="M96 234 l2 7 l4 -5 z" fill="#e2903a"/>
  <text x="196" y="330" font-size="9" fill="currentColor" opacity="0.55">retrain, daily</text>

  <!-- outer loop arrows (blue) -->
  <path d="M366 110 C 420 84, 460 70, 506 58" fill="none" stroke="#4c8dd6" stroke-width="1.5"/>
  <path d="M506 58 l-7 0 l2 6 z" fill="#4c8dd6"/>
  <path d="M440 46 L 266 46" fill="none" stroke="#4c8dd6" stroke-width="1.5"/>
  <path d="M266 46 l6 -3 v6 z" fill="#4c8dd6"/>
  <path d="M110 56 C 96 96, 90 136, 88 176" fill="none" stroke="#4c8dd6" stroke-width="1.5"/>
  <path d="M88 176 l-3 -6 l6 0 z" fill="#4c8dd6"/>
  <text x="30" y="120" font-size="9" fill="#4c8dd6">the inventory</text>
  <text x="30" y="132" font-size="9" fill="#4c8dd6">itself changes</text>

  <!-- audits (green chips) -->
  <rect x="160" y="80" width="104" height="20" rx="10" fill="none" stroke="#5aa46a" stroke-width="1.2"/>
  <text x="212" y="94" font-size="9" text-anchor="middle" fill="#5aa46a">exploration slot</text>
  <line x1="248" y1="100" x2="278" y2="112" stroke="#5aa46a" stroke-width="1" opacity="0.7"/>

  <rect x="252" y="166" width="156" height="20" rx="10" fill="none" stroke="#5aa46a" stroke-width="1.2"/>
  <text x="330" y="180" font-size="9" text-anchor="middle" fill="#5aa46a">popularity-diversity monitor</text>

  <rect x="470" y="288" width="102" height="20" rx="10" fill="none" stroke="#5aa46a" stroke-width="1.2"/>
  <text x="521" y="302" font-size="9" text-anchor="middle" fill="#5aa46a">position feature</text>

  <rect x="284" y="14" width="132" height="20" rx="10" fill="none" stroke="#5aa46a" stroke-width="1.2"/>
  <text x="350" y="28" font-size="9" text-anchor="middle" fill="#5aa46a">creator-side health</text>

  <!-- legend -->
  <text x="620" y="330" font-size="9" text-anchor="end" fill="currentColor" opacity="0.55">amber: reader loop · blue: creator loop · green: audits, designed in</text>
</svg>

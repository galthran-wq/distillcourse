<svg viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- axes -->
  <line x1="56" y1="240" x2="560" y2="240" stroke="currentColor" stroke-width="1"/>
  <line x1="56" y1="240" x2="56" y2="36" stroke="currentColor" stroke-width="1"/>
  <text x="308" y="272" font-size="11" text-anchor="middle" fill="currentColor">weeks since first ship</text>
  <text x="24" y="138" font-size="11" text-anchor="middle" fill="currentColor" transform="rotate(-90 24 138)">recall, one class</text>
  <text x="56" y="256" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">0</text>
  <text x="224" y="256" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">6</text>
  <text x="392" y="256" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">12</text>
  <text x="552" y="256" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">18</text>
  <text x="48" y="70" font-size="9" text-anchor="end" fill="currentColor" opacity="0.55">0.85</text>
  <text x="48" y="164" font-size="9" text-anchor="end" fill="currentColor" opacity="0.55">0.55</text>

  <!-- retrain markers -->
  <line x1="224" y1="240" x2="224" y2="48" stroke="currentColor" stroke-width="0.8" stroke-dasharray="3 4" opacity="0.5"/>
  <line x1="392" y1="240" x2="392" y2="48" stroke="currentColor" stroke-width="0.8" stroke-dasharray="3 4" opacity="0.5"/>
  <text x="224" y="42" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">retrain</text>
  <text x="392" y="42" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">retrain</text>

  <!-- adversarial sawtooth (amber): ship at 0.85, decay to 0.55 by week 6, reset -->
  <path d="M56 66 C 100 74, 150 110, 224 160 L224 66 C 268 74, 318 110, 392 160 L392 66 C 436 74, 486 110, 552 154"
        fill="none" stroke="#e2903a" stroke-width="2"/>
  <text x="66" y="180" font-size="10" fill="#e2903a">evasion adapts:</text>
  <text x="66" y="193" font-size="9" fill="#e2903a">obfuscated spellings,</text>
  <text x="66" y="205" font-size="9" fill="#e2903a">cropped / re-encoded images,</text>
  <text x="66" y="217" font-size="9" fill="#e2903a">text moved into the image</text>

  <!-- benign drift (dashed) -->
  <path d="M56 66 C 220 74, 400 84, 552 96" fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="6 4" opacity="0.7"/>
  <text x="448" y="56" font-size="10" fill="currentColor" opacity="0.7">benign drift: the world</text>
  <text x="448" y="69" font-size="10" fill="currentColor" opacity="0.7">moves on its own clock</text>

  <text x="304" y="22" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">the decay rate is set by what the blocked content is worth to its senders</text>
</svg>

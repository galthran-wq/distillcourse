<svg viewBox="0 0 640 290" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- divider -->
  <line x1="320" y1="14" x2="320" y2="276" stroke="currentColor" stroke-width="0.5" opacity="0.3"/>

  <!-- LEFT: late fusion -->
  <text x="156" y="22" font-size="12" text-anchor="middle" fill="currentColor">late fusion</text>

  <!-- the meme -->
  <rect x="14" y="44" width="92" height="104" rx="5" fill="none" stroke="currentColor"/>
  <rect x="22" y="52" width="76" height="28" rx="3" fill="none" stroke="currentColor" opacity="0.6"/>
  <text x="60" y="65" font-size="8" text-anchor="middle" fill="currentColor">harmless</text>
  <text x="60" y="75" font-size="8" text-anchor="middle" fill="currentColor">text</text>
  <rect x="22" y="86" width="76" height="54" rx="3" fill="none" stroke="currentColor" opacity="0.6"/>
  <circle cx="42" cy="100" r="6" fill="none" stroke="currentColor" opacity="0.6"/>
  <path d="M26 122 l16 -12 l12 7 l14 -10 l26 15" fill="none" stroke="currentColor" opacity="0.6"/>
  <text x="60" y="136" font-size="8" text-anchor="middle" fill="currentColor">harmless image</text>
  <text x="60" y="160" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">the meme</text>

  <!-- per-modality classifiers -->
  <line x1="106" y1="66" x2="128" y2="60" stroke="currentColor" stroke-width="1.2"/>
  <path d="M128 60 l-6 -1 l2 6 z" fill="currentColor"/>
  <rect x="130" y="44" width="88" height="30" rx="5" fill="none" stroke="currentColor"/>
  <text x="174" y="63" font-size="10" text-anchor="middle" fill="currentColor">text classifier</text>

  <line x1="106" y1="112" x2="128" y2="122" stroke="currentColor" stroke-width="1.2"/>
  <path d="M128 122 l-6 1 l2 -6 z" fill="currentColor"/>
  <rect x="130" y="108" width="88" height="30" rx="5" fill="none" stroke="currentColor"/>
  <text x="174" y="127" font-size="10" text-anchor="middle" fill="currentColor">image classifier</text>

  <text x="238" y="63" font-size="11" text-anchor="middle" fill="#4c8dd6">0.04</text>
  <text x="238" y="127" font-size="11" text-anchor="middle" fill="#4c8dd6">0.07</text>

  <line x1="252" y1="59" x2="270" y2="82" stroke="currentColor" stroke-width="1.2"/>
  <line x1="252" y1="123" x2="270" y2="102" stroke="currentColor" stroke-width="1.2"/>
  <rect x="270" y="76" width="44" height="34" rx="5" fill="none" stroke="currentColor"/>
  <text x="292" y="97" font-size="10" text-anchor="middle" fill="currentColor">merge</text>

  <text x="292" y="130" font-size="11" text-anchor="middle" fill="#4c8dd6">0.07</text>
  <text x="292" y="146" font-size="10" text-anchor="middle" fill="currentColor">→ pass</text>
  <text x="292" y="160" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">missed</text>

  <text x="160" y="196" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">the merge sees two numbers;</text>
  <text x="160" y="208" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">the interaction was destroyed</text>
  <text x="160" y="220" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">before it ran</text>

  <!-- RIGHT: early fusion -->
  <text x="486" y="22" font-size="12" text-anchor="middle" fill="currentColor">early fusion</text>

  <!-- the meme (same) -->
  <rect x="336" y="44" width="92" height="104" rx="5" fill="none" stroke="currentColor"/>
  <rect x="344" y="52" width="76" height="28" rx="3" fill="none" stroke="currentColor" opacity="0.6"/>
  <text x="382" y="65" font-size="8" text-anchor="middle" fill="currentColor">harmless</text>
  <text x="382" y="75" font-size="8" text-anchor="middle" fill="currentColor">text</text>
  <rect x="344" y="86" width="76" height="54" rx="3" fill="none" stroke="currentColor" opacity="0.6"/>
  <circle cx="364" cy="100" r="6" fill="none" stroke="currentColor" opacity="0.6"/>
  <path d="M348 122 l16 -12 l12 7 l14 -10 l26 15" fill="none" stroke="currentColor" opacity="0.6"/>
  <text x="382" y="136" font-size="8" text-anchor="middle" fill="currentColor">harmless image</text>
  <text x="382" y="160" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">the same meme</text>

  <!-- encoders -->
  <line x1="428" y1="66" x2="448" y2="60" stroke="currentColor" stroke-width="1.2"/>
  <path d="M448 60 l-6 -1 l2 6 z" fill="currentColor"/>
  <rect x="450" y="44" width="82" height="30" rx="5" fill="none" stroke="currentColor"/>
  <text x="491" y="63" font-size="10" text-anchor="middle" fill="currentColor">text encoder</text>

  <line x1="428" y1="112" x2="448" y2="122" stroke="currentColor" stroke-width="1.2"/>
  <path d="M448 122 l-6 1 l2 -6 z" fill="currentColor"/>
  <rect x="450" y="108" width="82" height="30" rx="5" fill="none" stroke="currentColor"/>
  <text x="491" y="127" font-size="10" text-anchor="middle" fill="currentColor">image encoder</text>

  <line x1="532" y1="59" x2="552" y2="80" stroke="#e2903a" stroke-width="1.2"/>
  <line x1="532" y1="123" x2="552" y2="104" stroke="#e2903a" stroke-width="1.2"/>
  <rect x="552" y="72" width="76" height="44" rx="5" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <text x="590" y="90" font-size="9" text-anchor="middle" fill="#e2903a">joint repr.</text>
  <text x="590" y="104" font-size="9" text-anchor="middle" fill="#e2903a">→ classifier</text>

  <text x="590" y="136" font-size="11" text-anchor="middle" fill="#e2903a">0.93</text>
  <text x="590" y="152" font-size="10" text-anchor="middle" fill="currentColor">→ remove</text>

  <text x="490" y="196" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">one classifier over the combination:</text>
  <text x="490" y="208" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">the harm exists only jointly,</text>
  <text x="490" y="220" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">and the joint input carries it</text>

  <!-- footer -->
  <text x="320" y="262" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">~500M posts/day is what makes the harder joint-representation learning problem feasible</text>
</svg>

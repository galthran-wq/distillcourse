<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- main pipeline row -->
  <rect x="8" y="146" width="76" height="60" rx="5" fill="none" stroke="currentColor"/>
  <text x="46" y="171" font-size="11" text-anchor="middle" fill="currentColor">post</text>
  <text x="46" y="186" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">text + image</text>

  <line x1="84" y1="176" x2="98" y2="176" stroke="currentColor" stroke-width="1.2"/>
  <path d="M98 176 l-5 -3 v6 z" fill="currentColor"/>

  <!-- backbone -->
  <rect x="100" y="126" width="148" height="100" rx="5" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <text x="174" y="141" font-size="10" text-anchor="middle" fill="#e2903a">multimodal backbone</text>
  <rect x="108" y="150" width="62" height="24" rx="4" fill="none" stroke="currentColor"/>
  <text x="139" y="166" font-size="9" text-anchor="middle" fill="currentColor">text encoder</text>
  <rect x="108" y="184" width="62" height="24" rx="4" fill="none" stroke="currentColor"/>
  <text x="139" y="200" font-size="9" text-anchor="middle" fill="currentColor">image encoder</text>
  <line x1="170" y1="162" x2="184" y2="172" stroke="currentColor" stroke-width="1"/>
  <line x1="170" y1="196" x2="184" y2="186" stroke="currentColor" stroke-width="1"/>
  <rect x="186" y="164" width="54" height="30" rx="4" fill="none" stroke="#e2903a"/>
  <text x="213" y="182" font-size="9" text-anchor="middle" fill="#e2903a">joint repr.</text>
  <text x="174" y="219" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">early fusion</text>

  <line x1="248" y1="176" x2="260" y2="176" stroke="currentColor" stroke-width="1.2"/>
  <path d="M260 176 l-5 -3 v6 z" fill="currentColor"/>

  <!-- per-class heads -->
  <rect x="262" y="126" width="86" height="100" rx="5" fill="none" stroke="currentColor"/>
  <text x="305" y="141" font-size="10" text-anchor="middle" fill="currentColor">per-class heads</text>
  <rect x="270" y="150" width="70" height="20" rx="4" fill="none" stroke="currentColor"/>
  <text x="305" y="164" font-size="9" text-anchor="middle" fill="currentColor">violence</text>
  <rect x="270" y="176" width="70" height="20" rx="4" fill="none" stroke="currentColor"/>
  <text x="305" y="190" font-size="9" text-anchor="middle" fill="currentColor">hate speech</text>
  <text x="305" y="215" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">… N heads</text>

  <line x1="348" y1="176" x2="360" y2="176" stroke="currentColor" stroke-width="1.2"/>
  <path d="M360 176 l-5 -3 v6 z" fill="currentColor"/>

  <!-- router -->
  <rect x="362" y="146" width="92" height="60" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="408" y="171" font-size="10" text-anchor="middle" fill="currentColor">threshold router</text>
  <text x="408" y="186" font-size="8" text-anchor="middle" fill="currentColor" opacity="0.55">per-class thresholds</text>

  <!-- high band: auto-remove -->
  <path d="M408 146 v-72 h74" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <path d="M482 74 l-5 -3 v6 z" fill="currentColor"/>
  <text x="418" y="106" font-size="9" fill="currentColor" opacity="0.55">high band</text>
  <rect x="486" y="52" width="130" height="44" rx="5" fill="none" stroke="currentColor"/>
  <text x="551" y="71" font-size="11" text-anchor="middle" fill="currentColor">auto-remove</text>
  <text x="551" y="86" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">measured precision ≥ floor</text>

  <!-- mid band: review queue chain -->
  <line x1="454" y1="150" x2="482" y2="150" stroke="currentColor" stroke-width="1.2"/>
  <path d="M482 150 l-5 -3 v6 z" fill="currentColor"/>
  <rect x="486" y="128" width="130" height="40" rx="5" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <text x="551" y="145" font-size="11" text-anchor="middle" fill="#e2903a">review queue</text>
  <text x="551" y="160" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">severity × uncertainty</text>

  <line x1="551" y1="168" x2="551" y2="184" stroke="currentColor" stroke-width="1.2"/>
  <path d="M551 184 l-3 -5 h6 z" fill="currentColor"/>
  <rect x="486" y="186" width="130" height="34" rx="5" fill="none" stroke="currentColor"/>
  <text x="551" y="207" font-size="11" text-anchor="middle" fill="currentColor">human review</text>

  <line x1="551" y1="220" x2="551" y2="238" stroke="currentColor" stroke-width="1.2"/>
  <path d="M551 238 l-3 -5 h6 z" fill="currentColor"/>
  <rect x="486" y="240" width="130" height="44" rx="5" fill="none" stroke="currentColor"/>
  <text x="551" y="259" font-size="11" text-anchor="middle" fill="currentColor">enforcement</text>
  <text x="551" y="274" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">appeals</text>

  <!-- low band: publish -->
  <line x1="408" y1="206" x2="408" y2="248" stroke="#5aa46a" stroke-width="1.2"/>
  <path d="M408 248 l-3 -5 h6 z" fill="#5aa46a"/>
  <text x="418" y="232" font-size="9" fill="currentColor" opacity="0.55">low band</text>
  <rect x="362" y="250" width="92" height="44" rx="5" fill="none" stroke="#5aa46a" stroke-width="1.5"/>
  <text x="408" y="269" font-size="11" text-anchor="middle" fill="#5aa46a">publish</text>
  <text x="408" y="284" font-size="8" text-anchor="middle" fill="currentColor" opacity="0.55">async sweep re-scores</text>

  <!-- training store -->
  <rect x="100" y="322" width="148" height="52" rx="5" fill="none" stroke="#4c8dd6" stroke-width="1.5"/>
  <text x="174" y="343" font-size="11" text-anchor="middle" fill="#4c8dd6">training store</text>
  <text x="174" y="359" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">labels + lineage</text>

  <!-- label return paths (dashed blue) -->
  <path d="M362 280 h-70 v54 h-40" fill="none" stroke="#4c8dd6" stroke-width="1.2" stroke-dasharray="4 3"/>
  <path d="M252 334 l7 -3.5 v7 z" fill="#4c8dd6"/>
  <text x="300" y="312" font-size="9" fill="#4c8dd6">user reports</text>

  <path d="M486 210 h-24 v134 h-210" fill="none" stroke="#4c8dd6" stroke-width="1.2" stroke-dasharray="4 3"/>
  <path d="M252 344 l7 -3.5 v7 z" fill="#4c8dd6"/>
  <text x="330" y="340" font-size="9" fill="#4c8dd6">verdicts · appeal outcomes</text>

  <!-- 1% holdout -->
  <path d="M46 206 v158 h50" fill="none" stroke="#4c8dd6" stroke-width="1.2" stroke-dasharray="4 3"/>
  <path d="M96 364 l-7 -3.5 v7 z" fill="#4c8dd6"/>
  <text x="52" y="252" font-size="9" fill="#4c8dd6">1% unfiltered</text>
  <text x="52" y="264" font-size="9" fill="#4c8dd6">holdout →</text>
  <text x="52" y="276" font-size="9" fill="#4c8dd6">dedicated review</text>

  <!-- retrain -->
  <path d="M174 322 v-96" fill="none" stroke="#e2903a" stroke-width="1.2" stroke-dasharray="4 3"/>
  <path d="M174 226 l-3 5 h6 z" fill="#e2903a"/>
  <text x="180" y="308" font-size="9" fill="#e2903a">retrain</text>
</svg>

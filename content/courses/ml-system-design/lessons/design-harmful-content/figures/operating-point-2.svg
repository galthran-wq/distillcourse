<svg viewBox="0 0 480 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="64" y="20" font-size="10" fill="currentColor" opacity="0.55">2 · the precision floor</text>

  <!-- axes -->
  <line x1="60" y1="250" x2="440" y2="250" stroke="currentColor" stroke-width="1"/>
  <line x1="60" y1="250" x2="60" y2="30" stroke="currentColor" stroke-width="1"/>
  <text x="250" y="282" font-size="11" text-anchor="middle" fill="currentColor">recall (one class)</text>
  <text x="26" y="140" font-size="11" text-anchor="middle" fill="currentColor" transform="rotate(-90 26 140)">precision</text>
  <text x="60" y="266" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">0</text>
  <text x="250" y="266" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">0.5</text>
  <text x="440" y="266" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">1.0</text>
  <text x="50" y="254" font-size="9" text-anchor="end" fill="currentColor" opacity="0.55">0</text>
  <text x="50" y="144" font-size="9" text-anchor="end" fill="currentColor" opacity="0.55">0.5</text>
  <text x="50" y="34" font-size="9" text-anchor="end" fill="currentColor" opacity="0.55">1.0</text>

  <!-- PR curve -->
  <path d="M79 34 L136 41 L174 52 L231 74 L258 87 L288 107 L318 129 L345 151 L375 180 L402 206 L429 237"
        fill="none" stroke="#e2903a" stroke-width="2"/>

  <!-- precision floor -->
  <line x1="60" y1="74" x2="440" y2="74" stroke="currentColor" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="436" y="66" font-size="10" text-anchor="end" fill="currentColor">precision floor 0.80</text>

  <!-- operating point -->
  <circle cx="231" cy="74" r="4.5" fill="#e2903a"/>
  <line x1="231" y1="74" x2="231" y2="250" stroke="currentColor" stroke-width="1" stroke-dasharray="3 3" opacity="0.5"/>
  <text x="231" y="242" font-size="10" text-anchor="middle" fill="currentColor">recall 0.45</text>
  <text x="240" y="96" font-size="9" fill="currentColor" opacity="0.55">what the floor buys</text>
</svg>

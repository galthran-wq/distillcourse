<svg viewBox="0 0 600 350" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="10" y="18" font-size="10" fill="currentColor" opacity="0.55">flagged posts, ranked by severity × uncertainty</text>

  <!-- queue rows: bar length = priority -->
  <rect x="10" y="30" width="230" height="26" rx="4" fill="none" stroke="currentColor"/>
  <rect x="14" y="35" width="196" height="16" rx="2" fill="#e2903a" opacity="0.75"/>
  <text x="248" y="47" font-size="9" fill="currentColor">threat · sev 5 · unc 0.48</text>

  <rect x="10" y="62" width="230" height="26" rx="4" fill="none" stroke="currentColor"/>
  <rect x="14" y="67" width="168" height="16" rx="2" fill="#e2903a" opacity="0.75"/>
  <text x="248" y="79" font-size="9" fill="currentColor">self-harm · sev 5 · unc 0.41</text>

  <rect x="10" y="94" width="230" height="26" rx="4" fill="none" stroke="currentColor"/>
  <rect x="14" y="99" width="132" height="16" rx="2" fill="#e2903a" opacity="0.75"/>
  <text x="248" y="111" font-size="9" fill="currentColor">hate speech · sev 3 · unc 0.52</text>

  <rect x="10" y="126" width="230" height="26" rx="4" fill="none" stroke="currentColor"/>
  <rect x="14" y="131" width="104" height="16" rx="2" fill="#e2903a" opacity="0.75"/>
  <text x="248" y="143" font-size="9" fill="currentColor">nudity · sev 2 · unc 0.50</text>

  <!-- capacity cut-line -->
  <line x1="10" y1="164" x2="424" y2="164" stroke="currentColor" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="446" y="161" font-size="10" fill="currentColor">capacity cut-line:</text>
  <text x="446" y="174" font-size="10" fill="currentColor">today's review budget</text>

  <rect x="10" y="176" width="230" height="26" rx="4" fill="none" stroke="currentColor" opacity="0.5"/>
  <rect x="14" y="181" width="72" height="16" rx="2" fill="currentColor" opacity="0.25"/>
  <text x="248" y="193" font-size="9" fill="currentColor" opacity="0.55">hate speech · sev 3 · unc 0.18</text>

  <rect x="10" y="208" width="230" height="26" rx="4" fill="none" stroke="currentColor" opacity="0.5"/>
  <rect x="14" y="213" width="48" height="16" rx="2" fill="currentColor" opacity="0.25"/>
  <text x="248" y="225" font-size="9" fill="currentColor" opacity="0.55">spam-adjacent · sev 1 · unc 0.22</text>

  <!-- above the line: to reviewers -->
  <path d="M418 95 h38" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <path d="M456 95 l-6 -3 v6 z" fill="currentColor"/>
  <rect x="460" y="44" width="132" height="46" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="526" y="64" font-size="11" text-anchor="middle" fill="currentColor">human review</text>
  <text x="526" y="79" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">~250 decisions/day each</text>

  <!-- below the line: async sweep -->
  <path d="M418 221 h38" fill="none" stroke="#5aa46a" stroke-width="1.2"/>
  <path d="M456 221 l-6 -3 v6 z" fill="#5aa46a"/>
  <rect x="460" y="198" width="132" height="46" rx="5" fill="none" stroke="#5aa46a" stroke-width="1.5"/>
  <text x="526" y="218" font-size="10" text-anchor="middle" fill="#5aa46a">async sweep</text>
  <text x="526" y="233" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">re-scored on new signals</text>

  <!-- verdicts back to training -->
  <path d="M460 84 h-26 v224 h-2" fill="none" stroke="#4c8dd6" stroke-width="1.2" stroke-dasharray="4 3"/>
  <path d="M432 308 l7 -3.5 v7 z" fill="#4c8dd6"/>
  <rect x="262" y="286" width="170" height="44" rx="5" fill="none" stroke="#4c8dd6" stroke-width="1.5"/>
  <text x="347" y="304" font-size="10" text-anchor="middle" fill="#4c8dd6">training store</text>
  <text x="347" y="319" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">verdict + lineage tag</text>

  <text x="10" y="266" font-size="9" fill="currentColor" opacity="0.55">a certain score — either way — gains little from confirmation;</text>
  <text x="10" y="280" font-size="9" fill="currentColor" opacity="0.55">review is spent where the class is grave and the model undecided</text>
  <text x="10" y="308" font-size="9" fill="currentColor" opacity="0.55">bar length = severity × uncertainty</text>
  <text x="10" y="322" font-size="9" fill="currentColor" opacity="0.55">(the queue's priority score)</text>
</svg>

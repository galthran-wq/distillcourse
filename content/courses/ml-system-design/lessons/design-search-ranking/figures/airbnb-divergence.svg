<svg viewBox="0 0 640 275" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="14" y="24" font-size="11" fill="currentColor">Airbnb search, first deep-learning migration (2018) — each intervention, both verdicts</text>

  <!-- header -->
  <line x1="14" y1="58" x2="626" y2="58" stroke="currentColor" opacity="0.4"/>
  <text x="20" y="48" font-size="10" fill="currentColor" opacity="0.55">intervention</text>
  <text x="296" y="48" font-size="10" fill="#4c8dd6">offline Δ</text>
  <text x="392" y="48" font-size="10" fill="#e2903a">online Δ</text>
  <text x="492" y="48" font-size="10" fill="currentColor" opacity="0.55">what it demonstrates</text>

  <!-- rows -->
  <text x="20" y="82" font-size="10.5" fill="currentColor">GBDT → deep net, drop-in swap</text>
  <text x="296" y="82" font-size="10.5" fill="#4c8dd6">no gain</text>
  <text x="392" y="82" font-size="10.5" fill="#e2903a">booking-neutral</text>
  <text x="492" y="82" font-size="9.5" fill="currentColor" opacity="0.7">shipped for the pipeline</text>
  <line x1="14" y1="94" x2="626" y2="94" stroke="currentColor" opacity="0.15"/>

  <text x="20" y="116" font-size="10.5" fill="currentColor">dropout on the ranker</text>
  <text x="296" y="116" font-size="10.5" fill="#4c8dd6">slight loss</text>
  <text x="392" y="116" font-size="10.5" fill="#e2903a">—</text>
  <text x="492" y="116" font-size="9.5" fill="currentColor" opacity="0.7">tried and rejected</text>
  <line x1="14" y1="128" x2="626" y2="128" stroke="currentColor" opacity="0.15"/>

  <text x="20" y="150" font-size="10.5" fill="currentColor">feature noise, its replacement</text>
  <text x="296" y="150" font-size="10.5" fill="#4c8dd6">+1% nDCG</text>
  <text x="392" y="150" font-size="10.5" fill="#e2903a">0 (n.s.)</text>
  <text x="492" y="150" font-size="9.5" fill="currentColor" opacity="0.7">the offline–online gap</text>
  <line x1="14" y1="162" x2="626" y2="162" stroke="currentColor" opacity="0.15"/>

  <text x="20" y="184" font-size="10.5" fill="currentColor">all-zero weight + embedding init</text>
  <text x="296" y="184" font-size="10.5" fill="#4c8dd6">did not train</text>
  <text x="392" y="184" font-size="10.5" fill="#e2903a">—</text>
  <text x="492" y="184" font-size="9.5" fill="currentColor" opacity="0.7">fix: Xavier + U(−1,1) init</text>
  <line x1="14" y1="196" x2="626" y2="196" stroke="currentColor" opacity="0.15"/>

  <text x="20" y="218" font-size="10.5" fill="currentColor">LazyAdam, large embedding tables</text>
  <text x="296" y="218" font-size="10.5" fill="#4c8dd6">faster training</text>
  <text x="392" y="218" font-size="10.5" fill="#e2903a">—</text>
  <text x="492" y="218" font-size="9.5" fill="currentColor" opacity="0.7">speed, not quality</text>

  <line x1="14" y1="236" x2="626" y2="236" stroke="currentColor" opacity="0.4"/>
  <text x="320" y="258" font-size="10" text-anchor="middle" fill="currentColor" opacity="0.55">one row moved an offline metric — and that row moved nothing online</text>
</svg>

<svg viewBox="0 0 620 224" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- column headers -->
  <text x="16" y="34" font-size="10" fill="currentColor" opacity="0.55">query</text>
  <text x="345" y="34" font-size="11.5" text-anchor="middle" fill="#e2903a" font-weight="600">term index</text>
  <text x="515" y="34" font-size="11.5" text-anchor="middle" fill="#4c8dd6" font-weight="600">embedding path</text>

  <!-- separators -->
  <line x1="16" y1="46" x2="604" y2="46" stroke="currentColor" stroke-width="1" opacity="0.3"/>
  <line x1="16" y1="130" x2="604" y2="130" stroke="currentColor" stroke-width="1" opacity="0.3"/>

  <!-- row 1: exact rare name -->
  <text x="16" y="80" font-size="11" fill="currentColor" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">casa batll&#243;</text>
  <text x="16" y="96" font-size="9.5" fill="currentColor" opacity="0.55">a rare exact name</text>
  <text x="345" y="86" font-size="16" text-anchor="middle" fill="#5aa46a">&#10003;</text>
  <text x="345" y="106" font-size="9.5" text-anchor="middle" fill="currentColor" opacity="0.7">the postings list hits it exactly</text>
  <text x="515" y="86" font-size="16" text-anchor="middle" fill="currentColor" opacity="0.6">&#10007;</text>
  <text x="515" y="106" font-size="9.5" text-anchor="middle" fill="currentColor" opacity="0.7">the name blurs among lookalikes</text>

  <!-- row 2: paraphrase -->
  <text x="16" y="162" font-size="11" fill="currentColor" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">loft with garden</text>
  <text x="16" y="178" font-size="9.5" fill="currentColor" opacity="0.55">listing says "open-plan</text>
  <text x="16" y="191" font-size="9.5" fill="currentColor" opacity="0.55">apartment, private yard"</text>
  <text x="345" y="170" font-size="16" text-anchor="middle" fill="currentColor" opacity="0.6">&#10007;</text>
  <text x="345" y="190" font-size="9.5" text-anchor="middle" fill="currentColor" opacity="0.7">no shared tokens, no match</text>
  <text x="515" y="170" font-size="16" text-anchor="middle" fill="#5aa46a">&#10003;</text>
  <text x="515" y="190" font-size="9.5" text-anchor="middle" fill="currentColor" opacity="0.7">paraphrases are neighbors</text>
</svg>

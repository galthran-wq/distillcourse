<svg viewBox="0 0 620 252" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <marker id="qtf-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- raw query -->
  <text x="106" y="84" font-size="10" text-anchor="middle" fill="currentColor" opacity="0.55">raw query string</text>
  <rect x="16" y="94" width="180" height="46" rx="5" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="106" y="113" font-size="10.5" text-anchor="middle" fill="currentColor" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">"Loft&#160;&#160;&#160;with garden,</text>
  <text x="106" y="128" font-size="10.5" text-anchor="middle" fill="currentColor" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">LISBOA"</text>

  <!-- normalize -->
  <line x1="200" y1="117" x2="250" y2="117" stroke="currentColor" stroke-width="1.2" marker-end="url(#qtf-arrow)"/>
  <text x="226" y="107" font-size="9.5" text-anchor="middle" fill="currentColor" opacity="0.7">normalize</text>

  <!-- normalized query -->
  <rect x="258" y="94" width="140" height="46" rx="5" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="328" y="113" font-size="10.5" text-anchor="middle" fill="currentColor" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">loft with garden</text>
  <text x="328" y="128" font-size="10.5" text-anchor="middle" fill="currentColor" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">lisboa</text>
  <text x="328" y="84" font-size="10" text-anchor="middle" fill="currentColor" opacity="0.55">lowercased, de-accented, lemmatized</text>

  <!-- branch: tokens -->
  <line x1="398" y1="106" x2="460" y2="66" stroke="currentColor" stroke-width="1.2" marker-end="url(#qtf-arrow)"/>
  <text x="424" y="72" font-size="9.5" text-anchor="middle" fill="currentColor" opacity="0.7">tokenize</text>
  <rect x="466" y="36" width="140" height="52" rx="5" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <text x="536" y="58" font-size="10.5" text-anchor="middle" fill="#e2903a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">loft &#183; garden &#183; lisboa</text>
  <text x="536" y="76" font-size="9.5" text-anchor="middle" fill="#e2903a">token IDs &#8594; term index</text>

  <!-- branch: vector -->
  <line x1="398" y1="128" x2="460" y2="168" stroke="currentColor" stroke-width="1.2" marker-end="url(#qtf-arrow)"/>
  <text x="408" y="158" font-size="9.5" text-anchor="middle" fill="currentColor" opacity="0.7">query encoder,</text>
  <text x="408" y="170" font-size="9.5" text-anchor="middle" fill="currentColor" opacity="0.7">one forward pass</text>
  <rect x="466" y="160" width="140" height="52" rx="5" fill="none" stroke="#4c8dd6" stroke-width="1.5"/>
  <text x="536" y="182" font-size="10.5" text-anchor="middle" fill="#4c8dd6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">q &#8712; &#8477;&#185;&#178;&#8312;</text>
  <text x="536" y="200" font-size="9.5" text-anchor="middle" fill="#4c8dd6">vector &#8594; ANN index</text>

  <text x="310" y="240" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">every step runs on the request path, inside the 200 ms page budget</text>
</svg>

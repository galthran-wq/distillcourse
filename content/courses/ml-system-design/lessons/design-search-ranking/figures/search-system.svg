<svg viewBox="0 0 780 310" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- query box -->
  <rect x="4" y="122" width="76" height="56" rx="5" fill="none" stroke="currentColor"/>
  <text x="42" y="142" font-size="11" text-anchor="middle" fill="currentColor">query</text>
  <text x="42" y="157" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">"loft with garden,</text>
  <text x="42" y="169" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">Lisbon"</text>

  <line x1="80" y1="150" x2="92" y2="150" stroke="#e2903a" stroke-width="1.5"/>
  <path d="M92 150 l-5 -3 v6 z" fill="#e2903a"/>

  <!-- query understanding -->
  <rect x="94" y="116" width="106" height="68" rx="5" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <text x="147" y="134" font-size="11" text-anchor="middle" fill="#e2903a">query</text>
  <text x="147" y="147" font-size="11" text-anchor="middle" fill="#e2903a">understanding</text>
  <text x="147" y="162" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">normalize · tokenize</text>
  <text x="147" y="174" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">· embed — ~5 ms</text>

  <!-- arrows to two retrievers -->
  <path d="M200 138 C 214 120, 214 90, 224 74" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <path d="M224 74 l-6 1 l3 5 z" fill="#e2903a"/>
  <text x="216" y="98" font-size="9" fill="currentColor" opacity="0.55">tokens</text>
  <path d="M200 162 C 214 180, 214 210, 224 226" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <path d="M224 226 l-6 -1 l3 -5 z" fill="#e2903a"/>
  <text x="204" y="206" font-size="9" fill="currentColor" opacity="0.55">vector q</text>

  <!-- term retriever -->
  <rect x="226" y="40" width="128" height="60" rx="5" fill="none" stroke="currentColor"/>
  <text x="290" y="58" font-size="11" text-anchor="middle" fill="currentColor">inverted index</text>
  <text x="290" y="72" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">term match, 10⁷ listings</text>
  <text x="290" y="86" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">top 500 · ~15 ms</text>

  <!-- ANN retriever -->
  <rect x="226" y="200" width="128" height="60" rx="5" fill="none" stroke="currentColor"/>
  <text x="290" y="218" font-size="11" text-anchor="middle" fill="currentColor">ANN index</text>
  <text x="290" y="232" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">10⁷ listing vectors</text>
  <text x="290" y="246" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">top 500 · ~15 ms</text>

  <text x="290" y="150" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">run in parallel</text>

  <!-- arrows to union -->
  <path d="M354 70 C 372 84, 372 116, 384 132" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <path d="M384 132 l-6 -1 l3 -5 z" fill="currentColor"/>
  <text x="376" y="102" font-size="9" fill="currentColor" opacity="0.55">500</text>
  <path d="M354 230 C 372 216, 372 184, 384 168" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <path d="M384 168 l-6 1 l3 5 z" fill="currentColor"/>
  <text x="376" y="204" font-size="9" fill="currentColor" opacity="0.55">500</text>

  <!-- union + dedupe + hard filters -->
  <rect x="386" y="116" width="104" height="68" rx="5" fill="none" stroke="currentColor"/>
  <text x="438" y="134" font-size="11" text-anchor="middle" fill="currentColor">union + dedupe</text>
  <text x="438" y="148" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">≈800 → 500</text>
  <text x="438" y="164" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">then hard filters:</text>
  <text x="438" y="176" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">dates · availability</text>

  <line x1="490" y1="150" x2="504" y2="150" stroke="currentColor" stroke-width="1.2"/>
  <path d="M504 150 l-5 -3 v6 z" fill="currentColor"/>

  <!-- ranker -->
  <rect x="506" y="116" width="86" height="68" rx="5" fill="none" stroke="#4c8dd6" stroke-width="1.5"/>
  <text x="549" y="138" font-size="11" text-anchor="middle" fill="#4c8dd6">ranker</text>
  <text x="549" y="154" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">500 × 0.2 ms</text>
  <text x="549" y="167" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">≈ 100 ms</text>

  <line x1="592" y1="150" x2="604" y2="150" stroke="currentColor" stroke-width="1.2"/>
  <path d="M604 150 l-5 -3 v6 z" fill="currentColor"/>

  <!-- re-ranking -->
  <rect x="606" y="116" width="100" height="68" rx="5" fill="none" stroke="currentColor"/>
  <text x="656" y="138" font-size="11" text-anchor="middle" fill="currentColor">re-rank</text>
  <text x="656" y="155" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">near-dupes ·</text>
  <text x="656" y="167" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">diversity · 10 ms</text>

  <line x1="706" y1="150" x2="718" y2="150" stroke="currentColor" stroke-width="1.2"/>
  <path d="M718 150 l-5 -3 v6 z" fill="currentColor"/>

  <!-- page -->
  <rect x="720" y="122" width="52" height="56" rx="5" fill="none" stroke="currentColor"/>
  <text x="746" y="145" font-size="11" text-anchor="middle" fill="currentColor">page</text>
  <text x="746" y="160" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">top 20</text>

  <!-- budget band -->
  <line x1="4" y1="286" x2="774" y2="286" stroke="currentColor" opacity="0.3" stroke-dasharray="3 3"/>
  <text x="389" y="303" font-size="10" text-anchor="middle" fill="currentColor" opacity="0.55">p99 page budget 200 ms: network + render ~70 · understand 5 · retrieve 15 · rank 100 · re-rank 10</text>
</svg>

<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- session timeline -->
  <text x="14" y="24" font-size="11" fill="currentColor">one search session — query q = "sea view apartment, Barcelona"</text>
  <line x1="40" y1="58" x2="600" y2="58" stroke="currentColor" stroke-width="1.2"/>
  <path d="M600 58 l-6 -3 v6 z" fill="currentColor"/>

  <circle cx="90" cy="58" r="4" fill="currentColor"/>
  <text x="90" y="80" font-size="10" text-anchor="middle" fill="currentColor">page shown:</text>
  <text x="90" y="93" font-size="10" text-anchor="middle" fill="currentColor">12 impressions</text>

  <circle cx="240" cy="58" r="4" fill="#e2903a"/>
  <text x="240" y="80" font-size="10" text-anchor="middle" fill="#e2903a">click L7</text>
  <text x="240" y="93" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">20 s, back</text>

  <circle cx="390" cy="58" r="4" fill="#4c8dd6"/>
  <text x="390" y="80" font-size="10" text-anchor="middle" fill="#4c8dd6">click L4</text>
  <text x="390" y="93" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">3 min on the listing</text>

  <circle cx="540" cy="58" r="4" fill="#5aa46a"/>
  <text x="540" y="80" font-size="10" text-anchor="middle" fill="#5aa46a">click L9 → booked</text>
  <text x="540" y="93" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">booking lands 2 days later</text>

  <!-- grade ladder -->
  <text x="14" y="130" font-size="11" fill="currentColor">event → relevance grade</text>
  <rect x="40" y="142" width="130" height="34" rx="5" fill="none" stroke="currentColor" opacity="0.7"/>
  <text x="105" y="163" font-size="10" text-anchor="middle" fill="currentColor">impression only → 0</text>
  <rect x="190" y="142" width="110" height="34" rx="5" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <text x="245" y="163" font-size="10" text-anchor="middle" fill="currentColor">click → 1</text>
  <rect x="320" y="142" width="120" height="34" rx="5" fill="none" stroke="#4c8dd6" stroke-width="1.5"/>
  <text x="380" y="163" font-size="10" text-anchor="middle" fill="currentColor">long stay → 2</text>
  <rect x="460" y="142" width="120" height="34" rx="5" fill="none" stroke="#5aa46a" stroke-width="1.5"/>
  <text x="520" y="163" font-size="10" text-anchor="middle" fill="currentColor">booking → 3</text>

  <!-- training rows -->
  <text x="14" y="212" font-size="11" fill="currentColor">training rows the session yields (12 total)</text>
  <rect x="40" y="224" width="560" height="88" rx="5" fill="none" stroke="currentColor" opacity="0.5"/>
  <text x="56" y="244" font-size="10" fill="#5aa46a">(q, L9)  rel = 3</text>
  <text x="56" y="262" font-size="10" fill="#4c8dd6">(q, L4)  rel = 2</text>
  <text x="56" y="280" font-size="10" fill="#e2903a">(q, L7)  rel = 1</text>
  <text x="56" y="298" font-size="10" fill="currentColor" opacity="0.7">(q, L1), (q, L2), … 9 impressed-only listings  rel = 0</text>
  <text x="420" y="262" font-size="9" fill="currentColor" opacity="0.55">the graded list is exactly</text>
  <text x="420" y="275" font-size="9" fill="currentColor" opacity="0.55">what nDCG needs: rel per</text>
  <text x="420" y="288" font-size="9" fill="currentColor" opacity="0.55">(query, listing), with order</text>
</svg>

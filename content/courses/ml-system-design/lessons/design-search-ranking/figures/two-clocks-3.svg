<svg viewBox="0 0 640 310" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- indexing lane (dimmed; built indexes persist) -->
  <g opacity="0.22">
    <rect x="4" y="16" width="632" height="126" rx="6" fill="none" stroke="currentColor" stroke-dasharray="4 3"/>
    <text x="14" y="34" font-size="11" fill="currentColor">indexing lane — batch clock (nightly)</text>

    <rect x="16" y="62" width="96" height="48" rx="5" fill="none" stroke="currentColor"/>
    <text x="64" y="82" font-size="10" text-anchor="middle" fill="currentColor">listings 10⁷</text>
    <text x="64" y="96" font-size="9" text-anchor="middle" fill="currentColor">text + photos</text>

    <rect x="150" y="44" width="130" height="36" rx="5" fill="none" stroke="currentColor"/>
    <text x="215" y="66" font-size="10" text-anchor="middle" fill="currentColor">listing encoder (v7)</text>

    <rect x="150" y="96" width="130" height="36" rx="5" fill="none" stroke="currentColor"/>
    <text x="215" y="118" font-size="10" text-anchor="middle" fill="currentColor">tokenize text fields</text>
  </g>

  <!-- persisted indexes feed the lookups -->
  <g>
    <rect x="394" y="44" width="140" height="36" rx="5" fill="none" stroke="#4c8dd6" stroke-width="1.5"/>
    <text x="464" y="60" font-size="10" text-anchor="middle" fill="#4c8dd6">ANN index</text>
    <text x="464" y="73" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">serves the lookup</text>

    <rect x="394" y="96" width="140" height="36" rx="5" fill="none" stroke="#4c8dd6" stroke-width="1.5"/>
    <text x="464" y="112" font-size="10" text-anchor="middle" fill="#4c8dd6">inverted index</text>
    <text x="464" y="125" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">serves the lookup</text>

    <!-- cross-lane arrows: index -> lookup -->
    <path d="M430 80 C 428 120, 428 150, 430 174" fill="none" stroke="#4c8dd6" stroke-width="1.5" stroke-dasharray="4 3"/>
    <path d="M430 174 l-3 -5 h6 z" fill="#4c8dd6"/>
    <path d="M450 132 C 448 170, 448 210, 446 238" fill="none" stroke="#4c8dd6" stroke-width="1.5" stroke-dasharray="4 3"/>
    <path d="M446 238 l-3 -5 h6 z" fill="#4c8dd6"/>
  </g>

  <!-- query lane: second half ACTIVE -->
  <g>
    <rect x="4" y="154" width="632" height="148" rx="6" fill="none" stroke="currentColor" opacity="0.35" stroke-dasharray="4 3"/>
    <text x="14" y="172" font-size="11" fill="#e2903a">query lane — request clock (milliseconds)</text>

    <g opacity="0.45">
      <rect x="16" y="204" width="88" height="44" rx="5" fill="none" stroke="currentColor"/>
      <text x="60" y="230" font-size="10" text-anchor="middle" fill="currentColor">raw query</text>

      <rect x="124" y="204" width="104" height="44" rx="5" fill="none" stroke="currentColor"/>
      <text x="176" y="222" font-size="10" text-anchor="middle" fill="currentColor">normalize ·</text>
      <text x="176" y="236" font-size="10" text-anchor="middle" fill="currentColor">tokenize</text>
    </g>

    <rect x="248" y="176" width="112" height="36" rx="5" fill="none" stroke="currentColor"/>
    <text x="304" y="198" font-size="10" text-anchor="middle" fill="currentColor">query encoder (v7)</text>

    <rect x="248" y="240" width="112" height="36" rx="5" fill="none" stroke="currentColor"/>
    <text x="304" y="262" font-size="10" text-anchor="middle" fill="currentColor">token IDs</text>

    <line x1="360" y1="194" x2="380" y2="194" stroke="#e2903a" stroke-width="1.5"/>
    <path d="M380 194 l-5 -3 v6 z" fill="#e2903a"/>
    <line x1="360" y1="258" x2="380" y2="258" stroke="#e2903a" stroke-width="1.5"/>
    <path d="M380 258 l-5 -3 v6 z" fill="#e2903a"/>

    <rect x="382" y="176" width="96" height="36" rx="5" fill="none" stroke="#e2903a" stroke-width="1.5"/>
    <text x="430" y="198" font-size="10" text-anchor="middle" fill="currentColor">ANN top-500</text>

    <rect x="382" y="240" width="96" height="36" rx="5" fill="none" stroke="#e2903a" stroke-width="1.5"/>
    <text x="430" y="262" font-size="10" text-anchor="middle" fill="currentColor">postings top-500</text>

    <path d="M478 194 C 488 200, 488 214, 494 218" fill="none" stroke="#e2903a" stroke-width="1.5"/>
    <path d="M494 218 l-6 -1 l3 -5 z" fill="#e2903a"/>
    <path d="M478 258 C 488 252, 488 240, 494 236" fill="none" stroke="#e2903a" stroke-width="1.5"/>
    <path d="M494 236 l-6 1 l3 5 z" fill="#e2903a"/>

    <rect x="496" y="204" width="60" height="44" rx="5" fill="none" stroke="#e2903a" stroke-width="1.5"/>
    <text x="526" y="222" font-size="10" text-anchor="middle" fill="currentColor">union</text>
    <text x="526" y="236" font-size="10" text-anchor="middle" fill="currentColor">dedupe</text>

    <line x1="556" y1="226" x2="570" y2="226" stroke="#e2903a" stroke-width="1.5"/>
    <path d="M570 226 l-5 -3 v6 z" fill="#e2903a"/>

    <rect x="572" y="204" width="60" height="44" rx="5" fill="none" stroke="#e2903a" stroke-width="1.5"/>
    <text x="602" y="222" font-size="10" text-anchor="middle" fill="currentColor">ranker</text>
    <text x="602" y="236" font-size="10" text-anchor="middle" fill="currentColor">→ page</text>
  </g>
</svg>

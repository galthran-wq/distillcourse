<svg viewBox="0 0 560 322" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- axes -->
  <line x1="52" y1="250" x2="530" y2="250" stroke="currentColor" stroke-width="1.2"/>
  <line x1="52" y1="250" x2="52" y2="36" stroke="currentColor" stroke-width="1.2"/>
  <text x="300" y="278" font-size="11" text-anchor="middle" fill="currentColor">query rank (log scale)</text>
  <text x="20" y="140" font-size="11" text-anchor="middle" fill="currentColor" transform="rotate(-90 20 140)">daily frequency (log scale)</text>

  <!-- tick labels -->
  <text x="70" y="266" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">1</text>
  <text x="180" y="266" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">10³</text>
  <text x="290" y="266" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">10⁵</text>
  <text x="510" y="266" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">10⁷</text>

  <!-- shaded head area under the curve, up to the cache line -->
  <polygon points="70,60 290,144 290,250 70,250" fill="#e2903a" opacity="0.15"/>

  <!-- zipf line (straight in log-log) -->
  <line x1="70" y1="60" x2="510" y2="228" stroke="#4c8dd6" stroke-width="2"/>
  <text x="118" y="52" font-size="10" fill="#4c8dd6">frequency ∝ 1/rank</text>

  <!-- cache cutoff -->
  <line x1="290" y1="36" x2="290" y2="250" stroke="#e2903a" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="296" y="48" font-size="10" fill="#e2903a">cache = top 10⁵ queries</text>

  <text x="160" y="200" font-size="10" text-anchor="middle" fill="#e2903a">head ≈ 72% of traffic</text>
  <text x="160" y="214" font-size="10" text-anchor="middle" fill="#e2903a">served from cache</text>

  <text x="410" y="180" font-size="10" text-anchor="middle" fill="currentColor" opacity="0.7">tail ≈ 28%</text>
  <text x="410" y="194" font-size="10" text-anchor="middle" fill="currentColor" opacity="0.7">computed per request</text>

  <text x="300" y="298" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">cached object: the query string's deduped candidate set, before any filter</text>
  <text x="300" y="312" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">dates + availability applied per request after the lookup; flushed on index refresh</text>
</svg>

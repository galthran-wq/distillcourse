<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- row 1: traffic -->
  <text x="8" y="26" font-size="11" fill="currentColor" opacity="0.55">traffic</text>
  <text x="76" y="26" font-size="12" fill="currentColor">2×10⁹ DAU × 2 loads/day = 4×10⁹ req/day ÷ 8.64×10⁴ s ≈ 46k/s</text>
  <line x1="478" y1="22" x2="504" y2="22" stroke="#e2903a" stroke-width="1.2"/>
  <path d="M506 22 l-6 -3 v6 z" fill="#e2903a"/>
  <text x="512" y="26" font-size="12" fill="#e2903a">×2 peak ≈ 10⁵ QPS</text>
  <line x1="8" y1="42" x2="632" y2="42" stroke="currentColor" opacity="0.15"/>

  <!-- row 2: funnel volumes and the ranking fleet -->
  <text x="8" y="68" font-size="11" fill="currentColor" opacity="0.55">funnel</text>
  <text x="76" y="68" font-size="12" fill="currentColor">10⁹ corpus → 5,000 retrieved → 500 ranked → 20 shown</text>
  <text x="76" y="88" font-size="12" fill="currentColor">500 × 10⁵ QPS = 5×10⁷ scores/s × 0.2 ms</text>
  <line x1="340" y1="84" x2="366" y2="84" stroke="#e2903a" stroke-width="1.2"/>
  <path d="M368 84 l-6 -3 v6 z" fill="#e2903a"/>
  <text x="374" y="88" font-size="12" fill="#e2903a">≈ 10⁴ accelerators at peak</text>
  <line x1="8" y1="104" x2="632" y2="104" stroke="currentColor" opacity="0.15"/>

  <!-- row 3: index -->
  <text x="8" y="130" font-size="11" fill="currentColor" opacity="0.55">index</text>
  <text x="76" y="130" font-size="12" fill="currentColor">10⁹ items × 128 d × 2 B (FP16) = 2.56×10¹¹ B</text>
  <line x1="388" y1="126" x2="414" y2="126" stroke="#e2903a" stroke-width="1.2"/>
  <path d="M416 126 l-6 -3 v6 z" fill="#e2903a"/>
  <text x="422" y="130" font-size="12" fill="#e2903a">≈ 256 GB → 16 shards</text>
  <text x="76" y="148" font-size="11" fill="currentColor" opacity="0.55">no single node holds it; every query fans out and merges</text>
  <line x1="8" y1="164" x2="632" y2="164" stroke="currentColor" opacity="0.15"/>

  <!-- row 4: label log -->
  <text x="8" y="190" font-size="11" fill="currentColor" opacity="0.55">labels</text>
  <text x="76" y="190" font-size="12" fill="currentColor">20 tiles/load × 4×10⁹ loads = 8×10¹⁰ impressions/day × 500 B</text>
  <line x1="468" y1="186" x2="494" y2="186" stroke="#e2903a" stroke-width="1.2"/>
  <path d="M496 186 l-6 -3 v6 z" fill="#e2903a"/>
  <text x="502" y="190" font-size="12" fill="#e2903a">≈ 40 TB/day</text>
  <text x="76" y="208" font-size="11" fill="currentColor" opacity="0.55">~6×10⁹ watches against ~7.4×10¹⁰ skips — watch rate ≈ 7%; six months ≈ 7 PB</text>
  <line x1="8" y1="224" x2="632" y2="224" stroke="currentColor" opacity="0.15"/>

  <!-- what the numbers already decided -->
  <text x="8" y="250" font-size="11" fill="currentColor" opacity="0.55">forced</text>
  <text x="76" y="250" font-size="12" fill="currentColor">three decisions before any box is drawn:</text>
  <g font-size="11" fill="currentColor" opacity="0.55">
    <text x="76" y="270">deep funnel — corpus × per-item cost fails the 130 ms budget</text>
    <text x="76" y="288">sharded index — 256 GB does not fit one node</text>
    <text x="76" y="306">per-item ranker cost is the fleet bill</text>
  </g>
</svg>

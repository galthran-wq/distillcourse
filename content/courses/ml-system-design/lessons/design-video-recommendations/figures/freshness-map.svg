<svg viewBox="0 0 640 312" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- staleness axis, read left to right -->
  <text x="250" y="16" font-size="11" fill="currentColor" opacity="0.55">allowed staleness →</text>
  <g font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">
    <text x="265" y="36">seconds</text>
    <text x="350" y="36">minutes</text>
    <text x="430" y="36">hours</text>
    <text x="505" y="36">a day</text>
    <text x="590" y="36">a week</text>
  </g>
  <line x1="250" y1="46" x2="624" y2="46" stroke="currentColor" stroke-width="1.2"/>
  <path d="M628 46 l-7 -3 v6 z" fill="currentColor"/>
  <g stroke="currentColor" opacity="0.3">
    <line x1="265" y1="42" x2="265" y2="50"/>
    <line x1="350" y1="42" x2="350" y2="50"/>
    <line x1="430" y1="42" x2="430" y2="50"/>
    <line x1="505" y1="42" x2="505" y2="50"/>
    <line x1="590" y1="42" x2="590" y2="50"/>
  </g>
  <g stroke="currentColor" opacity="0.18" stroke-dasharray="3 3">
    <line x1="265" y1="52" x2="265" y2="236"/>
    <line x1="350" y1="52" x2="350" y2="236"/>
    <line x1="430" y1="52" x2="430" y2="236"/>
    <line x1="505" y1="52" x2="505" y2="236"/>
    <line x1="590" y1="52" x2="590" y2="236"/>
  </g>

  <!-- one row per component, its dot on its clock -->
  <g font-size="12" fill="currentColor">
    <text x="20" y="76">session features</text>
    <text x="20" y="114">seen-state · popular-in-region</text>
    <text x="20" y="152">new-video embeddings</text>
    <text x="20" y="190">profile aggregates · ranker weights</text>
    <text x="20" y="228">two-tower encoder + ANN index</text>
  </g>
  <g font-size="11" fill="currentColor" opacity="0.55">
    <text x="20" y="90">streaming pipeline</text>
    <text x="20" y="128">near-line counters</text>
    <text x="20" y="166">nightly incremental embed job</text>
    <text x="20" y="204">batch sync · stateful warm-start</text>
    <text x="20" y="242">retrain → re-embed → atomic swap</text>
  </g>
  <g fill="#e2903a">
    <circle cx="265" cy="72" r="4.5"/>
    <circle cx="350" cy="110" r="4.5"/>
    <circle cx="430" cy="148" r="4.5"/>
    <circle cx="505" cy="186" r="4.5"/>
    <circle cx="590" cy="224" r="4.5"/>
  </g>
  <text x="442" y="152" font-size="11" fill="#e2903a">the fresh pool covers this gap</text>

  <text x="20" y="266" font-size="11" fill="currentColor" opacity="0.55">encoder and index share one row because they are one artifact: rebuilt and swapped together</text>

  <!-- off the axis -->
  <rect x="20" y="276" width="600" height="28" rx="4" fill="none" stroke="#4c8dd6"/>
  <text x="32" y="294" font-size="11" fill="#4c8dd6">off the axis — engagement weights: serving configuration, moved per experiment, never retrained</text>
</svg>

<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- what one load logs -->
  <text x="20" y="28" font-size="11" fill="#4c8dd6">logged at t = 0 — five impressions, each with its position</text>

  <!-- impression tiles -->
  <g fill="none" stroke="currentColor" stroke-width="1.1">
    <rect x="20" y="44" width="34" height="22" rx="3"/>
    <rect x="20" y="98" width="34" height="22" rx="3"/>
    <rect x="20" y="125" width="34" height="22" rx="3"/>
  </g>
  <rect x="20" y="71" width="34" height="22" rx="3" fill="none" stroke="#e2903a" stroke-width="1.6"/>
  <rect x="20" y="152" width="34" height="22" rx="3" fill="none" stroke="#5aa46a" stroke-width="1.6"/>
  <g font-size="11" text-anchor="middle" fill="currentColor">
    <text x="37" y="59">p1</text>
    <text x="37" y="86" fill="#e2903a">p2</text>
    <text x="37" y="113">p3</text>
    <text x="37" y="140">p4</text>
    <text x="37" y="167" fill="#5aa46a">p5</text>
  </g>

  <!-- per-tile grade -->
  <g font-size="11" fill="currentColor" opacity="0.55">
    <text x="62" y="59">skip — the negative, ~93% of impressions</text>
    <text x="62" y="113">skip</text>
    <text x="62" y="140">hide — explicit negative, a guardrail label</text>
  </g>
  <text x="62" y="86" font-size="11" fill="#e2903a">clicked, t = 1 min</text>
  <text x="62" y="167" font-size="11" fill="#5aa46a">unranked — the 1% exploration slice</text>

  <!-- click leads to the watch bar -->
  <path d="M172 82 C 240 82, 262 76, 322 73" fill="none" stroke="#e2903a" stroke-width="1.1"/>
  <path d="M326 73 l-7 -3 v6 z" fill="#e2903a"/>

  <!-- watch bar with grade markers -->
  <text x="330" y="52" font-size="11" fill="#e2903a">62% watched → watch ✓  long watch ✓  finish ✗</text>
  <rect x="330" y="62" width="290" height="16" rx="3" fill="none" stroke="currentColor"/>
  <rect x="330" y="62" width="180" height="16" rx="3" fill="#e2903a" opacity="0.45"/>
  <g stroke="currentColor" stroke-dasharray="3 3" opacity="0.5">
    <line x1="345" y1="56" x2="345" y2="86"/>
    <line x1="475" y1="56" x2="475" y2="86"/>
    <line x1="620" y1="56" x2="620" y2="86"/>
  </g>
  <g font-size="11" fill="currentColor" opacity="0.55">
    <text x="345" y="100" text-anchor="middle">30 s: watch</text>
    <text x="475" y="100" text-anchor="middle">50%: long watch</text>
    <text x="620" y="100" text-anchor="end">finish</text>
    <text x="330" y="126">a stop before 30 s is click-and-abandon —</text>
    <text x="330" y="140">the clickbait signature, graded on its own</text>
  </g>

  <line x1="20" y1="186" x2="620" y2="186" stroke="currentColor" opacity="0.15"/>

  <!-- loop lengths -->
  <text x="20" y="208" font-size="11" fill="currentColor" opacity="0.55">loop lengths — when each grade becomes knowable</text>
  <g font-size="11" fill="currentColor">
    <text x="20" y="232">skip · click</text>
    <text x="20" y="254">watch · long watch · finish</text>
    <text x="20" y="276">like · hide · report</text>
  </g>
  <g font-size="11" fill="currentColor" opacity="0.55">
    <text x="240" y="232">within the load — seconds</text>
    <text x="240" y="254">30 s to the end of the video</text>
    <text x="240" y="276">immediately, on the tap</text>
  </g>
  <text x="20" y="304" font-size="11" fill="#4c8dd6">attribution window: 10 min from impression — a watch-later opened tomorrow is counted as a skip</text>
</svg>

<svg viewBox="0 0 640 296" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- column headers -->
  <text x="208" y="22" font-size="12" text-anchor="middle" fill="currentColor">the template says</text>
  <text x="490" y="22" font-size="12" text-anchor="middle" fill="#e2903a">the record shows</text>
  <line x1="340" y1="12" x2="340" y2="288" stroke="currentColor" opacity="0.2"/>
  <line x1="8" y1="32" x2="632" y2="32" stroke="currentColor" opacity="0.3"/>

  <!-- row labels -->
  <g font-size="11" fill="currentColor" opacity="0.55">
    <text x="8" y="54">retrieval</text>
    <text x="8" y="118">time</text>
    <text x="8" y="182">exploration</text>
    <text x="8" y="246">ownership</text>
  </g>

  <!-- template column -->
  <g font-size="11.5" fill="currentColor">
    <text x="76" y="54">one candidate-generation model</text>
    <text x="76" y="118">a single-pass design, frozen at ship</text>
    <text x="76" y="182">“balance exploration vs. exploitation”</text>
    <text x="76" y="246">one diagram, one implied owner</text>
  </g>
  <g font-size="11" fill="currentColor" opacity="0.55">
    <text x="76" y="72">matrix factorization, or a single two-tower</text>
    <text x="76" y="136">“retrain daily” stated, never designed</text>
    <text x="76" y="200">a requirements bullet, no budget attached</text>
    <text x="76" y="264">no interface drawn: no seam admitted</text>
  </g>

  <!-- record column -->
  <g font-size="11.5" fill="#e2903a">
    <text x="352" y="54">a portfolio of algorithms in parallel</text>
    <text x="352" y="118">cadence is part of the design</text>
    <text x="352" y="182">a priced budget: ~1% of impressions</text>
    <text x="352" y="246">team seams at every stage boundary</text>
  </g>
  <g font-size="11" fill="currentColor" opacity="0.55">
    <text x="352" y="72">topic match · watched-together · embeddings,</text>
    <text x="352" y="86">each with its own clock and quota</text>
    <text x="352" y="136">daily stateful ranker · weekly tower + index,</text>
    <text x="352" y="150">priced by the freshness-value experiment</text>
    <text x="352" y="200">traffic pools and slots — recall, propensity</text>
    <text x="352" y="214">and loop health all spend from it</text>
    <text x="352" y="264">score and calibration contracts, embedding</text>
    <text x="352" y="278">consumers — where entanglement lives</text>
  </g>

  <g stroke="currentColor" opacity="0.15">
    <line x1="8" y1="96" x2="632" y2="96"/>
    <line x1="8" y1="160" x2="632" y2="160"/>
    <line x1="8" y1="224" x2="632" y2="224"/>
  </g>
</svg>

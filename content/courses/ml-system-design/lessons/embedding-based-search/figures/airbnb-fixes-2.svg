<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="320" y="22" font-size="11.5" text-anchor="middle" fill="currentColor" opacity="0.7">fix 1 — the booked listing joins every window's context</text>

  <!-- window bracket -->
  <rect x="45" y="84" width="360" height="52" rx="8" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="4 3" opacity="0.5"/>
  <text x="52" y="76" font-size="10" fill="currentColor" opacity="0.55">sliding window: central L₃, context ±2</text>

  <!-- positive edges (unchanged) -->
  <path d="M 225 94 Q 187 62 150 94" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <path d="M 225 94 Q 262 62 300 94" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <path d="M 225 92 Q 150 38 75 92" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <path d="M 225 92 Q 300 38 375 92" fill="none" stroke="#e2903a" stroke-width="1.5"/>

  <!-- global-context edges from the booked listing -->
  <path d="M 560 92 Q 392 14 225 92" fill="none" stroke="#5aa46a" stroke-width="1.8"/>
  <path d="M 560 92 Q 318 2 75 92" fill="none" stroke="#5aa46a" stroke-width="1" stroke-dasharray="4 3" opacity="0.5"/>
  <path d="M 560 92 Q 355 8 150 92" fill="none" stroke="#5aa46a" stroke-width="1" stroke-dasharray="4 3" opacity="0.5"/>
  <path d="M 560 92 Q 430 24 300 92" fill="none" stroke="#5aa46a" stroke-width="1" stroke-dasharray="4 3" opacity="0.5"/>
  <path d="M 560 92 Q 468 40 375 92" fill="none" stroke="#5aa46a" stroke-width="1" stroke-dasharray="4 3" opacity="0.5"/>
  <path d="M 560 94 Q 505 60 450 94" fill="none" stroke="#5aa46a" stroke-width="1" stroke-dasharray="4 3" opacity="0.5"/>

  <!-- timeline -->
  <line x1="45" y1="110" x2="600" y2="110" stroke="currentColor" stroke-width="1" opacity="0.5"/>
  <path d="M 600 110 l -8 -4 l 0 8 z" fill="currentColor" opacity="0.5"/>

  <!-- session circles -->
  <circle cx="75" cy="110" r="14" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="75" y="145" font-size="10.5" text-anchor="middle" fill="currentColor" opacity="0.7">L₁</text>
  <circle cx="150" cy="110" r="14" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="150" y="145" font-size="10.5" text-anchor="middle" fill="currentColor" opacity="0.7">L₂</text>
  <circle cx="225" cy="110" r="14" fill="#e2903a" fill-opacity="0.25" stroke="#e2903a" stroke-width="2"/>
  <text x="225" y="145" font-size="10.5" text-anchor="middle" fill="#e2903a">L₃ central</text>
  <circle cx="300" cy="110" r="14" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="300" y="145" font-size="10.5" text-anchor="middle" fill="currentColor" opacity="0.7">L₄</text>
  <circle cx="375" cy="110" r="14" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="375" y="145" font-size="10.5" text-anchor="middle" fill="currentColor" opacity="0.7">L₅</text>
  <circle cx="450" cy="110" r="14" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="450" y="145" font-size="10.5" text-anchor="middle" fill="currentColor" opacity="0.7">L₆</text>
  <rect x="546" y="96" width="28" height="28" rx="5" fill="#5aa46a" fill-opacity="0.3" stroke="#5aa46a" stroke-width="1.6"/>
  <text x="560" y="145" font-size="10.5" text-anchor="middle" fill="#5aa46a">booked</text>

  <text x="320" y="172" font-size="10.5" text-anchor="middle" fill="#5aa46a">as the window slides, the booked listing stays in context — every clicked listing is pulled toward it</text>

  <!-- negatives box (unchanged) -->
  <rect x="45" y="190" width="550" height="92" rx="6" fill="none" stroke="currentColor" stroke-width="1" opacity="0.8"/>
  <text x="60" y="212" font-size="11" fill="currentColor">negatives for a Paris central listing: sampled from the whole catalog</text>
  <circle cx="130" cy="244" r="5" fill="#4c8dd6"/>
  <text x="130" y="264" font-size="10" text-anchor="middle" fill="#4c8dd6">Rome</text>
  <circle cx="240" cy="250" r="5" fill="#4c8dd6"/>
  <text x="240" y="270" font-size="10" text-anchor="middle" fill="#4c8dd6">Tokyo</text>
  <circle cx="340" cy="240" r="5" fill="#4c8dd6"/>
  <text x="340" y="260" font-size="10" text-anchor="middle" fill="#4c8dd6">Ohio</text>
  <text x="472" y="250" font-size="10.5" text-anchor="middle" fill="currentColor" opacity="0.6">cross-market pairs are easy —</text>
  <text x="472" y="266" font-size="10.5" text-anchor="middle" fill="currentColor" opacity="0.6">geography alone separates them</text>

  <text x="320" y="308" font-size="10.5" text-anchor="middle" fill="currentColor" opacity="0.55">the space now encodes what books, not just what gets clicked together</text>
</svg>

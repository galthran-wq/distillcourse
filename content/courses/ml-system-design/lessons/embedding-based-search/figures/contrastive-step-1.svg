<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="320" y="24" font-size="11.5" text-anchor="middle" fill="currentColor" opacity="0.7">a training example: query, one positive, three in-batch negatives</text>

  <!-- left panel: embedding space -->
  <rect x="18" y="36" width="292" height="304" rx="6" fill="none" stroke="currentColor" stroke-width="1" opacity="0.9"/>
  <text x="164" y="56" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.55">embedding space</text>

  <line x1="150" y1="205" x2="218" y2="148" stroke="#5aa46a" stroke-width="1" stroke-dasharray="3 3" opacity="0.8"/>
  <line x1="150" y1="205" x2="100" y2="110" stroke="#4c8dd6" stroke-width="1" stroke-dasharray="3 3" opacity="0.6"/>
  <line x1="150" y1="205" x2="72" y2="262" stroke="#4c8dd6" stroke-width="1" stroke-dasharray="3 3" opacity="0.6"/>
  <line x1="150" y1="205" x2="252" y2="296" stroke="#4c8dd6" stroke-width="1" stroke-dasharray="3 3" opacity="0.6"/>

  <text x="196" y="172" font-size="10" fill="#5aa46a">s = 5.0</text>
  <text x="102" y="158" font-size="10" fill="#4c8dd6">s = 2.0</text>
  <text x="88" y="240" font-size="10" fill="#4c8dd6">s = 1.0</text>
  <text x="212" y="262" font-size="10" fill="#4c8dd6">s = −1.0</text>

  <circle cx="150" cy="205" r="6" fill="#e2903a"/>
  <text x="150" y="228" font-size="11" text-anchor="middle" fill="#e2903a">q — query</text>
  <circle cx="218" cy="148" r="5" fill="#5aa46a"/>
  <text x="232" y="144" font-size="11" fill="#5aa46a">p</text>
  <circle cx="100" cy="110" r="5" fill="#4c8dd6"/>
  <text x="86" y="100" font-size="11" fill="#4c8dd6">n₁</text>
  <circle cx="72" cy="262" r="5" fill="#4c8dd6"/>
  <text x="52" y="270" font-size="11" fill="#4c8dd6">n₂</text>
  <circle cx="252" cy="296" r="5" fill="#4c8dd6"/>
  <text x="266" y="302" font-size="11" fill="#4c8dd6">n₃</text>

  <!-- right panel: similarity column -->
  <rect x="330" y="36" width="292" height="304" rx="6" fill="none" stroke="currentColor" stroke-width="1" opacity="0.9"/>
  <text x="476" y="56" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.55">one dot product per candidate</text>

  <text x="380" y="88" font-size="10.5" fill="currentColor" opacity="0.55">candidate</text>
  <text x="500" y="88" font-size="10.5" fill="currentColor" opacity="0.55">s(q, ·)</text>

  <text x="380" y="122" font-size="12" fill="#5aa46a">p</text>
  <text x="500" y="122" font-size="12" fill="currentColor">5.0</text>
  <text x="380" y="158" font-size="12" fill="#4c8dd6">n₁</text>
  <text x="500" y="158" font-size="12" fill="currentColor">2.0</text>
  <text x="380" y="194" font-size="12" fill="#4c8dd6">n₂</text>
  <text x="500" y="194" font-size="12" fill="currentColor">1.0</text>
  <text x="380" y="230" font-size="12" fill="#4c8dd6">n₃</text>
  <text x="500" y="230" font-size="12" fill="currentColor">−1.0</text>

  <text x="476" y="300" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.7">s(q, x) = ⟨enc(q), enc(x)⟩</text>
</svg>

<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="320" y="24" font-size="11.5" text-anchor="middle" fill="currentColor" opacity="0.7">one gradient step: pull the positive in, push the negatives out</text>

  <!-- left panel: embedding space after the step -->
  <rect x="18" y="36" width="292" height="304" rx="6" fill="none" stroke="currentColor" stroke-width="1" opacity="0.9"/>
  <text x="164" y="56" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.55">embedding space, after the update</text>

  <!-- ghosts at old positions -->
  <circle cx="218" cy="148" r="5" fill="#5aa46a" opacity="0.25"/>
  <circle cx="100" cy="110" r="5" fill="#4c8dd6" opacity="0.25"/>
  <circle cx="72" cy="262" r="5" fill="#4c8dd6" opacity="0.25"/>
  <circle cx="252" cy="296" r="5" fill="#4c8dd6" opacity="0.25"/>

  <!-- movement arrows -->
  <line x1="214" y1="153" x2="199" y2="172" stroke="#5aa46a" stroke-width="1.6"/>
  <path d="M 199 172 l 6 -6 l -8 -1 z" fill="#5aa46a"/>
  <line x1="97" y1="106" x2="86" y2="94" stroke="#4c8dd6" stroke-width="1.4"/>
  <path d="M 86 94 l 8 2 l -4 -8 z" fill="#4c8dd6"/>
  <line x1="68" y1="266" x2="59" y2="276" stroke="#4c8dd6" stroke-width="1.2"/>
  <path d="M 59 276 l 8 -2 l -5 6 z" fill="#4c8dd6"/>
  <line x1="256" y1="300" x2="262" y2="308" stroke="#4c8dd6" stroke-width="1"/>
  <path d="M 262 308 l 1 -7 l -6 4 z" fill="#4c8dd6"/>

  <!-- new positions -->
  <circle cx="150" cy="205" r="6" fill="#e2903a"/>
  <text x="150" y="228" font-size="11" text-anchor="middle" fill="#e2903a">q — query</text>
  <circle cx="196" cy="178" r="5" fill="#5aa46a"/>
  <text x="212" y="180" font-size="11" fill="#5aa46a">p′</text>
  <circle cx="84" cy="92" r="5" fill="#4c8dd6"/>
  <text x="70" y="84" font-size="11" fill="#4c8dd6">n₁′</text>
  <circle cx="56" cy="279" r="5" fill="#4c8dd6"/>
  <text x="38" y="290" font-size="11" fill="#4c8dd6">n₂′</text>
  <circle cx="264" cy="310" r="5" fill="#4c8dd6"/>
  <text x="278" y="316" font-size="11" fill="#4c8dd6">n₃′</text>

  <text x="164" y="330" font-size="9.5" text-anchor="middle" fill="currentColor" opacity="0.55">each push ∝ the probability that negative claimed</text>

  <!-- right panel: table dimmed -->
  <rect x="330" y="36" width="292" height="304" rx="6" fill="none" stroke="currentColor" stroke-width="1" opacity="0.9"/>
  <g opacity="0.35">
    <text x="352" y="88" font-size="10.5" fill="currentColor">cand.</text>
    <text x="412" y="88" font-size="10.5" fill="currentColor">s(q, ·)</text>
    <text x="486" y="88" font-size="10.5" fill="currentColor">softmax</text>
    <text x="352" y="122" font-size="12" fill="#5aa46a">p</text>
    <text x="412" y="122" font-size="12" fill="currentColor">5.0</text>
    <text x="486" y="122" font-size="12" fill="currentColor">0.934</text>
    <text x="352" y="158" font-size="12" fill="#4c8dd6">n₁</text>
    <text x="412" y="158" font-size="12" fill="currentColor">2.0</text>
    <text x="486" y="158" font-size="12" fill="currentColor">0.047</text>
    <text x="352" y="194" font-size="12" fill="#4c8dd6">n₂</text>
    <text x="412" y="194" font-size="12" fill="currentColor">1.0</text>
    <text x="486" y="194" font-size="12" fill="currentColor">0.017</text>
    <text x="352" y="230" font-size="12" fill="#4c8dd6">n₃</text>
    <text x="412" y="230" font-size="12" fill="currentColor">−1.0</text>
    <text x="486" y="230" font-size="12" fill="currentColor">0.002</text>
  </g>
  <text x="476" y="272" font-size="11.5" text-anchor="middle" fill="currentColor">the softmax column is the update budget:</text>
  <text x="476" y="290" font-size="11.5" text-anchor="middle" fill="currentColor">n₁ (0.047) moves most, n₃ (0.002) barely moves</text>
</svg>

<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- ladder header -->
  <rect x="48" y="14" width="84" height="26" rx="4" fill="none" stroke="currentColor" stroke-width="1" opacity="0.4"/>
  <text x="90" y="31" font-size="12" text-anchor="middle" fill="currentColor" opacity="0.4">MRR</text>
  <line x1="60" y1="27" x2="120" y2="27" stroke="currentColor" stroke-width="1" opacity="0.5"/>
  <text x="90" y="54" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">sees only the first hit</text>
  <text x="141" y="31" font-size="12" fill="currentColor" opacity="0.35">→</text>
  <rect x="152" y="14" width="112" height="26" rx="4" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <text x="208" y="31" font-size="12" font-weight="600" text-anchor="middle" fill="#e2903a">precision@k</text>
  <text x="273" y="31" font-size="12" fill="currentColor" opacity="0.35">→</text>
  <rect x="284" y="14" width="96" height="26" rx="4" fill="none" stroke="currentColor" stroke-width="1" opacity="0.35"/>
  <text x="332" y="31" font-size="12" text-anchor="middle" fill="currentColor" opacity="0.35">recall@k</text>
  <text x="389" y="31" font-size="12" fill="currentColor" opacity="0.35">→</text>
  <rect x="400" y="14" width="76" height="26" rx="4" fill="none" stroke="currentColor" stroke-width="1" opacity="0.35"/>
  <text x="438" y="31" font-size="12" text-anchor="middle" fill="currentColor" opacity="0.35">nDCG</text>

  <text x="320" y="72" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.7">precision@5 counts hits in the window — wherever they sit</text>

  <!-- list C -->
  <text x="102" y="123" font-size="11.5" text-anchor="end" fill="currentColor">list C</text>
  <rect x="120" y="100" width="36" height="36" rx="3" fill="#5aa46a" fill-opacity="0.3" stroke="#5aa46a" stroke-width="1.3"/>
  <rect x="164" y="100" width="36" height="36" rx="3" fill="#5aa46a" fill-opacity="0.3" stroke="#5aa46a" stroke-width="1.3"/>
  <rect x="208" y="100" width="36" height="36" rx="3" fill="none" stroke="currentColor" stroke-width="1"/>
  <rect x="252" y="100" width="36" height="36" rx="3" fill="none" stroke="currentColor" stroke-width="1"/>
  <rect x="296" y="100" width="36" height="36" rx="3" fill="none" stroke="currentColor" stroke-width="1"/>
  <text x="352" y="118" font-size="11.5" fill="currentColor">hits at ranks 1 and 2</text>
  <text x="352" y="134" font-size="11.5" font-weight="600" fill="#e2903a">precision@5 = 2/5</text>

  <!-- list D -->
  <text x="102" y="203" font-size="11.5" text-anchor="end" fill="currentColor">list D</text>
  <rect x="120" y="180" width="36" height="36" rx="3" fill="none" stroke="currentColor" stroke-width="1"/>
  <rect x="164" y="180" width="36" height="36" rx="3" fill="none" stroke="currentColor" stroke-width="1"/>
  <rect x="208" y="180" width="36" height="36" rx="3" fill="none" stroke="currentColor" stroke-width="1"/>
  <rect x="252" y="180" width="36" height="36" rx="3" fill="#5aa46a" fill-opacity="0.3" stroke="#5aa46a" stroke-width="1.3"/>
  <rect x="296" y="180" width="36" height="36" rx="3" fill="#5aa46a" fill-opacity="0.3" stroke="#5aa46a" stroke-width="1.3"/>
  <text x="352" y="198" font-size="11.5" fill="currentColor">hits at ranks 4 and 5</text>
  <text x="352" y="214" font-size="11.5" font-weight="600" fill="#e2903a">precision@5 = 2/5</text>

  <!-- rank labels -->
  <text x="138" y="248" font-size="10" text-anchor="middle" fill="currentColor" opacity="0.55">1</text>
  <text x="182" y="248" font-size="10" text-anchor="middle" fill="currentColor" opacity="0.55">2</text>
  <text x="226" y="248" font-size="10" text-anchor="middle" fill="currentColor" opacity="0.55">3</text>
  <text x="270" y="248" font-size="10" text-anchor="middle" fill="currentColor" opacity="0.55">4</text>
  <text x="314" y="248" font-size="10" text-anchor="middle" fill="currentColor" opacity="0.55">5</text>
  <text x="226" y="266" font-size="10" text-anchor="middle" fill="currentColor" opacity="0.55">rank</text>

  <line x1="60" y1="292" x2="580" y2="292" stroke="currentColor" stroke-width="0.8" opacity="0.3"/>
  <text x="320" y="316" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor">the hits fell from the top of the page to the bottom; the number never moved</text>
</svg>

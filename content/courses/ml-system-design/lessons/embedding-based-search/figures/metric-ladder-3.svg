<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- ladder header -->
  <rect x="48" y="14" width="84" height="26" rx="4" fill="none" stroke="currentColor" stroke-width="1" opacity="0.4"/>
  <text x="90" y="31" font-size="12" text-anchor="middle" fill="currentColor" opacity="0.4">MRR</text>
  <line x1="60" y1="27" x2="120" y2="27" stroke="currentColor" stroke-width="1" opacity="0.5"/>
  <text x="90" y="54" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">sees only the first hit</text>
  <text x="141" y="31" font-size="12" fill="currentColor" opacity="0.35">→</text>
  <rect x="152" y="14" width="112" height="26" rx="4" fill="none" stroke="currentColor" stroke-width="1" opacity="0.4"/>
  <text x="208" y="31" font-size="12" text-anchor="middle" fill="currentColor" opacity="0.4">precision@k</text>
  <line x1="164" y1="27" x2="252" y2="27" stroke="currentColor" stroke-width="1" opacity="0.5"/>
  <text x="208" y="54" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">order-blind in the window</text>
  <text x="273" y="31" font-size="12" fill="currentColor" opacity="0.35">→</text>
  <rect x="284" y="14" width="96" height="26" rx="4" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <text x="332" y="31" font-size="12" font-weight="600" text-anchor="middle" fill="#e2903a">recall@k</text>
  <text x="389" y="31" font-size="12" fill="currentColor" opacity="0.35">→</text>
  <rect x="400" y="14" width="76" height="26" rx="4" fill="none" stroke="currentColor" stroke-width="1" opacity="0.35"/>
  <text x="438" y="31" font-size="12" text-anchor="middle" fill="currentColor" opacity="0.35">nDCG</text>

  <text x="320" y="82" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.7">one relevant video per model — where does it land?</text>

  <!-- rank axis -->
  <line x1="80" y1="170" x2="576" y2="170" stroke="currentColor" stroke-width="1"/>
  <path d="M 576 170 l -8 -4 l 0 8 z" fill="currentColor"/>
  <text x="90" y="192" font-size="10" text-anchor="middle" fill="currentColor" opacity="0.55">1</text>
  <line x1="90" y1="166" x2="90" y2="174" stroke="currentColor" stroke-width="1"/>
  <text x="176" y="192" font-size="10" text-anchor="middle" fill="currentColor" opacity="0.55">10</text>
  <line x1="176" y1="166" x2="176" y2="174" stroke="currentColor" stroke-width="1"/>
  <text x="224" y="192" font-size="10" text-anchor="middle" fill="currentColor" opacity="0.55">15</text>
  <line x1="224" y1="166" x2="224" y2="174" stroke="currentColor" stroke-width="1"/>
  <text x="560" y="192" font-size="10" text-anchor="middle" fill="currentColor" opacity="0.55">50</text>
  <line x1="560" y1="166" x2="560" y2="174" stroke="currentColor" stroke-width="1"/>
  <text x="596" y="174" font-size="10" fill="currentColor" opacity="0.55">rank</text>

  <!-- cutoff -->
  <line x1="176" y1="100" x2="176" y2="220" stroke="#e2903a" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="176" y="94" font-size="10.5" text-anchor="middle" fill="#e2903a">cutoff k = 10</text>

  <!-- the relevant items -->
  <circle cx="224" cy="142" r="5" fill="#5aa46a"/>
  <text x="234" y="138" font-size="11" fill="currentColor">model A: rank 15</text>
  <circle cx="560" cy="142" r="5" fill="#4c8dd6"/>
  <text x="550" y="126" font-size="11" text-anchor="end" fill="currentColor">model B: rank 50</text>

  <text x="376" y="222" font-size="11.5" font-weight="600" fill="#e2903a" text-anchor="middle">recall@10 = 0/1 — for both</text>

  <text x="320" y="258" font-size="10.5" text-anchor="middle" fill="currentColor" opacity="0.65">and when "relevant" means millions of items, recall@10 ≤ 10/1,000,000 ≈ 0 even for a perfect ranking</text>

  <line x1="60" y1="292" x2="580" y2="292" stroke="currentColor" stroke-width="0.8" opacity="0.3"/>
  <text x="320" y="316" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor">35 positions of real quality difference, and the metric reports zero for both models</text>
</svg>

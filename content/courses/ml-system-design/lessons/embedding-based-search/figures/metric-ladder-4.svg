<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- ladder header -->
  <rect x="48" y="14" width="84" height="26" rx="4" fill="none" stroke="currentColor" stroke-width="1" opacity="0.4"/>
  <text x="90" y="31" font-size="12" text-anchor="middle" fill="currentColor" opacity="0.4">MRR</text>
  <line x1="60" y1="27" x2="120" y2="27" stroke="currentColor" stroke-width="1" opacity="0.5"/>
  <text x="90" y="54" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">sees only the first hit</text>
  <text x="141" y="31" font-size="12" fill="currentColor" opacity="0.35">→</text>
  <rect x="152" y="14" width="112" height="26" rx="4" fill="none" stroke="currentColor" stroke-width="1" opacity="0.4"/>
  <text x="208" y="31" font-size="12" text-anchor="middle" fill="currentColor" opacity="0.4">precision@k</text>
  <line x1="164" y1="27" x2="252" y2="27" stroke="currentColor" stroke-width="1" opacity="0.5"/>
  <text x="208" y="54" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">order-blind in the window</text>
  <text x="273" y="31" font-size="12" fill="currentColor" opacity="0.35">→</text>
  <rect x="284" y="14" width="96" height="26" rx="4" fill="none" stroke="currentColor" stroke-width="1" opacity="0.4"/>
  <text x="332" y="31" font-size="12" text-anchor="middle" fill="currentColor" opacity="0.4">recall@k</text>
  <line x1="296" y1="27" x2="368" y2="27" stroke="currentColor" stroke-width="1" opacity="0.5"/>
  <text x="332" y="54" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.55">denominator + cutoff</text>
  <text x="389" y="31" font-size="12" fill="currentColor" opacity="0.35">→</text>
  <rect x="400" y="14" width="76" height="26" rx="4" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <text x="438" y="31" font-size="12" font-weight="600" text-anchor="middle" fill="#e2903a">nDCG</text>

  <!-- DCG bars for [0,5,1,4,2] -->
  <text x="208" y="80" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.7">discounted gains, relᵢ / log₂(i+1)</text>
  <line x1="70" y1="256" x2="370" y2="256" stroke="currentColor" stroke-width="1"/>

  <text x="108" y="250" font-size="10" text-anchor="middle" fill="currentColor" opacity="0.55">rel 0</text>
  <rect x="148" y="142.4" width="40" height="113.6" fill="#e2903a" fill-opacity="0.55" stroke="#e2903a"/>
  <text x="168" y="136" font-size="10" text-anchor="middle" fill="currentColor">rel 5</text>
  <rect x="208" y="238" width="40" height="18" fill="#e2903a" fill-opacity="0.55" stroke="#e2903a"/>
  <text x="228" y="232" font-size="10" text-anchor="middle" fill="currentColor">rel 1</text>
  <rect x="268" y="194" width="40" height="62" fill="#e2903a" fill-opacity="0.55" stroke="#e2903a"/>
  <text x="288" y="188" font-size="10" text-anchor="middle" fill="currentColor">rel 4</text>
  <rect x="328" y="228.1" width="40" height="27.9" fill="#e2903a" fill-opacity="0.55" stroke="#e2903a"/>
  <text x="348" y="222" font-size="10" text-anchor="middle" fill="currentColor">rel 2</text>

  <text x="108" y="270" font-size="9.5" text-anchor="middle" fill="currentColor" opacity="0.6">0/1 = 0</text>
  <text x="168" y="284" font-size="9.5" text-anchor="middle" fill="currentColor" opacity="0.6">5/1.585 = 3.15</text>
  <text x="228" y="270" font-size="9.5" text-anchor="middle" fill="currentColor" opacity="0.6">1/2 = 0.50</text>
  <text x="288" y="284" font-size="9.5" text-anchor="middle" fill="currentColor" opacity="0.6">4/2.322 = 1.72</text>
  <text x="348" y="270" font-size="9.5" text-anchor="middle" fill="currentColor" opacity="0.6">2/2.585 = 0.77</text>
  <text x="220" y="302" font-size="11" font-weight="600" text-anchor="middle" fill="#e2903a">DCG = 6.151</text>

  <!-- ideal bars for [5,4,2,1,0] -->
  <text x="502" y="80" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.7">ideal ordering [5,4,2,1,0]</text>
  <line x1="430" y1="256" x2="580" y2="256" stroke="currentColor" stroke-width="1"/>
  <rect x="438" y="76" width="18" height="180" fill="currentColor" opacity="0.18"/>
  <rect x="464" y="165.1" width="18" height="90.9" fill="currentColor" opacity="0.18"/>
  <rect x="490" y="220" width="18" height="36" fill="currentColor" opacity="0.18"/>
  <rect x="516" y="240.5" width="18" height="15.5" fill="currentColor" opacity="0.18"/>
  <text x="546" y="250" font-size="10" text-anchor="middle" fill="currentColor" opacity="0.45">0</text>
  <text x="502" y="302" font-size="11" font-weight="600" text-anchor="middle" fill="currentColor">IDCG = 8.954</text>

  <text x="320" y="328" font-size="12.5" font-weight="600" text-anchor="middle" fill="currentColor">nDCG = 6.151 / 8.954 = 0.687 — order and grade both move the number</text>
</svg>

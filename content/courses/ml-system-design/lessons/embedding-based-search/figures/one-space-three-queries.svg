<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="70" y="26" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.55">query / item</text>
  <text x="240" y="26" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.55">encoder</text>

  <!-- lane 1: image crop -->
  <rect x="14" y="40" width="112" height="38" rx="5" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="70" y="56" font-size="11.5" text-anchor="middle" fill="currentColor">image crop</text>
  <text x="70" y="70" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.55">visual search</text>
  <line x1="128" y1="59" x2="166" y2="59" stroke="currentColor" stroke-width="1"/>
  <path d="M 166 59 l -7 -3.5 l 0 7 z" fill="currentColor"/>
  <rect x="170" y="40" width="140" height="38" rx="5" fill="none" stroke="#e2903a" stroke-width="1.6"/>
  <text x="240" y="63" font-size="11.5" text-anchor="middle" fill="#e2903a">image encoder</text>

  <!-- lane 2: listing -->
  <rect x="14" y="100" width="112" height="38" rx="5" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="70" y="116" font-size="11.5" text-anchor="middle" fill="currentColor">listing</text>
  <text x="70" y="130" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.55">similar listings</text>
  <line x1="128" y1="119" x2="166" y2="119" stroke="currentColor" stroke-width="1"/>
  <path d="M 166 119 l -7 -3.5 l 0 7 z" fill="currentColor"/>
  <rect x="170" y="100" width="140" height="38" rx="5" fill="none" stroke="#e2903a" stroke-width="1.6"/>
  <text x="240" y="123" font-size="11.5" text-anchor="middle" fill="#e2903a">listing encoder</text>

  <!-- bracket over lanes 1-2 -->
  <path d="M 324 40 L 318 40 L 318 138 L 324 138" fill="none" stroke="currentColor" stroke-width="1" opacity="0.55"/>
  <text x="330" y="84" font-size="11" fill="currentColor">one encoder,</text>
  <text x="330" y="98" font-size="11" fill="currentColor">query and item</text>

  <!-- lanes 3-4: cross-modal pair -->
  <rect x="162" y="158" width="156" height="96" rx="6" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="4 3" opacity="0.5"/>

  <rect x="14" y="164" width="112" height="38" rx="5" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="70" y="180" font-size="11.5" text-anchor="middle" fill="currentColor">typed phrase</text>
  <text x="70" y="194" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.55">video search</text>
  <line x1="128" y1="183" x2="166" y2="183" stroke="currentColor" stroke-width="1"/>
  <path d="M 166 183 l -7 -3.5 l 0 7 z" fill="currentColor"/>
  <rect x="170" y="164" width="140" height="38" rx="5" fill="none" stroke="#e2903a" stroke-width="1.6"/>
  <text x="240" y="187" font-size="11.5" text-anchor="middle" fill="#e2903a">text encoder</text>

  <rect x="14" y="210" width="112" height="38" rx="5" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="70" y="226" font-size="11.5" text-anchor="middle" fill="currentColor">video</text>
  <text x="70" y="240" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.55">the item side</text>
  <line x1="128" y1="229" x2="166" y2="229" stroke="currentColor" stroke-width="1"/>
  <path d="M 166 229 l -7 -3.5 l 0 7 z" fill="currentColor"/>
  <rect x="170" y="210" width="140" height="38" rx="5" fill="none" stroke="#e2903a" stroke-width="1.6"/>
  <text x="240" y="233" font-size="11.5" text-anchor="middle" fill="#e2903a">video encoder</text>

  <text x="240" y="272" font-size="11" text-anchor="middle" fill="currentColor">two encoders, trained jointly on (typed query, watched video) pairs:</text>
  <text x="240" y="286" font-size="11" text-anchor="middle" fill="currentColor">one contrastive loss is what puts them in one space</text>

  <!-- bus into the shared space -->
  <line x1="310" y1="59" x2="430" y2="59" stroke="currentColor" stroke-width="1"/>
  <line x1="310" y1="119" x2="430" y2="119" stroke="currentColor" stroke-width="1"/>
  <line x1="320" y1="183" x2="430" y2="183" stroke="currentColor" stroke-width="1"/>
  <line x1="320" y1="229" x2="430" y2="229" stroke="currentColor" stroke-width="1"/>
  <line x1="430" y1="59" x2="430" y2="229" stroke="currentColor" stroke-width="1"/>
  <circle cx="430" cy="59" r="2.5" fill="currentColor"/>
  <circle cx="430" cy="119" r="2.5" fill="currentColor"/>
  <circle cx="430" cy="183" r="2.5" fill="currentColor"/>
  <circle cx="430" cy="229" r="2.5" fill="currentColor"/>
  <line x1="430" y1="130" x2="466" y2="130" stroke="currentColor" stroke-width="1"/>
  <path d="M 466 130 l -7 -3.5 l 0 7 z" fill="currentColor"/>

  <rect x="470" y="70" width="150" height="120" rx="6" fill="none" stroke="#4c8dd6" stroke-width="1.6"/>
  <text x="545" y="94" font-size="11.5" text-anchor="middle" fill="#4c8dd6">one embedding space</text>
  <circle cx="500" cy="120" r="3.5" fill="#4c8dd6" opacity="0.75"/>
  <circle cx="528" cy="134" r="3.5" fill="#4c8dd6" opacity="0.75"/>
  <circle cx="556" cy="116" r="3.5" fill="#4c8dd6" opacity="0.75"/>
  <circle cx="580" cy="138" r="3.5" fill="#4c8dd6" opacity="0.75"/>
  <circle cx="512" cy="156" r="3.5" fill="#4c8dd6" opacity="0.75"/>
  <circle cx="548" cy="162" r="3.5" fill="#4c8dd6" opacity="0.75"/>
  <circle cx="586" cy="158" r="3.5" fill="#4c8dd6" opacity="0.75"/>
  <text x="545" y="182" font-size="11" text-anchor="middle" fill="#4c8dd6">s(q, x) = enc(q) · enc(x)</text>
</svg>

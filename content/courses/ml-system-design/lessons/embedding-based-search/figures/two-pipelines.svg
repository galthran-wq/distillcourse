<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- indexing lane -->
  <text x="30" y="34" font-size="11.5" font-weight="600" fill="currentColor">indexing pipeline</text>
  <text x="160" y="34" font-size="10.5" fill="currentColor" opacity="0.55">batch clock: nightly</text>

  <rect x="30" y="48" width="100" height="40" rx="5" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="80" y="72" font-size="11" text-anchor="middle" fill="currentColor">item corpus</text>
  <line x1="130" y1="68" x2="158" y2="68" stroke="currentColor" stroke-width="1"/>
  <path d="M 158 68 l -7 -3.5 l 0 7 z" fill="currentColor"/>

  <rect x="160" y="48" width="180" height="40" rx="5" fill="none" stroke="#e2903a" stroke-width="1.6"/>
  <text x="250" y="64" font-size="11" text-anchor="middle" fill="#e2903a">embedding generation</text>
  <text x="250" y="80" font-size="10" text-anchor="middle" fill="#e2903a">encoder v7</text>
  <line x1="340" y1="68" x2="368" y2="68" stroke="currentColor" stroke-width="1"/>
  <path d="M 368 68 l -7 -3.5 l 0 7 z" fill="currentColor"/>

  <rect x="370" y="48" width="120" height="40" rx="5" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="430" y="72" font-size="11" text-anchor="middle" fill="currentColor">ANN index build</text>
  <line x1="490" y1="68" x2="518" y2="68" stroke="currentColor" stroke-width="1"/>
  <path d="M 518 68 l -7 -3.5 l 0 7 z" fill="currentColor"/>

  <rect x="520" y="48" width="90" height="40" rx="5" fill="none" stroke="#4c8dd6" stroke-width="1.6"/>
  <text x="565" y="72" font-size="11" text-anchor="middle" fill="#4c8dd6">index (v7)</text>

  <text x="565" y="108" font-size="9.5" text-anchor="middle" fill="currentColor" opacity="0.55">items added after last night's</text>
  <text x="565" y="120" font-size="9.5" text-anchor="middle" fill="currentColor" opacity="0.55">build do not exist here</text>

  <!-- handoff arrow index -> query lane -->
  <path d="M 565 88 L 565 138 L 447 138 L 447 178" fill="none" stroke="#4c8dd6" stroke-width="1.4" stroke-dasharray="5 3"/>
  <path d="M 447 178 l -4 -8 l 8 0 z" fill="#4c8dd6"/>
  <text x="512" y="132" font-size="9.5" text-anchor="middle" fill="#4c8dd6">swapped in whole</text>

  <!-- query lane -->
  <text x="30" y="168" font-size="11.5" font-weight="600" fill="currentColor">query pipeline</text>
  <text x="140" y="168" font-size="10.5" fill="currentColor" opacity="0.55">request clock: milliseconds</text>

  <rect x="22" y="182" width="60" height="40" rx="5" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="52" y="206" font-size="11" text-anchor="middle" fill="currentColor">query</text>
  <line x1="82" y1="202" x2="98" y2="202" stroke="currentColor" stroke-width="1"/>
  <path d="M 98 202 l -7 -3.5 l 0 7 z" fill="currentColor"/>

  <rect x="100" y="182" width="86" height="40" rx="5" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="143" y="206" font-size="11" text-anchor="middle" fill="currentColor">preprocess</text>
  <line x1="186" y1="202" x2="202" y2="202" stroke="currentColor" stroke-width="1"/>
  <path d="M 202 202 l -7 -3.5 l 0 7 z" fill="currentColor"/>

  <rect x="204" y="182" width="164" height="40" rx="5" fill="none" stroke="#e2903a" stroke-width="1.6"/>
  <text x="286" y="198" font-size="11" text-anchor="middle" fill="#e2903a">embedding generation</text>
  <text x="286" y="214" font-size="10" text-anchor="middle" fill="#e2903a">the same encoder v7</text>
  <line x1="368" y1="202" x2="384" y2="202" stroke="currentColor" stroke-width="1"/>
  <path d="M 384 202 l -7 -3.5 l 0 7 z" fill="currentColor"/>

  <rect x="386" y="182" width="86" height="40" rx="5" fill="none" stroke="#4c8dd6" stroke-width="1.6"/>
  <text x="429" y="206" font-size="11" text-anchor="middle" fill="#4c8dd6">ANN top-k</text>
  <line x1="472" y1="202" x2="488" y2="202" stroke="currentColor" stroke-width="1"/>
  <path d="M 488 202 l -7 -3.5 l 0 7 z" fill="currentColor"/>

  <rect x="490" y="182" width="72" height="40" rx="5" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="526" y="206" font-size="11" text-anchor="middle" fill="currentColor">re-rank</text>
  <line x1="562" y1="202" x2="580" y2="202" stroke="currentColor" stroke-width="1"/>
  <path d="M 580 202 l -7 -3.5 l 0 7 z" fill="currentColor"/>
  <text x="600" y="206" font-size="10.5" text-anchor="middle" fill="currentColor" opacity="0.7">page</text>

  <line x1="30" y1="244" x2="610" y2="244" stroke="currentColor" stroke-width="0.8" opacity="0.3"/>
  <text x="320" y="266" font-size="11" text-anchor="middle" fill="currentColor">one encoder, two consumers: a v8 query probing a v7 index compares coordinates from two different spaces —</text>
  <text x="320" y="282" font-size="11" text-anchor="middle" fill="currentColor">a new encoder ships only together with the index rebuilt from it</text>
</svg>

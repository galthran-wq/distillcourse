<svg viewBox="0 0 620 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="24" y="26" font-size="12.5" font-weight="600" fill="currentColor">orders_30min(store 17)</text>

  <!-- shaded eventual-consistency window between the lanes -->
  <polygon points="110,185 160,185 160,175 210,175 210,160 260,160 260,150 310,150 310,140 360,140 360,132 410,132 410,126 460,126 460,200 110,200"
           fill="#e2903a" opacity="0.12"/>
  <text x="170" y="216" font-size="11" fill="#e2903a">eventual-consistency window: same feature, two answers</text>

  <!-- offline lane (blue) -->
  <path d="M60,200 H460 V126 H590" fill="none" stroke="#4c8dd6" stroke-width="2"/>
  <text x="62" y="238" font-size="11" fill="#4c8dd6">offline store — updated at the nightly load</text>

  <!-- online lane (amber staircase) -->
  <path d="M60,200 H110 V185 H160 V175 H210 V160 H260 V150 H310 V140 H360 V132 H410 V126 H460 V120 H510 V112 H590"
        fill="none" stroke="#e2903a" stroke-width="2"/>
  <text x="62" y="92" font-size="11" fill="#e2903a">online store — stream emissions, every 5 min</text>

  <!-- gap reopening annotation -->
  <text x="470" y="98" font-size="10.5" fill="currentColor" opacity="0.55">…and the gap reopens</text>

  <!-- marked instant -->
  <line x1="340" y1="60" x2="340" y2="260" stroke="currentColor" stroke-width="1" stroke-dasharray="3 3" opacity="0.5"/>
  <circle cx="340" cy="140" r="4" fill="#e2903a"/>
  <circle cx="340" cy="200" r="4" fill="#4c8dd6"/>
  <text x="352" y="126" font-size="11" fill="#e2903a">online: 412</text>
  <text x="348" y="196" font-size="11" fill="#4c8dd6">offline: 396</text>
  <text x="330" y="54" font-size="11" fill="currentColor" opacity="0.55">t*</text>

  <!-- time axis -->
  <line x1="50" y1="260" x2="596" y2="260" stroke="currentColor" stroke-width="1.2"/>
  <polygon points="600,260 590,255 590,265" fill="currentColor"/>
  <text x="500" y="280" font-size="11" fill="currentColor" opacity="0.55">wall-clock time</text>
  <line x1="460" y1="254" x2="460" y2="266" stroke="currentColor" stroke-width="1.5"/>
  <text x="428" y="280" font-size="11" fill="currentColor">nightly load</text>
</svg>

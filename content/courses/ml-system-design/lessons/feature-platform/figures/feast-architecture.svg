<svg viewBox="0 0 640 470" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- sources -->
  <rect x="15" y="82" width="152" height="56" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="27" y="104" font-size="12" font-weight="600" fill="currentColor">order events</text>
  <text x="27" y="121" font-size="11" fill="currentColor" opacity="0.55">Kafka topic (the log)</text>

  <rect x="15" y="192" width="152" height="56" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="27" y="214" font-size="12" font-weight="600" fill="currentColor">batch tables</text>
  <text x="27" y="231" font-size="11" fill="currentColor" opacity="0.55">lake / warehouse extract</text>

  <!-- registry -->
  <rect x="15" y="300" width="170" height="72" rx="6" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="27" y="322" font-size="12" font-weight="600" fill="currentColor">registry</text>
  <text x="27" y="339" font-size="11" fill="currentColor">FeatureSet: entities ·</text>
  <text x="27" y="354" font-size="11" fill="currentColor">features · source</text>

  <!-- ingestion -->
  <rect x="222" y="132" width="150" height="66" rx="6" fill="none" stroke="#5aa46a" stroke-width="2"/>
  <text x="234" y="156" font-size="13" font-weight="600" fill="#5aa46a">ingestion job</text>
  <text x="234" y="174" font-size="11" fill="currentColor">one declaration,</text>
  <text x="234" y="189" font-size="11" fill="currentColor">one computation</text>

  <!-- stores -->
  <rect x="420" y="58" width="205" height="80" rx="6" fill="none" stroke="#4c8dd6" stroke-width="2"/>
  <text x="432" y="82" font-size="13" font-weight="600" fill="#4c8dd6">offline store — BigQuery</text>
  <text x="432" y="101" font-size="11" fill="currentColor">columnar warehouse</text>
  <text x="432" y="117" font-size="11" fill="currentColor" opacity="0.55">full feature history</text>

  <rect x="420" y="216" width="205" height="80" rx="6" fill="none" stroke="#e2903a" stroke-width="2"/>
  <text x="432" y="240" font-size="13" font-weight="600" fill="#e2903a">online store — Redis</text>
  <text x="432" y="259" font-size="11" fill="currentColor">hashed entity key · replicas</text>
  <text x="432" y="275" font-size="11" fill="currentColor" opacity="0.55">latest values only</text>

  <!-- readers -->
  <rect x="185" y="392" width="205" height="52" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="197" y="412" font-size="12" font-weight="600" fill="currentColor">training job</text>
  <text x="197" y="430" font-size="11" fill="currentColor" opacity="0.7">get_batch_features · as-of join</text>

  <rect x="420" y="392" width="205" height="52" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="432" y="412" font-size="12" font-weight="600" fill="currentColor">prediction service</text>
  <text x="432" y="430" font-size="11" fill="currentColor" opacity="0.7">get_online_features · point read</text>

  <!-- arrows: sources -> ingestion -->
  <line x1="167" y1="110" x2="216" y2="150" stroke="currentColor" stroke-width="1.5"/>
  <polygon points="218,152 208,150 214,142" fill="currentColor"/>
  <line x1="167" y1="220" x2="216" y2="180" stroke="currentColor" stroke-width="1.5"/>
  <polygon points="218,178 214,188 208,180" fill="currentColor"/>

  <!-- registry -> ingestion -->
  <line x1="185" y1="322" x2="266" y2="202" stroke="currentColor" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.6"/>
  <polygon points="268,199 264,209 258,203" fill="currentColor" opacity="0.6"/>
  <text x="238" y="270" font-size="10.5" fill="currentColor" opacity="0.55">declares</text>

  <!-- fork: ingestion -> both stores -->
  <line x1="372" y1="150" x2="414" y2="105" stroke="#5aa46a" stroke-width="2"/>
  <polygon points="417,102 412,112 405,105" fill="#5aa46a"/>
  <line x1="372" y1="180" x2="414" y2="248" stroke="#5aa46a" stroke-width="2"/>
  <polygon points="417,252 407,249 414,242" fill="#5aa46a"/>
  <text x="330" y="122" font-size="10.5" fill="currentColor" opacity="0.55">two writes:</text>
  <text x="330" y="136" font-size="10.5" fill="currentColor" opacity="0.55">the seam</text>

  <!-- stores -> readers -->
  <line x1="470" y1="138" x2="310" y2="386" stroke="#4c8dd6" stroke-width="1.5"/>
  <polygon points="308,389 310,379 318,384" fill="#4c8dd6"/>
  <line x1="522" y1="296" x2="522" y2="386" stroke="#e2903a" stroke-width="1.5"/>
  <polygon points="522,389 517,379 527,379" fill="#e2903a"/>

  <!-- legend -->
  <rect x="15" y="452" width="10" height="10" fill="#4c8dd6"/>
  <text x="30" y="461" font-size="11" fill="currentColor">storage lesson</text>
  <rect x="145" y="452" width="10" height="10" fill="#e2903a"/>
  <text x="160" y="461" font-size="11" fill="currentColor">replication + partitioning</text>
  <rect x="330" y="452" width="10" height="10" fill="#5aa46a"/>
  <text x="345" y="461" font-size="11" fill="currentColor">batch &amp; stream processing</text>
</svg>

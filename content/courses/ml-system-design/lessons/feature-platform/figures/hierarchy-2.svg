  <text x="252" y="100" font-size="11" fill="currentColor">€18,204 | 1,312 orders</text>

  <!-- level 2 -->
  <text x="240" y="162" font-size="12" font-weight="600" fill="currentColor">level 2 — windows</text>
  <rect x="240" y="170" width="176" height="52" rx="6" fill="none" stroke="#4c8dd6" stroke-width="1.5"/>
  <text x="252" y="200" font-size="11" fill="currentColor">spend_7d · _30d · _90d</text>

  <!-- batch arrows -->
  <line x1="198" y1="90" x2="234" y2="90" stroke="#4c8dd6" stroke-width="2"/>
  <polygon points="236,90 227,85 227,95" fill="#4c8dd6"/>
  <text x="196" y="76" font-size="10.5" fill="#4c8dd6">nightly</text>

  <line x1="328" y1="126" x2="328" y2="164" stroke="#4c8dd6" stroke-width="2"/>
  <polygon points="328,166 323,157 333,157" fill="#4c8dd6"/>
  <text x="336" y="150" font-size="10.5" fill="#4c8dd6">sum daily rows</text>

  <line x1="416" y1="184" x2="450" y2="120" stroke="#4c8dd6" stroke-width="2"/>
  <polygon points="451,117 451,128 442,123" fill="#4c8dd6"/>
  <line x1="416" y1="208" x2="450" y2="266" stroke="#4c8dd6" stroke-width="2"/>
  <polygon points="451,269 442,264 450,258" fill="#4c8dd6"/>
  <text x="404" y="240" font-size="10.5" fill="#4c8dd6">to both</text>

  <!-- stream path still ghosted -->
  <g opacity="0.18">
    <text x="240" y="276" font-size="12" font-weight="600" fill="currentColor">streaming</text>
    <rect x="240" y="284" width="176" height="56" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="252" y="306" font-size="11" fill="currentColor">30-min hopping window</text>

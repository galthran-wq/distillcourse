  <text x="18" y="262" font-size="11" fill="currentColor" opacity="0.55">~10 M lines/day · log + lake</text>

  <!-- level 1 -->
  <text x="240" y="42" font-size="12" font-weight="600" fill="currentColor">level 1 — store-day sums</text>

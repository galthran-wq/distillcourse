  <rect x="18" y="52" width="180" height="190" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="30" y="80" font-size="11" fill="currentColor">(store 17, 14:03, €12.40)</text>
  <text x="30" y="102" font-size="11" fill="currentColor">(store 512, 14:03, €8.15)</text>

<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="20" y="24" font-size="11" fill="currentColor" opacity="0.55">level 1 — daily aggregates</text>
  <text x="250" y="24" font-size="11" fill="currentColor" opacity="0.55">level 2 — windows</text>
  <text x="470" y="24" font-size="11" fill="currentColor" opacity="0.55">consumers</text>

  <!-- changed parent -->
  <rect x="20" y="76" width="150" height="52" rx="6" fill="none" stroke="#e2903a" stroke-width="2"/>
  <text x="32" y="97" font-size="11.5" font-weight="600" fill="#e2903a">store_day_revenue</text>
  <text x="32" y="113" font-size="10.5" fill="#e2903a">definition changed → v2</text>

  <!-- unchanged parent -->
  <rect x="20" y="196" width="150" height="40" rx="6" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.8"/>
  <text x="32" y="220" font-size="11.5" fill="currentColor">store_day_orders</text>

  <!-- affected children -->
  <rect x="250" y="48" width="110" height="30" rx="6" fill="none" stroke="#e2903a" stroke-width="1.6"/>
  <text x="262" y="67" font-size="11.5" fill="currentColor">spend_7d</text>
  <rect x="250" y="94" width="110" height="30" rx="6" fill="none" stroke="#e2903a" stroke-width="1.6"/>
  <text x="262" y="113" font-size="11.5" fill="currentColor">spend_30d</text>
  <rect x="250" y="140" width="110" height="30" rx="6" fill="none" stroke="#e2903a" stroke-width="1.6"/>
  <text x="262" y="159" font-size="11.5" fill="currentColor">spend_90d</text>

  <!-- untouched child -->
  <rect x="250" y="200" width="110" height="30" rx="6" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.8"/>
  <text x="262" y="219" font-size="11.5" fill="currentColor">orders_30d</text>

  <!-- parent -> child edges -->
  <line x1="170" y1="90" x2="240" y2="64" stroke="#e2903a" stroke-width="1.6"/>
  <polygon points="244,63 234,62 238,71" fill="#e2903a"/>
  <line x1="170" y1="102" x2="240" y2="109" stroke="#e2903a" stroke-width="1.6"/>
  <polygon points="244,109 234,105 235,114" fill="#e2903a"/>
  <line x1="170" y1="114" x2="240" y2="153" stroke="#e2903a" stroke-width="1.6"/>
  <polygon points="244,155 234,154 239,146" fill="#e2903a"/>
  <line x1="170" y1="216" x2="240" y2="215" stroke="currentColor" stroke-width="1.2" opacity="0.8"/>
  <polygon points="244,215 235,210 235,220" fill="currentColor" opacity="0.8"/>

  <!-- consuming models -->
  <rect x="470" y="84" width="150" height="46" rx="6" fill="none" stroke="#e2903a" stroke-width="1.6"/>
  <text x="482" y="103" font-size="11.5" font-weight="600" fill="currentColor">forecast model</text>
  <text x="482" y="119" font-size="10.5" fill="#e2903a">retrain on v2 inputs</text>
  <rect x="470" y="156" width="150" height="46" rx="6" fill="none" stroke="#e2903a" stroke-width="1.6"/>
  <text x="482" y="175" font-size="11.5" font-weight="600" fill="currentColor">fraud model</text>
  <text x="482" y="191" font-size="10.5" fill="#e2903a">retrain on v2 inputs</text>

  <!-- child -> model edges -->
  <line x1="360" y1="107" x2="462" y2="103" stroke="#e2903a" stroke-width="1.6"/>
  <polygon points="466,103 456,99 457,108" fill="#e2903a"/>
  <line x1="360" y1="212" x2="462" y2="126" stroke="currentColor" stroke-width="1.2" opacity="0.8"/>
  <polygon points="466,123 456,125 461,133" fill="currentColor" opacity="0.8"/>
  <line x1="360" y1="157" x2="462" y2="176" stroke="#e2903a" stroke-width="1.6"/>
  <polygon points="466,177 456,179 458,170" fill="#e2903a"/>

  <!-- wave annotation -->
  <text x="20" y="272" font-size="11" fill="#e2903a">the wave = everything reachable from the change: 3 windows, 2 models</text>
  <text x="20" y="289" font-size="10.5" fill="currentColor" opacity="0.55">orders_30d and its edge stay untouched — the graph says so before production does</text>
</svg>

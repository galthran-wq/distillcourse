<svg viewBox="0 0 640 290" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- the store's guarantee boundary -->
  <line x1="212" y1="44" x2="212" y2="252" stroke="currentColor" stroke-width="1" stroke-dasharray="3 3" opacity="0.4"/>
  <text x="52" y="34" font-size="10" fill="currentColor" opacity="0.55">the store's guarantee ends here →</text>

  <!-- one stored value -->
  <rect x="20" y="105" width="150" height="64" rx="6" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <text x="34" y="129" font-size="11.5" font-weight="600" fill="currentColor">feature store</text>
  <text x="34" y="150" font-size="12.5" font-weight="600" fill="currentColor">spend_90d = 412</text>

  <!-- fork arrows -->
  <line x1="170" y1="124" x2="234" y2="78" stroke="#4c8dd6" stroke-width="1.6"/>
  <polygon points="238,75 229,74 234,83" fill="#4c8dd6"/>
  <line x1="170" y1="150" x2="234" y2="200" stroke="#e2903a" stroke-width="1.6"/>
  <polygon points="238,203 229,202 234,194" fill="#e2903a"/>

  <!-- identical fetch -->
  <text x="176" y="132" font-size="10.5" fill="#5aa46a">two fetches,</text>
  <text x="176" y="146" font-size="10.5" fill="#5aa46a">byte-identical ✓</text>

  <!-- training lane -->
  <rect x="240" y="44" width="230" height="62" rx="6" fill="none" stroke="#4c8dd6" stroke-width="1.6"/>
  <text x="252" y="64" font-size="11.5" font-weight="600" fill="#4c8dd6">training pipeline</text>
  <text x="252" y="81" font-size="11" fill="currentColor">standardize: (412 − 350) / 80</text>
  <text x="252" y="97" font-size="10" fill="currentColor" opacity="0.55">μ, σ computed from the training frame</text>
  <line x1="470" y1="75" x2="502" y2="75" stroke="#4c8dd6" stroke-width="1.6"/>
  <polygon points="506,75 497,70 497,80" fill="#4c8dd6"/>
  <rect x="510" y="56" width="110" height="38" rx="6" fill="none" stroke="#4c8dd6" stroke-width="1.6"/>
  <text x="522" y="72" font-size="10" fill="currentColor" opacity="0.55">model input</text>
  <text x="522" y="88" font-size="13" font-weight="600" fill="#4c8dd6">0.78</text>

  <!-- serving lane -->
  <rect x="240" y="177" width="230" height="62" rx="6" fill="none" stroke="#e2903a" stroke-width="1.6"/>
  <text x="252" y="197" font-size="11.5" font-weight="600" fill="#e2903a">serving code</text>
  <text x="252" y="214" font-size="11" fill="currentColor">standardize: (412 − 300) / 60</text>
  <text x="252" y="230" font-size="10" fill="currentColor" opacity="0.55">μ, σ constants from a months-old config</text>
  <line x1="470" y1="208" x2="502" y2="208" stroke="#e2903a" stroke-width="1.6"/>
  <polygon points="506,208 497,203 497,213" fill="#e2903a"/>
  <rect x="510" y="189" width="110" height="38" rx="6" fill="none" stroke="#e2903a" stroke-width="1.6"/>
  <text x="522" y="205" font-size="10" fill="currentColor" opacity="0.55">model input</text>
  <text x="522" y="221" font-size="13" font-weight="600" fill="#e2903a">1.87</text>

  <!-- divergence -->
  <text x="506" y="130" font-size="11.5" font-weight="600" fill="currentColor">0.78 ≠ 1.87</text>
  <text x="498" y="146" font-size="10" fill="currentColor" opacity="0.55">skew no offline metric sees</text>
</svg>

<svg viewBox="0 0 620 310" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- request cards (left) -->
  <rect x="18" y="34" width="216" height="78" rx="6" fill="none" stroke="#4c8dd6" stroke-width="1.5"/>
  <text x="30" y="56" font-size="13" font-weight="600" fill="#4c8dd6">training read</text>
  <text x="30" y="76" font-size="11.5" fill="currentColor">2.19 M store-day rows × 60 features</text>
  <text x="30" y="93" font-size="11.5" fill="currentColor" opacity="0.55">bulk scan · minutes acceptable</text>

  <rect x="18" y="196" width="216" height="78" rx="6" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <text x="30" y="218" font-size="13" font-weight="600" fill="#e2903a">serving read</text>
  <text x="30" y="238" font-size="11.5" fill="currentColor">1 store's vector · ~300 B</text>
  <text x="30" y="255" font-size="11.5" fill="currentColor" opacity="0.55">20 ms at p99.8</text>

  <!-- store boxes (right) -->
  <rect x="392" y="34" width="210" height="78" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="404" y="56" font-size="13" font-weight="600" fill="currentColor">offline store</text>
  <text x="404" y="76" font-size="11.5" fill="currentColor">columnar warehouse</text>
  <text x="404" y="93" font-size="11.5" fill="currentColor" opacity="0.55">full history · scan-optimized</text>

  <rect x="392" y="196" width="210" height="78" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="404" y="218" font-size="13" font-weight="600" fill="currentColor">online store</text>
  <text x="404" y="238" font-size="11.5" fill="currentColor">key-value · latest values only</text>
  <text x="404" y="255" font-size="11.5" fill="currentColor" opacity="0.55">point read &lt; 1 ms</text>

  <!-- matched arrows -->
  <line x1="234" y1="73" x2="384" y2="73" stroke="#4c8dd6" stroke-width="2"/>
  <polygon points="384,73 374,68 374,78" fill="#4c8dd6"/>
  <text x="298" y="64" font-size="12" fill="#5aa46a" font-weight="600">&#10003;</text>

  <line x1="234" y1="235" x2="384" y2="235" stroke="#e2903a" stroke-width="2"/>
  <polygon points="384,235 374,230 374,240" fill="#e2903a"/>
  <text x="298" y="226" font-size="12" fill="#5aa46a" font-weight="600">&#10003;</text>

  <!-- mismatched arrows (crossed) -->
  <line x1="234" y1="98" x2="386" y2="210" stroke="currentColor" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.5"/>
  <line x1="303" y1="141" x2="317" y2="155" stroke="currentColor" stroke-width="2"/>
  <line x1="317" y1="141" x2="303" y2="155" stroke="currentColor" stroke-width="2"/>
  <text x="325" y="143" font-size="11" fill="currentColor" opacity="0.55">no history; key-by-key</text>
  <text x="325" y="157" font-size="11" fill="currentColor" opacity="0.55">fetch ≈ half an hour</text>

  <line x1="234" y1="210" x2="386" y2="98" stroke="currentColor" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.5"/>
  <line x1="253" y1="189" x2="267" y2="203" stroke="currentColor" stroke-width="2"/>
  <line x1="267" y1="189" x2="253" y2="203" stroke="currentColor" stroke-width="2"/>
  <text x="150" y="176" font-size="11" fill="currentColor" opacity="0.55">seconds per query;</text>
  <text x="150" y="190" font-size="11" fill="currentColor" opacity="0.55">no key index</text>
</svg>

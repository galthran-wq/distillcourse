<svg viewBox="0 0 620 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="20" y="24" font-size="13" font-weight="bold" fill="currentColor">Act 1 — integer encoding</text>

  <text x="20" y="52" font-size="11" fill="currentColor" opacity="0.55">brands arriving at serving time</text>
  <rect x="20" y="64" width="110" height="26" rx="4" fill="none" stroke="currentColor" opacity="0.8"/>
  <text x="75" y="81" font-size="12" text-anchor="middle" fill="currentColor">Nike</text>
  <rect x="20" y="98" width="110" height="26" rx="4" fill="none" stroke="currentColor" opacity="0.8"/>
  <text x="75" y="115" font-size="12" text-anchor="middle" fill="currentColor">Anker</text>
  <rect x="20" y="132" width="110" height="26" rx="4" fill="none" stroke="#e2903a"/>
  <text x="75" y="149" font-size="12" text-anchor="middle" fill="#e2903a">Lumeo — new</text>
  <text x="20" y="182" font-size="11" fill="currentColor" opacity="0.55">training saw 2,000,000 brands;</text>
  <text x="20" y="196" font-size="11" fill="currentColor" opacity="0.55">~20 new brands join every hour</text>

  <line x1="130" y1="77" x2="208" y2="77" stroke="currentColor" opacity="0.6"/>
  <line x1="130" y1="111" x2="208" y2="111" stroke="currentColor" opacity="0.6"/>
  <line x1="130" y1="145" x2="208" y2="145" stroke="#e2903a"/>

  <rect x="210" y="64" width="175" height="94" rx="6" fill="none" stroke="currentColor"/>
  <text x="297" y="98" font-size="12" font-weight="bold" text-anchor="middle" fill="currentColor">brand → integer id</text>
  <text x="297" y="118" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.55">ids 0 … 1,999,999</text>
  <text x="297" y="134" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.55">from the training vocabulary</text>

  <line x1="385" y1="77" x2="438" y2="77" stroke="currentColor" opacity="0.6"/>
  <line x1="385" y1="111" x2="438" y2="111" stroke="currentColor" opacity="0.6"/>
  <line x1="385" y1="145" x2="438" y2="145" stroke="#e2903a" stroke-dasharray="3 3"/>

  <rect x="440" y="64" width="120" height="26" rx="4" fill="none" stroke="currentColor" opacity="0.8"/>
  <text x="500" y="81" font-size="12" text-anchor="middle" fill="currentColor">id 51,204</text>
  <rect x="440" y="98" width="120" height="26" rx="4" fill="none" stroke="currentColor" opacity="0.8"/>
  <text x="500" y="115" font-size="12" text-anchor="middle" fill="currentColor">id 3</text>
  <text x="440" y="150" font-size="12" font-weight="bold" fill="#e2903a">✕ no id exists</text>
  <text x="440" y="166" font-size="11" fill="#e2903a">serving crashes</text>

  <text x="20" y="262" font-size="12" fill="currentColor">Verdict: the encoder is a partial function —</text>
  <text x="20" y="280" font-size="12" fill="currentColor">one string it has never seen is a production crash.</text>
</svg>

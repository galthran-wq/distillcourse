<svg viewBox="0 0 620 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="20" y="24" font-size="13" font-weight="bold" fill="currentColor">Act 3 — the hashing trick</text>

  <text x="20" y="52" font-size="11" fill="currentColor" opacity="0.55">brands arriving at serving time</text>
  <rect x="20" y="64" width="110" height="26" rx="4" fill="none" stroke="currentColor" opacity="0.8"/>
  <text x="75" y="81" font-size="12" text-anchor="middle" fill="currentColor">Nike</text>
  <rect x="20" y="98" width="110" height="26" rx="4" fill="none" stroke="currentColor" opacity="0.8"/>
  <text x="75" y="115" font-size="12" text-anchor="middle" fill="currentColor">Anker</text>
  <rect x="20" y="132" width="110" height="26" rx="4" fill="none" stroke="#e2903a"/>
  <text x="75" y="149" font-size="12" text-anchor="middle" fill="#e2903a">Lumeo — new</text>
  <text x="20" y="182" font-size="11" fill="currentColor" opacity="0.55">training saw 2,000,000 brands;</text>
  <text x="20" y="196" font-size="11" fill="currentColor" opacity="0.55">~20 new brands join every hour</text>

  <line x1="130" y1="77" x2="208" y2="77" stroke="currentColor" opacity="0.6"/>
  <line x1="130" y1="111" x2="208" y2="111" stroke="currentColor" opacity="0.6"/>
  <line x1="130" y1="145" x2="208" y2="145" stroke="#e2903a"/>

  <rect x="210" y="64" width="175" height="94" rx="6" fill="none" stroke="currentColor"/>
  <text x="297" y="98" font-size="12" font-weight="bold" text-anchor="middle" fill="currentColor">hash(brand) mod 2¹⁸</text>
  <text x="297" y="118" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.55">262,144 buckets, fixed width,</text>
  <text x="297" y="134" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.55">no vocabulary stored</text>

  <line x1="385" y1="77" x2="438" y2="79" stroke="currentColor" opacity="0.6"/>
  <line x1="385" y1="111" x2="438" y2="139" stroke="currentColor" opacity="0.6"/>
  <line x1="385" y1="145" x2="438" y2="83" stroke="#e2903a"/>

  <rect x="440" y="64" width="120" height="22" rx="3" fill="#e2903a" fill-opacity="0.15" stroke="#e2903a"/>
  <text x="500" y="79" font-size="11" text-anchor="middle" fill="currentColor">bucket 87,414</text>
  <rect x="440" y="92" width="120" height="22" rx="3" fill="none" stroke="currentColor" opacity="0.8"/>
  <text x="500" y="107" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.55">bucket 87,415</text>
  <rect x="440" y="120" width="120" height="22" rx="3" fill="none" stroke="currentColor" opacity="0.8"/>
  <text x="500" y="135" font-size="11" text-anchor="middle" fill="currentColor">bucket 131,072</text>
  <rect x="440" y="148" width="120" height="22" rx="3" fill="none" stroke="currentColor" opacity="0.8"/>
  <text x="500" y="163" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.55">bucket 131,073</text>
  <text x="440" y="190" font-size="11" fill="#e2903a">Lumeo shares Nike's bucket:</text>
  <text x="440" y="204" font-size="11" fill="#e2903a">a random, bounded collision</text>

  <text x="20" y="262" font-size="12" fill="currentColor">Verdict: total function, fixed width, no vocabulary artifact.</text>
  <text x="20" y="280" font-size="12" fill="currentColor">The price is collisions — random pairs, measurable cost.</text>
</svg>

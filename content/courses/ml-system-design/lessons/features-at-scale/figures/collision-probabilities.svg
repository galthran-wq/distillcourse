<svg viewBox="0 0 620 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="20" y="22" font-size="13" font-weight="bold" fill="currentColor">Two collision probabilities, 347 keys</text>

  <!-- axes -->
  <line x1="60" y1="270" x2="560" y2="270" stroke="currentColor"/>
  <line x1="60" y1="270" x2="60" y2="40" stroke="currentColor"/>
  <text x="52" y="274" font-size="11" text-anchor="end" fill="currentColor" opacity="0.55">0</text>
  <text x="52" y="164" font-size="11" text-anchor="end" fill="currentColor" opacity="0.55">0.5</text>
  <text x="52" y="54" font-size="11" text-anchor="end" fill="currentColor" opacity="0.55">1.0</text>
  <line x1="60" y1="160" x2="560" y2="160" stroke="currentColor" opacity="0.15"/>
  <line x1="60" y1="50" x2="560" y2="50" stroke="currentColor" opacity="0.15"/>
  <text x="60" y="290" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.55">10³</text>
  <text x="220" y="290" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.55">10⁴</text>
  <text x="380" y="290" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.55">10⁵</text>
  <text x="540" y="290" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.55">10⁶</text>
  <text x="310" y="312" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.55">number of hash buckets B (log scale)</text>

  <!-- guide at B = 100,000 -->
  <line x1="380" y1="50" x2="380" y2="270" stroke="currentColor" opacity="0.3" stroke-dasharray="3 3"/>

  <!-- P(any collision anywhere) -->
  <polyline points="60,50 220,50.5 268,61 296,80 331,116 380,171 428,213 491,245 540,257"
            fill="none" stroke="#e2903a" stroke-width="2"/>
  <circle cx="380" cy="171" r="4" fill="#e2903a"/>
  <text x="392" y="150" font-size="12" fill="#e2903a" font-weight="bold">45%</text>
  <text x="230" y="98" font-size="12" fill="#e2903a">P(a collision exists somewhere)</text>
  <text x="230" y="113" font-size="11" fill="#e2903a" opacity="0.8">≈ 1 − e^(−n(n−1)/2B)</text>

  <!-- P(a given key collides) -->
  <polyline points="60,206 136,246 220,262 296,267.5 380,269 540,270"
            fill="none" stroke="#4c8dd6" stroke-width="2"/>
  <circle cx="380" cy="269" r="4" fill="#4c8dd6"/>
  <text x="392" y="255" font-size="12" fill="#4c8dd6" font-weight="bold">0.35%</text>
  <text x="86" y="188" font-size="12" fill="#4c8dd6">P(a given key shares its bucket)</text>
  <text x="86" y="203" font-size="11" fill="#4c8dd6" opacity="0.8">≈ (n−1)/B</text>

  <text x="392" y="235" font-size="11" fill="currentColor" opacity="0.55">the number that matters</text>
</svg>

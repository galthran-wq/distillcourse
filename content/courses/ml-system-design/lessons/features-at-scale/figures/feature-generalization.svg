<svg viewBox="0 0 620 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- row 1: a feature that generalizes -->
  <text x="20" y="28" font-size="13" font-weight="bold" fill="currentColor">hour_of_day — keep</text>

  <text x="20" y="66" font-size="11" fill="currentColor" opacity="0.55">coverage</text>
  <rect x="90" y="55" width="200" height="12" rx="3" fill="none" stroke="currentColor" opacity="0.5"/>
  <rect x="90" y="55" width="200" height="12" rx="3" fill="#5aa46a" fill-opacity="0.7"/>
  <text x="298" y="66" font-size="11" fill="currentColor">100%</text>

  <line x1="340" y1="110" x2="600" y2="110" stroke="currentColor" opacity="0.5"/>
  <path d="M 350 110 C 400 108, 420 50, 470 50 C 520 50, 540 108, 590 110 Z" fill="#4c8dd6" fill-opacity="0.3"/>
  <path d="M 358 110 C 408 108, 428 54, 478 54 C 528 54, 548 108, 598 110" fill="none" stroke="#e2903a" stroke-width="2"/>
  <text x="380" y="46" font-size="11" fill="#4c8dd6">train</text>
  <text x="540" y="46" font-size="11" fill="#e2903a">serve</text>
  <text x="340" y="128" font-size="11" fill="currentColor" opacity="0.55">value ranges overlap ~100%</text>

  <line x1="20" y1="150" x2="600" y2="150" stroke="currentColor" opacity="0.15"/>

  <!-- row 2: a feature that does not -->
  <text x="20" y="182" font-size="13" font-weight="bold" fill="currentColor">age — audit before trusting</text>

  <text x="20" y="220" font-size="11" fill="currentColor" opacity="0.55">coverage</text>
  <rect x="90" y="209" width="200" height="12" rx="3" fill="none" stroke="currentColor" opacity="0.5"/>
  <rect x="90" y="209" width="130" height="12" rx="3" fill="#5aa46a" fill-opacity="0.7"/>
  <text x="298" y="220" font-size="11" fill="currentColor">65% — and falling this week</text>

  <line x1="340" y1="264" x2="600" y2="264" stroke="currentColor" opacity="0.5"/>
  <path d="M 420 264 C 450 262, 460 214, 495 214 C 530 214, 550 262, 590 264 Z" fill="#4c8dd6" fill-opacity="0.3"/>
  <path d="M 426 264 C 456 262, 466 218, 501 218 C 536 218, 556 262, 596 264" fill="none" stroke="#e2903a" stroke-width="2"/>
  <rect x="356" y="196" width="8" height="68" fill="#e2903a" fill-opacity="0.8"/>
  <text x="342" y="278" font-size="10" fill="currentColor" opacity="0.55">0</text>
  <text x="420" y="278" font-size="10" fill="currentColor" opacity="0.55">18</text>
  <text x="586" y="278" font-size="10" fill="currentColor" opacity="0.55">70</text>
  <text x="340" y="188" font-size="11" fill="#e2903a">serving-only spike at 0, never seen in training</text>

  <text x="20" y="308" font-size="11" fill="currentColor" opacity="0.55">the audit: value present (coverage), and serving inside the range training saw (overlap)</text>
</svg>

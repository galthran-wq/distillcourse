<svg viewBox="0 0 620 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="20" y="22" font-size="13" font-weight="bold" fill="currentColor">Cumulative feature importance, Facebook's CTR model</text>

  <!-- axes -->
  <line x1="70" y1="270" x2="570" y2="270" stroke="currentColor"/>
  <line x1="70" y1="270" x2="70" y2="50" stroke="currentColor"/>
  <text x="62" y="274" font-size="11" text-anchor="end" fill="currentColor" opacity="0.55">0</text>
  <text x="62" y="164" font-size="11" text-anchor="end" fill="currentColor" opacity="0.55">50%</text>
  <text x="62" y="54" font-size="11" text-anchor="end" fill="currentColor" opacity="0.55">100%</text>
  <line x1="70" y1="160" x2="570" y2="160" stroke="currentColor" opacity="0.15"/>
  <line x1="70" y1="50" x2="570" y2="50" stroke="currentColor" opacity="0.15"/>
  <text x="90" y="290" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.55">1</text>
  <text x="230" y="290" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.55">10</text>
  <text x="370" y="290" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.55">100</text>
  <text x="560" y="290" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.55">all</text>
  <text x="220" y="310" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.55">feature rank by importance (log scale)</text>

  <!-- tail region: the last 300 features -->
  <rect x="470" y="50" width="100" height="220" fill="#e2903a" fill-opacity="0.08"/>
  <line x1="470" y1="50" x2="470" y2="270" stroke="#e2903a" opacity="0.4" stroke-dasharray="3 3"/>
  <text x="556" y="180" font-size="12" font-weight="bold" text-anchor="end" fill="#e2903a">last 300 features</text>
  <text x="556" y="196" font-size="11" text-anchor="end" fill="#e2903a">&lt; 1% of total — candidate debt</text>
  <line x1="520" y1="160" x2="520" y2="76" stroke="#e2903a" opacity="0.5"/>
  <path d="M 516 84 L 520 74 L 524 84 Z" fill="#e2903a" opacity="0.7"/>

  <!-- cumulative importance curve -->
  <polyline points="90,241 130,212 170,186 230,160 290,120 370,74 430,58 470,52 560,50"
            fill="none" stroke="#4c8dd6" stroke-width="2"/>

  <!-- the top-10 anchor -->
  <line x1="230" y1="160" x2="230" y2="270" stroke="currentColor" opacity="0.3" stroke-dasharray="3 3"/>
  <line x1="70" y1="160" x2="230" y2="160" stroke="currentColor" opacity="0.3" stroke-dasharray="3 3"/>
  <circle cx="230" cy="160" r="4" fill="#e2903a"/>
  <text x="242" y="150" font-size="12" font-weight="bold" fill="#e2903a">top 10 ≈ half of total importance</text>
</svg>

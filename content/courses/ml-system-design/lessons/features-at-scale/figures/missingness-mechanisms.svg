<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="20" y="24" font-size="13" font-weight="bold" fill="currentColor">Three reasons a value is missing, three failing remedies</text>

  <!-- column 1: MNAR -->
  <text x="24" y="54" font-size="13" font-weight="bold" fill="currentColor">MNAR</text>
  <text x="24" y="70" font-size="11" fill="currentColor" opacity="0.55">absence depends on the value</text>
  <text x="24" y="90" font-size="10" fill="currentColor" opacity="0.55">income</text>
  <rect x="24" y="96" width="88" height="16" rx="3" fill="#4c8dd6" fill-opacity="0.25" stroke="#4c8dd6" stroke-opacity="0.6"/>
  <text x="68" y="108" font-size="10" text-anchor="middle" fill="currentColor">12k</text>
  <rect x="24" y="115" width="88" height="16" rx="3" fill="#4c8dd6" fill-opacity="0.25" stroke="#4c8dd6" stroke-opacity="0.6"/>
  <text x="68" y="127" font-size="10" text-anchor="middle" fill="currentColor">19k</text>
  <rect x="24" y="134" width="88" height="16" rx="3" fill="#4c8dd6" fill-opacity="0.25" stroke="#4c8dd6" stroke-opacity="0.6"/>
  <text x="68" y="146" font-size="10" text-anchor="middle" fill="currentColor">27k</text>
  <rect x="24" y="153" width="88" height="16" rx="3" fill="#4c8dd6" fill-opacity="0.25" stroke="#4c8dd6" stroke-opacity="0.6"/>
  <text x="68" y="165" font-size="10" text-anchor="middle" fill="currentColor">34k</text>
  <rect x="24" y="172" width="88" height="16" rx="3" fill="none" stroke="#e2903a" stroke-dasharray="3 3"/>
  <text x="68" y="184" font-size="10" text-anchor="middle" fill="#e2903a">—</text>
  <rect x="24" y="191" width="88" height="16" rx="3" fill="none" stroke="#e2903a" stroke-dasharray="3 3"/>
  <text x="68" y="203" font-size="10" text-anchor="middle" fill="#e2903a">—</text>
  <rect x="24" y="210" width="88" height="16" rx="3" fill="none" stroke="#e2903a" stroke-dasharray="3 3"/>
  <text x="68" y="222" font-size="10" text-anchor="middle" fill="#e2903a">—</text>
  <text x="120" y="196" font-size="10" fill="#e2903a">highest earners</text>
  <text x="120" y="209" font-size="10" fill="#e2903a">decline to answer</text>
  <text x="24" y="254" font-size="11" fill="#e2903a">✗ drop incomplete rows</text>
  <text x="24" y="270" font-size="11" fill="currentColor" opacity="0.55">the gap itself predicts the label</text>

  <!-- column 2: MAR -->
  <text x="236" y="54" font-size="13" font-weight="bold" fill="currentColor">MAR</text>
  <text x="236" y="70" font-size="11" fill="currentColor" opacity="0.55">absence tracks another column</text>
  <text x="236" y="90" font-size="10" fill="currentColor" opacity="0.55">age</text>
  <rect x="236" y="96" width="88" height="16" rx="3" fill="#4c8dd6" fill-opacity="0.25" stroke="#4c8dd6" stroke-opacity="0.6"/>
  <text x="280" y="108" font-size="10" text-anchor="middle" fill="currentColor">34</text>
  <rect x="236" y="115" width="88" height="16" rx="3" fill="#4c8dd6" fill-opacity="0.25" stroke="#4c8dd6" stroke-opacity="0.6"/>
  <text x="280" y="127" font-size="10" text-anchor="middle" fill="currentColor">51</text>
  <rect x="236" y="134" width="88" height="16" rx="3" fill="#4c8dd6" fill-opacity="0.25" stroke="#4c8dd6" stroke-opacity="0.6"/>
  <text x="280" y="146" font-size="10" text-anchor="middle" fill="currentColor">29</text>
  <rect x="236" y="153" width="88" height="16" rx="3" fill="#4c8dd6" fill-opacity="0.25" stroke="#4c8dd6" stroke-opacity="0.6"/>
  <text x="280" y="165" font-size="10" text-anchor="middle" fill="currentColor">45</text>
  <rect x="236" y="172" width="88" height="16" rx="3" fill="none" stroke="#e2903a" stroke-dasharray="3 3"/>
  <text x="280" y="184" font-size="10" text-anchor="middle" fill="#e2903a">—</text>
  <rect x="236" y="191" width="88" height="16" rx="3" fill="#4c8dd6" fill-opacity="0.25" stroke="#4c8dd6" stroke-opacity="0.6"/>
  <text x="280" y="203" font-size="10" text-anchor="middle" fill="currentColor">38</text>
  <rect x="236" y="210" width="88" height="16" rx="3" fill="none" stroke="#e2903a" stroke-dasharray="3 3"/>
  <text x="280" y="222" font-size="10" text-anchor="middle" fill="#e2903a">—</text>
  <line x1="330" y1="96" x2="330" y2="169" stroke="currentColor" opacity="0.3"/>
  <text x="336" y="136" font-size="10" fill="currentColor" opacity="0.55">group A</text>
  <line x1="330" y1="172" x2="330" y2="226" stroke="#e2903a" opacity="0.6"/>
  <text x="336" y="202" font-size="10" fill="#e2903a">group B</text>
  <text x="236" y="254" font-size="11" fill="#e2903a">✗ drop incomplete rows</text>
  <text x="236" y="270" font-size="11" fill="currentColor" opacity="0.55">the sample loses group B</text>

  <!-- column 3: MCAR -->
  <text x="448" y="54" font-size="13" font-weight="bold" fill="currentColor">MCAR</text>
  <text x="448" y="70" font-size="11" fill="currentColor" opacity="0.55">no pattern at all</text>
  <text x="448" y="90" font-size="10" fill="currentColor" opacity="0.55">any column</text>
  <rect x="448" y="96" width="88" height="16" rx="3" fill="#4c8dd6" fill-opacity="0.25" stroke="#4c8dd6" stroke-opacity="0.6"/>
  <text x="492" y="108" font-size="10" text-anchor="middle" fill="currentColor">7</text>
  <rect x="448" y="115" width="88" height="16" rx="3" fill="none" stroke="#e2903a" stroke-dasharray="3 3"/>
  <text x="492" y="127" font-size="10" text-anchor="middle" fill="#e2903a">—</text>
  <rect x="448" y="134" width="88" height="16" rx="3" fill="#4c8dd6" fill-opacity="0.25" stroke="#4c8dd6" stroke-opacity="0.6"/>
  <text x="492" y="146" font-size="10" text-anchor="middle" fill="currentColor">3</text>
  <rect x="448" y="153" width="88" height="16" rx="3" fill="#4c8dd6" fill-opacity="0.25" stroke="#4c8dd6" stroke-opacity="0.6"/>
  <text x="492" y="165" font-size="10" text-anchor="middle" fill="currentColor">9</text>
  <rect x="448" y="172" width="88" height="16" rx="3" fill="#4c8dd6" fill-opacity="0.25" stroke="#4c8dd6" stroke-opacity="0.6"/>
  <text x="492" y="184" font-size="10" text-anchor="middle" fill="currentColor">2</text>
  <rect x="448" y="191" width="88" height="16" rx="3" fill="none" stroke="#e2903a" stroke-dasharray="3 3"/>
  <text x="492" y="203" font-size="10" text-anchor="middle" fill="#e2903a">—</text>
  <rect x="448" y="210" width="88" height="16" rx="3" fill="#4c8dd6" fill-opacity="0.25" stroke="#4c8dd6" stroke-opacity="0.6"/>
  <text x="492" y="222" font-size="10" text-anchor="middle" fill="currentColor">5</text>
  <text x="448" y="254" font-size="11" fill="#e2903a">✗ assuming this case by default</text>
  <text x="448" y="270" font-size="11" fill="currentColor" opacity="0.55">patternless absence is rare</text>

  <text x="320" y="302" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.55">safe default across all three: impute, plus an explicit is-missing indicator column</text>
</svg>

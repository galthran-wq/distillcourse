<svg viewBox="0 0 620 250" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="20" y="22" font-size="13" font-weight="bold" fill="currentColor">The timestamp feature: training range and serving value</text>

  <!-- row 1: at deployment -->
  <text x="20" y="52" font-size="11" fill="currentColor" opacity="0.55">at deployment</text>
  <line x1="40" y1="108" x2="580" y2="108" stroke="currentColor" opacity="0.5"/>
  <rect x="60" y="92" width="290" height="16" rx="3" fill="#4c8dd6" fill-opacity="0.3" stroke="#4c8dd6" stroke-opacity="0.6"/>
  <text x="63" y="84" font-size="11" fill="#4c8dd6">training data: every timestamp ≤ T₀</text>
  <line x1="350" y1="98" x2="350" y2="118" stroke="currentColor"/>
  <text x="344" y="134" font-size="11" text-anchor="end" fill="currentColor" opacity="0.55">T₀</text>
  <line x1="354" y1="100" x2="497" y2="100" stroke="#e2903a" stroke-dasharray="3 3" opacity="0.6"/>
  <circle cx="505" cy="100" r="5" fill="#e2903a"/>
  <text x="505" y="84" font-size="11" font-weight="bold" text-anchor="middle" fill="#e2903a">serving: now = T</text>
  <text x="440" y="134" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.55">zero overlap, by construction</text>

  <!-- row 2: after retrain -->
  <text x="20" y="172" font-size="11" fill="currentColor" opacity="0.55">after this week's retrain</text>
  <line x1="40" y1="218" x2="580" y2="218" stroke="currentColor" opacity="0.5"/>
  <rect x="60" y="202" width="390" height="16" rx="3" fill="#4c8dd6" fill-opacity="0.3" stroke="#4c8dd6" stroke-opacity="0.6"/>
  <text x="63" y="194" font-size="11" fill="#4c8dd6">retrained export</text>
  <line x1="450" y1="208" x2="450" y2="228" stroke="currentColor"/>
  <text x="444" y="242" font-size="11" text-anchor="end" fill="currentColor" opacity="0.55">T₀′</text>
  <line x1="454" y1="210" x2="497" y2="210" stroke="#e2903a" stroke-dasharray="3 3" opacity="0.6"/>
  <circle cx="505" cy="210" r="5" fill="#e2903a"/>
  <text x="522" y="196" font-size="11" text-anchor="middle" fill="#e2903a">now</text>
  <text x="524" y="242" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.55">smaller, never zero</text>
</svg>

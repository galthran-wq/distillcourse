<svg viewBox="0 0 640 250" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- panel 1: not separable -->
  <text x="105" y="20" font-size="12" font-weight="bold" text-anchor="middle" fill="currentColor">1 · not linearly separable</text>
  <line x1="15" y1="120" x2="195" y2="120" stroke="currentColor" opacity="0.5"/>
  <line x1="105" y1="35" x2="105" y2="205" stroke="currentColor" opacity="0.5"/>
  <text x="196" y="134" font-size="10" fill="currentColor" opacity="0.55">x₁</text>
  <text x="110" y="42" font-size="10" fill="currentColor" opacity="0.55">x₂</text>
  <!-- minus: quadrants I and III (blue), plus: II and IV (amber) -->
  <circle cx="135" cy="80" r="4" fill="#4c8dd6"/><circle cx="165" cy="60" r="4" fill="#4c8dd6"/><circle cx="150" cy="100" r="4" fill="#4c8dd6"/>
  <circle cx="70" cy="160" r="4" fill="#4c8dd6"/><circle cx="45" cy="180" r="4" fill="#4c8dd6"/><circle cx="60" cy="140" r="4" fill="#4c8dd6"/>
  <circle cx="70" cy="85" r="4" fill="none" stroke="#e2903a" stroke-width="2"/><circle cx="45" cy="60" r="4" fill="none" stroke="#e2903a" stroke-width="2"/><circle cx="60" cy="105" r="4" fill="none" stroke="#e2903a" stroke-width="2"/>
  <circle cx="140" cy="155" r="4" fill="none" stroke="#e2903a" stroke-width="2"/><circle cx="165" cy="180" r="4" fill="none" stroke="#e2903a" stroke-width="2"/><circle cx="150" cy="140" r="4" fill="none" stroke="#e2903a" stroke-width="2"/>
  <line x1="30" y1="200" x2="180" y2="45" stroke="currentColor" opacity="0.4" stroke-dasharray="4 3"/>
  <text x="105" y="228" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.55">every line misclassifies two quadrants</text>

  <!-- panel 2: bucketize -->
  <text x="325" y="20" font-size="12" font-weight="bold" text-anchor="middle" fill="currentColor">2 · bucketize each axis</text>
  <line x1="235" y1="120" x2="415" y2="120" stroke="currentColor"/>
  <line x1="325" y1="35" x2="325" y2="205" stroke="currentColor"/>
  <text x="370" y="215" font-size="11" text-anchor="middle" fill="currentColor">A: x₁ ≥ 0</text>
  <text x="280" y="215" font-size="11" text-anchor="middle" fill="currentColor">B: x₁ &lt; 0</text>
  <text x="238" y="80" font-size="11" fill="currentColor">C: x₂ ≥ 0</text>
  <text x="238" y="170" font-size="11" fill="currentColor">D: x₂ &lt; 0</text>
  <circle cx="355" cy="80" r="4" fill="#4c8dd6"/><circle cx="385" cy="60" r="4" fill="#4c8dd6"/><circle cx="370" cy="100" r="4" fill="#4c8dd6"/>
  <circle cx="290" cy="160" r="4" fill="#4c8dd6"/><circle cx="265" cy="180" r="4" fill="#4c8dd6"/><circle cx="280" cy="140" r="4" fill="#4c8dd6"/>
  <circle cx="290" cy="85" r="4" fill="none" stroke="#e2903a" stroke-width="2"/><circle cx="265" cy="60" r="4" fill="none" stroke="#e2903a" stroke-width="2"/><circle cx="280" cy="105" r="4" fill="none" stroke="#e2903a" stroke-width="2"/>
  <circle cx="360" cy="155" r="4" fill="none" stroke="#e2903a" stroke-width="2"/><circle cx="385" cy="180" r="4" fill="none" stroke="#e2903a" stroke-width="2"/><circle cx="370" cy="140" r="4" fill="none" stroke="#e2903a" stroke-width="2"/>
  <text x="325" y="228" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.55">two binary features: A/B and C/D</text>

  <!-- panel 3: crossed quadrants -->
  <text x="545" y="20" font-size="12" font-weight="bold" text-anchor="middle" fill="currentColor">3 · cross the buckets</text>
  <rect x="545" y="35" width="85" height="85" fill="#4c8dd6" fill-opacity="0.18"/>
  <rect x="460" y="35" width="85" height="85" fill="#e2903a" fill-opacity="0.18"/>
  <rect x="460" y="120" width="85" height="85" fill="#4c8dd6" fill-opacity="0.18"/>
  <rect x="545" y="120" width="85" height="85" fill="#e2903a" fill-opacity="0.18"/>
  <line x1="460" y1="120" x2="630" y2="120" stroke="currentColor"/>
  <line x1="545" y1="35" x2="545" y2="205" stroke="currentColor"/>
  <text x="587" y="80" font-size="12" text-anchor="middle" fill="currentColor">AC → −</text>
  <text x="502" y="80" font-size="12" text-anchor="middle" fill="currentColor">BC → +</text>
  <text x="502" y="166" font-size="12" text-anchor="middle" fill="currentColor">BD → −</text>
  <text x="587" y="166" font-size="12" text-anchor="middle" fill="currentColor">AD → +</text>
  <text x="545" y="228" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.55">one weight per cell: separable</text>
</svg>

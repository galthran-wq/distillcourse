<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- column headers -->
  <rect x="100" y="10" width="170" height="40" rx="5" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <text x="185" y="27" text-anchor="middle" font-size="13" fill="#e2903a" font-weight="600">Paid annotators</text>
  <text x="185" y="42" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">hand labels</text>

  <rect x="280" y="10" width="170" height="40" rx="5" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <text x="365" y="27" text-anchor="middle" font-size="13" fill="#e2903a" font-weight="600">The product</text>
  <text x="365" y="42" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">natural labels</text>

  <rect x="460" y="10" width="170" height="40" rx="5" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <text x="545" y="27" text-anchor="middle" font-size="13" fill="#e2903a" font-weight="600">Programs</text>
  <text x="545" y="42" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">weak supervision</text>

  <!-- row labels -->
  <text x="10" y="85" font-size="12" fill="currentColor" font-weight="600">Cost / label</text>
  <text x="10" y="150" font-size="12" fill="currentColor" font-weight="600">Latency</text>
  <text x="10" y="215" font-size="12" fill="currentColor" font-weight="600">Bias risk</text>
  <text x="10" y="285" font-size="12" fill="currentColor" font-weight="600">Scale</text>

  <!-- separators -->
  <line x1="10" y1="105" x2="630" y2="105" stroke="currentColor" stroke-dasharray="3 3" opacity="0.3"/>
  <line x1="10" y1="170" x2="630" y2="170" stroke="currentColor" stroke-dasharray="3 3" opacity="0.3"/>
  <line x1="10" y1="240" x2="630" y2="240" stroke="currentColor" stroke-dasharray="3 3" opacity="0.3"/>

  <!-- cost row -->
  <text x="185" y="78" text-anchor="middle" font-size="11.5" fill="currentColor">high; expert time</text>
  <text x="185" y="93" text-anchor="middle" font-size="11.5" fill="currentColor">for expert tasks</text>
  <text x="365" y="78" text-anchor="middle" font-size="11.5" fill="currentColor">~zero per label</text>
  <text x="365" y="93" text-anchor="middle" font-size="11.5" fill="currentColor">(logging exists anyway)</text>
  <text x="545" y="78" text-anchor="middle" font-size="11.5" fill="currentColor">expert hours once,</text>
  <text x="545" y="93" text-anchor="middle" font-size="11.5" fill="currentColor">then ~free to rerun</text>

  <!-- latency row -->
  <text x="185" y="143" text-anchor="middle" font-size="11.5" fill="currentColor">days to months</text>
  <text x="185" y="158" text-anchor="middle" font-size="11.5" fill="currentColor">per batch</text>
  <text x="365" y="143" text-anchor="middle" font-size="11.5" fill="currentColor">the feedback loop:</text>
  <text x="365" y="158" text-anchor="middle" font-size="11.5" fill="currentColor">minutes to months</text>
  <text x="545" y="143" text-anchor="middle" font-size="11.5" fill="currentColor">minutes to relabel</text>
  <text x="545" y="158" text-anchor="middle" font-size="11.5" fill="currentColor">the whole pool</text>

  <!-- bias row -->
  <text x="185" y="208" text-anchor="middle" font-size="11.5" fill="currentColor">disagreement,</text>
  <text x="185" y="223" text-anchor="middle" font-size="11.5" fill="currentColor">guideline drift</text>
  <text x="365" y="208" text-anchor="middle" font-size="11.5" fill="currentColor">implicit negatives,</text>
  <text x="365" y="223" text-anchor="middle" font-size="11.5" fill="currentColor">windows undercount</text>
  <text x="545" y="208" text-anchor="middle" font-size="11.5" fill="currentColor">noisy heuristics,</text>
  <text x="545" y="223" text-anchor="middle" font-size="11.5" fill="currentColor">coverage gaps</text>

  <!-- scale row -->
  <text x="185" y="278" text-anchor="middle" font-size="11.5" fill="currentColor">linear in people</text>
  <text x="365" y="278" text-anchor="middle" font-size="11.5" fill="currentColor">every prediction served</text>
  <text x="545" y="278" text-anchor="middle" font-size="11.5" fill="currentColor">the entire unlabeled pool</text>

  <text x="320" y="318" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">the design question: which supplier, at what latency, with what bias</text>
</svg>

<svg viewBox="0 0 640 230" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <rect x="80" y="85" width="480" height="60" fill="#e2903a" opacity="0.18"/>
  <line x1="560" y1="85" x2="560" y2="145" stroke="#e2903a" stroke-width="2"/>
  <text x="320" y="78" text-anchor="middle" font-size="12" fill="#e2903a" font-weight="600">window = 24 h</text>

  <text x="40" y="28" font-size="12" fill="currentColor">10,000 impressions served at t = 0; 180 clicks arrive, eventually</text>
  <text x="40" y="44" font-size="11" fill="currentColor" opacity="0.55">each dot ≈ 5 clicks</text>

  <!-- time axis -->
  <line x1="60" y1="145" x2="600" y2="145" stroke="currentColor" stroke-width="1.5"/>
  <polygon points="600,145 591,141 591,149" fill="currentColor"/>
  <g stroke="currentColor">
    <line x1="80"  y1="140" x2="80"  y2="150"/>
    <line x1="200" y1="140" x2="200" y2="150"/>
    <line x1="360" y1="140" x2="360" y2="150"/>
    <line x1="560" y1="140" x2="560" y2="150"/>
  </g>
  <g font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">
    <text x="80"  y="165">impression</text>
    <text x="200" y="165">5 min</text>
    <text x="360" y="165">1 h</text>
    <text x="560" y="165">24 h</text>
  </g>

  <!-- clicks: 120 by 5 min, 150 by 1 h, 168 by 24 h -->
  <g fill="#4c8dd6">
    <circle cx="122.3" cy="100.3" r="3.5"/><circle cx="158.9" cy="97.5" r="3.5"/><circle cx="146.0" cy="107.8" r="3.5"/><circle cx="92.5" cy="112.8" r="3.5"/><circle cx="90.2" cy="110.2" r="3.5"/><circle cx="93.8" cy="98.2" r="3.5"/><circle cx="133.5" cy="123.9" r="3.5"/><circle cx="99.9" cy="102.8" r="3.5"/><circle cx="156.3" cy="128.2" r="3.5"/><circle cx="150.6" cy="108.9" r="3.5"/><circle cx="195.3" cy="96.6" r="3.5"/><circle cx="182.1" cy="105.1" r="3.5"/><circle cx="102.2" cy="99.1" r="3.5"/><circle cx="120.5" cy="123.6" r="3.5"/><circle cx="106.2" cy="115.4" r="3.5"/><circle cx="157.6" cy="108.0" r="3.5"/><circle cx="147.3" cy="97.2" r="3.5"/><circle cx="92.7" cy="102.2" r="3.5"/><circle cx="162.2" cy="110.0" r="3.5"/><circle cx="121.2" cy="115.5" r="3.5"/><circle cx="136.8" cy="105.5" r="3.5"/><circle cx="175.0" cy="119.5" r="3.5"/><circle cx="113.3" cy="115.1" r="3.5"/><circle cx="144.8" cy="125.6" r="3.5"/>
    <circle cx="313.6" cy="108.6" r="3.5"/><circle cx="349.2" cy="103.5" r="3.5"/><circle cx="269.4" cy="122.7" r="3.5"/><circle cx="231.6" cy="114.7" r="3.5"/><circle cx="215.6" cy="120.0" r="3.5"/><circle cx="318.6" cy="117.2" r="3.5"/>
    <circle cx="529.6" cy="112.8" r="3.5"/><circle cx="497.2" cy="119.9" r="3.5"/><circle cx="476.4" cy="116.4" r="3.5"/><circle cx="523.2" cy="128.6" r="3.5"/>
  </g>
  <text x="598" y="96" text-anchor="end" font-size="11" fill="#4c8dd6">12 more after 24 h →</text>

  <text x="60" y="200" font-size="12" fill="currentColor">At 24 hours: 168 clicks, CTR = 1.68%, and the tail still escapes. Every finite window undercounts;</text>
  <text x="60" y="217" font-size="12" fill="currentColor">widening it buys accuracy and pays in label latency. The window is a design decision, not a default.</text>
</svg>

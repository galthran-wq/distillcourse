<svg viewBox="0 0 640 250" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- log-time axis -->
  <line x1="40" y1="120" x2="610" y2="120" stroke="currentColor" stroke-width="1.5"/>
  <polygon points="610,120 601,116 601,124" fill="currentColor"/>

  <!-- ticks -->
  <g stroke="currentColor">
    <line x1="60"  y1="115" x2="60"  y2="125"/>
    <line x1="170" y1="115" x2="170" y2="125"/>
    <line x1="280" y1="115" x2="280" y2="125"/>
    <line x1="390" y1="115" x2="390" y2="125"/>
    <line x1="500" y1="115" x2="500" y2="125"/>
  </g>
  <g font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">
    <text x="60"  y="140">minutes</text>
    <text x="170" y="140">hours</text>
    <text x="280" y="140">days</text>
    <text x="390" y="140">weeks</text>
    <text x="500" y="140">months</text>
    <text x="595" y="140">time until label</text>
  </g>

  <!-- tasks above the axis -->
  <g>
    <circle cx="60" cy="120" r="4" fill="#e2903a"/>
    <line x1="60" y1="116" x2="60" y2="58" stroke="#e2903a" stroke-width="1" opacity="0.5"/>
    <text x="60" y="50" text-anchor="middle" font-size="12" fill="currentColor">ad click</text>
    <text x="60" y="35" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">most within 5 min</text>

    <circle cx="150" cy="120" r="4" fill="#e2903a"/>
    <line x1="150" y1="116" x2="150" y2="88" stroke="#e2903a" stroke-width="1" opacity="0.5"/>
    <text x="150" y="80" text-anchor="middle" font-size="12" fill="currentColor">ETA arrival</text>

    <circle cx="230" cy="120" r="4" fill="#e2903a"/>
    <line x1="230" y1="116" x2="230" y2="58" stroke="#e2903a" stroke-width="1" opacity="0.5"/>
    <text x="230" y="50" text-anchor="middle" font-size="12" fill="currentColor">long-form content</text>
    <text x="230" y="35" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">hours to watch/read</text>

    <circle cx="390" cy="120" r="4" fill="#e2903a"/>
    <line x1="390" y1="116" x2="390" y2="88" stroke="#e2903a" stroke-width="1" opacity="0.5"/>
    <text x="390" y="80" text-anchor="middle" font-size="12" fill="currentColor">clothing try-on, returns</text>

    <circle cx="520" cy="120" r="4" fill="#e2903a"/>
    <line x1="520" y1="116" x2="520" y2="58" stroke="#e2903a" stroke-width="1" opacity="0.5"/>
    <text x="520" y="50" text-anchor="middle" font-size="12" fill="currentColor">fraud dispute</text>
    <text x="520" y="35" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">1–3 month window</text>
  </g>

  <!-- consequence bracket below -->
  <path d="M 60 165 L 60 175 L 520 175 L 520 165" stroke="#4c8dd6" fill="none" stroke-width="1.5"/>
  <text x="290" y="196" text-anchor="middle" font-size="12" fill="#4c8dd6">the loop length bounds how fast failure is detected</text>
  <text x="290" y="213" text-anchor="middle" font-size="12" fill="#4c8dd6">and how often retraining can use fresh labels</text>
  <text x="290" y="235" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">minutes → hourly retraining possible;  months → quarterly reporting only</text>
</svg>

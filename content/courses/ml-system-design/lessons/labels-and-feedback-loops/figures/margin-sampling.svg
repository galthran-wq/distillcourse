<svg viewBox="0 0 640 292" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- uncertain band around the boundary -->
  <polygon points="68.5,214.5 468.5,34.5 491.5,85.5 91.5,265.5" fill="#e2903a" opacity="0.12"/>

  <!-- decision boundary -->
  <line x1="80" y1="240" x2="480" y2="60" stroke="currentColor" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="500" y="58" font-size="11.5" fill="currentColor">current decision</text>
  <text x="500" y="72" font-size="11.5" fill="currentColor">boundary</text>
  <text x="520" y="120" font-size="11.5" fill="#e2903a">the band where the</text>
  <text x="520" y="134" font-size="11.5" fill="#e2903a">model is least sure</text>

  <!-- labeled class A (blue, filled) -->
  <g fill="#4c8dd6">
    <circle cx="100" cy="80" r="4"/><circle cx="140" cy="60" r="4"/><circle cx="120" cy="120" r="4"/>
    <circle cx="170" cy="95" r="4"/><circle cx="90" cy="150" r="4"/><circle cx="150" cy="140" r="4"/>
    <circle cx="200" cy="70" r="4"/><circle cx="220" cy="110" r="4"/><circle cx="250" cy="60" r="4"/>
  </g>
  <text x="95" y="55" font-size="11.5" fill="#4c8dd6">class A (labeled)</text>

  <!-- labeled class B (open circles) -->
  <g fill="none" stroke="currentColor" stroke-width="1.5">
    <circle cx="300" cy="245" r="4"/><circle cx="340" cy="215" r="4"/><circle cx="380" cy="250" r="4"/>
    <circle cx="420" cy="195" r="4"/><circle cx="440" cy="235" r="4"/><circle cx="470" cy="160" r="4"/>
    <circle cx="500" cy="205" r="4"/><circle cx="520" cy="255" r="4"/><circle cx="545" cy="180" r="4"/>
  </g>
  <text x="455" y="280" font-size="11.5" fill="currentColor">class B (labeled)</text>

  <!-- unlabeled pool (muted dots) -->
  <g fill="currentColor" opacity="0.35">
    <circle cx="150" cy="215" r="3"/><circle cx="205" cy="35" r="3"/><circle cx="420" cy="45" r="3"/>
    <circle cx="205" cy="250" r="3"/><circle cx="330" cy="35" r="3"/><circle cx="560" cy="230" r="3"/>
  </g>

  <!-- unlabeled points inside the band, ringed = chosen to label next -->
  <g fill="currentColor" opacity="0.55">
    <circle cx="260" cy="155" r="3.5"/><circle cx="300" cy="135" r="3.5"/>
    <circle cx="340" cy="120" r="3.5"/><circle cx="380" cy="100" r="3.5"/>
  </g>
  <g fill="none" stroke="#e2903a" stroke-width="2">
    <circle cx="260" cy="155" r="8"/><circle cx="300" cy="135" r="8"/>
    <circle cx="340" cy="120" r="8"/><circle cx="380" cy="100" r="8"/>
  </g>
  <text x="255" y="185" font-size="11.5" fill="#e2903a">margin sampling labels these next</text>
</svg>

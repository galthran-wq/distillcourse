<svg viewBox="0 0 640 240" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="40" y="28" font-size="12" fill="currentColor">incoming stream, total length unknown</text>

  <!-- stream boxes -->
  <g>
    <rect x="40" y="45" width="44" height="34" rx="4" fill="none" stroke="currentColor"/>
    <text x="62" y="67" text-anchor="middle" font-size="13" fill="currentColor">1</text>
    <rect x="94" y="45" width="44" height="34" rx="4" fill="none" stroke="currentColor"/>
    <text x="116" y="67" text-anchor="middle" font-size="13" fill="currentColor">2</text>
    <rect x="148" y="45" width="44" height="34" rx="4" fill="none" stroke="currentColor"/>
    <text x="170" y="67" text-anchor="middle" font-size="13" fill="currentColor">3</text>
    <rect x="202" y="45" width="44" height="34" rx="4" fill="none" stroke="currentColor" opacity="0.3" stroke-dasharray="3 3"/>
    <text x="224" y="67" text-anchor="middle" font-size="13" fill="currentColor" opacity="0.3">4</text>
    <rect x="256" y="45" width="44" height="34" rx="4" fill="none" stroke="currentColor" opacity="0.3" stroke-dasharray="3 3"/>
    <text x="278" y="67" text-anchor="middle" font-size="13" fill="currentColor" opacity="0.3">5</text>
    <text x="330" y="67" font-size="13" fill="currentColor" opacity="0.3">…</text>
  </g>

  <!-- arrows down into reservoir -->
  <g stroke="#e2903a" opacity="0.7">
    <line x1="62" y1="79" x2="122" y2="140"/>
    <line x1="116" y1="79" x2="176" y2="140"/>
    <line x1="170" y1="79" x2="230" y2="140"/>
  </g>

  <!-- reservoir slots -->
  <text x="40" y="135" font-size="12" fill="currentColor">reservoir, k = 3</text>
  <rect x="100" y="145" width="44" height="34" rx="4" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <text x="122" y="167" text-anchor="middle" font-size="13" fill="#e2903a">1</text>
  <rect x="154" y="145" width="44" height="34" rx="4" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <text x="176" y="167" text-anchor="middle" font-size="13" fill="#e2903a">2</text>
  <rect x="208" y="145" width="44" height="34" rx="4" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <text x="230" y="167" text-anchor="middle" font-size="13" fill="#e2903a">3</text>

  <text x="40" y="215" font-size="12" fill="currentColor">Step 1: the first k = 3 items fill the reservoir. After n = 3 items, each is in it with probability 3/3 = 1.</text>
</svg>

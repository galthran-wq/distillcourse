<svg viewBox="0 0 640 240" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="40" y="28" font-size="12" fill="currentColor">incoming stream, total length unknown</text>

  <!-- stream boxes -->
  <g>
    <rect x="40" y="45" width="44" height="34" rx="4" fill="none" stroke="currentColor" opacity="0.4"/>
    <text x="62" y="67" text-anchor="middle" font-size="13" fill="currentColor" opacity="0.4">1</text>
    <rect x="94" y="45" width="44" height="34" rx="4" fill="none" stroke="currentColor" opacity="0.4"/>
    <text x="116" y="67" text-anchor="middle" font-size="13" fill="currentColor" opacity="0.4">2</text>
    <rect x="148" y="45" width="44" height="34" rx="4" fill="none" stroke="currentColor" opacity="0.4"/>
    <text x="170" y="67" text-anchor="middle" font-size="13" fill="currentColor" opacity="0.4">3</text>
    <rect x="202" y="45" width="44" height="34" rx="4" fill="none" stroke="currentColor" opacity="0.4"/>
    <text x="224" y="67" text-anchor="middle" font-size="13" fill="currentColor" opacity="0.4">4</text>
    <rect x="256" y="45" width="44" height="34" rx="4" fill="none" stroke="#e2903a" stroke-width="2"/>
    <text x="278" y="67" text-anchor="middle" font-size="13" fill="#e2903a">5</text>
    <text x="330" y="67" font-size="13" fill="currentColor" opacity="0.3">…</text>
  </g>

  <!-- the draw -->
  <rect x="360" y="42" width="240" height="40" rx="5" fill="none" stroke="#4c8dd6" stroke-width="1.5"/>
  <text x="480" y="59" text-anchor="middle" font-size="12" fill="#4c8dd6">item n = 5: draw i uniform from 1…5</text>
  <text x="480" y="75" text-anchor="middle" font-size="12" fill="#4c8dd6">i = 5 &gt; k → discard item 5</text>

  <!-- discard arrow -->
  <line x1="278" y1="79" x2="278" y2="108" stroke="#e2903a" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="270" y1="100" x2="286" y2="116" stroke="#e2903a" stroke-width="2"/>
  <line x1="286" y1="100" x2="270" y2="116" stroke="#e2903a" stroke-width="2"/>

  <!-- reservoir slots -->
  <text x="40" y="135" font-size="12" fill="currentColor">reservoir, k = 3</text>
  <rect x="100" y="145" width="44" height="34" rx="4" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <text x="122" y="167" text-anchor="middle" font-size="13" fill="#e2903a">1</text>
  <rect x="154" y="145" width="44" height="34" rx="4" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <text x="176" y="167" text-anchor="middle" font-size="13" fill="#e2903a">4</text>
  <rect x="208" y="145" width="44" height="34" rx="4" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <text x="230" y="167" text-anchor="middle" font-size="13" fill="#e2903a">3</text>

  <text x="40" y="215" font-size="12" fill="currentColor">Stop at any time: after n = 5 items, every item seen so far sits in the reservoir with probability 3/5.</text>
</svg>

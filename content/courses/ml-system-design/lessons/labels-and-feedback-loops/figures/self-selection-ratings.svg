<svg viewBox="0 0 480 260" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- axes -->
  <line x1="60" y1="200" x2="440" y2="200" stroke="currentColor" stroke-width="1.5"/>
  <line x1="60" y1="200" x2="60" y2="40" stroke="currentColor" stroke-width="1.5"/>
  <text x="30" y="120" font-size="11" fill="currentColor" opacity="0.55" transform="rotate(-90 30 120)">share of ratings</text>

  <!-- bars: U-shape -->
  <rect x="80"  y="95"  width="50" height="105" rx="3" fill="#e2903a"/>
  <rect x="150" y="172" width="50" height="28"  rx="3" fill="currentColor" opacity="0.35"/>
  <rect x="220" y="182" width="50" height="18"  rx="3" fill="currentColor" opacity="0.35"/>
  <rect x="290" y="158" width="50" height="42"  rx="3" fill="currentColor" opacity="0.35"/>
  <rect x="360" y="55"  width="50" height="145" rx="3" fill="#e2903a"/>

  <g font-size="12" fill="currentColor" text-anchor="middle">
    <text x="105" y="218">1★</text>
    <text x="175" y="218">2★</text>
    <text x="245" y="218">3★</text>
    <text x="315" y="218">4★</text>
    <text x="385" y="218">5★</text>
  </g>

  <text x="105" y="86" text-anchor="middle" font-size="11" fill="#e2903a">the furious</text>
  <text x="385" y="46" text-anchor="middle" font-size="11" fill="#e2903a">the thrilled</text>
  <text x="245" y="150" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">the satisfied</text>
  <text x="245" y="164" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">middle stays silent</text>

  <text x="240" y="248" text-anchor="middle" font-size="11.5" fill="currentColor" opacity="0.75">who rates is not random: the sample is selected by the strength of the experience</text>
</svg>

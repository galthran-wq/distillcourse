<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- unlabeled data -->
  <rect x="14" y="105" width="98" height="80" rx="5" fill="none" stroke="currentColor"/>
  <text x="63" y="130" text-anchor="middle" font-size="12" fill="currentColor">unlabeled</text>
  <text x="63" y="146" text-anchor="middle" font-size="12" fill="currentColor">examples</text>
  <text x="63" y="166" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">1K … 1M</text>

  <!-- labeling functions -->
  <rect x="150" y="30" width="150" height="46" rx="5" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <text x="225" y="49" text-anchor="middle" font-size="11" font-family="ui-monospace, monospace" fill="#e2903a">lf_contains_my</text>
  <text x="225" y="66" text-anchor="middle" font-size="11" fill="currentColor">SPAM or ABSTAIN</text>

  <rect x="150" y="90" width="150" height="46" rx="5" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <text x="225" y="109" text-anchor="middle" font-size="11" font-family="ui-monospace, monospace" fill="#e2903a">lf_short_comment</text>
  <text x="225" y="126" text-anchor="middle" font-size="11" fill="currentColor">NOT_SPAM or ABSTAIN</text>

  <rect x="150" y="150" width="150" height="46" rx="5" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <text x="225" y="169" text-anchor="middle" font-size="11" font-family="ui-monospace, monospace" fill="#e2903a">lf_blocklist_url</text>
  <text x="225" y="186" text-anchor="middle" font-size="11" fill="currentColor">SPAM or ABSTAIN</text>

  <text x="225" y="218" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">n labeling functions:</text>
  <text x="225" y="233" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">noisy, overlapping, conflicting</text>

  <!-- fan from data to LFs -->
  <g stroke="currentColor" opacity="0.5">
    <line x1="112" y1="130" x2="150" y2="53"/>
    <line x1="112" y1="145" x2="150" y2="113"/>
    <line x1="112" y1="160" x2="150" y2="173"/>
  </g>

  <!-- label model -->
  <rect x="340" y="85" width="140" height="76" rx="5" fill="none" stroke="#4c8dd6" stroke-width="1.5"/>
  <text x="410" y="108" text-anchor="middle" font-size="12" fill="#4c8dd6" font-weight="600">label model</text>
  <text x="410" y="125" text-anchor="middle" font-size="11" fill="currentColor">learns each LF's accuracy</text>
  <text x="410" y="140" text-anchor="middle" font-size="11" fill="currentColor">from agreements/conflicts,</text>
  <text x="410" y="155" text-anchor="middle" font-size="11" fill="currentColor">reweights and denoises</text>

  <g stroke="currentColor" opacity="0.5">
    <line x1="300" y1="53" x2="340" y2="100"/>
    <line x1="300" y1="113" x2="340" y2="118"/>
    <line x1="300" y1="173" x2="340" y2="140"/>
  </g>

  <!-- probabilistic labels -->
  <rect x="510" y="92" width="120" height="62" rx="5" fill="none" stroke="currentColor"/>
  <text x="570" y="113" text-anchor="middle" font-size="12" fill="currentColor">probabilistic</text>
  <text x="570" y="128" text-anchor="middle" font-size="12" fill="currentColor">labels</text>
  <text x="570" y="145" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">P(spam) = 0.87, …</text>
  <line x1="480" y1="123" x2="504" y2="123" stroke="currentColor"/>
  <polygon points="510,123 502,119 502,127" fill="currentColor"/>

  <!-- down to training -->
  <line x1="570" y1="154" x2="570" y2="185" stroke="currentColor"/>
  <polygon points="570,191 566,183 574,183" fill="currentColor"/>
  <rect x="475" y="191" width="155" height="42" rx="5" fill="none" stroke="#5aa46a" stroke-width="1.5"/>
  <text x="552" y="209" text-anchor="middle" font-size="12" fill="#5aa46a">train the final model</text>
  <text x="552" y="225" text-anchor="middle" font-size="11" fill="currentColor">covers what no LF fires on</text>

  <!-- gold set note -->
  <rect x="340" y="196" width="118" height="42" rx="5" fill="none" stroke="currentColor" stroke-dasharray="3 3" opacity="0.6"/>
  <text x="399" y="213" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.7">small hand-labeled</text>
  <text x="399" y="228" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.7">set validates the LFs</text>
  <line x1="410" y1="196" x2="410" y2="163" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5"/>

  <text x="320" y="278" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">no example is hand-labeled on this path; the expertise lives in the functions, versioned and rerunnable</text>
</svg>

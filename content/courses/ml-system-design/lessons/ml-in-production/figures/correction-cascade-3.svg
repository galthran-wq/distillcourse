<svg viewBox="0 0 480 310" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .box   { stroke: currentColor; stroke-opacity: 0.7; fill: none; }
    .name  { fill: currentColor; font-size: 13px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .flow  { stroke: currentColor; stroke-opacity: 0.7; stroke-width: 1.6; fill: none; }
  </style>
  <rect class="box" x="60" y="240" width="110" height="44" rx="5"/>
  <text class="name" x="115" y="267" text-anchor="middle">mₐ</text>
  <text class="muted" x="190" y="260">model for task A,</text>
  <text class="muted" x="190" y="276">trained on A's data</text>

  <line class="flow" x1="115" y1="240" x2="115" y2="200"/>
  <path d="M 110 206 L 115 196 L 120 206" class="flow"/>
  <rect class="box" x="60" y="150" width="110" height="44" rx="5"/>
  <text class="name" x="115" y="177" text-anchor="middle">m′ₐ</text>
  <text class="muted" x="190" y="170">learns a small correction of mₐ's</text>
  <text class="muted" x="190" y="186">output for the nearby task A′</text>

  <line class="flow" x1="115" y1="150" x2="115" y2="110"/>
  <path d="M 110 116 L 115 106 L 120 116" class="flow"/>
  <rect class="box" x="60" y="60" width="110" height="44" rx="5"/>
  <text class="name" x="115" y="87" text-anchor="middle">m″ₐ</text>
  <text class="muted" x="190" y="80">corrects the correction</text>
  <text class="muted" x="190" y="96">for task A″</text>
</svg>

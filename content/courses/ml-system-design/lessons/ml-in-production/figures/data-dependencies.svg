<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12.5">
  <style>
    .panel { stroke: currentColor; stroke-opacity: 0.35; fill: none; }
    .box   { stroke: currentColor; stroke-opacity: 0.7; fill: none; }
    .name  { fill: currentColor; font-size: 12.5px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .flow  { stroke: currentColor; stroke-opacity: 0.7; stroke-width: 1.6; fill: none; }
  </style>

  <!-- left panel: unstable -->
  <rect class="panel" x="10" y="28" width="295" height="242" rx="5"/>
  <text class="name" x="157" y="18" text-anchor="middle" font-weight="bold">unstable: it changes under you</text>

  <rect x="92" y="48" width="130" height="44" rx="5" fill="#e2903a" fill-opacity="0.12" stroke="#e2903a" stroke-width="1.6"/>
  <text x="157" y="67" text-anchor="middle" fill="#e2903a">upstream signal</text>
  <text x="157" y="82" text-anchor="middle" fill="#e2903a">(another team's)</text>
  <text x="238" y="62" fill="#e2903a" font-size="11px">a silent</text>
  <text x="238" y="76" fill="#e2903a" font-size="11px">fix ships</text>

  <line class="flow" x1="157" y1="92" x2="157" y2="150"/>
  <path d="M 152 143 L 157 153 L 162 143" class="flow"/>

  <rect class="box" x="92" y="153" width="130" height="44" rx="5"/>
  <text class="name" x="157" y="180" text-anchor="middle">your model</text>

  <text class="muted" x="157" y="222" text-anchor="middle">fit to the old, miscalibrated version:</text>
  <text class="muted" x="157" y="237" text-anchor="middle">the upstream improvement breaks it</text>

  <!-- right panel: underutilized -->
  <rect class="panel" x="335" y="28" width="295" height="242" rx="5"/>
  <text class="name" x="482" y="18" text-anchor="middle" font-weight="bold">underutilized: it outlives its use</text>

  <rect x="352" y="48" width="120" height="44" rx="5" fill="#e2903a" fill-opacity="0.12" stroke="#e2903a" stroke-width="1.6"/>
  <text x="412" y="67" text-anchor="middle" fill="#e2903a">old product</text>
  <text x="412" y="82" text-anchor="middle" fill="#e2903a">numbers</text>

  <rect class="box" x="492" y="48" width="120" height="44" rx="5"/>
  <text class="name" x="552" y="67" text-anchor="middle">new product</text>
  <text class="name" x="552" y="82" text-anchor="middle">numbers</text>

  <line class="flow" x1="422" y1="92" x2="462" y2="150"/>
  <path d="M 454 145 L 464 153 L 462 139" class="flow"/>
  <line class="flow" x1="542" y1="92" x2="502" y2="150"/>
  <path d="M 502 139 L 500 153 L 510 145" class="flow"/>

  <rect class="box" x="422" y="153" width="120" height="44" rx="5"/>
  <text class="name" x="482" y="180" text-anchor="middle">your model</text>

  <text x="412" y="112" fill="#e2903a" font-size="11px" text-anchor="middle">feeding pipeline</text>
  <text x="412" y="126" fill="#e2903a" font-size="11px" text-anchor="middle">deleted a year later</text>

  <text class="muted" x="482" y="222" text-anchor="middle">the model still reads the old numbers</text>
  <text class="muted" x="482" y="237" text-anchor="middle">and fails when they stop arriving</text>
</svg>

<svg viewBox="0 0 640 250" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12.5">
  <style>
    .name  { fill: currentColor; font-size: 12.5px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .flow  { stroke: currentColor; stroke-opacity: 0.7; stroke-width: 1.6; fill: none; }
  </style>

  <!-- config push -->
  <rect x="240" y="20" width="160" height="40" rx="5" fill="none" stroke="currentColor" stroke-opacity="0.7"/>
  <text class="name" x="320" y="39" text-anchor="middle">config push:</text>
  <text class="name" x="320" y="54" text-anchor="middle">a reused flag</text>

  <line x1="360" y1="60" x2="512" y2="118" stroke="#e2903a" stroke-width="1.8"/>
  <path d="M 502 116 L 515 119 L 507 105" fill="#e2903a"/>
  <text x="465" y="82" fill="#e2903a" font-size="11px">reactivates the</text>
  <text x="465" y="96" fill="#e2903a" font-size="11px">dead branch</text>

  <!-- eight servers -->
  <g>
    <rect x="60"  y="120" width="48" height="48" rx="4" fill="#4c8dd6" fill-opacity="0.18" stroke="#4c8dd6" stroke-width="1.4"/>
    <rect x="118" y="120" width="48" height="48" rx="4" fill="#4c8dd6" fill-opacity="0.18" stroke="#4c8dd6" stroke-width="1.4"/>
    <rect x="176" y="120" width="48" height="48" rx="4" fill="#4c8dd6" fill-opacity="0.18" stroke="#4c8dd6" stroke-width="1.4"/>
    <rect x="234" y="120" width="48" height="48" rx="4" fill="#4c8dd6" fill-opacity="0.18" stroke="#4c8dd6" stroke-width="1.4"/>
    <rect x="292" y="120" width="48" height="48" rx="4" fill="#4c8dd6" fill-opacity="0.18" stroke="#4c8dd6" stroke-width="1.4"/>
    <rect x="350" y="120" width="48" height="48" rx="4" fill="#4c8dd6" fill-opacity="0.18" stroke="#4c8dd6" stroke-width="1.4"/>
    <rect x="408" y="120" width="48" height="48" rx="4" fill="#4c8dd6" fill-opacity="0.18" stroke="#4c8dd6" stroke-width="1.4"/>
    <rect x="490" y="120" width="48" height="48" rx="4" fill="#e2903a" fill-opacity="0.15" stroke="#e2903a" stroke-width="1.8"/>
  </g>
  <text x="258" y="188" text-anchor="middle" fill="#4c8dd6" font-size="11.5px">7 servers: new routing code</text>
  <text x="514" y="188" text-anchor="middle" fill="#e2903a" font-size="11.5px">1 server: obsolete</text>
  <text x="514" y="202" text-anchor="middle" fill="#e2903a" font-size="11.5px">codepath still deployed</text>

  <text x="320" y="234" text-anchor="middle" fill="#e2903a" font-weight="bold" font-size="13px">millions of erroneous orders: −$460M in about 45 minutes</text>
</svg>

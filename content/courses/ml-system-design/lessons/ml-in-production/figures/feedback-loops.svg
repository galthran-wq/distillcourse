<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12.5">
  <style>
    .panel { stroke: currentColor; stroke-opacity: 0.35; fill: none; }
    .box   { stroke: currentColor; stroke-opacity: 0.7; fill: none; }
    .name  { fill: currentColor; font-size: 12.5px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .flow  { stroke: currentColor; stroke-opacity: 0.7; stroke-width: 1.6; fill: none; }
    .loop  { stroke: #e2903a; stroke-width: 1.8; fill: none; }
  </style>

  <!-- left panel: direct -->
  <rect class="panel" x="10" y="28" width="295" height="262" rx="5"/>
  <text class="name" x="157" y="18" text-anchor="middle" font-weight="bold">direct: one model, its own data</text>

  <rect class="box" x="92" y="48" width="130" height="40" rx="5"/>
  <text class="name" x="157" y="73" text-anchor="middle">recommender</text>

  <rect class="box" x="92" y="130" width="130" height="40" rx="5"/>
  <text class="name" x="157" y="149" text-anchor="middle">items ranked</text>
  <text class="name" x="157" y="163" text-anchor="middle">and shown</text>

  <rect class="box" x="92" y="212" width="130" height="40" rx="5"/>
  <text class="name" x="157" y="231" text-anchor="middle">clicks logged</text>
  <text class="name" x="157" y="245" text-anchor="middle">as labels</text>

  <line class="flow" x1="157" y1="88" x2="157" y2="130"/>
  <path d="M 152 123 L 157 133 L 162 123" class="flow"/>
  <line class="flow" x1="157" y1="170" x2="157" y2="212"/>
  <path d="M 152 205 L 157 215 L 162 205" class="flow"/>
  <path class="loop" d="M 92 232 C 34 232, 34 68, 92 68"/>
  <path d="M 84 63 L 95 68 L 84 73" fill="#e2903a"/>
  <text x="30" y="152" fill="#e2903a" font-size="11px" transform="rotate(-90 30 152)" text-anchor="middle">next training set</text>
  <text class="muted" x="157" y="278" text-anchor="middle">only shown items can be clicked</text>

  <!-- right panel: hidden -->
  <rect class="panel" x="335" y="28" width="295" height="262" rx="5"/>
  <text class="name" x="482" y="18" text-anchor="middle" font-weight="bold">hidden: two systems, one world</text>

  <rect class="box" x="352" y="48" width="120" height="40" rx="5"/>
  <text class="name" x="412" y="67" text-anchor="middle">firm A's</text>
  <text class="name" x="412" y="81" text-anchor="middle">trading model</text>

  <rect class="box" x="492" y="48" width="120" height="40" rx="5"/>
  <text class="name" x="552" y="67" text-anchor="middle">firm B's</text>
  <text class="name" x="552" y="81" text-anchor="middle">trading model</text>

  <rect class="box" x="422" y="200" width="120" height="40" rx="5"/>
  <text class="name" x="482" y="225" text-anchor="middle">market prices</text>

  <line class="loop" x1="400" y1="88" x2="444" y2="200"/>
  <path d="M 436 194 L 446 204 L 445 190" fill="#e2903a"/>
  <text class="muted" x="386" y="150" text-anchor="end">trades</text>
  <line class="flow" x1="462" y1="200" x2="422" y2="96"/>
  <path d="M 419 105 L 420 92 L 429 101" class="flow"/>

  <line class="loop" x1="564" y1="88" x2="520" y2="200"/>
  <path d="M 518 190 L 517 204 L 528 194" fill="#e2903a"/>
  <text class="muted" x="578" y="150">trades</text>
  <line class="flow" x1="502" y1="200" x2="542" y2="96"/>
  <path d="M 534 101 L 544 92 L 544 105" class="flow"/>
  <text class="muted" x="482" y="150" text-anchor="middle">features</text>

  <text class="muted" x="482" y="278" text-anchor="middle">neither team knows the other exists</text>
</svg>

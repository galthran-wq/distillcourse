<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12.5">
  <style>
    .box   { stroke: currentColor; stroke-opacity: 0.7; fill: none; }
    .name  { fill: currentColor; font-size: 12.5px; }
    .tag   { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .flow  { stroke: currentColor; stroke-opacity: 0.7; stroke-width: 1.6; fill: none; }
    .back  { stroke: #4c8dd6; stroke-width: 1.6; stroke-dasharray: 4 3; fill: none; }
  </style>

  <!-- top row -->
  <rect class="box" x="30" y="60" width="150" height="50" rx="5"/>
  <text class="name" x="105" y="82" text-anchor="middle">project scoping</text>
  <text class="tag" x="105" y="98" text-anchor="middle">module 1</text>

  <rect class="box" x="245" y="60" width="150" height="50" rx="5"/>
  <text class="name" x="320" y="82" text-anchor="middle">data engineering</text>
  <text class="tag" x="320" y="98" text-anchor="middle">modules 2–3</text>

  <rect class="box" x="460" y="60" width="150" height="50" rx="5"/>
  <text class="name" x="535" y="82" text-anchor="middle">model development</text>
  <text class="tag" x="535" y="98" text-anchor="middle">module 4</text>

  <!-- bottom row -->
  <rect class="box" x="460" y="250" width="150" height="50" rx="5"/>
  <text class="name" x="535" y="272" text-anchor="middle">deployment</text>
  <text class="tag" x="535" y="288" text-anchor="middle">module 5</text>

  <rect class="box" x="245" y="250" width="150" height="50" rx="5"/>
  <text class="name" x="320" y="266" text-anchor="middle">monitoring &amp;</text>
  <text class="name" x="320" y="281" text-anchor="middle">continual learning</text>
  <text class="tag" x="320" y="296" text-anchor="middle">module 6</text>

  <rect class="box" x="30" y="250" width="150" height="50" rx="5"/>
  <text class="name" x="105" y="272" text-anchor="middle">business analysis</text>
  <text class="tag" x="105" y="288" text-anchor="middle">module 1</text>

  <!-- forward loop, clockwise -->
  <line class="flow" x1="180" y1="85" x2="245" y2="85"/>
  <path d="M 238 80 L 248 85 L 238 90" class="flow"/>
  <line class="flow" x1="395" y1="85" x2="460" y2="85"/>
  <path d="M 453 80 L 463 85 L 453 90" class="flow"/>
  <line class="flow" x1="595" y1="110" x2="595" y2="250"/>
  <path d="M 590 243 L 595 253 L 600 243" class="flow"/>
  <line class="flow" x1="460" y1="275" x2="395" y2="275"/>
  <path d="M 402 270 L 392 275 L 402 280" class="flow"/>
  <line class="flow" x1="245" y1="275" x2="180" y2="275"/>
  <path d="M 187 270 L 177 275 L 187 280" class="flow"/>
  <line class="flow" x1="45" y1="250" x2="45" y2="110"/>
  <path d="M 40 117 L 45 107 L 50 117" class="flow"/>
  <text class="tag" x="58" y="185">rescope</text>

  <!-- backward arrows -->
  <path class="back" d="M 490 60 C 470 22, 370 22, 348 56"/>
  <path d="M 344 46 L 346 59 L 356 52" fill="#4c8dd6"/>
  <text x="418" y="18" text-anchor="middle" fill="#4c8dd6" font-size="11px">bad labels: back to the data</text>

  <path class="back" d="M 355 250 C 400 185, 460 155, 510 118"/>
  <path d="M 502 116 L 513 115 L 508 127" fill="#4c8dd6"/>
  <text x="452" y="205" fill="#4c8dd6" font-size="11px">model stale: retrain</text>
</svg>

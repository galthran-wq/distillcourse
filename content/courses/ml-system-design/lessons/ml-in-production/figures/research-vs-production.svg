<svg viewBox="0 0 640 296" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12.5">
  <style>
    .axis  { fill: currentColor; opacity: 0.55; font-size: 11.5px; }
    .cell  { fill: currentColor; font-size: 12.5px; }
    .rule  { stroke: currentColor; stroke-opacity: 0.2; stroke-width: 1; }
  </style>

  <!-- column headers -->
  <text x="300" y="26" text-anchor="middle" fill="#4c8dd6" font-size="13.5" font-weight="bold">research</text>
  <text x="510" y="26" text-anchor="middle" fill="#e2903a" font-size="13.5" font-weight="bold">production</text>
  <line class="rule" x1="10" y1="38" x2="630" y2="38"/>

  <!-- row 1: objective -->
  <text class="axis" x="14" y="66">objective</text>
  <text class="cell" x="300" y="60" text-anchor="middle" fill="#4c8dd6">one metric on a</text>
  <text class="cell" x="300" y="76" text-anchor="middle" fill="#4c8dd6">benchmark dataset</text>
  <text class="cell" x="510" y="60" text-anchor="middle" fill="#e2903a">many stakeholders,</text>
  <text class="cell" x="510" y="76" text-anchor="middle" fill="#e2903a">conflicting objectives</text>
  <line class="rule" x1="10" y1="88" x2="630" y2="88"/>

  <!-- row 2: compute priority -->
  <text class="axis" x="14" y="116">compute priority</text>
  <text class="cell" x="300" y="110" text-anchor="middle" fill="#4c8dd6">fast training,</text>
  <text class="cell" x="300" y="126" text-anchor="middle" fill="#4c8dd6">high throughput</text>
  <text class="cell" x="510" y="110" text-anchor="middle" fill="#e2903a">fast inference,</text>
  <text class="cell" x="510" y="126" text-anchor="middle" fill="#e2903a">low latency</text>
  <line class="rule" x1="10" y1="138" x2="630" y2="138"/>

  <!-- row 3: data -->
  <text class="axis" x="14" y="166">data</text>
  <text class="cell" x="300" y="160" text-anchor="middle" fill="#4c8dd6">static, clean,</text>
  <text class="cell" x="300" y="176" text-anchor="middle" fill="#4c8dd6">quirks documented</text>
  <text class="cell" x="510" y="160" text-anchor="middle" fill="#e2903a">shifting, messy,</text>
  <text class="cell" x="510" y="176" text-anchor="middle" fill="#e2903a">biased in unknown ways</text>
  <line class="rule" x1="10" y1="188" x2="630" y2="188"/>

  <!-- row 4: fairness -->
  <text class="axis" x="14" y="216">fairness</text>
  <text class="cell" x="300" y="220" text-anchor="middle" fill="#4c8dd6">often deferred</text>
  <text class="cell" x="510" y="220" text-anchor="middle" fill="#e2903a">must be considered</text>
  <line class="rule" x1="10" y1="238" x2="630" y2="238"/>

  <!-- row 5: interpretability -->
  <text class="axis" x="14" y="266">interpretability</text>
  <text class="cell" x="300" y="270" text-anchor="middle" fill="#4c8dd6">often deferred</text>
  <text class="cell" x="510" y="270" text-anchor="middle" fill="#e2903a">must be considered</text>
</svg>

<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12.5">
  <style>
    .box    { stroke: currentColor; stroke-opacity: 0.7; fill: none; }
    .name   { fill: currentColor; font-size: 12.5px; }
    .muted  { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .flow   { stroke: currentColor; stroke-opacity: 0.7; stroke-width: 1.6; fill: none; }
    .silent { stroke: #e2903a; stroke-width: 1.8; fill: none; stroke-dasharray: 5 4; }
  </style>

  <!-- declared path: model -> prediction logs -->
  <rect class="box" x="40" y="40" width="130" height="44" rx="5"/>
  <text class="name" x="105" y="66" text-anchor="middle">your model</text>

  <rect class="box" x="270" y="40" width="150" height="44" rx="5"/>
  <text class="name" x="345" y="59" text-anchor="middle">predictions in</text>
  <text class="name" x="345" y="74" text-anchor="middle">logs and files</text>

  <line class="flow" x1="170" y1="62" x2="270" y2="62"/>
  <path d="M 262 57 L 272 62 L 262 67" class="flow"/>
  <text class="muted" x="220" y="52" text-anchor="middle">declared output</text>

  <!-- silent read: logs -> other team's system -->
  <rect x="470" y="150" width="150" height="44" rx="5" fill="#e2903a" fill-opacity="0.12" stroke="#e2903a" stroke-width="1.6"/>
  <text x="545" y="169" text-anchor="middle" fill="#e2903a">another team's</text>
  <text x="545" y="184" text-anchor="middle" fill="#e2903a">system</text>

  <line class="silent" x1="420" y1="76" x2="500" y2="150"/>
  <path d="M 491 146 L 503 153 L 498 139" fill="#e2903a"/>
  <text x="486" y="105" fill="#e2903a" font-size="11px">reads silently,</text>
  <text x="486" y="119" fill="#e2903a" font-size="11px">no contract</text>

  <!-- feedback edge: consumer's actions -> training data -> model -->
  <rect class="box" x="40" y="150" width="150" height="44" rx="5"/>
  <text class="name" x="115" y="169" text-anchor="middle">your next</text>
  <text class="name" x="115" y="184" text-anchor="middle">training data</text>

  <line class="silent" x1="470" y1="172" x2="190" y2="172"/>
  <path d="M 198 167 L 188 172 L 198 177" fill="#e2903a"/>
  <text x="330" y="163" fill="#e2903a" font-size="11px" text-anchor="middle">its actions change the world you sample</text>

  <line class="flow" x1="105" y1="150" x2="105" y2="84"/>
  <path d="M 100 92 L 105 82 L 110 92" class="flow"/>
  <text class="muted" x="97" y="120" text-anchor="end">next retrain</text>

  <text class="muted" x="320" y="240" text-anchor="middle">a model update here can break a system its owners have never heard of</text>
</svg>

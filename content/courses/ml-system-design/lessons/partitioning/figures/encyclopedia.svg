<svg viewBox="0 0 480 200" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <marker id="enc-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e2903a"/>
    </marker>
  </defs>

  <!-- lookup annotation -->
  <text x="300" y="24" font-size="12" fill="#e2903a">lookup &#8220;sharding&#8221;</text>
  <line x1="358" y1="30" x2="389" y2="44" stroke="#e2903a" stroke-width="1.6" marker-end="url(#enc-amber)"/>

  <!-- volumes: unequal ranges, roughly equal books -->
  <g stroke="currentColor" fill="none">
    <rect x="20" y="48" width="44" height="120" rx="3"/>
    <rect x="68" y="48" width="40" height="120" rx="3"/>
    <rect x="112" y="48" width="38" height="120" rx="3"/>
    <rect x="154" y="48" width="38" height="120" rx="3"/>
    <rect x="196" y="48" width="42" height="120" rx="3"/>
    <rect x="242" y="48" width="42" height="120" rx="3"/>
    <rect x="288" y="48" width="40" height="120" rx="3"/>
    <rect x="332" y="48" width="40" height="120" rx="3"/>
    <rect x="410" y="48" width="50" height="120" rx="3"/>
  </g>
  <rect x="376" y="48" width="30" height="120" rx="3" fill="#e2903a" fill-opacity="0.18" stroke="#e2903a"/>

  <!-- volume numbers -->
  <g font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">
    <text x="42" y="66">1</text>
    <text x="88" y="66">2</text>
    <text x="131" y="66">3</text>
    <text x="173" y="66">4</text>
    <text x="217" y="66">5</text>
    <text x="263" y="66">6</text>
    <text x="308" y="66">7</text>
    <text x="352" y="66">8</text>
    <text x="391" y="66">9</text>
    <text x="435" y="66">10</text>
  </g>

  <!-- key ranges on the spines -->
  <g font-size="11" fill="currentColor" text-anchor="middle">
    <text x="42" y="115">A&#8211;B</text>
    <text x="88" y="115">C&#8211;D</text>
    <text x="131" y="115">E&#8211;F</text>
    <text x="173" y="115">G&#8211;H</text>
    <text x="217" y="115">I&#8211;K</text>
    <text x="263" y="115">L&#8211;N</text>
    <text x="308" y="115">O&#8211;P</text>
    <text x="352" y="115">Q&#8211;R</text>
    <text x="391" y="115" fill="#e2903a">S</text>
    <text x="435" y="115">T&#8211;Z</text>
  </g>

  <!-- shelf -->
  <line x1="14" y1="168" x2="466" y2="168" stroke="currentColor" stroke-width="1.6"/>
  <text x="240" y="190" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">unequal ranges, roughly equal volumes: the boundaries follow the data</text>
</svg>

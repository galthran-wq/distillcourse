<svg viewBox="0 0 560 310" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="280" y="22" font-size="12" font-weight="bold" fill="currentColor" text-anchor="middle">8 partitions &#215; 4 nodes, one leader and one follower each</text>

  <!-- column headers -->
  <g font-size="11" fill="currentColor" text-anchor="middle">
    <text x="165" y="52">node 1</text>
    <text x="247" y="52">node 2</text>
    <text x="329" y="52" fill="#e2903a">node 3</text>
    <text x="411" y="52">node 4</text>
  </g>

  <!-- row labels -->
  <g font-size="11" fill="currentColor" opacity="0.55" text-anchor="end">
    <text x="116" y="80">p1</text>
    <text x="116" y="106">p2</text>
    <text x="116" y="132">p3</text>
    <text x="116" y="158">p4</text>
    <text x="116" y="184">p5</text>
    <text x="116" y="210">p6</text>
    <text x="116" y="236">p7</text>
    <text x="116" y="262">p8</text>
  </g>

  <!-- leader cells (amber) -->
  <g fill="#e2903a" fill-opacity="0.3" stroke="#e2903a">
    <rect x="130" y="66" width="70" height="20" rx="3"/>
    <rect x="212" y="92" width="70" height="20" rx="3"/>
    <rect x="294" y="118" width="70" height="20" rx="3"/>
    <rect x="376" y="144" width="70" height="20" rx="3"/>
    <rect x="130" y="170" width="70" height="20" rx="3"/>
    <rect x="212" y="196" width="70" height="20" rx="3"/>
    <rect x="294" y="222" width="70" height="20" rx="3"/>
    <rect x="376" y="248" width="70" height="20" rx="3"/>
  </g>
  <g font-size="11" fill="currentColor" text-anchor="middle">
    <text x="165" y="80">leader</text>
    <text x="247" y="106">leader</text>
    <text x="329" y="132">leader</text>
    <text x="411" y="158">leader</text>
    <text x="165" y="184">leader</text>
    <text x="247" y="210">leader</text>
    <text x="329" y="236">leader</text>
    <text x="411" y="262">leader</text>
  </g>

  <!-- follower cells (muted) -->
  <g fill="none" stroke="currentColor" opacity="0.45">
    <rect x="294" y="66" width="70" height="20" rx="3"/>
    <rect x="376" y="92" width="70" height="20" rx="3"/>
    <rect x="376" y="118" width="70" height="20" rx="3"/>
    <rect x="212" y="144" width="70" height="20" rx="3"/>
    <rect x="212" y="170" width="70" height="20" rx="3"/>
    <rect x="130" y="196" width="70" height="20" rx="3"/>
    <rect x="130" y="222" width="70" height="20" rx="3"/>
    <rect x="294" y="248" width="70" height="20" rx="3"/>
  </g>
  <g font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">
    <text x="329" y="80">follower</text>
    <text x="411" y="106">follower</text>
    <text x="411" y="132">follower</text>
    <text x="247" y="158">follower</text>
    <text x="247" y="184">follower</text>
    <text x="165" y="210">follower</text>
    <text x="165" y="236">follower</text>
    <text x="329" y="262">follower</text>
  </g>

  <text x="280" y="290" font-size="11" fill="currentColor" text-anchor="middle">each node: leader for 2 partitions, follower for 2</text>
  <text x="280" y="306" font-size="11" fill="#e2903a" text-anchor="middle">lose node 3 and only p3 and p7 fail over &#8212; to their followers on nodes 1 and 4</text>
</svg>

<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <marker id="rvh-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e2903a"/>
    </marker>
    <marker id="rvh-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5aa46a"/>
    </marker>
  </defs>

  <!-- left panel: key-range -->
  <text x="150" y="20" font-size="12" font-weight="bold" fill="currentColor" text-anchor="middle">key-range partitions</text>
  <rect x="86" y="36" width="128" height="24" rx="4" fill="none" stroke="#e2903a"/>
  <text x="150" y="52" font-size="12" fill="#e2903a" text-anchor="middle">range query e &#8230; h</text>

  <line x1="150" y1="60" x2="150" y2="130" stroke="#5aa46a" stroke-width="2" marker-end="url(#rvh-green)"/>

  <g fill="none" stroke="currentColor">
    <rect x="10" y="150" width="88" height="120" rx="4"/>
    <rect x="106" y="150" width="88" height="120" rx="4"/>
    <rect x="202" y="150" width="88" height="120" rx="4"/>
  </g>
  <g font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">
    <text x="54" y="144">P0</text>
    <text x="150" y="144">P1</text>
    <text x="246" y="144">P2</text>
  </g>
  <g font-size="12" fill="currentColor" text-anchor="middle">
    <text x="54" y="176">a</text><text x="54" y="200">b</text><text x="54" y="224">c</text><text x="54" y="248">d</text>
    <text x="150" y="176" fill="#e2903a">e</text><text x="150" y="200" fill="#e2903a">f</text><text x="150" y="224" fill="#e2903a">g</text><text x="150" y="248" fill="#e2903a">h</text>
    <text x="246" y="176">i</text><text x="246" y="200">j</text><text x="246" y="224">k</text><text x="246" y="248">l</text>
  </g>
  <text x="150" y="298" font-size="12" fill="#5aa46a" text-anchor="middle">sorted keys: one partition answers</text>

  <!-- divider -->
  <line x1="320" y1="16" x2="320" y2="304" stroke="currentColor" opacity="0.25" stroke-dasharray="3 3"/>

  <!-- right panel: hash -->
  <text x="480" y="20" font-size="12" font-weight="bold" fill="currentColor" text-anchor="middle">hash partitions</text>
  <rect x="416" y="36" width="128" height="24" rx="4" fill="none" stroke="#e2903a"/>
  <text x="480" y="52" font-size="12" fill="#e2903a" text-anchor="middle">range query e &#8230; h</text>

  <line x1="466" y1="60" x2="390" y2="146" stroke="#e2903a" stroke-width="1.8" marker-end="url(#rvh-amber)"/>
  <line x1="480" y1="60" x2="480" y2="146" stroke="#e2903a" stroke-width="1.8" marker-end="url(#rvh-amber)"/>
  <line x1="494" y1="60" x2="570" y2="146" stroke="#e2903a" stroke-width="1.8" marker-end="url(#rvh-amber)"/>

  <g fill="none" stroke="currentColor">
    <rect x="340" y="150" width="88" height="120" rx="4"/>
    <rect x="436" y="150" width="88" height="120" rx="4"/>
    <rect x="532" y="150" width="88" height="120" rx="4"/>
  </g>
  <g font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">
    <text x="384" y="144">P0</text>
    <text x="480" y="144">P1</text>
    <text x="576" y="144">P2</text>
  </g>
  <g font-size="12" fill="currentColor" text-anchor="middle">
    <text x="384" y="176">b</text><text x="384" y="200" fill="#e2903a">e</text><text x="384" y="224">i</text><text x="384" y="248">l</text>
    <text x="480" y="176">a</text><text x="480" y="200" fill="#e2903a">f</text><text x="480" y="224" fill="#e2903a">h</text><text x="480" y="248">j</text>
    <text x="576" y="176">c</text><text x="576" y="200">d</text><text x="576" y="224" fill="#e2903a">g</text><text x="576" y="248">k</text>
  </g>
  <text x="480" y="298" font-size="12" fill="#e2903a" text-anchor="middle">adjacent keys scattered: every partition must answer</text>
</svg>

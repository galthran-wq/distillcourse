<svg viewBox="0 0 640 250" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- shared premise -->
  <text x="320" y="22" font-size="12" fill="currentColor" text-anchor="middle">the same event under three schemes: 10 nodes grow to 11</text>

  <!-- column 1: hash mod N -->
  <text x="115" y="58" font-size="12" font-weight="bold" fill="currentColor" text-anchor="middle">hash(key) mod N</text>
  <rect x="35" y="76" width="160" height="22" rx="3" fill="none" stroke="currentColor"/>
  <rect x="35" y="76" width="145" height="22" fill="#e2903a" fill-opacity="0.85"/>
  <text x="115" y="128" font-size="15" font-weight="bold" fill="#e2903a" text-anchor="middle">&#8776; 91% move</text>
  <text x="115" y="150" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">every key is rehashed:</text>
  <text x="115" y="166" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">only 1 key in 11 keeps its node</text>

  <line x1="217" y1="44" x2="217" y2="200" stroke="currentColor" opacity="0.25" stroke-dasharray="3 3"/>

  <!-- column 2: fixed partitions -->
  <text x="320" y="58" font-size="12" font-weight="bold" fill="currentColor" text-anchor="middle">1,000 fixed partitions</text>
  <rect x="240" y="76" width="160" height="22" rx="3" fill="none" stroke="currentColor"/>
  <rect x="240" y="76" width="15" height="22" fill="#e2903a" fill-opacity="0.85"/>
  <text x="320" y="128" font-size="15" font-weight="bold" fill="#5aa46a" text-anchor="middle">&#8776; 9% move</text>
  <text x="320" y="150" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">node 11 steals &#8776;91 whole partitions;</text>
  <text x="320" y="166" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">key &#8594; partition never changes</text>

  <line x1="423" y1="44" x2="423" y2="200" stroke="currentColor" opacity="0.25" stroke-dasharray="3 3"/>

  <!-- column 3: consistent hashing -->
  <text x="525" y="58" font-size="12" font-weight="bold" fill="currentColor" text-anchor="middle">consistent hashing</text>
  <rect x="445" y="76" width="160" height="22" rx="3" fill="none" stroke="currentColor"/>
  <rect x="445" y="76" width="15" height="22" fill="#e2903a" fill-opacity="0.85"/>
  <text x="525" y="128" font-size="15" font-weight="bold" fill="#5aa46a" text-anchor="middle">&#8776; 9% move</text>
  <text x="525" y="150" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">new virtual nodes claim arcs,</text>
  <text x="525" y="166" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">a sliver from every existing node</text>

  <!-- legend -->
  <rect x="240" y="212" width="12" height="12" fill="#e2903a" fill-opacity="0.85"/>
  <text x="258" y="222" font-size="11" fill="currentColor" opacity="0.55">fraction of all keys that change nodes</text>
</svg>

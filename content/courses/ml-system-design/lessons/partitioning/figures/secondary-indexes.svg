<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <marker id="si-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e2903a"/>
    </marker>
    <marker id="si-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5aa46a"/>
    </marker>
  </defs>

  <!-- left: document-partitioned (local) -->
  <text x="160" y="22" font-size="12" font-weight="bold" fill="currentColor" text-anchor="middle">document-partitioned (local)</text>
  <text x="160" y="52" font-size="12" fill="#e2903a" text-anchor="middle">read: color = red</text>
  <line x1="140" y1="58" x2="86" y2="106" stroke="#e2903a" stroke-width="1.8" marker-end="url(#si-amber)"/>
  <line x1="180" y1="58" x2="234" y2="106" stroke="#e2903a" stroke-width="1.8" marker-end="url(#si-amber)"/>

  <g fill="none" stroke="currentColor">
    <rect x="16" y="110" width="136" height="110" rx="4"/>
    <rect x="168" y="110" width="136" height="110" rx="4"/>
  </g>
  <g font-size="11" fill="currentColor" text-anchor="middle">
    <text x="84" y="130" opacity="0.55">cars 0&#8211;499</text>
    <text x="84" y="152">191 &#183; red &#183; Honda</text>
    <text x="84" y="170">214 &#183; black &#183; Dodge</text>
    <text x="84" y="200" fill="#e2903a">idx color:red &#8594; [191]</text>
    <text x="236" y="130" opacity="0.55">cars 500&#8211;999</text>
    <text x="236" y="152">768 &#183; red &#183; Audi</text>
    <text x="236" y="170">306 &#183; silver &#183; Ford</text>
    <text x="236" y="200" fill="#e2903a">idx color:red &#8594; [768]</text>
  </g>

  <text x="120" y="278" font-size="12" fill="#5aa46a" text-anchor="middle">write: car 306</text>
  <line x1="150" y1="266" x2="222" y2="226" stroke="#5aa46a" stroke-width="1.8" marker-end="url(#si-green)"/>
  <text x="160" y="308" font-size="12" fill="currentColor" text-anchor="middle">reads scatter/gather; writes touch one partition</text>

  <line x1="322" y1="14" x2="322" y2="316" stroke="currentColor" opacity="0.25" stroke-dasharray="3 3"/>

  <!-- right: term-partitioned (global) -->
  <text x="482" y="22" font-size="12" font-weight="bold" fill="currentColor" text-anchor="middle">term-partitioned (global)</text>
  <text x="420" y="52" font-size="12" fill="#5aa46a" text-anchor="middle">read: color = red</text>
  <line x1="420" y1="58" x2="410" y2="106" stroke="#5aa46a" stroke-width="1.8" marker-end="url(#si-green)"/>

  <g fill="none" stroke="currentColor">
    <rect x="338" y="110" width="140" height="110" rx="4"/>
    <rect x="494" y="110" width="140" height="110" rx="4"/>
  </g>
  <g font-size="11" fill="currentColor" text-anchor="middle">
    <text x="408" y="130" opacity="0.55">index &#183; terms a&#8211;r</text>
    <text x="408" y="156" fill="#e2903a">color:red &#8594; [191, 768]</text>
    <text x="408" y="176">make:ford &#8594; [306]</text>
    <text x="564" y="130" opacity="0.55">index &#183; terms s&#8211;z</text>
    <text x="564" y="156">color:silver &#8594; [306]</text>
    <text x="564" y="176">make:tesla &#8594; [&#8230;]</text>
  </g>

  <text x="482" y="278" font-size="12" fill="#e2903a" text-anchor="middle">write: car 306 (silver, Ford)</text>
  <line x1="452" y1="266" x2="416" y2="226" stroke="#e2903a" stroke-width="1.8" marker-end="url(#si-amber)"/>
  <line x1="512" y1="266" x2="556" y2="226" stroke="#e2903a" stroke-width="1.8" marker-end="url(#si-amber)"/>
  <text x="482" y="308" font-size="12" fill="currentColor" text-anchor="middle">reads hit one partition; writes touch one per term</text>
</svg>

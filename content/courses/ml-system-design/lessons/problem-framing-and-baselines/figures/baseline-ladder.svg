<svg viewBox="0 0 560 360" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- rails -->
  <line x1="195" y1="60" x2="195" y2="336" stroke="currentColor" stroke-width="2"/>
  <line x1="365" y1="60" x2="365" y2="336" stroke="currentColor" stroke-width="2"/>

  <!-- pricing arrow at top -->
  <text x="280" y="26" font-size="12" font-weight="600" text-anchor="middle" fill="#e2903a">a model’s complexity is priced here</text>
  <line x1="280" y1="56" x2="280" y2="36" stroke="#e2903a"/>
  <path d="M280 34 l-4 8 h8 z" fill="#e2903a"/>

  <!-- rung 6: existing solution -->
  <line x1="195" y1="80" x2="365" y2="80" stroke="#e2903a" stroke-width="3"/>
  <text x="185" y="84" font-size="12" font-weight="600" text-anchor="end" fill="#e2903a">existing solution</text>
  <text x="375" y="84" font-size="11" fill="#e2903a">the rung that decides shipping</text>

  <!-- rung 5: human -->
  <line x1="195" y1="130" x2="365" y2="130" stroke="currentColor" stroke-width="2"/>
  <text x="185" y="134" font-size="12" text-anchor="end" fill="currentColor">human review</text>
  <text x="375" y="134" font-size="11" fill="currentColor" opacity="0.55">measured · priced in expert-hours</text>

  <!-- rung 4: heuristic -->
  <line x1="195" y1="180" x2="365" y2="180" stroke="currentColor" stroke-width="2"/>
  <text x="185" y="184" font-size="12" text-anchor="end" fill="currentColor">one-rule heuristic</text>
  <text x="375" y="184" font-size="11" fill="currentColor" opacity="0.55">acc ≈ 96% · F1 ≈ 0.73</text>

  <!-- rung 3: zero rule -->
  <line x1="195" y1="230" x2="365" y2="230" stroke="currentColor" stroke-width="2"/>
  <text x="185" y="234" font-size="12" text-anchor="end" fill="currentColor">zero rule (always “ham”)</text>
  <text x="375" y="234" font-size="11" fill="currentColor" opacity="0.55">acc 90% · F1 0</text>

  <!-- rung 2: base-rate random -->
  <line x1="195" y1="280" x2="365" y2="280" stroke="currentColor" stroke-width="2"/>
  <text x="185" y="284" font-size="12" text-anchor="end" fill="currentColor">base-rate random</text>
  <text x="375" y="284" font-size="11" fill="currentColor" opacity="0.55">acc 82% · F1 0.10</text>

  <!-- rung 1: uniform random -->
  <line x1="195" y1="330" x2="365" y2="330" stroke="currentColor" stroke-width="2"/>
  <text x="185" y="334" font-size="12" text-anchor="end" fill="currentColor">uniform random</text>
  <text x="375" y="334" font-size="11" fill="currentColor" opacity="0.55">acc 50% · F1 0.17</text>

  <text x="280" y="354" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.55">support-inbox spam flag, 10% positive</text>
</svg>

<svg viewBox="0 0 560 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- axes -->
  <line x1="60" y1="250" x2="530" y2="250" stroke="currentColor"/>
  <path d="M530 250 l-8 -4 v8 z" fill="currentColor"/>
  <line x1="60" y1="250" x2="60" y2="40" stroke="currentColor"/>
  <path d="M60 40 l-4 8 h8 z" fill="currentColor"/>
  <text x="295" y="288" font-size="12" text-anchor="middle" fill="currentColor">required accuracy</text>
  <text x="34" y="145" font-size="12" fill="currentColor" transform="rotate(-90 34 145)" text-anchor="middle">project cost</text>

  <!-- x ticks -->
  <line x1="120" y1="250" x2="120" y2="256" stroke="currentColor"/>
  <text x="120" y="270" font-size="11" text-anchor="middle" fill="currentColor">80%</text>
  <line x1="230" y1="250" x2="230" y2="256" stroke="currentColor"/>
  <text x="230" y="270" font-size="11" text-anchor="middle" fill="currentColor">90%</text>
  <line x1="330" y1="250" x2="330" y2="256" stroke="currentColor"/>
  <text x="330" y="270" font-size="11" text-anchor="middle" fill="currentColor">95%</text>
  <line x1="420" y1="250" x2="420" y2="256" stroke="currentColor"/>
  <text x="420" y="270" font-size="11" text-anchor="middle" fill="currentColor">99%</text>
  <line x1="485" y1="250" x2="485" y2="256" stroke="currentColor"/>
  <text x="485" y="270" font-size="11" text-anchor="middle" fill="currentColor">99.9%</text>

  <!-- superlinear cost curve -->
  <path d="M 70 242 C 160 236, 250 226, 330 200 C 380 182, 420 140, 445 100 C 460 74, 472 56, 480 46"
        fill="none" stroke="#e2903a" stroke-width="2.5"/>

  <!-- knee bracket -->
  <line x1="330" y1="200" x2="330" y2="250" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5"/>
  <line x1="420" y1="140" x2="420" y2="250" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5"/>
  <text x="375" y="230" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.55">the knee</text>

  <!-- renegotiate annotation -->
  <circle cx="480" cy="46" r="4" fill="#e2903a"/>
  <line x1="485" y1="250" x2="485" y2="60" stroke="#e2903a" stroke-dasharray="3 3" opacity="0.5"/>
  <text x="470" y="34" font-size="12" font-weight="600" text-anchor="end" fill="#e2903a">renegotiate here</text>

  <!-- labeled-data note -->
  <text x="140" y="60" font-size="11" fill="currentColor" opacity="0.55">past 99%: labeled-data supply</text>
  <text x="140" y="76" font-size="11" fill="currentColor" opacity="0.55">becomes the blocker</text>
</svg>

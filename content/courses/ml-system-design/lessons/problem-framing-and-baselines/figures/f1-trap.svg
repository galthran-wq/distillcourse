<svg viewBox="0 0 600 270" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="300" y="24" font-size="12" text-anchor="middle" fill="currentColor" opacity="0.55">1,000 examples · 90% positive · predict “+” with p = 0.9, ignoring the input</text>

  <!-- column headers -->
  <text x="150" y="66" font-size="12" text-anchor="middle" fill="currentColor">actual +</text>
  <text x="250" y="66" font-size="12" text-anchor="middle" fill="currentColor">actual −</text>
  <!-- row headers -->
  <text x="88" y="112" font-size="12" text-anchor="end" fill="currentColor">pred +</text>
  <text x="88" y="176" font-size="12" text-anchor="end" fill="currentColor">pred −</text>

  <!-- matrix cells -->
  <rect x="100" y="78" width="100" height="56" rx="4" fill="none" stroke="#5aa46a" stroke-width="2"/>
  <text x="150" y="102" font-size="14" font-weight="600" text-anchor="middle" fill="#5aa46a">810</text>
  <text x="150" y="122" font-size="10" text-anchor="middle" fill="currentColor" opacity="0.55">TP</text>

  <rect x="200" y="78" width="100" height="56" rx="4" fill="none" stroke="currentColor"/>
  <text x="250" y="102" font-size="14" font-weight="600" text-anchor="middle" fill="currentColor">90</text>
  <text x="250" y="122" font-size="10" text-anchor="middle" fill="currentColor" opacity="0.55">FP</text>

  <rect x="100" y="142" width="100" height="56" rx="4" fill="none" stroke="currentColor"/>
  <text x="150" y="166" font-size="14" font-weight="600" text-anchor="middle" fill="currentColor">90</text>
  <text x="150" y="186" font-size="10" text-anchor="middle" fill="currentColor" opacity="0.55">FN</text>

  <rect x="200" y="142" width="100" height="56" rx="4" fill="none" stroke="currentColor"/>
  <text x="250" y="166" font-size="14" font-weight="600" text-anchor="middle" fill="currentColor">10</text>
  <text x="250" y="186" font-size="10" text-anchor="middle" fill="currentColor" opacity="0.55">TN</text>

  <!-- computations -->
  <text x="340" y="100" font-size="12" fill="currentColor">precision = 810 / (810 + 90) = 0.90</text>
  <text x="340" y="128" font-size="12" fill="currentColor">recall = 810 / (810 + 90) = 0.90</text>
  <rect x="334" y="142" width="126" height="26" rx="4" fill="none" stroke="#e2903a" stroke-width="2"/>
  <text x="340" y="160" font-size="13" font-weight="600" fill="#e2903a">F1 = 0.90</text>
  <text x="340" y="192" font-size="12" fill="currentColor">accuracy = 820 / 1000 = 0.82</text>

  <text x="300" y="240" font-size="12" text-anchor="middle" fill="#e2903a">the score is the base rate, not the model</text>
</svg>

<svg viewBox="0 0 640 230" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="320" y="24" font-size="12" text-anchor="middle" fill="currentColor" opacity="0.55">each phase’s solution is the next phase’s baseline</text>

  <!-- phase 1 -->
  <rect x="16" y="44" width="136" height="70" rx="6" fill="none" stroke="#e2903a" stroke-width="2"/>
  <text x="84" y="66" font-size="12" font-weight="600" text-anchor="middle" fill="#e2903a">1 · Before ML</text>
  <text x="84" y="86" font-size="11" text-anchor="middle" fill="currentColor">heuristics ship</text>
  <text x="84" y="102" font-size="11" text-anchor="middle" fill="currentColor">half the value</text>
  <text x="84" y="138" font-size="10" text-anchor="middle" fill="currentColor" opacity="0.55">exit: data logged (Rule #2),</text>
  <text x="84" y="152" font-size="10" text-anchor="middle" fill="currentColor" opacity="0.55">rules multiply and rot (Rule #3)</text>

  <line x1="152" y1="79" x2="176" y2="79" stroke="currentColor"/>
  <path d="M176 79 l-7 -4 v8 z" fill="currentColor"/>

  <!-- phase 2 -->
  <rect x="178" y="44" width="136" height="70" rx="6" fill="none" stroke="currentColor"/>
  <text x="246" y="66" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor">2 · Simplest ML</text>
  <text x="246" y="86" font-size="11" text-anchor="middle" fill="currentColor">logistic regression,</text>
  <text x="246" y="102" font-size="11" text-anchor="middle" fill="currentColor">boosted trees, kNN</text>
  <text x="246" y="138" font-size="10" text-anchor="middle" fill="currentColor" opacity="0.55">exit: framing and</text>
  <text x="246" y="152" font-size="10" text-anchor="middle" fill="currentColor" opacity="0.55">pipeline validated</text>

  <line x1="314" y1="79" x2="338" y2="79" stroke="currentColor"/>
  <path d="M338 79 l-7 -4 v8 z" fill="currentColor"/>

  <!-- phase 3 -->
  <rect x="340" y="44" width="136" height="70" rx="6" fill="none" stroke="currentColor"/>
  <text x="408" y="66" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor">3 · Optimize simple</text>
  <text x="408" y="86" font-size="11" text-anchor="middle" fill="currentColor">features, tuning,</text>
  <text x="408" y="102" font-size="11" text-anchor="middle" fill="currentColor">more data, ensembles</text>
  <text x="408" y="138" font-size="10" text-anchor="middle" fill="currentColor" opacity="0.55">exit: simple models</text>
  <text x="408" y="152" font-size="10" text-anchor="middle" fill="currentColor" opacity="0.55">plateau, gap pays</text>

  <line x1="476" y1="79" x2="500" y2="79" stroke="currentColor"/>
  <path d="M500 79 l-7 -4 v8 z" fill="currentColor"/>

  <!-- phase 4 -->
  <rect x="502" y="44" width="122" height="70" rx="6" fill="none" stroke="currentColor"/>
  <text x="563" y="66" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor">4 · Complex</text>
  <text x="563" y="86" font-size="11" text-anchor="middle" fill="currentColor">only if the gain</text>
  <text x="563" y="102" font-size="11" text-anchor="middle" fill="currentColor">pays its debt</text>
  <text x="563" y="138" font-size="10" text-anchor="middle" fill="currentColor" opacity="0.55">measure decay →</text>
  <text x="563" y="152" font-size="10" text-anchor="middle" fill="currentColor" opacity="0.55">retraining cadence</text>

  <text x="320" y="196" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.55">transitions have conditions, not schedules — many products end at phase 1 or 2</text>
</svg>

<svg viewBox="0 0 620 240" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- left: flat N-way head -->
  <text x="145" y="26" font-size="12" font-weight="600" fill="#4c8dd6" text-anchor="middle">flat: one 1,000-way head</text>

  <rect x="30" y="66" width="110" height="44" rx="6" fill="none" stroke="#4c8dd6"/>
  <text x="85" y="92" font-size="12" fill="#4c8dd6" text-anchor="middle">classifier</text>

  <line x1="140" y1="88" x2="216" y2="48" stroke="currentColor" opacity="0.4"/>
  <line x1="140" y1="88" x2="216" y2="64" stroke="currentColor" opacity="0.4"/>
  <line x1="140" y1="88" x2="216" y2="80" stroke="currentColor" opacity="0.4"/>
  <line x1="140" y1="88" x2="216" y2="96" stroke="currentColor" opacity="0.4"/>
  <line x1="140" y1="88" x2="216" y2="112" stroke="currentColor" opacity="0.4"/>
  <line x1="140" y1="88" x2="216" y2="128" stroke="currentColor" opacity="0.4"/>
  <text x="226" y="76" font-size="11" fill="currentColor" opacity="0.55">1,000</text>
  <text x="226" y="92" font-size="11" fill="currentColor" opacity="0.55">classes</text>
  <text x="222" y="118" font-size="14" fill="currentColor" opacity="0.4">⋮</text>

  <text x="145" y="176" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">~100 examples per class</text>
  <text x="145" y="192" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">→ 100,000 labels;</text>
  <text x="145" y="208" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">rare classes starve</text>

  <!-- divider -->
  <line x1="300" y1="34" x2="300" y2="214" stroke="currentColor" stroke-dasharray="3 3" opacity="0.3"/>

  <!-- right: hierarchical -->
  <text x="465" y="26" font-size="12" font-weight="600" fill="#e2903a" text-anchor="middle">hierarchical: two small heads</text>

  <rect x="320" y="52" width="118" height="40" rx="6" fill="none" stroke="currentColor" opacity="0.7"/>
  <text x="379" y="76" font-size="12" fill="currentColor" text-anchor="middle">coarse: 3 groups</text>

  <line x1="438" y1="72" x2="496" y2="50" stroke="#e2903a"/>
  <line x1="438" y1="72" x2="496" y2="74" stroke="currentColor" opacity="0.4"/>
  <line x1="438" y1="72" x2="496" y2="98" stroke="currentColor" opacity="0.4"/>
  <text x="502" y="54" font-size="11" font-weight="600" fill="#e2903a">electronics</text>
  <text x="502" y="78" font-size="11" fill="currentColor" opacity="0.55">fashion</text>
  <text x="502" y="102" font-size="11" fill="currentColor" opacity="0.55">pet supplies</text>

  <line x1="540" y1="58" x2="540" y2="118" stroke="#e2903a" opacity="0.6"/>
  <path d="M540 126 l-4 -8 h8 z" fill="#e2903a" opacity="0.6"/>

  <rect x="440" y="126" width="160" height="44" rx="6" fill="none" stroke="#e2903a" stroke-width="2"/>
  <text x="520" y="145" font-size="12" fill="#e2903a" text-anchor="middle">within electronics:</text>
  <text x="520" y="162" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">~300 classes</text>

  <text x="465" y="200" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">each head faces a class count</text>
  <text x="465" y="216" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">its data can feed</text>
</svg>

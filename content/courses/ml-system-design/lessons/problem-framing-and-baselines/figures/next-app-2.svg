<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="160" y="24" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor">Framing A — N-way classifier</text>
  <text x="480" y="24" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor">Framing B — (user, app) scorer</text>

  <!-- divider -->
  <line x1="320" y1="34" x2="320" y2="270" stroke="currentColor" opacity="0.2"/>

  <!-- LEFT: input -->
  <rect x="16" y="76" width="104" height="46" rx="5" fill="none" stroke="currentColor"/>
  <text x="68" y="95" font-size="12" text-anchor="middle" fill="currentColor">user +</text>
  <text x="68" y="111" font-size="12" text-anchor="middle" fill="currentColor">context</text>
  <line x1="120" y1="99" x2="146" y2="99" stroke="currentColor"/>
  <path d="M146 99 l-7 -4 v8 z" fill="currentColor"/>

  <!-- LEFT: model -->
  <rect x="148" y="72" width="64" height="54" rx="5" fill="none" stroke="currentColor"/>
  <text x="180" y="103" font-size="12" text-anchor="middle" fill="currentColor">model</text>
  <line x1="212" y1="99" x2="238" y2="99" stroke="currentColor"/>
  <path d="M238 99 l-7 -4 v8 z" fill="currentColor"/>

  <!-- LEFT: output slots A-D -->
  <rect x="240" y="46" width="64" height="24" rx="4" fill="none" stroke="currentColor"/>
  <text x="272" y="62" font-size="11" text-anchor="middle" fill="currentColor">A · 0.28</text>
  <rect x="240" y="78" width="64" height="24" rx="4" fill="none" stroke="currentColor"/>
  <text x="272" y="94" font-size="11" text-anchor="middle" fill="currentColor">B · 0.12</text>
  <rect x="240" y="110" width="64" height="24" rx="4" fill="none" stroke="currentColor"/>
  <text x="272" y="126" font-size="11" text-anchor="middle" fill="currentColor">C · 0.45</text>
  <rect x="240" y="142" width="64" height="24" rx="4" fill="none" stroke="currentColor"/>
  <text x="272" y="158" font-size="11" text-anchor="middle" fill="currentColor">D · 0.15</text>

  <!-- LEFT: new app E has no slot -->
  <rect x="240" y="174" width="64" height="24" rx="4" fill="none" stroke="#e2903a" stroke-dasharray="3 3"/>
  <text x="272" y="190" font-size="11" text-anchor="middle" fill="#e2903a">E · ?</text>

  <text x="160" y="216" font-size="11" text-anchor="middle" fill="#e2903a">app E added — no output slot exists</text>
  <text x="160" y="252" font-size="12" text-anchor="middle" fill="currentColor">catalog: A B C D E — vector is size 4</text>

  <!-- RIGHT: input -->
  <rect x="336" y="76" width="118" height="46" rx="5" fill="none" stroke="currentColor"/>
  <text x="395" y="95" font-size="12" text-anchor="middle" fill="currentColor">user + context</text>
  <text x="395" y="111" font-size="12" text-anchor="middle" fill="currentColor">+ app features</text>
  <line x1="454" y1="99" x2="480" y2="99" stroke="currentColor"/>
  <path d="M480 99 l-7 -4 v8 z" fill="currentColor"/>

  <!-- RIGHT: app chips feeding input, now with E -->
  <rect x="341" y="150" width="24" height="20" rx="4" fill="none" stroke="#4c8dd6"/>
  <text x="353" y="164" font-size="11" text-anchor="middle" fill="#4c8dd6">A</text>
  <rect x="371" y="150" width="24" height="20" rx="4" fill="none" stroke="#4c8dd6"/>
  <text x="383" y="164" font-size="11" text-anchor="middle" fill="#4c8dd6">B</text>
  <rect x="401" y="150" width="24" height="20" rx="4" fill="none" stroke="#4c8dd6"/>
  <text x="413" y="164" font-size="11" text-anchor="middle" fill="#4c8dd6">C</text>
  <rect x="431" y="150" width="24" height="20" rx="4" fill="none" stroke="#4c8dd6"/>
  <text x="443" y="164" font-size="11" text-anchor="middle" fill="#4c8dd6">D</text>
  <rect x="461" y="150" width="24" height="20" rx="4" fill="none" stroke="#e2903a"/>
  <text x="473" y="164" font-size="11" text-anchor="middle" fill="#e2903a">E</text>
  <line x1="395" y1="150" x2="395" y2="126" stroke="#4c8dd6"/>
  <path d="M395 126 l-4 7 h8 z" fill="#4c8dd6"/>
  <text x="395" y="186" font-size="11" text-anchor="middle" fill="#4c8dd6">one row per app</text>

  <!-- RIGHT: model + score -->
  <rect x="482" y="72" width="64" height="54" rx="5" fill="none" stroke="currentColor"/>
  <text x="514" y="103" font-size="12" text-anchor="middle" fill="currentColor">model</text>
  <line x1="546" y1="99" x2="572" y2="99" stroke="currentColor"/>
  <path d="M572 99 l-7 -4 v8 z" fill="currentColor"/>
  <rect x="574" y="82" width="54" height="34" rx="4" fill="none" stroke="currentColor"/>
  <text x="601" y="99" font-size="11" text-anchor="middle" fill="currentColor">score</text>
  <text x="601" y="112" font-size="11" text-anchor="middle" fill="currentColor">0…1</text>

  <text x="480" y="216" font-size="11" text-anchor="middle" fill="#e2903a">app E added — one more input row</text>
  <text x="480" y="252" font-size="12" text-anchor="middle" fill="currentColor">catalog is an input, not a dimension</text>
</svg>

<svg viewBox="0 0 560 290" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- vertical axis: causal distance -->
  <line x1="48" y1="252" x2="48" y2="44" stroke="currentColor" opacity="0.5"/>
  <path d="M48 44 l-4 8 h8 z" fill="currentColor" opacity="0.5"/>
  <text x="34" y="150" font-size="11" fill="currentColor" opacity="0.55" transform="rotate(-90 34 150)" text-anchor="middle">causal distance from one prediction</text>

  <!-- top tier: true objectives -->
  <rect x="80" y="36" width="400" height="60" rx="6" fill="none" stroke="currentColor" stroke-dasharray="3 3" opacity="0.6"/>
  <text x="96" y="58" font-size="12" font-weight="600" fill="currentColor">True objectives — never in a log</text>
  <text x="96" y="78" font-size="11" fill="currentColor" opacity="0.55">is the user happy? · is the product improving their life?</text>
  <text x="496" y="70" font-size="11" fill="currentColor" opacity="0.55">judge</text>

  <!-- middle tier: indirect effects -->
  <rect x="80" y="112" width="400" height="60" rx="6" fill="none" stroke="#4c8dd6"/>
  <text x="96" y="134" font-size="12" font-weight="600" fill="#4c8dd6">Indirect effects — A/B metrics only</text>
  <text x="96" y="154" font-size="11" fill="currentColor" opacity="0.55">returned next day · time on site · daily active users</text>
  <text x="496" y="146" font-size="11" fill="#4c8dd6">evaluate</text>

  <!-- bottom tier: trainable -->
  <rect x="80" y="188" width="400" height="60" rx="6" fill="none" stroke="#5aa46a" stroke-width="2"/>
  <text x="96" y="210" font-size="12" font-weight="600" fill="#5aa46a">Observed and attributable — training objectives</text>
  <text x="96" y="230" font-size="11" fill="currentColor" opacity="0.55">clicked this link? · downloaded this app? · marked as spam?</text>
  <text x="496" y="222" font-size="11" fill="#5aa46a">train</text>

  <text x="280" y="276" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.55">each event in the bottom tier names the prediction that caused it</text>
</svg>

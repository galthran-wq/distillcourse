<svg viewBox="0 0 620 190" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- business request -->
  <rect x="12" y="58" width="128" height="58" rx="6" fill="none" stroke="currentColor" opacity="0.7"/>
  <text x="76" y="82" font-size="12" font-weight="600" fill="currentColor" text-anchor="middle">business request</text>
  <text x="76" y="102" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">"make support faster"</text>

  <!-- arrow 1: problem space -->
  <line x1="140" y1="87" x2="222" y2="87" stroke="currentColor" opacity="0.5"/>
  <path d="M230 87 l-8 -4 v8 z" fill="currentColor" opacity="0.5"/>
  <text x="184" y="46" font-size="11" font-weight="600" fill="#e2903a" text-anchor="middle">1 · problem space</text>
  <text x="184" y="134" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">what breaks?</text>
  <text x="184" y="150" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">why? for whom?</text>
  <text x="184" y="166" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">what counts as fixed?</text>

  <!-- framing -->
  <rect x="230" y="52" width="160" height="70" rx="6" fill="none" stroke="#e2903a" stroke-width="2"/>
  <text x="310" y="78" font-size="12" font-weight="600" fill="#e2903a" text-anchor="middle">framing</text>
  <text x="310" y="100" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">input · output · objective</text>

  <!-- arrow 2: solution space -->
  <line x1="390" y1="87" x2="472" y2="87" stroke="currentColor" opacity="0.5"/>
  <path d="M480 87 l-8 -4 v8 z" fill="currentColor" opacity="0.5"/>
  <text x="434" y="46" font-size="11" font-weight="600" fill="#4c8dd6" text-anchor="middle">2 · solution space</text>
  <text x="434" y="134" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">which classifier?</text>
  <text x="434" y="150" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">which library? which API?</text>

  <!-- system -->
  <rect x="480" y="58" width="128" height="58" rx="6" fill="none" stroke="currentColor" opacity="0.7"/>
  <text x="544" y="82" font-size="12" font-weight="600" fill="currentColor" text-anchor="middle">working system</text>
  <text x="544" y="102" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">requests routed</text>
</svg>

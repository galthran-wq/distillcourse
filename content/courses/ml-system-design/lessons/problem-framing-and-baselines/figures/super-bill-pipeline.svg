<svg viewBox="0 0 640 230" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- receipt string -->
  <rect x="10" y="52" width="112" height="52" rx="6" fill="none" stroke="currentColor" opacity="0.7"/>
  <text x="66" y="74" font-size="12" font-weight="600" fill="currentColor" text-anchor="middle">receipt string</text>
  <text x="66" y="93" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">"M. bar small"</text>

  <line x1="122" y1="78" x2="150" y2="78" stroke="currentColor" opacity="0.5"/>
  <path d="M158 78 l-8 -4 v8 z" fill="currentColor" opacity="0.5"/>

  <!-- Zipf-head lookup -->
  <rect x="158" y="46" width="160" height="64" rx="6" fill="none" stroke="#e2903a" stroke-width="2"/>
  <text x="238" y="68" font-size="12" font-weight="600" fill="#e2903a" text-anchor="middle">popular-name table</text>
  <text x="238" y="86" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">top pairs hand-labeled</text>
  <text x="238" y="101" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">once (Zipf head)</text>

  <!-- hit path -->
  <line x1="318" y1="78" x2="470" y2="78" stroke="#5aa46a"/>
  <path d="M478 78 l-8 -4 v8 z" fill="#5aa46a"/>
  <text x="396" y="68" font-size="11" fill="#5aa46a" text-anchor="middle">hit — most receipts</text>

  <!-- matched product -->
  <rect x="478" y="52" width="150" height="52" rx="6" fill="none" stroke="#5aa46a" stroke-width="2"/>
  <text x="553" y="74" font-size="12" font-weight="600" fill="#5aa46a" text-anchor="middle">matched product</text>
  <text x="553" y="93" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">"Mars bar small"</text>

  <!-- miss path down -->
  <line x1="238" y1="110" x2="238" y2="146" stroke="currentColor" opacity="0.5"/>
  <path d="M238 154 l-4 -8 h8 z" fill="currentColor" opacity="0.5"/>
  <text x="252" y="136" font-size="11" fill="currentColor" opacity="0.55">miss</text>

  <!-- tail stages -->
  <rect x="158" y="154" width="160" height="44" rx="6" fill="none" stroke="currentColor" opacity="0.7"/>
  <text x="238" y="173" font-size="12" fill="currentColor" text-anchor="middle">brand + category</text>
  <text x="238" y="190" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">narrow the candidates</text>

  <line x1="318" y1="176" x2="336" y2="176" stroke="currentColor" opacity="0.5"/>
  <path d="M344 176 l-8 -4 v8 z" fill="currentColor" opacity="0.5"/>

  <rect x="344" y="154" width="120" height="44" rx="6" fill="none" stroke="currentColor" opacity="0.7"/>
  <text x="404" y="173" font-size="12" fill="currentColor" text-anchor="middle">Levenshtein</text>
  <text x="404" y="190" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">rank by edit distance</text>

  <line x1="464" y1="176" x2="482" y2="176" stroke="currentColor" opacity="0.5"/>
  <path d="M490 176 l-8 -4 v8 z" fill="currentColor" opacity="0.5"/>

  <rect x="490" y="154" width="110" height="44" rx="6" fill="none" stroke="currentColor" opacity="0.7"/>
  <text x="545" y="173" font-size="12" fill="currentColor" text-anchor="middle">crowd verify</text>
  <text x="545" y="190" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">human check</text>

  <!-- verified back up to match -->
  <line x1="600" y1="176" x2="616" y2="176" stroke="#5aa46a" opacity="0.8"/>
  <line x1="616" y1="176" x2="616" y2="112" stroke="#5aa46a" opacity="0.8"/>
  <path d="M616 104 l-4 8 h8 z" fill="#5aa46a" opacity="0.8"/>

  <text x="66" y="200" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">no trained model</text>
  <text x="66" y="216" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">in the loop</text>
</svg>

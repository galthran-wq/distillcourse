<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <marker id="cdc-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e2903a"/>
    </marker>
    <marker id="cdc-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- leader database -->
  <rect x="20" y="115" width="130" height="56" rx="5" fill="none" stroke="currentColor" stroke-width="1.6"/>
  <text x="85" y="138" font-size="12" font-weight="bold" fill="currentColor" text-anchor="middle">OLTP database</text>
  <text x="85" y="156" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">the leader</text>

  <!-- writes in -->
  <line x1="20" y1="143" x2="4" y2="143" stroke="currentColor" opacity="0.5"/>
  <text x="12" y="108" font-size="10" fill="currentColor" opacity="0.55">app writes</text>
  <line x1="40" y1="98" x2="55" y2="113" stroke="currentColor" stroke-width="1.2" opacity="0.5" marker-end="url(#cdc-c)"/>

  <!-- arrow to change log -->
  <line x1="150" y1="143" x2="196" y2="143" stroke="#e2903a" stroke-width="2" marker-end="url(#cdc-a)"/>

  <!-- change log strip -->
  <text x="288" y="106" font-size="11" fill="#e2903a" text-anchor="middle">change log: every commit, in commit order</text>
  <g font-size="10" text-anchor="middle">
    <rect x="200" y="118" width="36" height="26" fill="none" stroke="#e2903a"/>
    <text x="218" y="135" fill="#e2903a">0</text>
    <rect x="236" y="118" width="36" height="26" fill="none" stroke="#e2903a"/>
    <text x="254" y="135" fill="#e2903a">1</text>
    <rect x="272" y="118" width="36" height="26" fill="none" stroke="#e2903a"/>
    <text x="290" y="135" fill="#e2903a">2</text>
    <rect x="308" y="118" width="36" height="26" fill="none" stroke="#e2903a"/>
    <text x="326" y="135" fill="#e2903a">3</text>
    <rect x="344" y="118" width="36" height="26" fill="none" stroke="#e2903a" stroke-dasharray="3 3"/>
    <text x="362" y="135" fill="#e2903a">4</text>
  </g>
  <text x="272" y="162" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">via a log-based broker</text>

  <!-- fan-out arrows to followers -->
  <g stroke="#e2903a" stroke-width="1.5">
    <line x1="382" y1="126" x2="446" y2="62" marker-end="url(#cdc-a)"/>
    <line x1="382" y1="133" x2="446" y2="124" marker-end="url(#cdc-a)"/>
    <line x1="382" y1="146" x2="446" y2="188" marker-end="url(#cdc-a)"/>
    <line x1="382" y1="152" x2="446" y2="250" marker-end="url(#cdc-a)"/>
  </g>

  <!-- follower boxes -->
  <g font-size="11" text-anchor="middle">
    <rect x="450" y="42" width="165" height="34" rx="4" fill="none" stroke="currentColor"/>
    <text x="532" y="63" fill="currentColor">search index</text>
    <rect x="450" y="106" width="165" height="34" rx="4" fill="none" stroke="currentColor"/>
    <text x="532" y="127" fill="currentColor">cache</text>
    <rect x="450" y="170" width="165" height="34" rx="4" fill="none" stroke="currentColor"/>
    <text x="532" y="191" fill="currentColor">warehouse</text>
    <rect x="450" y="234" width="165" height="34" rx="4" fill="none" stroke="#4c8dd6" stroke-width="1.6"/>
    <text x="532" y="255" fill="#4c8dd6">online feature store</text>
  </g>
  <text x="532" y="290" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">followers: same changes, same order</text>
</svg>

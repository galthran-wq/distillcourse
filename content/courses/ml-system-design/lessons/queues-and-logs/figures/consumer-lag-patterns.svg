<svg viewBox="0 0 640 250" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- legend -->
  <g font-size="11">
    <line x1="180" y1="18" x2="208" y2="18" stroke="#4c8dd6" stroke-width="2"/>
    <text x="214" y="22" fill="currentColor">log head</text>
    <line x1="300" y1="18" x2="328" y2="18" stroke="#e2903a" stroke-width="2"/>
    <text x="334" y="22" fill="currentColor">committed offset, one line per partition</text>
  </g>

  <!-- panel 1: frozen on all -->
  <g>
    <text x="105" y="52" font-size="11" font-weight="bold" fill="currentColor" text-anchor="middle">frozen on all partitions</text>
    <line x1="15" y1="205" x2="195" y2="205" stroke="currentColor" opacity="0.55"/>
    <line x1="15" y1="205" x2="15" y2="62" stroke="currentColor" opacity="0.55"/>
    <text x="195" y="220" font-size="10" fill="currentColor" opacity="0.55" text-anchor="end">time</text>
    <text x="24" y="74" font-size="10" fill="currentColor" opacity="0.55">offset</text>
    <line x1="25" y1="195" x2="185" y2="85" stroke="#4c8dd6" stroke-width="2"/>
    <path d="M 25 195 L 65 167 L 185 167" fill="none" stroke="#e2903a" stroke-width="2"/>
    <path d="M 25 199 L 65 173 L 185 173" fill="none" stroke="#e2903a" stroke-width="2" opacity="0.7"/>
    <path d="M 25 203 L 65 179 L 185 179" fill="none" stroke="#e2903a" stroke-width="2" opacity="0.45"/>
    <line x1="65" y1="205" x2="65" y2="160" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5"/>
    <text x="68" y="155" font-size="10" fill="currentColor" opacity="0.55">stops here</text>
  </g>

  <!-- panel 2: frozen on one -->
  <g>
    <text x="320" y="52" font-size="11" font-weight="bold" fill="currentColor" text-anchor="middle">frozen on one partition</text>
    <line x1="230" y1="205" x2="410" y2="205" stroke="currentColor" opacity="0.55"/>
    <line x1="230" y1="205" x2="230" y2="62" stroke="currentColor" opacity="0.55"/>
    <text x="410" y="220" font-size="10" fill="currentColor" opacity="0.55" text-anchor="end">time</text>
    <line x1="240" y1="195" x2="400" y2="85" stroke="#4c8dd6" stroke-width="2"/>
    <path d="M 240 197 L 400 91" fill="none" stroke="#e2903a" stroke-width="2"/>
    <path d="M 240 201 L 400 97" fill="none" stroke="#e2903a" stroke-width="2" opacity="0.7"/>
    <path d="M 240 203 L 290 169 L 400 169" fill="none" stroke="#e2903a" stroke-width="2" opacity="0.45"/>
    <line x1="290" y1="205" x2="290" y2="164" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5"/>
    <text x="294" y="160" font-size="10" fill="currentColor" opacity="0.55">one stuck offset</text>
  </g>

  <!-- panel 3: advancing but slower -->
  <g>
    <text x="535" y="52" font-size="11" font-weight="bold" fill="currentColor" text-anchor="middle">advancing, slower than the head</text>
    <line x1="445" y1="205" x2="625" y2="205" stroke="currentColor" opacity="0.55"/>
    <line x1="445" y1="205" x2="445" y2="62" stroke="currentColor" opacity="0.55"/>
    <text x="625" y="220" font-size="10" fill="currentColor" opacity="0.55" text-anchor="end">time</text>
    <line x1="455" y1="195" x2="615" y2="85" stroke="#4c8dd6" stroke-width="2"/>
    <path d="M 455 195 L 615 138" fill="none" stroke="#e2903a" stroke-width="2"/>
    <path d="M 455 199 L 615 144" fill="none" stroke="#e2903a" stroke-width="2" opacity="0.7"/>
    <path d="M 455 203 L 615 150" fill="none" stroke="#e2903a" stroke-width="2" opacity="0.45"/>
    <line x1="605" y1="92" x2="605" y2="134" stroke="currentColor" opacity="0.6"/>
    <line x1="601" y1="96" x2="605" y2="92" stroke="currentColor" opacity="0.6"/>
    <line x1="609" y1="96" x2="605" y2="92" stroke="currentColor" opacity="0.6"/>
    <line x1="601" y1="130" x2="605" y2="134" stroke="currentColor" opacity="0.6"/>
    <line x1="609" y1="130" x2="605" y2="134" stroke="currentColor" opacity="0.6"/>
    <text x="597" y="117" font-size="10" fill="currentColor" opacity="0.7" text-anchor="end">lag grows</text>
  </g>
</svg>

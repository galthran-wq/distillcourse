<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <marker id="dw4-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4c8dd6"/>
    </marker>
    <marker id="dw4-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e2903a"/>
    </marker>
  </defs>

  <rect x="30" y="55" width="120" height="30" rx="4" fill="none" stroke="#4c8dd6"/>
  <text x="90" y="74" font-size="11" fill="#4c8dd6" text-anchor="middle">client 1: set X=A</text>
  <rect x="30" y="175" width="120" height="30" rx="4" fill="none" stroke="#e2903a"/>
  <text x="90" y="194" font-size="11" fill="#e2903a" text-anchor="middle">client 2: set X=B</text>

  <rect x="450" y="45" width="160" height="50" rx="4" fill="none" stroke="#e2903a" stroke-width="1.8"/>
  <text x="530" y="64" font-size="11" fill="currentColor" text-anchor="middle">database &#183; saw A, then B</text>
  <text x="530" y="84" font-size="13" font-weight="bold" fill="#e2903a" text-anchor="middle">X = B</text>

  <rect x="450" y="175" width="160" height="50" rx="4" fill="none" stroke="#4c8dd6" stroke-width="1.8"/>
  <text x="530" y="194" font-size="11" fill="currentColor" text-anchor="middle">index &#183; saw B, then A</text>
  <text x="530" y="214" font-size="13" font-weight="bold" fill="#4c8dd6" text-anchor="middle">X = A</text>

  <line x1="152" y1="66" x2="446" y2="62" stroke="#4c8dd6" stroke-width="1.4" opacity="0.4" marker-end="url(#dw4-b)"/>
  <line x1="152" y1="183" x2="446" y2="90" stroke="#e2903a" stroke-width="1.4" opacity="0.4" marker-end="url(#dw4-a)"/>
  <line x1="152" y1="196" x2="446" y2="196" stroke="#e2903a" stroke-width="1.4" opacity="0.4" marker-end="url(#dw4-a)"/>
  <line x1="152" y1="80" x2="446" y2="186" stroke="#4c8dd6" stroke-width="2" marker-end="url(#dw4-b)"/>
  <text x="290" y="145" font-size="10" fill="#4c8dd6" text-anchor="middle">4: write X=A to index (delayed)</text>

  <text x="320" y="250" font-size="11" font-weight="bold" fill="currentColor" text-anchor="middle">all four writes succeeded &#8212; the stores disagree permanently, and no error was raised</text>

<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <marker id="mvb-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/>
    </marker>
    <marker id="mvb-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e2903a"/>
    </marker>
  </defs>

  <!-- left panel: request mesh -->
  <text x="155" y="22" font-size="12" font-weight="bold" fill="currentColor" text-anchor="middle">request-driven</text>

  <!-- arrows between all pairs (drawn under boxes) -->
  <g stroke="currentColor" stroke-width="1.2" opacity="0.6">
    <line x1="115" y1="70" x2="195" y2="70" marker-start="url(#mvb-c)" marker-end="url(#mvb-c)"/>
    <line x1="115" y1="215" x2="195" y2="215" marker-start="url(#mvb-c)" marker-end="url(#mvb-c)"/>
    <line x1="72" y1="85" x2="72" y2="200" marker-start="url(#mvb-c)" marker-end="url(#mvb-c)"/>
    <line x1="238" y1="85" x2="238" y2="200" marker-start="url(#mvb-c)" marker-end="url(#mvb-c)"/>
    <line x1="105" y1="85" x2="205" y2="200" marker-start="url(#mvb-c)" marker-end="url(#mvb-c)"/>
    <line x1="205" y1="85" x2="105" y2="200" marker-start="url(#mvb-c)" marker-end="url(#mvb-c)"/>
  </g>

  <g fill="none" stroke="currentColor">
    <rect x="30" y="55" width="85" height="30" rx="4"/>
    <rect x="195" y="55" width="85" height="30" rx="4"/>
    <rect x="30" y="200" width="85" height="30" rx="4"/>
    <rect x="195" y="200" width="85" height="30" rx="4"/>
  </g>
  <g font-size="11" fill="currentColor" text-anchor="middle">
    <text x="72" y="74">drivers</text>
    <text x="238" y="74">rides</text>
    <text x="72" y="219">pricing</text>
    <text x="238" y="219">alerts</text>
  </g>
  <text x="155" y="272" font-size="12" fill="currentColor" text-anchor="middle">4 services &#183; 12 request paths</text>
  <text x="155" y="290" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">each call needs its callee up, now</text>

  <!-- divider -->
  <line x1="320" y1="16" x2="320" y2="288" stroke="currentColor" opacity="0.25" stroke-dasharray="3 3"/>

  <!-- right panel: broker -->
  <text x="485" y="22" font-size="12" font-weight="bold" fill="currentColor" text-anchor="middle">broker-mediated</text>

  <g stroke="#e2903a" stroke-width="1.4">
    <line x1="402" y1="85" x2="440" y2="130" marker-end="url(#mvb-a)"/>
    <line x1="568" y1="85" x2="530" y2="130" marker-end="url(#mvb-a)"/>
    <line x1="440" y1="165" x2="402" y2="200" marker-end="url(#mvb-a)"/>
    <line x1="530" y1="165" x2="568" y2="200" marker-end="url(#mvb-a)"/>
  </g>

  <g fill="none" stroke="currentColor">
    <rect x="360" y="55" width="85" height="30" rx="4"/>
    <rect x="525" y="55" width="85" height="30" rx="4"/>
    <rect x="360" y="200" width="85" height="30" rx="4"/>
    <rect x="525" y="200" width="85" height="30" rx="4"/>
  </g>
  <rect x="400" y="132" width="170" height="32" rx="5" fill="none" stroke="#e2903a" stroke-width="1.8"/>
  <text x="485" y="152" font-size="12" font-weight="bold" fill="#e2903a" text-anchor="middle">broker (topics)</text>

  <g font-size="11" fill="currentColor" text-anchor="middle">
    <text x="402" y="74">drivers</text>
    <text x="568" y="74">rides</text>
    <text x="402" y="219">pricing</text>
    <text x="568" y="219">alerts</text>
  </g>
  <text x="485" y="272" font-size="12" fill="#e2903a" text-anchor="middle">4 services &#183; 4 connections</text>
  <text x="485" y="290" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">producers name topics, never recipients</text>
</svg>

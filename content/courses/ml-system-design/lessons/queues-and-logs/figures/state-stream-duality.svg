<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <marker id="ssd-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e2903a"/>
    </marker>
  </defs>

  <!-- left: stream to table -->
  <text x="170" y="24" font-size="12" font-weight="bold" fill="currentColor" text-anchor="middle">change stream (append order &#8594;)</text>
  <g font-size="11" text-anchor="middle">
    <rect x="30" y="40" width="70" height="28" rx="3" fill="none" stroke="currentColor"/>
    <text x="65" y="58" fill="currentColor">k1 &#8592; A</text>
    <rect x="104" y="40" width="70" height="28" rx="3" fill="none" stroke="currentColor"/>
    <text x="139" y="58" fill="currentColor">k2 &#8592; B</text>
    <rect x="178" y="40" width="70" height="28" rx="3" fill="none" stroke="#4c8dd6"/>
    <text x="213" y="58" fill="#4c8dd6">k1 &#8592; C</text>
    <rect x="252" y="40" width="70" height="28" rx="3" fill="none" stroke="#4c8dd6"/>
    <text x="287" y="58" fill="#4c8dd6">k2 &#8592; D</text>
  </g>
  <g font-size="9" fill="currentColor" opacity="0.5" text-anchor="middle">
    <text x="65" y="82">offset 0</text><text x="139" y="82">1</text><text x="213" y="82">2</text><text x="287" y="82">3</text>
  </g>

  <line x1="170" y1="92" x2="170" y2="146" stroke="#e2903a" stroke-width="2" marker-end="url(#ssd-a)"/>
  <text x="182" y="122" font-size="11" fill="#e2903a">apply in order = integrate</text>

  <!-- table -->
  <g font-size="11" text-anchor="middle">
    <rect x="95" y="152" width="150" height="28" fill="none" stroke="#4c8dd6"/>
    <line x1="170" y1="152" x2="170" y2="208" stroke="#4c8dd6"/>
    <rect x="95" y="180" width="150" height="28" fill="none" stroke="#4c8dd6"/>
    <text x="132" y="170" fill="currentColor">k1</text><text x="207" y="170" fill="#4c8dd6">C</text>
    <text x="132" y="198" fill="currentColor">k2</text><text x="207" y="198" fill="#4c8dd6">D</text>
  </g>
  <text x="170" y="232" font-size="11" fill="currentColor" text-anchor="middle">table: the latest value per key</text>

  <!-- divider -->
  <line x1="352" y1="16" x2="352" y2="284" stroke="currentColor" opacity="0.25" stroke-dasharray="3 3"/>

  <!-- right: compaction -->
  <text x="498" y="24" font-size="12" font-weight="bold" fill="currentColor" text-anchor="middle">log compaction</text>
  <g font-size="11" text-anchor="middle">
    <rect x="380" y="40" width="70" height="28" rx="3" fill="none" stroke="currentColor" opacity="0.3" stroke-dasharray="3 3"/>
    <text x="415" y="58" fill="currentColor" opacity="0.35">k1 &#8592; A</text>
    <rect x="454" y="40" width="70" height="28" rx="3" fill="none" stroke="currentColor" opacity="0.3" stroke-dasharray="3 3"/>
    <text x="489" y="58" fill="currentColor" opacity="0.35">k2 &#8592; B</text>
    <rect x="528" y="40" width="70" height="28" rx="3" fill="none" stroke="#e2903a"/>
    <text x="563" y="58" fill="#e2903a">k1 &#8592; C</text>
    <rect x="380" y="88" width="70" height="28" rx="3" fill="none" stroke="#e2903a"/>
    <text x="415" y="106" fill="#e2903a">k2 &#8592; D</text>
  </g>
  <line x1="386" y1="54" x2="444" y2="54" stroke="currentColor" opacity="0.45"/>
  <line x1="460" y1="54" x2="518" y2="54" stroke="currentColor" opacity="0.45"/>
  <text x="498" y="146" font-size="11" fill="currentColor" text-anchor="middle">superseded writes discarded;</text>
  <text x="498" y="162" font-size="11" fill="currentColor" text-anchor="middle">the latest write per key is kept</text>
  <text x="498" y="196" font-size="11" fill="#e2903a" text-anchor="middle">the compacted log contains the table:</text>
  <text x="498" y="212" font-size="11" fill="#e2903a" text-anchor="middle">rebuild any follower from offset 0</text>
  <text x="498" y="244" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">size tracks live keys, not write history &#8212;</text>
  <text x="498" y="258" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">so it can be kept forever</text>
</svg>

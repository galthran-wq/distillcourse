<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <marker id="tbf-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/>
    </marker>
    <marker id="tbf-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e2903a"/>
    </marker>
    <marker id="tbf-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4c8dd6"/>
    </marker>
    <marker id="tbf-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5aa46a"/>
    </marker>
  </defs>

  <!-- left panel: ack-and-delete -->
  <text x="150" y="22" font-size="12" font-weight="bold" fill="currentColor" text-anchor="middle">ack-and-delete queue</text>

  <!-- queue cells m1..m5 -->
  <g font-size="11" text-anchor="middle">
    <rect x="25" y="48" width="42" height="26" rx="4" fill="none" stroke="currentColor" opacity="0.3" stroke-dasharray="3 3"/>
    <text x="46" y="65" fill="currentColor" opacity="0.35">m1</text>
    <rect x="73" y="48" width="42" height="26" rx="4" fill="none" stroke="currentColor" opacity="0.3" stroke-dasharray="3 3"/>
    <text x="94" y="65" fill="currentColor" opacity="0.35">m2</text>
    <rect x="121" y="48" width="42" height="26" rx="4" fill="none" stroke="#e2903a"/>
    <text x="142" y="65" fill="#e2903a">m3</text>
    <rect x="169" y="48" width="42" height="26" rx="4" fill="none" stroke="currentColor"/>
    <text x="190" y="65" fill="currentColor">m4</text>
    <rect x="217" y="48" width="42" height="26" rx="4" fill="none" stroke="currentColor"/>
    <text x="238" y="65" fill="currentColor">m5</text>
  </g>
  <text x="70" y="94" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">acked &#8594; deleted</text>

  <!-- delivery arrows -->
  <line x1="190" y1="74" x2="105" y2="185" stroke="currentColor" stroke-width="1.4" marker-end="url(#tbf-c)"/>
  <line x1="142" y1="74" x2="208" y2="185" stroke="currentColor" stroke-width="1.4" marker-end="url(#tbf-c)"/>
  <line x1="150" y1="80" x2="95" y2="190" stroke="#e2903a" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#tbf-a)"/>
  <text x="255" y="140" font-size="10" fill="#e2903a">m3 redelivered</text>
  <text x="255" y="153" font-size="10" fill="#e2903a">after crash</text>

  <!-- consumers -->
  <rect x="45" y="190" width="105" height="30" rx="4" fill="none" stroke="currentColor"/>
  <text x="97" y="209" font-size="11" fill="currentColor" text-anchor="middle">consumer 1</text>
  <rect x="165" y="190" width="105" height="30" rx="4" fill="none" stroke="currentColor"/>
  <text x="217" y="209" font-size="11" fill="currentColor" text-anchor="middle">consumer 2 &#10007;</text>

  <text x="150" y="255" font-size="12" fill="#e2903a" text-anchor="middle">consumer 1 processes m4, then m3</text>
  <text x="150" y="272" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">load balancing + redelivery = order lost</text>

  <!-- divider -->
  <line x1="320" y1="16" x2="320" y2="324" stroke="currentColor" opacity="0.25" stroke-dasharray="3 3"/>

  <!-- right panel: partitioned log -->
  <text x="482" y="22" font-size="12" font-weight="bold" fill="currentColor" text-anchor="middle">partitioned log</text>

  <text x="345" y="60" font-size="10" fill="currentColor" opacity="0.55">partition 0</text>
  <g font-size="11" text-anchor="middle">
    <rect x="340" y="68" width="30" height="26" fill="none" stroke="currentColor"/>
    <text x="355" y="85" fill="currentColor">0</text>
    <rect x="370" y="68" width="30" height="26" fill="none" stroke="currentColor"/>
    <text x="385" y="85" fill="currentColor">1</text>
    <rect x="400" y="68" width="30" height="26" fill="none" stroke="currentColor"/>
    <text x="415" y="85" fill="currentColor">2</text>
    <rect x="430" y="68" width="30" height="26" fill="none" stroke="currentColor"/>
    <text x="445" y="85" fill="currentColor">3</text>
    <rect x="460" y="68" width="30" height="26" fill="none" stroke="currentColor"/>
    <text x="475" y="85" fill="currentColor">4</text>
    <rect x="490" y="68" width="30" height="26" fill="none" stroke="currentColor"/>
    <text x="505" y="85" fill="currentColor">5</text>
    <rect x="520" y="68" width="30" height="26" fill="none" stroke="currentColor"/>
    <text x="535" y="85" fill="currentColor">6</text>
    <rect x="550" y="68" width="30" height="26" fill="none" stroke="#e2903a" stroke-dasharray="3 3"/>
    <text x="565" y="85" fill="#e2903a">7</text>
  </g>
  <line x1="584" y1="81" x2="618" y2="81" stroke="#e2903a" stroke-width="1.6" marker-end="url(#tbf-a)"/>
  <text x="600" y="70" font-size="10" fill="#e2903a" text-anchor="middle">append</text>

  <!-- second, muted partition -->
  <text x="345" y="118" font-size="10" fill="currentColor" opacity="0.4">partition 1</text>
  <g fill="none" stroke="currentColor" opacity="0.25">
    <rect x="340" y="126" width="30" height="20"/><rect x="370" y="126" width="30" height="20"/>
    <rect x="400" y="126" width="30" height="20"/><rect x="430" y="126" width="30" height="20"/>
    <rect x="460" y="126" width="30" height="20"/>
  </g>
  <text x="510" y="140" font-size="10" fill="currentColor" opacity="0.4">&#8230; its own offsets</text>

  <!-- consumer group pointers -->
  <line x1="565" y1="200" x2="565" y2="98" stroke="#4c8dd6" stroke-width="1.6" marker-end="url(#tbf-b)"/>
  <text x="565" y="216" font-size="11" fill="#4c8dd6" text-anchor="middle">group A @ offset 7</text>
  <line x1="445" y1="235" x2="445" y2="98" stroke="#5aa46a" stroke-width="1.6" marker-end="url(#tbf-g)"/>
  <text x="445" y="251" font-size="11" fill="#5aa46a" text-anchor="middle">group B @ offset 3</text>

  <text x="482" y="290" font-size="12" fill="currentColor" text-anchor="middle">reads delete nothing; a group is just its offsets</text>
  <text x="482" y="307" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">total order within a partition, none across</text>
</svg>

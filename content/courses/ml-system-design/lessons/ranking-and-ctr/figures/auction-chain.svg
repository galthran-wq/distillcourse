<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- row 1: as predicted -->
  <text x="20" y="30" font-size="12.5" font-weight="600" fill="currentColor">as predicted</text>

  <g font-size="12">
    <rect x="20" y="44" width="130" height="32" rx="4" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="85" y="64" text-anchor="middle" fill="currentColor">ad X · P̂ = <tspan fill="#e2903a" font-weight="600">0.31</tspan></text>
    <line x1="150" y1="60" x2="186" y2="60" stroke="currentColor" stroke-width="1" opacity="0.5"/>
    <rect x="186" y="44" width="110" height="32" rx="4" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="241" y="64" text-anchor="middle" fill="currentColor">× bid $1.00</text>
    <line x1="296" y1="60" x2="332" y2="60" stroke="currentColor" stroke-width="1" opacity="0.5"/>
    <rect x="332" y="44" width="140" height="32" rx="4" fill="#e2903a" fill-opacity="0.12" stroke="#e2903a" stroke-width="1.4"/>
    <text x="402" y="64" text-anchor="middle" fill="currentColor" font-weight="600">E[value] $0.310</text>
    <text x="545" y="64" font-size="11.5" fill="#e2903a" font-weight="600">← wins the auction</text>

    <rect x="20" y="88" width="130" height="32" rx="4" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="85" y="108" text-anchor="middle" fill="currentColor">ad Y · P̂ = 0.22</text>
    <line x1="150" y1="104" x2="186" y2="104" stroke="currentColor" stroke-width="1" opacity="0.5"/>
    <rect x="186" y="88" width="110" height="32" rx="4" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="241" y="108" text-anchor="middle" fill="currentColor">× bid $1.30</text>
    <line x1="296" y1="104" x2="332" y2="104" stroke="currentColor" stroke-width="1" opacity="0.5"/>
    <rect x="332" y="88" width="140" height="32" rx="4" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="402" y="108" text-anchor="middle" fill="currentColor">E[value] $0.286</text>
  </g>

  <!-- middle: the calibration finding -->
  <line x1="20" y1="146" x2="620" y2="146" stroke="currentColor" stroke-width="1" stroke-dasharray="3 3" opacity="0.5"/>
  <text x="320" y="166" font-size="11.5" text-anchor="middle" fill="#4c8dd6">the reliability curve says: predictions near 0.31 actually click 25% of the time — X is over-confident; Y is calibrated</text>

  <!-- row 2: honest probabilities -->
  <text x="20" y="196" font-size="12.5" font-weight="600" fill="currentColor">with honest probabilities</text>

  <g font-size="12">
    <rect x="20" y="210" width="130" height="32" rx="4" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="85" y="230" text-anchor="middle" fill="currentColor">ad X · P = <tspan fill="#4c8dd6" font-weight="600">0.25</tspan></text>
    <line x1="150" y1="226" x2="186" y2="226" stroke="currentColor" stroke-width="1" opacity="0.5"/>
    <rect x="186" y="210" width="110" height="32" rx="4" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="241" y="230" text-anchor="middle" fill="currentColor">× bid $1.00</text>
    <line x1="296" y1="226" x2="332" y2="226" stroke="currentColor" stroke-width="1" opacity="0.5"/>
    <rect x="332" y="210" width="140" height="32" rx="4" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="402" y="230" text-anchor="middle" fill="currentColor">E[value] $0.250</text>

    <rect x="20" y="254" width="130" height="32" rx="4" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="85" y="274" text-anchor="middle" fill="currentColor">ad Y · P = 0.22</text>
    <line x1="150" y1="270" x2="186" y2="270" stroke="currentColor" stroke-width="1" opacity="0.5"/>
    <rect x="186" y="254" width="110" height="32" rx="4" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="241" y="274" text-anchor="middle" fill="currentColor">× bid $1.30</text>
    <line x1="296" y1="270" x2="332" y2="270" stroke="currentColor" stroke-width="1" opacity="0.5"/>
    <rect x="332" y="254" width="140" height="32" rx="4" fill="#5aa46a" fill-opacity="0.12" stroke="#5aa46a" stroke-width="1.4"/>
    <text x="402" y="274" text-anchor="middle" fill="currentColor" font-weight="600">E[value] $0.286</text>
    <text x="545" y="274" font-size="11.5" fill="#5aa46a" font-weight="600">← true winner</text>
  </g>

  <text x="320" y="318" font-size="11.5" text-anchor="middle" fill="currentColor">the model’s item ordering never changed — the auction’s winner did; miscalibration is priced on every request</text>
</svg>

<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- Wide & Deep panel -->
  <rect x="14" y="18" width="300" height="290" rx="6" fill="none" stroke="currentColor" stroke-width="1"/>
  <text x="164" y="40" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor">Wide &amp; Deep (2016)</text>

  <rect x="34" y="252" width="260" height="30" rx="4" fill="none" stroke="currentColor" stroke-width="1"/>
  <text x="164" y="271" font-size="11" text-anchor="middle" fill="currentColor">sparse categorical features</text>

  <!-- wide path -->
  <line x1="94" y1="252" x2="94" y2="216" stroke="currentColor" stroke-width="1" opacity="0.5"/>
  <rect x="30" y="164" width="128" height="52" rx="4" fill="#e2903a" fill-opacity="0.10" stroke="#e2903a" stroke-width="1.2"/>
  <text x="94" y="184" font-size="11" text-anchor="middle" fill="currentColor">wide: linear over</text>
  <text x="94" y="199" font-size="11" text-anchor="middle" fill="currentColor">hand-named crosses</text>
  <text x="94" y="148" font-size="9.5" text-anchor="middle" fill="#e2903a">installed_app × impression_app</text>

  <!-- deep path -->
  <line x1="234" y1="252" x2="234" y2="216" stroke="currentColor" stroke-width="1" opacity="0.5"/>
  <rect x="170" y="164" width="128" height="52" rx="4" fill="#4c8dd6" fill-opacity="0.10" stroke="#4c8dd6" stroke-width="1.2"/>
  <text x="234" y="184" font-size="11" text-anchor="middle" fill="currentColor">deep: embeddings</text>
  <text x="234" y="199" font-size="11" text-anchor="middle" fill="currentColor">→ MLP</text>

  <line x1="94" y1="164" x2="150" y2="112" stroke="currentColor" stroke-width="1" opacity="0.5"/>
  <line x1="234" y1="164" x2="178" y2="112" stroke="currentColor" stroke-width="1" opacity="0.5"/>
  <rect x="114" y="80" width="100" height="32" rx="4" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="164" y="100" font-size="11.5" text-anchor="middle" fill="currentColor">+ → σ → P̂</text>

  <text x="164" y="302" font-size="10" text-anchor="middle" fill="currentColor" opacity="0.55">memorize + generalize; an engineer names every cross</text>

  <!-- DCN v2 panel -->
  <rect x="326" y="18" width="300" height="290" rx="6" fill="none" stroke="currentColor" stroke-width="1"/>
  <text x="476" y="40" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor">DCN v2 (2021)</text>

  <rect x="346" y="252" width="260" height="30" rx="4" fill="none" stroke="currentColor" stroke-width="1"/>
  <text x="476" y="271" font-size="11" text-anchor="middle" fill="currentColor">embedded input x₀</text>

  <!-- cross stack -->
  <line x1="410" y1="252" x2="410" y2="228" stroke="currentColor" stroke-width="1" opacity="0.5"/>
  <rect x="342" y="192" width="140" height="36" rx="4" fill="#e2903a" fill-opacity="0.10" stroke="#e2903a" stroke-width="1.2"/>
  <text x="412" y="207" font-size="10.5" text-anchor="middle" fill="currentColor">cross layer 1</text>
  <text x="412" y="221" font-size="10" text-anchor="middle" fill="currentColor">x₁ = x₀ ⊙ (W₀x₀ + b₀) + x₀</text>
  <line x1="410" y1="192" x2="410" y2="168" stroke="currentColor" stroke-width="1" opacity="0.5"/>
  <rect x="342" y="132" width="140" height="36" rx="4" fill="#e2903a" fill-opacity="0.10" stroke="#e2903a" stroke-width="1.2"/>
  <text x="412" y="147" font-size="10.5" text-anchor="middle" fill="currentColor">cross layer 2</text>
  <text x="412" y="161" font-size="10" text-anchor="middle" fill="currentColor">polynomial degree ↑ per layer</text>

  <!-- deep stack -->
  <line x1="546" y1="252" x2="546" y2="228" stroke="currentColor" stroke-width="1" opacity="0.5"/>
  <rect x="506" y="132" width="80" height="96" rx="4" fill="#4c8dd6" fill-opacity="0.10" stroke="#4c8dd6" stroke-width="1.2"/>
  <text x="546" y="184" font-size="11" text-anchor="middle" fill="currentColor">MLP</text>

  <line x1="412" y1="132" x2="456" y2="112" stroke="currentColor" stroke-width="1" opacity="0.5"/>
  <line x1="546" y1="132" x2="500" y2="112" stroke="currentColor" stroke-width="1" opacity="0.5"/>
  <rect x="426" y="80" width="100" height="32" rx="4" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="476" y="100" font-size="11.5" text-anchor="middle" fill="currentColor">⊕ → σ → P̂</text>

  <text x="476" y="302" font-size="10" text-anchor="middle" fill="currentColor" opacity="0.55">the crosses learn themselves; two cross layers is the reported sweet spot</text>
</svg>

<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="320" y="24" font-size="11.5" text-anchor="middle" fill="currentColor" opacity="0.7">one post’s ordering score: predicted probability × business weight, summed over seven heads</text>

  <!-- column headers -->
  <g font-size="10.5" opacity="0.55">
    <text x="30" y="52" fill="currentColor">head</text>
    <text x="150" y="52" text-anchor="end" fill="currentColor">P̂</text>
    <text x="215" y="52" text-anchor="end" fill="currentColor">× w</text>
    <text x="290" y="52" text-anchor="end" fill="currentColor">= term</text>
  </g>

  <!-- rows: bar scale 100px per unit, bars start at x=310 -->
  <g font-size="11.5">
    <text x="30" y="74" fill="currentColor">click</text>
    <text x="150" y="74" text-anchor="end" fill="currentColor">0.23</text>
    <text x="215" y="74" text-anchor="end" fill="currentColor">1</text>
    <text x="290" y="74" text-anchor="end" fill="currentColor">0.23</text>
    <rect x="310" y="63" width="23" height="14" rx="2" fill="#4c8dd6" fill-opacity="0.55"/>

    <text x="30" y="102" fill="currentColor">like</text>
    <text x="150" y="102" text-anchor="end" fill="currentColor">0.48</text>
    <text x="215" y="102" text-anchor="end" fill="currentColor">5</text>
    <text x="290" y="102" text-anchor="end" fill="currentColor">2.40</text>
    <rect x="310" y="91" width="240" height="14" rx="2" fill="#4c8dd6" fill-opacity="0.55"/>

    <text x="30" y="130" fill="currentColor">comment</text>
    <text x="150" y="130" text-anchor="end" fill="currentColor">0.12</text>
    <text x="215" y="130" text-anchor="end" fill="currentColor">10</text>
    <text x="290" y="130" text-anchor="end" fill="currentColor">1.20</text>
    <rect x="310" y="119" width="120" height="14" rx="2" fill="#4c8dd6" fill-opacity="0.55"/>

    <text x="30" y="158" fill="currentColor">share</text>
    <text x="150" y="158" text-anchor="end" fill="currentColor">0.04</text>
    <text x="215" y="158" text-anchor="end" fill="currentColor">20</text>
    <text x="290" y="158" text-anchor="end" fill="currentColor">0.80</text>
    <rect x="310" y="147" width="80" height="14" rx="2" fill="#4c8dd6" fill-opacity="0.55"/>

    <text x="30" y="186" fill="currentColor">friend request</text>
    <text x="150" y="186" text-anchor="end" fill="currentColor">0.001</text>
    <text x="215" y="186" text-anchor="end" fill="currentColor">30</text>
    <text x="290" y="186" text-anchor="end" fill="currentColor">0.03</text>
    <rect x="310" y="175" width="3" height="14" rx="1" fill="#4c8dd6" fill-opacity="0.55"/>

    <text x="30" y="214" fill="currentColor">hide</text>
    <text x="150" y="214" text-anchor="end" fill="currentColor">0.00005</text>
    <text x="215" y="214" text-anchor="end" fill="#e2903a">−20</text>
    <text x="290" y="214" text-anchor="end" fill="#e2903a">−0.001</text>
    <rect x="308" y="203" width="2" height="14" fill="#e2903a"/>

    <text x="30" y="242" fill="currentColor">block</text>
    <text x="150" y="242" text-anchor="end" fill="currentColor">0.000003</text>
    <text x="215" y="242" text-anchor="end" fill="#e2903a">−50</text>
    <text x="290" y="242" text-anchor="end" fill="#e2903a">−0.00015</text>
    <rect x="308" y="231" width="2" height="14" fill="#e2903a"/>
  </g>

  <text x="470" y="214" font-size="10.5" fill="currentColor" opacity="0.7">guardrail heads: negligible here,</text>
  <text x="470" y="229" font-size="10.5" fill="currentColor" opacity="0.7">but a 2% hide rate would</text>
  <text x="470" y="244" font-size="10.5" fill="currentColor" opacity="0.7">subtract 0.4 — a whole “like” tier</text>

  <!-- total -->
  <line x1="30" y1="262" x2="610" y2="262" stroke="currentColor" stroke-width="1" opacity="0.4"/>
  <text x="30" y="288" font-size="13" font-weight="600" fill="currentColor">engagement score</text>
  <text x="290" y="288" font-size="13" font-weight="600" text-anchor="end" fill="currentColor">4.65885</text>
  <rect x="310" y="276" width="466" height="0" fill="none"/>
  <rect x="310" y="277" width="300" height="14" rx="2" fill="#e2903a" fill-opacity="0.35" stroke="#e2903a" stroke-width="1"/>
  <text x="320" y="312" font-size="10.5" text-anchor="middle" fill="currentColor" opacity="0.55">the feed sorts by this one number; the weights are business policy, not model output (total bar not to scale)</text>
</svg>

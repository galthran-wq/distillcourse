<svg viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="320" y="24" font-size="11.5" text-anchor="middle" fill="currentColor" opacity="0.7">two models on two traffic slices — ten impressions each; which one learned more?</text>

  <!-- left panel: constant model -->
  <rect x="18" y="36" width="292" height="130" rx="6" fill="none" stroke="currentColor" stroke-width="1" opacity="0.9"/>
  <text x="164" y="58" font-size="12.5" font-weight="600" text-anchor="middle" fill="currentColor">constant model · ads slice</text>
  <text x="164" y="74" font-size="10.5" text-anchor="middle" fill="currentColor" opacity="0.55">base rate 10% · predicts 0.2 always</text>
  <g>
    <rect x="44" y="92" width="22" height="22" rx="3" fill="#e2903a" fill-opacity="0.3" stroke="#e2903a" stroke-width="1.2"/>
    <rect x="68" y="92" width="22" height="22" rx="3" fill="none" stroke="currentColor" stroke-width="1"/>
    <rect x="92" y="92" width="22" height="22" rx="3" fill="none" stroke="currentColor" stroke-width="1"/>
    <rect x="116" y="92" width="22" height="22" rx="3" fill="none" stroke="currentColor" stroke-width="1"/>
    <rect x="140" y="92" width="22" height="22" rx="3" fill="none" stroke="currentColor" stroke-width="1"/>
    <rect x="164" y="92" width="22" height="22" rx="3" fill="none" stroke="currentColor" stroke-width="1"/>
    <rect x="188" y="92" width="22" height="22" rx="3" fill="none" stroke="currentColor" stroke-width="1"/>
    <rect x="212" y="92" width="22" height="22" rx="3" fill="none" stroke="currentColor" stroke-width="1"/>
    <rect x="236" y="92" width="22" height="22" rx="3" fill="none" stroke="currentColor" stroke-width="1"/>
    <rect x="260" y="92" width="22" height="22" rx="3" fill="none" stroke="currentColor" stroke-width="1"/>
  </g>
  <text x="55" y="130" font-size="9.5" text-anchor="middle" fill="#e2903a">click</text>
  <text x="196" y="130" font-size="9.5" text-anchor="middle" fill="currentColor" opacity="0.55">9 skips</text>
  <text x="164" y="152" font-size="10.5" text-anchor="middle" fill="currentColor">every impression predicted at 0.2</text>

  <!-- right panel: informed model -->
  <rect x="330" y="36" width="292" height="130" rx="6" fill="none" stroke="currentColor" stroke-width="1" opacity="0.9"/>
  <text x="476" y="58" font-size="12.5" font-weight="600" text-anchor="middle" fill="currentColor">informed model · feed slice</text>
  <text x="476" y="74" font-size="10.5" text-anchor="middle" fill="currentColor" opacity="0.55">base rate 50% · 0.3 on clicks, 0.1 on skips</text>
  <g>
    <rect x="356" y="92" width="22" height="22" rx="3" fill="#e2903a" fill-opacity="0.3" stroke="#e2903a" stroke-width="1.2"/>
    <rect x="380" y="92" width="22" height="22" rx="3" fill="#e2903a" fill-opacity="0.3" stroke="#e2903a" stroke-width="1.2"/>
    <rect x="404" y="92" width="22" height="22" rx="3" fill="#e2903a" fill-opacity="0.3" stroke="#e2903a" stroke-width="1.2"/>
    <rect x="428" y="92" width="22" height="22" rx="3" fill="#e2903a" fill-opacity="0.3" stroke="#e2903a" stroke-width="1.2"/>
    <rect x="452" y="92" width="22" height="22" rx="3" fill="#e2903a" fill-opacity="0.3" stroke="#e2903a" stroke-width="1.2"/>
    <rect x="476" y="92" width="22" height="22" rx="3" fill="none" stroke="currentColor" stroke-width="1"/>
    <rect x="500" y="92" width="22" height="22" rx="3" fill="none" stroke="currentColor" stroke-width="1"/>
    <rect x="524" y="92" width="22" height="22" rx="3" fill="none" stroke="currentColor" stroke-width="1"/>
    <rect x="548" y="92" width="22" height="22" rx="3" fill="none" stroke="currentColor" stroke-width="1"/>
    <rect x="572" y="92" width="22" height="22" rx="3" fill="none" stroke="currentColor" stroke-width="1"/>
  </g>
  <text x="416" y="130" font-size="9.5" text-anchor="middle" fill="#e2903a">5 clicks → 0.3</text>
  <text x="536" y="130" font-size="9.5" text-anchor="middle" fill="currentColor" opacity="0.55">5 skips → 0.1</text>
  <text x="476" y="152" font-size="10.5" text-anchor="middle" fill="currentColor">higher on clicks than on skips — informative</text>

  <!-- band A: raw log loss (computed) -->
  <text x="320" y="196" font-size="11.5" text-anchor="middle" fill="currentColor" opacity="0.7">raw log loss (natural log, lower is better)</text>
  <rect x="104" y="206" width="120" height="34" rx="4" fill="#4c8dd6" fill-opacity="0.12" stroke="#4c8dd6" stroke-width="1.4"/>
  <text x="164" y="228" font-size="14" font-weight="600" text-anchor="middle" fill="#4c8dd6">0.362</text>
  <rect x="416" y="206" width="120" height="34" rx="4" fill="#4c8dd6" fill-opacity="0.12" stroke="#4c8dd6" stroke-width="1.4"/>
  <text x="476" y="228" font-size="14" font-weight="600" text-anchor="middle" fill="#4c8dd6">0.655</text>
  <text x="164" y="256" font-size="10" text-anchor="middle" fill="currentColor" opacity="0.55">−(1·ln 0.2 + 9·ln 0.8)/10</text>
  <text x="476" y="256" font-size="10" text-anchor="middle" fill="currentColor" opacity="0.55">−(5·ln 0.3 + 5·ln 0.9)/10</text>
  <text x="320" y="274" font-size="11" text-anchor="middle" fill="currentColor">0.362 &lt; 0.655 — the model that learned nothing “wins”</text>
  <!-- band B: normalization (computed) -->
  <text x="320" y="290" font-size="11.5" text-anchor="middle" fill="currentColor" opacity="0.7">÷ log loss of always predicting the base rate (the best constant model)</text>
  <rect x="84" y="300" width="160" height="34" rx="4" fill="#e2903a" fill-opacity="0.10" stroke="#e2903a" stroke-width="1.4"/>
  <text x="164" y="322" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor">÷ 0.325 → <tspan fill="#e2903a">NCE 1.11</tspan></text>
  <rect x="396" y="300" width="160" height="34" rx="4" fill="#5aa46a" fill-opacity="0.10" stroke="#5aa46a" stroke-width="1.4"/>
  <text x="476" y="322" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor">÷ 0.693 → <tspan fill="#5aa46a">NCE 0.945</tspan></text>
  <text x="164" y="352" font-size="10.5" text-anchor="middle" fill="#e2903a">&gt; 1: worse than the base rate</text>
  <text x="476" y="352" font-size="10.5" text-anchor="middle" fill="#5aa46a">&lt; 1: learned something</text>
  <text x="320" y="370" font-size="11" text-anchor="middle" fill="currentColor" font-weight="600">the verdict flips: 1.11 vs 0.945 — the informed model is better</text>
</svg>

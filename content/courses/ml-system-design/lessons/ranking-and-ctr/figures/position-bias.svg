<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- training panel -->
  <rect x="18" y="18" width="300" height="200" rx="6" fill="none" stroke="currentColor" stroke-width="1"/>
  <text x="168" y="40" font-size="12.5" font-weight="600" text-anchor="middle" fill="currentColor">training: position is a real feature</text>

  <g font-size="11.5">
    <text x="70" y="64" text-anchor="middle" fill="currentColor" opacity="0.55">doc features</text>
    <text x="178" y="64" text-anchor="middle" fill="#4c8dd6" opacity="0.9">position</text>
    <text x="262" y="64" text-anchor="middle" fill="currentColor" opacity="0.55">click</text>

    <rect x="34" y="74" width="72" height="24" rx="3" fill="none" stroke="currentColor" stroke-width="1"/>
    <text x="70" y="90" text-anchor="middle" fill="currentColor">d₁ …</text>
    <rect x="150" y="74" width="56" height="24" rx="3" fill="#4c8dd6" fill-opacity="0.15" stroke="#4c8dd6" stroke-width="1.2"/>
    <text x="178" y="90" text-anchor="middle" fill="currentColor">1</text>
    <text x="262" y="90" text-anchor="middle" fill="currentColor">1</text>

    <rect x="34" y="104" width="72" height="24" rx="3" fill="none" stroke="currentColor" stroke-width="1"/>
    <text x="70" y="120" text-anchor="middle" fill="currentColor">d₂ …</text>
    <rect x="150" y="104" width="56" height="24" rx="3" fill="#4c8dd6" fill-opacity="0.15" stroke="#4c8dd6" stroke-width="1.2"/>
    <text x="178" y="120" text-anchor="middle" fill="currentColor">2</text>
    <text x="262" y="120" text-anchor="middle" fill="currentColor">0</text>

    <rect x="34" y="134" width="72" height="24" rx="3" fill="none" stroke="currentColor" stroke-width="1"/>
    <text x="70" y="150" text-anchor="middle" fill="currentColor">d₃ …</text>
    <rect x="150" y="134" width="56" height="24" rx="3" fill="#4c8dd6" fill-opacity="0.15" stroke="#4c8dd6" stroke-width="1.2"/>
    <text x="178" y="150" text-anchor="middle" fill="currentColor">3</text>
    <text x="262" y="150" text-anchor="middle" fill="currentColor">1</text>

    <rect x="34" y="164" width="72" height="24" rx="3" fill="none" stroke="currentColor" stroke-width="1"/>
    <text x="70" y="180" text-anchor="middle" fill="currentColor">d₄ …</text>
    <rect x="150" y="164" width="56" height="24" rx="3" fill="#4c8dd6" fill-opacity="0.15" stroke="#4c8dd6" stroke-width="1.2"/>
    <text x="178" y="180" text-anchor="middle" fill="currentColor">7</text>
    <text x="262" y="180" text-anchor="middle" fill="currentColor">0</text>
  </g>
  <text x="168" y="208" font-size="10.5" text-anchor="middle" fill="currentColor" opacity="0.7">the click’s positional share drains into g, not into d’s weights</text>

  <!-- serving panel -->
  <rect x="338" y="18" width="284" height="200" rx="6" fill="none" stroke="currentColor" stroke-width="1"/>
  <text x="480" y="40" font-size="12.5" font-weight="600" text-anchor="middle" fill="currentColor">serving: position is a constant</text>

  <g font-size="11.5">
    <text x="392" y="64" text-anchor="middle" fill="currentColor" opacity="0.55">candidate</text>
    <text x="502" y="64" text-anchor="middle" fill="#e2903a" opacity="0.9">position</text>

    <rect x="356" y="74" width="72" height="24" rx="3" fill="none" stroke="currentColor" stroke-width="1"/>
    <text x="392" y="90" text-anchor="middle" fill="currentColor">c₁ …</text>
    <rect x="474" y="74" width="56" height="24" rx="3" fill="#e2903a" fill-opacity="0.15" stroke="#e2903a" stroke-width="1.2"/>
    <text x="502" y="90" text-anchor="middle" fill="currentColor">1</text>

    <rect x="356" y="104" width="72" height="24" rx="3" fill="none" stroke="currentColor" stroke-width="1"/>
    <text x="392" y="120" text-anchor="middle" fill="currentColor">c₂ …</text>
    <rect x="474" y="104" width="56" height="24" rx="3" fill="#e2903a" fill-opacity="0.15" stroke="#e2903a" stroke-width="1.2"/>
    <text x="502" y="120" text-anchor="middle" fill="currentColor">1</text>

    <rect x="356" y="134" width="72" height="24" rx="3" fill="none" stroke="currentColor" stroke-width="1"/>
    <text x="392" y="150" text-anchor="middle" fill="currentColor">c₃ …</text>
    <rect x="474" y="134" width="56" height="24" rx="3" fill="#e2903a" fill-opacity="0.15" stroke="#e2903a" stroke-width="1.2"/>
    <text x="502" y="150" text-anchor="middle" fill="currentColor">1</text>
  </g>
  <text x="480" y="184" font-size="10.5" text-anchor="middle" fill="currentColor" opacity="0.7">candidates are scored before any order exists,</text>
  <text x="480" y="199" font-size="10.5" text-anchor="middle" fill="currentColor" opacity="0.7">so there is no true position to send</text>

  <!-- additive rule band -->
  <rect x="18" y="234" width="604" height="36" rx="4" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="3 3" opacity="0.7"/>
  <text x="320" y="257" font-size="12" text-anchor="middle" fill="currentColor">score = f(doc) + <tspan fill="#4c8dd6">g(position)</tspan> — additive, and position is <tspan font-weight="600">never crossed</tspan> with a document feature</text>

  <!-- IPS band -->
  <text x="320" y="298" font-size="11.5" text-anchor="middle" fill="currentColor">the reweighting alternative (IPS): keep position out of the features, correct the labels’ weight instead —</text>
  <text x="320" y="316" font-size="11.5" text-anchor="middle" fill="currentColor">a click at position 5, examined 20% of the time, counts 1/0.2 = <tspan fill="#e2903a" font-weight="600">5×</tspan> in the loss</text>
</svg>

<svg viewBox="0 0 640 350" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- pointwise panel (the production winner, amber) -->
  <rect x="14" y="18" width="196" height="252" rx="6" fill="#e2903a" fill-opacity="0.06" stroke="#e2903a" stroke-width="1.4"/>
  <text x="112" y="42" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor">pointwise</text>
  <text x="112" y="58" font-size="10.5" text-anchor="middle" fill="currentColor" opacity="0.55">one item in → P(click) out</text>

  <g font-size="12">
    <rect x="34" y="74" width="28" height="24" rx="3" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="48" y="90" text-anchor="middle" fill="currentColor">A</text>
    <line x1="66" y1="86" x2="106" y2="86" stroke="currentColor" stroke-width="1" opacity="0.5"/>
    <text x="150" y="90" text-anchor="middle" fill="#e2903a" font-weight="600">0.62</text>

    <rect x="34" y="108" width="28" height="24" rx="3" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="48" y="124" text-anchor="middle" fill="currentColor">B</text>
    <line x1="66" y1="120" x2="106" y2="120" stroke="currentColor" stroke-width="1" opacity="0.5"/>
    <text x="150" y="124" text-anchor="middle" fill="#e2903a" font-weight="600">0.11</text>

    <rect x="34" y="142" width="28" height="24" rx="3" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="48" y="158" text-anchor="middle" fill="currentColor">C</text>
    <line x1="66" y1="154" x2="106" y2="154" stroke="currentColor" stroke-width="1" opacity="0.5"/>
    <text x="150" y="158" text-anchor="middle" fill="#e2903a" font-weight="600">0.24</text>
  </g>
  <text x="112" y="196" font-size="10.5" text-anchor="middle" fill="currentColor" opacity="0.7">sort by score → A ≻ C ≻ B</text>
  <text x="112" y="226" font-size="10.5" text-anchor="middle" fill="currentColor">each number is a claim:</text>
  <text x="112" y="241" font-size="10.5" text-anchor="middle" fill="currentColor">0.62 ⇒ 62 clicks per 100 shows</text>
  <text x="112" y="256" font-size="10.5" text-anchor="middle" fill="currentColor" opacity="0.55">(checkable, priceable)</text>

  <!-- pairwise panel -->
  <rect x="222" y="18" width="196" height="252" rx="6" fill="none" stroke="currentColor" stroke-width="1" opacity="0.9"/>
  <text x="320" y="42" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor">pairwise (RankNet)</text>
  <text x="320" y="58" font-size="10.5" text-anchor="middle" fill="currentColor" opacity="0.55">pair in → preference out</text>

  <g font-size="12">
    <text x="264" y="90" text-anchor="middle" fill="currentColor">A vs B</text>
    <line x1="292" y1="86" x2="322" y2="86" stroke="currentColor" stroke-width="1" opacity="0.5"/>
    <text x="362" y="90" text-anchor="middle" fill="#4c8dd6" font-weight="600">A above</text>

    <text x="264" y="124" text-anchor="middle" fill="currentColor">A vs C</text>
    <line x1="292" y1="120" x2="322" y2="120" stroke="currentColor" stroke-width="1" opacity="0.5"/>
    <text x="362" y="124" text-anchor="middle" fill="#4c8dd6" font-weight="600">A above</text>

    <text x="264" y="158" text-anchor="middle" fill="currentColor">B vs C</text>
    <line x1="292" y1="154" x2="322" y2="154" stroke="currentColor" stroke-width="1" opacity="0.5"/>
    <text x="362" y="158" text-anchor="middle" fill="#4c8dd6" font-weight="600">C above</text>
  </g>
  <text x="320" y="196" font-size="10.5" text-anchor="middle" fill="currentColor" opacity="0.7">stitch pairs → A ≻ C ≻ B</text>
  <text x="320" y="226" font-size="10.5" text-anchor="middle" fill="currentColor">loss sees only sᵢ − sⱼ in a list:</text>
  <text x="320" y="241" font-size="10.5" text-anchor="middle" fill="currentColor">add 10 to this list's scores,</text>
  <text x="320" y="256" font-size="10.5" text-anchor="middle" fill="currentColor" opacity="0.55">nothing changes: each list floats</text>

  <!-- listwise panel -->
  <rect x="430" y="18" width="196" height="252" rx="6" fill="none" stroke="currentColor" stroke-width="1" opacity="0.9"/>
  <text x="528" y="42" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor">listwise</text>
  <text x="528" y="58" font-size="10.5" text-anchor="middle" fill="currentColor" opacity="0.55">slate in → permutation out</text>

  <g font-size="12">
    <rect x="462" y="74" width="28" height="24" rx="3" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="476" y="90" text-anchor="middle" fill="currentColor">A</text>
    <rect x="496" y="74" width="28" height="24" rx="3" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="510" y="90" text-anchor="middle" fill="currentColor">B</text>
    <rect x="530" y="74" width="28" height="24" rx="3" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="544" y="90" text-anchor="middle" fill="currentColor">C</text>
    <line x1="510" y1="106" x2="510" y2="130" stroke="currentColor" stroke-width="1" opacity="0.5"/>
    <text x="528" y="158" font-size="12" text-anchor="middle" fill="#4c8dd6" font-weight="600">A C B</text>
  </g>
  <text x="528" y="196" font-size="10.5" text-anchor="middle" fill="currentColor" opacity="0.7">the whole page is the output</text>
  <text x="528" y="226" font-size="10.5" text-anchor="middle" fill="currentColor">optimizes a list metric</text>
  <text x="528" y="241" font-size="10.5" text-anchor="middle" fill="currentColor">directly — and still says</text>
  <text x="528" y="256" font-size="10.5" text-anchor="middle" fill="currentColor" opacity="0.55">nothing about click rates</text>

  <!-- bottom verdict band -->
  <text x="320" y="300" font-size="11.5" text-anchor="middle" fill="currentColor">all three produce the same order A ≻ C ≻ B on this example —</text>
  <text x="320" y="318" font-size="11.5" text-anchor="middle" fill="#e2903a" font-weight="600">only pointwise also states rates a downstream consumer can multiply by money</text>
</svg>

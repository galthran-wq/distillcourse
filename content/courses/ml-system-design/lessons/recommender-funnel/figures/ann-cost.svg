<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- baseline: the exact scan -->
  <text x="350" y="18" font-size="12.5" text-anchor="middle" fill="currentColor" font-weight="600">exact top-k: 10⁸ dot products · 51 GB read · 3.3 s per query per core</text>
  <line x1="14" y1="30" x2="686" y2="30" stroke="currentColor" stroke-width="1" opacity="0.35"/>

  <!-- ================= panel 1: IVF ================= -->
  <text x="14" y="52" font-size="12.5" fill="currentColor" font-weight="600">IVF — probe 32 of 10⁵ cells</text>
  <g>
    <g stroke="currentColor" stroke-width="1" opacity="0.35" fill="none">
      <rect x="24" y="64" width="28" height="26"/><rect x="52" y="64" width="28" height="26"/><rect x="80" y="64" width="28" height="26"/><rect x="108" y="64" width="28" height="26"/><rect x="136" y="64" width="28" height="26"/>
      <rect x="24" y="90" width="28" height="26"/><rect x="52" y="90" width="28" height="26"/><rect x="80" y="90" width="28" height="26"/><rect x="108" y="90" width="28" height="26"/><rect x="136" y="90" width="28" height="26"/>
      <rect x="24" y="116" width="28" height="26"/><rect x="52" y="116" width="28" height="26"/><rect x="80" y="116" width="28" height="26"/><rect x="108" y="116" width="28" height="26"/><rect x="136" y="116" width="28" height="26"/>
      <rect x="24" y="142" width="28" height="26"/><rect x="52" y="142" width="28" height="26"/><rect x="80" y="142" width="28" height="26"/><rect x="108" y="142" width="28" height="26"/><rect x="136" y="142" width="28" height="26"/>
    </g>
    <!-- probed cells -->
    <rect x="52" y="90" width="28" height="26" fill="#e2903a" fill-opacity="0.2" stroke="#e2903a" stroke-width="1.4"/>
    <rect x="80" y="90" width="28" height="26" fill="#e2903a" fill-opacity="0.2" stroke="#e2903a" stroke-width="1.4"/>
    <rect x="80" y="116" width="28" height="26" fill="#e2903a" fill-opacity="0.2" stroke="#e2903a" stroke-width="1.4"/>
    <!-- centroids -->
    <g fill="currentColor" opacity="0.5">
      <circle cx="38" cy="77" r="1.8"/><circle cx="66" cy="77" r="1.8"/><circle cx="94" cy="77" r="1.8"/><circle cx="122" cy="77" r="1.8"/><circle cx="150" cy="77" r="1.8"/>
      <circle cx="38" cy="103" r="1.8"/><circle cx="66" cy="103" r="1.8"/><circle cx="94" cy="103" r="1.8"/><circle cx="122" cy="103" r="1.8"/><circle cx="150" cy="103" r="1.8"/>
      <circle cx="38" cy="129" r="1.8"/><circle cx="66" cy="129" r="1.8"/><circle cx="94" cy="129" r="1.8"/><circle cx="122" cy="129" r="1.8"/><circle cx="150" cy="129" r="1.8"/>
      <circle cx="38" cy="155" r="1.8"/><circle cx="66" cy="155" r="1.8"/><circle cx="94" cy="155" r="1.8"/><circle cx="122" cy="155" r="1.8"/><circle cx="150" cy="155" r="1.8"/>
    </g>
    <!-- query -->
    <g stroke="#e2903a" stroke-width="1.8">
      <line x1="76" y1="106" x2="86" y2="116"/><line x1="86" y1="106" x2="76" y2="116"/>
    </g>
    <text x="126" y="188" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.55">scores all centroids, then 32 lists</text>
  </g>
  <text x="14" y="216" font-size="12" fill="currentColor">route 10⁵ + list 3.2×10⁴</text>
  <text x="14" y="234" font-size="12.5" fill="#e2903a" font-weight="600">1.3×10⁵ dot products · 4.4 ms</text>
  <text x="14" y="256" font-size="11" fill="currentColor" opacity="0.55">n_probe buys recall, cost linear</text>
  <text x="14" y="272" font-size="11" fill="currentColor" opacity="0.55">PQ codes: 51 GB → 1.6 GB</text>

  <line x1="238" y1="40" x2="238" y2="282" stroke="currentColor" stroke-width="1" opacity="0.2"/>

  <!-- ================= panel 2: HNSW ================= -->
  <text x="250" y="52" font-size="12.5" fill="currentColor" font-weight="600">HNSW — ~log N hops</text>
  <g>
    <line x1="268" y1="76" x2="410" y2="76" stroke="currentColor" stroke-width="1" opacity="0.25"/>
    <g fill="currentColor" opacity="0.5"><circle cx="268" cy="76" r="3"/><circle cx="339" cy="76" r="3"/><circle cx="410" cy="76" r="3"/></g>
    <text x="420" y="80" font-size="11" fill="currentColor" opacity="0.55">layer 2</text>

    <line x1="260" y1="116" x2="414" y2="116" stroke="currentColor" stroke-width="1" opacity="0.25"/>
    <g fill="currentColor" opacity="0.5"><circle cx="260" cy="116" r="3"/><circle cx="298" cy="116" r="3"/><circle cx="337" cy="116" r="3"/><circle cx="375" cy="116" r="3"/><circle cx="414" cy="116" r="3"/></g>
    <text x="424" y="120" font-size="11" fill="currentColor" opacity="0.55">layer 1</text>

    <line x1="256" y1="158" x2="416" y2="158" stroke="currentColor" stroke-width="1" opacity="0.25"/>
    <g fill="currentColor" opacity="0.5"><circle cx="256" cy="158" r="3"/><circle cx="276" cy="158" r="3"/><circle cx="296" cy="158" r="3"/><circle cx="316" cy="158" r="3"/><circle cx="336" cy="158" r="3"/><circle cx="356" cy="158" r="3"/><circle cx="376" cy="158" r="3"/><circle cx="396" cy="158" r="3"/><circle cx="416" cy="158" r="3"/></g>
    <text x="426" y="162" font-size="11" fill="currentColor" opacity="0.55">layer 0</text>

    <path d="M 268 76 L 339 76 L 337 116 L 375 116 L 376 158 L 356 158" fill="none" stroke="#e2903a" stroke-width="2"/>
    <circle cx="268" cy="76" r="4" fill="#e2903a"/>
    <circle cx="356" cy="158" r="4" fill="#e2903a"/>
    <text x="340" y="188" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.55">long links first, short links last</text>
  </g>
  <text x="250" y="216" font-size="12" fill="currentColor">27 hops × 32 neighbours</text>
  <text x="250" y="234" font-size="12.5" fill="#e2903a" font-weight="600">10³–10⁴ dot products · 0.3 ms</text>
  <text x="250" y="256" font-size="11" fill="currentColor" opacity="0.55">+13 GB of edges, RAM-resident</text>
  <text x="250" y="272" font-size="11" fill="currentColor" opacity="0.55">build ≈ N insert-queries ≈ 10¹¹</text>

  <line x1="474" y1="40" x2="474" y2="282" stroke="currentColor" stroke-width="1" opacity="0.2"/>

  <!-- ================= panel 3: LSH ================= -->
  <text x="486" y="52" font-size="12.5" fill="currentColor" font-weight="600">LSH — L tables, one bucket</text>
  <g>
    <g stroke="currentColor" stroke-width="1" opacity="0.35" fill="none">
      <rect x="488" y="70" width="21" height="26"/><rect x="509" y="70" width="21" height="26"/><rect x="530" y="70" width="21" height="26"/><rect x="551" y="70" width="21" height="26"/><rect x="572" y="70" width="21" height="26"/><rect x="593" y="70" width="21" height="26"/><rect x="614" y="70" width="21" height="26"/>
      <rect x="488" y="112" width="21" height="26"/><rect x="509" y="112" width="21" height="26"/><rect x="530" y="112" width="21" height="26"/><rect x="551" y="112" width="21" height="26"/><rect x="572" y="112" width="21" height="26"/><rect x="593" y="112" width="21" height="26"/><rect x="614" y="112" width="21" height="26"/>
      <rect x="488" y="154" width="21" height="26"/><rect x="509" y="154" width="21" height="26"/><rect x="530" y="154" width="21" height="26"/><rect x="551" y="154" width="21" height="26"/><rect x="572" y="154" width="21" height="26"/><rect x="593" y="154" width="21" height="26"/><rect x="614" y="154" width="21" height="26"/>
    </g>
    <rect x="530" y="70" width="21" height="26" fill="#e2903a" fill-opacity="0.2" stroke="#e2903a" stroke-width="1.4"/>
    <rect x="593" y="112" width="21" height="26" fill="#e2903a" fill-opacity="0.2" stroke="#e2903a" stroke-width="1.4"/>
    <rect x="509" y="154" width="21" height="26" fill="#e2903a" fill-opacity="0.2" stroke="#e2903a" stroke-width="1.4"/>
    <text x="643" y="88" font-size="11" fill="currentColor" opacity="0.55">h₁</text>
    <text x="643" y="130" font-size="11" fill="currentColor" opacity="0.55">h₂</text>
    <text x="643" y="172" font-size="11" fill="currentColor" opacity="0.55">h_L</text>
    <text x="580" y="198" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.55">buckets fixed before seeing the data</text>
  </g>
  <text x="486" y="216" font-size="12" fill="currentColor">10 tables × ~100 per bucket</text>
  <text x="486" y="234" font-size="12.5" fill="#e2903a" font-weight="600">10³ dot products · 0.03 ms</text>
  <text x="486" y="256" font-size="11" fill="currentColor" opacity="0.55">cheapest build: one hashing pass</text>
  <text x="486" y="272" font-size="11" fill="currentColor" opacity="0.55">weakest recall at equal cost</text>

  <text x="350" y="294" font-size="11.5" text-anchor="middle" fill="currentColor" opacity="0.55">every family routes to a short candidate list, then scores it exactly; recall is what the routing gives up</text>
</svg>

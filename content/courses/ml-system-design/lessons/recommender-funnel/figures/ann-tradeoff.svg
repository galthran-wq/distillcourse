<svg viewBox="0 0 620 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- axes -->
  <line x1="70" y1="270" x2="590" y2="270" stroke="currentColor" stroke-width="1.2"/>
  <line x1="70" y1="270" x2="70" y2="36" stroke="currentColor" stroke-width="1.2"/>
  <text x="70" y="24" font-size="11.5" fill="currentColor" opacity="0.55">queries per second (log scale)</text>
  <text x="330" y="302" font-size="12" text-anchor="middle" fill="currentColor">recall@10 — fraction of the true neighbors found</text>

  <!-- y ticks -->
  <text x="62" y="274" font-size="11" text-anchor="end" fill="currentColor" opacity="0.7">10²</text>
  <text x="62" y="217" font-size="11" text-anchor="end" fill="currentColor" opacity="0.7">10³</text>
  <text x="62" y="160" font-size="11" text-anchor="end" fill="currentColor" opacity="0.7">10⁴</text>
  <text x="62" y="103" font-size="11" text-anchor="end" fill="currentColor" opacity="0.7">10⁵</text>
  <text x="62" y="46" font-size="11" text-anchor="end" fill="currentColor" opacity="0.7">10⁶</text>
  <!-- x ticks -->
  <text x="70" y="286" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.7">0.5</text>
  <text x="170" y="286" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.7">0.6</text>
  <text x="270" y="286" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.7">0.7</text>
  <text x="370" y="286" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.7">0.8</text>
  <text x="470" y="286" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.7">0.9</text>
  <text x="570" y="286" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.7">1.0</text>

  <!-- curves (schematic, shapes per ANN-Benchmarks convention) -->
  <path d="M 170 72 C 270 80, 330 86, 370 95 C 430 106, 470 105, 520 129 C 545 145, 555 155, 570 230" fill="none" stroke="#e2903a" stroke-width="2.2"/>
  <path d="M 170 105 C 250 112, 320 118, 370 129 C 420 140, 450 146, 500 176 C 530 196, 545 210, 560 243" fill="none" stroke="#4c8dd6" stroke-width="2"/>
  <path d="M 170 156 C 240 168, 310 182, 370 196 C 420 209, 460 222, 510 262" fill="none" stroke="currentColor" stroke-width="2" opacity="0.55"/>

  <!-- curve name labels -->
  <text x="164" y="68" font-size="12" text-anchor="end" fill="#e2903a" font-weight="600">HNSW</text>
  <text x="164" y="105" font-size="12" text-anchor="end" fill="#4c8dd6" font-weight="600">IVF + PQ</text>
  <text x="164" y="156" font-size="12" text-anchor="end" fill="currentColor" font-weight="600" opacity="0.7">LSH</text>

  <!-- operating point -->
  <circle cx="520" cy="129" r="4.5" fill="#e2903a"/>
  <line x1="520" y1="129" x2="520" y2="270" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5"/>
  <line x1="70" y1="129" x2="520" y2="129" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5"/>
  <text x="512" y="118" font-size="11" text-anchor="end" fill="currentColor">operating point: recall 0.95 at ≈3×10⁴ QPS</text>

  <!-- what the plot omits -->
  <g font-size="11" opacity="0.85">
    <rect x="84" y="196" width="11" height="11" rx="2" fill="#e2903a"/>
    <text x="102" y="206" fill="currentColor">HNSW — slow build, index held in RAM</text>
    <rect x="84" y="216" width="11" height="11" rx="2" fill="#4c8dd6"/>
    <text x="102" y="226" fill="currentColor">IVF + PQ — cheap build, compressed index</text>
    <rect x="84" y="236" width="11" height="11" rx="2" fill="currentColor" opacity="0.55"/>
    <text x="102" y="246" fill="currentColor">LSH — cheapest build, weakest curve</text>
  </g>
</svg>

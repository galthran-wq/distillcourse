<svg viewBox="0 0 660 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- funnel guide lines -->
  <path d="M 60 50 L 222 104 L 428 116 L 612 134" fill="none" stroke="currentColor" stroke-dasharray="3 3" opacity="0.3"/>
  <path d="M 60 250 L 222 196 L 428 184 L 612 167" fill="none" stroke="currentColor" stroke-dasharray="3 3" opacity="0.3"/>

  <!-- count bars -->
  <rect x="16" y="50" width="44" height="200" rx="3" fill="#e2903a" fill-opacity="0.22" stroke="#e2903a" stroke-width="1.2"/>
  <text x="38" y="40" font-size="12" text-anchor="middle" fill="currentColor" font-weight="600">10⁸</text>
  <text x="38" y="266" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.55">corpus</text>

  <rect x="222" y="104" width="42" height="92" rx="3" fill="#e2903a" fill-opacity="0.22" stroke="#e2903a" stroke-width="1.2"/>
  <text x="243" y="94" font-size="12" text-anchor="middle" fill="currentColor" font-weight="600">~5,000</text>
  <text x="243" y="212" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.55">candidates</text>

  <rect x="428" y="116" width="38" height="68" rx="3" fill="#e2903a" fill-opacity="0.22" stroke="#e2903a" stroke-width="1.2"/>
  <text x="447" y="106" font-size="12" text-anchor="middle" fill="currentColor" font-weight="600">500</text>
  <text x="447" y="200" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.55">scored</text>

  <rect x="612" y="134" width="32" height="33" rx="3" fill="#e2903a" fill-opacity="0.22" stroke="#e2903a" stroke-width="1.2"/>
  <text x="628" y="124" font-size="12" text-anchor="middle" fill="currentColor" font-weight="600">20</text>
  <text x="628" y="183" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.55">the page</text>

  <!-- stage gates -->
  <rect x="76" y="108" width="128" height="84" rx="6" fill="none" stroke="currentColor" stroke-width="1.3"/>
  <text x="140" y="132" font-size="12.5" text-anchor="middle" fill="currentColor" font-weight="600">1 · retrieval</text>
  <text x="140" y="150" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.55">multi-source lookup</text>
  <text x="140" y="170" font-size="12" text-anchor="middle" fill="#e2903a" font-weight="600">20 ms</text>

  <rect x="282" y="108" width="128" height="84" rx="6" fill="none" stroke="currentColor" stroke-width="1.3"/>
  <text x="346" y="132" font-size="12.5" text-anchor="middle" fill="currentColor" font-weight="600">2 · ranking</text>
  <text x="346" y="150" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.55">heavy model, batched</text>
  <text x="346" y="170" font-size="12" text-anchor="middle" fill="#e2903a" font-weight="600">100 ms</text>

  <rect x="484" y="108" width="110" height="84" rx="6" fill="none" stroke="currentColor" stroke-width="1.3"/>
  <text x="539" y="132" font-size="12.5" text-anchor="middle" fill="currentColor" font-weight="600">3 · re-ranking</text>
  <text x="539" y="150" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.55">rules</text>
  <text x="539" y="170" font-size="12" text-anchor="middle" fill="#e2903a" font-weight="600">10 ms</text>

  <!-- arrows -->
  <line x1="60" y1="150" x2="72" y2="150" stroke="currentColor" stroke-width="1.3"/>
  <polygon points="76,150 69,146.5 69,153.5" fill="currentColor"/>
  <line x1="204" y1="150" x2="218" y2="150" stroke="currentColor" stroke-width="1.3"/>
  <polygon points="222,150 215,146.5 215,153.5" fill="currentColor"/>
  <line x1="264" y1="150" x2="278" y2="150" stroke="currentColor" stroke-width="1.3"/>
  <polygon points="282,150 275,146.5 275,153.5" fill="currentColor"/>
  <line x1="410" y1="150" x2="424" y2="150" stroke="currentColor" stroke-width="1.3"/>
  <polygon points="428,150 421,146.5 421,153.5" fill="currentColor"/>
  <line x1="466" y1="150" x2="480" y2="150" stroke="currentColor" stroke-width="1.3"/>
  <polygon points="484,150 477,146.5 477,153.5" fill="currentColor"/>
  <line x1="594" y1="150" x2="608" y2="150" stroke="currentColor" stroke-width="1.3"/>
  <polygon points="612,150 605,146.5 605,153.5" fill="currentColor"/>

  <!-- per-item cost row -->
  <text x="140" y="236" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.55">≈4 µs per item returned</text>
  <text x="346" y="236" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.55">≈200 µs per item</text>
  <text x="539" y="236" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.55">≈500 µs per item</text>

  <text x="330" y="298" font-size="12" text-anchor="middle" fill="currentColor" opacity="0.55">count falls 10⁸ → 20; per-item spend 4 → 200 → 500 µs, the 50× step at retrieval → ranking</text>
</svg>

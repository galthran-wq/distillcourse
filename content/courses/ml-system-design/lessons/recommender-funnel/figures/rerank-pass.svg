<svg viewBox="0 0 620 360" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="135" y="42" font-size="12" text-anchor="middle" fill="currentColor" opacity="0.7">ranker’s top 8, by score</text>
  <text x="485" y="42" font-size="12" text-anchor="middle" fill="currentColor" opacity="0.7">the page, after rules</text>

  <!-- before column -->
  <g font-size="12">
    <rect x="40" y="58" width="190" height="28" rx="4" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="52" y="77" fill="currentColor" font-weight="600">A</text>
    <rect x="40" y="94" width="190" height="28" rx="4" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="52" y="113" fill="currentColor" font-weight="600">B</text>
    <rect x="40" y="130" width="190" height="28" rx="4" fill="none" stroke="#e2903a" stroke-width="1.3"/>
    <text x="52" y="149" fill="currentColor" font-weight="600">B′</text>
    <text x="222" y="149" font-size="10.5" text-anchor="end" fill="currentColor" opacity="0.55">near-duplicate of B</text>
    <rect x="40" y="166" width="190" height="28" rx="4" fill="none" stroke="#e2903a" stroke-width="1.3"/>
    <text x="52" y="185" fill="currentColor" font-weight="600">C</text>
    <text x="222" y="185" font-size="10.5" text-anchor="end" fill="currentColor" opacity="0.55">shown ×3, ignored</text>
    <rect x="40" y="202" width="190" height="28" rx="4" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="52" y="221" fill="currentColor" font-weight="600">D</text>
    <rect x="40" y="238" width="190" height="28" rx="4" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="52" y="257" fill="currentColor" font-weight="600">E</text>
    <rect x="40" y="274" width="190" height="28" rx="4" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="52" y="293" fill="currentColor" font-weight="600">F</text>
    <rect x="40" y="310" width="190" height="28" rx="4" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="52" y="329" fill="currentColor" font-weight="600">G</text>
  </g>

  <!-- after column -->
  <g font-size="12">
    <rect x="390" y="58" width="190" height="28" rx="4" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="402" y="77" fill="currentColor" font-weight="600">A</text>
    <rect x="390" y="94" width="190" height="28" rx="4" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="402" y="113" fill="currentColor" font-weight="600">B</text>
    <rect x="390" y="130" width="190" height="28" rx="4" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="402" y="149" fill="currentColor" font-weight="600">D</text>
    <rect x="390" y="166" width="190" height="28" rx="4" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="402" y="185" fill="currentColor" font-weight="600">E</text>
    <rect x="390" y="202" width="190" height="28" rx="4" fill="none" stroke="#5aa46a" stroke-width="1.4"/>
    <text x="402" y="221" fill="currentColor" font-weight="600">X</text>
    <text x="572" y="221" font-size="10.5" text-anchor="end" fill="#5aa46a">fresh pool</text>
    <rect x="390" y="238" width="190" height="28" rx="4" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="402" y="257" fill="currentColor" font-weight="600">F</text>
    <rect x="390" y="274" width="190" height="28" rx="4" fill="none" stroke="#e2903a" stroke-width="1.3"/>
    <text x="402" y="293" fill="currentColor" font-weight="600">C</text>
    <text x="572" y="293" font-size="10.5" text-anchor="end" fill="#e2903a">discounted</text>
    <rect x="390" y="310" width="190" height="28" rx="4" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="402" y="329" fill="currentColor" font-weight="600">G</text>
  </g>

  <!-- traces -->
  <line x1="230" y1="72" x2="390" y2="72" stroke="currentColor" stroke-width="1" opacity="0.3"/>
  <line x1="230" y1="108" x2="390" y2="108" stroke="currentColor" stroke-width="1" opacity="0.3"/>
  <line x1="230" y1="144" x2="286" y2="144" stroke="#e2903a" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="294" y="148" font-size="11" fill="#e2903a">✕ dedupe</text>
  <line x1="230" y1="180" x2="390" y2="288" stroke="#e2903a" stroke-width="1.4"/>
  <text x="300" y="248" font-size="10.5" fill="#e2903a">impression discount</text>
  <line x1="230" y1="216" x2="390" y2="144" stroke="currentColor" stroke-width="1" opacity="0.3"/>
  <line x1="230" y1="252" x2="390" y2="180" stroke="currentColor" stroke-width="1" opacity="0.3"/>
  <line x1="230" y1="288" x2="390" y2="252" stroke="currentColor" stroke-width="1" opacity="0.3"/>
  <line x1="230" y1="324" x2="390" y2="324" stroke="currentColor" stroke-width="1" opacity="0.3"/>
  <text x="300" y="204" font-size="10.5" fill="#5aa46a">exploration slot</text>
  <line x1="342" y1="209" x2="386" y2="215" stroke="#5aa46a" stroke-width="1.4"/>
  <polygon points="390,216 382,212 383,220" fill="#5aa46a"/>

  <text x="310" y="354" font-size="11.5" text-anchor="middle" fill="currentColor" opacity="0.55">rules, not weights: each move is auditable and changeable without a retrain</text>
</svg>

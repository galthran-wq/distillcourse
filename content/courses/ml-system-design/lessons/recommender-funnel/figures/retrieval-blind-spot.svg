<svg viewBox="0 0 620 356" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- corpus -->
  <rect x="18" y="34" width="584" height="256" rx="8" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.45"/>
  <text x="30" y="52" font-size="11.5" fill="currentColor" opacity="0.55">the corpus — 10⁸ items</text>

  <!-- truly relevant to this user (unknown set) -->
  <ellipse cx="382" cy="172" rx="168" ry="102" fill="#4c8dd6" fill-opacity="0.07" stroke="#4c8dd6" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="452" y="92" font-size="12" text-anchor="middle" fill="#4c8dd6" font-weight="600">truly relevant to this user</text>
  <text x="452" y="108" font-size="11" text-anchor="middle" fill="#4c8dd6" opacity="0.8">(never observed)</text>

  <!-- retrieved this request -->
  <ellipse cx="228" cy="172" rx="138" ry="94" fill="#e2903a" fill-opacity="0.09" stroke="#e2903a" stroke-width="1.8"/>
  <text x="164" y="104" font-size="12" text-anchor="middle" fill="currentColor" font-weight="600">retrieved · ~5,000</text>
  <text x="164" y="120" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.55">all the ranker can see</text>

  <!-- logged engagements -->
  <ellipse cx="190" cy="180" rx="76" ry="52" fill="currentColor" fill-opacity="0.09" stroke="currentColor" stroke-width="1.4"/>
  <text x="190" y="176" font-size="11.5" text-anchor="middle" fill="currentColor" font-weight="600">logged engagements</text>
  <text x="190" y="193" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.6">the only labels there are</text>

  <!-- the unmeasured region -->
  <text x="466" y="164" font-size="11.5" text-anchor="middle" fill="currentColor">relevant, never retrieved:</text>
  <text x="466" y="181" font-size="11.5" text-anchor="middle" fill="currentColor" opacity="0.75">no impression, no label,</text>
  <text x="466" y="198" font-size="11.5" text-anchor="middle" fill="currentColor" opacity="0.75">no error term anywhere</text>
  <line x1="466" y1="210" x2="466" y2="238" stroke="currentColor" stroke-width="1" stroke-dasharray="3 3" opacity="0.5"/>
  <text x="466" y="252" font-size="11.5" text-anchor="middle" fill="currentColor" font-weight="600">the recall ceiling</text>

  <text x="60" y="272" font-size="11" fill="currentColor" opacity="0.45">everything else</text>

  <!-- the metric, and what it cannot reach -->
  <text x="310" y="314" font-size="12" text-anchor="middle" fill="currentColor">recall@500 against logged engagements = |logged ∩ retrieved| / |logged| ≈ 1</text>
  <text x="310" y="334" font-size="11.5" text-anchor="middle" fill="currentColor" opacity="0.7">logged ⊂ retrieved, so no log samples the blue region outside the amber one</text>
</svg>

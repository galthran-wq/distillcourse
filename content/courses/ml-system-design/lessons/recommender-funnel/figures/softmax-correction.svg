<svg viewBox="0 0 620 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="310" y="30" font-size="11.5" text-anchor="middle" fill="currentColor" opacity="0.7">one training batch: each item is one user’s positive and every other user’s negative</text>

  <!-- batch strip: A A B A C A D A E F A G -->
  <g font-size="13" font-weight="600">
    <rect x="40" y="44" width="40" height="32" rx="3" fill="#e2903a" fill-opacity="0.25" stroke="#e2903a" stroke-width="1.2"/>
    <text x="60" y="65" text-anchor="middle" fill="currentColor">A</text>
    <rect x="85" y="44" width="40" height="32" rx="3" fill="#e2903a" fill-opacity="0.25" stroke="#e2903a" stroke-width="1.2"/>
    <text x="105" y="65" text-anchor="middle" fill="currentColor">A</text>
    <rect x="130" y="44" width="40" height="32" rx="3" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="150" y="65" text-anchor="middle" fill="currentColor">B</text>
    <rect x="175" y="44" width="40" height="32" rx="3" fill="#e2903a" fill-opacity="0.25" stroke="#e2903a" stroke-width="1.2"/>
    <text x="195" y="65" text-anchor="middle" fill="currentColor">A</text>
    <rect x="220" y="44" width="40" height="32" rx="3" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="240" y="65" text-anchor="middle" fill="currentColor">C</text>
    <rect x="265" y="44" width="40" height="32" rx="3" fill="#e2903a" fill-opacity="0.25" stroke="#e2903a" stroke-width="1.2"/>
    <text x="285" y="65" text-anchor="middle" fill="currentColor">A</text>
    <rect x="310" y="44" width="40" height="32" rx="3" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="330" y="65" text-anchor="middle" fill="currentColor">D</text>
    <rect x="355" y="44" width="40" height="32" rx="3" fill="#e2903a" fill-opacity="0.25" stroke="#e2903a" stroke-width="1.2"/>
    <text x="375" y="65" text-anchor="middle" fill="currentColor">A</text>
    <rect x="400" y="44" width="40" height="32" rx="3" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="420" y="65" text-anchor="middle" fill="currentColor">E</text>
    <rect x="445" y="44" width="40" height="32" rx="3" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="465" y="65" text-anchor="middle" fill="currentColor">F</text>
    <rect x="490" y="44" width="40" height="32" rx="3" fill="#e2903a" fill-opacity="0.25" stroke="#e2903a" stroke-width="1.2"/>
    <text x="510" y="65" text-anchor="middle" fill="currentColor">A</text>
    <rect x="535" y="44" width="40" height="32" rx="3" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="555" y="65" text-anchor="middle" fill="currentColor">G</text>
  </g>
  <text x="310" y="98" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.55">popular item A fills half the negative slots: it is drawn with probability p_A ≈ 0.5, item G with p_G ≈ 0.08</text>

  <!-- corrected logit, dissected -->
  <g font-size="18">
    <text x="200" y="152" text-anchor="middle" fill="currentColor" font-weight="600">sᶜ(x, yⱼ)</text>
    <text x="262" y="152" text-anchor="middle" fill="currentColor">=</text>
    <text x="330" y="152" text-anchor="middle" fill="#4c8dd6" font-weight="600">s(x, yⱼ)</text>
    <text x="400" y="152" text-anchor="middle" fill="currentColor">−</text>
    <text x="462" y="152" text-anchor="middle" fill="#e2903a" font-weight="600">log pⱼ</text>
  </g>
  <line x1="330" y1="160" x2="330" y2="182" stroke="#4c8dd6" stroke-width="1.2"/>
  <text x="290" y="200" font-size="11.5" text-anchor="middle" fill="#4c8dd6">⟨u(x), v(yⱼ)⟩ — the affinity</text>
  <line x1="462" y1="160" x2="462" y2="204" stroke="#e2903a" stroke-width="1.2"/>
  <text x="472" y="222" font-size="11.5" text-anchor="middle" fill="#e2903a">j’s share of negative slots</text>

  <!-- the cancellation -->
  <text x="310" y="262" font-size="13" text-anchor="middle" fill="currentColor">expected pull on item j, per batch of n:&#160;&#160; n·pⱼ × eˢ/pⱼ &#160;=&#160; n·eˢ</text>
  <text x="310" y="284" font-size="12" text-anchor="middle" fill="#5aa46a" font-weight="600">popularity cancels — every item pulls as if sampled uniformly</text>
</svg>

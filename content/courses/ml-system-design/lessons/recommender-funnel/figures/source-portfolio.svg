<svg viewBox="0 0 620 340" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- source boxes -->
  <rect x="16" y="36" width="256" height="46" rx="6" fill="none" stroke="currentColor" stroke-width="1.3"/>
  <text x="28" y="55" font-size="11.5" fill="currentColor" font-weight="600">co-occurrence · “watched together”</text>
  <text x="28" y="72" font-size="11" fill="currentColor" opacity="0.55">blind spot: rare and new items</text>

  <rect x="16" y="94" width="256" height="46" rx="6" fill="none" stroke="currentColor" stroke-width="1.3"/>
  <text x="28" y="113" font-size="12.5" fill="currentColor" font-weight="600">content similarity</text>
  <text x="28" y="130" font-size="11" fill="currentColor" opacity="0.55">blind spot: never leaves current interests</text>

  <rect x="16" y="152" width="256" height="46" rx="6" fill="none" stroke="currentColor" stroke-width="1.3"/>
  <text x="28" y="171" font-size="12.5" fill="currentColor" font-weight="600">graph random walk</text>
  <text x="28" y="188" font-size="11" fill="currentColor" opacity="0.55">blind spot: nodes with no edges yet</text>

  <rect x="16" y="210" width="256" height="46" rx="6" fill="none" stroke="currentColor" stroke-width="1.3"/>
  <text x="28" y="229" font-size="12.5" fill="currentColor" font-weight="600">popular in cohort</text>
  <text x="28" y="246" font-size="11" fill="currentColor" opacity="0.55">blind spot: niche tastes</text>

  <rect x="16" y="268" width="256" height="46" rx="6" fill="none" stroke="#5aa46a" stroke-width="1.4"/>
  <text x="28" y="287" font-size="12.5" fill="currentColor" font-weight="600">fresh / exploration pool</text>
  <text x="28" y="304" font-size="11" fill="currentColor" opacity="0.55">no relevance signal — by design</text>

  <!-- converging arrows -->
  <line x1="272" y1="59" x2="378" y2="146" stroke="currentColor" stroke-width="1.2" opacity="0.6"/>
  <line x1="272" y1="117" x2="378" y2="152" stroke="currentColor" stroke-width="1.2" opacity="0.6"/>
  <line x1="272" y1="175" x2="378" y2="166" stroke="currentColor" stroke-width="1.2" opacity="0.6"/>
  <line x1="272" y1="233" x2="378" y2="180" stroke="currentColor" stroke-width="1.2" opacity="0.6"/>
  <line x1="272" y1="291" x2="378" y2="188" stroke="#5aa46a" stroke-width="1.2" opacity="0.8"/>

  <!-- union node -->
  <rect x="382" y="134" width="106" height="66" rx="6" fill="none" stroke="currentColor" stroke-width="1.3"/>
  <text x="435" y="162" font-size="12.5" text-anchor="middle" fill="currentColor" font-weight="600">union</text>
  <text x="435" y="182" font-size="11.5" text-anchor="middle" fill="currentColor" opacity="0.7">→ dedupe</text>

  <!-- output -->
  <line x1="488" y1="167" x2="508" y2="167" stroke="#e2903a" stroke-width="1.6"/>
  <polygon points="514,167 506,163 506,171" fill="#e2903a"/>
  <rect x="516" y="142" width="92" height="50" rx="6" fill="#e2903a" fill-opacity="0.12" stroke="#e2903a" stroke-width="1.4"/>
  <text x="562" y="163" font-size="12.5" text-anchor="middle" fill="currentColor" font-weight="600">~5,000</text>
  <text x="562" y="181" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.7">to ranking</text>

  <text x="310" y="332" font-size="12" text-anchor="middle" fill="currentColor" opacity="0.55">each source is a precomputed lookup; none is trusted alone</text>
</svg>

<svg viewBox="0 0 620 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="160" y="26" font-size="12" text-anchor="middle" fill="currentColor" opacity="0.55">offline · batch</text>
  <text x="470" y="26" font-size="12" text-anchor="middle" fill="currentColor" opacity="0.55">online · request path</text>
  <line x1="320" y1="14" x2="320" y2="270" stroke="currentColor" stroke-dasharray="4 4" opacity="0.4"/>

  <!-- offline side (settled) -->
  <g opacity="0.55">
    <rect x="40" y="44" width="150" height="44" rx="6" fill="none" stroke="currentColor" stroke-width="1.3"/>
    <text x="115" y="62" font-size="12" text-anchor="middle" fill="currentColor" font-weight="600">item corpus</text>
    <text x="115" y="79" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.55">10⁸ items</text>
    <line x1="115" y1="88" x2="115" y2="106" stroke="currentColor" stroke-width="1.2"/>
    <polygon points="115,112 111.5,105 118.5,105" fill="currentColor"/>
    <rect x="40" y="112" width="150" height="40" rx="6" fill="none" stroke="currentColor" stroke-width="1.3"/>
    <text x="115" y="136" font-size="12" text-anchor="middle" fill="currentColor" font-weight="600">item tower v(·)</text>
    <line x1="190" y1="132" x2="208" y2="132" stroke="currentColor" stroke-width="1.2"/>
    <polygon points="214,132 207,128.5 207,135.5" fill="currentColor"/>
    <rect x="214" y="104" width="88" height="56" rx="4" fill="none" stroke="currentColor" stroke-width="1.3"/>
    <line x1="214" y1="123" x2="302" y2="123" stroke="currentColor" stroke-width="0.7" opacity="0.5"/>
    <line x1="214" y1="142" x2="302" y2="142" stroke="currentColor" stroke-width="0.7" opacity="0.5"/>
    <line x1="236" y1="104" x2="236" y2="160" stroke="currentColor" stroke-width="0.7" opacity="0.5"/>
    <line x1="258" y1="104" x2="258" y2="160" stroke="currentColor" stroke-width="0.7" opacity="0.5"/>
    <line x1="280" y1="104" x2="280" y2="160" stroke="currentColor" stroke-width="0.7" opacity="0.5"/>
    <text x="258" y="176" font-size="11" text-anchor="middle" fill="currentColor">item embeddings</text>
    <text x="258" y="190" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.55">10⁸ × d</text>
    <line x1="258" y1="196" x2="258" y2="210" stroke="currentColor" stroke-width="1.2"/>
    <polygon points="258,216 254.5,209 261.5,209" fill="currentColor"/>
    <rect x="214" y="216" width="88" height="44" rx="6" fill="none" stroke="currentColor" stroke-width="1.3"/>
    <text x="258" y="242" font-size="12" text-anchor="middle" fill="currentColor" font-weight="600">ANN index</text>
  </g>

  <!-- online side (active) -->
  <g>
    <rect x="360" y="44" width="150" height="44" rx="6" fill="none" stroke="currentColor" stroke-width="1.3"/>
    <text x="435" y="62" font-size="12" text-anchor="middle" fill="currentColor" font-weight="600">request</text>
    <text x="435" y="79" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.55">user + context features</text>
    <line x1="435" y1="88" x2="435" y2="106" stroke="currentColor" stroke-width="1.2"/>
    <polygon points="435,112 431.5,105 438.5,105" fill="currentColor"/>
    <rect x="360" y="112" width="150" height="40" rx="6" fill="#e2903a" fill-opacity="0.12" stroke="#e2903a" stroke-width="1.4"/>
    <text x="435" y="136" font-size="12" text-anchor="middle" fill="currentColor" font-weight="600">user tower u(·)</text>
    <line x1="435" y1="152" x2="435" y2="170" stroke="#e2903a" stroke-width="1.6"/>
    <polygon points="435,176 431.5,169 438.5,169" fill="#e2903a"/>
    <rect x="400" y="176" width="70" height="30" rx="4" fill="#e2903a" fill-opacity="0.12" stroke="#e2903a" stroke-width="1.4"/>
    <text x="435" y="196" font-size="12" text-anchor="middle" fill="currentColor" font-weight="600">u(x)</text>
    <text x="435" y="224" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.55">one forward pass per request</text>
  </g>

  <text x="16" y="292" font-size="12" fill="currentColor" font-weight="600">3 · a request arrives: embed the user, live</text>
</svg>

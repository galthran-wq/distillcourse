<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <marker id="amber-arr-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e2903a"/>
    </marker>
  </defs>

  <!-- left group -->
  <rect x="50" y="52" width="140" height="44" rx="6" fill="none" stroke="currentColor"/>
  <text x="120" y="79" font-size="12" fill="currentColor" text-anchor="middle">replica 1</text>
  <rect x="50" y="118" width="140" height="44" rx="6" fill="none" stroke="currentColor"/>
  <text x="120" y="145" font-size="12" fill="currentColor" text-anchor="middle">replica 2</text>
  <line x1="120" y1="96" x2="120" y2="118" stroke="currentColor" opacity="0.5"/>

  <!-- partition -->
  <path d="M 320 28 L 310 68 L 330 108 L 310 148 L 330 188 L 320 224" fill="none" stroke="currentColor" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="320" y="20" font-size="11" fill="currentColor" text-anchor="middle">network partition</text>

  <!-- severed links -->
  <line x1="190" y1="74" x2="450" y2="107" stroke="currentColor" opacity="0.25" stroke-dasharray="3 3"/>
  <line x1="190" y1="140" x2="450" y2="121" stroke="currentColor" opacity="0.25" stroke-dasharray="3 3"/>

  <!-- right group -->
  <rect x="450" y="92" width="140" height="44" rx="6" fill="none" stroke="currentColor"/>
  <text x="520" y="119" font-size="12" fill="currentColor" text-anchor="middle">replica 3</text>

  <!-- incoming write -->
  <line x1="600" y1="40" x2="545" y2="88" stroke="#e2903a" stroke-width="1.8" marker-end="url(#amber-arr-c)"/>
  <text x="560" y="34" font-size="11" fill="#e2903a">a write arrives</text>

  <!-- options -->
  <text x="380" y="180" font-size="12" fill="#4c8dd6">refuse it until the partition heals →</text>
  <text x="380" y="196" font-size="12" fill="#4c8dd6">consistent, but unavailable here</text>
  <text x="380" y="224" font-size="12" fill="#e2903a">accept it locally →</text>
  <text x="380" y="240" font-size="12" fill="#e2903a">available, but the copies diverge</text>

  <text x="120" y="200" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">this side cannot learn of the</text>
  <text x="120" y="216" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">write either way</text>
</svg>

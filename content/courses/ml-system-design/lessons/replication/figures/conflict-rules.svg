<svg viewBox="0 0 640 310" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- left panel: last write wins -->
  <text x="160" y="26" font-size="12" fill="currentColor" text-anchor="middle" font-weight="bold">last write wins: keep the larger stamp</text>
  <text x="160" y="44" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">concurrent writes to one card record</text>

  <rect x="28" y="60" width="126" height="58" rx="5" fill="none" stroke="#4c8dd6"/>
  <text x="91" y="76" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">leader 1</text>
  <text x="91" y="92" font-size="11" fill="currentColor" text-anchor="middle">raise limit</text>
  <text x="91" y="108" font-size="11" fill="#4c8dd6" text-anchor="middle">t = 12:00:00</text>

  <rect x="166" y="60" width="126" height="58" rx="5" fill="#e2903a" fill-opacity="0.12" stroke="#e2903a"/>
  <text x="229" y="76" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">leader 2, clock 10 s slow</text>
  <text x="229" y="92" font-size="11" fill="currentColor" text-anchor="middle">freeze card</text>
  <text x="229" y="108" font-size="11" fill="#e2903a" text-anchor="middle">t = 11:59:55</text>

  <line x1="91" y1="118" x2="148" y2="168" stroke="currentColor" opacity="0.5"/>
  <line x1="229" y1="118" x2="172" y2="168" stroke="currentColor" opacity="0.5" stroke-dasharray="3 3"/>
  <polygon points="160,178 154,166 166,166" fill="currentColor" opacity="0.5"/>

  <rect x="78" y="182" width="164" height="36" rx="5" fill="#5aa46a" fill-opacity="0.15" stroke="#5aa46a"/>
  <text x="160" y="204" font-size="11" fill="currentColor" text-anchor="middle">every replica: limit raised</text>

  <text x="160" y="248" font-size="12" fill="#e2903a" text-anchor="middle">freeze discarded</text>
  <text x="160" y="266" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">a confirmed write, silently dropped</text>

  <!-- divider -->
  <line x1="322" y1="20" x2="322" y2="290" stroke="currentColor" opacity="0.25" stroke-dasharray="3 3"/>

  <!-- right panel: union merge -->
  <text x="482" y="26" font-size="12" fill="currentColor" text-anchor="middle" font-weight="bold">union merge: keep every addition</text>
  <text x="482" y="44" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">both leaders start from cart {A}</text>

  <rect x="350" y="60" width="126" height="58" rx="5" fill="#e2903a" fill-opacity="0.12" stroke="#e2903a"/>
  <text x="413" y="76" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">leader 1</text>
  <text x="413" y="92" font-size="11" fill="currentColor" text-anchor="middle">remove A</text>
  <text x="413" y="108" font-size="11" fill="#e2903a" text-anchor="middle">cart: { }</text>

  <rect x="488" y="60" width="126" height="58" rx="5" fill="none" stroke="#4c8dd6"/>
  <text x="551" y="76" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">leader 2</text>
  <text x="551" y="92" font-size="11" fill="currentColor" text-anchor="middle">add B</text>
  <text x="551" y="108" font-size="11" fill="#4c8dd6" text-anchor="middle">cart: {A, B}</text>

  <line x1="413" y1="118" x2="470" y2="168" stroke="currentColor" opacity="0.5" stroke-dasharray="3 3"/>
  <line x1="551" y1="118" x2="494" y2="168" stroke="currentColor" opacity="0.5"/>
  <polygon points="482,178 476,166 488,166" fill="currentColor" opacity="0.5"/>

  <rect x="400" y="182" width="164" height="36" rx="5" fill="#5aa46a" fill-opacity="0.15" stroke="#5aa46a"/>
  <text x="482" y="204" font-size="11" fill="currentColor" text-anchor="middle">every replica: cart {A, B}</text>

  <text x="482" y="248" font-size="12" fill="#e2903a" text-anchor="middle">deleted A resurrects</text>
  <text x="482" y="266" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">the removal loses to the union</text>
</svg>

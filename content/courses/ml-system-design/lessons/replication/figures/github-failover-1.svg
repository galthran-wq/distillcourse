<svg viewBox="0 0 640 315" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <marker id="cur-arr-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/>
    </marker>
  </defs>

  <text x="320" y="22" font-size="12" fill="currentColor" text-anchor="middle" font-weight="bold">1 — healthy: the follower lags four writes</text>

  <!-- leader box -->
  <g>
    <rect x="40" y="42" width="230" height="96" rx="6" fill="none" stroke="currentColor"/>
    <text x="155" y="64" font-size="13" fill="currentColor" text-anchor="middle" font-weight="bold">MySQL leader</text>
    <text x="155" y="88" font-size="12" fill="currentColor" text-anchor="middle">next primary key: 4571</text>
    <text x="155" y="108" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">rows 4567–4570 written,</text>
    <text x="155" y="122" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">4567 = user A's record</text>
  </g>

  <!-- replication arrow -->
  <line x1="272" y1="90" x2="366" y2="90" stroke="currentColor" stroke-width="1.6" marker-end="url(#cur-arr-1)"/>
  <text x="320" y="80" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">async log, lagging</text>

  <!-- follower box -->
  <g>
    <rect x="370" y="42" width="230" height="96" rx="6" fill="none" stroke="currentColor"/>
    <text x="485" y="64" font-size="13" fill="currentColor" text-anchor="middle" font-weight="bold">MySQL follower</text>
    <text x="485" y="88" font-size="12" fill="currentColor" text-anchor="middle">next primary key: 4567</text>
    <text x="485" y="108" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">has not yet received</text>
    <text x="485" y="122" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">writes 4567–4570</text>
  </g>

  <!-- redis box -->
  <g>
    <rect x="205" y="212" width="230" height="62" rx="6" fill="none" stroke="currentColor"/>
    <text x="320" y="234" font-size="13" fill="currentColor" text-anchor="middle" font-weight="bold">Redis</text>
    <text x="320" y="256" font-size="12" fill="currentColor" text-anchor="middle">4567 → user A's data</text>
  </g>

  <!-- leader to redis -->
  <line x1="150" y1="140" x2="240" y2="209" stroke="currentColor" stroke-width="1.6" marker-end="url(#cur-arr-1)"/>
  <text x="90" y="180" font-size="11" fill="currentColor" opacity="0.55">keys cached</text>
  <text x="90" y="194" font-size="11" fill="currentColor" opacity="0.55">at write time</text>

  <text x="320" y="302" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">normal operation: the lag is invisible as long as the leader lives</text>
</svg>

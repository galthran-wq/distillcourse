<svg viewBox="0 0 640 315" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <marker id="amber-arr-4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e2903a"/>
    </marker>
  </defs>

  <text x="320" y="22" font-size="12" fill="currentColor" text-anchor="middle" font-weight="bold">4 — a request about user B's row 4567 is answered from Redis</text>

  <!-- old leader box (dead) -->
  <g opacity="0.35">
    <rect x="40" y="42" width="230" height="96" rx="6" fill="none" stroke="currentColor"/>
    <text x="155" y="64" font-size="13" fill="currentColor" text-anchor="middle" font-weight="bold">MySQL leader</text>
    <text x="155" y="88" font-size="12" fill="currentColor" text-anchor="middle">next primary key: 4571</text>
    <text x="155" y="108" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">rows 4567–4570 written,</text>
    <text x="155" y="122" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">4567 = user A's record</text>
  </g>
  <line x1="52" y1="52" x2="258" y2="128" stroke="currentColor" stroke-width="2.4"/>
  <line x1="258" y1="52" x2="52" y2="128" stroke="currentColor" stroke-width="2.4"/>

  <!-- follower box, promoted -->
  <g>
    <rect x="370" y="42" width="230" height="96" rx="6" fill="none" stroke="currentColor"/>
    <text x="485" y="64" font-size="13" fill="currentColor" text-anchor="middle" font-weight="bold">new leader</text>
    <text x="485" y="88" font-size="12" fill="currentColor" text-anchor="middle">4567 = user B's record</text>
    <text x="485" y="108" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">serving reads and writes</text>
  </g>

  <!-- lookup arrow follower -> redis -->
  <line x1="450" y1="140" x2="400" y2="209" stroke="#e2903a" stroke-width="1.8" marker-end="url(#amber-arr-4)"/>
  <text x="452" y="180" font-size="11" fill="#e2903a">look up 4567</text>

  <!-- redis box -->
  <g>
    <rect x="205" y="212" width="230" height="62" rx="6" fill="none" stroke="#e2903a" stroke-width="2"/>
    <text x="320" y="234" font-size="13" fill="#e2903a" text-anchor="middle" font-weight="bold">Redis</text>
    <text x="320" y="256" font-size="12" fill="#e2903a" text-anchor="middle">4567 → user A's data</text>
  </g>

  <text x="320" y="302" font-size="12" fill="#e2903a" text-anchor="middle" font-weight="bold">user A's private data is served on user B's request</text>
</svg>

<svg viewBox="0 0 480 240" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <marker id="amber-arr-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e2903a"/>
    </marker>
    <marker id="blue-arr-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4c8dd6"/>
    </marker>
  </defs>

  <rect x="20" y="36" width="180" height="52" rx="6" fill="none" stroke="currentColor"/>
  <text x="110" y="59" font-size="12" fill="currentColor" text-anchor="middle">replica A</text>
  <text x="110" y="76" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">caught up</text>

  <rect x="280" y="36" width="180" height="52" rx="6" fill="none" stroke="currentColor"/>
  <text x="370" y="59" font-size="12" fill="currentColor" text-anchor="middle">replica B</text>
  <text x="370" y="76" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">20 s behind</text>

  <circle cx="240" cy="172" r="6" fill="currentColor"/>
  <text x="240" y="196" font-size="11" fill="currentColor" text-anchor="middle">one reader, two refreshes</text>

  <line x1="228" y1="164" x2="128" y2="92" stroke="#e2903a" stroke-width="1.8" marker-end="url(#amber-arr-m)"/>
  <text x="100" y="130" font-size="11" fill="#e2903a">1. read: comment shown</text>

  <line x1="252" y1="164" x2="352" y2="92" stroke="#4c8dd6" stroke-width="1.8" marker-end="url(#blue-arr-m)"/>
  <text x="296" y="130" font-size="11" fill="#4c8dd6">2. read: comment gone</text>

  <text x="240" y="228" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">monotonic reads</tspan>: a reader never observes the database moving backward</text>
</svg>

<svg viewBox="0 0 520 240" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <marker id="amber-arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e2903a"/>
    </marker>
    <marker id="blue-arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4c8dd6"/>
    </marker>
  </defs>

  <text x="18" y="52" font-size="11" fill="#e2903a">the question — slow replica path</text>
  <line x1="18" y1="72" x2="390" y2="72" stroke="#e2903a" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#amber-arr-p)"/>
  <text x="204" y="90" font-size="11" fill="#e2903a" text-anchor="middle">arrives second</text>

  <text x="18" y="126" font-size="11" fill="#4c8dd6">the answer — fast replica path</text>
  <line x1="18" y1="146" x2="390" y2="146" stroke="#4c8dd6" stroke-width="1.8" marker-end="url(#blue-arr-p)"/>
  <text x="204" y="164" font-size="11" fill="#4c8dd6" text-anchor="middle">arrives first</text>

  <rect x="404" y="70" width="100" height="80" rx="6" fill="none" stroke="currentColor"/>
  <text x="454" y="96" font-size="12" fill="currentColor" text-anchor="middle">observer</text>
  <text x="454" y="118" font-size="11" fill="#4c8dd6" text-anchor="middle">hears answer,</text>
  <text x="454" y="136" font-size="11" fill="#e2903a" text-anchor="middle">then question</text>

  <text x="260" y="220" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">consistent prefix</tspan>: writes are observed in the order they were made</text>
</svg>

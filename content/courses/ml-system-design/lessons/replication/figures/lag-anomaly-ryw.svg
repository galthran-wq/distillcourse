<svg viewBox="0 0 480 240" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <marker id="amber-arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e2903a"/>
    </marker>
    <marker id="blue-arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4c8dd6"/>
    </marker>
    <marker id="cur-arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/>
    </marker>
  </defs>

  <rect x="30" y="36" width="150" height="52" rx="6" fill="none" stroke="currentColor"/>
  <text x="105" y="66" font-size="12" fill="currentColor" text-anchor="middle">leader</text>

  <rect x="300" y="36" width="150" height="52" rx="6" fill="none" stroke="currentColor"/>
  <text x="375" y="59" font-size="12" fill="currentColor" text-anchor="middle">follower</text>
  <text x="375" y="76" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">lagging</text>

  <line x1="184" y1="62" x2="296" y2="62" stroke="currentColor" opacity="0.5" stroke-dasharray="3 3" marker-end="url(#cur-arr-r)"/>
  <text x="240" y="54" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">log</text>

  <circle cx="240" cy="172" r="6" fill="currentColor"/>
  <text x="240" y="196" font-size="11" fill="currentColor" text-anchor="middle">the same user</text>

  <line x1="228" y1="164" x2="118" y2="92" stroke="#e2903a" stroke-width="1.8" marker-end="url(#amber-arr-r)"/>
  <text x="118" y="132" font-size="11" fill="#e2903a">1. post comment</text>

  <line x1="252" y1="164" x2="362" y2="92" stroke="#4c8dd6" stroke-width="1.8" marker-end="url(#blue-arr-r)"/>
  <text x="252" y="118" font-size="11" fill="#4c8dd6">2. refresh</text>
  <text x="352" y="110" font-size="11" fill="#4c8dd6">comment missing</text>

  <text x="240" y="228" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">read-your-writes</tspan>: a client's later reads include its own earlier writes</text>
</svg>

<svg viewBox="0 0 640 285" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <marker id="amber-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e2903a"/>
    </marker>
    <marker id="blue-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4c8dd6"/>
    </marker>
  </defs>

  <!-- lifelines -->
  <line x1="122" y1="50" x2="628" y2="50" stroke="currentColor" opacity="0.25"/>
  <line x1="122" y1="115" x2="628" y2="115" stroke="currentColor" opacity="0.25"/>
  <line x1="122" y1="180" x2="628" y2="180" stroke="currentColor" opacity="0.25"/>
  <line x1="122" y1="245" x2="628" y2="245" stroke="currentColor" opacity="0.25"/>

  <text x="8" y="54" font-size="12" fill="currentColor">client</text>
  <text x="8" y="119" font-size="12" fill="currentColor">leader</text>
  <text x="8" y="177" font-size="12" fill="currentColor">follower 1</text>
  <text x="8" y="191" font-size="10" fill="currentColor" opacity="0.55">(synchronous)</text>
  <text x="8" y="242" font-size="12" fill="currentColor">follower 2</text>
  <text x="8" y="256" font-size="10" fill="currentColor" opacity="0.55">(asynchronous)</text>

  <!-- write from client to leader -->
  <line x1="152" y1="50" x2="185" y2="112" stroke="#e2903a" stroke-width="1.8" marker-end="url(#amber-arr)"/>
  <text x="108" y="80" font-size="11" fill="#e2903a">write</text>
  <circle cx="190" cy="115" r="4" fill="#e2903a"/>
  <text x="176" y="103" font-size="10" fill="currentColor" opacity="0.55">applied locally</text>

  <!-- replication to follower 1 (sync) -->
  <line x1="197" y1="118" x2="235" y2="177" stroke="#e2903a" stroke-width="1.8" marker-end="url(#amber-arr)"/>
  <circle cx="239" cy="180" r="4" fill="#e2903a"/>

  <!-- ack from follower 1 -->
  <line x1="247" y1="177" x2="280" y2="118" stroke="#4c8dd6" stroke-width="1.8" marker-end="url(#blue-arr)"/>
  <text x="262" y="156" font-size="11" fill="#4c8dd6">ack</text>

  <!-- ok to client -->
  <line x1="288" y1="112" x2="320" y2="53" stroke="#4c8dd6" stroke-width="1.8" marker-end="url(#blue-arr)"/>
  <text x="316" y="90" font-size="11" fill="#4c8dd6">ok</text>
  <text x="330" y="42" font-size="10" fill="currentColor" opacity="0.55">success reported only after the synchronous ack</text>

  <!-- replication to follower 2 (async, delayed) -->
  <line x1="197" y1="118" x2="428" y2="242" stroke="#e2903a" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#amber-arr)"/>
  <circle cx="433" cy="245" r="4" fill="#e2903a"/>
  <text x="445" y="235" font-size="10" fill="currentColor" opacity="0.55">applied late; no ack awaited</text>

  <!-- lag bracket -->
  <line x1="190" y1="268" x2="433" y2="268" stroke="currentColor" opacity="0.5" stroke-dasharray="3 3"/>
  <line x1="190" y1="262" x2="190" y2="274" stroke="currentColor" opacity="0.5"/>
  <line x1="433" y1="262" x2="433" y2="274" stroke="currentColor" opacity="0.5"/>
  <text x="255" y="281" font-size="11" fill="currentColor">replication lag on follower 2</text>
</svg>

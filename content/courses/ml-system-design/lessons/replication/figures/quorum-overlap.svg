<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- left panel: strict quorum -->
  <text x="160" y="30" font-size="12" fill="currentColor" text-anchor="middle" font-weight="bold">strict quorum: n = 5, w = 3, r = 3</text>

  <!-- write bracket -->
  <text x="105" y="78" font-size="11" fill="#e2903a" text-anchor="middle">write reached w = 3</text>
  <line x1="30" y1="88" x2="180" y2="88" stroke="#e2903a" opacity="0.7"/>

  <!-- nodes -->
  <circle cx="50" cy="140" r="20" fill="#e2903a" fill-opacity="0.3" stroke="#e2903a"/>
  <circle cx="105" cy="140" r="20" fill="#e2903a" fill-opacity="0.3" stroke="#e2903a"/>
  <circle cx="160" cy="140" r="20" fill="#e2903a" fill-opacity="0.3" stroke="#e2903a"/>
  <circle cx="215" cy="140" r="20" fill="none" stroke="currentColor"/>
  <circle cx="270" cy="140" r="20" fill="none" stroke="currentColor"/>
  <text x="50" y="145" font-size="11" fill="currentColor" text-anchor="middle">1</text>
  <text x="105" y="145" font-size="11" fill="currentColor" text-anchor="middle">2</text>
  <text x="160" y="145" font-size="11" fill="currentColor" text-anchor="middle">3</text>
  <text x="215" y="145" font-size="11" fill="currentColor" text-anchor="middle">4</text>
  <text x="270" y="145" font-size="11" fill="currentColor" text-anchor="middle">5</text>

  <!-- read rings -->
  <circle cx="160" cy="140" r="28" fill="none" stroke="#4c8dd6" stroke-width="1.8"/>
  <circle cx="215" cy="140" r="28" fill="none" stroke="#4c8dd6" stroke-width="1.8"/>
  <circle cx="270" cy="140" r="28" fill="none" stroke="#4c8dd6" stroke-width="1.8"/>
  <line x1="160" y1="182" x2="270" y2="182" stroke="#4c8dd6" opacity="0.7"/>
  <text x="215" y="200" font-size="11" fill="#4c8dd6" text-anchor="middle">read asks r = 3</text>

  <!-- overlap pointer -->
  <line x1="160" y1="112" x2="160" y2="96" stroke="#5aa46a" stroke-width="1.6"/>
  <text x="204" y="106" font-size="11" fill="#5aa46a" text-anchor="middle">node 3 is in both sets</text>
  <text x="160" y="238" font-size="12" fill="currentColor" text-anchor="middle">w + r = 6 &gt; n = 5:</text>
  <text x="160" y="256" font-size="12" fill="#5aa46a" text-anchor="middle">the sets must overlap</text>

  <!-- divider -->
  <line x1="322" y1="24" x2="322" y2="276" stroke="currentColor" opacity="0.25" stroke-dasharray="3 3"/>

  <!-- right panel: sloppy quorum -->
  <text x="482" y="30" font-size="12" fill="currentColor" text-anchor="middle" font-weight="bold">sloppy quorum: same counters, moved sets</text>

  <!-- home nodes, first three unreachable from the writer -->
  <g opacity="0.35">
    <circle cx="370" cy="140" r="20" fill="none" stroke="currentColor"/>
    <circle cx="425" cy="140" r="20" fill="none" stroke="currentColor"/>
    <line x1="358" y1="128" x2="382" y2="152" stroke="currentColor" stroke-width="1.6"/>
    <line x1="382" y1="128" x2="358" y2="152" stroke="currentColor" stroke-width="1.6"/>
    <line x1="413" y1="128" x2="437" y2="152" stroke="currentColor" stroke-width="1.6"/>
    <line x1="437" y1="128" x2="413" y2="152" stroke="currentColor" stroke-width="1.6"/>
  </g>
  <circle cx="480" cy="140" r="20" fill="none" stroke="currentColor"/>
  <circle cx="535" cy="140" r="20" fill="none" stroke="currentColor"/>
  <circle cx="590" cy="140" r="20" fill="none" stroke="currentColor"/>
  <text x="480" y="145" font-size="11" fill="currentColor" text-anchor="middle">3</text>
  <text x="535" y="145" font-size="11" fill="currentColor" text-anchor="middle">4</text>
  <text x="590" y="145" font-size="11" fill="currentColor" text-anchor="middle">5</text>
  <text x="397" y="80" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">home nodes 1, 2 unreachable</text>

  <!-- read rings on home nodes 3-5 -->
  <circle cx="480" cy="140" r="28" fill="none" stroke="#4c8dd6" stroke-width="1.8"/>
  <circle cx="535" cy="140" r="28" fill="none" stroke="#4c8dd6" stroke-width="1.8"/>
  <circle cx="590" cy="140" r="28" fill="none" stroke="#4c8dd6" stroke-width="1.8"/>
  <text x="535" y="200" font-size="11" fill="#4c8dd6" text-anchor="middle">read asks r = 3 home nodes</text>

  <!-- stand-in nodes that took the write -->
  <circle cx="370" cy="230" r="16" fill="#e2903a" fill-opacity="0.3" stroke="#e2903a"/>
  <circle cx="414" cy="230" r="16" fill="#e2903a" fill-opacity="0.3" stroke="#e2903a"/>
  <circle cx="458" cy="230" r="16" fill="#e2903a" fill-opacity="0.3" stroke="#e2903a"/>
  <text x="414" y="266" font-size="11" fill="#e2903a" text-anchor="middle">write landed on w = 3 stand-ins</text>

  <text x="558" y="226" font-size="12" fill="currentColor" text-anchor="middle">w + r = 6 &gt; n = 5,</text>
  <text x="558" y="244" font-size="12" fill="currentColor" text-anchor="middle">yet no overlap</text>
</svg>

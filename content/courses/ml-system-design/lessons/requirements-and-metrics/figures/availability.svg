<svg viewBox="0 0 640 250" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- series -->
  <text x="30" y="26" font-size="13" fill="currentColor" font-weight="600">In series — both must be up</text>

  <circle cx="45" cy="62" r="5" fill="currentColor"/>
  <line x1="50" y1="62" x2="90" y2="62" stroke="currentColor" stroke-width="1.2"/>
  <path d="M90 62 l-7 -4 v8 z" fill="currentColor"/>
  <rect x="92" y="42" width="120" height="40" rx="5" fill="none" stroke="currentColor"/>
  <text x="152" y="60" font-size="11" fill="currentColor" text-anchor="middle">feature store</text>
  <text x="152" y="75" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">99.9%</text>
  <line x1="212" y1="62" x2="252" y2="62" stroke="currentColor" stroke-width="1.2"/>
  <path d="M252 62 l-7 -4 v8 z" fill="currentColor"/>
  <rect x="254" y="42" width="120" height="40" rx="5" fill="none" stroke="currentColor"/>
  <text x="314" y="60" font-size="11" fill="currentColor" text-anchor="middle">model server</text>
  <text x="314" y="75" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">99.9%</text>
  <line x1="374" y1="62" x2="410" y2="62" stroke="currentColor" stroke-width="1.2"/>
  <path d="M410 62 l-7 -4 v8 z" fill="currentColor"/>

  <text x="430" y="58" font-size="12" fill="#e2903a" font-weight="600">0.999 × 0.999 = 99.8%</text>
  <text x="430" y="76" font-size="10" fill="currentColor" opacity="0.55">every dependency spends nines</text>

  <line x1="30" y1="112" x2="610" y2="112" stroke="currentColor" stroke-dasharray="3 3" opacity="0.4"/>

  <!-- parallel -->
  <text x="30" y="140" font-size="13" fill="currentColor" font-weight="600">In parallel — either can answer</text>

  <circle cx="45" cy="192" r="5" fill="currentColor"/>
  <line x1="50" y1="192" x2="88" y2="166" stroke="currentColor" stroke-width="1.2"/>
  <line x1="50" y1="192" x2="88" y2="218" stroke="currentColor" stroke-width="1.2"/>
  <rect x="92" y="148" width="120" height="34" rx="5" fill="none" stroke="#5aa46a"/>
  <text x="152" y="164" font-size="11" fill="currentColor" text-anchor="middle">replica A</text>
  <text x="152" y="177" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">99.9%</text>
  <rect x="92" y="202" width="120" height="34" rx="5" fill="none" stroke="#5aa46a"/>
  <text x="152" y="218" font-size="11" fill="currentColor" text-anchor="middle">replica B</text>
  <text x="152" y="231" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">99.9%</text>
  <line x1="212" y1="165" x2="252" y2="190" stroke="currentColor" stroke-width="1.2"/>
  <line x1="212" y1="219" x2="252" y2="194" stroke="currentColor" stroke-width="1.2"/>
  <line x1="252" y1="192" x2="290" y2="192" stroke="currentColor" stroke-width="1.2"/>
  <path d="M290 192 l-7 -4 v8 z" fill="currentColor"/>

  <text x="310" y="188" font-size="12" fill="#5aa46a" font-weight="600">1 − 0.001 × 0.001 = 99.9999%</text>
  <text x="310" y="206" font-size="10" fill="currentColor" opacity="0.55">fails only when both fail — six nines from two three-nine boxes</text>
</svg>

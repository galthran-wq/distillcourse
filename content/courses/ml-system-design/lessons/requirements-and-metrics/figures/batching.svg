<svg viewBox="0 0 640 250" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="60" y="30" font-size="12" fill="currentColor" font-weight="600">one query at a time</text>
  <text x="360" y="30" font-size="11" fill="#4c8dd6">latency 10 ms each · throughput 100 queries/s</text>

  <!-- 10 sequential blocks, 10 ms each (5.6 px/ms) -->
  <g fill="none" stroke="#4c8dd6" stroke-width="1.5">
    <rect x="60" y="40" width="56" height="22" rx="3"/>
    <rect x="116" y="40" width="56" height="22" rx="3"/>
    <rect x="172" y="40" width="56" height="22" rx="3"/>
    <rect x="228" y="40" width="56" height="22" rx="3"/>
    <rect x="284" y="40" width="56" height="22" rx="3"/>
    <rect x="340" y="40" width="56" height="22" rx="3"/>
    <rect x="396" y="40" width="56" height="22" rx="3"/>
    <rect x="452" y="40" width="56" height="22" rx="3"/>
    <rect x="508" y="40" width="56" height="22" rx="3"/>
    <rect x="564" y="40" width="56" height="22" rx="3"/>
  </g>
  <text x="88" y="55" font-size="10" fill="#4c8dd6" text-anchor="middle">q1</text>
  <text x="144" y="55" font-size="10" fill="#4c8dd6" text-anchor="middle">q2</text>
  <text x="592" y="55" font-size="10" fill="#4c8dd6" text-anchor="middle">q10</text>
  <text x="340" y="80" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">10 queries take 100 ms of wall time</text>

  <text x="60" y="122" font-size="12" fill="currentColor" font-weight="600">one batch of 50</text>
  <text x="360" y="122" font-size="11" fill="#e2903a">latency 20 ms (2×) · throughput 2,500/s (25×)</text>

  <rect x="60" y="132" width="112" height="48" rx="3" fill="#e2903a" opacity="0.85"/>
  <text x="116" y="153" font-size="10" fill="#fff" text-anchor="middle">50 queries</text>
  <text x="116" y="167" font-size="10" fill="#fff" text-anchor="middle">one 20 ms pass</text>
  <text x="185" y="160" font-size="10" fill="currentColor" opacity="0.55">every query waits 20 ms — and 50 finish at once</text>

  <!-- time axis -->
  <line x1="60" y1="205" x2="620" y2="205" stroke="currentColor"/>
  <g stroke="currentColor">
    <line x1="60" y1="205" x2="60" y2="210"/>
    <line x1="172" y1="205" x2="172" y2="210"/>
    <line x1="284" y1="205" x2="284" y2="210"/>
    <line x1="396" y1="205" x2="396" y2="210"/>
    <line x1="508" y1="205" x2="508" y2="210"/>
    <line x1="620" y1="205" x2="620" y2="210"/>
  </g>
  <g font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">
    <text x="60" y="224">0</text>
    <text x="172" y="224">20</text>
    <text x="284" y="224">40</text>
    <text x="396" y="224">60</text>
    <text x="508" y="224">80</text>
    <text x="620" y="224">100 ms</text>
  </g>
</svg>

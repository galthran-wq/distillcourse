<svg viewBox="0 0 640 250" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- axes -->
  <line x1="50" y1="195" x2="620" y2="195" stroke="currentColor" stroke-width="1"/>
  <text x="335" y="242" font-size="12" fill="currentColor" text-anchor="middle">response time (ms)</text>
  <text x="22" y="110" font-size="12" fill="currentColor" text-anchor="middle" transform="rotate(-90 22 110)">requests</text>

  <!-- x ticks: scale x = 50 + t*0.45 -->
  <g font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">
    <text x="50" y="210">0</text>
    <text x="140" y="210">200</text>
    <text x="230" y="210">400</text>
    <text x="320" y="210">600</text>
    <text x="410" y="210">800</text>
    <text x="500" y="210">1000</text>
    <text x="590" y="210">1200</text>
  </g>

  <!-- histogram bars (right-skewed), width 8 -->
  <g fill="currentColor" opacity="0.45">
    <rect x="64" y="165" width="8" height="30"/>
    <rect x="73" y="125" width="8" height="70"/>
    <rect x="82" y="85" width="8" height="110"/>
    <rect x="91" y="72" width="8" height="123"/>
    <rect x="100" y="95" width="8" height="100"/>
    <rect x="109" y="120" width="8" height="75"/>
    <rect x="118" y="140" width="8" height="55"/>
    <rect x="127" y="157" width="8" height="38"/>
    <rect x="136" y="168" width="8" height="27"/>
    <rect x="154" y="177" width="8" height="18"/>
    <rect x="172" y="182" width="8" height="13"/>
    <rect x="190" y="185" width="8" height="10"/>
    <rect x="217" y="187" width="8" height="8"/>
    <rect x="248" y="189" width="8" height="6"/>
    <rect x="293" y="190" width="8" height="5"/>
    <rect x="361" y="191" width="8" height="4"/>
    <rect x="451" y="192" width="8" height="3"/>
    <rect x="586" y="192" width="8" height="3"/>
  </g>

  <!-- percentile guides -->
  <g stroke="currentColor" stroke-dasharray="3 3" opacity="0.6">
    <line x1="99" y1="40" x2="99" y2="195"/>
    <line x1="230" y1="40" x2="230" y2="195"/>
    <line x1="590" y1="40" x2="590" y2="195"/>
  </g>
  <g font-size="11" fill="currentColor" text-anchor="middle">
    <text x="99" y="32">p50 = 110</text>
    <text x="230" y="32">p95 = 400</text>
    <text x="590" y="32">p99 = 1200</text>
  </g>

  <!-- mean marker -->
  <line x1="131" y1="60" x2="131" y2="195" stroke="#e2903a" stroke-width="2"/>
  <circle cx="131" cy="60" r="4" fill="#e2903a"/>
  <text x="143" y="56" font-size="11" fill="#e2903a">mean = 180</text>
  <text x="143" y="70" font-size="10" fill="#e2903a">lands where few requests do</text>

  <!-- tail annotation -->
  <text x="440" y="165" font-size="10" fill="currentColor" opacity="0.55">the tail: ~1% of requests,</text>
  <text x="440" y="178" font-size="10" fill="currentColor" opacity="0.55">and all of the p99 budget</text>
</svg>

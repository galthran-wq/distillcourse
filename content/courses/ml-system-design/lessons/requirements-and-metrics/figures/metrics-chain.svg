<svg viewBox="0 0 660 230" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- four links -->
  <g fill="none" stroke="currentColor" stroke-width="1.5">
    <rect x="15" y="45" width="130" height="54" rx="5"/>
    <rect x="185" y="45" width="130" height="54" rx="5"/>
    <rect x="355" y="45" width="130" height="54" rx="5"/>
  </g>
  <rect x="525" y="45" width="130" height="54" rx="5" fill="none" stroke="#e2903a" stroke-width="2"/>

  <g font-size="12" fill="currentColor" text-anchor="middle" font-weight="600">
    <text x="80" y="66">training loss</text>
    <text x="250" y="66">offline metric</text>
    <text x="420" y="66">online proxy</text>
    <text x="590" y="66" fill="#e2903a">business metric</text>
  </g>
  <g font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">
    <text x="80" y="84">log loss · MSE</text>
    <text x="250" y="84">F1 · WAPE · nDCG</text>
    <text x="420" y="84">CTR · take-rate</text>
    <text x="590" y="84" opacity="1" fill="#e2903a">revenue · retention</text>
  </g>

  <!-- arrows -->
  <g stroke="currentColor" stroke-width="1.5">
    <line x1="145" y1="72" x2="180" y2="72"/>
    <line x1="315" y1="72" x2="350" y2="72"/>
    <line x1="485" y1="72" x2="520" y2="72"/>
  </g>
  <path d="M183 72 l-8 -5 v10 z" fill="currentColor"/>
  <path d="M353 72 l-8 -5 v10 z" fill="currentColor"/>
  <path d="M523 72 l-8 -5 v10 z" fill="currentColor"/>

  <!-- gap annotations -->
  <g stroke="currentColor" stroke-dasharray="3 3" opacity="0.5">
    <line x1="163" y1="80" x2="163" y2="125"/>
    <line x1="333" y1="80" x2="333" y2="125"/>
    <line x1="503" y1="80" x2="503" y2="125"/>
  </g>

  <g font-size="11" fill="#e2903a" text-anchor="middle" font-weight="600">
    <text x="163" y="142">surrogate gap</text>
    <text x="333" y="142">deployment gap</text>
    <text x="503" y="142">attribution gap</text>
  </g>
  <g font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">
    <text x="163" y="158">loss falls,</text>
    <text x="163" y="171">metric flat</text>
    <text x="333" y="158">frozen past vs</text>
    <text x="333" y="171">shifting present (module 6)</text>
    <text x="503" y="158">clicks are not money</text>
    <text x="503" y="171">(A/B tests, module 5)</text>
  </g>

  <text x="335" y="210" font-size="11" fill="currentColor" text-anchor="middle">each arrow is a hypothesis — a link can improve while the next stands still</text>
</svg>

<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- left: blended loss -->
  <text x="155" y="24" font-size="13" fill="currentColor" text-anchor="middle" font-weight="600">One blended loss</text>

  <rect x="55" y="48" width="200" height="56" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="155" y="70" font-size="12" fill="currentColor" text-anchor="middle">single model</text>
  <text x="155" y="90" font-size="11" fill="currentColor" opacity="0.7" text-anchor="middle">L = α·L_quality + β·L_engagement</text>

  <line x1="155" y1="104" x2="155" y2="140" stroke="currentColor" stroke-width="1.2"/>
  <path d="M155 143 l-5 -8 h10 z" fill="currentColor"/>
  <rect x="105" y="146" width="100" height="32" rx="5" fill="none" stroke="currentColor"/>
  <text x="155" y="166" font-size="11" fill="currentColor" text-anchor="middle">one score</text>

  <text x="155" y="210" font-size="11" fill="#e2903a" text-anchor="middle" font-weight="600">retune α  →  retrain the model</text>
  <text x="155" y="228" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">the tradeoff is baked into the weights</text>

  <line x1="320" y1="14" x2="320" y2="240" stroke="currentColor" stroke-dasharray="3 3" opacity="0.4"/>

  <!-- right: decoupled -->
  <text x="480" y="24" font-size="13" fill="currentColor" text-anchor="middle" font-weight="600">Decoupled objectives</text>

  <rect x="345" y="42" width="125" height="42" rx="5" fill="none" stroke="#4c8dd6" stroke-width="1.5"/>
  <text x="407" y="60" font-size="11" fill="currentColor" text-anchor="middle">quality model</text>
  <text x="407" y="76" font-size="10" fill="#4c8dd6" text-anchor="middle">outputs q</text>

  <rect x="490" y="42" width="125" height="42" rx="5" fill="none" stroke="#4c8dd6" stroke-width="1.5"/>
  <text x="552" y="60" font-size="11" fill="currentColor" text-anchor="middle">engagement model</text>
  <text x="552" y="76" font-size="10" fill="#4c8dd6" text-anchor="middle">outputs e</text>

  <line x1="407" y1="84" x2="465" y2="126" stroke="currentColor" stroke-width="1.2"/>
  <line x1="552" y1="84" x2="495" y2="126" stroke="currentColor" stroke-width="1.2"/>

  <rect x="380" y="130" width="200" height="40" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="480" y="147" font-size="11" fill="currentColor" text-anchor="middle">score = α·q + β·e</text>
  <text x="480" y="162" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">α, β are serving-time constants</text>

  <text x="480" y="210" font-size="11" fill="#5aa46a" text-anchor="middle" font-weight="600">retune α  →  change a constant, no retraining</text>
  <text x="480" y="228" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">each model retrains on its own schedule</text>
</svg>

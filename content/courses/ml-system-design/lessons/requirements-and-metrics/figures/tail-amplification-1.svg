  <text x="310" y="22" font-size="13" fill="currentColor" text-anchor="middle">P(page slow) = 1 − (1 − 0.01)<tspan font-size="10" dy="-5">N</tspan><tspan dy="5">   with N = 1:  </tspan><tspan fill="#e2903a" font-weight="600">1%</tspan></text>


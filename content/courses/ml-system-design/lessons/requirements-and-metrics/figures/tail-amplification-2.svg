<svg viewBox="0 0 620 240" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="310" y="22" font-size="13" fill="currentColor" text-anchor="middle">P(page slow) = 1 − (1 − 0.01)<tspan font-size="10" dy="-5">N</tspan><tspan dy="5">   with N = 10:  </tspan><tspan fill="#e2903a" font-weight="600">9.6%</tspan></text>

  <rect x="25" y="100" width="95" height="44" rx="5" fill="none" stroke="currentColor"/>
  <text x="72" y="126" font-size="12" fill="currentColor" text-anchor="middle">user request</text>

  <!-- fan of calls -->
  <g stroke="currentColor" stroke-width="0.8" opacity="0.6">
    <line x1="120" y1="122" x2="268" y2="44"/>
    <line x1="120" y1="122" x2="268" y2="61"/>
    <line x1="120" y1="122" x2="268" y2="78"/>
    <line x1="120" y1="122" x2="268" y2="95"/>
    <line x1="120" y1="122" x2="268" y2="112"/>
    <line x1="120" y1="122" x2="268" y2="129"/>
    <line x1="120" y1="122" x2="268" y2="146"/>
    <line x1="120" y1="122" x2="268" y2="163"/>
    <line x1="120" y1="122" x2="268" y2="180"/>
    <line x1="120" y1="122" x2="268" y2="197"/>
  </g>

  <!-- 10 backends, one slow (amber) -->
  <g fill="none" stroke="currentColor">
    <rect x="270" y="37" width="120" height="14" rx="3"/>
    <rect x="270" y="54" width="120" height="14" rx="3"/>
    <rect x="270" y="88" width="120" height="14" rx="3"/>
    <rect x="270" y="105" width="120" height="14" rx="3"/>
    <rect x="270" y="122" width="120" height="14" rx="3"/>
    <rect x="270" y="139" width="120" height="14" rx="3"/>
    <rect x="270" y="156" width="120" height="14" rx="3"/>
    <rect x="270" y="173" width="120" height="14" rx="3"/>
    <rect x="270" y="190" width="120" height="14" rx="3"/>
  </g>
  <rect x="270" y="71" width="120" height="14" rx="3" fill="#e2903a" stroke="none"/>
  <text x="400" y="82" font-size="10" fill="#e2903a">the slow call — the page waits</text>
  <text x="330" y="222" font-size="11" fill="currentColor" text-anchor="middle">N = 10 parallel calls · each 1% slow</text>

  <!-- gauge -->
  <rect x="470" y="50" width="44" height="140" rx="3" fill="none" stroke="currentColor"/>
  <rect x="471" y="175.6" width="42" height="13.4" fill="#e2903a"/>
  <text x="524" y="186" font-size="12" fill="#e2903a" font-weight="600">9.6%</text>
  <text x="492" y="212" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">slow user</text>
  <text x="492" y="225" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">requests</text>
</svg>

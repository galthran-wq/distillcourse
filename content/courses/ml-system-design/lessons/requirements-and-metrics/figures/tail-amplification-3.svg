<svg viewBox="0 0 620 240" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="310" y="22" font-size="13" fill="currentColor" text-anchor="middle">P(page slow) = 1 − (1 − 0.01)<tspan font-size="10" dy="-5">N</tspan><tspan dy="5">   with N = 100:  </tspan><tspan fill="#e2903a" font-weight="600">63%</tspan></text>

  <rect x="25" y="100" width="95" height="44" rx="5" fill="none" stroke="currentColor"/>
  <text x="72" y="126" font-size="12" fill="currentColor" text-anchor="middle">user request</text>

  <!-- fan of calls -->
  <g stroke="currentColor" stroke-width="0.7" opacity="0.5">
    <line x1="120" y1="122" x2="268" y2="40"/>
    <line x1="120" y1="122" x2="268" y2="60"/>
    <line x1="120" y1="122" x2="268" y2="80"/>
    <line x1="120" y1="122" x2="268" y2="100"/>
    <line x1="120" y1="122" x2="268" y2="120"/>
    <line x1="120" y1="122" x2="268" y2="140"/>
    <line x1="120" y1="122" x2="268" y2="160"/>
    <line x1="120" y1="122" x2="268" y2="180"/>
    <line x1="120" y1="122" x2="268" y2="200"/>
  </g>

  <!-- 100 backends drawn as 20 slats -->
  <g fill="none" stroke="currentColor" opacity="0.8">
    <rect x="270" y="36" width="120" height="5.5" rx="2"/>
    <rect x="270" y="44" width="120" height="5.5" rx="2"/>
    <rect x="270" y="52" width="120" height="5.5" rx="2"/>
    <rect x="270" y="60" width="120" height="5.5" rx="2"/>
    <rect x="270" y="68" width="120" height="5.5" rx="2"/>
    <rect x="270" y="84" width="120" height="5.5" rx="2"/>
    <rect x="270" y="92" width="120" height="5.5" rx="2"/>
    <rect x="270" y="100" width="120" height="5.5" rx="2"/>
    <rect x="270" y="108" width="120" height="5.5" rx="2"/>
    <rect x="270" y="116" width="120" height="5.5" rx="2"/>
    <rect x="270" y="124" width="120" height="5.5" rx="2"/>
    <rect x="270" y="132" width="120" height="5.5" rx="2"/>
    <rect x="270" y="140" width="120" height="5.5" rx="2"/>
    <rect x="270" y="148" width="120" height="5.5" rx="2"/>
    <rect x="270" y="156" width="120" height="5.5" rx="2"/>
    <rect x="270" y="164" width="120" height="5.5" rx="2"/>
    <rect x="270" y="172" width="120" height="5.5" rx="2"/>
    <rect x="270" y="180" width="120" height="5.5" rx="2"/>
    <rect x="270" y="188" width="120" height="5.5" rx="2"/>
  </g>
  <rect x="270" y="76" width="120" height="5.5" rx="2" fill="#e2903a" stroke="none"/>
  <text x="400" y="83" font-size="10" fill="#e2903a">one slow call suffices</text>
  <text x="330" y="222" font-size="11" fill="currentColor" text-anchor="middle">N = 100 parallel calls · each 1% slow</text>

  <!-- gauge -->
  <rect x="470" y="50" width="44" height="140" rx="3" fill="none" stroke="currentColor"/>
  <rect x="471" y="100.8" width="42" height="88.2" fill="#e2903a"/>
  <text x="524" y="150" font-size="12" fill="#e2903a" font-weight="600">63%</text>
  <text x="492" y="212" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">slow user</text>
  <text x="492" y="225" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">requests</text>
</svg>

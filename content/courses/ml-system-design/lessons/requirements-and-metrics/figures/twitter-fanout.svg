<svg viewBox="0 0 640 250" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- Left panel: join at read -->
  <text x="160" y="22" font-size="13" fill="currentColor" text-anchor="middle" font-weight="600">Join at read time</text>

  <text x="30" y="58" font-size="12" fill="currentColor">post</text>
  <text x="30" y="73" font-size="11" fill="#4c8dd6">4.6k writes/s</text>
  <line x1="95" y1="62" x2="140" y2="62" stroke="#4c8dd6" stroke-width="1.5"/>
  <path d="M140 62 l-7 -4 v8 z" fill="#4c8dd6"/>

  <rect x="145" y="42" width="140" height="40" rx="5" fill="none" stroke="currentColor"/>
  <text x="215" y="59" font-size="11" fill="currentColor" text-anchor="middle">global tweet table</text>
  <text x="215" y="74" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">one row per tweet</text>

  <text x="30" y="140" font-size="12" fill="currentColor">read</text>
  <text x="30" y="155" font-size="11" fill="#e2903a">300k reads/s</text>
  <line x1="95" y1="144" x2="140" y2="144" stroke="#e2903a" stroke-width="4"/>
  <path d="M140 144 l-9 -6 v12 z" fill="#e2903a"/>

  <rect x="145" y="122" width="140" height="44" rx="5" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <text x="215" y="140" font-size="11" fill="currentColor" text-anchor="middle">join follows × tweets</text>
  <text x="215" y="156" font-size="10" fill="#e2903a" text-anchor="middle">runs 300,000× per second</text>

  <text x="160" y="205" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">writes cheap · every read does the work</text>

  <line x1="320" y1="14" x2="320" y2="215" stroke="currentColor" stroke-dasharray="3 3" opacity="0.4"/>

  <!-- Right panel: fan out on write -->
  <text x="480" y="22" font-size="13" fill="currentColor" text-anchor="middle" font-weight="600">Fan out on write</text>

  <text x="345" y="58" font-size="12" fill="currentColor">post</text>
  <text x="345" y="73" font-size="11" fill="#e2903a">4.6k tweets/s</text>
  <line x1="415" y1="62" x2="455" y2="62" stroke="#e2903a" stroke-width="4"/>
  <path d="M455 62 l-9 -6 v12 z" fill="#e2903a"/>
  <text x="433" y="48" font-size="10" fill="#e2903a" text-anchor="middle">×75</text>

  <rect x="460" y="34" width="150" height="56" rx="5" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <text x="535" y="53" font-size="11" fill="currentColor" text-anchor="middle">per-user timeline caches</text>
  <text x="535" y="70" font-size="10" fill="#e2903a" text-anchor="middle">345k cache writes/s</text>
  <text x="535" y="83" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">celebrity tweet: 30M writes</text>

  <text x="345" y="140" font-size="12" fill="currentColor">read</text>
  <text x="345" y="155" font-size="11" fill="#4c8dd6">300k reads/s</text>
  <line x1="415" y1="144" x2="455" y2="144" stroke="#4c8dd6" stroke-width="1.5"/>
  <path d="M455 144 l-7 -4 v8 z" fill="#4c8dd6"/>

  <rect x="460" y="124" width="150" height="40" rx="5" fill="none" stroke="currentColor"/>
  <text x="535" y="141" font-size="11" fill="currentColor" text-anchor="middle">one precomputed lookup</text>
  <text x="535" y="156" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">timeline already assembled</text>

  <text x="480" y="205" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">reads cheap · every post does the work</text>

  <text x="320" y="238" font-size="11" fill="currentColor" text-anchor="middle">reads outnumber posts ~65:1 → Twitter moved the work to write time (hybrid for celebrities)</text>
</svg>

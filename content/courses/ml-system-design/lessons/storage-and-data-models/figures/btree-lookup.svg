<svg viewBox="0 0 600 270" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="16" y="22" font-size="12" fill="currentColor">look up key <tspan font-weight="700" fill="#e2903a">251</tspan> &#8212; each page is one disk read</text>

  <!-- root page -->
  <text x="90" y="63" font-size="10" fill="currentColor" opacity="0.55" text-anchor="end">root page</text>
  <rect x="100" y="44" width="300" height="30" rx="4" fill="none" stroke="currentColor" opacity="0.8"/>
  <g stroke="currentColor" opacity="0.35">
    <line x1="160" y1="44" x2="160" y2="74"/>
    <line x1="220" y1="44" x2="220" y2="74"/>
    <line x1="280" y1="44" x2="280" y2="74"/>
    <line x1="340" y1="44" x2="340" y2="74"/>
  </g>
  <g font-size="11" fill="currentColor" text-anchor="middle">
    <text x="130" y="63">&#8804;100</text>
    <text x="190" y="63">200</text>
    <text x="250" y="63" font-weight="700" fill="#e2903a">200&#8211;300</text>
    <text x="310" y="63">400</text>
    <text x="370" y="63">&gt;400</text>
  </g>

  <!-- descent arrow 1 -->
  <line x1="250" y1="74" x2="250" y2="112" stroke="#e2903a" stroke-width="2"/>
  <path d="M 250 118 l -5 -8 h 10 z" fill="#e2903a"/>
  <text x="262" y="100" font-size="10" fill="#e2903a">251 &#8712; (200, 300]</text>

  <!-- interior page -->
  <text x="90" y="137" font-size="10" fill="currentColor" opacity="0.55" text-anchor="end">interior page</text>
  <rect x="100" y="118" width="300" height="30" rx="4" fill="none" stroke="currentColor" opacity="0.8"/>
  <g stroke="currentColor" opacity="0.35">
    <line x1="160" y1="118" x2="160" y2="148"/>
    <line x1="220" y1="118" x2="220" y2="148"/>
    <line x1="280" y1="118" x2="280" y2="148"/>
    <line x1="340" y1="118" x2="340" y2="148"/>
  </g>
  <g font-size="11" fill="currentColor" text-anchor="middle">
    <text x="130" y="137">&#8804;210</text>
    <text x="190" y="137">230</text>
    <text x="250" y="137" font-weight="700" fill="#e2903a">250&#8211;270</text>
    <text x="310" y="137">280</text>
    <text x="370" y="137">&gt;280</text>
  </g>

  <!-- descent arrow 2 -->
  <line x1="250" y1="148" x2="250" y2="186" stroke="#e2903a" stroke-width="2"/>
  <path d="M 250 192 l -5 -8 h 10 z" fill="#e2903a"/>

  <!-- leaf page -->
  <text x="90" y="211" font-size="10" fill="currentColor" opacity="0.55" text-anchor="end">leaf page</text>
  <rect x="100" y="192" width="300" height="30" rx="4" fill="none" stroke="currentColor" opacity="0.8"/>
  <g stroke="currentColor" opacity="0.35">
    <line x1="175" y1="192" x2="175" y2="222"/>
    <line x1="250" y1="192" x2="250" y2="222"/>
    <line x1="325" y1="192" x2="325" y2="222"/>
  </g>
  <rect x="175" y="192" width="75" height="30" fill="#e2903a" opacity="0.2"/>
  <g font-size="11" fill="currentColor" text-anchor="middle">
    <text x="137" y="211">250: v</text>
    <text x="212" y="211" font-weight="700" fill="#e2903a">251: v</text>
    <text x="287" y="211">253: v</text>
    <text x="362" y="211">254: v</text>
  </g>

  <!-- side notes -->
  <g font-size="11" fill="currentColor">
    <text x="430" y="63">4 KB pages,</text>
    <text x="430" y="78" >~500 children each</text>
    <text x="430" y="137">writes overwrite a</text>
    <text x="430" y="152">page in place (+ WAL)</text>
    <text x="430" y="211">4 levels reach</text>
    <text x="430" y="226">256 TB in 4 reads</text>
  </g>
</svg>

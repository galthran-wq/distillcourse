<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- sources -->
  <text x="70" y="30" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">sources</text>
  <rect x="16" y="40" width="110" height="34" rx="4" fill="none" stroke="currentColor" opacity="0.8"/>
  <text x="71" y="56" font-size="11" fill="currentColor" text-anchor="middle">app database</text>
  <text x="71" y="69" font-size="9" fill="currentColor" opacity="0.55" text-anchor="middle">(OLTP, row-major)</text>

  <rect x="16" y="84" width="110" height="34" rx="4" fill="none" stroke="currentColor" opacity="0.8"/>
  <text x="71" y="100" font-size="11" fill="currentColor" text-anchor="middle">events / logs</text>
  <text x="71" y="113" font-size="9" fill="currentColor" opacity="0.55" text-anchor="middle">(clickstream)</text>

  <rect x="16" y="128" width="110" height="34" rx="4" fill="none" stroke="currentColor" opacity="0.8"/>
  <text x="71" y="144" font-size="11" fill="currentColor" text-anchor="middle">3rd-party APIs</text>
  <text x="71" y="157" font-size="9" fill="currentColor" opacity="0.55" text-anchor="middle">(payments, ads)</text>

  <!-- EL box -->
  <g stroke="currentColor" opacity="0.6">
    <line x1="126" y1="57" x2="170" y2="95"/>
    <line x1="126" y1="101" x2="170" y2="101"/>
    <line x1="126" y1="145" x2="170" y2="107"/>
  </g>
  <rect x="172" y="78" width="92" height="46" rx="6" fill="none" stroke="currentColor"/>
  <text x="218" y="97" font-size="11" font-weight="700" fill="currentColor" text-anchor="middle">extract + load</text>
  <text x="218" y="112" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">Airbyte</text>

  <line x1="264" y1="101" x2="304" y2="101" stroke="currentColor" stroke-width="1.5"/>
  <path d="M 308 101 l -8 -5 v 10 z" fill="currentColor"/>
  <text x="286" y="92" font-size="9" fill="currentColor" opacity="0.55" text-anchor="middle">raw</text>

  <!-- warehouse -->
  <rect x="310" y="52" width="160" height="112" rx="8" fill="#e2903a" opacity="0.1"/>
  <rect x="310" y="52" width="160" height="112" rx="8" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <text x="390" y="72" font-size="12" font-weight="700" fill="#e2903a" text-anchor="middle">warehouse (BigQuery)</text>
  <text x="390" y="87" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">columnar &#183; storage &#8800; compute</text>
  <rect x="324" y="96" width="132" height="24" rx="4" fill="none" stroke="currentColor" opacity="0.5"/>
  <text x="390" y="112" font-size="10" fill="currentColor" text-anchor="middle">raw tables (loaded as-is)</text>
  <rect x="324" y="128" width="132" height="24" rx="4" fill="none" stroke="#5aa46a"/>
  <text x="390" y="144" font-size="10" fill="#5aa46a" text-anchor="middle">tested views (star schema)</text>

  <!-- transform loop -->
  <path d="M 470 108 c 40 0 40 28 0 32" fill="none" stroke="#5aa46a" stroke-width="1.5"/>
  <path d="M 474 141 l 8 -3 l -6 -7 z" fill="#5aa46a"/>
  <text x="512" y="120" font-size="11" font-weight="700" fill="#5aa46a">transform</text>
  <text x="512" y="134" font-size="10" fill="currentColor" opacity="0.55">dbt: SQL,</text>
  <text x="512" y="147" font-size="10" fill="currentColor" opacity="0.55">tests, lineage</text>

  <!-- consumers -->
  <line x1="390" y1="164" x2="330" y2="204" stroke="currentColor" stroke-width="1.5"/>
  <path d="M 328 206 l 3 -9 l 6 6 z" fill="currentColor"/>
  <line x1="390" y1="164" x2="450" y2="204" stroke="currentColor" stroke-width="1.5"/>
  <path d="M 452 206 l -9 -3 l 6 -6 z" fill="currentColor"/>
  <rect x="240" y="208" width="130" height="34" rx="4" fill="none" stroke="currentColor" opacity="0.8"/>
  <text x="305" y="229" font-size="11" fill="currentColor" text-anchor="middle">dashboards, metrics</text>
  <rect x="400" y="208" width="130" height="34" rx="4" fill="none" stroke="currentColor" opacity="0.8"/>
  <text x="465" y="229" font-size="11" fill="currentColor" text-anchor="middle">training reads</text>

  <!-- lake -->
  <rect x="16" y="196" width="180" height="58" rx="8" fill="#4c8dd6" opacity="0.1"/>
  <rect x="16" y="196" width="180" height="58" rx="8" fill="none" stroke="#4c8dd6"/>
  <text x="106" y="216" font-size="12" font-weight="700" fill="#4c8dd6" text-anchor="middle">data lake (S3 / GCS)</text>
  <text x="106" y="232" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">raw objects: logs, images, text</text>
  <text x="106" y="246" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">schema-on-read</text>

  <!-- lake connections -->
  <path d="M 71 162 v 34" stroke="#4c8dd6" stroke-dasharray="3 3" opacity="0.8"/>
  <path d="M 71 194 l -4 -7 h 8 z" fill="#4c8dd6" opacity="0.8"/>
  <path d="M 196 216 c 60 -10 90 -30 112 -52" stroke="#4c8dd6" stroke-dasharray="3 3" fill="none" opacity="0.8"/>
  <path d="M 310 162 l -9 3 l 5 7 z" fill="#4c8dd6" opacity="0.8"/>
  <text x="212" y="180" font-size="9" fill="#4c8dd6" text-anchor="middle">graduates when a</text>
  <text x="212" y="191" font-size="9" fill="#4c8dd6" text-anchor="middle">schema settles</text>

  <text x="320" y="284" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">E and L are commodity connectors; T runs inside the warehouse, after loading &#8212; ELT</text>
</svg>

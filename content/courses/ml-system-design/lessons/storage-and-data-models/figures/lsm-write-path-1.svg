<svg viewBox="0 0 560 250" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="16" y="24" font-size="12" font-weight="700" fill="currentColor">1 &#183; a write goes to memory</text>

  <!-- memory / disk divider -->
  <line x1="272" y1="40" x2="272" y2="230" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5"/>
  <text x="150" y="52" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">memory</text>
  <text x="420" y="52" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">disk</text>

  <!-- incoming write -->
  <text x="16" y="96" font-size="11" fill="#e2903a">write k47:b</text>
  <line x1="16" y1="102" x2="66" y2="102" stroke="#e2903a" stroke-width="1.5"/>
  <path d="M 66 102 l -6 -4 v 8 z" fill="#e2903a"/>

  <!-- memtable -->
  <rect x="70" y="70" width="170" height="80" rx="6" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <text x="155" y="88" font-size="11" font-weight="700" fill="#e2903a" text-anchor="middle">memtable (sorted tree)</text>
  <text x="155" y="110" font-size="11" fill="currentColor" text-anchor="middle">k12:a &#183; k47:b &#183; k85:c</text>
  <text x="155" y="140" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">any write order, kept sorted</text>

  <!-- WAL -->
  <rect x="70" y="180" width="170" height="30" rx="4" fill="none" stroke="currentColor" opacity="0.6"/>
  <text x="155" y="199" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">crash log: every write appended</text>

  <!-- empty segment slots -->
  <rect x="320" y="70" width="200" height="46" rx="6" fill="none" stroke="currentColor" stroke-dasharray="3 3" opacity="0.35"/>
  <rect x="320" y="130" width="200" height="46" rx="6" fill="none" stroke="currentColor" stroke-dasharray="3 3" opacity="0.35"/>
  <text x="420" y="98" font-size="10" fill="currentColor" opacity="0.4" text-anchor="middle">(no segments yet)</text>
</svg>

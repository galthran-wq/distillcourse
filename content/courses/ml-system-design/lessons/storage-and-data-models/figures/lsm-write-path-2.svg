<svg viewBox="0 0 560 250" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="16" y="24" font-size="12" font-weight="700" fill="currentColor">2 &#183; the full memtable flushes to disk, sorted</text>

  <line x1="272" y1="40" x2="272" y2="230" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5"/>
  <text x="150" y="52" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">memory</text>
  <text x="420" y="52" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">disk</text>

  <!-- memtable, emptied -->
  <rect x="70" y="70" width="170" height="80" rx="6" fill="none" stroke="currentColor" opacity="0.6"/>
  <text x="155" y="88" font-size="11" font-weight="700" fill="currentColor" opacity="0.6" text-anchor="middle">memtable</text>
  <text x="155" y="115" font-size="10" fill="currentColor" opacity="0.4" text-anchor="middle">emptied after flush</text>

  <!-- WAL -->
  <rect x="70" y="180" width="170" height="30" rx="4" fill="none" stroke="currentColor" opacity="0.6"/>
  <text x="155" y="199" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">crash log: discarded after flush</text>

  <!-- flush arrow -->
  <line x1="242" y1="93" x2="316" y2="93" stroke="#e2903a" stroke-width="2"/>
  <path d="M 316 93 l -7 -4.5 v 9 z" fill="#e2903a"/>
  <text x="279" y="84" font-size="10" fill="#e2903a" text-anchor="middle">flush</text>

  <!-- segment 1 (newest slot) -->
  <rect x="320" y="70" width="200" height="46" rx="6" fill="#e2903a" opacity="0.15"/>
  <rect x="320" y="70" width="200" height="46" rx="6" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <text x="420" y="88" font-size="11" font-weight="700" fill="#e2903a" text-anchor="middle">segment 1 (immutable)</text>
  <text x="420" y="106" font-size="11" fill="currentColor" text-anchor="middle">k12:a &#183; k47:b &#183; k85:c</text>

  <rect x="320" y="130" width="200" height="46" rx="6" fill="none" stroke="currentColor" stroke-dasharray="3 3" opacity="0.35"/>

  <text x="420" y="204" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">one sequential write of a few MB</text>
</svg>

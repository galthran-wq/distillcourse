<svg viewBox="0 0 560 250" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="16" y="24" font-size="12" font-weight="700" fill="currentColor">3 &#183; a second segment accumulates; a read checks newest first</text>

  <line x1="272" y1="40" x2="272" y2="230" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5"/>
  <text x="150" y="52" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">memory</text>
  <text x="420" y="52" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">disk</text>

  <!-- memtable with new writes -->
  <rect x="70" y="70" width="170" height="80" rx="6" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <text x="155" y="88" font-size="11" font-weight="700" fill="#e2903a" text-anchor="middle">memtable</text>
  <text x="155" y="110" font-size="11" fill="currentColor" text-anchor="middle">k63:f</text>

  <!-- WAL -->
  <rect x="70" y="180" width="170" height="30" rx="4" fill="none" stroke="currentColor" opacity="0.6"/>
  <text x="155" y="199" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">crash log: filling again</text>

  <!-- segment 2 (flushed second, newest) -->
  <rect x="320" y="70" width="200" height="46" rx="6" fill="none" stroke="currentColor" opacity="0.8"/>
  <text x="420" y="88" font-size="11" font-weight="700" fill="currentColor" text-anchor="middle">segment 2 (newer)</text>
  <text x="420" y="106" font-size="11" fill="currentColor" text-anchor="middle">k05:d &#183; <tspan fill="#4c8dd6" font-weight="700">k47:e</tspan></text>

  <!-- segment 1 -->
  <rect x="320" y="130" width="200" height="46" rx="6" fill="none" stroke="currentColor" opacity="0.8"/>
  <text x="420" y="148" font-size="11" font-weight="700" fill="currentColor" text-anchor="middle">segment 1 (older)</text>
  <text x="420" y="166" font-size="11" fill="currentColor" text-anchor="middle">k12:a &#183; k47:b &#183; k85:c</text>

  <!-- read path -->
  <g stroke="#4c8dd6" stroke-width="1.5" fill="none">
    <path d="M 30 110 h 34" stroke-dasharray="4 3"/>
    <path d="M 30 110 v 120 h 390 v -100" stroke-dasharray="4 3"/>
  </g>
  <path d="M 420 130 l -4.5 7 h 9 z" fill="#4c8dd6"/>
  <path d="M 64 110 l -7 -4.5 v 9 z" fill="#4c8dd6"/>
  <text x="30" y="100" font-size="11" fill="#4c8dd6">read k47</text>
  <text x="290" y="243" font-size="10" fill="#4c8dd6" text-anchor="middle">memtable: miss &#8594; segment 2: hit (k47:e) &#8212; segment 1 never read</text>
</svg>

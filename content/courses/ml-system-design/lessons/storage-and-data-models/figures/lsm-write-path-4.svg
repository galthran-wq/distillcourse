<svg viewBox="0 0 560 250" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="16" y="24" font-size="12" font-weight="700" fill="currentColor">4 &#183; compaction merges segments, dropping overwritten values</text>

  <line x1="272" y1="40" x2="272" y2="230" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5"/>
  <text x="150" y="52" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">memory</text>
  <text x="420" y="52" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">disk</text>

  <!-- memtable unchanged -->
  <rect x="70" y="70" width="170" height="80" rx="6" fill="none" stroke="currentColor" opacity="0.6"/>
  <text x="155" y="88" font-size="11" font-weight="700" fill="currentColor" opacity="0.6" text-anchor="middle">memtable</text>
  <text x="155" y="110" font-size="11" fill="currentColor" opacity="0.6" text-anchor="middle">k63:f</text>

  <rect x="70" y="180" width="170" height="30" rx="4" fill="none" stroke="currentColor" opacity="0.6"/>
  <text x="155" y="199" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">crash log</text>

  <!-- old segments, fading -->
  <rect x="320" y="70" width="200" height="34" rx="6" fill="none" stroke="currentColor" opacity="0.3"/>
  <text x="420" y="91" font-size="10" fill="currentColor" opacity="0.4" text-anchor="middle">segment 2: k05:d &#183; k47:e</text>
  <rect x="320" y="112" width="200" height="34" rx="6" fill="none" stroke="currentColor" opacity="0.3"/>
  <text x="420" y="133" font-size="10" fill="currentColor" opacity="0.4" text-anchor="middle">segment 1: k12:a &#183; k47:b &#183; k85:c</text>

  <!-- merge arrows -->
  <g stroke="#5aa46a" stroke-width="1.5" fill="none">
    <path d="M 420 104 v 4"/>
    <path d="M 420 146 v 24"/>
  </g>
  <path d="M 420 170 l -4.5 -7 h 9 z" fill="#5aa46a"/>
  <text x="500" y="163" font-size="10" fill="#5aa46a" text-anchor="middle">merge (background)</text>

  <!-- merged segment -->
  <rect x="320" y="174" width="200" height="46" rx="6" fill="#5aa46a" opacity="0.15"/>
  <rect x="320" y="174" width="200" height="46" rx="6" fill="none" stroke="#5aa46a" stroke-width="1.5"/>
  <text x="420" y="192" font-size="11" font-weight="700" fill="#5aa46a" text-anchor="middle">merged segment</text>
  <text x="420" y="210" font-size="11" fill="currentColor" text-anchor="middle">k05:d &#183; k12:a &#183; k47:e &#183; k85:c</text>

  <text x="420" y="240" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">k47:b discarded &#8212; the newer segment&#8217;s value wins; old files deleted</text>
</svg>

<svg viewBox="0 0 640 292" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- column headers -->
  <rect x="148" y="8" width="238" height="34" rx="6" fill="#e2903a" opacity="0.18"/>
  <rect x="394" y="8" width="238" height="34" rx="6" fill="#4c8dd6" opacity="0.18"/>
  <text x="267" y="24" font-size="13" font-weight="700" fill="#e2903a" text-anchor="middle">OLTP</text>
  <text x="267" y="37" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">the product&#8217;s store</text>
  <text x="513" y="24" font-size="13" font-weight="700" fill="#4c8dd6" text-anchor="middle">OLAP</text>
  <text x="513" y="37" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">the analysts&#8217; store</text>

  <!-- row separators -->
  <g stroke="currentColor" opacity="0.18">
    <line x1="8" y1="50" x2="632" y2="50"/>
    <line x1="8" y1="96" x2="632" y2="96"/>
    <line x1="8" y1="142" x2="632" y2="142"/>
    <line x1="8" y1="188" x2="632" y2="188"/>
    <line x1="8" y1="234" x2="632" y2="234"/>
  </g>

  <!-- axis labels -->
  <g font-size="11" fill="currentColor" opacity="0.55">
    <text x="12" y="76">request shape</text>
    <text x="12" y="122">rows touched</text>
    <text x="12" y="168">bottleneck</text>
    <text x="12" y="214">latency</text>
    <text x="12" y="260">engines</text>
  </g>

  <!-- OLTP column -->
  <g font-size="12" fill="currentColor" text-anchor="middle">
    <text x="267" y="70">fetch / update one row,</text>
    <text x="267" y="85">located by key via an index</text>
    <text x="267" y="124">a handful per query</text>
    <text x="267" y="170">disk seek time</text>
    <text x="267" y="216">milliseconds (a user waits)</text>
    <text x="267" y="255">PostgreSQL, MySQL,</text>
    <text x="267" y="270">DynamoDB, RocksDB</text>
  </g>

  <!-- OLAP column -->
  <g font-size="12" fill="currentColor" text-anchor="middle">
    <text x="513" y="70">aggregate a few columns</text>
    <text x="513" y="85">over all rows</text>
    <text x="513" y="124">millions to billions per query</text>
    <text x="513" y="170">disk bandwidth</text>
    <text x="513" y="216">seconds&#8211;minutes (batch)</text>
    <text x="513" y="255">BigQuery, Snowflake,</text>
    <text x="513" y="270">Redshift, Vertica</text>
  </g>
</svg>

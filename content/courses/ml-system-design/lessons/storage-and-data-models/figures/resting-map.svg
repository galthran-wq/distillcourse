<svg viewBox="0 0 640 256" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- product OLTP -->
  <rect x="16" y="46" width="160" height="66" rx="6" fill="none" stroke="currentColor" opacity="0.85"/>
  <text x="96" y="66" font-size="12" font-weight="700" fill="currentColor" text-anchor="middle">product OLTP</text>
  <text x="96" y="82" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">orders &#183; inventory &#183; user state</text>
  <text x="96" y="96" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">rows, B-tree / LSM, ms reads</text>

  <!-- data lake -->
  <rect x="16" y="156" width="160" height="66" rx="6" fill="#4c8dd6" opacity="0.1"/>
  <rect x="16" y="156" width="160" height="66" rx="6" fill="none" stroke="#4c8dd6"/>
  <text x="96" y="176" font-size="12" font-weight="700" fill="#4c8dd6" text-anchor="middle">data lake</text>
  <text x="96" y="192" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">raw events: clicks, logs</text>
  <text x="96" y="206" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">schema-on-read</text>

  <!-- arrows into the warehouse -->
  <line x1="176" y1="79" x2="260" y2="118" stroke="currentColor" stroke-width="1.5"/>
  <path d="M 266 121 l -9 -1 l 4 -8 z" fill="currentColor"/>
  <line x1="176" y1="189" x2="260" y2="152" stroke="currentColor" stroke-width="1.5"/>
  <path d="M 267 149 l -9 6 l -1 -9 z" fill="currentColor"/>
  <text x="214" y="90" font-size="9" fill="currentColor" opacity="0.55" text-anchor="middle">ELT</text>
  <text x="216" y="186" font-size="9" fill="currentColor" opacity="0.55" text-anchor="middle">graduates</text>

  <!-- warehouse -->
  <rect x="268" y="96" width="168" height="86" rx="8" fill="#e2903a" opacity="0.1"/>
  <rect x="268" y="96" width="168" height="86" rx="8" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <text x="352" y="118" font-size="12" font-weight="700" fill="#e2903a" text-anchor="middle">warehouse</text>
  <text x="352" y="134" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">star schema, columnar</text>
  <text x="352" y="148" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">batch scans over years</text>
  <text x="352" y="162" font-size="10" fill="currentColor" text-anchor="middle">training data assembled here</text>

  <!-- dashed arrow to the gap -->
  <line x1="436" y1="139" x2="482" y2="139" stroke="currentColor" stroke-width="1.5" stroke-dasharray="3 3"/>
  <path d="M 488 139 l -8 -5 v 10 z" fill="currentColor"/>

  <!-- the missing online store -->
  <rect x="490" y="96" width="134" height="86" rx="8" fill="none" stroke="currentColor" stroke-dasharray="4 3"/>
  <text x="557" y="118" font-size="11" font-weight="700" fill="currentColor" text-anchor="middle">online feature store</text>
  <text x="557" y="134" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">features for one store</text>
  <text x="557" y="148" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">in milliseconds</text>
  <text x="557" y="164" font-size="10" fill="currentColor" text-anchor="middle">no engine in this lesson</text>
  <text x="557" y="198" font-size="9" fill="currentColor" opacity="0.55" text-anchor="middle">the feature platform closes it</text>

  <text x="320" y="240" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">at rest: rows for the product, raw objects in the lake, columns in the warehouse &#8212; one store still missing</text>
</svg>

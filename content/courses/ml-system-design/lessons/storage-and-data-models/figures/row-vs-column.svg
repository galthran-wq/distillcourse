<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="320" y="20" font-size="12" fill="currentColor" text-anchor="middle">one table: 6 sales rows &#215; 4 columns (id, store, item, <tspan fill="#e2903a" font-weight="700">price</tspan>) &#8212; query: AVG(<tspan fill="#e2903a" font-weight="700">price</tspan>)</text>

  <!-- ================= row-major strip ================= -->
  <text x="32" y="52" font-size="12" font-weight="700" fill="currentColor">row-major</text>
  <text x="116" y="52" font-size="11" fill="currentColor" opacity="0.55">(CSV, Avro, OLTP pages) &#8212; bytes follow rows</text>

  <!-- cells: 24 cells, x=32+i*24, y=62, w=24, h=24 -->
  <g font-size="9" text-anchor="middle">
    <!-- row groups: each row = id, st, it, price -->
    <!-- all cells are read: faint amber wash; price cells strong amber -->
    <!-- row 1 -->
    <rect x="32" y="62" width="24" height="24" fill="#e2903a" opacity="0.12" stroke="currentColor" stroke-opacity="0.35"/>
    <rect x="56" y="62" width="24" height="24" fill="#e2903a" opacity="0.12" stroke="currentColor" stroke-opacity="0.35"/>
    <rect x="80" y="62" width="24" height="24" fill="#e2903a" opacity="0.12" stroke="currentColor" stroke-opacity="0.35"/>
    <rect x="104" y="62" width="24" height="24" fill="#e2903a" opacity="0.8" stroke="currentColor" stroke-opacity="0.35"/>
    <!-- row 2 -->
    <rect x="128" y="62" width="24" height="24" fill="#e2903a" opacity="0.12" stroke="currentColor" stroke-opacity="0.35"/>
    <rect x="152" y="62" width="24" height="24" fill="#e2903a" opacity="0.12" stroke="currentColor" stroke-opacity="0.35"/>
    <rect x="176" y="62" width="24" height="24" fill="#e2903a" opacity="0.12" stroke="currentColor" stroke-opacity="0.35"/>
    <rect x="200" y="62" width="24" height="24" fill="#e2903a" opacity="0.8" stroke="currentColor" stroke-opacity="0.35"/>
    <!-- row 3 -->
    <rect x="224" y="62" width="24" height="24" fill="#e2903a" opacity="0.12" stroke="currentColor" stroke-opacity="0.35"/>
    <rect x="248" y="62" width="24" height="24" fill="#e2903a" opacity="0.12" stroke="currentColor" stroke-opacity="0.35"/>
    <rect x="272" y="62" width="24" height="24" fill="#e2903a" opacity="0.12" stroke="currentColor" stroke-opacity="0.35"/>
    <rect x="296" y="62" width="24" height="24" fill="#e2903a" opacity="0.8" stroke="currentColor" stroke-opacity="0.35"/>
    <!-- row 4 -->
    <rect x="320" y="62" width="24" height="24" fill="#e2903a" opacity="0.12" stroke="currentColor" stroke-opacity="0.35"/>
    <rect x="344" y="62" width="24" height="24" fill="#e2903a" opacity="0.12" stroke="currentColor" stroke-opacity="0.35"/>
    <rect x="368" y="62" width="24" height="24" fill="#e2903a" opacity="0.12" stroke="currentColor" stroke-opacity="0.35"/>
    <rect x="392" y="62" width="24" height="24" fill="#e2903a" opacity="0.8" stroke="currentColor" stroke-opacity="0.35"/>
    <!-- row 5 -->
    <rect x="416" y="62" width="24" height="24" fill="#e2903a" opacity="0.12" stroke="currentColor" stroke-opacity="0.35"/>
    <rect x="440" y="62" width="24" height="24" fill="#e2903a" opacity="0.12" stroke="currentColor" stroke-opacity="0.35"/>
    <rect x="464" y="62" width="24" height="24" fill="#e2903a" opacity="0.12" stroke="currentColor" stroke-opacity="0.35"/>
    <rect x="488" y="62" width="24" height="24" fill="#e2903a" opacity="0.8" stroke="currentColor" stroke-opacity="0.35"/>
    <!-- row 6 -->
    <rect x="512" y="62" width="24" height="24" fill="#e2903a" opacity="0.12" stroke="currentColor" stroke-opacity="0.35"/>
    <rect x="536" y="62" width="24" height="24" fill="#e2903a" opacity="0.12" stroke="currentColor" stroke-opacity="0.35"/>
    <rect x="560" y="62" width="24" height="24" fill="#e2903a" opacity="0.12" stroke="currentColor" stroke-opacity="0.35"/>
    <rect x="584" y="62" width="24" height="24" fill="#e2903a" opacity="0.8" stroke="currentColor" stroke-opacity="0.35"/>
    <!-- labels -->
    <g fill="currentColor">
      <text x="44" y="77">id&#8321;</text><text x="68" y="77">st&#8321;</text><text x="92" y="77">it&#8321;</text><text x="116" y="77" font-weight="700">&#8364;&#8321;</text>
      <text x="140" y="77">id&#8322;</text><text x="164" y="77">st&#8322;</text><text x="188" y="77">it&#8322;</text><text x="212" y="77" font-weight="700">&#8364;&#8322;</text>
      <text x="236" y="77">id&#8323;</text><text x="260" y="77">st&#8323;</text><text x="284" y="77">it&#8323;</text><text x="308" y="77" font-weight="700">&#8364;&#8323;</text>
      <text x="332" y="77">id&#8324;</text><text x="356" y="77">st&#8324;</text><text x="380" y="77">it&#8324;</text><text x="404" y="77" font-weight="700">&#8364;&#8324;</text>
      <text x="428" y="77">id&#8325;</text><text x="452" y="77">st&#8325;</text><text x="476" y="77">it&#8325;</text><text x="500" y="77" font-weight="700">&#8364;&#8325;</text>
      <text x="524" y="77">id&#8326;</text><text x="548" y="77">st&#8326;</text><text x="572" y="77">it&#8326;</text><text x="596" y="77" font-weight="700">&#8364;&#8326;</text>
    </g>
  </g>
  <!-- read bracket: full strip -->
  <path d="M 32 92 L 32 98 L 608 98 L 608 92" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <text x="320" y="113" font-size="11" fill="#e2903a" text-anchor="middle">price is every 4th cell &#8594; the scan reads all 24 cells</text>

  <!-- ================= column-major strip ================= -->
  <text x="32" y="160" font-size="12" font-weight="700" fill="currentColor">column-major</text>
  <text x="138" y="160" font-size="11" fill="currentColor" opacity="0.55">(Parquet, ORC) &#8212; bytes follow columns</text>

  <g font-size="9" text-anchor="middle">
    <!-- id block -->
    <rect x="32" y="170" width="24" height="24" fill="currentColor" opacity="0.06" stroke="currentColor" stroke-opacity="0.35"/>
    <rect x="56" y="170" width="24" height="24" fill="currentColor" opacity="0.06" stroke="currentColor" stroke-opacity="0.35"/>
    <rect x="80" y="170" width="24" height="24" fill="currentColor" opacity="0.06" stroke="currentColor" stroke-opacity="0.35"/>
    <rect x="104" y="170" width="24" height="24" fill="currentColor" opacity="0.06" stroke="currentColor" stroke-opacity="0.35"/>
    <rect x="128" y="170" width="24" height="24" fill="currentColor" opacity="0.06" stroke="currentColor" stroke-opacity="0.35"/>
    <rect x="152" y="170" width="24" height="24" fill="currentColor" opacity="0.06" stroke="currentColor" stroke-opacity="0.35"/>
    <!-- store block -->
    <rect x="176" y="170" width="24" height="24" fill="currentColor" opacity="0.06" stroke="currentColor" stroke-opacity="0.35"/>
    <rect x="200" y="170" width="24" height="24" fill="currentColor" opacity="0.06" stroke="currentColor" stroke-opacity="0.35"/>
    <rect x="224" y="170" width="24" height="24" fill="currentColor" opacity="0.06" stroke="currentColor" stroke-opacity="0.35"/>
    <rect x="248" y="170" width="24" height="24" fill="currentColor" opacity="0.06" stroke="currentColor" stroke-opacity="0.35"/>
    <rect x="272" y="170" width="24" height="24" fill="currentColor" opacity="0.06" stroke="currentColor" stroke-opacity="0.35"/>
    <rect x="296" y="170" width="24" height="24" fill="currentColor" opacity="0.06" stroke="currentColor" stroke-opacity="0.35"/>
    <!-- item block -->
    <rect x="320" y="170" width="24" height="24" fill="currentColor" opacity="0.06" stroke="currentColor" stroke-opacity="0.35"/>
    <rect x="344" y="170" width="24" height="24" fill="currentColor" opacity="0.06" stroke="currentColor" stroke-opacity="0.35"/>
    <rect x="368" y="170" width="24" height="24" fill="currentColor" opacity="0.06" stroke="currentColor" stroke-opacity="0.35"/>
    <rect x="392" y="170" width="24" height="24" fill="currentColor" opacity="0.06" stroke="currentColor" stroke-opacity="0.35"/>
    <rect x="416" y="170" width="24" height="24" fill="currentColor" opacity="0.06" stroke="currentColor" stroke-opacity="0.35"/>
    <rect x="440" y="170" width="24" height="24" fill="currentColor" opacity="0.06" stroke="currentColor" stroke-opacity="0.35"/>
    <!-- price block -->
    <rect x="464" y="170" width="24" height="24" fill="#e2903a" opacity="0.8" stroke="currentColor" stroke-opacity="0.35"/>
    <rect x="488" y="170" width="24" height="24" fill="#e2903a" opacity="0.8" stroke="currentColor" stroke-opacity="0.35"/>
    <rect x="512" y="170" width="24" height="24" fill="#e2903a" opacity="0.8" stroke="currentColor" stroke-opacity="0.35"/>
    <rect x="536" y="170" width="24" height="24" fill="#e2903a" opacity="0.8" stroke="currentColor" stroke-opacity="0.35"/>
    <rect x="560" y="170" width="24" height="24" fill="#e2903a" opacity="0.8" stroke="currentColor" stroke-opacity="0.35"/>
    <rect x="584" y="170" width="24" height="24" fill="#e2903a" opacity="0.8" stroke="currentColor" stroke-opacity="0.35"/>
    <!-- labels -->
    <g fill="currentColor">
      <text x="44" y="185">id&#8321;</text><text x="68" y="185">id&#8322;</text><text x="92" y="185">id&#8323;</text><text x="116" y="185">id&#8324;</text><text x="140" y="185">id&#8325;</text><text x="164" y="185">id&#8326;</text>
      <text x="188" y="185">st&#8321;</text><text x="212" y="185">st&#8322;</text><text x="236" y="185">st&#8323;</text><text x="260" y="185">st&#8324;</text><text x="284" y="185">st&#8325;</text><text x="308" y="185">st&#8326;</text>
      <text x="332" y="185">it&#8321;</text><text x="356" y="185">it&#8322;</text><text x="380" y="185">it&#8323;</text><text x="404" y="185">it&#8324;</text><text x="428" y="185">it&#8325;</text><text x="452" y="185">it&#8326;</text>
      <text x="476" y="185" font-weight="700">&#8364;&#8321;</text><text x="500" y="185" font-weight="700">&#8364;&#8322;</text><text x="524" y="185" font-weight="700">&#8364;&#8323;</text><text x="548" y="185" font-weight="700">&#8364;&#8324;</text><text x="572" y="185" font-weight="700">&#8364;&#8325;</text><text x="596" y="185" font-weight="700">&#8364;&#8326;</text>
    </g>
  </g>
  <!-- column-file dividers -->
  <g stroke="currentColor" opacity="0.5" stroke-dasharray="3 3">
    <line x1="176" y1="166" x2="176" y2="198"/>
    <line x1="320" y1="166" x2="320" y2="198"/>
    <line x1="464" y1="166" x2="464" y2="198"/>
  </g>
  <g font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">
    <text x="104" y="212">id file</text>
    <text x="248" y="212">store file</text>
    <text x="392" y="212">item file</text>
  </g>
  <!-- read bracket: price block only -->
  <path d="M 464 200 L 464 206 L 608 206 L 608 200" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <text x="536" y="221" font-size="11" fill="#e2903a" text-anchor="middle">only the price file: 6 cells</text>

  <!-- payoff -->
  <text x="320" y="256" font-size="12" fill="currentColor" text-anchor="middle">bytes read: 24 vs 6 here &#8212; on a 100-column fact table, 100&#215; vs 1&#215;</text>
  <text x="320" y="274" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">row k is recoverable: the k-th entry of every column file belongs to row k</text>
</svg>

<svg viewBox="0 0 620 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- fact table (center) -->
  <rect x="215" y="100" width="190" height="140" rx="6" fill="#e2903a" opacity="0.12"/>
  <rect x="215" y="100" width="190" height="140" rx="6" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <text x="310" y="120" font-size="13" font-weight="700" fill="#e2903a" text-anchor="middle">fact_sales</text>
  <line x1="225" y1="128" x2="395" y2="128" stroke="#e2903a" opacity="0.5"/>
  <g font-size="11" fill="currentColor">
    <text x="230" y="145">date_key &#8594;</text>
    <text x="230" y="161">store_sk &#8594;</text>
    <text x="230" y="177">product_sk &#8594;</text>
    <text x="230" y="193">promo_sk &#8594;</text>
    <text x="230" y="213">quantity, unit_price,</text>
    <text x="230" y="228">cost, &#8230; (~100 columns)</text>
  </g>
  <text x="310" y="258" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">one row = one item sold &#183; ~10&#8313; rows/year</text>

  <!-- dim_date (top left) -->
  <rect x="30" y="24" width="150" height="64" rx="6" fill="none" stroke="#4c8dd6"/>
  <text x="105" y="42" font-size="12" font-weight="700" fill="#4c8dd6" text-anchor="middle">dim_date</text>
  <text x="105" y="59" font-size="10" fill="currentColor" text-anchor="middle">date_key, weekday,</text>
  <text x="105" y="73" font-size="10" fill="currentColor" text-anchor="middle">month, holiday_flag</text>

  <!-- dim_product (top right) -->
  <rect x="440" y="24" width="150" height="64" rx="6" fill="none" stroke="#4c8dd6"/>
  <text x="515" y="42" font-size="12" font-weight="700" fill="#4c8dd6" text-anchor="middle">dim_product</text>
  <text x="515" y="59" font-size="10" fill="currentColor" text-anchor="middle">product_sk, sku, brand,</text>
  <text x="515" y="73" font-size="10" fill="currentColor" text-anchor="middle">category, package_size</text>

  <!-- dim_store (bottom left) -->
  <rect x="30" y="248" width="150" height="64" rx="6" fill="none" stroke="#4c8dd6"/>
  <text x="105" y="266" font-size="12" font-weight="700" fill="#4c8dd6" text-anchor="middle">dim_store</text>
  <text x="105" y="283" font-size="10" fill="currentColor" text-anchor="middle">store_sk, city, format,</text>
  <text x="105" y="297" font-size="10" fill="currentColor" text-anchor="middle">sq_meters, opened</text>

  <!-- dim_promotion (bottom right) -->
  <rect x="440" y="248" width="150" height="64" rx="6" fill="none" stroke="#4c8dd6"/>
  <text x="515" y="266" font-size="12" font-weight="700" fill="#4c8dd6" text-anchor="middle">dim_promotion</text>
  <text x="515" y="283" font-size="10" fill="currentColor" text-anchor="middle">promo_sk, type,</text>
  <text x="515" y="297" font-size="10" fill="currentColor" text-anchor="middle">discount, channel</text>

  <!-- foreign-key rays -->
  <g stroke="#4c8dd6" stroke-width="1.2" opacity="0.7">
    <line x1="240" y1="141" x2="150" y2="88"/>
    <line x1="380" y1="173" x2="470" y2="88"/>
    <line x1="240" y1="157" x2="150" y2="248"/>
    <line x1="380" y1="189" x2="470" y2="248"/>
  </g>

  <text x="310" y="26" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">dimensions: the who / what / where / when</text>
  <text x="310" y="322" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">a query filters and groups by dimension columns, aggregates fact columns</text>
</svg>

<svg viewBox="0 0 620 268" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- goals column -->
  <rect x="16" y="14" width="286" height="240" rx="6" fill="none" stroke="#5aa46a" stroke-width="1.5"/>
  <text x="159" y="38" font-size="12" text-anchor="middle" fill="#5aa46a" letter-spacing="1">GOALS</text>
  <g font-size="11.5" fill="currentColor">
    <text x="32" y="66">· narrow the delivered-vs-sold gap</text>
    <text x="32" y="92">· out-of-stock rate within the SLA</text>
    <text x="32" y="118">· weekly forecast per (item, store)</text>
    <text x="32" y="144">· yearly forecast for procurement deals</text>
    <text x="32" y="176" opacity="0.55">· equal accuracy on every SKU</text>
  </g>
  <line x1="30" y1="172" x2="230" y2="172" stroke="#e2903a" stroke-width="1.5"/>
  <text x="32" y="196" font-size="10" fill="#e2903a">struck in review: price-weighted quantiles</text>
  <text x="32" y="210" font-size="10" fill="#e2903a">already say which SKUs matter more</text>

  <!-- antigoals column -->
  <rect x="318" y="14" width="286" height="240" rx="6" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <text x="461" y="38" font-size="12" text-anchor="middle" fill="#e2903a" letter-spacing="1">ANTIGOALS</text>
  <g font-size="11.5" fill="currentColor">
    <text x="334" y="66">· intraday forecast updates</text>
    <text x="346" y="81" font-size="10" opacity="0.55">trucks run every 2 days — freshness unused</text>
    <text x="334" y="106">· per-customer prediction</text>
    <text x="346" y="121" font-size="10" opacity="0.55">the ordering unit is (item, store)</text>
    <text x="334" y="146">· pricing decisions of any kind</text>
    <text x="346" y="161" font-size="10" opacity="0.55">out of scope: forecast feeds ordering only</text>
    <text x="334" y="186">· cold-start for unreleased products</text>
    <text x="346" y="201" font-size="10" opacity="0.55">no history exists; simple rules suffice</text>
  </g>
  <text x="334" y="238" font-size="10.5" fill="currentColor" opacity="0.7">each refusal: one line, weeks saved</text>
</svg>

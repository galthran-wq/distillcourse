<svg viewBox="0 0 620 240" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="16" y="26" font-size="11" fill="currentColor" opacity="0.7">the design as drafted: "Double Bayesian Universal Contextual Bandits for Dynamic Pricing"</text>

  <!-- user context -->
  <rect x="24" y="76" width="130" height="48" rx="5" fill="none" stroke="currentColor" opacity="0.7"/>
  <text x="89" y="96" font-size="11.5" text-anchor="middle" fill="currentColor">user context</text>
  <text x="89" y="112" font-size="10" text-anchor="middle" fill="currentColor" opacity="0.55">behavior, history</text>

  <!-- arrow -->
  <line x1="154" y1="100" x2="216" y2="100" stroke="currentColor" stroke-width="1.5"/>
  <path d="M216 100 l-7 -4 v8 z" fill="currentColor"/>

  <!-- bandit -->
  <rect x="220" y="60" width="180" height="80" rx="5" fill="none" stroke="#e2903a" stroke-width="2"/>
  <text x="310" y="86" font-size="12" text-anchor="middle" fill="currentColor">contextual bandit</text>
  <text x="310" y="104" font-size="10" text-anchor="middle" fill="currentColor" opacity="0.55">explore / exploit, Bayesian,</text>
  <text x="310" y="118" font-size="10" text-anchor="middle" fill="currentColor" opacity="0.55">fast to train and serve</text>

  <!-- arrow -->
  <line x1="400" y1="100" x2="462" y2="100" stroke="currentColor" stroke-width="1.5"/>
  <path d="M462 100 l-7 -4 v8 z" fill="currentColor"/>

  <!-- price -->
  <rect x="466" y="76" width="130" height="48" rx="5" fill="none" stroke="currentColor" opacity="0.7"/>
  <text x="531" y="104" font-size="11.5" text-anchor="middle" fill="currentColor">price served</text>

  <!-- capability tags -->
  <rect x="180" y="168" width="128" height="30" rx="4" fill="none" stroke="#4c8dd6" stroke-width="1.5"/>
  <text x="244" y="187" font-size="11" text-anchor="middle" fill="#4c8dd6">per-user prices</text>
  <rect x="324" y="168" width="140" height="30" rx="4" fill="none" stroke="#4c8dd6" stroke-width="1.5"/>
  <text x="394" y="187" font-size="11" text-anchor="middle" fill="#4c8dd6">real-time repricing</text>
  <line x1="244" y1="168" x2="278" y2="140" stroke="#4c8dd6" opacity="0.5"/>
  <line x1="394" y1="168" x2="352" y2="140" stroke="#4c8dd6" opacity="0.5"/>
</svg>

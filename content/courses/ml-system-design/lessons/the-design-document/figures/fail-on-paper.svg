<svg viewBox="0 0 620 200" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- header note -->
  <text x="16" y="24" font-size="11" fill="currentColor" opacity="0.7">both paths end in the same verdict: do not build this</text>
  <line x1="16" y1="32" x2="604" y2="32" stroke="currentColor" opacity="0.25"/>

  <!-- row 1: build first -->
  <text x="16" y="64" font-size="12" fill="currentColor">build first</text>
  <rect x="110" y="50" width="450" height="18" rx="3" fill="#e2903a" opacity="0.55"/>
  <text x="120" y="63" font-size="11" fill="currentColor" opacity="0.8">models, features, datasets</text>
  <text x="560" y="84" font-size="11" fill="#e2903a" text-anchor="end">verdict arrives in month six — shelved</text>

  <!-- row 2: write first -->
  <text x="16" y="126" font-size="12" fill="currentColor">write first</text>
  <rect x="110" y="112" width="55" height="18" rx="3" fill="#5aa46a" opacity="0.85"/>
  <rect x="172" y="112" width="388" height="18" rx="3" fill="none" stroke="currentColor" stroke-dasharray="3 3" opacity="0.4"/>
  <text x="366" y="125" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">five months not spent</text>
  <text x="110" y="146" font-size="11" fill="#5aa46a">same verdict, week 2–4</text>

  <!-- time axis -->
  <line x1="110" y1="166" x2="560" y2="166" stroke="currentColor" opacity="0.5"/>
  <line x1="110" y1="162" x2="110" y2="170" stroke="currentColor" opacity="0.5"/>
  <line x1="185" y1="162" x2="185" y2="170" stroke="currentColor" opacity="0.5"/>
  <line x1="260" y1="162" x2="260" y2="170" stroke="currentColor" opacity="0.5"/>
  <line x1="335" y1="162" x2="335" y2="170" stroke="currentColor" opacity="0.5"/>
  <line x1="410" y1="162" x2="410" y2="170" stroke="currentColor" opacity="0.5"/>
  <line x1="485" y1="162" x2="485" y2="170" stroke="currentColor" opacity="0.5"/>
  <line x1="560" y1="162" x2="560" y2="170" stroke="currentColor" opacity="0.5"/>
  <text x="110" y="186" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">0</text>
  <text x="335" y="186" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">3</text>
  <text x="560" y="186" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">6 months</text>
</svg>

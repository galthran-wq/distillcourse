<svg viewBox="0 0 640 218" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- offline box -->
  <rect x="14" y="44" width="192" height="112" rx="5" fill="none" stroke="currentColor" opacity="0.7"/>
  <text x="110" y="64" font-size="11" text-anchor="middle" fill="currentColor" letter-spacing="1">OFFLINE</text>
  <g font-size="11" fill="currentColor" text-anchor="middle">
    <text x="110" y="86">pinball loss = quantile metric</text>
    <text x="110" y="104">q ∈ {1.5, 25, 50, 75, 95, 99}</text>
    <text x="110" y="122" opacity="0.7">price-weighted</text>
    <text x="110" y="140" opacity="0.7">signed bias alongside</text>
  </g>
  <text x="110" y="176" font-size="10" text-anchor="middle" fill="#5aa46a">loss ≡ metric: surrogate gap closed</text>

  <!-- arrow 1 -->
  <line x1="206" y1="100" x2="242" y2="100" stroke="currentColor" stroke-width="1.5"/>
  <path d="M242 100 l-7 -4 v8 z" fill="currentColor"/>
  <text x="224" y="82" font-size="10" text-anchor="middle" fill="currentColor" opacity="0.65">deployment</text>
  <text x="224" y="94" font-size="10" text-anchor="middle" fill="currentColor" opacity="0.65">gap</text>

  <!-- online box -->
  <rect x="246" y="44" width="160" height="112" rx="5" fill="none" stroke="#4c8dd6" stroke-width="1.5"/>
  <text x="326" y="64" font-size="11" text-anchor="middle" fill="#4c8dd6" letter-spacing="1">ONLINE (A/B)</text>
  <g font-size="11" fill="currentColor" text-anchor="middle">
    <text x="326" y="90">revenue ↑</text>
    <text x="326" y="110">margin ↑</text>
    <text x="326" y="130">stock level ↓</text>
  </g>

  <!-- arrow 2 -->
  <line x1="406" y1="100" x2="442" y2="100" stroke="currentColor" stroke-width="1.5"/>
  <path d="M442 100 l-7 -4 v8 z" fill="currentColor"/>
  <text x="424" y="82" font-size="10" text-anchor="middle" fill="currentColor" opacity="0.65">attribution</text>
  <text x="424" y="94" font-size="10" text-anchor="middle" fill="currentColor" opacity="0.65">gap</text>

  <!-- business box -->
  <rect x="446" y="44" width="180" height="112" rx="5" fill="none" stroke="#e2903a" stroke-width="2"/>
  <text x="536" y="64" font-size="11" text-anchor="middle" fill="#e2903a" letter-spacing="1">BUSINESS</text>
  <g font-size="11" fill="currentColor" text-anchor="middle">
    <text x="536" y="92">delivered-vs-sold gap</text>
    <text x="536" y="116" font-size="13" fill="#e2903a">≈ $800M / yr at stake</text>
    <text x="536" y="138" opacity="0.7">the ceiling, not the promise</text>
  </g>
</svg>

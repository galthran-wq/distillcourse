<svg viewBox="0 0 620 226" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- axes -->
  <text x="30" y="22" font-size="11" fill="currentColor" opacity="0.7">error</text>
  <line x1="70" y1="28" x2="70" y2="192" stroke="currentColor" opacity="0.6"/>
  <line x1="70" y1="192" x2="585" y2="192" stroke="currentColor" opacity="0.6"/>
  <text x="327" y="214" font-size="11" fill="currentColor" opacity="0.7" text-anchor="middle">weeks of experimentation</text>

  <!-- linear expectation (blue, dashed) -->
  <line x1="70" y1="42" x2="480" y2="178" stroke="#4c8dd6" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.8"/>
  <text x="488" y="182" font-size="11" fill="#4c8dd6">linear expectation</text>

  <!-- actual progress (amber) -->
  <path d="M 70 42 C 100 80, 130 108, 175 120 C 240 127, 330 128, 415 129 C 460 136, 520 146, 580 152"
        fill="none" stroke="#e2903a" stroke-width="2.5"/>

  <!-- plateau bracket -->
  <line x1="180" y1="106" x2="410" y2="106" stroke="#e2903a" opacity="0.5"/>
  <line x1="180" y1="106" x2="180" y2="112" stroke="#e2903a" opacity="0.5"/>
  <line x1="410" y1="106" x2="410" y2="112" stroke="#e2903a" opacity="0.5"/>
  <text x="252" y="98" font-size="11" fill="#e2903a">no metric moves: features and labels in preparation</text>

  <!-- expectation gap marker -->
  <line x1="430" y1="134" x2="430" y2="158" stroke="currentColor" opacity="0.6"/>
  <line x1="426" y1="136" x2="434" y2="136" stroke="currentColor" opacity="0.6"/>
  <line x1="426" y1="156" x2="434" y2="156" stroke="currentColor" opacity="0.6"/>
  <text x="330" y="162" font-size="10.5" fill="currentColor" opacity="0.7" text-anchor="end">expectation gap</text>
  <line x1="334" y1="158" x2="424" y2="148" stroke="currentColor" opacity="0.4"/>

  <!-- 80/20 note -->
  <line x1="175" y1="124" x2="175" y2="192" stroke="currentColor" stroke-dasharray="3 3" opacity="0.3"/>
  <text x="80" y="178" font-size="10.5" fill="currentColor" opacity="0.55">80% of the progress in the first 20% of the effort</text>
</svg>

<svg viewBox="0 0 620 260" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- draft -->
  <rect x="30" y="52" width="110" height="40" rx="5" fill="none" stroke="currentColor" opacity="0.7"/>
  <text x="85" y="76" font-size="11.5" text-anchor="middle" fill="currentColor">draft</text>

  <!-- peer review -->
  <rect x="220" y="24" width="130" height="40" rx="5" fill="none" stroke="currentColor" opacity="0.7"/>
  <text x="285" y="48" font-size="11.5" text-anchor="middle" fill="currentColor">peer review</text>

  <!-- rewrite -->
  <rect x="430" y="52" width="150" height="52" rx="5" fill="none" stroke="currentColor" opacity="0.7"/>
  <text x="505" y="72" font-size="11.5" text-anchor="middle" fill="currentColor">rewrite</text>
  <text x="505" y="90" font-size="10" text-anchor="middle" fill="currentColor" opacity="0.6">60% → 30% → 10%</text>

  <!-- build -->
  <rect x="220" y="160" width="130" height="40" rx="5" fill="none" stroke="currentColor" opacity="0.7"/>
  <text x="285" y="184" font-size="11.5" text-anchor="middle" fill="currentColor">build &amp; ship</text>

  <!-- production contact -->
  <rect x="430" y="180" width="160" height="52" rx="5" fill="none" stroke="#e2903a" stroke-width="2"/>
  <text x="510" y="200" font-size="11.5" text-anchor="middle" fill="#e2903a">production contact</text>
  <text x="510" y="218" font-size="10" text-anchor="middle" fill="currentColor" opacity="0.6">legal · backend · new use cases</text>

  <!-- arrows -->
  <!-- draft -> review -->
  <line x1="140" y1="64" x2="216" y2="50" stroke="currentColor" stroke-width="1.5"/>
  <path d="M216 50 l-8 -1 v7 z" fill="currentColor"/>
  <!-- review -> rewrite -->
  <line x1="350" y1="50" x2="426" y2="64" stroke="currentColor" stroke-width="1.5"/>
  <path d="M426 64 l-8 -5 l-1 7 z" fill="currentColor"/>
  <!-- rewrite -> review (loop back) -->
  <path d="M440 100 C 380 128, 320 110, 292 68" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.7"/>
  <path d="M292 68 l1 9 l6 -5 z" fill="currentColor" opacity="0.7"/>
  <text x="368" y="122" font-size="10" fill="currentColor" opacity="0.6">×3 iterations</text>
  <!-- rewrite -> build -->
  <line x1="430" y1="104" x2="354" y2="164" stroke="currentColor" stroke-width="1.5"/>
  <path d="M354 164 l4 -8 l5 6 z" fill="currentColor"/>
  <!-- build -> production -->
  <line x1="350" y1="192" x2="426" y2="200" stroke="currentColor" stroke-width="1.5"/>
  <path d="M426 200 l-8 -4 v8 z" fill="currentColor"/>
  <!-- production -> rewrite -->
  <path d="M520 180 C 528 150, 522 128, 512 108" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <path d="M512 108 l0 9 l7 -4 z" fill="#e2903a"/>
  <text x="536" y="146" font-size="10" fill="#e2903a">+30% after</text>
  <text x="536" y="159" font-size="10" fill="#e2903a">~3 months</text>
</svg>

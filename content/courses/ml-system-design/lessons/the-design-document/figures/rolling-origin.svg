<svg viewBox="0 0 620 204" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- gap annotation -->
  <text x="377" y="28" font-size="11" fill="currentColor" text-anchor="middle">3-day gap: data arrives up to 48 h late</text>
  <line x1="377" y1="34" x2="377" y2="48" stroke="currentColor" opacity="0.5"/>

  <!-- fold 1 -->
  <text x="62" y="63" font-size="11" fill="currentColor" opacity="0.7" text-anchor="end">fold 1</text>
  <rect x="70" y="50" width="300" height="18" rx="3" fill="#4c8dd6" opacity="0.4"/>
  <text x="220" y="63" font-size="11" fill="currentColor" opacity="0.75" text-anchor="middle">train: 2 years</text>
  <rect x="371" y="50" width="12" height="18" rx="2" fill="none" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5"/>
  <rect x="385" y="50" width="44" height="18" rx="3" fill="#e2903a" opacity="0.75"/>
  <text x="437" y="63" font-size="11" fill="#e2903a">score: 4 weeks ahead</text>

  <!-- fold 2 -->
  <text x="119" y="101" font-size="11" fill="currentColor" opacity="0.7" text-anchor="end">fold 2</text>
  <rect x="127" y="88" width="300" height="18" rx="3" fill="#4c8dd6" opacity="0.4"/>
  <rect x="428" y="88" width="12" height="18" rx="2" fill="none" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5"/>
  <rect x="442" y="88" width="44" height="18" rx="3" fill="#e2903a" opacity="0.75"/>

  <!-- fold 3 -->
  <text x="176" y="139" font-size="11" fill="currentColor" opacity="0.7" text-anchor="end">fold 3</text>
  <rect x="184" y="126" width="300" height="18" rx="3" fill="#4c8dd6" opacity="0.4"/>
  <rect x="485" y="126" width="12" height="18" rx="2" fill="none" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5"/>
  <rect x="499" y="126" width="44" height="18" rx="3" fill="#e2903a" opacity="0.75"/>

  <!-- rolling origin marker: through the left edges of the three scoring windows -->
  <line x1="388" y1="66" x2="502" y2="130" stroke="currentColor" stroke-dasharray="3 3" opacity="0.4"/>
  <text x="508" y="118" font-size="11" fill="currentColor" opacity="0.7">origin rolls forward</text>

  <!-- time axis -->
  <line x1="62" y1="168" x2="580" y2="168" stroke="currentColor" opacity="0.5"/>
  <line x1="572" y1="164" x2="580" y2="168" stroke="currentColor" opacity="0.5"/>
  <line x1="572" y1="172" x2="580" y2="168" stroke="currentColor" opacity="0.5"/>
  <text x="62" y="190" font-size="11" fill="currentColor" opacity="0.7">calendar time</text>
  <text x="580" y="190" font-size="10" fill="currentColor" opacity="0.55" text-anchor="end">widths not to scale — the three-day gap is widened to be visible</text>
</svg>

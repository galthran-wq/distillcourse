<svg viewBox="0 0 620 232" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- axis note -->
  <text x="16" y="26" font-size="11" fill="currentColor" opacity="0.7">each store received 1,000 units of item A</text>
  <line x1="16" y1="34" x2="604" y2="34" stroke="currentColor" opacity="0.25"/>

  <!-- row 1: sold 999 -->
  <text x="16" y="66" font-size="12" fill="currentColor">sold 999</text>
  <rect x="90" y="52" width="300" height="18" rx="3" fill="none" stroke="currentColor" opacity="0.4"/>
  <rect x="90" y="52" width="299.7" height="18" rx="3" fill="#5aa46a" opacity="0.75"/>
  <text x="402" y="66" font-size="11" fill="#5aa46a">near-optimal: 0.1% left over</text>

  <!-- row 2: sold 100 -->
  <text x="16" y="122" font-size="12" fill="currentColor">sold 100</text>
  <rect x="90" y="108" width="300" height="18" rx="3" fill="none" stroke="currentColor" opacity="0.4"/>
  <rect x="90" y="108" width="30" height="18" rx="3" fill="#e2903a" opacity="0.85"/>
  <text x="402" y="122" font-size="11" fill="#e2903a">overstock: 900 unsold — the visible loss</text>

  <!-- row 3: sold 1,000 -->
  <text x="16" y="178" font-size="12" fill="currentColor">sold 1,000</text>
  <rect x="90" y="164" width="300" height="18" rx="3" fill="none" stroke="currentColor" opacity="0.4"/>
  <rect x="90" y="164" width="300" height="18" rx="3" fill="#e2903a" opacity="0.5"/>
  <rect x="390" y="164" width="80" height="18" rx="3" fill="none" stroke="#e2903a" stroke-dasharray="3 3"/>
  <text x="422" y="177" font-size="12" fill="#e2903a">?</text>
  <text x="90" y="204" font-size="11" fill="#e2903a">worst case: true demand ≥ 1,000, unobserved — and the customers went elsewhere</text>
  <text x="478" y="177" font-size="10" fill="currentColor" opacity="0.55">unmet demand</text>
</svg>

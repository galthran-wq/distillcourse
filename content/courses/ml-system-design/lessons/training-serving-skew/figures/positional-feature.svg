<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- left panel: training rows -->
  <text x="20" y="24" font-size="11.5" font-weight="600" fill="#4c8dd6">training: position is the real slot</text>
  <line x1="20" y1="38" x2="300" y2="38" stroke="currentColor" stroke-width="1" opacity="0.4"/>
  <text x="28" y="53" font-size="10" fill="currentColor" opacity="0.55">doc features</text>
  <text x="180" y="53" font-size="10" fill="currentColor" opacity="0.55">position</text>
  <text x="250" y="53" font-size="10" fill="currentColor" opacity="0.55">clicked</text>
  <line x1="20" y1="60" x2="300" y2="60" stroke="currentColor" stroke-width="1" opacity="0.4"/>

  <text x="28" y="78" font-size="10.5" font-family="ui-monospace, monospace" fill="currentColor">x₁ …</text>
  <text x="196" y="78" font-size="11" font-weight="600" fill="#4c8dd6">1</text>
  <text x="258" y="78" font-size="10.5" fill="currentColor">yes</text>

  <text x="28" y="100" font-size="10.5" font-family="ui-monospace, monospace" fill="currentColor">x₂ …</text>
  <text x="196" y="100" font-size="11" font-weight="600" fill="#4c8dd6">2</text>
  <text x="258" y="100" font-size="10.5" fill="currentColor">no</text>

  <text x="28" y="122" font-size="10.5" font-family="ui-monospace, monospace" fill="currentColor">x₃ …</text>
  <text x="196" y="122" font-size="11" font-weight="600" fill="#4c8dd6">3</text>
  <text x="258" y="122" font-size="10.5" fill="currentColor">no</text>

  <text x="28" y="144" font-size="10.5" font-family="ui-monospace, monospace" fill="currentColor">x₄ …</text>
  <text x="196" y="144" font-size="11" font-weight="600" fill="#4c8dd6">5</text>
  <text x="258" y="144" font-size="10.5" fill="currentColor">no</text>

  <text x="20" y="172" font-size="9.5" fill="currentColor" opacity="0.55">the click's positional component has</text>
  <text x="20" y="185" font-size="9.5" fill="currentColor" opacity="0.55">somewhere to go besides the document</text>

  <!-- right panel: serving request -->
  <text x="350" y="24" font-size="11.5" font-weight="600" fill="#e2903a">serving: no order exists yet</text>
  <line x1="350" y1="38" x2="620" y2="38" stroke="currentColor" stroke-width="1" opacity="0.4"/>
  <text x="358" y="53" font-size="10" fill="currentColor" opacity="0.55">candidate</text>
  <text x="510" y="53" font-size="10" fill="currentColor" opacity="0.55">position</text>
  <line x1="350" y1="60" x2="620" y2="60" stroke="currentColor" stroke-width="1" opacity="0.4"/>

  <text x="358" y="78" font-size="10.5" font-family="ui-monospace, monospace" fill="currentColor">a …</text>
  <text x="526" y="78" font-size="11" font-weight="600" fill="#e2903a">1</text>
  <text x="358" y="100" font-size="10.5" font-family="ui-monospace, monospace" fill="currentColor">b …</text>
  <text x="526" y="100" font-size="11" font-weight="600" fill="#e2903a">1</text>
  <text x="358" y="122" font-size="10.5" font-family="ui-monospace, monospace" fill="currentColor">c …</text>
  <text x="526" y="122" font-size="11" font-weight="600" fill="#e2903a">1</text>
  <text x="358" y="144" font-size="10.5" font-family="ui-monospace, monospace" fill="currentColor">d …</text>
  <text x="526" y="144" font-size="11" font-weight="600" fill="#e2903a">1</text>

  <text x="350" y="172" font-size="9.5" fill="currentColor" opacity="0.55">candidates are scored before ranking,</text>
  <text x="350" y="185" font-size="9.5" fill="currentColor" opacity="0.55">so every request sends the constant default</text>

  <!-- separator -->
  <line x1="325" y1="20" x2="325" y2="190" stroke="currentColor" stroke-width="1" opacity="0.2"/>

  <!-- additive rule band -->
  <rect x="20" y="204" width="600" height="40" rx="6" fill="none" stroke="currentColor" stroke-width="1.3"/>
  <text x="34" y="222" font-size="11" fill="currentColor">score = <tspan font-weight="600" fill="#4c8dd6">f(document features)</tspan> + <tspan font-weight="600" fill="#e2903a">g(position)</tspan> — additive, never crossed</text>
  <text x="34" y="237" font-size="9.5" fill="currentColor" opacity="0.55">the deliberate asymmetry stays confined to g, the one term serving holds constant</text>
</svg>

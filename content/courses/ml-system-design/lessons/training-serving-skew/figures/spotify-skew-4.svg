<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- frame 4: four months later, the fix -->
  <text x="20" y="24" font-size="12" font-weight="600" fill="currentColor">4 · Four months later — the fix: log what serving computed</text>

  <!-- training lane -->
  <text x="20" y="58" font-size="11" font-weight="600" fill="#4c8dd6">training pipeline — ML team</text>
  <rect x="20" y="68" width="120" height="46" rx="5" fill="none" stroke="currentColor" stroke-width="1.3"/>
  <text x="32" y="87" font-size="11" fill="currentColor">warehouse</text>
  <text x="32" y="103" font-size="10" fill="currentColor" opacity="0.55">raw listens</text>
  <line x1="140" y1="91" x2="172" y2="91" stroke="currentColor" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.35"/>
  <polygon points="176,91 167,86 167,96" fill="currentColor" opacity="0.35"/>
  <rect x="180" y="64" width="170" height="54" rx="5" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.4"/>
  <text x="192" y="83" font-size="11" font-weight="600" fill="currentColor" opacity="0.4">transform — Python</text>
  <text x="192" y="102" font-size="10.5" fill="currentColor" opacity="0.4">retired: one implementation left</text>
  <line x1="350" y1="91" x2="382" y2="91" stroke="currentColor" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.35"/>
  <polygon points="386,91 377,86 377,96" fill="currentColor" opacity="0.35"/>
  <rect x="390" y="68" width="90" height="46" rx="5" fill="none" stroke="currentColor" stroke-width="1.3"/>
  <text x="402" y="94" font-size="11" fill="currentColor">training</text>
  <line x1="480" y1="91" x2="512" y2="91" stroke="#4c8dd6" stroke-width="1.6"/>
  <polygon points="516,91 507,86 507,96" fill="#4c8dd6"/>
  <rect x="520" y="68" width="100" height="46" rx="5" fill="none" stroke="currentColor" stroke-width="1.3"/>
  <text x="532" y="87" font-size="11" fill="currentColor">model</text>
  <text x="532" y="103" font-size="10" fill="currentColor" opacity="0.55">artifact</text>

  <!-- model artifact flows down to serving -->
  <path d="M 570 114 L 570 132 L 470 132 L 470 176" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.5"/>
  <polygon points="470,180 465,171 475,171" fill="currentColor" opacity="0.5"/>

  <!-- serving lane -->
  <text x="20" y="172" font-size="11" font-weight="600" fill="#e2903a">serving — recommendation service, different team</text>
  <rect x="20" y="182" width="120" height="46" rx="5" fill="none" stroke="currentColor" stroke-width="1.3"/>
  <text x="32" y="201" font-size="11" fill="currentColor">live request</text>
  <text x="32" y="217" font-size="10" fill="currentColor" opacity="0.55">listener</text>
  <line x1="140" y1="205" x2="172" y2="205" stroke="#e2903a" stroke-width="1.6"/>
  <polygon points="176,205 167,200 167,210" fill="#e2903a"/>
  <rect x="180" y="178" width="170" height="54" rx="5" fill="none" stroke="#e2903a" stroke-width="1.6"/>
  <text x="192" y="197" font-size="11" font-weight="600" fill="#e2903a">transform — Java</text>
  <text x="192" y="216" font-size="10.5" font-family="ui-monospace, monospace" fill="#e2903a" font-weight="600">log(1 + plays)</text>
  <text x="286" y="216" font-size="9.5" fill="#e2903a">← natural log</text>
  <line x1="350" y1="205" x2="382" y2="205" stroke="#e2903a" stroke-width="1.6"/>
  <polygon points="386,205 377,200 377,210" fill="#e2903a"/>
  <rect x="390" y="182" width="90" height="46" rx="5" fill="none" stroke="currentColor" stroke-width="1.3"/>
  <text x="402" y="201" font-size="11" fill="currentColor">model</text>
  <text x="402" y="217" font-size="10" fill="currentColor" opacity="0.55">same weights</text>
  <line x1="480" y1="205" x2="512" y2="205" stroke="#e2903a" stroke-width="1.6"/>
  <polygon points="516,205 507,200 507,210" fill="#e2903a"/>
  <rect x="520" y="182" width="100" height="46" rx="5" fill="none" stroke="currentColor" stroke-width="1.3"/>
  <text x="532" y="201" font-size="11" fill="currentColor">"Shows you</text>
  <text x="532" y="217" font-size="11" fill="currentColor">might like"</text>

  <!-- bracket: one logical transform -->
  <path d="M 360 122 C 372 122 372 122 372 148 C 372 174 372 174 360 174" fill="none" stroke="currentColor" stroke-width="1.1" opacity="0.55"/>
  <text x="380" y="144" font-size="10" fill="currentColor" opacity="0.55">one logical</text>
  <text x="380" y="157" font-size="10" fill="currentColor" opacity="0.55">transform</text>

  <!-- feature log: serving-time features become the training set -->
  <rect x="86" y="122" width="120" height="26" rx="5" fill="none" stroke="#5aa46a" stroke-width="1.6"/>
  <text x="96" y="139" font-size="11" font-weight="600" fill="#5aa46a">feature log</text>
  <line x1="230" y1="178" x2="176" y2="150" stroke="#5aa46a" stroke-width="1.6"/>
  <polygon points="172,148 180,146 178,156" fill="#5aa46a"/>
  <path d="M 206 135 L 435 135 L 435 122" fill="none" stroke="#5aa46a" stroke-width="1.6"/>
  <polygon points="435,118 430,127 440,127" fill="#5aa46a"/>
  <text x="96" y="160" font-size="9.5" fill="#5aa46a">already-transformed features → next training set</text>

  <!-- TFDV comparator -->
  <rect x="392" y="236" width="228" height="30" rx="5" fill="none" stroke="#e2903a" stroke-width="1.4"/>
  <text x="402" y="249" font-size="10" fill="currentColor">TFDV: train vs serve distributions,</text>
  <text x="402" y="261" font-size="10" fill="currentColor">alert on Chebyshev distance</text>

  <text x="20" y="284" font-size="10.5" fill="currentColor" opacity="0.55">One implementation survives; training consumes serving's logged features; a comparator watches both distributions.</text>
</svg>

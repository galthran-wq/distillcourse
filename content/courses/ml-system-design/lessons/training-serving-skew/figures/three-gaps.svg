<svg viewBox="0 0 640 250" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="20" y="24" font-size="12" font-weight="600" fill="currentColor">One model, four evaluations (accuracy)</text>

  <!-- dataset boxes -->
  <rect x="20" y="46" width="120" height="58" rx="6" fill="none" stroke="currentColor" stroke-width="1.3"/>
  <text x="34" y="68" font-size="11" font-weight="600" fill="currentColor">training set</text>
  <text x="34" y="90" font-size="15" font-weight="600" fill="currentColor">92.4</text>

  <rect x="180" y="46" width="120" height="58" rx="6" fill="none" stroke="currentColor" stroke-width="1.3"/>
  <text x="194" y="68" font-size="11" font-weight="600" fill="currentColor">holdout</text>
  <text x="194" y="90" font-size="15" font-weight="600" fill="currentColor">88.1</text>

  <rect x="340" y="46" width="120" height="58" rx="6" fill="none" stroke="currentColor" stroke-width="1.3"/>
  <text x="354" y="62" font-size="11" font-weight="600" fill="currentColor">next-day</text>
  <text x="354" y="76" font-size="9.5" fill="currentColor" opacity="0.55">after the cutoff</text>
  <text x="354" y="94" font-size="15" font-weight="600" fill="currentColor">87.6</text>

  <rect x="500" y="46" width="120" height="58" rx="6" fill="none" stroke="#e2903a" stroke-width="1.8"/>
  <text x="514" y="62" font-size="11" font-weight="600" fill="#e2903a">live traffic</text>
  <text x="514" y="76" font-size="9.5" fill="currentColor" opacity="0.55">features as served</text>
  <text x="514" y="94" font-size="15" font-weight="600" fill="#e2903a">79.3</text>

  <!-- arrows between boxes -->
  <line x1="140" y1="75" x2="174" y2="75" stroke="currentColor" stroke-width="1.2" opacity="0.5"/>
  <line x1="300" y1="75" x2="334" y2="75" stroke="currentColor" stroke-width="1.2" opacity="0.5"/>
  <line x1="460" y1="75" x2="494" y2="75" stroke="currentColor" stroke-width="1.2" opacity="0.5"/>

  <!-- gap 1 bracket -->
  <path d="M 80 112 L 80 122 L 240 122 L 240 112" fill="none" stroke="#4c8dd6" stroke-width="1.4"/>
  <text x="112" y="140" font-size="11" font-weight="600" fill="#4c8dd6">gap 1 · 4.3</text>
  <text x="84" y="156" font-size="10" fill="currentColor">overfitting</text>
  <text x="84" y="170" font-size="9.5" fill="currentColor" opacity="0.55">always &gt; 0, not always bad</text>
  <text x="84" y="184" font-size="9.5" fill="currentColor" opacity="0.55">lever: regularization</text>

  <!-- gap 2 bracket -->
  <path d="M 250 112 L 250 122 L 400 122 L 400 112" fill="none" stroke="#4c8dd6" stroke-width="1.4"/>
  <text x="278" y="140" font-size="11" font-weight="600" fill="#4c8dd6">gap 2 · 0.5</text>
  <text x="254" y="156" font-size="10" fill="currentColor">staleness</text>
  <text x="254" y="170" font-size="9.5" fill="currentColor" opacity="0.55">time-sensitive features decay</text>
  <text x="254" y="184" font-size="9.5" fill="currentColor" opacity="0.55">lever: retraining cadence</text>

  <!-- gap 3 bracket, the subject -->
  <path d="M 410 112 L 410 122 L 610 122 L 610 112" fill="none" stroke="#e2903a" stroke-width="1.8"/>
  <text x="462" y="140" font-size="11" font-weight="600" fill="#e2903a">gap 3 · 8.3</text>
  <text x="414" y="156" font-size="10" font-weight="600" fill="#e2903a">skew proper</text>
  <text x="414" y="170" font-size="9.5" fill="currentColor" opacity="0.55">pipeline discrepancy — should be ≈ 0</text>
  <text x="414" y="184" font-size="9.5" fill="currentColor" opacity="0.55">lever: transform architecture</text>

  <!-- deterministic test note -->
  <text x="20" y="222" font-size="10.5" fill="currentColor" opacity="0.55">Deterministic test for gap 3: the same example scored through both pipelines must match bit for bit.</text>
</svg>

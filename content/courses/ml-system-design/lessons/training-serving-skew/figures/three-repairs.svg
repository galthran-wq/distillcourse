<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- column 1: log and wait -->
  <text x="20" y="24" font-size="11.5" font-weight="600" fill="currentColor">1 · log and wait</text>
  <text x="20" y="38" font-size="9.5" fill="currentColor" opacity="0.55">Rules of ML #29</text>

  <rect x="20" y="52" width="160" height="34" rx="5" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <text x="30" y="73" font-size="10.5" fill="currentColor">serving computes features</text>
  <line x1="95" y1="86" x2="95" y2="112" stroke="#5aa46a" stroke-width="1.6"/>
  <polygon points="95,116 90,107 100,107" fill="#5aa46a"/>
  <rect x="20" y="118" width="150" height="30" rx="5" fill="none" stroke="#5aa46a" stroke-width="1.5"/>
  <text x="32" y="137" font-size="10.5" font-weight="600" fill="#5aa46a">feature log</text>
  <line x1="95" y1="148" x2="95" y2="174" stroke="#5aa46a" stroke-width="1.6"/>
  <polygon points="95,178 90,169 100,169" fill="#5aa46a"/>
  <rect x="20" y="180" width="150" height="34" rx="5" fill="none" stroke="#4c8dd6" stroke-width="1.5"/>
  <text x="32" y="201" font-size="10.5" fill="#4c8dd6">next training set</text>

  <text x="20" y="240" font-size="9.5" fill="currentColor" opacity="0.7">costs:</text>
  <text x="20" y="254" font-size="9.5" fill="currentColor" opacity="0.55">· new feature waits a window</text>
  <text x="20" y="268" font-size="9.5" fill="currentColor" opacity="0.55">· storage (sample + weight)</text>
  <text x="20" y="282" font-size="9.5" fill="currentColor" opacity="0.55">· consistent ≠ correct</text>

  <!-- column 2: transform in the model -->
  <text x="240" y="24" font-size="11.5" font-weight="600" fill="currentColor">2 · transform in the model</text>
  <text x="240" y="38" font-size="9.5" fill="currentColor" opacity="0.55">Design Pattern 21</text>

  <text x="240" y="70" font-size="10.5" fill="currentColor">raw inputs</text>
  <line x1="305" y1="66" x2="305" y2="92" stroke="currentColor" stroke-width="1.4" opacity="0.6"/>
  <polygon points="305,96 300,87 310,87" fill="currentColor" opacity="0.6"/>
  <rect x="240" y="100" width="160" height="114" rx="6" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="252" y="118" font-size="10" fill="currentColor" opacity="0.55">model artifact</text>
  <rect x="252" y="126" width="136" height="36" rx="4" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <text x="262" y="141" font-size="10" font-weight="600" fill="#e2903a">transform graph</text>
  <text x="262" y="155" font-size="9" fill="currentColor" opacity="0.55">μ, σ, vocab as constants</text>
  <rect x="252" y="168" width="136" height="34" rx="4" fill="none" stroke="#4c8dd6" stroke-width="1.5"/>
  <text x="262" y="189" font-size="10" font-weight="600" fill="#4c8dd6">weights</text>

  <text x="240" y="240" font-size="9.5" fill="currentColor" opacity="0.7">costs:</text>
  <text x="240" y="254" font-size="9.5" fill="currentColor" opacity="0.55">· analyze pass for statistics</text>
  <text x="240" y="268" font-size="9.5" fill="currentColor" opacity="0.55">· artifact weight</text>
  <text x="240" y="282" font-size="9.5" fill="currentColor" opacity="0.55">· framework lock-in</text>

  <!-- column 3: feature store -->
  <text x="460" y="24" font-size="11.5" font-weight="600" fill="currentColor">3 · feature store</text>
  <text x="460" y="38" font-size="9.5" fill="currentColor" opacity="0.55">one computation, two reads</text>

  <rect x="470" y="100" width="140" height="40" rx="5" fill="none" stroke="#e2903a" stroke-width="1.6"/>
  <text x="482" y="117" font-size="10.5" font-weight="600" fill="#e2903a">feature store</text>
  <text x="482" y="131" font-size="9" fill="currentColor" opacity="0.55">transform runs once</text>

  <line x1="505" y1="140" x2="485" y2="176" stroke="#4c8dd6" stroke-width="1.6"/>
  <polygon points="483,180 482,171 491,175" fill="#4c8dd6"/>
  <text x="440" y="196" font-size="10" fill="#4c8dd6">training</text>
  <text x="440" y="209" font-size="9" fill="#4c8dd6">as-of join</text>

  <line x1="575" y1="140" x2="595" y2="176" stroke="#e2903a" stroke-width="1.6"/>
  <polygon points="597,180 598,171 589,175" fill="#e2903a"/>
  <text x="572" y="196" font-size="10" fill="#e2903a">serving</text>
  <text x="572" y="209" font-size="9" fill="#e2903a">online fetch</text>

  <text x="460" y="240" font-size="9.5" fill="currentColor" opacity="0.7">costs:</text>
  <text x="460" y="254" font-size="9.5" fill="currentColor" opacity="0.55">· infrastructure to run</text>
  <text x="460" y="268" font-size="9.5" fill="currentColor" opacity="0.55">· post-fetch transforms open</text>
  <text x="460" y="282" font-size="9.5" fill="currentColor" opacity="0.55">· as-of joins must be built</text>

  <!-- separators -->
  <line x1="215" y1="20" x2="215" y2="285" stroke="currentColor" stroke-width="1" opacity="0.2"/>
  <line x1="435" y1="20" x2="435" y2="285" stroke="currentColor" stroke-width="1" opacity="0.2"/>
</svg>

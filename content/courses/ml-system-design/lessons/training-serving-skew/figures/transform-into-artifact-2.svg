<svg viewBox="0 0 620 260" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="20" y="24" font-size="12" font-weight="600" fill="currentColor">2 · freeze: the statistics become constants in the graph</text>

  <!-- training data -->
  <rect x="20" y="44" width="140" height="48" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="32" y="64" font-size="11" fill="currentColor">training data</text>
  <text x="32" y="80" font-size="9.5" fill="currentColor" opacity="0.55">every row, once</text>

  <!-- arrow data -> analyze -->
  <line x1="160" y1="68" x2="200" y2="68" stroke="#e2903a" stroke-width="1.6"/>
  <polygon points="206,68 197,63 197,73" fill="#e2903a"/>

  <!-- analyze phase -->
  <rect x="210" y="44" width="150" height="48" rx="5" fill="none" stroke="#e2903a" stroke-width="1.6"/>
  <text x="222" y="62" font-size="11" font-weight="600" fill="#e2903a">analyze phase</text>
  <text x="222" y="79" font-size="9.5" fill="currentColor">μ = 350, σ = 80, vocab</text>

  <!-- arrow analyze -> transform graph -->
  <line x1="360" y1="68" x2="414" y2="82" stroke="#e2903a" stroke-width="1.6"/>
  <polygon points="420,84 411,86 413,77" fill="#e2903a"/>

  <!-- exported artifact -->
  <rect x="410" y="30" width="190" height="160" rx="6" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="422" y="48" font-size="10" fill="currentColor" opacity="0.55">exported artifact</text>
  <rect x="422" y="58" width="166" height="62" rx="4" fill="none" stroke="#e2903a" stroke-width="1.6"/>
  <text x="434" y="76" font-size="10.5" font-weight="600" fill="#e2903a">transform graph</text>
  <text x="434" y="93" font-size="9.5" fill="currentColor">(x − 350) / 80 · vocab lookup</text>
  <text x="434" y="108" font-size="9" fill="currentColor" opacity="0.55">statistics frozen as constants</text>
  <rect x="422" y="130" width="166" height="48" rx="4" fill="none" stroke="#4c8dd6" stroke-width="1.5"/>
  <text x="434" y="158" font-size="10.5" font-weight="600" fill="#4c8dd6">weights</text>

  <!-- serving path, not yet active -->
  <text x="20" y="222" font-size="10.5" fill="currentColor" opacity="0.25">serving request: raw inputs</text>
  <line x1="190" y1="218" x2="495" y2="218" stroke="currentColor" stroke-width="1.4" opacity="0.25"/>
  <line x1="495" y1="218" x2="495" y2="198" stroke="currentColor" stroke-width="1.4" opacity="0.25"/>
  <polygon points="495,194 490,203 500,203" fill="currentColor" opacity="0.25"/>
</svg>

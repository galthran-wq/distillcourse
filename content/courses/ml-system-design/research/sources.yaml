# Canon for ml-system-design. Access notes record what the reading swarm
# actually read; local texts live in research/texts/, captures in
# research/images/ (indexed by research/images.yaml).
sources:
  - title: "Designing Machine Learning Systems: An Iterative Process for Production-Ready Applications"
    authors: "C. Huyen"
    year: 2022
    url: "https://www.oreilly.com/library/view/designing-machine-learning-systems/9781098107956/"
    access: "full — human-staged PDF read cover to cover (Ch.1-11 + epilogue) in three shards; local copy in research/texts/"
    role: "Backbone of modules 1, 3, 5, 6: research-vs-production, framing/objectives, training data (sampling/labeling/imbalance), feature engineering and leakage, batch/online prediction, compression, drift taxonomy, monitoring, continual learning, test-in-production, infra layers, responsible-AI case studies"
  - title: "Designing Data-Intensive Applications"
    authors: "M. Kleppmann"
    year: 2017
    url: "https://dataintensive.net/"
    access: "full — human-staged PDF read cover to cover (Ch.1-12) in three shards; local copy in research/texts/"
    role: "Primary source for module 2: storage engines, replication and lag anomalies, partitioning, transactions/consistency (extra lesson), queues/logs/CDC, batch and stream processing; also load-parameter and percentile-latency framing in module 1"
  - title: "AI Engineering: Building Applications with Foundation Models"
    authors: "C. Huyen"
    year: 2025
    url: "https://www.oreilly.com/library/view/ai-engineering/9781098166298/"
    access: "full — human-staged PDF read cover to cover (Ch.1-10 + epilogue) in three shards; local copy in research/texts/"
    role: "Backbone of module 8: the AI-engineering stack, sampling/hallucination, evaluation and AI-as-judge, model selection, prompting and defensive prompting, RAG and agents, finetuning/PEFT, dataset engineering, inference optimization, the incremental reference architecture and user feedback"
  - title: "Hidden Technical Debt in Machine Learning Systems"
    authors: "D. Sculley et al."
    year: 2015
    url: "https://papers.nips.cc/paper_files/paper/2015/file/86df7dcfd896fcaf2674f757a2463eba-Paper.pdf"
    access: "full — PDF fetched and read in full (9 pages)"
    role: "The opening framing paper (module 1): the small-black-box diagram, CACE, correction cascades, feedback loops, pipeline jungles, configuration debt, monitoring invariants — vocabulary reused across the whole course"
  - title: "Rules of Machine Learning: Best Practices for ML Engineering"
    authors: "M. Zinkevich"
    year: 2018
    url: "https://developers.google.com/machine-learning/guides/rules-of-ml"
    access: "full — fetched from the canonical Google Developers page; cached text in research/texts/"
    role: "Cross-cutting engineering doctrine: heuristics-first (module 1), objective choice, training-serving-skew rules #29-#37 (module 3), positional features (module 7), launch-decision framing (module 5)"
  - title: "TFX: A TensorFlow-Based Production-Scale Machine Learning Platform"
    authors: "D. Baylor, E. Breck, H.-T. Cheng, N. Fiedel, et al."
    year: 2017
    url: "https://storage.googleapis.com/gweb-research2023-media/pubtools/4795.pdf"
    access: "full — PDF fetched and read in full (KDD 2017, 9 pages)"
    role: "Primary source for module 4's application lesson (inside-tfx) and module 3's data-validation lesson: schema-driven validation, warm-starting, model validation gates, serving multitenancy, the Google Play +2% case"
  - title: "Machine Learning Design Patterns"
    authors: "V. Lakshmanan, S. Robinson, M. Munn"
    year: 2020
    url: "https://www.oreilly.com/library/view/machine-learning-design/9781098115777/"
    access: "full — human-staged PDF read cover to cover (all 30 patterns) in four shards; local copy in research/texts/"
    role: "Named patterns quarried per lesson: Hashed Feature and Feature Cross (features-at-scale), Transform and Repeatable Splitting (module 3), Checkpoints/Distribution Strategy (distributed training), Stateless Serving/Batch Serving/Two-Phase/Keyed Predictions (module 5), Continued Evaluation (module 6), Feature Store (module 2), Heuristic Benchmark (module 1)"
  - title: "Machine Learning Engineering"
    authors: "A. Burkov"
    year: 2020
    url: "http://www.mlebook.com/"
    access: "full — 'read first, buy later' PDF read cover to cover; local copy in research/texts/"
    role: "Lifecycle checklists and war stories: cost-vs-accuracy curve and scoping (module 1), leakage and bias taxonomies (module 3), G-test/Z-test A/B mechanics and bandits (module 5), serving-runtime properties, monitoring heuristics, 'three cannots' (module 6)"
  - title: "Machine Learning Production Systems: Engineering Machine Learning Models and Pipelines"
    authors: "R. Crowe, H. Hapke, E. Caveness, D. Zhu"
    year: 2024
    url: "https://www.oreilly.com/library/view/machine-learning-production/9781098156008/"
    access: "full — human-staged PDF read in three shards covering Ch.1-8 and 10-23 (Ch.9 Interpretability not covered); local copy in research/texts/"
    role: "TFX-era pipeline mechanics for modules 3-6 and 8: TFDV/schema environments, MLMD lineage, quantization/pruning/distillation tables, distributed strategies, model servers (TF Serving/Triton/TorchServe), MLOps maturity levels, drift detection techniques, privacy (DP/federated), GenAI ops (LoRA, DPO, attacks)"
  - title: "Machine Learning System Design: With End-to-End Examples"
    authors: "V. Babushkin, A. Kravchenko"
    year: 2023
    url: "https://www.manning.com/books/machine-learning-system-design"
    access: "full — human-staged PDF read cover to cover (Ch.1-16) in two shards; local copy in research/texts/"
    role: "The design-document method (module 1's application) with the Supermegaretail and PhotoStock running cases; A/B testing depth, monitoring pyramid, serving patterns, ownership/maintenance framing"
  - title: "Machine Learning System Design Interview"
    authors: "A. Aminian, A. Xu"
    year: 2023
    url: "https://bytebytego.com/intro/machine-learning-system-design-interview"
    access: "full — human-staged PDF; text extraction corrupted, every page hand-verified from PNG renders"
    role: "Module 7 case studies: the 7-step design template, visual search and contrastive training, the ranking-metric ladder taught by counterexample, and the end-to-end dissections' primary grounding — YouTube search (design-search-ranking), news feed (design-feed-ranking), ad click prediction (design-ad-click-prediction), harmful content (design-harmful-content), video recommendation and PYMK"
  - title: "Machine Learning Design Interview"
    authors: "K. Pham"
    year: 2022
    url: "https://www.amazon.com/Machine-Learning-Design-Interview-System/dp/B09YQWX59Z"
    access: "full — human-staged PDF read in full (236 pp); page mapping established by direct reading"
    role: "Module 7 production recsys detail: two-tower with sampled-softmax correction, DCN/Wide&Deep/DLRM, NCE worked example, calibration and downsampling correction, position bias/impression discounting, budget-split A/B and the retraining-cadence ladder; end-to-end grounding for design-search-ranking (Airbnb search), design-feed-ranking (LinkedIn feed), design-ad-click-prediction (waterfall ads); deployment patterns and training-serving skew postmortems"
  - title: "CS 329S: Machine Learning Systems Design (Stanford, Winter 2022)"
    authors: "C. Huyen et al."
    year: 2022
    url: "https://stanford-cs329s.github.io/syllabus.html"
    access: "full — syllabus plus eight prose lecture notes fetched as PDF exports; cached in research/texts/"
    role: "Parallel lecture-note track to DMLS used for framing emphasis and figures (mind-vs-data, drift windows, degenerate feedback loops); source of the poisoning-backdoor and hierarchy-of-needs captures"
  - title: "Retrieval-Augmented Generation for Knowledge-Intensive NLP Tasks"
    authors: "P. Lewis et al."
    year: 2020
    url: "https://arxiv.org/abs/2005.11401"
    access: "full — arXiv v4 PDF read in full including appendices"
    role: "Primary source for the RAG lesson: the architecture diagram, RAG-Sequence vs RAG-Token, index hot-swapping (2016/2018 Wikipedia), retrieval collapse failure mode"
  - title: "Efficient Memory Management for Large Language Model Serving with PagedAttention"
    authors: "W. Kwon et al."
    year: 2023
    url: "https://arxiv.org/abs/2309.06180"
    access: "full — arXiv PDF (SOSP '23) read in full (16 pages)"
    role: "Primary source for the LLM-inference lesson: KV-cache fragmentation measurements, PagedAttention block tables and the virtual-memory analogy, copy-on-write sharing, swap-vs-recompute, the 2-4x throughput result"
  - title: "The System Design Primer"
    authors: "D. Martin"
    year: 2024
    url: "https://github.com/donnemartin/system-design-primer"
    access: "full — complete README read; deep-dive solution writeups not fetched"
    role: "Module 2 reference for the classic system-design core: CAP phrasing, availability arithmetic, caching update strategies, load balancing, latency-numbers table; back-of-envelope material for module 7's design walkthrough"
  - title: "Made With ML (MLOps Course)"
    authors: "G. Mohandas"
    year: 2024
    url: "https://madewithml.com/"
    access: "full — all 24 lesson pages fetched via reader proxy; images captured directly"
    role: "Working-code grounding for modules 4 and 6: experiment tracking/tuning with real dashboards, CI/CD workflows, testing, and the drift-detection walkthrough (KS/chi-squared/MMD numbers) that module 6's application lesson reproduces"

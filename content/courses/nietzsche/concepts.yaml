concepts:
  # --- Module 1: The man and the problem ---
  - id: three-periods
    name: Three periods
    definition: "The conventional division of Nietzsche's work: the Wagnerian, Schopenhauerian professor (1869-76), the free-spirit aphorist of Human, All Too Human to The Gay Science (1878-82), and the mature works from Zarathustra to 1888"
    introduced_in: nietzsche-life-and-books
  - id: aphorism
    name: Aphorism
    definition: "Nietzsche's working unit: a numbered section from one line to a few pages, usually a compressed argument whose key step is left implicit or carried by an image; 'not deciphered when it has simply been read' (Genealogy Preface 8)"
    introduced_in: nietzsche-life-and-books
  - id: nachlass
    name: Nachlass
    definition: "Nietzsche's unpublished notebooks and drafts; evidence of what he was trying out, ranked below the books he published, and the raw material of the posthumous compilation The Will to Power"
    introduced_in: nietzsche-life-and-books
  - id: will-to-live
    name: Will to live
    definition: "Schopenhauer's name for the blind, insatiable striving that he held to be the inner nature of everything, including us"
    introduced_in: schopenhauer-and-the-birth-of-tragedy
  - id: schopenhauers-pessimism
    name: Schopenhauer's pessimism
    definition: "The verdict that existence is worse than non-existence because wanting is pain, satisfaction only relief, and its absence boredom; the cure is to stop willing"
    introduced_in: schopenhauer-and-the-birth-of-tragedy
  - id: apollonian-and-dionysian
    name: Apollonian and Dionysian
    definition: "The two art-impulses of The Birth of Tragedy: Apollo's clear forms and individuated images (dream), Dionysus's intoxication in which the individual dissolves; Greek tragedy joins them"
    introduced_in: schopenhauer-and-the-birth-of-tragedy
  - id: aesthetic-justification
    name: Aesthetic justification of existence
    definition: "The early claim that 'only as an aesthetic phenomenon is existence and the world eternally justified' (BT 5): art, not morality or reason, makes life worth living, a justification seen from the world-artist's side"
    introduced_in: schopenhauer-and-the-birth-of-tragedy
  - id: death-of-god
    name: Death of God
    definition: "The event that 'the belief in the Christian god has become unbelievable' (Gay Science 343) for educated Europe, with consequences for every value that rested on that belief"
    introduced_in: death-of-god
  - id: discrediting
    name: Discrediting a belief
    definition: "Undermining a belief without refuting it, by explaining why people came to hold it in a way that does not depend on its being true; 'historical refutation as the definitive refutation' (Daybreak 95)"
    introduced_in: death-of-god
  - id: nihilism
    name: Nihilism
    definition: "The condition in which the highest values devalue themselves: they lose their standing, or are seen to be unrealizable in this world, and life appears to have no aim"
    introduced_in: nihilism
  - id: passive-and-active-nihilism
    name: Passive and active nihilism
    definition: "Passive nihilism is the exhausted decline that follows the loss of values; active nihilism is the increased power of a spirit that destroys what is already falling (notebook 9[35], unpublished)"
    introduced_in: nihilism
  - id: decadence
    name: Decadence
    definition: "Nietzsche's diagnosis of declining life: drives in disorder, instincts that work against themselves, a preference for whatever numbs or negates; 'to have to fight the instincts, that is the formula of decadence'"
    introduced_in: nihilism
  - id: revaluation
    name: Revaluation of all values
    definition: "Nietzsche's project after nihilism: not to restore the old values but to judge them by a new standard, ascending life, and replace the life-negating ones"
    introduced_in: nihilism
  - id: romantic-pessimism
    name: Romantic pessimism
    definition: "Art and philosophy made from hunger and a wish for rest or redemption, as opposed to Dionysian pessimism, made from superabundance (Gay Science 370); the test is 'is it hunger or superabundance that has here become creative?'"
    introduced_in: case-of-wagner
  # --- Module 2: What a human being is ---
  - id: drives
    name: Drives
    definition: "Standing dispositions (Triebe) that interpret the world in their own interest and strive to express themselves; for Nietzsche the real constituents of a person, fed by chance and morally neutral in themselves"
    introduced_in: self-as-society-of-drives
  - id: soul-as-commonwealth
    name: Soul as a commonwealth of drives
    definition: "The picture of the self as 'a social structure of the drives and affects' with an order of rank among them, unity being an achievement rather than a given (Beyond Good and Evil 12, 19)"
    introduced_in: self-as-society-of-drives
  - id: consciousness-as-communication
    name: Consciousness as communication
    definition: "The thesis of Gay Science 354 that consciousness developed only under the need to communicate, so it renders inner life in shared, average terms and belongs to our herd nature"
    introduced_in: consciousness-and-language
  - id: herd-instinct
    name: Herd instinct
    definition: "The drive to conform, obey and value what makes the group cohere; 'morality is herd instinct in the individual' (Gay Science 116)"
    introduced_in: consciousness-and-language
  - id: doer-deed-fiction
    name: Doer behind the deed
    definition: "The fiction, built into grammar, of a subject separate from its actions who could have acted otherwise; 'the doer is merely a fiction added to the deed' (Genealogy I 13), and the presupposition of blame"
    introduced_in: doer-behind-the-deed
  - id: causa-sui
    name: Causa sui
    definition: "Being the cause of oneself; what free will in the full moral sense would require, and what Nietzsche calls 'the best self-contradiction conceived so far' (Beyond Good and Evil 21)"
    introduced_in: doer-behind-the-deed
  - id: will-to-power
    name: Will to power
    definition: "Read psychologically: the drive in living things to discharge strength, grow and overcome resistance in pursuing their ends, of which self-preservation is only 'one of its indirect and most frequent results' (Beyond Good and Evil 13)"
    introduced_in: will-to-power-as-psychology
  - id: overcoming-resistance
    name: Overcoming resistance
    definition: "What will to power wants: not a final state but the activity of overcoming obstacles, 'the feeling that power is growing, that resistance is overcome' (Antichrist 2), so its satisfaction requires new resistance"
    introduced_in: will-to-power-as-psychology
  - id: sublimation
    name: Sublimation
    definition: "Redirecting a drive to a new, often more refined object while keeping its force, as opposed to discharging or extirpating it; 'good acts are sublimated evil' (Human, All Too Human 107)"
    introduced_in: sublimation
  - id: spiritualization
    name: Spiritualization
    definition: "Nietzsche's term (Vergeistigung) for a passion raised into a higher form: 'the spiritualization of sensuality is called love', of hostility is valuing one's enemies (Twilight, 'Morality as Anti-Nature' 3)"
    introduced_in: sublimation
  - id: four-great-errors
    name: Four great errors
    definition: "Twilight's catalogue of the mistakes morality and religion rest on: confusing cause and effect, false causality (will, spirit, ego as inner facts), imaginary causes, and free will invented for punishing"
    introduced_in: four-great-errors
  - id: innocence-of-becoming
    name: Innocence of becoming
    definition: "The conclusion of the Four Great Errors: 'no one gives man his qualities', 'nothing besides the whole', so nobody is responsible for being as he is and nothing can be judged, blamed or condemned as a whole"
    introduced_in: four-great-errors
  - id: type-facts
    name: Type-facts
    definition: "Relatively fixed psychological and physiological traits of a person that, on the naturalist reading, explain their beliefs, values and actions; 'a granite of spiritual fate' (Beyond Good and Evil 231)"
    introduced_in: drive-psychology-and-experiment
  - id: confabulation
    name: Confabulation
    definition: "Giving sincere reasons for an action or attitude that were not its actual causes; the empirical counterpart of Nietzsche's unreliable consciousness"
    introduced_in: drive-psychology-and-experiment
  # --- Module 3: Where good and evil came from ---
  - id: genealogy
    name: Genealogy
    definition: "A history of how a value or practice came to be, used to assess its worth by showing which kind of life it expressed and served, not to refute it by its origin"
    introduced_in: genealogy-as-method
  - id: origin-and-purpose
    name: Origin and purpose
    definition: "The principle that the cause of a thing's coming to be and its present use 'lie worlds apart', since uses are reimposed by whatever currently masters the thing (Genealogy II 12)"
    introduced_in: genealogy-as-method
  - id: master-morality
    name: Master morality
    definition: "The noble mode of valuation: 'good' is said first of oneself and one's own strength, 'bad' afterwards of the low and common; the noble is 'value-creating' and has duties only to equals (Beyond Good and Evil 260)"
    introduced_in: master-morality
  - id: pathos-of-distance
    name: Pathos of distance
    definition: "The felt sense of rank between oneself and others that Nietzsche holds is the source of the noble right to coin values and the precondition of every enhancement of the type man"
    introduced_in: master-morality
  - id: ressentiment
    name: Ressentiment
    definition: "Hatred and the wish for revenge in those who cannot act on them, turned into a way of valuing that condemns the one who is envied; 'his soul squints' (Genealogy I 10)"
    introduced_in: slave-revolt-and-ressentiment
  - id: slave-morality
    name: Slave morality
    definition: "The reactive mode of valuation: 'evil' is said first of the powerful other, and 'good' derived by negation as the meek, patient and humble; 'essentially a morality of utility' (Beyond Good and Evil 260)"
    introduced_in: slave-revolt-and-ressentiment
  - id: slave-revolt
    name: Slave revolt in morality
    definition: "The historical inversion in which slave morality displaced noble values, begun by the Jewish priests and completed in Europe by the victory of Christianity (Genealogy I 7, Beyond Good and Evil 195)"
    introduced_in: slave-revolt-and-ressentiment
  - id: redeemer-type
    name: The redeemer type
    definition: "Nietzsche's psychology of Jesus in The Antichrist: a figure of non-resistance and inner blessedness whose evangel is 'a new way of life, not a new faith', and who lacks ressentiment"
    introduced_in: jesus-and-paul
  # --- Module 4: Guilt, bad conscience and the ascetic priest ---
  - id: promising-animal
    name: The promising animal
    definition: "The human being bred to make and keep promises, which requires a memory that pain had to burn in: 'only that which never ceases to hurt stays in the memory' (Genealogy II 1-3)"
    introduced_in: debt-and-punishment
  - id: morality-of-custom
    name: Morality of custom
    definition: "The earliest morality: obedience to tradition 'not because it commands what is useful to us, but because it commands', enforced by fear and punishment (Daybreak 9)"
    introduced_in: debt-and-punishment
  - id: creditor-debtor
    name: Creditor-debtor relation
    definition: "The oldest relation between persons, in which the creditor may take the debtor's pain as repayment, 'a warrant for and title to cruelty'; for Nietzsche the origin of guilt and of justice"
    introduced_in: debt-and-punishment
  - id: festival-of-cruelty
    name: Festival of cruelty
    definition: "Nietzsche's claim that making suffer was the oldest festival pleasure of mankind, 'without cruelty there is no festival' (Genealogy II 6-7), and that what offends is not suffering but senseless suffering"
    introduced_in: cruelty-and-culture
  - id: spiritualized-cruelty
    name: Spiritualized cruelty
    definition: "The thesis that 'almost everything we call higher culture rests on the spiritualization and deepening of cruelty', the wild animal 'only deified' in tragedy, religion and knowledge (Beyond Good and Evil 229)"
    introduced_in: cruelty-and-culture
  - id: bad-conscience
    name: Bad conscience
    definition: "Raw self-torment produced when instincts denied outward discharge in society turn back against the self; 'an illness as pregnancy is an illness' (Genealogy II 19)"
    introduced_in: bad-conscience
  - id: internalization
    name: Internalization
    definition: "'All instincts that do not discharge themselves outwardly turn inward: this is what I call the internalization of man' (Genealogy II 16), which created the human inner world"
    introduced_in: bad-conscience
  - id: guilt
    name: Guilt
    definition: "Bad conscience moralized: self-torment interpreted as deserved punishment for a debt, made infinite by the debt to God and his self-sacrifice for the debtor (Genealogy II 21)"
    introduced_in: guilt-before-god
  - id: ascetic-ideal
    name: Ascetic ideal
    definition: "The valuation of self-denial and of another world above this one, which gives suffering a meaning at the price of turning life against itself; 'an artifice for the preservation of life' (Genealogy III 13)"
    introduced_in: ascetic-priest
  - id: ascetic-priest
    name: Ascetic priest
    definition: "The figure who rules the suffering by changing the direction of their ressentiment: 'I suffer: someone must be to blame for it ... you yourself are this someone' (Genealogy III 15)"
    introduced_in: ascetic-priest
  - id: will-to-nothingness
    name: Will to nothingness
    definition: "The ascetic ideal's ultimate aim, which is still a willing: 'man would rather will nothingness than not will' (Genealogy III 28)"
    introduced_in: ascetic-priest
  - id: philosophers-asceticism
    name: The philosopher's asceticism
    definition: "Poverty, humility and chastity as 'an optimum condition for the highest and boldest spirituality', conditions rather than virtues (Genealogy III 7-8); the ascetic ideal in a form that does not deny life"
    introduced_in: ascetic-ideals-in-artists-and-philosophers
  # --- Module 5: What morality does to us ---
  - id: critique-of-pity
    name: Critique of pity
    definition: "Nietzsche's case that pity multiplies suffering ('the practice of nihilism', Antichrist 7), disguises a feeling of power, and condemns the suffering that every elevation of man has required"
    introduced_in: against-pity
  - id: morality-in-the-pejorative-sense
    name: Morality in the pejorative sense
    definition: "The morality Nietzsche denies 'as I deny alchemy' (Daybreak 103): one resting on free will, a transparent self and one nature for all, with norms that favour the many and harm the highest types"
    introduced_in: danger-of-dangers
  - id: harm-to-higher-types
    name: Harm to higher types
    definition: "Nietzsche's central charge: believing morality's norms leads the most gifted to squander themselves in pity, self-denial and the pursuit of comfort, so that 'the highest power and splendor actually possible to the type man' is never attained (Genealogy Preface 6)"
    introduced_in: danger-of-dangers
  - id: herd-morality
    name: Herd morality
    definition: "'Herd-animal morality', claiming to be the only morality (Beyond Good and Evil 202); in modern Europe it takes the form of equality, democracy, socialism, emancipation and the abolition of suffering"
    introduced_in: herd-morality-in-modern-dress
  - id: ascending-and-descending-life
    name: Ascending and descending life
    definition: "The standard behind Nietzsche's valuations: whether a person or culture 'represents the ascending or the descending line of life' (Twilight, Skirmishes 33) decides the value of its egoism, its morality and its art"
    introduced_in: skirmishes-of-an-untimely-man
  # --- Module 6: Where truth came from ---
  - id: true-world
    name: True world
    definition: "The world behind appearances, unchanging and reachable by reason or promised by faith, by which this world was judged; 'the mendaciously invented world' (Ecce Homo Preface 2)"
    introduced_in: real-world-became-a-fable
  - id: platonism
    name: Platonism
    definition: "The two-world picture of a true realm of Forms above the world of the senses; 'Christianity is Platonism for the people' (Beyond Good and Evil Preface)"
    introduced_in: real-world-became-a-fable
  - id: being-and-becoming
    name: Being and becoming
    definition: "The contrast between what permanently is and what changes; Nietzsche holds that only becoming is real and 'being' an invention of reason that mummifies it"
    introduced_in: reason-in-philosophy
  - id: grammar-metaphysics
    name: Metaphysics of grammar
    definition: "The claim that subject-predicate grammar seduces us into believing in substances, egos and a God: 'I am afraid we are not rid of God because we still have faith in grammar' (Twilight, 'Reason' 5)"
    introduced_in: reason-in-philosophy
  - id: perspectivism
    name: Perspectivism
    definition: "The view that 'there is only a perspective seeing, only a perspective knowing' (Genealogy III 12), so there is no view from nowhere; objectivity is the ability to bring many perspectives to bear on one thing"
    introduced_in: perspectivism
  - id: will-to-truth
    name: Will to truth
    definition: "The unconditional demand for truth at any cost, which rests on the faith 'that God is the truth, that truth is divine' (Gay Science 344) and is the ascetic ideal's last form"
    introduced_in: will-to-truth
  - id: untruth-as-condition-of-life
    name: Untruth as a condition of life
    definition: "The claim that some false beliefs, such as enduring things and equal cases, are indispensable to creatures like us, so 'the falsity of a judgment is not yet an objection to a judgment' (Beyond Good and Evil 4)"
    introduced_in: value-of-untruth
  - id: honest-illusion
    name: Honest illusion
    definition: "Art as 'the good will to appearance', illusion that knows itself to be illusion and keeps truthfulness from becoming unbearable (Gay Science 107)"
    introduced_in: value-of-untruth
  - id: truth-as-metaphor
    name: Truth as metaphor
    definition: "The 1873 thesis that truths are worn-out metaphors whose origin has been forgotten, 'a mobile army of metaphors, metonymies, anthropomorphisms'"
    introduced_in: on-truth-and-lies
  # --- Module 7: The answer: affirmation ---
  - id: amor-fati
    name: Amor fati
    definition: "Love of fate: wanting nothing to be different, 'not forward, not backward, not in all eternity', and loving what is necessary rather than merely bearing or concealing it (Ecce Homo II 10)"
    introduced_in: amor-fati
  - id: affirmation-of-life
    name: Affirmation of life
    definition: "Saying yes to life as it is, including its suffering, without a world behind it to redeem it; 'looking away shall be my only negation' (Gay Science 276)"
    introduced_in: amor-fati
  - id: eternal-recurrence
    name: Eternal recurrence
    definition: "The thought that one's life will recur endlessly in every detail, posed as a conditional (Gay Science 341) and used as a test of whether one affirms it"
    introduced_in: eternal-recurrence
  - id: cosmological-recurrence
    name: Cosmological recurrence
    definition: "The notebook thesis that, given finite force and no final state, every state of the world literally repeats; never argued in a book, and mocked by Zarathustra as a 'hurdy-gurdy song'"
    introduced_in: recurrence-as-cosmology
  - id: becoming-who-one-is
    name: Becoming who one is
    definition: "Achieving unity among one's drives so that one's deeds and traits form a single character; the self as achievement, not given, and one 'must not have the faintest notion what one is' (Ecce Homo II 9)"
    introduced_in: becoming-who-you-are
  - id: giving-style
    name: Giving style to one's character
    definition: "Surveying one's strengths and weaknesses and fitting them into one artistic plan under a single taste, 'whether good or bad ... if only it was a single taste' (Gay Science 290)"
    introduced_in: becoming-who-you-are
  # --- Module 8: The higher human being and the order of rank ---
  - id: overman
    name: Overman
    definition: "Zarathustra's image of the goal of self-overcoming, 'the meaning of the earth', set against the last man; not a future biological species, 'scholarly oxen have suspected me of Darwinism'"
    introduced_in: overman-and-last-man
  - id: last-man
    name: Last man
    definition: "The human being who wants only comfort and sameness and has 'invented happiness'; the endpoint of herd morality, 'no shepherd and one herd'"
    introduced_in: overman-and-last-man
  - id: higher-type
    name: Higher type
    definition: "The kind of human being Nietzsche values: solitary, devoted to a unifying task, 'as manifold as whole' (Beyond Good and Evil 212), self-reverent, able to affirm life, as in Goethe or Caesar"
    introduced_in: higher-type
  - id: free-spirit
    name: Free spirit
    definition: "'A spirit that has become free' from the convictions of its time and treats its beliefs as experiments; not the free-thinking 'leveller' of Beyond Good and Evil 44"
    introduced_in: higher-type
  - id: great-health
    name: The great health
    definition: "A health 'that one does not merely have but also acquires continually, and must acquire because one gives it up again and again' (Gay Science 382): the capacity to assimilate and recover, not the absence of illness"
    introduced_in: higher-type
  - id: order-of-rank
    name: Order of rank
    definition: "The principle that human beings and their ways of life differ in worth, that a culture is measured by its highest specimens, and that 'the inequality of rights is the first condition for the existence of any rights' (Antichrist 57)"
    introduced_in: order-of-rank
  - id: aristocratic-society
    name: Aristocratic society
    definition: "The society Beyond Good and Evil 257-258 says every elevation of the type man has required: a long ladder of rank, 'slavery in some sense', and a ruling caste that accepts the sacrifice of the many as its scaffolding"
    introduced_in: order-of-rank
  - id: exploitation
    name: Exploitation as a function of life
    definition: "'Life itself is essentially appropriation, injury, overpowering of the strange and weaker ... and at the least exploitation' (Beyond Good and Evil 259): not a corrupt society's fault but 'a consequence of the will to power, which is just the will of life'"
    introduced_in: order-of-rank
  - id: value-creation
    name: Value creation
    definition: "Making values rather than finding them: valuing that knows it is not tracking value in itself and legislates for a way of life; 'their knowing is creating, their creating is law-giving' (Beyond Good and Evil 211)"
    introduced_in: creating-values
  - id: value-anti-realism
    name: Value anti-realism
    definition: "The view that nothing has value in itself, independent of valuers (Gay Science 301), which raises the question of what authority made values have"
    introduced_in: creating-values
  - id: reverence-for-oneself
    name: Reverence for oneself
    definition: "'The noble soul has reverence for itself' (Beyond Good and Evil 287): a basic certainty about one's own rank 'that can be neither sought nor found', a faith rather than an achievement, which fixes nobility"
    introduced_in: what-is-noble
  # --- Module 9: Taking stock ---
  - id: aristocratic-radicalism
    name: Aristocratic radicalism
    definition: "Brandes's label, which Nietzsche accepted, for his view that culture exists for its highest individuals; whether it implies a politics is disputed"
    introduced_in: nietzsche-and-politics
  - id: good-european
    name: Good European
    definition: "Nietzsche's self-description: against nationalism, against antisemitism, for a mixed European culture beyond the nation-state, 'European air and not nationalistic nitrogen'"
    introduced_in: nietzsche-and-politics

concepts:
  # --- Module 1: Reading Nietzsche as argument ---
  - id: death-of-god
    name: Death of God
    definition: "GS 108/125/343's claim that belief in the Christian God — the foundation European values rested on — has collapsed, so that the values must follow at a delay; a cultural diagnosis, not a theological thesis"
    introduced_in: madman-argument
  - id: nihilism
    name: Nihilism
    definition: "The condition in which the highest values devalue themselves and 'why?' receives no answer — the consequence the death of God sets in motion and the enemy Nietzsche's positive doctrine is built against"
    introduced_in: madman-argument
  - id: argument-reconstruction
    name: Argument reconstruction
    definition: "Restating a passage as numbered premises and a conclusion in plain words, each premise tied to a sentence of the text, so that validity, soundness and the unstated premise can be checked"
    introduced_in: madman-argument
  - id: corpus-chronology
    name: Corpus chronology
    definition: "The twelve books of 1872–1888 in order of composition, with the genre of each — sustained treatise, aphorism collection, or dramatization — as the first constraint on what a passage can be cited for"
    introduced_in: corpus-and-protocol
  - id: published-works-rule
    name: Published-works rule
    definition: "Clark's evidence rule: the books Nietzsche prepared for print are the primary evidence for his views; notebook material corroborates and never grounds a reconstruction"
    introduced_in: corpus-and-protocol
  - id: missing-premise
    name: Missing premise
    definition: "The premise a reconstructed argument needs for validity that the passage does not state — typically an is–ought step, a type-fact, or the free-will presupposition — to be named and then hunted in a second passage"
    introduced_in: corpus-and-protocol
  - id: methodological-naturalism
    name: Methodological naturalism
    definition: "Leiter's characterization of Nietzsche's method: explanations of moral phenomena continuous with the sciences in method (causal, empirical) and in results, not a claim that philosophy reduces to physics"
    introduced_in: corpus-and-protocol
  - id: doctrine-of-types
    name: Doctrine of Types
    definition: "Leiter's reconstruction: each person has a fixed psycho-physical constitution ('type-facts') which, with circumstances, causally explains their values and bounds without uniquely fixing what their life can become"
    introduced_in: corpus-and-protocol
  - id: nachlass
    name: Nachlass
    definition: "Nietzsche's unpublished notebooks, 1869–1888, printed in the critical edition in the order he wrote them, fragment by fragment, with sigla of the form NF-year,notebook[fragment]"
    introduced_in: will-to-power-the-book
  - id: will-to-power-compilation
    name: The Will to Power (compilation)
    definition: "The posthumous book of 1901/1906 assembled by Elisabeth Förster-Nietzsche and Peter Gast from notebook fragments on one of Nietzsche's discarded outlines — an editorial object, not a work Nietzsche wrote"
    introduced_in: will-to-power-the-book

  # --- Module 2: First Treatise ---
  - id: genealogy
    name: Genealogy
    definition: "A real history of how a value or practice came to be, undertaken to question the value of that value (GM Preface §§3–6) — distinct from a hypothesis-history and from a justification"
    introduced_in: genealogy-as-method
  - id: origin-vs-use
    name: Origin versus use
    definition: "GM II:12–13's rule: a thing's present purpose and its origin are 'toto caelo' distinct, because use is imposed by whatever will currently masters the thing"
    introduced_in: genealogy-as-method
  - id: genetic-fallacy
    name: Genetic fallacy
    definition: "The inference from a belief's ignoble or contingent origin to its falsity — invalid as stated; genealogy's critical force is to strip a value of its claim to be given, not to refute it"
    introduced_in: genealogy-as-method
  - id: mps
    name: Morality in the pejorative sense (MPS)
    definition: "Leiter's name for the target of Nietzsche's critique: a morality with a descriptive component (free will, transparent motives, human similarity) and a normative component (altruism, equality, pity), as against evaluation as such"
    introduced_in: genealogy-as-method
  - id: scope-problem
    name: Scope problem
    definition: "How to bound the target of Nietzsche's critique so that it does not indict his own positive values; Robertson's reframing: the target is morality's claim to authority and universal jurisdiction"
    introduced_in: genealogy-as-method
  - id: master-morality
    name: Master morality
    definition: "The mode of valuation in which the noble coins 'good' of himself first, out of a pathos of distance, and 'bad' (schlecht) as a contemptuous afterthought (GM I:2, 10; BGE 260)"
    introduced_in: master-and-slave-morality
  - id: slave-morality
    name: Slave morality
    definition: "The mode of valuation that begins with a No: 'evil' (böse) is coined first, of the noble, and 'good' derived by negation — reactive, other-directed, the morality Europe now has (GM I:10; BGE 260)"
    introduced_in: master-and-slave-morality
  - id: valuation-asymmetry
    name: Valuation asymmetry
    definition: "The minimal pair that carries the First Treatise's charge: 'good' first versus 'evil' first — self-affirmation with a derivative contempt against negation with a derivative self-praise"
    introduced_in: master-and-slave-morality
  - id: pathos-of-distance
    name: Pathos of distance
    definition: "The felt difference of rank between a ruling caste and its subjects (GM I:2; BGE 257), presented as the origin of noble valuation and the precondition for any enhancement of the type 'man'"
    introduced_in: master-and-slave-morality
  - id: ressentiment
    name: Ressentiment
    definition: "A valuation born of impotence that says No to something outside itself and takes that No for its creative deed (GM I:10); the psychological engine of the slave revolt"
    introduced_in: slave-revolt-and-ressentiment
  - id: slave-revolt
    name: Slave revolt in morality
    definition: "The historical inversion, begun by the priestly caste and universalized by Christianity, that relabeled the powerful 'evil' and the powerless 'good' (GM I:7–10, 16; BGE 195)"
    introduced_in: slave-revolt-and-ressentiment
  - id: priestly-caste
    name: Priestly caste
    definition: "The hinge type of GM I:6–7: noble by origin, impotent in action, inventive in hatred — the caste through which the revolt in valuation was carried out"
    introduced_in: slave-revolt-and-ressentiment
  - id: transvaluation
    name: Transvaluation of values
    definition: "The reversal of the noble value equation (good = noble = powerful) into its opposite (good = poor = suffering), and by extension Nietzsche's own planned reversal of the reversal"
    introduced_in: slave-revolt-and-ressentiment
  - id: doer-deed-fiction
    name: Doer behind the deed
    definition: "GM I:13's charge that 'there is no being behind doing': the neutral subject who could have acted otherwise is a fiction added to the deed by grammar, as lightning is separated from its flash"
    introduced_in: doer-behind-the-deed
  - id: free-will-presupposition
    name: Free-will presupposition
    definition: "The descriptive assumption MPS needs — that the strong could have chosen weakness — attacked in GM I:13, BGE 21 and Twilight's fourth 'great error'; the first presupposition the genealogy removes"
    introduced_in: doer-behind-the-deed
  - id: four-great-errors
    name: Four great errors
    definition: "Twilight's catalogue: consequence mistaken for cause, false inner causality (will, ego), imaginary causes retrofitted to sensations, and free will invented to ground punishment"
    introduced_in: doer-behind-the-deed
  - id: translation-comparison
    name: Translation comparison
    definition: "The check that runs a reconstructed argument through two or more renderings of its load-bearing German term and records whether the premise survives each"
    introduced_in: key-terms-in-translation
  - id: dramatization
    name: Dramatization (Zarathustra as staging)
    definition: "The course's reading rule for Zarathustra: a speech is mapped onto the theses argued in other books, and what it adds, drops, or undercuts is stated — never read as freestanding doctrine"
    introduced_in: tarantulas-staged

  # --- Module 3: Second Treatise ---
  - id: memory-of-the-will
    name: Memory of the will
    definition: "GM II:1's bred capacity to hold a promise against active forgetting — the 'right to make promises' burned in by the mnemotechnics of pain"
    introduced_in: promise-and-sovereign-individual
  - id: morality-of-custom
    name: Morality of custom (Sittlichkeit der Sitte)
    definition: "The prehistoric regime in which obedience to custom as such was morality (Daybreak §9; GM II:2) — the labour that made man calculable"
    introduced_in: promise-and-sovereign-individual
  - id: sovereign-individual
    name: Sovereign individual
    definition: "GM II:2's 'ripest fruit' of the morality of custom: the autonomous, supra-ethical individual whose standard becomes his conscience — read by Leiter as a natural artefact, by Anderson as an ideal of autonomy"
    introduced_in: promise-and-sovereign-individual
  - id: guilt-as-debt
    name: Guilt as debt (Schuld)
    definition: "GM II:4's claim that the moral concept of guilt descends from the material concept of debt, in the creditor–debtor relation, before any moral category existed"
    introduced_in: debt-and-guilt
  - id: punishment-as-compensation
    name: Punishment as compensation
    definition: "The original 'equivalence' of GM II:5–6: the creditor's right to inflict suffering as repayment for an unpaid debt — punishment before retribution, cruelty as festival"
    introduced_in: debt-and-guilt
  - id: debt-escalation
    name: Debt escalation
    definition: "The chain of substitutions in GM II:19–21: individual debt, the tribe's debt to its ancestors, the ancestor become god, the Christian God as maximal and self-immolating debt"
    introduced_in: debt-and-guilt
  - id: internalization
    name: Internalization
    definition: "GM II:16's mechanism: instincts that cannot discharge outward turn inward once society encloses the animal — the origin of the 'soul' and of bad conscience"
    introduced_in: internalization-and-bad-conscience
  - id: bad-conscience
    name: Bad conscience
    definition: "Cruelty turned against the self by an enclosed animal — 'an illness as pregnancy is an illness' (GM II:18) — active and form-giving before it is moralized into guilt"
    introduced_in: internalization-and-bad-conscience
  - id: state-by-conquest
    name: State by conquest
    definition: "GM II:17's anti-contract premise: the first state was a pack of conquerors imposing form on a formless population — the enclosure that made internalization necessary"
    introduced_in: internalization-and-bad-conscience
  - id: three-stage-guilt
    name: Three-stage reconstruction of guilt
    definition: "Leiter's compression of the Second Treatise: (1) conscience as bred memory, (2) bad conscience as internalized cruelty, (3) guilt as bad conscience moralized by the free-will presupposition"
    introduced_in: guilt-reconstructed
  - id: moralization
    name: Moralization
    definition: "The step from owing to being guilty: bad conscience grafted onto the doer-behind-the-deed so that suffering reads as deserved — the stage in which the Second Treatise depends on the First"
    introduced_in: guilt-reconstructed

  # --- Module 4: Third Treatise ---
  - id: ascetic-ideal
    name: Ascetic ideal
    definition: "The valuation of self-denial (poverty, chastity, humility) that GM III finds meaning something different in each type, and finally a strategy by which a declining life preserves itself"
    introduced_in: ascetic-ideal-across-types
  - id: disinterested-contemplation
    name: Disinterested contemplation
    definition: "Kant's 'disinterested delight' as Schopenhauer read it — beauty as will-lessness — attacked in GM III:6 with Stendhal's 'promise of happiness'; Heidegger's charge that the target was Schopenhauer's misreading"
    introduced_in: ascetic-ideal-across-types
  - id: ascetic-priest
    name: Ascetic priest
    definition: "GM III:11–22's physician of the sick: the type who directs the sufferer's search for a cause onto the sufferer, giving suffering a meaning at the price of guilt"
    introduced_in: ascetic-priest
  - id: redirection-of-ressentiment
    name: Redirection of ressentiment
    definition: "GM III:15's pivot — 'I suffer: someone must be to blame' answered by 'you yourself are to blame' — the mechanism that makes bad conscience moral and lets the slave revolt win"
    introduced_in: ascetic-priest
  - id: meaning-of-suffering
    name: Meaning of suffering
    definition: "GM III:28's closing thesis: man does not object to suffering but to senseless suffering; the ascetic ideal supplied a meaning, and 'man would rather will nothingness than not will at all'"
    introduced_in: ascetic-priest
  - id: perspectivism
    name: Perspectivism
    definition: "GM III:12's thesis that there is only a perspectival seeing and knowing, conditioned by affects — read (Clark) as anti-foundationalism, not as the claim that all beliefs falsify"
    introduced_in: perspectivism
  - id: objectivity-as-more-eyes
    name: Objectivity as more eyes
    definition: "GM III:12's replacement for the will-less subject: objectivity is the capacity to bring more perspectives and affects to bear on a matter, not the absence of any"
    introduced_in: perspectivism
  - id: falsification-thesis
    name: Falsification thesis
    definition: "The early (Truth and Lie, 1873) claim that all human truths are illusions because they fail to correspond to the thing-in-itself — the position Clark argues Nietzsche abandoned with the thing-in-itself"
    introduced_in: perspectivism
  - id: will-to-truth
    name: Will to truth
    definition: "The unconditional commitment to truth at any price that GS 344 shows to be a moral faith and GM III:24 declares in need of a critique"
    introduced_in: will-to-truth
  - id: science-as-ascetic-ideal
    name: Science as the ascetic ideal's latest form
    definition: "GM III:23–27's claim that science and modern atheism still rest on the faith that truth is divine, and that Christianity's own truthfulness is what destroyed Christian dogma"
    introduced_in: will-to-truth
  - id: redeemer-type
    name: Psychology of the redeemer
    definition: "Antichrist §§27–35's reconstruction of Jesus as a physiological type — an oversensitivity to contact yielding total non-resistance — and a practice, not a belief"
    introduced_in: antichrist-applied-genealogy
  - id: pauline-inversion
    name: Pauline inversion
    definition: "Antichrist §§39–47's claim that Paul converted the redeemer's practice into a doctrine of sacrifice, resurrection and judgment — the slave revolt and the priest's redirection run on one historical case"
    introduced_in: antichrist-applied-genealogy

  # --- Module 5: The psychology beneath ---
  - id: society-of-drives
    name: Soul as a society of drives
    definition: "BGE 12's reopened soul hypothesis: 'mortal soul', 'subject-multiplicity', 'a society constructed out of drives and affects' — persons are bodies, but bodies with a politics"
    introduced_in: soul-as-society-of-drives
  - id: will-as-command
    name: Will as command
    definition: "BGE 19's dissection of willing: a plurality of feelings, a commanding thought, and the affect of command — 'freedom of the will' as the commander's feeling toward under-wills that obey"
    introduced_in: soul-as-society-of-drives
  - id: epiphenomenalism
    name: Epiphenomenalism dispute
    definition: "Whether conscious values and reasons govern action in Nietzsche's psychology or merely accompany what drives cause — Leiter's original claim, retracted in 2015 after Katsafanas; Clark and Dudrick's 'normative order' of drives as the rival"
    introduced_in: soul-as-society-of-drives
  - id: will-to-power
    name: Will to power
    definition: "Nietzsche's principle that living things seek above all to discharge strength and grow in power (BGE 13, 259; A §2) — defensible as a psychological doctrine, question-begging as a cosmology (BGE 36)"
    introduced_in: will-to-power-as-psychology
  - id: cosmological-vs-psychological
    name: Cosmological versus psychological will to power
    definition: "The two readings: the world 'is will to power and nothing besides' (BGE 36, WP 1067) against a claim about human motivation and satisfaction — Clark's line between illegitimate metaphysics and Nietzsche's own standard"
    introduced_in: will-to-power-as-psychology
  - id: overcoming-resistance
    name: Overcoming resistance
    definition: "Reginster's analysis of will to power: a determinate first-order desire, resistance to its satisfaction, and success in overcoming it — a second-order and self-perpetuating desire"
    introduced_in: will-to-power-as-psychology
  - id: true-world-error
    name: The 'true world' error
    definition: "Twilight's six-stage history of the two-world picture from Plato to its abolition — with the apparent world abolished along with the true one, leaving no 'mere appearance' to call false"
    introduced_in: real-world-became-a-fable
  - id: thing-in-itself
    name: Thing-in-itself (rejected)
    definition: "Kant's world independent of all cognition, whose rejection by the later Nietzsche (Clark Ch.4) removes the ground the early falsification thesis needed"
    introduced_in: real-world-became-a-fable

  # --- Module 6: The positive doctrine ---
  - id: disorientation-vs-despair
    name: Disorientation versus despair
    definition: "Reginster's two nihilisms: values lack objective standing (disorientation) versus the highest values cannot be realized in this world (despair) — independent crises needing different answers"
    introduced_in: nihilism-and-affirmation
  - id: amor-fati
    name: Amor fati
    definition: "GS 276's formula for affirmation: to see the necessary in things as beautiful, to want nothing otherwise — 'someday to be only a Yes-sayer'"
    introduced_in: nihilism-and-affirmation
  - id: affirmation
    name: Affirmation of life
    definition: "Nietzsche's positive ideal: valuing this life, suffering included, as an end rather than a means — tested by eternal recurrence, opposed to the ascetic ideal's 'will to nothingness'"
    introduced_in: nihilism-and-affirmation
  - id: eternal-recurrence
    name: Eternal recurrence
    definition: "GS 341's demon: this life, exactly the same, innumerable times — a thought whose force in the published works is the test of affirmation, staged in Zarathustra as riddle, crisis and hymn"
    introduced_in: eternal-recurrence
  - id: practical-vs-cosmological
    name: Practical versus cosmological recurrence
    definition: "Whether the doctrine claims the universe repeats (Nachlass 'proof', Heidegger, Loeb) or poses a practical test whose force is independent of its truth (Nehamas, Clark, Reginster)"
    introduced_in: eternal-recurrence
  - id: higher-type
    name: Higher type
    definition: "The human being Nietzsche's normative critique protects: rare, self-affirming, strong in multiplicity of drives held in unity — a 'lucky accident' (A §4), not a breeding programme"
    introduced_in: higher-type-and-sublimation
  - id: sublimation
    name: Sublimation (spiritualization of the passions)
    definition: "Twilight's 'Morality as Anti-Nature': mastering a passion by transforming it rather than extirpating it — Kaufmann's key to Nietzsche's positive psychology"
    introduced_in: higher-type-and-sublimation
  - id: giving-style
    name: Giving style to one's character
    definition: "GS 290's ideal: surveying one's strengths and weaknesses and fitting them into an artistic plan until each appears as art — the individual-scale form of the higher type"
    introduced_in: higher-type-and-sublimation
  - id: value-creation
    name: Value creation
    definition: "GS 301's claim that 'we are the ones who create what has value' — read as anti-realism, fictionalism, or constructivism depending on what one takes 'create' to mean"
    introduced_in: value-creation-and-normativity
  - id: normative-vs-evaluative
    name: Normative versus evaluative concepts
    definition: "Railton's distinction: deontic concepts (rule, obligation, right) that Nietzsche's naturalism undermines, against evaluative concepts (good, noble, base) it can keep"
    introduced_in: value-creation-and-normativity
  - id: overman
    name: Overman (Übermensch)
    definition: "Zarathustra's 'meaning of the earth', humanity as a rope over an abyss — the dramatized form of the higher type, almost absent from the argued works"
    introduced_in: overman-staged
  - id: last-human
    name: Last human being
    definition: "Prologue §5's photographic negative of the overman: comfort-seeking, risk-averse, leveled — 'we invented happiness', blinking"
    introduced_in: overman-staged

  # --- Module 7: Where the reading breaks ---
  - id: aestheticism
    name: Aestheticism (Nehamas)
    definition: "The reading on which Nietzsche models the world on a text, persons on characters and knowledge on interpretation, and defends his philosophy as a coherent self-creation rather than as true"
    introduced_in: life-as-literature
  - id: self-refutation-problem
    name: Self-refutation problem
    definition: "The charge that perspectivism, stated as a truth about all views, refutes itself — and the test each reading of Nietzsche must pass by saying what status its own claims have"
    introduced_in: life-as-literature
  - id: guiding-vs-grounding-question
    name: Guiding versus grounding question
    definition: "Heidegger's apparatus: metaphysics' guiding question 'what is a being?' against the grounding question 'what is Being?' — Nietzsche read as the last answer to the first"
    introduced_in: heidegger-one-thought
  - id: will-to-will
    name: Will to will
    definition: "Heidegger's formula for will to power as the consummation of the metaphysics of subjectivity: 'permanentizing Becoming into presence', one thought with eternal recurrence"
    introduced_in: heidegger-one-thought
  - id: biologism-objection
    name: Biologism objection
    definition: "Heidegger's argument (Nietzsche III, Part One §6) that Nietzsche's biological vocabulary cannot be biology because no science grounds the concept of its own field — a category-error charge against naturalist readings"
    introduced_in: alleged-biologism
  - id: field-concept
    name: Field-concept
    definition: "The concept a science presupposes to have a subject matter at all ('life' for biology, 'nature' for physics) — on Heidegger's argument, always metaphysical, never a result of the science"
    introduced_in: alleged-biologism

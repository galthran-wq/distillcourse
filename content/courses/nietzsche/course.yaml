          - "BGE 22 (physics as interpretation), GS 354 (consciousness as surface), GS 374 ('we cannot see around our corner') as the other statements"
          - "Clark's reading: perspectivism as anti-foundationalism (no view from nowhere), not the thesis that all beliefs are false — and the early 'Truth and Lie' essay as the position Nietzsche abandoned"
          - "The relativist misreading refuted from III:12's own ranking of perspectives; the self-refutation worry stated and deferred"
          - "'On Immaculate Perception' (Z II) as the dramatization of the critique of disinterested contemplation"
        demo: null

      - slug: will-to-truth
        title: "Science as the Ascetic Ideal's Latest Form: The Will to Truth"
        type: core
        status: drafted
        key_image: figures/self-overcoming.svg
        goal: "Formulate GM III:23–27 with GS 344 and BGE 1–4 as the argument that science and modern atheism still rest on an unconditional faith in truth, and state what the argument does to the Genealogy's own method"
        opening: "The Third Treatise's last move is turned on its readers: science is not the ascetic ideal's opponent but its most spiritualized form, because the will to truth at any price is itself a faith — and the Genealogy is written by that will."

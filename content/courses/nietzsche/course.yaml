          - "The six stages reconstructed as a ladder with Nietzsche's own glosses (Kant's 'Königsbergian' postulate, positivism's grey morning, Plato's blush)"
          - "Stage six is not an inversion: abolishing the apparent world with the true — Clark's turning point (Ch.4) and the rejection of the thing-in-itself"
          - "Consequence for the falsification thesis: without a thing-in-itself there is nothing for our beliefs to fail to correspond to"
          - "Heidegger's rival gloss previewed: 'twisting free' of Platonism rather than escaping it (Vol. I §24)"

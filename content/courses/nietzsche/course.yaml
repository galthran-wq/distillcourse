  - slug: psychology-beneath-genealogy
    title: "The Psychology beneath the Genealogy"
    outcomes: [co-reconstruct, co-missing-premise, co-naturalism, co-misreadings, co-zarathustra]
    lessons:
      - slug: soul-as-society-of-drives
        title: "The Soul as a Society of Drives"
        type: core
        status: drafted
        key_image: figures/government-or-physics.svg
        goal: "Formulate Beyond Good and Evil 12, 16–19 and 23 as Nietzsche's positive psychology — the soul as a society of drives, willing as command — and evaluate the epiphenomenalism dispute between Leiter and Clark & Dudrick on that text"
        opening: "Beyond Good and Evil does not abolish the soul; it reopens the hypothesis as 'mortal soul', 'subject-multiplicity', 'a society constructed out of drives and affects' — and the question the naturalist reading must answer is whether the society has a government or only a physics."
        est_minutes: 38
        prerequisites: [doer-behind-the-deed, guilt-reconstructed]
        concepts:
          introduces: [society-of-drives, will-as-command, epiphenomenalism]
          reinforces: [doer-deed-fiction, doctrine-of-types, methodological-naturalism, internalization]
        key_ideas:
          - "BGE 12: soul-atomism rejected, the soul hypothesis reopened; Z 'On the Despisers of the Body': 'body am I entirely'"
          - "BGE 19: willing dissected — a plurality of feelings, a commanding thought, the affect of command; 'L'effet c'est moi'"
          - "BGE 23: psychology as morphology of the will to power, 'queen of the sciences'"
          - "The Doctrine of Types in full: type-facts bound a life (the tomato plant), Knobe & Leiter's heritability and attitude–behaviour evidence for it — and Leiter's retracted claim that consciousness is epiphenomenal"
          - "Clark & Dudrick: the drive rank-order as a normative order (a 'space of reasons') — and Riccardi's primate-hierarchy rebuttal; what the text of BGE 19 settles"
        demo: null


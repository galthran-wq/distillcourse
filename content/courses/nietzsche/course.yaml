  - slug: affirmation
    title: "The Positive Doctrine: Nihilism, Recurrence, and the Higher Type"
    outcomes: [co-reconstruct, co-missing-premise, co-naturalism, co-zarathustra, co-misreadings]
    lessons:
      - slug: nihilism-and-affirmation
        title: "Nihilism: Disorientation, Despair, and Amor Fati"
        type: core
        status: drafted
        key_image: figures/two-branches.svg
        goal: "Distinguish the two problems Nietzsche's word 'nihilism' names — disorientation (values lack standing) and despair (values cannot be realized) — and state which of Nietzsche's answers addresses which"
        opening: "Nihilism, in Nietzsche, is two problems that need two different answers: the disorientation that follows when values lose their foundation, and the despair that follows when the highest values turn out to be unrealizable in this world — and only the second is what the ascetic ideal was protecting against."
        est_minutes: 34
        prerequisites: [will-to-truth, self-overcoming-staged]
        concepts:
          introduces: [disorientation-vs-despair, amor-fati, affirmation]
          reinforces: [nihilism, death-of-god, meaning-of-suffering, ascetic-ideal, will-to-power]
        key_ideas:
          - "Reginster's split (Ch.1): disorientation and despair as logically independent crises, and why the first must be resolved before the second registers"
          - "GM III:28 and 'the Soothsayer' (Z II): 'everything is empty, everything is the same' as despair, not disorientation"
          - "GS 276 (amor fati) and GS Book IV: affirmation as the answer, defined without the word 'yes'"
          - "The revaluation of suffering: if satisfaction requires resistance, suffering is an ingredient of achievement, not its cost (Reginster Ch.4; 'the lack of suffering implies the lack of true happiness')"
          - "The nihilist misreading refuted: Nietzsche diagnoses nihilism and names it the enemy (GM III:14, 28)"
        demo: null

      - slug: eternal-recurrence
        title: "Eternal Recurrence as a Test"
        type: core
        status: planned
        goal: "Formulate the eternal recurrence from GS 341 and its three stagings in Zarathustra, and evaluate the cosmological, practical and literary readings by what each needs the text to say"
        opening: "The demon of The Gay Science §341 does not say the universe repeats; he asks whether you could bear it if it did, and the doctrine's force in the published works is the question, not the cosmology."
        est_minutes: 40
        prerequisites: [nihilism-and-affirmation, will-to-power-as-psychology]
        concepts:
          introduces: [eternal-recurrence, practical-vs-cosmological]
          reinforces: [affirmation, amor-fati, nachlass, published-works-rule, dramatization]
        key_ideas:
          - "GS 341 line by line: the three constraints — recurrence, sameness, eternity — and what each blocks (SEP §6.3; Kundera's Immortality as the failure mode)"
          - "The three stagings: 'On the Vision and the Riddle' (the gateway Moment, the dwarf's 'time is a circle' rejected), 'The Convalescent' (the small human recurs; the animals' 'hurdy-gurdy song'), 'The Seven Seals'"
          - "The cosmological reading and its evidence: NF-1881,11 (Sils-Maria, August 1881), the finite-force 'proof' and Simmel's three-wheel counterexample — and why the published works withhold it"
          - "Clark's marriage analogy and Reginster's split — wishing a moment's eternity against wishing its recurrence: the test, and Zarathustra failing it in 'On Redemption' (revenge against 'it was')"
          - "What the naturalist reading needs: willing the recurrence as drive-integration (Janaway) — and what it cannot use (the cosmology)"
        demo: null

      - slug: higher-type-and-sublimation
        title: "The Higher Type: Pathos of Distance and Sublimation"
        type: core
        status: planned
        goal: "Formulate Nietzsche's positive ideal from BGE 257–262, Twilight's 'Morality as Anti-Nature' and GS 290 — the higher type, spiritualization of the passions, giving style to one's character — and state the normative component of the critique of morality it grounds"
        opening: "Nietzsche's charge that morality harms the highest human beings needs an account of what a highest human being is, and the published works supply one in three pieces: an aristocratic society's pathos of distance, passions spiritualized rather than extirpated, and a character given style."
        est_minutes: 38
        prerequisites: [eternal-recurrence, ascetic-priest]
        concepts:
          introduces: [higher-type, sublimation, giving-style]
          reinforces: [pathos-of-distance, mps, will-to-power, overcoming-resistance, doctrine-of-types]
        key_ideas:
          - "BGE 257–259: pathos of distance, the sipo matador, life as appropriation — the aristocratic premise and how much of it the ideal actually needs"
          - "Twilight, 'Morality as Anti-Nature' §§1–6: spiritualization versus castration of the passions; 'the value of life cannot be estimated'"
          - "GS 290: giving style to one's character; BGE 212, A §§3–4 on the higher type as a 'lucky accident'"
          - "Leiter's normative component: MPS harms higher types — and Reginster's NDPR objection (one ideal unevenly realized, not many flourishings)"
          - "Kaufmann's sublimation, Hurka's maximax perfectionism and Janaway's greatness (strength, multiplicity, unity in conflict of drives) as the analytic reconstructions — and what each still owes to the aristocratic premise"
        demo: null

      - slug: value-creation-and-normativity
        title: "Value Creation and the Naturalist's Normativity Problem"
        type: core
        status: planned
        goal: "Analyze the claim that values are created rather than discovered (GS 301, Z 'On a Thousand and One Goals') and evaluate the anti-realist, fictionalist and constructivist readings by what each lets a naturalist say is good"
        opening: "A naturalist who has explained where 'good' came from owes an account of how he can still call anything good, and Nietzsche's answer — that values are created, not found — is a sentence every camp of his readers accepts and reads differently."
        est_minutes: 38
        prerequisites: [higher-type-and-sublimation, genealogy-as-method]
        concepts:
          introduces: [value-creation, normative-vs-evaluative]
          reinforces: [scope-problem, mps, methodological-naturalism, higher-type, perspectivism]
        key_ideas:
          - "GS 301: 'we are the ones who create what has value'; BGE 211: philosophers as commanders and legislators; BGE 186 against 'grounding' morality"
          - "Three readings (SEP §3.1): anti-realism/skepticism (Leiter), fictionalism (Hussain's 'honest illusion'), constructivism/subjective realism (Thomas, Reginster) — each reconstructed with what it must say about GS 301, and Blackburn's Skimpole test against 'play'"
          - "Railton's split: naturalism can undermine deontic normativity (obligation) while keeping evaluative concepts (noble, base)"
          - "Robertson's scope problem: the target is morality's claim to authority and universal jurisdiction, not evaluation as such — Leiter's own scope solution revised"
          - "The verdict deferred: what each reading needs from the drive psychology of BGE 12–19, and which of them the sovereign-individual dispute already decided"
        demo: null

      - slug: overman-staged
        title: "The Overman and the Last Human Being, Dramatized"
        type: core
        status: planned
        goal: "Interpret Zarathustra's Prologue §§3–5, 'On the Three Metamorphoses' and 'On the Higher Man' against the higher-type thesis of the argued works and state what the overman adds that no argument in them supplies"
        opening: "The overman is the most quoted of Nietzsche's ideas and the one with the thinnest presence in the argued books: it appears as a doctrine only in Zarathustra, and reading the Prologue against Beyond Good and Evil 257–262 and The Antichrist §§3–4 shows what the figure adds and what it was staged to replace."
        est_minutes: 34
        prerequisites: [value-creation-and-normativity]
        concepts:
          introduces: [overman, last-human]
          reinforces: [dramatization, higher-type, affirmation, eternal-recurrence, giving-style]
        key_ideas:
          - "Prologue §§3–5: 'the meaning of the earth', the rope over the abyss, the last human being who 'invented happiness'"
          - "'On the Three Metamorphoses': camel, lion, child — the sequence mapped to Twilight's spiritualization and GS 290's style, and the step no argument reaches (the child's 'sacred Yes')"
          - "'On the Higher Man' (Z IV): 'how shall man be overcome' against 'how are human beings to be preserved' — BGE 62 and A §§3–4 applied"
          - "The proto-fascist misreading refuted from the text: the overman as breeding-programme against Z I 'On the New Idol', BGE 251, A §4's 'lucky accident'"
          - "Application: the departure — Zarathustra bids his disciples lose him ('On the Bestowing Virtue'), the one instruction the argued works never give"
        demo: null
        notes: "Module application (L16). The Sign (Z IV) and pity as last sin can be a starred section."

  - slug: where-the-reading-breaks
    title: "Where the Naturalist Reading Breaks: Nehamas and Heidegger"
    outcomes: [co-rivals, co-naturalism, co-misreadings, co-reconstruct]
    lessons:
      - slug: life-as-literature
        title: "Nehamas: Perspectivism, Style, and the Self as Literary Character"
        type: core
        status: planned
        goal: "Formulate Nehamas's aestheticist reading — the world as text, the self as character, eternal recurrence as a work's integrity, 'an opinion is only as good as its author' — and evaluate its answer to perspectivism's self-refutation against Clark's"
        opening: "Nehamas reads Nietzsche's scattered doctrines as one project modelled on literature: the world is read like a text, a person is made like a character, and Nietzsche's own philosophy is defended not as true but as the coherent self-creation of one kind of person — which is an answer to the self-refutation charge the naturalist cannot give and a cost the naturalist need not pay."
        est_minutes: 38
        prerequisites: [perspectivism, eternal-recurrence, overman-staged]
        concepts:
          introduces: [aestheticism, self-refutation-problem]
          reinforces: [perspectivism, eternal-recurrence, giving-style, affirmation, methodological-naturalism]
        key_ideas:
          - "The self-refutation problem stated precisely: a claim that all views are perspectival is itself a view — what the naturalist reading claims to be true"
          - "Nehamas's answer: 'an opinion is only as good as its author' — views individuated by character; Nietzsche as Plato to his own Socrates"
          - "'This Life — Your Eternal Life': recurrence as the demand a well-made work makes (nothing subtractable) — against the cosmological and the practical readings"
          - "'How One Becomes What One Is': the unified self as achievement (GS 290, EH) — where this overlaps the higher type and where it leaves the drives"
          - "Clark's counter (1990 Ch.5; 2018 retrospective): anti-foundationalism does not need aestheticism, and aestheticism does not secure the claim against self-refutation either"
        demo: null

      - slug: heidegger-one-thought
        title: "Heidegger: Will to Power and Eternal Recurrence as One Metaphysical Thought"
        type: core
        status: planned
        goal: "Formulate Heidegger's reading — will to power as what beings are, eternal recurrence as how they are, one thought named five ways, Nietzsche as the last metaphysician — and evaluate its dependence on the Nachlass against the published-works rule"
        opening: "Heidegger's four volumes argue that will to power and eternal recurrence are not two doctrines but one answer to metaphysics' oldest question, and that Nietzsche, in giving it, completed the tradition he meant to overturn — an argument built, by Heidegger's own citation practice, on the compiled book the critical edition dissolved."
        est_minutes: 40
        prerequisites: [will-to-power-the-book, will-to-power-as-psychology, eternal-recurrence, real-world-became-a-fable]
        concepts:
          introduces: [guiding-vs-grounding-question, will-to-will]
          reinforces: [will-to-power, eternal-recurrence, cosmological-vs-psychological, true-world-error, nachlass, will-to-power-compilation]
        key_ideas:
          - "The apparatus: guiding question ('what is a being?') versus grounding question ('what is Being?'), and where Nietzsche is placed (Vol. I §11, Vol. II §25)"
          - "The unity thesis: will to power as essentia, eternal recurrence as existentia; WP 617 'to stamp Becoming with the character of Being' (Vol. I §4, Vol. III Part Two, Vol. IV §1)"
          - "The fable reread: stage six as 'twisting free' of Platonism, not inversion (Vol. I §24) — against real-world-became-a-fable's Clarkian reading"
          - "The gateway Moment and the 'smallest gap' (Vol. II §§6, 24): the dwarf's circle versus the decision — Heidegger's own rejection of the cosmological cliché"
          - "The evidence base: Vol. I §2's citation convention (WM numbers, the 1906 compilation), Krell's audit — what survives if only published passages count"
        demo: null

      - slug: alleged-biologism
        title: "The Alleged-Biologism Objection to Naturalism"
        type: core
        status: planned
        goal: "Formulate Heidegger's argument (Nietzsche Vol. III, Part One §6) that Nietzsche's biological vocabulary is not biology because no science can ground the concept of its own field, and evaluate what it would prove against methodological naturalism if sound"
        opening: "Heidegger's sharpest argument against reading Nietzsche as a naturalist is not exegetical: it is that 'life is will to power' cannot be an empirical thesis, because biology presupposes rather than establishes what life is — and if that is right, Leiter's methodological naturalism describes a project that cannot exist."
        est_minutes: 36
        prerequisites: [heidegger-one-thought, corpus-and-protocol]
        concepts:
          introduces: [biologism-objection, field-concept]
          reinforces: [methodological-naturalism, doctrine-of-types, will-to-power, guiding-vs-grounding-question]
        key_ideas:
          - "Vol. III §6 reconstructed: the field-concept premise, the 'we must learn to read' imperative, and the blackboard example (§12) for schematization"
          - "Vol. IV §22: the end of metaphysics — Hegel's rationalitas and Nietzsche's animalitas as one possibility-space; the 'blond beast' as password"
          - "Leiter's methodological naturalism restated at its strongest: continuity with the sciences' methods and results, not a claim that biology defines life"
          - "Schacht's non-scientistic naturalism and Leiter's reply (NDPR): the same objection inside the analytic camp; Kaufmann's finding that Nietzsche's actual biology is Lamarckian — empirical, and false — as the naturalist's answer"
          - "The verdict on this argument alone: what it proves (no empirical proof of the cosmological doctrine), what it does not (that the psychological doctrine is unscientific)"
        demo: null

      - slug: naturalist-reading-verdict
        title: "The Naturalist Reading Audited"
        type: synthesis
        status: planned
        goal: "Judge thesis by thesis which of Nietzsche's central claims the naturalist reading states as sound arguments, which it must deflate, and where Nehamas's and Heidegger's readings hold text the naturalist cannot — using Janaway and Robertson's five questions and Leiter's own retraction as the audit"
        opening: "The working hypothesis was that a psychology of types turns Nietzsche's polemic into arguments; the audit runs each of the course's reconstructed theses through the three readings and records, for each, the sentence of Nietzsche's that the reading cannot accommodate."
        est_minutes: 38
        prerequisites: [alleged-biologism, life-as-literature, value-creation-and-normativity]
        concepts:
          introduces: []
          reinforces: [methodological-naturalism, doctrine-of-types, aestheticism, guiding-vs-grounding-question, sovereign-individual, value-creation, will-to-power, eternal-recurrence, perspectivism, genealogy]
        key_ideas:
          - "The scorecard: ten theses × three readings, each cell a section citation and a verdict — fits, deflates, cannot accommodate"
          - "Where the naturalist wins: GM I–III as mechanism plus evidence; the doer fiction; the ascetic priest; the fable"
          - "Where it strains: the sovereign individual, value creation, the drive rank-order — and Leiter's 2015 retraction on epiphenomenalism as the reading correcting itself"
          - "Where the rivals hold text: Nehamas on the self-refutation charge and GS 290; Heidegger on the unity of the two thoughts — and what each pays (truth; the published-works rule)"
          - "Janaway and Robertson's five questions as the open ledger: scope, positive ideal, metaethics, moral psychology, naturalism — and the course's answer to each, stated as fact"
        demo: null
        notes: "Module application (L16): the published result checked is the Janaway–Robertson volume's framing (on disk, page-cited) plus Leiter's Postscript retraction (toc-only — verify wording). The scorecard cells cite Nietzsche's sections (verifiable on disk)."

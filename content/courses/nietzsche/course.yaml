schema_version: 1
slug: nietzsche
title: Nietzsche's Arguments
tagline: "The Genealogy of Morality reconstructed as argument — premises, missing premises, and the naturalist reading tested against the texts, with the readings that break it"
status: planned
audience: >
  Engineers with basic philosophy — premise and conclusion, Plato's two
  worlds, Kant's categorical imperative and synthetic a priori, Hume on
  causation — and no prior Nietzsche. Reads for arguments, wants them
  explicit in words, and distrusts both formal notation and essayistic
  vibes. Comfortable reading a numbered section of 19th-century prose in
  translation and checking a German term.
tone: >
  Dry, precise, analytic register. Every Nietzschean claim is stated as a
  reconstructed argument — numbered premises and a conclusion in plain
  words, never symbols — with its textual location (book, section) and the
  premise it does not state. Nietzsche's hyperbole is quoted, not imitated.
  No rhetorical questions, no teasers, no biography beyond what dates a
  text. The naturalist reading is the working hypothesis, named as such
  and tested, not assumed; rival readings are stated at their strongest.
  Passages with a history of political weaponization are read as text,
  with the misreading refuted from the text. Second person only in
  instructions.
intro: >
  Nietzsche says that European morality — altruism, equality, compassion,
  guilt — is a historical product of specific human types, that its
  authority rests on presuppositions that are false (a free will, a
  transparent self, a single human nature), and that it harms the highest
  human beings. He never states this as an argument. The books are
  numbered sections of polemic, aphorism and parable, and the sentence
  that would carry a premise is usually a joke, an etymology or a threat.
  The course asks one question: stated as arguments — premises and
  conclusions in words — do Nietzsche's claims hold, and which way of
  reading him makes them hold best?


  The answer has a shape. The three treatises of On the Genealogy of
  Morality are one argument in three installments: a history of how
  "good" and "evil" were coined, of how debt became guilt, and of what the
  ascetic ideal does for a life that suffers — and the third installment
  turns the argument on the reader's own will to truth. Read the way Brian
  Leiter reads it, as a naturalist's causal psychology of types, each
  installment becomes explicit: a mechanism, its evidence, and the premise
  it leaves unstated. That is the working hypothesis, and the course tests
  it section by section, with Beyond Good and Evil, Twilight of the Idols
  and The Antichrist supplying the arguments the Genealogy compresses, and
  Thus Spoke Zarathustra read as what it is — a dramatization of theses
  argued elsewhere, staged so that the drama itself warns against taking it
  for doctrine.


  The hypothesis holds for the critique and strains at the doctrine. The
  sovereign individual, the creation of values, and the two thoughts
  Nietzsche called his deepest — will to power and eternal recurrence — are
  where a psychology of types has to explain how anything can be called
  good, and where two rival readings offer to do the explaining instead:
  Nehamas by turning truth into character and a life into a text, Heidegger
  by turning the psychology back into metaphysics and calling naturalism a
  category error. The closing module states both at their strongest and
  audits the working hypothesis against them. The exercises throughout are
  the discipline's own: reconstruct the argument, find the premise the
  passage skips, break the plausible misreading, and check what a
  translator's choice of one word does to a proof.
prerequisites:
  - text: "Premise–conclusion structure of an argument; validity versus soundness; the difference between refuting a claim and explaining its origin"
  - text: "Plato's two-world picture, Descartes's cogito, Hume on causation and the self, Kant's categorical imperative and synthetic a priori — at the level of an introductory survey"
  - text: "Willingness to read numbered sections of primary text in translation and to look up a German word"
spine:
  - step: "The problem: 'God is dead' names the collapse of the foundation European values rested on, not a theological verdict — reconstructed from The Gay Science it is an argument with a conclusion about morality, and it sets the question the rest of Nietzsche's books answer"
    lessons: [madman-argument]
    label: "The problem"
    years: "1882–1887"
    caption: "The madman's speech reconstructed: a foundation gone, an edifice still standing"
  - step: "The method: a corpus of numbered sections, ordered in time, read published-works-first, by a stated reconstruction protocol — and the naturalist reading fixed as the hypothesis to test; the compiled book that is not Nietzsche's shows why the evidence rules matter"
    lessons: [corpus-and-protocol, will-to-power-the-book]
    label: "The method"
    years: "1872–1906"
    caption: "Twelve books, one protocol, and the posthumous 'book' that dated fragments dissolve"
  - step: "Genealogy as method: the value of moral values is questioned by a real history, origin and present use are 'toto caelo' distinct, and the critical force of that history is rhetorical, not deductive — the genetic-fallacy objection answered before the treatises begin"
    lessons: [genealogy-as-method]
    label: "Genealogy as method"
    years: "1887"
    caption: "Preface §§1–8 and II:12–13: what a history of a value can and cannot prove"
  - step: "First Treatise: two modes of valuation with an asymmetry — 'good' coined first by the noble, 'evil' first by ressentiment — the slave revolt as the inversion, and the doer-behind-the-deed fiction that morality's first presupposition needs; Zarathustra's tarantulas stage the diagnosis"
    lessons: [master-and-slave-morality, slave-revolt-and-ressentiment, doer-behind-the-deed, key-terms-in-translation, tarantulas-staged]
    label: "First Treatise"
    years: "1886–1887"
    caption: "Good/bad against good/evil; the lambs, the birds of prey, and the doer that was never there"
  - step: "Second Treatise: guilt is debt moralized — a promising animal bred by the morality of custom, the creditor–debtor relation, cruelty turned inward when society caged it, escalating to a debt to God — and the sovereign individual is the naturalist reading's first strain"
    lessons: [promise-and-sovereign-individual, debt-and-guilt, internalization-and-bad-conscience, guilt-reconstructed]
    label: "Second Treatise"
    years: "1887"
    caption: "Schuld is debt; bad conscience is the water animal forced onto land; guilt needs the free-will lie"
  - step: "Third Treatise: the ascetic ideal is what a declining life does with suffering — the priest redirects 'someone is to blame' onto the sufferer — and modern science is its latest form because it rests on an unconditional faith in truth; the critique reaches Nietzsche's own will to truth, and The Antichrist runs the machinery on Jesus and Paul"
    lessons: [ascetic-ideal-across-types, ascetic-priest, perspectivism, will-to-truth, antichrist-applied-genealogy]
    label: "Third Treatise"
    years: "1887–1888"
    caption: "'You yourself are to blame'; only a perspectival seeing; the will to truth needs a critique"
  - step: "The psychology beneath the genealogy: no soul-atom but a society of drives, willing as command among under-wills, will to power as the principle — defensible as psychology, question-begging as cosmology — and the two-world metaphysics that had to become a fable first; Zarathustra's 'Life' speaks the doctrine the argument cannot prove"
    lessons: [soul-as-society-of-drives, will-to-power-as-psychology, real-world-became-a-fable, self-overcoming-staged]
    label: "The psychology beneath"
    years: "1886–1888"
    caption: "BGE 12, 19, 36: the drive-self, the commanding affect, and the six-stage fable"
  - step: "The positive doctrine: nihilism splits into disorientation and despair, affirmation is tested by eternal recurrence, the higher type is defined by pathos of distance and sublimation — and value creation is where a naturalist must say how values can be made rather than found; the overman and the last human being are its dramatization"
    lessons: [nihilism-and-affirmation, eternal-recurrence, higher-type-and-sublimation, value-creation-and-normativity, overman-staged]
    label: "The positive doctrine"
    years: "1881–1888"
    caption: "The demon's question, amor fati, the higher type — and the normativity problem"
  - step: "Where the reading breaks: Nehamas turns truth into character and a life into a text; Heidegger turns the psychology into metaphysics and argues that no science can ground its own field-concept; the audit states which theses each reading can hold as arguments and where the naturalist hypothesis stands"
    lessons: [life-as-literature, heidegger-one-thought, alleged-biologism, naturalist-reading-verdict]
    label: "Where the reading breaks"
    years: "1936–2015"
    caption: "Life as literature, the last metaphysician, and the scorecard"
key_results:
  - text: "'God is dead' (GS 108, 125, 343) is a claim about the collapse of the foundation European morality rested on, not a theological thesis; its conclusion is that the moral edifice must follow, and the madman's 'I come too early' is the timing of that collapse"
    lesson: madman-argument
  - text: "The Will to Power (1901/1906) is not a book Nietzsche wrote: dated notebook fragments (NF-1885,2; NF-1888,14) show a working title with four incompatible outlines, compiled thematically by his sister and Peter Gast — the published works are the evidence of record"
    lesson: will-to-power-the-book
  - text: "A thing's present use and its origin are 'toto caelo' distinct (GM II:12–13): use is imposed by whatever will currently masters the thing, so a genealogy cannot refute a value by its origin — its critical force is to remove the value's claim to be natural or given"
    lesson: genealogy-as-method
  - text: "Master and slave valuation are asymmetric: the noble coins 'good' of himself first and 'bad' as an afterthought (GM I:2, 10); slave morality coins 'evil' of the other first and derives 'good' by negation — the reactive origin is the whole of the charge"
    lesson: master-and-slave-morality
  - text: "There is no 'being' behind doing: the doer is a fiction added to the deed (GM I:13), and 'un-free will' is as mythological as free will (BGE 21) — morality's first presupposition, that the strong could have chosen weakness, is false on its own terms"
    lesson: doer-behind-the-deed
  - text: "Guilt (Schuld) is debt: the creditor–debtor relation supplies the origin, internalized cruelty the mechanism (GM II:16), and the free-will presupposition the moralization — Leiter's three-stage reconstruction holds for II:4–22 and must deflate the sovereign individual of II:2 to survive"
    lesson: guilt-reconstructed
  - text: "Science and modern atheism are the ascetic ideal's latest form because both rest on an unconditional faith in the value of truth (GM III:24–27, GS 344); 'the will to truth requires a critique' turns the Genealogy on its own method"
    lesson: will-to-truth
  - text: "BGE 36's argument that the world is will to power 'and nothing besides' is question-begging as cosmology; the doctrine that survives is psychological — Reginster's three conditions: a first-order end, resistance to it, and its overcoming"
    lesson: will-to-power-as-psychology
  - text: "Eternal recurrence's force does not depend on its cosmological truth: GS 341's demon poses a test of whether a life is affirmable whole, staged in Zarathustra as riddle, crisis and hymn — and Zarathustra fails it wherever he values the present as a means"
    lesson: eternal-recurrence
  - text: "Heidegger's biologism objection: no science, biology included, grounds the concept of its own field, so 'life is will to power' cannot be an empirical thesis — the one argument that, if sound, makes methodological naturalism a category error"
    lesson: alleged-biologism
sources:
  - "F. Nietzsche, On the Genealogy of Morality, trans. M. Clark & A. J. Swensen, Hackett, 1998 (translation not yet on disk; H. Samuel's 1913 translation and the eKGWB German are the staged stand-ins)"
  - "F. Nietzsche, Beyond Good and Evil, trans. J. Norman, ed. R.-P. Horstmann, Cambridge Texts, 2002"
  - "F. Nietzsche, Thus Spoke Zarathustra, trans. A. Del Caro, ed. R. Pippin, Cambridge Texts, 2006"
  - "F. Nietzsche, Twilight of the Idols / The Anti-Christ, trans. R. J. Hollingdale, Penguin Classics"
  - "F. Nietzsche, Digital Critical Edition of the Works and Letters (eKGWB) and Digital Facsimile Edition (DFGA), ed. P. D'Iorio, nietzschesource.org"
  - "B. Leiter, Nietzsche on Morality, 2nd ed., Routledge, 2015"
  - "M. Clark, Nietzsche on Truth and Philosophy, Cambridge, 1990"
  - "M. Clark & D. Dudrick, The Soul of Nietzsche's Beyond Good and Evil, Cambridge, 2012"
  - "B. Reginster, The Affirmation of Life: Nietzsche on Overcoming Nihilism, Harvard, 2006"
  - "C. Janaway & S. Robertson (eds.), Nietzsche, Naturalism, and Normativity, Oxford, 2012"
  - "B. Leiter & N. Sinhababu (eds.), Nietzsche and Morality, Oxford, 2007"
  - "A. Nehamas, Nietzsche: Life as Literature, Harvard, 1985"
  - "M. Heidegger, Nietzsche, Vols. I–IV, trans. D. F. Krell et al., Harper & Row, 1979–1987"
  - "W. Kaufmann, Nietzsche: Philosopher, Psychologist, Antichrist, 4th ed., Princeton, 1974 (Princeton Classics reissue 2013)"
  - "R. L. Anderson, 'Friedrich Nietzsche', Stanford Encyclopedia of Philosophy"
  - "C. Kirwin, PHIL 414 Nietzsche (Northwestern, Spring 2025) and T. Beckman, Phil 370 Nietzsche (Claremont/Harvey Mudd, Spring 2003) — syllabi"
outcomes:
  - id: co-reconstruct
    text: "Reconstruct Nietzsche's central claims from the Genealogy, Beyond Good and Evil, Twilight of the Idols and The Antichrist as explicit premise–conclusion arguments in words, each premise located by book and section"
    bloom: analyze
  - id: co-missing-premise
    text: "Identify the premises an argument of Nietzsche's needs but does not state — the is–ought step, the type-fact, the free-will presupposition — and say which passage supplies each or that none does"
    bloom: analyze
  - id: co-naturalism
    text: "Evaluate the naturalist reading of each major thesis against the primary text: which sections it renders as mechanism-plus-evidence, which it must deflate, and what the deflation costs"
    bloom: evaluate
  - id: co-misreadings
    text: "Refute from the texts the prevalent misreadings — Nietzsche as relativist, as nihilist, as proto-fascist, as cosmological metaphysician of will to power — naming the sentence each misreading cannot accommodate"
    bloom: evaluate
  - id: co-zarathustra
    text: "Map a speech of Zarathustra onto the theses it dramatizes in the argued works and state what the dramatization adds, drops, or undercuts"
    bloom: apply
  - id: co-translation
    text: "Compare renderings of a load-bearing German term across translations and state how each choice moves the reconstructed argument"
    bloom: analyze
  - id: co-rivals
    text: "Compare the naturalist reading with Nehamas's aestheticist and Heidegger's metaphysical readings on will to power, eternal recurrence and perspectivism, and judge where each reading breaks on the text"
    bloom: evaluate

modules:
  - slug: reading-protocol
    title: "Reading Nietzsche as Argument"
    outcomes: [co-reconstruct, co-missing-premise, co-misreadings]
    lessons:
      - slug: madman-argument
        title: "The Death of God as an Argument"
        type: core
        status: drafted
        key_image: figures/argument-chain.svg
        goal: "Formulate the madman's speech in The Gay Science §125, with §§108 and 343, as an argument whose conclusion is about morality, not theology"
        opening: "The sentence 'God is dead' in The Gay Science §125 is not a claim about whether God exists; it reports that a belief which once founded European values has stopped being believed, and concludes that the values must follow."
        est_minutes: 28
        prerequisites: []
        concepts:
          introduces: [death-of-god, nihilism, argument-reconstruction]
          reinforces: []
        key_ideas:
          - "GS 125 read line by line: the lantern, the unbelieving marketplace, 'we have killed him', 'I come too early'"
          - "The argument in five premises: values rested on the Christian God; that belief has collapsed; a foundation's collapse takes the edifice with it — at a delay"
          - "GS 108 (the Buddha's shadow) and GS 343 (the 'long plenitude') as the two other statements that fix the claim's scope and tone"
          - "What the argument does not say: not an argument for atheism, not a celebration; the missing premise about why morality cannot be refounded"
          - "Kaufmann's cultural-diagnosis reading and Reginster's 'discredit, not refute' against the atheist-manifesto misreading"
        demo: null
        notes: "Easiest lesson in the course (C3): one famous passage, one reconstruction, one felt win. The German of GS 125 is in research/texts/digitalcriti-s1-FW.txt (line 1466); Kaufmann's Ch.3 (pp. 96–120) in research/texts/nietzschephi-excerpt-death-of-god-revaluation.txt and nietzschephi-s1.txt."

      - slug: corpus-and-protocol
        title: "The Corpus, the Aphorism, and the Reconstruction Protocol"
        type: core
        status: drafted
        key_image: figures/corpus-timeline.svg
        goal: "Apply a five-step reconstruction protocol to a numbered section of Nietzsche, using the corpus chronology and the published-works-first rule to decide what counts as evidence"
        opening: "Nietzsche's philosophy is twelve books of numbered sections written between 1872 and 1888, and an argument reconstructed from them is only as good as the rule that says which sections may be cited for which claim."
        est_minutes: 32
        prerequisites: [madman-argument]
        concepts:
          introduces: [corpus-chronology, published-works-rule, missing-premise, methodological-naturalism, doctrine-of-types]
          reinforces: [argument-reconstruction]
        key_ideas:
          - "The corpus in order: Birth of Tragedy 1872 to Ecce Homo 1888; which books argue in sequences (GM), which in aphorisms (BGE, GS), which dramatize (Z)"
          - "The aphorism as unit: GM III:1 as the worked case of a section that builds to a compressed formula"
          - "The protocol: locate the claim; list the stated premises; name the missing premise; check a second passage; state the strongest opposite reading and what the text says against it"
          - "Published works first: the Nachlass corroborates, never grounds (Clark's rule), and the siglum convention (GM I:13, BGE 36, NF-1881,11[141])"
          - "The working hypothesis stated: methodological naturalism plus the Doctrine of Types, and the three places it will be tested"
        demo: null

      - slug: will-to-power-the-book
        title: "The Will to Power as an Editorial Construction"
        type: core
        status: drafted
        key_image: figures/notebook-vs-compiled.svg
        goal: "Demonstrate from dated notebook fragments in the critical edition that The Will to Power is a compilation, and state what its use as a source does to an argument"
        opening: "The book titled The Will to Power, cited as Nietzsche's system by Heidegger and by the Nazi-era editors alike, was assembled after his collapse by his sister and Peter Gast from notebook fragments that the critical edition now prints in the order he wrote them."
        est_minutes: 34
        prerequisites: [corpus-and-protocol]
        concepts:
          introduces: [nachlass, will-to-power-compilation]
          reinforces: [published-works-rule, corpus-chronology]
        key_ideas:
          - "The artefact: nietzschesource.org's eKGWB — every fragment with a siglum, in notebook order, with the print edition's corrections inline"
          - "NF-1885,2 and NF-1888,14: 'Der Wille zur Macht' as a working title with four incompatible tables of contents, never a finished book"
          - "The 1901 (483 fragments) and 1906 (1,067 fragments) compilations: one of Nietzsche's discarded outlines used as the skeleton, fragments placed by theme"
          - "What the compilation did: Kaufmann's 'idiot' case (A §29), the suppressed Ecce Homo passage on mother and sister, the Fritsch letter of 1887 against the antisemitic appropriation"
          - "Application: the published-works rule run on WP 1067 ('this world is will to power — and nothing besides') — which published passage backs it, and how far"
        demo: null
        notes: "Module application (L16): the deployed system is the digital critical edition; the result reproduced is Kaufmann's and Montinari's demonstration that the book is an editorial object. Political misreading (Kaufmann Ch.10, Elisabeth's Archiv) goes in a starred section, refuted from the Fritsch letter and BGE 251."

  - slug: first-treatise
    title: "The First Treatise: Good and Evil, Good and Bad"
    outcomes: [co-reconstruct, co-missing-premise, co-naturalism, co-misreadings, co-zarathustra, co-translation]
    lessons:
      - slug: genealogy-as-method
        title: "Genealogy as Method: The Value of Values and Origin versus Use"
        type: core
        status: drafted
        key_image: figures/punishment-catalogue.svg
        goal: "Explain what a genealogy of a value can and cannot prove, from the Preface's demand for a real history and the Second Treatise's separation of origin from present use"
        opening: "The Genealogy's Preface asks for the value of moral values to be called into question by a real history of their origin, and its Second Treatise (§§12–13) states the rule that makes such a history possible: what a thing is now used for says nothing about where it came from."
        est_minutes: 36
        prerequisites: [corpus-and-protocol]
        concepts:
          introduces: [genealogy, origin-vs-use, genetic-fallacy, mps, scope-problem]
          reinforces: [argument-reconstruction, missing-premise, methodological-naturalism]
        key_ideas:
          - "Preface §§1–8: the targets (Rée, the English psychologists, Schopenhauer's pity), the demand for a history against hypothesis-history, 'rumination'"
          - "II:12–13: origin and use are 'toto caelo' distinct; a thing's use is imposed by the will that currently masters it; the catalogue of punishment's meanings"
          - "The genetic-fallacy objection and Leiter's answer: genealogy's force is to strip a value of its claim to be given, not to refute it"
          - "MPS — morality in the pejorative sense — with its descriptive component (free will, transparency, similarity) and its normative component (altruism, equality, pity)"
          - "The scope problem: what Nietzsche's critique must exempt for his own values to survive it (Robertson's reframing)"
        demo: null

      - slug: master-and-slave-morality
        title: "Master Morality and Slave Morality"
        type: core
        status: drafted
        key_image: figures/minimal-pair.svg
        goal: "Formulate the First Treatise's two modes of valuation, including the etymological argument, and state the asymmetry that carries the charge against slave morality"
        opening: "The First Treatise claims that the word 'good' was coined twice — once by nobles naming themselves, once by their subjects naming the nobles 'evil' and themselves 'good' by subtraction — and that the second coinage is the morality Europe now has."
        est_minutes: 36
        prerequisites: [genealogy-as-method]
        concepts:
          introduces: [master-morality, slave-morality, valuation-asymmetry, pathos-of-distance]
          reinforces: [genealogy, origin-vs-use, mps]
        key_ideas:
          - "I:1–3: the refutation of the utilitarian genealogy — usefulness forgotten is not the origin of 'good'"
          - "I:4–5: the etymological argument (bonus/malus, esthlos/kakos, schlecht/schlicht) reconstructed and graded as evidence"
          - "I:2 and I:10: 'good' first versus 'evil' first — the asymmetry as the whole of the charge (Leiter's minimal pair)"
          - "BGE 260: the typology stated in one aphorism, both types in one soul; BGE 257: pathos of distance as precondition"
          - "The relativist misreading refuted: Nietzsche ranks the two modes, and says by what standard"
        demo: null

      - slug: slave-revolt-and-ressentiment
        title: "Ressentiment and the Slave Revolt in Morality"
        type: core
        status: drafted
        key_image: figures/workshop-5.svg
        goal: "Analyze the slave revolt (GM I:7–16, BGE 195) as a causal story — priestly caste, ressentiment's creative No, the workshop of ideals — and identify what ressentiment alone cannot explain"
        opening: "Ressentiment is a valuation that begins with a No to something outside itself, and the First Treatise's central claim is that the morality of good and evil was created by that No, by the priestly caste, and then universalized by Christianity."
        est_minutes: 36
        prerequisites: [master-and-slave-morality]
        concepts:
          introduces: [ressentiment, slave-revolt, priestly-caste, transvaluation]
          reinforces: [master-morality, slave-morality, valuation-asymmetry, origin-vs-use]
        key_ideas:
          - "I:6–7: the priestly caste as the hinge between knightly and slave valuation; BGE 195 as the seed passage"
          - "I:10: ressentiment defined — reactive, other-directed, creative only as negation"
          - "I:14: the workshop where ideals are manufactured — weakness relabeled as merit, step by step"
          - "I:15–16: Tertullian's saved gloating over the damned; Rome against Judea as the recurring symbol; I:11's blond beast read as text, its weaponization refuted from I:11 and BGE 251"
          - "Why the First Treatise cannot stand alone: the strategic reading's reductio (Wallace) leaves ressentiment as expression, and expression explains the inversion, not its victory (Leiter) — the hand-off to the Second and Third"
        demo: null

      - slug: doer-behind-the-deed
        title: "The Doer behind the Deed: Free Will as Fiction"
        type: core
        status: drafted
        key_image: figures/lightning-flash.svg
        goal: "Formulate the argument of GM I:13, BGE 16–21 and Twilight's 'Four Great Errors' that the free agent behind an action is a grammatical fiction, and state which presupposition of morality it removes"
        opening: "The lambs in GM I:13 blame the birds of prey for being birds of prey, and Nietzsche's charge is that morality does the same thing at scale: it invents a neutral doer behind every deed so that strength can be blamed for not being weakness."
        est_minutes: 38
        prerequisites: [slave-revolt-and-ressentiment]
        concepts:
          introduces: [doer-deed-fiction, free-will-presupposition, four-great-errors]
          reinforces: [mps, ressentiment, missing-premise, doctrine-of-types]
        key_ideas:
          - "I:13: lightning and its flash — the substance-metaphysics premise that morality needs and language supplies"
          - "BGE 16–17: 'a thought comes when it wants' — the cogito's unproven bundle; BGE 19: willing as command among under-wills"
          - "BGE 21: causa sui as self-contradiction; 'un-free will' equally mythological — only strong and weak wills"
          - "Twilight, 'The Four Great Errors': consequence for cause (Cornaro), false causality, imaginary causes (the cannon-shot dream), free will invented for punishment"
          - "What the argument removes: MPS's first presupposition; what it does not remove: responsibility as a type-fact (the forward hook to the sovereign individual)"
        demo: null

      - slug: key-terms-in-translation
        title: "Load-Bearing Terms in Translation"
        type: extra
        status: drafted
        key_image: figures/ueber-prefix.svg
        goal: "Compare the renderings of schlecht/böse, Schuld, Mitleid, Wille zur Macht, Übermensch and Rausch across the course's translations and state how each choice moves a reconstructed argument"
        opening: "A translator's choice of one English word for schlecht decides whether the First Treatise's asymmetry survives on the page; this chapter runs that check on six terms the course's arguments depend on."
        est_minutes: 30
        prerequisites: [doer-behind-the-deed]
        concepts:
          introduces: [translation-comparison]
          reinforces: [valuation-asymmetry, slave-morality]
        key_ideas:
          - "schlecht / böse / gut: the two contrasts English 'bad' and 'evil' must keep apart (GM I:4, I:11)"
          - "Schuld: debt and guilt in one word (GM II:4) — what a translation loses when it picks one"
          - "Mitleid: 'pity' versus 'compassion' and the Schopenhauer dispute (GM Preface §5)"
          - "Übermensch: overman, superman, overhuman — Del Caro's and Kaufmann's cases"
          - "Rausch, Versucher/Versuch: coined compounds Del Caro footnotes rather than domesticates"
        demo: null
        notes: "Starred chapter; no core lesson depends on it. Verifiable texts on disk: German (eKGWB), Samuel 1913 (GM), Norman (BGE), Del Caro (Z, with the two footnote pages captured as images), Hollingdale (TI/A), Kaufmann's renderings as quoted in his book. Clark/Swensen quotations must be verified by the human before use."

      - slug: tarantulas-staged
        title: "Zarathustra's Tarantulas: Equality as Ressentiment, Dramatized"
        type: core

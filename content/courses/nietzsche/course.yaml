          - "II:17: the state as a pack of blond beasts of prey imposing form — the anti-contract premise and its evidence"
          - "II:18: bad conscience as active, form-giving, 'an illness as pregnancy is an illness' — the ambivalence the naturalist must keep"
          - "The mechanism drawn as a before/after: outward discharge (hunting, war) versus inward (self-cruelty, the soul)"

          - "The remainder: II:2's sovereign individual and II:18's 'pregnancy' — what deflation costs, what Anderson's autonomy reading buys and pays; Janaway's legitimation × internalization grid as the rival fit for the two origins of guilt"
          - "The Christian God as maximal debt (II:21) and the closing prophecy (II:24–25): the treatise's own forward hook to the Third"

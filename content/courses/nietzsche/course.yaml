          - "II:5–6: the equivalence of injury and pain; cruelty as compensation, then as festival ('punishment is a festival'; Don Quixote read with a bitter taste)"
          - "II:7–8: the person as measurer — buying, selling, exchange as the oldest thinking"
          - "II:19–22: the chain of substitutions — individual debt, the tribe's debt to ancestors, the god, the Christian God as maximal, self-immolating debt"
          - "Where the chain moralizes: the step from owing to being guilty needs the doer of I:13 — the missing premise named"

          - "III:24: 'the will to truth requires a critique' — the unconditional value of truth as the last idol"
          - "III:27: Christianity as dogma destroyed by its own morality of truthfulness — the death of God explained by the mechanism, closing the loop from GS 125"
          - "BGE 1–4: the value of truth as a problem; 'falseness of a judgment is not an objection'"

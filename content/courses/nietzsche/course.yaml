schema_version: 1
slug: nietzsche
title: Nietzsche
tagline: "If God is dead, what holds our values up? Nietzsche's whole thought, claim by claim, rebuilt as one connected argument and read from inside his position"
status: planned
audience: >
  A curious adult who reads philosophy for pleasure, not for a degree. Knows
  Plato's basic picture (a true world of Forms behind appearances, the soul
  above the body, reason ruling the passions) and the main Christian themes
  (sin and guilt, afterlife and judgment, love of neighbour, "the meek shall
  inherit the earth", redemption through suffering). Nothing beyond that:
  Schopenhauer, Kant and Darwin are introduced in a paragraph where a lesson
  needs them. Reads quotations in English; German appears only beside the
  English, where a word carries the argument.
tone: >
  Lively, clear and easy to follow, with no filler; every lesson starts from
  a problem a newcomer can feel. The course is a sympathetic exposition from
  inside Nietzsche's position: each lesson shows why the claim is compelling,
  what he saw that others missed, and where he was ahead of his time (the
  psychology of the drives, the genealogy of morals, the fate of a culture
  after faith). No moralizing, no condemnation, no apologizing for him, no
  framing him as a danger the reader needs protecting from, and no political
  lens of any colour. Charitable reconstruction: where a passage admits a
  strong and a weak reading, build the strong one. No softening: his hardest
  claims appear at full strength and in his own words, including the order of
  rank and the many existing for the few, slavery in Beyond Good and Evil
  257-258, contempt for equality, democracy, socialism and pity, cruelty as an
  ingredient of culture, and what he wrote about women and race; they are
  quoted, never skipped or paraphrased into mush, and "context" means what his
  words denoted and how they connect to his argument, never an excuse. If a
  hard conclusion follows from his premises, the lesson shows that it follows.
  The humanizing reading (breeding as self-cultivation, will to power as mere
  sublimation, anti-egalitarianism as merely cultural) is one interpretation
  to test against the text, not the default. Objections stay and are answered
  from his side: each lesson states the strongest objection a serious critic
  would make, then the best reply from Nietzsche's own texts first; where an
  argument has a gap, one plain sentence says so, without gloating.
  Objections are philosophical (does the argument hold), never moral
  distancing. Facts that cut against popular images (his contempt for
  antisemites and German nationalists, "nothing is true, everything is
  permitted" spoken by the Shadow, the sister's forgeries) are reported
  because the texts say so, not as a defence. Declarative sentences, no
  rhetorical questions, no teasers, no "some believe" strawmen; scholarly
  readings enter only where a claim genuinely forks, named by what they say,
  and scholars' names live in References. Zarathustra and the aphorisms are
  illustration inside lessons, never lessons of their own. Say each thing
  once.
intro: >
  For two thousand years Europeans answered the question "why is this good?"
  with a world behind this one: Plato's Forms, then the Christian God.
  Kindness mattered because God commanded it, suffering meant something
  because it would be redeemed, and truth was worth having because it was
  God's. Nietzsche's starting observation is that this answer has stopped
  working. Educated Europe no longer believes it, yet goes on living by the
  values it supported, the way light from a dead star keeps arriving. The
  course follows his attempt to say what happens next, and it follows him from
  inside his position: it shows why each claim is compelling, what he saw that
  nobody before him had seen, and how far ahead of his century he was.


  The answer comes in three movements. First, a diagnosis: once the world
  behind the world is gone, the highest values devalue themselves, and the
  name for that is nihilism. Second, a history: our values were not handed
  down, they were made, by human beings with drives, fears and grudges, and a
  psychology of those drives explains how "good and evil", guilt, pity, the
  ascetic ideal and even the unconditional will to truth came to be, and what
  they do to us now. Third, a reply: a life that can say yes to itself without
  a world behind it, tested by the thought of living it again, forever, and
  embodied in a type of human being who ranks, spends himself and creates
  values instead of receiving them.


  Every major claim gets its own lesson and is taken apart properly: what
  exactly Nietzsche claims and where, the argument for it in plain steps, the
  premise he leaves unstated, the strongest objection a serious critic would
  make and his best reply, and the places it connects to the rest. Nothing is
  softened. The order of rank, the slavery that Beyond Good and Evil says
  every high culture has needed, cruelty as an ingredient of culture, the
  contempt for equality and pity, and what he wrote about women and race are
  quoted at full strength and explained by what the words meant in his
  vocabulary, never excused and never used to warn the reader off him. Each
  module ends by reading one of his own texts whole with the module's results
  in hand: The Case of Wagner, The Four Great Errors, The Antichrist on Jesus
  and Paul, the opening of the Genealogy's third essay, the Skirmishes of
  Twilight of the Idols, the 1873 essay on truth, Ecce Homo, and "What Is
  Noble?". The last module tells how his sister and the Nazi regime distorted
  him, and then assembles the whole argument and ends on what the thought
  achieves.
prerequisites:
  - text: "Plato's picture: a true, unchanging world of Forms behind the changing world of the senses; the soul ranked above the body; reason meant to rule the passions"
  - text: "The main Christian themes: sin and guilt, afterlife and judgment, love of neighbour, 'the meek shall inherit the earth', redemption through suffering"
  - text: "Nothing else: no prior philosophy course, no German; Schopenhauer, Kant and Darwin are introduced where needed"
spine:
  - step: "Nietzsche wrote in numbered sections across three periods of a short, ill, solitary working life, and his sister later published his notebooks as a book he never wrote; reading him means telling the books from the notes and reading a section as an argument"
    label: "The man and the form"
    years: "1844–1900"
    caption: "A professor at 24, a wanderer at 34, silent at 44; fifteen books and a forged 'masterpiece'"
    lessons: [nietzsche-life-and-books]
  - step: "Schopenhauer taught that existence is suffering and the wise man stops wanting; the young Nietzsche accepted the suffering and refused the verdict, answering that Greek tragedy shows how art can justify existence, and his 1886 self-criticism names what in that answer he kept and what he dropped"
    label: "The first answer"
    years: "1818–1886"
    caption: "Silenus says it is best never to be born; Apollo and Dionysus make life bearable to watch; 'is there a pessimism of strength?'"
    lessons: [schopenhauer-and-the-birth-of-tragedy]
  - step: "'God is dead' is a claim about belief, not about God: the Christian God became unbelievable, the values that rested on him lost their foundation, and their own demand for truthfulness turns them into nihilism; Wagner's art is the first case Nietzsche diagnosed with this"
    label: "The problem"
    years: "1882–1888"
    caption: "The madman with a lantern at noon; the highest values devaluing themselves; Parsifal kneeling at the cross"
    lessons: [death-of-god, nihilism, case-of-wagner]
  - step: "Before asking where values came from, Nietzsche asks who values: not a unified soul that sees itself clearly, but a society of drives with a thin conscious surface made for talking to the herd, and grammar's invented doer whom morality holds responsible"
    label: "The drive-self"
    years: "1881–1888"
    caption: "'I did that,' says memory; 'I cannot have,' says pride; lightning does not flash, it is the flash"
    lessons: [self-as-society-of-drives, consciousness-and-language, doer-behind-the-deed]
  - step: "One principle runs through the drives: each wants to grow and overcome resistance, not merely to survive or to stop wanting; that will to power can be spiritualized rather than extirpated, and the Four Great Errors show the whole psychology turned on morality and religion"
    label: "Will to power"
    years: "1880–1888"
    caption: "Not survival, not pleasure: overcoming; the passions refined, not cut out; Cornaro's diet and the hangman's metaphysics"
    lessons: [will-to-power-as-psychology, sublimation, four-great-errors]
  - step: "Values have a history: the nobles called themselves good and the rest bad; the oppressed, unable to strike back, invented evil and called their weakness good, and Christianity is that revolt's victory, which The Antichrist traces from Jesus to Paul"
    label: "Good and evil"
    years: "1886–1888"
    caption: "Lambs and birds of prey; ressentiment that creates values; 'there was only one Christian, and he died on the cross'"
    lessons: [genealogy-as-method, master-morality, slave-revolt-and-ressentiment, jesus-and-paul]
  - step: "Guilt began as debt: a promising animal learned memory through pain, cruelty was the festival pleasure that higher culture refined rather than abolished, cruelty with no outlet turned inward as bad conscience, the debt to God made it unpayable, and the ascetic priest gave suffering a meaning by making the sufferer its cause"
    label: "Guilt and the priest"
    years: "1881–1887"
    caption: "Schuld means debt; 'without cruelty there is no festival'; the creditor who pays himself; 'someone must be to blame: you yourself'"
    lessons: [debt-and-punishment, cruelty-and-culture, bad-conscience, guilt-before-god, ascetic-priest, ascetic-ideals-in-artists-and-philosophers]
  - step: "What this morality does to us: pity multiplies suffering and spends the strong, the whole system rests on false beliefs about the self and harms the highest human beings, and it survives the death of God in the secular dress of equality, democracy, socialism and emancipation, which Twilight's Skirmishes diagnose as the modern form of decline"
    label: "What morality does to us"
    years: "1878–1888"
    caption: "Pity as 'the practice of nihilism'; 'the danger of dangers'; 'the democratic movement is the heir of the Christian movement'"
    lessons: [against-pity, danger-of-dangers, herd-morality-in-modern-dress, skirmishes-of-an-untimely-man]
  - step: "The true world goes the way of God: the history of Platonism ends with the true world a fable, and philosophy's 'reason' turns out to be hatred of becoming plus faith in grammar"
    label: "The true world dismantled"
    years: "1888"
    caption: "Six stages from 'I, Plato, am the truth' to noon, when the shadows are shortest"
    lessons: [real-world-became-a-fable, reason-in-philosophy]
  - step: "Without a view from nowhere there is only perspectival knowing, and the unconditional will to truth turns out to be the ascetic ideal's last form; untruth, art and illusion can serve life, and the young Nietzsche's essay on truth shows which part of this he got right first and which he later abolished"
    label: "Truth turned on itself"
    years: "1873–1887"
    caption: "More eyes, more objectivity; science as the last ascetic; a mobile army of metaphors"
    lessons: [perspectivism, will-to-truth, value-of-untruth, on-truth-and-lies]
  - step: "The reply to nihilism is affirmation: loving what is necessary, tested by the demon's offer to live this life again forever, a test whose force does not depend on the physics; a self that can pass it is achieved, not given, by giving style to one's drives, and Ecce Homo is Nietzsche putting his own life to the test"
    label: "Saying yes"
    years: "1881–1888"
    caption: "'Looking away shall be my only negation'; the heaviest weight; 'one thing is needful'; 'how could I fail to be grateful to my whole life?'"
    lessons: [amor-fati, eternal-recurrence, becoming-who-you-are, ecce-homo]
  - step: "Affirmation needs a type able to bear it: the overman against the comfortable last man, the higher type who is as manifold as he is whole, the order of rank in which every elevation of man has needed an aristocratic society and the many have existed for the few, and the philosopher who creates values knowing they are made; 'What Is Noble?' is Nietzsche's own last statement of the type"
    label: "The higher human being and the order of rank"
    years: "1883–1888"
    caption: "A rope over an abyss; 'as manifold as whole'; 'slavery in some sense'; 'the noble soul has reverence for itself'"
    lessons: [overman-and-last-man, higher-type, order-of-rank, creating-values, what-is-noble]
  - step: "Taking stock: Nietzsche's contempt for the state, nationalism and antisemitism sits beside his praise of rank and caste and does not add up to a political programme; the Nazi reading was a distortion built by his sister's Archive and the regime out of a compiled book and clipped quotations, with a residue of hard passages it could use; assembled, the argument holds in its critique, strains in its reply, and achieves a new way of holding values up"
    label: "Taking stock"
    years: "1888–1945"
    caption: "'European air, not nationalistic nitrogen'; the Archive, the sister, the clipped quotations; the argument on one page"
    lessons: [nietzsche-and-politics, the-nazi-appropriation, the-system-assembled]
key_results:
  - text: "'God is dead' (Gay Science 108, 125, 343) reports that belief in the Christian God has become unbelievable; it is a discrediting, not a refutation, and its conclusion concerns 'the whole of our European morality', which was built on that faith"
    lesson: death-of-god
  - text: "Nihilism is the highest values devaluing themselves: Christianity's own demand for truthfulness exposes the world behind the world as a fiction, and with it the ground of the values it supported (Gay Science 357, Genealogy III 27, the Lenzer Heide note of 1887)"
    lesson: nihilism
  - text: "There is no doer behind the deed (Genealogy I 13): the subject that 'could have done otherwise' is a fiction added to the deed by grammar, and with it falls the responsibility that blame and guilt presuppose"
    lesson: doer-behind-the-deed
  - text: "'A living thing wants above all to discharge its strength; life itself is will to power; self-preservation is only one of its indirect and most frequent results' (Beyond Good and Evil 13): will to power is the desire to overcome resistance, and it explains cruelty and asceticism better than desire for pleasure or survival"
    lesson: will-to-power-as-psychology
  - text: "The noble mode of valuation says 'good' of itself first and 'bad' of others after; the slave mode says 'evil' of its oppressor first and derives 'good' by negation: 'the slave revolt in morality begins when ressentiment itself becomes creative and gives birth to values' (Genealogy I 10)"
    lesson: slave-revolt-and-ressentiment
  - text: "'Almost everything we call higher culture rests on the spiritualization and deepening of cruelty' (Beyond Good and Evil 229): the festival pleasure of making suffer (Genealogy II 6-7) was refined into tragedy, religion and knowledge, not abolished"
    lesson: cruelty-and-culture
  - text: "Guilt (Schuld) began as debt; bad conscience is cruelty turned inward when society caged the human animal; Christianity made the debt unpayable by having the creditor sacrifice himself for the debtor (Genealogy II 4-5, 16, 21)"
    lesson: guilt-before-god
  - text: "The ascetic priest gives suffering a meaning by naming the sufferer as its cause: 'man would rather will nothingness than not will' (Genealogy III 15, 28)"
    lesson: ascetic-priest
  - text: "Morality is 'the danger of dangers' (Genealogy Preface 6) because its false picture of the self and its norms of pity, equality and comfort stand in the way of 'the highest power and splendor actually possible to the type man'"
    lesson: danger-of-dangers
  - text: "'The democratic movement is the heir of the Christian movement' (Beyond Good and Evil 202): equal rights, democracy, socialism and the religion of pity are herd morality surviving the death of the God that founded it"
    lesson: herd-morality-in-modern-dress
  - text: "The true world was made a fable in six stages, from Plato to positivism; abolishing it abolishes the 'apparent' world too, leaving one world without the contrast (Twilight, 'How the True World Finally Became a Fable')"
    lesson: real-world-became-a-fable
  - text: "Perspectivism is not relativism: 'there is only a perspective seeing, only a perspective knowing', and objectivity is the ability to bring more eyes to bear on one thing (Genealogy III 12)"
    lesson: perspectivism
  - text: "The unconditional will to truth is the ascetic ideal's last form: it rests on the faith 'that God is the truth, that truth is divine' (Gay Science 344), and 'Christianity as a dogma was destroyed by its own morality' (Genealogy III 27)"
    lesson: will-to-truth
  - text: "Eternal recurrence is a test, not a forecast: Gay Science 341 is a conditional ('what if'), a life passes it if one would crave its endless repetition, and its force does not depend on cosmology"
    lesson: eternal-recurrence
  - text: "The notebook 'proof' of recurrence (finite force, no final state reached) fails: three wheels turning at rates 1, 2 and $1/\\pi$ never return to their starting configuration, and Zarathustra himself calls the plain cosmological version a 'hurdy-gurdy song'"
    lesson: recurrence-as-cosmology
  - text: "'Every elevation of the type man has so far been the work of an aristocratic society, and so it will be always again: a society that believes in a long ladder of rank and needs slavery in some sense' (Beyond Good and Evil 257); 'the inequality of rights is the first condition for the existence of any rights' (Antichrist 57)"
    lesson: order-of-rank
  - text: "Creating values is not inventing them from nothing: 'whatever has value in our world now does not have value in itself ... it was we who gave and bestowed it' (Gay Science 301), and the philosophers of the future are 'commanders and legislators' whose 'will to truth is will to power' (Beyond Good and Evil 211)"
    lesson: creating-values
  - text: "Nietzsche's attack on the state, his contempt for antisemites and nationalists and his praise of rank make him an anti-political aristocrat of culture, not the author of a programme; the Nazi reading needed a compiled book and clipped quotations, and the hard passages it could use without forgery are named and read whole"
    lesson: the-nazi-appropriation
sources:
  - "F. Nietzsche, The Birth of Tragedy (1872) with the 1886 'Attempt at a Self-Criticism', trans. W. A. Haussmann (1909), checked against the German; or W. Kaufmann, Vintage 1967"
  - "F. Nietzsche, 'On Truth and Lies in a Nonmoral Sense' (1873, unpublished), German text (eKGWB WL); partial English in The Portable Nietzsche"
  - "F. Nietzsche, Untimely Meditations II and III (1874), trans. A. Collins (1909), checked against the German; or R. J. Hollingdale, Cambridge 1997"
  - "F. Nietzsche, Human, All Too Human I (1878), trans. H. Zimmern (1909), checked against the German; or R. J. Hollingdale, Cambridge 1996"
  - "F. Nietzsche, Daybreak (1881), trans. R. J. Hollingdale, ed. M. Clark & B. Leiter, Cambridge 1997"
  - "F. Nietzsche, The Gay Science (1882; Book V and Preface 1887), trans. W. Kaufmann, Vintage 1974"
  - "F. Nietzsche, Thus Spoke Zarathustra (1883-85), trans. W. Kaufmann, in The Portable Nietzsche, Viking 1954"
  - "F. Nietzsche, Beyond Good and Evil (1886), trans. H. Zimmern (1907) with the course's own translations from the German; W. Kaufmann, Vintage 1966, for comparison"
  - "F. Nietzsche, On the Genealogy of Morals (1887), trans. W. Kaufmann & R. J. Hollingdale, Vintage 1989 (bound with Ecce Homo)"
  - "F. Nietzsche, The Case of Wagner (1888), trans. T. Common (1911); Nietzsche contra Wagner, trans. W. Kaufmann, Portable Nietzsche"
  - "F. Nietzsche, Twilight of the Idols and The Antichrist (1888), trans. W. Kaufmann, in The Portable Nietzsche, Viking 1954"
  - "F. Nietzsche, Ecce Homo (1888, published 1908), trans. W. Kaufmann, Vintage 1989"
  - "F. Nietzsche, Writings from the Late Notebooks, ed. R. Bittner, trans. K. Sturge, Cambridge 2003 (unpublished notes, cited as such by notebook and fragment number)"
  - "F. Nietzsche, Digital Critical Edition (eKGWB), ed. P. D'Iorio, nietzschesource.org, for every German wording"
  - "W. Kaufmann, Nietzsche: Philosopher, Psychologist, Antichrist, 4th ed., Princeton 1974 (Princeton Classics 2013)"
  - "M. Tanner, Nietzsche: A Very Short Introduction, Oxford 1994"
  - "J. Young, Friedrich Nietzsche: A Philosophical Biography, Cambridge 2010"
  - "A. Nehamas, Nietzsche: Life as Literature, Harvard 1985"
  - "B. Reginster, The Affirmation of Life: Nietzsche on Overcoming Nihilism, Harvard 2006"
  - "M. Clark & D. Dudrick, The Soul of Nietzsche's Beyond Good and Evil, Cambridge 2012"
  - "B. Leiter, Nietzsche on Morality, 2nd ed., Routledge 2015; and 'Nietzsche's Moral and Political Philosophy', Stanford Encyclopedia of Philosophy (rev. 2024)"
  - "B. Leiter & N. Sinhababu (eds.), Nietzsche and Morality, Oxford 2007"
  - "C. Janaway & S. Robertson (eds.), Nietzsche, Naturalism, and Normativity, Oxford 2012"
  - "K. Gemes & J. Richardson (eds.), The Oxford Handbook of Nietzsche, Oxford 2013"
outcomes:
  - id: co-system
    text: "Explain Nietzsche's thought as one connected argument, from the death of God through the genealogy of morality and truth to the affirmation of life and the order of rank"
    bloom: understand
  - id: co-reconstruct
    text: "Analyze a Nietzsche passage into its claim, its step-by-step argument and the premise it leaves unstated"
    bloom: analyze
  - id: co-psychology
    text: "Apply Nietzsche's drive psychology (drives, will to power, sublimation, the fiction of the doer) to explain a belief, a value or an action"
    bloom: apply
  - id: co-genealogy
    text: "Explain how Nietzsche derives good and evil, guilt, cruelty's refinement, the ascetic ideal and pity from human drives under historical pressure, and what he claims they do to us"
    bloom: understand
  - id: co-truth
    text: "Explain how the critique of the true world, perspectivism and the questioning of the will to truth extend the death of God from values to knowledge"
    bloom: understand
  - id: co-evaluate
    text: "Evaluate each central claim against the strongest objection a serious critic would make and Nietzsche's best reply, and judge where the argument holds and where it has a gap"
    bloom: evaluate
  - id: co-apply
    text: "Read one of Nietzsche's texts whole with the course's results in hand, naming which claims it uses, where it goes further, and how a distorted reading of it can be told from the text"
    bloom: evaluate

modules:
  - slug: the-problem
    title: "The man and the problem"
    outcomes: [co-system, co-reconstruct, co-apply]
    lessons:
      - slug: nietzsche-life-and-books
        title: "Nietzsche's life and the form of his books"
        type: core
        status: planned
        goal: "Explain how Nietzsche's three periods and his aphoristic form decide what counts as his view, and read a short aphorism as an argument"
        opening: "Between 1872 and 1888 Nietzsche wrote about fifteen books, and almost none of them is a treatise: they are numbered sections, a line to a few pages each, and the notebooks his sister turned into his 'main work' were notes he had abandoned."
        est_minutes: 30
        prerequisites: []
        concepts:
          introduces: [three-periods, aphorism, nachlass]
          reinforces: []
        key_ideas:
          - "Three periods: Wagnerian professor (1869-76), free-spirit aphorist (1878-82), the mature works from Zarathustra to the 1888 collapse"
          - "The aphorism is a compressed argument: claim, hidden premise, a joke or an image where the step should be; 'an aphorism has not been deciphered when it has simply been read' (Genealogy Preface 8)"
          - "Books first, notebooks second: The Will to Power is a compilation by his sister under a plan he abandoned in 1888, not a book he wrote"
          - "Illness, solitude and the break with Wagner date the shifts; they do not explain the arguments away, and Ecce Homo turns the illness into a vantage point"
        demo: null
      - slug: schopenhauer-and-the-birth-of-tragedy
        title: "Schopenhauer's pessimism and The Birth of Tragedy"
        type: core
        status: planned
        goal: "Explain Schopenhauer's case that existence is suffering and how The Birth of Tragedy accepts the suffering while rejecting the verdict through art"
        opening: "Schopenhauer argued that a life of wanting swings between pain and boredom and is better not lived; the young Nietzsche accepted every premise of that argument except its conclusion."
        est_minutes: 35
        prerequisites: [nietzsche-life-and-books]
        concepts:
          introduces: [will-to-live, schopenhauers-pessimism, apollonian-and-dionysian, aesthetic-justification]
          reinforces: [three-periods]
        key_ideas:
          - "Schopenhauer: the will to live never rests, satisfaction is only relief, so life oscillates between pain and boredom; the cure is to stop willing"
          - "Silenus: best never to be born, second best to die soon; the Greeks knew this and created the Olympians to be able to live, 'the only satisfactory theodicy' (BT 3)"
          - "Apollo (form, image, the individual) and Dionysus (intoxication, the individual dissolved) combine in tragedy; 'only as an aesthetic phenomenon is existence and the world eternally justified' (BT 5), a justification for the world-artist, not the sufferer"
          - "Socrates' optimism ('virtue is knowledge') killed tragedy; the 1886 Self-Criticism keeps the question ('is there a pessimism of strength?'), drops the Schopenhauerian metaphysics and the Wagnerian hopes, and names morality 'the danger of dangers'"
        demo: null
      - slug: death-of-god
        title: "The death of God"
        type: core
        status: planned
        goal: "Analyze 'God is dead' as an argument from the discrediting of a belief to the collapse of the morality that rested on it"
        opening: "When Nietzsche's madman announces that God is dead, his listeners are atheists, and they laugh; his point is that they have not understood what their unbelief costs them."
        est_minutes: 35
        prerequisites: [nietzsche-life-and-books]
        concepts:
          introduces: [death-of-god, discrediting]
          reinforces: [aphorism]
        key_ideas:
          - "A claim about belief: 'the belief in the Christian god has become unbelievable' (Gay Science 343), not a proof that God does not exist; Gay Science 108-125 is one continuous argument, from Buddha's shadow to the madman"
          - "Discrediting, not refuting: 'historical refutation as the definitive refutation' (Daybreak 95): once we can explain why people believed without the belief being true, the belief loses its claim on us"
          - "The unstated premise: 'the whole of our European morality' was built on that faith, so its foundation has gone"
          - "The shadow of God: the morality survives the belief, 'the way light from a dead star keeps arriving' (Gay Science 108, 125); Nietzsche's own mood is dawn, 'the sea, our sea, lies open again'"
          - "Objection: values never needed God (the Euthyphro answer); Nietzsche's reply about what kind of values these are and whose life they served"
        demo: null
      - slug: nihilism
        title: "Nihilism: the highest values devalue themselves"
        type: core
        status: planned
        goal: "Explain why Nietzsche holds that the highest values devalue themselves, and distinguish passive from active nihilism"
        opening: "Nihilism, for Nietzsche, is not the belief that nothing matters; it is what happens to a culture whose highest values have been exposed as unrealizable by the very truthfulness those values demanded."
        est_minutes: 35
        prerequisites: [death-of-god, schopenhauer-and-the-birth-of-tragedy]
        concepts:
          introduces: [nihilism, passive-and-active-nihilism, decadence, revaluation]
          reinforces: [death-of-god, schopenhauers-pessimism]
        key_ideas:
          - "The highest values devalue themselves: 'what really triumphed over the Christian god: Christian morality itself, the concept of truthfulness' (Gay Science 357; Genealogy III 27)"
          - "Two failures: disorientation (values lose their standing) and despair ('In vain!', the Lenzer Heide note of June 1887, unpublished)"
          - "The hidden premise: our highest values were life-negating, measuring this world by another; 'either abolish your reverences or yourselves' (Gay Science 346)"
          - "Passive nihilism is decline and exhaustion; active nihilism destroys what is falling as a sign of strength (notebook 9[35], unpublished); Nietzsche is a nihilist in neither sense"
          - "The task this sets: a revaluation of values, not a return to God; the madman's 'I have come too early'"
        demo: null
      - slug: case-of-wagner
        title: "The Case of Wagner read whole: decadence diagnosed in an artist"
        type: synthesis
        status: planned
        goal: "Assess The Case of Wagner with the module's diagnosis, separating the art Nietzsche first hailed as tragedy reborn from the decadence he found in the same music sixteen years later"
        opening: "Nietzsche dedicated The Birth of Tragedy to Richard Wagner as the man who would bring tragedy back, and sixteen years later wrote The Case of Wagner to prove that the same music was a symptom of the disease he had named decadence."
        est_minutes: 35
        prerequisites: [schopenhauer-and-the-birth-of-tragedy, nihilism]
        concepts:
          introduces: [romantic-pessimism]
          reinforces: [decadence, aesthetic-justification, apollonian-and-dionysian, nihilism]
        key_ideas:
          - "Application: the whole 1888 pamphlet read in order (Preface, 1-12, the Postscripts, the Epilogue) through the module's results; 'I am just as much a child of my age as Wagner, i.e. a decadent; the only difference is that I recognised the fact'"
          - "Hunger or overflow (Gay Science 370): art made from lack versus art made from abundance; 'someone always wants to be redeemed in his operas'"
          - "Decadence as a style: 'life no longer animates the whole' (CW 7); Wagner the actor, not a musician; Parsifal as the test, redemption, chastity and the cross set to music"
          - "Where the case departs: the diagnosis is made by a man who loved the drug ('Wagner is the antitoxin against everything German', Ecce Homo II 6), the break was 'a total aberration of my instincts', and the Epilogue's master-morality against Christian morality reaches past the module"
        demo: null
        notes: "Module application lesson (L16): a primary text read whole."

  - slug: the-human-being
    title: "What a human being is"
    outcomes: [co-psychology, co-reconstruct, co-evaluate, co-apply]
    lessons:
      - slug: self-as-society-of-drives
        title: "The self as a society of drives"
        type: core
        status: planned
        goal: "Explain Nietzsche's claim that a person is an organized plurality of drives rather than a unified soul, and the argument that supports it"
        opening: "Plato gave the soul three parts with reason in command; Nietzsche keeps the idea of a soul with parts, removes the commander, and calls what is left 'a social structure of the drives and affects'."
        est_minutes: 35
        prerequisites: [nietzsche-life-and-books]
        concepts:
          introduces: [drives, soul-as-commonwealth]
          reinforces: [aphorism]
        key_ideas:
          - "Against soul-atomism: the self is not an indivisible thing; 'soul as subject-multiplicity', 'soul as social structure of the drives and affects' (Beyond Good and Evil 12)"
          - "Drives are standing dispositions that interpret, want and compete; 'every drive is domineering, and as such it tries to philosophize' (BGE 6); daily experience is 'prey thrown to now this, now that drive' (Daybreak 119)"
          - "Self-mastery is one drive mastering another: 'our intellect is only the blind instrument of another drive' (Daybreak 109); the body is 'a great reason, a plurality with one sense' (Zarathustra I 4)"
          - "Unity is an achievement: 'an order of rank among these capacities ... a tremendous variety that is nevertheless the opposite of chaos' (Ecce Homo II 9)"
          - "Objection: who arranges the drives? The answer that keeps a minimal self, and Nietzsche's own hesitation ('an aristocracy of cells?', unpublished, 1885)"
        demo: null
      - slug: consciousness-and-language
        title: "Consciousness and language as herd instruments"
        type: core
        status: planned
        goal: "Explain Nietzsche's argument that consciousness developed for communication and therefore shows us only the common, average surface of ourselves"
        opening: "Most of what we do, think and feel goes on without our being conscious of it; Nietzsche asks why consciousness exists at all, and answers that it was needed only to talk to others."
        est_minutes: 35
        prerequisites: [self-as-society-of-drives]
        concepts:
          introduces: [consciousness-as-communication, herd-instinct]
          reinforces: [drives]
        key_ideas:
          - "Consciousness is superfluous for most of life, so its existence needs an explanation (Gay Science 354; already Gay Science 11: 'the last and latest development of the organic')"
          - "The explanation: the need to communicate under danger; consciousness grew with language and 'does not really belong to man's individual existence but rather to his social or herd nature'"
          - "So consciousness is generic: it renders our unique inner life in the herd's vocabulary; 'all our so-called consciousness is a more or less fantastic commentary on an unknown, perhaps unknowable, but felt text' (Daybreak 119)"
          - "Self-knowledge through introspection is therefore systematically shallow: 'everybody is farthest away from himself' (Gay Science 335); 'this is the essence of phenomenalism and perspectivism as I understand them'"
          - "Objection: is this an evolutionary story Nietzsche cannot test? His reply from the structure of language, and what later psychology found"
        demo: null
      - slug: doer-behind-the-deed
        title: "No doer behind the deed: free will and responsibility"
        type: core
        status: planned
        goal: "Analyze Nietzsche's argument that the free, responsible subject is a fiction of grammar and assess what follows for blame"
        opening: "We say 'lightning flashes' as if the lightning were one thing and the flash something it does; Nietzsche argues that morality makes the same mistake about people and builds blame on it."
        est_minutes: 40
        prerequisites: [consciousness-and-language]
        concepts:
          introduces: [doer-deed-fiction, causa-sui]
          reinforces: [drives, consciousness-as-communication]
        key_ideas:
          - "The lightning and the flash: 'there is no being behind doing, effecting, becoming; the doer is merely a fiction added to the deed' (Genealogy I 13), and why the weak need the fiction"
          - "Free will requires being cause of oneself, causa sui, 'the best self-contradiction conceived so far' (Beyond Good and Evil 21); 'unfree will' is the same mistake run backwards"
          - "Willing is a complex of sensations, a commanding thought and above all the affect of command, 'a unity only as a word' (BGE 19); 'one has mistaken the helmsman for the steam' (Gay Science 360)"
          - "The conflict of motives is invisible: 'I do not learn which motive has actually proved victorious' (Daybreak 129); the pale criminal made himself the doer of one deed (Zarathustra I 6)"
          - "What survives: not 'unfree will' either, but strong and weak will, character, and 'the innocence of becoming'; blame and guilt lose their premise"
        demo: null
      - slug: will-to-power-as-psychology
        title: "Will to power against survival and the will to live"
        type: core
        status: planned
        goal: "Explain will to power as a psychological principle and evaluate it against Darwin's self-preservation and Schopenhauer's will to live"
        opening: "Darwin said living things strive to survive and Schopenhauer said they strive to go on living; Nietzsche answers that a living thing wants above all to discharge its strength, and survival is only one of the frequent results."
        est_minutes: 40
        prerequisites: [self-as-society-of-drives, schopenhauer-and-the-birth-of-tragedy]
        concepts:
          introduces: [will-to-power, overcoming-resistance]
          reinforces: [drives, will-to-live, schopenhauers-pessimism]
        key_ideas:
          - "'Self-preservation is only one of its indirect and most frequent results' (BGE 13); 'the struggle for existence is only an exception, a temporary restriction of the will to life' (Gay Science 349)"
          - "Will to power is the desire to overcome resistance in pursuing some end, 'the feeling that power is growing, that resistance is overcome' (Antichrist 2); not the desire to dominate as such, though dominating is one of its forms"
          - "So it wants obstacles, and its satisfaction never ends the wanting: 'I am that which must always overcome itself' (Zarathustra II 12); the earliest form is the 'feeling of power' of Daybreak 13, 113, 262"
          - "Evidence: cruelty, asceticism and the martyr's sacrifice, which pleasure and survival explain badly (Gay Science 13; Daybreak 113)"
          - "The fork: a psychology of living things, or a claim about the whole world? BGE 36 is a chain of 'supposing'; the notebooks drop the hedge ('this world is the will to power and nothing besides', unpublished 1885), and the course states both"
        demo: null
      - slug: sublimation
        title: "Sublimation: spiritualizing the drives"
        type: core
        status: planned
        goal: "Explain how sublimation redirects a drive toward a new object instead of extirpating it, and why Nietzsche ranks it above both indulgence and castration of the passions"
        opening: "The church fought the passions by cutting them out, and Nietzsche thought that was a cure worse than the disease; his alternative is to keep a drive's force and change what it is aimed at."
        est_minutes: 35
        prerequisites: [will-to-power-as-psychology]
        concepts:
          introduces: [sublimation, spiritualization]
          reinforces: [drives, will-to-power]
        key_ideas:
          - "Three treatments of a drive: discharge, extirpation ('castratism', Twilight 'Morality as Anti-Nature' 1-2), spiritualization; 'we no longer admire dentists who pluck out teeth so that they will not hurt any more'"
          - "Daybreak 109's six methods of combating a drive, and what they show about who does the combating: 'one drive complaining about another'"
          - "'The spiritualization of sensuality is called love', of hostility is valuing one's enemies (Twilight 'Anti-Nature' 3); the sexual drive 'sublimated itself into love (amour-passion)' under Christian pressure (BGE 189); 'good acts are sublimated evil' (Human, All Too Human 107)"
          - "The gardener: 'one can dispose of one's drives like a gardener' (Daybreak 560); the wild dogs in the cellar that became birds and singers (Zarathustra I 5)"
          - "Objection: if every virtue is a refined vice, has anything been explained? Nietzsche's reply from the continuity of force and the difference of form; where Kaufmann's 'sublimation' overreaches the texts"
        demo: null
      - slug: four-great-errors
        title: "The Four Great Errors read whole"
        type: synthesis
        status: planned
        goal: "Assess Twilight of the Idols' 'The Four Great Errors' with the module's psychology, naming which of its results each error uses and where the chapter reaches past them"
        opening: "In eight numbered sections of Twilight of the Idols Nietzsche turns his psychology of drives, consciousness and the will on morality and religion, and finds that both rest on four mistakes about cause and effect."
        est_minutes: 35
        prerequisites: [doer-behind-the-deed, sublimation]
        concepts:
          introduces: [four-great-errors, innocence-of-becoming]
          reinforces: [drives, consciousness-as-communication, doer-deed-fiction, will-to-power, spiritualization]
        key_ideas:
          - "Application: the chapter read in order; Cornaro's diet as confusing cause with effect ('his virtue is the effect of his happiness'), the template of the errors Nietzsche finds in morality"
          - "False causality: will, spirit and ego as 'inner facts' that are not facts; 'the will no longer moves anything, hence does not explain anything either' (uses doer-behind-the-deed and self-as-society-of-drives)"
          - "Imaginary causes: the dreamer's cannon shot and 'any explanation is better than none'; morality and religion as translations of physiological feelings into a false causal dialect (uses consciousness-and-language, sublimation)"
          - "'Free will was invented for the purpose of punishment'; 'Christianity is a metaphysics of the hangman' (reaches forward to guilt-before-god)"
          - "Where the chapter goes further than the module: 'no one gives man his qualities ... nothing besides the whole'; 'the concept of God was until now the greatest objection to existence'; the innocence of becoming as the doorstep of amor fati"
        demo: null
        notes: "Module application lesson (L16): a primary text read whole."
      - slug: drive-psychology-and-experiment
        title: "Nietzsche's psychology and the experimental record"
        type: extra
        status: planned
        goal: "Assess Nietzsche's claims about drives, self-knowledge and fixed types against modern findings on heritability, confabulation and attitudes"
        opening: "Nietzsche made empirical claims about human beings: that our conscious reasons are often stories told after the fact, and that character is set more by constitution than by upbringing; a century of experimental psychology has tested claims of exactly this shape."
        est_minutes: 30
        prerequisites: [doer-behind-the-deed, sublimation]
        concepts:
          introduces: [type-facts, confabulation]
          reinforces: [drives, consciousness-as-communication, doer-deed-fiction, will-to-power]
        key_ideas:
          - "Off the main path: the module's psychology read against measured findings, as evidence of Nietzsche's prescience"
          - "'We ourselves want to be our experiments and guinea pigs' (Gay Science 319): Nietzsche's own experimental stance"
          - "Twin and adoption studies: heritable traits, small shared-environment effects; 'a granite of spiritual fate' (BGE 231)"
          - "Confabulation and attitudes: stated reasons that do not predict what people do; Daybreak 119 and 129 as predictions"
          - "Where Nietzsche departs: heritability is not destiny, and situations matter more than he allowed"
        demo: null
        notes: "Off-path starred lesson (type: extra): no core lesson may require it."

  - slug: good-and-evil
    title: "Where good and evil came from"
    outcomes: [co-genealogy, co-reconstruct, co-evaluate, co-apply]
    lessons:
      - slug: genealogy-as-method
        title: "Genealogy as a method"
        type: core
        status: planned
        goal: "Explain what a genealogy of morality claims to show and why a history of a value can bear on its worth without committing the genetic fallacy"
        opening: "Pointing out that a belief has a disreputable origin does not show the belief is false; Nietzsche knew this, and still wrote a history of morality meant to change how we value it."
        est_minutes: 35
        prerequisites: [death-of-god, will-to-power-as-psychology]
        concepts:
          introduces: [genealogy, origin-and-purpose]
          reinforces: [discrediting, will-to-power]
        key_ideas:
          - "The question changes: not 'what is good?' but 'what is the value of our values?' (Genealogy Preface 3, 6); 'even if a morality has grown out of an error, the realization of this fact would not as much as touch the problem of its value' (Gay Science 345)"
          - "Origin and present purpose are different: 'the cause of the origin of a thing and its eventual utility lie worlds apart' (Genealogy II 12); the eleven meanings of punishment (II 13); 'only that which has no history is definable'"
          - "Against the 'English' genealogists who assumed utility as the origin of 'good'; 'gray, what is documented' against 'blue' guesswork (Preface 7); the 1882 research programme of Gay Science 7"
          - "The genetic fallacy, stated and answered: genealogy removes a value's claim to be given, and shows whose life it served; 'a fruit by which I know the soil'"
          - "What genealogy can and cannot prove, and why Nietzsche's three inquiries each begin 'cool, scientific, even ironic' (Ecce Homo on the Genealogy)"
        demo: null
      - slug: master-morality
        title: "Master morality: good and bad"
        type: core
        status: planned
        goal: "Explain the noble mode of valuation, in which 'good' names the valuer's own strength and 'bad' is an afterthought"
        opening: "In the oldest layer of moral language Nietzsche finds that 'good' did not mean kind or unselfish: it meant noble, powerful, happy, and it was what the nobles called themselves."
        est_minutes: 35
        prerequisites: [genealogy-as-method]
        concepts:
          introduces: [master-morality, pathos-of-distance]
          reinforces: [genealogy, will-to-power]
        key_ideas:
          - "The etymological evidence: schlecht and schlicht, esthlos, malus and bonus, arya (Genealogy I 4-5), including the racial ethnology of I 5 (blond Aryan conquerors, dark aboriginals, democracy as the suppressed race's counterattack), read for what it claims"
          - "Self-affirmation first: 'the lordly right of giving names' (I 2); the noble says 'good' of himself and 'bad' only by contrast; the twofold prehistory already in Human, All Too Human 45"
          - "The pathos of distance: a felt sense of rank that produced the right to coin values; the master type of BGE 260: 'value-creating', hard, with duties only to equals"
          - "The priestly aristocracy: a second noble type whose values turn inward and make man 'an interesting animal' (I 6-7); 'the splendid blond beast' of I 11 with its list of peoples"
          - "Objection: etymology is not argument, and 'in Homer the Trojan and the Greek are both good'; what the evidence can and cannot bear, and why Nietzsche does not simply side with the masters (the nobles are unspiritual, the priests made man deep)"
        demo: null
      - slug: slave-revolt-and-ressentiment
        title: "The slave revolt in morality and ressentiment"
        type: core
        status: planned
        goal: "Analyze how ressentiment turns the noble valuation upside down, producing 'evil' first and 'good' as its negation"
        opening: "The slave revolt in morality begins, Nietzsche says, when ressentiment itself becomes creative and gives birth to values: the oppressed, unable to strike back, take an imaginary revenge."
        est_minutes: 40
        prerequisites: [master-morality, doer-behind-the-deed]
        concepts:
          introduces: [ressentiment, slave-morality, slave-revolt]
          reinforces: [master-morality, doer-deed-fiction]
        key_ideas:
          - "Ressentiment: hatred that cannot discharge itself in action and turns into a way of seeing; 'his soul squints' (Genealogy I 10); the word appears in the Genealogy, not in Beyond Good and Evil"
          - "The inversion in one quoted voice: 'the wretched alone are the good ... and you, the powerful and noble, are on the contrary the evil' (I 7); 'with the Jews there begins the slave revolt in morality' (I 7, BGE 195), a claim about a priestly people, read for what it says"
          - "The asymmetry: noble 'good/bad' versus slave 'evil/good'; the same person is 'good' in one and 'evil' in the other; slave morality is 'a morality of utility' (BGE 260)"
          - "Lambs and birds of prey: the doer-deed fiction does the moral work (I 13); the dark workshop where weakness is lied into merit (I 14); Tertullian relishing the damned (I 15); 'Rome against Judea' (I 16)"
          - "Strategy or self-deception? Why the revolt need not be a plot; the physiology of ressentiment ('sickness itself is a kind of ressentiment', Ecce Homo I 6) and the objection that the story explains too much"
        demo: null
      - slug: jesus-and-paul
        title: "The Antichrist on Jesus and Paul read whole"
        type: synthesis
        status: planned
        goal: "Assess The Antichrist 24-47 as a test of the slave-revolt mechanism, finding where it fits, where Nietzsche himself exempts Jesus, and where the text goes past the module"
        opening: "The Antichrist calls Christianity the slave revolt's victory and then refuses to blame Jesus for it: 'there was only one Christian, and he died on the cross'."
        est_minutes: 35
        prerequisites: [slave-revolt-and-ressentiment]
        concepts:
          introduces: [redeemer-type]
          reinforces: [ressentiment, slave-revolt, slave-morality]
        key_ideas:
          - "Application: Antichrist 24-47 read in order through the slave-revolt mechanism; the Jewish priestly falsification where 'ressentiment had here become genius' (A 24-26)"
          - "Jesus as a type with no ressentiment: non-resistance, 'a new way of life, not a new faith' (A 29-35); the word 'idiot' the sister cut; Daybreak 68's Paul as 'the first Christian, the inventor of Christianity'"
          - "Paul as the 'dysangelist': guilt, judgment, the resurrection and immortality as 'the most malignant attempt to assassinate noble humanity' (A 42-43); 'equal rights for all' as Christian dynamite"
          - "Where the text goes past the module: the Polish-Jews aside in A 46 and the 'Jew' stereotypes stand beside the attack on Christian antisemites (A 55) and are read as written; Pilate's 'What is truth?' as the only respectable figure"
          - "Where the mechanism departs from history: Nietzsche's Gospel psychology against the sources, and what a believer can answer"
        demo: null
        notes: "Module application lesson (L16): a primary text read whole."

  - slug: guilt-and-the-priest
    title: "Guilt, bad conscience and the ascetic priest"
    outcomes: [co-genealogy, co-psychology, co-evaluate, co-apply]
    lessons:
      - slug: debt-and-punishment
        title: "Debt, promise and punishment"
        type: core
        status: planned
        goal: "Explain Nietzsche's derivation of guilt from the creditor-debtor relation and of the promising animal from memory burned in by pain"
        opening: "The German word for guilt, Schuld, also means debt, and Nietzsche argues that this is not an accident: the feeling of guilt grew out of the oldest relation between persons, buying and owing."
        est_minutes: 40
        prerequisites: [genealogy-as-method]
        concepts:
          introduces: [promising-animal, morality-of-custom, creditor-debtor]
          reinforces: [genealogy, origin-and-purpose]
        key_ideas:
          - "'To breed an animal with the right to make promises': active forgetting as a doorkeeper, memory made by pain, 'only that which never ceases to hurt stays in the memory' (Genealogy II 1-3)"
          - "The morality of custom: obedience to tradition 'not because it commands what is useful to us, but because it commands' (Daybreak 9); 'the sovereign individual' as the ripest fruit (II 2)"
          - "Creditor and debtor: the right to inflict pain as repayment, 'a warrant for and title to cruelty' (II 4-5); 'the categorical imperative smells of cruelty' (II 6)"
          - "Justice begins among roughly equal powers; the community as creditor; mercy as justice overcoming itself (II 8-10); against the view that justice is born of ressentiment (II 11)"
          - "Punishment did not originate from blame and does not produce bad conscience; its meaning has changed many times (II 12-15); Daybreak 202: 'every guilty person is a sick person'"
        demo: null
      - slug: cruelty-and-culture
        title: "Cruelty as an ingredient of culture"
        type: core
        status: planned
        goal: "Explain Nietzsche's claim that making suffer was the oldest festival pleasure of mankind and that higher culture rests on cruelty spiritualized rather than abolished"
        opening: "Nietzsche writes that 'without cruelty there is no festival', and then, in a sentence he calls his thesis, that almost everything we call higher culture rests on the spiritualization and deepening of cruelty."
        est_minutes: 35
        prerequisites: [debt-and-punishment, will-to-power-as-psychology]
        concepts:
          introduces: [festival-of-cruelty, spiritualized-cruelty]
          reinforces: [creditor-debtor, will-to-power, spiritualization, pathos-of-distance]
        key_ideas:
          - "'To see others suffer does one good, to make others suffer even more'; 'without cruelty there is no festival' (Genealogy II 6-7); 'cruelty is one of the oldest festive joys of mankind' (Daybreak 18); the gods as spectators who justify suffering"
          - "What offends is not suffering but senseless suffering (II 7): the premise the ascetic priest will later exploit"
          - "The ladder of distinction (Daybreak 113): from inflicting torment on others to the ascetic who inflicts it on himself, 'man split asunder into a sufferer and a spectator'"
          - "'Almost everything we call higher culture rests on the spiritualization and deepening of cruelty: this is my thesis; that wild animal has not been killed at all, it lives, it flourishes, it has only been deified' (BGE 229): tragic pity, the cross, the Wagnerienne at Tristan, and the knower's cruelty to his own spirit (BGE 230)"
          - "The hard passages read whole: II 7's remark on 'Negroes' as representatives of prehistoric man; the objection that Nietzsche recommends cruelty, and the textual reply (he describes an ingredient and ranks its refined forms higher), with the gap named where the ranking is asserted rather than argued"
        demo: null
      - slug: bad-conscience
        title: "Bad conscience: cruelty turned inward"
        type: core
        status: planned
        goal: "Analyze the claim that bad conscience is the instinct of cruelty turned back on the self when society walled the human animal in"
        opening: "When human beings were first enclosed in societies, the instincts that had been discharged outward on enemies and prey had nowhere to go, and Nietzsche argues they turned inward and became the bad conscience."
        est_minutes: 35
        prerequisites: [cruelty-and-culture, sublimation]
        concepts:
          introduces: [bad-conscience, internalization]
          reinforces: [creditor-debtor, festival-of-cruelty, sublimation, will-to-power]
        key_ideas:
          - "Internalization: 'all instincts that do not discharge themselves outwardly turn inward: this is what I call the internalization of man' (Genealogy II 16); sea animals forced onto land"
          - "The state as founders who imposed form, 'some pack of blond beasts of prey, a conqueror and master race', not a contract (II 17); the hard sentence read as written"
          - "The same force turned inward is 'the active bad conscience ... the womb of all ideal and imaginative phenomena' (II 18): selflessness and beauty are born here"
          - "Bad conscience as an illness 'as pregnancy is an illness' (II 19): the origin of depth and inner life; Nietzsche's own 'bite of conscience is indecent' (Twilight, Maxims 10) and Ecce Homo II 1"
          - "Distinguish bad conscience (raw self-torment) from guilt (its moral interpretation); punishment does not produce it (II 14); the Puritan who misreads his dyspepsia as conscience (notebook 38[1], unpublished)"
        demo: null
      - slug: guilt-before-god
        title: "Guilt before God"
        type: core
        status: planned
        goal: "Explain how Christianity, by Nietzsche's account, moralized bad conscience into guilt before God and made the debt unpayable"
        opening: "Every Christian knows that Christ died to redeem a debt human beings could not pay; Nietzsche reads that doctrine as the last stage of the history of debt, and as a stroke of genius that made guilt infinite."
        est_minutes: 35
        prerequisites: [bad-conscience, slave-revolt-and-ressentiment]
        concepts:
          introduces: [guilt]
          reinforces: [bad-conscience, creditor-debtor, ressentiment, internalization]
        key_ideas:
          - "Debt to the ancestors grows with the tribe's power and the ancestors become gods, 'perhaps this is even the origin of gods' (Genealogy II 19); the Christian God as the maximum of guilt (II 20)"
          - "Moralization: debt becomes guilt when it is joined to bad conscience and to free will; 'sin' as 'a Jewish feeling and a Jewish invention', an affront to God's honour independent of harm (Gay Science 135)"
          - "'God himself sacrifices himself for the guilt of mankind ... the creditor sacrifices himself for his debtor, out of love (can one credit that?)' (II 21); 'too long, the earth has been a madhouse!' (II 22)"
          - "Guilt as self-punishment that feels deserved; sinfulness 'is not a fact but an interpretation' of physiological depression (III 16); 'this guilt nevertheless did not exist. This applies to all guilt' (Gay Science 250)"
          - "The Greek gods as the counter-case: 'foolishness, not sin!' (II 23); atheism and 'a kind of second innocence' (II 20); 'Christianity is a metaphysics of the hangman' (Twilight, 'Errors' 7)"
        demo: null
      - slug: ascetic-priest
        title: "The ascetic priest and the meaning of suffering"
        type: core
        status: planned
        goal: "Explain how the ascetic ideal gives suffering a meaning by making the sufferer its cause, and why Nietzsche calls it a trick of life against itself"
        opening: "Human beings can bear almost any suffering if it has a meaning; what they cannot bear is meaningless suffering, and the ascetic priest's invention was to supply the meaning."
        est_minutes: 40
        prerequisites: [guilt-before-god]
        concepts:
          introduces: [ascetic-ideal, ascetic-priest, will-to-nothingness]
          reinforces: [guilt, ressentiment, will-to-power, festival-of-cruelty]
        key_ideas:
          - "The priest as 'shepherd and advocate of the sick herd', himself sick yet strong; 'the priest alters the direction of ressentiment': 'I suffer: someone must be to blame for it ... you yourself are this someone' (Genealogy III 15)"
          - "An ascetic life is 'a self-contradiction', ressentiment 'over life itself' (III 11); and yet 'the ascetic ideal is an artifice for the preservation of life' (III 13): life against life is still life"
          - "The priest's remedies: lowering the feeling of life, mechanical activity, the petty pleasure of 'love of the neighbor', herd formation, and the 'orgies of feeling' that made the sinner (III 17-21); the hen imprisoned by a chalk line"
          - "'The sick are man's greatest danger; not the evil, not the beasts of prey' (III 14): the hard passage read whole, including its remarks on 'the sick woman' and the anti-Semites, and the demand that 'the pathos of distance' keep the healthy apart from the sick"
          - "'Man would rather will nothingness than not will' (III 28); 'this book contains the first psychology of the priest' (Ecce Homo), and the objection that the priest is a composite with no historical referent"
        demo: null
      - slug: ascetic-ideals-in-artists-and-philosophers
        title: "What ascetic ideals mean for artists and philosophers (Genealogy III 1-10) read whole"
        type: synthesis
        status: planned
        goal: "Assess the opening of the Genealogy's third essay with the module's results, showing how the ascetic ideal in artists and philosophers differs from the priest's and where Nietzsche's own case is implicated"
        opening: "Before the Genealogy's third essay reaches the priest it spends ten sections on what ascetic ideals mean for an artist like Wagner and a philosopher like Schopenhauer, and finds that in a philosopher asceticism is not a denial of life but its optimum conditions."
        est_minutes: 35
        prerequisites: [ascetic-priest, sublimation, case-of-wagner]
        concepts:
          introduces: [philosophers-asceticism]
          reinforces: [ascetic-ideal, spiritualization, will-to-power, romantic-pessimism, aesthetic-justification]
        key_ideas:
          - "Application: Genealogy III 1-10 read in order; 'the human will needs a goal, and it will rather will nothingness than not will' (III 1) as the thesis the essay will unfold"
          - "Wagner's Parsifal and chastity: 'no necessary antithesis between chastity and sensuality'; separate the artist from the work, 'a Homer would not have created an Achilles if Homer had been an Achilles' (III 2-5); artists as 'valets of some morality'"
          - "Kant's 'beauty without interest' against Stendhal's 'une promesse de bonheur'; Schopenhauer's aesthetic contemplation as release from the wheel of Ixion (III 6)"
          - "The philosopher's asceticism as 'an optimum condition for the highest and boldest spirituality': poverty, humility, chastity as conditions, not virtues; 'a married philosopher belongs in comedy'; 'he who possesses is possessed' (III 7-8)"
          - "'All good things were formerly bad things' (III 9); the philosopher in the priest's 'caterpillar form' (III 10); where this applies to Nietzsche's own solitude, and what the essay has not yet shown about the priest proper"
        demo: null
        notes: "Module application lesson (L16): a primary text read whole."

  - slug: what-morality-does
    title: "What morality does to us"
    outcomes: [co-genealogy, co-evaluate, co-apply]
    lessons:
      - slug: against-pity
        title: "Against pity"
        type: core
        status: planned
        goal: "Evaluate Nietzsche's case against pity as a moral foundation, distinguishing it from a case for cruelty"
        opening: "Schopenhauer made compassion the foundation of all morality, and Nietzsche named it the most dangerous of the modern virtues: not because suffering does not matter, but because of what pity does to the one who feels it and the one who receives it."
        est_minutes: 35
        prerequisites: [ascetic-priest, schopenhauer-and-the-birth-of-tragedy]
        concepts:
          introduces: [critique-of-pity]
          reinforces: [schopenhauers-pessimism, ascetic-ideal, will-to-power, festival-of-cruelty]
        key_ideas:
          - "Pity multiplies suffering and depresses vitality: 'pity is the practice of nihilism' (Antichrist 7); 'supposing it was dominant even for a single day, mankind would immediately perish of it' (Daybreak 134)"
          - "Pity's hidden self-concern and feeling of power over the sufferer (Daybreak 133-138; Gay Science 13, 118; Human, All Too Human 50); 'pity is considered a virtue only among decadents' (Ecce Homo I 4)"
          - "It treats all suffering as evil, and so condemns what creativity requires: 'the discipline of great suffering ... has created every elevation of man so far', 'so it is pity against pity!' (BGE 225)"
          - "Nietzsche's own compassion: for squandered capacities, for friends whose distress he understands; 'a hard bed, a field cot' (Zarathustra II 3); Gay Science 338 as his fullest statement"
          - "Pity as Zarathustra's 'final sin' (Z IV 2) and the ugliest man; the objection that this is cruelty in disguise, and the reply that distinguishes hardness toward the creature from indifference to the creator"
        demo: null
      - slug: danger-of-dangers
        title: "Morality as the danger of dangers"
        type: core
        status: planned
        goal: "Assess Nietzsche's overall charge that morality rests on false beliefs about the self and harms the highest human beings"
        opening: "Nietzsche does not say that people should be crueller or that nothing is valuable; his charge is narrower and stranger, that our morality stands in the way of the highest human beings and so of humanity's best possibilities."
        est_minutes: 35
        prerequisites: [against-pity, doer-behind-the-deed]
        concepts:
          introduces: [morality-in-the-pejorative-sense, harm-to-higher-types]
          reinforces: [doer-deed-fiction, critique-of-pity, ascetic-ideal, slave-morality]
        key_ideas:
          - "Which morality: 'I deny morality as I deny alchemy, that is, I deny their premises' (Daybreak 103), not every valuation; 'there are altogether no moral facts', morality as symptomatology (Twilight 'Improvers' 1)"
          - "Its false presuppositions: free will, a transparent self, one nature for all; 'the demand of one morality for all is detrimental to the higher men' (BGE 228)"
          - "Its harmful norms: happiness over suffering, selflessness over self-love, equality over rank, pity over hardness; 'it is not error as error that horrifies me ... it is the lack of nature' (Ecce Homo IV 7)"
          - "The harm is cultural: 'precisely morality would be to blame if the highest power and splendor actually possible to the type man was never in fact attained' (Genealogy Preface 6); the phrase 'danger of dangers' from the 1886 Self-Criticism to Daybreak 173 (in the opposite voice) to the Genealogy"
          - "Objection: so few people practise this morality; why fear it? Nietzsche's reply (the concepts, not the practice, imprison the gifted) and the gap where the harm is asserted rather than shown"
        demo: null
      - slug: herd-morality-in-modern-dress
        title: "Herd morality in modern dress: equality, democracy, socialism, emancipation"
        type: core
        status: planned
        goal: "Explain Nietzsche's claim that modern egalitarian ideals are Christian morality surviving the death of the God that founded it, and evaluate his contempt for them"
        opening: "Nietzsche predicted that Europe would keep Christian morality after losing the Christian God, and named the forms it would take: equal rights, democracy, socialism, the emancipation of women, the abolition of suffering."
        est_minutes: 40
        prerequisites: [danger-of-dangers, slave-revolt-and-ressentiment]
        concepts:
          introduces: [herd-morality]
          reinforces: [herd-instinct, slave-morality, morality-in-the-pejorative-sense, death-of-god, ressentiment]
        key_ideas:
          - "'Morality in Europe today is herd-animal morality', which says 'I am morality itself, and nothing besides is morality!'; 'the democratic movement is the heir of the Christian movement' (BGE 201-203); 'fear is the mother of morals'"
          - "The English case: 'when one gives up the Christian faith, one pulls the right to Christian morality out from under one's feet' (Twilight, Skirmishes 5 on George Eliot)"
          - "Equality as the tarantulas' revenge: 'men are not equal, nor shall they become equal' (Zarathustra II 7); 'the poison of the doctrine of equal rights for all' (Antichrist 43); the socialist as 'the closest relative of the Christian'"
          - "The emancipation of woman as a symptom of the same movement: BGE 231-239 ('my truths'), Ecce Homo III 5 ('love: in its means, war; at bottom, the deadly hatred of the sexes'), Zarathustra I 18 and its reversal in III 15, Gay Science 68; quoted whole and read for the argument they make"
          - "'We who are homeless' (Gay Science 377): against nationalism and race hatred as well as the religion of pity; the objection that the prediction of fragility can be tested, and how it has fared"
        demo: null
      - slug: skirmishes-of-an-untimely-man
        title: "Skirmishes of an Untimely Man 33-41 read whole"
        type: synthesis
        status: planned
        goal: "Assess the nine consecutive Skirmishes of Twilight of the Idols on egoism, pity, freedom and democracy with the module's results, naming what each uses and where the text reaches past them"
        opening: "In nine numbered sections of Twilight of the Idols Nietzsche turns the critique of pity and herd morality on the modern world itself, from the natural value of egoism to the labour question, and the sentences that resulted are the ones most often quoted against him."
        est_minutes: 35
        prerequisites: [herd-morality-in-modern-dress, against-pity]
        concepts:
          introduces: [ascending-and-descending-life]
          reinforces: [critique-of-pity, herd-morality, decadence, morality-in-the-pejorative-sense, will-to-power]
        key_ideas:
          - "Application: Skirmishes 33-41 read in order; 'the natural value of egoism' measured by the ascending or descending line of life (33), the standard the whole module silently used"
          - "The Christian and the anarchist as decadents moved by revenge, 'if I am canaille, you ought to be too' (34); altruism 'virtually the formula of decadence' (35)"
          - "'Morality for physicians' (36): the sick as parasite, 'a new responsibility ... to further the degeneration or cause it to cease', and death freely chosen; the passage most cited for eugenics, read whole and placed against the module's results"
          - "'Whether we have become more moral' (37): softening of manners as a consequence of decline; the pathos of distance; 'l'impressionisme morale'; Cesare Borgia as a measure"
          - "'My conception of freedom' (38): freedom measured by resistance overcome, 'the free man is a warrior'; liberal institutions, democracy as 'the form of decline' (39), the labour question (40) and disciplined instincts (41); where these reach past the module into the order of rank"
        demo: null
        notes: "Module application lesson (L16): a primary text read whole."

  - slug: truth
    title: "Where truth came from"
    outcomes: [co-truth, co-reconstruct, co-evaluate, co-apply]
    lessons:
      - slug: real-world-became-a-fable
        title: "How the true world became a fable"
        type: core
        status: planned
        goal: "Explain the six stages by which, on Nietzsche's account, Plato's true world became a fable, and why abolishing it abolishes the apparent world too"
        opening: "Plato taught that behind the changing world we see there is a true world we can reach by reason; in one page of Twilight of the Idols Nietzsche tells the history of that idea in six stages, from its birth to its abolition."
        est_minutes: 35
        prerequisites: [death-of-god, nihilism]
        concepts:
          introduces: [true-world, platonism]
          reinforces: [death-of-god, nihilism]
        key_ideas:
          - "Stage by stage: attainable for the wise ('I, Plato, am the truth'), promised to the sinner who repents, unattainable but obligating (Kant, 'Konigsbergian'), unknown and so unobligating (positivism), refuted and abolished ('Plato's embarrassed blush'), and abolished together with the apparent world"
          - "Kant in a paragraph: the thing in itself we cannot know, 'the horrendum pudendum of the metaphysicians'"
          - "The last stage: 'with the true world we have also abolished the apparent one'; appearance loses its contrast (Gay Science 54)"
          - "'Christianity is Platonism for the people' (BGE Preface); 'the lie of the ideal has so far been the curse on reality' (Ecce Homo Preface 2); afterworlds born of 'suffering and incapacity' (Zarathustra I 3)"
          - "Noon, the moment of the shortest shadow: 'INCIPIT ZARATHUSTRA'; the objection that abolishing both worlds leaves no standard for 'false', and Nietzsche's reply from degrees of appearance"
        demo: null
      - slug: reason-in-philosophy
        title: "Reason in philosophy: Socrates, being and grammar"
        type: core
        status: planned
        goal: "Analyze Nietzsche's diagnosis of why philosophers believed in unchanging being, from Socrates' equation of reason with virtue to the metaphysics built into grammar"
        opening: "Philosophers from Parmenides to Kant agreed that what truly is does not change and that the senses deceive us; Nietzsche asks why so many clever people believed this, and his answer is about their bodies and their grammar."
        est_minutes: 35
        prerequisites: [real-world-became-a-fable, doer-behind-the-deed]
        concepts:
          introduces: [being-and-becoming, grammar-metaphysics]
          reinforces: [true-world, doer-deed-fiction, decadence]
        key_ideas:
          - "The problem of Socrates: 'reason = virtue = happiness' as a decadent's remedy; 'to have to fight the instincts, that is the formula of decadence' (Twilight 'Socrates' 11); dialectic as plebeian revenge; the dying Socrates ('life is a long sickness', Gay Science 340)"
          - "Egyptianism: philosophers mummify becoming into concepts; 'the senses do not lie; reason falsifies their testimony' with unity, substance, permanence ('Reason' 1-3)"
          - "The highest concepts as 'the last smoke of evaporating reality' put first as causa sui; language as 'rudimentary psychology'; 'I am afraid we are not rid of God because we still have faith in grammar' ('Reason' 4-5; BGE 20, 34)"
          - "Four theses against the true world, numbered for refutation ('Reason' 6); 'how did rationality arrive in the world? Irrationally' (Daybreak 123); 'logic arose out of illogic' (Gay Science 111)"
          - "Plato 'a coward before reality' who flees into the ideal (Twilight 'Ancients' 2); the objection that Nietzsche's diagnosis is itself a judgment made with reason, and his reply about symptoms and perspectives"
        demo: null
      - slug: perspectivism
        title: "Perspectivism"
        type: core
        status: planned
        goal: "Explain perspectivism, distinguish it from relativism, and assess the charge that it refutes itself"
        opening: "If there is no true world seen from nowhere, then all seeing is from somewhere; Nietzsche draws that conclusion and insists it does not make every view as good as every other."
        est_minutes: 40
        prerequisites: [reason-in-philosophy]
        concepts:
          introduces: [perspectivism]
          reinforces: [true-world, drives, being-and-becoming, consciousness-as-communication]
        key_ideas:
          - "'There is only a perspective seeing, only a perspective knowing; and the more affects we allow to speak about one thing, the more eyes ... the more complete will our concept of this thing, our objectivity, be' (Genealogy III 12); 'to eliminate the will altogether ... would be to castrate the intellect'"
          - "Objectivity as more eyes on one thing, not eyes from nowhere; 'the perspectival, the basic condition of all life' (BGE Preface); 'we cannot look around our own corner' and the world 'may include infinite interpretations' (Gay Science 374)"
          - "Not relativism: some perspectives are better than others; none is best of all; 'facts are just what there aren't, there are only interpretations' is a notebook line (7[60], unpublished) whose same note says the world is knowable"
          - "The self-refutation objection and why 'possibly false' is not 'false'; BGE 22's 'granted that this too is only interpretation, so much the better'"
          - "Interpretations need interpreters: drives as the ones who look ('every drive has its perspective'); Ecce Homo I 1's 'reversing perspectives' as the skill the course has been practising"
        demo: null
      - slug: will-to-truth
        title: "The will to truth and science as the last ascetic ideal"
        type: core
        status: planned
        goal: "Analyze Nietzsche's claim that the unconditional will to truth is the ascetic ideal's last form and evaluate what follows for his own inquiry"
        opening: "Modern science looks like the ascetic ideal's enemy, since it has no use for God or the afterlife; Nietzsche argues it is that ideal's purest form, because it rests on a faith that truth must be had at any cost."
        est_minutes: 40
        prerequisites: [perspectivism, ascetic-priest]
        concepts:
          introduces: [will-to-truth]
          reinforces: [ascetic-ideal, nihilism, death-of-god, perspectivism]
        key_ideas:
          - "'Granted that we want truth: why not rather untruth?' (BGE 1): the value of truth as a question nobody had asked; the 'intellectual conscience' (Gay Science 2) as Nietzsche's own virtue"
          - "Science rests on a metaphysical faith: not the prudent 'I will not be deceived' but the moral 'I will not deceive, not even myself'; 'it is still a metaphysical faith ... that God is the truth, that truth is divine' (Gay Science 344); 'will to truth, that might be a concealed will to death'"
          - "Science is 'not the opposite of the ascetic ideal but rather the latest and noblest form of it' (Genealogy III 23-25); 'nothing is true, everything is permitted' is the Assassins' secret, not Nietzsche's motto (III 24)"
          - "'Christianity as a dogma was destroyed by its own morality; in the same way Christianity as morality must now perish, too' (III 27); 'the will to truth becomes conscious of itself as a problem'"
          - "The circle: Nietzsche questions truth in the name of truthfulness, and says so ('how much truth does a spirit endure, how much truth does it dare?', Ecce Homo Preface 3); his reply turns truth from a duty into a measure of strength"
        demo: null
      - slug: value-of-untruth
        title: "The value of untruth: art and illusion"
        type: core
        status: planned
        goal: "Evaluate Nietzsche's claim that untruth can be a condition of life and that art is the honest form of illusion"
        opening: "'The falsity of a judgment is not yet an objection to a judgment,' Nietzsche writes; the question is whether it furthers life, and he holds that some of our most basic beliefs are false and indispensable."
        est_minutes: 35
        prerequisites: [will-to-truth, schopenhauer-and-the-birth-of-tragedy]
        concepts:
          introduces: [untruth-as-condition-of-life, honest-illusion]
          reinforces: [aesthetic-justification, will-to-truth, perspectivism]
        key_ideas:
          - "Life-preserving errors: enduring things, equal things, substances, free will, 'that what is good for me is also good in itself' (Gay Science 110); 'to what extent can truth endure incorporation? That is the experiment'"
          - "'The falsity of a judgment is not yet (noch kein) an objection': the German is weaker than the usual translation; 'untruth as a condition of life' (BGE 4); 'truth is the kind of error without which a particular kind of living creature could not live' (notebook 34, unpublished, the hardest form)"
          - "Not a pragmatist theory of truth: useful and false, not true because useful; 'man's truths are ultimately his irrefutable errors' (Gay Science 265)"
          - "Art as 'the good will to appearance' that keeps knowledge bearable: 'honesty would lead to nausea and suicide' (Gay Science 107); 'art, in which precisely the lie is sanctified', is the ascetic ideal's genuine opposite, 'Plato versus Homer' (Genealogy III 25)"
          - "'Those Greeks were superficial, out of profundity' (Gay Science Preface 4); The Birth of Tragedy's justification returns without its metaphysics; the objection that a knowing illusion is no longer an illusion"
        demo: null
      - slug: on-truth-and-lies
        title: "'On Truth and Lies in a Nonmoral Sense' (1873) read whole"
        type: synthesis
        status: planned
        goal: "Assess the young Nietzsche's essay on truth with the module's late theory, identifying which of its claims survive and which depend on the thing in itself he later abolished"
        opening: "In 1873 Nietzsche wrote, and did not publish, an essay calling truth 'a mobile army of metaphors'; it became his most quoted text on truth, and by his own later standards it contains a mistake."
        est_minutes: 30
        prerequisites: [value-of-untruth, consciousness-and-language]
        concepts:
          introduces: [truth-as-metaphor]
          reinforces: [true-world, perspectivism, consciousness-as-communication, untruth-as-condition-of-life]
        key_ideas:
          - "Application: the whole essay read in order from the German, from the clever animals on a star to the stoic and the man of intuition"
          - "The essay's chain: nerve stimulus to image to sound, two leaps between spheres; the concept formed by 'equating the unequal' (the leaf); 'coins which have lost their pictures'"
          - "Truth as a social convention: the peace pact that legislates truth, 'the obligation to lie according to a fixed convention'; consciousness 'hanging in dreams upon the back of a tiger'"
          - "The hidden premise: true knowledge would be knowledge of the thing in itself, 'the mysterious X'; this is the premise the fable abolished (real-world-became-a-fable)"
          - "What survives (concepts equate the unequal; truth's social and herd origin, as in Gay Science 354) and what was dropped; Nietzsche's own later gloss, 'the status of certain errors vis-a-vis others' (unpublished, 1885)"
        demo: null
        notes: "Module application lesson (L16): a primary text read whole."

  - slug: affirmation
    title: "The answer: affirmation"
    outcomes: [co-system, co-evaluate, co-reconstruct, co-apply]
    lessons:
      - slug: amor-fati
        title: "Amor fati"
        type: core
        status: planned
        goal: "Explain amor fati as loving what is necessary and distinguish it from resignation, endurance and denial"
        opening: "'My formula for greatness in a human being is amor fati,' Nietzsche writes: not merely bearing what is necessary, still less concealing it, but loving it."
        est_minutes: 35
        prerequisites: [nihilism, ascetic-priest]
        concepts:
          introduces: [amor-fati, affirmation-of-life]
          reinforces: [nihilism, ascetic-ideal, schopenhauers-pessimism, innocence-of-becoming]
        key_ideas:
          - "Gay Science 276 (New Year 1882): 'I want to learn more and more to see as beautiful what is necessary in things ... Amor fati: let that be my love henceforth!'; 'looking away shall be my only negation'"
          - "Ecce Homo II 10: 'that one wants nothing to be different, not forward, not backward, not in all eternity. Not merely bear what is necessary, still less conceal it, all idealism is mendaciousness in the face of what is necessary, but love it'"
          - "Three sham affirmations: resignation, 'Russian fatalism' (the soldier lying down in the snow, EH I 6), and the ass's 'Yea-Yuh' (Zarathustra III 11, IV 17)"
          - "Loving necessity includes the suffering: 'nothing in existence may be subtracted, nothing is dispensable' (EH on BT 2); fatalism without the moralist, 'the innocence of becoming' (Twilight 'Errors' 8); Goethe's 'joyous and trusting fatalism ... baptized with the name of Dionysus' (Skirmishes 49)"
          - "Objection: life is the desire that things be different, and an amor fati that wants nothing changed cannot act; Nietzsche's reply from 'thus I willed it' (Zarathustra II 20) and the gap it leaves"
        demo: null
      - slug: eternal-recurrence
        title: "Eternal recurrence as a test"
        type: core
        status: planned
        goal: "Analyze eternal recurrence as a test of affirmation and evaluate rival accounts of what passing it requires"
        opening: "A demon tells you that you will live this life again, every pain and joy in the same order, innumerable times; Nietzsche calls this the greatest weight and asks how you would answer."
        est_minutes: 40
        prerequisites: [amor-fati]
        concepts:
          introduces: [eternal-recurrence]
          reinforces: [amor-fati, affirmation-of-life, nihilism]
        key_ideas:
          - "Gay Science 341 as a conditional ('What, if some day or night a demon ...'), not a forecast; its precursors in 109, 233 and 285 ('you will the eternal recurrence of war and peace'), and Zarathustra beginning in the next section"
          - "Two reactions, no indifference: curse the demon or 'you are a god, and never have I heard anything more divine'; 'how well disposed would you have to become to yourself and to life'"
          - "Why all or nothing: 'all things are entangled, ensnared, enamored; if ever you wanted one thing twice ... then you wanted all back' (Zarathustra IV 19); wishing a moment would never end versus wishing it would recur"
          - "Zarathustra's crisis: the gateway Moment and the shepherd with the snake (Z III 2), 'eternally recurs the man of whom you are weary, the small man' (Z III 13); the Lenzer Heide note calls the thought 'the most extreme form of nihilism' first (unpublished, 1887)"
          - "The atrocity objection (willing the return of every horror) and the emptiness objection (a monster could pass), with Nietzsche's replies from his texts and the plain sentence where the first retains force; Ecce Homo's 'highest formula of affirmation that is at all attainable'"
        demo: null
      - slug: recurrence-as-cosmology
        title: "Eternal recurrence as cosmology"
        type: extra
        status: planned
        goal: "Evaluate the notebook argument that finite force in infinite time must repeat, and identify the premise Simmel's counterexample breaks"
        opening: "In his notebooks Nietzsche tried to prove that everything literally recurs, reasoning that a finite amount of force in infinite time can have no final state and must repeat; the proof fails, and the way it fails is instructive."
        est_minutes: 30
        prerequisites: [eternal-recurrence]
        concepts:
          introduces: [cosmological-recurrence]
          reinforces: [eternal-recurrence, nachlass]
        key_ideas:
          - "The argument as the notebooks give it: if the world had a goal or final state it would have been reached; a finite, determinate force 'lacks the capacity for eternal novelty' (36[15], 1885); 'the principle of the conservation of energy demands eternal recurrence' (5[54]); 'the most scientific of all possible hypotheses' (5[71]); all unpublished"
          - "What the books say: BGE 56's 'da capo' is an ideal, not a physics; Zarathustra's animals state the wheel of being and he calls it a 'hurdy-gurdy song' (Z III 13); the dwarf's 'time itself is a circle' is rebuked as 'too easy' (Z III 2)"
          - "Simmel's wheels: a finite system that never returns to its start"
          - "The missing premise: finitely many states; 'the recurrence of identical cases' is assumed, never argued"
          - "Why the test survives the failed proof, and what Nietzsche wanted from the cosmology ('to imprint upon becoming the character of being', 7[54])"
        demo:
          component: SimmelWheels
          spec: >
            Three wheels on one axle, each with a marker, turning at speed
            ratios the reader sets (presets: "1 : 2 : 3", "1 : 2 : 1/pi").
            The reader scrubs or plays time and tries to bring all three
            markers back to their starting angles at once; a readout shows the
            smallest total angular gap found so far. With rational ratios the
            reader hits zero; with 1/pi the gap gets small but never zero, and
            the prose asks the reader to try before it explains why. Finding
            the recurrence time in the rational case is the task.
        notes: "Off-path starred lesson (type: extra): no core lesson may require it."
      - slug: becoming-who-you-are
        title: "Becoming who one is: style and self-creation"
        type: core
        status: planned
        goal: "Explain 'become who you are' as the achievement of unity among one's drives and evaluate 'giving style to one's character' as an ideal"
        opening: "'Become who you are' sounds like a contradiction, since one already is whoever one is; Nietzsche's answer is that a self is not given but achieved, by organizing many drives under one taste."
        est_minutes: 35
        prerequisites: [eternal-recurrence, self-as-society-of-drives]
        concepts:
          introduces: [becoming-who-one-is, giving-style]
          reinforces: [soul-as-commonwealth, drives, sublimation, amor-fati]
        key_ideas:
          - "Gay Science 290: 'one thing is needful: to give style to one's character, a great and rare art'; 'whether this taste was good or bad is less important than one might suppose, if only it was a single taste!'; 'whoever is dissatisfied with himself is continually ready for revenge'"
          - "The line's history: 'be thyself!' and the ladder of what you have loved (Untimely Meditations III 1); 'what does your conscience say? You shall become the person you are' (Gay Science 270, a catechism answer); 'we want to become those we are ... therefore: long live physics!' (Gay Science 335); Ecce Homo's subtitle"
          - "Ecce Homo II 9: 'to become what one is, one must not have the faintest notion what one is'; the organizing idea that commands from below while 'consciousness is a surface'"
          - "Goethe as the model: 'he disciplined himself to wholeness, he created himself' (Twilight, Skirmishes 49); the gardener of Daybreak 560 against the 'granite of spiritual fate' of BGE 231"
          - "Objection: a single taste could be monstrous, and a self that must not know itself cannot be made on purpose; Nietzsche's reply (style is judged by the life it makes affirmable) and the plain sentence on what it leaves open"
        demo: null
      - slug: ecce-homo
        title: "Ecce Homo read whole: a life put to the test"
        type: synthesis
        status: planned
        goal: "Assess Ecce Homo as Nietzsche's attempt to pass his own test of affirmation, separating its argument from its self-mythology"
        opening: "Weeks before his collapse Nietzsche wrote an account of his own life with chapter titles like 'Why I Am So Wise' and 'Why I Write Such Good Books'; read past the bravado, it is an attempt to say yes to a life of illness, isolation and failure."
        est_minutes: 35
        prerequisites: [becoming-who-you-are, eternal-recurrence]
        concepts:
          introduces: []
          reinforces: [amor-fati, eternal-recurrence, becoming-who-one-is, giving-style, three-periods, critique-of-pity]
        key_ideas:
          - "Application: the book read whole as the module's ideal applied by its author to himself; 'how could I fail to be grateful to my whole life?' (the birthday epigraph); 'there is no if only in this autobiography'"
          - "Illness reread: 'already dead as my father, while as my mother I am still living' (I 1); 'as summa summarum I was healthy; as an angle, as a specialty, I was a decadent' (I 2); the reversal of perspectives as the condition of the revaluation"
          - "Freedom from ressentiment as the practised form of amor fati (I 6); the retrospective review of the books as the theory of style applied to a life (III)"
          - "The anti-legend: 'I want no believers ... I have a terrible fear that one day I will be pronounced holy' (IV 1); 'Dionysus versus the Crucified' (IV 9)"
          - "Where it departs: the 'no trace of struggle' against the documented suffering, the passages on women and on Germans (III 5, II 10), the restored page on mother and sister as 'the deepest objection to the eternal recurrence' (EH I 3 in the Colli-Montinari text), and the hand of the 1888 letters"
        demo: null
        notes: "Module application lesson (L16): a primary text read whole."

  - slug: higher-human-being
    title: "The higher human being and the order of rank"
    outcomes: [co-system, co-evaluate, co-reconstruct, co-apply]
    lessons:
      - slug: overman-and-last-man
        title: "The overman and the last man"
        type: core
        status: planned
        goal: "Explain the overman as a goal of self-overcoming set against the last man, and reject the reading of it as a future biological species"
        opening: "Zarathustra's first speech offers the crowd the overman, and they ask instead for the last man, who has 'invented happiness' and blinks; Nietzsche's point is that the second is the likelier future."
        est_minutes: 35
        prerequisites: [eternal-recurrence, herd-morality-in-modern-dress]
        concepts:
          introduces: [overman, last-man]
          reinforces: [herd-morality, will-to-power, nihilism, eternal-recurrence]
        key_ideas:
          - "'Man is a rope, tied between beast and overman, a rope over an abyss'; 'the overman is the meaning of the earth' (Zarathustra Prologue 3-4); 'to sin against the earth is now the most dreadful thing'"
          - "The last man: 'we have invented happiness, and they blink'; 'no shepherd and one herd'; the crowd's reply, 'give us this last man' (Prologue 5); 'we are weary of man' (Genealogy I 12)"
          - "Not a Darwinian successor species: 'scholarly oxen have suspected me of Darwinism', 'sooner a Cesare Borgia than a Parsifal' (Ecce Homo III 1); the higher type as 'a kind of overman' that has appeared as 'fortunate accident' (Antichrist 3-4); the first 'overmen' in Gay Science 143"
          - "The three metamorphoses: camel, lion, child (Z I 1); 'whoever must be a creator in good and evil must first be an annihilator and break values' (Z II 12)"
          - "The overman as the one who can bear the recurrence of the small man (Z III 13; EH III Z 6); why the word disappears from the later books, and what replaces it"
        demo: null
      - slug: higher-type
        title: "The higher type: greatness as manifold wholeness"
        type: core
        status: planned
        goal: "Explain the marks of Nietzsche's higher type and evaluate his claim that greatness is to be as manifold as one is whole"
        opening: "Nietzsche's praise goes to a handful of names, Goethe, Beethoven, Napoleon, Caesar, and he describes a type rather than a programme: solitary, self-reverent, rich in opposed drives held under one command."
        est_minutes: 35
        prerequisites: [overman-and-last-man, sublimation]
        concepts:
          introduces: [higher-type, free-spirit, great-health]
          reinforces: [pathos-of-distance, sublimation, overman, harm-to-higher-types, becoming-who-one-is]
        key_ideas:
          - "Marks of the type: solitude, a unifying task, 'what does not kill him makes him stronger' as a principle of selection (Ecce Homo I 2), self-reverence, affirmation; the well-turned-out person 'carved from wood that is hard, delicate, and at the same time smells good'"
          - "'As manifold as whole, as wide as full' (BGE 212): men of warring instincts who master the war within, Alcibiades, Caesar, Frederick II, Leonardo (BGE 200); 'the price of fruitfulness is to be rich in internal opposition' (Twilight 'Anti-Nature' 3)"
          - "The great health, 'that one does not merely have but also acquires continually, and must acquire because one gives it up again and again' (Gay Science 382); 'live dangerously' (GS 283)"
          - "The free spirit is not the free-thinker: 'a spirit that has become free' (EH on HAH), against the 'levellers' who want herd happiness (BGE 44)"
          - "'The higher its type, the more rarely a thing succeeds' (Z IV 13); the ruin of higher men as the rule (BGE 269); the objection that the type is a self-portrait, and the reply from the names Nietzsche actually gives"
        demo: null
      - slug: order-of-rank
        title: "Order of rank: aristocratic society and the pathos of distance"
        type: core
        status: planned
        goal: "Explain Nietzsche's claim that every elevation of the type man has required an aristocratic society in which the many exist for the few, and evaluate the argument he gives for it"
        opening: "Beyond Good and Evil 257 states that every elevation of the type man has been the work of an aristocratic society that believes in a long ladder of rank and 'needs slavery in some sense'; Nietzsche means the sentence, and the lesson shows what it means and what it rests on."
        est_minutes: 40
        prerequisites: [higher-type, master-morality]
        concepts:
          introduces: [order-of-rank, aristocratic-society, exploitation]
          reinforces: [pathos-of-distance, master-morality, higher-type, will-to-power, herd-morality]
        key_ideas:
          - "BGE 257 read whole: aristocratic society, the ladder of rank, 'slavery in some sense (in irgend einem Sinne)'; the pathos of distance between castes as the precondition of the 'more mysterious pathos', the self-overcoming of man; the noble caste began as barbarians, 'more complete human beings, which at every level also means more complete beasts'"
          - "BGE 258: a healthy aristocracy accepts 'with a good conscience the sacrifice of a legion of individuals who, for its sake, must be reduced and lowered to incomplete human beings, to slaves, to instruments'; society as scaffolding, the Sipo Matador vine on the oak"
          - "BGE 259: 'life itself is essentially appropriation, injury, overpowering of the strange and weaker, suppression, hardness ... and at the least exploitation'; the goal of humanity 'cannot lie at the end but only in its highest specimens' (Untimely Meditations II 9); 'mankind in the mass sacrificed to the prosperity of a single stronger species of man: that would be an advance' (Genealogy II 12)"
          - "Antichrist 57: the castes as 'the supreme law of life'; 'the inequality of rights is the first condition for the existence of any rights'; 'a high culture is a pyramid: it can stand only on a broad base'; the mediocre as necessary and the duty of the exceptional to treat them gently; the breeding notes of the notebooks (37[5], 2[13], unpublished) read as written"
          - "The argument in steps and its unstated premise (that culture's value is its peaks); the strongest objection (great art has arisen without slavery, and the premise is asserted, not shown) and Nietzsche's reply from history and from the pathos of distance; the gap stated in one sentence; why 'slavery' is not softened into metaphor and 'breeding' is not softened into self-cultivation unless the text does it"
        demo: null
      - slug: creating-values
        title: "Creating values: can a naturalist call anything good?"
        type: core
        status: planned
        goal: "Evaluate the main answers to how Nietzsche can create and rank values after denying that anything has value in itself"
        opening: "Nietzsche says that nothing has value in itself and that new values must be created; the two claims together raise the question every reader eventually asks, what then gives his own values any authority."
        est_minutes: 40
        prerequisites: [order-of-rank, perspectivism, value-of-untruth]
        concepts:
          introduces: [value-creation, value-anti-realism]
          reinforces: [revaluation, perspectivism, honest-illusion, will-to-power, order-of-rank]
        key_ideas:
          - "'Whatever has value in our world now does not have value in itself ... it was we who gave and bestowed it' (Gay Science 301); 'to esteem is to create ... without esteeming, the nut of existence would be hollow' (Zarathustra I 15); 'we can destroy only as creators' (GS 58)"
          - "'The real philosophers are commanders and legislators: they say thus it shall be! ... their knowing is creating, their creating is law-giving, their will to truth is will to power' (BGE 211); the noble as 'value-creating' (BGE 260)"
          - "The authority puzzle: if morality's authority falls with its objectivity, why not Nietzsche's ideal? 'My judgment is my judgment' (BGE 43)"
          - "Four answers, named by what they say: power as the measure (Antichrist 2), honest illusion, values that fit a valuer's drives, perspectival objectivity; what each costs"
          - "What remains after the fork: values as made, and binding on those whose life they express; the child of the three metamorphoses and its 'sacred Yes'; the plain sentence on what the texts leave undecided"
        demo: null
      - slug: what-is-noble
        title: "'What Is Noble?' (Beyond Good and Evil IX) read whole"
        type: synthesis
        status: planned
        goal: "Assess the ninth part of Beyond Good and Evil with the module's results, naming which claims about rank, the higher type and value creation it uses, where it goes further, and what the forty sections add to the type"
        opening: "Beyond Good and Evil ends with forty sections under the question 'What is noble?', and they are Nietzsche's last extended statement of the type he hoped for, from the aristocratic society of 257 to 'the noble soul has reverence for itself' and the god Dionysus."
        est_minutes: 35
        prerequisites: [order-of-rank, creating-values]
        concepts:
          introduces: [reverence-for-oneself]
          reinforces: [order-of-rank, aristocratic-society, master-morality, slave-morality, higher-type, value-creation, exploitation]
        key_ideas:
          - "Application: BGE 257-296 read in order, with the module's results marked where the text uses them: 257-259 (order-of-rank), 260 (master and slave morality, 'even within one soul'), 261-265 (vanity as the slave's atavism, the egoism of the noble soul, 'to a being such as we, other beings must by nature be subordinate')"
          - "268-270: how language and the herd make everything communicable average; the psychologist 'suffocated by pity' because the ruin of higher men is the rule; 'great men are poor little fictions composed afterwards'; 'deep suffering makes noble'"
          - "272-287: signs of nobility, solitude, masks, 'the noble soul has reverence for itself' (287); why this is a faith, not an achievement, and how it sits with becoming-who-you-are"
          - "289-296: 'every word is also a mask'; the gods who laugh 'in an overman-like fashion'; 'I am the last disciple and initiate of the god Dionysus' and his wish to make man 'stronger, more evil and more profound'"
          - "Where the text departs from the module: the egoism of 265 goes past anything the higher-type lesson argued, 'reverence for itself' is unargued by design, and the hard sentences are read whole without softening"
        demo: null
        notes: "Module application lesson (L16): a primary text read whole."

  - slug: taking-stock
    title: "Taking stock"
    outcomes: [co-system, co-evaluate, co-apply]
    lessons:
      - slug: nietzsche-and-politics
        title: "Nietzsche and politics: the state, nationalism, antisemitism and great politics"
        type: core
        status: planned
        goal: "Evaluate whether Nietzsche's contempt for the state, nationalism and antisemitism and his praise of rank and caste add up to a political philosophy"
        opening: "Nietzsche called the state 'the coldest of all cold monsters', despised German nationalism and antisemitism, praised the caste law of Manu and announced 'great politics'; whether these add up to a politics is the question his readers have fought over for a century."
        est_minutes: 40
        prerequisites: [order-of-rank, herd-morality-in-modern-dress]
        concepts:
          introduces: [aristocratic-radicalism, good-european]
          reinforces: [order-of-rank, herd-morality, higher-type, aristocratic-society]
        key_ideas:
          - "The state as an idol and an enemy of culture: 'state is the name of the coldest of all cold monsters' (Zarathustra I 11); 'culture and the state are antagonists ... all great ages of culture are ages of political decline' (Twilight 'Germans' 4); 'as little state as possible' (Daybreak 179)"
          - "The good European: 'European air, not nationalistic nitrogen' (letter to Hillebrand, 1878); 'we who are homeless' against 'nationalism and race hatred' (Gay Science 377); the letters to his sister on Forster; 'I am just having all anti-Semites shot' (January 1889); BGE 251 read whole, with its 'let no more Jews come in' beside its 'banish the anti-Semitic bawlers'; Daybreak 205 and 272"
          - "The Law of Manu: taming versus breeding, both 'terrible' and both using the holy lie (Twilight 'Improvers' 2-5); Antichrist 56-58 as the affirmation Christianity lacks; 'the concept of pure blood is the opposite of a harmless concept'"
          - "'Great politics': 'the concept of politics will have merged entirely with a war of spirits ... there will be wars the like of which have never yet been seen on earth' (Ecce Homo IV 1); BGE 208's new caste that rules Europe with one will"
          - "Two readings, named by what they say: an aristocratic politics, or no politics at all, only advice to the few who might become higher types; the objection that 'slavery in some sense' invites use whatever he intended, and the plain sentence on the residue each reading leaves"
        demo: null
      - slug: the-nazi-appropriation
        title: "The Nazi appropriation"
        type: synthesis
        status: planned
        goal: "Assess the Nazi reading of Nietzsche against the course's reconstruction, distinguishing what the sister and the regime forged, compiled or clipped from the passages they could genuinely use"
        opening: "In 1934 Hitler visited the Nietzsche Archive in Weimar, run by Nietzsche's sister, who had married an antisemitic agitator and compiled her brother's notebooks into a book called The Will to Power; the uses the regime made of Nietzsche are a test of whether the argument can be read that way."
        est_minutes: 35
        prerequisites: [nietzsche-and-politics, order-of-rank]
        concepts:
          introduces: []
          reinforces: [nachlass, aristocratic-radicalism, good-european, will-to-power, higher-type, order-of-rank]
        key_ideas:
          - "Application: the whole course's reconstruction held against the most consequential distortion; the sister, the Archive, the 1901 and 1906 compilations under a plan Nietzsche abandoned, the forged letters, the deleted drafts ('Jews among Germans are always the higher race')"
          - "Clipped quotations: Human, All Too Human 475 read whole around the 'young stock-exchange Jew' sentence; 'the weak and the failures shall perish ... and they shall even be given every possible assistance' (Antichrist 2) with its continuation; the blond beast with its Romans, Arabs and Japanese"
          - "What the texts refute: race as worth, nationalism, the state, antisemitism; 'an anti-Semite certainly is not any more decent because he lies as a matter of principle' (Antichrist 55); 'inscription for an anti-Semite's door' (Twilight, Maxims 19)"
          - "What the texts could be used for without forgery: 'slavery in some sense' (BGE 257-258), the breeding notes ('rearing a master race, the future masters of the earth', 'castrate him', unpublished), Antichrist 2 and 57, 'morality for physicians'; what 'breeding', 'race' and 'master' denote in his vocabulary, stated as what he meant, not as an excuse"
          - "The verdict: a distortion by Elisabeth and the regime that needed compilation and clipping at its core, and a residue of hard passages the reader must own; Stefan George, the Stauffenbergs and the other reception"
        demo: null
        notes: "Module application lesson (L16): real artifacts (the compiled book, the clipped quotations) read against the texts."
      - slug: the-system-assembled
        title: "The whole argument assembled"
        type: synthesis
        status: planned
        goal: "Construct Nietzsche's thought as one chain of claims from the death of God to affirmation and the order of rank, and judge where each link holds, where it has a gap, and what the whole achieves"
        opening: "Nietzsche refused to write a system and said the will to a system is a lack of integrity; the claims taken apart in this course nevertheless depend on one another, and laid out in order they form one argument."
        est_minutes: 40
        prerequisites: [the-nazi-appropriation, ecce-homo, will-to-truth]
        concepts:
          introduces: []
          reinforces: [death-of-god, nihilism, will-to-power, genealogy, ascetic-ideal, will-to-truth, perspectivism, eternal-recurrence, value-creation, higher-type, order-of-rank, spiritualized-cruelty]
        key_ideas:
          - "The chain: death of God, nihilism, drive psychology, genealogy, cruelty and the priest, the critique of truth, affirmation, the higher type and the order of rank; Nietzsche's own map, the Yes-saying part (Zarathustra) and the No-saying part (BGE, GM, TI, A) (Ecce Homo on BGE)"
          - "What the critique establishes without the positive doctrine, and what Nietzsche saw first: morality as a symptom, the psychology of the drives, the fate of a culture after faith"
          - "The gaps named in one sentence each: the authority of made values, the cosmology, the unargued standard of ascending life, the higher type's relation to everyone else"
          - "Coherence without a system: problems outgrown rather than theorems derived; 'I mistrust all systematizers' (Twilight, Maxims 26)"
          - "The question answered: what holds values up if God is dead; the course ends on what the thought achieves, a way of valuing that knows it is made and says yes to the life that makes it"
        demo: null
        notes: "Closing synthesis: ends on what the thought achieves (the human's stance)."

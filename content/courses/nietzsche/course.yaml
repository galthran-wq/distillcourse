        type: core
        status: drafted
        key_image: figures/ideal-wheel.svg
        goal: "Analyze GM III:1–10's claim that the ascetic ideal means something different for each type — the artist's alibi, the philosopher's condition of power — and identify the rhetorical trap Clark finds in its opening"
        opening: "The Third Treatise asks what ascetic ideals mean and answers that the same ideal is a different thing in an artist, a philosopher and a priest — and that the philosopher's version, presented first as healthy, turns out to be the priest's in disguise."
        est_minutes: 36
        prerequisites: [guilt-reconstructed]
        concepts:
          introduces: [ascetic-ideal, disinterested-contemplation]
          reinforces: [doctrine-of-types, genealogy, valuation-asymmetry]
        key_ideas:
          - "III:1's compressed formula as the treatise's outline — the worked case of an aphorism that builds to 'rather will nothingness than not will'"
          - "III:2–5: Wagner and Parsifal — the artist who needs the ideal as alibi"
          - "III:6: Kant's disinterested beauty, Schopenhauer's will-less contemplation, Stendhal's 'promise of happiness' — and Heidegger's charge that Nietzsche inherited Schopenhauer's misreading of Kant"
          - "III:7–10: the unmarried philosophers, Buddha's fetter — asceticism as the philosopher's condition of maximal power, not truth"
          - "Clark's 'beginning calculated to mislead': the reader is walked into approving what §§11ff. unmask"
        demo: null

      - slug: ascetic-priest
        title: "The Ascetic Priest as Physician of the Sick"
        type: core
        status: drafted
        key_image: figures/redirection-3.svg
        goal: "Formulate GM III:11–22 and III:28 as a mechanism — a declining life defends itself through an ideal that redirects the sufferer's search for a cause onto the sufferer — and state what the mechanism explains that the First Treatise could not"
        opening: "The ascetic priest, on the Third Treatise's account, is a physician who does not cure: he takes a herd of sufferers who need someone to blame and tells them the someone is themselves, and that redirection is what made the slave revolt win."
        est_minutes: 38
        prerequisites: [ascetic-ideal-across-types]
        concepts:
          introduces: [ascetic-priest, redirection-of-ressentiment, meaning-of-suffering]
          reinforces: [ressentiment, slave-revolt, bad-conscience, guilt-as-debt, moralization]
        key_ideas:
          - "III:11–13: the ideal as a strategy of life against life — 'life wrestling with death' — the naturalist's key claim"
          - "III:15: 'I suffer: someone must be to blame' answered by 'quite so, my sheep, but you yourself' — the two-line pivot"
          - "III:16–22: the priest's remedies (hypnotic numbness, mechanical activity, small pleasures, herd formation, the orgy of feeling) ranked by cost"
          - "III:28: man does not object to suffering but to senseless suffering; the ideal gave suffering a meaning at the price of guilt; 'rather will nothingness than not will at all'"
          - "The three treatises joined: what ressentiment (I) and bad conscience (II) needed from the priest (III) to become European morality"
        demo: null

      - slug: perspectivism
        title: "Perspectivism and the Will-less Subject of Knowledge"
        type: core
        status: drafted
        key_image: figures/eye-no-direction.svg
        goal: "Formulate GM III:12's perspectivism — only a perspectival seeing, objectivity as the command of more perspectives — and distinguish it from the falsification thesis and from relativism"
        opening: "GM III:12 rejects the 'pure, will-less, painless, timeless subject of knowledge' and replaces it with a claim about eyes: there is only a perspectival seeing, and objectivity is the ability to bring more eyes to bear, not the absence of any."

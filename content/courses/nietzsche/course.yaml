        opening: "Guilt did not begin as a moral category: the German Schuld means debt, and the Second Treatise's argument is that the whole apparatus of guilt descends from a creditor's right to hurt a debtor who cannot pay."
        est_minutes: 36
        prerequisites: [promise-and-sovereign-individual]
        concepts:

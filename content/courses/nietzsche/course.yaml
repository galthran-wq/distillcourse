        type: core
        status: drafted
        key_image: figures/strain-routes.svg
        goal: "Formulate GM II:1–3's account of how the morality of custom bred an animal that can promise, and state the two readings of the sovereign individual that the passage must decide between"
        opening: "The Second Treatise opens with a breeding problem — how nature made an animal able to bind its own future — and answers with pain: memory was burned in, custom did the burning, and the 'ripest fruit' is an individual who calls the result his conscience."
        est_minutes: 34
        prerequisites: [doer-behind-the-deed]
        concepts:
          introduces: [memory-of-the-will, morality-of-custom, sovereign-individual]
          reinforces: [doer-deed-fiction, doctrine-of-types, genealogy]
        key_ideas:
          - "II:1: active forgetting versus the memory of the will — the right to make promises as a bred capacity"
          - "II:2: the morality of custom (with Daybreak §9 as the source) and the sovereign individual as its 'ripest fruit'"
          - "II:3: mnemotechnics of pain — the catalogue of punishments as evidence, graded"
          - "Two readings of II:2: Leiter's deflation (a natural artefact, 'free' as a persuasive definition) against Anderson's autonomy — the text's sentences that each must explain"

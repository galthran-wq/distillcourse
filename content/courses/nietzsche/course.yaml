        title: "Will to Power as Psychology and as Metaphysics"
        type: core
        status: drafted
        key_image: figures/reginster-loop.svg
        goal: "Formulate BGE 36's argument for the world as will to power step by step, locate the step Clark shows to beg the question, and state the psychological doctrine that survives in Reginster's three conditions"
        opening: "Nietzsche's published works contain exactly one step-by-step argument that the world is will to power 'and nothing besides' (BGE 36), and it begins with 'suppose' — the doctrine that survives analysis is smaller, and it is a claim about what satisfaction requires."
        est_minutes: 40
        prerequisites: [soul-as-society-of-drives]
        concepts:
          introduces: [will-to-power, cosmological-vs-psychological, overcoming-resistance]
          reinforces: [society-of-drives, published-works-rule, will-to-power-compilation, origin-vs-use]
        key_ideas:
          - "BGE 13: life as discharge of strength, self-preservation as consequence — the anti-Spinoza, anti-Darwin premise"
          - "BGE 36 reconstructed in seven steps; the conditional mood, the 'conscience of method', and where a premise assumes the conclusion (Clark Ch.7)"
          - "A §2: 'What is good? All that heightens the feeling of power' — the definitional use of the doctrine"
          - "Reginster's three conditions: a determinate first-order desire, resistance, its overcoming — the self-perpetuating paradox ('who was not vanquished in his victory?'); Richardson's 'growth in control' as the rival"
          - "GM II:12's reinterpretation and BGE 259's 'exploitation': what the psychological doctrine licenses in the genealogy and what only the cosmological would"
        demo: null

      - slug: real-world-became-a-fable
        title: "How the Real World Became a Fable"
        type: core
        status: drafted
        key_image: figures/inversion-vs-removal.svg
        goal: "Formulate Twilight's six-stage 'History of an Error' and 'Reason in Philosophy' as the argument that abolishing the true world abolishes the apparent one too, and connect it to Clark's account of why Nietzsche stopped denying truth"
        opening: "Twilight of the Idols compresses the history of Western metaphysics into six sentences, from Plato's attainable true world to 'INCIPIT ZARATHUSTRA', and the argument in the compression is that once the true world is abolished there is no 'merely apparent' world left to be dismissed as false."

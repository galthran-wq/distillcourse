<svg viewBox="0 0 640 394" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tiny { font-size: 9.5px; }
    .bold { font-weight: 600; }
    .box { fill: none; stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.2; }
    .now { fill: none; stroke: #e2903a; stroke-width: 2; }
    .amberbox { fill: none; stroke: #e2903a; stroke-width: 1.8; }
    .bluebox { fill: none; stroke: #4c8dd6; stroke-width: 1.8; }
    .dashamber { fill: none; stroke: #e2903a; stroke-width: 1.6; stroke-dasharray: 5 3; }
    .ghost { fill: none; stroke: currentColor; stroke-opacity: 0.25; stroke-width: 1; stroke-dasharray: 4 3; }
    .greybox { fill: none; stroke: currentColor; stroke-opacity: 0.35; stroke-width: 1; stroke-dasharray: 4 3; }
    .arrow { stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.2; fill: none; }
    .arrow-a { stroke: #e2903a; stroke-width: 1.4; fill: none; }
    .arrow-b { stroke: #4c8dd6; stroke-width: 1.4; fill: none; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .green { fill: #5aa46a; font-weight: 600; }
    .rule { stroke: currentColor; stroke-opacity: 0.3; stroke-width: 1; }
    .row { stroke: currentColor; stroke-opacity: 0.25; stroke-width: 1; stroke-dasharray: 2 3; }
    .strike { stroke: #e2903a; stroke-width: 1.6; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor" fill-opacity="0.6"/>
    </marker>
    <marker id="ah-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#e2903a"/>
    </marker>
    <marker id="ah-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4c8dd6"/>
    </marker>
  </defs>
  <text class="muted small" x="16" y="18">A §2: 'The weak and ill-constituted shall perish: first principle of our philanthropy. And one shall help them to do so.'</text>
  <rect class="greybox" x="16" y="32" width="280" height="150" rx="5"/>
  <text class="label small bold" x="26" y="50">reading 1: a breeding programme</text>
  <text class="label tiny" x="26" y="66">P1  the weak corrupt the strong by</text>
  <text class="label tiny" x="26" y="79">     teaching them pity</text>
  <text class="label tiny" x="26" y="92">P2  the philanthropy is toward the strong,</text>
  <text class="label tiny" x="26" y="105">     or toward 'mankind'</text>
  <text class="label tiny" x="26" y="118">C    eliminate the weak to improve the type</text>
  <text class="label tiny" x="26" y="131">objection (Reginster): P1 licenses</text>
  <text class="label tiny" x="26" y="144">segregation at most, not destruction</text>
  <path class="strike" d="M26 160 L286 60"/>
  <rect class="amberbox" x="344" y="32" width="280" height="150" rx="5"/>
  <text class="amber small" x="354" y="50">reading 2: euthanasia-philanthropy</text>
  <text class="label tiny" x="354" y="66">P1  for the constitutionally weak no life is</text>
  <text class="label tiny" x="354" y="79">     worth living, by their own lights:</text>
  <text class="label tiny" x="354" y="92">     life-negation ends in despair, the ethics</text>
  <text class="label tiny" x="354" y="105">     of power in 'relentless frustration'</text>
  <text class="label tiny" x="354" y="118">P2  the philanthropy is toward the weak</text>
  <text class="label tiny" x="354" y="131">C    to help them perish is to spare them</text>
  <text class="label tiny" x="354" y="144">(Reginster, ch. 6 §II.3)</text>
  <rect class="bluebox" x="40" y="196" width="560" height="64" rx="5"/>
  <text class="blue small" x="320" y="214" text-anchor="middle">the deciding sentence, §7</text>
  <text class="label tiny" x="320" y="229" text-anchor="middle">'To be physician here, to be inexorable here, to wield the knife here … that is our kind of philanthropy'</text>
  <text class="muted tiny" x="320" y="242" text-anchor="middle">a physician's object is the patient: fits reading 2;</text>
  <text class="muted tiny" x="320" y="254" text-anchor="middle">and 'breed' (§3; Improvers §§1–2) names what every morality does, the Church's included</text>
  <path class="arrow" d="M320 260 L320 274" marker-end="url(#ah)"/>
  <rect class="greybox" x="16" y="276" width="608" height="76" rx="5"/>
  <text class="label small bold" x="26" y="294">the residue Reginster concedes, on either reading</text>
  <text class="label tiny" x="26" y="309">'the view continues to disturb': Twilight IX 36 reopens 'a troubling eugenic program'; weakness is treated as</text>
  <text class="label tiny" x="26" y="322">'constitution', hence 'incurable'; 'when does a physiological state form an incurable constitutional defect?'</text>
  <text class="label tiny" x="26" y="335">The Doctrine of Types, which bounds a life without fixing it, cannot answer that from outside.</text>
  <path class="rule" d="M16 364 L624 364"/>
  <text class="label small" x="320" y="382" text-anchor="middle">the sentence states a principle of value whose object it does not fix; §7 leans toward reading 2; the residue stays</text>
</svg>

<svg viewBox="0 0 640 392" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tiny { font-size: 9.5px; }
    .bold { font-weight: 600; }
    .amberbox { fill: none; stroke: #e2903a; stroke-width: 1.8; }
    .bluebox { fill: none; stroke: #4c8dd6; stroke-width: 1.8; }
    .greybox { fill: none; stroke: currentColor; stroke-opacity: 0.45; stroke-width: 1.2; }
    .arrow { stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.2; fill: none; }
    .arrow-a { stroke: #e2903a; stroke-width: 1.4; fill: none; stroke-dasharray: 5 3; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .rule { stroke: currentColor; stroke-opacity: 0.3; stroke-width: 1; }
  </style>
  <defs>
    <marker id="ic-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor" fill-opacity="0.6"/>
    </marker>
    <marker id="ic-ah-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#e2903a"/>
    </marker>
  </defs>
  <text class="muted small" x="16" y="18">The third and fourth great errors in §15's vocabulary: a felt state first, a cause supplied after</text>
  <text class="muted tiny" x="120" y="40" text-anchor="middle">the felt state (comes first)</text>
  <text class="muted tiny" x="470" y="40" text-anchor="middle">the cause supplied (experienced as if first)</text>

  <!-- row 1: the template -->
  <text class="label small bold" x="16" y="78">Twilight</text>
  <text class="muted tiny" x="16" y="91">'Errors' §4</text>
  <rect class="greybox" x="80" y="52" width="196" height="56" rx="5"/>
  <text class="label tiny" x="88" y="70">a cannon-shot heard in sleep</text>
  <path class="arrow" d="M276 80 L318 80" marker-end="url(#ic-ah)"/>
  <text class="muted tiny" x="297" y="67" text-anchor="middle">error three</text>
  <rect class="greybox" x="320" y="52" width="300" height="56" rx="5"/>
  <text class="label tiny" x="328" y="70">a dream already composed, with the shot</text>
  <text class="label tiny" x="328" y="82">as its last event: the cause is supplied after</text>
  <text class="label tiny" x="328" y="94">the effect and experienced before it</text>

  <!-- row 2: unpleasant feeling -->
  <text class="label small bold" x="16" y="152">A §15</text>
  <rect class="bluebox" x="80" y="126" width="196" height="56" rx="5"/>
  <text class="blue tiny" x="88" y="142">an unpleasant general feeling</text>
  <text class="label tiny" x="88" y="156">'the condition of the</text>
  <text class="label tiny" x="88" y="168">nervus sympathicus'</text>
  <path class="arrow-a" d="M276 154 L318 154" marker-end="url(#ic-ah-a)"/>
  <rect class="amberbox" x="320" y="126" width="300" height="56" rx="5"/>
  <text class="amber tiny" x="328" y="142">imaginary cause</text>
  <text class="label tiny" x="328" y="156">'sin', 'sting of conscience',</text>
  <text class="label tiny" x="328" y="168">'temptation by the Devil'</text>

  <!-- row 3: pleasant feeling -->
  <text class="label small bold" x="16" y="226">A §15</text>
  <rect class="bluebox" x="80" y="200" width="196" height="56" rx="5"/>
  <text class="blue tiny" x="88" y="216">a pleasant general feeling</text>
  <text class="label tiny" x="88" y="230">'interpretations of pleasant or</text>
  <text class="label tiny" x="88" y="242">unpleasant general feelings'</text>
  <path class="arrow-a" d="M276 228 L318 228" marker-end="url(#ic-ah-a)"/>
  <rect class="amberbox" x="320" y="200" width="300" height="56" rx="5"/>
  <text class="amber tiny" x="328" y="216">imaginary cause</text>
  <text class="label tiny" x="328" y="230">'grace', 'the proximity of God',</text>
  <text class="label tiny" x="328" y="242">'forgiveness of sins'</text>

  <!-- row 4: misfortune, error four -->
  <text class="label small bold" x="16" y="300">A §26</text>
  <rect class="bluebox" x="80" y="274" width="196" height="56" rx="5"/>
  <text class="blue tiny" x="88" y="290">a misfortune</text>
  <text class="label tiny" x="88" y="304">defeat, sickness, 'anarchy within,</text>
  <text class="label tiny" x="88" y="316">the Assyrian from without'</text>
  <path class="arrow-a" d="M276 302 L318 302" marker-end="url(#ic-ah-a)"/>
  <text class="muted tiny" x="297" y="289" text-anchor="middle">error four</text>
  <rect class="amberbox" x="320" y="274" width="300" height="56" rx="5"/>
  <text class="amber tiny" x="328" y="290">imaginary cause</text>
  <text class="label tiny" x="328" y="304">'punishment' for disobedience, which needs a will</text>
  <text class="label tiny" x="328" y="316">that could have obeyed: 'free will', hence 'sin'</text>

  <path class="rule" d="M16 350 L624 350"/>
  <text class="label small" x="320" y="368" text-anchor="middle">the template row can be checked against any sleeper's night; the three rows beneath it against no record</text>
  <text class="muted tiny" x="320" y="382" text-anchor="middle">§15 supplies the vocabulary of the religion and no case in which the substitution is watched</text>
</svg>

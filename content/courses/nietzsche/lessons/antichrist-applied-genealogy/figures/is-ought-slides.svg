<svg viewBox="0 0 640 354" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tiny { font-size: 9.5px; }
    .bold { font-weight: 600; }
    .box { fill: none; stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.2; }
    .now { fill: none; stroke: #e2903a; stroke-width: 2; }
    .amberbox { fill: none; stroke: #e2903a; stroke-width: 1.8; }
    .bluebox { fill: none; stroke: #4c8dd6; stroke-width: 1.8; }
    .dashamber { fill: none; stroke: #e2903a; stroke-width: 1.6; stroke-dasharray: 5 3; }
    .ghost { fill: none; stroke: currentColor; stroke-opacity: 0.25; stroke-width: 1; stroke-dasharray: 4 3; }
    .greybox { fill: none; stroke: currentColor; stroke-opacity: 0.35; stroke-width: 1; stroke-dasharray: 4 3; }
    .arrow { stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.2; fill: none; }
    .arrow-a { stroke: #e2903a; stroke-width: 1.4; fill: none; }
    .arrow-b { stroke: #4c8dd6; stroke-width: 1.4; fill: none; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .green { fill: #5aa46a; font-weight: 600; }
    .rule { stroke: currentColor; stroke-opacity: 0.3; stroke-width: 1; }
    .row { stroke: currentColor; stroke-opacity: 0.25; stroke-width: 1; stroke-dasharray: 2 3; }
    .strike { stroke: #e2903a; stroke-width: 1.6; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor" fill-opacity="0.6"/>
    </marker>
    <marker id="ah-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#e2903a"/>
    </marker>
    <marker id="ah-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4c8dd6"/>
    </marker>
  </defs>
  <text class="muted small" x="16" y="18">The is–ought slides: a description, a bridge the text does not state, a verdict</text>
  <text class="label small bold" x="16" y="74">§2</text>
  <rect class="bluebox" x="48" y="34" width="176" height="76" rx="5"/>
  <text class="blue tiny" x="56" y="50">descriptive premise</text>
  <text class="label tiny" x="56" y="65">life is 'instinct for growth …</text>
  <text class="label tiny" x="56" y="77">for power' (§6)</text>
  <path class="arrow" d="M224 72 L246 72" marker-end="url(#ah)"/>
  <rect class="dashamber" x="248" y="34" width="160" height="76" rx="5"/>
  <text class="amber tiny" x="256" y="50">bridge, not stated</text>
  <text class="label tiny" x="256" y="65">life-enhancement is</text>
  <text class="label tiny" x="256" y="77">the standard of value</text>
  <path class="arrow-a" d="M408 72 L430 72" marker-end="url(#ah-a)"/>
  <rect class="amberbox" x="432" y="34" width="192" height="76" rx="5"/>
  <text class="amber tiny" x="440" y="50">value verdict</text>
  <text class="label tiny" x="440" y="65">good = what heightens the feeling</text>
  <text class="label tiny" x="440" y="77">of power; bad = what proceeds</text>
  <text class="label tiny" x="440" y="89">from weakness</text>
  <text class="label small bold" x="16" y="166">§7</text>
  <rect class="bluebox" x="48" y="126" width="176" height="76" rx="5"/>
  <text class="blue tiny" x="56" y="142">descriptive premise</text>
  <text class="label tiny" x="56" y="157">pity depresses the one who pities;</text>
  <text class="label tiny" x="56" y="169">it 'preserves what is ripe for</text>
  <text class="label tiny" x="56" y="181">destruction'</text>
  <path class="arrow" d="M224 164 L246 164" marker-end="url(#ah)"/>
  <rect class="dashamber" x="248" y="126" width="160" height="76" rx="5"/>
  <text class="amber tiny" x="256" y="142">bridge, not stated</text>
  <text class="label tiny" x="256" y="157">the same bridge</text>
  <text class="label tiny" x="256" y="169">(plus Darwin's 'selection',</text>
  <text class="label tiny" x="256" y="181">borrowed, not held)</text>
  <path class="arrow-a" d="M408 164 L430 164" marker-end="url(#ah-a)"/>
  <rect class="amberbox" x="432" y="126" width="192" height="76" rx="5"/>
  <text class="amber tiny" x="440" y="142">value verdict</text>
  <text class="label tiny" x="440" y="157">'pity is practical nihilism';</text>
  <text class="label tiny" x="440" y="169">nothing 'more unhealthy than</text>
  <text class="label tiny" x="440" y="181">Christian pity'</text>
  <text class="label small bold" x="16" y="258">§62</text>
  <rect class="bluebox" x="48" y="218" width="176" height="76" rx="5"/>
  <text class="blue tiny" x="56" y="234">descriptive premise</text>
  <text class="label tiny" x="56" y="249">the Church has lived on and</text>
  <text class="label tiny" x="56" y="261">manufactured distress; 'equality</text>
  <text class="label tiny" x="56" y="273">of souls' became revolution</text>
  <path class="arrow" d="M224 256 L246 256" marker-end="url(#ah)"/>
  <rect class="dashamber" x="248" y="218" width="160" height="76" rx="5"/>
  <text class="amber tiny" x="256" y="234">bridge, not stated</text>
  <text class="label tiny" x="256" y="249">the same bridge, plus a</text>
  <text class="label tiny" x="256" y="261">weighing of the higher type's</text>
  <text class="label tiny" x="256" y="273">loss against the 'blessings'</text>
  <path class="arrow-a" d="M408 256 L430 256" marker-end="url(#ah-a)"/>
  <rect class="amberbox" x="432" y="218" width="192" height="76" rx="5"/>
  <text class="amber tiny" x="440" y="234">value verdict</text>
  <text class="label tiny" x="440" y="249">'the one immortal blemish</text>
  <text class="label tiny" x="440" y="261">of mankind'</text>
  <path class="rule" d="M16 312 L624 312"/>
  <text class="label small" x="320" y="330" text-anchor="middle">the bridge is BGE 4's standard, 'how far the judgment promotes and preserves life', asserted there too</text>
  <text class="muted tiny" x="320" y="344" text-anchor="middle">its defence is deferred: will to power as psychology (Module 5), value creation and normativity (Module 6)</text>
</svg>

    .bluebox { fill: none; stroke: #4c8dd6; stroke-width: 1.8; }
    .dashamber { fill: none; stroke: #e2903a; stroke-width: 1.6; stroke-dasharray: 5 3; }
    .ghost { fill: none; stroke: currentColor; stroke-opacity: 0.25; stroke-width: 1; stroke-dasharray: 4 3; }
    .greybox { fill: none; stroke: currentColor; stroke-opacity: 0.35; stroke-width: 1; stroke-dasharray: 4 3; }
    .arrow { stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.2; fill: none; }
    .arrow-a { stroke: #e2903a; stroke-width: 1.4; fill: none; }
    .arrow-b { stroke: #4c8dd6; stroke-width: 1.4; fill: none; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .green { fill: #5aa46a; font-weight: 600; }
    .rule { stroke: currentColor; stroke-opacity: 0.3; stroke-width: 1; }
    .row { stroke: currentColor; stroke-opacity: 0.25; stroke-width: 1; stroke-dasharray: 2 3; }
    .strike { stroke: #e2903a; stroke-width: 1.6; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor" fill-opacity="0.6"/>
    </marker>
    <marker id="ah-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#e2903a"/>
    </marker>
    <marker id="ah-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4c8dd6"/>
    </marker>
  </defs>
  <text class="muted small" x="16" y="18">Frame 1 of 5: §§25–26, Israel's God denaturalized, stage 1</text>
  <rect class="now" x="16" y="32" width="400" height="66" rx="5"/>
  <text class="amber small" x="26" y="50">1  The Kingdom</text>
  <text class="label tiny" x="26" y="65">Yahweh as the expression of a nation's power:</text>
  <text class="label tiny" x="26" y="77">victory, salvation, 'above all rain'; 'the God of justice:</text>
  <text class="label tiny" x="26" y="89">the logic of every nation that is in power'</text>
  <text class="muted tiny" x="428" y="50">uses:</text>
  <text class="blue tiny" x="428" y="65">a type-fact: a nation in</text>
  <text class="blue tiny" x="428" y="78">power affirms itself</text>
  <rect class="ghost" x="16" y="108" width="400" height="66" rx="5"/>
  <text class="muted tiny" x="26" y="126" opacity="0.5">2</text>
  <rect class="ghost" x="16" y="184" width="400" height="66" rx="5"/>
  <text class="muted tiny" x="26" y="202" opacity="0.5">3</text>
  <rect class="ghost" x="16" y="260" width="400" height="66" rx="5"/>
  <text class="muted tiny" x="26" y="278" opacity="0.5">4</text>
  <rect class="ghost" x="16" y="336" width="400" height="66" rx="5"/>
  <text class="muted tiny" x="26" y="354" opacity="0.5">5</text>
  <path class="rule" d="M16 416 L624 416"/>
  <text class="label small" x="320" y="434" text-anchor="middle">changed: stage 1 drawn; the god is what the nation's power looks like from inside</text>
  <text class="muted tiny" x="320" y="448" text-anchor="middle">tags: blue = a type-fact; green = a record; amber = a Genealogy result</text>

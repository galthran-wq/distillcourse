<svg viewBox="0 0 640 398" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tiny { font-size: 9.5px; }
    .bold { font-weight: 600; }
    .box { fill: none; stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.2; }
    .now { fill: none; stroke: #e2903a; stroke-width: 2; }
    .amberbox { fill: none; stroke: #e2903a; stroke-width: 1.8; }
    .bluebox { fill: none; stroke: #4c8dd6; stroke-width: 1.8; }
    .dashamber { fill: none; stroke: #e2903a; stroke-width: 1.6; stroke-dasharray: 5 3; }
    .ghost { fill: none; stroke: currentColor; stroke-opacity: 0.25; stroke-width: 1; stroke-dasharray: 4 3; }
    .greybox { fill: none; stroke: currentColor; stroke-opacity: 0.35; stroke-width: 1; stroke-dasharray: 4 3; }
    .arrow { stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.2; fill: none; }
    .arrow-a { stroke: #e2903a; stroke-width: 1.4; fill: none; }
    .arrow-b { stroke: #4c8dd6; stroke-width: 1.4; fill: none; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .green { fill: #5aa46a; font-weight: 600; }
    .rule { stroke: currentColor; stroke-opacity: 0.3; stroke-width: 1; }
    .row { stroke: currentColor; stroke-opacity: 0.25; stroke-width: 1; stroke-dasharray: 2 3; }
    .strike { stroke: #e2903a; stroke-width: 1.6; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor" fill-opacity="0.6"/>
    </marker>
    <marker id="ah-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#e2903a"/>
    </marker>
    <marker id="ah-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4c8dd6"/>
    </marker>
  </defs>
  <text class="muted small" x="16" y="18">The machinery and its case: the treatises' results (left) and the sections of The Antichrist that use each (right)</text>
  <rect class="amberbox" x="16" y="36" width="210" height="40" rx="5"/>
  <text class="amber small" x="26" y="53">I:7, I:16</text>
  <text class="label tiny" x="26" y="67">the priestly inversion</text>
  <rect class="amberbox" x="16" y="86" width="210" height="40" rx="5"/>
  <text class="amber small" x="26" y="103">II:19–21</text>
  <text class="label tiny" x="26" y="117">the debt to a god</text>
  <rect class="amberbox" x="16" y="136" width="210" height="40" rx="5"/>
  <text class="amber small" x="26" y="153">III:15–18</text>
  <text class="label tiny" x="26" y="167">the redirection, the herd</text>
  <rect class="bluebox" x="16" y="186" width="210" height="40" rx="5"/>
  <text class="blue small" x="26" y="203">Four Great Errors</text>
  <text class="label tiny" x="26" y="217">imaginary causes (Twilight)</text>
  <rect class="bluebox" x="16" y="236" width="210" height="40" rx="5"/>
  <text class="blue small" x="26" y="253">Doctrine of Types</text>
  <text class="label tiny" x="26" y="267">type-facts explain values</text>
  <rect class="bluebox" x="16" y="286" width="210" height="40" rx="5"/>
  <text class="blue small" x="26" y="303">BGE 4</text>
  <text class="label tiny" x="26" y="317">life-value as the standard</text>
  <rect class="box" x="414" y="36" width="210" height="40" rx="5"/>
  <text class="label small bold" x="424" y="53">§§24–26</text>
  <text class="label tiny" x="424" y="67">Israel's God, five stages</text>
  <rect class="box" x="414" y="86" width="210" height="40" rx="5"/>
  <text class="label small bold" x="424" y="103">§§27–35</text>
  <text class="label tiny" x="424" y="117">the redeemer type</text>
  <rect class="box" x="414" y="136" width="210" height="40" rx="5"/>
  <text class="label small bold" x="424" y="153">§§39–47</text>
  <text class="label tiny" x="424" y="167">Paul, and §45's verses</text>
  <rect class="box" x="414" y="186" width="210" height="40" rx="5"/>
  <text class="label small bold" x="424" y="203">§15, §§48–49</text>
  <text class="label tiny" x="424" y="217">imaginary causes, Genesis</text>
  <rect class="box" x="414" y="236" width="210" height="40" rx="5"/>
  <text class="label small bold" x="424" y="253">§§2, 7, 62</text>
  <text class="label tiny" x="424" y="267">the verdicts</text>
  <rect class="box" x="414" y="286" width="210" height="40" rx="5"/>
  <text class="label small bold" x="424" y="303">§§56–57, §61</text>
  <text class="label tiny" x="424" y="317">Manu, Borgia</text>
  <path class="arrow-a" d="M226 56.0 C 320 56.0, 320 56.0, 412 56.0" marker-end="url(#ah-a)"/>
  <path class="arrow-a" d="M226 56.0 C 320 56.0, 320 156.0, 412 156.0" marker-end="url(#ah-a)"/>
  <path class="arrow-a" d="M226 56.0 C 320 56.0, 320 306.0, 412 306.0" marker-end="url(#ah-a)"/>
  <path class="arrow-a" d="M226 106.0 C 320 106.0, 320 56.0, 412 56.0" marker-end="url(#ah-a)"/>
  <path class="arrow-a" d="M226 106.0 C 320 106.0, 320 156.0, 412 156.0" marker-end="url(#ah-a)"/>
  <path class="arrow-a" d="M226 156.0 C 320 156.0, 320 56.0, 412 56.0" marker-end="url(#ah-a)"/>
  <path class="arrow-a" d="M226 156.0 C 320 156.0, 320 156.0, 412 156.0" marker-end="url(#ah-a)"/>
  <path class="arrow-b" d="M226 206.0 C 320 206.0, 320 206.0, 412 206.0" marker-end="url(#ah-b)"/>
  <path class="arrow-b" d="M226 206.0 C 320 206.0, 320 56.0, 412 56.0" marker-end="url(#ah-b)"/>
  <path class="arrow-b" d="M226 256.0 C 320 256.0, 320 106.0, 412 106.0" marker-end="url(#ah-b)"/>
  <path class="arrow-b" d="M226 306.0 C 320 306.0, 320 256.0, 412 256.0" marker-end="url(#ah-b)"/>
  <path class="arrow-b" d="M226 306.0 C 320 306.0, 320 306.0, 412 306.0" marker-end="url(#ah-b)"/>
  <path class="rule" d="M16 340 L624 340"/>
  <text class="label small" x="320" y="358" text-anchor="middle">every arrow is drawn by the text itself: §24 and §45 cite the Genealogy,</text>
  <text class="label small" x="320" y="372" text-anchor="middle">§42 names the priest, §15 names the imaginary causes</text>
  <text class="muted tiny" x="320" y="387" text-anchor="middle">amber: the three treatises' results; blue: Twilight, the Doctrine of Types and BGE 4</text>
</svg>

<svg viewBox="0 0 640 284" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tiny { font-size: 9.5px; }
    .bold { font-weight: 600; }
    .box { fill: none; stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.2; }
    .now { fill: none; stroke: #e2903a; stroke-width: 2; }
    .amberbox { fill: none; stroke: #e2903a; stroke-width: 1.8; }
    .bluebox { fill: none; stroke: #4c8dd6; stroke-width: 1.8; }
    .dashamber { fill: none; stroke: #e2903a; stroke-width: 1.6; stroke-dasharray: 5 3; }
    .ghost { fill: none; stroke: currentColor; stroke-opacity: 0.25; stroke-width: 1; stroke-dasharray: 4 3; }
    .greybox { fill: none; stroke: currentColor; stroke-opacity: 0.35; stroke-width: 1; stroke-dasharray: 4 3; }
    .arrow { stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.2; fill: none; }
    .arrow-a { stroke: #e2903a; stroke-width: 1.4; fill: none; }
    .arrow-b { stroke: #4c8dd6; stroke-width: 1.4; fill: none; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .green { fill: #5aa46a; font-weight: 600; }
    .rule { stroke: currentColor; stroke-opacity: 0.3; stroke-width: 1; }
    .row { stroke: currentColor; stroke-opacity: 0.25; stroke-width: 1; stroke-dasharray: 2 3; }
    .strike { stroke: #e2903a; stroke-width: 1.6; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor" fill-opacity="0.6"/>
    </marker>
    <marker id="ah-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#e2903a"/>
    </marker>
    <marker id="ah-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4c8dd6"/>
    </marker>
  </defs>
  <text class="muted small" x="16" y="18">Frame 4 of 4: §§39–43, from a practice to a doctrine, move 4</text>
  <rect class="box" x="16" y="34" width="144" height="104" rx="5"/>
  <text class="label small bold" x="24" y="52">1  the practice</text>
  <text class="label tiny" x="24" y="67">non-resistance, no guilt,</text>
  <text class="label tiny" x="24" y="79">blessedness now; the</text>
  <text class="label tiny" x="24" y="91">death as demonstration</text>
  <text class="label tiny" x="24" y="103">(§§33–35)</text>
  <text class="label tiny" x="24" y="115"></text>
  <path class="arrow" d="M160 86 L172 86" marker-end="url(#ah)"/>
  <rect class="box" x="172" y="34" width="144" height="104" rx="5"/>
  <text class="label small bold" x="180" y="52">2  the disciples</text>
  <text class="label tiny" x="180" y="67">'who killed him?' →</text>
  <text class="label tiny" x="180" y="79">ruling Judaism; revenge,</text>
  <text class="label tiny" x="180" y="91">retribution, judgement;</text>
  <text class="label tiny" x="180" y="103">Jesus exalted, severed</text>
  <text class="label tiny" x="180" y="115">from them (§40)</text>
  <path class="arrow" d="M316 86 L328 86" marker-end="url(#ah)"/>
  <rect class="box" x="328" y="34" width="144" height="104" rx="5"/>
  <text class="label small bold" x="336" y="52">3  the sacrifice</text>
  <text class="label tiny" x="336" y="67">'how could God have</text>
  <text class="label tiny" x="336" y="79">permitted that?' → the</text>
  <text class="label tiny" x="336" y="91">innocent for the guilty;</text>
  <text class="label tiny" x="336" y="103">resurrection, immortality</text>
  <text class="label tiny" x="336" y="115">as reward (§41)</text>
  <path class="arrow" d="M472 86 L484 86" marker-end="url(#ah)"/>
  <rect class="now" x="484" y="34" width="144" height="104" rx="5"/>
  <text class="amber small" x="492" y="52">4  Paul</text>
  <text class="label tiny" x="492" y="67">'the genius of hatred';</text>
  <text class="label tiny" x="492" y="79">the centre of gravity</text>
  <text class="label tiny" x="492" y="91">shifted beyond life;</text>
  <text class="label tiny" x="492" y="103">immortality forms herds</text>
  <text class="label tiny" x="492" y="115">(§§42–43)</text>
  <text class="muted tiny" x="24" y="158">uses:</text>
  <text class="blue tiny" x="24" y="172">the redeemer type</text>
  <text class="muted tiny" x="180" y="158">uses:</text>
  <text class="amber tiny" x="180" y="172">I:10 ressentiment; I:7's</text>
  <text class="amber tiny" x="180" y="184">revaluation; III:15's</text>
  <text class="amber tiny" x="180" y="196">premise, object still</text>
  <text class="amber tiny" x="180" y="208">outside</text>
  <text class="muted tiny" x="336" y="158">uses:</text>
  <text class="amber tiny" x="336" y="172">II:21 the debt to a god,</text>
  <text class="amber tiny" x="336" y="184">paid by the god; the</text>
  <text class="amber tiny" x="336" y="196">redirection: guilt</text>
  <text class="amber tiny" x="336" y="208">turned onto the believer</text>
  <text class="muted tiny" x="492" y="158">uses:</text>
  <text class="amber tiny" x="492" y="172">I:7 the priest seeking</text>
  <text class="amber tiny" x="492" y="184">power; III:15–18 the</text>
  <text class="amber tiny" x="492" y="196">herd</text>
  <path class="rule" d="M16 242 L624 242"/>
  <text class="label small" x="320" y="260" text-anchor="middle">changed: Paul drawn; the mechanism is the Genealogy's at every box; the record is one verse, 1 Cor 15:14</text>
  <text class="muted tiny" x="320" y="274" text-anchor="middle">tags: blue = the type of §§29–35; amber = a Genealogy result</text>
</svg>

<svg viewBox="0 0 640 362" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tiny { font-size: 9.5px; }
    .bold { font-weight: 600; }
    .box { fill: none; stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.2; }
    .now { fill: none; stroke: #e2903a; stroke-width: 2; }
    .amberbox { fill: none; stroke: #e2903a; stroke-width: 1.8; }
    .bluebox { fill: none; stroke: #4c8dd6; stroke-width: 1.8; }
    .dashamber { fill: none; stroke: #e2903a; stroke-width: 1.6; stroke-dasharray: 5 3; }
    .ghost { fill: none; stroke: currentColor; stroke-opacity: 0.25; stroke-width: 1; stroke-dasharray: 4 3; }
    .greybox { fill: none; stroke: currentColor; stroke-opacity: 0.35; stroke-width: 1; stroke-dasharray: 4 3; }
    .arrow { stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.2; fill: none; }
    .arrow-a { stroke: #e2903a; stroke-width: 1.4; fill: none; }
    .arrow-b { stroke: #4c8dd6; stroke-width: 1.4; fill: none; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .green { fill: #5aa46a; font-weight: 600; }
    .rule { stroke: currentColor; stroke-opacity: 0.3; stroke-width: 1; }
    .row { stroke: currentColor; stroke-opacity: 0.25; stroke-width: 1; stroke-dasharray: 2 3; }
    .strike { stroke: #e2903a; stroke-width: 1.6; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor" fill-opacity="0.6"/>
    </marker>
    <marker id="ah-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#e2903a"/>
    </marker>
    <marker id="ah-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4c8dd6"/>
    </marker>
  </defs>
  <text class="muted small" x="16" y="18">§§29–35: the Doctrine of Types applied to one person</text>
  <rect class="amberbox" x="140" y="30" width="360" height="46" rx="5"/>
  <text class="amber small" x="320" y="48" text-anchor="middle">the type-fact (§§29–30)</text>
  <text class="label tiny" x="320" y="63" text-anchor="middle">'morbid susceptibility of the sense of touch'; every contact felt too deeply</text>
  <path class="arrow-a" d="M250 76 L160 106" marker-end="url(#ah-a)"/>
  <path class="arrow-a" d="M390 76 L480 106" marker-end="url(#ah-a)"/>
  <rect class="bluebox" x="30" y="108" width="260" height="46" rx="5"/>
  <text class="blue small" x="160" y="126" text-anchor="middle">instinctive hatred of reality (§30)</text>
  <text class="label tiny" x="160" y="141" text-anchor="middle">flight into the 'inner', the 'ungraspable'</text>
  <rect class="bluebox" x="350" y="108" width="260" height="46" rx="5"/>
  <text class="blue small" x="480" y="126" text-anchor="middle">instinctive exclusion of all enmity (§30)</text>
  <text class="label tiny" x="480" y="141" text-anchor="middle">blessedness only in not resisting</text>
  <path class="arrow" d="M100 154 L100 172"/>
  <path class="arrow" d="M540 154 L540 172"/>
  <path class="arrow" d="M82 172 L554 172"/>
  <text class="muted tiny" x="320" y="167" text-anchor="middle">'all consequences of one instinct' (§33)</text>
  <path class="arrow" d="M82 172 L82 186" marker-end="url(#ah)"/>
  <rect class="box" x="30" y="188" width="104" height="44" rx="5"/>
  <text class="label tiny" x="82" y="206" text-anchor="middle">'resist not evil'</text>
  <text class="label tiny" x="82" y="220" text-anchor="middle">§29</text>
  <path class="arrow" d="M200 172 L200 186" marker-end="url(#ah)"/>
  <rect class="box" x="148" y="188" width="104" height="44" rx="5"/>
  <text class="label tiny" x="200" y="206" text-anchor="middle">no opposites,</text>
  <text class="label tiny" x="200" y="220" text-anchor="middle">no denial, §32</text>
  <path class="arrow" d="M318 172 L318 186" marker-end="url(#ah)"/>
  <rect class="box" x="266" y="188" width="104" height="44" rx="5"/>
  <text class="label tiny" x="318" y="206" text-anchor="middle">no guilt, no</text>
  <text class="label tiny" x="318" y="220" text-anchor="middle">punishment, §33</text>
  <path class="arrow" d="M436 172 L436 186" marker-end="url(#ah)"/>
  <rect class="box" x="384" y="188" width="104" height="44" rx="5"/>
  <text class="label tiny" x="436" y="206" text-anchor="middle">the kingdom as a</text>
  <text class="label tiny" x="436" y="220" text-anchor="middle">state of heart, §34</text>
  <path class="arrow" d="M554 172 L554 186" marker-end="url(#ah)"/>
  <rect class="box" x="502" y="188" width="104" height="44" rx="5"/>
  <text class="label tiny" x="554" y="206" text-anchor="middle">the death as</text>
  <text class="label tiny" x="554" y="220" text-anchor="middle">demonstration, §35</text>
  <rect class="greybox" x="30" y="250" width="580" height="58" rx="5"/>
  <text class="muted tiny" x="40" y="268">set aside as accretion (§31): 'the prophet, the Messiah, the judge who is to come, the moral preacher,</text>
  <text class="muted tiny" x="40" y="281">the miracle-worker', the 'aggressive fanatic', 'Second Coming', 'Last Judgement'</text>
  <text class="amber tiny" x="40" y="297">criterion for setting them aside: they do not fit the type-fact above</text>
  <path class="rule" d="M16 320 L624 320"/>
  <text class="label small" x="320" y="338" text-anchor="middle">grade tag: evidence = the Gospels read selectively; the selection criterion is the hypothesis</text>
  <text class="muted tiny" x="320" y="352" text-anchor="middle">§31's own concession: 'a peculiar multiplicity and contradictoriness … cannot be entirely excluded'</text>
</svg>

<svg viewBox="0 0 640 374" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tiny { font-size: 9.5px; }
    .bold { font-weight: 600; }
    .box { fill: none; stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.2; }
    .now { fill: none; stroke: #e2903a; stroke-width: 2; }
    .amberbox { fill: none; stroke: #e2903a; stroke-width: 1.8; }
    .bluebox { fill: none; stroke: #4c8dd6; stroke-width: 1.8; }
    .dashamber { fill: none; stroke: #e2903a; stroke-width: 1.6; stroke-dasharray: 5 3; }
    .ghost { fill: none; stroke: currentColor; stroke-opacity: 0.25; stroke-width: 1; stroke-dasharray: 4 3; }
    .greybox { fill: none; stroke: currentColor; stroke-opacity: 0.35; stroke-width: 1; stroke-dasharray: 4 3; }
    .arrow { stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.2; fill: none; }
    .arrow-a { stroke: #e2903a; stroke-width: 1.4; fill: none; }
    .arrow-b { stroke: #4c8dd6; stroke-width: 1.4; fill: none; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .green { fill: #5aa46a; font-weight: 600; }
    .rule { stroke: currentColor; stroke-opacity: 0.3; stroke-width: 1; }
    .row { stroke: currentColor; stroke-opacity: 0.25; stroke-width: 1; stroke-dasharray: 2 3; }
    .strike { stroke: #e2903a; stroke-width: 1.6; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor" fill-opacity="0.6"/>
    </marker>
    <marker id="ah-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#e2903a"/>
    </marker>
    <marker id="ah-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4c8dd6"/>
    </marker>
  </defs>
  <text class="muted small" x="16" y="18">The Antichrist graded: Genealogy source, mechanism, record, verdict</text>
  <text class="label small bold" x="16" y="36">sections</text>
  <text class="label small bold" x="112" y="36">Genealogy source</text>
  <text class="label small bold" x="250" y="36">mechanism</text>
  <text class="label small bold" x="340" y="36">record</text>
  <text class="label small bold" x="486" y="36">verdict</text>
  <path class="rule" d="M16 42 L624 42"/>
  <text class="label small bold" x="16" y="64">§§24–26</text>
  <text class="label tiny" x="112" y="64">I:7, II:19–21;</text>
  <text class="label tiny" x="112" y="76">error three</text>
  <text class="amber small" x="250" y="64">✓</text>
  <text class="muted tiny" x="340" y="64">none dated; the Bible</text>
  <text class="muted tiny" x="340" y="76">cited as its own forgery</text>
  <text class="label tiny" x="486" y="64">'falsification', on</text>
  <text class="label tiny" x="486" y="76">the §2 bridge</text>
  <path class="row" d="M16 86 L624 86"/>
  <text class="label small bold" x="16" y="104">§§27–35</text>
  <text class="label tiny" x="112" y="104">Doctrine of Types</text>
  <text class="amber small" x="250" y="104">✓</text>
  <text class="blue tiny" x="340" y="104">the Gospels, filtered</text>
  <text class="blue tiny" x="340" y="116">by the hypothesis</text>
  <text class="label tiny" x="486" y="104">none</text>
  <path class="row" d="M16 126 L624 126"/>
  <text class="label small bold" x="16" y="144">§§39–47</text>
  <text class="label tiny" x="112" y="144">III:15, I:10, I:7,</text>
  <text class="label tiny" x="112" y="156">II:21</text>
  <text class="amber small" x="250" y="144">✓</text>
  <text class="blue tiny" x="340" y="144">13 verses: two strata,</text>
  <text class="blue tiny" x="340" y="156">not their order</text>
  <text class="label tiny" x="486" y="144">'dysangel'; motives</text>
  <text class="label tiny" x="486" y="156">asserted</text>
  <path class="row" d="M16 166 L624 166"/>
  <text class="label small bold" x="16" y="184">§15, §§48–49</text>
  <text class="label tiny" x="112" y="184">errors three</text>
  <text class="label tiny" x="112" y="196">and four</text>
  <text class="amber small" x="250" y="184">✓ general</text>
  <text class="muted tiny" x="340" y="184">none; Genesis read</text>
  <text class="muted tiny" x="340" y="196">by fiat</text>
  <text class="label tiny" x="486" y="184">'crime against</text>
  <text class="label tiny" x="486" y="196">humanity'</text>
  <path class="row" d="M16 206 L624 206"/>
  <text class="label small bold" x="16" y="224">§§2, 7, 62</text>
  <text class="label tiny" x="112" y="224">BGE 4's standard</text>
  <text class="muted small" x="250" y="224">–</text>
  <text class="blue tiny" x="340" y="224">physiological claims,</text>
  <text class="blue tiny" x="340" y="236">one testable</text>
  <text class="label tiny" x="486" y="224">bridge unstated,</text>
  <text class="label tiny" x="486" y="236">three times</text>
  <path class="row" d="M16 246 L624 246"/>
  <text class="label small bold" x="16" y="264">§§56–57</text>
  <text class="label tiny" x="112" y="264">none: the holy lie</text>
  <text class="label tiny" x="112" y="276">is a thesis about all codes</text>
  <text class="muted small" x="250" y="264">–</text>
  <text class="muted tiny" x="340" y="264">two quotations, against</text>
  <text class="muted tiny" x="340" y="276">the author's Improvers §3</text>
  <text class="label tiny" x="486" y="264">a ranking, on the</text>
  <text class="label tiny" x="486" y="276">§2 bridge</text>
  <path class="row" d="M16 286 L624 286"/>
  <text class="label small bold" x="16" y="304">§61</text>
  <text class="label tiny" x="112" y="304">I:7 on Luther only;</text>
  <text class="label tiny" x="112" y="316">none on the counterfactual</text>
  <text class="muted small" x="250" y="304">–</text>
  <text class="muted tiny" x="340" y="304">none</text>
  <text class="label tiny" x="486" y="304">a counterfactual:</text>
  <text class="label tiny" x="486" y="316">'would have been abolished'</text>
  <path class="rule" d="M16 332 L624 332"/>
  <text class="label small" x="320" y="350" text-anchor="middle">mechanism present at four rows of seven and partial at a fifth; a full documented record at none; a verdict without its bridge at five</text>
  <text class="muted tiny" x="320" y="364" text-anchor="middle">amber = a Genealogy result in use; blue = a partial record, checkable; grey = absent</text>
</svg>

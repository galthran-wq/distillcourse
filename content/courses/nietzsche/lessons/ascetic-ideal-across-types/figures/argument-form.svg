<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .box { fill: none; stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.3; }
    .box-b { fill: none; stroke: #4c8dd6; stroke-width: 1.8; }
    .box-a { fill: none; stroke: #e2903a; stroke-width: 1.8; stroke-dasharray: 4 3; }
    .link { stroke: currentColor; stroke-opacity: 0.7; stroke-width: 1.6; fill: none; }
    .rule { stroke: currentColor; stroke-opacity: 0.3; stroke-width: 1; }
  </style>
  <text class="muted small" x="16" y="18">GM III:6, the argument-form: a reported absence of will read as a will with another object</text>

  <rect class="box" x="16" y="30" width="190" height="46" rx="5"/>
  <text class="label small" x="111" y="48" text-anchor="middle">1. witness W reports effect E</text>
  <text class="muted small" x="111" y="63" text-anchor="middle">and infers E is the essence</text>
  <path class="link" d="M 206 53 L 224 53"/>
  <path class="link" d="M 218 48 L 224 53 L 218 58"/>
  <rect class="box" x="226" y="30" width="190" height="46" rx="5"/>
  <text class="label small" x="321" y="48" text-anchor="middle">2. find in W's type a drive D</text>
  <text class="muted small" x="321" y="63" text-anchor="middle">that E relieves</text>
  <path class="link" d="M 416 53 L 434 53"/>
  <path class="link" d="M 428 48 L 434 53 L 428 58"/>
  <rect class="box" x="436" y="30" width="188" height="46" rx="5"/>
  <text class="label small" x="530" y="48" text-anchor="middle">3. E is D's satisfaction</text>
  <text class="muted small" x="530" y="63" text-anchor="middle">in disguise; the report is about D</text>

  <path class="rule" d="M 16 92 L 624 92"/>

  <text class="blue" x="111" y="112" text-anchor="middle">Schopenhauer (§6)</text>
  <rect class="box-b" x="16" y="120" width="190" height="180" rx="5"/>
  <text class="muted small" x="26" y="140">W reports:</text>
  <text class="label small" x="26" y="155">the will stilled, "the wheel</text>
  <text class="label small" x="26" y="169">of Ixion stands still"</text>
  <text class="muted small" x="26" y="193">D in the type:</text>
  <text class="label small" x="26" y="208">a sexuality "treated as a</text>
  <text class="label small" x="26" y="222">personal enemy" (§7)</text>
  <text class="muted small" x="26" y="246">result:</text>
  <text class="label small" x="26" y="261">will-lessness is "the victim of</text>
  <text class="label small" x="26" y="275">torture who escapes from his</text>
  <text class="label small" x="26" y="289">torture": a will's relief</text>

  <text class="label" x="321" y="112" text-anchor="middle">the lambs (GM I:13)</text>
  <rect class="box" x="226" y="120" width="190" height="180" rx="5"/>
  <text class="muted small" x="236" y="140">W reports:</text>
  <text class="label small" x="236" y="155">"we are good": we do</text>
  <text class="label small" x="236" y="169">not retaliate</text>
  <text class="muted small" x="236" y="193">D in the type:</text>
  <text class="label small" x="236" y="208">an impotence that cannot</text>
  <text class="label small" x="236" y="222">retaliate</text>
  <text class="muted small" x="236" y="246">result:</text>
  <text class="label small" x="236" y="261">the professed freedom from</text>
  <text class="label small" x="236" y="275">a drive is that drive's</text>
  <text class="label small" x="236" y="289">disguise</text>

  <text class="amber" x="530" y="112" text-anchor="middle">Stendhal, and Nietzsche's side</text>
  <rect class="box-a" x="436" y="120" width="188" height="180" rx="5"/>
  <text class="muted small" x="446" y="140">W reports:</text>
  <text class="label small" x="446" y="155">the will aroused, "a promise</text>
  <text class="label small" x="446" y="169">of happiness"; §6 prefers it</text>
  <text class="muted small" x="446" y="193">D in the type:</text>
  <text class="amber" x="446" y="210" font-size="16">?</text>
  <text class="muted small" x="446" y="246">result:</text>
  <text class="amber" x="446" y="263" font-size="16">?</text>

  <text class="muted small" x="320" y="320" text-anchor="middle">the third exercise fills the amber column; what it shows is that the form runs on the unmasker too</text>
</svg>

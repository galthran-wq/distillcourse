<svg viewBox="0 0 640 316" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .box { fill: none; stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.3; }
    .box-a { fill: none; stroke: #e2903a; stroke-width: 1.8; }
    .box-b { fill: none; stroke: #4c8dd6; stroke-width: 1.8; }
    .link { stroke: currentColor; stroke-opacity: 0.7; stroke-width: 1.6; fill: none; }
    .link-a { stroke: #e2903a; stroke-width: 1.8; fill: none; }
    .rule { stroke: currentColor; stroke-opacity: 0.3; stroke-width: 1; }
  </style>
  <text class="muted small" x="16" y="18">GM III:2–5: the chain along which the artist's ideal arrives</text>

  <rect class="box-b" x="16" y="40" width="186" height="110" rx="6"/>
  <text class="blue" x="109" y="62" text-anchor="middle">Schopenhauer</text>
  <text class="muted small" x="109" y="80" text-anchor="middle">World as Will and</text>
  <text class="muted small" x="109" y="94" text-anchor="middle">Representation (1819):</text>
  <text class="muted small" x="109" y="108" text-anchor="middle">music as "the language</text>
  <text class="muted small" x="109" y="122" text-anchor="middle">of the will itself"; chastity</text>
  <text class="muted small" x="109" y="136" text-anchor="middle">as the will's first denial</text>

  <path class="link-a" d="M 202 95 L 224 95"/>
  <path class="link-a" d="M 218 90 L 224 95 L 218 100"/>
  <text class="amber small" x="213" y="168" text-anchor="middle">valet (§5)</text>
  <text class="muted small" x="213" y="182" text-anchor="middle">"his covering man</text>
  <text class="muted small" x="213" y="196" text-anchor="middle">in front, his rampart"</text>

  <rect class="box" x="227" y="40" width="186" height="110" rx="6"/>
  <text class="label" x="320" y="62" text-anchor="middle">Wagner, after 1854</text>
  <text class="muted small" x="320" y="80" text-anchor="middle">Opera and Drama (1851):</text>
  <text class="muted small" x="320" y="94" text-anchor="middle">music the drama's "woman"</text>
  <text class="muted small" x="320" y="108" text-anchor="middle">the writings from 1870: music</text>
  <text class="muted small" x="320" y="122" text-anchor="middle">sovereign, the musician "a</text>
  <text class="muted small" x="320" y="136" text-anchor="middle">telephone from the beyond"</text>

  <path class="link" d="M 413 95 L 435 95"/>
  <path class="link" d="M 429 90 L 435 95 L 429 100"/>
  <text class="label small" x="424" y="168" text-anchor="middle">set to music and</text>
  <text class="muted small" x="424" y="182" text-anchor="middle">"placed on the</text>
  <text class="muted small" x="424" y="196" text-anchor="middle">stage" (§2)</text>

  <rect class="box-a" x="438" y="40" width="186" height="110" rx="6"/>
  <text class="amber" x="531" y="62" text-anchor="middle">Parsifal (1882)</text>
  <text class="muted small" x="531" y="80" text-anchor="middle">a homage to chastity,</text>
  <text class="muted small" x="531" y="94" text-anchor="middle">for the first time "in an</text>
  <text class="muted small" x="531" y="108" text-anchor="middle">ascetic sense" (§2);</text>
  <text class="muted small" x="531" y="122" text-anchor="middle">"the blood of the</text>
  <text class="muted small" x="531" y="136" text-anchor="middle">Redeemer" invoked (§3)</text>

  <path class="rule" d="M 16 216 L 624 216"/>
  <text class="label small" x="320" y="236" text-anchor="middle">what the work records (§§4–5): its author's need for "an already constituted authority"</text>
  <text class="muted small" x="320" y="252" text-anchor="middle">the artist is "the womb, the soil, in certain cases the dung and manure" of the work (§4):</text>
  <text class="muted small" x="320" y="266" text-anchor="middle">the work is evidence about the type, and about nothing else</text>
  <path class="rule" d="M 16 282 L 624 282"/>
  <text class="muted small" x="320" y="302" text-anchor="middle">Nietzsche's own two positions on the chain: the Bayreuth appeal of October 1873 · The Case of Wagner, 1888</text>
</svg>

<svg viewBox="0 0 640 336" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .shell { fill: none; stroke: #4c8dd6; stroke-width: 2; }
    .box-a { fill: none; stroke: #e2903a; stroke-width: 1.8; }
    .guide { stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.2; fill: none; stroke-dasharray: 3 3; }
    .rule { stroke: currentColor; stroke-opacity: 0.3; stroke-width: 1; }
  </style>
  <text class="muted small" x="16" y="18">GM III:9–10: the caterpillar form (Raupenform) in which alone philosophy could live</text>

  <ellipse class="shell" cx="230" cy="152" rx="206" ry="104"/>
  <text class="blue" x="230" y="76" text-anchor="middle">the ascetic priest's form</text>
  <text class="muted small" x="230" y="92" text-anchor="middle">"world-denying, hostile to life,</text>
  <text class="muted small" x="230" y="105" text-anchor="middle">suspicious of the senses" (§10)</text>

  <rect class="box-a" x="120" y="114" width="220" height="82" rx="6"/>
  <text class="amber" x="230" y="134" text-anchor="middle">the philosophic spirit</text>
  <text class="muted small" x="230" y="151" text-anchor="middle">doubt, denial, suspension, analysis,</text>
  <text class="muted small" x="230" y="165" text-anchor="middle">comparison, "sine ira et studio" (§9):</text>
  <text class="muted small" x="230" y="179" text-anchor="middle">tendencies once "counter to morality"</text>

  <text class="muted small" x="230" y="218" text-anchor="middle">"to be a philosopher he had to represent the ideal;</text>
  <text class="muted small" x="230" y="232" text-anchor="middle">to represent it, he had to believe in it" (§10)</text>

  <path class="guide" d="M 438 152 L 500 152"/>
  <path class="guide" d="M 494 147 L 500 152 L 494 157"/>
  <text class="label" x="562" y="142" text-anchor="middle">"Has all that</text>
  <text class="label" x="562" y="158" text-anchor="middle">really changed?"</text>
  <text class="muted small" x="562" y="176" text-anchor="middle">§10's closing question:</text>
  <text class="muted small" x="562" y="190" text-anchor="middle">has the winged thing</text>
  <text class="muted small" x="562" y="204" text-anchor="middle">escaped? left open</text>

  <path class="rule" d="M 16 270 L 624 270"/>
  <text class="label small" x="320" y="290" text-anchor="middle">§9: philosophy "learnt to take its first steps" on the leading-strings of this ideal</text>
  <text class="muted small" x="320" y="306" text-anchor="middle">§10: the earliest contemplatives had to make themselves feared, by "cruelty to themselves";</text>
  <text class="muted small" x="320" y="322" text-anchor="middle">an "ascetic self-misunderstanding" was the price of existing at all</text>
</svg>

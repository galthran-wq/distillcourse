<svg viewBox="0 0 640 390" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .col-a { fill: none; stroke: #e2903a; stroke-width: 1.8; }
    .col-b { fill: none; stroke: #4c8dd6; stroke-width: 1.8; }
    .rule { stroke: currentColor; stroke-opacity: 0.3; stroke-width: 1; }
    .box-x { fill: none; stroke: currentColor; stroke-opacity: 0.4; stroke-width: 1.2; stroke-dasharray: 4 3; }
  </style>
  <text class="muted small" x="16" y="18">GM III:7–10: two readings, by what each asserts and what each has to explain away</text>

  <text class="amber" x="290" y="44" text-anchor="middle">Clark (1990)</text>
  <text class="blue" x="510" y="44" text-anchor="middle">Nehamas (1985)</text>
  <rect class="col-a" x="180" y="52" width="216" height="252" rx="5"/>
  <rect class="col-b" x="404" y="52" width="220" height="252" rx="5"/>

  <text class="label small" x="16" y="72">the §§7–8 distinction</text>
  <text class="muted small" x="16" y="86">philosopher's vs priest's ideal</text>
  <text class="label small" x="190" y="72">"largely apparent": the philosopher</text>
  <text class="label small" x="190" y="86">is an instance of the priest</text>
  <text class="label small" x="414" y="72">real: a nonmoral asceticism that "does</text>
  <text class="label small" x="414" y="86">not condemn the pleasures it avoids"</text>
  <path class="rule" d="M 16 98 L 624 98"/>

  <text class="label small" x="16" y="118">§10, "he had to believe in it"</text>
  <text class="label small" x="190" y="118">every philosopher there has been</text>
  <text class="label small" x="190" y="132">held the priest's valuation</text>
  <text class="label small" x="414" y="118">a concession: priestly asceticism was</text>
  <text class="label small" x="414" y="132">"more than a caterpillar form"</text>
  <path class="rule" d="M 16 146 L 624 146"/>

  <text class="label small" x="16" y="166">what Nietzsche opposes</text>
  <text class="label small" x="190" y="166">the priest's valuation of natural</text>
  <text class="label small" x="190" y="180">existence, wherever it is held</text>
  <text class="label small" x="414" y="166">the demand that others accept the</text>
  <text class="label small" x="414" y="180">ideal, not the ideal: one life among others</text>
  <path class="rule" d="M 16 194 L 624 194"/>

  <text class="label small" x="16" y="214">must explain away</text>
  <text class="label small" x="190" y="214">the approving tone of §§7–8</text>
  <text class="muted small" x="190" y="228">answer: they describe the philosopher</text>
  <text class="muted small" x="190" y="242">of the future (BGE 44), not any yet</text>
  <text class="label small" x="414" y="214">§10's "had to believe"</text>
  <text class="muted small" x="414" y="228">answer: the type-claim "pertains to</text>
  <text class="muted small" x="414" y="242">the type" is overstated</text>
  <path class="rule" d="M 16 256 L 624 256"/>

  <text class="label small" x="16" y="276">§§11–22 and §§23–27</text>
  <text class="label small" x="190" y="276">the device used twice: the reader's</text>
  <text class="label small" x="190" y="290">will to truth is inside the region</text>
  <text class="label small" x="414" y="276">the Genealogy an interpretation that</text>
  <text class="label small" x="414" y="290">"masters" the ideal, not a truth-claim</text>

  <rect class="box-x" x="16" y="318" width="608" height="60" rx="5"/>
  <text class="label small" x="320" y="336" text-anchor="middle">what the text decides: §§7–8 describe an asceticism that is not ascetic in §1's sense,</text>
  <text class="label small" x="320" y="351" text-anchor="middle">and §10 says no existing philosopher has held it;</text>
  <text class="muted small" x="320" y="368" text-anchor="middle">the two are consistent only for a philosopher who does not yet exist, which is the question §10 asked</text>
</svg>

<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .head { fill: currentColor; opacity: 0.55; font-size: 10.5px; letter-spacing: 0.04em; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .row { fill: none; stroke: currentColor; stroke-opacity: 0.25; stroke-width: 1; }
    .row-a { fill: none; stroke: #e2903a; stroke-width: 1.8; }
    .row-b { fill: none; stroke: #4c8dd6; stroke-width: 1.8; }
    .rule { stroke: currentColor; stroke-opacity: 0.3; stroke-width: 1; }
  </style>
  <text class="muted small" x="16" y="18">One phrase, "without interest", in five hands</text>
  <text class="head" x="24" y="44">WHO</text>
  <text class="head" x="120" y="44">THE THESIS</text>
  <text class="head" x="508" y="44">TEXT</text>
  <path class="rule" d="M 16 52 L 624 52"/>

  <rect class="row" x="16" y="60" width="608" height="60" rx="5"/>
  <text class="label" x="24" y="86">Kant</text>
  <text class="label small" x="120" y="78">the beautiful is what pleases without any interest:</text>
  <text class="muted small" x="120" y="93">interest, delight bound to the object's existence,</text>
  <text class="muted small" x="120" y="108">is excluded from the ground of the judgment</text>
  <text class="muted small" x="508" y="86">Critique of Judgment</text>
  <text class="muted small" x="508" y="100">§§2–5 (1790)</text>

  <rect class="row-b" x="16" y="128" width="608" height="60" rx="5"/>
  <text class="blue" x="24" y="154">Schopenhauer</text>
  <text class="label small" x="120" y="146">"without interest" read as will-less: contemplation</text>
  <text class="muted small" x="120" y="161">stills the will, "the wheel of Ixion stands still";</text>
  <text class="muted small" x="120" y="176">chastity the first step in the will's denial</text>
  <text class="muted small" x="508" y="154">World as Will and</text>
  <text class="muted small" x="508" y="168">Representation I §38, §68</text>

  <rect class="row" x="16" y="196" width="608" height="60" rx="5"/>
  <text class="label" x="24" y="222">Stendhal</text>
  <text class="label small" x="120" y="214">"beauty is a promise of happiness":</text>
  <text class="muted small" x="120" y="229">the beautiful arouses the will, reported by</text>
  <text class="muted small" x="120" y="244">"a real spectator and artist"</text>
  <text class="muted small" x="508" y="222">De l'amour (1822)</text>

  <rect class="row-a" x="16" y="264" width="608" height="60" rx="5"/>
  <text class="amber" x="24" y="290">Nietzsche</text>
  <text class="label small" x="120" y="282">sides with Stendhal; Schopenhauer's will-lessness</text>
  <text class="muted small" x="120" y="297">is itself an interest, "that of the victim of torture</text>
  <text class="muted small" x="120" y="312">who escapes from his torture"</text>
  <text class="muted small" x="508" y="290">GM III:6 (1887)</text>

  <rect class="row" x="16" y="332" width="608" height="60" rx="5"/>
  <text class="label" x="24" y="358">Heidegger</text>
  <text class="label small" x="120" y="350">"without interest" is unconstrained favouring, not</text>
  <text class="muted small" x="120" y="365">indifference; Schopenhauer misread it as the will "put</text>
  <text class="muted small" x="120" y="380">out of commission"; Nietzsche attacked that Kant</text>
  <text class="muted small" x="508" y="358">Nietzsche I §15</text>
  <text class="muted small" x="508" y="372">(lectures 1936–37)</text>
</svg>

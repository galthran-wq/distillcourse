<svg viewBox="0 0 640 440" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .box { fill: none; stroke: currentColor; stroke-opacity: 0.45; stroke-width: 1.2; }
    .box-a { fill: none; stroke: #e2903a; stroke-width: 1.8; }
    .box-b { fill: none; stroke: #4c8dd6; stroke-width: 1.8; }
    .spoke { stroke: currentColor; stroke-opacity: 0.4; stroke-width: 1.2; fill: none; }
    .spoke-a { stroke: #e2903a; stroke-width: 1.6; fill: none; }
    .spoke-b { stroke: #4c8dd6; stroke-width: 1.6; fill: none; }
    .hub { fill: none; stroke: currentColor; stroke-width: 1.6; }
    .rule { stroke: currentColor; stroke-opacity: 0.3; stroke-width: 1; }
  </style>
  <text class="muted small" x="16" y="18">GM III:1: one ideal, six bearers, six meanings (with the sections that take each up)</text>

  <path class="spoke-a" d="M 278 172 L 210 100"/>
  <path class="spoke-a" d="M 362 172 L 430 100"/>
  <path class="spoke" d="M 262 212 L 220 212"/>
  <path class="spoke-b" d="M 378 212 L 420 212"/>
  <path class="spoke" d="M 278 252 L 210 324"/>
  <path class="spoke-b" d="M 362 252 L 430 324"/>

  <circle class="hub" cx="320" cy="212" r="58"/>
  <text class="label" x="320" y="206" text-anchor="middle">the ascetic ideal</text>
  <text class="muted small" x="320" y="222" text-anchor="middle">one structure,</text>
  <text class="muted small" x="320" y="235" text-anchor="middle">six uses</text>

  <rect class="box-a" x="16" y="34" width="204" height="70" rx="6"/>
  <text class="amber" x="118" y="53" text-anchor="middle">artists</text>
  <text class="label small" x="118" y="69" text-anchor="middle">"nothing, or too many things"</text>
  <text class="muted small" x="118" y="90" text-anchor="middle">§§2–5 (Wagner)</text>

  <rect class="box-a" x="420" y="34" width="204" height="70" rx="6"/>
  <text class="amber" x="522" y="53" text-anchor="middle">philosophers and scholars</text>
  <text class="label small" x="522" y="69" text-anchor="middle">an instinct for the conditions</text>
  <text class="label small" x="522" y="82" text-anchor="middle">of high spirituality</text>
  <text class="muted small" x="522" y="97" text-anchor="middle">§§6–10 (Schopenhauer)</text>

  <rect class="box" x="16" y="177" width="204" height="70" rx="6"/>
  <text class="label" x="118" y="196" text-anchor="middle">women</text>
  <text class="label small" x="118" y="212" text-anchor="middle">"one more charm"</text>
  <text class="muted small" x="118" y="233" text-anchor="middle">never taken up</text>

  <rect class="box-b" x="420" y="177" width="204" height="70" rx="6"/>
  <text class="blue" x="522" y="196" text-anchor="middle">the physiologically failed</text>
  <text class="label small" x="522" y="212" text-anchor="middle">"the majority": a way to seem</text>
  <text class="label small" x="522" y="225" text-anchor="middle">"too good" for this world</text>
  <text class="muted small" x="522" y="240" text-anchor="middle">§§11–22 (the priest's flock)</text>

  <rect class="box" x="16" y="320" width="204" height="70" rx="6"/>
  <text class="label" x="118" y="339" text-anchor="middle">saints</text>
  <text class="label small" x="118" y="355" text-anchor="middle">"a pretext for hibernation",</text>
  <text class="label small" x="118" y="368" text-anchor="middle">rest in nothingness</text>
  <text class="muted small" x="118" y="383" text-anchor="middle">never taken up</text>

  <rect class="box-b" x="420" y="320" width="204" height="70" rx="6"/>
  <text class="blue" x="522" y="339" text-anchor="middle">priests</text>
  <text class="label small" x="522" y="355" text-anchor="middle">"their best instrument of power"</text>
  <text class="muted small" x="522" y="376" text-anchor="middle">§§11–22 (next lesson)</text>

  <path class="rule" d="M 16 406 L 624 406"/>
  <text class="muted small" x="320" y="424" text-anchor="middle">common to all six: the will "needs a goal" and "would rather will nothingness than not will" (§1, §28)</text>
</svg>

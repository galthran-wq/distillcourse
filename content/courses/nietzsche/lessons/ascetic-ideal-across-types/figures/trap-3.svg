<svg viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .path { stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.4; fill: none; }
    .tick { stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.2; }
    .reader { fill: #e2903a; }
    .box-a { fill: none; stroke: #e2903a; stroke-width: 1.8; }
    .box-b { fill: none; stroke: #4c8dd6; stroke-width: 1.8; }
    .box { fill: none; stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.3; }
    .ghost { fill: none; stroke: currentColor; stroke-opacity: 0.35; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .region { fill: none; stroke: #4c8dd6; stroke-width: 1.6; stroke-dasharray: 6 4; }
    .rule { stroke: currentColor; stroke-opacity: 0.3; stroke-width: 1; }
  </style>
  <text class="muted small" x="16" y="18">Frame 3 of 3: the reader at §27</text>

  <path class="path" d="M 40 50 L 600 50"/>
  <line class="tick" x1="60" y1="44" x2="60" y2="56"/>
  <text class="muted small" x="60" y="70" text-anchor="middle">§1</text>
  <line class="tick" x1="200" y1="44" x2="200" y2="56"/>
  <text class="muted small" x="200" y="70" text-anchor="middle">§8</text>
  <line class="tick" x1="330" y1="44" x2="330" y2="56"/>
  <text class="muted small" x="330" y="70" text-anchor="middle">§11</text>
  <line class="tick" x1="470" y1="44" x2="470" y2="56"/>
  <text class="muted small" x="470" y="70" text-anchor="middle">§23</text>
  <line class="tick" x1="520" y1="44" x2="520" y2="56"/>
  <text class="muted small" x="520" y="70" text-anchor="middle">§27</text>
  <line class="tick" x1="590" y1="44" x2="590" y2="56"/>
  <text class="muted small" x="590" y="70" text-anchor="middle">§28</text>
  <circle class="reader" cx="520" cy="50" r="5"/>
  <text class="amber small" x="520" y="36" text-anchor="middle">reader</text>

  <rect class="region" x="330" y="90" width="294" height="230" rx="8"/>
  <text class="blue" x="477" y="108" text-anchor="middle">the priest's ideal</text>
  <rect class="box-b" x="345" y="118" width="264" height="52" rx="6"/>
  <text class="label small" x="477" y="138" text-anchor="middle">the ascetic priest: the ideal as "their best</text>
  <text class="label small" x="477" y="153" text-anchor="middle">instrument of power" (§1); life-denying</text>

  <rect class="ghost" x="16" y="180" width="280" height="64" rx="6"/>
  <text class="muted small" x="156" y="206" text-anchor="middle">where §8 left the philosopher</text>
  <text class="muted small" x="156" y="222" text-anchor="middle">moved by §10: the priest's "caterpillar form,</text>
  <text class="muted small" x="156" y="236" text-anchor="middle">in which alone philosophy could live"</text>

  <rect class="box-a" x="345" y="180" width="264" height="64" rx="6"/>
  <text class="amber" x="477" y="200" text-anchor="middle">the philosopher's asceticism</text>
  <text class="label small" x="477" y="217" text-anchor="middle">its world-denial is the priest's costume;</text>
  <text class="label small" x="477" y="232" text-anchor="middle">"an ascetic self-misunderstanding" (§10)</text>

  <rect class="box" x="345" y="254" width="264" height="56" rx="6"/>
  <text class="label" x="477" y="274" text-anchor="middle">science and the will to truth</text>
  <text class="label small" x="477" y="291" text-anchor="middle">"the latest and noblest form" of the ideal (§§23–27)</text>
  <text class="muted small" x="477" y="304" text-anchor="middle">including the Genealogy's own will to truth</text>

  <path class="rule" d="M 16 336 L 624 336"/>
  <text class="label small" x="320" y="356" text-anchor="middle">belief at §27: the ideal's "opponents" are its latest form; the reader's will to truth is inside the region</text>
  <text class="muted small" x="320" y="371" text-anchor="middle">what §8 invited the reader to approve, §27 turns on the reader</text>
</svg>

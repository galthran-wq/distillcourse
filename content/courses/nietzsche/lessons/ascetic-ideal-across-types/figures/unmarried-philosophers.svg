<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .amber { fill: #e2903a; font-weight: 600; }
    .box { fill: none; stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.3; }
    .box-a { fill: none; stroke: #e2903a; stroke-width: 1.8; }
    .box-x { fill: none; stroke: currentColor; stroke-opacity: 0.4; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .link { stroke: currentColor; stroke-opacity: 0.7; stroke-width: 1.6; fill: none; }
    .rule { stroke: currentColor; stroke-opacity: 0.3; stroke-width: 1; }
  </style>
  <text class="muted small" x="16" y="18">GM III:7–8: the philosopher's type reads the ideal as its own optimum</text>

  <text class="muted small" x="16" y="44">§7: "which great philosophers have been married?"</text>
  <rect class="box" x="16" y="52" width="80" height="34" rx="5"/>
  <text class="label small" x="56" y="73" text-anchor="middle">Heraclitus</text>
  <rect class="box" x="103" y="52" width="80" height="34" rx="5"/>
  <text class="label small" x="143" y="73" text-anchor="middle">Plato</text>
  <rect class="box" x="190" y="52" width="80" height="34" rx="5"/>
  <text class="label small" x="230" y="73" text-anchor="middle">Descartes</text>
  <rect class="box" x="277" y="52" width="80" height="34" rx="5"/>
  <text class="label small" x="317" y="73" text-anchor="middle">Spinoza</text>
  <rect class="box" x="364" y="52" width="80" height="34" rx="5"/>
  <text class="label small" x="404" y="73" text-anchor="middle">Leibniz</text>
  <rect class="box" x="451" y="52" width="80" height="34" rx="5"/>
  <text class="label small" x="491" y="73" text-anchor="middle">Kant</text>
  <rect class="box" x="538" y="52" width="86" height="34" rx="5"/>
  <text class="label small" x="581" y="73" text-anchor="middle">Schopenhauer</text>
  <text class="muted small" x="16" y="104">seven, unmarried, "and one cannot imagine them married"; the exception, Socrates, married "ironically"</text>

  <rect class="box-x" x="16" y="118" width="608" height="40" rx="5"/>
  <text class="label small" x="320" y="135" text-anchor="middle">the Buddha, at his son's birth: "Râhula has been born to me, a fetter has been forged for me"</text>
  <text class="muted small" x="320" y="150" text-anchor="middle">"every philosopher would say" the same: marriage as "a hindrance on the way to the optimum" (§7)</text>

  <path class="link" d="M 320 158 L 320 178"/>
  <path class="link" d="M 315 172 L 320 178 L 325 172"/>

  <text class="muted small" x="16" y="196">§8: the ideal's "three great shining words", found "to a certain degree" in every great fruitful spirit</text>
  <rect class="box-a" x="16" y="206" width="192" height="54" rx="5"/>
  <text class="amber" x="112" y="224" text-anchor="middle">poverty</text>
  <text class="muted small" x="112" y="239" text-anchor="middle">freedom from business,</text>
  <text class="muted small" x="112" y="252" text-anchor="middle">cares, possessions</text>
  <rect class="box-a" x="224" y="206" width="192" height="54" rx="5"/>
  <text class="amber" x="320" y="224" text-anchor="middle">humility</text>
  <text class="muted small" x="320" y="239" text-anchor="middle">obscurity: no fame, princes,</text>
  <text class="muted small" x="320" y="252" text-anchor="middle">"daylight"</text>
  <rect class="box-a" x="432" y="206" width="192" height="54" rx="5"/>
  <text class="amber" x="528" y="224" text-anchor="middle">chastity</text>
  <text class="muted small" x="528" y="239" text-anchor="middle">"as an athlete abstains":</text>
  <text class="muted small" x="528" y="252" text-anchor="middle">the dominant instinct's will</text>

  <path class="rule" d="M 16 278 L 624 278"/>
  <text class="label small" x="320" y="298" text-anchor="middle">read by the type as "the most essential and natural conditions of their best existence"</text>
  <text class="muted small" x="320" y="314" text-anchor="middle">"not one iota of virtue in all this": a type's optimum of power, not a valuation of self-denial (§8)</text>
  <text class="muted small" x="320" y="330" text-anchor="middle">so the type is no "uncorrupted witness and judge of the value of the ascetic ideal" (§8)</text>
</svg>

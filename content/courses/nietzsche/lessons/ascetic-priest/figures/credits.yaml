images:
  - file: flagellants-tournai-1349.jpg
    title: "The flagellants at Doornik (Tournai) in 1349 — the miniature of the procession of 15 August 1349, from Gilles li Muisis's chronicle"
    credit: "Pierart dou Tielt (fl. 1340–1360), miniature in Gilles li Muisis (Aegidius li Muisis), 'Tractatus quartus', Tournai c. 1353, fol. 16v, KBR / Royal Library of Belgium, Brussels, MS 13076–77; reproduced as a colour plate in H. F. Helmolt (ed.), 'The History of the World', vol. VII (New York: Dodd, Mead, 1902), plate between pp. 178 and 179, printed by the Bibliographisches Institut, Leipzig, after Paul Fredericq, 'De secten der Geeselaars en der Dansers in de Nederlanden tijdens de 14de eeuw'"
    source_url: "https://commons.wikimedia.org/wiki/File:The_flagellants_at_Doornik_in_1349.jpg"
    license: "Public domain (Commons file page: PD-US and PD-old, and it records that no attribution is required — the miniature is c. 1353 and the colour plate reproducing it was published in 1902, well before 1 January 1931)"
    retrieved: "2026-09-06"
    located: "Wikimedia Commons File:The_flagellants_at_Doornik_in_1349.jpg — the whole 1902 plate at its native 4544 × 2972. Beneath the framed miniature the same plate prints four lines of the chronicle in Gothic script, beginning 'Accidit anno predicto quod in die assumptionis virginis gloriose venerunt a vill brugensi circiter CC homines': about two hundred men came from Bruges on 15 August 1349, performed in the market place the rite they called penance, and the townspeople, who had never seen such a thing, began to do it too"
    modifications: "cropped to the framed miniature — 3548 × 2000 at +432+300 of the 4544 × 2972 plate — which cuts away the cream page margin, the gold ivy sprays outside the frame, and the four lines of Latin chronicle text printed below; then downscaled to 2400 × 1353, re-encoded to JPEG and metadata stripped. Nothing inside the frame is altered: every figure, scourge, red cap-cross and border band stands as printed"
    background: none

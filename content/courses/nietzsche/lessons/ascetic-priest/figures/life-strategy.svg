<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .axis { stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.2; fill: none; }
    .decline { stroke: #4c8dd6; stroke-width: 2.4; fill: none; }
    .plateau { stroke: #e2903a; stroke-width: 2.4; fill: none; }
    .ghost { stroke: #4c8dd6; stroke-width: 1.4; fill: none; stroke-dasharray: 4 3; opacity: 0.6; }
    .floor { stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1; stroke-dasharray: 3 3; }
    .marker { stroke: #e2903a; stroke-width: 1.6; stroke-dasharray: 5 3; }
    .rule { stroke: currentColor; stroke-opacity: 0.3; stroke-width: 1; }
  </style>
  <text class="muted small" x="16" y="18">GM III:13: the ascetic ideal as a device of a declining life against its own decline</text>

  <path class="axis" d="M 60 44 L 60 262 L 600 262"/>
  <text class="muted small" x="64" y="52">the feeling of life; the will</text>
  <text class="muted small" x="596" y="278" text-anchor="end">time</text>

  <path class="floor" d="M 60 236 L 600 236"/>
  <text class="muted small" x="64" y="250">the end: "the wish for the 'end'" (§13), "suicidal nihilism" (§28)</text>

  <path class="decline" d="M 62 70 C 150 90, 230 130, 330 200"/>
  <text class="blue" x="150" y="86">a declining life</text>
  <text class="label small" x="150" y="100">"partial physiological depression</text>
  <text class="label small" x="150" y="113">and exhaustion" (§13)</text>

  <path class="ghost" d="M 330 200 C 360 222, 380 234, 400 236"/>
  <text class="muted small" x="404" y="250">without the ideal, the fall completes</text>

  <line class="marker" x1="330" y1="60" x2="330" y2="262"/>
  <text class="amber" x="336" y="68">the ascetic ideal</text>
  <text class="label small" x="336" y="82">"a Kunstgriff in the preservation of life"</text>

  <path class="plateau" d="M 330 200 C 380 200, 450 196, 596 196"/>
  <text class="amber" x="400" y="182">still willing</text>
  <text class="label small" x="372" y="216">self-denial is a goal: a will to nothingness is a will</text>

  <path class="rule" d="M 16 300 L 624 300"/>
  <text class="label small" x="320" y="320" text-anchor="middle">"life wrestles in it and through it with death and against death" (§13)</text>
  <text class="muted small" x="320" y="338" text-anchor="middle">a device of life against its own decline, not life's opposite; its bearer a "conserving and yes-creating" force</text>
</svg>

<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .box-b { fill: none; stroke: #4c8dd6; stroke-width: 1.8; }
    .box-a { fill: none; stroke: #e2903a; stroke-width: 1.8; }
    .ghost { fill: none; stroke: currentColor; stroke-opacity: 0.35; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .affect { stroke: #4c8dd6; stroke-width: 3; fill: none; }
    .rule { stroke: currentColor; stroke-opacity: 0.3; stroke-width: 1; }
  </style>
  <text class="muted small" x="16" y="18">Frame 2 of 3: the priest intercepts and grants the premise (§15)</text>

  <rect class="box-b" x="16" y="96" width="170" height="92" rx="6"/>
  <text class="blue" x="101" y="118" text-anchor="middle">the sufferer</text>
  <text class="label small" x="101" y="134" text-anchor="middle">"every sick sheep"</text>
  <text class="label small" x="101" y="152" text-anchor="middle">"I suffer": an affect seeking</text>
  <text class="label small" x="101" y="166" text-anchor="middle">"a guilty doer" to discharge on</text>
  <text class="muted small" x="101" y="181" text-anchor="middle">discharge as narcotic</text>

  <rect class="box-a" x="250" y="96" width="140" height="92" rx="6"/>
  <text class="amber" x="320" y="118" text-anchor="middle">the ascetic priest</text>
  <text class="label small" x="320" y="134" text-anchor="middle">"his shepherd"</text>
  <text class="label small" x="320" y="152" text-anchor="middle">sick and strong (§15);</text>
  <text class="label small" x="320" y="166" text-anchor="middle">"changer of the direction</text>
  <text class="label small" x="320" y="180" text-anchor="middle">of ressentiment"</text>

  <rect class="box-a" x="454" y="96" width="170" height="92" rx="6"/>
  <text class="amber" x="539" y="118" text-anchor="middle">a guilty doer</text>
  <text class="label small" x="539" y="134" text-anchor="middle">"susceptible to suffering"</text>
  <text class="label small" x="539" y="152" text-anchor="middle">the healthy; or "friends,</text>
  <text class="label small" x="539" y="166" text-anchor="middle">wife, child"; or the herd itself</text>

  <path class="affect" d="M 190 142 L 242 142"/>
  <path class="affect" d="M 234 135 L 242 142 L 234 149"/>
  <text class="blue small" x="216" y="86" text-anchor="middle">intercepted</text>
  <text class="amber small" x="320" y="72" text-anchor="middle">"Quite right, my sheep! someone must be to blame for it:"</text>

  <path class="rule" d="M 16 232 L 624 232"/>
  <text class="label small" x="320" y="254" text-anchor="middle">the search for a cause is granted, word for word; the object is withheld</text>
  <text class="label small" x="320" y="270" text-anchor="middle">"before he can play the physician he must first wound" (§15)</text>
  <text class="muted small" x="320" y="292" text-anchor="middle">what is conserved through all three frames: the premise "someone is to blame"</text>
</svg>

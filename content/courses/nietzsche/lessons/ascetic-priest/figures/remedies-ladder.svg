<svg viewBox="0 0 640 440" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .rung-b { fill: none; stroke: #4c8dd6; stroke-width: 1.6; }
    .rung-a { fill: none; stroke: #e2903a; stroke-width: 2; }
    .rail { stroke: currentColor; stroke-opacity: 0.45; stroke-width: 1.4; }
    .axis { stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.2; fill: none; }
    .bracket { stroke: #4c8dd6; stroke-width: 1.2; fill: none; }
    .rule { stroke: currentColor; stroke-opacity: 0.3; stroke-width: 1; }
  </style>
  <text class="muted small" x="16" y="18">GM III:17–21: the priest's remedies as a ladder, ranked by their cost to the sufferer's health</text>

  <path class="axis" d="M 60 340 L 60 44"/>
  <path class="axis" d="M 55 52 L 60 44 L 65 52"/>
  <text class="muted small" x="24" y="192" transform="rotate(-90 24 192)" text-anchor="middle">effect on the sufferer's health</text>
  <text class="muted small" x="66" y="48">makes the sick sicker</text>
  <text class="muted small" x="66" y="352">leaves the sick as they were: deadened, "harmless", organized (§16)</text>

  <line class="rail" x1="150" y1="44" x2="150" y2="340"/>
  <line class="rail" x1="590" y1="44" x2="590" y2="340"/>

  <rect class="rung-a" x="150" y="60" width="440" height="46" rx="5"/>
  <text class="amber" x="162" y="78">the orgy of feeling: guilt exploited, the sick made "the sinner"</text>
  <text class="label small" x="162" y="96">"it makes the ill more ill" (§20); "More pain! More pain!"; "guilty" means (§§19–21)</text>

  <rect class="rung-b" x="150" y="130" width="440" height="40" rx="5"/>
  <text class="blue" x="162" y="147">herd organization</text>
  <text class="label small" x="162" y="162">weakness wished for the herd, the priests' cleverness organized it (§§18–19)</text>

  <rect class="rung-b" x="150" y="186" width="440" height="40" rx="5"/>
  <text class="blue" x="162" y="203">the small joy: "love your neighbour"</text>
  <text class="label small" x="162" y="218">the will to power "in the most cautious doses": "the smallest superiority" (§18)</text>

  <rect class="rung-b" x="150" y="242" width="440" height="40" rx="5"/>
  <text class="blue" x="162" y="259">mechanical activity: "the blessing of work"</text>
  <text class="label small" x="162" y="274">consciousness monopolized by action; "narrow is this chamber" (§18)</text>

  <rect class="rung-b" x="150" y="298" width="440" height="40" rx="5"/>
  <text class="blue" x="162" y="315">hypnotic reduction of the feeling of life</text>
  <text class="label small" x="162" y="330">no wishes, no affects, "il faut s'abêtir"; deep sleep as salvation (§17)</text>

  <path class="bracket" d="M 604 130 L 610 130 L 610 338 L 604 338"/>
  <text class="blue small" x="626" y="234" transform="rotate(90 626 234)" text-anchor="middle">"innocent" means (§19)</text>

  <path class="rule" d="M 16 372 L 624 372"/>
  <text class="label small" x="320" y="392" text-anchor="middle">none of the five heals: the priest combats "only the actual suffering, not its cause" (§17)</text>
  <text class="muted small" x="320" y="410" text-anchor="middle">"innocent" and "guilty" are "according to modern standards": the axis is health, not morality and not relief</text>
  <text class="muted small" x="320" y="426" text-anchor="middle">the most effective remedy, sin, is the most costly: success measured in relief, cost in health</text>
</svg>

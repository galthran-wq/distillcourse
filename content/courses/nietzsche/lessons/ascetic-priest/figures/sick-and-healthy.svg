<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .region-b { fill: none; stroke: #4c8dd6; stroke-width: 1.8; }
    .region-a { fill: none; stroke: #e2903a; stroke-width: 1.8; }
    .box { fill: none; stroke: currentColor; stroke-opacity: 0.45; stroke-width: 1.2; }
    .box-a { fill: none; stroke: #e2903a; stroke-width: 1.6; }
    .wall { stroke: currentColor; stroke-width: 5; stroke-opacity: 0.6; }
    .arrow { stroke: #4c8dd6; stroke-width: 1.8; fill: none; }
    .rule { stroke: currentColor; stroke-opacity: 0.3; stroke-width: 1; }
  </style>
  <text class="muted small" x="16" y="18">GM III:14: two populations, a wall, and the danger that crosses it</text>

  <rect class="region-b" x="16" y="36" width="330" height="248" rx="8"/>
  <text class="blue" x="181" y="56" text-anchor="middle">the sick: "the majority"</text>
  <text class="label small" x="181" y="72" text-anchor="middle">"sufferers from themselves of every kind" (§13)</text>

  <rect class="box-a" x="40" y="92" width="282" height="72" rx="6"/>
  <text class="amber" x="181" y="112" text-anchor="middle">the ascetic priest</text>
  <text class="label small" x="181" y="128" text-anchor="middle">"he must himself be sick"; "but he must</text>
  <text class="label small" x="181" y="142" text-anchor="middle">also be strong, impregnable in his will to power"</text>
  <text class="muted small" x="181" y="157" text-anchor="middle">belongs to the herd and rules it</text>

  <text class="label small" x="181" y="192" text-anchor="middle">"the conspiracy of the sufferers against</text>
  <text class="label small" x="181" y="206" text-anchor="middle">the sound and the victorious" (§14)</text>
  <text class="muted small" x="181" y="226" text-anchor="middle">ressentiment (I:10) on "a swamp soil of self-contempt"</text>
  <text class="muted small" x="181" y="240" text-anchor="middle">its triumph: the happy "ashamed of their happiness"</text>

  <line class="wall" x1="372" y1="36" x2="372" y2="284"/>

  <rect class="region-a" x="398" y="36" width="226" height="130" rx="8"/>
  <text class="amber" x="511" y="56" text-anchor="middle">the healthy</text>
  <text class="label small" x="511" y="72" text-anchor="middle">"the rare cases", "the windfalls</text>
  <text class="label small" x="511" y="86" text-anchor="middle">of humanity" (§14)</text>
  <text class="muted small" x="511" y="106" text-anchor="middle">must not be "the doctor, the</text>
  <text class="muted small" x="511" y="120" text-anchor="middle">comforter, the 'Saviour' of the sick":</text>
  <text class="muted small" x="511" y="134" text-anchor="middle">"the pathos of distance must keep</text>
  <text class="muted small" x="511" y="148" text-anchor="middle">their missions separate"</text>

  <path class="arrow" d="M 348 192 L 426 192"/>
  <path class="arrow" d="M 420 187 L 426 192 L 420 197"/>
  <text class="blue small" x="387" y="184" text-anchor="middle">nausea</text>
  <path class="arrow" d="M 348 228 L 426 228"/>
  <path class="arrow" d="M 420 223 L 426 228 L 420 233"/>
  <text class="blue small" x="387" y="244" text-anchor="middle">pity</text>

  <rect class="box" x="434" y="176" width="190" height="72" rx="6"/>
  <text class="blue small" x="529" y="192" text-anchor="middle">"the great nausea with man",</text>
  <text class="blue small" x="529" y="205" text-anchor="middle">"the great pity for man"</text>
  <text class="label small" x="529" y="222" text-anchor="middle">their union: "his will to</text>
  <text class="label small" x="529" y="236" text-anchor="middle">nothingness, nihilism" (§14)</text>

  <path class="rule" d="M 16 304 L 624 304"/>
  <text class="label small" x="320" y="324" text-anchor="middle">the demand: "the healthy should remain separated from the sick" (§14)</text>
  <text class="label small" x="320" y="342" text-anchor="middle">therefore "doctors and nurses who themselves are sick" (§15): the priest is deduced, not observed</text>
  <text class="muted small" x="320" y="362" text-anchor="middle">the premise §14 does not state, that the herd must be tended at all, is §13's: life's interest in the herd</text>
</svg>

<svg viewBox="0 0 640 430" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .green { fill: #5aa46a; font-weight: 600; }
    .box { fill: none; stroke: currentColor; stroke-opacity: 0.45; stroke-width: 1.2; }
    .box-b { fill: none; stroke: #4c8dd6; stroke-width: 1.6; }
    .box-a { fill: none; stroke: #e2903a; stroke-width: 2; }
    .gap { fill: none; stroke: currentColor; stroke-opacity: 0.4; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .arrow { stroke: currentColor; stroke-opacity: 0.55; stroke-width: 1.6; fill: none; }
    .close { stroke: #5aa46a; stroke-width: 1.4; fill: none; stroke-dasharray: 4 3; }
    .rule { stroke: currentColor; stroke-opacity: 0.3; stroke-width: 1; }
  </style>
  <text class="muted small" x="16" y="18">The Genealogy as one machine: what each treatise supplied, and what it needed from the next</text>

  <rect class="box-b" x="16" y="36" width="180" height="120" rx="6"/>
  <text class="blue" x="106" y="56" text-anchor="middle">I: the inversion</text>
  <text class="label small" x="106" y="74" text-anchor="middle">ressentiment, the creative No,</text>
  <text class="label small" x="106" y="88" text-anchor="middle">coins "evil" of the noble first</text>
  <text class="muted small" x="106" y="104" text-anchor="middle">I:7–14; spoken by the priestly caste</text>
  <text class="muted small" x="106" y="122" text-anchor="middle">supplies affect and code;</text>
  <text class="muted small" x="106" y="136" text-anchor="middle">cannot reach the strong</text>

  <rect class="box-b" x="230" y="36" width="180" height="120" rx="6"/>
  <text class="blue" x="320" y="56" text-anchor="middle">II: the site</text>
  <text class="label small" x="320" y="74" text-anchor="middle">bad conscience: the enclosed</text>
  <text class="label small" x="320" y="88" text-anchor="middle">animal suffers from itself (II:16)</text>
  <text class="muted small" x="320" y="104" text-anchor="middle">plus the debt to God (II:19–21)</text>
  <text class="muted small" x="320" y="122" text-anchor="middle">supplies sufferers among the strong</text>
  <text class="muted small" x="320" y="136" text-anchor="middle">no author of "deserved" (II:24)</text>

  <rect class="box-a" x="444" y="36" width="180" height="120" rx="6"/>
  <text class="amber" x="534" y="56" text-anchor="middle">III: the administrator</text>
  <text class="label small" x="534" y="74" text-anchor="middle">the priest, deduced from the</text>
  <text class="label small" x="534" y="88" text-anchor="middle">sick and the healthy (§§13–15)</text>
  <text class="muted small" x="534" y="104" text-anchor="middle">changes ressentiment's direction</text>
  <text class="muted small" x="534" y="118" text-anchor="middle">onto the sufferer (§15)</text>
  <text class="muted small" x="534" y="136" text-anchor="middle">instrument: guilt, "sin" (§20)</text>

  <path class="arrow" d="M 196 96 L 226 96"/>
  <path class="arrow" d="M 220 91 L 226 96 L 220 101"/>
  <path class="arrow" d="M 410 96 L 440 96"/>
  <path class="arrow" d="M 434 91 L 440 96 L 434 101"/>

  <rect class="gap" x="16" y="176" width="180" height="70" rx="6"/>
  <text class="label small" x="106" y="196" text-anchor="middle">gap: the victory</text>
  <text class="muted small" x="106" y="212" text-anchor="middle">why did the strong come to</text>
  <text class="muted small" x="106" y="226" text-anchor="middle">hold values against them? (I:16)</text>
  <text class="green small" x="106" y="241" text-anchor="middle">closed by III:15 with II:16</text>

  <rect class="gap" x="230" y="176" width="180" height="70" rx="6"/>
  <text class="label small" x="320" y="196" text-anchor="middle">gap: the administrator</text>
  <text class="muted small" x="320" y="212" text-anchor="middle">who reads the inward cruelty</text>
  <text class="muted small" x="320" y="226" text-anchor="middle">as deserved? (II:24)</text>
  <text class="green small" x="320" y="241" text-anchor="middle">closed by III:15 and III:20</text>

  <path class="close" d="M 534 156 L 534 211 L 410 211"/>
  <path class="close" d="M 534 211 L 534 262 L 106 262 L 106 246"/>

  <rect class="box" x="170" y="290" width="300" height="60" rx="6"/>
  <text class="label" x="320" y="310" text-anchor="middle">European morality (MPS)</text>
  <text class="label small" x="320" y="326" text-anchor="middle">altruism, pity, equality, guilt</text>
  <text class="muted small" x="320" y="341" text-anchor="middle">held by the strong as sufferers, not as vanquished</text>
  <path class="arrow" d="M 534 156 L 534 280 L 470 320"/>

  <path class="rule" d="M 16 372 L 624 372"/>
  <text class="label small" x="320" y="392" text-anchor="middle">§15 uses all three in one formula: an affect from I, a site from II, a will to power from III</text>
  <text class="muted small" x="320" y="408" text-anchor="middle">the joint is Nietzsche's own: §20 cites "the previous essay" for guilt's origin; the mechanisms interpenetrate (Reginster)</text>
</svg>

<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .line { stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.4; }
    .tick-b { stroke: #4c8dd6; stroke-width: 2.4; }
    .tick-a { stroke: #e2903a; stroke-width: 2.4; }
    .dot-b { fill: #4c8dd6; }
    .dot-a { fill: #e2903a; }
    .goal { fill: none; stroke: #e2903a; stroke-width: 1.6; stroke-dasharray: 6 4; }
    .rule { stroke: currentColor; stroke-opacity: 0.3; stroke-width: 1; }
  </style>
  <text class="muted small" x="16" y="18">Two failure modes of affirmation, and the one point on the line §28 reaches</text>

  <line class="line" x1="60" y1="176" x2="580" y2="176"/>

  <circle class="dot-b" cx="90" cy="176" r="5"/>
  <text class="blue small" x="90" y="200" text-anchor="middle">not willing at all</text>
  <text class="label small" x="90" y="214" text-anchor="middle">the void; "suicidal</text>
  <text class="label small" x="90" y="228" text-anchor="middle">nihilism" (§28)</text>
  <text class="muted small" x="90" y="244" text-anchor="middle">the door the ideal</text>
  <text class="muted small" x="90" y="258" text-anchor="middle">closed</text>

  <circle class="dot-a" cx="270" cy="176" r="5"/>
  <text class="amber" x="270" y="200" text-anchor="middle">the priest's regime</text>
  <text class="label small" x="270" y="214" text-anchor="middle">willing nothingness: suffering</text>
  <text class="label small" x="270" y="228" text-anchor="middle">explained as a sentence, life a bridge</text>
  <text class="muted small" x="270" y="244" text-anchor="middle">compensation of the first kind:</text>
  <text class="muted small" x="270" y="258" text-anchor="middle">suffering "regrettable in principle"</text>

  <circle class="dot-b" cx="540" cy="176" r="5"/>
  <text class="blue small" x="540" y="200" text-anchor="middle">braying Yea-Yuh to everything</text>
  <text class="label small" x="540" y="214" text-anchor="middle">the donkey (Z IV, "The Awakening")</text>
  <text class="label small" x="540" y="228" text-anchor="middle">"the omni-satisfied"</text>
  <text class="muted small" x="540" y="244" text-anchor="middle">suffering concealed by adaptability,</text>
  <text class="muted small" x="540" y="258" text-anchor="middle">"no taste at all"</text>

  <rect class="goal" x="240" y="48" width="280" height="96" rx="6"/>
  <text class="amber" x="380" y="70" text-anchor="middle">the counter-ideal (Module 6)</text>
  <text class="label small" x="380" y="88" text-anchor="middle">suffering valued as a constituent of the good:</text>
  <text class="label small" x="380" y="102" text-anchor="middle">neither condemned nor concealed</text>
  <text class="muted small" x="380" y="118" text-anchor="middle">compensation of the second kind (Reginster)</text>
  <text class="muted small" x="380" y="132" text-anchor="middle">not supplied by §28; required by it</text>
  <line class="line" x1="380" y1="144" x2="380" y2="170" stroke-dasharray="3 3"/>

  <path class="rule" d="M 16 282 L 624 282"/>
  <text class="label small" x="320" y="302" text-anchor="middle">§28 reaches one point on the line, one step right of not willing at all: "better than no meaning"</text>
</svg>

<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .w { fill: #4c8dd6; }
    .n { fill: #e2903a; }
  </style>
  <text x="10" y="22" class="w" font-weight="600" font-size="13">Wagner</text>
  <text x="10" y="196" class="n" font-weight="600" font-size="13">Nietzsche</text>

  <!-- axis 1868 (x=40) to 1889 (x=600): 26.67 px per year -->
  <line x1="40" y1="160" x2="600" y2="160" stroke="currentColor" stroke-opacity="0.6"/>
  <g stroke="currentColor" stroke-opacity="0.5">
    <line x1="40" y1="156" x2="40" y2="164"/>
    <line x1="146.7" y1="156" x2="146.7" y2="164"/>
    <line x1="253.3" y1="156" x2="253.3" y2="164"/>
    <line x1="360" y1="156" x2="360" y2="164"/>
    <line x1="466.7" y1="156" x2="466.7" y2="164"/>
    <line x1="573.3" y1="156" x2="573.3" y2="164"/>
  </g>
  <text class="muted" x="40" y="176" text-anchor="middle">1868</text>
  <text class="muted" x="146.7" y="176" text-anchor="middle">1872</text>
  <text class="muted" x="253.3" y="176" text-anchor="middle">1876</text>
  <text class="muted" x="360" y="176" text-anchor="middle">1880</text>
  <text class="muted" x="466.7" y="176" text-anchor="middle">1884</text>
  <text class="muted" x="573.3" y="176" text-anchor="middle">1888</text>

  <!-- Wagner, above -->
  <line x1="40" y1="160" x2="40" y2="62" stroke="#4c8dd6" stroke-width="1.2"/>
  <circle cx="40" cy="160" r="4" fill="#4c8dd6"/>
  <text x="46" y="58" class="label">1868: first meeting, Leipzig</text>

  <rect x="66.7" y="140" width="80" height="10" rx="3" fill="#4c8dd6" fill-opacity="0.35" stroke="#4c8dd6"/>
  <text x="106.7" y="132" class="label" text-anchor="middle">Tribschen, 1869–72</text>

  <line x1="253.3" y1="160" x2="253.3" y2="98" stroke="#4c8dd6" stroke-width="1.2"/>
  <circle cx="253.3" cy="160" r="4" fill="#4c8dd6"/>
  <text x="253.3" y="92" class="label" text-anchor="middle">1876: first Bayreuth festival</text>

  <line x1="413.3" y1="160" x2="413.3" y2="62" stroke="#4c8dd6" stroke-width="1.2"/>
  <circle cx="413.3" cy="160" r="4" fill="#4c8dd6"/>
  <text x="413.3" y="56" class="label" text-anchor="middle">1882: Parsifal first performed</text>

  <line x1="440" y1="160" x2="440" y2="120" stroke="#4c8dd6" stroke-width="1.2"/>
  <circle cx="440" cy="160" r="4" fill="#4c8dd6"/>
  <text x="446" y="116" class="label">1883: Wagner dies in Venice</text>

  <!-- Nietzsche, below: three label levels so no leader crosses a label -->
  <line x1="144" y1="160" x2="144" y2="196" stroke="#e2903a" stroke-width="1.2"/>
  <circle cx="144" cy="160" r="4" fill="#e2903a"/>
  <text x="144" y="210" class="label" text-anchor="middle">end of 1871: BT Foreword,</text>
  <text x="144" y="226" class="muted" text-anchor="middle">“art is the highest task”</text>

  <line x1="253.3" y1="160" x2="253.3" y2="290" stroke="#e2903a" stroke-width="1.2"/>
  <circle cx="253.3" cy="160" r="4" fill="#e2903a"/>
  <text x="253.3" y="304" class="label" text-anchor="middle">summer 1876: “I said farewell</text>
  <text x="253.3" y="320" class="muted" text-anchor="middle">to Wagner in my heart”</text>

  <line x1="306.7" y1="160" x2="306.7" y2="244" stroke="#e2903a" stroke-width="1.2"/>
  <circle cx="306.7" cy="160" r="4" fill="#e2903a"/>
  <text x="312" y="258" class="label">1878: HH and the Parsifal</text>
  <text x="312" y="274" class="muted">text cross, “two swords”</text>

  <line x1="546.7" y1="160" x2="546.7" y2="226" stroke="#e2903a" stroke-width="1.2"/>
  <circle cx="546.7" cy="160" r="4" fill="#e2903a"/>
  <text x="540" y="210" class="label" text-anchor="end">1887: GS 370,</text>
  <text x="540" y="226" class="muted" text-anchor="end">hunger or superabundance?</text>

  <line x1="573.3" y1="160" x2="573.3" y2="290" stroke="#e2903a" stroke-width="1.6"/>
  <circle cx="573.3" cy="160" r="5" fill="#e2903a"/>
  <text x="634" y="304" class="label" text-anchor="end" font-weight="600">1888: The Case of Wagner,</text>
  <text x="634" y="320" class="muted" text-anchor="end">Nietzsche contra Wagner, Ecce Homo</text>
</svg>

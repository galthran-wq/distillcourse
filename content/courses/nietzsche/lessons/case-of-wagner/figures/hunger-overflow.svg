<svg viewBox="0 0 640 470" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .box { fill: none; stroke: currentColor; stroke-opacity: 0.45; }
  </style>
  <defs>
    <marker id="ho-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor" fill-opacity="0.6"/>
    </marker>
  </defs>

  <rect class="box" x="120" y="10" width="400" height="54" rx="5"/>
  <text class="muted" x="320" y="30" text-anchor="middle">every art, every philosophy presupposes suffering and sufferers</text>
  <text class="label" x="320" y="52" text-anchor="middle" font-weight="600">“is it hunger or superabundance that has here become creative?”</text>

  <line x1="250" y1="64" x2="170" y2="96" stroke="currentColor" stroke-opacity="0.6" marker-end="url(#ho-arrow)"/>
  <line x1="390" y1="64" x2="470" y2="96" stroke="currentColor" stroke-opacity="0.6" marker-end="url(#ho-arrow)"/>

  <!-- hunger -->
  <rect x="10" y="100" width="300" height="230" rx="5" fill="#4c8dd6" fill-opacity="0.10" stroke="#4c8dd6"/>
  <text x="24" y="124" fill="#4c8dd6" font-weight="600" font-size="13">hunger</text>
  <text class="label" x="24" y="144">suffering from the impoverishment of life</text>
  <text class="muted" x="24" y="168">what the work must supply:</text>
  <text class="label" x="24" y="186">rest, stillness, calm seas,</text>
  <text class="label" x="24" y="202">redemption from themselves;</text>
  <text class="label" x="24" y="218">or intoxication, convulsions, anaesthesia;</text>
  <text class="label" x="24" y="234">“a god for the sick, a healer and savior”;</text>
  <text class="label" x="24" y="250">logic, “a certain warm narrowness”</text>
  <line x1="24" y1="266" x2="296" y2="266" stroke="#4c8dd6" stroke-opacity="0.5" stroke-dasharray="3 3"/>
  <text x="24" y="288" fill="#4c8dd6" font-weight="600">romantic pessimism</text>
  <text class="muted" x="24" y="306">Schopenhauer’s philosophy of will,</text>
  <text class="muted" x="24" y="322">Wagner’s music</text>

  <!-- superabundance -->
  <rect x="330" y="100" width="300" height="230" rx="5" fill="#e2903a" fill-opacity="0.12" stroke="#e2903a"/>
  <text x="344" y="124" fill="#e2903a" font-weight="600" font-size="13">superabundance</text>
  <text class="label" x="344" y="144">suffering from the over-fullness of life</text>
  <text class="muted" x="344" y="168">what the work can afford:</text>
  <text class="label" x="344" y="186">the sight of the terrible and questionable,</text>
  <text class="label" x="344" y="202">even “the terrible deed”;</text>
  <text class="label" x="344" y="218">destruction, ugliness, negation,</text>
  <text class="label" x="344" y="234">spent from “an excess of procreating,</text>
  <text class="label" x="344" y="250">fertilizing energies”</text>
  <line x1="344" y1="266" x2="616" y2="266" stroke="#e2903a" stroke-opacity="0.5" stroke-dasharray="3 3"/>
  <text x="344" y="288" fill="#e2903a" font-weight="600">Dionysian pessimism</text>
  <text class="muted" x="344" y="306">art of gratitude and love:</text>
  <text class="muted" x="344" y="322">Rubens, Hafiz, Goethe</text>

  <!-- the ambiguous desires -->
  <text class="label" x="320" y="358" text-anchor="middle" font-weight="600">the same desire, read both ways</text>
  <text class="muted" x="160" y="382" text-anchor="middle">destruction from hatred of all that exists:</text>
  <text class="label" x="160" y="398" text-anchor="middle">“consider our anarchists”</text>
  <text class="muted" x="480" y="382" text-anchor="middle">destruction from overflow:</text>
  <text class="label" x="480" y="398" text-anchor="middle">“pregnant with future”</text>
  <text class="muted" x="160" y="428" text-anchor="middle">immortalizing as the sufferer’s revenge,</text>
  <text class="label" x="160" y="444" text-anchor="middle">branding things with “the image of his torture”</text>
  <text class="muted" x="480" y="428" text-anchor="middle">immortalizing from gratitude:</text>
  <text class="label" x="480" y="444" text-anchor="middle">“an art of apotheoses”</text>
  <line x1="320" y1="372" x2="320" y2="452" stroke="currentColor" stroke-opacity="0.3" stroke-dasharray="3 3"/>
</svg>

<svg viewBox="0 0 640 470" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
  </style>
  <text class="muted" x="20" y="23">uses the result of:</text>
  <rect x="124" y="10" width="150" height="18" rx="9" fill="#4c8dd6" fill-opacity="0.18" stroke="#4c8dd6"/>
  <text x="199" y="23" text-anchor="middle" font-size="11" fill="#4c8dd6" font-weight="600">Schopenhauer and BT</text>
  <rect x="282" y="10" width="122" height="18" rx="9" fill="#5aa46a" fill-opacity="0.18" stroke="#5aa46a"/>
  <text x="343" y="23" text-anchor="middle" font-size="11" fill="#5aa46a" font-weight="600">the death of God</text>
  <rect x="412" y="10" width="70" height="18" rx="9" fill="#e2903a" fill-opacity="0.18" stroke="#e2903a"/>
  <text x="447" y="23" text-anchor="middle" font-size="11" fill="#e2903a" font-weight="600">nihilism</text>
  <text class="muted" x="492" y="23">→ handed to later lessons</text>
  <line x1="20" y1="46" x2="620" y2="46" stroke="currentColor" stroke-opacity="0.15"/>
  <text class="label" x="20" y="66" font-weight="600">Preface</text>
  <text class="label" x="112" y="66">the doctor is a patient:</text>
  <text class="muted" x="112" y="82">“I am a decadent … I recognised the fact”</text>
  <rect x="430" y="54" width="68" height="18" rx="9" fill="#e2903a" fill-opacity="0.18" stroke="#e2903a"/>
  <text x="464" y="67" text-anchor="middle" font-size="11" fill="#e2903a" font-weight="600">nihilism</text>
  <line x1="20" y1="92" x2="620" y2="92" stroke="currentColor" stroke-opacity="0.15"/>
  <text class="label" x="20" y="112" font-weight="600">1–2</text>
  <text class="label" x="112" y="112">Carmen as the control case:</text>
  <text class="muted" x="112" y="128">“everything divine runs with light feet”</text>
  <rect x="430" y="100" width="30" height="18" rx="9" fill="#4c8dd6" fill-opacity="0.18" stroke="#4c8dd6"/>
  <text x="445" y="113" text-anchor="middle" font-size="11" fill="#4c8dd6" font-weight="600">BT</text>
  <line x1="20" y1="138" x2="620" y2="138" stroke="currentColor" stroke-opacity="0.15"/>
  <text class="label" x="20" y="158" font-weight="600">3</text>
  <text class="label" x="112" y="158">the opera of redemption:</text>
  <text class="muted" x="112" y="174">“someone always wants to be saved”</text>
  <rect x="430" y="146" width="92" height="18" rx="9" fill="#5aa46a" fill-opacity="0.18" stroke="#5aa46a"/>
  <text x="476" y="159" text-anchor="middle" font-size="11" fill="#5aa46a" font-weight="600">death of God</text>
  <line x1="20" y1="184" x2="620" y2="184" stroke="currentColor" stroke-opacity="0.15"/>
  <text class="label" x="20" y="204" font-weight="600">4</text>
  <text class="label" x="112" y="204">the Ring rewritten as resignation:</text>
  <text class="muted" x="112" y="220">Brünnhilde versifies Schopenhauer</text>
  <rect x="430" y="192" width="30" height="18" rx="9" fill="#4c8dd6" fill-opacity="0.18" stroke="#4c8dd6"/>
  <text x="445" y="205" text-anchor="middle" font-size="11" fill="#4c8dd6" font-weight="600">BT</text>
  <rect x="466.4" y="192" width="68" height="18" rx="9" fill="#e2903a" fill-opacity="0.18" stroke="#e2903a"/>
  <text x="500" y="205" text-anchor="middle" font-size="11" fill="#e2903a" font-weight="600">nihilism</text>
  <line x1="20" y1="230" x2="620" y2="230" stroke="currentColor" stroke-opacity="0.15"/>
  <text class="label" x="20" y="250" font-weight="600">5</text>
  <text class="label" x="112" y="250">decadence at work:</text>
  <text class="muted" x="112" y="266">“what is harmful lures the exhausted”</text>
  <rect x="430" y="238" width="68" height="18" rx="9" fill="#e2903a" fill-opacity="0.18" stroke="#e2903a"/>
  <text x="464" y="251" text-anchor="middle" font-size="11" fill="#e2903a" font-weight="600">nihilism</text>
  <line x1="20" y1="276" x2="620" y2="276" stroke="currentColor" stroke-opacity="0.15"/>
  <text class="label" x="20" y="296" font-weight="600">6–7</text>
  <text class="label" x="112" y="296">the style of decadence:</text>
  <text class="muted" x="112" y="312">“the whole is no longer a whole”</text>
  <rect x="430" y="284" width="68" height="18" rx="9" fill="#e2903a" fill-opacity="0.18" stroke="#e2903a"/>
  <text x="464" y="297" text-anchor="middle" font-size="11" fill="#e2903a" font-weight="600">nihilism</text>
  <text class="muted" x="430" y="316">→ drives, herd morality</text>
  <line x1="20" y1="322" x2="620" y2="322" stroke="currentColor" stroke-opacity="0.15"/>
  <text class="label" x="20" y="342" font-weight="600">8–12</text>
  <text class="label" x="112" y="342">the actor:</text>
  <text class="muted" x="112" y="358">music as “an art of lying”</text>
  <rect x="430" y="330" width="30" height="18" rx="9" fill="#4c8dd6" fill-opacity="0.18" stroke="#4c8dd6"/>
  <text x="445" y="343" text-anchor="middle" font-size="11" fill="#4c8dd6" font-weight="600">BT</text>
  <text class="muted" x="430" y="362">→ politics (11)</text>
  <line x1="20" y1="368" x2="620" y2="368" stroke="currentColor" stroke-opacity="0.15"/>
  <text class="label" x="20" y="388" font-weight="600">Postscripts</text>
  <text class="label" x="112" y="388">Parsifal:</text>
  <text class="muted" x="112" y="404">“Salvation from the Saviour”</text>
  <rect x="430" y="376" width="92" height="18" rx="9" fill="#5aa46a" fill-opacity="0.18" stroke="#5aa46a"/>
  <text x="476" y="389" text-anchor="middle" font-size="11" fill="#5aa46a" font-weight="600">death of God</text>
  <rect x="528.4" y="376" width="68" height="18" rx="9" fill="#e2903a" fill-opacity="0.18" stroke="#e2903a"/>
  <text x="562" y="389" text-anchor="middle" font-size="11" fill="#e2903a" font-weight="600">nihilism</text>
  <line x1="20" y1="414" x2="620" y2="414" stroke="currentColor" stroke-opacity="0.15"/>
  <text class="label" x="20" y="434" font-weight="600">Epilogue</text>
  <text class="label" x="112" y="434">the standard stated:</text>
  <text class="muted" x="112" y="450">ascending or declining life</text>
  <rect x="430" y="422" width="68" height="18" rx="9" fill="#e2903a" fill-opacity="0.18" stroke="#e2903a"/>
  <text x="464" y="435" text-anchor="middle" font-size="11" fill="#e2903a" font-weight="600">nihilism</text>
  <text class="muted" x="430" y="454">→ master morality, perspectivism</text>
  <line x1="20" y1="460" x2="620" y2="460" stroke="currentColor" stroke-opacity="0.15"/>
</svg>

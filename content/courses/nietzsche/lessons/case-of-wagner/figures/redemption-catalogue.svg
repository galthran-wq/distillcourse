<svg viewBox="0 0 640 405" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
  </style>
  <text x="16" y="22" class="label" font-weight="600">the work</text>
  <text x="134" y="22" fill="#4c8dd6" font-weight="600">the one saved</text>
  <text x="284" y="22" fill="#e2903a" font-weight="600">the saviour</text>
  <text x="436" y="22" class="label" font-weight="600">in CW 3’s words</text>
  <line x1="10" y1="34" x2="630" y2="34" stroke="currentColor" stroke-opacity="0.18"/>
  <text class="label" x="16" y="53" font-weight="600">Tannhäuser</text>
  <text class="label" x="134" y="53">Tannhäuser, back</text>
  <text class="label" x="134" y="68">from Venus’s mountain</text>
  <text class="label" x="284" y="53">Elisabeth’s innocence</text>
  <text class="label" x="284" y="68">and her prayer</text>
  <text class="muted" x="436" y="53">“innocence has a preference</text>
  <text class="muted" x="436" y="68">for saving interesting sinners”</text>
  <line x1="10" y1="80" x2="630" y2="80" stroke="currentColor" stroke-opacity="0.18"/>
  <text class="label" x="16" y="99" font-weight="600">The Flying</text>
  <text class="label" x="16" y="114" font-weight="600">Dutchman</text>
  <text class="label" x="134" y="99">the Dutchman, the</text>
  <text class="label" x="134" y="114">sea’s “eternal Jew”</text>
  <text class="label" x="284" y="99">Senta, faithful</text>
  <text class="label" x="284" y="114">unto death</text>
  <text class="muted" x="436" y="99">“he marries, that is to say,</text>
  <text class="muted" x="436" y="114">he concerns us no longer”</text>
  <line x1="10" y1="126" x2="630" y2="126" stroke="currentColor" stroke-opacity="0.18"/>
  <text class="label" x="16" y="145" font-weight="600">Parsifal</text>
  <text class="label" x="134" y="145">Kundry</text>
  <text class="label" x="284" y="145">Parsifal, the</text>
  <text class="label" x="284" y="160">chaste fool</text>
  <text class="muted" x="436" y="145">“corrupted old females prefer</text>
  <text class="muted" x="436" y="160">to be saved by chaste young men”</text>
  <line x1="10" y1="172" x2="630" y2="172" stroke="currentColor" stroke-opacity="0.18"/>
  <text class="label" x="16" y="191" font-weight="600">Lohengrin</text>
  <text class="label" x="134" y="191">Elsa</text>
  <text class="label" x="284" y="191">the knight, if she</text>
  <text class="label" x="284" y="206">never asks his name</text>
  <text class="muted" x="436" y="191">“young hysterics like to be</text>
  <text class="muted" x="436" y="206">saved by their doctor”</text>
  <line x1="10" y1="218" x2="630" y2="218" stroke="currentColor" stroke-opacity="0.18"/>
  <text class="label" x="16" y="237" font-weight="600">The</text>
  <text class="label" x="16" y="252" font-weight="600">Mastersingers</text>
  <text class="label" x="134" y="237">Eva</text>
  <text class="label" x="284" y="237">Walther, the knight</text>
  <text class="label" x="284" y="252">with the new song</text>
  <text class="muted" x="436" y="237">“a knight who also happens</text>
  <text class="muted" x="436" y="252">to be a Wagnerite”</text>
  <line x1="10" y1="264" x2="630" y2="264" stroke="currentColor" stroke-opacity="0.18"/>
  <rect x="10" y="266" width="620" height="42" rx="4" fill="currentColor" fill-opacity="0.05"/>
  <text class="label" x="16" y="283" font-weight="600">Tristan and</text>
  <text class="label" x="16" y="298" font-weight="600">Isolde</text>
  <text class="label" x="134" y="283">Isolde, a king’s wife</text>
  <text class="label" x="284" y="283">Tristan</text>
  <text class="muted" x="436" y="283">“married women also like to</text>
  <text class="muted" x="436" y="298">be saved by a knight”</text>
  <line x1="10" y1="310" x2="630" y2="310" stroke="currentColor" stroke-opacity="0.18"/>
  <text class="label" x="16" y="329" font-weight="600">The Ring</text>
  <text class="label" x="134" y="329">Wotan, “the</text>
  <text class="label" x="134" y="344">venerable Almighty”</text>
  <text class="label" x="284" y="329">Siegfried, “a free spirit</text>
  <text class="label" x="284" y="344">and an immoralist”</text>
  <text class="muted" x="436" y="329">the god “compromised himself</text>
  <text class="muted" x="436" y="344">morally in all manner of ways”</text>
  <line x1="10" y1="356" x2="630" y2="356" stroke="currentColor" stroke-opacity="0.18"/>
  <text class="muted" x="16" y="376">Tristan also gets a second joke, about a different character: the husband who “can ask only one question”.</text>
  <text class="muted" x="16" y="393">CW 4 adds an eighth case: the Ring’s author, “saved” by Schopenhauer’s philosophy.</text>
</svg>

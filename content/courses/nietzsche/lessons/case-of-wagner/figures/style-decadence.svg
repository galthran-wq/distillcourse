<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
  </style>
  <defs>
    <marker id="sd-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor" fill-opacity="0.6"/>
    </marker>
  </defs>

  <!-- left: a whole -->
  <text x="155" y="22" text-anchor="middle" fill="#4c8dd6" font-weight="600" font-size="13">a style in which life animates the whole</text>
  <rect x="35" y="40" width="240" height="40" rx="5" fill="#4c8dd6" fill-opacity="0.18" stroke="#4c8dd6"/>
  <text class="label" x="155" y="65" text-anchor="middle" font-weight="600">the whole</text>
  <rect x="55" y="100" width="200" height="34" rx="5" fill="#4c8dd6" fill-opacity="0.12" stroke="#4c8dd6"/>
  <text class="label" x="155" y="122" text-anchor="middle">the page</text>
  <rect x="75" y="154" width="160" height="30" rx="5" fill="#4c8dd6" fill-opacity="0.08" stroke="#4c8dd6"/>
  <text class="label" x="155" y="174" text-anchor="middle">the sentence</text>
  <rect x="95" y="204" width="120" height="26" rx="5" fill="none" stroke="#4c8dd6"/>
  <text class="label" x="155" y="221" text-anchor="middle">the word</text>
  <line x1="155" y1="204" x2="155" y2="186" stroke="#4c8dd6" marker-end="url(#sd-arrow)"/>
  <line x1="155" y1="154" x2="155" y2="136" stroke="#4c8dd6" marker-end="url(#sd-arrow)"/>
  <line x1="155" y1="100" x2="155" y2="82" stroke="#4c8dd6" marker-end="url(#sd-arrow)"/>
  <text class="muted" x="155" y="252" text-anchor="middle">each part serves the larger one</text>

  <!-- right: decadence, the pyramid inverted -->
  <text x="480" y="22" text-anchor="middle" fill="#e2903a" font-weight="600" font-size="13">the style of decadence (CW 7)</text>
  <rect x="370" y="40" width="220" height="40" rx="5" fill="none" stroke="#e2903a" stroke-dasharray="4 3" stroke-opacity="0.7"/>
  <text class="label" x="480" y="57" text-anchor="middle">the whole: “no longer a whole”</text>
  <text class="muted" x="480" y="72" text-anchor="middle">“composed, reckoned up, artificial”</text>
  <rect x="350" y="100" width="260" height="34" rx="5" fill="#e2903a" fill-opacity="0.12" stroke="#e2903a"/>
  <text class="label" x="480" y="122" text-anchor="middle">the page gains life at the whole’s cost</text>
  <rect x="340" y="152" width="280" height="34" rx="5" fill="#e2903a" fill-opacity="0.18" stroke="#e2903a"/>
  <text class="label" x="480" y="174" text-anchor="middle">the sentence overruns its bounds</text>
  <rect x="330" y="204" width="300" height="34" rx="5" fill="#e2903a" fill-opacity="0.32" stroke="#e2903a" stroke-width="1.6"/>
  <text class="label" x="480" y="226" text-anchor="middle" font-weight="600">the word leaps out of the sentence</text>
  <text class="muted" x="480" y="258" text-anchor="middle">life “driven back into the smallest structure”</text>

  <!-- the same shape at three scales -->
  <line x1="20" y1="276" x2="620" y2="276" stroke="currentColor" stroke-opacity="0.25"/>
  <text class="label" x="320" y="300" text-anchor="middle" font-weight="600">the same shape, “the formula for every decadent style”</text>
  <rect x="20" y="316" width="180" height="56" rx="5" fill="#e2903a" fill-opacity="0.10" stroke="#e2903a"/>
  <text class="muted" x="110" y="336" text-anchor="middle">in style</text>
  <text class="label" x="110" y="356" text-anchor="middle">“anarchy among the atoms”</text>
  <rect x="230" y="316" width="180" height="56" rx="5" fill="#e2903a" fill-opacity="0.10" stroke="#e2903a"/>
  <text class="muted" x="320" y="336" text-anchor="middle">in moral terms</text>
  <text class="label" x="320" y="356" text-anchor="middle">“freedom of the individual”</text>
  <rect x="440" y="316" width="180" height="56" rx="5" fill="#e2903a" fill-opacity="0.10" stroke="#e2903a"/>
  <text class="muted" x="530" y="336" text-anchor="middle">as a political theory</text>
  <text class="label" x="530" y="356" text-anchor="middle">“equal rights for all”</text>
  <line x1="200" y1="344" x2="228" y2="344" stroke="currentColor" stroke-opacity="0.6" marker-end="url(#sd-arrow)"/>
  <line x1="410" y1="344" x2="438" y2="344" stroke="currentColor" stroke-opacity="0.6" marker-end="url(#sd-arrow)"/>
  <text class="muted" x="320" y="392" text-anchor="middle">“disaggregation of the will”: the parts no longer obey one direction</text>
</svg>

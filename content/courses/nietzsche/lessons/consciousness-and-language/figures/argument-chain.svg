<svg viewBox="0 0 640 452" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>.label { fill: currentColor; } .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }</style>
  <defs><marker id="chn-arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker></defs>
  <text class="label" x="205" y="20" text-anchor="middle" font-weight="600">Consciousness as communication: the argument</text>
  <rect x="10" y="34" width="390" height="50" rx="4" fill="none" stroke="currentColor" stroke-opacity="0.45"/>
  <text class="label" x="20" y="52" font-size="12.5">1 · most thinking, feeling, willing and acting goes on</text>
  <text class="label" x="20" y="67" font-size="12.5">    without becoming conscious</text>
  <text class="muted" x="392" y="80" text-anchor="end">GS 354 · GS 333 · D 119</text>
  <line x1="205" y1="84" x2="205" y2="94" stroke="currentColor" stroke-opacity="0.6" marker-end="url(#chn-arr)"/>
  <rect x="10" y="95" width="390" height="50" rx="4" fill="none" stroke="currentColor" stroke-opacity="0.45"/>
  <text class="label" x="20" y="113" font-size="12.5">2 · so the existence of consciousness needs an</text>
  <text class="label" x="20" y="128" font-size="12.5">    explanation of its own</text>
  <text class="muted" x="392" y="141" text-anchor="end">GS 354</text>
  <line x1="205" y1="145" x2="205" y2="155" stroke="currentColor" stroke-opacity="0.6" marker-end="url(#chn-arr)"/>
  <rect x="10" y="156" width="390" height="50" rx="4" fill="none" stroke="currentColor" stroke-opacity="0.55" stroke-dasharray="5 4"/>
  <text class="label" x="20" y="174" font-size="12.5">3 · the most endangered animal needed help, and had</text>
  <text class="label" x="20" y="189" font-size="12.5">    to say what it needed</text>
  <text class="muted" x="392" y="202" text-anchor="end">GS 354</text>
  <line x1="205" y1="206" x2="205" y2="216" stroke="currentColor" stroke-opacity="0.6" marker-end="url(#chn-arr)"/>
  <rect x="10" y="217" width="390" height="50" rx="4" fill="none" stroke="currentColor" stroke-opacity="0.45"/>
  <text class="label" x="20" y="235" font-size="12.5">4 · saying needs signs that mean the same thing</text>
  <text class="label" x="20" y="250" font-size="12.5">    to speaker and hearer</text>
  <text class="muted" x="392" y="263" text-anchor="end">BGE 268 · GS 354</text>
  <line x1="205" y1="267" x2="205" y2="277" stroke="currentColor" stroke-opacity="0.6" marker-end="url(#chn-arr)"/>
  <rect x="10" y="278" width="390" height="50" rx="4" fill="#e2903a" fill-opacity="0.12" stroke="#e2903a" stroke-width="1.6"/>
  <text class="label" x="20" y="296" font-size="12.5">5 · a state becomes conscious as it takes the form</text>
  <text class="label" x="20" y="311" font-size="12.5">    of such signs</text>
  <text class="muted" x="392" y="324" text-anchor="end">GS 354</text>
  <line x1="205" y1="328" x2="205" y2="338" stroke="currentColor" stroke-opacity="0.6" marker-end="url(#chn-arr)"/>
  <rect x="10" y="339" width="390" height="50" rx="4" fill="none" stroke="currentColor" stroke-opacity="0.45"/>
  <text class="label" x="20" y="357" font-size="12.5">6 · so consciousness renders inner life in the shared</text>
  <text class="label" x="20" y="372" font-size="12.5">    vocabulary: what is common passes, the individual not</text>
  <text class="muted" x="392" y="385" text-anchor="end">GS 354 · D 115 · BGE 268</text>
  <line x1="205" y1="389" x2="205" y2="399" stroke="currentColor" stroke-opacity="0.6" marker-end="url(#chn-arr)"/>
  <rect x="10" y="400" width="390" height="50" rx="4" fill="none" stroke="currentColor" stroke-opacity="1" stroke-width="1.4"/>
  <text class="label" x="20" y="418" font-size="12.5" font-weight="600">7 · so introspection shows us as more average,</text>
  <text class="label" x="20" y="433" font-size="12.5" font-weight="600">    simpler and more unified than we are</text>
  <text class="muted" x="392" y="446" text-anchor="end">D 119 · GS 335 · GS 355</text>
  <line x1="402" y1="181" x2="420" y2="181" stroke="currentColor" stroke-opacity="0.5" stroke-dasharray="3 3"/>
  <text class="label" x="424" y="176" font-size="12">a conjecture about prehistory,</text>
  <text class="label" x="424" y="192" font-size="12">offered without evidence</text>
  <line x1="402" y1="303" x2="420" y2="303" stroke="#e2903a" stroke-width="1.5"/>
  <text x="424" y="298" font-size="12" font-weight="600" fill="#e2903a">asserted, not argued:</text>
  <text x="424" y="314" font-size="12" font-weight="600" fill="#e2903a">the premise steps 6 and 7</text>
  <text x="424" y="330" font-size="12" font-weight="600" fill="#e2903a">cannot do without</text>
  <line x1="402" y1="242" x2="420" y2="242" stroke="#4c8dd6" stroke-width="1.5"/>
  <text x="424" y="237" font-size="12" fill="#4c8dd6">checkable today:</text>
  <text x="424" y="253" font-size="12" fill="#4c8dd6">try it on any word</text>
  <line x1="402" y1="364" x2="420" y2="364" stroke="#4c8dd6" stroke-width="1.5"/>
  <text x="424" y="359" font-size="12" fill="#4c8dd6">checkable today: words</text>
  <text x="424" y="375" font-size="12" fill="#4c8dd6">exist for the extremes</text>
</svg>

<svg viewBox="0 0 640 262" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>.label { fill: currentColor; } .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }</style>
  <defs><marker id="drm-arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker></defs>
  <text class="label" x="320" y="18" text-anchor="middle" font-weight="600">A dream as a commentary on a felt text (D 119)</text>
  <rect x="10" y="40" width="190" height="150" rx="5" fill="#4c8dd6" fill-opacity="0.14" stroke="#4c8dd6" stroke-width="1.6"/>
  <text x="22" y="62" font-weight="600" fill="#4c8dd6">the text</text>
  <text class="label" x="22" y="84" font-size="12">nervous stimuli in sleep:</text>
  <text class="label" x="22" y="106" font-size="12">church bells, weathercocks,</text>
  <text class="label" x="22" y="124" font-size="12">night-revellers;</text>
  <text class="label" x="22" y="142" font-size="12">the bedclothes, the arm;</text>
  <text class="label" x="22" y="160" font-size="12">the blood and intestines</text>
  <rect x="228" y="40" width="180" height="150" rx="5" fill="none" stroke="currentColor" stroke-opacity="0.25" stroke-dasharray="3 3"/>
  <text class="muted" x="318" y="119" text-anchor="middle">which drive reads it?</text>
  <rect x="436" y="40" width="194" height="150" rx="5" fill="none" stroke="currentColor" stroke-opacity="0.25" stroke-dasharray="3 3"/>
  <text class="muted" x="533" y="119" text-anchor="middle">what story results?</text>
  <text class="label" x="320" y="222" text-anchor="middle" font-size="12.5">the same stimuli arrive every night; they are felt, not seen</text>
  <text class="muted" x="320" y="246" text-anchor="middle">“a more or less fantastic commentary on an unknown, perhaps unknowable, but felt text”</text>
</svg>

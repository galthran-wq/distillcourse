<svg viewBox="0 0 640 262" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>.label { fill: currentColor; } .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }</style>
  <defs><marker id="drm-arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker></defs>
  <text class="label" x="320" y="18" text-anchor="middle" font-weight="600">A dream as a commentary on a felt text (D 119)</text>
  <rect x="10" y="40" width="190" height="150" rx="5" fill="none" stroke="#4c8dd6" stroke-opacity="0.8"/>
  <text x="22" y="62" font-weight="600" fill="#4c8dd6">the text</text>
  <text class="label" x="22" y="84" font-size="12">nervous stimuli in sleep:</text>
  <text class="label" x="22" y="106" font-size="12">church bells, weathercocks,</text>
  <text class="label" x="22" y="124" font-size="12">night-revellers;</text>
  <text class="label" x="22" y="142" font-size="12">the bedclothes, the arm;</text>
  <text class="label" x="22" y="160" font-size="12">the blood and intestines</text>
  <line x1="202" y1="115" x2="226" y2="115" stroke="currentColor" stroke-opacity="0.6" marker-end="url(#drm-arr)"/>
  <rect x="228" y="40" width="180" height="150" rx="5" fill="none" stroke="currentColor" stroke-opacity="0.55"/>
  <text class="muted" x="240" y="62">night one</text>
  <text class="label" x="240" y="104" font-weight="600">drive to tenderness</text>
  <text class="label" x="240" y="122" font-size="12">at high flood, reads</text>
  <text class="label" x="240" y="140" font-size="12">the text for its own use</text>
  <line x1="410" y1="115" x2="434" y2="115" stroke="currentColor" stroke-opacity="0.6" marker-end="url(#drm-arr)"/>
  <rect x="436" y="40" width="194" height="150" rx="5" fill="#e2903a" fill-opacity="0.14" stroke="#e2903a" stroke-width="1.6"/>
  <text x="448" y="62" font-weight="600" fill="#e2903a">the commentary</text>
  <text class="label" x="448" y="100" font-size="12.5">a dream “full of</text>
  <text class="label" x="448" y="118" font-size="12.5">tenderness and tears”</text>
  <text class="label" x="320" y="222" text-anchor="middle" font-size="12.5">this drive posits a cause for the stimuli that lets it discharge itself</text>
  <text class="muted" x="320" y="246" text-anchor="middle">“a more or less fantastic commentary on an unknown, perhaps unknowable, but felt text”</text>
</svg>

  <text class="label" x="320" y="230" text-anchor="middle" font-size="12">Most of the day the affect runs below the line where language has a name for it;</text>
  <text class="label" x="320" y="248" text-anchor="middle" font-size="12">the picture a person forms of himself is drawn from the two peaks.</text>

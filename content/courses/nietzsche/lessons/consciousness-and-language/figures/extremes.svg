  <text x="606" y="106" text-anchor="end" fill="#4c8dd6" font-size="12">words begin here</text>
  <text x="230" y="50" text-anchor="middle" fill="#4c8dd6" font-weight="600">“I was furious”</text>
  <text x="470" y="65" text-anchor="middle" fill="#4c8dd6" font-weight="600">“I lost my temper”</text>
  <text x="350" y="128" text-anchor="middle" fill="#e2903a" font-weight="600" font-size="12">no words:</text>

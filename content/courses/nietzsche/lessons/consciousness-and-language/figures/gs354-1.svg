<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>.label { fill: currentColor; } .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }</style>
  <defs><marker id="g354-arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker><marker id="g354-arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e2903a"/></marker></defs>
  <text class="label" x="320" y="20" text-anchor="middle" font-weight="600">Why consciousness exists: GS 354’s surmise, step by step</text>
  <rect x="6" y="36" width="148" height="96" rx="5" fill="#e2903a" fill-opacity="0.14" stroke="#e2903a" stroke-width="1.6"/>
  <text fill="#e2903a" x="16" y="57" font-weight="600" font-size="12.5" opacity="1">1 · danger</text>
  <text class="label" x="16" y="80" font-size="12" opacity="1">the most endangered</text>
  <text class="label" x="16" y="97" font-size="12" opacity="1">animal needs help,</text>
  <text class="label" x="16" y="114" font-size="12" opacity="1">protection, its peers</text>
  <line x1="155" y1="84" x2="164" y2="84" stroke="currentColor" stroke-opacity="0.2" marker-end="url(#g354-arr)"/>
  <rect x="165" y="36" width="148" height="96" rx="5" fill="none" stroke="currentColor" stroke-opacity="0.25" stroke-dasharray="3 3"/>
  <text class="label" x="175" y="57" font-weight="600" font-size="12.5" opacity="0.22">2 · be understood</text>
  <text class="label" x="175" y="80" font-size="12" opacity="0.22">it must express its</text>
  <text class="label" x="175" y="97" font-size="12" opacity="0.22">distress and make</text>
  <text class="label" x="175" y="114" font-size="12" opacity="0.22">itself understood</text>
  <line x1="314" y1="84" x2="323" y2="84" stroke="currentColor" stroke-opacity="0.2" marker-end="url(#g354-arr)"/>
  <rect x="324" y="36" width="148" height="96" rx="5" fill="none" stroke="currentColor" stroke-opacity="0.25" stroke-dasharray="3 3"/>
  <text class="label" x="334" y="57" font-weight="600" font-size="12.5" opacity="0.22">3 · shared signs</text>
  <text class="label" x="334" y="80" font-size="12" opacity="0.22">words; also a look,</text>
  <text class="label" x="334" y="97" font-size="12" opacity="0.22">a pressure, a gesture,</text>
  <text class="label" x="334" y="114" font-size="12" opacity="0.22">the same for all</text>
  <line x1="473" y1="84" x2="482" y2="84" stroke="currentColor" stroke-opacity="0.2" marker-end="url(#g354-arr)"/>
  <rect x="483" y="36" width="148" height="96" rx="5" fill="none" stroke="currentColor" stroke-opacity="0.25" stroke-dasharray="3 3"/>
  <text class="label" x="493" y="57" font-weight="600" font-size="12.5" opacity="0.22">4 · “knowing” it</text>
  <text class="label" x="493" y="80" font-size="12" opacity="0.22">to say what it lacks</text>
  <text class="label" x="493" y="97" font-size="12" opacity="0.22">it must first “know”</text>
  <text class="label" x="493" y="114" font-size="12" opacity="0.22">what it lacks</text>
  <rect x="10" y="226" width="620" height="84" rx="5" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.3"/>
  <text class="label" x="22" y="248" font-weight="600">below: thinking, feeling, willing, remembering, acting</text>
  <text class="muted" x="22" y="266" font-size="12">going on all the time, “without, as it were, seeing itself in a mirror”</text>
  <circle cx="60" cy="288" r="5" fill="none" stroke="currentColor" stroke-opacity="0.4"/>
  <circle cx="101" cy="298" r="6" fill="none" stroke="currentColor" stroke-opacity="0.4"/>
  <circle cx="142" cy="288" r="7" fill="none" stroke="currentColor" stroke-opacity="0.4"/>
  <circle cx="183" cy="298" r="8" fill="none" stroke="currentColor" stroke-opacity="0.4"/>
  <circle cx="224" cy="288" r="9" fill="none" stroke="currentColor" stroke-opacity="0.4"/>
  <circle cx="265" cy="298" r="10" fill="none" stroke="currentColor" stroke-opacity="0.4"/>
  <circle cx="306" cy="288" r="5" fill="none" stroke="currentColor" stroke-opacity="0.4"/>
  <circle cx="347" cy="298" r="6" fill="none" stroke="currentColor" stroke-opacity="0.4"/>
  <circle cx="388" cy="288" r="7" fill="none" stroke="currentColor" stroke-opacity="0.4"/>
  <circle cx="429" cy="298" r="8" fill="none" stroke="currentColor" stroke-opacity="0.4"/>
  <circle cx="470" cy="288" r="9" fill="none" stroke="currentColor" stroke-opacity="0.4"/>
  <circle cx="511" cy="298" r="10" fill="none" stroke="currentColor" stroke-opacity="0.4"/>
  <circle cx="552" cy="288" r="5" fill="none" stroke="currentColor" stroke-opacity="0.4"/>
  <circle cx="593" cy="298" r="6" fill="none" stroke="currentColor" stroke-opacity="0.4"/>
  <rect x="10" y="168" width="620" height="40" rx="5" fill="none" stroke="currentColor" stroke-opacity="0.2" stroke-dasharray="3 3"/>
  <text class="muted" x="320" y="193" text-anchor="middle">nothing here yet needs to be conscious</text>
  <text class="muted" x="320" y="330" text-anchor="middle">GS 354: consciousness “has developed only under the pressure of the need for communication”</text>
</svg>

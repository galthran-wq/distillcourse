<svg viewBox="0 0 640 234" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>.label { fill: currentColor; } .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }</style>
  <text class="label" x="320" y="18" text-anchor="middle" font-weight="600">A felt state and its translation into shared words</text>
  <text class="muted" x="20" y="44">what is felt: one state, in proportions no one else has</text>
  <rect x="20" y="52" width="150" height="58" fill="#e2903a" fill-opacity="0.22" stroke="#e2903a" stroke-width="1.5"/>
  <text x="95.0" y="77" text-anchor="middle" font-weight="600" fill="#e2903a">sympathy</text>
  <text class="muted" x="95.0" y="97" text-anchor="middle" font-size="11.5">his pain hurts</text>
  <rect x="170" y="52" width="120" height="58" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.45"/>
  <text class="label" x="230.0" y="77" text-anchor="middle" font-weight="600">relief</text>
  <text class="muted" x="230.0" y="97" text-anchor="middle" font-size="11.5">not me</text>
  <rect x="290" y="52" width="110" height="58" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.45"/>
  <text class="label" x="345.0" y="77" text-anchor="middle" font-weight="600">satisfaction</text>
  <text class="muted" x="345.0" y="97" text-anchor="middle" font-size="11.5">I won</text>
  <rect x="400" y="52" width="120" height="58" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.45"/>
  <text class="label" x="460.0" y="77" text-anchor="middle" font-weight="600">unease</text>
  <text class="muted" x="460.0" y="97" text-anchor="middle" font-size="11.5">will he resent me?</text>
  <rect x="520" y="52" width="100" height="58" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.45"/>
  <text class="label" x="570.0" y="77" text-anchor="middle" font-weight="600">fear</text>
  <text class="muted" x="570.0" y="97" text-anchor="middle" font-size="11.5">next time, me</text>
  <path d="M22 118 L22 128 L168 128 L168 118" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <line x1="95" y1="128" x2="95" y2="150" stroke="#e2903a" stroke-width="1.5"/>
  <rect x="20" y="150" width="210" height="34" rx="5" fill="#e2903a" fill-opacity="0.14" stroke="#e2903a"/>
  <text x="125" y="172" text-anchor="middle" font-weight="600" fill="#e2903a">“I feel bad for him.”</text>
  <text class="muted" x="20" y="204" font-size="12">what is said: the one part that has a common word</text>
  <text class="muted" x="20" y="220" font-size="12">and that the hearer will recognise and approve</text>
  <path d="M172 118 L172 128 L618 128 L618 118" fill="none" stroke="currentColor" stroke-opacity="0.5" stroke-dasharray="3 3"/>
  <text class="label" x="455" y="150" text-anchor="middle" font-size="12">dropped:</text>
  <text class="label" x="455" y="168" text-anchor="middle" font-size="12">the proportions, which have no word at all;</text>
  <text class="label" x="455" y="186" text-anchor="middle" font-size="12">the parts whose words exist but would be blamed</text>
  <text class="muted" x="455" y="206" text-anchor="middle" font-size="12">(“I’m glad I won”, “I’m relieved it was him”)</text>
</svg>

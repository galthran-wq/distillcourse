<svg viewBox="0 0 760 366" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .num { font-weight: 600; fill: currentColor; opacity: 0.7; }
    .bracket { fill: none; stroke: #4c8dd6; stroke-width: 1.6; }
    .concl { fill: none; stroke: #e2903a; stroke-width: 2; }
    .gap { fill: none; stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.4; stroke-dasharray: 4 3; }
    .second { fill: none; stroke: #4c8dd6; stroke-width: 1.6; }
    .rule { stroke: currentColor; stroke-opacity: 0.25; stroke-width: 1; }
    .flow { fill: none; stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.4; }
  </style>

  <text class="muted small" x="64" y="20">the section, sentence by sentence</text>
  <text class="muted small" x="500" y="20">what the protocol makes of it</text>

  <!-- premise bracket over S1–S2 -->
  <path class="bracket" d="M56 36 L50 36 L50 140 L56 140"/>
  <text x="16" y="88" fill="#4c8dd6" font-size="11" font-weight="600" transform="rotate(-90 16 88)" text-anchor="middle">premises</text>

  <!-- S1 -->
  <text class="num" x="38" y="50">1</text>
  <text class="label" x="64" y="50">„Das habe ich gethan“ sagt mein Gedächtniss.</text>
  <text class="muted small" x="64" y="66">"I did that," says my memory.</text>
  <text x="500" y="50" fill="#4c8dd6" font-weight="600">P1</text>
  <text class="label small" x="524" y="50">memory and pride report one deed</text>
  <text class="label small" x="524" y="64">incompatibly (sentences 1 and 2)</text>
  <line class="rule" x1="64" y1="76" x2="740" y2="76"/>

  <!-- S2 -->
  <text class="num" x="38" y="96">2</text>
  <text class="label" x="64" y="96">Das kann ich nicht gethan haben — sagt mein Stolz</text>
  <text class="label" x="64" y="112">und bleibt unerbittlich.</text>
  <text class="muted small" x="64" y="128">"I cannot have done that," says my pride, and stays implacable.</text>
  <text x="500" y="96" fill="#4c8dd6" font-weight="600">P2</text>
  <text class="label small" x="524" y="96">when they conflict, pride does not yield</text>
  <text class="label small" x="524" y="110">(bleibt unerbittlich)</text>
  <line class="rule" x1="64" y1="140" x2="740" y2="140"/>

  <!-- S3: the conclusion -->
  <rect class="concl" x="30" y="150" width="440" height="46" rx="5"/>
  <text x="38" y="170" fill="#e2903a" font-weight="600">3</text>
  <text class="label" x="64" y="170">Endlich — giebt das Gedächtniss nach.</text>
  <text class="muted small" x="64" y="186">In the end, memory yields.</text>
  <text x="500" y="170" fill="#e2903a" font-weight="600">C</text>
  <text class="label small" x="524" y="170">what is remembered is edited by</text>
  <text class="label small" x="524" y="184">what pride can bear (conclusion)</text>

  <!-- the gap -->
  <path class="flow" d="M250 196 L250 216"/>
  <rect class="gap" x="30" y="216" width="440" height="52" rx="5"/>
  <text class="label small" x="40" y="234" font-weight="600">missing premise (step 3): a type-fact</text>
  <text class="label small" x="40" y="249">a drive can revise the content of a memory without the person's</text>
  <text class="label small" x="40" y="262">knowledge or consent; P1 and P2 alone leave who yields open</text>

  <!-- arrow out to GS 354 -->
  <path class="flow" d="M470 242 L492 242"/>
  <path class="flow" d="M486 237 L492 242 L486 247"/>
  <rect class="second" x="496" y="216" width="244" height="52" rx="5"/>
  <text x="506" y="234" fill="#4c8dd6" font-size="10.5" font-weight="600">step 4 · GS 354 (1887)</text>
  <text class="label small" x="506" y="249">what becomes conscious is a late,</text>
  <text class="label small" x="506" y="262">edited report of an unmirrored process</text>

  <!-- verdict -->
  <text class="muted small" x="496" y="288">verdict: supplies the premise, generally</text>
  <text class="muted small" x="496" y="302">(licenses the mechanism; pride is not named)</text>

  <!-- step 5 -->
  <line class="rule" x1="64" y1="316" x2="740" y2="316"/>
  <text class="muted small" x="64" y="336">step 5, the rival: a moraliste's joke about vanity. Against it: bleibt unerbittlich and Endlich</text>
  <text class="muted small" x="64" y="352">narrate a contest over time with a winner, which is a mechanism, not an observation.</text>
</svg>

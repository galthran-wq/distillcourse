<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10px; }
    .tick { stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1; }
    .axis { stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.2; }
    .guide { stroke: currentColor; stroke-opacity: 0.35; stroke-width: 1; stroke-dasharray: 3 3; }
    .treatise { fill: #4c8dd6; }
    .aphorism { fill: #e2903a; }
    .drama { fill: #5aa46a; }
    .late-treatise { fill: none; stroke: #4c8dd6; stroke-width: 1.6; stroke-dasharray: 4 3; }
    .late-drama { fill: none; stroke: #5aa46a; stroke-width: 1.6; stroke-dasharray: 4 3; }
    .end { stroke: #e2903a; stroke-width: 1.6; stroke-dasharray: 5 4; }
  </style>

  <!-- year guides -->
  <line class="guide" x1="170" y1="30" x2="170" y2="300"/>
  <line class="guide" x1="230" y1="30" x2="230" y2="300"/>
  <line class="guide" x1="290" y1="30" x2="290" y2="300"/>
  <line class="guide" x1="350" y1="30" x2="350" y2="300"/>
  <line class="guide" x1="410" y1="30" x2="410" y2="300"/>
  <line class="guide" x1="470" y1="30" x2="470" y2="300"/>
  <line class="guide" x1="530" y1="30" x2="530" y2="300"/>
  <line class="guide" x1="590" y1="30" x2="590" y2="300"/>
  <line class="guide" x1="650" y1="30" x2="650" y2="300"/>

  <!-- rows: y = 36 + 22*i, bar height 14; x(year) = 170 + 30*(year-1872) -->
  <text class="label" x="20" y="47">Birth of Tragedy</text>
  <rect class="treatise" x="170" y="36" width="28" height="14" rx="3"/>

  <text class="label" x="20" y="69">Untimely Meditations I–IV</text>
  <rect class="treatise" x="200" y="58" width="118" height="14" rx="3"/>

  <text class="label" x="20" y="91">Human, All Too Human I–II</text>
  <rect class="aphorism" x="350" y="80" width="88" height="14" rx="3"/>

  <text class="label" x="20" y="113">Daybreak</text>
  <rect class="aphorism" x="440" y="102" width="28" height="14" rx="3"/>

  <text class="label" x="20" y="135">Gay Science I–IV · Book V</text>
  <rect class="aphorism" x="470" y="124" width="28" height="14" rx="3"/>
  <rect class="aphorism" x="620" y="124" width="28" height="14" rx="3"/>
  <text class="muted small" x="600" y="120">Book V, 1887</text>

  <text class="label" x="20" y="157">Zarathustra I–III · IV</text>
  <rect class="drama" x="500" y="146" width="58" height="14" rx="3"/>
  <rect class="late-drama" x="560" y="146" width="28" height="14" rx="3"/>
  <text class="muted small" x="500" y="142">IV: 40 copies, 1885</text>

  <text class="label" x="20" y="179">Beyond Good and Evil</text>
  <rect class="aphorism" x="590" y="168" width="28" height="14" rx="3"/>

  <text class="label" x="20" y="201">Genealogy of Morality</text>
  <rect class="treatise" x="620" y="190" width="28" height="14" rx="3"/>

  <text class="label" x="20" y="223">Case of Wagner</text>
  <rect class="treatise" x="650" y="212" width="28" height="14" rx="3"/>

  <text class="label" x="20" y="245">Twilight of the Idols</text>
  <rect class="aphorism" x="650" y="234" width="28" height="14" rx="3"/>

  <text class="label" x="20" y="267">Antichrist</text>
  <rect class="late-treatise" x="650" y="256" width="28" height="14" rx="3"/>
  <text class="muted small" x="640" y="267" text-anchor="end">published 1895</text>

  <text class="label" x="20" y="289">Ecce Homo</text>
  <rect class="late-treatise" x="650" y="278" width="28" height="14" rx="3"/>
  <text class="muted small" x="640" y="289" text-anchor="end">published 1908</text>

  <!-- endpoint -->
  <line class="end" x1="680" y1="26" x2="680" y2="300"/>
  <text x="676" y="20" fill="#e2903a" font-size="11" text-anchor="end">corpus ends: Turin, January 1889</text>

  <!-- axis -->
  <line class="axis" x1="170" y1="312" x2="690" y2="312"/>
  <line class="tick" x1="170" y1="312" x2="170" y2="318"/><text class="muted small" x="170" y="332" text-anchor="middle">1872</text>
  <line class="tick" x1="230" y1="312" x2="230" y2="318"/><text class="muted small" x="230" y="332" text-anchor="middle">1874</text>
  <line class="tick" x1="290" y1="312" x2="290" y2="318"/><text class="muted small" x="290" y="332" text-anchor="middle">1876</text>
  <line class="tick" x1="350" y1="312" x2="350" y2="318"/><text class="muted small" x="350" y="332" text-anchor="middle">1878</text>
  <line class="tick" x1="410" y1="312" x2="410" y2="318"/><text class="muted small" x="410" y="332" text-anchor="middle">1880</text>
  <line class="tick" x1="470" y1="312" x2="470" y2="318"/><text class="muted small" x="470" y="332" text-anchor="middle">1882</text>
  <line class="tick" x1="530" y1="312" x2="530" y2="318"/><text class="muted small" x="530" y="332" text-anchor="middle">1884</text>
  <line class="tick" x1="590" y1="312" x2="590" y2="318"/><text class="muted small" x="590" y="332" text-anchor="middle">1886</text>
  <line class="tick" x1="650" y1="312" x2="650" y2="318"/><text class="muted small" x="650" y="332" text-anchor="middle">1888</text>

  <!-- legend -->
  <rect class="treatise" x="20" y="356" width="18" height="10" rx="2"/><text class="label small" x="44" y="365">treatise or essay: cite as a step in an argument</text>
  <rect class="aphorism" x="20" y="376" width="18" height="10" rx="2"/><text class="label small" x="44" y="385">aphorism collection: cite the section, whole</text>
  <rect class="drama" x="360" y="356" width="18" height="10" rx="2"/><text class="label small" x="384" y="365">dramatization: testimony from a character</text>
  <rect class="late-treatise" x="360" y="376" width="18" height="10" rx="2"/><text class="label small" x="384" y="385">dashed: privately printed, or published after 1889</text>
</svg>

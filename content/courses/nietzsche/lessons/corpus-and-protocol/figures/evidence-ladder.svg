<svg viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tag { font-weight: 600; }
    .grounds { fill: none; stroke: #e2903a; stroke-width: 1.8; }
    .corr { fill: none; stroke: #4c8dd6; stroke-width: 1.8; }
    .dates { fill: none; stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.4; stroke-dasharray: 4 3; }
    .rail { stroke: currentColor; stroke-opacity: 0.35; stroke-width: 1; }
  </style>

  <line class="rail" x1="12" y1="20" x2="12" y2="366"/>
  <line class="rail" x1="668" y1="20" x2="668" y2="366"/>

  <!-- rung 1 -->
  <rect class="grounds" x="24" y="22" width="270" height="48" rx="5"/>
  <text class="label tag" x="36" y="41">Published works</text>
  <text class="muted small" x="36" y="59">18 titles, 1872–1888 · GT … GD</text>
  <text x="314" y="41" fill="#e2903a" font-weight="600">grounds a claim</text>
  <text class="muted small" x="314" y="59">every premise in this course rests here unless flagged</text>

  <!-- rung 2 -->
  <rect class="grounds" x="24" y="80" width="270" height="48" rx="5"/>
  <text class="label tag" x="36" y="99">Private publications</text>
  <text class="muted small" x="36" y="117">3 · Zarathustra IV (40 copies) · N. contra Wagner</text>
  <text x="314" y="99" fill="#e2903a" font-weight="600">grounds, print run noted</text>
  <text class="muted small" x="314" y="117">printed on his order for a chosen audience, not the public</text>

  <!-- rung 3 -->
  <rect class="grounds" x="24" y="138" width="270" height="48" rx="5"/>
  <text class="label tag" x="36" y="157">Authorized manuscripts</text>
  <text class="muted small" x="36" y="175">3 · Antichrist · Ecce Homo · Dithyrambs</text>
  <text x="314" y="157" fill="#e2903a" font-weight="600">grounds, editing flagged</text>
  <text class="muted small" x="314" y="175">"prepared for publication" (Clark); printed by the Archiv</text>

  <!-- rung 4 -->
  <rect class="corr" x="24" y="196" width="270" height="48" rx="5"/>
  <text class="label tag" x="36" y="215">Posthumous writings</text>
  <text class="muted small" x="36" y="233">9 early essays · e.g. "On Truth and Lie" (1873)</text>
  <text x="314" y="215" fill="#4c8dd6" font-weight="600">corroborates; dates an early view</text>
  <text class="muted small" x="314" y="233">finished prose he chose not to print</text>

  <!-- rung 5 -->
  <rect class="corr" x="24" y="254" width="270" height="48" rx="5"/>
  <text class="label tag" x="36" y="273">Posthumous fragments (Nachlass)</text>
  <text class="muted small" x="36" y="291">176 groups, 1869–1889 · e.g. NF-1881,11[141]</text>
  <text x="314" y="273" fill="#4c8dd6" font-weight="600">corroborates and dates; never grounds</text>
  <text class="muted small" x="314" y="291">a draft, a plan, or a discarded thought, in writing order</text>

  <!-- rung 6 -->
  <rect class="dates" x="24" y="312" width="270" height="48" rx="5"/>
  <text class="label tag" x="36" y="331">Letters</text>
  <text class="muted small" x="36" y="349">BVN 1850–1889 · last: BVN-1889,1256</text>
  <text class="label" x="314" y="331" font-weight="600">dates</text>
  <text class="muted small" x="314" y="349">evidence about the writer's hand and days, not a premise</text>

  <text class="muted small" x="340" y="388" text-anchor="middle">the six categories of the critical edition, top to bottom, with what each may do in a reconstruction</text>
</svg>

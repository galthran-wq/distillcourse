<svg viewBox="0 0 720 430" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .num { font-weight: 600; fill: currentColor; opacity: 0.7; }
    .bracket { fill: none; stroke: #4c8dd6; stroke-width: 1.6; }
    .concl { fill: none; stroke: #e2903a; stroke-width: 2; }
    .rule { stroke: currentColor; stroke-opacity: 0.25; stroke-width: 1; }
  </style>

  <text class="muted small" x="64" y="20">the section, sentence by sentence</text>
  <text class="muted small" x="540" y="20">where the treatise takes it up</text>

  <!-- S1 -->
  <text class="num" x="38" y="46">1</text>
  <text class="label" x="64" y="46">What do ascetic ideals mean?</text>
  <text class="muted small" x="540" y="46">the question of §§1–28</text>
  <line class="rule" x1="64" y1="56" x2="700" y2="56"/>

  <!-- outline bracket, S2–S7 -->
  <path class="bracket" d="M56 66 L50 66 L50 250 L56 250"/>
  <text x="16" y="158" fill="#4c8dd6" font-size="11" font-weight="600" transform="rotate(-90 16 158)" text-anchor="middle">outline</text>

  <!-- S2 -->
  <text class="num" x="38" y="80">2</text>
  <text class="label" x="64" y="80">artists: nothing, or too many things</text>
  <text class="muted small" x="540" y="80">§§2–5 (Wagner)</text>

  <!-- S3 -->
  <text class="num" x="38" y="112">3</text>
  <text class="label" x="64" y="112">philosophers and scholars: an instinct for the conditions of spirit</text>
  <text class="muted small" x="540" y="112">§§6–10 (Schopenhauer)</text>

  <!-- S4 -->
  <text class="num" x="38" y="144">4</text>
  <text class="label" x="64" y="144">women: one more charm of seduction</text>
  <text class="muted small" x="540" y="144">never taken up</text>

  <!-- S5 -->
  <text class="num" x="38" y="176">5</text>
  <text class="label" x="64" y="176">the physiologically failed, the majority: a way to seem "too good"</text>
  <text class="muted small" x="540" y="176">§§13–21 (the sick herd)</text>

  <!-- S6 -->
  <text class="num" x="38" y="208">6</text>
  <text class="label" x="64" y="208">priests: their best instrument of power</text>
  <text class="muted small" x="540" y="208">§§11–22 (the ascetic priest)</text>

  <!-- S7 -->
  <text class="num" x="38" y="240">7</text>
  <text class="label" x="64" y="240">saints: a pretext for hibernation, "rest in nothingness"</text>
  <text class="muted small" x="540" y="240">folded into the priest</text>

  <line class="rule" x1="64" y1="256" x2="700" y2="256"/>
  <text class="muted small" x="64" y="276">not in the list, added by the treatise: modern science as the ideal's latest form</text>
  <text class="muted small" x="540" y="276">§§23–27</text>
  <line class="rule" x1="64" y1="286" x2="700" y2="286"/>

  <!-- S8: the formula -->
  <rect class="concl" x="30" y="298" width="490" height="74" rx="5"/>
  <text x="38" y="318" fill="#e2903a" font-weight="600">8</text>
  <text class="label" x="64" y="318">That the ascetic ideal has meant so much to man expresses the basic</text>
  <text class="label" x="64" y="336">fact of the human will, its horror vacui: it needs a goal, and it would</text>
  <text class="label" x="64" y="354">rather will nothingness than not will.</text>
  <text class="muted small" x="540" y="318">§28, the last section,</text>
  <text class="muted small" x="540" y="336">returns to this sentence</text>
  <text x="540" y="360" fill="#e2903a" font-size="11" font-weight="600">conclusion</text>

  <!-- S9 -->
  <text class="num" x="38" y="398">9</text>
  <text class="label" x="64" y="398">Do you understand me? … Have I been understood? … "Not at all!" So let us start again.</text>
  <text class="muted small" x="64" y="418">the coda: the formula is read off, not yet deciphered (GM Preface §8)</text>
</svg>

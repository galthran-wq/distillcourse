<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tag { font-weight: 600; }
    .hyp { fill: none; stroke: #e2903a; stroke-width: 2; }
    .site { fill: none; stroke: #4c8dd6; stroke-width: 1.6; }
    .arrow { stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.2; fill: none; }
  </style>

  <rect class="hyp" x="30" y="16" width="580" height="96" rx="6"/>
  <text x="42" y="38" fill="#e2903a" font-weight="600">Working hypothesis</text>
  <text class="label" x="42" y="60"><tspan class="tag">Methodological naturalism:</tspan> explanations continuous with the sciences in method</text>
  <text class="label" x="42" y="76">(causal, empirical, type-based) and in results</text>
  <text class="label" x="42" y="98"><tspan class="tag">Doctrine of Types:</tspan> a fixed psycho-physical constitution bounds a life without fixing it</text>

  <path class="arrow" d="M140 112 L140 156"/><path class="arrow" d="M135 150 L140 157 L145 150"/>
  <path class="arrow" d="M320 112 L320 156"/><path class="arrow" d="M315 150 L320 157 L325 150"/>
  <path class="arrow" d="M520 112 L520 156"/><path class="arrow" d="M515 150 L520 157 L525 150"/>

  <rect class="site" x="30" y="160" width="200" height="122" rx="5"/>
  <text x="42" y="181" fill="#4c8dd6" font-weight="600">Sovereign individual</text>
  <text class="muted small" x="42" y="197">GM II:2</text>
  <text class="label small" x="42" y="219">prediction: a natural artefact of</text>
  <text class="label small" x="42" y="233">the morality of custom, not an</text>
  <text class="label small" x="42" y="247">ideal of autonomy</text>
  <text class="muted small" x="42" y="271">tested: Second Treatise module</text>

  <rect class="site" x="242" y="160" width="200" height="122" rx="5"/>
  <text x="254" y="181" fill="#4c8dd6" font-weight="600">Value creation</text>
  <text class="muted small" x="254" y="197">GS 301</text>
  <text class="label small" x="254" y="219">prediction: explicable without a</text>
  <text class="label small" x="254" y="233">faculty of legislation, as what</text>
  <text class="label small" x="254" y="247">a type does</text>
  <text class="muted small" x="254" y="271">tested: Positive Doctrine module</text>

  <rect class="site" x="454" y="160" width="156" height="122" rx="5"/>
  <text x="466" y="181" fill="#4c8dd6" font-weight="600">Will to power,</text>
  <text x="466" y="195" fill="#4c8dd6" font-weight="600">eternal recurrence</text>
  <text class="muted small" x="466" y="209">BGE 36 · GS 341</text>
  <text class="label small" x="466" y="229">prediction: survive as</text>
  <text class="label small" x="466" y="243">psychology, not as</text>
  <text class="label small" x="466" y="257">cosmology</text>
  <text class="muted small" x="466" y="271">tested: Modules 5 to 7</text>

  <text class="muted small" x="320" y="308" text-anchor="middle">three sections where the hypothesis can fail; the audit lesson sums the record</text>
  <text class="muted small" x="320" y="324" text-anchor="middle">amber: the hypothesis · blue: the test sites</text>
</svg>

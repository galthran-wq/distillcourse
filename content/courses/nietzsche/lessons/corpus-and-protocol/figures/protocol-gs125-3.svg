<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tag { font-weight: 600; }
    .todo { fill: none; stroke: currentColor; stroke-opacity: 0.35; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .done { fill: none; stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.2; }
    .now { fill: none; stroke: #e2903a; stroke-width: 2; }
    .content { fill: none; stroke: #4c8dd6; stroke-width: 1.4; }
    .strike { stroke: #e2903a; stroke-width: 1.6; }
    .link { stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.2; }
  </style>

  <text class="muted small" x="20" y="20">the protocol</text>
  <text class="muted small" x="196" y="20">run on GS 125, the madman</text>
  <rect class="done" x="20" y="30" width="160" height="56" rx="5"/>
  <text class="tag" x="32" y="52">Step 1</text>
  <text class="label small" x="32" y="72">Locate the claim</text>
  <line class="link" x1="180" y1="58" x2="194" y2="58"/>
  <rect class="content" x="196" y="30" width="424" height="56" rx="5"/>
  <text class="label small" x="206" y="52">C: European morality must fall, and its heirs do not yet know it</text>
  <text class="muted small" x="206" y="72">FW-125 (the parable) with FW-343 (the sentence that names morality)</text>
  <rect class="done" x="20" y="102" width="160" height="56" rx="5"/>
  <text class="tag" x="32" y="124">Step 2</text>
  <text class="label small" x="32" y="144">List the stated premises</text>
  <line class="link" x1="180" y1="130" x2="194" y2="130"/>
  <rect class="content" x="196" y="102" width="424" height="56" rx="5"/>
  <text class="label small" x="206" y="124">P1 dependence: FW-343 · P2 collapse: FW-125 ('we have killed him')</text>
  <text class="muted small" x="206" y="144">P3 foundation rule: FW-125, 343 · P4 delay: FW-125 ('too early'), FW-108</text>
  <rect class="now" x="20" y="174" width="160" height="56" rx="5"/>
  <text class="tag" x="32" y="196" fill="#e2903a">Step 3</text>
  <text class="label small" x="32" y="216">Name the missing premise</text>
  <line class="link" x1="180" y1="202" x2="194" y2="202"/>
  <rect class="content" x="196" y="174" width="424" height="56" rx="5"/>
  <text class="label small" x="206" y="196">no other foundation can carry the same values</text>
  <text class="muted small" x="206" y="216">class: a historical-normative assertion; stated nowhere in The Gay Science</text>
  <rect class="todo" x="20" y="246" width="160" height="56" rx="5"/>
  <text class="tag" x="32" y="268">Step 4</text>
  <text class="label small" x="32" y="288">Check a second passage</text>
  <rect class="todo" x="20" y="318" width="160" height="56" rx="5"/>
  <text class="tag" x="32" y="340">Step 5</text>
  <text class="label small" x="32" y="360">State the opposite reading</text>
  <text class="muted small" x="320" y="392" text-anchor="middle">frame 3 of 5: step 3 filled in; the rest of the layout is unchanged</text>
</svg>

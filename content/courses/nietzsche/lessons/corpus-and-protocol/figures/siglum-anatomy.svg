<svg viewBox="0 0 760 262" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tok { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 20px; font-weight: 600; fill: currentColor; }
    .cat { fill: #e2903a; }
    .loc { fill: #4c8dd6; }
    .rule { stroke: currentColor; stroke-opacity: 0.25; stroke-width: 1; }
  </style>

  <text class="muted small" x="40" y="20">the siglum</text>
  <text class="muted small" x="250" y="20">what each part of it says</text>

  <!-- published work -->
  <text class="tok" x="40" y="58"><tspan class="cat">GM</tspan>-<tspan class="loc">I</tspan>-13</text>
  <text class="label small" x="250" y="48"><tspan fill="#e2903a" font-weight="600">GM</tspan> the book, Zur Genealogie der Moral · <tspan fill="#4c8dd6" font-weight="600">I</tspan> the part, First Treatise · <tspan font-weight="600">13</tspan> the section</text>
  <text class="muted small" x="250" y="64">prefix names a published work: the top rung, grounds a claim</text>
  <line class="rule" x1="40" y1="78" x2="740" y2="78"/>

  <!-- notebook fragment -->
  <text class="tok" x="40" y="116"><tspan class="cat">NF</tspan>-<tspan class="loc">1881</tspan>,11[141]</text>
  <text class="label small" x="250" y="106"><tspan fill="#e2903a" font-weight="600">NF</tspan> a posthumous fragment · <tspan fill="#4c8dd6" font-weight="600">1881</tspan> year written · <tspan font-weight="600">11[141]</tspan> notebook group 11, fragment 141</text>
  <text class="muted small" x="250" y="122">prefix names the Nachlass: corroborates and dates, never grounds</text>
  <line class="rule" x1="40" y1="136" x2="740" y2="136"/>

  <!-- letter -->
  <text class="tok" x="40" y="174"><tspan class="cat">BVN</tspan>-<tspan class="loc">1889</tspan>,1245</text>
  <text class="label small" x="250" y="164"><tspan fill="#e2903a" font-weight="600">BVN</tspan> a letter by Nietzsche · <tspan fill="#4c8dd6" font-weight="600">1889</tspan> the year · <tspan font-weight="600">1245</tspan> the running number</text>
  <text class="muted small" x="250" y="180">prefix names a letter: dates, and is not a premise</text>
  <line class="rule" x1="40" y1="194" x2="740" y2="194"/>

  <!-- address -->
  <text class="label small" x="40" y="218">nietzschesource.org/#eKGWB/ <tspan font-weight="600">+ siglum</tspan> opens the German text, with the edition's corrections marked inline</text>

  <!-- legend -->
  <text class="small" x="40" y="246"><tspan fill="#e2903a" font-weight="600">amber</tspan> <tspan class="muted">the category of the edition, and so the rung on the ladder</tspan>   <tspan fill="#4c8dd6" font-weight="600">blue</tspan> <tspan class="muted">where in the book, or when in the notebooks</tspan></text>
</svg>

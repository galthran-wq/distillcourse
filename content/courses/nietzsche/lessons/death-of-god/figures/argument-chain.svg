<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.6; font-size: 12px; }
    .box { fill: none; stroke: currentColor; stroke-opacity: 0.45; }
    .guide { stroke: currentColor; stroke-dasharray: 3 3; opacity: 0.5; fill: none; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e2903a"/></marker>
  </defs>
  <text class="label" x="200" y="20" text-anchor="middle" font-weight="600">“God is dead” as an argument</text>

  <rect class="box" x="10" y="32" width="380" height="46" rx="4"/>
  <text class="label" x="22" y="52">1 · Europe held its values because God</text>
  <text class="label" x="22" y="70">    stood behind them</text>
  <line x1="200" y1="78" x2="200" y2="94" stroke="currentColor" stroke-opacity="0.6" marker-end="url(#arr)"/>

  <rect class="box" x="10" y="96" width="380" height="46" rx="4"/>
  <text class="label" x="22" y="116">2 · the belief in God has become unbelievable:</text>
  <text class="label" x="22" y="134">    discredited, not refuted</text>
  <line x1="200" y1="142" x2="200" y2="158" stroke="currentColor" stroke-opacity="0.6" marker-end="url(#arr)"/>

  <rect class="box" x="10" y="160" width="380" height="46" rx="4"/>
  <text class="label" x="22" y="180">3 · when its ground goes, a value loses its</text>
  <text class="label" x="22" y="198">    standing, whether anyone notices or not</text>
  <line x1="200" y1="206" x2="200" y2="254" stroke="currentColor" stroke-opacity="0.6" marker-end="url(#arr)"/>

  <rect x="410" y="196" width="220" height="62" rx="4" fill="#e2903a" fill-opacity="0.12" stroke="#e2903a" stroke-dasharray="5 3"/>
  <text x="422" y="216" font-weight="600" fill="#e2903a">unstated premise</text>
  <text class="label" x="422" y="234">these values had no other</text>
  <text class="label" x="422" y="251">ground than God</text>
  <line x1="410" y1="228" x2="206" y2="230" stroke="#e2903a" stroke-width="1.5" marker-end="url(#arr-a)"/>

  <rect class="box" x="10" y="256" width="380" height="46" rx="4" stroke-opacity="1"/>
  <text class="label" x="22" y="276" font-weight="600">4 · so “the whole of our European morality”</text>
  <text class="label" x="22" y="294" font-weight="600">    has lost its foundation</text>
  <line x1="200" y1="302" x2="200" y2="318" stroke="currentColor" stroke-opacity="0.6" marker-end="url(#arr)"/>

  <rect class="box" x="10" y="320" width="380" height="46" rx="4"/>
  <text class="label" x="22" y="340">5 · most keep the morality and drop the God:</text>
  <text class="label" x="22" y="358">    the shadow is still shown</text>

  <rect x="410" y="300" width="220" height="66" rx="4" fill="none" stroke="currentColor" stroke-opacity="0.55" stroke-dasharray="2 3"/>
  <text class="muted" x="422" y="320">second premise: why losing</text>
  <text class="muted" x="422" y="337">these values is a catastrophe,</text>
  <text class="muted" x="422" y="354">not a relief</text>
  <line class="guide" x1="390" y1="280" x2="410" y2="320"/>
  <text class="muted" x="200" y="390" text-anchor="middle">steps 1–4: GS 343 and TI Skirmishes 5 · step 5: GS 108, 125</text>
</svg>

<svg viewBox="0 0 640 230" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.6; font-size: 12px; }
    .guide { stroke: currentColor; stroke-dasharray: 3 3; opacity: 0.5; fill: none; }
  </style>
  <text class="label" x="320" y="20" text-anchor="middle" font-weight="600">The deed and its news: two images for one lag</text>

  <!-- star -->
  <circle cx="60" cy="80" r="14" fill="none" stroke="#4c8dd6" stroke-width="1.5" stroke-dasharray="3 2"/>
  <text x="60" y="114" text-anchor="middle" fill="#4c8dd6" font-size="12">the star has</text>
  <text x="60" y="129" text-anchor="middle" fill="#4c8dd6" font-size="12">gone out</text>
  <line x1="80" y1="80" x2="540" y2="80" stroke="#e2903a" stroke-width="2" stroke-dasharray="10 6"/>
  <text x="310" y="70" text-anchor="middle" fill="#e2903a" font-size="12">its old light still travelling</text>
  <circle cx="570" cy="80" r="7" fill="currentColor"/>
  <text class="label" x="570" y="110" text-anchor="middle" font-size="12">we still see</text>
  <text class="label" x="570" y="125" text-anchor="middle" font-size="12">it shine</text>
  <text class="muted" x="310" y="96" text-anchor="middle">GS 125: “the light of the stars requires time”</text>

  <line class="guide" x1="20" y1="145" x2="620" y2="145"/>

  <!-- cave -->
  <path d="M30 220 Q30 160 110 160 L250 160 Q300 160 300 220" fill="none" stroke="currentColor" stroke-opacity="0.5"/>
  <ellipse cx="200" cy="195" rx="46" ry="20" fill="#e2903a" fill-opacity="0.25"/>
  <text x="200" y="199" text-anchor="middle" fill="#e2903a" font-size="12">the shadow</text>
  <text class="muted" x="90" y="190" text-anchor="middle">Buddha</text>
  <text class="muted" x="90" y="205" text-anchor="middle">long dead</text>
  <text class="label" x="330" y="180" font-size="12">GS 108: the shadow is shown for centuries;</text>
  <text class="label" x="330" y="198" font-size="12">God’s, “for thousands of years”</text>
  <text class="muted" x="330" y="216">the belief is gone; its after-effects remain</text>
</svg>

<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.6; font-size: 12px; }
    .box { fill: none; stroke: currentColor; stroke-opacity: 0.45; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker>
  </defs>
  <rect class="box" x="170" y="10" width="300" height="40" rx="4"/>
  <text class="label" x="320" y="35" text-anchor="middle" font-weight="600">God commands love of neighbour.</text>
  <line x1="260" y1="50" x2="160" y2="80" stroke="currentColor" stroke-opacity="0.6" marker-end="url(#arr)"/>
  <line x1="380" y1="50" x2="480" y2="80" stroke="currentColor" stroke-opacity="0.6" marker-end="url(#arr)"/>

  <rect x="10" y="82" width="300" height="62" rx="4" fill="#4c8dd6" fill-opacity="0.10" stroke="#4c8dd6"/>
  <text x="22" y="104" font-weight="600" fill="#4c8dd6">commanded because good</text>
  <text class="label" x="22" y="124">God is a witness to a good that</text>
  <text class="label" x="22" y="140">holds without him</text>
  <rect x="330" y="82" width="300" height="62" rx="4" fill="#e2903a" fill-opacity="0.10" stroke="#e2903a"/>
  <text x="342" y="104" font-weight="600" fill="#e2903a">good because commanded</text>
  <text class="label" x="342" y="124">God is the source; the value</text>
  <text class="label" x="342" y="140">holds only through him</text>

  <line x1="160" y1="144" x2="160" y2="166" stroke="currentColor" stroke-opacity="0.6" marker-end="url(#arr)"/>
  <line x1="480" y1="144" x2="480" y2="166" stroke="currentColor" stroke-opacity="0.6" marker-end="url(#arr)"/>
  <rect class="box" x="10" y="168" width="300" height="44" rx="4"/>
  <text class="label" x="22" y="188">if God dies: nothing changes</text>
  <text class="muted" x="22" y="204">the objection’s horn</text>
  <rect class="box" x="330" y="168" width="300" height="44" rx="4"/>
  <text class="label" x="342" y="188">if God dies: the value falls</text>
  <text class="muted" x="342" y="204">GS 343’s conclusion</text>

  <rect x="10" y="226" width="300" height="64" rx="4" fill="none" stroke="currentColor" stroke-dasharray="5 3"/>
  <text class="label" x="22" y="246" font-weight="600">TI Skirmishes 5 attacks here:</text>
  <text class="label" x="22" y="264">which good would anyone see without</text>
  <text class="label" x="22" y="281">the tradition? “not self-evident”</text>
</svg>

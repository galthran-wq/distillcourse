<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.6; font-size: 12px; }
    .box { fill: none; stroke: currentColor; stroke-opacity: 0.35; }
  </style>
  <text class="label" x="320.0" y="20" text-anchor="middle" font-weight="600">GS 125, the madman, in four movements</text>

  <rect x="10" y="34" width="306" height="118" rx="5" fill="#e2903a" fill-opacity="0.10" stroke="#e2903a" stroke-width="1.5"/>
  <text x="22" y="56" font-weight="600" fill="#e2903a">1 · morning, the market</text>
  <text class="label" x="22" y="80">A lantern lit in broad daylight:</text>
  <text class="label" x="22" y="99">“I seek God! I seek God!”</text>
  <text class="muted" x="22" y="118">The listeners do not believe in God.</text>
  <text class="muted" x="22" y="137">They laugh: is he lost? has he emigrated?</text>
  <rect class="box" x="324" y="34" width="306" height="118" rx="5" stroke-dasharray="3 3"/>
  <text class="muted" x="477.0" y="97.0" text-anchor="middle">2 · the indictment</text>
  <rect class="box" x="10" y="166" width="306" height="118" rx="5" stroke-dasharray="3 3"/>
  <text class="muted" x="163.0" y="229.0" text-anchor="middle">3 · the demand</text>
  <rect class="box" x="324" y="166" width="306" height="118" rx="5" stroke-dasharray="3 3"/>
  <text class="muted" x="477.0" y="229.0" text-anchor="middle">4 · too early</text>
</svg>

<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.6; font-size: 12px; }
    .box { fill: none; stroke: currentColor; stroke-opacity: 0.35; }
  </style>
  <text class="label" x="320.0" y="20" text-anchor="middle" font-weight="600">GS 125, the madman, in four movements</text>

  <rect class="box" x="10" y="34" width="306" height="118" rx="5"/>
  <text class="label" x="22" y="56" font-weight="600">1 · morning, the market</text>
  <text class="label" x="22" y="80">A lantern lit in broad daylight:</text>
  <text class="label" x="22" y="99">“I seek God! I seek God!”</text>
  <text class="muted" x="22" y="118">The listeners do not believe in God.</text>
  <text class="muted" x="22" y="137">They laugh: is he lost? has he emigrated?</text>
  <rect class="box" x="324" y="34" width="306" height="118" rx="5"/>
  <text class="label" x="336" y="56" font-weight="600">2 · the indictment</text>
  <text class="label" x="336" y="80">“We have killed him — you and I.”</text>
  <text class="muted" x="336" y="99">The sea drunk up, the horizon wiped away,</text>
  <text class="muted" x="336" y="118">the earth unchained from its sun:</text>
  <text class="muted" x="336" y="137">no up, no down, “an infinite nothing”.</text>
  <rect class="box" x="10" y="166" width="306" height="118" rx="5"/>
  <text class="label" x="22" y="188" font-weight="600">3 · the demand</text>
  <text class="label" x="22" y="212">“Must we ourselves not become gods</text>
  <text class="label" x="22" y="231">simply to appear worthy of it?”</text>
  <text class="muted" x="22" y="250">The deed asks something of those</text>
  <text class="muted" x="22" y="269">who did it.</text>
  <rect x="324" y="166" width="306" height="118" rx="5" fill="#e2903a" fill-opacity="0.10" stroke="#e2903a" stroke-width="1.5"/>
  <text x="336" y="188" font-weight="600" fill="#e2903a">4 · too early</text>
  <text class="label" x="336" y="212">The lantern thrown down; it goes out.</text>
  <text class="label" x="336" y="231">“The light of the stars requires time.”</text>
  <text class="muted" x="336" y="250">The deed is done; its news has not arrived.</text>
  <text class="muted" x="336" y="269">The churches: “tombs and sepulchers of God”.</text>
</svg>

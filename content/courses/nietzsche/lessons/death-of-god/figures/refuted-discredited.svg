<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.6; font-size: 12px; }
    .box { fill: none; stroke: currentColor; stroke-opacity: 0.4; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker>
  </defs>
  <text x="160" y="22" text-anchor="middle" font-weight="600" fill="#4c8dd6">Refuting a belief</text>
  <text x="480" y="22" text-anchor="middle" font-weight="600" fill="#e2903a">Discrediting a belief</text>

  <rect class="box" x="20" y="36" width="280" height="40" rx="4"/>
  <text class="label" x="160" y="61" text-anchor="middle">“there is a God”</text>
  <rect class="box" x="340" y="36" width="280" height="40" rx="4"/>
  <text class="label" x="480" y="61" text-anchor="middle">“there is a God”</text>

  <line x1="160" y1="76" x2="160" y2="100" stroke="currentColor" stroke-opacity="0.6" marker-end="url(#arr)"/>
  <rect x="20" y="102" width="280" height="76" rx="4" fill="#4c8dd6" fill-opacity="0.10" stroke="#4c8dd6"/>
  <text class="label" x="32" y="124">attack the proofs; offer a</text>
  <text class="label" x="32" y="143">counter-proof that God does not exist</text>
  <text class="muted" x="32" y="165">aims at: the belief is false</text>

  <line x1="480" y1="76" x2="480" y2="100" stroke="currentColor" stroke-opacity="0.6" marker-end="url(#arr)"/>
  <rect x="340" y="102" width="280" height="76" rx="4" fill="#e2903a" fill-opacity="0.10" stroke="#e2903a"/>
  <text class="label" x="352" y="124">1 · no proof has succeeded</text>
  <text class="label" x="352" y="143">2 · explain how the belief arose and</text>
  <text class="label" x="352" y="162">got its weight, never using its truth</text>

  <line x1="160" y1="178" x2="160" y2="202" stroke="currentColor" stroke-opacity="0.6" marker-end="url(#arr)"/>
  <rect class="box" x="20" y="204" width="280" height="56" rx="4"/>
  <text class="label" x="32" y="226">leaves a doubt: a better proof</text>
  <text class="label" x="32" y="245">may yet be found</text>

  <line x1="480" y1="178" x2="480" y2="202" stroke="currentColor" stroke-opacity="0.6" marker-end="url(#arr)"/>
  <rect class="box" x="340" y="204" width="280" height="56" rx="4" stroke-opacity="1"/>
  <text class="label" x="352" y="226">no reason left to take it seriously:</text>
  <text class="label" x="352" y="245">a counter-proof becomes superfluous</text>

  <text class="muted" x="480" y="284" text-anchor="middle">the child who believes in ghosts in her room,</text>
  <text class="muted" x="480" y="301" text-anchor="middle">after a horror film that evening: no search needed</text>
  <text class="muted" x="160" y="284" text-anchor="middle">every refutation invites a reply</text>
</svg>

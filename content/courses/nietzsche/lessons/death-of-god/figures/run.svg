<svg viewBox="0 0 640 170" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.6; font-size: 11px; }
    .box { fill: none; stroke: currentColor; stroke-opacity: 0.4; }
    .guide { stroke: currentColor; stroke-dasharray: 3 3; opacity: 0.5; fill: none; }
  </style>
  <text class="label" x="320.0" y="20" text-anchor="middle" font-weight="600">The Gay Science, Book Three (1882): the run around § 125</text>
  <rect class="box" x="11" y="36" width="118" height="96" rx="5"/>
  <text class="label" x="70.0" y="56" text-anchor="middle" font-weight="600">§ 108</text>
  <text class="muted" x="70.0" y="80" text-anchor="middle">God is dead;</text>
  <text class="muted" x="70.0" y="96" text-anchor="middle">his shadow</text>
  <text class="muted" x="70.0" y="112" text-anchor="middle">is still shown</text>
  <rect class="box" x="136" y="36" width="118" height="96" rx="5"/>
  <text class="label" x="195.0" y="56" text-anchor="middle" font-weight="600">§ 109–110</text>
  <text class="muted" x="195.0" y="80" text-anchor="middle">nature de-deified;</text>
  <text class="muted" x="195.0" y="96" text-anchor="middle">beliefs last by</text>
  <text class="muted" x="195.0" y="112" text-anchor="middle">use, not by truth</text>
  <rect class="box" x="261" y="36" width="118" height="96" rx="5"/>
  <text class="label" x="320.0" y="56" text-anchor="middle" font-weight="600">§ 124</text>
  <text class="muted" x="320.0" y="80" text-anchor="middle">bridges burned;</text>
  <text class="muted" x="320.0" y="96" text-anchor="middle">the open sea,</text>
  <text class="muted" x="320.0" y="112" text-anchor="middle">no land left</text>
  <rect x="386" y="36" width="118" height="96" rx="5" fill="#e2903a" fill-opacity="0.12" stroke="#e2903a" stroke-width="1.5"/>
  <text x="445.0" y="56" text-anchor="middle" font-weight="600" fill="#e2903a">§ 125</text>
  <text class="muted" x="445.0" y="80" text-anchor="middle">the madman:</text>
  <text class="muted" x="445.0" y="96" text-anchor="middle">“we have</text>
  <text class="muted" x="445.0" y="112" text-anchor="middle">killed him”</text>
  <rect class="box" x="511" y="36" width="118" height="96" rx="5"/>
  <text class="label" x="570.0" y="56" text-anchor="middle" font-weight="600">§ 153</text>
  <text class="muted" x="570.0" y="80" text-anchor="middle">all gods slain</text>
  <text class="muted" x="570.0" y="96" text-anchor="middle">“for the sake</text>
  <text class="muted" x="570.0" y="112" text-anchor="middle">of morality”</text>
  <text class="muted" x="320.0" y="156" text-anchor="middle">108 to 124 lead up to the parable; 153, after it, names the killer: morality itself</text>
</svg>

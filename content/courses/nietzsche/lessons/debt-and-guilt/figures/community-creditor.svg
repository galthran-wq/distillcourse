<svg viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .box-a { fill: none; stroke: #e2903a; stroke-width: 1.8; }
    .box-b { fill: none; stroke: #4c8dd6; stroke-width: 1.8; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .owe { stroke: currentColor; stroke-opacity: 0.7; stroke-width: 1.6; fill: none; }
    .pay { stroke: #e2903a; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
    .shift { stroke: #e2903a; stroke-width: 1.4; fill: none; stroke-dasharray: 3 3; opacity: 0.7; }
    .rule { stroke: currentColor; stroke-opacity: 0.3; stroke-width: 1; }
  </style>

  <text class="muted small" x="16" y="20">II:5, the private relation</text>

  <rect class="box-b" x="20" y="34" width="170" height="70" rx="6"/>
  <text class="blue" x="105" y="58" text-anchor="middle">the debtor</text>
  <text class="label small" x="105" y="76" text-anchor="middle">a person under contract</text>
  <text class="muted small" x="105" y="92" text-anchor="middle">pledged on his body</text>

  <path class="owe" d="M 196 54 L 444 54"/>
  <path class="owe" d="M 436 49 L 444 54 L 436 59"/>
  <text class="label small" x="320" y="46" text-anchor="middle">owes: a fixed sum</text>

  <path class="pay" d="M 444 84 L 196 84"/>
  <path class="pay" d="M 204 79 L 196 84 L 204 89"/>
  <text class="amber small" x="320" y="100" text-anchor="middle">on default: the creditor's title to cruelty</text>

  <rect class="box-a" x="450" y="34" width="170" height="70" rx="6"/>
  <text class="amber" x="535" y="58" text-anchor="middle">the creditor</text>
  <text class="label small" x="535" y="76" text-anchor="middle">a person, roughly his equal</text>

  <path class="shift" d="M 535 110 L 535 182"/>
  <path class="shift" d="M 529 174 L 535 182 L 541 174"/>
  <text class="muted small" x="310" y="140" text-anchor="middle">"transferred itself" (übertrug sich) from personal right</text>
  <text class="muted small" x="310" y="154" text-anchor="middle">to the first social complexes (II:8)</text>

  <text class="muted small" x="16" y="180">II:9, the same relation with a new bearer</text>

  <rect class="box-b" x="20" y="194" width="170" height="70" rx="6"/>
  <text class="blue" x="105" y="218" text-anchor="middle">the debtor</text>
  <text class="label small" x="105" y="236" text-anchor="middle">a member of the community</text>
  <text class="muted small" x="105" y="252" text-anchor="middle">"pledged and bound himself"</text>

  <path class="owe" d="M 196 214 L 424 214"/>
  <path class="owe" d="M 416 209 L 424 214 L 416 219"/>
  <text class="label small" x="310" y="206" text-anchor="middle">owes: protection and peace</text>

  <path class="pay" d="M 424 246 L 196 246"/>
  <path class="pay" d="M 204 241 L 196 246 L 204 251"/>
  <text class="amber small" x="310" y="262" text-anchor="middle">on default: "put back into the wild"</text>
  <text class="amber small" x="310" y="276" text-anchor="middle">the criminal, "a breaker of contract"</text>

  <rect class="box-a" x="430" y="190" width="190" height="100" rx="6"/>
  <text class="amber" x="525" y="214" text-anchor="middle">the creditor</text>
  <text class="label small" x="525" y="234" text-anchor="middle">the community, "the whole"</text>
  <text class="label small" x="525" y="250" text-anchor="middle">it holds the person's standing</text>
  <text class="muted small" x="525" y="272" text-anchor="middle">"lays hands on his creditor"</text>

  <path class="rule" d="M 30 318 L 610 318"/>
  <text class="label small" x="320" y="340" text-anchor="middle">the creditor's standing passes from the person to the community, never the reverse (II:8)</text>
  <text class="amber small" x="320" y="358" text-anchor="middle">the substitution II:19 repeats with the ancestors, and II:20 with the god</text>
</svg>

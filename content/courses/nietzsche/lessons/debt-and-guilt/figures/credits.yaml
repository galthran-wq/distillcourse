    title: "Kreuzigung Christi (The Crucifixion), central panel of the closed Isenheim Altarpiece, 1512–1516, oil on panel, 269 × 307 cm"
    credit: "Matthias Grünewald (c. 1475/80–1528); Musée Unterlinden, Colmar. Painted for the Antonite house at Issenheim under the preceptor Guido Guersi. Reproduction from The Yorck Project, 10.000 Meisterwerke der Malerei"

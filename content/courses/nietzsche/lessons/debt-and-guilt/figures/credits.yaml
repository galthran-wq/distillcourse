    retrieved: "2026-09-06"
    located: "Wikimedia Commons; the central panel alone, without the Saint Sebastian and Saint Anthony wings or the Lamentation predella. Downloaded from the native 3176 × 2820"
    modifications: "downscaled to 2400 × 2131, re-encoded to JPEG and metadata stripped. Not cropped, not trimmed, not retouched, not colour-corrected: the whole painted surface bleeds to all four edges, and the pure white in the two top corners is the panel's own stepped silhouette — the raised central section carrying the chain and the INRI board stands proud of the shoulders — which is why the figure is set on a light card"

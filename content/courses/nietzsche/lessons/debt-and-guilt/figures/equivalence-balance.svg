<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .box-a { fill: none; stroke: #e2903a; stroke-width: 1.8; }
    .box-b { fill: none; stroke: #4c8dd6; stroke-width: 1.8; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .beam { stroke: currentColor; stroke-width: 2.2; fill: none; }
    .cord { stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.2; fill: none; }
    .pan-b { fill: none; stroke: #4c8dd6; stroke-width: 2; }
    .pan-a { fill: none; stroke: #e2903a; stroke-width: 2; }
    .struck { stroke: currentColor; stroke-opacity: 0.7; stroke-width: 1.6; }
    .rule { stroke: currentColor; stroke-opacity: 0.3; stroke-width: 1; }
  </style>

  <path class="beam" d="M 320 40 L 320 250"/>
  <path class="beam" d="M 250 250 L 390 250"/>
  <path class="beam" d="M 120 60 L 520 60"/>
  <circle cx="320" cy="60" r="5" fill="currentColor"/>

  <path class="cord" d="M 130 60 L 100 150"/>
  <path class="cord" d="M 130 60 L 160 150"/>
  <path class="pan-b" d="M 70 150 Q 130 200 190 150"/>
  <rect class="box-b" x="24" y="88" width="212" height="46" rx="5"/>
  <text class="blue" x="130" y="107" text-anchor="middle">the injury (der Schaden)</text>
  <text class="label small" x="130" y="124" text-anchor="middle">plus the vexation at the injury</text>

  <path class="cord" d="M 510 60 L 480 150"/>
  <path class="cord" d="M 510 60 L 540 150"/>
  <path class="pan-a" d="M 450 150 Q 510 200 570 150"/>
  <rect class="box-a" x="398" y="80" width="224" height="60" rx="5"/>
  <text class="amber" x="510" y="99" text-anchor="middle">the creditor's Wohlgefühl</text>
  <text class="label small" x="510" y="116" text-anchor="middle">the pleasure of venting his power</text>
  <text class="label small" x="510" y="130" text-anchor="middle">on one who is powerless</text>

  <text class="muted small" x="510" y="222" text-anchor="middle">money, land, goods of any kind</text>
  <path class="struck" d="M 430 218 L 590 218"/>
  <text class="muted small" x="510" y="238" text-anchor="middle">"instead of a compensation in money, land, possessions"</text>

  <text class="muted small" x="130" y="222" text-anchor="middle">the debt that cannot be paid</text>

  <path class="rule" d="M 24 268 L 616 268"/>
  <text class="label" x="320" y="290" text-anchor="middle">"The compensation consists in a warrant for, and title to, cruelty" (II:5)</text>
  <text class="amber small" x="320" y="310" text-anchor="middle">what balances the injury is a feeling in the creditor, not a transfer of goods</text>
</svg>

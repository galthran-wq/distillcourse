<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tag { fill: currentColor; font-weight: 600; }
    .box-a { fill: none; stroke: #e2903a; stroke-width: 1.8; }
    .box-b { fill: none; stroke: #4c8dd6; stroke-width: 1.8; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .owe { stroke: currentColor; stroke-opacity: 0.7; stroke-width: 1.6; fill: none; }
    .pay { stroke: #e2903a; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
    .rule { stroke: currentColor; stroke-opacity: 0.3; stroke-width: 1; }
  </style>

  <text class="muted small" x="16" y="20">frame 3 of 4: the ancestor has become a god (II:19–20)</text>

  <rect class="box-b" x="30" y="120" width="190" height="70" rx="6"/>
  <text class="blue" x="125" y="150" text-anchor="middle">the debtor</text>
  <text class="label small" x="125" y="170" text-anchor="middle">the tribe, victorious and feared</text>

  <path class="owe" d="M 226 140 L 388 140"/>
  <path class="owe" d="M 380 135 L 388 140 L 380 145"/>
  <text class="label small" x="307" y="132" text-anchor="middle">owes: a debt that grows with the tribe's power</text>

  <path class="pay" d="M 388 172 L 226 172"/>
  <path class="pay" d="M 234 167 L 226 172 L 234 177"/>
  <text class="amber small" x="307" y="190" text-anchor="middle">pays with: cult; the debt is inherited, never settled</text>

  <rect class="box-a" x="394" y="70" width="200" height="170" rx="6"/>
  <text class="amber" x="494" y="100" text-anchor="middle">the creditor</text>
  <text class="label small" x="494" y="120" text-anchor="middle">the founder "grown into the monstrous",</text>
  <text class="label small" x="494" y="134" text-anchor="middle">"transfigured into a god"</text>
  <text class="muted small" x="494" y="160" text-anchor="middle">"Nicht etwa umgekehrt!": fear of the ancestor</text>
  <text class="muted small" x="494" y="174" text-anchor="middle">rises as the tribe rises, falls as it decays</text>
  <text class="muted small" x="494" y="200" text-anchor="middle">universal empires bring universal gods;</text>
  <text class="muted small" x="494" y="214" text-anchor="middle">the tribal god is inherited by the conquered</text>

  <path class="rule" d="M 30 250 L 610 250"/>
  <text class="label small" x="320" y="272" text-anchor="middle">the creditor is now out of reach, and the debt has no sum that would close it</text>
  <text class="muted small" x="320" y="290" text-anchor="middle">"perhaps this is the very origin of the gods, an origin out of fear" (II:19)</text>
</svg>

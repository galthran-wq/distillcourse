<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tag { fill: currentColor; font-weight: 600; }
    .box-a { fill: none; stroke: #e2903a; stroke-width: 1.8; }
    .box-b { fill: none; stroke: #4c8dd6; stroke-width: 1.8; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .owe { stroke: currentColor; stroke-opacity: 0.7; stroke-width: 1.6; fill: none; }
    .pay { stroke: #e2903a; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
    .self { stroke: #e2903a; stroke-width: 2; fill: none; }
    .rule { stroke: currentColor; stroke-opacity: 0.3; stroke-width: 1; }
  </style>

  <text class="muted small" x="16" y="20">frame 4 of 4: the maximal god, and the creditor pays himself (II:20–21)</text>

  <rect class="box-b" x="30" y="120" width="190" height="70" rx="6"/>
  <text class="blue" x="125" y="150" text-anchor="middle">the debtor</text>
  <text class="label small" x="125" y="170" text-anchor="middle">humanity, "unable to redeem itself"</text>

  <path class="owe" d="M 226 140 L 388 140"/>
  <path class="owe" d="M 380 135 L 388 140 L 380 145"/>
  <text class="label small" x="307" y="132" text-anchor="middle">owes: everything; "the maximum of guilt-feeling"</text>

  <path class="pay" d="M 388 172 L 226 172"/>
  <path class="pay" d="M 234 167 L 226 172 L 234 177"/>
  <text class="amber small" x="307" y="190" text-anchor="middle">pays with: nothing it has; the debt is "unredeemable"</text>

  <rect class="box-a" x="394" y="44" width="200" height="220" rx="6"/>
  <text class="amber" x="494" y="74" text-anchor="middle">the creditor</text>
  <text class="label small" x="494" y="94" text-anchor="middle">the Christian God, "the maximal god</text>
  <text class="label small" x="494" y="108" text-anchor="middle">attained so far"</text>
  <path class="self" d="M 560 128 C 600 128 600 176 560 176"/>
  <path class="self" d="M 568 171 L 560 176 L 568 181"/>
  <text class="amber small" x="494" y="150" text-anchor="middle">"God himself sacrificing himself</text>
  <text class="amber small" x="494" y="164" text-anchor="middle">for the debt of man, God paying</text>
  <text class="amber small" x="494" y="178" text-anchor="middle">himself back out of himself"</text>
  <text class="muted small" x="494" y="204" text-anchor="middle">"the creditor sacrificing himself for</text>
  <text class="muted small" x="494" y="218" text-anchor="middle">his debtor, out of love" (II:21)</text>
  <text class="muted small" x="494" y="244" text-anchor="middle">the ceiling of the chain: no larger creditor</text>

  <path class="rule" d="M 30 280 L 610 280"/>
  <text class="label small" x="320" y="300" text-anchor="middle">one variable grew at each step, the creditor; the debtor never paid, and at the top the creditor pays for him</text>
  <text class="muted small" x="320" y="318" text-anchor="middle">"the record god ... brought the record amount of guilt-consciousness into the world" (II:20)</text>
</svg>

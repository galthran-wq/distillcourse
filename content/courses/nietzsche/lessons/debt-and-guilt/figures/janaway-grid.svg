<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tag { fill: currentColor; font-weight: 600; }
    .cell { fill: none; stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.3; }
    .cell-d { fill: none; stroke: #e2903a; stroke-width: 2.2; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .axis-a { stroke: #e2903a; stroke-width: 2; fill: none; }
    .axis-b { stroke: #4c8dd6; stroke-width: 2; fill: none; }
    .rule { stroke: currentColor; stroke-opacity: 0.3; stroke-width: 1; }
  </style>

  <!-- column axis (legitimation) -->
  <path class="axis-a" d="M 190 34 L 600 34"/>
  <path class="axis-a" d="M 592 29 L 600 34 L 592 39"/>
  <text class="amber" x="395" y="24" text-anchor="middle">legitimation: the debt chain, II:4–8 (this lesson)</text>
  <text class="label small" x="290" y="54" text-anchor="middle">non-legitimated</text>
  <text class="label small" x="500" y="54" text-anchor="middle">legitimated: "rightful recipient of suffering"</text>

  <!-- row axis (internalization) -->
  <path class="axis-b" d="M 40 70 L 40 320"/>
  <path class="axis-b" d="M 35 312 L 40 320 L 45 312"/>
  <text class="blue" transform="translate(24 195) rotate(-90)" text-anchor="middle">internalization: II:16 (next lesson)</text>
  <text class="label small" x="120" y="128" text-anchor="middle">not turned</text>
  <text class="label small" x="120" y="142" text-anchor="middle">inward</text>
  <text class="label small" x="120" y="248" text-anchor="middle">turned</text>
  <text class="label small" x="120" y="262" text-anchor="middle">inward</text>

  <!-- cells -->
  <rect class="cell" x="190" y="70" width="200" height="120" rx="5"/>
  <text class="tag" x="290" y="96" text-anchor="middle">(a) simple cruelty to others</text>
  <text class="muted small" x="290" y="118" text-anchor="middle">the festival, the auto-da-fé,</text>
  <text class="muted small" x="290" y="132" text-anchor="middle">Don Quixote at the Duchess's court</text>
  <text class="muted small" x="290" y="160" text-anchor="middle">II:6–7</text>

  <rect class="cell" x="400" y="70" width="200" height="120" rx="5"/>
  <text class="tag" x="500" y="96" text-anchor="middle">(c) punishment of others</text>
  <text class="muted small" x="500" y="118" text-anchor="middle">the creditor "participates in a right</text>
  <text class="muted small" x="500" y="132" text-anchor="middle">of the masters"; the community as creditor</text>
  <text class="muted small" x="500" y="160" text-anchor="middle">II:5, II:9–10</text>

  <rect class="cell" x="190" y="200" width="200" height="120" rx="5"/>
  <text class="tag" x="290" y="226" text-anchor="middle">(b) simple cruelty to self</text>
  <text class="muted small" x="290" y="248" text-anchor="middle">the caged animal that "invented</text>
  <text class="muted small" x="290" y="262" text-anchor="middle">the bad conscience to hurt itself"</text>
  <text class="muted small" x="290" y="290" text-anchor="middle">II:16 (next lesson)</text>

  <rect class="cell-d" x="400" y="200" width="200" height="120" rx="5"/>
  <text class="amber" x="500" y="226" text-anchor="middle">(d) punishment of self: guilt</text>
  <text class="label small" x="500" y="248" text-anchor="middle">self-cruelty read as deserved;</text>
  <text class="label small" x="500" y="262" text-anchor="middle">"a debt before God: this thought</text>
  <text class="label small" x="500" y="276" text-anchor="middle">becomes his instrument of torture"</text>
  <text class="muted small" x="500" y="300" text-anchor="middle">II:21–22; both axes hold</text>

  <path class="rule" d="M 40 336 L 600 336"/>
  <text class="muted small" x="320" y="352" text-anchor="middle">Janaway's grid (2007, p. 147): the two origin stories are two axes, and guilt is the one cell where both apply</text>
</svg>

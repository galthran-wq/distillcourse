<svg viewBox="0 0 640 350" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .axis { stroke: currentColor; stroke-width: 1.4; fill: none; }
    .curve { stroke: #e2903a; stroke-width: 2.4; fill: none; }
    .flat { stroke: #4c8dd6; stroke-width: 1.6; fill: none; stroke-dasharray: 4 4; opacity: 0.8; }
    .dot { fill: #e2903a; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .rule { stroke: currentColor; stroke-opacity: 0.3; stroke-width: 1; }
  </style>

  <text class="muted small" x="16" y="20">the creditor's pleasure in a settlement paid in suffering, against his rank (II:5, II:10)</text>

  <path class="axis" d="M 70 262 L 600 262"/>
  <path class="axis" d="M 592 257 L 600 262 L 592 267"/>
  <path class="axis" d="M 70 262 L 70 44"/>
  <path class="axis" d="M 65 52 L 70 44 L 75 52"/>
  <text class="label small" x="90" y="280">low</text>
  <text class="label small" x="575" y="280" text-anchor="end">high</text>
  <text class="label small" x="335" y="280" text-anchor="middle">the creditor's power: rank, wealth, the community's strength</text>
  <text class="label small" transform="translate(56 160) rotate(-90)" text-anchor="middle">value to the creditor of the settlement</text>

  <path class="flat" d="M 70 140 L 600 140"/>
  <text class="blue small" x="595" y="133" text-anchor="end">pleasure in pain as such would be the same at every rank</text>

  <path class="curve" d="M 90 90 C 160 95, 230 170, 320 205 S 480 250, 575 258"/>

  <circle class="dot" cx="90" cy="90" r="4"/>
  <text class="amber small" x="102" y="66">II:5, the low-ranked creditor</text>
  <text class="label small" x="102" y="80">"a foretaste of higher rank", "participates in a right of masters"</text>

  <circle class="dot" cx="320" cy="205" r="4"/>
  <text class="amber small" x="334" y="176">II:10, the strong community</text>
  <text class="label small" x="334" y="190">compositio: the deed isolated from the doer</text>

  <circle class="dot" cx="575" cy="258" r="4"/>
  <text class="amber small" x="590" y="216" text-anchor="end">II:10, mercy: "letting the insolvent run"</text>
  <text class="label small" x="590" y="230" text-anchor="end">"the privilege of the most powerful"</text>

  <path class="rule" d="M 30 298 L 610 298"/>
  <text class="label" x="320" y="318" text-anchor="middle">"The 'creditor' has always become more humane to the extent that he has grown richer" (II:10)</text>
  <text class="amber small" x="320" y="336" text-anchor="middle">one curve from both ends: largest at the lowest rank, not taken at all at the top</text>
</svg>

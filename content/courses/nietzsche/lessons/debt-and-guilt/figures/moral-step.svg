<svg viewBox="0 0 640 350" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tag { fill: currentColor; font-weight: 600; }
    .box { fill: none; stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.3; }
    .box-a { fill: none; stroke: #e2903a; stroke-width: 1.8; }
    .box-b { fill: none; stroke: #4c8dd6; stroke-width: 1.8; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .link { stroke: currentColor; stroke-opacity: 0.7; stroke-width: 1.6; fill: none; }
    .missing { stroke: #e2903a; stroke-width: 2; fill: none; stroke-dasharray: 5 4; }
    .site { stroke: #4c8dd6; stroke-width: 1.8; fill: none; stroke-dasharray: 5 4; }
    .rule { stroke: currentColor; stroke-opacity: 0.3; stroke-width: 1; }
  </style>

  <text class="muted small" x="16" y="20">the chain II:4–21 states, and the one link it does not argue</text>

  <rect class="box" x="16" y="60" width="120" height="50" rx="5"/>
  <text class="label" x="76" y="82" text-anchor="middle">owes</text>
  <text class="muted small" x="76" y="98" text-anchor="middle">Schulden (II:4)</text>

  <path class="link" d="M 138 85 L 166 85"/>
  <path class="link" d="M 159 80 L 166 85 L 159 90"/>

  <rect class="box" x="170" y="60" width="120" height="50" rx="5"/>
  <text class="label" x="230" y="82" text-anchor="middle">cannot pay</text>
  <text class="muted small" x="230" y="98" text-anchor="middle">the pledge falls due (II:5)</text>

  <path class="link" d="M 292 85 L 320 85"/>
  <path class="link" d="M 313 80 L 320 85 L 313 90"/>

  <rect class="box" x="324" y="60" width="120" height="50" rx="5"/>
  <text class="label" x="384" y="82" text-anchor="middle">is made to suffer</text>
  <text class="muted small" x="384" y="98" text-anchor="middle">compensation (II:5–6)</text>

  <path class="missing" d="M 446 85 L 496 85"/>
  <path class="missing" d="M 489 80 L 496 85 L 489 90"/>

  <rect class="box-a" x="500" y="52" width="124" height="66" rx="5"/>
  <text class="amber" x="562" y="76" text-anchor="middle">is guilty</text>
  <text class="label small" x="562" y="94" text-anchor="middle">schuldig; deserves it</text>
  <text class="muted small" x="562" y="108" text-anchor="middle">II:21's "moralization"</text>

  <!-- the borrowed premise -->
  <path class="missing" d="M 471 122 L 471 150"/>
  <rect class="box-a" x="300" y="152" width="324" height="78" rx="6"/>
  <text class="amber small" x="462" y="172" text-anchor="middle">the premise the dashed link needs, and II:4–22 never argue:</text>
  <text class="label small" x="462" y="190" text-anchor="middle">the debtor could have paid and chose not to; he is a doer</text>
  <text class="label small" x="462" y="204" text-anchor="middle">behind the deed, "free to express strength or not" (I:13)</text>
  <text class="muted small" x="462" y="222" text-anchor="middle">Twilight VI:7: men were thought free "um schuldig werden zu können"</text>

  <!-- the site -->
  <path class="site" d="M 562 122 L 562 150 L 630 150"/>
  <rect class="box-b" x="16" y="152" width="264" height="78" rx="6"/>
  <text class="blue small" x="148" y="172" text-anchor="middle">the site the guilt attaches to:</text>
  <text class="label small" x="148" y="190" text-anchor="middle">cruelty turned inward in the caged animal,</text>
  <text class="label small" x="148" y="204" text-anchor="middle">"the will to self-torture" (II:22, II:16)</text>
  <text class="muted small" x="148" y="222" text-anchor="middle">the next lesson's mechanism</text>
  <path class="site" d="M 282 191 L 298 191"/>

  <path class="rule" d="M 16 252 L 624 252"/>
  <text class="label small" x="320" y="274" text-anchor="middle">II:4 itself dates "he could have acted otherwise" as "an extremely late, even refined form of human judgment"</text>
  <text class="muted small" x="320" y="292" text-anchor="middle">so the treatise cannot take the premise from the debt relation; it is imported from the First Treatise, where I:13 showed it false</text>
  <text class="amber small" x="320" y="318" text-anchor="middle">the chain is a history of debt; the moral step is a borrowed premise with a location and no argument</text>
</svg>

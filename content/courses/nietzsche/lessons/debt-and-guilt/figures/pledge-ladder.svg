<svg viewBox="0 0 640 350" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tag { fill: currentColor; font-weight: 600; }
    .box-b { fill: none; stroke: #4c8dd6; stroke-width: 1.8; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .rail { stroke: currentColor; stroke-opacity: 0.5; stroke-width: 2; }
    .rung { fill: none; stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.3; }
    .rung-a { fill: none; stroke: #e2903a; stroke-width: 1.8; }
    .arrow { stroke: #4c8dd6; stroke-width: 1.6; fill: none; }
    .rule { stroke: currentColor; stroke-opacity: 0.3; stroke-width: 1; }
  </style>

  <text class="tag" x="200" y="24" text-anchor="middle">what the debtor pledges "for the case that he does not pay" (II:5)</text>

  <path class="rail" d="M 70 40 L 70 300"/>
  <path class="rail" d="M 330 40 L 330 300"/>

  <rect class="rung" x="70" y="262" width="260" height="30" rx="4"/>
  <text class="label" x="200" y="281" text-anchor="middle">his body (Leib)</text>

  <rect class="rung" x="70" y="222" width="260" height="30" rx="4"/>
  <text class="label" x="200" y="241" text-anchor="middle">his wife (Weib)</text>

  <rect class="rung" x="70" y="182" width="260" height="30" rx="4"/>
  <text class="label" x="200" y="201" text-anchor="middle">his freedom (Freiheit)</text>

  <rect class="rung" x="70" y="142" width="260" height="30" rx="4"/>
  <text class="label" x="200" y="161" text-anchor="middle">his life (Leben)</text>

  <rect class="rung-a" x="70" y="102" width="260" height="30" rx="4"/>
  <text class="amber" x="200" y="121" text-anchor="middle">his salvation, his soul's welfare (Seligkeit)</text>

  <rect class="rung-a" x="70" y="62" width="260" height="30" rx="4"/>
  <text class="amber" x="200" y="81" text-anchor="middle">his peace in the grave (Egypt)</text>

  <text class="muted small" x="200" y="316" text-anchor="middle">"something he otherwise still 'possesses', over which he still has power"</text>
  <text class="muted small" x="200" y="330" text-anchor="middle">the two amber rungs need "certain religious presuppositions"</text>

  <path class="arrow" d="M 340 170 L 380 170"/>
  <path class="arrow" d="M 372 165 L 380 170 L 372 175"/>
  <rect class="box-b" x="388" y="110" width="236" height="120" rx="6"/>
  <text class="blue" x="506" y="132" text-anchor="middle">the creditor's right</text>
  <text class="label small" x="506" y="152" text-anchor="middle">to inflict on the debtor's body "every kind</text>
  <text class="label small" x="506" y="166" text-anchor="middle">of indignity and torture", cutting off as much</text>
  <text class="label small" x="506" y="180" text-anchor="middle">"as seemed proportionate to the size of the debt"</text>
  <text class="muted small" x="506" y="202" text-anchor="middle">legally fixed valuations of limbs;</text>
  <text class="muted small" x="506" y="216" text-anchor="middle">Twelve Tables: "si plus minusve secuerunt, ne fraude esto"</text>

  <path class="rule" d="M 388 250 L 624 250"/>
  <text class="muted small" x="506" y="270" text-anchor="middle">the pledge secures a promise (II:1);</text>
  <text class="muted small" x="506" y="284" text-anchor="middle">the cut is what "gives the promiser a memory" (II:5)</text>
</svg>

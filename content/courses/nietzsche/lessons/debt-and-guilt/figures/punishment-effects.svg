<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tag { fill: currentColor; font-weight: 600; }
    .box { fill: none; stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.3; }
    .box-a { fill: none; stroke: #e2903a; stroke-width: 1.8; }
    .box-b { fill: none; stroke: #4c8dd6; stroke-width: 1.8; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .struck { stroke: currentColor; stroke-opacity: 0.75; stroke-width: 1.8; }
    .arrow { stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.4; fill: none; }
    .rule { stroke: currentColor; stroke-opacity: 0.3; stroke-width: 1; }
  </style>

  <rect class="box" x="250" y="14" width="140" height="40" rx="6"/>
  <text class="tag" x="320" y="39" text-anchor="middle">punishment</text>

  <path class="arrow" d="M 290 54 L 170 84"/>
  <path class="arrow" d="M 176 78 L 170 84 L 178 86"/>
  <path class="arrow" d="M 350 54 L 470 84"/>
  <path class="arrow" d="M 462 86 L 470 84 L 464 78"/>

  <rect class="box-b" x="30" y="88" width="280" height="160" rx="6"/>
  <text class="blue" x="170" y="110" text-anchor="middle">what it does (II:14–15)</text>
  <text class="label small" x="48" y="134">"hardens and cools" (härtet und kältet)</text>
  <text class="label small" x="48" y="150">concentrates; sharpens the feeling of alienation</text>
  <text class="label small" x="48" y="166">strengthens the power of resistance</text>
  <text class="label small" x="48" y="182">increases fear, cunning, mastery of the desires</text>
  <text class="label small" x="48" y="198">sharpens prudence; lengthens the memory</text>
  <text class="label small" x="48" y="214">"tames man, but does not make him 'better'"</text>
  <text class="muted small" x="170" y="238" text-anchor="middle">the punished: "something went wrong", not "I ought not to have"</text>

  <rect class="box-a" x="330" y="88" width="280" height="160" rx="6"/>
  <text class="amber" x="470" y="110" text-anchor="middle">what it is supposed to do</text>
  <text class="label" x="470" y="146" text-anchor="middle">awaken "the feeling of guilt in the guilty one"</text>
  <path class="struck" d="M 352 142 L 588 142"/>
  <text class="label small" x="470" y="170" text-anchor="middle">"the true instrumentum of that reaction of the</text>
  <text class="label small" x="470" y="184" text-anchor="middle">soul called 'bad conscience', 'pang of conscience'"</text>
  <text class="muted small" x="470" y="212" text-anchor="middle">"bad conscience ... did not grow on this soil":</text>
  <text class="muted small" x="470" y="226" text-anchor="middle">through punishment its growth was "most held back"</text>

  <path class="rule" d="M 30 268 L 610 268"/>
  <text class="label small" x="320" y="290" text-anchor="middle">the debt chain runs debtor, creditor, compensation, punishment, and stops: punishment yields prudence, not guilt</text>
  <text class="amber small" x="320" y="308" text-anchor="middle">guilt's site must be found elsewhere than in the punished</text>
</svg>

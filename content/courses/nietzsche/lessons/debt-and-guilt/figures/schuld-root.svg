<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tag { fill: currentColor; font-weight: 600; }
    .box { fill: none; stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.3; }
    .box-a { fill: none; stroke: #e2903a; stroke-width: 1.8; }
    .box-b { fill: none; stroke: #4c8dd6; stroke-width: 1.8; }
    .box-g { fill: none; stroke: #5aa46a; stroke-width: 1.6; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .green { fill: #5aa46a; font-weight: 600; }
    .line { stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.3; fill: none; }
    .descent { stroke: #e2903a; stroke-width: 2; fill: none; stroke-dasharray: 5 4; }
    .rule { stroke: currentColor; stroke-opacity: 0.3; stroke-width: 1; }
  </style>

  <rect class="box" x="230" y="14" width="180" height="52" rx="6"/>
  <text class="tag" x="320" y="35" text-anchor="middle" font-size="15">Schuld</text>
  <text class="muted small" x="320" y="54" text-anchor="middle">one German noun, two senses</text>

  <path class="line" d="M 290 66 L 160 104"/>
  <path class="line" d="M 350 66 L 480 104"/>

  <rect class="box-b" x="40" y="106" width="240" height="64" rx="6"/>
  <text class="blue" x="160" y="128" text-anchor="middle">Schulden: debts</text>
  <text class="label small" x="160" y="146" text-anchor="middle">"the very material concept"</text>
  <text class="label small" x="160" y="160" text-anchor="middle">what a debtor owes a creditor</text>

  <rect class="box-a" x="360" y="106" width="240" height="64" rx="6"/>
  <text class="amber" x="480" y="128" text-anchor="middle">Schuld: guilt</text>
  <text class="label small" x="480" y="146" text-anchor="middle">"the moral master-concept"</text>
  <text class="label small" x="480" y="160" text-anchor="middle">what a wrongdoer bears</text>

  <path class="descent" d="M 282 138 L 356 138"/>
  <path class="descent" d="M 348 133 L 356 138 L 348 143"/>
  <text class="amber small" x="320" y="128" text-anchor="middle">Herkunft</text>
  <text class="muted small" x="320" y="154" text-anchor="middle">descent (II:4)</text>

  <text class="muted small" x="320" y="196" text-anchor="middle">"dass jener moralische Hauptbegriff 'Schuld' seine Herkunft aus dem</text>
  <text class="muted small" x="320" y="210" text-anchor="middle">sehr materiellen Begriff 'Schulden' genommen hat" (GM II:4)</text>

  <path class="rule" d="M 40 224 L 600 224"/>

  <rect class="box-g" x="40" y="238" width="260" height="70" rx="5"/>
  <text class="green small" x="170" y="258" text-anchor="middle">the identity: a fact about German</text>
  <text class="label small" x="170" y="276" text-anchor="middle">one word carries both senses;</text>
  <text class="label small" x="170" y="290" text-anchor="middle">checkable in any dictionary</text>

  <rect class="box-a" x="340" y="238" width="260" height="70" rx="5"/>
  <text class="amber small" x="470" y="258" text-anchor="middle">the descent: a conjecture with a record to find</text>
  <text class="label small" x="470" y="276" text-anchor="middle">that the moral sense came later, out of the material one;</text>
  <text class="label small" x="470" y="290" text-anchor="middle">evidence proper: II:5's law codes, II:8's exchange</text>
</svg>

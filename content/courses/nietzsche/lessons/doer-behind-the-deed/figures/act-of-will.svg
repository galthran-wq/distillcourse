<svg viewBox="0 0 640 370" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tag { fill: currentColor; font-weight: 600; }
    .box { fill: none; stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.3; }
    .box-a { fill: none; stroke: #e2903a; stroke-width: 2; }
    .box-b { fill: none; stroke: #4c8dd6; stroke-width: 1.6; }
    .arrow { stroke: #e2903a; stroke-width: 1.8; fill: none; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .rule { stroke: currentColor; stroke-opacity: 0.35; stroke-width: 1; }
  </style>

  <text class="tag" x="16" y="22">one act of will (BGE 19): the parts list</text>

  <!-- three ingredients -->
  <rect class="box" x="16" y="36" width="196" height="96" rx="5"/>
  <text class="tag small" x="26" y="54">1. a plurality of feelings</text>
  <text class="label small" x="26" y="72">the state "away from which"</text>
  <text class="label small" x="26" y="88">the state "towards which"</text>
  <text class="label small" x="26" y="104">the "away" and "towards" as such</text>
  <text class="label small" x="26" y="120">the muscles moving, by habit</text>

  <rect class="box" x="222" y="36" width="196" height="96" rx="5"/>
  <text class="tag small" x="232" y="54">2. a commanding thought</text>
  <text class="label small" x="232" y="72">"we really should not believe</text>
  <text class="label small" x="232" y="88">this thought can be divorced</text>
  <text class="label small" x="232" y="104">from the willing, as if some</text>
  <text class="label small" x="232" y="120">will would then be left over"</text>

  <rect class="box" x="428" y="36" width="196" height="96" rx="5"/>
  <text class="tag small" x="438" y="54">3. the affect of command</text>
  <text class="label small" x="438" y="72">"above all": an affect of</text>
  <text class="label small" x="438" y="88">superiority over what must obey</text>
  <text class="amber small" x="438" y="106">"I am free, 'it' must obey"</text>
  <text class="muted small" x="438" y="122">this consciousness lies in every will</text>

  <path class="rule" d="M 16 150 L 624 150"/>
  <text class="tag" x="16" y="172">what the word "I will" reports: a relation of command</text>

  <!-- commander -->
  <rect class="box-a" x="220" y="186" width="200" height="44" rx="6"/>
  <text class="amber" x="320" y="205" text-anchor="middle">the commander</text>
  <text class="muted small" x="320" y="221" text-anchor="middle">the ruling drives</text>
  <text class="label small" x="432" y="194">"freedom of the will": the</text>
  <text class="label small" x="432" y="208">commander's feeling of superiority,</text>
  <text class="label small" x="432" y="222">real as a feeling; a fact about</text>
  <text class="label small" x="432" y="236">command, not about a substratum</text>

  <!-- arrows down to under-wills -->
  <path class="arrow" d="M 260 232 L 110 296"/>
  <path class="arrow" d="M 117 288 L 110 296 L 120 297"/>
  <path class="arrow" d="M 320 232 L 320 296"/>
  <path class="arrow" d="M 315 289 L 320 296 L 325 289"/>
  <path class="arrow" d="M 380 232 L 530 296"/>
  <path class="arrow" d="M 520 297 L 530 296 L 523 288"/>
  <text class="amber small" x="180" y="262" text-anchor="middle">commands</text>

  <rect class="box-b" x="40" y="298" width="140" height="40" rx="5"/>
  <text class="blue" x="110" y="316" text-anchor="middle">under-will</text>
  <text class="muted small" x="110" y="331" text-anchor="middle">obeys, or does not</text>
  <rect class="box-b" x="250" y="298" width="140" height="40" rx="5"/>
  <text class="blue" x="320" y="316" text-anchor="middle">under-will</text>
  <text class="muted small" x="320" y="331" text-anchor="middle">obeys, or does not</text>
  <rect class="box-b" x="460" y="298" width="140" height="40" rx="5"/>
  <text class="blue" x="530" y="316" text-anchor="middle">under-will</text>
  <text class="muted small" x="530" y="331" text-anchor="middle">obeys, or does not</text>

  <text class="muted small" x="320" y="360" text-anchor="middle">L'effet c'est moi: the commander takes the credit for what the under-wills do; the error is "willing suffices for action"</text>
</svg>

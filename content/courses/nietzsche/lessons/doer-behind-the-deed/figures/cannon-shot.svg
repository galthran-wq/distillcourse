<svg viewBox="0 0 640 270" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tag { fill: currentColor; font-weight: 600; }
    .axis { stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.2; fill: none; }
    .tick { stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.2; }
    .span { stroke: currentColor; stroke-opacity: 0.35; stroke-width: 8; stroke-linecap: round; }
    .span-a { stroke: #e2903a; stroke-width: 8; stroke-linecap: round; }
    .dot { fill: currentColor; }
    .dot-a { fill: #e2903a; }
    .retro { stroke: #4c8dd6; stroke-width: 1.8; fill: none; stroke-dasharray: 5 3; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .amber { fill: #e2903a; font-weight: 600; }
  </style>

  <!-- physical order -->
  <text class="tag" x="16" y="30">the physical order</text>
  <path class="axis" d="M 40 70 L 600 70"/>
  <path class="axis" d="M 593 65 L 600 70 L 593 75"/>
  <circle class="dot" cx="120" cy="70" r="4"/>
  <text class="label small" x="120" y="54" text-anchor="middle">a distant cannon-shot, at t</text>
  <path class="span" d="M 130 70 L 330 70"/>
  <text class="muted small" x="230" y="92" text-anchor="middle">the sensation persists, "a kind of resonance"</text>
  <path class="span" d="M 380 70 L 560 70"/>
  <text class="label small" x="470" y="54" text-anchor="middle">the story is composed, after t</text>
  <text class="muted small" x="470" y="92" text-anchor="middle">"a cause is subsequently foisted"</text>

  <!-- retroactive arrow -->
  <path class="retro" d="M 470 100 C 470 150, 200 130, 150 176"/>
  <path class="retro" d="M 160 170 L 150 176 L 159 180"/>
  <text class="blue small" x="330" y="135" text-anchor="middle">the composed cause is placed before the sensation</text>

  <!-- experienced order -->
  <text class="tag" x="16" y="212">the experienced order</text>
  <path class="axis" d="M 40 190 L 600 190"/>
  <path class="axis" d="M 593 185 L 600 190 L 593 195"/>
  <path class="span" d="M 130 190 L 330 190"/>
  <text class="label small" x="230" y="174" text-anchor="middle">the story: "a hundred details"</text>
  <circle class="dot-a" cx="380" cy="190" r="5"/>
  <text class="amber small" x="380" y="174" text-anchor="middle">"the shot follows"</text>
  <circle class="dot" cx="520" cy="190" r="4"/>
  <text class="label small" x="520" y="174" text-anchor="middle">waking</text>

  <text class="muted small" x="320" y="238" text-anchor="middle">"the cannon-shot enters in a causal way, in an apparent inversion of time":</text>
  <text class="muted small" x="320" y="252" text-anchor="middle">what comes later, the motivation, is experienced first</text>
</svg>

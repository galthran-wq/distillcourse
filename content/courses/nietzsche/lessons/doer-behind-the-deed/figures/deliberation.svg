<svg viewBox="0 0 640 356" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>.label { fill: currentColor; } .muted { fill: currentColor; opacity: 0.55; font-size: 12px; } .amber { fill: #e2903a; } .blue { fill: #4c8dd6; }</style>
  <defs><marker id="dl-a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker><marker id="dl-am" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e2903a"/></marker><marker id="dl-bl" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4c8dd6"/></marker></defs>
  <text class="label" x="320" y="22" text-anchor="middle" font-weight="600">What deliberation sees, and what decides (D 129, GS 360)</text>
  <rect x="14" y="36" width="612" height="116" rx="5" fill="none" stroke="currentColor" stroke-opacity="0.35"/>
  <text class="label" x="26" y="56" font-weight="600" font-size="12.5">what deliberation sees</text>
  <line x1="160" y1="92" x2="360" y2="92" stroke="#4c8dd6" stroke-width="2"/>
  <path d="M260 92 L250 112 L270 112 Z" fill="#4c8dd6"/>
  <rect x="110" y="64" width="110" height="26" rx="4" fill="#4c8dd6" fill-opacity="0.15" stroke="#4c8dd6"/>
  <text class="label" x="165" y="81" text-anchor="middle" font-size="11.5">if I strike …</text>
  <rect x="300" y="64" width="110" height="26" rx="4" fill="#4c8dd6" fill-opacity="0.15" stroke="#4c8dd6"/>
  <text class="label" x="355" y="81" text-anchor="middle" font-size="11.5">if I walk away …</text>
  <text class="blue" x="260" y="134" text-anchor="middle" font-size="12">the comparison of pictured consequences</text>
  <line x1="470" y1="112" x2="510" y2="72" stroke="#e2903a" stroke-width="3"/>
  <circle cx="512" cy="70" r="5" fill="#e2903a"/>
  <text class="amber" x="528" y="88" font-size="12">the match:</text>
  <text class="amber" x="528" y="104" font-size="12">purpose, the</text>
  <text class="amber" x="528" y="120" font-size="12">directing force</text>
  <rect x="14" y="160" width="612" height="160" rx="5" fill="currentColor" fill-opacity="0.07" stroke="currentColor" stroke-opacity="0.3"/>
  <text class="label" x="26" y="180" font-weight="600" font-size="12.5">what decides, unseen</text>
  <circle cx="70" cy="220" r="6" fill="none" stroke="currentColor" stroke-opacity="0.55"/>
  <text class="muted" x="80" y="224" font-size="11">habit</text>
  <circle cx="150" cy="250" r="6" fill="none" stroke="currentColor" stroke-opacity="0.55"/>
  <text class="muted" x="160" y="254" font-size="11">fear</text>
  <circle cx="230" cy="215" r="6" fill="none" stroke="currentColor" stroke-opacity="0.55"/>
  <text class="muted" x="240" y="219" font-size="11">pride</text>
  <circle cx="110" cy="290" r="6" fill="none" stroke="currentColor" stroke-opacity="0.55"/>
  <text class="muted" x="120" y="294" font-size="11">fatigue</text>
  <circle cx="210" cy="290" r="6" fill="none" stroke="currentColor" stroke-opacity="0.55"/>
  <text class="muted" x="220" y="294" font-size="11">a friend’s word</text>
  <circle cx="300" cy="255" r="6" fill="none" stroke="currentColor" stroke-opacity="0.55"/>
  <text class="muted" x="310" y="259" font-size="11">a trivial event</text>
  <path d="M80 226 L140 246 M160 248 L222 220" stroke="currentColor" stroke-opacity="0.35" stroke-dasharray="3 3"/>
  <rect x="420" y="196" width="190" height="100" rx="12" fill="#e2903a" fill-opacity="0.2" stroke="#e2903a" stroke-width="1.5"/>
  <text class="amber" x="515" y="224" text-anchor="middle" font-weight="600" font-size="12.5">a ton of powder</text>
  <text class="label" x="515" y="244" text-anchor="middle" font-size="12">dammed-up energy:</text>
  <text class="label" x="515" y="260" text-anchor="middle" font-size="12">the cause of acting</text>
  <text class="muted" x="515" y="280" text-anchor="middle" font-size="11">the steam, not the helmsman</text>
  <text class="muted" x="320" y="342" text-anchor="middle">“I certainly learn what I finally do, I do not learn which motive has therewith actually proved victorious”</text>
</svg>

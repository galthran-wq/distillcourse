<svg viewBox="0 0 640 352" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>.label { fill: currentColor; } .muted { fill: currentColor; opacity: 0.55; font-size: 12px; } .amber { fill: #e2903a; } .blue { fill: #4c8dd6; }</style>
  <defs><marker id="fs-a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker><marker id="fs-am" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e2903a"/></marker><marker id="fs-bl" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4c8dd6"/></marker></defs>
  <text class="label" x="320" y="22" text-anchor="middle" font-weight="600">The tavern verdict after the critique</text>
  <text class="label" x="160" y="50" text-anchor="middle" font-weight="600">falls</text>
  <text class="amber" x="480" y="50" text-anchor="middle" font-weight="600">stands</text>
  <rect x="14" y="64" width="296" height="48" rx="5" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.35"/>
  <text class="label" x="26" y="84" font-size="12.5" opacity="0.7">free will in the superlative sense</text>
  <text class="muted" x="26" y="102" font-size="11">(causa sui)</text>
  <line x1="24" y1="80" x2="230" y2="80" stroke="currentColor" stroke-opacity="0.6"/>
  <rect x="14" y="122" width="296" height="48" rx="5" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.35"/>
  <text class="label" x="26" y="142" font-size="12.5" opacity="0.7">unfree will</text>
  <text class="muted" x="26" y="160" font-size="11">the self pushed by causes</text>
  <line x1="24" y1="138" x2="92" y2="138" stroke="currentColor" stroke-opacity="0.6"/>
  <rect x="14" y="180" width="296" height="48" rx="5" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.35"/>
  <text class="label" x="26" y="200" font-size="12.5" opacity="0.7">retributive blame</text>
  <text class="muted" x="26" y="218" font-size="11">he deserves to suffer: he could have held back</text>
  <line x1="24" y1="196" x2="128" y2="196" stroke="currentColor" stroke-opacity="0.6"/>
  <rect x="14" y="238" width="296" height="48" rx="5" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.35"/>
  <text class="label" x="26" y="258" font-size="12.5" opacity="0.7">guilt as deserved suffering</text>
  <text class="muted" x="26" y="276" font-size="11">remorse as its feeling</text>
  <line x1="24" y1="254" x2="188" y2="254" stroke="currentColor" stroke-opacity="0.6"/>
  <rect x="330" y="64" width="296" height="48" rx="5" fill="#e2903a" fill-opacity="0.12" stroke="#e2903a" stroke-width="1.3"/>
  <text class="label" x="342" y="84" font-size="12.5" font-weight="600">strong and weak will</text>
  <text class="muted" x="342" y="102" font-size="11">degrees of coordination among drives</text>
  <rect x="330" y="122" width="296" height="48" rx="5" fill="#e2903a" fill-opacity="0.12" stroke="#e2903a" stroke-width="1.3"/>
  <text class="label" x="342" y="142" font-size="12.5" font-weight="600">character</text>
  <text class="muted" x="342" y="160" font-size="11">the order of a person’s drives</text>
  <rect x="330" y="180" width="296" height="48" rx="5" fill="#e2903a" fill-opacity="0.12" stroke="#e2903a" stroke-width="1.3"/>
  <text class="label" x="342" y="200" font-size="12.5" font-weight="600">rank</text>
  <text class="muted" x="342" y="218" font-size="11">persons differ in strength</text>
  <rect x="330" y="238" width="296" height="48" rx="5" fill="#e2903a" fill-opacity="0.12" stroke="#e2903a" stroke-width="1.3"/>
  <text class="label" x="342" y="258" font-size="12.5" font-weight="600">restraint and defence</text>
  <text class="muted" x="342" y="276" font-size="11">without any claim of desert</text>
  <rect x="80" y="304" width="480" height="34" rx="5" fill="none" stroke="currentColor" stroke-opacity="0.5" stroke-dasharray="4 3"/>
  <text class="label" x="320" y="326" text-anchor="middle" font-size="12">praise, admiration, the innocence of becoming: the four great errors</text>
</svg>

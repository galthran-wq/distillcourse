<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>.label { fill: currentColor; } .muted { fill: currentColor; opacity: 0.55; font-size: 12px; } .amber { fill: #e2903a; } .blue { fill: #4c8dd6; }</style>
  <defs><marker id="fk-a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker><marker id="fk-am" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e2903a"/></marker><marker id="fk-bl" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4c8dd6"/></marker></defs>
  <text class="label" x="320" y="22" text-anchor="middle" font-weight="600">Does conscious willing cause anything?</text>
  <rect x="140" y="38" width="360" height="46" rx="5" fill="none" stroke="currentColor" stroke-opacity="0.6"/>
  <text class="label" x="320" y="58" text-anchor="middle" font-weight="600" font-size="12.5">no free subject behind the deed</text>
  <text class="muted" x="320" y="75" text-anchor="middle">grammar · causa sui · the willing complex</text>
  <line x1="260" y1="84" x2="170" y2="116" stroke="currentColor" stroke-opacity="0.6" marker-end="url(#fk-a)"/>
  <line x1="380" y1="84" x2="470" y2="116" stroke="currentColor" stroke-opacity="0.6" marker-end="url(#fk-a)"/>
  <rect x="14" y="118" width="296" height="104" rx="5" fill="#4c8dd6" fill-opacity="0.12" stroke="#4c8dd6" stroke-width="1.4"/>
  <text class="blue" x="26" y="140" font-weight="600" font-size="12.5">an accompaniment</text>
  <text class="label" x="26" y="160" font-size="12">the sense of deciding is a story</text>
  <text class="label" x="26" y="176" font-size="12">told alongside the process</text>
  <text class="muted" x="26" y="198" font-size="11">GS 360 “no helmsman at all?”; notebook 14</text>
  <text class="muted" x="26" y="213" font-size="11">(1888); TI (1888) leans here</text>
  <rect x="330" y="118" width="296" height="104" rx="5" fill="#e2903a" fill-opacity="0.12" stroke="#e2903a" stroke-width="1.4"/>
  <text class="amber" x="342" y="140" font-weight="600" font-size="12.5">effective, as a drive commanding</text>
  <text class="label" x="342" y="160" font-size="12">a real order that is often obeyed,</text>
  <text class="label" x="342" y="176" font-size="12">not a free subject choosing</text>
  <text class="muted" x="342" y="198" font-size="11">BGE 19’s command; BGE 21’s strong will;</text>
  <text class="muted" x="342" y="213" font-size="11">BGE (1886) sits here</text>
  <line x1="162" y1="222" x2="270" y2="258" stroke="currentColor" stroke-opacity="0.6" marker-end="url(#fk-a)"/>
  <line x1="478" y1="222" x2="370" y2="258" stroke="currentColor" stroke-opacity="0.6" marker-end="url(#fk-a)"/>
  <rect x="120" y="260" width="400" height="46" rx="5" fill="currentColor" fill-opacity="0.07" stroke="currentColor" stroke-opacity="0.6"/>
  <text class="label" x="320" y="280" text-anchor="middle" font-weight="600" font-size="12.5">retributive blame loses its premise either way</text>
  <text class="muted" x="320" y="297" text-anchor="middle">no one stands behind the blow who could have held it back</text>
</svg>

<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tag { fill: currentColor; font-weight: 600; }
    .box { fill: none; stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.3; }
    .box-a { fill: none; stroke: #e2903a; stroke-width: 2; }
    .dashed { stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.4; fill: none; stroke-dasharray: 4 3; }
    .amber-arrow { stroke: #e2903a; stroke-width: 2; fill: none; }
    .amber { fill: #e2903a; font-weight: 600; }
  </style>

  <text class="tag" x="16" y="24">Error 2 of 4: a false causality (Twilight, "Four Great Errors" §3)</text>

  <!-- A and B -->
  <rect class="box" x="60" y="70" width="200" height="44" rx="5"/>
  <text class="label" x="160" y="89" text-anchor="middle">the will, an "inner fact"</text>
  <text class="muted small" x="160" y="105" text-anchor="middle">A</text>
  <rect class="box" x="380" y="70" width="200" height="44" rx="5"/>
  <text class="label" x="480" y="89" text-anchor="middle">the action</text>
  <text class="muted small" x="480" y="105" text-anchor="middle">B</text>

  <!-- as morality draws it -->
  <path class="dashed" d="M 262 92 L 376 92"/>
  <path class="dashed" d="M 369 87 L 376 92 L 369 97"/>
  <text class="muted small" x="320" y="60" text-anchor="middle">as morality draws it: A causes B ("catching causality in the act")</text>

  <!-- as it is -->
  <rect class="box-a" x="220" y="180" width="200" height="44" rx="5"/>
  <text class="amber" x="320" y="199" text-anchor="middle">the antecedentia of the act</text>
  <text class="muted small" x="320" y="215" text-anchor="middle">C, unobserved</text>
  <path class="amber-arrow" d="M 380 178 L 460 118"/>
  <path class="amber-arrow" d="M 450 118 L 460 118 L 458 128"/>
  <text class="amber small" x="320" y="160" text-anchor="middle">as it is: C causes B; A "merely accompanies events, it can also be absent"</text>
  <text class="muted small" x="320" y="246" text-anchor="middle">the "motive": "a surface phenomenon of consciousness, which conceals rather than exposes the antecedentia"</text>
</svg>

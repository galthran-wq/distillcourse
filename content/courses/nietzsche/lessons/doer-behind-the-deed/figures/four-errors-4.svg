<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tag { fill: currentColor; font-weight: 600; }
    .box { fill: none; stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.3; }
    .box-a { fill: none; stroke: #e2903a; stroke-width: 2; }
    .dashed { stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.4; fill: none; stroke-dasharray: 4 3; }
    .amber-arrow { stroke: #e2903a; stroke-width: 2; fill: none; }
    .amber { fill: #e2903a; font-weight: 600; }
  </style>

  <text class="tag" x="16" y="24">Error 4 of 4: free will (Twilight, "Four Great Errors" §7)</text>

  <!-- A and B -->
  <rect class="box" x="60" y="70" width="200" height="44" rx="5"/>
  <text class="label" x="160" y="89" text-anchor="middle">a doer able to do otherwise</text>
  <text class="muted small" x="160" y="105" text-anchor="middle">A, "free will"</text>
  <rect class="box" x="380" y="70" width="200" height="44" rx="5"/>
  <text class="label" x="480" y="89" text-anchor="middle">guilt, judgment, punishment</text>
  <text class="muted small" x="480" y="105" text-anchor="middle">B</text>

  <!-- as morality draws it -->
  <path class="dashed" d="M 262 92 L 376 92"/>
  <path class="dashed" d="M 369 87 L 376 92 L 369 97"/>
  <text class="muted small" x="320" y="60" text-anchor="middle">as morality draws it: A grounds B (because free, guilty; because guilty, punishable)</text>

  <!-- as it is -->
  <rect class="box-a" x="220" y="180" width="200" height="44" rx="5"/>
  <text class="amber" x="320" y="199" text-anchor="middle">the instinct to punish and judge</text>
  <text class="muted small" x="320" y="215" text-anchor="middle">the priest's "right to ordain punishments"</text>
  <path class="amber-arrow" d="M 376 134 L 264 134"/>
  <path class="amber-arrow" d="M 271 129 L 264 134 L 271 139"/>
  <path class="amber-arrow" d="M 460 118 L 460 134"/>
  <path class="amber-arrow" d="M 320 178 L 320 140"/>
  <text class="amber small" x="320" y="160" text-anchor="middle">as it is: the wish for B invents A ("invented essentially for the purpose of punishment")</text>
  <text class="muted small" x="320" y="246" text-anchor="middle">"men were thought of as 'free' so that they could be judged, punished, so that they could become guilty"</text>
</svg>

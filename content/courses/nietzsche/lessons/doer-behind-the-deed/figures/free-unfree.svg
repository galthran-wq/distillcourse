<svg viewBox="0 0 640 312" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>.label { fill: currentColor; } .muted { fill: currentColor; opacity: 0.55; font-size: 12px; } .amber { fill: #e2903a; } .blue { fill: #4c8dd6; }</style>
  <defs><marker id="fu-a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker><marker id="fu-am" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e2903a"/></marker><marker id="fu-bl" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4c8dd6"/></marker></defs>
  <text class="label" x="320" y="22" text-anchor="middle" font-weight="600">Free will, unfree will, and neither (BGE 21)</text>
  <rect x="14" y="40" width="204" height="190" rx="5" fill="none" stroke="currentColor" stroke-opacity="0.4"/>
  <text class="label" x="116" y="60" text-anchor="middle" font-weight="600">free will</text>
  <circle cx="54" cy="110" r="9" fill="#4c8dd6" fill-opacity="0.25" stroke="#4c8dd6"/>
  <rect x="45" y="121" width="18" height="34" rx="6" fill="#4c8dd6" fill-opacity="0.25" stroke="#4c8dd6"/>
  <text class="blue" x="54" y="172" text-anchor="middle" font-size="11">the self</text>
  <circle cx="94" cy="138" r="9" fill="none" stroke="currentColor" stroke-opacity="0.55"/>
  <circle cx="120" cy="138" r="12" fill="none" stroke="currentColor" stroke-opacity="0.55"/>
  <circle cx="148" cy="138" r="8" fill="none" stroke="currentColor" stroke-opacity="0.55"/>
  <circle cx="172" cy="138" r="11" fill="none" stroke="currentColor" stroke-opacity="0.55"/>
  <rect x="164" y="182" width="46" height="24" rx="4" fill="none" stroke="currentColor" stroke-opacity="0.6"/>
  <text class="label" x="187" y="198" text-anchor="middle" font-size="11">deed</text>
  <path d="M66 118 C124 92 164 110 182 180" fill="none" stroke="#e2903a" stroke-width="1.6" marker-end="url(#fu-am)"/>
  <text class="muted" x="116" y="222" text-anchor="middle">the self picks which drive acts</text>
  <rect x="232" y="40" width="204" height="190" rx="5" fill="none" stroke="currentColor" stroke-opacity="0.4"/>
  <text class="label" x="334" y="60" text-anchor="middle" font-weight="600">unfree will</text>
  <circle cx="272" cy="110" r="9" fill="#4c8dd6" fill-opacity="0.25" stroke="#4c8dd6"/>
  <rect x="263" y="121" width="18" height="34" rx="6" fill="#4c8dd6" fill-opacity="0.25" stroke="#4c8dd6"/>
  <text class="blue" x="272" y="172" text-anchor="middle" font-size="11">the self</text>
  <circle cx="312" cy="138" r="9" fill="none" stroke="currentColor" stroke-opacity="0.55"/>
  <circle cx="338" cy="138" r="12" fill="none" stroke="currentColor" stroke-opacity="0.55"/>
  <circle cx="366" cy="138" r="8" fill="none" stroke="currentColor" stroke-opacity="0.55"/>
  <circle cx="390" cy="138" r="11" fill="none" stroke="currentColor" stroke-opacity="0.55"/>
  <rect x="382" y="182" width="46" height="24" rx="4" fill="none" stroke="currentColor" stroke-opacity="0.6"/>
  <text class="label" x="405" y="198" text-anchor="middle" font-size="11">deed</text>
  <line x1="324" y1="124" x2="286" y2="116" stroke="#e2903a" stroke-width="1.6" marker-end="url(#fu-am)"/>
  <text class="amber" x="352" y="104" font-size="11">causes</text>
  <line x1="360" y1="108" x2="288" y2="108" stroke="#e2903a" stroke-width="1.6" marker-end="url(#fu-am)"/>
  <line x1="266" y1="80" x2="266" y2="101" stroke="currentColor" stroke-opacity="0.5"/>
  <line x1="278" y1="80" x2="278" y2="101" stroke="currentColor" stroke-opacity="0.5"/>
  <line x1="258" y1="80" x2="286" y2="80" stroke="currentColor" stroke-opacity="0.5"/>
  <line x1="324" y1="152" x2="396" y2="180" stroke="currentColor" stroke-opacity="0.5" marker-end="url(#fu-a)"/>
  <text class="muted" x="334" y="222" text-anchor="middle">causes push the self</text>
  <rect x="450" y="40" width="176" height="190" rx="5" fill="#e2903a" fill-opacity="0.08" stroke="#e2903a" stroke-width="1.5"/>
  <text class="amber" x="538" y="60" text-anchor="middle" font-weight="600">neither</text>
  <circle cx="538" cy="96" r="13" fill="#e2903a" fill-opacity="0.25" stroke="#e2903a" stroke-opacity="1"/>
  <circle cx="508" cy="128" r="10" fill="#e2903a" fill-opacity="0.175" stroke="#e2903a" stroke-opacity="0.7"/>
  <circle cx="568" cy="128" r="10" fill="#e2903a" fill-opacity="0.175" stroke="#e2903a" stroke-opacity="0.7"/>
  <circle cx="492" cy="160" r="7" fill="#e2903a" fill-opacity="0.1125" stroke="#e2903a" stroke-opacity="0.45"/>
  <circle cx="538" cy="160" r="8" fill="#e2903a" fill-opacity="0.1125" stroke="#e2903a" stroke-opacity="0.45"/>
  <circle cx="584" cy="160" r="7" fill="#e2903a" fill-opacity="0.1125" stroke="#e2903a" stroke-opacity="0.45"/>
  <line x1="538" y1="109" x2="538" y2="150" stroke="#e2903a" stroke-opacity="0.6"/>
  <line x1="530" y1="106" x2="512" y2="118" stroke="#e2903a" stroke-opacity="0.6"/>
  <line x1="546" y1="106" x2="564" y2="118" stroke="#e2903a" stroke-opacity="0.6"/>
  <text class="label" x="538" y="194" text-anchor="middle" font-size="12">drives in an order of rank;</text>
  <text class="label" x="538" y="210" text-anchor="middle" font-size="12">no figure behind them</text>
  <text class="muted" x="538" y="224" text-anchor="middle" font-size="11">only strong and weak wills</text>
  <line x1="30" y1="252" x2="420" y2="252" stroke="#4c8dd6" stroke-width="1.2"/>
  <text class="blue" x="225" y="272" text-anchor="middle" font-size="12">one doer behind the deed: sovereign, or prisoner</text>
  <text class="muted" x="320" y="298" text-anchor="middle">“The ‘unfree will’ is mythology; in real life it is only a question of strong and weak wills.”</text>
</svg>

<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tag { fill: currentColor; font-weight: 600; }
    .big { font-size: 26px; font-weight: 700; fill: #e2903a; }
    .box { fill: none; stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.3; }
    .bracket { fill: none; stroke: #e2903a; stroke-width: 1.8; }
    .badge { fill: #e2903a; }
    .badgetext { fill: white; font-size: 10px; font-weight: 700; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .rule { stroke: currentColor; stroke-opacity: 0.35; stroke-width: 1; }
  </style>

  <text class="big" x="320" y="40" text-anchor="middle">"I think"</text>
  <text class="muted small" x="320" y="58" text-anchor="middle">taken as an "immediate certainty" (BGE 16)</text>

  <!-- bracket from the words down to the stack -->
  <path class="bracket" d="M 320 64 L 320 76 L 60 76 L 60 86"/>
  <path class="bracket" d="M 320 76 L 500 76 L 500 86"/>

  <!-- four claims -->
  <rect class="box" x="60" y="88" width="440" height="36" rx="5"/>
  <circle class="badge" cx="78" cy="106" r="8"/>
  <text class="badgetext" x="78" y="110" text-anchor="middle">1</text>
  <text class="label" x="94" y="110">there is an I, and it is I who am thinking</text>
  <text class="blue small" x="570" y="110" text-anchor="middle">unproven</text>

  <rect class="box" x="60" y="134" width="440" height="36" rx="5"/>
  <circle class="badge" cx="78" cy="152" r="8"/>
  <text class="badgetext" x="78" y="156" text-anchor="middle">2</text>
  <text class="label" x="94" y="156">the I is the cause, and the thinking its effect</text>
  <text class="blue small" x="570" y="156" text-anchor="middle">unproven</text>

  <rect class="box" x="60" y="180" width="440" height="36" rx="5"/>
  <circle class="badge" cx="78" cy="198" r="8"/>
  <text class="badgetext" x="78" y="202" text-anchor="middle">3</text>
  <text class="label" x="94" y="202">thinking is one activity, told apart from willing and feeling</text>
  <text class="blue small" x="570" y="202" text-anchor="middle">unproven</text>

  <rect class="box" x="60" y="226" width="440" height="36" rx="5"/>
  <circle class="badge" cx="78" cy="244" r="8"/>
  <text class="badgetext" x="78" y="248" text-anchor="middle">4</text>
  <text class="label" x="94" y="248">I already know what thinking is (by retrospective comparison)</text>
  <text class="blue small" x="570" y="248" text-anchor="middle">unproven</text>

  <path class="rule" d="M 60 280 L 600 280"/>
  <text class="label small" x="60" y="300">BGE 17: the observed fact is "a thought comes when 'it' wants"; so "it thinks",</text>
  <text class="label small" x="60" y="315">and "even the 'it' is too much": the pronoun is grammar's, not the process's</text>
</svg>

<svg viewBox="0 0 640 318" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>.label { fill: currentColor; } .muted { fill: currentColor; opacity: 0.55; font-size: 12px; } .amber { fill: #e2903a; } .blue { fill: #4c8dd6; }</style>
  <defs><marker id="lt-a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker><marker id="lt-am" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e2903a"/></marker><marker id="lt-bl" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4c8dd6"/></marker></defs>
  <text class="label" x="320" y="22" text-anchor="middle" font-weight="600">The lightning and its flash (GM I 13)</text>
  <rect x="20" y="40" width="270" height="200" rx="5" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.3"/>
  <path d="M165 66 L140 128 L162 128 L135 196 L185 110 L162 110 L182 66 Z" fill="#e2903a" fill-opacity="0.85" stroke="#e2903a"/>
  <text class="amber" x="155" y="226" text-anchor="middle" font-size="12" font-weight="600">what happens: one event</text>
  <rect x="310" y="40" width="310" height="200" rx="5" fill="none" stroke="currentColor" stroke-opacity="0.3"/>
  <text class="label" x="465" y="120" text-anchor="middle">a discharge of light</text>
  <text class="muted" x="465" y="142" text-anchor="middle">nothing here yet is a thing doing something</text>
  <text class="label" x="320" y="268" text-anchor="middle" font-size="12.5">1 · the event: a flash, observed</text>
  <text class="muted" x="320" y="304" text-anchor="middle">“‘the doer’ is merely a fiction added to the deed — the deed is everything”</text>
</svg>

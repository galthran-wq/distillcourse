<svg viewBox="0 0 640 310" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tag { fill: currentColor; font-weight: 600; }
    .panel { fill: none; stroke: currentColor; stroke-opacity: 0.35; stroke-width: 1.2; }
    .box { fill: none; stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.3; }
    .box-b { fill: none; stroke: #4c8dd6; stroke-width: 1.6; }
    .struck { fill: none; stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .strike { stroke: currentColor; stroke-opacity: 0.7; stroke-width: 1.6; }
    .arrow { stroke: #4c8dd6; stroke-width: 1.8; fill: none; }
    .bolt { fill: #e2903a; stroke: none; }
    .rule { stroke: currentColor; stroke-opacity: 0.35; stroke-width: 1; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
  </style>

  <!-- left panel: as grammar has it -->
  <rect class="panel" x="16" y="16" width="296" height="196" rx="6"/>
  <text class="tag" x="28" y="36">as grammar has it</text>
  <text class="muted small" x="28" y="52">a subject and its deed: "the lightning flashes"</text>

  <rect class="box-b" x="40" y="84" width="110" height="38" rx="5"/>
  <text class="label" x="95" y="102" text-anchor="middle">the lightning</text>
  <text class="muted small" x="95" y="116" text-anchor="middle">the subject</text>

  <path class="arrow" d="M 152 103 L 196 103"/>
  <path class="arrow" d="M 189 98 L 196 103 L 189 108"/>
  <text class="blue small" x="174" y="94" text-anchor="middle">does</text>

  <rect class="box-b" x="198" y="84" width="96" height="38" rx="5"/>
  <text class="label" x="246" y="102" text-anchor="middle">flashes</text>
  <text class="muted small" x="246" y="116" text-anchor="middle">the deed</text>

  <text class="muted small" x="28" y="160">"a doing-doing" (Thun-Thun): the same event,</text>
  <text class="muted small" x="28" y="174">once as cause and once again as its effect</text>
  <text class="muted small" x="28" y="200">the popular mind takes the split for a fact</text>

  <!-- right panel: as it is -->
  <rect class="panel" x="328" y="16" width="296" height="196" rx="6"/>
  <text class="tag" x="340" y="36">as it is</text>
  <text class="muted small" x="340" y="52">"the deed is everything" (I:13)</text>

  <path class="bolt" d="M 392 66 L 372 112 L 390 108 L 366 160 L 412 100 L 394 104 L 414 66 Z"/>
  <text class="amber" x="440" y="100">one event: the flash</text>
  <text class="muted small" x="440" y="116">no lightning apart from flashing</text>

  <rect class="struck" x="440" y="136" width="120" height="34" rx="5"/>
  <text class="label" x="500" y="157" text-anchor="middle">the doer</text>
  <path class="strike" d="M 444 140 L 556 166"/>
  <path class="strike" d="M 556 140 L 444 166"/>
  <text class="muted small" x="440" y="190">"added on to the deed"</text>
  <text class="muted small" x="440" y="204">(hinzugedichtet)</text>

  <!-- mapping row -->
  <path class="rule" d="M 16 228 L 624 228"/>
  <text class="tag small" x="16" y="248">the analogy, term by term</text>
  <text class="label small" x="16" y="268">the lightning → strength</text>
  <text class="label small" x="200" y="268">the flash → the expression of strength</text>
  <text class="label small" x="16" y="286">the doer → "an indifferent substratum free to express strength or not"; blamed by the lambs, struck by the section</text>
</svg>

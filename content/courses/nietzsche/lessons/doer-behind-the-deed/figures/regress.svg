<svg viewBox="0 0 640 370" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>.label { fill: currentColor; } .muted { fill: currentColor; opacity: 0.55; font-size: 12px; } .amber { fill: #e2903a; } .blue { fill: #4c8dd6; }</style>
  <defs><marker id="rg-a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker><marker id="rg-am" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e2903a"/></marker><marker id="rg-bl" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4c8dd6"/></marker></defs>
  <text class="label" x="320" y="22" text-anchor="middle" font-weight="600">Ultimate responsibility for the blow, traced back (BGE 21)</text>
  <rect x="330" y="44" width="272" height="44" rx="5" fill="none" stroke="currentColor" stroke-opacity="0.55"/>
  <text class="label" x="342" y="63" font-weight="600" font-size="12.5">the blow in the tavern</text>
  <line x1="390" y1="88" x2="370" y2="104" stroke="currentColor" stroke-opacity="0.6" marker-end="url(#rg-a)"/>
  <text class="muted" x="400" y="100" font-size="11">came from</text>
  <rect x="250" y="104" width="272" height="44" rx="5" fill="none" stroke="currentColor" stroke-opacity="0.55"/>
  <text class="label" x="262" y="123" font-weight="600" font-size="12.5">his temper: insult turns to violence</text>
  <text class="muted" x="262" y="140">the blow came from it</text>
  <line x1="310" y1="148" x2="290" y2="164" stroke="currentColor" stroke-opacity="0.6" marker-end="url(#rg-a)"/>
  <text class="muted" x="320" y="160" font-size="11">came from</text>
  <rect x="170" y="164" width="272" height="44" rx="5" fill="none" stroke="currentColor" stroke-opacity="0.55"/>
  <text class="label" x="182" y="183" font-weight="600" font-size="12.5">the habits that formed it</text>
  <text class="muted" x="182" y="200">chosen with the character he had then</text>
  <line x1="230" y1="208" x2="210" y2="224" stroke="currentColor" stroke-opacity="0.6" marker-end="url(#rg-a)"/>
  <text class="muted" x="240" y="220" font-size="11">came from</text>
  <rect x="90" y="224" width="272" height="44" rx="5" fill="none" stroke="currentColor" stroke-opacity="0.55"/>
  <text class="label" x="102" y="243" font-weight="600" font-size="12.5">that earlier character …</text>
  <text class="muted" x="102" y="260">chosen with an earlier one, and so on</text>
  <rect x="20" y="290" width="410" height="40" rx="5" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.3"/>
  <text class="label" x="32" y="315" font-size="12.5">what he never chose: parents, body, upbringing, town, chance</text>
  <line x1="150" y1="268" x2="150" y2="288" stroke="currentColor" stroke-opacity="0.6" marker-end="url(#rg-a)"/>
  <rect x="452" y="190" width="174" height="140" rx="5" fill="#e2903a" fill-opacity="0.1" stroke="#e2903a" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text class="amber" x="539" y="210" text-anchor="middle" font-weight="600" font-size="12.5">what the court needs</text>
  <text class="label" x="539" y="232" text-anchor="middle" font-size="12">a self that made itself</text>
  <text class="label" x="539" y="248" text-anchor="middle" font-size="12">from nothing: causa sui</text>
  <text class="amber" x="539" y="282" text-anchor="middle" font-size="12">like Münchhausen,</text>
  <text class="amber" x="539" y="298" text-anchor="middle" font-size="12">pulling himself out</text>
  <text class="amber" x="539" y="314" text-anchor="middle" font-size="12">of the swamp by his hair</text>
  <text class="muted" x="320" y="356" text-anchor="middle">each self that shapes a character was already shaped; the chain ends in the unchosen, or in a self-cause</text>
</svg>

<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tag { fill: currentColor; font-weight: 600; }
    .box { fill: none; stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.3; }
    .box-d { fill: none; stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .box-a { fill: none; stroke: #e2903a; stroke-width: 2; }
    .strike { stroke: currentColor; stroke-opacity: 0.7; stroke-width: 1.6; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .rule { stroke: currentColor; stroke-opacity: 0.35; stroke-width: 1; }
  </style>

  <!-- left column -->
  <text class="tag" x="16" y="24">MPS's descriptive component</text>

  <rect class="box-d" x="16" y="40" width="296" height="72" rx="6"/>
  <text class="label" x="28" y="62">1. free will: the strong could choose weakness</text>
  <text class="blue small" x="28" y="80">removed: I:13, BGE 21, Twilight §7</text>
  <text class="muted small" x="28" y="98">the doer "free to express strength or not": grammar's</text>
  <path class="strike" d="M 20 44 L 308 108"/>

  <rect class="box-d" x="16" y="128" width="296" height="72" rx="6"/>
  <text class="label" x="28" y="150">2. transparency: motives are known from inside</text>
  <text class="blue small" x="28" y="168">damaged: BGE 16, Twilight §3; verdict deferred</text>
  <text class="muted small" x="28" y="186">"inner facts, none of which has been shown to be factual"</text>

  <rect class="box" x="16" y="216" width="296" height="72" rx="6"/>
  <text class="label" x="28" y="238">3. similarity: one morality fits all persons</text>
  <text class="blue small" x="28" y="256">untouched here</text>
  <text class="muted small" x="28" y="274">the Third Treatise's business (types of sufferer)</text>

  <!-- right column -->
  <text class="tag" x="334" y="24">kept</text>

  <rect class="box-a" x="334" y="40" width="290" height="72" rx="6"/>
  <text class="amber" x="346" y="62">strong and weak wills: a type-difference</text>
  <text class="label small" x="346" y="80">BGE 21; BGE 19's commonwealth in which</text>
  <text class="label small" x="346" y="96">command is obeyed, or is not</text>

  <rect class="box-a" x="334" y="128" width="290" height="72" rx="6"/>
  <text class="amber" x="346" y="150">the feeling of freedom, as a datum</text>
  <text class="label small" x="346" y="168">BGE 19: the commander's affect of superiority,</text>
  <text class="label small" x="346" y="184">real as a feeling, not a fact about a substratum</text>

  <rect class="box-a" x="334" y="216" width="290" height="72" rx="6"/>
  <text class="amber" x="346" y="238">responsibility as a bred capacity</text>
  <text class="label small" x="346" y="256">GM II:2, the next lesson: "the long history of</text>
  <text class="label small" x="346" y="272">how responsibility originated", not a causa sui</text>

  <path class="rule" d="M 16 306 L 624 306"/>
  <text class="muted small" x="320" y="326" text-anchor="middle">the Doctrine of Types is exactly this remainder: type-facts that bound a life without fixing it</text>
</svg>

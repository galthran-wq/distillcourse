<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tag { fill: currentColor; font-weight: 600; }
    .struck { fill: none; stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .strike { stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.6; }
    .box-a { fill: none; stroke: #e2903a; stroke-width: 2; }
    .arrow { stroke: #4c8dd6; stroke-width: 1.6; fill: none; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
  </style>

  <!-- free will -->
  <rect class="struck" x="24" y="40" width="270" height="120" rx="6"/>
  <text class="tag" x="36" y="62">"free will" (causa sui)</text>
  <text class="label small" x="36" y="82">the whole and ultimate cause of one's own acts,</text>
  <text class="label small" x="36" y="96">owing nothing to "God, world, ancestors,</text>
  <text class="label small" x="36" y="110">chance, and society"</text>
  <text class="muted small" x="36" y="132">"pulling yourself by the hair from the swamp</text>
  <text class="muted small" x="36" y="146">of nothingness up into existence"</text>
  <path class="strike" d="M 30 46 L 288 154"/>
  <path class="strike" d="M 288 46 L 30 154"/>

  <!-- un-free will -->
  <rect class="struck" x="346" y="40" width="270" height="120" rx="6"/>
  <text class="tag" x="358" y="62">"un-free will" (mechanism)</text>
  <text class="label small" x="358" y="82">cause and effect objectified as things in the</text>
  <text class="label small" x="358" y="96">world that compel: "the cause push and shove</text>
  <text class="label small" x="358" y="110">until it 'effects' something"</text>
  <text class="muted small" x="358" y="132">in the "in-itself" there is no "causal association",</text>
  <text class="muted small" x="358" y="146">"necessity", "psychological un-freedom"</text>
  <path class="strike" d="M 352 46 L 610 154"/>
  <path class="strike" d="M 610 46 L 352 154"/>

  <!-- reversal arrow -->
  <path class="arrow" d="M 298 100 L 342 100"/>
  <path class="arrow" d="M 305 95 L 298 100 L 305 105"/>
  <path class="arrow" d="M 335 95 L 342 100 L 335 105"/>
  <text class="blue small" x="320" y="30" text-anchor="middle">"the reversal of this misconceived concept": one mythology, read in two directions</text>

  <!-- remainder -->
  <text class="muted small" x="320" y="192" text-anchor="middle">what remains</text>
  <rect class="box-a" x="140" y="202" width="360" height="64" rx="6"/>
  <text class="amber" x="320" y="226" text-anchor="middle">strong and weak wills</text>
  <text class="label small" x="320" y="244" text-anchor="middle">a difference of type, not of freedom (BGE 21)</text>
  <text class="muted small" x="320" y="258" text-anchor="middle">BGE 19: a commonwealth in which command is, or is not, obeyed</text>
</svg>

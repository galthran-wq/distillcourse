<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>.label { fill: currentColor; } .muted { fill: currentColor; opacity: 0.55; font-size: 12px; } .amber { fill: #e2903a; } .blue { fill: #4c8dd6; }</style>
  <defs><marker id="wc-a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker><marker id="wc-am" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e2903a"/></marker><marker id="wc-bl" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4c8dd6"/></marker></defs>
  <text class="label" x="320" y="22" text-anchor="middle" font-weight="600">What one act of will contains (BGE 19)</text>
  <rect x="14" y="40" width="192" height="90" rx="5" fill="#4c8dd6" fill-opacity="0.13" stroke="#4c8dd6" stroke-width="1.4"/>
  <text x="26" y="62" font-weight="600" font-size="12.5" fill="#4c8dd6">1 · sensations</text>
  <text class="label" x="26" y="84" font-size="12">away from, towards,</text>
  <text class="label" x="26" y="100" font-size="12">the movement itself, the</text>
  <text class="label" x="26" y="116" font-size="12">muscles getting ready</text>
  <line x1="110" y1="130" x2="285" y2="156" stroke="currentColor" stroke-opacity="0.5"/>
  <rect x="224" y="40" width="192" height="90" rx="5" fill="#4c8dd6" fill-opacity="0.13" stroke="#4c8dd6" stroke-width="1.4"/>
  <text x="236" y="62" font-weight="600" font-size="12.5" fill="#4c8dd6">2 · commanding thought</text>
  <text class="label" x="236" y="84" font-size="12">“this and nothing else</text>
  <text class="label" x="236" y="100" font-size="12">is necessary now”</text>
  <line x1="320" y1="130" x2="320" y2="156" stroke="currentColor" stroke-opacity="0.5"/>
  <rect x="434" y="40" width="192" height="90" rx="5" fill="#e2903a" fill-opacity="0.13" stroke="#e2903a" stroke-width="1.4"/>
  <text x="446" y="62" font-weight="600" font-size="12.5" fill="#e2903a">3 · affect of command</text>
  <text class="label" x="446" y="84" font-size="12">“I am free,</text>
  <text class="label" x="446" y="100" font-size="12">‘he’ must obey”</text>
  <line x1="530" y1="130" x2="355" y2="156" stroke="currentColor" stroke-opacity="0.5"/>
  <text class="amber" x="604" y="148" text-anchor="end" font-size="11.5">= what is called “freedom of the will”</text>
  <rect x="200" y="158" width="240" height="30" rx="4" fill="none" stroke="currentColor" stroke-opacity="0.5" stroke-dasharray="4 3"/>
  <text class="label" x="320" y="178" text-anchor="middle">one word: “willing”</text>
  <line x1="320" y1="188" x2="150" y2="246" stroke="#e2903a" stroke-width="1.4" marker-end="url(#wc-am)"/>
  <circle cx="150" cy="262" r="15" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.5"/>
  <line x1="320" y1="188" x2="250" y2="246" stroke="#e2903a" stroke-width="1.4" marker-end="url(#wc-am)"/>
  <circle cx="250" cy="262" r="15" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.5"/>
  <line x1="320" y1="188" x2="350" y2="246" stroke="#e2903a" stroke-width="1.4" marker-end="url(#wc-am)"/>
  <circle cx="350" cy="262" r="15" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.5"/>
  <line x1="320" y1="188" x2="450" y2="246" stroke="#e2903a" stroke-width="1.4" marker-end="url(#wc-am)"/>
  <circle cx="450" cy="262" r="15" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.5"/>
  <text class="amber" x="232" y="220" font-size="11.5" text-anchor="end">command</text>
  <text class="label" x="300" y="300" text-anchor="middle" font-size="12">the obeying drives: they do the work</text>
  <path d="M470 262 H616 V132" fill="none" stroke="#4c8dd6" stroke-width="1.5" marker-end="url(#wc-bl)"/>
  <text class="blue" x="540" y="256" font-size="12">success</text>
  <rect x="476" y="282" width="150" height="44" rx="4" fill="none" stroke="currentColor" stroke-opacity="0.5" stroke-dasharray="4 3"/>
  <text class="label" x="551" y="300" text-anchor="middle" font-size="12">“I did it”</text>
  <text class="muted" x="551" y="317" text-anchor="middle" font-size="11">willing seems to suffice</text>
  <text class="muted" x="320" y="346" text-anchor="middle">the commander enjoys the triumph over resistance as its own: L’effet c’est moi</text>
</svg>

<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
<style>.label{fill:currentColor}.muted{fill:currentColor;opacity:.55;font-size:11.5px}.amber{fill:#e2903a}.blue{fill:#4c8dd6}</style>
<defs>
<g id="cb-face"><circle cx="0" cy="0" r="22" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="-8" cy="-5" r="2" fill="currentColor"/><circle cx="8" cy="-5" r="2" fill="currentColor"/><path d="M-8 8 Q0 14 8 8" fill="none" stroke="currentColor" stroke-width="1.3"/></g>
<marker id="cb-ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="currentColor" fill-opacity="0.6"/></marker>
</defs>
<text class="muted" x="105" y="24" text-anchor="middle" font-weight="600">1 the choice</text>
<text class="muted" x="320" y="24" text-anchor="middle" font-weight="600">2 the swap</text>
<text class="muted" x="530" y="24" text-anchor="middle" font-weight="600">3 the reason</text>
<rect x="30" y="50" width="66" height="90" rx="5" fill="#e2903a" fill-opacity="0.12" stroke="#e2903a" stroke-width="2"/>
<use href="#cb-face" x="63" y="88"/><text class="label" x="63" y="132" text-anchor="middle" font-weight="700">A</text>
<rect x="114" y="50" width="66" height="90" rx="5" fill="none" stroke="currentColor" stroke-opacity="0.5"/>
<use href="#cb-face" x="147" y="88"/><circle cx="125" cy="95" r="3" fill="none" stroke="currentColor"/><circle cx="169" cy="95" r="3" fill="none" stroke="currentColor"/>
<text class="label" x="147" y="132" text-anchor="middle" font-weight="700">B</text>
<text class="amber" x="63" y="162" text-anchor="middle" font-weight="600">chosen</text>
<line x1="206" y1="95" x2="246" y2="95" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.5" marker-end="url(#cb-ar)"/>
<rect x="287" y="50" width="66" height="90" rx="5" fill="#4c8dd6" fill-opacity="0.12" stroke="#4c8dd6" stroke-width="2"/>
<use href="#cb-face" x="320" y="88"/><circle cx="298" cy="95" r="3" fill="none" stroke="currentColor"/><circle cx="342" cy="95" r="3" fill="none" stroke="currentColor"/>
<text class="label" x="320" y="132" text-anchor="middle" font-weight="700">B</text>
<text class="blue" x="320" y="162" text-anchor="middle" font-weight="600">handed over:</text>
<text class="blue" x="320" y="178" text-anchor="middle" font-weight="600">the face she rejected</text>
<line x1="392" y1="95" x2="432" y2="95" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.5" marker-end="url(#cb-ar)"/>
<rect x="452" y="70" width="66" height="90" rx="5" fill="#4c8dd6" fill-opacity="0.12" stroke="#4c8dd6" stroke-width="2"/>
<use href="#cb-face" x="485" y="108"/><circle cx="463" cy="115" r="3" fill="none" stroke="currentColor"/><circle cx="507" cy="115" r="3" fill="none" stroke="currentColor"/>
<text class="label" x="485" y="152" text-anchor="middle" font-weight="700">B</text>
<rect x="452" y="30" width="176" height="30" rx="8" fill="none" stroke="currentColor" stroke-opacity="0.6"/>
<text class="label" x="540" y="50" text-anchor="middle" font-size="12">“I chose her for the earrings”</text>
<text class="muted" x="540" y="182" text-anchor="middle">only B wears earrings</text>
<rect x="30" y="214" width="580" height="64" rx="5" fill="none" stroke="currentColor" stroke-opacity="0.3" stroke-dasharray="4 4"/>
<text class="label" x="320" y="240" text-anchor="middle">at least three swaps in four went unnoticed;</text>
<text class="label" x="320" y="262" text-anchor="middle">the reasons given were as detailed, as confident, as emotional as on real trials</text>
<text class="muted" x="320" y="320" text-anchor="middle">“I do not learn which motive has therewith actually proved victorious” (D 129)</text>
</svg>

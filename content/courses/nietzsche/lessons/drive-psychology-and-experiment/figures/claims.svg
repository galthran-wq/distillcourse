<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12.5">
<style>.label{fill:currentColor}.muted{fill:currentColor;opacity:.55;font-size:11.5px}.amber{fill:#e2903a}</style>
<text class="muted" x="20" y="24" font-weight="600">the claim</text>
<text class="muted" x="236" y="24" font-weight="600">stated in</text>
<text class="muted" x="372" y="24" font-weight="600">evidence that could refute it</text>
<line x1="14" y1="34" x2="626" y2="34" stroke="currentColor" stroke-opacity="0.3"/>
<rect x="14" y="42" width="612" height="56" rx="5" fill="#e2903a" fill-opacity="0.1" stroke="#e2903a" stroke-width="1.2"/>
<text class="amber" x="20" y="64" font-weight="700">1 reasons after the fact</text>
<text class="label" x="236" y="64">D 119, D 129</text>
<text class="label" x="372" y="64">sincere reasons given for</text>
<text class="label" x="372" y="82">choices they did not cause</text>
<rect x="14" y="106" width="612" height="56" rx="5" fill="none" stroke="currentColor" stroke-opacity="0.35"/>
<text class="label" x="20" y="128" font-weight="700">2 principles</text><text class="label" x="34" y="146" font-weight="700">that do not steer</text>
<text class="label" x="236" y="128">GS 335, D 129</text>
<text class="label" x="372" y="128">professed attitudes compared</text>
<text class="label" x="372" y="146">with what people then do</text>
<rect x="14" y="170" width="612" height="56" rx="5" fill="none" stroke="currentColor" stroke-opacity="0.35"/>
<text class="label" x="20" y="192" font-weight="700">3 constitution</text>
<text class="label" x="236" y="192">BGE 231, GM Pref. 2,</text>
<text class="label" x="236" y="210">EH 'Clever' 2</text>
<text class="label" x="372" y="192">relatives sharing genes resemble</text>
<text class="label" x="372" y="210">each other more, however raised</text>
<rect x="14" y="234" width="612" height="56" rx="5" fill="none" stroke="currentColor" stroke-opacity="0.35"/>
<text class="label" x="20" y="256" font-weight="700">4 upbringing</text><text class="label" x="34" y="274" font-weight="700">shapes the form</text>
<text class="label" x="236" y="256">D 38, HH 107</text>
<text class="label" x="372" y="256">one home: hardly more alike than</text>
<text class="label" x="372" y="274">strangers; one disposition, many forms</text>
<rect x="14" y="298" width="612" height="56" rx="5" fill="none" stroke="currentColor" stroke-opacity="0.25" stroke-dasharray="4 4"/>
<text class="muted" x="20" y="320" font-weight="700" font-size="12.5">5 a life as an experiment</text>
<text class="muted" x="236" y="320" font-size="12.5">GS 319, D 453</text>
<text class="muted" x="372" y="320" font-size="12.5">a stance, not a finding:</text>
<text class="muted" x="372" y="338" font-size="12.5">no study can test it</text>
<text class="muted" x="320" y="386" text-anchor="middle">“We ourselves wish to be our experiments and guinea pigs” (GS 319)</text>
</svg>

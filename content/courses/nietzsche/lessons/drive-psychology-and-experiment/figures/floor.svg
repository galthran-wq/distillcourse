</g>
<path d="M240 260 L240 70" stroke="currentColor" stroke-width="4" stroke-opacity="0.7"/>
<path d="M240 190 Q200 188 140 190 M240 190 Q290 188 340 190 M240 140 Q190 138 130 140 M240 140 Q300 138 350 140 M240 90 Q200 90 150 90 M240 90 Q290 90 330 90" fill="none" stroke="currentColor" stroke-width="2.2" stroke-opacity="0.7"/>
<g fill="#e2903a"><circle cx="160" cy="184" r="5"/><circle cx="310" cy="184" r="5"/><circle cx="150" cy="134" r="5"/><circle cx="330" cy="134" r="5"/><circle cx="180" cy="84" r="5"/><circle cx="300" cy="84" r="5"/></g>
<text class="blue" x="240" y="44" text-anchor="middle" font-weight="700">drives: trained, redirected, given style</text>
<text class="label" x="240" y="60" text-anchor="middle" font-size="11.5">the gardener's trellis (D 560, GS 290)</text>
<text class="muted" x="392" y="114">small doses (D 534)</text>
<text class="muted" x="392" y="158">circumstances</text>
<text class="muted" x="392" y="173">magnify and</text>
<text class="muted" x="392" y="188">diminish (D 326)</text>
<path d="M500 70 L512 70 L512 330 L500 330" fill="none" stroke="currentColor" stroke-opacity="0.6"/>
<text class="label" x="522" y="212" font-size="12">a floor,</text>
<text class="label" x="522" y="228" font-size="12">not a ceiling</text>
<text class="muted" x="522" y="246">the stone holds;</text>
<text class="muted" x="522" y="261">what grows on</text>
<text class="muted" x="522" y="276">it can be</text>
<text class="muted" x="522" y="291">trained</text>
<text class="muted" x="320" y="374" text-anchor="middle">“Learning alters us … But at the bottom of our souls … something unteachable” (BGE 231)</text>

<text class="amber" x="240" y="284" text-anchor="middle" font-weight="700">granite: a few decisions and answers</text>
<text class="label" x="240" y="302" text-anchor="middle">on “cardinal problems” (BGE 231)</text>
<text class="muted" x="240" y="320" text-anchor="middle">“the ugly that could not be removed” (GS 290)</text>
<g stroke="#4c8dd6" stroke-width="1.4">
<line x1="120" y1="60" x2="120" y2="258"/><line x1="360" y1="60" x2="360" y2="258"/>

<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12.5">
<style>.label{fill:currentColor}.muted{fill:currentColor;opacity:.55;font-size:11.5px}.amber{fill:#e2903a}.blue{fill:#4c8dd6}</style>
<defs>
<g id="tw-p"><circle cx="0" cy="-14" r="7"/><path d="M-9 14 L-9 -2 Q0 -8 9 -2 L9 14 Z"/></g>
</defs>
<text class="label" x="150" y="24" text-anchor="middle" font-weight="700">twins raised together</text>
<text class="label" x="480" y="24" text-anchor="middle" font-weight="700">adopted children</text>
<line x1="320" y1="12" x2="320" y2="270" stroke="currentColor" stroke-opacity="0.2"/>
<rect x="20" y="40" width="270" height="66" rx="5" fill="#e2903a" fill-opacity="0.1" stroke="#e2903a" stroke-width="1.2"/>
<use href="#tw-p" x="48" y="74" fill="#e2903a"/><use href="#tw-p" x="72" y="74" fill="#e2903a"/>
<text class="amber" x="96" y="66" font-weight="600">identical</text>
<text class="label" x="96" y="84">all genes shared, same home</text>
<rect x="20" y="116" width="270" height="66" rx="5" fill="#4c8dd6" fill-opacity="0.1" stroke="#4c8dd6" stroke-width="1.2"/>
<use href="#tw-p" x="48" y="150" fill="#4c8dd6"/><use href="#tw-p" x="72" y="150" fill="#4c8dd6"/>
<text class="blue" x="96" y="142" font-weight="600">fraternal</text>
<text class="label" x="96" y="160">about half shared, same home</text>
<text class="label" x="155" y="212" text-anchor="middle">if identical pairs are more alike,</text>
<text class="label" x="155" y="230" text-anchor="middle">the extra likeness follows the extra genes</text>
<use href="#tw-p" x="480" y="160" fill="currentColor"/>
<text class="label" x="480" y="196" text-anchor="middle" font-weight="600">the child</text>
<rect x="334" y="40" width="136" height="58" rx="5" fill="#e2903a" fill-opacity="0.1" stroke="#e2903a" stroke-width="1.2"/>
<text class="amber" x="402" y="64" text-anchor="middle" font-weight="600">birth parents</text>
<text class="label" x="402" y="84" text-anchor="middle" font-size="11">genes, not the home</text>
<rect x="480" y="40" width="152" height="58" rx="5" fill="#4c8dd6" fill-opacity="0.1" stroke="#4c8dd6" stroke-width="1.2"/>
<text class="blue" x="556" y="64" text-anchor="middle" font-weight="600">adoptive parents</text>
<text class="label" x="556" y="84" text-anchor="middle" font-size="11">the home, not the genes</text>
<line x1="405" y1="100" x2="470" y2="140" stroke="#e2903a" stroke-width="1.6"/>
<line x1="556" y1="100" x2="490" y2="140" stroke="#4c8dd6" stroke-width="1.6"/>
<text class="label" x="480" y="230" text-anchor="middle">which do they come to resemble?</text>
<text class="muted" x="320" y="306" text-anchor="middle">two natural experiments that pull genes and home apart</text>
</svg>

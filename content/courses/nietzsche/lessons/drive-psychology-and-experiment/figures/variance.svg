<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12.5">
<style>.label{fill:currentColor}.muted{fill:currentColor;opacity:.55;font-size:11.5px}</style>
<text class="label" x="20" y="30" font-weight="700">what goes with differences between people</text>
<text class="label" x="240" y="59" text-anchor="end">genes: major personality traits</text>
<rect x="250" y="47" width="170.0" height="16" rx="2" fill="#e2903a" fill-opacity="0.85"/>
<rect x="386.0" y="47" width="34.0" height="16" rx="2" fill="none" stroke="#e2903a" stroke-dasharray="3 2"/>
<text class="label" x="428.0" y="59" font-size="12">about 40–50%</text>
<text class="label" x="240" y="89" text-anchor="end">the family one grows up in</text>
<rect x="250" y="77" width="34.0" height="16" rx="2" fill="#4c8dd6" fill-opacity="0.85"/>
<rect x="250.0" y="77" width="34.0" height="16" rx="2" fill="none" stroke="#4c8dd6" stroke-dasharray="3 2"/>
<text class="label" x="292.0" y="89" font-size="12">about 0–10%</text>
<text class="label" x="240" y="119" text-anchor="end">a stated attitude, for its conduct</text>
<rect x="250" y="107" width="47.6" height="16" rx="2" fill="currentColor" fill-opacity="0.35"/>
<text class="label" x="305.6" y="119" font-size="12">about 14%</text>
<text class="label" x="240" y="149" text-anchor="end">a classic situation (being in a hurry)</text>
<rect x="250" y="137" width="47.6" height="16" rx="2" fill="currentColor" fill-opacity="0.35"/>
<text class="label" x="305.6" y="149" font-size="12">about 14%</text>
<text class="label" x="20" y="174" font-weight="700">how well conduct predicts conduct</text>
<text class="label" x="240" y="203" text-anchor="end">one honesty test, from another</text>
<rect x="250" y="191" width="17.0" height="16" rx="2" fill="currentColor" fill-opacity="0.35"/>
<text class="label" x="275.0" y="203" font-size="12">about 5%</text>
<text class="label" x="240" y="233" text-anchor="end">a battery of tests, from another</text>
<rect x="250" y="221" width="119.0" height="16" rx="2" fill="#e2903a" fill-opacity="0.85"/>
<rect x="335.0" y="221" width="34.0" height="16" rx="2" fill="none" stroke="#e2903a" stroke-dasharray="3 2"/>
<text class="label" x="377.0" y="233" font-size="12">about 25–35%</text>
<line x1="250" y1="254" x2="590" y2="254" stroke="currentColor" stroke-opacity="0.5"/>
<line x1="250.0" y1="254" x2="250.0" y2="259" stroke="currentColor" stroke-opacity="0.5"/>
<text class="muted" x="250.0" y="272" text-anchor="middle">0%</text>
<line x1="250.0" y1="36" x2="250.0" y2="254" stroke="currentColor" stroke-opacity="0.12" stroke-dasharray="3 3"/>
<line x1="335.0" y1="254" x2="335.0" y2="259" stroke="currentColor" stroke-opacity="0.5"/>
<text class="muted" x="335.0" y="272" text-anchor="middle">25%</text>
<line x1="335.0" y1="36" x2="335.0" y2="254" stroke="currentColor" stroke-opacity="0.12" stroke-dasharray="3 3"/>
<line x1="420.0" y1="254" x2="420.0" y2="259" stroke="currentColor" stroke-opacity="0.5"/>
<text class="muted" x="420.0" y="272" text-anchor="middle">50%</text>
<line x1="420.0" y1="36" x2="420.0" y2="254" stroke="currentColor" stroke-opacity="0.12" stroke-dasharray="3 3"/>
<line x1="505.0" y1="254" x2="505.0" y2="259" stroke="currentColor" stroke-opacity="0.5"/>
<text class="muted" x="505.0" y="272" text-anchor="middle">75%</text>
<line x1="505.0" y1="36" x2="505.0" y2="254" stroke="currentColor" stroke-opacity="0.12" stroke-dasharray="3 3"/>
<line x1="590.0" y1="254" x2="590.0" y2="259" stroke="currentColor" stroke-opacity="0.5"/>
<text class="muted" x="590.0" y="272" text-anchor="middle">100%</text>
<line x1="590.0" y1="36" x2="590.0" y2="254" stroke="currentColor" stroke-opacity="0.12" stroke-dasharray="3 3"/>
<text class="muted" x="320" y="298" text-anchor="middle">variance explained: the share of the differences between people</text>
<text class="muted" x="320" y="314" text-anchor="middle">that goes along with differences in the factor</text>
<text class="muted" x="320" y="340" text-anchor="middle" font-weight="600">each bar an average over many studies</text>
</svg>

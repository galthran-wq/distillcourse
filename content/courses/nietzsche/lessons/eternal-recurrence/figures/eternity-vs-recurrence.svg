<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tiny { font-size: 9.5px; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .box { fill: none; stroke: currentColor; stroke-opacity: 0.45; stroke-width: 1.2; }
    .box-a { fill: none; stroke: #e2903a; stroke-width: 2.2; }
    .box-b { fill: none; stroke: #4c8dd6; stroke-width: 1.6; }
    .box-d { fill: none; stroke: currentColor; stroke-opacity: 0.4; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .line-b { stroke: #4c8dd6; stroke-width: 2.2; }
    .line-a { stroke: #e2903a; stroke-width: 2.2; }
    .dot-a { fill: #e2903a; }
    .rule { stroke: currentColor; stroke-opacity: 0.3; stroke-width: 1; }
    .strike { stroke: #e2903a; stroke-width: 2; }
  </style>
  <text class="muted small" x="16" y="18">Three questions, three objects: the marriage question, Agnes's "once or twice", and the demon's "innumerable times"</text>

  <!-- 1. marriage -->
  <rect class="box" x="20" y="36" width="190" height="120" rx="6"/>
  <text class="label" x="30" y="56" font-weight="600">"would you marry me again?"</text>
  <text class="muted tiny" x="30" y="70">Clark 1990, p. 269</text>
  <text class="label small" x="30" y="92">object: the whole relation, not a</text>
  <text class="label small" x="30" y="106">moment; an unrealistic model (you,</text>
  <text class="label small" x="30" y="120">knowing what you know) adopted on</text>
  <text class="label small" x="30" y="134">purpose; the answer reveals a present</text>
  <text class="label small" x="30" y="148">attitude, not a prediction</text>

  <!-- 2. Agnes -->
  <rect class="box-d" x="224" y="36" width="192" height="120" rx="6"/>
  <text class="label" x="234" y="56" font-weight="600">"once more — or twice"</text>
  <text class="muted tiny" x="234" y="70">Kundera, Immortality (1990), Agnes</text>
  <text class="label small" x="234" y="92">a life one would relive a bounded</text>
  <text class="label small" x="234" y="106">number of times passes; the horizon</text>
  <text class="label small" x="234" y="120">is finite, so endurance suffices:</text>
  <text class="label small" x="234" y="134">"at least I'll never have to go</text>
  <text class="label small" x="234" y="148">through that again"</text>

  <!-- 3. demon -->
  <rect class="box-a" x="430" y="36" width="190" height="120" rx="6"/>
  <text class="amber" x="440" y="56">"innumerable times more"</text>
  <text class="muted tiny" x="440" y="70">GS 341</text>
  <text class="label small" x="440" y="92">no point at which the life is over</text>
  <text class="label small" x="440" y="106">and done with; endurance is not</text>
  <text class="label small" x="440" y="120">available, so only a Yes to the</text>
  <text class="label small" x="440" y="134">whole as such passes — the eternity</text>
  <text class="label small" x="440" y="148">constraint's work</text>

  <!-- lower: eternity as permanence vs eternity as recurrence -->
  <line class="rule" x1="16" y1="172" x2="624" y2="172"/>
  <text class="muted tiny" x="16" y="190">Reginster 2006, ch. 5 §III.2: two wishes with the word "eternity" in them, and opposite objects</text>

  <rect class="box-b" x="20" y="200" width="290" height="96" rx="6"/>
  <text class="blue" x="30" y="220">"let this moment never end"</text>
  <line class="line-b" x1="30" y1="240" x2="290" y2="240"/>
  <text class="muted tiny" x="30" y="256">one state, held; time stopped</text>
  <text class="label small" x="30" y="274">eternity as permanence: the wish of a lover, and of</text>
  <text class="label small" x="30" y="288">Plato's "being" — a wish against becoming</text>

  <rect class="box-a" x="330" y="200" width="290" height="96" rx="6"/>
  <text class="amber" x="340" y="220">"do you want this once more … innumerable times?"</text>
  <line class="line-a" x1="340" y1="240" x2="380" y2="240"/><circle class="dot-a" cx="380" cy="240" r="3"/>
  <line class="line-a" x1="386" y1="240" x2="426" y2="240"/><circle class="dot-a" cx="426" cy="240" r="3"/>
  <line class="line-a" x1="432" y1="240" x2="472" y2="240"/><circle class="dot-a" cx="472" cy="240" r="3"/>
  <line class="line-a" x1="478" y1="240" x2="518" y2="240"/><circle class="dot-a" cx="518" cy="240" r="3"/>
  <text class="muted tiny" x="530" y="244">…</text>
  <text class="muted tiny" x="340" y="256">the process, ended and begun again; time kept</text>
  <text class="label small" x="340" y="274">eternity as recurrence: a wish whose object is</text>
  <text class="label small" x="340" y="288">becoming itself — what a permanent state would ruin</text>

  <text class="label small" x="16" y="316">So a formal "would you change nothing?" test is not yet the demon's: his wish cannot be granted to a life that wants a</text>
  <text class="label small" x="16" y="330">final state, which is why the test needs the revaluation of becoming (and of suffering) the previous lesson derived.</text>
</svg>

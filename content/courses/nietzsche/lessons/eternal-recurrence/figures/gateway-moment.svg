<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tiny { font-size: 9.5px; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .lane { stroke: currentColor; stroke-opacity: 0.55; stroke-width: 1.6; fill: none; }
    .lane-d { stroke: currentColor; stroke-opacity: 0.35; stroke-width: 1.2; fill: none; stroke-dasharray: 3 4; }
    .gate { fill: none; stroke: #e2903a; stroke-width: 2.2; }
    .circle-d { fill: none; stroke: currentColor; stroke-opacity: 0.3; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .strike { stroke: #e2903a; stroke-width: 2; }
    .tick { stroke: currentColor; stroke-opacity: 0.4; stroke-width: 1; }
    .rule { stroke: currentColor; stroke-opacity: 0.3; stroke-width: 1; }
  </style>
  <text class="muted small" x="16" y="18">Z III 2, "On the Vision and the Riddle": the gateway, the dwarf's circle, and the decision</text>

  <!-- the dwarf's circle, faint and struck -->
  <ellipse class="circle-d" cx="320" cy="150" rx="250" ry="88"/>
  <text class="muted tiny" x="300" y="70">the dwarf: "time itself is a circle"</text>
  <text class="muted tiny" x="284" y="82">die Zeit selber ist ein Kreis — "do not make it too easy"</text>
  <line class="strike" x1="290" y1="60" x2="352" y2="86"/>

  <!-- the two lanes -->
  <path class="lane" d="M40 150 L296 150"/>
  <path class="lane-d" d="M20 150 L40 150"/>
  <path class="lane" d="M344 150 L600 150"/>
  <path class="lane-d" d="M600 150 L620 150"/>
  <!-- arrow heads outward -->
  <path class="lane" d="M48 144 L40 150 L48 156"/>
  <path class="lane" d="M592 144 L600 150 L592 156"/>
  <text class="label small" x="60" y="140">the long lane back: "it lasts an eternity"</text>
  <text class="muted tiny" x="60" y="170">behind us lies an eternity</text>
  <text class="label small" x="372" y="140">the long lane outward: "another eternity"</text>
  <text class="muted tiny" x="372" y="170">whatever can run must run it once more</text>

  <!-- the gateway -->
  <rect class="gate" x="296" y="112" width="48" height="76" rx="4"/>
  <text class="amber" x="299" y="105">Augenblick</text>
  <text class="muted tiny" x="304" y="203">"Moment"</text>
  <!-- collision marks at the gate -->
  <line class="tick" x1="290" y1="128" x2="296" y2="128"/>
  <line class="tick" x1="290" y1="172" x2="296" y2="172"/>
  <line class="tick" x1="344" y1="128" x2="350" y2="128"/>
  <line class="tick" x1="344" y1="172" x2="350" y2="172"/>
  <text class="label small" x="214" y="228">"they contradict each other … they blatantly offend each other</text>
  <text class="label small" x="240" y="242">— and here at this gateway is where they come together"</text>

  <!-- footer: two readings of the gate -->
  <line class="rule" x1="16" y1="258" x2="624" y2="258"/>
  <text class="muted tiny" x="16" y="274">spectator (the dwarf):</text>
  <text class="label small" x="140" y="274">the lanes meet far off in infinity; recurrence is a parade passing the gate; nothing to decide</text>
  <text class="amber tiny" x="16" y="296">one who stands in the gate:</text>
  <text class="label small" x="160" y="296">past and future collide in the one who acts toward the future and takes up the past (Heidegger, vol. II §24);</text>
  <text class="label small" x="160" y="310">Zarathustra's own restatement stays a question: "must we not all have been here before?"</text>
</svg>

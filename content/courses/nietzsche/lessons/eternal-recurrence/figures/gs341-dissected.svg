<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tiny { font-size: 9.5px; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .box { fill: none; stroke: currentColor; stroke-opacity: 0.45; stroke-width: 1.2; }
    .box-a { fill: none; stroke: #e2903a; stroke-width: 2; }
    .box-d { fill: none; stroke: currentColor; stroke-opacity: 0.4; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .arrow { stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.4; fill: none; }
    .strike { stroke: #e2903a; stroke-width: 2; }
    .rule { stroke: currentColor; stroke-opacity: 0.3; stroke-width: 1; }
  </style>
  <text class="muted small" x="16" y="18">GS 341 (1882): the demon's speech as three constraints, each with the clause that states it and the escape it closes</text>

  <!-- column headers -->
  <text class="muted tiny" x="24" y="44">constraint</text>
  <text class="muted tiny" x="176" y="44">the demon's clause</text>
  <text class="muted tiny" x="452" y="44">the escape it blocks</text>
  <line class="rule" x1="16" y1="50" x2="624" y2="50"/>

  <!-- row 1: recurrence -->
  <rect class="box-a" x="20" y="62" width="132" height="70" rx="5"/>
  <text class="amber" x="30" y="84">1 · recurrence</text>
  <text class="label small" x="30" y="102">the whole life again,</text>
  <text class="label small" x="30" y="116">not a single one</text>
  <rect class="box" x="168" y="62" width="264" height="70" rx="5"/>
  <text class="label small" x="178" y="82">"this life, as you now live it and</text>
  <text class="label small" x="178" y="96">have lived it, you will have to live</text>
  <text class="label small" x="178" y="110">once more and innumerable times more"</text>
  <text class="muted tiny" x="178" y="124">noch einmal und noch unzählige Male</text>
  <path class="arrow" d="M432 97 L444 97"/>
  <rect class="box-d" x="448" y="62" width="172" height="70" rx="5"/>
  <text class="label small" x="458" y="84">hope for a better next time:</text>
  <text class="label small" x="458" y="98">the past is placed ahead</text>
  <text class="label small" x="458" y="112">again, so the whole is judged</text>
  <line class="strike" x1="456" y1="122" x2="612" y2="122"/>
  <text class="muted tiny" x="458" y="126"> </text>

  <!-- row 2: sameness -->
  <rect class="box-a" x="20" y="148" width="132" height="70" rx="5"/>
  <text class="amber" x="30" y="170">2 · sameness</text>
  <text class="label small" x="30" y="188">nothing new; every</text>
  <text class="label small" x="30" y="202">pain, in sequence</text>
  <rect class="box" x="168" y="148" width="264" height="70" rx="5"/>
  <text class="label small" x="178" y="168">"there will be nothing new in it …</text>
  <text class="label small" x="178" y="182">every pain and every joy … all in the</text>
  <text class="label small" x="178" y="196">same series and sequence"</text>
  <text class="muted tiny" x="178" y="210">Alles in der selben Reihe und Folge</text>
  <path class="arrow" d="M432 183 L444 183"/>
  <rect class="box-d" x="448" y="148" width="172" height="70" rx="5"/>
  <text class="label small" x="458" y="170">selective affirmation:</text>
  <text class="label small" x="458" y="184">a Yes bought by leaving</text>
  <text class="label small" x="458" y="198">out what one would change</text>
  <line class="strike" x1="456" y1="208" x2="612" y2="208"/>

  <!-- row 3: eternity -->
  <rect class="box-a" x="20" y="234" width="132" height="70" rx="5"/>
  <text class="amber" x="30" y="256">3 · eternity</text>
  <text class="label small" x="30" y="274">innumerable times;</text>
  <text class="label small" x="30" y="288">the hourglass turned again</text>
  <rect class="box" x="168" y="234" width="264" height="70" rx="5"/>
  <text class="label small" x="178" y="254">"the eternal hourglass of existence</text>
  <text class="label small" x="178" y="268">is turned over again and again, and</text>
  <text class="label small" x="178" y="282">you with it, speck of dust!"</text>
  <text class="muted tiny" x="178" y="296">die ewige Sanduhr des Daseins</text>
  <path class="arrow" d="M432 269 L444 269"/>
  <rect class="box-d" x="448" y="234" width="172" height="70" rx="5"/>
  <text class="label small" x="458" y="256">a finite horizon: bearing it</text>
  <text class="label small" x="458" y="270">once or twice and being done</text>
  <text class="label small" x="458" y="284">(Kundera's Agnes)</text>
  <line class="strike" x1="456" y1="294" x2="612" y2="294"/>

  <!-- footer -->
  <line class="rule" x1="16" y1="318" x2="624" y2="318"/>
  <text class="label small" x="16" y="336">The mood throughout is conditional: "what if …", "would you not …", "how well disposed would you have to become".</text>
  <text class="muted tiny" x="16" y="350">The demon asserts nothing about the world; the three constraints fix what a Yes would have to be a Yes to.</text>
</svg>

<svg viewBox="0 0 640 220" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tiny { font-size: 9.5px; }
    .amber { fill: #e2903a; font-weight: 600; }
    .axis { stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.4; }
    .tick { stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.2; }
    .dot { fill: currentColor; }
    .dot-a { fill: #e2903a; }
    .span { stroke: #e2903a; stroke-width: 4; stroke-opacity: 0.5; }
  </style>
  <text class="muted small" x="16" y="18">Krell's literary parallels (Heidegger vol. II, Analysis): the recurrence thought before and after Nietzsche wrote it, 1851–1922</text>

  <!-- axis 1850..1925 across x=60..600 : 7.2 px/yr -->
  <line class="axis" x1="60" y1="120" x2="600" y2="120"/>
  <line class="tick" x1="60" y1="114" x2="60" y2="126"/><text class="muted tiny" x="48" y="140">1850</text>
  <line class="tick" x1="240" y1="114" x2="240" y2="126"/><text class="muted tiny" x="228" y="140">1875</text>
  <line class="tick" x1="420" y1="114" x2="420" y2="126"/><text class="muted tiny" x="408" y="140">1900</text>
  <line class="tick" x1="600" y1="114" x2="600" y2="126"/><text class="muted tiny" x="588" y="140">1925</text>

  <!-- Nietzsche's span: 1881 note to 1885 Z IV -->
  <line class="span" x1="283" y1="120" x2="312" y2="120"/>
  <text class="amber tiny" x="256" y="104">GS 341 (1882), Z III (1884)</text>
  <text class="amber tiny" x="270" y="92">the note of August 1881</text>

  <!-- Melville 1851 -->
  <circle class="dot" cx="67" cy="120" r="4"/>
  <text class="label small" x="30" y="166">Melville, Moby-Dick (1851):</text>
  <text class="muted tiny" x="30" y="178">Queequeg's coffin, kept as a sea-chest</text>

  <!-- Sinclair 1907 -->
  <circle class="dot" cx="470" cy="120" r="4"/>
  <text class="label small" x="380" y="60">Sinclair, The Overman (1907):</text>
  <text class="muted tiny" x="380" y="72">"life is their task, and life only"</text>

  <!-- Rilke 1906/07 -->
  <circle class="dot" cx="466" cy="120" r="4"/>
  <text class="label small" x="330" y="166">Rilke, "Das Karussell" (1906): the</text>
  <text class="muted tiny" x="330" y="178">carrousel's "and now and then a white elephant"</text>

  <!-- Joyce 1922 -->
  <circle class="dot" cx="578" cy="120" r="4"/>
  <text class="label small" x="500" y="196">Joyce, Ulysses, "Ithaca" (1922)</text>

  <text class="muted tiny" x="16" y="212">One line each: parallels of image, not evidence for any reading; the doctrine's textual base stays GS 341 and Z III.</text>
</svg>

<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tiny { font-size: 9.5px; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .wheel { fill: none; stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.4; }
    .axis { stroke: currentColor; stroke-opacity: 0.35; stroke-width: 1; stroke-dasharray: 3 3; }
    .mark-a { fill: #e2903a; }
    .mark-b { fill: #4c8dd6; }
    .mark-c { fill: #5aa46a; }
    .spoke-a { stroke: #e2903a; stroke-width: 1.6; }
    .spoke-b { stroke: #4c8dd6; stroke-width: 1.6; }
    .spoke-c { stroke: #5aa46a; stroke-width: 1.6; }
    .rule { stroke: currentColor; stroke-opacity: 0.3; stroke-width: 1; }
    .box-d { fill: none; stroke: currentColor; stroke-opacity: 0.4; stroke-width: 1.2; stroke-dasharray: 4 3; }
  </style>
  <text class="muted small" x="16" y="18">Simmel's counterexample (1907): three wheels on one axle, one marked point each, speeds 1, 2 and 1/π</text>

  <!-- t = 0: aligned -->
  <text class="label small" x="40" y="48">t = 0: the three marks in one line</text>
  <line class="axis" x1="110" y1="60" x2="110" y2="236"/>
  <circle class="wheel" cx="110" cy="100" r="30"/>
  <line class="spoke-a" x1="110" y1="100" x2="110" y2="70"/><circle class="mark-a" cx="110" cy="70" r="4"/>
  <circle class="wheel" cx="110" cy="160" r="30"/>
  <line class="spoke-b" x1="110" y1="160" x2="110" y2="130"/><circle class="mark-b" cx="110" cy="130" r="4"/>
  <circle class="wheel" cx="110" cy="220" r="30"/>
  <line class="spoke-c" x1="110" y1="220" x2="110" y2="190"/><circle class="mark-c" cx="110" cy="190" r="4"/>
  <text class="amber tiny" x="150" y="104">speed 1</text>
  <text class="blue tiny" x="150" y="164">speed 2</text>
  <text class="tiny" fill="#5aa46a" font-weight="600" x="150" y="224">speed 1/π</text>

  <!-- t = 1 turn of wheel 1 -->
  <text class="label small" x="250" y="48">t = 1 turn: wheels 1 and 2 realign,</text>
  <text class="label small" x="250" y="62">wheel 3 has turned 1/π ≈ 0.318</text>
  <circle class="wheel" cx="330" cy="100" r="30"/>
  <line class="spoke-a" x1="330" y1="100" x2="330" y2="70"/><circle class="mark-a" cx="330" cy="70" r="4"/>
  <circle class="wheel" cx="330" cy="160" r="30"/>
  <line class="spoke-b" x1="330" y1="160" x2="330" y2="130"/><circle class="mark-b" cx="330" cy="130" r="4"/>
  <circle class="wheel" cx="330" cy="220" r="30"/>
  <!-- 0.318 turn = 114.6 degrees clockwise from top -->
  <line class="spoke-c" x1="330" y1="220" x2="357.3" y2="232.5"/><circle class="mark-c" cx="357.3" cy="232.5" r="4"/>

  <!-- t = n turns -->
  <text class="label small" x="450" y="48">t = n turns, any whole n:</text>
  <text class="label small" x="450" y="62">wheel 3 at n/π — never a whole turn</text>
  <circle class="wheel" cx="530" cy="100" r="30"/>
  <line class="spoke-a" x1="530" y1="100" x2="530" y2="70"/><circle class="mark-a" cx="530" cy="70" r="4"/>
  <circle class="wheel" cx="530" cy="160" r="30"/>
  <line class="spoke-b" x1="530" y1="160" x2="530" y2="130"/><circle class="mark-b" cx="530" cy="130" r="4"/>
  <circle class="wheel" cx="530" cy="220" r="30"/>
  <!-- n = 7: 7/pi = 2.228 turns -> 0.228 turn = 82 degrees -->
  <line class="spoke-c" x1="530" y1="220" x2="559.7" y2="215.8"/><circle class="mark-c" cx="559.7" cy="215.8" r="4"/>
  <text class="muted tiny" x="450" y="250">π is irrational, so n/π is never an integer</text>

  <line class="rule" x1="16" y1="262" x2="624" y2="262"/>
  <text class="label small" x="16" y="280">Finitely many parts and infinite time do not entail that a configuration recurs: the parts are few, the states are not finite.</text>
  <text class="muted tiny" x="16" y="294">The notebook argument (11[148], 1881; 14[188], 1888) needs a finite number of states, which finite force does not give it.</text>
</svg>

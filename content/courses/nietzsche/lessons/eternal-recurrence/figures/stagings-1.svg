<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tiny { font-size: 9.5px; }
    .amber { fill: #e2903a; font-weight: 600; }
    .box { fill: none; stroke: currentColor; stroke-opacity: 0.45; stroke-width: 1.2; }
    .box-a { fill: none; stroke: #e2903a; stroke-width: 2.2; }
    .ghost { opacity: 0.28; }
    .arrow { stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.4; fill: none; }
    .rule { stroke: currentColor; stroke-opacity: 0.3; stroke-width: 1; }
  </style>
  <text class="muted small" x="16" y="18">The three stagings in Zarathustra: riddle → crisis → hymn (frame 1 of 3: the riddle)</text>

  <!-- panel 1: riddle (lit) -->
  <rect class="box-a" x="20" y="40" width="190" height="200" rx="6"/>
  <text class="amber" x="30" y="60">1 · riddle</text>
  <text class="muted tiny" x="30" y="74">Z III 2 "On the Vision and the Riddle"</text>
  <text class="label small" x="30" y="96">the gateway "Moment"; the dwarf's</text>
  <text class="label small" x="30" y="110">circle dismissed; Zarathustra's own</text>
  <text class="label small" x="30" y="124">version, softer and softer, as questions</text>
  <text class="label small" x="30" y="148">then: a shepherd, a black snake in his</text>
  <text class="label small" x="30" y="162">throat — "Bite down! Bite off the head!"</text>
  <text class="label small" x="30" y="176">— he bites, spits it far, and laughs "a</text>
  <text class="label small" x="30" y="190">laughter that was no human laughter"</text>
  <text class="muted tiny" x="30" y="214">"now guess me this riddle"; the</text>
  <text class="muted tiny" x="30" y="226">listeners are asked to interpret it</text>

  <path class="arrow" d="M212 140 L228 140 M223 135 L228 140 L223 145"/>

  <!-- panel 2: crisis (ghost) -->
  <g class="ghost">
    <rect class="box" x="232" y="40" width="190" height="200" rx="6"/>
    <text class="label" x="242" y="60" font-weight="600">2 · crisis</text>
    <text class="muted tiny" x="242" y="74">Z III 13 "The Convalescent"</text>
    <text class="label small" x="242" y="96">seven days' collapse</text>
    <text class="label small" x="242" y="110">"the small human being recurs</text>
    <text class="label small" x="242" y="124">eternally" — the nausea</text>
    <text class="label small" x="242" y="148">the animals' catechism: "everything</text>
    <text class="label small" x="242" y="162">goes, everything comes back"</text>
    <text class="label small" x="242" y="176">— "a hurdy-gurdy song"</text>
  </g>

  <path class="arrow ghost" d="M424 140 L440 140 M435 135 L440 140 L435 145"/>

  <!-- panel 3: hymn (ghost) -->
  <g class="ghost">
    <rect class="box" x="444" y="40" width="176" height="200" rx="6"/>
    <text class="label" x="454" y="60" font-weight="600">3 · hymn</text>
    <text class="muted tiny" x="454" y="74">Z III 15–16; Z IV 19</text>
    <text class="label small" x="454" y="96">"for all joy wants eternity —</text>
    <text class="label small" x="454" y="110">wants deep, deep eternity"</text>
    <text class="label small" x="454" y="134">"the nuptial ring of rings —</text>
    <text class="label small" x="454" y="148">the ring of recurrence"</text>
  </g>

  <line class="rule" x1="16" y1="256" x2="624" y2="256"/>
  <text class="label small" x="16" y="274">What changes: the thought is told, not taught. The dwarf's cosmology is the one line rejected; the riddle is left to the listeners.</text>
  <text class="muted tiny" x="16" y="290">The snake's meaning is supplied only in frame 2.</text>
</svg>

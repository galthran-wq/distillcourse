<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tiny { font-size: 9.5px; }
    .amber { fill: #e2903a; font-weight: 600; }
    .box { fill: none; stroke: currentColor; stroke-opacity: 0.45; stroke-width: 1.2; }
    .box-a { fill: none; stroke: #e2903a; stroke-width: 2.2; }
    .ghost { opacity: 0.28; }
    .arrow { stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.4; fill: none; }
    .rule { stroke: currentColor; stroke-opacity: 0.3; stroke-width: 1; }
    .strike { stroke: #e2903a; stroke-width: 2; }
  </style>
  <text class="muted small" x="16" y="18">The three stagings in Zarathustra: riddle → crisis → hymn (frame 2 of 3: the crisis)</text>

  <!-- panel 1: riddle (ghost) -->
  <g class="ghost">
    <rect class="box" x="20" y="40" width="190" height="200" rx="6"/>
    <text class="label" x="30" y="60" font-weight="600">1 · riddle</text>
    <text class="muted tiny" x="30" y="74">Z III 2 "On the Vision and the Riddle"</text>
    <text class="label small" x="30" y="96">the gateway "Moment"; the dwarf's</text>
    <text class="label small" x="30" y="110">circle dismissed; Zarathustra's own</text>
    <text class="label small" x="30" y="124">version, softer and softer, as questions</text>
    <text class="label small" x="30" y="148">then: a shepherd, a black snake in his</text>
    <text class="label small" x="30" y="162">throat — "Bite down! Bite off the head!"</text>
    <text class="label small" x="30" y="176">— he bites, spits it far, and laughs "a</text>
    <text class="label small" x="30" y="190">laughter that was no human laughter"</text>
  </g>

  <path class="arrow ghost" d="M212 140 L228 140 M223 135 L228 140 L223 145"/>

  <!-- panel 2: crisis (lit) -->
  <rect class="box-a" x="232" y="40" width="190" height="200" rx="6"/>
  <text class="amber" x="242" y="60">2 · crisis</text>
  <text class="muted tiny" x="242" y="74">Z III 13 "The Convalescent"</text>
  <text class="label small" x="242" y="96">seven days' collapse; the snake named:</text>
  <text class="label small" x="242" y="110">"that monster crawled into my throat"</text>
  <text class="label small" x="242" y="124">= "the small human being recurs</text>
  <text class="label small" x="242" y="138">eternally" — the nausea</text>
  <text class="label small" x="242" y="162">the animals' catechism: "everything</text>
  <text class="label small" x="242" y="176">goes, everything comes back; eternally</text>
  <text class="label small" x="242" y="190">rolls the wheel of being"</text>
  <line class="strike" x1="242" y1="196" x2="410" y2="196"/>
  <text class="amber tiny" x="242" y="214">"you have already made a hurdy-gurdy</text>
  <text class="amber tiny" x="242" y="226">song of it?" (ein Leier-Lied)</text>

  <path class="arrow" d="M424 140 L440 140 M435 135 L440 140 L435 145"/>

  <!-- panel 3: hymn (ghost) -->
  <g class="ghost">
    <rect class="box" x="444" y="40" width="176" height="200" rx="6"/>
    <text class="label" x="454" y="60" font-weight="600">3 · hymn</text>
    <text class="muted tiny" x="454" y="74">Z III 15–16; Z IV 19</text>
    <text class="label small" x="454" y="96">"for all joy wants eternity —</text>
    <text class="label small" x="454" y="110">wants deep, deep eternity"</text>
    <text class="label small" x="454" y="134">"the nuptial ring of rings —</text>
    <text class="label small" x="454" y="148">the ring of recurrence"</text>
  </g>

  <line class="rule" x1="16" y1="256" x2="624" y2="256"/>
  <text class="label small" x="16" y="274">What changes: the snake gets its content, and the one cosmological statement of the doctrine is the animals', mocked by its teacher.</text>
  <text class="muted tiny" x="16" y="290">The animals still name him "the teacher of the eternal recurrence"; he answers with silence.</text>
</svg>

<svg viewBox="0 0 640 372" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tiny { font-size: 9.5px; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .box { fill: none; stroke: currentColor; stroke-opacity: 0.45; stroke-width: 1.2; }
    .box-a { fill: none; stroke: #e2903a; stroke-width: 2.2; }
    .box-b { fill: none; stroke: #4c8dd6; stroke-width: 1.6; }
    .box-d { fill: none; stroke: currentColor; stroke-opacity: 0.4; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .rule { stroke: currentColor; stroke-opacity: 0.3; stroke-width: 1; }
  </style>
  <text class="muted small" x="16" y="18">Three readings of the recurrence, sorted by what each needs the text to say</text>

  <!-- cosmological -->
  <rect class="box-b" x="20" y="34" width="192" height="270" rx="6"/>
  <text class="blue" x="30" y="54">cosmological</text>
  <text class="muted tiny" x="30" y="68">Löwith 1935, Heidegger 1937, Loeb 2006–</text>
  <text class="label small" x="30" y="90">claim: the world literally repeats;</text>
  <text class="label small" x="30" y="104">Nietzsche's deepest metaphysical</text>
  <text class="label small" x="30" y="118">thought (Heidegger)</text>
  <text class="muted tiny" x="30" y="140">needs the text to say:</text>
  <text class="label small" x="30" y="154">· the 1881 and 1888 "proofs"</text>
  <text class="label small" x="30" y="168">  (Nachlass, 11[148], 14[188])</text>
  <text class="label small" x="30" y="182">· the animals' catechism (Z III 13)</text>
  <text class="label small" x="30" y="196">  read as the doctrine</text>
  <text class="muted tiny" x="30" y="218">must explain:</text>
  <text class="label small" x="30" y="232">why the books withhold the proof</text>
  <text class="label small" x="30" y="246">and mock the catechism; why the</text>
  <text class="label small" x="30" y="260">demon speaks in "what if"</text>
  <text class="blue tiny" x="30" y="284">grade: grounded in the Nachlass</text>
  <text class="blue tiny" x="30" y="296">— which the evidence rule denies</text>

  <!-- practical -->
  <rect class="box-a" x="224" y="34" width="192" height="270" rx="6"/>
  <text class="amber" x="234" y="54">practical</text>
  <text class="muted tiny" x="234" y="68">Nehamas 1985, Clark 1990, Reginster 2006</text>
  <text class="label small" x="234" y="90">claim: a test of whether a life is</text>
  <text class="label small" x="234" y="104">affirmed whole and as an end;</text>
  <text class="label small" x="234" y="118">its truth is irrelevant</text>
  <text class="muted tiny" x="234" y="140">needs the text to say:</text>
  <text class="label small" x="234" y="154">· GS 341's "would you …"</text>
  <text class="label small" x="234" y="168">· BGE 56's type, "da capo"</text>
  <text class="label small" x="234" y="182">· Zarathustra's nausea and</text>
  <text class="label small" x="234" y="196">  "On Redemption" (the test failed)</text>
  <text class="muted tiny" x="234" y="218">must explain:</text>
  <text class="label small" x="234" y="232">why a mere thought experiment</text>
  <text class="label small" x="234" y="246">was "the greatest weight"</text>
  <text class="label small" x="234" y="260">(Soll's challenge; Clark's reply)</text>
  <text class="amber tiny" x="234" y="284">grade: uses only published text;</text>
  <text class="amber tiny" x="234" y="296">the working hypothesis holds it</text>

  <!-- literary -->
  <rect class="box-d" x="428" y="34" width="192" height="270" rx="6"/>
  <text class="label" x="438" y="54" font-weight="600">literary</text>
  <text class="muted tiny" x="438" y="68">Nehamas 1985, ch. 5</text>
  <text class="label small" x="438" y="90">claim: a life is affirmed as a</text>
  <text class="label small" x="438" y="104">well-made work is: nothing in it</text>
  <text class="label small" x="438" y="118">subtractable without another life</text>
  <text class="muted tiny" x="438" y="140">needs the text to say:</text>
  <text class="label small" x="438" y="154">· "all things knotted together"</text>
  <text class="label small" x="438" y="168">  (Z III 2); "what returns … is</text>
  <text class="label small" x="438" y="182">  my own self" (Z III 1)</text>
  <text class="muted tiny" x="438" y="218">must explain:</text>
  <text class="label small" x="438" y="232">why a life, unlike a novel,</text>
  <text class="label small" x="438" y="246">cannot support counterfactuals</text>
  <text class="label small" x="438" y="260">(Anna Karenina's sister)</text>
  <text class="muted tiny" x="438" y="284">grade: deferred — Module 7,</text>
  <text class="muted tiny" x="438" y="296">"Life as Literature"</text>

  <line class="rule" x1="16" y1="320" x2="624" y2="320"/>
  <text class="label small" x="16" y="338">All three read the same GS 341; they differ on what the demon's "what if" is doing: reporting, testing, or describing a well-made whole.</text>
  <text class="muted tiny" x="16" y="354">The naturalist working hypothesis can hold the middle column and cannot use the left one.</text>
</svg>

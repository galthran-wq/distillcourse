<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tiny { font-size: 9.5px; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .box { fill: none; stroke: currentColor; stroke-opacity: 0.45; stroke-width: 1.2; }
    .box-a { fill: none; stroke: #e2903a; stroke-width: 2.2; }
    .box-b { fill: none; stroke: #4c8dd6; stroke-width: 1.6; }
    .box-d { fill: none; stroke: currentColor; stroke-opacity: 0.4; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .arrow { stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.4; fill: none; }
    .arrow-b { stroke: #4c8dd6; stroke-width: 1.8; fill: none; }
    .arrow-d { stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.2; fill: none; stroke-dasharray: 3 3; }
    .stone { fill: currentColor; fill-opacity: 0.18; stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.4; }
    .strike { stroke: #e2903a; stroke-width: 2.4; }
    .rule { stroke: currentColor; stroke-opacity: 0.3; stroke-width: 1; }
  </style>
  <text class="muted small" x="16" y="18">Zarathustra fails the test (Clark 1990, ch. 8 §4): life as a means, and the arrival the recurrence removes</text>

  <!-- timeline -->
  <line class="arrow" x1="40" y1="120" x2="600" y2="120"/>
  <path class="arrow" d="M592 114 L600 120 L592 126"/>
  <text class="muted tiny" x="40" y="140">past</text>
  <text class="muted tiny" x="300" y="140">now</text>
  <text class="muted tiny" x="570" y="140">future</text>

  <!-- the stone 'it was' -->
  <path class="stone" d="M60 118 L72 88 L112 82 L140 100 L134 118 Z"/>
  <text class="label small" x="64" y="72">the stone "it was"</text>
  <text class="muted tiny" x="64" y="160">"the will cannot will backward"</text>
  <text class="muted tiny" x="64" y="172">→ the spirit of revenge (Z II 20)</text>
  <text class="muted tiny" x="64" y="184">"the murder of the visions of my</text>
  <text class="muted tiny" x="64" y="196">youth" (Z II 11, "The Tomb Song")</text>

  <!-- now: Zarathustra -->
  <circle cx="310" cy="120" r="5" fill="#e2903a"/>
  <text class="amber tiny" x="292" y="106">Zarathustra</text>

  <!-- the overman as arrival -->
  <rect class="box-b" x="500" y="60" width="112" height="44" rx="5"/>
  <text class="blue" x="510" y="78">the overman</text>
  <text class="label tiny" x="510" y="94">the future that redeems</text>
  <path class="arrow-b" d="M316 116 C 400 80, 460 76, 498 80"/>
  <text class="blue tiny" x="360" y="86">"I would not know how to live</text>
  <text class="blue tiny" x="360" y="98">were I not a seer of what must come"</text>

  <!-- recurrence loop removing the arrival -->
  <path class="arrow-d" d="M560 128 C 560 210, 60 210, 60 128"/>
  <text class="muted tiny" x="250" y="226">the recurrence: no arrival, the small human being again — "nausea" (Z III 13)</text>
  <line class="strike" x1="500" y1="58" x2="612" y2="106"/>

  <!-- verdict boxes -->
  <line class="rule" x1="16" y1="244" x2="624" y2="244"/>
  <rect class="box-d" x="20" y="256" width="290" height="60" rx="6"/>
  <text class="label" x="30" y="276" font-weight="600">life valued as a means</text>
  <text class="label small" x="30" y="292">to a state beyond the process; "a bridge and not</text>
  <text class="label small" x="30" y="306">an end" (Z Prologue 4) — the ascetic ideal's shape</text>
  <line class="strike" x1="28" y1="286" x2="302" y2="286"/>
  <rect class="box-a" x="330" y="256" width="290" height="60" rx="6"/>
  <text class="amber" x="340" y="276">life valued as an end</text>
  <text class="label small" x="340" y="292">the activity willed again with no hope of the goal's</text>
  <text class="label small" x="340" y="306">final arrival — the only Yes the demon accepts</text>
</svg>

<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
<style>.label{fill:currentColor}.muted{fill:currentColor;opacity:.55;font-size:12px}.amber{fill:#e2903a}.blue{fill:#4c8dd6}</style>
<defs><marker id="co-am" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e2903a"/></marker><marker id="co-bl" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4c8dd6"/></marker></defs>
<text class="muted" x="140" y="24" text-anchor="middle" font-weight="600">what Cornaro believed</text>
<text class="muted" x="460" y="24" text-anchor="middle" font-weight="600">what Nietzsche says</text>
<line x1="300" y1="14" x2="300" y2="350" stroke="currentColor" stroke-opacity="0.2"/>
<text class="label" x="14" y="56" font-weight="700" font-size="12">section 1</text>
<rect x="20" y="66" width="110" height="40" rx="5" fill="#4c8dd6" fill-opacity="0.12" stroke="#4c8dd6" stroke-width="1.4"/>
<text class="label" x="75" y="91" text-anchor="middle">slender diet</text>
<line x1="132" y1="86" x2="168" y2="86" stroke="#4c8dd6" stroke-width="1.8" marker-end="url(#co-bl)"/>
<rect x="170" y="66" width="110" height="40" rx="5" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.2"/>
<text class="label" x="225" y="91" text-anchor="middle">long life</text>
<rect x="390" y="44" width="140" height="40" rx="5" fill="#e2903a" fill-opacity="0.14" stroke="#e2903a" stroke-width="1.4"/>
<text class="amber" x="460" y="69" text-anchor="middle" font-weight="600">slow metabolism</text>
<line x1="430" y1="86" x2="384" y2="126" stroke="#e2903a" stroke-width="1.8" marker-end="url(#co-am)"/>
<line x1="490" y1="86" x2="536" y2="126" stroke="#e2903a" stroke-width="1.8" marker-end="url(#co-am)"/>
<rect x="318" y="128" width="110" height="40" rx="5" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.2"/>
<text class="label" x="373" y="153" text-anchor="middle">slender diet</text>
<rect x="502" y="128" width="110" height="40" rx="5" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.2"/>
<text class="label" x="557" y="153" text-anchor="middle">long life</text>
<line x1="430" y1="148" x2="498" y2="148" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.4" stroke-dasharray="4 4"/>
<text class="muted" x="465" y="184" text-anchor="middle" font-size="11">no arrow here</text>
<text class="label" x="14" y="226" font-weight="700" font-size="12">section 2</text>
<rect x="20" y="236" width="110" height="40" rx="5" fill="#4c8dd6" fill-opacity="0.12" stroke="#4c8dd6" stroke-width="1.4"/>
<text class="label" x="75" y="261" text-anchor="middle">virtue</text>
<line x1="132" y1="256" x2="168" y2="256" stroke="#4c8dd6" stroke-width="1.8" marker-end="url(#co-bl)"/>
<rect x="170" y="236" width="110" height="40" rx="5" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.2"/>
<text class="label" x="225" y="261" text-anchor="middle">happiness</text>
<text class="muted" x="150" y="300" text-anchor="middle" font-size="11">“do this, then you will be happy”</text>
<rect x="356" y="212" width="208" height="46" rx="5" fill="#e2903a" fill-opacity="0.14" stroke="#e2903a" stroke-width="1.4"/>
<text class="amber" x="460" y="232" text-anchor="middle" font-weight="600" font-size="12.5">a well-turned-out type</text>
<text class="label" x="460" y="249" text-anchor="middle" font-size="11.5">an order among the drives</text>
<line x1="420" y1="260" x2="384" y2="290" stroke="#e2903a" stroke-width="1.8" marker-end="url(#co-am)"/>
<line x1="500" y1="260" x2="536" y2="290" stroke="#e2903a" stroke-width="1.8" marker-end="url(#co-am)"/>
<rect x="312" y="292" width="140" height="46" rx="5" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.2"/>
<text class="label" x="382" y="311" text-anchor="middle" font-size="12">virtue: actions</text>
<text class="label" x="382" y="328" text-anchor="middle" font-size="12">he must perform</text>
<rect x="472" y="292" width="140" height="46" rx="5" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.2"/>
<text class="label" x="542" y="311" text-anchor="middle" font-size="12">happiness,</text>
<text class="label" x="542" y="328" text-anchor="middle" font-size="12">long life</text>
<text class="muted" x="320" y="384" text-anchor="middle">“his virtue is the effect of his happiness” (TI, Four Great Errors 2)</text>
</svg>

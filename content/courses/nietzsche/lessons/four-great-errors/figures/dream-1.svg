<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
<style>.label{fill:currentColor}.muted{fill:currentColor;opacity:.55;font-size:12px}.amber{fill:#e2903a}.blue{fill:#4c8dd6}</style>
<defs><marker id="dr-a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker><marker id="dr-am" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e2903a"/></marker></defs>
<text class="muted" x="20" y="28" font-weight="600">what the dreamer experiences</text>
<rect x="14" y="38" width="612" height="110" rx="8" fill="none" stroke="currentColor" stroke-opacity="0.35" stroke-dasharray="5 4"/>
<text class="muted" x="20" y="196" font-weight="600">what really happens</text>
<line x1="20" y1="268" x2="616" y2="268" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.4" marker-end="url(#dr-a)"/>
<text class="muted" x="610" y="288" text-anchor="end" font-size="11">time</text>
<g transform="translate(110,232)"><path d="M0 -26 L7 -9 L25 -12 L12 1 L22 17 L4 9 L-6 25 L-7 7 L-25 6 L-10 -4 L-20 -19 L-3 -11 Z" fill="#e2903a" fill-opacity="0.25" stroke="#e2903a" stroke-width="1.6"/></g>
<line x1="110" y1="262" x2="110" y2="274" stroke="currentColor" stroke-width="1.4"/>
<text class="amber" x="150" y="222" font-weight="600" font-size="12.5">a distant cannon shot</text>
<text class="label" x="150" y="239" font-size="12">a sensation</text>
<text class="muted" x="320" y="88" text-anchor="middle">nothing yet: the sensation waits, “in a kind of resonance”</text>
<text class="muted" x="320" y="108" text-anchor="middle">until the causal instinct lets it step forward</text>
<text class="muted" x="320" y="312" text-anchor="middle" font-size="11">“The representations which were produced by a certain state have been misunderstood as its causes”</text>
</svg>

<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
<style>.label{fill:currentColor}.muted{fill:currentColor;opacity:.55;font-size:12px}.amber{fill:#e2903a}.blue{fill:#4c8dd6}</style>
<defs><marker id="fw-a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker><marker id="fw-bl" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4c8dd6"/></marker></defs>
<rect x="6" y="56" width="100" height="62" rx="5" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.2"/>
<text class="label" x="56" y="82" text-anchor="middle" font-weight="600" font-size="12">the unknown</text>
<text class="muted" x="56" y="100" text-anchor="middle" font-size="11">a strange state</text>
<line x1="108" y1="87" x2="122" y2="87" stroke="currentColor" stroke-width="1.4" marker-end="url(#fw-a)"/>
<rect x="124" y="56" width="100" height="62" rx="5" fill="#4c8dd6" fill-opacity="0.12" stroke="#4c8dd6" stroke-width="1.4"/>
<text class="blue" x="174" y="82" text-anchor="middle" font-weight="600">fear</text>
<text class="label" x="174" y="100" text-anchor="middle" font-size="11">danger, unease</text>
<line x1="226" y1="87" x2="240" y2="87" stroke="currentColor" stroke-width="1.4" marker-end="url(#fw-a)"/>
<rect x="242" y="56" width="128" height="62" rx="5" fill="#e2903a" fill-opacity="0.14" stroke="#e2903a" stroke-width="1.4"/>
<text class="amber" x="306" y="82" text-anchor="middle" font-weight="600" font-size="12">the first familiar</text>
<text class="amber" x="306" y="99" text-anchor="middle" font-weight="600" font-size="12">explanation</text>
<line x1="372" y1="87" x2="386" y2="87" stroke="currentColor" stroke-width="1.4" marker-end="url(#fw-a)"/>
<rect x="388" y="56" width="120" height="62" rx="5" fill="#e2903a" fill-opacity="0.14" stroke="#e2903a" stroke-width="1.4"/>
<text class="label" x="448" y="76" text-anchor="middle" font-size="11">relief, and a</text>
<text class="label" x="448" y="91" text-anchor="middle" font-size="11">feeling of power:</text>
<text class="amber" x="448" y="108" text-anchor="middle" font-size="11" font-weight="600">“considered true”</text>
<line x1="510" y1="87" x2="522" y2="87" stroke="currentColor" stroke-width="1.4" marker-end="url(#fw-a)"/>
<rect x="524" y="36" width="112" height="124" rx="5" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.2"/>
<text class="label" x="580" y="52" text-anchor="middle" font-size="11" font-weight="600">one cause</text>
<text class="label" x="580" y="66" text-anchor="middle" font-size="11" font-weight="600">hardens into</text>
<text class="label" x="580" y="80" text-anchor="middle" font-size="11" font-weight="600">a system</text>
<text class="muted" x="580" y="100" text-anchor="middle" font-size="11">banker: business</text>
<text class="muted" x="580" y="119" text-anchor="middle" font-size="11">Christian: sin</text>
<text class="muted" x="580" y="138" text-anchor="middle" font-size="11">girl: her love</text>
<path d="M580 162 C 580 212, 306 212, 306 124" fill="none" stroke="#4c8dd6" stroke-width="1.6" marker-end="url(#fw-bl)"/>
<text class="blue" x="443" y="214" text-anchor="middle" font-size="12">next time it comes first</text>
<rect x="176" y="232" width="260" height="34" rx="5" fill="none" stroke="currentColor" stroke-opacity="0.45" stroke-dasharray="5 4"/>
<text class="muted" x="306" y="254" text-anchor="middle">the new, strange cause: excluded</text>
<text class="muted" x="320" y="302" text-anchor="middle">“any explanation is better than none” (TI, Four Great Errors 5)</text>
</svg>

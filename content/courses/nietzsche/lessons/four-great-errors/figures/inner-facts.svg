<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
<style>.label{fill:currentColor}.muted{fill:currentColor;opacity:.55;font-size:12px}.amber{fill:#e2903a}.blue{fill:#4c8dd6}</style>
<defs><marker id="if-bl" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4c8dd6"/></marker></defs>
<text class="amber" x="90" y="26" text-anchor="middle" font-weight="700">three “inner facts”</text>
<text class="muted" x="275" y="26" text-anchor="middle" font-weight="600">what the module found</text>
<text class="blue" x="545" y="26" text-anchor="middle" font-weight="700">projected outward</text>
<rect x="14" y="44" width="152" height="56" rx="5" fill="#e2903a" fill-opacity="0.12" stroke="#e2903a" stroke-width="1.4"/>
<text class="label" x="90" y="70" text-anchor="middle" font-weight="600">the will</text>
<text class="label" x="90" y="88" text-anchor="middle" font-size="12">as cause of the act</text>
<text class="muted" x="184" y="62" font-size="11.5">BGE 19: sensations, a commanding</text>
<text class="muted" x="184" y="78" font-size="11.5">thought, the affect of command;</text>
<text class="muted" x="184" y="94" font-size="11.5">the obeying drives do the work</text>
<rect x="14" y="120" width="152" height="56" rx="5" fill="#e2903a" fill-opacity="0.12" stroke="#e2903a" stroke-width="1.4"/>
<text class="label" x="90" y="146" text-anchor="middle" font-weight="600">the motive</text>
<text class="label" x="90" y="164" text-anchor="middle" font-size="12">found in consciousness</text>
<text class="muted" x="184" y="138" font-size="11.5">D 129, GS 354: a surface;</text>
<text class="muted" x="184" y="154" font-size="11.5">the contest that decides</text>
<text class="muted" x="184" y="170" font-size="11.5">is invisible</text>
<rect x="14" y="196" width="152" height="56" rx="5" fill="#e2903a" fill-opacity="0.12" stroke="#e2903a" stroke-width="1.4"/>
<text class="label" x="90" y="222" text-anchor="middle" font-weight="600">the ego</text>
<text class="label" x="90" y="240" text-anchor="middle" font-size="12">that thinks the thought</text>
<text class="muted" x="184" y="214" font-size="11.5">BGE 19, GM I 13: a title</text>
<text class="muted" x="184" y="230" font-size="11.5">for the governing drive;</text>
<text class="muted" x="184" y="246" font-size="11.5">a fiction added to the deed</text>
<path d="M376 148 L 432 148" stroke="#4c8dd6" stroke-width="6" marker-end="url(#if-bl)"/>
<rect x="452" y="44" width="176" height="34" rx="5" fill="#4c8dd6" fill-opacity="0.1" stroke="#4c8dd6" stroke-width="1.2"/>
<text class="label" x="540" y="66" text-anchor="middle" font-size="12">every event a doing</text>
<rect x="452" y="86" width="176" height="34" rx="5" fill="#4c8dd6" fill-opacity="0.1" stroke="#4c8dd6" stroke-width="1.2"/>
<text class="label" x="540" y="108" text-anchor="middle" font-size="12">“things” as beings</text>
<rect x="452" y="128" width="176" height="34" rx="5" fill="#4c8dd6" fill-opacity="0.1" stroke="#4c8dd6" stroke-width="1.2"/>
<text class="label" x="540" y="150" text-anchor="middle" font-size="12">the atom</text>
<rect x="452" y="170" width="176" height="34" rx="5" fill="#4c8dd6" fill-opacity="0.1" stroke="#4c8dd6" stroke-width="1.2"/>
<text class="label" x="540" y="192" text-anchor="middle" font-size="12">the thing-in-itself</text>
<rect x="452" y="212" width="176" height="52" rx="5" fill="#4c8dd6" fill-opacity="0.2" stroke="#4c8dd6" stroke-width="1.6"/>
<text class="blue" x="540" y="234" text-anchor="middle" font-weight="700">God</text>
<text class="label" x="540" y="252" text-anchor="middle" font-size="11.5">the spirit as cause</text>
<text class="muted" x="320" y="306" text-anchor="middle">“he always found in things only that which he had put into them”</text>
<text class="muted" x="320" y="326" text-anchor="middle">(TI, Four Great Errors 3)</text>
</svg>

<svg viewBox="0 0 640 350" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
<style>.label{fill:currentColor}.muted{fill:currentColor;opacity:.55;font-size:12px}.amber{fill:#e2903a}.blue{fill:#4c8dd6}</style>
<defs><marker id="wh-bl" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4c8dd6"/></marker><marker id="wh-am" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e2903a"/></marker></defs>
<text class="muted" x="104" y="24" text-anchor="middle" font-weight="600" font-size="11.5">who gives man his qualities?</text>
<g font-size="12">
<rect x="20" y="38" width="160" height="32" rx="4" fill="none" stroke="currentColor" stroke-opacity="0.4"/><text class="label" x="100" y="59" text-anchor="middle" opacity="0.6">God</text><line x1="40" y1="54" x2="160" y2="54" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.4"/>
<rect x="20" y="78" width="160" height="32" rx="4" fill="none" stroke="currentColor" stroke-opacity="0.4"/><text class="label" x="100" y="99" text-anchor="middle" opacity="0.6">society</text><line x1="40" y1="94" x2="160" y2="94" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.4"/>
<rect x="20" y="118" width="160" height="32" rx="4" fill="none" stroke="currentColor" stroke-opacity="0.4"/><text class="label" x="100" y="139" text-anchor="middle" opacity="0.6">parents and ancestors</text><line x1="30" y1="134" x2="170" y2="134" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.4"/>
<rect x="20" y="158" width="160" height="32" rx="4" fill="none" stroke="currentColor" stroke-opacity="0.4"/><text class="label" x="100" y="179" text-anchor="middle" opacity="0.6">he himself (causa sui)</text><line x1="30" y1="174" x2="170" y2="174" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.4"/>
</g>
<text class="muted" x="100" y="212" text-anchor="middle" font-size="11">causes, yes;</text>
<text class="muted" x="100" y="227" text-anchor="middle" font-size="11">responsible givers, no</text>
<circle cx="350" cy="122" r="96" fill="#e2903a" fill-opacity="0.1" stroke="#e2903a" stroke-width="1.6"/>
<text class="amber" x="350" y="74" text-anchor="middle" font-weight="700">the whole</text>
<text class="label" x="350" y="92" text-anchor="middle" font-size="11.5">all that has been</text>
<text class="label" x="350" y="107" text-anchor="middle" font-size="11.5">and will be</text>
<circle cx="350" cy="140" r="7" fill="#e2903a"/>
<line x1="350" y1="147" x2="350" y2="166" stroke="#e2903a" stroke-width="2"/>
<text class="label" x="350" y="186" text-anchor="middle" font-size="11.5">one is in the whole</text>
<rect x="490" y="80" width="136" height="76" rx="6" fill="none" stroke="currentColor" stroke-opacity="0.45" stroke-dasharray="5 4"/>
<text class="muted" x="558" y="104" text-anchor="middle" font-size="11.5">a judge outside</text>
<text class="muted" x="558" y="120" text-anchor="middle" font-size="11.5">the whole</text>
<text class="label" x="558" y="142" text-anchor="middle" font-size="12" font-weight="600">nothing here</text>
<line x1="350" y1="220" x2="350" y2="248" stroke="#4c8dd6" stroke-width="1.8" marker-end="url(#wh-bl)"/>
<rect x="262" y="250" width="176" height="40" rx="5" fill="#4c8dd6" fill-opacity="0.12" stroke="#4c8dd6" stroke-width="1.4"/>
<text class="blue" x="350" y="275" text-anchor="middle" font-weight="600" font-size="12.5">innocence of becoming</text>
<line x1="440" y1="270" x2="494" y2="270" stroke="#e2903a" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#wh-am)"/>
<rect x="496" y="250" width="130" height="40" rx="5" fill="none" stroke="#e2903a" stroke-dasharray="5 4" stroke-width="1.2"/>
<text class="amber" x="561" y="268" text-anchor="middle" font-size="12" font-weight="600">amor fati</text>
<text class="muted" x="561" y="283" text-anchor="middle" font-size="10.5">not yet argued</text>
<text class="muted" x="320" y="334" text-anchor="middle">“there is nothing besides the whole” (TI, Four Great Errors 8)</text>
</svg>

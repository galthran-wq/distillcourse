<svg viewBox="0 0 640 230" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tag { font-weight: 600; }
    .aph { fill: none; stroke: #e2903a; stroke-width: 2; }
    .comm { fill: none; stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.4; }
    .stepbox { fill: none; stroke: #4c8dd6; stroke-width: 1.4; }
    .arrow { stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.4; fill: none; }
  </style>

  <text class="muted tag" x="320" y="20" text-anchor="middle">Preface §8's model: the Third Treatise</text>

  <!-- the aphorism -->
  <rect class="aph" x="16" y="34" width="120" height="56" rx="6"/>
  <text class="tag" x="76" y="56" text-anchor="middle" fill="#e2903a">III:1</text>
  <text class="label small" x="76" y="72" text-anchor="middle">the aphorism</text>
  <text class="muted small" x="76" y="84" text-anchor="middle">read, not deciphered</text>

  <path class="arrow" d="M 136 62 L 168 62"/>
  <path class="arrow" d="M 161 56 L 168 62 L 161 68"/>

  <!-- the commentary -->
  <rect class="comm" x="172" y="34" width="452" height="56" rx="6"/>
  <text class="label" x="398" y="56" text-anchor="middle">III:2–28: "the treatise itself is its commentary"</text>
  <text class="muted small" x="398" y="72" text-anchor="middle">the interpretation (Auslegung) begins where the reading ends</text>
  <text class="muted small" x="398" y="84" text-anchor="middle">twenty-seven sections returning to the sentence they started from</text>

  <!-- rumination -> the five steps -->
  <text class="muted tag" x="320" y="120" text-anchor="middle">das Wiederkäuen, rumination, written down as the protocol's five steps</text>

  <rect class="stepbox" x="16" y="132" width="112" height="52" rx="5"/>
  <text class="label small" x="72" y="152" text-anchor="middle">1 locate</text>
  <text class="muted small" x="72" y="166" text-anchor="middle">the claim</text>

  <rect class="stepbox" x="144" y="132" width="112" height="52" rx="5"/>
  <text class="label small" x="200" y="152" text-anchor="middle">2 tie premises</text>
  <text class="muted small" x="200" y="166" text-anchor="middle">to sentences</text>

  <rect class="stepbox" x="272" y="132" width="112" height="52" rx="5"/>
  <text class="label small" x="328" y="152" text-anchor="middle">3 name what</text>
  <text class="muted small" x="328" y="166" text-anchor="middle">is missing</text>

  <rect class="stepbox" x="400" y="132" width="112" height="52" rx="5"/>
  <text class="label small" x="456" y="152" text-anchor="middle">4 find the</text>
  <text class="muted small" x="456" y="166" text-anchor="middle">second passage</text>

  <rect class="stepbox" x="528" y="132" width="96" height="52" rx="5"/>
  <text class="label small" x="576" y="152" text-anchor="middle">5 state the</text>
  <text class="muted small" x="576" y="166" text-anchor="middle">opposite reading</text>

  <text class="muted small" x="320" y="212" text-anchor="middle">"for which one must be almost a cow and in any case not a 'modern man'"</text>
</svg>

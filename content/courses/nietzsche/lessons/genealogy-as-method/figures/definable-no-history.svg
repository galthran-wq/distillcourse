<svg viewBox="0 0 640 230" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tag { font-weight: 600; }
    .plain { fill: none; stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.4; }
    .hist { fill: none; stroke: #e2903a; stroke-width: 2; }
    .m { fill: #4c8dd6; }
    .mline { stroke: #4c8dd6; stroke-width: 1.2; stroke-opacity: 0.8; }
    .core { fill: none; stroke: #4c8dd6; stroke-width: 1.4; }
  </style>

  <!-- no history -->
  <rect class="plain" x="16" y="16" width="280" height="176" rx="6"/>
  <text class="muted tag" x="28" y="36">a concept with no history</text>
  <circle class="m" cx="156" cy="80" r="4"/>
  <text class="label small" x="156" y="66" text-anchor="middle">one meaning</text>
  <line class="mline" x1="156" y1="84" x2="156" y2="108"/>
  <rect class="core" x="106" y="108" width="100" height="26" rx="4"/>
  <text class="label small" x="156" y="125" text-anchor="middle">the concept</text>
  <text class="label" x="156" y="160" text-anchor="middle">definable</text>
  <text class="muted small" x="156" y="176" text-anchor="middle">state the one meaning and the definition is done</text>

  <!-- with a history -->
  <rect class="hist" x="328" y="16" width="296" height="176" rx="6"/>
  <text class="tag" x="340" y="36" fill="#e2903a">"punishment" in present-day Europe</text>
  <text class="muted small" x="476" y="48" text-anchor="middle">eleven meanings, imposed at different times</text>
  <circle class="m" cx="400" cy="64" r="3.5"/>
  <circle class="m" cx="436" cy="60" r="3.5"/>
  <circle class="m" cx="476" cy="58" r="3.5"/>
  <circle class="m" cx="516" cy="60" r="3.5"/>
  <circle class="m" cx="552" cy="64" r="3.5"/>
  <circle class="m" cx="384" cy="84" r="3.5"/>
  <circle class="m" cx="568" cy="84" r="3.5"/>
  <line class="mline" x1="400" y1="68" x2="456" y2="108"/>
  <line class="mline" x1="436" y1="64" x2="466" y2="108"/>
  <line class="mline" x1="476" y1="62" x2="476" y2="108"/>
  <line class="mline" x1="516" y1="64" x2="486" y2="108"/>
  <line class="mline" x1="552" y1="68" x2="496" y2="108"/>
  <line class="mline" x1="384" y1="88" x2="452" y2="110"/>
  <line class="mline" x1="568" y1="88" x2="500" y2="110"/>
  <rect class="core" x="426" y="108" width="100" height="26" rx="4"/>
  <text class="label small" x="476" y="125" text-anchor="middle">a "synthesis"</text>
  <text class="label" x="476" y="160" text-anchor="middle">undefinable</text>
  <text class="muted small" x="476" y="176" text-anchor="middle">"impossible to say definitely why one punishes"</text>

  <text class="tag small" x="320" y="214" text-anchor="middle" fill="#e2903a">definirbar ist nur Das, was keine Geschichte hat (II:13); "good", "guilt", "the ascetic ideal" each have one</text>
</svg>

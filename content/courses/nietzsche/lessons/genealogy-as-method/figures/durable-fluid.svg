<svg viewBox="0 0 640 220" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tag { font-weight: 600; }
    .fluid { fill: none; stroke: #4c8dd6; stroke-width: 1.4; stroke-dasharray: 4 3; }
    .now { fill: none; stroke: #4c8dd6; stroke-width: 1.8; }
    .durable { fill: none; stroke: #e2903a; stroke-width: 2; }
    .axis { stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.2; fill: none; }
    .drop { stroke: currentColor; stroke-opacity: 0.45; stroke-width: 1.2; fill: none; }
  </style>

  <!-- time axis -->
  <path class="axis" d="M 24 30 L 616 30"/>
  <path class="axis" d="M 609 25 L 616 30 L 609 35"/>
  <text class="muted small" x="24" y="22">earlier</text>
  <text class="muted small" x="616" y="22" text-anchor="end">present-day Europe</text>

  <!-- fluid element: successive meanings -->
  <text class="muted tag" x="24" y="52">the fluid element (das Flüssige): the meaning, the purpose, the expectation</text>
  <rect class="fluid" x="24" y="60" width="150" height="46" rx="5"/>
  <text class="label small" x="99" y="80" text-anchor="middle">"customary in another</text>
  <text class="label small" x="99" y="94" text-anchor="middle">sense": not yet punishment</text>

  <rect class="fluid" x="192" y="60" width="130" height="46" rx="5"/>
  <text class="label small" x="257" y="80" text-anchor="middle">a meaning put</text>
  <text class="label small" x="257" y="94" text-anchor="middle">into the procedure</text>

  <rect class="fluid" x="340" y="60" width="130" height="46" rx="5"/>
  <text class="label small" x="405" y="80" text-anchor="middle">another meaning,</text>
  <text class="label small" x="405" y="94" text-anchor="middle">"interpreted into" it</text>

  <rect class="now" x="488" y="60" width="128" height="46" rx="5"/>
  <text class="tag small" x="552" y="80" text-anchor="middle" fill="#4c8dd6">"punishment"</text>
  <text class="label small" x="552" y="94" text-anchor="middle">a synthesis of meanings</text>

  <!-- drops onto the procedure -->
  <path class="drop" d="M 99 106 L 99 134"/>
  <path class="drop" d="M 257 106 L 257 134"/>
  <path class="drop" d="M 405 106 L 405 134"/>
  <path class="drop" d="M 552 106 L 552 134"/>

  <!-- durable element -->
  <rect class="durable" x="24" y="136" width="592" height="52" rx="6"/>
  <text class="tag" x="36" y="156" fill="#e2903a">the durable element: the custom, the act, the "drama", a strict sequence of procedures</text>
  <text class="label small" x="36" y="174">the same procedure under every meaning — "something older, earlier than its use for punishment"</text>

  <text class="muted small" x="320" y="210" text-anchor="middle">GM II:13: the meaning is what changes; the procedure is what the meanings are put into</text>
</svg>

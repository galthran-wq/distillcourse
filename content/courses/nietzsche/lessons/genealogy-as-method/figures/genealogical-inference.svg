<svg viewBox="0 0 640 290" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tag { font-weight: 600; }
    .bad { fill: none; stroke: currentColor; stroke-opacity: 0.45; stroke-width: 1.4; stroke-dasharray: 4 3; }
    .good { fill: none; stroke: #e2903a; stroke-width: 2; }
    .strike { stroke: currentColor; stroke-opacity: 0.55; stroke-width: 1.8; }
    .rule { stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1; }
  </style>

  <!-- invalid form -->
  <rect class="bad" x="16" y="18" width="296" height="176" rx="6"/>
  <text class="muted tag" x="28" y="38">the genetic fallacy — invalid</text>
  <text class="label" x="28" y="66">P.  Morality began in ressentiment:</text>
  <text class="label" x="48" y="82">an ignoble origin (pudenda origo).</text>
  <line class="rule" x1="28" y1="96" x2="300" y2="96"/>
  <text class="label" x="28" y="116">C.  Therefore its precepts are false.</text>
  <line class="strike" x1="24" y1="112" x2="304" y2="112"/>
  <text class="muted small" x="28" y="146">conceded invalid by the author: "a morality could even</text>
  <text class="muted small" x="28" y="160">have grown out of an error: with this insight the</text>
  <text class="muted small" x="28" y="174">problem of its value would not even be touched" (GS 345)</text>

  <!-- valid form -->
  <rect class="good" x="328" y="18" width="296" height="176" rx="6"/>
  <text class="tag" x="340" y="38" fill="#e2903a">the licensed argument — valid</text>
  <text class="label small" x="340" y="60">P1.  Morality claims authority as universal and</text>
  <text class="label small" x="360" y="74">non-contingent: presented as "given" (BGE 186).</text>
  <text class="label small" x="340" y="94">P2.  Its real history shows it contingent, type-specific,</text>
  <text class="label small" x="360" y="108">born of a particular need (the treatises).</text>
  <line class="rule" x1="340" y1="120" x2="612" y2="120"/>
  <text class="label" x="340" y="140">C.  Its claim to that authority is unfounded.</text>
  <text class="muted small" x="340" y="164">C is not "its precepts are false": what changes is the</text>
  <text class="muted small" x="340" y="178">value's standing, from given to made, not its truth</text>

  <!-- what the second form needs -->
  <text class="muted small" x="320" y="222" text-anchor="middle">P2 is what the three treatises exist to establish; P1 is what the target (MPS) asserts of itself.</text>
  <text class="muted small" x="320" y="238" text-anchor="middle">Remove P1 and the history proves nothing about standing; remove P2 and the critique has no evidence.</text>
  <text class="tag small" x="320" y="266" text-anchor="middle" fill="#e2903a">a genealogy can move a value from "given" to "made"; it cannot move a precept from true to false</text>
</svg>

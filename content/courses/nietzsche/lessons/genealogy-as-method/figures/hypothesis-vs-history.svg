<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tag { font-weight: 600; }
    .blue { fill: none; stroke: #4c8dd6; stroke-width: 1.8; }
    .amber { fill: none; stroke: #e2903a; stroke-width: 1.8; }
    .step { fill: none; stroke: #4c8dd6; stroke-width: 1.2; }
    .ev { fill: none; stroke: #e2903a; stroke-width: 1.2; }
    .arrow { stroke: #4c8dd6; stroke-width: 1.2; fill: none; }
    .guide { stroke: currentColor; stroke-opacity: 0.35; stroke-width: 1; stroke-dasharray: 3 3; }
  </style>

  <!-- left column: hypothesis-history -->
  <rect class="blue" x="14" y="14" width="296" height="300" rx="6"/>
  <text class="tag" x="28" y="36" fill="#4c8dd6">hypothesis-history (Rée, "the English")</text>
  <text class="muted small" x="28" y="52">Preface §4 · the "decree" GM I:2 quotes</text>

  <rect class="step" x="40" y="66" width="244" height="30" rx="4"/>
  <text class="label" x="162" y="85" text-anchor="middle">unegoistic acts benefit their recipients</text>
  <path class="arrow" d="M 162 96 L 162 108"/><path class="arrow" d="M 157 103 L 162 108 L 167 103"/>
  <rect class="step" x="40" y="110" width="244" height="30" rx="4"/>
  <text class="label" x="162" y="129" text-anchor="middle">the recipients praise them as "good"</text>
  <path class="arrow" d="M 162 140 L 162 152"/><path class="arrow" d="M 157 147 L 162 152 L 167 147"/>
  <rect class="step" x="40" y="154" width="244" height="30" rx="4"/>
  <text class="label" x="162" y="173" text-anchor="middle">the usefulness is forgotten; habit remains</text>
  <path class="arrow" d="M 162 184 L 162 196"/><path class="arrow" d="M 157 191 L 162 196 L 167 191"/>
  <rect class="step" x="40" y="198" width="244" height="30" rx="4"/>
  <text class="label" x="162" y="217" text-anchor="middle">"good" is felt as intrinsic — an error</text>

  <line class="guide" x1="28" y1="244" x2="296" y2="244"/>
  <text class="muted small" x="28" y="262">evidence: none — a plausible mechanism,</text>
  <text class="muted small" x="28" y="278">"hypothesis-mongering into the blue" (§7)</text>
  <text class="muted small" x="28" y="300">the value of "good" is taken as given (§6)</text>

  <!-- right column: real history -->
  <rect class="amber" x="330" y="14" width="296" height="300" rx="6"/>
  <text class="tag" x="344" y="36" fill="#e2903a">real history (the Preface's demand)</text>
  <text class="muted small" x="344" y="52">§7: grey, "das Urkundliche" — the documentary</text>

  <text class="label" x="344" y="78">what counts as a document:</text>
  <rect class="ev" x="356" y="90" width="256" height="26" rx="4"/>
  <text class="label small" x="366" y="107">etymology — what "good" first named (I:4–5)</text>
  <rect class="ev" x="356" y="122" width="256" height="26" rx="4"/>
  <text class="label small" x="366" y="139">law codes, contracts, debt (II:4–8)</text>
  <rect class="ev" x="356" y="154" width="256" height="26" rx="4"/>
  <text class="label small" x="366" y="171">cult practice, sacrifice, the ancestor (II:19–22)</text>
  <rect class="ev" x="356" y="186" width="256" height="26" rx="4"/>
  <text class="label small" x="366" y="203">the types who needed the value (III:1, 11–15)</text>

  <line class="guide" x1="344" y1="244" x2="612" y2="244"/>
  <text class="muted small" x="344" y="262">a "hieroglyphic script" of the moral past,</text>
  <text class="muted small" x="344" y="278">"hard to decipher" — the treatises decipher it</text>
  <text class="muted small" x="344" y="300">the value of "good" is the question (§§3, 6)</text>
</svg>

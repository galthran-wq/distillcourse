<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tag { font-weight: 600; }
    .target { fill: none; stroke: #4c8dd6; stroke-width: 2; }
    .part { fill: none; stroke: #4c8dd6; stroke-width: 1.2; }
    .outside { fill: none; stroke: #e2903a; stroke-width: 1.8; }
    .line { stroke: #e2903a; stroke-width: 2; stroke-dasharray: 6 4; }
  </style>

  <!-- the target -->
  <rect class="target" x="16" y="18" width="404" height="256" rx="8"/>
  <text class="tag" x="30" y="40" fill="#4c8dd6">MPS — "morality in the pejorative sense" (Leiter)</text>
  <text class="muted small" x="30" y="56">a morality is the target if it has these two components</text>

  <rect class="part" x="30" y="68" width="376" height="90" rx="5"/>
  <text class="tag small" x="42" y="86">descriptive component — presupposed, attacked as false</text>
  <text class="label small" x="42" y="106">free will — so that agents can be held responsible</text>
  <text class="label small" x="42" y="122">transparency of the self — so that motives can be judged</text>
  <text class="label small" x="42" y="138">essential similarity of persons — so that one code fits all</text>
  <text class="muted small" x="42" y="153">(GM I:13; BGE 21, 32; BGE 43, 221)</text>

  <rect class="part" x="30" y="170" width="376" height="92" rx="5"/>
  <text class="tag small" x="42" y="188">normative component — attacked as harmful to the higher type</text>
  <text class="label small" x="42" y="208">altruism, pity (Mitleid), self-sacrifice — Preface §5</text>
  <text class="label small" x="42" y="224">equality, "English" comfort and happiness — BGE 202, 228</text>
  <text class="label small" x="42" y="240">the extirpation of aggressive and licentious instincts</text>
  <text class="muted small" x="42" y="256">(the "danger of dangers", Preface §6)</text>

  <!-- the boundary -->
  <line class="line" x1="440" y1="18" x2="440" y2="274"/>
  <text class="tag small" x="452" y="34" fill="#e2903a">Robertson's line</text>
  <text class="muted small" x="452" y="50">inside: whatever claims</text>
  <text class="muted small" x="452" y="64">(Ic) categorical authority and</text>
  <text class="muted small" x="452" y="78">(Id) universal jurisdiction,</text>
  <text class="muted small" x="452" y="92">with (II) this content</text>

  <!-- outside the target -->
  <rect class="outside" x="452" y="112" width="176" height="150" rx="6"/>
  <text class="tag small" x="464" y="130" fill="#e2903a">outside the target</text>
  <text class="label small" x="464" y="150">Nietzsche's own values:</text>
  <text class="label small" x="464" y="166">honesty (Redlichkeit)</text>
  <text class="label small" x="464" y="182">the higher type, its pathos</text>
  <text class="label small" x="464" y="198">of distance (BGE 257)</text>
  <text class="label small" x="464" y="214">"higher moralities" that</text>
  <text class="label small" x="464" y="230">"are, and ought to be,</text>
  <text class="label small" x="464" y="246">possible" (BGE 202)</text>

  <text class="muted small" x="320" y="300" text-anchor="middle">the scope problem: the boundary must leave the right-hand box immune to every objection aimed at the left —</text>
  <text class="muted small" x="320" y="316" text-anchor="middle">values that claim no categorical, universal authority are not caught by an argument against that claim</text>
</svg>

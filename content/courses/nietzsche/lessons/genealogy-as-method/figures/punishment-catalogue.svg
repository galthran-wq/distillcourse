<svg viewBox="0 0 640 440" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tag { font-weight: 600; }
    .core { fill: none; stroke: #e2903a; stroke-width: 2; }
    .spoke { stroke: #4c8dd6; stroke-width: 1.2; stroke-opacity: 0.8; }
    .dot { fill: #4c8dd6; }
  </style>

  <!-- spokes -->
  <line class="spoke" x1="320" y1="188" x2="320" y2="70"/>
  <line class="spoke" x1="343" y1="192" x2="401" y2="92"/>
  <line class="spoke" x1="356" y1="205" x2="456" y2="155"/>
  <line class="spoke" x1="360" y1="218" x2="468" y2="238"/>
  <line class="spoke" x1="352" y1="234" x2="433" y2="313"/>
  <line class="spoke" x1="336" y1="244" x2="362" y2="356"/>
  <line class="spoke" x1="304" y1="244" x2="278" y2="356"/>
  <line class="spoke" x1="288" y1="234" x2="207" y2="313"/>
  <line class="spoke" x1="280" y1="218" x2="172" y2="238"/>
  <line class="spoke" x1="284" y1="205" x2="184" y2="155"/>
  <line class="spoke" x1="297" y1="192" x2="239" y2="92"/>

  <!-- centre: the durable element -->
  <rect class="core" x="244" y="186" width="152" height="58" rx="8"/>
  <text class="tag" x="320" y="207" text-anchor="middle" fill="#e2903a">punishment (Strafe)</text>
  <text class="muted small" x="320" y="223" text-anchor="middle">the durable element:</text>
  <text class="muted small" x="320" y="236" text-anchor="middle">one procedure, a fixed "drama"</text>

  <!-- meanings (the fluid element), clockwise from the top -->
  <circle class="dot" cx="320" cy="70" r="3.5"/>
  <text class="label small" x="320" y="58" text-anchor="middle">rendering harmless — no further injury</text>

  <circle class="dot" cx="401" cy="92" r="3.5"/>
  <text class="label small" x="409" y="88">compensation to the injured</text>
  <text class="muted small" x="409" y="101">(the creditor–debtor form, II:4–6)</text>

  <circle class="dot" cx="456" cy="155" r="3.5"/>
  <text class="label small" x="464" y="151">isolating a disturbance</text>
  <text class="muted small" x="464" y="164">so it does not spread</text>

  <circle class="dot" cx="468" cy="238" r="3.5"/>
  <text class="label small" x="476" y="234">instilling fear of those</text>
  <text class="muted small" x="476" y="247">who decree and execute it</text>

  <circle class="dot" cx="433" cy="313" r="3.5"/>
  <text class="label small" x="441" y="311">repaying advantages enjoyed</text>
  <text class="muted small" x="441" y="324">(the criminal as mine slave)</text>

  <circle class="dot" cx="362" cy="356" r="3.5"/>
  <text class="label small" x="366" y="374">excising a degenerate element</text>
  <text class="muted small" x="366" y="387">(a whole branch, "Chinese law")</text>

  <circle class="dot" cx="278" cy="356" r="3.5"/>
  <text class="label small" x="274" y="374" text-anchor="end">festival: the defeated enemy</text>
  <text class="muted small" x="274" y="387" text-anchor="end">violated and mocked</text>

  <circle class="dot" cx="207" cy="313" r="3.5"/>
  <text class="label small" x="199" y="311" text-anchor="end">mnemonic — "correction",</text>
  <text class="muted small" x="199" y="324" text-anchor="end">for the sufferer or the witnesses</text>

  <circle class="dot" cx="172" cy="238" r="3.5"/>
  <text class="label small" x="164" y="234" text-anchor="end">a fee to the power that</text>
  <text class="muted small" x="164" y="247" text-anchor="end">shields the culprit from revenge</text>

  <circle class="dot" cx="184" cy="155" r="3.5"/>
  <text class="label small" x="176" y="151" text-anchor="end">compromise with revenge</text>
  <text class="muted small" x="176" y="164" text-anchor="end">where strong clans still claim it</text>

  <circle class="dot" cx="239" cy="92" r="3.5"/>
  <text class="label small" x="231" y="88" text-anchor="end">declaration of war on an</text>
  <text class="muted small" x="231" y="101" text-anchor="end">enemy of peace, law, order</text>

  <!-- the verdict -->
  <text class="muted small" x="320" y="418" text-anchor="middle">eleven "meanings" (Sinne) in GM II:13, each imposed on the same procedure by a different will and era;</text>
  <text class="tag small" x="320" y="432" text-anchor="middle" fill="#e2903a">none of them is the origin — the procedure is older than every use it has been put to</text>
</svg>

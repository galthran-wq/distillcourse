<svg viewBox="0 0 640 270" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10px; }
    .tag { font-weight: 600; }
    .prev { fill: none; stroke: #4c8dd6; stroke-width: 1.4; }
    .last { fill: none; stroke: #e2903a; stroke-width: 2; }
    .arrow { stroke: currentColor; stroke-opacity: 0.55; stroke-width: 1.3; fill: none; }
  </style>

  <!-- Foot -->
  <rect class="prev" x="8" y="30" width="150" height="174" rx="6"/>
  <text class="tag" x="83" y="50" text-anchor="middle" fill="#4c8dd6">Foot (1973, 1994)</text>
  <text class="label small" x="16" y="72">critic of all morality;</text>
  <text class="label small" x="16" y="86">"morality" = justice</text>
  <text class="label small" x="16" y="100">presupposing equality</text>
  <text class="muted small" x="16" y="128">ideal: aestheticist,</text>
  <text class="muted small" x="16" y="142">unconstrained by justice</text>
  <text class="muted small" x="16" y="170">too narrow a target</text>

  <path class="arrow" d="M 158 112 L 166 112"/>

  <!-- Clark -->
  <rect class="prev" x="166" y="30" width="150" height="174" rx="6"/>
  <text class="tag" x="241" y="50" text-anchor="middle" fill="#4c8dd6">Clark (1994, 2001)</text>
  <text class="label small" x="174" y="72">keeps: all morality;</text>
  <text class="label small" x="174" y="86">revises: "morality" is the</text>
  <text class="label small" x="174" y="100">narrow, blame-based</text>
  <text class="label small" x="174" y="114">scheme (Williams's</text>
  <text class="label small" x="174" y="128">moral vs ethical)</text>
  <text class="muted small" x="174" y="150">ideal: ethical, not egoist</text>
  <text class="muted small" x="174" y="170">the ideal too individual</text>

  <path class="arrow" d="M 316 112 L 324 112"/>

  <!-- Leiter -->
  <rect class="prev" x="324" y="30" width="150" height="174" rx="6"/>
  <text class="tag" x="399" y="50" text-anchor="middle" fill="#4c8dd6">Leiter (1995, 2002)</text>
  <text class="label small" x="332" y="72">keeps: a target by its</text>
  <text class="label small" x="332" y="86">features; revises: not all</text>
  <text class="label small" x="332" y="100">morality, only MPS —</text>
  <text class="label small" x="332" y="114">descriptive (free will,</text>
  <text class="label small" x="332" y="128">transparency, similarity)</text>
  <text class="label small" x="332" y="142">plus normative content</text>
  <text class="muted small" x="332" y="170">the harm left unexplained</text>

  <path class="arrow" d="M 474 112 L 482 112"/>

  <!-- Robertson -->
  <rect class="last" x="482" y="30" width="150" height="174" rx="6"/>
  <text class="tag" x="557" y="50" text-anchor="middle" fill="#e2903a">Robertson (2012)</text>
  <text class="label small" x="490" y="72">keeps: MPS, content (II);</text>
  <text class="label small" x="490" y="86">revises: the necessary</text>
  <text class="label small" x="490" y="100">marks are (Ic) categorical</text>
  <text class="label small" x="490" y="114">authority and (Id)</text>
  <text class="label small" x="490" y="128">universal jurisdiction</text>
  <text class="muted small" x="490" y="150">ideal: a quasi-aesthetic</text>
  <text class="muted small" x="490" y="164">individualist perfectionism</text>
  <text class="muted small" x="490" y="184">explains the harm;</text>
  <text class="muted small" x="490" y="198">owes a metaethic</text>

  <text class="muted small" x="320" y="232" text-anchor="middle">each account inherits its predecessor's target and revises one condition; the last is the one the course adopts</text>
  <text class="muted small" x="320" y="248" text-anchor="middle">for the boundary of MPS, and it is the account that owes an answer to the authority puzzle (Module 6)</text>
</svg>

<svg viewBox="0 0 640 240" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tag { font-weight: 600; }
    .proc { fill: none; stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.8; }
    .now { fill: none; stroke: #e2903a; stroke-width: 2; }
    .past { fill: none; stroke: #4c8dd6; stroke-width: 1.4; opacity: 0.5; }
    .empty { fill: none; stroke: currentColor; stroke-opacity: 0.3; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .down { stroke: #e2903a; stroke-width: 1.4; fill: none; }
    .downpast { stroke: #4c8dd6; stroke-width: 1.2; fill: none; opacity: 0.5; }
    .chain { stroke: currentColor; stroke-opacity: 0.4; stroke-width: 1.2; fill: none; }
  </style>

  <text class="muted small" x="20" y="16">frame 1 of 4 · a will masters the procedure and imposes a meaning</text>

  <!-- slot 1: now -->
  <rect class="now" x="20" y="28" width="136" height="26" rx="4"/>
  <text class="tag small" x="88" y="45" text-anchor="middle" fill="#e2903a">the injured creditor</text>
  <path class="down" d="M 88 54 L 88 74"/><path class="down" d="M 83 68 L 88 74 L 93 68"/>
  <rect class="now" x="20" y="76" width="136" height="60" rx="4"/>
  <text class="label small" x="88" y="96" text-anchor="middle">compensation:</text>
  <text class="label small" x="88" y="110" text-anchor="middle">pain repays a debt</text>
  <text class="muted small" x="88" y="126" text-anchor="middle">II:4–6</text>

  <!-- slots 2–4: empty -->
  <rect class="empty" x="172" y="28" width="136" height="26" rx="4"/>
  <rect class="empty" x="172" y="76" width="136" height="60" rx="4"/>
  <rect class="empty" x="324" y="28" width="136" height="26" rx="4"/>
  <rect class="empty" x="324" y="76" width="136" height="60" rx="4"/>
  <rect class="empty" x="476" y="28" width="136" height="26" rx="4"/>
  <rect class="empty" x="476" y="76" width="136" height="60" rx="4"/>

  <!-- the procedure -->
  <rect class="proc" x="20" y="164" width="592" height="46" rx="6"/>
  <text class="tag" x="316" y="183" text-anchor="middle">the procedure (das Dauerhafte): a fixed sequence of acts</text>
  <text class="muted small" x="316" y="200" text-anchor="middle">older than any meaning attached to it — unchanged in every frame</text>
  <text class="muted small" x="20" y="230">time →</text>
</svg>

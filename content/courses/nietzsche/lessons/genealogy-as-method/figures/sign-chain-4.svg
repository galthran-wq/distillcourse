<svg viewBox="0 0 640 240" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tag { font-weight: 600; }
    .proc { fill: none; stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.8; }
    .now { fill: none; stroke: #e2903a; stroke-width: 2; }
    .past { fill: none; stroke: #4c8dd6; stroke-width: 1.4; opacity: 0.5; }
    .empty { fill: none; stroke: currentColor; stroke-opacity: 0.3; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .down { stroke: #e2903a; stroke-width: 1.4; fill: none; }
    .downpast { stroke: #4c8dd6; stroke-width: 1.2; fill: none; opacity: 0.5; }
    .chain { stroke: currentColor; stroke-opacity: 0.4; stroke-width: 1.2; fill: none; }
    .faded { opacity: 0.5; }
  </style>

  <text class="muted small" x="20" y="16">frame 4 of 4 · the present "meaning" is the last link of the chain, not its first cause</text>

  <!-- slot 1: past -->
  <rect class="past" x="20" y="28" width="136" height="26" rx="4"/>
  <text class="tag small faded" x="88" y="45" text-anchor="middle" fill="#4c8dd6">the injured creditor</text>
  <path class="downpast" d="M 88 54 L 88 74"/><path class="downpast" d="M 83 68 L 88 74 L 93 68"/>
  <rect class="past" x="20" y="76" width="136" height="60" rx="4"/>
  <text class="label small faded" x="88" y="96" text-anchor="middle">compensation:</text>
  <text class="label small faded" x="88" y="110" text-anchor="middle">pain repays a debt</text>
  <text class="muted small" x="88" y="126" text-anchor="middle">II:4–6</text>

  <path class="chain" d="M 156 106 L 172 106"/>

  <!-- slot 2: past -->
  <rect class="past" x="172" y="28" width="136" height="26" rx="4"/>
  <text class="tag small faded" x="240" y="45" text-anchor="middle" fill="#4c8dd6">the community at peace</text>
  <path class="downpast" d="M 240 54 L 240 74"/><path class="downpast" d="M 235 68 L 240 74 L 245 68"/>
  <rect class="past" x="172" y="76" width="136" height="60" rx="4"/>
  <text class="label small faded" x="240" y="96" text-anchor="middle">isolation of a disturbance;</text>
  <text class="label small faded" x="240" y="110" text-anchor="middle">war on the breaker of the peace</text>
  <text class="muted small" x="240" y="126" text-anchor="middle">II:9, 13</text>

  <path class="chain" d="M 308 106 L 324 106"/>

  <!-- slot 3: past -->
  <rect class="past" x="324" y="28" width="136" height="26" rx="4"/>
  <text class="tag small faded" x="392" y="45" text-anchor="middle" fill="#4c8dd6">the power that protects</text>
  <path class="downpast" d="M 392 54 L 392 74"/><path class="downpast" d="M 387 68 L 392 74 L 397 68"/>
  <rect class="past" x="324" y="76" width="136" height="60" rx="4"/>
  <text class="label small faded" x="392" y="96" text-anchor="middle">a fee for shielding the culprit;</text>
  <text class="label small faded" x="392" y="110" text-anchor="middle">fear of those who rule</text>
  <text class="muted small" x="392" y="126" text-anchor="middle">II:13</text>

  <path class="chain" d="M 460 106 L 476 106"/>

  <!-- slot 4: now -->
  <rect class="now" x="476" y="28" width="136" height="26" rx="4"/>
  <text class="tag small" x="544" y="45" text-anchor="middle" fill="#e2903a">"contemporary Europe"</text>
  <path class="down" d="M 544 54 L 544 74"/><path class="down" d="M 539 68 L 544 74 L 549 68"/>
  <rect class="now" x="476" y="76" width="136" height="60" rx="4"/>
  <text class="label small" x="544" y="96" text-anchor="middle">deterrence, "correction":</text>
  <text class="label small" x="544" y="110" text-anchor="middle">a synthesis of meanings</text>
  <text class="muted small" x="544" y="126" text-anchor="middle">the present use</text>

  <!-- the procedure -->
  <rect class="proc" x="20" y="164" width="592" height="46" rx="6"/>
  <text class="tag" x="316" y="183" text-anchor="middle">the procedure (das Dauerhafte): a fixed sequence of acts</text>
  <text class="muted small" x="316" y="200" text-anchor="middle">older than any meaning attached to it — unchanged in every frame</text>
  <text class="muted small" x="20" y="230">time →</text>
  <text class="tag small" x="612" y="230" text-anchor="end" fill="#e2903a">a Zeichen-Kette: the links need share no cause (II:12)</text>
</svg>

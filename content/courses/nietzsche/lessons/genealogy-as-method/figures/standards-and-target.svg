<svg viewBox="0 0 640 270" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tag { font-weight: 600; }
    .target { fill: none; stroke: #4c8dd6; stroke-width: 1.6; stroke-dasharray: 5 3; }
    .std { fill: none; stroke: #e2903a; stroke-width: 2; }
    .inside { fill: none; stroke: currentColor; stroke-opacity: 0.55; stroke-width: 1.4; }
  </style>

  <text class="muted tag" x="320" y="20" text-anchor="middle">where each reader's standard stands relative to the target</text>

  <!-- the target -->
  <rect class="target" x="16" y="34" width="250" height="204" rx="8"/>
  <text class="tag" x="141" y="56" text-anchor="middle" fill="#4c8dd6">the target: morality as given</text>
  <text class="muted small" x="141" y="72" text-anchor="middle">values presented as universal, non-contingent</text>
  <rect class="inside" x="36" y="104" width="210" height="88" rx="6"/>
  <text class="label" x="141" y="126" text-anchor="middle">Kaufmann: honesty</text>
  <text class="muted small" x="141" y="144" text-anchor="middle">"the diagnosis itself is the revaluation":</text>
  <text class="muted small" x="141" y="158" text-anchor="middle">the standard is one of the target's own</text>
  <text class="muted small" x="141" y="172" text-anchor="middle">values, turned on the rest (BGE 212)</text>
  <text class="muted small" x="141" y="220" text-anchor="middle">the scope problem has to move it outside</text>

  <!-- the outside standards -->
  <rect class="std" x="300" y="40" width="324" height="60" rx="6"/>
  <text class="tag" x="312" y="60" fill="#e2903a">Leiter: a fact about types</text>
  <text class="label small" x="312" y="77">what a value does for the type that holds it,</text>
  <text class="label small" x="312" y="91">already assumed by the hypothesis</text>

  <rect class="std" x="300" y="110" width="324" height="60" rx="6"/>
  <text class="tag" x="312" y="130" fill="#e2903a">Reginster: the value of power</text>
  <text class="label small" x="312" y="147">a code's origin in strength or weakness, read</text>
  <text class="label small" x="312" y="161">against a defended standard (Module 6)</text>

  <rect class="std" x="300" y="180" width="324" height="60" rx="6"/>
  <text class="tag" x="312" y="200" fill="#e2903a">Nehamas: an account of interpretation</text>
  <text class="label small" x="312" y="217">no fact apart from interpretations, so no fixed</text>
  <text class="label small" x="312" y="231">thing for the objection to name</text>

  <text class="muted small" x="320" y="260" text-anchor="middle">each answer needs a standard the history does not supply; the bill is paid in the value-creation lesson</text>
</svg>

<svg viewBox="0 0 640 240" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tag { font-weight: 600; }
    .box { fill: none; stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.2; }
    .old { stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.4; fill: none; stroke-dasharray: 4 3; }
    .strike { stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.8; }
    .rule { fill: none; stroke: #e2903a; stroke-width: 2; }
  </style>

  <text class="muted tag" x="150" y="20" text-anchor="middle">the demonstrable purpose</text>
  <text class="muted small" x="320" y="20" text-anchor="middle">"as made for"</text>
  <text class="muted tag" x="490" y="20" text-anchor="middle">"also its ground of origin"</text>

  <!-- row 1: the eye -->
  <rect class="box" x="40" y="34" width="220" height="30" rx="5"/>
  <text class="label" x="150" y="54" text-anchor="middle">the eye — seeing</text>
  <path class="old" d="M 262 49 L 378 49"/>
  <path class="old" d="M 371 43 L 378 49 L 371 55"/>
  <rect class="box" x="380" y="34" width="220" height="30" rx="5"/>
  <text class="label" x="490" y="54" text-anchor="middle">the eye came to be for seeing</text>

  <!-- row 2: the hand -->
  <rect class="box" x="40" y="74" width="220" height="30" rx="5"/>
  <text class="label" x="150" y="94" text-anchor="middle">the hand — grasping</text>
  <path class="old" d="M 262 89 L 378 89"/>
  <path class="old" d="M 371 83 L 378 89 L 371 95"/>
  <rect class="box" x="380" y="74" width="220" height="30" rx="5"/>
  <text class="label" x="490" y="94" text-anchor="middle">the hand came to be for grasping</text>

  <!-- row 3: punishment -->
  <rect class="box" x="40" y="114" width="220" height="30" rx="5"/>
  <text class="label" x="150" y="134" text-anchor="middle">the procedure — punishing</text>
  <path class="old" d="M 262 129 L 378 129"/>
  <path class="old" d="M 371 123 L 378 129 L 371 135"/>
  <rect class="box" x="380" y="114" width="220" height="30" rx="5"/>
  <text class="label" x="490" y="134" text-anchor="middle">punishment arose for punishing</text>

  <!-- one strike through the inference column -->
  <line class="strike" x1="268" y1="36" x2="372" y2="142"/>
  <line class="strike" x1="372" y1="36" x2="268" y2="142"/>

  <!-- the rule -->
  <rect class="rule" x="40" y="160" width="560" height="56" rx="6"/>
  <text class="tag" x="52" y="180" fill="#e2903a">II:12 refuses the inference for organs, laws, customs, cult and art alike</text>
  <text class="label small" x="52" y="196">grasp an organ's usefulness fully: "nothing yet grasped about its coming-into-being";</text>
  <text class="label small" x="52" y="209">the present use is the sign of the last will to master the thing, not the cause of the thing</text>

  <text class="muted small" x="320" y="232" text-anchor="middle">"from of old one believed one grasped in the demonstrable purpose of a thing also its ground of origin"</text>
</svg>

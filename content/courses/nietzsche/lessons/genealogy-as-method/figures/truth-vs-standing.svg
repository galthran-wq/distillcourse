<svg viewBox="0 0 640 240" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tag { font-weight: 600; }
    .lvl { fill: none; stroke: currentColor; stroke-opacity: 0.45; stroke-width: 1.4; stroke-dasharray: 4 3; }
    .hit { fill: none; stroke: #e2903a; stroke-width: 2; }
    .claim { fill: none; stroke: #4c8dd6; stroke-width: 1.4; }
    .strike { stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.8; }
    .arrow { stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.4; fill: none; }
  </style>

  <text class="muted tag" x="320" y="20" text-anchor="middle">the discriminating case: a utilitarian who accepts the whole history of "good"</text>

  <!-- level of truth -->
  <rect class="lvl" x="16" y="34" width="608" height="76" rx="6"/>
  <text class="muted tag" x="28" y="54">the level of truth</text>
  <rect class="claim" x="28" y="64" width="300" height="36" rx="5"/>
  <text class="label small" x="178" y="79" text-anchor="middle">"altruism still maximizes welfare,</text>
  <text class="label small" x="178" y="93" text-anchor="middle">whatever its route into the language"</text>
  <path class="arrow" d="M 332 82 L 372 82"/>
  <path class="arrow" d="M 365 76 L 372 82 L 365 88"/>
  <text class="label" x="384" y="79">the genealogy's reply: none</text>
  <text class="muted small" x="384" y="95">origin does not touch truth (GS 345)</text>

  <!-- level of standing -->
  <rect class="hit" x="16" y="124" width="608" height="90" rx="6"/>
  <text class="tag" x="28" y="144" fill="#e2903a">the level of standing</text>
  <rect class="claim" x="28" y="154" width="300" height="36" rx="5"/>
  <text class="label small" x="178" y="169" text-anchor="middle">"altruistic valuation is moral valuation</text>
  <text class="label small" x="178" y="183" text-anchor="middle">as such (an sich)" — Rée, Preface §4</text>
  <line class="strike" x1="34" y1="172" x2="322" y2="172"/>
  <path class="arrow" d="M 332 172 L 372 172"/>
  <path class="arrow" d="M 365 166 L 372 172 L 365 178"/>
  <text class="label small" x="384" y="164">no longer sayable: the value is made, not given,</text>
  <text class="label small" x="384" y="178">and an argument is now owed for it, against</text>
  <text class="label small" x="384" y="192">a history that says a particular type needed it</text>
  <text class="muted small" x="28" y="206">the same evidence, a different conclusion: discredited, not refuted</text>

  <text class="muted small" x="320" y="232" text-anchor="middle">whether the owed argument can be won is the second half of the course's question</text>
</svg>

<svg viewBox="0 0 640 250" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tag { font-weight: 600; }
    .old { fill: none; stroke: currentColor; stroke-opacity: 0.45; stroke-width: 1.4; stroke-dasharray: 4 3; }
    .new { fill: none; stroke: #e2903a; stroke-width: 2; }
    .arrow { stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.4; fill: none; }
    .strike { stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.6; }
  </style>

  <!-- the boy's question -->
  <rect class="old" x="16" y="34" width="216" height="92" rx="6"/>
  <text class="muted tag" x="28" y="54">the thirteen-year-old's question</text>
  <text class="label" x="28" y="76">Where does evil come from?</text>
  <text class="muted small" x="28" y="94">answer given: God, "the father of evil"</text>
  <text class="muted small" x="28" y="110">Preface §3 · a question about a cause</text>
  <line class="strike" x1="24" y1="80" x2="222" y2="80"/>

  <!-- arrow -->
  <path class="arrow" d="M 238 80 L 286 80"/>
  <path class="arrow" d="M 279 74 L 286 80 L 279 86"/>
  <text class="muted small" x="262" y="66" text-anchor="middle">"historical and</text>
  <text class="muted small" x="262" y="100" text-anchor="middle">philological training"</text>

  <!-- the book's question -->
  <rect class="new" x="296" y="22" width="328" height="118" rx="6"/>
  <text class="tag" x="308" y="42" fill="#e2903a">the book's question, in two parts</text>
  <text class="label" x="308" y="66">1. Under what conditions did man invent</text>
  <text class="label" x="322" y="82">the value judgments good and evil?</text>
  <text class="label" x="308" y="106">2. And what value do they themselves have?</text>
  <text class="muted small" x="308" y="126">part 1 asks for a history · part 2 is new, and is the book's</text>

  <!-- German and the dated precursor -->
  <text class="muted small" x="320" y="170" text-anchor="middle">unter welchen Bedingungen erfand sich der Mensch jene Werthurtheile gut und böse?</text>
  <text class="muted small" x="320" y="186" text-anchor="middle">und welchen Werth haben sie selbst?  (GM Vorrede 3, 1887)</text>
  <text class="muted small" x="320" y="214" text-anchor="middle">two years earlier, in a notebook: "was sind unsere Werthschätzungen und moralischen</text>
  <text class="muted small" x="320" y="230" text-anchor="middle">Gütertafeln selber werth?"  (NF-1885,2[190] — dates the question; grounds nothing)</text>
</svg>

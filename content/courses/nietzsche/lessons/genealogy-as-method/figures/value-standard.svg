<svg viewBox="0 0 640 210" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tag { font-weight: 600; }
    .box { fill: none; stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.4; }
    .down { fill: none; stroke: #4c8dd6; stroke-width: 1.6; }
    .up { fill: none; stroke: #e2903a; stroke-width: 2; }
    .arrow { stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.4; fill: none; }
  </style>

  <text class="muted tag" x="320" y="20" text-anchor="middle">Preface §3: the standard for "what value do they themselves have?"</text>

  <!-- the judgment under test -->
  <rect class="box" x="230" y="36" width="180" height="46" rx="6"/>
  <text class="label" x="320" y="56" text-anchor="middle">the judgments "good" and "evil"</text>
  <text class="muted small" x="320" y="72" text-anchor="middle">held by a people, over a history</text>

  <!-- two arrows out -->
  <path class="arrow" d="M 230 66 L 160 112"/>
  <path class="arrow" d="M 166 105 L 160 112 L 168 113"/>
  <path class="arrow" d="M 410 66 L 480 112"/>
  <path class="arrow" d="M 474 105 L 480 112 L 472 113"/>

  <!-- hindered -->
  <rect class="down" x="16" y="118" width="280" height="62" rx="6"/>
  <text class="tag" x="28" y="138" fill="#4c8dd6">hindered human flourishing (Gedeihen)</text>
  <text class="label small" x="28" y="156">"a sign of distress, of impoverishment,</text>
  <text class="label small" x="28" y="170">of the degeneration of life"</text>

  <!-- furthered -->
  <rect class="up" x="344" y="118" width="280" height="62" rx="6"/>
  <text class="tag" x="356" y="138" fill="#e2903a">furthered human flourishing</text>
  <text class="label small" x="356" y="156">"the fullness, the force, the will of life,</text>
  <text class="label small" x="356" y="170">its courage, its confidence, its future"</text>

  <text class="muted small" x="320" y="202" text-anchor="middle">either verdict is a fact about the life that holds the value: the evidence question 1 collects</text>
</svg>

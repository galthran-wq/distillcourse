<svg viewBox="0 0 640 250" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tag { font-weight: 600; }
    .eng { fill: none; stroke: #4c8dd6; stroke-width: 1.6; }
    .fn { fill: none; stroke: #e2903a; stroke-width: 2; }
    .step { fill: none; stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.2; }
    .arrow { stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.4; fill: none; }
  </style>

  <!-- English column -->
  <rect class="eng" x="16" y="16" width="296" height="196" rx="6"/>
  <text class="tag" x="28" y="36" fill="#4c8dd6">the English account (I:2, the "decree")</text>
  <text class="muted small" x="28" y="52">first speakers: the recipients of useful acts</text>

  <rect class="step" x="28" y="64" width="272" height="24" rx="4"/>
  <text class="label small" x="164" y="80" text-anchor="middle">an unegoistic act benefits those it is shown to</text>
  <path class="arrow" d="M 164 88 L 164 98"/>
  <rect class="step" x="28" y="98" width="272" height="24" rx="4"/>
  <text class="label small" x="164" y="114" text-anchor="middle">they praise it and call it "good" (useful to me)</text>
  <path class="arrow" d="M 164 122 L 164 132"/>
  <rect class="step" x="28" y="132" width="272" height="24" rx="4"/>
  <text class="label small" x="164" y="148" text-anchor="middle">the praise's origin is forgotten; habit remains</text>
  <path class="arrow" d="M 164 156 L 164 166"/>
  <rect class="step" x="28" y="166" width="272" height="24" rx="4"/>
  <text class="label small" x="164" y="182" text-anchor="middle">the act is simply felt as good in itself (error)</text>
  <text class="muted small" x="28" y="206">evidence offered: the present sense of "good"</text>

  <!-- Nietzsche column -->
  <rect class="fn" x="328" y="16" width="296" height="196" rx="6"/>
  <text class="tag" x="340" y="36" fill="#e2903a">Nietzsche's account (I:2)</text>
  <text class="muted small" x="340" y="52">first speakers: "the good themselves"</text>

  <rect class="step" x="340" y="64" width="272" height="24" rx="4"/>
  <text class="label small" x="476" y="80" text-anchor="middle">the noble, the powerful, the higher-placed</text>
  <path class="arrow" d="M 476 88 L 476 98"/>
  <rect class="step" x="340" y="98" width="272" height="24" rx="4"/>
  <text class="label small" x="476" y="114" text-anchor="middle">name themselves and their doings "good"</text>
  <path class="arrow" d="M 476 122 L 476 132"/>
  <rect class="step" x="340" y="132" width="272" height="24" rx="4"/>
  <text class="label small" x="476" y="148" text-anchor="middle">"in contrast to everything low"</text>
  <path class="arrow" d="M 476 156 L 476 166"/>
  <rect class="step" x="340" y="166" width="272" height="24" rx="4"/>
  <text class="label small" x="476" y="182" text-anchor="middle">the recipients had nothing to do with it</text>
  <text class="muted small" x="340" y="206">evidence claimed: the etymologies of I:4–5</text>

  <text class="muted small" x="320" y="238" text-anchor="middle">both are claims about who first said the word; only the second comes with a document, which the next lesson grades</text>
</svg>

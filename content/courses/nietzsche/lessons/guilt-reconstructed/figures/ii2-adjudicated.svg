<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10px; }
    .tag { fill: currentColor; font-weight: 600; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .green { fill: #5aa46a; font-weight: 600; }
    .rule { stroke: currentColor; stroke-opacity: 0.3; stroke-width: 1; }
    .head { stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.2; }
  </style>
  <text class="tag" x="320" y="20" text-anchor="middle">GM II:2 sentence by sentence: what each reading says, and what the text decides</text>

  <text class="label small" x="16" y="46">sentence of II:2</text>
  <text class="blue small" x="214" y="46">Leiter: natural artefact</text>
  <text class="amber small" x="372" y="46">Anderson: achieved self</text>
  <text class="tag small" x="536" y="46">the text decides?</text>
  <path class="head" d="M 16 52 L 624 52"/>

  <text class="label small" x="16" y="72">"to breed an animal" (II:1);</text>
  <text class="label small" x="16" y="84">"the ripest fruit on its tree"</text>
  <text class="muted small" x="214" y="72">literal: a type the process</text>
  <text class="muted small" x="214" y="84">yields at its end</text>
  <text class="muted small" x="372" y="72">the material; the self did</text>
  <text class="muted small" x="372" y="84">the integrating (supplied)</text>
  <text class="blue small" x="536" y="78">for Leiter</text>
  <path class="rule" d="M 16 94 L 624 94"/>

  <text class="label small" x="16" y="114">"has become an instinct,</text>
  <text class="label small" x="16" y="126">a dominating instinct"</text>
  <text class="muted small" x="214" y="114">literal: a type-fact,</text>
  <text class="muted small" x="214" y="126">BGE 21's strong will</text>
  <text class="muted small" x="372" y="114">how the achievement feels</text>
  <text class="muted small" x="372" y="126">once complete (supplied)</text>
  <text class="blue small" x="536" y="120">for Leiter</text>
  <path class="rule" d="M 16 136 L 624 136"/>

  <text class="label small" x="16" y="156">"liberated again from the</text>
  <text class="label small" x="16" y="168">morality of custom"</text>
  <text class="muted small" x="214" y="156">no longer needs the</text>
  <text class="muted small" x="214" y="168">straitjacket (a stretch)</text>
  <text class="muted small" x="372" y="156">literal: a self outside</text>
  <text class="muted small" x="372" y="168">the law that made it</text>
  <text class="amber small" x="536" y="162">for Anderson</text>
  <path class="rule" d="M 16 178 L 624 178"/>

  <text class="label small" x="16" y="198">"what has been achieved</text>
  <text class="label small" x="16" y="210">(errungen) and become flesh"</text>
  <text class="muted small" x="214" y="198">the type's self-report,</text>
  <text class="muted small" x="214" y="210">BGE 19's affect of command</text>
  <text class="muted small" x="372" y="198">literal: won by struggle,</text>
  <text class="muted small" x="372" y="210">not bred</text>
  <text class="green small" x="536" y="204">neither: one verb</text>
  <path class="rule" d="M 16 220 L 624 220"/>

  <text class="label small" x="16" y="240">"privilege of responsibility";</text>
  <text class="label small" x="16" y="252">he "deserves" all three</text>
  <text class="muted small" x="214" y="240">honorifics: a persuasive</text>
  <text class="muted small" x="214" y="252">definition (Stevenson)</text>
  <text class="muted small" x="372" y="240">ranking, not relabeling:</text>
  <text class="muted small" x="372" y="252">responsibility as agency (Williams)</text>
  <text class="green small" x="536" y="246">neither: both cohere</text>
  <path class="rule" d="M 16 262 L 624 262"/>

  <text class="label small" x="16" y="282">"this master of the free will,</text>
  <text class="label small" x="16" y="294">this sovereign"</text>
  <text class="muted small" x="214" y="282">"free" emptied of I:13's</text>
  <text class="muted small" x="214" y="294">substratum; charge kept</text>
  <text class="muted small" x="372" y="282">agency free will, not</text>
  <text class="muted small" x="372" y="294">deserts free will (Gemes)</text>
  <text class="green small" x="536" y="288">neither: needs I:13</text>
  <path class="rule" d="M 16 304 L 624 304"/>

  <text class="label small" x="16" y="324">the figure appears once, here,</text>
  <text class="label small" x="16" y="336">and nowhere else in the corpus</text>
  <text class="muted small" x="214" y="324">a passage the argument</text>
  <text class="muted small" x="214" y="336">from II:4 runs without</text>
  <text class="muted small" x="372" y="324">the ideal the corpus'</text>
  <text class="muted small" x="372" y="336">praise of strength needs</text>
  <text class="blue small" x="536" y="330">for Leiter (weight)</text>
  <path class="head" d="M 16 348 L 624 348"/>

  <text class="muted small" x="320" y="368" text-anchor="middle">tally: three rows for the deflation, one for the achievement, three the paragraph cannot decide alone; the tie-breaker is I:13, outside the paragraph</text>
  <text class="muted small" x="320" y="384" text-anchor="middle">verdict as fact: underdetermined on II:2; the deflation is the cheaper reading given I:13, at the price of one paragraph read as rhetoric</text>
</svg>

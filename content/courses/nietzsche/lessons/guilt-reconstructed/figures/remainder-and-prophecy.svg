<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10px; }
    .tag { fill: currentColor; font-weight: 600; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .box { fill: none; stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.3; }
    .box-a { fill: none; stroke: #e2903a; stroke-width: 1.8; }
    .box-b { fill: none; stroke: #4c8dd6; stroke-width: 1.8; }
    .frame { fill: none; stroke: currentColor; stroke-opacity: 0.4; stroke-width: 1.2; stroke-dasharray: 6 4; }
    .link { stroke: #e2903a; stroke-width: 1.6; fill: none; }
    .link-b { stroke: #4c8dd6; stroke-width: 1.6; fill: none; }
    .rule { stroke: currentColor; stroke-opacity: 0.3; stroke-width: 1; }
  </style>
  <text class="tag" x="320" y="20" text-anchor="middle">What the three stages use, what they leave, and what lies outside them</text>

  <rect class="frame" x="16" y="34" width="418" height="230" rx="8"/>
  <text class="muted small" x="26" y="50">inside the three stages</text>

  <rect class="box-b" x="30" y="90" width="150" height="70" rx="6"/>
  <text class="blue" x="105" y="112" text-anchor="middle">bad conscience</text>
  <text class="muted small" x="105" y="128" text-anchor="middle">II:16–18: cruelty turned</text>
  <text class="muted small" x="105" y="142" text-anchor="middle">inward and given form</text>

  <path class="link" d="M 180 112 L 250 82"/>
  <path class="link" d="M 243 82 L 250 82 L 246 88"/>
  <rect class="box-a" x="252" y="60" width="170" height="52" rx="6"/>
  <text class="amber" x="337" y="80" text-anchor="middle">product 1: guilt</text>
  <text class="muted small" x="337" y="96" text-anchor="middle">II:19–22, used by stage 3</text>

  <path class="link-b" d="M 180 140 L 250 176"/>
  <path class="link-b" d="M 243 174 L 250 176 L 247 169"/>
  <rect class="box" x="252" y="150" width="170" height="82" rx="6"/>
  <text class="label" x="337" y="170" text-anchor="middle">product 2: the ideals</text>
  <text class="muted small" x="337" y="186" text-anchor="middle">II:18: "the womb of ideal and</text>
  <text class="muted small" x="337" y="200" text-anchor="middle">imaginative events", beauty,</text>
  <text class="muted small" x="337" y="214" text-anchor="middle">the value of the unegoistic</text>
  <text class="blue small" x="337" y="228" text-anchor="middle">unused: a remainder, not a refutation</text>

  <text class="muted small" x="30" y="190">II:19's verdict: "a sickness,</text>
  <text class="muted small" x="30" y="204">as pregnancy is a sickness"</text>
  <text class="muted small" x="30" y="218">names both products; a</text>
  <text class="muted small" x="30" y="232">history of a sickness keeps</text>
  <text class="muted small" x="30" y="246">only the first</text>

  <rect class="box" x="452" y="60" width="172" height="70" rx="6"/>
  <text class="label" x="538" y="80" text-anchor="middle">II:23: the Greeks</text>
  <text class="muted small" x="538" y="96" text-anchor="middle">bad conscience without guilt;</text>
  <text class="muted small" x="538" y="110" text-anchor="middle">"folly, not sin": a control case</text>

  <rect class="box-a" x="452" y="150" width="172" height="114" rx="6"/>
  <text class="amber" x="538" y="170" text-anchor="middle">II:24–25: not a stage</text>
  <text class="muted small" x="538" y="188" text-anchor="middle">the reversed attempt; "he must</text>
  <text class="muted small" x="538" y="202" text-anchor="middle">come one day, this Antichrist</text>
  <text class="muted small" x="538" y="216" text-anchor="middle">and Antinihilist"; Zarathustra</text>
  <text class="label small" x="538" y="238" text-anchor="middle">a hand-off: to the Third Treatise</text>
  <text class="label small" x="538" y="252" text-anchor="middle">and to the positive doctrine</text>

  <path class="rule" d="M 16 284 L 624 284"/>
  <text class="muted small" x="320" y="302" text-anchor="middle">the reconstruction ends at II:22; the treatise runs three sections further, and what they add is a control case and a direction, not a mechanism</text>
  <text class="muted small" x="320" y="318" text-anchor="middle">the second product is what the course's account of sublimation and the revaluation of suffering will need</text>
</svg>

<svg viewBox="0 0 640 470" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10px; }
    .tag { fill: currentColor; font-weight: 600; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .rule { stroke: currentColor; stroke-opacity: 0.25; stroke-width: 1; }
    .head { stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.2; }
    .dot { fill: #e2903a; }
    .dot-b { fill: #4c8dd6; }
    .dot-g { fill: currentColor; opacity: 0.55; }
  </style>
  <text class="tag" x="320" y="20" text-anchor="middle">The scorecard: twenty-five sections against three stages</text>

  <text class="label small" x="16" y="46">sections</text>
  <text class="label small" x="176" y="46">what they supply</text>
  <text class="amber small" x="392" y="46" text-anchor="middle">fits stage</text>
  <text class="amber small" x="392" y="58" text-anchor="middle">1 · 2 · 3</text>
  <text class="blue small" x="470" y="46" text-anchor="middle">deflated</text>
  <text class="label small" x="530" y="46" text-anchor="middle">unused</text>
  <text class="label small" x="592" y="46" text-anchor="middle">not a stage</text>
  <path class="head" d="M 16 66 L 624 66"/>

  <text class="label small" x="16" y="84">II:1</text>
  <text class="muted small" x="176" y="84">forgetting; the memory of the will; calculability</text>
  <circle class="dot" cx="372" cy="80" r="4"/>
  <path class="rule" d="M 16 92 L 624 92"/>

  <text class="label small" x="16" y="110">II:2, the process</text>
  <text class="muted small" x="176" y="110">the morality of custom made man calculable</text>
  <circle class="dot" cx="372" cy="106" r="4"/>
  <path class="rule" d="M 16 118 L 624 118"/>

  <text class="label small" x="16" y="136">II:2, the fruit</text>
  <text class="muted small" x="176" y="136">the sovereign individual: "free", "autonomous", "deserves"</text>
  <circle class="dot-b" cx="470" cy="132" r="4"/>
  <path class="rule" d="M 16 144 L 624 144"/>

  <text class="label small" x="16" y="162">II:3</text>
  <text class="muted small" x="176" y="162">pain as mnemonic; the penal catalogue</text>
  <circle class="dot" cx="372" cy="158" r="4"/>
  <path class="rule" d="M 16 170 L 624 170"/>

  <text class="label small" x="16" y="188">II:4–8</text>
  <text class="muted small" x="176" y="188">Schuld as debt; the creditor's right to cruelty; the measuring animal</text>
  <circle class="dot" cx="412" cy="184" r="4"/>
  <text class="muted small" x="422" y="188">(material)</text>
  <path class="rule" d="M 16 196 L 624 196"/>

  <text class="label small" x="16" y="214">II:9–11</text>
  <text class="muted small" x="176" y="214">the community as creditor; justice against ressentiment</text>
  <circle class="dot" cx="412" cy="210" r="4"/>
  <text class="muted small" x="422" y="214">(route)</text>
  <path class="rule" d="M 16 222 L 624 222"/>

  <text class="label small" x="16" y="240">II:12–13</text>
  <text class="muted small" x="176" y="240">origin and use; the eleven meanings of punishment</text>
  <circle class="dot-g" cx="592" cy="236" r="4"/>
  <text class="muted small" x="602" y="240">method</text>
  <path class="rule" d="M 16 248 L 624 248"/>

  <text class="label small" x="16" y="266">II:14–15</text>
  <text class="muted small" x="176" y="266">punishment yields prudence, never the feeling of deserving</text>
  <circle class="dot" cx="412" cy="262" r="4"/>
  <text class="muted small" x="422" y="266">(premise)</text>
  <path class="rule" d="M 16 274 L 624 274"/>

  <text class="label small" x="16" y="292">II:16–17</text>
  <text class="muted small" x="176" y="292">internalization; the enclosure by conquest</text>
  <circle class="dot" cx="392" cy="288" r="4"/>
  <path class="rule" d="M 16 300 L 624 300"/>

  <text class="label small" x="16" y="318">II:18</text>
  <text class="muted small" x="176" y="318">the same force as state-building; ideals, beauty, the unegoistic</text>
  <circle class="dot" cx="392" cy="314" r="4"/>
  <circle class="dot-g" cx="530" cy="314" r="4"/>
  <text class="muted small" x="540" y="318">products</text>
  <path class="rule" d="M 16 326 L 624 326"/>

  <text class="label small" x="16" y="344">II:19–22</text>
  <text class="muted small" x="176" y="344">the debt to ancestors, gods, the maximal God; moralization; self-torture</text>
  <circle class="dot" cx="412" cy="340" r="4"/>
  <path class="rule" d="M 16 352 L 624 352"/>

  <text class="label small" x="16" y="370">II:23</text>
  <text class="muted small" x="176" y="370">the Greeks: bad conscience kept at bay, "folly, not sin"</text>
  <circle class="dot" cx="412" cy="366" r="4"/>
  <text class="muted small" x="422" y="370">(control)</text>
  <path class="rule" d="M 16 378 L 624 378"/>

  <text class="label small" x="16" y="396">II:24–25</text>
  <text class="muted small" x="176" y="396">the reversed attempt; the Antichrist and Antinihilist; Zarathustra</text>
  <circle class="dot-g" cx="592" cy="392" r="4"/>
  <text class="muted small" x="602" y="396">prophecy</text>
  <path class="head" d="M 16 406 L 624 406"/>

  <text class="label small" x="16" y="426">tally: 20 of 25 sections fit a stage (II:1, 3, 4–11, 14–17, 19–23, with II:2's process and II:18's mechanism); 1 paragraph deflated (II:2's fruit);</text>
  <text class="label small" x="16" y="440">1 product unused (II:18); 2 sections are method (II:12–13); 2 are prophecy (II:24–25). Borrowed from outside the treatise: I:13, at stage 3.</text>
  <text class="muted small" x="16" y="458">verdict: the naturalist reading holds for the Second Treatise at the price of one paragraph read as rhetoric and one product carried unused</text>
</svg>

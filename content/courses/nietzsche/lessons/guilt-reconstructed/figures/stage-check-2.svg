<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10px; }
    .tag { fill: currentColor; font-weight: 600; }
    .amber { fill: #e2903a; font-weight: 600; }
    .tile { fill: none; stroke: currentColor; stroke-opacity: 0.45; stroke-width: 1.2; }
    .lit { fill: #e2903a; fill-opacity: 0.22; stroke: #e2903a; stroke-width: 1.8; }
    .unused { fill: none; stroke: currentColor; stroke-opacity: 0.45; stroke-width: 1.2; stroke-dasharray: 3 3; }
    .box-a { fill: none; stroke: #e2903a; stroke-width: 1.6; }
    .rule { stroke: currentColor; stroke-opacity: 0.3; stroke-width: 1; }
  </style>
  <text class="tag" x="320" y="20" text-anchor="middle">Stage 2, bad conscience: the sections it lights and the section it leaves</text>

  <rect class="tile" x="16" y="40" width="42" height="30" rx="4"/><text class="label small" x="37" y="59" text-anchor="middle">II:1</text>
  <rect class="tile" x="62" y="40" width="42" height="30" rx="4"/><text class="label small" x="83" y="59" text-anchor="middle">II:2</text>
  <rect class="tile" x="108" y="40" width="42" height="30" rx="4"/><text class="label small" x="129" y="59" text-anchor="middle">II:3</text>
  <rect class="tile" x="154" y="40" width="42" height="30" rx="4"/><text class="label small" x="175" y="59" text-anchor="middle">II:4</text>
  <rect class="tile" x="200" y="40" width="42" height="30" rx="4"/><text class="label small" x="221" y="59" text-anchor="middle">II:5</text>
  <rect class="tile" x="246" y="40" width="42" height="30" rx="4"/><text class="label small" x="267" y="59" text-anchor="middle">II:6</text>
  <rect class="tile" x="292" y="40" width="42" height="30" rx="4"/><text class="label small" x="313" y="59" text-anchor="middle">II:7</text>
  <rect class="tile" x="338" y="40" width="42" height="30" rx="4"/><text class="label small" x="359" y="59" text-anchor="middle">II:8</text>
  <rect class="tile" x="384" y="40" width="42" height="30" rx="4"/><text class="label small" x="405" y="59" text-anchor="middle">II:9</text>
  <rect class="tile" x="430" y="40" width="42" height="30" rx="4"/><text class="label small" x="451" y="59" text-anchor="middle">II:10</text>
  <rect class="tile" x="476" y="40" width="42" height="30" rx="4"/><text class="label small" x="497" y="59" text-anchor="middle">II:11</text>
  <rect class="tile" x="522" y="40" width="42" height="30" rx="4"/><text class="label small" x="543" y="59" text-anchor="middle">II:12</text>
  <rect class="tile" x="568" y="40" width="42" height="30" rx="4"/><text class="label small" x="589" y="59" text-anchor="middle">II:13</text>

  <rect class="tile" x="16" y="78" width="42" height="30" rx="4"/><text class="label small" x="37" y="97" text-anchor="middle">II:14</text>
  <rect class="tile" x="62" y="78" width="42" height="30" rx="4"/><text class="label small" x="83" y="97" text-anchor="middle">II:15</text>
  <rect class="lit" x="108" y="78" width="42" height="30" rx="4"/><text class="label small" x="129" y="97" text-anchor="middle">II:16</text>
  <rect class="lit" x="154" y="78" width="42" height="30" rx="4"/><text class="label small" x="175" y="97" text-anchor="middle">II:17</text>
  <rect class="unused" x="200" y="78" width="42" height="30" rx="4"/><text class="label small" x="221" y="97" text-anchor="middle">II:18</text>
  <rect class="tile" x="246" y="78" width="42" height="30" rx="4"/><text class="label small" x="267" y="97" text-anchor="middle">II:19</text>
  <rect class="tile" x="292" y="78" width="42" height="30" rx="4"/><text class="label small" x="313" y="97" text-anchor="middle">II:20</text>
  <rect class="tile" x="338" y="78" width="42" height="30" rx="4"/><text class="label small" x="359" y="97" text-anchor="middle">II:21</text>
  <rect class="tile" x="384" y="78" width="42" height="30" rx="4"/><text class="label small" x="405" y="97" text-anchor="middle">II:22</text>
  <rect class="tile" x="430" y="78" width="42" height="30" rx="4"/><text class="label small" x="451" y="97" text-anchor="middle">II:23</text>
  <rect class="tile" x="476" y="78" width="42" height="30" rx="4"/><text class="label small" x="497" y="97" text-anchor="middle">II:24</text>
  <rect class="tile" x="522" y="78" width="42" height="30" rx="4"/><text class="label small" x="543" y="97" text-anchor="middle">II:25</text>
  <rect class="tile" x="568" y="78" width="42" height="30" rx="4"/><text class="muted small" x="589" y="97" text-anchor="middle">I:13</text>

  <text class="muted small" x="16" y="128">lit: used by this stage · dashed: cited by the stage, part of it left unused · plain: another stage's</text>

  <rect class="box-a" x="16" y="140" width="608" height="118" rx="6"/>
  <text class="amber" x="30" y="162">what stage 2 takes</text>
  <text class="label small" x="30" y="180">II:16: "all instincts that do not discharge themselves outwardly turn inward"; the enclosure in society and peace; the soul as its by-product</text>
  <text class="label small" x="30" y="196">II:17: the enclosure sudden, imposed, complete; the state by conquest as the supplier of those three properties</text>
  <text class="label small" x="30" y="212">II:18, as material: the inward force is the same force that builds states, "in my language: the will to power"</text>
  <text class="amber" x="30" y="234">what it leaves</text>
  <text class="label small" x="30" y="250">II:18's products: "the true womb of ideal and imaginative events", beauty, the value of the unegoistic; II:19's "a sickness as pregnancy is a sickness"</text>

  <path class="rule" d="M 16 272 L 624 272"/>
  <text class="muted small" x="320" y="290" text-anchor="middle">stage 2 uses bad conscience as guilt's material only; the section that credits it with ideals is cited for its mechanism and not for its yield</text>
</svg>

<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10px; }
    .tag { fill: currentColor; font-weight: 600; }
    .amber { fill: #e2903a; font-weight: 600; }
    .tile { fill: none; stroke: currentColor; stroke-opacity: 0.45; stroke-width: 1.2; }
    .lit { fill: #e2903a; fill-opacity: 0.22; stroke: #e2903a; stroke-width: 1.8; }
    .half { fill: #e2903a; fill-opacity: 0.08; stroke: #e2903a; stroke-width: 1.4; }
    .borrowed { fill: #4c8dd6; fill-opacity: 0.22; stroke: #4c8dd6; stroke-width: 1.8; }
    .unused { fill: none; stroke: currentColor; stroke-opacity: 0.45; stroke-width: 1.2; stroke-dasharray: 3 3; }
    .box-a { fill: none; stroke: #e2903a; stroke-width: 1.6; }
    .rule { stroke: currentColor; stroke-opacity: 0.3; stroke-width: 1; }
  </style>
  <text class="tag" x="320" y="20" text-anchor="middle">Stage 3, guilt: the sections it lights, the premise it borrows, and the sections it leaves</text>

  <rect class="tile" x="16" y="40" width="42" height="30" rx="4"/><text class="label small" x="37" y="59" text-anchor="middle">II:1</text>
  <rect class="tile" x="62" y="40" width="42" height="30" rx="4"/><text class="label small" x="83" y="59" text-anchor="middle">II:2</text>
  <rect class="tile" x="108" y="40" width="42" height="30" rx="4"/><text class="label small" x="129" y="59" text-anchor="middle">II:3</text>
  <rect class="half" x="154" y="40" width="42" height="30" rx="4"/><text class="label small" x="175" y="59" text-anchor="middle">II:4</text>
  <rect class="half" x="200" y="40" width="42" height="30" rx="4"/><text class="label small" x="221" y="59" text-anchor="middle">II:5</text>
  <rect class="half" x="246" y="40" width="42" height="30" rx="4"/><text class="label small" x="267" y="59" text-anchor="middle">II:6</text>
  <rect class="half" x="292" y="40" width="42" height="30" rx="4"/><text class="label small" x="313" y="59" text-anchor="middle">II:7</text>
  <rect class="half" x="338" y="40" width="42" height="30" rx="4"/><text class="label small" x="359" y="59" text-anchor="middle">II:8</text>
  <rect class="half" x="384" y="40" width="42" height="30" rx="4"/><text class="label small" x="405" y="59" text-anchor="middle">II:9</text>
  <rect class="half" x="430" y="40" width="42" height="30" rx="4"/><text class="label small" x="451" y="59" text-anchor="middle">II:10</text>
  <rect class="half" x="476" y="40" width="42" height="30" rx="4"/><text class="label small" x="497" y="59" text-anchor="middle">II:11</text>
  <rect class="unused" x="522" y="40" width="42" height="30" rx="4"/><text class="label small" x="543" y="59" text-anchor="middle">II:12</text>
  <rect class="unused" x="568" y="40" width="42" height="30" rx="4"/><text class="label small" x="589" y="59" text-anchor="middle">II:13</text>

  <rect class="half" x="16" y="78" width="42" height="30" rx="4"/><text class="label small" x="37" y="97" text-anchor="middle">II:14</text>
  <rect class="half" x="62" y="78" width="42" height="30" rx="4"/><text class="label small" x="83" y="97" text-anchor="middle">II:15</text>
  <rect class="tile" x="108" y="78" width="42" height="30" rx="4"/><text class="label small" x="129" y="97" text-anchor="middle">II:16</text>
  <rect class="tile" x="154" y="78" width="42" height="30" rx="4"/><text class="label small" x="175" y="97" text-anchor="middle">II:17</text>
  <rect class="tile" x="200" y="78" width="42" height="30" rx="4"/><text class="label small" x="221" y="97" text-anchor="middle">II:18</text>
  <rect class="lit" x="246" y="78" width="42" height="30" rx="4"/><text class="label small" x="267" y="97" text-anchor="middle">II:19</text>
  <rect class="lit" x="292" y="78" width="42" height="30" rx="4"/><text class="label small" x="313" y="97" text-anchor="middle">II:20</text>
  <rect class="lit" x="338" y="78" width="42" height="30" rx="4"/><text class="label small" x="359" y="97" text-anchor="middle">II:21</text>
  <rect class="lit" x="384" y="78" width="42" height="30" rx="4"/><text class="label small" x="405" y="97" text-anchor="middle">II:22</text>
  <rect class="half" x="430" y="78" width="42" height="30" rx="4"/><text class="label small" x="451" y="97" text-anchor="middle">II:23</text>
  <rect class="unused" x="476" y="78" width="42" height="30" rx="4"/><text class="label small" x="497" y="97" text-anchor="middle">II:24</text>
  <rect class="unused" x="522" y="78" width="42" height="30" rx="4"/><text class="label small" x="543" y="97" text-anchor="middle">II:25</text>
  <rect class="borrowed" x="568" y="78" width="42" height="30" rx="4"/><text class="label small" x="589" y="97" text-anchor="middle">I:13</text>

  <text class="muted small" x="16" y="128">lit: the stage · pale: material, route or premise for it · blue: borrowed · dashed: not a stage (method, control case, prophecy)</text>

  <rect class="box-a" x="16" y="140" width="608" height="118" rx="6"/>
  <text class="amber" x="30" y="162">what stage 3 takes</text>
  <text class="label small" x="30" y="180">II:19–22: the debt reinterpreted up to a maximal god; the moralization named (II:21); the will to self-torture seizes the religious presupposition (II:22)</text>
  <text class="label small" x="30" y="196">II:4–8 as material (the creditor's right to cruelty); II:9–11 as the route (the community holds the creditor's standing); II:14–15 as a premise:</text>
  <text class="label small" x="30" y="212">punishment does not produce guilt, so guilt cannot descend through the punished debtor as such · I:13: the belief that he could have paid</text>
  <text class="amber" x="30" y="234">what it leaves</text>
  <text class="label small" x="30" y="250">II:12–13 (the method, not a stage) · II:23 (a control case: the Greeks had the bad conscience and not the guilt) · II:24–25 (a prophecy)</text>

  <path class="rule" d="M 16 272 L 624 272"/>
  <text class="muted small" x="320" y="290" text-anchor="middle">stage 3 is the only stage with a premise from outside the treatise, and the premise is one the First Treatise argued false</text>
</svg>

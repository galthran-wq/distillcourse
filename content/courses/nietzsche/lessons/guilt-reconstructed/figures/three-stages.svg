<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .box { fill: none; stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.3; }
    .box-a { fill: none; stroke: #e2903a; stroke-width: 1.8; }
    .box-b { fill: none; stroke: #4c8dd6; stroke-width: 1.8; }
    .link { stroke: currentColor; stroke-opacity: 0.7; stroke-width: 1.6; fill: none; }
    .missing { stroke: #e2903a; stroke-width: 2; fill: none; stroke-dasharray: 5 4; }
    .rule { stroke: currentColor; stroke-opacity: 0.3; stroke-width: 1; }
  </style>
  <text class="muted small" x="16" y="20">Leiter's three stages (Nietzsche on Morality, ch. 7), with the sections each claims</text>

  <rect class="box" x="16" y="40" width="186" height="92" rx="6"/>
  <text class="label" x="109" y="62" text-anchor="middle">1. conscience</text>
  <text class="muted small" x="109" y="80" text-anchor="middle">a bred memory of the will:</text>
  <text class="muted small" x="109" y="94" text-anchor="middle">custom and the mnemonics of pain</text>
  <text class="label small" x="109" y="116" text-anchor="middle">II:1–3</text>

  <path class="link" d="M 202 86 L 224 86"/>
  <path class="link" d="M 218 81 L 224 86 L 218 91"/>

  <rect class="box-b" x="227" y="40" width="186" height="92" rx="6"/>
  <text class="blue" x="320" y="62" text-anchor="middle">2. bad conscience</text>
  <text class="muted small" x="320" y="80" text-anchor="middle">cruelty turned inward once</text>
  <text class="muted small" x="320" y="94" text-anchor="middle">society blocked its discharge</text>
  <text class="label small" x="320" y="116" text-anchor="middle">II:16–18</text>

  <path class="link" d="M 413 86 L 435 86"/>
  <path class="link" d="M 429 81 L 435 86 L 429 91"/>

  <rect class="box-a" x="438" y="40" width="186" height="92" rx="6"/>
  <text class="amber" x="531" y="62" text-anchor="middle">3. guilt</text>
  <text class="muted small" x="531" y="80" text-anchor="middle">bad conscience moralized:</text>
  <text class="muted small" x="531" y="94" text-anchor="middle">deserved, before a maximal creditor</text>
  <text class="label small" x="531" y="116" text-anchor="middle">II:19–22 (II:4–8 as material)</text>

  <path class="missing" d="M 531 196 L 531 136"/>
  <path class="missing" d="M 525 142 L 531 136 L 537 142"/>
  <rect class="box-a" x="420" y="200" width="204" height="58" rx="6"/>
  <text class="amber small" x="522" y="220" text-anchor="middle">borrowed from the First Treatise</text>
  <text class="label small" x="522" y="236" text-anchor="middle">I:13's doer: "he could have done otherwise"</text>
  <text class="muted small" x="522" y="250" text-anchor="middle">argued false there; needed as a belief here</text>

  <rect class="box" x="16" y="200" width="380" height="58" rx="6"/>
  <text class="label small" x="206" y="220" text-anchor="middle">one self-directed force, three readings of it</text>
  <text class="muted small" x="206" y="236" text-anchor="middle">stage 1: pain read as a memory · stage 2: cruelty with the self as object</text>
  <text class="muted small" x="206" y="250" text-anchor="middle">stage 3: that cruelty read as punishment the sufferer deserves</text>

  <path class="rule" d="M 16 278 L 624 278"/>
  <text class="muted small" x="320" y="298" text-anchor="middle">the ceiling of stage 3 is II:20–21: the maximal god, the maximum of guilt-feeling, the creditor who pays himself</text>
  <text class="muted small" x="320" y="314" text-anchor="middle">the test: do the twenty-five sections fit the three boxes without remainder?</text>
</svg>

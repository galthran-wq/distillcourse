<svg viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10px; }
    .tag { fill: currentColor; font-weight: 600; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .box { fill: none; stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.3; }
    .box-a { fill: none; stroke: #e2903a; stroke-width: 1.8; }
    .cell { fill: none; stroke: currentColor; stroke-opacity: 0.45; stroke-width: 1.2; }
    .cell-a { fill: #e2903a; fill-opacity: 0.18; stroke: #e2903a; stroke-width: 1.8; }
    .cell-b { fill: #4c8dd6; fill-opacity: 0.14; stroke: #4c8dd6; stroke-width: 1.6; }
    .map { stroke: #e2903a; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
    .map-b { stroke: #4c8dd6; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
    .rule { stroke: currentColor; stroke-opacity: 0.3; stroke-width: 1; }
  </style>
  <text class="tag" x="320" y="20" text-anchor="middle">Two reconstructions, one section list: Leiter's stages placed on Janaway's grid</text>

  <text class="label small" x="16" y="44">Leiter: three stages in sequence</text>
  <rect class="box" x="16" y="52" width="220" height="56" rx="6"/>
  <text class="label" x="126" y="74" text-anchor="middle">stage 1: conscience</text>
  <text class="muted small" x="126" y="92" text-anchor="middle">II:1–3, a calculable animal, pain as memory</text>

  <rect class="box" x="16" y="120" width="220" height="56" rx="6"/>
  <text class="blue" x="126" y="142" text-anchor="middle">stage 2: bad conscience</text>
  <text class="muted small" x="126" y="160" text-anchor="middle">II:16–18, cruelty with the self as object</text>

  <rect class="box-a" x="16" y="188" width="220" height="70" rx="6"/>
  <text class="amber" x="126" y="210" text-anchor="middle">stage 3: guilt</text>
  <text class="muted small" x="126" y="228" text-anchor="middle">II:19–22, moralized by the free-will lie</text>
  <text class="muted small" x="126" y="244" text-anchor="middle">I:13 as a premise of this stage</text>

  <text class="label small" x="300" y="44">Janaway: two axes, four cells (2007, p. 147)</text>
  <text class="muted small" x="404" y="66" text-anchor="middle">non-legitimated</text>
  <text class="amber small" x="540" y="66" text-anchor="middle">legitimated: II:4–8</text>
  <text class="muted small" x="300" y="98">not turned</text>
  <text class="muted small" x="300" y="110">inward</text>
  <rect class="cell" x="340" y="74" width="128" height="56" rx="4"/>
  <text class="label small" x="404" y="96" text-anchor="middle">(a) simple cruelty</text>
  <text class="label small" x="404" y="110" text-anchor="middle">to others: the festival</text>
  <rect class="cell" x="476" y="74" width="128" height="56" rx="4"/>
  <text class="label small" x="540" y="96" text-anchor="middle">(c) punishment of others:</text>
  <text class="label small" x="540" y="110" text-anchor="middle">the creditor's right</text>
  <text class="blue small" x="300" y="164">turned inward:</text>
  <text class="blue small" x="300" y="176">II:16</text>
  <rect class="cell-b" x="340" y="140" width="128" height="56" rx="4"/>
  <text class="label small" x="404" y="162" text-anchor="middle">(b) simple cruelty to self:</text>
  <text class="label small" x="404" y="176" text-anchor="middle">the caged animal</text>
  <rect class="cell-a" x="476" y="140" width="128" height="56" rx="4"/>
  <text class="label small" x="540" y="162" text-anchor="middle">(d) punishment of self:</text>
  <text class="label small" x="540" y="176" text-anchor="middle">guilt, cruelty read as deserved</text>

  <path class="map-b" d="M 236 148 L 340 168"/>
  <path class="map" d="M 236 223 L 476 176"/>
  <path class="rule" d="M 236 80 L 300 80"/>
  <text class="muted small" x="300" y="248">stage 1 has no cell: the grid presupposes a calculable,</text>
  <text class="muted small" x="300" y="260">enclosed animal and starts where the cruelty is already his</text>

  <rect class="box" x="340" y="272" width="284" height="40" rx="5"/>
  <text class="label small" x="482" y="288" text-anchor="middle">"deserved" inside cell (d) is I:13's doer: the grid does not</text>
  <text class="label small" x="482" y="302" text-anchor="middle">name the premise as a stage, and cannot fill the cell without it</text>

  <path class="rule" d="M 16 326 L 624 326"/>
  <text class="muted small" x="320" y="344" text-anchor="middle">where the two agree: stage 2 is cell (b), stage 3 is cell (d), and both need I:13, one as a premise and one inside "rightful"</text>
  <text class="muted small" x="320" y="360" text-anchor="middle">where they differ: II:2 (deflated by Leiter, set aside by Janaway) and what "moralization" names (the free-will lie, or guilt made a virtue by the God of II:21)</text>
</svg>

<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tag { fill: currentColor; font-weight: 600; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .dot { fill: currentColor; opacity: 0.7; }
    .line { stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.2; fill: none; }
    .box { fill: none; stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.3; }
    .box-a { fill: none; stroke: #e2903a; stroke-width: 1.8; }
    .pack { fill: #e2903a; opacity: 0.85; }
    .grid { stroke: #4c8dd6; stroke-width: 1.4; fill: none; }
    .strike { stroke: #e2903a; stroke-width: 2.4; fill: none; }
    .rule { stroke: currentColor; stroke-opacity: 0.3; stroke-width: 1; }
  </style>
  <text class="muted small" x="16" y="20">II:17: two pictures of how the oldest "state" began</text>

  <!-- left: contract -->
  <text class="tag" x="150" y="48" text-anchor="middle">the contract picture</text>
  <circle class="dot" cx="70" cy="90" r="5"/>
  <circle class="dot" cx="130" cy="78" r="5"/>
  <circle class="dot" cx="200" cy="86" r="5"/>
  <circle class="dot" cx="240" cy="120" r="5"/>
  <circle class="dot" cx="60" cy="140" r="5"/>
  <circle class="dot" cx="110" cy="130" r="5"/>
  <circle class="dot" cx="190" cy="132" r="5"/>
  <path class="line" d="M 70 90 L 150 190 M 130 78 L 150 190 M 200 86 L 150 190 M 240 120 L 150 190 M 60 140 L 150 190 M 110 130 L 150 190 M 190 132 L 150 190"/>
  <rect class="box" x="100" y="176" width="100" height="30" rx="5"/>
  <text class="label small" x="150" y="195" text-anchor="middle">"contract"</text>
  <text class="muted small" x="150" y="228" text-anchor="middle">individuals agree; gradual, voluntary,</text>
  <text class="muted small" x="150" y="242" text-anchor="middle">"an organic growing-into new conditions"</text>
  <path class="strike" d="M 40 70 L 260 250"/>
  <text class="amber small" x="150" y="266" text-anchor="middle">"that sentimental enthusiasm is done with" (Schwärmerei)</text>

  <!-- divider -->
  <path class="rule" d="M 320 40 L 320 275"/>

  <!-- right: conquest -->
  <text class="tag" x="480" y="48" text-anchor="middle">II:17's picture</text>
  <path class="pack" d="M 400 62 L 470 62 L 435 100 Z"/>
  <path class="pack" d="M 470 62 L 540 62 L 505 100 Z"/>
  <text class="amber small" x="470" y="112" text-anchor="middle">a pack: conquerors, "organized for war"</text>
  <!-- the formless mass -->
  <circle class="dot" cx="380" cy="150" r="4"/>
  <circle class="dot" cx="402" cy="168" r="4"/>
  <circle class="dot" cx="392" cy="192" r="4"/>
  <circle class="dot" cx="418" cy="146" r="4"/>
  <circle class="dot" cx="425" cy="184" r="4"/>
  <circle class="dot" cx="440" cy="162" r="4"/>
  <circle class="dot" cx="410" cy="210" r="4"/>
  <circle class="dot" cx="446" cy="200" r="4"/>
  <text class="muted small" x="404" y="232" text-anchor="middle">"formless, still roaming",</text>
  <text class="muted small" x="404" y="246" text-anchor="middle">"superior in number"</text>
  <!-- arrow -->
  <path class="line" d="M 462 178 L 494 178"/>
  <path class="line" d="M 487 173 L 494 178 L 487 183"/>
  <!-- the formed structure -->
  <rect class="grid" x="506" y="132" width="90" height="92" rx="3"/>
  <path class="grid" d="M 506 155 L 596 155 M 506 178 L 596 178 M 506 201 L 596 201 M 536 132 L 536 224 M 566 132 L 566 224"/>
  <circle class="dot" cx="521" cy="143" r="3.5"/>
  <circle class="dot" cx="551" cy="143" r="3.5"/>
  <circle class="dot" cx="581" cy="143" r="3.5"/>
  <circle class="dot" cx="521" cy="166" r="3.5"/>
  <circle class="dot" cx="551" cy="166" r="3.5"/>
  <circle class="dot" cx="581" cy="166" r="3.5"/>
  <circle class="dot" cx="521" cy="189" r="3.5"/>
  <circle class="dot" cx="551" cy="189" r="3.5"/>
  <circle class="dot" cx="521" cy="212" r="3.5"/>
  <circle class="dot" cx="581" cy="212" r="3.5"/>
  <text class="blue small" x="551" y="240" text-anchor="middle">"a ruling structure that lives"</text>
  <text class="muted small" x="551" y="254" text-anchor="middle">parts and functions bounded</text>
  <rect class="box-a" x="340" y="262" width="280" height="20" rx="4"/>
  <text class="amber small" x="480" y="276" text-anchor="middle">sudden, violent, complete: "a break, a leap, a compulsion"</text>

  <path class="rule" d="M 16 292 L 624 292"/>
  <text class="label small" x="320" y="310" text-anchor="middle">II:16 needs an enclosure that arrives all at once and from outside; II:17 supplies both with a conquest</text>
</svg>

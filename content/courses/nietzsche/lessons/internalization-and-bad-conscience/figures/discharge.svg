<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tag { fill: currentColor; font-weight: 600; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .body { fill: none; stroke: currentColor; stroke-width: 1.6; }
    .drive { stroke: #e2903a; stroke-width: 2; fill: none; }
    .wall { stroke: #4c8dd6; stroke-width: 3; fill: none; }
    .soul { fill: none; stroke: #e2903a; stroke-width: 1.2; stroke-dasharray: 3 3; opacity: 0.7; }
    .rule { stroke: currentColor; stroke-opacity: 0.3; stroke-width: 1; }
  </style>
  <text class="muted small" x="16" y="20">II:16: the same instincts, before and after the enclosure</text>

  <!-- left panel: before -->
  <text class="tag" x="150" y="48" text-anchor="middle">before: discharge outward</text>
  <ellipse class="body" cx="150" cy="170" rx="40" ry="22"/>
  <text class="label small" x="150" y="174" text-anchor="middle">the animal</text>
  <path class="drive" d="M 122 152 L 78 108"/>
  <path class="drive" d="M 88 110 L 78 108 L 80 118"/>
  <path class="drive" d="M 150 148 L 150 96"/>
  <path class="drive" d="M 144 104 L 150 96 L 156 104"/>
  <path class="drive" d="M 178 152 L 222 108"/>
  <path class="drive" d="M 212 110 L 222 108 L 220 118"/>
  <path class="drive" d="M 116 182 L 66 210"/>
  <path class="drive" d="M 76 206 L 66 210 L 74 216"/>
  <path class="drive" d="M 184 182 L 234 210"/>
  <path class="drive" d="M 224 206 L 234 210 L 226 216"/>
  <text class="amber small" x="52" y="100" text-anchor="middle">hostility</text>
  <text class="amber small" x="150" y="86" text-anchor="middle">cruelty</text>
  <text class="amber small" x="252" y="100" text-anchor="middle">persecution</text>
  <text class="amber small" x="44" y="232" text-anchor="middle">attack, change</text>
  <text class="amber small" x="254" y="232" text-anchor="middle">destruction</text>
  <text class="muted small" x="150" y="262" text-anchor="middle">objects: enemies, prey, the foreign</text>

  <!-- divider -->
  <path class="rule" d="M 320 40 L 320 270"/>

  <!-- right panel: after -->
  <text class="tag" x="480" y="48" text-anchor="middle">after: "the walls of society and peace"</text>
  <rect class="wall" x="372" y="70" width="216" height="180" rx="4"/>
  <text class="blue small" x="480" y="64" text-anchor="middle">walls; "punishments above all belong to these bulwarks"</text>
  <ellipse class="body" cx="480" cy="170" rx="40" ry="22"/>
  <text class="label small" x="480" y="174" text-anchor="middle">the animal</text>
  <!-- drives hit the wall and bend back in -->
  <path class="drive" d="M 452 152 L 400 110 L 430 160"/>
  <path class="drive" d="M 424 152 L 430 160 L 431 150"/>
  <path class="drive" d="M 480 148 L 480 90 L 500 152"/>
  <path class="drive" d="M 492 145 L 500 152 L 499 142"/>
  <path class="drive" d="M 508 152 L 560 110 L 530 160"/>
  <path class="drive" d="M 536 152 L 530 160 L 529 150"/>
  <path class="drive" d="M 446 182 L 400 230 L 458 186"/>
  <path class="drive" d="M 448 188 L 458 186 L 452 178"/>
  <path class="drive" d="M 514 182 L 560 230 L 502 186"/>
  <path class="drive" d="M 512 188 L 502 186 L 508 178"/>
  <ellipse class="soul" cx="480" cy="170" rx="62" ry="40"/>
  <text class="amber small" x="480" y="244" text-anchor="middle">the "soul": depth, breadth, height</text>
  <text class="muted small" x="480" y="262" text-anchor="middle">object: "the possessors of such instincts"</text>

  <path class="rule" d="M 16 284 L 624 284"/>
  <text class="label small" x="320" y="302" text-anchor="middle">"All instincts that do not discharge themselves outwardly turn inward": the same arrows, one new object</text>
  <text class="muted small" x="320" y="318" text-anchor="middle">Alle Instinkte, welche sich nicht nach Aussen entladen, wenden sich nach Innen (II:16)</text>
</svg>

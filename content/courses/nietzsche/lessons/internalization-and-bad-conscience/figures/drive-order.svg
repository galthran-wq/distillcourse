<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tag { fill: currentColor; font-weight: 600; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .wall { stroke: #4c8dd6; stroke-width: 2.4; fill: none; }
    .dot { fill: none; stroke: currentColor; stroke-width: 1.4; }
    .top { fill: none; stroke: #e2903a; stroke-width: 2; }
    .cmd { stroke: #e2903a; stroke-width: 1.6; fill: none; }
    .line { stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.2; fill: none; }
    .rule { stroke: currentColor; stroke-opacity: 0.3; stroke-width: 1; }
  </style>
  <text class="muted small" x="16" y="20">the third panel: what the inward-turned force makes of the drives (Clark and Dudrick on II:16–18)</text>

  <!-- left: turned inward, unformed -->
  <text class="tag" x="150" y="52" text-anchor="middle">turned inward, still unformed</text>
  <rect class="wall" x="60" y="66" width="180" height="150" rx="4"/>
  <circle class="dot" cx="100" cy="100" r="9"/>
  <circle class="dot" cx="160" cy="92" r="9"/>
  <circle class="dot" cx="205" cy="120" r="9"/>
  <circle class="dot" cx="120" cy="150" r="9"/>
  <circle class="dot" cx="180" cy="165" r="9"/>
  <circle class="dot" cx="95" cy="195" r="9"/>
  <circle class="dot" cx="210" cy="192" r="9"/>
  <text class="muted small" x="150" y="236" text-anchor="middle">drives with no outward object,</text>
  <text class="muted small" x="150" y="250" text-anchor="middle">each still "making its demands"</text>

  <!-- arrow -->
  <path class="line" d="M 262 140 L 320 140"/>
  <path class="line" d="M 313 135 L 320 140 L 313 145"/>
  <text class="amber small" x="291" y="128" text-anchor="middle">form impressed</text>

  <!-- right: political order among the drives -->
  <text class="tag" x="480" y="52" text-anchor="middle">a ruling structure among the drives</text>
  <rect class="wall" x="390" y="66" width="180" height="150" rx="4"/>
  <circle class="top" cx="480" cy="92" r="11"/>
  <text class="amber small" x="480" y="96" text-anchor="middle">c</text>
  <circle class="dot" cx="430" cy="140" r="9"/>
  <circle class="dot" cx="480" cy="140" r="9"/>
  <circle class="dot" cx="530" cy="140" r="9"/>
  <circle class="dot" cx="415" cy="188" r="9"/>
  <circle class="dot" cx="455" cy="188" r="9"/>
  <circle class="dot" cx="505" cy="188" r="9"/>
  <circle class="dot" cx="545" cy="188" r="9"/>
  <path class="cmd" d="M 474 102 L 436 132 M 480 103 L 480 131 M 486 102 L 524 132"/>
  <path class="line" d="M 426 149 L 418 179 M 434 149 L 452 179 M 484 149 L 502 179 M 534 149 L 542 179"/>
  <text class="muted small" x="480" y="236" text-anchor="middle">a commanding drive (c) and obeying drives:</text>
  <text class="muted small" x="480" y="250" text-anchor="middle">the "soul" of BGE 12, a "social structure of the drives"</text>

  <path class="rule" d="M 16 262 L 624 262"/>
  <text class="label small" x="320" y="278" text-anchor="middle">the same "creating of forms, impressing of forms" the conquerors did to the population (II:17),</text>
  <text class="label small" x="320" y="292" text-anchor="middle">done by the inward force to the animal's own drives</text>
</svg>

<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .box { fill: none; stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.3; }
    .box-a { fill: none; stroke: #e2903a; stroke-width: 1.8; }
    .box-b { fill: none; stroke: #4c8dd6; stroke-width: 1.8; }
    .force { stroke: #e2903a; stroke-width: 2.4; fill: none; }
    .rule { stroke: currentColor; stroke-opacity: 0.3; stroke-width: 1; }
  </style>
  <text class="muted small" x="16" y="20">II:18: "at bottom it is the same active force"</text>

  <rect class="box-a" x="24" y="120" width="180" height="70" rx="6"/>
  <text class="amber" x="114" y="146" text-anchor="middle">the instinct for freedom</text>
  <text class="label small" x="114" y="163" text-anchor="middle">"in my language: the will to power"</text>
  <text class="muted small" x="114" y="180" text-anchor="middle">form-giving, violating, artist-like</text>

  <!-- upper branch: outward -->
  <path class="force" d="M 206 150 C 260 150 270 80 330 80 L 400 80"/>
  <path class="force" d="M 392 74 L 400 80 L 392 86"/>
  <text class="label small" x="300" y="66" text-anchor="middle">material: "the other man, other men"</text>
  <rect class="box" x="384" y="50" width="240" height="62" rx="6"/>
  <text class="label" x="504" y="72" text-anchor="middle">outward: states</text>
  <text class="muted small" x="504" y="88" text-anchor="middle">"a ruling structure that lives" (II:17),</text>
  <text class="muted small" x="504" y="102" text-anchor="middle">"grander, more conspicuous"</text>

  <!-- lower branch: inward -->
  <path class="force" d="M 206 160 C 260 160 270 230 330 230 L 400 230"/>
  <path class="force" d="M 392 224 L 400 230 L 392 236"/>
  <text class="label small" x="280" y="252" text-anchor="middle">material: "his whole old animal self"</text>
  <rect class="box-b" x="384" y="192" width="240" height="76" rx="6"/>
  <text class="blue" x="504" y="212" text-anchor="middle">inward: bad conscience</text>
  <text class="label small" x="504" y="228" text-anchor="middle">burns in "a will, a critique, a contempt, a No";</text>
  <text class="label small" x="504" y="242" text-anchor="middle">builds "negative ideals"; "the womb of ideal</text>
  <text class="label small" x="504" y="256" text-anchor="middle">events"; "perhaps beauty itself"</text>

  <path class="rule" d="M 16 284 L 624 284"/>
  <text class="label small" x="320" y="302" text-anchor="middle">one force, two materials: "smaller, pettier, in the direction backward, in the 'labyrinth of the breast'"</text>
  <text class="amber small" x="320" y="316" text-anchor="middle">"an illness, as pregnancy is an illness" (II:19)</text>
</svg>

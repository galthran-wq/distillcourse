<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tag { fill: currentColor; font-weight: 600; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .box { fill: none; stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.3; }
    .box-a { fill: none; stroke: #e2903a; stroke-width: 1.8; }
    .box-b { fill: none; stroke: #4c8dd6; stroke-width: 1.8; }
    .link { stroke: #e2903a; stroke-width: 1.8; fill: none; }
    .loose { stroke: currentColor; stroke-opacity: 0.45; stroke-width: 1.4; fill: none; stroke-dasharray: 4 4; }
    .rule { stroke: currentColor; stroke-opacity: 0.3; stroke-width: 1; }
  </style>
  <text class="muted small" x="16" y="20">II:17 graded: what the mechanism takes from the premise, and what the premise adds</text>

  <!-- left column: what the mechanism needs -->
  <text class="tag" x="130" y="50" text-anchor="middle">what II:16 needs of the enclosure</text>
  <rect class="box-a" x="30" y="62" width="200" height="40" rx="5"/>
  <text class="amber" x="130" y="80" text-anchor="middle">sudden</text>
  <text class="muted small" x="130" y="95" text-anchor="middle">no time for new outlets to form</text>
  <rect class="box-a" x="30" y="112" width="200" height="40" rx="5"/>
  <text class="amber" x="130" y="130" text-anchor="middle">complete</text>
  <text class="muted small" x="130" y="145" text-anchor="middle">no outward object; punishment blocks</text>
  <rect class="box-a" x="30" y="162" width="200" height="40" rx="5"/>
  <text class="amber" x="130" y="180" text-anchor="middle">imposed, not chosen</text>
  <text class="muted small" x="130" y="195" text-anchor="middle">"against which there was no struggle"</text>

  <!-- centre: the mechanism -->
  <path class="link" d="M 232 82 L 300 150"/>
  <path class="link" d="M 232 132 L 300 150"/>
  <path class="link" d="M 232 182 L 300 150"/>
  <rect class="box-a" x="302" y="122" width="120" height="56" rx="6"/>
  <text class="amber small" x="362" y="145" text-anchor="middle">internalization</text>
  <text class="label small" x="362" y="161" text-anchor="middle">runs</text>

  <!-- right column: what II:17 adds -->
  <text class="tag" x="520" y="50" text-anchor="middle">what II:17 adds</text>
  <rect class="box" x="424" y="62" width="196" height="40" rx="5"/>
  <text class="label" x="522" y="80" text-anchor="middle">a conquest by a pack</text>
  <text class="muted small" x="522" y="95" text-anchor="middle">one supplier of all three properties</text>
  <rect class="box" x="424" y="112" width="196" height="40" rx="5"/>
  <text class="label" x="522" y="130" text-anchor="middle">"blond beasts of prey"</text>
  <text class="muted small" x="522" y="145" text-anchor="middle">the lion of I:11; the conquerors unnamed</text>
  <rect class="box" x="424" y="162" width="196" height="40" rx="5"/>
  <text class="label" x="522" y="180" text-anchor="middle">a "master race" born to command</text>
  <text class="muted small" x="522" y="195" text-anchor="middle">a type-claim, not a nation</text>
  <path class="loose" d="M 424 82 L 380 120"/>
  <path class="loose" d="M 424 132 L 424 132"/>
  <text class="muted small" x="522" y="222" text-anchor="middle">asserted "as presupposition"; no record cited</text>

  <path class="rule" d="M 16 240 L 624 240"/>
  <rect class="box-b" x="60" y="252" width="520" height="62" rx="6"/>
  <text class="blue small" x="320" y="272" text-anchor="middle">the grade</text>
  <text class="label small" x="320" y="289" text-anchor="middle">the mechanism depends on the three properties, not on who supplied them:</text>
  <text class="label small" x="320" y="304" text-anchor="middle">any sudden, complete, imposed enclosure runs it; the conquest is one candidate, unargued</text>
</svg>

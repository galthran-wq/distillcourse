<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .box { fill: none; stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.3; }
    .box-a { fill: none; stroke: #e2903a; stroke-width: 1.8; }
    .box-b { fill: none; stroke: #4c8dd6; stroke-width: 1.8; }
    .force { stroke: #e2903a; stroke-width: 2.4; fill: none; }
    .reaim { stroke: #4c8dd6; stroke-width: 2.2; fill: none; stroke-dasharray: 6 4; }
    .strike { stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.6; fill: none; }
    .rule { stroke: currentColor; stroke-opacity: 0.3; stroke-width: 1; }
  </style>
  <text class="muted small" x="16" y="20">II:24: the inward force is fixed; what it is wedded to is not</text>

  <rect class="box-a" x="24" y="120" width="170" height="60" rx="6"/>
  <text class="amber" x="109" y="144" text-anchor="middle">bad conscience</text>
  <text class="muted small" x="109" y="160" text-anchor="middle">cruelty turned inward (II:16–18)</text>
  <text class="muted small" x="109" y="174" text-anchor="middle">"the direction backward"</text>

  <!-- present attachment -->
  <path class="force" d="M 196 140 L 400 90"/>
  <path class="force" d="M 391 87 L 400 90 L 394 97"/>
  <text class="label small" x="298" y="100" text-anchor="middle">wedded to, "for too long"</text>
  <rect class="box" x="404" y="60" width="212" height="60" rx="6"/>
  <text class="label" x="510" y="82" text-anchor="middle">the natural inclinations</text>
  <text class="muted small" x="510" y="98" text-anchor="middle">viewed "with an evil eye";</text>
  <text class="muted small" x="510" y="112" text-anchor="middle">the priest's attachment (III:15, ahead)</text>

  <!-- the reversed attempt -->
  <path class="reaim" d="M 196 160 L 400 210"/>
  <path class="reaim" d="M 391 203 L 400 210 L 394 213"/>
  <text class="blue small" x="270" y="212" text-anchor="middle">"a reversed attempt": wed instead to</text>
  <rect class="box-b" x="404" y="180" width="212" height="76" rx="6"/>
  <text class="blue" x="510" y="202" text-anchor="middle">the unnatural inclinations</text>
  <text class="label small" x="510" y="218" text-anchor="middle">"aspirations to the beyond, contrary to sense,</text>
  <text class="label small" x="510" y="232" text-anchor="middle">to instinct, to nature, to the animal":</text>
  <text class="label small" x="510" y="246" text-anchor="middle">"all ideals hostile to life"</text>

  <path class="rule" d="M 16 272 L 624 272"/>
  <text class="label small" x="320" y="290" text-anchor="middle">who could do it: "spirits strengthened by wars and victories", with "the great health"; "he must come one day",</text>
  <text class="label small" x="320" y="304" text-anchor="middle">"this Antichrist and Antinihilist, this victor over God and nothingness"; II:25 names him: Zarathustra</text>
  <text class="amber small" x="320" y="318" text-anchor="middle">prophecy, not argument: the treatise's forward hook, graded in Module 6</text>
</svg>

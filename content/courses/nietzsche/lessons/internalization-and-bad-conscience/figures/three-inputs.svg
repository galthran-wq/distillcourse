<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .box { fill: none; stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.3; }
    .box-a { fill: none; stroke: #e2903a; stroke-width: 1.8; }
    .box-b { fill: none; stroke: #4c8dd6; stroke-width: 1.8; }
    .link { stroke: currentColor; stroke-opacity: 0.7; stroke-width: 1.6; fill: none; }
    .missing { stroke: #e2903a; stroke-width: 2; fill: none; stroke-dasharray: 5 4; }
    .rule { stroke: currentColor; stroke-opacity: 0.3; stroke-width: 1; }
  </style>
  <text class="muted small" x="16" y="20">three inputs, one product: the site the escalation needed</text>

  <rect class="box" x="16" y="44" width="190" height="64" rx="6"/>
  <text class="label" x="111" y="66" text-anchor="middle">memory of the will</text>
  <text class="muted small" x="111" y="82" text-anchor="middle">II:1–3, the morality of custom</text>
  <text class="muted small" x="111" y="96" text-anchor="middle">supplies: a debtor who holds a debt</text>

  <rect class="box" x="225" y="44" width="190" height="64" rx="6"/>
  <text class="label" x="320" y="66" text-anchor="middle">the creditor's debt</text>
  <text class="muted small" x="320" y="82" text-anchor="middle">II:4–8, escalated in II:19–21</text>
  <text class="muted small" x="320" y="96" text-anchor="middle">supplies: a creditor and a right</text>

  <rect class="box-b" x="434" y="44" width="190" height="64" rx="6"/>
  <text class="blue" x="529" y="66" text-anchor="middle">internalized cruelty</text>
  <text class="muted small" x="529" y="82" text-anchor="middle">II:16–18, this lesson</text>
  <text class="muted small" x="529" y="96" text-anchor="middle">supplies: an inflicter, the self as material</text>

  <path class="link" d="M 111 110 L 111 150 L 300 190"/>
  <path class="link" d="M 320 110 L 320 190"/>
  <path class="link" d="M 529 110 L 529 150 L 340 190"/>
  <path class="link" d="M 313 183 L 320 190 L 327 183"/>

  <rect class="box-a" x="200" y="194" width="240" height="60" rx="6"/>
  <text class="amber" x="320" y="216" text-anchor="middle">guilt before God (II:22)</text>
  <text class="label small" x="320" y="232" text-anchor="middle">"the will to self-torture" seizes</text>
  <text class="label small" x="320" y="246" text-anchor="middle">"the religious presupposition"</text>

  <path class="missing" d="M 442 224 L 484 224"/>
  <rect class="box-a" x="486" y="204" width="146" height="40" rx="5"/>
  <text class="amber small" x="559" y="221" text-anchor="middle">the borrowed premise</text>
  <text class="label small" x="559" y="236" text-anchor="middle">I:13's doer, unargued here</text>

  <path class="rule" d="M 16 274 L 624 274"/>
  <text class="label small" x="320" y="292" text-anchor="middle">Janaway's two axes: the debt chain changes cruelty's status (a right), internalization its object (the self)</text>
  <text class="muted small" x="320" y="308" text-anchor="middle">the cage of II:16 is "the regularity of custom": the first and third inputs are one regime seen twice</text>
  <text class="muted small" x="320" y="324" text-anchor="middle">the order in which the three combine is the next lesson's three stages</text>
</svg>

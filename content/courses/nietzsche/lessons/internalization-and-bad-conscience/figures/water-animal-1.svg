<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .body { fill: none; stroke: currentColor; stroke-width: 1.6; }
    .drive { stroke: #e2903a; stroke-width: 2; fill: none; }
    .water { stroke: #4c8dd6; stroke-width: 1.6; fill: none; }
    .box-a { fill: none; stroke: #e2903a; stroke-width: 1.8; }
    .rule { stroke: currentColor; stroke-opacity: 0.3; stroke-width: 1; }
  </style>
  <text class="muted small" x="16" y="20">II:16, frame 1 of 3: in the water, the drives carry the animal</text>

  <path class="water" d="M 20 200 q 15 -10 30 0 t 30 0 t 30 0 t 30 0 t 30 0 t 30 0 t 30 0 t 30 0 t 30 0 t 30 0"/>
  <path class="water" d="M 20 222 q 15 -10 30 0 t 30 0 t 30 0 t 30 0 t 30 0 t 30 0 t 30 0 t 30 0 t 30 0 t 30 0" opacity="0.6"/>
  <text class="blue small" x="40" y="250">the water: the element the instincts were fitted to</text>

  <ellipse class="body" cx="170" cy="150" rx="52" ry="26"/>
  <path class="body" d="M 222 150 L 250 132 L 250 168 Z"/>
  <circle cx="135" cy="143" r="3" fill="currentColor"/>
  <text class="label small" x="170" y="154" text-anchor="middle">the half-animal</text>

  <path class="drive" d="M 130 128 L 88 92"/>
  <path class="drive" d="M 98 95 L 88 92 L 91 102"/>
  <path class="drive" d="M 170 122 L 170 74"/>
  <path class="drive" d="M 164 82 L 170 74 L 176 82"/>
  <path class="drive" d="M 210 128 L 252 92"/>
  <path class="drive" d="M 242 95 L 252 92 L 249 102"/>
  <text class="amber small" x="60" y="82" text-anchor="middle">war</text>
  <text class="amber small" x="170" y="64" text-anchor="middle">roaming</text>
  <text class="amber small" x="278" y="82" text-anchor="middle">adventure</text>

  <rect class="box-a" x="330" y="70" width="290" height="110" rx="6"/>
  <text class="amber small" x="475" y="92" text-anchor="middle">the regulating drives guide</text>
  <text class="label small" x="475" y="110" text-anchor="middle">"unconsciously and surely": no deliberation,</text>
  <text class="label small" x="475" y="126" text-anchor="middle">no uncertainty about what to do; the drives</text>
  <text class="label small" x="475" y="142" text-anchor="middle">discharge outward, on enemies and prey</text>
  <text class="muted small" x="475" y="166" text-anchor="middle">"carried by the water" (vom Wasser getragen)</text>

  <path class="rule" d="M 16 272 L 624 272"/>
  <text class="muted small" x="320" y="290" text-anchor="middle">the instincts are the animal's guides; the inner world is "thin, as if stretched between two skins"</text>
</svg>

<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .amber { fill: #e2903a; font-weight: 600; }
    .body { fill: none; stroke: currentColor; stroke-width: 1.6; }
    .dead { stroke: #e2903a; stroke-width: 2; fill: none; stroke-dasharray: 4 4; opacity: 0.45; }
    .ground { stroke: currentColor; stroke-width: 1.6; fill: none; }
    .box-a { fill: none; stroke: #e2903a; stroke-width: 1.8; }
    .rule { stroke: currentColor; stroke-opacity: 0.3; stroke-width: 1; }
  </style>
  <text class="muted small" x="16" y="20">II:16, frame 2 of 3: on land, the same drives are "devalued and 'disconnected'"</text>

  <path class="ground" d="M 20 200 L 320 200"/>
  <path class="ground" d="M 20 222 L 320 222" opacity="0.4"/>
  <text class="label small" x="40" y="250">the land: "walls of society and peace"; the old element gone</text>

  <ellipse class="body" cx="170" cy="150" rx="52" ry="26"/>
  <path class="body" d="M 222 150 L 250 132 L 250 168 Z"/>
  <circle cx="135" cy="143" r="3" fill="currentColor"/>
  <text class="label small" x="170" y="154" text-anchor="middle">the half-animal</text>
  <path class="body" d="M 150 176 L 146 200 M 190 176 L 194 200"/>

  <path class="dead" d="M 130 128 L 88 92"/>
  <path class="dead" d="M 170 122 L 170 74"/>
  <path class="dead" d="M 210 128 L 252 92"/>
  <text class="amber small" x="60" y="82" text-anchor="middle" opacity="0.5">war</text>
  <text class="amber small" x="170" y="64" text-anchor="middle" opacity="0.5">roaming</text>
  <text class="amber small" x="278" y="82" text-anchor="middle" opacity="0.5">adventure</text>

  <rect class="box-a" x="330" y="70" width="290" height="110" rx="6"/>
  <text class="amber small" x="475" y="92" text-anchor="middle">the drives still make their demands</text>
  <text class="label small" x="475" y="110" text-anchor="middle">but "it was difficult and rarely possible</text>
  <text class="label small" x="475" y="126" text-anchor="middle">to comply with them"; the animal must now</text>
  <text class="label small" x="475" y="142" text-anchor="middle">"walk on its feet and carry itself"</text>
  <text class="muted small" x="475" y="166" text-anchor="middle">"a terrible heaviness lay on them"</text>

  <path class="rule" d="M 16 272 L 624 272"/>
  <text class="muted small" x="320" y="290" text-anchor="middle">the change of element is sudden, "with one stroke" (mit Einem Male), not an adaptation</text>
</svg>

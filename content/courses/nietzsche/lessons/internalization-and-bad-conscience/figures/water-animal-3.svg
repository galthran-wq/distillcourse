<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .body { fill: none; stroke: currentColor; stroke-width: 1.6; }
    .dead { stroke: #e2903a; stroke-width: 2; fill: none; stroke-dasharray: 4 4; opacity: 0.45; }
    .organ { fill: none; stroke: #4c8dd6; stroke-width: 1.8; }
    .ground { stroke: currentColor; stroke-width: 1.6; fill: none; }
    .box-b { fill: none; stroke: #4c8dd6; stroke-width: 1.8; }
    .rule { stroke: currentColor; stroke-opacity: 0.3; stroke-width: 1; }
  </style>
  <text class="muted small" x="16" y="20">II:16, frame 3 of 3: "reduced to thinking, inferring, calculating"</text>

  <path class="ground" d="M 20 200 L 320 200"/>
  <path class="ground" d="M 20 222 L 320 222" opacity="0.4"/>
  <text class="label small" x="40" y="250">the land: "walls of society and peace"; the old element gone</text>

  <ellipse class="body" cx="170" cy="150" rx="52" ry="26"/>
  <path class="body" d="M 222 150 L 250 132 L 250 168 Z"/>
  <path class="body" d="M 150 176 L 146 200 M 190 176 L 194 200"/>
  <text class="label small" x="170" y="154" text-anchor="middle">the half-animal</text>

  <path class="dead" d="M 130 128 L 88 92"/>
  <path class="dead" d="M 170 122 L 170 74"/>
  <path class="dead" d="M 210 128 L 252 92"/>

  <rect class="organ" x="118" y="134" width="34" height="18" rx="3"/>
  <text class="blue small" x="135" y="147" text-anchor="middle">?</text>
  <path class="organ" d="M 118 143 L 96 143 L 96 120"/>
  <text class="blue small" x="96" y="112" text-anchor="middle">"consciousness"</text>

  <rect class="box-b" x="330" y="70" width="290" height="110" rx="6"/>
  <text class="blue small" x="475" y="92" text-anchor="middle">a new guide, in place of the drives:</text>
  <text class="label small" x="475" y="110" text-anchor="middle">"thinking, inferring, calculating, combining</text>
  <text class="label small" x="475" y="126" text-anchor="middle">causes and effects", by "their poorest and</text>
  <text class="label small" x="475" y="142" text-anchor="middle">most error-prone organ"</text>
  <text class="muted small" x="475" y="166" text-anchor="middle">ihr ärmlichstes und fehlgreifendstes Organ</text>

  <path class="rule" d="M 16 272 L 624 272"/>
  <text class="muted small" x="320" y="290" text-anchor="middle">this is the change of guide; the turning inward of the blocked drives is a second change, stated next</text>
</svg>

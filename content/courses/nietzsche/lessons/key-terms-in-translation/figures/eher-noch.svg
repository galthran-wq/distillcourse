<svg viewBox="0 0 640 262" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tag { font-weight: 600; }
    .row { fill: none; stroke: currentColor; stroke-opacity: 0.45; stroke-width: 1.2; }
    .trunc { fill: #4c8dd6; fill-opacity: 0.12; stroke: #4c8dd6; stroke-width: 1.6; }
    .kept { fill: #e2903a; fill-opacity: 0.12; stroke: #e2903a; stroke-width: 1.6; }
    .arrow { stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.4; fill: none; }
    .strike { stroke: currentColor; stroke-opacity: 0.7; stroke-width: 1.4; }
  </style>

  <!-- German -->
  <rect class="row" x="12" y="14" width="400" height="56" rx="5"/>
  <text class="tag small" x="22" y="32">the German — Ecce Homo III §1</text>
  <text class="label" x="22" y="50">"… sich <tspan font-weight="600">eher noch</tspan> nach einem Cesare Borgia</text>
  <text class="label" x="22" y="64">als nach einem Parsifal umsehn"</text>

  <rect class="row" x="428" y="14" width="200" height="56" rx="5"/>
  <text class="tag small" x="438" y="32">what it licenses</text>
  <text class="label small" x="438" y="50">a comparison of two cases,</text>
  <text class="label small" x="438" y="64">neither of them an ideal</text>

  <!-- truncated -->
  <path class="arrow" d="M 212 70 L 212 88"/>
  <rect class="trunc" x="12" y="90" width="400" height="56" rx="5"/>
  <text class="tag small" x="22" y="108" fill="#4c8dd6">the particle dropped</text>
  <text class="label" x="22" y="126">"look for a Cesare Borgia rather than</text>
  <text class="label" x="22" y="140">for a Parsifal"</text>

  <rect class="trunc" x="428" y="90" width="200" height="56" rx="5"/>
  <text class="tag small" x="438" y="108" fill="#4c8dd6">what it licenses</text>
  <text class="label small" x="438" y="126">Borgia set up as the type</text>
  <text class="label small" x="438" y="140">to look for: admiration</text>

  <!-- kept -->
  <path class="arrow" d="M 212 146 L 212 164"/>
  <rect class="kept" x="12" y="166" width="400" height="56" rx="5"/>
  <text class="tag small" x="22" y="184" fill="#e2903a">the particle kept (Kaufmann, ch. 7 §III)</text>
  <text class="label" x="22" y="202">"look <tspan font-weight="600">even</tspan> for a Cesare Borgia rather than</text>
  <text class="label" x="22" y="216">for a Parsifal"</text>

  <rect class="kept" x="428" y="166" width="200" height="56" rx="5"/>
  <text class="tag small" x="438" y="184" fill="#e2903a">what it licenses</text>
  <text class="label small" x="438" y="202">a ranking: even the worse case</text>
  <text class="label small" x="438" y="216">is preferred to Parsifal's</text>

  <!-- footer: the claim neither licenses -->
  <text class="muted small" x="320" y="244" text-anchor="middle">what no rendering licenses: that Borgia is the higher type — TI 'Expeditions' §37 says "as a kind of Übermensch" only to report the charge</text>
  <line class="strike" x1="150" y1="240" x2="330" y2="240" opacity="0"/>
</svg>

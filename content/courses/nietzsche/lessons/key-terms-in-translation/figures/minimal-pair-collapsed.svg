<svg viewBox="0 0 640 268" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tag { font-weight: 600; }
    .noble { fill: none; stroke: #e2903a; stroke-width: 2; }
    .slave { fill: none; stroke: #4c8dd6; stroke-width: 1.6; }
    .first-n { fill: #e2903a; fill-opacity: 0.18; stroke: #e2903a; stroke-width: 1.6; }
    .first-s { fill: #4c8dd6; fill-opacity: 0.18; stroke: #4c8dd6; stroke-width: 1.6; }
    .derived { fill: none; stroke: currentColor; stroke-opacity: 0.45; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .swapped { fill: #e2903a; fill-opacity: 0.08; stroke: #e2903a; stroke-width: 1.6; stroke-dasharray: 4 3; }
    .arrow { stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.4; fill: none; }
  </style>

  <!-- noble panel -->
  <rect class="noble" x="16" y="16" width="296" height="206" rx="6"/>
  <text class="tag" x="28" y="36" fill="#e2903a">noble valuation, schlecht rendered "evil"</text>
  <text class="muted small" x="28" y="52">the order is unchanged in the German</text>

  <rect class="first-n" x="28" y="66" width="272" height="48" rx="5"/>
  <text class="tag small" x="40" y="84">FIRST — of ourselves</text>
  <text class="label" x="40" y="104">"we, the good" (gut) — a Yes</text>

  <path class="arrow" d="M 164 114 L 164 140"/>
  <text class="muted small" x="172" y="131">"a pale, late-born foil"</text>

  <rect class="swapped" x="28" y="140" width="272" height="48" rx="5"/>
  <text class="tag small" x="40" y="158">DERIVED — of the others</text>
  <text class="label" x="40" y="178">"they, the <tspan font-weight="600" fill="#e2903a">evil</tspan>" (schlecht) — contempt</text>
  <text class="muted small" x="28" y="210">same word as the cell opposite</text>

  <!-- slave panel -->
  <rect class="slave" x="328" y="16" width="296" height="206" rx="6"/>
  <text class="tag" x="340" y="36" fill="#4c8dd6">slave valuation, böse rendered "evil"</text>
  <text class="muted small" x="340" y="52">the valuing glance turns outward first</text>

  <rect class="first-s" x="340" y="66" width="272" height="48" rx="5"/>
  <text class="tag small" x="352" y="84">FIRST — of the others</text>
  <text class="label" x="352" y="104">"they, the <tspan font-weight="600" fill="#e2903a">evil</tspan>" (böse) — a No</text>

  <path class="arrow" d="M 476 114 L 476 140"/>
  <text class="muted small" x="468" y="131" text-anchor="end">"after-image and counterpart"</text>

  <rect class="derived" x="340" y="140" width="272" height="48" rx="5"/>
  <text class="tag small" x="352" y="158">DERIVED — of ourselves</text>
  <text class="label" x="352" y="178">"we, the good" (gut) — by negation</text>
  <text class="muted small" x="340" y="210">same word as the cell opposite</text>

  <text class="muted small" x="320" y="242" text-anchor="middle">I:11 in this English: "these two words 'evil' and 'evil', how differently they stand there!"</text>
  <text class="muted small" x="320" y="256" text-anchor="middle">the order survives in the German; on this page it has no surface</text>
</svg>

<svg viewBox="0 0 640 262" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tag { font-weight: 600; }
    .root { fill: #e2903a; fill-opacity: 0.15; stroke: #e2903a; stroke-width: 1.6; }
    .branch { fill: #4c8dd6; fill-opacity: 0.12; stroke: #4c8dd6; stroke-width: 1.4; }
    .kept { fill: #5aa46a; fill-opacity: 0.12; stroke: #5aa46a; stroke-width: 1.4; }
    .arrow { stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.4; fill: none; }
    .note { fill: none; stroke: currentColor; stroke-opacity: 0.4; stroke-width: 1.1; }
  </style>

  <!-- root -->
  <rect class="root" x="220" y="14" width="200" height="48" rx="5"/>
  <text class="label" x="320" y="34" text-anchor="middle"><tspan font-style="italic">Schuld</tspan> / <tspan font-style="italic">Schulden</tspan> — one word</text>
  <text class="muted small" x="320" y="52" text-anchor="middle">GM II:4: "seine Herkunft aus dem sehr materiellen Begriff"</text>

  <!-- branches -->
  <path class="arrow" d="M 280 62 L 150 92"/>
  <path class="arrow" d="M 360 62 L 490 92"/>

  <rect class="branch" x="60" y="94" width="180" height="40" rx="5"/>
  <text class="label" x="150" y="112" text-anchor="middle">"guilt" throughout</text>
  <text class="muted small" x="150" y="127" text-anchor="middle">the title's choice (Samuel, II)</text>

  <rect class="branch" x="400" y="94" width="180" height="40" rx="5"/>
  <text class="label" x="490" y="112" text-anchor="middle">"debt" throughout</text>
  <text class="muted small" x="490" y="127" text-anchor="middle">or "ought" / "owe" (Samuel, II:4)</text>

  <!-- what each yields -->
  <rect class="note" x="40" y="146" width="220" height="52" rx="5"/>
  <text class="small label" x="50" y="164">"guilt descends from … guilt"</text>
  <text class="small muted" x="50" y="178">the identity vanishes; the premise</text>
  <text class="small muted" x="50" y="192">reads as a bare historical assertion</text>

  <rect class="note" x="380" y="146" width="220" height="52" rx="5"/>
  <text class="small label" x="390" y="164">"ought descends from owe"</text>
  <text class="small muted" x="390" y="178">an English pun stands in for a</text>
  <text class="small muted" x="390" y="192">German fact; the premise reads as wordplay</text>

  <!-- kept -->
  <rect class="kept" x="170" y="212" width="300" height="40" rx="5"/>
  <text class="label small" x="320" y="229" text-anchor="middle">"guilt (<tspan font-style="italic">Schuld</tspan>) … debts (<tspan font-style="italic">Schulden</tspan>)": the German kept in the line</text>
  <text class="muted small" x="320" y="244" text-anchor="middle">the identity visible as one fact, offered as evidence for a conjecture</text>
</svg>

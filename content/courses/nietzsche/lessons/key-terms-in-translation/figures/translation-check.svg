<svg viewBox="0 0 640 250" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tag { font-weight: 600; }
    .col { fill: none; stroke: currentColor; stroke-opacity: 0.45; stroke-width: 1.2; }
    .head { fill: currentColor; fill-opacity: 0.06; stroke: currentColor; stroke-opacity: 0.45; stroke-width: 1.2; }
    .arrow { stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.4; fill: none; }
    .ok { fill: #5aa46a; }
    .bad { fill: #e2903a; }
  </style>

  <!-- column headers -->
  <rect class="head" x="12" y="14" width="140" height="44" rx="5"/>
  <text class="tag" x="20" y="32">1 · the German</text>
  <text class="muted small" x="20" y="48">term, sentence, section</text>

  <rect class="head" x="168" y="14" width="140" height="44" rx="5"/>
  <text class="tag" x="176" y="32">2 · the renderings</text>
  <text class="muted small" x="176" y="48">every candidate in use</text>

  <rect class="head" x="324" y="14" width="140" height="44" rx="5"/>
  <text class="tag" x="332" y="32">3 · the premise</text>
  <text class="muted small" x="332" y="48">which reconstruction, which line</text>

  <rect class="head" x="480" y="14" width="148" height="44" rx="5"/>
  <text class="tag" x="488" y="32">4 · the verdict</text>
  <text class="muted small" x="488" y="48">survives / collapses / shifts</text>

  <path class="arrow" d="M 152 36 L 166 36"/>
  <path class="arrow" d="M 308 36 L 322 36"/>
  <path class="arrow" d="M 464 36 L 478 36"/>

  <!-- worked row -->
  <rect class="col" x="12" y="72" width="140" height="120" rx="5"/>
  <text class="label" x="20" y="92" font-style="italic">schlecht</text>
  <text class="muted small" x="20" y="108">GM I:4, I:10, I:11</text>
  <text class="muted small" x="20" y="124">"dies 'schlecht' vornehmen</text>
  <text class="muted small" x="20" y="138">Ursprungs und jenes 'böse'</text>
  <text class="muted small" x="20" y="152">aus dem Braukessel …"</text>

  <rect class="col" x="168" y="72" width="140" height="120" rx="5"/>
  <text class="label" x="176" y="92">"bad"</text>
  <text class="muted small" x="176" y="108">Samuel 1913; the later</text>
  <text class="muted small" x="176" y="122">editions keep the pair</text>
  <text class="label" x="176" y="146">"evil"</text>
  <text class="muted small" x="176" y="162">no edition; the counterfactual</text>
  <text class="muted small" x="176" y="176">the check must run</text>

  <rect class="col" x="324" y="72" width="140" height="120" rx="5"/>
  <text class="label" x="332" y="92">the asymmetry, P1</text>
  <text class="muted small" x="332" y="108">noble valuation derives</text>
  <text class="muted small" x="332" y="122">"bad" (schlecht) of the others</text>
  <text class="muted small" x="332" y="136">as a contrast term; slave</text>
  <text class="muted small" x="332" y="150">valuation coins "evil" (böse)</text>
  <text class="muted small" x="332" y="164">first — two different words</text>

  <rect class="col" x="480" y="72" width="148" height="120" rx="5"/>
  <text class="tag ok" x="488" y="92">"bad": survives</text>
  <text class="muted small" x="488" y="108">two contrary terms on the</text>
  <text class="muted small" x="488" y="122">page; I:11 readable</text>
  <text class="tag bad" x="488" y="146">"evil": collapses</text>
  <text class="muted small" x="488" y="162">one contrary term; the</text>
  <text class="muted small" x="488" y="176">order has no surface</text>

  <text class="muted small" x="320" y="218" text-anchor="middle">one row per term; the exercises fill rows of their own</text>
  <text class="muted small" x="320" y="234" text-anchor="middle">the question is never "which translation is best" but "which premise survives which word"</text>
</svg>

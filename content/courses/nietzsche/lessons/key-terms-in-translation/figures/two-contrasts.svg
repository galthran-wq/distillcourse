<svg viewBox="0 0 640 230" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tag { font-weight: 600; }
    .node { fill: none; stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.4; }
    .noble { fill: #e2903a; fill-opacity: 0.15; stroke: #e2903a; stroke-width: 1.6; }
    .slave { fill: #4c8dd6; fill-opacity: 0.15; stroke: #4c8dd6; stroke-width: 1.6; }
    .arrow-n { stroke: #e2903a; stroke-width: 1.6; fill: none; }
    .arrow-s { stroke: #4c8dd6; stroke-width: 1.6; fill: none; }
    .map { stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.4; fill: none; }
    .collapse { stroke: #e2903a; stroke-width: 1.6; fill: none; stroke-dasharray: 4 3; }
  </style>

  <text class="tag" x="22" y="26">German: two contrasts</text>
  <text class="tag" x="470" y="26">English: two words, or one</text>

  <!-- gut -->
  <rect class="node" x="22" y="90" width="90" height="44" rx="5"/>
  <text class="label" x="67" y="110" text-anchor="middle" font-style="italic">gut</text>
  <text class="muted small" x="67" y="126" text-anchor="middle">the one constant</text>

  <!-- schlecht -->
  <path class="arrow-n" d="M 112 100 C 150 60, 170 60, 200 62"/>
  <rect class="noble" x="202" y="44" width="150" height="44" rx="5"/>
  <text class="label" x="277" y="63" text-anchor="middle" font-style="italic">schlecht</text>
  <text class="muted small" x="277" y="79" text-anchor="middle">noble contempt, I:2 · I:10</text>

  <!-- böse -->
  <path class="arrow-s" d="M 112 124 C 150 164, 170 164, 200 162"/>
  <rect class="slave" x="202" y="140" width="150" height="44" rx="5"/>
  <text class="label" x="277" y="159" text-anchor="middle" font-style="italic">böse</text>
  <text class="muted small" x="277" y="175" text-anchor="middle">ressentiment's hatred, I:10</text>

  <!-- English targets -->
  <rect class="node" x="470" y="44" width="110" height="44" rx="5"/>
  <text class="label" x="525" y="63" text-anchor="middle">"bad"</text>
  <text class="muted small" x="525" y="79" text-anchor="middle">Samuel, I:4–11</text>

  <rect class="node" x="470" y="140" width="110" height="44" rx="5"/>
  <text class="label" x="525" y="159" text-anchor="middle">"evil"</text>
  <text class="muted small" x="525" y="175" text-anchor="middle">Samuel, I:10–11</text>

  <path class="map" d="M 352 66 L 468 66"/>
  <path class="map" d="M 352 162 L 468 162"/>

  <!-- the collapse -->
  <path class="collapse" d="M 352 76 C 400 90, 430 140, 468 156"/>
  <text class="small" x="386" y="118" fill="#e2903a">the collapse: schlecht → "evil"</text>

  <text class="muted small" x="320" y="212" text-anchor="middle">I:11: "wie verschieden stehen die beiden … Worte 'schlecht' und 'böse' da!" — the sentence needs two English words to be readable</text>
</svg>

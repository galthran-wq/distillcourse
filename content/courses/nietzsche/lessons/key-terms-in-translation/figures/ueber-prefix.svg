<svg viewBox="0 0 640 262" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tag { font-weight: 600; }
    .panel { fill: none; stroke: currentColor; stroke-opacity: 0.45; stroke-width: 1.2; }
    .rope { stroke: #e2903a; stroke-width: 2.2; fill: none; }
    .post { stroke: currentColor; stroke-opacity: 0.7; stroke-width: 2; }
    .abyss { fill: currentColor; fill-opacity: 0.06; }
    .walker { fill: #e2903a; }
    .down { stroke: #e2903a; stroke-width: 1.6; fill: none; stroke-dasharray: 4 3; }
    .pedestal { fill: #4c8dd6; fill-opacity: 0.12; stroke: #4c8dd6; stroke-width: 1.6; }
    .up { stroke: #4c8dd6; stroke-width: 1.6; fill: none; }
  </style>

  <!-- left: über as over/across -->
  <rect class="panel" x="12" y="12" width="376" height="236" rx="6"/>
  <text class="tag" x="24" y="32" fill="#e2903a">über- as over, across: the Prologue's images</text>

  <rect class="abyss" x="90" y="120" width="220" height="90"/>
  <text class="muted small" x="200" y="200" text-anchor="middle">Abgrund</text>

  <line class="post" x1="90" y1="70" x2="90" y2="120"/>
  <line class="post" x1="310" y1="70" x2="310" y2="120"/>
  <text class="label small" x="86" y="140" text-anchor="end" font-style="italic">Thier</text>
  <text class="label small" x="314" y="140" font-style="italic">Übermensch</text>

  <path class="rope" d="M 90 72 Q 200 96 310 72"/>
  <text class="small" x="200" y="66" text-anchor="middle" fill="#e2903a" font-style="italic">ein Seil … über einem Abgrunde</text>

  <circle class="walker" cx="180" cy="86" r="4"/>
  <text class="small" x="150" y="108" fill="#e2903a" font-style="italic">Übergang</text>
  <text class="muted small" x="150" y="120">Hinübergehende</text>

  <path class="down" d="M 240 90 L 240 150"/>
  <text class="small" x="246" y="150" fill="#e2903a" font-style="italic">Untergang</text>

  <text class="muted small" x="24" y="226">"eine Brücke und kein Zweck" · "Pfeile der Sehnsucht nach dem andern Ufer"</text>
  <text class="muted small" x="24" y="240">every motion is horizontal: across, over, under — none is up</text>

  <!-- right: super as above -->
  <rect class="panel" x="404" y="12" width="224" height="236" rx="6"/>
  <text class="tag" x="416" y="32" fill="#4c8dd6">super- as above: a rank</text>

  <rect class="pedestal" x="470" y="150" width="90" height="60" rx="4"/>
  <text class="label small" x="515" y="185" text-anchor="middle">man</text>

  <rect class="pedestal" x="480" y="80" width="70" height="40" rx="4"/>
  <text class="label small" x="515" y="104" text-anchor="middle">"superman"</text>

  <path class="up" d="M 590 200 L 590 90"/>
  <path class="up" d="M 585 96 L 590 88 L 595 96"/>
  <text class="small" x="598" y="150" fill="#4c8dd6">higher</text>

  <text class="muted small" x="416" y="226">a superior kind, standing on the human</text>
  <text class="muted small" x="416" y="240">no rope, no crossing, no going under</text>
</svg>

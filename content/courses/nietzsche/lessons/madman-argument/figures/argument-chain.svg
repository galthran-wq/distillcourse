<svg viewBox="0 0 640 430" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .box { fill: none; stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.2; }
    .gap { fill: none; stroke: #e2903a; stroke-width: 1.6; stroke-dasharray: 5 4; }
    .concl { fill: none; stroke: #4c8dd6; stroke-width: 2.4; }
    .arrow { stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.2; fill: none; }
    .tag { font-weight: 600; }
  </style>

  <!-- P1 -->
  <rect class="box" x="24" y="14" width="400" height="50" rx="5"/>
  <text class="label tag" x="36" y="34">P1</text>
  <text class="label" x="66" y="34">European values, the moral ones above all,</text>
  <text class="label" x="66" y="52">rested on belief in the Christian God</text>
  <text class="muted" x="440" y="34">GS 343: "built on it, leaned</text>
  <text class="muted" x="440" y="52">against it, grown into it"</text>

  <path class="arrow" d="M224 64 L224 76"/>

  <!-- P2 -->
  <rect class="box" x="24" y="78" width="400" height="50" rx="5"/>
  <text class="label tag" x="36" y="98">P2</text>
  <text class="label" x="66" y="98">That belief has collapsed among the educated:</text>
  <text class="label" x="66" y="116">the belief has "become unbelievable"</text>
  <text class="muted" x="440" y="98">GS 125: "we have killed him"</text>
  <text class="muted" x="440" y="116">GS 343: "unglaubwürdig"</text>

  <path class="arrow" d="M224 128 L224 140"/>

  <!-- P3 -->
  <rect class="box" x="24" y="142" width="400" height="50" rx="5"/>
  <text class="label tag" x="36" y="162">P3</text>
  <text class="label" x="66" y="162">What rests on a foundation falls</text>
  <text class="label" x="66" y="180">when the foundation is removed</text>
  <text class="muted" x="440" y="162">GS 125: sea, horizon, sun;</text>
  <text class="muted" x="440" y="180">GS 343: "must now collapse"</text>

  <path class="arrow" d="M224 192 L224 204"/>

  <!-- P4 -->
  <rect class="box" x="24" y="206" width="400" height="50" rx="5"/>
  <text class="label tag" x="36" y="226">P4</text>
  <text class="label" x="66" y="226">The fall arrives after a delay:</text>
  <text class="label" x="66" y="244">"the light of the stars needs time"</text>
  <text class="muted" x="440" y="226">GS 125: "I come too early"</text>
  <text class="muted" x="440" y="244">GS 108: the shadow in the cave</text>

  <path class="arrow" d="M224 256 L224 268"/>

  <!-- missing premise -->
  <rect class="gap" x="24" y="270" width="400" height="50" rx="5"/>
  <text x="36" y="290" fill="#e2903a" font-weight="600">P?</text>
  <text x="66" y="290" fill="#e2903a">No other foundation can carry the same values</text>
  <text x="66" y="308" fill="#e2903a">(not Kant, not utility, not "humanity")</text>
  <text class="muted" x="440" y="290">not stated in GS 125 or 343;</text>
  <text class="muted" x="440" y="308">asserted TI IX:5, argued GM III</text>

  <path class="arrow" d="M224 320 L224 332"/>
  <path class="arrow" d="M219 328 L224 334 L229 328"/>

  <!-- conclusion -->
  <rect class="concl" x="24" y="336" width="400" height="50" rx="5"/>
  <text x="36" y="356" fill="#4c8dd6" font-weight="600">C</text>
  <text class="label" x="66" y="356">European morality must fall,</text>
  <text class="label" x="66" y="374">and its heirs do not yet know it</text>
  <text class="muted" x="440" y="356">GS 343: "our whole</text>
  <text class="muted" x="440" y="374">European morality"</text>

  <text class="muted" x="320" y="416" text-anchor="middle">four stated premises, one unstated, one conclusion about morality</text>
</svg>

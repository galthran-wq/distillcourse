<svg viewBox="0 0 640 240" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .box { fill: none; stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.2; }
    .box-now { fill: none; stroke: #e2903a; stroke-width: 2.5; }
    .amber { fill: #e2903a; font-weight: 600; }
    .guide { stroke: currentColor; stroke-opacity: 0.4; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
  </style>
  <text class="label" x="320" y="20" text-anchor="middle" font-weight="600" font-size="13">three things that can happen to a belief</text>

  <!-- refuted -->
  <g transform="translate(16,36)">
    <rect class="box" x="0" y="0" width="192" height="100" rx="5"/>
    <text class="label" x="96" y="22" text-anchor="middle" font-weight="600">refuted</text>
    <text class="muted" x="96" y="44" text-anchor="middle">shown false</text>
    <text class="muted" x="96" y="66" text-anchor="middle" font-size="11">the ghost: no proof possible,</text>
    <text class="muted" x="96" y="80" text-anchor="middle" font-size="11">it could have left or be invisible</text>
  </g>
  <text class="muted" x="112" y="158" text-anchor="middle" font-size="11">what the atheist reading needs;</text>
  <text class="muted" x="112" y="172" text-anchor="middle" font-size="11">Daybreak §95: the counter-proof</text>
  <text class="muted" x="112" y="186" text-anchor="middle" font-size="11">"becomes superfluous"</text>

  <!-- suspended -->
  <g transform="translate(224,36)">
    <rect class="box" x="0" y="0" width="192" height="100" rx="5"/>
    <text class="label" x="96" y="22" text-anchor="middle" font-weight="600">suspended</text>
    <text class="muted" x="96" y="44" text-anchor="middle">truth and falsehood left open</text>
    <text class="muted" x="96" y="66" text-anchor="middle" font-size="11">the ghost: the room was searched,</text>
    <text class="muted" x="96" y="80" text-anchor="middle" font-size="11">nothing found, the question stays</text>
  </g>
  <text class="muted" x="320" y="158" text-anchor="middle" font-size="11">no section of The Gay Science</text>
  <text class="muted" x="320" y="172" text-anchor="middle" font-size="11">leaves the belief here</text>

  <!-- discredited -->
  <g transform="translate(432,36)">
    <rect class="box-now" x="0" y="0" width="192" height="100" rx="5"/>
    <text class="amber" x="96" y="22" text-anchor="middle">discredited</text>
    <text class="label" x="96" y="44" text-anchor="middle">unrefuted; its truth is no</text>
    <text class="label" x="96" y="58" text-anchor="middle">longer taken seriously</text>
    <text class="muted" x="96" y="80" text-anchor="middle" font-size="11">the ghost: she watched a horror</text>
    <text class="muted" x="96" y="94" text-anchor="middle" font-size="11">film; the belief is explained</text>
  </g>
  <text class="amber" x="528" y="158" text-anchor="middle" font-size="11">GS 343: unglaubwürdig geworden</text>
  <text class="label" x="528" y="172" text-anchor="middle" font-size="11">P2 is a claim of this kind,</text>
  <text class="label" x="528" y="186" text-anchor="middle" font-size="11">and so is C</text>

  <path class="guide" d="M16 146 L624 146"/>
  <text class="muted" x="320" y="222" text-anchor="middle">Reginster's three standings; the parable and Section 343 place the belief in the third</text>
</svg>

<svg viewBox="0 0 640 270" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .edifice { fill: none; stroke: currentColor; stroke-opacity: 0.7; stroke-width: 1.4; }
    .found { fill: #4c8dd6; fill-opacity: 0.85; }
    .found-gone { fill: none; stroke: #4c8dd6; stroke-width: 1.4; stroke-dasharray: 4 3; opacity: 0.6; }
    .fall { fill: none; stroke: #e2903a; stroke-width: 1.8; }
    .ground { stroke: currentColor; stroke-opacity: 0.4; stroke-width: 1; }
    .axis { stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.2; fill: none; }
  </style>

  <!-- panel 1: before -->
  <g transform="translate(20,20)">
    <text class="label" x="90" y="12" text-anchor="middle" font-weight="600">before</text>
    <rect class="edifice" x="30" y="40" width="120" height="70" rx="3"/>
    <text class="label" x="90" y="70" text-anchor="middle">European</text>
    <text class="label" x="90" y="86" text-anchor="middle">morality</text>
    <rect class="found" x="20" y="112" width="140" height="34" rx="3"/>
    <text x="90" y="128" text-anchor="middle" fill="#fff" font-size="11">belief in the</text>
    <text x="90" y="141" text-anchor="middle" fill="#fff" font-size="11">Christian God</text>
    <path class="ground" d="M0 150 L180 150"/>
  </g>

  <!-- panel 2: t = 0 -->
  <g transform="translate(230,20)">
    <text class="label" x="90" y="12" text-anchor="middle" font-weight="600">belief withdrawn (t = 0)</text>
    <rect class="edifice" x="30" y="40" width="120" height="70" rx="3"/>
    <text class="label" x="90" y="70" text-anchor="middle">European</text>
    <text class="label" x="90" y="86" text-anchor="middle">morality</text>
    <rect class="found-gone" x="20" y="112" width="140" height="34" rx="3"/>
    <text class="muted" x="90" y="133" text-anchor="middle" font-size="11">still standing</text>
    <path class="ground" d="M0 150 L180 150"/>
  </g>

  <!-- panel 3: t = delay -->
  <g transform="translate(440,20)">
    <text class="label" x="90" y="12" text-anchor="middle" font-weight="600">the fall (t = Δ)</text>
    <g transform="rotate(14 150 146)">
      <rect class="fall" x="30" y="76" width="120" height="70" rx="3"/>
      <text x="90" y="106" text-anchor="middle" fill="#e2903a">European</text>
      <text x="90" y="122" text-anchor="middle" fill="#e2903a">morality</text>
    </g>
    <path class="ground" d="M0 150 L180 150"/>
  </g>

  <!-- time axis -->
  <path class="axis" d="M40 200 L600 200"/>
  <path class="axis" d="M594 195 L600 200 L594 205"/>
  <path class="axis" d="M320 195 L320 205"/>
  <path class="axis" d="M530 195 L530 205"/>
  <text class="muted" x="320" y="220" text-anchor="middle">t = 0</text>
  <text class="muted" x="530" y="220" text-anchor="middle">t = Δ</text>
  <text class="muted" x="604" y="220" text-anchor="end">time</text>

  <text class="label" x="425" y="244" text-anchor="middle">Δ: "the light of the stars needs time" (GS 125);</text>
  <text class="label" x="425" y="260" text-anchor="middle">"caves for millennia yet, in which his shadow is shown" (GS 108)</text>
</svg>

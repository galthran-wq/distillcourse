<svg viewBox="0 0 640 250" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .wrong { fill: none; stroke: currentColor; stroke-opacity: 0.45; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .strike { stroke: currentColor; stroke-opacity: 0.7; stroke-width: 1.6; }
    .fact { fill: none; stroke: currentColor; stroke-opacity: 0.55; stroke-width: 1.2; }
    .bar { stroke: #e2903a; stroke-width: 4; }
    .arrow { stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.2; fill: none; }
  </style>

  <!-- the reading -->
  <g transform="translate(16,60)">
    <rect class="wrong" x="0" y="0" width="200" height="110" rx="5"/>
    <text class="muted" x="100" y="22" text-anchor="middle" font-weight="600">the reading</text>
    <text class="label" x="100" y="52" text-anchor="middle">"God is dead" is an</text>
    <text class="label" x="100" y="70" text-anchor="middle">argument that God</text>
    <text class="label" x="100" y="88" text-anchor="middle">does not exist</text>
    <path class="strike" d="M20 70 L180 70"/>
  </g>

  <path class="arrow" d="M224 115 L256 115"/>
  <path class="arrow" d="M250 110 L256 115 L250 120"/>
  <text class="muted" x="240" y="100" text-anchor="middle">cannot</text>
  <text class="muted" x="240" y="136" text-anchor="middle">hold</text>

  <!-- the sentences -->
  <g transform="translate(268,14)">
    <rect class="fact" x="0" y="0" width="356" height="62" rx="5"/>
    <path class="bar" d="M0 8 L0 54"/>
    <text class="label" x="14" y="22" font-weight="600">the listeners "nicht an Gott glaubten"</text>
    <text class="muted" x="14" y="40">the conclusion the reading attributes to the speech</text>
    <text class="muted" x="14" y="54">is the listeners' starting point</text>
  </g>
  <g transform="translate(268,88)">
    <rect class="fact" x="0" y="0" width="356" height="62" rx="5"/>
    <path class="bar" d="M0 8 L0 54"/>
    <text class="label" x="14" y="22" font-weight="600">every question is about consequence</text>
    <text class="muted" x="14" y="40">"with what water could we clean ourselves?":</text>
    <text class="muted" x="14" y="54">what follows from the loss, not whether it is real</text>
  </g>
  <g transform="translate(268,162)">
    <rect class="fact" x="0" y="0" width="356" height="62" rx="5"/>
    <path class="bar" d="M0 8 L0 54"/>
    <text class="label" x="14" y="22" font-weight="600">the one act: a Requiem aeternam deo</text>
    <text class="muted" x="14" y="40">a rite for a death sung in churches, "the tombs</text>
    <text class="muted" x="14" y="54">and sepulchres of God"; a proof would need no rite</text>
  </g>

  <text class="muted" x="320" y="242" text-anchor="middle">three sentences of GS 125 the atheist-manifesto reading has no place for</text>
</svg>

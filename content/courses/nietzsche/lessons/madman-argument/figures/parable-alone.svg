<svg viewBox="0 0 640 250" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .box { fill: none; stroke: currentColor; stroke-opacity: 0.55; stroke-width: 1.2; }
    .box-blue { fill: none; stroke: #4c8dd6; stroke-width: 2; }
    .box-c { fill: none; stroke: currentColor; stroke-opacity: 0.45; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .box-c2 { fill: none; stroke: #e2903a; stroke-width: 2; }
    .arrow { stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.2; fill: none; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .amber { fill: #e2903a; font-weight: 600; }
  </style>

  <!-- left column: 125 alone -->
  <text class="label" x="155" y="22" text-anchor="middle" font-weight="600">Section 125 alone (1882)</text>
  <g transform="translate(35,36)">
    <rect class="box" x="0" y="0" width="240" height="24" rx="4"/>
    <text class="label" x="120" y="16" text-anchor="middle">P2 · the belief has collapsed</text>
  </g>
  <g transform="translate(35,68)">
    <rect class="box" x="0" y="0" width="240" height="24" rx="4"/>
    <text class="label" x="120" y="16" text-anchor="middle">P3 · foundation gone, edifice falls</text>
  </g>
  <g transform="translate(35,100)">
    <rect class="box" x="0" y="0" width="240" height="24" rx="4"/>
    <text class="label" x="120" y="16" text-anchor="middle">P4 · after a delay</text>
  </g>
  <path class="arrow" d="M155 128 L155 150"/>
  <path class="arrow" d="M150 145 L155 150 L160 145"/>
  <g transform="translate(20,156)">
    <rect class="box-c" x="0" y="0" width="270" height="56" rx="5"/>
    <text class="muted" x="135" y="20" text-anchor="middle">C′ · something enormous is lost</text>
    <text class="muted" x="135" y="36" text-anchor="middle" font-size="11">(the sea, the horizon, the sun)</text>
    <text class="label" x="135" y="51" text-anchor="middle" font-size="11">a conclusion with no named subject</text>
  </g>

  <!-- divider -->
  <path class="arrow" d="M320 30 L320 220" stroke-dasharray="3 3" stroke-opacity="0.35"/>

  <!-- right column: with 343 -->
  <text class="label" x="485" y="22" text-anchor="middle" font-weight="600">with Section 343 (1887)</text>
  <g transform="translate(365,36)">
    <rect class="box-blue" x="0" y="0" width="240" height="24" rx="4"/>
    <text class="blue" x="120" y="16" text-anchor="middle">P1 · values rested on the belief</text>
  </g>
  <g transform="translate(365,68)">
    <rect class="box" x="0" y="0" width="240" height="24" rx="4"/>
    <text class="label" x="120" y="16" text-anchor="middle">P2 · P3 · P4 as before</text>
  </g>
  <text class="blue" x="485" y="112" text-anchor="middle" font-size="11">"built on it, leaned against it …</text>
  <text class="blue" x="485" y="126" text-anchor="middle" font-size="11">our whole European morality"</text>
  <path class="arrow" d="M485 132 L485 150"/>
  <path class="arrow" d="M480 145 L485 150 L490 145"/>
  <g transform="translate(350,156)">
    <rect class="box-c2" x="0" y="0" width="270" height="56" rx="5"/>
    <text class="amber" x="135" y="20" text-anchor="middle">C · European morality must fall,</text>
    <text class="amber" x="135" y="36" text-anchor="middle">and its heirs do not yet know it</text>
    <text class="label" x="135" y="51" text-anchor="middle" font-size="11">the subject named</text>
  </g>

  <text class="muted" x="320" y="240" text-anchor="middle">the premise that makes the conclusion about morality is five years younger than the parable</text>
</svg>

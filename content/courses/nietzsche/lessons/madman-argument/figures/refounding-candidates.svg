<svg viewBox="0 0 640 270" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .edifice { fill: none; stroke: currentColor; stroke-opacity: 0.7; stroke-width: 1.4; }
    .gone { fill: none; stroke: #4c8dd6; stroke-width: 1.4; stroke-dasharray: 5 4; }
    .cand { fill: none; stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .bar { stroke: #e2903a; stroke-width: 3; fill: none; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; }
    .arrow { stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.1; fill: none; }
  </style>

  <!-- the edifice -->
  <g transform="translate(200,16)">
    <rect class="edifice" x="0" y="0" width="240" height="56" rx="5"/>
    <text class="label" x="120" y="24" text-anchor="middle" font-weight="600">European morality</text>
    <text class="muted" x="120" y="42" text-anchor="middle">the precepts, still standing (P4)</text>
  </g>

  <!-- the withdrawn foundation -->
  <g transform="translate(200,82)">
    <rect class="gone" x="0" y="0" width="240" height="40" rx="4"/>
    <text class="blue" x="120" y="17" text-anchor="middle">belief in the Christian God</text>
    <text class="blue" x="120" y="33" text-anchor="middle" font-size="11">withdrawn (P2); it carried the precepts (P1)</text>
  </g>

  <!-- arrows down to candidates -->
  <path class="arrow" d="M240 122 L104 156"/>
  <path class="arrow" d="M320 122 L320 156"/>
  <path class="arrow" d="M400 122 L536 156"/>

  <!-- candidate footings -->
  <g transform="translate(24,158)">
    <rect class="cand" x="0" y="0" width="160" height="46" rx="4"/>
    <text class="label" x="80" y="19" text-anchor="middle">Kant: the moral law</text>
    <text class="muted" x="80" y="35" text-anchor="middle" font-size="11">binding on every rational being</text>
  </g>
  <g transform="translate(240,158)">
    <rect class="cand" x="0" y="0" width="160" height="46" rx="4"/>
    <text class="label" x="80" y="19" text-anchor="middle">utility</text>
    <text class="muted" x="80" y="35" text-anchor="middle" font-size="11">the greatest good of the many</text>
  </g>
  <g transform="translate(456,158)">
    <rect class="cand" x="0" y="0" width="160" height="46" rx="4"/>
    <text class="label" x="80" y="19" text-anchor="middle">shared humanity</text>
    <text class="muted" x="80" y="35" text-anchor="middle" font-size="11">held on human grounds alone</text>
  </g>

  <!-- the missing premise as a bar across all three -->
  <path class="bar" d="M24 216 L616 216"/>
  <text class="amber" x="320" y="236" text-anchor="middle">the missing premise: none of these can carry the same precepts</text>
  <text class="muted" x="320" y="254" text-anchor="middle" font-size="11">asserted in Twilight IX:5 ("nothing of any consequence left"); argued only in the Genealogy</text>
</svg>

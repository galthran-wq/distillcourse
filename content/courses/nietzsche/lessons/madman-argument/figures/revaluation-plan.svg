<svg viewBox="0 0 640 210" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .done { fill: #e2903a; fill-opacity: 0.16; stroke: #e2903a; stroke-width: 2; }
    .plan { fill: none; stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.2; stroke-dasharray: 5 4; }
  </style>
  <text class="label" x="320" y="20" text-anchor="middle" font-weight="600" font-size="13">"Revaluation of All Values": the plan of autumn 1888</text>

  <g transform="translate(16,40)">
    <rect class="done" x="0" y="0" width="144" height="120" rx="5"/>
    <text class="label" x="72" y="24" text-anchor="middle" font-weight="600">I · The Antichrist</text>
    <text class="muted" x="72" y="48" text-anchor="middle">attempt at a critique</text>
    <text class="muted" x="72" y="64" text-anchor="middle">of Christianity</text>
    <text x="72" y="100" text-anchor="middle" fill="#e2903a" font-weight="600">written, 1888</text>
  </g>
  <g transform="translate(172,40)">
    <rect class="plan" x="0" y="0" width="144" height="120" rx="5"/>
    <text class="label" x="72" y="24" text-anchor="middle" font-weight="600">II · The Free Spirit</text>
    <text class="muted" x="72" y="48" text-anchor="middle">critique of philosophy</text>
    <text class="muted" x="72" y="64" text-anchor="middle">as a nihilistic</text>
    <text class="muted" x="72" y="80" text-anchor="middle">movement</text>
    <text class="muted" x="72" y="100" text-anchor="middle">unwritten</text>
  </g>
  <g transform="translate(328,40)">
    <rect class="plan" x="0" y="0" width="144" height="120" rx="5"/>
    <text class="label" x="72" y="24" text-anchor="middle" font-weight="600">III · The Immoralist</text>
    <text class="muted" x="72" y="48" text-anchor="middle">critique of the most</text>
    <text class="muted" x="72" y="64" text-anchor="middle">fatal kind of</text>
    <text class="muted" x="72" y="80" text-anchor="middle">ignorance: morality</text>
    <text class="muted" x="72" y="100" text-anchor="middle">unwritten</text>
  </g>
  <g transform="translate(484,40)">
    <rect class="plan" x="0" y="0" width="140" height="120" rx="5"/>
    <text class="label" x="70" y="24" text-anchor="middle" font-weight="600">IV · Dionysus</text>
    <text class="muted" x="70" y="48" text-anchor="middle">philosophy of</text>
    <text class="muted" x="70" y="64" text-anchor="middle">eternal recurrence</text>
    <text class="muted" x="70" y="100" text-anchor="middle">unwritten</text>
  </g>

  <text class="muted" x="320" y="192" text-anchor="middle">three critiques and one doctrine; GS 125 states the problem the four books were to answer</text>
</svg>

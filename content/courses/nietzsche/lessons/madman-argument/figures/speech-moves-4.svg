<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .box { fill: none; stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.2; }
    .box-now { fill: none; stroke: #e2903a; stroke-width: 2.5; }
    .dim { opacity: 0.3; }
    .tag { fill: currentColor; }
    .tag-now { fill: #e2903a; font-weight: 600; }
  </style>
  <text class="label" x="320" y="20" text-anchor="middle" font-weight="600" font-size="13">GS 125 as five moves, each carrying a premise</text>

  <!-- move 1 -->
  <g transform="translate(16,36)">
    <rect class="box" x="0" y="0" width="112" height="118" rx="5"/>
    <text class="label" x="56" y="20" text-anchor="middle" font-weight="600">1 · the lantern</text>
    <text class="muted" x="56" y="44" text-anchor="middle">lit in bright</text>
    <text class="muted" x="56" y="60" text-anchor="middle">morning; the cry</text>
    <text class="label" x="56" y="80" text-anchor="middle">„Ich suche Gott!“</text>
    <text class="muted" x="56" y="100" text-anchor="middle">in a market of</text>
    <text class="muted" x="56" y="114" text-anchor="middle">unbelievers</text>
  </g>
  <g transform="translate(16,178)">
    <text class="tag" x="56" y="14" text-anchor="middle">P2: the listeners</text>
    <text class="tag" x="56" y="30" text-anchor="middle">do not believe</text>
  </g>

  <!-- move 2 -->
  <g transform="translate(140,36)">
    <rect class="box" x="0" y="0" width="112" height="118" rx="5"/>
    <text class="label" x="56" y="20" text-anchor="middle" font-weight="600">2 · the laughter</text>
    <text class="muted" x="56" y="44" text-anchor="middle">the crowd's jokes:</text>
    <text class="muted" x="56" y="60" text-anchor="middle">"is he hiding?"</text>
    <text class="muted" x="56" y="76" text-anchor="middle" font-size="11">"gone on a voyage?"</text>
    <text class="muted" x="56" y="92" text-anchor="middle">"emigrated?"</text>
  </g>
  <g transform="translate(140,178)">
    <text class="tag" x="56" y="14" text-anchor="middle">P2 confirmed: the</text>
    <text class="tag" x="56" y="30" text-anchor="middle">mockery treats God's</text>
    <text class="tag" x="56" y="46" text-anchor="middle">absence as settled</text>
  </g>

  <!-- move 3 -->
  <g transform="translate(264,36)">
    <rect class="box" x="0" y="0" width="112" height="118" rx="5"/>
    <text class="label" x="56" y="20" text-anchor="middle" font-weight="600">3 · the charge</text>
    <text class="label" x="56" y="50" text-anchor="middle">„Wir haben ihn</text>
    <text class="label" x="56" y="66" text-anchor="middle">getödtet, — ihr</text>
    <text class="label" x="56" y="82" text-anchor="middle">und ich!“</text>
  </g>
  <g transform="translate(264,178)">
    <text class="tag" x="56" y="14" text-anchor="middle">P2 as a deed with</text>
    <text class="tag" x="56" y="30" text-anchor="middle">agents: "you and I"</text>
  </g>

  <!-- move 4: current -->
  <g transform="translate(388,36)">
    <rect class="box-now" x="0" y="0" width="112" height="118" rx="5"/>
    <text class="label" x="56" y="20" text-anchor="middle" font-weight="600">4 · the questions</text>
    <text class="muted" x="56" y="44" text-anchor="middle">"drink up the sea"</text>
    <text class="muted" x="56" y="60" text-anchor="middle">"wipe away the</text>
    <text class="muted" x="56" y="76" text-anchor="middle">horizon"</text>
    <text class="muted" x="56" y="92" text-anchor="middle" font-size="11">"with what water</text>
    <text class="muted" x="56" y="108" text-anchor="middle" font-size="11">could we clean…?"</text>
  </g>
  <g transform="translate(388,178)">
    <text class="tag-now" x="56" y="14" text-anchor="middle">P1 + P3: what rested</text>
    <text class="tag-now" x="56" y="30" text-anchor="middle">on the belief goes</text>
    <text class="tag-now" x="56" y="46" text-anchor="middle">with it</text>
  </g>

  <!-- move 5 -->
  <g class="dim" transform="translate(512,36)">
    <rect class="box" x="0" y="0" width="112" height="118" rx="5"/>
    <text class="label" x="56" y="20" text-anchor="middle" font-weight="600">5 · the timing</text>
    <text class="muted" x="56" y="44" text-anchor="middle">lantern smashed;</text>
    <text class="label" x="56" y="66" text-anchor="middle">„Ich komme</text>
    <text class="label" x="56" y="82" text-anchor="middle">zu früh“</text>
    <text class="muted" x="56" y="100" text-anchor="middle" font-size="11">requiem in</text><text class="muted" x="56" y="113" text-anchor="middle" font-size="11">the churches</text>
  </g>

  <text class="muted" x="320" y="286" text-anchor="middle">frame 4 of 5: every question is about consequence, none about existence</text>
</svg>

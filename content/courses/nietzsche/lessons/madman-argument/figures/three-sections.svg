<svg viewBox="0 0 640 240" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .box { fill: none; stroke: currentColor; stroke-opacity: 0.55; stroke-width: 1.2; }
    .role { fill: #e2903a; font-weight: 600; }
    .link { stroke: currentColor; stroke-opacity: 0.4; stroke-width: 1.2; stroke-dasharray: 3 3; fill: none; }
  </style>

  <!-- GS 108 -->
  <g transform="translate(16,16)">
    <rect class="box" x="0" y="0" width="192" height="180" rx="5"/>
    <text class="label" x="96" y="22" text-anchor="middle" font-weight="600">GS 108 · 1882 · Book III</text>
    <text class="role" x="96" y="44" text-anchor="middle">announces</text>
    <text class="label" x="96" y="72" text-anchor="middle">„Gott ist todt“</text>
    <text class="muted" x="96" y="96" text-anchor="middle">first occurrence of the</text>
    <text class="muted" x="96" y="112" text-anchor="middle">sentence in the book</text>
    <text class="muted" x="96" y="140" text-anchor="middle">the Buddha's shadow:</text>
    <text class="muted" x="96" y="156" text-anchor="middle">"caves for millennia yet"</text>
  </g>

  <!-- GS 125 -->
  <g transform="translate(224,16)">
    <rect class="box" x="0" y="0" width="192" height="180" rx="5"/>
    <text class="label" x="96" y="22" text-anchor="middle" font-weight="600">GS 125 · 1882 · Book III</text>
    <text class="role" x="96" y="44" text-anchor="middle">dramatizes</text>
    <text class="label" x="96" y="72" text-anchor="middle">„Wir haben ihn getödtet“</text>
    <text class="muted" x="96" y="96" text-anchor="middle">the marketplace, the</text>
    <text class="muted" x="96" y="112" text-anchor="middle">questions of consequence,</text>
    <text class="muted" x="96" y="140" text-anchor="middle">„Ich komme zu früh“:</text>
    <text class="muted" x="96" y="156" text-anchor="middle">the delay</text>
  </g>

  <!-- GS 343 -->
  <g transform="translate(432,16)">
    <rect class="box" x="0" y="0" width="192" height="180" rx="5"/>
    <text class="label" x="96" y="22" text-anchor="middle" font-weight="600">GS 343 · 1887 · Book V</text>
    <text class="role" x="96" y="44" text-anchor="middle">states scope and tone</text>
    <text class="label" x="96" y="72" text-anchor="middle" font-size="11">„unsre ganze europäische Moral“</text>
    <text class="muted" x="96" y="96" text-anchor="middle">the belief "unglaubwürdig":</text>
    <text class="muted" x="96" y="112" text-anchor="middle">unbelievable, not refuted</text>
    <text class="muted" x="96" y="140" text-anchor="middle">"Heiterkeit": free spirits</text>
    <text class="muted" x="96" y="156" text-anchor="middle">feel "a new dawn"</text>
  </g>

  <path class="link" d="M208 106 L224 106"/>
  <path class="link" d="M416 106 L432 106"/>
  <text class="muted" x="320" y="226" text-anchor="middle">one claim across three sections and five years; the edition of 1887 added Book V</text>
</svg>

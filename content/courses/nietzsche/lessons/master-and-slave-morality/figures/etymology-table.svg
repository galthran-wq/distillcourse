<svg viewBox="0 0 640 318" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tag { font-weight: 600; }
    .rule { stroke: currentColor; stroke-opacity: 0.35; stroke-width: 1; }
    .head { stroke: currentColor; stroke-opacity: 0.7; stroke-width: 1.2; }
    .holds { fill: #5aa46a; font-weight: 600; }
    .cont { fill: #e2903a; font-weight: 600; }
    .rej { fill: currentColor; opacity: 0.55; font-weight: 600; }
  </style>

  <text class="tag" x="16" y="22">The etymologies of I:4–5: rank word, Nietzsche's gloss, modern verdict</text>

  <text class="tag small" x="16" y="48">language</text>
  <text class="tag small" x="86" y="48">value word ← rank word</text>
  <text class="tag small" x="262" y="48">Nietzsche's gloss (I:4–5)</text>
  <text class="tag small" x="466" y="48">grade (this course)</text>
  <path class="head" d="M 16 54 L 624 54"/>

  <!-- row 1 -->
  <text class="label small" x="16" y="74">German</text>
  <text class="label small" x="86" y="74">schlecht = schlicht</text>
  <text class="label small" x="262" y="74">"the plain man", shift c. 1618–48</text>
  <text class="holds small" x="466" y="74">holds; shift redated</text>
  <path class="rule" d="M 16 82 L 624 82"/>

  <!-- row 2 -->
  <text class="label small" x="16" y="102">Latin</text>
  <text class="label small" x="86" y="102">bonus ← duonus</text>
  <text class="label small" x="262" y="102">"the warrior" (duo, duellum)</text>
  <text class="cont small" x="466" y="102">form holds, gloss fails</text>
  <path class="rule" d="M 16 110 L 624 110"/>

  <!-- row 3 -->
  <text class="label small" x="16" y="130">Greek</text>
  <text class="label small" x="86" y="130">kakos, deilos (vs agathos)</text>
  <text class="label small" x="262" y="130">"the coward" underlined</text>
  <text class="cont small" x="466" y="130">deilos holds, kakos open</text>
  <path class="rule" d="M 16 138 L 624 138"/>

  <!-- row 4 -->
  <text class="label small" x="16" y="158">Greek</text>
  <text class="label small" x="86" y="158">esthlos (Theognis)</text>
  <text class="label small" x="262" y="158">"one who is" → truthful → noble</text>
  <text class="cont small" x="466" y="158">unconfirmed</text>
  <path class="rule" d="M 16 166 L 624 166"/>

  <!-- row 5 -->
  <text class="label small" x="16" y="186">Gaelic</text>
  <text class="label small" x="86" y="186">fin (Fin-Gal)</text>
  <text class="label small" x="262" y="186">"the blond", vs dark natives</text>
  <text class="cont small" x="466" y="186">"fair" holds, use fails</text>
  <path class="rule" d="M 16 194 L 624 194"/>

  <!-- row 6 -->
  <text class="label small" x="16" y="214">Latin</text>
  <text class="label small" x="86" y="214">malus ~ melas</text>
  <text class="label small" x="262" y="214">"the dark-haired", pre-Aryan</text>
  <text class="rej small" x="466" y="214">rejected</text>
  <path class="rule" d="M 16 222 L 624 222"/>

  <!-- row 7 -->
  <text class="label small" x="16" y="242">German</text>
  <text class="label small" x="86" y="242">gut ~ Goths, "godly"</text>
  <text class="label small" x="262" y="242">grounds "do not belong here"</text>
  <text class="rej small" x="466" y="242">rejected</text>
  <path class="head" d="M 16 250 L 624 250"/>

  <text class="muted small" x="16" y="272">green: the derivation stands in a modern dictionary (DWDS, Wiktionary)</text>
  <text class="muted small" x="16" y="286">amber: the form or the meaning stands, Nietzsche's gloss does not; grey: no modern support</text>
  <text class="muted small" x="16" y="300">the premise needs only "rank words became value words in several languages": one green row carries it</text>
</svg>

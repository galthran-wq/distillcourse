<svg viewBox="0 0 640 310" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tag { font-weight: 600; }
    .ha { fill: none; stroke: #4c8dd6; stroke-width: 1.6; }
    .gm { fill: none; stroke: #e2903a; stroke-width: 2; }
    .rule { stroke: currentColor; stroke-opacity: 0.35; stroke-width: 1; }
    .hot { fill: #e2903a; fill-opacity: 0.12; stroke: none; }
  </style>

  <text class="tag small" x="16" y="22">a decade apart</text>
  <text class="tag" x="150" y="22" fill="#4c8dd6">HA I §45 (1878)</text>
  <text class="tag" x="400" y="22" fill="#e2903a">GM I:2–11 (1887)</text>
  <rect class="ha" x="140" y="30" width="236" height="256" rx="6"/>
  <rect class="gm" x="390" y="30" width="234" height="256" rx="6"/>

  <!-- row: the two codes -->
  <text class="tag small" x="16" y="56">two codes</text>
  <text class="label small" x="150" y="50">"the ruling races and castes"</text>
  <text class="label small" x="150" y="64">and "the subjugated, the powerless"</text>
  <text class="label small" x="400" y="50">noble: good / bad (schlecht)</text>
  <text class="label small" x="400" y="64">slave: good / evil (böse)</text>
  <path class="rule" d="M 16 74 L 624 74"/>

  <!-- row: who is good -->
  <text class="tag small" x="16" y="98">who is "good"</text>
  <text class="label small" x="150" y="92">whoever "has power to requite good</text>
  <text class="label small" x="150" y="106">with good and evil with evil"</text>
  <text class="label small" x="400" y="92">the noble, of themselves, out of</text>
  <text class="label small" x="400" y="106">the pathos of distance — first</text>
  <path class="rule" d="M 16 116 L 624 116"/>

  <!-- row: who is bad / evil -->
  <text class="tag small" x="16" y="140">who is "bad"</text>
  <text class="label small" x="150" y="134">"whoever is powerless and cannot</text>
  <text class="label small" x="150" y="148">requite" — "a quantity, like dust"</text>
  <text class="label small" x="400" y="134">bad: the low, an afterthought;</text>
  <text class="label small" x="400" y="148">evil: the noble, coined first</text>
  <path class="rule" d="M 16 158 L 624 158"/>

  <!-- row: added -->
  <text class="tag small" x="16" y="182">mechanism</text>
  <text class="label small" x="150" y="176">none: for the powerless "every</text>
  <text class="label small" x="150" y="190">other man is hostile", even a god</text>
  <text class="label small" x="400" y="176">the priestly caste (I:6–7) and</text>
  <text class="label small" x="400" y="190">ressentiment (I:10) — added</text>
  <path class="rule" d="M 16 200 L 624 200"/>

  <!-- row: present morality (changed) -->
  <rect class="hot" x="16" y="208" width="608" height="52" rx="4"/>
  <text class="tag small" x="16" y="228">our morality</text>
  <text class="tag small" x="16" y="242">descends from</text>
  <text class="label small" x="150" y="228">"the foundation laid by ruling</text>
  <text class="label small" x="150" y="242">races and castes"</text>
  <text class="label small" x="400" y="228">the slaves' code: the revolt "has</text>
  <text class="label small" x="400" y="242">achieved victory" (I:7) — reversed</text>

  <text class="muted small" x="16" y="300">same typology in both; the 1887 text adds a mechanism and reverses the verdict on which code Europe inherited</text>
</svg>

<svg viewBox="0 0 640 240" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tag { font-weight: 600; }
    .band { fill: none; stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.2; }
    .dist { stroke: #e2903a; stroke-width: 2; fill: none; }
  </style>
  <text class="tag" x="16" y="22">frame 1 of 3 — the felt difference of rank</text>

  <rect class="band" x="200" y="40" width="424" height="56" rx="6"/>
  <text class="label" x="212" y="62">a ruling caste: "the noble, the powerful, the higher-placed"</text>
  <text class="muted small" x="212" y="82">(no word yet)</text>

  <rect class="band" x="200" y="164" width="424" height="56" rx="6"/>
  <text class="label" x="212" y="186">an "under" (ein Unten): "the low, the common, the plebeian"</text>
  <text class="muted small" x="212" y="206">(no word yet)</text>

  <path class="dist" d="M 178 44 L 178 216"/>
  <path class="dist" d="M 172 52 L 178 44 L 184 52"/>
  <path class="dist" d="M 172 208 L 178 216 L 184 208"/>
  <text class="tag small" x="16" y="124" fill="#e2903a">pathos of distance</text>
  <text class="muted small" x="16" y="140">Pathos der Distanz, I:2:</text>
  <text class="muted small" x="16" y="154">"the chronic and dominant</text>
  <text class="muted small" x="16" y="168">feeling of a higher ruling</text>
  <text class="muted small" x="16" y="182">kind toward a lower kind"</text>
</svg>

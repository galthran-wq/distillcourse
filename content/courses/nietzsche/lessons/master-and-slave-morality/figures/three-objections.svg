<svg viewBox="0 0 640 262" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tag { font-weight: 600; }
    .eng { fill: none; stroke: #4c8dd6; stroke-width: 1.6; }
    .step { fill: none; stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.2; }
    .arrow { stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.4; fill: none; }
    .obj { fill: none; stroke: #e2903a; stroke-width: 1.8; }
    .hit { stroke: #e2903a; stroke-width: 1.6; fill: none; stroke-dasharray: 3 3; }
  </style>

  <!-- the English chain -->
  <rect class="eng" x="16" y="16" width="290" height="226" rx="6"/>
  <text class="tag" x="28" y="36" fill="#4c8dd6">the English derivation (I:2, the "decree")</text>

  <rect class="step" x="28" y="52" width="266" height="26" rx="4"/>
  <text class="label small" x="161" y="69" text-anchor="middle">1  an unegoistic act is useful to its recipients</text>
  <path class="arrow" d="M 161 78 L 161 90"/>
  <rect class="step" x="28" y="90" width="266" height="26" rx="4"/>
  <text class="label small" x="161" y="107" text-anchor="middle">2  the recipients praise it and call it "good"</text>
  <path class="arrow" d="M 161 116 L 161 128"/>
  <rect class="step" x="28" y="128" width="266" height="26" rx="4"/>
  <text class="label small" x="161" y="145" text-anchor="middle">3  the praise's origin is forgotten; habit remains</text>
  <path class="arrow" d="M 161 154 L 161 166"/>
  <rect class="step" x="28" y="166" width="266" height="26" rx="4"/>
  <text class="label small" x="161" y="183" text-anchor="middle">4  the act is felt as good in itself (the "error")</text>
  <text class="muted small" x="28" y="214">utility, forgetting, habit, error:</text>
  <text class="muted small" x="28" y="228">"the basis of a system of values"</text>

  <!-- three objections, each bound to the step it attacks -->
  <path class="hit" d="M 294 103 L 336 103"/>
  <rect class="obj" x="336" y="84" width="288" height="40" rx="5"/>
  <text class="tag small" x="346" y="100" fill="#e2903a">(a) wrong speaker — I:2</text>
  <text class="label small" x="346" y="115">"the good themselves" coined it, not the recipients</text>

  <path class="hit" d="M 294 141 L 336 141"/>
  <rect class="obj" x="336" y="130" width="288" height="40" rx="5"/>
  <text class="tag small" x="346" y="146" fill="#e2903a">(b) forgetting impossible — I:3</text>
  <text class="label small" x="346" y="161">a use "experienced every day" cannot fade</text>

  <path class="hit" d="M 294 179 L 336 179"/>
  <rect class="obj" x="336" y="176" width="288" height="40" rx="5"/>
  <text class="tag small" x="346" y="192" fill="#e2903a">(c) present use read as origin — II:12</text>
  <text class="label small" x="346" y="207">step 4 is today's sense; the rule bars reading it back</text>

  <text class="muted small" x="336" y="236">each objection is bound to one step;</text>
  <text class="muted small" x="336" y="250">(a) is the one the treatise builds on</text>
</svg>

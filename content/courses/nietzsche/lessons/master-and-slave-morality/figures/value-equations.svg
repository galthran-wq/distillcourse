<svg viewBox="0 0 640 236" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tag { font-weight: 600; }
    .noble { fill: none; stroke: #e2903a; stroke-width: 2; }
    .slave { fill: none; stroke: #4c8dd6; stroke-width: 1.6; }
    .cell { fill: none; stroke: currentColor; stroke-opacity: 0.45; stroke-width: 1.2; }
    .arrow { stroke: currentColor; stroke-opacity: 0.7; stroke-width: 2; fill: none; }
  </style>

  <text class="tag" x="16" y="22" fill="#e2903a">the aristocratic equation (GM I:7; the vocabulary of BGE 260)</text>
  <rect class="noble" x="16" y="32" width="608" height="44" rx="6"/>
  <text class="label" x="28" y="59">good  =  noble  =  powerful  =  beautiful  =  happy  =  beloved of the gods</text>
  <text class="muted small" x="28" y="90">"bad" attached afterwards to whoever lacks these: the low, the common, the cowardly, the liar (BGE 260)</text>

  <path class="arrow" d="M 320 98 L 320 134"/>
  <path class="arrow" d="M 313 126 L 320 134 L 327 126"/>
  <text class="tag small" x="332" y="112">the inversion: "with a terrifying logic" (I:7)</text>
  <text class="muted small" x="332" y="126">the slave revolt in morality — next lesson</text>

  <text class="tag" x="16" y="154" fill="#4c8dd6">the contrary equation (GM I:7, quoted)</text>
  <rect class="slave" x="16" y="164" width="608" height="44" rx="6"/>
  <text class="label" x="28" y="191">good  =  wretched  =  poor  =  powerless  =  lowly  =  suffering  =  pious  =  blessed</text>
  <text class="muted small" x="28" y="226">and "you, the noble and powerful, are to all eternity the evil, the cruel, the godless, the damned"</text>
</svg>

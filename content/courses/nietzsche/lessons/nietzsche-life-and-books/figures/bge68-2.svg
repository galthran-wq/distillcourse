<svg viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .mem { fill: #4c8dd6; }
    .pri { fill: #e2903a; }
    .guide { stroke: currentColor; stroke-dasharray: 3 3; opacity: 0.5; fill: none; }
  </style>
  <defs>
    <marker id="arrow-b" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4c8dd6"/></marker>
    <marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e2903a"/></marker>
  </defs>
  <text class="mem" x="300" y="28" text-anchor="middle">“I did that,” says my memory.</text>
  <text class="pri" x="300" y="49" text-anchor="middle">“I cannot have done that,” says my pride, and remains inexorable.</text>
  <text class="label" x="300" y="70" text-anchor="middle">Eventually — the memory yields.</text>
  <rect x="20" y="98" width="164" height="54" rx="5" fill="#4c8dd6" fill-opacity="0.15" stroke="#4c8dd6"/>
  <text class="label" x="102" y="120" text-anchor="middle" font-weight="600">memory</text>
  <text class="muted" x="102" y="139" text-anchor="middle">reports what happened</text>
  <rect x="416" y="98" width="164" height="54" rx="5" fill="#e2903a" fill-opacity="0.15" stroke="#e2903a"/>
  <text class="label" x="498" y="120" text-anchor="middle" font-weight="600">pride</text>
  <text class="muted" x="498" y="139" text-anchor="middle">has a stake in who I am</text>
</svg>

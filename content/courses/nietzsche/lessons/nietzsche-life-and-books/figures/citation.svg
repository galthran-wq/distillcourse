<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .note { fill: currentColor; font-size: 12px; }
    .chip { fill: #4c8dd6; fill-opacity: 0.15; stroke: #4c8dd6; }
    .chipwp { fill: #e2903a; fill-opacity: 0.18; stroke: #e2903a; }
  </style>
  <rect class="chip" x="20" y="12" width="34" height="26" rx="4"/>
  <text class="label" x="37" y="30" text-anchor="middle" font-weight="600">GS</text>
  <text class="muted" x="37" y="53" text-anchor="middle">book</text>
  <rect class="chip" x="60" y="12" width="50" height="26" rx="4"/>
  <text class="label" x="85" y="30" text-anchor="middle" font-weight="600">125</text>
  <text class="muted" x="85" y="53" text-anchor="middle">section</text>
  <text class="note" x="430" y="25">section numbers are the same</text>
  <text class="note" x="430" y="41">in every edition and translation</text>
  <rect class="chip" x="20" y="76" width="34" height="26" rx="4"/>
  <text class="label" x="37" y="94" text-anchor="middle" font-weight="600">GM</text>
  <text class="muted" x="37" y="117" text-anchor="middle">book</text>
  <rect class="chip" x="60" y="76" width="40" height="26" rx="4"/>
  <text class="label" x="80" y="94" text-anchor="middle" font-weight="600">III</text>
  <text class="muted" x="80" y="117" text-anchor="middle">essay</text>
  <rect class="chip" x="106" y="76" width="50" height="26" rx="4"/>
  <text class="label" x="131" y="94" text-anchor="middle" font-weight="600">27</text>
  <text class="muted" x="131" y="117" text-anchor="middle">section</text>
  <text class="note" x="430" y="89">a book in parts: the part</text>
  <text class="note" x="430" y="105">comes before the section</text>
  <rect class="chip" x="20" y="140" width="34" height="26" rx="4"/>
  <text class="label" x="37" y="158" text-anchor="middle" font-weight="600">TI</text>
  <text class="muted" x="37" y="181" text-anchor="middle">book</text>
  <rect class="chip" x="60" y="140" width="63" height="26" rx="4"/>
  <text class="label" x="92" y="158" text-anchor="middle" font-weight="600">Maxims</text>
  <text class="muted" x="92" y="181" text-anchor="middle">chapter</text>
  <rect class="chip" x="129" y="140" width="50" height="26" rx="4"/>
  <text class="label" x="154" y="158" text-anchor="middle" font-weight="600">26</text>
  <text class="muted" x="154" y="181" text-anchor="middle">section</text>
  <text class="note" x="430" y="153">chapters numbered afresh:</text>
  <text class="note" x="430" y="169">name the chapter</text>
  <rect class="chip" x="20" y="204" width="103" height="26" rx="4"/>
  <text class="label" x="71" y="222" text-anchor="middle" font-weight="600">notebook 38</text>
  <text class="muted" x="71" y="245" text-anchor="middle">manuscript</text>
  <rect class="chip" x="129" y="204" width="56" height="26" rx="4"/>
  <text class="label" x="157" y="222" text-anchor="middle" font-weight="600">[12]</text>
  <text class="muted" x="157" y="245" text-anchor="middle">fragment</text>
  <rect class="chip" x="191" y="204" width="127" height="26" rx="4"/>
  <text class="label" x="254" y="222" text-anchor="middle" font-weight="600">June–July 1885</text>
  <text class="muted" x="254" y="245" text-anchor="middle">date</text>
  <rect class="chip" x="324" y="204" width="63" height="26" rx="4"/>
  <text class="label" x="355" y="222" text-anchor="middle" font-weight="600">unpub.</text>
  <text class="muted" x="355" y="245" text-anchor="middle">status</text>
  <text class="note" x="430" y="217">notebooks numbered in time</text>
  <text class="note" x="430" y="233">order; always say unpublished</text>
  <rect class="chipwp" x="20" y="268" width="74" height="26" rx="4"/>
  <text class="label" x="57" y="286" text-anchor="middle" font-weight="600">WP</text>
  <text class="muted" x="57" y="309" text-anchor="middle">compilation</text>
  <rect class="chipwp" x="100" y="268" width="80" height="26" rx="4"/>
  <text class="label" x="140" y="286" text-anchor="middle" font-weight="600">1067</text>
  <text class="muted" x="140" y="309" text-anchor="middle">editors' no.</text>
  <text class="note" x="430" y="281">a place in the 1906 arrangement,</text>
  <text class="note" x="430" y="297">not a section he numbered</text>
</svg>

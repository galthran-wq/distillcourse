<svg viewBox="0 0 620 342" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .rung { fill: #4c8dd6; fill-opacity: 0.16; stroke: #4c8dd6; }
    .wp { fill: #e2903a; fill-opacity: 0.18; stroke: #e2903a; }
    .guide { stroke: currentColor; stroke-dasharray: 3 3; opacity: 0.55; fill: none; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e2903a"/></marker>
  </defs>

  <!-- weight axis -->
  <line x1="30" y1="300" x2="30" y2="30" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <text class="muted" x="22" y="165" text-anchor="middle" transform="rotate(-90 22 165)">weight as evidence of his view</text>

  <!-- the five kinds -->
  <rect class="rung" x="50" y="30" width="290" height="44" rx="4"/>
  <text class="label" x="62" y="49" font-weight="600">1  books he published</text>
  <text class="muted" x="62" y="66">BT to CW; TI, in press at the collapse</text>

  <rect class="rung" x="50" y="84" width="290" height="44" rx="4"/>
  <text class="label" x="62" y="103" font-weight="600">2  private print</text>
  <text class="muted" x="62" y="120">Z IV, 1885: 40 copies, 7 given to friends</text>

  <rect class="rung" x="50" y="138" width="290" height="44" rx="4"/>
  <text class="label" x="62" y="157" font-weight="600">3  finished for print, not yet printed</text>
  <text class="muted" x="62" y="174">A, EH, NcW, all 1888</text>

  <rect class="rung" x="50" y="192" width="290" height="44" rx="4" stroke-dasharray="4 3"/>
  <text class="label" x="62" y="211" font-weight="600">4  early writings he kept back</text>
  <text class="muted" x="62" y="228">the Basel years, e.g. the essay on truth, 1873</text>

  <rect class="rung" x="50" y="246" width="290" height="44" rx="4" stroke-dasharray="4 3"/>
  <text class="label" x="62" y="265" font-weight="600">5  notebook fragments</text>
  <text class="muted" x="62" y="282">e.g. notebook 38[12], June–July 1885</text>

  <!-- notes quarried for books -->
  <path class="guide" d="M342 262 C 392 230, 392 80, 344 54" marker-end="url(#arr)"/>
  <text class="muted" x="384" y="150">he revised</text>
  <text class="muted" x="384" y="164">notes into books</text>

  <!-- the compilation -->
  <path d="M342 276 C 400 292, 430 292, 456 278" stroke="#e2903a" stroke-width="1.5" fill="none" marker-end="url(#arr-a)"/>
  <rect class="wp" x="470" y="226" width="130" height="10" rx="2"/>
  <rect class="wp" x="464" y="238" width="136" height="10" rx="2"/>
  <rect class="wp" x="474" y="250" width="124" height="10" rx="2"/>
  <rect class="wp" x="462" y="262" width="138" height="10" rx="2"/>
  <rect class="wp" x="468" y="274" width="132" height="10" rx="2"/>
  <text class="label" x="532" y="214" text-anchor="middle" font-weight="600">WP, 1901 / 1906</text>
  <text class="muted" x="532" y="302" text-anchor="middle">notes picked and ordered</text>
  <text class="muted" x="532" y="315" text-anchor="middle">by the editors, under a plan</text>
  <text class="muted" x="532" y="328" text-anchor="middle">he had discarded</text>
</svg>

<svg viewBox="0 0 560 440" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .prof { fill: #4c8dd6; }
    .wand { fill: #e2903a; }
    .late { fill: currentColor; opacity: 0.45; }
    .guide { stroke: currentColor; stroke-dasharray: 3 3; opacity: 0.5; fill: none; }
  </style>

  <g transform="translate(60,0)">
  <!-- positions projected from latitude and longitude; no borders drawn -->

  <!-- Saxony and Thuringia: birth, school, university -->
  <circle class="prof" cx="233" cy="32" r="4"/>
  <circle class="prof" cx="225" cy="35" r="4"/>
  <circle class="prof" cx="239" cy="29" r="4"/>
  <text class="label" x="252" y="26">Röcken, Naumburg, Pforta, Leipzig</text>
  <text class="muted" x="252" y="40">1844–1869: birth, school, university</text>
  <circle class="late" cx="214" cy="41" r="4"/>
  <circle class="late" cx="220" cy="43" r="4"/>
  <path class="guide" d="M214 47 L200 64"/>
  <text class="muted" x="200" y="76" text-anchor="end">Jena, Weimar: 1889–1900</text>

  <!-- Bonn -->
  <circle class="prof" cx="114" cy="50" r="4"/>
  <text class="label" x="106" y="46" text-anchor="end">Bonn</text>
  <text class="muted" x="106" y="59" text-anchor="end">1864–65</text>

  <!-- Basel and Tribschen -->
  <circle class="prof" cx="126" cy="157" r="4"/>
  <text class="label" x="117" y="155" text-anchor="end">Basel</text>
  <text class="muted" x="117" y="168" text-anchor="end">professor 1869–79</text>
  <circle class="prof" cx="143" cy="175" r="4"/>
  <text class="label" x="152" y="172">Tribschen, near Lucerne</text>
  <text class="muted" x="152" y="185">Wagner's house, 1869–72</text>

  <!-- Sils Maria -->
  <circle class="wand" cx="177" cy="196" r="4"/>
  <text class="label" x="186" y="206">Sils Maria</text>
  <text class="muted" x="186" y="219">summers 1881–88</text>

  <!-- Turin -->
  <circle class="wand" cx="128" cy="242" r="4"/>
  <text class="label" x="119" y="240" text-anchor="end">Turin</text>
  <text class="muted" x="119" y="253" text-anchor="end">1888; collapse, Jan 1889</text>

  <!-- Genoa and Rapallo -->
  <circle class="wand" cx="157" cy="264" r="4"/>
  <circle class="wand" cx="164" cy="266" r="4"/>
  <text class="label" x="174" y="268">Genoa, Rapallo</text>
  <text class="muted" x="174" y="281">winters 1880–83</text>

  <!-- Nice -->
  <circle class="wand" cx="118" cy="289" r="4"/>
  <text class="label" x="109" y="292" text-anchor="end">Nice</text>
  <text class="muted" x="109" y="305" text-anchor="end">winters 1883–88</text>

  <!-- Sorrento -->
  <circle class="prof" cx="286" cy="393" r="4"/>
  <text class="label" x="296" y="391">Sorrento, near Naples</text>
  <text class="muted" x="296" y="404">on leave, winter 1876–77</text>

  <!-- scale bar: 34 px per degree of latitude, 200 km = 61 px -->
  <line x1="24" y1="420" x2="85" y2="420" stroke="currentColor" stroke-width="1.5"/>
  <line x1="24" y1="416" x2="24" y2="424" stroke="currentColor"/>
  <line x1="85" y1="416" x2="85" y2="424" stroke="currentColor"/>
  <text class="muted" x="54" y="412" text-anchor="middle">200 km</text>

  <!-- legend -->
  <circle class="prof" cx="300" cy="120" r="4"/>
  <text class="label" x="310" y="124">student and professor</text>
  <circle class="wand" cx="300" cy="140" r="4"/>
  <text class="label" x="310" y="144">wanderer, 1879–1888</text>
  <circle class="late" cx="300" cy="160" r="4"/>
  <text class="label" x="310" y="164">invalid, 1889–1900</text>
  </g>
</svg>

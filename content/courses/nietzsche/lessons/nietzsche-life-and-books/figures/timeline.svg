<svg viewBox="0 0 640 230" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .tick { stroke: currentColor; stroke-width: 1; }
    .guide { stroke: currentColor; stroke-dasharray: 3 3; opacity: 0.5; }
    .p1 { fill: #4c8dd6; }
    .p2 { fill: #e2903a; }
    .p3 { fill: #5aa46a; }
  </style>

  <!-- events above the bands -->
  <line class="guide" x1="60" y1="20" x2="60" y2="78"/>
  <text class="label" x="64" y="16">1869 Basel chair, aged 24</text>
  <line class="guide" x1="260" y1="37" x2="260" y2="44"/><line class="guide" x1="260" y1="66" x2="260" y2="78"/>
  <text class="label" x="264" y="33">1879 resigns, pensioned</text>
  <line class="guide" x1="460" y1="20" x2="460" y2="78"/>
  <text class="label" x="456" y="16" text-anchor="end">Jan 1889 collapse, Turin, aged 44</text>

  <!-- the three periods -->
  <rect class="p1" x="60" y="44" width="160" height="22" rx="3" fill-opacity="0.3"/>
  <text class="label" x="140" y="59" text-anchor="middle" font-weight="600">1 · the professor</text>
  <rect class="p2" x="240" y="44" width="100" height="22" rx="3" fill-opacity="0.3"/>
  <text class="label" x="290" y="59" text-anchor="middle" font-weight="600">2 · free spirit</text>
  <rect class="p3" x="340" y="44" width="120" height="22" rx="3" fill-opacity="0.3"/>
  <text class="label" x="400" y="59" text-anchor="middle" font-weight="600">3 · mature works</text>

  <!-- axis 1868-1889, 20 px per year -->
  <line class="tick" x1="40" y1="78" x2="470" y2="78"/>
  <g class="tick">
    <line x1="40" y1="75" x2="40" y2="81"/><line x1="60" y1="75" x2="60" y2="81"/>
    <line x1="80" y1="74" x2="80" y2="82"/><line x1="100" y1="75" x2="100" y2="81"/>
    <line x1="120" y1="75" x2="120" y2="81"/><line x1="140" y1="75" x2="140" y2="81"/>
    <line x1="160" y1="75" x2="160" y2="81"/><line x1="180" y1="74" x2="180" y2="82"/>
    <line x1="200" y1="75" x2="200" y2="81"/><line x1="220" y1="75" x2="220" y2="81"/>
    <line x1="240" y1="75" x2="240" y2="81"/><line x1="260" y1="75" x2="260" y2="81"/>
    <line x1="280" y1="74" x2="280" y2="82"/><line x1="300" y1="75" x2="300" y2="81"/>
    <line x1="320" y1="75" x2="320" y2="81"/><line x1="340" y1="75" x2="340" y2="81"/>
    <line x1="360" y1="75" x2="360" y2="81"/><line x1="380" y1="74" x2="380" y2="82"/>
    <line x1="400" y1="75" x2="400" y2="81"/><line x1="420" y1="75" x2="420" y2="81"/>
    <line x1="440" y1="75" x2="440" y2="81"/><line x1="460" y1="75" x2="460" y2="81"/>
  </g>
  <text class="muted" x="80" y="94" text-anchor="middle">1870</text>
  <text class="muted" x="180" y="94" text-anchor="middle">1875</text>
  <text class="muted" x="280" y="94" text-anchor="middle">1880</text>
  <text class="muted" x="380" y="94" text-anchor="middle">1885</text>
  <text class="muted" x="40" y="118">b. 1844</text>

  <!-- books, row 1 (y 118) -->
  <line class="tick" x1="120" y1="81" x2="120" y2="106"/>
  <text class="label" x="120" y="118" text-anchor="middle">BT</text>
  <path class="tick" fill="none" d="M240 106 V100 H280 V106"/>
  <line class="tick" x1="260" y1="81" x2="260" y2="100"/>
  <text class="label" x="260" y="118" text-anchor="middle">HH</text>
  <line class="tick" x1="320" y1="81" x2="320" y2="106"/>
  <text class="label" x="320" y="118" text-anchor="middle">GS</text>
  <line class="tick" x1="400" y1="81" x2="400" y2="106"/>
  <text class="label" x="400" y="118" text-anchor="middle">BGE</text>
  <line class="tick" x1="440" y1="81" x2="440" y2="106"/>
  <text class="label" x="440" y="118" text-anchor="middle">CW</text>

  <!-- books, row 2 (y 140) -->
  <path class="tick" fill="none" d="M140 128 V122 H200 V128"/>
  <line class="tick" x1="170" y1="81" x2="170" y2="122"/>
  <text class="label" x="170" y="140" text-anchor="middle">UM I–IV</text>
  <line class="tick" x1="300" y1="81" x2="300" y2="128"/>
  <text class="label" x="300" y="140" text-anchor="middle">D</text>
  <path class="tick" fill="none" d="M340 128 V122 H380 V128"/>
  <line class="tick" x1="360" y1="81" x2="360" y2="122"/>
  <text class="label" x="360" y="140" text-anchor="middle">Z I–IV</text>
  <line class="tick" x1="420" y1="81" x2="420" y2="128"/>
  <text class="label" x="420" y="140" text-anchor="middle">GM</text>

  <!-- row 3: additions and the 1888 manuscripts -->
  <line class="guide" x1="420" y1="144" x2="420" y2="150"/>
  <text class="muted" x="420" y="162" text-anchor="middle">GS V</text>
  <line class="guide" x1="380" y1="144" x2="380" y2="172"/>
  <text class="muted" x="380" y="184" text-anchor="middle">Z IV private</text>
  <line class="guide" x1="450" y1="81" x2="450" y2="196"/>
  <line class="guide" x1="474" y1="204" x2="488" y2="204"/>
  <text class="muted" x="474" y="208" text-anchor="end">written 1888: TI, A, EH, NcW →</text>

  <!-- after the collapse -->
  <rect x="490" y="40" width="146" height="182" rx="4" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.35" stroke-dasharray="4 3"/>
  <text class="label" x="563" y="58" text-anchor="middle" font-weight="600">printed after 1889</text>
  <text class="muted" x="563" y="73" text-anchor="middle">he is silent 1889–1900</text>
  <text class="label" x="500" y="98">1889</text><text class="label" x="536" y="98">TI</text>
  <text class="label" x="500" y="117">1892</text><text class="label" x="536" y="117">Z IV, public</text>
  <text class="label" x="500" y="136">1895</text><text class="label" x="536" y="136">A, NcW</text>
  <text class="label" x="500" y="155">1901</text><text class="label" x="536" y="155" font-style="italic" opacity="0.8">WP, ~400 notes</text>
  <text class="label" x="500" y="174">1906</text><text class="label" x="536" y="174" font-style="italic" opacity="0.8">WP, 1,067 notes</text>
  <text class="label" x="500" y="193">1908</text><text class="label" x="536" y="193">EH</text>
  <text class="muted" x="563" y="214" text-anchor="middle" font-style="italic">italic: compiled, not his</text>
</svg>

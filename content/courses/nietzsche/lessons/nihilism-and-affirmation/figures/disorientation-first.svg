<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tiny { font-size: 9.5px; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .box { fill: none; stroke: currentColor; stroke-opacity: 0.45; stroke-width: 1.2; }
    .box-b { fill: none; stroke: #4c8dd6; stroke-width: 1.6; }
    .box-a { fill: none; stroke: #e2903a; stroke-width: 2.2; }
    .box-d { fill: none; stroke: currentColor; stroke-opacity: 0.4; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .box-ad { fill: none; stroke: #e2903a; stroke-width: 1.6; stroke-dasharray: 4 3; }
    .ghost { opacity: 0.28; }
    .arrow { stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.4; fill: none; }
    .arrow-a { stroke: #e2903a; stroke-width: 1.8; fill: none; }
    .arrow-b { stroke: #4c8dd6; stroke-width: 1.6; fill: none; }
    .arrow-d { stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.2; fill: none; stroke-dasharray: 3 3; }
    .rule { stroke: currentColor; stroke-opacity: 0.3; stroke-width: 1; }
    .rule-d { stroke: currentColor; stroke-opacity: 0.35; stroke-width: 1; stroke-dasharray: 3 3; }
    .strike { stroke: #e2903a; stroke-width: 2; }
    .bar { stroke: #e2903a; stroke-width: 4; }
  </style>
<text class="muted small" x="16" y="18">why disorientation must be settled first</text>
<rect class="box-d" x="40" y="60" width="200" height="60" rx="6"/>
<text class="muted" x="140" y="86" text-anchor="middle">a value with no standing</text>
<text class="muted small" x="140" y="104" text-anchor="middle">(disorientation: nothing binds)</text>
<path class="arrow-d" d="M 140 120 L 140 160"/>
<path class="strike" d="M 128 132 L 152 148 M 152 132 L 128 148"/>
<text class="muted" x="140" y="180" text-anchor="middle" text-decoration="line-through">despair</text>
<text class="label small" x="140" y="200" text-anchor="middle">cannot be unrealizable:</text><text class="label small" x="140" y="214" text-anchor="middle">nothing is held that the world could fail</text>
<rect class="box-a" x="400" y="60" width="200" height="60" rx="6"/>
<text class="amber" x="500" y="86" text-anchor="middle">a value that binds</text>
<text class="label small" x="500" y="104" text-anchor="middle">(life-negating, held)</text>
<path class="arrow-a" d="M 460 120 L 430 156"/><path class="arrow-a" d="M 430 148 L 430 156 L 438 155"/>
<circle class="box" cx="418" cy="176" r="16"/><path class="strike" d="M 406 164 L 430 188 M 430 164 L 406 188"/>
<text class="label small" x="418" y="206" text-anchor="middle">this world: will not have it</text>
<path class="arrow-a" d="M 540 120 L 570 156"/><path class="arrow-a" d="M 562 155 L 570 156 L 570 148"/>
<circle class="box-d" cx="582" cy="176" r="16"/>
<text class="label small" x="582" y="206" text-anchor="middle">the other world: none</text>
<text class="amber" x="500" y="236" text-anchor="middle">despair</text>
<path class="rule" d="M 16 252 L 624 252"/>
<text class="label small" x="320" y="272" text-anchor="middle">despair presupposes a value that stands, so disorientation is answered before despair registers;</text>
<text class="label small" x="320" y="286" text-anchor="middle">an answer that restores standing to values restores the despair the ascetic ideal held off</text>
</svg>

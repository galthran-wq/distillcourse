<svg viewBox="0 0 640 432" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tiny { font-size: 9.5px; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .box { fill: none; stroke: currentColor; stroke-opacity: 0.45; stroke-width: 1.2; }
    .box-b { fill: none; stroke: #4c8dd6; stroke-width: 1.6; }
    .box-a { fill: none; stroke: #e2903a; stroke-width: 2.2; }
    .box-d { fill: none; stroke: currentColor; stroke-opacity: 0.4; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .box-ad { fill: none; stroke: #e2903a; stroke-width: 1.6; stroke-dasharray: 4 3; }
    .ghost { opacity: 0.28; }
    .arrow { stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.4; fill: none; }
    .arrow-a { stroke: #e2903a; stroke-width: 1.8; fill: none; }
    .arrow-b { stroke: #4c8dd6; stroke-width: 1.6; fill: none; }
    .arrow-d { stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.2; fill: none; stroke-dasharray: 3 3; }
    .rule { stroke: currentColor; stroke-opacity: 0.3; stroke-width: 1; }
    .rule-d { stroke: currentColor; stroke-opacity: 0.35; stroke-width: 1; stroke-dasharray: 3 3; }
    .strike { stroke: #e2903a; stroke-width: 2; }
    .bar { stroke: #e2903a; stroke-width: 4; }
  </style>
<text class="muted small" x="16" y="18">GS 276, “Zum neuen Jahre” (January 1882): four withdrawals and one word</text>
<rect class="box" x="40" y="30" width="560" height="62" rx="6"/>
<text class="label small" x="52" y="48" font-weight="600">1. <tspan font-style="italic" font-weight="400">das Nothwendige an den Dingen als das Schöne sehen</tspan></text>
<text class="label small" x="52" y="66">to see the necessary in things as the beautiful</text>
<text class="muted small" x="52" y="83">withdraws: the judgment that what cannot be otherwise ought to be otherwise</text>
<path class="arrow" d="M 320 92 L 320 108"/><path class="arrow" d="M 314 102 L 320 108 L 326 102"/>
<rect class="box" x="40" y="110" width="560" height="62" rx="6"/>
<text class="label small" x="52" y="128" font-weight="600">2. <tspan font-style="italic" font-weight="400">keinen Krieg gegen das Hässliche führen</tspan></text>
<text class="label small" x="52" y="146">to wage no war against the ugly</text>
<text class="muted small" x="52" y="163">withdraws: the project of removing what the old values condemned</text>
<path class="arrow" d="M 320 172 L 320 188"/><path class="arrow" d="M 314 182 L 320 188 L 326 182"/>
<rect class="box" x="40" y="190" width="560" height="62" rx="6"/>
<text class="label small" x="52" y="208" font-weight="600">3. <tspan font-style="italic" font-weight="400">nicht einmal die Ankläger anklagen</tspan></text>
<text class="label small" x="52" y="226">not even to accuse the accusers</text>
<text class="muted small" x="52" y="243">withdraws: ressentiment, the search for someone to blame</text>
<path class="arrow" d="M 320 252 L 320 268"/><path class="arrow" d="M 314 262 L 320 268 L 326 262"/>
<rect class="box" x="40" y="270" width="560" height="62" rx="6"/>
<text class="label small" x="52" y="288" font-weight="600">4. <tspan font-style="italic" font-weight="400">Wegsehen sei meine einzige Verneinung</tspan></text>
<text class="label small" x="52" y="306">looking away my only negation</text>
<text class="muted small" x="52" y="323">keeps: one negation; withdraws: the verdict that went with it</text>
<path class="arrow" d="M 320 332 L 320 348"/><path class="arrow" d="M 314 342 L 320 348 L 326 342"/>
<rect class="box-a" x="40" y="350" width="560" height="56" rx="6"/>
<text class="amber" x="320" y="372" text-anchor="middle">5. ich will irgendwann einmal nur noch ein Ja-sagender sein</text>
<text class="label small" x="320" y="392" text-anchor="middle">“some day I want to be only a Yes-sayer”: the first and only Yes, dated “some day”</text>
<text class="muted small" x="320" y="420" text-anchor="middle">Amor fati, Latin, “love of fate”, is the section’s own name for the stance; the word “yes” appears once, last</text>
</svg>

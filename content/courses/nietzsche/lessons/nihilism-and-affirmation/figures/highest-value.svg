<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tiny { font-size: 9.5px; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .box { fill: none; stroke: currentColor; stroke-opacity: 0.45; stroke-width: 1.2; }
    .box-b { fill: none; stroke: #4c8dd6; stroke-width: 1.6; }
    .box-a { fill: none; stroke: #e2903a; stroke-width: 2.2; }
    .box-d { fill: none; stroke: currentColor; stroke-opacity: 0.4; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .box-ad { fill: none; stroke: #e2903a; stroke-width: 1.6; stroke-dasharray: 4 3; }
    .ghost { opacity: 0.28; }
    .arrow { stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.4; fill: none; }
    .arrow-a { stroke: #e2903a; stroke-width: 1.8; fill: none; }
    .arrow-b { stroke: #4c8dd6; stroke-width: 1.6; fill: none; }
    .arrow-d { stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.2; fill: none; stroke-dasharray: 3 3; }
    .rule { stroke: currentColor; stroke-opacity: 0.3; stroke-width: 1; }
    .rule-d { stroke: currentColor; stroke-opacity: 0.35; stroke-width: 1; stroke-dasharray: 3 3; }
    .strike { stroke: #e2903a; stroke-width: 2; }
    .bar { stroke: #e2903a; stroke-width: 4; }
  </style>
<text class="muted small" x="16" y="18">what makes a value “highest” (Reginster, ch. 1 §I.5), and WP 585 laid over it</text>
<rect class="box" x="16" y="30" width="300" height="200" rx="6"/>
<text class="label" x="28" y="50" font-weight="600">two features</text>
<text class="amber small" x="28" y="72">(i) its realization is expected</text>
<text class="label small" x="28" y="87">so its absence is a positive evil,</text><text class="label small" x="28" y="101">not a missing good: a verdict, not indifference</text>
<text class="amber small" x="28" y="124">(ii) it conditions every other good</text>
<text class="label small" x="28" y="139">so no lesser success redeems its failure</text>
<rect class="box-a" x="170" y="148" width="130" height="18" rx="3"/>
<text class="amber tiny" x="235" y="161" text-anchor="middle">the highest value</text>
<rect class="box" x="170" y="168" width="130" height="18" rx="3"/>
<text class="label tiny" x="235" y="181" text-anchor="middle">friendship’s point: work</text>
<rect class="box" x="170" y="188" width="130" height="18" rx="3"/>
<text class="label tiny" x="235" y="201" text-anchor="middle">lesser goods</text>
<path class="arrow-d" d="M 235 166 L 235 168"/><text class="muted tiny" x="150" y="192" text-anchor="end">conditions</text>
<path class="arrow-d" d="M 165 170 L 150 185 L 165 200"/>
<text class="muted tiny" x="28" y="222">a favourite goal lost: lowered expectations, not despair</text>
<rect class="box-b" x="336" y="30" width="288" height="200" rx="6"/>
<text class="blue" x="348" y="50">WP 585 (NF-1887,9[60]), Nachlass</text>
<text class="label small" x="348" y="72">“a nihilist is a man who judges</text>
<text class="label small" x="348" y="90" font-weight="600">of the world as it is that it ought not to be,</text>
<path class="rule-d" d="M 348 96 L 610 96"/>
<text class="amber tiny" x="348" y="110">= feature (i): expected good absent, a verdict</text>
<text class="label small" x="348" y="138" font-weight="600">and of the world as it ought to be</text>
<text class="label small" x="348" y="154" font-weight="600">that it does not exist”</text>
<path class="rule-d" d="M 348 160 L 610 160"/>
<text class="amber tiny" x="348" y="174">= despair’s P2: no other world to realize it in</text>
<text class="muted tiny" x="348" y="196">feature (ii) is what makes the verdict total:</text><text class="muted tiny" x="348" y="209">no lesser good redeems it, so “the world” and not a part</text>
<path class="rule" d="M 16 246 L 624 246"/>
<text class="label small" x="320" y="266" text-anchor="middle">the inference from “unrealizable” to “ought not to be” needs both features; without (i) it licenses only indifference</text>
</svg>

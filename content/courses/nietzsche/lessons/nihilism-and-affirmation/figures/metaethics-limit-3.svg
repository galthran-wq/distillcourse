<svg viewBox="0 0 640 366" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tiny { font-size: 9.5px; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .box { fill: none; stroke: currentColor; stroke-opacity: 0.45; stroke-width: 1.2; }
    .box-b { fill: none; stroke: #4c8dd6; stroke-width: 1.6; }
    .box-a { fill: none; stroke: #e2903a; stroke-width: 2.2; }
    .box-d { fill: none; stroke: currentColor; stroke-opacity: 0.4; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .box-ad { fill: none; stroke: #e2903a; stroke-width: 1.6; stroke-dasharray: 4 3; }
    .ghost { opacity: 0.28; }
    .arrow { stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.4; fill: none; }
    .arrow-a { stroke: #e2903a; stroke-width: 1.8; fill: none; }
    .arrow-b { stroke: #4c8dd6; stroke-width: 1.6; fill: none; }
    .arrow-d { stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.2; fill: none; stroke-dasharray: 3 3; }
    .rule { stroke: currentColor; stroke-opacity: 0.3; stroke-width: 1; }
    .rule-d { stroke: currentColor; stroke-opacity: 0.35; stroke-width: 1; stroke-dasharray: 3 3; }
    .strike { stroke: #e2903a; stroke-width: 2; }
    .bar { stroke: #e2903a; stroke-width: 4; }
  </style>
<text class="muted small" x="16" y="18">the metaethical answers and their limit</text>
<text class="label" x="160" y="44" text-anchor="middle" font-weight="600">disorientation</text>
<rect class="box" x="30" y="56" width="260" height="44" rx="5"/>
<text class="label small" x="160" y="74" text-anchor="middle">P1: a value binds only if it has</text><text class="label small" x="160" y="90" text-anchor="middle">objective standing (normative objectivism)</text>
<rect class="box" x="30" y="112" width="260" height="44" rx="5"/>
<text class="label small" x="160" y="130" text-anchor="middle">P2: there are no objective values</text><text class="label small" x="160" y="146" text-anchor="middle">(GS 301: “we were the givers”)</text>
<path class="arrow" d="M 160 156 L 160 184"/><path class="arrow" d="M 154 178 L 160 184 L 166 178"/>
<rect class="box" x="60" y="188" width="200" height="34" rx="5"/>
<text class="label small" x="160" y="210" text-anchor="middle">C: nothing binds; “why?” unanswered</text>
<path class="strike" d="M 34 60 L 286 96"/>
<text class="muted small" x="160" y="250" text-anchor="middle">subjectivism removed P1</text>
<path class="strike" d="M 146 162 L 174 182 M 174 162 L 146 182"/>
<text class="muted small" x="160" y="266" text-anchor="middle">fictionalism blocked P2 → C</text>
<text class="amber" x="160" y="330" text-anchor="middle">verdict: dissolved</text>
<g>
<text class="label" x="480" y="44" text-anchor="middle" font-weight="600">despair</text>
<rect class="box" x="350" y="56" width="260" height="44" rx="5"/>
<text class="label small" x="480" y="74" text-anchor="middle">P1: the highest values are life-negating,</text><text class="label small" x="480" y="90" text-anchor="middle">realizable only in another world</text>
<rect class="box" x="350" y="112" width="260" height="44" rx="5"/>
<text class="label small" x="480" y="130" text-anchor="middle">P2: there is no other world</text><text class="label small" x="480" y="146" text-anchor="middle">(“God is dead”)</text>
<path class="arrow" d="M 480 156 L 480 184"/><path class="arrow" d="M 474 178 L 480 184 L 486 178"/>
<rect class="box" x="380" y="188" width="200" height="34" rx="5"/>
<text class="label small" x="480" y="210" text-anchor="middle">C: the values cannot be realized</text>
<text class="label small" x="480" y="250" text-anchor="middle">neither strategy touches P1 or P2 here:</text>
<text class="label small" x="480" y="266" text-anchor="middle">a value that binds without standing</text><text class="label small" x="480" y="282" text-anchor="middle">can still be one the world will not realize</text>
<text class="blue" x="480" y="330" text-anchor="middle">verdict: standing</text>
<path class="arrow-a" d="M 560 330 L 610 330"/><path class="arrow-a" d="M 604 325 L 610 330 L 604 335"/>
<text class="amber tiny" x="612" y="322" text-anchor="end">affirmation, GS 276</text>
</g>
<path class="rule" d="M 320 40 L 320 340"/>
<text class="muted tiny" x="16" y="358">frame 3 of 3</text>
</svg>

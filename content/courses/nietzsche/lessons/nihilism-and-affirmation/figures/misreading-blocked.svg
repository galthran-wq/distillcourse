<svg viewBox="0 0 640 332" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tiny { font-size: 9.5px; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .box { fill: none; stroke: currentColor; stroke-opacity: 0.45; stroke-width: 1.2; }
    .box-b { fill: none; stroke: #4c8dd6; stroke-width: 1.6; }
    .box-a { fill: none; stroke: #e2903a; stroke-width: 2.2; }
    .box-d { fill: none; stroke: currentColor; stroke-opacity: 0.4; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .box-ad { fill: none; stroke: #e2903a; stroke-width: 1.6; stroke-dasharray: 4 3; }
    .ghost { opacity: 0.28; }
    .arrow { stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.4; fill: none; }
    .arrow-a { stroke: #e2903a; stroke-width: 1.8; fill: none; }
    .arrow-b { stroke: #4c8dd6; stroke-width: 1.6; fill: none; }
    .arrow-d { stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.2; fill: none; stroke-dasharray: 3 3; }
    .rule { stroke: currentColor; stroke-opacity: 0.3; stroke-width: 1; }
    .rule-d { stroke: currentColor; stroke-opacity: 0.35; stroke-width: 1; stroke-dasharray: 3 3; }
    .strike { stroke: #e2903a; stroke-width: 2; }
    .bar { stroke: #e2903a; stroke-width: 4; }
  </style>
<rect class="box-d" x="16" y="50" width="200" height="70" rx="6"/>
<text class="muted" x="116" y="76" text-anchor="middle" text-decoration="line-through">“Nietzsche is a nihilist;</text>
<text class="muted" x="116" y="94" text-anchor="middle" text-decoration="line-through">it ends in nothing matters”</text>
<path class="arrow" d="M 216 85 L 262 85"/><path class="arrow" d="M 256 80 L 262 85 L 256 90"/>
<text class="muted tiny" x="239" y="76" text-anchor="middle">cannot hold</text>
<path class="bar" d="M 270 26 L 270 66"/><rect class="box" x="270" y="26" width="354" height="40" rx="4"/>
<text class="amber small" x="280" y="50">GM III:14</text><text class="label tiny" x="345" y="43">the will to nothingness named</text><text class="label tiny" x="345" y="57">“the maximum of monstrousness”: the danger</text>
<path class="bar" d="M 270 74 L 270 114"/><rect class="box" x="270" y="74" width="354" height="40" rx="4"/>
<text class="amber small" x="280" y="98">GM III:28</text><text class="label tiny" x="345" y="91">the ideal praised for closing the door to</text><text class="label tiny" x="345" y="105">suicidal nihilism, and faulted for the price, guilt</text>
<path class="bar" d="M 270 122 L 270 162"/><rect class="box" x="270" y="122" width="354" height="40" rx="4"/>
<text class="amber small" x="280" y="146">A §7</text><text class="label tiny" x="345" y="139">“pity is the practice of nihilism”:</text><text class="label tiny" x="345" y="153">the word used of the opponent’s virtue</text>
<path class="rule" d="M 16 182 L 624 182"/>
<text class="muted small" x="16" y="202">where the reading gets its foothold, and the reply</text>
<rect class="box-b" x="16" y="212" width="290" height="70" rx="6"/>
<text class="blue small" x="28" y="230">GS 301: values “given, bestowed” by us</text>
<text class="label small" x="28" y="246">= P2 of the disorientation argument</text>
<text class="muted small" x="28" y="262">and the notebooks’ “everything is false” (Nachlass)</text>
<path class="arrow" d="M 306 247 L 336 247"/><path class="arrow" d="M 330 242 L 336 247 L 330 252"/>
<rect class="box" x="340" y="212" width="284" height="70" rx="6"/>
<text class="label small" x="352" y="230">P2 is nihilism only with P1, normative objectivism,</text>
<text class="label small" x="352" y="246">which Nietzsche rejects; GS 346 asks the question,</text>
<text class="label small" x="352" y="262">Book IV had answered it: a Yes-sayer, not a nihilist</text>
<path class="rule" d="M 16 298 L 624 298"/>
<text class="label small" x="320" y="318" text-anchor="middle">the soothsayer (Z II 19) and the Shadow (Z IV) are characters Zarathustra overcomes: cited for what they stage</text>
</svg>

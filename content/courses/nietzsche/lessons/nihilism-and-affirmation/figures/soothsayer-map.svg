<svg viewBox="0 0 640 348" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tiny { font-size: 9.5px; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .box { fill: none; stroke: currentColor; stroke-opacity: 0.45; stroke-width: 1.2; }
    .box-b { fill: none; stroke: #4c8dd6; stroke-width: 1.6; }
    .box-a { fill: none; stroke: #e2903a; stroke-width: 2.2; }
    .box-d { fill: none; stroke: currentColor; stroke-opacity: 0.4; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .box-ad { fill: none; stroke: #e2903a; stroke-width: 1.6; stroke-dasharray: 4 3; }
    .ghost { opacity: 0.28; }
    .arrow { stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.4; fill: none; }
    .arrow-a { stroke: #e2903a; stroke-width: 1.8; fill: none; }
    .arrow-b { stroke: #4c8dd6; stroke-width: 1.6; fill: none; }
    .arrow-d { stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.2; fill: none; stroke-dasharray: 3 3; }
    .rule { stroke: currentColor; stroke-opacity: 0.3; stroke-width: 1; }
    .rule-d { stroke: currentColor; stroke-opacity: 0.35; stroke-width: 1; stroke-dasharray: 3 3; }
    .strike { stroke: #e2903a; stroke-width: 2; }
    .bar { stroke: #e2903a; stroke-width: 4; }
  </style>
<text class="amber small" x="24" y="20">Z II 19, “The Soothsayer” (1883)</text><text class="blue small" x="330" y="20">GM III:28 (1887)</text>
<path class="rule" d="M 16 28 L 624 28"/>
<text class="label small" x="24" y="47">“everything was” — “all work was for naught”</text>
<text class="blue small" x="330" y="47">the refrain “in vain!”; existence “contained no</text>
<text class="blue small" x="330" y="62">goal”</text>
<path class="rule" d="M 16 76 L 624 76"/>
<text class="label small" x="24" y="95">“everything is empty” — wells dried, the sea withdrew</text>
<text class="blue small" x="330" y="95">“the tremendous void”; “the will for man</text>
<text class="blue small" x="330" y="110">and earth was lacking”</text>
<path class="rule" d="M 16 124 L 624 124"/>
<text class="label small" x="24" y="143">“everything is the same”</text>
<rect class="box-d" x="326" y="130" width="292" height="36" rx="4"/>
<text class="label small" x="330" y="143">ambiguous: despair or indifference; decided for despair</text>
<text class="label small" x="330" y="158">by context</text>
<path class="rule" d="M 16 172 L 624 172"/>
<text class="label small" x="24" y="191">“the best became weary of their works”</text>
<text class="blue small" x="330" y="191">not suffering but its senselessness is the</text>
<text class="blue small" x="330" y="206">curse; works still held</text>
<path class="rule" d="M 16 220 L 624 220"/>
<text class="label small" x="24" y="239">“too weary to die … we live on in burial chambers”</text>
<text class="blue small" x="330" y="239">“the door closed to suicidal nihilism”: rather</text>
<text class="blue small" x="330" y="254">will nothingness than not will</text>
<path class="rule" d="M 16 268 L 624 268"/>
<rect class="box-ad" x="18" y="272" width="604" height="40" rx="5"/>
<text class="amber small" x="24" y="287">the graveyard dream; the laughing coffin</text>
<text class="label small" x="330" y="287">none: the felt form, and a counter-image</text>
<text class="label small" x="330" y="302">the argued works lack</text>
<path class="rule" d="M 16 316 L 624 316"/>
<text class="label small" x="320" y="336" text-anchor="middle">every clause of the doctrine falls on the despair branch; the laughing coffin is the speech’s residue</text>
</svg>

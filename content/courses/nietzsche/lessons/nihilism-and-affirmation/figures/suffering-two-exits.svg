<svg viewBox="0 0 640 430" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tiny { font-size: 9.5px; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .box { fill: none; stroke: currentColor; stroke-opacity: 0.45; stroke-width: 1.2; }
    .box-b { fill: none; stroke: #4c8dd6; stroke-width: 1.6; }
    .box-a { fill: none; stroke: #e2903a; stroke-width: 2.2; }
    .box-d { fill: none; stroke: currentColor; stroke-opacity: 0.4; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .box-ad { fill: none; stroke: #e2903a; stroke-width: 1.6; stroke-dasharray: 4 3; }
    .ghost { opacity: 0.28; }
    .arrow { stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.4; fill: none; }
    .arrow-a { stroke: #e2903a; stroke-width: 1.8; fill: none; }
    .arrow-b { stroke: #4c8dd6; stroke-width: 1.6; fill: none; }
    .arrow-d { stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.2; fill: none; stroke-dasharray: 3 3; }
    .rule { stroke: currentColor; stroke-opacity: 0.3; stroke-width: 1; }
    .rule-d { stroke: currentColor; stroke-opacity: 0.35; stroke-width: 1; stroke-dasharray: 3 3; }
    .strike { stroke: #e2903a; stroke-width: 2; }
    .bar { stroke: #e2903a; stroke-width: 4; }
  </style>
<text class="muted small" x="16" y="18">the will-to-power loop with “resistance” read as suffering, and the two meanings suffering can be given</text>
<rect class="box" x="20" y="66" width="200" height="28" rx="5"/>
<text class="label small" x="120" y="84" text-anchor="middle">a determinate end</text>
<rect class="box-a" x="20" y="146" width="200" height="28" rx="5"/>
<text class="amber small" x="120" y="164" text-anchor="middle">resistance = suffering</text>
<rect class="box" x="20" y="226" width="200" height="28" rx="5"/>
<text class="label small" x="120" y="244" text-anchor="middle">the resistance overcome</text>
<rect class="box" x="20" y="306" width="200" height="28" rx="5"/>
<text class="label small" x="120" y="324" text-anchor="middle">satisfaction, the feeling of power</text>
<rect class="box" x="20" y="386" width="200" height="28" rx="5"/>
<text class="label small" x="120" y="404" text-anchor="middle">the resistance gone</text>
<path class="arrow" d="M 120 94 L 120 146"/><path class="arrow" d="M 114 140 L 120 146 L 126 140"/>
<path class="arrow" d="M 120 174 L 120 226"/><path class="arrow" d="M 114 220 L 120 226 L 126 220"/>
<path class="arrow" d="M 120 254 L 120 306"/><path class="arrow" d="M 114 300 L 120 306 L 126 300"/>
<path class="arrow" d="M 120 334 L 120 386"/><path class="arrow" d="M 114 380 L 120 386 L 126 380"/>
<path class="arrow-d" d="M 220 400 L 250 400 L 250 80 L 220 80"/><path class="arrow-d" d="M 226 74 L 220 80 L 226 86"/>
<text class="muted tiny" x="256" y="240">a new end, or a</text><text class="muted tiny" x="256" y="252">greater resistance</text>
<path class="arrow-b" d="M 220 160 L 330 110"/><path class="arrow-b" d="M 322 110 L 330 110 L 327 117"/>
<rect class="box-b" x="336" y="60" width="288" height="92" rx="6"/>
<text class="blue" x="348" y="80">exit 1: the ascetic ideal (GM III:28)</text>
<text class="label small" x="348" y="98">suffering interpreted as guilt: a sentence passed</text>
<text class="label small" x="348" y="113">on the sufferer; the what-for in another world</text>
<text class="muted small" x="348" y="130">“the door closed to suicidal nihilism”; price: guilt</text>
<text class="muted tiny" x="348" y="145">a value held, and no world once the ideal’s God is denied</text>
<path class="arrow-a" d="M 220 166 L 330 216"/><path class="arrow-a" d="M 322 216 L 330 216 L 327 209"/>
<rect class="box-a" x="336" y="176" width="288" height="92" rx="6"/>
<text class="amber" x="348" y="196">exit 2: the counter-ideal</text>
<text class="label small" x="348" y="214">suffering interpreted as resistance overcome:</text>
<text class="label small" x="348" y="229">the what-for located in this world, in the activity</text>
<text class="muted small" x="348" y="246">the ingredient of the “new happiness” (A §2)</text>
<text class="muted tiny" x="348" y="261">GM II:18’s “artist’s cruelty”: the self as resisting material</text>
<path class="rule" d="M 336 290 L 624 290"/>
<text class="label small" x="480" y="310" text-anchor="middle">both exits give suffering a meaning;</text>
<text class="label small" x="480" y="326" text-anchor="middle">they differ in where the meaning is located</text>
<text class="amber small" x="480" y="352" text-anchor="middle">on exit 2: the lack of suffering</text><text class="amber small" x="480" y="368" text-anchor="middle">implies the lack of true happiness</text>
<text class="muted tiny" x="480" y="392" text-anchor="middle">holds for suffering as a desire’s frustration;</text><text class="muted tiny" x="480" y="405" text-anchor="middle">silent about pain that arrives from outside</text>
</svg>

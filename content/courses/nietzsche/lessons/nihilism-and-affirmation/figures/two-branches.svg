<svg viewBox="0 0 640 372" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tiny { font-size: 9.5px; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .box { fill: none; stroke: currentColor; stroke-opacity: 0.45; stroke-width: 1.2; }
    .box-b { fill: none; stroke: #4c8dd6; stroke-width: 1.6; }
    .box-a { fill: none; stroke: #e2903a; stroke-width: 2.2; }
    .box-d { fill: none; stroke: currentColor; stroke-opacity: 0.4; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .box-ad { fill: none; stroke: #e2903a; stroke-width: 1.6; stroke-dasharray: 4 3; }
    .ghost { opacity: 0.28; }
    .arrow { stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.4; fill: none; }
    .arrow-a { stroke: #e2903a; stroke-width: 1.8; fill: none; }
    .arrow-b { stroke: #4c8dd6; stroke-width: 1.6; fill: none; }
    .arrow-d { stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.2; fill: none; stroke-dasharray: 3 3; }
    .rule { stroke: currentColor; stroke-opacity: 0.3; stroke-width: 1; }
    .rule-d { stroke: currentColor; stroke-opacity: 0.35; stroke-width: 1; stroke-dasharray: 3 3; }
    .strike { stroke: #e2903a; stroke-width: 2; }
    .bar { stroke: #e2903a; stroke-width: 4; }
  </style>
<text class="muted small" x="16" y="18">nihilism’s two branches, with the passage that states each and the answer beneath</text>
<rect class="box-b" x="200" y="30" width="240" height="46" rx="6"/>
<text class="blue" x="320" y="49" text-anchor="middle">“God is dead” (GS 125, 343)</text>
<text class="label small" x="320" y="66" text-anchor="middle">the foundation of European values withdrawn</text>
<path class="arrow" d="M 260 76 L 160 108"/><path class="arrow" d="M 165 101 L 160 108 L 168 109"/>
<path class="arrow-a" d="M 380 76 L 480 108"/><path class="arrow-a" d="M 472 109 L 480 108 L 475 101"/>
<rect class="box" x="20" y="112" width="280" height="96" rx="6"/>
<text class="label" x="160" y="132" text-anchor="middle" font-weight="600">disorientation</text>
<text class="label small" x="160" y="150" text-anchor="middle">values lack objective standing; nothing ranks anything</text>
<text class="label small" x="160" y="166" text-anchor="middle">“‘why?’ finds no answer” that could bind</text>
<text class="muted small" x="160" y="184" text-anchor="middle">blames the values, not the world</text>
<text class="label small" x="160" y="200" text-anchor="middle">published: GS 346, “our question mark”</text>
<path class="arrow" d="M 160 208 L 160 236"/><path class="arrow" d="M 154 230 L 160 236 L 166 230"/>
<rect class="box" x="40" y="240" width="240" height="64" rx="6"/>
<text class="label" x="160" y="260" text-anchor="middle" font-weight="600">answer: metaethics</text>
<text class="label small" x="160" y="277" text-anchor="middle">subjectivism or fictionalism: values bind</text>
<text class="label small" x="160" y="292" text-anchor="middle">without standing (the value-creation lesson)</text>
<rect class="box-a" x="340" y="112" width="280" height="96" rx="6"/>
<text class="amber" x="480" y="132" text-anchor="middle">despair</text>
<text class="label small" x="480" y="150" text-anchor="middle">the highest values cannot be realized in this world,</text>
<text class="label small" x="480" y="166" text-anchor="middle">and there is no other world to realize them in</text>
<text class="muted small" x="480" y="184" text-anchor="middle">blames the world, not the values</text>
<text class="label small" x="480" y="200" text-anchor="middle">published: GM III:28; staged: Z II “The Soothsayer”</text>
<path class="arrow-a" d="M 480 208 L 480 236"/><path class="arrow-a" d="M 474 230 L 480 236 L 486 230"/>
<rect class="box-a" x="360" y="240" width="240" height="64" rx="6"/>
<text class="amber" x="480" y="260" text-anchor="middle">answer: affirmation</text>
<text class="label small" x="480" y="277" text-anchor="middle">GS 276, amor fati: this life valued as an end,</text>
<text class="label small" x="480" y="292" text-anchor="middle">its necessity included; tested by eternal recurrence</text>
<path class="rule" d="M 16 322 L 624 322"/>
<text class="label small" x="320" y="342" text-anchor="middle">the branches are independent: a value with no standing cannot be despaired of, so the left is settled first</text>
<text class="muted small" x="320" y="358" text-anchor="middle">only the right branch is what the ascetic ideal was protecting against (GM III:28)</text>
</svg>

<svg viewBox="0 0 640 398" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tiny { font-size: 9.5px; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .box { fill: none; stroke: currentColor; stroke-opacity: 0.45; stroke-width: 1.2; }
    .box-b { fill: none; stroke: #4c8dd6; stroke-width: 1.6; }
    .box-a { fill: none; stroke: #e2903a; stroke-width: 2.2; }
    .box-d { fill: none; stroke: currentColor; stroke-opacity: 0.4; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .box-ad { fill: none; stroke: #e2903a; stroke-width: 1.6; stroke-dasharray: 4 3; }
    .ghost { opacity: 0.28; }
    .arrow { stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.4; fill: none; }
    .arrow-a { stroke: #e2903a; stroke-width: 1.8; fill: none; }
    .arrow-b { stroke: #4c8dd6; stroke-width: 1.6; fill: none; }
    .arrow-d { stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.2; fill: none; stroke-dasharray: 3 3; }
    .rule { stroke: currentColor; stroke-opacity: 0.3; stroke-width: 1; }
    .rule-d { stroke: currentColor; stroke-opacity: 0.35; stroke-width: 1; stroke-dasharray: 3 3; }
    .strike { stroke: #e2903a; stroke-width: 2; }
    .bar { stroke: #e2903a; stroke-width: 4; }
  </style>
<text class="muted small" x="16" y="18">the notebooks’ ladder of nihilisms as Heidegger arranges it (Nietzsche IV §9): Nachlass on every rung</text>
<rect class="box" x="40" y="230" width="140" height="30" rx="4" opacity="0.7"/>
<text class="label small" x="110" y="249" text-anchor="middle" font-weight="600">1 pessimism</text>
<path class="arrow" d="M 180 236 L 200 226"/>
<rect class="box" x="150" y="190" width="140" height="30" rx="4" opacity="0.7"/>
<text class="label small" x="220" y="209" text-anchor="middle" font-weight="600">2 incomplete nihilism</text>
<path class="arrow" d="M 290 196 L 310 186"/>
<rect class="box" x="260" y="150" width="140" height="30" rx="4" opacity="0.7"/>
<text class="label small" x="330" y="169" text-anchor="middle" font-weight="600">3 extreme nihilism</text>
<path class="arrow" d="M 400 156 L 420 146"/>
<rect class="box" x="370" y="110" width="140" height="30" rx="4" opacity="0.7"/>
<text class="label small" x="440" y="129" text-anchor="middle" font-weight="600">4 passive / active</text>
<path class="arrow" d="M 510 116 L 530 106"/>
<rect class="box" x="480" y="70" width="140" height="30" rx="4" opacity="0.7"/>
<text class="label small" x="550" y="89" text-anchor="middle" font-weight="600">5 classical, ecstatic</text>
<path class="arrow-b" d="M 150 272 L 620 272"/><path class="arrow-b" d="M 150 266 L 150 278 M 620 266 L 620 278"/>
<text class="blue tiny" x="385" y="288" text-anchor="middle" font-size="9">Reginster: rungs 2–5 presuppose despair (values still endorsed, the world resigned to or destroyed)</text>
<text class="muted tiny" x="40" y="310">1: “the world is worth less” (WP 32, 9); GS 346 calls this pessimism</text>
<text class="muted tiny" x="40" y="324">2: new ideals set in the old place (WP 28): “in place of dogmatic Christianity, Wagnerian music” (WP 1021)</text>
<text class="muted tiny" x="40" y="338">3: “no truth in itself” (WP 22)  ·  4: passive, “weary, no longer attacks”; active, “a violent force of destruction” (WP 22–23)</text>
<text class="muted tiny" x="40" y="352">5: “the ideal of supreme powerfulness” (WP 14), “ecstatic nihilism” (WP 1055): the ground cleared for new values</text>
<path class="rule" d="M 16 366 L 624 366"/>
<text class="label small" x="320" y="384" text-anchor="middle">the published works state none of these grades; the split of this lesson runs across the ladder, not along it</text>
</svg>

<svg viewBox="0 0 640 348" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tiny { font-size: 9.5px; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .box { fill: none; stroke: currentColor; stroke-opacity: 0.45; stroke-width: 1.2; }
    .box-b { fill: none; stroke: #4c8dd6; stroke-width: 1.6; }
    .box-a { fill: none; stroke: #e2903a; stroke-width: 2.2; }
    .box-d { fill: none; stroke: currentColor; stroke-opacity: 0.4; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .box-ad { fill: none; stroke: #e2903a; stroke-width: 1.6; stroke-dasharray: 4 3; }
    .ghost { opacity: 0.28; }
    .arrow { stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.4; fill: none; }
    .arrow-a { stroke: #e2903a; stroke-width: 1.8; fill: none; }
    .arrow-b { stroke: #4c8dd6; stroke-width: 1.6; fill: none; }
    .arrow-d { stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.2; fill: none; stroke-dasharray: 3 3; }
    .rule { stroke: currentColor; stroke-opacity: 0.3; stroke-width: 1; }
    .rule-d { stroke: currentColor; stroke-opacity: 0.35; stroke-width: 1; stroke-dasharray: 3 3; }
    .strike { stroke: #e2903a; stroke-width: 2; }
    .bar { stroke: #e2903a; stroke-width: 4; }
  </style>
<text class="muted small" x="16" y="18">the word in the books: five load-bearing sites</text>
<text class="tiny muted" x="24" y="38">site</text><text class="tiny muted" x="92" y="38">date</text><text class="tiny muted" x="126" y="38">the sentence</text><text class="tiny muted" x="490" y="38">the noun it is attached to</text>
<path class="rule" d="M 16 44 L 624 44"/>
<text class="label small" x="24" y="61" font-weight="600">GS 346</text><text class="muted tiny" x="92" y="61">1887</text>
<text class="label tiny" x="126" y="61">“abolish your reverences or — yourselves!”; both nihilism, one only as a question</text>
<text class="amber small" x="490" y="61">a will against itself</text>
<path class="rule" d="M 16 72 L 624 72"/>
<text class="label small" x="24" y="89" font-weight="600">GM Pref. 5</text><text class="muted tiny" x="92" y="89">1887</text>
<text class="label tiny" x="126" y="89">the morality of pity as Europe’s “detour … to nihilism?”</text>
<text class="amber small" x="490" y="89">the will against life</text>
<path class="rule" d="M 16 100 L 624 100"/>
<text class="label small" x="24" y="117" font-weight="600">GM III:14</text><text class="muted tiny" x="92" y="117">1887</text>
<text class="label tiny" x="126" y="117">nausea and pity mated: “his will to nothingness, nihilism”</text>
<text class="amber small" x="490" y="117">a will to nothingness</text>
<path class="rule" d="M 16 128 L 624 128"/>
<text class="label small" x="24" y="145" font-weight="600">GM III:28</text><text class="muted tiny" x="92" y="145">1887</text>
<text class="label tiny" x="126" y="145">“the door was closed to all suicidal nihilism”; “in vain!”</text>
<text class="amber small" x="490" y="145">a will without an aim</text>
<path class="rule" d="M 16 156 L 624 156"/>
<text class="label small" x="24" y="173" font-weight="600">A §7</text><text class="muted tiny" x="92" y="173">1888</text>
<text class="label tiny" x="126" y="173">“pity is the practice of nihilism”; pity “persuades to nothingness”</text>
<text class="amber small" x="490" y="173">persuaded to nothing</text>
<path class="rule" d="M 16 184 L 624 184"/>
<path class="rule-d" d="M 16 206 L 624 206"/>
<text class="muted small" x="16" y="222">the one notebook definition, marked Nachlass</text>
<rect class="box-d" x="16" y="230" width="330" height="86" rx="6"/>
<text class="label small" x="28" y="248" font-weight="600">NF-1887,9[35] (WP 2)</text>
<text class="label small" x="28" y="270">clause 1: “the uppermost values devaluate themselves”</text>
<text class="label small" x="28" y="300">clause 2: “the aim is lacking; ‘why?’ finds no answer”</text>
<path class="arrow-d" d="M 346 266 L 400 266"/>
<text class="muted small" x="406" y="262">no published sentence; GS 346 asks</text><text class="muted small" x="406" y="276">whether it counts, and does not assert it</text>
<path class="arrow-b" d="M 346 296 L 400 296"/><path class="arrow-b" d="M 394 291 L 400 296 L 394 301"/>
<text class="blue small" x="406" y="292">GM III:28: “‘why man at all?’ was a</text><text class="blue small" x="406" y="306">question without an answer”</text>
<text class="label small" x="320" y="336" text-anchor="middle">the books attach the word to a will and its object; the devaluation clause is the notebook’s</text>
</svg>

<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.6; font-size: 12px; }
    .box { fill: none; stroke: currentColor; stroke-opacity: 0.45; }
  </style>
  <rect class="box" x="10" y="10" width="620" height="310" rx="6" stroke-opacity="0.7"/>
  <text class="label" x="28" y="38" font-weight="600">“European Nihilism”</text>
  <text class="muted" x="28" y="58">notebook 5[71] · Lenzer Heide, 10 June 1887 · fifteen numbered paragraphs · unpublished</text>
  <line x1="28" y1="72" x2="612" y2="72" stroke="currentColor" stroke-opacity="0.3"/>

  <rect x="28" y="84" width="584" height="40" rx="4" fill="#e2903a" fill-opacity="0.10" stroke="#e2903a"/>
  <text x="40" y="109" fill="#e2903a" font-weight="600">§§1–3</text>
  <text class="label" x="112" y="109">what the Christian moral interpretation gave; truthfulness turns on it</text>

  <rect x="28" y="130" width="584" height="40" rx="4" fill="#e2903a" fill-opacity="0.10" stroke="#e2903a"/>
  <text x="40" y="155" fill="#e2903a" font-weight="600">§§4–5</text>
  <text class="label" x="112" y="155">an extreme replaced by its converse: “In vain!”</text>

  <rect class="box" x="28" y="176" width="584" height="40" rx="4"/>
  <text class="muted" x="40" y="201" font-weight="600">§§6–8</text>
  <text class="muted" x="112" y="201">eternal recurrence as “the most extreme form of nihilism”; a yes without a goal</text>

  <rect x="28" y="222" width="584" height="40" rx="4" fill="#e2903a" fill-opacity="0.10" stroke="#e2903a"/>
  <text x="40" y="247" fill="#e2903a" font-weight="600">§§9–12</text>
  <text class="label" x="112" y="247">morality as the consolation of the oppressed, and what its loss does to them</text>

  <rect x="28" y="268" width="584" height="40" rx="4" fill="#e2903a" fill-opacity="0.10" stroke="#e2903a"/>
  <text x="40" y="293" fill="#e2903a" font-weight="600">§§13–15</text>
  <text class="label" x="112" y="293">not hardship but culture; who proves strongest: “the most moderate”</text>
</svg>

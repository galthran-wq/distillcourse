<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.6; font-size: 12px; }
    .box { fill: none; stroke: currentColor; stroke-opacity: 0.45; }
  </style>
  <rect x="10" y="10" width="200" height="250" rx="5" fill="#4c8dd6" fill-opacity="0.10" stroke="#4c8dd6"/>
  <text x="24" y="36" fill="#4c8dd6" font-weight="600">passive</text>
  <text class="label" x="24" y="60" font-size="12">the spirit's power declines</text>
  <text class="label" x="24" y="78" font-size="12">values war on each other</text>
  <text class="label" x="24" y="96" font-size="12">what soothes and numbs</text>
  <text class="label" x="24" y="112" font-size="12">comes to the fore</text>
  <text class="label" x="24" y="130" font-size="12">“weary nihilism that no</text>
  <text class="label" x="24" y="146" font-size="12">longer attacks”</text>
  <line x1="24" y1="180" x2="196" y2="180" stroke="currentColor" stroke-opacity="0.3" stroke-dasharray="3 3"/>
  <text class="muted" x="24" y="200">the soothsayer:</text>
  <text class="muted" x="24" y="218">“All is empty, all is the</text>
  <text class="muted" x="24" y="234">same, all has been!”</text>

  <rect class="box" x="220" y="10" width="200" height="250" rx="5" stroke-dasharray="4 3"/>
  <text class="label" x="234" y="36" font-weight="600">incomplete</text>
  <text class="label" x="234" y="60" font-size="12">keeps the values,</text>
  <text class="label" x="234" y="78" font-size="12">denies their ground</text>
  <text class="label" x="234" y="96" font-size="12">the shadow shown</text>
  <text class="label" x="234" y="112" font-size="12">in the cave</text>
  <line x1="234" y1="180" x2="406" y2="180" stroke="currentColor" stroke-opacity="0.3" stroke-dasharray="3 3"/>
  <text class="muted" x="234" y="200">George Eliot: rid of</text>
  <text class="muted" x="234" y="218">the God, clinging to</text>
  <text class="muted" x="234" y="234">the morality</text>

  <rect x="430" y="10" width="200" height="250" rx="5" fill="#e2903a" fill-opacity="0.12" stroke="#e2903a"/>
  <text x="444" y="36" fill="#e2903a" font-weight="600">active</text>
  <text class="label" x="444" y="60" font-size="12">the spirit's power has</text>
  <text class="label" x="444" y="78" font-size="12">outgrown its old goals</text>
  <text class="label" x="444" y="96" font-size="12">“a violent force of</text>
  <text class="label" x="444" y="112" font-size="12">destruction”: the No of</text>
  <text class="label" x="444" y="130" font-size="12">the judgement becomes</text>
  <text class="label" x="444" y="146" font-size="12">the No of the hand</text>
  <line x1="444" y1="180" x2="616" y2="180" stroke="currentColor" stroke-opacity="0.3" stroke-dasharray="3 3"/>
  <text class="muted" x="444" y="200">Zarathustra:</text>
  <text class="muted" x="444" y="218">“what is falling,</text>
  <text class="muted" x="444" y="234">we should still push”</text>

  <text class="label" x="320" y="292" text-anchor="middle" font-size="12">nihilism is “a pathological intermediate state”: what is pathological is</text>
  <text class="label" x="320" y="310" text-anchor="middle" font-size="12">“the inference that there is no meaning at all” (notebook 9[35])</text>
</svg>

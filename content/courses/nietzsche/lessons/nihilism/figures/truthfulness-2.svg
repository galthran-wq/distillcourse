<svg viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.6; font-size: 12px; }
    .box { fill: none; stroke: currentColor; stroke-opacity: 0.45; }
  </style>
  <defs>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e2903a"/></marker>
    <marker id="arr-m" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="currentColor" fill-opacity="0.4"/></marker>
  </defs>
  <rect class="box" x="20" y="36" width="380" height="110" rx="5" stroke-opacity="0.8"/>
  <text class="label" x="34" y="58" font-weight="600">the highest values</text>
  <text class="muted" x="34" y="80">the soul's absolute worth</text>
  <text class="muted" x="34" y="98">love of neighbour · humility</text>
  <text class="muted" x="34" y="116">pity · guilt and redemption</text>
  <rect x="262" y="60" width="124" height="28" rx="4" fill="#e2903a" fill-opacity="0.14" stroke="#e2903a"/>
  <text x="324" y="79" text-anchor="middle" fill="#e2903a" font-weight="600">truthfulness</text>
  <line x1="80" y1="146" x2="80" y2="246" stroke="currentColor" stroke-opacity="0.55" stroke-width="3"/>
  <line x1="200" y1="146" x2="200" y2="246" stroke="currentColor" stroke-opacity="0.55" stroke-width="3"/>
  <text class="muted" x="92" y="200">held up by</text>
  <rect class="box" x="20" y="246" width="380" height="58" rx="5" stroke-opacity="0.8"/>
  <text class="label" x="34" y="268" font-weight="600">the world behind the world</text>
  <text class="muted" x="34" y="290">God · a moral world-order · the life to come</text>
  <rect class="box" x="440" y="150" width="184" height="80" rx="5"/>
  <text class="label" x="452" y="172">nature · history</text>
  <text class="label" x="452" y="192">one's own life</text>
  <text class="muted" x="452" y="212">no longer read as signs</text>
  <text class="muted" x="452" y="226">of providence</text>
  <path d="M386 70 C 420 66, 436 58, 452 52" fill="none" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.3" marker-end="url(#arr-m)"/>
  <text x="458" y="48" class="muted" font-size="12">on oneself: lying a sin,</text>
  <text x="458" y="64" class="muted" font-size="12">“God sees the heart”</text>
  <path d="M386 82 C 414 100, 424 140, 438 166" fill="none" stroke="#e2903a" stroke-width="1.6" marker-end="url(#arr-a)"/>
  <text class="label" x="20" y="360" font-weight="600">2 · aimed at the world: the scientific conscience (GS 357)</text>
</svg>

<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.6; font-size: 12px; }
    .box { fill: none; stroke: currentColor; stroke-opacity: 0.45; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker>
  </defs>
  <rect x="10" y="14" width="300" height="78" rx="5" fill="#4c8dd6" fill-opacity="0.10" stroke="#4c8dd6"/>
  <text x="24" y="38" fill="#4c8dd6" font-weight="600">premise 1 · God is dead</text>
  <text class="label" x="24" y="60" font-size="12">the belief that held the highest values</text>
  <text class="label" x="24" y="76" font-size="12">up has become unbelievable</text>

  <rect x="330" y="14" width="300" height="78" rx="5" fill="#e2903a" fill-opacity="0.10" stroke="#e2903a" stroke-dasharray="5 3"/>
  <text x="344" y="38" fill="#e2903a" font-weight="600">premise 2 · life-negating values</text>
  <text class="label" x="344" y="60" font-size="12">they measured this world by another,</text>
  <text class="label" x="344" y="76" font-size="12">and asked of it what it cannot give</text>

  <line x1="160" y1="92" x2="300" y2="140" stroke="currentColor" stroke-opacity="0.6" marker-end="url(#arr)"/>
  <line x1="480" y1="92" x2="340" y2="140" stroke="currentColor" stroke-opacity="0.6" marker-end="url(#arr)"/>

  <rect class="box" x="140" y="142" width="360" height="74" rx="5" stroke-opacity="1"/>
  <text class="label" x="320" y="168" text-anchor="middle" font-weight="600">nihilism</text>
  <text class="label" x="320" y="188" text-anchor="middle" font-size="12">the only world left stands condemned</text>
  <text class="label" x="320" y="204" text-anchor="middle" font-size="12">by its own highest values: “In vain!”</text>

  <text class="muted" x="10" y="114">premise 1 alone:</text>
  <text class="muted" x="10" y="130">values merely ungrounded</text>
  <text class="muted" x="505" y="128">owed: the genealogy</text>
  <text class="muted" x="505" y="144">of the ascetic ideal</text>

  <line x1="260" y1="216" x2="160" y2="270" stroke="currentColor" stroke-opacity="0.6" marker-end="url(#arr)"/>
  <line x1="380" y1="216" x2="480" y2="270" stroke="currentColor" stroke-opacity="0.6" marker-end="url(#arr)"/>

  <rect class="box" x="20" y="272" width="270" height="96" rx="5" stroke-dasharray="3 3"/>
  <text class="label" x="34" y="296" font-weight="600">exit 1 · restore the ground</text>
  <text class="muted" x="34" y="318">bring back the world behind the world</text>
  <line x1="34" y1="340" x2="270" y2="340" stroke="currentColor" stroke-opacity="0.3"/>
  <text class="muted" x="34" y="358">closed: truthfulness forbids it</text>

  <rect x="350" y="272" width="270" height="96" rx="5" fill="#e2903a" fill-opacity="0.12" stroke="#e2903a"/>
  <text x="364" y="296" fill="#e2903a" font-weight="600">exit 2 · revalue</text>
  <text class="label" x="364" y="318" font-size="12">judge the values by a new standard:</text>
  <text class="label" x="364" y="334" font-size="12">does this valuation serve ascending</text>
  <text class="label" x="364" y="350" font-size="12">or declining life?</text>
</svg>

<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.6; font-size: 12px; }
    .box { fill: none; stroke: currentColor; stroke-opacity: 0.45; }
  </style>
  <text class="label" x="400" y="22" text-anchor="middle" font-weight="600">the world behind the world …</text>
  <text class="muted" x="280" y="44" text-anchor="middle">… still believed</text>
  <text class="muted" x="520" y="44" text-anchor="middle">… gone</text>

  <text class="label" x="14" y="80" font-weight="600">the highest</text>
  <text class="label" x="14" y="98" font-weight="600">values …</text>
  <text class="muted" x="14" y="140">… still bind</text>
  <text class="muted" x="14" y="156">(the measure kept)</text>
  <text class="muted" x="14" y="268">… no longer bind</text>
  <text class="muted" x="14" y="284">(the measure lost)</text>

  <rect class="box" x="160" y="56" width="236" height="140" rx="5"/>
  <text class="label" x="174" y="82" font-weight="600">faith</text>
  <text class="muted" x="174" y="104">realized elsewhere: the soul's worth,</text>
  <text class="muted" x="174" y="120">suffering redeemed, a moral order</text>
  <text class="muted" x="174" y="148">“the great antidote to practical</text>
  <text class="muted" x="174" y="164">and theoretical nihilism” (§1)</text>

  <rect x="404" y="56" width="226" height="140" rx="5" fill="#e2903a" fill-opacity="0.12" stroke="#e2903a"/>
  <text x="418" y="82" fill="#e2903a" font-weight="600">despair</text>
  <text class="label" x="418" y="104" font-size="12">this world judged by the old</text>
  <text class="label" x="418" y="120" font-size="12">measure and found wanting:</text>
  <text x="418" y="140" fill="#e2903a" font-size="12">“In vain!” (§5)</text>
  <line x1="418" y1="154" x2="616" y2="154" stroke="currentColor" stroke-opacity="0.25" stroke-dasharray="3 3"/>
  <text class="muted" x="418" y="172">not yet noticed: the shadow,</text>
  <text class="muted" x="418" y="188">“I have come too early”</text>

  <rect x="160" y="204" width="236" height="120" rx="5" fill="none" stroke="currentColor" stroke-opacity="0.2" stroke-dasharray="2 4"/>
  <text class="muted" x="174" y="232">no stable case: a believer's</text>
  <text class="muted" x="174" y="248">God binds him to the values</text>

  <rect x="404" y="204" width="226" height="120" rx="5" fill="#4c8dd6" fill-opacity="0.10" stroke="#4c8dd6"/>
  <text x="418" y="230" fill="#4c8dd6" font-weight="600">disorientation</text>
  <text class="label" x="418" y="252" font-size="12">no standard left to rank by:</text>
  <text x="418" y="272" fill="#4c8dd6" font-size="12">“Is there still any up or down?”</text>
  <text class="muted" x="418" y="292">(GS 125)</text>
</svg>

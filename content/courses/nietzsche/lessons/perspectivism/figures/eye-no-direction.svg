<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .box { fill: none; stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.3; }
    .box-b { fill: none; stroke: #4c8dd6; stroke-width: 1.8; }
    .box-a { fill: none; stroke: #e2903a; stroke-width: 1.8; }
    .eye { fill: none; stroke: currentColor; stroke-width: 1.6; }
    .pupil { fill: currentColor; }
    .ray-b { stroke: #4c8dd6; stroke-width: 1.2; opacity: 0.7; }
    .ray-a { stroke: #e2903a; stroke-width: 1.8; fill: none; }
    .strike { stroke: currentColor; stroke-opacity: 0.55; stroke-width: 2.2; }
    .rule { stroke: currentColor; stroke-opacity: 0.3; stroke-width: 1; }
    .obj { fill: #e2903a; fill-opacity: 0.18; stroke: #e2903a; stroke-width: 1.6; }
  </style>
  <text class="muted small" x="16" y="18">GM III:12, the metaphor drawn: the ascetic ideal's knower against the section's knower</text>

  <!-- left panel: the will-less subject -->
  <text class="blue" x="160" y="42" text-anchor="middle">the will-less subject of knowledge</text>
  <rect class="box-b" x="16" y="52" width="290" height="230" rx="6"/>
  <!-- eye with rays in all directions -->
  <g transform="translate(160,150)">
    <line class="ray-b" x1="0" y1="0" x2="0" y2="-70"/>
    <line class="ray-b" x1="0" y1="0" x2="49" y2="-49"/>
    <line class="ray-b" x1="0" y1="0" x2="70" y2="0"/>
    <line class="ray-b" x1="0" y1="0" x2="49" y2="49"/>
    <line class="ray-b" x1="0" y1="0" x2="0" y2="70"/>
    <line class="ray-b" x1="0" y1="0" x2="-49" y2="49"/>
    <line class="ray-b" x1="0" y1="0" x2="-70" y2="0"/>
    <line class="ray-b" x1="0" y1="0" x2="-49" y2="-49"/>
    <path class="eye" d="M -26 0 Q 0 -20 26 0 Q 0 20 -26 0 Z"/>
    <circle class="pupil" r="6"/>
    <line class="strike" x1="-40" y1="-40" x2="40" y2="40"/>
    <line class="strike" x1="40" y1="-40" x2="-40" y2="40"/>
  </g>
  <text class="label small" x="160" y="236" text-anchor="middle">"an eye that is to have no direction whatever"</text>
  <text class="muted small" x="160" y="250" text-anchor="middle">no affect; the active, interpreting forces "tied off"</text>
  <text class="label small" x="160" y="266" text-anchor="middle">"a non-concept and an absurdity"</text>
  <text class="muted small" x="160" y="278" text-anchor="middle">(Widersinn und Unbegriff von Auge)</text>

  <!-- right panel: section 12's knower -->
  <text class="amber" x="470" y="42" text-anchor="middle">§12's knower</text>
  <rect class="box-a" x="334" y="52" width="290" height="230" rx="6"/>
  <!-- object at centre -->
  <rect class="obj" x="452" y="146" width="36" height="28" rx="4"/>
  <text class="muted small" x="496" y="204">"the same matter"</text>
  <!-- five eyes around, each with one arrow to object and an affect label -->
  <g transform="translate(400,90)">
    <path class="eye" d="M -14 0 Q 0 -10 14 0 Q 0 10 -14 0 Z"/><circle class="pupil" r="3.5"/>
    <path class="ray-a" d="M 12 8 L 50 52"/><path class="ray-a" d="M 44 44 L 50 52 L 41 51"/>
    <text class="label small" x="-18" y="-10" text-anchor="end">suspicion</text>
  </g>
  <g transform="translate(542,90)">
    <path class="eye" d="M -14 0 Q 0 -10 14 0 Q 0 10 -14 0 Z"/><circle class="pupil" r="3.5"/>
    <path class="ray-a" d="M -12 8 L -52 52"/><path class="ray-a" d="M -46 44 L -52 52 L -43 51"/>
    <text class="label small" x="18" y="-10">gratitude</text>
  </g>
  <g transform="translate(372,160)">
    <path class="eye" d="M -14 0 Q 0 -10 14 0 Q 0 10 -14 0 Z"/><circle class="pupil" r="3.5"/>
    <path class="ray-a" d="M 16 0 L 76 0"/><path class="ray-a" d="M 68 -5 L 76 0 L 68 5"/>
    <text class="label small" x="0" y="22" text-anchor="middle">contempt</text>
  </g>
  <g transform="translate(570,160)">
    <path class="eye" d="M -14 0 Q 0 -10 14 0 Q 0 10 -14 0 Z"/><circle class="pupil" r="3.5"/>
    <path class="ray-a" d="M -16 0 L -78 0"/><path class="ray-a" d="M -70 -5 L -78 0 L -70 5"/>
    <text class="label small" x="0" y="22" text-anchor="middle">curiosity</text>
  </g>
  <g transform="translate(470,232)">
    <path class="eye" d="M -14 0 Q 0 -10 14 0 Q 0 10 -14 0 Z"/><circle class="pupil" r="3.5"/>
    <path class="ray-a" d="M 0 -10 L 0 -52"/><path class="ray-a" d="M -5 -44 L 0 -52 L 5 -44"/>
    <text class="label small" x="24" y="4">fear</text>
  </g>
  <text class="label small" x="470" y="262" text-anchor="middle">each eye directed and affect-laden;</text>
  <text class="label small" x="470" y="276" text-anchor="middle">more eyes on one matter, a more complete "concept"</text>

  <path class="rule" d="M 16 296 L 624 296"/>
  <text class="muted small" x="16" y="314">Removing direction removes seeing; adding directed eyes on one matter is what §12 calls "objectivity".</text>
</svg>

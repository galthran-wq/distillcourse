<svg viewBox="0 0 640 358" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .head { fill: currentColor; font-weight: 600; }
    .box { fill: none; stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.3; }
    .box-b { fill: none; stroke: #4c8dd6; stroke-width: 1.8; }
    .box-a { fill: none; stroke: #e2903a; stroke-width: 1.8; }
    .link { stroke: currentColor; stroke-opacity: 0.7; stroke-width: 1.6; fill: none; }
    .rule { stroke: currentColor; stroke-opacity: 0.3; stroke-width: 1; }
  </style>
  <text class="muted small" x="16" y="18">Z II "On Immaculate Perception" mapped onto GM III:6 and III:12</text>
  <text class="head small" x="150" y="40" text-anchor="middle">the speech (1883)</text>
  <text class="head small" x="470" y="40" text-anchor="middle">the argued works (1887)</text>

  <!-- row 1 -->
  <rect class="box" x="16" y="48" width="268" height="48" rx="5"/>
  <text class="label small" x="150" y="67" text-anchor="middle">"a mirror with a hundred eyes"</text>
  <text class="muted small" x="150" y="83" text-anchor="middle">desiring nothing from things</text>
  <path class="link" d="M 284 72 L 344 72"/><path class="link" d="M 336 67 L 344 72 L 336 77"/>
  <rect class="box" x="346" y="48" width="278" height="48" rx="5"/>
  <text class="label small" x="485" y="67" text-anchor="middle">§12's will-less subject: many eyes, no direction</text>
  <text class="amber small" x="485" y="83" text-anchor="middle">§12's many eyes each carry an affect</text>

  <!-- row 2 -->
  <rect class="box" x="16" y="106" width="268" height="48" rx="5"/>
  <text class="label small" x="150" y="125" text-anchor="middle">"to look upon life without desire"</text>
  <text class="muted small" x="150" y="141" text-anchor="middle">"with dead will", "cold and ashen grey"</text>
  <path class="link" d="M 284 130 L 344 130"/><path class="link" d="M 336 125 L 344 130 L 336 135"/>
  <rect class="box" x="346" y="106" width="278" height="48" rx="5"/>
  <text class="label small" x="485" y="125" text-anchor="middle">§6's "disinterested contemplation"</text>
  <text class="muted small" x="485" y="141" text-anchor="middle">Schopenhauer's stilled will, read as a will's relief</text>

  <!-- row 3 -->
  <rect class="box" x="16" y="164" width="268" height="48" rx="5"/>
  <text class="label small" x="150" y="183" text-anchor="middle">"Where is innocence? Where there is</text>
  <text class="label small" x="150" y="199" text-anchor="middle">will to beget"</text>
  <path class="link" d="M 284 188 L 344 188"/><path class="link" d="M 336 183 L 344 188 L 336 193"/>
  <rect class="box" x="346" y="164" width="278" height="48" rx="5"/>
  <text class="label small" x="485" y="183" text-anchor="middle">§12's "objectivity": the directed, wanting eye,</text>
  <text class="label small" x="485" y="199" text-anchor="middle">one's for and against in one's power</text>

  <path class="rule" d="M 16 226 L 624 226"/>
  <text class="muted small" x="16" y="244">the charge</text>

  <rect class="box-b" x="16" y="252" width="296" height="76" rx="6"/>
  <text class="blue" x="26" y="270">the speech: hypocrisy</text>
  <text class="label small" x="26" y="286">"you lechers": desire disguised as its absence;</text>
  <text class="label small" x="26" y="300">needs §6's form, a reported absence of will</text>
  <text class="label small" x="26" y="314">read as a will's disguise</text>

  <rect class="box-a" x="328" y="252" width="296" height="76" rx="6"/>
  <text class="amber" x="338" y="270">§12: absurdity</text>
  <text class="label small" x="338" y="286">"a non-concept and an absurdity": nothing there</text>
  <text class="label small" x="338" y="300">to lie about; needs only the premise that</text>
  <text class="label small" x="338" y="314">seeing is seeing-something</text>

  <text class="muted small" x="16" y="348">The argued register carries the second charge without a fact about anyone's motives, and the first only with one.</text>
</svg>

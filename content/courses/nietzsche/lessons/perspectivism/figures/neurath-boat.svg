<svg viewBox="0 0 640 322" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .box-b { fill: none; stroke: #4c8dd6; stroke-width: 1.8; }
    .box-a { fill: none; stroke: #e2903a; stroke-width: 1.8; }
    .hull { fill: none; stroke: currentColor; stroke-width: 1.8; }
    .plank { stroke: currentColor; stroke-opacity: 0.45; stroke-width: 1; }
    .plank-new { stroke: #e2903a; stroke-width: 3; }
    .land { fill: currentColor; fill-opacity: 0.12; stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1; }
    .sea { stroke: #4c8dd6; stroke-width: 1.4; fill: none; opacity: 0.7; }
    .strike { stroke: currentColor; stroke-opacity: 0.55; stroke-width: 2.2; }
    .rule { stroke: currentColor; stroke-opacity: 0.3; stroke-width: 1; }
  </style>
  <text class="muted small" x="16" y="18">Anti-foundationalism's image (Neurath, Quine; Clark ch. 2 §3): where a belief system can be repaired</text>

  <!-- left: dry dock, struck -->
  <text class="blue" x="160" y="44" text-anchor="middle">the foundationalist: repaired in dry dock</text>
  <rect class="box-b" x="16" y="52" width="290" height="200" rx="6"/>
  <!-- land -->
  <rect class="land" x="28" y="176" width="266" height="24" rx="3"/>
  <text class="muted small" x="161" y="192" text-anchor="middle">dry land: beliefs that justify themselves</text>
  <!-- hull on blocks -->
  <path class="hull" d="M 70 118 L 90 168 L 232 168 L 252 118 Z"/>
  <line class="plank" x1="78" y1="135" x2="244" y2="135"/>
  <line class="plank" x1="84" y1="151" x2="238" y2="151"/>
  <rect class="land" x="100" y="168" width="12" height="8"/>
  <rect class="land" x="210" y="168" width="12" height="8"/>
  <line class="strike" x1="60" y1="100" x2="262" y2="180"/>
  <line class="strike" x1="262" y1="100" x2="60" y2="180"/>
  <text class="label small" x="161" y="220" text-anchor="middle">Descartes: no repair while afloat; first the</text>
  <text class="label small" x="161" y="234" text-anchor="middle">indubitable beliefs, then everything on them</text>

  <!-- right: at sea -->
  <text class="amber" x="470" y="44" text-anchor="middle">the anti-foundationalist: rebuilt at sea</text>
  <rect class="box-a" x="334" y="52" width="290" height="200" rx="6"/>
  <!-- sea -->
  <path class="sea" d="M 346 176 q 12 -8 24 0 t 24 0 t 24 0 t 24 0 t 24 0 t 24 0 t 24 0 t 24 0 t 24 0 t 24 0 t 24 0"/>
  <path class="sea" d="M 346 190 q 12 -8 24 0 t 24 0 t 24 0 t 24 0 t 24 0 t 24 0 t 24 0 t 24 0 t 24 0 t 24 0 t 24 0"/>
  <!-- hull afloat -->
  <path class="hull" d="M 388 118 L 408 168 L 550 168 L 570 118 Z"/>
  <line class="plank" x1="396" y1="135" x2="562" y2="135"/>
  <line class="plank-new" x1="402" y1="151" x2="470" y2="151"/>
  <line class="plank" x1="474" y1="151" x2="556" y2="151"/>
  <text class="amber small" x="402" y="96">this plank replaced now</text>
  <text class="muted small" x="556" y="110" text-anchor="end">the others hold it up</text>
  <text class="label small" x="479" y="220" text-anchor="middle">every plank replaceable, none exempt, none</text>
  <text class="label small" x="479" y="234" text-anchor="middle">certain; "we cannot inquire into a belief except</text>
  <text class="label small" x="479" y="248" text-anchor="middle">by using other beliefs"</text>

  <path class="rule" d="M 16 266 L 624 266"/>
  <text class="label small" x="16" y="282">What the mature Nietzsche adds: there is no dry land. The thing-in-itself the foundationalist</text>
  <text class="label small" x="16" y="296">wanted to measure the boat against is a contradiction, so a belief's falling short of it is not</text>
  <text class="label small" x="16" y="310">a defect; §12's "eye with no direction" is the dry dock.</text>
</svg>

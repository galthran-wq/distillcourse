<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .box { fill: none; stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.3; }
    .box-b { fill: none; stroke: #4c8dd6; stroke-width: 1.8; }
    .box-a { fill: none; stroke: #e2903a; stroke-width: 1.8; }
    .ghost { fill: none; stroke: currentColor; stroke-opacity: 0.4; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .link { stroke: currentColor; stroke-opacity: 0.7; stroke-width: 1.6; fill: none; }
    .bad { stroke: #e2903a; stroke-width: 1.6; fill: none; stroke-dasharray: 4 3; }
    .bar { stroke: #e2903a; stroke-width: 3; }
    .rule { stroke: currentColor; stroke-opacity: 0.3; stroke-width: 1; }
  </style>
  <text class="muted small" x="16" y="18">The self-refutation charge (Danto 1965) as a tree, and where it breaks</text>

  <!-- tree, left column -->
  <rect class="box" x="24" y="34" width="272" height="36" rx="5"/>
  <text class="label" x="160" y="57" text-anchor="middle">(P) every view is an interpretation</text>
  <path class="link" d="M 160 70 L 160 88"/><path class="link" d="M 155 82 L 160 88 L 165 82"/>

  <rect class="box" x="24" y="90" width="272" height="36" rx="5"/>
  <text class="label" x="160" y="113" text-anchor="middle">so P is itself an interpretation</text>
  <path class="link" d="M 160 126 L 160 144"/><path class="link" d="M 155 138 L 160 144 L 165 138"/>

  <rect class="box" x="24" y="146" width="272" height="50" rx="5"/>
  <text class="label" x="160" y="166" text-anchor="middle">so P is possibly false:</text>
  <text class="label small" x="160" y="182" text-anchor="middle">some views may not be interpretations</text>
  <path class="bad" d="M 160 196 L 160 222"/><path class="bad" d="M 155 216 L 160 222 L 165 216"/>
  <line class="bar" x1="140" y1="209" x2="180" y2="209"/>
  <text class="amber small" x="190" y="213">invalid step</text>

  <rect class="ghost" x="24" y="224" width="272" height="50" rx="5"/>
  <text class="muted" x="160" y="244" text-anchor="middle">so P is false:</text>
  <text class="muted small" x="160" y="260" text-anchor="middle">some views are not interpretations</text>

  <!-- answers, right column -->
  <rect class="box-a" x="330" y="34" width="294" height="118" rx="6"/>
  <text class="amber" x="342" y="54">Clark (the working reading)</text>
  <text class="label small" x="342" y="72">anti-foundationalism says of every belief that it</text>
  <text class="label small" x="342" y="86">may be false, and of none that it is; applied to</text>
  <text class="label small" x="342" y="100">itself, P yields only that P is revisable</text>
  <text class="label small" x="342" y="120">"perspectivism is, of course, a perspectival truth,</text>
  <text class="label small" x="342" y="134">but this does not imply that any competing</text>
  <text class="label small" x="342" y="148">claim is also true"</text>

  <rect class="box-b" x="330" y="164" width="294" height="110" rx="6"/>
  <text class="blue" x="342" y="184">Nehamas (the rival, Module 7)</text>
  <text class="label small" x="342" y="202">the inference "equates the fact that P is an</text>
  <text class="label small" x="342" y="216">interpretation and therefore possibly false with</text>
  <text class="label small" x="342" y="230">the fact that it is actually false"; P is refuted</text>
  <text class="label small" x="342" y="244">only by producing a view that is actually not an</text>
  <text class="label small" x="342" y="258">interpretation, which nobody has</text>

  <path class="rule" d="M 16 290 L 624 290"/>
  <text class="label small" x="16" y="308">Both readings break the tree at the same step and disagree about what P claims: no self-justifying belief (Clark), or</text>
  <text class="label small" x="16" y="322">selection the viewer cannot see while viewing (Nehamas), which Clark says lets the falsification thesis back in.</text>
</svg>

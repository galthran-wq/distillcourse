<svg viewBox="0 0 640 368" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .head { fill: currentColor; font-weight: 600; }
    .box { fill: none; stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.3; }
    .band { fill: #e2903a; fill-opacity: 0.12; stroke: #e2903a; stroke-width: 1.8; }
    .rule { stroke: currentColor; stroke-opacity: 0.3; stroke-width: 1; }
  </style>
  <text class="muted small" x="16" y="18">Three construals of GM III:12 (SEP §6.2), sorted by what each needs the section to say</text>

  <!-- highlight band over first two columns -->
  <rect class="band" x="18" y="30" width="400" height="286" rx="7"/>
  <text class="amber small" x="218" y="46" text-anchor="middle">the naturalist reading's pick: both columns, affects as type-facts</text>

  <!-- column 1 -->
  <rect class="box" x="24" y="56" width="188" height="254" rx="5"/>
  <text class="head" x="118" y="76" text-anchor="middle">epistemological</text>
  <text class="muted small" x="118" y="90" text-anchor="middle">Clark, Leiter</text>
  <text class="muted small" x="32" y="112">the claim</text>
  <text class="label small" x="32" y="126">about justification: no self-</text>
  <text class="label small" x="32" y="140">justifying beliefs, no view</text>
  <text class="label small" x="32" y="154">from nowhere</text>
  <text class="muted small" x="32" y="178">§12 must say</text>
  <text class="label small" x="32" y="192">the eye with no direction is</text>
  <text class="label small" x="32" y="206">the foundationalist's neutral</text>
  <text class="label small" x="32" y="220">corner ("knowledge in itself")</text>
  <text class="muted small" x="32" y="244">it costs</text>
  <text class="label small" x="32" y="258">the affects become one</text>
  <text class="label small" x="32" y="272">perspective-factor among</text>
  <text class="label small" x="32" y="286">beliefs and interests</text>

  <!-- column 2 -->
  <rect class="box" x="224" y="56" width="188" height="254" rx="5"/>
  <text class="head" x="318" y="76" text-anchor="middle">psychological</text>
  <text class="muted small" x="318" y="90" text-anchor="middle">Gemes</text>
  <text class="muted small" x="232" y="112">the claim</text>
  <text class="label small" x="232" y="126">a doctrine within psychology:</text>
  <text class="label small" x="232" y="140">how drives and affects relate,</text>
  <text class="label small" x="232" y="154">and who commands whom</text>
  <text class="muted small" x="232" y="178">§12 must say</text>
  <text class="label small" x="232" y="192">knowing is an affect's work and</text>
  <text class="label small" x="232" y="206">"objectivity" a strong type's</text>
  <text class="label small" x="232" y="220">mastery of its for and against</text>
  <text class="muted small" x="232" y="244">it costs</text>
  <text class="label small" x="232" y="258">"knowledge in itself" becomes</text>
  <text class="label small" x="232" y="272">a symptom to be read, not a</text>
  <text class="label small" x="232" y="286">thesis to be refuted</text>

  <!-- column 3 -->
  <rect class="box" x="428" y="56" width="196" height="254" rx="5"/>
  <text class="blue" x="526" y="76" text-anchor="middle">ontological</text>
  <text class="muted small" x="526" y="90" text-anchor="middle">Heidegger, Deleuze, Richardson</text>
  <text class="muted small" x="436" y="112">the claim</text>
  <text class="label small" x="436" y="126">about what living things are:</text>
  <text class="label small" x="436" y="140">perspectives as will-to-power</text>
  <text class="label small" x="436" y="154">centres, the lizard's tuned ear</text>
  <text class="muted small" x="436" y="178">§12 must say</text>
  <text class="label small" x="436" y="192">"the perspectival is the basic</text>
  <text class="label small" x="436" y="206">condition of all life"</text>
  <text class="muted small" x="436" y="244">it costs</text>
  <text class="label small" x="436" y="258">the textual ground is the</text>
  <text class="label small" x="436" y="272">notebooks; §12 says nothing</text>
  <text class="label small" x="436" y="286">about lizards or about life</text>

  <path class="rule" d="M 16 330 L 624 330"/>
  <text class="muted small" x="16" y="346">The evidence rules keep a notebook formula from grounding a reading of a published section;</text>
  <text class="muted small" x="16" y="358">the third column is tested in the Heidegger lesson.</text>
</svg>

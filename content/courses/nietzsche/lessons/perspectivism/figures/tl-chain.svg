<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .box { fill: none; stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.3; }
    .box-a { fill: none; stroke: #e2903a; stroke-width: 1.8; stroke-dasharray: 5 4; }
    .link { stroke: #4c8dd6; stroke-width: 1.8; fill: none; }
    .ghost { stroke: #e2903a; stroke-width: 1.4; fill: none; stroke-dasharray: 3 3; opacity: 0.8; }
    .bar { stroke: currentColor; stroke-width: 2.4; stroke-opacity: 0.7; }
    .rule { stroke: currentColor; stroke-opacity: 0.3; stroke-width: 1; }
  </style>
  <text class="muted small" x="16" y="18">Truth and Lie (1873): "a nerve stimulus, first transferred into an image: first metaphor.</text>
  <text class="muted small" x="16" y="32">The image again copied into a sound: second metaphor."</text>

  <!-- thing-in-itself dashed box -->
  <rect class="box-a" x="16" y="78" width="124" height="52" rx="6"/>
  <text class="amber" x="78" y="100" text-anchor="middle">the thing-in-itself</text>
  <text class="muted small" x="78" y="116" text-anchor="middle">"the enigmatic X"</text>
  <path class="ghost" d="M 140 104 L 190 104"/>
  <line class="bar" x1="166" y1="92" x2="166" y2="116"/>
  <text class="muted small" x="166" y="68" text-anchor="middle">never reached</text>

  <!-- chain -->
  <rect class="box" x="192" y="78" width="118" height="52" rx="6"/>
  <text class="label" x="251" y="109" text-anchor="middle">nerve stimulus</text>
  <text class="muted small" x="251" y="150" text-anchor="middle">"a wholly subjective</text>
  <text class="muted small" x="251" y="163" text-anchor="middle">excitation"</text>

  <path class="link" d="M 310 104 L 354 104"/>
  <path class="link" d="M 346 99 L 354 104 L 346 109"/>
  <text class="blue small" x="332" y="68" text-anchor="middle">metaphor 1</text>

  <rect class="box" x="356" y="78" width="118" height="52" rx="6"/>
  <text class="label" x="415" y="109" text-anchor="middle">image</text>
  <text class="muted small" x="415" y="150" text-anchor="middle">"a complete leap into</text>
  <text class="muted small" x="415" y="163" text-anchor="middle">a new sphere"</text>

  <path class="link" d="M 474 104 L 518 104"/>
  <path class="link" d="M 510 99 L 518 104 L 510 109"/>
  <text class="blue small" x="496" y="68" text-anchor="middle">metaphor 2</text>

  <rect class="box" x="520" y="78" width="104" height="52" rx="6"/>
  <text class="label" x="572" y="109" text-anchor="middle">sound, word</text>
  <text class="muted small" x="572" y="150" text-anchor="middle">"as the tone appears</text>
  <text class="muted small" x="572" y="163" text-anchor="middle">as a sand figure"</text>

  <path class="rule" d="M 16 184 L 624 184"/>
  <text class="label small" x="16" y="204">1873's conclusion: no link of the chain corresponds to the X, so "truths are illusions</text>
  <text class="label small" x="16" y="218">of which one has forgotten that they are such".</text>
  <text class="amber small" x="16" y="240">The premise the mature works reject: that there is an X for the chain to correspond to at all.</text>
  <text class="muted small" x="16" y="262">Chladni's deaf man sees the sand figure, finds its cause in the string's vibration, and swears he</text>
  <text class="muted small" x="16" y="276">now knows what "sound" is. Clark, ch. 3: the argument runs on a representational theory of</text>
  <text class="muted small" x="16" y="290">perception plus truth as correspondence to things-in-themselves.</text>
</svg>

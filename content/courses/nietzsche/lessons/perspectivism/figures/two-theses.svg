<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .head { fill: currentColor; font-weight: 600; font-size: 13px; }
    .box-b { fill: none; stroke: #4c8dd6; stroke-width: 1.8; }
    .box-a { fill: none; stroke: #e2903a; stroke-width: 1.8; }
    .link { stroke: currentColor; stroke-opacity: 0.7; stroke-width: 1.6; fill: none; }
    .strike { stroke: currentColor; stroke-opacity: 0.55; stroke-width: 2.2; }
    .rule { stroke: currentColor; stroke-opacity: 0.3; stroke-width: 1; }
  </style>
  <text class="muted small" x="16" y="18">One word, two theses: what "perspectivism" has been taken to claim</text>
  <text class="head" x="320" y="48" text-anchor="middle">"perspectivism"</text>
  <path class="link" d="M 320 56 L 320 74 L 160 74 L 160 92"/>
  <path class="link" d="M 320 74 L 480 74 L 480 92"/>
  <path class="link" d="M 155 86 L 160 92 L 165 86"/>
  <path class="link" d="M 475 86 L 480 92 L 485 86"/>

  <!-- left: falsification thesis, struck -->
  <rect class="box-b" x="24" y="96" width="272" height="186" rx="6"/>
  <text class="blue" x="160" y="118" text-anchor="middle">the falsification thesis, 1873</text>
  <text class="label small" x="36" y="140">all human truths are illusions, because</text>
  <text class="label small" x="36" y="154">they fail to correspond to the thing-in-itself:</text>
  <text class="label small" x="36" y="168">"the pure truth apart from consequences"</text>
  <text class="muted small" x="36" y="192">passages</text>
  <text class="label small" x="36" y="206">Truth and Lie (unpublished, 1873): the chain,</text>
  <text class="label small" x="36" y="220">the leaf, "truths are illusions"</text>
  <text class="label small" x="36" y="240">residue: GS 354's word Fälschung, in a section</text>
  <text class="label small" x="36" y="254">that disowns the thing-in-itself outright</text>
  <line class="strike" x1="40" y1="112" x2="280" y2="270"/>
  <text class="muted small" x="160" y="298" text-anchor="middle">needs a thing-in-itself to fall short of</text>

  <!-- right: anti-foundationalism, boxed -->
  <rect class="box-a" x="344" y="96" width="272" height="186" rx="6"/>
  <text class="amber" x="480" y="118" text-anchor="middle">anti-foundationalism, 1887</text>
  <text class="label small" x="356" y="140">no view from nowhere: no belief justifies</text>
  <text class="label small" x="356" y="154">itself, justification runs through other</text>
  <text class="label small" x="356" y="168">beliefs, and there is no thing-in-itself</text>
  <text class="label small" x="356" y="182">for a perspective to fall short of</text>
  <text class="muted small" x="356" y="206">passages</text>
  <text class="label small" x="356" y="220">GM III:12 (only a perspectival "knowing")</text>
  <text class="label small" x="356" y="234">BGE 22 ("interpretation, not text")</text>
  <text class="label small" x="356" y="248">GS 374 ("we cannot see around our corner")</text>
  <text class="muted small" x="480" y="298" text-anchor="middle">denies the concept the left box needs</text>

  <path class="rule" d="M 16 312 L 624 312"/>
  <text class="muted small" x="16" y="330">Clark: the first rests on a correspondence to things-in-themselves that the second calls a contradiction.</text>
</svg>

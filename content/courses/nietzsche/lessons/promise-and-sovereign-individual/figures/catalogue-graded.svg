<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10px; }
    .tag { fill: currentColor; font-weight: 600; }
    .box { fill: none; stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.2; }
    .bracket { stroke: currentColor; stroke-opacity: 0.7; stroke-width: 1.4; fill: none; }
    .bracket-a { stroke: #e2903a; stroke-width: 1.6; fill: none; stroke-dasharray: 5 3; }
    .amber { fill: #e2903a; font-weight: 600; }
    .green { fill: #5aa46a; font-weight: 600; }
    .rule { stroke: currentColor; stroke-opacity: 0.3; stroke-width: 1; }
  </style>

  <text class="tag" x="16" y="20">II:3's catalogue: "the old German punishments"</text>

  <!-- row of eight -->
  <rect class="box" x="16" y="36" width="70" height="66" rx="4"/>
  <text class="label small" x="51" y="56" text-anchor="middle">stoning</text>
  <text class="muted small" x="51" y="84" text-anchor="middle">legend: the</text>
  <text class="muted small" x="51" y="96" text-anchor="middle">millstone</text>

  <rect class="box" x="92" y="36" width="70" height="66" rx="4"/>
  <text class="label small" x="127" y="56" text-anchor="middle">breaking on</text>
  <text class="label small" x="127" y="68" text-anchor="middle">the wheel</text>
  <text class="muted small" x="127" y="84" text-anchor="middle">"German</text>
  <text class="muted small" x="127" y="96" text-anchor="middle">speciality"</text>

  <rect class="box" x="168" y="36" width="70" height="66" rx="4"/>
  <text class="label small" x="203" y="56" text-anchor="middle">impaling</text>
  <text class="muted small" x="203" y="84" text-anchor="middle">"the stake"</text>

  <rect class="box" x="244" y="36" width="70" height="66" rx="4"/>
  <text class="label small" x="279" y="56" text-anchor="middle">quartering</text>
  <text class="label small" x="279" y="68" text-anchor="middle">by horses</text>
  <text class="muted small" x="279" y="84" text-anchor="middle">torn or</text>
  <text class="muted small" x="279" y="96" text-anchor="middle">trampled</text>

  <rect class="box" x="320" y="36" width="70" height="66" rx="4"/>
  <text class="label small" x="355" y="56" text-anchor="middle">boiling in</text>
  <text class="label small" x="355" y="68" text-anchor="middle">oil or wine</text>
  <text class="muted small" x="355" y="84" text-anchor="middle">"still in the</text>
  <text class="muted small" x="355" y="96" text-anchor="middle">14th–15th c."</text>

  <rect class="box" x="396" y="36" width="70" height="66" rx="4"/>
  <text class="label small" x="431" y="56" text-anchor="middle">flaying</text>
  <text class="muted small" x="431" y="84" text-anchor="middle">"cutting into</text>
  <text class="muted small" x="431" y="96" text-anchor="middle">strips"</text>

  <rect class="box" x="472" y="36" width="70" height="66" rx="4"/>
  <text class="label small" x="507" y="56" text-anchor="middle">flesh cut</text>
  <text class="label small" x="507" y="68" text-anchor="middle">from breast</text>

  <rect class="box" x="548" y="36" width="70" height="66" rx="4"/>
  <text class="label small" x="583" y="56" text-anchor="middle">honey</text>
  <text class="label small" x="583" y="68" text-anchor="middle">and flies</text>
  <text class="muted small" x="583" y="84" text-anchor="middle">"under a</text>
  <text class="muted small" x="583" y="96" text-anchor="middle">burning sun"</text>

  <!-- documented bracket -->
  <path class="bracket" d="M 16 116 L 16 126 L 618 126 L 618 116"/>
  <path class="bracket" d="M 317 126 L 317 136"/>
  <text class="green" x="317" y="152" text-anchor="middle">documented: cruelty in the old penal ordinances (Strafordnungen)</text>
  <text class="muted small" x="317" y="167" text-anchor="middle">the durable element of II:13, the act, checkable against the record</text>

  <!-- inferred bracket -->
  <path class="bracket-a" d="M 16 186 L 16 196 L 618 196 L 618 186"/>
  <path class="bracket-a" d="M 317 196 L 317 206"/>
  <text class="amber" x="317" y="220" text-anchor="middle">inferred: "all that has its origin in that instinct</text>
  <text class="amber" x="317" y="234" text-anchor="middle">which guessed in pain the most powerful aid to mnemonics"</text>
  <text class="muted small" x="317" y="248" text-anchor="middle">the fluid element: a purpose, read back as the causa fiendi</text>

  <path class="rule" d="M 16 260 L 618 260"/>
  <text class="label small" x="317" y="276" text-anchor="middle">II:13 lists "punishment as the making of a memory" as one of eleven uses; II:12: a use is not an origin</text>
  <text class="muted small" x="317" y="291" text-anchor="middle">what survives: pain was a known mnemonic technique, which is all II:1's mechanism needs</text>
</svg>

<svg viewBox="0 0 640 270" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tag { fill: currentColor; font-weight: 600; }
    .panel-a { fill: none; stroke: #e2903a; stroke-width: 2; }
    .panel-b { fill: none; stroke: #4c8dd6; stroke-width: 1.4; stroke-opacity: 0.8; }
    .box { fill: none; stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.2; }
    .box-a { fill: none; stroke: #e2903a; stroke-width: 1.6; }
    .strike { stroke: currentColor; stroke-opacity: 0.7; stroke-width: 1.5; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .arrow { stroke: currentColor; stroke-opacity: 0.45; stroke-width: 1.3; fill: none; }
    .arrow-a { stroke: #e2903a; stroke-width: 2; fill: none; }
  </style>

  <text class="tag" x="16" y="20">Frame 3 of 3: the ripest fruit stands outside what bred it (GM II:2)</text>

  <!-- panel 1: done -->
  <rect class="panel-b" x="16" y="40" width="190" height="180" rx="6"/>
  <text class="blue" x="111" y="60" text-anchor="middle">the morality of custom</text>
  <rect class="box" x="30" y="74" width="162" height="48" rx="4"/>
  <text class="label small" x="111" y="93" text-anchor="middle">custom (Herkommen)</text>
  <text class="label small" x="111" y="109" text-anchor="middle">good = obedience as such</text>
  <rect class="box" x="30" y="138" width="162" height="48" rx="4"/>
  <text class="label small" x="111" y="157" text-anchor="middle">the individual</text>
  <text class="label small" x="111" y="173" text-anchor="middle">free = incalculable = evil</text>
  <path class="strike" d="M 34 142 L 188 182"/>
  <text class="muted small" x="111" y="208" text-anchor="middle">"in everything depends on himself"</text>

  <!-- panel 2: done -->
  <rect class="panel-b" x="225" y="40" width="190" height="180" rx="6"/>
  <text class="blue" x="320" y="60" text-anchor="middle">the social straitjacket</text>
  <rect class="box" x="239" y="74" width="162" height="64" rx="4"/>
  <text class="label small" x="320" y="93" text-anchor="middle">man made "necessary, uniform,</text>
  <text class="label small" x="320" y="109" text-anchor="middle">like among like, regular</text>
  <text class="label small" x="320" y="125" text-anchor="middle">and consequently calculable"</text>
  <text class="muted small" x="320" y="160" text-anchor="middle">"the whole prehistoric labour"</text>
  <text class="muted small" x="320" y="176" text-anchor="middle">yield: five or six "I will nots"</text>
  <text class="muted small" x="320" y="192" text-anchor="middle">retained (II:3)</text>
  <text class="muted small" x="320" y="208" text-anchor="middle">"only the means" (nur das Mittel)</text>

  <!-- panel 3: active -->
  <rect class="panel-a" x="434" y="40" width="190" height="180" rx="6"/>
  <text class="amber" x="529" y="60" text-anchor="middle">the ripest fruit</text>
  <rect class="box-a" x="448" y="74" width="162" height="80" rx="4"/>
  <text class="amber small" x="529" y="93" text-anchor="middle">the sovereign individual</text>
  <text class="label small" x="529" y="109" text-anchor="middle">"liberated again from the</text>
  <text class="label small" x="529" y="125" text-anchor="middle">morality of custom"; autonomous,</text>
  <text class="label small" x="529" y="141" text-anchor="middle">übersittlich; "may promise"</text>
  <text class="muted small" x="529" y="176" text-anchor="middle">"free": §9's word, with its</text>
  <text class="muted small" x="529" y="192" text-anchor="middle">sign reversed; the standpoint</text>
  <text class="muted small" x="529" y="208" text-anchor="middle">moved, the definition did not</text>

  <!-- arrows -->
  <path class="arrow" d="M 208 130 L 222 130"/>
  <path class="arrow-a" d="M 417 130 L 431 130"/>
  <path class="arrow-a" d="M 425 125 L 431 130 L 425 135"/>

  <text class="muted small" x="320" y="248" text-anchor="middle">"(for 'autonomous' and 'sittlich' exclude each other)": a tautology once morality is obedience</text>
</svg>

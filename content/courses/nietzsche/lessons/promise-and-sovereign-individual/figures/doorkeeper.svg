<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tag { fill: currentColor; font-weight: 600; }
    .box { fill: none; stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.3; }
    .box-d { fill: none; stroke: currentColor; stroke-opacity: 0.45; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .box-b { fill: none; stroke: #4c8dd6; stroke-width: 2; }
    .gate { fill: #e2903a; opacity: 0.9; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .flow { stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.3; fill: none; }
    .flow-d { stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.3; fill: none; stroke-dasharray: 3 3; }
    .chain { stroke: #4c8dd6; stroke-width: 1.6; fill: none; }
    .hook { stroke: #4c8dd6; stroke-width: 2; fill: none; }
    .rule { stroke: currentColor; stroke-opacity: 0.3; stroke-width: 1; }
  </style>

  <!-- left: the doorkeeper -->
  <text class="tag" x="16" y="22">II:1, first faculty: active forgetting</text>

  <rect class="box" x="16" y="62" width="44" height="30" rx="4"/>
  <text class="label small" x="38" y="81" text-anchor="middle">lived</text>
  <rect class="box" x="70" y="62" width="60" height="30" rx="4"/>
  <text class="label small" x="100" y="81" text-anchor="middle">experienced</text>
  <rect class="box" x="140" y="62" width="48" height="30" rx="4"/>
  <text class="label small" x="164" y="81" text-anchor="middle">taken in</text>
  <text class="muted small" x="102" y="52" text-anchor="middle">what is taken in, every moment</text>

  <!-- gate -->
  <rect class="gate" x="200" y="44" width="12" height="118" rx="3"/>
  <text class="amber small" x="206" y="178" text-anchor="middle">active forgetting</text>
  <text class="muted small" x="206" y="192" text-anchor="middle">the doorkeeper (Thürwärterin)</text>

  <!-- diverted downward -->
  <path class="flow" d="M 164 92 C 164 150, 130 190, 110 206"/>
  <path class="flow" d="M 108 198 L 110 206 L 117 202"/>
  <rect class="box-d" x="16" y="206" width="192" height="60" rx="5"/>
  <text class="label small" x="112" y="228" text-anchor="middle">digestion: "Einverseelung"</text>
  <text class="muted small" x="112" y="244" text-anchor="middle">below consciousness, like nutrition</text>
  <text class="muted small" x="112" y="258" text-anchor="middle">(Einverleibung); nothing enters</text>

  <!-- the chamber beyond the gate -->
  <rect class="box-d" x="222" y="44" width="112" height="118" rx="5"/>
  <text class="label small" x="278" y="70" text-anchor="middle">consciousness</text>
  <text class="muted small" x="278" y="88" text-anchor="middle">"a little tabula rasa"</text>
  <text class="muted small" x="278" y="112" text-anchor="middle">room for governing,</text>
  <text class="muted small" x="278" y="126" text-anchor="middle">foreseeing,</text>
  <text class="muted small" x="278" y="140" text-anchor="middle">predetermining</text>

  <path class="rule" d="M 346 30 L 346 290"/>

  <!-- right: the memory of the will -->
  <text class="tag" x="362" y="22">II:1, second faculty: memory of the will</text>

  <rect class="box-b" x="362" y="92" width="92" height="40" rx="5"/>
  <text class="blue" x="408" y="110" text-anchor="middle">"I will,</text>
  <text class="blue" x="408" y="125" text-anchor="middle">I will do"</text>

  <!-- hook holding the promise -->
  <path class="hook" d="M 408 92 L 408 62 C 408 50, 396 50, 396 58"/>
  <text class="blue small" x="418" y="54">memory of the will:</text>
  <text class="muted small" x="418" y="68">forgetting suspended (ausgehängt)</text>
  <text class="muted small" x="418" y="82">for this one case</text>

  <!-- chain -->
  <path class="chain" d="M 456 112 L 540 112"/>
  <circle cx="470" cy="112" r="3.5" fill="#4c8dd6"/>
  <circle cx="486" cy="112" r="3.5" fill="#4c8dd6"/>
  <circle cx="502" cy="112" r="3.5" fill="#4c8dd6"/>
  <circle cx="518" cy="112" r="3.5" fill="#4c8dd6"/>
  <circle cx="534" cy="112" r="3.5" fill="#4c8dd6"/>
  <rect class="box-b" x="546" y="92" width="78" height="40" rx="5"/>
  <text class="blue" x="585" y="116" text-anchor="middle">the act</text>

  <!-- what is interposed -->
  <rect class="box-d" x="456" y="150" width="168" height="62" rx="5"/>
  <text class="label small" x="540" y="170" text-anchor="middle">interposed: "a world of new</text>
  <text class="label small" x="540" y="184" text-anchor="middle">things, circumstances,</text>
  <text class="label small" x="540" y="198" text-anchor="middle">even acts of will"</text>
  <path class="flow-d" d="M 500 148 L 500 118"/>

  <text class="muted small" x="493" y="240" text-anchor="middle">"without this long chain of the will breaking"</text>
  <text class="muted small" x="493" y="262" text-anchor="middle">a selective holding of one will, not retention</text>

  <path class="rule" d="M 16 290 L 624 290"/>
  <text class="muted small" x="320" y="308" text-anchor="middle">precondition (II:1, last sentence): the promiser must himself have become calculable, regular, necessary</text>
</svg>

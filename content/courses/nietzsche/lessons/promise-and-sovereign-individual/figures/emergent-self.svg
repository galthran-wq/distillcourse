<svg viewBox="0 0 640 350" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tag { fill: currentColor; font-weight: 600; }
    .panel-b { fill: none; stroke: #4c8dd6; stroke-width: 1.6; }
    .panel-a { fill: none; stroke: #e2903a; stroke-width: 1.6; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .amber { fill: #e2903a; font-weight: 600; }
    .drive { fill: currentColor; fill-opacity: 0.12; stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1; }
    .drive-b { fill: #4c8dd6; fill-opacity: 0.25; stroke: #4c8dd6; stroke-width: 1.6; }
    .self-a { fill: none; stroke: #e2903a; stroke-width: 1.6; stroke-dasharray: 5 3; }
    .box-b { fill: none; stroke: #4c8dd6; stroke-width: 1.2; }
    .box-a { fill: none; stroke: #e2903a; stroke-width: 1.2; }
    .arrow { stroke: currentColor; stroke-width: 1.2; fill: none; }
    .arrow-a { stroke: #e2903a; stroke-width: 1.4; fill: none; }
    .gap { stroke: #e2903a; stroke-width: 2.2; fill: none; }
    .rule { stroke: currentColor; stroke-opacity: 0.3; stroke-width: 1; }
  </style>
  <defs>
    <marker id="es-head" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="currentColor"/>
    </marker>
    <marker id="es-head-a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#e2903a"/>
    </marker>
  </defs>

  <text class="tag" x="320" y="20" text-anchor="middle">Who holds the "I will do" of II:1 across the interval?</text>

  <!-- LEFT PANEL: the self as the dominant drive -->
  <rect class="panel-b" x="16" y="34" width="298" height="264" rx="6"/>
  <text class="blue" x="165" y="56" text-anchor="middle">the self as the dominant drive</text>
  <text class="muted small" x="165" y="70" text-anchor="middle">the deflation: "the self" = whichever drive rules</text>

  <circle class="drive-b" cx="90" cy="130" r="30"/>
  <text class="blue small" x="90" y="127" text-anchor="middle">drive a</text>
  <text class="blue small" x="90" y="140" text-anchor="middle">= "the self"</text>
  <circle class="drive" cx="170" cy="112" r="14"/>
  <text class="label small" x="170" y="116" text-anchor="middle">b</text>
  <circle class="drive" cx="205" cy="152" r="11"/>
  <text class="label small" x="205" y="156" text-anchor="middle">c</text>
  <circle class="drive" cx="160" cy="165" r="9"/>
  <text class="label small" x="160" y="169" text-anchor="middle">d</text>

  <rect class="box-b" x="40" y="190" width="100" height="26" rx="4"/>
  <text class="label small" x="90" y="207" text-anchor="middle">"I will do"</text>
  <path class="arrow" d="M 90 160 L 90 189" marker-end="url(#es-head)"/>

  <text class="label small" x="30" y="240">if b later outgrows a, "the self" is b,</text>
  <text class="label small" x="30" y="254">and a's "I will do" has no owner:</text>
  <text class="blue small" x="30" y="270">the chain of the will breaks by definition</text>

  <!-- RIGHT PANEL: the emergent self -->
  <rect class="panel-a" x="326" y="34" width="298" height="264" rx="6"/>
  <text class="amber" x="475" y="56" text-anchor="middle">the emergent self (Anderson)</text>
  <text class="muted small" x="475" y="70" text-anchor="middle">"a functional grouping of drives and affects"</text>

  <rect class="self-a" x="352" y="90" width="182" height="100" rx="14"/>
  <text class="amber small" x="443" y="86" text-anchor="middle">the self as a whole</text>

  <circle class="drive" cx="395" cy="132" r="22"/>
  <text class="label small" x="395" y="136" text-anchor="middle">a</text>
  <circle class="drive" cx="450" cy="118" r="14"/>
  <text class="label small" x="450" y="122" text-anchor="middle">b</text>
  <circle class="drive" cx="440" cy="164" r="9"/>
  <text class="label small" x="440" y="168" text-anchor="middle">d</text>

  <circle class="drive" cx="530" cy="140" r="13"/>
  <text class="label small" x="530" y="144" text-anchor="middle">c</text>
  <path class="gap" d="M 522 118 Q 528 140 522 162"/>
  <text class="amber small" x="548" y="120">the "gap":</text>
  <text class="label small" x="548" y="134">a part at odds</text>
  <text class="label small" x="548" y="148">with the whole,</text>
  <text class="label small" x="548" y="162">a broken</text>
  <text class="label small" x="548" y="176">promise</text>

  <rect class="box-a" x="393" y="204" width="100" height="26" rx="4"/>
  <text class="label small" x="443" y="221" text-anchor="middle">"I will do"</text>
  <path class="arrow-a" d="M 443 191 L 443 203" marker-end="url(#es-head-a)"/>

  <text class="label small" x="340" y="252">the whole holds the commitment while a, b, d</text>
  <text class="label small" x="340" y="266">change rank; it can be at odds with c and</text>
  <text class="amber small" x="340" y="282">still be itself: the chain holds</text>

  <path class="rule" d="M 16 312 L 624 312"/>
  <text class="muted small" x="320" y="330" text-anchor="middle">Left: a drive that later rules carries "the self" with it. Right: the commitment belongs to the grouping, not to any member.</text>
</svg>

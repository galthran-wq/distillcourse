<svg viewBox="0 0 640 262" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tag { fill: currentColor; font-weight: 600; }
    .word { fill: currentColor; font-weight: 700; font-size: 26px; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .box-a { fill: none; stroke: #e2903a; stroke-width: 1.6; }
    .box-b { fill: none; stroke: #4c8dd6; stroke-width: 1.6; }
    .box-old { fill: none; stroke: currentColor; stroke-opacity: 0.45; stroke-width: 1; stroke-dasharray: 3 3; }
    .strike { stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.2; }
    .arrow-a { stroke: #e2903a; stroke-width: 1.4; fill: none; }
    .arrow-b { stroke: #4c8dd6; stroke-width: 1.4; fill: none; }
    .arrow { stroke: currentColor; stroke-width: 1.2; fill: none; }
    .rule { stroke: currentColor; stroke-opacity: 0.3; stroke-width: 1; }
  </style>
  <defs>
    <marker id="pd-a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#e2903a"/>
    </marker>
    <marker id="pd-b" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#4c8dd6"/>
    </marker>
    <marker id="pd-c" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="currentColor"/>
    </marker>
  </defs>

  <text class="tag" x="320" y="20" text-anchor="middle">A persuasive definition (Stevenson 1938): keep the charge, swap the content</text>

  <text class="word" x="60" y="128" text-anchor="middle">"free"</text>
  <text class="muted small" x="60" y="146" text-anchor="middle">as used in II:2</text>

  <path class="arrow" d="M 100 108 L 150 76" marker-end="url(#pd-c)"/>
  <rect class="box-a" x="156" y="48" width="200" height="46" rx="5"/>
  <text class="amber small" x="256" y="66" text-anchor="middle">emotive charge</text>
  <text class="label small" x="256" y="82" text-anchor="middle">honour, approval, authority</text>
  <path class="arrow-a" d="M 358 71 L 430 71" marker-end="url(#pd-a)"/>
  <text class="amber small" x="394" y="63" text-anchor="middle">kept</text>
  <rect class="box-a" x="436" y="48" width="188" height="46" rx="5"/>
  <text class="label small" x="530" y="66" text-anchor="middle">the honour "free" carries in</text>
  <text class="label small" x="530" y="82" text-anchor="middle">the morality under attack</text>

  <path class="arrow" d="M 100 134 L 150 166" marker-end="url(#pd-c)"/>
  <rect class="box-old" x="156" y="146" width="200" height="60" rx="5"/>
  <text class="muted small" x="256" y="164" text-anchor="middle">descriptive content, old</text>
  <text class="label small" x="256" y="180" text-anchor="middle">a will that could have done otherwise</text>
  <text class="label small" x="256" y="194" text-anchor="middle">(I:13's substratum; BGE 21's causa sui)</text>
  <path class="strike" d="M 166 182 L 346 182"/>
  <path class="arrow-b" d="M 358 176 L 430 176" marker-end="url(#pd-b)"/>
  <text class="blue small" x="394" y="168" text-anchor="middle">replaced</text>
  <rect class="box-b" x="436" y="144" width="188" height="66" rx="5"/>
  <text class="blue small" x="530" y="159" text-anchor="middle">descriptive content, new</text>
  <text class="label small" x="530" y="173" text-anchor="middle">a bred reliability:</text>
  <text class="label small" x="530" y="187" text-anchor="middle">the long unbreakable will</text>
  <text class="label small" x="530" y="201" text-anchor="middle">(BGE 21's strong will)</text>

  <path class="rule" d="M 16 224 L 624 224"/>
  <text class="muted small" x="320" y="244" text-anchor="middle">On Leiter's reading II:2 does this to "free", "autonomous", "sovereign", "privilege" and "deserves".</text>
</svg>

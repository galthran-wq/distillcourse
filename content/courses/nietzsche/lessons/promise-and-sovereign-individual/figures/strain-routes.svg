<svg viewBox="0 0 640 370" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tag { fill: currentColor; font-weight: 600; }
    .box { fill: none; stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.3; }
    .box-a { fill: none; stroke: #e2903a; stroke-width: 1.8; }
    .box-b { fill: none; stroke: #4c8dd6; stroke-width: 1.8; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .strain { stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.4; fill: none; stroke-dasharray: 4 3; }
    .route-a { stroke: #e2903a; stroke-width: 2; fill: none; }
    .route-b { stroke: #4c8dd6; stroke-width: 2; fill: none; }
    .rule { stroke: currentColor; stroke-opacity: 0.3; stroke-width: 1; }
  </style>

  <!-- top boxes -->
  <rect class="box" x="16" y="14" width="284" height="66" rx="6"/>
  <text class="tag" x="158" y="34" text-anchor="middle">GM I:13</text>
  <text class="label small" x="158" y="50" text-anchor="middle">no "being" behind doing; the substratum</text>
  <text class="label small" x="158" y="64" text-anchor="middle">"free to express strength or not" is grammar</text>

  <rect class="box" x="340" y="14" width="284" height="66" rx="6"/>
  <text class="tag" x="482" y="34" text-anchor="middle">GM II:2</text>
  <text class="label small" x="482" y="50" text-anchor="middle">"this master of the free will, this sovereign";</text>
  <text class="label small" x="482" y="64" text-anchor="middle">"the consciousness of this rare freedom"</text>

  <path class="strain" d="M 302 47 L 338 47"/>
  <path class="strain" d="M 308 42 L 302 47 L 308 52"/>
  <path class="strain" d="M 332 42 L 338 47 L 332 52"/>
  <text class="muted small" x="320" y="94" text-anchor="middle">the strain: if "free" means what I:13 denies, one book contradicts itself in two sections</text>

  <!-- route A -->
  <text class="amber" x="158" y="114" text-anchor="middle">Route A: "free" names a type</text>
  <path class="route-a" d="M 158 118 L 158 130"/>
  <rect class="box-a" x="16" y="132" width="284" height="44" rx="5"/>
  <text class="label small" x="158" y="150" text-anchor="middle">BGE 21: "only a matter of strong and weak wills":</text>
  <text class="label small" x="158" y="164" text-anchor="middle">a "long unbreakable will" is a strong will</text>
  <path class="route-a" d="M 158 176 L 158 190"/>
  <rect class="box-a" x="16" y="192" width="284" height="56" rx="5"/>
  <text class="label small" x="158" y="210" text-anchor="middle">BGE 19: the commander's "affect of superiority"</text>
  <text class="label small" x="158" y="224" text-anchor="middle">(Überlegenheits-Affekt); II:2's sovereign knows</text>
  <text class="label small" x="158" y="238" text-anchor="middle">"what superiority (Überlegenheit) he has"</text>
  <path class="route-a" d="M 158 248 L 158 262"/>
  <path class="route-a" d="M 153 256 L 158 262 L 163 256"/>
  <rect class="box-a" x="16" y="264" width="284" height="62" rx="5"/>
  <text class="amber small" x="158" y="282" text-anchor="middle">a commonwealth of drives in which today's</text>
  <text class="amber small" x="158" y="296" text-anchor="middle">command is obeyed at the promised date</text>
  <text class="muted small" x="158" y="314" text-anchor="middle">Leiter: natural artefact, persuasive definitions</text>

  <!-- route B -->
  <text class="blue" x="482" y="114" text-anchor="middle">Route B: "free" names an achievement</text>
  <path class="route-b" d="M 482 118 L 482 130"/>
  <rect class="box-b" x="340" y="132" width="284" height="44" rx="5"/>
  <text class="label small" x="482" y="150" text-anchor="middle">I:13 read narrowly: it denies causa sui and</text>
  <text class="label small" x="482" y="164" text-anchor="middle">deserts, not the unity that makes one agent</text>
  <path class="route-b" d="M 482 176 L 482 190"/>
  <rect class="box-b" x="340" y="192" width="284" height="56" rx="5"/>
  <text class="label small" x="482" y="210" text-anchor="middle">BGE 19: "both the one who commands and the one</text>
  <text class="label small" x="482" y="224" text-anchor="middle">who obeys": the commander as an emergent whole</text>
  <text class="label small" x="482" y="238" text-anchor="middle">that holds one will through changes of its drives</text>
  <path class="route-b" d="M 482 248 L 482 262"/>
  <path class="route-b" d="M 477 256 L 482 262 L 487 256"/>
  <rect class="box-b" x="340" y="264" width="284" height="62" rx="5"/>
  <text class="blue small" x="482" y="282" text-anchor="middle">a self that gives itself the law it keeps;</text>
  <text class="blue small" x="482" y="296" text-anchor="middle">autonomy as a norm: attained by few</text>
  <text class="muted small" x="482" y="314" text-anchor="middle">Anderson: an achieved self; Gemes: agency free will</text>

  <path class="rule" d="M 16 340 L 624 340"/>
  <text class="muted small" x="320" y="358" text-anchor="middle">A pays with "liberated", "privilege", "deserves"; B pays with "ripest fruit" and "instinct"; both keep the Herkunft</text>
</svg>

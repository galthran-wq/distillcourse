<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tag { fill: currentColor; font-weight: 600; }
    .col-b { fill: none; stroke: #4c8dd6; stroke-width: 1.6; }
    .col-a { fill: none; stroke: #e2903a; stroke-width: 1.6; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .rule { stroke: currentColor; stroke-opacity: 0.3; stroke-width: 1; }
    .dot-b { fill: #4c8dd6; }
    .dot-a { fill: #e2903a; }
  </style>

  <text class="tag" x="320" y="20" text-anchor="middle">GM II:2, one paragraph, sorted by vocabulary</text>

  <!-- left column: artefact -->
  <rect class="col-b" x="16" y="34" width="298" height="256" rx="6"/>
  <text class="blue" x="165" y="56" text-anchor="middle">artefact vocabulary: the process</text>

  <circle class="dot-b" cx="34" cy="82" r="3"/>
  <text class="label small" x="44" y="86">"to breed an animal" (heranzüchten), II:1–2</text>
  <circle class="dot-b" cx="34" cy="112" r="3"/>
  <text class="label small" x="44" y="116">"where the tree at last ripens its fruits":</text>
  <text class="label small" x="44" y="130">"the ripest fruit on its tree"</text>
  <circle class="dot-b" cx="34" cy="156" r="3"/>
  <text class="label small" x="44" y="160">society and its morality of custom "bring to</text>
  <text class="label small" x="44" y="174">light what they were only the means to"</text>
  <circle class="dot-b" cx="34" cy="200" r="3"/>
  <text class="label small" x="44" y="204">"has sunk down to his lowest depth and has</text>
  <text class="label small" x="44" y="218">become an instinct, a dominating instinct"</text>
  <circle class="dot-b" cx="34" cy="244" r="3"/>
  <text class="label small" x="44" y="248">"the long history of the descent (Herkunft)</text>
  <text class="label small" x="44" y="262">of responsibility"</text>

  <!-- right column: achievement -->
  <rect class="col-a" x="326" y="34" width="298" height="256" rx="6"/>
  <text class="amber" x="475" y="56" text-anchor="middle">achievement vocabulary: the standing</text>

  <circle class="dot-a" cx="344" cy="82" r="3"/>
  <text class="label small" x="354" y="86">"liberated again from the morality of custom"</text>
  <circle class="dot-a" cx="344" cy="108" r="3"/>
  <text class="label small" x="354" y="112">"autonomous", "übersittlich"</text>
  <circle class="dot-a" cx="344" cy="134" r="3"/>
  <text class="label small" x="354" y="138">"may promise" (versprechen darf), not "can"</text>
  <circle class="dot-a" cx="344" cy="160" r="3"/>
  <text class="label small" x="354" y="164">"what has been achieved (errungen) and</text>
  <text class="label small" x="354" y="178">become flesh in him"</text>
  <circle class="dot-a" cx="344" cy="204" r="3"/>
  <text class="label small" x="354" y="208">"the extraordinary privilege of responsibility"</text>
  <circle class="dot-a" cx="344" cy="230" r="3"/>
  <text class="label small" x="354" y="234">"he 'deserves' all three" (trust, fear, reverence)</text>
  <circle class="dot-a" cx="344" cy="256" r="3"/>
  <text class="label small" x="354" y="260">"his measure of value" (Werthmaass)</text>

  <path class="rule" d="M 16 304 L 624 304"/>
  <text class="muted small" x="320" y="322" text-anchor="middle">Leiter reads the left column literally and the right as honorifics; Anderson reads the right literally and the left as the price</text>
</svg>

<svg viewBox="0 0 560 270" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .t { fill: currentColor; }
    .m { fill: currentColor; opacity: 0.55; }
    .s { font-size: 10.5px; }
    .xs { font-size: 9.5px; }
    .h { fill: currentColor; font-weight: 600; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .box { fill: none; stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.2; }
    .box-b { fill: none; stroke: #4c8dd6; stroke-width: 1.4; }
    .ring { fill: none; stroke: #e2903a; stroke-width: 1.6; stroke-dasharray: 4 3; }
    .arrow { stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.2; fill: none; }
    .arrow-a { stroke: #e2903a; stroke-width: 1.6; fill: none; }
  </style>
  <defs>
    <marker id="bl-ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor" opacity="0.6"/>
    </marker>
    <marker id="bl-aha" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#e2903a"/>
    </marker>
  </defs>
  <text class="h" x="16" y="22">BGE 15: the loop that closes on a causa sui</text>

  <rect class="box-b" x="210" y="40" width="140" height="36" rx="5"/>
  <text class="blue s" x="280" y="62" text-anchor="middle">our sense organs</text>

  <path class="arrow" d="M 350 66 C 420 80, 450 110, 452 150" marker-end="url(#bl-ah)"/>
  <text class="t xs" x="392" y="96">“the work of our organs”</text>
  <text class="m xs" x="392" y="109">(the claim under test)</text>

  <rect class="box" x="380" y="152" width="150" height="36" rx="5"/>
  <text class="t s" x="455" y="174" text-anchor="middle">the external world</text>

  <path class="arrow" d="M 380 176 L 236 176" marker-end="url(#bl-ah)"/>
  <text class="m xs" x="308" y="196" text-anchor="middle">contains, “as a piece of it”</text>

  <rect class="box" x="86" y="152" width="148" height="36" rx="5"/>
  <text class="t s" x="160" y="174" text-anchor="middle">our body, our organs</text>

  <path class="arrow-a" d="M 165 152 C 168 100, 180 72, 208 60" marker-end="url(#bl-aha)"/>
  <text class="amber xs" x="16" y="90">so our organs are</text>
  <text class="amber xs" x="16" y="103">the work of</text>
  <text class="amber xs" x="16" y="116">our organs</text>

  <circle class="ring" cx="304" cy="120" r="24"/>
  <text class="amber xs" x="304" y="118" text-anchor="middle">causa</text>
  <text class="amber xs" x="304" y="130" text-anchor="middle">sui</text>

  <text class="t xs" x="16" y="222">A physiology needs organs that are causes; the claim makes them their own cause, §4’s causa sui,</text>
  <text class="t xs" x="16" y="235">the mark the chapter placed on the true world, found inside the theory that was to abolish it.</text>
  <text class="m xs" x="16" y="256">Either the organs are real and sensation is not the only reality, or nothing is left to do the constructing.</text>
</svg>

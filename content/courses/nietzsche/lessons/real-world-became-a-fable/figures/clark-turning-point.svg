<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .t { fill: currentColor; }
    .m { fill: currentColor; opacity: 0.55; }
    .s { font-size: 10.5px; }
    .xs { font-size: 9.5px; }
    .h { fill: currentColor; font-weight: 600; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .axis { stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.4; }
    .tick { stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.2; }
    .dot { fill: currentColor; }
    .dot-a { fill: #e2903a; }
    .badge { fill: currentColor; opacity: 0.7; }
    .badge-a { fill: #e2903a; }
    .hinge { fill: none; stroke: #4c8dd6; stroke-width: 1.4; }
  </style>
  <text class="h" x="16" y="22">Clark’s turning point: the thing-in-itself goes in 1882–86, the denial of truth only after</text>

  <text class="amber xs" x="16" y="52">the thing-in-itself</text>
  <text class="blue xs" x="16" y="246">our truths</text>

  <line class="axis" x1="60" y1="150" x2="630" y2="150"/>
  <g>
    <line class="tick" x1="100" y1="144" x2="100" y2="156"/>
    <circle class="dot" cx="100" cy="150" r="4"/>
    <text class="t s" x="100" y="172" text-anchor="middle">1873</text>
    <text class="m xs" x="100" y="185" text-anchor="middle">Truth and Lie</text>
    <text class="t xs" x="100" y="74" text-anchor="middle">assumed: “the enigmatic X”;</text>
    <text class="t xs" x="100" y="87" text-anchor="middle">truth = correspondence to it</text>
    <text class="t xs" x="100" y="208" text-anchor="middle">“truths are illusions”:</text>
    <text class="m xs" x="100" y="221" text-anchor="middle">the falsification thesis</text>
  </g>
  <g>
    <line class="tick" x1="265" y1="144" x2="265" y2="156"/>
    <circle class="dot" cx="265" cy="150" r="4"/>
    <text class="t s" x="265" y="172" text-anchor="middle">1878</text>
    <text class="m xs" x="265" y="185" text-anchor="middle">Human, All Too Human</text>
    <circle class="badge" cx="265" cy="118" r="9"/>
    <text class="xs" x="265" y="122" text-anchor="middle" style="fill:#fff;font-weight:600">4</text>
    <text class="t xs" x="265" y="74" text-anchor="middle">superfluous, “a Homeric laugh”,</text>
    <text class="t xs" x="265" y="87" text-anchor="middle">but “cannot cut this head off”</text>
    <text class="t xs" x="265" y="208" text-anchor="middle">false against “strict science”;</text>
    <text class="m xs" x="265" y="221" text-anchor="middle">true world unknown, not denied</text>
  </g>
  <g>
    <line class="tick" x1="430" y1="144" x2="430" y2="156"/>
    <circle class="dot" cx="430" cy="150" r="4"/>
    <text class="t s" x="430" y="172" text-anchor="middle">1882–86</text>
    <text class="m xs" x="430" y="185" text-anchor="middle">Gay Science I–IV, BGE</text>
    <circle class="badge" cx="430" cy="118" r="9"/>
    <text class="xs" x="430" y="122" text-anchor="middle" style="fill:#fff;font-weight:600">5</text>
    <text class="t xs" x="430" y="74" text-anchor="middle">“not a mask on an unknown X”,</text>
    <text class="t xs" x="430" y="87" text-anchor="middle">a contradictio in adjecto</text>
    <text class="t xs" x="430" y="208" text-anchor="middle">still “a falsified world”;</text>
    <text class="m xs" x="430" y="221" text-anchor="middle">“why not a fiction?”</text>
  </g>
  <g>
    <line class="tick" x1="574" y1="144" x2="574" y2="156"/>
    <circle class="dot-a" cx="574" cy="150" r="5"/>
    <text class="amber s" x="574" y="172" text-anchor="middle">1887–88</text>
    <text class="m xs" x="574" y="185" text-anchor="middle">GM, Twilight, Antichrist</text>
    <circle class="badge-a" cx="574" cy="118" r="9"/>
    <text class="xs" x="574" y="122" text-anchor="middle" style="fill:#fff;font-weight:600">6</text>
    <text class="t xs" x="574" y="74" text-anchor="middle">“true world” abolished, and</text>
    <text class="t xs" x="574" y="87" text-anchor="middle">the “apparent” with it</text>
    <text class="t xs" x="574" y="208" text-anchor="middle">“such truths do exist”;</text>
    <text class="m xs" x="574" y="221" text-anchor="middle">“the senses do not lie”</text>
  </g>

  <path class="hinge" d="M 500 232 L 500 258"/>
  <rect class="hinge" x="16" y="258" width="608" height="70" rx="6"/>
  <text class="blue xs" x="26" y="276">the hinge between stages 5 and 6, BGE 15: the sense organs cannot be “the product of our organs”</text>
  <text class="t xs" x="26" y="291">A physiology of knowing presupposes real organs and real causes; the hidden reality that concepts were</text>
  <text class="t xs" x="26" y="304">said to falsify, the “chaos of sensations”, was itself one more true world, knowable only a priori.</text>
  <text class="m xs" x="26" y="319">Badges 4, 5, 6: Clark’s placement of Nietzsche’s own books on the fable’s last three stages (1990, ch. 4 §3).</text>
</svg>

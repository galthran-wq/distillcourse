<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .t { fill: currentColor; }
    .m { fill: currentColor; opacity: 0.55; }
    .s { font-size: 10.5px; }
    .xs { font-size: 9.5px; }
    .h { fill: currentColor; font-weight: 600; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .box-a { fill: none; stroke: #e2903a; stroke-width: 2; }
    .box { fill: none; stroke: currentColor; stroke-opacity: 0.55; stroke-width: 1.2; }
    .box-d { fill: none; stroke: #4c8dd6; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .arrow { stroke: #e2903a; stroke-width: 1.4; fill: none; }
  </style>
  <defs>
    <marker id="ah2" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#e2903a"/>
    </marker>
  </defs>
  <text class="h" x="16" y="22">What stage six does for the module: three consequences</text>

  <rect class="box-a" x="16" y="96" width="150" height="80" rx="6"/>
  <text class="amber s" x="91" y="120" text-anchor="middle">stage six</text>
  <text class="t xs" x="91" y="138" text-anchor="middle">no true world, so</text>
  <text class="t xs" x="91" y="151" text-anchor="middle">nothing is “merely</text>
  <text class="t xs" x="91" y="164" text-anchor="middle">apparent”</text>

  <path class="arrow" d="M 166 118 C 200 118, 200 62, 236 62" marker-end="url(#ah2)"/>
  <path class="arrow" d="M 166 136 L 236 136" marker-end="url(#ah2)"/>
  <path class="arrow" d="M 166 154 C 200 154, 200 210, 236 210" marker-end="url(#ah2)"/>

  <rect class="box" x="240" y="40" width="384" height="58" rx="6"/>
  <text class="t s" x="250" y="58"><tspan font-weight="600">Interpretation is not falsification.</tspan> BGE 22’s “only an interpretation”</text>
  <text class="t xs" x="250" y="73">has no text-in-itself behind the appearances to fall short of; perspectivism’s</text>
  <text class="t xs" x="250" y="86">“more eyes” compares readings of one world, none of them a mask on an X.</text>

  <rect class="box" x="240" y="112" width="384" height="58" rx="6"/>
  <text class="t s" x="250" y="130"><tspan font-weight="600">The cosmology loses its object.</tspan> BGE 36 reads the world “on its</text>
  <text class="t xs" x="250" y="145">intelligible character”, Kant’s name for the thing-in-itself. With that world</text>
  <text class="t xs" x="250" y="158">gone, “will to power” can be an interpretation of this world and nothing behind it.</text>

  <rect class="box" x="240" y="184" width="384" height="58" rx="6"/>
  <text class="t s" x="250" y="202"><tspan font-weight="600">The drives are not appearances of anything.</tspan> BGE 36’s own step 4:</text>
  <text class="t xs" x="250" y="217">the affects are “not as illusion, not as ‘mere appearance’”. The society of drives</text>
  <text class="t xs" x="250" y="230">of BGE 12 and 19 is the only world there is; the psychology is not a surface.</text>

  <rect class="box-d" x="16" y="254" width="608" height="36" rx="6"/>
  <text class="blue xs" x="26" y="270">the rival reading of the same sentence (Heidegger I §24, III §20): the pair’s end is the highpoint of metaphysics,</text>
  <text class="t xs" x="26" y="283">after which the question is what becomes of truth, and the answer is will to power as the essence of beings (Module 7).</text>
</svg>

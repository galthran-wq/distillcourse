<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .t { fill: currentColor; }
    .m { fill: currentColor; opacity: 0.55; }
    .s { font-size: 10.5px; }
    .xs { font-size: 9.5px; }
    .h { fill: currentColor; font-weight: 600; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .row { fill: none; stroke: currentColor; stroke-opacity: 0.45; stroke-width: 1.2; }
    .badge { fill: currentColor; opacity: 0.7; }
    .chip-a { fill: none; stroke: #e2903a; stroke-width: 1.4; }
    .chip-b { fill: none; stroke: #4c8dd6; stroke-width: 1.4; }
  </style>
  <text class="h" x="16" y="22">‘Reason’ §6: four theses, two about the world and two about who needs another</text>

  <rect class="row" x="16" y="36" width="500" height="46" rx="6"/>
  <circle class="badge" cx="34" cy="59" r="10"/>
  <text class="s" x="34" y="63" text-anchor="middle" style="fill:#fff;font-weight:600">1</text>
  <text class="t s" x="52" y="53">The grounds for calling “this” world apparent (change, becoming, plurality)</text>
  <text class="t s" x="52" y="67">establish its reality instead; another kind of reality is undemonstrable</text>
  <rect class="chip-a" x="528" y="48" width="96" height="22" rx="11"/>
  <text class="amber xs" x="576" y="63" text-anchor="middle">epistemic</text>

  <rect class="row" x="16" y="90" width="500" height="46" rx="6"/>
  <circle class="badge" cx="34" cy="113" r="10"/>
  <text class="s" x="34" y="117" text-anchor="middle" style="fill:#fff;font-weight:600">2</text>
  <text class="t s" x="52" y="107">The marks given to “true being” (unchanging, unconditioned, causa sui) are the</text>
  <text class="t s" x="52" y="121">marks of nothingness; the “true world” is built from contradiction to the actual one</text>
  <rect class="chip-a" x="528" y="102" width="96" height="22" rx="11"/>
  <text class="amber xs" x="576" y="117" text-anchor="middle">metaphysical</text>

  <rect class="row" x="16" y="144" width="500" height="46" rx="6"/>
  <circle class="badge" cx="34" cy="167" r="10"/>
  <text class="s" x="34" y="171" text-anchor="middle" style="fill:#fff;font-weight:600">3</text>
  <text class="t s" x="52" y="161">Fabling of “another” world is pointless unless an instinct for slandering life</text>
  <text class="t s" x="52" y="175">is strong in us: then it is revenge on life, “another”, a “better” life</text>
  <rect class="chip-b" x="528" y="156" width="96" height="22" rx="11"/>
  <text class="blue xs" x="576" y="171" text-anchor="middle">psychological</text>

  <rect class="row" x="16" y="198" width="500" height="46" rx="6"/>
  <circle class="badge" cx="34" cy="221" r="10"/>
  <text class="s" x="34" y="225" text-anchor="middle" style="fill:#fff;font-weight:600">4</text>
  <text class="t s" x="52" y="215">Dividing the world into “true” and “apparent”, Christianity’s way or Kant’s, is a</text>
  <text class="t s" x="52" y="229">suggestion of décadence, a symptom of declining life; the artist’s Schein excepted</text>
  <rect class="chip-b" x="528" y="210" width="96" height="22" rx="11"/>
  <text class="blue xs" x="576" y="225" text-anchor="middle">physiological</text>

  <text class="m xs" x="16" y="262">Theses 1–2 say what there is: one demonstrable world, and a second made of negations.</text>
  <text class="m xs" x="16" y="275">Theses 3–4 say who needs the second: a life that slanders itself. The fable is theses 1–2 told as a history;</text>
  <text class="m xs" x="16" y="288">theses 3–4 are the Third Treatise’s charge, with its type-diagnosis asserted rather than argued here.</text>
</svg>

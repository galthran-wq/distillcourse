<svg viewBox="0 0 640 210" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .t { fill: currentColor; }
    .m { fill: currentColor; opacity: 0.55; }
    .s { font-size: 10.5px; }
    .xs { font-size: 9.5px; }
    .h { fill: currentColor; font-weight: 600; }
    .amber { fill: #e2903a; font-weight: 600; }
    .box { fill: none; stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.2; }
    .box-a { fill: none; stroke: #e2903a; stroke-width: 1.6; stroke-dasharray: 4 3; }
    .arrow { stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.2; fill: none; }
    .arrow-a { stroke: #e2903a; stroke-width: 1.6; fill: none; }
  </style>
  <defs>
    <marker id="gc-ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor" opacity="0.6"/>
    </marker>
    <marker id="gc-aha" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#e2903a"/>
    </marker>
  </defs>
  <text class="h" x="16" y="22">‘Reason’ §1: a need becomes a faculty</text>

  <rect class="box" x="16" y="52" width="176" height="70" rx="5"/>
  <text class="t s" x="104" y="72" text-anchor="middle" font-weight="600">hatred of becoming</text>
  <text class="m xs" x="104" y="88" text-anchor="middle">“Egyptianism”: what becomes,</text>
  <text class="m xs" x="104" y="101" text-anchor="middle">is not; being is believed in</text>
  <text class="m xs" x="104" y="114" text-anchor="middle">but never found</text>

  <path class="arrow" d="M 192 87 L 232 87" marker-end="url(#gc-ah)"/>
  <text class="m xs" x="212" y="44" text-anchor="middle">a deceiver</text>
  <text class="m xs" x="212" y="138" text-anchor="middle">is needed</text>

  <rect class="box" x="234" y="52" width="176" height="70" rx="5"/>
  <text class="t s" x="322" y="72" text-anchor="middle" font-weight="600">the senses convicted</text>
  <text class="m xs" x="322" y="88" text-anchor="middle">“where is the deceiver</text>
  <text class="m xs" x="322" y="101" text-anchor="middle">to be found?” the witness,</text>
  <text class="m xs" x="322" y="114" text-anchor="middle">“so immoral as well”</text>

  <path class="arrow-a" d="M 410 87 L 450 87" marker-end="url(#gc-aha)"/>
  <text class="m xs" x="430" y="44" text-anchor="middle">a second</text>
  <text class="m xs" x="430" y="138" text-anchor="middle">access</text>

  <rect class="box-a" x="452" y="52" width="172" height="70" rx="5"/>
  <text class="amber s" x="538" y="72" text-anchor="middle">“reason”</text>
  <text class="m xs" x="538" y="88" text-anchor="middle">non-sensory access to</text>
  <text class="m xs" x="538" y="101" text-anchor="middle">what the senses are said</text>
  <text class="m xs" x="538" y="114" text-anchor="middle">to hide</text>

  <text class="t xs" x="16" y="164">The order is a genealogy, not an epistemology: the witness is convicted by what a type needs</text>
  <text class="t xs" x="16" y="177">before its evidence is heard, and the faculty that overrules it is invented to fit the verdict.</text>
  <text class="m xs" x="16" y="198">The dashed box is the chapter’s claim about it: the scare quotes mark a faculty that does not exist (§2, §3).</text>
</svg>

<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .t { fill: currentColor; }
    .m { fill: currentColor; opacity: 0.55; }
    .s { font-size: 10.5px; }
    .xs { font-size: 9.5px; }
    .h { fill: currentColor; font-weight: 600; }
    .amber { fill: #e2903a; font-weight: 600; }
    .panel { fill: none; stroke: currentColor; stroke-opacity: 0.3; stroke-width: 1; }
    .box { fill: none; stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.2; }
    .box-d { fill: none; stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .box-a { fill: none; stroke: #e2903a; stroke-width: 2; }
    .arrow { stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.2; fill: none; }
    .arrow-a { stroke: #e2903a; stroke-width: 1.6; fill: none; }
    .bolt { fill: #e2903a; }
    .strike { stroke: #e2903a; stroke-width: 2; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor" opacity="0.6"/>
    </marker>
    <marker id="aha" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#e2903a"/>
    </marker>
  </defs>
  <text class="h" x="16" y="22">One habit, two scales: the doer added to the deed, the being added to the becoming</text>

  <rect class="panel" x="16" y="36" width="230" height="210" rx="6"/>
  <text class="t s" x="26" y="54"><tspan font-weight="600">GM I:13</tspan> · the moral scale</text>
  <path class="bolt" d="M 60 80 L 48 112 L 62 110 L 50 146 L 78 104 L 64 106 L 74 80 Z"/>
  <text class="m xs" x="88" y="100">one event: the flash</text>
  <rect class="box-d" x="88" y="110" width="130" height="30" rx="4"/>
  <text class="m xs" x="153" y="129" text-anchor="middle">“the lightning”, the doer</text>
  <line class="strike" x1="96" y1="125" x2="210" y2="125"/>
  <text class="t xs" x="26" y="166">grammar reports one happening twice:</text>
  <text class="t xs" x="26" y="179">as the subject that acts and as the act.</text>
  <text class="t xs" x="26" y="200">The “substratum free to express strength</text>
  <text class="t xs" x="26" y="213">or not” is the doer at moral scale.</text>

  <rect class="panel" x="262" y="36" width="362" height="210" rx="6"/>
  <text class="t s" x="272" y="54"><tspan font-weight="600">‘Reason’ §5</tspan> · the metaphysical scale</text>
  <rect class="box-a" x="272" y="70" width="60" height="30" rx="4"/>
  <text class="amber s" x="302" y="89" text-anchor="middle">“I”</text>
  <path class="arrow-a" d="M 332 85 L 356 85" marker-end="url(#aha)"/>
  <rect class="box" x="358" y="70" width="60" height="30" rx="4"/>
  <text class="t s" x="388" y="89" text-anchor="middle">being</text>
  <path class="arrow" d="M 418 85 L 442 85" marker-end="url(#ah)"/>
  <rect class="box" x="444" y="70" width="60" height="30" rx="4"/>
  <text class="t s" x="474" y="89" text-anchor="middle">thing</text>
  <path class="arrow" d="M 504 85 L 528 85" marker-end="url(#ah)"/>
  <rect class="box" x="530" y="70" width="84" height="30" rx="4"/>
  <text class="t s" x="572" y="89" text-anchor="middle">cause, will</text>
  <path class="arrow" d="M 572 100 L 572 122" marker-end="url(#ah)"/>
  <rect class="box-d" x="500" y="124" width="114" height="30" rx="4"/>
  <text class="t s" x="557" y="143" text-anchor="middle">God, ens realissimum</text>
  <text class="m xs" x="272" y="118">the ego taken as substance,</text>
  <text class="m xs" x="272" y="131">“projected on to all things”</text>
  <text class="t xs" x="272" y="166">“it is only from the conception ‘ego’ that there follows,</text>
  <text class="t xs" x="272" y="179">derivatively, the concept ‘being’”; the last and emptiest</text>
  <text class="t xs" x="272" y="192">concept is placed first, as causa sui.</text>
  <text class="amber xs" x="272" y="216">“I fear we are not getting rid of God</text>
  <text class="amber xs" x="272" y="229">because we still believe in grammar”</text>

  <text class="m xs" x="16" y="264">The lightning is the doer lesson’s case; §5 runs the same doubling from the pronoun up to the ens realissimum,</text>
  <text class="m xs" x="16" y="276">and Democritus’s atom is on the same list.</text>
</svg>

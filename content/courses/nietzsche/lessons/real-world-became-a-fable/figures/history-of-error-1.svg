<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .t { fill: currentColor; }
    .m { fill: currentColor; opacity: 0.55; }
    .g { fill: currentColor; opacity: 0.28; }
    .s { font-size: 10.5px; }
    .xs { font-size: 9.5px; }
    .h { fill: currentColor; font-weight: 600; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .row { fill: none; stroke: currentColor; stroke-opacity: 0.45; stroke-width: 1.2; }
    .row-g { fill: none; stroke: currentColor; stroke-opacity: 0.2; stroke-width: 1.2; }
    .row-a { fill: none; stroke: #e2903a; stroke-width: 2; }
    .badge { fill: currentColor; opacity: 0.7; }
    .badge-g { fill: currentColor; opacity: 0.25; }
    .badge-a { fill: #e2903a; }
    .box-a { fill: none; stroke: #e2903a; stroke-width: 2; }
    .box-ad { fill: none; stroke: #e2903a; stroke-width: 1.6; stroke-dasharray: 5 4; opacity: 0.6; }
    .box-b { fill: none; stroke: #4c8dd6; stroke-width: 2; }
    .strike { stroke: #e2903a; stroke-width: 2; }
    .rel { stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.2; }
    .reld { stroke: currentColor; stroke-opacity: 0.4; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .horizon { stroke: currentColor; stroke-opacity: 0.4; stroke-width: 1; }
    .sun { fill: #e2903a; }
    .sun-g { fill: none; stroke: #e2903a; stroke-width: 1.4; stroke-dasharray: 3 3; opacity: 0.7; }
    .shadow { fill: currentColor; opacity: 0.35; }
  </style>
  <text class="h" x="16" y="22">How the “true world” became a fable: stage 1 of 6</text>
  <rect class="row-a" x="16" y="38" width="304" height="50" rx="6"/>
  <circle class="badge-a" cx="34" cy="63" r="10"/>
  <text class="s" x="34" y="67" text-anchor="middle" style="fill:#fff;font-weight:600">1</text>
  <text class="t s" x="52" y="53"><tspan font-weight="600">Plato:</tspan> the true world attainable for</text>
  <text class="t s" x="52" y="67">the wise, the pious, the virtuous: “he is it”</text>
  <text class="amber xs" x="52" y="81" font-style="italic">„ich, Plato, bin die Wahrheit“</text>
  <rect class="row-g" x="16" y="94" width="304" height="50" rx="6"/>
  <circle class="badge-g" cx="34" cy="119" r="10"/>
  <text class="s" x="34" y="123" text-anchor="middle" style="fill:#fff;font-weight:600">2</text>
  <text class="g s" x="52" y="109"><tspan font-weight="600">Christianity:</tspan> unattainable for now, but promised</text>
  <text class="g s" x="52" y="123">(“to the sinner who repents”)</text>
  <text class="g xs" x="52" y="137" font-style="italic">„sie wird Weib, sie wird christlich“</text>
  <rect class="row-g" x="16" y="150" width="304" height="50" rx="6"/>
  <circle class="badge-g" cx="34" cy="175" r="10"/>
  <text class="s" x="34" y="179" text-anchor="middle" style="fill:#fff;font-weight:600">3</text>
  <text class="g s" x="52" y="165"><tspan font-weight="600">Kant:</tspan> unattainable, undemonstrable,</text>
  <text class="g s" x="52" y="179">unpromisable; as thought, an imperative</text>
  <text class="g xs" x="52" y="193" font-style="italic">„bleich, nordisch, königsbergisch“</text>
  <rect class="row-g" x="16" y="206" width="304" height="50" rx="6"/>
  <circle class="badge-g" cx="34" cy="231" r="10"/>
  <text class="s" x="34" y="235" text-anchor="middle" style="fill:#fff;font-weight:600">4</text>
  <text class="g s" x="52" y="221"><tspan font-weight="600">Positivism:</tspan> unattained, so unknown;</text>
  <text class="g s" x="52" y="235">no consolation, no redemption, no duty</text>
  <text class="g xs" x="52" y="249" font-style="italic">„Hahnenschrei des Positivismus“</text>
  <rect class="row-g" x="16" y="262" width="304" height="50" rx="6"/>
  <circle class="badge-g" cx="34" cy="287" r="10"/>
  <text class="s" x="34" y="291" text-anchor="middle" style="fill:#fff;font-weight:600">5</text>
  <text class="g s" x="52" y="277"><tspan font-weight="600">The free spirits:</tspan> useless, superfluous,</text>
  <text class="g s" x="52" y="291">therefore refuted: let us abolish it</text>
  <text class="g xs" x="52" y="305" font-style="italic">„Schamröthe Plato’s“</text>
  <rect class="row-g" x="16" y="318" width="304" height="50" rx="6"/>
  <circle class="badge-g" cx="34" cy="343" r="10"/>
  <text class="s" x="34" y="347" text-anchor="middle" style="fill:#fff;font-weight:600">6</text>
  <text class="g s" x="52" y="333"><tspan font-weight="600">Zarathustra:</tspan> with the true world we have</text>
  <text class="g s" x="52" y="347">abolished the apparent one as well</text>
  <text class="g xs" x="52" y="361" font-style="italic">„Augenblick des kürzesten Schattens“</text>
  <text class="m s" x="348" y="52">the pair the fable is about</text>
  <rect class="box-a" x="348" y="62" width="256" height="62" rx="6"/>
  <text class="h" x="476" y="86" text-anchor="middle">the true world</text>
  <text class="amber s" x="476" y="106" text-anchor="middle">attainable</text>
  <line class="rel" x1="476" y1="124" x2="476" y2="190"/>
  <text class="m xs" x="484" y="146">“apparent” = as against</text>
  <text class="m xs" x="484" y="158">the true: this world</text>
  <text class="m xs" x="484" y="170">measured, found wanting</text>
  <rect class="box-b" x="348" y="190" width="256" height="62" rx="6"/>
  <text class="h" x="476" y="214" text-anchor="middle">this world</text>
  <text class="blue s" x="476" y="234" text-anchor="middle">“apparent”</text>
  <line class="horizon" x1="348" y1="340" x2="604" y2="340"/>
  <text class="g xs" x="476" y="300" text-anchor="middle">(the glosses give no time of day yet)</text>
  <text class="m xs" x="348" y="358"></text>
  <text class="m xs" x="348" y="384">stage 1: Plato</text>
</svg>

<svg viewBox="0 0 640 350" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .t { fill: currentColor; }
    .m { fill: currentColor; opacity: 0.55; }
    .s { font-size: 10.5px; }
    .xs { font-size: 9.5px; }
    .h { fill: currentColor; font-weight: 600; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .box-a { fill: none; stroke: #e2903a; stroke-width: 2; }
    .box-b { fill: none; stroke: #4c8dd6; stroke-width: 2; }
    .slot { fill: none; stroke: currentColor; stroke-opacity: 0.45; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .panel { fill: none; stroke: currentColor; stroke-opacity: 0.3; stroke-width: 1; }
    .rank { stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.2; }
    .x { stroke: #e2903a; stroke-width: 2.4; opacity: 0.85; }
  </style>
  <text class="h" x="16" y="22">Inversion keeps the slots; stage six removes them</text>

  <!-- panel a -->
  <rect class="panel" x="16" y="36" width="196" height="252" rx="6"/>
  <text class="t s" x="26" y="54"><tspan font-weight="600">(a)</tspan> Plato: two slots, ranked</text>
  <rect class="slot" x="26" y="66" width="176" height="64" rx="5"/>
  <rect class="box-a" x="34" y="74" width="160" height="48" rx="4"/>
  <text class="amber s" x="114" y="93" text-anchor="middle">the true world</text>
  <text class="m xs" x="114" y="110" text-anchor="middle">supersensuous; the standard</text>
  <line class="rank" x1="114" y1="130" x2="114" y2="164"/>
  <text class="m xs" x="120" y="150">ranks</text>
  <rect class="slot" x="26" y="164" width="176" height="64" rx="5"/>
  <rect class="box-b" x="34" y="172" width="160" height="48" rx="4"/>
  <text class="blue s" x="114" y="191" text-anchor="middle">the apparent world</text>
  <text class="m xs" x="114" y="208" text-anchor="middle">sensuous; measured against it</text>
  <text class="m xs" x="26" y="252">above and below: the “blueprint”</text>
  <text class="m xs" x="26" y="266">(Heidegger I §24)</text>

  <!-- panel b -->
  <rect class="panel" x="222" y="36" width="196" height="252" rx="6"/>
  <text class="t s" x="232" y="54"><tspan font-weight="600">(b)</tspan> inversion: occupants swapped</text>
  <rect class="slot" x="232" y="66" width="176" height="64" rx="5"/>
  <rect class="box-b" x="240" y="74" width="160" height="48" rx="4"/>
  <text class="blue s" x="320" y="93" text-anchor="middle">the sensuous</text>
  <text class="m xs" x="320" y="110" text-anchor="middle">now “true”; the standard</text>
  <line class="rank" x1="320" y1="130" x2="320" y2="164"/>
  <text class="m xs" x="326" y="150">ranks</text>
  <rect class="slot" x="232" y="164" width="176" height="64" rx="5"/>
  <rect class="box-a" x="240" y="172" width="160" height="48" rx="4"/>
  <text class="amber s" x="320" y="191" text-anchor="middle">the supersensuous</text>
  <text class="m xs" x="320" y="208" text-anchor="middle">now “apparent”; found wanting</text>
  <line class="x" x1="230" y1="64" x2="410" y2="230"/>
  <line class="x" x1="410" y1="64" x2="230" y2="230"/>
  <text class="m xs" x="232" y="252">slots intact: “Platonism in its</text>
  <text class="m xs" x="232" y="266">essence perdures”</text>

  <!-- panel c -->
  <rect class="panel" x="428" y="36" width="196" height="252" rx="6"/>
  <text class="t s" x="438" y="54"><tspan font-weight="600">(c)</tspan> stage six: the slots erased</text>
  <text class="m xs" x="526" y="96" text-anchor="middle">no above</text>
  <rect class="box-b" x="446" y="122" width="160" height="52" rx="4"/>
  <text class="h" x="526" y="144" text-anchor="middle">this world</text>
  <text class="m xs" x="526" y="162" text-anchor="middle">not “true”, not “apparent”</text>
  <text class="m xs" x="526" y="208" text-anchor="middle">no below</text>
  <text class="m xs" x="438" y="252">“apparent” has nothing to contrast</text>
  <text class="m xs" x="438" y="266">with: the pair ends, it is not reversed</text>

  <text class="t s" x="16" y="312">The reading refuted: “inverted Platonism” (Nietzsche’s own 1870 phrase) is (b). Stage six is (c):</text>
  <text class="t s" x="16" y="326">the deletion of both tags, not the exchange of two occupants.</text>
  <text class="m xs" x="16" y="341">Clark and Heidegger agree on (c) and divide on what stands in it.</text>
</svg>

<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
<style>.label{fill:currentColor}.muted{fill:currentColor;opacity:.55;font-size:12px}.rule{stroke:currentColor;stroke-opacity:.2}</style>
<rect x="150" y="14" width="235" height="30" rx="4" fill="#4c8dd6" fill-opacity="0.18" stroke="#4c8dd6"/>
<text class="label" x="267" y="34" text-anchor="middle" font-weight="600">Apollo</text>
<rect x="395" y="14" width="235" height="30" rx="4" fill="#e2903a" fill-opacity="0.18" stroke="#e2903a"/>
<text class="label" x="512" y="34" text-anchor="middle" font-weight="600">Dionysus</text>
<line class="rule" x1="10" y1="92" x2="630" y2="92"/>
<text class="muted" x="12" y="78">state</text>
<text class="label" x="160" y="78">dream</text>
<text class="label" x="405" y="78">intoxication</text>
<line class="rule" x1="10" y1="132" x2="630" y2="132"/>
<text class="muted" x="12" y="118">arts</text>
<text class="label" x="160" y="118">sculpture, epic: the image</text>
<text class="label" x="405" y="118">music, dance: no image</text>
<line class="rule" x1="10" y1="172" x2="630" y2="172"/>
<text class="muted" x="12" y="158">the individual</text>
<text class="label" x="160" y="158">drawn clearly, kept in bounds</text>
<text class="label" x="405" y="158">dissolved into the whole</text>
<line class="rule" x1="10" y1="212" x2="630" y2="212"/>
<text class="muted" x="12" y="198">rule</text>
<text class="label" x="160" y="198">measure, “know thyself”</text>
<text class="label" x="405" y="198">excess, forgetting oneself</text>
<line class="rule" x1="10" y1="252" x2="630" y2="252"/>
<text class="muted" x="12" y="238">relation to truth</text>
<text class="label" x="160" y="238">a beautiful illusion, known as one</text>
<text class="label" x="405" y="238">Silenus’s wisdom, felt directly</text>
<line class="rule" x1="10" y1="292" x2="630" y2="292"/>
<text class="muted" x="12" y="278">alone, it ends in</text>
<text class="label" x="160" y="278">rigid order that only veils</text>
<text class="label" x="405" y="278">nausea: no reason to act</text>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker></defs>
<path d="M267 308 L 300 336" stroke="#4c8dd6" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
<path d="M512 308 L 470 336" stroke="#e2903a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
<rect x="150" y="340" width="480" height="52" rx="5" fill="none" stroke="currentColor"/>
<text class="label" x="390" y="362" text-anchor="middle" font-weight="600">tragedy</text>
<text class="label" x="390" y="382" text-anchor="middle">a Dionysian chorus that sees an Apollonian vision</text>
</svg>
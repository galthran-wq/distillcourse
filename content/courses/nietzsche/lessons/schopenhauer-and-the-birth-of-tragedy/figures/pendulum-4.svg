<svg viewBox="0 0 640 310" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
<style>.label{fill:currentColor}.muted{fill:currentColor;opacity:.55;font-size:12px}.guide{stroke:currentColor;stroke-dasharray:3 3;opacity:.5;fill:none}.cur{fill:#e2903a}</style>
<path class="guide" d="M201.8 126.3 A150 150 0 0 0 438.2 126.3"/>
<circle cx="320" cy="34" r="4" fill="currentColor"/>
<text class="muted" x="320" y="22" text-anchor="middle">the will to live never stops wanting</text>
<line x1="320" y1="34" x2="201.8" y2="126.3" stroke="currentColor" stroke-width="1.5"/>
<circle cx="201.8" cy="126.3" r="11" fill="#e2903a"/>
<text class="cur" x="183.8" y="130.3" text-anchor="end" font-weight="600">2 · lack</text>
<text class="muted" x="183.8" y="147.3" text-anchor="end">a want is felt as pain</text>
<text class="label" x="320.0" y="214.0" text-anchor="middle">3 · satisfaction</text>
<text class="muted" x="320.0" y="231.0" text-anchor="middle">the pain stops: relief, nothing added</text>
<text class="label" x="456.2" y="130.3" text-anchor="start">4 · boredom</text>
<text class="muted" x="456.2" y="147.3" text-anchor="start">nothing left to want</text>
<text class="cur" x="183.8" y="168.3" text-anchor="end" font-weight="600">5 · a new want</text>
<rect x="110" y="266" width="420" height="34" rx="5" fill="#e2903a" fill-opacity="0.12" stroke="#e2903a"/>
<text class="label" x="320" y="288" text-anchor="middle">Step 3 carries everything: satisfaction is <tspan font-weight="600">only</tspan> relief</text>
</svg>
<line x1="342" y1="42" x2="412" y2="42" stroke="currentColor" stroke-opacity=".4"/>
<text class="label" x="420" y="38" font-weight="600">the scene: a vision</text>
<text class="muted" x="420" y="56">the suffering god, seen as a hero</text>
<text class="muted" x="420" y="72">in clear form (Apollo)</text>
<line x1="290" y1="150" x2="412" y2="150" stroke="currentColor" stroke-opacity=".4"/>
<text class="label" x="420" y="146" font-weight="600">the chorus of satyrs</text>
<text class="muted" x="420" y="164">the Dionysian throng, a “living</text>
<text class="muted" x="420" y="180">wall” against everyday reality</text>
<line x1="380" y1="230" x2="412" y2="230" stroke="currentColor" stroke-opacity=".4"/>
<text class="label" x="420" y="226" font-weight="600">the spectators</text>
<text class="muted" x="420" y="244">no audience apart: they see</text>
<text class="muted" x="420" y="260">themselves in the chorus</text>
<text class="muted" x="238" y="106">beholds</text>
<text class="muted" x="238" y="254">identify with</text>

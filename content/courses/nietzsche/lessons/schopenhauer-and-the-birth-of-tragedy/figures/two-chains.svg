<svg viewBox="0 0 640 452" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .box { fill: none; stroke: currentColor; stroke-opacity: 0.45; }
    .guide { stroke: currentColor; stroke-dasharray: 3 3; opacity: 0.5; fill: none; }
  </style>
  <text class="label" x="160" y="22" text-anchor="middle" font-weight="600">Schopenhauer (1818)</text>
  <text class="label" x="490" y="22" text-anchor="middle" font-weight="600">The Birth of Tragedy (1872)</text>

  <!-- shared description, steps 1-5 -->
  <rect class="box" x="20" y="38" width="280" height="40" rx="4"/>
  <text class="label" x="32" y="63">1 · behind appearances, one blind will</text>
  <rect class="box" x="20" y="86" width="280" height="40" rx="4"/>
  <text class="label" x="32" y="111">2 · every want starts as a lack, a pain</text>
  <rect class="box" x="20" y="134" width="280" height="40" rx="4"/>
  <text class="label" x="32" y="159">3 · satisfaction only removes the pain</text>
  <rect class="box" x="20" y="182" width="280" height="40" rx="4"/>
  <text class="label" x="32" y="207">4 · nothing left to want: boredom</text>
  <rect class="box" x="20" y="230" width="280" height="40" rx="4"/>
  <text class="label" x="32" y="255">5 · life swings from pain to boredom</text>

  <text class="label" x="320" y="160" text-anchor="middle" font-size="22">=</text>
  <rect class="box" x="340" y="38" width="280" height="232" rx="4"/>
  <text class="label" x="480" y="122" text-anchor="middle" font-weight="600">steps 1–5 accepted</text>
  <text class="muted" x="480" y="142" text-anchor="middle">(step 1 enlarged, below)</text>
  <text class="muted" x="480" y="168" text-anchor="middle">Silenus says the same:</text>
  <text class="muted" x="480" y="186" text-anchor="middle">“best of all, not to be born”</text>

  <!-- the step that differs -->
  <line class="guide" x1="160" y1="270" x2="160" y2="370"/>
  <text class="muted" x="172" y="316">measured by what it feels</text>
  <text class="muted" x="172" y="333">like to live it</text>
  <rect x="340" y="286" width="280" height="70" rx="4" fill="#e2903a" fill-opacity="0.12" stroke="#e2903a" stroke-dasharray="5 3"/>
  <text class="label" x="352" y="306" font-weight="600">assumed, never argued</text>
  <text class="label" x="352" y="326">the one will suffers and delights;</text>
  <text class="label" x="352" y="344">it needs appearance to redeem it</text>

  <!-- verdicts -->
  <rect x="20" y="372" width="280" height="62" rx="4" fill="#4c8dd6" fill-opacity="0.15" stroke="#4c8dd6"/>
  <text class="label" x="32" y="396" font-weight="600">6 · better not to exist:</text>
  <text class="label" x="32" y="418">stop willing</text>
  <rect class="box" x="340" y="372" width="280" height="62" rx="4" stroke-opacity="1"/>
  <text class="label" x="352" y="396" font-weight="600">existence is justified,</text>
  <text class="label" x="352" y="418">as an aesthetic phenomenon</text>
</svg>

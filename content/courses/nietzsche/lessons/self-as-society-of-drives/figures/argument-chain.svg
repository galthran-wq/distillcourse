<svg viewBox="0 0 640 486" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .box { fill: none; stroke: currentColor; stroke-opacity: 0.45; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e2903a"/></marker>
  </defs>
  <text class="label" x="200" y="20" text-anchor="middle" font-weight="600">The self as a society of drives: the argument</text>
  <rect class="box" x="10" y="34" width="380" height="56" rx="4"/>
  <text class="label" x="22" y="53">1 · inner conflict is observed: memory against</text>
  <text class="label" x="22" y="70">    pride, a craving against the wish to be rid of it</text>
  <text class="muted" x="380" y="85" text-anchor="end">BGE 68 · D 109</text>
  <line x1="200" y1="90" x2="200" y2="104" stroke="currentColor" stroke-opacity="0.6" marker-end="url(#arr)"/>
  <rect class="box" x="10" y="106" width="380" height="56" rx="4"/>
  <text class="label" x="22" y="125">2 · the side that fights the drive is itself a</text>
  <text class="label" x="22" y="142">    drive, with an aim of its own</text>
  <text class="muted" x="380" y="157" text-anchor="end">D 109 · BGE 117</text>
  <line x1="200" y1="162" x2="200" y2="176" stroke="currentColor" stroke-opacity="0.6" marker-end="url(#arr)"/>
  <rect class="box" x="10" y="178" width="380" height="56" rx="4"/>
  <text class="label" x="22" y="197">3 · looking inward, one finds no motive-free</text>
  <text class="label" x="22" y="214">    arbiter, only further motives</text>
  <text class="muted" x="380" y="229" text-anchor="end">BGE 117 · GS 333</text>
  <line x1="200" y1="234" x2="200" y2="272" stroke="currentColor" stroke-opacity="0.6" marker-end="url(#arr)"/>
  <rect class="box" x="10" y="274" width="380" height="56" rx="4" stroke-opacity="1"/>
  <text class="label" x="22" y="293" font-weight="600">4 · so a person is a plurality of drives, each</text>
  <text class="label" x="22" y="310" font-weight="600">    wanting to rule, with no judge above them</text>
  <text class="muted" x="380" y="325" text-anchor="end">BGE 6, 12 · D 119</text>
  <line x1="200" y1="330" x2="200" y2="344" stroke="currentColor" stroke-opacity="0.6" marker-end="url(#arr)"/>
  <rect class="box" x="10" y="346" width="380" height="56" rx="4"/>
  <text class="label" x="22" y="365">5 · what says “I” is whichever drive or coalition</text>
  <text class="label" x="22" y="382">    rules, crediting itself with the whole’s success</text>
  <text class="muted" x="380" y="397" text-anchor="end">BGE 19</text>
  <line x1="200" y1="402" x2="200" y2="416" stroke="currentColor" stroke-opacity="0.6" marker-end="url(#arr)"/>
  <rect class="box" x="10" y="418" width="380" height="56" rx="4"/>
  <text class="label" x="22" y="437">6 · strong drives in a stable order make a</text>
  <text class="label" x="22" y="454">    character; without an order, a heap</text>
  <text class="muted" x="380" y="469" text-anchor="end">EH ‘Clever’ 9 · TI Skirmishes 41</text>
  <rect x="410" y="222" width="220" height="64" rx="4" fill="#e2903a" fill-opacity="0.12" stroke="#e2903a" stroke-dasharray="5 3"/>
  <text x="422" y="242" font-weight="600" fill="#e2903a">unstated premise</text>
  <text class="label" x="422" y="260">what introspection never</text>
  <text class="label" x="422" y="277">finds is not there</text>
  <line x1="410" y1="254" x2="206" y2="254" stroke="#e2903a" stroke-width="1.5" marker-end="url(#arr-a)"/>
  <rect x="410" y="306" width="220" height="80" rx="4" fill="none" stroke="currentColor" stroke-opacity="0.55" stroke-dasharray="2 3"/>
  <text class="label" x="422" y="326">its support: economy</text>
  <text class="muted" x="422" y="344" font-size="12">posit nothing that explains</text>
  <text class="muted" x="422" y="360" font-size="12">nothing further, as physics</text>
  <text class="muted" x="422" y="376" font-size="12">dropped the atom (BGE 12)</text>
  <line x1="520" y1="286" x2="520" y2="306" stroke="currentColor" stroke-opacity="0.5" stroke-dasharray="3 3"/>
</svg>

<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .blue { fill: #4c8dd6; }
    .amber { fill: #e2903a; }
  </style>
  <defs>
    <marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e2903a"/></marker>
    <marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4c8dd6"/></marker>
  </defs>
  <text class="label" x="320" y="22" text-anchor="middle" font-weight="600">One act of will: a command and an obedience inside one body</text>

  <text class="amber" x="230" y="52" text-anchor="middle" font-size="12">the governing class</text>
  <rect x="80" y="60" width="300" height="56" rx="5" fill="#e2903a" fill-opacity="0.18" stroke="#e2903a" stroke-width="1.5"/>
  <text class="label" x="230" y="83" text-anchor="middle" font-weight="600">the commanding drive</text>
  <text class="muted" x="230" y="102" text-anchor="middle">“this and nothing else is necessary now”</text>

  <g stroke="#e2903a" stroke-width="1.5" fill="none">
    <line x1="150" y1="116" x2="80" y2="184" marker-end="url(#ma)"/>
    <line x1="205" y1="116" x2="185" y2="184" marker-end="url(#ma)"/>
    <line x1="255" y1="116" x2="290" y2="184" marker-end="url(#ma)"/>
    <line x1="310" y1="116" x2="395" y2="184" marker-end="url(#ma)"/>
  </g>
  <text class="amber" x="100" y="146" font-size="12" text-anchor="end">command</text>

  <g>
    <rect x="30" y="186" width="96" height="46" rx="5" fill="#4c8dd6" fill-opacity="0.15" stroke="#4c8dd6"/>
    <rect x="137" y="186" width="96" height="46" rx="5" fill="#4c8dd6" fill-opacity="0.15" stroke="#4c8dd6"/>
    <rect x="244" y="186" width="96" height="46" rx="5" fill="#4c8dd6" fill-opacity="0.15" stroke="#4c8dd6"/>
    <rect x="351" y="186" width="96" height="46" rx="5" fill="#4c8dd6" fill-opacity="0.15" stroke="#4c8dd6"/>
    <text class="label" x="78" y="214" text-anchor="middle" font-size="12">constraint</text>
    <text class="label" x="185" y="214" text-anchor="middle" font-size="12">pressure</text>
    <text class="label" x="292" y="214" text-anchor="middle" font-size="12">resistance</text>
    <text class="label" x="399" y="214" text-anchor="middle" font-size="12">motion</text>
  </g>
  <text class="blue" x="238" y="252" text-anchor="middle" font-size="12">the obeying “under-souls”, and what obeying feels like</text>

  <path d="M447 209 H520 V88 H382" stroke="#4c8dd6" stroke-width="1.5" fill="none" marker-end="url(#mb)"/>
  <text class="blue" x="528" y="140" font-size="12">success</text>
  <text class="blue" x="528" y="155" font-size="12">reported up</text>

  <rect x="440" y="30" width="190" height="44" rx="5" fill="none" stroke="currentColor" stroke-opacity="0.5" stroke-dasharray="4 3"/>
  <text class="label" x="535" y="49" text-anchor="middle" font-weight="600">“I” · L’effet c’est moi</text>
  <text class="muted" x="535" y="66" text-anchor="middle">the ruler takes the credit</text>

  <line x1="440" y1="56" x2="380" y2="72" stroke="currentColor" stroke-opacity="0.5" stroke-dasharray="3 3"/>
  <text class="muted" x="320" y="290" text-anchor="middle">the one word “I” covers both sides: the commander identifies itself with the executor</text>
  <text class="muted" x="320" y="310" text-anchor="middle">“our body is but a social structure composed of many souls” (BGE 19)</text>
</svg>

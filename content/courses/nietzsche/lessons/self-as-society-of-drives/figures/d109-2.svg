<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .small { fill: currentColor; font-size: 12px; }
    .blue { fill: #4c8dd6; }
    .amber { fill: #e2903a; }
  </style>
  <defs>
    <marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4c8dd6"/></marker>
  </defs>
  <text class="label" x="320" y="22" text-anchor="middle" font-weight="600">2 · the complaint presupposes a second drive</text>
  <rect x="20" y="60" width="180" height="60" rx="5" fill="#e2903a" fill-opacity="0.18" stroke="#e2903a" stroke-width="1.5"/>
  <text class="label" x="110" y="84" text-anchor="middle" font-weight="600">the craving</text>
  <text class="muted" x="110" y="104" text-anchor="middle">vehement, wants its fill</text>
  <rect x="440" y="60" width="180" height="60" rx="5" fill="#4c8dd6" fill-opacity="0.15" stroke="#4c8dd6" stroke-width="1.5"/>
  <text class="label" x="530" y="84" text-anchor="middle" font-weight="600">a rival drive</text>
  <text class="muted" x="530" y="104" text-anchor="middle">fear of disgrace, rest, love</text>
  <path d="M530 60 V44 H110 V58" stroke="#4c8dd6" stroke-width="1.5" fill="none" marker-end="url(#mb)"/>
  <text class="blue" x="320" y="40" text-anchor="middle" font-size="12">complains of it</text>
  <g opacity="0.35">
    <text class="muted" x="232" y="66">six methods (D 109)</text>
    <text class="small" x="232" y="84">1  avoid every occasion</text>
    <text class="small" x="232" y="100">2  ration it by a strict rule</text>
    <text class="small" x="232" y="116">3  indulge it to disgust</text>
    <text class="small" x="232" y="132">4  tie it to a painful thought</text>
    <text class="small" x="232" y="148">5  divert strength elsewhere</text>
    <text class="small" x="232" y="164">6  weaken the whole body</text>
  </g>
  <rect x="245" y="200" width="150" height="40" rx="5" fill="none" stroke="currentColor" stroke-opacity="0.5"/>
  <text class="label" x="320" y="225" text-anchor="middle">the intellect</text>
  <text class="label" x="320" y="278" text-anchor="middle">“We” say: this craving torments me.</text>
  <text class="muted" x="320" y="304" text-anchor="middle"></text>
</svg>

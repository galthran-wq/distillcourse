<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .amber { fill: #e2903a; }
    .d { fill: currentColor; fill-opacity: 0.08; stroke: currentColor; stroke-opacity: 0.6; }
  </style>
  <defs>
    <marker id="mc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker>
    <marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e2903a"/></marker>
  </defs>
  <text class="label" x="103" y="24" text-anchor="middle" font-weight="600">heap</text>
  <text class="muted" x="103" y="40" text-anchor="middle">no order: each drive for itself</text>
  <line x1="65" y1="91" x2="145" y2="149" stroke="#e2903a" stroke-width="1.3" stroke-dasharray="4 3" marker-start="url(#ma)" marker-end="url(#ma)" opacity="0.8"/>
  <line x1="127" y1="85" x2="53" y2="162" stroke="#e2903a" stroke-width="1.3" stroke-dasharray="4 3" marker-start="url(#ma)" marker-end="url(#ma)" opacity="0.8"/>
  <line x1="97" y1="146" x2="103" y2="187" stroke="#e2903a" stroke-width="1.3" stroke-dasharray="4 3" marker-start="url(#ma)" marker-end="url(#ma)" opacity="0.8"/>
  <line x1="68" y1="78" x2="122" y2="74" stroke="#e2903a" stroke-width="1.3" stroke-dasharray="4 3" marker-start="url(#ma)" marker-end="url(#ma)" opacity="0.8"/>
  <line x1="56" y1="183" x2="89" y2="197" stroke="#e2903a" stroke-width="1.3" stroke-dasharray="4 3" marker-start="url(#ma)" marker-end="url(#ma)" opacity="0.8"/>
  <circle class="d" cx="50" cy="80" r="15"/>
  <circle class="d" cx="140" cy="72" r="15"/>
  <circle class="d" cx="95" cy="128" r="15"/>
  <circle class="d" cx="40" cy="175" r="15"/>
  <circle class="d" cx="160" cy="160" r="15"/>
  <circle class="d" cx="105" cy="205" r="15"/>
  <text class="muted" x="103" y="246" text-anchor="middle">“a ball of wild snakes” (Z I 6)</text>
  <text class="muted" x="103" y="262" text-anchor="middle">“contradict, disturb, destroy”</text>
  <text class="muted" x="103" y="276" text-anchor="middle">(TI Skirmishes 41)</text>
  <text class="label" x="103" y="310" text-anchor="middle">drives at war, no whole</text>
  <line x1="213" y1="14" x2="213" y2="318" stroke="currentColor" stroke-opacity="0.2"/>
  <text class="label" x="320" y="24" text-anchor="middle" font-weight="600">tyranny</text>
  <text class="muted" x="320" y="40" text-anchor="middle">one drive rules by starving the rest</text>
  <circle cx="320" cy="100" r="34" fill="#e2903a" fill-opacity="0.25" stroke="#e2903a" stroke-width="1.5"/>
  <text class="label" x="320" y="104" text-anchor="middle" font-size="12">the tyrant</text>
  <line x1="320" y1="134" x2="250" y2="166" stroke="currentColor" stroke-opacity="0.45" marker-end="url(#mc)"/>
  <circle class="d" cx="250" cy="175" r="6"/>
  <line x1="320" y1="134" x2="285" y2="186" stroke="currentColor" stroke-opacity="0.45" marker-end="url(#mc)"/>
  <circle class="d" cx="285" cy="195" r="6"/>
  <line x1="320" y1="134" x2="320" y2="196" stroke="currentColor" stroke-opacity="0.45" marker-end="url(#mc)"/>
  <circle class="d" cx="320" cy="205" r="6"/>
  <line x1="320" y1="134" x2="355" y2="186" stroke="currentColor" stroke-opacity="0.45" marker-end="url(#mc)"/>
  <circle class="d" cx="355" cy="195" r="6"/>
  <line x1="320" y1="134" x2="390" y2="166" stroke="currentColor" stroke-opacity="0.45" marker-end="url(#mc)"/>
  <circle class="d" cx="390" cy="175" r="6"/>
  <text class="muted" x="320" y="246" text-anchor="middle">reason as “a counter-tyrant”</text>
  <text class="muted" x="320" y="262" text-anchor="middle">(TI ‘Socrates’ 9–10); the ascetic</text>
  <text class="muted" x="320" y="276" text-anchor="middle">weakens the whole body (D 109)</text>
  <text class="label" x="320" y="310" text-anchor="middle">a whole, with weak parts</text>
  <line x1="427" y1="14" x2="427" y2="318" stroke="currentColor" stroke-opacity="0.2"/>
  <text class="label" x="534" y="24" text-anchor="middle" font-weight="600">commonwealth</text>
  <text class="muted" x="534" y="40" text-anchor="middle">strong drives in an order of rank</text>
  <line x1="534" y1="97" x2="484" y2="123" stroke="currentColor" stroke-opacity="0.5" marker-end="url(#mc)"/>
  <line x1="534" y1="97" x2="584" y2="123" stroke="currentColor" stroke-opacity="0.5" marker-end="url(#mc)"/>
  <line x1="484" y1="155" x2="454" y2="183" stroke="currentColor" stroke-opacity="0.5" marker-end="url(#mc)"/>
  <line x1="484" y1="155" x2="514" y2="183" stroke="currentColor" stroke-opacity="0.5" marker-end="url(#mc)"/>
  <line x1="584" y1="155" x2="554" y2="183" stroke="currentColor" stroke-opacity="0.5" marker-end="url(#mc)"/>
  <line x1="584" y1="155" x2="614" y2="183" stroke="currentColor" stroke-opacity="0.5" marker-end="url(#mc)"/>
  <circle cx="534" cy="78" r="18" fill="#e2903a" fill-opacity="0.25" stroke="#e2903a" stroke-width="1.5"/>
  <circle class="d" cx="484" cy="140" r="15"/>
  <circle class="d" cx="584" cy="140" r="15"/>
  <circle class="d" cx="454" cy="200" r="15"/>
  <circle class="d" cx="514" cy="200" r="15"/>
  <circle class="d" cx="554" cy="200" r="15"/>
  <circle class="d" cx="614" cy="200" r="15"/>
  <text class="muted" x="534" y="246" text-anchor="middle">“a tremendous variety that is</text>
  <text class="muted" x="534" y="262" text-anchor="middle">nevertheless the opposite of chaos”</text>
  <text class="muted" x="534" y="276" text-anchor="middle">(EH ‘Clever’ 9)</text>
  <text class="label" x="534" y="310" text-anchor="middle" font-weight="600">strong parts, one whole</text>
</svg>

<svg viewBox="0 0 640 350" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .small { fill: currentColor; opacity: 0.7; font-size: 11px; }
    .blue { fill: #4c8dd6; }
    .amber { fill: #e2903a; }
  </style>
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4c8dd6"/></marker>
    <marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker>
  </defs>

  <!-- left: Plato -->
  <text class="blue" x="155" y="22" text-anchor="middle" font-weight="600">Plato’s soul</text>
  <text class="muted" x="155" y="39" text-anchor="middle">three parts, reason in command</text>

  <rect x="40" y="52" width="230" height="58" rx="5" fill="#4c8dd6" fill-opacity="0.15" stroke="#4c8dd6" stroke-width="1.5"/>
  <text class="label" x="155" y="74" text-anchor="middle" font-weight="600">reason</text>
  <text class="muted" x="155" y="92" text-anchor="middle">wants only truth and the good</text>
  <text class="muted" x="155" y="105" text-anchor="middle">of the whole: no appetite of its own</text>
  <text class="blue" x="282" y="86" font-size="12">rules</text>

  <line x1="155" y1="110" x2="155" y2="148" stroke="#4c8dd6" stroke-width="1.5" marker-end="url(#ab)"/>
  <text class="blue" x="163" y="134" font-size="11">commands</text>
  <rect x="40" y="150" width="230" height="48" rx="5" fill="none" stroke="currentColor" stroke-opacity="0.45"/>
  <text class="label" x="155" y="170" text-anchor="middle" font-weight="600">spirit</text>
  <text class="muted" x="155" y="188" text-anchor="middle">anger and pride, reason’s ally</text>

  <line x1="155" y1="198" x2="155" y2="236" stroke="#4c8dd6" stroke-width="1.5" marker-end="url(#ab)"/>
  <text class="blue" x="163" y="222" font-size="11">commands</text>
  <rect x="40" y="238" width="230" height="48" rx="5" fill="none" stroke="currentColor" stroke-opacity="0.45"/>
  <text class="label" x="155" y="258" text-anchor="middle" font-weight="600">appetite</text>
  <text class="muted" x="155" y="276" text-anchor="middle">hunger, thirst, lust: many wants</text>

  <text class="muted" x="155" y="318" text-anchor="middle">the ruler differs in kind from</text>
  <text class="muted" x="155" y="334" text-anchor="middle">what it rules</text>

  <line x1="320" y1="14" x2="320" y2="340" stroke="currentColor" stroke-opacity="0.2"/>

  <!-- right: Nietzsche -->
  <text class="amber" x="480" y="22" text-anchor="middle" font-weight="600">“A social structure of the drives”</text>
  <text class="muted" x="480" y="39" text-anchor="middle">many parts, no commander outside them</text>

  <rect x="400" y="52" width="160" height="32" rx="5" fill="none" stroke="currentColor" stroke-opacity="0.5" stroke-dasharray="5 4"/>
  <text class="muted" x="480" y="72" text-anchor="middle">no seat above the drives</text>

  <!-- rank lines -->
  <g stroke="currentColor" stroke-opacity="0.45" fill="none">
    <line x1="470" y1="140" x2="410" y2="180" marker-end="url(#ac)"/>
    <line x1="480" y1="144" x2="480" y2="176" marker-end="url(#ac)"/>
    <line x1="492" y1="140" x2="552" y2="180" marker-end="url(#ac)"/>
    <line x1="398" y1="214" x2="376" y2="246" marker-end="url(#ac)"/>
    <line x1="410" y1="214" x2="430" y2="246" marker-end="url(#ac)"/>
    <line x1="560" y1="214" x2="566" y2="246" marker-end="url(#ac)"/>
    <line x1="550" y1="214" x2="508" y2="246" marker-end="url(#ac)"/>
  </g>
  <path d="M424 196 L460 196" stroke="#e2903a" stroke-width="1.5" stroke-dasharray="4 3" fill="none"/>
  <path d="M500 196 L536 196" stroke="#e2903a" stroke-width="1.5" stroke-dasharray="4 3" fill="none"/>
  <text class="amber" x="480" y="236" text-anchor="middle" font-size="11">rivalry</text>

  <circle cx="480" cy="118" r="24" fill="#e2903a" fill-opacity="0.25" stroke="#e2903a" stroke-width="1.5"/>
  <text class="label" x="480" y="122" text-anchor="middle" font-size="12" font-weight="600">pride</text>
  <text class="amber" x="446" y="112" text-anchor="end" font-weight="600">“I” =</text>
  <text class="amber" x="446" y="127" text-anchor="end" font-size="11">whichever drive</text>
  <text class="amber" x="446" y="140" text-anchor="end" font-size="11">rules now</text>

  <circle cx="404" cy="196" r="17" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.6"/>
  <circle cx="480" cy="196" r="17" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.6"/>
  <circle cx="556" cy="196" r="17" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.6"/>
  <text class="small" x="372" y="174" text-anchor="middle">curiosity</text>
  <text class="small" x="604" y="174" text-anchor="middle">fear of</text>
  <text class="small" x="604" y="187" text-anchor="middle">disgrace</text>
  <text class="small" x="480" y="200" text-anchor="middle">rest</text>

  <circle cx="372" cy="258" r="11" fill="none" stroke="currentColor" stroke-opacity="0.6"/>
  <circle cx="434" cy="258" r="11" fill="none" stroke="currentColor" stroke-opacity="0.6"/>
  <circle cx="504" cy="258" r="11" fill="none" stroke="currentColor" stroke-opacity="0.6"/>
  <circle cx="568" cy="258" r="11" fill="none" stroke="currentColor" stroke-opacity="0.6"/>
  <text class="small" x="372" y="286" text-anchor="middle">combat</text>
  <text class="small" x="434" y="286" text-anchor="middle">kindness</text>
  <text class="small" x="504" y="286" text-anchor="middle">vanity</text>
  <text class="small" x="568" y="286" text-anchor="middle">tenderness</text>

  <text class="muted" x="480" y="318" text-anchor="middle">the ruler is one of the ruled, and</text>
  <text class="muted" x="480" y="334" text-anchor="middle">the ranking can change</text>
</svg>

<svg viewBox="0 0 640 310" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tag { font-weight: 600; }
    .amber { fill: #e2903a; fill-opacity: 0.12; stroke: #e2903a; stroke-width: 1.8; }
    .dashed { fill: none; stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.4; stroke-dasharray: 5 3; }
    .blue { fill: #4c8dd6; fill-opacity: 0.12; stroke: #4c8dd6; stroke-width: 1.4; }
    .off { stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.4; fill: none; stroke-dasharray: 4 3; }
  </style>

  <text class="tag" x="12" y="20">the residue of the three speeches</text>

  <rect class="amber" x="12" y="36" width="196" height="196" rx="6"/>
  <text class="tag" x="24" y="56" fill="#e2903a">adds</text>
  <text class="label small" x="24" y="76">a speaker: "Life", first person,</text>
  <text class="label small" x="24" y="90">"I am" where BGE 36 has "would be"</text>
  <text class="label small" x="24" y="110">a motive for the two-world error:</text>
  <text class="label small" x="24" y="124">"suffering and incapacity" (I 3)</text>
  <text class="label small" x="24" y="144">one commander, "the self",</text>
  <text class="label small" x="24" y="158">where BGE 19 has a class (I 4)</text>
  <text class="label small" x="24" y="178">the confession: the speaker was</text>
  <text class="label small" x="24" y="192">once "hinterworldly" himself</text>
  <text class="muted small" x="24" y="214">authority, and the first person</text>

  <rect class="dashed" x="222" y="36" width="196" height="196" rx="6"/>
  <text class="tag" x="234" y="56">drops</text>
  <text class="label small" x="234" y="76">the "suppose" (Gesetzt) of BGE 36</text>
  <text class="label small" x="234" y="90">the conscience of method (step 5)</text>
  <text class="label small" x="234" y="104">"only an interpretation" (BGE 22)</text>
  <text class="label small" x="234" y="118">the razor's reasons (BGE 13)</text>
  <text class="label small" x="234" y="132">Boscovich, the atom (BGE 12)</text>
  <text class="label small" x="234" y="146">the six stages of the fable</text>
  <text class="label small" x="234" y="160">the parts list of willing (BGE 19)</text>
  <text class="muted small" x="234" y="184">the doctrine without the mood,</text>
  <text class="muted small" x="234" y="198">the method, or the evidence</text>

  <rect class="blue" x="432" y="36" width="196" height="196" rx="6"/>
  <text class="tag" x="444" y="56" fill="#4c8dd6">undercuts</text>
  <text class="label small" x="444" y="76">"Zarathustra too is a poet" (II 17)</text>
  <text class="label small" x="444" y="90">"we know too little … so we</text>
  <text class="label small" x="444" y="104">simply have to lie"</text>
  <text class="label small" x="444" y="124">the doctrine received, not found:</text>
  <text class="label small" x="444" y="138">"thus Life once taught me"</text>
  <text class="label small" x="444" y="158">the animals' "hurdy-gurdy song"</text>
  <text class="label small" x="444" y="172">(III 13, the recurrence)</text>
  <text class="muted small" x="444" y="196">"I do not belong to those whose</text>
  <text class="muted small" x="444" y="210">Why may be questioned"</text>

  <text class="muted small" x="12" y="256">the argued passage is the premise; the speech is cited for the first column with the third beside it</text>

  <path class="off" d="M 530 270 L 620 270"/>
  <path d="M 620 270 L 612 265 L 612 275 Z" fill="currentColor" fill-opacity="0.5"/>
  <text class="muted small" x="330" y="274">read as doctrine (Heidegger, Nietzsche III, Part Three §2):</text>
  <text class="muted small" x="330" y="290">the reading Module 7 states at strength and evaluates</text>
</svg>

<svg viewBox="0 0 640 290" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tag { font-weight: 600; }
    .de { font-style: italic; }
    .blue { fill: #4c8dd6; fill-opacity: 0.12; stroke: #4c8dd6; stroke-width: 1.4; }
    .amber { fill: #e2903a; fill-opacity: 0.12; stroke: #e2903a; stroke-width: 1.8; }
    .hi { fill: #e2903a; font-weight: 700; }
    .hiblue { fill: #4c8dd6; font-weight: 700; }
  </style>

  <text class="tag" x="12" y="20">one content, two moods</text>

  <!-- left: the argued register -->
  <rect class="blue" x="12" y="34" width="300" height="196" rx="6"/>
  <text class="tag small" x="24" y="54" fill="#4c8dd6">BGE 36 (1886): the argued register</text>
  <text class="label small de" x="24" y="76">Die Welt von innen gesehen …</text>
  <text class="label small de" x="24" y="90">sie <tspan class="hiblue">wäre</tspan> eben „Wille zur Macht"</text>
  <text class="label small de" x="24" y="104">und nichts ausserdem.</text>
  <text class="label small" x="24" y="126">The world seen from inside …</text>
  <text class="label small" x="24" y="140"><tspan class="hiblue">would be</tspan> just this "will to power"</text>
  <text class="label small" x="24" y="154">and nothing else.</text>
  <text class="muted small" x="24" y="178">opens: Gesetzt, dass (suppose)</text>
  <text class="muted small" x="24" y="192">speaker: the author, under a method</text>
  <text class="muted small" x="24" y="206">step 1 supposes the will it concludes to</text>
  <text class="muted small" x="24" y="220">BGE 22: "only an interpretation"</text>

  <!-- right: the staged register -->
  <rect class="amber" x="328" y="34" width="300" height="196" rx="6"/>
  <text class="tag small" x="340" y="54" fill="#e2903a">Z II 12 (1883): the staged register</text>
  <text class="label small de" x="340" y="76">„Siehe, sprach es,</text>
  <text class="label small de" x="340" y="90"><tspan class="hi">ich bin</tspan> das, was sich immer</text>
  <text class="label small de" x="340" y="104">selber überwinden muss."</text>
  <text class="label small" x="340" y="126">"Behold," it said,</text>
  <text class="label small" x="340" y="140">"<tspan class="hi">I am</tspan> that which must</text>
  <text class="label small" x="340" y="154">always overcome itself."</text>
  <text class="muted small" x="340" y="178">opens: "and this secret Life itself spoke"</text>
  <text class="muted small" x="340" y="192">speaker: Life, a personification</text>
  <text class="muted small" x="340" y="206">reporter: Zarathustra, "thus Life once taught me"</text>
  <text class="muted small" x="340" y="220">no method, no objection, no "suppose"</text>

  <text class="muted small" x="12" y="256">the argument supposes what the speech asserts; the speech drops the "suppose" and adds a speaker</text>
  <text class="muted small" x="12" y="272">the content, "one basic form of will" that "must overcome itself", is the same sentence in both</text>
</svg>

<svg viewBox="0 0 640 230" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tag { font-weight: 600; }
    .axis { stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.4; }
    .tick { stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.2; }
    .amber { fill: #e2903a; }
    .blue { fill: #4c8dd6; }
    .amberbox { fill: #e2903a; fill-opacity: 0.12; stroke: #e2903a; stroke-width: 1.4; }
    .bluebox { fill: #4c8dd6; fill-opacity: 0.12; stroke: #4c8dd6; stroke-width: 1.4; }
    .arrow { stroke: #e2903a; stroke-width: 1.6; fill: none; stroke-dasharray: 5 3; }
  </style>

  <text class="tag" x="12" y="20">the speeches and the sections they are read against</text>

  <!-- staged register, 1883 -->
  <rect class="amberbox" x="30" y="40" width="130" height="66" rx="5"/>
  <text class="tag small amber" x="38" y="56">Z I, January 1883</text>
  <text class="label small" x="38" y="72">I 3 "On the Hinterworldly"</text>
  <text class="label small" x="38" y="86">I 4 "On the Despisers</text>
  <text class="label small" x="38" y="100">of the Body"</text>

  <rect class="amberbox" x="172" y="40" width="130" height="66" rx="5"/>
  <text class="tag small amber" x="180" y="56">Z II, June–July 1883</text>
  <text class="label small" x="180" y="72">II 12 "On Self-Overcoming"</text>
  <text class="label small" x="180" y="86">II 17 "On Poets"</text>
  <text class="muted small" x="180" y="100">the frame</text>

  <!-- argued register -->
  <rect class="bluebox" x="340" y="40" width="88" height="66" rx="5"/>
  <text class="tag small blue" x="348" y="56">BGE, 1886</text>
  <text class="label small" x="348" y="72">§§9, 12, 13, 17,</text>
  <text class="label small" x="348" y="86">19, 22, 36, 259</text>

  <rect class="bluebox" x="440" y="40" width="88" height="66" rx="5"/>
  <text class="tag small blue" x="448" y="56">GM, 1887</text>
  <text class="label small" x="448" y="72">II:12, III:24,</text>
  <text class="label small" x="448" y="86">III:27</text>

  <rect class="bluebox" x="540" y="40" width="88" height="66" rx="5"/>
  <text class="tag small blue" x="548" y="56">TI, 1888</text>
  <text class="label small" x="548" y="72">"Reason" §6,</text>
  <text class="label small" x="548" y="86">the fable</text>

  <!-- axis -->
  <line class="axis" x1="30" y1="130" x2="628" y2="130"/>
  <line class="tick" x1="95" y1="124" x2="95" y2="136"/>
  <line class="tick" x1="237" y1="124" x2="237" y2="136"/>
  <line class="tick" x1="384" y1="124" x2="384" y2="136"/>
  <line class="tick" x1="484" y1="124" x2="484" y2="136"/>
  <line class="tick" x1="584" y1="124" x2="584" y2="136"/>
  <text class="muted small" x="80" y="150">1883</text>
  <text class="muted small" x="222" y="150">1883</text>
  <text class="muted small" x="369" y="150">1886</text>
  <text class="muted small" x="469" y="150">1887</text>
  <text class="muted small" x="569" y="150">1888</text>

  <!-- the map runs against the dates -->
  <path class="arrow" d="M 384 172 L 250 172"/>
  <path d="M 250 172 L 258 167 L 258 177 Z" fill="#e2903a"/>
  <text class="amber small" x="262" y="188">the map runs against the dates: three years</text>

  <text class="muted small" x="30" y="214">a speech is testimony from a character; where a speech and a section disagree, the later text is the one cited</text>
</svg>

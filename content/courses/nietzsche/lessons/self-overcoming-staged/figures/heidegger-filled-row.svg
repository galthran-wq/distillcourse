<svg viewBox="0 0 640 292" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tag { font-weight: 600; }
    .amber { fill: #e2903a; fill-opacity: 0.12; stroke: #e2903a; stroke-width: 1.8; }
    .fill { fill: none; stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.4; stroke-dasharray: 5 3; }
    .rule { stroke: currentColor; stroke-opacity: 0.25; stroke-width: 1; }
    .arrow { stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.4; fill: none; }
  </style>

  <text class="tag" x="12" y="20">the two empty rows, and what the reading puts in them</text>

  <!-- column heads -->
  <text class="muted small" x="12" y="44">the speech (Z II 12)</text>
  <text class="muted small" x="226" y="44">the map</text>
  <text class="muted small" x="380" y="44">read as doctrine (Heidegger, 1940)</text>
  <line class="rule" x1="12" y1="50" x2="628" y2="50"/>

  <!-- row A: Life speaks -->
  <text class="label small" x="12" y="72">"this secret Life itself spoke to me:</text>
  <text class="label small" x="12" y="86">I am that which must always</text>
  <text class="label small" x="12" y="100">overcome itself"</text>

  <rect class="amber" x="226" y="58" width="134" height="66" rx="6"/>
  <text class="tag small" x="238" y="78" fill="#e2903a">none</text>
  <text class="muted small" x="238" y="96">a personification;</text>
  <text class="muted small" x="238" y="110">BGE 36 says "would be"</text>

  <path class="arrow" d="M 360 91 L 374 91"/>
  <path d="M 374 91 L 368 87 L 368 95 Z" fill="currentColor" fill-opacity="0.6"/>

  <rect class="fill" x="380" y="58" width="248" height="66" rx="6"/>
  <text class="label small" x="392" y="78">"'life' is another word for Being"</text>
  <text class="muted small" x="392" y="96">warrant: WM 582, a notebook entry;</text>
  <text class="muted small" x="392" y="110">Nachlass corroborates, cannot ground</text>

  <line class="rule" x1="12" y1="138" x2="628" y2="138"/>

  <!-- row B: the weaker steals power -->
  <text class="label small" x="12" y="160">"along secret passages the weaker</text>
  <text class="label small" x="12" y="174">sneaks into the fortress …</text>
  <text class="label small" x="12" y="188">and there it steals power"</text>

  <rect class="amber" x="226" y="146" width="134" height="66" rx="6"/>
  <text class="tag small" x="238" y="166" fill="#e2903a">none</text>
  <text class="muted small" x="238" y="184">no section of BGE or GM;</text>
  <text class="muted small" x="238" y="198">III:15 is another mechanism</text>

  <path class="arrow" d="M 360 179 L 374 179"/>
  <path d="M 374 179 L 368 175 L 368 183 Z" fill="currentColor" fill-opacity="0.6"/>

  <rect class="fill" x="380" y="146" width="248" height="66" rx="6"/>
  <text class="label small" x="392" y="166">"the servant makes himself indispensable</text>
  <text class="label small" x="392" y="180">… the underling dominates the master"</text>
  <text class="muted small" x="392" y="198">stated by neither Z II 12 nor BGE 19</text>

  <line class="rule" x1="12" y1="226" x2="628" y2="226"/>

  <text class="muted small" x="12" y="250">the rows the map left empty are the rows the reading fills, and both fills come from outside the texts mapped</text>
  <text class="muted small" x="12" y="266">the reading needs the speech to be doctrine: the argued works contain no indicative sentence to fill them from</text>
</svg>

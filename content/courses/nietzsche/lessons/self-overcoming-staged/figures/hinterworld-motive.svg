<svg viewBox="0 0 640 290" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tag { font-weight: 600; }
    .box { fill: none; stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.4; }
    .ghost { fill: none; stroke: currentColor; stroke-opacity: 0.25; stroke-width: 1; stroke-dasharray: 3 3; }
    .amber { fill: #e2903a; fill-opacity: 0.12; stroke: #e2903a; stroke-width: 1.8; }
    .blue { fill: #4c8dd6; fill-opacity: 0.12; stroke: #4c8dd6; stroke-width: 1.4; }
    .arrow { stroke: #e2903a; stroke-width: 2; fill: none; }
    .flow { stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.2; fill: none; stroke-dasharray: 3 3; }
  </style>

  <text class="tag" x="12" y="20">the fable's first two stages, and the arrow the speech adds</text>

  <!-- the motive, amber, entering from the left -->
  <rect class="amber" x="12" y="44" width="176" height="78" rx="6"/>
  <text class="tag small" x="22" y="62" fill="#e2903a">the motive (Z I 3)</text>
  <text class="label small" x="22" y="78">"it was suffering and incapacity</text>
  <text class="label small" x="22" y="92">that created all hinterworlds";</text>
  <text class="label small" x="22" y="106">"the body that despaired of the body"</text>
  <path class="arrow" d="M 188 83 L 236 83"/>
  <path d="M 236 83 L 227 77 L 227 89 Z" fill="#e2903a"/>

  <!-- the fable's ladder, stages 1-2 solid, 3-6 ghosted -->
  <rect class="box" x="240" y="44" width="180" height="36" rx="5"/>
  <text class="tag small" x="250" y="60">1. the true world attainable</text>
  <text class="label small" x="250" y="74">"he dwells in it, he is it"</text>
  <rect class="box" x="240" y="88" width="180" height="36" rx="5"/>
  <text class="tag small" x="250" y="104">2. unattainable, promised</text>
  <text class="label small" x="250" y="118">"to the sinner who repents"</text>
  <rect class="ghost" x="240" y="132" width="180" height="20" rx="5"/>
  <text class="muted small" x="250" y="146">3. postulated (Kant)</text>
  <rect class="ghost" x="240" y="156" width="180" height="20" rx="5"/>
  <text class="muted small" x="250" y="170">4. unattained, unknown</text>
  <rect class="ghost" x="240" y="180" width="180" height="20" rx="5"/>
  <text class="muted small" x="250" y="194">5. useless, refuted</text>
  <rect class="ghost" x="240" y="204" width="180" height="20" rx="5"/>
  <text class="muted small" x="250" y="218">6. the pair abolished</text>
  <text class="muted small" x="240" y="240">TI (1888): a predicate moves, no motive named</text>

  <!-- the cure, told as biography, right -->
  <rect class="amber" x="444" y="156" width="184" height="78" rx="6"/>
  <text class="tag small" x="454" y="174" fill="#e2903a">the cure, as biography (Z I 3)</text>
  <text class="label small" x="454" y="190">"I overcame myself, my suffering self";</text>
  <text class="label small" x="454" y="204">"the ghost shrank from me";</text>
  <text class="label small" x="454" y="218">"of human make and madness"</text>
  <path class="flow" d="M 420 194 L 444 194"/>

  <!-- the argued counterpart of the motive, blue, below -->
  <rect class="blue" x="12" y="140" width="176" height="78" rx="6"/>
  <text class="tag small" x="22" y="158" fill="#4c8dd6">the argued counterpart</text>
  <text class="label small" x="22" y="174">TI "Reason" §6, third thesis:</text>
  <text class="label small" x="22" y="188">"an instinct for slandering life";</text>
  <text class="label small" x="22" y="202">"revenge on life": asserted</text>
  <path class="flow" d="M 100 140 L 100 122"/>

  <text class="muted small" x="12" y="262">the fable has the ladder and no motive; the speech has the motive and no ladder; the argued works state the motive</text>
  <text class="muted small" x="12" y="276">as a thesis about a type and do not argue it, so on this row the two registers are at the same evidential level</text>
</svg>

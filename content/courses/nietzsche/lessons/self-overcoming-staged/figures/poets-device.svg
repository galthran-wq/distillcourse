<svg viewBox="0 0 640 236" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tag { font-weight: 600; }
    .plain { fill: none; stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.4; }
    .amber { fill: #e2903a; fill-opacity: 0.12; stroke: #e2903a; stroke-width: 1.8; }
    .blue { fill: #4c8dd6; fill-opacity: 0.12; stroke: #4c8dd6; stroke-width: 1.4; }
    .arrow { stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.4; fill: none; }
    .cut { stroke: #4c8dd6; stroke-width: 1.6; fill: none; stroke-dasharray: 4 3; }
  </style>

  <text class="tag" x="12" y="20">the poets' device (Z II 17), and the speech it names (Z II 12)</text>

  <!-- 1: nature whispers -->
  <rect class="plain" x="12" y="40" width="190" height="100" rx="6"/>
  <text class="tag small" x="24" y="60">nature whispers</text>
  <text class="label small" x="24" y="80">"creeps up to their ears</text>
  <text class="label small" x="24" y="94">to tell them secrets"</text>
  <text class="muted small" x="24" y="116">no steps, no record of</text>
  <text class="muted small" x="24" y="130">what was said</text>

  <path class="arrow" d="M 202 90 L 222 90"/>
  <path d="M 222 90 L 215 86 L 215 94 Z" fill="currentColor" fill-opacity="0.6"/>

  <!-- 2: the poet reports -->
  <rect class="amber" x="226" y="40" width="190" height="100" rx="6"/>
  <text class="tag small" x="238" y="60" fill="#e2903a">the poet reports</text>
  <text class="label small" x="238" y="80">"this secret Life itself</text>
  <text class="label small" x="238" y="94">spoke to me" (Z II 12)</text>
  <text class="muted small" x="238" y="116">"I do not belong to those</text>
  <text class="muted small" x="238" y="130">whose Why may be questioned"</text>

  <path class="arrow" d="M 416 90 L 436 90"/>
  <path d="M 436 90 L 429 86 L 429 94 Z" fill="currentColor" fill-opacity="0.6"/>

  <!-- 3: the disciple believes -->
  <rect class="blue" x="440" y="40" width="188" height="100" rx="6"/>
  <text class="tag small" x="452" y="60" fill="#4c8dd6">the disciple believes</text>
  <text class="label small" x="452" y="80">"I believe in Zarathustra"</text>
  <text class="muted small" x="452" y="102">the reader's position: a report</text>
  <text class="muted small" x="452" y="116">of a whisper, held on faith</text>
  <text class="muted small" x="452" y="130">in the reporter</text>

  <!-- the undercut: from the poet, cutting under the disciple's ground -->
  <path class="cut" d="M 321 140 L 321 166 L 534 166 L 534 140"/>
  <text class="label small" x="12" y="186">the reply (Z II 17): "But Zarathustra too is a poet." "Faith does not make me blessed, especially not faith in me."</text>
  <text class="muted small" x="12" y="210">what the disciple holds is a poet's report of a whisper, and the frame withdraws the one ground he gave for it</text>
</svg>

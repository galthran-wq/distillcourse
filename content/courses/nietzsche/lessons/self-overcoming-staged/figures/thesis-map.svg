<svg viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tag { font-weight: 600; }
    .rule { stroke: currentColor; stroke-opacity: 0.25; stroke-width: 1; }
    .head { stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.4; }
    .refblue { fill: #4c8dd6; }
    .refamber { fill: #e2903a; }
    .none { fill: #e2903a; fill-opacity: 0.12; stroke: #e2903a; stroke-width: 1.4; }
  </style>

  <text class="tag" x="12" y="20">"On Self-Overcoming" (Z II 12, 1883)</text>
  <text class="tag" x="420" y="20" fill="#4c8dd6">the argued passage</text>
  <line class="head" x1="12" y1="28" x2="628" y2="28"/>

  <text class="label small" x="12" y="48">"will to truth": a will to the thinkability of all being</text>
  <text class="refblue small" x="420" y="48">BGE 22; GM III:24</text>
  <line class="rule" x1="12" y1="56" x2="628" y2="56"/>

  <text class="label small" x="12" y="74">being shall bend and become the spirit's mirror</text>
  <text class="refblue small" x="420" y="74">BGE 9, the Stoics</text>
  <line class="rule" x1="12" y1="82" x2="628" y2="82"/>

  <text class="label small" x="12" y="100">"create the world before which you could kneel"</text>
  <text class="refblue small" x="420" y="100">BGE 9, "in its own image"; BGE 211</text>
  <line class="rule" x1="12" y1="108" x2="628" y2="108"/>

  <text class="label small" x="12" y="126">the people's good and evil reveals an ancient will to power</text>
  <text class="refblue small" x="420" y="126">Z I 15; BGE 260</text>
  <line class="rule" x1="12" y1="134" x2="628" y2="134"/>

  <text class="label small" x="12" y="152">all living is an obeying; who cannot obey himself is commanded</text>
  <text class="refblue small" x="420" y="152">BGE 19, under-wills</text>
  <line class="rule" x1="12" y1="160" x2="628" y2="160"/>

  <text class="label small" x="12" y="178">"wherever I found the living, there I found will to power"</text>
  <text class="refblue small" x="420" y="178">BGE 13; BGE 259</text>
  <line class="rule" x1="12" y1="186" x2="628" y2="186"/>

  <text class="label small" x="12" y="204">"even in the will of the serving I found the will to be master"</text>
  <text class="refblue small" x="420" y="204">BGE 19; GM II:12</text>
  <line class="rule" x1="12" y1="212" x2="628" y2="212"/>

  <text class="label small" x="12" y="230">the greatest gives way and risks life itself, for power</text>
  <text class="refblue small" x="420" y="230">BGE 13; GS 349</text>
  <line class="rule" x1="12" y1="238" x2="628" y2="238"/>

  <text class="label small" x="12" y="256">"will to existence" does not exist; not will to life, will to power</text>
  <text class="refblue small" x="420" y="256">BGE 13, the razor: the one argument</text>
  <line class="rule" x1="12" y1="264" x2="628" y2="264"/>

  <text class="label small" x="12" y="282">"will to beget", "drive to a purpose": all this is one</text>
  <text class="refblue small" x="420" y="282">BGE 36, step 7, "one basic form"</text>
  <line class="rule" x1="12" y1="290" x2="628" y2="290"/>

  <rect class="none" x="414" y="296" width="214" height="20" rx="4"/>
  <text class="label small" x="12" y="310">Life itself spoke: "I am that which must always overcome itself"</text>
  <text class="refamber small" x="420" y="310">none: BGE 36 says "would be"</text>
  <line class="rule" x1="12" y1="318" x2="628" y2="318"/>

  <rect class="none" x="414" y="324" width="214" height="20" rx="4"/>
  <text class="label small" x="12" y="338">"this secret"; the hundredfold mirror; "thus Life once taught me"</text>
  <text class="refamber small" x="420" y="338">none: the personification</text>
  <line class="rule" x1="12" y1="346" x2="628" y2="346"/>

  <text class="muted small" x="12" y="368">twelve lines; ten with an argued passage, two, in the accent colour, with none</text>
</svg>

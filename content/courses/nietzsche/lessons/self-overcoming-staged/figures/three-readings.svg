<svg viewBox="0 0 640 262" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tag { font-weight: 600; }
    .row { fill: #e2903a; fill-opacity: 0.12; stroke: #e2903a; stroke-width: 1.8; }
    .amber { fill: #e2903a; fill-opacity: 0.12; stroke: #e2903a; stroke-width: 1.4; }
    .blue { fill: #4c8dd6; fill-opacity: 0.12; stroke: #4c8dd6; stroke-width: 1.4; }
    .fill { fill: none; stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.4; stroke-dasharray: 5 3; }
    .arrow { stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.4; fill: none; }
    .band { stroke: currentColor; stroke-opacity: 0.25; stroke-width: 1; }
  </style>

  <text class="tag" x="12" y="20">one row, three speakers</text>

  <!-- the amber row -->
  <rect class="row" x="70" y="32" width="500" height="40" rx="6"/>
  <text class="label small" x="82" y="50">Z II 12: "and this secret Life itself spoke to me:</text>
  <text class="label small" x="82" y="64">'I am that which must always overcome itself'"</text>

  <!-- fan to three readings -->
  <path class="arrow" d="M 320 72 L 110 106"/>
  <path class="arrow" d="M 320 72 L 320 106"/>
  <path class="arrow" d="M 320 72 L 530 106"/>
  <path d="M 110 106 L 118 100 L 114 108 Z" fill="currentColor" fill-opacity="0.6"/>
  <path d="M 320 106 L 316 99 L 324 99 Z" fill="currentColor" fill-opacity="0.6"/>
  <path d="M 530 106 L 522 100 L 526 108 Z" fill="currentColor" fill-opacity="0.6"/>

  <!-- 1: the dramatization rule -->
  <rect class="amber" x="12" y="110" width="196" height="88" rx="6"/>
  <text class="tag small" x="24" y="130" fill="#e2903a">the dramatization rule</text>
  <text class="label small" x="24" y="150">a character reports</text>
  <text class="muted small" x="24" y="170">Zarathustra quotes a personification;</text>
  <text class="muted small" x="24" y="184">testimony, cited for what it adds</text>

  <!-- 2: Clark and Dudrick -->
  <rect class="blue" x="222" y="110" width="196" height="88" rx="6"/>
  <text class="tag small" x="234" y="130" fill="#4c8dd6">Clark and Dudrick</text>
  <text class="label small" x="234" y="150">a value speaks</text>
  <text class="muted small" x="234" y="170">the will to value in its own person;</text>
  <text class="muted small" x="234" y="184">the personification is the point</text>

  <!-- 3: Heidegger -->
  <rect class="fill" x="432" y="110" width="196" height="88" rx="6"/>
  <text class="tag small" x="444" y="130">Heidegger</text>
  <text class="label small" x="444" y="150">Being speaks</text>
  <text class="muted small" x="444" y="170">"life" another word for Being;</text>
  <text class="muted small" x="444" y="184">the sentence is the doctrine</text>

  <line class="band" x1="12" y1="214" x2="628" y2="214"/>
  <text class="label small" x="12" y="234">on all three the sentence is not an argument</text>
  <text class="muted small" x="12" y="250">the division: whether a text that is not an argument can be the doctrine, which is Module 7's question</text>
</svg>

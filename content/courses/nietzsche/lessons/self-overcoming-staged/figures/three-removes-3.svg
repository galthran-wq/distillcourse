<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tag { font-weight: 600; }
    .box { fill: none; stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.4; }
    .blue { fill: #4c8dd6; fill-opacity: 0.12; stroke: #4c8dd6; stroke-width: 1.4; }
    .amber { fill: #e2903a; fill-opacity: 0.12; stroke: #e2903a; stroke-width: 1.8; }
    .flow { stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.4; fill: none; }
    .refblue { fill: #4c8dd6; }
    .refamber { fill: #e2903a; }
  </style>

  <text class="tag" x="12" y="20">the claim: life, the world, is will to power and nothing besides</text>
  <text class="muted small" x="12" y="36">three routes to the reader, one per frame; the count at the right is the number of speakers between the claim and the reader</text>

  <!-- the reader column -->
  <rect class="box" x="548" y="60" width="80" height="196" rx="6"/>
  <text class="tag small" x="566" y="80">the reader</text>

  <!-- row 1: the argument -->
  <rect class="blue" x="12" y="60" width="380" height="52" rx="6"/>
  <text class="tag small" x="22" y="78" fill="#4c8dd6">BGE 36, 1886: an argument</text>
  <text class="label small" x="22" y="93">seven steps, six under "suppose"; step 1 supposes the will step 7 concludes to</text>
  <text class="label small" x="22" y="106">conclusion: "would be" (wäre)</text>
  <path class="flow" d="M 392 86 L 548 86"/>
  <path d="M 548 86 L 540 81 L 540 91 Z" fill="currentColor" fill-opacity="0.6"/>
  <text class="refblue small" x="420" y="80">0 removes</text>
  <text class="muted small" x="420" y="100">one supposition</text>

  <!-- row 2: the personification -->
  <rect class="amber" x="12" y="132" width="380" height="52" rx="6"/>
  <text class="tag small" x="22" y="150" fill="#e2903a">Z II 12, 1883: Life speaks</text>
  <text class="label small" x="22" y="165">"I am that which must always overcome itself": no steps, no "suppose"</text>
  <text class="label small" x="22" y="178">conclusion: "I am" (ich bin)</text>
  <path class="flow" d="M 392 158 L 548 158"/>
  <path d="M 548 158 L 540 153 L 540 163 Z" fill="currentColor" fill-opacity="0.6"/>
  <text class="refamber small" x="420" y="152">1 remove</text>
  <text class="muted small" x="420" y="172">a personification's voice</text>

  <!-- row 3: the report -->
  <rect class="amber" x="12" y="204" width="380" height="52" rx="6"/>
  <text class="tag small" x="22" y="222" fill="#e2903a">Z II 12: Zarathustra reports it</text>
  <text class="label small" x="22" y="237">"thus Life once taught me", said to "you wisest ones", in a book</text>
  <text class="label small" x="22" y="250">whose speaker says "Zarathustra too is a poet" (II 17)</text>
  <path class="flow" d="M 392 230 L 548 230"/>
  <path d="M 548 230 L 540 225 L 540 235 Z" fill="currentColor" fill-opacity="0.6"/>
  <text class="refamber small" x="420" y="224">2 removes</text>
  <text class="muted small" x="420" y="244">a character quoting a character</text>

  <text class="muted small" x="12" y="284">frame 3: what the reader holds is a report of a testimony; the argued route is the only one that can be checked step by step</text>
</svg>

<svg viewBox="0 0 640 230" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tag { font-weight: 600; }
    .beast { fill: #e2903a; fill-opacity: 0.12; stroke: #e2903a; stroke-width: 1.8; }
    .people { fill: none; stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.2; }
    .fan { stroke: currentColor; stroke-opacity: 0.45; stroke-width: 1.2; fill: none; }
    .claim { fill: none; stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .x { stroke: currentColor; stroke-opacity: 0.7; stroke-width: 2; }
  </style>

  <rect class="beast" x="120" y="16" width="400" height="44" rx="6"/>
  <text class="tag" x="320" y="34" text-anchor="middle" fill="#e2903a">"the beast of prey, the magnificent blond beast prowling for spoil and victory"</text>
  <text class="muted small" x="320" y="50" text-anchor="middle">"at the base of all these noble races" (I:11); the adjective belongs to the lion</text>

  <!-- fan to six -->
  <path class="fan" d="M 320 60 L 66 104"/>
  <path class="fan" d="M 320 60 L 168 104"/>
  <path class="fan" d="M 320 60 L 270 104"/>
  <path class="fan" d="M 320 60 L 372 104"/>
  <path class="fan" d="M 320 60 L 474 104"/>
  <path class="fan" d="M 320 60 L 576 104"/>

  <rect class="people" x="16" y="106" width="100" height="40" rx="5"/>
  <text class="label small" x="66" y="124" text-anchor="middle">Roman</text>
  <text class="muted small" x="66" y="138" text-anchor="middle">nobility</text>

  <rect class="people" x="118" y="106" width="100" height="40" rx="5"/>
  <text class="label small" x="168" y="124" text-anchor="middle">Arabian</text>
  <text class="muted small" x="168" y="138" text-anchor="middle">nobility</text>

  <rect class="people" x="220" y="106" width="100" height="40" rx="5"/>
  <text class="label small" x="270" y="124" text-anchor="middle">Germanic</text>
  <text class="muted small" x="270" y="138" text-anchor="middle">nobility</text>

  <rect class="people" x="322" y="106" width="100" height="40" rx="5"/>
  <text class="label small" x="372" y="124" text-anchor="middle">Japanese</text>
  <text class="muted small" x="372" y="138" text-anchor="middle">nobility</text>

  <rect class="people" x="424" y="106" width="100" height="40" rx="5"/>
  <text class="label small" x="474" y="124" text-anchor="middle">Homeric</text>
  <text class="muted small" x="474" y="138" text-anchor="middle">heroes</text>

  <rect class="people" x="526" y="106" width="100" height="40" rx="5"/>
  <text class="label small" x="576" y="124" text-anchor="middle">Scandinavian</text>
  <text class="muted small" x="576" y="138" text-anchor="middle">Vikings</text>

  <text class="muted small" x="320" y="166" text-anchor="middle">"in this need they are all alike": one item of six is Germanic, and I:11 adds that between the old Germans</text>
  <text class="muted small" x="320" y="180" text-anchor="middle">and "us Germans there exists scarcely a conceptual, let alone a blood, relationship"</text>

  <rect class="claim" x="150" y="194" width="340" height="26" rx="5"/>
  <text class="label small" x="320" y="211" text-anchor="middle">"a Germanic master race praised"</text>
  <path class="x" d="M 476 198 L 486 208 M 486 198 L 476 208"/>
</svg>

<svg viewBox="0 0 640 250" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tag { font-weight: 600; }
    .panel-n { fill: none; stroke: #e2903a; stroke-width: 2; }
    .panel-s { fill: none; stroke: #4c8dd6; stroke-width: 1.6; }
    .eye { fill: none; stroke: currentColor; stroke-width: 1.4; }
    .pupil-n { fill: #e2903a; }
    .pupil-s { fill: #4c8dd6; }
    .first-n { stroke: #e2903a; stroke-width: 2.2; fill: none; }
    .first-s { stroke: #4c8dd6; stroke-width: 2.2; fill: none; }
    .second { stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.4; fill: none; stroke-dasharray: 4 3; }
    .box { fill: none; stroke: currentColor; stroke-opacity: 0.4; stroke-width: 1.2; }
    .badge-n { fill: #e2903a; }
    .badge-s { fill: #4c8dd6; }
    .badgetext { fill: white; font-size: 10px; font-weight: 700; }
  </style>

  <!-- noble panel -->
  <rect class="panel-n" x="16" y="16" width="296" height="200" rx="6"/>
  <text class="tag" x="28" y="36" fill="#e2903a">noble valuation: the glance turns back on itself</text>
  <!-- eye -->
  <path class="eye" d="M 60 120 Q 100 84 140 120 Q 100 156 60 120 Z"/>
  <circle class="pupil-n" cx="100" cy="120" r="9"/>
  <!-- first: to self (loop) -->
  <path class="first-n" d="M 100 108 C 60 60 150 50 118 96"/>
  <path class="first-n" d="M 112 92 L 118 96 L 120 89"/>
  <circle class="badge-n" cx="86" cy="60" r="8"/>
  <text class="badgetext" x="86" y="64" text-anchor="middle">1</text>
  <text class="label small" x="150" y="64">"we the good": a Yes, of itself</text>
  <!-- second: outward -->
  <path class="second" d="M 140 120 L 210 120"/>
  <path class="second" d="M 204 116 L 210 120 L 204 124"/>
  <rect class="box" x="216" y="104" width="86" height="32" rx="5"/>
  <text class="label small" x="259" y="124" text-anchor="middle">"the bad"</text>
  <circle class="badge-n" cx="176" cy="104" r="8"/>
  <text class="badgetext" x="176" y="108" text-anchor="middle">2</text>
  <text class="muted small" x="28" y="186">"seeks its opposite only in order to say Yes</text>
  <text class="muted small" x="28" y="200">to itself still more gratefully" (I:10)</text>

  <!-- slave panel -->
  <rect class="panel-s" x="328" y="16" width="296" height="200" rx="6"/>
  <text class="tag" x="340" y="36" fill="#4c8dd6">ressentiment: "the reversal of the value-positing glance"</text>
  <!-- eye -->
  <path class="eye" d="M 372 120 Q 412 84 452 120 Q 412 156 372 120 Z"/>
  <circle class="pupil-s" cx="420" cy="120" r="9"/>
  <!-- first: outward -->
  <path class="first-s" d="M 452 120 L 522 120"/>
  <path class="first-s" d="M 515 115 L 522 120 L 515 125"/>
  <rect class="box" x="528" y="104" width="88" height="32" rx="5"/>
  <text class="label small" x="572" y="124" text-anchor="middle">"the evil enemy"</text>
  <circle class="badge-s" cx="488" cy="104" r="8"/>
  <text class="badgetext" x="488" y="108" text-anchor="middle">1</text>
  <!-- second: back to self -->
  <path class="second" d="M 412 108 C 372 60 462 50 430 96"/>
  <path class="second" d="M 424 92 L 430 96 L 432 89"/>
  <circle class="badge-s" cx="398" cy="60" r="8"/>
  <text class="badgetext" x="398" y="64" text-anchor="middle">2</text>
  <text class="label small" x="462" y="64">"a good one, himself": by negation</text>
  <text class="muted small" x="340" y="186">"needs external stimuli in order to act at all;</text>
  <text class="muted small" x="340" y="200">its action is fundamentally a reaction" (I:10)</text>

  <text class="muted small" x="320" y="240" text-anchor="middle">the same two objects, self and other; what differs is which the glance reaches first, and whether it can look away</text>
</svg>

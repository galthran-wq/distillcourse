<svg viewBox="0 0 640 290" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tag { font-weight: 600; }
    .knight { fill: #e2903a; fill-opacity: 0.12; stroke: #e2903a; stroke-width: 2; }
    .priest { fill: none; stroke: currentColor; stroke-width: 1.6; }
    .slave { fill: #4c8dd6; fill-opacity: 0.12; stroke: #4c8dd6; stroke-width: 1.6; }
    .rank { stroke: currentColor; stroke-opacity: 0.45; stroke-width: 1.2; stroke-dasharray: 4 3; fill: none; }
    .arrow { stroke: currentColor; stroke-opacity: 0.7; stroke-width: 1.4; fill: none; }
    .arrowhot { stroke: #e2903a; stroke-width: 1.6; fill: none; }
  </style>

  <!-- rank line -->
  <path class="rank" d="M 16 150 L 624 150"/>
  <text class="muted small" x="16" y="142">above the line: noble by rank (I:6, "the highest caste")</text>
  <text class="muted small" x="16" y="166">below the line: the subjects, "an under"</text>

  <!-- knightly box -->
  <rect class="knight" x="16" y="40" width="190" height="86" rx="6"/>
  <text class="tag" x="28" y="60" fill="#e2903a">knightly-aristocratic</text>
  <text class="label small" x="28" y="78">"a powerful physicality, war,</text>
  <text class="label small" x="28" y="93">adventure, hunting, dancing" (I:7)</text>
  <text class="muted small" x="28" y="114">acts; "good" of itself first</text>

  <!-- priestly box straddling -->
  <rect class="priest" x="238" y="96" width="190" height="108" rx="6"/>
  <text class="tag" x="250" y="116">priestly-aristocratic</text>
  <text class="label small" x="250" y="134">noble by rank: "clean" against "unclean"</text>
  <text class="tag small" x="250" y="168" fill="#e2903a">impotent in action</text>
  <text class="label small" x="250" y="184">"bad enough for it when it comes to war"</text>
  <text class="tag small" x="250" y="198" fill="#e2903a">hatred grows; it invents (I:7)</text>

  <!-- slave box -->
  <rect class="slave" x="450" y="176" width="174" height="86" rx="6"/>
  <text class="tag" x="462" y="196" fill="#4c8dd6">slave valuation</text>
  <text class="label small" x="462" y="214">"the wretched alone are</text>
  <text class="label small" x="462" y="229">the good" (I:7)</text>
  <text class="muted small" x="462" y="250">reacts; "evil" of the other first</text>

  <!-- arrows -->
  <path class="arrow" d="M 206 96 C 222 96 222 120 238 120"/>
  <path class="arrow" d="M 232 116 L 238 120 L 232 124"/>
  <text class="muted small" x="120" y="30">"branches off" from the knightly mode (I:7)</text>

  <path class="arrowhot" d="M 428 176 C 440 176 440 200 450 200"/>
  <path class="arrowhot" d="M 444 196 L 450 200 L 444 204"/>
  <text class="tag small" x="330" y="236" fill="#e2903a">coins the inversion:</text>
  <text class="muted small" x="330" y="250">"an act of the most spiritual revenge"</text>

  <text class="muted small" x="320" y="282" text-anchor="middle">the hinge: a caste on both sides of the rank line, noble enough to name values and too weak to act</text>
</svg>

<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tag { font-weight: 600; }
    .noble { fill: #e2903a; fill-opacity: 0.12; stroke: #e2903a; stroke-width: 2; }
    .slave { fill: #4c8dd6; fill-opacity: 0.12; stroke: #4c8dd6; stroke-width: 1.6; }
    .evil { fill: none; stroke: #4c8dd6; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .arrow { stroke: #4c8dd6; stroke-width: 2; fill: none; }
  </style>

  <text class="tag" x="16" y="22" fill="#e2903a">the aristocratic value-equation (I:7)</text>
  <rect class="noble" x="16" y="32" width="608" height="40" rx="6"/>
  <text class="label" x="320" y="57" text-anchor="middle">good = noble = powerful = beautiful = happy = beloved of the gods</text>

  <!-- inversion arrow -->
  <path class="arrow" d="M 320 76 L 320 118"/>
  <path class="arrow" d="M 313 110 L 320 118 L 327 110"/>
  <text class="tag small" x="332" y="94" fill="#4c8dd6">"dared, with a terrifying consistency, the inversion"</text>
  <text class="muted small" x="332" y="108">held "with the teeth of the most abysmal hatred, the hatred of impotence"</text>

  <text class="tag" x="16" y="136" fill="#4c8dd6">the contrary equation (I:7; BGE 195)</text>
  <rect class="slave" x="16" y="146" width="608" height="56" rx="6"/>
  <text class="label" x="320" y="168" text-anchor="middle">good = wretched = poor = powerless = lowly = suffering = needy = sick = ugly</text>
  <text class="label" x="320" y="188" text-anchor="middle">= the only pious = the only blessed; "for them alone is there salvation"</text>

  <rect class="evil" x="16" y="212" width="608" height="40" rx="6"/>
  <text class="label" x="320" y="237" text-anchor="middle">evil = noble = powerful = cruel = lustful = insatiable = godless = damned</text>

  <text class="muted small" x="320" y="272" text-anchor="middle">BGE 195: "poor" becomes a synonym for "holy" and "friend"; "world" is coined as an insult</text>
  <text class="muted small" x="320" y="288" text-anchor="middle">every term of the first row is reassigned; nothing is added that the first row did not already rank</text>
</svg>

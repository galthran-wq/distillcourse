<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tag { font-weight: 600; }
    .axis { stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.2; }
    .tick { stroke: currentColor; stroke-opacity: 0.4; stroke-width: 1; }
    .lane { fill: none; stroke: currentColor; stroke-opacity: 0.25; stroke-width: 1; stroke-dasharray: 3 3; }
    .rome { fill: #e2903a; fill-opacity: 0.35; stroke: #e2903a; stroke-width: 1.4; }
    .judea { fill: #4c8dd6; fill-opacity: 0.35; stroke: #4c8dd6; stroke-width: 1.4; }
    .church { fill: #4c8dd6; fill-opacity: 0.12; stroke: #4c8dd6; stroke-width: 1; stroke-dasharray: 4 3; }
    .lead { stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1; fill: none; }
  </style>

  <!-- lanes: x = 80 + (year - 1380) * 1.174 ; 1400->103, 1517->241, 1550->280, 1648->395, 1789->560, 1799->572, 1815->591 -->
  <text class="tag" x="16" y="40" fill="#e2903a">ROME</text>
  <text class="muted small" x="16" y="54">"good and bad"</text>
  <text class="muted small" x="16" y="67">the aristocratic ideal</text>
  <rect class="lane" x="80" y="28" width="544" height="72" rx="4"/>

  <text class="tag" x="16" y="140" fill="#4c8dd6">JUDEA</text>
  <text class="muted small" x="16" y="154">"good and evil"</text>
  <text class="muted small" x="16" y="167">the valuation of ressentiment</text>
  <rect class="lane" x="80" y="128" width="544" height="72" rx="4"/>

  <!-- church background span in Judea lane (whole width) -->
  <rect class="church" x="82" y="176" width="540" height="20" rx="3"/>
  <text class="muted small" x="88" y="190">the Church throughout: "the new judaized Rome, built over the old, that looked like an ecumenical synagogue"</text>

  <!-- Renaissance: Rome lane -->
  <rect class="rome" x="103" y="44" width="177" height="30" rx="4"/>
  <text class="tag small" x="110" y="57">Renaissance</text>
  <text class="label small" x="110" y="70">"a brilliant, uncanny reawakening of the classical ideal"</text>

  <!-- Reformation: Judea lane -->
  <rect class="judea" x="241" y="140" width="154" height="30" rx="4"/>
  <text class="tag small" x="248" y="153">Reformation</text>
  <text class="label small" x="248" y="166">"German and English" movement of ressentiment</text>

  <!-- French Revolution: Judea lane -->
  <rect class="judea" x="560" y="140" width="12" height="30" rx="2"/>
  <path class="lead" d="M 566 140 L 566 118 L 470 118"/>
  <text class="tag small" x="466" y="114" text-anchor="end">French Revolution, 1789</text>
  <text class="label small" x="466" y="127" text-anchor="end">"the last political nobility broke"</text>

  <!-- Napoleon: Rome lane -->
  <rect class="rome" x="572" y="44" width="19" height="30" rx="2"/>
  <path class="lead" d="M 581 44 L 581 30 L 470 30"/>
  <text class="tag small" x="466" y="34" text-anchor="end">Napoleon, 1799 to 1815</text>
  <text class="label small" x="466" y="47" text-anchor="end">"synthesis of Unmensch and Übermensch"</text>

  <!-- axis -->
  <path class="axis" d="M 80 220 L 624 220"/>
  <path class="tick" d="M 103 216 L 103 224"/><text class="muted small" x="103" y="238" text-anchor="middle">1400</text>
  <path class="tick" d="M 221 216 L 221 224"/><text class="muted small" x="221" y="238" text-anchor="middle">1500</text>
  <path class="tick" d="M 338 216 L 338 224"/><text class="muted small" x="338" y="238" text-anchor="middle">1600</text>
  <path class="tick" d="M 456 216 L 456 224"/><text class="muted small" x="456" y="238" text-anchor="middle">1700</text>
  <path class="tick" d="M 573 216 L 573 224"/><text class="muted small" x="573" y="238" text-anchor="middle">1800</text>

  <text class="muted small" x="320" y="266" text-anchor="middle">I:16's four episodes, in the lane I:16 assigns: Judea's two victories are long, Rome's two returns are short and late</text>
  <text class="muted small" x="320" y="282" text-anchor="middle">"Rome is defeated", and yet the fight is "still undecided": the section's two verdicts on one timeline</text>
</svg>

<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tag { font-weight: 600; }
    .panel { fill: none; stroke: currentColor; stroke-opacity: 0.35; stroke-width: 1.2; }
    .step { fill: none; stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.2; }
    .fail { fill: none; stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .tension { fill: #4c8dd6; fill-opacity: 0.12; stroke: #4c8dd6; stroke-width: 1.4; }
    .resolve { fill: #e2903a; fill-opacity: 0.14; stroke: #e2903a; stroke-width: 1.8; }
    .arrow { stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.4; fill: none; }
    .arrowhot { stroke: #e2903a; stroke-width: 1.8; fill: none; }
    .clash { stroke: #4c8dd6; stroke-width: 1.6; fill: none; }
    .x { stroke: currentColor; stroke-opacity: 0.7; stroke-width: 2; }
  </style>

  <!-- left: strategic reading -->
  <rect class="panel" x="16" y="16" width="296" height="298" rx="6"/>
  <text class="tag" x="28" y="36">the strategic reading, run to its end (Wallace)</text>
  <text class="muted small" x="28" y="50">"evil" invented as a calculated weapon</text>

  <rect class="step" x="28" y="62" width="272" height="44" rx="5"/>
  <text class="label small" x="40" y="80">1. the weak erect a new table of values</text>
  <text class="label small" x="40" y="96">in order to harm the masters</text>

  <path class="arrow" d="M 164 106 L 164 122"/>
  <path class="arrow" d="M 160 117 L 164 122 L 168 117"/>

  <rect class="step" x="28" y="124" width="272" height="44" rx="5"/>
  <text class="label small" x="40" y="142">2. a table of values is a weapon the powerful</text>
  <text class="label small" x="40" y="158">can ignore, or suppress</text>

  <path class="arrow" d="M 164 168 L 164 184"/>
  <path class="arrow" d="M 160 179 L 164 184 L 168 179"/>

  <rect class="fail" x="28" y="186" width="272" height="60" rx="5"/>
  <text class="label small" x="40" y="204">3. so the weak could not expect it to work,</text>
  <text class="label small" x="40" y="220">the "two millennia" of I:7 are unexplained,</text>
  <text class="label small" x="40" y="236">and a value held as a weapon is not a value</text>
  <path class="x" d="M 280 194 L 292 206 M 292 194 L 280 206"/>

  <text class="muted small" x="28" y="270">the reading uses the text's own words</text>
  <text class="muted small" x="28" y="284">("the most spiritual revenge", I:7) and</text>
  <text class="muted small" x="28" y="298">cannot explain the event they describe</text>

  <!-- right: expressive reading -->
  <rect class="panel" x="328" y="16" width="296" height="298" rx="6"/>
  <text class="tag" x="340" y="36">the expressive reading</text>
  <text class="muted small" x="340" y="50">"evil" as the resolution of a contradiction</text>

  <rect class="tension" x="340" y="62" width="130" height="58" rx="5"/>
  <text class="tag small" x="405" y="82" text-anchor="middle" fill="#4c8dd6">the affect</text>
  <text class="label small" x="405" y="98" text-anchor="middle">hatred of the masters</text>
  <text class="label small" x="405" y="112" text-anchor="middle">(impotence, I:7, I:10)</text>

  <rect class="tension" x="482" y="62" width="130" height="58" rx="5"/>
  <text class="tag small" x="547" y="82" text-anchor="middle" fill="#4c8dd6">the old code</text>
  <text class="label small" x="547" y="98" text-anchor="middle">the masters are</text>
  <text class="label small" x="547" y="112" text-anchor="middle">"the good" (I:2)</text>

  <path class="clash" d="M 470 91 L 482 91"/>
  <text class="tag small" x="476" y="136" text-anchor="middle" fill="#4c8dd6">held together: unstable</text>
  <text class="muted small" x="476" y="150" text-anchor="middle">one hates what one must admire</text>

  <path class="arrowhot" d="M 476 156 L 476 176"/>
  <path class="arrowhot" d="M 471 170 L 476 176 L 481 170"/>

  <rect class="resolve" x="340" y="178" width="272" height="66" rx="5"/>
  <text class="tag small" x="476" y="198" text-anchor="middle" fill="#e2903a">the new code: the masters are "evil"</text>
  <text class="label small" x="476" y="214" text-anchor="middle">the hatred is now merited by its object;</text>
  <text class="label small" x="476" y="230" text-anchor="middle">"good" of oneself follows by negation (I:10)</text>

  <text class="muted small" x="340" y="270">"ressentiment becomes creative" (I:10) read as</text>
  <text class="muted small" x="340" y="284">expression: the values are believed, not wielded,</text>
  <text class="muted small" x="340" y="298">and "evil" is coined first because it does the resolving</text>
</svg>

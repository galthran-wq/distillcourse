<svg viewBox="0 0 640 250" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tag { font-weight: 600; }
    .done { fill: #e2903a; fill-opacity: 0.12; stroke: #e2903a; stroke-width: 1.8; }
    .open { fill: none; stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.4; stroke-dasharray: 5 3; }
    .later { fill: #4c8dd6; fill-opacity: 0.12; stroke: #4c8dd6; stroke-width: 1.4; }
    .arrow { stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.4; fill: none; }
    .dashed { stroke: #4c8dd6; stroke-width: 1.4; fill: none; stroke-dasharray: 4 3; }
  </style>

  <rect class="done" x="16" y="40" width="200" height="96" rx="6"/>
  <text class="tag" x="28" y="60" fill="#e2903a">the inversion: explained</text>
  <text class="label small" x="28" y="78">I:7 the caste, its impotence</text>
  <text class="label small" x="28" y="92">I:10 the affect, the No</text>
  <text class="label small" x="28" y="106">I:14 the relabeling</text>
  <text class="label small" x="28" y="120">I:15 the document</text>

  <path class="arrow" d="M 216 88 L 250 88"/>
  <path class="arrow" d="M 244 84 L 250 88 L 244 92"/>

  <rect class="open" x="252" y="40" width="200" height="96" rx="6"/>
  <text class="tag" x="264" y="60">the victory: not explained</text>
  <text class="label small" x="264" y="78">I:7: "two millennia", "victorious"</text>
  <text class="label small" x="264" y="92">I:16: "Rome is defeated", yet</text>
  <text class="label small" x="264" y="106">"the fight is still undecided"</text>
  <text class="muted small" x="264" y="124">why did the strong go along?</text>

  <path class="dashed" d="M 452 70 C 470 70 470 52 488 52"/>
  <path class="dashed" d="M 482 48 L 488 52 L 482 56"/>
  <path class="dashed" d="M 452 106 C 470 106 470 130 488 130"/>
  <path class="dashed" d="M 482 126 L 488 130 L 482 134"/>

  <rect class="later" x="490" y="30" width="134" height="52" rx="6"/>
  <text class="tag small" x="500" y="48" fill="#4c8dd6">GM II: bad conscience</text>
  <text class="label small" x="500" y="62">cruelty turned inward:</text>
  <text class="label small" x="500" y="75">a site inside the strong</text>

  <rect class="later" x="490" y="108" width="134" height="52" rx="6"/>
  <text class="tag small" x="500" y="126" fill="#4c8dd6">GM III: the priest</text>
  <text class="label small" x="500" y="140">redirects "someone is to</text>
  <text class="label small" x="500" y="153">blame": "you yourself"</text>

  <text class="muted small" x="16" y="190">the missing premise, stated: a valuation adopted by the many becomes the valuation of the strong</text>
  <text class="muted small" x="16" y="206">nothing in I:1–17 supplies it; Leiter (ch. 6): the Second and Third Treatises replace it with mechanisms,</text>
  <text class="muted small" x="16" y="222">and Reginster's caution: the three mechanisms interpenetrate rather than sit in three boxes</text>
</svg>

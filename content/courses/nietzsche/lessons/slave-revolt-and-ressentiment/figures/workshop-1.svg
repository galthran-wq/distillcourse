<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tag { font-weight: 600; }
    .head { fill: currentColor; opacity: 0.7; font-size: 10.5px; font-weight: 600; letter-spacing: 0.04em; }
    .rule { stroke: currentColor; stroke-opacity: 0.35; stroke-width: 1; }
    .strike { stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.4; }
    .strikehot { stroke: #e2903a; stroke-width: 1.6; }
    .arrow { stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.4; fill: none; }
    .arrowhot { stroke: #e2903a; stroke-width: 1.8; fill: none; }
    .box { fill: none; stroke: currentColor; stroke-opacity: 0.4; stroke-width: 1.2; }
    .boxhot { fill: #e2903a; fill-opacity: 0.12; stroke: #e2903a; stroke-width: 1.6; }
  </style>
  <text class="tag" x="16" y="22">the workshop of ideals (I:14), frame 1 of 5: substitution 1</text>
  <text class="head" x="32" y="48">WHAT IS THERE (the condition)</text>
  <text class="head" x="392" y="48">WHAT IT IS CALLED (the ideal)</text>
  <path class="rule" d="M 16 56 L 624 56"/>
  <text class="label" x="32" y="84">weakness</text>
  <text class="muted small" x="32" y="98">Schwäche</text>
  <line class="strikehot" x1="30" y1="80" x2="94" y2="80"/>
  <path class="arrowhot" d="M 340 80 L 376 80"/>
  <path class="arrowhot" d="M 370 76 L 376 80 L 370 84"/>
  <rect class="boxhot" x="386" y="66" width="238" height="34" rx="5"/>
  <text class="tag" x="396" y="83" fill="#e2903a">"merit"</text>
  <text class="muted small" x="396" y="96">Verdienst</text>
  <text class="muted small" x="32" y="112">"weakness is to be lied into a merit"</text>
  <text class="muted small" x="16" y="290">"I see nothing, I hear all the more": each row is one word the interlocutor hears being coined</text>
</svg>

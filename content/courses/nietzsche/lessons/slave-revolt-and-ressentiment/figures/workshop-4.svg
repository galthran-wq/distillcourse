<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tag { font-weight: 600; }
    .head { fill: currentColor; opacity: 0.7; font-size: 10.5px; font-weight: 600; letter-spacing: 0.04em; }
    .rule { stroke: currentColor; stroke-opacity: 0.35; stroke-width: 1; }
    .strike { stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.4; }
    .strikehot { stroke: #e2903a; stroke-width: 1.6; }
    .arrow { stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.4; fill: none; }
    .arrowhot { stroke: #e2903a; stroke-width: 1.8; fill: none; }
    .box { fill: none; stroke: currentColor; stroke-opacity: 0.4; stroke-width: 1.2; }
    .boxhot { fill: #e2903a; fill-opacity: 0.12; stroke: #e2903a; stroke-width: 1.6; }
  </style>
  <text class="tag" x="16" y="22">the workshop of ideals (I:14), frame 4 of 5: substitution 4</text>
  <text class="head" x="32" y="48">WHAT IS THERE (the condition)</text>
  <text class="head" x="392" y="48">WHAT IT IS CALLED (the ideal)</text>
  <path class="rule" d="M 16 56 L 624 56"/>
  <text class="label" x="32" y="84">weakness</text>
  <text class="muted small" x="32" y="98">Schwäche</text>
  <line class="strike" x1="30" y1="80" x2="94" y2="80"/>
  <path class="arrow" d="M 340 80 L 376 80"/>
  <path class="arrow" d="M 370 76 L 376 80 L 370 84"/>
  <rect class="box" x="386" y="66" width="238" height="34" rx="5"/>
  <text class="tag" x="396" y="83">"merit"</text>
  <text class="muted small" x="396" y="96">Verdienst</text>
  <text class="label" x="32" y="124">impotence that does not requite</text>
  <text class="muted small" x="32" y="138">Ohnmacht</text>
  <line class="strike" x1="30" y1="120" x2="228" y2="120"/>
  <path class="arrow" d="M 340 120 L 376 120"/>
  <path class="arrow" d="M 370 116 L 376 120 L 370 124"/>
  <rect class="box" x="386" y="106" width="238" height="34" rx="5"/>
  <text class="tag" x="396" y="123">"goodness"</text>
  <text class="muted small" x="396" y="136">Güte</text>
  <text class="label" x="32" y="164">anxious lowliness</text>
  <text class="muted small" x="32" y="178">ängstliche Niedrigkeit</text>
  <line class="strike" x1="30" y1="160" x2="144" y2="160"/>
  <path class="arrow" d="M 340 160 L 376 160"/>
  <path class="arrow" d="M 370 156 L 376 160 L 370 164"/>
  <rect class="box" x="386" y="146" width="238" height="34" rx="5"/>
  <text class="tag" x="396" y="163">"humility"</text>
  <text class="muted small" x="396" y="176">Demuth</text>
  <text class="label" x="32" y="204">submission to those one hates</text>
  <text class="muted small" x="32" y="218">Unterwerfung</text>
  <line class="strikehot" x1="30" y1="200" x2="222" y2="200"/>
  <path class="arrowhot" d="M 340 200 L 376 200"/>
  <path class="arrowhot" d="M 370 196 L 376 200 L 370 204"/>
  <rect class="boxhot" x="386" y="186" width="238" height="34" rx="5"/>
  <text class="tag" x="396" y="203" fill="#e2903a">"obedience"</text>
  <text class="muted small" x="396" y="216">Gehorsam</text>
  <text class="muted small" x="32" y="232">"to one they say commands this submission: God"</text>
  <text class="muted small" x="16" y="290">"I see nothing, I hear all the more": each row is one word the interlocutor hears being coined</text>
</svg>

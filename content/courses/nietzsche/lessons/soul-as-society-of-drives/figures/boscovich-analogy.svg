<svg viewBox="0 0 640 346" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tag { fill: currentColor; font-weight: 600; }
    .box { fill: none; stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.3; }
    .box-a { fill: none; stroke: #e2903a; stroke-width: 2; }
    .box-b { fill: none; stroke: #4c8dd6; stroke-width: 1.6; }
    .lump { fill: currentColor; fill-opacity: 0.35; }
    .arrow { stroke: #e2903a; stroke-width: 1.8; fill: none; }
    .field { stroke: #4c8dd6; stroke-width: 1; fill: none; opacity: 0.7; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .rule { stroke: currentColor; stroke-opacity: 0.35; stroke-width: 1; }
  </style>

  <text class="tag" x="16" y="22">physics: Boscovich's step (1758)</text>
  <rect class="box" x="16" y="34" width="250" height="100" rx="6"/>
  <text class="label small" x="28" y="52">the particle atom</text>
  <circle cx="60" cy="90" r="16" class="lump"/>
  <circle cx="100" cy="98" r="16" class="lump"/>
  <circle cx="82" cy="70" r="16" class="lump"/>
  <text class="muted small" x="130" y="80">extended, indivisible lumps;</text>
  <text class="muted small" x="130" y="96">"the last bit of earth that</text>
  <text class="muted small" x="130" y="112">stood still"</text>

  <path class="arrow" d="M 272 84 L 356 84"/>
  <path class="arrow" d="M 348 78 L 356 84 L 348 90"/>
  <text class="amber small" x="314" y="72" text-anchor="middle">refuted</text>

  <rect class="box-b" x="362" y="34" width="262" height="100" rx="6"/>
  <text class="blue small" x="374" y="52">extensionless centres of force</text>
  <circle cx="410" cy="90" r="2.5" fill="#4c8dd6"/>
  <circle cx="410" cy="90" r="10" class="field"/>
  <circle cx="410" cy="90" r="20" class="field"/>
  <circle cx="460" cy="96" r="2.5" fill="#4c8dd6"/>
  <circle cx="460" cy="96" r="10" class="field"/>
  <circle cx="460" cy="96" r="20" class="field"/>
  <text class="muted small" x="488" y="84">nothing left at the small</text>
  <text class="muted small" x="488" y="100">scale that could even in</text>
  <text class="muted small" x="488" y="116">principle be seen or touched</text>

  <text class="tag" x="16" y="166">psychology: the step BGE 12 asks for, "still further"</text>
  <rect class="box" x="16" y="178" width="250" height="100" rx="6"/>
  <text class="label small" x="28" y="196">the soul-atom</text>
  <circle cx="82" cy="238" r="22" class="lump"/>
  <text class="muted small" x="130" y="224">one indivisible thing behind</text>
  <text class="muted small" x="130" y="240">thinking and willing; a lump</text>
  <text class="muted small" x="130" y="256">of the same kind, moved inside</text>

  <path class="arrow" d="M 272 228 L 356 228"/>
  <path class="arrow" d="M 348 222 L 356 228 L 348 234"/>
  <text class="amber small" x="314" y="216" text-anchor="middle">expelled</text>

  <rect class="box-a" x="362" y="178" width="262" height="100" rx="6"/>
  <text class="amber small" x="374" y="196">drives: centres of force, in an order</text>
  <circle cx="410" cy="236" r="2.5" fill="#e2903a"/>
  <circle cx="410" cy="236" r="14" class="field"/>
  <circle cx="445" cy="250" r="2.5" fill="#e2903a"/>
  <circle cx="445" cy="250" r="9" class="field"/>
  <circle cx="470" cy="232" r="2.5" fill="#e2903a"/>
  <circle cx="470" cy="232" r="7" class="field"/>
  <text class="muted small" x="488" y="228">the order among them is</text>
  <text class="muted small" x="488" y="244">the disputed item: causal</text>
  <text class="muted small" x="488" y="260">(strength) or political</text>

  <path class="rule" d="M 16 296 L 624 296"/>
  <text class="muted small" x="320" y="316" text-anchor="middle">the analogy licenses replacing a thing by forces;</text>
  <text class="muted small" x="320" y="332" text-anchor="middle">it does not say what kind of order the forces stand in</text>
</svg>

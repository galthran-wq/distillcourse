<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tag { fill: currentColor; font-weight: 600; }
    .box { fill: none; stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.3; }
    .box-d { fill: none; stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .box-a { fill: none; stroke: #e2903a; stroke-width: 2; }
    .box-b { fill: none; stroke: #4c8dd6; stroke-width: 1.6; }
    .arrow-a { stroke: #e2903a; stroke-width: 1.8; fill: none; }
    .arrow-b { stroke: #4c8dd6; stroke-width: 1.8; fill: none; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .rule { stroke: currentColor; stroke-opacity: 0.35; stroke-width: 1; }
    .hide { opacity: 0; }
  </style>
  <text class="tag" x="16" y="22">BGE 19, frame 2 of 3</text>

  <rect class="box-a" x="40" y="44" width="220" height="56" rx="6"/>
  <text class="amber" x="150" y="66" text-anchor="middle">the commanding drives</text>
  <text class="muted small" x="150" y="84" text-anchor="middle">"the ruling class"</text>

  <rect class="box-b" x="40" y="200" width="100" height="44" rx="5"/>
  <text class="blue small" x="90" y="219" text-anchor="middle">under-will</text>
  <rect class="box-b" x="150" y="200" width="100" height="44" rx="5"/>
  <text class="blue small" x="200" y="219" text-anchor="middle">under-will</text>
  <rect class="box-b" x="260" y="200" width="100" height="44" rx="5"/>
  <text class="blue small" x="310" y="219" text-anchor="middle">under-will</text>
  <text class="muted small" x="200" y="262" text-anchor="middle">"the successful instruments that carry out the task"</text>

  <rect class="box" x="430" y="180" width="180" height="80" rx="6"/>
  <text class="label" x="520" y="212" text-anchor="middle">the act done,</text>
  <text class="label" x="520" y="230" text-anchor="middle">the resistance overcome</text>

  <!-- frame 1: the command -->
  <g class="">
    <path class="arrow-a" d="M 120 100 L 90 196"/>
    <path class="arrow-a" d="M 86 187 L 90 196 L 97 190"/>
    <path class="arrow-a" d="M 160 100 L 200 196"/>
    <path class="arrow-a" d="M 193 190 L 200 196 L 204 187"/>
    <path class="arrow-a" d="M 200 100 L 306 196"/>
    <path class="arrow-a" d="M 297 194 L 306 196 L 304 187"/>
    <text class="amber small" x="252" y="150">"I am free, 'he' must obey"</text>
    <text class="muted small" x="252" y="164">the affect of command</text>
  </g>

  <!-- frame 2: execution -->
  <g class="">
    <path class="arrow-b" d="M 362 222 L 424 222"/>
    <path class="arrow-b" d="M 416 216 L 424 222 L 416 228"/>
    <text class="blue small" x="393" y="212" text-anchor="middle">obey</text>
    <text class="blue small" x="90" y="238" text-anchor="middle">pleasure</text>
    <text class="blue small" x="200" y="238" text-anchor="middle">pleasure</text>
    <text class="blue small" x="310" y="238" text-anchor="middle">pleasure</text>
    <text class="muted small" x="520" y="276" text-anchor="middle">"the feelings of pleasure from the</text>
    <text class="muted small" x="520" y="290" text-anchor="middle">successful instruments"</text>
  </g>

  <!-- frame 3: the credit -->
  <g class="hide">
    <path class="arrow-a" d="M 520 176 C 520 90 330 60 268 68"/>
    <path class="arrow-a" d="M 276 62 L 268 68 L 277 74"/>
    <text class="amber" x="420" y="112" text-anchor="middle">L'effet c'est moi</text>
    <text class="label small" x="420" y="128" text-anchor="middle">"it was his will alone that truly overcame</text>
    <text class="label small" x="420" y="142" text-anchor="middle">the resistance": the commander adds the</text>
    <text class="label small" x="420" y="156" text-anchor="middle">instruments' pleasure to its own</text>
  </g>

  <path class="rule" d="M 16 304 L 624 304"/>
  <text class="muted small" x="320" y="322" text-anchor="middle">the under-wills execute; the effect follows the command, "therefore obedience, therefore action"</text>
</svg>

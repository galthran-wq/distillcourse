<svg viewBox="0 0 640 316" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tag { fill: currentColor; font-weight: 600; }
    .box { fill: none; stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.3; }
    .wall { stroke: #4c8dd6; stroke-width: 3; fill: none; }
    .d-a { fill: #e2903a; }
    .d-b { fill: #4c8dd6; }
    .arr-a { stroke: #e2903a; stroke-width: 2; fill: none; }
    .arr-d { stroke: #e2903a; stroke-width: 1.4; fill: none; stroke-dasharray: 4 3; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .rule { stroke: currentColor; stroke-opacity: 0.35; stroke-width: 1; }
  </style>
  <text class="tag" x="16" y="22">three configurations of one society: what the Genealogy's mechanisms are made of</text>

  <!-- panel 1: ressentiment -->
  <rect class="box" x="16" y="36" width="196" height="210" rx="8"/>
  <text class="amber small" x="24" y="54">ressentiment, GM I:10</text>
  <circle cx="90" cy="130" r="24" class="d-a"/>
  <text class="small" x="90" y="134" text-anchor="middle" style="fill:#fff">revenge</text>
  <path class="arr-d" d="M 110 130 L 168 130"/>
  <path class="wall" d="M 172 100 L 172 160"/>
  <text class="blue small" x="166" y="92" text-anchor="end">impotence</text>
  <path class="arr-a" d="M 90 150 C 90 190 120 200 150 196"/>
  <path class="arr-a" d="M 142 191 L 150 196 L 143 202"/>
  <text class="label small" x="24" y="210">the deed blocked; the drive</text>
  <text class="label small" x="24" y="223">commands by a No, a judgment:</text>
  <text class="label small" x="24" y="236">"you are evil"</text>

  <!-- panel 2: bad conscience -->
  <rect class="box" x="222" y="36" width="196" height="210" rx="8"/>
  <text class="amber small" x="230" y="54">bad conscience, GM II:16</text>
  <rect class="wall" x="250" y="76" width="140" height="110" rx="4"/>
  <text class="blue small" x="320" y="70" text-anchor="middle">walls of society and peace</text>
  <circle cx="300" cy="130" r="18" class="d-a"/>
  <text class="small" x="300" y="134" text-anchor="middle" style="fill:#fff">cruelty</text>
  <path class="arr-a" d="M 318 124 L 380 110 C 392 108 392 140 380 150 L 340 160"/>
  <path class="arr-a" d="M 348 155 L 340 160 L 347 166"/>
  <circle cx="330" cy="164" r="8" class="d-b"/>
  <text class="label small" x="230" y="210">no outward discharge; cruelty</text>
  <text class="label small" x="230" y="223">turns on the other drives:</text>
  <text class="label small" x="230" y="236">"the soul" is born</text>

  <!-- panel 3: the priest -->
  <rect class="box" x="428" y="36" width="196" height="210" rx="8"/>
  <text class="amber small" x="436" y="54">the priest's redirection, III:15</text>
  <circle cx="480" cy="130" r="25" class="d-a"/>
  <text class="small" x="480" y="128" text-anchor="middle" style="fill:#fff">someone</text>
  <text class="small" x="480" y="138" text-anchor="middle" style="fill:#fff">to blame</text>
  <path class="arr-d" d="M 500 122 L 560 96"/>
  <circle cx="575" cy="92" r="9" class="d-b"/>
  <text class="muted small" x="575" y="76" text-anchor="middle">the healthy</text>
  <rect class="box" x="548" y="118" width="60" height="26" rx="4"/>
  <text class="label small" x="578" y="135" text-anchor="middle">the priest</text>
  <path class="arr-a" d="M 500 134 L 548 132 C 556 150 540 176 500 176 L 486 154"/>
  <path class="arr-a" d="M 486 163 L 486 154 L 494 158"/>
  <text class="label small" x="436" y="210">the affect intercepted and</text>
  <text class="label small" x="436" y="223">aimed back: "you yourself</text>
  <text class="label small" x="436" y="236">alone are to blame"</text>

  <path class="rule" d="M 16 256 L 624 256"/>
  <text class="muted small" x="320" y="274" text-anchor="middle">each treatise's mechanism is a drive, a blocked outlet and a new command:</text>
  <text class="muted small" x="320" y="290" text-anchor="middle">the genealogy's causal claims now have units; what the units do not supply is the principle</text>
  <text class="muted small" x="320" y="306" text-anchor="middle">by which one drive comes to rule, BGE 23's "will to power"</text>
</svg>

<svg viewBox="0 0 640 416" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tag { fill: currentColor; font-weight: 600; }
    .box { fill: none; stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.3; }
    .box-d { fill: none; stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .box-a { fill: none; stroke: #e2903a; stroke-width: 2; }
    .box-b { fill: none; stroke: #4c8dd6; stroke-width: 1.6; }
    .d-big { fill: #e2903a; }
    .d-small { fill: #4c8dd6; }
    .arr-thick { stroke: currentColor; stroke-opacity: 0.7; stroke-width: 3; fill: none; }
    .arr-thin { stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1; fill: none; }
    .arr-a { stroke: #e2903a; stroke-width: 1.6; fill: none; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .rule { stroke: currentColor; stroke-opacity: 0.35; stroke-width: 1; }
  </style>
  <text class="tag" x="16" y="22">the same society of drives, read two ways</text>

  <!-- left panel: physics -->
  <rect class="box-b" x="16" y="36" width="298" height="200" rx="8"/>
  <text class="blue" x="28" y="56">only a physics (Leiter)</text>
  <text class="muted small" x="28" y="72">rank = causal strength; the strongest wins conflicts</text>
  <circle cx="90" cy="130" r="24" class="d-big"/>
  <text class="small" x="90" y="134" text-anchor="middle" style="fill:#fff">A</text>
  <circle cx="190" cy="120" r="14" class="d-small"/>
  <text class="small" x="190" y="124" text-anchor="middle" style="fill:#fff">B</text>
  <circle cx="250" cy="170" r="10" class="d-small"/>
  <text class="small" x="250" y="174" text-anchor="middle" style="fill:#fff">C</text>
  <circle cx="160" cy="190" r="8" class="d-small"/>
  <path class="arr-thick" d="M 114 128 L 174 122"/>
  <path class="arr-thin" d="M 204 126 L 240 164"/>
  <path class="arr-thin" d="M 104 150 L 152 184"/>
  <text class="label small" x="28" y="214">arrow width = force; consciousness only reports</text>
  <text class="label small" x="28" y="228">"I will" is the strongest drive's affect, after the fact</text>

  <!-- right panel: government -->
  <rect class="box-a" x="326" y="36" width="298" height="200" rx="8"/>
  <text class="amber" x="338" y="56">a government (Clark &amp; Dudrick)</text>
  <text class="muted small" x="338" y="72">rank = recognized authority, not strength</text>
  <circle cx="400" cy="130" r="18" class="d-big"/>
  <text class="small" x="400" y="134" text-anchor="middle" style="fill:#fff">A</text>
  <path class="arr-a" d="M 386 104 L 392 96 L 400 104 L 408 96 L 414 104 Z"/>
  <circle cx="500" cy="120" r="22" class="d-small"/>
  <text class="small" x="500" y="124" text-anchor="middle" style="fill:#fff">B</text>
  <circle cx="560" cy="170" r="10" class="d-small"/>
  <text class="small" x="560" y="174" text-anchor="middle" style="fill:#fff">C</text>
  <circle cx="470" cy="190" r="8" class="d-small"/>
  <path class="arr-a" d="M 420 128 L 476 122"/>
  <path class="arr-a" d="M 468 117 L 476 122 L 469 128"/>
  <text class="amber small" x="446" y="112" text-anchor="middle">commands</text>
  <text class="label small" x="338" y="214">A is smaller than B (temptation) and rules by "the</text>
  <text class="label small" x="338" y="228">right to speak for the whole": a space of reasons</text>

  <!-- rebuttal strip -->
  <rect class="box-d" x="326" y="250" width="298" height="96" rx="6"/>
  <text class="tag small" x="338" y="268">the same evidence, two verdicts: de Waal's apes</text>
  <text class="label small" x="338" y="286">C&amp;D: rank, not strength, explains behaviour, and the</text>
  <text class="label small" x="338" y="300">animals need not know it: politics without homunculi</text>
  <text class="label small" x="338" y="318">Riccardi: a dominance hierarchy is a causal order too; it</text>
  <text class="label small" x="338" y="332">"seems to suggest" there is no space of reasons</text>

  <rect class="box" x="16" y="250" width="298" height="96" rx="6"/>
  <text class="tag small" x="28" y="268">the one premise in dispute</text>
  <text class="label small" x="28" y="286">Is "recognized as having authority" a causal fact</text>
  <text class="label small" x="28" y="300">about the other drives (then the right panel collapses</text>
  <text class="label small" x="28" y="314">into the left), or a normative fact that a causal</text>
  <text class="label small" x="28" y="328">description leaves out (then the left is incomplete)?</text>

  <path class="rule" d="M 16 366 L 624 366"/>
  <text class="muted small" x="320" y="386" text-anchor="middle">BGE 19 supplies the political words and the causal words;</text>
  <text class="muted small" x="320" y="402" text-anchor="middle">it does not say whether the first column reduces to the second</text>
</svg>

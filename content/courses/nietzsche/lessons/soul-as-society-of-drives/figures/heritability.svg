<svg viewBox="0 0 640 356" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tag { fill: currentColor; font-weight: 600; }
    .bar-a { fill: #e2903a; }
    .bar-a2 { fill: #e2903a; opacity: 0.4; }
    .bar-b { fill: #4c8dd6; }
    .axis { stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1; }
    .grid { stroke: currentColor; stroke-opacity: 0.15; stroke-width: 1; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .rule { stroke: currentColor; stroke-opacity: 0.35; stroke-width: 1; }
  </style>
  <text class="tag" x="16" y="22">share of the variance in a trait or behaviour explained (Knobe &amp; Leiter 2007, pp. 92–102)</text>

  <!-- axis: x from 230 to 610 = 0..80% -->
  <path class="axis" d="M 230 44 L 230 262"/>
  <path class="grid" d="M 325 44 L 325 262"/>
  <path class="grid" d="M 420 44 L 420 262"/>
  <path class="grid" d="M 515 44 L 515 262"/>
  <path class="grid" d="M 610 44 L 610 262"/>
  <text class="muted small" x="230" y="278" text-anchor="middle">0</text>
  <text class="muted small" x="325" y="278" text-anchor="middle">20%</text>
  <text class="muted small" x="420" y="278" text-anchor="middle">40%</text>
  <text class="muted small" x="515" y="278" text-anchor="middle">60%</text>
  <text class="muted small" x="610" y="278" text-anchor="middle">80%</text>

  <text class="amber small" x="16" y="52">heredity</text>
  <text class="label small" x="16" y="72">extraversion (24,000 twins)</text>
  <rect class="bar-a" x="230" y="60" width="285" height="14"/>
  <text class="label small" x="520" y="72">60</text>
  <text class="label small" x="16" y="96">neuroticism</text>
  <rect class="bar-a" x="230" y="84" width="237.5" height="14"/>
  <text class="label small" x="472" y="96">50</text>
  <text class="label small" x="16" y="120">childhood aggression</text>
  <rect class="bar-a" x="230" y="108" width="232.75" height="14"/>
  <rect class="bar-a2" x="462.75" y="108" width="99.75" height="14"/>
  <text class="label small" x="566" y="120">49–70</text>

  <text class="blue small" x="16" y="150">what the same studies leave to upbringing</text>
  <text class="label small" x="16" y="170">shared environment, most traits</text>
  <rect class="bar-b" x="230" y="158" width="23.75" height="14"/>
  <rect class="bar-b" x="253.75" y="158" width="23.75" height="14" opacity="0.4"/>
  <text class="label small" x="282" y="170">5–10</text>

  <text class="blue small" x="16" y="200">the effects social psychology celebrates</text>
  <text class="label small" x="16" y="220">Festinger, Darley–Batson, Milgram</text>
  <rect class="bar-b" x="230" y="208" width="64" height="14"/>
  <text class="label small" x="298" y="220">13–14</text>
  <text class="label small" x="16" y="244">attitude → behaviour (88 studies)</text>
  <rect class="bar-b" x="230" y="232" width="66.5" height="14"/>
  <text class="label small" x="300" y="244">14</text>

  <path class="rule" d="M 16 292 L 624 292"/>
  <text class="muted small" x="320" y="308" text-anchor="middle">the comparison that carries the argument: heredity's share is three to five times the effects that made careers</text>
  <text class="muted small" x="320" y="324" text-anchor="middle">"heritable" means that differences between people's scores are partly explained by genetic differences,</text>
  <text class="muted small" x="320" y="340" text-anchor="middle">not that a trait is "produced entirely by genes"</text>
</svg>

<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tag { fill: currentColor; font-weight: 600; }
    .box { fill: none; stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.3; }
    .box-d { fill: none; stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .box-a { fill: none; stroke: #e2903a; stroke-width: 2; }
    .box-b { fill: none; stroke: #4c8dd6; stroke-width: 1.6; }
    .line { stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.4; fill: none; }
    .tick { fill: currentColor; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .strike { stroke: currentColor; stroke-opacity: 0.7; stroke-width: 1.4; }
    .rule { stroke: currentColor; stroke-opacity: 0.35; stroke-width: 1; }
  </style>
  <text class="tag" x="16" y="22">one claim, narrowed twice: the naturalist reading correcting itself</text>

  <path class="line" d="M 40 150 L 600 150"/>
  <circle cx="70" cy="150" r="4" class="tick"/>
  <circle cx="230" cy="150" r="4" class="tick"/>
  <circle cx="380" cy="150" r="4" class="tick"/>
  <circle cx="560" cy="150" r="4" class="tick"/>

  <rect class="box-d" x="24" y="52" width="150" height="72" rx="6"/>
  <text class="label small" x="32" y="70">2002, Nietzsche on Morality</text>
  <text class="label small" x="32" y="86">"consciousness is</text>
  <text class="label small" x="32" y="100">epiphenomenal"</text>
  <text class="muted small" x="32" y="116">consciousness simpliciter</text>
  <path class="strike" d="M 28 56 L 170 120"/>
  <text class="muted small" x="70" y="172" text-anchor="middle">2002</text>

  <rect class="box-b" x="160" y="180" width="140" height="70" rx="6"/>
  <text class="blue small" x="168" y="198">2005, Katsafanas</text>
  <text class="label small" x="168" y="214">conscious states are not</text>
  <text class="label small" x="168" y="228">all inert; the text does</text>
  <text class="label small" x="168" y="242">not say they are</text>
  <text class="muted small" x="230" y="172" text-anchor="middle">2005</text>

  <rect class="box-a" x="300" y="52" width="180" height="88" rx="6"/>
  <text class="amber small" x="308" y="70">2007–08, Leiter</text>
  <text class="label small" x="308" y="86">"the most serious mistake"</text>
  <text class="label small" x="308" y="100">in the 2002 book; kept: "some</text>
  <text class="label small" x="308" y="114">aspects, e.g. our conscious</text>
  <text class="label small" x="308" y="128">experience of will"</text>
  <text class="muted small" x="380" y="172" text-anchor="middle">2007–08</text>

  <rect class="box" x="470" y="180" width="160" height="98" rx="6"/>
  <text class="label small" x="478" y="198">2014, Riccardi; 2015,</text>
  <text class="label small" x="478" y="212">2nd ed. Postscript; 2016:</text>
  <text class="label small" x="478" y="226">"what we experience as the</text>
  <text class="label small" x="478" y="240">will and willing is epiphen-</text>
  <text class="label small" x="478" y="254">omenal, not that the will</text>
  <text class="label small" x="478" y="268">does not exist"</text>
  <text class="muted small" x="560" y="172" text-anchor="middle">2014–16</text>

  <text class="muted small" x="320" y="298" text-anchor="middle">the primary text the narrowed claim can cite is GS 354, consciousness as a "connecting network between man and man";</text>
  <text class="muted small" x="320" y="314" text-anchor="middle">the 2002 claim had no such text</text>
</svg>

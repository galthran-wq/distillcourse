<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tag { fill: currentColor; font-weight: 600; }
    .box { fill: none; stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.3; }
    .box-d { fill: none; stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .box-a { fill: none; stroke: #e2903a; stroke-width: 2; }
    .dot-a { fill: #e2903a; }
    .dot-b { fill: #4c8dd6; }
    .strike { stroke: currentColor; stroke-opacity: 0.7; stroke-width: 1.6; }
    .arrow { stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.4; fill: none; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .rule { stroke: currentColor; stroke-opacity: 0.35; stroke-width: 1; }
  </style>

  <text class="tag" x="16" y="22">expelled from science (BGE 12)</text>
  <circle cx="110" cy="130" r="58" class="box-d"/>
  <text class="label" x="110" y="126" text-anchor="middle">the soul-atom</text>
  <text class="muted small" x="110" y="142" text-anchor="middle">a monad, an atomon</text>
  <path class="strike" d="M 60 82 L 160 178"/>
  <text class="label small" x="16" y="216">indestructible, eternal, indivisible:</text>
  <text class="label small" x="16" y="232">one thing that does the thinking and</text>
  <text class="label small" x="16" y="248">the willing, "behind" both</text>
  <text class="muted small" x="16" y="272">the doer of I:13 at the level of metaphysics</text>

  <path class="arrow" d="M 190 130 L 240 130"/>
  <path class="arrow" d="M 232 124 L 240 130 L 232 136"/>
  <text class="muted small" x="215" y="118" text-anchor="middle">kept as</text>

  <text class="tag" x="262" y="22">kept, as a hypothesis with "civil rights in science"</text>
  <rect class="box-a" x="262" y="40" width="362" height="196" rx="8"/>
  <text class="amber small" x="272" y="58">"a society constructed out of drives and affects"</text>

  <circle cx="330" cy="105" r="26" class="dot-a"/>
  <text class="label small" x="330" y="102" text-anchor="middle" fill="#fff" style="fill:#fff">drive to</text>
  <text class="label small" x="330" y="114" text-anchor="middle" style="fill:#fff">rule</text>
  <text class="amber small" x="366" y="100">commands: "the ruling class"</text>

  <circle cx="420" cy="170" r="18" class="dot-b"/>
  <text class="small" x="420" y="174" text-anchor="middle" style="fill:#fff">fear</text>
  <circle cx="480" cy="150" r="20" class="dot-b"/>
  <text class="small" x="480" y="154" text-anchor="middle" style="fill:#fff">pity</text>
  <circle cx="545" cy="180" r="20" class="dot-b"/>
  <text class="small" x="545" y="184" text-anchor="middle" style="fill:#fff">hunger</text>
  <circle cx="335" cy="185" r="22" class="dot-b"/>
  <text class="small" x="335" y="182" text-anchor="middle" style="fill:#fff">drive to</text>
  <text class="small" x="335" y="194" text-anchor="middle" style="fill:#fff">know</text>
  <circle cx="585" cy="110" r="16" class="dot-b"/>
  <text class="small" x="585" y="114" text-anchor="middle" style="fill:#fff">envy</text>
  <text class="blue small" x="366" y="218">the "under-wills": obey, or do not</text>

  <text class="label small" x="262" y="256">mortal: it can fall apart · a subject-multiplicity: many, not one</text>
  <text class="label small" x="262" y="272">ranked: size and position mark rank · the open question is what rank is</text>
  <path class="rule" d="M 16 292 L 624 292"/>
  <text class="muted small" x="320" y="310" text-anchor="middle">what BGE 12 removes is the unity behind the parts; what it keeps is the structure among them</text>
</svg>

<svg viewBox="0 0 640 346" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tag { fill: currentColor; font-weight: 600; }
    .stem { stroke: #e2903a; stroke-width: 2; fill: none; }
    .stem-w { stroke: #e2903a; stroke-width: 1.4; fill: none; opacity: 0.55; }
    .fruit { fill: #e2903a; }
    .ceiling { stroke: currentColor; stroke-width: 1.4; stroke-dasharray: 5 3; fill: none; }
    .seed { fill: currentColor; }
    .box-d { fill: none; stroke: #4c8dd6; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .rule { stroke: currentColor; stroke-opacity: 0.35; stroke-width: 1; }
  </style>
  <text class="tag" x="16" y="22">the Doctrine of Types: a range, a ceiling, no unique outcome</text>

  <path class="ceiling" d="M 40 70 L 600 70"/>
  <text class="label small" x="44" y="62">the ceiling: "no amount of environmental input will yield an apple tree from those seeds"</text>

  <!-- ground -->
  <path class="rule" d="M 40 270 L 600 270"/>
  <ellipse cx="320" cy="270" rx="7" ry="4" class="seed"/>
  <text class="muted small" x="320" y="290" text-anchor="middle">one seed: the type-facts, "a fixed psycho-physical constitution"</text>

  <!-- wilting plant -->
  <path class="stem-w" d="M 320 268 C 250 240 190 230 160 215 C 150 210 148 222 150 232"/>
  <text class="muted small" x="120" y="204" text-anchor="middle">wilting</text>
  <!-- middling -->
  <path class="stem-w" d="M 320 268 C 300 220 262 190 250 150"/>
  <circle cx="252" cy="152" r="4" class="fruit" opacity="0.6"/>
  <text class="muted small" x="268" y="156">middling</text>
  <!-- flourishing -->
  <path class="stem" d="M 320 268 C 340 220 372 160 400 100"/>
  <path class="stem" d="M 372 160 C 390 150 400 152 410 158"/>
  <circle cx="404" cy="98" r="5" class="fruit"/>
  <circle cx="410" cy="158" r="5" class="fruit"/>
  <circle cx="386" cy="130" r="4" class="fruit"/>
  <text class="amber small" x="440" y="96">flourishing</text>
  <!-- another middling to right -->
  <path class="stem-w" d="M 320 268 C 400 250 470 230 500 190"/>
  <circle cx="500" cy="190" r="4" class="fruit" opacity="0.6"/>
  <text class="muted small" x="530" y="188">stunted, many fruit</text>

  <rect class="box-d" x="40" y="86" width="230" height="44" rx="6"/>
  <text class="blue small" x="52" y="104">the environment: water, sun, pests,</text>
  <text class="blue small" x="52" y="120">"especially the moral environment"</text>
  <text class="muted small" x="52" y="150">selects which trajectory is realized</text>

  <path class="rule" d="M 16 300 L 624 300"/>
  <text class="muted small" x="320" y="318" text-anchor="middle">causal essentialism: the type fixes the range and the ceiling, the environment selects within them;</text>
  <text class="muted small" x="320" y="334" text-anchor="middle">classical fatalism (one outcome whatever you do) is not the doctrine</text>
</svg>

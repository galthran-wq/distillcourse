<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
<style>.label{fill:currentColor}.muted{fill:currentColor;opacity:.55;font-size:12px}.amber{fill:#e2903a}.blue{fill:#4c8dd6}</style>
<defs><marker id="ch-a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker><marker id="ch-am" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e2903a"/></marker></defs>
<text class="muted" x="16" y="24" font-weight="600">in the laboratory</text>
<rect x="40" y="48" width="96" height="44" rx="3" fill="currentColor" fill-opacity="0.25"/>
<circle cx="58" cy="60" r="3" fill="currentColor" fill-opacity="0.7"/><circle cx="104" cy="80" r="3" fill="currentColor" fill-opacity="0.7"/><circle cx="122" cy="58" r="2.5" fill="currentColor" fill-opacity="0.7"/>
<text class="label" x="88" y="112" text-anchor="middle" font-size="12">a solid, with impurities</text>
<line x1="150" y1="70" x2="232" y2="70" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.4" marker-end="url(#ch-a)"/>
<text class="muted" x="191" y="62" text-anchor="middle" font-size="11.5">heat</text>
<g fill="currentColor" fill-opacity="0.45"><circle cx="262" cy="56" r="2.5"/><circle cx="282" cy="74" r="2.5"/><circle cx="300" cy="50" r="2.5"/><circle cx="318" cy="80" r="2.5"/><circle cx="336" cy="60" r="2.5"/><circle cx="270" cy="88" r="2.5"/><circle cx="350" cy="84" r="2.5"/><circle cx="310" cy="66" r="2.5"/></g>
<text class="label" x="306" y="112" text-anchor="middle" font-size="12">vapour</text>
<line x1="372" y1="70" x2="454" y2="70" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.4" marker-end="url(#ch-a)"/>
<text class="muted" x="413" y="62" text-anchor="middle" font-size="11.5">cool</text>
<g fill="currentColor" fill-opacity="0.3" stroke="currentColor" stroke-opacity="0.6"><path d="M478 84 l10 -22 l10 22 z"/><path d="M504 84 l8 -30 l8 30 z"/><path d="M528 84 l10 -18 l10 18 z"/><path d="M554 84 l7 -26 l7 26 z"/></g>
<text class="label" x="524" y="104" text-anchor="middle" font-size="12">the same substance,</text>
<text class="label" x="524" y="119" text-anchor="middle" font-size="12">purer, elsewhere</text>
<line x1="14" y1="138" x2="626" y2="138" stroke="currentColor" stroke-opacity="0.15"/>
<text class="amber" x="16" y="162" font-weight="600">in a drive</text>
<rect x="24" y="178" width="140" height="52" rx="5" fill="#e2903a" fill-opacity="0.12" stroke="#e2903a" stroke-width="1.4"/>
<text class="amber" x="94" y="200" text-anchor="middle" font-weight="600">sensuality</text>
<text class="label" x="94" y="218" text-anchor="middle" font-size="12">a body, now</text>
<line x1="168" y1="204" x2="232" y2="204" stroke="#e2903a" stroke-width="1.6" marker-end="url(#ch-am)"/>
<text class="muted" x="200" y="248" text-anchor="middle" font-size="11">long constraint</text>
<text class="muted" x="200" y="262" text-anchor="middle" font-size="11">(BGE 189’s fast)</text>
<rect x="236" y="178" width="160" height="52" rx="5" fill="none" stroke="#e2903a" stroke-width="1.4" stroke-dasharray="4 3"/>
<text class="label" x="316" y="200" text-anchor="middle" font-size="12">the drive held back,</text>
<text class="label" x="316" y="218" text-anchor="middle" font-size="12">not destroyed</text>
<line x1="400" y1="204" x2="464" y2="204" stroke="#e2903a" stroke-width="1.6" marker-end="url(#ch-am)"/>
<text class="muted" x="432" y="248" text-anchor="middle" font-size="11">a new object</text>
<rect x="468" y="178" width="150" height="52" rx="5" fill="#e2903a" fill-opacity="0.12" stroke="#e2903a" stroke-width="1.4"/>
<text class="amber" x="543" y="200" text-anchor="middle" font-weight="600">love</text>
<text class="label" x="543" y="218" text-anchor="middle" font-size="12">a person, over years</text>
<text class="muted" x="320" y="290" text-anchor="middle">HH 1 (1878): “sublimations in which the fundamental element appears almost evaporated”</text>
</svg>

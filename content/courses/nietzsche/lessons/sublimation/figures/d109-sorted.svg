<svg viewBox="0 0 640 404" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
<style>.label{fill:currentColor}.muted{fill:currentColor;opacity:.55;font-size:12px}.amber{fill:#e2903a}.blue{fill:#4c8dd6}</style>
<text class="muted" x="20" y="26" font-weight="600">D 109’s method</text>
<text class="muted" x="210" y="26" font-weight="600">what it does to the drive</text>
<text class="muted" x="458" y="26" font-weight="600">treatment</text>
<line x1="14" y1="36" x2="626" y2="36" stroke="currentColor" stroke-opacity="0.35"/>
<text class="label" x="22" y="67" font-weight="700">1</text>
<text class="label" x="40" y="67" font-size="12.5">avoid every occasion</text>
<text class="label" x="210" y="67" font-size="12">the drive withers unfed</text>
<text class="label" x="458" y="67" font-size="12">extirpation</text>
<line x1="14" y1="84" x2="626" y2="84" stroke="currentColor" stroke-opacity="0.12"/>
<text class="label" x="22" y="111" font-weight="700">2</text>
<text class="label" x="40" y="111" font-size="12.5">ration it by fixed times</text>
<text class="label" x="210" y="111" font-size="12">let out only at set times</text>
<text class="label" x="458" y="111" font-size="12">discharge, held to a measure</text>
<line x1="14" y1="128" x2="626" y2="128" stroke="currentColor" stroke-opacity="0.12"/>
<text class="label" x="22" y="155" font-weight="700">3</text>
<text class="label" x="40" y="155" font-size="12.5">indulge it to disgust</text>
<text class="label" x="210" y="155" font-size="12">spent until it turns to revulsion</text>
<text class="label" x="458" y="155" font-size="12">discharge, then aversion</text>
<line x1="14" y1="172" x2="626" y2="172" stroke="currentColor" stroke-opacity="0.12"/>
<text class="label" x="22" y="199" font-weight="700">4</text>
<text class="label" x="40" y="199" font-size="12.5">tie it to a painful thought</text>
<text class="label" x="210" y="199" font-size="12">gratification itself made painful</text>
<text class="label" x="458" y="199" font-size="12">extirpation by aversion</text>
<line x1="14" y1="216" x2="626" y2="216" stroke="currentColor" stroke-opacity="0.12"/>
<rect x="14" y="218" width="612" height="40" rx="4" fill="#e2903a" fill-opacity="0.12" stroke="#e2903a" stroke-width="1.2"/>
<text class="label" x="22" y="243" font-weight="700">5</text>
<text class="label" x="40" y="243" font-size="12.5">divert strength away</text>
<text class="label" x="210" y="243" font-size="12">strength moved away; it starves</text>
<text class="amber" x="458" y="236" font-size="12" font-weight="600">nearest to sublimation</text>
<text class="muted" x="458" y="251" font-size="10.5">the strength feeds a rival</text>
<line x1="14" y1="260" x2="626" y2="260" stroke="currentColor" stroke-opacity="0.12"/>
<text class="label" x="22" y="287" font-weight="700">6</text>
<text class="label" x="40" y="287" font-size="12.5">weaken the whole body</text>
<text class="label" x="210" y="287" font-size="12">starved with everything else</text>
<text class="label" x="458" y="287" font-size="12">extirpation: the ascetic</text>
<line x1="14" y1="304" x2="626" y2="304" stroke="currentColor" stroke-opacity="0.12"/>
<rect x="14" y="314" width="612" height="44" rx="4" fill="none" stroke="#e2903a" stroke-width="1.4" stroke-dasharray="5 4"/>
<text class="amber" x="320" y="341" text-anchor="middle" font-weight="600">keep the drive at full strength and give it a new object: not on the list</text>
<text class="muted" x="320" y="390" text-anchor="middle">“methods of combating the vehemence of a drive” (D 109, 1881)</text>
</svg>

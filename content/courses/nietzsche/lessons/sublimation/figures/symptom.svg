<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
<style>.label{fill:currentColor}.muted{fill:currentColor;opacity:.55;font-size:12px}.amber{fill:#e2903a}.blue{fill:#4c8dd6}</style>
<defs><marker id="sy-am" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e2903a"/></marker><marker id="sy-bl" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4c8dd6"/></marker></defs>
<rect x="14" y="14" width="456" height="250" rx="14" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.4"/>
<text class="label" x="242" y="40" text-anchor="middle" font-weight="700">life</text>
<text class="muted" x="242" y="58" text-anchor="middle">every valuation is made from inside it</text>
<rect x="30" y="80" width="200" height="66" rx="5" fill="#e2903a" fill-opacity="0.12" stroke="#e2903a" stroke-width="1.4"/>
<text class="amber" x="130" y="102" text-anchor="middle" font-weight="600" font-size="12.5">a healthy morality</text>
<text class="label" x="130" y="120" text-anchor="middle" font-size="12">“shalt” / “shalt not”</text>
<text class="label" x="130" y="136" text-anchor="middle" font-size="12">in the service of a drive</text>
<line x1="130" y1="150" x2="130" y2="196" stroke="#e2903a" stroke-width="1.6" marker-end="url(#sy-am)"/>
<text class="label" x="130" y="216" text-anchor="middle" font-size="12">removes an obstacle</text>
<text class="label" x="130" y="232" text-anchor="middle" font-size="12">on the path of life</text>
<rect x="254" y="80" width="200" height="66" rx="5" fill="#4c8dd6" fill-opacity="0.12" stroke="#4c8dd6" stroke-width="1.4"/>
<text class="blue" x="354" y="102" text-anchor="middle" font-weight="600" font-size="12.5">an anti-natural morality</text>
<text class="label" x="354" y="120" text-anchor="middle" font-size="12">the instincts condemned:</text>
<text class="label" x="354" y="136" text-anchor="middle" font-size="12">“God looks at the heart”</text>
<path d="M354 150 C 354 200, 420 200, 420 156" fill="none" stroke="#4c8dd6" stroke-width="1.6" marker-end="url(#sy-bl)"/>
<text class="label" x="354" y="216" text-anchor="middle" font-size="12">testifies about its speaker:</text>
<text class="label" x="354" y="232" text-anchor="middle" font-size="12">declining, weary life</text>
<rect x="490" y="80" width="136" height="110" rx="6" fill="none" stroke="currentColor" stroke-opacity="0.45" stroke-dasharray="5 4"/>
<text class="muted" x="558" y="110" text-anchor="middle" font-size="11.5">a standpoint</text>
<text class="muted" x="558" y="126" text-anchor="middle" font-size="11.5">outside life,</text>
<text class="muted" x="558" y="142" text-anchor="middle" font-size="11.5">from which life</text>
<text class="muted" x="558" y="158" text-anchor="middle" font-size="11.5">could be judged</text>
<text class="label" x="558" y="212" text-anchor="middle" font-size="12" font-weight="600">not available</text>
<text class="muted" x="320" y="294" text-anchor="middle">TI, Anti-Nature 5: “a condemnation of life by the living remains in the end</text>
<text class="muted" x="320" y="312" text-anchor="middle">a mere symptom of a certain kind of life”</text>
</svg>

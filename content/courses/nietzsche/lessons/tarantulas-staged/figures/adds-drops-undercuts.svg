<svg viewBox="0 0 640 270" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tag { font-weight: 600; }
    .amber { fill: #e2903a; fill-opacity: 0.12; stroke: #e2903a; stroke-width: 1.8; }
    .dashed { fill: none; stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.4; stroke-dasharray: 5 3; }
    .blue { fill: #4c8dd6; fill-opacity: 0.12; stroke: #4c8dd6; stroke-width: 1.4; }
  </style>

  <text class="tag" x="12" y="20">the residue of "On the Tarantulas"</text>

  <rect class="amber" x="12" y="36" width="196" height="176" rx="6"/>
  <text class="tag" x="24" y="56" fill="#e2903a">adds</text>
  <text class="label small" x="24" y="76">the bite: revenge recognised</text>
  <text class="label small" x="24" y="90">by what it does to the one</text>
  <text class="label small" x="24" y="104">who touches it</text>
  <text class="label small" x="24" y="124">the pillar and the dance:</text>
  <text class="label small" x="24" y="138">affirmation's counter-figure</text>
  <text class="label small" x="24" y="158">"redeemed from revenge":</text>
  <text class="label small" x="24" y="172">a hope GM I never offers</text>
  <text class="muted small" x="24" y="190">stated in BGE 30 and I:10,</text>
  <text class="muted small" x="24" y="204">never enacted there</text>

  <rect class="dashed" x="222" y="36" width="196" height="176" rx="6"/>
  <text class="tag" x="234" y="56">drops</text>
  <text class="label small" x="234" y="76">the priestly caste (I:6–7)</text>
  <text class="label small" x="234" y="90">the dating: "two millennia"</text>
  <text class="label small" x="234" y="104">the inversion equation (I:7)</text>
  <text class="label small" x="234" y="118">the etymologies (I:4–5)</text>
  <text class="label small" x="234" y="132">the document: Tertullian (I:15)</text>
  <text class="label small" x="234" y="146">any named target (BGE 202)</text>
  <text class="muted small" x="234" y="170">the diagnosis without</text>
  <text class="muted small" x="234" y="184">the history that argues it</text>

  <rect class="blue" x="432" y="36" width="196" height="176" rx="6"/>
  <text class="tag" x="444" y="56" fill="#4c8dd6">undercuts</text>
  <text class="label small" x="444" y="76">Zarathustra bitten:</text>
  <text class="label small" x="444" y="90">the speaker inside the diagnosis</text>
  <text class="label small" x="444" y="110">"Zarathustra too is a poet"</text>
  <text class="label small" x="444" y="124">(Z II 17)</text>
  <text class="label small" x="444" y="144">"lose me and find yourselves"</text>
  <text class="label small" x="444" y="158">(Z I 22 §3)</text>
  <text class="muted small" x="444" y="182">no argued text does this</text>

  <text class="muted small" x="12" y="240">the argued passage is the premise; the speech is cited for the first column,</text>
  <text class="muted small" x="12" y="256">with the third column stated beside it</text>
</svg>

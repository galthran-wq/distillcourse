  <circle class="line" cx="470" cy="96" r="12"/>
  <path class="line" d="M 470 108 L 470 170 M 470 122 L 440 150 M 470 122 L 500 150 M 470 170 L 452 215 M 470 170 L 488 215"/>
  <text class="muted small" x="405" y="240">Zarathustra, diagnosing</text>

<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tag { font-weight: 600; }
    .line { stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.4; fill: none; }
    .web { stroke: currentColor; stroke-opacity: 0.35; stroke-width: 1; fill: none; }
    .hole { fill: currentColor; fill-opacity: 0.35; stroke: none; }
    .bubble { fill: none; stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.4; }
    .pillar { fill: currentColor; fill-opacity: 0.12; stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.4; }
    .blue { fill: #4c8dd6; fill-opacity: 0.12; stroke: #4c8dd6; stroke-width: 1.6; }
    .bluetext { fill: #4c8dd6; font-weight: 600; }
    .bluearrow { stroke: #4c8dd6; stroke-width: 1.6; fill: none; }
  </style>

  <text class="tag" x="12" y="20">2. the hidden affect named</text>

  <ellipse class="hole" cx="110" cy="200" rx="44" ry="14"/>
  <text class="muted small" x="76" y="232">the tarantula's hole</text>
  <path class="web" d="M 110 200 L 40 120 M 110 200 L 90 96 M 110 200 L 150 100 M 110 200 L 190 130"/>
  <path class="web" d="M 62 145 Q 100 140 128 130 Q 160 118 176 149"/>
  <path class="web" d="M 51 133 Q 95 118 118 112 Q 150 106 183 140"/>
  <path class="web" d="M 74 159 Q 105 158 138 146 Q 158 136 170 158"/>

  <rect class="bubble" x="150" y="40" width="264" height="52" rx="8"/>
  <path class="bubble" d="M 180 92 L 170 106 L 196 92"/>
  <text class="label small" x="162" y="58">"'will to equality' shall be the name for virtue;</text>
  <text class="label small" x="162" y="74">against everything that has power we shall</text>
  <text class="label small" x="162" y="88">raise our clamor"</text>
  <text class="muted small" x="210" y="118">the preachers' creed</text>

  <rect class="blue" x="24" y="150" width="176" height="36" rx="5"/>
  <text class="bluetext small" x="34" y="165">revenge (Rache) sits in your soul</text>
  <text class="label small" x="34" y="179">GM I:10: ressentiment, the No</text>
  <path class="bluearrow" d="M 200 168 L 240 168 L 240 106"/>
  <path class="bluearrow" d="M 236 112 L 240 106 L 244 112"/>

  <rect class="pillar" x="560" y="60" width="26" height="160" rx="3"/>

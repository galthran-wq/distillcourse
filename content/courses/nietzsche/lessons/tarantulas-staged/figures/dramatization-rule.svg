<svg viewBox="0 0 640 230" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tag { font-weight: 600; }
    .plain { fill: none; stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.4; }
    .blue { fill: #4c8dd6; fill-opacity: 0.12; stroke: #4c8dd6; stroke-width: 1.4; }
    .amber { fill: #e2903a; fill-opacity: 0.12; stroke: #e2903a; stroke-width: 1.8; }
    .arrow { stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.4; fill: none; }
  </style>

  <rect class="plain" x="12" y="40" width="162" height="110" rx="6"/>
  <text class="tag" x="24" y="60">the speech</text>
  <text class="label small" x="24" y="78">testimony from a character</text>
  <text class="label small" x="24" y="92">part, number, date</text>
  <text class="muted small" x="24" y="114">"lose me and find yourselves"</text>
  <text class="muted small" x="24" y="128">"Zarathustra too is a poet"</text>
  <text class="muted small" x="24" y="142">the frame the book supplies</text>

  <path class="arrow" d="M 176 95 L 208 95"/>
  <path class="arrow" d="M 202 91 L 208 95 L 202 99"/>
  <text class="muted small" x="192" y="84" text-anchor="middle">map</text>

  <rect class="blue" x="210" y="40" width="170" height="110" rx="6"/>
  <text class="tag" x="222" y="60" fill="#4c8dd6">the argued passage</text>
  <text class="label small" x="222" y="78">GM or BGE, by section</text>
  <text class="label small" x="222" y="92">the same claim, argued</text>
  <text class="label small" x="222" y="114">or: none</text>
  <text class="muted small" x="222" y="128">the later text is cited</text>
  <text class="muted small" x="222" y="142">wherever the two disagree</text>

  <path class="arrow" d="M 380 95 L 426 95"/>
  <path class="arrow" d="M 420 91 L 426 95 L 420 99"/>
  <text class="muted small" x="403" y="84" text-anchor="middle">rest</text>

  <rect class="amber" x="428" y="28" width="200" height="134" rx="6"/>
  <text class="tag" x="440" y="48" fill="#e2903a">the residue</text>
  <text class="tag small" x="440" y="70">adds</text>
  <text class="label small" x="490" y="70">in the speech, not argued</text>
  <text class="tag small" x="440" y="94">drops</text>
  <text class="label small" x="490" y="94">argued, not in the speech</text>
  <text class="tag small" x="440" y="118">undercuts</text>
  <text class="label small" x="512" y="118">the frame withdraws</text>
  <text class="label small" x="512" y="132">what a line asserts</text>
  <text class="muted small" x="440" y="152">the application's result</text>

  <text class="muted small" x="12" y="190">verdict: the argued passage, never the speech, is the premise;</text>
  <text class="muted small" x="12" y="206">the speech is cited for what it adds, with what it undercuts stated beside it</text>
</svg>

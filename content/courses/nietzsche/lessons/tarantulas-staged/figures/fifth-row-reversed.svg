<svg viewBox="0 0 640 250" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tag { font-weight: 600; }
    .boxblue { fill: #4c8dd6; fill-opacity: 0.1; stroke: #4c8dd6; stroke-width: 1.4; }
    .boxamber { fill: #e2903a; fill-opacity: 0.12; stroke: #e2903a; stroke-width: 1.4; }
    .arrblue { stroke: #4c8dd6; stroke-width: 1.6; fill: none; }
    .arramber { stroke: #e2903a; stroke-width: 1.6; fill: none; }
    .blue { fill: #4c8dd6; }
    .amber { fill: #e2903a; }
    .col { stroke: currentColor; stroke-opacity: 0.25; stroke-width: 1; stroke-dasharray: 3 3; }
  </style>
  <defs>
    <marker id="ab" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4c8dd6"/>
    </marker>
    <marker id="aa" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#e2903a"/>
    </marker>
  </defs>

  <text class="tag" x="12" y="20">the fifth row, run in both directions</text>
  <text class="muted small" x="12" y="36">the incapacity</text>
  <text class="muted small" x="238" y="36">its name</text>
  <text class="muted small" x="452" y="36">what the name is worth</text>

  <!-- upper row: GM I:14 -->
  <text class="tag small blue" x="12" y="60">GM I:14, the workshop (1887)</text>

  <rect class="boxblue" x="12" y="68" width="176" height="46" rx="5"/>
  <text class="label small" x="20" y="86">not being able to take revenge</text>
  <text class="muted small" x="20" y="102">Sich-nicht-rächen-Können</text>

  <line class="arrblue" x1="190" y1="91" x2="228" y2="91" marker-end="url(#ab)"/>
  <text class="blue small" x="188" y="126">renamed</text>

  <rect class="boxblue" x="232" y="68" width="186" height="46" rx="5"/>
  <text class="label small" x="240" y="86">not wanting to take revenge</text>
  <text class="muted small" x="240" y="102">Sich-nicht-rächen-Wollen</text>

  <line class="arrblue" x1="420" y1="91" x2="446" y2="91" marker-end="url(#ab)"/>

  <rect class="boxblue" x="450" y="68" width="178" height="46" rx="5"/>
  <text class="label small" x="458" y="86">"perhaps even forgiveness"</text>
  <text class="muted small" x="458" y="102">"the good and the just"</text>

  <!-- lower row: Z II 7 -->
  <text class="tag small amber" x="12" y="146">"On the Tarantulas" (1883)</text>

  <rect class="boxamber" x="450" y="154" width="178" height="46" rx="5"/>
  <text class="label small" x="458" y="172">"the good and the just"</text>
  <text class="muted small" x="458" y="188">the name, taken as given</text>

  <line class="arramber" x1="448" y1="177" x2="422" y2="177" marker-end="url(#aa)"/>

  <rect class="boxamber" x="232" y="154" width="186" height="46" rx="5"/>
  <text class="label small" x="240" y="172">able to take revenge</text>
  <text class="muted small" x="240" y="188">"all they lack ... is – power!"</text>

  <line class="arramber" x1="230" y1="177" x2="192" y2="177" marker-end="url(#aa)"/>
  <text class="amber small" x="172" y="214">power supplied</text>

  <rect class="boxamber" x="12" y="154" width="176" height="46" rx="5"/>
  <text class="label small" x="20" y="172">pharisees</text>
  <text class="muted small" x="20" y="188">the drive to punish, unmasked</text>

  <text class="muted small" x="12" y="232">the workshop renames an incapacity; the speech removes the incapacity and names what is left</text>
</svg>

<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tag { font-weight: 600; }
    .tablet { fill: currentColor; fill-opacity: 0.06; stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.4; }
    .empty { fill: none; stroke: #e2903a; stroke-width: 1.8; stroke-dasharray: 5 3; }
    .goal { fill: #e2903a; font-weight: 600; }
    .rule { stroke: currentColor; stroke-opacity: 0.4; stroke-width: 1; }
  </style>

  <text class="tag" x="12" y="20">"A tablet of the good hangs over every people" (Z I 15)</text>

  <rect class="tablet" x="12" y="36" width="122" height="130" rx="8"/>
  <text class="tag small" x="22" y="54">Greek</text>
  <line class="rule" x1="22" y1="60" x2="120" y2="60"/>
  <text class="label small" x="22" y="78">"always you shall be</text>
  <text class="label small" x="22" y="92">the first and tower</text>
  <text class="label small" x="22" y="106">above others"</text>
  <text class="muted small" x="22" y="130">Iliad VI.208</text>
  <text class="muted small" x="22" y="146">"the path of</text>
  <text class="muted small" x="22" y="159">greatness"</text>

  <rect class="tablet" x="140" y="36" width="122" height="130" rx="8"/>
  <text class="tag small" x="150" y="54">Persian</text>
  <line class="rule" x1="150" y1="60" x2="248" y2="60"/>
  <text class="label small" x="150" y="78">"speak the truth and</text>
  <text class="label small" x="150" y="92">be skilled with the</text>
  <text class="label small" x="150" y="106">bow and arrow"</text>
  <text class="muted small" x="150" y="130">Herodotus I.136</text>
  <text class="muted small" x="150" y="146">"dear and</text>
  <text class="muted small" x="150" y="159">difficult"</text>

  <rect class="tablet" x="268" y="36" width="122" height="130" rx="8"/>
  <text class="tag small" x="278" y="54">Jewish</text>
  <line class="rule" x1="278" y1="60" x2="376" y2="60"/>
  <text class="label small" x="278" y="78">"honor father and</text>
  <text class="label small" x="278" y="92">mother, down to</text>
  <text class="label small" x="278" y="106">the soul's roots"</text>
  <text class="muted small" x="278" y="130">Exodus 20:12</text>
  <text class="muted small" x="278" y="146">"powerful and</text>
  <text class="muted small" x="278" y="159">eternal"</text>

  <rect class="tablet" x="396" y="36" width="122" height="130" rx="8"/>
  <text class="tag small" x="406" y="54">German</text>
  <line class="rule" x1="406" y1="60" x2="504" y2="60"/>
  <text class="label small" x="406" y="78">"practice loyalty and</text>
  <text class="label small" x="406" y="92">risk honor and blood</text>
  <text class="label small" x="406" y="106">for loyalty's sake"</text>
  <text class="muted small" x="406" y="146">"conquered</text>
  <text class="muted small" x="406" y="159">themselves"</text>

  <rect class="empty" x="528" y="36" width="100" height="130" rx="8"/>
  <text class="goal small" x="538" y="54">the one goal</text>
  <text class="goal small" x="538" y="78">still missing</text>
  <text class="muted small" x="538" y="106">"humanity still</text>
  <text class="muted small" x="538" y="120">has no goal"</text>
  <text class="muted small" x="538" y="144">Prologue §3:</text>
  <text class="muted small" x="538" y="158">the overman</text>

  <text class="label small" x="12" y="196">the law of the tablets: "praiseworthy to them is whatever they consider difficult";</text>
  <text class="label small" x="12" y="210">"once you discover a people's need and land and sky and neighbor, you guess as well the law of their overcomings"</text>
  <text class="muted small" x="12" y="236">every tablet is gut und böse; no tablet is coined by a No; the second coinage of GM I:10 is absent</text>
</svg>

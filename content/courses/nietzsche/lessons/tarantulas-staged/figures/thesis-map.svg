<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tag { font-weight: 600; }
    .rule { stroke: currentColor; stroke-opacity: 0.25; stroke-width: 1; }
    .head { stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.4; }
    .refblue { fill: #4c8dd6; }
    .refamber { fill: #e2903a; }
    .none { fill: #e2903a; fill-opacity: 0.12; stroke: #e2903a; stroke-width: 1.4; }
  </style>

  <text class="tag" x="12" y="20">"On the Tarantulas" (Z II 7, 1883)</text>
  <text class="tag" x="420" y="20" fill="#4c8dd6">the argued passage</text>
  <line class="head" x1="12" y1="28" x2="628" y2="28"/>

  <text class="label small" x="12" y="48">revenge sits in your soul; your poison makes the soul whirl</text>
  <text class="refblue small" x="420" y="48">GM I:10, ressentiment</text>
  <line class="rule" x1="12" y1="56" x2="628" y2="56"/>

  <text class="label small" x="12" y="74">preachers of equality, hidden avengers</text>
  <text class="refblue small" x="420" y="74">BGE 202, heir to Christianity</text>
  <line class="rule" x1="12" y1="82" x2="628" y2="82"/>

  <text class="label small" x="12" y="100">"revenge and insult on all whose equals we are not"</text>
  <text class="refblue small" x="420" y="100">GM I:10; I:14, "justice"</text>
  <line class="rule" x1="12" y1="108" x2="628" y2="108"/>

  <text class="label small" x="12" y="126">"'will to equality' shall be the name for virtue"</text>
  <text class="refblue small" x="420" y="126">GM I:14, the workshop</text>
  <line class="rule" x1="12" y1="134" x2="628" y2="134"/>

  <text class="label small" x="12" y="152">the tyrant's madness of impotence cries for "equality"</text>
  <text class="refblue small" x="420" y="152">GM I:7; I:13, impotence</text>
  <line class="rule" x1="12" y1="160" x2="628" y2="160"/>

  <text class="label small" x="12" y="178">those who preach my doctrine of life, and are tarantulas</text>
  <text class="refblue small" x="420" y="178">BGE 44, the levelers</text>
  <line class="rule" x1="12" y1="186" x2="628" y2="186"/>

  <text class="label small" x="12" y="204">mistrust all in whom the drive to punish is strong</text>
  <text class="refblue small" x="420" y="204">TI, Errors §7; GM II:11</text>
  <line class="rule" x1="12" y1="212" x2="628" y2="212"/>

  <text class="label small" x="12" y="230">"the good and the just" lack only power to be pharisees</text>
  <text class="refblue small" x="420" y="230">GM I:13, the lambs; I:14</text>
  <line class="rule" x1="12" y1="238" x2="628" y2="238"/>

  <text class="label small" x="12" y="256">humans are not equal; my love for the overman</text>
  <text class="refblue small" x="420" y="256">BGE 257</text>
  <text class="refamber small" x="480" y="256">/ overman: none</text>
  <line class="rule" x1="12" y1="264" x2="628" y2="264"/>

  <rect class="none" x="414" y="270" width="214" height="20" rx="4"/>
  <text class="label small" x="12" y="284">mankind redeemed from revenge: the bridge to the highest hope</text>
  <text class="refamber small" x="420" y="284">none in GM I (Z II 20)</text>
  <line class="rule" x1="12" y1="292" x2="628" y2="292"/>

  <rect class="none" x="414" y="298" width="214" height="20" rx="4"/>
  <text class="label small" x="12" y="312">the tarantula bit me; bind me fast to this pillar</text>
  <text class="refamber small" x="420" y="312">none</text>
</svg>

<svg viewBox="0 0 640 352" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .t { fill: currentColor; }
    .m { fill: currentColor; opacity: 0.55; }
    .s { font-size: 10.5px; }
    .h { fill: currentColor; font-weight: 600; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .sep { stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1; stroke-dasharray: 3 3; }
    .fixed { fill: #e2903a; }
    .implied { fill: none; stroke: #e2903a; stroke-width: 1.6; }
    .none { stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.4; }
    .step { fill: none; stroke: #4c8dd6; stroke-width: 1.8; }
  </style>
  <text class="h" x="16" y="22">A §2: three definitions, and which of the three conditions each fixes</text>

  <text class="m s" x="404" y="50" text-anchor="middle">(i) an end</text>
  <text class="m s" x="490" y="50" text-anchor="middle">(ii) resistance</text>
  <text class="m s" x="578" y="50" text-anchor="middle">(iii) overcoming</text>

  <text class="h" x="64" y="80">What is good?</text>
  <text class="t s" x="64" y="96">"all that heightens the feeling of power,</text>
  <text class="t s" x="64" y="110">the will to power, power itself in man"</text>
  <text class="blue s" x="64" y="128">evaluative: names the standard, says nothing of its content</text>
  <line class="none" x1="398" y1="98" x2="410" y2="98"/>
  <line class="none" x1="484" y1="98" x2="496" y2="98"/>
  <line class="none" x1="572" y1="98" x2="584" y2="98"/>

  <line class="sep" x1="64" y1="142" x2="624" y2="142"/>

  <text class="h" x="64" y="166">What is bad?</text>
  <text class="t s" x="64" y="182">"all that proceeds from weakness"</text>
  <text class="blue s" x="64" y="200">evaluative: the standard's contrary</text>
  <line class="none" x1="398" y1="180" x2="410" y2="180"/>
  <line class="none" x1="484" y1="180" x2="496" y2="180"/>
  <circle class="implied" cx="578" cy="180" r="5"/>
  <text class="m s" x="578" y="200" text-anchor="middle">by negation: the</text>
  <text class="m s" x="578" y="212" text-anchor="middle">overcoming fails</text>

  <line class="sep" x1="64" y1="222" x2="624" y2="222"/>

  <text class="h" x="64" y="246">What is happiness?</text>
  <text class="t s" x="64" y="262">"the feeling that power increases,</text>
  <text class="t s" x="64" y="276">that a resistance is overcome"</text>
  <text class="amber s" x="64" y="294">descriptive: the doctrine's content</text>
  <circle class="implied" cx="404" cy="266" r="5"/>
  <text class="m s" x="404" y="286" text-anchor="middle">implied: a resistance</text>
  <text class="m s" x="404" y="298" text-anchor="middle">is to something</text>
  <circle class="fixed" cx="490" cy="266" r="5"/>
  <circle class="fixed" cx="578" cy="266" r="5"/>

  <path class="step" d="M 36 262 L 36 92"/>
  <polygon points="31,96 36,84 41,96" fill="#4c8dd6"/>
  <text class="blue s" x="16" y="322">the is–ought step: from the third answer, what is felt, to the first, what is good;</text>
  <text class="t s" x="16" y="336">no premise stated. Leiter: Mill's "desired, so desirable"; Hussain: none needed if the position is a naturalism</text>
  <circle class="fixed" cx="70" cy="46" r="4"/><text class="m s" x="78" y="50">fixed</text>
  <circle class="implied" cx="126" cy="46" r="4"/><text class="m s" x="134" y="50">implied</text>
  <line class="none" x1="190" y1="46" x2="202" y2="46"/><text class="m s" x="208" y="50">not fixed</text>
</svg>

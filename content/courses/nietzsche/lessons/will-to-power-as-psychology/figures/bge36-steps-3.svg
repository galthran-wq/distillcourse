<svg viewBox="0 0 640 440" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .t { fill: currentColor; }
    .m { fill: currentColor; opacity: 0.55; }
    .g { fill: currentColor; opacity: 0.28; }
    .s { font-size: 10.5px; }
    .h { fill: currentColor; font-weight: 600; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .row { fill: none; stroke: currentColor; stroke-opacity: 0.45; stroke-width: 1.2; }
    .row-g { fill: none; stroke: currentColor; stroke-opacity: 0.2; stroke-width: 1.2; }
    .row-a { fill: none; stroke: #e2903a; stroke-width: 2; }
    .badge { fill: currentColor; opacity: 0.75; }
    .badge-g { fill: currentColor; opacity: 0.25; }
    .badge-a { fill: #e2903a; }
    .note { fill: none; stroke: #4c8dd6; stroke-width: 1.4; }
    .note-g { fill: none; stroke: currentColor; stroke-opacity: 0.4; stroke-width: 1.2; stroke-dasharray: 4 3; }
  </style>
  <text class="h" x="16" y="22">BGE 36 in seven steps, with the mood of each</text>
  <rect class="row" x="16" y="36" width="392" height="46" rx="6"/>
  <circle class="badge" cx="34" cy="59" r="10"/>
  <text class="s" x="34" y="63" text-anchor="middle" style="fill:#fff;font-weight:600">1</text>
  <text class="t s" x="52" y="53">Suppose nothing is "given" as real except</text>
  <text class="t s" x="52" y="67">our world of desires and passions</text>
  <text class="m s" x="52" y="79">gesetzt · suppose</text>
  <rect class="row" x="16" y="88" width="392" height="46" rx="6"/>
  <circle class="badge" cx="34" cy="111" r="10"/>
  <text class="s" x="34" y="115" text-anchor="middle" style="fill:#fff;font-weight:600">2</text>
  <text class="t s" x="52" y="105">and no other "reality" is reachable than that of</text>
  <text class="t s" x="52" y="119">our drives; thinking is a relation among drives</text>
  <text class="m s" x="52" y="131">still under "suppose"</text>
  <rect class="row-a" x="16" y="140" width="392" height="46" rx="6"/>
  <circle class="badge-a" cx="34" cy="163" r="10"/>
  <text class="s" x="34" y="167" text-anchor="middle" style="fill:#fff;font-weight:600">3</text>
  <text class="t s" x="52" y="157">then one may ask whether this given suffices</text>
  <text class="t s" x="52" y="171">to understand the "mechanistic" world too</text>
  <text class="amber s" x="52" y="183">ist es nicht erlaubt? · a question</text>
  <rect class="row-g" x="16" y="192" width="392" height="46" rx="6"/>
  <circle class="badge-g" cx="34" cy="215" r="10"/>
  <text class="s" x="34" y="219" text-anchor="middle" style="fill:#fff;font-weight:600">4</text>
  <text class="g s" x="52" y="209">not as illusion: of the same rank of reality</text>
  <text class="g s" x="52" y="223">as our affect, "a pre-form of life"</text>
  <text class="g s" x="52" y="235">ich meine · a gloss, question mark</text>
  <rect class="row-g" x="16" y="244" width="392" height="46" rx="6"/>
  <circle class="badge-g" cx="34" cy="267" r="10"/>
  <text class="s" x="34" y="271" text-anchor="middle" style="fill:#fff;font-weight:600">5</text>
  <text class="g s" x="52" y="261">the conscience of method demands the attempt:</text>
  <text class="g s" x="52" y="275">one kind of causality, pushed to its limit</text>
  <text class="g s" x="52" y="287">geboten · the one indicative</text>
  <rect class="row-g" x="16" y="296" width="392" height="46" rx="6"/>
  <circle class="badge-g" cx="34" cy="319" r="10"/>
  <text class="s" x="34" y="323" text-anchor="middle" style="fill:#fff;font-weight:600">6</text>
  <text class="g s" x="52" y="313">if we believe in the will's causality, posit it</text>
  <text class="g s" x="52" y="327">as the only causality: will acts only on will</text>
  <text class="g s" x="52" y="339">thun wir das… · if; "hypothetically"</text>
  <rect class="row-g" x="16" y="348" width="392" height="46" rx="6"/>
  <circle class="badge-g" cx="34" cy="371" r="10"/>
  <text class="s" x="34" y="375" text-anchor="middle" style="fill:#fff;font-weight:600">7</text>
  <text class="g s" x="52" y="365">suppose all drive-life reduces to will to power</text>
  <text class="g s" x="52" y="379">("my proposition"): then the world "would be" it</text>
  <text class="g s" x="52" y="391">gesetzt… wäre · suppose… would be</text>
  <rect class="note-g" x="416" y="36" width="216" height="128" rx="6"/>
  <text class="m s" x="428" y="54">step 3: no objection at this step</text>
  <text class="t s" x="428" y="74">A permission, conditional on</text>
  <text class="t s" x="428" y="88">steps 1 and 2. Nothing has been</text>
  <text class="t s" x="428" y="102">asserted yet.</text>
  <text class="m s" x="416" y="186">amber = the current step;</text>
  <text class="m s" x="416" y="200">the mood word is the step's own</text>
  <text class="m s" x="416" y="214">(German, then a gloss)</text>
  <text class="m s" x="416" y="240">Norman: "Assuming that";</text>
  <text class="m s" x="416" y="254">Kaufmann: "Suppose"; the German</text>
  <text class="m s" x="416" y="268">is "Gesetzt, dass"</text>
</svg>

<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
<style>.label{fill:currentColor}.muted{fill:currentColor;opacity:.55;font-size:12px}.amber{fill:#e2903a}.blue{fill:#4c8dd6}</style>
<defs><marker id="lp4-a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker><marker id="lp4-am" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e2903a"/></marker><marker id="lp4-bl" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4c8dd6"/></marker></defs>
<text class="muted" x="112" y="24" text-anchor="middle" font-size="12.5" font-weight="600">Schopenhauer: the pendulum</text>
<path d="M38 92 Q112 210 186 92" fill="none" stroke="currentColor" stroke-opacity="0.35" stroke-dasharray="3 3"/>
<circle cx="38" cy="92" r="5" fill="currentColor" fill-opacity="0.45"/>
<circle cx="112" cy="152" r="5" fill="currentColor" fill-opacity="0.45"/>
<circle cx="186" cy="92" r="5" fill="currentColor" fill-opacity="0.45"/>
<text class="muted" x="40" y="70" text-anchor="middle">2 · lack</text>
<text class="muted" x="40" y="84" text-anchor="middle" font-size="11">felt as pain</text>
<text class="muted" x="112" y="176" text-anchor="middle">3 · satisfaction</text>
<text class="muted" x="112" y="190" text-anchor="middle" font-size="11">relief only</text>
<text class="muted" x="184" y="70" text-anchor="middle">4 · boredom</text>
<text class="muted" x="184" y="84" text-anchor="middle" font-size="11">nothing to want</text>
<text class="muted" x="112" y="232" text-anchor="middle" font-size="11.5">the swing never</text>
<text class="muted" x="112" y="247" text-anchor="middle" font-size="11.5">reaches a good</text>
<line x1="238" y1="20" x2="238" y2="270" stroke="currentColor" stroke-opacity="0.2"/>
<text class="label" x="445" y="24" text-anchor="middle" font-size="12.5" font-weight="600">will to power: the loop</text>
<rect x="256" y="46" width="170" height="56" rx="5" fill="#e2903a" fill-opacity="0.12" stroke="#e2903a" stroke-width="1.4"/>
<text class="amber" x="341" y="68" text-anchor="middle" font-size="13" font-weight="600">an aim</text>
<text class="label" x="341" y="88" text-anchor="middle" font-size="12">the summit</text>
<line x1="426" y1="74" x2="448" y2="74" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.4" marker-end="url(#lp4-a)"/>
<rect x="450" y="46" width="180" height="56" rx="5" fill="#4c8dd6" fill-opacity="0.12" stroke="#4c8dd6" stroke-width="1.4"/>
<text class="blue" x="540" y="68" text-anchor="middle" font-size="13" font-weight="600">resistance</text>
<text class="label" x="540" y="88" text-anchor="middle" font-size="12">the north face</text>
<text class="muted" x="540" y="120" text-anchor="middle" font-size="11">felt as unpleasure, and wanted</text>
<line x1="540" y1="128" x2="540" y2="160" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.4" marker-end="url(#lp4-a)"/>
<rect x="450" y="162" width="180" height="62" rx="5" fill="#e2903a" fill-opacity="0.22" stroke="#e2903a" stroke-width="1.8"/>
<text class="amber" x="540" y="184" text-anchor="middle" font-size="13" font-weight="700">overcoming</text>
<text class="label" x="540" y="202" text-anchor="middle" font-size="11.5">the feeling that</text>
<text class="label" x="540" y="216" text-anchor="middle" font-size="11.5">power is growing</text>
<text class="muted" x="540" y="244" text-anchor="middle" font-size="11">A 2: resistance is overcome</text>
<line x1="450" y1="193" x2="430" y2="193" stroke="#e2903a" stroke-opacity="1" stroke-width="1.4" marker-end="url(#lp4-am)"/>
<rect x="250" y="162" width="178" height="62" rx="5" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.6"/>
<text class="label" x="339" y="186" text-anchor="middle" font-size="13.5" font-weight="700">a harder aim</text>
<text class="muted" x="339" y="206" text-anchor="middle" font-size="11">the next resistance sought</text>
<line x1="310" y1="162" x2="310" y2="104" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#lp4-a)"/>
<text class="muted" x="300" y="138" text-anchor="end" font-size="11">again</text>
<text class="muted" x="339" y="244" text-anchor="middle" font-size="11">every victory ends a game</text>
<text class="label" x="320" y="300" text-anchor="middle" font-size="13" font-weight="600">not will to life but will to power (Z II 12)</text>
</svg>

<svg viewBox="0 0 640 270" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
<style>.label{fill:currentColor}.muted{fill:currentColor;opacity:.55;font-size:12px}.amber{fill:#e2903a}.blue{fill:#4c8dd6}</style>
<defs><marker id="ol-a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker><marker id="ol-am" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e2903a"/></marker><marker id="ol-bl" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4c8dd6"/></marker></defs>
<rect x="14" y="30" width="270" height="150" rx="5" fill="#4c8dd6" fill-opacity="0.12" stroke="#4c8dd6" stroke-width="1.4"/>
<text class="blue" x="149" y="54" text-anchor="middle" font-size="13" font-weight="600">outside the game</text>
<text class="muted" x="149" y="72" text-anchor="middle" font-size="11.5">choosing whether to play</text>
<text class="label" x="149" y="112" text-anchor="middle" font-size="13">“what I want</text>
<text class="label" x="149" y="130" text-anchor="middle" font-size="13">is the playing”</text>
<text class="blue" x="149" y="160" text-anchor="middle" font-size="12" font-weight="600">true</text>
<rect x="356" y="30" width="270" height="150" rx="5" fill="#e2903a" fill-opacity="0.12" stroke="#e2903a" stroke-width="1.4"/>
<text class="amber" x="491" y="54" text-anchor="middle" font-size="13" font-weight="600">inside the game</text>
<text class="muted" x="491" y="72" text-anchor="middle" font-size="11.5">engaged in play</text>
<text class="label" x="491" y="104" text-anchor="middle" font-size="13">“what I want is to win”</text>
<line x1="491" y1="114" x2="491" y2="134" stroke="#e2903a" stroke-opacity="1" stroke-width="1.4" marker-end="url(#ol-am)"/>
<rect x="406" y="136" width="170" height="32" rx="5" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.6"/>
<text class="label" x="491" y="157" text-anchor="middle" font-size="12">victory: the game is over</text>
<line x1="290" y1="105" x2="350" y2="105" stroke="currentColor" stroke-opacity="0.9" stroke-width="2.4" marker-end="url(#ol-a)"/>
<text class="muted" x="320" y="96" text-anchor="middle" font-size="11">to play</text>
<text class="label" x="320" y="206" text-anchor="middle" font-size="13.5" font-weight="700">the player must want what ends the playing</text>
<text class="muted" x="320" y="232" text-anchor="middle" font-size="12">Z III 12 §30: “who was not vanquished in his victory?”</text>
<text class="muted" x="320" y="254" text-anchor="middle" font-size="12">the loop’s answer: a harder game</text>
</svg>

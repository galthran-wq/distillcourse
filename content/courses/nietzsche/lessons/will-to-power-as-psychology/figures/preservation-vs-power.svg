<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .t { fill: currentColor; }
    .m { fill: currentColor; opacity: 0.55; }
    .s { font-size: 10.5px; }
    .h { fill: currentColor; font-weight: 600; }
    .amber { fill: #e2903a; font-weight: 600; }
    .box { fill: none; stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.3; }
    .box-d { fill: none; stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .arr-a { stroke: #e2903a; stroke-width: 4; fill: none; }
    .arr-t { stroke: currentColor; stroke-opacity: 0.55; stroke-width: 1.2; fill: none; }
    .head-a { fill: #e2903a; }
    .head-t { fill: currentColor; opacity: 0.55; }
  </style>
  <text class="h" x="16" y="22">BGE 13: what a living thing wants "above all"</text>

  <rect class="box" x="16" y="118" width="132" height="46" rx="6"/>
  <text class="t" x="82" y="138" text-anchor="middle">a living thing</text>
  <text class="m s" x="82" y="154" text-anchor="middle">"etwas Lebendiges"</text>

  <path class="arr-a" d="M 150 134 L 318 84"/>
  <path class="head-a" d="M 318 84 L 300 82 L 308 96 Z"/>
  <text class="amber" x="330" y="80">discharge its strength</text>
  <text class="m s" x="330" y="96">"vor Allem", above all: "life itself is will to power"</text>

  <path class="arr-t" d="M 150 148 L 318 200"/>
  <path class="head-t" d="M 318 200 L 300 200 L 308 188 Z"/>
  <text class="t" x="330" y="198">preserve itself</text>
  <text class="m s" x="330" y="214">"only one of the indirect and most frequent</text>
  <text class="m s" x="330" y="228">consequences"; the conatus, "Spinoza's inconsistency"</text>

  <rect class="box-d" x="16" y="248" width="608" height="56" rx="6"/>
  <text class="m s" x="28" y="266">Nachlass, corroborating only (the note printed as WP 702): "the protoplasm stretches its</text>
  <text class="m s" x="28" y="280">pseudopodia in order to search for something that resists it, not from hunger but from will to power";</text>
  <text class="m s" x="28" y="294">published: TI IX:14, "where there is a struggle it is a struggle for power"; "do not mistake Malthus for nature"</text>
</svg>

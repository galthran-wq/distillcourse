<svg viewBox="0 0 640 346" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
<style>.label{fill:currentColor}.muted{fill:currentColor;opacity:.55;font-size:12px}.amber{fill:#e2903a}.blue{fill:#4c8dd6}</style>
<defs><marker id="pr-a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker><marker id="pr-am" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e2903a"/></marker><marker id="pr-bl" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4c8dd6"/></marker></defs>
<text class="label" x="290" y="26" text-anchor="middle" font-size="12" font-weight="600">self-preservation</text>
<text class="muted" x="290" y="42" text-anchor="middle" font-size="11">Darwin’s readers</text>
<text class="label" x="430" y="26" text-anchor="middle" font-size="12" font-weight="600">relief from want</text>
<text class="muted" x="430" y="42" text-anchor="middle" font-size="11">Schopenhauer</text>
<text class="amber" x="565" y="26" text-anchor="middle" font-size="12" font-weight="600">will to power</text>
<text class="muted" x="565" y="42" text-anchor="middle" font-size="11">Nietzsche</text>
<rect x="10" y="58" width="620" height="50" rx="5" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.6"/>
<text class="label" x="22" y="88" font-size="13" font-weight="600">eating when hungry</text>
<text class="label" x="290" y="90" text-anchor="middle" font-size="17" font-weight="700">✓</text>
<text class="label" x="430" y="90" text-anchor="middle" font-size="17" font-weight="700">✓</text>
<text class="label" x="565" y="90" text-anchor="middle" font-size="17" font-weight="700">✓</text>
<rect x="10" y="116" width="620" height="50" rx="5" fill="#e2903a" fill-opacity="0.1" stroke="#e2903a" stroke-width="1"/>
<text class="label" x="22" y="140" font-size="13" font-weight="600">climbing the north face</text>
<text class="muted" x="22" y="156" font-size="11">a cable car runs to the top</text>
<text class="muted" x="290" y="148" text-anchor="middle" font-size="17" font-weight="700">✗</text>
<text class="muted" x="430" y="148" text-anchor="middle" font-size="17" font-weight="700">✗</text>
<text class="amber" x="565" y="148" text-anchor="middle" font-size="17" font-weight="700">✓</text>
<rect x="10" y="174" width="620" height="50" rx="5" fill="#e2903a" fill-opacity="0.1" stroke="#e2903a" stroke-width="1"/>
<text class="label" x="22" y="198" font-size="13" font-weight="600">an ascetic’s fasting</text>
<text class="muted" x="22" y="214" font-size="11">enjoyed, and made harder</text>
<text class="muted" x="290" y="206" text-anchor="middle" font-size="17" font-weight="700">✗</text>
<text class="muted" x="430" y="196" text-anchor="middle" font-size="10">explained as the will’s denial,</text>
<text class="muted" x="430" y="210" text-anchor="middle" font-size="10">not as torment enjoyed</text>
<text class="amber" x="565" y="206" text-anchor="middle" font-size="17" font-weight="700">✓</text>
<rect x="10" y="232" width="620" height="50" rx="5" fill="#e2903a" fill-opacity="0.1" stroke="#e2903a" stroke-width="1"/>
<text class="label" x="22" y="262" font-size="13" font-weight="600">a martyr’s death for a faith</text>
<text class="muted" x="290" y="264" text-anchor="middle" font-size="17" font-weight="700">✗</text>
<text class="muted" x="430" y="264" text-anchor="middle" font-size="17" font-weight="700">?</text>
<text class="amber" x="565" y="264" text-anchor="middle" font-size="17" font-weight="700">✓</text>
<text class="muted" x="430" y="296" text-anchor="middle" font-size="10.5">? = only if a reward is hoped for beyond death</text>
<text class="muted" x="22" y="52"></text>
<text class="muted" x="320" y="322" text-anchor="middle" font-size="11.5">grey row: all agree, the case decides nothing · amber rows: the predictions part</text>
<text class="label" x="320" y="342" text-anchor="middle" font-size="12">what decides: strength spent against resistance that safety and comfort would avoid</text>
</svg>

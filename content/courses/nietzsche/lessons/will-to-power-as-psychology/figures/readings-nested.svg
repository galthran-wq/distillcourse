<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .t { fill: currentColor; }
    .m { fill: currentColor; opacity: 0.55; }
    .s { font-size: 10.5px; }
    .h { fill: currentColor; font-weight: 600; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .r-out { fill: none; stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.3; stroke-dasharray: 5 3; }
    .r-mid { fill: none; stroke: #4c8dd6; stroke-width: 1.6; }
    .r-in { fill: none; stroke: #e2903a; stroke-width: 2; }
    .rule { stroke: currentColor; stroke-opacity: 0.35; stroke-width: 1; }
  </style>
  <text class="h" x="16" y="22">three readings of "will to power", nested by scope</text>

  <rect class="r-out" x="16" y="36" width="380" height="348" rx="10"/>
  <text class="h" x="28" y="56">cosmological: everything is will to power</text>
  <text class="m s" x="28" y="72">BGE 36: argued, in the conditional ("would be")</text>
  <text class="m s" x="28" y="86">Z II "On Self-Overcoming": "Life" speaks it</text>
  <text class="m s" x="28" y="100">WP 1067: Nachlass, indicative, no published counterpart</text>

  <rect class="r-mid" x="40" y="114" width="332" height="250" rx="9"/>
  <text class="blue" x="52" y="134">biological: all life is will to power</text>
  <text class="m s" x="52" y="150">BGE 13: "life itself is will to power"</text>
  <text class="m s" x="52" y="164">BGE 259: exploitation "belongs to the essence of being alive"</text>
  <text class="m s" x="52" y="178">TI IX:14: "where there is a struggle it is a struggle for power"</text>

  <rect class="r-in" x="64" y="192" width="284" height="156" rx="8"/>
  <text class="amber" x="76" y="212">psychological: what humans seek,</text>
  <text class="amber" x="76" y="227">and what satisfies them</text>
  <text class="m s" x="76" y="246">BGE 23: psychology as its "morphology"</text>
  <text class="m s" x="76" y="260">A §2: "what is good?" defined by it</text>
  <text class="m s" x="76" y="274">GM II:12: a will to power "has become master"</text>
  <text class="m s" x="76" y="288">GM III:15, III:18: the priest's, "the very weakest"</text>
  <text class="m s" x="76" y="302">BGE 9: philosophy as its "most spiritual" form</text>
  <text class="m s" x="76" y="316">GM I:13: "a thirst for enemies and resistances"</text>

  <line class="rule" x1="412" y1="36" x2="412" y2="384"/>
  <text class="h" x="424" y="56">what each needs the text to say</text>
  <text class="t s" x="424" y="80">cosmological:</text>
  <text class="m s" x="424" y="94">that force is will, and an</text>
  <text class="m s" x="424" y="108">indicative sentence saying so</text>
  <text class="m s" x="424" y="122">in a published work</text>
  <text class="blue s" x="424" y="154">biological:</text>
  <text class="m s" x="424" y="168">that every organism's basic</text>
  <text class="m s" x="424" y="182">drive is discharge, not</text>
  <text class="m s" x="424" y="196">preservation</text>
  <text class="amber s" x="424" y="228">psychological:</text>
  <text class="m s" x="424" y="242">that drives seek to command,</text>
  <text class="m s" x="424" y="256">and that satisfaction is a</text>
  <text class="m s" x="424" y="270">resistance overcome</text>
  <text class="t s" x="424" y="310">each outer reading needs the</text>
  <text class="t s" x="424" y="324">inner ones; the innermost</text>
  <text class="t s" x="424" y="338">needs neither of the outer</text>
</svg>

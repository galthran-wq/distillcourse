<svg viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .t { fill: currentColor; }
    .m { fill: currentColor; opacity: 0.55; }
    .s { font-size: 10.5px; }
    .h { fill: currentColor; font-weight: 600; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .box { fill: none; stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.3; }
    .box-a { fill: none; stroke: #e2903a; stroke-width: 2; }
    .box-b { fill: none; stroke: #4c8dd6; stroke-width: 1.6; }
    .arr { stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.4; fill: none; }
    .arr-a { stroke: #e2903a; stroke-width: 1.8; fill: none; stroke-dasharray: 5 3; }
    .head { fill: currentColor; opacity: 0.6; }
    .head-a { fill: #e2903a; }
  </style>
  <text class="h" x="16" y="22">Reginster's three conditions, run as a loop</text>

  <rect class="box-b" x="196" y="40" width="248" height="44" rx="7"/>
  <text class="blue" x="320" y="58" text-anchor="middle">(i) a determinate end</text>
  <text class="m s" x="320" y="74" text-anchor="middle">a first-order desire: to win, to understand</text>

  <path class="arr" d="M 444 62 L 480 110"/>
  <path class="head" d="M 480 110 L 468 106 L 475 98 Z"/>

  <rect class="box" x="440" y="114" width="184" height="44" rx="7"/>
  <text class="t" x="532" y="132" text-anchor="middle">(ii) resistance to it</text>
  <text class="m s" x="532" y="148" text-anchor="middle">an opponent, a hard problem</text>

  <path class="arr" d="M 532 158 L 532 200"/>
  <path class="head" d="M 532 200 L 527 189 L 537 189 Z"/>

  <rect class="box" x="440" y="204" width="184" height="44" rx="7"/>
  <text class="t" x="532" y="222" text-anchor="middle">(iii) it is overcome</text>
  <text class="m s" x="532" y="238" text-anchor="middle">success, not a standing struggle</text>

  <path class="arr" d="M 440 240 L 400 290"/>
  <path class="head" d="M 400 290 L 402 278 L 411 284 Z"/>

  <rect class="box-a" x="196" y="294" width="248" height="44" rx="7"/>
  <text class="amber" x="320" y="312" text-anchor="middle">the will to power is satisfied</text>
  <text class="m s" x="320" y="328" text-anchor="middle">"the feeling that power increases" (A §2)</text>

  <path class="arr" d="M 196 316 L 130 250"/>
  <path class="head" d="M 130 250 L 141 253 L 134 261 Z"/>

  <rect class="box" x="16" y="204" width="184" height="44" rx="7"/>
  <text class="t" x="108" y="222" text-anchor="middle">the resistance is gone</text>
  <text class="m s" x="108" y="238" text-anchor="middle">condition (ii) now fails</text>

  <path class="arr-a" d="M 108 204 L 108 140 Q 108 62 210 62"/>
  <path class="head-a" d="M 214 62 L 202 56 L 202 68 Z"/>
  <text class="amber s" x="16" y="122">a new end,</text>
  <text class="amber s" x="16" y="136">or a greater</text>
  <text class="amber s" x="16" y="150">resistance</text>

  <text class="t s" x="320" y="186" text-anchor="middle">second-order: about how an end is pursued, not which end</text>
  <text class="t s" x="320" y="202" text-anchor="middle">self-perpetuating: satisfaction removes its own condition</text>
  <text class="m s" x="320" y="366" text-anchor="middle">"who was not defeated in his victory!" (Z III, "On Old and New Tablets" §30)</text>
</svg>

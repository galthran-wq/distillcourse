<svg viewBox="0 0 640 344" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .t { fill: currentColor; }
    .m { fill: currentColor; opacity: 0.55; }
    .s { font-size: 10.5px; }
    .h { fill: currentColor; font-weight: 600; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .axis { stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.2; }
    .dot { fill: currentColor; }
    .dot-a { fill: #e2903a; }
    .box-a { fill: none; stroke: #e2903a; stroke-width: 2; }
    .box-b { fill: none; stroke: #4c8dd6; stroke-width: 1.4; }
    .box-d { fill: none; stroke: #4c8dd6; stroke-width: 1.4; stroke-dasharray: 4 3; }
  </style>
  <text class="h" x="16" y="22">four analyses of "power" in the psychological doctrine, and the objection each meets</text>

  <text class="m s" x="16" y="46">a state one can hold and keep</text>
  <text class="m s" x="624" y="46" text-anchor="end">an activity that has to be repeated</text>
  <line class="axis" x1="24" y1="60" x2="612" y2="60"/>
  <polygon points="612,56 622,60 612,64" fill="currentColor" fill-opacity="0.6"/>
  <circle class="dot" cx="90" cy="60" r="4"/>
  <circle class="dot" cx="246" cy="60" r="4"/>
  <circle class="dot" cx="402" cy="60" r="4"/>
  <circle class="dot-a" cx="558" cy="60" r="4"/>

  <text class="h" x="24" y="90">Kaufmann 1950</text>
  <text class="t s" x="24" y="106">self-control: the power</text>
  <text class="t s" x="24" y="120">Nietzsche prizes is</text>
  <text class="t s" x="24" y="134">"primarily" over oneself</text>
  <text class="m s" x="24" y="166">resistance: not required</text>
  <rect class="box-b" x="16" y="180" width="148" height="148" rx="6"/>
  <text class="blue s" x="24" y="198">objection (Clark)</text>
  <text class="t s" x="24" y="214">Z I, "On the Thousand</text>
  <text class="t s" x="24" y="228">and One Goals": a people</text>
  <text class="t s" x="24" y="242">esteems what makes it</text>
  <text class="t s" x="24" y="256">"rule, and triumph, and</text>
  <text class="t s" x="24" y="270">shine to the envy of</text>
  <text class="t s" x="24" y="284">their neighbour"; nothing</text>
  <text class="t s" x="24" y="298">there is satisfied by</text>
  <text class="t s" x="24" y="312">power over oneself</text>

  <text class="h" x="180" y="90">Clark 1990</text>
  <text class="t s" x="180" y="106">capacity: "the ability to do</text>
  <text class="t s" x="180" y="120">or get what one wants", a</text>
  <text class="t s" x="180" y="134">second-order desire for</text>
  <text class="t s" x="180" y="148">the means</text>
  <text class="m s" x="180" y="166">resistance: not required</text>
  <rect class="box-b" x="172" y="180" width="148" height="148" rx="6"/>
  <text class="blue s" x="180" y="198">objection (Reginster)</text>
  <text class="t s" x="180" y="214">a capacity, once the</text>
  <text class="t s" x="180" y="228">means are secured, is</text>
  <text class="t s" x="180" y="242">fully satisfied, and an</text>
  <text class="t s" x="180" y="256">unresisted route secures</text>
  <text class="t s" x="180" y="270">it as well: no</text>
  <text class="t s" x="180" y="284">insatiability, and no</text>
  <text class="t s" x="180" y="298">place for the "thirst</text>
  <text class="t s" x="180" y="312">for enemies"</text>

  <text class="h" x="336" y="90">Richardson 1996</text>
  <text class="t s" x="336" y="106">mastery: a drive's</text>
  <text class="t s" x="336" y="120">development, ruling other</text>
  <text class="t s" x="336" y="134">drives and taking their</text>
  <text class="t s" x="336" y="148">ends into its own</text>
  <text class="m s" x="336" y="166">resistance: a means</text>
  <rect class="box-b" x="328" y="180" width="148" height="148" rx="6"/>
  <text class="blue s" x="336" y="198">objection (Reginster)</text>
  <text class="t s" x="336" y="214">overcoming resistance</text>
  <text class="t s" x="336" y="228">is a means to growth,</text>
  <text class="t s" x="336" y="242">dispensable if growth</text>
  <text class="t s" x="336" y="256">came unresisted; I:13's</text>
  <text class="t s" x="336" y="270">"thirst for enemies and</text>
  <text class="t s" x="336" y="284">resistances" makes</text>
  <text class="t s" x="336" y="298">resistance what is</text>
  <text class="t s" x="336" y="312">willed</text>

  <rect class="box-a" x="484" y="72" width="140" height="100" rx="6"/>
  <text class="amber" x="492" y="90">Reginster 2006</text>
  <text class="t s" x="492" y="106">the overcoming of</text>
  <text class="t s" x="492" y="120">resistance in the pursuit</text>
  <text class="t s" x="492" y="134">of a determinate end</text>
  <text class="t s" x="492" y="166">resistance: willed</text>
  <rect class="box-d" x="484" y="180" width="140" height="148" rx="6"/>
  <text class="blue s" x="492" y="198">objection (Poellner)</text>
  <text class="t s" x="492" y="214">second-order, so it</text>
  <text class="t s" x="492" y="228">permits most of what</text>
  <text class="t s" x="492" y="242">the Genealogy attacks:</text>
  <text class="t s" x="492" y="256">the ascetic's self-</text>
  <text class="t s" x="492" y="270">torture is a resistance</text>
  <text class="t s" x="492" y="284">overcome; an objection</text>
  <text class="t s" x="492" y="298">to its use as standard,</text>
  <text class="t s" x="492" y="312">not to the analysis</text>
</svg>

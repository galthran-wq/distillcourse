<svg viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="11.5">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10px; }
    .tag { font-weight: 600; }
    .col { fill: none; stroke: #4c8dd6; stroke-width: 1.6; }
    .head { fill: none; stroke: #e2903a; stroke-width: 1.8; }
    .link { stroke: #e2903a; stroke-width: 1.2; fill: none; }
  </style>

  <!-- shared heading -->
  <rect class="head" x="190" y="14" width="300" height="40" rx="6"/>
  <text class="label tag" x="340" y="32" text-anchor="middle" font-size="13">Der Wille zur Macht</text>
  <text class="muted small" x="340" y="47" text-anchor="middle">the same heading over every draft · notebook group NF-1888,14 · spring 1888</text>

  <line class="link" x1="340" y1="54" x2="340" y2="70"/>
  <line class="link" x1="90" y1="70" x2="590" y2="70"/>
  <line class="link" x1="90" y1="70" x2="90" y2="84"/>
  <line class="link" x1="257" y1="70" x2="257" y2="84"/>
  <line class="link" x1="423" y1="70" x2="423" y2="84"/>
  <line class="link" x1="590" y1="70" x2="590" y2="84"/>

  <!-- column 1: 14[71] -->
  <rect class="col" x="14" y="84" width="152" height="270" rx="5"/>
  <text class="label tag" x="90" y="102" text-anchor="middle">14[71]</text>
  <text class="muted small" x="90" y="116" text-anchor="middle">a list by field</text>
  <text class="label" x="26" y="140">als „Naturgesetz“</text>
  <text class="label" x="26" y="160">als Leben</text>
  <text class="label" x="26" y="180">als Kunst</text>
  <text class="label" x="26" y="200">als Moral</text>
  <text class="label" x="26" y="220">als Politik</text>
  <text class="label" x="26" y="240">als Wissenschaft</text>
  <text class="label" x="26" y="260">als Religion</text>
  <text class="muted small" x="26" y="290">seven headings,</text>
  <text class="muted small" x="26" y="303">no books, no order</text>

  <!-- column 2: 14[78] -->
  <rect class="col" x="181" y="84" width="152" height="270" rx="5"/>
  <text class="label tag" x="257" y="102" text-anchor="middle">14[78]</text>
  <text class="muted small" x="257" y="116" text-anchor="middle">four parts by origin</text>
  <text class="muted small" x="193" y="136">Versuch einer Umwerthung</text>
  <text class="muted small" x="193" y="149">aller Werthe</text>
  <text class="label" x="193" y="172">I. Was aus der Stärke</text>
  <text class="label" x="193" y="185">   stammt</text>
  <text class="label" x="193" y="205">II. Was aus der Schwäche</text>
  <text class="label" x="193" y="218">   stammt</text>
  <text class="label" x="193" y="238">III. Und woraus stammen</text>
  <text class="label" x="193" y="251">   wir? —</text>
  <text class="label" x="193" y="271">IV. Die grosse Wahl</text>

  <!-- column 3: 14[136] -->
  <rect class="col" x="347" y="84" width="152" height="270" rx="5"/>
  <text class="label tag" x="423" y="102" text-anchor="middle">14[136]</text>
  <text class="muted small" x="423" y="116" text-anchor="middle">four books by task</text>
  <text class="muted small" x="359" y="136">Versuch einer Umwerthung</text>
  <text class="muted small" x="359" y="149">aller Werthe</text>
  <text class="label" x="359" y="172">I. Kritik der bisherigen</text>
  <text class="label" x="359" y="185">   Werthe</text>
  <text class="label" x="359" y="205">II. Das neue Princip</text>
  <text class="label" x="359" y="218">   des Werths</text>
  <text class="label" x="359" y="238">III. Frage vom Werthe</text>
  <text class="label" x="359" y="251">   unserer modernen Welt</text>
  <text class="label" x="359" y="271">IV. Der grosse Krieg</text>

  <!-- column 4: 14[156] -->
  <rect class="col" x="513" y="84" width="152" height="270" rx="5"/>
  <text class="label tag" x="590" y="102" text-anchor="middle">14[156]</text>
  <text class="muted small" x="590" y="116" text-anchor="middle">seven chapters</text>
  <text class="label" x="525" y="140">1. die wahre und die</text>
  <text class="label" x="525" y="153">   scheinbare Welt</text>
  <text class="label" x="525" y="171">2. Kritik der Philosophen</text>
  <text class="label" x="525" y="189">3. Moral als décadence</text>
  <text class="label" x="525" y="207">4. Ansätze einer Gegen-</text>
  <text class="label" x="525" y="220">   stellung?</text>
  <text class="label" x="525" y="238">5. Kritik der Gegenwart</text>
  <text class="label" x="525" y="256">6. Der Wille zur Macht,</text>
  <text class="label" x="525" y="269">   als Leben</text>
  <text class="label" x="525" y="287">7. Wir Hyperboreer</text>

  <text class="muted small" x="340" y="380" text-anchor="middle">four outlines from one notebook group in one season: seven fields, four parts, four books, seven chapters</text>
  <text class="muted small" x="340" y="396" text-anchor="middle">no two share a structure; none is the March 1887 plan the editors used</text>
</svg>

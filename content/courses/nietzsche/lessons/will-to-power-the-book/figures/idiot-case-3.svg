<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tag { font-weight: 600; }
    .page { fill: none; stroke: currentColor; stroke-opacity: 0.45; stroke-width: 1.2; }
    .gap { fill: currentColor; opacity: 0.25; }
    .infer { fill: none; stroke: #4c8dd6; stroke-width: 1.6; }
    .struck { opacity: 0.4; }
    .src { fill: none; stroke: #e2903a; stroke-width: 1.8; }
    .restored { fill: #e2903a; font-weight: 600; }
    .cross { stroke: #e2903a; stroke-width: 2; }
  </style>
  <defs>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4c8dd6"/>
    </marker>
  </defs>

  <text class="label tag" x="20" y="24">Step 3 · the words restored and their source found</text>

  <rect class="page" x="20" y="40" width="600" height="96" rx="5"/>
  <text class="muted small" x="32" y="58">Der Antichrist §29, as Nietzsche wrote it (restored 1954; eKGWB AC-29)</text>
  <text class="label" x="32" y="82">Mit der Strenge des Physiologen gesprochen, wäre hier ein ganz</text>
  <text class="label" x="32" y="102">andres Wort eher noch am Platz:</text>
  <text class="restored" x="238" y="102">das Wort Idiot.</text>
  <text class="muted small" x="32" y="124">"Speaking with the rigour of the physiologist, a quite different word would be more in place here: the word idiot."</text>

  <!-- inference (struck) -->
  <g class="struck">
    <path class="infer" d="M 300 136 L 300 176" marker-end="url(#arrb)"/>
    <rect class="infer" x="150" y="178" width="300" height="44" rx="5"/>
    <text class="label tag" x="300" y="196" text-anchor="middle">"the author was already insane"</text>
    <text class="muted small" x="300" y="212" text-anchor="middle">Hofmiller, 1931: the gap read as a symptom</text>
  </g>
  <line class="cross" x1="150" y1="222" x2="450" y2="178"/>

  <!-- source (shown) -->
  <g>
    <rect class="src" x="20" y="236" width="600" height="50" rx="5"/>
    <text class="label tag" x="32" y="255">Source: Dostoevsky, The Idiot · Prince Myshkin</text>
    <text class="muted small" x="32" y="272">read in 1887; the word recurs in A §§11, 26, 42, 51, 52 and in Twilight · the gap was a borrowed term, not a symptom</text>
  </g>

  <text class="muted small" x="320" y="164" text-anchor="middle">Kaufmann, 1950: the word is a technical term borrowed from a novel read the year before</text>
</svg>

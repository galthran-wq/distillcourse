<svg viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tag { font-weight: 600; }
    .grounds { fill: none; stroke: #e2903a; stroke-width: 1.8; }
    .corr { fill: none; stroke: #4c8dd6; stroke-width: 1.8; }
    .dates { fill: none; stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.4; stroke-dasharray: 4 3; }
    .rail { stroke: currentColor; stroke-opacity: 0.35; stroke-width: 1; }
    .wp { fill: none; stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.6; stroke-dasharray: 5 3; }
    .pull { fill: none; stroke: #4c8dd6; stroke-width: 1.2; stroke-dasharray: 3 3; }
    .pullthin { fill: none; stroke: #e2903a; stroke-width: 1; stroke-dasharray: 3 3; }
  </style>

  <line class="rail" x1="12" y1="20" x2="12" y2="366"/>

  <!-- rungs, compressed -->
  <rect class="grounds" x="24" y="22" width="250" height="40" rx="5"/>
  <text class="label tag" x="36" y="39">Published works</text>
  <text class="muted small" x="36" y="55">grounds a claim</text>

  <rect class="grounds" x="24" y="70" width="250" height="40" rx="5"/>
  <text class="label tag" x="36" y="87">Private publications</text>
  <text class="muted small" x="36" y="103">grounds, print run noted</text>

  <rect class="grounds" x="24" y="118" width="250" height="40" rx="5"/>
  <text class="label tag" x="36" y="135">Authorized manuscripts</text>
  <text class="muted small" x="36" y="151">grounds, editing flagged · A, EH</text>

  <rect class="corr" x="24" y="166" width="250" height="40" rx="5"/>
  <text class="label tag" x="36" y="183">Posthumous writings</text>
  <text class="muted small" x="36" y="199">corroborates; dates an early view</text>

  <rect class="corr" x="24" y="214" width="250" height="52" rx="5"/>
  <text class="label tag" x="36" y="231">Posthumous fragments (Nachlass)</text>
  <text class="muted small" x="36" y="247">corroborates and dates; never grounds</text>
  <text class="muted small" x="36" y="260">NF-year,group[fragment], in writing order</text>

  <rect class="dates" x="24" y="274" width="250" height="40" rx="5"/>
  <text class="label tag" x="36" y="291">Letters</text>
  <text class="muted small" x="36" y="307">dates</text>

  <!-- the compilation, off the ladder -->
  <rect class="wp" x="380" y="150" width="280" height="118" rx="6"/>
  <text class="label tag" x="520" y="172" text-anchor="middle">The Will to Power (1901 / 1906)</text>
  <text class="muted small" x="520" y="190" text-anchor="middle">not a category of the edition: no rung</text>
  <text class="label small" x="392" y="212">the words: Nietzsche's, from rung 5</text>
  <text class="label small" x="392" y="228">the selection, the order, the title: editorial</text>
  <text class="label small" x="392" y="244">cited as "WM, n" by Heidegger and Baeumler</text>
  <text class="muted small" x="392" y="260">n gives no date and no notebook neighbour</text>

  <!-- pulls -->
  <path class="pull" d="M 274 240 C 320 240, 330 214, 380 214"/>
  <text class="small" x="292" y="232" fill="#4c8dd6">every fragment comes from here</text>
  <path class="pullthin" d="M 274 42 C 340 42, 330 160, 380 160"/>
  <text class="small" x="300" y="80" fill="#e2903a">some notes were reworked</text>
  <text class="small" x="300" y="93" fill="#e2903a">into BGE, GM, TI, A</text>

  <!-- rule -->
  <rect class="corr" x="380" y="290" width="280" height="62" rx="6"/>
  <text class="label tag" x="392" y="309">To cite WM n in this course:</text>
  <text class="label small" x="392" y="326">1. resolve n to its siglum NF-year,group[k] and date</text>
  <text class="label small" x="392" y="341">2. find the published passage; cite that, and the fragment as its draft</text>

  <text class="muted small" x="340" y="384" text-anchor="middle">the compilation sits beside the ladder, not on it: its fragments are cited by their own sigla or not at all</text>
</svg>

<svg viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .tag { font-weight: 600; }
    .frag { fill: none; stroke: #4c8dd6; stroke-width: 1.8; }
    .book { fill: none; stroke: #e2903a; stroke-width: 1.8; }
    .plan { fill: none; stroke: #e2903a; stroke-width: 1.4; stroke-dasharray: 4 3; }
    .rail { stroke: currentColor; stroke-opacity: 0.35; stroke-width: 1; }
    .move { fill: none; stroke: #4c8dd6; stroke-width: 1.4; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4c8dd6"/>
    </marker>
  </defs>

  <!-- left: notebook order -->
  <text class="label tag" x="20" y="26">Notebook order (eKGWB)</text>
  <text class="muted small" x="20" y="42">one siglum per fragment, in the order he wrote them</text>

  <line class="rail" x1="40" y1="60" x2="40" y2="330"/>
  <text class="muted small" x="16" y="78">1885</text>
  <text class="muted small" x="16" y="160">1887</text>
  <text class="muted small" x="16" y="250">1888</text>
  <text class="muted small" x="16" y="322">1889</text>

  <!-- 1885 fragment -->
  <rect class="frag" x="56" y="62" width="232" height="44" rx="5"/>
  <text class="label tag" x="66" y="80">NF-1885,38[12]</text>
  <text class="muted small" x="66" y="97">June–July 1885 · "Diese Welt ist der Wille zur Macht…"</text>

  <!-- 1887 plan -->
  <rect class="plan" x="56" y="120" width="232" height="44" rx="5"/>
  <text class="label tag" x="66" y="138">NF-1886,7[64]</text>
  <text class="muted small" x="66" y="155">17 March 1887, Nice · four book titles, no text</text>

  <!-- 1887 fragment -->
  <rect class="frag" x="56" y="178" width="232" height="44" rx="5"/>
  <text class="label tag" x="66" y="196">"Die Fürsten Europa's…"</text>
  <text class="muted small" x="66" y="213">1887, revised 1888 · a note on truth and seduction</text>

  <!-- 1888 fragment -->
  <rect class="frag" x="56" y="236" width="232" height="44" rx="5"/>
  <text class="label tag" x="66" y="254">"Recapitulation…"</text>
  <text class="muted small" x="66" y="271">1888 · "twofold falsification" in its second sentence</text>

  <text class="muted small" x="56" y="322">collapse, first week of January 1889</text>

  <!-- right: compiled order -->
  <text class="label tag" x="392" y="26">The Will to Power (1906)</text>
  <text class="muted small" x="392" y="42">1,067 fragments under the four titles of the 1887 plan</text>

  <rect class="book" x="392" y="62" width="268" height="40" rx="5"/>
  <text class="label tag" x="402" y="79">Book I · Der europäische Nihilismus</text>
  <text class="muted small" x="402" y="95">WM 1–134</text>

  <rect class="book" x="392" y="110" width="268" height="40" rx="5"/>
  <text class="label tag" x="402" y="127">Book II · Kritik der höchsten Werthe</text>
  <text class="muted small" x="402" y="143">WM 135–465</text>

  <rect class="book" x="392" y="158" width="268" height="66" rx="5"/>
  <text class="label tag" x="402" y="175">Book III · Princip einer neuen Werthsetzung</text>
  <text class="muted small" x="402" y="191">WM 466–1011</text>
  <text class="small" x="402" y="208" fill="#4c8dd6">WM 617 ·  WM 749 ("Society and State")</text>

  <rect class="book" x="392" y="232" width="268" height="52" rx="5"/>
  <text class="label tag" x="402" y="249">Book IV · Zucht und Züchtung</text>
  <text class="muted small" x="402" y="265">WM 1012–1067</text>
  <text class="small" x="402" y="279" fill="#4c8dd6">WM 1067, the last fragment of the book</text>

  <!-- arrows: fragments to books -->
  <path class="move" d="M 288 84 C 340 84, 340 262, 396 262" marker-end="url(#arr)"/>
  <path class="move" d="M 288 200 C 340 200, 340 204, 396 204" marker-end="url(#arr)"/>
  <path class="move" d="M 288 258 C 330 258, 340 208, 396 208" marker-end="url(#arr)"/>
  <!-- plan to skeleton -->
  <path class="plan" d="M 288 142 C 330 142, 330 50, 392 50"/>
  <text class="muted small" x="300" y="128">the plan becomes the skeleton</text>

  <text class="muted small" x="340" y="352" text-anchor="middle">the earliest of the three notes is printed last; the date of a fragment is invisible from its WM number</text>
  <text class="muted small" x="340" y="368" text-anchor="middle">blue: a fragment and where the editors filed it · amber: the four-title plan and the book built on it</text>
</svg>

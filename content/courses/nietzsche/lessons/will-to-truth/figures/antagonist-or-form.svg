<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .box { fill: none; stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.3; }
    .box-a { fill: none; stroke: #e2903a; stroke-width: 2; }
    .box-b { fill: none; stroke: #4c8dd6; stroke-width: 1.8; }
    .region { fill: none; stroke: #4c8dd6; stroke-width: 1.6; stroke-dasharray: 6 4; }
    .ghost { fill: none; stroke: currentColor; stroke-opacity: 0.35; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .arrow { stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.4; fill: none; }
    .strike { stroke: #e2903a; stroke-width: 2.4; }
    .rule { stroke: currentColor; stroke-opacity: 0.3; stroke-width: 1; }
    .div { stroke: currentColor; stroke-opacity: 0.25; stroke-width: 1; stroke-dasharray: 2 3; }
  </style>

  <!-- left panel: the expected picture -->
  <text class="muted small" x="16" y="18">the expected picture (§1's question)</text>
  <rect class="box-b" x="16" y="40" width="104" height="56" rx="6"/>
  <text class="blue" x="68" y="62" text-anchor="middle">the ascetic</text>
  <text class="blue" x="68" y="78" text-anchor="middle">ideal</text>
  <path class="arrow" d="M126 68 L150 68"/>
  <path class="arrow" d="M145 63 L150 68 L145 73"/>
  <path class="arrow" d="M131 63 L126 68 L131 73"/>
  <text class="muted small" x="138" y="56" text-anchor="middle">against</text>
  <rect class="box" x="156" y="40" width="136" height="56" rx="6"/>
  <text class="label" x="224" y="62" text-anchor="middle">science, atheism,</text>
  <text class="label" x="224" y="78" text-anchor="middle">"free spirits"</text>
  <line class="strike" x1="20" y1="100" x2="288" y2="36"/>
  <text class="muted small" x="16" y="120">"where is the opposing will, in which</text>
  <text class="muted small" x="16" y="134">an opposing ideal expresses itself?"</text>
  <text class="muted small" x="16" y="154">two boxes, opposed: the antagonist</text>
  <text class="muted small" x="16" y="168">that "has already conquered" the</text>
  <text class="muted small" x="16" y="182">ideal (the trumpeters of §23)</text>

  <line class="div" x1="304" y1="14" x2="304" y2="360"/>

  <!-- right panel: §§23-25's picture -->
  <text class="muted small" x="320" y="18">§§23–25's picture: one region, and where science sits in it</text>
  <rect class="region" x="320" y="34" width="304" height="300" rx="8"/>
  <text class="blue" x="472" y="54" text-anchor="middle">the ascetic ideal</text>

  <!-- outworks, struck by science -->
  <rect class="ghost" x="336" y="70" width="272" height="66" rx="5"/>
  <text class="muted small" x="472" y="88" text-anchor="middle">outworks (Aussenwerke): God, the beyond,</text>
  <text class="muted small" x="472" y="102" text-anchor="middle">theological astronomy, "soul", "freedom",</text>
  <text class="muted small" x="472" y="116" text-anchor="middle">"immortality"</text>
  <text class="muted small" x="472" y="130" text-anchor="middle">stripped by science (§25)</text>

  <!-- core -->
  <rect class="box-a" x="336" y="152" width="272" height="60" rx="5"/>
  <text class="amber" x="472" y="174" text-anchor="middle">the core: truth's unconditional value</text>
  <text class="label small" x="472" y="190" text-anchor="middle">"a metaphysical value, a value in itself of truth,</text>
  <text class="label small" x="472" y="204" text-anchor="middle">warranted in that ideal alone" (§24)</text>

  <!-- science standing on the core -->
  <path class="arrow" d="M472 246 L472 218"/>
  <path class="arrow" d="M467 223 L472 218 L477 223"/>
  <text class="muted small" x="484" y="236">rests on</text>
  <rect class="box" x="336" y="250" width="272" height="66" rx="5"/>
  <text class="label" x="472" y="270" text-anchor="middle">science, where it is still passion:</text>
  <text class="label small" x="472" y="286" text-anchor="middle">"not the opposite of that ascetic ideal, rather</text>
  <text class="label small" x="472" y="300" text-anchor="middle">its latest and noblest form itself" (§23)</text>

  <path class="rule" d="M16 356 L624 356"/>
  <text class="label small" x="320" y="376" text-anchor="middle">science strips the ideal's outworks and stands on its core: the two "stand on one ground" (§25)</text>
  <text class="muted small" x="320" y="391" text-anchor="middle">the reversal: the antagonist §1 asked for turns out to be the ideal's most spiritualized form</text>
</svg>

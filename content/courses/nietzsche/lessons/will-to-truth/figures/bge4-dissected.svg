<svg viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .box { fill: none; stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.3; }
    .box-a { fill: none; stroke: #e2903a; stroke-width: 2; }
    .box-b { fill: none; stroke: #4c8dd6; stroke-width: 1.8; }
    .gap { fill: none; stroke: #e2903a; stroke-width: 1.6; stroke-dasharray: 5 4; }
    .arrow { stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.3; fill: none; }
    .under { stroke: #e2903a; stroke-width: 2.2; }
    .rule { stroke: currentColor; stroke-opacity: 0.3; stroke-width: 1; }
  </style>
  <text class="muted small" x="16" y="18">BGE 4, dissected: the claim, the standard it substitutes, and the premise the standard rests on</text>

  <!-- the claim -->
  <rect class="box" x="16" y="30" width="608" height="46" rx="6"/>
  <text class="label" x="320" y="50" text-anchor="middle">"We do not consider the falsity of a judgment as itself an objection to a judgment"</text>
  <text class="muted small" x="320" y="66" text-anchor="middle">the negative claim: falsity does not, by itself, devalue</text>

  <path class="arrow" d="M320 76 L320 92"/>
  <path class="arrow" d="M315 87 L320 92 L325 87"/>
  <text class="muted small" x="330" y="88">the question is instead</text>

  <!-- the standard -->
  <rect class="box-a" x="16" y="96" width="608" height="60" rx="6"/>
  <text class="label" x="320" y="118" text-anchor="middle">"how far the judgment promotes and preserves life, how well it preserves,</text>
  <text class="label" x="320" y="136" text-anchor="middle">and perhaps even cultivates, the type"</text>
  <line class="under" x1="120" y1="142" x2="520" y2="142"/>
  <text class="amber small" x="320" y="154" text-anchor="middle">the substituted standard: life-value, indexed to a type</text>

  <path class="arrow" d="M320 156 L320 172"/>
  <path class="arrow" d="M315 167 L320 172 L325 167"/>
  <text class="muted small" x="330" y="168">which presupposes</text>

  <!-- the premise -->
  <rect class="gap" x="16" y="176" width="608" height="52" rx="6"/>
  <text x="320" y="197" fill="#e2903a" font-weight="600" text-anchor="middle">P?  life-promotion is the standard by which judgments, and values, are to be ranked</text>
  <text x="320" y="215" fill="#e2903a" text-anchor="middle">stated nowhere in BGE 1–4; the is–ought question lives here (value-creation-and-normativity)</text>

  <!-- two boxes below: what it says / does not say -->
  <rect class="box-b" x="16" y="248" width="296" height="80" rx="6"/>
  <text class="blue" x="164" y="268" text-anchor="middle">what BGE 4 says</text>
  <text class="label small" x="164" y="286" text-anchor="middle">"the falsest judgments (which include synthetic</text>
  <text class="label small" x="164" y="300" text-anchor="middle">judgments a priori) are the most indispensable";</text>
  <text class="label small" x="164" y="314" text-anchor="middle">"untruth as a condition of life"</text>

  <rect class="box" x="328" y="248" width="296" height="80" rx="6"/>
  <text class="label" x="476" y="268" text-anchor="middle" font-weight="600">what it does not say (Clark)</text>
  <text class="label small" x="476" y="286" text-anchor="middle">that all judgments are false. It says falsity does</text>
  <text class="label small" x="476" y="300" text-anchor="middle">not devalue; so "truths are illusions" loses its point,</text>
  <text class="label small" x="476" y="314" text-anchor="middle">and the falsification thesis is dropped, not restated</text>

  <path class="rule" d="M16 346 L624 346"/>
  <text class="label small" x="320" y="364" text-anchor="middle">the naturalist reading needs P? to make "why not rather untruth?" (BGE 1) a question with an answer;</text>
  <text class="muted small" x="320" y="378" text-anchor="middle">Clark's reading needs the right-hand box, so that BGE 4 bounds the value of truth without denying truth</text>
</svg>

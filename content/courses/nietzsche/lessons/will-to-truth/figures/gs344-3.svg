<svg viewBox="0 0 640 468" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .box { fill: none; stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.2; }
    .now { fill: none; stroke: #e2903a; stroke-width: 2; }
    .concl { fill: none; stroke: #4c8dd6; stroke-width: 2.4; }
    .ghost { fill: none; stroke: currentColor; stroke-opacity: 0.25; stroke-width: 1; stroke-dasharray: 4 3; }
    .arrow { stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.2; fill: none; }
    .tag { font-weight: 600; }
    .amber { fill: #e2903a; font-weight: 600; }
  </style>
  <text class="muted small" x="16" y="18">Frame 3 of 6: GS 344, "To what extent we too are still pious" — step 3</text>
  <rect class="box" x="24" y="34" width="392" height="60" rx="5"/>
  <text class="label tag" x="36" y="54">P1</text>
  <text class="label small" x="64" y="54">Science admits no convictions: only hypotheses,</text>
  <text class="label small" x="64" y="69">provisional standpoints, regulative fictions,</text>
  <text class="label small" x="64" y="84">all kept "under the police of mistrust"</text>
  <text class="muted small" x="430" y="54">Ueberzeugungen … kein Bürgerrecht;</text>
  <text class="muted small" x="430" y="69">Polizei des Misstrauens</text>
  <path class="arrow" d="M220 94 L220 102"/>
  <rect class="box" x="24" y="102" width="392" height="60" rx="5"/>
  <text class="label tag" x="36" y="122">P2</text>
  <text class="label small" x="64" y="122">But the rule "no convictions" is itself a conviction,</text>
  <text class="label small" x="64" y="137">commanding and unconditional: "nothing is more</text>
  <text class="label small" x="64" y="152">needful than truth"; science too rests on a faith</text>
  <text class="muted small" x="430" y="122">eine so gebieterische und</text>
  <text class="muted small" x="430" y="137">bedingungslose Ueberzeugung;</text>
  <text class="muted small" x="430" y="152">„voraussetzungslose“ Wissenschaft</text>
  <path class="arrow" d="M220 162 L220 170"/>
  <rect class="now" x="24" y="170" width="392" height="60" rx="5"/>
  <text class="amber" x="36" y="190">P3</text>
  <text class="label small" x="64" y="190">That conviction cannot have come from utility:</text>
  <text class="label small" x="64" y="205">truth and untruth have both proved useful,</text>
  <text class="label small" x="64" y="220">continually, "as is the case"</text>
  <text class="muted small" x="430" y="190">Wahrheit und Unwahrheit …</text>
  <text class="muted small" x="430" y="205">beide fortwährend als nützlich</text>
  <rect class="ghost" x="24" y="238" width="392" height="60" rx="5"/>
  <text class="muted small" x="36" y="258" opacity="0.5">P4</text>
  <rect class="ghost" x="24" y="306" width="392" height="60" rx="5"/>
  <text class="muted small" x="36" y="326" opacity="0.5">P5</text>
  <rect class="ghost" x="24" y="374" width="392" height="60" rx="5"/>
  <text class="muted small" x="36" y="394" opacity="0.5">C</text>
  <text class="muted small" x="320" y="456" text-anchor="middle">what the chain has established so far: it is not a utility calculation</text>
</svg>
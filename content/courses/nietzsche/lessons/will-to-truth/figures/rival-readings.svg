<svg viewBox="0 0 640 384" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .head { fill: currentColor; font-weight: 600; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .col { fill: none; stroke: currentColor; stroke-opacity: 0.35; stroke-width: 1; }
    .band-b { fill: none; stroke: #4c8dd6; stroke-width: 1.4; stroke-dasharray: 3 3; }
    .band-a { fill: none; stroke: #e2903a; stroke-width: 1.8; }
    .rule { stroke: currentColor; stroke-opacity: 0.3; stroke-width: 1; }
  </style>
  <text class="muted small" x="16" y="18">Three readings of GM III:24–27, each at its strongest, beside the course's line</text>

  <!-- column frames -->
  <rect class="col" x="16" y="28" width="196" height="308" rx="6"/>
  <rect class="col" x="222" y="28" width="196" height="308" rx="6"/>
  <rect class="col" x="428" y="28" width="196" height="308" rx="6"/>
  <text class="head" x="114" y="46" text-anchor="middle">Kaufmann (1950), ch. 12</text>
  <text class="head" x="320" y="46" text-anchor="middle">Nehamas (1985), ch. 4</text>
  <text class="head" x="526" y="46" text-anchor="middle">Clark and Dudrick (2012)</text>

  <!-- row 1: what "still pious" is -->
  <text class="muted small" x="24" y="66">reads "we too are still pious" as</text>
  <text class="label small" x="24" y="82">Nietzsche's own creed: the will to</text>
  <text class="label small" x="24" y="95">truth is "Nietzsche's faith", the</text>
  <text class="label small" x="24" y="108">centre of his positive commitment</text>
  <text class="label small" x="230" y="82">a commitment the critique cannot</text>
  <text class="label small" x="230" y="95">shed: any view "is inevitably offered</text>
  <text class="label small" x="230" y="108">in the conviction that it is true",</text>
  <text class="label small" x="230" y="121">so asceticism's dogmatism stands</text>
  <text class="label small" x="436" y="82">one of two forces: the will to truth</text>
  <text class="label small" x="436" y="95">(BGE 1) pushes the true world</text>
  <text class="label small" x="436" y="108">away, the will to value (BGE 2)</text>
  <text class="label small" x="436" y="121">draws it back; neither is disabled</text>
  <line class="rule" x1="24" y1="132" x2="616" y2="132"/>

  <!-- row 2: textual card -->
  <rect class="band-b" x="20" y="140" width="600" height="78" rx="4"/>
  <text class="blue small" x="24" y="154">its strongest textual card</text>
  <text class="label small" x="24" y="170">A 54–55: "convictions are prisons",</text>
  <text class="label small" x="24" y="183">"the courage for an attack on</text>
  <text class="label small" x="24" y="196">one's convictions"</text>
  <text class="label small" x="230" y="170">BGE 4, "untruth as a condition of</text>
  <text class="label small" x="230" y="183">life"; the notebook line "facts are</text>
  <text class="label small" x="230" y="196">precisely what there is not"</text>
  <text class="label small" x="436" y="170">BGE Preface, "the magnificent</text>
  <text class="label small" x="436" y="183">tension of the spirit"; GS Preface</text>
  <text class="label small" x="436" y="196">4, truth does not "remain truth"</text>
  <text class="label small" x="436" y="209">once the veils are withdrawn</text>

  <!-- row 3: where it parts from the course's line -->
  <rect class="band-a" x="20" y="226" width="600" height="102" rx="4"/>
  <text class="amber small" x="24" y="240">where it parts from the course's line</text>
  <text class="label small" x="24" y="256">keeps the faith along with the</text>
  <text class="label small" x="24" y="269">commitment; Clark: Nietzsche</text>
  <text class="label small" x="24" y="282">objects to "the whole ideal of</text>
  <text class="label small" x="24" y="295">self-denial" the faith expresses</text>
  <text class="label small" x="230" y="256">dogmatism is not what makes the</text>
  <text class="label small" x="230" y="269">ideal ascetic; self-denial is, and</text>
  <text class="label small" x="230" y="282">opposing it means commending a</text>
  <text class="label small" x="230" y="295">counter-ideal, which Nehamas's</text>
  <text class="label small" x="230" y="308">Nietzsche refuses to do</text>
  <text class="label small" x="436" y="256">methodological naturalism is not</text>
  <text class="label small" x="436" y="269">Nietzsche's considered view: as a</text>
  <text class="label small" x="436" y="282">complete account it "cannot</text>
  <text class="label small" x="436" y="295">accommodate values" and "is not,</text>
  <text class="label small" x="436" y="308">in fact, true"</text>

  <path class="rule" d="M16 348 L624 348"/>
  <text class="label small" x="320" y="364" text-anchor="middle">the course's line (Clark 1990): the faith in truth's overriding value is abandoned, the commitment to truth kept,</text>
  <text class="label small" x="320" y="377" text-anchor="middle">and a counter-ideal is what the commitment must now serve</text>
</svg>

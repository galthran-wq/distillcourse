<svg viewBox="0 0 640 470" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .box { fill: none; stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.3; }
    .box-b { fill: none; stroke: #4c8dd6; stroke-width: 1.8; }
    .box-a { fill: none; stroke: #e2903a; stroke-width: 2; }
    .gap { fill: none; stroke: #e2903a; stroke-width: 1.6; stroke-dasharray: 5 4; }
    .filled { fill: none; stroke: #e2903a; stroke-width: 1.8; }
    .arrow { stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.3; fill: none; }
    .rule { stroke: currentColor; stroke-opacity: 0.3; stroke-width: 1; }
    .tag { font-weight: 600; }
  </style>

  <text class="muted small" x="16" y="18">the law of III:27: "all great things perish through themselves, by an act of self-sublation (Selbstaufhebung)"</text>

  <!-- chain, left column -->
  <rect class="box-b" x="16" y="34" width="360" height="52" rx="5"/>
  <text class="blue" x="28" y="54">1</text>
  <text class="label" x="48" y="54">Christianity as dogma: God, providence,</text>
  <text class="label" x="48" y="72">a moral world order, nature as proof of a good God</text>

  <path class="arrow" d="M196 86 L196 98"/>
  <path class="arrow" d="M191 93 L196 98 L201 93"/>
  <text class="muted small" x="206" y="96">breeds</text>

  <rect class="box" x="16" y="100" width="360" height="52" rx="5"/>
  <text class="label tag" x="28" y="120">2</text>
  <text class="label" x="48" y="120">a virtue: truthfulness (Wahrhaftigkeit), "the</text>
  <text class="label" x="48" y="138">confessor's subtlety of the Christian conscience"</text>

  <path class="arrow" d="M196 152 L196 164"/>
  <path class="arrow" d="M191 159 L196 164 L201 159"/>
  <text class="muted small" x="206" y="162">taken ever more strictly</text>

  <rect class="box" x="16" y="166" width="360" height="52" rx="5"/>
  <text class="label tag" x="28" y="186">3</text>
  <text class="label" x="48" y="186">"translated and sublimated into scientific conscience,</text>
  <text class="label" x="48" y="204">into intellectual cleanliness at any price"</text>

  <path class="arrow" d="M196 218 L196 230"/>
  <path class="arrow" d="M191 225 L196 230 L201 225"/>
  <text class="muted small" x="206" y="228">forbids itself</text>

  <rect class="box-a" x="16" y="232" width="360" height="52" rx="5"/>
  <text class="amber" x="28" y="252">4</text>
  <text class="label" x="48" y="252">"the lie in the belief in God": Christianity as</text>
  <text class="label" x="48" y="270">dogma perishes of its own morality (§27, GS 357)</text>

  <path class="arrow" d="M196 284 L196 296"/>
  <path class="arrow" d="M191 291 L196 296 L201 291"/>
  <text class="muted small" x="206" y="294">one conclusion further</text>

  <rect class="box" x="16" y="298" width="360" height="52" rx="5"/>
  <text class="label tag" x="28" y="318">5</text>
  <text class="label" x="48" y="318">truthfulness turns on itself: "what is the</text>
  <text class="label" x="48" y="336">meaning of all will to truth?" (§27)</text>

  <path class="arrow" d="M196 350 L196 362"/>
  <path class="arrow" d="M191 357 L196 362 L201 357"/>
  <text class="muted small" x="206" y="360">predicted, not reported</text>

  <rect class="gap" x="16" y="364" width="360" height="52" rx="5"/>
  <text x="28" y="384" fill="#e2903a" font-weight="600">6</text>
  <text x="48" y="384" fill="#e2903a">Christianity as morality perishes: "the next two</text>
  <text x="48" y="402" fill="#e2903a">centuries", "a spectacle in a hundred acts"</text>

  <!-- right: the madman lesson's gap, now filled -->
  <text class="muted small" x="400" y="54">the GS 125 reconstruction:</text>
  <rect class="box" x="400" y="62" width="224" height="46" rx="5"/>
  <text class="label small" x="412" y="80">P2  the belief in God has collapsed</text>
  <text class="muted small" x="412" y="96">"we have killed him": agents, no cause</text>

  <rect class="filled" x="400" y="118" width="228" height="64" rx="5"/>
  <text class="amber small" x="412" y="136">P2a  the cause, now stated:</text>
  <text class="label small" x="412" y="152">the belief was killed by a virtue it bred:</text>
  <text class="label small" x="412" y="166">truthfulness, turned on its own origin</text>
  <text class="muted small" x="412" y="178">= steps 2 to 4 of the chain</text>

  <path class="arrow" d="M400 250 L384 250"/>
  <path class="arrow" d="M389 245 L384 250 L389 255"/>
  <text class="muted small" x="404" y="246">step 4 is the</text>
  <text class="muted small" x="404" y="260">madman's "deed"</text>

  <text class="muted small" x="400" y="312">what closes the loop:</text>
  <text class="label small" x="400" y="328">the dependence runs both ways.</text>
  <text class="label small" x="400" y="342">The values rested on the belief (P1);</text>
  <text class="label small" x="400" y="356">one of the values removed the belief</text>
  <text class="label small" x="400" y="370">(P2a); and the same value is now</text>
  <text class="label small" x="400" y="384">asked what it is worth (step 5).</text>

  <path class="rule" d="M16 430 L624 430"/>
  <text class="label small" x="320" y="448" text-anchor="middle">"patere legem, quam ipse tulisti": the lawgiver submits to the law he made; the will to truth included</text>
  <text class="muted small" x="320" y="462" text-anchor="middle">steps 1–4 are history (GS 357, III:27); steps 5–6 are a dated prediction</text>
</svg>

<svg viewBox="0 0 640 396" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .bow { stroke: currentColor; stroke-opacity: 0.7; stroke-width: 3; fill: none; stroke-linecap: round; }
    .string { stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.4; fill: none; }
    .shaft { stroke: currentColor; stroke-opacity: 0.7; stroke-width: 2; fill: none; }
    .push { stroke: #e2903a; stroke-width: 2.2; fill: none; }
    .pull { stroke: #4c8dd6; stroke-width: 2.2; fill: none; }
    .hand-a { fill: #e2903a; }
    .hand-b { fill: #4c8dd6; }
    .box-a { fill: none; stroke: #e2903a; stroke-width: 1.8; }
    .box-b { fill: none; stroke: #4c8dd6; stroke-width: 1.8; }
    .rule { stroke: currentColor; stroke-opacity: 0.3; stroke-width: 1; }
  </style>
  <text class="muted small" x="16" y="18">Socrates' archer (Republic IV, 439b–c), as Clark and Dudrick use it for BGE's preface</text>

  <!-- the bow: a drawn arc, string pulled back to the right -->
  <path class="bow" d="M 250 44 Q 170 130 250 216"/>
  <path class="string" d="M 250 44 L 400 130 L 250 216"/>
  <path class="shaft" d="M 400 130 L 200 130"/>
  <path class="shaft" d="M 208 124 L 198 130 L 208 136"/>
  <text class="muted small" x="300" y="118" text-anchor="middle">the arrow: "the most distant goals"</text>

  <!-- the pushing hand (left, amber) -->
  <circle class="hand-a" cx="222" cy="130" r="7"/>
  <path class="push" d="M 150 130 L 208 130"/>
  <path class="push" d="M 200 124 L 208 130 L 200 136"/>
  <text class="amber" x="16" y="122">one hand pushes</text>
  <text class="amber" x="16" y="138">the bow away</text>

  <!-- the pulling hand (right, blue) -->
  <circle class="hand-b" cx="400" cy="130" r="7"/>
  <path class="pull" d="M 414 130 L 480 130"/>
  <path class="pull" d="M 472 124 L 480 130 L 472 136"/>
  <text class="blue" x="490" y="122">the other draws</text>
  <text class="blue" x="490" y="138">the string back</text>

  <!-- the two wills -->
  <rect class="box-a" x="16" y="236" width="296" height="70" rx="6"/>
  <text class="amber" x="164" y="256" text-anchor="middle">the will to truth (BGE 1)</text>
  <text class="label small" x="164" y="274" text-anchor="middle">believe only what corresponds to how the world is;</text>
  <text class="label small" x="164" y="288" text-anchor="middle">pushes dogmatism, "the true world", away</text>

  <rect class="box-b" x="328" y="236" width="296" height="70" rx="6"/>
  <text class="blue" x="476" y="256" text-anchor="middle">the will to value (BGE 2)</text>
  <text class="label small" x="476" y="274" text-anchor="middle">represent the world as it would be good for it to be;</text>
  <text class="label small" x="476" y="288" text-anchor="middle">draws "a world before which one can kneel" back</text>

  <text class="label small" x="320" y="326" text-anchor="middle">"the magnificent tension of the spirit" (BGE Preface): two forces in one soul, neither disabled</text>

  <path class="rule" d="M16 340 L624 340"/>
  <text class="label small" x="320" y="358" text-anchor="middle">on this reading "the will to truth requires a critique" is the tension kept under both hands,</text>
  <text class="label small" x="320" y="372" text-anchor="middle">not one force abolished: a naturalism that satisfies the first will alone is, for them, not simply true</text>
  <text class="muted small" x="320" y="388" text-anchor="middle">Clark and Dudrick, The Soul of Nietzsche's Beyond Good and Evil, chs. 1–2 and 5</text>
</svg>

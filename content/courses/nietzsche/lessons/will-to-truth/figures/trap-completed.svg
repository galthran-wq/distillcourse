<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .path { stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.4; fill: none; }
    .tick { stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.2; }
    .reader { fill: #e2903a; }
    .box-a { fill: none; stroke: #e2903a; stroke-width: 2; }
    .box-b { fill: none; stroke: #4c8dd6; stroke-width: 1.8; }
    .box { fill: none; stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.3; }
    .ghost { fill: none; stroke: currentColor; stroke-opacity: 0.35; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .region { fill: none; stroke: #4c8dd6; stroke-width: 1.6; stroke-dasharray: 6 4; }
    .rule { stroke: currentColor; stroke-opacity: 0.3; stroke-width: 1; }
    .amber-n { fill: #e2903a; }
    .move { stroke: #e2903a; stroke-width: 1.4; fill: none; stroke-dasharray: 3 3; }
  </style>
  <text class="muted small" x="16" y="18">the reading path of the Third Treatise, with its three revisions of what the reader believes</text>

  <path class="path" d="M 40 50 L 600 50"/>
  <line class="tick" x1="60" y1="44" x2="60" y2="56"/>
  <text class="muted small" x="60" y="70" text-anchor="middle">§1</text>
  <line class="tick" x1="180" y1="44" x2="180" y2="56"/>
  <text class="muted small" x="180" y="70" text-anchor="middle">§8</text>
  <line class="tick" x1="300" y1="44" x2="300" y2="56"/>
  <text class="muted small" x="300" y="70" text-anchor="middle">§11</text>
  <line class="tick" x1="450" y1="44" x2="450" y2="56"/>
  <text class="muted small" x="450" y="70" text-anchor="middle">§23</text>
  <line class="tick" x1="530" y1="44" x2="530" y2="56"/>
  <text class="muted small" x="530" y="70" text-anchor="middle">§27</text>
  <line class="tick" x1="590" y1="44" x2="590" y2="56"/>
  <text class="muted small" x="590" y="70" text-anchor="middle">§28</text>
  <circle class="reader" cx="530" cy="50" r="5"/>
  <text class="amber small" x="530" y="36" text-anchor="middle">reader</text>

  <!-- the priest's region -->
  <rect class="region" x="298" y="90" width="326" height="240" rx="8"/>
  <text class="blue" x="462" y="108" text-anchor="middle">the priest's ideal: life against life</text>

  <rect class="box-b" x="306" y="118" width="312" height="40" rx="6"/>
  <text class="label small" x="462" y="135" text-anchor="middle">the ascetic priest (§§11–22): "you yourself are to blame"</text>
  <text class="muted small" x="462" y="150" text-anchor="middle">the ideal as the physician's instrument</text>

  <!-- revision 1: the philosopher moves in at §10 -->
  <rect class="ghost" x="16" y="166" width="250" height="44" rx="6"/>
  <text class="muted small" x="141" y="184" text-anchor="middle">§8: the philosopher's "healthy" asceticism</text>
  <text class="muted small" x="141" y="199" text-anchor="middle">approved by the reader; withdrawn by §10</text>
  <path class="move" d="M266 188 L306 188"/>
  <rect class="box" x="306" y="166" width="312" height="44" rx="6"/>
  <text class="label small" x="462" y="184" text-anchor="middle">revision 1 (§10): the philosopher's asceticism is the</text>
  <text class="label small" x="462" y="199" text-anchor="middle">priest's, "an ascetic self-misunderstanding"</text>

  <!-- revision 2: science moves in at §23 -->
  <rect class="ghost" x="16" y="218" width="250" height="44" rx="6"/>
  <text class="muted small" x="141" y="236" text-anchor="middle">§1's expected antagonist: science, atheism,</text>
  <text class="muted small" x="141" y="251" text-anchor="middle">the "free spirits"; withdrawn by §§23–24</text>
  <path class="move" d="M266 240 L306 240"/>
  <rect class="box" x="306" y="218" width="312" height="44" rx="6"/>
  <text class="label small" x="462" y="236" text-anchor="middle">revision 2 (§§23–25): science and atheism, "the ideal's</text>
  <text class="label small" x="462" y="251" text-anchor="middle">latest and noblest form"; standing on its core</text>

  <!-- revision 3: the reader's own will to truth -->
  <rect class="ghost" x="16" y="270" width="250" height="44" rx="6"/>
  <text class="muted small" x="141" y="288" text-anchor="middle">the reader, reading a critique of the ideal</text>
  <text class="muted small" x="141" y="303" text-anchor="middle">from outside it; withdrawn by §§24, 27</text>
  <path class="move" d="M266 292 L306 292"/>
  <rect class="box-a" x="306" y="270" width="312" height="44" rx="6"/>
  <text class="amber-n small" x="462" y="288" text-anchor="middle">revision 3 (§§24, 27): the reader's own will to truth,</text>
  <text class="amber-n small" x="462" y="303" text-anchor="middle">"we knowers" reading the Genealogy: "the ideal's kernel"</text>

  <path class="rule" d="M16 346 L624 346"/>
  <text class="label small" x="320" y="366" text-anchor="middle">three times the treatise moves a box the reader had placed outside the region inside it;</text>
  <text class="label small" x="320" y="381" text-anchor="middle">the third box is the reader. "A beginning calculated to mislead" (EH), run to its end.</text>
</svg>

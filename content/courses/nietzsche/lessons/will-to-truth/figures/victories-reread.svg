<svg viewBox="0 0 640 306" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .small { font-size: 10.5px; }
    .head { fill: currentColor; font-weight: 600; }
    .amber { fill: #e2903a; font-weight: 600; }
    .blue { fill: #4c8dd6; font-weight: 600; }
    .ghost { fill: none; stroke: currentColor; stroke-opacity: 0.35; stroke-width: 1; stroke-dasharray: 3 3; }
    .strike { stroke: #e2903a; stroke-width: 1.8; }
    .flow { stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.2; fill: none; }
    .core { fill: none; stroke: #4c8dd6; stroke-width: 2; }
  </style>
  <text class="muted small" x="16" y="18">§25: three victories of science, each taken as a defeat of the ideal, reread</text>

  <!-- column headers -->
  <text class="head" x="114" y="44" text-anchor="middle">Copernicus</text>
  <text class="head" x="320" y="44" text-anchor="middle">Kant</text>
  <text class="head" x="526" y="44" text-anchor="middle">the self-critique of knowledge</text>

  <!-- struck outworks -->
  <rect class="ghost" x="24" y="56" width="180" height="44" rx="5"/>
  <text class="label small" x="114" y="74" text-anchor="middle">theological astronomy:</text>
  <text class="label small" x="114" y="88" text-anchor="middle">man at the centre of things</text>
  <line class="strike" x1="34" y1="78" x2="194" y2="78"/>

  <rect class="ghost" x="230" y="56" width="180" height="44" rx="5"/>
  <text class="label small" x="320" y="74" text-anchor="middle">"theological conceptual</text>
  <text class="label small" x="320" y="88" text-anchor="middle">dogmatism": God, soul, freedom</text>
  <line class="strike" x1="240" y1="78" x2="400" y2="78"/>

  <rect class="ghost" x="436" y="56" width="180" height="44" rx="5"/>
  <text class="label small" x="526" y="74" text-anchor="middle">man's "previous respect</text>
  <text class="label small" x="526" y="88" text-anchor="middle">for himself"</text>
  <line class="strike" x1="446" y1="78" x2="606" y2="78"/>

  <text class="amber small" x="114" y="116" text-anchor="middle">outwork stripped</text>
  <text class="amber small" x="320" y="116" text-anchor="middle">outwork stripped</text>
  <text class="amber small" x="526" y="116" text-anchor="middle">outwork stripped</text>

  <!-- what followed -->
  <path class="flow" d="M114 122 L114 138"/>
  <path class="flow" d="M110 133 L114 138 L118 133"/>
  <path class="flow" d="M320 122 L320 138"/>
  <path class="flow" d="M316 133 L320 138 L324 133"/>
  <path class="flow" d="M526 122 L526 138"/>
  <path class="flow" d="M522 133 L526 138 L530 133"/>

  <text class="label small" x="114" y="154" text-anchor="middle">man rolls "faster and faster</text>
  <text class="label small" x="114" y="167" text-anchor="middle">away from the centre":</text>
  <text class="label small" x="114" y="180" text-anchor="middle">"into nothingness?"</text>
  <text class="label small" x="320" y="154" text-anchor="middle">the transcendentalists shown</text>
  <text class="label small" x="320" y="167" text-anchor="middle">"the secret path"; the agnostics</text>
  <text class="label small" x="320" y="180" text-anchor="middle">"worship the question mark itself"</text>
  <text class="label small" x="526" y="154" text-anchor="middle">"all science, the natural as well</text>
  <text class="label small" x="526" y="167" text-anchor="middle">as the unnatural" set on talking</text>
  <text class="label small" x="526" y="180" text-anchor="middle">man out of his self-respect</text>

  <!-- the core, untouched under all three -->
  <path class="flow" d="M114 188 L114 204"/>
  <path class="flow" d="M320 188 L320 204"/>
  <path class="flow" d="M526 188 L526 204"/>
  <rect class="core" x="24" y="208" width="592" height="58" rx="6"/>
  <text class="blue" x="320" y="226" text-anchor="middle">the core, untouched: the faith in the "inestimability, the uncriticizability of truth"</text>
  <text class="label small" x="320" y="242" text-anchor="middle">on which science and the ideal "stand on one ground", and which</text>
  <text class="label small" x="320" y="256" text-anchor="middle">each victory leaves "stronger: more elusive, more spiritual, more insidious"</text>

  <text class="muted small" x="320" y="290" text-anchor="middle">each victory removes what was exoteric in the ideal and sets "the life in it free again" (§25)</text>
</svg>

  - id: debtandguilt-caravaggio-isaac-1603
    capture: research/images/debtandguilt-caravaggio-isaac-1603.jpg
    shows: "Abraham forcing Isaac's head sideways onto the sacrificial stone with one hand while the other holds a short knife at his throat; the boy naked to the waist, pinned, mouth open; an angel at the left gripping Abraham's knife wrist and pointing to the ram whose head emerges from the dark at the right; a lit valley with houses and a hilltop church beyond"
    source: "Michelangelo Merisi da Caravaggio (1571–1610), 'Sacrificio di Isacco', c. 1603, oil on canvas, 104 × 135 cm, Galleria degli Uffizi, Florence (accession no. 4659)"
    located: "Wikimedia Commons File:Sacrifice_of_Isaac-Caravaggio_(Uffizi).jpg — the Commons original is 7972 × 6142 (6.9 MB, over the check budget), captured through Special:FilePath, which served 3840 × 2959"
    url: "https://commons.wikimedia.org/wiki/File:Sacrifice_of_Isaac-Caravaggio_(Uffizi).jpg (captured via https://commons.wikimedia.org/wiki/Special:FilePath/Sacrifice%20of%20Isaac-Caravaggio%20(Uffizi).jpg?width=2400)"
    license: "Public domain (Commons: PD-old-100-expired and PD-Art — Caravaggio died 1610, published before 1 January 1931 in the US, and a faithful photographic reproduction of a two-dimensional public-domain work carries no new copyright)"
    quality: "stored at 2400x1849, 1.1 MB; whole canvas, no frame, no scanner margin, no watermark. At 100% the corners show bare canvas weave and brushwork, so this is a real high-resolution photograph and not an upscale"
    note: "Hunted for debt-and-guilt (II:19, 'the notorious sacrifice of the first-born … blood, human blood in any case') — the pool held no sacrifice scene and images.yaml had no entry for this lesson at all. Shipped uncropped as that lesson's first-born-sacrifice.jpg at 1400x1079, floated right. Rejected: File:Caravaggio - Sacrificio di Isacco - Google Art Project.jpg (3554x2756, credited to Google Arts & Culture, also PD) reproduces the same canvas but is much darker and warmer — the right-hand landscape sinks to near-black and Isaac's face loses its modelling, which is what must survive a 380px float; two smaller Commons copies (2024x1580, 1284x1000); and Yair Haklai's in-gallery photograph, CC BY-SA 4.0 and shot at an angle. Crops were tried and abandoned: trimming the dark top band clips Abraham's crown, a tighter crop on the act leaves a severed fragment of the ram at the right edge, and cutting the angel out would make the painting say 'the father kills the son' when it says 'the father is stopped'."

  - id: debtandguilt-grunewald-isenheim-crucifixion-1515
    capture: research/images/debtandguilt-grunewald-isenheim-crucifixion-1515.jpg
    shows: "The crucified body hanging by its own weight in a black landscape — the crossbeam bent down under it, the arms wrenched out of line, the fingers clawed open above the nails, the skin grey-green and pocked with the stubs of scourge and thorns, the head dropped on the chest, blood at the side wound, the feet twisted on one nail; the fainting Mary with John and the kneeling Magdalene at the left, John the Baptist pointing at the body with the lamb and chalice at the right"
    source: "Matthias Grünewald (c. 1475/80–1528), 'Kreuzigung Christi', central panel of the closed Isenheim Altarpiece, 1512–1516, oil on panel, 269 × 307 cm, Musée Unterlinden, Colmar; reproduction from The Yorck Project, 10.000 Meisterwerke der Malerei"
    located: "Wikimedia Commons File:Mathis_Gothart_Grünewald_022.jpg — the central panel alone, without the Sebastian and Anthony wings or the Lamentation predella; hunted for debt-and-guilt, where the pool held no entry for the lesson at all"
    url: "https://commons.wikimedia.org/wiki/File:Mathis_Gothart_Gr%C3%BCnewald_022.jpg (full-res https://upload.wikimedia.org/wikipedia/commons/4/4f/Mathis_Gothart_Gr%C3%BCnewald_022.jpg)"
    license: "Public domain (Commons: PD-old-100-expired, PD-Art, CC-PD-Mark; the Yorck Project compilation is stated to be in the public domain worldwide)"
    quality: "2400x2131 (from the native 3176x2820), sharp, no watermark, no scanner margin, no page furniture; the two top corners are pure white because the panel's silhouette is stepped, and the faint vertical line right of the upright is the join between the altarpiece's two boards"
    note: "Hunted for II:21's ceiling, 'the creditor sacrificing himself for his debtor'. Shipped whole as debt-and-guilt's creditor-pays-himself.jpg with background: light, which reads the white corners as the panel's stepped top. Rejected: File:Matthias_Grünewald_-_The_Crucifixion_-_WGA10723.jpg (1046x741 [sic 1046x902], PD — the same panel in its frame, too small for the lightbox copy); File:Isenheimer_Altar_(Colmar)_jm01221_(retouched).jpg (6403x4877, CC BY-SA 3.0) and File:Musée_Unterlinden_-_..._Déposition_(1512-1516)_(1).jpg (5100x3648, CC BY-SA 4.0) — good in-situ photographs, but a rectangular crop to the central panel drags in the frame, the wings and the gallery wall around the stepped top, and both are share-alike where a public-domain plate exists; File:Colmar_-_Unterlinden_Museum_-_..._Crucifixion_01.jpg (3014x4020, CC BY-SA 4.0) — a wide shot of the chapel with visitors."

  - id: asceticideal-parsifal-gralstempel-1882

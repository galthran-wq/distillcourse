# Index of the captured real-image pool for the Nietzsche course.
# Captures are already on disk under research/images/; nobody re-reads the
# source for them. Three candidates surfaced across the two reading passes,
# no duplicates. The two letter pages are 70 dpi page captures from
# Kaufmann's facsimile section: re-render the PDF page at 300 dpi for the
# finished crop (the PDF is staged in research/texts/). The 1882 title page is
# a 150 dpi bilevel capture from the Kaufmann Gay Science.
# Licence: the manuscripts and the 1882 title page are public domain
# (Nietzsche d. 1900; Schmeitzner 1882); the reproductions are from Princeton
# UP (2013) and Random House (1974) books still in copyright, so a lesson that
# ships one needs the human's sign-off or a public-domain scan of the same
# artifact (Goethe- und Schiller-Archiv, Weimar; Princeton University Library
# for the Hillebrand letter; any library copy of the 1882 first edition).

images:
  - id: nietzschephi-s4-fuchs-letter-1888-p2
    capture: research/images/nietzschephi-s4-fuchs-letter-1888-p2.png
    shows: >
      Page 2 of Nietzsche's letter to Carl Fuchs, 18 July 1888, in his own hand:
      'I have given mankind the deepest book it possesses, my Zarathustra'
      and the passage on having nothing left but 'buffooneries' to stay master
      of an intolerable tension; six months before the collapse
    source: "W. Kaufmann, Nietzsche: Philosopher, Psychologist, Antichrist, Princeton Classics 2013, 'Four Letters: Commentary and Facsimile Pages'"
    located: "PDF p. 508 (printed p. 481); transcription and commentary printed pp. 466-469"
    url: "research/texts/Nietzsche Philosopher, Psychologist, Antichrist (Walter Kaufmann, Alexander Nehamas).pdf, PDF page 508"
    license: "manuscript public domain; reproduction (c) Princeton University Press 2013 (teaching use needs sign-off)"
    quality: "431x650 at 70 dpi, clear black ink, legible; re-render at 300 dpi from the PDF"
    planned_for: [ecce-homo]

  - id: nietzschephi-s4-hillebrand-letter-1878-p1
    capture: research/images/nietzschephi-s4-hillebrand-letter-1878-p1.png
    shows: >
      First page of Nietzsche's April 1878 letter to Karl Hillebrand, with
      'European air and not nationalistic nitrogen' in his compressed,
      slanting hand
    source: "W. Kaufmann, Nietzsche: Philosopher, Psychologist, Antichrist, Princeton Classics 2013, 'Four Letters: Commentary and Facsimile Pages'"
    located: "PDF p. 497 (printed p. 470); transcription printed p. 460"
    url: "research/texts/Nietzsche Philosopher, Psychologist, Antichrist (Walter Kaufmann, Alexander Nehamas).pdf, PDF page 497"
    license: "manuscript held by Princeton University Library, public domain; reproduction (c) Princeton University Press 2013 (teaching use needs sign-off)"
    quality: "431x649 at 70 dpi, clear, legible; re-render at 300 dpi from the PDF"
    planned_for: [nietzsche-and-politics]

  - id: gs-title-page-1882
    capture: research/images/gs-title-page-1882.png
    shows: >
      Title page of the first edition of Die froehliche Wissenschaft
      (Chemnitz: Ernst Schmeitzner, 1882), with Emerson's epigraph in German
      ('Dem Dichter und Weisen sind alle Dinge befreundet und geweiht...') and
      the publisher's branches in Paris, Petersburg, Rome, New York, London.
      The 1887 title page (Leipzig: Fritzsch, with Nietzsche's own four-line
      verse and 'Songs of Prince Vogelfrei') is on the next PDF page and was
      not captured.
    source: "F. Nietzsche, The Gay Science, trans. W. Kaufmann, Vintage 1974, title-page reproductions after the Translator's Introduction"
    located: "PDF p. 44 (printed, unnumbered); 1887 title page PDF p. 46; Kaufmann's translations PDF p. 47"
    url: "research/texts/The Gay Science (Nietzsche, tr. Kaufmann, Vintage 1974).pdf, PDF page 44"
    license: "1882 title page public domain; reproduction in a Random House 1974 book (teaching use only; re-scan a library copy for publication)"
    quality: "672x1050 px at 150 dpi, bilevel and slightly coarse; text legible, the epigraph small; capture PDF p. 46 too if the 1882/1887 contrast is wanted"
    planned_for: [nietzsche-life-and-books]

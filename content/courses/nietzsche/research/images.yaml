    source: "Jacopo Robusti, called Tintoretto (1518–1594), 'Ritratto di Alvise Cornaro', c. 1560–65, oil on canvas, 113 × 85 cm, Galleria Palatina, Palazzo Pitti, Florence (inv. Palatina 1912 no. 83)"
    located: "Wikimedia Commons File:Tintoretto_-_ritratto_di_Alvise_Cornaro,_1188258,_Galleria_Palatina.jpg — the Uffizi catalogue photograph (idMetadato 1188258); hunted for doer-behind-the-deed, no pool candidate existed"
    url: "https://commons.wikimedia.org/wiki/File:Tintoretto_-_ritratto_di_Alvise_Cornaro,_1188258,_Galleria_Palatina.jpg (full-res https://upload.wikimedia.org/wikipedia/commons/0/08/Tintoretto_-_ritratto_di_Alvise_Cornaro%2C_1188258%2C_Galleria_Palatina.jpg)"
    license: "Public domain (Commons: PD-old-100-expired, PD-Art, CC-PD-Mark)"

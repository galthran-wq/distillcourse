    license: "Public domain (1883 publication)"
    quality: "455x700 — BELOW the 480px floor; sharp, light foxing at the edges, no watermark. A higher-resolution scan must be sought before it ships"
    note: "The subtitle 'für Alle und Keinen' (Del Caro: 'A Book for All and None') and 'In drei Theilen' are the artefact's evidence: the book's own self-presentation, and why Part Four is a separate object. Candidate for overman-staged or the corpus timeline only if a larger scan is found."

  - id: thusspoke-s2-versucher-footnote
    capture: research/images/thusspoke-s2-versucher-footnote.png
    shows: "Printed page 124 of the Del Caro/Pippin Zarathustra ('On the Vision and the Riddle', Third Part): the apostrophe to 'bold searchers, researchers' and Del Caro's footnote 1 on the Sucher/Versucher wordplay (searcher / tempter / experimenter) and Dionysus as Versucher-Gott"
    source: "Thus Spoke Zarathustra, trans. A. Del Caro, ed. R. Pippin (Cambridge Texts, 2006)"
    located: "PDF page 169 of research/texts/thusspoke.pdf = printed p. 124"
    url: "https://ia600605.us.archive.org/33/items/nietzsche-robert-pippin-adrian-del-caro-thus-spoke-zarathustra/Nietzsche%2C%20Robert%20Pippin%2C%20Adrian%20Del%20Caro%2CThus%20Spoke%20Zarathustra.pdf (PDF page 169)"
    license: "Publisher copyright (Cambridge University Press 2006) — teaching use"
    quality: "1078x1615 render at 180 dpi from a text-layer PDF; fully legible"
    note: "Apparatus, not illustration: the point is a translator's decision laid out as Del Caro set it (German terms interleaved with the gloss), which Kaufmann's Portable Nietzsche neither preserves nor flags. Planned in key-terms-in-translation as a `source:` crop of the footnote block; nowhere else."

  - id: thusspoke-s2-herrschsucht-footnote
    capture: research/images/thusspoke-s2-herrschsucht-footnote.png
    shows: "Printed page 232 of the Del Caro/Pippin Zarathustra ('On the Higher Man' §§1–3, Fourth Part): 'God is dead … now we want the overman to live', 'How shall human being be overcome?', and Del Caro's footnote 3 on rendering Herr as 'ruler' rather than 'lord'/'master', cross-referencing Herrschsucht ('lust to rule') in 'On the Three Evils'"
    source: "Thus Spoke Zarathustra, trans. A. Del Caro, ed. R. Pippin (Cambridge Texts, 2006)"
    located: "PDF page 277 of research/texts/thusspoke.pdf = printed p. 232"
    url: "https://ia600605.us.archive.org/33/items/nietzsche-robert-pippin-adrian-del-caro-thus-spoke-zarathustra/Nietzsche%2C%20Robert%20Pippin%2C%20Adrian%20Del%20Caro%2CThus%20Spoke%20Zarathustra.pdf (PDF page 277)"
    license: "Publisher copyright (Cambridge University Press 2006) — teaching use"
    quality: "1078x1615 render at 180 dpi; fully legible"
    note: "Companion apparatus page to the Versucher footnote; the same translation decision threaded through Parts Three and Four. Planned in key-terms-in-translation only; overman-staged quotes the lines from the text file, it does not show the page."


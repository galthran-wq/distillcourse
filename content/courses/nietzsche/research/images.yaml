  - id: digitalcriti-s2-nf1881-manuscript-page
    capture: research/images/digitalcriti-s2-nf1881-manuscript-page.jpg
    shows: "Archival photograph of the bound notebook M III 1 (Sils-Maria, spring–autumn 1881) opened at its first leaf: leather cover, both facing pages, colour chart and ruler in frame, Nietzsche's pencil-and-ink hand with later cataloguers' red numbers; 'Gaya Scienza' visible as a working title on the left page. This is the physical notebook the eKGWB transcribes as NF-1881,11 — the group containing 11[141], the first written record of eternal recurrence — though the exact folio of that fragment is not identified"
    source: "Digital Facsimile Edition (DFGA), Nietzsche Source; Klassik Stiftung Weimar, Goethe- und Schiller-Archiv"
    located: "DFGA book id 2167 (siglum M-III-1), facsimile id 65183, opening 1et2"
    url: "https://www.nietzschesource.org/DFGAapi/api/page/download/M-III-1,1et2 (browsable at https://www.nietzschesource.org/DFGA/M-III-1,1)"
    license: "Klassik Stiftung Weimar, Goethe- und Schiller-Archiv, 2016–2023 (copyright notice in the API response) — teaching use"
    quality: "Fitted to 2000x1052 (~340 KB) from a 12469x6560 archival original; handwriting legible, colour accurate, calibration chart in frame"
    note: "Passes visible-not-legible: the evidence is that the doctrine's first record is a pocket notebook in pencil, not a treatise. Planned in eternal-recurrence as 'the notebook', never 'the page' — the DFGA publishes no fragment-to-folio concordance yet."


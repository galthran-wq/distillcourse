  - id: asceticpriest-flagellants-tournai-1349
    capture: research/images/asceticpriest-flagellants-tournai-1349.jpg
    shows: "Eight hooded men walking in file across a plain olive ground, stripped to the waist above long white skirts and barefoot, dark pointed caps marked with red crosses, each holding a knotted scourge drawn back over his own shoulder; the last carries a small crucifix, and three men in ordinary coloured tunics and hose lead with a pole and a banner. Below the framed miniature the same plate prints four lines of the chronicle's Latin account of the day"
    source: "Pierart dou Tielt (fl. 1340–1360), miniature in Gilles li Muisis (Aegidius li Muisis), 'Tractatus quartus', Tournai c. 1353, fol. 16v, KBR / Royal Library of Belgium, Brussels, MS 13076-77; the capture is the colour plate in H. F. Helmolt (ed.), 'The History of the World', vol. VII (New York: Dodd, Mead, 1902), plate between pp. 178 and 179, printed by the Bibliographisches Institut, Leipzig, after Paul Fredericq, 'De secten der Geeselaars en der Dansers in de Nederlanden tijdens de 14de eeuw'"
    located: "Wikimedia Commons File:The_flagellants_at_Doornik_in_1349.jpg — the whole 1902 plate, captured through Special:FilePath at its native 4544 × 2972"
    url: "https://commons.wikimedia.org/wiki/File:The_flagellants_at_Doornik_in_1349.jpg (captured via https://commons.wikimedia.org/wiki/Special:FilePath/The%20flagellants%20at%20Doornik%20in%201349.jpg)"
    license: "Public domain (Commons file page: PD-US and PD-old, AttributionRequired false — the miniature is c. 1353, the plate reproducing it was published in 1902)"
    quality: "4544x2972, 4.2 MB, sharp colour lithography; no watermark, no scanner margin, no library stamp. The plate's own printed caption is not on the sheet — the descriptive line quoted on the file page comes from the volume, not from the image"
    note: "Hunted for ascetic-priest (III:20–21, the 'orgy of feeling' and the 'awful epileptic epidemics, the greatest known to history'); the pool held no flagellant, Tournai or 1349 entry, and the lesson's handoff comment named this miniature by shelfmark. Shipped as ascetic-priest's flagellants-tournai-1349.jpg, cropped to the framed miniature (3548 × 2000 at +432+300) and downscaled to 2400 × 1353, floated right. The Latin beneath the miniature — about two hundred men came from Bruges on 15 August 1349, and the townspeople, who had never seen such a thing, began to do it too — is cropped away in use but is why the artefact belongs beside III:21's epidemiology rather than only beside III:20's description. Rejected, all the same fol. 16v miniature: File:Flagellantengruppe.jpg (1401x797) and File:Darstellung_der_Geißlerzüge.jpg (848x1152), 19th-century uncoloured line tracings that read as a grey smudge at a 380px float; File:Doutielt2.jpg–Doutielt5.jpg, small crops all under 810px wide."

  - id: chladni-klangfiguren-taf-ix-1787
    capture: research/images/chladni-klangfiguren-taf-ix-1787.png
    shows: "Tab. IX of Chladni's Entdeckungen über die Theorie des Klanges — twenty numbered square plates (figs. 107–126), each engraved with the nodal lines a bowed, sand-strewn plate throws the sand into for one tone; a few carry point-letters. The plate is signed 'Capieux sculps. 1786' at the foot"
    source: "E. F. F. Chladni, Entdeckungen über die Theorie des Klanges (Leipzig: bey Weidmanns Erben und Reich, 1787), 'Mit eilf Kupfertafeln'; digitised by e-rara / ETH-Bibliothek Zürich, doi:10.3931/e-rara-4235"
    located: "Wikimedia Commons File:Ernst Florens Friedrich Chladni - Entdeckungen über die Theorie des Klanges - 1787.pdf, PDF page 97 (the plates run pp. 81–101, Tab. I–XI)"
    url: "https://commons.wikimedia.org/wiki/File:Ernst_Florens_Friedrich_Chladni_-_Entdeckungen_%C3%BCber_die_Theorie_des_Klanges_-_1787.pdf (file https://upload.wikimedia.org/wikipedia/commons/9/91/Ernst_Florens_Friedrich_Chladni_-_Entdeckungen_%C3%BCber_die_Theorie_des_Klanges_-_1787.pdf)"
    license: "Public domain (published 1787; Commons file page states Public domain, author Ernst Florens Friedrich Chladni)"
    quality: "1694x2090 render at 220 dpi; crisp engraved lines on cream paper, page rotated ~1.3° in the scan, no watermark (the library stamp is on the title page, not this plate)"
    note: "Hunted for perspectivism (no pool candidate existed). Used there, cropped to the upper-left three columns — nine figures — beside the Truth and Lie paragraph on Chladni and the deaf man. Tab. VIII (p. 95) and Tab. X (p. 99) hold further square-plate figures; Tab. I–VII are round and other-shaped plates."


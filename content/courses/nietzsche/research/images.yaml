  - id: promiseand-radern-hans-spiess-1513
    capture: research/images/promiseand-radern-hans-spiess-1513.jpg
    shows: "Public execution by breaking on the wheel outside a walled town: the executioner raising a spoked wheel over a naked man staked out across wooden blocks, a friar with a crucifix, a bailiff on an upright execution sword, a judge in a crimson robe, a man with a staff, bones and blood in the foreground, red-roofed houses and church towers behind"
    source: "Diebold Schilling the Younger, Luzerner Chronik, 1513 (Korporation Luzern, S 23 fol.) — the execution of the mercenary Hans Spiess at Ettiswil, canton of Lucerne, 1503, after a bier-trial (Bahrprobe) convicted him of murdering his wife"
    located: "Wikimedia Commons File:Rädern des Hans Spiess.jpg, the lower register cropped by an editor from File:Bahrprobe und Rädern (Hans Spiess).jpg, itself a scan of a plate in Peter Dinzelbacher, Das fremde Mittelalter: Gottesurteil und Tierprozess (Essen: Magnus, 2006), between pp. 128 and 129"
    url: "https://commons.wikimedia.org/wiki/File:R%C3%A4dern_des_Hans_Spiess.jpg (full-res https://upload.wikimedia.org/wikipedia/commons/f/f7/R%C3%A4dern_des_Hans_Spiess.jpg)"
    license: "Public domain (Commons: PD-Art with PD-old-auto-expired; the illuminator died 1515)"
    quality: "1075x741, strong flat colour, no watermark; a painted red frame and parchment margins on all four sides, which the figure crop removes"
    note: "Hunted for promise-and-sovereign-individual, where no pool candidate existed: II:3's parenthetical names breaking on the wheel as the German genius's speciality, and this is the ritual the phrase abbreviates. Shipped as that lesson's wheel-execution.jpg, cropped to 875x592. The e-codices scan of the same manuscript is higher-resolution but CC BY-NC 4.0, so the public-domain Commons copy was used instead. Rejected alternatives from Commons Category:Breaking wheels: 98Diebold Schilling Hinrichtungsarten.jpg (fol. 285r — the same wheel-raising, but with gallows, two wheel-posts and a live burial in one frame, so the wheel stops being the single subject) and Klassisches Radern.png (Johann Stumpf's Swiss chronicle, Augsburg 1586 — a small monochrome cut)."

  - id: debtandguilt-dore-quixote-ducal-castle-1863
    capture: research/images/debtandguilt-dore-quixote-ducal-castle-1863.jpg
    shows: "Don Quixote in half-armour, mounted and lance upright, received in state in the courtyard of the ducal castle: a duenna kneeling at the horse, a damsel in white at the stirrup, a grinning courtier beside them, and the whole household leaning over the great staircase and the gallery balustrade to watch"
    source: "Gustave Doré, full-page plate for Don Quixote, Part II, chapter XXXI ('Which treats of many and great matters'), designed for the 1863 Hachette L'ingénieux hidalgo don Quichotte de la Manche; this scan is the plate as reprinted in the Ormsby English translation"
    located: "Wikimedia Commons File:Cap 031, Volume II, Illustrations by Gustave Doré in L'ingénieux hidalgo don Quichotte de la Manche (1863) 02.jpg, in Category:Illustrations by Gustave Doré in L'ingénieux hidalgo don Quichotte de la Manche (1863) - Volume II; the underlying file is Project Gutenberg ebook 5946, images/p31b.jpg"
    url: "https://commons.wikimedia.org/wiki/File:Cap_031,_Volume_II,_Illustrations_by_Gustave_Dor%C3%A9_in_L%27ing%C3%A9nieux_hidalgo_don_Quichotte_de_la_Manche_(1863)_02.jpg (full-res: https://upload.wikimedia.org/wikipedia/commons/6/64/Cap_031%2C_Volume_II%2C_Illustrations_by_Gustave_Dor%C3%A9_in_L%27ing%C3%A9nieux_hidalgo_don_Quichotte_de_la_Manche_%281863%29_02.jpg)"

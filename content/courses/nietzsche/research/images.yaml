    located: "Wikimedia Commons File:Paul_von_Joukowsky_-_Bühnenbild_Parsifal_-_Gralstempel.jpg; the file page gives its source as an exhibition-catalogue scan (omm.de BAY-2008kat30.jpg)"
    url: "https://commons.wikimedia.org/wiki/File:Paul_von_Joukowsky_-_B%C3%BChnenbild_Parsifal_-_Gralstempel.jpg (full file https://upload.wikimedia.org/wikipedia/commons/2/23/Paul_von_Joukowsky_-_B%C3%BChnenbild_Parsifal_-_Gralstempel.jpg)"

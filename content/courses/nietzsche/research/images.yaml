# Index of the captured real-image pool for the Nietzsche course.
# Captures are already on disk under research/images/; nobody re-reads the
# source for them. Three candidates surfaced across the two reading passes,
# no duplicates. The two letter pages are 70 dpi page captures from
# Kaufmann's facsimile section: re-render the PDF page at 300 dpi for the
# finished crop (the PDF is staged in research/texts/). The 1882 title page is
# a 150 dpi bilevel capture from the Kaufmann Gay Science.
# Licence: the manuscripts and the 1882 title page are public domain
# (Nietzsche d. 1900; Schmeitzner 1882); the reproductions are from Princeton
# UP (2013) and Random House (1974) books still in copyright, so a lesson that
# ships one needs the human's sign-off or a public-domain scan of the same
# artifact (Goethe- und Schiller-Archiv, Weimar; Princeton University Library
# for the Hillebrand letter; any library copy of the 1882 first edition).

images:
  - id: nietzschephi-s4-fuchs-letter-1888-p2
    capture: research/images/nietzschephi-s4-fuchs-letter-1888-p2.png
    shows: >
      Page 2 of Nietzsche's letter to Carl Fuchs, 18 July 1888, in his own hand:
      'I have given mankind the deepest book it possesses, my Zarathustra'
      and the passage on having nothing left but 'buffooneries' to stay master
      of an intolerable tension; six months before the collapse
    source: "W. Kaufmann, Nietzsche: Philosopher, Psychologist, Antichrist, Princeton Classics 2013, 'Four Letters: Commentary and Facsimile Pages'"
    located: "PDF p. 508 (printed p. 481); transcription and commentary printed pp. 466-469"
    url: "research/texts/Nietzsche Philosopher, Psychologist, Antichrist (Walter Kaufmann, Alexander Nehamas).pdf, PDF page 508"
    license: "manuscript public domain; reproduction (c) Princeton University Press 2013 (teaching use needs sign-off)"
    quality: "431x650 at 70 dpi, clear black ink, legible; re-render at 300 dpi from the PDF"
    planned_for: [ecce-homo]

  - id: nietzschephi-s4-hillebrand-letter-1878-p1
    capture: research/images/nietzschephi-s4-hillebrand-letter-1878-p1.png
    shows: >
      First page of Nietzsche's April 1878 letter to Karl Hillebrand, with
      'European air and not nationalistic nitrogen' in his compressed,
      slanting hand
    source: "W. Kaufmann, Nietzsche: Philosopher, Psychologist, Antichrist, Princeton Classics 2013, 'Four Letters: Commentary and Facsimile Pages'"
    located: "PDF p. 497 (printed p. 470); transcription printed p. 460"
    url: "research/texts/Nietzsche Philosopher, Psychologist, Antichrist (Walter Kaufmann, Alexander Nehamas).pdf, PDF page 497"
    license: "manuscript held by Princeton University Library, public domain; reproduction (c) Princeton University Press 2013 (teaching use needs sign-off)"
    quality: "431x649 at 70 dpi, clear, legible; re-render at 300 dpi from the PDF"
    planned_for: [nietzsche-and-politics]

  - id: gs-title-page-1882
    capture: research/images/gs-title-page-1882.png
    shows: >
      Title page of the first edition of Die froehliche Wissenschaft
      (Chemnitz: Ernst Schmeitzner, 1882), with Emerson's epigraph in German
      ('Dem Dichter und Weisen sind alle Dinge befreundet und geweiht...') and
      the publisher's branches in Paris, Petersburg, Rome, New York, London.
      The 1887 title page (Leipzig: Fritzsch, with Nietzsche's own four-line
      verse and 'Songs of Prince Vogelfrei') is on the next PDF page and was
      not captured.
    source: "F. Nietzsche, The Gay Science, trans. W. Kaufmann, Vintage 1974, title-page reproductions after the Translator's Introduction"
    located: "PDF p. 44 (printed, unnumbered); 1887 title page PDF p. 46; Kaufmann's translations PDF p. 47"
    url: "research/texts/The Gay Science (Nietzsche, tr. Kaufmann, Vintage 1974).pdf, PDF page 44"
    license: "1882 title page public domain; reproduction in a Random House 1974 book (teaching use only; re-scan a library copy for publication)"
    quality: "672x1050 px at 150 dpi, bilevel and slightly coarse; text legible, the epigraph small; capture PDF p. 46 too if the 1882/1887 contrast is wanted"
    planned_for: [nietzsche-life-and-books]
  - id: commons-hartmann-nietzsche-c1875
    capture: research/images/commons-hartmann-nietzsche-c1875.jpg
    shows: >
      Studio portrait of Nietzsche, head and shoulders, c. 1875, during the
      Basel professorship: hair swept back, the large moustache, dark jacket,
      white collar, black bow tie
    source: "Friedrich Hermann Hartmann (photographer, 1822-1902), c. 1875; Wikimedia Commons, File:Nietzsche187a.jpg (Valued Image)"
    located: "Commons file page; full original 1464x1986"
    url: "https://commons.wikimedia.org/wiki/File:Nietzsche187a.jpg"
    license: "public domain (PD-old-100-1923 per the Commons file page)"
    quality: "1464x1986 JPEG, sharp, fine restoration grain; no watermark"
    planned_for: [nietzsche-life-and-books]
  - id: olde-1899-ill-nietzsche-01
    capture: research/images/olde-1899-ill-nietzsche-01.jpg
    shows: >
      Nietzsche in Weimar, summer 1899, seated in profile in an armchair,
      wrapped in a white shawl, heavy moustache, vacant gaze; from Hans Olde's
      photograph series "Der kranke Nietzsche" (twelve frames on Commons as
      Nietzsche_Olde_01..12)
    source: "Hans Olde, photograph, June-August 1899; original Goethe- und Schiller-Archiv Weimar, GSA 101/37; Commons scan of the reprint in Benders/Oettermann (eds.), Friedrich Nietzsche - Chronik in Bildern und Texten, Hanser/dtv 2000, pp. 806-807"
    located: "Wikimedia Commons, File:Nietzsche_Olde_01.JPG"
    url: "https://commons.wikimedia.org/wiki/File:Nietzsche_Olde_01.JPG"
    license: "public domain (PD-old; Olde d. 1917), per the Commons file page"
    quality: "2736x2008 JPEG, scan of a book reprint: faint show-through of text from the reverse page across the left half and the shawl; a uniform highlight lift (200 -> white) removes it"
    planned_for: [nietzsche-life-and-books]
  - id: commons-bonnet-lucerne-1882
    capture: research/images/commons-bonnet-lucerne-1882.jpg
    shows: >
      The staged 'Dreieinigkeit' photograph, Lucerne, May 1882: Lou von Salomé
      kneeling in a hand-cart with a lilac-decked whip, Paul Rée and Nietzsche
      harnessed to its shaft before a painted Alpine backdrop; arranged by
      Nietzsche, taken in Jules Bonnet's studio
    source: "Wikimedia Commons, File:Nietzsche_paul-ree_lou-von-salome188.jpg (photograph by Jules Bonnet's studio, Lucerne, 1882)"
    located: "file history, 2010-08-10 upload (858×790), archive URL https://upload.wikimedia.org/wikipedia/commons/archive/b/b7/20101014153422%21Nietzsche_paul-ree_lou-von-salome188.jpg; the current version is a 442 px crop, and File:Jules_Bonnet_Dreieinigkeit_1882.jpg (473 px) carries akg-images watermarks"
    url: "https://commons.wikimedia.org/wiki/File:Nietzsche_paul-ree_lou-von-salome188.jpg"
    license: "public domain (1882 photograph)"
    quality: "858x790 greyscale JPEG, clean, slight oversharpening halo; best free copy found"
    planned_for: [nietzsche-life-and-books]
  - id: schopenhauer-schaefer-1859b
    capture: research/images/schopenhauer-schaefer-1859b.jpg
    shows: >
      Arthur Schopenhauer, aged 71, half-length portrait photograph taken in
      Frankfurt in March 1859 by Johann Schäfer: white hair standing out at the
      sides, bald forehead, tight mouth, white cravat, dark high-collared coat
    source: "Johann Schäfer, photograph, Frankfurt am Main, March 1859; Frankfurt am Main University Library (edocs.ub.uni-frankfurt.de/volltexte/2007/81000013/), via Wikimedia Commons"
    located: "Wikimedia Commons, File:Arthur Schopenhauer by J Schäfer, 1859b.jpg"
    url: "https://commons.wikimedia.org/wiki/File:Arthur_Schopenhauer_by_J_Sch%C3%A4fer,_1859b.jpg"
    license: "public domain (PD-old-100-expired; Schäfer d. 1904); Public Domain Mark 1.0"
    quality: "1997x2552 original, sharp, clean grey background, no caption or furniture; usable whole"
    planned_for: [schopenhauer-and-the-birth-of-tragedy]
  - id: commons-fr-pronomos-vase
    capture: research/images/commons-fr-pronomos-vase.jpg
    shows: >
      The painted frieze of side A of the Pronomos Vase laid out flat as a colour plate:
      Dionysus and Ariadne on a couch at centre, actors of a satyr play in costume
      with their masks (Herakles, Papposilenos in a shaggy full-body suit, a woman's mask),
      chorus-men in goat-hair shorts holding bearded satyr masks, the piper Pronomos seated
      playing the double pipes, poets with lyres; tripods and shields hung above
    source: "A. Furtwängler and K. Reichhold, Griechische Vasenmalerei (plate dated 1932 on Commons), after the Attic red-figure volute krater by the Pronomos Painter, about 400 BC, Naples MAN 81673"
    located: "Wikimedia Commons, File:Griechische_Vasenmalerei,_Taflen_-_A._Furtwangler,_K_Reichhold.jpg (full original 3865x1968); museum photographs by ArchaiOptix (CC BY-SA 4.0) also on Commons as 'Pronomos Painter - ARV 1336 1 - ... - Napoli MAN 81673 - 01..03.jpg'"
    url: "https://commons.wikimedia.org/wiki/File:Griechische_Vasenmalerei,_Taflen_-_A._Furtwangler,_K_Reichhold.jpg"
    license: "public domain (PD-Art | PD-old-70), per the Commons file page"
    quality: "3865x1968 JPEG scan of the plate, sharp; cream paper margins on the curved edges, a thin vertical seam between the plate's sheets on the left third, printed label 'THEATER' below (crop it)"
    planned_for: [schopenhauer-and-the-birth-of-tragedy]
  - id: commons-transfiguration-raphael
    capture: research/images/commons-transfiguration-raphael.jpg
    shows: >
      Raphael, The Transfiguration (1516-20), whole panel without frame: above,
      Christ in white light between Moses and Elijah over the three prostrate
      disciples on the mount; below, in shadow, the possessed boy held up by his
      family and the helpless disciples. The two halves BT 4 reads.
    source: "Raphael, oil on panel, 1516-1520, Pinacoteca Vaticana; Wikimedia Commons, File:Transfiguration Raphael.jpg (Wikidata Q2344437)"
    located: "Commons file page; full original 1067x1608"
    url: "https://commons.wikimedia.org/wiki/File:Transfiguration_Raphael.jpg"
    license: "public domain (PD-Art, PD-old-auto-expired, artist d. 1520, per the Commons file page)"
    quality: "1067x1608 JPEG, whole panel, clean, colour slightly high-contrast; no watermark. Higher-res alternative: File:Raphaël, La Transfiguration, 1518–1520, huile sur bois, 405 × 278 cm, Musées du Vatican, Pinacothèque, inv. 4.jpg (6349x9381, photo CC BY 4.0, Matthieu.lett.ube)"
    planned_for: [schopenhauer-and-the-birth-of-tragedy]

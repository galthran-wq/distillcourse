# Image pool for the Nietzsche course, captured by the source-reading swarm
# (September 2026, two passes) and deduplicated by the architect. Every
# entry's capture already sits under research/images/ — nobody re-reads the
# source later.
# Three readers captured the same Schultze 1882 portrait under three tags
# (beyondgood-, twilightof-, humanall-); one copy is kept. The 1887 Genealogy
# title-page GIF (296x424) is recorded under `rejected` and its file deleted;
# so is the raw GIF twin of the Cable cartoon (the PNG is the capture).
#
# House rule reminder (docs/figures.md): a scan is a figure only when what is
# VISIBLE, not what is readable, is the evidence. The letter facsimiles pass
# that test in pairs (the same hand, years apart); the printed title pages,
# the book jacket and the eKGWB interface screenshots are borderline and are
# planned only where the artefact itself is the lesson's subject; the two
# Del Caro footnote pages are apparatus — planned only in the translation
# chapter, where the apparatus IS the subject.

images:
  - id: beyondgood-nietzsche-portrait-1882
    capture: research/images/beyondgood-nietzsche-portrait-1882.png
    shows: "Nietzsche in profile, chin on hand, moustache, period dress — the standard author portrait, one of five plates from a single Naumburg studio session"
    source: "Photograph by Gustav-Adolf Schultze, Naumburg, early September 1882"
    located: "Wikimedia Commons File:Nietzsche1882.jpg (also surfaced by the Twilight/Antichrist and BBC-documentary readers; duplicates removed)"
    url: "https://commons.wikimedia.org/wiki/File:Nietzsche1882.jpg (full-res https://upload.wikimedia.org/wikipedia/commons/2/23/Nietzsche1882.jpg)"
    license: "Public domain (CC-PD-Mark on Commons; photographer's work published before 1931)"
    quality: "1274x1700, sharp, strong contrast, no watermark"
    note: "Taken in the Gay Science year; six years before Twilight/Antichrist. The one author portrait the course uses — at the corpus timeline in corpus-and-protocol."


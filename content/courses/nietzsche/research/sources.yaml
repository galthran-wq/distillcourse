# Research canon for the Nietzsche course, compiled September 2026 by the
# source-reading swarm; roles and access assigned by the architect.
# "role" = which modules/lessons the source grounds. Staged copies live in
# research/texts/ (file stems given per entry); image captures in
# research/images/, indexed in research/images.yaml.
#
# ACCESS SUMMARY (after the second reading pass). FULLY READ: BGE (Norman),
# Zarathustra (Del Caro), Twilight / Antichrist (Hollingdale), Clark 1990,
# Clark & Dudrick 2012, Reginster 2006, Janaway & Robertson 2012, Leiter &
# Sinhababu 2007, Nehamas 1985, Kaufmann (4th ed.), Heidegger I–IV, the SEP
# entry, the eKGWB/DFGA, both syllabi.
#
# NOT FULLY READ — the human obtains a copy and the read is re-run:
#   1. On the Genealogy of Morality, trans. Clark & Swensen — TOC-ONLY for
#      this translation; the argument was read complete through the
#      public-domain Samuel 1913 translation and the eKGWB German.
#   2. Leiter, Nietzsche on Morality, 2nd ed. — TOC-ONLY; reconstructed from
#      reviews and Leiter's own restatements. No page numbers anywhere.
#   3. The BBC documentary — SUMMARY-BASED; no transcript exists and the
#      only upload is bot-gated. Optional context only.

sources:
  - title: "On the Genealogy of Morality"
    author: "F. Nietzsche, trans. M. Clark & A. J. Swensen (Hackett, 1998)"
    url: "https://hackettpublishing.com/on-the-genealogy-of-morality"
    kind: primary
    role: >
      THE SPINE. Modules 2–4 read the three treatises section by section
      (Preface §§1–8 and II:12–13 as the method; I:1–17; II:1–25; III:1–28);
      the Clark/Swensen apparatus is the intended base for the translation-
      comparison exercises against Samuel (1913) and the German.
    access: >
      TOC-ONLY for this translation (Hackett; the archive.org copy
      ongenealogyofmor0000niet_h3w1 is controlled-lending; Google Books is
      snippet-view; the pdfcoffee upload exposes only Clark's introduction).
      Section numbering is invariant across editions, so every pointer in
      the briefs is by treatise and section and transfers to the Hackett
      pages once the human has the book. Staged stand-ins, read complete:
      research/texts/onthe-gutenberg-samuel.txt (Horace Samuel's 1913
      translation, public domain; the 'Peoples and Countries' addendum from
      line 4737 is a Levy-edition insertion, not part of GM) and
      research/texts/digitalcriti-s1-GM.txt (the eKGWB German). Quotations
      attributed to Clark/Swensen must be verified against the book before
      they enter a lesson. HUMAN: obtain the Hackett edition and re-run the
      read for wording and page numbers.

  - title: "Beyond Good and Evil: Prelude to a Philosophy of the Future"
    author: "F. Nietzsche, trans. J. Norman, ed. R.-P. Horstmann (Cambridge Texts, 2002)"
    url: "https://www.cambridge.org/core/books/nietzsche-beyond-good-and-evil/"
    kind: primary
    role: >
      The argued companion to the Genealogy: BGE 1–4 (will to truth), 12–23
      (soul, cogito, will, will to power), 36, 186–203 (natural history of
      morals, §195 slave revolt), 211, 257–262 (pathos of distance, master/
      slave typology), 250–251 (the antisemitism passages, quoted not
      paraphrased). Module 5's main text; quarried throughout.
    access: >
      FULL. research/texts/beyondgood-full.txt (Internet Archive OCR of the
      Cambridge edition: Preface, §§1–296, the Aftersong, the Glossary of
      names; Horstmann's Introduction is not in the OCR). German:
      research/texts/digitalcriti-s1-JGB.txt.

  - title: "Thus Spoke Zarathustra"
    author: "F. Nietzsche, trans. A. Del Caro, ed. R. Pippin (Cambridge Texts, 2006)"
    url: "https://www.cambridge.org/core/books/nietzsche-thus-spoke-zarathustra/"
    kind: primary
    role: >
      Read as dramatization, never as doctrine: the module-closing lessons of
      modules 2, 5 and 6 take a speech and map it onto theses argued elsewhere
      (Tarantulas / Thousand and One Goals; Self-Overcoming / Despisers of the
      Body / Hinterworldly; Prologue / Three Metamorphoses / On the Higher
      Man), and eternal-recurrence reads the three-stage arc (Vision and
      Riddle → Convalescent → Seven Seals). Del Caro's footnotes on
      untranslatable wordplay (Sucher/Versucher; Herr → 'ruler'; untergehen)
      feed the translation chapter.
    access: >
      FULL, all four Parts. research/texts/thusspoke-full.txt (+ thusspoke.pdf,
      thusspoke-s1.txt, thusspoke-s2-full.txt); Pippin's Introduction was not
      read. Two footnote pages captured as images (research/images.yaml).

  - title: "Twilight of the Idols / The Anti-Christ"
    author: "F. Nietzsche, trans. R. J. Hollingdale, intro. M. Tanner (Penguin Classics)"
    url: "https://www.penguin.co.uk/books/35156/twilight-of-the-idols-and-the-anti-christ-by-friedrich-nietzsche/"
    kind: primary
    role: >
      The compressed late statements: 'The Four Great Errors' (doer-behind-
      the-deed), 'How the Real World at last Became a Myth' (real-world-
      became-a-fable), 'Morality as Anti-Nature' (higher-type-and-
      sublimation), 'Expeditions' §14 (Anti-Darwin) and §44 (genius),
      Antichrist §§1–7 (will-to-power formulas) and §§24–47 (Module 4's
      application: genealogy run on Jesus and Paul), §§57–58 (Manu).
    access: >
      FULL, including Tanner's Introduction, Hollingdale's notes and the
      Glossary of names. research/texts/twilightof-.txt (pdftotext of the
      Penguin PDF). This edition does NOT contain the 'Law Against
      Christianity' appendix — a lesson quoting it must source it from the
      eKGWB (AC, closing 'Gesetz wider das Christenthum'). German:
      digitalcriti-s1-GD.txt, digitalcriti-s1-AC.txt.

  - title: "Nietzsche on Morality, 2nd ed."
    author: "B. Leiter (Routledge, 2015)"
    url: "https://www.routledge.com/Nietzsche-on-Morality/Leiter/p/book/9780415856805"
    kind: secondary
    role: >
      THE WORKING HYPOTHESIS. Methodological naturalism, the Doctrine of
      Types, MPS with its descriptive and normative components (Chs. 1–4),
      genealogy's rhetorical force (Ch. 5), the essay-by-essay commentary
      (Chs. 6–8: asymmetry of master/slave; the three-stage story of guilt;
      the sovereign individual deflated; the ascetic ideal as strategy), and
      the Postscript's retraction on epiphenomenalism. Stated as the
      hypothesis in corpus-and-protocol, tested in every module, audited in
      naturalist-reading-verdict.
    access: >
      TOC-ONLY. Paywalled (Routledge/T&F 403; Perlego/Scribd paid);
      archive.org holds only the 2002 first edition as a lending item;
      Google Books snippet preview confirmed the chapter list. Reconstructed
      from Reginster's NDPR review of the 1st ed. (full), a chapter-by-chapter
      secondary summary, and Leiter's own restatements (blog, APA interview,
      the Katsafanas exchange): research/texts/nietzscheon-morality-research-
      notes.txt. NO page numbers; chapter-level pointers only. Two of
      Leiter's theses are available in his own published words elsewhere in
      the dossier: the Doctrine of Types in Knobe & Leiter 2007 (below) and
      the scope condition as quoted by Robertson 2012. HUMAN: obtain the book
      and re-run the read.

  - title: "Nietzsche and Morality"
    author: "B. Leiter & N. Sinhababu (eds.) (Clarendon / Oxford, 2007)"
    url: "https://global.oup.com/academic/product/nietzsche-and-morality-9780199285938"
    kind: secondary
    role: >
      The analytic camp's own debate volume, and the one place Leiter's
      Doctrine of Types is on disk in his words: Knobe & Leiter Ch. 4
      (type-facts, heritability evidence, Cornaro; pp. 83–109); Wallace Ch. 5
      (the slave revolt's strategic vs. expressive interpretation; pp.
      110–137); Janaway Ch. 6 (guilt as legitimated, internalized cruelty —
      the 2×2; pp. 138–154); Sinhababu Ch. 10 (vengeful thinking; pp.
      262–280); Hurka Ch. 1 (maximax perfectionism; pp. 9–31); Reginster
      Ch. 2 (will to power as second-order desire, the ethics of creativity;
      pp. 32–56); Risse Ch. 3 (drives vs. Korsgaard; pp. 57–82); Hussain
      Ch. 7 (fictionalism; pp. 157–191); Clark & Dudrick Ch. 8 (the
      developmental metaethics; pp. 192–226); Poellner Ch. 9 (affect and
      phenomenal objectivity; pp. 227–261); Blackburn Ch. 11 (against
      fictionalism and 'play'; pp. 281–296). Grounds slave-revolt-and-
      ressentiment, guilt-reconstructed, soul-as-society-of-drives,
      higher-type-and-sublimation, value-creation-and-normativity.
    access: >
      FULL. Human-staged PDF, extracted to research/texts/nietzscheand-
      full.txt (317 pages, form-feed per page; page numbers in the briefs
      are the printed ones).

  - title: "Nietzsche on Truth and Philosophy"
    author: "M. Clark (Cambridge, 1990)"
    url: "https://archive.org/details/maudemarie-clark-nietzsche-on-truth-and-philosophy"
    kind: secondary
    role: >
      The analytic groundwork before Leiter: the developmental thesis on
      truth (Chs. 1, 3, 4), the minimal vs. metaphysical correspondence
      theory (Ch. 2), perspectivism as anti-foundationalism (Ch. 5), the
      ascetic ideal and truth (Ch. 6), the BGE 36 argument judged
      question-begging (Ch. 7), eternal recurrence as practical test and
      Zarathustra's revenge against time (Ch. 8). Grounds perspectivism,
      will-to-truth, will-to-power-as-psychology, real-world-became-a-fable,
      eternal-recurrence, life-as-literature.
    access: >
      FULL. research/texts/nietzscheon-.txt (OCR of the 1990 edition; page
      numbers match the printed book; no figures anywhere in the book).

  - title: "The Soul of Nietzsche's Beyond Good and Evil"
    author: "M. Clark & D. Dudrick (Cambridge, 2012)"
    url: "https://www.cambridge.org/core/books/soul-of-nietzsches-beyond-good-and-evil/5C6D7C82D66C50E48ED8B5C4A1F1E0EB"
    kind: secondary
    role: >
      The anti-Leiter rival inside the analytic camp: BGE One as a
      self-contained argument for a 'neo-Kantian naturalism'; will to truth
      vs. will to value (Chs. 1–2); the drive rank-order as a normative,
      political order, not a causal order of strength (Ch. 6); BGE 19's
      willing as willpower, not epiphenomenal (Ch. 7); BGE 13/22/36 as
      claims about the soul, not a power-physics (Ch. 8); the esoteric/
      exoteric pedagogy (Conclusion). Used in soul-as-society-of-drives,
      will-to-power-as-psychology, will-to-truth, value-creation-and-
      normativity.
    access: >
      FULL. Human-staged PDF, extracted to research/texts/thesoul-full.txt
      (296 pp.; briefs cite chapter and section numbers, e.g. 6.2, 7.4). The
      older abstracts-only file thesoul-notes.txt (with Riccardi's NDPR review
      and Stern's Mind review) is kept as the reviews' index.

  - title: "The Affirmation of Life: Nietzsche on Overcoming Nihilism"
    author: "B. Reginster (Harvard, 2006)"
    url: "https://www.hup.harvard.edu/books/9780674030640"
    kind: secondary
    role: >
      The positive doctrine made analytic: nihilism as despair vs.
      disorientation and the 'highest value' (Ch. 1), the metaethical
      strategies and their limits (Ch. 2), Schopenhauer's pessimism and will
      to power as second-order desire for overcoming resistance (Ch. 3), the
      revaluation of suffering, greatness, the ethics of power (Ch. 4),
      eternal recurrence's theoretical vs. practical role and 'eternity vs.
      recurrence of a moment' (Ch. 5), Dionysian wisdom, the overman, 'help
      the weak perish' (Ch. 6). Grounds nihilism-and-affirmation, will-to-
      power-as-psychology, eternal-recurrence, higher-type-and-sublimation,
      overman-staged, ascetic-priest.
    access: >
      FULL. Human-staged PDF, extracted to research/texts/theaffirmati-
      full.txt (13,121 lines; briefs cite chapter.section and, for the gems,
      approximate line numbers). The older reviews file theaffirmati-
      notes.txt is superseded.

  - title: "Nietzsche, Naturalism, and Normativity"
    author: "C. Janaway & S. Robertson (eds.) (Oxford, 2012)"
    url: "https://global.oup.com/academic/product/nietzsche-naturalism-and-normativity-9780199583676"
    kind: secondary
    role: >
      The structured stress-test of the working hypothesis, three of whose
      chapters confront Leiter by name: Robertson on the scope problem
      (Ch. 4), Anderson on the self (Ch. 9), Schacht on scientistic
      naturalism (Ch. 10); plus Railton's normative/evaluative split (Ch. 2),
      Poellner's aestheticism (Ch. 3), Hussain vs. Thomas on non-cognitivism
      and fictionalism (Chs. 5–6), Reginster on compassion (Ch. 7), Janaway
      on greatness and eternal recurrence (Ch. 8), and the Introduction's
      'authority puzzle'. Grounds value-creation-and-normativity,
      alleged-biologism, promise-and-sovereign-individual, higher-type-and-
      sublimation, key-terms-in-translation, and the final audit.
    access: >
      FULL. Human-staged PDF, extracted to research/texts/nietzschenat-
      full.txt (273 pp.; printed page numbers in the briefs). The earlier
      abstracts file nietzschenat-abstracts.txt is kept for Leiter's open
      NDPR review essay on the volume, which the book does not contain.

  - title: "Nietzsche: Life as Literature"
    author: "A. Nehamas (Harvard, 1985)"
    url: "https://www.hup.harvard.edu/books/9780674624351"
    kind: secondary
    role: >
      The first rival reading in the closing module: perspectivism's
      self-refutation charge rebutted (Ch. 2), 'a thing is the sum of its
      effects' with the literary-character model (Ch. 3), genealogy as
      textual interpretation (Ch. 4), eternal recurrence as the integrity
      of a well-made work with the Anna Karenina and Proust cases (Ch. 5),
      the self as achieved style (Ch. 6), no positive doctrine of 'the
      individual', Nietzsche as the Plato of his own Socrates (Ch. 7).
      Grounds life-as-literature; previewed in perspectivism and
      eternal-recurrence.
    access: >
      FULL. Human-staged PDF, extracted to research/texts/nietzschelif-
      full.txt (278 pp.; printed page numbers in the briefs). The earlier
      toc-only file nietzschelif-notes.txt is superseded and carried one
      error about Ch. 4's content.

  - title: "Nietzsche, Vols. I–IV"
    author: "M. Heidegger, trans. D. F. Krell et al. (Harper & Row, 1979–87)"
    url: "https://archive.org/details/nietzsches-will-to-power-volume-1"
    kind: secondary
    role: >
      The second rival reading: will to power and eternal recurrence as one
      metaphysical thought (I §4, II §§1, 24–26, III Part Two, IV §1), the
      guiding vs. grounding question (I §11), the 'alleged biologism'
      argument that no science grounds its own field-concept (III Part One
      §6, with the blackboard example §12), the fable as a twisting-free of
      Platonism (I §§20, 24), the cosmological 'proof' as neither good nor
      bad physics (II §§14–16), Nietzsche's metaphysics as nihilism proper
      (IV Part Two), the Nachlass-based method (I §2) and Krell's built-in
      countercritique, including the Baeumler excursus and the WM 617
      selective-quotation footnote (III, p. 213). Grounds heidegger-one-
      thought, alleged-biologism, and the counter-readings in real-world-
      became-a-fable and eternal-recurrence.
    access: >
      FULL, all four volumes. research/texts/nietzschevol-s1.txt /
      -s1-full-djvu.txt (Vol. I), -s2.txt (Vol. II), -s3-vol3.txt and
      -s3-vols34_djvu.txt (Vols. III–IV), -s4-.txt (Vol. IV), from Internet
      Archive scans marked public domain (verify the underlying edition's
      rights before quoting at length). Vol. II's embedded page numbers are
      OCR-jumbled; cite by section.

  - title: "Nietzsche: Philosopher, Psychologist, Antichrist"
    author: "W. Kaufmann (Princeton, 1950; 4th ed. 1974; Princeton Classics reissue 2013 with foreword by A. Nehamas)"
    url: "https://press.princeton.edu/books/paperback/9780691160269/nietzsche"
    kind: secondary
    role: >
      The 'Nietzsche legend' and its correction: the sister's forgeries and
      the compilation (Prologue), problem-thinker vs. system-thinker and the
      Nachlass taxonomy (Ch. 2), death of God as cultural diagnosis and the
      aborted four-book Revaluation (Ch. 3), the genesis of will to power
      (Ch. 6), sublimation and the Hegel parallel (Chs. 7–8), power vs.
      pleasure (Ch. 9), the point-by-point refutation of the Nazi reading
      (Ch. 10), overman and recurrence with Simmel's three wheels (Ch. 11),
      Jesus vs. Paul and ressentiment's Heine precedent (Ch. 12), the
      Podach/Schlechta manuscript controversies and the three Antichrist
      deletions (Appendix), the four letter facsimiles. Grounds will-to-
      power-the-book, madman-argument, higher-type-and-sublimation,
      antichrist-applied-genealogy, overman-staged, and the refutation slots
      on the proto-fascist misreading.
    access: >
      FULL. Human-staged PDF, extracted in three shards: research/texts/
      nietzschephi-s1.txt (front matter through Ch. 5, pp. 1–204),
      nietzschephi-s2.txt (Chs. 6–11, pp. 205–363), nietzschephi-s3-ch12-
      end.txt (Chs. 12–13, Epilogue, Appendix, Four Letters, Bibliography).
      Also the earlier excerpt (Ch. 3, nietzschephi-excerpt-death-of-god-
      revaluation.txt) and Kaufmann's 1948 Socrates and 1964 'Suppressed
      Manuscripts' articles (nietzschephi-article-*.txt).

  - title: "Friedrich Nietzsche (Stanford Encyclopedia of Philosophy)"
    author: "R. L. Anderson"
    url: "https://plato.stanford.edu/entries/nietzsche/"
    kind: reference
    role: >
      Orientation and refresher for every module: the three treatises
      summarized (§2), the map of scholarly camps on value creation (§3.1),
      the six Nietzschean values (§3.2), the self (§4), reading the aphorism
      and the 'audience partition' (§5), and the three key doctrines with
      their rival readings (§6, incl. Clark's marriage analogy and the three
      constraints of recurrence). Also Anderson's own autonomy-affirming
      reading of the sovereign individual, opposed to Leiter's.
    access: >
      FULL. research/texts/friedrichnie-.txt (+ .html with bibliography).

  - title: "PHIL 414: Nietzsche (Seminar in German Philosophy), Spring 2025"
    author: "C. Kirwin, Northwestern University"
    url: "https://catalogs.northwestern.edu/"
    kind: course-syllabus
    role: >
      Structural analogue: a Genealogy-in-full seminar read through Anglo-
      American analytic commentary (Janaway's Beyond Selflessness as the
      single secondary voice), with argument reconstruction and defence as
      its stated learning objective. Sanity-check for the Module 2–4
      sequencing. Assigns nothing on its public page.
    access: >
      FULL but thin — a one-page class description; no reading schedule
      exists anywhere online. research/texts/phil414-syllabus.txt.

  - title: "Phil 370: Nietzsche (syllabus, schedule, discussion notes), Spring 2003"
    author: "T. Beckman, Claremont Graduate University / Harvey Mudd College"
    url: "https://pages.hmc.edu/beckman/philosophy/nietzsche/"
    kind: course-syllabus
    role: >
      The reading-order precedent (Birth of Tragedy → Gay Science →
      Zarathustra I–III → BGE → GM → Twilight → Ecce Homo) and the
      instructor's weighting of which stretches carry the argument; the
      running Freud comparison in the bad-conscience material. Assigns
      readings and an unstaged term paper only; no exercises.
    access: >
      FULL for the syllabus, schedule and discussion notes; PARTIAL for the
      course-notes essays (5 of ~18 staged: index, biography, people, Birth
      of Tragedy, Genealogy, Zarathustra). research/texts/phil370-main.txt,
      -schedule.txt, -discussionnotes.txt, -coursenotes-*.txt.

  - title: "Digital Critical Edition of Nietzsche's Works and Letters (eKGWB) / Digital Facsimile Edition (DFGA)"
    author: "ed. P. D'Iorio, Nietzsche Source"
    url: "http://www.nietzschesource.org/"
    kind: primary
    role: >
      The German text of record with stable sigla (GM-I-13, JGB-36,
      NF-1881,11[141]); the ~6,600-correction apparatus; the Nachlass in
      strict chronological order — the evidence that The Will to Power is
      an editorial construction (NF-1885,2[100]; NF-1888,14[71]) and the
      first record of eternal recurrence (NF-1881,11[141], 11[197]); the
      1870–73 posthumous writings (WL for perspectivism); the letters (the
      Köselitz letter of 14 August 1881, the Fritsch disavowal of 1887, the
      Turin letters of January 1889); the manuscript facsimiles.
    access: >
      FULL (German only; no English on the site). Works: research/texts/
      digitalcriti-s1-{GT,FW,JGB,GM,GD,AC,EH}.txt; Nachlass samples:
      digitalcriti-s2-nf-NF-*.txt (8 groups, 1869–1888) and the posthumous
      writings digitalcriti-s2-pw-*.txt; letters: digitalcriti-s3-BVN-*.txt
      (1850–1889, complete) and BAN-*.txt (1881–1883 only — the site
      publishes no other incoming years). The DFGA indexes no letter
      facsimiles under BVN sigla; the notebook M III 1 photograph is the
      one Nachlass facsimile in the pool.

  - title: "Human, All Too Human: Friedrich Nietzsche — Beyond Good and Evil (episode 1)"
    author: "BBC / RM Arts, dir. S. Chu, 1999"
    url: "https://www.youtube.com/watch?v=LzKFCvSkBfg"
    kind: documentary
    role: >
      Optional biographical/visual context only (illness, Sils-Maria, the
      sister's editorial control; Will Self's contested 'first punk'
      framing). Explicitly must not drive any lesson; supplied five
      public-domain photographs to the image pool.
    access: >
      SUMMARY-BASED, NOT VIEWED: no transcript, captions or archive copy
      exists; the only upload (unofficial) is blocked by YouTube's sign-in
      check from this environment. Reconstructed from Wikipedia, a
      documentarystorm synopsis, IMDb/Letterboxd credits and a 2008 viewer
      comment thread in research/texts/humanall-notes.txt — every claim
      there carries a 'per [source]' qualifier and none may be cited as a
      transcript. HUMAN: watch from a logged-in browser or pursue a BBC/RM
      Arts licence if the course is ever to cite it.

    url: "https://plato.stanford.edu/entries/nietzsche-moral-political/"
    kind: secondary
    access: full
    access_note: "Read in full (texts/nietzsches-.html and texts/nietzsches-.txt)."
    role: >
      Morality in the pejorative sense, the harm puzzle, the marks of the
      higher type, anti-realism, and the anti-politics reading (one of the two
      readings tested in nietzsche-and-politics). Grounds danger-of-dangers,
      higher-type, creating-values.

  - title: "Nietzsche on Morality (2nd ed.)"
    author: "B. Leiter, Routledge 2015"
    url: "https://www.routledge.com/Nietzsche-on-Morality/Leiter/p/book/9780415856805"

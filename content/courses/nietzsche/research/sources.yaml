# Research canon for the Nietzsche course (reconstruction course across the
# whole corpus). Compiled October 2026 by the source-reading swarm; revised at
# the re-synthesis after the primary works were read from the text.
#
# access values:
#   full           read in full from the text; extracted text staged in research/texts/
#   partial        the listed sections read from the text; the rest not read
#   summary-based  read through one secondary description only
#   toc-only       only contents/front matter/sample read; NEEDS A FULL COPY
#   not-found      no legal readable copy located; NEEDS A FULL COPY
#
# Translations used for quotation (binding for lesson writers):
#   Kaufmann for GM, EH, GS, Z, TI, A, NcW (and the Portable's selections);
#   Hollingdale for D; Bittner/Sturge for the late notebooks; Zimmern plus the
#   course's own translation from the German for BGE; Haussmann / Common /
#   Collins / Zimmern plus own translation from the German for BT / CW / UM / HH.
#   Every German wording quoted from a Gutenberg text is marked "verify against
#   eKGWB" in the briefs: nietzschesource.org refused connections during the read.
#   Notebook material is always cited as unpublished, by notebook[fragment],
#   date and Bittner page; WP numbers are compilation numbers and need a
#   concordance check.

sources:
  # ---------------------------------------------------------------- primary
  - title: "The Birth of Tragedy (1872), with 'An Attempt at a Self-Criticism' (1886) and the late notes of 1888"
    author: "F. Nietzsche; trans. W. A. Haussmann (Foulis 1910, ed. O. Levy), checked against the German; W. Kaufmann (Vintage 1967) for comparison"
    url: "https://www.gutenberg.org/ebooks/51356"
    kind: primary
    access: full
    access_note: >
      Whole book read from the text (Self-Criticism 1-7, Foreword to Wagner,
      sections 1-25, the 1888 Appendix): texts/early-gt.txt (+ .meta.yaml).
      Haussmann is clumsy and sometimes wrong; key sentences (Self-Criticism 5
      above all) are to be re-translated from the German (Gutenberg-DE text,
      verify against eKGWB GT). Pointers are section numbers.
    role: >
      Schopenhauer's pessimism answered by art; Apollo and Dionysus; the
      aesthetic justification as the world-artist's (GT 4-5); Socrates as
      tragedy's killer; the 1886 Self-Criticism's 'pessimism of strength' and
      the first 'danger of dangers'. Grounds schopenhauer-and-the-birth-of-tragedy,
      case-of-wagner, value-of-untruth, reason-in-philosophy.

  - title: "On Truth and Lies in a Nonmoral Sense (1873, unpublished)"
    author: "F. Nietzsche; German original; partial English by W. Kaufmann in The Portable Nietzsche (pp. 42-47)"
    url: "http://www.nietzschesource.org/eKGWB/WL"
    kind: primary
    access: full
    access_note: >
      Complete German text read: texts/ontruth-de.txt (+pdf). Kaufmann's
      excerpt (about 30% of the essay) in texts/portable-early.txt pp. 42-47.
      Quotations in the course are the course's own translations beside the
      German, or Kaufmann's where his excerpt covers the passage. Unpublished
      in Nietzsche's lifetime: every lesson says so.
    role: >
      The application text of the truth module (on-truth-and-lies); also the
      metaphor chain for consciousness-and-language.

  - title: "Untimely Meditations II ('On the Uses and Disadvantages of History for Life') and III ('Schopenhauer as Educator') (1874)"
    author: "F. Nietzsche; trans. A. Collins (Foulis 1909), checked against the German; R. J. Hollingdale (Cambridge 1997) for comparison"
    url: "https://www.gutenberg.org/ebooks/38226"
    kind: primary
    access: partial
    access_note: >
      Read from the text: HL 1 and 9, SE 1 and 3-6 (texts/early-hl-se.txt),
      with the whole German of both essays (texts/early-hl-de.txt,
      texts/early-se-de.txt). Collins drops 'not at the end' in HL 9 ('das
      Ziel der Menschheit kann nicht am Ende liegen, sondern nur in ihren
      hoechsten Exemplaren'): quote the course's own translation. SE contains
      'sei du selbst!' and the ladder of loves, not 'become who you are'.
      UM I, IV and the unread sections of II-III: not read.
    role: >
      The goal of humanity in its highest specimens (HL 9; SE 6); 'be
      thyself' and the ladder of loves (SE 1); the state as stupidity (SE 4).
      Grounds order-of-rank, higher-type, becoming-who-you-are,
      nietzsche-and-politics.

  - title: "Human, All Too Human I (1878)"
    author: "F. Nietzsche; trans. H. Zimmern (Foulis 1910), checked against the German; R. J. Hollingdale (Cambridge 1996) for comparison"
    url: "https://archive.org/details/HumanAllTooHumanPartIFriedrichNietzsche"
    kind: primary
    access: partial
    access_note: >
      Read from the text: sections 1, 2, 39, 45, 50, 103, 107, 475, 638
      (texts/early-ma.txt, Zimmern pages approximate from OCR running heads)
      with the German (texts/early-ma-de.txt, Gutenberg-DE #7207, verify
      against eKGWB MA). Kaufmann's Portable adds HH 2, 5, 83, 113, 146, 170,
      184, 189, 224, 265, 271, 281, 298, 303, 361, 380, 390, 406-408, 424, 444,
      462, 465, 475, 482, 483, 536, 579, 635 (texts/portable-early.txt pp.
      51-64). The rest of HH I and all of HH II: not read.
    role: >
      The chemistry of concepts and 'sublimation' (HH 1, 107); the twofold
      prehistory of good and evil (HH 45); pity as the sufferer's power (HH
      50); the error of responsibility (HH 39); HH 475 whole for the
      clipped-quotation case (the-nazi-appropriation, nietzsche-and-politics).

  - title: "Daybreak: Thoughts on the Prejudices of Morality (1881; Preface 1886)"
    author: "F. Nietzsche; trans. R. J. Hollingdale, ed. M. Clark & B. Leiter, Cambridge 1997"
    url: "https://www.cambridge.org/core/books/nietzsche-daybreak/03EBA57DB51B5C7B1A883226B4510E3E"
    kind: primary
    access: full
    access_note: >
      Whole book read from the human-staged OCR (Leiter's introduction,
      Preface 1-5, sections 1-575): texts/Daybreak (Nietzsche, tr.
      Hollingdale, ed. Clark and Leiter, Cambridge 1997).ocr.txt (+ .pdf,
      .meta.yaml). Printed page = PDF page - 45 up to p. 211, PDF - 47 after
      (two duplicated PDF pages). Quote Hollingdale's text, not Leiter's
      paraphrases. D has no 'will to power' (the term is Machtgefuehl), no
      'ressentiment', no recurrence.
    role: >
      Morality of custom (D 9-19); denying morality 'as one denies alchemy'
      (D 103); the six methods against a drive (D 109); consciousness as
      'fantastic commentary' (D 119); the pity cluster (D 131-148); Paul (D
      68); the 'danger of dangers' in the security-society's voice (D 173);
      the Jews of Europe (D 205) and race (D 272); the gardener of drives (D
      560). Central to modules 2, 4, 5, 9.

  - title: "The Gay Science (1882; Preface, Book V and the Songs 1887)"
    author: "F. Nietzsche; trans. W. Kaufmann, Vintage 1974, with Kaufmann's notes"
    url: "https://www.penguinrandomhouse.com/books/121942/the-gay-science-by-friedrich-nietzsche-translated-with-commentary-by-walter-kaufmann/"
    kind: primary
    access: full
    access_note: >
      Whole book read from the human-staged PDF in two shards:
      texts/gayscience-s1-intro-books1-3.txt (Kaufmann's Introduction, 1887
      Preface, Prelude, sections 1-275) and texts/gayscience-s2-bk4-bk5-appendix.txt
      (sections 276-383, Songs of Prince Vogelfrei), with Kaufmann's footnotes
      inline. Printed page numbers appear as running heads. OCR garbles some
      section numerals (347 prints as '341'). Kaufmann's notes are reliable
      cross-reference pointers and are cited as his.
    role: >
      The death of God as one argument (108-125, 343); amor fati (276); style
      (290); the heaviest weight (341, with 285 as first appearance);
      consciousness (354); the will to truth (344, 357); romantic pessimism
      (370); perspectivism (354, 374); the homeless good Europeans (377); the
      great health (382). Central to modules 1, 2, 6, 7.

  - title: "Thus Spoke Zarathustra (1883-85)"
    author: "F. Nietzsche; trans. W. Kaufmann, in The Portable Nietzsche, Viking 1954 / Penguin 1976, with Kaufmann's editor's notes"
    url: "https://www.penguinrandomhouse.com/books/295413/the-portable-nietzsche-by-friedrich-nietzsche/"
    kind: primary
    access: full
    access_note: >
      All four parts read from the human-staged Portable PDF:
      texts/zarathustra-full.txt (printed pp. 115-439; printed page = PDF
      page - 12), with Kaufmann's per-part notes (pp. 115-120, 191-194,
      260-263, 344-349), which are his readings and are cited as such. The
      phrase 'amor fati' and the words 'perspectivism' and 'master/slave
      morality' do not occur in Z; 'nothing is true, all is permitted' is the
      Shadow's (Z IV 9).
    role: >
      Illustration inside lessons, never a lesson: Prologue (overman, last
      man, rope), the three metamorphoses, the body as great reason (I 4), the
      pale criminal (I 6), the new idol (I 11), the thousand and one goals (I
      15), pitying (II 3), tarantulas (II 7), self-overcoming (II 12),
      redemption (II 20), the vision and the riddle (III 2), the convalescent
      (III 13), the drunken song (IV 19).

  - title: "Beyond Good and Evil (1886)"
    author: "F. Nietzsche; trans. H. Zimmern (1907, Gutenberg #4363) with the course's own translation from the German (Gutenberg #7204); W. Kaufmann (Vintage 1966) for comparison"
    url: "https://www.gutenberg.org/ebooks/4363"
    kind: primary
    access: full
    access_note: >
      Whole book read in Zimmern's English (texts/bge-zimmern.txt; sidecar
      lists the line at which each load-bearing section starts) except
      232-249 and 252-256, which were skimmed only (the emancipation-of-woman
      sections 231-239 must be read directly by the lesson writer of
      herd-morality-in-modern-dress); German spot-checked for the Preface and
      sections 1-4, 6, 9, 12, 13, 17, 19, 21, 22, 34, 36, 43, 55, 56, 62, 68,
      108, 189, 195, 211, 212, 225, 229, 257, 260, 287 (texts/bge-german.txt,
      an older Naumann-type text, NOT eKGWB: verify every German wording
      against eKGWB JGB-n). Known Zimmern slips: s.13 'Psychologists' for
      Physiologen; 'instinct' for Trieb; 'sympathy' for Mitleid; s.229
      'intensifying/transfigured' for Vertiefung/vergoettlicht; s.4 'any
      objection' for 'noch kein Einwand'; s.257 'in some form or other' for
      'in irgend einem Sinne'. The word 'ressentiment' does not occur in BGE.
    role: >
      The prejudices of philosophers (1-23: will to truth, untruth as a
      condition of life, soul-atomism, will to power, willing, causa sui),
      the conditional world-hypothesis (36), the religious cruelty ladder
      (55), da capo (56), the natural history of morals (186-203), the
      philosopher as legislator (211), 'our virtues' (225-230, cruelty), the
      Jews and the new ruling caste (251), and 'What Is Noble?' (257-296),
      read whole as the application of module 8. Grounds modules 2, 3, 5, 6,
      8, 9.

  - title: "On the Genealogy of Morals (1887)"
    author: "F. Nietzsche; trans. W. Kaufmann & R. J. Hollingdale, Vintage 1989 (bound with Ecce Homo), with Kaufmann's notes"
    url: "https://www.penguinrandomhouse.com/books/121946/on-the-genealogy-of-morals-and-ecce-homo-by-friedrich-nietzsche/"
    kind: primary
    access: full
    access_note: >
      Preface and all three essays read from the human-staged PDF:
      texts/genealogy--text.txt (printed pp. 15-163; printed page = PDF page
      - 8), Kaufmann's footnotes inline (they argue a humanizing reading of
      the blond beast and the Jewish passages and are cited as his). OCR noisy
      but complete.
    role: >
      Modules 3 and 4 entire: method (Preface, II 12-13), good/bad and
      good/evil (I), the slave revolt and ressentiment (I 7-16), debt,
      cruelty, bad conscience, guilt (II), the ascetic ideal, the priest and
      the will to truth (III), with III 1-10 read whole as the application of
      module 4; perspectivism (III 12); the hard passages of I 5, I 11, I 16,
      II 7, III 14 quoted whole.

  - title: "The Case of Wagner (1888)"
    author: "F. Nietzsche; trans. T. Common (Foulis 1911, Gutenberg #25012); section 3 also in W. Kaufmann's Portable Nietzsche (pp. 459-461)"
    url: "https://www.gutenberg.org/ebooks/25012"
    kind: primary
    access: full
    access_note: >
      Whole pamphlet read from the text (Preface, 1-12, Postscript, Second
      Postscript, Epilogue): texts/early-wa.txt. Common's English; key
      sentences re-translated from the German (verify against eKGWB WA).
      Nietzsche contra Wagner is read complete in Kaufmann's Portable
      (texts/portable-late.txt pp. 661-683).
    role: >
      Decadence diagnosed in an artist, read whole as the application of
      module 1 (case-of-wagner); the Epilogue's master-morality against
      Christian morality.

  - title: "Twilight of the Idols and The Antichrist (1888), with Nietzsche contra Wagner (1888/1895)"
    author: "F. Nietzsche; trans. W. Kaufmann, in The Portable Nietzsche, Viking 1954 / Penguin 1976"
    url: "https://www.penguinrandomhouse.com/books/295413/the-portable-nietzsche-by-friedrich-nietzsche/"
    kind: primary
    access: full
    access_note: >
      TI complete (pp. 463-563), A complete (565-656; the 'Law Against
      Christianity' is not included), NcW complete (661-683), plus Kaufmann's
      Introduction and Chronology, the early notes and letters, HH/MOM/WS/D/GS
      selections, BGE and GM selections, notes of 1885-88 and the January 1889
      letters: texts/portable-early.txt (pp. 1-102) and texts/portable-late.txt
      (pp. 440-687). This supersedes the Ludovici translation staged earlier
      (texts/twilightof.txt), which is kept only as a fallback; the briefs use
      Kaufmann's chapter names and pages.
    role: >
      The problem of Socrates, 'reason' in philosophy, the fable of the true
      world, morality as anti-nature, the Four Great Errors (read whole as
      the application of module 2), the 'Improvers', the Skirmishes (33-41
      read whole as the application of module 5), the Antichrist on pity,
      Jesus and Paul (24-47 read whole as the application of module 3), Manu
      and the castes (56-58).

  - title: "Ecce Homo (1888, published 1908)"
    author: "F. Nietzsche; trans. W. Kaufmann, Vintage 1989 (bound with the Genealogy), with Kaufmann's Introduction, Note on the Publication and Appendix of drafts"
    url: "https://www.penguinrandomhouse.com/books/121946/on-the-genealogy-of-morals-and-ecce-homo-by-friedrich-nietzsche/"
    kind: primary
    access: full
    access_note: >
      Whole book read from the human-staged PDF: texts/eccehomo-full.txt
      (printed pp. 201-343; printed page = PDF page - 8). The OCR drops some
      section numerals (Wise 3 and 6, Clever 3); the reader reconstructed
      them. The restored page of EH I 3 (mother and sister as 'the deepest
      objection to the eternal recurrence'; 'Julius Caesar could be my
      father') is NOT in this edition: cite as KSA 6 / eKGWB EH-Weise-3, to
      verify against the Colli-Montinari text.
    role: >
      The application text of the affirmation module (ecce-homo, read whole);
      amor fati as the formula for greatness (II 10); how one becomes what
      one is (II 9); the anti-legend (IV 1); Nietzsche's own map of his books
      (III) for the-system-assembled; the deleted drafts on Forster and
      antisemitism for the-nazi-appropriation.

  - title: "Writings from the Late Notebooks (notebooks April 1885 - July 1888)"
    author: "F. Nietzsche; ed. R. Bittner, trans. K. Sturge, Cambridge 2003"
    url: "https://www.cambridge.org/core/books/nietzsche-writings-from-the-late-notebooks/"
    kind: primary
    access: full
    access_note: >
      Whole volume read from the human-staged PDF: texts/latenotebooks-full.txt
      (printed page = PDF page - 46); Bittner's Introduction pp. ix-xxxiv
      (a sceptic's reading, cited as his). OCR loses many KSA fragment
      labels, so pointers give the printed page and the fragment number only
      where legible. Bittner selected about a third of the period's notes:
      the 1881 recurrence notes and the 'all possible combinations' proof
      (KSA 9; KSA 13, 14[188]) are outside the volume and must be verified
      against eKGWB. EVERY passage is unpublished and is cited so.
    role: >
      Will to power as psychology and as cosmology beyond BGE 36 (14[121],
      36[31], 38[12]); the recurrence argument (36[15], 5[54], 5[71]); the
      nihilism typology (5[71] Lenzer Heide, 9[35], 11[99]); 'truth is the
      kind of error' (34); perspectivism (7[60]); the breeding and
      master-race notes (37[5], 2[13], 9[153], 10[50]) quoted whole for
      order-of-rank, nietzsche-and-politics and the-nazi-appropriation.

  - title: "The Will to Power (posthumous compilation, 1901/1906)"
    author: "ed. E. Foerster-Nietzsche & P. Gast; trans. W. Kaufmann & R. J. Hollingdale, Random House 1967"
    url: "https://openlibrary.org/works/OL1100213W"
    kind: primary
    access: not-found
    access_note: >
      Catalogue pages only. Used solely as an object of study (the
      compilation and its editors) and for WP numbers that the secondary
      literature cites; every such note is marked unpublished and re-pointed
      to Bittner's volume where the note is in it. A concordance check
      (eKGWB) is owed wherever only a WP number is known.
    role: "The forged 'main work': nietzsche-life-and-books, the-nazi-appropriation."

  - title: "Digital Critical Edition of the Works and Letters (eKGWB), Colli-Montinari text"
    author: "ed. P. D'Iorio, nietzschesource.org"
    url: "https://www.nietzschesource.org"
    kind: primary
    access: summary-based
    access_note: >
      Site unreachable from this network during both reads (ECONNREFUSED /
      timeouts). Read only D'Iorio's description
      (texts/nietzschesou-ekgwb-description.pdf/.txt): URL scheme
      /eKGWB/<siglum> (e.g. JGB-257, GM-I-13, NF-1887,5[71]), the five
      Montinari categories, CC BY-NC-SA 3.0. Every German wording quoted from
      a Gutenberg text, the EH I 3 restored page and every WP number must be
      checked on the live site before a lesson is drafted.
    role: >
      The verification and citation layer for German originals; the
      published/unpublished test.

  # -------------------------------------------------------------- secondary
  - title: "Nietzsche: Philosopher, Psychologist, Antichrist"
    author: "W. Kaufmann, 4th ed. 1974 (Princeton Classics 2013, foreword A. Nehamas)"
    url: "https://press.princeton.edu/books/paperback/9780691160276/nietzsche"
    kind: secondary
    access: full
    access_note: "Staged PDF plus four text shards (texts/nietzschephi-s1..s4). Facsimiles of four letters at the back (two captured in research/images/)."
    role: >
      The life (Ch. 1) and the letters, used for life facts in place of the
      unread Young; method and the aphorism (Ch. 2); the anti-Nazi case and
      the clipped quotations (Ch. 10); Simmel's wheels (Ch. 11). Kaufmann's
      humanizing readings (sublimation, breeding as discipline, the blond
      beast as lion, 'anti-political') are ONE interpretation the course
      tests against the text, never the default.

  - title: "Nietzsche: A Very Short Introduction"
    author: "M. Tanner, Oxford 1994"
    url: "https://global.oup.com/academic/product/nietzsche-a-very-short-introduction-9780192854148"
    kind: secondary
    access: full
    access_note: "Read in full (texts/nietzschea-full.txt)."
    role: >
      Life context in place of the unread Young; the Auschwitz thought
      experiment on recurrence (the atrocity objection, answered from
      Nietzsche's side); the aesthetic-justification objection.

  - title: "Friedrich Nietzsche: A Philosophical Biography"
    author: "J. Young, Cambridge 2010"
    url: "https://www.cambridge.org/core/product/CDE4B7D62E89CA1E8D2BF7B346248AD6"
    kind: secondary
    access: toc-only
    access_note: "Contents of chs. 1-22 and one review read; NOT read. No lesson cites Young for a specific fact; life facts come from Kaufmann's monograph, Tanner and the letters in the Portable. NEEDS A FULL COPY if the human wants a biography check."
    role: "Life context (Pforta, Basel, Wagner, Lou Salome, the madness) for nietzsche-life-and-books, case-of-wagner, ecce-homo, once read."

  - title: "Nietzsche: Life as Literature"
    author: "A. Nehamas, Harvard 1985"
    url: "https://www.hup.harvard.edu/books/9780674624368"
    kind: secondary
    access: full
    access_note: "Staged PDF and texts/nietzschelif-full.txt."
    role: >
      Perspectivism without relativism and the self-refutation reply (Ch. 2);
      recurrence as a view of the self (Ch. 5); becoming who one is and style
      (Ch. 6). The fork partner at eternal-recurrence and becoming-who-you-are.

  - title: "The Affirmation of Life: Nietzsche on Overcoming Nihilism"
    author: "B. Reginster, Harvard 2006"
    url: "https://www.hup.harvard.edu/books/9780674034808"
    kind: secondary
    access: full
    access_note: "Staged PDF and texts/theaffirmati-full.txt."
    role: >
      Nihilism as despair and its hidden premise (Ch. 1); will to power as
      overcoming resistance (Ch. 3); the ethics of power and pity (Ch. 4);
      recurrence as substantive affirmation (Ch. 5); amor fati and the
      overman (Ch. 6).

  - title: "The Soul of Nietzsche's Beyond Good and Evil"
    author: "M. Clark & D. Dudrick, Cambridge 2012"
    url: "https://www.cambridge.org/core/books/soul-of-nietzsches-beyond-good-and-evil/"
    kind: secondary
    access: full
    access_note: "Staged PDF and texts/thesoul-full.txt. Its 'Plato refined' framing of BGE 12 and its link of GM II 11 to III 12 are the authors' readings, not Nietzsche's words."
    role: >
      Close reconstruction of BGE 1-23 and 36: will to truth and will to
      value, the soul as a political order of drives, willing as command, will
      to power as psychology not cosmology.

  - title: "Nietzsche's Moral and Political Philosophy (Stanford Encyclopedia of Philosophy)"

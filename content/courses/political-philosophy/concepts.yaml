concepts:
  # --- Module 1: The Greek discovery of politics ---
  - id: polis
    name: Polis
    definition: "The Greek city-state: a self-governing community of citizens whose public affairs are decided in common, in the open, by speech — the unit in which political theory first became possible"
    introduced_in: greek-miracle
  - id: es-meson
    name: Es meson (in the middle)
    definition: "The Greek practice of placing power, spoils, law and debate 'in the middle' of the assembled community rather than in a king's house — the spatial form of equality among peers"
    introduced_in: greek-miracle
  - id: isonomia
    name: Isonomia
    definition: "Equality before the law and equal share in rule among citizens; the democratic ideal that grew out of the aristocratic 'equality of peers' in the hoplite city"
    introduced_in: greek-miracle
  - id: justice-as-advantage-of-the-stronger
    name: Justice as the advantage of the stronger
    definition: "Thrasymachus's thesis (Republic I) that every regime makes laws in its rulers' interest and calls obedience 'justice'; the recurring realist challenge the tradition keeps answering"
    introduced_in: thrasymachus-and-the-ring
  - id: ring-of-gyges
    name: Ring of Gyges
    definition: "Glaucon's thought experiment (Republic II): a ring of invisibility would make the just and unjust man act alike, so justice is practised only from fear of being caught"
    introduced_in: thrasymachus-and-the-ring
  - id: city-soul-analogy
    name: City–soul analogy
    definition: "Plato's method of reading justice in the city 'as in large letters' and then finding the same structure — three parts, one ruling — in the individual soul"
    introduced_in: kallipolis-and-the-philosopher-king
  - id: three-classes
    name: Three classes
    definition: "Plato's division of the city into producers, auxiliaries (soldiers) and guardians (rulers), each doing its own work; justice is the arrangement in which no class usurps another's task"
    introduced_in: kallipolis-and-the-philosopher-king
  - id: noble-lie
    name: Noble lie
    definition: "The founding myth (earth-born citizens, metals in the soul) Plato's rulers tell the ruled so the class order is accepted as natural; a 'medicinal' falsehood permitted to rulers alone"
    introduced_in: kallipolis-and-the-philosopher-king
  - id: philosopher-king
    name: Philosopher king
    definition: "Plato's answer to 'who should rule': the one who knows the good, compelled to govern a city he would rather leave; 'until philosophers are kings, cities will have no rest from evils'"
    introduced_in: kallipolis-and-the-philosopher-king
  - id: allegory-of-the-cave
    name: Allegory of the Cave
    definition: "Republic VII's image of prisoners taking shadows for reality, released into the light, and returning to rule those still below — education as turning the whole soul, and the philosopher's duty to descend"
    introduced_in: kallipolis-and-the-philosopher-king
  - id: regime-cycle
    name: Regime cycle
    definition: "The sequence in which each regime generates the next — aristocracy, timocracy, oligarchy, democracy, tyranny in Plato; the anacyclosis of Polybius and Machiavelli — driven by the ruling class's own characteristic desire"
    introduced_in: decline-of-regimes
  - id: democratic-man
    name: Democratic man
    definition: "Plato's portrait of the citizen bred by democracy: ruled by whichever desire arrives, treating all pleasures as equal, calling licence freedom — the type Tocqueville and Ortega later re-describe"
    introduced_in: decline-of-regimes
  - id: preamble-to-law
    name: Preamble to law
    definition: "Plato's device in the Laws of prefacing each statute with a persuasive address, so that law instructs like a free man's doctor before it compels like a slave's"
    introduced_in: platos-laws-second-best-city
  - id: mixed-constitution
    name: Mixed constitution
    definition: "A regime combining monarchic, aristocratic and popular elements so that each checks the others (Sparta in the Laws, Rome for Polybius and Cicero); rejected by Bodin and Hobbes as no regime at all"
    introduced_in: decline-of-regimes
  - id: political-animal
    name: Political animal (zoon politikon)
    definition: "Aristotle's claim that man is by nature fitted for the city because he alone has speech about the just and the useful; the city is natural and prior to the individual, who cannot be complete outside it"
    introduced_in: aristotle-political-animal-and-natural-slavery
  - id: natural-slavery
    name: Natural slavery
    definition: "Aristotle's thesis (Politics I.4–7) that some men are slaves by nature, able to apprehend reason but not to possess it, so that rule over them benefits both — with his own concession that nature often fails to mark them"
    introduced_in: aristotle-political-animal-and-natural-slavery
  - id: greek-barbarian
    name: Greek and barbarian
    definition: "The Greek division of mankind by language and way of life, which Aristotle grounds in climate (spirited Europeans, intelligent but servile Asians, Greeks in between) and uses to limit who may be a citizen"
    introduced_in: aristotle-political-animal-and-natural-slavery
  - id: chrematistics
    name: Chrematistics
    definition: "Aristotle's name for wealth-getting pursued without limit, as against household management, which acquires only what the good life needs; usury is its most unnatural form"
    introduced_in: aristotle-political-animal-and-natural-slavery
  - id: six-regimes
    name: Six regimes
    definition: "Aristotle's classification by number of rulers and by end: kingship, aristocracy and polity rule for the common good; tyranny, oligarchy and democracy for the rulers' own"
    introduced_in: aristotle-regimes-and-the-middle
  - id: polity
    name: Polity
    definition: "Aristotle's mixed regime of the many under law, blending oligarchic and democratic devices and resting on a large middle class — the best regime most cities can actually have"
    introduced_in: aristotle-regimes-and-the-middle
  - id: rule-of-law
    name: Rule of law
    definition: "Aristotle's argument (Politics III.15–16) that it is better for law to rule than the best man, because law is reason without appetite and 'he who bids man rule adds the beast'"
    introduced_in: aristotle-regimes-and-the-middle
  - id: wisdom-of-the-multitude
    name: Wisdom of the multitude
    definition: "Aristotle's case (Politics III.11) that many ordinary judges together, like guests at a potluck feast, may judge better than any one expert — the ground of popular participation in courts and assemblies"
    introduced_in: aristotle-regimes-and-the-middle
  - id: stasis
    name: Stasis (faction)
    definition: "Civil strife within a city, which Aristotle traces to rival partial conceptions of equality — the poor claiming equality in all things because equal in freedom, the rich superiority in all because superior in wealth"
    introduced_in: aristotle-faction-and-the-best-life
  - id: common-good
    name: Common good
    definition: "The end a correct regime serves and a deviant one betrays — for Aristotle the good life of the whole community, for Aquinas the measure by which a law counts as law"
    introduced_in: aristotle-faction-and-the-best-life
  - id: spartan-constitution
    name: Spartan constitution
    definition: "The regime of two hereditary kings, a council of elders, five elected ephors and an assembly of citizen-equals living off helot labour — the test case every ancient theorist admired and faulted"
    introduced_in: sparta-as-test-case

  # --- Module 2: Rome and the remaking of Christianity ---
  - id: res-publica
    name: Res publica
    definition: "Cicero's definition of a commonwealth as 'the affair of the people' (res populi) — a thing that belongs to the people and exists only while they are a people"
    introduced_in: cicero-res-publica-and-natural-law
  - id: populus
    name: Populus
    definition: "Cicero's definition of a people: not any gathering but a multitude united by agreement about right (iuris consensus) and community of interest — the definition Augustine will test on Rome"
    introduced_in: cicero-res-publica-and-natural-law
  - id: natural-law
    name: Natural law
    definition: "Right reason in agreement with nature, universal and unchanging, by which statutes are judged and unjust statutes are not law (Cicero, Laws I–II); developed by Aquinas, Vitoria and Strauss"
    introduced_in: cicero-res-publica-and-natural-law
  - id: just-war
    name: Just war
    definition: "The doctrine that war is lawful only for defence or redress of injury, formally declared and with faith kept — stated by Cicero, systematised by Aquinas and Vitoria, and attacked by Schmitt as a weapon"
    introduced_in: cicero-res-publica-and-natural-law
  - id: hellenization
    name: Hellenization of Christianity
    definition: "Harnack's thesis that the Gospel, a Jewish movement, was recast within two centuries in Greek philosophical concepts and then Roman institutional forms, so that the Church Europe received was a Greco-Roman construction"
    introduced_in: hellenization-of-christianity
  - id: kernel-and-husk
    name: Kernel and husk
    definition: "Harnack's method of separating the permanent core of the Gospel (the Father, the infinite value of the soul, the higher righteousness) from the historically contingent forms it was wrapped in"
    introduced_in: hellenization-of-christianity
  - id: logos-christology
    name: Logos Christology
    definition: "The identification of Christ with the Greek Logos (the rational principle of the cosmos), which made the Jewish Messiah intelligible to Greeks and turned the Gospel into a doctrine about the nature of God"
    introduced_in: hellenization-of-christianity
  - id: pseudomorphosis
    name: Pseudomorphosis
    definition: "Spengler's term, borrowed from mineralogy, for a young Culture forced to grow inside the forms of an older one — his reading of early Christianity as a Magian religion misshapen in Classical moulds"
    introduced_in: hellenization-of-christianity
  - id: representation-existential
    name: Existential representation
    definition: "Voegelin's term for the articulation by which a society acquires a representative who can act for it and so exist in history — as distinct from merely elemental (electoral) representation"
    introduced_in: constantine-and-representation
  - id: civil-theology
    name: Civil theology
    definition: "Varro's category of the gods a city worships as the condition of its own existence (the imperial cult, the ancestral rites) — religion as the self-representation of a political order"
    introduced_in: constantine-and-representation
  - id: political-theology
    name: Political theology
    definition: "The claim that a political order's authority rests on, or mirrors, a theological structure — the emperor as God's representative for Eusebius; later, for Schmitt, the thesis that modern state concepts are secularised theology"
    introduced_in: constantine-and-representation
  - id: two-cities
    name: Two cities
    definition: "Augustine's division of mankind into the city of God, formed by love of God, and the earthly city, formed by love of self, intermingled in history and separated only at the end"
    introduced_in: augustine-two-cities
  - id: libido-dominandi
    name: Libido dominandi
    definition: "The lust of ruling — Augustine's name for the drive that founds and governs the earthly city, visible in Cain and Romulus, and the reason its peace is always a truce between wills to dominate"
    introduced_in: augustine-two-cities
  - id: ordo-amoris
    name: Ordo amoris (order of love)
    definition: "Augustine's definition of virtue as rightly ordered love: passions are good or evil not in themselves but according to what they love and in what order"
    introduced_in: augustine-two-cities
  - id: splendid-vices
    name: Splendid vices
    definition: "The Augustinian verdict (City of God XIX.25) that pagan virtues, lacking true religion, are vices in disguise, since they serve glory rather than God — the judgment Machiavelli inverts"
    introduced_in: augustine-two-cities

  # --- Module 3: From Christendom to the sovereign state ---
  - id: eternal-law
    name: Eternal law
    definition: "Aquinas's name for the divine reason governing the whole universe, in which natural law is the rational creature's participation and from which every human law derives whatever force it has"
    introduced_in: aquinas-law-and-kingship
  - id: human-law-determination
    name: Human law as determination
    definition: "Aquinas's account of how human law comes from natural law: either as a conclusion (murder is forbidden) or as a determination that fixes what nature leaves open (the penalty, the side of the road)"
    introduced_in: aquinas-law-and-kingship
  - id: unjust-law-not-law
    name: Unjust law is not law
    definition: "The Thomist thesis that a statute contrary to natural law is violence rather than law and does not bind in conscience — qualified by the duty to obey where disobedience would cause scandal or disorder"
    introduced_in: aquinas-law-and-kingship
  - id: tyrannicide
    name: Tyrannicide
    definition: "The question whether a subject may kill a tyrant — denied by Aquinas for private persons (deposition belongs to public authority) and by Bodin absolutely, affirmed by the sixteenth-century resistance tracts"
    introduced_in: aquinas-law-and-kingship
  - id: effectual-truth
    name: Effectual truth (verità effettuale)
    definition: "Machiavelli's standard in The Prince XV: to describe how men actually keep power rather than how they ought to, since one who acts on 'what ought to be' is ruined among so many who do not"
    introduced_in: machiavelli-effectual-truth
  - id: virtu-and-fortuna
    name: Virtù and fortuna
    definition: "Machiavelli's pair: the prince's energy, foresight and daring (virtù) against the chance and circumstance (fortuna) that supplies the occasion and can sweep him away — fortune as a river to be dyked"
    introduced_in: machiavelli-effectual-truth
  - id: armed-prophet
    name: Armed prophet
    definition: "Machiavelli's thesis (Prince VI) that founders who bring new orders succeed only if they can compel belief by force — Moses, Cyrus, Romulus — while unarmed prophets like Savonarola are ruined"
    introduced_in: machiavelli-effectual-truth
  - id: cruelty-well-used
    name: Cruelty well used
    definition: "Machiavelli's distinction (Prince VIII, XVII) between cruelties done once, at the start, for security, which may be forgiven, and cruelties that grow with time, which cannot"
    introduced_in: machiavelli-effectual-truth
  - id: conflict-as-source-of-liberty
    name: Conflict as the source of liberty
    definition: "Machiavelli's claim (Discourses I.4) that the quarrels between Roman nobles and people, which other writers called a disease, produced the laws and institutions that kept Rome free"
    introduced_in: machiavelli-discourses-republic
  - id: civil-religion
    name: Civil religion
    definition: "Religion valued for its political function — Numa's cults that made Romans fear oaths more than laws; Machiavelli's measure by which Christianity's otherworldliness counts as a civic weakness"
    introduced_in: machiavelli-discourses-republic
  - id: return-to-beginnings
    name: Return to beginnings
    definition: "Machiavelli's thesis (Discourses III.1) that states and religions survive only by periodic renewal that brings them back to their founding principles, by shock or by exemplary punishment"
    introduced_in: machiavelli-discourses-republic
  - id: sovereignty
    name: Sovereignty
    definition: "Bodin's definition: the absolute and perpetual power of a commonwealth, whose essential mark is making law for all subjects without their consent and being bound by no positive law — only by divine and natural law"
    introduced_in: bodin-sovereignty
  - id: state-vs-government
    name: Form of state vs form of government
    definition: "Bodin's distinction between who holds sovereignty (one, few, many) and how it is exercised (royally, despotically, tyrannically; by aristocratic or popular distribution of offices) — a monarchy can be governed democratically"
    introduced_in: bodin-sovereignty
  - id: politique-toleration
    name: Politique toleration
    definition: "The position of the French politiques, Bodin among them, that a sovereign should tolerate two religions rather than ruin the state enforcing one — toleration grounded in the state's survival, not in rights"
    introduced_in: bodin-sovereignty
  - id: state-of-nature
    name: State of nature
    definition: "The condition of men without a common power over them: for Hobbes a war of all against all; for Locke a condition under the law of nature with inconveniences; for Rousseau a solitary innocence society destroyed"
    introduced_in: hobbes-state-of-nature-and-covenant
  - id: laws-of-nature
    name: Laws of nature (Hobbes)
    definition: "Hobbes's theorems of reason about what conduces to peace — seek peace, lay down rights reciprocally, keep covenants — which bind in conscience but are mere words without a sword to enforce them"
    introduced_in: hobbes-state-of-nature-and-covenant
  - id: covenant
    name: Covenant
    definition: "Hobbes's mutual agreement of every man with every man to authorise one person or assembly as sovereign — the act that makes a multitude one person and generates the commonwealth"
    introduced_in: hobbes-state-of-nature-and-covenant
  - id: authorization
    name: Authorization
    definition: "Hobbes's theory of representation: subjects are the authors of the sovereign's acts as of their own, so that to complain of the sovereign is to complain of oneself"
    introduced_in: hobbes-state-of-nature-and-covenant
  - id: indivisible-sovereignty
    name: Indivisible sovereignty
    definition: "Hobbes's and Bodin's thesis that sovereign power cannot be shared or mixed: a kingdom divided between king and parliament is two commonwealths, and such division is the cause of civil war"
    introduced_in: hobbes-sovereign-and-liberty
  - id: liberty-as-silence-of-law
    name: Liberty as the silence of the law
    definition: "Hobbes's definition of a subject's liberty as freedom to act wherever the sovereign has made no rule — against the 'ancient liberty' of sharing in rule, which he calls the liberty of the commonwealth, not of men"
    introduced_in: hobbes-sovereign-and-liberty
  - id: protection-and-obedience
    name: Protection and obedience
    definition: "The Hobbesian principle that a subject's obligation lasts exactly as long as the sovereign's power to protect him — restated by Schmitt as protego ergo obligo, the cogito of the state"
    introduced_in: hobbes-sovereign-and-liberty

  # --- Module 4: Consent, Revolution and Reaction ---
  - id: labour-theory-of-property
    name: Labour theory of property
    definition: "Locke's argument that a person owns what he has mixed his labour with, limited by spoilage and by leaving 'enough and as good' for others — limits that money and consent later dissolve"
    introduced_in: locke-property-and-consent
  - id: consent
    name: Consent
    definition: "Locke's ground of legitimate government: no one can be subjected to political power without his own agreement, express or tacit — the premise the whole contract tradition shares and its critics deny"
    introduced_in: locke-property-and-consent
  - id: right-of-resistance
    name: Right of resistance
    definition: "Locke's conclusion that when a government breaks its trust — alters the legislative, rules by arbitrary will — power reverts to the people, who may resist and set up a new one"
    introduced_in: locke-property-and-consent
  - id: appeal-to-heaven
    name: Appeal to heaven
    definition: "Locke's name for the situation where there is no earthly judge between ruler and people and each must judge for himself and answer to God — his answer to 'who shall be judge?'"
    introduced_in: locke-property-and-consent
  - id: amour-propre
    name: Amour-propre
    definition: "Rousseau's name for the comparative self-love born of society — the need to be esteemed above others — as distinct from the natural self-preservation (amour de soi) of solitary man"
    introduced_in: rousseau-inequality-and-general-will
  - id: general-will
    name: General will
    definition: "Rousseau's conception of the will of the sovereign people aiming at the common good, distinct from the 'will of all' (the sum of private wills); obeying it, one obeys only oneself — even when 'forced to be free'"
    introduced_in: rousseau-inequality-and-general-will
  - id: legislator
    name: Legislator
    definition: "Rousseau's extraordinary founder who frames a people's laws without holding power over them, speaking in the name of the gods because the people cannot yet see what is good for them"
    introduced_in: rousseau-inequality-and-general-will
  - id: civil-religion-rousseau
    name: Civil religion (Rousseau)
    definition: "Rousseau's civil profession of faith — a few positive dogmas and one negative (no intolerance) — required of citizens not as truth but as sentiments of sociability"
    introduced_in: rousseau-inequality-and-general-will
  - id: entailed-inheritance
    name: Entailed inheritance
    definition: "Burke's conception of liberty and the constitution as an estate handed down from ancestors to posterity, to be improved but never alienated — against rights framed from abstract principle"
    introduced_in: burke-reflections
  - id: prejudice
    name: Prejudice (Burke)
    definition: "Burke's term for settled judgment inherited with its reasons latent — 'the general bank and capital of nations and of ages' — which the individual should cherish rather than trade for his own small stock of reason"
    introduced_in: burke-reflections
  - id: little-platoon
    name: Little platoon
    definition: "Burke's phrase for the local attachments (family, neighbourhood, order) that are the first link in the chain of public affections — the seed of every later conservative account of the nation"
    introduced_in: burke-reflections
  - id: natural-aristocracy
    name: Natural aristocracy
    definition: "Burke's claim that leisure, education, property and habit of command fit some for rule in any society, so that a legislature of lawyers and curates is a departure from nature, not a return to it"
    introduced_in: burke-reflections
  - id: partnership-of-generations
    name: Partnership of generations
    definition: "Burke's redefinition of the social contract as a partnership 'between those who are living, those who are dead, and those who are to be born' — a trust no single generation may break"
    introduced_in: burke-reflections
  - id: providence-in-history
    name: Providence in history
    definition: "Maistre's reading of the Revolution as an act of God carried out through men who believe they lead it — 'it is not men who lead the Revolution, it is the Revolution that uses men'"
    introduced_in: maistre-and-bonald
  - id: no-such-thing-as-man
    name: No such thing as man
    definition: "Maistre's rejection of the Rights of Man: 'I have seen Frenchmen, Italians, Russians… but man I have never met' — only historically formed peoples exist, and no constitution can be written for man in general"
    introduced_in: maistre-and-bonald
  - id: executioner
    name: The executioner
    definition: "Maistre's figure for the hidden foundation of social order (First Dialogue): the man all honour shuns, without whom 'order gives way to chaos, thrones fall, and society disappears'"
    introduced_in: maistre-and-bonald
  - id: counter-revolution
    name: Counter-revolution
    definition: "Maistre's thesis that the restoration will be 'not a contrary revolution but the contrary of a revolution' — a return accomplished by Providence through events, not by a reversed act of will"
    introduced_in: maistre-and-bonald
  - id: war-as-expiation
    name: War as expiation
    definition: "Maistre's doctrine (Seventh Dialogue) that war is a divine law under which the earth demands blood and the innocent pay for the guilty — the soldier honoured because he kills under this law"
    introduced_in: maistre-and-bonald
  - id: ethical-life
    name: Ethical life (Sittlichkeit)
    definition: "Hegel's term for freedom realised in shared institutions — family, civil society, state — that a person inhabits as second nature, as against abstract right and private morality"
    introduced_in: hegel-ethical-life-and-the-state
  - id: civil-society
    name: Civil society (Hegel)
    definition: "The sphere of needs, labour, exchange and estates in which individuals pursue private ends and are bound to one another by interest — the 'external state' that the political state must integrate"
    introduced_in: hegel-ethical-life-and-the-state
  - id: rational-state
    name: Rational state
    definition: "Hegel's conception of the state as the actuality of the ethical Idea, in which the individual's freedom and the universal are reconciled — not a contract, not an instrument, but the end of history's work"
    introduced_in: hegel-ethical-life-and-the-state
  - id: world-history-as-judge
    name: World history as the court of judgment
    definition: "Hegel's thesis that conflicts between states are decided by world history, whose successive dominant nations carry the development of freedom — Schiller's 'Weltgeschichte ist das Weltgericht'"
    introduced_in: hegel-ethical-life-and-the-state

  # --- Module 5: Democracy and its critics ---
  - id: equality-of-conditions
    name: Equality of conditions
    definition: "Tocqueville's generative fact: the levelling of ranks, fortunes and education that has advanced for seven centuries and shapes laws, feelings and ideas — a providential fact to be guided, not resisted"
    introduced_in: tocqueville-equality-and-the-township
  - id: township
    name: Township
    definition: "The New England town meeting as Tocqueville's school of liberty: self-government in small things that teaches citizens the habits and interests that sustain it in large ones"
    introduced_in: tocqueville-equality-and-the-township
  - id: art-of-association
    name: Art of association
    definition: "Tocqueville's name for the citizens' capacity to combine for common purposes — the substitute in a democracy for the aristocratic bodies that once stood between individual and state"
    introduced_in: tocqueville-equality-and-the-township
  - id: mores
    name: Mores (manners)
    definition: "Tocqueville's term for the habits of heart and mind of a people — which he ranks above laws, and laws above physical circumstance, as what sustains a democratic republic"
    introduced_in: tocqueville-equality-and-the-township
  - id: tyranny-of-the-majority
    name: Tyranny of the majority
    definition: "Tocqueville's danger of an omnipotent majority with no mixed government to resist it, exercised over opinion as much as over law — the phrase Mill borrows for social tyranny"
    introduced_in: tocqueville-tyranny-of-majority-and-soft-despotism
  - id: individualism-tocqueville
    name: Individualism (Tocqueville)
    definition: "A calm and considered withdrawal into family and friends that equality breeds — distinct from egotism — and that leaves the state alone in the field"
    introduced_in: tocqueville-tyranny-of-majority-and-soft-despotism
  - id: soft-despotism
    name: Soft despotism
    definition: "Tocqueville's forecast of 'an immense tutelary power' that provides for a flock of timid and industrious citizens and spares them the trouble of living — servitude combined with popular sovereignty"
    introduced_in: tocqueville-tyranny-of-majority-and-soft-despotism
  - id: hero-worship
    name: Hero-worship
    definition: "Carlyle's thesis that reverence for great men is the tap-root of society and religion, that history is their biography, and that an age which cannot recognise them is ruled by quacks"
    introduced_in: carlyle-heroes
  - id: cash-nexus
    name: Cash-nexus
    definition: "Carlyle's phrase for a society in which payment is the only bond between men — his indictment of laissez-faire England, later borrowed by Marx"
    introduced_in: carlyle-heroes
  - id: aristocracy-of-talent
    name: Aristocracy of talent
    definition: "Carlyle's demand for government by the able rather than the well-born or the elected — Captains of Industry organising labour — and his doubt that a society without reverence could find them"
    introduced_in: carlyle-heroes
  - id: harm-principle
    name: Harm principle
    definition: "Mill's one simple principle: society may coerce an individual only to prevent harm to others; his own good is not a sufficient warrant"
    introduced_in: mill-liberty-and-its-limits
  - id: liberty-of-thought
    name: Liberty of thought and discussion
    definition: "Mill's case that silencing an opinion is always wrong: if true we lose truth, if false we lose the livelier apprehension of truth, if half-true we lose the remainder"
    introduced_in: mill-liberty-and-its-limits
  - id: individuality-mill
    name: Individuality (Mill)
    definition: "Mill's ideal of a character that chooses its own plan of life — the tree, not the machine — against the despotism of custom and the assimilation that democracy brings"
    introduced_in: mill-liberty-and-its-limits
  - id: civilized-community-clause
    name: Civilized-community clause
    definition: "Mill's limitation of the harm principle to 'human beings in the maturity of their faculties' and to civilized communities — barbarians may be ruled by a despotism aimed at their improvement"
    introduced_in: mill-liberty-and-its-limits
  - id: class-struggle
    name: Class struggle
    definition: "Marx's thesis that the history of all hitherto existing society is the struggle between oppressor and oppressed classes, each stage of production generating the class that overthrows it"
    introduced_in: marx-manifesto
  - id: bourgeois-revolution
    name: Bourgeois revolution
    definition: "Marx's account of the middle class as the most revolutionary force in history, dissolving every feudal and traditional bond into cash payment — 'all that is solid melts into air'"
    introduced_in: marx-manifesto
  - id: proletariat
    name: Proletariat
    definition: "The class of wage-labourers with no property and no nation, created by modern industry, which Marx expects to abolish class society itself"
    introduced_in: marx-manifesto
  - id: aristocratic-radicalism
    name: Aristocratic radicalism
    definition: "Brandes's label, which Nietzsche accepted, for his view that culture exists for its highest individuals (as in nietzsche/nietzsche-and-politics); here, the form in which the twentieth-century right received his critique of equality — whether it implies a politics is disputed"
    introduced_in: the-right-after-1945

  # --- Module 6: The crisis of liberal Europe ---
  - id: kultur-vs-zivilisation
    name: Kultur against Zivilisation
    definition: "Mann's wartime antithesis: German inwardness, music, Bildung and the apolitical Bürger against Western politics, literature, the Rights of Man and democracy — two incompatible ideas of how to live"
    introduced_in: mann-reflections
  - id: zivilisationsliterat
    name: Zivilisationsliterat
    definition: "Mann's type of the literary intellectual who politicises everything, turns art into advocacy and wants Germany defeated for its own good — the Jacobin in modern dress"
    introduced_in: mann-reflections
  - id: burgerlichkeit
    name: Bürgerlichkeit
    definition: "Mann's ideal of the German burgher — ethical, cultivated, unpolitical — as distinct from the French bourgeois (a class) and the Philister (a type without culture)"
    introduced_in: mann-reflections
  - id: mass-man
    name: Mass-man
    definition: "Ortega's type: a man of any social class who feels himself 'just like everyone else', demands rights without obligations, and is closed to any appeal above himself — the barbarian inside civilisation"
    introduced_in: ortega-revolt-of-the-masses
  - id: noblesse-oblige
    name: Noblesse oblige
    definition: "Ortega's redefinition of nobility as effort and obligation rather than inherited rank — the life that is lived as a discipline against the life that is lived as a right"
    introduced_in: ortega-revolt-of-the-masses
  - id: hyperdemocracy
    name: Hyperdemocracy
    definition: "Ortega's name for the condition in which the mass, instead of delegating to minorities, acts directly and imposes its tastes by material pressure — 'to be different is indecent'"
    introduced_in: ortega-revolt-of-the-masses
  - id: nation-as-project
    name: Nation as project
    definition: "Ortega's thesis (with Renan) that a nation is not blood, language or territory but a shared enterprise of common future — 'a daily plebiscite' — so that Europe could become one"
    introduced_in: ortega-revolt-of-the-masses
  - id: friend-enemy-distinction
    name: Friend–enemy distinction
    definition: "Schmitt's criterion of the political: the grouping of men into friends and enemies, with the real possibility of killing, independent of moral, aesthetic or economic distinctions"
    introduced_in: schmitt-concept-of-the-political
  - id: depoliticization
    name: Depoliticization
    definition: "Schmitt's charge that liberalism tries to dissolve politics into ethics and economics, discussion and trade — and thereby hides, rather than abolishes, the friend–enemy grouping"
    introduced_in: schmitt-concept-of-the-political
  - id: pluriverse-of-states
    name: Pluriverse of states
    definition: "Schmitt's thesis that the political presupposes a plurality of states and cannot survive in a world state; 'humanity' cannot wage war, so whoever invokes it is cheating"
    introduced_in: schmitt-concept-of-the-political
  - id: state-of-exception
    name: State of exception
    definition: "The situation in which the normal legal order is suspended; Schmitt's thesis that the sovereign is whoever decides that it obtains and what is then to be done"
    introduced_in: schmitt-political-theology
  - id: decisionism
    name: Decisionism
    definition: "Schmitt's position that legal order rests on a decision, not a norm: a norm cannot apply itself, and the decision that applies it is irreducible to legal reasoning"
    introduced_in: schmitt-political-theology
  - id: secularization-thesis
    name: Secularization thesis (Schmitt)
    definition: "The claim that all significant concepts of the modern theory of the state are secularised theological concepts — the omnipotent lawgiver from God, the exception from the miracle"
    introduced_in: schmitt-political-theology

  # --- Module 7: Civilizations ---
  - id: culture-vs-civilization-spengler
    name: Culture and Civilization (Spengler)
    definition: "Spengler's two stages in the life of a high Culture: the creative, soil-bound, form-making phase, and the Civilization that follows — world-cities, money, democracy, the machine — as its rigid old age"
    introduced_in: spengler-decline-of-the-west
  - id: prime-symbol
    name: Prime symbol
    definition: "Spengler's idea that each Culture has one root intuition of space — the Classical body, the Magian cavern, the Faustian infinite — expressed alike in its mathematics, art, religion and politics"
    introduced_in: spengler-decline-of-the-west
  - id: contemporaneity
    name: Contemporaneity (Spengler)
    definition: "Spengler's method of calling events in different Cultures 'contemporary' when they occupy the same stage of the life-cycle — Alexander and Napoleon, Rome in 100 BC and the West in 1918"
    introduced_in: spengler-decline-of-the-west
  - id: caesarism
    name: Caesarism
    definition: "Spengler's name for the rule of personal power that follows the exhaustion of democracy and money in the late Civilization — the stage he predicts for the West"
    introduced_in: spengler-decline-of-the-west
  - id: challenge-and-response
    name: Challenge and response
    definition: "Toynbee's mechanism of civilizational genesis and growth: a society arises when a creative minority responds successfully to a challenge neither too easy nor too hard"
    introduced_in: toynbee-challenge-and-response
  - id: creative-minority
    name: Creative minority
    definition: "Toynbee's agent of growth, whose responses the majority follows by mimesis; when it becomes a merely dominant minority ruling by force, breakdown has begun"
    introduced_in: toynbee-challenge-and-response
  - id: breakdown-of-civilizations
    name: Breakdown of civilizations
    definition: "Toynbee's account of decline as failure of self-determination — the nemesis of creativity, idolisation of an institution or technique, militarism — rather than fate, race or environment"
    introduced_in: toynbee-challenge-and-response
  - id: universal-state
    name: Universal state
    definition: "Toynbee's term for the empire (Rome, the Han) that unifies a civilization after its breakdown — a rally that is mistaken for recovery and in whose shell a universal church grows"
    introduced_in: toynbee-challenge-and-response
  - id: civilizational-fault-line
    name: Civilizational fault line
    definition: "Huntington's hypothesis that the main conflicts of the post-Cold-War world will run along the cultural boundaries between seven or eight civilizations rather than between ideologies or states"
    introduced_in: huntington-clash-of-civilizations
  - id: kin-country-syndrome
    name: Kin-country syndrome
    definition: "Huntington's observation that in conflicts across civilizational lines, states rally to parties of their own civilization — the Gulf War, Bosnia, the Caucasus"
    introduced_in: huntington-clash-of-civilizations
  - id: torn-country
    name: Torn country
    definition: "Huntington's category for a state whose elite seeks to redefine its civilizational identity (Turkey, Mexico, Russia) and the three conditions for success"
    introduced_in: huntington-clash-of-civilizations
  - id: measures-of-greatness
    name: Measures of greatness
    definition: "The three rival criteria by which a civilization's rank is judged — power over others, duration, and the ideas others take up — each implied by a different theory of decline"
    introduced_in: what-measures-greatness

  # --- Module 8: The postwar right ---
  - id: conservatism-as-disposition
    name: Conservatism as disposition
    definition: "Oakeshott's view that conservatism is not a doctrine but a disposition to prefer the familiar to the unknown, the tried to the untried, the actual to the possible"
    introduced_in: what-conservatism-is
  - id: positional-ideology
    name: Positional ideology
    definition: "Huntington's (1957) account of conservatism as the defence of whatever established order is under attack, with no content of its own — against the view that it has a fixed substantive core"
    introduced_in: what-conservatism-is
  - id: epistemic-conservatism
    name: Epistemic conservatism
    definition: "The argument from imperfect knowledge: no individual or generation knows enough to redesign society, so inherited institutions embody more reason than their critics can see"
    introduced_in: what-conservatism-is
  - id: conservative-vs-reactionary
    name: Conservative vs reactionary
    definition: "The distinction between one who preserves and reforms what exists and one who seeks to restore a lost order, with Lilla's addition that the reactionary, like the revolutionary, reads history as a rupture"
    introduced_in: what-conservatism-is
  - id: technical-vs-practical-knowledge
    name: Technical vs practical knowledge
    definition: "Oakeshott's distinction between knowledge that can be written in rules (the cookery book) and knowledge that exists only in use and is acquired by apprenticeship — the second being what politics mostly needs"
    introduced_in: oakeshott-rationalism-in-politics
  - id: rationalism-in-politics
    name: Rationalism in politics
    definition: "Oakeshott's name for the belief that political problems are solved by technique applied by an unprejudiced mind — the politics of the book, the felt need, and the self-made man"
    introduced_in: oakeshott-rationalism-in-politics
  - id: pursuit-of-intimations
    name: Pursuit of intimations
    definition: "Oakeshott's account of political activity as exploring what a tradition of behaviour already suggests — a boundless sea on which the aim is to keep afloat, not to reach a harbour"
    introduced_in: oakeshott-rationalism-in-politics
  - id: government-as-umpire
    name: Government as umpire
    definition: "Oakeshott's conservative view of governing as enforcing rules under which others pursue their own ends, as against imposing a dream or managing an enterprise"
    introduced_in: oakeshott-rationalism-in-politics
  - id: historicism
    name: Historicism
    definition: "The doctrine that all thought, including about justice, is the product of its historical situation; Strauss's target, and in its radical form (Nietzsche) the denial that philosophy is possible"
    introduced_in: strauss-natural-right-and-history
  - id: fact-value-distinction
    name: Fact–value distinction
    definition: "Weber's thesis that science can establish facts but not values, so that no 'ought' can be grounded in knowledge — which Strauss argues does not follow from is/ought and ends in nihilism"
    introduced_in: strauss-natural-right-and-history
  - id: classic-natural-right
    name: Classic natural right
    definition: "Strauss's reconstruction of the Socratic-Platonic-Aristotelian teaching: the natural human good is known through the best regime, and justice is what the wise would rule, diluted by consent"
    introduced_in: strauss-natural-right-and-history
  - id: modern-natural-right
    name: Modern natural right
    definition: "Strauss's account of the break made by Hobbes and Locke: natural right grounded in the fear of death and the desire for comfort, rights before duties, and the state as an artefact"
    introduced_in: strauss-natural-right-and-history
  - id: gnosticism-voegelin
    name: Gnosticism (Voegelin)
    definition: "Voegelin's name for the modern conviction that salvation can be achieved within history by human action armed with knowledge — the common structure of progressivism, utopianism and totalitarianism"
    introduced_in: voegelin-gnosticism
  - id: immanentization
    name: Immanentization of the eschaton
    definition: "Voegelin's term for bringing the Christian end of history into history — Joachim's third age, the Third Reich, the classless society — as the characteristic move of modern politics"
    introduced_in: voegelin-gnosticism
  - id: de-divinization
    name: De-divinization
    definition: "Voegelin's account of Christianity's effect on the ancient world: society lost its gods, the truth of the soul was separated from the truth of society — and the gap was later filled by re-divinizing politics"
    introduced_in: voegelin-gnosticism
  - id: allegiance
    name: Allegiance
    definition: "Scruton's term for the bond to a nation, like the bond to a family, that precedes choice and makes consent possible — the substance of conservatism against the social contract"
    introduced_in: scruton-meaning-of-conservatism
  - id: authority-before-freedom
    name: Authority before freedom
    definition: "Scruton's thesis that conservatism is about authority, not freedom: institutions a person did not choose give him the standing from which freedom is intelligible"
    introduced_in: scruton-meaning-of-conservatism
  - id: autonomous-institution
    name: Autonomous institution
    definition: "Scruton's name for bodies — universities, clubs, churches, professions — that have their own ends and standards and should be protected from both state and market"
    introduced_in: scruton-meaning-of-conservatism
  - id: first-person-vs-third-person-justification
    name: First-person vs third-person justification
    definition: "Scruton's distinction between justifying an institution to its members as participants and to an observer as a design — liberalism's demand for the second shifts the onus wrongly"
    introduced_in: scruton-meaning-of-conservatism

  # --- Module 9: Empire and inherited guilt ---
  - id: dominium
    name: Dominium
    definition: "True ownership and jurisdiction under natural law — which Vitoria holds the American peoples possessed before the Spaniards came, since property depends on reason, not on grace or faith"
    introduced_in: vitoria-right-to-the-americas
  - id: unjust-titles
    name: Unjust titles
    definition: "The seven grounds for Spanish rule Vitoria rejects — the emperor's lordship, the pope's donation, discovery, refusal of the faith, sins against nature, voluntary choice, divine gift"
    introduced_in: vitoria-right-to-the-americas
  - id: ius-communicationis
    name: Ius communicationis
    definition: "Vitoria's right of natural partnership — to travel, trade, settle and preach anywhere under the law of nations — the one just title he allows, which licenses war when it is resisted"
    introduced_in: vitoria-right-to-the-americas
  - id: law-of-war-vitoria
    name: Law of war (Vitoria)
    definition: "Vitoria's doctrine that the only just cause of war is injury received, that the prince must examine the cause, and that a war can be just on both sides through invincible ignorance"
    introduced_in: vitoria-right-to-the-americas
  - id: strategies-of-exclusion
    name: Strategies of exclusion
    definition: "Mehta's thesis that liberalism's universal anthropology is paired with thick conditions (education, maturity, civilization) that gate political inclusion — so imperial exclusion follows from, rather than contradicts, liberal premises"
    introduced_in: locke-and-mill-on-empire
  - id: civilizational-infantilism
    name: Civilizational infantilism
    definition: "The liberal-imperial figure of a people as a child not yet ready for self-rule — Mill's 'nonage' — which defers consent indefinitely while claiming to prepare for it"
    introduced_in: locke-and-mill-on-empire
  - id: tutelage
    name: Tutelage
    definition: "Rule over a people for its own improvement toward self-government — Mill's justification of British India and the empire-as-tow that Mehta analyses"
    introduced_in: locke-and-mill-on-empire
  - id: empire-as-trust
    name: Empire as trust
    definition: "Burke's principle that all political power over others is a trust held for their benefit and answerable to law — the ground on which he prosecuted Hastings"
    introduced_in: burke-against-hastings
  - id: geographical-morality
    name: Geographical morality
    definition: "The doctrine, which Burke attributed to Hastings and rejected, that moral and legal standards change with latitude so that arbitrary power is lawful in Asia"
    introduced_in: burke-against-hastings
  - id: cost-benefit-of-empire
    name: Cost–benefit of empire
    definition: "The method of judging colonialism by weighing its goods (order, health, infrastructure) against its harms (violence, extraction) relative to a counterfactual — demanded by Gilley and contested by his critics"
    introduced_in: colonial-balance-sheet
  - id: subjective-legitimacy
    name: Subjective legitimacy
    definition: "The test of whether the governed accepted a rule, read from revealed preference (migration, enrolment, collaboration) — Gilley's second criterion and its critics' 'false consciousness' reply"
    introduced_in: colonial-balance-sheet
  - id: counterfactual-development
    name: Counterfactual development
    definition: "The question 'compared to what?' — how a colonised society would have developed uncolonised — which both sides of the balance-sheet debate must answer and neither can observe"
    introduced_in: colonial-balance-sheet
  - id: rectification
    name: Rectification
    definition: "Nozick's principle that holdings arising from past injustice must be corrected toward what would have obtained without it — the counterfactual method Waldron shows cannot be carried out"
    introduced_in: inherited-guilt-and-reparations
  - id: supersession
    name: Supersession of historic injustice
    definition: "Waldron's thesis that an entitlement is sensitive to circumstances, so that changed circumstances can make a once-just claim lapse without its ever having been wrong"
    introduced_in: inherited-guilt-and-reparations
  - id: hereditary-guilt
    name: Hereditary guilt
    definition: "The question whether responsibility for a historic wrong passes to descendants who did not commit it — affirmed by the reparations case, denied as a 'tyranny of guilt' by its critics"
    introduced_in: inherited-guilt-and-reparations

  # --- Module 10: The nation and immigration ---
  - id: oikophilia
    name: Oikophilia
    definition: "Scruton's term for love of home — the attachment to a place, its people and its ways that grounds the nation and precedes any political choice"
    introduced_in: the-nation-and-its-defenders
  - id: pre-political-loyalty
    name: Pre-political loyalty
    definition: "The shared identity that must exist before citizens can disagree about politics, which Scruton locates in the territorial nation and Miller in national identity"
    introduced_in: the-nation-and-its-defenders
  - id: compatriot-partiality
    name: Compatriot partiality
    definition: "Miller's defence of the special obligations citizens owe one another, compatible with a weak cosmopolitanism that owes every human being consideration"
    introduced_in: the-nation-and-its-defenders
  - id: associative-obligations
    name: Associative obligations
    definition: "Duties that arise from membership in a relationship — economic cooperation, citizenship, nationality — rather than from choice or universal morality"
    introduced_in: the-nation-and-its-defenders
  - id: open-borders
    name: Open borders
    definition: "Carens's conclusion that free movement across borders is a basic liberty and restrictions need justification — reached from Nozickian, Rawlsian and utilitarian premises alike"
    introduced_in: carens-open-borders
  - id: global-original-position
    name: Global original position
    definition: "Carens's extension of Rawls's thought experiment to the whole world: behind a veil of ignorance about nationality, parties would choose free migration"
    introduced_in: carens-open-borders
  - id: citizenship-as-feudal-privilege
    name: Citizenship as feudal privilege
    definition: "Carens's charge that birthright citizenship in a rich country, like inherited noble status, confers life chances by accident of birth that liberal principles cannot defend"
    introduced_in: carens-open-borders
  - id: self-determination-over-membership
    name: Self-determination over membership
    definition: "Miller's ground for immigration control: a people's interest in deciding its own future, public culture and demos justifies selecting who joins, within limits set by human rights"
    introduced_in: miller-strangers-in-our-midst
  - id: refugee-vs-economic-migrant
    name: Refugee vs economic migrant
    definition: "Miller's distinction between those owed admission by a duty of rescue and those admitted on terms of mutual advantage — and the mixed flows that strain it"
    introduced_in: miller-strangers-in-our-midst
  - id: integration-civic-social-cultural
    name: Civic, social and cultural integration
    definition: "Miller's three dimensions of what a receiving society may expect of immigrants — obeying and participating, mixing, adopting the public culture — and where each may be demanded"
    introduced_in: miller-strangers-in-our-midst
  - id: two-concatenations
    name: Two concatenations
    definition: "Murray's thesis that mass immigration and Europe's loss of faith in its own beliefs each might have been absorbed alone, and together cannot be"
    introduced_in: murray-strange-death-of-europe
  - id: bockenforde-dilemma
    name: Böckenförde dilemma
    definition: "The question whether the free secular state lives on presuppositions (shared faith, loyalty) it cannot itself guarantee or produce"
    introduced_in: murray-strange-death-of-europe
  - id: replacement-as-argument
    name: Replacement as an argument
    definition: "The claim that immigration and differential fertility will replace Europe's native populations — treated here as an argument with a history (Raspail, Camus), its demographic projections, and their assumptions and objections"
    introduced_in: powell-raspail-and-camus
  - id: liberal-anthropology
    name: Liberal anthropology
    definition: "Deneen's reconstruction of liberalism's two premises: that human beings are by nature free and unencumbered individuals, and that nature is material to be mastered"
    introduced_in: deneen-post-liberalism
  - id: anticulture
    name: Anticulture
    definition: "Deneen's name for the dissolution of nature, time and place by standardising law and the universal market — liberalism's replacement of cultures with liturgies of state and market"
    introduced_in: deneen-post-liberalism
  - id: liberalocracy
    name: Liberalocracy
    definition: "Deneen's term for the new aristocracy of the credentialed and mobile that liberalism produces while professing equality"
    introduced_in: deneen-post-liberalism
  - id: post-liberalism
    name: Post-liberalism
    definition: "The position that liberalism's failures follow from its premises and cannot be reformed within them — proposing local practice and community rather than a new ideology"
    introduced_in: deneen-post-liberalism

  # --- Added in the 2026-10-31 structure revision (grouped by introducing lesson, course order) ---
  - id: funeral-oration-ideal
    name: "Funeral Oration ideal"
    definition: "Pericles's account (Thucydides II.35–46) of what holds Athens together: rule by the many, advancement by merit, freedom in private life and law-abidingness in public, the city as 'the school of Hellas'"
    introduced_in: thucydides-power-and-justice
  - id: athenian-thesis
    name: "The Athenian thesis"
    definition: "The argument of the Athenian envoys at Melos (Thucydides V.89, 105): justice is in question only between equals in power; otherwise the strong do what they can and the weak suffer what they must — a law of gods and men alike"
    introduced_in: thucydides-power-and-justice
  - id: anacyclosis
    name: "Anacyclosis"
    definition: "Polybius's cycle of constitutions: kingship, tyranny, aristocracy, oligarchy, democracy and mob-rule follow one another by nature, each simple form decaying into its perversion and provoking the next"
    introduced_in: polybius-anacyclosis-and-rome
  - id: checks-and-balances
    name: "Checks and balances"
    definition: "Polybius's account of the Roman constitution (VI.11–18): each part — consuls, senate, people — has powers that can block the others, so no part can grow at the others' expense"
    introduced_in: polybius-anacyclosis-and-rome
  - id: patriarchal-divine-right
    name: "Patriarchal divine right"
    definition: "Filmer's thesis that political power is fatherly power descended from Adam's God-given dominion, so that kings rule by natural right as fathers of their peoples and no one is born free"
    introduced_in: filmer-patriarcha
  - id: government-founded-on-opinion
    name: "Government founded on opinion"
    definition: "Hume's thesis that the few govern the many only because the many believe in the government's interest and right — opinion of interest, of right to power and of right to property — not by force or by contract"
    introduced_in: hume-against-the-original-contract
  - id: original-contract
    name: "Original contract"
    definition: "The Whig doctrine that legitimate government rests on an agreement of the governed; Hume's target, which he finds neither in history nor in the conduct of any people"
    introduced_in: hume-against-the-original-contract
  - id: volk
    name: "Volk"
    definition: "A people as a community of language, custom, memory and character prior to any state; Herder's unit of history and the German Romantic and nationalist tradition's subject"
    introduced_in: herder-and-fichte-volk-and-nation
  - id: plurality-of-cultures
    name: "Plurality of cultures"
    definition: "Herder's thesis that each people and age has its own centre of happiness and standard of value and cannot be ranked by another's — against the Enlightenment's single ladder of progress"
    introduced_in: herder-and-fichte-volk-and-nation
  - id: language-as-nation
    name: "Language as nation"
    definition: "Fichte's thesis that a living original language makes a people one and makes it a nation; the Germans as the Urvolk that kept its language, against the neo-Latin peoples"
    introduced_in: herder-and-fichte-volk-and-nation
  - id: dictatorship-of-the-sabre
    name: "Dictatorship of the sabre"
    definition: "Donoso Cortés's 1849 claim that when legality cannot save society, the only choice is between the dictatorship of the insurrection and that of the government, and the latter is to be chosen"
    introduced_in: donoso-cortes-on-dictatorship
  - id: discussing-class
    name: "Discussing class"
    definition: "Donoso Cortés's name for liberal bourgeois parliamentarism: a class that answers every ultimate question, theological or political, by proposing to discuss it"
    introduced_in: donoso-cortes-on-dictatorship
  - id: coercion-by-opinion
    name: "Coercion by opinion"
    definition: "Stephen's thesis, against Mill, that legal and moral coercion are the normal and legitimate instruments by which societies form character and improve; the harm principle cannot be applied"
    introduced_in: stephen-liberty-equality-fraternity
  - id: status-to-contract
    name: "From status to contract"
    definition: "Maine's formula (Ancient Law, 1861) for the movement of progressive societies from relations fixed by birth and family to relations made by individual agreement"
    introduced_in: maine-and-lecky-on-popular-government
  - id: fragility-of-popular-government
    name: "Fragility of popular government"
    definition: "Maine's and Lecky's thesis that popular governments have been historically rare and short-lived, that the masses resist innovation, and that democracy tends to tax and govern the few at the will of the many"
    introduced_in: maine-and-lecky-on-popular-government
  - id: esprit-classique
    name: "Classical spirit"
    definition: "Taine's name for the habit of reasoning from abstract, universal man by deduction, formed in French letters and turned on politics in 1789"
    introduced_in: taine-and-le-bon-revolution-and-crowd
  - id: crowd-psychology
    name: "Crowd psychology"
    definition: "Le Bon's theory that individuals in a crowd form a collective mind — suggestible, credulous, contagious, moved by images and leaders rather than reasons"
    introduced_in: taine-and-le-bon-revolution-and-crowd
  - id: racial-theory-of-history
    name: "Racial theory of history"
    definition: "The nineteenth-century thesis, systematised by Gobineau, that the rise and fall of civilizations is caused by the hereditary qualities of the peoples who build them; taught as an argument with its history and objections"
    introduced_in: gobineau-inequality-of-races
  - id: degeneration-by-mixture
    name: "Degeneration by mixture"
    definition: "Gobineau's claim that a civilization declines because its creating people loses its original qualities through intermarriage with the peoples it rules"
    introduced_in: gobineau-inequality-of-races
  - id: teutonic-thesis
    name: "Teutonic thesis"
    definition: "Chamberlain's reading of European history as the work of the 'Teutonic' peoples emerging from the 'chaos of peoples' of the late Roman world, set against an antagonist he called the Jewish race"
    introduced_in: chamberlain-and-grant
  - id: nordicism
    name: "Nordicism"
    definition: "Grant's division of Europeans into Nordic, Alpine and Mediterranean races with the Nordic as superior, and his programme of immigration restriction and eugenics; taught as an argument with its history and objections"
    introduced_in: chamberlain-and-grant
  - id: daily-plebiscite
    name: "Daily plebiscite"
    definition: "Renan's definition of a nation (1882) as a soul made of a shared legacy of memories and the present will to live together, renewed by consent rather than fixed by race, language or religion"
    introduced_in: renan-what-is-a-nation
  - id: shared-forgetting
    name: "Shared forgetting"
    definition: "Renan's observation that a nation requires its members to have forgotten much — the violence of its founding above all — so that historical inquiry can endanger nationality"
    introduced_in: renan-what-is-a-nation
  - id: la-terre-et-les-morts
    name: "La terre et les morts"
    definition: "Barrès's formula for the nation: the soil and the dead that form each person, so that nationalism is the acceptance of a determinism rather than a choice"
    introduced_in: barres-and-maurras-integral-nationalism
  - id: integral-nationalism
    name: "Integral nationalism"
    definition: "Maurras's doctrine that every political question must be decided by what serves the nation, and that this requires a hereditary, anti-parliamentary monarchy"
    introduced_in: barres-and-maurras-integral-nationalism
  - id: politique-d-abord
    name: "Politique d'abord"
    definition: "Maurras's maxim 'politics first': the political order must be set right before any economic, moral or religious reform can succeed"
    introduced_in: barres-and-maurras-integral-nationalism
  - id: ruling-class
    name: "Ruling class"
    definition: "Mosca's thesis that every society is governed by an organized minority, since a hundred who act together beat a thousand who act alone"
    introduced_in: mosca-ruling-class
  - id: political-formula
    name: "Political formula"
    definition: "Mosca's term for the principle — divine right, popular sovereignty — by which a ruling minority justifies its power in terms the ruled believe"
    introduced_in: mosca-ruling-class
  - id: juridical-defense
    name: "Juridical defense"
    definition: "Mosca's measure of a good regime: the degree to which law, custom and institutions restrain the powerful and protect the weak from arbitrary force"
    introduced_in: mosca-ruling-class
  - id: iron-law-of-oligarchy
    name: "Iron law of oligarchy"
    definition: "Michels's thesis that every large organization, democratic parties included, produces a stable leadership that escapes the members' control — 'who says organization says oligarchy'"
    introduced_in: michels-and-pareto-oligarchy-and-elites
  - id: circulation-of-elites
    name: "Circulation of elites"
    definition: "Pareto's thesis that elites rise and decay and are replaced from below, so that history is 'a graveyard of aristocracies'"
    introduced_in: michels-and-pareto-oligarchy-and-elites
  - id: residues-and-derivations
    name: "Residues and derivations"
    definition: "Pareto's distinction between the constant non-logical sentiments that drive action (residues) and the theories invented to justify them (derivations)"
    introduced_in: michels-and-pareto-oligarchy-and-elites
  - id: political-myth
    name: "Political myth"
    definition: "Sorel's term for an image of decisive struggle, such as the general strike, that moves a class to action and cannot be refuted because it is not a prediction"
    introduced_in: sorel-reflections-on-violence
  - id: proletarian-violence
    name: "Proletarian violence"
    definition: "Sorel's distinction between the violence of a class in struggle, which he held to restore energy and morality, and the force of the bourgeois state"
    introduced_in: sorel-reflections-on-violence
  - id: front-experience
    name: "Front experience"
    definition: "The experience of the trenches of 1914–18 as Jünger and his generation interpreted it: an ordeal that made a new kind of man and discredited bourgeois values"
    introduced_in: junger-storm-of-steel-and-the-worker
  - id: total-mobilization
    name: "Total mobilization"
    definition: "Jünger's term (1930) for modern war as the conversion of a whole nation's life and labour into energy for the state"
    introduced_in: junger-storm-of-steel-and-the-worker
  - id: gestalt-of-the-worker
    name: "Gestalt of the Worker"
    definition: "Jünger's figure (1932) of the Worker as a new human type, not a class, who rules through technology and replaces the bourgeois individual"
    introduced_in: junger-storm-of-steel-and-the-worker
  - id: conservative-revolution
    name: "Conservative Revolution"
    definition: "The Weimar-era German right that sought not to restore the old order but to create by revolution a new one worth conserving (Moeller, Jünger, Spengler); the name was fixed after 1945"
    introduced_in: moeller-van-den-bruck-third-reich
  - id: third-reich-idea
    name: "Third Reich (idea)"
    definition: "Moeller van den Bruck's idea (1923) of a third German empire as a national-socialist synthesis beyond liberalism and party, later taken as the name of the Nazi state"
    introduced_in: moeller-van-den-bruck-third-reich
  - id: primordial-tradition
    name: "Primordial tradition"
    definition: "Evola's notion of a sacred, hierarchical order of the ancient world, of which all later history is a regression"
    introduced_in: evola-revolt-against-the-modern-world
  - id: regression-of-castes
    name: "Regression of the castes"
    definition: "Evola's law of history: power passes from priest-kings to warriors to merchants to serfs, the modern world being the rule of the last"
    introduced_in: evola-revolt-against-the-modern-world
  - id: anti-fascist-consensus
    name: "Anti-fascist consensus"
    definition: "The postwar European settlement in which fascism's defeat discredited the vocabulary of nation, hierarchy and authority and set the terms on which the right could re-enter politics"
    introduced_in: the-right-after-1945
  - id: growth-of-power
    name: "Growth of Power"
    definition: "Jouvenel's thesis that the state ('Power') has grown continuously by absorbing the resources of society, and grows fastest under regimes that claim to serve the people"
    introduced_in: jouvenel-on-power
  - id: alliance-of-power-and-the-common-man
    name: "Alliance of Power and the common man"
    definition: "Jouvenel's account of how central Power expanded by allying with the lower orders against the aristocracies and corporations that limited it"
    introduced_in: jouvenel-on-power
  - id: canons-of-conservatism
    name: "Canons of conservatism"
    definition: "Kirk's six principles of conservative thought: a transcendent order, the variety of life, orders and classes, property and freedom, prescription, and prudent change"
    introduced_in: kirk-and-nisbet-american-conservatism
  - id: quest-for-community
    name: "Quest for community"
    definition: "Nisbet's thesis that modern individuals, stripped of intermediate associations, seek community in the state, which totalitarianism exploits"
    introduced_in: kirk-and-nisbet-american-conservatism
  - id: intermediate-associations
    name: "Intermediate associations"
    definition: "The family, church, guild, locality and voluntary group standing between the individual and the state; for Nisbet the condition of freedom that the modern state destroyed"
    introduced_in: kirk-and-nisbet-american-conservatism
  - id: managerial-revolution
    name: "Managerial revolution"
    definition: "Burnham's thesis (1941) that control of production was passing from owners to managers, who were becoming the new ruling class under capitalism, fascism and communism alike"
    introduced_in: burnham-managers-and-the-suicide-of-the-west
  - id: liberalism-as-ideology-of-contraction
    name: "Liberalism as the ideology of contraction"
    definition: "Burnham's thesis (1964) that liberalism reconciles the West to its own decline by supplying the principles under which retreat feels like justice"
    introduced_in: burnham-managers-and-the-suicide-of-the-west
  - id: original-position
    name: "Original position"
    definition: "Rawls's hypothetical choice of principles of justice by parties behind a veil of ignorance about their own place, talents and conception of the good"
    introduced_in: rawls-theory-of-justice
  - id: difference-principle
    name: "Difference principle"
    definition: "Rawls's principle that social and economic inequalities are just only if they benefit the least advantaged, under fair equality of opportunity"
    introduced_in: rawls-theory-of-justice
  - id: natural-lottery
    name: "Natural lottery"
    definition: "Rawls's claim that the distribution of natural talents is arbitrary from a moral point of view, so that no one deserves the advantages it brings"
    introduced_in: rawls-theory-of-justice
  - id: ressentiment
    name: "Ressentiment"
    definition: "The repeated reliving of a suppressed hostile feeling — revenge, envy, spite — under felt impotence, which ends by falsifying values; Nietzsche's term, given a phenomenology and a sociology by Scheler"
    introduced_in: ressentiment-and-envy
  - id: envy-schoeck
    name: "Envy (Schoeck)"
    definition: "Schoeck's account of envy as a universal social emotion that wants the other dispossessed rather than oneself enriched, and of egalitarian policy as an attempt to appease it"
    introduced_in: ressentiment-and-envy
  - id: excusable-envy
    name: "Excusable envy"
    definition: "Rawls's term (§80) for envy provoked by inequalities so great, under conditions so humiliating, that the envious cannot be blamed — the case a just basic structure must not produce"
    introduced_in: ressentiment-and-envy
  - id: emotivism
    name: "Emotivism"
    definition: "The theory that moral judgments express preferences rather than truths; for MacIntyre, the theory that is true of how moral language is used after the Enlightenment"
    introduced_in: macintyre-after-virtue
  - id: enlightenment-project
    name: "Enlightenment project"
    definition: "MacIntyre's name for the attempt (Kant, Hume, Diderot, Kierkegaard) to justify inherited moral rules without the idea of a human telos, which he argues had to fail"
    introduced_in: macintyre-after-virtue
  - id: practice-and-tradition
    name: "Practice and tradition"
    definition: "MacIntyre's account of the virtues as qualities needed to achieve the goods internal to cooperative practices, sustained within the narrative of a life and a living tradition"
    introduced_in: macintyre-after-virtue
  - id: revolt-of-the-elites
    name: "Revolt of the elites"
    definition: "Lasch's inversion of Ortega: mobile, credentialed elites have withdrawn from the obligations and institutions they share with the rest of the nation"
    introduced_in: lasch-revolt-of-the-elites
  - id: meritocracy-critique
    name: "Critique of meritocracy"
    definition: "The argument (Young, Lasch) that rule by the tested able produces an aristocracy without obligation, makes inequality look deserved and drains talent from the rest of society"
    introduced_in: lasch-revolt-of-the-elites
  - id: g-factor
    name: "General intelligence (g)"
    definition: "The common factor extracted from the positive correlations among scores on different mental tests; its interpretation is itself contested"
    introduced_in: the-cognitive-elite
  - id: heritability
    name: "Heritability"
    definition: "The share of the variation of a trait within a given population, in given environments, that is statistically associated with genetic variation — not a measure of how fixed or changeable the trait is"
    introduced_in: the-cognitive-elite
  - id: cognitive-stratification
    name: "Cognitive stratification"
    definition: "The Bell Curve's thesis that education, occupation and marriage increasingly sort a society by measured intelligence, forming a cognitive elite"
    introduced_in: the-cognitive-elite
  - id: protestant-ethic
    name: "Protestant ethic"
    definition: "Weber's thesis that Calvinist worldly asceticism — work as a calling and restless proof of election — supplied the spirit of modern rational capitalism"
    introduced_in: weber-only-in-the-west
  - id: rationalization
    name: "Rationalization"
    definition: "Weber's term for the spread of calculable, rule-governed conduct through science, law, administration and economy — the process his 'only in the West' names"
    introduced_in: weber-only-in-the-west
  - id: european-fragmentation
    name: "European fragmentation"
    definition: "The thesis that Europe's division into competing states gave subjects exit, forced rulers to bargain and kept any single authority from suppressing innovations"
    introduced_in: landes-european-exceptionalism
  - id: invention-of-invention
    name: "Invention of invention"
    definition: "Landes's phrase for medieval and early modern Europe's sustained, cumulative production and diffusion of new techniques"
    introduced_in: landes-european-exceptionalism
  - id: accomplishment-inventory
    name: "Accomplishment inventory"
    definition: "Charles Murray's method of counting the significant figures in a field — those named in at least half of the qualified histories and reference works — to compare achievement across places and times"
    introduced_in: murray-human-accomplishment
  - id: weird-psychology
    name: "WEIRD psychology"
    definition: "The finding that subjects from Western, educated, industrialized, rich, democratic societies are psychological outliers — more individualistic, analytic and trusting of strangers"
    introduced_in: henrich-church-and-kinship
  - id: marriage-and-family-program
    name: "Marriage and Family Program"
    definition: "Henrich's name for the medieval Church's prohibitions on cousin marriage, polygamy and related unions, which he argues dissolved intensive kinship in Western Europe"
    introduced_in: henrich-church-and-kinship
  - id: intensive-kinship
    name: "Intensive kinship"
    definition: "Kin-based institutions such as clans, lineages and cousin marriage that bind people tightly to relatives; Henrich's contrast case to Western individualism"
    introduced_in: henrich-church-and-kinship
  - id: great-divergence
    name: "Great Divergence"
    definition: "The opening of the gap in wealth between north-western Europe and the advanced regions of Asia; for Pomeranz it came after 1800 and owed much to coal and the New World"
    introduced_in: pomeranz-and-goody-the-rival-thesis
  - id: theft-of-history
    name: "Theft of history"
    definition: "Goody's thesis that Europe appropriated as uniquely its own institutions and values — the city, the market, democracy, love — that had parallels across Eurasia"
    introduced_in: pomeranz-and-goody-the-rival-thesis
  - id: graded-transmission
    name: "Graded transmission"
    definition: "The practice of stating each claimed borrowing between civilizations with the confidence its evidence supports — documented, probable, or most probably independent"
    introduced_in: the-borrowing-ledger
  - id: borrowing-into-system
    name: "Borrowing into system"
    definition: "The exceptionalist reply that every civilization borrowed, but the West turned what it borrowed into self-sustaining systems: numerals into the calculus and measurement, powder into the military revolution, print into the Reformation and science"
    introduced_in: the-borrowing-ledger
  - id: hereditarian-hypothesis
    name: "Hereditarian hypothesis"
    definition: "The contested claim that average differences in measured intelligence between human groups are partly genetic in origin and explain part of their differences in outcomes; taught with its evidence and the evidence against it"
    introduced_in: hereditarian-case-iq-and-nations
  - id: national-iq
    name: "National IQ"
    definition: "Lynn and Vanhanen's estimates of average measured intelligence by country, assembled from published test samples and imputation, and correlated with national income"
    introduced_in: hereditarian-case-iq-and-nations
  - id: ancient-dna
    name: "Ancient DNA"
    definition: "Genomes recovered from human remains thousands of years old, which allow population movements and mixtures to be read directly rather than inferred from present-day people"
    introduced_in: reich-ancient-dna-and-the-indo-europeans
  - id: steppe-migration
    name: "Steppe migration"
    definition: "The movement of herders from the Pontic–Caspian steppe (the Yamnaya) into Europe and South Asia around 3000–2000 BC, shown by ancient DNA and linked to the spread of Indo-European languages"
    introduced_in: reich-ancient-dna-and-the-indo-europeans
  - id: population-mixture
    name: "Population mixture"
    definition: "Reich's finding that present-day populations are blends of earlier, highly differentiated populations, which were themselves blends — so that no people descends only from a place's first inhabitants"
    introduced_in: reich-ancient-dna-and-the-indo-europeans
  - id: reification
    name: "Reification"
    definition: "Gould's charge that treating an abstraction — the first factor of a correlation matrix — as a real thing in the head is a logical error"
    introduced_in: gould-and-harden-on-heredity
  - id: within-between-fallacy
    name: "Within/between fallacy"
    definition: "The error of inferring that a difference between groups is genetic because a trait is heritable within each group; the seed-corn example shows the inference fails"
    introduced_in: gould-and-harden-on-heredity
  - id: polygenic-index
    name: "Polygenic index"
    definition: "A score summing the estimated small effects of many genetic variants on a trait, predictive within the ancestry groups it was built on and less so across them"
    introduced_in: gould-and-harden-on-heredity
  - id: proximate-and-ultimate-causes
    name: "Proximate and ultimate causes"
    definition: "Diamond's distinction between the immediate means of conquest (guns, germs, steel) and the environmental causes (domesticable species, continental axes) that put them on one side"
    introduced_in: geography-or-institutions
  - id: inclusive-and-extractive-institutions
    name: "Inclusive and extractive institutions"
    definition: "Acemoglu and Robinson's distinction between institutions that give broad security and access to markets and politics and those that let a narrow elite extract wealth"
    introduced_in: geography-or-institutions
  - id: critical-juncture
    name: "Critical juncture"
    definition: "An event, such as the Black Death or 1688, that disturbs the balance of power in a society and lets small institutional differences diverge"
    introduced_in: geography-or-institutions
  - id: extended-republic
    name: "Extended republic"
    definition: "Madison's argument (Federalist 10) that a large republic with representation controls faction better than a small democracy, because there the factions are too many to combine"
    introduced_in: federalist-one-people-and-the-extended-republic
  - id: faction-madison
    name: "Faction (Madison)"
    definition: "A group of citizens united by a passion or interest adverse to others' rights or the community's permanent interests, whose causes are sown in human nature"
    introduced_in: federalist-one-people-and-the-extended-republic
  - id: folkways
    name: "Folkways"
    definition: "Fischer's term for the normative structure of values, customs and meanings that each of four British migrant groups carried to America and that persisted"
    introduced_in: albions-seed-and-who-are-we
  - id: anglo-protestant-core
    name: "Anglo-Protestant core"
    definition: "Huntington's thesis that American identity rests on a culture of English language, law and dissenting Protestantism brought by settlers, from which the American Creed came"
    introduced_in: albions-seed-and-who-are-we
  - id: american-creed
    name: "American Creed"
    definition: "The principles of liberty, equality, individualism, representative government and property that Americans profess; for Huntington a product of the Anglo-Protestant culture, for others self-standing"
    introduced_in: albions-seed-and-who-are-we
  - id: anglosphere-decline-thesis
    name: "Anglosphere decline thesis"
    definition: "The argument that the United States, as England's heir in law, religion and liberal creed, is following England's own decline, for the same causes"
    introduced_in: america-and-the-english-decline
  - id: prophecy-of-displacement
    name: "Prophecy of displacement"
    definition: "The argument form shared by Powell (1968), Raspail (1973) and Camus (2011): that immigration on the present scale will replace or subordinate the native population — taught as a set of predictions with their evidence and the record"
    introduced_in: powell-raspail-and-camus
  - id: order-of-national-states
    name: "Order of national states"
    definition: "Hazony's ideal of a world of independent nations, each pursuing its own way of life, against any universal empire, including liberal internationalism"
    introduced_in: hazony-virtue-of-nationalism
  - id: imperialism-of-universal-doctrine
    name: "Imperialism of universal doctrine"
    definition: "Hazony's charge that projects which seek to bring all peoples under one doctrine — Catholic, Marxist or liberal — are empires whatever their intentions"
    introduced_in: hazony-virtue-of-nationalism
  - id: common-good-constitutionalism
    name: "Common-good constitutionalism"
    definition: "Vermeule's proposal to read law, constitutional law included, as an ordinance of reason directed to the common good, in the classical legal tradition, rather than by original meaning or as a charter of individual rights"
    introduced_in: vermeule-common-good-constitutionalism
  - id: lex-and-ius
    name: "Lex and ius"
    definition: "The classical distinction between enacted positive law (lex) and the whole body of right, including principles of justice (ius), of which rights are corollaries"
    introduced_in: vermeule-common-good-constitutionalism
  - id: metapolitics
    name: "Metapolitics"
    definition: "The European New Right's strategy, borrowed from Gramsci, of winning the culture before seeking power"
    introduced_in: de-benoist-european-new-right
  - id: ethnopluralism
    name: "Ethnopluralism"
    definition: "The European New Right's doctrine of a right to difference: each people should keep its own culture, against both assimilation and hierarchy among peoples — in the 1999 manifesto including recognition of immigrant communities already settled (the term is the movement's critics' and commentators', not the manifesto's)"
    introduced_in: de-benoist-european-new-right

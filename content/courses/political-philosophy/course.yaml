schema_version: 1
slug: political-philosophy
title: "Western Political Philosophy"
tagline: "Who should rule, is inequality natural, what holds a people together and why civilizations decline, and why it was the West that produced philosophy, self-government and science and spread them — the Western argument from Thucydides to the post-liberals, the conservative and anti-egalitarian line at full strength, met by its strongest critics"
status: planned
audience: >
  A curious adult who identifies with the right and is drawn to the
  conservative, reactionary and anti-egalitarian tradition, and wants to know
  what that tradition actually argued, in order, and what the other side said
  back. No prior philosophy or history coursework is assumed: every thinker,
  event and institution is introduced where it first appears. Reads primary
  texts in English translation and is willing to work through an argument step
  by step; is not looking to be flattered or warned off.
tone: >
  Lively, clear and argument-driven, with no filler. Each lesson starts from a
  problem the reader can feel — a city that must decide who rules it, a king
  on trial, a border with people at it — and reconstructs what the thinker
  said about it in his own words, at full strength, before the best objection
  from whichever side it comes is put to it. The course never decides in
  advance that the liberal or left tradition is unfounded, and it never
  presents a contested empirical claim (hereditarian accounts of civilization,
  replacement, the colonial balance sheet) as settled: such claims are taught
  as arguments, with their history, their evidence and their objections, and
  the reader is left to weigh them. Primary texts are quoted and
  reconstructed; scholars' names live in References. No moralizing in either
  direction, no "some believe" strawmen, no rhetorical questions, no teasers;
  declarative sentences that say each thing once.
intro: |
  Four questions run through everything the West has written about
  politics, and the course is built on them. Who should rule: the one who
  knows, the many who are affected, the organized few who always end up
  ruling anyway, or whoever holds the sword? Is the inequality we see
  everywhere natural, so that a good order ranks people, or is it an
  artefact, so that a good order undoes it? What holds a people together
  across generations (a shared god, a shared descent, a language, a
  contract, a way of life), and why do civilizations that had it lose it?
  And why was it the West that produced philosophy, political theory,
  self-government and natural science, and then spread them across the
  globe?

  The fourth question has two serious answers, and the course gives both
  at full strength. Its defenders say the West is exceptional: the Greek
  polis put power "in the middle", the Church broke the clans, divided
  Europe let no ruler stop an invention, and what the West took from others
  (paper, numerals, gunpowder) it turned into self-sustaining systems, from
  the calculus to the scientific journal. The rival thesis says the West is
  one link in a long chain of exchange across Eurasia, whose lead came late
  and was helped by coal and colonies. A third family of answers, from
  Gobineau to the IQ studies of the 1990s, puts the cause in heredity, and
  its critics put it in geography and institutions. Each answer is taught
  as an argument, with its evidence and the evidence against it.

  The course follows the answers in the order they were given, from
  Thucydides' Athenians at Melos to the post-liberals of the 2020s, and it
  gives the conservative, reactionary and anti-egalitarian answers the
  depth they rarely get: Plato's rule by knowledge, Aristotle's natural
  hierarchy and its own admitted difficulty, Augustine's two cities,
  Hobbes's sovereign, Burke's inheritance, Maistre's executioner,
  Tocqueville's soft despotism, Mosca's ruling class, Schmitt's friend and
  enemy, Spengler's organisms, Strauss's natural right, Scruton's home. It
  also teaches what the right did in 1933 and what that cost it after
  1945. The other side is here too, taught as its authors would want:
  Locke's consent, Rousseau's general will, Mill's liberty, Marx's class
  war, Rawls's veil of ignorance, Carens's open borders. A reader cannot
  understand Burke without Rousseau, Schmitt without the liberalism he
  attacked, or the charge of envy without Rawls's reply to it. The course
  ends on the live question the history leads to: whether a nation can
  survive on liberal principles alone.
prerequisites:
  - text: "None — no prior philosophy or history is assumed; every thinker is introduced where he first appears"
  - text: "Willingness to read short passages of translated primary text closely and follow a multi-step argument"
  - text: "Optional: the Nietzsche course, which this course links to where his ideas enter instead of re-teaching them"
    course: nietzsche
key_results:
  - text: "Political theory arose where sovereignty was broken up and power placed 'in the middle' of a community of peers — the Greek polis after the fall of the palace kingdoms — and the Greeks themselves credited Egypt and Babylon with much of what they built on"
    lesson: greek-miracle
  - text: "Aristotle's natural slavery rests on a hierarchy he takes to run through all nature, and he himself concedes that nature often fails to produce the bodies and souls the theory needs — the argument's difficulty is internal"
    lesson: aristotle-political-animal-and-natural-slavery
  - text: "Polybius explains Rome's rise by a constitution that mixed monarchy, aristocracy and democracy so that each part could block the others — the first account of checks and balances, and the frame the Federalist redesigned"
    lesson: polybius-anacyclosis-and-rome
  - text: "The Christianity Europe received was a Jewish movement remade in Greek concepts and Roman forms; Harnack and Nietzsche agree on the remaking and disagree on whether the kernel was worth keeping"
    lesson: hellenization-of-christianity
  - text: "Sovereignty, as Bodin and Hobbes define it, is the one power that makes law and is bound by none; it was invented to end wars of religion, and its price is that no subject may judge the sovereign"
    lesson: bodin-sovereignty
  - text: "Burke's objection to the Revolution is epistemic before it is moral: no generation knows enough to design a society from principles, so inherited institutions carry more reason than any individual can see"
    lesson: burke-reflections
  - text: "Renan's nation is a daily plebiscite of memory and will, not race or language — yet the same author ranked races as masters and workers, and Barrès answered that a nation is not chosen but accepted"
    lesson: renan-what-is-a-nation
  - text: "Mosca and Michels hold that every society, a democratic party included, is ruled by an organized minority; the classical question 'one, few or many?' becomes 'which minority, under what formula, checked how?'"
    lesson: michels-and-pareto-oligarchy-and-elites
  - text: "Schmitt's criterion of the political is the grouping of men into friend and enemy with the real possibility of killing; liberalism, on this account, does not abolish the political but hides it behind economics and ethics"
    lesson: schmitt-concept-of-the-political
  - text: "In 1933 Schmitt and Heidegger joined the Nazi party and Spengler refused it; what in their earlier work disposed each to the choice is the right's hardest question about itself"
    lesson: the-right-in-1933
  - text: "Rawls's parties behind the veil choose equal liberties and inequalities only to the benefit of the worst-off; the charge that this institutionalises envy (Scheler, Schoeck) meets Rawls's reply that a just basic structure leaves no excusable envy"
    lesson: ressentiment-and-envy
  - text: "Of the four classic Chinese inventions, paper reached Europe through the Arab world by a documented chain, gunpowder most likely through Mongol-era contact with no record of the transfer, and Gutenberg's press was most probably an independent invention"
    lesson: the-borrowing-ledger
  - text: "Heritability within a group does not by itself imply a genetic cause of differences between groups; the hereditarian case and its critics disagree about what further evidence closes that gap"
    lesson: gould-and-harden-on-heredity
  - text: "Vitoria denied every title Spain claimed to the Americas except the right of travel, trade and preaching — and that remaining title licensed war when it was refused"
    lesson: vitoria-right-to-the-americas
  - text: "Whether a historic injustice still demands rectification depends on whether the circumstances that made the original holding just still obtain; a claim can be superseded without ever having been wrong"
    lesson: inherited-guilt-and-reparations
  - text: "The open-borders argument runs from the same premises (Nozick, Rawls, utility) its opponents accept, and the liberal-nationalist reply does not deny those premises but adds a collective right of self-determination over membership"
    lesson: carens-open-borders

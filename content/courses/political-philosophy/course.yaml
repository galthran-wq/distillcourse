schema_version: 1
slug: political-philosophy
title: Western Political Philosophy
tagline: "Who should rule, is equality natural, and what holds a civilization together — the Western argument from the Greek polis to the open-borders debate, with the conservative and anti-egalitarian line taken at full strength and met by its strongest critics"
status: planned
audience: >
  A curious adult who identifies with the right and is drawn to the
  conservative, reactionary and anti-egalitarian tradition, and wants to know
  what that tradition actually argued, in order, and what the other side said
  back. No prior philosophy or history coursework is assumed: every thinker,
  event and institution is introduced where it first appears. Reads primary
  texts in English translation and is willing to work through an argument
  step by step; is not looking to be flattered or warned off.
tone: >
  Lively, clear and argument-driven, with no filler. Each lesson starts from
  a problem the reader can feel — a city that must decide who rules it, a
  king on trial, a border with people at it — and reconstructs what the
  thinker said about it in his own words, at full strength, before the best
  objection from whichever side it comes is put to it. The course never
  decides in advance that the liberal or left tradition is unfounded, and it
  never presents a contested empirical claim (hereditarian accounts of
  civilization, replacement, the colonial balance sheet) as settled: such
  claims are taught as arguments, with their history, their evidence and
  their objections, and the reader is left to weigh them. Primary texts are
  quoted and reconstructed; scholars' names live in References. No
  moralizing in either direction, no "some believe" strawmen, no rhetorical
  questions, no teasers; declarative sentences that say each thing once.
intro: >
  Three questions run through everything the West has written about
  politics. Who should rule — the one who knows, the many who are affected,
  the few who own, or whoever can hold the sword? Is the inequality we see
  everywhere natural, so that a good order ranks people, or is it an
  artefact, so that a good order undoes it? And what holds a people together
  across generations — a shared god, a shared blood, a contract, a way of
  life — and why do civilizations that had it lose it? The course follows the
  answers in the order they were given, from the Greek cities that first put
  the question "in the middle" to the European border crisis of 2015, and it
  gives the conservative, reactionary and anti-egalitarian answers the depth
  they rarely get: Plato's rule by knowledge, Aristotle's natural hierarchy
  and its own admitted difficulty, Augustine's two cities, Bodin's and
  Hobbes's sovereign, Burke's inheritance, Maistre's executioner, Hegel's
  state, Tocqueville's soft despotism, Carlyle's heroes, Mann's Kultur,
  Schmitt's friend and enemy, Spengler's organisms, Strauss's natural right,
  Oakeshott's disposition, Scruton's home.


  The other side is here too, taught as its authors would want: Locke's
  consent, Rousseau's general will, Mill's liberty, Marx's class war, Carens's
  open borders. A reader cannot understand Burke without Rousseau or Schmitt
  without the liberalism he attacked, and every position in this course is
  followed by the strongest objection anyone made to it. The argument runs
  through three thematic halts — how a Jewish movement became the religion of
  Europe through Greek and Latin minds, how the West has judged its own
  conquests from Vitoria to the reparations debate, and whether civilizations
  are one or many and why they decline — and ends on the live question the
  whole history was leading to: whether a nation can survive on liberal
  principles alone.
prerequisites:
  - text: "None — no prior philosophy or history is assumed; every thinker is introduced where he first appears"
  - text: "Willingness to read short passages of translated primary text closely and follow a multi-step argument"
  - text: "Optional: the Nietzsche course, which this course links to where his ideas enter instead of re-teaching them"
    course: nietzsche
key_results:
  - text: "Political theory arose where sovereignty was broken up and power placed 'in the middle' of a community of peers — the Greek polis after the fall of the palace kingdoms — and the Greeks themselves credited Egypt and Babylon with much of what they built on"
    lesson: greek-miracle
  - text: "Aristotle's natural slavery rests on a hierarchy he takes to run through all nature (soul over body, reason over appetite), and he himself concedes that nature often fails to produce the bodies and souls the theory needs — the argument's difficulty is internal"
    lesson: aristotle-political-animal-and-natural-slavery
  - text: "Cicero's res publica is res populi, a people being a multitude bound by agreement about right and shared advantage — a definition Augustine turns against Rome itself"
    lesson: cicero-natural-law
  - text: "The Christianity Europe received was a Jewish movement remade in Greek concepts (Logos, substance, dogma) and Roman forms (law, empire, the papal monarchy); Harnack and Nietzsche agree on the remaking and disagree on whether the kernel was worth keeping"
    lesson: hellenization-of-christianity
  - text: "Sovereignty, as Bodin and Hobbes define it, is the one power that makes law and is bound by none; it was invented to end wars of religion, and its price is that no subject may judge the sovereign"
    lesson: bodin-sovereignty
  - text: "Burke's objection to the Revolution is epistemic before it is moral: no generation knows enough to design a society from principles, so inherited institutions carry more reason than any individual can see"
    lesson: burke-reflections
  - text: "Tocqueville predicts that equality of conditions, left to itself, produces not tyranny but a mild tutelary power over a flock of timid and industrious animals — and names the counterweights that could stop it"
    lesson: tocqueville-tyranny-of-majority-and-soft-despotism
  - text: "Schmitt's criterion of the political is the grouping of men into friend and enemy with the real possibility of killing; liberalism, on this account, does not abolish the political but hides it behind economics and ethics"
    lesson: schmitt-concept-of-the-political
  - text: "Spengler, Toynbee and Huntington give three incompatible answers to whether civilizations are one or many and why they decline — organism, failed response to challenge, cultural fault line — and each answer carries a different measure of greatness"
    lesson: what-measures-greatness
  - text: "Vitoria denied every title Spain claimed to the Americas except the right of travel, trade and preaching — and that remaining title licensed war when it was refused"
    lesson: vitoria-right-to-the-americas
  - text: "Whether a historic injustice still demands rectification depends on whether the circumstances that made the original holding just still obtain; a claim can be superseded without ever having been wrong"
    lesson: inherited-guilt-and-reparations
  - text: "The open-borders argument runs from the same premises (Nozick, Rawls, utility) its opponents accept, and the liberal-nationalist reply does not deny those premises but adds a collective right of self-determination over membership"
    lesson: carens-open-borders
sources:
  - Plato, Republic (Jowett tr.) and Laws III–V, X
  - Aristotle, Politics (Jowett tr., Ross rev.)
  - J.-P. Vernant, The Origins of Greek Thought (1962; Eng. 1982)
  - Cicero, On the Republic and On the Laws (Loeb 213, tr. Keyes)
  - Augustine, The City of God, Books XIV–XIX (Dods tr.)
  - A. von Harnack, What Is Christianity? (1900; tr. Saunders)
  - Thomas Aquinas, De Regno and Summa Theologiae I-II qq. 90–97
  - Machiavelli, The Prince and Discourses on Livy
  - J. Bodin, Six Books of the Commonwealth (abr. Tooley, 1955)
  - T. Hobbes, Leviathan, Parts I–II
  - J. Locke, Second Treatise of Government
  - J.-J. Rousseau, Discourse on Inequality and The Social Contract
  - E. Burke, Reflections on the Revolution in France; Speeches on the Impeachment of Warren Hastings
  - J. de Maistre, Considerations on France; St Petersburg Dialogues (tr. Lebrun)
  - G. W. F. Hegel, Elements of the Philosophy of Right
  - A. de Tocqueville, Democracy in America (Reeve tr.)
  - T. Carlyle, On Heroes and Hero-Worship; Past and Present
  - J. S. Mill, On Liberty; Considerations on Representative Government ch. XVIII
  - K. Marx and F. Engels, The Communist Manifesto
  - T. Mann, Reflections of a Nonpolitical Man (1918)
  - J. Ortega y Gasset, The Revolt of the Masses (1930)
  - C. Schmitt, The Concept of the Political; Political Theology
  - O. Spengler, The Decline of the West (Atkinson tr.)
  - A. J. Toynbee, A Study of History (Somervell abridgement)
  - S. P. Huntington, "The Clash of Civilizations?" (Foreign Affairs, 1993)
  - M. Oakeshott, Rationalism in Politics and Other Essays (1962)
  - L. Strauss, Natural Right and History (1953)
  - E. Voegelin, The New Science of Politics (1952)
  - R. Scruton, The Meaning of Conservatism (3rd ed. 2002); How to Be a Conservative (2014)
  - F. de Vitoria, Political Writings (ed. Pagden & Lawrance, 1991)
  - U. S. Mehta, Liberalism and Empire (1999)
  - B. Gilley, "The Case for Colonialism" (2017) and "A Response to My Critics" (2022)
  - J. Waldron, "Superseding Historic Injustice" (Ethics, 1992)
  - "J. Carens, \"Aliens and Citizens: The Case for Open Borders\" (1987)"
  - D. Miller, Strangers in Our Midst (2016)
  - D. Murray, The Strange Death of Europe (2017)
  - P. Deneen, Why Liberalism Failed (2018)
  - I. Berlin, "Joseph de Maistre and the Origins of Fascism" (1990); J. Mali & R. Wokler (eds.), Isaiah Berlin's Counter-Enlightenment (2003)
  - M. Lilla, The Shipwrecked Mind (2016)
  - "E. Fawcett, Conservatism: The Fight for a Tradition (2020); J. Z. Muller (ed.), Conservatism: An Anthology (2nd ed. 2020); A. Hamilton, \"Conservatism\" (Stanford Encyclopedia of Philosophy)"
  - S. B. Smith, Introduction to Political Philosophy (Open Yale PLSC 114, 2006)
  - L. Strauss & J. Cropsey (eds.), History of Political Philosophy (3rd ed. 1987)
outcomes:
  - id: co-reconstruct
    text: "Reconstruct each canonical political argument — Plato's rule by knowledge, Aristotle's natural hierarchy, Hobbes's covenant, Burke's inheritance, Schmitt's friend and enemy, and the rest — from its premises to its conclusion in the author's own terms"
    bloom: analyze
  - id: co-objection
    text: "Evaluate each position against the strongest objection made to it, from whichever side, and state where the argument holds and where it gives way"
    bloom: evaluate
  - id: co-questions
    text: "Explain how the answers to 'who should rule', 'is inequality natural' and 'what holds a people together' changed from the Greek polis to the present, and what forced each change"
    bloom: analyze
  - id: co-apply
    text: "Apply the tradition's concepts to a real artefact — a constitution, a trial, a currency, a border crisis — and say where the artefact departs from the theory"
    bloom: apply
  - id: co-contested
    text: "Distinguish settled history from contested empirical claims (hereditarian accounts of civilization, replacement, the colonial balance sheet) and lay each out as an argument with its evidence and its objections"
    bloom: evaluate

spine:
  - step: "Political theory began where kingship broke: the Greek polis after the palace kingdoms placed power 'in the middle' of a community of peers, and argument about who should rule became possible"
    label: "The Greek discovery of politics"
    years: "c. 1200–500 BC"
    caption: "The palace falls; the agora opens; a city has to argue about who rules it"
    lessons: [greek-miracle]
  - step: "Plato answers 'who should rule' with knowledge: justice is each part doing its own work, so the city should be ruled by those who know the good — and freedom left to itself slides through democracy into tyranny"
    label: "Plato: rule by knowledge"
    years: "c. 380–350 BC"
    caption: "Thrasymachus says justice is the stronger's interest; Socrates builds a city to prove him wrong"
    lessons: [thrasymachus-and-the-ring, kallipolis-and-the-philosopher-king, decline-of-regimes, platos-laws-second-best-city]
  - step: "Aristotle grounds rule in nature: man is a political animal, hierarchy runs through all things, some are slaves by nature — and he admits the theory's difficulty himself; the stable city is the one the middle governs"
    label: "Aristotle: nature, hierarchy and the middle"
    years: "c. 335–322 BC"
    caption: "Household, village, city — and the question whether anyone is a slave by nature"
    lessons: [aristotle-political-animal-and-natural-slavery, aristotle-regimes-and-the-middle, aristotle-faction-and-the-best-life, sparta-as-test-case]
  - step: "Rome turns Greek theory into Roman practice: Cicero defines the republic as the people's affair bound by agreed right, defends the mixed constitution, and asserts a natural law above all statutes"
    label: "Rome: mixed constitution and natural law"
    years: "54–44 BC"
    caption: "Scipio's garden: kings, aristocrats and the people each make their case"
    lessons: [cicero-mixed-constitution, cicero-natural-law]
  - step: "A Jewish movement becomes Europe's religion by being remade in Greek concepts and Roman forms; Constantine's empire and the Church fight over who represents the truth; Augustine denies that any earthly city can be just"
    label: "Christianity remade"
    years: "AD 30–430"
    caption: "Logos becomes Christ; the emperor becomes Christian; Augustine says Rome was never a republic"
    lessons: [hellenization-of-christianity, constantine-and-representation, augustine-two-cities, altar-of-victory]
  - step: "Christendom builds a law above kings — and Machiavelli breaks it, measuring princes and republics by what works rather than what ought to be"
    label: "Christendom's law and the Prince"
    years: "1265–1531"
    caption: "Aquinas says an unjust law is no law; Machiavelli says a prince must learn how not to be good"
    lessons: [aquinas-law-and-kingship, machiavelli-effectual-truth, machiavelli-discourses-republic]
  - step: "Wars of religion force a new answer: one sovereign power above every faction, bound by no law of its own making — Bodin's definition, Hobbes's derivation from fear, and the English Revolution as the test"
    label: "Sovereignty"
    years: "1576–1660"
    caption: "Two religions in one kingdom: who decides?"
    lessons: [bodin-sovereignty, hobbes-state-of-nature-and-covenant, hobbes-sovereign-and-liberty, english-revolution-as-test]
  - step: "Government by consent (Locke) and the general will (Rousseau) make a revolution thinkable; Burke, Maistre and Bonald answer that no generation knows enough to design a society, and Hegel absorbs both sides into the rational state"
    label: "Consent, Revolution, Reaction"
    years: "1690–1821"
    caption: "Paris, 1789: a nation tries to frame a government for itself"
    lessons: [locke-property-and-consent, rousseau-inequality-and-general-will, burke-reflections, maistre-and-bonald, war-is-divine, hegel-ethical-life-and-the-state, assignats]
  - step: "Democracy arrives as a fact and is judged: Tocqueville foresees soft despotism, Carlyle demands heroes, Mill defends liberty, Marx predicts class war — and the British franchise tests who was right"
    label: "Democracy judged"
    years: "1831–1895"
    caption: "Equality of conditions spreads; the critics ask what it will do to men"
    lessons: [tocqueville-equality-and-the-township, tocqueville-tyranny-of-majority-and-soft-despotism, carlyle-heroes, mill-liberty-and-its-limits, marx-manifesto, nietzsche-on-the-right, british-franchise]
  - step: "Liberal Europe breaks: Mann sets Kultur against Zivilisation, Ortega diagnoses the mass-man, Schmitt names the political as friend and enemy and the sovereign as he who decides the exception — and Weimar is the case"
    label: "The crisis of liberal Europe"
    years: "1914–1933"
    caption: "A novelist, a philosopher and a jurist watch parliament fail"
    lessons: [mann-reflections, ortega-revolt-of-the-masses, schmitt-concept-of-the-political, schmitt-political-theology, article-48-weimar]
  - step: "The question widens from the state to the civilization: Spengler's organisms, Toynbee's challenge and response, Huntington's fault lines — three measures of greatness and three accounts of decline, tested on the record"
    label: "Civilizations: one or many"
    years: "1918–1996"
    caption: "Is the West one civilization among eight, and is it in its winter?"
    lessons: [spengler-decline-of-the-west, toynbee-challenge-and-response, huntington-clash-of-civilizations, what-measures-greatness, testing-the-clash]
  - step: "After 1945 liberalism is the orthodoxy, and the right answers it in four registers: Oakeshott's disposition, Strauss's natural right, Voegelin's diagnosis of Gnosticism, Scruton's authority before freedom"
    label: "The postwar right answers"
    years: "1947–1980"
    caption: "Rights are declared universal; four thinkers ask where they came from"
    lessons: [what-conservatism-is, oakeshott-rationalism-in-politics, strauss-natural-right-and-history, voegelin-gnosticism, scruton-meaning-of-conservatism, udhr-read-against-the-right]
  - step: "The West judges its own conquests: Vitoria's titles, Locke's waste land, Burke's impeachment of Hastings, Mill's tutelage, the colonial balance sheet, and whether guilt is inherited"
    label: "Empire and inherited guilt"
    years: "1539–2022"
    caption: "Salamanca asks whether Spain owns America; Westminster asks whether Britain owes India"
    lessons: [vitoria-right-to-the-americas, locke-and-mill-on-empire, burke-against-hastings, colonial-balance-sheet, inherited-guilt-and-reparations, auditing-the-case-for-colonialism]
  - step: "The live question: what the nation is, who may join it, and whether the West can survive on liberal principles alone — Scruton, Miller and Murray against Carens, Deneen against liberalism itself, and 2015 as the test"
    label: "The nation and the stranger"
    years: "1987–2018"
    caption: "A million people reach Europe's border in one year; three theories say what to do"
    lessons: [the-nation-and-its-defenders, carens-open-borders, miller-strangers-in-our-midst, murray-strange-death-of-europe, deneen-post-liberalism, the-2015-crisis-read-three-ways, the-argument-assembled]

modules:
  # ---------------------------------------------------------------------
  - slug: greek-discovery
    title: "The Greek discovery of politics: Plato and Aristotle"
    outcomes: [co-reconstruct, co-objection, co-questions, co-apply]
    lessons:
      - slug: greek-miracle
        title: "The Greek miracle: why political theory arose in the polis"
        type: core
        status: planned
        goal: "Explain why argument about who should rule arose in the Greek cities and not in the palace kingdoms around them, and weigh the rival explanations"
        opening: "Around 1200 BC the Greek world was ruled from palaces, by kings with scribes and storehouses, exactly like the kingdoms of Egypt and the Near East. Four centuries later the same people lived in small cities that argued in public about who should hold power and why, and wrote the arguments down. Nothing like this happened in the far richer kingdoms next door. The lesson's task is to say what changed and why."
        est_minutes: 35
        prerequisites: []
        concepts:
          introduces: [polis, es-meson, isonomia]
          reinforces: []
        key_ideas:
          - "The Mycenaean palace kingdom (wanax, scribes, redistribution) collapsed and was not rebuilt; sovereignty was broken up among peers"
          - "Power placed 'in the middle' (es meson) of an agora of equals turns command into debate; speech (logos) becomes the political instrument"
          - "Rival explanations — polis structure, no god-king, competition between cities, the hoplite phalanx, a special people — and what each explains"
          - "What the Greeks said they borrowed (Egyptian geometry, Babylonian astronomy, Phoenician letters) and what they did not"
        demo: null
        notes: "Easy opener (C3): the felt win is reading one Solon fragment and seeing 'Dike comes down to the agora' as a political fact. The 'people/culture' explanation is taught as an argument with its history (Burnet's 'Greek miracle' vs Cornford's continuity), never as settled."

      - slug: thrasymachus-and-the-ring
        title: "Justice as the interest of the stronger: Republic I–II"
        type: core
        status: planned
        goal: "Analyze Thrasymachus's and Glaucon's case that justice is a convention serving the strong, and Socrates's first replies"
        opening: "A shepherd finds a ring that makes him invisible. He can take what he likes and nobody will ever know. If he keeps behaving well anyway, is he just, or merely a fool? Plato puts this test in the mouth of a young man who wants to be shown that justice is good for the one who practises it, not only for those he spares. The lesson follows the challenge and the first attempts to answer it."
        est_minutes: 35
        prerequisites: [greek-miracle]
        concepts:
          introduces: [justice-as-advantage-of-the-stronger, ring-of-gyges]
          reinforces: [polis]
        key_ideas:
          - "Cephalus and Polemarchus — justice as paying debts, helping friends and harming enemies — refuted by counterexample"
          - "Thrasymachus — every regime legislates for its rulers' interest; the craft analogy and the shepherd's reply"
          - "Glaucon's social-contract origin of justice and the ring of Gyges; the perfectly unjust man who seems just"
          - "Why the challenge cannot be met by consequences and forces the construction of a city"
        demo: null
        notes: "Second easy opener (C3): the ring is the felt win — the reader states the challenge in their own words within ten minutes. Thrasymachus is taught at full strength (he returns as Carneades, Machiavelli and Schmitt)."

      - slug: kallipolis-and-the-philosopher-king
        title: "The city in speech: classes, the noble lie and the philosopher king"
        type: core
        status: planned
        goal: "Analyze how the Republic's city is built from the division of labour to the rule of philosophers, and what it assumes about human nature"
        opening: "To find out what justice is in a person, Socrates proposes to build a whole city from scratch and watch justice appear in it. The city needs farmers, soldiers and rulers; the question is who belongs in which class, who decides, and what the citizens must be told to keep the arrangement standing. The lesson builds the city step by step and asks at each step what the construction assumes."
        est_minutes: 45
        prerequisites: [thrasymachus-and-the-ring]
        concepts:
          introduces: [city-soul-analogy, three-classes, noble-lie, philosopher-king, allegory-of-the-cave]
          reinforces: [justice-as-advantage-of-the-stronger]
        key_ideas:
          - "The healthy city and the fevered city; guardians selected as spirited and gentle at once"
          - "Censorship, the metals myth and the 'medicinal' lie — what a ruling class may tell the ruled"
          - "Justice as each part doing its own work, in city and soul; three parts of the soul"
          - "The three waves (women guardians, abolition of the family, philosopher kings) and the Ship of State"
          - "The Cave and the sun — why the one who has seen must be compelled to rule"
        demo: null
        notes: "Strongest objections to include: Aristotle's 'all say mine' (Politics II.3) and the happiness-of-the-guardians objection raised inside the text (Adeimantus, IV). Popper's reading is named in References only."

      - slug: decline-of-regimes
        title: "The decline of regimes: from aristocracy to tyranny"
        type: core
        status: planned
        goal: "Explain Plato's account of how each regime produces the man who destroys it, why the freedom of democracy ends in tyranny, and what the Laws' moderated Sparta adds"
        opening: "A city ruled by the best men decays into one ruled by the honour-loving, then the money-loving, then the free, then a tyrant. Plato tells this as a sequence of fathers and sons, each generation reacting to the last. The lesson works through the five regimes and the five men, and asks whether the chain is a law or a warning."
        est_minutes: 35
        prerequisites: [kallipolis-and-the-philosopher-king]
        concepts:
          introduces: [regime-cycle, democratic-man, mixed-constitution]
          reinforces: [three-classes, city-soul-analogy]
        key_ideas:
          - "Timocracy, oligarchy, democracy, tyranny — each regime's defining desire and its characteristic man"
          - "Democracy's 'insatiable good' is freedom; the drones, the protector, the wolf"
          - "The tyrant as the most enslaved man; the three proofs that the just life is happier"
          - "Laws III as the second telling — Persia and Athens as the two mother forms, excess of despotism and excess of freedom"
        demo: null
        notes: "Forward links to be made explicit: Cicero Rep. I.xliii adapts this book; Tocqueville's soft despotism and Ortega's mass-man re-stage the democratic man. Teach the sequence as Plato's psychology of regimes, not as predictive history."

      - slug: platos-laws-second-best-city
        title: "Plato's Laws: the second-best city"
        type: extra
        status: planned
        goal: "Analyze how the Laws replaces the philosopher king with law, preambles and property limits, and what the change concedes"
        opening: "Three old men walk to the cave of Zeus on Crete and plan a real colony. They cannot have philosopher kings, so they have to say what a city can do with ordinary men: how much land each may hold, how laws should be worded to persuade before they compel, and what to do with a citizen who says there are no gods. The lesson reads the plan as Plato's own second thoughts."
        est_minutes: 30
        prerequisites: [decline-of-regimes]
        concepts:
          introduces: [preamble-to-law]
          reinforces: [regime-cycle, noble-lie, mixed-constitution]
        key_ideas:
          - "Sparta's moderation (two kings, elders, ephors) as the first mixed constitution; monarchy and democracy as mother forms"
          - "Rulers as 'servants of the law'; the preamble — persuasion before compulsion (the free doctor and the slave doctor)"
          - "5040 lots, four property classes, a wealth cap of four times the lot; why the very rich cannot be good"
          - "Book X — nature, chance and art; the materialist's 'might is right' answered by the priority of soul"
        demo: null
        notes: "Extra (starred) chapter — the core path survives without it; Aristotle II.6 supplies the standing objection (property limit without population limit)."

      - slug: aristotle-political-animal-and-natural-slavery
        title: "Aristotle on the household: the political animal, natural hierarchy and natural slavery"
        type: core
        status: planned
        goal: "Analyze Aristotle's argument that the city is natural and that some men are slaves by nature, and locate the difficulty he concedes inside it"
        opening: "Aristotle begins the Politics not with a city but with a household: a man, a woman, children, and slaves. He says each relation of ruler and ruled in it is natural, and that the city grows out of such households as an oak grows from an acorn. Then he faces an objection he reports from his own contemporaries: that slavery exists only by law and force, and is against nature. The lesson follows his answer and the place where he admits it does not quite work."
        est_minutes: 45
        prerequisites: [decline-of-regimes]
        concepts:
          introduces: [political-animal, natural-slavery, greek-barbarian, chrematistics]
          reinforces: [polis, three-classes]
        key_ideas:
          - "Household → village → city; nature is the end; the city is prior to the individual; man is a political animal because he has speech about the just"
          - "The ladder of rule — soul over body, reason over appetite, man over animal, male over female — and the natural slave who apprehends reason without having it"
          - "Slavery by law versus by nature (I.6) — war captives, Greeks who will not call Greeks slaves, and the concession that nature 'often fails' to make the bodies it intends"
          - "Greek and barbarian (I.2, VII.7) — the climate theory of spirited Europeans and servile Asians"
          - "Natural wealth-getting against unlimited acquisition; usury as the most unnatural"
        demo: null
        notes: "The internal difficulty is the lesson's centre: how do you tell a natural slave, and what if the master is the one with the slavish soul? Vitoria's rejection of this title (empire module) and Strauss's remark on the 'experience of history' are the forward hooks."

      - slug: aristotle-regimes-and-the-middle
        title: "Aristotle on who should rule: regimes, the multitude and the middle class"
        type: core
        status: planned
        goal: "Analyze Aristotle's six regimes and his answer to who should be sovereign, including his case for the rule of law and the middle"
        opening: "Five candidates claim the right to rule a city: the many, the rich, the well-born, the one best man, and the law. Aristotle shows that each claim, taken alone, leads to something unjust, and that a city can still be ranked better or worse by how it decides. The lesson follows his classification of regimes and the answer he settles on."
        est_minutes: 40
        prerequisites: [aristotle-political-animal-and-natural-slavery]
        concepts:
          introduces: [six-regimes, polity, rule-of-law, wisdom-of-the-multitude]
          reinforces: [mixed-constitution, regime-cycle]
        key_ideas:
          - "Who is a citizen; the good man and the good citizen; the constitution as the arrangement of offices"
          - "Six regimes by number and by end; the real difference between democracy and oligarchy is rich and poor"
          - "The wisdom of the multitude (the feast), the rule of law against the rule of the best man, ostracism of the pre-eminent"
          - "Polity as the mixture of oligarchy and democracy; the middle class as the stabilizer; the best regime for most cities"
        demo: null
        notes: "Objection to carry: Plato's charge that a mixture is not a regime at all (Laws IV) and Bodin's later rejection of the mixed state."

      - slug: aristotle-faction-and-the-best-life
        title: "Aristotle on why regimes fall and what a city is for"
        type: core
        status: planned
        goal: "Explain Aristotle's causes of faction and his account of the best life the city exists to make possible"
        opening: "Cities are overthrown by their own citizens far more often than by enemies. Aristotle collects the cases — a love quarrel in Syracuse, an heiress in Delphi, a Spartan land shortage — and asks what they have in common. The lesson draws out his theory of faction and preservation, then turns to the question underneath it: what the city is for in the first place."
        est_minutes: 40
        prerequisites: [aristotle-regimes-and-the-middle]
        concepts:
          introduces: [stasis, common-good]
          reinforces: [six-regimes, polity, political-animal]
        key_ideas:
          - "Every regime rests on a partial conception of equality (numerical vs proportional), and faction begins from the slighted party"
          - "The occasions of faction — insolence, fear, contempt, disproportionate growth — and the remedies, including law-abidingness in small things"
          - "Why tyranny is short-lived and how it survives (repression or 'playing the king')"
          - "The best life is virtuous activity, not conquest; the ideal city's size, site and citizens"
        demo: null
        notes: "The climate theory (VII.7) is already introduced in the household lesson; here it reappears as the question of who can be a citizen of the best state. Machiavelli's Discourses I.4 (conflict as the source of liberty) is the forward objection."

      - slug: sparta-as-test-case
        title: "Sparta read against Plato and Aristotle"
        type: core
        status: planned
        goal: "Apply the module's theories of the mixed constitution, hierarchy and decline to the actual Spartan regime and judge where each theory fits the record"
        opening: "Every thinker in this module admired Sparta and every one of them found something wrong with it. It had two kings, a council of elders, elected overseers and a citizen body of equals who ate together and trained for war; it also had a subject population many times larger that it held down by terror, and its citizen numbers fell until the city could no longer field an army. The lesson sets what is known of Sparta against what Plato and Aristotle said about it."
        est_minutes: 40
        prerequisites: [aristotle-faction-and-the-best-life]
        concepts:
          introduces: [spartan-constitution]
          reinforces: [mixed-constitution, natural-slavery, regime-cycle, stasis, isonomia]
        key_ideas:
          - "What the Spartan constitution was — kings, gerousia, ephors, assembly, helots, the agoge — and what the sources let us know"
          - "Plato's Sparta — timocracy in Republic VIII, the moderated monarchy of Laws III"
          - "Aristotle's Sparta — helot revolts, women holding two-fifths of the land, oliganthropia, a constitution aimed at one virtue only"
          - "Where the theories fit (the mixed constitution's stability, the single-virtue decline) and where they do not (the helots as a standing natural-slavery case the theory cannot classify)"
        demo: null
        notes: "Module application (L16): the real artefact is the Spartan regime as reported by Aristotle II.9, Plato Laws III, and the hoplite egalitarianism Vernant reconstructs; Toynbee's 'arrested civilization' chapter is the forward reading. State the departures from the idealisation explicitly."

  # ---------------------------------------------------------------------
  - slug: rome-and-christianity
    title: "Rome and the remaking of Christianity"
    outcomes: [co-reconstruct, co-objection, co-questions, co-apply]
    lessons:
      - slug: cicero-mixed-constitution
        title: "Cicero's res publica and the mixed constitution"
        type: core
        status: planned
        goal: "Analyze Cicero's definition of the republic and his case that Rome's mixed constitution is the best regime"
        opening: "In 129 BC, in a garden outside Rome, a general who has destroyed Carthage is asked which form of government is best. He answers by defining what a commonwealth is in the first place, then lets a friend argue for democracy, another for aristocracy, and himself for kingship — and then says Rome, which is none of these and all three, is better than any. The lesson follows the argument and the Roman history it rests on."
        est_minutes: 40
        prerequisites: [aristotle-regimes-and-the-middle]
        concepts:
          introduces: [res-publica, populus]
          reinforces: [mixed-constitution, six-regimes, regime-cycle]
        key_ideas:
          - "Why a statesman and not a philosopher should answer — virtue exists only in use"
          - "Res publica is res populi; a people is bound by agreement about right and community of interest"
          - "The three simple forms, their merits, and the cycle that carries each into its perversion"
          - "Rome king by king — each institution added by a different generation (Cato's thesis) — and the balance of consuls, senate and tribunes"
          - "The Dream of Scipio: why the statesman's reward is not here"
        demo: null
        notes: "Polybius is the named source of the cycle; keep him in References. The definition of populus is the one Augustine will test (XIX.21)."

      - slug: cicero-natural-law
        title: "Cicero on natural law: Carneades's challenge and Laelius's reply"
        type: core
        status: planned
        goal: "Analyze the case that justice is merely convention and Cicero's answer that true law is right reason in agreement with nature"
        opening: "A Greek sceptic once argued, in Rome, on consecutive days, first that justice is natural and then that it is not — and was asked to leave the city. Cicero gives his second speech to a friend: every people has different laws, the wise man who does not seize an advantage is a fool, and Rome itself grew great by injustice. The lesson follows the challenge and the reply that founded the Western idea of a law above the law."
        est_minutes: 40
        prerequisites: [cicero-mixed-constitution]
        concepts:
          introduces: [natural-law, just-war]
          reinforces: [justice-as-advantage-of-the-stronger, res-publica, populus]
        key_ideas:
          - "Carneades's case: variety of customs, utility against justice, the two men and the one plank"
          - "Laelius: true law is right reason, one, eternal, unchangeable; unjust statutes are not laws"
          - "Just war — only for defence or redress, declared, with faith kept; empire as rule over those who are better off ruled"
          - "The equality and likeness of all men (Laws I) and the kinship of gods and men — one commonwealth"
          - "Why a tyranny is not a res publica at all"
        demo: null
        notes: "This lesson seeds Aquinas, Vitoria, Burke's Hastings speech ('law and arbitrary power are in eternal enmity') and Strauss. Keep the Roman-imperial justification (III.36–37, rule over the servile as just) at full strength: it is the natural-slavery argument in Roman dress."

      - slug: hellenization-of-christianity
        title: "The Hellenization of Christianity: Harnack's thesis and Nietzsche's counter-thesis"
        type: core
        status: planned
        goal: "Explain how a Jewish movement was remade in Greek concepts and Roman forms, and compare Harnack's and Nietzsche's opposite verdicts on the result"
        opening: "The religion of Europe for fifteen centuries was founded by an Aramaic-speaking Galilean who never wrote a word and whose first followers expected the world to end. Within two hundred years it had a creed in Greek philosophical terms, bishops in Roman cities and a dispute about the metaphysics of the word 'substance'. One historian said the Gospel survived under all this as a kernel under husk; one philosopher said the whole thing was a foreign body in Europe from the start. The lesson sets the two accounts side by side."
        est_minutes: 45
        prerequisites: [cicero-natural-law]
        concepts:
          introduces: [hellenization, kernel-and-husk, logos-christology, pseudomorphosis]
          reinforces: [natural-law]
        key_ideas:
          - "What the Gospel was, on Harnack's reading — the kingdom within, the Father and the infinite value of the soul, the higher righteousness — and what it was not (a social programme, a philosophy)"
          - "Paul's breach with Judaism; the three stages of Greek influx; Logos = Christ; Gnosticism forcing dogma, law and hierarchy"
          - "The Greek Church as 'a Greek product in Christian dress', the Roman Church as the Empire continued — and the four costs Harnack counts"
          - "Nietzsche's counter-thesis — Christianity as the slave revolt and Paul's invention, alien to Greek nobility — read against Harnack, who claims the Gospel is 'ancient' only in its husk"
          - "Spengler's third view — Christianity as a Magian religion misshapen in Classical forms (pseudomorphosis)"
        demo: null
        notes: "Do not re-teach Nietzsche: Ref nietzsche/jesus-and-paul and nietzsche/slave-revolt-and-ressentiment for his account and reconstruct only the point of contact with Harnack. Prefer the full Harnack summary (source index 47) over the partial (8). Face the tension directly: both agree Europe's Christianity is Greek-made; they disagree on what the kernel was and whether it should have survived."

      - slug: constantine-and-representation
        title: "Constantine and the struggle for representation"
        type: core
        status: planned
        goal: "Analyze how the Roman Empire and the Church fought over who represented the truth of society, from the imperial cult to Eusebius and Augustine"
        opening: "An empire that had deified its emperors and tolerated every god so long as it was worshipped alongside them met a sect that refused the sacrifice and claimed its God was the only one. Within a century the emperor himself was presiding over the sect's councils. The lesson asks what each side gained and what it gave up, and uses the case to introduce a tool the course will keep: the idea that a society exists by being represented."
        est_minutes: 40
        prerequisites: [hellenization-of-christianity]
        concepts:
          introduces: [representation-existential, civil-theology, political-theology]
          reinforces: [logos-christology, res-publica]
        key_ideas:
          - "Three kinds of truth — cosmological, anthropological, soteriological — and Varro's three theologies"
          - "Rome's compactness: from patronate to principate, the imperial cult as civil theology, the edicts of 311 and 313"
          - "Celsus's objection to the Christians — a universal religion dissolves the empire — and Origen's reply"
          - "Eusebius makes the emperor Christ's representative; the Trinity ends political theology (or does it)"
          - "Existential vs transcendental representation — the tool, and the Soviet constitution as a modern test of it"
        demo: null
        notes: "Voegelin's New Science ch. III is the spine here; his vocabulary is introduced sparingly (three terms) and defined. Schmitt's 'political theology' (crisis module) and Voegelin's own lesson (postwar module) reinforce."

      - slug: augustine-two-cities
        title: "Augustine's two cities and the earthly peace"
        type: core
        status: planned
        goal: "Analyze Augustine's account of the two cities and his verdict that no earthly commonwealth can be just, and weigh what it leaves to politics"
        opening: "Rome has been sacked by Goths, and pagans say the new religion is to blame. A North African bishop answers with a history of the whole human race as two cities, one built on love of self and one on love of God, mixed together until the end of time. On the way he takes Cicero's definition of a republic and shows that by its own terms Rome never was one. The lesson follows what he puts in its place and what that leaves for rulers to do."
        est_minutes: 45
        prerequisites: [constantine-and-representation]
        concepts:
          introduces: [two-cities, libido-dominandi, ordo-amoris, splendid-vices]
          reinforces: [res-publica, populus, natural-slavery, natural-law]
        key_ideas:
          - "Two loves make two cities; pride as the first sin; the lust of ruling (libido dominandi) as the earthly city's engine — Cain and Romulus"
          - "Virtue is the order of love; passions are right when love is rightly placed (against Stoic apatheia)"
          - "Scipio's definition tested — no true justice without the true God, so Rome was never a republic; the revised definition of a people by the objects of its love"
          - "Slavery as the consequence of sin, not of nature; those who rule serve; the earthly peace of Babylon and how the pilgrim city uses it"
          - "Pagan virtue as splendid vice — the verdict Machiavelli will reverse"
        demo: null
        notes: "Objection to carry: the worldly charge (Machiavelli, Discourses II.2) that this teaching made men weak, and the internal one — if Rome is a people by Augustine's second definition, what work is 'justice' doing? Lilla's 'Eusebius vs Augustine' and Voegelin III.2 are the secondary frame."

      - slug: altar-of-victory
        title: "The Altar of Victory, 384: Symmachus and Ambrose"
        type: core
        status: planned
        goal: "Apply the module's accounts of representation, natural law and the two cities to the real exchange over the Altar of Victory and judge which account the documents bear out"
        opening: "In 382 a Christian emperor removed a pagan altar from the Roman Senate house and cut off the state funds that paid for the old rites. Two years later the prefect of Rome, a pagan senator, petitioned the boy emperor to put it back, and the bishop of Milan wrote two letters telling the emperor he could not. Both texts survive. The lesson reads them against everything this module has argued."
        est_minutes: 40
        prerequisites: [augustine-two-cities]
        concepts:
          introduces: []
          reinforces: [representation-existential, civil-theology, natural-law, two-cities, hellenization]
        key_ideas:
          - "What each party asked for and on what grounds — Symmachus's 'one road does not lead to so great a secret', Ambrose's warning that a Christian emperor who funds the old altar 'serves' idols and will find his bishop refusing him (Epistle 17) — with his later 'the emperor is within the Church, not above it' (386) as the doctrine it grew into"
          - "Civil theology on trial: Rome's ancestral cult as the condition of Rome's existence vs the Church as a new representative of society"
          - "Natural law read both ways — Symmachus's appeal to custom and Ambrose's to truth"
          - "Where the documents depart from the theories: a bishop who threatens, an emperor who negotiates, a cult that outlived its altar"
        demo: null
        notes: "Module application (L16). Primary texts: Symmachus, Relatio 3; Ambrose, Epistles 17 and 18 (NPNF translation, public domain) — not in the dossier; the brief gives the pointers. Voegelin III.3 covers the episode; Harnack XII on 'the Christian emperor as Oriental despot' and Augustine XIX.17 (the heavenly city preserves diverse laws) are the theoretical frames to test."

  # ---------------------------------------------------------------------
  - slug: christendom-to-sovereignty
    title: "From Christendom to the sovereign state: Aquinas, Machiavelli, Bodin, Hobbes"
    outcomes: [co-reconstruct, co-objection, co-questions, co-apply]
    lessons:
      - slug: aquinas-law-and-kingship
        title: "Aquinas on law and kingship: natural law, unjust law and tyranny"
        type: core
        status: planned
        goal: "Analyze Aquinas's hierarchy of laws and his account of kingship and tyranny, and explain what obedience is owed to an unjust law"
        opening: "A king asks a theologian how to rule. The theologian answers that the king is bound by a law he did not make and cannot repeal, that a law which violates it is not a law at all — and that subjects should usually obey it anyway. The lesson works through how all four of his kinds of law fit together, why he thinks one ruler is best and a tyrant worst, and why he forbids killing the tyrant."
        est_minutes: 45
        prerequisites: [augustine-two-cities]
        concepts:
          introduces: [eternal-law, human-law-determination, unjust-law-not-law, tyrannicide]
          reinforces: [natural-law, common-good, six-regimes, mixed-constitution]
        key_ideas:
          - "Law is an ordinance of reason for the common good, made by one who has care of the community, and promulgated"
          - "Eternal, natural, human and divine law; natural law as the rational creature's participation in the eternal law; its first precept and the order of inclinations"
          - "Human law derived by conclusion or by determination; why it cannot repress every vice; custom as law"
          - "An unjust law is violence rather than law, yet binds 'to avoid scandal' — the limits of resistance"
          - "De Regno: why one ruler is best and a tyrant worst; against private tyrannicide; the mixed regime of ST I-II 105"
        demo: null
        notes: "Vitoria's Salamanca lectures (empire module) are Aquinas applied; Strauss's 'Thomistic natural law' remark (ch. IV) and Scruton's 'natural law conservatives' are the forward echoes. Keep the quaestio form visible in one worked example."

      - slug: machiavelli-effectual-truth
        title: "Machiavelli's Prince: the effectual truth of things"
        type: core
        status: planned
        goal: "Analyze Machiavelli's argument that a prince must learn how not to be good, and the theory of virtù and fortune that supports it"
        opening: "A former diplomat, out of office and under suspicion, writes a short book for the family that has just taken his city. He says every previous writer imagined republics and principalities that never existed; he will describe how men actually keep power. The result inverts a thousand years of advice to rulers. The lesson follows the book's rules and the examples that back them."
        est_minutes: 45
        prerequisites: [aquinas-law-and-kingship]
        concepts:
          introduces: [effectual-truth, virtu-and-fortuna, armed-prophet, cruelty-well-used]
          reinforces: [splendid-vices, libido-dominandi, tyrannicide]
        key_ideas:
          - "New princes and how they are kept — Louis XII's five errors, colonies, the Turk and France"
          - "Armed and unarmed prophets (Moses, Cyrus, Savonarola); virtù and the occasion fortune provides"
          - "Cesare Borgia and Ramiro d'Orco; Agathocles — cruelty well used and badly used"
          - "Chapters XV–XVIII: the effectual truth, liberality, loved or feared, the lion and the fox; appearing to have the virtues"
          - "Fortune as a river and a woman; why the Italian princes lost their states"
        demo: null
        notes: "Objections to carry: Augustine's splendid vices read backward (this is the earthly city praised), Bodin's reversal of Machiavelli's answers on treaties and fear, Strauss's 'teacher of evil' charge (References). The Smith lectures' 'was Machiavelli a Machiavellian?' is the organising question for the republican reading in the next lesson."

      - slug: machiavelli-discourses-republic
        title: "Machiavelli's Discourses: conflict, religion and the free republic"
        type: core
        status: planned
        goal: "Analyze Machiavelli's republican teaching — that class conflict produced Roman liberty and that religion is a civic instrument — and reconcile it with The Prince"
        opening: "The same man who told a prince how to hold a city also wrote three books on how the Roman Republic stayed free for four hundred years. His answer is that Rome's liberty came from the quarrels between its nobles and its people, which every other writer had called a disease. The lesson reads the Discourses for a theory of freedom that no earlier author would have recognised."
        est_minutes: 40
        prerequisites: [machiavelli-effectual-truth]
        concepts:
          introduces: [conflict-as-source-of-liberty, civil-religion, return-to-beginnings]
          reinforces: [mixed-constitution, regime-cycle, effectual-truth]
        key_ideas:
          - "Founders and origins; the cycle of regimes and the mixed constitution — Rome stumbled into it through tumults"
          - "The tribunes: conflict between nobles and people as the guardian of liberty; accusation vs calumny"
          - "Numa's religion and the Roman auspices; Christianity's effect on civic vigour (II.2); the Church as the cause of Italy's division"
          - "Corruption, equality and 'gentlemen'; the return to first principles; the people wiser than the prince (I.58)"
          - "What the Prince and the Discourses share — the effectual truth applied to republics"
        demo: null
        notes: "Objection to carry: Bodin's and Hobbes's refusal of the mixed state (next lessons). Carlyle and Ortega inherit the 'founder' theme; Strauss's reading in References."

      - slug: bodin-sovereignty
        title: "Bodin's sovereignty: the commonwealth of two religions"
        type: core
        status: planned
        goal: "Analyze Bodin's definition of sovereignty and its attributes, and explain why he rejects the mixed constitution and any right of resistance"
        opening: "France in 1576 has two religions, a king who cannot pay his army, and a generation of pamphlets arguing that subjects may kill a tyrant. A lawyer and royal deputy answers with a new question — not 'who should rule' but 'what is a state' — and a new word for the thing that holds it together. The lesson defines that thing as he did and tests the definition on the cases he used."
        est_minutes: 45
        prerequisites: [machiavelli-discourses-republic]
        concepts:
          introduces: [sovereignty, state-vs-government, politique-toleration]
          reinforces: [mixed-constitution, tyrannicide, natural-law, six-regimes]
        key_ideas:
          - "Why the Wars of Religion made the medieval question ('who are the rulers and what are their powers') obsolete"
          - "Sovereignty is absolute and perpetual power; the sovereign makes law and is bound only by divine and natural law, fundamental laws and his own contracts"
          - "The attributes must be incommunicable; law-making contains all the others; hence no mixed state exists — Rome, Venice and England re-classified"
          - "Form of state vs form of government (a monarchy governed democratically); tyrant vs king, and why even a tyrant may not be killed by a subject"
          - "Climate and national character (Book V) and the politique case for tolerating two religions"
        demo: null
        notes: "Objection to carry: Aristotle and Polybius on the mixed state (the reader has them), and Bodin's own unresolved tension between right and fact (Tooley's introduction). Schmitt's Political Theology ch. 1 reads Bodin on the exception — forward hook."

      - slug: hobbes-state-of-nature-and-covenant
        title: "Hobbes: from the state of nature to the covenant"
        type: core
        status: planned
        goal: "Derive Hobbes's argument from natural equality through the war of all against all to the covenant that institutes a sovereign"
        opening: "Take away every judge, policeman and law, and leave people as they are. Hobbes asks what they would do, and argues from three plain facts about them — that they are roughly equal, that they want the same scarce things, and that each fears the others — to the conclusion that they would be at war, and from there to the one arrangement that could end it. The lesson rebuilds the derivation step by step."
        est_minutes: 45
        prerequisites: [bodin-sovereignty]
        concepts:
          introduces: [state-of-nature, laws-of-nature, covenant, authorization]
          reinforces: [sovereignty, justice-as-advantage-of-the-stronger, natural-law]
        key_ideas:
          - "Reason as reckoning; good and evil as names for appetite; why men need an arbitrator even to agree on what reason says"
          - "Equality of ability → equality of hope → diffidence → war; the three causes of quarrel; war as a disposition, not only battle"
          - "Right of nature and law of nature; the first two laws; covenants, and why 'covenants without the sword are but words'"
          - "Justice as keeping covenants; the Foole's objection answered"
          - "Representation — actor and author — and the covenant formula that makes a multitude one person; the Mortal God"
        demo: null
        notes: "Thrasymachus and Carneades are the backward links (the reader can state them); Locke's 'judge in his own cause' and Rousseau's 'Hobbes read society into nature' are the forward objections. Strauss's 'fear of violent death replaces the telos' is the frame for the postwar module."

      - slug: hobbes-sovereign-and-liberty
        title: "Hobbes on the rights of the sovereign and the liberty of subjects"
        type: core
        status: planned
        goal: "Analyze the powers Hobbes gives the sovereign, the liberties he leaves the subject, and his diagnosis of why commonwealths dissolve"
        opening: "Once a people has authorised one man or assembly to act for all of them, what may that sovereign do, and what may a subject still refuse? Hobbes answers that the sovereign can do almost anything — judge doctrine, assign property, make war — and cannot be accused of injustice, yet the subject keeps a liberty wherever the law is silent and loses his obligation the moment he loses protection. The lesson follows the rights, the liberties, and the doctrines Hobbes blames for England's civil war."
        est_minutes: 40
        prerequisites: [hobbes-state-of-nature-and-covenant]
        concepts:
          introduces: [indivisible-sovereignty, liberty-as-silence-of-law, protection-and-obedience]
          reinforces: [sovereignty, covenant, authorization, mixed-constitution]
        key_ideas:
          - "The twelve rights of the sovereign by institution; why he is not party to the covenant and cannot forfeit"
          - "Indivisibility — mixed government as a man with three bodies; 'tyranny' as monarchy disliked"
          - "Liberty as absence of impediment; the silence of the law; the critique of ancient liberty; what the subject may refuse (self-accusation, killing oneself)"
          - "Property, law and punishment as creations of the sovereign; the sovereign above the law and Coke's error"
          - "Chapter XXIX — the seditious doctrines (private judgment, conscience, divided sovereignty, imitation of Greeks and Romans) that dissolve a commonwealth"
        demo: null
        notes: "Locke's reply (judge in own cause; absolute monarchy as still in the state of nature) is the next module's opening; Oakeshott's reading of Hobbes as a moralist of individuality (Rationalism in Politics) and Schmitt's 'protego ergo obligo' are the forward frames."

      - slug: english-revolution-as-test
        title: "The English Revolution read against Hobbes"
        type: core
        status: planned
        goal: "Apply Hobbes's and Bodin's theories of sovereignty to the documents of 1642–1660 and judge where the record confirms the diagnosis and where it departs"
        opening: "In June 1642 Parliament sent the king nineteen demands that would have given it control of his ministers, his army and his children's education; the king's advisers answered with a defence of England as a mixed monarchy of king, Lords and Commons. Nine years later Hobbes blamed exactly that doctrine for the war that followed. The lesson reads the two documents, the war's course and the Restoration against the theory."
        est_minutes: 40
        prerequisites: [hobbes-sovereign-and-liberty]
        concepts:
          introduces: []
          reinforces: [sovereignty, indivisible-sovereignty, mixed-constitution, armed-prophet, protection-and-obedience, tyrannicide]
        key_ideas:
          - "The Nineteen Propositions and the King's Answer — the mixed-monarchy doctrine Hobbes attacks in Leviathan XXIX"
          - "The regicide of 1649 read with Bodin (no subject may judge the sovereign) and against the Vindiciae tradition"
          - "Cromwell as Machiavelli's armed prophet and Carlyle's later hero; the Protectorate as a sovereignty without legitimacy"
          - "1660: protection and obedience re-established — and what the theory cannot explain (why the restored monarchy accepted limits)"
        demo: null
        notes: "Module application (L16). Primary documents (Nineteen Propositions; His Majesty's Answer; the Act of Oblivion 1660) are public domain and not in the dossier; the brief points to them. Leviathan XXIX and Maistre's Hume collage (Considerations ch. 11, parallel of English and French revolutions) are the dossier anchors; Carlyle Lecture VI on Cromwell is a forward spiral."

  # ---------------------------------------------------------------------
  - slug: contract-revolution-reaction
    title: "Consent, Revolution and Reaction: Locke to Hegel"
    outcomes: [co-reconstruct, co-objection, co-questions, co-apply]
    lessons:
      - slug: locke-property-and-consent
        title: "Locke: property by labour and government by consent"
        type: core
        status: planned
        goal: "Analyze Locke's derivation of property from labour and of legitimate government from consent, and his case for a right of resistance"
        opening: "If men in a world without government are already under a law, already own things, and already have the right to punish those who wrong them, why would they ever set up a government — and what could they have agreed to give it? Locke answers against Hobbes on every point, and ends by justifying the overthrow of a king. The lesson follows the derivation and the objections Locke himself raises and answers."
        est_minutes: 45
        prerequisites: [hobbes-sovereign-and-liberty]
        concepts:
          introduces: [labour-theory-of-property, consent, right-of-resistance, appeal-to-heaven]
          reinforces: [state-of-nature, natural-law, sovereignty, covenant]
        key_ideas:
          - "A state of nature under the law of nature — freedom without licence; the executive power of the law of nature and the 'judge in his own cause' objection to Hobbes"
          - "Property — self-ownership, labour mixing, the spoilage and 'enough and as good' limits, and how money ends them; 'in the beginning all the world was America'"
          - "Why leave the state of nature — no settled law, no impartial judge, no power to execute; what is given up and what the legislative may never do"
          - "Express and tacit consent; the problem of those born under government; majority rule"
          - "Prerogative, the dissolution of government, and the appeal to heaven — who shall be judge"
        demo: null
        notes: "Objections to carry: Hume's 'Of the Original Contract' (Muller anthology ch. 1), Filmer, and Strauss's reading of Locke as Hobbes made respectable (ch. V.B). The America passages are reserved for the empire module (locke-and-mill-on-empire) but flagged here."

      - slug: rousseau-inequality-and-general-will
        title: "Rousseau: the origin of inequality and the general will"
        type: core
        status: planned
        goal: "Analyze Rousseau's account of how society made men unequal and his solution — a sovereign people obeying only the general will — and locate its hardest step"
        opening: "The first man who fenced a plot and said 'this is mine', and found people simple enough to believe him, founded civil society — and with it, says Rousseau, every crime and misery that followed. Yet the same author wrote the founding text of modern democracy. The lesson follows how the man who thought society corrupted men came to design a society in which each obeys only himself."
        est_minutes: 45
        prerequisites: [locke-property-and-consent]
        concepts:
          introduces: [amour-propre, general-will, legislator, civil-religion-rousseau]
          reinforces: [state-of-nature, consent, labour-theory-of-property, civil-religion]
        key_ideas:
          - "Natural man — healthy, solitary, pitying, with no reason and no vice; against Hobbes, who 'read society into nature'"
          - "Perfectibility, language, the first huts; esteem and amour-propre; 'this is mine'; the rich man's fraudulent contract"
          - "The social contract — total alienation to the whole; the general will vs the will of all; 'forced to be free'"
          - "Sovereignty inalienable and indivisible; the Legislator; why large states and representation fail"
          - "Civil religion and the intolerance of tolerance"
        demo: null
        notes: "Objections to carry at full strength: Maistre's Hottentot (Seventh Dialogue — society is as old as man), Constant's ancient vs modern liberty (via the Berlin volume, Gossman ch.), Hegel §258 on the general will as caprice, and Strauss on Rousseau as the first crisis of modernity."

      - slug: burke-reflections
        title: "Burke's Reflections: inheritance, prejudice and the partnership of generations"
        type: core
        status: planned
        goal: "Analyze Burke's case against the Revolution as a failure of knowledge before it is a failure of morals, and his account of what an inherited constitution knows"
        opening: "In November 1789 a London preacher told his congregation that England's own revolution of 1688 gave the people three rights: to choose their governors, to cashier them for misconduct, and to frame a government for themselves. A Whig member of Parliament who had defended the American colonists answered that England had claimed none of these, that France was about to find out why, and that a people who tried to design a society from principles would get Terror and then a general. The lesson follows the argument and the forecast."
        est_minutes: 45
        prerequisites: [rousseau-inequality-and-general-will]
        concepts:
          introduces: [entailed-inheritance, prejudice, little-platoon, natural-aristocracy, partnership-of-generations]
          reinforces: [consent, right-of-resistance, general-will, mixed-constitution, natural-law]
        key_ideas:
          - "Price's three rights answered from the Declaration of Right; 1688 as a 'revolution not made but prevented'"
          - "Liberty as an entailed inheritance; the method of nature; the little platoon"
          - "Natural aristocracy, property in the representation, and the arithmetic of 24 million against 200,000"
          - "Real rights vs metaphysical rights; government as a contrivance for human wants; prejudice as the general bank of nations and ages"
          - "Society as a partnership of the living, the dead and the unborn; 'sophisters, economists and calculators'; the forecast of Terror and Napoleon"
        demo: null
        notes: "Objections: Paine and Wollstonecraft (SEP 2.3), the 'Whig/Tory puzzle', Strauss's charge that Burke's historicism opens the road to Hegel (ch. VI.B), and the SEP's self-application problem for scepticism about reason. Burke's India (Hastings) is held for the empire module."

      - slug: maistre-and-bonald
        title: "Maistre and Bonald: Providence, the executioner and the critique of constitution-making"
        type: core
        status: planned
        goal: "Analyze the counter-revolutionary case that no constitution can be made by deliberation and that authority rests on something reason cannot reach, and weigh the charge that it leads to fascism"
        opening: "A Savoyard exile watching the Revolution from Lausanne concludes that it is not a crime men committed but a punishment God is carrying out through men who think they are leading it. From that he draws rules: that no nation can give itself a constitution, that there is no such thing as 'man' in general, and that the executioner is the hidden bond of society. The lesson reconstructs the argument he and his ally Bonald made, and then puts to it the most famous charge against it."
        est_minutes: 45
        prerequisites: [burke-reflections]
        concepts:
          introduces: [providence-in-history, no-such-thing-as-man, executioner, counter-revolution]
          reinforces: [entailed-inheritance, prejudice, general-will, sovereignty]
        key_ideas:
          - "Providence — men lead the Revolution, the Revolution leads men; the Revolution as punishment of a guilty nation"
          - "Thirteen propositions on constitutions — nothing durable is made by deliberation; the unwritten part; 'I have seen Frenchmen, Italians, Russians... but man I have never met'"
          - "Bonald — society precedes the individual; the family as the model; against divorce and the contract; religion as the state's foundation — and the executioner (First Dialogue): 'all greatness, all power, all subordination rest on the executioner'"
          - "Counter-revolution is not a revolution in reverse; Maistre vs Burke (Act of Settlement, contract, slow growth)"
          - "Berlin's charge — the origins of fascism — and the replies (Garrard; Maistre's own realism about the Restoration)"
        demo: null
        notes: "Bonald is thin in the dossier (Muller's On Divorce excerpts; Schmitt PT ch. 4; Berlin II) — the brief must say so and name the pages. The war theme is held for the extra lesson war-is-divine. Schmitt's 'decision vs everlasting conversation' (PT ch. 4) is the forward reading."

      - slug: war-is-divine
        title: "Maistre's Seventh Dialogue: war, sacrifice and the soldier"
        type: extra
        status: planned
        goal: "Analyze Maistre's argument that war is a divine law of expiation and compare it with Hegel's and Schmitt's accounts of war"
        opening: "Why is the soldier honoured and the executioner shunned, when both kill by law? A stranger from another world, Maistre says, would get it exactly backwards — and the fact that we do not needs explaining. The lesson follows his answer, that war is a law of the world under which blood is demanded and innocence pays for guilt, and compares it with the two other accounts of war the course meets."
        est_minutes: 30
        prerequisites: [maistre-and-bonald]
        concepts:
          introduces: [war-as-expiation]
          reinforces: [executioner, providence-in-history]
        key_ideas:
          - "The visiting stranger — soldier and executioner as the two legal killers and the inverted honour"
          - "The universal law of violent death; the earth as an altar; 'war is divine' in seven senses"
          - "Against the state of nature and against perpetual peace (Saint-Pierre); why nations never left the state of nature among themselves"
          - "Moral force in battle — 'a lost battle is a battle one believes one has lost' (the Tolstoy link); Hegel §§321–340 and Schmitt's 'real possibility of killing' as comparison"
        demo: null
        notes: "Extra (starred) chapter; the core path survives without it. Berlin V (pp. 120–122) and Garrard II give the secondary debate."

      - slug: hegel-ethical-life-and-the-state
        title: "Hegel's Philosophy of Right: ethical life and the rational state"
        type: core
        status: planned
        goal: "Analyze Hegel's argument that freedom is realised only in family, civil society and state, and his critique of the social contract and of the Revolution's negative freedom"
        opening: "The Revolution promised freedom and delivered the Terror; the reaction promised order and delivered a police state. A professor in Berlin claims both sides misunderstood freedom: it is not the absence of restraint and not obedience to tradition, but a structure a person grows into — family, the market, the state — and knows as his own. The lesson rebuilds the structure in his order and asks what it concedes to each side."
        est_minutes: 45
        prerequisites: [maistre-and-bonald]
        concepts:
          introduces: [ethical-life, civil-society, rational-state, world-history-as-judge]
          reinforces: [general-will, consent, entailed-inheritance, partnership-of-generations, natural-law]
        key_ideas:
          - "'What is rational is actual' and the owl of Minerva — what philosophy of politics can and cannot do"
          - "Will and freedom; negative freedom and the fanaticism of the Revolution (§5); abstract right — property as the embodiment of freedom (against Plato's communism, and slavery)"
          - "Morality and its emptiness (Kant); ethical life — family, civil society (the system of needs, estates, the rabble, colonies), the state as the actuality of the ethical Idea"
          - "Why the state is not a contract (§258, against Rousseau and Haller); constitutional monarchy, the Estates, public opinion"
          - "War and the state as an individual; world history as the court of judgment; the four realms"
        demo: null
        notes: "Objections: Marx's inversion (next module), Strauss's 'historicism' (ch. I), Popper in References only; the conservative reception (Sittlichkeit in SEP 2.4, Scruton's debt). Prefer the Additions as the entry point for examples."

      - slug: assignats
        title: "The assignats: Burke's forecast against the record"
        type: core
        status: planned
        goal: "Test Burke's and Maistre's predictions about the Revolution's paper money and its legislation against the recorded depreciation of the assignat and the count of laws, and say where the theory and the record part"
        opening: "In 1790 the National Assembly confiscated the lands of the Church and issued paper notes backed by them. Burke wrote that same year that the scheme would end as John Law's Mississippi scheme had, in worthless paper and a government living by force; Maistre later counted the laws the revolutionary assemblies passed and said no society could absorb them. Both forecasts can be checked. The lesson checks them."
        est_minutes: 40
        prerequisites: [hegel-ethical-life-and-the-state]
        concepts:
          introduces: []
          reinforces: [entailed-inheritance, prejudice, providence-in-history, no-such-thing-as-man, rational-state]
        key_ideas:
          - "What the assignat was — a land-backed note that became a currency — and what Burke said about a 'Church-land bank' in 1790"
          - "The depreciation series 1790–1796 and the end in 1796; Law's Mississippi as Burke's comparison case"
          - "Maistre's 15,479 laws and 'three constitutions in five years' as a measurable claim about legislative over-production"
          - "Where the record departs from the critics — the Revolution's institutions that lasted (departments, the Code) against the prediction that nothing designed can endure"
        demo: null
        notes: "Module application (L16). Burke, Reflections S2 l.1877–1972 and S4 l.1299–1604 are the dossier anchors; the depreciation series is public (Bibliothèque nationale / standard economic histories — the brief names where to obtain it). Computation only inside the source inquiry (playbook-history rule 4)."

  # ---------------------------------------------------------------------
  - slug: democracy-and-its-critics
    title: "Democracy and its critics: Tocqueville, Carlyle, Mill, Marx"
    outcomes: [co-reconstruct, co-objection, co-questions, co-apply]
    lessons:
      - slug: tocqueville-equality-and-the-township
        title: "Tocqueville: equality of conditions and the township"
        type: core
        status: planned
        goal: "Explain Tocqueville's claim that equality of conditions is a providential fact and his account of the institutions and manners that let America live with it"
        opening: "A young French aristocrat whose great-grandfather went to the guillotine and whose parents barely escaped it spends nine months in the United States in 1831 and comes back convinced that the levelling that destroyed his class is coming to Europe whether anyone wants it or not. The question he sets himself is not whether to stop it but what makes it bearable in the one country where it has gone furthest. The lesson follows his answer from inheritance law to the town meeting to the pulpit."
        est_minutes: 45
        prerequisites: [hegel-ethical-life-and-the-state]
        concepts:
          introduces: [equality-of-conditions, township, art-of-association, mores]
          reinforces: [rational-state, natural-aristocracy, little-platoon, civil-society]
        key_ideas:
          - "Equality of conditions as the generative fact; seven centuries of levelling; the choice between equality in liberty and equality in servitude"
          - "The law of descent — how partible inheritance dissolves the landed family and 'the family-estate identity'"
          - "The township and the art of association — three degrees of association; why democracies need them more than aristocracies"
          - "Religion as a political institution; manners count for more than laws, laws for more than physical circumstance (the South America test)"
          - "Patriotism of instinct vs reflection; interest rightly understood"
        demo: null
        notes: "Objection to carry: Burke's and Maistre's hierarchy — Tocqueville concedes the aristocratic order's advantages in the Introduction and judges them lost. Smith's Yale lectures 21–23 give the organising problems."

      - slug: tocqueville-tyranny-of-majority-and-soft-despotism
        title: "Tocqueville: the tyranny of the majority and soft despotism"
        type: core
        status: planned
        goal: "Analyze Tocqueville's two dangers of democracy — the omnipotent majority and the tutelary state — and the counterweights he proposes"
        opening: "Tocqueville saw no king, no nobility and no church with power in America, and concluded that this made it the first country where one force — the majority — could not be resisted at all. Twenty years later he foresaw a second danger that did not look like tyranny: a gentle, provident power that spares men the trouble of living. The lesson reconstructs both dangers and the institutions he thought could hold them off."
        est_minutes: 45
        prerequisites: [tocqueville-equality-and-the-township]
        concepts:
          introduces: [tyranny-of-the-majority, individualism-tocqueville, soft-despotism]
          reinforces: [equality-of-conditions, art-of-association, township, democratic-man, regime-cycle]
        key_ideas:
          - "The majority's moral power; no mixed government; the Baltimore and Pennsylvania cases; the majority over opinion — 'no literature'"
          - "Lawyers and the jury as the aristocratic counterpoise; centralized government vs centralized administration"
          - "Individualism (not egotism) — why equality isolates; the restless pursuit of comfort"
          - "Why democratic ideas and sentiments both favour a single central power; the European survey of encroachment"
          - "Soft despotism — 'an immense tutelary power', 'a flock of timid and industrious animals' — and the remedies (associations, press, courts, forms, local liberty)"
        demo: null
        notes: "Forward links: Mill's On Liberty borrows the 'tyranny of opinion'; Ortega's mass-man and Deneen's 'administrative despotism' are later restagings; Scruton's autonomous institutions are Tocqueville's remedies. Plato's democratic man is the backward Ref."

      - slug: carlyle-heroes
        title: "Carlyle: hero-worship, the cash-nexus and the aristocracy of talent"
        type: core
        status: planned
        goal: "Analyze Carlyle's argument that history is the work of great men, that society rests on reverence for them, and that laissez-faire has replaced every bond with cash payment"
        opening: "In 1840 a Scottish historian tells a London audience that the history of the world is the biography of its great men, that worship of them is the one thing that has never died out, and that a society which has lost it will be governed by quacks. Three years later he describes England as a land starving amid plenty, where the only tie between men is payment. The lesson follows the two books as one argument and sets Mill's reply against it."
        est_minutes: 40
        prerequisites: [tocqueville-tyranny-of-majority-and-soft-despotism]
        concepts:
          introduces: [hero-worship, cash-nexus, aristocracy-of-talent]
          reinforces: [natural-aristocracy, armed-prophet, equality-of-conditions, democratic-man]
        key_ideas:
          - "Great men as 'lightning' and the age as 'dry fuel'; society as a Hero-archy; against the 'creature of the Time' theory"
          - "Sincerity as the mark of the hero (Mahomet against the impostor theory; Cromwell against the Valet-World); Divine Right or Diabolic Wrong"
          - "The Condition-of-England question — Midas, the Sphinx, Peterloo; Mammonism and Dilettantism; cash payment 'the sole nexus'"
          - "Captains of Industry, the Aristocracy of Talent and 'Morrison's Pill'; democracy as the absence of real superiors"
          - "What the argument asserts and never proves — rhetoric as method"
        demo: null
        notes: "Objections: Mill's chapter on individuality (genius needs liberty, not reverence); Marx's 'feudal socialism' label for exactly this critique of capitalism (Manifesto III.1); Nietzsche's contempt for Carlyle (Ref nietzsche/skirmishes-of-an-untimely-man). Ortega's noblesse oblige is the forward echo."

      - slug: mill-liberty-and-its-limits
        title: "Mill's On Liberty: the harm principle and its limits"
        type: core
        status: planned
        goal: "Analyze Mill's harm principle and his case for liberty of thought and individuality, and evaluate the two strongest conservative replies"
        opening: "If a whole society holds an opinion and one man disagrees, Mill says, the society has no more right to silence him than he would have to silence it. He wants one simple rule for when a society may coerce one of its members, and he tests it on the hardest cases he can find — belief in God, Mormon polygamy, the Sabbath. The lesson reconstructs the rule, its defence, the places Mill himself limits it, and the replies that said the rule cannot do its work."
        est_minutes: 45
        prerequisites: [carlyle-heroes]
        concepts:
          introduces: [harm-principle, liberty-of-thought, individuality-mill, civilized-community-clause]
          reinforces: [tyranny-of-the-majority, hero-worship, consent]
        key_ideas:
          - "Liberty vs authority; social tyranny worse than political; the harm principle stated and its exclusions (children, 'backward states of society')"
          - "Liberty of thought — the infallibility argument, the dead-dogma argument, half-truths; the chilling effect"
          - "Individuality — Humboldt's two requisites, the tree and the machine, genius and the despotism of custom (China, Tocqueville's assimilation)"
          - "Applications — poisons, the Maine Law, Mormons, the sale of oneself into slavery"
          - "The replies — Stephen's Liberty, Equality, Fraternity (coercion by opinion is how societies work; parliament as disguised compulsion), Arnold's 'doing as one likes' against culture, Scruton's 'morality and law'; and Mill's own 'civilized community' clause as the seed of the empire module"
        demo: null
        notes: "Taught fairly, at full strength, as the liberal position the rest of the course argues against. Representative Government ch. XVIII is held for locke-and-mill-on-empire."

      - slug: marx-manifesto
        title: "Marx and Engels: class struggle and the bourgeois revolution"
        type: core
        status: planned
        goal: "Analyze the Manifesto's theory of history as class struggle and its account of the bourgeoisie, and compare it with the conservative critics of capitalism who reached similar diagnoses"
        opening: "In 1848 two Germans write a pamphlet claiming that all history is the struggle between classes, that the middle class has been the most revolutionary force that ever existed — it 'melts into air' everything solid — and that it is now producing the class that will bury it. The lesson reconstructs the argument, and then notices how much of its description of capitalism the right had already said, and why Marx despised them for it."
        est_minutes: 40
        prerequisites: [mill-liberty-and-its-limits]
        concepts:
          introduces: [class-struggle, bourgeois-revolution, proletariat]
          reinforces: [cash-nexus, civil-society, equality-of-conditions, labour-theory-of-property]
        key_ideas:
          - "History as class struggle; the bourgeoisie's rise and revolutionary role; the state as 'a committee for managing the common affairs of the whole bourgeoisie'"
          - "'All that is solid melts into air' — the world market, the cash nexus, the end of tradition; productive forces against property relations; crises"
          - "The formation of the proletariat; the Communists' programme; the family, nation and 'eternal truths' objections answered"
          - "Reactionary socialism — Marx's contempt for the feudal critique of capitalism he partly shares (Carlyle, Disraeli's One Nation)"
          - "Replies — Tocqueville's industrial aristocracy, Schumpeter on aptitude and mobility, Hayek on social justice, Scruton on alienation"
        demo: null
        notes: "Taught fairly; Marx appears here as a position the right argued with (Scruton's Meaning ch. 5–6 is a conservative reading of alienation). Hegel's civil society and its rabble (§§241–248) is the backward link."

      - slug: nietzsche-on-the-right
        title: "Nietzsche's inheritance on the right"
        type: extra
        status: planned
        goal: "Describe what the twentieth-century conservative tradition took from Nietzsche's critique of equality and where it parted from him, with pointers to the Nietzsche course"
        opening: "A philosopher who despised nationalists, antisemites and the German state became, within thirty years of his death, the thinker every anti-liberal in Europe quoted. The lesson does not re-teach his argument — another course does that — but follows what Mann, Spengler, Ortega, Strauss and Scruton each took from it and what each refused."
        est_minutes: 20
        prerequisites: [marx-manifesto]
        concepts:
          introduces: [aristocratic-radicalism]
          reinforces: [hero-worship, equality-of-conditions, democratic-man]
        key_ideas:
          - "What the critique of equality says (Ref nietzsche/herd-morality-in-modern-dress, nietzsche/order-of-rank) and why it is not conservative (Ref nietzsche/nietzsche-and-politics)"
          - "Mann's Dreigestirn, Spengler's 'transvaluation as mark of Civilization', Ortega's noblesse oblige — three borrowings"
          - "Strauss's 'radical historicism' and the second crisis of modernity; Scruton's Arnold against Nietzsche"
          - "The Nazi appropriation as the limit case (Ref nietzsche/the-nazi-appropriation)"
        demo: null
        notes: "Extra (starred) chapter. Reception only — every claim about Nietzsche's own position is a Ref into content/courses/nietzsche, never a re-exposition."

      - slug: british-franchise
        title: "The British franchise 1832–1928 as a test of the democracy critics"
        type: core
        status: planned
        goal: "Apply Tocqueville's law of franchise extension and the fears of Carlyle, Stephen and Arnold to the sequence of British Reform Acts, and judge what the record bears out"
        opening: "Tocqueville wrote that once a nation starts widening the vote it cannot stop short of universal suffrage. Britain widened it in 1832, 1867, 1884, 1918 and 1928, each time after a debate in which the critics in this module said what would follow. The lesson lays the five Acts and what they did to the electorate against the predictions, and asks what each theorist got right."
        est_minutes: 40
        prerequisites: [marx-manifesto]
        concepts:
          introduces: []
          reinforces: [equality-of-conditions, tyranny-of-the-majority, soft-despotism, hero-worship, harm-principle, class-struggle]
        key_ideas:
          - "The five Acts and the share of adults enfranchised after each — the series as the real artefact"
          - "Tocqueville's 'invariable rule' tested; Carlyle's and Arnold's 'doing as one likes'; Stephen's parliament as disguised compulsion; Marx's Chartists"
          - "What followed each extension (parties, the press, the welfare state) read against soft despotism"
          - "Where the record departs — a landed aristocracy that led the extensions, a franchise that lagged the theory by a century"
        demo: null
        notes: "Module application (L16). Electorate figures are public (standard constitutional histories; the brief names sources). Tocqueville Vol. I ch. IV is the dossier anchor; Stephen and Arnold via the Muller anthology ch. 3."

  # ---------------------------------------------------------------------
  - slug: crisis-of-liberal-europe
    title: "Kultur against Zivilisation: the crisis of liberal Europe, 1914–1933"
    outcomes: [co-reconstruct, co-objection, co-questions, co-apply]
    lessons:
      - slug: mann-reflections
        title: "Thomas Mann's Reflections of a Nonpolitical Man: Kultur against Zivilisation"
        type: core
        status: planned
        goal: "Analyze Mann's wartime case that German Kultur and Western Zivilisation are two incompatible ideas of how to live, and his own later reversal"
        opening: "In 1914 Germany's most famous novelist sets out to explain why he is on his country's side in a war the rest of educated Europe calls a war of civilisation against barbarism. It takes him four years and six hundred pages, and the enemy he finds is not France but a type: the writer who turns art into politics and politics into a creed. The lesson reconstructs his two ideas — Kultur and Zivilisation — and the man he set against them."
        est_minutes: 45
        prerequisites: [mill-liberty-and-its-limits, marx-manifesto]
        concepts:
          introduces: [kultur-vs-zivilisation, zivilisationsliterat, burgerlichkeit]
          reinforces: [hero-worship, equality-of-conditions, individuality-mill]
        key_ideas:
          - "The Kultur/Zivilisation formula — music against literature, inwardness against politics, Bildung against the Rights of Man"
          - "The Zivilisationsliterat — the Jacobin type, the politicisation of everything, 'democracy = politicisation'"
          - "Burger vs bourgeois vs Philister; the apolitical German Bürger of 1820–60; Schopenhauer, Wagner and Nietzsche as the 'three-star constellation'"
          - "Macht und Geist — Mann's theory of the state; irony against radicalism; conservatism as 'the erotic irony of the spirit'"
          - "The reversal — 'Von deutscher Republik' (1922) — as Mann's own objection to the book"
        demo: null
        notes: "Nietzsche enters by Ref (nietzsche/nietzsche-and-politics; the extra lesson nietzsche-on-the-right). Lilla's Introduction (the Naphta footnote; Mann and Musil) gives the secondary frame. Use short quotations only — the text is in copyright."

      - slug: ortega-revolt-of-the-masses
        title: "Ortega y Gasset: the mass-man and the revolt of the masses"
        type: core
        status: planned
        goal: "Analyze Ortega's diagnosis of the mass-man and his account of why a civilisation that produced him cannot be run by him"
        opening: "Everywhere is crowded — the cafés, the trains, the beaches, the theatres — and the crowd, which used to stay in the background, now occupies the places and the functions that minorities held. A Spanish philosopher in 1930 says this visible fact is the key to Europe's crisis: a new type of man has appeared, satisfied with himself, demanding rights without duties, and he is not a social class. The lesson follows the diagnosis and the cure Ortega proposes."
        est_minutes: 40
        prerequisites: [mann-reflections]
        concepts:
          introduces: [mass-man, noblesse-oblige, hyperdemocracy, nation-as-project]
          reinforces: [democratic-man, soft-despotism, hero-worship]
        key_ideas:
          - "Mass and minority as kinds of men, not classes; 'to be different is indecent'; hyperdemocracy and direct action"
          - "Nobility is obligation — rights held vs upheld; the spoilt child and the heir; the self-satisfied man"
          - "The barbarism of specialisation — the scientist as mass-man; the State as the greatest danger"
          - "Europe rules by public opinion, not force; the nation as a project of common future, not blood, language or territory (Renan's plebiscite)"
          - "The real question — a Europe without a moral code; 'youth' as blackmail"
        demo: null
        notes: "Ortega is a liberal ('liberalism is supreme generosity') who attacks the masses — the objection to carry is from Schmitt (the political cannot be dissolved into opinion) and from the left (the 'mass' as a category that hides class). Spengler is criticised by Ortega (ch. IX, XIV.2): a forward spiral to the civilization module."

      - slug: schmitt-concept-of-the-political
        title: "Schmitt's Concept of the Political: friend and enemy"
        type: core
        status: planned
        goal: "Analyze Schmitt's criterion of the political as the friend–enemy distinction and his charge that liberalism depoliticises by disguise"
        opening: "What makes a question political rather than economic, moral or aesthetic? A German jurist in 1927 answers that it is not the subject matter but the intensity: any opposition becomes political when it groups men into friends and enemies who might kill each other. From that he argues that liberalism, which wants politics replaced by discussion and trade, has never had a politics of its own. The lesson rebuilds the criterion and its consequences."
        est_minutes: 45
        prerequisites: [ortega-revolt-of-the-masses]
        concepts:
          introduces: [friend-enemy-distinction, depoliticization, pluriverse-of-states]
          reinforces: [sovereignty, protection-and-obedience, state-of-nature, mass-man]
        key_ideas:
          - "The state presupposes the political; the absolute, neutral and total state"
          - "Friend and enemy as an autonomous distinction; hostis not inimicus; the enemy as the existentially other; war as presupposition, not goal"
          - "The political as intensity, not a domain; the state's jus belli and the internal enemy; protego ergo obligo"
          - "'Whoever invokes humanity wants to cheat' — humanity as a war-concept; no world state; the pluriverse"
          - "Political anthropology — every genuine political theory presupposes man as dangerous; liberalism's critique of politics"
        demo: null
        notes: "Objections: Ortega (rule is opinion, not force), the liberal reply (the criterion describes war, not politics), Strauss's 1932 'Notes' (References), and Schmitt's own 1963 Foreword admitting the 'friend-enemy theory' slogan misread him. His 1933 Nazi membership is reported where Strong and Schwab report it, as fact bearing on the reception."

      - slug: schmitt-political-theology
        title: "Schmitt's Political Theology: sovereignty and the exception"
        type: core
        status: planned
        goal: "Analyze Schmitt's definition of the sovereign as the one who decides on the exception, and his thesis that modern political concepts are secularised theology"
        opening: "Every legal order assumes a normal situation in which its rules can be applied. Who decides that the situation is no longer normal, and what the law then is? Schmitt answers in one sentence — 'sovereign is he who decides on the exception' — and then argues that this question, which liberal legal theory tries to abolish, is the same question theology asked about miracles. The lesson follows the definition, the critique of legal positivism, and the counter-revolutionary tradition Schmitt claims as his own."
        est_minutes: 45
        prerequisites: [schmitt-concept-of-the-political]
        concepts:
          introduces: [state-of-exception, decisionism, secularization-thesis]
          reinforces: [sovereignty, political-theology, counter-revolution, no-such-thing-as-man, friend-enemy-distinction]
        key_ideas:
          - "The exception as a borderline concept; Bodin and Pufendorf on it; Article 48; norm vs decision — 'all law is situational law'"
          - "Kelsen's pure theory and Krabbe's sovereignty of law refuted — a decision cannot be derived from a norm"
          - "'All significant concepts of the modern theory of the state are secularized theological concepts' — the exception as miracle, deism as constitutionalism, immanence replacing transcendence"
          - "Bonald, Maistre and Donoso Cortés — decision against the 'everlasting conversation'; dictatorship vs discussion; legitimacy to dictatorship"
          - "Commissarial vs sovereign dictatorship (the distinction Weimar would test)"
        demo: null
        notes: "Backward Refs: Bodin (sovereignty), Maistre (the executioner, infallibility), constantine-and-representation (Voegelin's 'end of political theology' is the standing objection). Kierkegaard's 'exception more interesting than the rule' is a set piece."

      - slug: article-48-weimar
        title: "Article 48 and the end of the Weimar Reichstag, 1930–1933"
        type: core
        status: planned
        goal: "Apply Schmitt's theory of the exception and his distinction between commissarial and sovereign dictatorship to the record of presidential decrees and Reichstag laws, and judge whether the theory described the collapse or helped produce it"
        opening: "Between 1930 and 1932 the German parliament passed fewer and fewer laws while the president signed more and more emergency decrees under one article of the constitution; by 1932 the Reichstag met for a handful of days. The jurist who had defined sovereignty by the exception was advising the government. The lesson sets the counts against the theory."
        est_minutes: 40
        prerequisites: [schmitt-political-theology]
        concepts:
          introduces: []
          reinforces: [state-of-exception, decisionism, friend-enemy-distinction, sovereignty, mass-man, kultur-vs-zivilisation]
        key_ideas:
          - "Article 48 as written and as used — the decree and law counts 1930–32 as the artefact"
          - "Commissarial dictatorship (saving the constitution) vs sovereign dictatorship (replacing it) — which was this"
          - "The Preussenschlag of 1932 and Schmitt's brief for the Reich; 'Legalität und Legitimität' and the equal chance"
          - "Where the record departs from the theory — a parliament that abdicated by procedure, a president who decided nothing, and a movement that took power legally"
        demo: null
        notes: "Module application (L16). Counts (laws vs Art. 48 decrees per year; Reichstag sitting days) are in standard Weimar histories — the brief names them; Schwab's introduction III and Strong's foreword are the dossier anchors for Article 48 and Schmitt's role."

  # ---------------------------------------------------------------------
  - slug: civilizations
    title: "Civilizations: one or many — Spengler, Toynbee, Huntington"
    outcomes: [co-reconstruct, co-objection, co-questions, co-apply, co-contested]
    lessons:
      - slug: spengler-decline-of-the-west
        title: "Spengler's Decline of the West: Cultures as organisms"
        type: core
        status: planned
        goal: "Analyze Spengler's morphology of Cultures — birth, Culture, Civilization, Caesarism — and evaluate the method that claims to predict the West's future from its contemporaries"
        opening: "A Munich schoolteacher publishes, in the summer of the German collapse, a book claiming that there is no such thing as world history, only eight great Cultures each living about a thousand years, and that the West is in the stage Rome reached around 100 BC. If he is right, the democracy, money and machines of 1918 are symptoms with a known course. The lesson reconstructs the morphology and asks what kind of claim it is."
        est_minutes: 45
        prerequisites: [mann-reflections, ortega-revolt-of-the-masses, decline-of-regimes]
        concepts:
          introduces: [culture-vs-civilization-spengler, prime-symbol, contemporaneity, caesarism]
          reinforces: [kultur-vs-zivilisation, regime-cycle, pseudomorphosis, mass-man]
        key_ideas:
          - "Ptolemaic vs Copernican history; eight high Cultures; against the three-age scheme and 'progress'"
          - "Cultures as organisms — birth, growth, Civilization, death; 'contemporaneous' events across Cultures (Alexander and Napoleon)"
          - "Prime symbols — Apollinian body, Magian cavern, Faustian infinite space — read in mathematics, art and physics"
          - "Culture vs Civilization — the world-city, money, democracy as plutocracy, the Press; Caesarism as the end of democracy; the Machine"
          - "Nietzsche's transvaluation as a Civilization phenomenon; Spengler's politics (Prussianism) — what the method does and does not license"
        demo: null
        notes: "Objections: Ortega (ch. IX, XIV.2 — decline as a commonplace; the method's unfalsifiability), Toynbee (next lesson — the organism analogy refuted), and Nietzsche's own anti-systematic use (Ref nietzsche/eternal-recurrence where Spengler misreads). Short quotations only; Atkinson translation is public domain in some jurisdictions — check."

      - slug: toynbee-challenge-and-response
        title: "Toynbee: challenge and response, breakdown and disintegration"
        type: core
        status: planned
        goal: "Analyze Toynbee's theory of how civilizations arise, grow, break down and disintegrate, and evaluate its method of comparison across twenty-one cases"
        opening: "If England's history cannot be understood without Europe's, what is the smallest unit of history that can be understood on its own? Toynbee answers: a civilization, of which he counts twenty-one, and then asks why some arose where others did not, why most broke down, and whether the West must. He refuses the answers from race, climate and organic lifespan, and proposes a different mechanism. The lesson follows it and tests it on his own cases."
        est_minutes: 45
        prerequisites: [spengler-decline-of-the-west]
        concepts:
          introduces: [challenge-and-response, creative-minority, breakdown-of-civilizations, universal-state]
          reinforces: [culture-vs-civilization-spengler, spartan-constitution, mass-man, two-cities]
        key_ideas:
          - "The intelligible field of study; twenty-one civilizations and their tokens of affiliation; against the unity of civilization"
          - "Race and environment refuted; challenge and response — hard countries, new ground, blows, pressures, penalizations; the golden mean"
          - "Arrested civilizations (Polynesians, Eskimos, Nomads, Osmanlis, Spartans); growth as etherialization; withdrawal and return; the creative minority and mimesis"
          - "Breakdown as failure of self-determination — the nemesis of creativity, militarism, idolisation of an institution; disintegration — dominant minority, internal and external proletariat, schism in the soul"
          - "Universal states and universal churches — the church as chrysalis; where Toynbee and Spengler disagree about the West"
        demo: null
        notes: "Objections: Spengler's (the organism vs the free response), the historians' (Geyl, Trevor-Roper in References — selected cases, laws from a sample of 21), and Huntington's use of Toynbee's list. Sparta from the Greek module's application returns as the arrested-civilization case (spiral)."

      - slug: huntington-clash-of-civilizations
        title: "Huntington's clash of civilizations"
        type: core
        status: planned
        goal: "Analyze Huntington's hypothesis that cultural fault lines will replace ideology as the source of conflict, and lay out the main objections to it"
        opening: "When the Cold War ended, the question was what would organise world conflict next. A Harvard political scientist proposed in 1993 that the answer was neither ideology nor economics but culture, and that the great divisions of the future would run along the borders of seven or eight civilizations. The lesson reconstructs the hypothesis as he stated it — descriptive, he insisted, not advocacy — and the objections that met it."
        est_minutes: 40
        prerequisites: [toynbee-challenge-and-response]
        concepts:
          introduces: [civilizational-fault-line, kin-country-syndrome, torn-country]
          reinforces: [challenge-and-response, culture-vs-civilization-spengler, friend-enemy-distinction, nation-as-project]
        key_ideas:
          - "What a civilization is for Huntington — the highest cultural grouping, objective elements plus self-identification; levels of identity; Toynbee's list reused"
          - "Six reasons civilizations will clash; the Velvet Curtain of culture; 'Islam has bloody borders'"
          - "The kin-country syndrome — the Gulf War, Bosnia, the Caucasus; torn countries (Turkey, Mexico, Russia)"
          - "The West versus the rest — the universal civilization as a Western idea; isolation, bandwagoning, balancing"
          - "Objections — the 'clash of ignorance' (Said), the state still fights states (realist critique), civilizations as too internally divided (Sen) — named as positions, developed as arguments"
        demo: null
        notes: "Who Are We? (2004) was NOT obtained by the reading swarm — its argument on the Anglo-Protestant core culture is deferred to the-nation-and-its-defenders with that caveat stated. Schmitt's friend–enemy is the backward Ref the hypothesis invites."

      - slug: what-measures-greatness
        title: "One civilization or many: what measures greatness and why civilizations decline"
        type: synthesis
        status: planned
        goal: "Compare Spengler's, Toynbee's and Huntington's answers to whether civilizations are one or many, what measures their greatness, and why they decline, and judge each against the module's cases"
        opening: "Three authors who agree that civilizations exist disagree about almost everything else: whether there is one human civilization or many, whether greatness is power, duration or the ideas others take up, and whether decline is a biological fate, a failed response, or a shift in who fights whom. The lesson sets the three theories side by side on the same historical cases and asks which questions each can answer."
        est_minutes: 40
        prerequisites: [huntington-clash-of-civilizations]
        concepts:
          introduces: [measures-of-greatness]
          reinforces: [culture-vs-civilization-spengler, challenge-and-response, civilizational-fault-line, contemporaneity, universal-state, caesarism]
        key_ideas:
          - "One or many — Toynbee's 'misconception of the unity of civilization' against the Enlightenment's single ladder; Ortega's Europe as common stock; Huntington's 'universal civilization is a Western idea'"
          - "Three measures of greatness — power (Huntington's 'the West versus the rest' — control of the international institutions and the use of force), duration (Spengler's thousand years), ideas others take up (Toynbee's etherialization, Ortega's rule by opinion)"
          - "Three accounts of decline — organism, failure of self-determination, cultural fault line — tested on Rome, Byzantium and the West"
          - "The hereditarian account of civilization (race as cause) as an argument with a history: who made it, what Toynbee and Spengler said against it, and what the module's cases show"
        demo: null
        notes: "Synthesis lesson; the hereditarian account is taught per the course brief as an argument with its history and objections (Toynbee IV refutes race explicitly; Spengler V(B) says 'race does not migrate, languages do'), never as settled. Deneen's 'failed because it succeeded' is the forward hook."

      - slug: testing-the-clash
        title: "Testing the clash: Huntington's hypothesis against the conflict record since 1993"
        type: core
        status: planned
        goal: "Evaluate Huntington's hypothesis against the published tests of conflict across civilizational lines since 1993 and against the Yugoslav wars, and state where the record supports, qualifies or refutes it"
        opening: "A hypothesis stated in 1993 about the pattern of future conflict can be checked thirty years later. Political scientists did check it, counting wars and disputes by whether the parties belonged to the same civilization or different ones, and the wars in Yugoslavia that Huntington cited as his first case ran their course. The lesson reproduces the simplest form of the test and reads the Bosnian case for the kin-country syndrome."
        est_minutes: 40
        prerequisites: [what-measures-greatness]
        concepts:
          introduces: []
          reinforces: [civilizational-fault-line, kin-country-syndrome, torn-country, measures-of-greatness]
        key_ideas:
          - "Turning the hypothesis into a count — how Huntington's own criteria classify a conflict as cross-civilizational"
          - "The published tests (dyadic conflict data 1950–2000s) and what they found — more conflict within civilizations than across, with Islam–West as the partial exception"
          - "Bosnia 1992–95 as the kin-country case — Germany and Croatia, Russia and Serbia, Iran and the Bosnian Muslims — and the counter-cases (Russia–Ukraine, Iraq–Kuwait)"
          - "Where the hypothesis departs from the record and where its defenders say the tests miss what it claimed"
        demo: null
        notes: "Module application (L16). The tests (Russett, Oneal & Cox 2000; Chiozza 2002; Henderson & Tucker 2001) are public papers not in the dossier — the brief names them for the writer to obtain; Huntington's 1993 criteria (dossier source 4) are what the lesson operationalises. Research-shaped: reproduce one count."

  # ---------------------------------------------------------------------
  - slug: postwar-conservatism
    title: "The postwar right answers liberal orthodoxy: Oakeshott, Strauss, Voegelin, Scruton"
    outcomes: [co-reconstruct, co-objection, co-questions, co-apply]
    lessons:
      - slug: what-conservatism-is
        title: "What conservatism is: disposition, doctrine or position"
        type: core
        status: planned
        goal: "Distinguish the rival definitions of conservatism — a disposition, a positional ideology, an epistemic argument, a reaction — and test each against the thinkers the course has read"
        opening: "The course has followed a tradition for twenty-three centuries without defining it. Is a conservative someone who defends whatever exists, someone who holds a particular doctrine about human nature, someone who distrusts abstract reason, or simply whoever stands against the revolution of the day? Each definition includes thinkers the others exclude. The lesson tries the definitions on Burke, Maistre, Hegel, Tocqueville and Carlyle and keeps what survives."
        est_minutes: 40
        prerequisites: [burke-reflections, maistre-and-bonald, hegel-ethical-life-and-the-state, tocqueville-tyranny-of-majority-and-soft-despotism, carlyle-heroes]
        concepts:
          introduces: [conservatism-as-disposition, positional-ideology, epistemic-conservatism, conservative-vs-reactionary]
          reinforces: [prejudice, entailed-inheritance, counter-revolution, no-such-thing-as-man]
        key_ideas:
          - "Broad vs narrow (post-1789) conservatism; the word's history — Chateaubriand's journal, Peel, the Quarterly Review"
          - "The epistemic argument — imperfect knowledge, particularist scepticism, prejudice as collected reason — and its self-application problem"
          - "Positional ideology (Huntington 1957) and Hirschman's three theses (perversity, futility, jeopardy); recurrent assumptions (imperfection, institutions, anti-contractualism, utility of religion)"
          - "Conservative vs reactionary vs radical conservative; the paradox of conservative justice (Sidgwick)"
          - "What the tradition defends in common and where it splits — property, religion, hierarchy, the nation"
        demo: null
        notes: "Sources: SEP 'Conservatism' (Hamilton), Muller's Introduction, Fawcett ch. 2, Lilla's Introduction on reaction. This is a concept lesson, not a survey of names: every definition is tested on thinkers the reader already knows."

      - slug: oakeshott-rationalism-in-politics
        title: "Oakeshott: rationalism in politics and the conservative disposition"
        type: core
        status: planned
        goal: "Analyze Oakeshott's distinction between technical and practical knowledge and his account of politics as the pursuit of intimations, and evaluate the conservative disposition it supports"
        opening: "A cookery book cannot teach anyone to cook; it is an abridgment of what people who already know how to cook do. Oakeshott says the same of political ideologies — the Rights of Man, the Communist Manifesto — and of the modern politician who thinks a felt need plus a plan is enough. The lesson follows the distinction between two kinds of knowledge and the view of politics and government it yields."
        est_minutes: 45
        prerequisites: [what-conservatism-is]
        concepts:
          introduces: [technical-vs-practical-knowledge, rationalism-in-politics, pursuit-of-intimations, government-as-umpire]
          reinforces: [conservatism-as-disposition, prejudice, epistemic-conservatism, rational-state]
        key_ideas:
          - "The Rationalist's character — enemy of authority, habit and tradition; politics as engineering; the politics of the felt need"
          - "Technical vs practical knowledge — cookery, the wheelwright, medicine; why technique never suffices and the illusion that it does"
          - "Ideology as the abridgment of a tradition — the Rights of Man as 'stepchild', Locke's treatise as a cribbed summary of English practice; the export of democracy"
          - "Politics as the pursuit of intimations in a tradition of behaviour; the sea without harbour; conversation, not argument"
          - "On Being Conservative — disposition not doctrine; government as umpire, not dream-imposer; conservative about government, radical elsewhere"
        demo: null
        notes: "Objections: Hayek's 'Why I am not a conservative' (References), the SEP's charge that practical knowledge cannot criticise itself, and Deneen's later charge that Oakeshott's state is already liberal. Scruton's debt (Preface, 1st ed.) is the forward Ref."

      - slug: strauss-natural-right-and-history
        title: "Strauss: natural right against historicism and the fact–value distinction"
        type: core
        status: planned
        goal: "Analyze Strauss's argument that historicism and value-free social science destroy the idea of natural right, and his account of the break between classic and modern natural right"
        opening: "If every idea of justice is the product of its time, then so is the idea that all ideas of justice are products of their time — and a society that believes nothing is right by nature has no answer to the cannibal except that it prefers not to. Strauss opens with this, and then traces how the West came to believe it: from Hobbes's fear of death through Locke's property to Rousseau's history and Burke's prescription. The lesson follows the diagnosis and the recovery it proposes."
        est_minutes: 45
        prerequisites: [oakeshott-rationalism-in-politics]
        concepts:
          introduces: [historicism, fact-value-distinction, classic-natural-right, modern-natural-right]
          reinforces: [natural-law, state-of-nature, labour-theory-of-property, entailed-inheritance, hero-worship]
        key_ideas:
          - "Why natural right matters — the cannibal, the tolerance paradox, 'retail sanity and wholesale madness'"
          - "Historicism's self-contradiction; the historical school; Nietzsche as radical historicism (Ref)"
          - "Weber — the fact–value distinction does not follow from is/ought; 'noble nihilism'; value judgments inescapable in sociology"
          - "Classic natural right — the discovery of nature, the best regime, the Socratic 'What is?'; Aristotle's mutable natural right and the Thomist addition"
          - "The modern break — Hobbes's fear of violent death, rights before duties; Locke's property as the concealed revolution; Rousseau as the first crisis; Burke's prescription as the path to Hegel"
        demo: null
        notes: "The whole course is this lesson's evidence: every claim about Hobbes, Locke, Rousseau and Burke is a Ref to the lessons that read them. Objections: the historicist reply (Lilla on Strauss and Heidegger), the esotericism charge, and the 'Straussian' politics in References only."

      - slug: voegelin-gnosticism
        title: "Voegelin: representation, Gnosticism and the nature of modernity"
        type: core
        status: planned
        goal: "Analyze Voegelin's thesis that modern mass movements re-divinize society by immanentizing the Christian end of history, and evaluate the diagnosis"
        opening: "A Soviet constitution guarantees free elections and the Soviet Union holds none that matter; a medieval monk divides history into three ages and six centuries later a German party names its state the Third Reich. Voegelin argues that these are instances of one thing: a society represents itself by symbols, and modern politics is built from Christian symbols stripped of their transcendence. The lesson rebuilds the argument from the tool the course already has — representation — to its verdict on modernity."
        est_minutes: 45
        prerequisites: [strauss-natural-right-and-history]
        concepts:
          introduces: [gnosticism-voegelin, immanentization, de-divinization]
          reinforces: [representation-existential, civil-theology, political-theology, two-cities, secularization-thesis]
        key_ideas:
          - "Political science as philosophy of history; against positivism and Weber's value-free science"
          - "Elemental vs existential vs transcendental representation (recall) — Fortescue's eruption, Lincoln's formula"
          - "De-divinization by Christianity and re-divinization by Gnosticism; Joachim's three ages → Third Reich, Third Rome, the Leader, the brotherhood of autonomous men"
          - "Immanentization of the eschaton — progressivism, utopianism, revolutionary activism; Hooker's Puritan and the 'koran' that forbids critique"
          - "Hobbes's counter-move and its cost; why England and America resisted; Voegelin's own 1974 recantation as the standing objection"
        demo: null
        notes: "constantine-and-representation introduced the vocabulary; this lesson only recalls it. Objections: Lilla's chapter (vagueness of 'gnosis'; the 1974 recantation), and Schmitt's political theology as the rival reading of the same secularisation."

      - slug: scruton-meaning-of-conservatism
        title: "Scruton's Meaning of Conservatism: authority before freedom"
        type: core
        status: planned
        goal: "Analyze Scruton's case that conservatism is about authority, allegiance and institutions rather than freedom, and his philosophical reply to contract and Rawlsian liberalism"
        opening: "A young philosopher who watched the Paris riots of 1968 from the wrong side writes a book saying that conservatism is not about freedom at all but about authority — the authority of family, custom, law and nation that a person does not choose and could not have contracted into. He then has to say why a reasonable person should accept authority he did not choose. The lesson follows the doctrine and the philosophical appendix that defends it against the liberal theory of justice."
        est_minutes: 45
        prerequisites: [voegelin-gnosticism]
        concepts:
          introduces: [allegiance, authority-before-freedom, autonomous-institution, first-person-vs-third-person-justification]
          reinforces: [conservatism-as-disposition, little-platoon, ethical-life, art-of-association, consent]
        key_ideas:
          - "Dogmatics, not philosophy; the reformer, not the radical, as the dangerous opponent; freedom is not the point"
          - "Authority and allegiance — the family as model; patriotism vs nationalism; the social contract critique; the state as a person"
          - "Constitution, law and property — rights vs privileges, the ascendancy of statute, property as home (oikos); why conservatism is not capitalism"
          - "Alienation read conservatively (Marx inverted); autonomous institutions, establishment, the stratified society"
          - "The Philosophical Appendix — desire-based vs autonomy-based liberalism, Rawls's 'distributed by whom?', first-person vs third-person justification and the onus of proof"
        demo: null
        notes: "Rawls has no primary source in the dossier; he enters here and in carens-open-borders as the liberal orthodoxy answered, reconstructed from Scruton's and Carens's statements of him with the caveat named. How to Be a Conservative is held for the nation module."

      - slug: udhr-read-against-the-right
        title: "The Universal Declaration of Human Rights read against the right"
        type: core
        status: planned
        goal: "Apply Burke's, Maistre's, Oakeshott's, Strauss's and Scruton's critiques of abstract rights to the text of the 1948 Declaration and judge which critique the document bears out and where the document answers it"
        opening: "In 1948 delegates from fifty-eight states agreed on thirty articles declaring what every human being is entitled to, while declining to say why. One of the drafters remarked that they agreed on the list on condition that no one asked them the reason. The lesson reads the Declaration article by article with the five critics of abstract rights the module has assembled, and asks what the document knows that they say it cannot."
        est_minutes: 40
        prerequisites: [scruton-meaning-of-conservatism]
        concepts:
          introduces: []
          reinforces: [no-such-thing-as-man, rationalism-in-politics, classic-natural-right, historicism, authority-before-freedom, natural-law]
        key_ideas:
          - "The Declaration as an artefact — drafting, the abstentions, the deliberate silence on foundations"
          - "Burke and Maistre — real rights vs metaphysical rights; 'no such thing as man'; the articles that presuppose a particular society (Art. 15 nationality, Art. 21 elections)"
          - "Oakeshott — the Declaration as abridgment of a tradition; what it leaves out that the practice contained"
          - "Strauss — natural right without nature: the rights are listed, the ground is not; Scruton — inflation from liberties to claims (Hohfeld), and the rights that require a state to exist"
          - "Where the document answers its critics — Article 29's duties and limits, and the 'social and international order' clause"
        demo: null
        notes: "Module application (L16). The UDHR text is public; the 'agreed on the list, not the why' remark is Maritain's (References). The lesson cashes out five theories on one real deployed document and names the departures."

  # ---------------------------------------------------------------------
  - slug: empire-and-guilt
    title: "Empire, conquest and inherited guilt: Vitoria to the reparations debate"
    outcomes: [co-reconstruct, co-objection, co-apply, co-contested]
    lessons:
      - slug: vitoria-right-to-the-americas
        title: "Vitoria on the right to the Americas: unjust and just titles"
        type: core
        status: planned
        goal: "Analyze Vitoria's examination of every title by which Spain might hold the Americas and his conclusion that only the right of travel, trade and preaching survives — and what that right licensed"
        opening: "Forty-seven years after Columbus, a Dominican professor at Salamanca lectures to the Spanish establishment on whether their king has any right to the lands and peoples his soldiers have taken. He rejects the emperor's claim, the Pope's donation, the right of discovery, the Indians' refusal of the faith and their sins against nature, one by one. Then he asks what right is left. The lesson follows the examination and its uncomfortable end."
        est_minutes: 45
        prerequisites: [aquinas-law-and-kingship, aristotle-political-animal-and-natural-slavery]
        concepts:
          introduces: [dominium, unjust-titles, ius-communicationis, law-of-war-vitoria]
          reinforces: [natural-slavery, natural-law, just-war, human-law-determination]
        key_ideas:
          - "Did the barbarians have true dominion — not natural slaves, not sinners, not madmen; property does not depend on grace"
          - "The seven unjust titles — emperor, pope, discovery, refusal of the faith, sins against nature, voluntary choice, divine gift — and why each fails"
          - "The just titles — natural partnership and communication (travel, trade, preaching), protection of converts, tyranny of native rulers, alliance — and the sequence from persuasion to war"
          - "The Law of War — the sole just cause is injury; what may be done in victory; war just on both sides through invincible ignorance"
          - "Las Casas and Sepúlveda; the natural-slavery title Vitoria leaves open at the end 'for the sake of argument'"
        demo: null
        notes: "Aristotle's natural slavery is the backward Ref the whole lecture argues with; Pagden's charge that the just titles licensed what the unjust titles forbade is the objection to carry. Prerequisites are knowledge prerequisites: Aquinas's natural law and Aristotle's natural slavery."

      - slug: locke-and-mill-on-empire
        title: "Locke's waste land and Mill's tutelage: the liberal justification of empire"
        type: core
        status: planned
        goal: "Analyze how Locke's theory of property and Mill's theory of progress each justified rule over peoples who had not consented, and evaluate the thesis that the exclusion follows from liberal premises rather than contradicting them"
        opening: "The same John Locke who said no one may be governed without consent said that America was waste land that labour could appropriate, and the same John Stuart Mill who said no society may silence one dissenter said that a despotism is a legitimate way of governing barbarians. Were these lapses, or do they follow from the theories? The lesson reads the passages and the strongest case that they follow."
        est_minutes: 45
        prerequisites: [vitoria-right-to-the-americas, mill-liberty-and-its-limits]
        concepts:
          introduces: [strategies-of-exclusion, civilizational-infantilism, tutelage]
          reinforces: [labour-theory-of-property, consent, harm-principle, civilized-community-clause, dominium]
        key_ideas:
          - "Locke ch. V — 'in the beginning all the World was America'; nature as worthless inheritance; why a people with no political society in Locke's sense has no territory"
          - "The anthropological minimum and the thick conditions of its exercise — Locke on children and education as the model of exclusion"
          - "James Mill's History of British India — inscrutability and the scale of civilization; Macaulay's Minute"
          - "J. S. Mill — the harm principle's 'civilized community' clause; Representative Government ch. XVIII: dependencies, 'a succession of absolute monarchs', why parliamentary responsibility fails for India"
          - "The 'strategies' thesis against the 'contradiction' thesis — and Stephen's gunpowder passage as the liberal who said it plainly"
        demo: null
        notes: "Mehta is the secondary spine; prefer the full read (source index 42) over the toc-only (1). Taught fairly: Mill's own reasons are given at full strength before the critique. Gandhi's ethical alternative (Mehta ch. 3) is a one-paragraph counterpoint."

      - slug: burke-against-hastings
        title: "Burke's impeachment of Warren Hastings: a conservative against empire"
        type: core
        status: planned
        goal: "Analyze Burke's case against Hastings — that arbitrary power cannot be held or given, and that an empire is a trust — and explain why the defender of inherited institutions became the prosecutor of British rule in Bengal"
        opening: "In February 1788 the House of Lords sits as a court to try the former Governor-General of Bengal, and the man who opens for the prosecution over four days is the same Edmund Burke who will defend the French monarchy two years later. He has to explain to English peers why the customs of Hindu and Muslim India deserve the protection of English law, and why 'the constitution of Asia is despotism' is no defence. The lesson follows the speech and asks how it fits the Reflections."
        est_minutes: 45
        prerequisites: [locke-and-mill-on-empire, burke-reflections]
        concepts:
          introduces: [empire-as-trust, geographical-morality]
          reinforces: [entailed-inheritance, natural-law, prejudice, strategies-of-exclusion, tutelage]
        key_ideas:
          - "Impeachment as 'the great circulation of responsibility'; a state in the disguise of a merchant; 'a commonwealth without a people'"
          - "Governing a people by their own principles — caste, custom, the praise of Hindu institutions; the six eras of Indian history"
          - "Hastings's defence quoted — despotism as the constitution of Asia — and the reply: 'law and arbitrary power are in eternal enmity'; Tamerlane's Institutes as proof that Asia had law"
          - "Bribery as system — the Munny Begum bribe, Debi Singh and Rungpore; why avarice is the basest form of arbitrary power"
          - "'I impeach him in the name of...'; the acquittal of 1795; the Reflections and the Hastings speech as one theory of inherited order (Mehta's reading)"
        demo: null
        notes: "The conservative against empire is the module's reversal seam: state the expectation (the defender of hierarchy should defend the conqueror), then the record. Objection: the Whig-imperial reading that Burke objected to the Company, not to empire. Short quotations; Burke is public domain."

      - slug: colonial-balance-sheet
        title: "The colonial balance sheet: the Case for Colonialism and its critics"
        type: core
        status: planned
        goal: "Evaluate the argument that colonialism was on balance beneficial and legitimate, the arguments against it, and the standards of evidence each side uses, as a contested claim with its history"
        opening: "In 2017 a political scientist published an article arguing that Western colonialism was, on an honest cost–benefit accounting, often beneficial and often locally legitimate, and that some form of it should return. Two petitions, fifteen board resignations and threats to the editor followed, and the article was withdrawn. The lesson reconstructs the argument as its author made it, the strongest replies, and what kind of evidence could settle the question."
        est_minutes: 45
        prerequisites: [burke-against-hastings]
        concepts:
          introduces: [cost-benefit-of-empire, subjective-legitimacy, counterfactual-development]
          reinforces: [empire-as-trust, tutelage, strategies-of-exclusion, geographical-morality]
        key_ideas:
          - "The three alleged failures of anti-colonial critique — no cost–benefit accounting, no test of subjective legitimacy, advocacy instead of scholarship"
          - "The counterfactual problem — compared to what (Ethiopia, Liberia, China); the Abernethy test; revealed preference (schools, hospitals, migration, collaborators)"
          - "The critics' replies — exploitation and underdevelopment (Rodney), violence (Amritsar, Herero, Mau Mau), the slave trade, divide and rule, the 'lazy citations' charge both ways"
          - "What the two sides agree on and what they measure differently — absolute levels vs comparative trends, railways against torture"
          - "The controversy as data — withdrawal, petitions, the 2022 Response — and what it shows about how such claims are adjudicated"
        demo: null
        notes: "Per the course brief: taught as an argument with its history and objections, never as settled. Both the article and the Response are in the dossier (source 7); the critics' pieces (Kendhammer, Klein, Khan, Taylor) are cited in the Response and named in the brief for the writer to obtain. Burke's Hastings speech is the backward Ref: an eighteenth-century conservative's cost–benefit."

      - slug: inherited-guilt-and-reparations
        title: "Inherited guilt and the supersession of historic injustice"
        type: core
        status: planned
        goal: "Analyze Waldron's argument that historic injustices can be superseded by changed circumstances and the opposed case for inherited guilt and reparation, and evaluate whether guilt can pass between generations"
        opening: "Land taken unjustly two centuries ago is now farmed by people who did nothing wrong, and the descendants of those it was taken from are still here. Must it be given back, must its value be paid, or has time changed what justice requires? Philosophers have argued all three, and the same question is asked about slavery, colonial rule and the Holocaust. The lesson follows the sharpest version of each answer."
        est_minutes: 45
        prerequisites: [colonial-balance-sheet]
        concepts:
          introduces: [rectification, supersession, hereditary-guilt]
          reinforces: [labour-theory-of-property, cost-benefit-of-empire, partnership-of-generations, dominium]
        key_ideas:
          - "Why judge the past at all — memory, identity, symbolic reparation"
          - "Nozickian rectification and the counterfactual method — the aunt's will, the trustee, the non-identity problem, the baseline problem"
          - "Continuing injustice vs the fading of rights — the stolen car, adverse possession; sacred land as the exception"
          - "Supersession — entitlements are circumstance-sensitive; the savanna water holes; a claim can lapse without ever having been wrong; the moral-hazard objection"
          - "Hereditary guilt — the 'tyranny of guilt' argument (Bruckner, Murray ch. 10) that guilt is mono-generational and selectively applied; Burke's partnership of generations as the counter-premise (if we inherit the glory, do we inherit the debt?)"
        demo: null
        notes: "Waldron is the analytic spine; the reparations case for slavery (Coates and others) is named in References as a position the writer should state fairly from the public record. Murray's ch. 10 and Scruton's forgiveness passage give the restrictionist frame; Miller ch. 7 (reparation and desert claims in admission) is the forward Ref."

      - slug: auditing-the-case-for-colonialism
        title: "Auditing the Case for Colonialism: three cited claims re-checked"
        type: core
        status: planned
        goal: "Apply the sourcing drill to three empirical claims in the Case for Colonialism and its critics — the slave-trade trust effect, colonial-era stature in Kenya, real wages in British Africa — by reading what the cited studies actually found"
        opening: "The article and its critics both cite peer-reviewed studies for their numbers: a 1–2 per cent share of variance here, a rise or fall in height or wages there. The studies exist and can be read. The lesson takes three of the claims, finds the cited paper, states what it measured, on what data, and whether the claim as made survives the comparison — the method of the module applied to its own material."
        est_minutes: 40
        prerequisites: [inherited-guilt-and-reparations]
        concepts:
          introduces: []
          reinforces: [cost-benefit-of-empire, counterfactual-development, subjective-legitimacy, supersession]
        key_ideas:
          - "The sourcing drill — author, date, data, what the study can and cannot establish — applied to a contested citation"
          - "Claim one — the slave trade and present-day trust (Nunn & Wantchekon): effect size, and what 'variance explained' does and does not mean"
          - "Claim two — stature in colonial Kenya (Moradi): comparative trends vs absolute levels, the standard both sides use selectively"
          - "Claim three — real wages in British Africa (Frankema & van Waijenburg): what the series shows and how both the article and the op-ed used it"
          - "What re-checking changes — which claims stand, which are overstated, and what remains a judgment the data cannot make"
        demo: null
        notes: "Module application (L16). The three papers are public (the brief gives full citations); Gilley's Response (source 7, 'Lazy Reflexive Citations') and the Kendhammer op-ed it dissects are the dossier anchors. Research-shaped by construction (E6d). Computation only inside source inquiry."

  # ---------------------------------------------------------------------
  - slug: nation-and-immigration
    title: "The nation, immigration and the survival of the West"
    outcomes: [co-reconstruct, co-objection, co-questions, co-apply, co-contested]
    lessons:
      - slug: the-nation-and-its-defenders
        title: "The nation and its defenders: Scruton, Miller and the pre-political loyalty"
        type: core
        status: planned
        goal: "Analyze the case that a nation is a pre-political loyalty to a place and a way of life, held in different forms by a conservative and a liberal nationalist, and distinguish it from nationalism"
        opening: "Before anyone can disagree about politics, they have to agree on who 'we' are — who gets to vote, whose law applies, whose children inherit. A conservative philosopher says this 'we' is a loyalty to a home that nobody chose; a liberal philosopher of the left says much the same about national identity and draws different conclusions. The lesson reconstructs the shared premise and the point where the two part."
        est_minutes: 45
        prerequisites: [scruton-meaning-of-conservatism, ortega-revolt-of-the-masses]
        concepts:
          introduces: [oikophilia, pre-political-loyalty, compatriot-partiality, associative-obligations]
          reinforces: [allegiance, nation-as-project, little-platoon, mores, civilizational-fault-line]
        key_ideas:
          - "Scruton — oikophilia, the territorial nation as the condition of opposition and of secular law; nation vs nationalism; 'to include is to exclude'"
          - "Miller — weak cosmopolitanism, compatriot partiality (the airport queue), associative obligations, the value of national identity for trust and the welfare state"
          - "Renan's daily plebiscite (via Ortega) and Huntington's Anglo-Protestant core culture — the latter from Who Are We?, not obtained, reported as stated by others"
          - "Where conservative and liberal nationalist agree (a bounded people, self-determination) and where they part (what the bond is made of; culture vs institutions)"
        demo: null
        notes: "Who Are We? (2004) was not read by the swarm — flag in text and References; the lesson leans on Scruton (How to Be a Conservative chs. 2–3, 7) and Miller ch. 2, 4. Prerequisites are knowledge prerequisites: Scruton's allegiance and Ortega's nation-as-project."

      - slug: carens-open-borders
        title: "Carens: the case for open borders"
        type: core
        status: planned
        goal: "Analyze the argument that borders should generally be open from three liberal starting points, and the communitarian reply it answers"
        opening: "Borders have guards, and the guards have guns. A Mexican farm worker who crosses one is arrested; a Canadian philosopher asks by what right. He argues that whether you start from property rights, from a hypothetical contract among equals, or from the greatest good, you reach the same place — that citizenship in a rich country is the modern equivalent of feudal privilege. The lesson reconstructs all three routes and the strongest reply."
        est_minutes: 40
        prerequisites: [the-nation-and-its-defenders]
        concepts:
          introduces: [open-borders, global-original-position, citizenship-as-feudal-privilege]
          reinforces: [labour-theory-of-property, consent, harm-principle, compatriot-partiality]
        key_ideas:
          - "The Nozickian route — property rights protect the migrant and the employer, not 'our country'"
          - "The Rawlsian route — a global original position; free movement as a basic liberty; the public-order restriction and why it is narrow"
          - "The utilitarian route — aliens in the calculus"
          - "Walzer's communitarian challenge — neighbourhoods, clubs, families; Carens's replies and the paradox of liberal culture"
          - "What the argument concedes — nonideal theory, national security, the size of the demand — and what it refuses to concede"
        demo: null
        notes: "Taught at full strength as the liberal position. Rawls enters reconstructed from Carens with the caveat that no Rawls primary text is in the dossier. Miller's and Scruton's replies are the next lessons, not this one."

      - slug: miller-strangers-in-our-midst
        title: "Miller: the liberal-nationalist case for controlled borders"
        type: core
        status: planned
        goal: "Analyze Miller's argument that states may control membership on grounds of self-determination while owing refugees and migrants specific duties, and evaluate it against both open borders and restriction"
        opening: "Suppose everything Carens says about the moral equality of persons is true. Does it follow that a state may not choose who joins it? A philosopher who accepts the premise argues it does not: a people has an interest in deciding its own future, its public culture and the size of its demos, and that interest grounds a right to control admission — within limits set by what is owed to refugees and to those already inside. The lesson follows the argument to its policy shape."
        est_minutes: 45
        prerequisites: [carens-open-borders]
        concepts:
          introduces: [self-determination-over-membership, refugee-vs-economic-migrant, integration-civic-social-cultural]
          reinforces: [open-borders, compatriot-partiality, associative-obligations, oikophilia, mores]
        key_ideas:
          - "Why sovereignty is too quick — territorial jurisdiction and its three conditions; the park warden"
          - "Self-determination — public expenditure, the composition of the demos, trust and diversity; the private/public culture distinction"
          - "Refugees — the duty of rescue, who counts, how responsibility is acquired, burden-sharing; economic migrants — mutual advantage, fair terms, selection and its limits (no race or religion)"
          - "The rights of immigrants — time, membership, amnesty; integration contracts and citizenship tests; cultural integration and its limits"
          - "'Hard on the outside, soft on the inside' and the 2015 postscript — where the framework strains"
        demo: null
        notes: "Abizadeh's coercion objection and Carens's cantilever are the objections Miller answers; Murray's charge (next lesson) that this framework describes a state that no longer exists is the one he does not."

      - slug: murray-strange-death-of-europe
        title: "Murray's Strange Death of Europe: the restrictionist case"
        type: core
        status: planned
        goal: "Analyze the restrictionist argument that mass immigration combined with a loss of faith in Europe's own beliefs is changing Europe into something else, and evaluate its evidence and its objections"
        opening: "Two things happened to Europe at once, a British journalist argues: more people arrived in a shorter time than ever before, and the continent receiving them had stopped believing in its own story. Either alone might have been absorbed; together they cannot be. The lesson reconstructs the argument from the census figures and guest-worker schemes to the border crisis and the 'tyranny of guilt', and puts to it the replies from economics, demography and liberal theory."
        est_minutes: 45
        prerequisites: [miller-strangers-in-our-midst]
        concepts:
          introduces: [two-concatenations, bockenforde-dilemma, replacement-as-argument]
          reinforces: [refugee-vs-economic-migrant, hereditary-guilt, integration-civic-social-cultural, mass-man, oikophilia]
        key_ideas:
          - "The two concatenations; the Ship of Theseus; what the 2001–2011 census change showed and how it was discussed"
          - "How Europe got 'hooked' — guest workers, 1997, the 'nation of immigrants' claim, the economic case and its arithmetic, 'nothing can be done'"
          - "Lampedusa to Lesbos — pull factors, the Dublin rules, 2015 — and the integration record from Rushdie to Cologne"
          - "The tyranny of guilt; the Böckenförde dilemma — can a secular state live on presuppositions it cannot guarantee; 'tiredness' and the East"
          - "The 'Great Replacement' as an argument with a history (Raspail, the 1985 Figaro cover, Camus) and the demographic projections (ONS, Pew, Kaufmann) read for what they do and do not show"
        demo: null
        notes: "Per the course brief, replacement is taught as an argument with its history and objections, never as established — the demographic projections are quoted with their assumptions. Objections: Miller's framework, the economists' studies Murray himself cites, Kaufmann's mixed-population projections. Short quotations only (in copyright)."

      - slug: deneen-post-liberalism
        title: "Deneen's Why Liberalism Failed: the post-liberal critique"
        type: core
        status: planned
        goal: "Analyze Deneen's thesis that liberalism failed because it succeeded, and evaluate his answer to whether the West can survive on liberal principles alone"
        opening: "Liberalism promised freedom from arbitrary power, and delivered the largest states and most pervasive markets in history; it promised self-government, and delivered citizens who cannot name their representatives. A Notre Dame professor argues this is not betrayal but fulfilment: the theory's two premises — that we are free by nature and that nature is there to be mastered — produce exactly this. The lesson reconstructs the diagnosis and asks what he proposes instead."
        est_minutes: 45
        prerequisites: [murray-strange-death-of-europe]
        concepts:
          introduces: [liberal-anthropology, anticulture, liberalocracy, post-liberalism]
          reinforces: [state-of-nature, consent, harm-principle, soft-despotism, ethical-life, bockenforde-dilemma]
        key_ideas:
          - "Liberty before liberalism — self-rule and paideia; the three modern revolutions (Machiavelli, Hobbes/Descartes, Bacon); liberal voluntarism and the war against nature"
          - "State and market as a pincer; left and right as two liberalisms; Polanyi's 'laissez-faire was planned'"
          - "Anticulture — the destruction of nature, time and place; the cowbird; Tocqueville on the fractured chain of generations"
          - "Liberalocracy — the new aristocracy of the credentialed; Federalist 10 as political technology; the degradation of citizenship"
          - "After liberalism — no return, the end of ideology, practice before theory, the Benedict Option; objections (liberalism's achievements Deneen concedes; Fawcett's 'the right must accept the rules'; Scruton's 'truth in liberalism')"
        demo: null
        notes: "This is the course's post-liberal position taught at full strength, then met: the liberal reply (Fawcett), the conservative reply (Scruton, Oakeshott — a disposition does not need a theory), and Strauss's warning about historicist diagnoses. Backward Refs through the whole course (Hobbes, Locke, Mill, Tocqueville)."

      - slug: the-2015-crisis-read-three-ways
        title: "The 2015 migration crisis read against Carens, Miller and Murray"
        type: core
        status: planned
        goal: "Apply the three theories of membership to the recorded facts of the 2015 European migration crisis and judge what each would have prescribed, what each predicted, and where the event escapes all three"
        opening: "In 2015 about 1.3 million people applied for asylum in the European Union, most arriving by sea through Greece and Italy; Germany suspended the rule that sent them back to the first country they entered, Hungary built a fence, and a deal with Turkey closed the main route the next spring. Three theories in this module say what should have been done. The lesson sets them against what was done and what followed."
        est_minutes: 40
        prerequisites: [deneen-post-liberalism]
        concepts:
          introduces: []
          reinforces: [open-borders, self-determination-over-membership, refugee-vs-economic-migrant, two-concatenations, integration-civic-social-cultural, friend-enemy-distinction]
        key_ideas:
          - "The record — numbers, routes, decisions (25 and 31 August 2015, the fences, the March 2016 deal) and the aftermath (Cologne, the deportation gap, the 2017 elections)"
          - "Carens applied — what open borders would have required and the public-order restriction as the only brake"
          - "Miller applied — refugees vs economic migrants in a mixed flow, burden-sharing, the strain he admits in the postscript"
          - "Murray applied — the pull-factor claim, the Dublin collapse, the guilt frame; what his account predicts and what it omits"
          - "Where the event departs from all three — a decision made in a week by one government, enforcement that did not follow law, and a crisis ended by a treaty none of the theories contemplates"
        demo: null
        notes: "Module application (L16). Facts from Miller's Postscript (source 45) and Murray chs. 4–5, 11, 17 (source 50), cross-checked against Eurostat (the brief names the tables). Sourcing drill on two first-person testimonies (Murray's Lesbos interviews)."

      - slug: the-argument-assembled
        title: "The argument assembled: who should rule, is equality natural, what holds a civilization together"
        type: synthesis
        status: planned
        goal: "Explain how each tradition the course has read answers its three questions — who should rule, whether equality is natural, what holds a people together and why it fails — and judge which answers survived their objections"
        opening: "Twenty-four centuries of answers to three questions have gone past. The lesson lays them out as the chain of moves it was — each thinker answering the one before — and asks which answers were refuted, which were abandoned without refutation, and which are still standing in the arguments of 2015. It ends where the course's own problems remain open."
        est_minutes: 40
        prerequisites: [the-2015-crisis-read-three-ways]
        concepts:
          introduces: []
          reinforces: [philosopher-king, natural-slavery, mixed-constitution, two-cities, sovereignty, consent, entailed-inheritance, equality-of-conditions, friend-enemy-distinction, challenge-and-response, classic-natural-right, oikophilia, post-liberalism]
        key_ideas:
          - "Who should rule — knowledge (Plato), nature and the middle (Aristotle), the mixed people (Cicero), the sovereign (Bodin, Hobbes), consent (Locke), the general will (Rousseau), inheritance (Burke), the decider (Schmitt), the disposition (Oakeshott)"
          - "Is equality natural — Aristotle's ladder and its difficulty, Augustine's slavery by sin, Hobbes's equality of ability, Rousseau's artificial inequality, Tocqueville's providential fact, Carlyle's and Ortega's refusals, Strauss's return to nature"
          - "What holds a people together and why it fails — a shared god (Augustine, Maistre), a shared way of life (Burke, Scruton, Miller), a shared enemy (Schmitt), a shared future (Ortega, Renan), a contract (Locke, Rawls, Carens); decline as organism, failed response, exhaustion"
          - "The three thematic halts revisited — Christianity's Greek remaking, the West's judgment of its conquests, civilizations one or many"
          - "What stays open — the Böckenförde question, and the reader's own position stated against the strongest objection to it"
        demo: null
        notes: "Synthesis (type: synthesis); no new material. Every claim is a Ref to the lesson that established it. Per the tone: no verdict handed down — the last exercise asks the reader to state their own position and its strongest objection."

  - slug: conservative-revolution
    title: "Myth, war and the Conservative Revolution: Sorel to 1933"
    outcomes: [co-reconstruct, co-objection, co-questions, co-apply]
    lessons:
      - slug: sorel-reflections-on-violence
        title: "Sorel's Reflections on Violence: the myth of the general strike"
        type: core
        status: planned
        goal: "Analyze Sorel's argument that a class is held together by a myth rather than a programme and that violence restores the energy a decadent bourgeois order lacks, and evaluate why both the far left and the far right claimed him"
        opening: "By 1906 French socialists sat in parliament, negotiated with ministers and won reforms, and a retired engineer who admired Marx thought this was the end of socialism, not its success. A movement that bargains, he argued, has already accepted its enemy's world; what moves masses is not a programme they can check but an image of a decisive battle they can believe in. He called it a myth. The lesson follows the argument, and asks why its readers were found on both extremes."
        est_minutes: 40
        prerequisites: [michels-and-pareto-oligarchy-and-elites, marx-manifesto]
        concepts:
          introduces: [political-myth, proletarian-violence]
          reinforces: [circulation-of-elites, class-struggle, crowd-psychology]
        key_ideas:
          - "Against parliamentary socialism and the 'social peace' of the bourgeoisie; decadence as the loss of class energy"
          - "Myth versus utopia — the general strike as an image that cannot be refuted because it is not a prediction"
          - "Proletarian violence versus bourgeois force; the warrior ethic and the morality of producers"
          - "Sorel's readers: Mussolini's claimed debt, Sorel's own Plea for Lenin, Action française and the Cercle Proudhon"
          - "The objection: an ethic of violence with no account of its limits"
        demo: null
        notes: "Summary index 107 (Hulme tr.). Placed at the head of the Conservative Revolution module as the bridge from left to right: myth and the cult of energy are what Jünger, Moeller and Evola inherit."

      - slug: junger-storm-of-steel-and-the-worker
        title: "Jünger: the storm of steel and the figure of the Worker"
        type: core
        status: planned
        goal: "Analyze how Jünger turned the experience of the Western Front into a political anthropology — the front as a school, total mobilization, the Worker as the new ruling type — and evaluate what it asks of the individual"
        opening: "Between 1914 and 1918 a German infantry officer is wounded fourteen times and keeps a diary of everything he sees. He publishes it in 1920 without pity and without protest: the war as an ordeal in which a new kind of man was made. Twelve years later he claims that the same machines that made the trenches are making a new society, in which everyone is a worker and the old bourgeois freedom has no place. The lesson follows the path from the memoir to the theory."
        est_minutes: 45
        prerequisites: [sorel-reflections-on-violence, spengler-decline-of-the-west]
        concepts:
          introduces: [front-experience, total-mobilization, gestalt-of-the-worker]
          reinforces: [kultur-vs-zivilisation, political-myth, caesarism]
        key_ideas:
          - "Storm of Steel (1920): the material battle, the courage of the storm troop, the absence of hatred for the enemy; what the diary records and what it omits"
          - "From experience to doctrine: the front generation and the rejection of 1918's republic"
          - "Total mobilization (1930) — the war as a labour process of whole nations"
          - "Der Arbeiter (1932): the Worker as a Gestalt, not a class; the end of the bourgeois individual; technology as the Worker's mobilization of the world"
          - "Jünger's distance from the Nazis (On the Marble Cliffs, 1939) and the charge that his work had prepared the ground anyway"
        demo: null
        notes: "Summary indices 79 (Storm of Steel, Hofmann tr. — in copyright: short quotations) and 111 (Der Arbeiter, German; translate quotations). Forward: the-right-in-1933 and the-right-after-1945."

      - slug: moeller-van-den-bruck-third-reich
        title: "Moeller van den Bruck's Third Reich: the conservative revolution"
        type: core
        status: planned
        goal: "Analyze Moeller van den Bruck's argument for a conservative revolution against liberalism, his distinction between conservative and reactionary, and the idea of a Third Reich, and evaluate what became of it"
        opening: "In 1922 the German republic is four years old, paying reparations, and governed by parties that most of the right regard as the agents of defeat. A cultural critic who had translated Dostoevsky argues that the right cannot win by restoring the Kaiser: the old order lost, and only a revolution can produce something worth conserving. He gives the new order an old name — a third empire — and writes a book on why liberalism is the death of nations. The lesson reconstructs the argument and follows the name."
        est_minutes: 40
        prerequisites: [junger-storm-of-steel-and-the-worker]
        concepts:
          introduces: [conservative-revolution, third-reich-idea]
          reinforces: [kultur-vs-zivilisation, culture-vs-civilization-spengler, political-myth]
        key_ideas:
          - "'A war may be lost; a revolution must be won' — 1918 as a revolution that failed to become national"
          - "Liberalism as 'the principle of no principle' and the death of nations; Germany as a young, 'proletarian' nation"
          - "Socialism inverted — political laws before economic; German socialism versus Marx"
          - "Conservative versus reactionary: 'we live to bequeath'; to conserve is to create what is worth conserving"
          - "The Third Reich as a philosophical idea — and its appropriation after Moeller's suicide in 1925"
        demo: null
        notes: "Summary index 56 (1934 Allen & Unwin tr.). The Nazi appropriation of the title is reported as fact with its record (Moeller's 1922 meeting with Hitler and his contempt for him rest on Stern, The Politics of Cultural Despair (1961), Part III — not in the dossier)."

      - slug: evola-revolt-against-the-modern-world
        title: "Evola's Revolt against the Modern World: tradition and the dark age"
        type: core
        status: planned
        goal: "Analyze Evola's traditionalist case that the modern world is the last stage of a regression from a sacred hierarchical order, and evaluate the method that supports it"
        opening: "Most critics of modernity in the 1920s wanted to save something from the nineteenth century — the nation, the Church, property, the monarchy. An Italian former Dadaist painter wants none of it: in his view the whole of recorded history since the sacred kingships of the ancient world has been a fall, and the nation, the Church and the bourgeoisie are stages of the same decline. The lesson asks what standard could condemn all of history at once, and reconstructs the one he offers."
        est_minutes: 40
        prerequisites: [moeller-van-den-bruck-third-reich]
        concepts:
          introduces: [primordial-tradition, regression-of-castes]
          reinforces: [culture-vs-civilization-spengler, hero-worship, three-classes]
        key_ideas:
          - "The world of Tradition: the sacred king, rite, the 'two paths' of action and contemplation; the castes as degrees of being"
          - "The regression of the castes — priest-kings, warriors, merchants, serfs — as the key to history; modernity as the rule of the last"
          - "The doctrine of the four ages; the Kali Yuga; Rome against the 'southern' civilizations"
          - "Method: myth read as history, the refusal of evidence as a modern prejudice"
          - "Evola and Fascism — collaboration, criticism from the right, the 1951 trial — and his postwar readers"
        demo: null
        notes: "Summary index 69 (Stucco tr., in copyright: short quotations). Evola is the bridge to de Benoist and the European New Right (post-liberal module). Taught as an argument; its method is evaluated, not mocked."

      - slug: the-right-in-1933
        title: "1933: Schmitt, Heidegger and Spengler choose"
        type: core
        status: planned
        goal: "Apply the Conservative Revolution's concepts to what three of its leading thinkers did when the Nazis took power — Schmitt's and Heidegger's adherence, Spengler's refusal — and judge what in their earlier work disposed or failed to dispose each to that choice"
        opening: "In the spring of 1933 a jurist who had defined the political as friend and enemy and a philosopher who had become rector of Freiburg both joined the Nazi party. A historian whose book had made the decline of the West a household phrase met Hitler, refused the offer of a role, and in August published a book whose circulation the regime soon choked off. All three had been read as prophets of the movement now in power. The lesson reads their documents of 1933–34 against everything the module has built and asks what made the difference."
        est_minutes: 45
        prerequisites: [evola-revolt-against-the-modern-world, article-48-weimar]
        concepts:
          introduces: []
          reinforces: [friend-enemy-distinction, state-of-exception, conservative-revolution, third-reich-idea, caesarism, gestalt-of-the-worker]
        key_ideas:
          - "The record of 1933–34 — the Enabling Act, Schmitt's 'The Führer protects the law' (1934), Heidegger's Rectoral Address, Spengler's Hour of Decision and its suppression"
          - "Schmitt: what in the decisionism and the friend–enemy criterion made adherence easy, and his 1936 fall"
          - "Heidegger: the rectorate, the Black Notebooks, the postwar silence"
          - "Spengler's refusal — biological racism rejected, Caesarism without the party — and its limits"
          - "Where the documents depart from the theories: careerism, fear and chance alongside doctrine"
        demo: null
        notes: "Module application (L16). Lilla (index 10: The Shipwrecked Mind only — The Reckless Mind is not staged) gives the frame; Strong's foreword and Schwab's introduction to Schmitt (index 34) the jurist's record; Spengler's Hour of Decision is not in the dossier — the brief names where to obtain it and what the dossier's Spengler summary says. The human asked that the difficulties right-wing thinkers faced be taught: state them as the thinkers' own problems."

  # ---------------------------------------------------------------------
  - slug: postwar-conservatism
    title: "After the catastrophe: the right rebuilds, 1945–1964"
    outcomes: [co-reconstruct, co-objection, co-questions, co-apply]
    lessons:
      - slug: the-right-after-1945
        title: "The right after 1945: what fascism did to the conservative tradition"
        type: core
        status: planned
        goal: "Explain how fascism's defeat discredited the European right for half a century, what its thinkers kept, renamed or abandoned, and evaluate whether the tradition could be separated from what had used it"
        opening: "In 1945 almost every word the European right had used for a century — nation, people, hierarchy, authority, community, blood, soil — had been used by regimes that had just been defeated and whose camps were being opened. A conservative who still believed in some of those things had to say which, and why they were not what Hitler and Mussolini meant. The lesson follows how the right's thinkers met that problem and what it cost them."
        est_minutes: 45
        prerequisites: [the-right-in-1933]
        concepts:
          introduces: [anti-fascist-consensus, aristocratic-radicalism]
          reinforces: [conservative-revolution, counter-revolution, natural-aristocracy]
        key_ideas:
          - "The postwar settlement — denazification, the Christian Democratic parties, the European founders — and what it allowed the right to say"
          - "Three exits: Christian democracy, liberal conservatism (Hayek, Oakeshott), and emigration into philosophy (Strauss, Voegelin)"
          - "The fate of the Conservative Revolution's authors — Jünger, Schmitt, Heidegger, Evola — and the 1950 renaming of the movement"
          - "The Nietzsche question: what the right kept from the critique of equality and what it had to give up (Ref the Nietzsche course)"
          - "The charge of continuity — the 'origins of fascism' readings of Maistre and Burke — and the replies"
        demo: null
        notes: "Absorbs the reception material of the dropped extra nietzsche-on-the-right (Mann's, Spengler's, Ortega's, Strauss's borrowings; Ref nietzsche/nietzsche-and-politics and nietzsche/the-nazi-appropriation). Sources: Fawcett (index 40), Muller (48), Lilla (10), Berlin's Maistre essay (38) and volume (46); Kirk's own framing (84)."

      - slug: jouvenel-on-power
        title: "Jouvenel's On Power: the minotaur and the growth of the state"
        type: core
        status: planned
        goal: "Analyze Jouvenel's natural history of Power — its growth through war, its alliance with the common man against the aristocracy, and democracy as the regime of its greatest extent — and evaluate it as an account of the modern state"
        opening: "A medieval king could not conscript his subjects, tax them without their consent or tell them what to believe; in 1940 democratic governments did all three to every adult. A French political writer, writing in Switzerland at the end of the war, asks how the state that began as a king's household came to command more than any king ever did — and why the regimes that claimed to give power to the people were the ones under which it grew fastest. The lesson follows his answer."
        est_minutes: 45
        prerequisites: [the-right-after-1945, tocqueville-tyranny-of-majority-and-soft-despotism]
        concepts:
          introduces: [growth-of-power, alliance-of-power-and-the-common-man]
          reinforces: [sovereignty, soft-despotism, general-will, ruling-class]
        key_ideas:
          - "The minotaur: total war as the product of the controls Power has acquired; the extent of Power as a ratio"
          - "The mystery of obedience; theories of sovereignty, divine and popular, as one trunk"
          - "Power's expansion: egoism turned into the common good; the state's war on the aristocracies that limited it, allied with the common man"
          - "Democracy as Power masked by the general will — everyone a potential minister"
          - "Jouvenel's remedies and his later liberalism; the objection that the welfare he names as 'Power' was demanded by the people it served"
        demo: null
        notes: "Summary index 66 (Beacon 1962 ed., Huntington tr.; in copyright: short quotations). Tocqueville's soft despotism is the backward anchor."

      - slug: what-conservatism-is
        title: "What conservatism is: disposition, doctrine or position"
        type: core
        status: planned
        goal: "Distinguish the rival definitions of conservatism — a disposition, a positional ideology, an epistemic argument, a reaction — and test each against the thinkers the course has read"
        opening: "The course has followed a tradition for twenty-three centuries without defining it. Is a conservative someone who defends whatever exists, someone who holds a particular doctrine about human nature, someone who distrusts abstract reason, or simply whoever stands against the revolution of the day? Each definition includes thinkers the others exclude. The lesson tries the definitions on Burke, Maistre, Hegel, Tocqueville and Carlyle and keeps what survives."
        est_minutes: 40
        prerequisites: [the-right-after-1945, burke-reflections, maistre-and-bonald, hegel-ethical-life-and-the-state, tocqueville-tyranny-of-majority-and-soft-despotism, carlyle-heroes]
        concepts:
          introduces: [conservatism-as-disposition, positional-ideology, epistemic-conservatism, conservative-vs-reactionary]
          reinforces: [prejudice, entailed-inheritance, counter-revolution, no-such-thing-as-man]
        key_ideas:
          - "Broad vs narrow (post-1789) conservatism; the word's history — Chateaubriand's journal, Peel, the Quarterly Review"
          - "The epistemic argument — imperfect knowledge, particularist scepticism, prejudice as collected reason — and its self-application problem"
          - "Positional ideology (Huntington 1957) and Hirschman's three theses (perversity, futility, jeopardy); recurrent assumptions (imperfection, institutions, anti-contractualism, utility of religion)"
          - "Conservative vs reactionary vs radical conservative; the paradox of conservative justice (Sidgwick)"
          - "What the tradition defends in common and where it splits — property, religion, hierarchy, the nation"
        demo: null
        notes: "Sources: SEP 'Conservatism' (Hamilton), Muller's Introduction, Fawcett ch. 2, Lilla's Introduction on reaction. This is a concept lesson, not a survey of names: every definition is tested on thinkers the reader already knows."

      - slug: oakeshott-rationalism-in-politics
        title: "Oakeshott: rationalism in politics and the conservative disposition"
        type: core
        status: planned
        goal: "Analyze Oakeshott's distinction between technical and practical knowledge and his account of politics as the pursuit of intimations, and evaluate the conservative disposition it supports"
        opening: "A cookery book cannot teach anyone to cook; it is an abridgment of what people who already know how to cook do. Oakeshott says the same of political ideologies — the Rights of Man, the Communist Manifesto — and of the modern politician who thinks a felt need plus a plan is enough. The lesson follows the distinction between two kinds of knowledge and the view of politics and government it yields."
        est_minutes: 45
        prerequisites: [what-conservatism-is]
        concepts:
          introduces: [technical-vs-practical-knowledge, rationalism-in-politics, pursuit-of-intimations, government-as-umpire]
          reinforces: [conservatism-as-disposition, prejudice, epistemic-conservatism, rational-state]
        key_ideas:
          - "The Rationalist's character — enemy of authority, habit and tradition; politics as engineering; the politics of the felt need"
          - "Technical vs practical knowledge — cookery, the wheelwright, medicine; why technique never suffices and the illusion that it does"
          - "Ideology as the abridgment of a tradition — the Rights of Man as 'stepchild', Locke's treatise as a cribbed summary of English practice; the export of democracy"
          - "Politics as the pursuit of intimations in a tradition of behaviour; the sea without harbour; conversation, not argument"
          - "On Being Conservative — disposition not doctrine; government as umpire, not dream-imposer; conservative about government, radical elsewhere"
        demo: null
        notes: "Objections: Hayek's 'Why I am not a conservative' (References), the SEP's charge that practical knowledge cannot criticise itself, and Deneen's later charge that Oakeshott's state is already liberal. Scruton's debt (Preface, 1st ed.) is the forward Ref."

      - slug: strauss-natural-right-and-history
        title: "Strauss: natural right against historicism and the fact–value distinction"
        type: core
        status: planned
        goal: "Analyze Strauss's argument that historicism and value-free social science destroy the idea of natural right, and his account of the break between classic and modern natural right"
        opening: "If every idea of justice is the product of its time, then so is the idea that all ideas of justice are products of their time — and a society that believes nothing is right by nature has no answer to the cannibal except that it prefers not to. Strauss opens with this, and then traces how the West came to believe it: from Hobbes's fear of death through Locke's property to Rousseau's history and Burke's prescription. The lesson follows the diagnosis and the recovery it proposes."
        est_minutes: 45
        prerequisites: [oakeshott-rationalism-in-politics]
        concepts:
          introduces: [historicism, fact-value-distinction, classic-natural-right, modern-natural-right]
          reinforces: [natural-law, state-of-nature, labour-theory-of-property, entailed-inheritance, hero-worship]
        key_ideas:
          - "Why natural right matters — the cannibal, the tolerance paradox, 'retail sanity and wholesale madness'"
          - "Historicism's self-contradiction; the historical school; Nietzsche as radical historicism (Ref)"
          - "Weber — the fact–value distinction does not follow from is/ought; 'noble nihilism'; value judgments inescapable in sociology"
          - "Classic natural right — the discovery of nature, the best regime, the Socratic 'What is?'; Aristotle's mutable natural right and the Thomist addition"
          - "The modern break — Hobbes's fear of violent death, rights before duties; Locke's property as the concealed revolution; Rousseau as the first crisis; Burke's prescription as the path to Hegel"
        demo: null
        notes: "The whole course is this lesson's evidence: every claim about Hobbes, Locke, Rousseau and Burke is a Ref to the lessons that read them. Objections: the historicist reply (Lilla on Strauss and Heidegger), the esotericism charge, and the 'Straussian' politics in References only."

      - slug: voegelin-gnosticism
        title: "Voegelin: representation, Gnosticism and the nature of modernity"
        type: core
        status: planned
        goal: "Analyze Voegelin's thesis that modern mass movements re-divinize society by immanentizing the Christian end of history, and evaluate the diagnosis"
        opening: "A Soviet constitution guarantees free elections and the Soviet Union holds none that matter; a medieval monk divides history into three ages and six centuries later a German party names its state the Third Reich. Voegelin argues that these are instances of one thing: a society represents itself by symbols, and modern politics is built from Christian symbols stripped of their transcendence. The lesson rebuilds the argument from the tool the course already has — representation — to its verdict on modernity."
        est_minutes: 45
        prerequisites: [strauss-natural-right-and-history]
        concepts:
          introduces: [gnosticism-voegelin, immanentization, de-divinization]
          reinforces: [representation-existential, civil-theology, political-theology, two-cities, secularization-thesis]
        key_ideas:
          - "Political science as philosophy of history; against positivism and Weber's value-free science"
          - "Elemental vs existential vs transcendental representation (recall) — Fortescue's eruption, Lincoln's formula"
          - "De-divinization by Christianity and re-divinization by Gnosticism; Joachim's three ages → Third Reich, Third Rome, the Leader, the brotherhood of autonomous men"
          - "Immanentization of the eschaton — progressivism, utopianism, revolutionary activism; Hooker's Puritan and the 'koran' that forbids critique"
          - "Hobbes's counter-move and its cost; why England and America resisted; Voegelin's own 1974 recantation as the standing objection"
        demo: null
        notes: "constantine-and-representation introduced the vocabulary; this lesson only recalls it. Objections: Lilla's chapter (vagueness of 'gnosis'; the 1974 recantation), and Schmitt's political theology as the rival reading of the same secularisation."

      - slug: kirk-and-nisbet-american-conservatism
        title: "Kirk and Nisbet: the conservative mind and the quest for community in America"
        type: core
        status: planned
        goal: "Analyze how Kirk's canons of conservative thought and Nisbet's account of the lost intermediate associations founded postwar American conservatism, and evaluate the movement's founding tension between tradition and the free market"
        opening: "In 1953 the United States had won a world war, was the richest nation in history and had no conservative intellectual tradition anyone in its universities took seriously. Two young scholars publish that year a genealogy of conservative thought from Burke to Santayana and a sociology of why modern men feel alone among millions. The lesson reads the two books as the founding of a movement and asks what kind of conservatism a country founded by a revolution could have."
        est_minutes: 45
        prerequisites: [voegelin-gnosticism, tocqueville-equality-and-the-township]
        concepts:
          introduces: [canons-of-conservatism, quest-for-community, intermediate-associations]
          reinforces: [little-platoon, art-of-association, prejudice, conservatism-as-disposition, growth-of-power]
        key_ideas:
          - "Kirk's six canons — transcendent order, the variety of life, orders and classes, property and freedom, prescription, prudent change — and his line from Burke through Adams, Randolph and Calhoun to Eliot"
          - "Nisbet: the loss of community as the modern problem; the state's war on intermediate associations (family, church, guild); totalitarianism as the community of the uprooted"
          - "Weaver's 'ideas have consequences' (1948) as these authors report it — the nominalist fall"
          - "Fusionism and its strain: the traditionalist and the libertarian in one movement"
          - "Objections: 'a conservatism without an ancien régime' (Hartz); the market as solvent of the communities it is meant to protect"
        demo: null
        notes: "Summary indices 84 (Kirk, 7th ed.) and 74 (Nisbet). Weaver's Ideas Have Consequences was NOT obtained: name him only through what Kirk and Nisbet (and Fawcett, Muller) report, and say so in the brief. Burnham (next lesson) is the third founding figure of the National Review circle."

      - slug: burnham-managers-and-the-suicide-of-the-west
        title: "Burnham: the managerial revolution and the suicide of the West"
        type: core
        status: planned
        goal: "Analyze Burnham's thesis that a managerial class was replacing capitalists as the ruling class, and his later argument that liberalism is the ideology of Western contraction, and evaluate both"
        opening: "In 1941 the world appeared to offer three systems — capitalism, fascism, communism — and a former Trotskyist philosophy professor argues they are converging on one: a society ruled not by owners but by the people who run the factories, ministries and armies. Twenty-three years later, the same man, now an editor of the leading American conservative magazine, compares the maps of 1914 and 1964 and asks why it was letting itself shrink. The lesson follows the two theses and what connects them."
        est_minutes: 45
        prerequisites: [kirk-and-nisbet-american-conservatism, michels-and-pareto-oligarchy-and-elites]
        concepts:
          introduces: [managerial-revolution, liberalism-as-ideology-of-contraction]
          reinforces: [ruling-class, iron-law-of-oligarchy, circulation-of-elites, growth-of-power]
        key_ideas:
          - "The Managerial Revolution (1941): control of the means of production separated from ownership; managers as the new ruling class; the USSR, Germany and the New Deal as variants"
          - "Burnham's forecasts — and what 1945 did to them (Orwell's critique)"
          - "Suicide of the West (1964): the shrinking map; liberalism's nineteen propositions; guilt, the feeling that the West has no right to rule"
          - "Liberalism as the ideology of contraction: it reconciles a civilization to its decline"
          - "Objections: decolonisation as consent rather than suicide; the managerial thesis as description without a test"
        demo: null
        notes: "Summary indices 73 (Managerial Revolution) and 70 (Suicide of the West, 2014 Encounter ed.). Both in copyright: short quotations. Forward: Lasch (equality module), Deneen's liberalocracy, Murray's 'tyranny of guilt'."

      - slug: udhr-read-against-the-right
        title: "The Universal Declaration of Human Rights read against the right"
        type: core
        status: planned
        goal: "Apply Burke's, Maistre's, Oakeshott's, Strauss's, Kirk's and Jouvenel's critiques of abstract rights to the text of the 1948 Declaration and judge which critique the document bears out and where the document answers it"
        opening: "In 1948 delegates from fifty-eight states agreed on thirty articles declaring what every human being is entitled to, while declining to say why. A philosopher who had taken part in the preparatory discussions reported that they agreed on the list on condition that no one asked them the reason. The lesson reads the Declaration article by article with the critics of abstract rights the course has assembled, and asks what the document knows that they say it cannot."
        est_minutes: 40
        prerequisites: [strauss-natural-right-and-history, kirk-and-nisbet-american-conservatism]
        concepts:
          introduces: []
          reinforces: [no-such-thing-as-man, rationalism-in-politics, classic-natural-right, historicism, canons-of-conservatism, natural-law]
        key_ideas:
          - "The Declaration as an artefact — drafting, the abstentions, the deliberate silence on foundations"
          - "Burke and Maistre — real rights vs metaphysical rights; 'no such thing as man'; the articles that presuppose a particular society (Art. 15 nationality, Art. 21 elections)"
          - "Oakeshott — the Declaration as abridgment of a tradition; what it leaves out that the practice contained"
          - "Strauss — natural right without nature: the rights are listed, the ground is not; Kirk's prescription and Jouvenel's Power — rights that require a state to grant and enforce them"
          - "Where the document answers its critics — Article 29's duties and limits, and the 'social and international order' clause"
        demo: null
        notes: "Module application (L16). The UDHR text is public; the 'agreed on the list, not the why' remark is Maritain's (References). Scruton's critique of rights inflation comes later (equality module) and may be a forward Ref. The lesson cashes out the module's critiques on one real deployed document and names the departures."

  # ---------------------------------------------------------------------
  - slug: equality-after-rawls
    title: "Equality and its critics after Rawls"
    outcomes: [co-reconstruct, co-objection, co-questions, co-apply, co-contested]
    lessons:
      - slug: rawls-theory-of-justice
        title: "Rawls's Theory of Justice: the original position and the difference principle"
        type: core
        status: planned
        goal: "Analyze Rawls's argument from the original position to the two principles of justice, including the claim that natural talents are morally arbitrary, and evaluate the conservative and libertarian objections"
        opening: "Suppose a society must choose its basic rules — who gets what, who may do what — but none of its members may know whether they will be born rich or poor, clever or slow, healthy or sick. What rules would they pick? A Harvard philosopher argues in 1971 that they would pick equal liberties for all and allow inequalities only where they benefit the worst-off, and that this is what justice means. The book became the main statement of egalitarian liberalism for half a century. The lesson rebuilds the argument and puts the strongest objections to it."
        est_minutes: 45
        prerequisites: [rousseau-inequality-and-general-will, burnham-managers-and-the-suicide-of-the-west]
        concepts:
          introduces: [original-position, difference-principle, natural-lottery]
          reinforces: [consent, covenant, general-will, original-contract]
        key_ideas:
          - "Justice as the first virtue of institutions; the basic structure; the social contract made hypothetical; reflective equilibrium as the method"
          - "The original position and the veil of ignorance; maximin as the rational choice under it"
          - "The two principles and their lexical order; fair equality of opportunity; the difference principle"
          - "The natural lottery: talents and even effort as morally arbitrary — 'no one deserves his greater natural capacity'"
          - "Objections: Nozick's entitlement (Wilt Chamberlain), Hume's against any hypothetical contract (recalled), the conservative's 'distributed by whom?'"
        demo: null
        notes: "Summary indices 80 (A Theory of Justice, rev. ed.) and 81 (Höffe commentary). In copyright: short quotations. §§80–81 on envy are held for ressentiment-and-envy. Carens's global original position and Scruton's critique are forward Refs."

      - slug: ressentiment-and-envy
        title: "Ressentiment and envy: Scheler and Schoeck on equality, and Rawls's reply"
        type: core
        status: planned
        goal: "Analyze the argument that the demand for equality is driven by ressentiment and envy, in Scheler's and Schoeck's versions, and evaluate Rawls's reply that a just society produces no excusable envy"
        opening: "When a society decides that the rich must pay more or that some advantages must be shared, is it acting from a sense of justice, or from a feeling it would not admit to — the wish that those above it had less, even if no one else gained? Nietzsche had asked this about Christianity; a German philosopher in 1912 and a German sociologist in 1966 ask it about modern egalitarianism, the second with evidence from fifty cultures. Rawls, whose theory was the main target, answered them in two sections of his own book. The lesson sets the charge and the reply against each other."
        est_minutes: 45
        prerequisites: [rawls-theory-of-justice]
        concepts:
          introduces: [ressentiment, envy-schoeck, excusable-envy]
          reinforces: [difference-principle, original-position, natural-lottery, class-struggle]
        key_ideas:
          - "Nietzsche's slave revolt in morals, recalled by Ref only; Scheler's ressentiment as a 'self-poisoning of the mind' from impotent revenge and envy"
          - "Scheler's sociological law: ressentiment grows with the gap between formal equality and actual inequality — modern democracy as its seedbed; the value-inversion"
          - "Schoeck's Envy: envy as universal; the envy-barrier in peasant societies; a society that acts as if there were no envy grows; egalitarian policy as appeasement of envy"
          - "Rawls's §§80–81: why the parties are assumed not envious; excusable envy and the conditions that produce it; why the difference principle is not envy institutionalised"
          - "Weighing the two: what evidence could tell motive from principle; the objection that the envy charge can be turned against any claim"
        demo: null
        notes: "Summary indices 65 (Scheler), 59 (Schoeck; partial — last ~5% unread, say so), 80 (Rawls §§80–81). Ref nietzsche/slave-revolt-and-ressentiment and nietzsche/herd-morality-in-modern-dress; never re-teach. The course takes no side: the charge and the reply both at full strength."

      - slug: scruton-meaning-of-conservatism
        title: "Scruton's Meaning of Conservatism: authority before freedom"
        type: core
        status: planned
        goal: "Analyze Scruton's case that conservatism is about authority, allegiance and institutions rather than freedom, and his philosophical reply to contract and Rawlsian liberalism"
        opening: "A young philosopher who watched the Paris riots of 1968 and found himself siding against the rioters writes a book saying that conservatism is not about freedom at all but about authority — the authority of family, custom, law and nation that a person does not choose and could not have contracted into. He then has to say why a reasonable person should accept authority he did not choose. The lesson follows the doctrine and the philosophical appendix that defends it against the liberal theory of justice."
        est_minutes: 45
        prerequisites: [ressentiment-and-envy]
        concepts:
          introduces: [allegiance, authority-before-freedom, autonomous-institution, first-person-vs-third-person-justification]
          reinforces: [conservatism-as-disposition, little-platoon, ethical-life, art-of-association, consent, original-position, difference-principle]
        key_ideas:
          - "Dogmatics, not philosophy; the reformer, not the radical, as the dangerous opponent; freedom is not the point"
          - "Authority and allegiance — the family as model; patriotism vs nationalism; the social contract critique; the state as a person"
          - "Constitution, law and property — rights vs privileges, the ascendancy of statute, property as home (oikos); why conservatism is not capitalism"
          - "Alienation read conservatively (Marx inverted); autonomous institutions, establishment, the stratified society"
          - "The Philosophical Appendix — desire-based vs autonomy-based liberalism, Rawls (recalled), first-person vs third-person justification and the onus of proof (the later 'distributed by whom?' as a pointer)"
        demo: null
        notes: "Moved to the equality module: Rawls now has his own lesson (rawls-theory-of-justice), so the Appendix's reply is read against a position the reader already holds — Ref it, never reconstruct it from Scruton's statement. How to Be a Conservative is held for the nation module."

      - slug: macintyre-after-virtue
        title: "MacIntyre's After Virtue: the failure of the Enlightenment project"
        type: core
        status: planned
        goal: "Analyze MacIntyre's argument that modern moral language is the fragment of a lost tradition, that the Enlightenment's attempt to justify morality had to fail, and that the choice is Nietzsche or Aristotle"
        opening: "Two people argue about abortion, war or taxation; each argument is valid, each starts from premises the other rejects, and there is no agreed way to weigh them, so the debate never ends. A Scottish philosopher in 1981 says this is not normal: it is what moral language looks like after a catastrophe, like the words of a science whose theory has been forgotten. The lesson follows his diagnosis, his history of how it happened, and his choice between two ways out."
        est_minutes: 45
        prerequisites: [scruton-meaning-of-conservatism, strauss-natural-right-and-history]
        concepts:
          introduces: [emotivism, enlightenment-project, practice-and-tradition]
          reinforces: [classic-natural-right, fact-value-distinction, common-good, ethical-life]
        key_ideas:
          - "The disquieting suggestion — moral language after a catastrophe; interminable debate; emotivism as the theory true of our use"
          - "The Enlightenment project — Kant, Hume, Kierkegaard, Diderot — and why it had to fail without a human telos"
          - "The characters of modernity: the aesthete, the manager, the therapist; managerial expertise as a pretence"
          - "Practices, the narrative unity of a life, traditions — the virtues restored"
          - "Nietzsche or Aristotle; 'the new dark ages' and the waiting for 'another St Benedict'"
        demo: null
        notes: "Summary index 53 (3rd ed.). In copyright: short quotations. MacIntyre is a man of the left turned Thomist; the lesson presents him as a critic of liberalism from outside the right as well as within it. Forward: Deneen's Benedict Option, Vermeule's classical legal tradition."

      - slug: lasch-revolt-of-the-elites
        title: "Lasch's Revolt of the Elites: meritocracy and the betrayal of democracy"
        type: core
        status: planned
        goal: "Analyze Lasch's argument that the danger to democracy now comes from mobile meritocratic elites rather than from the masses, and evaluate it against Ortega's original thesis"
        opening: "Ortega said in 1930 that Europe's crisis was the masses' revolt against the minorities who should lead them. An American historian of the left, writing in 1994, turns the thesis around: the people with no loyalty to place, no sense of obligation and no gratitude to the past are now the educated elites who run finance, the media and the universities, and who have stopped sharing schools, neighbourhoods and services with everyone else. The lesson follows the inversion and asks what evidence would decide between the two."
        est_minutes: 40
        prerequisites: [macintyre-after-virtue, ortega-revolt-of-the-masses]
        concepts:
          introduces: [revolt-of-the-elites, meritocracy-critique]
          reinforces: [mass-man, managerial-revolution, natural-aristocracy, aristocracy-of-talent]
        key_ideas:
          - "Ortega inverted: the mass-man's traits fit the new elites"
          - "Meritocracy as a parody of democracy; an aristocracy of talent without noblesse oblige"
          - "The secession of the successful; the new class defined by a way of life and by information"
          - "Democracy requires distributed property and competence; populism and the lower middle class"
          - "Objections: the elite as a moving target; the left's and the right's readings of the book"
        demo: null
        notes: "Summary index 62. Lasch is a man of the left whom the right has read: present him as such. Forward: the-cognitive-elite (application), Deneen's liberalocracy."

      - slug: the-cognitive-elite
        title: "The cognitive elite: The Bell Curve's class argument as a test of Rawls and Lasch"
        type: core
        status: planned
        goal: "Apply Rawls's natural lottery, Lasch's revolt of the elites and the module's account of envy to The Bell Curve's analysis of cognitive stratification in American data, and judge what the data show and where the argument departs from them"
        opening: "In 1994 two authors claimed that America was sorting itself by intelligence: the most able students now went to a handful of colleges, married one another, worked in a few professions and lived in a few places, while the rest of the country was left with fewer of its abler members. They supported it with a survey that had followed twelve thousand young Americans since 1979. If they were right, Rawls's natural lottery and Lasch's secession of the successful describe the same thing. The lesson reads the class argument and its data, leaving the book's chapters on race for a later module."
        est_minutes: 45
        prerequisites: [lasch-revolt-of-the-elites, ressentiment-and-envy]
        concepts:
          introduces: [g-factor, heritability, cognitive-stratification]
          reinforces: [natural-lottery, difference-principle, revolt-of-the-elites, meritocracy-critique, natural-aristocracy]
        key_ideas:
          - "What is measured: the AFQT in the NLSY79, the general factor g, and what 'heritability' does and does not mean"
          - "Part I — the cognitive elite: college sorting, occupational sorting, assortative mating, and the authors' published figures"
          - "Part II — IQ and social outcomes (poverty, schooling, unemployment, illegitimacy) controlling for parental SES: what the regressions show and what they cannot"
          - "Read against Rawls (talents arbitrary, so redistribute) and Lasch (merit as a new aristocracy) — two opposite uses of one finding"
          - "Departures: the AFQT as a schooling-sensitive test, omitted variables, the authors' policy chapters as a separate argument"
        demo: null
        notes: "Module application (L16). Summary index 71 (merged). The race chapters (13–14) are held for hereditarian-case-iq-and-nations. Introduces g-factor and heritability carefully for a newcomer; the heredity module reinforces them."

  # ---------------------------------------------------------------------
  - slug: civilizations
    title: "Civilizations: one or many — Toynbee and Huntington against Spengler"
    outcomes: [co-reconstruct, co-objection, co-questions, co-apply, co-contested]
    lessons:
      - slug: toynbee-challenge-and-response
        title: "Toynbee: challenge and response, breakdown and disintegration"
        type: core
        status: planned
        goal: "Analyze Toynbee's theory of how civilizations arise, grow, break down and disintegrate, and evaluate its method of comparison across twenty-one cases"
        opening: "If England's history cannot be understood without Europe's, what is the smallest unit of history that can be understood on its own? Toynbee answers: a civilization, of which he counts twenty-one, and then asks why some arose where others did not, why most broke down, and whether the West must. He refuses the answers from race, climate and organic lifespan, and proposes a different mechanism. The lesson follows it and tests it on his own cases."
        est_minutes: 45
        prerequisites: [spengler-decline-of-the-west, gobineau-inequality-of-races]
        concepts:
          introduces: [challenge-and-response, creative-minority, breakdown-of-civilizations, universal-state]
          reinforces: [culture-vs-civilization-spengler, spartan-constitution, mass-man, two-cities]
        key_ideas:
          - "The intelligible field of study; twenty-one civilizations and their tokens of affiliation; against the unity of civilization"
          - "Race and environment rejected as causes; challenge and response — hard countries, new ground, blows, pressures, penalizations; the golden mean"
          - "Arrested civilizations (Polynesians, Eskimos, Nomads, Osmanlis, Spartans); growth as etherialization; withdrawal and return; the creative minority and mimesis"
          - "Breakdown as failure of self-determination — the nemesis of creativity, militarism, idolisation of an institution; disintegration — dominant minority, internal and external proletariat, schism in the soul"
          - "Universal states and universal churches — the church as chrysalis; where Toynbee and Spengler disagree about the West"
        demo: null
        notes: "Objections: Spengler's (the organism vs the free response), the historians' (Geyl, Trevor-Roper in References — selected cases, laws from a sample of 21), and Huntington's use of Toynbee's list. Toynbee's chapter refusing race answers Gobineau (Ref). Sparta from the Greek module's application returns as the arrested-civilization case (spiral)."

      - slug: huntington-clash-of-civilizations
        title: "Huntington's clash of civilizations"
        type: core
        status: planned
        goal: "Analyze Huntington's hypothesis that cultural fault lines will replace ideology as the source of conflict, and lay out the main objections to it"
        opening: "When the Cold War ended, the question was what would organise world conflict next. A Harvard political scientist proposed in 1993 that the answer was neither ideology nor economics but culture, and that the great divisions of the future would run along the borders of seven or eight civilizations. The lesson reconstructs the hypothesis as he stated it — descriptive, he insisted, not advocacy — and the objections that met it."
        est_minutes: 40
        prerequisites: [toynbee-challenge-and-response]
        concepts:
          introduces: [civilizational-fault-line, kin-country-syndrome, torn-country]
          reinforces: [challenge-and-response, culture-vs-civilization-spengler, friend-enemy-distinction, nation-as-project]
        key_ideas:
          - "What a civilization is for Huntington — the highest cultural grouping, objective elements plus self-identification; levels of identity; Toynbee's list reused"
          - "Six reasons civilizations will clash; the Velvet Curtain of culture; 'Islam has bloody borders'"
          - "The kin-country syndrome — the Gulf War, Bosnia, the Caucasus; torn countries (Turkey, Mexico, Russia)"
          - "The West versus the rest — the universal civilization as a Western idea; isolation, bandwagoning, balancing"
          - "Objections — the 'clash of ignorance' (Said), the state still fights states (realist critique), civilizations as too internally divided (Sen) — named as positions, developed as arguments"
        demo: null
        notes: "Who Are We? (2004) is now read in full (summary 76); its argument on the Anglo-Protestant core belongs to albions-seed-and-who-are-we in the nation module, which this lesson points forward to. Schmitt's friend–enemy is the backward Ref the hypothesis invites."

      - slug: what-measures-greatness
        title: "One civilization or many: what measures greatness and why civilizations decline"
        type: synthesis
        status: planned
        goal: "Compare Spengler's, Toynbee's and Huntington's answers to whether civilizations are one or many, what measures their greatness, and why they decline, and judge each against the module's cases"
        opening: "Three authors who agree that civilizations exist disagree about almost everything else: whether there is one human civilization or many, whether greatness is power, duration or the ideas others take up, and whether decline is a biological fate, a failed response, or a shift in who fights whom. The lesson sets the three theories side by side on the same historical cases and asks which questions each can answer."
        est_minutes: 40
        prerequisites: [huntington-clash-of-civilizations]
        concepts:
          introduces: [measures-of-greatness]
          reinforces: [culture-vs-civilization-spengler, challenge-and-response, civilizational-fault-line, contemporaneity, universal-state, caesarism]
        key_ideas:
          - "One or many — Toynbee's 'misconception of the unity of civilization' against the Enlightenment's single ladder; Ortega's Europe as common stock; Huntington's 'universal civilization is a Western idea'"
          - "Three measures of greatness — power (Huntington's 'the West versus the rest' — control of the international institutions and the use of force), duration (Spengler's thousand years), ideas others take up (Toynbee's etherialization, Ortega's rule by opinion)"
          - "Three accounts of decline — organism, failure of self-determination, cultural fault line — tested on Rome, Byzantium and the West"
          - "Race as a measure and a cause: Gobineau's answer recalled, Toynbee's and Spengler's refusals in their own words — the modern form of the debate held for the heredity module"
        demo: null
        notes: "Synthesis lesson. The race answer is recalled from gobineau-inequality-of-races as an argument with its history and objections, never as settled; the modern hereditarian debate has its own module later. Murray's Human Accomplishment (why-the-west module) is the forward Ref for 'ideas others take up' measured by count; Deneen's 'failed because it succeeded' is the later hook."

      - slug: testing-the-clash
        title: "Testing the clash: Huntington's hypothesis against the conflict record since 1993"
        type: core
        status: planned
        goal: "Evaluate Huntington's hypothesis against the published tests of conflict across civilizational lines since 1993 and against the Yugoslav wars, and state where the record supports, qualifies or refutes it"
        opening: "A hypothesis stated in 1993 about the pattern of future conflict can be checked thirty years later. Political scientists did check it, counting wars and disputes by whether the parties belonged to the same civilization or different ones, and the wars in Yugoslavia that Huntington cited as his first case ran their course. The lesson reproduces the simplest form of the test and reads the Bosnian case for the kin-country syndrome."
        est_minutes: 40
        prerequisites: [what-measures-greatness]
        concepts:
          introduces: []
          reinforces: [civilizational-fault-line, kin-country-syndrome, torn-country, measures-of-greatness]
        key_ideas:
          - "Turning the hypothesis into a count — how Huntington's own criteria classify a conflict as cross-civilizational"
          - "The published tests (dyadic conflict data 1950–2000s) and what they found — more conflict within civilizations than across, with Islam–West as the partial exception"
          - "Bosnia 1992–95 as the kin-country case — Germany and Croatia, Russia and Serbia, Iran and the Bosnian Muslims — and the counter-cases (Russia–Ukraine, Iraq–Kuwait)"
          - "Where the hypothesis departs from the record and where its defenders say the tests miss what it claimed"
        demo: null
        notes: "Module application (L16). The tests (Russett, Oneal & Cox 2000; Chiozza 2002; Henderson & Tucker 2001) are public papers not in the dossier — the brief names them for the writer to obtain; Huntington's 1993 criteria (dossier source 4) are what the lesson operationalises. Research-shaped: reproduce one count."

  # ---------------------------------------------------------------------
  - slug: why-the-west
    title: "Why the West? Exceptionalism and the chain of exchange"
    outcomes: [co-reconstruct, co-objection, co-questions, co-apply, co-contested]
    lessons:
      - slug: weber-only-in-the-west
        title: "Weber's 'only in the West': the Protestant ethic and rationalization"
        type: core
        status: planned
        goal: "Analyze Weber's question why rational science, law, bureaucracy and capitalism arose only in the West, and his answer from the Protestant ethic, and evaluate the evidence and the objections"
        opening: "China had paper money, printing and a civil service chosen by examination; India had mathematics and logic; the Islamic world had trade networks from Spain to Indonesia. Yet the laboratory, the systematic law code, the career bureaucracy and the capitalist firm keeping double-entry books appeared together only in Europe. A German sociologist asks why, and in an essay of 1904 begins with a fact from the Baden tax statistics: Protestants owned more capital and chose more technical schooling than Catholics. The lesson follows his answer and its critics."
        est_minutes: 45
        prerequisites: [what-measures-greatness, hellenization-of-christianity]
        concepts:
          introduces: [protestant-ethic, rationalization]
          reinforces: [measures-of-greatness, civil-society]
        key_ideas:
          - "The 'Author's Introduction' (1920): the list of what exists 'only in the West' — and what kind of claim it is"
          - "The spirit of capitalism: Franklin's maxims; acquisition as a duty, not an appetite; traditionalism as the obstacle"
          - "Luther's calling; Calvinist predestination and the anxiety of proof; worldly asceticism; the sects"
          - "The iron cage — rationalization outliving its religious root"
          - "Objections: Catholic capitalism before the Reformation (Italian banking), the Baden data re-examined, Scotland and Holland; Weber's own disclaimer of monocausality"
        demo: null
        notes: "Summary index 108 (Parsons tr., Giddens intro.). Weber's 'only in the West' opens the module's question; Landes, Murray and Henrich continue it; Pomeranz and Goody reply. Strauss's critique of Weber's fact–value distinction (strauss-natural-right-and-history) is the backward Ref."

      - slug: landes-european-exceptionalism
        title: "Landes's Wealth and Poverty of Nations: fragmentation, invention and culture"
        type: core
        status: planned
        goal: "Analyze Landes's account of why Europe pulled ahead — political fragmentation, property rights, the invention of invention, culture — and evaluate it against the cases he contrasts"
        opening: "In the early 1400s Chinese fleets larger than anything Europe could build reached East Africa; within a century the voyages were abandoned, their records destroyed and ocean-going ships forbidden, while small Portuguese ships rounded Africa and reached India. An economic historian asks why a richer, more populous civilization stopped and a poorer, divided one went on. His answer is that the difference lay less in what each had than in who could stop whom. The lesson follows the argument and tests it on his own contrasts."
        est_minutes: 45
        prerequisites: [weber-only-in-the-west]
        concepts:
          introduces: [european-fragmentation, invention-of-invention]
          reinforces: [protestant-ethic, rationalization, sovereignty]
        key_ideas:
          - "Geography as unfair but not destiny; rain-fed Europe and the hydraulic empires"
          - "Fragmentation and the right of exit: rulers forced to bargain; property secure from the prince"
          - "The invention of invention — the clock, eyeglasses, printing — and why Europe spread innovations that others suppressed"
          - "Zheng He's fleets and the Ottoman printing ban as test cases"
          - "'Culture makes all the difference' — and the objections: Eurocentrism, the selection of cases, the West's own violence (Landes's law of imperialism)"
        demo: null
        notes: "Summary index 61. Forward: Henrich's mechanism, Pomeranz's and Goody's replies."

      - slug: murray-human-accomplishment
        title: "Charles Murray's Human Accomplishment: measuring greatness in the arts and sciences"
        type: core
        status: planned
        goal: "Analyze Murray's method of counting significant figures across 2,800 years of arts and sciences and his finding that accomplishment concentrated in Europe, and evaluate what the method can and cannot measure"
        opening: "To say that one civilization contributed more to science or art than another sounds like a prejudice. An American social scientist tries to make it a count: take every serious history and encyclopaedia of astronomy, music, painting or philosophy in several languages, record whom they mention, and see where and when the people mentioned by most of them lived. The resulting tables are lopsided. The lesson follows how the count is built, what it shows, and what it assumes."
        est_minutes: 45
        prerequisites: [landes-european-exceptionalism]
        concepts:
          introduces: [accomplishment-inventory]
          reinforces: [measures-of-greatness, protestant-ethic, european-fragmentation]
        key_ideas:
          - "The inventories: significant figures as those named in at least half of the qualified sources; the index score; the Lotka curve of eminence"
          - "The findings: Europe's share, its concentration in a few places and centuries, the decline per capita after 1850"
          - "Murray's explanations: purpose, autonomy, the transcendental good, the true, the beautiful — and the role of Christianity"
          - "Eurocentric bias tested: non-Western sources, Chinese and Indian inventories"
          - "What the method cannot see — accomplishment in governance and commerce deliberately excluded; the sources' own canon"
        demo: null
        notes: "Summary index 60. Research-shaped: the reader reproduces one inventory count. Pairs with what-measures-greatness ('ideas others take up')."

      - slug: henrich-church-and-kinship
        title: "Henrich's WEIRD thesis: the Church, the family and the Western mind"
        type: core
        status: planned
        goal: "Analyze Henrich's argument that the medieval Church's marriage and family programme dissolved intensive kinship and produced the psychology behind Western institutions, and evaluate its evidence"
        opening: "Psychologists who test people across the world find that students in Western universities are unusual: more individualistic, more trusting of strangers, more guilty than ashamed, more analytic in how they sort objects. If that is so, where did the difference come from? A Harvard anthropologist proposes an unexpected answer: the medieval Church's rules on whom a Christian could marry. The lesson follows the chain from incest rules to impersonal markets and tests each link."
        est_minutes: 45
        prerequisites: [murray-human-accomplishment, augustine-two-cities]
        concepts:
          introduces: [weird-psychology, marriage-and-family-program, intensive-kinship]
          reinforces: [protestant-ethic, european-fragmentation, civil-society]
        key_ideas:
          - "WEIRD: the 2010 finding that Western subjects are psychological outliers"
          - "Intensive kinship — clans, cousin marriage, segmentary lineages — and the psychology it fosters"
          - "The Church's Marriage and Family Program (from c. 500): bans on cousin marriage, polygamy, levirate; its timing and reach"
          - "From dissolved kin to voluntary associations — towns, guilds, universities, monasteries — and to impersonal prosociality"
          - "The evidence (dose-response by years of Church exposure, Italian and Indian comparisons) and the objections (reverse causation, the selection of variables)"
        demo: null
        notes: "Summary indices 86 (The WEIRDest People, 2020) and 87 (BBS 2010). Augustine's Ref is for the Church's authority in marriage."

      - slug: pomeranz-and-goody-the-rival-thesis
        title: "Pomeranz and Goody: the great divergence and the theft of history"
        type: core
        status: planned
        goal: "Analyze the rival thesis that Europe's lead came late, from coal and colonies (Pomeranz), and that the story of Western uniqueness misreads a long Eurasian exchange (Goody), and evaluate it against the exceptionalist case"
        opening: "If Europe had been ahead since the Greeks or the Reformation, its lead should show in the numbers by 1700. A historian of China compares the Yangzi delta with England around 1750 — wages, life expectancy, markets, consumption — and finds them close; the gap opens after 1800. An English anthropologist adds that most of what Europeans called their unique heritage — the city, the market, love, democracy — had parallels across Eurasia that European historians did not look for. The lesson states the rival thesis at full strength and puts it against the exceptionalists."
        est_minutes: 45
        prerequisites: [henrich-church-and-kinship]
        concepts:
          introduces: [great-divergence, theft-of-history]
          reinforces: [european-fragmentation, invention-of-invention, protestant-ethic]
        key_ideas:
          - "Pomeranz: surprising resemblances — Jiangnan and England c. 1750; markets, labour, consumption"
          - "The two windfalls: coal located near industry, and the New World's land — 'ghost acres'"
          - "Goody: the West's appropriation of antiquity, feudalism, the city, capitalism and even love; alternation rather than permanent lead"
          - "The exceptionalists' reply — fragmentation, science, institutions — and where each side's data come from"
          - "What the rival thesis concedes and what it denies: the West as one link in a long chain of exchange"
        demo: null
        notes: "Summary indices 72 (Pomeranz) and 83 (Goody). Phrase the rival thesis as its authors do, never as a reproach. The concrete borrowings and the systems reply are the next lesson."

      - slug: the-borrowing-ledger
        title: "The borrowing ledger: paper, gunpowder, print and numerals"
        type: core
        status: planned
        goal: "Apply the module's rival theses to the documented record of what the West borrowed — paper, gunpowder, printing, Hindu-Arabic numerals — grading each transfer by the strength of its evidence, and evaluate the reply that the West turned borrowings into self-sustaining systems"
        opening: "Paper, gunpowder, the compass and printing are often listed together as Chinese inventions that Europe took. The evidence for each transfer is very different: for paper there is a chain of mills from Samarkand to Baghdad to Spain; for gunpowder, a formula appearing in Europe a few decades after the Mongol armies, with no document of the passage; for Gutenberg's press, almost nothing linking it to East Asia at all. The lesson grades each claim by its evidence and then asks what the ledger proves about Western exceptionalism."
        est_minutes: 45
        prerequisites: [pomeranz-and-goody-the-rival-thesis]
        concepts:
          introduces: [graded-transmission, borrowing-into-system]
          reinforces: [great-divergence, theft-of-history, invention-of-invention, european-fragmentation]
        key_ideas:
          - "Paper: Chinese invention; Samarkand, Baghdad, Damascus, Játiva, Fabriano — a documented chain via the Arab world (secure)"
          - "Gunpowder: Chinese formulae, the first European description (Roger Bacon, 1267) and Latin recipes by c. 1300 (Liber Ignium), after Mongol-era contact; no document of the transfer; Europeans plausibly unaware of its origin (probable but unproven)"
          - "Printing: Chinese and Korean movable type; Gutenberg's metal type, press and oil ink — most probably an independent invention"
          - "Numerals: India to Baghdad (al-Khwarizmi) to Fibonacci (1202) — secure, and slow to spread"
          - "The strongest reply: everyone borrowed, but the West turned what it borrowed into self-sustaining systems — numerals into the calculus and proof from measurement, powder into the military revolution, print into the Reformation and the scientific journal; the rival thesis's answer"
        demo: null
        notes: "Module application (L16). Confidence grades must be stated per item, never as one flat line: paper via the Arab world (secure); gunpowder via Mongol-era contact (most likely, undocumented; Europeans plausibly did not know its origin); Gutenberg (most probably independent). Landes ch. 4, Goody, Pomeranz, Murray's inventories (index 60) and Diamond ch. 13 are the dossier anchors; the brief names public scholarship for the transfer chains."

  # ---------------------------------------------------------------------
  - slug: heredity-and-civilization
    title: "Heredity, geography or institutions: explaining the gaps between peoples"
    outcomes: [co-reconstruct, co-objection, co-apply, co-contested]
    lessons:
      - slug: hereditarian-case-iq-and-nations
        title: "The hereditarian case: The Bell Curve on group differences and IQ and the Wealth of Nations"
        type: core
        status: planned
        goal: "Analyze at full strength the argument that average differences in measured intelligence between groups and nations are partly genetic and explain part of the gaps in wealth between them, with its evidence"
        opening: "Average scores on intelligence tests differ between groups within countries and between countries, and the differences track income. Everyone agrees on that much. The dispute is over why. Two books argued that part of the answer is genetic: one in 1994 about groups within the United States, one in 2002 about the nations of the world, ranking 81 of them by estimated average IQ and setting the list against their wealth. The lesson reconstructs both arguments at their strongest, with the evidence each cites, before the next lessons put the objections."
        est_minutes: 45
        prerequisites: [the-cognitive-elite, chamberlain-and-grant, the-borrowing-ledger]
        concepts:
          introduces: [hereditarian-hypothesis, national-iq]
          reinforces: [g-factor, heritability, racial-theory-of-history, great-divergence]
        key_ideas:
          - "The Bell Curve ch. 13: the measured gap, test bias examined, the agnostic conclusion on genes and environment as the authors state it"
          - "From heritability within groups to differences between groups — the authors' argument and its stated limits"
          - "Lynn & Vanhanen (2002): the national-IQ estimates, how they were assembled, the correlation with GDP per capita, the causal story (IQ → wealth and wealth → IQ)"
          - "What distinguishes this from the nineteenth-century race theories — measurement, statistics — and what it shares with them"
          - "The objections to come: Flynn effect, measurement, between-group inference, sampling — named here, developed next"
        demo: null
        notes: "Summary indices 71 (Bell Curve), 82 (Lynn & Vanhanen; last ~5% unread — say so). Per the course brief: taught as an argument with its evidence and the evidence against, neither endorsed nor dismissed; no label in the course's voice. The Flynn effect must be introduced here as a fact the hereditarian case itself discusses."

      - slug: reich-ancient-dna-and-the-indo-europeans
        title: "Reich on ancient DNA: migrations, the Indo-Europeans and the question of difference"
        type: core
        status: planned
        goal: "Explain what ancient DNA has shown about the population history of Europe and India — the farmer migrations, the steppe expansion behind the Indo-European languages — and analyze Reich's argument about genetic differences between populations"
        opening: "For most of the twentieth century archaeologists held that pots, not people, moved: new styles and languages spread by imitation, and the inhabitants of a place were largely the descendants of its first settlers. After 2010 it became possible to read the genomes of people dead for eight thousand years. The results showed that the people of a place almost never descend only from those who lived there before. The lesson follows what ancient DNA showed about Europe and India, and the conclusion its leading investigator drew about differences between human populations."
        est_minutes: 45
        prerequisites: [hereditarian-case-iq-and-nations]
        concepts:
          introduces: [ancient-dna, steppe-migration, population-mixture]
          reinforces: [hereditarian-hypothesis, heritability, nordicism]
        key_ideas:
          - "The method: ancient genomes, ancestry components, admixture dating; why present-day patterns cannot recover the past"
          - "Europe as three populations mixed — hunter-gatherers, Anatolian farmers, steppe herders (Yamnaya) — and the Corded Ware replacement"
          - "The Indo-European question: the steppe hypothesis strengthened; India's two ancestral populations and the caste record"
          - "What ancient DNA does to the nineteenth-century race theories: 'pure' races as an artefact"
          - "Reich's ch. 11: genetic differences between populations in some traits cannot be ruled out; his rejection of both the racist and the 'orthodoxy' positions; the objections"
        demo: null
        notes: "Summary index 68. Grant's and Chamberlain's 'Nordic/Aryan' claims are the backward Ref the evidence tests. Teach the migration findings as findings and the inference about cognitive traits as a contested argument."

      - slug: gould-and-harden-on-heredity
        title: "Gould and Harden: the objections to hereditarian explanation"
        type: core
        status: planned
        goal: "Analyze the main objections to hereditarian explanations of group differences — reification, the within/between fallacy, the history of the measures (Gould) — and Harden's argument that genes matter for individual inequality but not for group comparisons, and evaluate both against the hereditarian replies"
        opening: "Suppose the heritability of height within a village is high and the next village is shorter on average. Does it follow that the difference between the villages is genetic? It does not, if one village was starved. The objections to the hereditarian case begin from this point and go further: whether intelligence is a single thing that can be measured, and whether the history of its measurement shows science following prejudice. One recent critic accepts much of the genetics and still rejects the group conclusion. The lesson sets out the objections and the hereditarian replies."
        est_minutes: 45
        prerequisites: [reich-ancient-dna-and-the-indo-europeans]
        concepts:
          introduces: [reification, within-between-fallacy, polygenic-index]
          reinforces: [heritability, g-factor, hereditarian-hypothesis, national-iq]
        key_ideas:
          - "Gould's Mismeasure: craniometry (Morton, Broca), the American army tests and the 1924 Act; g as reification of a principal component"
          - "The within/between fallacy — the two villages, and the seed corn The Bell Curve itself uses — and the Flynn effect as environmental change of hereditarian size"
          - "The replies: the Morton re-measurement (2011), g's predictive validity; the hereditarians' answer to the between-group point"
          - "Harden's Genetic Lottery: twin and GWAS evidence that genes matter for individual outcomes; polygenic indices; why they do not transfer across ancestries"
          - "Harden's political conclusion — the genetic lottery as an argument for equality (Rawls's natural lottery recalled) — and the objection from both sides"
        demo: null
        notes: "Summary indices 57 (Gould, rev. ed.) and 78 (Harden). The course passes no verdict: each objection meets the hereditarian reply."

      - slug: geography-or-institutions
        title: "Geography or institutions: Diamond and Acemoglu–Robinson on the gap between nations"
        type: core
        status: planned
        goal: "Analyze Diamond's geographical explanation and Acemoglu and Robinson's institutional explanation of the inequality between nations, and evaluate each against the other and against the hereditarian and cultural accounts"
        opening: "Why did Spanish soldiers capture the Inca emperor at Cajamarca in 1532, and not Inca soldiers the king of Spain? And why is one half of the town of Nogales, on the Arizona side of a fence, three times richer than the other half in Mexico, with the same people, climate and food? Two explanations of the inequality between nations take one question each. The lesson follows both, and the attack each makes on the other."
        est_minutes: 45
        prerequisites: [gould-and-harden-on-heredity]
        concepts:
          introduces: [proximate-and-ultimate-causes, inclusive-and-extractive-institutions, critical-juncture]
          reinforces: [hereditarian-hypothesis, great-divergence, european-fragmentation]
        key_ideas:
          - "Diamond: Yali's question; proximate causes (guns, germs, steel) and ultimate ones (domesticable species, the east–west axis); race rejected"
          - "The Fertile Crescent and the axes of continents; why Eurasia, and the limit — why Europe rather than China"
          - "Acemoglu & Robinson: Nogales, the two Koreas; inclusive vs extractive institutions; critical junctures (the Black Death, 1688)"
          - "Their attack on geography, culture and ignorance; the reversal of fortune in the colonies"
          - "Weighing the four explanations (genes, culture, geography, institutions) on the same cases"
        demo: null
        notes: "Summary indices 58 (Diamond) and 51 (Why Nations Fail). Forward: the empire module (colonial institutions) and the application audit."

      - slug: national-data-audited
        title: "Two datasets audited: national IQ and settler mortality"
        type: core
        status: planned
        goal: "Apply the sourcing drill to the key dataset of the hereditarian account (national IQ estimates) and of the institutional account (settler mortality), and judge what each dataset can support"
        opening: "Both of the big explanations of why nations differ rest on one table. The hereditarian account rests on a list of average IQs for eighty-one countries; the institutional account on a list of how many European soldiers and bishops died per year in each colony. Each table has been re-examined by critics who went back to the studies behind the numbers. The lesson takes both tables, traces several entries to their sources, and asks what each can carry."
        est_minutes: 45
        prerequisites: [geography-or-institutions]
        concepts:
          introduces: []
          reinforces: [national-iq, inclusive-and-extractive-institutions, hereditarian-hypothesis, critical-juncture]
        key_ideas:
          - "The sourcing drill applied to a dataset: who measured, whom, when, how many, and how the gaps were filled"
          - "National IQ: the sample behind several entries; estimates imputed from neighbours; the critics' re-analyses and the authors' replies"
          - "Settler mortality: the sources for several colonies; the critics' re-coding (Albouy) and the authors' reply"
          - "Symmetry: the same standard applied to both tables"
          - "What survives: which correlations hold under reasonable corrections, and what no cross-country table can show about cause"
        demo: null
        notes: "Module application (L16). Lynn & Vanhanen appendix (index 82) is in the dossier; the settler-mortality data (Acemoglu, Johnson & Robinson 2001) and its critiques (Albouy 2012; Wicherts et al. 2010 on national IQ) are public papers not in the dossier — the brief names them. Research-shaped by construction. Computation only inside the source inquiry."

  # ---------------------------------------------------------------------
  - slug: empire-and-guilt
    title: "Empire, conquest and inherited guilt: Vitoria to the reparations debate"
    outcomes: [co-reconstruct, co-objection, co-apply, co-contested]
    lessons:
      - slug: vitoria-right-to-the-americas
        title: "Vitoria on the right to the Americas: unjust and just titles"
        type: core
        status: planned
        goal: "Analyze Vitoria's examination of every title by which Spain might hold the Americas and his conclusion that only the right of travel, trade and preaching survives — and what that right licensed"
        opening: "Forty-seven years after Columbus, a Dominican professor at Salamanca lectures to the Spanish establishment on whether their king has any right to the lands and peoples his soldiers have taken. He rejects the emperor's claim, the Pope's donation, the right of discovery, the Indians' refusal of the faith and their sins against nature, one by one. Then he asks what right is left. The lesson follows the examination and its uncomfortable end."
        est_minutes: 45
        prerequisites: [aquinas-law-and-kingship, aristotle-political-animal-and-natural-slavery]
        concepts:
          introduces: [dominium, unjust-titles, ius-communicationis, law-of-war-vitoria]
          reinforces: [natural-slavery, natural-law, just-war, human-law-determination]
        key_ideas:
          - "Did the barbarians have true dominion — not natural slaves, not sinners, not madmen; property does not depend on grace"
          - "The seven unjust titles — emperor, pope, discovery, refusal of the faith, sins against nature, voluntary choice, divine gift — and why each fails"
          - "The just titles — natural partnership and communication (travel, trade, preaching), protection of converts, tyranny of native rulers, alliance — and the sequence from persuasion to war"
          - "The Law of War — the sole just cause is injury; what may be done in victory; war just on both sides through invincible ignorance"
          - "Las Casas and Sepúlveda; the natural-slavery title Vitoria leaves open at the end 'for the sake of argument'"
        demo: null
        notes: "Aristotle's natural slavery is the backward Ref the whole lecture argues with; Pagden's charge that the just titles licensed what the unjust titles forbade is the objection to carry. Prerequisites are knowledge prerequisites: Aquinas's natural law and Aristotle's natural slavery."

      - slug: locke-and-mill-on-empire
        title: "Locke's waste land and Mill's tutelage: the liberal justification of empire"
        type: core
        status: planned
        goal: "Analyze how Locke's theory of property and Mill's theory of progress each justified rule over peoples who had not consented, and evaluate the thesis that the exclusion follows from liberal premises rather than contradicting them"
        opening: "The same John Locke who said no one may be governed without consent said that America was waste land that labour could appropriate, and the same John Stuart Mill who said no society may silence one dissenter said that a despotism is a legitimate way of governing barbarians. Were these lapses, or do they follow from the theories? The lesson reads the passages and the strongest case that they follow."
        est_minutes: 45
        prerequisites: [vitoria-right-to-the-americas, stephen-liberty-equality-fraternity]
        concepts:
          introduces: [strategies-of-exclusion, civilizational-infantilism, tutelage]
          reinforces: [labour-theory-of-property, consent, harm-principle, civilized-community-clause, dominium]
        key_ideas:
          - "Locke ch. V — 'in the beginning all the World was America'; nature as worthless inheritance; why a people with no political society in Locke's sense has no territory"
          - "The anthropological minimum and the thick conditions of its exercise — Locke on children and education as the model of exclusion"
          - "James Mill's History of British India — inscrutability and the scale of civilization; Macaulay's Minute"
          - "J. S. Mill — the harm principle's 'civilized community' clause; Representative Government ch. XVIII: dependencies, 'a succession of absolute monarchs', why parliamentary responsibility fails for India"
          - "The 'strategies' thesis against the 'contradiction' thesis — and Stephen's gunpowder passage as the liberal who said it plainly"
        demo: null
        notes: "Mehta is the secondary spine; prefer the full read (source index 42) over the toc-only (1). Taught fairly: Mill's own reasons are given at full strength before the critique. Gandhi's ethical alternative (Mehta ch. 3) is a one-paragraph counterpoint."

      - slug: burke-against-hastings
        title: "Burke's impeachment of Warren Hastings: a conservative against empire"
        type: core
        status: planned
        goal: "Analyze Burke's case against Hastings — that arbitrary power cannot be held or given, and that an empire is a trust — and explain why the defender of inherited institutions became the prosecutor of British rule in Bengal"
        opening: "In February 1788 the House of Lords sits as a court to try the former Governor-General of Bengal, and the man who opens for the prosecution over four days is the same Edmund Burke who will defend the French monarchy two years later. He has to explain to English peers why the customs of Hindu and Muslim India deserve the protection of English law, and why 'the constitution of Asia is despotism' is no defence. The lesson follows the speech and asks how it fits the Reflections."
        est_minutes: 45
        prerequisites: [locke-and-mill-on-empire, burke-reflections]
        concepts:
          introduces: [empire-as-trust, geographical-morality]
          reinforces: [entailed-inheritance, natural-law, prejudice, strategies-of-exclusion, tutelage]
        key_ideas:
          - "Impeachment as 'the great circulation of responsibility'; a state in the disguise of a merchant; 'a commonwealth without a people'"
          - "Governing a people by their own principles — caste, custom, the praise of Hindu institutions; the six eras of Indian history"
          - "Hastings's defence quoted — despotism as the constitution of Asia — and the reply: 'law and arbitrary power are in eternal enmity'; Tamerlane's Institutes as proof that Asia had law"
          - "Bribery as system — the Munny Begum bribe, Debi Singh and Rungpore; why avarice is the basest form of arbitrary power"
          - "'I impeach him in the name of...'; the acquittal of 1795; the Reflections and the Hastings speech as one theory of inherited order (Mehta's reading)"
        demo: null
        notes: "The conservative against empire is the module's reversal seam: state the expectation (the defender of hierarchy should defend the conqueror), then the record. Objection: the Whig-imperial reading that Burke objected to the Company, not to empire. Short quotations; Burke is public domain."

      - slug: colonial-balance-sheet
        title: "The colonial balance sheet: the Case for Colonialism and its critics"
        type: core
        status: planned
        goal: "Evaluate the argument that colonialism was on balance beneficial and legitimate, the arguments against it, and the standards of evidence each side uses, as a contested claim with its history"
        opening: "In 2017 a political scientist published an article arguing that Western colonialism was, on an honest cost–benefit accounting, often beneficial and often locally legitimate, and that some form of it should return. Two petitions, fifteen board resignations and threats to the editor followed, and the article was withdrawn. The lesson reconstructs the argument as its author made it, the strongest replies, and what kind of evidence could settle the question."
        est_minutes: 45
        prerequisites: [burke-against-hastings]
        concepts:
          introduces: [cost-benefit-of-empire, subjective-legitimacy, counterfactual-development]
          reinforces: [empire-as-trust, tutelage, strategies-of-exclusion, geographical-morality]
        key_ideas:
          - "The three alleged failures of anti-colonial critique — no cost–benefit accounting, no test of subjective legitimacy, advocacy instead of scholarship"
          - "The counterfactual problem — compared to what (Ethiopia, Liberia, China); the Abernethy test; revealed preference (schools, hospitals, migration, collaborators)"
          - "The critics' replies — exploitation and underdevelopment (Rodney), violence (Amritsar, Herero, Mau Mau), the slave trade, divide and rule, the 'lazy citations' charge both ways"
          - "What the two sides agree on and what they measure differently — absolute levels vs comparative trends, railways against torture"
          - "The controversy as data — withdrawal, petitions, the 2022 Response — and what it shows about how such claims are adjudicated"
        demo: null
        notes: "Per the course brief: taught as an argument with its history and objections, never as settled. Both the article and the Response are in the dossier (source 7); the critics' pieces (Kendhammer, Klein, Khan, Taylor) are cited in the Response and named in the brief for the writer to obtain. Burke's Hastings speech is the backward Ref: an eighteenth-century conservative's cost–benefit."

      - slug: inherited-guilt-and-reparations
        title: "Inherited guilt and the supersession of historic injustice"
        type: core
        status: planned
        goal: "Analyze Waldron's argument that historic injustices can be superseded by changed circumstances and the opposed case for inherited guilt and reparation, and evaluate whether guilt can pass between generations"
        opening: "Land taken unjustly two centuries ago is now farmed by people who did nothing wrong, and the descendants of those it was taken from are still here. Must it be given back, must its value be paid, or has time changed what justice requires? Philosophers have argued all three, and the same question is asked about slavery, colonial rule and the Holocaust. The lesson follows the sharpest version of each answer."
        est_minutes: 45
        prerequisites: [colonial-balance-sheet]
        concepts:
          introduces: [rectification, supersession, hereditary-guilt]
          reinforces: [labour-theory-of-property, cost-benefit-of-empire, partnership-of-generations, dominium]
        key_ideas:
          - "Why judge the past at all — memory, identity, symbolic reparation"
          - "Nozickian rectification and the counterfactual method — the aunt's will, the trustee, the non-identity problem, the baseline problem"
          - "Continuing injustice vs the fading of rights — the stolen car, adverse possession; sacred land as the exception"
          - "Supersession — entitlements are circumstance-sensitive; the savanna water holes; a claim can lapse without ever having been wrong; the moral-hazard objection"
          - "Hereditary guilt — the 'tyranny of guilt' argument (Bruckner, Murray ch. 10) that guilt is mono-generational and selectively applied; Burke's partnership of generations as the counter-premise (if we inherit the glory, do we inherit the debt?)"
        demo: null
        notes: "Waldron is the analytic spine; the reparations case for slavery (Coates and others) is named in References as a position the writer should state fairly from the public record. Murray's ch. 10 and Scruton's forgiveness passage give the restrictionist frame; Miller ch. 7 (reparation and desert claims in admission) is the forward Ref."

      - slug: auditing-the-case-for-colonialism
        title: "Auditing the Case for Colonialism: three cited claims re-checked"
        type: core
        status: planned
        goal: "Apply the sourcing drill to three empirical claims in the Case for Colonialism and its critics — the slave-trade trust effect, colonial-era stature in Kenya, real wages in British Africa — by reading what the cited studies actually found"
        opening: "The article and its critics both cite peer-reviewed studies for their numbers: a 1–2 per cent share of variance here, a rise or fall in height or wages there. The studies exist and can be read. The lesson takes three of the claims, finds the cited paper, states what it measured, on what data, and whether the claim as made survives the comparison — the method of the module applied to its own material."
        est_minutes: 40
        prerequisites: [inherited-guilt-and-reparations]
        concepts:
          introduces: []
          reinforces: [cost-benefit-of-empire, counterfactual-development, subjective-legitimacy, supersession]
        key_ideas:
          - "The sourcing drill — author, date, data, what the study can and cannot establish — applied to a contested citation"
          - "Claim one — the slave trade and present-day trust (Nunn & Wantchekon): effect size, and what 'variance explained' does and does not mean"
          - "Claim two — stature in colonial Kenya (Moradi): comparative trends vs absolute levels, the standard both sides use selectively"
          - "Claim three — real wages in British Africa (Frankema & van Waijenburg): what the series shows and how both the article and the op-ed used it"
          - "What re-checking changes — which claims stand, which are overstated, and what remains a judgment the data cannot make"
        demo: null
        notes: "Module application (L16). The three papers are public (the brief gives full citations); Gilley's Response (source 7, 'Lazy Reflexive Citations') and the Kendhammer op-ed it dissects are the dossier anchors. Research-shaped by construction (E6d). Computation only inside source inquiry."

  # ---------------------------------------------------------------------
  - slug: nation-and-immigration
    title: "The nation, America's English inheritance and the stranger"
    outcomes: [co-reconstruct, co-objection, co-questions, co-apply, co-contested]
    lessons:
      - slug: the-nation-and-its-defenders
        title: "The nation and its defenders: Scruton, Miller and the pre-political loyalty"
        type: core
        status: planned
        goal: "Analyze the case that a nation is a pre-political loyalty to a place and a way of life, held in different forms by a conservative and a liberal nationalist, and distinguish it from nationalism"
        opening: "Before anyone can disagree about politics, they have to agree on who 'we' are — who gets to vote, whose law applies, whose children inherit. A conservative philosopher says this 'we' is a loyalty to a home that nobody chose; a liberal philosopher of the left says much the same about national identity and draws different conclusions. The lesson reconstructs the shared premise and the point where the two part."
        est_minutes: 45
        prerequisites: [scruton-meaning-of-conservatism, ortega-revolt-of-the-masses]
        concepts:
          introduces: [oikophilia, pre-political-loyalty, compatriot-partiality, associative-obligations]
          reinforces: [allegiance, nation-as-project, little-platoon, mores, civilizational-fault-line]
        key_ideas:
          - "Scruton — oikophilia, the territorial nation as the condition of opposition and of secular law; nation vs nationalism; 'to include is to exclude'"
          - "Miller — weak cosmopolitanism, compatriot partiality (the airport queue), associative obligations, the value of national identity for trust and the welfare state"
          - "Renan's daily plebiscite (recalled) against Scruton's unchosen home; Huntington's Anglo-Protestant core held for the American lessons that follow"
          - "Where conservative and liberal nationalist agree (a bounded people, self-determination) and where they part (what the bond is made of; culture vs institutions)"
        demo: null
        notes: "Opens the nation module. Leans on Scruton (How to Be a Conservative chs. 2–3, 7) and Miller ch. 2, 4. Who Are We? is now read in full and belongs to albions-seed-and-who-are-we. Prerequisites are knowledge prerequisites: Scruton's allegiance and Ortega's nation-as-project."

      - slug: federalist-one-people-and-the-extended-republic
        title: "The Federalist: one people and the extended republic"
        type: core
        status: planned
        goal: "Analyze the Federalist's argument that a large republic of representatives controls faction better than a small democracy, and its claim that Americans were already one people, and evaluate both against the critics of 1787 and since"
        opening: "Every political writer from Aristotle to Rousseau had said a republic must be small: citizens must know one another and meet in one place, or a faction or a tyrant takes over. In 1787 three Americans defending a new constitution argue the opposite — that only a large republic can be free, because there the factions are too many to combine. They also claim that Americans are already one people, descended from the same ancestors, speaking one language and holding one religion. The lesson follows both claims."
        est_minutes: 45
        prerequisites: [hume-against-the-original-contract, polybius-anacyclosis-and-rome, the-nation-and-its-defenders]
        concepts:
          introduces: [extended-republic, faction-madison]
          reinforces: [mixed-constitution, checks-and-balances, consent, government-founded-on-opinion]
        key_ideas:
          - "Federalist 2 (Jay): 'one united people' — ancestry, language, religion, principles of government"
          - "Federalist 10: faction and its two cures; why removing causes is worse than the disease; representation and the extended sphere"
          - "Federalist 39 and 51: a republic defined; ambition counteracting ambition; 'if men were angels'"
          - "Hume's opinion as the foundation of government (recalled; his 'Idea of a Perfect Commonwealth', not staged, as Madison's further source); the mixed constitution redesigned without estates"
          - "Objections: the Anti-Federalists (Brutus), Deneen's charge of political technology (forward); how much of Jay's 'one people' was true in 1787"
        demo: null
        notes: "Summary index 104 (Nos. 1, 2, 10, 39, 51). Placed in the nation module because Jay's 'one people' opens the American thread (Albion's Seed, Who Are We?). Public domain: quote and parse."

      - slug: albions-seed-and-who-are-we
        title: "Albion's Seed and Who Are We?: America's English inheritance"
        type: core
        status: planned
        goal: "Analyze Fischer's argument that four British folkways shaped American culture and Huntington's argument that an Anglo-Protestant core culture defines American identity, and evaluate the evidence and the objections"
        opening: "Fewer than a fifth of Americans today have British ancestors, yet their country's law, language, religion of the book and habits of self-government came from Britain. A historian in 1989 argues that four waves of migrants from four regions of seventeenth-century Britain brought four different ways of life that still divide the country; a political scientist in 2004 argues that a single Anglo-Protestant culture, not a creed anyone could adopt, made America what it is, and asks whether it will survive. The lesson follows both arguments and what they say about how a people is held together."
        est_minutes: 45
        prerequisites: [federalist-one-people-and-the-extended-republic]
        concepts:
          introduces: [folkways, anglo-protestant-core, american-creed]
          reinforces: [mores, pre-political-loyalty, oikophilia, daily-plebiscite]
        key_ideas:
          - "Fischer's four migrations — Puritans to Massachusetts, cavaliers and servants to Virginia, Quakers to the Delaware, borderers to the backcountry — and four ideas of liberty"
          - "Folkways as determinants: speech, building, family, rank, order, and their persistence in voting and violence"
          - "Huntington: settlers versus immigrants; the American Creed as a product of the Anglo-Protestant culture; the 'deconstructionist' challenge"
          - "The Mexican immigration chapter and its evidence; the choice he poses — cosmopolitan, imperial or national"
          - "Objections: ethnic-pluralist history, the Creed as self-standing, the evidence on Hispanic assimilation"
        demo: null
        notes: "Summary indices 54 (Albion's Seed) and 76 (Who Are We?, now read in full — earlier briefs said not obtained; correct that everywhere)."

      - slug: america-and-the-english-decline
        title: "America as England's heir: the decline thesis and its objections"
        type: core
        status: planned
        goal: "Evaluate the thesis that America's present condition continues England's own decline — that the heir inherited the disease with the estate — as an argument with its evidence and objections"
        opening: "Britain around 1920 ruled a quarter of the world; within fifty years it had given up its empire, its industrial lead and, said many of its own writers, its confidence. Some observers argue that the United States, built on English law, language and religion, is now following the same course, for the same reasons. Others say the comparison confuses a power with a civilization, and that America's problems are its own. The lesson lays out the thesis in its strongest form and puts the objections."
        est_minutes: 40
        prerequisites: [albions-seed-and-who-are-we, burnham-managers-and-the-suicide-of-the-west]
        concepts:
          introduces: [anglosphere-decline-thesis]
          reinforces: [anglo-protestant-core, folkways, culture-vs-civilization-spengler, liberalism-as-ideology-of-contraction, challenge-and-response]
        key_ideas:
          - "The English decline as its critics told it — empire, industry, the established Church, the elite's loss of confidence (Burnham, Scruton, Murray)"
          - "The inheritance thesis: the same Protestant individualism, the same liberal creed, the same managerial elite — and the forecast that follows"
          - "Spengler's and Toynbee's frames applied: one civilization's late phase, or a creative minority that stopped responding?"
          - "Objections: America's demography, religiosity and military power; decline talk as a constant of both countries' history"
          - "What evidence would decide it"
        demo: null
        notes: "Built from the dossier's statements of the thesis (Burnham index 70; Huntington 76; Murray 75; Scruton 44; Spengler 11; Toynbee 33; Lasch 62). Thin dossier for a single statement of the thesis: the brief must say so and assemble it from these, without inventing an author."

      - slug: powell-raspail-and-camus
        title: "Powell, Raspail and Camus: prophecies of displacement"
        type: core
        status: planned
        goal: "Analyze Powell's 1968 speech, Raspail's Camp of the Saints and Renaud Camus's 'great replacement' as arguments about immigration and the future of European peoples, and test their predictions against the demographic record"
        opening: "In April 1968 a Conservative shadow minister tells a Birmingham audience that a constituent has told him that in fifteen or twenty years the black man will have the whip hand over the white man, and that he sees the Tiber foaming with much blood. He is dismissed from the shadow cabinet the next day; London dockers march in his support. Five years later a French novelist imagines a million people from the Ganges landing on the Riviera and a France that will not stop them; in 2011 a French writer gives the fear a name. Each made a prediction that can now be checked. The lesson sets out each argument and checks it."
        est_minutes: 45
        prerequisites: [america-and-the-english-decline]
        concepts:
          introduces: [prophecy-of-displacement, replacement-as-argument]
          reinforces: [pre-political-loyalty, oikophilia, daily-plebiscite, nordicism]
        key_ideas:
          - "Powell's speech in its context — the Race Relations Bill, the 1968 Commonwealth Immigrants Act — its argument, its numbers and its forecast; the reaction"
          - "Raspail's novel (1973): the armada, the elite that will not defend, pity as the West's weakness; the 2011 preface's demographic claim"
          - "Camus's great replacement (2011): the claim, its vocabulary, its conspiratorial and non-conspiratorial readings"
          - "The record: ONS and INSEE data, Powell's numbers against the censuses, Raspail's and the 1985 Figaro forecasts against outcomes"
          - "What a demographic projection can and cannot say; the political uses of the term since 2011; the objection from integration data"
        demo: null
        notes: "Summary indices 109 (Powell with reception), 67 (Raspail, French; translate quotations), 77 (Camus). Takes over the replacement section previously planned in murray-strange-death-of-europe. Per the course brief: arguments with their history, evidence and the evidence against; no label in the course's voice."

      - slug: carens-open-borders
        title: "Carens: the case for open borders"
        type: core
        status: planned
        goal: "Analyze the argument that borders should generally be open from three liberal starting points, and the communitarian reply it answers"
        opening: "Borders have guards, and the guards have guns. A Mexican farm worker who crosses one is arrested; a Canadian philosopher asks by what right. He argues that whether you start from property rights, from a hypothetical contract among equals, or from the greatest good, you reach the same place — that citizenship in a rich country is the modern equivalent of feudal privilege. The lesson reconstructs all three routes and the strongest reply."
        est_minutes: 40
        prerequisites: [the-nation-and-its-defenders]
        concepts:
          introduces: [open-borders, global-original-position, citizenship-as-feudal-privilege]
          reinforces: [labour-theory-of-property, consent, harm-principle, compatriot-partiality, original-position]
        key_ideas:
          - "The Nozickian route — property rights protect the migrant and the employer, not 'our country'"
          - "The Rawlsian route — a global original position; free movement as a basic liberty; the public-order restriction and why it is narrow"
          - "The utilitarian route — aliens in the calculus"
          - "Walzer's communitarian challenge — neighbourhoods, clubs, families; Carens's replies and the paradox of liberal culture"
          - "What the argument concedes — nonideal theory, national security, the size of the demand — and what it refuses to concede"
        demo: null
        notes: "Taught at full strength as the liberal position. Rawls is recalled from rawls-theory-of-justice (Ref); the global original position is Carens's extension of it. Miller's and Murray's replies are the next lessons, not this one."

      - slug: miller-strangers-in-our-midst
        title: "Miller: the liberal-nationalist case for controlled borders"
        type: core
        status: planned
        goal: "Analyze Miller's argument that states may control membership on grounds of self-determination while owing refugees and migrants specific duties, and evaluate it against both open borders and restriction"
        opening: "Suppose everything Carens says about the moral equality of persons is true. Does it follow that a state may not choose who joins it? A philosopher who accepts the premise argues it does not: a people has an interest in deciding its own future, its public culture and the size of its demos, and that interest grounds a right to control admission — within limits set by what is owed to refugees and to those already inside. The lesson follows the argument to its policy shape."
        est_minutes: 45
        prerequisites: [carens-open-borders]
        concepts:
          introduces: [self-determination-over-membership, refugee-vs-economic-migrant, integration-civic-social-cultural]
          reinforces: [open-borders, compatriot-partiality, associative-obligations, oikophilia, mores]
        key_ideas:
          - "Why sovereignty is too quick — territorial jurisdiction and its three conditions; the park warden"
          - "Self-determination — public expenditure, the composition of the demos, trust and diversity; the private/public culture distinction"
          - "Refugees — the duty of rescue, who counts, how responsibility is acquired, burden-sharing; economic migrants — mutual advantage, fair terms, selection and its limits (no race or religion)"
          - "The rights of immigrants — time, membership, amnesty; integration contracts and citizenship tests; cultural integration and its limits"
          - "'Hard on the outside, soft on the inside' and the 2015 postscript — where the framework strains"
        demo: null
        notes: "Abizadeh's coercion objection and Carens's cantilever are the objections Miller answers; Murray's charge (next lesson) that this framework describes a state that no longer exists is the one he does not."

      - slug: murray-strange-death-of-europe
        title: "Murray's Strange Death of Europe: the restrictionist case"
        type: core
        status: planned
        goal: "Analyze the restrictionist argument that mass immigration combined with a loss of faith in Europe's own beliefs is changing Europe into something else, and evaluate its evidence and its objections"
        opening: "Two things happened to Europe at once, a British journalist argues: more people arrived in a shorter time than ever before, and the continent receiving them had stopped believing in its own story. Either alone might have been absorbed; together they cannot be. The lesson reconstructs the argument from the census figures and guest-worker schemes to the border crisis and the 'tyranny of guilt', and puts to it the replies from economics, demography and liberal theory."
        est_minutes: 45
        prerequisites: [miller-strangers-in-our-midst, powell-raspail-and-camus]
        concepts:
          introduces: [two-concatenations, bockenforde-dilemma]
          reinforces: [refugee-vs-economic-migrant, hereditary-guilt, integration-civic-social-cultural, mass-man, oikophilia, replacement-as-argument, liberalism-as-ideology-of-contraction]
        key_ideas:
          - "The two concatenations; the Ship of Theseus; what the 2001–2011 census change showed and how it was discussed"
          - "How Europe got 'hooked' — guest workers, 1997, the 'nation of immigrants' claim, the economic case and its arithmetic, 'nothing can be done'"
          - "Lampedusa to Lesbos — pull factors, the Dublin rules, 2015 — and the integration record from Rushdie to Cologne"
          - "The tyranny of guilt; the Böckenförde dilemma — can a secular state live on presuppositions it cannot guarantee; 'tiredness' and the East"
          - "Replacement recalled (Ref powell-raspail-and-camus): what Murray adds — the 'tiredness' thesis — and the demographic projections (ONS, Pew, Kaufmann) read for what they do and do not show"
        demo: null
        notes: "Per the course brief, replacement is taught as an argument with its history and objections, never as established; its history (Powell, Raspail, Camus, the 1985 Figaro cover) now has its own lesson. Prefer the clean full text (summary index 75) over the earlier read (50). Objections: Miller's framework, the economists' studies Murray himself cites, Kaufmann's mixed-population projections. Short quotations only (in copyright)."

      - slug: the-2015-crisis-read-three-ways
        title: "The 2015 migration crisis read against Carens, Miller and Murray"
        type: core
        status: planned
        goal: "Apply the three theories of membership to the recorded facts of the 2015 European migration crisis and judge what each would have prescribed, what each predicted, and where the event escapes all three"
        opening: "In 2015 about 1.3 million people applied for asylum in the European Union, most arriving by sea through Greece and Italy; Germany suspended the rule that sent them back to the first country they entered, Hungary built a fence, and a deal with Turkey closed the main route the next spring. Three theories in this module say what should have been done. The lesson sets them against what was done and what followed."
        est_minutes: 40
        prerequisites: [murray-strange-death-of-europe]
        concepts:
          introduces: []
          reinforces: [open-borders, self-determination-over-membership, refugee-vs-economic-migrant, two-concatenations, integration-civic-social-cultural, friend-enemy-distinction]
        key_ideas:
          - "The record — numbers, routes, decisions (25 and 31 August 2015, the fences, the March 2016 deal) and the aftermath (Cologne, the deportation gap, the 2017 elections)"
          - "Carens applied — what open borders would have required and the public-order restriction as the only brake"
          - "Miller applied — refugees vs economic migrants in a mixed flow, burden-sharing, the strain he admits in the postscript"
          - "Murray applied — the pull-factor claim, the Dublin collapse, the guilt frame; what his account predicts and what it omits"
          - "Where the event departs from all three — a decision made in a week by one government, enforcement that did not follow law, and a crisis ended by a treaty none of the theories contemplates"
        demo: null
        notes: "Module application (L16). Facts from Miller's Postscript (source 45) and Murray chs. 4–5, 11, 17 (summary index 75, the clean full text), cross-checked against Eurostat (the brief names the tables). Sourcing drill on two first-person testimonies (Murray's Lesbos interviews)."

  # ---------------------------------------------------------------------
  - slug: after-liberalism
    title: "After liberalism: the post-liberal right"
    outcomes: [co-reconstruct, co-objection, co-questions, co-apply]
    lessons:
      - slug: deneen-post-liberalism
        title: "Deneen's Why Liberalism Failed: the post-liberal critique"
        type: core
        status: planned
        goal: "Analyze Deneen's thesis that liberalism failed because it succeeded, and evaluate his answer to whether the West can survive on liberal principles alone"
        opening: "Liberalism promised freedom from arbitrary power, and delivered the largest states and most pervasive markets in history; it promised self-government, and delivered citizens who cannot name their representatives. A Notre Dame professor argues this is not betrayal but fulfilment: the theory's two premises — that we are free by nature and that nature is there to be mastered — produce exactly this. The lesson reconstructs the diagnosis and asks what he proposes instead."
        est_minutes: 45
        prerequisites: [the-2015-crisis-read-three-ways, macintyre-after-virtue]
        concepts:
          introduces: [liberal-anthropology, anticulture, liberalocracy, post-liberalism]
          reinforces: [state-of-nature, consent, harm-principle, soft-despotism, ethical-life, bockenforde-dilemma]
        key_ideas:
          - "Liberty before liberalism — self-rule and paideia; the three modern revolutions (Machiavelli, Hobbes/Descartes, Bacon); liberal voluntarism and the war against nature"
          - "State and market as a pincer; left and right as two liberalisms; Polanyi's 'laissez-faire was planned'"
          - "Anticulture — the destruction of nature, time and place; the cowbird; Tocqueville on the fractured chain of generations"
          - "Liberalocracy — the new aristocracy of the credentialed; Federalist 10 as political technology; the degradation of citizenship"
          - "After liberalism — no return, the end of ideology, practice before theory, the Benedict Option; objections (liberalism's achievements Deneen concedes; Fawcett's 'the right must accept the rules'; Scruton's 'truth in liberalism')"
        demo: null
        notes: "Opens the post-liberal module: the post-liberal position taught at full strength, then met — the liberal reply (Fawcett), the conservative reply (Scruton, Oakeshott — a disposition does not need a theory), and Strauss's warning about historicist diagnoses. MacIntyre's Benedict and Lasch's elites are the backward Refs; Hazony, Vermeule and de Benoist (next lessons) are the other post-liberal positions. Backward Refs through the whole course (Hobbes, Locke, Mill, Tocqueville, the Federalist)."

      - slug: hazony-virtue-of-nationalism
        title: "Hazony's Virtue of Nationalism: the order of national states against empire"
        type: core
        status: planned
        goal: "Analyze Hazony's argument that an order of independent national states is better than any universal order, including liberal internationalism, and evaluate it against the cosmopolitan and the liberal-nationalist alternatives"
        opening: "After 1945 nationalism was held responsible for two world wars, and the European Union, international courts and global markets were built to tame it. An Israeli political philosopher argues in 2018 that this gets history backwards: the wars were made by empires, and the liberal order that replaced them is one more empire, with a universal doctrine it imposes on peoples who never chose it. The lesson reconstructs the argument and puts it against the objections."
        est_minutes: 45
        prerequisites: [deneen-post-liberalism, renan-what-is-a-nation]
        concepts:
          introduces: [order-of-national-states, imperialism-of-universal-doctrine]
          reinforces: [pre-political-loyalty, pluriverse-of-states, daily-plebiscite, volk]
        key_ideas:
          - "Two visions of world order — national freedom or universal empire; the Hebrew Bible and the Protestant construction of the national state"
          - "The family, clan, tribe and nation as natural loyalties; the nation as cohesive tribes with a shared language and religion"
          - "Liberal internationalism and the EU as imperial projects; why Hitler was an imperialist, not a nationalist"
          - "The principles of the national state: no conquest for universal doctrine, minorities, a limited number of nations"
          - "Objections: the history of nationalist wars, the minority problem, the line between nation and empire"
        demo: null
        notes: "Summary index 85. In copyright: short quotations. Schmitt's pluriverse is the backward anchor."

      - slug: vermeule-common-good-constitutionalism
        title: "Vermeule's common-good constitutionalism: the classical legal tradition against liberal legalism"
        type: core
        status: planned
        goal: "Analyze Vermeule's argument that law should be read as an ordinance of reason directed to the common good rather than as a liberal charter of rights, and evaluate it against originalism and liberal constitutionalism"
        opening: "American judges argue about whether to read the Constitution by its original meaning or as a living document. A Harvard law professor argues in 2022 that both sides share one mistake: they treat law as the will of whoever enacted it, written to protect individuals from the state. Before 1900, he says, lawyers in the West understood law differently — as reason ordered to the common good — and that tradition still offers judges a way to read the text. The lesson follows the argument and its critics."
        est_minutes: 45
        prerequisites: [hazony-virtue-of-nationalism, aquinas-law-and-kingship]
        concepts:
          introduces: [common-good-constitutionalism, lex-and-ius]
          reinforces: [common-good, human-law-determination, natural-law, eternal-law]
        key_ideas:
          - "The classical legal tradition: Ulpian's precepts, Aquinas's definition of law, ius versus lex"
          - "The common good defined — justice, peace, abundance; solidarity and subsidiarity; not a sum of private goods"
          - "Determinatio: positive law specifying natural law; deference to administrators as rational"
          - "Against originalism and progressive living constitutionalism; the administrative state as a site of the common good"
          - "Objections: who determines the common good; the risk to dissenters; Burke's and Oakeshott's suspicion of rule by ends"
        demo: null
        notes: "Summary index 52. Aquinas's law lesson is the backward anchor for every term."

      - slug: de-benoist-european-new-right
        title: "De Benoist and the European New Right: ethnopluralism and metapolitics"
        type: core
        status: planned
        goal: "Analyze the European New Right's programme — metapolitics, ethnopluralism, the critique of liberalism and of the 'ideology of the Same' — as set out in the 1999 Manifesto, and evaluate it against both liberal and nationalist objections"
        opening: "In 1968 a group of young French writers on the right concluded that elections were lost before they were held, in the culture that told voters what to think, and that the left had understood this and the right had not. Thirty years later their founder publishes a manifesto that rejects nationalism, racism, liberalism and globalisation at once, and defends the right of every people to remain different. The lesson asks what such a programme rests on and whether it holds together."
        est_minutes: 40
        prerequisites: [vermeule-common-good-constitutionalism, evola-revolt-against-the-modern-world, herder-and-fichte-volk-and-nation]
        concepts:
          introduces: [metapolitics, ethnopluralism]
          reinforces: [plurality-of-cultures, primordial-tradition, conservative-revolution, order-of-national-states]
        key_ideas:
          - "Metapolitics: culture before power — the Gramscian strategy the movement adopted, as its own writings and its critics describe it"
          - "The Manifesto's diagnosis: modernity as individualism, massification, desacralisation, rationalisation, universalism"
          - "Ethnopluralism — the right to difference — against both assimilation and hierarchy; Herder recalled"
          - "Against the nation-state and for empire in the federal sense; against liberal market society; for subsidiarity and local democracy"
          - "Objections: ethnopluralism as separation by another name; the movement's lineage from the Conservative Revolution and Evola"
        demo: null
        notes: "Summary index 110 (Telos 115 translation). The lineage from Moeller and Evola rests on the movement's documented engagement with them and on echoes in the manifesto, which names neither; the manifesto itself does not use the words 'ethnopluralism' or 'Gramsci'."

      - slug: hungarys-fundamental-law
        title: "Hungary's Fundamental Law of 2011 read against the post-liberals"
        type: core
        status: planned
        goal: "Apply Deneen's, Hazony's and Vermeule's accounts of post-liberal government to the text and practice of Hungary's 2011 constitution and its amendments, and judge what the case shows about the theories"
        opening: "In April 2011 the Hungarian parliament adopts a new constitution that opens with a 'National Avowal': it praises the king who founded the state a thousand years ago, recognises the role of Christianity in preserving the nation and declares that the family and the nation are the principal frameworks of life together. Its amendments later define the family, restrict the courts and protect 'Christian culture'. Some Western post-liberals cite Hungary as a model; its critics cite it as a warning. The lesson reads the text against the module's theories."
        est_minutes: 40
        prerequisites: [de-benoist-european-new-right]
        concepts:
          introduces: []
          reinforces: [post-liberalism, order-of-national-states, common-good-constitutionalism, oikophilia, pre-political-loyalty]
        key_ideas:
          - "The text — the National Avowal, the articles on family, nation, religion and the courts — and the amendments (2013, 2018, 2020)"
          - "Deneen's post-liberal programme and Hazony's national state read against it"
          - "Vermeule's common good: the constitution as an ordinance for the common good"
          - "The objections: the Venice Commission's reports, the courts and media, the European Union's proceedings"
          - "Where the case departs from the theories: a constitution adopted by a two-thirds majority in one parliament"
        demo: null
        notes: "Module application (L16). The Fundamental Law is public (official English translation); the Venice Commission opinions are public. Not in the dossier: the brief names where to obtain them. The course takes no side; the text is read against both the theories and their critics."

      - slug: the-argument-assembled
        title: "The argument assembled: who should rule, is inequality natural, what holds a people together, why the West"
        type: synthesis
        status: planned
        goal: "Explain how each tradition the course has read answers its four questions — who should rule, whether inequality is natural, what holds a people together and why civilizations decline, and why the West — and judge which answers survived their objections"
        opening: "Twenty-four centuries of answers to four questions have gone past. The lesson lays them out as the chain of moves it was — each thinker answering the one before — and asks which answers were refuted, which were abandoned without refutation, and which are still standing in the arguments of the 2020s. It ends where the course's own problems remain open."
        est_minutes: 40
        prerequisites: [hungarys-fundamental-law]
        concepts:
          introduces: []
          reinforces: [philosopher-king, natural-slavery, mixed-constitution, two-cities, sovereignty, consent, entailed-inheritance, equality-of-conditions, ruling-class, friend-enemy-distinction, original-position, challenge-and-response, borrowing-into-system, hereditarian-hypothesis, oikophilia, post-liberalism]
        key_ideas:
          - "Who should rule — knowledge (Plato), nature and the middle (Aristotle), the mixed people (Polybius, Cicero, the Federalist), the sovereign (Bodin, Hobbes), consent (Locke), the general will (Rousseau), inheritance (Burke), the organized minority (Mosca, Michels), the decider (Schmitt), the disposition (Oakeshott)"
          - "Is inequality natural — Aristotle's ladder and its difficulty, Augustine's slavery by sin, Hobbes's equality of ability, Rousseau's artificial inequality, Maurras's protective inequality, Rawls's natural lottery, the envy charge and its reply, the hereditarian debate"
          - "What holds a people together and why it fails — a shared god, a shared way of life, a language, a descent, a shared enemy, a daily plebiscite, a contract; decline as organism, failed response, mixture, exhaustion"
          - "Why the West — the exceptionalist case and the chain-of-exchange thesis, with the borrowing ledger and the explanation debate as the evidence"
          - "What stays open — the Böckenförde question, and the reader's own position stated against the strongest objection to it"
        demo: null
        notes: "Synthesis (type: synthesis); no new material. Every claim is a Ref to the lesson that established it. Per the tone: no verdict handed down — the last exercise asks the reader to state their own position and its strongest objection."

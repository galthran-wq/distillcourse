<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .ink { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.6; font-size: 11.5px; }
    .faint { fill: currentColor; opacity: 0.3; }
    .title { fill: currentColor; font-weight: 600; font-size: 14px; }
    .line { stroke: currentColor; stroke-width: 1.4; fill: none; }
    .thin { stroke: currentColor; stroke-width: 1; fill: none; opacity: 0.5; }
    .guide { stroke: currentColor; stroke-width: 1; fill: none; opacity: 0.5; stroke-dasharray: 3 3; }
    .box { fill: none; stroke: currentColor; stroke-width: 1.2; }
    .ghost { fill: none; stroke: currentColor; stroke-width: 1.2; opacity: 0.3; }
    .ambbox { fill: #e2903a; fill-opacity: 0.12; stroke: #e2903a; stroke-width: 2; }
    .bluebox { fill: #4c8dd6; fill-opacity: 0.10; stroke: #4c8dd6; stroke-width: 1.5; }
    .amb { stroke: #e2903a; stroke-width: 2.2; fill: none; }
    .ambf { fill: #e2903a; }
    .ambt { fill: #e2903a; font-weight: 600; }
    .blue { stroke: #4c8dd6; stroke-width: 1.8; fill: none; }
    .bluef { fill: #4c8dd6; }
    .bluet { fill: #4c8dd6; font-weight: 600; }
    .dot { fill: currentColor; }
    .shade { fill: currentColor; opacity: 0.07; }
    .strike { stroke: currentColor; stroke-width: 1.6; opacity: 0.75; }
  </style>
  <text class="ambt" x="91" y="26" text-anchor="middle">state of mind</text>
  <rect class="ambbox" x="16" y="38" width="150" height="250" rx="5"/>
  <text class="ink" x="91" y="66" text-anchor="middle">I am treated</text>
  <text class="ink" x="91" y="84" text-anchor="middle">as less than I am</text>
  <text class="muted" x="91" y="118" text-anchor="middle">the inferior wants</text>
  <text class="muted" x="91" y="135" text-anchor="middle">to be equal;</text>
  <text class="muted" x="91" y="152" text-anchor="middle">the equal wants</text>
  <text class="muted" x="91" y="169" text-anchor="middle">to be superior</text>
  <text class="muted" x="91" y="214" text-anchor="middle">"may and may not</text>
  <text class="muted" x="91" y="231" text-anchor="middle">be just"</text>
  <text class="ink" x="91" y="268" text-anchor="middle" font-style="italic" font-size="12">standing</text>
  <path class="line" d="M 168.0 163.0 L 175.0 163.0"/>
  <path class="dot" d="M 184.0 163.0 L 175.0 167.5 L 175.0 158.5 Z"/>
  <text class="title" x="251" y="26" text-anchor="middle">motives</text>
  <rect class="box" x="186" y="38" width="130" height="250" rx="5"/>
  <text class="ink" x="251" y="70" text-anchor="middle">gain</text>
  <text class="ink" x="251" y="90" text-anchor="middle">honour</text>
  <text class="muted" x="251" y="124" text-anchor="middle">or escape from</text>
  <text class="ink" x="251" y="148" text-anchor="middle">loss</text>
  <text class="ink" x="251" y="168" text-anchor="middle">dishonour</text>
  <text class="ink" x="251" y="268" text-anchor="middle" font-style="italic" font-size="12">what is at stake</text>
  <path class="line" d="M 318.0 163.0 L 325.0 163.0"/>
  <path class="dot" d="M 334.0 163.0 L 325.0 167.5 L 325.0 158.5 Z"/>
  <text class="bluet" x="481" y="26" text-anchor="middle">occasions</text>
  <rect class="bluebox" x="336" y="38" width="290" height="250" rx="5"/>
  <text class="ink" x="346" y="62" text-anchor="start" font-size="12">insolence</text>
  <text class="muted" x="470" y="62" text-anchor="start" font-size="11">grasping magistrates</text>
  <text class="ink" x="346" y="85" text-anchor="start" font-size="12">fear</text>
  <text class="muted" x="470" y="85" text-anchor="start" font-size="11">Rhodes: lawsuits</text>
  <text class="ink" x="346" y="108" text-anchor="start" font-size="12">contempt</text>
  <text class="muted" x="470" y="108" text-anchor="start" font-size="11">Megara: disorder</text>
  <text class="ink" x="346" y="131" text-anchor="start" font-size="12">predominance</text>
  <text class="muted" x="470" y="131" text-anchor="start" font-size="11">hence ostracism</text>
  <text class="ink" x="346" y="154" text-anchor="start" font-size="12">growth</text>
  <text class="muted" x="470" y="154" text-anchor="start" font-size="11">Tarentum, Argos, Athens</text>
  <text class="ink" x="346" y="177" text-anchor="start" font-size="12">election intrigue</text>
  <text class="muted" x="470" y="177" text-anchor="start" font-size="11">Heraea</text>
  <text class="ink" x="346" y="200" text-anchor="start" font-size="12">carelessness</text>
  <text class="muted" x="470" y="200" text-anchor="start" font-size="11">Oreus</text>
  <text class="ink" x="346" y="223" text-anchor="start" font-size="12">small changes</text>
  <text class="muted" x="470" y="223" text-anchor="start" font-size="11">Ambracia, Thurii</text>
  <text class="ink" x="346" y="246" text-anchor="start" font-size="12">dissimilarity</text>
  <text class="muted" x="470" y="246" text-anchor="start" font-size="11">Sybaris; the Piraeus</text>
  <text class="ink" x="481" y="280" text-anchor="middle" font-style="italic" font-size="12">the moment</text>
  <text class="ambt" x="320" y="318" text-anchor="middle">the state of mind is necessary; the occasion only lights it</text>
</svg>

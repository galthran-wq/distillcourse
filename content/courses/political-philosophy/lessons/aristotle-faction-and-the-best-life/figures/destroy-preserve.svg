<svg viewBox="0 0 640 388" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .ink { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.6; font-size: 11.5px; }
    .faint { fill: currentColor; opacity: 0.3; }
    .title { fill: currentColor; font-weight: 600; font-size: 14px; }
    .line { stroke: currentColor; stroke-width: 1.4; fill: none; }
    .thin { stroke: currentColor; stroke-width: 1; fill: none; opacity: 0.5; }
    .guide { stroke: currentColor; stroke-width: 1; fill: none; opacity: 0.5; stroke-dasharray: 3 3; }
    .box { fill: none; stroke: currentColor; stroke-width: 1.2; }
    .ghost { fill: none; stroke: currentColor; stroke-width: 1.2; opacity: 0.3; }
    .ambbox { fill: #e2903a; fill-opacity: 0.12; stroke: #e2903a; stroke-width: 2; }
    .bluebox { fill: #4c8dd6; fill-opacity: 0.10; stroke: #4c8dd6; stroke-width: 1.5; }
    .amb { stroke: #e2903a; stroke-width: 2.2; fill: none; }
    .ambf { fill: #e2903a; }
    .ambt { fill: #e2903a; font-weight: 600; }
    .blue { stroke: #4c8dd6; stroke-width: 1.8; fill: none; }
    .bluef { fill: #4c8dd6; }
    .bluet { fill: #4c8dd6; font-weight: 600; }
    .dot { fill: currentColor; }
    .shade { fill: currentColor; opacity: 0.07; }
    .strike { stroke: currentColor; stroke-width: 1.6; opacity: 0.75; }
  </style>
  <text class="bluet" x="150" y="24" text-anchor="middle">what destroys</text>
  <text class="ambt" x="475" y="24" text-anchor="middle">reversed: what preserves</text>
  <rect class="bluebox" x="20" y="40" width="260" height="26" rx="4"/>
  <text class="ink" x="150" y="57" text-anchor="middle" font-size="12">small breaches, unnoticed</text>
  <path class="line" d="M 284.0 53.0 L 317.0 53.0"/>
  <path class="dot" d="M 326.0 53.0 L 317.0 57.5 L 317.0 48.5 Z"/>
  <rect class="box" x="330" y="40" width="290" height="26" rx="4"/>
  <text class="ink" x="475" y="57" text-anchor="middle" font-size="12">guard against small lawbreaking</text>
  <rect class="bluebox" x="20" y="74" width="260" height="26" rx="4"/>
  <text class="ink" x="150" y="91" text-anchor="middle" font-size="12">devices to deceive the people</text>
  <path class="line" d="M 284.0 87.0 L 317.0 87.0"/>
  <path class="dot" d="M 326.0 87.0 L 317.0 91.5 L 317.0 82.5 Z"/>
  <rect class="box" x="330" y="74" width="290" height="26" rx="4"/>
  <text class="ink" x="475" y="91" text-anchor="middle" font-size="12">no tricks: they are "useless"</text>
  <rect class="bluebox" x="20" y="108" width="260" height="26" rx="4"/>
  <text class="ink" x="150" y="125" text-anchor="middle" font-size="12">the excluded maltreated</text>
  <path class="line" d="M 284.0 121.0 L 317.0 121.0"/>
  <path class="dot" d="M 326.0 121.0 L 317.0 125.5 L 317.0 116.5 Z"/>
  <rect class="box" x="330" y="108" width="290" height="26" rx="4"/>
  <text class="ink" x="475" y="125" text-anchor="middle" font-size="12">bring their leading spirits in</text>
  <rect class="bluebox" x="20" y="142" width="260" height="26" rx="4"/>
  <text class="ink" x="150" y="159" text-anchor="middle" font-size="12">one man grown too great</text>
  <path class="line" d="M 284.0 155.0 L 317.0 155.0"/>
  <path class="dot" d="M 326.0 155.0 L 317.0 159.5 L 317.0 150.5 Z"/>
  <rect class="box" x="330" y="142" width="290" height="26" rx="4"/>
  <text class="ink" x="475" y="159" text-anchor="middle" font-size="12">short tenures, moderate honours</text>
  <rect class="bluebox" x="20" y="176" width="260" height="26" rx="4"/>
  <text class="ink" x="150" y="193" text-anchor="middle" font-size="12">carelessness</text>
  <path class="line" d="M 284.0 189.0 L 317.0 189.0"/>
  <path class="dot" d="M 326.0 189.0 L 317.0 193.5 L 317.0 184.5 Z"/>
  <rect class="box" x="330" y="176" width="290" height="26" rx="4"/>
  <text class="ink" x="475" y="193" text-anchor="middle" font-size="12">"night sentinels": bring dangers near</text>
  <rect class="bluebox" x="20" y="210" width="260" height="26" rx="4"/>
  <text class="ink" x="150" y="227" text-anchor="middle" font-size="12">wealth outgrowing the census</text>
  <path class="line" d="M 284.0 223.0 L 317.0 223.0"/>
  <path class="dot" d="M 326.0 223.0 L 317.0 227.5 L 317.0 218.5 Z"/>
  <rect class="box" x="330" y="210" width="290" height="26" rx="4"/>
  <text class="ink" x="475" y="227" text-anchor="middle" font-size="12">review the qualification</text>
  <rect class="bluebox" x="20" y="244" width="260" height="26" rx="4"/>
  <text class="ink" x="150" y="261" text-anchor="middle" font-size="12">magistrates making money</text>
  <path class="line" d="M 284.0 257.0 L 317.0 257.0"/>
  <path class="dot" d="M 326.0 257.0 L 317.0 261.5 L 317.0 252.5 Z"/>
  <rect class="box" x="330" y="244" width="290" height="26" rx="4"/>
  <text class="ink" x="475" y="261" text-anchor="middle" font-size="12">office unprofitable, public accounts</text>
  <rect class="bluebox" x="20" y="278" width="260" height="26" rx="4"/>
  <text class="ink" x="150" y="295" text-anchor="middle" font-size="12">the principle pushed to excess</text>
  <path class="line" d="M 284.0 291.0 L 317.0 291.0"/>
  <path class="dot" d="M 326.0 291.0 L 317.0 295.5 L 317.0 286.5 Z"/>
  <rect class="box" x="330" y="278" width="290" height="26" rx="4"/>
  <text class="ink" x="475" y="295" text-anchor="middle" font-size="12">spare the other class (the nose)</text>
  <rect class="ghost" x="20" y="318" width="260" height="26" rx="4"/>
  <text class="muted" x="150" y="335" text-anchor="middle">(no single cause)</text>
  <rect class="ambbox" x="330" y="318" width="290" height="26" rx="4"/>
  <text class="ambt" x="475" y="335" text-anchor="middle" font-size="12">education in the spirit of the constitution</text>
  <text class="ink" x="320" y="374" text-anchor="middle" font-style="italic">"opposites produce opposites"</text>
</svg>

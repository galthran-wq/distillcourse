<svg viewBox="0 0 640 262" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .ink { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.6; font-size: 11.5px; }
    .faint { fill: currentColor; opacity: 0.3; }
    .title { fill: currentColor; font-weight: 600; font-size: 14px; }
    .line { stroke: currentColor; stroke-width: 1.4; fill: none; }
    .thin { stroke: currentColor; stroke-width: 1; fill: none; opacity: 0.5; }
    .guide { stroke: currentColor; stroke-width: 1; fill: none; opacity: 0.5; stroke-dasharray: 3 3; }
    .box { fill: none; stroke: currentColor; stroke-width: 1.2; }
    .ghost { fill: none; stroke: currentColor; stroke-width: 1.2; opacity: 0.3; }
    .ambbox { fill: #e2903a; fill-opacity: 0.12; stroke: #e2903a; stroke-width: 2; }
    .bluebox { fill: #4c8dd6; fill-opacity: 0.10; stroke: #4c8dd6; stroke-width: 1.5; }
    .amb { stroke: #e2903a; stroke-width: 2.2; fill: none; }
    .ambf { fill: #e2903a; }
    .ambt { fill: #e2903a; font-weight: 600; }
    .blue { stroke: #4c8dd6; stroke-width: 1.8; fill: none; }
    .bluef { fill: #4c8dd6; }
    .bluet { fill: #4c8dd6; font-weight: 600; }
    .dot { fill: currentColor; }
    .shade { fill: currentColor; opacity: 0.07; }
    .strike { stroke: currentColor; stroke-width: 1.6; opacity: 0.75; }
  </style>
  <text class="title" x="150" y="24" text-anchor="middle">a body grown out of proportion</text>
  <circle class="ghost" cx="70" cy="70" r="10"/>
  <rect class="box" x="56" y="82" width="28" height="40" rx="4"/>
  <path class="line" d="M 63 122 L 63 158"/>
  <path class="line" d="M 77 122 L 77 158"/>
  <path class="line" d="M 63 158 L 55 158"/>
  <path class="line" d="M 77 158 L 85 158"/>
  <text class="muted" x="70" y="182" text-anchor="middle">in proportion</text>
  <circle class="ghost" cx="170" cy="70" r="10"/>
  <rect class="box" x="156" y="82" width="28" height="40" rx="4"/>
  <path class="line" d="M 163 122 L 163 158"/>
  <path class="line" d="M 177 122 L 177 158"/>
  <rect class="ambbox" x="177" y="154" width="110" height="8" rx="2"/>
  <text class="ink" x="225" y="182" text-anchor="middle" font-size="12">"a foot four cubits long and</text>
  <text class="ink" x="225" y="198" text-anchor="middle" font-size="12">the rest of the body two spans"</text>
  <path class="guide" d="M 320 40 L 320 230"/>
  <text class="title" x="480" y="24" text-anchor="middle">a city after a war on land</text>
  <text class="ambt" x="430" y="48" text-anchor="middle" font-size="12">notables</text>
  <text class="bluet" x="512" y="48" text-anchor="middle" font-size="12">the people</text>
  <text class="muted" x="390" y="70" text-anchor="end">before</text>
  <rect class="ambf" x="400" y="56" width="60" height="20" rx="2" opacity="0.8"/>
  <rect class="bluef" x="460" y="56" width="100" height="20" rx="2" opacity="0.55"/>
  <text class="muted" x="390" y="104" text-anchor="end">after</text>
  <rect class="ambf" x="400" y="90" width="20" height="20" rx="2" opacity="0.8"/>
  <rect class="bluef" x="420" y="90" width="100" height="20" rx="2" opacity="0.55"/>
  <text class="muted" x="518" y="105" text-anchor="start" font-size="11">the people come in</text>
  <text class="ink" x="340" y="158" text-anchor="start" font-size="12">Tarentum</text>
  <text class="muted" x="410" y="158" text-anchor="start" font-size="11">notables killed by the Iapygians</text>
  <text class="ink" x="340" y="180" text-anchor="start" font-size="12">Argos</text>
  <text class="muted" x="410" y="180" text-anchor="start" font-size="11">army destroyed by Cleomenes</text>
  <text class="ink" x="340" y="202" text-anchor="start" font-size="12">Athens</text>
  <text class="muted" x="410" y="202" text-anchor="start" font-size="11">hoplites lost, Peloponnesian War</text>
  <text class="muted" x="320" y="248" text-anchor="middle" font-size="12">no law is changed; the proportions the constitution was made for have changed</text>
</svg>

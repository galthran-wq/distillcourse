<svg viewBox="0 0 640 262" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .ink { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.6; font-size: 11.5px; }
    .faint { fill: currentColor; opacity: 0.3; }
    .title { fill: currentColor; font-weight: 600; font-size: 14px; }
    .line { stroke: currentColor; stroke-width: 1.4; fill: none; }
    .thin { stroke: currentColor; stroke-width: 1; fill: none; opacity: 0.5; }
    .guide { stroke: currentColor; stroke-width: 1; fill: none; opacity: 0.5; stroke-dasharray: 3 3; }
    .box { fill: none; stroke: currentColor; stroke-width: 1.2; }
    .ghost { fill: none; stroke: currentColor; stroke-width: 1.2; opacity: 0.3; }
    .ambbox { fill: #e2903a; fill-opacity: 0.12; stroke: #e2903a; stroke-width: 2; }
    .bluebox { fill: #4c8dd6; fill-opacity: 0.10; stroke: #4c8dd6; stroke-width: 1.5; }
    .amb { stroke: #e2903a; stroke-width: 2.2; fill: none; }
    .ambf { fill: #e2903a; }
    .ambt { fill: #e2903a; font-weight: 600; }
    .blue { stroke: #4c8dd6; stroke-width: 1.8; fill: none; }
    .bluef { fill: #4c8dd6; }
    .bluet { fill: #4c8dd6; font-weight: 600; }
    .dot { fill: currentColor; }
    .shade { fill: currentColor; opacity: 0.07; }
    .strike { stroke: currentColor; stroke-width: 1.6; opacity: 0.75; }
  </style>
  <text class="title" x="320" y="24" text-anchor="middle">a city trained for war: Sparta, Crete</text>
  <text class="ink" x="160" y="69" text-anchor="middle">war</text>
  <text class="ink" x="480" y="69" text-anchor="middle">peace</text>
  <path class="blue" d="M 410.0 64.0 L 234.0 64.0"/>
  <path class="bluef" d="M 225.0 64.0 L 234.0 59.5 L 234.0 68.5 Z"/>
  <text class="ink" x="160" y="111" text-anchor="middle">business</text>
  <text class="ink" x="480" y="111" text-anchor="middle">leisure</text>
  <path class="blue" d="M 410.0 106.0 L 234.0 106.0"/>
  <path class="bluef" d="M 225.0 106.0 L 234.0 101.5 L 234.0 110.5 Z"/>
  <text class="ink" x="160" y="153" text-anchor="middle">the necessary</text>
  <text class="ink" x="480" y="153" text-anchor="middle">the honourable</text>
  <path class="blue" d="M 410.0 148.0 L 234.0 148.0"/>
  <path class="bluef" d="M 225.0 148.0 L 234.0 143.5 L 234.0 152.5 Z"/>
  <rect class="box" x="40" y="196" width="560" height="52" rx="6"/>
  <rect class="faint" x="56" y="212" width="90" height="18" rx="2"/>
  <circle class="ambf" cx="70" cy="216" r="2.5" opacity="0.8"/>
  <circle class="ambf" cx="92" cy="226" r="2.5" opacity="0.8"/>
  <circle class="ambf" cx="110" cy="214" r="2.5" opacity="0.8"/>
  <circle class="ambf" cx="128" cy="224" r="2.5" opacity="0.8"/>
  <circle class="ambf" cx="140" cy="218" r="2.5" opacity="0.8"/>
  <text class="ink" x="160" y="218" text-anchor="start" font-size="12">empire won → safe only while at war →</text>
  <text class="ambt" x="160" y="236" text-anchor="start" font-size="12">"like unused iron they lose their temper in time of peace"</text>
</svg>

<svg viewBox="0 0 640 352" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .ink { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.6; font-size: 11.5px; }
    .faint { fill: currentColor; opacity: 0.3; }
    .title { fill: currentColor; font-weight: 600; font-size: 14px; }
    .line { stroke: currentColor; stroke-width: 1.4; fill: none; }
    .thin { stroke: currentColor; stroke-width: 1; fill: none; opacity: 0.5; }
    .guide { stroke: currentColor; stroke-width: 1; fill: none; opacity: 0.5; stroke-dasharray: 3 3; }
    .box { fill: none; stroke: currentColor; stroke-width: 1.2; }
    .ghost { fill: none; stroke: currentColor; stroke-width: 1.2; opacity: 0.3; }
    .ambbox { fill: #e2903a; fill-opacity: 0.12; stroke: #e2903a; stroke-width: 2; }
    .bluebox { fill: #4c8dd6; fill-opacity: 0.10; stroke: #4c8dd6; stroke-width: 1.5; }
    .amb { stroke: #e2903a; stroke-width: 2.2; fill: none; }
    .ambf { fill: #e2903a; }
    .ambt { fill: #e2903a; font-weight: 600; }
    .blue { stroke: #4c8dd6; stroke-width: 1.8; fill: none; }
    .bluef { fill: #4c8dd6; }
    .bluet { fill: #4c8dd6; font-weight: 600; }
    .dot { fill: currentColor; }
    .shade { fill: currentColor; opacity: 0.07; }
    .strike { stroke: currentColor; stroke-width: 1.6; opacity: 0.75; }
  </style>
  <circle class="amb" cx="200" cy="170" r="146"/>
  <text class="ambt" x="200" y="74" text-anchor="middle">the city</text>
  <text class="muted" x="200" y="90" text-anchor="middle">those who share in the best life</text>
  <circle class="dot" cx="110" cy="120" r="4"/>
  <text class="ink" x="124" y="124" text-anchor="start" font-size="12">young:</text>
  <text class="ink" x="178" y="124" text-anchor="start" font-size="12">warriors</text>
  <circle class="dot" cx="110" cy="150" r="5"/>
  <text class="ink" x="124" y="154" text-anchor="start" font-size="12">older:</text>
  <text class="ink" x="178" y="154" text-anchor="start" font-size="12">councillors and judges</text>
  <circle class="dot" cx="110" cy="180" r="6"/>
  <text class="ink" x="124" y="184" text-anchor="start" font-size="12">oldest:</text>
  <text class="ink" x="178" y="184" text-anchor="start" font-size="12">priests</text>
  <text class="muted" x="200" y="222" text-anchor="middle">the same men, by age</text>
  <rect class="shade" x="120" y="232" width="160" height="30" rx="4"/>
  <text class="ink" x="200" y="252" text-anchor="middle" font-size="12">the land: owned by citizens</text>
  <rect class="bluebox" x="410" y="60" width="214" height="66" rx="5"/>
  <text class="bluet" x="422" y="80" text-anchor="start">farmers</text>
  <text class="ink" x="422" y="98" text-anchor="start" font-size="11.5">slaves or barbarian perioeci,</text>
  <text class="ink" x="422" y="114" text-anchor="start" font-size="11.5">"not spirited", not of one race</text>
  <path class="line" d="M 406.0 93.0 L 359.0 93.0"/>
  <path class="dot" d="M 350.0 93.0 L 359.0 88.5 L 359.0 97.5 Z"/>
  <rect class="bluebox" x="410" y="146" width="214" height="66" rx="5"/>
  <text class="bluet" x="422" y="166" text-anchor="start">craftsmen</text>
  <text class="ink" x="422" y="184" text-anchor="start" font-size="11.5">"a life ignoble and</text>
  <text class="ink" x="422" y="200" text-anchor="start" font-size="11.5">inimical to virtue"</text>
  <path class="line" d="M 406.0 179.0 L 359.0 179.0"/>
  <path class="dot" d="M 350.0 179.0 L 359.0 174.5 L 359.0 183.5 Z"/>
  <rect class="bluebox" x="410" y="232" width="214" height="66" rx="5"/>
  <text class="bluet" x="422" y="252" text-anchor="start">labourers</text>
  <text class="ink" x="422" y="270" text-anchor="start" font-size="11.5">necessary to the city,</text>
  <text class="ink" x="422" y="286" text-anchor="start" font-size="11.5">not part of it</text>
  <path class="line" d="M 406.0 265.0 L 359.0 265.0"/>
  <path class="dot" d="M 350.0 265.0 L 359.0 260.5 L 359.0 269.5 Z"/>
  <text class="bluet" x="380" y="320" text-anchor="middle">conditions, not parts</text>
  <text class="muted" x="320" y="340" text-anchor="middle" font-size="12">"happy in regard to all its citizens": the workers are not citizens</text>
</svg>

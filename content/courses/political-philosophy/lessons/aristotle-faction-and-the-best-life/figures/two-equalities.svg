<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .ink { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.6; font-size: 11.5px; }
    .title { fill: currentColor; font-weight: 600; font-size: 14px; }
    .box { fill: none; stroke: currentColor; stroke-width: 1; opacity: 0.35; }
    .rich { fill: #e2903a; opacity: 0.8; }
    .poor { fill: #4c8dd6; opacity: 0.7; }
    .ambt { fill: #e2903a; font-weight: 600; }
    .bluet { fill: #4c8dd6; font-weight: 600; }
  </style>
  <text class="ink" x="320" y="22" text-anchor="middle">1,000 citizens: <tspan class="ambt">100 rich</tspan>, 10 units of land each; <tspan class="bluet">900 poor</tspan>, 1 unit each</text>

  <!-- left panel: numerical -->
  <rect class="box" x="20" y="38" width="290" height="246" rx="5"/>
  <text class="title" x="165" y="62" text-anchor="middle">one citizen, one vote</text>
  <text class="muted" x="165" y="78" text-anchor="middle">numerical equality</text>

  <text class="ink" x="45" y="106">say in the assembly</text>
  <rect class="rich" x="45" y="114" width="24" height="20"/>
  <rect class="poor" x="69" y="114" width="216" height="20"/>
  <text class="muted" x="45" y="150">rich 1/10</text>
  <text class="muted" x="285" y="150" text-anchor="end">poor 9/10</text>

  <text class="ink" x="45" y="178">land</text>
  <rect class="rich" x="45" y="186" width="126" height="20"/>
  <rect class="poor" x="171" y="186" width="114" height="20"/>
  <text class="muted" x="45" y="222">rich 1,000 of 1,900</text>
  <text class="muted" x="285" y="222" text-anchor="end">poor 900</text>

  <text class="ambt" x="165" y="252" text-anchor="middle">the rich: over half the land,</text>
  <text class="ambt" x="165" y="270" text-anchor="middle">a tenth of the say</text>

  <!-- right panel: proportional -->
  <rect class="box" x="330" y="38" width="290" height="246" rx="5"/>
  <text class="title" x="475" y="62" text-anchor="middle">shares by property</text>
  <text class="muted" x="475" y="78" text-anchor="middle">proportional equality</text>

  <text class="ink" x="355" y="106">say in the assembly</text>
  <rect class="rich" x="355" y="114" width="126" height="20"/>
  <rect class="poor" x="481" y="114" width="114" height="20"/>
  <text class="muted" x="355" y="150">rich 1,000/1,900</text>
  <text class="muted" x="595" y="150" text-anchor="end">poor 900/1,900</text>

  <text class="ink" x="355" y="178">free citizens</text>
  <rect class="rich" x="355" y="186" width="24" height="20"/>
  <rect class="poor" x="379" y="186" width="216" height="20"/>
  <text class="muted" x="355" y="222">rich 100</text>
  <text class="muted" x="595" y="222" text-anchor="end">poor 900</text>

  <text class="bluet" x="475" y="252" text-anchor="middle">the poor: nine in ten of the free,</text>
  <text class="bluet" x="475" y="270" text-anchor="middle">under half the say</text>
</svg>

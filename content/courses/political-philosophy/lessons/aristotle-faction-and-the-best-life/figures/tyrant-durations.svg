<svg viewBox="0 0 640 256" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .ink { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.6; font-size: 11.5px; }
    .faint { fill: currentColor; opacity: 0.3; }
    .title { fill: currentColor; font-weight: 600; font-size: 14px; }
    .line { stroke: currentColor; stroke-width: 1.4; fill: none; }
    .thin { stroke: currentColor; stroke-width: 1; fill: none; opacity: 0.5; }
    .guide { stroke: currentColor; stroke-width: 1; fill: none; opacity: 0.5; stroke-dasharray: 3 3; }
    .box { fill: none; stroke: currentColor; stroke-width: 1.2; }
    .ghost { fill: none; stroke: currentColor; stroke-width: 1.2; opacity: 0.3; }
    .ambbox { fill: #e2903a; fill-opacity: 0.12; stroke: #e2903a; stroke-width: 2; }
    .bluebox { fill: #4c8dd6; fill-opacity: 0.10; stroke: #4c8dd6; stroke-width: 1.5; }
    .amb { stroke: #e2903a; stroke-width: 2.2; fill: none; }
    .ambf { fill: #e2903a; }
    .ambt { fill: #e2903a; font-weight: 600; }
    .blue { stroke: #4c8dd6; stroke-width: 1.8; fill: none; }
    .bluef { fill: #4c8dd6; }
    .bluet { fill: #4c8dd6; font-weight: 600; }
    .dot { fill: currentColor; }
    .shade { fill: currentColor; opacity: 0.07; }
    .strike { stroke: currentColor; stroke-width: 1.6; opacity: 0.75; }
  </style>
  <text class="title" x="320" y="22" text-anchor="middle">years of rule: the four longest tyrannies Aristotle knew</text>
  <path class="guide" d="M 230.0 40 L 230.0 206"/>
  <text class="muted" x="230.0" y="222" text-anchor="middle">0</text>
  <path class="guide" d="M 325.0 40 L 325.0 206"/>
  <text class="muted" x="325.0" y="222" text-anchor="middle">25</text>
  <path class="guide" d="M 420.0 40 L 420.0 206"/>
  <text class="muted" x="420.0" y="222" text-anchor="middle">50</text>
  <path class="guide" d="M 515.0 40 L 515.0 206"/>
  <text class="muted" x="515.0" y="222" text-anchor="middle">75</text>
  <path class="guide" d="M 610.0 40 L 610.0 206"/>
  <text class="muted" x="610.0" y="222" text-anchor="middle">100</text>
  <text class="ink" x="220" y="67" text-anchor="end" font-size="12">Orthagoras and sons, Sicyon</text>
  <rect class="ambf" x="230" y="52" width="380.0" height="20" rx="2" opacity="0.7"/>
  <text class="ink" x="238" y="67" text-anchor="start" font-size="11">moderation; laws observed</text>
  <text class="ink" x="604.0" y="67" text-anchor="end" font-size="11">100</text>
  <text class="ink" x="220" y="107" text-anchor="end" font-size="12">the Cypselids, Corinth</text>
  <rect class="bluef" x="230" y="92" width="279.3" height="20" rx="2" opacity="0.7"/>
  <text class="ink" x="238" y="107" text-anchor="start" font-size="11">Cypselus had no bodyguard</text>
  <text class="muted" x="517.3" y="107" text-anchor="start">73½</text>
  <text class="ink" x="220" y="147" text-anchor="end" font-size="12">the Peisistratids, Athens</text>
  <rect class="bluef" x="230" y="132" width="64.6" height="20" rx="2" opacity="0.6"/>
  <rect class="bluef" x="297.6" y="132" width="68.4" height="20" rx="2" opacity="0.4"/>
  <text class="muted" x="375.0" y="147" text-anchor="start" font-size="11">35: Peisistratus 17, his sons 18</text>
  <text class="ink" x="220" y="187" text-anchor="end" font-size="12">Gelo and Hiero, Syracuse</text>
  <rect class="bluef" x="230" y="172" width="68.4" height="20" rx="2" opacity="0.7"/>
  <text class="muted" x="306.4" y="187" text-anchor="start">18</text>
  <text class="muted" x="320" y="244" text-anchor="middle" font-size="12">"no forms of government are so short-lived as oligarchy and tyranny"</text>
</svg>

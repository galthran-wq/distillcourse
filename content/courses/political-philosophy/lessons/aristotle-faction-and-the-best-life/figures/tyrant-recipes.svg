<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .ink { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.6; font-size: 11.5px; }
    .faint { fill: currentColor; opacity: 0.3; }
    .title { fill: currentColor; font-weight: 600; font-size: 14px; }
    .line { stroke: currentColor; stroke-width: 1.4; fill: none; }
    .thin { stroke: currentColor; stroke-width: 1; fill: none; opacity: 0.5; }
    .guide { stroke: currentColor; stroke-width: 1; fill: none; opacity: 0.5; stroke-dasharray: 3 3; }
    .box { fill: none; stroke: currentColor; stroke-width: 1.2; }
    .ghost { fill: none; stroke: currentColor; stroke-width: 1.2; opacity: 0.3; }
    .ambbox { fill: #e2903a; fill-opacity: 0.12; stroke: #e2903a; stroke-width: 2; }
    .bluebox { fill: #4c8dd6; fill-opacity: 0.10; stroke: #4c8dd6; stroke-width: 1.5; }
    .amb { stroke: #e2903a; stroke-width: 2.2; fill: none; }
    .ambf { fill: #e2903a; }
    .ambt { fill: #e2903a; font-weight: 600; }
    .blue { stroke: #4c8dd6; stroke-width: 1.8; fill: none; }
    .bluef { fill: #4c8dd6; }
    .bluet { fill: #4c8dd6; font-weight: 600; }
    .dot { fill: currentColor; }
    .shade { fill: currentColor; opacity: 0.07; }
    .strike { stroke: currentColor; stroke-width: 1.6; opacity: 0.75; }
  </style>
  <rect class="shade" x="20" y="34" width="600" height="30" rx="4"/>
  <text class="ink" x="320" y="54" text-anchor="middle">common to both: keep the power to rule against their will</text>
  <text class="bluet" x="165" y="92" text-anchor="middle">the traditional way</text>
  <text class="muted" x="165" y="110" text-anchor="middle">humble, distrust, disable</text>
  <rect class="bluebox" x="20" y="120" width="290" height="180" rx="5"/>
  <text class="ink" x="36" y="146" text-anchor="start" font-size="12">kill men of spirit</text>
  <text class="ink" x="36" y="172" text-anchor="start" font-size="12">no common meals, clubs or schools</text>
  <text class="ink" x="36" y="198" text-anchor="start" font-size="12">spies: Syracuse's "female detectives"</text>
  <text class="ink" x="36" y="224" text-anchor="start" font-size="12">set friends and classes against each other</text>
  <text class="ink" x="36" y="250" text-anchor="start" font-size="12">keep them poor: great works, taxes</text>
  <text class="ink" x="36" y="276" text-anchor="start" font-size="12">make war, so they need a leader</text>
  <text class="ambt" x="475" y="92" text-anchor="middle">playing the king</text>
  <text class="muted" x="475" y="110" text-anchor="middle">"steward of the public rather than a tyrant"</text>
  <rect class="ambbox" x="330" y="120" width="290" height="180" rx="5"/>
  <text class="ink" x="346" y="146" text-anchor="start" font-size="12">keep and show the public accounts</text>
  <text class="ink" x="346" y="172" text-anchor="start" font-size="12">no outrage; punish through the courts</text>
  <text class="ink" x="346" y="198" text-anchor="start" font-size="12">temperate, wide awake, a soldier</text>
  <text class="ink" x="346" y="224" text-anchor="start" font-size="12">visibly earnest in serving the gods</text>
  <text class="ink" x="346" y="250" text-anchor="start" font-size="12">honour men of merit</text>
  <text class="ink" x="346" y="276" text-anchor="start" font-size="12">protect rich and poor from each other</text>
  <text class="ambt" x="320" y="326" text-anchor="middle" font-size="12">"half virtuous, half wicked": rules better men, lasts longer</text>
</svg>

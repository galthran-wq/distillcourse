<svg viewBox="0 0 640 268" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .ink { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .faint { fill: currentColor; opacity: 0.3; }
    .title { fill: currentColor; font-weight: 600; font-size: 14px; }
    .line { stroke: currentColor; stroke-width: 1.4; fill: none; }
    .thin { stroke: currentColor; stroke-width: 1; fill: none; opacity: 0.5; }
    .guide { stroke: currentColor; stroke-width: 1; fill: none; opacity: 0.5; stroke-dasharray: 3 3; }
    .box { fill: none; stroke: currentColor; stroke-width: 1.2; }
    .ghostbox { fill: none; stroke: currentColor; stroke-width: 1.2; opacity: 0.3; stroke-dasharray: 3 3; }
    .ambbox { fill: #e2903a; fill-opacity: 0.12; stroke: #e2903a; stroke-width: 2; }
    .ambdash { fill: none; stroke: #e2903a; stroke-width: 2; stroke-dasharray: 6 4; }
    .bluebox { fill: #4c8dd6; fill-opacity: 0.10; stroke: #4c8dd6; stroke-width: 1.5; }
    .amb { stroke: #e2903a; stroke-width: 2.2; fill: none; }
    .ambf { fill: #e2903a; }
    .ambt { fill: #e2903a; font-weight: 600; }
    .blue { stroke: #4c8dd6; stroke-width: 1.8; fill: none; }
    .bluef { fill: #4c8dd6; }
    .bluet { fill: #4c8dd6; font-weight: 600; }
    .dot { fill: currentColor; }
    .shade { fill: currentColor; opacity: 0.06; }
  </style>
  <text class="title" x="320" y="22" text-anchor="middle">Politics VII.7: character by region</text>
  <text class="muted" x="40" y="46" text-anchor="start">north and west</text>
  <text class="muted" x="600" y="46" text-anchor="end">east</text>
  <rect class="box" x="30" y="60" width="190" height="112" rx="4"/>
  <text class="title" x="125" y="82" text-anchor="middle" font-size="13">Europe, the cold lands</text>
  <text class="ink" x="125" y="104" text-anchor="middle" font-size="12">full of spirit,</text>
  <text class="ink" x="125" y="120" text-anchor="middle" font-size="12">wanting intelligence and skill</text>
  <text class="muted" x="125" y="146" text-anchor="middle" font-size="11">free, but no political</text>
  <text class="muted" x="125" y="160" text-anchor="middle" font-size="11">organization; rule no one</text>
  <rect class="box" x="420" y="60" width="190" height="112" rx="4"/>
  <text class="title" x="515" y="82" text-anchor="middle" font-size="13">Asia</text>
  <text class="ink" x="515" y="104" text-anchor="middle" font-size="12">intelligent and inventive,</text>
  <text class="ink" x="515" y="120" text-anchor="middle" font-size="12">wanting spirit</text>
  <text class="muted" x="515" y="146" text-anchor="middle" font-size="11">“always in a state of</text>
  <text class="muted" x="515" y="160" text-anchor="middle" font-size="11">subjection and slavery”</text>
  <rect class="ambbox" x="232" y="110" width="176" height="112" rx="4"/>
  <text class="ambt" x="320" y="132" text-anchor="middle" font-size="13">Hellas, between</text>
  <text class="ink" x="320" y="154" text-anchor="middle" font-size="12">high-spirited</text>
  <text class="ink" x="320" y="170" text-anchor="middle" font-size="12">and also intelligent</text>
  <text class="ink" x="320" y="194" text-anchor="middle" font-size="11">free, best-governed;</text>
  <text class="ink" x="320" y="208" text-anchor="middle" font-size="11">one state could rule the world</text>
  <text class="bluet" x="320" y="252" text-anchor="middle" font-size="12">the same text adds: among the Greek peoples too, some are one-sided</text>
</svg>

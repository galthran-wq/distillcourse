<svg viewBox="0 0 640 244" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .ink { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .faint { fill: currentColor; opacity: 0.3; }
    .title { fill: currentColor; font-weight: 600; font-size: 14px; }
    .line { stroke: currentColor; stroke-width: 1.4; fill: none; }
    .thin { stroke: currentColor; stroke-width: 1; fill: none; opacity: 0.5; }
    .guide { stroke: currentColor; stroke-width: 1; fill: none; opacity: 0.5; stroke-dasharray: 3 3; }
    .box { fill: none; stroke: currentColor; stroke-width: 1.2; }
    .ghostbox { fill: none; stroke: currentColor; stroke-width: 1.2; opacity: 0.3; stroke-dasharray: 3 3; }
    .ambbox { fill: #e2903a; fill-opacity: 0.12; stroke: #e2903a; stroke-width: 2; }
    .ambdash { fill: none; stroke: #e2903a; stroke-width: 2; stroke-dasharray: 6 4; }
    .bluebox { fill: #4c8dd6; fill-opacity: 0.10; stroke: #4c8dd6; stroke-width: 1.5; }
    .amb { stroke: #e2903a; stroke-width: 2.2; fill: none; }
    .ambf { fill: #e2903a; }
    .ambt { fill: #e2903a; font-weight: 600; }
    .blue { stroke: #4c8dd6; stroke-width: 1.8; fill: none; }
    .bluef { fill: #4c8dd6; }
    .bluet { fill: #4c8dd6; font-weight: 600; }
    .dot { fill: currentColor; }
    .shade { fill: currentColor; opacity: 0.06; }
  </style>
  <text class="title" x="320" y="22" text-anchor="middle">the end limits the means</text>
  <rect class="box" x="30" y="40" width="280" height="190" rx="6"/>
  <text class="title" x="170" y="64" text-anchor="middle">medicine</text>
  <text class="muted" x="50" y="96" text-anchor="start">end:</text>
  <text class="ink" x="94" y="96" text-anchor="start">health</text>
  <text class="ink" x="94" y="114" text-anchor="start" font-size="12">pursued without limit</text>
  <text class="muted" x="50" y="156" text-anchor="start">means:</text>
  <text class="ink" x="104" y="156" text-anchor="start" font-size="12">drugs, diet, surgery</text>
  <text class="ink" x="170" y="198" text-anchor="middle" font-size="12">as much as health needs</text>
  <text class="ink" x="170" y="214" text-anchor="middle" font-size="12">the end is the limit</text>
  <rect class="ambbox" x="330" y="40" width="280" height="190" rx="6"/>
  <text class="ambt" x="470" y="64" text-anchor="middle">money-making</text>
  <text class="muted" x="350" y="96" text-anchor="start">end:</text>
  <text class="ambt" x="394" y="96" text-anchor="start">money</text>
  <text class="ink" x="394" y="114" text-anchor="start" font-size="12">pursued without limit</text>
  <text class="muted" x="350" y="156" text-anchor="start">means:</text>
  <text class="ambt" x="404" y="156" text-anchor="start" font-size="12">every art: courage,</text>
  <text class="ambt" x="404" y="172" text-anchor="start" font-size="12">generalship, medicine</text>
  <text class="ambt" x="470" y="198" text-anchor="middle" font-size="12">no end beyond money</text>
  <text class="ambt" x="470" y="214" text-anchor="middle" font-size="12">to stop them: unlimited</text>
</svg>

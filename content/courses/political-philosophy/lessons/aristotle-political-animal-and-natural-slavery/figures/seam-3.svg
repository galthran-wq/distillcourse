<svg viewBox="0 0 640 296" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .ink { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .faint { fill: currentColor; opacity: 0.3; }
    .title { fill: currentColor; font-weight: 600; font-size: 14px; }
    .line { stroke: currentColor; stroke-width: 1.4; fill: none; }
    .thin { stroke: currentColor; stroke-width: 1; fill: none; opacity: 0.5; }
    .guide { stroke: currentColor; stroke-width: 1; fill: none; opacity: 0.5; stroke-dasharray: 3 3; }
    .box { fill: none; stroke: currentColor; stroke-width: 1.2; }
    .ghostbox { fill: none; stroke: currentColor; stroke-width: 1.2; opacity: 0.3; stroke-dasharray: 3 3; }
    .ambbox { fill: #e2903a; fill-opacity: 0.12; stroke: #e2903a; stroke-width: 2; }
    .ambdash { fill: none; stroke: #e2903a; stroke-width: 2; stroke-dasharray: 6 4; }
    .bluebox { fill: #4c8dd6; fill-opacity: 0.10; stroke: #4c8dd6; stroke-width: 1.5; }
    .amb { stroke: #e2903a; stroke-width: 2.2; fill: none; }
    .ambf { fill: #e2903a; }
    .ambt { fill: #e2903a; font-weight: 600; }
    .blue { stroke: #4c8dd6; stroke-width: 1.8; fill: none; }
    .bluef { fill: #4c8dd6; }
    .bluet { fill: #4c8dd6; font-weight: 600; }
    .dot { fill: currentColor; }
    .shade { fill: currentColor; opacity: 0.06; }
  </style>
  <rect class="ambbox" x="120" y="14" width="400" height="50" rx="4"/>
  <text class="ambt" x="320" y="35" text-anchor="middle">a slave by nature</text>
  <text class="ink" x="320" y="54" text-anchor="middle" font-size="12">can be another’s; apprehends reason without having it</text>
  <text class="muted" x="320" y="82" text-anchor="middle">by what mark would anyone know him?</text>
  <path class="thin" d="M 95 96 L 554 96 M 320 88 L 320 96"/>
  <path class="thin" d="M 95.0 96 L 95.0 106"/>
  <rect class="bluebox" x="20" y="106" width="150" height="104" rx="4"/>
  <text class="bluet" x="95.0" y="128" text-anchor="middle" font-size="13">body</text>
  <text class="faint" x="95.0" y="150" text-anchor="middle" font-size="11">strong, built for labour</text>
  <path class="blue" d="M 32 146 L 158 146"/>
  <text class="ink" x="95.0" y="178" text-anchor="middle" font-size="11">“the opposite often</text>
  <text class="ink" x="95.0" y="194" text-anchor="middle" font-size="11">happens”</text>
  <path class="thin" d="M 248.0 96 L 248.0 106"/>
  <rect class="bluebox" x="173" y="106" width="150" height="104" rx="4"/>
  <text class="bluet" x="248.0" y="128" text-anchor="middle" font-size="13">soul</text>
  <text class="faint" x="248.0" y="150" text-anchor="middle" font-size="11">hears reason, lacks it</text>
  <path class="blue" d="M 185 146 L 311 146"/>
  <text class="ink" x="248.0" y="178" text-anchor="middle" font-size="11">“the beauty of the soul</text>
  <text class="ink" x="248.0" y="194" text-anchor="middle" font-size="11">is not seen”</text>
  <path class="thin" d="M 401.0 96 L 401.0 106"/>
  <rect class="box" x="326" y="106" width="150" height="104" rx="4"/>
  <text class="title" x="401.0" y="128" text-anchor="middle" font-size="13">capture in war</text>
  <text class="ink" x="401.0" y="150" text-anchor="middle" font-size="11">taken and sold</text>
  <text class="muted" x="401.0" y="186" text-anchor="middle">the mark?</text>
  <path class="thin" d="M 554.0 96 L 554.0 106"/>
  <rect class="box" x="479" y="106" width="150" height="104" rx="4"/>
  <text class="title" x="554.0" y="128" text-anchor="middle" font-size="13">birth</text>
  <text class="ink" x="554.0" y="150" text-anchor="middle" font-size="11">born of slaves</text>
  <text class="muted" x="554.0" y="186" text-anchor="middle">the mark?</text>
</svg>

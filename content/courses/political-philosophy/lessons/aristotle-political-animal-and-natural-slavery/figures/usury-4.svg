<svg viewBox="0 0 640 220" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .ink { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .faint { fill: currentColor; opacity: 0.3; }
    .title { fill: currentColor; font-weight: 600; font-size: 14px; }
    .line { stroke: currentColor; stroke-width: 1.4; fill: none; }
    .thin { stroke: currentColor; stroke-width: 1; fill: none; opacity: 0.5; }
    .guide { stroke: currentColor; stroke-width: 1; fill: none; opacity: 0.5; stroke-dasharray: 3 3; }
    .box { fill: none; stroke: currentColor; stroke-width: 1.2; }
    .ghostbox { fill: none; stroke: currentColor; stroke-width: 1.2; opacity: 0.3; stroke-dasharray: 3 3; }
    .ambbox { fill: #e2903a; fill-opacity: 0.12; stroke: #e2903a; stroke-width: 2; }
    .ambdash { fill: none; stroke: #e2903a; stroke-width: 2; stroke-dasharray: 6 4; }
    .bluebox { fill: #4c8dd6; fill-opacity: 0.10; stroke: #4c8dd6; stroke-width: 1.5; }
    .amb { stroke: #e2903a; stroke-width: 2.2; fill: none; }
    .ambf { fill: #e2903a; }
    .ambt { fill: #e2903a; font-weight: 600; }
    .blue { stroke: #4c8dd6; stroke-width: 1.8; fill: none; }
    .bluef { fill: #4c8dd6; }
    .bluet { fill: #4c8dd6; font-weight: 600; }
    .dot { fill: currentColor; }
    .shade { fill: currentColor; opacity: 0.06; }
  </style>
  <text class="ambt" x="40" y="32" text-anchor="start">no end beyond money itself: no limit</text>
  <rect class="box" x="40" y="80" width="120" height="56" rx="4"/>
  <text class="ink" x="100" y="113" text-anchor="middle">shoe</text>
  <rect class="bluebox" x="270" y="80" width="100" height="56" rx="4"/>
  <text class="bluet" x="320" y="113" text-anchor="middle">coin</text>
  <rect class="ambbox" x="480" y="70" width="120" height="76" rx="4"/>
  <text class="ambt" x="540" y="104" text-anchor="middle">more coin</text>
  <text class="ambt" x="540" y="124" text-anchor="middle" font-size="12">… and more</text>
  <path class="amb" d="M 374.0 108.0 L 468.0 108.0"/>
  <path class="ambf" d="M 476.0 108.0 L 468.0 112.0 L 468.0 104.0 Z"/>
  <text class="ambt" x="320" y="172" text-anchor="middle" font-size="12">retail for profit, then usury:</text>
  <text class="ambt" x="320" y="190" text-anchor="middle" font-size="12">“the birth of money from money” (tokos, offspring)</text>
  <path class="guide" d="M 164 108 L 266 108"/>
</svg>

<svg viewBox="0 0 640 316" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .ink { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .title { fill: currentColor; font-weight: 600; font-size: 14px; }
    .line { stroke: currentColor; stroke-width: 1.4; fill: none; }
    .guide { stroke: currentColor; stroke-width: 1; fill: none; opacity: 0.5; stroke-dasharray: 3 3; }
    .box { fill: none; stroke: currentColor; stroke-width: 1.2; }
    .ghostbox { fill: none; stroke: currentColor; stroke-width: 1.2; opacity: 0.45; stroke-dasharray: 3 3; }
    .ambbox { fill: #e2903a; fill-opacity: 0.12; stroke: #e2903a; stroke-width: 2; }
    .amb { stroke: #e2903a; stroke-width: 3; fill: none; }
    .ambt { fill: #e2903a; font-weight: 600; }
    .bluet { fill: #4c8dd6; font-weight: 600; }
  </style>
  <text class="title" x="320" y="22" text-anchor="middle">where the argument breaks</text>

  <rect class="box" x="30" y="40" width="270" height="62" rx="6"/>
  <text class="title" x="165" y="66" text-anchor="middle">premise: people differ in ability</text>
  <text class="bluet" x="165" y="88" text-anchor="middle" font-size="12">stands: the verdict does not touch it</text>

  <line class="line" x1="165" y1="102" x2="165" y2="200"/>
  <path class="line" d="M159 192 L165 202 L171 192"/>
  <text class="ink" x="175" y="132" font-size="12">step: so this man may justly</text>
  <text class="ink" x="175" y="148" font-size="12">be mastered by that one</text>
  <path class="amb" d="M150 160 L180 184 M180 160 L150 184"/>

  <line class="guide" x1="186" y1="172" x2="350" y2="172"/>
  <rect class="ghostbox" x="350" y="150" width="270" height="150" rx="6"/>
  <text class="title" x="364" y="174">the step needs a mark:</text>
  <text class="ink" x="364" y="194" font-size="12">this slave lacks the deliberative part,</text>
  <text class="ink" x="364" y="210" font-size="12">this master has it</text>
  <text class="ambt" x="364" y="236" font-size="12">Book I: no body, soul, capture</text>
  <text class="ambt" x="364" y="252" font-size="12">or birth shows it</text>
  <text class="ambt" x="364" y="274" font-size="12">Books III, VII: every people</text>
  <text class="ambt" x="364" y="290" font-size="12">holds both kinds</text>

  <rect class="ambbox" x="30" y="206" width="270" height="62" rx="6"/>
  <text class="title" x="165" y="232" text-anchor="middle">mastery over any given man</text>
  <text class="ambt" x="165" y="254" text-anchor="middle" font-size="12">rests on "merely law and force" (I.6)</text>
</svg>

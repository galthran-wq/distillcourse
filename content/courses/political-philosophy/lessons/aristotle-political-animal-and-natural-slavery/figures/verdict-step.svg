<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .ink { fill: currentColor; }
    .title { fill: currentColor; font-weight: 600; font-size: 14px; }
    .line { stroke: currentColor; stroke-width: 1.4; fill: none; }
    .box { fill: none; stroke: currentColor; stroke-width: 1.2; }
    .ghostbox { fill: none; stroke: currentColor; stroke-width: 1.2; opacity: 0.45; stroke-dasharray: 3 3; }
    .bluebox { fill: #4c8dd6; fill-opacity: 0.08; stroke: #4c8dd6; stroke-width: 2; }
    .blue { stroke: #4c8dd6; stroke-width: 2; fill: none; }
    .ambbox { fill: #e2903a; fill-opacity: 0.12; stroke: #e2903a; stroke-width: 2; }
    .amb { stroke: #e2903a; stroke-width: 3; fill: none; }
    .ambt { fill: #e2903a; font-weight: 600; }
    .bluet { fill: #4c8dd6; font-weight: 600; }
  </style>
  <text class="title" x="360" y="22" text-anchor="middle">what unequal capacity can ground</text>

  <rect class="box" x="210" y="40" width="300" height="62" rx="6"/>
  <text class="title" x="360" y="66" text-anchor="middle">premise: people differ in the</text>
  <text class="title" x="360" y="84" text-anchor="middle">capacity to lead, partly by birth</text>
  <text class="bluet" x="520" y="76" font-size="12">strong</text>

  <line class="blue" x1="290" y1="102" x2="185" y2="192"/>
  <path class="blue" d="M185 180 L183 194 L196 189"/>

  <line class="line" x1="430" y1="102" x2="535" y2="192"/>
  <path class="line" d="M524 189 L537 194 L535 180"/>
  <path class="amb" d="M470 134 L496 158 M496 134 L470 158"/>
  <text class="ambt" x="506" y="132" font-size="12">needs a mark</text>
  <text class="ambt" x="506" y="148" font-size="12">the theory lacks</text>

  <rect class="bluebox" x="20" y="198" width="320" height="108" rx="6"/>
  <text class="title" x="180" y="222" text-anchor="middle">so the more capable may hold office</text>
  <text class="title" x="180" y="240" text-anchor="middle">among equals, in turn and removably</text>
  <text class="ink" x="180" y="258" text-anchor="middle" font-size="12">(political rule)</text>
  <text class="bluet" x="180" y="282" text-anchor="middle" font-size="12">common ground; holds where</text>
  <text class="bluet" x="180" y="298" text-anchor="middle" font-size="12">office is contested and removable</text>

  <rect class="ambbox" x="380" y="198" width="320" height="108" rx="6"/>
  <text class="title" x="540" y="222" text-anchor="middle">so this man may own that one</text>
  <text class="ink" x="540" y="240" text-anchor="middle" font-size="12">(despotic rule)</text>
  <text class="ambt" x="540" y="270" text-anchor="middle" font-size="12">every actual case rests on</text>
  <text class="ambt" x="540" y="286" text-anchor="middle" font-size="12">"merely law and force" (I.6)</text>

  <rect class="ghostbox" x="380" y="324" width="320" height="80" rx="6"/>
  <text class="ink" x="392" y="348" font-size="12">why no mark:</text>
  <text class="ambt" x="392" y="368" font-size="12">Book I: body, soul, capture, birth all fail</text>
  <text class="ambt" x="392" y="388" font-size="12">Books III, VII: each people holds both kinds</text>
</svg>

<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .ink { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .faint { fill: currentColor; opacity: 0.3; }
    .title { fill: currentColor; font-weight: 600; font-size: 14px; }
    .line { stroke: currentColor; stroke-width: 1.4; fill: none; }
    .thin { stroke: currentColor; stroke-width: 1; fill: none; opacity: 0.5; }
    .guide { stroke: currentColor; stroke-width: 1; fill: none; opacity: 0.5; stroke-dasharray: 3 3; }
    .box { fill: none; stroke: currentColor; stroke-width: 1.2; }
    .ghostbox { fill: none; stroke: currentColor; stroke-width: 1.2; opacity: 0.3; stroke-dasharray: 3 3; }
    .ambbox { fill: #e2903a; fill-opacity: 0.12; stroke: #e2903a; stroke-width: 2; }
    .ambdash { fill: none; stroke: #e2903a; stroke-width: 2; stroke-dasharray: 6 4; }
    .bluebox { fill: #4c8dd6; fill-opacity: 0.10; stroke: #4c8dd6; stroke-width: 1.5; }
    .amb { stroke: #e2903a; stroke-width: 2.2; fill: none; }
    .ambf { fill: #e2903a; }
    .ambt { fill: #e2903a; font-weight: 600; }
    .blue { stroke: #4c8dd6; stroke-width: 1.8; fill: none; }
    .bluef { fill: #4c8dd6; }
    .bluet { fill: #4c8dd6; font-weight: 600; }
    .dot { fill: currentColor; }
    .shade { fill: currentColor; opacity: 0.06; }
  </style>
  <text class="title" x="160" y="28" text-anchor="middle">other animals: bees, herds</text>
  <text class="title" x="480" y="28" text-anchor="middle">man</text>
  <rect class="box" x="70" y="48" width="180" height="44" rx="4"/>
  <text class="ink" x="160" y="75" text-anchor="middle">voice</text>
  <path class="line" d="M 160.0 92.0 L 160.0 120.0"/>
  <path class="dot" d="M 160.0 128.0 L 156.0 120.0 L 164.0 120.0 Z"/>
  <rect class="box" x="70" y="130" width="180" height="44" rx="4"/>
  <text class="ink" x="160" y="157" text-anchor="middle">pleasure and pain</text>
  <text class="muted" x="160" y="200" text-anchor="middle">signalled to one another,</text>
  <text class="muted" x="160" y="216" text-anchor="middle">“and no further”</text>
  <rect class="ambbox" x="390" y="48" width="180" height="44" rx="4"/>
  <text class="ambt" x="480" y="75" text-anchor="middle">speech (logos)</text>
  <path class="amb" d="M 480.0 92.0 L 480.0 120.0"/>
  <path class="ambf" d="M 480.0 128.0 L 476.0 120.0 L 484.0 120.0 Z"/>
  <rect class="ambbox" x="370" y="130" width="220" height="60" rx="4"/>
  <text class="ink" x="480" y="154" text-anchor="middle" font-size="12">the expedient and inexpedient,</text>
  <text class="ambt" x="480" y="174" text-anchor="middle" font-size="12">the just and the unjust</text>
  <path class="amb" d="M 480.0 190.0 L 480.0 218.0"/>
  <path class="ambf" d="M 480.0 226.0 L 476.0 218.0 L 484.0 218.0 Z"/>
  <text class="ambt" x="480" y="246" text-anchor="middle">a shared sense of the just</text>
  <text class="ambt" x="480" y="264" text-anchor="middle">makes a household and a city</text>
  <path class="guide" d="M 320 40 L 320 270"/>
</svg>

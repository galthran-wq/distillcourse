<svg viewBox="0 0 640 304" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .ink { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.6; font-size: 12px; }
    .title { fill: currentColor; font-weight: 600; font-size: 14px; }
    .line { stroke: currentColor; stroke-width: 1.4; fill: none; }
    .guide { stroke: currentColor; stroke-width: 1; fill: none; opacity: 0.5; stroke-dasharray: 3 3; }
    .box { fill: none; stroke: currentColor; stroke-width: 1.2; }
    .ambbox { fill: #e2903a; fill-opacity: 0.12; stroke: #e2903a; stroke-width: 2; }
    .bluebox { fill: #4c8dd6; fill-opacity: 0.10; stroke: #4c8dd6; stroke-width: 1.5; }
    .amb { stroke: #e2903a; stroke-width: 2.2; fill: none; }
    .ambf { fill: #e2903a; }
    .ambt { fill: #e2903a; font-weight: 600; }
    .blue { stroke: #4c8dd6; stroke-width: 1.8; fill: none; }
    .bluef { fill: #4c8dd6; }
    .bluet { fill: #4c8dd6; font-weight: 600; }
    .dot { fill: currentColor; }
    .faint { fill: currentColor; opacity: 0.3; }
    .shade { fill: currentColor; opacity: 0.07; }
    .strike { stroke: currentColor; stroke-width: 1.4; opacity: 0.7; }
  </style>
  <text class="title" x="150" y="26" text-anchor="middle">a dinner from a single purse</text>
  <ellipse class="box" cx="150" cy="86" rx="70" ry="26"/>
  <text class="muted" x="150" y="91" text-anchor="middle">one cook's dish</text>
  <circle class="dot" cx="150" cy="134" r="6"/>
  <text class="muted" x="150" y="156" text-anchor="middle">one cook</text>
  <path class="guide" d="M 320 14 L 320 170"/>
  <text class="ambt" x="480" y="26" text-anchor="middle">a feast to which many contribute</text>
  <rect class="ambbox" x="390" y="66" width="180" height="44" rx="4"/>
  <circle class="box" cx="405" cy="88" r="7"/>
  <circle class="box" cx="424" cy="88" r="7"/>
  <circle class="box" cx="443" cy="88" r="7"/>
  <circle class="box" cx="462" cy="88" r="7"/>
  <circle class="box" cx="481" cy="88" r="7"/>
  <circle class="box" cx="500" cy="88" r="7"/>
  <circle class="box" cx="519" cy="88" r="7"/>
  <circle class="box" cx="538" cy="88" r="7"/>
  <circle class="box" cx="557" cy="88" r="7"/>
  <circle class="dot" cx="405" cy="54" r="4"/>
  <circle class="dot" cx="405" cy="122" r="4"/>
  <circle class="dot" cx="424" cy="54" r="4"/>
  <circle class="dot" cx="424" cy="122" r="4"/>
  <circle class="dot" cx="443" cy="54" r="4"/>
  <circle class="dot" cx="443" cy="122" r="4"/>
  <circle class="dot" cx="462" cy="54" r="4"/>
  <circle class="dot" cx="462" cy="122" r="4"/>
  <circle class="dot" cx="481" cy="54" r="4"/>
  <circle class="dot" cx="481" cy="122" r="4"/>
  <circle class="dot" cx="500" cy="54" r="4"/>
  <circle class="dot" cx="500" cy="122" r="4"/>
  <circle class="dot" cx="519" cy="54" r="4"/>
  <circle class="dot" cx="519" cy="122" r="4"/>
  <circle class="dot" cx="538" cy="54" r="4"/>
  <circle class="dot" cx="538" cy="122" r="4"/>
  <circle class="dot" cx="557" cy="54" r="4"/>
  <circle class="dot" cx="557" cy="122" r="4"/>
  <text class="muted" x="480" y="146" text-anchor="middle">each guest brings a dish</text>
  <path class="guide" d="M 14 176 L 626 176"/>
  <text class="title" x="110" y="202" text-anchor="middle">the house</text>
  <text class="ink" x="65" y="226" text-anchor="middle">builder</text>
  <text class="ambt" x="155" y="226" text-anchor="middle">user</text>
  <text class="muted" x="65" y="244" text-anchor="middle">makes it</text>
  <text class="ambt" x="155" y="244" text-anchor="middle" font-size="12">judges it better</text>
  <text class="title" x="320" y="202" text-anchor="middle">the rudder</text>
  <text class="ink" x="275" y="226" text-anchor="middle">carpenter</text>
  <text class="ambt" x="365" y="226" text-anchor="middle">pilot</text>
  <text class="muted" x="275" y="244" text-anchor="middle">makes it</text>
  <text class="ambt" x="365" y="244" text-anchor="middle" font-size="12">judges it better</text>
  <text class="title" x="530" y="202" text-anchor="middle">the feast</text>
  <text class="ink" x="485" y="226" text-anchor="middle">cook</text>
  <text class="ambt" x="575" y="226" text-anchor="middle">guest</text>
  <text class="muted" x="485" y="244" text-anchor="middle">makes it</text>
  <text class="ambt" x="575" y="244" text-anchor="middle" font-size="12">judges it better</text>
  <path class="guide" d="M 14 262 L 626 262"/>
  <text class="ink" x="320" y="288" text-anchor="middle" font-size="12">to the many: the assembly and the courts, election and audit; not the great offices</text>
</svg>

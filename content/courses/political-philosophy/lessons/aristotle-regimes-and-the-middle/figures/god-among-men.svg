  <text class="ambt" x="320" y="18" text-anchor="middle">a god among men: no law for him</text>
  <path class="guide" d="M 150 152 L 490 152"/>
  <path class="blue" d="M 300.0 158.0 L 158.7 197.6"/>
  <path class="bluef" d="M 150.0 200.0 L 159.9 201.9 L 157.5 193.2 Z"/>
  <path class="amb" d="M 340.0 158.0 L 481.3 197.6"/>
  <path class="ambf" d="M 490.0 200.0 L 482.5 193.2 L 480.1 201.9 Z"/>
  <rect class="bluebox" x="20" y="204" width="260" height="92" rx="4"/>
  <text class="bluet" x="150" y="224" text-anchor="middle">remove him</text>
  <text class="ink" x="150" y="244" text-anchor="middle" font-size="12">ostracism; the Argo leaves Heracles;</text>
  <text class="ink" x="150" y="260" text-anchor="middle" font-size="12">Periander's tallest ears of corn</text>
  <text class="muted" x="150" y="284" text-anchor="middle">political justice in an imperfect regime</text>
  <rect class="ambbox" x="360" y="204" width="260" height="92" rx="4"/>
  <text class="ambt" x="490" y="224" text-anchor="middle">make him king</text>
  <text class="ink" x="490" y="244" text-anchor="middle" font-size="12">all obey him gladly,</text>
  <text class="ink" x="490" y="260" text-anchor="middle" font-size="12">not in turn but always</text>
  <text class="muted" x="490" y="284" text-anchor="middle">in the best regime</text>
  <text class="muted" x="320" y="318" text-anchor="middle">keep him as an equal</text>

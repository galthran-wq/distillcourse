<svg viewBox="0 0 640 248" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .ink { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.6; font-size: 12px; }
    .title { fill: currentColor; font-weight: 600; font-size: 14px; }
    .line { stroke: currentColor; stroke-width: 1.4; fill: none; }
    .guide { stroke: currentColor; stroke-width: 1; fill: none; opacity: 0.5; stroke-dasharray: 3 3; }
    .box { fill: none; stroke: currentColor; stroke-width: 1.2; }
    .ambbox { fill: #e2903a; fill-opacity: 0.12; stroke: #e2903a; stroke-width: 2; }
    .bluebox { fill: #4c8dd6; fill-opacity: 0.10; stroke: #4c8dd6; stroke-width: 1.5; }
    .amb { stroke: #e2903a; stroke-width: 2.2; fill: none; }
    .ambf { fill: #e2903a; }
    .ambt { fill: #e2903a; font-weight: 600; }
    .blue { stroke: #4c8dd6; stroke-width: 1.8; fill: none; }
    .bluef { fill: #4c8dd6; }
    .bluet { fill: #4c8dd6; font-weight: 600; }
    .dot { fill: currentColor; }
    .faint { fill: currentColor; opacity: 0.3; }
    .shade { fill: currentColor; opacity: 0.07; }
    .strike { stroke: currentColor; stroke-width: 1.4; opacity: 0.7; }
  </style>
  <text class="title" x="155" y="26" text-anchor="middle">rule of the best man</text>
  <circle class="line" cx="60" cy="92" r="34"/>
  <ellipse class="line" cx="70" cy="86" rx="8" ry="5"/>
  <circle class="dot" cx="70" cy="86" r="2.5"/>
  <text class="ink" x="110" y="70" text-anchor="start" font-size="12">judges the particular case</text>
  <text class="muted" x="110" y="88" text-anchor="start">the Egyptian doctor changes</text>
  <text class="muted" x="110" y="104" text-anchor="start">treatment after the fourth day</text>
  <rect class="ambbox" x="30" y="150" width="250" height="50" rx="4"/>
  <text class="ambt" x="155" y="171" text-anchor="middle">the beast: desire</text>
  <text class="ink" x="155" y="189" text-anchor="middle" font-size="12">anger, spite, partiality, his own case</text>
  <text class="muted" x="155" y="228" text-anchor="middle">one man, easily swept away</text>
  <path class="guide" d="M 320 14 L 320 240"/>
  <text class="ambt" x="475" y="26" text-anchor="middle">rule of law</text>
  <rect class="box" x="370" y="56" width="64" height="76" rx="8"/>
  <path class="guide" d="M 382 72 L 422 72"/>
  <path class="guide" d="M 382 84 L 422 84"/>
  <path class="guide" d="M 382 96 L 422 96"/>
  <path class="guide" d="M 382 108 L 422 108"/>
  <path class="guide" d="M 382 120 L 422 120"/>
  <text class="ink" x="450" y="80" text-anchor="start" font-size="12">reason unaffected by desire</text>
  <text class="muted" x="450" y="98" text-anchor="start">speaks only in general terms</text>
  <rect class="guide" x="350" y="150" width="250" height="50" rx="4"/>
  <text class="muted" x="475" y="179" text-anchor="middle">no desire</text>
  <text class="ink" x="475" y="228" text-anchor="middle" font-size="12">where it is silent: many judges trained by it</text>
</svg>

<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .ink { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.6; font-size: 12px; }
    .title { fill: currentColor; font-weight: 600; font-size: 14px; }
    .line { stroke: currentColor; stroke-width: 1.4; fill: none; }
    .guide { stroke: currentColor; stroke-width: 1; fill: none; opacity: 0.5; stroke-dasharray: 3 3; }
    .box { fill: none; stroke: currentColor; stroke-width: 1.2; }
    .ambbox { fill: #e2903a; fill-opacity: 0.12; stroke: #e2903a; stroke-width: 2; }
    .bluebox { fill: #4c8dd6; fill-opacity: 0.10; stroke: #4c8dd6; stroke-width: 1.5; }
    .amb { stroke: #e2903a; stroke-width: 2.2; fill: none; }
    .ambf { fill: #e2903a; }
    .ambt { fill: #e2903a; font-weight: 600; }
    .blue { stroke: #4c8dd6; stroke-width: 1.8; fill: none; }
    .bluef { fill: #4c8dd6; }
    .bluet { fill: #4c8dd6; font-weight: 600; }
    .dot { fill: currentColor; }
    .faint { fill: currentColor; opacity: 0.3; }
    .shade { fill: currentColor; opacity: 0.07; }
    .strike { stroke: currentColor; stroke-width: 1.4; opacity: 0.7; }
  </style>
  <text class="ambt" x="110" y="24" text-anchor="middle">from oligarchy</text>
  <text class="bluet" x="530" y="24" text-anchor="middle">from democracy</text>
  <text class="title" x="320" y="24" text-anchor="middle">polity</text>
  <text class="title" x="20" y="48" text-anchor="start" font-size="13">1. combine both rules</text>
  <rect class="ambbox" x="30" y="58" width="160" height="46" rx="4"/>
  <text class="ink" x="110" y="78" text-anchor="middle" font-size="12">fine the rich</text>
  <text class="ink" x="110" y="94" text-anchor="middle" font-size="12">for not serving</text>
  <rect class="bluebox" x="450" y="58" width="160" height="46" rx="4"/>
  <text class="ink" x="530" y="78" text-anchor="middle" font-size="12">pay the poor</text>
  <text class="ink" x="530" y="94" text-anchor="middle" font-size="12">to serve</text>
  <path class="amb" d="M 192.0 81.0 L 217.0 81.0"/>
  <path class="ambf" d="M 226.0 81.0 L 217.0 76.5 L 217.0 85.5 Z"/>
  <path class="blue" d="M 448.0 81.0 L 423.0 81.0"/>
  <path class="bluef" d="M 414.0 81.0 L 423.0 85.5 L 423.0 76.5 Z"/>
  <rect class="box" x="228" y="58" width="184" height="46" rx="4"/>
  <text class="ink" x="320" y="86" text-anchor="middle" font-size="12">both: rich and poor attend</text>
  <text class="title" x="20" y="126" text-anchor="start" font-size="13">2. take the mean</text>
  <rect class="ambbox" x="30" y="136" width="160" height="46" rx="4"/>
  <text class="ink" x="110" y="156" text-anchor="middle" font-size="12">a high property</text>
  <text class="ink" x="110" y="172" text-anchor="middle" font-size="12">qualification</text>
  <rect class="bluebox" x="450" y="136" width="160" height="46" rx="4"/>
  <text class="ink" x="530" y="156" text-anchor="middle" font-size="12">no qualification,</text>
  <text class="ink" x="530" y="172" text-anchor="middle" font-size="12">or a tiny one</text>
  <path class="amb" d="M 192.0 159.0 L 217.0 159.0"/>
  <path class="ambf" d="M 226.0 159.0 L 217.0 154.5 L 217.0 163.5 Z"/>
  <path class="blue" d="M 448.0 159.0 L 423.0 159.0"/>
  <path class="bluef" d="M 414.0 159.0 L 423.0 163.5 L 423.0 154.5 Z"/>
  <rect class="box" x="228" y="136" width="184" height="46" rx="4"/>
  <text class="ink" x="320" y="164" text-anchor="middle" font-size="12">a moderate qualification</text>
  <text class="title" x="20" y="204" text-anchor="start" font-size="13">3. take one from each</text>
  <rect class="ambbox" x="30" y="214" width="160" height="46" rx="4"/>
  <text class="ink" x="110" y="242" text-anchor="middle" font-size="12">election</text>
  <rect class="bluebox" x="450" y="214" width="160" height="46" rx="4"/>
  <text class="ink" x="530" y="234" text-anchor="middle" font-size="12">no property</text>
  <text class="ink" x="530" y="250" text-anchor="middle" font-size="12">qualification</text>
  <path class="amb" d="M 192.0 237.0 L 217.0 237.0"/>
  <path class="ambf" d="M 226.0 237.0 L 217.0 232.5 L 217.0 241.5 Z"/>
  <path class="blue" d="M 448.0 237.0 L 423.0 237.0"/>
  <path class="bluef" d="M 414.0 237.0 L 423.0 241.5 L 423.0 232.5 Z"/>
  <rect class="box" x="228" y="214" width="184" height="46" rx="4"/>
  <text class="ink" x="320" y="242" text-anchor="middle" font-size="12">elected officials, open to all</text>
  <path class="guide" d="M 14 290 L 626 290"/>
  <text class="ink" x="320" y="314" text-anchor="middle" font-size="12">the test: the same city can be called either a democracy or an oligarchy</text>
</svg>

<svg viewBox="0 0 640 262" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .ink { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.6; font-size: 12px; }
    .title { fill: currentColor; font-weight: 600; font-size: 14px; }
    .line { stroke: currentColor; stroke-width: 1.4; fill: none; }
    .guide { stroke: currentColor; stroke-width: 1; fill: none; opacity: 0.5; stroke-dasharray: 3 3; }
    .box { fill: none; stroke: currentColor; stroke-width: 1.2; }
    .ambbox { fill: #e2903a; fill-opacity: 0.12; stroke: #e2903a; stroke-width: 2; }
    .bluebox { fill: #4c8dd6; fill-opacity: 0.10; stroke: #4c8dd6; stroke-width: 1.5; }
    .amb { stroke: #e2903a; stroke-width: 2.2; fill: none; }
    .ambf { fill: #e2903a; }
    .ambt { fill: #e2903a; font-weight: 600; }
    .blue { stroke: #4c8dd6; stroke-width: 1.8; fill: none; }
    .bluef { fill: #4c8dd6; }
    .bluet { fill: #4c8dd6; font-weight: 600; }
    .dot { fill: currentColor; }
    .faint { fill: currentColor; opacity: 0.3; }
    .shade { fill: currentColor; opacity: 0.07; }
    .strike { stroke: currentColor; stroke-width: 1.4; opacity: 0.7; }
  </style>
  <text class="ambt" x="20" y="34" text-anchor="start">the oligarch</text>
  <rect class="ambbox" x="20" y="46" width="160" height="34" rx="4"/>
  <text class="ink" x="100" y="68" text-anchor="middle">unequal in wealth</text>
  <path class="line" d="M 182.0 63.0 L 229.0 63.0"/>
  <path class="dot" d="M 238.0 63.0 L 229.0 58.5 L 229.0 67.5 Z"/>
  <rect class="ambbox" x="240" y="46" width="140" height="34" rx="4"/>
  <text class="ink" x="310" y="68" text-anchor="middle">unequal in all</text>
  <path class="line" d="M 382.0 63.0 L 429.0 63.0"/>
  <path class="dot" d="M 438.0 63.0 L 429.0 58.5 L 429.0 67.5 Z"/>
  <rect class="ambbox" x="440" y="46" width="180" height="34" rx="4"/>
  <text class="ink" x="530" y="68" text-anchor="middle">a larger share of the city</text>
  <text class="muted" x="210" y="98" text-anchor="middle">the part taken for the whole</text>
  <text class="ink" x="20" y="120" text-anchor="start" font-size="12">geometric equality: shares in proportion to worth (Solon's four classes)</text>
  <path class="guide" d="M 14 138 L 626 138"/>
  <text class="bluet" x="20" y="160" text-anchor="start">the democrat</text>
  <rect class="bluebox" x="20" y="172" width="160" height="34" rx="4"/>
  <text class="ink" x="100" y="194" text-anchor="middle">equal in free birth</text>
  <path class="line" d="M 182.0 189.0 L 229.0 189.0"/>
  <path class="dot" d="M 238.0 189.0 L 229.0 184.5 L 229.0 193.5 Z"/>
  <rect class="bluebox" x="240" y="172" width="140" height="34" rx="4"/>
  <text class="ink" x="310" y="194" text-anchor="middle">equal in all</text>
  <path class="line" d="M 382.0 189.0 L 429.0 189.0"/>
  <path class="dot" d="M 438.0 189.0 L 429.0 184.5 L 429.0 193.5 Z"/>
  <rect class="bluebox" x="440" y="172" width="180" height="34" rx="4"/>
  <text class="ink" x="530" y="194" text-anchor="middle">an equal share of the city</text>
  <text class="muted" x="210" y="224" text-anchor="middle">the part taken for the whole</text>
  <text class="ink" x="20" y="246" text-anchor="start" font-size="12">arithmetic equality: one share each (Cleisthenes' ten tribes)</text>
</svg>

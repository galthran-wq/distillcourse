  <rect class="box" x="258.4" y="40" width="61.6" height="22"/>
  <text class="ambt" x="334" y="56" text-anchor="start" font-size="12">polity possible: least faction</text>
  <rect class="shade" x="40.0" y="80" width="42.0" height="22"/>

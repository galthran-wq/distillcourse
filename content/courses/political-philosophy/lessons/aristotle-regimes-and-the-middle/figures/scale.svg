    .shade { fill: currentColor; opacity: 0.07; }
    .strike { stroke: currentColor; stroke-width: 1.4; opacity: 0.7; }
  </style>
  <text class="muted" x="40" y="24" text-anchor="start">rich</text>
  <text class="ambt" x="130" y="24" text-anchor="start" font-size="12">middle</text>
  <text class="muted" x="230" y="24" text-anchor="start">poor</text>

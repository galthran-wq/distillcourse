<svg viewBox="0 0 700 284" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .ink { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.6; font-size: 12px; }
    .title { fill: currentColor; font-weight: 600; font-size: 14px; }
    .line { stroke: currentColor; stroke-width: 1.4; fill: none; }
    .guide { stroke: currentColor; stroke-width: 1; fill: none; opacity: 0.5; stroke-dasharray: 3 3; }
    .box { fill: none; stroke: currentColor; stroke-width: 1.2; }
    .ambbox { fill: #e2903a; fill-opacity: 0.12; stroke: #e2903a; stroke-width: 2; }
    .bluebox { fill: #4c8dd6; fill-opacity: 0.10; stroke: #4c8dd6; stroke-width: 1.5; }
    .amb { stroke: #e2903a; stroke-width: 2.2; fill: none; }
    .ambf { fill: #e2903a; }
    .ambt { fill: #e2903a; font-weight: 600; }
    .blue { stroke: #4c8dd6; stroke-width: 1.8; fill: none; }
    .bluef { fill: #4c8dd6; }
    .bluet { fill: #4c8dd6; font-weight: 600; }
    .dot { fill: currentColor; }
    .faint { fill: currentColor; opacity: 0.3; }
    .shade { fill: currentColor; opacity: 0.07; }
    .strike { stroke: currentColor; stroke-width: 1.4; opacity: 0.7; }
  </style>
  <text class="title" x="70" y="30" text-anchor="middle">rulers</text>
  <text class="title" x="250" y="30" text-anchor="middle">for the common good</text>
  <text class="title" x="470" y="30" text-anchor="middle">for the rulers' own good</text>
  <path class="line" d="M 14 42 L 600 42"/>
  <text class="title" x="70" y="80" text-anchor="middle">one</text>
  <rect class="box" x="160" y="56" width="180" height="42" rx="4"/>
  <text class="ink" x="250" y="82" text-anchor="middle" font-size="14">kingship</text>
  <rect class="box" x="380" y="56" width="180" height="42" rx="4"/>
  <text class="ink" x="470" y="82" text-anchor="middle" font-size="14">tyranny</text>
  <text class="title" x="70" y="136" text-anchor="middle">few</text>
  <rect class="box" x="160" y="112" width="180" height="42" rx="4"/>
  <text class="ink" x="250" y="138" text-anchor="middle" font-size="14">aristocracy</text>
  <rect class="box" x="380" y="112" width="180" height="42" rx="4"/>
  <text class="ink" x="470" y="135" text-anchor="middle" font-size="14">oligarchy</text>
  <text class="muted" x="470" y="149" text-anchor="middle">for the rich</text>
  <text class="title" x="70" y="192" text-anchor="middle">many</text>
  <rect class="box" x="160" y="168" width="180" height="42" rx="4"/>
  <text class="ink" x="250" y="194" text-anchor="middle" font-size="14">polity</text>
  <rect class="box" x="380" y="168" width="180" height="42" rx="4"/>
  <text class="ink" x="470" y="191" text-anchor="middle" font-size="14">democracy</text>
  <text class="muted" x="470" y="205" text-anchor="middle">for the poor</text>
  <path class="amb" d="M 572 108 L 584 108 L 584 194 L 572 194"/>
  <text class="ambt" x="592" y="140" text-anchor="start" font-size="12">the real line:</text>
  <text class="ambt" x="592" y="156" text-anchor="start" font-size="12">rich and poor,</text>
  <text class="ambt" x="592" y="172" text-anchor="start" font-size="12">whatever their</text>
  <text class="ambt" x="592" y="188" text-anchor="start" font-size="12">number</text>
  <path class="guide" d="M 14 222 L 600 222"/>
  <text class="ink" x="320" y="248" text-anchor="middle" font-size="12">1,000 rich ruling 300 free poor: an oligarchy, though its rulers are the many</text>
  <text class="muted" x="320" y="268" text-anchor="middle">the good rule of the many has no name of its own: polity is the word for any constitution</text>
</svg>

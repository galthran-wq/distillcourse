<svg viewBox="0 0 680 262" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .ink { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.6; font-size: 12px; }
    .title { fill: currentColor; font-weight: 600; font-size: 14px; }
    .line { stroke: currentColor; stroke-width: 1.4; fill: none; }
    .guide { stroke: currentColor; stroke-width: 1; fill: none; opacity: 0.5; stroke-dasharray: 3 3; }
    .box { fill: none; stroke: currentColor; stroke-width: 1.2; }
    .ambbox { fill: #e2903a; fill-opacity: 0.12; stroke: #e2903a; stroke-width: 2; }
    .bluebox { fill: #4c8dd6; fill-opacity: 0.10; stroke: #4c8dd6; stroke-width: 1.5; }
    .amb { stroke: #e2903a; stroke-width: 2.2; fill: none; }
    .ambf { fill: #e2903a; }
    .ambt { fill: #e2903a; font-weight: 600; }
    .blue { stroke: #4c8dd6; stroke-width: 1.8; fill: none; }
    .bluef { fill: #4c8dd6; }
    .bluet { fill: #4c8dd6; font-weight: 600; }
    .dot { fill: currentColor; }
    .shade { fill: currentColor; opacity: 0.07; }
  </style>
  <text class="title" x="20" y="26" text-anchor="start">the pattern</text>
  <rect class="box" x="20" y="40" width="140" height="44" rx="4"/>
  <text class="ink" x="90.0" y="67" text-anchor="middle">1. how it arises</text>
  <rect class="ambbox" x="20" y="140" width="140" height="78" rx="4"/>
  <text class="ink" x="90.0" y="164" text-anchor="middle" font-size="12">the factions split</text>
  <text class="ink" x="90.0" y="181" text-anchor="middle" font-size="12">land and houses,</text>
  <text class="ink" x="90.0" y="198" text-anchor="middle" font-size="12">enslave the producers</text>
  <path class="line" d="M 162.0 62.0 L 163.0 62.0"/>
  <path class="dot" d="M 172.0 62.0 L 163.0 57.5 L 163.0 66.5 Z"/>
  <path class="amb" d="M 162.0 179.0 L 163.0 179.0"/>
  <path class="ambf" d="M 172.0 179.0 L 163.0 174.5 L 163.0 183.5 Z"/>
  <rect class="box" x="175" y="40" width="140" height="44" rx="4"/>
  <text class="ink" x="245.0" y="67" text-anchor="middle">2. what it honours</text>
  <rect class="ambbox" x="175" y="140" width="140" height="78" rx="4"/>
  <text class="ink" x="245.0" y="164" text-anchor="middle" font-size="12">honour and</text>
  <text class="ink" x="245.0" y="181" text-anchor="middle" font-size="12">victory</text>
  <path class="line" d="M 317.0 62.0 L 318.0 62.0"/>
  <path class="dot" d="M 327.0 62.0 L 318.0 57.5 L 318.0 66.5 Z"/>
  <path class="amb" d="M 317.0 179.0 L 318.0 179.0"/>
  <path class="ambf" d="M 327.0 179.0 L 318.0 174.5 L 318.0 183.5 Z"/>
  <rect class="box" x="330" y="40" width="140" height="44" rx="4"/>
  <text class="ink" x="400.0" y="67" text-anchor="middle">3. its defect</text>
  <rect class="ambbox" x="330" y="140" width="140" height="78" rx="4"/>
  <text class="ink" x="400.0" y="164" text-anchor="middle" font-size="12">secret greed,</text>
  <text class="ink" x="400.0" y="181" text-anchor="middle" font-size="12">endless war</text>
  <path class="line" d="M 472.0 62.0 L 473.0 62.0"/>
  <path class="dot" d="M 482.0 62.0 L 473.0 57.5 L 473.0 66.5 Z"/>
  <path class="amb" d="M 472.0 179.0 L 473.0 179.0"/>
  <path class="ambf" d="M 482.0 179.0 L 473.0 174.5 L 473.0 183.5 Z"/>
  <rect class="box" x="485" y="40" width="175" height="44" rx="4"/>
  <text class="ink" x="572.5" y="67" text-anchor="middle">4. the man it raises</text>
  <rect class="ambbox" x="485" y="140" width="175" height="78" rx="4"/>
  <text class="ink" x="572.5" y="164" text-anchor="middle" font-size="12">son of a quiet just father,</text>
  <text class="ink" x="572.5" y="181" text-anchor="middle" font-size="12">mocked at home and in the</text>
  <text class="ink" x="572.5" y="198" text-anchor="middle" font-size="12">street: spirit takes the throne</text>
  <text class="ambt" x="20" y="128" text-anchor="start">filled in for timocracy</text>
  <text class="muted" x="330" y="248" text-anchor="middle">father, mother, servants and the street decide which part of the son rules</text>
</svg>

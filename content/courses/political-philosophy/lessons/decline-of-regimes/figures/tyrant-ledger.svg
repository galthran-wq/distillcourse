<svg viewBox="0 0 650 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .ink { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.6; font-size: 12px; }
    .title { fill: currentColor; font-weight: 600; font-size: 14px; }
    .line { stroke: currentColor; stroke-width: 1.4; fill: none; }
    .guide { stroke: currentColor; stroke-width: 1; fill: none; opacity: 0.5; stroke-dasharray: 3 3; }
    .box { fill: none; stroke: currentColor; stroke-width: 1.2; }
    .ambbox { fill: #e2903a; fill-opacity: 0.12; stroke: #e2903a; stroke-width: 2; }
    .bluebox { fill: #4c8dd6; fill-opacity: 0.10; stroke: #4c8dd6; stroke-width: 1.5; }
    .amb { stroke: #e2903a; stroke-width: 2.2; fill: none; }
    .ambf { fill: #e2903a; }
    .ambt { fill: #e2903a; font-weight: 600; }
    .blue { stroke: #4c8dd6; stroke-width: 1.8; fill: none; }
    .bluef { fill: #4c8dd6; }
    .bluet { fill: #4c8dd6; font-weight: 600; }
    .dot { fill: currentColor; }
    .shade { fill: currentColor; opacity: 0.07; }
  </style>
  <text class="title" x="30" y="28" text-anchor="start">what he does</text>
  <text class="title" x="380" y="28" text-anchor="start">why</text>
  <text class="ink" x="30" y="57" text-anchor="start">smiles, promises, debt relief, land</text>
  <text class="muted" x="380" y="57" text-anchor="start">to be loved</text>
  <path class="guide" d="M 30 66 L 620 66"/>
  <path class="line" d="M 338.0 52.0 L 361.0 52.0"/>
  <path class="dot" d="M 370.0 52.0 L 361.0 47.5 L 361.0 56.5 Z"/>
  <text class="ink" x="30" y="87" text-anchor="start">stirs up war after war</text>
  <text class="muted" x="380" y="87" text-anchor="start">so the people need a leader</text>
  <path class="guide" d="M 30 96 L 620 96"/>
  <path class="line" d="M 338.0 82.0 L 361.0 82.0"/>
  <path class="dot" d="M 370.0 82.0 L 361.0 77.5 L 361.0 86.5 Z"/>
  <text class="ink" x="30" y="117" text-anchor="start">taxes the people</text>
  <text class="muted" x="380" y="117" text-anchor="start">so they are too poor to plot</text>
  <path class="guide" d="M 30 126 L 620 126"/>
  <path class="line" d="M 338.0 112.0 L 361.0 112.0"/>
  <path class="dot" d="M 370.0 112.0 L 361.0 107.5 L 361.0 116.5 Z"/>
  <text class="ink" x="30" y="147" text-anchor="start">exposes the freedom-minded to the enemy</text>
  <text class="muted" x="380" y="147" text-anchor="start">to be rid of them quietly</text>
  <path class="guide" d="M 30 156 L 620 156"/>
  <path class="line" d="M 338.0 142.0 L 361.0 142.0"/>
  <path class="dot" d="M 370.0 142.0 L 361.0 137.5 L 361.0 146.5 Z"/>
  <text class="ink" x="30" y="177" text-anchor="start">purges the brave, high-minded, wise, rich</text>
  <text class="muted" x="380" y="177" text-anchor="start">they are his rivals: the reverse purge</text>
  <path class="guide" d="M 30 186 L 620 186"/>
  <path class="line" d="M 338.0 172.0 L 361.0 172.0"/>
  <path class="dot" d="M 370.0 172.0 L 361.0 167.5 L 361.0 176.5 Z"/>
  <text class="ink" x="30" y="207" text-anchor="start">a guard of foreigners and freed slaves</text>
  <text class="muted" x="380" y="207" text-anchor="start">the citizens now hate him</text>
  <path class="guide" d="M 30 216 L 620 216"/>
  <path class="line" d="M 338.0 202.0 L 361.0 202.0"/>
  <path class="dot" d="M 370.0 202.0 L 361.0 197.5 L 361.0 206.5 Z"/>
  <text class="ink" x="30" y="237" text-anchor="start">spends the temple treasures</text>
  <text class="muted" x="380" y="237" text-anchor="start">to pay the guard</text>
  <path class="guide" d="M 30 246 L 620 246"/>
  <path class="line" d="M 338.0 232.0 L 361.0 232.0"/>
  <path class="dot" d="M 370.0 232.0 L 361.0 227.5 L 361.0 236.5 Z"/>
  <text class="ink" x="30" y="267" text-anchor="start">lives off the people, beats them</text>
  <text class="muted" x="380" y="267" text-anchor="start">when the rest is gone</text>
  <path class="guide" d="M 30 276 L 620 276"/>
  <path class="line" d="M 338.0 262.0 L 361.0 262.0"/>
  <path class="dot" d="M 370.0 262.0 L 361.0 257.5 L 361.0 266.5 Z"/>
  <rect class="ambbox" x="30" y="286" width="590" height="32" rx="4"/>
  <text class="ambt" x="325" y="307" text-anchor="middle">"out of the smoke into the fire": the people that made him is enslaved by him</text>
</svg>

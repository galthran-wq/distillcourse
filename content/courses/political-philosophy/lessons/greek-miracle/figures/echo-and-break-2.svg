<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .ink { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.6; font-size: 12px; }
    .title { fill: currentColor; font-weight: 600; font-size: 14px; }
    .ruler { fill: #e2903a; fill-opacity: 0.18; stroke: #e2903a; stroke-width: 2; }
    .rulertext { fill: #e2903a; font-weight: 600; }
    .part { fill: #4c8dd6; fill-opacity: 0.15; stroke: #4c8dd6; stroke-width: 1.4; }
    .parttext { fill: currentColor; }
    .down { stroke: currentColor; stroke-width: 1.2; opacity: 0.5; fill: none; }
    .ring { fill: none; stroke: #e2903a; stroke-width: 1.2; stroke-dasharray: 3 4; }
    .radius { stroke: #e2903a; stroke-width: 1.2; opacity: 0.8; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor" opacity="0.6"/>
    </marker>
  </defs>

  <text class="title" x="20" y="30">2 · First accounts of nature: one element is origin and ruler</text>
  <rect class="ruler" x="185" y="55" width="270" height="50" rx="5"/>
  <text class="rulertext" x="320" y="77" text-anchor="middle">water / air</text>
  <text class="muted" x="320" y="94" text-anchor="middle">origin of all the rest, and their ruler</text>
  <path class="down" d="M320,105 L95,175" marker-end="url(#ah)"/>
  <rect class="part" x="30" y="180" width="130" height="46" rx="5"/>
  <text class="parttext" x="95" y="207" text-anchor="middle">hot</text>
  <text class="muted" x="95" y="216" text-anchor="middle"></text>
  <path class="down" d="M320,105 L245,175" marker-end="url(#ah)"/>
  <rect class="part" x="180" y="180" width="130" height="46" rx="5"/>
  <text class="parttext" x="245" y="207" text-anchor="middle">cold</text>
  <text class="muted" x="245" y="216" text-anchor="middle"></text>
  <path class="down" d="M320,105 L395,175" marker-end="url(#ah)"/>
  <rect class="part" x="330" y="180" width="130" height="46" rx="5"/>
  <text class="parttext" x="395" y="207" text-anchor="middle">wet</text>
  <text class="muted" x="395" y="216" text-anchor="middle"></text>
  <path class="down" d="M320,105 L545,175" marker-end="url(#ah)"/>
  <rect class="part" x="480" y="180" width="130" height="46" rx="5"/>
  <text class="parttext" x="545" y="207" text-anchor="middle">dry</text>
  <text class="muted" x="545" y="216" text-anchor="middle"></text>
  <text class="muted" x="320" y="262" text-anchor="middle">the gods' names are gone, the ranking is not:</text>
  <text class="muted" x="320" y="279" text-anchor="middle">the old pattern shows through the new vocabulary</text>
</svg>

<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .ink { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.6; font-size: 12px; }
    .title { fill: currentColor; font-weight: 600; font-size: 14px; }
    .ruler { fill: #e2903a; fill-opacity: 0.18; stroke: #e2903a; stroke-width: 2; }
    .rulertext { fill: #e2903a; font-weight: 600; }
    .part { fill: #4c8dd6; fill-opacity: 0.15; stroke: #4c8dd6; stroke-width: 1.4; }
    .parttext { fill: currentColor; }
    .down { stroke: currentColor; stroke-width: 1.2; opacity: 0.5; fill: none; }
    .ring { fill: none; stroke: #e2903a; stroke-width: 1.2; stroke-dasharray: 3 4; }
    .radius { stroke: #e2903a; stroke-width: 1.2; opacity: 0.8; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor" opacity="0.6"/>
    </marker>
  </defs>

  <text class="title" x="20" y="30">3 · Anaximander: the earth is ruled by nothing</text>

  <circle class="ring" cx="320" cy="165" r="85"/>
  <line class="radius" x1="320.0" y1="141.0" x2="320.0" y2="97.0"/>
  <rect class="part" x="280.0" y="65.0" width="80" height="30" rx="5"/>
  <text class="parttext" x="320.0" y="85.0" text-anchor="middle">hot</text>
  <line class="radius" x1="344.0" y1="165.0" x2="363.0" y2="165.0"/>
  <rect class="part" x="365.0" y="150.0" width="80" height="30" rx="5"/>
  <text class="parttext" x="405.0" y="170.0" text-anchor="middle">dry</text>
  <line class="radius" x1="320.0" y1="189.0" x2="320.0" y2="233.0"/>
  <rect class="part" x="280.0" y="235.0" width="80" height="30" rx="5"/>
  <text class="parttext" x="320.0" y="255.0" text-anchor="middle">cold</text>
  <line class="radius" x1="296.0" y1="165.0" x2="252.0" y2="165.0"/>
  <rect class="part" x="195.0" y="150.0" width="80" height="30" rx="5"/>
  <text class="parttext" x="235.0" y="170.0" text-anchor="middle">wet</text>
  <circle class="ruler" cx="320" cy="165" r="22"/>
  <text class="rulertext" x="320" y="170" text-anchor="middle">earth</text>
  <text class="muted" x="20" y="295">every radius equal: no reason to fall</text>
  <text class="muted" x="20" y="312">one way rather than another</text>
  <text class="muted" x="620" y="295" text-anchor="end">no element may dominate; each pays back</text>
  <text class="muted" x="620" y="312" text-anchor="end">what it takes from the others, in turn</text>
</svg>

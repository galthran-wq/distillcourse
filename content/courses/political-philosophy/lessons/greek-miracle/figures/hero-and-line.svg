<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .ink { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.6; font-size: 12px; }
    .title { fill: currentColor; font-weight: 600; font-size: 14px; }
    .champ { fill: #4c8dd6; fill-opacity: 0.3; stroke: #4c8dd6; stroke-width: 1.4; }
    .champ2 { fill: none; stroke: currentColor; stroke-width: 1.2; opacity: 0.6; }
    .clash { stroke: currentColor; stroke-width: 1.5; opacity: 0.6; }
    .shield { fill: #4c8dd6; fill-opacity: 0.3; stroke: #4c8dd6; stroke-width: 1.4; }
    .out { fill: #e2903a; fill-opacity: 0.35; stroke: #e2903a; stroke-width: 2; }
    .gap { fill: none; stroke: #e2903a; stroke-width: 1.2; stroke-dasharray: 3 3; }
    .outtext { fill: #e2903a; font-weight: 600; }
    .div { stroke: currentColor; stroke-width: 1; opacity: 0.25; }
    .lead { stroke: #e2903a; stroke-width: 1; }
  </style>
  <line class="div" x1="300" y1="20" x2="300" y2="250"/>
  <text class="title" x="150" y="30" text-anchor="middle">Champions: each fights for himself</text>
  <circle class="champ" cx="70" cy="90" r="9"/><circle class="champ2" cx="98" cy="96" r="9"/><line class="clash" x1="79" y1="92" x2="89" y2="94"/>
  <circle class="champ" cx="150" cy="140" r="9"/><circle class="champ2" cx="178" cy="146" r="9"/><line class="clash" x1="159" y1="142" x2="169" y2="144"/>
  <circle class="champ" cx="60" cy="175" r="9"/><circle class="champ2" cx="88" cy="181" r="9"/><line class="clash" x1="69" y1="177" x2="79" y2="179"/>
  <circle class="champ" cx="170" cy="75" r="9"/><circle class="champ2" cx="198" cy="81" r="9"/><line class="clash" x1="179" y1="77" x2="189" y2="79"/>
  <text class="muted" x="150" y="225" text-anchor="middle">worth = the single exploit that stands out</text>
  <text class="title" x="474" y="30" text-anchor="middle">Phalanx: the line wins together</text>
  <circle class="shield" cx="370" cy="110" r="11"/>
  <circle class="shield" cx="396" cy="110" r="11"/>
  <circle class="shield" cx="422" cy="110" r="11"/>
  <circle class="shield" cx="448" cy="110" r="11"/>
  <circle class="shield" cx="500" cy="110" r="11"/>
  <circle class="shield" cx="526" cy="110" r="11"/>
  <circle class="shield" cx="552" cy="110" r="11"/>
  <circle class="shield" cx="578" cy="110" r="11"/>
  <circle class="shield" cx="370" cy="140" r="11"/>
  <circle class="shield" cx="396" cy="140" r="11"/>
  <circle class="shield" cx="422" cy="140" r="11"/>
  <circle class="shield" cx="448" cy="140" r="11"/>
  <circle class="shield" cx="474" cy="140" r="11"/>
  <circle class="shield" cx="500" cy="140" r="11"/>
  <circle class="shield" cx="526" cy="140" r="11"/>
  <circle class="shield" cx="552" cy="140" r="11"/>
  <circle class="shield" cx="578" cy="140" r="11"/>
  <circle class="gap" cx="474" cy="110" r="11"/>
  <circle class="out" cx="474" cy="62" r="11"/>
  <line class="lead" x1="486" y1="58" x2="518" y2="58"/>
  <text class="outtext" x="522" y="55">Aristodemus,</text>
  <text class="outtext" x="522" y="70">Plataea 479</text>
  <text class="muted" x="474" y="180" text-anchor="middle">he left his place in the ranks:</text>
  <text class="muted" x="474" y="196" text-anchor="middle">the bravest man there, refused the prize</text>
  <text class="muted" x="474" y="225" text-anchor="middle">worth = keeping your place beside equals</text>
</svg>

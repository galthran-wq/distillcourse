<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .ink { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.6; font-size: 12px; }
    .title { fill: currentColor; font-weight: 600; font-size: 14px; }
    .person { fill: none; stroke: currentColor; stroke-width: 1.3; }
    .king { fill: #e2903a; fill-opacity: 0.18; stroke: #e2903a; stroke-width: 2; }
    .share { fill: #4c8dd6; fill-opacity: 0.15; stroke: #4c8dd6; stroke-width: 1.5; }
    .kingtext { fill: #e2903a; font-weight: 600; }
    .sharetext { fill: #4c8dd6; font-weight: 600; }
    .arrow { stroke: currentColor; stroke-width: 1.2; opacity: 0.55; fill: none; }
    .div { stroke: currentColor; stroke-width: 1; opacity: 0.25; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor" opacity="0.6"/>
    </marker>
  </defs>

  <line class="div" x1="320" y1="20" x2="320" y2="290"/>

  <!-- left: Scythian legend -->
  <text class="title" x="160" y="30" text-anchor="middle">Scythian legend: one takes all</text>
  <text class="muted" x="160" y="62" text-anchor="middle">golden gifts fall from the sky</text>
  <text class="ink" x="160" y="84" text-anchor="middle">plough and yoke · battle-axe · cup</text>
  <circle class="person" cx="70" cy="150" r="20"/>
  <text class="muted" x="70" y="186" text-anchor="middle">eldest</text>
  <text class="muted" x="70" y="201" text-anchor="middle">repelled</text>
  <circle class="person" cx="160" cy="150" r="20"/>
  <text class="muted" x="160" y="186" text-anchor="middle">second</text>
  <text class="muted" x="160" y="201" text-anchor="middle">repelled</text>
  <circle class="king" cx="250" cy="150" r="26"/>
  <text class="kingtext" x="250" y="155" text-anchor="middle">king</text>
  <text class="muted" x="250" y="194" text-anchor="middle">youngest</text>
  <path class="arrow" d="M200,94 Q240,105 248,120" marker-end="url(#ah)"/>
  <rect class="king" x="60" y="230" width="200" height="44" rx="5"/>
  <text class="kingtext" x="160" y="250" text-anchor="middle">farming + war + worship</text>
  <text class="muted" x="160" y="266" text-anchor="middle">held together in one man</text>
  <path class="arrow" d="M250,178 L220,228" marker-end="url(#ah)"/>

  <!-- right: Athenian legend -->
  <text class="title" x="480" y="30" text-anchor="middle">Athenian legend: the heirs divide</text>
  <circle class="person" cx="480" cy="80" r="20"/>
  <text class="muted" x="510" y="76">Pandion,</text>
  <text class="muted" x="510" y="90">king, dies</text>
  <path class="arrow" d="M468,98 L420,128" marker-end="url(#ah)"/>
  <path class="arrow" d="M492,98 L540,128" marker-end="url(#ah)"/>
  <circle class="share" cx="410" cy="150" r="20"/>
  <text class="sharetext" x="410" y="186" text-anchor="middle">Erechtheus</text>
  <text class="muted" x="410" y="201" text-anchor="middle">kingship and war</text>
  <circle class="share" cx="550" cy="150" r="20"/>
  <text class="sharetext" x="550" y="186" text-anchor="middle">Butes</text>
  <text class="muted" x="550" y="201" text-anchor="middle">priesthood</text>
  <rect class="share" x="350" y="230" width="260" height="44" rx="5"/>
  <text class="sharetext" x="480" y="250" text-anchor="middle">each heir one function</text>
  <text class="muted" x="480" y="266" text-anchor="middle">the parts must now be fitted together</text>
</svg>

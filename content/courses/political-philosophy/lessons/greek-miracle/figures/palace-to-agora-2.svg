  <circle class="vill" cx="430" cy="300" r="13"/>
  <circle class="vill" cx="500" cy="300" r="13"/>
  <circle class="vill" cx="570" cy="300" r="13"/>
  <text class="muted" x="320" y="333" text-anchor="middle">villages (damos) working their own land</text>
  <rect class="lord" x="68" y="220" width="84" height="30" rx="4"/>
  <text class="ink" x="110" y="240" text-anchor="middle">local lord</text>
  <rect class="lord" x="173" y="220" width="84" height="30" rx="4"/>

<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .ink { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.6; font-size: 12px; }
    .title { fill: currentColor; font-weight: 600; font-size: 14px; }
    .box { fill: none; stroke: currentColor; stroke-width: 1.3; }
    .ghost { fill: none; stroke: currentColor; stroke-width: 1.2; stroke-dasharray: 4 4; opacity: 0.3; }
    .ghosttext { fill: currentColor; opacity: 0.3; }
    .sub { fill: #e2903a; fill-opacity: 0.15; stroke: #e2903a; stroke-width: 1.8; }
    .subtext { fill: #e2903a; font-weight: 600; }
    .link { stroke: currentColor; stroke-width: 1; opacity: 0.45; }
    .vill { fill: #4c8dd6; fill-opacity: 0.25; stroke: #4c8dd6; stroke-width: 1.3; }
    .lord { fill: #4c8dd6; fill-opacity: 0.12; stroke: #4c8dd6; stroke-width: 1.3; }
    .wall { fill: none; stroke: currentColor; stroke-width: 1.2; stroke-dasharray: 3 3; opacity: 0.5; }
    .ring { fill: none; stroke: #e2903a; stroke-width: 1; stroke-dasharray: 2 4; opacity: 0.7; }
    .citizen { fill: currentColor; opacity: 0.7; }
  </style>

  <text class="title" x="20" y="30">2 · The palace burns, c. 1200 BC</text>
  <rect class="ghost" x="225" y="60" width="190" height="44" rx="5"/>
  <text class="ghosttext" x="320" y="87" text-anchor="middle">wanax: the title vanishes</text>
  <circle class="vill" cx="70" cy="300" r="13"/>

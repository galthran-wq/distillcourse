<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .ink { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.6; font-size: 12px; }
    .title { fill: currentColor; font-weight: 600; font-size: 14px; }
    .box { fill: none; stroke: currentColor; stroke-width: 1.3; }
    .ghost { fill: none; stroke: currentColor; stroke-width: 1.2; stroke-dasharray: 4 4; opacity: 0.3; }
    .ghosttext { fill: currentColor; opacity: 0.3; }
    .sub { fill: #e2903a; fill-opacity: 0.15; stroke: #e2903a; stroke-width: 1.8; }
    .subtext { fill: #e2903a; font-weight: 600; }
    .link { stroke: currentColor; stroke-width: 1; opacity: 0.45; }
    .vill { fill: #4c8dd6; fill-opacity: 0.25; stroke: #4c8dd6; stroke-width: 1.3; }
    .lord { fill: #4c8dd6; fill-opacity: 0.12; stroke: #4c8dd6; stroke-width: 1.3; }
    .wall { fill: none; stroke: currentColor; stroke-width: 1.2; stroke-dasharray: 3 3; opacity: 0.5; }
    .ring { fill: none; stroke: #e2903a; stroke-width: 1; stroke-dasharray: 2 4; opacity: 0.7; }
    .citizen { fill: currentColor; opacity: 0.7; }
  </style>

  <text class="title" x="20" y="30">4 · The polis: power in the middle</text>
  <circle class="wall" cx="320" cy="190" r="143"/>
  <text class="muted" x="22" y="325">wall round the whole community</text>
  <circle class="ring" cx="320" cy="190" r="105"/>
  <circle class="citizen" cx="425.0" cy="190.0" r="4.5"/>
  <circle class="citizen" cx="406.0" cy="250.2" r="4.5"/>
  <circle class="citizen" cx="234.0" cy="250.2" r="4.5"/>
  <circle class="citizen" cx="215.0" cy="190.0" r="4.5"/>
  <circle class="citizen" cx="372.5" cy="99.1" r="4.5"/>
  <circle class="citizen" cx="320.0" cy="85.0" r="4.5"/>
  <circle class="citizen" cx="267.5" cy="99.1" r="4.5"/>
  <rect class="sub" x="179.1" y="120.5" width="100" height="34" rx="5"/>
  <text class="subtext" x="229.1" y="135.5" text-anchor="middle">war</text>
  <text class="muted" x="229.1" y="149.5" text-anchor="middle">polemarch</text>
  <rect class="sub" x="360.9" y="120.5" width="100" height="34" rx="5"/>
  <text class="subtext" x="410.9" y="135.5" text-anchor="middle">command</text>
  <text class="muted" x="410.9" y="149.5" text-anchor="middle">archon</text>
  <rect class="sub" x="270.0" y="278.0" width="100" height="34" rx="5"/>
  <text class="subtext" x="320.0" y="293.0" text-anchor="middle">altars</text>
  <text class="muted" x="320.0" y="307.0" text-anchor="middle">basileus</text>
  <circle cx="320" cy="190" r="9" fill="#e2903a"/>
  <text class="subtext" x="320" y="218" text-anchor="middle">es meson</text>
  <text class="muted" x="320" y="233" text-anchor="middle">agora · common hearth</text>
  <text class="muted" x="22" y="62">temples on the old citadel:</text>
  <text class="muted" x="22" y="77">the gods' house, open to all</text>
  <text class="muted" x="560" y="170" text-anchor="middle">citizens,</text>
  <text class="muted" x="560" y="185" text-anchor="middle">each the same</text>
  <text class="muted" x="560" y="200" text-anchor="middle">distance from</text>
  <text class="muted" x="560" y="215" text-anchor="middle">the centre</text>
</svg>

<svg viewBox="0 30 560 260" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .ink { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.6; font-size: 12px; }
    .axis { stroke: currentColor; stroke-width: 1.2; }
    .lead { stroke: currentColor; stroke-width: 1; opacity: 0.45; }
    .palace { fill: #4c8dd6; opacity: 0.85; }
    .gap { fill: url(#hatch); stroke: #e2903a; stroke-width: 1.5; }
    .gaptext { fill: #e2903a; font-weight: 600; }
    .phalanx { stroke: #4c8dd6; stroke-width: 4; stroke-linecap: round; }
    .dot { fill: currentColor; }
  </style>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#e2903a" opacity="0.12"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#e2903a" stroke-width="2" opacity="0.45"/>
    </pattern>
  </defs>

  <!-- spans: x(year) = 30 + (1600 - year) * 0.426 -->
  <rect class="palace" x="30" y="92" width="170" height="30" rx="4"/>
  <text x="115" y="112" text-anchor="middle" fill="#fff" font-weight="600">Mycenaean palaces</text>
  <rect class="gap" x="200" y="92" width="171" height="30" rx="4"/>
  <text class="gaptext" x="285" y="62" text-anchor="middle">≈ four centuries</text>
  <text class="muted" x="285" y="80" text-anchor="middle">no palace, no king over a territory, no writing</text>
  <line class="phalanx" x1="435" y1="107" x2="508" y2="107"/>
  <text class="muted" x="470" y="86" text-anchor="middle">hoplite phalanx</text>

  <!-- axis -->
  <line class="axis" x1="30" y1="140" x2="525" y2="140"/>
  <g class="muted" text-anchor="middle">
    <line class="lead" x1="30" y1="136" x2="30" y2="144"/><text x="30" y="156">1600 BC</text>
    <line class="lead" x1="115" y1="136" x2="115" y2="144"/><text x="115" y="156">1400</text>
    
    <line class="lead" x1="286" y1="136" x2="286" y2="144"/><text x="286" y="156">1000</text>
    
  </g>

  <!-- events -->
  <circle class="dot" cx="371" cy="140" r="4"/>
  <line class="lead" x1="371" y1="144" x2="371" y2="176"/>
  <text class="ink" x="375" y="181">alphabet in use, c. 800</text>

  <circle class="dot" cx="459" cy="140" r="4"/>
  <line class="lead" x1="459" y1="144" x2="459" y2="203"/>
  <text class="ink" x="453" y="207" text-anchor="end">Solon archon, c. 594</text>

  <circle class="dot" cx="470" cy="140" r="3"/>
  <line class="lead" x1="470" y1="144" x2="470" y2="227"/>
  <text class="ink" x="464" y="231" text-anchor="end">Thales, Anaximander at Miletus, c. 585–550</text>

  <circle class="dot" cx="495" cy="140" r="4"/>
  <line class="lead" x1="495" y1="144" x2="495" y2="251"/>
  <text class="ink" x="489" y="255" text-anchor="end">Cleisthenes' ten tribes, 508/7</text>

  <circle class="dot" cx="508" cy="140" r="4"/>
  <line class="lead" x1="508" y1="144" x2="508" y2="275"/>
  <text class="ink" x="502" y="279" text-anchor="end">Plataea, 479</text>

  <circle class="dot" cx="200" cy="140" r="4"/>
  <line class="lead" x1="200" y1="144" x2="200" y2="176"/>
  <text class="ink" x="196" y="181" text-anchor="end">palaces burn, c. 1200</text>
</svg>

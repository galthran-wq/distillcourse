<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .ink { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.6; font-size: 12px; }
    .title { fill: currentColor; font-weight: 600; font-size: 14px; }
    .geo { fill: #4c8dd6; fill-opacity: 0.7; }
    .ari { fill: #e2903a; fill-opacity: 0.75; }
    .base { stroke: currentColor; stroke-width: 1; opacity: 0.5; }
    .div { stroke: currentColor; stroke-width: 1; opacity: 0.25; }
  </style>
  <line class="div" x1="290" y1="20" x2="290" y2="290"/>
  <text class="title" x="145" y="30" text-anchor="middle">Geometric: to each by worth</text>
  <text class="muted" x="145" y="48" text-anchor="middle">Solon's four classes, by yearly harvest</text>
  <rect class="geo" x="40" y="70" width="44" height="150" rx="3"/>
  <text class="ink" x="62" y="64" text-anchor="middle">500</text>
  <text class="muted" x="62" y="238" text-anchor="middle">I</text>
  <rect class="geo" x="102" y="130" width="44" height="90" rx="3"/>
  <text class="ink" x="124" y="124" text-anchor="middle">300</text>
  <text class="muted" x="124" y="238" text-anchor="middle">II</text>
  <rect class="geo" x="164" y="160" width="44" height="60" rx="3"/>
  <text class="ink" x="186" y="154" text-anchor="middle">200</text>
  <text class="muted" x="186" y="238" text-anchor="middle">III</text>
  <rect class="geo" x="226" y="202" width="44" height="18" rx="3"/>
  <text class="ink" x="248" y="196" text-anchor="middle">&lt; 200</text>
  <text class="muted" x="248" y="238" text-anchor="middle">IV</text>
  <line class="base" x1="30" y1="220" x2="280" y2="220"/>
  <text class="muted" x="145" y="266" text-anchor="middle">offices and honours scale with the class;</text>
  <text class="muted" x="145" y="282" text-anchor="middle">one written law binds all four (eunomia)</text>
  <text class="title" x="465" y="30" text-anchor="middle">Arithmetic: one share each</text>
  <text class="muted" x="465" y="48" text-anchor="middle">Cleisthenes' ten tribes, 508/7</text>
  <rect class="ari" x="310" y="160" width="24" height="60" rx="3"/>
  <text class="muted" x="322" y="238" text-anchor="middle">I</text>
  <rect class="ari" x="341" y="160" width="24" height="60" rx="3"/>
  <text class="muted" x="353" y="238" text-anchor="middle">II</text>
  <rect class="ari" x="372" y="160" width="24" height="60" rx="3"/>
  <text class="muted" x="384" y="238" text-anchor="middle">III</text>
  <rect class="ari" x="403" y="160" width="24" height="60" rx="3"/>
  <text class="muted" x="415" y="238" text-anchor="middle">IV</text>
  <rect class="ari" x="434" y="160" width="24" height="60" rx="3"/>
  <text class="muted" x="446" y="238" text-anchor="middle">V</text>
  <rect class="ari" x="465" y="160" width="24" height="60" rx="3"/>
  <text class="muted" x="477" y="238" text-anchor="middle">VI</text>
  <rect class="ari" x="496" y="160" width="24" height="60" rx="3"/>
  <text class="muted" x="508" y="238" text-anchor="middle">VII</text>
  <rect class="ari" x="527" y="160" width="24" height="60" rx="3"/>
  <text class="muted" x="539" y="238" text-anchor="middle">VIII</text>
  <rect class="ari" x="558" y="160" width="24" height="60" rx="3"/>
  <text class="muted" x="570" y="238" text-anchor="middle">IX</text>
  <rect class="ari" x="589" y="160" width="24" height="60" rx="3"/>
  <text class="muted" x="601" y="238" text-anchor="middle">X</text>
  <line class="base" x1="305" y1="220" x2="625" y2="220"/>
  <text class="ink" x="465" y="150" text-anchor="middle">50 councillors each · one tenth of the year each</text>
  <text class="muted" x="465" y="266" text-anchor="middle">each tribe: a coastal, an inland and a city third;</text>
  <text class="muted" x="465" y="282" text-anchor="middle">every citizen counts once (isonomia)</text>
</svg>

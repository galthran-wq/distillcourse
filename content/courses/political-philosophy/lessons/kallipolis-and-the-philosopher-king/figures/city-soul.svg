<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .ink { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.6; font-size: 12px; }
    .title { fill: currentColor; font-weight: 600; font-size: 14px; }
    .line { stroke: currentColor; stroke-width: 1.4; fill: none; }
    .thin { stroke: currentColor; stroke-width: 1; fill: none; opacity: 0.35; }
    .guide { stroke: currentColor; stroke-width: 1; fill: none; opacity: 0.5; stroke-dasharray: 3 3; }
    .box { fill: none; stroke: currentColor; stroke-width: 1.2; }
    .blue { stroke: #4c8dd6; stroke-width: 2; fill: none; }
    .bluef { fill: #4c8dd6; }
    .bluet { fill: #4c8dd6; font-weight: 600; }
    .amb { stroke: #e2903a; stroke-width: 2.5; fill: none; }
    .ambf { fill: #e2903a; }
    .ambt { fill: #e2903a; font-weight: 600; }
    .shade { fill: currentColor; opacity: 0.08; }
    .dot { fill: currentColor; }
  </style>
  <text class="title" x="150" y="26" text-anchor="middle">the city</text>
  <text class="title" x="490" y="26" text-anchor="middle">the soul</text>
  <rect class="box" x="90.0" y="60" width="120" height="42" rx="4"/>
  <text class="ink" x="150" y="86.0" text-anchor="middle">rulers</text>
  <rect class="box" x="430.0" y="60" width="120" height="42" rx="4"/>
  <text class="ink" x="490" y="86.0" text-anchor="middle">reason</text>
  <text class="bluet" x="320" y="86.0" text-anchor="middle">wisdom</text>
  <rect class="box" x="65.0" y="130" width="170" height="42" rx="4"/>
  <text class="ink" x="150" y="156.0" text-anchor="middle">auxiliaries</text>
  <rect class="box" x="405.0" y="130" width="170" height="42" rx="4"/>
  <text class="ink" x="490" y="156.0" text-anchor="middle">spirit</text>
  <text class="bluet" x="320" y="156.0" text-anchor="middle">courage</text>
  <rect class="box" x="35.0" y="210" width="230" height="52" rx="4"/>
  <text class="ink" x="150" y="241.0" text-anchor="middle">producers</text>
  <rect class="box" x="375.0" y="210" width="230" height="52" rx="4"/>
  <text class="ink" x="490" y="241.0" text-anchor="middle">appetite</text>
  <path class="line" d="M 270.0 44.0 L 360.0 44.0"/>
  <path class="dot" d="M 370.0 44.0 L 360.0 49.0 L 360.0 39.0 Z"/>
  <text class="muted" x="320" y="36" text-anchor="middle">large letters → small letters</text>
  <path class="blue" d="M 626 60 L 634 60 L 634 262 L 626 262"/>
  <text class="bluet" x="612" y="290" text-anchor="end">temperance: all agree on who rules</text>
  <path class="amb" d="M 30 300 L 610 300"/>
  <text class="ambt" x="320" y="320" text-anchor="middle">justice: each part doing its own work</text>
</svg>

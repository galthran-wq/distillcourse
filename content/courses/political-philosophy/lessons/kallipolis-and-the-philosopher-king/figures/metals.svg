<svg viewBox="0 0 600 295" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .ink { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.6; font-size: 12px; }
    .title { fill: currentColor; font-weight: 600; font-size: 14px; }
    .line { stroke: currentColor; stroke-width: 1.4; fill: none; }
    .thin { stroke: currentColor; stroke-width: 1; fill: none; opacity: 0.35; }
    .guide { stroke: currentColor; stroke-width: 1; fill: none; opacity: 0.5; stroke-dasharray: 3 3; }
    .box { fill: none; stroke: currentColor; stroke-width: 1.2; }
    .blue { stroke: #4c8dd6; stroke-width: 2; fill: none; }
    .bluef { fill: #4c8dd6; }
    .bluet { fill: #4c8dd6; font-weight: 600; }
    .amb { stroke: #e2903a; stroke-width: 2.5; fill: none; }
    .ambf { fill: #e2903a; }
    .ambt { fill: #e2903a; font-weight: 600; }
    .shade { fill: currentColor; opacity: 0.08; }
    .dot { fill: currentColor; }
  </style>
  <rect class="box" x="40" y="40" width="360" height="50" rx="4"/>
  <text class="ink" x="52" y="60" text-anchor="start">gold: rulers</text>
  <circle class="dot" cx="200" cy="72" r="4" opacity="0.5"/>
  <circle class="dot" cx="236" cy="72" r="4" opacity="0.5"/>
  <circle class="dot" cx="272" cy="72" r="4" opacity="0.5"/>
  <circle class="dot" cx="308" cy="72" r="4" opacity="0.5"/>
  <circle class="dot" cx="344" cy="72" r="4" opacity="0.5"/>
  <rect class="box" x="40" y="110" width="360" height="50" rx="4"/>
  <text class="ink" x="52" y="130" text-anchor="start">silver: auxiliaries</text>
  <circle class="dot" cx="200" cy="142" r="4" opacity="0.5"/>
  <circle class="dot" cx="236" cy="142" r="4" opacity="0.5"/>
  <circle class="dot" cx="272" cy="142" r="4" opacity="0.5"/>
  <circle class="dot" cx="308" cy="142" r="4" opacity="0.5"/>
  <circle class="dot" cx="344" cy="142" r="4" opacity="0.5"/>
  <rect class="box" x="40" y="180" width="360" height="50" rx="4"/>
  <text class="ink" x="52" y="200" text-anchor="start">brass and iron: producers</text>
  <circle class="dot" cx="200" cy="212" r="4" opacity="0.5"/>
  <circle class="dot" cx="236" cy="212" r="4" opacity="0.5"/>
  <circle class="dot" cx="272" cy="212" r="4" opacity="0.5"/>
  <circle class="dot" cx="308" cy="212" r="4" opacity="0.5"/>
  <circle class="dot" cx="344" cy="212" r="4" opacity="0.5"/>
  <circle class="ambf" cx="380" cy="72" r="5"/>
    <path class="amb" d="M 388 74 C 450 90 450 190 395 212"/>
  <path class="ambf" d="M 392 213 L 404 204 L 405 217 Z"/>
  <circle class="ambf" cx="385" cy="212" r="5"/>
  <text class="ambt" x="450" y="115" text-anchor="start">golden parent,</text>
  <text class="ambt" x="450" y="131" text-anchor="start">iron child:</text>
  <text class="ambt" x="450" y="147" text-anchor="start">moved down</text>
  <circle class="bluef" cx="60" cy="212" r="5"/>
  <path class="blue" d="M 52 208 C 0 180 0 90 50 76"/>
  <path class="bluef" d="M 58 74 L 46 70 L 49 83 Z"/>
  <circle class="bluef" cx="66" cy="72" r="5"/>
  <text class="bluet" x="20" y="260" text-anchor="start">iron parents, golden child: moved up</text>
  <text class="muted" x="300" y="285" text-anchor="middle">a story told so that the order is accepted as nature</text>
</svg>

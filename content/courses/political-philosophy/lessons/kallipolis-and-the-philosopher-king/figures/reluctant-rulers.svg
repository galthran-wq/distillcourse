  <text class="title" x="155" y="26" text-anchor="middle">rulers eager to rule</text>
  <text class="title" x="465" y="26" text-anchor="middle">rulers reluctant to rule</text>
  <rect class="box" x="125" y="90" width="60" height="90" rx="3"/>
  <text class="muted" x="155" y="84" text-anchor="middle">office</text>
  <rect class="box" x="435" y="90" width="60" height="90" rx="3"/>

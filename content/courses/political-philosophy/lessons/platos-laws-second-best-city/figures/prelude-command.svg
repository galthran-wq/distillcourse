<svg viewBox="0 0 640 250" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .ink { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.6; font-size: 12px; }
    .title { fill: currentColor; font-weight: 600; font-size: 14px; }
    .line { stroke: currentColor; stroke-width: 1.4; fill: none; }
    .thin { stroke: currentColor; stroke-width: 1; fill: none; opacity: 0.35; }
    .guide { stroke: currentColor; stroke-width: 1.2; fill: none; opacity: 0.5; stroke-dasharray: 4 3; }
    .box { fill: none; stroke: currentColor; stroke-width: 1.2; }
    .ambbox { fill: #e2903a; fill-opacity: 0.12; stroke: #e2903a; stroke-width: 2; }
    .bluebox { fill: #4c8dd6; fill-opacity: 0.10; stroke: #4c8dd6; stroke-width: 1.5; }
    .amb { stroke: #e2903a; stroke-width: 2.2; fill: none; }
    .ambf { fill: #e2903a; }
    .ambt { fill: #e2903a; font-weight: 600; }
    .blue { stroke: #4c8dd6; stroke-width: 1.8; fill: none; }
    .bluef { fill: #4c8dd6; }
    .bluet { fill: #4c8dd6; font-weight: 600; }
    .dot { fill: currentColor; }
    .shade { fill: currentColor; opacity: 0.08; }
  </style>
  <text class="title" x="20" y="28">the slave doctor's law</text>
  <rect class="box" x="370" y="44" width="250" height="56" rx="4"/>
  <text class="ink" x="495" y="67" text-anchor="middle">marry between 30 and 35,</text>
  <text class="ink" x="495" y="85" text-anchor="middle">or pay a fine and lose honours</text>
  <text class="muted" x="20" y="76">command and penalty only</text>
  <text class="title" x="20" y="136">the free doctor's law</text>
  <rect class="ambbox" x="20" y="150" width="290" height="62" rx="4"/>
  <text class="ambt" x="34" y="170">preamble</text>
  <text class="ink" x="34" y="188">a man shares in immortality by leaving</text>
  <text class="ink" x="34" y="204">children; to refuse them is impiety</text>
  <path class="line" d="M 312 181 L 360 181"/>
  <path class="dot" d="M 368 181 L 358 176 L 358 186 Z"/>
  <rect class="box" x="370" y="153" width="250" height="56" rx="4"/>
  <text class="ink" x="495" y="176" text-anchor="middle">marry between 30 and 35,</text>
  <text class="ink" x="495" y="194" text-anchor="middle">or pay a fine and lose honours</text>
  <path class="guide" d="M 495 100 L 495 153"/>
  <text class="muted" x="320" y="238" text-anchor="middle">same command; one gives its reason first</text>
</svg>

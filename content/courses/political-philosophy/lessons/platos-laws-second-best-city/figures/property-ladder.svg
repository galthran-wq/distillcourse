<svg viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .ink { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.6; font-size: 12px; }
    .title { fill: currentColor; font-weight: 600; font-size: 14px; }
    .line { stroke: currentColor; stroke-width: 1.4; fill: none; }
    .thin { stroke: currentColor; stroke-width: 1; fill: none; opacity: 0.35; }
    .guide { stroke: currentColor; stroke-width: 1.2; fill: none; opacity: 0.5; stroke-dasharray: 4 3; }
    .box { fill: none; stroke: currentColor; stroke-width: 1.2; }
    .ambbox { fill: #e2903a; fill-opacity: 0.12; stroke: #e2903a; stroke-width: 2; }
    .bluebox { fill: #4c8dd6; fill-opacity: 0.10; stroke: #4c8dd6; stroke-width: 1.5; }
    .amb { stroke: #e2903a; stroke-width: 2.2; fill: none; }
    .ambf { fill: #e2903a; }
    .ambt { fill: #e2903a; font-weight: 600; }
    .blue { stroke: #4c8dd6; stroke-width: 1.8; fill: none; }
    .bluef { fill: #4c8dd6; }
    .bluet { fill: #4c8dd6; font-weight: 600; }
    .dot { fill: currentColor; }
    .shade { fill: currentColor; opacity: 0.08; }
  </style>
  <line class="line" x1="60" y1="260" x2="400" y2="260"/>
  <rect class="bluebox" x="80" y="215" width="50" height="45" rx="2"/>
  <rect class="bluebox" x="160" y="170" width="50" height="90" rx="2"/>
  <rect class="bluebox" x="240" y="125" width="50" height="135" rx="2"/>
  <rect class="bluebox" x="320" y="80" width="50" height="180" rx="2"/>
  <text class="muted" x="105" y="280" text-anchor="middle">first</text>
  <text class="muted" x="185" y="280" text-anchor="middle">second</text>
  <text class="muted" x="265" y="280" text-anchor="middle">third</text>
  <text class="muted" x="345" y="280" text-anchor="middle">fourth class</text>
  <text class="ink" x="105" y="242" text-anchor="middle">1×</text>
  <text class="ink" x="185" y="242" text-anchor="middle">2×</text>
  <text class="ink" x="265" y="242" text-anchor="middle">3×</text>
  <text class="ink" x="345" y="242" text-anchor="middle">4×</text>
  <line class="line" x1="60" y1="215" x2="400" y2="215" stroke-width="2"/>
  <text class="ink" x="410" y="212">floor: the lot,</text>
  <text class="muted" x="410" y="228">never sold, never lost</text>
  <line class="amb" x1="60" y1="80" x2="400" y2="80"/>
  <text class="ambt" x="410" y="84">ceiling: four times the lot</text>
  <rect class="box" x="320" y="30" width="50" height="50" rx="2" stroke-dasharray="4 3" opacity="0.7"/>
  <text class="muted" x="345" y="59" text-anchor="middle">excess</text>
  <path class="line" d="M 372 40 L 432 40"/>
  <path class="dot" d="M 440 40 L 430 35 L 430 45 Z"/>
  <text class="ink" x="446" y="44">to the state and the gods</text>
  <text class="muted" x="446" y="61">kept back: informer takes half</text>
</svg>

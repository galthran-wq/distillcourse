<svg viewBox="0 0 640 230" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .ink { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.6; font-size: 12px; }
    .title { fill: currentColor; font-weight: 600; font-size: 14px; }
    .line { stroke: currentColor; stroke-width: 1.4; fill: none; }
    .thin { stroke: currentColor; stroke-width: 1; fill: none; opacity: 0.35; }
    .guide { stroke: currentColor; stroke-width: 1.2; fill: none; opacity: 0.5; stroke-dasharray: 4 3; }
    .box { fill: none; stroke: currentColor; stroke-width: 1.2; }
    .ambbox { fill: #e2903a; fill-opacity: 0.12; stroke: #e2903a; stroke-width: 2; }
    .bluebox { fill: #4c8dd6; fill-opacity: 0.10; stroke: #4c8dd6; stroke-width: 1.5; }
    .amb { stroke: #e2903a; stroke-width: 2.2; fill: none; }
    .ambf { fill: #e2903a; }
    .ambt { fill: #e2903a; font-weight: 600; }
    .blue { stroke: #4c8dd6; stroke-width: 1.8; fill: none; }
    .bluef { fill: #4c8dd6; }
    .bluet { fill: #4c8dd6; font-weight: 600; }
    .dot { fill: currentColor; }
    .shade { fill: currentColor; opacity: 0.08; }
  </style>

  <circle class="box" cx="200" cy="110" r="16"/>
  <circle class="box" cx="280" cy="110" r="16"/>
  <circle class="box" cx="360" cy="110" r="16"/>
  <circle class="box" cx="440" cy="110" r="16"/>
  <circle class="box" cx="520" cy="110" r="16"/>
  <path class="line" d="M 218 110 L 254 110"/>
  <path class="dot" d="M 262 110 L 252 105 L 252 115 Z"/>
  <path class="line" d="M 298 110 L 334 110"/>
  <path class="dot" d="M 342 110 L 332 105 L 332 115 Z"/>
  <path class="line" d="M 378 110 L 414 110"/>
  <path class="dot" d="M 422 110 L 412 105 L 412 115 Z"/>
  <path class="line" d="M 458 110 L 494 110"/>
  <path class="dot" d="M 502 110 L 492 105 L 492 115 Z"/>
  <path class="guide" d="M 120 110 L 174 110"/>
  <text class="ambt" x="96" y="116" text-anchor="middle" font-size="22">?</text>
  <text class="ink" x="360" y="170" text-anchor="middle">each moved by another, and moving the next</text>
  <text class="ambt" x="96" y="160" text-anchor="middle">what moved</text>
  <text class="ambt" x="96" y="176" text-anchor="middle">the first?</text>
  <text class="title" x="20" y="28">2</text>

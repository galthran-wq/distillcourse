  <path class="ambf" d="M 70 120 L 66 108 L 78 110 Z"/>
  <text class="ink" x="360" y="170" text-anchor="middle">suppose all things at rest in one mass</text>
  <text class="ambt" x="96" y="160" text-anchor="middle">only a self-mover</text>

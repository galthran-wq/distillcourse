<svg viewBox="0 0 600 316" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .ink { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.6; font-size: 12px; }
    .title { fill: currentColor; font-weight: 600; font-size: 14px; }
    .line { stroke: currentColor; stroke-width: 1.4; fill: none; }
    .thin { stroke: currentColor; stroke-width: 1; fill: none; opacity: 0.35; }
    .guide { stroke: currentColor; stroke-width: 1.2; fill: none; opacity: 0.5; stroke-dasharray: 4 3; }
    .box { fill: none; stroke: currentColor; stroke-width: 1.2; }
    .ambbox { fill: #e2903a; fill-opacity: 0.12; stroke: #e2903a; stroke-width: 2; }
    .bluebox { fill: #4c8dd6; fill-opacity: 0.10; stroke: #4c8dd6; stroke-width: 1.5; }
    .amb { stroke: #e2903a; stroke-width: 2.2; fill: none; }
    .ambf { fill: #e2903a; }
    .ambt { fill: #e2903a; font-weight: 600; }
    .blue { stroke: #4c8dd6; stroke-width: 1.8; fill: none; }
    .bluef { fill: #4c8dd6; }
    .bluet { fill: #4c8dd6; font-weight: 600; }
    .dot { fill: currentColor; }
    .shade { fill: currentColor; opacity: 0.08; }
  </style>
  <rect class="ambbox" x="40" y="20" width="400" height="74" rx="5"/>
  <text class="ambt" x="56" y="42">first: "friends have all things in common"</text>
  <text class="ink" x="56" y="62">wives, children and property shared</text>
  <text class="ink" x="56" y="80">lived in by "Gods or sons of Gods"</text>
  <text class="ambt" x="460" y="62">the pattern</text>
  <path class="blue" d="M 240 138 L 240 106"/>
  <path class="bluef" d="M 240 97 L 235 107 L 245 107 Z"/>
  <text class="muted" x="252" y="123">"look to it, seek one like it"</text>
  <rect class="bluebox" x="40" y="140" width="400" height="74" rx="5"/>
  <text class="bluet" x="56" y="162">second: the city of the Laws</text>
  <text class="ink" x="56" y="182">private households, inalienable lots</text>
  <text class="ink" x="56" y="200">the law above the rulers</text>
  <text class="bluet" x="460" y="172">what ordinary</text>
  <text class="bluet" x="460" y="190">men can live in</text>
  <rect class="box" x="40" y="242" width="400" height="50" rx="5" stroke-dasharray="4 3" opacity="0.6"/>
  <text class="muted" x="56" y="272">third: promised, never described</text>
</svg>

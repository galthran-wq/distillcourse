<svg viewBox="0 0 660 260" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .ink { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.6; font-size: 12px; }
    .title { fill: currentColor; font-weight: 600; font-size: 14px; }
    .line { stroke: currentColor; stroke-width: 1.4; fill: none; }
    .thin { stroke: currentColor; stroke-width: 1; fill: none; opacity: 0.35; }
    .guide { stroke: currentColor; stroke-width: 1.2; fill: none; opacity: 0.5; stroke-dasharray: 4 3; }
    .box { fill: none; stroke: currentColor; stroke-width: 1.2; }
    .ambbox { fill: #e2903a; fill-opacity: 0.12; stroke: #e2903a; stroke-width: 2; }
    .bluebox { fill: #4c8dd6; fill-opacity: 0.10; stroke: #4c8dd6; stroke-width: 1.5; }
    .amb { stroke: #e2903a; stroke-width: 2.2; fill: none; }
    .ambf { fill: #e2903a; }
    .ambt { fill: #e2903a; font-weight: 600; }
    .blue { stroke: #4c8dd6; stroke-width: 1.8; fill: none; }
    .bluef { fill: #4c8dd6; }
    .bluet { fill: #4c8dd6; font-weight: 600; }
    .dot { fill: currentColor; }
    .shade { fill: currentColor; opacity: 0.08; }
  </style>
  <text class="title" x="20" y="26">the materialist</text>
  <rect class="box" x="20" y="38" width="140" height="52" rx="4"/>
  <text class="ink" x="90" y="60" text-anchor="middle">fire, water,</text>
  <text class="ink" x="90" y="76" text-anchor="middle">earth, air</text>
  <rect class="box" x="186" y="38" width="140" height="52" rx="4"/>
  <text class="ink" x="256" y="60" text-anchor="middle">sun, stars,</text>
  <text class="ink" x="256" y="76" text-anchor="middle">living bodies</text>
  <rect class="box" x="352" y="38" width="120" height="52" rx="4"/>
  <text class="ink" x="412" y="68" text-anchor="middle">art</text>
  <rect class="bluebox" x="498" y="38" width="142" height="52" rx="4"/>
  <text class="bluet" x="569" y="60" text-anchor="middle">gods, justice:</text>
  <text class="bluet" x="569" y="76" text-anchor="middle">by convention</text>
  <path class="line" d="M 162 64 L 178 64"/><path class="dot" d="M 186 64 L 177 59 L 177 69 Z"/>
  <path class="line" d="M 328 64 L 344 64"/><path class="dot" d="M 352 64 L 343 59 L 343 69 Z"/>
  <path class="line" d="M 474 64 L 490 64"/><path class="dot" d="M 498 64 L 489 59 L 489 69 Z"/>
  <text class="muted" x="90" y="108" text-anchor="middle">"nature" (and chance)</text>
  <text class="title" x="20" y="150">the Athenian</text>
  <rect class="ambbox" x="20" y="162" width="140" height="52" rx="4"/>
  <text class="ambt" x="90" y="184" text-anchor="middle">soul:</text>
  <text class="ambt" x="90" y="200" text-anchor="middle">self-motion</text>
  <rect class="ambbox" x="186" y="162" width="140" height="52" rx="4"/>
  <text class="ambt" x="256" y="184" text-anchor="middle">mind, art,</text>
  <text class="ambt" x="256" y="200" text-anchor="middle">law</text>
  <rect class="box" x="352" y="162" width="120" height="52" rx="4"/>
  <text class="ink" x="412" y="184" text-anchor="middle">hard and soft,</text>
  <text class="ink" x="412" y="200" text-anchor="middle">heavy and light</text>
  <rect class="box" x="498" y="162" width="142" height="52" rx="4"/>
  <text class="ink" x="569" y="184" text-anchor="middle">bodies,</text>
  <text class="ink" x="569" y="200" text-anchor="middle">"born to obey"</text>
  <path class="line" d="M 162 188 L 178 188"/><path class="dot" d="M 186 188 L 177 183 L 177 193 Z"/>
  <path class="line" d="M 328 188 L 344 188"/><path class="dot" d="M 352 188 L 343 183 L 343 193 Z"/>
  <path class="line" d="M 474 188 L 490 188"/><path class="dot" d="M 498 188 L 489 183 L 489 193 Z"/>
  <text class="muted" x="90" y="232" text-anchor="middle">"nature" in the truest sense</text>
  <path class="guide" d="M 545 92 C 520 150 330 125 270 160"/>
  <text class="muted" x="350" y="122" text-anchor="middle">last becomes first</text>
</svg>

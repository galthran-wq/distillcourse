<svg viewBox="0 0 640 430" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="11.5">
  <style>
    .ink { fill: currentColor; }
    .head { fill: currentColor; font-weight: 600; font-size: 13px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 10px; font-style: italic; }
    .sec { fill: currentColor; opacity: 0.6; font-size: 11px; letter-spacing: 0.08em; }
    .box { fill: none; stroke: currentColor; stroke-width: 1.2; }
    .amb { fill: #e2903a; fill-opacity: 0.12; stroke: #e2903a; stroke-width: 2; }
    .ambt { fill: #e2903a; font-weight: 600; font-size: 13px; }
    .blue { fill: #4c8dd6; fill-opacity: 0.10; stroke: #4c8dd6; stroke-width: 1.5; }
    .bluet { fill: #4c8dd6; font-weight: 600; font-size: 13px; }
    .guide { stroke: currentColor; stroke-width: 1; opacity: 0.45; stroke-dasharray: 3 3; fill: none; }
    .arrow { stroke: #4c8dd6; stroke-width: 1.8; fill: none; }
    .arrowh { fill: #4c8dd6; }
  </style>
  <text class="sec" x="12" y="22">WHO GOVERNED</text>

  <rect class="box" x="12" y="34" width="140" height="120" rx="5"/>
  <text class="head" x="82" y="56" text-anchor="middle">two kings</text>
  <text class="ink" x="82" y="76" text-anchor="middle">hereditary, from</text>
  <text class="ink" x="82" y="91" text-anchor="middle">two royal houses;</text>
  <text class="ink" x="82" y="106" text-anchor="middle">generals in war</text>
  <text class="muted" x="82" y="144" text-anchor="middle">Herodotus, Xenophon</text>

  <rect class="box" x="160" y="34" width="150" height="120" rx="5"/>
  <text class="head" x="235" y="56" text-anchor="middle">gerousia</text>
  <text class="ink" x="235" y="76" text-anchor="middle">28 elders over 60,</text>
  <text class="ink" x="235" y="91" text-anchor="middle">for life, with the</text>
  <text class="ink" x="235" y="106" text-anchor="middle">2 kings; proposes</text>
  <text class="ink" x="235" y="121" text-anchor="middle">measures</text>
  <text class="muted" x="235" y="144" text-anchor="middle">Plutarch, Aristotle</text>

  <rect class="amb" x="318" y="34" width="170" height="120" rx="5"/>
  <text class="ambt" x="403" y="56" text-anchor="middle">five ephors</text>
  <text class="ink" x="403" y="76" text-anchor="middle">elected yearly from</text>
  <text class="ink" x="403" y="91" text-anchor="middle">all citizens; every</text>
  <text class="ink" x="403" y="106" text-anchor="middle">magistrate answers</text>
  <text class="ink" x="403" y="121" text-anchor="middle">to them</text>
  <text class="muted" x="403" y="144" text-anchor="middle">Aristotle, Xenophon, Thucydides</text>

  <rect class="box" x="496" y="34" width="132" height="120" rx="5"/>
  <text class="head" x="562" y="56" text-anchor="middle">assembly</text>
  <text class="ink" x="562" y="76" text-anchor="middle">all the equals;</text>
  <text class="ink" x="562" y="91" text-anchor="middle">decides by shout;</text>
  <text class="ink" x="562" y="106" text-anchor="middle">no motions from</text>
  <text class="ink" x="562" y="121" text-anchor="middle">the floor</text>
  <text class="muted" x="562" y="144" text-anchor="middle">Plutarch, Thucydides</text>

  <path class="guide" d="M 12 176 L 628 176"/>
  <text class="sec" x="12" y="200">WHO LIVED ON WHOM</text>

  <rect class="box" x="12" y="214" width="160" height="100" rx="5"/>
  <text class="head" x="92" y="236" text-anchor="middle">the mess</text>
  <text class="ink" x="92" y="256" text-anchor="middle">monthly barley, wine,</text>
  <text class="ink" x="92" y="271" text-anchor="middle">cheese, figs; unpaid,</text>
  <text class="ink" x="92" y="286" text-anchor="middle">citizenship lost</text>
  <text class="muted" x="92" y="305" text-anchor="middle">Plutarch, Aristotle</text>

  <rect class="box" x="190" y="214" width="260" height="100" rx="5"/>
  <text class="head" x="320" y="236" text-anchor="middle">the equals (homoioi)</text>
  <text class="ink" x="320" y="256" text-anchor="middle">each holds a lot (kleros) he does not</text>
  <text class="ink" x="320" y="271" text-anchor="middle">work; eats in a mess; raised from</text>
  <text class="ink" x="320" y="286" text-anchor="middle">seven in the agoge; a soldier for life</text>
  <text class="muted" x="320" y="305" text-anchor="middle">all five witnesses</text>
  <path class="guide" d="M 172 264 L 190 264"/>

  <rect class="box" x="468" y="214" width="160" height="100" rx="5"/>
  <text class="head" x="548" y="236" text-anchor="middle">perioeci</text>
  <text class="ink" x="548" y="256" text-anchor="middle">free, voteless,</text>
  <text class="ink" x="548" y="271" text-anchor="middle">in their own towns;</text>
  <text class="ink" x="548" y="286" text-anchor="middle">trade, craft, army</text>
  <text class="muted" x="548" y="305" text-anchor="middle">Aristotle, Thucydides</text>

  <rect class="blue" x="190" y="350" width="260" height="74" rx="5"/>
  <text class="bluet" x="320" y="370" text-anchor="middle">helots</text>
  <text class="ink" x="320" y="388" text-anchor="middle">serfs bound to the lots: conquered</text>
  <text class="ink" x="320" y="402" text-anchor="middle">Messenians and Laconians</text>
  <text class="muted" x="320" y="417" text-anchor="middle">Thucydides, Aristotle, Plutarch</text>
  <path class="arrow" d="M 320 348 L 320 324"/>
  <path class="arrowh" d="M 320 316 L 315 326 L 325 326 Z"/>
  <text class="ink" x="330" y="340" font-size="11">part of the crop</text>
</svg>

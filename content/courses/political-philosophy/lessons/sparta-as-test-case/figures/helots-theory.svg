<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .ink { fill: currentColor; }
    .head { fill: currentColor; font-weight: 600; font-size: 13px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; font-style: italic; }
    .box { fill: none; stroke: currentColor; stroke-width: 1.2; }
    .faint { fill: none; stroke: currentColor; stroke-width: 1; opacity: 0.35; }
    .ambbox { fill: #e2903a; fill-opacity: 0.12; stroke: #e2903a; stroke-width: 2; }
    .ambt { fill: #e2903a; font-weight: 600; }
    .amb { stroke: #e2903a; stroke-width: 2.2; fill: none; }
    .ambf { fill: #e2903a; }
    .bluebox { fill: #4c8dd6; fill-opacity: 0.08; stroke: #4c8dd6; stroke-width: 1.5; }
  </style>
  <text class="head" x="140" y="24" text-anchor="middle">Politics I.6: the theory</text>
  <text class="head" x="470" y="24" text-anchor="middle">Politics II.5, II.9, II.10: the helots</text>

  <rect class="faint" x="30" y="50" width="220" height="80" rx="5"/>
  <text class="ink" x="140" y="76" text-anchor="middle">master and slave by nature:</text>
  <text class="ink" x="140" y="94" text-anchor="middle">"friends", with</text>
  <text class="ink" x="140" y="112" text-anchor="middle">"a common interest"</text>

  <rect class="ambbox" x="30" y="160" width="220" height="80" rx="5"/>
  <text class="ambt" x="140" y="188" text-anchor="middle">by "law and force":</text>
  <text class="ambt" x="140" y="208" text-anchor="middle">"the reverse is true"</text>

  <rect class="bluebox" x="340" y="50" width="270" height="190" rx="5"/>
  <text class="ink" x="356" y="76">"always lying in wait" for</text>
  <text class="ink" x="368" y="92">their masters' misfortunes</text>
  <text class="ink" x="356" y="116">if loose, "insolent": they think</text>
  <text class="ink" x="368" y="132">they are "as good as their masters"</text>
  <text class="ink" x="356" y="156">if harsh, they "hate and conspire"</text>
  <text class="ink" x="356" y="180">"perpetually revolting"</text>
  <text class="ink" x="356" y="204">"the secret of managing" them</text>
  <text class="ink" x="368" y="220">not found</text>

  <path class="amb" d="M 338 150 C 300 160, 290 190, 258 198"/>
  <path class="ambf" d="M 250 200 L 260 193 L 262 203 Z"/>

  <text class="muted" x="475" y="262" text-anchor="middle">the word "nature" is never used of them;</text>
  <text class="muted" x="475" y="277" text-anchor="middle">they are a problem of management</text>
  <text class="muted" x="140" y="262" text-anchor="middle">conquest confers no title (I.6)</text>
</svg>

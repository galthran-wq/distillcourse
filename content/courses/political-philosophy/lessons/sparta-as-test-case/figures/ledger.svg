<svg viewBox="0 0 640 336" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .ink { fill: currentColor; }
    .head { fill: currentColor; font-weight: 600; font-size: 12.5px; }
    .row { fill: currentColor; font-weight: 600; }
    .rule { stroke: currentColor; stroke-width: 1; opacity: 0.35; }
    .heavy { stroke: currentColor; stroke-width: 1.6; }
    .blank { fill: #e2903a; fill-opacity: 0.10; stroke: #e2903a; stroke-width: 1.2; stroke-dasharray: 4 3; }
  </style>
  <text class="head" x="14" y="24">theory</text>
  <text class="head" x="150" y="24">the theory predicts</text>
  <text class="head" x="350" y="24">the record shows</text>
  <text class="head" x="580" y="24" text-anchor="middle">fit?</text>
  <path class="heavy" d="M 10 34 L 630 34"/>

  <text class="row" x="14" y="62">mixed</text>
  <text class="row" x="14" y="77">constitution</text>
  <text class="ink" x="150" y="62">a mixed regime outlasts</text>
  <text class="ink" x="150" y="77">a simple one</text>
  <text class="ink" x="350" y="62">four centuries without a tyrant;</text>
  <text class="ink" x="350" y="77">every part corrupt</text>
  <rect class="blank" x="545" y="46" width="70" height="40" rx="4"/>
  <path class="rule" d="M 10 94 L 630 94"/>

  <text class="row" x="14" y="122">single virtue</text>
  <text class="row" x="14" y="137">(Aristotle)</text>
  <text class="ink" x="150" y="122">a city trained for war</text>
  <text class="ink" x="150" y="137">falls once it has won</text>
  <text class="ink" x="350" y="122">won 404; one defeat 371;</text>
  <text class="ink" x="350" y="137">Messenia lost; the roll emptied</text>
  <rect class="blank" x="545" y="106" width="70" height="40" rx="4"/>
  <path class="rule" d="M 10 154 L 630 154"/>

  <text class="row" x="14" y="182">timocracy</text>
  <text class="row" x="14" y="197">(Plato)</text>
  <text class="ink" x="150" y="182">honour decays into</text>
  <text class="ink" x="150" y="197">the love of money</text>
  <text class="ink" x="350" y="182">gold after 404; the citizen</text>
  <text class="ink" x="350" y="197">roll shrinking before it</text>
  <rect class="blank" x="545" y="166" width="70" height="40" rx="4"/>
  <path class="rule" d="M 10 214 L 630 214"/>

  <text class="row" x="14" y="242">natural</text>
  <text class="row" x="14" y="257">slavery</text>
  <text class="ink" x="150" y="242">master and slave by nature</text>
  <text class="ink" x="150" y="257">share an interest</text>
  <text class="ink" x="350" y="242">helots "lying in wait"; krypteia;</text>
  <text class="ink" x="350" y="257">never called slaves by nature</text>
  <rect class="blank" x="545" y="226" width="70" height="40" rx="4"/>
  <path class="rule" d="M 10 274 L 630 274"/>

  <text class="row" x="14" y="302">household</text>
  <text class="row" x="14" y="317">hierarchy</text>
  <text class="ink" x="150" y="302">the husband rules</text>
  <text class="ink" x="150" y="317">by nature</text>
  <text class="ink" x="350" y="302">rule lapsed while the men</text>
  <text class="ink" x="350" y="317">were away at war</text>
  <rect class="blank" x="545" y="286" width="70" height="40" rx="4"/>
</svg>

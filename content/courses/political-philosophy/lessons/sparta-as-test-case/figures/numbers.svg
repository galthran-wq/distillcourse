<svg viewBox="0 0 650 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .ink { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .axis { stroke: currentColor; stroke-width: 1.2; fill: none; }
    .tick { stroke: currentColor; stroke-width: 1; opacity: 0.6; }
    .guide { stroke: currentColor; stroke-width: 1; opacity: 0.45; stroke-dasharray: 3 3; fill: none; }
    .pt { fill: #e2903a; }
    .hollow { fill: none; stroke: #e2903a; stroke-width: 2; }
    .evt { stroke: #4c8dd6; stroke-width: 2.4; }
    .trend { stroke: #e2903a; stroke-width: 1.8; stroke-dasharray: 6 4; fill: none; }
    .ambt { fill: #e2903a; font-weight: 600; }
    .note { fill: currentColor; font-style: italic; opacity: 0.7; font-size: 11.5px; }
  </style>
  <path class="axis" d="M 60 250 L 630 250"/>
  <path class="axis" d="M 60 250 L 60 30"/>
  <text class="muted" x="52" y="254" text-anchor="end">0</text>
  <path class="tick" d="M 56 145 L 60 145"/><text class="muted" x="52" y="149" text-anchor="end">5,000</text>
  <path class="tick" d="M 56 40 L 60 40"/><text class="muted" x="52" y="44" text-anchor="end">10,000</text>
  <path class="tick" d="M 60 250 L 60 255"/><text class="muted" x="60" y="268" text-anchor="middle">500 BC</text>
  <path class="tick" d="M 225 250 L 225 255"/><text class="muted" x="225" y="268" text-anchor="middle">450</text>
  <path class="tick" d="M 389 250 L 389 255"/><text class="muted" x="389" y="268" text-anchor="middle">400</text>
  <path class="tick" d="M 554 250 L 554 255"/><text class="muted" x="554" y="268" text-anchor="middle">350</text>

  <path class="evt" d="M 376 244 L 376 256"/>
  <text class="muted" x="376" y="286" text-anchor="middle">404: Sparta wins</text>
  <path class="evt" d="M 485 244 L 485 256"/>
  <text class="muted" x="485" y="286" text-anchor="middle">371: Leuctra</text>

  <path class="trend" d="M 126 82 L 587 229"/>
  <circle class="pt" cx="126" cy="82" r="5"/>
  <text class="ink" x="136" y="62">480: "about eight thousand men"</text>
  <text class="muted" x="136" y="76">Herodotus, in an exiled king's mouth</text>

  <circle class="hollow" cx="330" cy="174" r="5"/>
  <text class="ink" x="320" y="198" text-anchor="end">418, Mantinea: about 3,600 in the line</text>
  <text class="muted" x="320" y="212" text-anchor="end">Thucydides' reckoning, not citizens only:</text>
  <text class="muted" x="320" y="226" text-anchor="end">"the number was not known"</text>

  <circle class="pt" cx="587" cy="229" r="5"/>
  <path class="guide" d="M 492 238 L 620 238"/>
  <text class="ink" x="630" y="136" text-anchor="end">in Aristotle's day: below 1000 citizens</text>
  <text class="muted" x="630" y="152" text-anchor="end">Aristotle; undated in his text,</text>
  <text class="muted" x="630" y="166" text-anchor="end">after Leuctra by inference</text>
  <path class="guide" d="M 587 174 L 587 220"/>

  <text class="ambt" x="70" y="243">more than an eightfold fall in about 150 years</text>
  <text class="note" x="630" y="24" text-anchor="end">every figure is a report, not a census</text>
</svg>

<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .ink { fill: currentColor; }
    .head { fill: currentColor; font-weight: 600; font-size: 12.5px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .box { fill: none; stroke: currentColor; stroke-width: 1.2; }
    .amb { fill: #e2903a; fill-opacity: 0.12; stroke: #e2903a; stroke-width: 2; }
    .ambt { fill: #e2903a; font-weight: 600; }
    .line { stroke: currentColor; stroke-width: 1.3; fill: none; }
    .lineh { fill: currentColor; }
    .blue { stroke: #4c8dd6; stroke-width: 1.8; fill: none; }
    .bluef { fill: #4c8dd6; }
    .bluet { fill: #4c8dd6; font-weight: 600; font-size: 11px; }
    .guide { stroke: currentColor; stroke-width: 1; opacity: 0.4; stroke-dasharray: 3 3; fill: none; }
    .brace { stroke: currentColor; stroke-width: 1.2; opacity: 0.7; fill: none; }
  </style>
  <!-- reign bracket over panels 2 and 3 -->
  <path class="brace" d="M 232 26 L 232 20 L 628 20 L 628 26"/>
  <text class="head" x="430" y="14" text-anchor="middle">one reign: Theopompus, c. 700 BC</text>
  <text class="muted" x="110" y="14" text-anchor="middle">Lycurgus (legendary)</text>

  <text class="head" x="110" y="42" text-anchor="middle">the Great Rhetra</text>
  <text class="head" x="320" y="42" text-anchor="middle">the rider</text>
  <text class="muted" x="320" y="57" text-anchor="middle">curbs the people</text>
  <text class="head" x="530" y="42" text-anchor="middle">the ephors</text>
  <text class="muted" x="530" y="57" text-anchor="middle">curb the kings and elders</text>

  <!-- the 130-year gap -->
  <path class="guide" d="M 215 30 L 215 262"/>
  <text class="muted" x="215" y="278" text-anchor="middle">about 130 years</text>
  <!-- within one reign: order unknown -->
  <path class="guide" d="M 436 66 L 436 262"/>
  <text class="muted" x="436" y="278" text-anchor="middle">order within the reign: unknown</text>

  <rect class="box" x="40" y="72" width="140" height="48" rx="5"/>
  <text class="ink" x="110" y="92" text-anchor="middle">council of thirty</text>
  <text class="muted" x="110" y="108" text-anchor="middle">2 kings + 28 elders</text>
  <path class="line" d="M 110 122 L 110 188"/>
  <path class="lineh" d="M 110 196 L 105 186 L 115 186 Z"/>
  <text class="ink" x="118" y="162">propose</text>
  <rect class="box" x="40" y="198" width="140" height="56" rx="5"/>
  <text class="ink" x="110" y="220" text-anchor="middle">assembly</text>
  <text class="ink" x="110" y="238" text-anchor="middle" font-weight="600">final decision</text>

  <rect class="box" x="250" y="72" width="140" height="48" rx="5"/>
  <text class="ink" x="320" y="92" text-anchor="middle">council of thirty</text>
  <text class="muted" x="320" y="108" text-anchor="middle">2 kings + 28 elders</text>
  <path class="line" d="M 300 122 L 300 188"/>
  <path class="lineh" d="M 300 196 L 295 186 L 305 186 Z"/>
  <text class="ink" x="262" y="162" text-anchor="middle">propose</text>
  <path class="blue" d="M 345 198 C 362 172, 362 146, 345 128"/>
  <path class="bluef" d="M 340 122 L 352 126 L 344 134 Z"/>
  <text class="bluet" x="368" y="154">if crooked,</text>
  <text class="bluet" x="368" y="168">set it right</text>
  <rect class="box" x="250" y="198" width="140" height="56" rx="5"/>
  <text class="ink" x="320" y="220" text-anchor="middle">assembly</text>
  <text class="muted" x="320" y="238" text-anchor="middle">decision subject to veto</text>

  <rect class="box" x="440" y="72" width="120" height="48" rx="5"/>
  <text class="ink" x="500" y="92" text-anchor="middle">council of thirty</text>
  <text class="muted" x="500" y="108" text-anchor="middle">2 kings + 28 elders</text>
  <rect class="amb" x="566" y="72" width="66" height="48" rx="5"/>
  <text class="ambt" x="599" y="92" text-anchor="middle" font-size="12">5 ephors</text>
  <text class="ink" x="599" y="108" text-anchor="middle" font-size="10.5">yearly, all</text>
  <path class="line" d="M 500 122 L 500 188"/>
  <path class="lineh" d="M 500 196 L 495 186 L 505 186 Z"/>
  <text class="ink" x="490" y="162" text-anchor="end">propose</text>
  <path class="blue" d="M 545 198 C 562 172, 556 146, 545 128"/>
  <path class="bluef" d="M 541 122 L 552 126 L 545 134 Z"/>
  <rect class="box" x="440" y="198" width="180" height="56" rx="5"/>
  <text class="ink" x="530" y="220" text-anchor="middle">assembly</text>
  <text class="muted" x="530" y="238" text-anchor="middle">elects the ephors</text>
  <text class="muted" x="320" y="296" text-anchor="middle">one reign moves both ways: a veto over the people, overseers over kings and elders</text>
</svg>

<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .ink { fill: currentColor; }
    .head { fill: currentColor; font-weight: 600; font-size: 13px; }
    .muted { fill: currentColor; opacity: 0.5; font-size: 10.5px; font-style: italic; }
    .box { fill: none; stroke: currentColor; stroke-width: 1.2; }
    .amb { stroke: #e2903a; stroke-width: 2; fill: none; }
    .ambf { fill: #e2903a; }
    .ambt { fill: #e2903a; font-weight: 600; font-size: 11.5px; }
    .blue { stroke: #4c8dd6; stroke-width: 2; fill: none; }
    .bluef { fill: #4c8dd6; }
    .bluet { fill: #4c8dd6; font-weight: 600; font-size: 11.5px; }
    .bluebox { fill: #4c8dd6; fill-opacity: 0.10; stroke: #4c8dd6; stroke-width: 1.5; }
    .guide { stroke: currentColor; stroke-width: 1; opacity: 0.4; stroke-dasharray: 3 3; fill: none; }
    .foot { fill: currentColor; font-weight: 600; font-size: 13px; }
  </style>
  <text class="head" x="160" y="22" text-anchor="middle">Laws III: three saviours</text>
  <text class="head" x="480" y="22" text-anchor="middle">Politics II.9: all the parts must wish it</text>
  <path class="guide" d="M 320 10 L 320 310"/>

  <rect class="box" x="40" y="50" width="100" height="40" rx="5"/>
  <text class="ink" x="90" y="75" text-anchor="middle">two kings</text>
  <rect class="box" x="40" y="130" width="100" height="40" rx="5"/>
  <text class="ink" x="90" y="155" text-anchor="middle">28 elders</text>
  <rect class="box" x="40" y="210" width="100" height="40" rx="5"/>
  <text class="ink" x="90" y="235" text-anchor="middle">5 ephors</text>
  <text class="ambt" x="156" y="58">a god gives two</text>
  <text class="ambt" x="156" y="72">kings, not one</text>
  <path class="amb" d="M 142 150 C 180 140, 180 100, 146 84"/>
  <path class="ambf" d="M 141 81 L 152 82 L 147 91 Z"/>
  <text class="ambt" x="178" y="122">age tempers</text>
  <text class="ambt" x="178" y="136">pride</text>
  <path class="amb" d="M 142 230 C 190 220, 190 180, 146 164"/>
  <path class="ambf" d="M 141 161 L 152 162 L 147 171 Z"/>
  <text class="ambt" x="190" y="204">a curb on the</text>
  <text class="ambt" x="190" y="218">"swelling" power</text>
  <text class="foot" x="160" y="290" text-anchor="middle">a balance of virtues</text>

  <rect class="box" x="350" y="50" width="100" height="40" rx="5"/>
  <text class="ink" x="400" y="75" text-anchor="middle">two kings</text>
  <text class="muted" x="400" y="104" text-anchor="middle">distrusted by the lawgiver</text>
  <rect class="box" x="350" y="130" width="100" height="40" rx="5"/>
  <text class="ink" x="400" y="155" text-anchor="middle">28 elders</text>
  <text class="muted" x="400" y="184" text-anchor="middle">bribed, answer to no one</text>
  <rect class="box" x="350" y="210" width="100" height="40" rx="5"/>
  <text class="ink" x="400" y="235" text-anchor="middle">5 ephors</text>
  <text class="muted" x="400" y="264" text-anchor="middle">poor, bribable, tyrannical</text>
  <rect class="bluebox" x="540" y="128" width="92" height="44" rx="5"/>
  <text class="bluet" x="586" y="148" text-anchor="middle">the regime</text>
  <text class="bluet" x="586" y="162" text-anchor="middle">lasts</text>
  <path class="blue" d="M 452 70 C 500 70, 520 120, 536 140"/>
  <path class="bluef" d="M 540 145 L 529 141 L 536 134 Z"/>
  <text class="bluet" x="470" y="62">honour</text>
  <path class="blue" d="M 452 150 L 532 150"/>
  <path class="bluef" d="M 540 150 L 530 145 L 530 155 Z"/>
  <text class="bluet" x="458" y="143">a council seat</text>
  <path class="blue" d="M 452 230 C 500 230, 520 180, 536 160"/>
  <path class="bluef" d="M 540 155 L 536 166 L 529 159 Z"/>
  <text class="bluet" x="470" y="246">eligible to</text>
  <text class="bluet" x="470" y="259">the ephorate</text>
  <text class="foot" x="480" y="290" text-anchor="middle">a balance of interests</text>
</svg>

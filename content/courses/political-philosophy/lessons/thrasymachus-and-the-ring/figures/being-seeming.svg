<svg viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .ink { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .head { fill: currentColor; font-weight: 600; font-size: 13px; }
    .cell { fill: none; stroke: currentColor; stroke-width: 1; opacity: 0.4; }
    .grey { fill: currentColor; opacity: 0.06; }
    .hl { fill: #e2903a; fill-opacity: 0.15; stroke: #e2903a; stroke-width: 2.5; }
    .bl { fill: #4c8dd6; fill-opacity: 0.12; stroke: #4c8dd6; stroke-width: 2; }
    .acct { fill: #e2903a; font-weight: 600; }
    .blt { fill: #4c8dd6; font-weight: 600; }
  </style>
  <text class="head" x="250" y="30" text-anchor="middle">seems just</text>
  <text class="head" x="480" y="30" text-anchor="middle">seems unjust</text>
  <text class="head" x="20" y="110">is just</text>
  <text class="head" x="20" y="230">is unjust</text>
  <rect class="grey" x="140" y="45" width="220" height="115" rx="5"/>
  <rect class="cell" x="140" y="45" width="220" height="115" rx="5"/>
  <text class="muted" x="250" y="108" text-anchor="middle">not in the test</text>
  <rect class="bl" x="370" y="45" width="220" height="115" rx="5"/>
  <text class="blt" x="480" y="72" text-anchor="middle">the just man</text>
  <text class="ink" x="480" y="98" text-anchor="middle">scourged, racked, bound,</text>
  <text class="ink" x="480" y="118" text-anchor="middle">eyes burnt out,</text>
  <text class="ink" x="480" y="138" text-anchor="middle">impaled</text>
  <rect class="hl" x="140" y="170" width="220" height="115" rx="5"/>
  <text class="acct" x="250" y="192" text-anchor="middle">the unjust man</text>
  <text class="ink" x="250" y="214" text-anchor="middle">rules the city, marries whom</text>
  <text class="ink" x="250" y="231" text-anchor="middle">he will, wins every contract,</text>
  <text class="ink" x="250" y="248" text-anchor="middle">rich, lavish to the gods</text>
  <text class="muted" x="250" y="272" text-anchor="middle">the cell the many choose</text>
  <rect class="grey" x="370" y="170" width="220" height="115" rx="5"/>
  <rect class="cell" x="370" y="170" width="220" height="115" rx="5"/>
  <text class="muted" x="480" y="232" text-anchor="middle">not in the test</text>
</svg>

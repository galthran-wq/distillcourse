<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .ink { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.6; font-size: 12px; }
    .title { fill: currentColor; font-weight: 600; font-size: 14px; }
    .ar { stroke: #4c8dd6; stroke-width: 2; fill: none; }
    .af { fill: #4c8dd6; }
    .acc { stroke: #e2903a; stroke-width: 2.5; fill: none; }
    .accf { fill: #e2903a; }
    .acct { fill: #e2903a; font-weight: 600; }
    .div { stroke: currentColor; stroke-width: 1; opacity: 0.25; }
  </style>
  <line class="div" x1="320" y1="15" x2="320" y2="250"/>
  <text class="title" x="160" y="30" text-anchor="middle">Socrates: a craft serves its object</text>
  <text class="ink" x="20" y="75">physician</text>
  <path class="ar" d="M 112 71 L 200 71"/><path class="af" d="M 198 65 L 210 71 L 198 77 Z"/>
  <text class="ink" x="218" y="75">the body</text>
  <text class="ink" x="20" y="125">pilot</text>
  <path class="ar" d="M 112 121 L 200 121"/><path class="af" d="M 198 115 L 210 121 L 198 127 Z"/>
  <text class="ink" x="218" y="125">the sailors</text>
  <text class="ink" x="20" y="175">ruler (strict)</text>
  <path class="ar" d="M 112 171 L 200 171"/><path class="af" d="M 198 165 L 210 171 L 198 177 Z"/>
  <text class="ink" x="218" y="175">the ruled</text>
  <text class="muted" x="160" y="230" text-anchor="middle">each arrow ends in the good of the object</text>
  <text class="title" x="480" y="30" text-anchor="middle">Thrasymachus: look at the shepherd</text>
  <text class="ink" x="340" y="75">physician</text>
  <path class="ar" d="M 432 71 L 520 71"/><path class="af" d="M 518 65 L 530 71 L 518 77 Z"/>
  <text class="ink" x="538" y="75">the body</text>
  <text class="ink" x="340" y="125">pilot</text>
  <path class="ar" d="M 432 121 L 520 121"/><path class="af" d="M 518 115 L 530 121 L 518 127 Z"/>
  <text class="ink" x="538" y="125">the sailors</text>
  <text class="ink" x="340" y="175">shepherd</text>
  <path class="ar" d="M 432 171 L 520 171"/><path class="af" d="M 518 165 L 530 171 L 518 177 Z"/>
  <text class="ink" x="538" y="175">the sheep</text>
  <path class="acc" d="M 560 182 C 560 225 420 225 400 196"/><path class="accf" d="M 395 205 L 396 190 L 408 198 Z"/>
  <text class="acct" x="480" y="240" text-anchor="middle">back to the shepherd's table</text>
</svg>

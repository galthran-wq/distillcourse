<svg viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .ink { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.6; font-size: 12px; }
    .title { fill: currentColor; font-weight: 600; font-size: 14px; }
    .def { fill: #e2903a; fill-opacity: 0.12; stroke: #e2903a; stroke-width: 1.5; }
    .case { fill: #4c8dd6; fill-opacity: 0.12; stroke: #4c8dd6; stroke-width: 1.5; }
    .chip { fill: none; stroke: currentColor; stroke-width: 1; opacity: 0.6; }
    .strike { stroke: currentColor; stroke-width: 2.5; }
    .arrow { stroke: #4c8dd6; stroke-width: 2; fill: none; }
    .afill { fill: #4c8dd6; }
    .dead { opacity: 0.4; }
  </style>
  <g>
    <rect class="def" x="20" y="30" width="300" height="70" rx="5"/>
    <text class="muted" x="34" y="52">definition 1 (Cephalus)</text>
    <text class="title" x="34" y="74">justice = telling the truth</text>
    <text class="title" x="34" y="92">and paying back what you owe</text>
  </g>
  <rect class="case" x="356" y="30" width="234" height="70" rx="5"/>
  <text class="muted" x="370" y="52">one case</text>
  <text class="ink" x="370" y="72">a sane friend leaves a sword;</text>
  <text class="ink" x="370" y="90">mad, he asks for it back</text>
  <path class="arrow" d="M 354 65 L 336 65"/>
  <path class="afill" d="M 338 58 L 324 65 L 338 72 Z"/>
</svg>

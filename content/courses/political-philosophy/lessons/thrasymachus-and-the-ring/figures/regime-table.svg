<svg viewBox="0 0 600 250" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .ink { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.6; font-size: 12px; }
    .head { fill: currentColor; font-weight: 600; font-size: 13px; }
    .rule { stroke: currentColor; stroke-width: 1; opacity: 0.35; }
    .hl { fill: #e2903a; fill-opacity: 0.15; }
    .acc { fill: #e2903a; font-weight: 600; font-size: 14px; }
  </style>
  <rect class="hl" x="440" y="20" width="150" height="190" rx="4"/>
  <text class="head" x="20" y="45">regime</text>
  <text class="head" x="150" y="45">who rules</text>
  <text class="head" x="285" y="45">the laws serve</text>
  <text class="head" x="515" y="45" text-anchor="middle">obedience is called</text>
  <line class="rule" x1="15" y1="60" x2="590" y2="60"/>
  <text class="ink" x="20" y="95">tyranny</text>
  <text class="ink" x="150" y="95">one man</text>
  <text class="ink" x="285" y="95">the tyrant</text>
  <text class="acc" x="515" y="95" text-anchor="middle">justice</text>
  <line class="rule" x1="15" y1="115" x2="590" y2="115"/>
  <text class="ink" x="20" y="145">aristocracy</text>
  <text class="ink" x="150" y="145">the few</text>
  <text class="ink" x="285" y="145">the few</text>
  <text class="acc" x="515" y="145" text-anchor="middle">justice</text>
  <line class="rule" x1="15" y1="165" x2="590" y2="165"/>
  <text class="ink" x="20" y="195">democracy</text>
  <text class="ink" x="150" y="195">the many</text>
  <text class="ink" x="285" y="195">the many</text>
  <text class="acc" x="515" y="195" text-anchor="middle">justice</text>
  <text class="muted" x="300" y="238" text-anchor="middle">disobedience is punished as "unjust" in every row</text>
</svg>

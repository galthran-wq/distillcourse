<svg viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .ink { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.6; font-size: 12px; }
    .title { fill: currentColor; font-weight: 600; font-size: 14px; }
    .box { fill: none; stroke: currentColor; stroke-width: 1.2; }
    .just { stroke: #4c8dd6; stroke-width: 2.5; fill: none; }
    .unjust { stroke: #e2903a; stroke-width: 2.5; fill: none; }
    .jfill { fill: #4c8dd6; }
    .ufill { fill: #e2903a; }
    .bar { fill: currentColor; opacity: 0.25; }
    .ring { fill: none; stroke: #e2903a; stroke-width: 3; }
    .faint { opacity: 0.25; }
    .acc { fill: #e2903a; font-weight: 600; }
  </style>
  <circle class="jfill" cx="60" cy="90" r="7"/>
  <text class="ink" x="60" y="70" text-anchor="middle">just man</text>
  <circle class="ufill" cx="60" cy="210" r="7"/>
  <text class="ink" x="60" y="240" text-anchor="middle">unjust man</text>
  <circle class="ring" cx="248" cy="150" r="16"/>
  <rect class="ufill" x="242" y="128" width="12" height="7" rx="2"/>
  <text class="ink" x="248" y="30" text-anchor="middle">two rings: nobody can see</text>
  <text class="muted" x="248" y="282" text-anchor="middle">power and safety now equal for both</text>
  <path class="unjust" d="M 68 210 L 490 210"/>
  <path class="ufill" d="M 490 203 L 504 210 L 490 217 Z"/>
  <text class="ink" x="512" y="214">take</text>
  <path class="just" d="M 68 90 L 490 90"/>
  <path class="jfill" d="M 490 83 L 504 90 L 490 97 Z"/>
  <text class="ink" x="512" y="94">refrain</text>
</svg>

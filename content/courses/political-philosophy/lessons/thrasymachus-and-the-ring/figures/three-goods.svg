<svg viewBox="0 0 620 270" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .ink { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.6; font-size: 12px; }
    .title { fill: currentColor; font-weight: 600; font-size: 14px; }
    .col { fill: none; stroke: currentColor; stroke-width: 1; opacity: 0.35; }
    .want { fill: #e2903a; fill-opacity: 0.12; stroke: #e2903a; stroke-width: 2.5; }
    .many { fill: none; stroke: #4c8dd6; stroke-width: 2; stroke-dasharray: 5 4; }
    .acct { fill: #e2903a; font-weight: 600; }
    .blt { fill: #4c8dd6; }
  </style>
  <rect class="col" x="10" y="10" width="190" height="250" rx="5"/>
  <rect class="col" x="215" y="10" width="190" height="250" rx="5"/>
  <rect class="col" x="420" y="10" width="190" height="250" rx="5"/>
  <text class="title" x="105" y="36" text-anchor="middle">for itself only</text>
  <text class="title" x="310" y="36" text-anchor="middle">for itself and</text>
  <text class="title" x="310" y="54" text-anchor="middle">for its results</text>
  <text class="title" x="515" y="36" text-anchor="middle">for its results only</text>
  <text class="ink" x="105" y="90" text-anchor="middle">harmless pleasures</text>
  <text class="ink" x="310" y="90" text-anchor="middle">sight, knowledge,</text>
  <text class="ink" x="310" y="108" text-anchor="middle">health</text>
  <text class="ink" x="515" y="90" text-anchor="middle">exercise, medical</text>
  <text class="ink" x="515" y="108" text-anchor="middle">treatment, earning money</text>
  <rect class="want" x="250" y="150" width="120" height="40" rx="5"/>
  <text class="acct" x="310" y="175" text-anchor="middle">justice?</text>
  <text class="muted" x="310" y="215" text-anchor="middle">where Socrates must</text>
  <text class="muted" x="310" y="231" text-anchor="middle">show it belongs</text>
  <rect class="many" x="455" y="150" width="120" height="40" rx="5"/>
  <text class="blt" x="515" y="175" text-anchor="middle">justice</text>
  <text class="muted" x="515" y="215" text-anchor="middle">where the many put it:</text>
  <text class="muted" x="515" y="231" text-anchor="middle">a cost borne for its wages</text>
</svg>

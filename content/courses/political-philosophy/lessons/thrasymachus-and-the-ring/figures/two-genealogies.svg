<svg viewBox="0 0 600 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .ink { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.6; font-size: 12px; }
    .title { fill: currentColor; font-weight: 600; font-size: 14px; }
    .node { fill: none; stroke: currentColor; stroke-width: 1; opacity: 0.5; }
    .ar { stroke: currentColor; stroke-width: 1.5; opacity: 0.6; fill: none; }
    .ah { fill: currentColor; opacity: 0.6; }
    .end { fill: #e2903a; fill-opacity: 0.15; stroke: #e2903a; stroke-width: 2; }
    .acct { fill: #e2903a; font-weight: 600; }
    .div { stroke: currentColor; stroke-width: 1; opacity: 0.25; }
  </style>
  <line class="div" x1="300" y1="15" x2="300" y2="270"/>
  <text class="title" x="150" y="28" text-anchor="middle">Thrasymachus</text>
  <rect class="node" x="40" y="42" width="220" height="32" rx="4"/><text class="ink" x="150" y="63" text-anchor="middle">the strong</text>
  <path class="ar" d="M 150 74 L 150 90"/><path class="ah" d="M 145 89 L 155 89 L 150 96 Z"/>
  <rect class="node" x="40" y="96" width="220" height="32" rx="4"/><text class="ink" x="150" y="117" text-anchor="middle">make the law for their interest</text>
  <path class="ar" d="M 150 128 L 150 144"/><path class="ah" d="M 145 143 L 155 143 L 150 150 Z"/>
  <rect class="node" x="40" y="150" width="220" height="32" rx="4"/><text class="ink" x="150" y="171" text-anchor="middle">the weak comply</text>
  <path class="ar" d="M 150 182 L 150 198"/><path class="ah" d="M 145 197 L 155 197 L 150 204 Z"/>
  <rect class="end" x="40" y="204" width="220" height="40" rx="5"/><text class="acct" x="150" y="229" text-anchor="middle">"justice" = another's good</text>
  <text class="title" x="450" y="28" text-anchor="middle">Glaucon</text>
  <rect class="node" x="340" y="42" width="220" height="32" rx="4"/><text class="ink" x="450" y="63" text-anchor="middle">those who cannot dominate</text>
  <path class="ar" d="M 450 74 L 450 90"/><path class="ah" d="M 445 89 L 455 89 L 450 96 Z"/>
  <rect class="node" x="340" y="96" width="220" height="32" rx="4"/><text class="ink" x="450" y="117" text-anchor="middle">agree not to wrong one another</text>
  <path class="ar" d="M 450 128 L 450 144"/><path class="ah" d="M 445 143 L 455 143 L 450 150 Z"/>
  <rect class="node" x="340" y="150" width="220" height="32" rx="4"/><text class="ink" x="450" y="171" text-anchor="middle">each complies from fear</text>
  <path class="ar" d="M 450 182 L 450 198"/><path class="ah" d="M 445 197 L 455 197 L 450 204 Z"/>
  <rect class="end" x="340" y="204" width="220" height="40" rx="5"/><text class="acct" x="450" y="229" text-anchor="middle">"justice" = the lesser evil</text>
  <text class="title" x="300" y="296" text-anchor="middle">shared premise: by nature everyone wants more,</text>
  <text class="muted" x="300" y="316" text-anchor="middle">and restraint is accepted only from inability</text>
</svg>

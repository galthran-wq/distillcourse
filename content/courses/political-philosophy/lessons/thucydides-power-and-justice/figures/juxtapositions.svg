<svg viewBox="0 20 640 310" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .ink { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.6; font-size: 12px; }
    .title { fill: currentColor; font-weight: 600; font-size: 14px; }
    .lead { stroke: currentColor; stroke-width: 1; opacity: 0.45; }
    .axis { stroke: currentColor; stroke-width: 1.2; }
    .box { fill: none; stroke: currentColor; stroke-width: 1.2; }
    .abox { fill: #e2903a; fill-opacity: 0.14; stroke: #e2903a; stroke-width: 1.6; }
    .bbox { fill: #4c8dd6; fill-opacity: 0.12; stroke: #4c8dd6; stroke-width: 1.4; }
    .atext { fill: #e2903a; font-weight: 600; }
    .btext { fill: #4c8dd6; font-weight: 600; }
    .arrow { stroke: currentColor; stroke-width: 1.3; fill: none; }
    .dot { fill: currentColor; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <rect class="abox" x="20" y="30" width="260" height="68" rx="5"/>
  <text class="atext" x="150" y="50" text-anchor="middle">Funeral Oration, 431/0</text>
  <text class="ink" x="150" y="70" text-anchor="middle">“whether for evil or for good,</text>
  <text class="ink" x="150" y="86" text-anchor="middle">imperishable monuments”</text>
  <line class="arrow" x1="284" y1="64" x2="354" y2="64" marker-end="url(#ah)"/>
  <text class="muted" x="319" y="56" text-anchor="middle">next</text>
  <rect class="box" x="360" y="30" width="260" height="68" rx="5"/>
  <text class="title" x="490" y="50" text-anchor="middle">Plague, 430</text>
  <text class="ink" x="490" y="70" text-anchor="middle">“Fear of gods or law of man</text>
  <text class="ink" x="490" y="86" text-anchor="middle">there was none”</text>
  <rect class="abox" x="20" y="120" width="260" height="68" rx="5"/>
  <text class="atext" x="150" y="140" text-anchor="middle">Melos, 416</text>
  <text class="ink" x="150" y="160" text-anchor="middle">“the strong do what they can”</text>
  <line class="arrow" x1="284" y1="154" x2="354" y2="154" marker-end="url(#ah)"/>
  <text class="muted" x="319" y="146" text-anchor="middle">next</text>
  <rect class="box" x="360" y="120" width="260" height="68" rx="5"/>
  <text class="title" x="490" y="140" text-anchor="middle">Sicily, 415–413</text>
  <text class="ink" x="490" y="160" text-anchor="middle">“few out of many</text>
  <text class="ink" x="490" y="176" text-anchor="middle">returned home”</text>
  <line class="lead" x1="20" y1="220" x2="620" y2="220"/>
  <rect class="abox" x="20" y="234" width="290" height="84" rx="5"/>
  <text class="atext" x="165" y="256" text-anchor="middle">Reading 1: the order as verdict</text>
  <text class="ink" x="165" y="278" text-anchor="middle">boast answered by lawlessness,</text>
  <text class="ink" x="165" y="294" text-anchor="middle">power answered by ruin</text>
  <rect class="bbox" x="330" y="234" width="290" height="84" rx="5"/>
  <text class="btext" x="475" y="256" text-anchor="middle">Reading 2: the historian’s causes</text>
  <text class="ink" x="475" y="278" text-anchor="middle">plague came from Ethiopia;</text>
  <text class="ink" x="475" y="294" text-anchor="middle">Sicily lost by quarrels at home</text>
</svg>

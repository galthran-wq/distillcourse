<svg viewBox="0 0 640 460" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .ink { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.6; font-size: 12px; }
    .title { fill: currentColor; font-weight: 600; font-size: 14px; }
    .lead { stroke: currentColor; stroke-width: 1; opacity: 0.45; }
    .axis { stroke: currentColor; stroke-width: 1.2; }
    .box { fill: none; stroke: currentColor; stroke-width: 1.2; }
    .abox { fill: #e2903a; fill-opacity: 0.14; stroke: #e2903a; stroke-width: 1.6; }
    .bbox { fill: #4c8dd6; fill-opacity: 0.12; stroke: #4c8dd6; stroke-width: 1.4; }
    .atext { fill: #e2903a; font-weight: 600; }
    .btext { fill: #4c8dd6; font-weight: 600; }
    .arrow { stroke: currentColor; stroke-width: 1.3; fill: none; }
    .dot { fill: currentColor; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <text class="title" x="20" y="26" text-anchor="start">2 · fairness as common protection</text>
  <rect class="box" x="20" y="38" width="600" height="46" rx="5"/>
  <text class="ink" x="320" y="57" text-anchor="middle">Athenians: right is in question only between equals in power;</text>
  <text class="ink" x="320" y="73" text-anchor="middle">the strong do what they can and the weak suffer what they must</text>
  <text class="muted" x="165" y="108" text-anchor="middle">Melian move</text>
  <text class="muted" x="475" y="108" text-anchor="middle">Athenian answer</text>
  <rect class="abox" x="20" y="118" width="290" height="44" rx="5"/>
  <text class="atext" x="165" y="136" text-anchor="middle">Fairness is our common protection;</text>
  <text class="atext" x="165" y="152" text-anchor="middle">your fall would bring vengeance</text>
  <line class="arrow" x1="312" y1="140" x2="328" y2="140" marker-end="url(#ah)"/>
  <rect class="abox" x="330" y="118" width="290" height="44" rx="5"/>
  <text class="atext" x="475" y="136" text-anchor="middle">We fear our own subjects, not a rival;</text>
  <text class="atext" x="475" y="152" text-anchor="middle">you gain by submitting, we by sparing you</text>
  <rect class="box" x="20" y="174" width="290" height="44" rx="5" opacity="0.18"/>
  <rect class="box" x="330" y="174" width="290" height="44" rx="5" opacity="0.18"/>
  <rect class="box" x="20" y="230" width="290" height="44" rx="5" opacity="0.18"/>
  <rect class="box" x="330" y="230" width="290" height="44" rx="5" opacity="0.18"/>
  <rect class="box" x="20" y="286" width="290" height="44" rx="5" opacity="0.18"/>
  <rect class="box" x="330" y="286" width="290" height="44" rx="5" opacity="0.18"/>
  <rect class="box" x="20" y="342" width="290" height="44" rx="5" opacity="0.18"/>
  <rect class="box" x="330" y="342" width="290" height="44" rx="5" opacity="0.18"/>
  <rect class="box" x="20" y="404" width="600" height="46" rx="5" opacity="0.18"/>
</svg>

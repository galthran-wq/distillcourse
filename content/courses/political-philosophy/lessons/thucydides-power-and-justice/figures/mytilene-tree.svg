<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .ink { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.6; font-size: 12px; }
    .title { fill: currentColor; font-weight: 600; font-size: 14px; }
    .lead { stroke: currentColor; stroke-width: 1; opacity: 0.45; }
    .axis { stroke: currentColor; stroke-width: 1.2; }
    .box { fill: none; stroke: currentColor; stroke-width: 1.2; }
    .abox { fill: #e2903a; fill-opacity: 0.14; stroke: #e2903a; stroke-width: 1.6; }
    .bbox { fill: #4c8dd6; fill-opacity: 0.12; stroke: #4c8dd6; stroke-width: 1.4; }
    .atext { fill: #e2903a; font-weight: 600; }
    .btext { fill: #4c8dd6; font-weight: 600; }
    .arrow { stroke: currentColor; stroke-width: 1.3; fill: none; }
    .dot { fill: currentColor; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <rect class="box" x="180" y="20" width="280" height="34" rx="5"/>
  <text class="title" x="320" y="42" text-anchor="middle">How to treat a revolted city?</text>
  <path class="arrow" d="M320,54 L320,70 L160,70 L160,84" marker-end="url(#ah)"/>
  <text class="atext" x="160" y="102" text-anchor="middle">Cleon</text>
  <rect class="abox" x="30" y="114" width="260" height="34" rx="5"/>
  <text class="ink" x="160" y="136" text-anchor="middle">punish all who revolted</text>
  <line class="arrow" x1="160" y1="148" x2="160" y2="170" marker-end="url(#ah)"/>
  <rect class="abox" x="30" y="172" width="260" height="34" rx="5"/>
  <text class="ink" x="160" y="194" text-anchor="middle">allies learn: rebellion = death</text>
  <line class="arrow" x1="160" y1="206" x2="160" y2="228" marker-end="url(#ah)"/>
  <rect class="abox" x="30" y="230" width="260" height="34" rx="5"/>
  <text class="ink" x="160" y="252" text-anchor="middle">fewer revolts</text>
  <line class="arrow" x1="160" y1="264" x2="160" y2="286" marker-end="url(#ah)"/>
  <rect class="abox" x="30" y="288" width="260" height="34" rx="5"/>
  <text class="ink" x="160" y="310" text-anchor="middle">empire kept by fear</text>
  <path class="arrow" d="M320,54 L320,70 L480,70 L480,84" marker-end="url(#ah)"/>
  <text class="btext" x="480" y="102" text-anchor="middle">Diodotus</text>
  <rect class="bbox" x="350" y="114" width="260" height="34" rx="5"/>
  <text class="ink" x="480" y="136" text-anchor="middle">punish only the leaders</text>
  <line class="arrow" x1="480" y1="148" x2="480" y2="170" marker-end="url(#ah)"/>
  <rect class="bbox" x="350" y="172" width="260" height="34" rx="5"/>
  <text class="ink" x="480" y="194" text-anchor="middle">rebels surrender early</text>
  <line class="arrow" x1="480" y1="206" x2="480" y2="228" marker-end="url(#ah)"/>
  <rect class="bbox" x="350" y="230" width="260" height="34" rx="5"/>
  <text class="ink" x="480" y="252" text-anchor="middle">the tribute keeps coming</text>
  <line class="arrow" x1="480" y1="264" x2="480" y2="286" marker-end="url(#ah)"/>
  <rect class="bbox" x="350" y="288" width="260" height="34" rx="5"/>
  <text class="ink" x="480" y="310" text-anchor="middle">the commons stay Athens’s friends</text>
  <line class="lead" x1="40" y1="364" x2="600" y2="364"/>
  <text class="muted" x="320" y="386" text-anchor="middle">Each column is its speaker’s own forecast; the test for both: what keeps the empire</text>
  <text class="ink" x="320" y="408" text-anchor="middle">Vote “almost equal” · Diodotus wins · more than 1,000 executed even so</text>
</svg>

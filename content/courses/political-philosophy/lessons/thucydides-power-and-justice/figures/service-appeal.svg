<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .ink { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.6; font-size: 12px; }
    .head { fill: currentColor; opacity: 0.6; font-size: 12px; font-weight: 600; }
    .title { fill: currentColor; font-weight: 600; font-size: 14px; }
    .lead { stroke: currentColor; stroke-width: 1; opacity: 0.45; }
    .box { fill: none; stroke: currentColor; stroke-width: 1.2; }
    .abox { fill: #e2903a; fill-opacity: 0.14; stroke: #e2903a; stroke-width: 1.6; }
    .bbox { fill: #4c8dd6; fill-opacity: 0.12; stroke: #4c8dd6; stroke-width: 1.4; }
    .atext { fill: #e2903a; font-weight: 600; }
    .btext { fill: #4c8dd6; font-weight: 600; }
  </style>
  <text class="head" x="70" y="22" text-anchor="middle">at Sparta's mercy</text>
  <text class="head" x="225" y="22" text-anchor="middle">the ground of service</text>
  <text class="head" x="400" y="22" text-anchor="middle">what Thebes wants</text>
  <text class="head" x="565" y="22" text-anchor="middle">outcome</text>
  <line class="lead" x1="10" y1="32" x2="630" y2="32"/>

  <rect class="box" x="10" y="44" width="120" height="64" rx="5"/>
  <text class="title" x="70" y="72" text-anchor="middle">Plataea</text>
  <text class="muted" x="70" y="90" text-anchor="middle">427 BC</text>
  <text class="ink" x="225" y="66" text-anchor="middle">we fought the Persians</text>
  <text class="ink" x="225" y="82" text-anchor="middle">beside you in 479</text>
  <text class="muted" x="225" y="100" text-anchor="middle">pleaded by the Plataeans</text>
  <text class="ink" x="400" y="70" text-anchor="middle">the city destroyed</text>
  <text class="muted" x="400" y="88" text-anchor="middle">a useful ally in a running war</text>
  <rect class="bbox" x="510" y="52" width="110" height="48" rx="5"/>
  <text class="btext" x="565" y="72" text-anchor="middle">every man</text>
  <text class="btext" x="565" y="89" text-anchor="middle">killed</text>

  <rect class="box" x="10" y="124" width="120" height="64" rx="5"/>
  <text class="title" x="70" y="152" text-anchor="middle">Athens</text>
  <text class="muted" x="70" y="170" text-anchor="middle">404 BC</text>
  <text class="ink" x="225" y="146" text-anchor="middle">“great service amid the</text>
  <text class="ink" x="225" y="162" text-anchor="middle">greatest perils”</text>
  <text class="muted" x="225" y="180" text-anchor="middle">stated by Sparta, not pleaded</text>
  <text class="ink" x="400" y="150" text-anchor="middle">the city destroyed</text>
  <text class="muted" x="400" y="168" text-anchor="middle">with Corinth, the war won</text>
  <rect class="abox" x="510" y="132" width="110" height="48" rx="5"/>
  <text class="atext" x="565" y="152" text-anchor="middle">the city</text>
  <text class="atext" x="565" y="169" text-anchor="middle">spared</text>

  <line class="lead" x1="10" y1="210" x2="630" y2="210"/>
  <rect class="bbox" x="10" y="226" width="300" height="88" rx="5"/>
  <text class="btext" x="160" y="250" text-anchor="middle">Interest reading</text>
  <text class="ink" x="160" y="274" text-anchor="middle">what changed was Thebes's use to Sparta;</text>
  <text class="ink" x="160" y="292" text-anchor="middle">the same ground of service both times</text>
  <rect class="abox" x="330" y="226" width="300" height="88" rx="5"/>
  <text class="atext" x="480" y="250" text-anchor="middle">The ground counted</text>
  <text class="ink" x="480" y="274" text-anchor="middle">pleaded and refused in 427; in 404</text>
  <text class="ink" x="480" y="292" text-anchor="middle">Sparta's own ground against two allies</text>
</svg>

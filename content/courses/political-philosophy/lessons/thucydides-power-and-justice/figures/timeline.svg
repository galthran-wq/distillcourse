<svg viewBox="0 30 640 280" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .ink { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.6; font-size: 12px; }
    .title { fill: currentColor; font-weight: 600; font-size: 14px; }
    .lead { stroke: currentColor; stroke-width: 1; opacity: 0.45; }
    .axis { stroke: currentColor; stroke-width: 1.2; }
    .box { fill: none; stroke: currentColor; stroke-width: 1.2; }
    .abox { fill: #e2903a; fill-opacity: 0.14; stroke: #e2903a; stroke-width: 1.6; }
    .bbox { fill: #4c8dd6; fill-opacity: 0.12; stroke: #4c8dd6; stroke-width: 1.4; }
    .atext { fill: #e2903a; font-weight: 600; }
    .btext { fill: #4c8dd6; font-weight: 600; }
    .arrow { stroke: currentColor; stroke-width: 1.3; fill: none; }
    .dot { fill: currentColor; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <rect class="bbox" x="47.5" y="70" width="350.9" height="26" rx="4"/>
  <text class="btext" x="222.95" y="88" text-anchor="middle">Athenian empire grows</text>
  <rect class="box" x="398.4" y="70" width="201.60000000000002" height="26" rx="4"/>
  <text class="title" x="499.2" y="88" text-anchor="middle">Peloponnesian War</text>
  <line class="axis" x1="40" y1="120" x2="600" y2="120"/>
  <line class="lead" x1="40.0" y1="116" x2="40.0" y2="124"/>
  <text class="muted" x="40.0" y="138" text-anchor="middle">479 BC</text>
  <line class="lead" x1="181.9" y1="116" x2="181.9" y2="124"/>
  <text class="muted" x="181.9" y="138" text-anchor="middle">460</text>
  <line class="lead" x1="331.2" y1="116" x2="331.2" y2="124"/>
  <text class="muted" x="331.2" y="138" text-anchor="middle">440</text>
  <line class="lead" x1="480.5" y1="116" x2="480.5" y2="124"/>
  <text class="muted" x="480.5" y="138" text-anchor="middle">420</text>
  <line class="lead" x1="600.0" y1="116" x2="600.0" y2="124"/>
  <text class="muted" x="600.0" y="138" text-anchor="middle">404</text>
  <text class="ink" x="40.0" y="160" text-anchor="start">Plataea, 479</text>
  <circle class="dot" cx="40.0" cy="120" r="4"/>
  <circle class="dot" cx="398.4" cy="120" r="3.5"/>
  <line class="lead" x1="398.4" y1="124" x2="398.4" y2="156"/>
  <text class="atext" x="392.4" y="160" text-anchor="end">Funeral Oration, 431/0</text>
  <rect class="abox" x="405.9" y="172" width="29.80000000000001" height="10" rx="3"/>
  <text class="atext" x="399.9" y="181" text-anchor="end">plague, 430–426</text>
  <circle class="dot" cx="420.8" cy="120" r="3.5"/>
  <line class="lead" x1="420.8" y1="124" x2="420.8" y2="200"/>
  <text class="ink" x="414.8" y="204" text-anchor="end">Mytilene revolts 428, debate 427</text>
  <circle class="dot" cx="510.4" cy="120" r="3.5"/>
  <line class="lead" x1="510.4" y1="124" x2="510.4" y2="222"/>
  <text class="atext" x="504.4" y="226" text-anchor="end">Melos, 416</text>
  <rect class="abox" x="517.9" y="238" width="14.899999999999977" height="10" rx="3"/>
  <text class="atext" x="511.9" y="247" text-anchor="end">Sicilian expedition, 415–413</text>
  <circle class="dot" cx="547.7" cy="120" r="3.5"/>
  <line class="lead" x1="547.7" y1="124" x2="547.7" y2="266"/>
  <text class="ink" x="541.7" y="270" text-anchor="end">the Five Thousand, 411</text>
  <circle class="dot" cx="600.0" cy="120" r="3.5"/>
  <line class="lead" x1="600.0" y1="124" x2="600.0" y2="288"/>
  <text class="ink" x="594.0" y="292" text-anchor="end">Athens surrenders, 404</text>
  <text class="title" x="40.0" y="50" text-anchor="start">The fifth century after Plataea</text>

<svg viewBox="0 20 640 380" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .ink { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.6; font-size: 12px; }
    .title { fill: currentColor; font-weight: 600; font-size: 14px; }
    .lead { stroke: currentColor; stroke-width: 1; opacity: 0.45; }
    .axis { stroke: currentColor; stroke-width: 1.2; }
    .box { fill: none; stroke: currentColor; stroke-width: 1.2; }
    .abox { fill: #e2903a; fill-opacity: 0.14; stroke: #e2903a; stroke-width: 1.6; }
    .bbox { fill: #4c8dd6; fill-opacity: 0.12; stroke: #4c8dd6; stroke-width: 1.4; }
    .atext { fill: #e2903a; font-weight: 600; }
    .btext { fill: #4c8dd6; font-weight: 600; }
    .arrow { stroke: currentColor; stroke-width: 1.3; fill: none; }
    .dot { fill: currentColor; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <circle cx="200" cy="200" r="150" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.6"/>
  <text class="muted" x="200" y="40" text-anchor="middle">the city wall</text>
  <circle cx="200" cy="200" r="95" fill="none" stroke="#e2903a" stroke-width="1" stroke-dasharray="2 4" opacity="0.8"/>
  <circle class="dot" cx="295.0" cy="200.0" r="4.5" opacity="0.7"/>
  <circle class="dot" cx="276.9" cy="255.8" r="4.5" opacity="0.7"/>
  <circle class="dot" cx="229.4" cy="290.4" r="4.5" opacity="0.7"/>
  <circle class="dot" cx="170.6" cy="290.4" r="4.5" opacity="0.7"/>
  <circle class="dot" cx="123.1" cy="255.8" r="4.5" opacity="0.7"/>
  <circle class="dot" cx="105.0" cy="200.0" r="4.5" opacity="0.7"/>
  <circle class="dot" cx="123.1" cy="144.2" r="4.5" opacity="0.7"/>
  <circle class="dot" cx="170.6" cy="109.6" r="4.5" opacity="0.7"/>
  <circle class="dot" cx="229.4" cy="109.6" r="4.5" opacity="0.7"/>
  <circle class="dot" cx="276.9" cy="144.2" r="4.5" opacity="0.7"/>
  <circle cx="200" cy="200" r="8" fill="#e2903a"/>
  <text class="atext" x="200" y="182" text-anchor="middle">es meson</text>
  <text class="ink" x="200" y="228" text-anchor="middle">citizens: one law,</text>
  <text class="ink" x="200" y="244" text-anchor="middle">speech, the vote</text>
  <text class="atext" x="200" y="270" text-anchor="middle">equality</text>
  <rect class="bbox" x="420" y="70" width="200" height="56" rx="5"/>
  <text class="ink" x="520" y="92" text-anchor="middle">allies such as Mytilene:</text>
  <text class="ink" x="520" y="108" text-anchor="middle">tribute, the decree ship</text>
  <rect class="bbox" x="420" y="260" width="200" height="56" rx="5"/>
  <text class="ink" x="520" y="282" text-anchor="middle">Melos: the strong do</text>
  <text class="ink" x="520" y="298" text-anchor="middle">what they can</text>
  <line class="arrow" x1="350" y1="160" x2="418" y2="105" marker-end="url(#ah)"/>
  <line class="arrow" x1="350" y1="240" x2="418" y2="285" marker-end="url(#ah)"/>
  <text class="btext" x="520" y="200" text-anchor="middle">power</text>
  <text class="muted" x="520" y="148" text-anchor="middle">Mytilene: the hinge, where the</text>
  <text class="muted" x="520" y="163" text-anchor="middle">assembly decides an outside case</text>
  <text class="ink" x="320" y="385" text-anchor="middle">right among those who can hold each other to account</text>
</svg>

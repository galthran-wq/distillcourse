#
# STATE AT SYNTHESIS (October 2026): THE POOL IS EMPTY. None of the 51
# reader summaries returned an image_candidate (every `image_candidates`
# field is []), and research/images/ holds no captures. The reasons are
# structural: the canon is almost entirely text (primary treatises and
# philosophical monographs read from plain-text transcriptions —
# Gutenberg, CCEL, New Advent, archive.org djvu.txt — in which no figures,
# plates or maps survive), and the few sources that do carry visual
# material (the Loeb Cicero's palimpsest history, Harnack's print pages,
# the Foreign Affairs article) were read as text.
#
# Consequence for the briefs: every FIGURE PLAN entry is `draw:` unless it
# is marked `source: no pool candidate — hunt: …`, naming a real artefact
# (a manuscript page, a portrait, a frontispiece such as Leviathan's, a
# photograph of the Spartan plain, the 1788 Westminster Hall trial print,
# an assignat note, a Reichstag sitting-day chart from a published
# history) with where to obtain it (Wikimedia Commons, Gallica, the
# Bodleian, the Library of Congress) and the licence to verify. The
# figure-artist skill hunts, verifies and credits those at writing time
# (docs/figures.md §Sourced images); nothing here is pre-captured.
#
# When the human re-runs the reading for Who Are We? (2004) or the
# Strauss–Cropsey volume, or stages illustrated editions, add entries
# here and drop the captures into research/images/.


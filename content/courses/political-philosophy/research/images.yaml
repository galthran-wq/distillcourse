    license: "CC BY 2.5 (photograph, © Marie-Lan Nguyen); sculpture public domain (PD-art-70-3d)"
    quality: "Original 2400×3600, sharp, even lighting; capture stored at 2000×3000 (1 MB). Verified by eye."
    note: "Hunted for thrasymachus-and-the-ring, figure plato-herm (float right, section 3, first mention of Plato). A head, not a herm: the Capitoline object on Commons with the best photograph."
  - id: jg-s1-fichte-portrait

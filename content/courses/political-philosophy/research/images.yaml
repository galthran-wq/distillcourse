# Index of the captured image pool for the Western Political Philosophy
# course. Format per entry (as in content/courses/us-history/research/images.yaml):
#   - id: <kebab-case>
#     capture: research/images/<file>
#     shows: <what the reader must be able to see>
#     located: <source, exact location>
#     url: <download URL or PDF pointer>
#     license: <exactly as the source states>
#     quality: <resolution, legibility note>
#
# STATE (2026-10-31 revision): the pool holds five captures. The 51 summaries
# of the first rounds returned no image_candidate (the canon was read as plain
# text); four entries below were hunted by hand while drafting the first
# lessons, and the 2026-10-31 round surfaced one (the Fichte frontispiece).
# Every other sourced visual a brief plans is marked
# `source: no pool candidate — hunt: …` with where to obtain it and the
# licence to verify; the figure-artist skill hunts, verifies and credits it
# at writing time (docs/figures.md §Sourced images).

images:
  - id: mycenaean-world-map
    capture: research/images/mycenaean-world-map.png
    shows: "Map of the Aegean, 1400–1100 BCE: Mycenaean palaces (Mycenae, Tiryns, Pylos, Thebes, Orchomenus, Gla, Iolcus, Athens, Knossos), settlement dots, the shaded zone of Mycenaean influence including a strip of the Anatolian coast at Miletus (dot unlabelled), Troy and Pitane as non-Mycenaean sites; legend lower left. No Egypt or Levant."
    located: "Wikimedia Commons, File:Mycenaean_World_en.png (Alexikoua, Panthera tigris tigris; tr. Reedside), after Ιστορία του Ελληνικού Έθνους, Εκδοτική Αθηνών, vol. A'"
    url: "https://upload.wikimedia.org/wikipedia/commons/3/33/Mycenaean_World_en.png"
    license: "CC BY-SA 3.0"
    quality: "1242×1090 PNG, clean vector-rendered labels, legible at 700px; used (with Miletus and Sparta labels added) for greek-miracle/aegean-locator"
  - id: pylos-linear-b-tablet-harrsch
    capture: research/images/pylos-linear-b-tablet-harrsch.jpg
    shows: "a single Linear B clay tablet from the palace of Pylos, page-shaped and ruled into rows, with syllable signs, a repeated commodity pictogram and tally strokes — an inventory whose form is legible without reading it"
    located: "Wikimedia Commons, 'Linear B tablet Clay from Pylos end of 13th century BCE NAM Athens 01' by Mary Harrsch (own work, 2020); National Archaeological Museum, Athens, photographed on loan to 'The Greeks', Field Museum, Chicago; no tablet number given on the page"
    url: "https://upload.wikimedia.org/wikipedia/commons/thumb/9/9c/Linear_B_tablet_Clay_from_Pylos_end_of_13th_century_BCE_NAM_Athens_01.jpg/1920px-Linear_B_tablet_Clay_from_Pylos_end_of_13th_century_BCE_NAM_Athens_01.jpg (original 3000x4000)"
    license: "CC BY-SA 4.0"
    quality: "1920x2560 capture of a 3000x4000 original; sharp, raking light makes the incisions and tally strokes stand out; slight angle on the tablet"
  - id: agora-from-acropolis-koronaios-2020
    capture: research/images/agora-from-acropolis-koronaios-2020.jpg
    shows: "Photograph from the Acropolis looking north-west over the Ancient Agora of Athens: Temple of Hephaestus on Kolonos Agoraios (left), the open agora floor with the Giants' Odeion statues, the Church of the Holy Apostles, the rebuilt Stoa of Attalos (right), modern Athens beyond; Acropolis rock, floodlights and railing in the foreground"
    source: "George E. Koronaios, 'View of the Ancient Agora of Athens from the Acropolis on July 30, 2020', Wikimedia Commons, own work"
    located: "https://commons.wikimedia.org/wiki/File:View_of_the_Ancient_Agora_of_Athens_from_the_Acropolis_on_July_30,_2020.jpg"
    url: "https://upload.wikimedia.org/wikipedia/commons/f/fd/View_of_the_Ancient_Agora_of_Athens_from_the_Acropolis_on_July_30%2C_2020.jpg"
    license: "CC0 (Creative Commons Zero, Public Domain Dedication)"
    quality: "Original 6000×4000 (21 MB), sharp daylight exposure; capture stored downscaled to 3000×2000 for repo weight. Verified by eye."
    note: "Hunted for greek-miracle, figure athenian-agora (centered, section 4 after palace-to-agora). The citadel cannot appear in frame because it is the vantage point."
  - id: plato-silanion-capitoline-mc1377-nguyen

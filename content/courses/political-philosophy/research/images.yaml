    located: "https://commons.wikimedia.org/wiki/File:Shepherd-c-014-015.jpg — originally lib.utexas.edu/maps/historical/shepherd_1911/shepherd-c-014-015.jpg"
    url: "https://upload.wikimedia.org/wikipedia/commons/1/11/Shepherd-c-014-015.jpg"
    license: "public domain (1911; PD-old on Wikimedia Commons)"
    quality: "1920×1539 scan of the two-page spread, sharp, with a faint fold down the middle. A crop of the Peloponnese plus Boeotia comes to about 806 px wide: region names, Sparta and Thebes read at 672 px, 'Taygetus Mts' (spaced letters) reads with effort, and Leuctra is very small. No larger free scan was found: the PCL server refused downloads; archive.org historicalatlas00shep_0 (1911) lacks pp. 13–16; the 1926/1927 copies split pp. 14 and 15 into separate leaves. Verified by eye."
    note: "Hunted for sparta-as-test-case, figure peloponnese-map. Chosen over THIRLWALL(1845) p1.008 SOUTHERN GREECE (black and white, with a British Museum stamp on the map, and no Leuctra label found) and the 1857 Tegg/Findlay classical atlas 'Peloponnesus et Attica' (no Boeotian Leuctra; its 'Leuctrum' is a different town in Laconia)."

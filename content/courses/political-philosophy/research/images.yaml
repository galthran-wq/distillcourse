  - id: peloponnesian-war-431-marsyas-en
    capture: research/images/peloponnesian-war-431-marsyas-en.png
    shows: "Map of the Aegean world on the eve of the Peloponnesian War (431 BC): Athens and its allies in yellow, Sparta and the Peloponnesian League in pink, neutral Greek states in blue (Thessaly, Argos, Achaea, Crete), Persian Empire in purple, Macedonia in orange; cities, sanctuaries and later battles with dates; Lesbos, Mytilene and Melos labelled in small italic; legend lower left; some labels left in French"
    located: "Wikimedia Commons, File:Map_Peloponnesian_War_431_BC-en.svg — derivative by Aeonx of File:Map_Peloponnesian_War_431_BC-fr.svg by Marsyas, after E. Lévy, La Grèce au Ve siècle (Paris, 1995); file version of 2022-03-08"
    url: "https://upload.wikimedia.org/wikipedia/commons/5/57/Map_Peloponnesian_War_431_BC-en.svg"
    license: "CC BY-SA 3.0"
    quality: "993×794 SVG rendered locally to 2000×1599 PNG; crisp at any size, island labels small at 700px; used (with bold LESBOS and MELOS labels added) for thucydides-power-and-justice/peloponnesian-war-alliances. The PD alternative File:Peloponnesian_war_alliances_431_BC.png (US Army, 482×747) was rejected as too small"


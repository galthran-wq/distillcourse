  - title: "Considerations on France (tr. Lebrun 1974) and St Petersburg Dialogues (tr. Lebrun 1993; First, Fifth, Seventh)"
    author: "Joseph de Maistre"
    url: "https://archive.org/details/joseph-de-maistre-texts-and-studies"

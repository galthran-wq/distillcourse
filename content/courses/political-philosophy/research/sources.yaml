    access: "Full (four shards with footnotes)."
  - title: "Considerations on France (tr. Lebrun 1974) and St Petersburg Dialogues (tr. Lebrun 1993; First, Fifth, Seventh)"
    author: "Joseph de Maistre"
    url: "https://archive.org/details/joseph-de-maistre-texts-and-studies"
    kind: primary
    role: >
      maistre-and-bonald (Considerations; First Dialogue's executioner) and
      war-is-divine (Seventh Dialogue). Copyrighted translations: short
      quotations only.
    access: "Full for Considerations and the three Dialogues read."
  - title: "Joseph de Maistre and the Origins of Fascism (in The Crooked Timber of Humanity, 1990)"
    authors: "Isaiah Berlin"
    url: "staged: research/texts/berlin/crooked-timber.txt"
    kind: essay
    role: "The objection carried in maistre-and-bonald and war-is-divine; also Bonald (section II)."
    access: "Full (pp. 91–172)."
  - title: "Isaiah Berlin's Counter-Enlightenment (Transactions of the American Philosophical Society 93:5, 2003)"
    authors: "Joseph Mali and Robert Wokler (eds.)"
    url: "staged: research/texts/berlin-counter-enlightenment-volume/tAPS-2003.txt"
    kind: edited-volume
    role: >
      Secondary frame for the reaction: Lilla on what Counter-Enlightenment
      is, Garrard's reply to Berlin on Maistre, Beiser on the German
      critics, Gossman on Constant (the ancient/modern liberty objection to

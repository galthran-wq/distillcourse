# Research canon for the Western Political Philosophy course, compiled
# October 2026 by the source-reading swarm (112 reader summaries after the
# 2026-10-31 revision round; the raw
# texts are cached under research/texts/ with .meta.yaml sidecars).
# "role" = which modules/lessons the source grounds. "access" = what the
# swarm could actually read. Image captures referenced by briefs would live
# in research/images/ and be indexed in research/images.yaml — see that
# file for why the pool is empty for this course.
#
# Field convention: `author:` for a thinker whose text IS the lesson's
# material (Plato, Hobbes, Gilley — named in prose as the subject, per L8a);
# `authors:` for scholarly/secondary sources (Vernant, Mehta, Berlin,
# Fawcett, the SEP). Only `authors:` surnames feed the validator's
# `source-in-prose` rule, so a lesson that names one of them outside
# <References> is warned — state their thesis, cite them in References.

sources:
  # --- Module 1: Greek discovery ---
  - title: "The Origins of Greek Thought (Les origines de la pensée grecque, 1962; Eng. 1982)"
    authors: "Jean-Pierre Vernant"
    url: "https://archive.org/download/the-origins-of-greek-thought-1982-jean-pierre-vernant/"
    kind: monograph
    role: >
      Spine of greek-miracle: the collapse of Mycenaean palace kingship,
      power placed es meson, the hoplite city, Solon, Cleisthenes, and the
      Burnet-vs-Cornford 'Greek miracle' debate (ch. 7). Also what the
      Greeks borrowed (ch. 8).
    access: "Full (eight chapters + conclusion)."
  - title: "Republic (Jowett translation, Books I–X)"
    author: "Plato"
    url: "https://www.gutenberg.org/cache/epub/1497/pg1497.txt"
    kind: primary
    role: >
      thrasymachus-and-the-ring (I–II), kallipolis-and-the-philosopher-king
      (II–VII), decline-of-regimes (VIII–IX). Jowett edition has no
      Stephanus numbers; the summary's pointers are shard-relative lines.
    access: "Full, merged from five shards."
  - title: "Laws, Books III–V and X (Jowett translation)"
    author: "Plato"
    url: "https://www.gutenberg.org/cache/epub/1750/pg1750.txt"
    kind: primary
    role: >
      platos-laws-second-best-city (extra); Book III also feeds
      decline-of-regimes (Persia and Athens as mother forms) and
      sparta-as-test-case.
    access: "Full for Books III–V and X; other books not read."
  - title: "Politics (Jowett translation, Ross revision, 1921), Books I–VIII"
    author: "Aristotle"
    url: "https://www.archive.org/download/worksofaristotle10arisuoft/worksofaristotle10arisuoft.pdf"
    kind: primary
    role: >
      The three Aristotle lessons (I; III–IV; V–VII) and sparta-as-test-case
      (II.9). Bekker numbers available for citation.
    access: "Full; Book VIII breaks off at VIII.7 as in the manuscripts."
  - title: "Introduction to Political Philosophy (PLSC 114, Open Yale Courses, Fall 2006), 24 lectures"
    authors: "Steven B. Smith"
    url: "https://oyc.yale.edu/political-science/plsc-114"
    kind: lecture-course
    role: >
      Pedagogical scaffold for Plato, Aristotle, Machiavelli, Hobbes,
      Locke, Rousseau and Tocqueville: each unit's organising problem,
      the 'rival neighbours' framing, and the questions a seminar asks.
      Not a content source for claims about the texts (primary text wins).
    access: "Full transcripts of all 24 lectures."
  - title: "History of Philosophy Without Any Gaps — episode list with blurbs (HoP 001–502)"
    authors: "Peter Adamson"
    url: "https://hopwag.podbean.com/feed.xml"
    kind: survey
    role: >
      Map of the pre-modern canon for pointers only (Presocratics, Cicero,
      Church Fathers, Augustine, Aquinas, Salamanca, Bodin). Episode
      contents were not read.
    access: "Partial — titles and one-sentence blurbs only."

  # --- Module 2: Rome and Christianity ---
  - title: "On the Republic and On the Laws (Loeb Classical Library 213, tr. C. W. Keyes, 1928)"
    author: "Cicero"
    url: "human-staged: research/texts/cicero/de-republica-de-legibus-loeb.txt"
    kind: primary
    role: >
      cicero-mixed-constitution (Rep. I–II, VI) and cicero-natural-law
      (Rep. III, Laws I–II). Keyes's introduction gives the palimpsest
      history and dramatic setting.
    access: "Full (both works, with Keyes's introductions)."
  - title: "What Is Christianity? (Das Wesen des Christentums, 1900; tr. T. B. Saunders)"
    author: "Adolf von Harnack"
    url: "https://ccel.org/ccel/h/harnack/christianity/cache/christianity.txt"
    kind: primary
    role: >
      Spine of hellenization-of-christianity: kernel and husk, the three
      heads of the Gospel, Paul, Logos = Christ, the Greek and Roman
      Churches, the Reformation. Two reads exist (summary index 8 partial,
      index 47 full) — prefer the full one.
    access: "Full (second read, all sixteen lectures); first read lacked Lecture V."
  - title: "The City of God, Books XIV–XIX (Dods translation, NPNF 1.2)"
    author: "Augustine of Hippo"
    url: "https://www.newadvent.org/fathers/1201.htm"
    kind: primary
    role: >
      augustine-two-cities; XIX.21–24 (Scipio's definition tested) also
      feeds cicero-mixed-constitution's forward hook and altar-of-victory.
    access: "Full for Books XIV–XIX; Books I–XIII and XX–XXII not read."
  - title: "The New Science of Politics (1952; Chicago 1987 reprint)"
    author: "Eric Voegelin"
    url: "https://archive.org/details/the-new-science-of-politics-an-introduction-eric-voegelin"
    kind: monograph
    role: >
      constantine-and-representation (chs. I–III: representation, the
      struggle for representation in Rome, the Altar of Victory) and
      voegelin-gnosticism (Introduction, chs. IV–VI).
    access: "Full."


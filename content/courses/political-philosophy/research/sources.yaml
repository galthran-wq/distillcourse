    access: "Full (eleven chapters)."
  - title: "Elements of the Philosophy of Right (Dyde / Knox translations)"
    author: "G. W. F. Hegel"
    url: "https://www.marxists.org/reference/archive/hegel/works/pr/philosophy-of-right.pdf"
    kind: primary
    role: "hegel-ethical-life-and-the-state; §258 is the standing objection to Rousseau."
    access: "Full (Preface through §360, with Remarks and Additions)."
  - title: "Conservatism: An Anthology of Social and Political Thought from David Hume to the Present (2nd ed., 2020)"
    authors: "Jerry Z. Muller (ed.)"
    url: "human-staged: research/texts/muller/conservatism-anthology.txt"
    kind: anthology

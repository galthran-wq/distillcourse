concepts:
  # ── Module 1: arbitrage ─────────────────────────────────────────────
  - id: arbitrage
    name: Arbitrage
    definition: "A trading strategy with zero initial cost, no possibility of loss, and positive probability of profit"
    introduced_in: expectation-vs-arbitrage
  - id: replication
    name: Replication
    definition: "Constructing a portfolio of traded assets whose payoff matches a claim's in every state; its cost enforces the claim's price"
    introduced_in: expectation-vs-arbitrage
  - id: forward-price
    name: Forward price
    definition: "The delivery price making a forward contract worth zero now: F_0 = S_0 e^{rT}, fixed by replication, independent of expected return"
    introduced_in: expectation-vs-arbitrage
  - id: put-call-parity
    name: Put–call parity
    definition: "c − p = S_0 − Ke^{−rT} for European options — an arbitrage identity requiring no distributional assumptions"
    introduced_in: static-bounds-parity
  - id: dominance-bounds
    name: Dominance bounds
    definition: "Price inequalities forced by comparing two portfolios, one of which never pays less: e.g. c ≥ max(0, S_0 − Ke^{−rT})"
    introduced_in: static-bounds-parity
  - id: binomial-model
    name: Binomial model
    definition: "Stock moves to uS or dS each period with 0 < d < 1+r < u; the minimal movement model in which every claim is replicable"
    introduced_in: one-period-binomial
  - id: delta-hedging
    name: Delta hedging
    definition: "Holding Δ = (V_u − V_d)/(S_u − S_d) shares (c_x in continuous time) so the portfolio's stock risk cancels the claim's"
    introduced_in: one-period-binomial
  - id: risk-neutral-probability
    name: Risk-neutral probability
    definition: "p̃ = (1+r−d)/(u−d): the bookkeeping weights that make price a discounted expectation — algebra of replication, not belief"
    introduced_in: one-period-binomial

  # ── Module 2: binomial-model ────────────────────────────────────────
  - id: backward-induction
    name: Backward induction
    definition: "Computing claim values from expiry to the present, one one-period replication per node"
    introduced_in: multiperiod-binomial
  - id: self-financing-portfolio
    name: Self-financing portfolio
    definition: "A strategy whose value changes only through asset price changes: X_{n+1} = Δ_n S_{n+1} + (1+r)(X_n − Δ_n S_n)"
    introduced_in: multiperiod-binomial
  - id: filtration
    name: Filtration
    definition: "The increasing family of information sets F_n — at time n, exactly the first n coin tosses are known"
    introduced_in: coin-toss-probability
  - id: adapted-process
    name: Adapted process
    definition: "A process whose time-n value is determined by information available at time n — no peeking at the future"
    introduced_in: coin-toss-probability
  - id: conditional-expectation
    name: Conditional expectation
    definition: "E_n[X]: the average of X over unrevealed randomness given the first n tosses; linearity, taking out what is known, tower, independence, Jensen"
    introduced_in: coin-toss-probability
  - id: martingale
    name: Martingale
    definition: "An adapted process with E_n[M_{n+1}] = M_n — a fair game; discounted prices are martingales under the risk-neutral measure"
    introduced_in: martingales-risk-neutral-pricing
  - id: risk-neutral-measure
    name: Risk-neutral measure
    definition: "A probability measure equivalent to the actual one under which every discounted traded price is a martingale"
    introduced_in: martingales-risk-neutral-pricing
  - id: markov-property
    name: Markov property
    definition: "The future's distribution depends on the present state only; prices of non-path-dependent claims are functions v_n(S_n)"
    introduced_in: martingales-risk-neutral-pricing
  - id: radon-nikodym-derivative
    name: Radon–Nikodym derivative
    definition: "The random variable Z = dP̃/dP re-weighting one measure into an equivalent other; Z_n = E_n[Z] is a martingale"
    introduced_in: state-prices-change-of-measure
  - id: state-price-density
    name: State-price density
    definition: "ζ_n = Z_n/(1+r)^n: today's price of one dollar delivered in a given state — pricing kernel of the discrete market"
    introduced_in: state-prices-change-of-measure

  # ── Module 3: american-options ──────────────────────────────────────
  - id: stopping-time
    name: Stopping time
    definition: "A random time τ such that {τ = n} is decided by the first n tosses — exercise rules without foresight"
    introduced_in: stopping-times
  - id: optional-sampling
    name: Optional sampling theorem
    definition: "A (super)martingale stopped at a stopping time remains a (super)martingale; foresight rules break it"
    introduced_in: stopping-times
  - id: american-option
    name: American option
    definition: "A claim exercisable at any time up to expiry; its value must dominate intrinsic value at every node"
    introduced_in: american-derivatives
  - id: snell-envelope
    name: Snell envelope
    definition: "The smallest supermartingale dominating the intrinsic-value process — the American option's discounted price"
    introduced_in: american-derivatives
  - id: first-passage-time
    name: First-passage time
    definition: "The first time a process reaches a given level; a stopping time whose distribution the reflection principle computes"
    introduced_in: first-passage-perpetual-put
  - id: reflection-principle
    name: Reflection principle
    definition: "Counting paths by reflecting them at first passage: P(τ_m ≤ n) computed combinatorially for the symmetric walk"
    introduced_in: first-passage-perpetual-put
  - id: exercise-boundary
    name: Exercise boundary
    definition: "The critical stock level, per date, at which immediate exercise first beats continuation"
    introduced_in: first-passage-perpetual-put

  # ── Module 4: continuous-limit ──────────────────────────────────────
  - id: quadratic-variation
    name: Quadratic variation
    definition: "The limit of summed squared increments along a partition; k for the k-step walk, T for Brownian motion — computed per path, not across the ensemble"
    introduced_in: random-walk-to-brownian-motion
  - id: scaled-random-walk
    name: Scaled random walk
    definition: "W^(n)(t) = M_{nt}/√n: steps of size 1/√n, n per unit time — the discrete object converging to Brownian motion"
    introduced_in: random-walk-to-brownian-motion
  - id: brownian-motion
    name: Brownian motion
    definition: "Continuous paths, independent stationary increments W(t)−W(s) ~ N(0, t−s); martingale with [W,W](T) = T"
    introduced_in: brownian-motion
  - id: ito-integral
    name: Itô integral
    definition: "∫Δ dW: the gain of an adapted trading strategy against Brownian motion, built from simple integrands"
    introduced_in: ito-integral
  - id: ito-isometry
    name: Itô isometry
    definition: "E[(∫₀ᵗ Δ dW)²] = E∫₀ᵗ Δ² du — the variance accounting that extends the integral to general integrands"
    introduced_in: ito-integral
  - id: ito-formula
    name: Itô–Doeblin formula
    definition: "df = f_t dt + f_x dX + ½f_xx dX dX: the chain rule with the second-order term quadratic variation makes non-negligible"
    introduced_in: ito-formula
  - id: geometric-brownian-motion
    name: Geometric Brownian motion
    definition: "dS = αS dt + σS dW, solved by S_0 exp((α − σ²/2)t + σW(t)) — the standard stock model"
    introduced_in: ito-formula
  - id: stochastic-differential-equation
    name: Stochastic differential equation
    definition: "dX = μ(t,X)dt + σ(t,X)dW: drift plus diffusion; GBM and Ornstein–Uhlenbeck as the solvable exemplars"
    introduced_in: ito-formula
  - id: local-time
    name: Local time
    definition: "The correction term a kinked payoff picks up under Itô calculus — the accumulated cost of Brownian level-crossings"
    introduced_in: stop-loss-paradox

  # ── Module 5: black-scholes ─────────────────────────────────────────
  - id: black-scholes-pde
    name: Black–Scholes PDE
    definition: "c_t + rSc_x + ½σ²S²c_xx = rc with terminal payoff condition — forced by matching a self-financing hedge's dt terms"
    introduced_in: black-scholes-pde
  - id: black-scholes-formula
    name: Black–Scholes formula
    definition: "c = S_0N(d_1) − Ke^{−rT}N(d_2): the closed-form European price with no drift input"
    introduced_in: black-scholes-formula
  - id: greeks
    name: Greeks
    definition: "Partial derivatives of option value — delta, gamma, theta, vega — the risk inventory of a hedged book"
    introduced_in: greeks-hedging-error
  - id: gamma
    name: Gamma
    definition: "∂²c/∂S²: hedge-ratio sensitivity; sets the size of discrete hedging error and the convexity P&L ½Γ(ΔS)²"
    introduced_in: greeks-hedging-error
  - id: vega
    name: Vega
    definition: "∂c/∂σ: sensitivity to volatility — strictly positive for vanilla options, which makes implied volatility well-defined"
    introduced_in: greeks-hedging-error
  - id: hedging-error
    name: Discrete hedging error
    definition: "The terminal P&L spread of a delta hedge rebalanced n times; standard deviation of order 1/√n, gamma-weighted"
    introduced_in: greeks-hedging-error
  - id: smooth-pasting
    name: Smooth pasting
    definition: "At an optimal exercise boundary the value function meets the payoff tangentially — the extra condition pinning free boundaries"
    introduced_in: perpetual-american-put

  # ── Module 6: risk-neutral-pricing ──────────────────────────────────
  - id: girsanov-theorem
    name: Girsanov's theorem
    definition: "An exponential-martingale change of measure removes drift from Brownian motion; volatility is invariant"
    introduced_in: girsanov-theorem
  - id: market-price-of-risk
    name: Market price of risk
    definition: "θ = (α − r)/σ: excess return per unit volatility — the drift Girsanov's change of measure absorbs"
    introduced_in: girsanov-theorem
  - id: risk-neutral-valuation
    name: Risk-neutral valuation
    definition: "V(t) = Ẽ[e^{−r(T−t)}V(T) | F(t)]: price as discounted risk-neutral conditional expectation, in continuous time"
    introduced_in: risk-neutral-valuation
  - id: feynman-kac
    name: Feynman–Kac theorem
    definition: "The bridge between expectation and PDE: the discounted conditional expectation of a Markov payoff solves the pricing PDE"
    introduced_in: risk-neutral-valuation
  - id: martingale-representation
    name: Martingale representation theorem
    definition: "Every martingale of the Brownian filtration is an initial value plus an Itô integral — hence every claim has a hedge"
    introduced_in: martingale-representation-ftap
  - id: fundamental-theorems
    name: Fundamental theorems of asset pricing
    definition: "No arbitrage ⟺ a risk-neutral measure exists; completeness ⟺ it is unique"
    introduced_in: martingale-representation-ftap
  - id: completeness
    name: Market completeness
    definition: "Every derivative claim can be replicated by trading the primary assets — equivalent to uniqueness of the risk-neutral measure"
    introduced_in: martingale-representation-ftap
  - id: monte-carlo-pricing
    name: Monte Carlo pricing
    definition: "Estimating the risk-neutral expectation by simulation; error c/√N by the CLT, reported as a standard error"
    introduced_in: monte-carlo-pricing
  - id: variance-reduction
    name: Variance reduction
    definition: "Estimator redesigns — antithetic pairs, control variates — that shrink the CLT constant at fixed sample budget"
    introduced_in: monte-carlo-pricing
  - id: control-variate
    name: Control variate
    definition: "Subtracting a correlated quantity with known expectation from the estimator; the closed form as the control"
    introduced_in: monte-carlo-pricing
  - id: risk-neutral-density
    name: Risk-neutral density
    definition: "p̃(K) = e^{rT} ∂²C/∂K² (Breeden–Litzenberger): the risk-neutral distribution read off the call-price curve"
    introduced_in: implied-density

  # ── Module 7: volatility-smile ──────────────────────────────────────
  - id: implied-volatility
    name: Implied volatility
    definition: "The σ that makes the Black–Scholes formula reproduce a quoted price — well-defined because vega > 0"
    introduced_in: implied-volatility
  - id: volatility-smile
    name: Volatility smile
    definition: "Implied volatility's dependence on strike: symmetric smile in FX, downward skew in equities since 1987"
    introduced_in: volatility-smile
  - id: volatility-surface
    name: Volatility surface
    definition: "Implied volatility as a function of strike and expiry — the object desks calibrate to instead of one σ"
    introduced_in: volatility-smile
  - id: local-volatility
    name: Local volatility
    definition: "A deterministic σ(S,t) making a one-factor diffusion reprice every quoted vanilla exactly"
    introduced_in: local-volatility
  - id: dupire-formula
    name: Dupire formula
    definition: "σ²(K,T) = 2(C_T + rKC_K)/(K²C_KK): local variance read off the arbitrage-free call surface"
    introduced_in: local-volatility
  - id: svi-parameterization
    name: SVI parameterization
    definition: "Gatheral's five-parameter total-variance smile a + b[ρ(k−m) + √((k−m)² + σ²)], wings linear in log-strike"
    introduced_in: spx-surface-2005

  # ── Module 8: volatility-dynamics ───────────────────────────────────
  - id: stylized-facts
    name: Stylized facts of returns
    definition: "Cont's cross-market regularities: absent linear autocorrelation, heavy tails, clustering, slow |r| ACF decay, leverage"
    introduced_in: stylized-facts
  - id: volatility-clustering
    name: Volatility clustering
    definition: "Large moves follow large moves: corr(|r_t|, |r_{t+τ}|) positive with power-law decay — a property of ordering, not of the marginal"
    introduced_in: stylized-facts
  - id: heavy-tails
    name: Heavy tails
    definition: "Return kurtosis far above Gaussian, tail index roughly 2–5 — extreme moves orders of magnitude likelier than lognormal admits"
    introduced_in: stylized-facts
  - id: leverage-effect
    name: Leverage effect
    definition: "Negative correlation between returns and subsequent volatility — falls raise vol more than rises do"
    introduced_in: stylized-facts
  - id: arch
    name: ARCH
    definition: "Engle's model: conditional variance σ_t² = ω + Σα_i r_{t−i}² — variance driven by past squared shocks"
    introduced_in: arch-garch
  - id: garch
    name: GARCH
    definition: "Bollerslev's extension: σ_t² = ω + αr_{t−1}² + βσ_{t−1}²; stationary iff α+β<1, ARMA(1,1) in squares"
    introduced_in: arch-garch
  - id: arch-lm-test
    name: ARCH-LM test
    definition: "Regress squared residuals on their lags; TR² ~ χ²(p) under no-ARCH — the standard presence test"
    introduced_in: garch-mle
  - id: realized-volatility
    name: Realized volatility
    definition: "Volatility estimated from the return record — close-to-close, Parkinson, Garman–Klass — the physical-measure witness"
    introduced_in: realized-implied-smile
  - id: variance-risk-premium
    name: Variance risk premium
    definition: "The persistent excess of implied over subsequently realized variance — the price of selling volatility insurance"
    introduced_in: realized-implied-smile

  - slug: continuous-limit
    title: "Brownian motion and Itô calculus"
    outcomes: [co-ito]
    lessons:
      - slug: random-walk-to-brownian-motion
        title: "The scaling limit of the binomial model"
        type: core
        status: drafted
        key_image: figures/qv-vs-variance.svg
        goal: "Compute the scaled random walk's distribution and quadratic variation, and derive the lognormal limit of the calibrated binomial stock"
        opening: "Shrinking the binomial period demands a rescaling — steps of size $1/\\sqrt{n}$, $n$ steps per unit time — and under it two things survive the limit: the central limit theorem hands increments to the normal distribution, and the walk's quadratic variation stays exactly $t$, path by path."
        est_minutes: 36
        prerequisites: [martingales-risk-neutral-pricing]
        concepts:
          introduces: [quadratic-variation, scaled-random-walk]
          reinforces: [martingale, binomial-model, risk-neutral-measure]
        key_ideas:
          - "The symmetric walk's three properties: independent increments, martingale, $[M,M]_k = k$ computed path by path"
          - "Quadratic variation is not variance: one is measured along a single path, the other across the ensemble"
          - "$W^{(100)}(0.25)$ worked by binomial count, then the CLT limit $N(0,t)$ — Shreve Fig 3.2.3 recreated"
          - "The CRR calibration $u = e^{\\sigma\\sqrt{\\Delta t}}$: matching variance sends $\\log S$ to a normal, $S$ to a lognormal"
        demo: null
      - slug: brownian-motion
        title: "Brownian motion and quadratic variation"
        type: core
        status: drafted
        key_image: figures/zoom-grid.svg
        goal: "State the definition of Brownian motion, prove its martingale property and quadratic variation, and mark precisely which foundations are assumed unproved"
        opening: "Brownian motion is the limit object the scaled walks converge to: continuous paths, independent stationary normal increments — and a path so rough that its ordinary length is infinite while its squared increments accumulate at exactly one unit per unit time."
        est_minutes: 40
        prerequisites: [random-walk-to-brownian-motion]
        concepts:
          introduces: [brownian-motion]
          reinforces: [quadratic-variation, filtration, conditional-expectation, martingale]
        key_ideas:
          - "The definition, its filtration, and the martingale property proved from independent increments"
          - "First-order variation infinite, quadratic variation $[W,W](T) = T$ — the $L^2$ proof carried through"
          - "The $dW\\,dW = dt$ notation dissected: two tempting formalizations rejected, the correct statement kept (Shreve Remark 3.4.4–5)"
          - "The fence, stated exactly: existence of BM, general conditional expectation, and almost-sure statements rest on measure theory this course states but does not prove"
          - "Nowhere differentiability, and why zooming in never smooths the path"
        demo:
          component: QuadraticVariationZoom
          spec: >
            One sampled Brownian path beside one smooth curve. A partition
            slider refines the mesh; readouts accumulate first-order
            variation and quadratic variation for both. Task: find a mesh
            at which the Brownian path's first-order variation stops
            growing (it never does) while its quadratic variation pins to
            T and the smooth curve's pins to 0. Zoom control shows
            self-similarity at every scale.
      - slug: ito-integral
        title: "The Itô integral"
        type: core
        status: drafted
        key_image: figures/peeking.svg
        goal: "Construct the Itô integral for simple integrands, prove the martingale property and the Itô isometry, and compute $\\int W\\,dW$"
        opening: "The gain of a trading strategy that holds $\\Delta(t)$ shares is $\\int \\Delta\\,dW$ — an integral against a path of infinite length, which nonetheless exists because the integrand is forbidden to peek and the increments square-sum to $dt$."
        est_minutes: 38
        prerequisites: [brownian-motion]
        concepts:
          introduces: [ito-integral, ito-isometry]
          reinforces: [brownian-motion, quadratic-variation, adapted-process, martingale]
        key_ideas:
          - "Simple integrands are trading strategies: hold, then rebalance — the integral is the P&L"
          - "Adaptedness is load-bearing: the same construction with a peeking integrand manufactures money"
          - "Martingale property and the isometry $E[I(t)^2] = E\\int_0^t \\Delta^2\\,du$ proved for simple integrands, extension stated"
          - "$\\int_0^T W\\,dW = \\tfrac12 W(T)^2 - \\tfrac12 T$: the naive answer has the wrong expectation, and the correction is the quadratic variation"
        demo: null
      - slug: ito-formula
        title: "The Itô–Doeblin formula"
        type: core
        status: drafted
        key_image: figures/gbm-dissected.svg
        goal: "Apply the Itô–Doeblin formula to Brownian motion and Itô processes, and solve the geometric Brownian motion and Ornstein–Uhlenbeck equations"
        opening: "Taylor's expansion to second order, with $(dW)^2$ replaced by $dt$ and everything smaller discarded, is the entire content of Itô's formula — the chain rule for functions of a path with nonzero quadratic variation."
        est_minutes: 40
        prerequisites: [ito-integral]
        concepts:
          introduces: [ito-formula, geometric-brownian-motion, stochastic-differential-equation]
          reinforces: [ito-integral, quadratic-variation, brownian-motion]
        key_ideas:
          - "The Taylor-expansion derivation, with the error terms accounted honestly"
          - "GBM solved: $S(t) = S_0\\exp((\\alpha - \\tfrac12\\sigma^2)t + \\sigma W(t))$ — where the $-\\tfrac12\\sigma^2$ comes from and what it costs a naive investor"
          - "The Ornstein–Uhlenbeck equation by integrating factor: mean reversion in closed form"
          - "Itô processes, the general formula $dX\\,dX = \\sigma^2 dt$, and the product rule"
          - "The recipe named for later use: find the martingale, take the differential, set the $dt$ term to zero"
        demo: null
      - slug: stop-loss-paradox
        title: "The stop-loss hedge paradox"
        type: core
        status: drafted
        key_image: figures/plateau.svg
        goal: "Explain via quadratic variation why the stop-loss hedge's cost does not converge to the option's value, reproducing Hull's simulation as the evidence"
        opening: "Hold the stock exactly when it is above the strike, hold nothing below: in ordinary calculus this strategy replicates a call at cost $K$ or zero, and in fact its hedging performance refuses to improve no matter how frequently it is monitored — the gap is quadratic variation, made visible."
        est_minutes: 30
        prerequisites: [ito-formula]
        concepts:
          introduces: [local-time]
          reinforces: [quadratic-variation, brownian-motion, delta-hedging, ito-formula]
        key_ideas:
          - "The strategy and its naive accounting: buy at K rising, sell at K falling, net cost zero"
          - "Hull's Table 19.1 reproduced: the performance measure plateaus near 0.98 of the premium as monitoring shrinks from 5 weeks to hours"
          - "Why: Brownian motion crosses K infinitely often, each crossing buys high and sells low by the overshoot; the accumulated cost is local time (Shreve Ex. 4.21, sketched and fenced)"
          - "The verdict that launches the next module: hedging error is a second-order phenomenon, so the hedge ratio must come from a second-order calculus"
        demo: null

      - slug: quadratic-variation-lab
        title: "Lab: the stochastic calculus test bench"
        type: lab
        status: planned
        goal: "Build a test bench — paths, a quadratic-variation meter, stochastic-integral quadratures, an Euler–Maruyama solver — and measure what the module proved: QV pins to $T$, the $-\\tfrac12$ correction appears in a computed integral, strong order is $1/2$"
        opening: "The module's theorems are claims about limits, and limits can be watched: sampled quadratic variation pins to $T$ while a smooth path's dies, the left-endpoint sum of $\\int W\\,dW$ produces the $-T/2$ correction out of plain arithmetic, and the Euler scheme's error falls at exactly the order the calculus predicts."
        est_minutes: 10
        prerequisites: [ito-formula]
        concepts:
          introduces: []
          reinforces: [scaled-random-walk, quadratic-variation, brownian-motion, ito-integral, ito-formula, geometric-brownian-motion, stochastic-differential-equation]
        key_ideas:
          - "Higham's 10-program SIAM Review assignment rebuilt in NumPy, with quadratic variation added as the headline instrument"
          - "One path, two integrals: the evaluation point decides the answer, and the gap is half the sampled QV"
          - "The coupled-refinement discipline: strong order 1/2 is only measurable when every grid consumes the same Brownian increments"
          - "QV used for something: $\\sigma$ estimated from discretely observed paths — module 8's realized volatility, met early"
        demo: null
        lab:
          est_hours: 4
          checkpoints:
            - id: scaled-walk
              kind: exact
              text: "The scaled symmetric random walk on $[0, T]$ with $\\pm\\sqrt{\\Delta t}$ increments"
            - id: sampled-qv
              kind: exact
              text: "Sampled quadratic variation of any discretely observed path at a given stride"
            - id: qv-study
              kind: exact
              text: "The QV table across meshes: $W$ pins to $T$, a smooth path dies, drift is invisible, GBM's log gives $\\sigma^2 T$"
            - id: ito-vs-stratonovich
              kind: exact
              text: "Left and midpoint sums of $\\int W\\,dW$ against their two limits; the gap is half the sampled QV"
            - id: ito-formula-check
              kind: exact
              text: "The Itô–Doeblin formula verified numerically along a path, discrepancy shrinking with the mesh"
            - id: euler-maruyama
              kind: exact
              text: "Euler–Maruyama for GBM and the coupled-path strong-convergence study; fitted slope in $[0.4, 0.6]$"
            - id: why-left-endpoint
              kind: review
              text: "Name why finance forces the left endpoint, and what a midpoint trader gets to see"
              required: false
            - id: qv-sigma
              kind: metric
              text: "Estimate $\\sigma$ per held-out discretely observed path; RMSE against the private truths within the calibrated threshold"
              required: false
        notes: "Canon grounding, fixtures and checkpoint detail in research/quadratic-variation-lab.md (LAB PLAN)."

  - slug: black-scholes
    title: "Black–Scholes and hedging"
    outcomes: [co-blackscholes, co-implement]
    lessons:
      - slug: black-scholes-pde
        title: "The hedging argument and the Black–Scholes PDE"
        type: core
        status: planned
        goal: "Derive the Black–Scholes PDE by matching the evolution of a self-financing hedge against the option's Itô expansion"
        opening: "Equate two Itô differentials — a self-financing portfolio's and the option value's — and the $dW$ terms cancel exactly when the hedge holds $c_x(t, S(t))$ shares, leaving a PDE in which the stock's drift has already vanished."
        est_minutes: 40
        prerequisites: [ito-formula]
        concepts:
          introduces: [black-scholes-pde]
          reinforces: [self-financing-portfolio, delta-hedging, ito-formula, geometric-brownian-motion]
        key_ideas:
          - "Portfolio evolution $dX = \\Delta\\,dS + r(X - \\Delta S)\\,dt$ — the continuous wealth equation, inherited from the tree"
          - "Term matching: $dW$ terms force $\\Delta(t) = c_x$; $dt$ terms force $c_t + rSc_x + \\tfrac12\\sigma^2S^2c_{xx} = rc$"
          - "Terminal and boundary conditions; the solution stated and verified against the PDE (the derivation by integration waits for the risk-neutral module)"
          - "Black and Scholes's own $15/$20 worked hedge: equal up and down moves both lose $0.75 — convexity slippage before it has a name"
          - "Seven ideal conditions, listed and numbered — the checklist the rest of the course tests"
        demo: null
      - slug: black-scholes-formula
        title: "The Black–Scholes formula"
        type: core
        status: planned
        goal: "Compute European option prices from the Black–Scholes formula and analyze its anatomy, limits, and convergence from the binomial model"
        opening: "The formula $c = S_0N(d_1) - Ke^{-rT}N(d_2)$ prices a claim on an unknowable future with five observable inputs — and the expected return of the stock, the one quantity everyone argues about, is not among them."
        est_minutes: 38
        prerequisites: [black-scholes-pde]
        concepts:
          introduces: [black-scholes-formula]
          reinforces: [black-scholes-pde, put-call-parity, risk-neutral-probability, binomial-model]
        key_ideas:
          - "Anatomy: $N(d_2)$ is the risk-neutral exercise probability; $S_0N(d_1)$ carries the conditional stock value"
          - "Limits and boundary behavior: $t \\to T$ recovers the kink; $\\sigma \\to 0$ recovers the forward bound; deep ITM/OTM asymptotes"
          - "Parity verified on the closed forms; the put formula read off for free"
          - "Binomial convergence: CRR's Table 2 (a penny by $n=150$) and the sawtooth — convergence is real but not monotone"
          - "Drift independence as the historical shock: Sprenkle and Samuelson had formulas with unmeasurable parameters; this one has none"
        demo: null
      - slug: greeks-hedging-error
        title: "The Greeks and discrete hedging error"
        type: core
        status: planned
        goal: "Compute delta, gamma, and theta, prove the identity linking them, and quantify the error of rebalancing a delta hedge at discrete times"
        opening: "A delta-hedged book is not riskless between rebalances: its P&L over a step is $\\tfrac12\\Gamma(\\Delta S)^2 + \\Theta\\,\\Delta t$ plus smaller terms, and the two leading terms cancel only on average — which is why hedging error shrinks like $1/\\sqrt{n}$ and never reaches zero."
        est_minutes: 40
        prerequisites: [black-scholes-formula]
        concepts:
          introduces: [greeks, gamma, vega, hedging-error]
          reinforces: [delta-hedging, black-scholes-pde, quadratic-variation, black-scholes-formula]
        key_ideas:
          - "Closed forms for delta, gamma, theta, vega; their shapes against $S$ and $t$"
          - "$\\Theta + rS\\Delta + \\tfrac12\\sigma^2S^2\\Gamma = r\\Pi$: the PDE read as a Greeks identity"
          - "Delta-neutral, long gamma: convexity profits from a move either way, paid for by theta"
          - "Hull's written-call simulation (Tables 19.2–19.4): hedge cost converges to the BS price, error halving as frequency quadruples"
          - "Boyle–Emanuel: the standard deviation of hedging error scales as $1/\\sqrt{n}$; gamma sets the constant"
        demo:
          component: DeltaHedgeSimulator
          spec: >
            Simulated GBM paths; the reader writes a call and delta-hedges
            at a chosen frequency (weekly to hourly). Displays the terminal
            P&L histogram across paths, its standard deviation, and a
            log-log plot of error vs n. Tasks: halve the error's standard
            deviation (requires quadrupling frequency), then switch the
            payoff to a digital near expiry and watch gamma defeat the
            hedge. Presets: Hull's 20-week written call, at-the-money
            short-dated, digital.
      - slug: perpetual-american-put
        title: "The perpetual American put in continuous time"
        type: extra
        status: planned
        goal: "Solve the perpetual American put's free-boundary problem and derive the optimal exercise level by smooth pasting"
        opening: "With no expiry the American put's PDE becomes an ODE with an unknown boundary, and one extra condition — the value function's slope must match the payoff's at the exercise level — singles out $L^* = \\frac{2r}{2r+\\sigma^2}K$ from a one-parameter family of candidates."
        est_minutes: 30
        prerequisites: [black-scholes-pde, first-passage-perpetual-put]
        concepts:
          introduces: [smooth-pasting]
          reinforces: [black-scholes-pde, exercise-boundary, snell-envelope]
        key_ideas:
          - "The candidate family $v_L$ solved from the ODE; each is the value of 'exercise at $L$'"
          - "Maximizing over $L$ = tangency at the kink: smooth pasting as a first-order condition, with Shreve's Fig 8.3.1 geometry"
          - "$L^* = \\frac{2r}{2r+\\sigma^2}K$, and the discrete boundary of the tree module recovered in the limit"
          - "Linear complementarity: the modern statement of hold-vs-exercise"
        demo: null
      - slug: portfolio-insurance-1987
        title: "Portfolio insurance and the crash of 1987"
        type: core
        status: planned
        goal: "Analyze portfolio insurance as delta hedging at market scale and evaluate its role in the October 1987 crash"
        opening: "By October 1987, $60–90 billion of institutional money replicated synthetic puts by exactly the delta rule of this module — sell as the market falls, buy as it rises — and on October 19 the S&P 500 fell 20 percent in a day, more than five times its worst previous loss."
        est_minutes: 30
        prerequisites: [greeks-hedging-error]
        concepts:
          introduces: []
          reinforces: [delta-hedging, greeks, hedging-error, black-scholes-formula]
        key_ideas:

  - slug: risk-neutral-pricing
    title: "Risk-neutral pricing in continuous time"
    outcomes: [co-measure, co-ito, co-implement]
    lessons:
      - slug: girsanov-theorem
        title: "Girsanov's theorem and the risk-neutral measure"
        type: core
        status: planned
        goal: "Construct the risk-neutral measure for the Black–Scholes market via Girsanov's theorem and prove that the change of measure moves only the drift"
        opening: "One random variable re-weights the probabilities of Brownian paths so that $W(t) + \\theta t$ becomes a Brownian motion without drift — the continuous form of the tree's re-weighting, and the tool that turns the stock's rate of return into $r$."
        est_minutes: 38
        prerequisites: [brownian-motion, state-prices-change-of-measure]
        concepts:
          introduces: [girsanov-theorem, market-price-of-risk]
          reinforces: [radon-nikodym-derivative, brownian-motion, martingale, risk-neutral-measure]
        key_ideas:
          - "The finite rehearsal: recentering a normal with $Z = e^{-\\theta X - \\theta^2/2}$ (Shreve Example 1.6.6) — Girsanov with zero stochastic calculus"
          - "The exponential martingale $Z(t)$, the theorem's statement, and the fence: the proof needs Lévy's characterization, which is stated, not proved"
          - "Under $\\tilde P$ the stock drifts at $r$: $dS = rS\\,dt + \\sigma S\\,d\\tilde W$; volatility untouched"
          - "The market price of risk $\\theta = (\\alpha - r)/\\sigma$: one number for all assets driven by one Brownian motion"
        demo: null
      - slug: risk-neutral-valuation
        title: "Risk-neutral valuation"
        type: core
        status: planned
        goal: "Derive the risk-neutral pricing formula in continuous time and obtain the Black–Scholes formula by direct integration of the lognormal payoff"
        opening: "Discounted wealth is a martingale under the risk-neutral measure, so any replicable claim's price is its discounted conditional expectation — and evaluating that expectation for a call, a single Gaussian integral, yields the Black–Scholes formula the PDE could only verify."
        est_minutes: 38
        prerequisites: [girsanov-theorem, black-scholes-formula]
        concepts:
          introduces: [risk-neutral-valuation, feynman-kac]
          reinforces: [girsanov-theorem, martingale, black-scholes-formula, conditional-expectation]
        key_ideas:
          - "$V(t) = \\tilde E[e^{-r(T-t)}V(T) \\mid \\mathcal F(t)]$ from the martingale property of discounted wealth"
          - "The integral carried out in full: lognormal density, split at $d_2$, complete the square — the honest derivation of $N(d_1)$ and $N(d_2)$"
          - "Three derivations, one formula: PDE by hedging, expectation by Girsanov, limit of the tree"
          - "★ Feynman–Kac: the PDE and the expectation are the same object, and the recipe 'find the martingale, kill the dt term' converts one to the other"
        demo: null
      - slug: martingale-representation-ftap
        title: "Martingale representation and the fundamental theorems"
        type: core
        status: planned
        goal: "Explain how martingale representation guarantees a hedge exists and state the two fundamental theorems of asset pricing with their completeness taxonomy"
        opening: "Pricing by expectation presumes a hedge exists; the martingale representation theorem supplies it — every martingale of the Brownian filtration is an Itô integral, so the option's martingale is a trading strategy in disguise."
        est_minutes: 36
        prerequisites: [risk-neutral-valuation]
        concepts:
          introduces: [martingale-representation, fundamental-theorems, completeness]
          reinforces: [ito-integral, girsanov-theorem, market-price-of-risk, risk-neutral-measure]
        key_ideas:
          - "Representation stated (proof fenced), the hedge extracted: $\\Delta(t)$ = the integrand's ratio to the stock's volatility term"
          - "First fundamental theorem: a risk-neutral measure exists iff no arbitrage — Shreve's Example 5.4.4 gives the explicit two-stock arbitrage when the market-price-of-risk equations fail"
          - "Second fundamental theorem: uniqueness iff completeness; the three-case taxonomy (none / many / exactly one)"
          - "Harrison–Pliska in outline: why hedging every indicator claim forces two risk-neutral measures to agree"
        demo: null
      - slug: monte-carlo-pricing
        title: "Monte Carlo pricing and variance reduction"
        type: core
        status: planned
        goal: "Estimate risk-neutral expectations by Monte Carlo and cut the estimator's variance with antithetic pairs and control variates"
        opening: "The pricing formula is an expectation, and expectations can be sampled: simulate the risk-neutral stock, average the discounted payoff, and the error obeys the central limit theorem — a $1/\\sqrt{N}$ law that variance reduction attacks at the constant."
        est_minutes: 36
        prerequisites: [risk-neutral-valuation]
        concepts:
          introduces: [monte-carlo-pricing, variance-reduction, control-variate]
          reinforces: [risk-neutral-valuation, geometric-brownian-motion, girsanov-theorem]
        key_ideas:
          - "Exact GBM sampling vs Euler discretization: when a scheme adds bias and how to see it"
          - "The standard error is an output, not an apology: every MC price ships with its confidence interval"
          - "Antithetic pairs: mirror the Gaussians, halve the variance for monotone payoffs"
          - "Control variates: subtract a correlated quantity with known mean — the closed form as the control, variance ratios of 100 for near-vanilla payoffs"
          - "Hull's dart-throwing and spreadsheet BSM check as the canonical first experiments"
        demo:
          component: VarianceReductionRace
          spec: >
            Price the same call three ways — naive MC, antithetic, control
            variate — with a shared sample budget the reader allocates.
            Live readouts: running estimate, standard error, samples used;
            the BS closed form drawn as the target line. Task: reach a
            standard error under one cent using the smallest budget; the
            naive estimator needs roughly 100x the samples of the
            control-variate one. Presets: at-the-money, deep OTM (where
            antithetic fails to help), short-dated digital.
      - slug: implied-density
        title: "The market-implied distribution"
        type: core
        status: planned
        goal: "Compute the risk-neutral density from option prices via the Breeden–Litzenberger identity and compare it against the lognormal benchmark"
        opening: "Differentiate the call-price curve twice in the strike and the risk-neutral density appears: $\\tilde p(K) = e^{rT}\\,\\partial^2 C/\\partial K^2$ — the measure this course constructed as a theorem is an observable, printed daily in the option chain."
        est_minutes: 32
        prerequisites: [risk-neutral-valuation]
        concepts:
          introduces: [risk-neutral-density]
          reinforces: [risk-neutral-measure, state-price-density, put-call-parity, black-scholes-formula]
        key_ideas:
          - "The identity derived two ways: differentiate under the expectation, and the butterfly-spread portfolio whose payoff tends to a point mass"
          - "Shreve's Exercise 5.9 carried out, then applied to a real S&P chain: finite differences over strikes"
          - "The extracted density against the lognormal of matching variance: the fat left tail, in the data"
          - "Departures: discrete strikes, bid–ask noise, wings beyond the quoted range — what interpolation must supply"
        demo: null
      - slug: monte-carlo-lab
        title: "Lab: Monte Carlo pricing with variance reduction"
        type: lab
        status: planned
        goal: "Build a Monte Carlo pricing engine validated against the Black–Scholes closed form, then cut its variance far enough to price an Asian option to half a cent inside a fixed budget"
        opening: "The engine built here computes the module's expectation by sampling: exact GBM draws, an estimator with its own confidence interval, antithetic and control-variate stages measured against the closed form — and a final payoff no closed form covers."
        est_minutes: 10
        prerequisites: [monte-carlo-pricing]
        concepts:
          introduces: []
          reinforces: [monte-carlo-pricing, variance-reduction, control-variate, risk-neutral-valuation, geometric-brownian-motion]
        key_ideas:
          - "One artifact: a pricer whose every number carries a standard error"
          - "Validation against the closed form is the point, not a formality"
          - "Variance reduction measured as a ratio, with the budget fixed"
        demo: null
        lab:
          est_hours: 4
          checkpoints:
            - id: terminal-sampler
              kind: exact
              text: "Exact lognormal terminal-price sampler under the risk-neutral measure"
            - id: mc-european
              kind: exact
              text: "Monte Carlo call price with standard error, validated against the closed form"
            - id: antithetic-pairs
              kind: exact
              text: "The antithetic estimator and its measured variance ratio"
            - id: control-variate
              kind: exact
              text: "The control-variate estimator with optimal coefficient, variance ratio against naive"
            - id: euler-bias
              kind: exact
              text: "Euler-discretized paths versus exact sampling: the measured discretization bias"
            - id: why-control-works
              kind: review
              text: "Explain why the control variate cuts variance, and when it would not"
              required: false
            - id: asian-budget
              kind: metric
              text: "Price the arithmetic Asian call with standard error below half a cent inside the fixed path budget"
              required: false
        notes: "Canon grounding, data and checkpoint detail in research/monte-carlo-lab.md (LAB PLAN)."

  - slug: volatility-smile
    title: "The volatility smile"
    outcomes: [co-smile, co-implement]
    lessons:
      - slug: implied-volatility
        title: "Implied volatility"
        type: core
        status: planned
        goal: "Compute implied volatility by inverting the Black–Scholes formula and explain its role as the market's quoting convention"
        opening: "Every input to the Black–Scholes formula is observable except one, so the market runs the formula backwards: given a price, solve for the volatility that produces it — a well-posed inversion because vega is strictly positive."
        est_minutes: 34
        prerequisites: [black-scholes-formula]
        concepts:
          introduces: [implied-volatility]
          reinforces: [black-scholes-formula, vega, put-call-parity, greeks]
        key_ideas:
          - "Existence and uniqueness of the inversion: monotonicity in $\\sigma$ plus the no-arbitrage price band"
          - "Newton's method with vega as the derivative; bisection where vega vanishes in the wings"
          - "Calls and puts at the same strike share one implied volatility — parity forces it before any model"
          - "The VIX as the market's implied-volatility index: its 2008 spike to 80 read as a repricing of $\\sigma$"
          - "Quoting in vol: why desks trade a number the model says should not vary"
        demo: null
      - slug: volatility-smile
        title: "The volatility smile and surface"
        type: core
        status: planned
        goal: "Analyze the smile, skew, and term structure as measured facts and infer what they say about the market's implied distribution"
        opening: "If the Black–Scholes model were right, implied volatility would be one number; measured across strikes it is a curve — a symmetric smile in currencies, a downward skew in equities since October 1987 — and across expiries a surface, the object every desk actually calibrates to."
        est_minutes: 38
        prerequisites: [implied-volatility, implied-density]
        concepts:
          introduces: [volatility-smile, volatility-surface]
          reinforces: [implied-volatility, risk-neutral-density, black-scholes-formula]
        key_ideas:
          - "The FX smile and the equity skew as data: Hull's Tables 20.1–20.2, and the skew's birthday — no skew before 1987, permanent skew after"
          - "Smile ⟷ implied density: heavier tails than lognormal lift both wings; a fatter left tail alone tilts the skew (the module-6 extraction revisited)"
          - "The anticipated-jump 'frown': a bimodal density produces the inverted shape — Hull's Table 20.3 worked"
          - "Gatheral's 5-cent bid: a 13.7σ move priced above zero — evidence no continuous-path model can absorb"
          - "Black–Scholes demoted, not discarded: an interpolation device quoted in the wrong variable"
        demo:
          component: DensityToSmile
          spec: >
            Left panel: a terminal density the reader shapes (tail-weight
            and asymmetry controls, plus a two-point-mixture preset).
            Right panel: the implied-volatility curve across strikes,
            recomputed live from the density's option prices. Tasks:
            produce the post-1987 equity skew (fatten the left tail),
            produce the FX smile (fatten both), produce the frown (bimodal
            preset). The lognormal baseline stays drawn as reference —
            flat IV.
      - slug: local-volatility
        title: "Local volatility and the Dupire formula"
        type: core
        status: planned
        goal: "Derive the Dupire local-volatility formula and delimit what a one-factor diffusion calibrated to the surface can and cannot explain"
        opening: "One deterministic function $\\sigma(S,t)$ can reprice every quoted vanilla exactly: Dupire's formula reads it off the call surface, $\\sigma^2(K,T) = 2(C_T + rKC_K)/(K^2C_{KK})$ — the strongest possible defense of the one-factor diffusion, and the precise statement of its limits."
        est_minutes: 38
        prerequisites: [volatility-smile]
        concepts:
          introduces: [local-volatility, dupire-formula]
          reinforces: [risk-neutral-density, volatility-surface, stochastic-differential-equation, black-scholes-pde]
        key_ideas:
          - "The Nikkei paradox: one index cannot vibrate at 20% for six months and 18% for a year — constant σ contradicts its own quotes"
          - "Breeden–Litzenberger gives the marginals; the forward (Fokker–Planck) equation turns marginals into a diffusion coefficient — derivation carried, the forward equation itself fenced"
          - "Uniqueness needs the martingale restriction: Dupire's two-line counterexample of distinct diffusions with identical marginals"
          - "Static no-arbitrage as the formula's domain: calendar spreads ($C_T > 0$) and butterflies ($C_{KK} > 0$) keep the radicand positive"
          - "The limits stated: a surface generated by a jump at a known date has no consistent diffusion; fitting prices is not fitting dynamics"
        demo: null
      - slug: spx-surface-2005
        title: "The SPX surface, September 15, 2005"
        type: core
        status: planned
        goal: "Analyze Gatheral's published SPX volatility surface — raw quotes, SVI fits, and the Heston negative result — as the module's results applied to one real trading day"
        opening: "On one ordinary Wednesday's close, the S&P 500 option market quoted eight expiries and hundreds of strikes; fitted with Gatheral's five-parameter SVI curve per expiry the surface is smooth, arbitrage-consistent — and flatly incompatible with the best-known stochastic-volatility model at short maturities."
        est_minutes: 30
        prerequisites: [volatility-smile]
        concepts:
          introduces: [svi-parameterization]
          reinforces: [implied-volatility, volatility-surface, volatility-smile, local-volatility]
        key_ideas:
          - "From quotes to surface: mids, forwards, implied vols per (K, T) — the module's pipeline on real bid/offer data"
          - "SVI: five parameters per expiry, wings linear in log-strike as Lee's moment bound requires"
          - "The honest negative result: a calibrated Heston surface, shifted five vol points just to be comparable, is 'far too flat' at short expiries"
          - "Departures: bid–ask width in the wings, discrete strikes, and the interpolation choices a desk must own"
        demo: null
      - slug: vol-surface-lab
        title: "Lab: a volatility surface from a real option chain"
        type: lab
        status: planned
        goal: "Build the implied-volatility pipeline — a robust Black–Scholes inverter, chain cleaning via parity, a surface across strikes and expiries with static-arbitrage checks — on a real S&P 500 option chain"
        opening: "The pipeline built here turns a raw option chain into the surface the module has been reading: quotes to mids, mids to forwards by parity, prices to implied volatilities by Newton's method, and a smile per expiry that must pass the butterfly and calendar tests before it may be called arbitrage-free."
        est_minutes: 10
        prerequisites: [implied-volatility, volatility-smile]
        concepts:
          introduces: []
          reinforces: [implied-volatility, volatility-surface, put-call-parity, vega, risk-neutral-density]
        key_ideas:
          - "One artifact: chain in, arbitrage-checked surface out"
          - "Parity is the workhorse: forwards and discount factors come from the chain itself"
          - "The smile is measured, then fitted — never assumed"
        demo: null
        lab:
          est_hours: 4
          checkpoints:
            - id: bs-vega
              kind: exact
              text: "Vega in closed form, vectorized over strikes"
            - id: implied-vol-solver
              kind: exact
              text: "Newton-with-bisection-fallback implied-volatility solver, round-trip tested"
            - id: forward-from-parity
              kind: exact
              text: "The implied forward and discount factor per expiry, regressed from put–call parity"
            - id: surface-build
              kind: exact
              text: "Implied volatilities across all valid quotes; the total-variance grid"
            - id: arbitrage-checks
              kind: exact
              text: "Butterfly and calendar violations flagged across the surface"
            - id: why-one-vol-per-strike
              kind: review
              text: "Explain why calls and puts at one strike must share an implied volatility"
              required: false
            - id: smile-fit
              kind: metric
              text: "Fit a smooth parameterization per expiry with held-out quote error below tolerance"
              required: false
        notes: "Canon grounding, data and checkpoint detail in research/vol-surface-lab.md (LAB PLAN)."

  - slug: volatility-dynamics
    title: "Volatility as a process"
    outcomes: [co-volatility, co-implement]
    lessons:
      - slug: stylized-facts
        title: "Stylized facts of asset returns"
        type: core
        status: planned
        goal: "Examine the stylized facts of asset returns — absent linear autocorrelation, heavy tails, volatility clustering, leverage — and score geometric Brownian motion against each"
        opening: "Across instruments, markets, and decades, asset returns share a fixed list of statistical properties — and the model this course has priced with satisfies the first item on the list and fails most of the rest, in measurable ways."
        est_minutes: 38
        prerequisites: [ito-formula]
        concepts:
          introduces: [stylized-facts, volatility-clustering, heavy-tails, leverage-effect]
          reinforces: [geometric-brownian-motion, quadratic-variation]
        key_ideas:
          - "Cont's list, with the load-bearing five: no linear autocorrelation, heavy tails, clustering, slow decay of $|r|$ autocorrelation, leverage"
          - "The kurtosis table: 74 for currency futures, 16 for the S&P at five minutes, against an i.i.d. band of ±0.04"
          - "Clustering as a model-free fact: corr$(|r_t|, |r_{t+\\tau}|)$ decays as a power law, whether or not any GARCH is fitted"
          - "Mandelbrot's running-moment diagnostic, and the Student-t(4) warning: a finite moment can look infinite for 2,000 samples"
          - "GBM scored: white returns ✓, thin tails ✗, no clustering ✗, no leverage ✗ — the specification for what must replace constant σ"
        demo:
          component: ReturnShuffler
          spec: >
            Real daily return series (shipped with the lesson). One button
            shuffles the returns uniformly at random; panels show the
            histogram, the ACF of returns, and the ACF of absolute
            returns, before and after. Task: identify which stylized facts
            survive the shuffle (tails — a property of the marginal) and
            which die (clustering, leverage — properties of the ordering).
            Presets: original, one shuffle, average over 20 shuffles.
      - slug: arch-garch
        title: "ARCH and GARCH"
        type: core
        status: planned
        goal: "Construct the ARCH and GARCH models and prove their stationarity and heavy-tail properties from conditionally Gaussian shocks"
        opening: "Engle's 1982 move was to make tomorrow's variance a function of today's shock — $\\sigma_t^2 = \\omega + \\alpha r_{t-1}^2$ — and Bollerslev's 1986 addition of yesterday's variance turned a long unwieldy lag into two parameters that fit most return series."
        est_minutes: 40
        prerequisites: [stylized-facts]
        concepts:
          introduces: [arch, garch]
          reinforces: [stylized-facts, volatility-clustering, heavy-tails, conditional-expectation]
        key_ideas:
          - "Engle's three-model progression: exogenous variance (needs a cause), bilinear (degenerate variance), ARCH (both fixed)"
          - "ARCH(1) moments: variance finite iff $\\alpha < 1$, fourth moment iff $3\\alpha^2 < 1$ — heavy tails proved, not assumed"
          - "GARCH(1,1): stationarity iff $\\alpha + \\beta < 1$, long-run variance $\\omega/(1-\\alpha-\\beta)$, kurtosis in closed form"
          - "GARCH(1,1) is ARMA(1,1) in $r_t^2$ — Box–Jenkins intuition transfers"
          - "Mean reversion of variance and the forecast term structure: today's spike decays geometrically at rate $\\alpha+\\beta$"
        demo:
          component: GarchExplorer
          spec: >
            Simulated GARCH(1,1) paths with alpha and beta controls;
            panels show the return series, the sigma_t path, and running
            kurtosis. The (alpha, beta) plane displays the stationarity
            line alpha+beta=1 and the fourth-moment boundary. Tasks: find
            the boundary where kurtosis stops converging (cross
            3a^2+2ab+b^2=1); push alpha+beta to 1 and watch shocks stop
            dying out. Presets: Hull's fitted S&P values, near-IGARCH,
            white noise.
      - slug: garch-mle
        title: "GARCH estimation by maximum likelihood"
        type: core
        status: planned
        goal: "Estimate GARCH(1,1) by maximum likelihood — likelihood recursion, ARCH-LM test, and the block-diagonal information structure — reusing the estimation machinery of classical ML"
        opening: "A GARCH model is fitted exactly the way the classical-ml course fitted everything else — write the conditional log-likelihood, climb it — with one twist: the variance that enters each term is itself a recursion through all earlier parameters."
        est_minutes: 38
        prerequisites: [arch-garch]
        concepts:
          introduces: [arch-lm-test]
          reinforces: [arch, garch, stylized-facts]
        key_ideas:
          - "The conditional decomposition: $\\ell = \\sum_t\\left[-\\tfrac12\\log\\sigma_t^2 - r_t^2/2\\sigma_t^2\\right]$ with $\\sigma_t^2$ recursive"
          - "The ARCH-LM test: regress $r_t^2$ on its lags, $TR^2 \\sim \\chi^2$ — a rigorous LM derivation collapsing to a two-line recipe"
          - "Engle's Theorem 4: mean and variance parameters are information-orthogonal, so estimation decouples"
          - "Quasi-MLE honesty: Gaussian likelihood stays consistent under non-Gaussian shocks, with sandwich standard errors"
          - "Hull's S&P 500 fit (2005–2010) worked to the published parameters: $\\omega, \\alpha = 0.1336, \\beta = 0.8296$, and the crisis variance path"
        demo: null
      - slug: realized-implied-smile
        title: "Realized versus implied volatility"
        type: core
        status: planned
        goal: "Evaluate the gap between GARCH-forecast realized volatility and the implied surface, and demonstrate by simulation that clustering plus leverage generate an equity-style skew"
        opening: "The market's implied volatility and the return series' realized volatility are estimates of the same future number made by different witnesses — they track each other, implied sits persistently higher, and the gap between them is a priced risk premium, not an error."
        est_minutes: 36
        prerequisites: [garch-mle, implied-volatility, monte-carlo-pricing]
        concepts:
          introduces: [realized-volatility, variance-risk-premium]
          reinforces: [garch, implied-volatility, volatility-smile, monte-carlo-pricing, stylized-facts]
        key_ideas:
          - "Realized volatility estimators: close-to-close, then Parkinson and Garman–Klass — 5–8x efficiency from the same days' data"
          - "GARCH term-structure forecasts against the implied term structure: mean reversion visible in both"
          - "The wedge: implied above realized on average — insurance is sold at a premium, and the 1987 skew is its price"
          - "The closing experiment: simulate returns with clustering and leverage, price options on them by Monte Carlo, invert to implied vol — a skew emerges from the dynamics alone"
          - "What remains open: jump risk and the premium no diffusion-with-GARCH explains — the honest boundary of this course"
        demo: null
      - slug: garch-lab
        title: "Lab: GARCH(1,1) from scratch"
        type: lab
        status: planned
        goal: "Build a GARCH(1,1) fitter from scratch — variance recursion, Gaussian likelihood, MLE by numerical optimization, term-structure forecasts — on real daily equity returns, and beat the EWMA baseline out of sample"
        opening: "The fitter built here runs the course's estimation machinery on real market returns: the variance recursion, the likelihood it induces, the optimizer that climbs it, and a held-out year on which the fitted model must out-forecast the fixed-decay baseline."
        est_minutes: 10
        prerequisites: [garch-mle, stylized-facts]
        concepts:
          introduces: []
          reinforces: [garch, arch, stylized-facts, volatility-clustering, realized-volatility]
        key_ideas:
          - "One artifact: returns in, fitted (ω, α, β) with standard errors and a variance forecast out"
          - "The likelihood is recursive: one wrong initial condition shifts every term"
          - "Out-of-sample scoring is the referee — in-sample fit flatters"
        demo: null
        lab:
          est_hours: 4
          checkpoints:
            - id: log-returns
              kind: exact
              text: "Log returns and the stylized-fact summary: kurtosis, ACF of returns and of squares"
            - id: ewma-variance
              kind: exact
              text: "The EWMA variance recursion at lambda = 0.94 — the baseline to beat"
            - id: garch-recursion
              kind: exact
              text: "The GARCH(1,1) variance path for given (omega, alpha, beta)"
            - id: garch-loglik
              kind: exact
              text: "The Gaussian conditional log-likelihood over the variance path"
            - id: garch-fit
              kind: exact
              text: "Maximum-likelihood estimates by numerical optimization, within tolerance on the shipped series"
            - id: variance-forecast
              kind: exact
              text: "The k-day-ahead variance forecast and its term structure from the fitted parameters"
            - id: why-fat-tails
              kind: review
              text: "Explain how conditionally Gaussian returns produce unconditional kurtosis above 3"
              required: false
            - id: oos-forecast
              kind: metric
              text: "Beat the EWMA baseline's out-of-sample forecast loss on the held-out year"
              required: false
        notes: "Canon grounding, data and checkpoint detail in research/garch-lab.md (LAB PLAN)."

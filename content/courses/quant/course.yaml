schema_version: 1
slug: quant
title: Stochastic Calculus for Quantitative Finance
tagline: Why the price of a derivative is not an opinion — replication, martingales, Black–Scholes, and the smile that breaks it
status: planned
audience: >
  ML engineers comfortable with mathematics: linear algebra, calculus,
  probability, and the estimation habits of the classical-ml course
  (likelihood, MLE, validation on held-out data). No prior finance.
  Wants the honest mathematics — complete proofs where the setting allows
  them, a precise statement of what is assumed unproved where it does not —
  and labs that build the pricing toolkit from scratch.
tone: >
  Dry, precise, engineering register. Declarative statements of fact; no
  rhetorical questions, no teasers. Proofs carried in full in the discrete
  setting; in continuous time every fenced-off measure-theoretic fact is
  named as such, never faked. Second person only in instructions.
intro: >
  An option's payoff depends on a coin flip nobody can predict, yet its
  price is not a forecast and not an opinion. Quote a call on a \$4 stock
  at anything but \$1.20 and a trader can assemble a portfolio of stock and
  borrowed cash that beats you in every state of the world. The price is
  enforced by arbitrage, not estimated from beliefs — and this course is
  the working-out of that single fact.


  The argument is a chain of forced moves. In a two-state world,
  replication pins the price exactly, and the bookkeeping constants that
  appear are probabilities under which discounted prices are martingales:
  the risk-neutral measure arrives as a theorem, not a postulate. Chaining
  periods gives the binomial model, proved completely; refining the tree
  does not smooth the randomness away — quadratic variation survives in
  the limit as $dW\,dW = dt$, and Itô calculus is the chain rule that
  accounts for it. The same hedging argument then forces the Black–Scholes
  PDE and formula, with the stock's expected return nowhere in them. Then
  the market talks back: inverting the formula on real quotes returns not
  one volatility but a surface, so the closing modules treat that surface
  as data — extracting the market's implied distribution, bending the
  model with local volatility, and finally modelling volatility as the
  clustered, heavy-tailed process real returns exhibit, with GARCH fitted
  by the maximum likelihood you already know. Where measure-theoretic
  foundations are used but not proved, the course says so precisely;
  nothing is faked. Interest rates stay constant throughout — they appear
  exactly as far as pricing needs them and no further.
prerequisites:
  - text: "Calculus and calculus-based probability: distributions, expectation, variance, independence, the normal distribution, the central limit theorem"
  - text: "Likelihood and maximum-likelihood estimation, plus held-out-data validation habits"
    course: classical-ml
  - text: "Python and numpy at working-engineer level (labs are notebook assignments)"
key_results:
  - text: "The forward price $S_0 e^{rT}$ follows from replication alone — the stock's expected return never enters"
    lesson: expectation-vs-arbitrage
  - text: "Put–call parity $c - p = S_0 - Ke^{-rT}$ holds with no assumption on the stock's distribution"
    lesson: static-bounds-parity
  - text: "One-period replication forces $V_0 = \\frac{1}{1+r}[\\tilde p V_1(H) + \\tilde q V_1(T)]$, with $\\tilde p = \\frac{1+r-d}{u-d}$ appearing as algebra, not belief"
    lesson: one-period-binomial
  - text: "Under the risk-neutral measure, discounted stock and wealth processes are martingales, and every claim's price is a discounted conditional expectation"
    lesson: martingales-risk-neutral-pricing
  - text: "The American price is the smallest supermartingale dominating intrinsic value, and $\\tau^* = \\min\\{n : V_n = G_n\\}$ is an optimal exercise time"
    lesson: american-derivatives
  - text: "Brownian motion accumulates quadratic variation at rate one per unit time: $[W,W](T) = T$ almost surely — the fact written $dW\\,dW = dt$"
    lesson: brownian-motion
  - text: "The Itô–Doeblin formula adds the second-order term ordinary calculus forgets: $df = f_t\\,dt + f_x\\,dX + \\tfrac12 f_{xx}\\,dX\\,dX$"
    lesson: ito-formula
  - text: "Delta hedging plus term matching forces the Black–Scholes PDE; its solution prices the call with no drift input"
    lesson: black-scholes-pde
  - text: "Discrete delta-hedging error shrinks like $1/\\sqrt{n}$ in the rebalancing count; the stop-loss hedge does not improve at all"
    lesson: greeks-hedging-error
  - text: "Girsanov's theorem: an equivalent change of measure moves only the drift of Brownian motion — volatility is invariant"
    lesson: girsanov-theorem
  - text: "First and second fundamental theorems: a risk-neutral measure exists iff there is no arbitrage, and is unique iff every claim can be hedged"
    lesson: martingale-representation-ftap
  - text: "The risk-neutral density is readable off the option chain: $\\tilde p(K) = e^{rT}\\,\\partial^2 C/\\partial K^2$"
    lesson: implied-density
  - text: "Dupire's formula recovers the unique local volatility $\\sigma^2(K,T) = \\frac{2(C_T + rKC_K)}{K^2 C_{KK}}$ consistent with an arbitrage-free call surface"
    lesson: local-volatility
  - text: "GARCH(1,1) with conditionally normal shocks is unconditionally heavy-tailed, and stationary iff $\\alpha + \\beta < 1$"
    lesson: arch-garch
sources:
  - S. E. Shreve, Stochastic Calculus for Finance I — The Binomial Asset Pricing Model, Springer, 2004
  - S. E. Shreve, Stochastic Calculus for Finance II — Continuous-Time Models, Springer, 2004
  - M. Baxter, A. Rennie, Financial Calculus — An Introduction to Derivative Pricing, Cambridge, 1996
  - J. C. Hull, Options, Futures, and Other Derivatives, 9th ed., Pearson, 2015
  - J. C. Cox, S. A. Ross, M. Rubinstein, "Option Pricing — A Simplified Approach," Journal of Financial Economics 7, 1979
  - F. Black, M. Scholes, "The Pricing of Options and Corporate Liabilities," Journal of Political Economy 81, 1973
  - R. C. Merton, "Theory of Rational Option Pricing," Bell Journal of Economics 4, 1973
  - B. Dupire, "Pricing with a Smile," Risk 7(1), 1994
  - R. F. Engle, "Autoregressive Conditional Heteroscedasticity with Estimates of the Variance of United Kingdom Inflation," Econometrica 50, 1982
  - T. Bollerslev, "Generalized Autoregressive Conditional Heteroskedasticity," Journal of Econometrics 31, 1986
  - R. Cont, "Empirical Properties of Asset Returns — Stylized Facts and Statistical Issues," Quantitative Finance 1, 2001
  - J. Gatheral, The Volatility Surface — A Practitioner's Guide, Wiley, 2006
  - MIT 18.S096, Topics in Mathematics with Applications in Finance, OpenCourseWare, Fall 2013
  - P. P. Boyle, D. Emanuel, "Discretely Adjusted Option Hedges," Journal of Financial Economics 8, 1980
  - M. Bozoudis, M. Boutsikas, "Convergence of Binomial, Binomial Black-Scholes, and Trinomial Option Pricing Methods," Wolfram Demonstrations Project, 2014

spine:
  - step: >-
      A derivative's price is enforced, not estimated: any quote away from
      the cost of a replicating portfolio is free money for someone, so
      bounds follow from no-arbitrage alone — and in a two-state world, an
      exact price.
    label: Arbitrage, not opinion
    years: "1900–1973"
    caption: >-
      A call on a $4 stock has exactly one arbitrage-free price, $1.20 —
      quote anything else and a three-line trade of stock and borrowed cash
      collects the difference in both states of the world.
    lessons: [expectation-vs-arbitrage, static-bounds-parity, one-period-binomial, option-chain-bounds]
  - step: >-
      Chaining one-period replications backward through a tree prices every
      claim, and the bookkeeping constants that appear are probabilities
      under which discounted prices are martingales — the risk-neutral
      measure arrives as a consequence of no-arbitrage, not an assumption
      about the world.
    label: The binomial machine
    years: "1979"
    caption: >-
      Cox, Ross, and Rubinstein price a 3-period call at 34.065 against a
      market quote of 36, then walk the hedge tick by tick and collect a
      guaranteed 1.935 whichever path the stock takes.
    lessons: [multiperiod-binomial, coin-toss-probability, martingales-risk-neutral-pricing, state-prices-change-of-measure, crr-arbitrage-trade]
  - step: >-
      An American claim adds a choice — when to exercise — and pricing the
      choice forces optimal stopping: the price is the smallest
      supermartingale dominating the payoff, the optimal rule is the first
      time price meets payoff, and the exercise boundary is computable.
    label: The right to choose
    years: "1973–1979"
    caption: >-
      For a perpetual put on the doubling-or-halving stock, trying the
      candidate boundaries one by one reveals that "exercise when the stock
      falls to 2" beats every alternative — and only then is it proved
      optimal.
    lessons: [stopping-times, american-derivatives, first-passage-perpetual-put, early-exercise-in-practice, binomial-pricer-lab]
  - step: >-
      Refining the tree does not smooth the randomness away: the scaled
      walk converges to Brownian motion, quadratic variation survives in
      the limit as $dW\,dW = dt$, and Itô's formula is the chain rule that
      accounts for it — ordinary calculus provably mis-hedges.
    label: The continuous limit
    years: "1900–1951"
    caption: >-
      A hedger who holds the stock exactly when it is above the strike
      should replicate the call for free; Brownian motion crosses any level
      infinitely often, and the strategy's cost is exactly the local time
      the naive calculus cannot see.
    lessons: [random-walk-to-brownian-motion, brownian-motion, ito-integral, ito-formula, stop-loss-paradox, quadratic-variation-lab]
  - step: >-
      The one-period hedging argument survives the limit intact: holding
      $c_x$ shares kills the risk term, matching the $dt$ terms forces the
      Black–Scholes PDE, and its solution prices every European claim with
      no opinion about the stock's drift.
    label: Black–Scholes
    years: "1973"
    caption: >-
      The 1973 formula contains $S_0$, $K$, $r$, $\sigma$, $T$ — and not
      $\mu$: two economists derived a price for a bet on a stock's future
      in which the stock's expected return does not appear.
    lessons: [black-scholes-pde, black-scholes-formula, greeks-hedging-error, perpetual-american-put, portfolio-insurance-1987, discrete-hedging-lab]
  - step: >-
      Girsanov's theorem builds the continuous risk-neutral measure the
      tree promised, martingale representation guarantees the hedge
      exists, and the fundamental theorems make the equivalence exact —
      no arbitrage iff a risk-neutral measure exists, completeness iff it
      is unique; the pricing expectation is then computable by Monte Carlo
      and even readable off the option chain.
    label: The measure, completed
    years: "1979–1983"
    caption: >-
      Differentiate the market's call prices twice in the strike and the
      risk-neutral density appears on the screen: the measure the theory
      constructed is an observable object, and its left tail is fatter
      than any lognormal allows.
    lessons: [girsanov-theorem, risk-neutral-valuation, martingale-representation-ftap, monte-carlo-pricing, implied-density, monte-carlo-lab]
  - step: >-
      Inverting Black–Scholes on market quotes should return one number;
      it returns a surface — the market rejects constant volatility while
      using the formula daily as a quoting device — and local volatility
      shows exactly how far a one-factor diffusion can bend to fit the
      surface before the data demand new dynamics.
    label: The smile
    years: "1987–1994"
    caption: >-
      On September 15, 2005, a put 67 points out of the money expiring the
      next morning carried a 5-cent bid — a 13.7-standard-deviation move
      under the at-the-money volatility, an event no diffusion prices
      above zero to forty decimal places.
    lessons: [implied-volatility, volatility-smile, local-volatility, spx-surface-2005, vol-surface-lab]
  - step: >-
      Returns confess: volatility clusters, tails are heavy, crashes are
      asymmetric — a GARCH $\sigma_t$ fitted by maximum likelihood
      reproduces the facts, forecasts the volatility the market prices,
      and explains the smile the constant-$\sigma$ model could not.
    label: Volatility as a process
    years: "1963–2001"
    caption: >-
      Five-minute S&P futures returns have kurtosis 16 where an i.i.d.
      Gaussian allows 0.04 of wiggle; a GARCH(1,1) with three parameters,
      conditionally Gaussian throughout, produces exactly that excess.
    lessons: [stylized-facts, arch-garch, garch-mle, realized-implied-smile, garch-lab]

outcomes:
  - id: co-replicate
    text: >-
      Construct replicating portfolios and no-arbitrage prices — forwards,
      bounds, one-period and multiperiod binomial claims — and exhibit the
      explicit arbitrage against any other quote
    bloom: apply
  - id: co-measure
    text: >-
      Explain why the risk-neutral measure is a consequence of no-arbitrage
      rather than a postulate, and prove the discrete pricing and
      fundamental theorems in full
    bloom: analyze
  - id: co-stopping
    text: >-
      Price American claims by dynamic programming, characterize optimal
      exercise via the Snell envelope, and compute exercise boundaries
    bloom: apply
  - id: co-ito
    text: >-
      Compute with Brownian motion and Itô calculus — quadratic variation,
      Itô integrals, the Itô–Doeblin formula, Girsanov's theorem — and
      state precisely which measure-theoretic foundations are assumed
      unproved
    bloom: apply
  - id: co-blackscholes
    text: >-
      Derive the Black–Scholes PDE and formula via the hedging argument,
      compute the Greeks, and quantify the error of hedging at discrete
      times
    bloom: analyze
  - id: co-implement
    text: >-
      Implement the pricing toolkit from scratch — a binomial pricer with
      replication and exercise boundaries, a hedging simulator, Monte Carlo
      with variance reduction, a GARCH fitter, a volatility-surface
      builder — verified against held-out checkpoints
    bloom: create
  - id: co-smile
    text: >-
      Judge where Black–Scholes fails empirically: read a volatility
      surface, extract the market-implied density, and weigh local
      volatility against jump and stochastic-volatility explanations
    bloom: evaluate
  - id: co-volatility
    text: >-
      Model volatility as a process: establish the stylized facts, fit
      GARCH by maximum likelihood, and reconcile realized with implied
      volatility
    bloom: analyze

modules:
  - slug: arbitrage
    title: "Arbitrage and one-period replication"
    outcomes: [co-replicate]
    lessons:
      - slug: expectation-vs-arbitrage
        title: "Expectation pricing and the arbitrage alternative"
        type: core
        status: drafted
        key_image: figures/two-prices.svg
        goal: "Explain why expected payoff under real-world probabilities cannot price a forward contract, and compute the arbitrage-enforced forward price"
        opening: "A bookmaker who sets odds from his own correct win probabilities can lose a fortune on a single race; one who sets them from the money wagered breaks even no matter which horse wins — and a stock forward is priced the second way."
        est_minutes: 30
        prerequisites: []
        concepts:
          introduces: [arbitrage, replication, forward-price]
          reinforces: []
        key_ideas:
          - "The bookmaker parable: price from the book, not from beliefs"
          - "Expectation pricing gives the right answer for a coin flip and a provably wrong one for a forward"
          - "The forward replicated: borrow, buy the stock, deliver — $F_0 = S_0 e^{rT}$ with $\\mu$ nowhere in it"
          - "Arbitrage defined: zero cost now, no loss ever, profit with positive probability"
        demo: null
      - slug: static-bounds-parity
        title: "Model-free bounds and put–call parity"
        type: core
        status: drafted
        key_image: figures/call-corridor.svg
        goal: "Derive dominance bounds, put–call parity, and the no-early-exercise theorem for calls using only no-arbitrage"
        opening: "Before any model of how the stock moves, no-arbitrage alone pins a European call between $\\max(0, S_0 - Ke^{-rT})$ and $S_0$ — and ties calls to puts by an exact identity that holds for any distribution whatsoever."
        est_minutes: 36
        prerequisites: [expectation-vs-arbitrage]
        concepts:
          introduces: [put-call-parity, dominance-bounds]
          reinforces: [arbitrage, replication]
        key_ideas:
          - "The two-portfolio dominance pattern: a payoff table where one side never loses"
          - "Merton's Theorem 1: $c \\ge \\max(0, S - Ke^{-rT})$, no distribution assumed"
          - "Put–call parity as two replications run against each other"
          - "An American call on a non-dividend stock is never exercised early — so it prices as European"
          - "What arbitrage alone cannot do: a bound is an interval, not a price"
        demo: null
      - slug: one-period-binomial
        title: "The one-period binomial model"
        type: core
        status: drafted
        key_image: figures/arbitrage-tables.svg
        goal: "Construct the replicating portfolio for a one-period contingent claim and derive the risk-neutral pricing formula as its cost"
        opening: "Add the smallest possible model of movement — the stock goes to one of two values — and the price interval collapses to a point: every claim is replicated by $\\Delta$ shares plus a bond position, solved from two linear equations."
        est_minutes: 38
        prerequisites: [static-bounds-parity]
        concepts:
          introduces: [binomial-model, delta-hedging, risk-neutral-probability]
          reinforces: [arbitrage, replication]
        key_ideas:
          - "Shreve's opening example worked in dollars: $S_0=4$, $u=2$, $d=\\tfrac12$, $r=\\tfrac14$ — the call is worth exactly $1.20"
          - "No-arbitrage forces $0 < d < 1+r < u$; each violated inequality is an explicit trade"
          - "$\\tilde p = \\frac{1+r-d}{u-d}$ emerges as the algebra that cancels $\\Delta$ — bookkeeping first, probability second"
          - "Bulls and bears must agree on the call's value relative to the stock"
          - "Why two states: with three, replication by stock and bond has no solution (CRR's necessity theorem)"
        demo:
          component: ArbitrageLock
          spec: >
            The reader quotes a price for the one-period call (S0=4, u=2,
            d=1/2, r=1/4). For any quote != 1.20 the demo constructs the
            counter-trade (shares, bond, option) and shows its guaranteed
            P&L in both states; the task is to find the unique quote with
            zero arbitrage, then to read off the replicating portfolio.
            Presets: overpriced at 1.50, underpriced at 1.00, fair.
      - slug: option-chain-bounds
        title: "Bounds and parity in a real option chain"
        type: core
        status: drafted
        key_image: figures/parity-residuals.svg
        goal: "Test no-arbitrage bounds and put–call parity on a real exchange option chain and interpret the deviations"
        opening: "The May 2013 Google option chain — real bid/offer quotes across six strikes and three expiries — satisfies every bound and parity relation of this module to within the bid–ask spread, and the residual deviations measure exactly the frictions the theory assumed away."
        est_minutes: 28
        prerequisites: [static-bounds-parity]
        concepts:
          introduces: []
          reinforces: [put-call-parity, dominance-bounds, arbitrage, forward-price]
        key_ideas:
          - "Reading a chain: bid/offer, strike ladder, expiries, the mid-price convention"
          - "Parity checked strike by strike: the implied forward and implied borrowing rate"
          - "Deviations live inside the spread — the arbitrage is real but not collectible"
          - "Where the idealisation breaks: transaction costs, dividends, American exercise"
        demo: null

  - slug: binomial-model
    title: "The multiperiod binomial model"
    outcomes: [co-replicate, co-measure]
    lessons:
      - slug: multiperiod-binomial
        title: "Multiperiod replication and backward induction"
        type: core
        status: drafted
        key_image: figures/delta-tree.svg
        goal: "Construct the price and replicating portfolio of an arbitrary claim on an N-period binomial tree by backward induction, and prove the multiperiod replication theorem"
        opening: "Stringing one-period replications back to front prices any claim on any number of periods: the wealth equation propagates a portfolio forward, backward induction propagates values backward, and the two meet at every node."
        est_minutes: 38
        prerequisites: [one-period-binomial]
        concepts:
          introduces: [backward-induction, self-financing-portfolio]
          reinforces: [binomial-model, delta-hedging, risk-neutral-probability]
        key_ideas:
          - "The wealth equation $X_{n+1} = \\Delta_n S_{n+1} + (1+r)(X_n - \\Delta_n S_n)$ — self-financing made explicit"
          - "Theorem 1.2.2 proved by induction: the hedge matches the claim at every node of every path"
          - "Recombining trees: $n+1$ nodes instead of $2^n$ paths, and when path-dependence forbids the shortcut"
          - "The CRR 3-period example ($S_0=80$, $u=1.5$, $d=0.5$) computed node by node, $\\Delta$ evolving from 0.719 toward 0 or 1"
        demo:
          component: ReplicationWalker
          spec: >
            A 3-period tree with the claim priced by backward induction.
            The reader plays adversary: choose each coin toss trying to
            make the hedge miss; the portfolio value is recomputed at each
            node and always equals the claim value. Readouts: delta held,
            bond position, portfolio vs claim. Task: break the hedge (you
            cannot); then toggle "skip one rebalance" and watch it miss.
      - slug: coin-toss-probability
        title: "Probability on the coin-toss space"
        type: core
        status: drafted
        key_image: figures/tower.svg
        goal: "Compute conditional expectations on the coin-toss space and prove their five fundamental properties"
        opening: "Every object the binomial model needs — random variables, filtrations, conditional expectations — lives on a finite set of coin-toss sequences, where every proof is a finite sum and nothing has to be taken on faith."
        est_minutes: 36
        prerequisites: [multiperiod-binomial]
        concepts:
          introduces: [filtration, adapted-process, conditional-expectation]
          reinforces: [binomial-model, risk-neutral-probability]
        key_ideas:
          - "$\\Omega$ as the set of toss sequences; information at time $n$ = the first $n$ tosses"
          - "$E_n[X]$ defined by averaging over the unrevealed tosses — computed on the tree first, defined second"
          - "The five properties proved: linearity, taking out what is known, tower, independence, conditional Jensen"
          - "Adaptedness: why the hedger's $\\Delta_n$ may depend on the past and not the future"
        demo: null
      - slug: martingales-risk-neutral-pricing
        title: "Martingales and risk-neutral pricing"
        type: core
        status: drafted
        key_image: figures/induction-vs-expectation.svg
        goal: "Derive the general risk-neutral pricing formula by proving that discounted prices are martingales under the risk-neutral measure"
        opening: "The bookkeeping constants of the replication algebra assemble into a probability measure, and under it every discounted price in the model — stock, wealth, claim — is a martingale: a fair game whose conditional expectation goes nowhere."
        est_minutes: 40
        prerequisites: [coin-toss-probability]
        concepts:
          introduces: [martingale, risk-neutral-measure, markov-property]
          reinforces: [conditional-expectation, self-financing-portfolio, risk-neutral-probability, backward-induction]
        key_ideas:
          - "Martingale defined; the discounted stock is one under $\\tilde P$ exactly when $\\tilde p = \\frac{1+r-d}{u-d}$"
          - "Discounted wealth of any self-financing strategy is a $\\tilde P$-martingale — hence no arbitrage (the first fundamental theorem, easy direction)"
          - "Theorem 2.4.7: $V_n = \\tilde E_n\\left[\\frac{V_N}{(1+r)^{N-n}}\\right]$ — backward induction is a conditional expectation"
          - "The Markov property: for non-path-dependent claims, $V_n = v_n(S_n)$ — why the pricer only needs the current price"
        demo: null
      - slug: state-prices-change-of-measure
        title: "Change of measure and state prices"
        type: core
        status: drafted
        key_image: figures/z-tree.svg
        goal: "Construct the Radon–Nikodym derivative between the actual and risk-neutral measures and express prices as expectations under either"
        opening: "The actual measure $P$ and the risk-neutral measure $\\tilde P$ disagree about probabilities but agree about which events are impossible, and one random variable $Z = \\tilde P/P$ carries the entire disagreement — price with $\\tilde E$, or price with $E[Z \\cdot{}]$: same number."
        est_minutes: 34
        prerequisites: [martingales-risk-neutral-pricing]
        concepts:
          introduces: [radon-nikodym-derivative, state-price-density]
          reinforces: [martingale, risk-neutral-measure, conditional-expectation]
        key_ideas:
          - "$Z(\\omega) = \\tilde P(\\omega)/P(\\omega)$ on the tree; $E[Z]=1$, equivalence = same null events"
          - "The Radon–Nikodym process $Z_n = E_n[Z]$ is a martingale, computable node by node"
          - "State-price density $\\zeta_n = Z_n/(1+r)^n$: the price of a dollar in one state, and why depressed states cost more"
          - "The discrete rehearsal for Girsanov: changing measure re-weights paths, never rewrites them"
        demo: null
      - slug: crr-arbitrage-trade
        title: "The CRR arbitrage trade, reproduced"
        type: core
        status: drafted
        key_image: figures/ledger.svg
        goal: "Demonstrate Cox–Ross–Rubinstein's dynamic hedge against a mispriced call by reproducing it and verifying the locked-in profit path by path"
        opening: "In the 1979 paper that made binomial pricing standard, a call worth 34.065 trades at 36, and the authors walk the arbitrage step by step: sell the call, hold the replicating portfolio, rebalance at every node, and bank 1.935 compounded — whichever of the eight paths the stock takes."
        est_minutes: 30
        prerequisites: [multiperiod-binomial, martingales-risk-neutral-pricing]
        concepts:
          introduces: []
          reinforces: [backward-induction, delta-hedging, self-financing-portfolio, martingale, arbitrage]
        key_ideas:
          - "The full trade table: positions, rebalancing cash flows, and terminal settlement on two contrasting paths"
          - "Rebalance through the stock, never through the mispriced option — the counterexample where adjusting through calls destroys the profit"
          - "The foolish-counterparty argument: irrational early exercise only helps the hedger"
          - "Departures from the idealisation: trading only at tree dates, no transaction costs, known $u$ and $d$"
        demo: null

  - slug: american-options
    title: "American options and optimal stopping"
    outcomes: [co-stopping, co-implement]
    lessons:
      - slug: stopping-times
        title: "Stopping times and optional sampling"
        type: core
        status: drafted
        key_image: figures/fair-vs-foresight.svg
        goal: "Distinguish stopping times from foresight rules and prove that stopping preserves the martingale property"
        opening: "An exercise rule is admissible only if the decision to stop at time $n$ uses the first $n$ tosses alone — and this restriction, not any modeling choice, is what keeps a stopped martingale a martingale."
        est_minutes: 32
        prerequisites: [martingales-risk-neutral-pricing]
        concepts:
          introduces: [stopping-time, optional-sampling]
          reinforces: [martingale, adapted-process, filtration]
        key_ideas:
          - "Stopping time defined; first passage is one, 'the day before the maximum' is not"
          - "Shreve's six-figure sequence: a stopped martingale stays fair; stopping at a foresight rule manufactures profit"
          - "The optional sampling theorem: supermartingales stopped at stopping times stay supermartingales"
          - "Why the pricing theory needs this: an American option's holder cannot peek"
        demo: null
      - slug: american-derivatives
        title: "American options and the Snell envelope"

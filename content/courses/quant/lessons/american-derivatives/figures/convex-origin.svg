<svg viewBox="0 0 400 270" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .t { fill: currentColor; }
    .head { fill: currentColor; font-weight: 600; font-size: 12.5px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .axis { stroke: currentColor; stroke-width: 1; fill: none; opacity: 0.6; }
    .g { stroke: #e2903a; stroke-width: 2.2; fill: none; }
    .chord { stroke: #4c8dd6; stroke-width: 1.8; fill: none; }
    .guide { stroke: currentColor; stroke-width: 1; stroke-dasharray: 3 3; opacity: 0.45; }
    .gap { stroke: currentColor; stroke-width: 1.6; opacity: 0.8; }
    .s { fill: #e2903a; font-weight: 600; }
    .b { fill: #4c8dd6; font-weight: 600; }
    .dotA { fill: #e2903a; }
    .dotB { fill: #4c8dd6; }
  </style>
  <text class="head" x="12" y="18">Convex g with g(0) = 0: the chord from the origin lies above g</text>

  <line class="axis" x1="40" y1="220" x2="380" y2="220"/>
  <line class="axis" x1="40" y1="220" x2="40" y2="40"/>
  <text class="muted" x="380" y="236" text-anchor="end">s</text>
  <text class="muted" x="30" y="46" text-anchor="end">g</text>
  <text class="muted" x="40" y="236" text-anchor="middle">0</text>
  <text class="muted" x="180" y="236" text-anchor="middle">K = 5</text>
  <text class="muted" x="208" y="236" text-anchor="middle">λs = 6</text>
  <text class="muted" x="320" y="236" text-anchor="middle">s = 10</text>

  <polyline class="g" points="40,220 180,220 376,52"/>
  <line class="chord" x1="40" y1="220" x2="320" y2="100"/>

  <line class="guide" x1="208" y1="220" x2="208" y2="148"/>
  <line class="guide" x1="320" y1="220" x2="320" y2="100"/>
  <line class="gap" x1="208" y1="196" x2="208" y2="148"/>

  <circle class="dotA" cx="320" cy="100" r="4"/>
  <circle class="dotB" cx="208" cy="148" r="4"/>
  <circle class="dotA" cx="208" cy="196" r="4"/>

  <text class="s" x="330" y="96">(s, g(s)) = (10, 5)</text>
  <text class="b" x="218" y="144">chord: λ g(s) = 3</text>
  <text class="s" x="218" y="204">g(λs) = g(6) = 1</text>
  <text class="s" x="300" y="60" text-anchor="end">g(s) = (s − 5)⁺</text>
  <text class="muted" x="60" y="70">λ = 0.6 here; in the proof λ = 1/(1 + r)</text>
  <text class="muted" x="60" y="86">and s = (1 + r) Sₙ, so g(Sₙ) ≤ g((1 + r)Sₙ)/(1 + r)</text>
</svg>

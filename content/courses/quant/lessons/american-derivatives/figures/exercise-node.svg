<svg viewBox="0 0 320 230" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .t { fill: currentColor; }
    .head { fill: currentColor; font-weight: 600; font-size: 12.5px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .edge { stroke: currentColor; stroke-width: 1.2; fill: none; opacity: 0.45; }
    .node { fill: currentColor; }
    .s { fill: #e2903a; font-weight: 600; }
    .b { fill: #4c8dd6; font-weight: 600; }
    .barA { fill: #4c8dd6; opacity: 0.85; }
    .barB { fill: #e2903a; opacity: 0.85; }
  </style>
  <text class="head" x="12" y="18">Node S₂ = 4 of the $5 put</text>

  <line class="edge" x1="60" y1="90" x2="170" y2="50"/>
  <line class="edge" x1="60" y1="90" x2="170" y2="130"/>
  <circle class="node" cx="60" cy="90" r="4"/>
  <circle class="node" cx="170" cy="50" r="4"/>
  <circle class="node" cx="170" cy="130" r="4"/>
  <text class="muted" x="60" y="78" text-anchor="middle">S = 4</text>
  <text class="t" x="180" y="54">S = 8, pays 0</text>
  <text class="t" x="180" y="134">S = 2, pays 3</text>

  <text class="b" x="12" y="164">exercise now: (5 − 4)⁺ = 1</text>
  <rect class="barA" x="12" y="170" width="100" height="8" rx="2"/>
  <text class="s" x="12" y="200">continue: 0.8 · ½ (0 + 3) = 1.2</text>
  <rect class="barB" x="12" y="206" width="120" height="8" rx="2"/>
  <text class="muted" x="140" y="213">larger by 0.2</text>
</svg>

<svg viewBox="0 0 640 270" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .t { fill: currentColor; }
    .head { fill: currentColor; font-weight: 600; font-size: 13px; }
    .col { fill: currentColor; font-weight: 600; font-size: 11.5px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .rule { stroke: currentColor; stroke-width: 1; opacity: 0.35; }
    .s { fill: #e2903a; font-weight: 600; }
    .b { fill: #4c8dd6; font-weight: 600; }
    .hl { fill: #e2903a; opacity: 0.14; }
  </style>
  <text class="head" x="16" y="20">The seller's ledger along T, T, T; the buyer holds to expiry</text>

  <rect class="hl" x="236" y="94" width="96" height="40" rx="4"/>
  <rect class="hl" x="236" y="140" width="96" height="40" rx="4"/>

  <text class="col" x="30" y="50" text-anchor="middle">n</text>
  <text class="col" x="80" y="50" text-anchor="middle">Sₙ</text>
  <text class="col" x="160" y="50" text-anchor="middle">Xₙ = Vₙ</text>
  <text class="col" x="284" y="50" text-anchor="middle">withdraw Cₙ</text>
  <text class="col" x="380" y="50" text-anchor="middle">Δₙ</text>
  <text class="col" x="466" y="50" text-anchor="middle">money market</text>
  <text class="col" x="570" y="50" text-anchor="middle">buyer should</text>
  <line class="rule" x1="16" y1="58" x2="624" y2="58"/>

  <text class="t" x="30" y="80" text-anchor="middle">0</text>
  <text class="t" x="80" y="80" text-anchor="middle">4</text>
  <text class="t" x="160" y="80" text-anchor="middle">1.392</text>
  <text class="t" x="284" y="80" text-anchor="middle">0</text>
  <text class="b" x="380" y="80" text-anchor="middle">−0.42</text>
  <text class="t" x="466" y="80" text-anchor="middle">3.072</text>
  <text class="muted" x="570" y="80" text-anchor="middle">wait (1.392 > 1)</text>

  <text class="t" x="30" y="120" text-anchor="middle">1</text>
  <text class="t" x="80" y="120" text-anchor="middle">2</text>
  <text class="t" x="160" y="120" text-anchor="middle">3.000</text>
  <text class="s" x="284" y="120" text-anchor="middle">0.92</text>
  <text class="b" x="380" y="120" text-anchor="middle">−0.9333</text>
  <text class="t" x="466" y="120" text-anchor="middle">3.9467</text>
  <text class="s" x="570" y="120" text-anchor="middle">exercise for 3</text>

  <text class="t" x="30" y="166" text-anchor="middle">2</text>
  <text class="t" x="80" y="166" text-anchor="middle">1</text>
  <text class="t" x="160" y="166" text-anchor="middle">4.000</text>
  <text class="s" x="284" y="166" text-anchor="middle">1</text>
  <text class="b" x="380" y="166" text-anchor="middle">−1</text>
  <text class="t" x="466" y="166" text-anchor="middle">4</text>
  <text class="s" x="570" y="166" text-anchor="middle">exercise for 4</text>

  <text class="t" x="30" y="206" text-anchor="middle">3</text>
  <text class="t" x="80" y="206" text-anchor="middle">0.5</text>
  <text class="t" x="160" y="206" text-anchor="middle">4.500</text>
  <text class="muted" x="284" y="206" text-anchor="middle">—</text>
  <text class="muted" x="380" y="206" text-anchor="middle">—</text>
  <text class="muted" x="466" y="206" text-anchor="middle">—</text>
  <text class="t" x="570" y="206" text-anchor="middle">pays 4.5 = G₃</text>
  <line class="rule" x1="16" y1="220" x2="624" y2="220"/>

  <text class="muted" x="16" y="244">each row: Xₙ₊₁ = Δₙ Sₙ₊₁ + 1.25 · (money market), money market = Xₙ − Cₙ − Δₙ Sₙ</text>
  <text class="muted" x="16" y="260">withdrawals total 0.92 + 1 = 1.92, taken at exactly the two dates the buyer let pass</text>
</svg>

<svg viewBox="0 0 560 310" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .t { fill: currentColor; }
    .head { fill: currentColor; font-weight: 600; font-size: 13px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .axis { stroke: currentColor; stroke-width: 1; fill: none; opacity: 0.6; }
    .g { stroke: currentColor; stroke-width: 1.6; fill: none; opacity: 0.5; }
    .gdot { fill: currentColor; opacity: 0.6; }
    .v { stroke: #e2903a; stroke-width: 2.2; fill: none; }
    .vdot { fill: #e2903a; }
    .y { stroke: #4c8dd6; stroke-width: 1.8; fill: none; stroke-dasharray: 5 4; }
    .s { fill: #e2903a; font-weight: 600; }
    .b { fill: #4c8dd6; font-weight: 600; }
    .ring { fill: none; stroke: #e2903a; stroke-width: 2; }
    .guide { stroke: currentColor; stroke-width: 1; stroke-dasharray: 3 3; opacity: 0.4; }
  </style>
  <text class="head" x="16" y="20">Along the path T, H, H: payoff G, price V, and a dominating supermartingale</text>

  <line class="axis" x1="70" y1="250" x2="530" y2="250"/>
  <line class="axis" x1="70" y1="250" x2="70" y2="40"/>
  <text class="muted" x="60" y="254" text-anchor="end">0</text>
  <text class="muted" x="60" y="54" text-anchor="end">5</text>
  <text class="muted" x="60" y="134" text-anchor="end">3</text>
  <text class="muted" x="60" y="214" text-anchor="end">1</text>
  <text class="muted" x="100" y="268" text-anchor="middle">n = 0</text>
  <text class="muted" x="230" y="268" text-anchor="middle">n = 1 (T)</text>
  <text class="muted" x="360" y="268" text-anchor="middle">n = 2 (TH)</text>
  <text class="muted" x="490" y="268" text-anchor="middle">n = 3 (THH)</text>
  <text class="muted" x="60" y="34" text-anchor="end">value</text>

  <line class="y" x1="70" y1="50" x2="530" y2="50"/>
  <text class="b" x="526" y="44" text-anchor="end">Z ≡ 5: dominates, supermartingale, not smallest</text>

  <polyline class="g" points="100,210 230,130 360,210 490,250"/>
  <polyline class="v" points="100,194.3 230,130 360,202 490,250"/>

  <circle class="gdot" cx="100" cy="210" r="3.5"/>
  <circle class="gdot" cx="360" cy="210" r="3.5"/>
  <circle class="gdot" cx="490" cy="250" r="3.5"/>
  <circle class="vdot" cx="100" cy="194.3" r="4"/>
  <circle class="vdot" cx="230" cy="130" r="4"/>
  <circle class="ring" cx="230" cy="130" r="9"/>
  <circle class="vdot" cx="360" cy="202" r="4"/>
  <circle class="vdot" cx="490" cy="250" r="4"/>

  <text class="s" x="92" y="186" text-anchor="end">V = 1.392</text>
  <text class="muted" x="92" y="222" text-anchor="end">G = 1</text>
  <text class="s" x="230" y="114" text-anchor="middle">V = G = 3: exercise</text>
  <text class="s" x="372" y="198">V = 1.2</text>
  <text class="muted" x="372" y="222">G = 1</text>
  <text class="muted" x="500" y="240">V = G = 0</text>

  <text class="s" x="80" y="296">amber: the price V, on or above the payoff</text>
  <text class="muted" x="330" y="296">grey: the payoff G = (5 − S)⁺</text>
</svg>

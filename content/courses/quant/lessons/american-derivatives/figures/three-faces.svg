<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .t { fill: currentColor; }
    .head { fill: currentColor; font-weight: 600; font-size: 13px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .box { fill: none; stroke: currentColor; stroke-width: 1.2; opacity: 0.6; }
    .boxA { fill: none; stroke: #e2903a; stroke-width: 1.6; }
    .arrow { stroke: currentColor; stroke-width: 1.3; fill: none; opacity: 0.6; }
    .lab { fill: #4c8dd6; font-weight: 600; font-size: 11px; }
    .s { fill: #e2903a; font-weight: 700; font-size: 16px; }
    .title { fill: currentColor; font-weight: 600; font-size: 12px; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" opacity="0.6"/>
    </marker>
  </defs>
  <text class="head" x="16" y="20">One process, three descriptions</text>

  <rect class="boxA" x="24" y="44" width="260" height="78" rx="6"/>
  <text class="title" x="36" y="64">The pass</text>
  <text class="t" x="36" y="84">Vₙ = max { Gₙ, ⅟₍₁₊ᵣ₎ [p̃ Vₙ₊₁(H) + q̃ Vₙ₊₁(T)] }</text>
  <text class="muted" x="36" y="104">one comparison per node, backward from expiry</text>

  <rect class="box" x="356" y="44" width="260" height="78" rx="6"/>
  <text class="title" x="368" y="64">The Snell envelope</text>
  <text class="t" x="368" y="84">smallest Y with Yₙ ≥ Gₙ/(1+r)ⁿ and</text>
  <text class="t" x="368" y="104">Ẽₙ[Yₙ₊₁] ≤ Yₙ (a supermartingale)</text>

  <rect class="box" x="190" y="228" width="260" height="78" rx="6"/>
  <text class="title" x="202" y="248">The best stopping time</text>
  <text class="t" x="202" y="268">V₀ = max over τ of Ẽ[G_τ /(1+r)^τ],</text>
  <text class="t" x="202" y="288">attained by τ* = min { n : Vₙ = Gₙ }</text>

  <line class="arrow" x1="284" y1="83" x2="356" y2="83" marker-end="url(#ah)" marker-start="url(#ah)"/>
  <text class="lab" x="320" y="72" text-anchor="middle">Theorem 2.1</text>
  <text class="muted" x="320" y="140" text-anchor="middle">both arms of the max, then backward induction</text>

  <line class="arrow" x1="486" y1="122" x2="380" y2="228" marker-end="url(#ah)"/>
  <text class="lab" x="470" y="182">Theorem 4.1, upper bound</text>
  <text class="muted" x="470" y="196">optional sampling I on Y</text>

  <line class="arrow" x1="154" y1="122" x2="260" y2="228" marker-end="url(#ah)"/>
  <text class="lab" x="150" y="182" text-anchor="end">Theorem 4.1, attainment</text>
  <text class="muted" x="150" y="196" text-anchor="end">Y stopped at τ* is a martingale</text>

  <text class="s" x="320" y="178" text-anchor="middle">1.392</text>
  <text class="muted" x="320" y="194" text-anchor="middle">at the root of the 3-period $5 put</text>
</svg>

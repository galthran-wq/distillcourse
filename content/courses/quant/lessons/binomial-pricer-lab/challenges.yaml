  hedge-walk:
    kind: exact
    seed: 105
    atol: 1.0e-9
    inputs_code: |
      n = int(rng.integers(5, 9))
      u = float(rng.uniform(1.15, 1.8))
      d = float(rng.uniform(0.55, 0.9))
      r = float(rng.uniform(0.01, 0.1))
      S0 = float(rng.uniform(20.0, 150.0))
      K = float(S0 * rng.uniform(0.8, 1.2))
      inputs = (S0, u, d, r, n, K, rng.integers(0, 2, size=n))
    wrong:
      - hint: "The money-market position grows: X_{i+1} = Δ_i S_{i+1} + (1 + r)(X_i − Δ_i S_i). Without the (1 + r) the hedge loses one period's interest on its cash at every step."
        code: |
          def f(S0, u, d, r, n, K, path):
              import numpy as np
              S = [S0 * u ** np.arange(i + 1) * d ** (i - np.arange(i + 1)) for i in range(n + 1)]
              p = (1 + r - d) / (u - d)
              V = [None] * (n + 1)
              V[n] = np.maximum(S[n] - K, 0.0)
              for i in range(n - 1, -1, -1):
                  V[i] = (p * V[i + 1][1:] + (1 - p) * V[i + 1][:-1]) / (1 + r)
              D = [(V[i + 1][1:] - V[i + 1][:-1]) / (S[i + 1][1:] - S[i + 1][:-1]) for i in range(n)]
              X = np.empty(n + 1)
              X[0] = V[0][0]
              s, heads = S0, 0
              for i, toss in enumerate(path):
                  s_next = s * (u if toss else d)
                  X[i + 1] = D[i][heads] * s_next + (X[i] - D[i][heads] * s)
                  s, heads = s_next, heads + int(toss)
              return X
      - hint: "The path's 1 is a head, an up move: the stock is multiplied by u on a 1 and by d on a 0, and the node index j is the number of 1s so far. Your walk reads the tosses the other way round."
        code: |
          def f(S0, u, d, r, n, K, path):
              import numpy as np
              S = [S0 * u ** np.arange(i + 1) * d ** (i - np.arange(i + 1)) for i in range(n + 1)]
              p = (1 + r - d) / (u - d)
              V = [None] * (n + 1)
              V[n] = np.maximum(S[n] - K, 0.0)
              for i in range(n - 1, -1, -1):
                  V[i] = (p * V[i + 1][1:] + (1 - p) * V[i + 1][:-1]) / (1 + r)
              D = [(V[i + 1][1:] - V[i + 1][:-1]) / (S[i + 1][1:] - S[i + 1][:-1]) for i in range(n)]
              X = np.empty(n + 1)
              X[0] = V[0][0]
              s, heads = S0, 0
              for i, toss in enumerate(path):
                  s_next = s * (d if toss else u)
                  X[i + 1] = D[i][heads] * s_next + (1 + r) * (X[i] - D[i][heads] * s)
                  s, heads = s_next, heads + int(not toss)
              return X
      - hint: "Δ is chosen at date i, before the toss, and the node index is the number of heads so far — not after the toss. Reading Δ_i at the node the path is about to move to uses information the hedger does not have yet."
        code: |
          def f(S0, u, d, r, n, K, path):
              import numpy as np
              S = [S0 * u ** np.arange(i + 1) * d ** (i - np.arange(i + 1)) for i in range(n + 1)]
              p = (1 + r - d) / (u - d)
              V = [None] * (n + 1)
              V[n] = np.maximum(S[n] - K, 0.0)
              for i in range(n - 1, -1, -1):
                  V[i] = (p * V[i + 1][1:] + (1 - p) * V[i + 1][:-1]) / (1 + r)
              D = [(V[i + 1][1:] - V[i + 1][:-1]) / (S[i + 1][1:] - S[i + 1][:-1]) for i in range(n)]
              X = np.empty(n + 1)
              X[0] = V[0][0]
              s, heads = S0, 0
              for i, toss in enumerate(path):
                  s_next = s * (u if toss else d)
                  j = min(heads + int(toss), i)
                  X[i + 1] = D[i][j] * s_next + (1 + r) * (X[i] - D[i][j] * s)
                  s, heads = s_next, heads + int(toss)
              return X
  american-put:
    kind: exact
    seed: 106
    atol: 1.0e-9
    inputs_code: |
      n = int(rng.integers(5, 9))
      u = float(rng.uniform(1.15, 1.8))
      d = float(rng.uniform(0.55, 0.9))
      r = float(rng.uniform(0.01, 0.1))
      S0 = float(rng.uniform(20.0, 150.0))
      K = float(S0 * rng.uniform(0.9, 1.3))
      inputs = (S0, u, d, r, n, K)
    wrong:
      - hint: "The continuation value is not discounted. Undiscounted continuation is too large, so fewer nodes exercise — and every value is too high. Divide the risk-neutral average by 1 + r before comparing it with the intrinsic value."
        code: |
          def f(S0, u, d, r, n, K):
              import numpy as np
              S = [S0 * u ** np.arange(i + 1) * d ** (i - np.arange(i + 1)) for i in range(n + 1)]
              p = (1 + r - d) / (u - d)
              V, E = [None] * (n + 1), [None] * (n + 1)
              g = np.maximum(K - S[n], 0.0)
              V[n], E[n] = g, g > 0
              for i in range(n - 1, -1, -1):
                  cont = p * V[i + 1][1:] + (1 - p) * V[i + 1][:-1]
                  g = np.maximum(K - S[i], 0.0)
                  V[i], E[i] = np.maximum(g, cont), g > cont
              return np.concatenate(V), np.concatenate(E).astype(float)
      - hint: "The intrinsic value is what exercising pays today, undiscounted: compare g(S_i) itself with the discounted continuation. Discounting the intrinsic value as well shifts the exercise region down by one node and undervalues the claim."
        code: |
          def f(S0, u, d, r, n, K):
              import numpy as np
              S = [S0 * u ** np.arange(i + 1) * d ** (i - np.arange(i + 1)) for i in range(n + 1)]
              p = (1 + r - d) / (u - d)
              V, E = [None] * (n + 1), [None] * (n + 1)
              g = np.maximum(K - S[n], 0.0)
              V[n], E[n] = g, g > 0
              for i in range(n - 1, -1, -1):
                  cont = (p * V[i + 1][1:] + (1 - p) * V[i + 1][:-1]) / (1 + r)
                  g = np.maximum(K - S[i], 0.0) / (1 + r)
                  V[i], E[i] = np.maximum(g, cont), g > cont
              return np.concatenate(V), np.concatenate(E).astype(float)
      - hint: "The values are right and the exercise flags are not: a node is an exercise node only where the intrinsic value is STRICTLY greater than the continuation value. Where both are zero — a put far out of the money — nothing is exercised, and ≥ marks every such node."
        code: |
          def f(S0, u, d, r, n, K):
              import numpy as np
              S = [S0 * u ** np.arange(i + 1) * d ** (i - np.arange(i + 1)) for i in range(n + 1)]
              p = (1 + r - d) / (u - d)
              V, E = [None] * (n + 1), [None] * (n + 1)
              g = np.maximum(K - S[n], 0.0)
              V[n], E[n] = g, g >= 0
              for i in range(n - 1, -1, -1):
                  cont = (p * V[i + 1][1:] + (1 - p) * V[i + 1][:-1]) / (1 + r)
                  g = np.maximum(K - S[i], 0.0)
                  V[i], E[i] = np.maximum(g, cont), g >= cont
              return np.concatenate(V), np.concatenate(E).astype(float)
  exercise-boundary:
    kind: exact
    seed: 107
    atol: 1.0e-6
    inputs_code: |
      # A fifty-step CRR-calibrated put near the Wolfram demonstration's parameters.
      K = float(rng.uniform(40.0, 48.0))
      sigma = float(rng.uniform(0.2, 0.4))
      inputs = (40.0, K, 0.07, sigma, 3.0, 50)
    wrong:
      - hint: "That is the LOWEST exercising node — on a put it is the bottom of the lattice, and it falls over time instead of rising toward the strike. The boundary is the highest node on each date where exercising still beats continuing."
        code: |
          def f(S0, K, rate, sigma, T, n):
              import numpy as np
              dt = T / n
              u = np.exp(sigma * np.sqrt(dt)); d = 1 / u; r = np.exp(rate * dt) - 1
              S = [S0 * u ** np.arange(i + 1) * d ** (i - np.arange(i + 1)) for i in range(n + 1)]
              p = (1 + r - d) / (u - d)
              V, E = [None] * (n + 1), [None] * (n + 1)
              g = np.maximum(K - S[n], 0.0)
              V[n], E[n] = g, g > 0
              for i in range(n - 1, -1, -1):
                  cont = (p * V[i + 1][1:] + (1 - p) * V[i + 1][:-1]) / (1 + r)
                  g = np.maximum(K - S[i], 0.0)
                  V[i], E[i] = np.maximum(g, cont), g > cont
              b = np.zeros(n + 1)
              for i in range(n + 1):
                  hits = np.flatnonzero(E[i])
                  if hits.size:
                      b[i] = S[i][hits.min()]
              return b
      - hint: "The boundary is a price, not an index: return S[i][j*] for the highest exercising node j*, not j* itself."
        code: |
          def f(S0, K, rate, sigma, T, n):
              import numpy as np
              dt = T / n
              u = np.exp(sigma * np.sqrt(dt)); d = 1 / u; r = np.exp(rate * dt) - 1
              S = [S0 * u ** np.arange(i + 1) * d ** (i - np.arange(i + 1)) for i in range(n + 1)]
              p = (1 + r - d) / (u - d)
              V, E = [None] * (n + 1), [None] * (n + 1)

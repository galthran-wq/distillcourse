  no-early-exercise-call:
    kind: review
    rubric: |
      The learner ran an American call on a non-dividend CRR tree, found zero
      exercise nodes before expiry, and was asked which theorem predicted it,
      what its hypotheses are, and — for at least one hypothesis — what the
      count would do if it failed.
      Pass if the answer (a) attributes the result to the convex-payoff /
      no-early-exercise theorem (Shreve Vol I Theorem 4.5.1, or a clear
      description of it: an American claim with a convex payoff vanishing at
      zero has the European price) AND (b) names at least two of its three
      hypotheses: the payoff g is convex; g(0) = 0; the interest rate is
      non-negative (r ≥ 0) — crediting "no dividends" as the condition that
      keeps the discounted stock a martingale counts toward (b) — AND (c)
      states for at least one named hypothesis that its failure lets exercise
      nodes appear before expiry (the count becomes positive): the put fails
      g(0) = 0 and section 6 found exercise nodes; a negative rate, or a
      dividend, restores early exercise for the call. Any one such case
      satisfies (c); it need not be worked numerically.
      Fail if the answer argues only from "time value" or "a call is worth
      more alive than dead" without naming a hypothesis, attributes the
      result to put–call parity alone, claims the same holds for the put, or
      names hypotheses without saying what any failure does to the count.
      Grade the theorem, the hypotheses named and the failure case, not the
      prose.
  converged-price:
    kind: metric
    metric: rmse
    threshold: -0.04
    holdout: data/holdout_puts.csv
    labels_code: |
      # Dollars in the file, tenths of a cent on the wire: the submission is
      # 1000 × price, so the threshold of 0.04 is four thousandths of a cent.
      labels = 1000.0 * np.loadtxt("private/reference_prices.csv")

checkpoints:
  stock-lattice:
    kind: exact
    seed: 101
    atol: 1.0e-9
    inputs_code: |
      n = int(rng.integers(5, 9))
      u = float(rng.uniform(1.15, 1.8))
      d = float(rng.uniform(0.55, 0.9))
      r = float(rng.uniform(0.01, 0.1))
      inputs = (float(rng.uniform(20.0, 150.0)), u, d, r, n)
    wrong:
      - hint: "Index j counts heads (up moves): S[i][j] = S0 u^j d^(i−j) rises with j, so S[i][0] is the lowest price on date i. Your lattice runs the other way."
        code: |
          def f(S0, u, d, r, n):
              import numpy as np
              out = []
              for i in range(n + 1):
                  j = np.arange(i + 1)
                  out.append(S0 * d**j * u ** (i - j))
              return np.concatenate(out)
      - hint: "An n-period tree has n + 1 dates, 0 through n; the lattice is one array short."
        code: |
          def f(S0, u, d, r, n):
              import numpy as np
              out = []
              for i in range(n):
                  j = np.arange(i + 1)
                  out.append(S0 * u**j * d ** (i - j))
              return np.concatenate(out)
  risk-neutral-prob:
    kind: exact
    seed: 102
    atol: 1.0e-12
    inputs_code: |
      u = float(rng.uniform(1.15, 1.8))
      d = float(rng.uniform(0.55, 0.9))
      r = float(rng.uniform(0.01, 0.1))
      inputs = (float(rng.uniform(20.0, 150.0)), u, d, r, int(rng.integers(3, 8)))
    wrong:
      - hint: "That is q̃ = (u − 1 − r)/(u − d), the probability of a tail. The head probability p̃ = (1 + r − d)/(u − d) weights the up-child; the two sum to one."
        code: |
          def f(S0, u, d, r, n):
              return (u - 1 - r) / (u - d)
      - hint: "The interest rate is missing: p̃ solves S0 = (p̃ u S0 + (1 − p̃) d S0)/(1 + r), so the numerator is 1 + r − d, not 1 − d."
        code: |
          def f(S0, u, d, r, n):
              return (1 - d) / (u - d)
  european-price:
    kind: exact
    seed: 103
    atol: 1.0e-9
    inputs_code: |
      n = int(rng.integers(4, 9))
      u = float(rng.uniform(1.15, 1.8))
      d = float(rng.uniform(0.55, 0.9))
      r = float(rng.uniform(0.01, 0.1))
      S0 = float(rng.uniform(20.0, 150.0))
      K = float(S0 * rng.uniform(0.8, 1.2))
      inputs = (S0, u, d, r, n, K)
    wrong:
      - hint: "The continuation value is discounted: each step back divides the risk-neutral average by 1 + r. Without it every node is too high by a factor (1 + r) per period remaining."
        code: |
          def f(S0, u, d, r, n, K):
              import numpy as np
              S = [S0 * u ** np.arange(i + 1) * d ** (i - np.arange(i + 1)) for i in range(n + 1)]
              p = (1 + r - d) / (u - d)
              V = [None] * (n + 1)
              V[n] = np.abs(S[n] - K)
              for i in range(n - 1, -1, -1):
                  V[i] = p * V[i + 1][1:] + (1 - p) * V[i + 1][:-1]
              return np.concatenate(V)
      - hint: "The children are swapped: the up-child of node (i, j) is (i + 1, j + 1) and takes weight p̃; the down-child (i + 1, j) takes 1 − p̃."
        code: |
          def f(S0, u, d, r, n, K):
              import numpy as np
              S = [S0 * u ** np.arange(i + 1) * d ** (i - np.arange(i + 1)) for i in range(n + 1)]
              p = (1 + r - d) / (u - d)
              V = [None] * (n + 1)
              V[n] = np.abs(S[n] - K)
              for i in range(n - 1, -1, -1):
                  V[i] = (p * V[i + 1][:-1] + (1 - p) * V[i + 1][1:]) / (1 + r)
              return np.concatenate(V)
      - hint: "The payoff is applied at every date, not only the last: a European claim pays nothing before expiry, so only V[n] is the payoff and every earlier node is pure continuation."
        code: |
          def f(S0, u, d, r, n, K):
              import numpy as np
              S = [S0 * u ** np.arange(i + 1) * d ** (i - np.arange(i + 1)) for i in range(n + 1)]
              p = (1 + r - d) / (u - d)
              V = [None] * (n + 1)
              V[n] = np.abs(S[n] - K)
              for i in range(n - 1, -1, -1):
                  V[i] = np.maximum(np.abs(S[i] - K), (p * V[i + 1][1:] + (1 - p) * V[i + 1][:-1]) / (1 + r))
              return np.concatenate(V)

      - hint: "Δ_i is read off date i + 1: the spread of the claim's two possible values one toss ahead over the spread of the two possible prices. Differences taken on date i itself give a lattice of the wrong shape and the wrong slope."
        code: |
          def f(S0, u, d, r, n, K):
              import numpy as np
              S = [S0 * u ** np.arange(i + 1) * d ** (i - np.arange(i + 1)) for i in range(n + 1)]

<svg viewBox="0 0 640 344" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .t { fill: currentColor; }
    .head { fill: currentColor; font-weight: 600; font-size: 13px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .ax { stroke: currentColor; stroke-width: 1; fill: none; opacity: 0.6; }
    .guide { stroke: currentColor; opacity: 0.35; stroke-dasharray: 3 3; fill: none; }
    .amb { stroke: #e2903a; fill: none; stroke-width: 1.6; }
    .blu { stroke: #4c8dd6; fill: none; stroke-width: 1.6; }
    .grn { stroke: #5aa46a; fill: none; stroke-width: 1.6; }
    .famb { fill: #e2903a; opacity: 0.18; }
    .fblu { fill: #4c8dd6; opacity: 0.18; }
    .lamb { fill: #e2903a; font-weight: 600; }
    .lblu { fill: #4c8dd6; font-weight: 600; }
    .lgrn { fill: #5aa46a; font-weight: 600; }
  </style>
  <text class="head" x="16" y="22">Module 2 (finite coin-toss space)</text>
  <text class="head" x="330" y="22">Continuous time (this lesson)</text>
  <line class="ax" x1="16" y1="30" x2="624" y2="30"/>
  <text class="t" x="16" y="52" font-size="11.5">Sample space Ω</text>
  <text class="muted" x="16" y="67">2ᴺ toss sequences, each with probability pᴴqᵀ</text>
  <text class="t" x="330" y="52" font-size="11.5">paths; every single path has probability 0</text>
  <text class="muted" x="330" y="69" font-size="10">definition restated</text>
  <line class="guide" x1="16" y1="80" x2="624" y2="80"/>
  <text class="t" x="16" y="92" font-size="11.5">Probability zero</text>
  <text class="muted" x="16" y="107">means the outcome is not in Ω</text>
  <text class="t" x="330" y="92" font-size="11.5">'almost surely' = probability one, exceptions allowed</text>
  <text class="muted" x="330" y="109" font-size="10">definition restated</text>
  <line class="guide" x1="16" y1="120" x2="624" y2="120"/>
  <text class="t" x="16" y="132" font-size="11.5">Expectation E[X]</text>
  <text class="muted" x="16" y="147">the finite sum Σ X(ω) P(ω)</text>
  <text class="t" x="330" y="132" font-size="11.5">the integral ∫ X dP; finite a.s. does not imply finite E</text>
  <text class="muted" x="330" y="149" font-size="10">definition restated</text>
  <line class="guide" x1="16" y1="160" x2="624" y2="160"/>
  <text class="t" x="16" y="172" font-size="11.5">Conditional expectation</text>
  <text class="muted" x="16" y="187">computed: average over unrevealed tosses</text>
  <text class="t" x="330" y="172" font-size="11.5">defined by partial averaging; existence cited</text>
  <rect x="330" y="178" width="86" height="15" rx="3" fill="#e2903a" opacity="0.18"/>
  <text class="lamb" x="373" y="189" text-anchor="middle" font-size="10">stated, not proved</text>
  <line class="guide" x1="16" y1="200" x2="624" y2="200"/>
  <text class="t" x="16" y="212" font-size="11.5">Its five properties</text>
  <text class="muted" x="16" y="227">proved on the tree, one finite sum each</text>
  <text class="t" x="330" y="212" font-size="11.5">linear, take out known, tower, independence, Jensen</text>
  <rect x="330" y="218" width="86" height="15" rx="3" fill="#5aa46a" opacity="0.18"/>
  <text class="lgrn" x="373" y="229" text-anchor="middle" font-size="10">✓ carried over</text>
  <line class="guide" x1="16" y1="240" x2="624" y2="240"/>
  <text class="t" x="16" y="252" font-size="11.5">The process</text>
  <text class="muted" x="16" y="267">the walk Mₖ, built from the tosses</text>
  <text class="t" x="330" y="252" font-size="11.5">existence of W with Definition 1's properties cited</text>
  <rect x="330" y="258" width="86" height="15" rx="3" fill="#e2903a" opacity="0.18"/>
  <text class="lamb" x="373" y="269" text-anchor="middle" font-size="10">stated, not proved</text>
  <line class="guide" x1="16" y1="280" x2="624" y2="280"/>
  <text class="t" x="16" y="292" font-size="11.5">Quadratic variation</text>
  <text class="muted" x="16" y="307">= k on every path, by counting</text>
  <text class="t" x="330" y="292" font-size="11.5">= T almost surely, by an L² argument (this lesson)</text>
  <rect x="330" y="298" width="86" height="15" rx="3" fill="#4c8dd6" opacity="0.18"/>
  <text class="lblu" x="373" y="309" text-anchor="middle" font-size="10">proved here</text>
  <line class="guide" x1="16" y1="320" x2="624" y2="320"/>
  <text class="muted" x="16" y="334">Two debts, each cited to where its proof lives; everything else is a restated definition or a result that carries over.</text>
</svg>

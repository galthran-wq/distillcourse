<svg viewBox="0 0 640 290" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .t { fill: currentColor; }
    .head { fill: currentColor; font-weight: 600; font-size: 13px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .ax { stroke: currentColor; stroke-width: 1; fill: none; opacity: 0.6; }
    .guide { stroke: currentColor; opacity: 0.35; stroke-dasharray: 3 3; fill: none; }
    .amb { stroke: #e2903a; fill: none; stroke-width: 1.6; }
    .blu { stroke: #4c8dd6; fill: none; stroke-width: 1.6; }
    .grn { stroke: #5aa46a; fill: none; stroke-width: 1.6; }
    .famb { fill: #e2903a; opacity: 0.18; }
    .fblu { fill: #4c8dd6; opacity: 0.18; }
    .lamb { fill: #e2903a; font-weight: 600; }
    .lblu { fill: #4c8dd6; font-weight: 600; }
    .lgrn { fill: #5aa46a; font-weight: 600; }
  </style>
  <text class="head" x="16" y="22">The sampled quadratic variation is a sum of independent blocks</text>
  <rect x="30" y="40" width="112" height="34" rx="4" fill="#4c8dd6" opacity="0.18"/>
  <text class="lblu" x="86" y="61" text-anchor="middle" font-size="11">(W(t₁)−W(t₀))²</text>
  <text class="t" x="154" y="61" text-anchor="middle" font-size="13">+</text>
  <text class="lamb" x="86" y="96" text-anchor="middle" font-size="11">mean t₁ − t₀</text>
  <text class="lgrn" x="86" y="112" text-anchor="middle" font-size="11">variance 2(t₁ − t₀)²</text>
  <rect x="160" y="40" width="112" height="34" rx="4" fill="#4c8dd6" opacity="0.18"/>
  <text class="lblu" x="216" y="61" text-anchor="middle" font-size="11">(W(t₂)−W(t₁))²</text>
  <text class="t" x="284" y="61" text-anchor="middle" font-size="13">+</text>
  <text class="lamb" x="216" y="96" text-anchor="middle" font-size="11">mean t₂ − t₁</text>
  <text class="lgrn" x="216" y="112" text-anchor="middle" font-size="11">variance 2(t₂ − t₁)²</text>
  <rect x="290" y="40" width="112" height="34" rx="4" fill="#4c8dd6" opacity="0.18"/>
  <text class="lblu" x="346" y="61" text-anchor="middle" font-size="11">(W(t₃)−W(t₂))²</text>
  <text class="t" x="421" y="61" text-anchor="middle" font-size="12">+ ⋯ +</text>
  <text class="lamb" x="346" y="96" text-anchor="middle" font-size="11">mean t₃ − t₂</text>
  <text class="lgrn" x="346" y="112" text-anchor="middle" font-size="11">variance 2(t₃ − t₂)²</text>
  <rect x="440" y="40" width="112" height="34" rx="4" fill="#4c8dd6" opacity="0.18"/>
  <text class="lblu" x="496" y="61" text-anchor="middle" font-size="11">(W(tₙ)−W(tₙ₋₁))²</text>
  <text class="lamb" x="496" y="96" text-anchor="middle" font-size="11">mean tₙ − tₙ₋₁</text>
  <text class="lgrn" x="496" y="112" text-anchor="middle" font-size="11">variance 2(tₙ − tₙ₋₁)²</text>
  <text class="t" x="560" y="61" font-size="14">= Q_Π</text>
  <text class="muted" x="560" y="96" font-size="10">independent:</text>
  <text class="muted" x="560" y="108" font-size="10">means add,</text>
  <text class="muted" x="560" y="120" font-size="10">variances add</text>
  <line class="ax" x1="16" y1="132" x2="624" y2="132"/>
  <text class="lamb" x="16" y="154" font-size="13">E[Q_Π]</text>
  <text class="t" x="80" y="154">= (t₁ − t₀) + (t₂ − t₁) + ⋯ + (tₙ − tₙ₋₁) = tₙ − t₀ = T,  for every partition, exactly</text>
  <text class="lgrn" x="16" y="186" font-size="13">Var(Q_Π)</text>
  <text class="t" x="90" y="186">= 2 Σ (tⱼ₊₁ − tⱼ)²  ≤  2 ‖Π‖ Σ (tⱼ₊₁ − tⱼ)  =  2 ‖Π‖ T  → 0</text>
  <text class="muted" x="90" y="204">each square (tⱼ₊₁ − tⱼ)² is at most the longest cell ‖Π‖ times the cell itself</text>
  <line class="ax" x1="16" y1="222" x2="624" y2="222"/>
  <text class="t" x="16" y="244">Mean pinned at T, variance shrinking with the mesh: Q_Π → T in mean square, whatever the path.</text>
  <text class="muted" x="16" y="262">The one input not derived on this page: Var[(ΔW)²] = E[(ΔW)⁴] − (Δt)² = 3(Δt)² − (Δt)² = 2(Δt)²,</text>
  <text class="muted" x="16" y="276">the fourth moment of a normal variable (the fourth-moment exercise).</text>
</svg>

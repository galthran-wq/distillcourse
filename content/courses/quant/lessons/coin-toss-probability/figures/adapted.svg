<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .t { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11.5px; }
    .s { fill: #e2903a; font-weight: 600; }
    .b { fill: #4c8dd6; font-weight: 600; }
    .block { fill: #e2903a; opacity: 0.14; stroke: #e2903a; stroke-width: 1.2; }
    .cell { fill: none; stroke: currentColor; opacity: 0.25; }
    .bad { fill: none; stroke: #4c8dd6; stroke-width: 1.2; stroke-dasharray: 4 3; }
  </style>
  <text class="muted" x="40" y="20">ω</text>
  <text class="muted" x="180" y="20">blocks of 𝓕₁</text>
  <text class="muted" x="300" y="20">Δ₁: constant on each block</text>
  <text class="muted" x="480" y="20">Δ₁′: differs inside a block</text>

  <rect class="block" x="34" y="26" width="122" height="140" rx="6"/>
  <rect class="block" x="34" y="162" width="122" height="140" rx="6"/>
  <rect class="cell" x="40" y="30" width="110" height="30" rx="4"/>
  <rect class="cell" x="40" y="64" width="110" height="30" rx="4"/>
  <rect class="cell" x="40" y="98" width="110" height="30" rx="4"/>
  <rect class="cell" x="40" y="132" width="110" height="30" rx="4"/>
  <rect class="cell" x="40" y="166" width="110" height="30" rx="4"/>
  <rect class="cell" x="40" y="200" width="110" height="30" rx="4"/>
  <rect class="cell" x="40" y="234" width="110" height="30" rx="4"/>
  <rect class="cell" x="40" y="268" width="110" height="30" rx="4"/>
  <text class="t" x="95" y="50" text-anchor="middle">HHH</text>
  <text class="t" x="95" y="84" text-anchor="middle">HHT</text>
  <text class="t" x="95" y="118" text-anchor="middle">HTH</text>
  <text class="t" x="95" y="152" text-anchor="middle">HTT</text>
  <text class="t" x="95" y="186" text-anchor="middle">THH</text>
  <text class="t" x="95" y="220" text-anchor="middle">THT</text>
  <text class="t" x="95" y="254" text-anchor="middle">TTH</text>
  <text class="t" x="95" y="288" text-anchor="middle">TTT</text>
  <text class="s" x="180" y="100">[H]</text>
  <text class="s" x="180" y="236">[T]</text>

  <!-- legal: one value per block -->
  <text class="s" x="360" y="50" text-anchor="middle">0.9</text>
  <text class="s" x="360" y="84" text-anchor="middle">0.9</text>
  <text class="s" x="360" y="118" text-anchor="middle">0.9</text>
  <text class="s" x="360" y="152" text-anchor="middle">0.9</text>
  <text class="s" x="360" y="186" text-anchor="middle">0.4</text>
  <text class="s" x="360" y="220" text-anchor="middle">0.4</text>
  <text class="s" x="360" y="254" text-anchor="middle">0.4</text>
  <text class="s" x="360" y="288" text-anchor="middle">0.4</text>

  <!-- illegal: reads toss 2 -->
  <rect class="bad" x="500" y="30" width="60" height="132" rx="5"/>
  <text class="b" x="530" y="50" text-anchor="middle">1</text>
  <text class="b" x="530" y="84" text-anchor="middle">1</text>
  <text class="b" x="530" y="118" text-anchor="middle">0</text>
  <text class="b" x="530" y="152" text-anchor="middle">0</text>
  <text class="b" x="530" y="186" text-anchor="middle">1</text>
  <text class="b" x="530" y="220" text-anchor="middle">1</text>
  <text class="b" x="530" y="254" text-anchor="middle">0</text>
  <text class="b" x="530" y="288" text-anchor="middle">0</text>
  <text class="muted" x="570" y="90">two values</text>
  <text class="muted" x="570" y="106">inside [H]:</text>
  <text class="muted" x="570" y="122">it reads ω₂</text>

  <text class="t" x="40" y="322">Δ₁ is a function of ω₁ alone (adapted); Δ₁′ holds a share exactly when the next toss is heads, which no one knows at time 1.</text>
</svg>

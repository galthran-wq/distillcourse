<svg viewBox="0 0 640 306" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .t { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11.5px; }
    .lab { fill: currentColor; font-size: 11.5px; }
    .w { fill: #4c8dd6; font-size: 12px; }
    .s { fill: #e2903a; font-weight: 600; }
    .a { fill: #e2903a; opacity: 0.35; stroke: currentColor; stroke-opacity: 0.35; }
    .other { fill: currentColor; opacity: 0.10; stroke: currentColor; stroke-opacity: 0.35; }
    .div { stroke: currentColor; opacity: 0.25; }
    .arrow { stroke: currentColor; stroke-width: 1.2; fill: none; opacity: 0.7; }
  </style>

  <!-- top bar: the eight probabilities on Ω, total width = 1 -->
  <text class="muted" x="40" y="20">P(ω) on all of Ω, total length 1: the block A = [H] carries 18⁄27 = 2⁄3 of the mass</text>
  <rect class="a" x="40" y="30" width="165.9" height="26" rx="3"/>
  <rect class="a" x="205.9" y="30" width="83" height="26" rx="3"/>
  <rect class="a" x="288.9" y="30" width="83" height="26" rx="3"/>
  <rect class="a" x="371.9" y="30" width="41.5" height="26" rx="3"/>
  <rect class="other" x="413.4" y="30" width="186.6" height="26" rx="3"/>
  <line class="div" x1="496.4" y1="30" x2="496.4" y2="56"/>
  <line class="div" x1="537.9" y1="30" x2="537.9" y2="56"/>
  <line class="div" x1="579.4" y1="30" x2="579.4" y2="56"/>
  <text class="lab" x="123" y="48" text-anchor="middle">HHH</text>
  <text class="lab" x="247.4" y="48" text-anchor="middle">HHT</text>
  <text class="lab" x="330.4" y="48" text-anchor="middle">HTH</text>
  <text class="lab" x="392.7" y="48" text-anchor="middle">HTT</text>
  <text class="muted" x="506.7" y="48" text-anchor="middle">the block [T]</text>
  <text class="w" x="123" y="72" text-anchor="middle">8⁄27</text>
  <text class="w" x="247.4" y="72" text-anchor="middle">4⁄27</text>
  <text class="w" x="330.4" y="72" text-anchor="middle">4⁄27</text>
  <text class="w" x="392.7" y="72" text-anchor="middle">2⁄27</text>
  <text class="muted" x="506.7" y="72" text-anchor="middle">9⁄27, excluded at node H</text>

  <!-- the renormalisation step -->
  <line class="arrow" x1="120" y1="84" x2="120" y2="128"/>
  <polyline class="arrow" points="114,122 120,129 126,122"/>
  <text class="t" x="136" y="102">keep the four sequences of A; divide each weight by P(A) = 2⁄3</text>
  <text class="t" x="136" y="120">every weight is stretched by 3⁄2, and the four now sum to 1</text>

  <!-- bottom bar: conditional probabilities on A, total width = 1 -->
  <text class="muted" x="40" y="152">P(ω | A) = P(ω) ⁄ P(A), total length 1</text>
  <rect class="a" x="40" y="160" width="248.9" height="26" rx="3"/>
  <rect class="a" x="288.9" y="160" width="124.4" height="26" rx="3"/>
  <rect class="a" x="413.3" y="160" width="124.4" height="26" rx="3"/>
  <rect class="a" x="537.7" y="160" width="62.3" height="26" rx="3"/>
  <text class="lab" x="164.5" y="178" text-anchor="middle">HHH</text>
  <text class="lab" x="351.1" y="178" text-anchor="middle">HHT</text>
  <text class="lab" x="475.5" y="178" text-anchor="middle">HTH</text>
  <text class="lab" x="568.9" y="178" text-anchor="middle">HTT</text>
  <text class="w" x="164.5" y="202" text-anchor="middle">4⁄9</text>
  <text class="w" x="351.1" y="202" text-anchor="middle">2⁄9</text>
  <text class="w" x="475.5" y="202" text-anchor="middle">2⁄9</text>
  <text class="w" x="568.9" y="202" text-anchor="middle">1⁄9</text>
  <text class="s" x="164.5" y="220" text-anchor="middle">S₃ = 32</text>
  <text class="s" x="351.1" y="220" text-anchor="middle">S₃ = 8</text>
  <text class="s" x="475.5" y="220" text-anchor="middle">S₃ = 8</text>
  <text class="s" x="568.9" y="220" text-anchor="middle">S₃ = 2</text>

  <!-- the two computations agree -->
  <text class="t" x="40" y="258">E₁[S₃](H) = (1⁄P(A)) · Σ<tspan class="muted" font-size="10" dy="3">ω∈A</tspan><tspan dy="-3"> S₃(ω) P(ω) = 3⁄2 × (8⁄27·32 + 4⁄27·8 + 4⁄27·8 + 2⁄27·2)</tspan></text>
  <text class="t" x="40" y="284">= 3⁄2 × 12 = <tspan class="s">18</tspan>, the subtree average with the lower bar's weights 4⁄9, 2⁄9, 2⁄9, 1⁄9</text>
</svg>

<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .t { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11.5px; }
    .s { fill: #e2903a; font-weight: 600; }
    .w { fill: #4c8dd6; font-size: 12px; }
    .edge { stroke: #e2903a; stroke-width: 1.5; fill: none; opacity: 0.85; }
    .node { fill: #e2903a; }
    .sep { stroke: currentColor; opacity: 0.25; }
  </style>
  <line class="sep" x1="320" y1="20" x2="320" y2="255"/>

  <!-- left panel: node H -->
  <text class="muted" x="20" y="22">at the node H (first toss known)</text>
  <line class="edge" x1="40" y1="150" x2="130" y2="90"/>
  <line class="edge" x1="40" y1="150" x2="130" y2="210"/>
  <line class="edge" x1="130" y1="90" x2="220" y2="60"/>
  <line class="edge" x1="130" y1="90" x2="220" y2="120"/>
  <line class="edge" x1="130" y1="210" x2="220" y2="180"/>
  <line class="edge" x1="130" y1="210" x2="220" y2="240"/>
  <circle class="node" cx="40" cy="150" r="4"/>
  <circle class="node" cx="130" cy="90" r="4"/>
  <circle class="node" cx="130" cy="210" r="4"/>
  <text class="s" x="36" y="140" text-anchor="end">S₁ = 8</text>
  <text class="s" x="130" y="80" text-anchor="middle">16</text>
  <text class="s" x="130" y="228" text-anchor="middle">4</text>
  <text class="s" x="228" y="64">32</text>
  <text class="s" x="228" y="124">8</text>
  <text class="s" x="228" y="184">8</text>
  <text class="s" x="228" y="244">2</text>
  <text class="w" x="262" y="64">× 4⁄9</text>
  <text class="w" x="262" y="124">× 2⁄9</text>
  <text class="w" x="262" y="184">× 2⁄9</text>
  <text class="w" x="262" y="244">× 1⁄9</text>
  <text class="muted" x="84" y="112" text-anchor="middle">HH</text>
  <text class="muted" x="84" y="196" text-anchor="middle">HT</text>
  <text class="t" x="20" y="280">E₁[S₃](H) = 128⁄9 + 16⁄9 + 16⁄9 + 2⁄9 = 18</text>

  <!-- right panel: node T -->
  <text class="muted" x="340" y="22">at the node T</text>
  <line class="edge" x1="360" y1="150" x2="450" y2="90"/>
  <line class="edge" x1="360" y1="150" x2="450" y2="210"/>
  <line class="edge" x1="450" y1="90" x2="540" y2="60"/>
  <line class="edge" x1="450" y1="90" x2="540" y2="120"/>
  <line class="edge" x1="450" y1="210" x2="540" y2="180"/>
  <line class="edge" x1="450" y1="210" x2="540" y2="240"/>
  <circle class="node" cx="360" cy="150" r="4"/>
  <circle class="node" cx="450" cy="90" r="4"/>
  <circle class="node" cx="450" cy="210" r="4"/>
  <text class="s" x="356" y="140" text-anchor="end">S₁ = 2</text>
  <text class="s" x="450" y="80" text-anchor="middle">4</text>
  <text class="s" x="450" y="228" text-anchor="middle">1</text>
  <text class="s" x="548" y="64">8</text>
  <text class="s" x="548" y="124">2</text>
  <text class="s" x="548" y="184">2</text>
  <text class="s" x="548" y="244">0.5</text>
  <text class="w" x="582" y="64">× 4⁄9</text>
  <text class="w" x="582" y="124">× 2⁄9</text>
  <text class="w" x="582" y="184">× 2⁄9</text>
  <text class="w" x="582" y="244">× 1⁄9</text>
  <text class="muted" x="404" y="112" text-anchor="middle">TH</text>
  <text class="muted" x="404" y="196" text-anchor="middle">TT</text>
  <text class="t" x="340" y="280">E₁[S₃](T) = 32⁄9 + 4⁄9 + 4⁄9 + 0.5⁄9 = 4.5</text>
</svg>

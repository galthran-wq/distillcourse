<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .t { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11.5px; }
    .s { fill: #e2903a; font-weight: 600; }
    .block { fill: #e2903a; opacity: 0.14; stroke: #e2903a; stroke-width: 1.2; }
    .cell { fill: none; stroke: currentColor; opacity: 0.25; }
    .panel { fill: none; stroke: currentColor; opacity: 0.3; stroke-dasharray: 3 3; }
  </style>
  <text class="muted" x="40" y="20">the 8 sequences of Ω</text>
  <text class="muted" x="180" y="20">blocks of 𝓕₃</text>
  <rect class="cell" x="40" y="30" width="110" height="30" rx="4"/>
  <rect class="cell" x="40" y="64" width="110" height="30" rx="4"/>
  <rect class="cell" x="40" y="98" width="110" height="30" rx="4"/>
  <rect class="cell" x="40" y="132" width="110" height="30" rx="4"/>
  <rect class="cell" x="40" y="166" width="110" height="30" rx="4"/>
  <rect class="cell" x="40" y="200" width="110" height="30" rx="4"/>
  <rect class="cell" x="40" y="234" width="110" height="30" rx="4"/>
  <rect class="cell" x="40" y="268" width="110" height="30" rx="4"/>
  <text class="t" x="95" y="50" text-anchor="middle">HHH</text>
  <text class="t" x="95" y="84" text-anchor="middle">HHT</text>
  <text class="t" x="95" y="118" text-anchor="middle">HTH</text>
  <text class="t" x="95" y="152" text-anchor="middle">HTT</text>
  <text class="t" x="95" y="186" text-anchor="middle">THH</text>
  <text class="t" x="95" y="220" text-anchor="middle">THT</text>
  <text class="t" x="95" y="254" text-anchor="middle">TTH</text>
  <text class="t" x="95" y="288" text-anchor="middle">TTT</text>
  <rect class="block" x="34" y="26" width="122" height="38" rx="6"/>
  <rect class="block" x="34" y="60" width="122" height="38" rx="6"/>
  <rect class="block" x="34" y="94" width="122" height="38" rx="6"/>
  <rect class="block" x="34" y="128" width="122" height="38" rx="6"/>
  <rect class="block" x="34" y="162" width="122" height="38" rx="6"/>
  <rect class="block" x="34" y="196" width="122" height="38" rx="6"/>
  <rect class="block" x="34" y="230" width="122" height="38" rx="6"/>
  <rect class="block" x="34" y="264" width="122" height="38" rx="6"/>
  <text class="s" x="180" y="50">S₃ = 32</text>
  <text class="s" x="180" y="84">S₃ = 8</text>
  <text class="s" x="180" y="118">S₃ = 8</text>
  <text class="s" x="180" y="152">S₃ = 2</text>
  <text class="s" x="180" y="186">S₃ = 8</text>
  <text class="s" x="180" y="220">S₃ = 2</text>
  <text class="s" x="180" y="254">S₃ = 2</text>
  <text class="s" x="180" y="288">S₃ = 0.5</text>
  <rect class="panel" x="330" y="30" width="290" height="268" rx="6"/>
  <text class="t" x="345" y="56">time 3: all tosses revealed</text>
  <text class="t" x="345" y="84">𝓕₃ has 2³ = 8 blocks: the sequences</text>
  <text class="muted" x="345" y="118">known now (constant on each block):</text>
  <text class="t" x="345" y="138">everything: S₀…S₃, Δ₀…Δ₂, V₃</text>
  <text class="muted" x="345" y="172">still random:</text>
  <text class="t" x="345" y="192">nothing</text>
  <text class="muted" x="345" y="226">a hedger fixes:</text>
  <text class="t" x="345" y="246">nothing; the claim settles</text>

<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .t { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11.5px; }
    .ax { stroke: currentColor; opacity: 0.5; }
    .phi { stroke: #e2903a; stroke-width: 2.2; fill: none; }
    .chord { stroke: #4c8dd6; stroke-width: 1.8; fill: none; }
    .pt { fill: #4c8dd6; }
    .pa { fill: #e2903a; }
    .gap { stroke: currentColor; stroke-dasharray: 3 3; opacity: 0.6; }
    .s { fill: #e2903a; font-weight: 600; }
    .b { fill: #4c8dd6; font-weight: 600; }
  </style>
  <!-- left panel: node HT, x in [0,10] -> px 40..300, y in [0,5] -> px 270..70 -->
  <text class="muted" x="40" y="22">node HT: branches 2 and 8 straddle the kink at 5</text>
  <line class="ax" x1="40" y1="270" x2="305" y2="270"/>
  <line class="ax" x1="40" y1="270" x2="40" y2="60"/>
  <polyline class="phi" points="40,270 170,270 300,70"/>
  <text class="s" x="290" y="60" text-anchor="end">φ(x) = (x − 5)⁺</text>
  <line class="chord" x1="92" y1="270" x2="248" y2="150"/>
  <circle class="pa" cx="92" cy="270" r="4"/>
  <circle class="pa" cx="248" cy="150" r="4"/>
  <text class="muted" x="92" y="288" text-anchor="middle">2</text>
  <text class="muted" x="248" y="288" text-anchor="middle">8</text>
  <text class="muted" x="170" y="288" text-anchor="middle">5</text>
  <line class="gap" x1="196" y1="270" x2="196" y2="190"/>
  <circle class="pt" cx="196" cy="190" r="4"/>
  <circle class="pa" cx="196" cy="230" r="4"/>
  <text class="muted" x="196" y="303" text-anchor="middle">E₂[S₃] = 6</text>
  <text class="b" x="206" y="186">chord: E₂[φ(S₃)] = 2</text>
  <text class="s" x="206" y="240">curve: φ(6) = 1</text>

  <!-- right panel: node HH, x in [4,34] -> px 340..610 (9/unit), y in [0,28] -> px 270..40 (8.2/unit) -->
  <text class="muted" x="340" y="22">node HH: branches 8 and 32, both past the kink</text>
  <line class="ax" x1="340" y1="270" x2="615" y2="270"/>
  <line class="ax" x1="340" y1="270" x2="340" y2="60"/>
  <polyline class="phi" points="340,270 349,270 610,32"/>
  <line class="chord" x1="376" y1="245.4" x2="592" y2="48.6"/>
  <circle class="pa" cx="376" cy="245.4" r="4"/>
  <circle class="pa" cx="592" cy="48.6" r="4"/>
  <text class="muted" x="376" y="288" text-anchor="middle">8</text>
  <text class="muted" x="592" y="288" text-anchor="middle">32</text>
  <line class="gap" x1="520" y1="270" x2="520" y2="114"/>
  <circle class="pt" cx="520" cy="114" r="4"/>
  <text class="muted" x="520" y="303" text-anchor="middle">E₂[S₃] = 24</text>
  <text class="b" x="405" y="140">chord and curve agree: 19 = 19</text>
</svg>

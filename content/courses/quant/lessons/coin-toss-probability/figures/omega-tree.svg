<svg viewBox="0 0 640 350" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .t { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11.5px; }
    .s { fill: #e2903a; font-weight: 600; }
    .b { fill: #4c8dd6; }
    .edge { stroke: #e2903a; stroke-width: 1.5; fill: none; opacity: 0.85; }
    .node { fill: #e2903a; }
    .guide { stroke: currentColor; opacity: 0.3; stroke-dasharray: 3 3; }
  </style>
  <text class="muted" x="60" y="18" text-anchor="middle">toss 1</text>
  <text class="muted" x="190" y="18" text-anchor="middle">toss 2</text>
  <text class="muted" x="320" y="18" text-anchor="middle">toss 3</text>
  <text class="muted" x="450" y="18" text-anchor="start">ω</text>
  <text class="muted" x="530" y="18" text-anchor="start">P(ω) = p^#H q^#T</text>

  <!-- root 173; time1: 97, 249; time2: 59,135,211,287; leaves 40..306 step 38 -->
  <line class="edge" x1="60" y1="173" x2="190" y2="97"/>
  <line class="edge" x1="60" y1="173" x2="190" y2="249"/>
  <line class="edge" x1="190" y1="97" x2="320" y2="59"/>
  <line class="edge" x1="190" y1="97" x2="320" y2="135"/>
  <line class="edge" x1="190" y1="249" x2="320" y2="211"/>
  <line class="edge" x1="190" y1="249" x2="320" y2="287"/>
  <line class="edge" x1="320" y1="59" x2="440" y2="40"/>
  <line class="edge" x1="320" y1="59" x2="440" y2="78"/>
  <line class="edge" x1="320" y1="135" x2="440" y2="116"/>
  <line class="edge" x1="320" y1="135" x2="440" y2="154"/>
  <line class="edge" x1="320" y1="211" x2="440" y2="192"/>
  <line class="edge" x1="320" y1="211" x2="440" y2="230"/>
  <line class="edge" x1="320" y1="287" x2="440" y2="268"/>
  <line class="edge" x1="320" y1="287" x2="440" y2="306"/>

  <circle class="node" cx="60" cy="173" r="4"/>
  <circle class="node" cx="190" cy="97" r="4"/>
  <circle class="node" cx="190" cy="249" r="4"/>
  <circle class="node" cx="320" cy="59" r="4"/>
  <circle class="node" cx="320" cy="135" r="4"/>
  <circle class="node" cx="320" cy="211" r="4"/>
  <circle class="node" cx="320" cy="287" r="4"/>

  <text class="muted" x="118" y="128" text-anchor="middle">H, prob. p</text>
  <text class="muted" x="118" y="222" text-anchor="middle">T, prob. q</text>

  <text class="t" x="450" y="44">HHH</text>
  <text class="t" x="450" y="82">HHT</text>
  <text class="t" x="450" y="120">HTH</text>
  <text class="t" x="450" y="158">HTT</text>
  <text class="t" x="450" y="196">THH</text>
  <text class="t" x="450" y="234">THT</text>
  <text class="t" x="450" y="272">TTH</text>
  <text class="t" x="450" y="310">TTT</text>

  <text class="s" x="530" y="44">p³</text>
  <text class="s" x="530" y="82">p²q</text>
  <text class="s" x="530" y="120">p²q</text>
  <text class="s" x="530" y="158">pq²</text>
  <text class="s" x="530" y="196">p²q</text>
  <text class="s" x="530" y="234">pq²</text>
  <text class="s" x="530" y="272">pq²</text>
  <text class="s" x="530" y="310">q³</text>

  <text class="b" x="575" y="44">= 8⁄27</text>
  <text class="b" x="575" y="82">= 4⁄27</text>
  <text class="b" x="575" y="120">= 4⁄27</text>
  <text class="b" x="575" y="158">= 2⁄27</text>
  <text class="b" x="575" y="196">= 4⁄27</text>
  <text class="b" x="575" y="234">= 2⁄27</text>
  <text class="b" x="575" y="272">= 2⁄27</text>
  <text class="b" x="575" y="310">= 1⁄27</text>

  <text class="t" x="60" y="340">Ω has 2³ = 8 elements; the eight probabilities sum to (p + q)³ = 1. Blue: the values at p = 2⁄3.</text>
</svg>

<svg viewBox="0 0 640 318" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12.5">
  <style>
    .t { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11.5px; }
    .s { fill: #e2903a; font-weight: 600; }
    .b { fill: #4c8dd6; font-weight: 600; font-size: 11.5px; }
    .box { fill: none; stroke: currentColor; opacity: 0.35; }
    .lbox { fill: none; stroke: #4c8dd6; stroke-width: 1.2; opacity: 0.8; }
    .ar { stroke: currentColor; stroke-width: 1.2; fill: none; opacity: 0.5; }
    .ah { fill: currentColor; opacity: 0.5; }
  </style>
  <defs>
    <marker id="ah" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" class="ah"/>
    </marker>
  </defs>
  <text class="muted" x="108" y="16" text-anchor="middle">proved in this lesson</text>
  <text class="muted" x="330" y="16" text-anchor="middle">what it delivers</text>
  <text class="muted" x="553" y="16" text-anchor="middle">lesson that spends it</text>

  <!-- properties, column 1 -->
  <rect class="box" x="10" y="28" width="196" height="28" rx="5"/>
  <text class="t" x="18" y="46">(i) linearity</text>
  <rect class="box" x="10" y="76" width="196" height="28" rx="5"/>
  <text class="t" x="18" y="94">(ii) taking out what is known</text>
  <rect class="box" x="10" y="124" width="196" height="28" rx="5"/>
  <text class="t" x="18" y="142">(iii) iterated conditioning</text>
  <rect class="box" x="10" y="172" width="196" height="28" rx="5"/>
  <text class="t" x="18" y="190">(iv) independence</text>
  <rect class="box" x="10" y="220" width="196" height="28" rx="5"/>
  <text class="t" x="18" y="238">(v) conditional Jensen</text>
  <rect class="box" x="10" y="268" width="196" height="40" rx="5"/>
  <text class="t" x="18" y="285">adaptedness</text>
  <text class="muted" x="18" y="300">the hypothesis of (ii)</text>

  <!-- arrows column 1 to column 2 -->
  <line class="ar" x1="208" y1="42" x2="224" y2="60" marker-end="url(#ah)"/>
  <line class="ar" x1="208" y1="90" x2="224" y2="72" marker-end="url(#ah)"/>
  <line class="ar" x1="208" y1="138" x2="224" y2="138" marker-end="url(#ah)"/>
  <line class="ar" x1="208" y1="186" x2="224" y2="186" marker-end="url(#ah)"/>
  <line class="ar" x1="208" y1="234" x2="224" y2="234" marker-end="url(#ah)"/>
  <line class="ar" x1="208" y1="288" x2="224" y2="288" marker-end="url(#ah)"/>

  <!-- results, column 2 -->
  <rect class="box" x="228" y="44" width="204" height="44" rx="5"/>
  <text class="s" x="236" y="62">Ẽₙ[Xₙ₊₁] = (1 + r) Xₙ</text>
  <text class="muted" x="236" y="79">discounted wealth is a martingale</text>
  <rect class="box" x="228" y="116" width="204" height="44" rx="5"/>
  <text class="s" x="236" y="134">Vₙ = Ẽₙ[payoff] ⁄ (1 + r)ᴺ⁻ⁿ</text>
  <text class="muted" x="236" y="151">the pricing formula</text>
  <rect class="box" x="228" y="164" width="204" height="44" rx="5"/>
  <text class="s" x="236" y="182">Ẽₙ[Sₙ₊₁] = (1 + r) Sₙ</text>
  <text class="muted" x="236" y="199">discounted stock is a martingale</text>
  <rect class="box" x="228" y="212" width="204" height="44" rx="5"/>
  <text class="s" x="236" y="230">continuation ≥ exercise</text>
  <text class="muted" x="236" y="247">a call is never exercised early</text>
  <rect class="box" x="228" y="266" width="204" height="44" rx="5"/>
  <text class="s" x="236" y="284">a rule reads only the past</text>
  <text class="muted" x="236" y="301">an exercise rule; an integrand</text>

  <!-- arrows column 2 to column 3 -->
  <line class="ar" x1="436" y1="66" x2="468" y2="100" marker-end="url(#ah)"/>
  <line class="ar" x1="436" y1="138" x2="468" y2="126" marker-end="url(#ah)"/>
  <line class="ar" x1="436" y1="186" x2="468" y2="150" marker-end="url(#ah)"/>
  <line class="ar" x1="436" y1="234" x2="468" y2="234" marker-end="url(#ah)"/>
  <line class="ar" x1="436" y1="280" x2="468" y2="274" marker-end="url(#ah)"/>
  <line class="ar" x1="436" y1="296" x2="468" y2="302" marker-end="url(#ah)"/>

  <!-- lessons, column 3 -->
  <rect class="lbox" x="472" y="44" width="162" height="164" rx="5"/>
  <text class="b" x="553" y="118" text-anchor="middle">Martingales and</text>
  <text class="b" x="553" y="134" text-anchor="middle">risk-neutral pricing</text>
  <text class="muted" x="553" y="152" text-anchor="middle">(next lesson)</text>
  <rect class="lbox" x="472" y="216" width="162" height="36" rx="5"/>
  <text class="b" x="553" y="232" text-anchor="middle">American options</text>
  <text class="b" x="553" y="246" text-anchor="middle">and the Snell envelope</text>
  <rect class="lbox" x="472" y="260" width="162" height="24" rx="5"/>
  <text class="b" x="553" y="276" text-anchor="middle">Stopping times</text>
  <rect class="lbox" x="472" y="290" width="162" height="24" rx="5"/>
  <text class="b" x="553" y="306" text-anchor="middle">The Itô integral</text>
</svg>

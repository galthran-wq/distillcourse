<svg viewBox="0 0 640 262" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .t { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11.5px; }
    .s { fill: #e2903a; font-weight: 600; }
    .w { fill: #4c8dd6; }
    .block { fill: #e2903a; opacity: 0.16; }
    .rule { stroke: currentColor; opacity: 0.3; }
  </style>
  <text class="muted" x="40" y="22">ω (block H)</text>
  <text class="muted" x="150" y="22">weight</text>
  <text class="muted" x="250" y="22">S₁</text>
  <text class="muted" x="330" y="22">S₂</text>
  <text class="muted" x="420" y="22">S₁ · S₂</text>
  <line class="rule" x1="40" y1="30" x2="600" y2="30"/>

  <rect class="block" x="232" y="36" width="60" height="150" rx="5"/>

  <text class="t" x="40" y="60">HHH</text>
  <text class="t" x="40" y="96">HHT</text>
  <text class="t" x="40" y="132">HTH</text>
  <text class="t" x="40" y="168">HTT</text>

  <text class="w" x="150" y="60">4⁄9</text>
  <text class="w" x="150" y="96">2⁄9</text>
  <text class="w" x="150" y="132">2⁄9</text>
  <text class="w" x="150" y="168">1⁄9</text>

  <text class="s" x="262" y="60" text-anchor="middle">8</text>
  <text class="s" x="262" y="96" text-anchor="middle">8</text>
  <text class="s" x="262" y="132" text-anchor="middle">8</text>
  <text class="s" x="262" y="168" text-anchor="middle">8</text>

  <text class="t" x="330" y="60">16</text>
  <text class="t" x="330" y="96">16</text>
  <text class="t" x="330" y="132">4</text>
  <text class="t" x="330" y="168">4</text>

  <text class="t" x="420" y="60">128</text>
  <text class="t" x="420" y="96">128</text>
  <text class="t" x="420" y="132">32</text>
  <text class="t" x="420" y="168">32</text>

  <text class="muted" x="500" y="60">S₁ is the same</text>
  <text class="muted" x="500" y="76">on every row of</text>
  <text class="muted" x="500" y="92">the block, so it</text>
  <text class="muted" x="500" y="108">factors out of</text>
  <text class="muted" x="500" y="124">the weighted sum</text>

  <line class="rule" x1="40" y1="190" x2="600" y2="190"/>
  <text class="t" x="40" y="218">E₁[S₁S₂](H) = 4⁄9·128 + 2⁄9·128 + 2⁄9·32 + 1⁄9·32 = 96</text>
  <text class="t" x="40" y="246">= <tspan class="s">8</tspan> × (4⁄9·16 + 2⁄9·16 + 2⁄9·4 + 1⁄9·4) = <tspan class="s">8</tspan> × 12 = S₁(H) · E₁[S₂](H)</text>
</svg>

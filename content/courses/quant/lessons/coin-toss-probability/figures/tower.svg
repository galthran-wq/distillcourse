<svg viewBox="0 0 640 350" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .t { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11.5px; }
    .s { fill: #e2903a; font-weight: 600; }
    .box { fill: none; stroke: currentColor; opacity: 0.35; }
    .ar { stroke: #4c8dd6; stroke-width: 1.4; fill: none; opacity: 0.9; }
    .ah { fill: #4c8dd6; }
  </style>
  <defs>
    <marker id="ah" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" class="ah"/>
    </marker>
  </defs>
  <text class="muted" x="70" y="18" text-anchor="middle">S₃ on the 8 sequences</text>
  <text class="muted" x="250" y="18" text-anchor="middle">E₂[S₃]: 4 blocks</text>
  <text class="muted" x="420" y="18" text-anchor="middle">E₁[S₃]: 2 blocks</text>
  <text class="muted" x="570" y="18" text-anchor="middle">E[S₃]</text>

  <!-- leaves y = 40 + 38 i -->
  <text class="muted" x="30" y="44" text-anchor="end">HHH</text>
  <text class="muted" x="30" y="82" text-anchor="end">HHT</text>
  <text class="muted" x="30" y="120" text-anchor="end">HTH</text>
  <text class="muted" x="30" y="158" text-anchor="end">HTT</text>
  <text class="muted" x="30" y="196" text-anchor="end">THH</text>
  <text class="muted" x="30" y="234" text-anchor="end">THT</text>
  <text class="muted" x="30" y="272" text-anchor="end">TTH</text>
  <text class="muted" x="30" y="310" text-anchor="end">TTT</text>
  <text class="s" x="70" y="44" text-anchor="middle">32</text>
  <text class="s" x="70" y="82" text-anchor="middle">8</text>
  <text class="s" x="70" y="120" text-anchor="middle">8</text>
  <text class="s" x="70" y="158" text-anchor="middle">2</text>
  <text class="s" x="70" y="196" text-anchor="middle">8</text>
  <text class="s" x="70" y="234" text-anchor="middle">2</text>
  <text class="s" x="70" y="272" text-anchor="middle">2</text>
  <text class="s" x="70" y="310" text-anchor="middle">0.5</text>

  <!-- level-2 boxes around pairs -->
  <rect class="box" x="48" y="28" width="44" height="60" rx="5"/>
  <rect class="box" x="48" y="104" width="44" height="60" rx="5"/>
  <rect class="box" x="48" y="180" width="44" height="60" rx="5"/>
  <rect class="box" x="48" y="256" width="44" height="60" rx="5"/>

  <!-- arrows to E2 at y 59,135,211,287 -->
  <line class="ar" x1="96" y1="59" x2="222" y2="59" marker-end="url(#ah)"/>
  <line class="ar" x1="96" y1="135" x2="222" y2="135" marker-end="url(#ah)"/>
  <line class="ar" x1="96" y1="211" x2="222" y2="211" marker-end="url(#ah)"/>
  <line class="ar" x1="96" y1="287" x2="222" y2="287" marker-end="url(#ah)"/>
  <text class="muted" x="158" y="52" text-anchor="middle">2⁄3·32 + 1⁄3·8</text>
  <text class="muted" x="158" y="128" text-anchor="middle">2⁄3·8 + 1⁄3·2</text>
  <text class="muted" x="158" y="204" text-anchor="middle">2⁄3·8 + 1⁄3·2</text>
  <text class="muted" x="158" y="280" text-anchor="middle">2⁄3·2 + 1⁄3·0.5</text>
  <text class="s" x="250" y="63" text-anchor="middle">24</text>
  <text class="s" x="250" y="139" text-anchor="middle">6</text>
  <text class="s" x="250" y="215" text-anchor="middle">6</text>
  <text class="s" x="250" y="291" text-anchor="middle">1.5</text>

  <!-- level-1 boxes around E2 pairs -->
  <rect class="box" x="230" y="44" width="40" height="110" rx="5"/>
  <rect class="box" x="230" y="196" width="40" height="110" rx="5"/>
  <line class="ar" x1="274" y1="97" x2="392" y2="97" marker-end="url(#ah)"/>
  <line class="ar" x1="274" y1="249" x2="392" y2="249" marker-end="url(#ah)"/>
  <text class="muted" x="333" y="90" text-anchor="middle">2⁄3·24 + 1⁄3·6</text>
  <text class="muted" x="333" y="242" text-anchor="middle">2⁄3·6 + 1⁄3·1.5</text>
  <text class="s" x="420" y="101" text-anchor="middle">18</text>
  <text class="s" x="420" y="253" text-anchor="middle">4.5</text>

  <!-- root box -->
  <rect class="box" x="400" y="80" width="40" height="190" rx="5"/>
  <line class="ar" x1="444" y1="173" x2="542" y2="173" marker-end="url(#ah)"/>
  <text class="muted" x="493" y="166" text-anchor="middle">2⁄3·18 + 1⁄3·4.5</text>
  <text class="s" x="570" y="177" text-anchor="middle">13.5</text>

  <text class="t" x="20" y="340">Averaging within blocks, then averaging the block averages, is the overall average: E₁[E₂[S₃]] = E₁[S₃], E[E₁[S₃]] = E[S₃].</text>
</svg>

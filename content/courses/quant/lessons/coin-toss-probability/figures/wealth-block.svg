<svg viewBox="0 0 640 258" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .t { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11.5px; }
    .s { fill: #e2903a; font-weight: 600; }
    .w { fill: #4c8dd6; }
    .block { fill: #e2903a; opacity: 0.16; }
    .rule { stroke: currentColor; opacity: 0.3; }
  </style>
  <text class="muted" x="166" y="16">known on [H]: one number each</text>
  <text class="muted" x="372" y="16">still random: one value per branch</text>
  <text class="muted" x="40" y="38">ω₂</text>
  <text class="muted" x="100" y="38">weight</text>
  <text class="muted" x="180" y="38">Δ₁</text>
  <text class="muted" x="240" y="38">S₁</text>
  <text class="muted" x="300" y="38">X₁</text>
  <text class="muted" x="372" y="38">S₂</text>
  <text class="muted" x="440" y="38">X₂ = Δ₁S₂ + 1.25 (X₁ − Δ₁S₁)</text>
  <line class="rule" x1="40" y1="46" x2="600" y2="46"/>

  <rect class="block" x="166" y="50" width="176" height="74" rx="5"/>

  <text class="t" x="40" y="76">H</text>
  <text class="t" x="40" y="112">T</text>
  <text class="w" x="100" y="76">2⁄3</text>
  <text class="w" x="100" y="112">1⁄3</text>
  <text class="s" x="180" y="76">0.9</text>
  <text class="s" x="180" y="112">0.9</text>
  <text class="s" x="240" y="76">8</text>
  <text class="s" x="240" y="112">8</text>
  <text class="s" x="300" y="76">5.28</text>
  <text class="s" x="300" y="112">5.28</text>
  <text class="t" x="372" y="76">16</text>
  <text class="t" x="372" y="112">4</text>
  <text class="t" x="440" y="76">0.9·16 − 2.40 = 12</text>
  <text class="t" x="440" y="112">0.9·4 − 2.40 = 1.20</text>

  <line class="rule" x1="40" y1="132" x2="600" y2="132"/>
  <text class="t" x="40" y="158">E₁[X₂](H) = 2⁄3·12 + 1⁄3·1.20 = 8.40</text>
  <text class="t" x="40" y="184">= <tspan class="s">0.9</tspan> × (2⁄3·16 + 1⁄3·4) + 1.25 × (<tspan class="s">5.28</tspan> − <tspan class="s">0.9</tspan>·<tspan class="s">8</tspan>) = 0.9 × 12 − 2.40 = 8.40</text>
  <text class="t" x="40" y="210">= Δ₁ · E₁[S₂](H) + 1.25 (X₁ − Δ₁S₁): the three known quantities never enter the average</text>
  <text class="muted" x="40" y="238">under p̃ = ½ the same line reads 0.9 × 10 − 2.40 = 6.60 = 1.25 × 5.28 = (1 + r) X₁(H)</text>
</svg>

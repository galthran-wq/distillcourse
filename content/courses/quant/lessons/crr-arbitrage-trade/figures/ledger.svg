<svg viewBox="0 0 640 292" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .t { fill: currentColor; }
    .h { fill: currentColor; font-weight: 600; font-size: 12px; }
    .b { fill: currentColor; font-weight: 600; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11.5px; }
    .s { fill: #e2903a; font-weight: 600; }
    .d { fill: #5aa46a; font-weight: 600; }
    .v { fill: #4c8dd6; font-weight: 600; }
    .shade { fill: #e2903a; opacity: 0.12; }
    .shadeb { fill: #4c8dd6; opacity: 0.10; }
    .rule { stroke: currentColor; opacity: 0.35; }
    .guide { stroke: currentColor; opacity: 0.5; stroke-dasharray: 3 3; fill: none; }
    .edge { stroke: currentColor; opacity: 0.45; fill: none; }
    .box { fill: none; stroke: currentColor; opacity: 0.6; }
    .amb { stroke: #e2903a; fill: none; stroke-width: 2; }
    .blu { stroke: #4c8dd6; fill: none; stroke-width: 2; }
    .grn { stroke: #5aa46a; fill: none; stroke-width: 2; }
  </style>
  <text class="muted" x="20" y="18">the paper's path 80 → 120 → 60, both endings: call sold at 36, hedge funded with 34.065, 1.935 banked</text>
  <rect class="shade" x="542" y="28" width="82" height="196" rx="4"/>
  <text class="h" x="20" y="46">date · toss</text>
  <text class="h" x="100" y="46">stock</text>
  <text class="h" x="148" y="46">Δ held</text>
  <text class="h" x="204" y="46">share trade</text>
  <text class="h" x="382" y="46">loan owed</text>
  <text class="h" x="458" y="46">call, short</text>
  <text class="h" x="552" y="46">bank</text>
  <line class="rule" x1="20" y1="54" x2="624" y2="54"/>
  <text class="t" x="20" y="80">0 · –</text>
  <text class="s" x="100" y="80">80</text>
  <text class="d" x="148" y="80">.719</text>
  <text class="t" x="204" y="80" font-size="12">buy .719 at 80 = 57.52</text>
  <text class="t" x="382" y="80">23.455</text>
  <text class="v" x="458" y="80">34.065</text>
  <text class="s" x="552" y="80">1.935</text>
  <text class="t" x="20" y="112">1 · H</text>
  <text class="s" x="100" y="112">120</text>
  <text class="d" x="148" y="112">.848</text>
  <text class="t" x="204" y="112" font-size="12">buy .129 at 120 = 15.48</text>
  <text class="t" x="382" y="112">41.281</text>
  <text class="v" x="458" y="112">60.463</text>
  <text class="s" x="552" y="112">2.129</text>
  <text class="t" x="20" y="144">2 · T</text>
  <text class="s" x="100" y="144">60</text>
  <text class="d" x="148" y="144">.167</text>
  <text class="t" x="204" y="144" font-size="12">sell .681 at 60 = 40.86</text>
  <text class="t" x="382" y="144">4.549</text>
  <text class="v" x="458" y="144">5.454</text>
  <text class="s" x="552" y="144">2.341</text>
  <text class="t" x="20" y="176">3 · T</text>
  <text class="s" x="100" y="176">30</text>
  <text class="d" x="148" y="176" opacity="0.55">settle</text>
  <text class="t" x="204" y="176" font-size="12">sell .167 at 30 = 5.01</text>
  <text class="t" x="382" y="176">5.004</text>
  <text class="v" x="458" y="176">0</text>
  <text class="s" x="552" y="176">2.575</text>
  <text class="t" x="20" y="208">3 · H</text>
  <text class="s" x="100" y="208">90</text>
  <text class="d" x="148" y="208" opacity="0.55">settle</text>
  <text class="t" x="204" y="208" font-size="12">sell .167 at 90 = 15.03</text>
  <text class="t" x="382" y="208">5.004</text>
  <text class="v" x="458" y="208">10</text>
  <text class="s" x="552" y="208">2.575</text>
  <line class="rule" x1="20" y1="160" x2="624" y2="160"/>
  <line class="rule" x1="20" y1="222" x2="624" y2="222"/>
  <text class="muted" x="20" y="244">at every date, shares − loan − call = 0 to the paper's three-decimal rounding;</text>
  <text class="muted" x="20" y="262">the loan absorbs each share trade and the bank is never touched. Date 3: shares sold, loan repaid,</text>
  <text class="muted" x="20" y="280">call settled in cash (0 or 10); what remains is the bank, 1.935 × 1.1³ = 2.575, on either ending.</text>
</svg>

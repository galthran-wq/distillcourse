<svg viewBox="0 0 640 244" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .t { fill: currentColor; }
    .h { fill: currentColor; font-weight: 600; font-size: 12px; }
    .b { fill: currentColor; font-weight: 600; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11.5px; }
    .s { fill: #e2903a; font-weight: 600; }
    .d { fill: #5aa46a; font-weight: 600; }
    .v { fill: #4c8dd6; font-weight: 600; }
    .shade { fill: #e2903a; opacity: 0.12; }
    .shadeb { fill: #4c8dd6; opacity: 0.10; }
    .rule { stroke: currentColor; opacity: 0.35; }
    .guide { stroke: currentColor; opacity: 0.5; stroke-dasharray: 3 3; fill: none; }
    .edge { stroke: currentColor; opacity: 0.45; fill: none; }
    .box { fill: none; stroke: currentColor; opacity: 0.6; }
    .amb { stroke: #e2903a; fill: none; stroke-width: 2; }
    .blu { stroke: #4c8dd6; fill: none; stroke-width: 2; }
    .grn { stroke: #5aa46a; fill: none; stroke-width: 2; }
  </style>
  <text class="muted" x="20" y="18">date 1, stock at 120: the rebalance from Δ = .719 to Δ = .848</text>
  <rect class="box" x="60" y="60" width="110" height="86" rx="5"/>
  <text class="h" x="115" y="80" text-anchor="middle">shares</text>
  <rect class="box" x="200" y="60" width="110" height="86" rx="5"/>
  <text class="h" x="255" y="80" text-anchor="middle">loan</text>
  <rect class="box" x="340" y="60" width="110" height="86" rx="5"/>
  <text class="h" x="395" y="80" text-anchor="middle">call, short</text>
  <rect class="box" x="480" y="60" width="110" height="86" rx="5"/>
  <text class="h" x="535" y="80" text-anchor="middle">bank</text>
  <text class="s" x="115" y="104" text-anchor="middle" font-size="12">.719 sh × 120</text><text class="s" x="115" y="124" text-anchor="middle">= 86.28</text>
  <text class="t" x="255" y="104" text-anchor="middle" font-size="12">23.455 × 1.1</text><text class="t" x="255" y="124" text-anchor="middle">= 25.801</text>
  <text class="v" x="395" y="104" text-anchor="middle" font-size="12">1 call, value</text><text class="v" x="395" y="124" text-anchor="middle">60.463</text>
  <text class="t" x="535" y="104" text-anchor="middle" font-size="12">1.935 × 1.1</text><text class="t" x="535" y="124" text-anchor="middle">= 2.129</text>
  <rect class="shade" x="30" y="166" width="150" height="26" rx="4"/>
  <text class="s" x="105" y="184" text-anchor="middle" font-size="11">buy .129 sh at 120: 15.48</text>
  <path class="amb" d="M 105 166 L 105 150" marker-end="url(#ah)"/>
  <rect class="shade" x="205" y="166" width="100" height="26" rx="4"/>
  <text class="s" x="255" y="184" text-anchor="middle" font-size="11">borrow 15.48</text>
  <path class="amb" d="M 255 166 L 255 150" marker-end="url(#ah)"/>
  <text class="t" x="20" y="216">cash in − cash out = 15.48 − 15.48 = 0: the trade is a stock-for-debt swap;</text>
  <text class="t" x="20" y="234">no money crosses into or out of the hedge, and the bank is not consulted.</text>
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#e2903a"/></marker></defs>

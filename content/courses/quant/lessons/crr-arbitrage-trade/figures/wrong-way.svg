<svg viewBox="0 0 640 298" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .t { fill: currentColor; }
    .h { fill: currentColor; font-weight: 600; font-size: 12px; }
    .b { fill: currentColor; font-weight: 600; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11.5px; }
    .s { fill: #e2903a; font-weight: 600; }
    .d { fill: #5aa46a; font-weight: 600; }
    .v { fill: #4c8dd6; font-weight: 600; }
    .shade { fill: #e2903a; opacity: 0.12; }
    .shadeb { fill: #4c8dd6; opacity: 0.10; }
    .rule { stroke: currentColor; opacity: 0.35; }
    .guide { stroke: currentColor; opacity: 0.5; stroke-dasharray: 3 3; fill: none; }
    .edge { stroke: currentColor; opacity: 0.45; fill: none; }
    .box { fill: none; stroke: currentColor; opacity: 0.6; }
    .amb { stroke: #e2903a; fill: none; stroke-width: 2; }
    .blu { stroke: #4c8dd6; fill: none; stroke-width: 2; }
    .grn { stroke: #5aa46a; fill: none; stroke-width: 2; }
  </style>
  <text class="muted" x="20" y="18">date 1, stock 120, the call quoted 75 against a value of 60.463: two ways to raise the hedge ratio to .848</text>
  <text class="h" x="20" y="46">adjust through the stock</text>
  <line class="rule" x1="20" y1="52" x2="310" y2="52"/>
  <text class="t" x="20" y="74" font-size="12">hold 1 call short; buy .129 sh at 120 = 15.48</text>
  <text class="t" x="20" y="96" font-size="12">borrow 15.48 → loan 41.281</text>
  <text class="t" x="20" y="118" font-size="12">position: .848 sh, −1 call, loan 41.281</text>
  <text class="muted" x="20" y="140" font-size="12">date 2, stock 60: sell .681 sh, loan 4.549</text>
  <text class="t" x="20" y="162" font-size="12">hedge − call = 10.02 − 4.549 − 5.454 ≈ 0</text>
  <text class="t" x="20" y="184" font-size="12">bank 1.935 × 1.1² = 2.341</text>
  <rect class="shadeb" x="14" y="200" width="300" height="28" rx="4"/>
  <text class="v" x="20" y="219">date 2 net: +2.341</text>
  <text class="h" x="330" y="46">adjust through the call</text>
  <line class="rule" x1="330" y1="52" x2="620" y2="52"/>
  <text class="t" x="330" y="74" font-size="12">hold .719 sh; buy back .152 calls at 75 = 11.40</text>
  <text class="s" x="330" y="96" font-size="12">those calls are worth .152 × 60.463 = 9.19:</text>
  <text class="s" x="330" y="118" font-size="12">overpaid 2.21</text>
  <text class="t" x="330" y="140" font-size="12">borrow 11.40 → loan 37.201</text>
  <text class="t" x="330" y="162" font-size="12">position: .719 sh, −.848 call, loan 37.201</text>
  <text class="muted" x="330" y="184" font-size="12">date 2, stock 60, call 5.454: liquidate</text>
  <text class="t" x="330" y="206" font-size="12">43.14 − 4.625 − 40.921 = −2.406; bank 2.341</text>
  <rect class="shade" x="324" y="222" width="300" height="28" rx="4"/>
  <text class="s" x="330" y="241">date 2 net: −0.065</text>
  <text class="muted" x="20" y="268">the 2.21 overpaid at date 1 grows to 2.43 at date 2 and exceeds the 2.341 in the bank:</text>
  <text class="muted" x="20" y="286">the number of calls to buy back is set by their value, what they cost by their price.</text>
</svg>

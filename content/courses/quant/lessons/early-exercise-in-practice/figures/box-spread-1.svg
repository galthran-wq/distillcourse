<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .t { fill: currentColor; }
    .head { fill: currentColor; font-weight: 600; font-size: 13px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .leg { fill: none; stroke: currentColor; stroke-width: 1.2; opacity: 0.6; }
    .legA { fill: none; stroke: #e2903a; stroke-width: 2.2; }
    .lab { fill: currentColor; font-weight: 600; }
    .s { fill: #e2903a; font-weight: 600; }
    .b { fill: #4c8dd6; font-weight: 600; }
  </style>
  <text class="head" x="16" y="20">Frame 1 of 3: the sold 55/60 box, priced as if European</text>
  <text class="muted" x="16" y="38">S = 50, σ = 30%, r = 8%, two months; prices per Hull's Business Snapshot 12.1</text>

  <rect class="leg" x="16" y="54" width="140" height="120" rx="6"/>
  <text class="lab" x="86" y="76" text-anchor="middle">long $60 call</text>
  <text class="t" x="86" y="100" text-anchor="middle">European 0.26</text>
  <text class="t" x="86" y="118" text-anchor="middle">American 0.26</text>
  <text class="muted" x="86" y="150" text-anchor="middle">no dividend: equal</text>

  <rect class="leg" x="172" y="54" width="140" height="120" rx="6"/>
  <text class="lab" x="242" y="76" text-anchor="middle">short $55 call</text>
  <text class="t" x="242" y="100" text-anchor="middle">European 0.96</text>
  <text class="t" x="242" y="118" text-anchor="middle">American 0.96</text>
  <text class="muted" x="242" y="150" text-anchor="middle">no dividend: equal</text>

  <rect class="leg" x="328" y="54" width="140" height="120" rx="6"/>
  <text class="lab" x="398" y="76" text-anchor="middle">long $55 put</text>
  <text class="t" x="398" y="100" text-anchor="middle">European 5.23</text>
  <text class="t" x="398" y="118" text-anchor="middle">American 5.44</text>
  <text class="muted" x="398" y="150" text-anchor="middle">5.44 &gt; 5.00: held</text>

  <rect class="leg" x="484" y="54" width="140" height="120" rx="6"/>
  <text class="lab" x="554" y="76" text-anchor="middle">short $60 put</text>
  <text class="t" x="554" y="100" text-anchor="middle">European 9.46</text>
  <text class="s" x="554" y="118" text-anchor="middle">American 10.00</text>
  <text class="muted" x="554" y="150" text-anchor="middle">10.00 = 60 − 50: τ* = 0</text>

  <text class="t" x="16" y="216">received today: 5.10.   At expiry, with four European legs: pay 60 − 55 = 5.00 in every state.</text>
  <text class="t" x="16" y="238">European value 0.26 + 5.23 − 0.96 − 9.46 = −4.93 (the seller owes 4.93); 5.10 received, 0.17 ahead.</text>
  <text class="muted" x="16" y="262">American value: 0.26 + 5.44 − 0.96 − 10.00 = −5.26. The seller owes 5.26 and took 5.10.</text>
</svg>

<svg viewBox="0 0 340 240" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .t { fill: currentColor; }
    .head { fill: currentColor; font-weight: 600; font-size: 12.5px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .edge { stroke: currentColor; stroke-width: 1.2; fill: none; opacity: 0.45; }
    .node { fill: currentColor; }
    .s { fill: #e2903a; font-weight: 600; }
    .b { fill: #4c8dd6; font-weight: 600; }
    .barA { fill: #4c8dd6; opacity: 0.85; }
    .barB { fill: #e2903a; opacity: 0.85; }
    .exline { stroke: #4c8dd6; stroke-width: 1.2; stroke-dasharray: 3 3; opacity: 0.8; }
  </style>
  <text class="head" x="12" y="18">Node S₁ = 8 of the $5 call, ex-date next</text>

  <line class="exline" x1="150" y1="34" x2="150" y2="142"/>
  <text class="muted" x="154" y="152">stock halves here</text>
  <line class="edge" x1="60" y1="90" x2="170" y2="50"/>
  <line class="edge" x1="60" y1="90" x2="170" y2="130"/>
  <circle class="node" cx="60" cy="90" r="4"/>
  <circle class="node" cx="170" cy="50" r="4"/>
  <circle class="node" cx="170" cy="130" r="4"/>
  <text class="muted" x="60" y="78" text-anchor="middle">S = 8, cum</text>
  <text class="t" x="180" y="54">S = 16 · ½ = 8, worth 4.4</text>
  <text class="t" x="180" y="134">S = 4 · ½ = 2, worth 0</text>

  <text class="b" x="12" y="170">exercise now: 8 − 5 = 3</text>
  <rect class="barA" x="12" y="176" width="180" height="8" rx="2"/>
  <text class="s" x="12" y="206">continue: 0.8 · ½ (4.4 + 0) = 1.76</text>
  <rect class="barB" x="12" y="212" width="105.6" height="8" rx="2"/>
  <text class="muted" x="126" y="219">smaller by 1.24: exercise</text>
</svg>

<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .t { fill: currentColor; }
    .head { fill: currentColor; font-weight: 600; font-size: 13px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .axis { stroke: currentColor; stroke-width: 1.4; fill: none; opacity: 0.7; }
    .tick { stroke: currentColor; stroke-width: 1.2; opacity: 0.7; }
    .b { fill: #4c8dd6; font-weight: 600; }
    .s { fill: #e2903a; font-weight: 600; }
    .g { fill: #5aa46a; font-weight: 600; }
    .barB { fill: #4c8dd6; opacity: 0.85; }
    .barS { fill: #e2903a; opacity: 0.85; }
    .barG { fill: #5aa46a; opacity: 0.85; }
    .drop { stroke: #e2903a; stroke-width: 1.6; fill: none; }
    .guide { stroke: currentColor; stroke-width: 1; stroke-dasharray: 3 3; opacity: 0.5; }
  </style>
  <defs>
    <marker id="ah2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#e2903a"/>
    </marker>
  </defs>
  <text class="head" x="16" y="20">The dividend race: $100 call at S = 104, $0.50 dividend tomorrow, r = 1%</text>

  <line class="axis" x1="40" y1="70" x2="600" y2="70"/>
  <line class="tick" x1="70" y1="62" x2="70" y2="78"/>
  <line class="tick" x1="250" y1="62" x2="250" y2="78"/>
  <line class="tick" x1="570" y1="62" x2="570" y2="78"/>
  <text class="t" x="70" y="52" text-anchor="middle">today, cum-dividend</text>
  <text class="t" x="250" y="52" text-anchor="middle">ex-date</text>
  <text class="t" x="570" y="52" text-anchor="middle">expiry, 30 days on</text>
  <text class="muted" x="70" y="92" text-anchor="middle">S = 104</text>
  <path class="drop" d="M200,88 L250,88 L250,106" marker-end="url(#ah2)"/>
  <text class="s" x="258" y="100">S drops to 103.50</text>
  <text class="muted" x="570" y="92" text-anchor="middle">K paid, or not</text>

  <text class="b" x="16" y="136">exercise today: 104 − 100 = 4.00</text>
  <rect class="barB" x="16" y="142" width="400" height="10" rx="2"/>

  <text class="t" x="16" y="178">hold through the ex-date: (104 − 0.50) − 100e⁻ʳᵀ + put = 3.58 + put</text>
  <rect class="barB" x="16" y="184" width="358" height="10" rx="2"/>
  <rect class="barG" x="374" y="184" width="30" height="10" rx="2"/>
  <text class="g" x="16" y="208">+ put value, unknown until quoted (30 days to expiry, strike 100)</text>
  <line class="guide" x1="416" y1="152" x2="416" y2="200"/>
  <text class="muted" x="16" y="226">3.58 = 4.00 − 0.50 dividend forgone + 0.08 interest on the strike kept</text>

  <text class="s" x="16" y="254">balance: exercise wins exactly when the put is worth less than 0.50 − 0.08 = 0.42</text>
  <text class="muted" x="16" y="276">Deep in the money the put is worth cents and exercise wins; near the money it is worth dollars and holding wins. The switch is Ŝ.</text>
</svg>

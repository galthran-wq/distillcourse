<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .t { fill: currentColor; }
    .head { fill: currentColor; font-weight: 600; font-size: 13px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .axis { stroke: currentColor; stroke-width: 1; fill: none; opacity: 0.6; }
    .guide { stroke: currentColor; stroke-width: 1; stroke-dasharray: 3 3; opacity: 0.5; fill: none; }
    .lat { fill: none; stroke: #4c8dd6; stroke-width: 2.5; }
    .path { fill: none; stroke: #e2903a; stroke-width: 2.5; }
    .b { fill: #4c8dd6; font-weight: 600; }
    .s { fill: #e2903a; font-weight: 600; }
    .g { fill: #5aa46a; font-weight: 600; }
  </style>
  <text class="head" x="16" y="20">Nodes a backward pass must visit, against the number of steps n</text>

  <!-- axes: x = 60 + 9.2 n, y = 260 - 13.5 log10(nodes) -->
  <line class="axis" x1="60" y1="260" x2="520" y2="260"/>
  <line class="axis" x1="60" y1="260" x2="60" y2="44"/>
  <text class="muted" x="60" y="278" text-anchor="middle">0</text>
  <text class="muted" x="152" y="278" text-anchor="middle">10</text>
  <text class="muted" x="244" y="278" text-anchor="middle">20</text>
  <text class="muted" x="336" y="278" text-anchor="middle">30</text>
  <text class="muted" x="428" y="278" text-anchor="middle">40</text>
  <text class="muted" x="520" y="278" text-anchor="middle">50</text>
  <text class="muted" x="290" y="294" text-anchor="middle">steps n</text>
  <text class="muted" x="54" y="264" text-anchor="end">1</text>
  <text class="muted" x="54" y="210" text-anchor="end">10<tspan dy="-5" font-size="8">4</tspan></text>
  <text class="muted" x="54" y="156" text-anchor="end">10<tspan dy="-5" font-size="8">8</tspan></text>
  <text class="muted" x="54" y="102" text-anchor="end">10<tspan dy="-5" font-size="8">12</tspan></text>
  <text class="muted" x="54" y="48" text-anchor="end">10<tspan dy="-5" font-size="8">16</tspan></text>
  <text class="muted" x="16" y="36">nodes, log scale</text>

  <!-- one second at 10^8 nodes per second -->
  <line class="guide" x1="60" y1="152" x2="520" y2="152"/>
  <text class="muted" x="66" y="147">one second at 10<tspan dy="-5" font-size="8">8</tspan><tspan dy="5"> nodes per second</tspan></text>

  <!-- path tree 2^n: straight on the log axis -->
  <line class="path" x1="60" y1="260" x2="520" y2="56.8"/>
  <circle fill="#e2903a" cx="304.7" cy="152" r="4"/>
  <text class="muted" x="312" y="166">n ≈ 27</text>
  <text class="s" x="236" y="176" text-anchor="end">path tree: 2<tspan dy="-5" font-size="8">n</tspan><tspan dy="5"> nodes</tspan></text>
  <text class="s" x="512" y="50" text-anchor="end">2<tspan dy="-5" font-size="8">50</tspan><tspan dy="5"> ≈ 10</tspan><tspan dy="-5" font-size="8">15</tspan><tspan dy="5">, 130 days</tspan></text>

  <!-- recombining lattice (n+1)(n+2)/2 -->
  <polyline class="lat" points="60,260 106,242.2 152,235.4 244,228.1 336,223.6 428,220.4 520,217.8"/>
  <circle fill="#4c8dd6" cx="520" cy="217.8" r="4"/>
  <text class="b" x="110" y="210">recombining lattice: (n+1)(n+2)/2 nodes</text>
  <text class="b" x="526" y="222">1,326</text>

  <!-- the lattice split by a cash dividend at step 25 -->
  <circle fill="#5aa46a" cx="520" cy="206.8" r="4"/>
  <text class="g" x="510" y="196" text-anchor="end">cash dividend at step 25: 8,801</text>
</svg>

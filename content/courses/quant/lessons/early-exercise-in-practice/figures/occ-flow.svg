<svg viewBox="0 0 640 210" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .t { fill: currentColor; }
    .head { fill: currentColor; font-weight: 600; font-size: 13px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .box { fill: none; stroke: currentColor; stroke-width: 1.2; opacity: 0.6; }
    .boxA { fill: none; stroke: #e2903a; stroke-width: 1.8; }
    .boxB { fill: none; stroke: #4c8dd6; stroke-width: 1.8; }
    .arrow { stroke: currentColor; stroke-width: 1.4; fill: none; opacity: 0.7; }
    .s { fill: #e2903a; font-weight: 600; }
    .b { fill: #4c8dd6; font-weight: 600; }
  </style>
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor" opacity="0.7"/>
    </marker>
  </defs>
  <text class="head" x="16" y="20">An exercise travels one way; an assignment is drawn at the far end</text>

  <rect class="boxA" x="16" y="52" width="100" height="46" rx="5"/>
  <text class="s" x="66" y="71" text-anchor="middle">holder</text>
  <text class="muted" x="66" y="87" text-anchor="middle">chooses τ</text>

  <rect class="box" x="146" y="52" width="100" height="46" rx="5"/>
  <text class="t" x="196" y="71" text-anchor="middle">broker</text>
  <text class="muted" x="196" y="87" text-anchor="middle">exercise notice</text>

  <rect class="box" x="276" y="52" width="100" height="46" rx="5"/>
  <text class="t" x="326" y="71" text-anchor="middle">OCC</text>
  <text class="muted" x="326" y="87" text-anchor="middle">random draw</text>

  <rect class="box" x="406" y="52" width="100" height="46" rx="5"/>
  <text class="t" x="456" y="71" text-anchor="middle">clearing member</text>
  <text class="muted" x="456" y="87" text-anchor="middle">its own procedure</text>

  <rect class="boxB" x="536" y="52" width="90" height="46" rx="5"/>
  <text class="b" x="581" y="71" text-anchor="middle">writer</text>
  <text class="muted" x="581" y="87" text-anchor="middle">assigned</text>

  <line class="arrow" x1="116" y1="75" x2="144" y2="75" marker-end="url(#ah)"/>
  <line class="arrow" x1="246" y1="75" x2="274" y2="75" marker-end="url(#ah)"/>
  <line class="arrow" x1="376" y1="75" x2="404" y2="75" marker-end="url(#ah)"/>
  <line class="arrow" x1="506" y1="75" x2="534" y2="75" marker-end="url(#ah)"/>

  <text class="t" x="16" y="132">The holder's stopping time is a decision; the writer's is a draw from every open short position.</text>
  <text class="t" x="16" y="156">Call assigned: deliver stock, receive K.   Put assigned: take stock, pay K.</text>
  <text class="muted" x="16" y="184">At expiry, OCC exercises every option at least $0.01 in the money unless the holder instructs otherwise.</text>
</svg>

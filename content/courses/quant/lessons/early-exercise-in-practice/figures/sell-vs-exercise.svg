<svg viewBox="0 0 560 270" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .t { fill: currentColor; }
    .head { fill: currentColor; font-weight: 600; font-size: 13px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .intr { fill: #4c8dd6; opacity: 0.85; }
    .int { fill: #e2903a; opacity: 0.9; }
    .put { fill: #5aa46a; opacity: 0.9; }
    .b { fill: #4c8dd6; font-weight: 600; }
    .s { fill: #e2903a; font-weight: 600; }
    .g { fill: #5aa46a; font-weight: 600; }
    .guide { stroke: currentColor; stroke-width: 1; stroke-dasharray: 3 3; opacity: 0.5; fill: none; }
    .frame { fill: none; stroke: currentColor; stroke-width: 1; opacity: 0.4; }
  </style>
  <text class="head" x="16" y="20">The $70 call at S = 85, 45 days, r = 3%: exercise value against sale value</text>

  <text class="b" x="16" y="52">exercise: S − K = 15.00</text>
  <rect class="intr" x="16" y="58" width="300" height="12" rx="2"/>

  <text class="t" x="16" y="98">sell: 15.00 + 0.26 + 0.55 = 15.81</text>
  <rect class="intr" x="16" y="104" width="300" height="12" rx="2"/>
  <rect class="int" x="316" y="104" width="5.2" height="12"/>
  <rect class="put" x="321.2" y="104" width="11" height="12" rx="2"/>
  <text class="muted" x="340" y="114">scale: $1 = 20 px</text>

  <line class="guide" x1="316" y1="120" x2="316" y2="150"/>
  <line class="guide" x1="332.2" y1="120" x2="520" y2="150"/>
  <rect class="frame" x="316" y="150" width="204" height="60" rx="4"/>
  <text class="muted" x="322" y="164">the last dollar, magnified: $1 = 200 px</text>
  <rect class="intr" x="316" y="172" width="8" height="12"/>
  <rect class="int" x="324" y="172" width="52" height="12"/>
  <rect class="put" x="376" y="172" width="110" height="12" rx="2"/>
  <text class="s" x="324" y="200">0.26 interest</text>
  <text class="g" x="420" y="200">0.55 put value</text>

  <text class="t" x="16" y="140">Exercising collects the blue bar only.</text>
  <text class="t" x="16" y="158">Selling collects all three: the buyer pays</text>
  <text class="t" x="16" y="174">S − Ke⁻ʳᵀ + p, never less (put–call parity).</text>
  <text class="muted" x="16" y="240">Forfeited by exercise: 0.81 per share, $81 per contract.</text>
</svg>

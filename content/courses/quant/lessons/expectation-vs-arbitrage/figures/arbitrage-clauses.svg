<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .t { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .clause { fill: none; stroke: #e2903a; stroke-width: 1.5; }
    .miss { fill: none; stroke: currentColor; opacity: 0.35; }
    .arrow { stroke: currentColor; opacity: 0.6; fill: none; }
    .head { font-weight: 600; }
  </style>
  <text class="t head" x="320" y="22" text-anchor="middle">a strategy is an arbitrage when all three hold</text>
  <!-- clauses -->
  <rect class="clause" x="20" y="40" width="180" height="52" rx="6"/>
  <text class="t head" x="110" y="62" text-anchor="middle">1. costs nothing now</text>
  <text class="muted" x="110" y="80" text-anchor="middle">X₀ = 0</text>
  <rect class="clause" x="230" y="40" width="180" height="52" rx="6"/>
  <text class="t head" x="320" y="62" text-anchor="middle">2. loses in no state</text>
  <text class="muted" x="320" y="80" text-anchor="middle">P(X(T) &lt; 0) = 0</text>
  <rect class="clause" x="440" y="40" width="180" height="52" rx="6"/>
  <text class="t head" x="530" y="62" text-anchor="middle">3. gains in some state</text>
  <text class="muted" x="530" y="80" text-anchor="middle">P(X(T) &gt; 0) &gt; 0</text>
  <line class="arrow" x1="200" y1="66" x2="228" y2="66"/>
  <line class="arrow" x1="410" y1="66" x2="438" y2="66"/>
  <!-- near misses: each fails exactly one clause -->
  <text class="muted" x="320" y="118" text-anchor="middle">near misses: each fails exactly one clause</text>
  <rect class="miss" x="20" y="128" width="180" height="76" rx="6"/>
  <text class="t" x="110" y="150" text-anchor="middle">a lottery ticket</text>
  <text class="muted" x="110" y="168" text-anchor="middle">never loses after purchase,</text>
  <text class="muted" x="110" y="182" text-anchor="middle">can win; but it costs $2 now</text>
  <text class="t" x="110" y="198" text-anchor="middle" font-size="11">fails 1</text>
  <rect class="miss" x="230" y="128" width="180" height="76" rx="6"/>
  <text class="t" x="320" y="150" text-anchor="middle">a share bought on credit</text>
  <text class="muted" x="320" y="168" text-anchor="middle">zero cost, wins if the stock rises;</text>
  <text class="muted" x="320" y="182" text-anchor="middle">loses if it falls</text>
  <text class="t" x="320" y="198" text-anchor="middle" font-size="11">fails 2</text>
  <rect class="miss" x="440" y="128" width="180" height="76" rx="6"/>
  <text class="t" x="530" y="150" text-anchor="middle">buy a share, sell it at once</text>
  <text class="muted" x="530" y="168" text-anchor="middle">zero cost, never loses;</text>
  <text class="muted" x="530" y="182" text-anchor="middle">never gains either</text>
  <text class="t" x="530" y="198" text-anchor="middle" font-size="11">fails 3</text>
  <text x="320" y="240" text-anchor="middle" fill="#e2903a" font-weight="600">all three: sell a forward quoted above S₀eʳᵀ and run the construction</text>
</svg>

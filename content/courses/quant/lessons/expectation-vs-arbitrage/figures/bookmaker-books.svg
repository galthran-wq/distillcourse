<svg viewBox="0 0 640 312" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .t { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .head { font-weight: 600; }
    .beliefs { fill: #4c8dd6; font-weight: 600; }
    .book { fill: #e2903a; font-weight: 600; }
    .box { fill: none; stroke: currentColor; opacity: 0.35; }
    .rule { stroke: currentColor; opacity: 0.35; stroke-dasharray: 3 3; }
  </style>
  <text class="t" x="320" y="20" text-anchor="middle">wagers: $5,000 on A (true chance 25%), $10,000 on B (true chance 75%)</text>

  <!-- ledger 1: odds from beliefs -->
  <text class="beliefs" x="165" y="44" text-anchor="middle">odds from beliefs</text>
  <text class="muted" x="165" y="60" text-anchor="middle">3–1 against A, 3–1 on B</text>
  <rect class="box" x="20" y="70" width="290" height="200" rx="6"/>
  <text class="muted" x="180" y="94" text-anchor="middle">A wins</text>
  <text class="muted" x="265" y="94" text-anchor="middle">B wins</text>
  <text class="t" x="34" y="124">paid to winners</text>
  <text class="t" x="180" y="124" text-anchor="middle">15,000</text>
  <text class="t" x="265" y="124" text-anchor="middle">3,333</text>
  <text class="t" x="34" y="152">kept from losers</text>
  <text class="t" x="180" y="152" text-anchor="middle">10,000</text>
  <text class="t" x="265" y="152" text-anchor="middle">5,000</text>
  <line class="rule" x1="34" y1="167" x2="296" y2="167"/>
  <text class="t head" x="34" y="192">net</text>
  <text class="t head" x="180" y="192" text-anchor="middle">−5,000</text>
  <text class="t head" x="265" y="192" text-anchor="middle">+1,667</text>
  <text class="muted" x="165" y="227" text-anchor="middle">expected net: 0.25(−5,000) + 0.75(1,667) = 0</text>
  <text class="muted" x="165" y="250" text-anchor="middle">one race in four loses $5,000</text>

  <!-- ledger 2: odds from the book -->
  <text class="book" x="475" y="44" text-anchor="middle">odds from the book</text>
  <text class="muted" x="475" y="60" text-anchor="middle">2–1 against A, 2–1 on B</text>
  <rect class="box" x="330" y="70" width="290" height="200" rx="6"/>
  <text class="muted" x="490" y="94" text-anchor="middle">A wins</text>
  <text class="muted" x="575" y="94" text-anchor="middle">B wins</text>
  <text class="t" x="344" y="124">paid to winners</text>
  <text class="t" x="490" y="124" text-anchor="middle">10,000</text>
  <text class="t" x="575" y="124" text-anchor="middle">5,000</text>
  <text class="t" x="344" y="152">kept from losers</text>
  <text class="t" x="490" y="152" text-anchor="middle">10,000</text>
  <text class="t" x="575" y="152" text-anchor="middle">5,000</text>
  <line class="rule" x1="344" y1="167" x2="606" y2="167"/>
  <text class="t head" x="344" y="192">net</text>
  <text class="book" x="490" y="192" text-anchor="middle">0</text>
  <text class="book" x="575" y="192" text-anchor="middle">0</text>
  <text class="muted" x="475" y="227" text-anchor="middle">net 0 whichever horse wins</text>
  <text class="muted" x="475" y="250" text-anchor="middle">the 25% / 75% never entered</text>

  <text class="muted" x="320" y="300" text-anchor="middle">same wagers, same race: the left book carries the risk, the right book carries none</text>
</svg>

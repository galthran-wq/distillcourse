<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .t { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .axis { stroke: currentColor; opacity: 0.6; fill: none; }
    .rule { stroke: currentColor; opacity: 0.25; }
    .path { stroke: #4c8dd6; stroke-width: 1.5; fill: none; opacity: 0.5; }
    .act { fill: #e2903a; font-weight: 600; }
    .head { font-weight: 600; }
  </style>
  <text class="muted" x="20" y="30">stock price</text>
  <line class="axis" x1="90" y1="40" x2="90" y2="170"/>
  <line class="axis" x1="90" y1="170" x2="580" y2="170"/>
  <text class="muted" x="90" y="186" text-anchor="middle">now (t = 0)</text>
  <text class="muted" x="560" y="186" text-anchor="middle">expiry (t = T)</text>
  <circle cx="90" cy="120" r="4" fill="currentColor"/>
  <text class="t" x="78" y="124" text-anchor="end">S₀</text>
  <!-- ledger -->
  <line class="rule" x1="20" y1="205" x2="620" y2="205"/>
  <text class="muted head" x="140" y="222" text-anchor="middle">now</text>
  <text class="muted head" x="560" y="222" text-anchor="middle">at expiry</text>
  <text class="t head" x="20" y="250">cash</text>
  <text class="t head" x="20" y="278">stock</text>
  <text class="t head" x="20" y="306">loan</text>
  <text class="act" x="110" y="98">borrow S₀, buy one share</text>
  <text class="t" x="140" y="250" text-anchor="middle">+S₀ − S₀ = 0</text>
  <text class="t" x="140" y="278" text-anchor="middle">1 share</text>
  <text class="t" x="140" y="306" text-anchor="middle">−S₀</text>
  <text class="muted" x="320" y="250" text-anchor="middle">nothing paid, nothing received</text>
</svg>

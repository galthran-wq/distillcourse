<svg viewBox="0 0 640 240" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .t { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .axis { stroke: currentColor; opacity: 0.6; fill: none; }
    .line { stroke: #4c8dd6; stroke-width: 2.2; fill: none; }
    .corner { stroke: #e2903a; stroke-width: 2.2; fill: none; }
    .guide { stroke: currentColor; opacity: 0.4; stroke-dasharray: 3 3; }
  </style>
  <!-- panel 1: long forward -->
  <g transform="translate(10,0)">
    <text class="t" x="100" y="24" text-anchor="middle" font-weight="600">long forward: S(T) − K</text>
    <line class="axis" x1="20" y1="150" x2="190" y2="150"/>
    <line class="axis" x1="20" y1="40" x2="20" y2="200"/>
    <line class="guide" x1="100" y1="150" x2="100" y2="102"/>
    <polyline class="line" points="20,198 180,102"/>
    <text class="muted" x="100" y="166" text-anchor="middle">K</text>
    <text class="muted" x="190" y="166" text-anchor="end">S(T)</text>
    <text class="muted" x="24" y="52">payoff</text>
    <text class="t" x="100" y="222" text-anchor="middle">a straight line: slope 1</text>
  </g>
  <!-- panel 2: long call -->
  <g transform="translate(225,0)">
    <text class="t" x="100" y="24" text-anchor="middle" font-weight="600">long call: max(S(T) − K, 0)</text>
    <line class="axis" x1="20" y1="150" x2="190" y2="150"/>
    <line class="axis" x1="20" y1="40" x2="20" y2="200"/>
    <polyline class="corner" points="20,150 100,150 180,102"/>
    <circle cx="100" cy="150" r="4" fill="#e2903a"/>
    <text class="muted" x="100" y="166" text-anchor="middle">K</text>
    <text class="muted" x="190" y="166" text-anchor="end">S(T)</text>
    <text class="t" x="100" y="222" text-anchor="middle">a corner at K: slope 0, then 1</text>
  </g>
  <!-- panel 3: long put -->
  <g transform="translate(440,0)">
    <text class="t" x="100" y="24" text-anchor="middle" font-weight="600">long put: max(K − S(T), 0)</text>
    <line class="axis" x1="20" y1="150" x2="190" y2="150"/>
    <line class="axis" x1="20" y1="40" x2="20" y2="200"/>
    <polyline class="corner" points="20,102 100,150 180,150"/>
    <circle cx="100" cy="150" r="4" fill="#e2903a"/>
    <text class="muted" x="100" y="166" text-anchor="middle">K</text>
    <text class="muted" x="190" y="166" text-anchor="end">S(T)</text>
    <text class="t" x="100" y="222" text-anchor="middle">a corner at K: slope −1, then 0</text>
  </g>
</svg>

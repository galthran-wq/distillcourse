<svg viewBox="0 0 640 252" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .t { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; }
    .axis { stroke: currentColor; opacity: 0.6; fill: none; }
    .belief { stroke: #4c8dd6; stroke-width: 2; }
    .btext { fill: #4c8dd6; }
  </style>
  <text class="t" x="320" y="20" text-anchor="middle" font-size="13">one-year forward on a stock at S₀ = 100, r = 5%, σ = 20%</text>
  <!-- axis -->
  <line class="axis" x1="40" y1="140" x2="600" y2="140"/>
  <g class="axis">
    <line x1="120" y1="136" x2="120" y2="144"/><line x1="280" y1="136" x2="280" y2="144"/>
    <line x1="440" y1="136" x2="440" y2="144"/><line x1="600" y1="136" x2="600" y2="144"/>
  </g>
  <text class="muted" x="120" y="158" text-anchor="middle">100</text>
  <text class="muted" x="280" y="158" text-anchor="middle">110</text>
  <text class="muted" x="440" y="158" text-anchor="middle">120</text>
  <text class="muted" x="600" y="158" text-anchor="middle">130</text>
  <!-- expectation prices: one per belief -->
  <text class="btext" x="330" y="46" text-anchor="middle">expectation prices S₀e^(μ+σ²/2)T: one per belief about μ</text>
  <line class="belief" x1="152" y1="84" x2="152" y2="135"/><text class="btext" x="152" y="76" text-anchor="middle">μ = 0%</text><text class="btext" x="152" y="172" text-anchor="middle" font-size="11">102.0</text>
  <line class="belief" x1="236" y1="84" x2="236" y2="135"/><text class="btext" x="236" y="76" text-anchor="middle">5%</text><text class="btext" x="236" y="172" text-anchor="middle" font-size="11">107.3</text>
  <line class="belief" x1="324" y1="84" x2="324" y2="135"/><text class="btext" x="324" y="76" text-anchor="middle">10%</text><text class="btext" x="324" y="172" text-anchor="middle" font-size="11">112.7</text>
  <line class="belief" x1="416" y1="84" x2="416" y2="135"/><text class="btext" x="416" y="76" text-anchor="middle">15%</text><text class="btext" x="416" y="172" text-anchor="middle" font-size="11">118.5</text>
  <line class="belief" x1="514" y1="84" x2="514" y2="135"/><text class="btext" x="514" y="76" text-anchor="middle">20%</text><text class="btext" x="514" y="172" text-anchor="middle" font-size="11">124.6</text>
  <!-- the one arbitrage price -->
  <circle cx="202" cy="140" r="6" fill="#e2903a"/>
  <text x="202" y="196" text-anchor="middle" fill="#e2903a" font-weight="600">S₀eʳᵀ = 105.13, the enforced price</text>
  <!-- trades -->
  <text class="muted" x="40" y="220">quote F below 105.13: buy the forward, short the stock, lend S₀; collect 105.13 − F in every state</text>
  <text class="muted" x="40" y="240">quote F above 105.13: sell the forward, borrow S₀, buy the stock; collect F − 105.13 in every state</text>
</svg>

<svg viewBox="0 0 640 335" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .head { fill: currentColor; font-weight: 600; font-size: 13px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .t { fill: currentColor; font-size: 12px; }
    .axis { stroke: currentColor; stroke-width: 1; opacity: 0.5; }
    .int { fill: #4c8dd6; opacity: 0.85; }
    .up { fill: #e2903a; }
    .s { fill: #e2903a; font-weight: 600; font-size: 11.5px; }
    .b { fill: #4c8dd6; font-weight: 600; font-size: 11.5px; }
    .bnd { stroke: currentColor; stroke-width: 1.2; stroke-dasharray: 4 3; opacity: 0.6; }
  </style>
  <text class="head" x="16" y="20">Waiting one period at price s: interest lost on the strike vs upside kept</text>

  <line class="axis" x1="70" y1="240" x2="600" y2="240"/>
  <line class="axis" x1="70" y1="240" x2="70" y2="50"/>
  <text class="muted" x="62" y="244" text-anchor="end">0</text>
  <text class="muted" x="62" y="188" text-anchor="end">2</text>
  <text class="muted" x="62" y="132" text-anchor="end">4</text>
  <text class="muted" x="62" y="76" text-anchor="end">6</text>
  <text class="muted" x="20" y="145">dollars</text>

  <!-- s = 1 -->
  <rect class="int" x="100" y="217.6" width="40" height="22.4"/>
  <rect class="up" x="144" y="240" width="40" height="0"/>
  <text class="b" x="120" y="210" text-anchor="middle">0.8</text>
  <text class="s" x="164" y="232" text-anchor="middle">0</text>
  <text class="muted" x="142" y="258" text-anchor="middle">s = 1</text>
  <text class="s" x="142" y="274" text-anchor="middle">exercise</text>

  <!-- s = 2 -->
  <rect class="int" x="230" y="217.6" width="40" height="22.4"/>
  <rect class="up" x="274" y="228.8" width="40" height="11.2"/>
  <text class="b" x="250" y="210" text-anchor="middle">0.8</text>
  <text class="s" x="294" y="221" text-anchor="middle">0.4</text>
  <text class="muted" x="272" y="258" text-anchor="middle">s = 2</text>
  <text class="s" x="272" y="274" text-anchor="middle">exercise</text>

  <line class="bnd" x1="335" y1="60" x2="335" y2="240"/>
  <text class="muted" x="340" y="70">boundary</text>

  <!-- s = 4 -->
  <rect class="int" x="360" y="217.6" width="40" height="22.4"/>
  <rect class="up" x="404" y="189.6" width="40" height="50.4"/>
  <text class="b" x="380" y="210" text-anchor="middle">0.8</text>
  <text class="s" x="424" y="182" text-anchor="middle">1.8</text>
  <text class="muted" x="402" y="258" text-anchor="middle">s = 4</text>
  <text class="s" x="402" y="274" text-anchor="middle">continue</text>

  <!-- s = 8 -->
  <rect class="int" x="490" y="217.6" width="40" height="22.4"/>
  <rect class="up" x="534" y="91.6" width="40" height="148.4"/>
  <text class="b" x="510" y="210" text-anchor="middle">0.8</text>
  <text class="s" x="554" y="84" text-anchor="middle">5.3</text>
  <text class="muted" x="532" y="258" text-anchor="middle">s = 8</text>
  <text class="s" x="532" y="274" text-anchor="middle">continue</text>

  <text class="b" x="16" y="300">blue: K − K/(1 + r) = 0.8, the same at every price;</text>
  <text class="s" x="16" y="318">amber: ⅘ · ½ Σ [v(S₁) − (4 − S₁)] over the two successors, the upside kept</text>
</svg>

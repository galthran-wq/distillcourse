<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .head { fill: currentColor; font-weight: 600; font-size: 13px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .t { fill: currentColor; font-size: 12px; }
    .axis { stroke: currentColor; stroke-width: 1; opacity: 0.5; }
    .bar { fill: currentColor; opacity: 0.3; }
    .win { fill: #e2903a; }
    .s { fill: #e2903a; font-weight: 600; font-size: 11.5px; }
    .b { fill: #4c8dd6; font-weight: 600; font-size: 11.5px; }
    .lvl { stroke: currentColor; stroke-width: 1; opacity: 0.35; }
    .bnd { stroke: #e2903a; stroke-width: 2.5; }
    .node { fill: currentColor; opacity: 0.5; }
    .edge { stroke: currentColor; stroke-width: 1; opacity: 0.3; }
  </style>
  <text class="head" x="16" y="20">Perpetual $4 put from S₀ = 4: value of "exercise at 4·2⁻ᵐ" for m = 0, …, 4</text>

  <line class="axis" x1="60" y1="250" x2="330" y2="250"/>
  <line class="axis" x1="60" y1="250" x2="60" y2="60"/>
  <text class="muted" x="52" y="254" text-anchor="end">0</text>
  <text class="muted" x="52" y="164" text-anchor="end">0.5</text>
  <text class="muted" x="52" y="74" text-anchor="end">1</text>
  <text class="muted" x="20" y="150">value</text>

  <rect class="bar" x="76" y="250" width="36" height="0"/>
  <text class="t" x="94" y="242" text-anchor="middle">0</text>
  <text class="muted" x="94" y="268" text-anchor="middle">m = 0</text>
  <text class="muted" x="94" y="282" text-anchor="middle">at 4</text>

  <rect class="win" x="130" y="70" width="36" height="180"/>
  <text class="s" x="148" y="62" text-anchor="middle">1</text>
  <text class="muted" x="148" y="268" text-anchor="middle">m = 1</text>
  <text class="muted" x="148" y="282" text-anchor="middle">at 2</text>

  <rect class="bar" x="184" y="115" width="36" height="135"/>
  <text class="t" x="202" y="107" text-anchor="middle">3/4</text>
  <text class="muted" x="202" y="268" text-anchor="middle">m = 2</text>
  <text class="muted" x="202" y="282" text-anchor="middle">at 1</text>

  <rect class="bar" x="238" y="171.25" width="36" height="78.75"/>
  <text class="t" x="256" y="163" text-anchor="middle">7/16</text>
  <text class="muted" x="256" y="268" text-anchor="middle">m = 3</text>
  <text class="muted" x="256" y="282" text-anchor="middle">at ½</text>

  <rect class="bar" x="292" y="207.8" width="36" height="42.2"/>
  <text class="t" x="310" y="200" text-anchor="middle">15/64</text>
  <text class="muted" x="310" y="268" text-anchor="middle">m = 4</text>
  <text class="muted" x="310" y="282" text-anchor="middle">at ¼</text>

  <text class="t" x="60" y="306">value = intrinsic at the level × discount factor = 4(1 − 2^{−m}) × (½)^m</text>

  <line class="lvl" x1="400" y1="70" x2="620" y2="70"/>
  <line class="lvl" x1="400" y1="110" x2="620" y2="110"/>
  <line class="bnd" x1="400" y1="150" x2="620" y2="150"/>
  <line class="lvl" x1="400" y1="190" x2="620" y2="190"/>
  <line class="lvl" x1="400" y1="230" x2="620" y2="230"/>
  <text class="muted" x="394" y="74" text-anchor="end">8</text>
  <text class="muted" x="394" y="114" text-anchor="end">4 = S₀ = K</text>
  <text class="s" x="394" y="154" text-anchor="end">2</text>
  <text class="muted" x="394" y="194" text-anchor="end">1</text>
  <text class="muted" x="394" y="234" text-anchor="end">½</text>
  <text class="b" x="466" y="60">intrinsic</text>
  <text class="b" x="566" y="60">discount</text>
  <text class="t" x="470" y="104">0</text><text class="t" x="574" y="104">1</text>
  <text class="s" x="470" y="144">2</text><text class="s" x="574" y="144">½</text>
  <text class="t" x="470" y="184">3</text><text class="t" x="574" y="184">¼</text>
  <text class="t" x="470" y="224">3½</text><text class="t" x="574" y="224">⅛</text>
  <text class="s" x="372" y="262">boundary at 2: the last level where</text>
  <text class="s" x="372" y="278">doubling the intrinsic value beats</text>
  <text class="s" x="372" y="294">halving the discount factor</text>
</svg>

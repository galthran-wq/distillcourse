  <text class="t" x="278" y="76">ring: the first visit to level 1, on toss 2j − 1</text>
  <text class="t" x="278" y="94">the first 2j − 2 tosses stay at or below 0 and end at 0;</text>
  <text class="t" x="278" y="112">the last toss is the head that crosses</text>
  <text class="b" x="278" y="134">count = C₍ⱼ₋₁₎: 1, 1, 2, 5, 14, …</text>
  <text class="b" x="278" y="152">each path has probability 2⁻⁽²ʲ⁻¹⁾</text>
  <text class="muted" x="16" y="316">so P(τ₁ = 5) = 2/32 = 1/16 and P(τ₁ = 7) = 5/128, the values the formula gives at j = 3 and j = 4</text>

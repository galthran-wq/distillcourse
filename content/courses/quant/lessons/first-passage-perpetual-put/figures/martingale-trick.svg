<svg viewBox="0 0 640 350" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .head { fill: currentColor; font-weight: 600; font-size: 13px; }
    .t { fill: currentColor; font-size: 12px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .box { fill: none; stroke: currentColor; stroke-width: 1.2; opacity: 0.6; rx: 6; }
    .abox { fill: none; stroke: #e2903a; stroke-width: 1.8; }
    .bbox { fill: none; stroke: #4c8dd6; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .arrow { stroke: currentColor; stroke-width: 1.4; fill: none; opacity: 0.7; }
    .s { fill: #e2903a; font-weight: 600; }
    .b { fill: #4c8dd6; font-weight: 600; }
  </style>
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor" opacity="0.7"/>
    </marker>
  </defs>
  <text class="head" x="16" y="20">The martingale trick, step by step: from a fair game to the generating function of τ₁</text>

  <rect class="box" x="16" y="36" width="608" height="40" rx="6"/>
  <text class="t" x="28" y="52">1. Zₙ = e^{σMₙ}·αⁿ with α = 2/(e^σ + e^{−σ}) &lt; 1, σ &gt; 0, is a martingale under the fair coin:</text>
  <text class="muted" x="28" y="69">Eₙ[e^{σX_{n+1}}] = ½e^σ + ½e^{−σ} = 1/α cancels the extra factor α exactly.</text>

  <line class="arrow" x1="320" y1="76" x2="320" y2="92" marker-end="url(#ah)"/>

  <rect class="box" x="16" y="94" width="608" height="40" rx="6"/>
  <text class="t" x="28" y="110">2. Stop at τ₁. Optional sampling, part II: E[Z_{n∧τ₁}] = Z₀ = 1 for every finite n.</text>
  <text class="muted" x="28" y="127">on {τ₁ ≤ n}: frozen value e^σ α^{τ₁};   on {τ₁ &gt; n}: Mₙ ≤ 0, so Zₙ = e^{σMₙ}αⁿ ≤ αⁿ</text>

  <line class="arrow" x1="320" y1="134" x2="320" y2="150" marker-end="url(#ah)"/>

  <rect class="abox" x="16" y="152" width="300" height="58" rx="6"/>
  <text class="s" x="28" y="170">τ₁ ≤ n:  E[e^σ α^{τ₁} 𝟙{τ₁ ≤ n}]</text>
  <text class="muted" x="28" y="187">a finite sum over k ≤ n of e^σ α^k P(τ₁ = k);</text>
  <text class="muted" x="28" y="203">it rises to e^σ E[α^{τ₁}] as n → ∞ (α^∞ := 0)</text>

  <rect class="bbox" x="324" y="152" width="300" height="58" rx="6"/>
  <text class="b" x="336" y="170">τ₁ &gt; n:  0 ≤ E[Zₙ 𝟙{τ₁ &gt; n}] ≤ αⁿ</text>
  <text class="muted" x="336" y="187">because Mₙ ≤ 0 there and α &lt; 1;</text>
  <text class="muted" x="336" y="203">it falls to 0 as n → ∞</text>

  <line class="arrow" x1="166" y1="210" x2="240" y2="228" marker-end="url(#ah)"/>
  <line class="arrow" x1="474" y1="210" x2="400" y2="228" marker-end="url(#ah)"/>

  <rect class="box" x="16" y="230" width="608" height="40" rx="6"/>
  <text class="t" x="28" y="246">3. Add the two pieces and let n → ∞:   1 = e^σ · E[α^{τ₁}] + 0,   so   E[α^{τ₁}] = e^{−σ}.</text>
  <text class="muted" x="28" y="263">left side: 1 at every n;   right side: a monotone sum plus a term squeezed to 0</text>

  <line class="arrow" x1="320" y1="270" x2="320" y2="286" marker-end="url(#ah)"/>

  <rect class="box" x="16" y="288" width="608" height="50" rx="6"/>
  <text class="t" x="28" y="305">4. Eliminate σ: α(e^σ + e^{−σ}) = 2 is a quadratic in e^{−σ}; take the root below 1:</text>
  <text class="s" x="28" y="326">E[α^{τ₁}] = e^{−σ} = (1 − √(1 − α²)) / α</text>
</svg>

<svg viewBox="0 0 560 280" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .head { fill: currentColor; font-weight: 600; font-size: 13px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .t { fill: currentColor; font-size: 12px; }
    .axis { stroke: currentColor; stroke-width: 1; opacity: 0.5; }
    .bar { fill: #e2903a; opacity: 0.9; }
    .s { fill: #e2903a; font-weight: 600; font-size: 11.5px; }
    .b { fill: #4c8dd6; font-weight: 600; font-size: 11.5px; }
    .fit { stroke: #4c8dd6; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
  </style>
  <text class="head" x="16" y="20">P(τ₁ &gt; n): the share of paths still below level 1 after n steps</text>

  <line class="axis" x1="70" y1="230" x2="540" y2="230"/>
  <line class="axis" x1="70" y1="230" x2="70" y2="40"/>
  <text class="muted" x="62" y="234" text-anchor="end">0</text>
  <text class="muted" x="62" y="134" text-anchor="end">0.15</text>
  <text class="muted" x="62" y="34" text-anchor="end">0.30</text>

  <rect class="bar" x="100" y="65.9" width="60" height="164.1"/>
  <text class="s" x="130" y="58" text-anchor="middle">0.246</text>
  <text class="muted" x="130" y="248" text-anchor="middle">n = 9</text>

  <rect class="bar" x="210" y="176.9" width="60" height="53.1"/>
  <text class="s" x="240" y="169" text-anchor="middle">0.080</text>
  <text class="muted" x="240" y="248" text-anchor="middle">n = 99</text>

  <rect class="bar" x="320" y="213.2" width="60" height="16.8"/>
  <text class="s" x="350" y="206" text-anchor="middle">0.025</text>
  <text class="muted" x="350" y="248" text-anchor="middle">n = 999</text>

  <rect class="bar" x="430" y="224.7" width="60" height="5.3"/>
  <text class="s" x="460" y="217" text-anchor="middle">0.008</text>
  <text class="muted" x="460" y="248" text-anchor="middle">n = 9 999</text>

  <text class="b" x="230" y="100">tenfold n divides the tail by √10 ≈ 3.16:</text>
  <text class="b" x="230" y="118">P(τ₁ &gt; n) ≈ √(2/πn), so Σₙ P(τ₁ &gt; n) = E[τ₁] = ∞</text>
  <text class="muted" x="16" y="270">exact: P(τ₁ &gt; 2j − 1) = P(M_{2j−1} = −1) = C(2j, j)/4ʲ, which tends to 0 too slowly to sum</text>
</svg>

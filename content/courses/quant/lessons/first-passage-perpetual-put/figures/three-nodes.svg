<svg viewBox="0 0 640 250" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .head { fill: currentColor; font-weight: 600; font-size: 13px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .t { fill: currentColor; font-size: 12px; }
    .edge { stroke: currentColor; stroke-width: 1.2; opacity: 0.5; }
    .node { fill: none; stroke: currentColor; stroke-width: 1.2; opacity: 0.7; }
    .cur { fill: none; stroke: #e2903a; stroke-width: 2; }
    .s { fill: #e2903a; font-weight: 600; font-size: 11.5px; }
    .b { fill: #4c8dd6; font-weight: 600; font-size: 11.5px; }
    .ok { fill: #5aa46a; font-weight: 600; font-size: 11.5px; }
  </style>
  <text class="head" x="16" y="20">Supermartingale check for (⅘)ⁿv(Sₙ): continuation ⅘·½[v(2s) + v(s/2)] vs v(s)</text>

  <!-- panel 1: s = 8 -->
  <line class="edge" x1="70" y1="120" x2="150" y2="70"/>
  <line class="edge" x1="70" y1="120" x2="150" y2="170"/>
  <rect class="cur" x="30" y="105" width="52" height="30" rx="5"/>
  <text class="s" x="56" y="124" text-anchor="middle">s = 8</text>
  <text class="s" x="56" y="98" text-anchor="middle">v = 0.5</text>
  <rect class="node" x="136" y="55" width="72" height="30" rx="5"/>
  <text class="t" x="172" y="74" text-anchor="middle">16: 0.25</text>
  <rect class="node" x="140" y="155" width="60" height="30" rx="5"/>
  <text class="t" x="170" y="174" text-anchor="middle">4: 1</text>
  <text class="b" x="30" y="205">⅘ · ½ (0.25 + 1) = 0.5</text>
  <text class="ok" x="30" y="222">= v(8): martingale (continue)</text>

  <!-- panel 2: s = 2 -->
  <line class="edge" x1="290" y1="120" x2="370" y2="70"/>
  <line class="edge" x1="290" y1="120" x2="370" y2="170"/>
  <rect class="cur" x="250" y="105" width="52" height="30" rx="5"/>
  <text class="s" x="276" y="124" text-anchor="middle">s = 2</text>
  <text class="s" x="276" y="98" text-anchor="middle">v = 2</text>
  <rect class="node" x="360" y="55" width="60" height="30" rx="5"/>
  <text class="t" x="390" y="74" text-anchor="middle">4: 1</text>
  <rect class="node" x="360" y="155" width="60" height="30" rx="5"/>
  <text class="t" x="390" y="174" text-anchor="middle">1: 3</text>
  <text class="b" x="250" y="205">⅘ · ½ (1 + 3) = 1.6</text>
  <text class="ok" x="250" y="222">&lt; v(2) = 2: strict (exercise)</text>

  <!-- panel 3: s = 1 -->
  <line class="edge" x1="510" y1="120" x2="590" y2="70"/>
  <line class="edge" x1="510" y1="120" x2="590" y2="170"/>
  <rect class="cur" x="470" y="105" width="52" height="30" rx="5"/>
  <text class="s" x="496" y="124" text-anchor="middle">s = 1</text>
  <text class="s" x="496" y="98" text-anchor="middle">v = 3</text>
  <rect class="node" x="580" y="55" width="56" height="30" rx="5"/>
  <text class="t" x="608" y="74" text-anchor="middle">2: 2</text>
  <rect class="node" x="574" y="155" width="64" height="30" rx="5"/>
  <text class="t" x="606" y="174" text-anchor="middle">½: 3.5</text>
  <text class="b" x="470" y="205">⅘ · ½ (2 + 3.5) = 2.2</text>
  <text class="ok" x="470" y="222">&lt; v(1) = 3: strict (exercise)</text>
</svg>

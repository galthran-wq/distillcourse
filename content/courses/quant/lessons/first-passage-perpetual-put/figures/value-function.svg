<svg viewBox="0 0 600 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .head { fill: currentColor; font-weight: 600; font-size: 13px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .t { fill: currentColor; font-size: 12px; }
    .axis { stroke: currentColor; stroke-width: 1; opacity: 0.5; }
    .g { stroke: currentColor; stroke-width: 1.6; fill: none; opacity: 0.45; }
    .gdot { fill: currentColor; opacity: 0.5; }
    .v { stroke: #e2903a; stroke-width: 2.4; fill: none; }
    .vdot { fill: #e2903a; }
    .fin { fill: #4c8dd6; }
    .s { fill: #e2903a; font-weight: 600; font-size: 11.5px; }
    .b { fill: #4c8dd6; font-weight: 600; font-size: 11.5px; }
    .ring { fill: none; stroke: #e2903a; stroke-width: 2; }
    .guide { stroke: #e2903a; stroke-width: 1; stroke-dasharray: 3 3; opacity: 0.6; }
  </style>
  <text class="head" x="16" y="20">v(s) for the perpetual $4 put: intrinsic up to the boundary, 4/s beyond it</text>

  <line class="axis" x1="80" y1="250" x2="560" y2="250"/>
  <line class="axis" x1="80" y1="250" x2="80" y2="40"/>
  <text class="muted" x="72" y="254" text-anchor="end">0</text>
  <text class="muted" x="72" y="204" text-anchor="end">1</text>
  <text class="muted" x="72" y="154" text-anchor="end">2</text>
  <text class="muted" x="72" y="104" text-anchor="end">3</text>
  <text class="muted" x="72" y="54" text-anchor="end">4</text>
  <text class="muted" x="80" y="268" text-anchor="middle">s = ½</text>
  <text class="muted" x="170" y="268" text-anchor="middle">1</text>
  <text class="muted" x="260" y="268" text-anchor="middle">2</text>
  <text class="muted" x="350" y="268" text-anchor="middle">4</text>
  <text class="muted" x="440" y="268" text-anchor="middle">8</text>
  <text class="muted" x="530" y="268" text-anchor="middle">16</text>

  <line class="guide" x1="260" y1="250" x2="260" y2="150"/>

  <polyline class="g" points="80,75 170,100 260,150 350,250 440,250 530,250"/>
  <polyline class="v" points="80,75 170,100 260,150 350,200 440,225 530,237.5"/>
  <circle class="vdot" cx="80" cy="75" r="4"/>
  <circle class="vdot" cx="170" cy="100" r="4"/>
  <circle class="vdot" cx="260" cy="150" r="4"/>
  <circle class="ring" cx="260" cy="150" r="9"/>
  <circle class="vdot" cx="350" cy="200" r="4"/>
  <circle class="vdot" cx="440" cy="225" r="4"/>
  <circle class="vdot" cx="530" cy="237.5" r="4"/>
  <circle class="gdot" cx="350" cy="250" r="3.5"/>
  <circle class="gdot" cx="440" cy="250" r="3.5"/>
  <circle class="gdot" cx="530" cy="250" r="3.5"/>

  <circle class="fin" cx="350" cy="201.6" r="3"/>
  <circle class="fin" cx="440" cy="228.9" r="3"/>
  <circle class="fin" cx="530" cy="243.6" r="3"/>

  <text class="s" x="92" y="70">v = 3.5</text>
  <text class="s" x="182" y="96">3</text>
  <text class="s" x="266" y="136">2: the kink, v = 4 − s = 4/s</text>
  <text class="s" x="362" y="196">1</text>
  <text class="s" x="452" y="221">0.5</text>
  <text class="s" x="542" y="234">0.25</text>
  <text class="muted" x="372" y="243">intrinsic (4 − s)⁺ = 0</text>

  <text class="s" x="290" y="60">amber: v = 4 − s (s ≤ 2), 4/s (s ≥ 2)</text>
  <text class="b" x="290" y="78">blue: the previous lesson's six-period tree,</text>
  <text class="b" x="290" y="94">0.969 at 4 (6 periods left), 0.422 at 8 (5 left),</text>
  <text class="b" x="290" y="110">0.128 at 16 (4 left): all below</text>
  <text class="muted" x="16" y="300">exercise region s ≤ 2: value equals intrinsic;   continuation region s ≥ 4: value above intrinsic</text>
</svg>

<svg viewBox="0 0 560 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .head { fill: currentColor; font-weight: 600; font-size: 13px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .axis { stroke: currentColor; stroke-width: 1; opacity: 0.5; }
    .grid { stroke: currentColor; stroke-width: 1; opacity: 0.15; }
    .walk { stroke: #e2903a; stroke-width: 2.5; fill: none; }
    .wdot { fill: #e2903a; }
    .level { stroke: #4c8dd6; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .b { fill: #4c8dd6; font-weight: 600; font-size: 11.5px; }
    .s { fill: #e2903a; font-weight: 600; font-size: 11.5px; }
    .ring { fill: none; stroke: #4c8dd6; stroke-width: 2; }
  </style>
  <text class="head" x="16" y="20">Tosses T, H, H, H, T: the walk 0, −1, 0, 1, 2, 1 and its first passage to 1</text>

  <line class="grid" x1="90" y1="70" x2="540" y2="70"/>
  <line class="grid" x1="90" y1="160" x2="540" y2="160"/>
  <line class="grid" x1="90" y1="205" x2="540" y2="205"/>
  <line class="grid" x1="90" y1="250" x2="540" y2="250"/>
  <line class="axis" x1="90" y1="270" x2="550" y2="270"/>
  <line class="axis" x1="90" y1="270" x2="90" y2="50"/>
  <text class="muted" x="82" y="74" text-anchor="end">2</text>
  <text class="muted" x="82" y="119" text-anchor="end">1</text>
  <text class="muted" x="82" y="164" text-anchor="end">0</text>
  <text class="muted" x="82" y="209" text-anchor="end">−1</text>
  <text class="muted" x="82" y="254" text-anchor="end">−2</text>
  <text class="muted" x="40" y="150">Mₙ</text>
  <text class="muted" x="90" y="288" text-anchor="middle">n = 0</text>
  <text class="muted" x="180" y="288" text-anchor="middle">1 (T)</text>
  <text class="muted" x="270" y="288" text-anchor="middle">2 (H)</text>
  <text class="muted" x="360" y="288" text-anchor="middle">3 (H)</text>
  <text class="muted" x="450" y="288" text-anchor="middle">4 (H)</text>
  <text class="muted" x="540" y="288" text-anchor="middle">5 (T)</text>

  <line class="level" x1="90" y1="115" x2="550" y2="115"/>
  <text class="b" x="96" y="108">level m = 1</text>

  <polyline class="walk" points="90,160 180,205 270,160 360,115 450,70 540,115"/>
  <circle class="wdot" cx="90" cy="160" r="4"/>
  <circle class="wdot" cx="180" cy="205" r="4"/>
  <circle class="wdot" cx="270" cy="160" r="4"/>
  <circle class="wdot" cx="360" cy="115" r="4"/>
  <circle class="wdot" cx="450" cy="70" r="4"/>
  <circle class="wdot" cx="540" cy="115" r="4"/>
  <circle class="ring" cx="360" cy="115" r="10"/>
  <text class="b" x="360" y="96" text-anchor="middle">τ₁ = 3: first visit to level 1</text>
  <text class="muted" x="550" y="134" text-anchor="end">return at 5: not a first visit</text>
  <text class="s" x="110" y="52">amber: the walk;  ring: τ₁ = min{n : Mₙ = 1}</text>
</svg>

<svg viewBox="0 0 640 318" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .t { fill: currentColor; }
    .head { fill: currentColor; font-weight: 600; font-size: 13px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .f { font-size: 14px; }
    .row { stroke: currentColor; stroke-width: 1; fill: none; opacity: 0.35; }
    .fence { stroke: #e2903a; stroke-width: 1.4; fill: none; }
    .lamb { fill: #e2903a; font-weight: 600; }
    .arr { stroke: currentColor; stroke-width: 1; fill: none; opacity: 0.6; }
    .guide { stroke: currentColor; stroke-width: 1; stroke-dasharray: 3 3; opacity: 0.5; }
  </style>
  <text class="head" x="16" y="22">The five sums of Σⱼ [f(tⱼ₊₁, W(tⱼ₊₁)) − f(tⱼ, W(tⱼ))], each with its limit</text>
  <text class="muted" x="16" y="42">sum over the cells of a partition</text>
  <text class="muted" x="260" y="42">limit as ‖Π‖ → 0</text>
  <text class="muted" x="380" y="42">why</text>
  <line class="guide" x1="16" y1="48" x2="624" y2="48"/>

  <!-- row 1: dt sum -->
  <rect class="row" x="12" y="58" width="616" height="40" rx="5"/>
  <text class="t f" x="20" y="83">Σ fₜ Δtⱼ</text>
  <line class="arr" x1="200" y1="78" x2="250" y2="78"/>
  <path class="arr" d="M244,74 l6,4 l-6,4"/>
  <text class="t f" x="260" y="83">∫₀ᵀ fₜ dt</text>
  <text class="muted" x="380" y="83">Riemann sum of a continuous function of t</text>

  <!-- row 2: dW sum (fenced) -->
  <rect class="fence" x="12" y="106" width="616" height="40" rx="5"/>
  <text class="t f" x="20" y="131">Σ fₓ ΔWⱼ</text>
  <line class="arr" x1="200" y1="126" x2="250" y2="126"/>
  <path class="arr" d="M244,122 l6,4 l-6,4"/>
  <text class="t f" x="260" y="131">∫₀ᵀ fₓ dW</text>
  <text class="muted" x="380" y="126">Itô integral extension theorem</text>
  <text class="lamb" x="380" y="140" font-size="11">fenced: cited from the previous lesson</text>

  <!-- row 3: (dW)^2 sum (fenced) -->
  <rect class="fence" x="12" y="154" width="616" height="40" rx="5"/>
  <text class="t f" x="20" y="179">½ Σ fₓₓ (ΔWⱼ)²</text>
  <line class="arr" x1="200" y1="174" x2="250" y2="174"/>
  <path class="arr" d="M244,170 l6,4 l-6,4"/>
  <text class="t f" x="260" y="179">½ ∫₀ᵀ fₓₓ dt</text>
  <text class="muted" x="380" y="174">QV theorem: Σ(ΔWⱼ)² → T, weighted by fₓₓ</text>
  <text class="lamb" x="380" y="188" font-size="11">fenced: mean square, not path by path</text>

  <!-- row 4: mixed -->
  <rect class="row" x="12" y="202" width="616" height="40" rx="5"/>
  <text class="t f" x="20" y="227">Σ fₜₓ Δtⱼ ΔWⱼ</text>
  <line class="arr" x1="200" y1="222" x2="250" y2="222"/>
  <path class="arr" d="M244,218 l6,4 l-6,4"/>
  <text class="t f" x="260" y="227">0</text>
  <text class="muted" x="380" y="227">≤ max|ΔWₖ| · ∫|fₜₓ| dt → 0: path continuity</text>

  <!-- row 5: dt^2 -->
  <rect class="row" x="12" y="250" width="616" height="40" rx="5"/>
  <text class="t f" x="20" y="275">½ Σ fₜₜ (Δtⱼ)²</text>
  <line class="arr" x1="200" y1="270" x2="250" y2="270"/>
  <path class="arr" d="M244,266 l6,4 l-6,4"/>
  <text class="t f" x="260" y="275">0</text>
  <text class="muted" x="380" y="275">≤ ½ ‖Π‖ · ∫|fₜₜ| dt → 0: the mesh</text>

  <text class="muted" x="16" y="310">Amber rows: the two steps where a size estimate is not a proof and a convergence theorem is cited.</text>
</svg>

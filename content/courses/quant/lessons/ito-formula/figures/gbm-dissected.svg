<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .t { fill: currentColor; }
    .head { fill: currentColor; font-weight: 600; font-size: 13px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .ax { stroke: currentColor; stroke-width: 1; fill: none; opacity: 0.6; }
    .amb { stroke: #e2903a; fill: none; stroke-width: 1.4; }
    .blu { stroke: #4c8dd6; fill: none; stroke-width: 1.4; }
    .lamb { fill: #e2903a; font-weight: 600; }
    .lblu { fill: #4c8dd6; font-weight: 600; }
    .f { font-size: 16px; }
  </style>
  <text class="head" x="16" y="22">Geometric Brownian motion solved: apply the formula to log S</text>
  <text class="muted" x="16" y="44">dS = αS dt + σS dW,  f(x) = log x,  f′ = 1/x,  f″ = −1/x²,  dS dS = σ²S² dt</text>
  <text class="t f" x="16" y="80">d log S  =</text>
  <text class="lblu f" x="110" y="80">(1/S) dS</text>
  <text class="t f" x="196" y="80">−</text>
  <text class="lamb f" x="216" y="80">½ (1/S²) dS dS</text>
  <path class="blu" d="M110,88 v6 h74 v-6"/>
  <path class="amb" d="M216,88 v6 h134 v-6"/>
  <text class="lblu" x="110" y="110" font-size="11">chain-rule term:</text>
  <text class="lblu" x="110" y="123" font-size="11">α dt + σ dW</text>
  <text class="lamb" x="230" y="110" font-size="11">quadratic-variation correction:</text>
  <text class="lamb" x="230" y="123" font-size="11">½ · (1/S²) · σ²S² dt = ½σ² dt, no S left in it</text>
  <line class="ax" x1="16" y1="138" x2="624" y2="138"/>
  <text class="t f" x="16" y="170">S(t)  =  S₀ exp{ (</text>
  <text class="lblu f" x="163" y="170">α</text>
  <text class="t f" x="178" y="170">−</text>
  <text class="lamb f" x="196" y="170">½σ²</text>
  <text class="t f" x="236" y="170">) t  +  σ W(t) }</text>
  <path class="blu" d="M160,178 v6 h16 v-6"/>
  <path class="amb" d="M194,178 v6 h42 v-6"/>
  <text class="lblu" x="168" y="200" font-size="11" text-anchor="middle">from the drift</text>
  <text class="lamb" x="217" y="213" font-size="11" text-anchor="middle">from ½ f″ · dS dS</text>
  <text class="t" x="330" y="200" font-size="11">σW(t): the Itô integral of the constant σ</text>
  <line class="ax" x1="16" y1="222" x2="624" y2="222"/>
  <text class="t" x="16" y="244">log S(t) ~ N( log S₀ + (α − ½σ²)t,  σ²t ):  the mean of S grows at α, the median at α − ½σ².</text>
  <text class="muted" x="16" y="264">The gap ½σ² per unit time is the quadratic variation of log S; the calibrated tree produced the same number.</text>
</svg>

<svg viewBox="0 0 640 262" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .t { fill: currentColor; }
    .head { fill: currentColor; font-weight: 600; font-size: 13px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .cell { stroke: currentColor; stroke-width: 1; fill: none; opacity: 0.6; }
    .big { font-size: 18px; font-weight: 600; }
    .lamb { fill: #e2903a; }
  </style>
  <text class="head" x="16" y="22">The multiplication table: three limits of sums over a refining partition</text>
  <text class="muted" x="80" y="52" text-anchor="middle">×</text>
  <text class="t big" x="235" y="54" text-anchor="middle">dW</text>
  <text class="t big" x="460" y="54" text-anchor="middle">dt</text>
  <text class="t big" x="80" y="112" text-anchor="middle">dW</text>
  <text class="t big" x="80" y="182" text-anchor="middle">dt</text>
  <rect class="cell" x="130" y="70" width="210" height="70" rx="5"/>
  <rect class="cell" x="350" y="70" width="220" height="70" rx="5"/>
  <rect class="cell" x="130" y="150" width="210" height="70" rx="5"/>
  <rect class="cell" x="350" y="150" width="220" height="70" rx="5"/>
  <text class="lamb big" x="235" y="100" text-anchor="middle">dt</text>
  <text class="muted" x="235" y="122" text-anchor="middle">Σ(ΔWⱼ)² → T: the QV theorem</text>
  <text class="t big" x="460" y="100" text-anchor="middle">0</text>
  <text class="muted" x="460" y="122" text-anchor="middle">|Σ ΔWⱼ Δtⱼ| ≤ max|ΔWₖ| · T → 0</text>
  <text class="t big" x="235" y="180" text-anchor="middle">0</text>
  <text class="muted" x="235" y="202" text-anchor="middle">the same sum, the same bound</text>
  <text class="t big" x="460" y="180" text-anchor="middle">0</text>
  <text class="muted" x="460" y="202" text-anchor="middle">Σ(Δtⱼ)² ≤ ‖Π‖ · T → 0</text>
  <text class="t" x="16" y="240" font-size="11">Squaring dX = Θ dt + Δ dW by the table gives dX dX = Δ² dt:</text>
  <text class="t" x="16" y="254" font-size="11">the drift Θ never reaches the second-order term.</text>
</svg>

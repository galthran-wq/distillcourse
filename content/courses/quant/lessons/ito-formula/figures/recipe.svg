<svg viewBox="0 0 680 262" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .t { fill: currentColor; }
    .head { fill: currentColor; font-weight: 600; font-size: 13px; }
    .row { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .rule { stroke: currentColor; stroke-width: 1; opacity: 0.35; }
    .guide { stroke: currentColor; stroke-width: 1; opacity: 0.5; stroke-dasharray: 3 3; }
    .amb { fill: #e2903a; font-weight: 600; }
    .blu { fill: #4c8dd6; }
    .sub { font-size: 8px; }
  </style>
  <!-- column headers -->
  <text class="head" x="112" y="22">this lesson</text>
  <text class="head" x="272" y="22">module 5: the hedge</text>
  <text class="head" x="490" y="22">module 6: the measure</text>
  <line class="rule" x1="16" y1="30" x2="664" y2="30"/>
  <!-- row: candidate -->
  <text class="row" x="16" y="56">candidate</text>
  <text class="t" x="112" y="56">e⁻ʳᵗ S</text>
  <text class="t" x="272" y="56">e⁻ʳᵗ (X − c(t, S))</text>
  <text class="muted" x="272" y="72">holding Δ = c<tspan class="sub" dy="3">x</tspan><tspan dy="-3"> shares</tspan></text>
  <text class="t" x="490" y="56">e⁻ʳᵗ S Z</text>
  <text class="muted" x="490" y="72">Z = exp{−θW − ½θ²t}</text>
  <line class="guide" x1="16" y1="84" x2="664" y2="84"/>
  <!-- row: dW term -->
  <text class="row" x="16" y="106">dW term</text>
  <text class="blu" x="112" y="106">e⁻ʳᵗ σS dW</text>
  <text class="blu" x="272" y="106">e⁻ʳᵗ σS (Δ − c<tspan class="sub" dy="3">x</tspan><tspan dy="-3">) dW = 0</tspan></text>
  <text class="blu" x="490" y="106">e⁻ʳᵗ SZ (σ − θ) dW</text>
  <text class="muted" x="112" y="122">an Itô integral in every column: no drift, never part of the test</text>
  <line class="guide" x1="16" y1="134" x2="664" y2="134"/>
  <!-- row: dt term -->
  <text class="row" x="16" y="156">dt term</text>
  <text class="amb" x="112" y="156">e⁻ʳᵗ (α − r) S dt</text>
  <text class="amb" x="272" y="156">e⁻ʳᵗ [rc − c<tspan class="sub" dy="3">t</tspan><tspan dy="-3"> − rS c</tspan><tspan class="sub" dy="3">x</tspan></text>
  <text class="amb" x="292" y="172">− ½σ²S² c<tspan class="sub" dy="3">xx</tspan><tspan dy="-3">] dt</tspan></text>
  <text class="amb" x="490" y="156">e⁻ʳᵗ SZ (α − r − σθ) dt</text>
  <line class="guide" x1="16" y1="184" x2="664" y2="184"/>
  <!-- row: set to zero -->
  <text class="row" x="16" y="206">dt term = 0</text>
  <text class="row" x="16" y="220">forces</text>
  <text class="t" x="112" y="206" font-weight="600">α = r</text>
  <text class="muted" x="112" y="222">true only under the</text>
  <text class="muted" x="112" y="236">risk-neutral measure</text>
  <text class="t" x="272" y="206" font-weight="600">c<tspan class="sub" dy="3">t</tspan><tspan dy="-3"> + rS c</tspan><tspan class="sub" dy="3">x</tspan><tspan dy="-3"> + ½σ²S² c</tspan><tspan class="sub" dy="3">xx</tspan><tspan dy="-3"> = rc</tspan></text>
  <text class="muted" x="272" y="222">the Black–Scholes PDE;</text>
  <text class="muted" x="272" y="236">α has already dropped out</text>
  <text class="t" x="490" y="206" font-weight="600">θ = (α − r) / σ</text>
  <text class="muted" x="490" y="222">the market price of risk,</text>
  <text class="muted" x="490" y="236">the kernel Girsanov needs</text>
  <line class="rule" x1="16" y1="250" x2="664" y2="250"/>
</svg>

<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .t { fill: currentColor; }
    .head { fill: currentColor; font-weight: 600; font-size: 13px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .ax { stroke: currentColor; stroke-width: 1; fill: none; opacity: 0.6; }
    .curve { stroke: currentColor; stroke-width: 1.8; fill: none; }
    .amb { stroke: #e2903a; fill: none; stroke-width: 1.8; }
    .blu { stroke: #4c8dd6; fill: none; stroke-width: 1.8; }
    .lamb { fill: #e2903a; font-weight: 600; }
    .lblu { fill: #4c8dd6; font-weight: 600; }
    .gd { stroke: currentColor; stroke-width: 1; stroke-dasharray: 3 3; opacity: 0.5; fill: none; }
    .box { stroke: #5aa46a; stroke-width: 1.4; fill: none; rx: 4; }
    .lgrn { fill: #5aa46a; font-weight: 600; }
  </style>
  <text class="head" x="16" y="22">Frame 3: summed over n cells, only two terms survive</text>
  <line class="ax" x1="40" y1="260" x2="330" y2="260"/>
  <line class="ax" x1="40" y1="40" x2="40" y2="260"/>
  <text class="muted" x="96" y="276" text-anchor="middle">W(tⱼ)</text>
  <text class="muted" x="264" y="276" text-anchor="middle">W(tⱼ₊₁)</text>
  <text class="muted" x="180" y="292" text-anchor="middle">ΔW = 0.6 over one cell</text>
  <text class="muted" x="24" y="52">f(x) = eˣ</text>
  <polyline class="curve" points="40,247.3 68,235.3 96,222.0 124,207.4 152,191.2 180,173.2 208,153.4 236,131.6 264,107.4 292,80.6 320,51.1"/>
  <line class="gd" x1="96" y1="222" x2="96" y2="260"/>
  <line class="gd" x1="264" y1="107.4" x2="264" y2="260"/>
  <circle cx="96" cy="222" r="4" fill="currentColor"/>
  <circle cx="264" cy="107.4" r="4" fill="currentColor"/>
  <line class="amb" x1="40" y1="249.9" x2="320" y2="110.4" stroke-width="1.4"/>
  <text class="lamb" x="206" y="194" font-size="11">tangent</text>
  <polyline class="blu" points="40,247.1 68,235.3 96,222.0 124,207.4 152,191.4 180,173.9 208,155.1 236,134.9 264,113.2 292,90.2 320,65.8" stroke-width="1.4"/>
  <text class="lblu" x="292" y="72" font-size="11">parabola</text>
  <rect x="258" y="107.4" width="12" height="5.8" fill="#e2903a" opacity="0.7"/>
  <text class="lamb" x="274" y="104" font-size="11">error 0.07</text>
  <text class="head" x="350" y="52">One cell, then n = T/Δt cells</text>
  <line class="ax" x1="350" y1="60" x2="630" y2="60"/>
  <text class="muted" x="350" y="76">term</text>
  <text class="muted" x="470" y="76">one cell</text>
  <text class="muted" x="540" y="76">summed</text>
  <text class="t" x="350" y="100">f′(W) ΔW</text>
  <text class="t" x="470" y="100">√Δt</text>
  <text class="t" x="540" y="100">∫ f′ dW</text>
  <text class="muted" x="540" y="114">(Itô integral)</text>
  <text class="t" x="350" y="140">½ f″(W) (ΔW)²</text>
  <text class="t" x="470" y="140">Δt</text>
  <text class="t" x="540" y="140">½ ∫ f″ dt</text>
  <text class="muted" x="540" y="154">(QV theorem)</text>
  <text class="t" x="350" y="180">⅙ f‴ (ΔW)³</text>
  <text class="t" x="470" y="180">Δt√Δt</text>
  <text class="t" x="540" y="180">T√Δt → 0</text>
  <text class="muted" x="350" y="204">for f(t, x), three more terms:</text>
  <text class="t" x="350" y="224">fₜ Δt</text><text class="t" x="470" y="224">Δt</text><text class="t" x="540" y="224">∫ fₜ dt</text>
  <text class="t" x="350" y="244">fₜₓ Δt ΔW</text><text class="t" x="470" y="244">Δt√Δt</text><text class="t" x="540" y="244">→ 0</text>
  <text class="t" x="350" y="264">½ fₜₜ Δt²</text><text class="t" x="470" y="264">Δt²</text><text class="t" x="540" y="264">→ 0</text>
  <rect class="box" x="344" y="84" width="284" height="76"/>
  <text class="lgrn" x="350" y="288" font-size="11">boxed: the two terms that survive the limit</text>
</svg>

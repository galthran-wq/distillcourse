  <text class="lblu" x="68.0" y="63.0" font-size="11">right endpoint  Σ W(tⱼ₊₁)·ΔWⱼ</text>
  <line class="grn" x1="484.0" y1="196.7" x2="484.0" y2="98.3"/>

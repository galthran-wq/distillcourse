  <text class="lgrn" x="492.0" y="151.5" font-size="11">gap = Q_Π = 0.98</text>
  <text class="lgrn" x="492.0" y="165.5" font-size="10">(≈ T = 1)</text>
  <text class="muted" x="60" y="316">Right minus left is Σ(ΔWⱼ)² on every partition, exactly. It tends to T = 1, not to 0,</text>
  <text class="muted" x="60" y="330">so the two sums cannot share a limit; the evaluation point decides the answer.</text>

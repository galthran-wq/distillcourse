  <text class="muted" x="470.0" y="276" text-anchor="middle">256</text>
  <text class="muted" x="265" y="292" text-anchor="middle">cells n in the partition of [0, 1]</text>
  <text class="muted" x="54" y="264.0" text-anchor="end">-1.0</text>

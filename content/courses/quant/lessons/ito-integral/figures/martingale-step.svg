<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .t { fill: currentColor; }
    .head { fill: currentColor; font-weight: 600; font-size: 13px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .ax { stroke: currentColor; stroke-width: 1; fill: none; opacity: 0.6; }
    .guide { stroke: currentColor; opacity: 0.4; stroke-dasharray: 3 3; fill: none; }
    .amb { stroke: #e2903a; fill: none; stroke-width: 1.8; }
    .blu { stroke: #4c8dd6; fill: none; stroke-width: 1.6; }
    .grn { stroke: #5aa46a; fill: none; stroke-width: 1.8; }
    .lamb { fill: #e2903a; font-weight: 600; }
    .lblu { fill: #4c8dd6; font-weight: 600; }
    .lgrn { fill: #5aa46a; font-weight: 600; }
  </style>
  <text class="head" x="16" y="22">The step every proof in this lesson turns on, and the two properties that carry it</text>
  <text class="t" x="16" y="78" font-size="15">E[ </text>
  <text class="lamb" x="44" y="78" font-size="15" font-weight="600">Δ(tⱼ)</text>
  <text class="t" x="94" y="78" font-size="15"> · </text>
  <text class="lblu" x="108" y="78" font-size="15" font-weight="600">(W(tⱼ₊₁) − W(tⱼ))</text>
  <text class="t" x="262" y="78" font-size="15"> | F(tⱼ) ]  = </text>
  <text class="lamb" x="360" y="78" font-size="15" font-weight="600">Δ(tⱼ)</text>
  <text class="t" x="410" y="78" font-size="15"> · E[ </text>
  <text class="lblu" x="446" y="78" font-size="15" font-weight="600">W(tⱼ₊₁) − W(tⱼ)</text>
  <text class="t" x="578" y="78" font-size="15"> ]  = 0</text>
  <line class="amb" x1="70" y1="86" x2="70" y2="112"/>
  <text class="lamb" x="16" y="128" font-size="11">taking out what is known:</text>
  <text class="t" x="16" y="142" font-size="11">Δ(tⱼ) is decided by F(tⱼ) — the integrand is adapted</text>
  <text class="muted" x="16" y="156" font-size="11">(Theorem 2.3.2 (ii) of the coin-toss lesson, unchanged)</text>
  <line class="blu" x1="510" y1="86" x2="510" y2="112"/>
  <text class="lblu" x="372" y="128" font-size="11">independence, then the zero mean:</text>
  <text class="t" x="372" y="142" font-size="11">the increment after tⱼ is independent of F(tⱼ)</text>
  <text class="muted" x="372" y="156" font-size="11">(filtration clause three; Theorem 2.3.2 (iv))</text>
  <line class="ax" x1="16" y1="174" x2="624" y2="174"/>
  <text class="t" x="16" y="198" font-size="12">Where it breaks: Δ(tⱼ) = sign(W(tⱼ₊₁) − W(tⱼ)) is not decided by F(tⱼ) and cannot come out;</text>
  <text class="t" x="16" y="216" font-size="12">the product is |W(tⱼ₊₁) − W(tⱼ)| and its conditional mean is √(2(tⱼ₊₁ − tⱼ)/π) &gt; 0.</text>
  <text class="muted" x="16" y="238" font-size="11">The martingale proof, the isometry cross terms and the peeking counterexample are all this one line.</text>
</svg>

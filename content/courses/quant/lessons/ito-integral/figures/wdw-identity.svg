<svg viewBox="0 0 640 196" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .t { fill: currentColor; }
    .head { fill: currentColor; font-weight: 600; font-size: 13px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .ax { stroke: currentColor; stroke-width: 1; fill: none; opacity: 0.6; }
    .amb { stroke: #e2903a; fill: none; stroke-width: 1.8; }
    .blu { stroke: #4c8dd6; fill: none; stroke-width: 1.6; }
    .grn { stroke: #5aa46a; fill: none; stroke-width: 1.8; }
    .lamb { fill: #e2903a; font-weight: 600; }
    .lblu { fill: #4c8dd6; font-weight: 600; }
    .lgrn { fill: #5aa46a; font-weight: 600; }
  </style>
  <text class="head" x="16" y="22">The left-endpoint sum for ∫W dW, exactly, on every partition</text>
  <text class="lamb" x="16" y="66" font-size="15" font-weight="600">Σⱼ W(tⱼ)(W(tⱼ₊₁) − W(tⱼ))</text>
  <text class="t" x="248" y="66" font-size="15">=</text>
  <text class="lblu" x="270" y="66" font-size="15" font-weight="600">½ W(T)²</text>
  <text class="t" x="348" y="66" font-size="15">−</text>
  <text class="lgrn" x="370" y="66" font-size="15" font-weight="600">½ Σⱼ (W(tⱼ₊₁) − W(tⱼ))²</text>
  <path class="amb" d="M16,74 v6 h220 v-6" stroke-width="1.4"/>
  <path class="blu" d="M270,74 v6 h70 v-6" stroke-width="1.4"/>
  <path class="grn" d="M370,74 v6 h230 v-6" stroke-width="1.4"/>
  <text class="lamb" x="16" y="98" font-size="11">the Itô approximant: the gain of</text>
  <text class="lamb" x="16" y="112" font-size="11">holding W(tⱼ) shares over each cell</text>
  <text class="lblu" x="258" y="98" font-size="11">the chain rule's</text>
  <text class="lblu" x="258" y="112" font-size="11">whole answer</text>
  <text class="lgrn" x="370" y="98" font-size="11">half the sampled quadratic variation Q_Π,</text>
  <text class="lgrn" x="370" y="112" font-size="11">which tends to ½T (previous lesson)</text>
  <line class="ax" x1="16" y1="128" x2="624" y2="128"/>
  <text class="t" x="16" y="150" font-size="12">Mesh → 0:  ∫₀ᵀ W dW = ½W(T)² − ½T,  and  E[½W(T)² − ½T] = ½T − ½T = 0, as a martingale requires.</text>
  <text class="muted" x="16" y="172" font-size="11">Source of the identity: b² − a² = 2a(b − a) + (b − a)², summed over cells; the left side telescopes to W(T)².</text>
</svg>

<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .t { fill: currentColor; }
    .head { fill: currentColor; font-weight: 600; font-size: 13px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .edge { stroke: currentColor; stroke-width: 1.2; fill: none; opacity: 0.45; }
    .node { fill: currentColor; }
    .mean { fill: #4c8dd6; font-weight: 600; font-size: 12px; }
    .tick { stroke: #4c8dd6; stroke-width: 2; }
    .guide { stroke: currentColor; opacity: 0.35; stroke-dasharray: 3 3; }
    .s { fill: #e2903a; font-weight: 600; }
    .box { fill: none; stroke: #4c8dd6; opacity: 0.35; }
  </style>
  <text class="head" x="16" y="22">Mis-funded hedge on the $4 tree: discounted wealth Xₙ/1.25ⁿ from X₀ = 2.00</text>

  <text class="muted" x="60" y="52" text-anchor="middle">date 0</text>
  <text class="muted" x="250" y="52" text-anchor="middle">date 1</text>
  <text class="muted" x="440" y="52" text-anchor="middle">date 2</text>

  <line class="edge" x1="60" y1="150" x2="250" y2="95"/>
  <line class="edge" x1="60" y1="150" x2="250" y2="205"/>
  <line class="edge" x1="250" y1="95" x2="440" y2="65"/>
  <line class="edge" x1="250" y1="95" x2="440" y2="125"/>
  <line class="edge" x1="250" y1="205" x2="440" y2="175"/>
  <line class="edge" x1="250" y1="205" x2="440" y2="235"/>

  <circle class="node" cx="60" cy="150" r="3.5"/>
  <circle class="node" cx="250" cy="95" r="3.5"/>
  <circle class="node" cx="250" cy="205" r="3.5"/>
  <circle class="node" cx="440" cy="65" r="3.5"/>
  <circle class="node" cx="440" cy="125" r="3.5"/>
  <circle class="node" cx="440" cy="175" r="3.5"/>
  <circle class="node" cx="440" cy="235" r="3.5"/>

  <text class="s" x="50" y="154" text-anchor="end">2.00</text>
  <text class="t" x="250" y="86" text-anchor="middle">3.76</text>
  <text class="t" x="250" y="221" text-anchor="middle">0.24</text>
  <text class="t" x="452" y="69">7.28</text>
  <text class="t" x="452" y="129">0.24</text>
  <text class="t" x="452" y="179">0.24</text>
  <text class="t" x="452" y="239">0.24</text>
  <text class="muted" x="490" y="69">HH</text>
  <text class="muted" x="490" y="129">HT</text>
  <text class="muted" x="490" y="179">TH</text>
  <text class="muted" x="490" y="239">TT</text>
  <text class="muted" x="530" y="69">P̃ = ¼</text>
  <text class="muted" x="530" y="129">P̃ = ¼</text>
  <text class="muted" x="530" y="179">P̃ = ¼</text>
  <text class="muted" x="530" y="239">P̃ = ¼</text>
  <text class="muted" x="180" y="120">P̃ = ½</text>
  <text class="muted" x="180" y="177">P̃ = ½</text>

  <line class="guide" x1="60" y1="160" x2="60" y2="262"/>
  <line class="guide" x1="250" y1="215" x2="250" y2="262"/>
  <line class="guide" x1="440" y1="245" x2="440" y2="262"/>
  <line class="tick" x1="40" y1="266" x2="80" y2="266"/>
  <line class="tick" x1="230" y1="266" x2="270" y2="266"/>
  <line class="tick" x1="420" y1="266" x2="460" y2="266"/>

  <rect class="box" x="16" y="276" width="608" height="44" rx="6"/>
  <text class="muted" x="28" y="292">P̃-mean of each column</text>
  <text class="mean" x="60" y="311" text-anchor="middle">2.00</text>
  <text class="mean" x="250" y="311" text-anchor="middle">½·3.76 + ½·0.24 = 2.00</text>
  <text class="mean" x="470" y="311" text-anchor="middle">¼(7.28 + 0.24 + 0.24 + 0.24) = 2.00</text>
</svg>

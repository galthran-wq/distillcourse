<svg viewBox="0 0 640 352" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12.5">
  <style>
    .t { fill: currentColor; }
    .head { fill: currentColor; font-weight: 600; font-size: 13px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .s { fill: #e2903a; font-weight: 700; font-size: 15px; }
    .v { fill: #4c8dd6; font-weight: 600; }
    .edge { stroke: currentColor; stroke-width: 1.2; fill: none; opacity: 0.45; }
    .node { fill: currentColor; }
    .ring { fill: none; stroke: #e2903a; stroke-width: 2; }
    .div { stroke: currentColor; opacity: 0.25; }
    .eq { fill: #e2903a; font-weight: 700; font-size: 26px; }
  </style>
  <text class="head" x="160" y="22" text-anchor="middle">Backward step from time 2</text>
  <text class="head" x="480" y="22" text-anchor="middle">Expectation straight from time 3</text>
  <line class="div" x1="320" y1="30" x2="320" y2="120"/>
  <line class="div" x1="320" y1="175" x2="320" y2="245"/>
  <text class="eq" x="320" y="157" text-anchor="middle">=</text>

  <!-- left: node 120 with two children -->
  <line class="edge" x1="80" y1="150" x2="200" y2="85"/>
  <line class="edge" x1="80" y1="150" x2="200" y2="215"/>
  <circle class="ring" cx="80" cy="150" r="7"/>
  <circle class="node" cx="200" cy="85" r="3.5"/>
  <circle class="node" cx="200" cy="215" r="3.5"/>
  <text class="t" x="80" y="132" text-anchor="middle">S₁ = 120</text>
  <text class="v" x="80" y="174" text-anchor="middle">V₁ = ?</text>
  <text class="t" x="210" y="81">S₂ = 180</text>
  <text class="v" x="210" y="97">V₂ = 107.27</text>
  <text class="t" x="210" y="211">S₂ = 60</text>
  <text class="v" x="210" y="227">V₂ = 5.45</text>
  <text class="muted" x="128" y="108">p̃ = 0.6</text>
  <text class="muted" x="128" y="198">q̃ = 0.4</text>
  <text class="t" x="24" y="258">(0.6 × 107.27 + 0.4 × 5.45) / 1.1</text>
  <text class="t" x="24" y="278">= 66.55 / 1.1 = <tspan class="s">60.50</tspan></text>

  <!-- right: node 120 with four leaves via two tosses -->
  <line class="edge" x1="380" y1="150" x2="450" y2="105"/>
  <line class="edge" x1="380" y1="150" x2="450" y2="195"/>
  <line class="edge" x1="450" y1="105" x2="520" y2="65"/>
  <line class="edge" x1="450" y1="105" x2="520" y2="140"/>
  <line class="edge" x1="450" y1="195" x2="520" y2="140"/>
  <line class="edge" x1="450" y1="195" x2="520" y2="230"/>
  <circle class="ring" cx="380" cy="150" r="7"/>
  <circle class="node" cx="450" cy="105" r="3"/>
  <circle class="node" cx="450" cy="195" r="3"/>
  <circle class="node" cx="520" cy="65" r="3.5"/>
  <circle class="node" cx="520" cy="140" r="3.5"/>
  <circle class="node" cx="520" cy="230" r="3.5"/>
  <text class="t" x="380" y="132" text-anchor="middle">S₁ = 120</text>
  <text class="v" x="380" y="174" text-anchor="middle">V₁ = ?</text>
  <text class="t" x="530" y="61">270: V₃ = 190</text>
  <text class="muted" x="530" y="75">weight 0.6² = 0.36</text>
  <text class="t" x="530" y="136">90: V₃ = 10</text>
  <text class="muted" x="530" y="150">weight 0.48</text>
  <text class="t" x="530" y="226">30: V₃ = 0</text>
  <text class="muted" x="530" y="240">weight 0.4² = 0.16</text>
  <text class="muted" x="450" y="92" text-anchor="middle">180</text>
  <text class="muted" x="450" y="212" text-anchor="middle">60</text>
  <text class="t" x="340" y="258">(0.36 × 190 + 0.48 × 10 + 0.16 × 0) / 1.1²</text>
  <text class="t" x="340" y="278">= 73.2 / 1.21 = <tspan class="s">60.50</tspan></text>

  <text class="t" x="16" y="304" font-size="11.5">Both routes evaluate Ẽ₁[V₃/1.1²] at node 120. Averaging over toss 3 inside each time-2 node and then</text>
  <text class="t" x="16" y="320" font-size="11.5">over toss 2 is averaging over both tosses at once: the tower property.</text>
  <text class="t" x="16" y="336" font-size="11.5">Backward induction is the conditional expectation, computed one toss at a time.</text>
</svg>

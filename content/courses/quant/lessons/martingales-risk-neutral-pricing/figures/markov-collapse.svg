<svg viewBox="0 0 640 372" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .t { fill: currentColor; }
    .head { fill: currentColor; font-weight: 600; font-size: 13px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .s { fill: #e2903a; font-weight: 600; }
    .v { fill: #4c8dd6; font-weight: 600; }
    .box { fill: none; stroke: currentColor; opacity: 0.35; }
    .bad { fill: none; stroke: #e2903a; stroke-width: 1.6; stroke-dasharray: 4 3; }
    .ar { stroke: currentColor; opacity: 0.4; fill: none; }
    .div { stroke: currentColor; opacity: 0.25; }
  </style>
  <text class="head" x="160" y="20" text-anchor="middle">Put (5 − S₃)⁺: path values fold onto prices</text>
  <text class="head" x="480" y="20" text-anchor="middle">Lookback max Sₖ − S₃: they do not fold</text>
  <line class="div" x1="320" y1="28" x2="320" y2="330"/>

  <!-- left column: sequences y = 44 + 32 i -->
  <g>
    <text class="muted" x="40" y="40" text-anchor="middle">path</text>
    <text class="muted" x="80" y="40" text-anchor="middle">S₃</text>
    <text class="muted" x="120" y="40" text-anchor="middle">V₃</text>
    <text class="muted" x="230" y="40" text-anchor="middle">one value per price</text>
    <text class="t" x="40" y="62" text-anchor="middle">HHH</text><text class="t" x="80" y="62" text-anchor="middle">32</text><text class="v" x="120" y="62" text-anchor="middle">0</text>
    <text class="t" x="40" y="94" text-anchor="middle">HHT</text><text class="t" x="80" y="94" text-anchor="middle">8</text><text class="v" x="120" y="94" text-anchor="middle">0</text>
    <text class="t" x="40" y="126" text-anchor="middle">HTH</text><text class="t" x="80" y="126" text-anchor="middle">8</text><text class="v" x="120" y="126" text-anchor="middle">0</text>
    <text class="t" x="40" y="158" text-anchor="middle">THH</text><text class="t" x="80" y="158" text-anchor="middle">8</text><text class="v" x="120" y="158" text-anchor="middle">0</text>
    <text class="t" x="40" y="190" text-anchor="middle">HTT</text><text class="t" x="80" y="190" text-anchor="middle">2</text><text class="v" x="120" y="190" text-anchor="middle">3</text>
    <text class="t" x="40" y="222" text-anchor="middle">THT</text><text class="t" x="80" y="222" text-anchor="middle">2</text><text class="v" x="120" y="222" text-anchor="middle">3</text>
    <text class="t" x="40" y="254" text-anchor="middle">TTH</text><text class="t" x="80" y="254" text-anchor="middle">2</text><text class="v" x="120" y="254" text-anchor="middle">3</text>
    <text class="t" x="40" y="286" text-anchor="middle">TTT</text><text class="t" x="80" y="286" text-anchor="middle">0.5</text><text class="v" x="120" y="286" text-anchor="middle">4.5</text>
    <rect class="box" x="64" y="48" width="72" height="20" rx="4"/>
    <rect class="box" x="64" y="80" width="72" height="84" rx="4"/>
    <rect class="box" x="64" y="176" width="72" height="84" rx="4"/>
    <rect class="box" x="64" y="272" width="72" height="20" rx="4"/>
    <line class="ar" x1="140" y1="58" x2="180" y2="58"/>
    <line class="ar" x1="140" y1="122" x2="180" y2="122"/>
    <line class="ar" x1="140" y1="218" x2="180" y2="218"/>
    <line class="ar" x1="140" y1="282" x2="180" y2="282"/>
    <text class="t" x="188" y="62">v₃(32) = <tspan class="v">0</tspan></text>
    <text class="t" x="188" y="126">v₃(8) = <tspan class="v">0</tspan></text>
    <text class="t" x="188" y="222">v₃(2) = <tspan class="v">3</tspan></text>
    <text class="t" x="188" y="286">v₃(0.5) = <tspan class="v">4.5</tspan></text>
    <text class="muted" x="160" y="318" text-anchor="middle">time 2: v₂ = 0, 1.20, 3 (three numbers)</text>
  </g>

  <!-- right column -->
  <g transform="translate(320,0)">
    <text class="muted" x="40" y="40" text-anchor="middle">path</text>
    <text class="muted" x="80" y="40" text-anchor="middle">S₃</text>
    <text class="muted" x="120" y="40" text-anchor="middle">V₃</text>
    <text class="muted" x="230" y="40" text-anchor="middle">same price, different values</text>
    <text class="t" x="40" y="62" text-anchor="middle">HHH</text><text class="t" x="80" y="62" text-anchor="middle">32</text><text class="v" x="120" y="62" text-anchor="middle">0</text>
    <text class="t" x="40" y="94" text-anchor="middle">HHT</text><text class="t" x="80" y="94" text-anchor="middle">8</text><text class="v" x="120" y="94" text-anchor="middle">8</text>
    <text class="t" x="40" y="126" text-anchor="middle">HTH</text><text class="t" x="80" y="126" text-anchor="middle">8</text><text class="v" x="120" y="126" text-anchor="middle">0</text>
    <text class="t" x="40" y="158" text-anchor="middle">THH</text><text class="t" x="80" y="158" text-anchor="middle">8</text><text class="v" x="120" y="158" text-anchor="middle">0</text>
    <text class="t" x="40" y="190" text-anchor="middle">HTT</text><text class="t" x="80" y="190" text-anchor="middle">2</text><text class="v" x="120" y="190" text-anchor="middle">6</text>
    <text class="t" x="40" y="222" text-anchor="middle">THT</text><text class="t" x="80" y="222" text-anchor="middle">2</text><text class="v" x="120" y="222" text-anchor="middle">2</text>
    <text class="t" x="40" y="254" text-anchor="middle">TTH</text><text class="t" x="80" y="254" text-anchor="middle">2</text><text class="v" x="120" y="254" text-anchor="middle">2</text>
    <text class="t" x="40" y="286" text-anchor="middle">TTT</text><text class="t" x="80" y="286" text-anchor="middle">0.5</text><text class="v" x="120" y="286" text-anchor="middle">3.5</text>
    <rect class="box" x="64" y="48" width="72" height="20" rx="4"/>
    <rect class="bad" x="64" y="80" width="72" height="84" rx="4"/>
    <rect class="bad" x="64" y="176" width="72" height="84" rx="4"/>
    <rect class="box" x="64" y="272" width="72" height="20" rx="4"/>
    <text class="s" x="150" y="118">at price 8: 8, 0, 0</text>
    <text class="muted" x="150" y="134">no function of S₃ returns these</text>
    <text class="s" x="150" y="214">at price 2: 6, 2, 2</text>
    <text class="muted" x="150" y="230">the running maximum decides</text>
    <text class="muted" x="160" y="318" text-anchor="middle">time 2: 3.20, 2.40, 0.80, 2.20 (two at S₂ = 4)</text>
  </g>

  <text class="t" x="16" y="346" font-size="11.5">A payoff that reads only S₃ collapses to a function v₃(s) and the tree of prices has four leaves;</text>
  <text class="t" x="16" y="362" font-size="11.5">a payoff that reads the path needs the state (Sₙ, Mₙ), and the tree of pairs has six.</text>
</svg>

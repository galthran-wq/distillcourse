<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .t { fill: currentColor; }
    .head { fill: currentColor; font-weight: 600; font-size: 13px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .edge { stroke: currentColor; stroke-width: 1.2; fill: none; opacity: 0.45; }
    .node { fill: currentColor; }
    .w { fill: #4c8dd6; font-weight: 600; font-size: 11px; }
    .s { fill: #e2903a; font-weight: 600; }
    .mark { fill: none; stroke: #e2903a; stroke-width: 2; }
    .none { display: none; }
    .cur { fill: currentColor; font-size: 12.5px; }
    .box { fill: none; stroke: currentColor; opacity: 0.3; }
  </style>
  <text class="head" x="16" y="22">Discounted wealth from X₀ = 0 on the two-period $4 tree; every leaf has P̃-weight ¼</text>
  <text class="muted" x="16" y="44">frame 2 — a supposed arbitrage: no negative leaf, one positive leaf</text>

  <line class="edge" x1="60" y1="150" x2="250" y2="95"/>
  <line class="edge" x1="60" y1="150" x2="250" y2="205"/>
  <line class="edge" x1="250" y1="95" x2="440" y2="65"/>
  <line class="edge" x1="250" y1="95" x2="440" y2="125"/>
  <line class="edge" x1="250" y1="205" x2="440" y2="175"/>
  <line class="edge" x1="250" y1="205" x2="440" y2="235"/>

  <circle class="node" cx="60" cy="150" r="3.5"/>
  <circle class="node" cx="250" cy="95" r="3.5"/>
  <circle class="node" cx="250" cy="205" r="3.5"/>
  <circle class="node" cx="440" cy="65" r="3.5"/>
  <circle class="node" cx="440" cy="125" r="3.5"/>
  <circle class="node" cx="440" cy="175" r="3.5"/>
  <circle class="node" cx="440" cy="235" r="3.5"/>
  <circle class="mark" cx="440" cy="65" r="9"/>

  <text class="t" x="50" y="154" text-anchor="end">0</text>
  <text class="t" x="250" y="86" text-anchor="middle"></text>
  <text class="t" x="250" y="221" text-anchor="middle"></text>
  <text class="s" x="456" y="69">x* &gt; 0</text>
  <text class="t" x="456" y="129">≥ 0</text>
  <text class="t" x="456" y="179">≥ 0</text>
  <text class="t" x="456" y="239">≥ 0</text>
  <text class="muted" x="510" y="69">HH</text>
  <text class="muted" x="510" y="129">HT</text>
  <text class="muted" x="510" y="179">TH</text>
  <text class="muted" x="510" y="239">TT</text>
  <text class="w" x="540" y="69">P̃(HH) = ¼ &gt; 0</text>
  <text class="w" x="540" y="129">P̃ = ¼</text>
  <text class="w" x="540" y="179">P̃ = ¼</text>
  <text class="w" x="540" y="239">P̃ = ¼</text>

  <rect class="box" x="16" y="276" width="608" height="44" rx="6"/>
  <text class="none" x="28" y="294"></text>
  <text class="muted" x="28" y="312" font-size="11.5">equivalence: every leaf, the marked one included, carries positive P̃-weight</text>
</svg>

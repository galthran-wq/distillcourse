<svg viewBox="0 0 640 335" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12.5">
  <style>
    .t { fill: currentColor; }
    .head { fill: currentColor; font-weight: 600; font-size: 13px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .s { fill: #e2903a; font-weight: 600; }
    .b { fill: #4c8dd6; font-weight: 600; }
    .edgeS { stroke: #e2903a; stroke-width: 1.6; fill: none; opacity: 0.85; }
    .edgeM { stroke: #4c8dd6; stroke-width: 1.6; fill: none; opacity: 0.85; }
    .node { fill: currentColor; }
    .div { stroke: currentColor; opacity: 0.25; }
    .box { fill: none; stroke: currentColor; opacity: 0.3; }
  </style>
  <text class="head" x="150" y="22" text-anchor="middle">Discounted stock Dₙ = Sₙ/1.25ⁿ</text>
  <text class="head" x="470" y="22" text-anchor="middle">Target martingale Mₙ = Ẽₙ[V₃/1.25³] ($5 put)</text>
  <line class="div" x1="318" y1="30" x2="318" y2="210"/>

  <!-- left: D at root -->
  <line class="edgeS" x1="70" y1="130" x2="220" y2="70"/>
  <line class="edgeS" x1="70" y1="130" x2="220" y2="190"/>
  <circle class="node" cx="70" cy="130" r="4"/>
  <circle class="node" cx="220" cy="70" r="4"/>
  <circle class="node" cx="220" cy="190" r="4"/>
  <text class="t" x="60" y="134" text-anchor="end">D₀ = 4</text>
  <text class="t" x="230" y="66">D₁(H) = 6.4</text>
  <text class="s" x="230" y="82">ΔD = +2.4</text>
  <text class="t" x="230" y="194">D₁(T) = 1.6</text>
  <text class="s" x="230" y="210">ΔD = −2.4</text>
  <text class="muted" x="150" y="140" text-anchor="middle">½ · (+2.4) + ½ · (−2.4) = 0</text>
  <text class="muted" x="150" y="228" text-anchor="middle">spread of the branches: 2.4 − (−2.4) = 4.8</text>

  <!-- right: M at root -->
  <line class="edgeM" x1="390" y1="130" x2="540" y2="70"/>
  <line class="edgeM" x1="390" y1="130" x2="540" y2="190"/>
  <circle class="node" cx="390" cy="130" r="4"/>
  <circle class="node" cx="540" cy="70" r="4"/>
  <circle class="node" cx="540" cy="190" r="4"/>
  <text class="t" x="380" y="134" text-anchor="end">M₀ = 0.864</text>
  <text class="t" x="550" y="66">M₁(H) = 0.384</text>
  <text class="b" x="550" y="82">ΔM = −0.48</text>
  <text class="t" x="550" y="194">M₁(T) = 1.344</text>
  <text class="b" x="550" y="210">ΔM = +0.48</text>
  <text class="muted" x="470" y="140" text-anchor="middle">½ · (−0.48) + ½ · (+0.48) = 0</text>
  <text class="muted" x="470" y="228" text-anchor="middle">spread of the branches: −0.48 − 0.48 = −0.96</text>

  <rect class="box" x="16" y="246" width="608" height="80" rx="6"/>
  <text class="t" x="28" y="268">Both increments average to zero, so one scale factor matches them on both branches:</text>
  <text class="t" x="28" y="290">φ₀ = <tspan class="b">(−0.96)</tspan> / <tspan class="s">4.8</tspan> = −0.2,  and  −0.2 × (+2.4) = −0.48,  −0.2 × (−2.4) = +0.48.</text>
  <text class="t" x="28" y="312">The same −0.2 is δ₀(4), the put's root delta from the backward pass.</text>
</svg>

<svg viewBox="0 0 780 310" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .t { fill: currentColor; }
    .head { fill: currentColor; font-weight: 600; font-size: 13px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .edge { stroke: currentColor; stroke-width: 1.2; fill: none; opacity: 0.45; }
    .node { fill: currentColor; }
    .mean { fill: #4c8dd6; font-weight: 600; }
    .s { fill: #e2903a; font-weight: 600; }
    .div { stroke: currentColor; opacity: 0.25; }
  </style>
  <text class="head" x="390" y="22" text-anchor="middle">Running maximum Mₙ = max Sₖ on the $4 tree: two nodes with M₂ = 4</text>
  <line class="div" x1="390" y1="34" x2="390" y2="262"/>

  <!-- left panel: node TH -->
  <g>
    <text class="muted" x="90" y="128" text-anchor="middle">node TH</text>
    <line class="edge" x1="90" y1="150" x2="220" y2="95"/>
    <line class="edge" x1="90" y1="150" x2="220" y2="205"/>
    <circle class="node" cx="90" cy="150" r="3.5"/>
    <circle class="node" cx="220" cy="95" r="3.5"/>
    <circle class="node" cx="220" cy="205" r="3.5"/>
    <text class="t" x="78" y="146" text-anchor="end">S₂ = 4</text>
    <text class="s" x="78" y="162" text-anchor="end">M₂ = 4</text>
    <text class="muted" x="150" y="116" text-anchor="middle">P̃ = ½</text>
    <text class="muted" x="150" y="196" text-anchor="middle">P̃ = ½</text>
    <text class="t" x="232" y="91">S₃ = 8</text>
    <text class="t" x="232" y="107">M₃ = max(4, 8) = 8</text>
    <text class="t" x="232" y="201">S₃ = 2</text>
    <text class="t" x="232" y="217">M₃ = max(4, 2) = 4</text>
    <text class="mean" x="160" y="250" text-anchor="middle">Ẽ₂[M₃] = ½·8 + ½·4 = 6</text>
  </g>

  <!-- right panel: node TT -->
  <g transform="translate(390,0)">
    <text class="muted" x="90" y="128" text-anchor="middle">node TT</text>
    <line class="edge" x1="90" y1="150" x2="220" y2="95"/>
    <line class="edge" x1="90" y1="150" x2="220" y2="205"/>
    <circle class="node" cx="90" cy="150" r="3.5"/>
    <circle class="node" cx="220" cy="95" r="3.5"/>
    <circle class="node" cx="220" cy="205" r="3.5"/>
    <text class="t" x="78" y="146" text-anchor="end">S₂ = 1</text>
    <text class="s" x="78" y="162" text-anchor="end">M₂ = 4</text>
    <text class="muted" x="150" y="116" text-anchor="middle">P̃ = ½</text>
    <text class="muted" x="150" y="196" text-anchor="middle">P̃ = ½</text>
    <text class="t" x="232" y="91">S₃ = 2</text>
    <text class="t" x="232" y="107">M₃ = max(4, 2) = 4</text>
    <text class="t" x="232" y="201">S₃ = 0.5</text>
    <text class="t" x="232" y="217">M₃ = max(4, 0.5) = 4</text>
    <text class="mean" x="160" y="250" text-anchor="middle">Ẽ₂[M₃] = ½·4 + ½·4 = 4</text>
  </g>

  <text class="t" x="390" y="282" font-size="11.5" text-anchor="middle">Same M₂ = 4, different conditional means 6 and 4: no function g(M₂) returns both.</text>
  <text class="muted" x="390" y="298" text-anchor="middle">The next maximum reads S₂ as well as M₂.</text>
</svg>

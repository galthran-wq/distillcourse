<svg viewBox="0 0 640 345" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .t { fill: currentColor; }
    .head { fill: currentColor; font-weight: 600; font-size: 13px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .s { fill: #e2903a; font-weight: 600; }
    .edge { stroke: currentColor; stroke-width: 1.2; fill: none; opacity: 0.45; }
    .node { fill: currentColor; }
    .guide { stroke: currentColor; opacity: 0.35; stroke-dasharray: 3 3; }
    .avg { fill: none; stroke: #4c8dd6; stroke-width: 2; }
    .avgt { fill: #4c8dd6; font-weight: 600; font-size: 11px; }
    .div { stroke: currentColor; opacity: 0.25; }
    .ok { fill: #5aa46a; font-weight: 600; }
  </style>

  <!-- panel 1: p = 0.5 -->
  <g transform="translate(8,0)">
    <text class="head" x="100" y="22" text-anchor="middle">p = 0.5: the average falls</text>
    <line class="edge" x1="30" y1="152" x2="95" y2="112.7"/>
    <line class="edge" x1="30" y1="152" x2="95" y2="210.9"/>
    <line class="edge" x1="95" y1="112.7" x2="160" y2="59.2"/>
    <line class="edge" x1="95" y1="112.7" x2="160" y2="193.1"/>
    <line class="edge" x1="95" y1="210.9" x2="160" y2="193.1"/>
    <line class="edge" x1="95" y1="210.9" x2="160" y2="237.7"/>
    <circle class="node" cx="30" cy="152" r="3.5"/>
    <circle class="node" cx="95" cy="112.7" r="3.5"/>
    <circle class="node" cx="95" cy="210.9" r="3.5"/>
    <circle class="node" cx="160" cy="59.2" r="3.5"/>
    <circle class="node" cx="160" cy="193.1" r="3.5"/>
    <circle class="node" cx="160" cy="237.7" r="3.5"/>
    <text class="t" x="24" y="156" text-anchor="end">80</text>
    <text class="t" x="95" y="103" text-anchor="middle">109.1</text>
    <text class="t" x="95" y="226" text-anchor="middle">36.4</text>
    <text class="t" x="166" y="63">148.8</text>
    <text class="t" x="166" y="197">49.6</text>
    <text class="t" x="166" y="241">16.5</text>
    <line class="guide" x1="30" y1="152" x2="60" y2="152"/>
    <line class="avg" x1="55" y1="161.8" x2="65" y2="161.8"/>
    <text class="avgt" x="60" y="175" text-anchor="middle">72.7</text>
    <line class="guide" x1="95" y1="112.7" x2="125" y2="112.7"/>
    <line class="avg" x1="120" y1="126.1" x2="130" y2="126.1"/>
    <text class="avgt" x="128" y="139" text-anchor="middle">99.2</text>
    <line class="guide" x1="95" y1="210.9" x2="125" y2="210.9"/>
    <line class="avg" x1="120" y1="215.4" x2="130" y2="215.4"/>
    <text class="avgt" x="128" y="228" text-anchor="middle">33.1</text>
    <text class="muted" x="100" y="270" text-anchor="middle">growth of the average: 1/1.1 = 0.909</text>
    <text class="muted" x="100" y="286" text-anchor="middle">supermartingale</text>
  </g>
  <line class="div" x1="213" y1="30" x2="213" y2="295"/>

  <!-- panel 2: p̃ = 0.6 -->
  <g transform="translate(218,0)">
    <text class="head" x="100" y="22" text-anchor="middle">p̃ = 0.6: the average is level</text>
    <line class="edge" x1="30" y1="152" x2="95" y2="112.7"/>
    <line class="edge" x1="30" y1="152" x2="95" y2="210.9"/>
    <line class="edge" x1="95" y1="112.7" x2="160" y2="59.2"/>
    <line class="edge" x1="95" y1="112.7" x2="160" y2="193.1"/>
    <line class="edge" x1="95" y1="210.9" x2="160" y2="193.1"/>
    <line class="edge" x1="95" y1="210.9" x2="160" y2="237.7"/>
    <circle class="node" cx="30" cy="152" r="3.5"/>
    <circle class="node" cx="95" cy="112.7" r="3.5"/>
    <circle class="node" cx="95" cy="210.9" r="3.5"/>
    <circle class="node" cx="160" cy="59.2" r="3.5"/>
    <circle class="node" cx="160" cy="193.1" r="3.5"/>
    <circle class="node" cx="160" cy="237.7" r="3.5"/>
    <text class="t" x="24" y="156" text-anchor="end">80</text>
    <text class="t" x="95" y="103" text-anchor="middle">109.1</text>
    <text class="t" x="95" y="226" text-anchor="middle">36.4</text>
    <text class="t" x="166" y="63">148.8</text>
    <text class="t" x="166" y="197">49.6</text>
    <text class="t" x="166" y="241">16.5</text>
    <line class="guide" x1="30" y1="152" x2="60" y2="152"/>
    <line class="avg" x1="55" y1="152" x2="65" y2="152"/>
    <text class="ok" x="60" y="167" text-anchor="middle" font-size="11">80.0</text>
    <line class="guide" x1="95" y1="112.7" x2="125" y2="112.7"/>
    <line class="avg" x1="120" y1="112.7" x2="130" y2="112.7"/>
    <text class="ok" x="128" y="127" text-anchor="middle" font-size="11">109.1</text>
    <line class="guide" x1="95" y1="210.9" x2="125" y2="210.9"/>
    <line class="avg" x1="120" y1="210.9" x2="130" y2="210.9"/>
    <text class="ok" x="128" y="225" text-anchor="middle" font-size="11">36.4</text>
    <text class="muted" x="100" y="270" text-anchor="middle">growth of the average: 1.1/1.1 = 1</text>
    <text class="s" x="100" y="286" text-anchor="middle">martingale</text>
  </g>
  <line class="div" x1="423" y1="30" x2="423" y2="295"/>

  <!-- panel 3: p = 0.9 -->
  <g transform="translate(428,0)">
    <text class="head" x="100" y="22" text-anchor="middle">p = 0.9: the average rises</text>
    <line class="edge" x1="30" y1="152" x2="95" y2="112.7"/>
    <line class="edge" x1="30" y1="152" x2="95" y2="210.9"/>
    <line class="edge" x1="95" y1="112.7" x2="160" y2="59.2"/>
    <line class="edge" x1="95" y1="112.7" x2="160" y2="193.1"/>
    <line class="edge" x1="95" y1="210.9" x2="160" y2="193.1"/>
    <line class="edge" x1="95" y1="210.9" x2="160" y2="237.7"/>
    <circle class="node" cx="30" cy="152" r="3.5"/>
    <circle class="node" cx="95" cy="112.7" r="3.5"/>
    <circle class="node" cx="95" cy="210.9" r="3.5"/>
    <circle class="node" cx="160" cy="59.2" r="3.5"/>
    <circle class="node" cx="160" cy="193.1" r="3.5"/>
    <circle class="node" cx="160" cy="237.7" r="3.5"/>
    <text class="t" x="24" y="156" text-anchor="end">80</text>
    <text class="t" x="95" y="103" text-anchor="middle">109.1</text>
    <text class="t" x="95" y="226" text-anchor="middle">36.4</text>
    <text class="t" x="166" y="63">148.8</text>
    <text class="t" x="166" y="197">49.6</text>
    <text class="t" x="166" y="241">16.5</text>
    <line class="guide" x1="30" y1="152" x2="60" y2="152"/>
    <line class="avg" x1="55" y1="122.5" x2="65" y2="122.5"/>
    <text class="avgt" x="60" y="118" text-anchor="middle">101.8</text>
    <line class="guide" x1="95" y1="112.7" x2="125" y2="112.7"/>
    <line class="avg" x1="120" y1="72.6" x2="130" y2="72.6"/>
    <text class="avgt" x="128" y="68" text-anchor="middle">138.8</text>
    <line class="guide" x1="95" y1="210.9" x2="125" y2="210.9"/>
    <line class="avg" x1="120" y1="197.5" x2="130" y2="197.5"/>
    <text class="avgt" x="128" y="193" text-anchor="middle">46.3</text>
    <text class="muted" x="100" y="270" text-anchor="middle">growth of the average: 1.4/1.1 = 1.273</text>
    <text class="muted" x="100" y="286" text-anchor="middle">submartingale</text>
  </g>

  <text class="t" x="16" y="314" font-size="11.5">Discounted 80-stock Sₙ/1.1ⁿ over two periods; blue tick = conditional average of the next value.</text>
  <text class="t" x="16" y="331" font-size="11.5">The table is the same in all three panels; only the weights differ, and only p̃ puts every tick on its node.</text>
</svg>

<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .t { fill: currentColor; }
    .head { fill: currentColor; font-weight: 600; font-size: 12.5px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11.5px; }
    .cur { fill: currentColor; font-size: 14px; }
    .mut { fill: currentColor; opacity: 0.4; font-size: 14px; }
    .curl { fill: #4c8dd6; font-weight: 600; font-size: 11.5px; }
    .mutl { fill: #4c8dd6; opacity: 0.4; font-weight: 600; font-size: 11.5px; }
    .none { display: none; }
    .s { fill: #e2903a; font-weight: 600; }
    .box { fill: none; stroke: currentColor; opacity: 0.3; }
    .num { font-size: 12px; }
  </style>
  <text class="head" x="16" y="24">Node H of the $4 call: X₁ = 5.28, Δ₁ = 0.9, S₁ = 8, 1 + r = 1.25</text>

  <text class="mut" x="16" y="60">Ẽ₁[ X₂ / (1+r)² ]  =  Ẽ₁[ ( Δ₁S₂ + (1+r)(X₁ − Δ₁S₁) ) / (1+r)² ]</text>
  <text class="mutl" x="40" y="80">the wealth equation substituted: shares ride the stock, cash grows at 1 + r</text>

  <text class="mut" x="16" y="120">=  Δ₁ · Ẽ₁[ S₂ / (1+r)² ]  +  (X₁ − Δ₁S₁) / (1+r)</text>
  <text class="mutl" x="40" y="140">linearity; Δ₁, X₁ and S₁ taken out because they are known at time 1; S₂ is not</text>

  <text class="cur" x="16" y="180">=  Δ₁ · S₁ / (1+r)  +  (X₁ − Δ₁S₁) / (1+r)  =  X₁ / (1+r)</text>
  <text class="curl" x="40" y="200">the discounted stock is a P̃-martingale, so Ẽ₁[S₂/(1+r)²] = S₁/(1+r); the Δ₁S₁ terms cancel</text>

  <rect class="box" x="16" y="226" width="608" height="92" rx="6"/>
  <text class="muted" x="28" y="244">the same three lines with the node's numbers</text>
  <text class="mut num" x="28" y="266">X₂ = 12 on HH, 1.20 on HT;  ÷ 1.25² = 1.5625 → 7.68 and 0.768;  ½ · 7.68 + ½ · 0.768 = <tspan class="s">4.224</tspan></text>
  <text class="mut num" x="28" y="288">0.9 × Ẽ₁[S₂/1.5625] + (5.28 − 7.2)/1.25 = 0.9 × 6.4 − 1.536 = 5.76 − 1.536 = <tspan class="s">4.224</tspan></text>
  <text class="cur num" x="28" y="310">0.9 × (8/1.25) − 1.536 = 5.76 − 1.536 = 4.224 = 5.28/1.25 = <tspan class="s">X₁/(1+r)</tspan></text>
</svg>

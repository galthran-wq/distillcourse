<svg viewBox="0 0 640 345" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .t { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11.5px; }
    .s { fill: #e2903a; font-weight: 600; }
    .d { fill: #5aa46a; font-weight: 600; }
    .edge { stroke: currentColor; stroke-width: 1.2; fill: none; opacity: 0.35; }
    .fill { fill: #5aa46a; }
    .rim { fill: none; stroke: #5aa46a; stroke-width: 1.5; }
    .guide { stroke: currentColor; opacity: 0.3; stroke-dasharray: 3 3; }
    .payoff { fill: currentColor; opacity: 0.55; }
  </style>
  <text class="muted" x="70" y="18" text-anchor="middle">time 0</text>
  <text class="muted" x="200" y="18" text-anchor="middle">time 1</text>
  <text class="muted" x="330" y="18" text-anchor="middle">time 2</text>
  <text class="muted" x="460" y="18" text-anchor="middle">time 3</text>
  <line class="guide" x1="70" y1="26" x2="70" y2="322"/>
  <line class="guide" x1="200" y1="26" x2="200" y2="322"/>
  <line class="guide" x1="330" y1="26" x2="330" y2="322"/>
  <line class="guide" x1="460" y1="26" x2="460" y2="322"/>

  <line class="edge" x1="70" y1="170" x2="200" y2="128"/>
  <line class="edge" x1="70" y1="170" x2="200" y2="212"/>
  <line class="edge" x1="200" y1="128" x2="330" y2="86"/>
  <line class="edge" x1="200" y1="128" x2="330" y2="170"/>
  <line class="edge" x1="200" y1="212" x2="330" y2="170"/>
  <line class="edge" x1="200" y1="212" x2="330" y2="254"/>
  <line class="edge" x1="330" y1="86" x2="460" y2="44"/>
  <line class="edge" x1="330" y1="86" x2="460" y2="128"/>
  <line class="edge" x1="330" y1="170" x2="460" y2="128"/>
  <line class="edge" x1="330" y1="170" x2="460" y2="212"/>
  <line class="edge" x1="330" y1="254" x2="460" y2="212"/>
  <line class="edge" x1="330" y1="254" x2="460" y2="296"/>

  <!-- discs: fill opacity = |Δ| -->
  <circle class="rim" cx="70" cy="170" r="11"/><circle class="fill" cx="70" cy="170" r="11" opacity="0.719"/>
  <circle class="rim" cx="200" cy="128" r="11"/><circle class="fill" cx="200" cy="128" r="11" opacity="0.848"/>
  <circle class="rim" cx="200" cy="212" r="11"/><circle class="fill" cx="200" cy="212" r="11" opacity="0.136"/>
  <circle class="rim" cx="330" cy="86" r="11"/><circle class="fill" cx="330" cy="86" r="11" opacity="1"/>
  <circle class="rim" cx="330" cy="170" r="11"/><circle class="fill" cx="330" cy="170" r="11" opacity="0.167"/>
  <circle class="rim" cx="330" cy="254" r="11"/><circle class="fill" cx="330" cy="254" r="11" opacity="0"/>

  <text class="s" x="70" y="152" text-anchor="middle">80</text>
  <text class="d" x="70" y="194" text-anchor="middle">Δ₀ = 0.719</text>
  <text class="s" x="200" y="110" text-anchor="middle">120</text>
  <text class="d" x="200" y="152" text-anchor="middle">0.848</text>
  <text class="s" x="200" y="194" text-anchor="middle">40</text>
  <text class="d" x="200" y="236" text-anchor="middle">0.136</text>
  <text class="s" x="330" y="68" text-anchor="middle">180</text>
  <text class="d" x="330" y="110" text-anchor="middle">1.000</text>
  <text class="s" x="330" y="152" text-anchor="middle">60</text>
  <text class="d" x="330" y="194" text-anchor="middle">0.167</text>
  <text class="s" x="330" y="236" text-anchor="middle">20</text>
  <text class="d" x="330" y="278" text-anchor="middle">0.000</text>

  <text class="s" x="472" y="40">270</text><text class="payoff" x="472" y="56">pays 190</text>
  <text class="s" x="472" y="124">90</text><text class="payoff" x="472" y="140">pays 10</text>
  <text class="s" x="472" y="208">30</text><text class="payoff" x="472" y="224">pays 0</text>
  <text class="s" x="472" y="292">10</text><text class="payoff" x="472" y="308">pays 0</text>

  <text class="muted" x="20" y="60">Δ = 1.000 at 180: in the money on both</text>
  <text class="muted" x="20" y="75">branches, so the hedge holds a full share</text>
  <text class="muted" x="20" y="280">Δ = 0 at 20: worthless on both branches,</text>
  <text class="muted" x="20" y="295">so the hedge holds nothing</text>
  <text class="t" x="20" y="338">Δₙ = (Vₙ₊₁(H) − Vₙ₊₁(T)) / (Sₙ₊₁(H) − Sₙ₊₁(T)) at each node; disc shading = Δ.</text>
</svg>

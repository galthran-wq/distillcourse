<svg viewBox="0 0 640 246" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .t { fill: currentColor; }
    .h { fill: currentColor; font-weight: 600; font-size: 12px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11.5px; }
    .s { fill: #e2903a; font-weight: 600; }
    .d { fill: #5aa46a; font-weight: 600; }
    .v { fill: #4c8dd6; font-weight: 600; }
    .shade { fill: #4c8dd6; opacity: 0.10; }
    .rule { stroke: currentColor; opacity: 0.35; }
  </style>
  <text class="muted" x="20" y="18">path H, H, T on the 80-stock: the hedge rebalanced at every node, started with 34.08 and nothing added</text>
  <!-- shaded twin columns -->
  <rect class="shade" x="428" y="28" width="96" height="176" rx="4"/>
  <rect class="shade" x="528" y="28" width="96" height="176" rx="4"/>
  <!-- header -->
  <text class="h" x="30" y="46">time</text>
  <text class="h" x="80" y="46">toss</text>
  <text class="h" x="140" y="46">stock Sₙ</text>
  <text class="h" x="232" y="46">Δₙ held</text>
  <text class="h" x="322" y="46">money market</text>
  <text class="h" x="440" y="46">portfolio Xₙ</text>
  <text class="h" x="540" y="46">claim Vₙ</text>
  <line class="rule" x1="20" y1="54" x2="624" y2="54"/>
  <!-- rows -->
  <text class="t" x="34" y="80">0</text><text class="muted" x="80" y="80">–</text><text class="s" x="150" y="80">80</text><text class="d" x="250" y="80">0.719</text><text class="t" x="340" y="80">−23.44</text><text class="v" x="455" y="80">34.08</text><text class="v" x="555" y="80">34.08</text>
  <text class="t" x="34" y="112">1</text><text class="t" x="80" y="112">H</text><text class="s" x="150" y="112">120</text><text class="d" x="250" y="112">0.848</text><text class="t" x="340" y="112">−41.32</text><text class="v" x="455" y="112">60.50</text><text class="v" x="555" y="112">60.50</text>
  <text class="t" x="34" y="144">2</text><text class="t" x="80" y="144">H</text><text class="s" x="150" y="144">180</text><text class="d" x="250" y="144">1.000</text><text class="t" x="340" y="144">−72.73</text><text class="v" x="455" y="144">107.27</text><text class="v" x="555" y="144">107.27</text>
  <text class="t" x="34" y="176">3</text><text class="t" x="80" y="176">T</text><text class="s" x="150" y="176">90</text><text class="muted" x="250" y="176">settle</text><text class="t" x="340" y="176">−80.00</text><text class="v" x="455" y="176">10.00</text><text class="v" x="555" y="176">10.00</text>
  <line class="rule" x1="20" y1="190" x2="624" y2="190"/>
  <text class="muted" x="20" y="214">money market = Xₙ − Δₙ Sₙ after rebalancing; at time 3 it is the last loan plus one period's interest.</text>
  <text class="muted" x="20" y="232">V₃ = (90 − 80)⁺ = 10. The two shaded columns agree at every date.</text>
</svg>

<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .t { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11.5px; }
    .s { fill: #e2903a; font-weight: 600; }
    .c { fill: #4c8dd6; font-weight: 600; }
    .edge { stroke: currentColor; stroke-width: 1.4; fill: none; opacity: 0.6; }
    .edge-h { stroke: #e2903a; stroke-width: 2; fill: none; }
    .node { fill: currentColor; }
    .node-h { fill: #e2903a; }
    .box { fill: none; stroke: currentColor; opacity: 0.4; rx: 4; }
    .one { fill: none; stroke: #5aa46a; stroke-width: 1.5; rx: 4; }
    .g { fill: #5aa46a; font-weight: 600; }
  </style>
  <text class="muted" x="20" y="22">the induction step at one node: assume Xₙ = Vₙ; show Xₙ₊₁ = Vₙ₊₁ on the heads branch (tails is the mirror)</text>

  <!-- the node and its two branches -->
  <line class="edge-h" x1="60" y1="150" x2="170" y2="90"/>
  <line class="edge" x1="60" y1="150" x2="170" y2="210"/>
  <circle class="node" cx="60" cy="150" r="5"/>
  <circle class="node-h" cx="170" cy="90" r="4"/>
  <circle class="node" cx="170" cy="210" r="4"/>
  <text class="t" x="60" y="132" text-anchor="middle" font-weight="600">Xₙ = Vₙ</text>
  <text class="s" x="170" y="78" text-anchor="middle" font-size="12">H: uSₙ</text>
  <text class="muted" x="170" y="230" text-anchor="middle">T: dSₙ</text>
  <text class="muted" x="96" y="100" text-anchor="middle">toss ωₙ₊₁</text>
  <text class="muted" x="20" y="252">at the node: Xₙ = Vₙ (hypothesis),</text>
  <text class="muted" x="20" y="266">Δₙ shares held at Sₙ, the rest at 1 + r</text>

  <!-- the algebra on the heads branch -->
  <rect class="box" x="212" y="52" width="416" height="196"/>
  <text class="muted" x="222" y="70">wealth equation on heads, rearranged:</text>
  <text class="t" x="222" y="90">Xₙ₊₁(H) = <tspan class="c">(1 + r) Xₙ</tspan> + <tspan class="s">Δₙ Sₙ (u − 1 − r)</tspan></text>

  <text class="muted" x="222" y="116">Δₙ is the slope, so the share term is</text>
  <text class="t" x="222" y="136"><tspan class="s">Δₙ Sₙ (u − 1 − r)</tspan> = <tspan class="s">q̃</tspan> [Vₙ₊₁(H) − Vₙ₊₁(T)]</text>

  <text class="muted" x="222" y="162">Xₙ = Vₙ, and the recursion read backwards:</text>
  <text class="t" x="222" y="182"><tspan class="c">(1 + r) Xₙ</tspan> = <tspan class="c">p̃</tspan> Vₙ₊₁(H) + <tspan class="c">q̃</tspan> Vₙ₊₁(T)</text>

  <text class="muted" x="222" y="208">adding the two lines, the Vₙ₊₁(T) terms cancel:</text>
  <text class="t" x="222" y="230">Xₙ₊₁(H) = (<tspan class="c">p̃</tspan> + <tspan class="s">q̃</tspan>) Vₙ₊₁(H) + (<tspan class="c">q̃</tspan> − <tspan class="s">q̃</tspan>) Vₙ₊₁(T) = Vₙ₊₁(H)</text>
  <rect class="one" x="281" y="216" width="70" height="20"/>
  <text class="g" x="622" y="266" text-anchor="end" font-size="12">p̃ + q̃ = 1: the coefficient collapses to one</text>

  <text class="muted" x="20" y="296">Tails: Δₙ Sₙ (d − 1 − r) = −p̃ [Vₙ₊₁(H) − Vₙ₊₁(T)], and the same two lines add to (p̃ + q̃) Vₙ₊₁(T) = Vₙ₊₁(T).</text>
  <text class="muted" x="20" y="312">The node's position in the tree never entered: the step is the one-period replication, run once per node.</text>
</svg>

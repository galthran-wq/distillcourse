<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .t { fill: currentColor; }
    .head { fill: currentColor; font-weight: 600; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11.5px; }
    .s { fill: #e2903a; font-weight: 600; }
    .v { fill: #4c8dd6; font-weight: 600; }
    .edge { stroke: #e2903a; stroke-width: 1.6; fill: none; opacity: 0.85; }
    .node { fill: #e2903a; }
    .ring { fill: none; stroke: #4c8dd6; stroke-width: 2; }
    .div { stroke: currentColor; opacity: 0.3; stroke-dasharray: 3 3; }
  </style>
  <text class="head" x="16" y="24">Call: the two paths to S₂ = 4 merge</text>
  <text class="head" x="332" y="24">Lookback: the same two paths do not</text>
  <line class="div" x1="318" y1="10" x2="318" y2="290"/>

  <!-- left tree: x 40, 130, 220; y = 150 + (n-2k)*45 -->
  <line class="edge" x1="30" y1="150" x2="115" y2="105"/>
  <line class="edge" x1="30" y1="150" x2="115" y2="195"/>
  <line class="edge" x1="115" y1="105" x2="200" y2="60"/>
  <line class="edge" x1="115" y1="105" x2="200" y2="150"/>
  <line class="edge" x1="115" y1="195" x2="200" y2="150"/>
  <line class="edge" x1="115" y1="195" x2="200" y2="240"/>
  <circle class="node" cx="30" cy="150" r="4"/>
  <circle class="node" cx="115" cy="105" r="4"/>
  <circle class="node" cx="115" cy="195" r="4"/>
  <circle class="node" cx="200" cy="60" r="4"/>
  <circle class="node" cx="200" cy="150" r="4"/>
  <circle class="ring" cx="200" cy="150" r="9"/>
  <circle class="node" cx="200" cy="240" r="4"/>
  <text class="s" x="18" y="154" text-anchor="end">4</text>
  <text class="s" x="115" y="95" text-anchor="middle">8</text>
  <text class="s" x="115" y="213" text-anchor="middle">2</text>
  <text class="s" x="212" y="56">16</text>
  <text class="v" x="212" y="72">V₂ = 12</text>
  <text class="s" x="216" y="146">4 (HT or TH)</text>
  <text class="v" x="216" y="162">V₂ = 1.20 both</text>
  <text class="s" x="212" y="244">1</text>
  <text class="v" x="212" y="260">V₂ = 0</text>
  <text class="muted" x="70" y="118">H</text>
  <text class="muted" x="70" y="192">T</text>
  <text class="t" x="16" y="285">3 nodes carry all 4 paths: one value per price.</text>

  <!-- right tree: x 356, 446, 536 -->
  <line class="edge" x1="346" y1="150" x2="430" y2="105"/>
  <line class="edge" x1="346" y1="150" x2="430" y2="195"/>
  <line class="edge" x1="430" y1="105" x2="514" y2="60"/>
  <line class="edge" x1="430" y1="105" x2="514" y2="130"/>
  <line class="edge" x1="430" y1="195" x2="514" y2="170"/>
  <line class="edge" x1="430" y1="195" x2="514" y2="240"/>
  <circle class="node" cx="346" cy="150" r="4"/>
  <circle class="node" cx="430" cy="105" r="4"/>
  <circle class="node" cx="430" cy="195" r="4"/>
  <circle class="node" cx="514" cy="60" r="4"/>
  <circle class="node" cx="514" cy="130" r="4"/>
  <circle class="ring" cx="514" cy="130" r="9"/>
  <circle class="node" cx="514" cy="170" r="4"/>
  <circle class="ring" cx="514" cy="170" r="9"/>
  <circle class="node" cx="514" cy="240" r="4"/>
  <text class="s" x="334" y="154" text-anchor="end">4</text>
  <text class="s" x="430" y="95" text-anchor="middle">8</text>
  <text class="s" x="430" y="213" text-anchor="middle">2</text>
  <text class="s" x="526" y="56">16, max 16</text>
  <text class="v" x="526" y="72">V₂ = 3.20</text>
  <text class="s" x="528" y="118">4, max 8, HT</text>
  <text class="v" x="528" y="134">V₂ = 2.40</text>
  <text class="s" x="528" y="180">4, max 4, TH</text>
  <text class="v" x="528" y="196">V₂ = 0.80</text>
  <text class="s" x="526" y="244">1, max 4</text>
  <text class="v" x="526" y="260">V₂ = 2.20</text>
  <text class="t" x="332" y="285">Same price, different maximum: 4 nodes.</text>
</svg>

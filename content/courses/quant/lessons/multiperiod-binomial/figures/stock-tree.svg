<svg viewBox="0 0 640 345" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .t { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11.5px; }
    .s { fill: #e2903a; font-weight: 600; }
    .edge { stroke: #e2903a; stroke-width: 1.6; fill: none; opacity: 0.85; }
    .node { fill: #e2903a; }
    .guide { stroke: currentColor; opacity: 0.3; stroke-dasharray: 3 3; }
  </style>
  <text class="muted" x="70" y="18" text-anchor="middle">time 0</text>
  <text class="muted" x="200" y="18" text-anchor="middle">time 1</text>
  <text class="muted" x="330" y="18" text-anchor="middle">time 2</text>
  <text class="muted" x="460" y="18" text-anchor="middle">time 3</text>
  <line class="guide" x1="70" y1="26" x2="70" y2="325"/>
  <line class="guide" x1="200" y1="26" x2="200" y2="325"/>
  <line class="guide" x1="330" y1="26" x2="330" y2="325"/>
  <line class="guide" x1="460" y1="26" x2="460" y2="325"/>

  <!-- edges: y = 170 + (n - 2k)*42 -->
  <line class="edge" x1="70" y1="170" x2="200" y2="128"/>
  <line class="edge" x1="70" y1="170" x2="200" y2="212"/>
  <line class="edge" x1="200" y1="128" x2="330" y2="86"/>
  <line class="edge" x1="200" y1="128" x2="330" y2="170"/>
  <line class="edge" x1="200" y1="212" x2="330" y2="170"/>
  <line class="edge" x1="200" y1="212" x2="330" y2="254"/>
  <line class="edge" x1="330" y1="86" x2="460" y2="44"/>
  <line class="edge" x1="330" y1="86" x2="460" y2="128"/>
  <line class="edge" x1="330" y1="170" x2="460" y2="128"/>
  <line class="edge" x1="330" y1="170" x2="460" y2="212"/>
  <line class="edge" x1="330" y1="254" x2="460" y2="212"/>
  <line class="edge" x1="330" y1="254" x2="460" y2="296"/>

  <circle class="node" cx="70" cy="170" r="4"/>
  <circle class="node" cx="200" cy="128" r="4"/>
  <circle class="node" cx="200" cy="212" r="4"/>
  <circle class="node" cx="330" cy="86" r="4"/>
  <circle class="node" cx="330" cy="170" r="4"/>
  <circle class="node" cx="330" cy="254" r="4"/>
  <circle class="node" cx="460" cy="44" r="4"/>
  <circle class="node" cx="460" cy="128" r="4"/>
  <circle class="node" cx="460" cy="212" r="4"/>
  <circle class="node" cx="460" cy="296" r="4"/>

  <text class="s" x="58" y="174" text-anchor="end">S₀ = 4</text>
  <text class="s" x="200" y="118" text-anchor="middle">8</text>
  <text class="s" x="200" y="230" text-anchor="middle">2</text>
  <text class="s" x="330" y="76" text-anchor="middle">16</text>
  <text class="s" x="330" y="160" text-anchor="middle">4</text>
  <text class="s" x="330" y="272" text-anchor="middle">1</text>
  <text class="s" x="472" y="48">32</text>
  <text class="s" x="472" y="132">8</text>
  <text class="s" x="472" y="216">2</text>
  <text class="s" x="472" y="300">0.50</text>

  <text class="muted" x="125" y="140" text-anchor="middle">H: × 2</text>
  <text class="muted" x="125" y="204" text-anchor="middle">T: × ½</text>
  <text class="muted" x="330" y="186" text-anchor="middle">HT and TH</text>

  <text class="muted" x="500" y="48">HHH</text>
  <text class="muted" x="500" y="132">HHT, HTH, THH</text>
  <text class="muted" x="500" y="216">HTT, THT, TTH</text>
  <text class="muted" x="512" y="300">TTT</text>

  <text class="t" x="70" y="338">2³ = 8 toss sequences, 4 prices at time 3; cash grows by 1.25 each period.</text>
</svg>

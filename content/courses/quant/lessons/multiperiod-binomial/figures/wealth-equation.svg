<svg viewBox="0 0 640 310" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .t { fill: currentColor; }
    .big { fill: currentColor; font-size: 19px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11.5px; }
    .s { fill: #e2903a; font-weight: 600; }
    .c { fill: #4c8dd6; font-weight: 600; }
    .brace-s { stroke: #e2903a; stroke-width: 1.5; fill: none; }
    .brace-c { stroke: #4c8dd6; stroke-width: 1.5; fill: none; }
    .edge { stroke: #e2903a; stroke-width: 1.6; fill: none; }
    .node { fill: #e2903a; }
    .box { fill: none; stroke: currentColor; opacity: 0.4; rx: 4; }
  </style>
  <text class="muted" x="20" y="22">the wealth equation: what Xₙ becomes one period later, with no money added or withdrawn</text>
  <text class="big" x="20" y="60">Xₙ₊₁ = <tspan class="s">Δₙ Sₙ₊₁</tspan> + <tspan class="c">(1 + r)(Xₙ − Δₙ Sₙ)</tspan></text>
  <path class="brace-s" d="M 92 68 v 6 h 78 v -6"/>
  <path class="brace-c" d="M 188 68 v 6 h 222 v -6"/>
  <text class="s" x="24" y="96" font-size="12">Δₙ shares ride the stock</text>
  <text class="muted" x="24" y="110">Δₙ fixed at time n, before the toss</text>
  <text class="c" x="250" y="96" font-size="12">the rest sits in the money market and grows by 1 + r</text>
  <text class="muted" x="250" y="110">negative when the shares cost more than Xₙ: a loan</text>

  <text class="t" x="20" y="146" font-weight="600">One node of the running market: time 1 after heads, hedging the strike-5 call</text>
  <rect class="box" x="20" y="158" width="234" height="92"/>
  <text class="t" x="30" y="176">X₁ = 4.40, S₁ = 8, Δ₁ = 11/12</text>
  <text class="s" x="30" y="198">shares: 11/12 × 8 = 7.33</text>
  <text class="c" x="30" y="218">money market: 4.40 − 7.33 = −2.93</text>
  <text class="muted" x="30" y="238">borrowed; owes 2.93 × 1.25 = 3.67</text>

  <line class="edge" x1="262" y1="204" x2="350" y2="172"/>
  <line class="edge" x1="262" y1="204" x2="350" y2="236"/>
  <circle class="node" cx="262" cy="204" r="4"/>
  <circle class="node" cx="350" cy="172" r="4"/>
  <circle class="node" cx="350" cy="236" r="4"/>
  <text class="muted" x="306" y="176" text-anchor="middle">H: S₂ = 16</text>
  <text class="muted" x="306" y="238" text-anchor="middle">T: S₂ = 4</text>
  <text class="t" x="362" y="168" font-size="12">X₂(HH) = <tspan class="s">11/12 × 16</tspan> − <tspan class="c">3.67</tspan> = 14.67 − 3.67</text>
  <text class="t" x="362" y="184" font-size="12">= 11 = (16 − 5)⁺</text>
  <text class="t" x="362" y="232" font-size="12">X₂(HT) = <tspan class="s">11/12 × 4</tspan> − <tspan class="c">3.67</tspan> = 3.67 − 3.67</text>
  <text class="t" x="362" y="248" font-size="12">= 0 = (4 − 5)⁺</text>
  <text class="muted" x="20" y="280">Applied once per period. Between applications the only decision is the next Δ;</text>
  <text class="muted" x="20" y="296">rebalancing is paid for out of Xₙ itself, so the money market line absorbs every share bought or sold.</text>
</svg>

<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .t { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .head { font-weight: 600; }
    .hi { fill: #e2903a; font-weight: 600; }
    .lo { fill: #4c8dd6; font-weight: 600; }
    .box { fill: none; stroke: currentColor; opacity: 0.35; }
    .rule { stroke: currentColor; opacity: 0.35; stroke-dasharray: 3 3; }
  </style>
  <text class="t" x="320" y="20" text-anchor="middle">the $4 stock goes to 8 or 2; cash grows by 1.25; the call (K = 5) pays 3 or 0; its replication cost is 1.20</text>

  <!-- left: quote too high -->
  <text class="hi" x="165" y="46" text-anchor="middle">quote 1.50: sell the call, run the hedge</text>
  <rect class="box" x="20" y="58" width="290" height="180" rx="6"/>
  <text class="muted" x="185" y="78" text-anchor="middle">now</text>
  <text class="muted" x="238" y="78" text-anchor="middle">heads</text>
  <text class="muted" x="290" y="78" text-anchor="middle">tails</text>
  <text class="t" x="32" y="102">sell 1 call at 1.50</text>
  <text class="t" x="185" y="102" text-anchor="middle">+1.50</text>
  <text class="t" x="238" y="102" text-anchor="middle">−3</text>
  <text class="t" x="290" y="102" text-anchor="middle">0</text>
  <text class="t" x="32" y="126">buy ½ share at 4</text>
  <text class="t" x="185" y="126" text-anchor="middle">−2.00</text>
  <text class="t" x="238" y="126" text-anchor="middle">+4</text>
  <text class="t" x="290" y="126" text-anchor="middle">+1</text>
  <text class="t" x="32" y="150">borrow 0.80</text>
  <text class="t" x="185" y="150" text-anchor="middle">+0.80</text>
  <text class="t" x="238" y="150" text-anchor="middle">−1</text>
  <text class="t" x="290" y="150" text-anchor="middle">−1</text>
  <text class="t" x="32" y="174">deposit excess 0.30</text>
  <text class="t" x="185" y="174" text-anchor="middle">−0.30</text>
  <text class="t" x="238" y="174" text-anchor="middle">+0.375</text>
  <text class="t" x="290" y="174" text-anchor="middle">+0.375</text>
  <line class="rule" x1="32" y1="188" x2="298" y2="188"/>
  <text class="t head" x="32" y="210">net</text>
  <text class="t head" x="185" y="210" text-anchor="middle">0</text>
  <text class="hi" x="238" y="210" text-anchor="middle">+0.375</text>
  <text class="hi" x="290" y="210" text-anchor="middle">+0.375</text>
  <text class="muted" x="165" y="230" text-anchor="middle">(1.50 − 1.20) × 1.25 in both states</text>

  <!-- right: quote too low -->
  <text class="lo" x="475" y="46" text-anchor="middle">quote 1.00: buy the call, hedge in reverse</text>
  <rect class="box" x="330" y="58" width="290" height="180" rx="6"/>
  <text class="muted" x="495" y="78" text-anchor="middle">now</text>
  <text class="muted" x="548" y="78" text-anchor="middle">heads</text>
  <text class="muted" x="600" y="78" text-anchor="middle">tails</text>
  <text class="t" x="342" y="102">buy 1 call at 1.00</text>
  <text class="t" x="495" y="102" text-anchor="middle">−1.00</text>
  <text class="t" x="548" y="102" text-anchor="middle">+3</text>
  <text class="t" x="600" y="102" text-anchor="middle">0</text>
  <text class="t" x="342" y="126">short ½ share at 4</text>
  <text class="t" x="495" y="126" text-anchor="middle">+2.00</text>
  <text class="t" x="548" y="126" text-anchor="middle">−4</text>
  <text class="t" x="600" y="126" text-anchor="middle">−1</text>
  <text class="t" x="342" y="150">deposit 0.80</text>
  <text class="t" x="495" y="150" text-anchor="middle">−0.80</text>
  <text class="t" x="548" y="150" text-anchor="middle">+1</text>
  <text class="t" x="600" y="150" text-anchor="middle">+1</text>
  <text class="t" x="342" y="174">deposit excess 0.20</text>
  <text class="t" x="495" y="174" text-anchor="middle">−0.20</text>
  <text class="t" x="548" y="174" text-anchor="middle">+0.25</text>
  <text class="t" x="600" y="174" text-anchor="middle">+0.25</text>
  <line class="rule" x1="342" y1="188" x2="608" y2="188"/>
  <text class="t head" x="342" y="210">net</text>
  <text class="t head" x="495" y="210" text-anchor="middle">0</text>
  <text class="lo" x="548" y="210" text-anchor="middle">+0.25</text>
  <text class="lo" x="600" y="210" text-anchor="middle">+0.25</text>
  <text class="muted" x="475" y="230" text-anchor="middle">(1.20 − 1.00) × 1.25 in both states</text>

  <text class="t" x="320" y="270" text-anchor="middle">in each trade the stock rows and the call row cancel to zero in both states;</text>
  <text class="t" x="320" y="288" text-anchor="middle">what remains is the gap between the quote and 1.20, with one period's interest</text>
  <text class="muted" x="320" y="312" text-anchor="middle">at a quote of 1.20 the excess deposit is 0 and the seller who hedges nets exactly 0 in both states</text>
</svg>

<svg viewBox="0 0 640 250" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .t { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .s { fill: #e2903a; font-weight: 600; }
    .v { fill: #4c8dd6; font-weight: 600; }
    .edge { stroke: #e2903a; stroke-width: 2; fill: none; }
    .cash { stroke: currentColor; opacity: 0.6; stroke-width: 1.5; fill: none; }
    .node { fill: #e2903a; }
    .guide { stroke: currentColor; opacity: 0.35; stroke-dasharray: 3 3; }
  </style>
  <text class="muted" x="110" y="22" text-anchor="middle">time 0</text>
  <text class="muted" x="330" y="22" text-anchor="middle">time 1</text>
  <line class="guide" x1="110" y1="30" x2="110" y2="245"/>
  <line class="guide" x1="330" y1="30" x2="330" y2="245"/>

  <!-- stock branch -->
  <line class="edge" x1="114" y1="118" x2="326" y2="62"/>
  <line class="edge" x1="114" y1="122" x2="326" y2="178"/>
  <circle class="node" cx="110" cy="120" r="4"/>
  <circle class="node" cx="330" cy="60" r="4"/>
  <circle class="node" cx="330" cy="180" r="4"/>
  <text class="s" x="98" y="124" text-anchor="end">S₀ = 4</text>
  <text class="s" x="342" y="64">S₁(H) = uS₀ = 8</text>
  <text class="s" x="342" y="184">S₁(T) = dS₀ = 2</text>
  <text class="muted" x="205" y="76" text-anchor="middle">heads: × u = × 2</text>
  <text class="muted" x="205" y="166" text-anchor="middle">tails: × d = × ½</text>
  <text class="muted" x="220" y="205" text-anchor="middle">P(H) = p, P(T) = q = 1 − p, both positive, otherwise unspecified</text>

  <!-- claim -->
  <text class="v" x="490" y="40">call, strike K = 5</text>
  <text class="v" x="490" y="64">V₁(H) = (8 − 5)⁺ = 3</text>
  <text class="v" x="490" y="184">V₁(T) = (2 − 5)⁺ = 0</text>

  <!-- money market -->
  <line class="cash" x1="114" y1="234" x2="326" y2="234"/>
  <text class="t" x="98" y="238" text-anchor="end">cash 1</text>
  <text class="t" x="342" y="238">1 + r = 1.25 in both states</text>
</svg>

<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .t { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .head { font-weight: 600; }
    .shares { fill: #e2903a; }
    .loan { fill: currentColor; opacity: 0.35; }
    .calls { fill: #4c8dd6; }
    .zero { stroke: currentColor; opacity: 0.6; }
    .tick { stroke: #4c8dd6; stroke-width: 2.5; }
  </style>
  <!-- dollars at 0.6 px per unit; zero line at y = 210, so y(v) = 210 − 0.6 v -->
  <text class="t" x="320" y="22" text-anchor="middle">write 3 calls, buy 2 shares, borrow 40: the position nets to zero in both states, so it must net to zero now</text>

  <line class="zero" x1="40" y1="210" x2="620" y2="210"/>
  <text class="muted" x="34" y="214" text-anchor="end">0</text>

  <!-- column: now -->
  <text class="t head" x="130" y="48" text-anchor="middle">now</text>
  <text class="t" x="130" y="66" text-anchor="middle">net 0 ⇒ 3C − 100 + 40 = 0, C = 20</text>
  <rect class="shares" x="68" y="210" width="36" height="60" rx="3"/>
  <text class="t" x="86" y="286" text-anchor="middle">−100</text>
  <text class="muted" x="86" y="300" text-anchor="middle">2 shares</text>
  <rect class="loan" x="112" y="246" width="36" height="24" rx="3"/>
  <text class="t" x="130" y="286" text-anchor="middle">+40</text>
  <text class="muted" x="130" y="300" text-anchor="middle">loan</text>
  <rect class="calls" x="156" y="210" width="36" height="36" rx="3"/>
  <text class="t" x="174" y="286" text-anchor="middle">+60</text>
  <text class="muted" x="174" y="300" text-anchor="middle">3 calls</text>

  <!-- column: S* = 25 -->
  <text class="t head" x="335" y="48" text-anchor="middle">S* = 25</text>
  <text class="t" x="335" y="66" text-anchor="middle">net 50 − 50 + 0 = 0</text>
  <rect class="shares" x="273" y="180" width="36" height="30" rx="3"/>
  <text class="t" x="291" y="172" text-anchor="middle">+50</text>
  <text class="muted" x="291" y="228" text-anchor="middle">2 shares</text>
  <rect class="loan" x="317" y="180" width="36" height="30" rx="3"/>
  <text class="t" x="335" y="172" text-anchor="middle">−50</text>
  <text class="muted" x="335" y="228" text-anchor="middle">loan</text>
  <line class="tick" x1="361" y1="210" x2="397" y2="210"/>
  <text class="t" x="379" y="200" text-anchor="middle">0</text>
  <text class="muted" x="379" y="228" text-anchor="middle">3 calls</text>

  <!-- column: S* = 100 -->
  <text class="t head" x="540" y="48" text-anchor="middle">S* = 100</text>
  <text class="t" x="540" y="66" text-anchor="middle">net 200 − 50 − 150 = 0</text>
  <rect class="shares" x="478" y="90" width="36" height="120" rx="3"/>
  <text class="t" x="496" y="82" text-anchor="middle">+200</text>
  <text class="muted" x="496" y="228" text-anchor="middle">2 shares</text>
  <rect class="loan" x="522" y="90" width="36" height="30" rx="3"/>
  <text class="t" x="540" y="82" text-anchor="middle">−50</text>
  <text class="muted" x="540" y="228" text-anchor="middle">loan</text>
  <rect class="calls" x="566" y="120" width="36" height="90" rx="3"/>
  <text class="t" x="584" y="112" text-anchor="middle">−150</text>
  <text class="muted" x="584" y="228" text-anchor="middle">3 calls</text>

  <text class="t" x="320" y="322" text-anchor="middle">the loan repays the two shares' worst-state value, 50, in both states;</text>
  <text class="muted" x="320" y="336" text-anchor="middle">what the shares are worth above 50 in the up state, 150, is exactly what the three calls pay out</text>
</svg>

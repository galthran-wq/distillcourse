<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .t { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .call { fill: #e2903a; font-weight: 600; }
    .put { fill: #4c8dd6; font-weight: 600; }
    .axis { stroke: currentColor; opacity: 0.6; fill: none; }
    .guide { stroke: currentColor; opacity: 0.4; stroke-dasharray: 3 3; fill: none; }
    .lcall { stroke: #e2903a; stroke-width: 2.5; fill: none; }
    .lput { stroke: #4c8dd6; stroke-width: 2.5; fill: none; }
    .lfwd { stroke: currentColor; stroke-width: 2; opacity: 0.75; fill: none; }
    .lbond { stroke: currentColor; stroke-width: 2; opacity: 0.75; stroke-dasharray: 6 4; fill: none; }
  </style>
  <!-- plot: S1 from 0 to 10 over x 70..470 (40 px/unit); V1 from -4 to 4 over y 290..50 (30 px/unit); V1 = 0 at y = 170 -->
  <text class="t" x="320" y="22" text-anchor="middle">claim payoff V₁ against stock payoff S₁, on the running market's two stock values</text>

  <line class="axis" x1="70" y1="50" x2="70" y2="300"/>
  <line class="axis" x1="70" y1="300" x2="470" y2="300"/>
  <line class="guide" x1="70" y1="170" x2="396" y2="170"/>
  <text class="muted" x="62" y="174" text-anchor="end">V₁ = 0</text>
  <text class="muted" x="62" y="84" text-anchor="end">3</text>
  <text class="muted" x="62" y="144" text-anchor="end">1</text>
  <text class="muted" x="62" y="264" text-anchor="end">−3</text>
  <text class="muted" x="62" y="54" text-anchor="end">V₁</text>
  <text class="muted" x="470" y="316" text-anchor="end">S₁</text>

  <!-- the two stock values -->
  <line class="guide" x1="150" y1="50" x2="150" y2="300"/>
  <line class="guide" x1="390" y1="50" x2="390" y2="300"/>
  <text class="t" x="150" y="316" text-anchor="middle">S₁(T) = 2</text>
  <text class="t" x="390" y="316" text-anchor="middle">S₁(H) = 8</text>

  <!-- forward, k = 5: (2, -3) to (8, 3), slope 1 -->
  <line class="lfwd" x1="150" y1="260" x2="390" y2="80"/>
  <circle cx="150" cy="260" r="4" fill="currentColor" opacity="0.75"/>
  <text class="t" x="162" y="278">forward, k = 5: Δ₀ = 6/6 = 1</text>

  <!-- bond paying 1: (2, 1) to (8, 1), slope 0 -->
  <line class="lbond" x1="150" y1="140" x2="390" y2="140"/>
  <circle cx="150" cy="140" r="4" fill="currentColor" opacity="0.75"/>
  <circle cx="390" cy="140" r="4" fill="currentColor" opacity="0.75"/>
  <text class="t" x="402" y="144">bond paying 1: Δ₀ = 0</text>

  <!-- put, K = 5: (2, 3) to (8, 0), slope -1/2 -->
  <line class="lput" x1="150" y1="80" x2="390" y2="170"/>
  <circle cx="150" cy="80" r="4" fill="#4c8dd6"/>
  <circle cx="390" cy="170" r="4" fill="#4c8dd6"/>
  <text class="put" x="402" y="178">put, K = 5: Δ₀ = −3/6 = −½</text>
  <text class="muted" x="402" y="192">(the hedge sells short)</text>

  <!-- call, K = 5: (2, 0) to (8, 3), slope 1/2 -->
  <line class="lcall" x1="150" y1="170" x2="390" y2="80"/>
  <circle cx="150" cy="170" r="4" fill="#e2903a"/>
  <circle cx="390" cy="80" r="4" fill="#e2903a"/>
  <text class="call" x="402" y="76">call, K = 5: Δ₀ = 3/6 = ½</text>
  <line class="guide" x1="390" y1="170" x2="390" y2="80"/>
  <text class="muted" x="382" y="128" text-anchor="end">rise 3</text>
  <text class="muted" x="210" y="186" text-anchor="middle">run 6</text>

</svg>

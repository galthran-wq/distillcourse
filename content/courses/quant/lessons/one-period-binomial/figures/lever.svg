<svg viewBox="0 0 640 210" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .t { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .head { font-weight: 600; }
    .r { fill: #e2903a; font-weight: 600; }
    .axis { stroke: currentColor; opacity: 0.6; stroke-width: 1.5; }
    .tick { stroke: currentColor; opacity: 0.6; }
    .brace { stroke: #4c8dd6; stroke-width: 2; fill: none; }
    .bracelbl { fill: #4c8dd6; font-weight: 600; }
    .rmark { stroke: #e2903a; stroke-width: 2.5; }
    .warn { fill: currentColor; opacity: 0.55; font-size: 11px; }
  </style>
  <!-- number line: value v at x = 60 + 216 v -->
  <line class="axis" x1="40" y1="120" x2="620" y2="120"/>

  <!-- ticks -->
  <line class="tick" x1="60" y1="112" x2="60" y2="128"/>
  <text class="muted" x="60" y="146" text-anchor="middle">0</text>
  <line class="tick" x1="168" y1="110" x2="168" y2="130"/>
  <text class="t head" x="168" y="150" text-anchor="middle">d = ½</text>
  <line class="rmark" x1="330" y1="106" x2="330" y2="134"/>
  <text class="r" x="330" y="150" text-anchor="middle">1 + r = 1.25</text>
  <line class="tick" x1="492" y1="110" x2="492" y2="130"/>
  <text class="t head" x="492" y="150" text-anchor="middle">u = 2</text>

  <!-- brace: 1+r-d above, u-d below -->
  <path class="brace" d="M168 92 v-8 h162 v8"/>
  <text class="bracelbl" x="249" y="72" text-anchor="middle">1 + r − d = 0.75</text>
  <path class="brace" d="M168 170 v8 h324 v-8"/>
  <text class="bracelbl" x="330" y="196" text-anchor="middle">u − d = 1.5</text>

  <text class="t" x="330" y="24" text-anchor="middle">p̃ = (1 + r − d) / (u − d) = 0.75 / 1.5 = ½</text>
  <text class="muted" x="330" y="42" text-anchor="middle">the fraction of the way from d to u at which the riskless growth 1 + r sits</text>
  <text class="warn" x="168" y="104" text-anchor="middle">1 + r → d: p̃ → 0</text>
  <text class="warn" x="492" y="104" text-anchor="middle">1 + r → u: p̃ → 1</text>
  <text class="warn" x="40" y="196">1 + r ≤ d: buy the stock on credit</text>
  <text class="warn" x="620" y="196" text-anchor="end">1 + r ≥ u: short the stock, lend</text>
</svg>

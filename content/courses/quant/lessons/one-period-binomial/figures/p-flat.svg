<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .t { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .a { fill: #e2903a; font-weight: 600; }
    .b { fill: #4c8dd6; font-weight: 600; }
    .axis { stroke: currentColor; opacity: 0.6; fill: none; }
    .guide { stroke: currentColor; opacity: 0.4; stroke-dasharray: 3 3; fill: none; }
    .price { stroke: #e2903a; stroke-width: 3; fill: none; }
    .expect { stroke: #4c8dd6; stroke-width: 2; fill: none; }
    .dot { fill: currentColor; }
  </style>
  <!-- axes: origin (80,250); p in [0,1] -> x = 80 + 500p ; dollars -> y = 250 - 83.3 v -->
  <line class="axis" x1="80" y1="250" x2="600" y2="250"/>
  <line class="axis" x1="80" y1="250" x2="80" y2="40"/>
  <text class="muted" x="600" y="288" text-anchor="end">real-world probability of heads, p</text>
  <text class="muted" x="76" y="36" text-anchor="end">dollars now</text>
  <line class="guide" x1="80" y1="250" x2="80" y2="255"/>
  <text class="muted" x="80" y="268" text-anchor="middle">0</text>
  <text class="muted" x="330" y="268" text-anchor="middle">½</text>
  <text class="muted" x="530" y="268" text-anchor="middle">0.9</text>
  <text class="muted" x="580" y="268" text-anchor="middle">1</text>
  <text class="muted" x="72" y="154" text-anchor="end">1.20</text>
  <text class="muted" x="72" y="74" text-anchor="end">2.16</text>
  <text class="muted" x="72" y="54" text-anchor="end">2.40</text>

  <!-- discounted expected payoff 2.4 p -->
  <line class="expect" x1="80" y1="250" x2="580" y2="50"/>
  <!-- arbitrage price -->
  <line class="price" x1="80" y1="150" x2="580" y2="150"/>
  <!-- crossing at p = 1/2 -->
  <line class="guide" x1="330" y1="250" x2="330" y2="150"/>
  <circle class="dot" cx="330" cy="150" r="4"/>
  <text class="t" x="338" y="176">the two agree only at p = p̃ = ½</text>
  <!-- p = 0.9 -->
  <line class="guide" x1="530" y1="250" x2="530" y2="70"/>
  <line class="guide" x1="80" y1="70" x2="530" y2="70"/>
  <circle class="dot" cx="530" cy="70" r="4"/>
  <circle class="dot" cx="530" cy="150" r="4"/>

  <text class="b" x="100" y="84">discounted expected payoff under p</text>
  <text class="b" x="100" y="100">0.8 × 3p = 2.4p</text>
  <text class="a" x="90" y="126">arbitrage price: 1.20,</text>
  <text class="a" x="90" y="142">whatever p is</text>
  <text class="muted" x="470" y="228" text-anchor="middle">at p = 0.9 the expectation says 2.16;</text>
  <text class="muted" x="470" y="242" text-anchor="middle">a quote of 2.16 is sold and hedged for 0.96 × 1.25 sure</text>
</svg>

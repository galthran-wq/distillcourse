<svg viewBox="0 0 640 345" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .t { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11.5px; }
    .head { font-weight: 600; }
    .s { fill: #e2903a; font-weight: 600; }
    .v { fill: #4c8dd6; font-weight: 600; }
    .box { fill: none; stroke: #e2903a; stroke-width: 1.5; rx: 4; }
    .axis { stroke: currentColor; opacity: 0.6; fill: none; }
    .guide { stroke: currentColor; opacity: 0.4; stroke-dasharray: 3 3; fill: none; }
    .line { stroke: #4c8dd6; stroke-width: 2; fill: none; }
    .ghost { opacity: 0.18; }
  </style>
  <text class="muted" x="20" y="22">solve for (X₀, Δ₀): the portfolio must equal the claim in both states</text>
  <text class="t" x="20" y="56"><tspan class="s">Δ₀S₁(H)</tspan> + (1 + r)(X₀ − <tspan class="s">Δ₀S₀</tspan>) = <tspan class="v">V₁(H)</tspan></text>
  <text class="muted" x="20" y="74">heads:  8Δ₀ + 1.25(X₀ − 4Δ₀) = 3</text>
  <text class="t" x="20" y="104"><tspan class="s">Δ₀S₁(T)</tspan> + (1 + r)(X₀ − <tspan class="s">Δ₀S₀</tspan>) = <tspan class="v">V₁(T)</tspan></text>
  <text class="muted" x="20" y="122">tails:  2Δ₀ + 1.25(X₀ − 4Δ₀) = 0</text>
  <!-- inset: claim value against stock value, origin (460,128); S: 15px/unit from 0; V: 20px/unit -->
  <line class="axis" x1="460" y1="128" x2="610" y2="128"/>
  <line class="axis" x1="460" y1="128" x2="460" y2="48"/>
  <text class="muted" x="610" y="142" text-anchor="end">S₁</text>
  <text class="muted" x="456" y="46" text-anchor="end">V₁</text>
  <line class="line" x1="490" y1="128" x2="580" y2="68"/>
  <circle cx="490" cy="128" r="3.5" fill="#4c8dd6" class=""/>
  <circle cx="580" cy="68" r="3.5" fill="#4c8dd6" class=""/>
  <text class="muted" x="490" y="142" text-anchor="middle">2</text>
  <text class="muted" x="580" y="142" text-anchor="middle">8</text>
  <text class="muted" x="590" y="72">3</text>
  <text class="muted" x="500" y="122">0</text>
  <text class="v" x="470" y="40">slope Δ₀ = 3 / 6 = ½</text>
  <text class="t" x="20" y="160"><tspan class="head">subtract:</tspan> X₀ cancels, and <tspan class="s">Δ₀</tspan> = (<tspan class="v">V₁(H) − V₁(T)</tspan>) / (S₁(H) − S₁(T)) = (3 − 0) / (8 − 2) = ½</text>
  <text class="t" x="20" y="200"><tspan class="head">weight heads by p̃, tails by q̃ = 1 − p̃, add:</tspan></text>
  <text class="t" x="20" y="224">(1 + r)X₀ + <tspan class="s">Δ₀</tspan>·[ p̃S₁(H) + q̃S₁(T) − (1 + r)S₀ ] = p̃<tspan class="v">V₁(H)</tspan> + q̃<tspan class="v">V₁(T)</tspan></text>
  <text class="muted" x="20" y="242">true for every p̃; choose p̃ so the bracket is 0, and Δ₀ drops out</text>
  <rect class="box" x="16" y="256" width="286" height="24"/>
  <text class="t" x="24" y="273">p̃ = (1 + r − d) / (u − d) = ½,   q̃ = ½</text>
  <text class="t" x="20" y="298">X₀ = [p̃<tspan class="v">V₁(H)</tspan> + q̃<tspan class="v">V₁(T)</tspan>] / (1 + r) = 0.8 (½·3 + ½·0) = <tspan class="head">1.20</tspan></text>
  <text class="muted" x="20" y="322">bookkeeping first: p̃ was chosen to kill a term. Probability second: 0 &lt; p̃ &lt; 1 exactly when d &lt; 1 + r &lt; u.</text>
  <text class="muted" x="620" y="22" text-anchor="end">frame 4 of 4</text>
</svg>

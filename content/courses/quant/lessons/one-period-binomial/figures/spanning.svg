<svg viewBox="0 0 640 315" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .t { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .head { font-weight: 600; }
    .s { fill: #e2903a; font-weight: 600; }
    .v { fill: #4c8dd6; font-weight: 600; }
    .axis { stroke: currentColor; opacity: 0.6; fill: none; }
    .stock { stroke: #e2903a; stroke-width: 2.5; fill: none; }
    .bond { stroke: currentColor; opacity: 0.7; stroke-width: 2; fill: none; }
    .claim { stroke: #4c8dd6; stroke-width: 2.5; fill: none; }
    .guide { stroke: currentColor; opacity: 0.4; stroke-dasharray: 3 3; fill: none; }
    .plane { fill: #e2903a; opacity: 0.12; stroke: #e2903a; stroke-width: 1; }
    .dot { fill: #4c8dd6; }
  </style>
  <!-- left panel: two states, origin (60,250), 20 px per dollar -->
  <text class="t head" x="160" y="24" text-anchor="middle">two states: stock and bond span the plane</text>
  <line class="axis" x1="60" y1="250" x2="290" y2="250"/>
  <line class="axis" x1="60" y1="250" x2="60" y2="50"/>
  <text class="muted" x="290" y="266" text-anchor="end">payoff if heads</text>
  <text class="muted" x="66" y="46">payoff if tails</text>
  <line class="stock" x1="60" y1="250" x2="220" y2="210"/>
  <circle cx="220" cy="210" r="3.5" fill="#e2903a"/>
  <text class="s" x="226" y="206">stock (8, 2)</text>
  <line class="bond" x1="60" y1="250" x2="160" y2="150"/>
  <circle cx="160" cy="150" r="3.5" fill="currentColor"/>
  <text class="t" x="166" y="146">4 bonds (5, 5)</text>
  <line class="claim" x1="60" y1="250" x2="120" y2="250"/>
  <circle class="dot" cx="120" cy="250" r="3.5"/>
  <text class="v" x="112" y="238">call (3, 0)</text>
  <text class="t" x="160" y="284" text-anchor="middle">call = ½ · stock − 0.8 · bond</text>
  <text class="muted" x="160" y="302" text-anchor="middle">every payoff vector is reachable</text>

  <!-- right panel: three states, oblique projection (h,m,t) -> (420+20h-10t, 230-20m+7t) -->
  <text class="t head" x="490" y="24" text-anchor="middle">three states: the call is off the plane</text>
  <line class="axis" x1="420" y1="230" x2="600" y2="230"/>
  <line class="axis" x1="420" y1="230" x2="420" y2="70"/>
  <line class="axis" x1="420" y1="230" x2="360" y2="272"/>
  <text class="muted" x="600" y="246" text-anchor="end">heads (8)</text>
  <text class="muted" x="416" y="66" text-anchor="end">middle (4)</text>
  <text class="muted" x="352" y="262" text-anchor="end">tails (2)</text>
  <polygon class="plane" points="420,230 560,164 610,99 470,165"/>
  <line class="stock" x1="420" y1="230" x2="560" y2="164"/>
  <text class="s" x="566" y="158">stock</text>
  <text class="s" x="566" y="173">(8, 4, 2)</text>
  <line class="bond" x1="420" y1="230" x2="470" y2="165"/>
  <text class="t" x="440" y="150">4 bonds (5, 5, 5)</text>
  <line class="claim" x1="420" y1="230" x2="480" y2="230"/>
  <circle class="dot" cx="480" cy="230" r="3.5"/>
  <text class="v" x="486" y="224">call (3, 0, 0)</text>
  <line class="guide" x1="480" y1="230" x2="480" y2="202"/>
  <text class="muted" x="488" y="206">no (Δ, b) reaches it</text>
  <text class="t" x="490" y="284" text-anchor="middle">two vectors span only a plane</text>
  <text class="muted" x="490" y="302" text-anchor="middle">the third direction needs a third traded asset</text>
</svg>

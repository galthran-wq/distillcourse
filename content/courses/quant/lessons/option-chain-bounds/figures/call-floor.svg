<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .t { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .head { font-weight: 600; }
    .axis { stroke: currentColor; opacity: 0.6; fill: none; }
    .guide { stroke: currentColor; opacity: 0.4; stroke-dasharray: 3 3; fill: none; }
    .floor { stroke: currentColor; stroke-width: 2; fill: none; }
    .below { fill: currentColor; opacity: 0.08; }
    .jun { fill: #4c8dd6; }
    .sep { fill: #5aa46a; }
    .dec { fill: #e2903a; }
    .ljun { fill: #4c8dd6; font-weight: 600; }
    .lsep { fill: #5aa46a; font-weight: 600; }
    .ldec { fill: #e2903a; font-weight: 600; }
  </style>
  <!-- axes: origin (70,320); x(K) = 100 + 4(K − 820); y(c) = 320 − 2.8c -->
  <line class="axis" x1="70" y1="320" x2="560" y2="320"/>
  <line class="axis" x1="70" y1="320" x2="70" y2="30"/>
  <text class="muted" x="560" y="338" text-anchor="end">strike K</text>
  <text class="muted" x="62" y="34" text-anchor="end">call mid</text>
  <text class="muted" x="100" y="336" text-anchor="middle">820</text>
  <text class="muted" x="180" y="336" text-anchor="middle">840</text>
  <text class="muted" x="260" y="336" text-anchor="middle">860</text>
  <text class="muted" x="340" y="336" text-anchor="middle">880</text>
  <text class="muted" x="420" y="336" text-anchor="middle">900</text>
  <text class="muted" x="500" y="336" text-anchor="middle">920</text>
  <text class="muted" x="62" y="324" text-anchor="end">0</text>
  <text class="muted" x="62" y="254" text-anchor="end">25</text>
  <text class="muted" x="62" y="184" text-anchor="end">50</text>
  <text class="muted" x="62" y="114" text-anchor="end">75</text>
  <text class="muted" x="62" y="44" text-anchor="end">100</text>
  <!-- forbidden region below the floor -->
  <polygon class="below" points="70,320 70,197 100,173 311,320"/>
  <!-- the floor max(0, S0 − Ke^{-rT}), December discounting -->
  <polyline class="floor" points="70,152 100,173 311,320 560,320"/>
  <text class="t head" x="76" y="298">floor max(0, S₀ − Ke⁻ʳᵀ)</text>
  <text class="muted" x="76" y="313">below it: buy the call, short the share</text>
  <line class="guide" x1="311" y1="320" x2="311" y2="344"/>
  <text class="muted" x="311" y="356" text-anchor="middle">kink where Ke⁻ʳᵀ = S₀, K ≈ 872.7</text>
  <!-- December -->
  <circle class="dec" cx="100" cy="70" r="4"/><circle class="dec" cx="180" cy="105" r="4"/><circle class="dec" cx="260" cy="136" r="4"/>
  <circle class="dec" cx="340" cy="164" r="4"/><circle class="dec" cx="420" cy="190" r="4"/><circle class="dec" cx="500" cy="212" r="4"/>
  <!-- September -->
  <circle class="sep" cx="100" cy="105" r="4"/><circle class="sep" cx="180" cy="142" r="4"/><circle class="sep" cx="260" cy="175" r="4"/>
  <circle class="sep" cx="340" cy="204" r="4"/><circle class="sep" cx="420" cy="229" r="4"/><circle class="sep" cx="500" cy="249" r="4"/>
  <!-- June -->
  <circle class="jun" cx="100" cy="161" r="4"/><circle class="jun" cx="180" cy="208" r="4"/><circle class="jun" cx="260" cy="247" r="4"/>
  <circle class="jun" cx="340" cy="277" r="4"/><circle class="jun" cx="420" cy="297" r="4"/>
  <!-- the smallest margin: June 820 -->
  <line class="guide" x1="112" y1="161" x2="112" y2="176"/>
  <line class="guide" x1="108" y1="161" x2="116" y2="161"/>
  <line class="guide" x1="108" y1="176" x2="116" y2="176"/>
  <text class="ljun" x="122" y="172">5.20</text>
  <!-- legend -->
  <circle class="dec" cx="420" cy="60" r="4"/><text class="ldec" x="430" y="64">December (226 days)</text>
  <circle class="sep" cx="420" cy="80" r="4"/><text class="lsep" x="430" y="84">September (135 days)</text>
  <circle class="jun" cx="420" cy="100" r="4"/><text class="ljun" x="430" y="104">June (44 days)</text>
  <text class="muted" x="420" y="124">upper bound c ≤ S₀ = 871.30:</text>
  <text class="muted" x="420" y="138">far above the chart</text>
  <text class="ljun" x="420" y="162">tightest margin: June 820 call,</text>
  <text class="ljun" x="420" y="176">5.20 above its floor</text>
</svg>

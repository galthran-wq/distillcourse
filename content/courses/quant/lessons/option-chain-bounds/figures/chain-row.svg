<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .t { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .head { font-weight: 600; }
    .bid { fill: #4c8dd6; font-weight: 600; }
    .off { fill: #e2903a; font-weight: 600; }
    .rule { stroke: currentColor; opacity: 0.35; }
    .box { fill: none; stroke: currentColor; opacity: 0.35; stroke-dasharray: 3 3; }
  </style>
  <text class="muted" x="320" y="18" text-anchor="middle">the 880 row of Tables 1.2 and 1.3: CBOE quotes for Google, May 8, 2013; stock bid 871.23, offer 871.37</text>
  <!-- header -->
  <text class="t head" x="60" y="48" text-anchor="middle">strike</text>
  <text class="t head" x="180" y="48" text-anchor="middle">June 2013</text>
  <text class="t head" x="330" y="48" text-anchor="middle">September 2013</text>
  <text class="t head" x="480" y="48" text-anchor="middle">December 2013</text>
  <text class="bid" x="150" y="66" text-anchor="middle">bid</text><text class="off" x="210" y="66" text-anchor="middle">offer</text>
  <text class="bid" x="300" y="66" text-anchor="middle">bid</text><text class="off" x="360" y="66" text-anchor="middle">offer</text>
  <text class="bid" x="450" y="66" text-anchor="middle">bid</text><text class="off" x="510" y="66" text-anchor="middle">offer</text>
  <line class="rule" x1="20" y1="74" x2="560" y2="74"/>
  <!-- call row -->
  <text class="muted" x="20" y="96">calls</text>
  <text class="t head" x="60" y="96" text-anchor="middle">880</text>
  <text class="bid" x="150" y="96" text-anchor="middle">15.00</text><text class="off" x="210" y="96" text-anchor="middle">15.60</text>
  <text class="bid" x="300" y="96" text-anchor="middle">41.00</text><text class="off" x="360" y="96" text-anchor="middle">41.60</text>
  <text class="bid" x="450" y="96" text-anchor="middle">55.00</text><text class="off" x="510" y="96" text-anchor="middle">56.30</text>
  <!-- put row -->
  <text class="muted" x="20" y="126">puts</text>
  <text class="t head" x="60" y="126" text-anchor="middle">880</text>
  <text class="bid" x="150" y="126" text-anchor="middle">23.40</text><text class="off" x="210" y="126" text-anchor="middle">24.40</text>
  <text class="bid" x="300" y="126" text-anchor="middle">48.80</text><text class="off" x="360" y="126" text-anchor="middle">49.80</text>
  <text class="bid" x="450" y="126" text-anchor="middle">62.40</text><text class="off" x="510" y="126" text-anchor="middle">63.70</text>
  <line class="rule" x1="20" y1="136" x2="560" y2="136"/>
  <!-- the September call pair, boxed -->
  <rect class="box" x="276" y="80" width="110" height="22" rx="4"/>
  <line class="rule" x1="330" y1="102" x2="330" y2="150"/>
  <!-- callouts -->
  <text class="bid" x="20" y="168">bid 41.00:</text>
  <text class="t" x="92" y="168">what the market maker pays you for the option: you sell here</text>
  <text class="off" x="20" y="190">offer 41.60:</text>
  <text class="t" x="106" y="190">what the market maker charges you: you buy here; the spread is 0.60</text>
  <text class="t head" x="20" y="214">mid 41.30</text>
  <text class="t" x="96" y="214">= (41.00 + 41.60)/2: the one price the theorems are tested at</text>
  <text class="t head" x="20" y="238">contract</text>
  <text class="t" x="80" y="238">= 100 shares: one September 880 call bought at the offer costs 41.60 × 100 = $4,160</text>
  <text class="t head" x="20" y="262">expiry</text>
  <text class="t" x="68" y="262">= the third Friday of the month: June 21, September 20, December 20 (44, 135, 226 days out)</text>
  <text class="t head" x="20" y="286">strike 880</text>
  <text class="t" x="92" y="286">= the price at which the call buys, and the put sells, one share</text>
  <text class="muted" x="20" y="312">every option in the row is American: exercisable on any trading day up to expiry</text>
</svg>

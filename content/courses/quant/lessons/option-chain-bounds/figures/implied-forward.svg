<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .t { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .head { font-weight: 600; }
    .axis { stroke: currentColor; opacity: 0.6; fill: none; }
    .guide { stroke: currentColor; opacity: 0.4; stroke-dasharray: 3 3; fill: none; }
    .line { stroke: #4c8dd6; stroke-width: 2; fill: none; }
    .band { fill: #4c8dd6; opacity: 0.12; }
    .dot { fill: #e2903a; }
    .dev { stroke: #e2903a; stroke-width: 1.5; fill: none; }
    .ldot { fill: #e2903a; font-weight: 600; }
    .lline { fill: #4c8dd6; font-weight: 600; }
  </style>
  <!-- axes: x(days) = 80 + 1.9 d, y(dollars) = 300 − 110 d -->
  <line class="axis" x1="80" y1="300" x2="570" y2="300"/>
  <line class="axis" x1="80" y1="300" x2="80" y2="40"/>
  <text class="muted" x="570" y="340" text-anchor="end">days to expiry</text>
  <text class="muted" x="14" y="34">forward minus spot, dollars</text>
  <text class="muted" x="72" y="304" text-anchor="end">0</text>
  <text class="muted" x="72" y="249" text-anchor="end">0.5</text>
  <text class="muted" x="72" y="194" text-anchor="end">1.0</text>
  <text class="muted" x="72" y="139" text-anchor="end">1.5</text>
  <text class="muted" x="164" y="318" text-anchor="middle">June 21 (44 d)</text>
  <text class="muted" x="337" y="318" text-anchor="middle">Sept 20 (135 d)</text>
  <text class="muted" x="509" y="318" text-anchor="middle">Dec 20 (226 d)</text>
  <!-- crossing-cost bands around the theory line at each expiry (880 line: ±0.87, ±0.87, ±1.37), clipped to the plot -->
  <rect class="band" x="154" y="176" width="20" height="124"/>
  <rect class="band" x="327" y="115" width="20" height="185"/>
  <rect class="band" x="499" y="40" width="20" height="260"/>
  <!-- the theory line S0 (e^{rT} − 1) at r = 0.25% -->
  <line class="line" x1="80" y1="300" x2="555" y2="136"/>
  <text class="lline" x="180" y="170">S₀(eʳᵀ − 1), r = 0.25%</text>
  <line class="guide" x1="250" y1="176" x2="262" y2="236"/>
  <!-- deviations: line value → implied -->
  <line class="dev" x1="164" y1="271" x2="164" y2="282"/>
  <line class="dev" x1="337" y1="211" x2="337" y2="196"/>
  <line class="dev" x1="509" y1="152" x2="509" y2="181"/>
  <!-- the implied forwards, F = K + c − p averaged over strikes -->
  <circle class="dot" cx="164" cy="282" r="5"/>
  <circle class="dot" cx="337" cy="196" r="5"/>
  <circle class="dot" cx="509" cy="181" r="5"/>
  <text class="ldot" x="176" y="286">871.46: −0.10</text>
  <text class="ldot" x="349" y="200">872.25: +0.14</text>
  <text class="ldot" x="521" y="185">872.38: −0.27</text>
  <text class="muted" x="164" y="264" text-anchor="middle">theory 871.56</text>
  <text class="muted" x="337" y="226" text-anchor="middle">theory 872.11</text>
  <text class="muted" x="509" y="126" text-anchor="middle">theory 872.65</text>
  <!-- legend -->
  <circle class="dot" cx="100" cy="60" r="5"/><text class="ldot" x="112" y="64">implied forward K + c − p, mean over strikes</text>
  <rect class="band" x="94" y="74" width="12" height="12"/><text class="t" x="112" y="84">± crossing cost of the 880 round trip at each expiry</text>
</svg>

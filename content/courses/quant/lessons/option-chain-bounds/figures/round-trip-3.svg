<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .t { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .head { font-weight: 600; }
    .rule { stroke: currentColor; opacity: 0.35; }
    .ghost { opacity: 0.18; }
    .net { fill: #e2903a; font-weight: 600; }
    .bid { fill: #4c8dd6; font-weight: 600; }
    .off { fill: #e2903a; font-weight: 600; }
  </style>
  <text class="muted" x="320" y="20" text-anchor="middle">September 880 parity trade at the quoted prices: the direction the mid residual ε = −0.11 favours</text>
  <text class="t head" x="24" y="52">leg</text>
  <text class="t head" x="464" y="52" text-anchor="end">cash now</text>
  <text class="t head" x="484" y="52">at T (Sept 20)</text>
  <line class="rule" x1="24" y1="60" x2="616" y2="60"/>
  <g class="row">
    <text class="t" x="24" y="86">buy the 880 call at the offer 41.60</text>
    <text class="t" x="464" y="86" text-anchor="end">−41.60</text>
    <text class="t" x="484" y="86">(Sₜ − 880)⁺</text>
  </g>
  <g class="row">
    <text class="t" x="24" y="116">sell the 880 put at the bid 48.80</text>
    <text class="t" x="464" y="116" text-anchor="end">+48.80</text>
    <text class="t" x="484" y="116">−(880 − Sₜ)⁺</text>
  </g>
  <g class="row">
    <text class="t" x="24" y="146">short a share at the bid 871.23; lend the 878.43</text>
    <text class="t" x="464" y="146" text-anchor="end">+871.23 − 878.43 = 0</text>
    <text class="t" x="484" y="146">879.24 − Sₜ</text>
  </g>
  <line class="rule" x1="24" y1="164" x2="616" y2="164"/>
  <g class="row ghost">
    <text class="t head" x="24" y="190">net</text>
    <text class="t head" x="464" y="190" text-anchor="end">0</text>
    <text class="net" x="484" y="190">879.24 − 880 = −0.76</text>
    <text class="muted" x="24" y="208">in both states one share arrives for 880: Sₜ &gt; 880 by exercising the call, Sₜ ≤ 880 by assignment on the put</text>
  </g>
  <g class="row ghost">
    <text class="t" x="24" y="238">at mid prices (41.30, 49.30, 871.30) the same legs net +0.11 = −ε eʳᵀ;</text>
    <text class="t" x="24" y="256">crossing the three spreads costs 0.30 + 0.50 + 0.07 = 0.87 per share; 0.11 − 0.87 = −0.76</text>
  </g>
  <text class="muted" x="320" y="288" text-anchor="middle">frame 3 of 4: the share is sold at its bid and the cash is lent</text>
</svg>

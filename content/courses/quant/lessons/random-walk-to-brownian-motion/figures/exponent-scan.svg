<svg viewBox="0 0 640 270" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .t { fill: currentColor; }
    .head { fill: currentColor; font-weight: 600; font-size: 13px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .ax { stroke: currentColor; stroke-width: 1; fill: none; opacity: 0.6; }
    .guide { stroke: currentColor; opacity: 0.35; stroke-dasharray: 3 3; fill: none; }
    .amb { stroke: #e2903a; fill: none; stroke-width: 1.6; }
    .blu { stroke: #4c8dd6; fill: none; stroke-width: 1.6; }
    .lamb { fill: #e2903a; font-weight: 600; }
    .lblu { fill: #4c8dd6; font-weight: 600; }
  </style>
  <text class="head" x="70" y="18">Var W⁽ⁿ⁾(1) = n · n^(−2α), steps of size n^(−α), n per unit time</text>
  <rect class="ax" x="70" y="30" width="530" height="200" rx="3"/>
  <line class="guide" x1="70" y1="210.8" x2="600" y2="210.8"/>
  <text class="muted" x="62" y="214.8" text-anchor="end">10^-3</text>
  <line class="guide" x1="70" y1="172.3" x2="600" y2="172.3"/>
  <text class="muted" x="62" y="176.3" text-anchor="end">10^-2</text>
  <line class="guide" x1="70" y1="133.8" x2="600" y2="133.8"/>
  <text class="muted" x="62" y="137.8" text-anchor="end">10^-1</text>
  <line class="guide" x1="70" y1="95.4" x2="600" y2="95.4"/>
  <text class="muted" x="62" y="99.4" text-anchor="end">10^0</text>
  <line class="guide" x1="70" y1="56.9" x2="600" y2="56.9"/>
  <text class="muted" x="62" y="60.9" text-anchor="end">10^1</text>
  <text class="muted" x="70.0" y="246" text-anchor="middle">1</text>
  <text class="muted" x="176.0" y="246" text-anchor="middle">4</text>
  <text class="muted" x="282.0" y="246" text-anchor="middle">16</text>
  <text class="muted" x="388.0" y="246" text-anchor="middle">64</text>
  <text class="muted" x="494.0" y="246" text-anchor="middle">256</text>
  <text class="muted" x="600.0" y="246" text-anchor="middle">1024</text>
  <text class="muted" x="335.0" y="262" text-anchor="middle">n (log scale)</text>
  <polyline class="blu" style="" points="70.0,95.4 123.0,89.6 176.0,83.8 229.0,78.0 282.0,72.2 335.0,66.4 388.0,60.7 441.0,54.9 494.0,49.1 547.0,43.3 600.0,37.5"/>
  <polyline class="amb" style="" points="70.0,95.4 123.0,95.4 176.0,95.4 229.0,95.4 282.0,95.4 335.0,95.4 388.0,95.4 441.0,95.4 494.0,95.4 547.0,95.4 600.0,95.4"/>
  <polyline class="ax" style="stroke-width:1.6;opacity:0.7" points="70.0,95.4 123.0,107.0 176.0,118.5 229.0,130.1 282.0,141.7 335.0,153.3 388.0,164.9 441.0,176.4 494.0,188.0 547.0,199.6 600.0,211.2"/>
  <text class="lblu" x="596.0" y="31.7" text-anchor="end">α = ¼: variance √n, explodes</text>
  <text class="lamb" x="596.0" y="87.4" text-anchor="end">α = ½: variance 1 for every n</text>
  <text class="t" x="596.0" y="202.8" text-anchor="end" opacity="0.7">α = 1: variance 1/n, vanishes</text>

</svg>

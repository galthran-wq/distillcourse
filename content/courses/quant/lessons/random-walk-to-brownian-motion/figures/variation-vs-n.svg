<svg viewBox="0 0 640 270" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .t { fill: currentColor; }
    .head { fill: currentColor; font-weight: 600; font-size: 13px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .ax { stroke: currentColor; stroke-width: 1; fill: none; opacity: 0.6; }
    .guide { stroke: currentColor; opacity: 0.35; stroke-dasharray: 3 3; fill: none; }
    .amb { stroke: #e2903a; fill: none; stroke-width: 1.6; }
    .blu { stroke: #4c8dd6; fill: none; stroke-width: 1.6; }
    .lamb { fill: #e2903a; font-weight: 600; }
    .lblu { fill: #4c8dd6; font-weight: 600; }
  </style>
  <text class="head" x="70" y="18">Two sums along one path of W⁽ⁿ⁾ over [0, 1], for four values of n</text>
  <rect class="ax" x="70" y="30" width="530" height="200" rx="3"/>
  <line class="guide" x1="70" y1="213.3" x2="600" y2="213.3"/>
  <text class="muted" x="62" y="217.3" text-anchor="end">1</text>
  <line class="guide" x1="70" y1="180.0" x2="600" y2="180.0"/>
  <text class="muted" x="62" y="184.0" text-anchor="end">2</text>
  <line class="guide" x1="70" y1="146.7" x2="600" y2="146.7"/>
  <text class="muted" x="62" y="150.7" text-anchor="end">4</text>
  <line class="guide" x1="70" y1="113.3" x2="600" y2="113.3"/>
  <text class="muted" x="62" y="117.3" text-anchor="end">8</text>
  <line class="guide" x1="70" y1="80.0" x2="600" y2="80.0"/>
  <text class="muted" x="62" y="84.0" text-anchor="end">16</text>
  <line class="guide" x1="70" y1="46.7" x2="600" y2="46.7"/>
  <text class="muted" x="62" y="50.7" text-anchor="end">32</text>
  <text class="muted" x="107.9" y="246" text-anchor="middle">16</text>
  <text class="muted" x="259.3" y="246" text-anchor="middle">64</text>
  <text class="muted" x="410.7" y="246" text-anchor="middle">256</text>
  <text class="muted" x="562.1" y="246" text-anchor="middle">1024</text>
  <text class="muted" x="335" y="262" text-anchor="middle">n, steps per unit time (log scale)</text>
  <polyline class="blu" points="107.9,146.7 259.3,113.3 410.7,80.0 562.1,46.7"/>
  <circle cx="107.9" cy="146.7" r="4" fill="#4c8dd6"/>
  <circle cx="259.3" cy="113.3" r="4" fill="#4c8dd6"/>
  <circle cx="410.7" cy="80.0" r="4" fill="#4c8dd6"/>
  <circle cx="562.1" cy="46.7" r="4" fill="#4c8dd6"/>
  <text class="lblu" x="107.9" y="136" text-anchor="middle" font-size="11">4</text>
  <text class="lblu" x="259.3" y="102.6" text-anchor="middle" font-size="11">8</text>
  <text class="lblu" x="410.7" y="69.3" text-anchor="middle" font-size="11">16</text>
  <text class="lblu" x="562.1" y="36" text-anchor="middle" font-size="11">32</text>
  <text class="lblu" x="150" y="60">Σ|ΔW| = √n, doubling each time n quadruples</text>
  <polyline class="amb" points="107.9,213.3 259.3,213.3 410.7,213.3 562.1,213.3"/>
  <circle cx="107.9" cy="213.3" r="4" fill="#e2903a"/>
  <circle cx="259.3" cy="213.3" r="4" fill="#e2903a"/>
  <circle cx="410.7" cy="213.3" r="4" fill="#e2903a"/>
  <circle cx="562.1" cy="213.3" r="4" fill="#e2903a"/>
  <text class="lamb" x="334" y="204" text-anchor="middle">Σ(ΔW)² = 1 for every n</text>
</svg>

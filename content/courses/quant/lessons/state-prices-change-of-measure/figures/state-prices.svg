<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .t { fill: currentColor; }
    .head { fill: currentColor; font-weight: 600; font-size: 13px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .pbar { fill: #4c8dd6; opacity: 0.85; }
    .sbar { fill: #e2903a; opacity: 0.9; }
    .excess { fill: #e2903a; opacity: 0.35; }
    .z { fill: currentColor; font-weight: 600; font-size: 11px; }
    .axis { stroke: currentColor; opacity: 0.4; }
    .guide { stroke: currentColor; opacity: 0.35; stroke-dasharray: 3 3; }
  </style>
  <text class="head" x="16" y="22">One dollar in one leaf: what it costs today against how likely the leaf is</text>
  <rect class="pbar" x="24" y="34" width="12" height="12"/><text class="muted" x="42" y="44">discounted actual probability P(ω)/1.25³</text>
  <rect class="sbar" x="290" y="34" width="12" height="12"/><text class="muted" x="308" y="44">state price ζ₃(ω)·P(ω) = P̃(ω)/1.25³</text>

  <line class="axis" x1="40" y1="240" x2="620" y2="240"/>
  <line class="guide" x1="40" y1="176" x2="620" y2="176"/>
  <text class="muted" x="618" y="192" text-anchor="end">0.064</text>

  <!-- scale: 1000 px per unit; pairs: blue at x, amber at x+22 -->
  <!-- HHH 0.152 -->
  <rect class="pbar" x="58" y="88" width="20" height="152"/>
  <rect class="sbar" x="80" y="176" width="20" height="64"/>
  <!-- HHT HTH THH 0.076 -->
  <rect class="pbar" x="128" y="164" width="20" height="76"/>
  <rect class="sbar" x="150" y="176" width="20" height="64"/>
  <rect class="pbar" x="198" y="164" width="20" height="76"/>
  <rect class="sbar" x="220" y="176" width="20" height="64"/>
  <rect class="pbar" x="268" y="164" width="20" height="76"/>
  <rect class="sbar" x="290" y="176" width="20" height="64"/>
  <!-- HTT THT TTH 0.038 -->
  <rect class="pbar" x="338" y="202" width="20" height="38"/>
  <rect class="sbar" x="360" y="202" width="20" height="38"/>
  <rect class="excess" x="360" y="176" width="20" height="26"/>
  <rect class="pbar" x="408" y="202" width="20" height="38"/>
  <rect class="sbar" x="430" y="202" width="20" height="38"/>
  <rect class="excess" x="430" y="176" width="20" height="26"/>
  <rect class="pbar" x="478" y="202" width="20" height="38"/>
  <rect class="sbar" x="500" y="202" width="20" height="38"/>
  <rect class="excess" x="500" y="176" width="20" height="26"/>
  <!-- TTT 0.019 -->
  <rect class="pbar" x="548" y="221" width="20" height="19"/>
  <rect class="sbar" x="570" y="221" width="20" height="19"/>
  <rect class="excess" x="570" y="176" width="20" height="45"/>

  <text class="z" x="79" y="80" text-anchor="middle">Z = 0.42</text>
  <text class="z" x="149" y="156" text-anchor="middle">0.84</text>
  <text class="z" x="219" y="156" text-anchor="middle">0.84</text>
  <text class="z" x="289" y="156" text-anchor="middle">0.84</text>
  <text class="z" x="359" y="168" text-anchor="middle">1.69</text>
  <text class="z" x="429" y="168" text-anchor="middle">1.69</text>
  <text class="z" x="499" y="168" text-anchor="middle">1.69</text>
  <text class="z" x="569" y="168" text-anchor="middle">3.38</text>

  <text class="muted" x="79" y="258" text-anchor="middle">HHH</text>
  <text class="muted" x="149" y="258" text-anchor="middle">HHT</text>
  <text class="muted" x="219" y="258" text-anchor="middle">HTH</text>
  <text class="muted" x="289" y="258" text-anchor="middle">THH</text>
  <text class="muted" x="359" y="258" text-anchor="middle">HTT</text>
  <text class="muted" x="429" y="258" text-anchor="middle">THT</text>
  <text class="muted" x="499" y="258" text-anchor="middle">TTH</text>
  <text class="muted" x="569" y="258" text-anchor="middle">TTT</text>
  <text class="muted" x="79" y="273" text-anchor="middle">S₃ = 32</text>
  <text class="muted" x="219" y="273" text-anchor="middle">S₃ = 8</text>
  <text class="muted" x="429" y="273" text-anchor="middle">S₃ = 2</text>
  <text class="muted" x="569" y="273" text-anchor="middle">S₃ = 0.5</text>

  <text class="t" x="40" y="300" font-size="11.5">A dollar in any leaf costs 6.4 cents. By the odds alone, TTT would be worth 1.9 cents and HHH 15.2 cents;</text>
  <text class="t" x="40" y="318" font-size="11.5">the shaded excess in the down leaves is what a dollar of insurance costs above its odds.</text>
</svg>

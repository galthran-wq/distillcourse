<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .t { fill: currentColor; }
    .eq { fill: currentColor; font-size: 16px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .a { fill: #e2903a; font-weight: 600; }
    .b { fill: #4c8dd6; font-weight: 600; }
    .brace { stroke: currentColor; opacity: 0.5; fill: none; stroke-width: 1.2; }
    .abrace { stroke: #e2903a; fill: none; stroke-width: 1.4; }
    .box { fill: none; stroke: currentColor; opacity: 0.25; }
    .sm { font-size: 10.5px; }
  </style>
  <text class="eq" x="24" y="44"><tspan class="b">Ẽ[Y]</tspan>  =  Σ<tspan font-size="11" dy="4">ω</tspan><tspan dy="-4"> Y(ω)·</tspan><tspan class="b">P̃(ω)</tspan>  =  Σ<tspan font-size="11" dy="4">ω</tspan><tspan dy="-4"> Y(ω)·</tspan><tspan class="a">Z(ω)</tspan>·P(ω)  =  E[<tspan class="a">Z</tspan>·Y]</text>

  <path class="brace" d="M 98 56 v 8 h 118 v -8"/>
  <text class="muted" x="157" y="80" text-anchor="middle">Y averaged with</text>
  <text class="muted" x="157" y="94" text-anchor="middle">the new weights</text>

  <path class="abrace" d="M 300 56 v 8 h 156 v -8"/>
  <text class="a" x="378" y="80" text-anchor="middle" font-size="11" font-weight="400">P̃(ω) = Z(ω)·P(ω),</text>
  <text class="a" x="378" y="94" text-anchor="middle" font-size="11" font-weight="400">the definition of Z, substituted</text>

  <path class="brace" d="M 522 56 v 8 h 88 v -8"/>
  <text class="muted" x="566" y="80" text-anchor="middle">Z·Y averaged with</text>
  <text class="muted" x="566" y="94" text-anchor="middle">the old weights</text>

  <rect class="box" x="16" y="112" width="608" height="176" rx="6"/>
  <text class="t" x="28" y="132" font-weight="600">The same identity on the $5 call, Y = V₃ = (S₃ − 5)⁺</text>
  <text class="muted" x="28" y="152">ω</text>
  <text class="muted" x="85" y="152">HHH</text><text class="muted" x="165" y="152">HHT</text><text class="muted" x="245" y="152">HTH</text><text class="muted" x="325" y="152">HTT</text><text class="muted" x="365" y="152">THH</text><text class="muted" x="445" y="152">THT</text><text class="muted" x="485" y="152">TTH</text><text class="muted" x="525" y="152">TTT</text><text class="muted" x="575" y="152">sum</text>
  <text class="t" x="28" y="174">Y</text>
  <text class="t" x="85" y="174">27</text><text class="t" x="165" y="174">3</text><text class="t" x="245" y="174">3</text><text class="t" x="325" y="174">0</text><text class="t" x="365" y="174">3</text><text class="t" x="445" y="174">0</text><text class="t" x="485" y="174">0</text><text class="t" x="525" y="174">0</text>
  <text class="b" x="28" y="198">Y·P̃</text>
  <text class="t" x="85" y="198">27·⅛</text><text class="t" x="165" y="198">3·⅛</text><text class="t" x="245" y="198">3·⅛</text><text class="t" x="325" y="198">0</text><text class="t" x="365" y="198">3·⅛</text><text class="t" x="445" y="198">0</text><text class="t" x="485" y="198">0</text><text class="t" x="525" y="198">0</text><text class="b" x="575" y="198">4.5</text>
  <text class="a" x="28" y="222">Y·Z·P</text>
  <text class="t sm" x="85" y="222">27·27⁄64·8⁄27</text><text class="t sm" x="165" y="222">3·27⁄32·4⁄27</text><text class="t sm" x="245" y="222">3·27⁄32·4⁄27</text><text class="t sm" x="325" y="222">0</text><text class="t sm" x="365" y="222">3·27⁄32·4⁄27</text><text class="t sm" x="445" y="222">0</text><text class="t sm" x="485" y="222">0</text><text class="t sm" x="525" y="222">0</text><text class="a" x="575" y="222">4.5</text>
  <text class="muted" x="85" y="240">= 27·⅛</text><text class="muted" x="165" y="240">= 3·⅛</text><text class="muted" x="245" y="240">= 3·⅛</text><text class="muted" x="365" y="240">= 3·⅛</text>
  <text class="t" x="28" y="268">Every product Z(ω)·P(ω) collapses to P̃(ω) = ⅛, term by term. Both rows sum to 4.5,</text>
  <text class="t" x="28" y="284">and 4.5 / 1.25³ = 2.304 is the call's price under either accounting.</text>
</svg>

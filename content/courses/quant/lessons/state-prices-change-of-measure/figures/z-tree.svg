  <text class="t" x="60" y="340" font-size="11.5">Each head multiplies by p̃/p = ¾, each tail by q̃/q = 3⁄2; at every node the P-average of the children is the node:</text>
  <text class="t" x="60" y="360" font-size="11.5">⅔·9⁄16 + ⅓·9⁄8 = ¾ at H;  ⅔·¾ + ⅓·3⁄2 = 1 at the root.</text>

<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .t { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .axis { stroke: currentColor; opacity: 0.6; fill: none; }
    .guide { stroke: currentColor; opacity: 0.4; stroke-dasharray: 3 3; fill: none; }
    .region { fill: #e2903a; opacity: 0.16; }
    .edge { stroke: #e2903a; stroke-width: 2; fill: none; }
    .act { fill: #4c8dd6; font-weight: 600; }
    .head { font-weight: 600; }
  </style>
  <!-- axes: origin (70,320), 7 px per dollar on both axes -->
  <line class="axis" x1="70" y1="320" x2="360" y2="320"/>
  <line class="axis" x1="70" y1="320" x2="70" y2="30"/>
  <text class="muted" x="364" y="324">stock price S₀</text>
  <text class="muted" x="60" y="34" text-anchor="end">call price c</text>
  <text class="muted" x="70" y="334" text-anchor="middle">0</text>
  <text class="muted" x="210" y="334" text-anchor="middle">20</text>
  <text class="muted" x="350" y="334" text-anchor="middle">40</text>
  <text class="muted" x="62" y="184" text-anchor="end">20</text>
  <!-- admissible region between the two edges -->
  <polygon class="region" points="70,320 350,40 350,154 184,320"/>
  <!-- upper edge c = S0 -->
  <line class="edge" x1="70" y1="320" x2="350" y2="40"/>
  <text class="t head" x="300" y="70" text-anchor="end">c = S₀</text>
  <!-- lower edge max(0, S0 − Ke^{-rT}) -->
  <polyline class="edge" points="70,320 184,320 350,154"/>
  <text class="t head" x="356" y="172">c = S₀ − Ke⁻ʳᵀ</text>
  <text class="muted" x="184" y="348" text-anchor="middle">Ke⁻ʳᵀ = 16.29</text>
  <line class="guide" x1="196" y1="320" x2="196" y2="312"/>
  <!-- the example stock price S0 = 20: corridor from 3.71 to 20 -->
  <line class="guide" x1="210" y1="320" x2="210" y2="180"/>
  <circle cx="210" cy="294" r="4" fill="#e2903a"/>
  <circle cx="210" cy="180" r="4" fill="#e2903a"/>
  <text class="t" x="222" y="298">3.71</text>
  <text class="t" x="222" y="184">20</text>
  <!-- the punishing trades -->
  <text class="act" x="400" y="40">quote above c = S₀:</text>
  <text class="muted" x="400" y="56">sell the call, buy the share</text>
  <text class="act" x="400" y="250">quote below S₀ − Ke⁻ʳᵀ:</text>
  <text class="muted" x="400" y="266">buy the call, short the share,</text>
  <text class="muted" x="400" y="280">lend S₀ − c at rate r</text>
  <text class="muted" x="400" y="100">inside: no static trade</text>
  <text class="muted" x="400" y="114">in stock, bond and call</text>
  <text class="muted" x="400" y="128">is an arbitrage</text>
  <text class="muted" x="70" y="24">K = 18, r = 10%, T = 1 year</text>
</svg>

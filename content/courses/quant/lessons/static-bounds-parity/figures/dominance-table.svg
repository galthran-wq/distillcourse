<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .t { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 12px; }
    .head { font-weight: 600; }
    .a { fill: #e2903a; font-weight: 600; }
    .b { fill: #4c8dd6; font-weight: 600; }
    .box { fill: none; stroke: currentColor; opacity: 0.35; }
    .rule { stroke: currentColor; opacity: 0.35; }
    .dash { stroke: currentColor; opacity: 0.3; stroke-dasharray: 3 3; }
    .brace { fill: none; stroke: #e2903a; stroke-width: 1.5; }
    .arrow { stroke: #e2903a; stroke-width: 1.5; fill: none; }
  </style>
  <!-- header -->
  <text class="muted head" x="200" y="40" text-anchor="middle">cost now</text>
  <text class="muted head" x="340" y="40" text-anchor="middle">at T, Sₜ ≤ K</text>
  <text class="muted head" x="480" y="40" text-anchor="middle">at T, Sₜ &gt; K</text>
  <rect class="box" x="20" y="52" width="600" height="96" rx="6"/>
  <line class="rule" x1="20" y1="100" x2="620" y2="100"/>
  <line class="dash" x1="270" y1="52" x2="270" y2="148"/>
  <!-- rows -->
  <text class="a" x="34" y="82">portfolio A</text>
  <text class="t" x="200" y="82" text-anchor="middle">a</text>
  <text class="t" x="340" y="82" text-anchor="middle">Aₜ</text>
  <text class="t" x="480" y="82" text-anchor="middle">Aₜ</text>
  <text class="b" x="34" y="130">portfolio B</text>
  <text class="t" x="200" y="130" text-anchor="middle">b</text>
  <text class="t" x="340" y="130" text-anchor="middle">Bₜ</text>
  <text class="t" x="480" y="130" text-anchor="middle">Bₜ</text>
  <!-- brace under the T columns -->
  <path class="brace" d="M290,160 v8 h260 v-8"/>
  <text class="a" x="420" y="186" text-anchor="middle">Aₜ ≥ Bₜ in every column</text>
  <!-- arrow to the conclusion -->
  <path class="arrow" d="M300,192 C240,192 210,192 210,212"/>
  <path class="arrow" d="M205,206 L210,214 L215,206"/>
  <text class="a" x="200" y="236" text-anchor="middle" font-size="14">a ≥ b</text>
  <text class="muted" x="320" y="270" text-anchor="middle">otherwise: buy A, sell B, lend the difference b − a — zero outlay now,</text>
  <text class="muted" x="320" y="288" text-anchor="middle">and at T the position holds Aₜ − Bₜ + (b − a)eʳᵀ &gt; 0 in every state</text>
</svg>

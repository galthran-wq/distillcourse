<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .t { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .head { font-weight: 600; }
    .axis { stroke: currentColor; opacity: 0.6; fill: none; }
    .guide { stroke: currentColor; opacity: 0.4; stroke-dasharray: 3 3; fill: none; }
    .dead { stroke: #4c8dd6; stroke-width: 2; fill: none; }
    .floor { stroke: #e2903a; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; opacity: 0.7; }
    .alive { stroke: #e2903a; stroke-width: 2.5; fill: none; }
    .a { fill: #e2903a; font-weight: 600; }
    .b { fill: #4c8dd6; font-weight: 600; }
  </style>
  <!-- left panel: the call. origin (50,260), 5 px per dollar, K = 18 -->
  <text class="t head" x="150" y="24" text-anchor="middle">American call</text>
  <line class="axis" x1="50" y1="260" x2="260" y2="260"/>
  <line class="axis" x1="50" y1="260" x2="50" y2="40"/>
  <text class="muted" x="260" y="276" text-anchor="end">S</text>
  <text class="muted" x="140" y="276" text-anchor="middle">K</text>
  <line class="guide" x1="140" y1="260" x2="140" y2="252"/>
  <polyline class="dead" points="50,260 140,260 250,150"/>
  <polyline class="floor" points="50,260 131,260 250,141"/>
  <path class="alive" d="M50,260 Q150,255 250,125"/>
  <text class="a" x="62" y="60">alive: the price, above the floor</text>
  <text class="a" x="62" y="76" opacity="0.8">floor: S − Ke⁻ʳᵀ (dashed)</text>
  <text class="b" x="62" y="96">dead: S − K</text>
  <text class="muted" x="62" y="116">alive &gt; dead wherever S &gt; K:</text>
  <text class="muted" x="62" y="130">never exercised early</text>
  <!-- right panel: the put. origin (370,260), 5 px per dollar, K = 18 -->
  <text class="t head" x="470" y="24" text-anchor="middle">American put</text>
  <line class="axis" x1="370" y1="260" x2="580" y2="260"/>
  <line class="axis" x1="370" y1="260" x2="370" y2="40"/>
  <text class="muted" x="580" y="276" text-anchor="end">S</text>
  <text class="muted" x="460" y="276" text-anchor="middle">K</text>
  <line class="guide" x1="460" y1="260" x2="460" y2="252"/>
  <polyline class="dead" points="370,170 460,260 570,260"/>
  <polyline class="floor" points="370,178.5 451,260 570,260"/>
  <path class="alive" d="M410,210 Q460,260 570,254"/>
  <circle cx="410" cy="210" r="4" fill="#e2903a"/>
  <line class="guide" x1="410" y1="260" x2="410" y2="214"/>
  <text class="muted" x="410" y="276" text-anchor="middle">S*</text>
  <text class="b" x="462" y="60">dead: K − S</text>
  <text class="a" x="462" y="80" opacity="0.8">European floor: Ke⁻ʳᵀ − S</text>
  <text class="muted" x="462" y="96">(below dead for small S)</text>
  <text class="a" x="462" y="120">alive: meets dead at S*</text>
  <text class="muted" x="462" y="136">below S*, exercise now;</text>
  <text class="muted" x="462" y="150">the module on American</text>
  <text class="muted" x="462" y="164">options computes S*</text>
  <text class="muted" x="320" y="316" text-anchor="middle">same strike, same rate: the call's floor sits above its exercise value, the put's sits below</text>
</svg>

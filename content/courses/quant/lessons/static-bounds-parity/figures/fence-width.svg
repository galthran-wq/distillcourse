<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .t { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .head { font-weight: 600; }
    .axis { stroke: currentColor; opacity: 0.6; fill: none; }
    .guide { stroke: currentColor; opacity: 0.4; stroke-dasharray: 3 3; fill: none; }
    .corner { stroke: #e2903a; stroke-width: 2.5; fill: none; }
    .ghost { stroke: #e2903a; stroke-width: 1.5; fill: none; opacity: 0.35; stroke-dasharray: 3 3; }
    .fence { stroke: #4c8dd6; stroke-width: 2; fill: none; }
    .fence2 { stroke: #4c8dd6; stroke-width: 2; fill: none; stroke-dasharray: 5 4; }
    .a { fill: #e2903a; font-weight: 600; }
    .b { fill: #4c8dd6; font-weight: 600; }
  </style>
  <!-- left panel: continuum of S_T. origin (50,250), 4 px per dollar, K = 18 -->
  <text class="t head" x="150" y="22" text-anchor="middle">Sₜ can be any value ≥ 0</text>
  <line class="axis" x1="50" y1="250" x2="215" y2="250"/>
  <line class="axis" x1="50" y1="315" x2="50" y2="60"/>
  <text class="muted" x="222" y="254">Sₜ</text>
  <text class="muted" x="122" y="266" text-anchor="middle">K</text>
  <line class="guide" x1="122" y1="250" x2="122" y2="242"/>
  <!-- upper fence: the share, pays S_T -->
  <line class="fence" x1="50" y1="250" x2="210" y2="90"/>
  <!-- the corner -->
  <polyline class="corner" points="50,250 122,250 210,162"/>
  <!-- lower fence: share less bond, pays S_T − K -->
  <line class="fence2" x1="70" y1="302" x2="210" y2="162"/>
  <text class="b" x="60" y="46">above: a share, pays Sₜ</text>
  <text class="muted" x="60" y="60">costs S₀ = 20</text>
  <text class="a" x="140" y="150" text-anchor="start">max(Sₜ − K, 0)</text>
  <text class="b" x="80" y="300">below: share − bond, pays Sₜ − K</text>
  <text class="muted" x="80" y="314">costs S₀ − Ke⁻ʳᵀ = 3.71</text>
  <text class="t head" x="150" y="336" text-anchor="middle">corridor [3.71, 20]: width Ke⁻ʳᵀ = 16.29</text>
  <!-- right panel: two states. origin (370,250), 16 px per dollar, K = 5 -->
  <text class="t head" x="470" y="22" text-anchor="middle">Sₜ can only be 2 or 8</text>
  <line class="axis" x1="370" y1="250" x2="540" y2="250"/>
  <line class="axis" x1="370" y1="315" x2="370" y2="60"/>
  <text class="muted" x="546" y="254">Sₜ</text>
  <text class="muted" x="450" y="266" text-anchor="middle">K = 5</text>
  <line class="guide" x1="450" y1="250" x2="450" y2="242"/>
  <text class="muted" x="402" y="266" text-anchor="middle">2</text>
  <text class="muted" x="498" y="266" text-anchor="middle">8</text>
  <!-- the corner survives only at the two admissible states -->
  <polyline class="ghost" points="370,250 450,250 530,170"/>
  <!-- the one line through both: ½ S_T − 1 -->
  <line class="fence" x1="370" y1="266" x2="534" y2="184"/>
  <circle cx="402" cy="250" r="4" fill="#e2903a"/>
  <circle cx="498" cy="202" r="4" fill="#e2903a"/>
  <text class="a" x="410" y="236">payoff 0</text>
  <text class="a" x="506" y="200">payoff 3</text>
  <text class="b" x="380" y="46">½ Sₜ − 1 passes through both states</text>
  <text class="muted" x="380" y="60">above and below the corner at once</text>
  <text class="muted" x="380" y="300">costs ½ · 4 − 1/1.25 = 1.20</text>
  <text class="t head" x="470" y="336" text-anchor="middle">corridor [1.20, 1.20]: width 0</text>
</svg>

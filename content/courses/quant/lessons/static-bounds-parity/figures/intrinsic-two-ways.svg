<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .t { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .axis { stroke: currentColor; opacity: 0.6; fill: none; }
    .guide { stroke: currentColor; opacity: 0.4; stroke-dasharray: 3 3; fill: none; }
    .dead { stroke: #4c8dd6; stroke-width: 2; fill: none; }
    .alive { stroke: #e2903a; stroke-width: 2; fill: none; }
    .gap { fill: #e2903a; opacity: 0.18; }
    .a { fill: #e2903a; font-weight: 600; }
    .b { fill: #4c8dd6; font-weight: 600; }
  </style>
  <!-- origin (70,260), 7 px per dollar -->
  <line class="axis" x1="70" y1="260" x2="360" y2="260"/>
  <line class="axis" x1="70" y1="260" x2="70" y2="30"/>
  <text class="muted" x="360" y="278" text-anchor="end">stock price S</text>
  <text class="muted" x="60" y="34" text-anchor="end">value</text>
  <text class="muted" x="70" y="274" text-anchor="middle">0</text>
  <text class="muted" x="184" y="290" text-anchor="middle">Ke⁻ʳᵀ = 16.29</text>
  <text class="muted" x="210" y="274" text-anchor="middle">K = 18</text>
  <line class="guide" x1="184" y1="260" x2="184" y2="100"/>
  <line class="guide" x1="196" y1="260" x2="196" y2="100"/>
  <!-- gap between the two kinks -->
  <polygon class="gap" points="184,260 196,260 350,106 350,94"/>
  <!-- dead: max(0, S − K) -->
  <polyline class="dead" points="70,260 196,260 350,106"/>
  <!-- alive floor: max(0, S − Ke^{-rT}) -->
  <polyline class="alive" points="70,260 184,260 350,94"/>
  <text class="a" x="380" y="70">alive: worth at least S − Ke⁻ʳᵀ</text>
  <text class="muted" x="380" y="86">(the bound just proved)</text>
  <text class="b" x="380" y="130">dead: exercise pays S − K</text>
  <text class="muted" x="380" y="146">(the option is gone)</text>
  <text class="a" x="380" y="196">gap: K(1 − e⁻ʳᵀ) = 1.71</text>
  <text class="muted" x="380" y="212">the interest on the strike over</text>
  <text class="muted" x="380" y="226">the option's remaining life</text>
  <text class="muted" x="70" y="24">K = 18, r = 10%, T = 1 year</text>
</svg>

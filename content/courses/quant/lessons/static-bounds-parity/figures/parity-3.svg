<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .t { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .head { font-weight: 600; }
    .a { fill: #e2903a; font-weight: 600; }
    .b { fill: #4c8dd6; font-weight: 600; }
    .boxa { fill: none; stroke: #e2903a; stroke-width: 1.5; }
    .boxb { fill: none; stroke: #4c8dd6; stroke-width: 1.5; }
    .axis { stroke: currentColor; opacity: 0.6; fill: none; }
    .guide { stroke: currentColor; opacity: 0.4; stroke-dasharray: 3 3; fill: none; }
    .paya { stroke: #e2903a; stroke-width: 3; fill: none; }
    .payb { stroke: #4c8dd6; stroke-width: 2; fill: none; stroke-dasharray: 6 4; }
    .ghost { opacity: 0.25; }
  </style>
  <!-- left: the two portfolios -->
  <rect class="boxb" x="20" y="40" width="230" height="80" rx="6"/>
  <text class="b" x="135" y="62" text-anchor="middle">portfolio C</text>
  <text class="t" x="135" y="82" text-anchor="middle">one share  +  one put (strike K)</text>
  <text class="muted" x="135" y="104" text-anchor="middle">costs S₀ + p now</text>
  <rect class="boxa" x="20" y="140" width="230" height="80" rx="6"/>
  <text class="a" x="135" y="162" text-anchor="middle">portfolio A</text>
  <text class="t" x="135" y="182" text-anchor="middle">one call (strike K)  +  bond paying K</text>
  <text class="muted" x="135" y="204" text-anchor="middle">costs c + Ke⁻ʳᵀ now</text>
  <!-- right: payoff axes, origin (320,230), 5 px per dollar -->
  <line class="axis" x1="320" y1="230" x2="560" y2="230"/>
  <line class="axis" x1="320" y1="230" x2="320" y2="40"/>
  <text class="muted" x="560" y="246" text-anchor="end">Sₜ</text>
  <text class="muted" x="312" y="44" text-anchor="end">value at T</text>
  <text class="muted" x="410" y="246" text-anchor="middle">K</text>
  <line class="guide" x1="410" y1="230" x2="410" y2="222"/>
  <polyline class="paya" points="320,140 410,140 560,40"/>
  <polyline class="payb" points="320,140 410,140 560,40"/>
  <text class="t head" x="470" y="66" text-anchor="end">max(Sₜ, K)</text>
  <text class="b" x="330" y="170">Sₜ ≤ K: C pays K (put exercised)</text>
  <text class="b" x="330" y="186">A pays K (the bond)</text>
  <text class="a" x="330" y="206">Sₜ &gt; K: C pays Sₜ (the share)</text>
  <text class="a" x="330" y="221">A pays Sₜ (call + bond)</text>
  <text x="190" y="278" text-anchor="middle" font-size="15"><tspan class="b">S₀ + p</tspan><tspan class="t"> = </tspan><tspan class="a">c + Ke⁻ʳᵀ</tspan></text>
  <text class="t" x="450" y="278" text-anchor="middle" font-size="15">hence c − p = S₀ − Ke⁻ʳᵀ</text>
  <text class="muted" x="320" y="300" text-anchor="middle">frame 3 of 3: same payoff, same price — the dominance lemma applied both ways</text>
</svg>

<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .t { fill: currentColor; }
    .head { fill: currentColor; font-weight: 600; font-size: 13px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .ax { stroke: currentColor; stroke-width: 1; fill: none; opacity: 0.6; }
    .curve { stroke: currentColor; stroke-width: 2; fill: none; }
    .amb { stroke: #e2903a; fill: none; stroke-width: 1.8; }
    .blu { stroke: #4c8dd6; fill: none; stroke-width: 1.8; }
    .lamb { fill: #e2903a; font-weight: 600; }
    .lblu { fill: #4c8dd6; font-weight: 600; }
    .gd { stroke: currentColor; stroke-width: 1; stroke-dasharray: 3 3; opacity: 0.5; fill: none; }
  </style>
  <!-- top panel: payoff and two smoothings. x: K-2..K+2 -> 60..340 ; y: 0..2.2 -> 170..30 -->
  <text class="head" x="60" y="22">The kink, smoothed at two widths</text>
  <line class="ax" x1="60" y1="170" x2="340" y2="170"/>
  <line class="ax" x1="60" y1="30" x2="60" y2="170"/>
  <text class="muted" x="200" y="186" text-anchor="middle">K</text>
  <text class="muted" x="60" y="186" text-anchor="middle">K − 2</text>
  <text class="muted" x="340" y="186" text-anchor="middle">K + 2</text>
  <line class="gd" x1="200" y1="30" x2="200" y2="170"/>
  <!-- f(x) = (x-K)^+ : from (60,170) to (200,170) to (340, 170-2*63.6=42.7) -->
  <polyline class="curve" points="60,170 200,170 340,42.7"/>
  <text class="t" x="270" y="60">(x − K)⁺</text>
  <!-- wide smoothing, epsilon = 1: f = (1/4)(x-K)^2 + (1/2)(x-K) + 1/4 on |x-K|<=1 ; scale 70px per unit x, 63.6 px per unit y -->
  <path class="amb" d="M 60 170 L 130 170 Q 165 170 200 154.1 Q 235 138.2 270 100.5 L 340 42.7"/>
  <!-- narrow smoothing, epsilon = 0.25: f = (x-K)^2 + (1/2)(x-K) + 1/16 on |x-K|<=0.25 -->
  <path class="blu" d="M 60 170 L 182.5 170 Q 191.25 170 200 166 Q 208.75 162 217.5 154.1 L 340 42.7"/>
  <text class="lamb" x="110" y="150">f_ε, ε = 1</text>
  <text class="lblu" x="228" y="186">f_ε, ε = ¼</text>
  <!-- bottom panel: second derivatives. y: 0..2.2 -> 330..210 -->
  <text class="head" x="60" y="205">f_ε″: narrower, taller, same area</text>
  <line class="ax" x1="60" y1="330" x2="340" y2="330"/>
  <line class="ax" x1="60" y1="210" x2="60" y2="330"/>
  <line class="gd" x1="200" y1="210" x2="200" y2="330"/>
  <text class="muted" x="200" y="346" text-anchor="middle">K</text>
  <!-- eps=1: height 1/(2 eps)=0.5 -> 27.3px; width 2 units = 140px -->
  <rect x="130" y="302.7" width="140" height="27.3" fill="#e2903a" opacity="0.35" stroke="#e2903a" stroke-width="1.5"/>
  <!-- eps=0.25: height 2 -> 109px; width 0.5 units = 35px -->
  <rect x="182.5" y="221" width="35" height="109" fill="#4c8dd6" opacity="0.35" stroke="#4c8dd6" stroke-width="1.5"/>
  <text class="lamb" x="274" y="318">f_ε″ = 1/(2ε)</text>
  <text class="lblu" x="222" y="232">f_ε″ = 1/(2ε)</text>
  <text class="t" x="66" y="228">area = 1 for every ε</text>
  <!-- right column: the Itô term -->
  <text class="head" x="370" y="52">The Itô correction for f_ε</text>
  <text class="t" x="370" y="80">½ ∫₀ᵀ f_ε″(S) σ²S² dt</text>
  <text class="t" x="370" y="106">= ½ σ² ∫₀ᵀ S² · (1/2ε) 1{|S − K| &lt; ε} dt</text>
  <text class="t" x="370" y="132">→ ½ σ² K² · ℓ_T(K)  as ε → 0</text>
  <text class="muted" x="370" y="152">ℓ_T(K) = time per dollar the path spends at K</text>
  <text class="muted" x="370" y="166">(its occupation density at the strike)</text>
  <rect x="368" y="184" width="256" height="60" rx="4" fill="none" stroke="#5aa46a" stroke-width="1.4"/>
  <text class="t" x="380" y="206" font-weight="600">does not vanish:</text>
  <text class="t" x="380" y="224">the band shrinks, the spike grows,</text>
  <text class="t" x="380" y="238">the product is a fixed time-density.</text>
  <text class="muted" x="370" y="272">Hull's numbers: ½ σ² K² · E ℓ_T(K)</text>
  <text class="muted" x="370" y="286">= ½ · 0.04 · 2500 · 0.0413 = 2.07,</text>
  <text class="muted" x="370" y="300">the mean cost the simulation plateaus at.</text>
  <text class="muted" x="370" y="330">Ordinary calculus sets f″ = 0 and gets 0.</text>
</svg>

<svg viewBox="0 0 640 315" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .t { fill: currentColor; }
    .head { fill: currentColor; font-weight: 600; font-size: 12.5px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .outer { fill: none; stroke: currentColor; opacity: 0.4; stroke-width: 1.2; }
    .inner { fill: #e2903a; fill-opacity: 0.12; stroke: #e2903a; stroke-width: 1.5; }
    .in { fill: #e2903a; }
    .out { fill: currentColor; opacity: 0.6; }
    .s { fill: #e2903a; font-weight: 600; font-size: 12px; }
    .b { fill: #4c8dd6; font-weight: 600; font-size: 11.5px; }
  </style>
  <rect class="outer" x="20" y="20" width="600" height="250" rx="10"/>
  <text class="head" x="34" y="42">all random times τ : Ω → {0, 1, …, N, ∞}, one value per path</text>

  <rect class="inner" x="40" y="62" width="384" height="190" rx="8"/>
  <text class="s" x="54" y="84">stopping times: {τ = n} decided by the first n tosses</text>

  <circle class="in" cx="70" cy="115" r="4"/>
  <text class="t" x="82" y="119">τ₂ = first n with Sₙ ≤ 2 (first passage)</text>
  <circle class="in" cx="70" cy="145" r="4"/>
  <text class="t" x="82" y="149">the put's rule τ: exercise at T, at HT, never at HH</text>
  <circle class="in" cx="70" cy="175" r="4"/>
  <text class="t" x="82" y="179">τ ≡ N (hold to expiry) and τ ≡ 0 (exercise now)</text>
  <circle class="in" cx="70" cy="205" r="4"/>
  <text class="t" x="82" y="209">first time Sₙ crosses the strike (the stop-loss trigger)</text>
  <circle class="in" cx="70" cy="235" r="4"/>
  <text class="t" x="82" y="239">min, max and successor of stopping times (closing exercise)</text>

  <circle class="out" cx="430" cy="115" r="4"/>
  <text class="t" x="442" y="119">ρ: stop at the path's lowest price</text>
  <circle class="out" cx="430" cy="160" r="4"/>
  <text class="t" x="442" y="164">σ: sell at the path's highest price</text>
  <circle class="out" cx="430" cy="205" r="4"/>
  <text class="t" x="442" y="209">the last time Sₙ is above 4</text>
  <text class="muted" x="442" y="228">well-defined per path; each</text>
  <text class="muted" x="442" y="242">needs a toss not yet seen</text>

  <text class="b" x="20" y="290">The American price of the next lesson is the best value over the shaded set;</text>
  <text class="b" x="20" y="305">no rule outside it can be hedged.</text>
</svg>

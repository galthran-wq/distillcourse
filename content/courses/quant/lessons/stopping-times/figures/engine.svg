<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .t { fill: currentColor; }
    .head { fill: currentColor; font-weight: 600; font-size: 14px; }
    .sub { fill: currentColor; font-weight: 600; font-size: 12px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .path { stroke: currentColor; stroke-width: 1.5; fill: none; opacity: 0.4; stroke-dasharray: 4 3; }
    .pdot { fill: currentColor; opacity: 0.4; }
    .stopped { stroke: #e2903a; stroke-width: 2.5; fill: none; }
    .sdot { fill: #e2903a; }
    .guide { stroke: #4c8dd6; stroke-width: 1.2; stroke-dasharray: 3 3; opacity: 0.8; }
    .b { fill: #4c8dd6; font-weight: 600; font-size: 11.5px; }
    .s { fill: #e2903a; font-weight: 600; font-size: 11.5px; }
    .box { fill: none; stroke: currentColor; opacity: 0.3; }
    .axis { stroke: currentColor; stroke-width: 1; opacity: 0.35; }
  </style>
  <text class="head" x="320" y="24" text-anchor="middle">X₍ₙ₊₁₎∧τ − Xₙ∧τ  =  𝟙{τ > n} · (Xₙ₊₁ − Xₙ)</text>
  <text class="muted" x="320" y="42" text-anchor="middle">one identity, three cases, checked path by path</text>

  <!-- panel 1: τ ≤ n -->
  <text class="sub" x="110" y="70" text-anchor="middle">τ ≤ n</text>
  <line class="axis" x1="30" y1="190" x2="190" y2="190"/>
  <text class="muted" x="50" y="204" text-anchor="middle">n−1</text>
  <text class="muted" x="90" y="204" text-anchor="middle">n</text>
  <text class="muted" x="130" y="204" text-anchor="middle">n+1</text>
  <text class="muted" x="170" y="204" text-anchor="middle">n+2</text>
  <line class="guide" x1="50" y1="185" x2="50" y2="85"/>
  <text class="b" x="54" y="92">τ</text>
  <polyline class="path" points="50,140 90,110 130,160 170,120"/>
  <polyline class="stopped" points="50,140 90,140 130,140 170,140"/>
  <circle class="sdot" cx="50" cy="140" r="3.5"/>
  <circle class="sdot" cx="90" cy="140" r="3.5"/>
  <circle class="sdot" cx="130" cy="140" r="3.5"/>
  <circle class="sdot" cx="170" cy="140" r="3.5"/>
  <text class="s" x="110" y="228" text-anchor="middle">left: 0, already frozen</text>
  <text class="b" x="110" y="244" text-anchor="middle">right: 𝟙 = 0</text>

  <!-- panel 2: τ = n+1 -->
  <text class="sub" x="320" y="70" text-anchor="middle">τ = n + 1</text>
  <line class="axis" x1="240" y1="190" x2="400" y2="190"/>
  <text class="muted" x="260" y="204" text-anchor="middle">n−1</text>
  <text class="muted" x="300" y="204" text-anchor="middle">n</text>
  <text class="muted" x="340" y="204" text-anchor="middle">n+1</text>
  <text class="muted" x="380" y="204" text-anchor="middle">n+2</text>
  <line class="guide" x1="340" y1="185" x2="340" y2="85"/>
  <text class="b" x="344" y="92">τ</text>
  <polyline class="path" points="260,140 300,110 340,160 380,120"/>
  <polyline class="stopped" points="260,140 300,110 340,160 380,160"/>
  <circle class="sdot" cx="260" cy="140" r="3.5"/>
  <circle class="sdot" cx="300" cy="110" r="3.5"/>
  <circle class="sdot" cx="340" cy="160" r="3.5"/>
  <circle class="sdot" cx="380" cy="160" r="3.5"/>
  <text class="s" x="320" y="228" text-anchor="middle">left: Xₙ₊₁ − Xₙ, the step rides</text>
  <text class="b" x="320" y="244" text-anchor="middle">right: 𝟙 = 1</text>

  <!-- panel 3: τ > n+1 -->
  <text class="sub" x="530" y="70" text-anchor="middle">τ > n + 1</text>
  <line class="axis" x1="450" y1="190" x2="610" y2="190"/>
  <text class="muted" x="470" y="204" text-anchor="middle">n−1</text>
  <text class="muted" x="510" y="204" text-anchor="middle">n</text>
  <text class="muted" x="550" y="204" text-anchor="middle">n+1</text>
  <text class="muted" x="590" y="204" text-anchor="middle">n+2</text>
  <line class="guide" x1="600" y1="185" x2="600" y2="85"/>
  <text class="b" x="604" y="92">τ</text>
  <polyline class="path" points="470,140 510,110 550,160 590,120"/>
  <polyline class="stopped" points="470,140 510,110 550,160 590,120"/>
  <circle class="sdot" cx="470" cy="140" r="3.5"/>
  <circle class="sdot" cx="510" cy="110" r="3.5"/>
  <circle class="sdot" cx="550" cy="160" r="3.5"/>
  <circle class="sdot" cx="590" cy="120" r="3.5"/>
  <text class="s" x="530" y="228" text-anchor="middle">left: Xₙ₊₁ − Xₙ</text>
  <text class="b" x="530" y="244" text-anchor="middle">right: 𝟙 = 1</text>

  <rect class="box" x="16" y="262" width="608" height="58" rx="6"/>
  <text class="t" x="28" y="282">{τ > n} is the complement of {τ ≤ n}, so for a stopping time it is decided by the first n tosses</text>
  <text class="t" x="28" y="300">and Eₙ takes the indicator out: Eₙ[𝟙{τ > n}(Xₙ₊₁ − Xₙ)] = 𝟙{τ > n} · Eₙ[Xₙ₊₁ − Xₙ].</text>
  <text class="muted" x="28" y="315">For the regret rule ρ, {ρ > 0} = [T] is not decided at time 0, and the indicator stays inside.</text>
</svg>

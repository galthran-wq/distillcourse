<svg viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .t { fill: currentColor; }
    .head { fill: currentColor; font-weight: 600; font-size: 13px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .edge { stroke: currentColor; stroke-width: 1.2; fill: none; opacity: 0.45; }
    .fedge { stroke: #e2903a; stroke-width: 1.5; fill: none; opacity: 0.5; stroke-dasharray: 3 3; }
    .node { fill: currentColor; }
    .frozen { fill: #e2903a; }
    .w { fill: #4c8dd6; font-weight: 600; font-size: 11px; }
    .bad { fill: currentColor; font-weight: 700; font-size: 11.5px; }
    .box { fill: none; stroke: currentColor; opacity: 0.3; }
    .cur { fill: currentColor; font-size: 12.5px; }
    .s { fill: #e2903a; font-weight: 600; font-size: 12.5px; }
  </style>
  <text class="head" x="16" y="22">stopped at τ (a stopping time)</text>
  <text class="head" x="336" y="22">stopped at ρ (reads the next toss)</text>

  <!-- left: M stopped at τ -->
  <line class="edge" x1="40" y1="160" x2="150" y2="95"/>
  <line class="edge" x1="40" y1="160" x2="150" y2="225"/>
  <line class="edge" x1="150" y1="95" x2="260" y2="55"/>
  <line class="edge" x1="150" y1="95" x2="260" y2="135"/>
  <line class="fedge" x1="150" y1="225" x2="260" y2="185"/>
  <line class="fedge" x1="150" y1="225" x2="260" y2="265"/>
  <circle class="node" cx="40" cy="160" r="3.5"/>
  <circle class="node" cx="150" cy="95" r="3.5"/>
  <circle class="frozen" cx="150" cy="225" r="4"/>
  <circle class="node" cx="260" cy="55" r="3.5"/>
  <circle class="node" cx="260" cy="135" r="3.5"/>
  <circle class="frozen" cx="260" cy="185" r="4"/>
  <circle class="frozen" cx="260" cy="265" r="4"/>
  <text class="t" x="40" y="150" text-anchor="middle">4</text>
  <text class="t" x="150" y="85" text-anchor="middle">6.4</text>
  <text class="t" x="150" y="246" text-anchor="middle">1.6</text>
  <text class="t" x="272" y="59">10.24</text>
  <text class="t" x="272" y="139">2.56</text>
  <text class="t" x="272" y="189">1.6</text>
  <text class="t" x="272" y="269">1.6</text>
  <text class="w" x="40" y="182">avg 4 = 4</text>
  <text class="w" x="150" y="115" text-anchor="middle">avg 6.4 = 6.4</text>
  <text class="w" x="150" y="262" text-anchor="middle">avg 1.6 = 1.6</text>

  <!-- right: M stopped at ρ -->
  <line class="fedge" x1="360" y1="160" x2="470" y2="95"/>
  <line class="edge" x1="360" y1="160" x2="470" y2="225"/>
  <line class="fedge" x1="470" y1="95" x2="580" y2="55"/>
  <line class="fedge" x1="470" y1="95" x2="580" y2="135"/>
  <line class="fedge" x1="470" y1="225" x2="580" y2="185"/>
  <line class="edge" x1="470" y1="225" x2="580" y2="265"/>
  <circle class="node" cx="360" cy="160" r="3.5"/>
  <circle class="frozen" cx="470" cy="95" r="4"/>
  <circle class="node" cx="470" cy="225" r="3.5"/>
  <circle class="frozen" cx="580" cy="55" r="4"/>
  <circle class="frozen" cx="580" cy="135" r="4"/>
  <circle class="frozen" cx="580" cy="185" r="4"/>
  <circle class="node" cx="580" cy="265" r="3.5"/>
  <text class="t" x="360" y="150" text-anchor="middle">4</text>
  <text class="t" x="470" y="85" text-anchor="middle">4</text>
  <text class="t" x="470" y="246" text-anchor="middle">1.6</text>
  <text class="t" x="592" y="59">4</text>
  <text class="t" x="592" y="139">4</text>
  <text class="t" x="592" y="189">1.6</text>
  <text class="t" x="592" y="269">0.64</text>
  <text class="bad" x="360" y="182">avg 2.8 ≠ 4</text>
  <text class="w" x="470" y="115" text-anchor="middle">avg 4 = 4</text>
  <text class="bad" x="470" y="262" text-anchor="middle">avg 1.12 ≠ 1.6</text>
  <text class="muted" x="336" y="300">frozen at 0 on HH and HT; at 1 on TH</text>

  <rect class="box" x="16" y="316" width="300" height="52" rx="6"/>
  <text class="cur" x="28" y="336">column means: 4 → 4 → 4</text>
  <text class="muted" x="28" y="356">every node's average is its own value</text>
  <rect class="box" x="336" y="316" width="288" height="52" rx="6"/>
  <text class="s" x="348" y="336">column means: 4 → 2.8 → 2.56</text>
  <text class="muted" x="348" y="356">a bias of 1.44 by time 2, from two peeks</text>
</svg>

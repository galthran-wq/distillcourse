<svg viewBox="0 0 640 370" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .t { fill: currentColor; }
    .head { fill: currentColor; font-weight: 600; font-size: 13px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .edge { stroke: currentColor; stroke-width: 1.2; fill: none; opacity: 0.4; }
    .fedge { stroke: #e2903a; stroke-width: 1.5; fill: none; opacity: 0.5; stroke-dasharray: 3 3; }
    .node { fill: currentColor; }
    .frozen { fill: #e2903a; opacity: 0.45; }
    .strike { fill: #e2903a; }
    .ring { fill: none; stroke: #e2903a; stroke-width: 2; }
    .s { fill: #e2903a; font-weight: 600; font-size: 11px; }
    .b { fill: #4c8dd6; font-weight: 600; font-size: 11.5px; }
  </style>
  <text class="head" x="16" y="20">τ = first n with Sₙ ≤ 2 on the three-period $4 tree</text>
  <text class="muted" x="60" y="42" text-anchor="middle">n = 0</text>
  <text class="muted" x="190" y="42" text-anchor="middle">n = 1</text>
  <text class="muted" x="320" y="42" text-anchor="middle">n = 2</text>
  <text class="muted" x="450" y="42" text-anchor="middle">n = 3</text>

  <!-- edges: plain -->
  <line class="edge" x1="60" y1="183" x2="190" y2="107"/>
  <line class="edge" x1="60" y1="183" x2="190" y2="259"/>
  <line class="edge" x1="190" y1="107" x2="320" y2="69"/>
  <line class="edge" x1="190" y1="107" x2="320" y2="145"/>
  <line class="edge" x1="320" y1="69" x2="450" y2="50"/>
  <line class="edge" x1="320" y1="69" x2="450" y2="88"/>
  <line class="edge" x1="320" y1="145" x2="450" y2="126"/>
  <line class="edge" x1="320" y1="145" x2="450" y2="164"/>
  <!-- edges: frozen subtree -->
  <line class="fedge" x1="190" y1="259" x2="320" y2="221"/>
  <line class="fedge" x1="190" y1="259" x2="320" y2="297"/>
  <line class="fedge" x1="320" y1="221" x2="450" y2="202"/>
  <line class="fedge" x1="320" y1="221" x2="450" y2="240"/>
  <line class="fedge" x1="320" y1="297" x2="450" y2="278"/>
  <line class="fedge" x1="320" y1="297" x2="450" y2="316"/>

  <circle class="node" cx="60" cy="183" r="3.5"/>
  <circle class="node" cx="190" cy="107" r="3.5"/>
  <circle class="strike" cx="190" cy="259" r="4"/>
  <circle class="ring" cx="190" cy="259" r="9"/>
  <circle class="node" cx="320" cy="69" r="3.5"/>
  <circle class="node" cx="320" cy="145" r="3.5"/>
  <circle class="frozen" cx="320" cy="221" r="4"/>
  <circle class="frozen" cx="320" cy="297" r="4"/>
  <circle class="node" cx="450" cy="50" r="3.5"/>
  <circle class="node" cx="450" cy="88" r="3.5"/>
  <circle class="node" cx="450" cy="126" r="3.5"/>
  <circle class="strike" cx="450" cy="164" r="4"/>
  <circle class="ring" cx="450" cy="164" r="9"/>
  <circle class="frozen" cx="450" cy="202" r="4"/>
  <circle class="frozen" cx="450" cy="240" r="4"/>
  <circle class="frozen" cx="450" cy="278" r="4"/>
  <circle class="frozen" cx="450" cy="316" r="4"/>

  <text class="t" x="48" y="187" text-anchor="end">4</text>
  <text class="t" x="190" y="96" text-anchor="middle">8</text>
  <text class="t" x="176" y="276" text-anchor="end">2</text>
  <text class="s" x="204" y="276">τ = 1</text>
  <text class="t" x="320" y="58" text-anchor="middle">16</text>
  <text class="t" x="320" y="134" text-anchor="middle">4</text>
  <text class="t" x="320" y="210" text-anchor="middle">4</text>
  <text class="t" x="320" y="286" text-anchor="middle">1</text>
  <text class="t" x="466" y="54">32</text>
  <text class="muted" x="490" y="54">HHH, τ = ∞</text>
  <text class="t" x="466" y="92">8</text>
  <text class="muted" x="490" y="92">HHT, τ = ∞</text>
  <text class="t" x="466" y="130">8</text>
  <text class="muted" x="490" y="130">HTH, τ = ∞</text>
  <text class="t" x="466" y="168">2</text>
  <text class="s" x="490" y="168">HTT, τ = 3</text>
  <text class="t" x="466" y="206">8</text>
  <text class="muted" x="490" y="206">THH, τ = 1</text>
  <text class="t" x="466" y="244">2</text>
  <text class="muted" x="490" y="244">THT, τ = 1</text>
  <text class="t" x="466" y="282">2</text>
  <text class="muted" x="490" y="282">TTH, τ = 1</text>
  <text class="t" x="466" y="320">0.5</text>
  <text class="muted" x="490" y="320">TTT, τ = 1</text>

  <circle class="ring" cx="24" cy="346" r="6"/>
  <text class="muted" x="36" y="350">τ strikes here</text>
  <circle class="frozen" cx="140" cy="346" r="4"/>
  <text class="muted" x="152" y="350">struck earlier: every descendant of a struck node is struck</text>
  <text class="b" x="16" y="368">{τ = 1} is the whole block [T]; {τ = 3} = {HTT}; {τ = ∞} = {HHH, HHT, HTH}.</text>
</svg>

<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .t { fill: currentColor; }
    .head { fill: currentColor; font-weight: 600; font-size: 13px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .edge { stroke: currentColor; stroke-width: 1.2; fill: none; opacity: 0.45; }
    .fedge { stroke: #e2903a; stroke-width: 1.5; fill: none; opacity: 0.5; stroke-dasharray: 3 3; }
    .node { fill: currentColor; }
    .frozen { fill: #e2903a; }
    .ring { fill: none; stroke: #e2903a; stroke-width: 2; }
    .d { fill: #4c8dd6; font-weight: 600; font-size: 12px; }
    .warn { fill: #e2903a; font-weight: 600; font-size: 12px; }
    .box { fill: none; stroke: currentColor; opacity: 0.3; }
    .cur { fill: currentColor; font-size: 11.5px; }
    .sep { stroke: currentColor; opacity: 0.2; stroke-dasharray: 3 3; }
  </style>

  <text class="head" x="16" y="22">Δₖ = 𝟙{τ &gt; k}: the put's rule</text>
  <text class="head" x="336" y="22">Δₖ = 𝟙{ρ &gt; k}: the regret rule</text>
  <line class="sep" x1="320" y1="34" x2="320" y2="322"/>

  <!-- left panel: tau -->
  <line class="edge" x1="50" y1="160" x2="160" y2="100"/>
  <line class="edge" x1="50" y1="160" x2="160" y2="220"/>
  <line class="edge" x1="160" y1="100" x2="270" y2="70"/>
  <line class="edge" x1="160" y1="100" x2="270" y2="130"/>
  <line class="fedge" x1="160" y1="220" x2="270" y2="190"/>
  <line class="fedge" x1="160" y1="220" x2="270" y2="250"/>

  <circle class="node" cx="50" cy="160" r="3.5"/>
  <circle class="node" cx="160" cy="100" r="3.5"/>
  <circle class="frozen" cx="160" cy="220" r="4"/>
  <circle class="ring" cx="160" cy="220" r="9"/>
  <circle class="node" cx="270" cy="70" r="3.5"/>
  <circle class="node" cx="270" cy="130" r="3.5"/>
  <circle class="frozen" cx="270" cy="190" r="4"/>
  <circle class="frozen" cx="270" cy="250" r="4"/>

  <text class="muted" x="42" y="176" text-anchor="end">4</text>
  <text class="d" x="42" y="150" text-anchor="end">Δ₀ = 1</text>
  <text class="muted" x="160" y="118" text-anchor="middle">6.4</text>
  <text class="d" x="160" y="88" text-anchor="middle">Δ₁ = 1</text>
  <text class="muted" x="146" y="238" text-anchor="end">1.6</text>
  <text class="d" x="176" y="238">Δ₁ = 0</text>
  <text class="muted" x="280" y="74">10.24</text>
  <text class="muted" x="280" y="134">2.56</text>
  <text class="muted" x="280" y="194">1.6</text>
  <text class="muted" x="280" y="254">1.6</text>

  <rect class="box" x="16" y="282" width="292" height="40" rx="6"/>
  <text class="cur" x="26" y="299">one number per node: a portfolio process</text>
  <text class="cur" x="26" y="315">TH: 4 + 1·(1.6 − 4) + 0·(1.6 − 1.6) = 1.6</text>

  <!-- right panel: rho -->
  <line class="edge" x1="370" y1="160" x2="480" y2="100"/>
  <line class="edge" x1="370" y1="160" x2="480" y2="220"/>
  <line class="fedge" x1="480" y1="100" x2="590" y2="70"/>
  <line class="fedge" x1="480" y1="100" x2="590" y2="130"/>
  <line class="edge" x1="480" y1="220" x2="590" y2="190"/>
  <line class="edge" x1="480" y1="220" x2="590" y2="250"/>

  <circle class="node" cx="370" cy="160" r="3.5"/>
  <circle class="ring" cx="370" cy="160" r="9" stroke-dasharray="3 3"/>
  <circle class="frozen" cx="480" cy="100" r="4"/>
  <circle class="ring" cx="480" cy="100" r="9"/>
  <circle class="node" cx="480" cy="220" r="3.5"/>
  <circle class="ring" cx="480" cy="220" r="9" stroke-dasharray="3 3"/>
  <circle class="frozen" cx="590" cy="70" r="4"/>
  <circle class="frozen" cx="590" cy="130" r="4"/>
  <circle class="frozen" cx="590" cy="190" r="4"/>
  <circle class="node" cx="590" cy="250" r="3.5"/>

  <text class="muted" x="362" y="176" text-anchor="end">4</text>
  <text class="warn" x="392" y="146">Δ₀ = 0 on [H]</text>
  <text class="warn" x="405" y="207">Δ₀ = 1 on [T]</text>
  <text class="muted" x="480" y="86" text-anchor="middle">4</text>
  <text class="d" x="494" y="104">Δ₁ = 0</text>
  <text class="muted" x="466" y="238" text-anchor="end">1.6</text>
  <text class="warn" x="520" y="175">Δ₁ = 0 on TH</text>
  <text class="warn" x="520" y="244">Δ₁ = 1 on TT</text>
  <text class="muted" x="600" y="74">4</text>
  <text class="muted" x="600" y="134">4</text>
  <text class="muted" x="600" y="194">1.6</text>
  <text class="muted" x="600" y="254">0.64</text>

  <rect class="box" x="332" y="282" width="292" height="40" rx="6"/>
  <text class="cur" x="342" y="299">two numbers at the root: Δ₀ reads ω₁</text>
  <text class="cur" x="342" y="315">HH: 4 + 0·(6.4 − 4) + 0·(10.24 − 6.4) = 4</text>
</svg>

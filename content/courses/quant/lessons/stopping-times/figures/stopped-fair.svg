<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .t { fill: currentColor; }
    .head { fill: currentColor; font-weight: 600; font-size: 13px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .edge { stroke: currentColor; stroke-width: 1.2; fill: none; opacity: 0.45; }
    .fedge { stroke: #e2903a; stroke-width: 1.5; fill: none; opacity: 0.5; stroke-dasharray: 3 3; }
    .node { fill: currentColor; }
    .frozen { fill: #e2903a; }
    .ring { fill: none; stroke: #e2903a; stroke-width: 2; }
    .w { fill: #4c8dd6; font-weight: 600; font-size: 11.5px; }
    .s { fill: #e2903a; font-weight: 600; font-size: 11px; }
    .box { fill: none; stroke: currentColor; opacity: 0.3; }
    .cur { fill: currentColor; font-size: 12.5px; }
  </style>
  <text class="head" x="16" y="22">M₍ₙ∧τ₎: the discounted stock stopped at the put's rule, with the P̃-average at each node</text>

  <line class="edge" x1="60" y1="165" x2="250" y2="95"/>
  <line class="edge" x1="60" y1="165" x2="250" y2="235"/>
  <line class="edge" x1="250" y1="95" x2="440" y2="50"/>
  <line class="edge" x1="250" y1="95" x2="440" y2="140"/>
  <line class="fedge" x1="250" y1="235" x2="440" y2="190"/>
  <line class="fedge" x1="250" y1="235" x2="440" y2="280"/>

  <circle class="node" cx="60" cy="165" r="3.5"/>
  <circle class="node" cx="250" cy="95" r="3.5"/>
  <circle class="frozen" cx="250" cy="235" r="4"/>
  <circle class="ring" cx="250" cy="235" r="9"/>
  <circle class="node" cx="440" cy="50" r="3.5"/>
  <circle class="node" cx="440" cy="140" r="3.5"/>
  <circle class="frozen" cx="440" cy="190" r="4"/>
  <circle class="frozen" cx="440" cy="280" r="4"/>

  <text class="t" x="50" y="169" text-anchor="end">4</text>
  <text class="t" x="250" y="84" text-anchor="middle">6.4</text>
  <text class="t" x="236" y="240" text-anchor="end">1.6</text>
  <text class="s" x="262" y="252">τ = 1</text>
  <text class="t" x="456" y="54">10.24</text>
  <text class="muted" x="500" y="54">HH, τ = ∞</text>
  <text class="t" x="456" y="144">2.56</text>
  <text class="muted" x="500" y="144">HT, τ = 2</text>
  <text class="t" x="456" y="194">1.6</text>
  <text class="muted" x="500" y="194">TH, frozen</text>
  <text class="t" x="456" y="284">1.6</text>
  <text class="muted" x="500" y="284">TT, frozen</text>

  <text class="w" x="16" y="120" text-anchor="start">root: ½ · 6.4 + ½ · 1.6 = 4</text>
  <text class="w" x="250" y="66" text-anchor="middle">½ · 10.24 + ½ · 2.56 = 6.4</text>
  <text class="w" x="250" y="270" text-anchor="middle">½ · 1.6 + ½ · 1.6 = 1.6</text>

  <rect class="box" x="16" y="298" width="608" height="36" rx="6"/>
  <text class="cur" x="28" y="321">column means: 4  |  ½ · 6.4 + ½ · 1.6 = 4  |  ¼ (10.24 + 2.56 + 1.6 + 1.6) = 4</text>
</svg>

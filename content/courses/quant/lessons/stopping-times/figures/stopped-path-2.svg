<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .t { fill: currentColor; }
    .head { fill: currentColor; font-weight: 600; font-size: 13px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .axis { stroke: currentColor; stroke-width: 1; opacity: 0.5; }
    .path { stroke: currentColor; stroke-width: 1.5; fill: none; opacity: 0.4; stroke-dasharray: 4 3; }
    .pdot { fill: currentColor; opacity: 0.4; }
    .stopped { stroke: #e2903a; stroke-width: 2.5; fill: none; }
    .sdot { fill: #e2903a; }
    .guide { stroke: #4c8dd6; stroke-width: 1.2; stroke-dasharray: 3 3; opacity: 0.8; }
    .b { fill: #4c8dd6; font-weight: 600; font-size: 11.5px; }
    .s { fill: #e2903a; font-weight: 600; font-size: 11.5px; }
  </style>
  <text class="head" x="16" y="20">frame 2 — path H, T, T: the discounted stock rides 4, 6.4, 2.56, 1.02; τ = 3</text>

  <line class="axis" x1="70" y1="250" x2="560" y2="250"/>
  <line class="axis" x1="70" y1="250" x2="70" y2="40"/>
  <text class="muted" x="100" y="268" text-anchor="middle">n = 0</text>
  <text class="muted" x="240" y="268" text-anchor="middle">n = 1</text>
  <text class="muted" x="380" y="268" text-anchor="middle">n = 2</text>
  <text class="muted" x="520" y="268" text-anchor="middle">n = 3</text>
  <text class="muted" x="62" y="254" text-anchor="end">0</text>
  <text class="muted" x="62" y="178" text-anchor="end">4</text>
  <text class="muted" x="62" y="102" text-anchor="end">8</text>
  <text class="muted" x="16" y="150">Mₙ</text>

  <line class="guide" x1="520" y1="250" x2="520" y2="60"/>
  <text class="b" x="514" y="70" text-anchor="end">τ = 3: struck at the last date, nothing left to freeze</text>

  <polyline class="path" points="100,174 240,128.4 380,201.4 520,230.5"/>

  <polyline class="stopped" points="100,174 240,128.4 380,201.4 520,230.5"/>
  <circle class="sdot" cx="100" cy="174" r="4"/>
  <circle class="sdot" cx="240" cy="128.4" r="4"/>
  <circle class="sdot" cx="380" cy="201.4" r="4"/>
  <circle class="sdot" cx="520" cy="230.5" r="4"/>
  <text class="s" x="100" y="166" text-anchor="middle">4</text>
  <text class="s" x="240" y="120" text-anchor="middle">6.4</text>
  <text class="s" x="380" y="193" text-anchor="middle">2.56</text>
  <text class="s" x="520" y="246" text-anchor="middle">1.02</text>

  <text class="muted" x="16" y="292">dashed: Mₙ along the path;  amber: M₍ₙ∧τ₎, which coincides with Mₙ because n ∧ τ = n at every date</text>
</svg>

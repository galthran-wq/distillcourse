<svg viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .t { fill: currentColor; }
    .head { fill: currentColor; font-weight: 600; font-size: 13px; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .edge { stroke: currentColor; stroke-width: 1.2; fill: none; opacity: 0.45; }
    .node { fill: currentColor; }
    .stop { fill: none; stroke: #e2903a; stroke-width: 2; }
    .s { fill: #e2903a; font-weight: 600; font-size: 11px; }
    .b { fill: #4c8dd6; font-weight: 600; font-size: 11.5px; }
    .box { fill: none; stroke: currentColor; opacity: 0.3; }
  </style>
  <text class="head" x="16" y="22">τ: the put's rule, reads the past</text>
  <text class="head" x="366" y="22">ρ: the regret rule, reads the next toss</text>

  <!-- left panel -->
  <line class="edge" x1="50" y1="170" x2="150" y2="105"/>
  <line class="edge" x1="50" y1="170" x2="150" y2="235"/>
  <line class="edge" x1="150" y1="105" x2="250" y2="65"/>
  <line class="edge" x1="150" y1="105" x2="250" y2="145"/>
  <line class="edge" x1="150" y1="235" x2="250" y2="195"/>
  <line class="edge" x1="150" y1="235" x2="250" y2="275"/>
  <circle class="node" cx="50" cy="170" r="3.5"/>
  <circle class="node" cx="150" cy="105" r="3.5"/>
  <circle class="node" cx="150" cy="235" r="3.5"/>
  <circle class="node" cx="250" cy="65" r="3.5"/>
  <circle class="node" cx="250" cy="145" r="3.5"/>
  <circle class="node" cx="250" cy="195" r="3.5"/>
  <circle class="node" cx="250" cy="275" r="3.5"/>
  <circle class="stop" cx="150" cy="235" r="9"/>
  <circle class="stop" cx="250" cy="145" r="9"/>

  <text class="t" x="40" y="174" text-anchor="end">S = 4</text>
  <text class="muted" x="50" y="204" text-anchor="middle">hold</text>
  <text class="t" x="150" y="92" text-anchor="middle">8</text>
  <text class="muted" x="150" y="126" text-anchor="middle">hold</text>
  <text class="t" x="150" y="256" text-anchor="middle">2</text>
  <text class="s" x="150" y="270" text-anchor="middle">exercise, τ = 1</text>
  <text class="t" x="262" y="69">16</text>
  <text class="muted" x="262" y="82">expire, τ = ∞</text>
  <text class="t" x="262" y="149">4</text>
  <text class="s" x="262" y="162">exercise, τ = 2</text>
  <text class="t" x="262" y="199">4</text>
  <text class="muted" x="262" y="212">frozen at 1</text>
  <text class="t" x="262" y="279">1</text>
  <text class="muted" x="262" y="292">frozen at 1</text>

  <!-- right panel -->
  <line class="edge" x1="400" y1="170" x2="500" y2="105"/>
  <line class="edge" x1="400" y1="170" x2="500" y2="235"/>
  <line class="edge" x1="500" y1="105" x2="600" y2="65"/>
  <line class="edge" x1="500" y1="105" x2="600" y2="145"/>
  <line class="edge" x1="500" y1="235" x2="600" y2="195"/>
  <line class="edge" x1="500" y1="235" x2="600" y2="275"/>
  <circle class="node" cx="400" cy="170" r="3.5"/>
  <circle class="node" cx="500" cy="105" r="3.5"/>
  <circle class="node" cx="500" cy="235" r="3.5"/>
  <circle class="node" cx="600" cy="65" r="3.5"/>
  <circle class="node" cx="600" cy="145" r="3.5"/>
  <circle class="node" cx="600" cy="195" r="3.5"/>
  <circle class="node" cx="600" cy="275" r="3.5"/>
  <circle class="stop" cx="400" cy="170" r="9" stroke-dasharray="3 3"/>
  <circle class="stop" cx="500" cy="235" r="9" stroke-dasharray="3 3"/>
  <circle class="stop" cx="600" cy="275" r="9"/>

  <text class="t" x="392" y="174" text-anchor="end">S = 4</text>
  <text class="s" x="392" y="196" text-anchor="end">ρ = 0 if ω₁ = H</text>
  <text class="t" x="500" y="92" text-anchor="middle">8</text>
  <text class="muted" x="500" y="126" text-anchor="middle">frozen at 0</text>
  <text class="t" x="500" y="256" text-anchor="middle">2</text>
  <text class="s" x="500" y="270" text-anchor="middle">ρ = 1 if ω₂ = H</text>
  <text class="t" x="612" y="69">16</text>
  <text class="muted" x="612" y="82">frozen at 0</text>
  <text class="t" x="612" y="149">4</text>
  <text class="muted" x="612" y="162">frozen at 0</text>
  <text class="t" x="612" y="199">4</text>
  <text class="muted" x="612" y="212">frozen at 1</text>
  <text class="t" x="612" y="279">1</text>
  <text class="s" x="612" y="292">exercise, ρ = 2</text>

  <rect class="box" x="16" y="302" width="278" height="30" rx="6"/>
  <text class="b" x="28" y="321">Ẽ[ (5 − S)⁺ at τ, discounted ] = 1.36</text>
  <rect class="box" x="366" y="302" width="288" height="30" rx="6"/>
  <text class="b" x="378" y="321">Ẽ[ (5 − S)⁺ at ρ, discounted ] = 1.74</text>
</svg>

  # ── Wolfram convergence demonstration ───────────────────────────────
  - id: convergenceo-snapshot-1
    capture: images/convergenceo-snapshot-1.png
    shows: "The 'textbook' convergence picture (T=3, S0=40, X=45, σ=.3, 50 steps): binomial sawtooth damping, BBS and trinomial smooth, numeric legend values"
    source: "Wolfram Demonstrations Project, Bozoudis & Boutsikas 2014"
    located: "Official Snapshot 1 (also the page thumbnail)"
    url: "https://www.wolframcloud.com/obj/resourcesystem/published/DemonstrationRepository/deployments/ConvergenceOfBinomialBinomialBlackScholesAndTrinomialOptionP/img/ConvergenceOfBinomialBinomialBlackScholesAndTrinomialOptionP_Snapshot-1.png"
    license: "Wolfram Demonstrations Project — teaching use; exact reuse license unknown"
    quality: "Native-resolution PNG, sharp legend and axes"
  - id: convergenceo-snapshot-2
    capture: images/convergenceo-snapshot-2.png
    shows: "A regime (T=1.5, δ=.028, σ=.46, 67 steps) where the binomial sawtooth has not damped even at 67 steps — convergence rate is parameter-dependent"
    source: "Wolfram Demonstrations Project 2014"
    located: "Official Snapshot 2"
    url: "wolframcloud.com ...Snapshot-2.png"
    license: "Wolfram Demonstrations Project — teaching use"
    quality: "Native-resolution PNG"
  - id: convergenceo-snapshot-3
    capture: images/convergenceo-snapshot-3.png
    shows: "High-volatility preset (σ=0.8, T=0.5, 75 steps): the binomial price crossing the fine-grid reference repeatedly — the clearest frame of non-monotone convergence"
    source: "Wolfram Demonstrations Project 2014"
    located: "Official Snapshot 3"
    url: "wolframcloud.com ...Snapshot-3.png"
    license: "Wolfram Demonstrations Project — teaching use"
    quality: "Native-resolution PNG"
  - id: convergenceo-snapshot-4
    capture: images/convergenceo-snapshot-4.png
    shows: "Early pre-convergence frame (σ=.8, only 29 steps): the sawtooth at its widest — the 'before' to Snapshot 1's 'after'"
    source: "Wolfram Demonstrations Project 2014"
    located: "Official Snapshot 4"
    url: "wolframcloud.com ...Snapshot-4.png"
    license: "Wolfram Demonstrations Project — teaching use"
    quality: "Native-resolution PNG"

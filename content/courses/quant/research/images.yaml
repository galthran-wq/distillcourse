# Index of the captured real-image pool under research/images/.
# One entry per file on disk; nobody re-reads the sources later — this index
# plus the captures IS the pool. Licences recorded exactly as the readers
# stated them; "teaching use" = publisher-copyright material used under
# teaching-use practice, to be reviewed before publication.
# Dropped as near-duplicates (deleted from disk): 18s096-s2-nepool-power-prices,
# 18s096-s2-pjm-power-prices (same idea as the ERCOT capture; no module uses

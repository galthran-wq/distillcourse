# Canon for the quant course (stochastic calculus for quantitative finance).
# access: full = read end-to-end by the reading swarm; summary-based = only
# verified fragments / a companion text; not-found = no readable copy located.
# The two non-full sources are flagged for the human to obtain from the
# publishers so the research can be re-run against complete texts.
sources:
  - id: shreve-1
    title: "Stochastic Calculus for Finance I: The Binomial Asset Pricing Model"
    author: "Steven E. Shreve"
    year: 2004
    url: "https://link.springer.com/book/10.1007/978-0-387-22527-2"
    access: "full — freely readable PDF mirror of the complete Springer scan (200 pp.), OCR'd end to end"
    role: "The honest-math half: modules 1–3's spine — one-period replication, multiperiod theorem, coin-toss probability, martingales, change of measure, American options, random walk and the perpetual put — proved rigorously and completely"
  - id: shreve-2
    title: "Stochastic Calculus for Finance II: Continuous-Time Models"
    author: "Steven E. Shreve"
    year: 2004
    url: "https://link.springer.com/book/10.1007/978-0-387-22527-2"
    access: "full — complete 570-page PDF extracted end to end (Chs. 1–11 + appendices)"
    role: "The pragmatic continuous half: Brownian motion, quadratic variation, Itô calculus, BSM via hedging, Girsanov, martingale representation, fundamental theorems, perpetual put — with its own fences (Radon–Nikodym, Lévy, MRT stated not proved) adopted as the course's honesty standard"
  - id: baxter-rennie
    title: "Financial Calculus: An Introduction to Derivative Pricing"
    author: "M. Baxter, A. Rennie"
    year: 1996
    url: "https://www.cambridge.org/core/books/financial-calculus/2E56D6D0F30E1B0B5DDF7CD8FF32F86A"
    access: "full — full text OCR'd locally from the scanned PDF, all 241 pp.; math OCR approximate, page images the fallback"
    role: "Framing and set pieces: the bookmaker parable, expectation-vs-arbitrage bait-and-switch, the three-step replication recipe, zoom-into-Brownian-motion figures, watch-the-hedge-in-action simulations"
  - id: hull
    title: "Options, Futures, and Other Derivatives, 9th ed."
    author: "John C. Hull"
    year: 2015
    url: "https://archive.org/details/economia-usp"
    access: "full — complete 892-page PDF extracted across three shards (Chs. 1–36)"
    role: "Market reality and worked numerics: option-chain mechanics, put–call parity in data, Greeks and the delta/stop-loss hedging simulations, Monte Carlo and variance reduction, the volatility smile chapter, GARCH mini-project, Business Snapshot case studies (1987, box spreads)"
  - id: crr-1979
    title: "Option Pricing: A Simplified Approach"
    author: "J. C. Cox, S. A. Ross, M. Rubinstein"
    year: 1979
    url: "https://www.unisalento.it/documents/20152/615419/Option+Pricing+-+A+Simplified+Approach.pdf"
    access: "full — direct PDF (35 pp.), extraction verified complete"
    role: "The primary source for the binomial model: the $50/$20 hedge, risk-neutral p as algebra, the two-states-necessity theorem, the worked 3-period arbitrage trade (module 2 application), the BS and jump limits, the convergence table"
  - id: black-scholes-1973
    title: "The Pricing of Options and Corporate Liabilities"
    author: "F. Black, M. Scholes"
    year: 1973
    url: "https://www.cs.princeton.edu/courses/archive/fall08/cos323/papers/black_scholes73.pdf"
    access: "full — JSTOR scan OCR'd at 300 dpi; equations verified against page images"
    role: "Primary artifact for module 5: the seven ideal conditions, the hedging derivation, the drift-independence surprise, the $15/$20 slippage example, Figure 1"
  - id: merton-1973
    title: "Theory of Rational Option Pricing"
    author: "R. C. Merton"
    year: 1973
    url: "https://finance.martinsewell.com/option-pricing/Merton1973.pdf"
    access: "full — 44-page JSTOR scan recovered via OCR"
    role: "The model-free half of module 1 (dominance bounds, put–call parity, no-early-exercise) and the smooth-pasting perpetual put; the two-portfolio dominance proof pattern as the course's purest 'price is not an opinion' device"
  - id: dupire-1994
    title: "Pricing with a Smile"
    author: "B. Dupire"
    year: 1994
    url: "https://www.risk.net/derivatives/equity-derivatives/1500211/pricing-with-a-smile"
    access: "SUMMARY-BASED — the 3-page Risk article is paywalled everywhere reachable; opening lines verified on risk.net; mathematical content grounded in the verified full-text 1993 Paribas precursor 'Pricing and Hedging with Smiles' (research/texts/pricingwith-companion-1993.txt). HUMAN: obtain the 1994 article from Risk/publisher to re-run the reading"
    role: "Module 7's closing move: the local-volatility construction — unique diffusion consistent with the call surface, the Nikkei paradox, the non-uniqueness counterexample, the diffusion-cannot-fit-jumps boundary"
  - id: engle-1982
    title: "Autoregressive Conditional Heteroscedasticity with Estimates of the Variance of United Kingdom Inflation"
    author: "R. F. Engle"
    year: 1982
    url: "https://www.dpye.iimas.unam.mx/ramses/Engle1982.pdf"
    access: "full — clean JSTOR-scan mirror, all 22 pp."
    role: "Primary source for ARCH: the three-model progression, moment theorems, block-diagonal information, the ARCH-LM test — module 8's estimation theory"
  - id: bollerslev-1986
    title: "Generalized Autoregressive Conditional Heteroskedasticity"
    author: "T. Bollerslev"
    year: 1986
    url: "https://public.econ.duke.edu/~boller/Published_Papers/joe_86.pdf"
    access: "full — author's own posting; 1990s OCR, equations verified against page images"
    role: "Primary source for GARCH(1,1): stationarity and moment theorems, ARMA-in-squares, kurtosis-from-clustering, the GARCH-vs-ARCH(8) empirical case and its figures"
  - id: cont-2001
    title: "Empirical Properties of Asset Returns: Stylized Facts and Statistical Issues"
    author: "R. Cont"
    year: 2001
    url: "https://finance.martinsewell.com/stylized-facts/dependence/Cont2001.pdf"
    access: "full — native-text PDF, all 14 pp."
    role: "Module 8's opening evidence: the eleven stylized facts, the kurtosis table, running-moment diagnostics, model-free volatility clustering — what any volatility model must reproduce"
  - id: gatheral-2006
    title: "The Volatility Surface: A Practitioner's Guide"
    author: "J. Gatheral"
    year: 2006
    url: "https://www.wiley.com/en-us/The+Volatility+Surface%3A+A+Practitioner%27s+Guide-p-9780471792512"
    access: "full — 210-page PDF mirror read end to end"
    role: "Module 7's real-data spine: the Sept 15, 2005 SPX surface, SVI fits against bid/offer quotes, the 5-cent-bid jump evidence, the Heston-too-flat negative result, local variance as conditional expectation"
  - id: mit-18s096
    title: "18.S096 Topics in Mathematics with Applications in Finance (Fall 2013)"
    author: "MIT OpenCourseWare (Lee, Kempthorne, Xia, Abbott, Strela, et al.)"
    year: 2013
    url: "https://ocw.mit.edu/courses/18-s096-topics-in-mathematics-with-applications-in-finance-fall-2013/"
    access: "full for the great majority — all posted lecture-note PDFs read (Lectures 4, 16, 20, 22 slides-only/outline-only)"
    role: "The problem-set-bearing university course grounding the labs' genre; secondary treatments of volatility estimators (Parkinson/Garman–Klass), Itô calculus, risk-neutral pricing, GARCH; the two-horse-race and betting-game set pieces"
  - id: boyle-emanuel-1980
    title: "Discretely Adjusted Option Hedges"
    author: "P. P. Boyle, D. Emanuel"
    year: 1980
    url: "https://www.sciencedirect.com/science/article/abs/pii/0304405X80900033"
    access: "NOT FOUND — abstract only; ScienceDirect 403, no free mirror or preprint exists for this pre-SSRN paper. HUMAN: obtain via institutional library / interlibrary loan / Elsevier purchase (JFE 8(3), 1980, pp. 259–282, DOI 10.1016/0304-405X(80)90003-3), then re-run the reading"
    role: "The 1/√n hedging-error scaling law and the chi-squared distribution of single-period hedge P&L — module 5's discrete-hedging lesson and lab cite the result; currently grounded via Hull Ch. 19's simulations and secondary statements"
  - id: higham-2001
    title: "An Algorithmic Introduction to Numerical Simulation of Stochastic Differential Equations"
    author: "Desmond J. Higham"
    year: 2001
    url: "http://www-sop.inria.fr/members/Olivier.Faugeras/MVA/Articles_11/higham:01.pdf"
    access: "full — complete JSTOR scan via a public course-page mirror, cached in research/texts/higham-2001-sde-simulation.pdf (SIAM Review 43(3) 525–546; the SIAM original is paywalled)"
    role: "The canonical simulation assignment for module 4's lab: an article that IS a problem set — 10 MATLAB programs students reproduce (bpath, stint's Itô-vs-Stratonovich ∫W dW, emstrong's measured strong order 1/2, chain.m's numerical confirmation of the stochastic chain rule). Added after structure synthesis to ground quadratic-variation-lab"
  - id: wolfram-convergence
    title: "Convergence of Binomial, Binomial Black-Scholes, and Trinomial Option Pricing Methods"
    author: "M. Bozoudis, M. Boutsikas (Wolfram Demonstrations Project)"
    year: 2014
    url: "https://demonstrations.wolfram.com/ConvergenceOfBinomialBinomialBlackScholesAndTrinomialOptionP/"
    access: "full — caption, details, references, all four snapshots, and the complete Manipulate source pulled via the site's JSON/HTML endpoints"
    role: "The empirical texture of tree-to-continuum convergence: the sawtooth, its parameter dependence, the fine-grid reference — figures and the reference values for the binomial-pricer lab's convergence checkpoint"
  - id: minutelabs-brownian
    title: "Brownian Motion (interactive simulation)"
    author: "MinuteLabs.io"
    year: 2015
    url: "https://labs.minutelabs.io/Brownian-Motion/"
    access: "full — single interactive page; controls, captions and links catalogued"
    role: "Physical grounding for module 4: the mechanism-reveal (many small collisions aggregate into a visible random walk) and the Einstein-atoms historical hook, linked as an external aside"

concepts:
  # --- Module 1: customer-base ---
  - id: funnel
    name: Funnel
    definition: "Ordered sequence of user states (visit → signup → activation → payment) with a conversion rate at each hand-off; rates multiply along the path"
    introduced_in: cohorts-and-funnels
  - id: conversion-rate
    name: Conversion rate
    definition: "Fraction of units entering a funnel stage that reach the next one, over a stated window and denominator"
    introduced_in: cohorts-and-funnels
  - id: cohort
    name: Cohort
    definition: "Group of customers indexed by acquisition period, tracked by age (periods since acquisition) rather than calendar time"
    introduced_in: cohorts-and-funnels
  - id: cohort-matrix
    name: Cohort matrix
    definition: "Cohort × age table of activity or revenue; its lower triangle is unobserved (censored) for live cohorts"
    introduced_in: cohorts-and-funnels
  - id: retention-curve
    name: Retention curve
    definition: "Fraction of a cohort still active as a function of age; a survival curve under another name"
    introduced_in: retention-and-survival
  - id: survivor-function
    name: Survivor function
    definition: "S(t) = P(lifetime > t) = r_1 r_2 … r_t; the product of period retention rates"
    introduced_in: retention-and-survival
  - id: retention-rate
    name: Retention rate
    definition: "r_t = S(t)/S(t−1): the fraction of period-(t−1) survivors who survive period t"
    introduced_in: retention-and-survival
  - id: censoring
    name: Censoring
    definition: "An observation whose event has not happened by the end of the observation window; the lifetime is known only to exceed the observed value"
    introduced_in: retention-and-survival
  - id: kaplan-meier
    name: Kaplan–Meier estimator
    definition: "Nonparametric product-limit estimate of S(t) that multiplies conditional survival fractions across risk sets, handling censoring correctly"
    introduced_in: retention-and-survival
  - id: churn
    name: Churn
    definition: "Rate at which customers (or their revenue) leave; the per-period complement of retention"
    introduced_in: churn-and-the-sbg-model
  - id: sbg-model
    name: Shifted-beta-geometric (sBG) model
    definition: "Constant individual churn probability θ (shifted-geometric lifetime) with Beta(α,β) heterogeneity across customers; closed-form survival and retention"
    introduced_in: churn-and-the-sbg-model
  - id: sorting-effect
    name: Sorting effect (ruse of heterogeneity)
    definition: "Aggregate retention rises with tenure because high-churn customers exit first, even when every individual's churn probability is constant"
    introduced_in: churn-and-the-sbg-model
  - id: clv
    name: Customer lifetime value (CLV)
    definition: "Discounted expected margin over a customer's remaining lifetime: Σ m·S(t)/(1+d)^t; residual CLV conditions on survival to date"
    introduced_in: customer-lifetime-value
  - id: discount-rate
    name: Discount rate
    definition: "Rate d at which future cash is worth less than present cash; 1/(1+d)^t weights period-t cash flows"
    introduced_in: customer-lifetime-value
  - id: contractual-noncontractual
    name: Contractual vs noncontractual settings
    definition: "2×2 classification of customer bases (relationship type × discrete/continuous transactions); churn is observed in contractual settings and latent otherwise"
    introduced_in: repeat-purchase-models
  - id: bg-nbd
    name: BG/NBD model
    definition: "Buy-till-you-die model: Poisson purchasing with gamma heterogeneity while alive, geometric dropout after each purchase with beta heterogeneity"
    introduced_in: repeat-purchase-models
  - id: p-alive
    name: P(alive)
    definition: "Posterior probability a customer is still active given their purchase history; closed-form in (x, t_x, T) under BG/NBD"
    introduced_in: repeat-purchase-models
  - id: rfm
    name: RFM sufficiency
    definition: "Recency, frequency, and monetary value; under BG/NBD-class models (x, t_x, T) are sufficient statistics for all predictions"
    introduced_in: repeat-purchase-models
  # --- Module 2: unit-economics ---
  - id: gross-margin
    name: Gross margin
    definition: "Revenue minus cost of goods sold (COGS), as a fraction of revenue; for software: hosting, support, inference"
    introduced_in: margins-and-the-unit-pnl
  - id: contribution-margin
    name: Contribution margin
    definition: "What a marginal customer adds after all variable costs; the m in CLV formulas"
    introduced_in: margins-and-the-unit-pnl
  - id: bookings-billings-revenue
    name: Bookings / billings / revenue
    definition: "Contract value signed vs cash invoiced vs revenue recognized; deferred revenue holds the difference"
    introduced_in: margins-and-the-unit-pnl
  - id: cac
    name: Customer acquisition cost (CAC)
    definition: "Sales-and-marketing spend divided by new customers acquired; blended (all customers) vs paid (channel-attributed) versions differ"
    introduced_in: cac-and-ltv-cac
  - id: ltv-cac-ratio
    name: LTV:CAC ratio
    definition: "Margin-adjusted customer value over acquisition cost; the >3 guideline is folklore, not a theorem"
    introduced_in: cac-and-ltv-cac
  - id: payback-period
    name: Payback period
    definition: "Months to recover CAC from contribution margin: CAC / (ARPA × GM%); the liquidity counterpart of LTV:CAC"
    introduced_in: payback-and-the-cash-trough
  - id: cash-trough
    name: Cash trough
    definition: "The cumulative-cash minimum a growing customer base passes through because acquisition is paid before it is recovered; deepens with growth"
    introduced_in: payback-and-the-cash-trough
  - id: mrr
    name: MRR / ARR
    definition: "Monthly (annual) recurring revenue; net new MRR = new + expansion − churned"
    introduced_in: mrr-nrr-and-negative-churn
  - id: net-revenue-retention
    name: Net revenue retention (NRR/GRR)
    definition: "Cohort revenue after churn and expansion over starting revenue; GRR excludes expansion, so GRR ≤ 100% ≤ possible NRR"
    introduced_in: mrr-nrr-and-negative-churn
  - id: negative-churn
    name: Negative churn
    definition: "Expansion revenue from the installed base exceeding churned revenue; makes cohort revenue compound instead of decay"
    introduced_in: mrr-nrr-and-negative-churn
  - id: willingness-to-pay
    name: Willingness-to-pay (WTP)
    definition: "The price at which a given customer would still buy; a distribution over customers, measurable by elicitation before launch"
    introduced_in: pricing-and-willingness-to-pay
  - id: van-westendorp-psm
    name: Van Westendorp price sensitivity meter
    definition: "Four price-perception questions producing cumulative curves whose crossings define the indifference price, optimal price point, and acceptable range"
    introduced_in: pricing-and-willingness-to-pay
  - id: price-elasticity
    name: Price elasticity
    definition: "Percent change in quantity per percent change in price; connects a price move to volume, churn, and revenue"
    introduced_in: pricing-and-willingness-to-pay
  - id: north-star-metric
    name: North Star metric
    definition: "The single metric chosen to proxy long-term value creation, sitting at the root of the driver tree"
    introduced_in: north-star-and-metric-trees
  - id: metric-tree
    name: Metric tree
    definition: "Factorization of a target metric into driver metrics connected by arithmetic; supports forecasting and sensitivity"
    introduced_in: north-star-and-metric-trees
  - id: simpsons-paradox
    name: Simpson's paradox / mix effects
    definition: "Aggregate and per-segment trends disagreeing because segment weights shift; every segment can improve while the total falls"
    introduced_in: north-star-and-metric-trees
  - id: goodharts-law
    name: Goodhart's law
    definition: "When a measure becomes a target, it ceases to be a good measure; optimization pressure decouples proxy from goal"
    introduced_in: goodharts-law
  - id: vanity-metric
    name: Vanity metric
    definition: "A metric that can rise without the business improving: cumulative counts, window-dependent actives, chosen denominators"
    introduced_in: goodharts-law
  # --- Module 3: experiments ---
  - id: falsifiable-hypothesis
    name: Falsifiable hypothesis
    definition: "A belief stated with an ex-ante success criterion and an observation that would refute it"
    introduced_in: hypotheses-and-customer-evidence
  - id: commitment-currencies
    name: Commitment currencies
    definition: "Time, reputation, money — what a prospect gives up ranks interview evidence by its cost to fake"
    introduced_in: hypotheses-and-customer-evidence
  - id: controlled-experiment
    name: Controlled experiment (A/B test)
    definition: "Random assignment of units to variants so outcome differences are attributable to the change; the top of the single-study evidence hierarchy"
    introduced_in: ab-tests-and-randomization
  - id: randomization-unit
    name: Randomization unit
    definition: "The entity assigned to variants (user, session, page); must be persistent and independent, and sets the analysis unit"
    introduced_in: ab-tests-and-randomization
  - id: oec
    name: Overall evaluation criterion (OEC)
    definition: "The single quantitative measure an experiment optimizes: short-term measurable, believed causally linked to long-term value"
    introduced_in: ab-tests-and-randomization
  - id: sample-ratio-mismatch
    name: Sample ratio mismatch (SRM)
    definition: "Observed variant counts deviating from the designed split beyond chance; a p-value on the ratio that invalidates the experiment when it fires"
    introduced_in: ab-tests-and-randomization
  - id: twymans-law
    name: Twyman's law
    definition: "Any figure that looks interesting or different is usually wrong; surprising results demand verification before celebration"
    introduced_in: ab-tests-and-randomization
  - id: statistical-power
    name: Statistical power
    definition: "Probability of detecting a true effect of stated size at the chosen α; 1 − P(type II error)"
    introduced_in: power-and-mde
  - id: mde
    name: Minimum detectable effect (MDE)
    definition: "Smallest true effect an experiment detects with the stated power; scales as 1/√n for fixed α and power"
    introduced_in: power-and-mde
  - id: peeking
    name: Peeking
    definition: "Reading a fixed-horizon p-value at data-dependent times and stopping on significance; inflates the false-positive rate 5–10× and beyond"
    introduced_in: peeking-and-always-valid-inference
  - id: always-valid-inference
    name: Always-valid p-values (mSPRT)
    definition: "p-value processes valid at every stopping time, built from mixture sequential probability ratio tests; monitoring becomes legal"
    introduced_in: peeking-and-always-valid-inference
  - id: cuped
    name: CUPED
    definition: "Control-variate adjustment using pre-experiment data: variance shrinks by 1−ρ² with no bias, because randomization equalizes pre-period means"
    introduced_in: variance-reduction-cuped
  - id: interference
    name: Interference (SUTVA violation)
    definition: "One unit's outcome depending on other units' assignments — marketplaces, networks, shared resources; contained by cluster or switchback designs"
    introduced_in: experiment-pathologies
  - id: novelty-effect
    name: Novelty and primacy effects
    definition: "Short-run treatment effects that decay (novelty) or build (primacy) with exposure, making early reads misstate long-run impact"
    introduced_in: experiment-pathologies
  - id: triggering
    name: Triggering
    definition: "Restricting analysis to units actually affected by the change to gain sensitivity; valid only when trigger status is unaffected by treatment"
    introduced_in: experiment-pathologies
  - id: guardrail-metric
    name: Guardrail metric
    definition: "A metric the organization refuses to degrade (latency, crashes, SRM); monitored alongside the OEC to catch harm the OEC misses"
    introduced_in: oec-and-guardrails
  - id: multiple-comparisons
    name: Multiple comparisons
    definition: "Testing many metrics/variants inflates false positives; FWER (Bonferroni) and FDR (Benjamini–Hochberg) are the two control regimes"
    introduced_in: oec-and-guardrails
  # --- Module 4: causal-inference ---
  - id: multi-armed-bandit
    name: Multi-armed bandit
    definition: "Sequential allocation among options with unknown rewards, balancing exploration against exploitation"
    introduced_in: multi-armed-bandits
  - id: regret
    name: Regret
    definition: "Expected shortfall against always playing the best arm: R_n = Σ_a Δ_a E[T_a(n)]"
    introduced_in: multi-armed-bandits
  - id: ucb
    name: Upper confidence bound (UCB)
    definition: "Optimism under uncertainty: play the arm with the highest plausible mean; achieves logarithmic instance-dependent regret"
    introduced_in: multi-armed-bandits
  - id: thompson-sampling
    name: Thompson sampling
    definition: "Sample each arm's mean from its posterior and play the argmax; posterior probability matching as an allocation rule"
    introduced_in: multi-armed-bandits
  - id: potential-outcomes
    name: Potential outcomes
    definition: "Y(1), Y(0) — the outcomes a unit would have under each treatment state; the causal effect is their difference, never jointly observed"
    introduced_in: difference-in-differences
  - id: selection-bias
    name: Selection bias
    definition: "The gap between treated and untreated groups' untreated outcomes; what randomization zeroes and observational comparisons carry"
    introduced_in: difference-in-differences
  - id: difference-in-differences
    name: Difference-in-differences (DiD)
    definition: "Treated group's change minus control group's change; identifies the effect under parallel trends"
    introduced_in: difference-in-differences
  - id: parallel-trends
    name: Parallel trends
    definition: "The assumption that absent treatment, treated and control outcomes would have moved in parallel; partially testable pre-treatment"
    introduced_in: difference-in-differences
  - id: instrumental-variable
    name: Instrumental variable
    definition: "A variable that moves treatment but affects the outcome only through it (independence + exclusion); assignment in a noncompliant RCT is the clean case"
    introduced_in: instrumental-variables
  - id: intention-to-treat
    name: Intention-to-treat (ITT)
    definition: "Effect of assignment regardless of compliance; diluted by noncompliers but unbiased under randomization"
    introduced_in: instrumental-variables
  - id: late
    name: Local average treatment effect (LATE)
    definition: "The IV/Wald estimand: the average effect among compliers — units whose treatment status the instrument moves"
    introduced_in: instrumental-variables
  - id: synthetic-control
    name: Synthetic control
    definition: "Convex, typically sparse combination of donor units matching the treated unit's pre-treatment path; the post-period gap estimates the effect"
    introduced_in: synthetic-control
  - id: placebo-inference
    name: Placebo (permutation) inference
    definition: "Re-run the estimator on every untreated unit as if treated; the treated unit's rank in that distribution is an exact p-value"
    introduced_in: synthetic-control
  - id: cate
    name: CATE / uplift
    definition: "Conditional average treatment effect τ(x) = E[Y(1)−Y(0)|X=x]; the effect as a function of covariates"
    introduced_in: uplift-and-causal-forests
  - id: causal-forest
    name: Causal forest
    definition: "Honest, subsampled random forest estimating τ(x) with asymptotically valid confidence intervals (Wager & Athey)"
    introduced_in: uplift-and-causal-forests
  - id: aipw
    name: AIPW (doubly robust) scores
    definition: "Augmented inverse-propensity-weighted scores: unbiased if either the outcome or the propensity model is correct; require cross-fitting"
    introduced_in: uplift-and-causal-forests
  - id: qini-curve
    name: QINI / RATE curves
    definition: "Gain from treating the top-q fraction ranked by a score, versus treating at random; the ROC of targeting"
    introduced_in: uplift-and-causal-forests
  - id: policy-value
    name: Policy value
    definition: "E[Y(π(X))] for a treatment-assignment rule π; estimable from experimental or observational data via AIPW scores"
    introduced_in: policy-learning-and-targeting
  # --- Module 5: growth-channels ---
  - id: traction-channels
    name: Traction channels
    definition: "The 19-channel taxonomy of customer-acquisition routes (Weinberg & Mares); the search space for distribution strategy"
    introduced_in: traction-and-bullseye
  - id: bullseye-framework
    name: Bullseye framework
    definition: "Five-step channel-selection procedure: brainstorm, rank, prioritize, test, focus — parallel cheap tests, then concentration on the one channel that works"
    introduced_in: traction-and-bullseye
  - id: channel-test
    name: Channel test
    definition: "A cheap experiment estimating a channel's three numbers: cost per customer, addressable volume, and customer fit"
    introduced_in: traction-and-bullseye
  - id: second-price-auction
    name: Second-price (Vickrey) auction
    definition: "Highest bidder wins at the second-highest bid; truthful bidding is a weakly dominant strategy"
    introduced_in: ad-auctions-gsp-vcg
  - id: gsp-auction
    name: Generalized second-price (GSP) auction
    definition: "Position auction where slot i pays the bid of slot i+1; looks like Vickrey but is not truthful — equilibrium, not dominance, does the work"
    introduced_in: ad-auctions-gsp-vcg
  - id: vcg-mechanism
    name: VCG mechanism
    definition: "Allocate to maximize total value; charge each winner the externality they impose on others; truthful bidding is dominant"
    introduced_in: ad-auctions-gsp-vcg
  - id: quality-score
    name: Quality score
    definition: "Platform-estimated CTR/quality multiplier that rescales bids into rank scores; converts a bid auction into an expected-value auction"
    introduced_in: ad-auctions-gsp-vcg
  - id: revenue-equivalence
    name: Revenue equivalence
    definition: "Mechanisms with the same allocation rule and same lowest-type payoff yield the same expected revenue; the four standard formats coincide under symmetric IPV"
    introduced_in: reserve-prices-and-first-price
  - id: myerson-reserve
    name: Virtual value and Myerson reserve
    definition: "Optimal auctions allocate by virtual value ψ(v) = v − (1−F)/f and exclude bidders below ψ(v)=0 — a reserve price above the seller's own value"
    introduced_in: reserve-prices-and-first-price
  - id: bid-shading
    name: Bid shading
    definition: "Bidding below value in first-price formats; equilibrium shading is (n−1)/n·v under uniform IPV, and moves to the bidder's side after the first-price migration"
    introduced_in: reserve-prices-and-first-price
  - id: budget-pacing
    name: Budget pacing
    definition: "Spreading a budget over an auction stream by bid shading rather than early exhaustion; adaptive pacing tracks the dual multiplier"
    introduced_in: bidding-and-pacing
  - id: shadow-price
    name: Shadow price (of a budget)
    definition: "The Lagrange multiplier μ on the budget constraint; optimal bid is v/(1+μ), and μ updates by the spend error"
    introduced_in: bidding-and-pacing
  - id: roas
    name: ROAS
    definition: "Return on ad spend = attributed revenue / spend; breakeven ROAS is 1/gross-margin, and honest targets adjust for margin and payback window"
    introduced_in: roas-and-max-bid
  - id: target-cpa
    name: Target CPA / max bid
    definition: "The acquisition price per conversion (and per click) that the CLV model and payback constraint permit; the bid cap fed to autobidders"
    introduced_in: roas-and-max-bid
  - id: mmm
    name: Marketing mix modeling (MMM)
    definition: "Regression of sales on transformed channel spend plus controls; estimates channel response where user-level tracking fails"
    introduced_in: media-mix-modeling
  - id: adstock
    name: Adstock (carryover)
    definition: "Geometric decay transform of spend history, w_l = α^l, reported as a half-life; delayed variant peaks after exposure"
    introduced_in: media-mix-modeling
  - id: hill-saturation
    name: Hill saturation
    definition: "Diminishing-returns transform 1/(1+(x/K)^−S) with half-saturation K and shape S; the reach curve is the S=1 case"
    introduced_in: media-mix-modeling
  - id: multi-touch-attribution
    name: Multi-touch attribution
    definition: "Distributing conversion credit across a journey's touchpoints; rule-based schemes (last/first/linear/position) are arbitrary weightings"
    introduced_in: attribution-and-incrementality
  - id: shapley-attribution
    name: Shapley-value attribution
    definition: "Credit channels by average marginal contribution over coalitions; the unique rule satisfying efficiency, dummy, and symmetry"
    introduced_in: attribution-and-incrementality
  - id: incrementality
    name: Incrementality
    definition: "The share of conversions that would not have occurred without marketing — a counterfactual quantity requiring an experiment, not an attribution scheme"
    introduced_in: attribution-and-incrementality
  - id: k-factor
    name: K-factor
    definition: "Mean number of new users each user recruits (invites × conversion); the offspring mean of the viral branching process"
    introduced_in: virality-and-branching
  - id: galton-watson-process
    name: Galton–Watson branching process
    definition: "Population where each individual independently spawns an i.i.d. random number of offspring; generations compose through the PGF"
    introduced_in: virality-and-branching
  - id: extinction-probability
    name: Extinction probability
    definition: "q = smallest root of f(s)=s for offspring PGF f; q=1 iff mean offspring K ≤ 1"
    introduced_in: virality-and-branching
  - id: viral-cycle-time
    name: Viral cycle time
    definition: "Time per invite generation; growth scales as K^(t/c), so cycle time enters the exponent while K enters the base"
    introduced_in: virality-and-branching
  - id: product-led-growth
    name: Product-led growth (PLG)
    definition: "Go-to-market where the product itself drives acquisition, conversion, and expansion — self-serve first, sales on top"
    introduced_in: plg-and-freemium
  - id: freemium-conversion
    name: Freemium / free-trial conversion
    definition: "Free-to-paid funnel rates: benchmark ~5% freemium vs ~17% trial signups converting, with opposite top-of-funnel volumes"
    introduced_in: plg-and-freemium
  - id: pql
    name: Product-qualified lead (PQL)
    definition: "A signup scored sales-ready by in-product behavior rather than firmographics; the PLG replacement for the MQL"
    introduced_in: plg-and-freemium
  - id: content-asset
    name: Content as capital
    definition: "Perpetual-inventory treatment of content spend: G_t = (1−δ)G_{t−1} + I_t, valued by the NPV of its decaying traffic yield"
    introduced_in: seo-and-content-economics
  - id: compounding-channel
    name: Compounding channel
    definition: "A channel whose output accrues to a stock (content, SEO authority) rather than a flow; growth arrives in stair-steps and persists after spend stops"
    introduced_in: seo-and-content-economics
  - id: acv
    name: Annual contract value (ACV)
    definition: "Average annualized contract size; jointly with CAC it determines which sales motion is economically possible"
    introduced_in: sales-motion-and-acv
  - id: bowtie-funnel
    name: Bowtie funnel
    definition: "Pre-close funnel mirrored by a post-close expansion cone (onboard → impact → expand), instrumented with per-stage conversion rates and times"
    introduced_in: sales-motion-and-acv
  - id: sales-capacity
    name: Sales capacity
    definition: "Bookings ceiling = reps × quota × ramp; in sales-led motion revenue is headcount-driven and the hiring plan is the growth driver"
    introduced_in: sales-motion-and-acv
  - id: marginal-cac
    name: Marginal CAC
    definition: "Cost of the next customer from a channel; rises along the saturation curve and exceeds average CAC everywhere past the knee"
    introduced_in: channel-portfolio
  - id: channel-portfolio
    name: Channel portfolio
    definition: "Budget allocation across channels equalizing marginal returns under saturation, balanced against concentration and stage fit"
    introduced_in: channel-portfolio
  - id: platform-risk
    name: Platform risk
    definition: "Exposure to a channel owned by a counterparty who can reprice or close it; a covariance across the whole portfolio, invisible to ROAS"
    introduced_in: channel-portfolio
  # --- Module 6: startup-finance ---
  - id: npv
    name: Net present value (NPV)
    definition: "Sum of discounted cash flows; the additive, scale-consistent decision rule other rules approximate"
    introduced_in: npv-and-irr
  - id: irr
    name: Internal rate of return (IRR)
    definition: "Discount rate at which NPV = 0; fails on ranking (crossing profiles) and existence/uniqueness (non-conventional flows)"
    introduced_in: npv-and-irr
  - id: capm-beta
    name: CAPM and beta
    definition: "Only systematic risk is priced: expected return = r_f + β(E[r_m] − r_f), with β the regression slope on the market"
    introduced_in: capm-and-wacc
  - id: equity-risk-premium
    name: Equity risk premium
    definition: "Expected market return over the riskless rate; historical estimates are noisy (~20%/√N s.e.), implied estimates are backed out of current prices"
    introduced_in: capm-and-wacc
  - id: wacc
    name: WACC
    definition: "Market-value-weighted average of after-tax debt cost and equity cost; the discount rate for unlevered firm cash flows"
    introduced_in: capm-and-wacc
  - id: revenue-recognition
    name: Revenue recognition
    definition: "Revenue is earned ratably as delivered, not when cash arrives; deferred revenue is the liability holding the difference"
    introduced_in: pnl-and-revenue-recognition
  - id: ebitda
    name: EBITDA and non-GAAP metrics
    definition: "Earnings before interest, taxes, depreciation, amortization; each further add-back (adjusted variants) is an argument to audit, not a fact"
    introduced_in: pnl-and-revenue-recognition
  - id: balance-sheet
    name: Balance sheet
    definition: "Assets = liabilities + equity at an instant; every income-statement flow casts a stock shadow here"
    introduced_in: balance-sheet-and-cash-flow
  - id: cash-flow-statement
    name: Cash flow statement
    definition: "Cash by operating/investing/financing activity; indirect method reconciles net income to cash via non-cash items and working capital"
    introduced_in: balance-sheet-and-cash-flow
  - id: working-capital
    name: Working capital
    definition: "Current assets minus current liabilities; its growth consumes cash — and SaaS prepay makes it negative, financing growth from customers"
    introduced_in: balance-sheet-and-cash-flow
  - id: driver-model
    name: Driver-based financial model
    definition: "Forecast where a small set of input drivers (acquisition, conversion, churn, pricing, hiring) computes the three statements"
    introduced_in: financial-model
  - id: burn-rate
    name: Burn rate
    definition: "Cash consumed per month; gross (all outflows) vs net (outflows minus revenue)"
    introduced_in: burn-runway-default-alive
  - id: runway
    name: Runway
    definition: "Months until cash reaches zero on the modeled trajectory; cash/net-burn only at zero growth"
    introduced_in: burn-runway-default-alive
  - id: default-alive
    name: Default alive / default dead
    definition: "Whether the company reaches profitability before zero cash at current growth and constant expenses (Graham); the first diagnostic question"
    introduced_in: burn-runway-default-alive
  - id: cap-table
    name: Cap table
    definition: "The ledger of who owns what, by share class, fully diluted; updated by every round, pool, and conversion"
    introduced_in: cap-table-and-dilution
  - id: pre-post-money
    name: Pre-money / post-money valuation
    definition: "Post = pre + raise; share price = pre / fully-diluted shares; new investor ownership = raise / post"
    introduced_in: cap-table-and-dilution
  - id: option-pool
    name: Option pool
    definition: "Shares reserved for employees; a pool created in the pre-money pushes its entire dilution onto existing holders"
    introduced_in: cap-table-and-dilution
  - id: dilution
    name: Dilution
    definition: "Reduction of an ownership fraction when new shares are minted; per-round arithmetic that compounds across rounds"
    introduced_in: cap-table-and-dilution
  - id: safe
    name: SAFE
    definition: "Simple agreement for future equity: money now for shares at the next priced round, on cap and/or discount terms; not debt, no maturity"
    introduced_in: safe-conversion
  - id: valuation-cap
    name: Valuation cap
    definition: "Post-money cap fixing ownership sold = amount/cap at signing; simultaneously the SAFE's price ceiling and the raise's hard ceiling"
    introduced_in: safe-conversion
  - id: conversion-discount
    name: Conversion discount
    definition: "Percentage off the priced-round share price at conversion; the SAFE converts at the better of discount price and cap price"
    introduced_in: safe-conversion
  - id: liquidation-preference
    name: Liquidation preference
    definition: "Preferred stock's right to be paid its money (1× or more) before common at exit; the greater-of clause against converting"
    introduced_in: liquidation-preferences-and-waterfall
  - id: participating-preferred
    name: Participating preferred
    definition: "Preference plus pro-rata share of the remainder (optionally capped); the capped variant has a flat zone of indifference in exit value"
    introduced_in: liquidation-preferences-and-waterfall
  - id: exit-waterfall
    name: Exit waterfall
    definition: "The seniority-ordered algorithm distributing exit proceeds through the preference stack down to common; payouts sum to exit value"
    introduced_in: liquidation-preferences-and-waterfall
  - id: esop
    name: ESOP
    definition: "Employee stock option plan: strike at 409A common value, vesting with cliffs; a call option on common stock"
    introduced_in: esop-and-option-pricing
  - id: binomial-pricing
    name: Binomial option pricing (CRR)
    definition: "Two-state replication per period gives C = [pC_u + (1−p)C_d]/r with p=(r−d)/(u−d); the n-step tree converges to Black–Scholes"
    introduced_in: esop-and-option-pricing
  - id: risk-neutral-valuation
    name: Risk-neutral valuation
    definition: "Price = discounted expectation under the risk-neutral probability p, independent of true probabilities and risk preferences; forced by no-arbitrage"
    introduced_in: esop-and-option-pricing
  - id: real-option
    name: Real option
    definition: "An investment decision with irreversibility and the ability to delay, valued as an option on the project rather than by static NPV"
    introduced_in: real-options
  - id: option-value-of-waiting
    name: Option value of waiting
    definition: "The value destroyed by investing now instead of waiting for information; makes the investment trigger V* = β/(β−1)·I exceed cost"
    introduced_in: real-options
  - id: power-law-returns
    name: Power-law returns
    definition: "Venture outcomes where a few investments dominate the sum (6% → 60% of returns); portfolio logic follows magnitude, not hit rate"
    introduced_in: venture-economics
  - id: kelly-criterion
    name: Kelly criterion
    definition: "Maximize E[log wealth] under reinvestment: bet the edge; over-betting a positive-EV opportunity ruins almost surely"
    introduced_in: venture-economics
  - id: arr-multiple
    name: ARR / revenue multiple
    definition: "EV per dollar of (forward or trailing) recurring revenue; a compressed DCF conditioned on growth, margin, and retention — and dated"
    introduced_in: valuation-multiples-and-dcf
  - id: rule-of-40
    name: Rule of 40 / Rule of X
    definition: "Growth% + FCF margin% ≥ 40 as an efficiency score; Rule of X weights growth ~2× because the market does"
    introduced_in: valuation-multiples-and-dcf
  - id: dcf
    name: Discounted cash flow valuation
    definition: "Enterprise value = PV of forecast free cash flows plus terminal value at WACC; the terminal assumption dominates and needs a multiple cross-check"
    introduced_in: valuation-multiples-and-dcf

outcomes:
  - id: co-cohort-models
    text: >-
      Fit probabilistic customer-base models (sBG, BG/NBD) to cohort data and
      compute retention projections, $\mathrm{CLV}$, and $P(\text{alive})$
      from them
    bloom: apply
  - id: co-unit-economics
    text: >-
      Judge a business's unit economics — margin, CAC, payback, NRR — from
      its own reported numbers, against the models rather than the folklore
      thresholds
    bloom: evaluate
  - id: co-pricing
    text: >-
      Estimate willingness-to-pay from elicitation data and connect price to
      churn, expansion, and margin
    bloom: apply
  - id: co-metric-design
    text: >-
      Design metric systems — driver trees, OEC, guardrails — and predict how
      a metric degrades once it becomes a target
    bloom: analyze
  - id: co-experiments
    text: >-
      Design and audit trustworthy A/B tests: power and MDE, sequential
      monitoring, variance reduction, and the standard pathologies
    bloom: evaluate
  - id: co-causal
    text: >-
      Estimate causal effects without a randomized experiment — DiD, IV,
      synthetic control — and effect heterogeneity (CATE), stating each
      method's identifying assumption
    bloom: apply
  - id: co-auctions
    text: >-
      Compute allocations, prices, and equilibrium bids in ad auctions (GSP,
      VCG, first-price with reserve) and derive the maximum bid and pacing
      policy a unit-economics model supports
    bloom: apply
  - id: co-channel-measurement
    text: >-
      Estimate channel contribution with MMM (adstock + saturation) and
      Shapley attribution, stating where each departs from incrementality
      and what experiment closes the gap
    bloom: analyze
  - id: co-organic-growth
    text: >-
      Model organic growth engines quantitatively — viral loops as branching
      processes, freemium and sales funnels, content as a depreciating asset
      — and allocate a channel portfolio under saturation and platform risk
    bloom: apply
  - id: co-statements
    text: >-
      Construct a driver-based financial model that produces linked P&L,
      balance sheet, and cash flow, and diagnose burn, runway, and
      default-alive status with uncertainty
    bloom: create
  - id: co-deal-math
    text: >-
      Compute ownership and exit proceeds through cap tables, option pools,
      SAFE conversions, and liquidation waterfalls
    bloom: apply
  - id: co-valuation
    text: >-
      Value a company by conditioned multiples and DCF, price option claims
      by risk-neutral replication, and judge deal terms against the
      power-law economics of venture portfolios
    bloom: evaluate
spine:
  - step: >-
      A business is a dataset: events roll up into funnels and cohorts, and
      the cohort matrix is the object every later quantity is computed from.
    label: The cohort matrix
    caption: >-
      One SaaS event log becomes a cohort × age matrix; retention curves are
      its rows read as survival data.
    lessons: [cohorts-and-funnels, retention-and-survival]
  - step: >-
      Aggregates mislead — heterogeneity plus sorting makes cohorts look
      increasingly loyal while no customer changes — so the customer words
      (churn, CLV, alive) are defined on a probability model of individuals
      and computed as its functionals.
    label: Model the individual
    caption: >-
      A beta-mixed coin flip projects retention to year 12 within 2–4%; the
      same machinery prices a customer and scores whether a silent one is
      still alive.
    lessons:
      - churn-and-the-sbg-model
      - customer-lifetime-value
      - repeat-purchase-models
      - clv-in-production
  - step: >-
      A customer's value is half of the unit; margin, acquisition cost,
      payback, and price close the loop, and the quoted ratios are folklore
      to be re-derived from the model, not recited.
    label: Closing the unit
    caption: >-
      From gross margin through CAC and the cash trough to a
      willingness-to-pay curve measured on 269 Dutch razor buyers.
    lessons:
      - margins-and-the-unit-pnl
      - cac-and-ltv-cac
      - payback-and-the-cash-trough
      - mrr-nrr-and-negative-churn
      - pricing-and-willingness-to-pay
  - step: >-
      Metrics assembled into systems steer companies — and predictably break
      when targeted; a real company's published numbers let the whole module
      be exercised end to end.
    label: Metrics as systems
    caption: >-
      A North Star decomposes into owned drivers; Goodhart's law says what
      happens next; HubSpot's five published quarters get a verdict.
    lessons: [north-star-and-metric-trees, goodharts-law, hubspot-unit-economics]
  - step: >-
      Deciding what to build is a causal question; cheap evidence
      (interviews, commitments) filters hypotheses, and randomized assignment
      is the only mechanism that makes a measured difference attributable to
      the change.
    label: Randomize
    caption: >-
      From Mom-Test interview rules to a Bing ad experiment worth $100M/year
      that sat unnoticed in the backlog for six months.
    lessons: [hypotheses-and-customer-evidence, ab-tests-and-randomization, power-and-mde]
  - step: >-
      The naive test lies in documented ways — peeking, between-user noise,
      gameable metrics, interference — and each failure mode has a named,
      deployed fix.
    label: Trustworthy testing
    caption: >-
      Always-valid p-values ship in Optimizely; CUPED halves Bing's traffic
      needs; guardrails and OEC design keep the wins honest.
    lessons:
      - peeking-and-always-valid-inference
      - variance-reduction-cuped
      - experiment-pathologies
      - oec-and-guardrails
      - bing-experimentation-program
  - step: >-
      When the fixed-horizon test is too expensive or impossible, allocation
      becomes the decision (bandits) or the counterfactual must be
      reconstructed from observational data under stated assumptions (DiD,
      IV, synthetic control).
    label: Beyond the A/B test
    caption: >-
      Thompson sampling trades measurement for regret; a weighted combination
      of donor states stands in for a California that never passed Prop 99.
    lessons:
      - multi-armed-bandits
      - difference-in-differences
      - instrumental-variables
      - synthetic-control
  - step: >-
      The average effect is not the decision: estimate the effect as a
      function of the customer, evaluate the targeting it implies, and turn
      "whom to treat" into an optimization with a confidence interval.
    label: From effect to policy
    caption: >-
      Honest causal forests score every customer; QINI curves and AIPW policy
      values grade the targeting rule on a real welfare-to-work experiment.
    lessons: [uplift-and-causal-forests, policy-learning-and-targeting]
  - step: >-
      A working unit and a working test still need distribution: channels are
      the search space, channel choice is a procedure (Bullseye), and every
      channel is a market that degrades as it is bought — the module's
      standing assumption.
    label: Channels are markets
    caption: >-
      Nineteen channels, a five-step selection algorithm, and Mint's actual
      channel-test spreadsheet — 116,725 users traced to their sources.
    lessons: [traction-and-bullseye]
  - step: >-
      Paid acquisition is an auction, so the CPC is an equilibrium price, not
      a fee: the mechanism (GSP/VCG/first-price with reserve) sets what a
      click costs, the budget's shadow price sets how to bid, and the CLV
      model from Part I sets the bid ceiling.
    label: The price of a click
    caption: >-
      From Vickrey's 1961 second-price argument to Google's 2019 first-price
      migration, ending with a max bid derived from the course's own sBG/CLV
      machinery.
    lessons:
      - ad-auctions-gsp-vcg
      - reserve-prices-and-first-price
      - bidding-and-pacing
      - roas-and-max-bid
  - step: >-
      Per-click measurement dies at the channel level — offline media,
      privacy walls, cross-channel journeys — so channel measurement becomes
      observational inference: MMM regressions from the top, attribution
      rules from the bottom, and neither is incrementality until an
      experiment anchors it.
    label: Measuring channels
    caption: >-
      Adstock and Hill curves fit real spend data that cannot identify their
      own parameters; Shapley credit collapses 43.8% → 4.4% under one filter.
    lessons: [media-mix-modeling, attribution-and-incrementality]
  - step: >-
      The unpaid channels carry their own mathematics: a viral loop is a
      branching process with a knife-edge at K=1, freemium is a funnel with
      measured benchmark rates, content is a depreciating asset, and sales
      is a capacity-constrained queue.
    label: Organic engines
    caption: >-
      Galton–Watson extinction, the Story of 1,000 Visitors, Dropbox's
      compounding cohorts, and the ACV↔CAC diagonal that decides which
      motion can exist.
    lessons:
      - virality-and-branching
      - plg-and-freemium
      - seo-and-content-economics
      - sales-motion-and-acv
  - step: >-
      A channel strategy is a portfolio under saturation, allocated by
      marginal — not average — returns, and exposed to platform risk that no
      ROAS shows; a real collapse closes the module.
    label: The channel portfolio
    caption: >-
      Marginal-ROAS equalization meets its limits in Zynga's filings: 86%
      revenue concentration on one platform, DAUs rising while bookings die.
    lessons: [channel-portfolio, zynga-channel-collapse]
  - step: >-
      Money has a time price: NPV names the discounting the course has done
      since CLV and defends it against IRR; CAPM/WACC says where the rate
      comes from — and where that machinery honestly breaks for startups.
    label: The discount rate
    caption: >-
      IRR fails on crossing profiles and multiple roots; Sharpe's 1964
      tangency argument prices only covariance; Damodaran's toolkit makes it
      operational.
    lessons: [npv-and-irr, capm-and-wacc]
  - step: >-
      The three statements are one linked system over the driver model:
      revenue recognition separates cash from earnings, the balance sheet
      reconciles them, the 24-month model forecasts them, and burn/runway is
      the survival read — stress-tested on a real S-1.
    label: Statements and survival
    caption: >-
      From deferred revenue to a Monte Carlo runway distribution, ending
      with WeWork's $47B lease bill read against its $4B backlog.
    lessons:
      - pnl-and-revenue-recognition
      - balance-sheet-and-cash-flow
      - financial-model
      - burn-runway-default-alive
      - wework-s1-reading
  - step: >-
      Ownership is a computation: priced rounds and pools dilute by
      arithmetic, SAFEs convert by formula, and at exit the cap table
      becomes an algorithm — the waterfall — that decides who gets what.
    label: Deal mechanics
    caption: >-
      The option-pool shuffle, the SAFE cap as a raise ceiling, and a $425M
      exit that left common with approximately nothing.
    lessons:
      - cap-table-and-dilution
      - safe-conversion
      - liquidation-preferences-and-waterfall
  - step: >-
      Every claim on uncertain value is an option: two-state replication
      prices employee options with no probabilities, reads common stock as a
      call on the firm, and — generalized — prices the startup's own choices
      to wait, stage, or abandon.
    label: Claims are options
    caption: >-
      CRR's binomial tree converges to Black–Scholes by n=150; the same
      argument shows the NPV rule undervalues waiting by a computable wedge.
    lessons: [esop-and-option-pricing, real-options]
  - step: >-
      Venture returns are power-law and valuation closes the loop: fund
      economics follow from the return distribution, multiples are
      compressed DCFs conditioned on growth/margin/retention, and the
      capstone runs the whole course from cohort events to a term-sheet
      verdict.
    label: Power laws and price
    caption: >-
      6% of deals make 60% of returns; the EMCLOUD multiple round-trips
      4.8×→16×→4.4×; one dataset ends as a valuation two ways.
    lessons: [venture-economics, valuation-multiples-and-dcf, course-capstone]
modules:
  - slug: customer-base
    title: "The customer base: retention, churn, and lifetime value"
    outcomes: [co-cohort-models]
    lessons:
      - slug: cohorts-and-funnels
        title: "Funnels, cohorts, and the cohort matrix"
        type: core
        status: drafted
        key_image: figures/matrix-reads.svg
        goal: >-
          Construct a funnel and a cohort matrix from an event log and read
          conversion, retention, and revenue off them
        opening: >-
          Every quantity in this course is computed from one object: the log
          of who did what, when — rolled up into a funnel and a cohort
          matrix.
        est_minutes: 28
        prerequisites: []
        concepts:
          introduces: [funnel, conversion-rate, cohort, cohort-matrix]
          reinforces: []
        key_ideas:
          - A funnel is a sequence of states with conversion rates between them; rates multiply along the path
          - A cohort groups customers by acquisition period; age and calendar time are different axes
          - The cohort matrix (cohort × age) is the course's master dataset; the retention triangle is its censored half
          - Blended aggregates mix cohorts of different ages and vintages; per-cohort reads do not
        demo: null
      - slug: retention-and-survival
        title: "Retention curves and survival analysis"
        type: core
        status: drafted
        key_image: figures/row-to-curve.svg
        goal: >-
          Compute survivor functions and retention rates from censored cohort
          data
        opening: >-
          A retention curve is a survival curve: the fraction of a cohort
          still active at each age, estimated from data in which most
          lifetimes are unfinished.
        est_minutes: 35
        prerequisites: [cohorts-and-funnels]
        concepts:
          introduces: [retention-curve, survivor-function, retention-rate, censoring, kaplan-meier]
          reinforces: [cohort, cohort-matrix]
        key_ideas:
          - "$S(t) = r_1 r_2 \\cdots r_t$: the survivor function is a product of period retention rates"
          - Censoring is the defining feature of live cohort data; ignoring it produces absurd estimates
          - The Kaplan–Meier product-limit estimator combines cohorts of different lengths correctly
          - Retention-curve shape diagnoses product-market fit; flattening is the signature to look for
        demo: null
      - slug: churn-and-the-sbg-model
        title: "Churn and the shifted-beta-geometric model"
        type: core
        status: drafted
        key_image: figures/sbg-projection.svg
        goal: >-
          Estimate the sBG model from a retention series by maximum
          likelihood and project the curve beyond the observed horizon
        opening: >-
          Cohort churn rates fall with tenure in nearly every dataset, and
          the intuitive explanation — customers grow loyal — is usually
          wrong.
        est_minutes: 40
        prerequisites: [retention-and-survival]
        concepts:
          introduces: [churn, sbg-model, sorting-effect]
          reinforces: [retention-rate, survivor-function, censoring]
        key_ideas:
          - Curve-fitting retention with regressions extrapolates catastrophically (−81% to +92% at year 12) despite in-sample $R^2$ up to .998
          - "sBG: constant individual churn probability $\\theta$, Beta($\\alpha,\\beta$) heterogeneity across customers"
          - "Aggregate retention $r_t = (\\beta+t-1)/(\\alpha+\\beta+t-1)$ rises by sorting alone — the ruse of heterogeneity"
          - MLE fits in a five-column spreadsheet; 7-year fit projects year 12 within 2–4%
        demo:
          component: SbgFitLab
          spec: >
            The High End segment's 7-year survival series (Fader & Hardie
            2007) plotted with years 8–12 held out. Reader first fits a
            quadratic (one click) and sees its year-12 error (+92%); then
            drags alpha and beta sliders to fit the sBG by eye, with live
            log-likelihood and year-12 projection error; an "MLE" button
            snaps to (0.668, 3.806). Task: beat the quadratic's holdout
            error by hand, then check how close manual fitting gets to the
            MLE. Second panel shows the implied Beta density updating.
      - slug: customer-lifetime-value
        title: "Customer lifetime value"
        type: core
        status: planned
        goal: >-
          Compute $\mathrm{CLV}$ and residual lifetime value as discounted
          expectations over a fitted churn model
        opening: >-
          The spreadsheet formula $\mathrm{CLV} = m/c$ prices a customer as
          margin over churn; it is biased in a knowable direction, and the
          survivor-function definition corrects it.
        est_minutes: 38
        prerequisites: [churn-and-the-sbg-model]
        concepts:
          introduces: [clv, discount-rate]
          reinforces: [sbg-model, survivor-function, churn, sorting-effect]
        key_ideas:
          - "$E(\\mathrm{CLV}) = \\sum_t m\\, S(t)/(1+d)^t$: value is margin weighted by survival and discount"
          - "Naive $m/c$ assumes constant retention; under heterogeneity it underestimates — $324 vs $362 CLV, $381 vs $568 RLV in the worked case"
          - Residual value of an existing customer exceeds the value of a new one — sorting again
          - "Monetary value needs its own submodel (Gamma-Gamma pointer); its independence assumption is checkable"
        demo: null
      - slug: repeat-purchase-models
        title: "Repeat purchase: BG/NBD and P(alive)"
        type: core
        status: planned
        goal: >-
          Compute $P(\text{alive})$ and expected future transactions from
          recency and frequency under the BG/NBD model
        opening: >-
          A subscription business observes churn; a store does not — in
          noncontractual settings a customer's death is latent, and the
          central problem is inferring it from purchase timing.
        est_minutes: 40
        prerequisites: [customer-lifetime-value]
        concepts:
          introduces: [contractual-noncontractual, bg-nbd, p-alive, rfm]
          reinforces: [churn, clv, sorting-effect, sbg-model]
        key_ideas:
          - The contractual/noncontractual divide is fundamental; Amazon's "76M active customers" is a window artifact, Vodafone's count is real
          - "Buy till you die: Poisson purchasing (gamma-mixed) plus a death process; BG/NBD makes it Excel-tractable"
          - "$(x, t_x, T)$ — frequency, recency, observation length — are sufficient statistics for every prediction"
          - The zero class matters — 1,411 silent CDNOW customers produced 18% of future transactions
        demo:
          component: PAliveExplorer
          spec: >
            Fitted CDNOW BG/NBD parameters (r=0.243, alpha=4.414, a=0.793,
            b=2.426) held fixed. Reader drags a customer's history on a
            timeline: number of purchases x, last-purchase time t_x, horizon
            T; live readouts of P(alive) and expected 39-week future
            purchases. Tasks: (1) hold x fixed and watch recency dominate;
            (2) reproduce the paradox of the heavy buyer gone quiet —
            find a history with 19 purchases and P(alive) below 0.3.
      - slug: clv-in-production
        title: "Customer-base analysis in production: CDNOW end to end"
        type: synthesis
        status: planned
        goal: >-
          Implement the CDNOW Pareto/NBD analysis with pymc-marketing and
          interpret its fit, diagnostics, and per-customer scores
        opening: >-
          The module's models ship in production libraries; this lesson runs
          the CDNOW cohort through pymc-marketing's Pareto/NBD and reads the
          output the way an operator would.
        est_minutes: 35
        prerequisites: [repeat-purchase-models]
        concepts:
          introduces: []
          reinforces: [bg-nbd, p-alive, rfm, clv, censoring, contractual-noncontractual]
        key_ideas:
          - RFM aggregation, MAP vs full-Bayes fitting, and posterior predictive checks on real data
          - "Customer 1413: 19 purchases, P(alive) ≈ 0.30 — frequency without recency is a churn signal"
          - Covariates enter on the mixing distributions; average spend cannot double as a covariate and a Gamma-Gamma input
          - Where production departs from the papers — priors, samplers, and the 1/10 sample caveat
        demo: null
        notes: >-
          Module application (L16): deployed-system read of pymc-marketing
          docs; every number reproducible from the cached notebook text.
  - slug: unit-economics
    title: "Unit economics and metric systems"
    outcomes: [co-unit-economics, co-pricing, co-metric-design]
    lessons:
      - slug: margins-and-the-unit-pnl
        title: "Gross margin, COGS, and the unit P&L"
        type: core
        status: planned
        goal: >-
          Assemble a monthly unit-level P&L from cohort metrics, separating
          bookings, billings, revenue, and contribution margin
        opening: >-
          Not every dollar of revenue is worth a dollar: gross margin decides
          how much of each subscription survives to pay for growth, and
          bookings, billings, and revenue are three different numbers.
        est_minutes: 34
        prerequisites: [customer-lifetime-value]
        concepts:
          introduces: [gross-margin, contribution-margin, bookings-billings-revenue]
          reinforces: [clv, cohort]
        key_ideas:
          - "COGS for software: hosting, support, and — for AI products — inference as a true variable cost"
          - Contribution margin is what a marginal customer adds after variable costs; it is the m in every CLV formula
          - "Bookings ≠ billings ≠ revenue: a $12,000 annual contract touches all three differently (deferred revenue)"
          - A monthly unit P&L assembled from cohort metrics is the bridge to Part IV's financial statements
        demo: null
      - slug: cac-and-ltv-cac
        title: "Customer acquisition cost and LTV:CAC"
        type: core
        status: planned
        goal: >-
          Evaluate an $\mathrm{LTV{:}CAC}$ ratio from first principles —
          blended vs paid CAC, margin adjustment, and the folklore thresholds
        opening: >-
          Customer acquisition cost is a quotient whose numerator and
          denominator are both choices — and the ratio built on it is a
          heuristic with documented exceptions, not a theorem.
        est_minutes: 32
        prerequisites: [margins-and-the-unit-pnl]
        concepts:
          introduces: [cac, ltv-cac-ratio]
          reinforces: [clv, gross-margin, churn]
        key_ideas:
          - "Blended vs paid CAC: dividing by all customers hides the marginal channel's cost"
          - "LTV = ARPA × GM% / churn is the folklore numerator; its lifetime term 1/c inherits the naive-CLV bias"
          - "The >3 guideline and its provenance: Skok's own hedging and later upward revision of the payback rule"
          - "HubSpot's published trajectory 1.7× → 4.7× as the running real case"
        demo: null
      - slug: payback-and-the-cash-trough
        title: "Payback period and the cash trough"
        type: core
        status: planned
        goal: >-
          Compute cumulative cash flow for a growing customer base and locate
          the payback period and maximum cash need
        opening: >-
          Acquisition is paid up front and recovered over the customer's
          lifetime, so growth consumes cash before it returns it — and the
          faster the growth, the deeper the trough.
        est_minutes: 32
        prerequisites: [cac-and-ltv-cac]
        concepts:
          introduces: [payback-period, cash-trough]
          reinforces: [cac, contribution-margin, gross-margin]
        key_ideas:
          - "Months to recover CAC = CAC / (ARPA × GM%): the liquidity metric, distinct from the profitability ratio"
          - One customer's cash curve vs a growing base's; re-entering the trough when growth accelerates
          - "Sales efficiency and the magic number are payback in disguise: efficiency 1.0 ≈ 12-month payback"
          - Payback discipline caps the affordable bid per customer — the bridge to channel economics
        demo:
          component: CashTroughLab
          spec: >
            Cumulative cash curve for a subscriber base with sliders for
            monthly new customers, growth rate of adds, CAC, ARPA, and gross
            margin; churn fixed from the running case. Live readouts of
            trough depth, trough month, and payback period. Tasks: (1) find
            the growth rate at which a $2M seed runs out before the curve
            turns; (2) show that halving payback lets the same cash fund
            double the growth. Presets: "steady", "hit the accelerator".
      - slug: mrr-nrr-and-negative-churn
        title: "MRR, NRR, and negative churn"
        type: core
        status: planned
        goal: >-
          Decompose MRR movement into new, expansion, and churned components
          and compute NRR and GRR from cohort revenue
        opening: >-
          Recurring revenue moves in exactly three ways — new, expansion,
          churned — and their net decides whether the installed base grows
          without any new acquisition.
        est_minutes: 30
        prerequisites: [cac-and-ltv-cac]
        concepts:
          introduces: [mrr, net-revenue-retention, negative-churn]
          reinforces: [churn, cohort-matrix, bookings-billings-revenue]
        key_ideas:
          - "Net new MRR = New + Expansion − Churned; the waterfall replaces 'bookings' as the operating metric"
          - Revenue churn ≠ customer churn whenever account sizes differ (10% of customers can be 3.4% of revenue)
          - "NRR = (start − churn + expansion)/start on a cohort; ≥120% is the public-SaaS norm"
          - "Negative churn compounds: the same bookings reach $140k vs $450k after 40 months at ±3% net churn"
        demo: null
      - slug: pricing-and-willingness-to-pay
        title: "Pricing and willingness-to-pay"
        type: core
        status: planned
        goal: >-
          Estimate an acceptable price range from Van Westendorp survey data
          and connect price to churn, expansion, and margin
        opening: >-
          Willingness-to-pay is measurable before launch: four questions
          asked against a price scale produce cumulative curves whose
          crossings locate the acceptable price range.
        est_minutes: 40
        prerequisites: [margins-and-the-unit-pnl, mrr-nrr-and-negative-churn]
        concepts:
          introduces: [willingness-to-pay, van-westendorp-psm, price-elasticity]
          reinforces: [contribution-margin, net-revenue-retention, churn]
        key_ideas:
          - "Van Westendorp PSM: cheap/expensive/too-cheap/too-expensive curves; IDP and OPP as crossings — the 1976 electric-razor data in full"
          - Psychological thresholds are visible in the data (the Dfl. 95→100 jump doubles the step)
          - "The WTP elicitation ladder: direct questions → purchase probability → conjoint → purchase simulation"
          - "Elasticity connects price to volume; margin connects price to survival: a price change moves churn and NRR, not just revenue per unit"
        demo: null
        notes: >-
          Monetizing Innovation is toc-only in the canon; use it for the
          elicitation ladder and failure taxonomy at pointer depth only —
          all worked numbers come from the fully-read Van Westendorp paper.
      - slug: north-star-and-metric-trees
        title: "North Star metrics and the metric tree"
        type: core
        status: planned
        goal: >-
          Decompose a revenue target into a tree of driver metrics and use it
          for forecasting and sensitivity analysis
        opening: >-
          A revenue target is not actionable until it is decomposed into a
          tree of driver metrics, each measurable, owned, and connected to
          the target by arithmetic.
        est_minutes: 30
        prerequisites: [mrr-nrr-and-negative-churn]
        concepts:
          introduces: [north-star-metric, metric-tree, simpsons-paradox]
          reinforces: [funnel, mrr, net-revenue-retention, conversion-rate]
        key_ideas:
          - "A metric tree is revenue (or the North Star) factored into drivers: traffic × conversion × ARPA × retention"
          - Forward planning runs the tree backwards — from target to required leads and capacity
          - "Mix effects and Simpson's paradox: every segment can improve while the aggregate falls"
          - Sensitivity ranks the drivers; the tree tells you which lever is worth an experiment
        demo: null
      - slug: goodharts-law
        title: "Goodhart's law and vanity metrics"
        type: core
        status: planned
        goal: >-
          Predict how a metric degrades once it becomes a target and diagnose
          gamed or vanity metrics in reported numbers
        opening: >-
          When a measure becomes a target, it ceases to be a good measure —
          the mechanism is selection and gaming, and it leaves diagnosable
          traces.
        est_minutes: 30
        prerequisites: [north-star-and-metric-trees]
        concepts:
          introduces: [goodharts-law, vanity-metric]
          reinforces: [north-star-metric, metric-tree, conversion-rate]
        key_ideas:
          - "The canonical phrasing is Strathern's (1997), popularizing Goodhart: the 2.1 exam grade as worked example"
          - A proxy decouples from its target exactly where optimization pressure is applied
          - "Vanity metrics: cumulative counts, window-dependent 'active' definitions, ratios with chosen denominators"
          - "Diagnostics: does the metric move the tree's parent? does it survive a definition change?"
        demo: null
      - slug: hubspot-unit-economics
        title: "Unit economics from a real company: HubSpot 2011–2012"
        type: synthesis
        status: planned
        goal: >-
          Judge HubSpot's unit economics from its five published quarters —
          lifetime, LTV, LTV:CAC, payback — and defend the verdict
        opening: >-
          HubSpot published five quarters of its own unit economics; the
          numbers are enough to compute the verdict they support.
        est_minutes: 35
        prerequisites: [payback-and-the-cash-trough, mrr-nrr-and-negative-churn, goodharts-law]
        concepts:
          introduces: []
          reinforces: [cac, ltv-cac-ratio, payback-period, churn, clv, net-revenue-retention, gross-margin]
        key_ideas:
          - "From the Forbes table: MRR churn 3.5% → 1.5% drives LTV:CAC 1.7× → 4.7× — retention, not CAC, was the lever"
          - Recompute every table cell from its neighbors; find which definitions HubSpot had to choose
          - "Segment-level economics reversed the channel strategy: direct 1.5 vs channel 5.0 → 12→2 direct reps"
          - Where the published table departs from the module's models — naive lifetime, no discounting, blended CAC
        demo: null
        notes: >-
          Module application (L16): reproduces a published company table and
          audits it with every module concept; verdict compared against what
          HubSpot actually did (channel reallocation, later IPO).
  - slug: experiments
    title: "Trustworthy experiments"
    outcomes: [co-experiments, co-metric-design]
    lessons:
      - slug: hypotheses-and-customer-evidence
        title: "Hypotheses and customer evidence"
        type: core
        status: planned
        goal: >-
          Evaluate pre-launch evidence — interviews, opinions, commitments —
          by its power to falsify a stated hypothesis
        opening: >-
          Most product beliefs die on contact with evidence, and the cheapest
          reliable evidence is what customers did and committed — never what
          they say they would do.
        est_minutes: 30
        prerequisites: []
        concepts:
          introduces: [falsifiable-hypothesis, commitment-currencies]
          reinforces: [conversion-rate]
        key_ideas:
          - A testable hypothesis names its success criterion ex ante; "we'll learn something" is not a criterion
          - "Mom Test rules: their life not your idea, specifics in the past, talk less"
          - "Bad data taxonomy: compliments, fluff ('I would definitely buy'), unexamined feature requests"
          - "Commitment currencies — time, reputation, money — order evidence by cost to fake"
        demo: null
        notes: >-
          The Mom Test is toc-only in the canon (reconstructed chapter notes
          in research/texts/); keep quotes marked as secondary-sourced.
      - slug: ab-tests-and-randomization
        title: "Controlled experiments and randomization"
        type: core
        status: planned
        goal: >-
          Design a trustworthy A/B test — randomization unit, variants, OEC —
          and validate it with sample-ratio and A/A checks
        opening: >-
          Randomized assignment is the only mechanism that makes the
          difference between two groups attributable to the change itself;
          everything else in experimentation protects that guarantee.
        est_minutes: 36
        prerequisites: [hypotheses-and-customer-evidence]
        concepts:
          introduces: [controlled-experiment, randomization-unit, oec, sample-ratio-mismatch, twymans-law]
          reinforces: [falsifiable-hypothesis, north-star-metric]
        key_ideas:
          - "The hierarchy of evidence: anecdote < observational < controlled < randomized < meta-analysis"
          - "Terminology that carries design decisions: OEC, variant, randomization unit (persistent, independent)"
          - "Trust checks before effect reads: SRM, A/A tests, Twyman's law for surprising results"
          - "Correlation traps on real data: the Office 365 crash–churn confound"
        demo: null
      - slug: power-and-mde
        title: "Statistical power and the minimum detectable effect"
        type: core
        status: planned
        goal: >-
          Compute an experiment's minimum detectable effect and required
          duration from traffic, baseline rate, and power
        opening: >-
          An experiment's sensitivity is fixed before it starts: traffic,
          baseline rate, and split determine the smallest effect it can
          detect, and the scaling is $1/\sqrt{n}$.
        est_minutes: 34
        prerequisites: [ab-tests-and-randomization]
        concepts:
          introduces: [statistical-power, mde]
          reinforces: [controlled-experiment, conversion-rate]
        key_ideas:
          - "Power, α, MDE, and n form one equation; fixing three sets the fourth"
          - "Detecting a 10× smaller effect costs 100× the sample: 10k users for 5%, 1M for 0.5%"
          - MDE is a negotiation object between product and data science, not a statistics afterthought
          - Underpowered experiments produce exaggerated significant effects (winner's curse)
        demo:
          component: MdePlanner
          spec: >
            Inputs: weekly traffic, baseline conversion, split, alpha, power.
            Output: MDE vs experiment-duration curve with the 1/sqrt(n)
            wall visible, plus a marker for the effect size the reader
            claims to care about. Tasks: (1) with 20k weekly users and 5%
            baseline, find the smallest relative lift detectable in 4 weeks;
            (2) find how long a 1% relative lift takes and conclude whether
            the experiment is worth running. Presets: "startup traffic",
            "Bing-scale".
      - slug: peeking-and-always-valid-inference
        title: "The peeking problem and always-valid p-values"
        type: core
        status: planned
        goal: >-
          Compute the false-positive inflation from continuous monitoring
          and correct it with always-valid inference (mSPRT)
        opening: >-
          Watching a p-value until it crosses 0.05 breaks the test: under
          continuous monitoring the nominal 5% false-positive rate inflates
          5–10×, and with enough patience approaches certainty.
        est_minutes: 40
        prerequisites: [power-and-mde]
        concepts:
          introduces: [peeking, always-valid-inference]
          reinforces: [statistical-power, controlled-experiment, sample-ratio-mismatch]
        key_ideas:
          - "The fixed-horizon p-value guarantee holds at n, not at a data-dependent stopping time"
          - "Post-hoc power checks and other heuristic fixes are equivalent to a smaller unstated α — still broken"
          - "mSPRT: a mixture likelihood-ratio martingale gives p-values valid at every stopping time"
          - "The deployed version: Optimizely's Stats Engine — monotone significance, reset policy, tiered priors"
        demo:
          component: PeekingSimulator
          spec: >
            Simulates 1,000 A/A experiments streaming in. Reader picks a
            monitoring policy: fixed-horizon read at n; peek every k
            observations and stop at p<0.05; or mSPRT always-valid. Live
            realized false-positive rate vs the nominal 5% line, plus one
            example p-value trajectory. Tasks: (1) show daily peeking pushes
            FPR past 20%; (2) find a peeking cadence that keeps naive FPR
            near 5% (there is none short of never); (3) switch to mSPRT and
            watch FPR pin to 5% at any cadence.
      - slug: variance-reduction-cuped
        title: "Variance reduction: CUPED"
        type: core
        status: planned
        goal: >-
          Derive the CUPED adjustment and compute its variance reduction from
          pre-experiment correlation
        opening: >-
          Most of an A/B metric's variance is between-user and predictable
          from the pre-experiment period; subtracting the predictable part
          shrinks variance by $1-\rho^2$ without biasing the estimate.
        est_minutes: 36
        prerequisites: [power-and-mde]
        concepts:
          introduces: [cuped]
          reinforces: [statistical-power, mde, controlled-experiment]
        key_ideas:
          - "Control variates: $\\hat{Y}_{cv} = Y - \\theta X + \\theta E[X]$ is unbiased for any θ; optimal θ gives var × (1−ρ²)"
          - "Randomization makes $E[X^t] = E[X^c]$ for any pre-experiment X — no need to know E[X]"
          - "Best covariate: the same metric, pre-period; ~50% reduction at Bing, <5% for revenue"
          - "The trap: an in-experiment covariate the treatment moves flips the sign of the estimate"
        demo: null
      - slug: experiment-pathologies
        title: "Experiment pathologies: interference, novelty, dilution"
        type: core
        status: planned
        goal: >-
          Analyze experiment readouts for interference, novelty and primacy
          effects, dilution, and segment traps
        opening: >-
          The A/B arithmetic assumes each user's outcome depends only on
          their own assignment and stays stable over time; real products
          violate both, in catalogued ways.
        est_minutes: 36
        prerequisites: [ab-tests-and-randomization, variance-reduction-cuped]
        concepts:
          introduces: [interference, novelty-effect, triggering]
          reinforces: [sample-ratio-mismatch, simpsons-paradox, cuped, randomization-unit]
        key_ideas:
          - "Interference (SUTVA violations): marketplaces and networks leak treatment across variants; cluster and switchback designs contain it"
          - Novelty and primacy make short-run effects lie about long-run ones; the ice-cube-in-a-cold-room threshold problem
          - "Triggering restricts analysis to affected users — and post-treatment triggering or covariates reintroduce bias"
          - "Segment reads reopen Simpson's paradox: the aggregate and every segment can disagree"
        demo: null
      - slug: oec-and-guardrails
        title: "OEC, guardrail metrics, and multiple comparisons"
        type: core
        status: planned
        goal: >-
          Construct an experiment scorecard — one OEC, guardrail metrics, and
          a multiple-comparisons correction
        opening: >-
          An experiment is scored by one overall evaluation criterion,
          protected by guardrail metrics, and corrected for how many things
          it measures.
        est_minutes: 34
        prerequisites: [ab-tests-and-randomization, goodharts-law]
        concepts:
          introduces: [guardrail-metric, multiple-comparisons]
          reinforces: [oec, goodharts-law, north-star-metric, twymans-law]
        key_ideas:
          - "An OEC is short-term measurable yet causally linked to the long-term objective — the hard design problem"
          - "Goodhart applies to OECs: gameability is a design criterion, not an afterthought"
          - "Guardrails: metrics you refuse to trade (latency, crashes, SRM); Flight 401 as the failure archetype"
          - "Many metrics × many variants: FWER (Bonferroni) vs FDR (Benjamini–Hochberg), and why Optimizely chose FDR"
        demo: null
      - slug: bing-experimentation-program
        title: "The Bing experimentation program"
        type: synthesis
        status: planned
        goal: >-
          Evaluate an experimentation program — win rate, velocity, revenue
          contribution — from Bing's published record
        opening: >-
          Bing's experimentation program is documented publicly in enough
          detail to audit: idea win rates, monthly revenue contributions, and
          the incidents its guardrails caught.
        est_minutes: 35
        prerequisites: [oec-and-guardrails, peeking-and-always-valid-inference, experiment-pathologies]
        concepts:
          introduces: []
          reinforces: [oec, guardrail-metric, twymans-law, statistical-power, controlled-experiment, mde]
        key_ideas:
          - "The $100M ad-title change sat in the backlog six months: teams cannot rank their own ideas"
          - "Win rates are low everywhere: ~1/3 at Microsoft, 10–20% at optimized products, 'nearly everything fails' at Etsy"
          - "Revenue accrues inch by inch: monthly experiment packages, including negative months (Fig 1.4)"
          - "Speed as money: 10ms of latency paid an engineer's year; guardrails caught the malware injection"
        demo: null
        notes: >-
          Module application (L16): audits a deployed experimentation program
          against the module's design rules; all numbers from Kohavi ch.1
          (the only fully-readable chapter — flag the toc-only remainder).
  - slug: causal-inference
    title: "Bandits and causal inference without experiments"
    outcomes: [co-causal, co-experiments]
    lessons:
      - slug: multi-armed-bandits
        title: "Multi-armed bandits"
        type: core
        status: planned
        goal: >-
          Select between bandit allocation and fixed-horizon testing by
          computing the regret of standard policies
        opening: >-
          When showing a losing variant has a cost, allocation itself becomes
          the decision: bandit algorithms trade measurement precision for
          regret.
        est_minutes: 40
        prerequisites: [power-and-mde]
        concepts:
          introduces: [multi-armed-bandit, regret, ucb, thompson-sampling]
          reinforces: [statistical-power, controlled-experiment, mde]
        key_ideas:
          - "Regret decomposition: $R_n = \\sum_a \\Delta_a E[T_a(n)]$ — every analysis bounds pulls of bad arms"
          - "Explore-then-commit is the A/B test in disguise; UCB and Thompson sampling adapt instead"
          - "Optimism and posterior sampling both achieve $O(\\sqrt{kn})$-type regret; greedy does not"
          - "Best-arm identification vs regret minimization: an A/B test is pure exploration — different objective, different optimum"
        demo:
          component: BanditArena
          spec: >
            A 3-armed Bernoulli bandit with hidden means. The reader
            allocates 100 pulls by clicking arms; UCB and Thompson sampling
            play the same budget in parallel on the same reward stream.
            Live cumulative-regret race and per-arm confidence intervals.
            Tasks: (1) beat Thompson's final regret; (2) replay with the
            same seed and a 50/50 fixed split to see what an A/B test pays
            for its measurement precision. Presets: "close arms",
            "one clear winner".
      - slug: difference-in-differences
        title: "Potential outcomes and difference-in-differences"
        type: core
        status: planned
        goal: >-
          Estimate a treatment effect by difference-in-differences and assess
          the parallel-trends assumption behind it
        opening: >-
          Without randomization the treated group's counterfactual must be
          constructed; difference-in-differences builds it from a control
          group's trend and one assumption — parallel trends.
        est_minutes: 40
        prerequisites: [ab-tests-and-randomization]
        concepts:
          introduces: [potential-outcomes, selection-bias, difference-in-differences, parallel-trends]
          reinforces: [controlled-experiment, cohort]
        key_ideas:
          - "Potential outcomes make 'the effect' precise: $Y_1 - Y_0$, observable only one side at a time"
          - "Observed difference = causal effect + selection bias; randomization zeroes the second term, nothing else does for free"
          - "DiD: subtract the control group's trend; parallel trends is the identifying assumption and it is partially testable"
          - "Bad controls: conditioning on post-treatment variables manufactures selection bias"
        demo: null
      - slug: instrumental-variables
        title: "Instrumental variables and noncompliance"
        type: core
        status: planned
        goal: >-
          Estimate a local average treatment effect from an encouragement
          design with noncompliance via the Wald/IV estimator
        opening: >-
          An experiment whose subjects ignore their assignment still
          identifies a causal effect — for exactly the subpopulation the
          assignment moved.
        est_minutes: 40
        prerequisites: [difference-in-differences]
        concepts:
          introduces: [instrumental-variable, intention-to-treat, late]
          reinforces: [potential-outcomes, selection-bias, controlled-experiment]
        key_ideas:
          - "ITT divides by compliance: the Bloom result ITT/P(comply) = TOT; JTPA's $3,970 vs $1,117 vs $1,825"
          - "LATE theorem: independence + exclusion + monotonicity identify the compliers' effect, no one else's"
          - Compliers, always-takers, never-takers — and why different instruments answer different questions
          - "Weak instruments bias IV toward OLS in proportion to 1/(F+1); the first-stage F is a design metric"
        demo: null
      - slug: synthetic-control
        title: "Synthetic control"
        type: core
        status: planned
        goal: >-
          Construct a synthetic control for a single treated unit and test
          the effect by placebo permutation
        opening: >-
          When a policy hits one unit — one state, one market — a weighted
          combination of untreated units can reproduce its pre-treatment path
          and stand in for its counterfactual.
        est_minutes: 36
        prerequisites: [difference-in-differences]
        concepts:
          introduces: [synthetic-control, placebo-inference]
          reinforces: [difference-in-differences, parallel-trends, potential-outcomes]
        key_ideas:
          - "Weights are convex and sparse: synthetic California is five states; the optimizer finds them, you can read them"
          - "Prop 99: ~26 packs/capita below counterfactual by 2000, where naive rest-of-US DiD understates"
          - "Inference by permutation: run every donor as a placebo; California's post/pre MSPE ratio is 1st of 39 (p = 1/39)"
          - Progressive MSPE cutoffs communicate robustness — a reusable reporting pattern
        demo:
          component: SyntheticControlLab
          spec: >
            California's cigarette-sales series 1970–2000 with donor-state
            weight sliders (the paper's five states plus 'everything else'
            grouped). Live pre-1988 MSPE and post-1988 gap. Buttons:
            rest-of-US average, paper's optimal weights. Tasks: (1) beat the
            rest-of-US average's pre-period fit by hand; (2) reach pre-MSPE
            < 5 and compare your post-gap to the paper's 26 packs; (3) note
            how gap size stabilizes once pre-fit is tight.
      - slug: uplift-and-causal-forests
        title: "Uplift modeling and causal forests"
        type: core
        status: planned
        goal: >-
          Estimate heterogeneous treatment effects (CATE) with honest causal
          forests and evaluate the targeting they imply
        opening: >-
          The average treatment effect is a summary over people it does not
          describe; uplift modeling estimates the effect as a function of the
          customer, with confidence intervals.
        est_minutes: 40
        prerequisites: [difference-in-differences]
        concepts:
          introduces: [cate, causal-forest, aipw, qini-curve]
          reinforces: [potential-outcomes, controlled-experiment, selection-bias]
        key_ideas:
          - "CATE $\\tau(x) = E[Y_1 - Y_0 \\mid X=x]$: subgroup hunting made estimable without pre-registration abuse"
          - "Honesty — split on one half, estimate on the other — is necessary: adaptive forests get worse with more data at the corners"
          - "AIPW doubly-robust scores: valid if either the outcome or the propensity model is right; cross-fitting required"
          - "A spread-out CATE histogram is not evidence of heterogeneity; QINI/RATE curves and calibration tests are"
        demo: null
      - slug: policy-learning-and-targeting
        title: "Policy learning and targeting"
        type: synthesis
        status: planned
        goal: >-
          Evaluate and learn a targeting policy from experimental data with
          AIPW scores, reproducing the GAIN policy-tree case
        opening: >-
          A targeting rule is a policy, and a policy's value is an estimable
          number; with it, whom-to-treat becomes an optimization with a
          confidence interval.
        est_minutes: 36
        prerequisites: [uplift-and-causal-forests]
        concepts:
          introduces: [policy-value]
          reinforces: [cate, aipw, qini-curve, causal-forest, commitment-currencies]
        key_ideas:
          - "Policy value $E[Y(\\pi(X))]$ estimated by sample means (RCT) or AIPW scores (observational)"
          - "Never threshold AIPW scores pointwise — they are noisy by construction; only averages are trustworthy"
          - "Empirical welfare maximization over a shallow tree class gives an interpretable, auditable policy"
          - "GAIN case: a depth-2 tree with real leaf counts, forbidden from splitting on race or gender — constraints are part of the policy class"
        demo: null
        notes: >-
          Module application (L16): reproduces the California GAIN policy
          tree and QINI evaluation from the Athey/Spiess/Wager course
          materials; states where unconfoundedness and cost assumptions
          depart from the idealisation.
  - slug: growth-channels
    title: "Growth channels: auctions, measurement, and organic engines"
    outcomes: [co-auctions, co-channel-measurement, co-organic-growth]
    lessons:
      - slug: traction-and-bullseye
        title: "Traction channels and the Bullseye framework"
        type: core
        status: planned
        goal: >-
          Select and rank growth channels with the five-step Bullseye
          process, scoring channel tests by cost per customer, volume, and
          fit
        opening: >-
          Distribution fails more startups than product: nineteen traction
          channels exist, founders reliably consider two of them, and
          channel choice is a search problem with a stated procedure.
        est_minutes: 30
        prerequisites: [cac-and-ltv-cac, hypotheses-and-customer-evidence]
        concepts:
          introduces: [traction-channels, bullseye-framework, channel-test]
          reinforces: [cac, falsifiable-hypothesis, commitment-currencies]
        key_ideas:
          - The 19-channel taxonomy is the search space; founder bias concentrates on SEM and PR and ignores the rest
          - "Bullseye is five steps — brainstorm, rank, prioritize, test, focus — not the folklore three"
          - "A channel test estimates three numbers: CAC, addressable volume, customer fit; Mint's real test spreadsheet is the worked case"
          - "Thiel's claim: one channel is usually optimal — focus dominates diversification early"
          - Channels degrade as they are bought — the module's standing assumption, formalized later as saturation
        demo: null
      - slug: ad-auctions-gsp-vcg
        title: "Ad auctions: second-price logic, GSP, and VCG"
        type: core
        status: planned
        goal: >-
          Compute allocations and payments under second-price, GSP, and VCG
          rules and exhibit the bid profile where GSP truth-telling fails
        opening: >-
          Every paid click is priced by an auction: the mechanism — not the
          advertiser's budget — decides what a click costs, and the three
          mechanisms in production differ in exactly computable ways.
        est_minutes: 40
        prerequisites: [traction-and-bullseye]
        concepts:
          introduces: [second-price-auction, gsp-auction, vcg-mechanism, quality-score]
          reinforces: [cac, conversion-rate]
        key_ideas:
          - "Vickrey 1961: pay the second-highest bid and truthful bidding becomes dominant — the founding argument, run in full"
          - "Position auctions: slots with CTRs $\\alpha_1 > \\alpha_2$; GSP charges each slot the next bid down, quality scores rescale bids"
          - "GSP ≠ VCG: the \\$10/\\$4/\\$2 example — truthful at CTRs 200/100, but at 200/199 shading to \\$3 pays \\$1,592 vs \\$1,200"
          - VCG charges the externality a bidder imposes; GSP's envy-free equilibrium replicates VCG payoffs without truthfulness
          - "Varian's empirical check: symmetric-equilibrium inequalities fit 2,425 real Google auctions within ~5.8% mean deviation"
        demo:
          component: AuctionLab
          spec: >
            Three advertisers with editable per-click values compete for two
            slots with editable CTRs (defaults: values $10/$4/$2, CTRs
            200/100 clicks/hr — the Edelman–Ostrovsky–Schwarz example).
            Reader sets each bid; per-bidder readouts of slot, price, and
            payoff under GSP and VCG side by side. Tasks: (1) bid truthfully
            and verify GSP revenue exceeds VCG ($1,000 vs $800); (2) switch
            CTRs to 200/199 and find the bid for the top bidder that beats
            truthful ($1,592 vs $1,200); (3) try to beat truthful bidding
            under VCG and fail. Presets: "EOS 200/100", "EOS 200/199".
      - slug: reserve-prices-and-first-price
        title: "Reserve prices, revenue equivalence, and the first-price migration"
        type: core
        status: planned
        goal: >-
          Derive the revenue-maximizing reserve price from virtual values
          and explain the 2019 migration of display auctions to first price
        opening: >-
          Under symmetric independent values the four standard auction
          formats raise the same expected revenue, so a seller who wants
          more must change the object being sold — and the cheapest change
          is a reserve price.
        est_minutes: 38
        prerequisites: [ad-auctions-gsp-vcg]
        concepts:
          introduces: [revenue-equivalence, myerson-reserve, bid-shading]
          reinforces: [second-price-auction, gsp-auction]
        key_ideas:
          - "Revenue equivalence: same allocation rule + same bottom-type payoff ⇒ same expected revenue (envelope argument)"
          - "Myerson: allocate by virtual value $\\psi(v) = v - \\frac{1-F(v)}{f(v)}$; uniform $[0,100]$ gives reserve 50, and $n{=}1$ recovers monopoly pricing"
          - The optimal reserve excludes bidders with positive value — revenue optimality is ex-post inefficient by design
          - "First-price equilibrium bids shade: $b = \\frac{n-1}{n}v$ under uniform values; the sawtooth instability that killed first-price in 2002 and the header-bidding stack that revived it in 2019"
          - Shading responsibility moves from the exchange to the bidder — floors and autobidders re-tune (the next lesson's subject)
        demo: null
      - slug: bidding-and-pacing
        title: "Budget pacing as constrained optimization"
        type: core
        status: planned
        goal: >-
          Derive the optimal bid under a budget constraint via Lagrangian
          duality and analyze adaptive pacing as gradient descent on the
          dual variable
        opening: >-
          An advertiser with a budget cannot pay true value for every click;
          the budget constraint prices itself, and the optimal bid is the
          value discounted by that shadow price.
        est_minutes: 36
        prerequisites: [ad-auctions-gsp-vcg]
        concepts:
          introduces: [budget-pacing, shadow-price]
          reinforces: [second-price-auction, bid-shading]
        key_ideas:
          - "The hindsight problem is a knapsack; Lagrangian relaxation solves it pointwise: bid $v/(1+\\mu)$"
          - "$\\mu$ is the budget's shadow price and the update is a one-line controller: overspend → raise $\\mu$, underspend → lower it"
          - "Balseiro–Gur: adaptive pacing is minimax-optimal (competitive ratio $\\rho/\\bar v$, matching a lower bound) and an approximate equilibrium when every bidder paces"
          - "The wealth ratio $\\rho/\\bar v$ decides whether truthful bidding is already optimal — how rich you must be to ignore pacing"
          - "On real auction data pacing beats truthful bidding by ~120% for budget-constrained advertisers and sits <1% from the hindsight optimum"
        demo: null
      - slug: roas-and-max-bid
        title: "ROAS, target CPA, and the maximum bid from CLV"
        type: core
        status: planned
        goal: >-
          Derive the maximum affordable bid and target CPA from the
          course's CLV model and payback constraint, and connect ROAS
          targets to contribution margin
        opening: >-
          The bid cap an autobidder needs is a unit-economics number: what a
          click may cost is derived from what the customer it might become
          is worth.
        est_minutes: 34
        prerequisites: [bidding-and-pacing, payback-and-the-cash-trough, customer-lifetime-value]
        concepts:
          introduces: [roas, target-cpa]
          reinforces: [clv, cac, payback-period, contribution-margin, gross-margin, budget-pacing]
        key_ideas:
          - "The conversion chain: max CPA = allowed CAC × p(customer|conversion); max CPC = CPA × p(conversion|click) — each link measured, each multiplies uncertainty"
          - "Allowed CAC has two caps from Part I: the payback ceiling (liquidity) and margin-adjusted CLV (profitability); the tighter one binds"
          - "ROAS = revenue/spend hides margin and time; breakeven ROAS = 1/GM%, and contribution-ROAS with a payback window is the honest target"
          - "The full stack in one line: sBG survival → CLV → CAC cap → $\\mu$-shaded bid — Part I's model is literally the bid"
          - Bid caps computed from blended averages overpay for marginal customers — the marginal/average gap returns at the bid level
        demo: null
      - slug: media-mix-modeling
        title: "Marketing mix modeling: adstock, saturation, and Bayesian regression"
        type: core
        status: planned
        goal: >-
          Estimate channel response with an adstock-plus-Hill regression and
          diagnose which parameters the data can and cannot identify
        opening: >-
          Where per-click tracking fails — offline media, privacy walls —
          channel measurement falls back to a regression of sales on spend,
          and everything rides on two transformations: carryover and
          saturation.
        est_minutes: 40
        prerequisites: [roas-and-max-bid, difference-in-differences]
        concepts:
          introduces: [mmm, adstock, hill-saturation]
          reinforces: [roas, parallel-trends, selection-bias, controlled-experiment]
        key_ideas:
          - "Adstock (Broadbent 1979): geometric carryover $w_l = \\alpha^l$, reported as a half-life; delayed adstock adds a peak lag"
          - "Hill saturation $\\mathrm{Hill}(x) = 1/(1+(x/K)^{-S})$: half-saturation $K$, shape $S$; the reach curve is $S{=}1$"
          - "The canonical MMM: $y_t = \\tau + \\sum_m \\beta_m \\mathrm{Hill}(\\mathrm{adstock}(x_m)) + \\gamma z_t$; priors matter because two years of weekly data is short"
          - "Identifiability is the trap: visually identical curves from wildly different $(K,S,\\beta)$, and small samples bias the response 18–40% low"
          - "Confounded by design (spend follows demand): calibration against lift experiments — Robyn's third objective — is what makes MMM causal"
        demo: null
      - slug: attribution-and-incrementality
        title: "Attribution: Shapley credit and the incrementality gap"
        type: core
        status: planned
        goal: >-
          Compute Shapley-value attribution over channel coalitions and
          demonstrate why no attribution scheme measures incrementality
        opening: >-
          Attribution distributes credit for conversions that happened;
          incrementality asks which conversions would not have happened —
          different questions, and the industry systematically confuses
          them.
        est_minutes: 38
        prerequisites: [media-mix-modeling]
        concepts:
          introduces: [multi-touch-attribution, shapley-attribution, incrementality]
          reinforces: [mmm, controlled-experiment, potential-outcomes]
        key_ideas:
          - "Rule-based models (last/first-touch, linear, position) are arbitrary weightings; three axioms — efficiency, dummy, symmetry — select the Shapley value"
          - "The simplified formula $\\phi_j = \\sum_S \\frac{1}{|S|+1} R(S \\cup \\{j\\})$ computes in one pass: 17 hours → 2 minutes on 18 channels"
          - "The attribution paradox: paid search's touchpoint-1 credit falls 43.8% → 8.3% → 4.4% as single- and two-channel journeys are filtered — segment before you trust"
          - "Attribution ≠ incrementality: 10 attributed conversions can be 3 incremental ones; measured marketing incrementality typically runs 0–25%"
          - "Incrementality requires a counterfactual — holdouts and geo experiments (Part II machinery); attribution for in-flight allocation, experiments for truth, MMM calibrated between"
        demo: null
      - slug: virality-and-branching
        title: "Virality: the K-factor as a branching process"
        type: core
        status: planned
        goal: >-
          Compute extinction probability, subcritical amplification, and
          cycle-time effects for a viral loop modeled as a Galton–Watson
          process
        opening: >-
          A viral loop is a branching process: each user recruits a random
          number of new users, and one number — the mean of that
          distribution — separates loops that die from loops that explode.
        est_minutes: 40
        prerequisites: [traction-and-bullseye]
        concepts:
          introduces: [k-factor, galton-watson-process, extinction-probability, viral-cycle-time]
          reinforces: [retention-curve, conversion-rate]
        key_ideas:
          - "$K$ = invites sent × conversion per invite; generations compose through the PGF: $f_n = f \\circ \\cdots \\circ f$, $E[Z_n] = K^n$"
          - "Extinction theorem: $q$ is the smallest root of $f(s) = s$; $q = 1$ iff $K \\le 1$ — the knife edge, proved with the fixed-point diagram"
          - "Real products are subcritical: $K < 1$ still multiplies every acquired user by $1/(1-K)$ — K=0.7 turns 1,000 paid signups into 3,333 users"
          - "Cycle time compounds: users(t) ∝ $K^{t/c}$; halving $c$ beats a +0.1 improvement in $K$ almost everywhere in the feasible range"
          - "Certain extinction is not fast extinction: at $K = 1$ the loop dies with probability 1 but infinite expected time, $P(\\tau > n) \\sim 2/(\\sigma^2 n)$"
        demo:
          component: BranchingLab
          spec: >
            Offspring distribution set by two sliders (invites per user,
            conversion per invite) giving K; cycle-time slider. One click
            seeds 100 users and simulates the invite tree generation by
            generation: active-users and cumulative-users curves, plus the
            f(s) fixed-point diagram with the extinction root marked. Live
            readouts: empirical extinction fraction vs theoretical q,
            realized amplification vs 1/(1−K). Tasks: (1) find the K where
            cumulative users switch from saturating to exploding; (2) at
            K=0.7 verify 1,000 seeds end near 3,333; (3) hold K fixed,
            halve cycle time, and compare the growth-rate change against
            raising K by 0.1. Presets: "subcritical 0.7", "critical 1.0",
            "supercritical 1.2".
      - slug: plg-and-freemium
        title: "Product-led growth and freemium economics"
        type: core
        status: planned
        goal: >-
          Analyze freemium and free-trial funnels against benchmark
          conversion data and evaluate PLG economics on Dropbox's published
          cohorts
        opening: >-
          In product-led growth the product is the channel: acquisition,
          conversion, and expansion happen in-product, and the funnel
          arithmetic differs from sales-led in measured, benchmarked ways.
        est_minutes: 36
        prerequisites: [virality-and-branching, mrr-nrr-and-negative-churn]
        concepts:
          introduces: [product-led-growth, freemium-conversion, pql]
          reinforces: [funnel, net-revenue-retention, k-factor, cohort, conversion-rate]
        key_ideas:
          - "The Story of 1,000 Visitors: freemium converts 60 signups → 3 paying, free trial 40 → 7 — more top-of-funnel, lower close rate; self-serve share 65% vs 20%"
          - "A free tier is channel spend, not lost revenue: its cost buys exposure, virality surface, and an option on conversion — ~5% of freemium signups ever pay"
          - "PLG metrics: activation 20–40%, PQLs (45% of freemium companies score them), NDR 130–150% best-in-class; PLG underperforms below $10M ARR and outgrows 2× above it"
          - "Dropbox's S-1 numbers: >90% self-serve revenue, cohort revenue doubling in under 3 years, 40% of business teams seeded by individual subscribers"
          - "Cannibalization boundary: the free tier competes with paid exactly where WTP overlaps — price-fence design is the pricing lesson's machinery reapplied"
        demo: null
      - slug: seo-and-content-economics
        title: "SEO and content as an amortizable asset"
        type: core
        status: planned
        goal: >-
          Compute the value of a content portfolio as depreciating capital —
          perpetual-inventory stock, decay rate, and portfolio NPV
        opening: >-
          Paid traffic stops when spend stops; a ranking article keeps
          yielding visitors — so the correct economics treat content spend
          as investment in a decaying asset, even though GAAP forbids
          putting it on the balance sheet.
        est_minutes: 34
        prerequisites: [media-mix-modeling]
        concepts:
          introduces: [content-asset, compounding-channel]
          reinforces: [adstock, clv, discount-rate, cac]
        key_ideas:
          - "A compounding channel accrues to a stock, not a flow: traffic(t) = yield on accumulated content capital; the stair-step growth signature"
          - "Perpetual inventory $G_t = (1-\\delta)G_{t-1} + I_t$ — the adstock recursion at asset scale; Peters & Taylor capitalize R&D at δ=15%, organizational capital at 20%"
          - "Decay rates are uncertain by ×2: purchase-price allocations imply 32% average R&D depreciation (range 25–49% by industry) — sensitivity analysis is mandatory"
          - "Portfolio NPV: an article is an upfront cost plus a decaying traffic × conversion × CLV annuity; rank outcomes are skewed, so the portfolio — not the article — is the unit"
          - "This lesson is course-original synthesis: ASC 350-50/730 expense content, so the model and the books will disagree — on purpose"
        demo: null
        notes: >-
          No canonical SEO-NPV source exists; the lesson adapts Peters &
          Taylor's capitalization machinery (fully read) plus Broadbent's
          decay and Part I's CLV. Flag the synthesis honestly in prose.
      - slug: sales-motion-and-acv
        title: "Sales motion: ACV, the bowtie funnel, and rep capacity"
        type: core
        status: planned
        goal: >-
          Analyze a sales-led funnel as a throughput system — stages, cycle
          time, quota capacity — and calibrate ACV against CAC and payback
        opening: >-
          A sales-led channel is a throughput system staffed by
          quota-carrying humans: what a deal may cost to win is set by its
          contract value, and 72–93% of that value arrives after the close.
        est_minutes: 34
        prerequisites: [traction-and-bullseye, payback-and-the-cash-trough]
        concepts:
          introduces: [acv, bowtie-funnel, sales-capacity]
          reinforces: [cac, payback-period, net-revenue-retention, funnel]
        key_ideas:
          - "The ACV↔CAC diagonal: viable motions pair self-serve with <\\$1k ACV up through field sales at \\$100k+; off-diagonal cells die by payback arithmetic"
          - "The bowtie: the pre-close funnel mirrored by onboard → impact → expand, instrumented per stage with conversion rates and stage times (VM/CR/Δt)"
          - "Capacity model: bookings ceiling = reps × quota × ramp; the hiring plan is the revenue driver — Enterprise revenue is headcount-driven, not demand-driven"
          - "Sales efficiency and the magic number are payback in channel form — the Part I metric wearing a sales suit"
          - "72–93% of lifetime value lands post-close: staffing follows NRR, not just new bookings"
        demo: null
      - slug: channel-portfolio
        title: "The channel portfolio: saturation, allocation, and platform risk"
        type: core
        status: planned
        goal: >-
          Design a budget allocation across channels that equates marginal
          returns under saturation, and evaluate concentration and platform
          risk
        opening: >-
          Every channel saturates, so the optimal allocation equalizes
          marginal — not average — returns; and a portfolio concentrated on
          a platform someone else owns carries a risk no ROAS report shows.
        est_minutes: 34
        prerequisites: [attribution-and-incrementality, plg-and-freemium, sales-motion-and-acv]
        concepts:
          introduces: [marginal-cac, channel-portfolio, platform-risk]
          reinforces: [hill-saturation, shadow-price, roas, bullseye-framework, mmm]
        key_ideas:
          - "Marginal CAC rises along the Hill curve; average ROAS overstates the next dollar — the marginal/average gap becomes the allocation principle"
          - "Optimal split: equalize mROAS across channels at a portfolio-wide shadow price — the pacing Lagrangian one level up"
          - "The optimum is uncertain: posterior optimal-mix distributions can be bimodal (all-in or nothing on TV) — allocate by posterior, not point estimate"
          - "Bullseye revisited quantitatively: focus while marginal returns dominate, diversify at saturation; re-test on a cadence because channels degrade and platforms reprice"
          - "Platform risk is a covariance: one counterparty's policy change moves the whole portfolio at once — the next lesson runs the canonical case"
        demo: null
      - slug: zynga-channel-collapse
        title: "Channel collapse in the filings: Zynga 2011–2012"
        type: synthesis
        status: planned
        goal: >-
          Analyze Zynga's virality-driven rise and platform-dependent
          collapse from its S-1 and FY2012 10-K
        opening: >-
          Zynga's S-1 leads with 232 million monthly users and lists
          Facebook dependency as its first risk factor; eighteen months
          later the 10-K prices that dependency at 86% of revenue — the
          collapse was computable in advance.
        est_minutes: 38
        prerequisites: [channel-portfolio, virality-and-branching, goodharts-law]
        concepts:
          introduces: []
          reinforces: [k-factor, platform-risk, vanity-metric, bookings-billings-revenue, channel-portfolio, goodharts-law]
        key_ideas:
          - "Before/after filing pair: the S-1's qualitative risk factor #1 becomes the 10-K's 81% of bookings / 86% of revenue — read filings for the number that is missing"
          - "Metric divergence: 2012 record DAUs/MAUs while bookings decline for the first time — double-counted actives and vanity metrics, Goodhart in an audited document"
          - "Engineered K: the zBar cross-promotion strip inflated per-game counts; OMGPOP bought for \\$183M in March, \\$95.5M written off by Q3 — a viral spike traded at peak"
          - "The 30% platform tax, the Credits discontinuation, and the stock's \\$15.91 → \\$2.36 path — one channel, one counterparty, repriced unilaterally"

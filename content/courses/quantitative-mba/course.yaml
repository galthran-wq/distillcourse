          value the company two ways
        opening: >-
          One dataset, every part of the course: cohort events at one end, a
          defensible valuation and a term-sheet verdict at the other, with
          every intermediate number checkable against the models that
          produced it.
        est_minutes: 45
        prerequisites: [valuation-multiples-and-dcf, venture-economics]
        concepts:
          introduces: []
          reinforces: [sbg-model, clv, cac, driver-model, runway, safe, exit-waterfall, arr-multiple, dcf, power-law-returns]
        key_ideas:
          - "The pipeline: cohort matrix → sBG fit → CLV → channel plan and CAC caps → 24-month driver model → runway → raise size"
          - "The round: outstanding SAFEs convert, the pool tops up, the priced round closes; the waterfall is stress-tested at three exit values"
          - "The valuation: a dated EMCLOUD comp multiple vs the driver-model DCF — reconciled, with the gap explained"

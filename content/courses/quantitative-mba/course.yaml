      - slug: cap-table-and-dilution
        title: "The cap table: priced rounds, option pools, and dilution"
        type: core
        status: planned
        goal: >-
          Compute ownership through priced rounds — share price, pre/post
          money, option-pool placement, pro-rata — on a full cap table
        opening: >-
          Ownership is a spreadsheet with conservation laws: every round
          prices the company, mints shares, and dilutes everyone — by
          amounts that depend on clause placement more than on the headline
          valuation.
        est_minutes: 38
        prerequisites: [burn-runway-default-alive]
        concepts:
          introduces: [cap-table, pre-post-money, option-pool, dilution]
          reinforces: [runway, burn-rate]
        key_ideas:
          - "Share price = pre-money / fully-diluted shares; post = pre + raise; new ownership = raise / post — three identities that settle most arguments"
          - "The option-pool shuffle: a pool created 'in the pre-money' pushes 100% of its dilution onto existing holders at the same headline valuation"
          - "Pool sizing needs the self-dilution correction — a target %pool costs %/(1−%) because the pool dilutes itself"
          - "Two rounds with pro-rata: keeping your percentage costs money every round; the follow-on arithmetic worked end to end"
          - "Venture Deals framing: a term sheet splits into economics and control; the cap table records only the economics — control comes back at the waterfall"
        demo: null
      - slug: safe-conversion
        title: "SAFE conversion mechanics"
        type: core
        status: planned
        goal: >-
          Compute SAFE conversions — post-money cap, discount, MFN — into a
          priced round and the resulting founder dilution
        opening: >-
          A post-money SAFE fixes ownership at signing: purchase amount over
          valuation cap, counted before the priced round and its pool —
          which makes the cap a hard ceiling on how much can be raised.
        est_minutes: 36
        prerequisites: [cap-table-and-dilution]
        concepts:
          introduces: [safe, valuation-cap, conversion-discount]
          reinforces: [cap-table, dilution, pre-post-money]
        key_ideas:
          - "The instrument: not debt, no maturity, converts at the next priced round; cap-only, discount-only, and MFN flavors from the actual YC templates"
          - "Conversion price = greater-of(round price × (1−discount), cap / Company Capitalization); the Company Capitalization definition is where post-money lives"
          - "Post-money vs the original pre-money safe: one inclusion/exclusion table explains the 2018 redesign — ownership certainty for the investor, modeling certainty for the founder"
          - "Ownership sold = amount/cap, so raising the cap amount hands over 100%: the \\$5M-cap table runs 90% / 50% / 0% founder ownership"
          - "Stacked safes plus a Series A: the full dilution cascade (52.6% in the worked case) — and the safe's liquidity-event greater-of clause as a forward pointer to options"
        demo: null
      - slug: liquidation-preferences-and-waterfall
        title: "Liquidation preferences and the exit waterfall"
        type: core
        status: planned
        goal: >-
          Compute exit proceeds through a preference stack — seniority,
          participation, caps, conversion — and locate each class's
          conversion point
        opening: >-
          At exit the cap table stops being percentages and becomes an
          algorithm: senior claims are paid first, and each preferred class
          takes the greater of its preference and its as-converted share.
        est_minutes: 40
        prerequisites: [safe-conversion]
        concepts:
          introduces: [liquidation-preference, participating-preferred, exit-waterfall]
          reinforces: [cap-table, safe, dilution]
        key_ideas:
          - "The waterfall algorithm: order tranches by seniority; per tranche compute residual → preference → greater-of(preference, convert) → subtract and descend; common is the residual claimant"
          - "Participation regimes: non-participating (either/or), full participating (both), capped participating — and the zone of indifference where a capped class's payout is flat in exit value"
          - "Employees are paid last: a \\$425M exit under a large enough stack leaves common with approximately nothing — Good Technology as the named case"
          - "Downside protection reprices the round: with preferences, two rounds at the same 'valuation' are different securities — the headline number is not the price"
          - "Conservation as a self-check: payouts must sum to exit value at every point; kinks in the payout diagram are conversion points (the next lesson prices them)"
        demo:
          component: WaterfallLab
          spec: >
            A cap table with common plus two preferred series (editable
            invested amounts, 1× preferences, seniority order); per-series
            toggle non-participating / participating / capped-2×; exit-value
            slider $0–500M. Stacked payout bars by class plus per-class
            payout-vs-exit curves with conversion points marked; readout
            asserts payouts sum to exit value. Tasks: (1) find the exit
            value where Series B rationally converts to common; (2) enable
            capped participation and locate the flat zone of indifference;
            (3) build a $425M exit under which common receives ~nothing,
            then find the minimum exit at which common clears $50M.
            Presets: "clean 1× stack", "participating heavy".
      - slug: esop-and-option-pricing
        title: "Employee options and binomial pricing"
        type: core
        status: planned
        goal: >-
          Compute employee-option values with the binomial risk-neutral model
          and interpret common stock itself as an option on firm value
        opening: >-
          An employee option's value is not a matter of opinion: a two-state
          replication argument prices it without anyone's risk preferences,
          and iterating the argument prices anything with a payoff diagram.
        est_minutes: 40
        prerequisites: [liquidation-preferences-and-waterfall]
        concepts:
          introduces: [esop, binomial-pricing, risk-neutral-valuation]
          reinforces: [exit-waterfall, liquidation-preference, cap-table, discount-rate]
        key_ideas:
          - "ESOP mechanics: strike, vesting and cliffs, 409A common-stock valuations — why the strike sits far below the preferred price"
          - "CRR one period: replicate the option with Δ shares + B bonds; $C = [pC_u + (1-p)C_d]/r$, $p = (r-d)/(u-d)$ — no true probabilities enter"
          - "The n-step tree by backward induction; convergence to Black–Scholes — exact to the penny by n = 150; the formula as a limit, no stochastic calculus"
          - "Equity as a call on firm value (Black–Scholes 1973, footnote 1): the waterfall's kinked payoffs are option portfolios, so last lesson's diagram is priceable"
          - "What a grant is worth vs what it feels like: strike, preference stack, dilution, and vesting all bite — a worked honest valuation of a real-shaped offer"
        demo: null
      - slug: real-options
        title: "Real options: the value of waiting"
        type: core
        status: planned
        goal: >-
          Evaluate irreversible investment decisions as options — compute
          the option value of delay and the investment trigger the NPV rule
          misses
        opening: >-
          The NPV rule says invest when value exceeds cost; with
          irreversibility and the ability to wait that rule is wrong,
          because exercising kills an option and the full cost includes it.
        est_minutes: 36
        prerequisites: [esop-and-option-pricing, npv-and-irr]
        concepts:
          introduces: [real-option, option-value-of-waiting]
          reinforces: [npv, binomial-pricing, risk-neutral-valuation]
        key_ideas:
          - "The widget factory: invest-now NPV \\$300 vs wait-and-invest-on-good-news \\$386 — computed twice, by direct comparison and by lesson-11 replication, same answer"
          - "Comparative statics: breakeven sunk cost \\$642 and breakeven probability 0.88 — where 'now' and 'wait' switch"
          - "The trigger result: invest at $V^* = \\frac{\\beta}{\\beta-1}I > I$; uncertainty widens the wedge — the classical NPV threshold is the zero-volatility limit"
          - "Hysteresis: paired entry and exit costs create a band of inaction — operating at a loss and declining to enter at a profit are both rational"
          - "Startup readings: runway buys options, staged rounds are compound options, a pivot is an abandonment option — with the pseudo-precision warning attached"
        demo: null
      - slug: venture-economics
        title: "Venture economics: the power law and the Kelly criterion"
        type: core
        status: planned
        goal: >-
          Explain investor behavior from the power-law return distribution —
          fund arithmetic, portfolio expectation, and Kelly sizing
        opening: >-
          Venture returns are not normal: in forty years of Horsley Bridge
          fund data, six percent of investments produce sixty percent of
          returns, and every rational behavior of a venture fund follows
          from that distribution.
        est_minutes: 38
        prerequisites: [liquidation-preferences-and-waterfall]
        concepts:
          introduces: [power-law-returns, kelly-criterion]
          reinforces: [exit-waterfall, clv, npv]
        key_ideas:
          - "Fund arithmetic: 2/20, ~3× gross target, 10-year life — each check must be able to return the fund, which fixes ownership targets and stage math"
          - "The Babe Ruth effect: the best funds strike out MORE (loss rates U-shaped in fund quality) and their winners are 70× vs 20× — magnitude, not batting average"
          - "Founder–investor misalignment is structural: a fund's optimal risk appetite on any single company exceeds the founder's — kill-or-cure is portfolio-rational"
          - "Kelly 1956: maximize E[log wealth] ⇒ bet the edge; over-betting a positive-EV opportunity ruins with probability 1 — reserves and check sizing as fractional Kelly"
          - "What the LP sees: TVPI/DPI/IRR and vintage dispersion, read against the return distribution rather than the average"
        demo: null
      - slug: valuation-multiples-and-dcf
        title: "Valuation: ARR multiples, Rule of 40, and DCF"
        type: core
        status: planned
        goal: >-
          Evaluate a SaaS company's value two ways — market multiples
          conditioned on growth, margin, and retention, and a driver-model
          DCF — and reconcile the gap
        opening: >-
          A multiple is a compressed DCF: what the market pays per dollar of
          ARR moves with growth, margin, and retention, and thirteen years
          of the EMCLOUD index show the compression constant is anything but
          constant.
        est_minutes: 40
        prerequisites: [capm-and-wacc, financial-model]
        concepts:
          introduces: [arr-multiple, rule-of-40, dcf]
          reinforces: [wacc, net-revenue-retention, gross-margin, driver-model, npv]
        key_ideas:
          - "Multiple mechanics: EV/ARR, forward vs trailing, and the 25× spread inside one 64-company index (34.7× to 1.3×) — 'the SaaS multiple' does not exist"
          - "Rule of 40 (growth + FCF margin) and Rule of X (2×growth + margin): what the cross-section actually prices, computable from any company's two numbers"
          - "Multiple compression as history: median 4.8× → 16× (Feb 2021) → 4.4× (2026) — date every comp, or it lies"
          - "DCF from the driver model: FCF → WACC → terminal value; the terminal value dominates and must be cross-checked against an exit multiple"
          - "Reconciliation discipline: when DCF and multiples disagree, the gap is information about assumptions or about the market — say which"
        demo: null
      - slug: course-capstone
        title: "Capstone: from cohort data to a term sheet"
        type: synthesis
        status: planned
        goal: >-
          Construct the course's full pipeline end to end — fit the case's

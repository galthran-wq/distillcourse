  - slug: startup-finance
    title: "Startup finance: statements, deals, and valuation"
    outcomes: [co-statements, co-deal-math, co-valuation]
    lessons:
      - slug: npv-and-irr
        title: "NPV, IRR, and the time price of money"
        type: core
        status: planned
        goal: >-
          Evaluate projects by NPV and diagnose the failure modes of IRR —
          ranking conflicts, multiple roots, reinvestment assumptions
        opening: >-
          A dollar later is a discounted dollar now; NPV prices any
          cash-flow stream by that rule, and every competing decision rule
          fails in a case NPV gets right.
        est_minutes: 34
        prerequisites: [customer-lifetime-value]
        concepts:
          introduces: [npv, irr]
          reinforces: [discount-rate, clv, payback-period]
        key_ideas:
          - "The course has discounted since CLV; this lesson names the rule and defends it: NPV is additive, rankable, and maximizes value at any scale"
          - "The NPV profile: value as a function of the discount rate; IRR is its root"
          - "IRR pathologies: crossing profiles rank the worse project higher; non-conventional cash flows give multiple roots or none"
          - "Part I's payback period is a liquidity metric, not a value rule — reconciling the two uses"
          - "★ Cash-flow matching as a linear program (Luenberger): NPV as the dual price of a funding problem"
        demo: null
      - slug: capm-and-wacc
        title: "Cost of capital: CAPM, beta, and WACC"
        type: core
        status: planned
        goal: >-
          Estimate a discount rate — cost of equity via CAPM, cost of debt
          via ratings, WACC assembly — and state where the machinery breaks
          for startups
        opening: >-
          The discount rate is a price for risk, and CAPM's claim is sharp:
          only covariance with the market is priced, so one beta and two
          market-wide numbers set the cost of equity.
        est_minutes: 40
        prerequisites: [npv-and-irr]
        concepts:
          introduces: [capm-beta, equity-risk-premium, wacc]
          reinforces: [npv, discount-rate]
        key_ideas:
          - "Sharpe 1964: indifference curves, the efficient frontier, riskless lending/borrowing ⇒ two-fund separation and the capital market line"
          - "Beta as a regression slope: total risk splits into systematic (priced) and unsystematic (diversified away) — the SML prices only the first"
          - "Practice per Damodaran: currency-matched riskfree rate, implied equity risk premium, bottom-up beta (unlever comparables, relever), synthetic rating for cost of debt"
          - "WACC = $\\frac{E}{D+E}r_e + \\frac{D}{D+E}r_d(1-t)$ at market weights; the Embraer worked case lands at 9.97%"
          - "Startup limits: no market beta, idiosyncratic risk dominates, failure rates unpriced by CAPM — venture rates come from power-law portfolio targets, not the SML"
        demo: null
      - slug: pnl-and-revenue-recognition
        title: "The income statement: revenue recognition and EBITDA"
        type: core
        status: planned
        goal: >-
          Construct a SaaS income statement with correct revenue recognition
          and evaluate EBITDA and its non-GAAP variants
        opening: >-
          Cash received is not revenue earned: an annual prepay hits the
          bank at once and the income statement over twelve months, and the
          gap between those two clocks explains most confusion about
          software accounts.
        est_minutes: 36
        prerequisites: [margins-and-the-unit-pnl]
        concepts:
          introduces: [revenue-recognition, ebitda]
          reinforces: [bookings-billings-revenue, gross-margin, contribution-margin]
        key_ideas:
          - "Deferred revenue mechanics: booking → billing → ratable recognition; Part I's triple gains its liability account"
          - "P&L anatomy top to bottom: revenue, COGS, gross margin, S&M/R&D/G&A, operating income, net income"
          - "EBITDA removes D&A and capital structure — legitimate for comparing operations, abused as a profitability claim"
          - "The non-GAAP ladder read bottom-up: Zynga's bookings, WeWork's Adjusted EBITDA excluding straight-line lease cost — every add-back is an argument"
          - "Estimates are levers: Zynga's 15→12-month durable-goods life change alone added \\$14.1M of revenue"
        demo: null
      - slug: balance-sheet-and-cash-flow
        title: "Balance sheet and cash flow, linked"
        type: core
        status: planned
        goal: >-
          Construct the balance sheet and cash flow statement that
          articulate with a given P&L, and locate cash death inside a
          profitable income statement
        opening: >-
          Profit is an opinion and cash is a fact; the balance sheet is
          where the two reconcile, and the three statements form one system
          with conservation laws.
        est_minutes: 36
        prerequisites: [pnl-and-revenue-recognition]
        concepts:
          introduces: [balance-sheet, cash-flow-statement, working-capital]
          reinforces: [revenue-recognition, bookings-billings-revenue]
        key_ideas:
          - "Assets = liabilities + equity; every P&L line casts a balance-sheet shadow — AR, deferred revenue, prepaids, accrued comp"
          - "The indirect cash flow statement: net income + non-cash items ± working-capital changes; the articulation worked line by line"
          - "Growing profitably into insolvency: receivables and prepaid growth consume cash faster than earnings create it — the worked failure case"
          - "SaaS prepay inverts working capital: deferred revenue is financing from customers — cash arrives before cost"
          - "Dropbox's gross margin 33% → 67% across three statements: infrastructure choices are visible in the accounts"
        demo: null
      - slug: financial-model
        title: "The driver-based financial model"
        type: core
        status: planned
        goal: >-
          Construct a 24-month driver-based financial model from the course
          case's unit economics — funnel and sales drivers through to three
          statements
        opening: >-
          A financial model is the course's metric tree run forward: a small
          set of input drivers — acquisition, conversion, churn, pricing,
          hiring — computes everything else, including the month the cash
          runs out.
        est_minutes: 40
        prerequisites: [balance-sheet-and-cash-flow, mrr-nrr-and-negative-churn, payback-and-the-cash-trough]
        concepts:
          introduces: [driver-model]
          reinforces: [metric-tree, mrr, sbg-model, cash-trough, sales-capacity, balance-sheet, working-capital]
        key_ideas:
          - "Architecture: inputs vs computed cells (the blue/black discipline); every output traces to a named driver"
          - "Two acquisition engines side by side: a marketing funnel (organic + paid × conversion) and a sales-capacity engine (reps × quota) — the Janz 2.0 structure"
          - "The revenue engine is Part I's machinery: sBG retention drives the churned-MRR line; the MRR waterfall reconciles by construction"
          - "Costs: headcount as step functions, payroll timing, formulaic customer success; statements fall out of the drivers"
          - "A model is a stated-assumption machine: Janz's own list of deliberate simplifications is part of the artifact, not a defect"
        demo: null
      - slug: burn-runway-default-alive
        title: "Burn, runway, and default alive"
        type: core
        status: planned
        goal: >-
          Compute runway and default-alive status from a financial model and
          quantify their uncertainty by Monte Carlo simulation
        opening: >-
          Default alive is a computable predicate: hold expenses constant,
          extrapolate the revenue trend, and the model states whether the
          company reaches profitability on the cash it already has.
        est_minutes: 36
        prerequisites: [financial-model]
        concepts:
          introduces: [burn-rate, runway, default-alive]
          reinforces: [driver-model, cash-trough, mrr]
        key_ideas:
          - "Gross vs net burn; runway = cash/net burn is exact only at zero growth — the trajectory version from the model"
          - "Graham's definitions: default alive/dead, the fatal pinch (default dead + slow growth + short runway), and fundraising as never more than Plan A"
          - "Spending and growth are empirically uncorrelated; overhiring is the leading self-inflicted death — Airbnb's four months of zero hires as the counterexample"
          - "Monte Carlo: growth and churn as distributions turn runway into a distribution — the point estimate hides the left tail that kills"
          - "The >5×/year revenue-growth threshold for fundraising while unprofitable — investability as a model output"
        demo:
          component: RunwayMonteCarlo
          spec: >
            Cash-trajectory simulator on the case model: sliders for
            starting cash, monthly opex, a hiring step-up, mean revenue
            growth and growth volatility. Simulates 500 paths; fan chart of
            cash with the zero line, histogram of runway; readouts of
            median runway and P(default alive) — the fraction of paths
            reaching cashflow-positive before zero cash. Tasks: (1) find
            the largest hiring step that keeps P(default alive) ≥ 80%; (2)
            find the growth volatility at which the deterministic runway
            overstates the 10th-percentile runway by 6+ months; (3)
            reproduce the fatal pinch — set growth low and watch late cuts
            fail to save the median path. Presets: "default alive",
            "fatal pinch".

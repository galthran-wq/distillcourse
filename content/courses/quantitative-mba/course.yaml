        concepts:
          introduces: []
          reinforces: [ebitda, revenue-recognition, balance-sheet, cash-flow-statement, burn-rate, vanity-metric, goodharts-law]
        key_ideas:
          - "A filing has two registers — promotional narrative and mandated disclosure — and the truth lives in their seams"
          - "The Adjusted EBITDA reconciliation: nine quarters, eight add-backs, still negative and widening \\$(34)M → \\$(297)M — a non-GAAP ladder climbed in public"
          - "Duration mismatch as the core diagnosis: 15-year leases vs monthly memberships; \\$47.2B commitments vs \\$4.0B backlog; 2018 net loss exceeding revenue"
          - "Related-party reading: a \\$362M loan to the CEO disclosed in one flat paragraph, 20-votes-per-share stock, the ARK structure — governance is numbers too"

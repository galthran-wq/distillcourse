schema_version: 1
slug: quantitative-mba
title: Quantitative MBA
tagline: >-
  Unit economics, trustworthy experiments, growth channels, and startup
  finance — the MBA vocabulary defined as computable quantities
status: in_progress
audience: >
  ML engineers and data scientists. Assumes probability and statistics through
  MLE and Bayesian updating, basic machine learning (regression, trees), and
  Python. Business concepts are assumed unknown; mathematics below the stated
  prerequisites is not re-taught.
tone: >
  Dry, precise textbook register, as elsewhere in the catalog. Business term
  outside, canonical model name inside: every lesson opens with the business
  concept, derives the model behind it, and names the literature ("dig
  deeper") pointer. Real company numbers over invented ones; every worked
  number is checkable.
intro: >
  An engineer who joins a startup meets a vocabulary — retention, churn, LTV,
  CAC, payback, NRR, MDE, uplift — that sounds like accounting but behaves
  like statistics. The question this course answers: which model is each of
  those words secretly naming, and how is it computed from data a company
  actually has?


  The answer has a shape. A customer base is a censored longitudinal dataset,
  so the customer words resolve to survival and mixture models: fit the model,
  and retention curves, churn, and lifetime value fall out as its functionals,
  with the folklore formulas exposed as special cases that fail in a knowable
  direction. A product decision is a causal claim, so the experiment words
  resolve to randomized inference hardened against its documented failure
  modes — underpowering, peeking, metric gaming — and where randomization is
  impossible, to estimators that substitute stated assumptions for it.


  Growth and finance keep the shape. A paid click is priced by an auction, so
  the channel words — CPC, quality score, ROAS, pacing — resolve to mechanism
  design and constrained optimization, with the affordable bid derived from
  the CLV model rather than guessed; channel measurement (MMM, attribution)
  is observational inference whose distance from incrementality is stated,
  and the organic channels — virality, product-led growth, content, sales —
  each carry their own model, from branching processes to capacity queues.
  The finance words are the same discounting machinery grown up: statements
  are a linked accounting system over the driver model, ownership words (cap
  table, SAFE, preferences) are conversion and waterfall arithmetic, option
  claims are priced by two-state replication, and valuation closes the loop
  from cohort data to a number with a confidence story. Four parts, one
  case, every worked number checkable.
prerequisites:
  - text: "Probability and statistics: distributions, MLE, Bayesian updating, hypothesis tests"
  - text: "Basic machine learning: regression, regularization, tree ensembles"
  - text: Python with numpy/pandas, enough to reproduce a fit or a simulation
key_results:
  - text: >-
      Aggregate retention rises with tenure while every individual's churn
      probability stays constant: $r_t = \frac{\beta+t-1}{\alpha+\beta+t-1}$ —
      sorting, not loyalty
    lesson: churn-and-the-sbg-model
  - text: >-
      An sBG model fit on 7 years of cohort data projects year-12 survival
      within 2–4%, where in-sample regression fits (with $R^2$ up to $.998$)
      miss by 30–92%
    lesson: churn-and-the-sbg-model
  - text: >-
      $\mathrm{CLV}$ is a discounted expectation over a survival model; the
      folklore $m/c$ formula misprices the base, and the error grows with
      horizon
    lesson: customer-lifetime-value
  - text: >-
      Under BG/NBD, recency, frequency, and observation length $(x, t_x, T)$
      are sufficient for every individual-level prediction, including
      $P(\text{alive})$
    lesson: repeat-purchase-models
  - text: >-
      $\mathrm{LTV{:}CAC} > 3$ and payback $< 12$ months are folklore
      guidelines, revised upward by their own author — checkable against the
      model, never theorems
    lesson: cac-and-ltv-cac
  - text: >-
      When a measure becomes a target, it ceases to be a good measure
      (Goodhart's law) — the mechanism is selection and gaming, and it is
      diagnosable
    lesson: goodharts-law
  - text: >-
      Continuous monitoring inflates a nominal 5% false-positive rate 5–10×;
      always-valid p-values (mSPRT) restore the guarantee at any stopping time
    lesson: peeking-and-always-valid-inference
  - text: >-
      CUPED shrinks an experiment metric's variance by $1-\rho^2$ using only
      pre-experiment data — at Bing, ~50%: the same power from half the
      traffic
    lesson: variance-reduction-cuped
  - text: >-
      With noncompliance, the IV/Wald estimator recovers the effect for
      compliers (LATE), not the population average
    lesson: instrumental-variables
  - text: >-
      A convex combination of donor units reproduces California's pre-1988
      smoking path; the post-1988 gap (~26 packs/capita by 2000, permutation
      $p = 1/39$) is the program's effect
    lesson: synthetic-control
  - text: >-
      Truthful bidding is dominant in a second-price auction but not under
      GSP: with near-equal CTRs, shading a \$10 value to \$3 lifts the top
      bidder's payoff from \$1,200 to \$1,592
    lesson: ad-auctions-gsp-vcg
  - text: >-
      The revenue-optimal auction allocates by virtual value $\psi(v) = v -
      \frac{1-F(v)}{f(v)}$; for values uniform on $[0,100]$ that is a
      second-price auction with reserve exactly 50
    lesson: reserve-prices-and-first-price
  - text: >-
      The budget-constrained optimal bid is $b = v/(1+\mu)$ with $\mu$ the
      budget's shadow price — pacing is gradient descent on the dual variable
    lesson: bidding-and-pacing
  - text: >-
      MMM response curves are recoverable where their parameters are not:
      visually identical $\beta\cdot\mathrm{Hill}$ curves arise from wildly
      different $(K,S,\beta)$, and two years of weekly data biases the fitted
      curve 18–40% low
    lesson: media-mix-modeling
  - text: >-
      Attribution is not incrementality: Shapley credit to paid search's
      first touchpoint falls $43.8\% \to 4.4\%$ once single-channel journeys
      are filtered out
    lesson: attribution-and-incrementality
  - text: >-
      A viral loop dies out with certainty iff $K \le 1$ (extinction
      probability is the smallest root of $f(s)=s$); subcritical virality
      multiplies every acquired user by $1/(1-K)$
    lesson: virality-and-branching
  - text: >-
      Ownership sold on a post-money SAFE is amount/cap, so the valuation cap
      is a hard ceiling on the raise — at raise = cap the founders hold
      exactly 0%
    lesson: safe-conversion
  - text: >-
      A two-state replication argument prices options with no probabilities:
      $C = [pC_u + (1-p)C_d]/r$ with $p = \frac{r-d}{u-d}$, and the $n$-step
      tree converges to Black–Scholes
    lesson: esop-and-option-pricing
  - text: >-
      In the Horsley Bridge data ~6% of investments produce ~60% of returns,
      and the best funds lose money more often than merely good ones —
      magnitude beats batting average
    lesson: venture-economics
  - text: >-
      The median public-SaaS revenue multiple round-tripped $4.8\times \to
      16\times$ (Feb 2021) $\to 4.4\times$ (2026): a comp multiple is a dated
      observation, not a constant
    lesson: valuation-multiples-and-dcf

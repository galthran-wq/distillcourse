<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" font-family="system-ui, sans-serif">
  <!-- event log table -->
  <rect x="8" y="8" width="286" height="170" rx="6" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <text x="14" y="28" font-size="12" fill="#e2903a" font-weight="bold">customer</text>
  <text x="90" y="28" font-size="12" fill="#e2903a" font-weight="bold">event</text>
  <text x="160" y="28" font-size="12" fill="#e2903a" font-weight="bold">timestamp</text>
  <text x="248" y="28" font-size="12" fill="#e2903a" font-weight="bold">amt</text>
  <line x1="10" y1="36" x2="292" y2="36" stroke="#e2903a" stroke-width="1" opacity="0.6"/>

  <text x="14" y="56" font-size="12" fill="currentColor">V8812</text>
  <text x="90" y="56" font-size="12" fill="currentColor">visit</text>
  <text x="160" y="56" font-size="12" fill="currentColor">2025-04-02</text>
  <text x="248" y="56" font-size="12" fill="currentColor" opacity="0.55">—</text>

  <text x="14" y="78" font-size="12" fill="currentColor">V8812</text>
  <text x="90" y="78" font-size="12" fill="currentColor">trial</text>
  <text x="160" y="78" font-size="12" fill="currentColor">2025-04-02</text>
  <text x="248" y="78" font-size="12" fill="currentColor" opacity="0.55">—</text>

  <text x="14" y="100" font-size="12" fill="currentColor">V8812</text>
  <text x="90" y="100" font-size="12" fill="currentColor">activate</text>
  <text x="160" y="100" font-size="12" fill="currentColor">2025-04-09</text>
  <text x="248" y="100" font-size="12" fill="currentColor" opacity="0.55">—</text>

  <text x="14" y="122" font-size="12" fill="currentColor">V8812</text>
  <text x="90" y="122" font-size="12" fill="currentColor">payment</text>
  <text x="160" y="122" font-size="12" fill="currentColor">2025-04-27</text>
  <text x="248" y="122" font-size="12" fill="currentColor">$50</text>

  <text x="14" y="144" font-size="12" fill="currentColor">C0417</text>
  <text x="90" y="144" font-size="12" fill="currentColor">payment</text>
  <text x="160" y="144" font-size="12" fill="currentColor">2025-05-01</text>
  <text x="248" y="144" font-size="12" fill="currentColor">$50</text>

  <text x="14" y="166" font-size="12" fill="currentColor">C0982</text>
  <text x="90" y="166" font-size="12" fill="currentColor">payment</text>
  <text x="160" y="166" font-size="12" fill="currentColor">2025-05-01</text>
  <text x="248" y="166" font-size="12" fill="currentColor">$50</text>

  <text x="14" y="198" font-size="11" fill="currentColor" opacity="0.55">event log — one row per event</text>

  <!-- fan arrows -->
  <line x1="298" y1="93" x2="386" y2="48" stroke="currentColor" stroke-width="1.2" opacity="0.6"/>
  <polygon points="392,45 382,46 386,54" fill="currentColor" opacity="0.6"/>
  <line x1="298" y1="93" x2="386" y2="138" stroke="currentColor" stroke-width="1.2" opacity="0.6"/>
  <polygon points="392,141 383,135 382,144" fill="currentColor" opacity="0.6"/>
  <line x1="298" y1="93" x2="386" y2="228" stroke="currentColor" stroke-width="1.2" opacity="0.6"/>
  <polygon points="392,231 384,224 381,232" fill="currentColor" opacity="0.6"/>

  <!-- funnel box -->
  <rect x="398" y="10" width="236" height="76" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="410" y="30" font-size="13" fill="currentColor" font-weight="bold">Funnel</text>
  <rect x="410" y="40" width="64" height="7" fill="#4c8dd6"/>
  <rect x="410" y="50" width="42" height="7" fill="#4c8dd6" opacity="0.75"/>
  <rect x="410" y="60" width="24" height="7" fill="#4c8dd6" opacity="0.5"/>
  <text x="490" y="50" font-size="11" fill="currentColor" opacity="0.55">order events within</text>
  <text x="490" y="64" font-size="11" fill="currentColor" opacity="0.55">a customer → conversion</text>

  <!-- cohort matrix box -->
  <rect x="398" y="100" width="236" height="76" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="410" y="120" font-size="13" fill="currentColor" font-weight="bold">Cohort matrix</text>
  <g fill="#4c8dd6">
    <rect x="410" y="128" width="11" height="8"/><rect x="423" y="128" width="11" height="8" opacity="0.8"/><rect x="436" y="128" width="11" height="8" opacity="0.6"/><rect x="449" y="128" width="11" height="8" opacity="0.4"/>
    <rect x="410" y="138" width="11" height="8"/><rect x="423" y="138" width="11" height="8" opacity="0.8"/><rect x="436" y="138" width="11" height="8" opacity="0.6"/>
    <rect x="410" y="148" width="11" height="8"/><rect x="423" y="148" width="11" height="8" opacity="0.8"/>
    <rect x="410" y="158" width="11" height="8"/>
  </g>
  <text x="490" y="140" font-size="11" fill="currentColor" opacity="0.55">group by signup month</text>
  <text x="490" y="154" font-size="11" fill="currentColor" opacity="0.55">× age → retention</text>

  <!-- MRR ledger box -->
  <rect x="398" y="190" width="236" height="76" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="410" y="210" font-size="13" fill="currentColor" font-weight="bold">MRR ledger</text>
  <rect x="410" y="248" width="14" height="8" fill="#4c8dd6" opacity="0.5"/>
  <rect x="428" y="238" width="14" height="18" fill="#4c8dd6" opacity="0.75"/>
  <rect x="446" y="226" width="14" height="30" fill="#4c8dd6"/>
  <text x="490" y="234" font-size="11" fill="currentColor" opacity="0.55">sum amounts by</text>
  <text x="490" y="248" font-size="11" fill="currentColor" opacity="0.55">month → revenue</text>

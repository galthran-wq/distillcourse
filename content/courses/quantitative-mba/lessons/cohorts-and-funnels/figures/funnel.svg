<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" font-family="system-ui, sans-serif">
  <text x="10" y="22" font-size="12" fill="currentColor" opacity="0.55">April 2025</text>

  <!-- stage boxes -->
  <rect x="10" y="36" width="110" height="54" rx="6" fill="none" stroke="currentColor" stroke-width="1.3"/>
  <text x="65" y="57" font-size="12" fill="currentColor" text-anchor="middle">Visits</text>
  <text x="65" y="76" font-size="14" fill="currentColor" font-weight="bold" text-anchor="middle">40,000</text>

  <rect x="175" y="36" width="110" height="54" rx="6" fill="none" stroke="currentColor" stroke-width="1.3"/>
  <text x="230" y="57" font-size="12" fill="currentColor" text-anchor="middle">Trial signups</text>
  <text x="230" y="76" font-size="14" fill="currentColor" font-weight="bold" text-anchor="middle">2,000</text>

  <rect x="340" y="36" width="110" height="54" rx="6" fill="none" stroke="currentColor" stroke-width="1.3"/>
  <text x="395" y="57" font-size="12" fill="currentColor" text-anchor="middle">Activated</text>
  <text x="395" y="76" font-size="14" fill="currentColor" font-weight="bold" text-anchor="middle">1,400</text>

  <rect x="505" y="36" width="110" height="54" rx="6" fill="none" stroke="currentColor" stroke-width="1.3"/>
  <text x="560" y="57" font-size="12" fill="currentColor" text-anchor="middle">Paid</text>
  <text x="560" y="76" font-size="14" fill="currentColor" font-weight="bold" text-anchor="middle">350</text>

  <!-- arrows -->
  <line x1="120" y1="63" x2="168" y2="63" stroke="currentColor" stroke-width="1.4"/>
  <polygon points="175,63 165,58 165,68" fill="currentColor"/>
  <line x1="285" y1="63" x2="333" y2="63" stroke="currentColor" stroke-width="1.4"/>
  <polygon points="340,63 330,58 330,68" fill="currentColor"/>
  <line x1="450" y1="63" x2="498" y2="63" stroke="currentColor" stroke-width="1.4"/>
  <polygon points="505,63 495,58 495,68" fill="currentColor"/>

  <!-- rate labels under each hand-off -->
  <line x1="147" y1="92" x2="147" y2="106" stroke="currentColor" stroke-width="1" opacity="0.4" stroke-dasharray="3 3"/>
  <text x="147" y="124" font-size="14" fill="#e2903a" font-weight="bold" text-anchor="middle">5.0%</text>
  <text x="147" y="141" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">of visits</text>
  <text x="147" y="156" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">same month</text>

  <line x1="312" y1="92" x2="312" y2="106" stroke="currentColor" stroke-width="1" opacity="0.4" stroke-dasharray="3 3"/>
  <text x="312" y="124" font-size="14" fill="#e2903a" font-weight="bold" text-anchor="middle">70%</text>
  <text x="312" y="141" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">of signups</text>
  <text x="312" y="156" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">within 14 d of signup</text>

  <line x1="477" y1="92" x2="477" y2="106" stroke="currentColor" stroke-width="1" opacity="0.4" stroke-dasharray="3 3"/>
  <text x="477" y="124" font-size="14" fill="#e2903a" font-weight="bold" text-anchor="middle">25%</text>
  <text x="477" y="141" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">of activated</text>
  <text x="477" y="156" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">paid within 30 d of signup</text>

  <!-- end-to-end product -->
  <line x1="60" y1="176" x2="580" y2="176" stroke="currentColor" stroke-width="1" opacity="0.25"/>
  <text x="320" y="204" font-size="14" fill="currentColor" text-anchor="middle">0.050 × 0.70 × 0.25 = 0.00875</text>
  <text x="320" y="228" font-size="12" fill="currentColor" text-anchor="middle"><tspan fill="#e2903a" font-weight="bold">0.875%</tspan> of April's visitors become paying customers within 30 d of signup</text>
</svg>

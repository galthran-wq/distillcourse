<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" font-family="system-ui, sans-serif">
  <text x="80" y="30" font-size="12" fill="currentColor">Two samples arranged by age, analysis at the end of 1956</text>
  <rect x="80" y="70" width="520" height="30" rx="4" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.45" stroke-width="1"/>
  <text x="84" y="62" font-size="11" fill="currentColor">Sample I — 100 items, on test from 1955: observed two years</text>
  <text x="210" y="89" font-size="11" fill="currentColor" text-anchor="middle">70 die</text>
  <text x="470" y="89" font-size="11" fill="currentColor" text-anchor="middle">15 die</text>
  <text x="596" y="62" font-size="11" fill="currentColor" text-anchor="end">15 alive at 2 yr</text>
  <line x1="340" y1="70" x2="340" y2="100" stroke="currentColor" stroke-opacity="0.45" stroke-width="1"/>
  <rect x="80" y="140" width="260" height="30" rx="4" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.45" stroke-width="1"/>
  <text x="84" y="132" font-size="11" fill="currentColor">Sample II — 1,000 items, added in 1956: observed one year</text>
  <text x="210" y="159" font-size="11" fill="currentColor" text-anchor="middle">750 die</text>
  <circle cx="340" cy="155" r="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <line x1="348" y1="155" x2="392" y2="155" stroke="currentColor" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.5"/>
  <text x="398" y="150" font-size="11" fill="currentColor" opacity="0.55">250 alive — censored at age 1,</text>
  <text x="398" y="164" font-size="11" fill="currentColor" opacity="0.55">discarded by this estimate</text>
  <line x1="80" y1="200" x2="600" y2="200" stroke="currentColor" stroke-width="1"/>
  <line x1="80" y1="196" x2="80" y2="204" stroke="currentColor" stroke-width="1"/>
  <line x1="340" y1="196" x2="340" y2="204" stroke="currentColor" stroke-width="1"/>
  <line x1="600" y1="196" x2="600" y2="204" stroke="currentColor" stroke-width="1"/>
  <text x="80" y="220" font-size="11" fill="currentColor" text-anchor="middle" opacity="0.55">age 0</text>
  <text x="340" y="220" font-size="11" fill="currentColor" text-anchor="middle" opacity="0.55">1 year</text>
  <text x="600" y="220" font-size="11" fill="currentColor" text-anchor="middle" opacity="0.55">2 years</text>
  <text x="80" y="252" font-size="13" fill="currentColor">Ŝ(2) = 15 / (1,100 − 250) = 15/850 = 0.018   ✗  absurd: sample I alone gives 0.15</text>
</svg>

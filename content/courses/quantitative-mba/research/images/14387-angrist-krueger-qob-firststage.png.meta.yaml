source: 14.387 Applied Econometrics: Mostly Harmless Big Data (MIT OCW, Fall 2014)
shows: The canonical Angrist-Krueger (1991) quarter-of-birth figure: Panel A, average years of education by quarter and year of birth (first stage) — QOB=1 (later school start) sits visibly below QOB=2/3/4 in a sawtooth pattern; Panel B, average log weekly wage by quarter and year of birth (reduced form), showing the same sawtooth in earnings. This is the single most reproduced figure in the applied-microeconometrics IV canon.
located: 14387-iv-constant-effects.pdf (MIT 14.387 IV Take 1: Constant Effects lecture notes), page 26 of 37
why_real: this is THE textbook figure for 'visual instrumental variables' — the entire pedagogical claim (that a tiny, mechanical accident of birth timing moves both schooling and earnings in lockstep) lives in the specific sawtooth wiggle of real Census cohort means; a redrawn schematic sawtooth would state the idea but couldn't show that it is actually there in the data
pointer: PDF: https://ocw.mit.edu/courses/14-387-applied-econometrics-mostly-harmless-big-data-fall-2014/resources/mit14_387f14_const_effects/ (page 26)

source: 14.387 Applied Econometrics: Mostly Harmless Big Data (MIT OCW, Fall 2014)
shows: Angrist (1998) Figure 3: effect of voluntary military service on earnings, white and nonwhite veteran samples, 1974-91. Top panels: earnings-gap time series with OLS point estimates (circles) and a shaded ATT/ATC bound; bottom panels: scatter of cell-specific effect tau against propensity score p for two sub-periods, showing the flat-then-monotone relation that explains when OLS falls inside the ATT-ATC bounds.
located: 14387-matching.pdf (MIT 14.387 Matching lecture notes), page 17 of 18, labeled 'Figure 3' in the deck
why_real: a published empirical bounds plot from Angrist(1998)/Humphreys(2009) with real point estimates, confidence shading and a specific data-driven scatter pattern (flat vs. monotone tau-vs-p relation) — the whole pedagogical point is that this exact empirical pattern is what makes the OLS-lies-between-ATT-and-ATC argument work; a stylized redraw would just be an illustrative cartoon, not evidence
pointer: PDF: https://ocw.mit.edu/courses/14-387-applied-econometrics-mostly-harmless-big-data-fall-2014/resources/mit14_387f14_matching/ (page 17)

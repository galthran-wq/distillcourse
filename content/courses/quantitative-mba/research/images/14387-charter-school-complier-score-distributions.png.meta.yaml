source: 14.387 Applied Econometrics: Mostly Harmless Big Data (MIT OCW, Fall 2014)
shows: Angrist et al. (2013) 'Stand and Deliver' Boston charter-school lottery: smoothed kernel-density distributions of 10th-grade MCAS ELA and Math scores for treated vs. untreated compliers (lottery winners who attended vs. would-be-attenders who didn't), with Kolmogorov-Smirnov test statistics overlaid — the treated-complier density is visibly shifted right of the untreated one on both subjects, illustrating a real distributional (not just mean) treatment effect recovered via Abadie's kappa weighting.
located: 14387-iv-heterogeneous-effects.pdf (MIT 14.387 IV Take 2: Heterogeneous Effects lecture notes), page 24 of 51, 'Figure 1: Complier Distributions for MCAS Scaled Scores'
why_real: a real estimated bimodal-ish empirical density pair with reported K-S statistics from an actual charter-lottery sample — the specific shape and overlap of the two curves is the finding (a distributional shift, not just a mean shift), which a generic 'two bell curves offset' redraw would flatten into a cliché
pointer: PDF: https://ocw.mit.edu/courses/14-387-applied-econometrics-mostly-harmless-big-data-fall-2014/resources/mit14_387f14_causaleffects/ (page 24)
license: publisher © (from Angrist, Cohodes, Dynarski, Fullerton, Kane, Pathak, Walters, 'Stand and Deliver', July 2013 LTO working paper) — teaching use
quality: clean vector page render at 180 dpi, curves and K-S annotations legible at small size

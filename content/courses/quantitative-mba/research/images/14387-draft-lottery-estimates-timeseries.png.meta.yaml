source: 14.387 Applied Econometrics: Mostly Harmless Big Data (MIT OCW, Fall 2014)
shows: Angrist, Chen & Song (2011) update of the draft-lottery estimates of Vietnam-era military service's effect on ln(earnings) for white men born 1950-52, plotted year by year from 1970 to 2006 with pointwise 95% confidence bands — the estimated earnings penalty is sizable and significant through the 1980s, then fades and crosses zero by the 2000s as the veteran cohort ages into retirement.
located: 14387-iv-constant-effects.pdf (MIT 14.387 IV Take 1: Constant Effects lecture notes), page 31 of 37, 'Figure 1: Draft-lottery Estimates...'
why_real: a real 36-year panel of point estimates and confidence bands from administrative Social Security earnings records — the fade-out pattern over decades is the finding itself, not illustrative; redrawing would require fabricating four decades of estimates
pointer: PDF: https://ocw.mit.edu/courses/14-387-applied-econometrics-mostly-harmless-big-data-fall-2014/resources/mit14_387f14_const_effects/ (page 31)

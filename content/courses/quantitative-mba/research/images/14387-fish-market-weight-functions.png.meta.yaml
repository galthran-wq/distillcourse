source: 14.387 Applied Econometrics: Mostly Harmless Big Data (MIT OCW, Fall 2014)
shows: Angrist, Graddy & Kowalski's 'Figure 4' from the Fulton Fish Market demand-elasticity paper: two nearly-overlapping straight lines (the linear regression/naive-instrument weight assumption) against two real, jagged empirical weighting-function curves derived from stormy-weather-instrument first-stage price CDFs — the mismatch between the smooth assumed weights and the actual lumpy empirical ones is the whole point of the average-causal-response 'weighting function' idea.
located: 14387-iv-heterogeneous-effects.pdf (MIT 14.387 IV Take 2: Heterogeneous Effects lecture notes), page 41 of 51 ('Shelter from the Storm (or Mixed Conditions)'); extracted as an embedded raster sub-image (fig-002) rather than a page render
why_real: the entire teaching point is the visual gap between a straight assumed-weight line and a genuinely irregular empirical weight curve estimated from real fish-market data (Fulton Fish Market, NYC) — a smoothed or stylized redraw would erase exactly the irregularity that motivates the ACR framework
pointer: PDF: https://ocw.mit.edu/courses/14-387-applied-econometrics-mostly-harmless-big-data-fall-2014/resources/mit14_387f14_causaleffects/ (page 41)

source: 14.387 Applied Econometrics: Mostly Harmless Big Data (MIT OCW, Fall 2014)
shows: The original MapReduce execution-overview diagram from Dean & Ghemawat's Google paper: user program forks a master and worker processes; workers read input splits, run the map phase, write intermediate files to local disk; the master assigns reduce tasks that remotely read intermediate files and write output files 0/1 — the canonical picture of the map/shuffle/reduce architecture.
located: 14387-big-n.pdf (MIT 14.387 Big Data: Big N lecture notes — Chernozhukov), page 6 of 16, 'MapReduce: Model'
why_real: this is THE original diagram from the source paper that defined MapReduce (Dean & Ghemawat, OSDI 2004) — it is reproduced here as the historical artifact everyone who explains MapReduce eventually points back to, not an illustrative schematic invented for teaching
pointer: PDF: https://ocw.mit.edu/courses/14-387-applied-econometrics-mostly-harmless-big-data-fall-2014/resources/mit14_387f14_bign/ (page 6)
license: publisher © Jeffrey Dean and Sanjay Ghemawat (excluded from OCW's Creative Commons license) — teaching use
quality: page render at 180 dpi; diagram is legible but small (labels like 'split 0'/'worker'/'output file 0' readable at full size, would need modest upscaling if used large)

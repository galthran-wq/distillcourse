source: "Bandit Algorithms, Tor Lattimore & Csaba Szepesvári, Cambridge University Press 2020"
shows: >
  The well-known (and disputedly-authentic) pen-and-ink portrait of the
  Reverend Thomas Bayes, reproduced in the margin of the Bibliographic
  Remarks for Chapter 34 ("Foundations of Bayesian Learning"), next to a
  reference to Bayes' original 1763 essay.
located: "Section 34.8 Bibliographic Remarks, print p.436 (PDF page 445 of book.pdf)"
why_real: >
  This is THE canonical Bayes portrait used throughout the Bayesian-statistics
  literature (its authenticity is itself a minor historical in-joke among
  statisticians — no one is sure it is really him). A redrawing would strip
  exactly the "this is the actual disputed historical image everyone
  reproduces" quality that makes it worth including at all; the pedagogical
  point is "here is the portrait", not "here is a picture of a man."
url: "https://tor-lattimore.com/downloads/book/book.pdf, page 445 (print p.436)"
license: "public domain (18th-century portrait, pre-1923; this particular scan/rendering appears in the Cambridge-published book, used here for teaching purposes)"
notes: >
  Captured via `npm run image -- capture .../banditalgori-s3-book.pdf .../banditalgori-s3-thomas-bayes-portrait.png 445 --dpi 180`.
  The tool auto-extracted the embedded figure bitmap as
  banditalgori-s3-thomas-bayes-portrait-fig-000.png (kept); the whole-page
  render (banditalgori-s3-thomas-bayes-portrait.png) was deleted as redundant
  since the figure crop is clean on its own. Quality: legible line-drawing
  scan, moderate resolution (fine for a small inline portrait, would look soft
  if blown up large), grayscale/monochrome pen-and-ink style.

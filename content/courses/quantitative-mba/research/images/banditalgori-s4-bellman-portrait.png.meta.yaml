source: "Bandit Algorithms, Tor Lattimore & Csaba Szepesvári, Cambridge University Press 2020 (free online edition)"
covers: "Full-page render of printed page 536 (PDF page 545), Chapter 38 'Markov Decision Processes', Section 38.9 'Bibliographical Remarks' — contains a black-and-white photographic portrait of Richard Bellman (captioned 'Richard Bellman'), seated at a desk in front of bookshelves, alongside the text crediting him as one of the main architects of MDP theory and citing his 1954 paper and 1984 autobiography 'The Eye of the Hurricane'."
url: "https://tor-lattimore.com/downloads/book/book.pdf (page 545 of the PDF; printed page 536)"
located: "Chapter 38 'Markov Decision Processes', Section 38.9 Bibliographical Remarks, printed p.536 (unnumbered portrait figure, captioned 'Richard Bellman')"
shows: "Genuine historical photographic portrait of Richard Bellman (inventor of dynamic programming and the Bellman equation), the only photograph of a historical figure in this shard's page range."
why_real: "A portrait photograph of a specific historical person cannot be redrawn in house style without becoming a different (and less credible/authentic) image; the pedagogical point is 'here is what this person actually looked like,' which only the original photo delivers."
license: "unknown (publisher-supplied photo, presumably licensed for the Cambridge University Press edition; not otherwise attributed on the page) -- teaching use only, re-clear before any public/commercial reuse"
quality: "Rendered at 180 dpi from a clean, selectable-text pdflatex PDF (not a scan). Photo appears to be a moderate-resolution halftone/greyscale reproduction, legible but with visible print screening at high zoom; sufficient for a lesson figure at normal display sizes."
notes: "Captured via `npm run image -- capture ... 545 --dpi 180`; no separate embedded bitmap was extracted alongside the page render (pdfimages found nothing extractable), so the crop for a lesson would come from this whole-page capture."

notes: >
  Real-data diagnostic from Section 8/9: average residual ACF across all MCMC draws (panel a) versus
  ACF of log-transformed sales itself (panel b), on the shampoo advertiser's actual weekly sales
  series. The model soaks up most autocorrelation but a real, non-trivial residual pattern persists
  out to lag 15 weeks — the paper's own admission of model misspecification, used in the Conclusion
  to motivate hierarchical/geo-level extensions (Wang et al. 2017, Sun et al. 2017). License:
  publisher (Google Research), free for research/teaching use; no explicit open license stated.
  Quality: clean vector render, fully legible, black/white ACF bar plots with dashed significance
  bounds.

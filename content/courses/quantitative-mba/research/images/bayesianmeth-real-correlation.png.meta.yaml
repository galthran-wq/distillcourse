notes: >
  Real-data result: the actual collinearity structure of the shampoo advertiser's control variables
  (price/distribution/promotion, correlations up to -0.98) and media spend channels (TV/magazines/
  display/YouTube/search, correlations up to 0.46) from Section 8. This is the concrete evidence for
  why the paper orthogonalizes control variables before fitting (collapses STAN runtime from 3040s to
  75s per Table 8, same page) — a vivid real-world illustration of the collinearity problem that
  motivates Bayesian priors in MMM generally. License: publisher (Google Research), free for research/
  teaching use; no explicit open license stated. Quality: clean vector render, fully legible, color
  heatmap (orange-white-blue diverging scale).

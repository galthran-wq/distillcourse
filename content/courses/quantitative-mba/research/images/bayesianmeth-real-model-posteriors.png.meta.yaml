notes: >
  Real-data confirmation of the paper's identifiability warning (Section 2.2): compare panel (a3) vs
  (b3) y-axis scales — the beta*Hill credible band for TV under the flexible Hill transformation
  (Model I) spans 0 to 0.6, twenty times wider than the reach transformation's 0 to 0.03 (Model II),
  on the SAME real TV spend series. This is the paper's own applied evidence, on proprietary data,
  for "more flexible functional form does not lead to more accurate estimates, instead it results in
  much larger variance" (paper's text, Section 8). Companion page 27 (bayesianmeth-real-autocorrelation)
  continues with Model IV and the residual-autocorrelation diagnostic. License: publisher (Google
  Research), free for research/teaching use; no explicit open license stated. Quality: clean vector
  render, fully legible, black=posterior/orange=prior overlay.

source: "Capital Asset Prices: A Theory of Market Equilibrium under Conditions of Risk, William F. Sharpe, The Journal of Finance, Vol. 19, No. 3 (Sep. 1964), p. 440, Figure 9"
covers: "Journal page 440 (PDF page 17) - Figure 9, the paper's culminating diagram: predicted responsiveness (beta, B_ig) on the vertical axis against expected return (E_Ri) on the horizontal axis, a straight line PQ through the pure interest rate P. This is the original appearance, in Sharpe's own hand, of what the field later called the Security Market Line."

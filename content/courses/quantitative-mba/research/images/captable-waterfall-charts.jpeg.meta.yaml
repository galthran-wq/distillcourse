source:
  title: "Cap Table and Exit Waterfall Tool (Foresight / Hemrock)"
  author: "Taylor Davidson, Foresight (now rebranded Hemrock; Unstructured Ventures, LLC)"
covers: >
  The four canonical charts on the "Example Exit Waterfall" tab: (top-left)
  "% of total proceeds distributed to each shareholder class" stacked bar
  chart across a doubling range of exit values ($2.5M to $320M); (top-right)
  the same distribution in absolute dollars; (bottom pair) "Distribution of
  Proceeds to Liquidation Preferences v. Common", % and $, showing the
  classic liquidation-preference-protects-the-downside /
  common-captures-the-upside crossover shape.
url: >
  https://www.hemrock.com/assets/screenshots/cap_4.jpeg (embedded on
  https://www.hemrock.com/cap-table/, the page https://foresight.is/cap-table
  now 307-redirects to). NOTE: this is the commercial/expanded descendant of
  the canon source, not the literal GitHub file — see notes.
fetched_via: curl
notes: >
  The canon source for this task is the open-source GitHub repo
  (github.com/foresighthq/cap-table-tool, CC BY-NC-SA 4.0, cited throughout
  this dossier). Its own "5 - Exit Waterfall" tab ships as a BLANK template
  (every investor row is 0/na by design — it's meant to be filled in), so its
  built-in charts render as empty axes with no bars; I confirmed this myself
  by converting the actual repo .xlsx to PDF with LibreOffice headless and
  rendering the chart pages (page ~170 of the export) — legend labels
  ("Preferred, C/B/A/Seed") are visible but every series is empty. There is
  no populated-chart image anywhere in the GitHub repo (its README.md's
  "## Screenshots" section header has no images under it — checked the raw
  markdown source). This capture is the closest real artifact showing what
  the tool's own waterfall charts look like once real numbers are in: a
  marketing screenshot of the same underlying model on Foresight's
  successor site, Hemrock (foresight.is/cap-table redirects to
  hemrock.com/cap-table with a 307, and the task brief already documents
  this rebrand). Row/column labels ("Series D/C/B/A/Seed", "Warrants",
  "Options") differ slightly from the GitHub file's tier names
  ("Preferred C/B/A/Seed") because Hemrock's is a newer, expanded version of
  the same model — but the calculation logic and the chart shape (the
  pedagogical point) are the same lineage the GitHub repo documents in its
  Changelog. Treat this image as an authentic screenshot of the tool family,
  not a screenshot of the exact file cited as canon.
license: "publisher (c) Hemrock / Unstructured Ventures, LLC -- teaching use. The GitHub repo's own .xlsx files are CC BY-NC-SA 4.0 (see captable-license.md); this particular screenshot is marketing material on the commercial descendant site and is NOT covered by that CC license."
quality: "Real screenshot, 1241x957px JPEG, legible axis labels and legend; colors render correctly (green/orange/teal stacked bars); some numeric axis labels are truncated at right edge of the crop (e.g. exit-value tick labels read '10,000,0...')."

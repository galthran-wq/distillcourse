notes: >
  Grayscale scan, 2400x3636px, legible including the hand-drawn hatching and point labels
  (E, F, F', F'', F''', G, G', G'', M, M', M'', P, Q, S_n, S'_n, S_(n-i), D_n) that the
  surrounding prose refers to by name. This is Vickrey's own diagram for the payment rule that
  is the direct ancestor of the general VCG (Vickrey-Clarke-Groves) pivotal-payment idea, predating
  the auction-specific "second-price" result in Section III by several pages — worth keeping as
  the original rather than a clean redraw because the labeling scheme (which point is whose
  marginal payment) is exactly what the cited text walks through letter by letter.

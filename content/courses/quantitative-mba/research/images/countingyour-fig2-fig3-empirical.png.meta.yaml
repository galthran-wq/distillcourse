notes: >
  180 dpi page render, legible, black-and-white. Figure 2 is the paper's
  headline empirical result: actual vs. BG/NBD vs. Pareto/NBD frequency of
  0..7+ repeat purchases on the real CDNOW cohort — a published plot of
  fitted-vs-measured data, not a schematic, so redrawing it would misrepresent
  it as synthetic. Figure 3 is the paper's own "final and perhaps most
  critical" evaluation (conditional expectations by calibration-period
  transaction count) — same reasoning.

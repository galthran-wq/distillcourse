source: "Dropbox, Inc. Form S-1 (IPO registration statement), filed Feb 23, 2018"
shows: >
  Stacked area chart titled "Monthly subscription amount, by quarterly cohort" —
  the monthly subscription $ generated by every quarterly signup cohort from
  Q1 2013 through Q1 2018, stacked to show total. The visual proof of Dropbox's
  self-serve PLG model: each cohort's contribution grows after signup (upsell/
  expansion), and successive cohorts stack on top of still-expanding earlier ones.
located: >
  Business section, "Our Attractive Cohort Economics" subsection, prospectus
  page ~62 (of the printed prospectus pagination; MD&A/Business chapter runs
  pages 57-125 per the filing's own table of contents).
why_real: >
  This is Dropbox's own self-reported, non-standardized metric (not a GAAP
  or SEC-mandated table) rendered as a designed chart with specific colors/
  axis choices Dropbox chose to make its case to investors — it is THE chart
  cited throughout SaaS/PLG teaching material as "the Dropbox cohort chart."
  A redrawing would need to fabricate the exact curve shapes and cohort
  banding, which is the entire evidentiary content of the image; the real
  bitmap is the primary source, not decoration.

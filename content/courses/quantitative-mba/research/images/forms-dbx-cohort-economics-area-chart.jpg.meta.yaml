notes: >
  Downloaded with curl -A "Research research@example.com" (SEC EDGAR blocks
  requests without an identifying User-Agent — the frontend image-capture
  script's default UA got a 403, so this was fetched directly and copied in
  rather than run through `npm run image -- capture`). Structural check passed:
  jpeg 528x434, 172KB. Original resolution as stored in the filing (960 DPI
  JFIF density tag, but actual pixel dimensions are 528x434 — a web-native
  chart export, not a scan).

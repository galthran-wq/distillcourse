source: "Dropbox, Inc. Form S-1 (IPO registration statement), filed Feb 23, 2018"
shows: >
  Line chart titled "Monthly subscription amount, indexed to month 1 of
  January 2015 cohort" — three lines (Jan 2015, Jan 2016, Jan 2017 signup
  cohorts) plotted as a multiple of month-1 subscription revenue against
  months since signup, showing the Jan 2017 cohort expanding faster than
  Jan 2016, which expanded faster than Jan 2015. Dropbox's own evidence that
  net-revenue-expansion economics were improving cohort over cohort, not just
  present.
located: >
  Business section, "Our Attractive Cohort Economics" subsection, prospectus
  page ~63, immediately following the cohort area chart.
why_real: >
  Same reasoning as the area chart: this is Dropbox's own indexed cohort
  comparison, a specific analytical choice (indexing to month 1, only three
  cohorts shown, the curves' relative slopes) that IS the claim being made.
  Redrawing would require inventing the slopes; the filing's own chart is the
  primary evidence a lesson would cite.

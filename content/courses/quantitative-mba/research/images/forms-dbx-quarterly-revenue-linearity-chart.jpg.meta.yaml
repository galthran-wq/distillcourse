source: "Dropbox, Inc. Form S-1 (IPO registration statement), filed Feb 23, 2018"
shows: >
  Line chart titled "Quarterly revenue generation" — cumulative % of quarterly
  revenue recognized plotted against day-of-quarter (1-91) for each of Q1-Q4
  2017, four nearly-overlapping straight lines rising 0% to 100%. Dropbox's
  visual argument that its subscription revenue is recognized "linearly and
  predictably" through the quarter (evidence for the "Our Predictable
  Subscription Revenue" claim).
located: >
  Business section, "Our Predictable Subscription Revenue" subsection,
  prospectus page ~64, right after the cohort economics charts.
why_real: >
  A minor supporting chart, but still Dropbox's own designed evidence (choice
  to overlay all four 2017 quarters to show how tightly they track each
  other) — the near-perfect overlap of the four lines is the point, which a
  redrawn version would just be asserting rather than showing.

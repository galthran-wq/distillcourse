source: "Form S-1 (IPO registration statement), The We Company (WeWork), filed Aug 14, 2019"
shows: >
  A wide illustrated cross-section of a WeWork location captioned "A Better
  Day at Work", with seven lettered call-outs (A-G) naming real staff and
  members by name and title: WeWork community-team and design-team
  employees (with employee numbers, e.g. "Employee #7"), WeWork's chief
  architect Bjarke Ingels, and members from Stripe, Dropbox, Skai Blue
  Media and Queen of Raw.
located: "Front-matter page, immediately after the dedication page (unnumbered, before printed page 1); image file g781982g58e15.jpg."
why_real: >
  It is the S-1's own opening pitch — real named people standing in for
  "financial highlights" on what would ordinarily be a data-dense opening
  page of a prospectus; the specific choice to lead a legal/financial
  document with a lifestyle illustration (rather than a chart) is itself
  the artifact worth showing, which a redrawn generic office scene would
  not convey.

source: "Form S-1 (IPO registration statement), The We Company (WeWork), filed Aug 14, 2019"
shows: >
  The actual "reconciliation of net loss to adjusted EBITDA" table (nine
  quarters, Q2 2017 through Q2 2019): starts from GAAP net loss each
  quarter, adds back income tax, interest and other (income) expense,
  depreciation and amortization, stock-based compensation, stock-based
  payments to consultants, changes in fair value of contingent
  consideration, legal/tax/regulatory reserves, and merger/acquisition
  expense to get "Adjusted EBITDA including non-cash GAAP straight-line
  lease cost" — then adds back the straight-line lease cost itself to get
  "Adjusted EBITDA excluding non-cash GAAP straight-line lease cost." Even
  on this most generous non-GAAP basis, the number is negative every single
  quarter and gets steadily more negative: -$34.0M (Q2'17) to -$297.2M
  (Q2'19). The page continues directly into "Liquidity and Capital
  Resources."
located: "Printed prospectus page 114 (MD&A, 'Key Performance Indicators' / non-GAAP measures subsection)."
why_real: >
  This is the exact add-back menu and the exact quarter-by-quarter numbers
  a critical-reading exercise needs students to trace by hand — which line
  items get excluded, and that the loss widens even after every exclusion.
  A redrawn table risks silently "cleaning up" the presentation (e.g.
  omitting the parenthetical negative-number convention or the two-tier
  EBITDA-including/excluding-lease-cost structure) in a way the original
  SEC page, with its own formatting choices, does not.

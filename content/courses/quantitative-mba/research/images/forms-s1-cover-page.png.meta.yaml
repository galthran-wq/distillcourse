source: "Form S-1 (IPO registration statement), The We Company (WeWork), filed Aug 14, 2019"
shows: >
  The actual cover page of WeWork's preliminary prospectus: mustard-yellow
  background, "The We Company / Class A Common Stock / Shares" with blank
  price and share-count fields (standard for a preliminary/"red herring"
  prospectus before pricing), the SEC's mandatory red-ink warning text down
  the left margin, an underwriting table with blank dollar figures, and the
  lowercase "we" wordmark-in-a-circle logo ringed by the underwriter names
  (Goldman Sachs, JPMorgan, BofA Merrill Lynch, Barclays, Citigroup, Credit
  Suisse, HSBC, UBS, Wells Fargo Securities).
located: >
  Filing cover page (unnumbered, precedes printed page 1); image file
  g781982g72i17.jpg embedded via <IMG SRC> in the source HTML.
why_real: >
  This exact page — the color choice, the lowercase logo, the blank price
  where a number should be — became shorthand in press coverage for "style
  over substance" IPO criticism; a redrawing would just be a plain cover
  page and would lose the specific graphic-design choices that were
  themselves part of the story.

source: "Form S-1 (IPO registration statement), The We Company (WeWork), filed Aug 14, 2019"
shows: >
  A full page reading "WE DEDICATE THIS / TO THE ENERGY OF WE — / GREATER
  THAN ANY ONE OF US / BUT INSIDE EACH OF US." on the left, facing the "we"
  circle logo on the right; nothing else on the page.
located: >
  Front-matter page immediately following the cover page (unnumbered, before
  printed page 1); image file g781982g05d59.jpg. In the underlying HTML the
  same words are also present as invisible (font-size 0.5pt, white-on-white)
  text for accessibility/searchability, confirming the image IS the
  page's only visible content.
why_real: >
  This became one of the most-quoted single pages in IPO history — cited
  repeatedly as evidence that WeWork's SEC filing read like a mission
  statement rather than a disclosure document. The joke depends entirely on
  it being a literal page of a legal filing submitted to the SEC; a
  redrawing or paraphrase would just be a quote and would lose that shock.

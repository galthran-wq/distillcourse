notes: >
  The nested-circle TAM chart: existing 111 cities (149M addressable
  population) -> $1.7T total opportunity, scaling to a target 280 cities
  (255M population) -> $3.0T total opportunity. This is the specific
  graphic behind WeWork's headline "$3 trillion market" claim that became
  shorthand in later commentary for pre-IPO market-sizing overreach — the
  nested-circle visual rhetoric (implying near-total addressability) is
  itself the artifact worth showing students, not just the number. A
  redraw would strip the persuasive geometry that is the point of a
  critical-reading exercise. Fetched directly from SEC EDGAR with a
  declared User-Agent. Clean vector-rendered JPEG, 608x304px as filed,
  fully legible.

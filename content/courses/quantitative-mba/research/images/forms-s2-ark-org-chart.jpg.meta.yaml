notes: >
  WeWork's own diagram of the ARK real-estate platform: WeCo sits atop
  "WeCo Lease Holding Entities" (dashed "tenant or other involvement" line)
  while the Rhône Group co-owns ARK Master GP / ARK Manager, which in turn
  control the "real estate acquisition vehicles" that own the buildings WeCo
  occupies. This is the company's own visual defense of the related-party
  real-estate structure that drew heavy scrutiny (Adam Neumann personally
  owned several properties leased to WeWork; Rhône Group co-controls ARK).
  A house-style redraw would have to reinterpret box placement and could be
  accused of editorializing; the original is the artifact analysts and
  journalists actually annotated. Fetched directly from the SEC EDGAR filing
  directory (same accession number as the primary .htm) with a declared
  User-Agent, since SEC blocks generic requests. Sharp vector-style chart,
  545x355px as filed — small but fully legible.

source: "Zynga Inc., Form S-1 (IPO prospectus), filed July 1, 2011"
covers: >
  Actual in-game screenshot from CityVille's "Play Longer" mechanic (Business
  section, page 80 of the printed prospectus): a "GET MORE ENERGY!" modal
  that appears when a player runs out of energy, offering two paths — "Get
  Now" (pay real/virtual currency to skip a 60-minute wait) or "Ask Friends"
  (post a request that pulls a friend back into the game). The filing's own
  caption explains the price: "nine City Cash (approximately $1)" buys 12
  energy units instead of waiting 60 minutes.
url: "https://www.sec.gov/Archives/edgar/data/1439404/000119312511180285/g198836g31n17.jpg (linked from https://www.sec.gov/Archives/edgar/data/1439404/000119312511180285/ds1.htm)"
fetched_via: curl
notes: >
  Stored as a separate file on EDGAR (<IMG SRC="g198836g31n17.jpg">), fetched
  directly. 384x384, sharp, full UI legible. This is the actual game
  interface (not a mockup) that Zynga chose to put in its own prospectus as
  the illustrative example of monetization — it doubles as the clearest
  single artifact of "energy mechanic forces either payment or a viral ask",
  the paid/viral coupling a redrawn UI mock could not credibly claim to be
  the real thing.

source: "Zynga Inc., Form S-1 (IPO prospectus), filed July 1, 2011"
covers: >
  Annotated screenshot of the "zBar" — the navigation bar Zynga displayed
  above every web game, showing links to a player's other Zynga games and
  friend-activity counts, a RewardVille achievement bar, and a rotating
  cross-promotion banner for other Zynga titles. Business section, "zBar"
  subsection, page 83 of the printed prospectus. The filing's own callout
  labels ("Links to other Zynga games and statistics on how many friends
  have recently played", "Navigation button to RewardVille") explain the
  mechanism in Zynga's own words.
url: "https://www.sec.gov/Archives/edgar/data/1439404/000119312511180285/g198836g65k02.jpg (linked from https://www.sec.gov/Archives/edgar/data/1439404/000119312511180285/ds1.htm)"
fetched_via: curl
notes: >
  Stored as a separate file on EDGAR (<IMG SRC="g198836g65k02.jpg">), fetched
  directly. 605x293, sharp, fully legible callout text — this is the
  filing's own annotated diagram, not something to redraw: the whole point
  is that Zynga is showing investors, in its own screenshot, exactly how
  cross-game promotion (not organic word-of-mouth) inflated its portfolio-
  wide MAU/DAU counts — each cross-promoted game click counts as a separate
  MAU for that game.

source: "David Easley & Jon Kleinberg, \"Networks, Crowds, and Markets\" (Cambridge University Press, 2010), Figure 15.1"
covers: "An actual (c.2010) Google search-results-page screenshot for the query 'keuka lake', showing organic/algorithmic results on the left and paid sponsored-search ad results ('Sponsored Links') on the right -- the concrete real-world artifact the whole of Chapter 15's matching-market/VCG/GSP auction theory is modeling."
url: "PDF: https://www.cs.cornell.edu/home/kleinber/networks-book/networks-book-ch15.pdf, page 2 (book page 438, Figure 15.1)"
license: "publisher copyright (Cambridge University Press, screenshot of the Google product) -- teaching use"
notes: "Captured as the stored figure bitmap embedded in the PDF page (fig-000, renamed), not a page render -- legible screenshot, small/period UI chrome (2010-era Google) but text and ad layout fully readable. This must be the real screenshot rather than a redrawing/mockup: it is dated, real-brand, real-query evidence that sponsored search actually looks like a ranked list of paid slots next to organic results, which is exactly the object the chapter's auction math is pricing -- a mockup would look plausible but would misrepresent what is being modeled as a live product screenshot from the book's own writing."

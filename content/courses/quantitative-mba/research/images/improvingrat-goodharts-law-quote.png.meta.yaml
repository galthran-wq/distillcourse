source: >
  Strathern, Marilyn. "'Improving ratings': audit in the British University
  system." European Review, Vol. 5, No. 3 (July 1997), pp. 305-321.
shows: >
  Print page 308 (PDF page 4) of the original journal article, containing
  the paragraph with the canonical phrasing: "When a measure becomes a
  target, it ceases to be a good measure. The more a 2.1 examination
  performance becomes an expectation, the poorer it becomes as a
  discriminator of individual performances. Hoskin describes this as
  'Goodhart's law' ..." — the sentence this whole source exists to supply,
  set in the journal's original typeset page with running head, page number,
  and footer citation line intact.
located: "p. 308 of Eur. Rev. 5(3), 305-321 (1997); PDF page 4 of the gwern.net mirror."
why_real: >
  This is the primary-source scan of the exact page that coined the
  popularized phrasing of Goodhart's Law used across the course (lesson
  I.11, vanity metrics). A redrawn/reset quote card would lose the
  evidentiary point — that this sentence appears, word for word, on a
  specific printed page of a specific peer-reviewed journal, attributed
  in-line to Hoskin's account of Goodhart. Any lesson that wants to show
  "here is the primary document where this famous phrase comes from" needs
  the actual page image, not a re-typeset quote.

notes: >
  The paper's single most-cited/most-reproduced figure: real p-values from a
  production Bing experiment (250ms artificial slowdown) tracked day by day,
  red = vanilla t-test barely crossing the 0.05 line by day 14, teal = CUPED
  below 0.05 from day 1. This is measured production data (not a schematic);
  the jaggedness of the real curve is itself part of the point (real data is
  noisy, CUPED's advantage holds throughout, not just asymptotically) and
  would be lost/misrepresented in an idealized redraw. Licence: publisher (c)

notes: >
  The paper's cautionary "gotcha" case study (Section 5.3): a real Bing
  experiment where queries-per-user genuinely increased, but using an
  in-experiment covariate (DQ-per-user, affected by treatment) makes CUPED's
  confidence interval sit almost entirely below zero - the directionally
  WRONG conclusion, with tight CIs that look convincingly significant. This
  is real measured evidence of a subtle, easy-to-miss bias; a redrawn/
  synthetic version would look constructed and lose the "this really happened
  in production" force of the warning. Licence: publisher (c) ACM, WSDM'13 -
  teaching use. Quality: clean, legible, colour, good resolution.

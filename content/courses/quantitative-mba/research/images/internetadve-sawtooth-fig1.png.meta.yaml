source: "Internet Advertising and the Generalized Second-Price Auction: Selling Billions of Dollars Worth of Keywords" by Benjamin Edelman, Michael Ostrovsky, Michael Schwarz (NBER Working Paper No. 11765, November 2005)
covers: Figure 1, "Sawtooth pattern" — the paper's only figure, on PDF page 22 (printed page 21)
url: "PDF: https://www.nber.org/system/files/working_papers/w11765/w11765.pdf, page 22"
fetched_via: curl (PDF download) + npm run image -- capture (pdftoppm-based page render at 180 dpi)
notes: whole-page render (landscape orientation, rotated 90 degrees in the PDF — the two panels and caption read sideways in the captured PNG). No separate embedded bitmap was extractable; this is a vector line chart drawn directly in the PDF, so the page render is the only way to get it. Panel (a) covers 14 hours (12:15 AM-2:15 PM, July 18 2002) at 15-minute bid samples for one keyword's top two bidders on Overture; panel (b) extends the same keyword for one week (7/18-7/24). Points A, B, C in panel (a) are labelled directly on the chart and referenced in the caption's walk-through of one "tooth". Underlying data: real (anonymized) Overture bid-log data supplied to the authors by David Pennock/Yahoo!; keyword identity was withheld by Overture.

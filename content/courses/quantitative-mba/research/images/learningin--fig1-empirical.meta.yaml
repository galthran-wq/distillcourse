notes: >
  Whole-page render; figure is a vector chart (no embedded bitmap to extract
  separately). Two-panel scatter plot titled "Performance of an Adaptive
  Pacing Strategy with Parameters mu_1=0.5 and epsilon=T^-1/2, in Terms of
  the Attained Fractions of the Performance of the Best Sequence of Bids in
  Hindsight." Left panel: actual performance (pi^A/pi^H) vs rho/v-bar
  compared against the theoretical guaranteed-performance line (Theorem 2).
  Right panel: adaptive pacing vs truthful bidding as a function of B/B0,
  split into "effectively constrained" / "effectively unconstrained"
  regions. Built from real data: 13,182 sequential online ad auctions,
  2,923 advertisers, focused on the 10 bidders with largest cumulative
  expenditure (>98% of overall spend), each replicated 200 times. Crop this
  down to just the figure region (top ~55% of the page) when using it in a
  lesson; do not redraw the scatter — it is the paper's own reported
  empirical measurement, not a schematic.

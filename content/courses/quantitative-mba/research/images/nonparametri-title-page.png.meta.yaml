source: "Nonparametric Estimation from Incomplete Observations, E. L. Kaplan & Paul Meier, Journal of the American Statistical Association, Vol. 53, No. 282 (Jun. 1958), p. 457 (opening page)"
covers: >
  Whole-page render of the paper's opening page (PDF page 2 — page 1 of the
  PDF is the JSTOR cover sheet, discarded). Shows the title, both authors'
  affiliations (Kaplan: University of California Radiation Laboratory;
  Meier: University of Chicago), the full abstract stating the product-limit
  estimator in the authors' own original notation (P-hat(t) = prod_r
  [(N-r)/(N-r+1)]), and the start of the table of contents down through
  section 3.2, plus the funding footnote (Bell Telephone Laboratories, Johns
  Hopkins, Office of Naval Research grant).
url: "https://web.stanford.edu/~lutian/coursepdf/KMpaper.pdf (page 2 of the PDF)"
fetched_via: "npm run image -- capture (tsx scripts/image.ts), which also extracted an embedded page-sized bitmap (nonparametri-title-page-fig-000.png, 2400x3700, higher resolution than the plain page render) — kept that one under this filename and discarded the lower-res plain render."
notes: >
  Public domain in practice for teaching use: JASA 1958, well past any
  copyright-renewal window for a US government/ONR-funded work of this era;
  page itself is a JSTOR-hosted scan (JSTOR terms apply to their specific
  digitization/redistribution, not to the underlying 1958 text) but this
  copy comes from the Stanford open mirror, not JSTOR directly. Treat
  licence as "publisher (C) -> teaching use / effectively public domain" —
  verify before any commercial redistribution. Quality: crisp, legible
  black-and-white scan/typeset reproduction, high enough resolution to zoom
  into the abstract formula.

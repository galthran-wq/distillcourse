source: >
  Van Westendorp, P.H. (1976) "NSS-Price Sensitivity Meter (PSM) - A New
  Approach to Study Consumer Perception of Prices," Proceedings of the 29th
  ESOMAR Congress, Venice, 5-9 September 1976, pp. 139-167. Reproduced in
  Research World (ESOMAR), published online 2015-06-09.
covers: >
  "Appendix fig. 1" from the original paper: the first crossing-curves chart
  Van Westendorp published, showing the cumulative "cheap" and "expensive"
  distributions for electric razors in the Netherlands (N=269), crossing at
  14% / Dfl. 88.50 — this crossing point is the Indifference Price (IDP),
  the paper's founding construct. Corresponds to the "Figure I" referenced
  in-line in the running text and to Table 3/Table 4's numeric results for
  the same electric-razor dataset.
url: >
  Captured from https://web.archive.org/web/20250630102841im_/https://archive.researchworld.com/wp-content/uploads/2012/05/appendix-fig-1.jpg
  (embedded in https://web.archive.org/web/20250630102841/https://archive.researchworld.com/a-new-approach-to-study-consumer-perception-of-price/ ,
  a Wayback Machine mirror of the Research World / ESOMAR magazine page that
  reproduces the 1976 paper; the live archive.researchworld.com page was
  returning HTTP 500 at capture time).
fetched_via: curl
notes: >
  This is the ORIGINAL 1976 chart (reproduced by ESOMAR's own magazine, not a
  third-party redrawing) — real survey data from an NSS study of N=269 Dutch
  respondents, plotted on what the paper's later section states was IBM S3
  computer + markreader output. It is the diagram that defines "Indifference
  Price," the term every later Van Westendorp write-up borrows. Kept as a
  real-artefact image candidate rather than a redrawing because its point is
  authenticity ("this is literally what Van Westendorp published"), not just
  the data — the same numbers are already transcribed as text in
  nssprice.txt and nssprice-appendix-data.txt for redrawing if a lesson
  prefers a clean in-house chart instead. Quality: clean 1970s typeset/plotted
  original (not a handwritten scan), legible axis labels and annotation boxes,
  black-and-white, moderate resolution (526-595px wide source JPEGs — fine
  for inline use, would pixelate if blown up full-bleed).

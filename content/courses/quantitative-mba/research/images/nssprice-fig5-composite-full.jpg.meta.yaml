source: >
  Van Westendorp, P.H. (1976) "NSS-Price Sensitivity Meter (PSM) - A New
  Approach to Study Consumer Perception of Prices," Proceedings of the 29th
  ESOMAR Congress, Venice, 5-9 September 1976, pp. 139-167. Reproduced in
  Research World (ESOMAR), published online 2015-06-09.
covers: >
  "Appendix fig. 5" from the original paper: the complete, all-four-curves
  PSM chart for electric razors (N=269) — "not cheap," "too cheap," "not
  expensive," "too expensive" overlaid on one graph — marking IDP (point of
  indifference), OPS/OPP (optimal pricing point), MGP (point of marginal
  cheapness) and MDP (point of marginal expensiveness) simultaneously, with
  the "range of acceptable prices" (MGP-MDP) shaded/bracketed between them.
  This is the single diagram that shows every construct the paper defines
  (Point of Indifference & Analysis & definitions section; Marginal Pricing
  Points section) at once.
url: >
  Captured from https://web.archive.org/web/20250630102841im_/https://archive.researchworld.com/wp-content/uploads/2012/05/fig-5-appendix-.jpg
  (embedded in https://web.archive.org/web/20250630102841/https://archive.researchworld.com/a-new-approach-to-study-consumer-perception-of-price/ ,
  a Wayback Machine mirror of the Research World / ESOMAR magazine page that
  reproduces the 1976 paper; the live archive.researchworld.com page was
  returning HTTP 500 at capture time).
fetched_via: curl
notes: >
  Original 1976 figure, not a redrawing. Chosen alongside fig-1 because it is
  the ONE chart in the appendix that carries every named construct the paper
  introduces (IDP, OPP/OPS, MGP, MDP, range of acceptable prices) on a single
  axis — a lesson that wants to show "here is literally the paper's own full
  picture" needs this exact frame, not a partial one. Same underlying
  electric-razor numbers are transcribed in nssprice-appendix-data.txt (Table
  4 gives the same five figures as plain numbers: IDP=88.50/14%,
  OPP=72.50/4%, MGP=52.50/28%, MEP=122.50/33%, range=52.50-122.50) so a house
  redrawing is possible without re-deriving anything from the image. Quality:
  same clean 1970s typeset original as fig-1, legible, black-and-white,
  ~517x345px source.

notes: "Whole-page render kept (title + citation carry the pedagogical point); the auto-extracted fig-000.png (chart only, no labels/citation) was deleted as redundant. Chart is a published empirical result from Malmendier, Moretti & Peters (2011) - cumulative abnormal returns for bidding-war 'winners' vs 'losers' in the 40 months before/after the outcome - reproduced verbatim (visibly scanned from the original paper, not redrawn) inside Damodaran's slide deck. This is exactly the kind of academic evidence a redrawing would flatten: the visual roughness (scan artifacts, original axis/legend styling) is itself evidence it is the real published figure, not a paraphrase."

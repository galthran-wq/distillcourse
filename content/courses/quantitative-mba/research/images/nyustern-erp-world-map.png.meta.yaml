notes: "Whole-page render kept (the data tables carry the content); the auto-extracted fig-000.png was just the blank world-map background with red dots and no numbers, so it was deleted as useless alone. This exact table (Moody's rating / added country risk / total ERP, color-coded blue/red/green, ~150 countries) is Damodaran's signature exhibit - reproduced constantly across finance textbooks, blogs, and case studies as 'the Damodaran country risk premium table.' The underlying numbers are also available live and current as a spreadsheet (nyustern-ctrypremJuly26.xlsx in the texts cache), so redraw the NUMBERS for any lesson exhibit; keep this page image only if the point is 'this is literally the artifact practitioners cite,' since the January-2025-dated, hand-assembled table-on-map layout is Damodaran's own branded format, not a neutral data visualization a house style would produce the same way."

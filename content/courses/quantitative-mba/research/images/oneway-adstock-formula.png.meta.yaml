notes: "This is the literal coining of 'ad stock' as a technical term and its first published formula: weights (1-L)/(f(1-L)+L) * (f, L, ..., L^(r-2), L^(r-1)) applied to TVRs V_1..V_r, ie a geometric/Koyck-decay weighted sum -- the direct ancestor of every 'adstock transform' in modern MMM code. Scan fully legible."

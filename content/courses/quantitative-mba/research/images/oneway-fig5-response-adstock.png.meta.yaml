source: "Simon Broadbent, \"One Way TV Advertisements Work,\" Journal of the Market Research Society, vol. 21, no. 3 (July 1979), pp. 139-166"
covers: "p.144, Figure 5 'Awareness and ad stock for five brands' (labelled A-E), the response/ad stock diagram itself, with the surrounding paragraph defining base (b) and slope (s) and naming the diagram type"

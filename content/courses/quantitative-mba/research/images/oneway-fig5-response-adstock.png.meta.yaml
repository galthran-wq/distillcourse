notes: "This is Broadbent's own named diagram type ('response/ad stock diagram'), which he explicitly says is 'as useful in this context as a Christie diagram is in press schedule construction' -- ie he considered it the canonical output chart of the method, one line per brand (fitted awareness vs ad stock, over the observed range). Five real anonymised brands (A-E), same five brands used in the results Table on p.166. Scan fully legible, hand-drawn/typeset line chart typical of 1970s JMRS figures."

notes: "The canonical 'build-up then decay' adstock curve: convex growth while advertising runs (result of decay, since response itself is linear in ad stock), concave decline once it stops. This is Broadbent's own illustration of what an adstock-driven awareness trajectory looks like, and the one he explicitly ties to Zielske's classic direct-mail recall data. Fully legible circle-and-line chart."

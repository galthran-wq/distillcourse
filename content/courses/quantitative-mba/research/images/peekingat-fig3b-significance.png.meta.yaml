notes: >
  Real Optimizely dashboard screenshot: "Statistical Significance" panel for
  the same live experiment as peekingat-fig3a-conversion-rate.png, computed
  from the always-valid p-values of Section 4.3. Shows the step-like,
  monotonically nondecreasing significance curve (0% to ~53%) that is the
  paper's proof-by-screenshot that always-valid significance never
  decreases as more data arrives — the concrete payoff of the reset-policy
  design in Section 4.4. Vector-derived, sharp, legible.

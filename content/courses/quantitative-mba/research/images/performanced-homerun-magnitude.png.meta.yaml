source: >
  "Performance Data and the 'Babe Ruth' Effect in Venture Capital" by Chris
  Dixon, a16z.com, June 8, 2015 — chart built from Horsley Bridge Partners'
  aggregated, anonymized LP data on hundreds of VC funds since 1985.
covers: >
  The "average magnitude of home runs" chart — average return multiple of the
  >10x ("homerun") investments on the Y-axis, plotted against fund-performance
  bucket on the X-axis (<1x, 1x-2x, 2x-3x, 3x-5x, >=5x). Roughly flat around
  15-20x for the bottom three buckets, then jumps sharply to ~65-70x for the
  best (>=5x) bucket — the essay's headline "20x for good funds vs ~70x for
  great funds" number. Second of the essay's four charts, directly under the
  "they have home runs of greater magnitude" paragraph.
url: https://a16z.com/wp-content/uploads/2023/04/powerlaw-fromhorsleydata_a16z.png
  (linked from https://a16z.com/performance-data-and-the-babe-ruth-effect-in-venture-capital/)
fetched_via: curl (npm run image -- capture, direct web-image fetch)
notes: >
  licence: publisher (a16z) (c) — teaching use; unknown redistribution terms

source: >
  "Performance Data and the 'Babe Ruth' Effect in Venture Capital" by Chris
  Dixon, a16z.com, June 8, 2015 — chart built from Horsley Bridge Partners'
  aggregated, anonymized LP data on hundreds of VC funds since 1985.
covers: >
  The "Home runs" chart — % of investments returning >10x ("homeruns") on the
  Y-axis, plotted against fund-performance bucket on the X-axis (<1x, 1x-2x,
  2x-3x, 3x-5x, >=5x). Monotonically rises from under 1% in the worst bucket
  to roughly 18-19% in the best. First of the essay's four charts, directly
  under the "Home runs" paragraph.
url: https://a16z.com/wp-content/uploads/2023/04/homeruns-fromhorselydata_a16z.png
  (linked from https://a16z.com/performance-data-and-the-babe-ruth-effect-in-venture-capital/)

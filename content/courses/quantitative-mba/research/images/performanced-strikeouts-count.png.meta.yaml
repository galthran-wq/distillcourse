source: >
  "Performance Data and the 'Babe Ruth' Effect in Venture Capital" by Chris
  Dixon, a16z.com, June 8, 2015 — chart built from Horsley Bridge Partners'
  aggregated, anonymized LP data on hundreds of VC funds since 1985.
covers: >
  The "Strikeouts" chart (count-weighted) — % of money-losing investments on
  the Y-axis, plotted against fund-performance bucket on the X-axis (<1x,
  1-2x, 2-3x, 3-5x, >5x). U-shaped: ~74% at <1x, drops to ~50% at 1-2x,
  bottoms near ~39% at 2-3x and 3-5x, then rises again to ~44% at >5x — the
  essay's central counterintuitive finding that great funds lose money MORE
  often than merely good funds. Third of the essay's four charts, directly
  under the "Strikeouts" paragraph.
url: https://a16z.com/wp-content/uploads/2023/04/strikeouts-fromhorselydata_a16z.png
  (linked from https://a16z.com/performance-data-and-the-babe-ruth-effect-in-venture-capital/)
fetched_via: curl (npm run image -- capture, direct web-image fetch)
notes: >
  licence: publisher (a16z) (c) — teaching use; unknown redistribution terms
  beyond that. quality: clean vector-style PNG, 1140x746, fully legible axis
  labels and data points, gridline markers visible on chart border. This is
  the original a16z-branded chart image embedded in the live page, not a
  re-render. This is the canonical "U-shaped loss curve" figure that VC
  power-law discussions across the industry reference back to.

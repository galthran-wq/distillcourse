source: >
  "Performance Data and the 'Babe Ruth' Effect in Venture Capital" by Chris
  Dixon, a16z.com, June 8, 2015 — chart built from Horsley Bridge Partners'
  aggregated, anonymized LP data on hundreds of VC funds since 1985.
covers: >
  The same "Strikeouts" chart re-weighted by dollars invested per investment —
  % of money-losing investments (dollar-weighted) on the Y-axis vs fund-
  performance bucket on the X-axis (<1x, 1-2x, 2-3x, 3-5x, >5x). Same U-shape
  as the count-weighted version: ~74% at <1x, ~49% at 1-2x, minimum ~35% at
  2-3x, rising to ~40% at 3-5x and ~45% at >5x. Fourth and last of the essay's
  four charts, directly under "the same chart with the Y-axis weighted by
  dollars invested per investment."
url: https://a16z.com/wp-content/uploads/2023/04/dollarweighted-fromhorselydata_a16z.png
  (linked from https://a16z.com/performance-data-and-the-babe-ruth-effect-in-venture-capital/)
fetched_via: curl (npm run image -- capture, direct web-image fetch)
notes: >
  licence: publisher (a16z) (c) — teaching use; unknown redistribution terms
  beyond that. quality: highest-resolution capture of the four (2475x1600,
  73 KB), fully legible axis labels and data points. This is the original
  a16z-branded chart image embedded in the live page, not a re-render. Lower
  priority than the count-weighted strikeout chart for a lesson pick (same
  story, redundant if only one U-shaped chart is needed) but worth keeping
  since the essay presents both explicitly to show the pattern is robust to
  weighting.

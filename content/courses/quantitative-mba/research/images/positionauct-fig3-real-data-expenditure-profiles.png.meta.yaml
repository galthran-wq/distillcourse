source: "Hal R. Varian, \"Position Auctions\", Int. J. Ind. Organ. 25(6):1163-1178, 2007"
covers: "Fig. 3, 'Examples of data and fits' - four panels of real (anonymized) Google keyword auctions: acne treatment, air travel, antique, bamboo flooring"
url: "https://people.ischool.berkeley.edu/~hal/Papers/2006/position.pdf, page 13 (printed page 1175)"
fetched_via: curl
notes: >
  Tight embedded bitmap extracted directly from the PDF page (no cropping
  performed) - this was the whole figure stored as its own image object, so
  nothing was cropped out. Axis numeric values are deliberately absent in the
  original because the underlying data is Google's proprietary auction data;
  Varian anonymized only the scale, not the shape. Each panel plots observed
  clickthrough rate x_s (horizontal) against observed expenditure p_s*x_s
  (vertical) for one real keyword's auction, with the actual data (black) and
  the closest increasing-convex quadratic-programming fit (magenta) overlaid.

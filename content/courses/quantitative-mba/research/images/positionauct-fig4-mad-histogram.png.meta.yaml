notes: >
  Whole-page render, not a cropped figure: the PDF stores this histogram as
  vector line art (bars drawn as paths), not a bitmap, so no embedded
  figure-only image was extractable - a downstream crop of the lower third of
  this page (below the "9. Information requirements... 10. Empirical
  analysis" text) is needed before use. Reported numbers: mean absolute
  deviation of the perturbations across the 2425 auctions averages 5.8%,
  median 4.8%, very few auctions above 10% - i.e., unperturbed Google auction
  data already nearly satisfies Varian's SNE inequalities.

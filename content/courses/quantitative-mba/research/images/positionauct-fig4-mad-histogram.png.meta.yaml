source: "Hal R. Varian, \"Position Auctions\", Int. J. Ind. Organ. 25(6):1163-1178, 2007"
covers: "Fig. 4, 'Distribution of mean absolute deviations' - histogram over 2425 real Google keyword auctions (>=5 ads each, one particular day) of the minimal per-auction quality perturbation needed to satisfy the symmetric-Nash-equilibrium inequalities"
url: "https://people.ischool.berkeley.edu/~hal/Papers/2006/position.pdf, page 14 (printed page 1176)"

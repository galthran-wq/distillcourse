source: >
  "Simplifying programmatic: first price auctions for Google Ad Manager" —
  Sam Cox, Google Ad Manager blog, March 6, 2019
covers: >
  The post's single inline figure (alt-text "First Price Auction Stacked"),
  captured at full published resolution (2000x1594, the largest srcset
  candidate the page ships).
url: >
  https://storage.googleapis.com/gweb-uniblog-publish-prod/images/FPA_Stacked_v4.width-2000.format-webp.webp
  (embedded in
  https://blog.google/products/admanager/simplifying-programmatic-first-price-auctions-google-ad-manager/)
fetched_via: curl (direct image file, converted webp -> png with Pillow for
  universal readability; no cropping or redrawing)
notes: >
  This is Google's own two-panel diagram contrasting "Common auction
  scenario today" (a second-price auction's winning bid re-enters, as just
  one more bid, into an outer first-price auction — the chained/"daisy
  chain" waterfall the post is complaining about) against "Unified first
  price auction" (bids go straight into one first-price auction). See id
  simplifyingp-hero in the reader's image_candidates for why this specific
  bitmap, not a redrawing, should be used.

source: >
  "The Bullseye Framework for Getting Traction", Gabriel Weinberg
  (Medium, @yegg, Sep 27, 2015) — excerpt from "Traction: How Any
  Startup Can Achieve Explosive Customer Growth" by Gabriel Weinberg
  and Justin Mares (Penguin Random House)
covers: >
  The portrait of Peter Thiel placed beside the article's pull-quote
  ("[You] probably won't have a bunch of equally good distribution
  strategies... It is very likely that one channel is optimal...
  Poor distribution — not product — is the number one cause of
  failure."), the line the whole Bullseye framework is built to
  answer.
url: https://cdn-images-1.medium.com/max/800/1*MfjpwS_o_FPGOn5H9Z8vzg.jpeg
  (embedded in https://medium.com/@yegg/the-bullseye-framework-for-getting-traction-ef49d05bfd7e ,
  confirmed present in the Wayback snapshot
  https://web.archive.org/web/20170328105353/https://medium.com/@yegg/the-bullseye-framework-for-getting-traction-ef49d05bfd7e )
fetched_via: curl (direct fetch from cdn-images-1.medium.com; the medium.com
  HTML page itself was fetched via curl against the Wayback Machine snapshot,
  since direct curl to medium.com hits a Cloudflare bot-block in this sandbox)
notes: >
  This is the only image in the source article that is not generic decorative
  stock photography (the other three in-article images, credited "CLIX",
  "Interactivity Digital", and "DopePicz" in figcaptions, are unrelated stock
  vector/photo filler between sections — a crowd-of-silhouettes brainstorming
  graphic, three lab flasks, and a dartboard-with-dart photo — and the header
  banner, credited "Fox Entertainment", is a generic aerial stock photo of a
  person standing in a painted archery target. None of those four carry
  framework-specific content; a clean labeled three-ring diagram would explain
  the framework better than any of them, so they were not kept. A small
  133x184px thumbnail of Gabriel Weinberg himself sits by the byline at the
  end of the post but is below the site's 480px figure-width floor (checked
  via `npm run image -- check`) and was discarded as a thumbnail, not a
  figure.

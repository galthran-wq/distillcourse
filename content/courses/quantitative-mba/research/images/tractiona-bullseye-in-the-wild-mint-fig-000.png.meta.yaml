shows: >
  Noah Kagan's actual channel-test tracking spreadsheet from Mint.com's
  pre-launch traction push (Bullseye Framework "Step 4: Test" applied in
  practice) — rows for TechCrunch, Dave McClure, Mashable, Reddit, Digg,
  Google Organic, Google Ads, Paul Stamatiou, Personal Finance Sponsorships,
  and Okdork.com, each with Traffic, CTR, Conversion %, Total Users, Status
  (Friend/Emailing/Coordinated/Receiving/Bought/Self) and Confirmed Users
  columns, totalling 116,725 total users / 104,225 confirmed.
located: >
  "Bullseye in the Wild" sidebar, Chapter 2 "The Bullseye Framework", book
  page 17 (PDF page 22 of the promo excerpt).
why_real: >
  This is the book's own canonical worked example of the Bullseye Step 4
  ("Test") in action — the actual screenshotted data Mint's team used to
  decide which channel (targeting blogs) to focus on. It is real historical
  business data reproduced by the authors from an interview, not an
  illustrative diagram; a redrawing would misrepresent it as invented numbers
  rather than the artefact the book is citing as evidence.

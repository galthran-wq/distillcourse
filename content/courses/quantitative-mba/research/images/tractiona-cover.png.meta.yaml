id: tractiona-cover
capture: content/courses/quantitative-mba/research/images/tractiona-cover.png
shows: >
  Official front cover of the 2014 S-curves Publishing hardcover first
  edition: yellow diagonal-stripe field, "TRACTION / A Startup Guide to
  Getting Customers" title block, "Written by Gabriel Weinberg and Justin
  Mares," and a hand-drawn dashed pink line tracing a stair-step growth curve
  (flat, spike, plateau, spike again) up the page.
located: "Front cover, PDF page 1 of the promo excerpt (page precedes the printed book's page numbering)."
why_real: >
  The dashed growth curve on the cover is not decoration — Chapter 3
  ("Moving the Needle," book p.25) explicitly says "That's why the cover of
  our book looks the way it does," referring to the exact spurts-then-plateau
  growth pattern the chapter describes (a channel gets found -> spike ->
  saturates -> flattens -> repeat). Showing the real cover is showing the
  book's own citation of itself as the diagram; a redrawing would sever that
  link and also misrepresent it as a generic stock photo/illustration rather
  than the identifiable, citable edition cover.

# Research canon for the Quantitative MBA course (Parts I–II: unit economics
# & customer base; experimentation & causal inference), compiled 2026-08 by
# the source-reading swarm. "role" = which lessons the source grounds.
# Cached full texts live in research/texts/ (with .meta.yaml sidecars);
# image captures in research/images/, indexed by research/images.yaml.
#
# FOUR SOURCES ARE TOC-ONLY (no legal full text found): Kohavi/Tang/Xu
# (beyond ch.1), Mostly Harmless Econometrics (beyond ch.1), Monetizing
# Innovation, The Mom Test. The human should buy/borrow these so the
# reading can be re-run at full depth; lesson briefs flag every claim that
# currently rests on secondary reconstruction.

sources:
  - title: "Probability Models for Customer-Base Analysis"
    author: "P. S. Fader, B. G. S. Hardie"
    url: "https://doi.org/10.1016/j.intmar.2008.11.003"
    kind: journal-article
    access: >
      Full — 9-page synthesis article (Journal of Interactive Marketing
      23(1):61-69, 2009), fetched and cached (probabilitym-.pdf/.txt).
      NOTE: the canon list called it a "textbook"; it is an article, and it
      does NOT cover Gamma-Gamma (only a one-line pointer).
    role: >
      Map layer for module 1: the contractual/noncontractual × discrete/
      continuous 2×2, the theta-mixture worldview, the model naming chain
      (NBD, Pareto/NBD, BG/NBD, BG/BB, sBG), Vodafone-vs-Amazon customer
      counts, the four-customer P(alive) intuition pump.

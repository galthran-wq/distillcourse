concepts:
  # --- Module 1: Contact and Colonial America ---
  - id: columbian-exchange
    name: Columbian Exchange
    definition: "The post-1492 transfer of people, crops, animals, and pathogens between hemispheres — reciprocal but wildly asymmetric in its effects"
    introduced_in: indigenous-america
  - id: epidemic-collapse
    name: Epidemic collapse
    definition: "The ~90% decline of the Indigenous population of the Americas within roughly 150 years of contact, driven primarily by Old World disease"
    introduced_in: indigenous-america
  - id: primary-sources
    name: Primary sources
    definition: "Artifacts produced in the period under study — documents, maps, photographs — read as evidence of their moment, distinct from later narrative accounts"
    introduced_in: indigenous-america
  - id: colonization-models
    name: Colonization models
    definition: "The three European colonization models in North America — Spain's tribute-and-silver empire, France's fur-and-alliance network, the Dutch trading entrepôt — each leaving a distinct legacy"
    introduced_in: european-empires
  - id: black-legend
    name: Black Legend
    definition: "The 16th–17th-century Protestant propaganda tradition portraying Spanish colonization as uniquely cruel — real atrocities, selectively printed; a standing exercise in reading polemic as a source"
    introduced_in: european-empires
  - id: mayflower-compact
    name: Mayflower Compact
    definition: "The 1620 shipboard covenant creating a 'civil body politic' by consent of the governed — the first written instrument of self-government in English America"
    introduced_in: new-england-covenant
  - id: covenanted-town
    name: Covenanted town
    definition: "New England's unit of settlement and self-rule: land granted to a congregation that governed itself by town meeting and taxed for church and school"
    introduced_in: new-england-covenant
  - id: settler-selection
    name: Settler selection
    definition: "The measurable distinctiveness of the settler population — family migration, near-universal male literacy in New England, print density, and the world's highest ordinary wages by the 18th century"
    introduced_in: new-england-covenant
  - id: wampanoag-alliance
    name: Wampanoag alliance
    definition: "The 1621 Plymouth–Wampanoag mutual-defense treaty under Massasoit that held for some 54 years; the 1621 harvest feast kept as Thanksgiving is its artifact"
    introduced_in: new-england-covenant
  - id: king-philips-war
    name: King Philip's War
    definition: "The 1675–76 war between the English colonies and a Wampanoag-led coalition — proportionally the deadliest war in American history"
    introduced_in: natives-and-english
  - id: indentured-servitude
    name: Indentured servitude
    definition: "Bound labor for a fixed term in exchange for passage — the Chesapeake's dominant labor system before racial slavery"
    introduced_in: colonial-societies
  - id: racial-slavery
    name: Racial slavery
    definition: "Slavery made racial, hereditary, and lifelong by statute — the legal regime English colonies constructed in the late 17th century"
    introduced_in: colonial-societies
  - id: colonial-pluralism
    name: Colonial pluralism
    definition: "Religious and ethnic diversity as a working political order — Dutch toleration, Penn's liberty of conscience — and the commercial society it enabled in the middle colonies"
    introduced_in: middle-colonies
  - id: first-great-awakening
    name: First Great Awakening
    definition: "The 1730s–40s evangelical revival — the colonies' first shared mass experience, multiplying denominations and normalizing challenges to established authority"
    introduced_in: awakening-and-empire
  - id: seven-years-war
    name: Seven Years' War
    definition: "The 1754–63 Anglo-French world war that began in the Ohio Valley, expelled France from North America, and left Britain the debt that started the imperial crisis"
    introduced_in: awakening-and-empire

  # --- Module 2: Revolution and Founding ---
  - id: imperial-crisis
    name: Imperial crisis
    definition: "The 1763–1775 conflict over Parliament's attempts to tax and govern the colonies to pay the Seven Years' War debt"
    introduced_in: american-revolution
  - id: natural-rights
    name: Natural rights
    definition: "The Declaration's premise: rights held prior to government, which governments exist to secure and forfeit legitimacy by violating"
    introduced_in: american-revolution
  - id: revolutionary-paradox
    name: Revolutionary paradox
    definition: "The Revolution's central contradiction: a liberty revolution that preserved slavery and an anti-statist revolt that produced a new central state"
    introduced_in: american-revolution
  - id: contingency
    name: Contingency
    definition: "Outcomes decided by narrow, datable events — a fog, a storm, a vote margin — rather than structural inevitability; a standing analytic category of this course"
    introduced_in: war-of-independence
  - id: french-alliance
    name: French alliance
    definition: "The 1778 Franco-American treaties that converted a colonial rebellion into a world war Britain could not win"
    introduced_in: war-of-independence
  - id: mixed-government
    name: Mixed government
    definition: "The classical doctrine (Polybius) that stable constitutions mix monarchy, aristocracy, and democracy — the design vocabulary behind 1787's president, Senate, and House"
    introduced_in: roman-blueprint
  - id: classical-republicanism
    name: Classical republicanism
    definition: "The ideology of 1776 (Wood): a republic survives on civic virtue — the sacrifice of private interest to the public good — a premise the Constitution of 1787 redesigned around"
    introduced_in: roman-blueprint
  - id: federalism
    name: Federalism
    definition: "Divided sovereignty between nation and states — in Madison's formula, a constitution 'neither national nor federal, but a composition of both'"
    introduced_in: constitutional-convention
  - id: separation-of-powers
    name: Separation of powers
    definition: "Legislative, executive, and judicial power lodged in distinct branches, each armed with checks on the others"
    introduced_in: constitutional-convention
  - id: three-fifths-compromise
    name: Three-fifths compromise
    definition: "The apportionment bargain counting three-fifths of the enslaved population toward representation and direct taxes"
    introduced_in: constitutional-convention
  - id: extended-republic
    name: Extended republic
    definition: "Madison's argument that a large, diverse republic controls faction better than a small one, inverting the classical objection"
    introduced_in: ratification-and-bill-of-rights
  - id: bill-of-rights
    name: Bill of Rights
    definition: "The first ten amendments (1791), extracted as the price of ratification over Federalist objections that enumeration was dangerous"
    introduced_in: ratification-and-bill-of-rights

  # --- Module 3: Early Republic and Antebellum America ---
  - id: political-parties
    name: Political parties
    definition: "Organized, durable electoral factions — an institution the founders dreaded and then built within a decade"
    introduced_in: early-republic-politics
  - id: peaceful-transfer
    name: Peaceful transfer of power
    definition: "Government passing between hostile parties by election rather than force, first demonstrated in 1800–01"
    introduced_in: early-republic-politics
  - id: judicial-review
    name: Judicial review
    definition: "Courts' power to void statutes repugnant to the Constitution, established strategically in Marbury v. Madison (1803)"
    introduced_in: jeffersonian-america
  - id: empire-of-liberty
    name: Empire of liberty
    definition: "Jefferson's program of continental expansion as the multiplication of a citizen-farmer republic rather than conquest"
    introduced_in: jeffersonian-america
  - id: market-revolution
    name: Market revolution
    definition: "The 1815–1848 transformation of transport, credit, and labor that pulled households from subsistence into market production"
    introduced_in: market-revolution
  - id: wage-labor
    name: Wage labor
    definition: "Labor sold by the hour or piece for cash — a new and contested condition in the antebellum North"
    introduced_in: market-revolution
  - id: jacksonian-democracy
    name: Jacksonian democracy
    definition: "Mass electoral politics built on near-universal white male suffrage, popular partisanship, and the presidential veto as a popular instrument"
    introduced_in: jacksonian-democracy
  - id: indian-removal
    name: Indian removal
    definition: "The federal policy of forcibly relocating eastern Native nations west of the Mississippi, legislated in 1830"
    introduced_in: jacksonian-democracy
  - id: nativism
    name: Nativism
    definition: "Political hostility to immigrants and Catholics as threats to the republic, recurrent from the 1840s onward"
    introduced_in: jacksonian-democracy
  - id: second-great-awakening
    name: Second Great Awakening
    definition: "The mass evangelical revival of the early 19th century that democratized American religion and fueled reform"
    introduced_in: religion-and-reform
  - id: abolitionism
    name: Abolitionism
    definition: "The movement for slavery's end — shifting from gradualism and colonization to immediate, uncompensated emancipation"
    introduced_in: religion-and-reform

  # --- Module 4: Slavery, Expansion, and Sectional Crisis ---
  - id: cotton-kingdom
    name: Cotton Kingdom
    definition: "The cotton-and-slavery political economy of the Deep South, supplying ~60% of US exports by 1860"
    introduced_in: cotton-kingdom
  - id: domestic-slave-trade
    name: Domestic slave trade
    definition: "The forced internal migration of nearly one million enslaved people from the upper South to the cotton frontier, 1810–1860"
    introduced_in: cotton-kingdom
  - id: manifest-destiny
    name: Manifest destiny
    definition: "The ideology that continental expansion was providential and inevitable — annexation justified as destiny"
    introduced_in: manifest-destiny
  - id: free-soil
    name: Free soil
    definition: "Opposition to slavery's expansion into the territories (not necessarily to slavery where it stood), crystallized by the Wilmot Proviso"
    introduced_in: manifest-destiny
  - id: free-labor
    name: Free-labor ideology
    definition: "The Republican creed that wage labor is a stage toward independence and that slavery degrades all labor — the North's answer to the planter worldview"
    introduced_in: sectional-crisis
  - id: secession
    name: Secession
    definition: "The claimed state right to leave the Union, enacted by eleven states in 1860–61 in defense of slavery"
    introduced_in: sectional-crisis

  # --- Module 5: Civil War and Reconstruction ---
  - id: war-for-union
    name: War for Union
    definition: "The initial Northern war aim: restore the Union without touching slavery where it existed"
    introduced_in: war-for-union
  - id: self-emancipation
    name: Self-emancipation
    definition: "Enslaved people freeing themselves by flight to Union lines, forcing emancipation onto the military and political agenda"
    introduced_in: emancipation
  - id: emancipation-proclamation
    name: Emancipation Proclamation
    definition: "Lincoln's January 1, 1863 war measure freeing the enslaved in rebel-held territory and opening Black enlistment"
    introduced_in: emancipation
  - id: total-war
    name: Total war
    definition: "War waged on an enemy's resources, morale, and social system, not only its armies — the Union strategy of 1864–65"
    introduced_in: union-victory
  - id: reconstruction-amendments
    name: Reconstruction Amendments
    definition: "The 13th (abolition), 14th (citizenship and equal protection), and 15th (Black male suffrage) Amendments, 1865–1870"
    introduced_in: reconstruction
  - id: sharecropping
    name: Sharecropping
    definition: "Tenant farming for a crop share under planter-supplied credit — the labor compromise that replaced both slavery and land redistribution"
    introduced_in: reconstruction
  - id: redemption
    name: Redemption
    definition: "The violent recapture of Southern state governments by white Democrats, 1870–1877, ending Reconstruction"
    introduced_in: redemption
  - id: lost-cause
    name: Lost Cause
    definition: "The postwar memory tradition recasting the Confederacy as noble and Reconstruction as misrule, erasing slavery as the war's cause"
    introduced_in: civil-war-memory

  # --- Module 6: Industrial America, the West, and Empire ---
  - id: assimilation-policy
    name: Assimilation policy
    definition: "The federal program to dissolve tribal life via land allotment (Dawes Act) and boarding-school reeducation"
    introduced_in: conquering-the-west
  - id: frontier-thesis
    name: Frontier thesis
    definition: "Turner's 1893 claim that free western land explained American democracy — announced as the frontier closed"
    introduced_in: conquering-the-west
  - id: incorporation-of-america
    name: Incorporation of America
    definition: "Trachtenberg's frame for the Gilded Age: corporate reorganization of space (railroads, time zones), labor (mechanization), and people (urbanization)"
    introduced_in: capital-and-labor
  - id: populism
    name: Populism
    definition: "The 1890s farmer-labor revolt against corporate money power — free silver, regulation, and the People's Party"
    introduced_in: capital-and-labor
  - id: new-immigration
    name: New immigration
    definition: "The post-1880 wave from southern and eastern Europe (and Asia and Mexico) that supplied industrial labor and provoked restriction"
    introduced_in: immigration-and-the-city
  - id: urbanization
    name: Urbanization
    definition: "The industrial concentration of population in cities, with the tenement as its housing form and reform photography as its record"
    introduced_in: immigration-and-the-city
  - id: jim-crow
    name: Jim Crow
    definition: "The Southern legal order of segregation and disenfranchisement built 1890–1910 and ratified by Plessy v. Ferguson"
    introduced_in: jim-crow
  - id: disenfranchisement
    name: Disenfranchisement
    definition: "Race-neutral devices — poll taxes, literacy tests, grandfather clauses — that eliminated the Black vote without naming race"
    introduced_in: jim-crow
  - id: imperialism
    name: Imperialism
    definition: "Acquisition and rule of overseas territory, opened for the US by the war of 1898 and contested by the Anti-Imperialist League"
    introduced_in: american-empire

  # --- Module 7: Progressivism, the Great War, and the Twenties ---
  - id: progressivism
    name: Progressivism
    definition: "The 1900–1917 reform wave joining moral-purity and scientific-efficiency impulses against industrial disorder"
    introduced_in: progressive-era
  - id: womens-suffrage
    name: Women's suffrage
    definition: "The 72-year campaign for the vote, won as the 19th Amendment in 1920"
    introduced_in: progressive-era
  - id: wilsonianism
    name: Wilsonianism
    definition: "Wilson's program of collective security and self-determination — the Fourteen Points and the League — rejected first by the US Senate"
    introduced_in: world-war-one
  - id: great-migration
    name: Great Migration
    definition: "The mass movement of Black Southerners to Northern and Western cities, opened by WWI labor demand and sustained for decades"
    introduced_in: world-war-one
  - id: consumer-culture
    name: Consumer culture
    definition: "The 1920s economy of mass-produced goods, installment credit, advertising, and broadcast media"
    introduced_in: the-twenties
  - id: immigration-restriction
    name: Immigration restriction
    definition: "The 1921–1924 national-origins quota system that ended mass European immigration for four decades"
    introduced_in: the-twenties

  # --- Module 8: Depression, New Deal, and World War II ---
  - id: associationalism
    name: Associationalism
    definition: "Hoover's crisis doctrine: voluntary business cooperation over federal compulsion — sincere, activist, and inadequate"
    introduced_in: great-depression
  - id: dust-bowl-migration
    name: Dust Bowl migration
    definition: "The 1930s ecological disaster on the southern Plains and the internal migration it drove — Oklahoma alone lost 18% of its people"
    introduced_in: great-depression
  - id: new-deal-state
    name: New Deal state
    definition: "The permanent federal regulatory and welfare apparatus built 1933–1938 — the floor under American capitalism"
    introduced_in: new-deal
  - id: social-insurance
    name: Social insurance
    definition: "Contributory, payroll-tax-funded protection against old age and unemployment — Social Security's distinctively American design"
    introduced_in: new-deal
  - id: redlining
    name: Redlining
    definition: "Federal-era neighborhood grading that tied mortgage credit to race — grade D drawn in red — with measurable present-day consequences"
    introduced_in: redlining
  - id: arsenal-of-democracy
    name: Arsenal of democracy
    definition: "US industrial mobilization as war strategy — production, Lend-Lease, and the wartime deficit spending that ended the Depression"
    introduced_in: world-war-two
  - id: four-freedoms
    name: Four Freedoms
    definition: "FDR's 1941 war aims — speech, worship, want, fear — redefining freedom to include economic security, and immediately contested"
    introduced_in: world-war-two
  - id: japanese-american-incarceration
    name: Japanese American incarceration
    definition: "The removal and imprisonment of ~120,000 Japanese Americans under Executive Order 9066, without charge and upheld in Korematsu"
    introduced_in: wwii-home-front
  - id: double-victory
    name: Double Victory
    definition: "The Black wartime campaign for victory over fascism abroad and racism at home — the bridge from war work to the civil rights movement"
    introduced_in: wwii-home-front

  # --- Module 9: Cold War America and After ---
  - id: containment
    name: Containment
    definition: "The postwar strategy of blocking Soviet expansion by economic, political, and ultimately military means"
    introduced_in: cold-war
  - id: mccarthyism
    name: McCarthyism
    definition: "The domestic anticommunist purge — loyalty programs, blacklists, and accusation as politics — of the late 1940s and early 1950s"
    introduced_in: cold-war
  - id: suburbanization
    name: Suburbanization
    definition: "The federally financed postwar movement to mass-produced suburbs, racially bounded by mortgage policy"
    introduced_in: affluent-society
  - id: school-desegregation
    name: School desegregation
    definition: "The constitutional reversal of Plessy in Brown v. Board (1954): separate educational facilities are inherently unequal"
    introduced_in: affluent-society
  - id: nonviolent-direct-action
    name: Nonviolent direct action
    definition: "Disciplined public confrontation — boycotts, sit-ins, marches — designed to force segregation's violence into national view"
    introduced_in: civil-rights-movement
  - id: voting-rights-enforcement
    name: Voting rights enforcement
    definition: "The 1965 Voting Rights Act's ban on literacy tests and federal preclearance — enforcement that registered 250,000 Black voters within a year"
    introduced_in: civil-rights-movement
  - id: great-society
    name: Great Society
    definition: "LBJ's 1964–66 legislative wave — civil rights, Medicare, Medicaid, immigration reform, the war on poverty"
    introduced_in: the-sixties
  - id: vietnam-escalation
    name: Vietnam escalation
    definition: "The incremental commitment from advisers to half a million troops, authorized by the Tonkin Gulf Resolution"
    introduced_in: the-sixties
  - id: stagflation
    name: Stagflation
    definition: "Simultaneous inflation and stagnation in the 1970s — the failure that broke the postwar economic consensus"
    introduced_in: the-seventies
  - id: silent-majority
    name: Silent majority
    definition: "Nixon's name for the anti-1960s backlash constituency — order, patriotism, and resentment of protest as a governing identity"
    introduced_in: the-seventies
  - id: new-right
    name: New Right
    definition: "The conservative movement coalition — free-market, law-and-order, and religious-traditionalist — that captured power in 1980"
    introduced_in: rise-of-the-right
  - id: neoliberalism
    name: Neoliberalism
    definition: "The post-1970s turn toward deregulation, tax cuts, and market solutions as the default of both parties' governance"
    introduced_in: rise-of-the-right
  - id: globalization
    name: Globalization
    definition: "The post-Cold War integration of trade, finance, and supply chains under US leadership — and its uneven domestic costs"
    introduced_in: recent-past
  - id: polarization
    name: Polarization
    definition: "The sorting of American parties into ideologically and culturally hostile blocs — the structural fact of recent politics"
    introduced_in: recent-past
  - id: historiography
    name: Historiography
    definition: "The history of historical interpretation itself — the competing frameworks historians use to organize the past, each a model with claims, evidence, and blind spots"
    introduced_in: historiographical-lenses

          - Pressure from Long, Coughlin, and Townsend shaped the Second New Deal
          - Social Security's payroll-tax design was a political choice
          - Court-packing, the 1937 recession, and the New Deal's racial exclusions
        demo: null

      - slug: redlining
        title: "Redlining: New Deal Housing Maps and the Racial Wealth Gap"

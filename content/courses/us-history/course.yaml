          - War work — women, Black workers, and Executive Order 8802
          - Executive Order 9066 — euphemism as policy
          - The GI Bill manufactured the postwar middle class
        demo: null

  - slug: postwar-america
    title: "Cold War America and After"
    outcomes: [co-chronology, co-promise, co-institutions]
    lessons:

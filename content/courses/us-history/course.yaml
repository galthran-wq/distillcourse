            presets for 1890 (new immigration), 1924 (quotas), 1970 (trough),
            2010. The reader watches the wave-quota-wave shape emerge.

      - slug: jim-crow
        title: "Jim Crow: Disenfranchisement and Segregation"
        type: core
        status: planned
        goal: "Explain how the South legally dismantled Black citizenship between 1890 and 1910 and how the Supreme Court ratified it"
        opening: "A generation after the Fifteenth Amendment, Southern states erased the Black vote without ever mentioning race in their statutes — and the Supreme Court declared segregation constitutional."
        est_minutes: 24
        prerequisites: [redemption]
        concepts:
          introduces: [jim-crow, disenfranchisement]
          reinforces: [redemption, reconstruction-amendments]
        key_ideas:

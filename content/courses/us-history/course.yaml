          - HOLC did not invent the maps — the FHA's were the ones that bit
          - Reading an area description form as a primary source
          - From 1937 grades to today's wealth, heat, and health gradients
        demo: null

      - slug: world-war-two
        title: "The Second World War"
        type: core
        status: planned
        goal: "Explain the US path from neutrality through Pearl Harbor to victory, and why the war left the US uniquely advantaged among the powers"
        opening: "The United States entered World War II last, fought it farthest from home, lost the fewest people among the major powers, and emerged in 1945 richer than it entered."
        est_minutes: 28
        prerequisites: [new-deal]
        concepts:
          introduces: [arsenal-of-democracy, four-freedoms]
          reinforces: [wilsonianism, new-deal-state]
        key_ideas:

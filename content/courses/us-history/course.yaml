schema_version: 1
slug: us-history
title: History of the United States
tagline: "How thirteen Atlantic colonies became the most powerful state in history — the land, labor, institutions, and wars that built it, from the documents and the numbers"
status: planned
audience: >
  Busy, curious adults with no prior US history coursework beyond vague
  school memories. Comfortable reading primary-source excerpts in period
  English and simple charts and maps; wants the actual causal story and the
  actual documents, not patriotic ceremony or trivia.
tone: >
  Dry, precise, evidence-forward. Declarative statements of fact; numbers
  and primary sources carry the argument. No rhetorical questions, no
  moralizing asides — the documents and the data are allowed to be damning
  on their own. Slavery, conquest, and race are analyzed as legal, economic,
  and political systems — statutes, prices, ballots, court holdings — never
  as occasions for sentiment, victimhood framing, or present-day
  editorializing. Second person only in instructions.
intro: >
  The course asks one question throughout: how did a strip of Atlantic
  colonies become the wealthiest and most powerful state in history? It
  answers causally, era by era: land that was cheap because contact had
  emptied it; labor systems bound and free; institutions that compounded —
  the constitutional compromise machine, courts, parties, the corporation;
  technology from the cotton gin to mass production; immigration at
  continental scale; and war mobilization that twice reset the world order.
  Primary documents, maps, and numbers carry the argument; where the record
  is damning it speaks for itself, and where it is triumphant it does too.


  The spine narrative follows the American Yawp; each lesson pairs it with
  the era's primary sources (National Archives milestone documents, the
  Lincoln papers, the Federalist Papers, HOLC maps) and with the strongest
  scholarly syntheses (Wood, McPherson, Foner, Kennedy, Blight). Foner's
  three-part reading of freedom claims — what a document means by freedom,
  what conditions back it, whom it excludes — stays in the toolbox as a
  source-reading instrument, one lens among several rather than the frame.
prerequisites:
  - text: "None — no prior US history is assumed"
  - text: "Comfort reading short primary-source excerpts in 18th–19th century English"
key_results:
  - text: "Epidemic disease, not battlefield conquest, killed roughly 90% of the Indigenous population of the Americas within about 150 years of contact"
    lesson: indigenous-america
  - text: "The Revolution was a paradox: a liberty revolution that preserved slavery, and a revolt against central power that built a new central state"
    lesson: american-revolution
  - text: "The Constitution is 'neither a national nor a federal Constitution, but a composition of both' — a compromise machine held together by making ambition counteract ambition"
    lesson: ratification-and-bill-of-rights
  - text: "Cotton and slavery expanded as one system: cotton reached about 60% of US exports by 1860 while nearly one million enslaved people were moved through the domestic slave trade"
    lesson: cotton-kingdom
  - text: "The Civil War transformed from a war for Union into a war for emancipation, at a cost of roughly 750,000 lives — driven jointly by enslaved people's flight and Lincoln's policy"
    lesson: emancipation
  - text: "Reconstruction was a constitutional refounding — the 13th, 14th, and 15th Amendments — overthrown by organized terror, Northern retreat, and the bargain of 1877"
    lesson: redemption
  - text: "The New Deal built a permanent federal floor under American capitalism — Social Security, deposit insurance, labor law — but wartime mobilization, not the New Deal, ended the Depression"
    lesson: new-deal
  - text: "Federal housing maps of the 1930s wrote race into neighborhood grades, and the lending geography they created still predicts wealth, health, and heat today"
    lesson: redlining
  - text: "Eleven years of disciplined mass protest produced the Civil Rights Act and Voting Rights Act — 250,000 new Black voters registered by the end of 1965 alone"
    lesson: civil-rights-movement
sources:
  - "J. Locke, B. Wright (eds.), The American Yawp, 2 vols., Stanford University Press (americanyawp.com) — narrative spine, CC-BY-SA"
  - "E. Foner, DuVal, McGirr, Give Me Liberty! An American History, 8th ed., Norton, 2026 (with the Voices of Freedom reader)"
  - "National Archives, America's Founding Documents and Milestone Documents (archives.gov)"
  - "Hamilton, Madison, Jay, The Federalist Papers (Avalon Project, Yale)"
  - "Library of Congress, Abraham Lincoln Papers and \"Abraham Lincoln and Emancipation\""
  - "G. S. Wood, Empire of Liberty: A History of the Early Republic, 1789–1815, Oxford, 2009"
  - "J. M. McPherson, Battle Cry of Freedom: The Civil War Era, Oxford, 1988"
  - "E. Foner, Reconstruction: America's Unfinished Revolution, 1863–1877, updated ed."
  - "D. M. Kennedy, Freedom from Fear: The American People in Depression and War, 1929–1945, Oxford, 1999"
  - "D. W. Blight, HIST 119 The Civil War and Reconstruction Era (Open Yale Courses, 2008)"
  - "P. Maier, 21H.101 American History to 1865 (MIT OpenCourseWare, 2010)"
  - "C. Horan, 21H.102 American History Since 1865 (MIT OpenCourseWare, 2018)"
  - "Digital Scholarship Lab, University of Richmond, American Panorama and Mapping Inequality (dsl.richmond.edu)"
outcomes:
  - id: co-chronology
    text: Sequence the major eras and turning points of US history from pre-contact to the early 21st century and state each era's defining transformation
    bloom: understand
  - id: co-causation
    text: "Analyze cause-and-effect chains across eras: slavery's expansion to sectional crisis to war; industrialization to Populist and Progressive revolt; depression to the New Deal state"
    bloom: analyze
  - id: co-sources
    text: Interpret primary sources — documents, photographs, maps, political cartoons — as evidence of their moment, distinguishing what a source documents from what it argues
    bloom: analyze
  - id: co-constitution
    text: Explain the constitutional system's design and trace how amendments and court rulings rewrote it, from judicial review through the Reconstruction Amendments to Plessy and Brown
    bloom: understand
  - id: co-freedom
    text: Evaluate competing American definitions of freedom era by era — their meanings, material conditions, and boundaries — and judge whom each definition included and excluded
    bloom: evaluate
  - id: co-data
    text: Use quantitative and spatial evidence — census-derived maps, migration flows, export and casualty series — to support or challenge historical claims
    bloom: apply

modules:
  - slug: contact-and-colonies
    title: "Contact and Colonial America"
    outcomes: [co-chronology, co-sources]
    lessons:
      - slug: indigenous-america
        title: "Indigenous America and the Columbian Exchange"
        type: core
        status: drafted
        goal: "Explain how European contact transformed the Americas demographically and ecologically"
        opening: "In 1492 two halves of the planet that had developed in isolation for more than ten thousand years came into permanent contact; every later structure of American history descends from that collision."
        est_minutes: 22
        prerequisites: []
        concepts:
          introduces: [columbian-exchange, epidemic-collapse, primary-sources]
          reinforces: []
        key_ideas:
          - Cahokia and Chaco Canyon as physical evidence of pre-contact urban complexity
          - The Europe of 1492 — ships, iron, print — and why contact ran east to west
          - The Columbian Exchange was reciprocal but wildly asymmetric
          - Disease, not battle, drove the demographic collapse of the Americas
          - A 1502 map read as evidence of what Europeans knew and did not know
        demo: null

      - slug: colonial-societies
        title: "Colonial Societies: Chesapeake, New England, and the Turn to Slavery"
        type: core
        status: drafted
        goal: "Compare the Chesapeake and New England colonial societies and trace the legal turn from indentured servitude to hereditary racial slavery"
        opening: "English North America was not one society but several: a tobacco-and-servants Chesapeake, a family-and-church New England, and, by 1700, a plantation South committed by law to hereditary African slavery."
        est_minutes: 24
        prerequisites: [indigenous-america]
        concepts:
          introduces: [indentured-servitude, racial-slavery]
          reinforces: [columbian-exchange, primary-sources]
        key_ideas:
          - Tobacco demography vs family demography made two different societies
          - Indentured servitude was the Chesapeake's first labor system, not slavery
          - Statute by statute, Virginia made slavery racial, hereditary, and permanent
          - An ordinary family's documents as a window into colonial life
        demo: null

  - slug: revolution-and-founding
    title: "Revolution and Founding"
    outcomes: [co-constitution, co-freedom, co-sources]
    lessons:
      - slug: american-revolution
        title: "The American Revolution"
        type: core
        status: planned
        goal: "Analyze the causes of the Revolution and the paradox of a liberty revolution that preserved slavery"
        opening: "The Seven Years' War left Britain with a debt 13.5 times its annual revenue, and the taxes meant to pay it down cost Britain thirteen colonies."
        est_minutes: 26
        prerequisites: [colonial-societies]
        concepts:
          introduces: [imperial-crisis, natural-rights, revolutionary-paradox]
          reinforces: [racial-slavery, primary-sources]
        key_ideas:
          - Imperial finance, not tyranny, started the crisis of 1763–75
          - The Declaration is a structured legal argument, edited by committee
          - Between 30,000 and 100,000 enslaved people fled to British lines
          - The paradox — liberty rhetoric, preserved slavery, a new central state
        demo: null

      - slug: constitutional-convention
        title: "From Confederation to Constitution"
        type: core
        status: planned
        goal: "Explain how the Constitutional Convention's compromises produced the federal structure of 1787"
        opening: "The Articles of Confederation created a league that could neither tax nor enforce its own decisions; the Constitution of 1787 replaced it with a national government assembled out of compromises."
        est_minutes: 25
        prerequisites: [american-revolution]
        concepts:
          introduces: [federalism, separation-of-powers, three-fifths-compromise]
          reinforces: [natural-rights]
        key_ideas:
          - State constitutions were the rehearsal — three problems solved in sequence
          - Virginia Plan vs New Jersey Plan, resolved by the Connecticut Compromise
          - The three-fifths clause wrote slavery into the apportionment arithmetic
          - Seven articles as a machine — legislative, executive, judicial, and the federal glue
        demo: null

      - slug: ratification-and-bill-of-rights
        title: "Ratification and the Bill of Rights"
        type: core
        status: planned
        goal: "Evaluate the Federalist and Anti-Federalist arguments over ratification and explain how the Bill of Rights emerged from that fight"
        opening: "The Constitution took effect only after a nine-month public argument fought in newspapers and state conventions, and the Bill of Rights is the price its opponents extracted."
        est_minutes: 24
        prerequisites: [constitutional-convention]
        concepts:
          introduces: [extended-republic, bill-of-rights]
          reinforces: [federalism, separation-of-powers]
        key_ideas:
          - Madison's extended-republic answer to the small-republic objection
          - Ambition counteracting ambition — the double security of No. 51
          - Hamilton's case against a bill of rights, and why it lost
          - Twelve proposed amendments, ten ratified — one waited 203 years
        demo: null

      - slug: federalist-papers
        title: "The Federalist Papers: Publius's Argument"
        type: extra
        status: planned
        goal: "Analyze the core arguments of Federalist Nos. 10, 51, 70, 78, and 84 in Publius's own text"
        opening: "Between October 1787 and August 1788, three authors writing as Publius published 85 newspaper essays that remain the most systematic defense of the Constitution ever written."
        est_minutes: 30
        prerequisites: [ratification-and-bill-of-rights]
        concepts:
          introduces: []
          reinforces: [extended-republic, separation-of-powers, federalism, bill-of-rights]
        key_ideas:
          - No. 10 — faction defined, and the two rejected cures
          - No. 51 — the constitutional mechanics of self-interest
          - No. 70 — energy in the executive; No. 78 — the least dangerous branch
          - No. 84 — why enumerating rights was argued to be dangerous
        demo: null

  - slug: early-republic
    title: "The Early Republic and Antebellum America"
    outcomes: [co-chronology, co-causation]
    lessons:
      - slug: early-republic-politics
        title: "Federalists and Republicans, 1789–1800"
        type: core
        status: planned
        goal: "Explain how a founding generation that dreaded faction produced the first party system and the first peaceful transfer of power"
        opening: "The founders regarded organized political parties as illegitimate; within a decade of Washington's inauguration they had built two."
        est_minutes: 24
        prerequisites: [ratification-and-bill-of-rights]
        concepts:
          introduces: [political-parties, peaceful-transfer]
          reinforces: [federalism, extended-republic]
        key_ideas:
          - Washington's deliberately quasi-monarchical presidency
          - Hamilton's financial program split the government into parties
          - The Alien and Sedition Acts — the crisis of 1798
          - The 36-ballot election of 1800 ended without bloodshed
        demo: null

      - slug: jeffersonian-america
        title: "Jeffersonian America: Louisiana, the Marshall Court, and the War of 1812"
        type: core
        status: planned
        goal: "Explain how the Louisiana Purchase, judicial review, and the War of 1812 consolidated the republic"
        opening: "Between 1801 and 1815 the United States doubled its territory, acquired a doctrine of judicial review, and fought Britain to a draw that Americans remembered as a victory."
        est_minutes: 26
        prerequisites: [early-republic-politics]
        concepts:
          introduces: [judicial-review, empire-of-liberty]
          reinforces: [peaceful-transfer, separation-of-powers]
        key_ideas:
          - Marbury's two-step — score the point, avoid the confrontation
          - The Louisiana Purchase as Jefferson's empire of liberty
          - The embargo experiment failed; exports fell ~80% in one year
          - The War of 1812 settled nothing on paper and everything in self-conception
        demo: null

      - slug: market-revolution
        title: "The Market Revolution"
        type: core
        status: planned
        goal: "Explain how transportation, factory labor, and finance transformed the antebellum Northern economy"
        opening: "Between 1815 and 1848 canals, steamboats, and railroads cut the cost of moving goods by an order of magnitude and pulled ordinary households out of subsistence and into markets."
        est_minutes: 24
        prerequisites: [jeffersonian-america]
        concepts:
          introduces: [market-revolution, wage-labor]
          reinforces: [empire-of-liberty]
        key_ideas:
          - The Erie Canal's freight data shows the market being built
          - Lowell's mill girls — wage labor as a contested experiment
          - Transportation, credit, and the cash nexus reorganized households
        demo: null

      - slug: jacksonian-democracy
        title: "Jacksonian Democracy and Indian Removal"
        type: core
        status: planned
        goal: "Analyze how mass white male democracy and Indian removal advanced together in the Age of Jackson"
        opening: "The same generation that abolished property qualifications for white men's votes forcibly removed tens of thousands of Native people from the eastern United States."
        est_minutes: 24
        prerequisites: [market-revolution]
        concepts:
          introduces: [jacksonian-democracy, indian-removal, nativism]
          reinforces: [market-revolution, political-parties]
        key_ideas:
          - Suffrage expansion — for white men only — remade electioneering
          - The Bank War and the veto as a popular instrument
          - Jackson's own words on removal, nullification, and federal power
          - Democratization and dispossession were one political program
        demo: null

      - slug: religion-and-reform
        title: "The Second Great Awakening and Antebellum Reform"
        type: core
        status: planned
        goal: "Explain how evangelical revival fueled abolitionism, temperance, and women's rights"
        opening: "The largest religious revival in American history made individual moral perfection a mass goal, and its converts set out to perfect the nation: temperance, abolition, and women's rights all grew from the revival."
        est_minutes: 22
        prerequisites: [jacksonian-democracy]
        concepts:
          introduces: [second-great-awakening, abolitionism]
          reinforces: [jacksonian-democracy, market-revolution]
        key_ideas:
          - Cane Ridge and the camp-meeting form — religion democratized
          - Disestablishment made churches compete, and evangelicals won
          - Abolitionism moved from colonization to immediatism
          - Seneca Falls rewrote the Declaration of Independence
        demo: null

  - slug: slavery-and-crisis
    title: "Slavery, Expansion, and Sectional Crisis"
    outcomes: [co-causation, co-data, co-freedom]
    lessons:
      - slug: cotton-kingdom
        title: "The Cotton Kingdom and the Domestic Slave Trade"
        type: core
        status: planned
        goal: "Analyze the political economy that made cotton and slavery expand together, using export and migration data"
        opening: "Between 1793 and 1860 American cotton exports grew four-hundred-fold, and the enslaved population nearly quadrupled: the two curves are one system."
        est_minutes: 28
        prerequisites: [market-revolution, religion-and-reform]
        concepts:
          introduces: [cotton-kingdom, domestic-slave-trade]
          reinforces: [racial-slavery, market-revolution]
        key_ideas:
          - "The planter's own logic: sell cotton to buy people to make more cotton"
          - Nearly one million people moved through the domestic slave trade
          - The 1830s were the peak decade — cotton onto land seized from Native nations
          - Slavery as lived — the Celia case and the Gordon photograph as evidence
        demo:
          component: CottonSlaveryScrubber
          spec: >
            Decade scrubber 1790–1860 driving three synchronized series: cotton
            exports (lbs), enslaved population, and people moved through the
            domestic slave trade per decade. Presets jump to 1793 (cotton gin),
            1808 (Atlantic trade ban), 1830s (peak forced migration). Instruction
            line asks the reader to watch the three curves move together.

      - slug: manifest-destiny
        title: "Manifest Destiny and the Mexican-American War"
        type: core
        status: planned
        goal: "Explain how continental expansion reopened the slavery question the Missouri Compromise had closed"
        opening: "The Mexican-American War added half a million square miles to the United States and forced Congress to decide whether slavery would follow the flag west."
        est_minutes: 22
        prerequisites: [cotton-kingdom]
        concepts:
          introduces: [manifest-destiny, free-soil]
          reinforces: [cotton-kingdom, indian-removal]
        key_ideas:
          - Overland trails and the demography of westward migration
          - Texas, Oregon, and the politics of annexation
          - The Wilmot Proviso made every acquisition a slavery vote
          - "'Mexico will poison us' — the war's victors inherited its question"
        demo: null

      - slug: sectional-crisis
        title: "The Sectional Crisis, 1850–1861"
        type: core
        status: planned
        goal: "Analyze the escalation from the Compromise of 1850 through Dred Scott and John Brown to secession"
        opening: "In eleven years the United States went from a negotiated compromise over slavery's expansion to the armed secession of eleven states; each attempted settlement made the next crisis worse."
        est_minutes: 30
        prerequisites: [manifest-destiny]
        concepts:
          introduces: [free-labor, secession]
          reinforces: [free-soil, domestic-slave-trade, abolitionism]
        key_ideas:
          - Kansas-Nebraska destroyed the party system and built the Republicans
          - Dred Scott declared Black Americans rightless and compromise unconstitutional
          - Violence entered Congress — the Sumner caning — and Kansas
          - John Brown, the election of 1860, and secession as counterrevolution
        demo:
          component: SenateBalanceTimeline
          spec: >
            Year slider 1819–1861 showing free-state vs slave-state Senate seats
            as two stacked bars, with admission events annotated (Missouri,
            1850, Kansas-Nebraska). Presets for 1820, 1850, 1854, 1861. The
            reader watches the balance the compromises were defending collapse.

  - slug: civil-war-and-reconstruction
    title: "Civil War and Reconstruction"
    outcomes: [co-constitution, co-freedom, co-causation]
    lessons:
      - slug: war-for-union
        title: "The War for Union, 1861–1863"
        type: core
        status: planned
        goal: "Explain how both sides mobilized for war and why the short-war illusion died at Bull Run, Shiloh, and Antietam"
        opening: "In April 1861 both sides expected a ninety-day war; Shiloh alone produced more American casualties in two days than every previous American war combined."
        est_minutes: 26
        prerequisites: [sectional-crisis]
        concepts:
          introduces: [war-for-union]
          reinforces: [secession, free-labor]
        key_ideas:
          - Sumter, the upper South's choice, and two mobilizations
          - The material imbalance — population, industry, railroads
          - The casualty escalation ladder — Bull Run to Shiloh to Antietam
          - Photography brought the dead to the home front
        demo: null

      - slug: emancipation
        title: "Emancipation"
        type: core
        status: planned
        goal: "Analyze how enslaved people's flight and Lincoln's policy together turned the war for Union into a war for freedom"
        opening: "Emancipation began not with a proclamation but with three men rowing to a Union fort in May 1861; it ended with the Thirteenth Amendment."
        est_minutes: 28
        prerequisites: [war-for-union]
        concepts:
          introduces: [self-emancipation, emancipation-proclamation]
          reinforces: [war-for-union, abolitionism]
        key_ideas:
          - Contraband policy — the enslaved forced the question first
          - Lincoln's public caution and the Greeley letter
          - Draft to proclamation — what the document did and did not do
          - Black enlistment, and the 13th Amendment as the completion
        demo: null

      - slug: union-victory
        title: "Total War and Union Victory, 1863–1865"
        type: core
        status: planned
        goal: "Explain why the Union won — total war on Confederate resources, the 1864 election, and the meanings Lincoln gave the war"
        opening: "After Gettysburg and Vicksburg the Confederacy could no longer win the war on the battlefield; it could still win it at the ballot box in November 1864, and Atlanta decided that election."
        est_minutes: 24
        prerequisites: [emancipation]
        concepts:
          introduces: [total-war]
          reinforces: [emancipation-proclamation, war-for-union]
        key_ideas:
          - 1863 turning points and what they did and did not decide
          - Grant, Sherman, and war on resources and morale
          - The 1864 election as the Confederacy's last strategy
          - Gettysburg Address and Second Inaugural — the war explained
        demo: null

      - slug: reconstruction
        title: "Reconstruction: The Second Founding, 1865–1870"
        type: core
        status: planned
        goal: "Explain how freedpeople, Congress, and the Reconstruction Amendments refounded American citizenship"
        opening: "Between 1865 and 1870 the Constitution gained more new content than in the previous seventy years: abolition, birthright citizenship, equal protection, and Black male suffrage."
        est_minutes: 28
        prerequisites: [union-victory]
        concepts:
          introduces: [reconstruction-amendments, sharecropping]
          reinforces: [self-emancipation, free-labor]
        key_ideas:
          - What freedom meant to freedpeople — family, land, church, school, vote
          - Johnson's restoration, the Black Codes, and the Radical response
          - The 14th and 15th Amendments as a constitutional refounding
          - Land denied — sharecropping as the compromise that followed
        demo: null

      - slug: redemption
        title: "Redemption: The Overthrow of Reconstruction"
        type: core
        status: planned
        goal: "Analyze how terror, Northern retreat, and the bargain of 1877 ended Reconstruction"
        opening: "Reconstruction did not fail; it was overthrown — by organized violence in the South, a depression-driven retreat in the North, and a bargained election in Washington."
        est_minutes: 24
        prerequisites: [reconstruction]
        concepts:
          introduces: [redemption]
          reinforces: [reconstruction-amendments, sharecropping]
        key_ideas:
          - The Klan, the Enforcement Acts, and the limits of federal power
          - Colfax and Cruikshank — terror acquitted, enforcement gutted
          - The Panic of 1873 and the North's liberal retreat
          - The Wormley Hotel bargain — troops out, Hayes in
        demo: null

      - slug: civil-war-memory
        title: "The Civil War in American Memory"
        type: extra
        status: planned
        goal: "Evaluate how reconciliationist memory eclipsed emancipationist memory of the Civil War"
        opening: "The United States reunited after its Civil War by agreeing to remember the fight and forget the cause."
        est_minutes: 22
        prerequisites: [redemption]
        concepts:
          introduces: [lost-cause]
          reinforces: [redemption, emancipation-proclamation]
        key_ideas:
          - Three memory traditions — emancipationist, reconciliationist, white supremacist
          - The first Memorial Day and its erasure
          - A painting, a carving, and a reunion — memory built in artifacts
        demo: null

  - slug: industry-and-empire
    title: "Industrial America, the West, and Empire"
    outcomes: [co-causation, co-data]
    lessons:
      - slug: conquering-the-west
        title: "The Conquest of the West"
        type: core
        status: planned
        goal: "Analyze the incorporation of the West — Indian wars, the destruction of the bison, allotment and assimilation, and the frontier myth"
        opening: "In one generation the United States broke the Plains nations' independence by exterminating the bison, confining survivors to allotments, and sending their children to boarding schools built to erase them."
        est_minutes: 26
        prerequisites: [redemption]
        concepts:
          introduces: [assimilation-policy, frontier-thesis]
          reinforces: [indian-removal, manifest-destiny]
        key_ideas:
          - Extermination or assimilation — the two named federal tracks
          - The bison slaughter as deliberate subsistence destruction
          - Dawes allotment and Carlisle schooling — assimilation's instruments
          - Wounded Knee, and Turner's frontier thesis three years later
        demo: null

      - slug: capital-and-labor
        title: "Capital and Labor in the Gilded Age"
        type: core
        status: planned
        goal: "Explain the incorporation of the American economy and the labor and Populist revolts it provoked"
        opening: "Between 1870 and 1900 the corporation reorganized American space, work, and time — and farmers and workers organized against it."
        est_minutes: 26
        prerequisites: [redemption]
        concepts:
          introduces: [incorporation-of-america, populism]
          reinforces: [wage-labor, market-revolution]
        key_ideas:
          - Incorporation of space, labor, and people — one framework
          - Carnegie's gospel against George's rent — the inequality debate
          - Homestead and Pullman — strikes as pitched battles
          - Populism and 1896 — the last agrarian challenge
        demo: null

      - slug: immigration-and-the-city
        title: "Immigration and the Industrial City"
        type: core
        status: planned
        goal: "Analyze the new immigration and urbanization with flow data, and the exclusion politics they triggered"
        opening: "Between 1850 and 1920 tens of millions of immigrants entered the United States; the country built its industrial cities out of their labor and wrote its first race-based immigration ban against them."
        est_minutes: 22
        prerequisites: [capital-and-labor]
        concepts:
          introduces: [new-immigration, urbanization]
          reinforces: [incorporation-of-america, nativism]
        key_ideas:
          - Where the migrants came from, decade by decade
          - The tenement city — Riis's flash photographs as reform evidence
          - The Chinese Exclusion Act — the first racial immigration bar
        demo:
          component: ImmigrationWaves
          spec: >
            Time slider 1850–2010 over the foreign-born share of the US
            population, with origin-region composition as a stacked area;
            presets for 1890 (new immigration), 1924 (quotas), 1970 (trough),
            2010. The reader watches the wave-quota-wave shape emerge.

      - slug: jim-crow
        title: "Jim Crow: Disenfranchisement and Segregation"
        type: core
        status: planned
        goal: "Explain how the South legally dismantled Black citizenship between 1890 and 1910 and how the Supreme Court ratified it"
        opening: "A generation after the Fifteenth Amendment, Southern states erased the Black vote without ever mentioning race in their statutes — and the Supreme Court declared segregation constitutional."
        est_minutes: 24
        prerequisites: [redemption]
        concepts:
          introduces: [jim-crow, disenfranchisement]
          reinforces: [redemption, reconstruction-amendments]
        key_ideas:
          - Poll taxes, literacy tests, grandfather clauses — race-neutral text, racial results
          - Plessy's separate-but-equal and Harlan's dissent
          - Washington's Atlanta Compromise against Du Bois's critique
          - Lynching as enforcement — terror behind the statutes
        demo: null

      - slug: american-empire
        title: "American Empire, 1898"
        type: core
        status: planned
        goal: "Analyze why the United States took an overseas empire in 1898 and the arguments made against it"
        opening: "In 1898 the United States fought a ten-week war with Spain and emerged holding Puerto Rico, Guam, Hawaii, and the Philippines — an empire acquired faster than the country could agree it wanted one."
        est_minutes: 22
        prerequisites: [capital-and-labor]
        concepts:
          introduces: [imperialism]
          reinforces: [frontier-thesis, jim-crow]
        key_ideas:
          - Overdetermined causes — panics, markets, mission, masculinity
          - Yellow journalism and the Maine — manufacturing consent
          - The Philippine war the annexation bought
          - Anti-imperialists lost the vote and won the argument's record
        demo: null

  - slug: reform-war-normalcy
    title: "Progressivism, the Great War, and the Twenties"
    outcomes: [co-chronology, co-freedom]
    lessons:
      - slug: progressive-era
        title: "The Progressive Era"
        type: core
        status: planned
        goal: "Explain Progressivism's two reform impulses — moral purity and scientific efficiency — and their constitutional harvest"
        opening: "Progressivism answered industrial disorder with two different faiths — moral purity and scientific efficiency — and wrote four amendments into the Constitution in seven years."
        est_minutes: 24
        prerequisites: [capital-and-labor, immigration-and-the-city]
        concepts:
          introduces: [progressivism, womens-suffrage]
          reinforces: [incorporation-of-america, urbanization]
        key_ideas:
          - Purity reforms and efficiency reforms — one movement, two logics
          - Muckraking and child labor — photography as policy argument
          - Income tax, direct election, prohibition, suffrage — amendments 16 to 19
          - Women's reform activism bridged domesticity and public power
        demo: null

      - slug: world-war-one
        title: "The First World War and Its Aftermath"
        type: core
        status: planned
        goal: "Examine US entry into World War I, the home-front repression it licensed, and the failed Wilsonian peace"
        opening: "The war fought to make the world safe for democracy brought conscription, censorship, and political prisoners to the United States — and the peace Wilson designed was rejected first at home."
        est_minutes: 24
        prerequisites: [progressive-era, american-empire]
        concepts:
          introduces: [wilsonianism, great-migration]
          reinforces: [progressivism, imperialism]
        key_ideas:
          - From neutrality to the Zimmermann telegram
          - Espionage and Sedition Acts — the repression at home
          - The Great Migration began under wartime labor demand
          - Fourteen Points, Versailles, and the Senate's rejection
        demo: null

      - slug: the-twenties
        title: "The New Era: The Twenties"
        type: core
        status: planned
        goal: "Analyze the consumer economy, cultural modernism, and reactionary politics of the 1920s"
        opening: "The 1920s ran modern consumer capitalism and anti-modern reaction side by side: radios and Fords, the Harlem Renaissance, a reborn Klan, and the country's first permanent immigration quotas."
        est_minutes: 22
        prerequisites: [world-war-one]
        concepts:
          introduces: [consumer-culture, immigration-restriction]
          reinforces: [nativism, great-migration, new-immigration]
        key_ideas:
          - Mass production met mass credit — the consumer economy
          - The 1924 quotas ended the age of open European immigration
          - Harlem Renaissance and the second Klan — modernity and backlash
          - The fragilities of 1929 were built in the twenties
        demo: null

  - slug: depression-and-war
    title: "Depression, New Deal, and World War II"
    outcomes: [co-causation, co-data, co-sources]
    lessons:
      - slug: great-depression
        title: "The Great Depression"
        type: core
        status: planned
        goal: "Explain the causes of the crash and depression, Hoover's response, and the uneven suffering that followed"
        opening: "Between 1929 and 1932 US output fell by a third, unemployment reached 25 percent — 50 percent for Black workers — and the sitting president's name became a synonym for a shantytown."
        est_minutes: 24
        prerequisites: [the-twenties]
        concepts:
          introduces: [associationalism, dust-bowl-migration]
          reinforces: [consumer-culture]
        key_ideas:
          - Crash mechanics — thin credit, weak banks, farm depression
          - Hoover the activist engineer, trapped by his own orthodoxy
          - The Bonus Army — veterans burned out in sight of the Capitol
          - Dust Bowl migration — Oklahoma lost 18% of its people
        demo: null

      - slug: new-deal
        title: "The New Deal"
        type: core
        status: planned
        goal: "Analyze what the New Deal built, whom it excluded, and why it did not end the Depression"
        opening: "The New Deal did not end the Great Depression; it built the permanent institutions — Social Security, deposit insurance, labor law — that changed what the federal government is for."
        est_minutes: 28
        prerequisites: [great-depression]
        concepts:
          introduces: [new-deal-state, social-insurance]
          reinforces: [associationalism, populism]
        key_ideas:
          - The Hundred Days — improvisation, not blueprint
          - Pressure from Long, Coughlin, and Townsend shaped the Second New Deal
          - Social Security's payroll-tax design was a political choice
          - Court-packing, the 1937 recession, and the New Deal's racial exclusions
        demo: null

      - slug: redlining
        title: "Redlining: New Deal Housing Maps and the Racial Wealth Gap"
        type: extra
        status: planned
        goal: "Analyze the HOLC security maps as primary sources and trace their consequences to present-day inequality"
        opening: "In the late 1930s federal surveyors graded every big-city neighborhood A through D, wrote race into the grades, and colored grade D red; the geography they drew still predicts wealth, health, and heat today."
        est_minutes: 24
        prerequisites: [new-deal]
        concepts:
          introduces: [redlining]
          reinforces: [new-deal-state, great-migration]
        key_ideas:
          - The A-to-D grading system in the surveyors' own words
          - HOLC did not invent the maps — the FHA's were the ones that bit
          - Reading an area description form as a primary source
          - From 1937 grades to today's wealth, heat, and health gradients
        demo: null

      - slug: world-war-two
        title: "The Second World War"
        type: core
        status: planned
        goal: "Explain the US path from neutrality through Pearl Harbor to victory, and why the war left the US uniquely advantaged among the powers"
        opening: "The United States entered World War II last, fought it farthest from home, lost the fewest people among the major powers, and emerged in 1945 richer than it entered."
        est_minutes: 28
        prerequisites: [new-deal]
        concepts:
          introduces: [arsenal-of-democracy, four-freedoms]
          reinforces: [wilsonianism, new-deal-state]
        key_ideas:
          - Neutrality, Lend-Lease, and the Four Freedoms speech
          - Pearl Harbor — cascade of errors, not conspiracy
          - The war of machines — production as strategy
          - D-Day to the atomic bomb, and the settlement of 1945
        demo: null

      - slug: wwii-home-front
        title: "The Home Front: Four Freedoms and Their Boundaries"
        type: core
        status: planned
        goal: "Analyze how the war remade American society — women and Black workers in war industry, the GI Bill — while incarcerating Japanese Americans"
        opening: "The war fought under the Four Freedoms banner doubled the female industrial workforce, seeded the modern civil rights movement, built the postwar middle class — and imprisoned 120,000 Japanese Americans without charge."
        est_minutes: 24
        prerequisites: [world-war-two]
        concepts:
          introduces: [japanese-american-incarceration, double-victory]
          reinforces: [four-freedoms, great-migration]
        key_ideas:
          - Rockwell's paintings made the Four Freedoms mass culture
          - War work — women, Black workers, and Executive Order 8802
          - Executive Order 9066 — euphemism as policy
          - The GI Bill manufactured the postwar middle class
        demo: null

  - slug: postwar-america
    title: "Cold War America and After"
    outcomes: [co-chronology, co-freedom, co-constitution]
    lessons:
      - slug: cold-war
        title: "The Cold War, 1945–1953"
        type: core
        status: planned
        goal: "Explain containment abroad and anticommunism at home in the first Cold War decade"
        opening: "Within two years of sharing victory, the United States and the Soviet Union had divided the world into blocs; containment organized American foreign policy for forty years and its domestic politics for a decade."
        est_minutes: 24
        prerequisites: [world-war-two]
        concepts:
          introduces: [containment, mccarthyism]
          reinforces: [arsenal-of-democracy]
        key_ideas:
          - Truman Doctrine and Marshall Plan — containment's two instruments
          - Korea made containment military and permanent
          - McCarthyism — the loyalty state at home
          - The censure of McCarthy set the boundary
        demo: null

      - slug: affluent-society
        title: "The Affluent Society and Its Boundaries"
        type: core
        status: planned
        goal: "Analyze postwar prosperity and suburbanization, and the exclusions that defined both"
        opening: "Between 1945 and 1960 the American middle class was manufactured — by wages, the GI Bill, and federal mortgages — and the suburbs it moved to were built white by policy."
        est_minutes: 22
        prerequisites: [wwii-home-front, cold-war]
        concepts:
          introduces: [suburbanization, school-desegregation]
          reinforces: [social-insurance, new-deal-state]
        key_ideas:
          - Homeownership 40% to 60% in a decade — how, and for whom
          - Suburbia, highways, and the urban crisis they left behind
          - Brown v. Board — separate is inherently unequal
          - Cold War pressure on the segregation question
        demo: null

      - slug: civil-rights-movement
        title: "The Civil Rights Movement, 1954–1965"
        type: core
        status: planned
        goal: "Analyze the movement from Brown through Montgomery, Birmingham, and Selma to the Civil Rights and Voting Rights Acts"
        opening: "In eleven years a disciplined mass movement forced the United States to outlaw the segregation system it had ratified in 1896 — Brown, Montgomery, Birmingham, Selma, and two federal statutes."
        est_minutes: 28
        prerequisites: [affluent-society]
        concepts:
          introduces: [nonviolent-direct-action, voting-rights-enforcement]
          reinforces: [jim-crow, school-desegregation, double-victory]
        key_ideas:
          - The long movement — labor, war work, and churches before 1954
          - Nonviolent direct action as strategy, not sentiment
          - Birmingham and Selma — televised violence moved legislation
          - The Civil Rights and Voting Rights Acts, and what they changed fast
        demo: null

      - slug: the-sixties
        title: "The Sixties: Great Society and Vietnam"
        type: core
        status: planned
        goal: "Analyze how the Great Society's legal triumphs and the Vietnam escalation fractured 1960s liberalism"
        opening: "The same administration that passed Medicare, Medicaid, and the Voting Rights Act escalated Vietnam from sixteen thousand advisers to half a million troops; the decade's triumphs and its fracture had one author."
        est_minutes: 26
        prerequisites: [civil-rights-movement]
        concepts:
          introduces: [great-society, vietnam-escalation]
          reinforces: [voting-rights-enforcement, containment]
        key_ideas:
          - Kennedy's razor-thin 1960 win and the liberal high tide
          - The Great Society — the largest legislative wave since 1935
          - Tonkin Gulf and escalation by increment
          - 1968 — assassinations, urban rebellion, and the coalition's break
        demo: null

      - slug: the-seventies
        title: "The Unraveling: 1968–1980"
        type: core
        status: planned
        goal: "Explain the 1970s crisis of confidence — Vietnam's end, Watergate, stagflation, and the new identity politics"
        opening: "In a single decade Americans watched a president resign, a war end in defeat, and the postwar boom stop; trust in government never recovered its early-1960s level."
        est_minutes: 22
        prerequisites: [the-sixties]
        concepts:
          introduces: [stagflation, silent-majority]
          reinforces: [vietnam-escalation, great-society]
        key_ideas:
          - Watergate — the constitutional system stress-tested
          - Stagflation broke the postwar economic consensus
          - Movement politics multiplied — feminist, Chicano, Indian, gay liberation
          - The silent majority — backlash as a governing identity
        demo: null

      - slug: rise-of-the-right
        title: "The Rise of the Right"
        type: core
        status: planned
        goal: "Analyze the conservative movement's road to power — markets, law and order, and the culture wars"
        opening: "The Reagan coalition assembled three revolts — against taxes and regulation, against crime and disorder, and against the cultural 1960s — into a governing majority that reset American politics."
        est_minutes: 24
        prerequisites: [the-seventies]
        concepts:
          introduces: [new-right, neoliberalism]
          reinforces: [silent-majority, stagflation]
        key_ideas:
          - The movement built its institutions before it won elections
          - Reaganomics — taxes, deregulation, and the deficit
          - Law and order and the rise of mass incarceration
          - Culture wars from the ERA fight to the AIDS crisis
        demo: null

      - slug: recent-past
        title: "Globalization, 9/11, and Polarization"
        type: core
        status: planned
        goal: "Examine the post-Cold War arc from globalization through 9/11 and the 2008 crisis to partisan polarization"
        opening: "The post-Cold War United States globalized its economy, fought two open-ended wars after 9/11, absorbed the worst financial crisis since 1929, and sorted itself into two hostile political camps."
        est_minutes: 24
        prerequisites: [rise-of-the-right]
        concepts:
          introduces: [globalization, polarization]
          reinforces: [neoliberalism, containment]
        key_ideas:
          - The unipolar moment and the globalized 1990s
          - 9/11 and the open-ended wars that followed
          - 2008 — the crisis the New Deal guardrails caught, and those repealed
          - Polarization as the era's structural fact
        demo: null

      - slug: historiographical-lenses
        title: "Framing US History: The Historiographical Lenses"
        type: extra
        status: planned
        goal: "Evaluate the major historiographical frameworks for US history as testable models — what each explains, what each obscures, and what evidence would decide between them"
        opening: "Every survey of United States history is organized by a lens, and the lenses themselves have a history."
        est_minutes: 26
        prerequisites: [recent-past]
        concepts:
          introduces: [historiography]
          reinforces: [frontier-thesis, lost-cause]
        key_ideas:
          - Turner's frontier thesis and Beard's economic reading — the first two grand models, stated and tested
          - Consensus school against the New Left — one liberal tradition, or history from below
          - The race-centered frame from Du Bois to the 1619 Project debate — the claims, the evidence, and the historians' objections, both sides on the record
          - The history-of-capitalism revival and the quantitative turn
          - Foner's freedom lens as this course's working frame — meanings, conditions, boundaries — and what choosing it trades away
        demo: null

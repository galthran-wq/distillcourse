schema_version: 1
slug: us-history
title: History of the United States
tagline: "How thirteen Atlantic colonies became the most powerful state in history — the land, labor, institutions, and wars that built it, from the documents and the numbers"
status: planned
audience: >
  Busy, curious adults with no prior US history coursework beyond vague
  school memories. Comfortable reading primary-source excerpts in period
  English and simple charts and maps; wants the actual causal story and the
  actual documents, not patriotic ceremony or trivia.
tone: >
  Dry, precise, evidence-forward. Declarative statements of fact; numbers
  and primary sources carry the argument. No rhetorical questions, no
  moralizing asides — the documents and the data are allowed to be damning
  on their own. Slavery, conquest, and race are analyzed as legal, economic,
  and political systems — statutes, prices, ballots, court holdings — never
  as occasions for sentiment, victimhood framing, or present-day
  editorializing. Second person only in instructions.
intro: >
  The course asks and argues one question: how did thirteen Atlantic colonies
  become the most powerful state in history? The answer is argued causally,
  in order. First, an unusually selected population — migration that filtered
  for the literate, the dissenting, and the commercially minded, measured in
  New England's near-universal male literacy, the world's highest ordinary
  wages by the eighteenth century, and an unmatched print density. Second,
  institutions of self-government that compounded — Mayflower Compact,
  covenant congregation, town meeting, colonial assembly — up to a
  constitutional order its framers deliberately assembled from classical
  Roman and English constitutional materials: the oldest surviving written
  national constitution and the most imitated political design of the modern
  era. Third, a revolution that was a military and political improbability
  and succeeded anyway — Trenton, Saratoga, the French alliance, Yorktown,
  stated in numbers. Fourth, the enabling conditions: land cheapened by the
  post-contact demographic collapse, technology from the cotton gin to mass
  production, immigration at continental scale, and war mobilization that
  twice reset the world order.


  The argument runs on evidence, never on assertion: primary documents,
  maps, and numbers carry it, and achievements are stated as measurements.
  Slavery, conquest, and Reconstruction remain in the causal story, told in
  the register Lincoln and Douglass used — the founding as promise, the
  Civil War as the terrible price of self-correction, civil rights as its
  enforcement. The narrative spine follows the American Yawp; each lesson
  pairs it with the era's primary sources (National Archives milestone
  documents, the Federalist Papers, the Lincoln papers, HOLC maps) and the
  strongest scholarly syntheses (Wood, Maier, Howe, McCullough, McPherson,
  Foner, Kennedy, Blight). Foner's three-part reading of freedom claims
  stays in the toolbox as a source-reading instrument, and the closing
  chapter puts the course's own thesis on the bench with every other lens.
prerequisites:
  - text: "None — no prior US history is assumed"
  - text: "Comfort reading short primary-source excerpts in 18th–19th century English"
spine:
  - step: "Contact emptied a continent and set the terms: the land the colonies would grow on was cheap because it had been emptied, and the crossing ran east to west because only one side had ships"
    lessons: [indigenous-america]
  - step: "Three rival colonization models — rule, exchange, commerce — each structurally failed to produce a settler society; the English colonies' self-reproducing population is the anomaly to explain"
    lessons: [european-empires]
  - step: "The anomaly's engine: selected, literate migrants who brought self-government in their founding documents — covenant, compact, town meeting — and compounded"
    lessons: [new-england-covenant, natives-and-english, colonial-societies, middle-colonies]
  - step: "By 1763 the colonies were rich, literate, self-governing, and tied into an empire that then tried to govern them directly — the collision that made a constitutional argument"
    lessons: [awakening-and-empire, american-revolution]
  - step: "The argument became a war won at measurable odds, and independence forced the constitutional question: could self-government scale from town to continent?"
    lessons: [war-of-independence]
  - step: "The framers answered by design — classical and English materials machined into a compound republic — and the design was ratified by argument, vote by vote"
    lessons: [roman-blueprint, constitutional-convention, ratification-and-bill-of-rights]
  - step: "The design survived its first stress tests — parties, a hostile transfer of power, courts, war — and consolidated a continental republic"
    lessons: [early-republic-politics, jeffersonian-america]
  - step: "The system's economic engine engaged: transport, markets, and mass politics — self-government observed working at scale by its sharpest outside witness"
    lessons: [market-revolution, jacksonian-democracy, tocqueville-democracy, religion-and-reform]
  - step: "The design carried a contradiction priced in cotton: slavery expanded as a system until the compromise machinery that contained it failed component by component"
    lessons: [cotton-kingdom, manifest-destiny, sectional-crisis]
  - step: "The contradiction was paid for in the war that turned Union into emancipation — the founding promise enforced at the price of self-correction, then written into the Constitution and overthrown for a century"
    lessons: [war-for-union, emancipation, union-victory, reconstruction, redemption]
  - step: "The corrected republic industrialized into the largest economy on earth — West incorporated, capital and labor at war, immigration at continental scale — with the correction suspended in the South and an empire acquired offshore"
    lessons: [conquering-the-west, capital-and-labor, immigration-and-the-city, jim-crow, american-empire]
  - step: "Industrial scale forced the constitutional machinery to adapt — amendment, regulation, a first world-order reset — and produced mass-production prosperity with its reaction"
    lessons: [progressive-era, world-war-one, the-twenties]
  - step: "The stress test peer republics failed: depression answered by a permanent federal floor, then the war of machines that made the United States the designer of the world order"
    lessons: [great-depression, new-deal, world-war-two, wwii-home-front]
  - step: "The American-designed order ran four decades of contest and affluence, enforced the second founding at home, overreached, corrected, and turned right"
    lessons: [cold-war, affluent-society, civil-rights-movement, the-sixties, the-seventies, rise-of-the-right]
  - step: "The closing audit: the unipolar peak, its shocks, polarization — and the course's own thesis put on the bench with every other lens"
    lessons: [recent-past]
key_results:
  - text: "Epidemic disease, not battlefield conquest, killed roughly 90% of the Indigenous population of the Americas within about 150 years of contact — the demographic fact that made colonial land cheap"
    lesson: indigenous-america
  - text: "New England's selected, family-based migration compounded: about 21,000 migrants of 1630–1642 became roughly 91,000 colonists by 1700, with near-universal male literacy engineered by statute"
    lesson: new-england-covenant
  - text: "King Philip's War (1675–76) killed a larger share of the population than any later American war — the alliance of 1621 and the war of 1675 are one story told from both sides"
    lesson: natives-and-english
  - text: "The Revolution was won at measurable odds: about 2,400 men crossed the Delaware six days before the army's enlistments expired, took roughly 900 Hessians for two dead of exposure, and kept the war alive"
    lesson: war-of-independence
  - text: "The Constitution of 1787 was deliberately assembled from classical Roman and English constitutional materials — and became the oldest surviving written national constitution and the most imitated political design in history"
    lesson: roman-blueprint
  - text: "Ratification passed 187–168 in Massachusetts, 89–79 in Virginia, and 30–27 in New York; the Massachusetts Compromise — ratify now, recommend amendments — is what carried it, and the Bill of Rights is its price"
    lesson: ratification-and-bill-of-rights
  - text: "The election of 1800 produced the first peaceful transfer of national power between hostile parties — a test contemporary theory expected republics to fail"
    lesson: early-republic-politics
  - text: "Cotton and slavery expanded as one system: cotton reached about 60% of US exports by 1860 while nearly one million enslaved people were moved through the domestic slave trade"
    lesson: cotton-kingdom
  - text: "The Civil War transformed from a war for Union into a war for emancipation, at a cost of roughly 750,000 lives — driven jointly by enslaved people's flight and Lincoln's policy"
    lesson: emancipation
  - text: "Reconstruction was a constitutional refounding — the 13th, 14th, and 15th Amendments — overthrown by organized terror, Northern retreat, and the bargain of 1877; the amendments survived to be enforced a century later"
    lesson: redemption
  - text: "The New Deal built a permanent federal floor under American capitalism — Social Security, deposit insurance, labor law — but wartime mobilization, not the New Deal, ended the Depression"
    lesson: new-deal
  - text: "The United States entered World War II last, lost the fewest people among the major powers, and emerged in 1945 richer than it entered — holding the institutional design of the postwar order"
    lesson: world-war-two
  - text: "Federal housing maps of the 1930s wrote race into neighborhood grades, and the lending geography they created still predicts wealth, health, and heat today"
    lesson: redlining
  - text: "Eleven years of disciplined mass protest produced the Civil Rights Act and Voting Rights Act — 250,000 new Black voters registered by the end of 1965 alone — enforcement, at last, of the Reconstruction amendments"
    lesson: civil-rights-movement
sources:
  - "J. Locke, B. Wright (eds.), The American Yawp, 2 vols., Stanford University Press (americanyawp.com) — narrative spine, CC-BY-SA"
  - "E. Foner, DuVal, McGirr, Give Me Liberty! An American History, 8th ed., Norton, 2026 (with the Voices of Freedom reader)"
  - "National Archives, America's Founding Documents and Milestone Documents (archives.gov)"
  - "Hamilton, Madison, Jay, The Federalist Papers (Avalon Project, Yale)"
  - "Library of Congress, Abraham Lincoln Papers and \"Abraham Lincoln and Emancipation\""
  - "G. S. Wood, The Creation of the American Republic, 1776–1787, UNC Press, 1969 (Bancroft Prize)"
  - "G. S. Wood, Empire of Liberty: A History of the Early Republic, 1789–1815, Oxford, 2009"
  - "P. Maier, Ratification: The People Debate the Constitution, 1787–1788, Simon & Schuster, 2010"
  - "D. McCullough, 1776, Simon & Schuster, 2005"
  - "D. W. Howe, What Hath God Wrought: The Transformation of America, 1815–1848, Oxford, 2007 (Pulitzer Prize)"
  - "J. M. McPherson, Battle Cry of Freedom: The Civil War Era, Oxford, 1988"
  - "E. Foner, Reconstruction: America's Unfinished Revolution, 1863–1877, updated ed."
  - "D. M. Kennedy, Freedom from Fear: The American People in Depression and War, 1929–1945, Oxford, 1999"
  - "P. Johnson, A History of the American People, HarperCollins, 1997"
  - "D. W. Blight, HIST 119 The Civil War and Reconstruction Era (Open Yale Courses, 2008)"
  - "P. Maier, 21H.101 American History to 1865 (MIT OpenCourseWare, 2010)"
  - "C. Horan, 21H.102 American History Since 1865 (MIT OpenCourseWare, 2018)"
  - "Digital Scholarship Lab, University of Richmond, American Panorama and Mapping Inequality (dsl.richmond.edu)"
outcomes:
  - id: co-chronology
    text: Sequence the major eras and turning points of US history from pre-contact to the early 21st century and state each era's defining transformation
    bloom: understand
  - id: co-selection
    text: "Measure what made the settler population unusual — migration selectivity, near-universal New England male literacy, the world's highest ordinary wages by the 18th century, print density — and connect those measurements to later institutional capacity"
    bloom: analyze
  - id: co-institutions
    text: "Explain how American self-government compounded from Mayflower Compact, covenant congregation, town meeting, and colonial assembly into the constitutional order of 1787–91, and trace how amendments and court rulings rewrote it"
    bloom: understand
  - id: co-contingency
    text: "Analyze the republic's survival as a chain of contingent, datable events won at measurable odds — Trenton and Saratoga, the ratification margins, the 1800 transfer, Atlanta in 1864 — and state what each near-run event decided"
    bloom: analyze
  - id: co-causation
    text: "Analyze the enabling conditions of American power as causal chains across eras — land cheapened by demographic collapse, technology from the cotton gin to mass production, immigration at continental scale, war mobilization that twice reset the world order"
    bloom: analyze
  - id: co-promise
    text: "Evaluate the constitutional order as promise and enforcement — slavery, the Civil War, Reconstruction, Jim Crow, civil rights — judging from the documents what each self-correction cost and what it achieved"
    bloom: evaluate
  - id: co-sources
    text: Interpret primary sources — documents, photographs, maps, political cartoons — as evidence of their moment, distinguishing what a source documents from what it argues
    bloom: analyze
  - id: co-data
    text: Use quantitative and spatial evidence — census-derived maps, migration flows, export and casualty series — to support or challenge historical claims
    bloom: apply

modules:
  - slug: contact-and-colonies
    title: "Contact and Colonial America"
    outcomes: [co-chronology, co-selection, co-institutions, co-sources]
    lessons:
      - slug: indigenous-america
        title: "Indigenous America and the Columbian Exchange"
        type: core
        status: drafted
        goal: "Explain how European contact transformed the Americas demographically and ecologically"
        opening: "In 1492 two halves of the planet that had developed in isolation for more than ten thousand years came into permanent contact; every later structure of American history descends from that collision."
        est_minutes: 22
        prerequisites: []
        concepts:
          introduces: [columbian-exchange, epidemic-collapse, primary-sources]
          reinforces: []
        key_ideas:
          - Cahokia and Chaco Canyon as physical evidence of pre-contact urban complexity
          - The Europe of 1492 — ships, iron, print — and why contact ran east to west
          - The Columbian Exchange was reciprocal but wildly asymmetric
          - Disease, not battle, drove the demographic collapse of the Americas
          - A 1502 map read as evidence of what Europeans knew and did not know
        demo: null

      - slug: european-empires
        title: "Spanish, French, and Dutch North America and the Black Legend"
        type: core
        status: drafted
        goal: "Compare the Spanish, French, and Dutch colonization models and explain what each left in North America"
        opening: "Before an English colonist survived a single winter in North America, Spain had governed a continental empire from Mexico City for eighty years, France had built a fur-trade alliance system up the St. Lawrence, and a Dutch company had planted a trading post at the mouth of the Hudson."
        est_minutes: 22
        prerequisites: [indigenous-america]
        concepts:
          introduces: [colonization-models, black-legend]
          reinforces: [columbian-exchange, epidemic-collapse, primary-sources]
        key_ideas:
          - "Three models: tribute and silver (New Spain), fur and alliance (New France), company entrepôt (New Netherland)"
          - The Black Legend — Las Casas's indictment, its Protestant printing history, and how to read polemic as a source
          - Spanish borderlands — Florida, New Mexico, and the Pueblo Revolt of 1680
          - What each empire left behind — horses, missions, place names, and a toleration the English inherited
        demo: null

      - slug: new-england-covenant
        title: "Plymouth and Puritan New England: The Seedbed of Self-Government"
        type: core
        status: planned
        goal: "Explain how Plymouth and Massachusetts Bay built self-governing institutions — compact, congregation, town meeting — and the literate, family-based population that ran them"
        opening: "In November 1620, 41 men aboard a merchant ship off Cape Cod signed a one-paragraph agreement to 'covenant and combine ourselves together into a civil body politic' — the first instrument of self-government written in English America, and the template the region then reproduced at every scale."
        est_minutes: 26
        prerequisites: [european-empires]
        concepts:
          introduces: [mayflower-compact, covenanted-town, settler-selection, wampanoag-alliance]
          reinforces: [epidemic-collapse, primary-sources]
        key_ideas:
          - The Mayflower Compact read as text — consent creating government
          - "The Wampanoag alliance of 1621: Massasoit, Tisquantum, a treaty that held some 54 years, and the harvest feast kept as Thanksgiving"
          - Covenant congregation and covenanted town — self-government reproduced at every scale
          - "Family migration demography: balanced sex ratio, longevity, six to eight surviving children"
          - "Literacy engineered: the 1642 and 1647 school laws, Harvard (1636), and the first press (1638)"
        demo: null

      - slug: natives-and-english
        title: "Native Nations and the English: Trade, Alliance, and War"
        type: core
        status: planned
        goal: "Analyze Native–English relations in the seventeenth century as both alliance and war, using the Pequot War and King Philip's War as the measured cases"
        opening: "The New England that shared the 1621 harvest feast with the Wampanoag fought the Pequot within sixteen years and the Wampanoag's own grandchildren within fifty-five; the alliance and the wars are one story, and each side's choices were rational at every step."
        est_minutes: 24
        prerequisites: [new-england-covenant]
        concepts:
          introduces: [king-philips-war]
          reinforces: [wampanoag-alliance, epidemic-collapse, primary-sources]
        key_ideas:
          - "The trade equilibrium: wampum, furs, and metal — mutual dependence in the 1620s–30s"
          - The Pequot War (1636–37) and the Mystic massacre, counted from both records
          - "King Philip's War (1675–76): proportionally the deadliest war in American history"
          - Why the alliance broke — land, livestock, courts, and demography
        demo: null

      - slug: colonial-societies
        title: "Colonial Societies: Chesapeake, New England, and the Turn to Slavery"
        type: core
        status: drafted
        goal: "Compare the Chesapeake and New England as two economies, two demographies, and two polities — assembly and county court against covenanted town — and trace the legal turn to hereditary racial slavery to its causal core"
        opening: "English North America was not one society but several: a tobacco-and-servants Chesapeake, a family-and-church New England, and, by 1700, a plantation South committed by law to hereditary African slavery."
        est_minutes: 24
        prerequisites: [indigenous-america, new-england-covenant]
        concepts:
          introduces: [indentured-servitude, racial-slavery]
          reinforces: [columbian-exchange, primary-sources, covenanted-town, settler-selection]
        key_ideas:
          - Tobacco demography vs family demography made two different societies
          - "Two polities: Virginia's assembly and county courts against the covenanted town"
          - Free colonists were among the best-paid ordinary people in the world by the eighteenth century
          - "The statute ladder 1662–1705 at its causal core: term and heredity removed for one class of laborers"
          - An ordinary family's documents as a window into colonial life
        demo: null

      - slug: middle-colonies
        title: "The Middle Colonies: Dutch Legacy, Quaker Experiment, and Pluralism"
        type: core
        status: planned
        goal: "Explain how New York's Dutch inheritance and Pennsylvania's Quaker constitution made the middle colonies the pluralist, commercial template for later America"
        opening: "By 1750 Philadelphia was on its way to being the second city of the British Empire, and its colony had never had an established church — an eighteenth-century anomaly that looks, in hindsight, like a prototype."
        est_minutes: 22
        prerequisites: [colonial-societies]
        concepts:
          introduces: [colonial-pluralism]
          reinforces: [colonization-models, settler-selection]
        key_ideas:
          - "New Netherland to New York: conquest by fleet, continuity by charter — a port of many languages"
          - "Penn's holy experiment: the 1701 Charter of Privileges and liberty of conscience as statute"
          - "Pluralism as economics: German and Scots-Irish migration, the wheat belt, Philadelphia's rise"
          - "Women's legal standing compared: Quaker meetings, Dutch inheritance law, English coverture"
        demo: null

      - slug: awakening-and-empire
        title: "The Great Awakening and the Seven Years' War"
        type: core
        status: planned
        goal: "Explain how the First Great Awakening and the Seven Years' War each bound thirteen separate colonies together and set the terms of the imperial crisis"
        opening: "Between 1739 and 1763 two continental events gave thirteen separate colonies their first shared experiences: an itinerant preacher whom a large fraction of the population heard in person, and a world war that began with a Virginia colonel's ambush in a Pennsylvania ravine."
        est_minutes: 24
        prerequisites: [middle-colonies]
        concepts:
          introduces: [first-great-awakening, seven-years-war]
          reinforces: [colonial-pluralism, settler-selection]
        key_ideas:
          - Whitefield's circuits and Franklin's press runs — the first intercolonial mass events
          - "The Awakening's politics: authority questioned, denominations multiplied, choice normalized"
          - Washington's ambush, Braddock's defeat, and the war that became global
          - "1763: France expelled, Britain indebted 13.5 times its revenue, and the Proclamation Line"
        demo: null

  - slug: revolution-and-founding
    title: "Revolution and Founding"
    outcomes: [co-institutions, co-contingency, co-sources]
    lessons:
      - slug: american-revolution
        title: "The Imperial Crisis and the Declaration of Independence"
        type: core
        status: planned
        goal: "Analyze how imperial finance and the constitutional argument over consent escalated into independence, reading the Declaration as a structured legal argument"
        opening: "The Seven Years' War left Britain with a debt 13.5 times its annual revenue, and the taxes meant to pay it down cost Britain thirteen colonies."
        est_minutes: 24
        prerequisites: [awakening-and-empire]
        concepts:
          introduces: [imperial-crisis, natural-rights, revolutionary-paradox]
          reinforces: [seven-years-war, racial-slavery, primary-sources]
        key_ideas:
          - Imperial finance, not tyranny, started the crisis of 1763–75
          - Consent and representation — the constitutional argument, stated by both sides
          - "The escalation ladder, 1765–1775: each British response widened colonial unity"
          - The Declaration is a structured legal argument, edited by committee
          - "The paradox on the record: liberty rhetoric, preserved slavery, and 30,000–100,000 flights to British lines"
        demo: null

      - slug: war-of-independence
        title: "The War of Independence: Improbability in Numbers"
        type: core
        status: planned
        goal: "Explain how an outmatched rebellion won — Boston, Trenton, Saratoga, the French alliance, Yorktown — with the odds stated in numbers"
        opening: "In December 1776 the Continental Army was down to a few thousand effectives with most enlistments expiring on the 31st; ten days and two small battles later the Revolution was a going concern again, and that margin is how the whole war worked."
        est_minutes: 26
        prerequisites: [american-revolution]
        concepts:
          introduces: [contingency, french-alliance]
          reinforces: [revolutionary-paradox, imperial-crisis]
        key_ideas:
          - "Knox's guns and Dorchester Heights: 59 cannon, 300 miles, one night's fortification"
          - "New York to Trenton: near-destruction, the Christmas crossing, roughly 900 Hessians captured against two dead of exposure"
          - Saratoga and the French alliance — the rebellion becomes a world war Britain cannot price
          - "A civil war as well: Loyalists, Native nations' choices, and the enslaved who fled to British lines"
          - "Yorktown: the one week French sea power made decisive"
        demo: null

      - slug: roman-blueprint
        title: "The Roman Blueprint: Classical and English Sources of the Constitution"
        type: core
        status: planned
        goal: "Analyze how the constitutional design of 1787 was assembled from its named sources — Polybius's mixed government, the English constitutional inheritance, Montesquieu, and the republican ideology of 1776"
        opening: "The men who wrote the Constitution signed its defense 'Publius', named their upper house the Senate, and called Washington a new Cincinnatus; the classical references were a working design vocabulary, not decoration, and they can be traced clause by clause."
        est_minutes: 26
        prerequisites: [american-revolution]
        concepts:
          introduces: [mixed-government, classical-republicanism]
          reinforces: [natural-rights, mayflower-compact]
        key_ideas:
          - "Polybius on Rome: monarchy, aristocracy, and democracy mixed — the cycle argument and its cure"
          - "The English inheritance: Magna Carta, the 1689 Bill of Rights, and the Commonwealth Whigs"
          - Montesquieu's separation of powers, cited by name at Philadelphia and in Federalist 47
          - "The republicanism of 1776 (Wood): a polity of civic virtue — and how 1787 redesigned for interest instead"
          - "Cincinnatus enacted: Washington's two resignations as classical performance"
        demo: null

      - slug: constitutional-convention
        title: "From Confederation to Constitution"
        type: core
        status: planned
        goal: "Explain how the Constitutional Convention's compromises produced the federal structure of 1787"
        opening: "The Articles of Confederation created a league that could neither tax nor enforce its own decisions; the Constitution of 1787 replaced it with a national government assembled out of compromises."
        est_minutes: 25
        prerequisites: [roman-blueprint]
        concepts:
          introduces: [federalism, separation-of-powers, three-fifths-compromise]
          reinforces: [natural-rights, mixed-government]
        key_ideas:
          - State constitutions were the rehearsal — and the convention of the people became the constituent device
          - Virginia Plan vs New Jersey Plan, resolved by the Connecticut Compromise
          - The three-fifths clause wrote slavery into the apportionment arithmetic
          - Seven articles as a machine — legislative, executive, judicial, and Article V as the designed escape hatch
        demo: null

      - slug: ratification-and-bill-of-rights
        title: "Ratification and the Bill of Rights"
        type: core
        status: planned
        goal: "Evaluate the Federalist and Anti-Federalist arguments over ratification and explain how the Bill of Rights emerged from that fight"
        opening: "The Constitution took effect only after a nine-month public argument fought in newspapers and state conventions, and the Bill of Rights is the price its opponents extracted."
        est_minutes: 24
        prerequisites: [constitutional-convention]
        concepts:
          introduces: [extended-republic, bill-of-rights]
          reinforces: [federalism, separation-of-powers, classical-republicanism]
        key_ideas:
          - Madison's extended-republic answer to the small-republic objection
          - "The margins: 187–168, 89–79, 30–27 — ratification as a near-run vote, state by state"
          - "The Massachusetts Compromise — ratify now, recommend amendments — the template that carried it"
          - Hamilton's case against a bill of rights, and why it lost
          - Twelve proposed amendments, ten ratified — one waited 203 years
        demo: null

      - slug: federalist-papers
        title: "The Federalist Papers: Publius's Argument"
        type: extra
        status: planned
        goal: "Analyze the core arguments of Federalist Nos. 10, 51, 70, 78, and 84 in Publius's own text"
        opening: "Between October 1787 and August 1788, three authors writing as Publius published 85 newspaper essays that remain the most systematic defense of the Constitution ever written."
        est_minutes: 30
        prerequisites: [ratification-and-bill-of-rights]
        concepts:
          introduces: []
          reinforces: [extended-republic, separation-of-powers, federalism, bill-of-rights, mixed-government]
        key_ideas:
          - No. 10 — faction defined, and the two rejected cures
          - No. 51 — the constitutional mechanics of self-interest
          - No. 70 — energy in the executive; No. 78 — the least dangerous branch
          - No. 84 — why enumerating rights was argued to be dangerous
        demo: null

  - slug: early-republic
    title: "The Early Republic and Antebellum America"
    outcomes: [co-chronology, co-institutions, co-causation]
    lessons:
      - slug: early-republic-politics
        title: "Federalists and Republicans, 1789–1800"
        type: core
        status: planned
        goal: "Explain how a founding generation that dreaded faction produced the first party system and the first peaceful transfer of power"
        opening: "The founders regarded organized political parties as illegitimate; within a decade of Washington's inauguration they had built two."
        est_minutes: 24
        prerequisites: [ratification-and-bill-of-rights]
        concepts:
          introduces: [political-parties, peaceful-transfer]
          reinforces: [federalism, extended-republic, contingency]
        key_ideas:
          - Washington's deliberately quasi-monarchical presidency
          - Hamilton's financial program split the government into parties
          - The Alien and Sedition Acts — the crisis of 1798
          - The 36-ballot election of 1800 ended without bloodshed
        demo: null

      - slug: jeffersonian-america
        title: "Jeffersonian America: Louisiana, the Marshall Court, and the War of 1812"
        type: core
        status: planned
        goal: "Explain how the Louisiana Purchase, judicial review, and the War of 1812 consolidated the republic"
        opening: "Between 1801 and 1815 the United States doubled its territory, acquired a doctrine of judicial review, and fought Britain to a draw that Americans remembered as a victory."
        est_minutes: 26
        prerequisites: [early-republic-politics]
        concepts:
          introduces: [judicial-review, empire-of-liberty]
          reinforces: [peaceful-transfer, separation-of-powers]
        key_ideas:
          - Marbury's two-step — score the point, avoid the confrontation
          - The Louisiana Purchase as Jefferson's empire of liberty
          - The embargo experiment failed; exports fell ~80% in one year
          - The War of 1812 settled nothing on paper and everything in self-conception
        demo: null

      - slug: market-revolution
        title: "The Market Revolution"
        type: core
        status: planned
        goal: "Explain how transportation, communication, factory labor, and finance transformed the antebellum Northern economy"
        opening: "Between 1815 and 1848 canals, steamboats, and railroads cut the cost of moving goods by an order of magnitude and pulled ordinary households out of subsistence and into markets."
        est_minutes: 24
        prerequisites: [jeffersonian-america]
        concepts:
          introduces: [market-revolution, wage-labor]
          reinforces: [empire-of-liberty]
        key_ideas:
          - The Erie Canal's freight data shows the market being built
          - "Overcoming the tyranny of distance: post, press, and the 1844 telegraph (Howe)"
          - Lowell's mill girls — wage labor as a contested experiment
          - Transportation, credit, and the cash nexus reorganized households
        demo: null

      - slug: jacksonian-democracy
        title: "Jacksonian Democracy and Indian Removal"
        type: core
        status: planned
        goal: "Analyze how mass white male democracy and Indian removal advanced together in the Age of Jackson"
        opening: "The same generation that abolished property qualifications for white men's votes forcibly removed tens of thousands of Native people from the eastern United States."
        est_minutes: 24
        prerequisites: [market-revolution]
        concepts:
          introduces: [jacksonian-democracy, indian-removal, nativism]
          reinforces: [market-revolution, political-parties]
        key_ideas:
          - Suffrage expansion — for white men only — remade electioneering
          - The Bank War and the veto as a popular instrument
          - "Whigs against Democrats: improvement against removal — Howe's revision of the 'Age of Jackson'"
          - Jackson's own words on removal, nullification, and federal power
        demo: null

      - slug: tocqueville-democracy
        title: "Democracy in America: Self-Government Observed"
        type: core
        status: planned
        goal: "Analyze Tocqueville's account of township government, juries, and voluntary associations as period evidence for how the American system actually worked"
        opening: "In 1831 a twenty-five-year-old French aristocrat spent nine months touring the United States, officially to inspect its prisons, and produced the most systematic outside description of American self-government ever written."
        est_minutes: 24
        prerequisites: [jacksonian-democracy]
        concepts:
          introduces: [township-self-government, voluntary-association]
          reinforces: [covenanted-town, mixed-government]
        key_ideas:
          - "The township as the school of liberty: constituted by 1650, run through some nineteen elected offices — 'town-meetings are to liberty what primary schools are to science'"
          - Associations as the substitute for aristocracy — the intermediate powers a democracy must build for itself, from temperance societies to the 1831 Free Trade Convention
          - "Self-interest rightly understood: virtue argued from utility, habit doing the work of principle"
          - "Tyranny of the majority as his standing warning, and the breakwaters he credits: townships, lawyers, and the jury as 'a gratuitous public school'"
          - What a French aristocrat's outside view does and does not certify — a primary source about 1831, to be quoted and tested, not deferred to
        demo: null

      - slug: religion-and-reform
        title: "The Second Great Awakening and Antebellum Reform"
        type: core
        status: planned
        goal: "Explain how evangelical revival fueled abolitionism, temperance, and women's rights"
        opening: "The largest religious revival in American history made individual moral perfection a mass goal, and its converts set out to perfect the nation: temperance, abolition, and women's rights all grew from the revival."
        est_minutes: 22
        prerequisites: [jacksonian-democracy]
        concepts:
          introduces: [second-great-awakening, abolitionism]
          reinforces: [jacksonian-democracy, market-revolution, first-great-awakening]
        key_ideas:
          - Cane Ridge and the camp-meeting form — religion democratized
          - Disestablishment made churches compete, and evangelicals won
          - Abolitionism moved from colonization to immediatism
          - Seneca Falls rewrote the Declaration of Independence
        demo: null

  - slug: slavery-and-crisis
    title: "Slavery, Expansion, and Sectional Crisis"
    outcomes: [co-causation, co-data, co-promise]
    lessons:
      - slug: cotton-kingdom
        title: "The Cotton Kingdom and the Domestic Slave Trade"
        type: core
        status: planned
        goal: "Analyze the political economy that made cotton and slavery expand together, using export and migration data"
        opening: "Between 1793 and 1860 American cotton exports grew four-hundred-fold, and the enslaved population nearly quadrupled: the two curves are one system."
        est_minutes: 28
        prerequisites: [market-revolution, religion-and-reform]
        concepts:
          introduces: [cotton-kingdom, domestic-slave-trade]
          reinforces: [racial-slavery, market-revolution]
        key_ideas:
          - "The planter's own logic: sell cotton to buy people to make more cotton"
          - Nearly one million people moved through the domestic slave trade
          - The 1830s were the peak decade — cotton onto land seized from Native nations
          - Slavery as lived — the Celia case and the Gordon photograph as evidence
        demo:
          component: CottonSlaveryScrubber
          spec: >
            Decade scrubber 1790–1860 driving three synchronized series: cotton
            exports (lbs), enslaved population, and people moved through the
            domestic slave trade per decade. Presets jump to 1793 (cotton gin),
            1808 (Atlantic trade ban), 1830s (peak forced migration). Instruction
            line asks the reader to watch the three curves move together.

      - slug: manifest-destiny
        title: "Manifest Destiny and the Mexican-American War"
        type: core
        status: planned
        goal: "Explain how continental expansion reopened the slavery question the Missouri Compromise had closed"
        opening: "The Mexican-American War added half a million square miles to the United States and forced Congress to decide whether slavery would follow the flag west."
        est_minutes: 22
        prerequisites: [cotton-kingdom]
        concepts:
          introduces: [manifest-destiny, free-soil]
          reinforces: [cotton-kingdom, indian-removal]
        key_ideas:
          - Overland trails and the demography of westward migration
          - Texas, Oregon, and the politics of annexation
          - The Wilmot Proviso made every acquisition a slavery vote
          - "'Mexico will poison us' — the war's victors inherited its question"
        demo: null

      - slug: sectional-crisis
        title: "The Sectional Crisis, 1850–1861"
        type: core
        status: planned
        goal: "Analyze the escalation from the Compromise of 1850 through Dred Scott and John Brown to secession"
        opening: "In eleven years the United States went from a negotiated compromise over slavery's expansion to the armed secession of eleven states; each attempted settlement made the next crisis worse."
        est_minutes: 30
        prerequisites: [manifest-destiny]
        concepts:
          introduces: [free-labor, secession]
          reinforces: [free-soil, domestic-slave-trade, abolitionism, contingency]
        key_ideas:
          - Kansas-Nebraska destroyed the party system and built the Republicans
          - "Douglass's reading: the Constitution as 'a GLORIOUS LIBERTY DOCUMENT' against Taney's Dred Scott"
          - Violence entered Congress — the Sumner caning — and Kansas
          - John Brown, the election of 1860, and secession as counterrevolution
        demo:
          component: SenateBalanceTimeline
          spec: >
            Year slider 1819–1861 showing free-state vs slave-state Senate seats
            as two stacked bars, with admission events annotated (Missouri,
            1850, Kansas-Nebraska). Presets for 1820, 1850, 1854, 1861. The
            reader watches the balance the compromises were defending collapse.

  - slug: civil-war-and-reconstruction
    title: "Civil War and Reconstruction"
    outcomes: [co-promise, co-contingency, co-institutions]
    lessons:
      - slug: war-for-union
        title: "The War for Union, 1861–1863"
        type: core
        status: planned
        goal: "Explain how both sides mobilized for war and why the short-war illusion died at Bull Run, Shiloh, and Antietam"
        opening: "In April 1861 both sides expected a ninety-day war; Shiloh alone produced more American casualties in two days than every previous American war combined."
        est_minutes: 26
        prerequisites: [sectional-crisis]
        concepts:
          introduces: [war-for-union]
          reinforces: [secession, free-labor]
        key_ideas:
          - Sumter, the upper South's choice, and two mobilizations
          - The material imbalance — population, industry, railroads
          - The casualty escalation ladder — Bull Run to Shiloh to Antietam
          - Photography brought the dead to the home front
        demo: null

      - slug: emancipation
        title: "Emancipation"
        type: core
        status: planned
        goal: "Analyze how enslaved people's flight and Lincoln's policy together turned the war for Union into a war for freedom"
        opening: "Emancipation began not with a proclamation but with three men rowing to a Union fort in May 1861; it ended with the Thirteenth Amendment."
        est_minutes: 28
        prerequisites: [war-for-union]
        concepts:
          introduces: [self-emancipation, emancipation-proclamation]
          reinforces: [war-for-union, abolitionism]
        key_ideas:

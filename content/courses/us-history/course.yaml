        status: planned
        goal: "Analyze the HOLC security maps as primary sources and trace their consequences to present-day inequality"
        opening: "In the late 1930s federal surveyors graded every big-city neighborhood A through D, wrote race into the grades, and colored grade D red; the geography they drew still predicts wealth, health, and heat today."
        est_minutes: 24
        prerequisites: [new-deal]
        concepts:
          introduces: [redlining]
          reinforces: [new-deal-state, great-migration]

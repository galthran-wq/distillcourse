        demo: null

      - slug: union-victory
        title: "Total War and Union Victory, 1863–1865"
        type: core
        status: planned
        goal: "Explain why the Union won — total war on Confederate resources, the 1864 election, and the meanings Lincoln gave the war"
        opening: "After Gettysburg and Vicksburg the Confederacy could no longer win the war on the battlefield; it could still win it at the ballot box in November 1864, and Atlanta decided that election."
        est_minutes: 24
        prerequisites: [emancipation]
        concepts:
          introduces: [total-war]
          reinforces: [emancipation-proclamation, war-for-union, contingency]
        key_ideas:
          - 1863 turning points and what they did and did not decide
          - Grant, Sherman, and war on resources and morale
          - The 1864 election as the Confederacy's last strategy

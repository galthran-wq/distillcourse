          - Pearl Harbor — cascade of errors, not conspiracy
          - The war of machines — production as strategy
          - D-Day to the atomic bomb, and the settlement of 1945
        demo: null

      - slug: wwii-home-front
        title: "The Home Front: Four Freedoms and Their Boundaries"
        type: core
        status: planned
        goal: "Analyze how the war remade American society — women and Black workers in war industry, the GI Bill — while incarcerating Japanese Americans"

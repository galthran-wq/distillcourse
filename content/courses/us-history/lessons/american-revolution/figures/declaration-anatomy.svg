<svg viewBox="0 0 560 440" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- document outline -->
  <rect x="40" y="16" width="480" height="408" rx="6" fill="none" stroke="currentColor" opacity="0.6"/>

  <!-- zone 1: premise -->
  <rect x="58" y="34" width="444" height="86" rx="4" fill="none" stroke="#4c8dd6"/>
  <text x="72" y="56" font-size="12" font-weight="600" fill="#4c8dd6">1 · PREMISE — natural rights</text>
  <text x="72" y="76" font-size="11" fill="currentColor">"all men are created equal … deriving their just powers</text>
  <text x="72" y="92" font-size="11" fill="currentColor">from the consent of the governed"</text>
  <text x="72" y="110" font-size="11" fill="currentColor" opacity="0.55">Locke's vocabulary: rights held prior to government</text>

  <!-- zone 2: proof -->
  <rect x="58" y="134" width="444" height="180" rx="4" fill="none" stroke="currentColor"/>
  <text x="72" y="156" font-size="12" font-weight="600" fill="currentColor">2 · PROOF — 27 grievances</text>
  <text x="72" y="176" font-size="11" fill="currentColor">"a long train of abuses … evinces a design to reduce</text>
  <text x="72" y="192" font-size="11" fill="currentColor">them under absolute Despotism"</text>
  <!-- suggested text lines -->
  <line x1="72" y1="208" x2="488" y2="208" stroke="currentColor" opacity="0.2"/>
  <line x1="72" y1="220" x2="488" y2="220" stroke="currentColor" opacity="0.2"/>
  <line x1="72" y1="232" x2="440" y2="232" stroke="currentColor" opacity="0.2"/>

  <!-- struck block -->
  <rect x="72" y="246" width="416" height="52" rx="4" fill="none" stroke="#e2903a" stroke-dasharray="5 4"/>
  <line x1="72" y1="246" x2="488" y2="298" stroke="#e2903a" opacity="0.6"/>
  <text x="84" y="266" font-size="11" font-weight="600" fill="#e2903a">struck by Congress, July 2–4: the slave-trade charge</text>
  <text x="84" y="284" font-size="11" fill="currentColor" opacity="0.7">"he has waged cruel war against human nature itself…"</text>

  <!-- zone 3: operative clause -->
  <rect x="58" y="328" width="444" height="80" rx="4" fill="none" stroke="#4c8dd6"/>
  <text x="72" y="350" font-size="12" font-weight="600" fill="#4c8dd6">3 · OPERATIVE CLAUSE — the legal act</text>
  <text x="72" y="370" font-size="11" fill="currentColor">"…these United Colonies are, and of Right ought to be</text>
  <text x="72" y="386" font-size="11" fill="currentColor">Free and Independent States" — Lee's resolution, verbatim</text>
</svg>

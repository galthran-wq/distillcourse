<svg viewBox="0 0 620 258" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- Box 1: Parliament enforces -->
  <rect x="30" y="28" width="252" height="58" rx="5" fill="none" stroke="#e2903a" stroke-width="2"/>
  <text x="156" y="52" font-size="12" font-weight="600" text-anchor="middle" fill="#e2903a">Parliament enforces</text>
  <text x="156" y="72" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.7">Stamp Act · Townshend duties · Tea Act</text>

  <!-- arrow box1 -> box2 -->
  <line x1="286" y1="57" x2="330" y2="57" stroke="currentColor" opacity="0.6"/>
  <path d="M 324 52 L 334 57 L 324 62" fill="none" stroke="currentColor" opacity="0.6"/>

  <!-- Box 2: colonies resist -->
  <rect x="338" y="28" width="252" height="58" rx="5" fill="none" stroke="#4c8dd6" stroke-width="2"/>
  <text x="464" y="52" font-size="12" font-weight="600" text-anchor="middle" fill="#4c8dd6">the colonies resist</text>
  <text x="464" y="72" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.7">resolves · boycott · crowds · congresses</text>

  <!-- arrow box2 -> box3 -->
  <line x1="464" y1="90" x2="410" y2="164" stroke="currentColor" opacity="0.6"/>
  <path d="M 409 153 L 407 168 L 419 161" fill="none" stroke="currentColor" opacity="0.6"/>

  <!-- Box 3: Parliament retreats, restates the claim -->
  <rect x="140" y="170" width="340" height="58" rx="5" fill="none" stroke="currentColor" opacity="0.8"/>
  <text x="310" y="194" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor">Parliament retreats, restating the claim</text>
  <text x="310" y="214" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.7">repeal + Declaratory Act · Townshend repeal minus tea</text>

  <!-- arrow box3 -> box1 (the next act) -->
  <line x1="210" y1="164" x2="156" y2="94" stroke="currentColor" opacity="0.6"/>
  <path d="M 152 105 L 154 90 L 164 99" fill="none" stroke="currentColor" opacity="0.6"/>
  <text x="140" y="140" font-size="11" text-anchor="end" fill="currentColor" opacity="0.55">the next act</text>
</svg>

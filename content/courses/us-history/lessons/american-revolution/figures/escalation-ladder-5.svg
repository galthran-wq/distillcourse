<svg viewBox="0 0 620 430" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="16" y="32" font-size="13" font-weight="600" fill="currentColor">Parliament acts</text>
  <text x="336" y="32" font-size="13" font-weight="600" fill="currentColor">the colonies answer</text>
  <g>
  <rect x="16" y="50" width="264" height="56" rx="5" fill="none" stroke="currentColor" stroke-width="1" opacity="0.85"/>
  <text x="28" y="72" font-size="12" font-weight="600" fill="currentColor">1765 · Stamp Act</text>
  <text x="28" y="92" font-size="11" fill="currentColor" opacity="0.7">the first direct tax on the colonies</text>
  <line x1="284" y1="78" x2="326" y2="78" stroke="currentColor" opacity="0.6"/>
  <path d="M 320 73 L 330 78 L 320 83" fill="none" stroke="currentColor" opacity="0.6"/>
  <rect x="336" y="50" width="268" height="56" rx="5" fill="none" stroke="currentColor" stroke-width="1" opacity="0.85"/>
  <text x="348" y="72" font-size="11" fill="currentColor">Stamp Act Congress; boycotts;</text>
  <text x="348" y="92" font-size="11" fill="currentColor">every stamp distributor resigns</text>
  </g>
  <g>
  <rect x="16" y="122" width="264" height="56" rx="5" fill="none" stroke="currentColor" stroke-width="1" opacity="0.85"/>
  <text x="28" y="144" font-size="12" font-weight="600" fill="currentColor">1766 · repeal + Declaratory Act</text>
  <text x="28" y="164" font-size="11" fill="currentColor" opacity="0.7">“…in all cases whatsoever”</text>
  <line x1="284" y1="150" x2="326" y2="150" stroke="currentColor" opacity="0.6"/>
  <path d="M 320 145 L 330 150 L 320 155" fill="none" stroke="currentColor" opacity="0.6"/>
  <rect x="336" y="122" width="268" height="56" rx="5" fill="none" stroke="currentColor" stroke-width="1" opacity="0.85"/>
  <text x="348" y="144" font-size="11" fill="currentColor">celebration; a statue of the king</text>
  <text x="348" y="164" font-size="11" fill="currentColor">raised in New York — the claim stands</text>
  </g>
  <g>
  <rect x="16" y="194" width="264" height="56" rx="5" fill="none" stroke="currentColor" stroke-width="1" opacity="0.85"/>
  <text x="28" y="216" font-size="12" font-weight="600" fill="currentColor">1767 · Townshend duties</text>
  <text x="28" y="236" font-size="11" fill="currentColor" opacity="0.7">troops sent to Boston, 1768</text>
  <line x1="284" y1="222" x2="326" y2="222" stroke="currentColor" opacity="0.6"/>
  <path d="M 320 217 L 330 222 L 320 227" fill="none" stroke="currentColor" opacity="0.6"/>
  <rect x="336" y="194" width="268" height="56" rx="5" fill="none" stroke="currentColor" stroke-width="1" opacity="0.85"/>
  <text x="348" y="216" font-size="11" fill="currentColor">non-importation, homespun;</text>
  <text x="348" y="236" font-size="11" fill="currentColor">Boston Massacre, March 1770</text>
  </g>
  <g>
  <rect x="16" y="266" width="264" height="56" rx="5" fill="none" stroke="currentColor" stroke-width="1" opacity="0.85"/>
  <text x="28" y="288" font-size="12" font-weight="600" fill="currentColor">1773 · Tea Act</text>
  <text x="28" y="308" font-size="11" fill="currentColor" opacity="0.7">cheap tea, the duty attached</text>
  <line x1="284" y1="294" x2="326" y2="294" stroke="currentColor" opacity="0.6"/>
  <path d="M 320 289 L 330 294 L 320 299" fill="none" stroke="currentColor" opacity="0.6"/>
  <rect x="336" y="266" width="268" height="56" rx="5" fill="none" stroke="currentColor" stroke-width="1" opacity="0.85"/>
  <text x="348" y="288" font-size="11" fill="currentColor">Tea Party: 342 chests into the</text>
  <text x="348" y="308" font-size="11" fill="currentColor">harbor, December 1773</text>
  </g>
  <g>
  <rect x="16" y="338" width="264" height="56" rx="5" fill="none" stroke="#e2903a" stroke-width="2"/>
  <text x="28" y="360" font-size="12" font-weight="600" fill="#e2903a">1774 · Coercive Acts</text>
  <text x="28" y="380" font-size="11" fill="currentColor" opacity="0.7">Massachusetts under military rule</text>
  <line x1="284" y1="366" x2="326" y2="366" stroke="currentColor" opacity="0.6"/>
  <path d="M 320 361 L 330 366 L 320 371" fill="none" stroke="currentColor" opacity="0.6"/>
  <rect x="336" y="338" width="268" height="56" rx="5" fill="none" stroke="#e2903a" stroke-width="2"/>
  <text x="348" y="360" font-size="11" fill="currentColor">Continental Congress + Association;</text>
  <text x="348" y="380" font-size="11" fill="currentColor">Lexington and Concord, April 1775</text>
  </g>
</svg>

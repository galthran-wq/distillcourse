<svg viewBox="0 0 620 170" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- Bars: debt vs revenue -->
  <text x="12" y="26" font-size="13" font-weight="600" fill="currentColor">Britain's ledger, 1763</text>

  <text x="12" y="56" font-size="12" fill="currentColor">national debt</text>
  <rect x="140" y="42" width="440" height="20" rx="3" fill="#e2903a" opacity="0.9"/>
  <text x="575" y="56" font-size="12" font-weight="600" text-anchor="end" fill="#ffffff">≈ £133M</text>

  <text x="12" y="94" font-size="12" fill="currentColor">annual tax revenue</text>
  <rect x="140" y="80" width="33" height="20" rx="3" fill="#4c8dd6"/>
  <text x="180" y="94" font-size="12" font-weight="600" fill="#4c8dd6">≈ £10M</text>

  <!-- 13.5x bracket -->
  <line x1="173" y1="112" x2="580" y2="112" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5"/>
  <line x1="173" y1="106" x2="173" y2="118" stroke="currentColor" opacity="0.5"/>
  <line x1="580" y1="106" x2="580" y2="118" stroke="currentColor" opacity="0.5"/>
  <text x="376" y="128" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor">13.5 × revenue</text>

  <text x="12" y="152" font-size="11" fill="currentColor" opacity="0.55">interest ≈ half of each year's revenue · new American garrison: 10,000 regulars, over £200,000 a year</text>
</svg>

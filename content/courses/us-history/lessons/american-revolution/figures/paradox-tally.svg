<svg viewBox="0 0 620 270" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- left panel: the vocabulary -->
  <rect x="16" y="20" width="288" height="230" rx="5" fill="none" stroke="#4c8dd6"/>
  <text x="32" y="46" font-size="13" font-weight="600" fill="#4c8dd6">the vocabulary</text>

  <text x="32" y="76" font-size="11" fill="currentColor">"all men are created equal"</text>
  <text x="32" y="92" font-size="11" fill="currentColor" opacity="0.55">— Declaration of Independence, 1776</text>

  <text x="32" y="122" font-size="11" fill="currentColor">by "the law of nature" all men are "free born,"</text>
  <text x="32" y="138" font-size="11" fill="currentColor">"white or black"</text>
  <text x="32" y="154" font-size="11" fill="currentColor" opacity="0.55">— James Otis, 1764</text>

  <text x="32" y="184" font-size="11" fill="currentColor">governments derive "their just powers</text>
  <text x="32" y="200" font-size="11" fill="currentColor">from the consent of the governed"</text>
  <text x="32" y="216" font-size="11" fill="currentColor" opacity="0.55">— Declaration of Independence, 1776</text>

  <!-- right panel: the record -->
  <rect x="316" y="20" width="288" height="230" rx="5" fill="none" stroke="#e2903a"/>
  <text x="332" y="46" font-size="13" font-weight="600" fill="#e2903a">the record</text>

  <text x="332" y="76" font-size="11" fill="currentColor">about one person in five in the thirteen</text>
  <text x="332" y="92" font-size="11" fill="currentColor">colonies was enslaved in 1776</text>

  <text x="332" y="122" font-size="11" fill="currentColor">30,000–100,000 enslaved people fled</text>
  <text x="332" y="138" font-size="11" fill="currentColor">to British lines during the war</text>

  <text x="332" y="168" font-size="11" fill="currentColor">the Declaration's one slavery charge</text>
  <text x="332" y="184" font-size="11" fill="currentColor">was struck before adoption</text>

  <text x="332" y="214" font-size="11" fill="currentColor">1787: a central government stronger</text>
  <text x="332" y="230" font-size="11" fill="currentColor">than the one overthrown</text>
</svg>

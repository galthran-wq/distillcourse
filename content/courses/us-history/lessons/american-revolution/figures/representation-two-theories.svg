<svg viewBox="0 0 640 290" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- panel divider -->
  <line x1="322" y1="18" x2="322" y2="272" stroke="currentColor" stroke-dasharray="3 3" opacity="0.3"/>

  <!-- ===== left panel: virtual representation ===== -->
  <text x="160" y="28" font-size="13" font-weight="600" text-anchor="middle" fill="#4c8dd6">Virtual representation</text>
  <text x="160" y="44" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.55">Britain's theory</text>

  <rect x="95" y="58" width="130" height="32" rx="5" fill="none" stroke="#4c8dd6" stroke-width="1.5"/>
  <text x="160" y="78" font-size="12" font-weight="600" text-anchor="middle" fill="#4c8dd6">PARLIAMENT</text>

  <!-- three constituencies -->
  <rect x="14" y="212" width="88" height="44" rx="5" fill="none" stroke="currentColor" opacity="0.7"/>
  <text x="58" y="230" font-size="11" text-anchor="middle" fill="currentColor">English</text>
  <text x="58" y="244" font-size="11" text-anchor="middle" fill="currentColor">electors</text>

  <rect x="112" y="212" width="96" height="44" rx="5" fill="none" stroke="currentColor" opacity="0.7"/>
  <text x="160" y="230" font-size="11" text-anchor="middle" fill="currentColor">Manchester</text>
  <text x="160" y="244" font-size="11" text-anchor="middle" fill="currentColor">(no members)</text>

  <rect x="218" y="212" width="88" height="44" rx="5" fill="none" stroke="currentColor" opacity="0.7"/>
  <text x="262" y="230" font-size="11" text-anchor="middle" fill="currentColor">the</text>
  <text x="262" y="244" font-size="11" text-anchor="middle" fill="currentColor">colonies</text>

  <!-- dashed arrows up to Parliament -->
  <line x1="58" y1="210" x2="130" y2="94" stroke="#4c8dd6" stroke-dasharray="4 3" opacity="0.7"/>
  <line x1="160" y1="210" x2="160" y2="94" stroke="#4c8dd6" stroke-dasharray="4 3" opacity="0.7"/>
  <line x1="262" y1="210" x2="190" y2="94" stroke="#4c8dd6" stroke-dasharray="4 3" opacity="0.7"/>
  <polygon points="130,94 126,103 134,102" fill="#4c8dd6" opacity="0.7"/>
  <polygon points="160,94 156,103 164,103" fill="#4c8dd6" opacity="0.7"/>
  <polygon points="190,94 186,102 194,103" fill="#4c8dd6" opacity="0.7"/>

  <text x="160" y="152" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.55">all "represented",</text>
  <text x="160" y="166" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.55">elected or not</text>

  <!-- ===== right panel: actual representation ===== -->
  <text x="481" y="28" font-size="13" font-weight="600" text-anchor="middle" fill="#e2903a">Actual representation</text>
  <text x="481" y="44" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.55">the colonial theory</text>

  <rect x="346" y="58" width="120" height="32" rx="5" fill="none" stroke="currentColor" opacity="0.7"/>
  <text x="406" y="78" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor">PARLIAMENT</text>

  <rect x="500" y="58" width="120" height="32" rx="5" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <text x="560" y="78" font-size="12" font-weight="600" text-anchor="middle" fill="#e2903a">their assembly</text>
  <text x="636" y="106" font-size="11" text-anchor="end" fill="currentColor" opacity="0.55">may tax them</text>

  <rect x="420" y="212" width="120" height="44" rx="5" fill="none" stroke="currentColor" opacity="0.7"/>
  <text x="480" y="230" font-size="11" text-anchor="middle" fill="currentColor">colonial</text>
  <text x="480" y="244" font-size="11" text-anchor="middle" fill="currentColor">electors</text>

  <!-- solid arrow: electors elect assembly -->
  <line x1="510" y1="210" x2="552" y2="94" stroke="#e2903a" stroke-width="1.5"/>
  <polygon points="552,94 546,102 554,104" fill="#e2903a"/>
  <text x="548" y="158" font-size="11" fill="#e2903a">elect —</text>
  <text x="548" y="172" font-size="11" fill="#e2903a">consent</text>

  <!-- dashed, crossed arrow: Parliament claims to tax without election -->
  <line x1="416" y1="94" x2="462" y2="210" stroke="currentColor" stroke-dasharray="4 3" opacity="0.5"/>
  <line x1="430" y1="144" x2="448" y2="160" stroke="currentColor" stroke-width="1.5" opacity="0.8"/>
  <line x1="448" y1="144" x2="430" y2="160" stroke="currentColor" stroke-width="1.5" opacity="0.8"/>
  <text x="418" y="186" font-size="11" text-anchor="end" fill="currentColor" opacity="0.55">no election,</text>
  <text x="418" y="200" font-size="11" text-anchor="end" fill="currentColor" opacity="0.55">no consent</text>
</svg>

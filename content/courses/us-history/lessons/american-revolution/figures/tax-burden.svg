<svg viewBox="0 0 560 230" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="12" y="26" font-size="13" font-weight="600" fill="currentColor">Tax collected per person, per year, c. 1765</text>

  <text x="12" y="66" font-size="12" fill="currentColor">Great Britain</text>
  <rect x="150" y="52" width="390" height="22" rx="3" fill="#4c8dd6"/>
  <text x="533" y="67" font-size="12" font-weight="600" text-anchor="end" fill="#ffffff">≈ 26 shillings</text>

  <text x="12" y="112" font-size="12" fill="currentColor">the thirteen colonies</text>
  <rect x="150" y="98" width="15" height="22" rx="3" fill="#e2903a"/>
  <text x="172" y="113" font-size="12" font-weight="600" fill="#e2903a">≈ 1 shilling</text>

  <!-- ratio bracket -->
  <line x1="165" y1="140" x2="540" y2="140" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5"/>
  <line x1="165" y1="134" x2="165" y2="146" stroke="currentColor" opacity="0.5"/>
  <line x1="540" y1="134" x2="540" y2="146" stroke="currentColor" opacity="0.5"/>
  <text x="352" y="158" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor">roughly 26 : 1</text>

  <text x="12" y="192" font-size="11" fill="currentColor" opacity="0.55">the average Briton paid on the order of twenty-five times the tax an average colonist paid;</text>
  <text x="12" y="208" font-size="11" fill="currentColor" opacity="0.55">the colonists' objection was to who could levy the tax, not to its size</text>
</svg>

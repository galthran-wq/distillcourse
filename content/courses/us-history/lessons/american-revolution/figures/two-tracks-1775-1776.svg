<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- track lines -->
  <text x="95" y="99" font-size="12" font-weight="600" text-anchor="end" fill="#4c8dd6">The Crown</text>
  <line x1="105" y1="95" x2="612" y2="95" stroke="#4c8dd6" opacity="0.6"/>
  <polygon points="620,95 608,90 608,100" fill="#4c8dd6" opacity="0.6"/>

  <text x="95" y="199" font-size="12" font-weight="600" text-anchor="end" fill="#e2903a">The Congress</text>
  <line x1="105" y1="195" x2="612" y2="195" stroke="#e2903a" opacity="0.6"/>
  <polygon points="620,195 608,190 608,200" fill="#e2903a" opacity="0.6"/>

  <!-- start ticks and bottom time labels -->
  <line x1="110" y1="88" x2="110" y2="102" stroke="#4c8dd6" opacity="0.6"/>
  <line x1="110" y1="188" x2="110" y2="202" stroke="#e2903a" opacity="0.6"/>
  <text x="110" y="292" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.55">Apr 1775</text>
  <text x="612" y="292" font-size="11" text-anchor="end" fill="currentColor" opacity="0.55">Jul 1776</text>
  <line x1="410" y1="40" x2="410" y2="278" stroke="currentColor" stroke-dasharray="3 3" opacity="0.15"/>
  <text x="410" y="292" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.55">Jan 1776</text>

  <!-- Crown track events -->
  <circle cx="243" cy="95" r="4" fill="#4c8dd6"/>
  <line x1="243" y1="88" x2="243" y2="70" stroke="#4c8dd6" opacity="0.4"/>
  <text x="243" y="50" font-size="11" text-anchor="middle" fill="currentColor">Aug — petition refused;</text>
  <text x="243" y="64" font-size="11" text-anchor="middle" fill="currentColor">rebellion proclaimed</text>

  <circle cx="310" cy="95" r="4" fill="#4c8dd6"/>
  <line x1="310" y1="102" x2="310" y2="112" stroke="#4c8dd6" opacity="0.4"/>
  <text x="310" y="126" font-size="11" text-anchor="middle" fill="currentColor">Oct — king's speech:</text>
  <text x="310" y="140" font-size="11" text-anchor="middle" fill="currentColor">"an independent empire"</text>

  <circle cx="343" cy="95" r="4" fill="#4c8dd6"/>
  <line x1="343" y1="88" x2="343" y2="34" stroke="#4c8dd6" opacity="0.4"/>
  <text x="343" y="26" font-size="11" text-anchor="middle" fill="currentColor">Nov — Dunmore's proclamation</text>

  <!-- Congress track events -->
  <circle cx="177" cy="195" r="4" fill="#e2903a"/>
  <text x="177" y="224" font-size="11" text-anchor="middle" fill="currentColor">Jun — Continental Army,</text>
  <text x="177" y="238" font-size="11" text-anchor="middle" fill="currentColor">Washington commands</text>

  <circle cx="210" cy="195" r="4" fill="#e2903a"/>
  <line x1="210" y1="188" x2="210" y2="176" stroke="#e2903a" opacity="0.4"/>
  <text x="216" y="170" font-size="11" text-anchor="middle" fill="currentColor">Jul — Olive Branch Petition sent</text>

  <circle cx="410" cy="195" r="4" fill="#e2903a"/>
  <text x="405" y="224" font-size="11" text-anchor="middle" fill="currentColor">Jan 1776 — Common Sense</text>

  <circle cx="553" cy="195" r="4" fill="#e2903a"/>
  <line x1="553" y1="188" x2="547" y2="172" stroke="#e2903a" opacity="0.4"/>
  <text x="545" y="152" font-size="11" text-anchor="middle" fill="currentColor">May 10 — new</text>
  <text x="545" y="166" font-size="11" text-anchor="middle" fill="currentColor">governments ordered</text>

  <circle cx="583" cy="195" r="4" fill="#e2903a"/>
  <text x="583" y="224" font-size="11" text-anchor="middle" fill="currentColor">Jun 7 — Lee's</text>
  <text x="583" y="238" font-size="11" text-anchor="middle" fill="currentColor">resolution moved</text>

  <circle cx="610" cy="195" r="5.5" fill="#e2903a"/>
  <line x1="610" y1="202" x2="610" y2="248" stroke="#e2903a" opacity="0.4"/>
  <text x="630" y="260" font-size="11" font-weight="600" text-anchor="end" fill="#e2903a">Jul 2 — passes 12–0:</text>
  <text x="630" y="274" font-size="11" font-weight="600" text-anchor="end" fill="#e2903a">independence in law</text>
</svg>

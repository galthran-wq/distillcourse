<svg viewBox="0 0 620 285" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="310" y="20" text-anchor="middle" font-size="13" font-weight="bold" fill="currentColor">One fault line through three churches: for or against the revival</text>

  <!-- Presbyterian column -->
  <rect x="55" y="40" width="170" height="44" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="140" y="58" text-anchor="middle" font-size="12" font-weight="bold" fill="currentColor">Presbyterians</text>
  <text x="140" y="74" text-anchor="middle" font-size="9.5" fill="currentColor" opacity="0.55">middle colonies &#183; split 1741</text>

  <line x1="140" y1="84" x2="85" y2="130" stroke="currentColor" stroke-width="1" opacity="0.5"/>
  <line x1="140" y1="84" x2="215" y2="130" stroke="currentColor" stroke-width="1" opacity="0.5"/>

  <rect x="25" y="130" width="120" height="48" rx="5" fill="none" stroke="#4c8dd6" stroke-width="1.5"/>
  <text x="85" y="150" text-anchor="middle" font-size="12" font-weight="bold" fill="#4c8dd6">Old Side</text>
  <text x="85" y="166" text-anchor="middle" font-size="9.5" fill="currentColor" opacity="0.55">against the revival</text>

  <rect x="155" y="130" width="120" height="48" rx="5" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <text x="215" y="150" text-anchor="middle" font-size="12" font-weight="bold" fill="#e2903a">New Side</text>
  <text x="215" y="166" text-anchor="middle" font-size="9.5" fill="currentColor" opacity="0.55">for the revival</text>

  <!-- Congregationalist column -->
  <rect x="340" y="40" width="230" height="44" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="455" y="58" text-anchor="middle" font-size="12" font-weight="bold" fill="currentColor">Congregationalists</text>
  <text x="455" y="74" text-anchor="middle" font-size="9.5" fill="currentColor" opacity="0.55">New England's established church</text>

  <line x1="455" y1="84" x2="370" y2="130" stroke="currentColor" stroke-width="1" opacity="0.5"/>
  <line x1="455" y1="84" x2="465" y2="130" stroke="currentColor" stroke-width="1" opacity="0.5"/>
  <line x1="455" y1="84" x2="560" y2="130" stroke="currentColor" stroke-width="1" opacity="0.5"/>

  <rect x="325" y="130" width="90" height="48" rx="5" fill="none" stroke="#4c8dd6" stroke-width="1.5"/>
  <text x="370" y="150" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4c8dd6">Old Lights</text>
  <text x="370" y="166" text-anchor="middle" font-size="9.5" fill="currentColor" opacity="0.55">against</text>

  <rect x="420" y="130" width="90" height="48" rx="5" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <text x="465" y="150" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#e2903a">New Lights</text>
  <text x="465" y="166" text-anchor="middle" font-size="9.5" fill="currentColor" opacity="0.55">for</text>

  <rect x="515" y="130" width="90" height="48" rx="5" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <text x="560" y="150" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#e2903a">Separates</text>
  <text x="560" y="166" text-anchor="middle" font-size="9.5" fill="currentColor" opacity="0.55">leave the parish</text>

  <line x1="560" y1="178" x2="556" y2="210" stroke="currentColor" stroke-width="1" opacity="0.5"/>
  <path d="M 556 210 l -3.5 -8 l 7 0 z" fill="currentColor" opacity="0.5"/>

  <rect x="495" y="212" width="118" height="46" rx="5" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <text x="554" y="232" text-anchor="middle" font-size="11" font-weight="bold" fill="#e2903a">many re-form</text>
  <text x="554" y="246" text-anchor="middle" font-size="11" font-weight="bold" fill="#e2903a">as Baptists</text>

  <text x="55" y="252" font-size="10" fill="currentColor" opacity="0.55">amber: the revival party &#183; blue: the establishment party</text>
  <text x="55" y="268" font-size="10" fill="currentColor" opacity="0.55">itinerants preached across all three lines, uninvited</text>
</svg>

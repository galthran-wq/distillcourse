<svg viewBox="0 0 620 380" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="310" y="22" text-anchor="middle" font-size="13" font-weight="bold" fill="currentColor">The empire's ledger, 1763</text>

  <!-- baseline -->
  <line x1="50" y1="310" x2="330" y2="310" stroke="currentColor" stroke-width="1"/>

  <!-- debt bar: 133M -> 250px tall -->
  <rect x="80" y="60" width="70" height="250" fill="#e2903a"/>
  <text x="115" y="52" text-anchor="middle" font-size="12" font-weight="bold" fill="#e2903a">national debt</text>
  <text x="115" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">£133M</text>
  <!-- prewar marker at 74M -> 139px -->
  <line x1="46" y1="171" x2="156" y2="171" stroke="currentColor" stroke-dasharray="3 3" opacity="0.6"/>
  <text x="76" y="162" text-anchor="end" font-size="10" fill="currentColor" opacity="0.55">prewar (1754):</text>
  <text x="76" y="186" text-anchor="end" font-size="10" fill="currentColor" opacity="0.55">≈ £74M</text>

  <!-- revenue bar: 10M -> ~19px -->
  <rect x="230" y="291" width="70" height="19" fill="#4c8dd6"/>
  <text x="265" y="283" text-anchor="middle" font-size="12" font-weight="bold" fill="#4c8dd6">a year's revenue</text>
  <text x="265" y="330" text-anchor="middle" font-size="11" fill="currentColor">≈ £10M</text>

  <!-- ratio bracket -->
  <path d="M 160 60 L 190 60 L 190 291 L 220 291" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.7"/>
  <text x="196" y="170" font-size="13" font-weight="bold" fill="currentColor">≈ 13.5×</text>
  <text x="196" y="186" font-size="10" fill="currentColor" opacity="0.55">debt to revenue</text>

  <!-- annotations right -->
  <text x="370" y="70" font-size="12" font-weight="bold" fill="currentColor">The standing charges</text>
  <text x="370" y="92" font-size="11" fill="currentColor">interest on the debt: ≈ £4.7M a year,</text>
  <text x="370" y="106" font-size="11" fill="currentColor">roughly half of everything collected</text>
  <text x="370" y="130" font-size="11" fill="currentColor">10,000 regulars stationed in America:</text>
  <text x="370" y="144" font-size="11" fill="currentColor">over £200,000 a year</text>

  <text x="370" y="182" font-size="12" font-weight="bold" fill="currentColor">Parliament's answer</text>
  <text x="370" y="204" font-size="11" fill="currentColor">Sugar Act, 1764 — tax the trade</text>
  <text x="370" y="222" font-size="11" fill="currentColor">Stamp Act, 1765 — tax the paper</text>
  <path d="M 380 236 L 380 262 l -4 -8 m 4 8 l 4 -8" fill="none" stroke="#e2903a" stroke-width="2"/>
  <text x="392" y="258" font-size="12" font-weight="bold" fill="#e2903a">the imperial crisis</text>
  <text x="392" y="272" font-size="10" fill="currentColor" opacity="0.55">next lesson</text>

  <text x="310" y="360" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.55">Rounded figures; the 13.5× ratio is the one to keep. The colonies' defense was the largest new line item.</text>
</svg>

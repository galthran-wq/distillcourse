<svg viewBox="0 0 620 400" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="310" y="22" text-anchor="middle" font-size="13" font-weight="bold" fill="currentColor">Franklin's acoustic bound, dissected (Philadelphia, 1739)</text>

  <!-- street -->
  <line x1="60" y1="70" x2="560" y2="70" stroke="currentColor" stroke-width="1.5"/>
  <text x="60" y="58" font-size="11" fill="currentColor" opacity="0.55">Market Street</text>

  <!-- speaker at Courthouse (Second St) -->
  <circle cx="150" cy="70" r="5" fill="#e2903a"/>
  <text x="150" y="46" text-anchor="middle" font-size="11" font-weight="bold" fill="#e2903a">Whitefield</text>
  <text x="150" y="90" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.55">Courthouse steps, Second St</text>

  <!-- Franklin walking to Front St -->
  <circle cx="470" cy="70" r="4" fill="#4c8dd6"/>
  <text x="470" y="50" text-anchor="middle" font-size="11" font-weight="bold" fill="#4c8dd6">Franklin</text>
  <text x="470" y="90" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.55">Front St: voice fades</text>
  <line x1="150" y1="108" x2="470" y2="108" stroke="#4c8dd6" stroke-width="1.5"/>
  <path d="M 470 108 l -8 -3.5 l 0 7 z" fill="#4c8dd6"/>
  <path d="M 150 108 l 8 -3.5 l 0 7 z" fill="#4c8dd6"/>
  <text x="310" y="102" text-anchor="middle" font-size="11" fill="#4c8dd6">r ≈ 400–550 ft (reconstructed from the street grid)</text>

  <!-- semicircle of hearers -->
  <path d="M 20 132 A 130 130 0 0 0 280 132 Z" fill="#e2903a" opacity="0.14" stroke="#e2903a" stroke-width="1.5"/>
  <text x="150" y="200" text-anchor="middle" font-size="11" fill="#e2903a">the semicircle of hearers</text>
  <text x="150" y="216" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.55">each allowed 2 sq ft</text>

  <!-- steps -->
  <g>
    <circle cx="308" cy="148" r="9" fill="#e2903a"/>
    <text x="308" y="152" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">1</text>
    <text x="324" y="152" font-size="11.5" fill="currentColor">Radius: walk till the voice fades, "near Front-street"</text>
    <text x="324" y="166" font-size="10" fill="currentColor" opacity="0.55">≈ 400–550 ft on the grid — a reconstruction, not his figure</text>

    <circle cx="308" cy="188" r="9" fill="#e2903a"/>
    <text x="308" y="192" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">2</text>
    <text x="324" y="192" font-size="11.5" fill="currentColor">Area at r = 500: ½·π·r² ≈ 390,000 sq ft</text>

    <circle cx="308" cy="218" r="9" fill="#e2903a"/>
    <text x="308" y="222" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">3</text>
    <text x="324" y="222" font-size="11.5" fill="currentColor">Packing: 2 sq ft each → ≈ 195,000 places</text>
  </g>

  <!-- result box -->
  <rect x="55" y="252" width="510" height="90" rx="6" fill="none" stroke="#e2903a" stroke-width="2"/>
  <text x="310" y="272" text-anchor="middle" font-size="12" font-weight="bold" fill="currentColor">The published claim:</text>
  <text x="310" y="290" text-anchor="middle" font-size="12" fill="currentColor">"he might well be heard by more than thirty thousand"</text>
  <text x="310" y="312" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.75">the model yields 30,000 only below r ≈ 195 ft — under half the shortest plausible walk:</text>
  <text x="310" y="328" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.75">the reported crowds were feasible at every radius consistent with the street</text>

  <text x="310" y="368" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">The computation bounds how many COULD hear one voice; it counts places, not people.</text>
  <text x="310" y="384" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">It reconciled Franklin to newspaper reports of 25,000-person audiences he had doubted.</text>
</svg>

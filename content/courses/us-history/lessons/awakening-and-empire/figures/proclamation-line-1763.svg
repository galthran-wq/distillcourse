<svg viewBox="0 0 620 460" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="310" y="18" text-anchor="middle" font-size="13" font-weight="bold" fill="currentColor">1763, drawn twice: the Peace of Paris (Feb.) and the Proclamation Line (Oct.)</text>

  <!-- region fills -->
  <!-- Canada (France -> Britain) -->
  <path d="M 250 100 C 360 90, 480 80, 600 72 L 600 40 L 250 40 Z" fill="#5aa46a" opacity="0.12"/>
  <!-- interior between Mississippi and the crest (France -> Britain, then reserved) -->
  <path d="M 250 100 C 330 93, 405 89, 480 86 C 450 180, 415 270, 382 380 L 268 380 C 252 300, 242 190, 250 100 Z" fill="#5aa46a" opacity="0.12"/>
  <!-- the thirteen colonies strip -->
  <path d="M 480 86 C 450 180, 415 270, 382 380 L 460 380 C 520 260, 566 160, 600 72 C 560 76, 520 81, 480 86 Z" fill="currentColor" opacity="0.05"/>
  <!-- Louisiana (France -> Spain) -->
  <path d="M 20 100 L 250 100 C 242 190, 252 300, 268 380 L 20 380 Z" fill="#4c8dd6" opacity="0.12"/>
  <!-- Florida (Spain -> Britain) -->
  <path d="M 415 380 L 452 380 C 454 405, 450 418, 438 420 C 427 418, 416 400, 415 380 Z" fill="#5aa46a" opacity="0.25"/>

  <!-- coast and border strokes -->
  <path d="M 250 100 C 360 90, 480 80, 600 72" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.5"/>
  <path d="M 600 72 C 566 160, 520 260, 460 380" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.5"/>
  <path d="M 268 380 L 460 380" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.5"/>
  <path d="M 250 100 C 242 190, 252 300, 268 380" fill="none" stroke="currentColor" stroke-width="2" opacity="0.5"/>

  <!-- the Proclamation Line along the crest -->
  <path d="M 480 86 C 450 180, 415 270, 382 380" fill="none" stroke="#e2903a" stroke-width="3" stroke-dasharray="7 4"/>

  <!-- labels -->
  <text x="350" y="62" font-size="11" font-weight="bold" fill="currentColor">CANADA</text>
  <text x="405" y="62" font-size="10" fill="#5aa46a">France &#8594; Britain</text>

  <text x="130" y="225" text-anchor="middle" font-size="11" font-weight="bold" fill="currentColor">LOUISIANA</text>
  <text x="130" y="241" text-anchor="middle" font-size="10" fill="#4c8dd6">France &#8594; Spain</text>
  <text x="130" y="255" text-anchor="middle" font-size="9" fill="currentColor" opacity="0.55">everything west of the river</text>

  <text x="252" y="250" transform="rotate(83 252 250)" font-size="9.5" fill="currentColor" opacity="0.55">Mississippi R.</text>

  <text x="335" y="180" text-anchor="middle" font-size="10.5" fill="#5aa46a">France &#8594; Britain (Feb.)</text>
  <text x="335" y="225" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#e2903a">closed to colonial settlement</text>
  <text x="335" y="239" text-anchor="middle" font-size="10" fill="#e2903a">reserved to Native nations</text>
  <text x="335" y="253" text-anchor="middle" font-size="9" fill="currentColor" opacity="0.55">Royal Proclamation, Oct. 7, 1763</text>

  <text x="468" y="112" text-anchor="end" font-size="10" font-weight="bold" fill="#e2903a">the Proclamation Line,</text>
  <text x="468" y="124" text-anchor="end" font-size="10" fill="#e2903a">along the Appalachian crest</text>

  <text x="482" y="235" transform="rotate(-65 482 235)" text-anchor="middle" font-size="11" fill="currentColor">the thirteen colonies</text>

  <text x="436" y="440" text-anchor="middle" font-size="10" fill="#5aa46a">FLORIDA &#8212; Spain &#8594; Britain</text>
  <text x="20" y="456" font-size="9.5" fill="currentColor" opacity="0.55">green: to Britain &#183; blue: to Spain (Peace of Paris, Feb. 1763) &#183; amber dash: the Line (Oct. 1763)</text>
</svg>

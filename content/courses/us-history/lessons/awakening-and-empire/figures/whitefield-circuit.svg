<svg viewBox="0 0 620 480" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="310" y="22" text-anchor="middle" font-size="13" font-weight="bold" fill="currentColor">One voice, thirteen colonies: Whitefield's tour, Oct 1739 – Jan 1741</text>

  <!-- coastline (locator sketch): land left, sea right -->
  <path d="M 128 458 C 175 415, 215 375, 258 336 C 292 305, 318 272, 348 240 C 378 208, 415 185, 442 155 C 462 133, 478 108, 492 80"
        fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.45"/>
  <text x="540" y="330" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">Atlantic</text>

  <!-- route (amber), in tour order: Lewes -> Philadelphia -> New York -> south to Savannah -> sea leg to Newport -> Boston -> Northampton -> sails -->
  <path d="M 308 290 L 330 254" fill="none" stroke="#e2903a" stroke-width="2"/>
  <path d="M 330 254 L 374 220" fill="none" stroke="#e2903a" stroke-width="2"/>
  <path d="M 374 220 C 330 300, 240 380, 158 428" fill="none" stroke="#e2903a" stroke-width="2"/>
  <path d="M 158 432 C 300 430, 420 300, 432 168" fill="none" stroke="#e2903a" stroke-width="2" stroke-dasharray="6 3"/>
  <path d="M 432 162 L 462 130" fill="none" stroke="#e2903a" stroke-width="2"/>
  <path d="M 462 128 L 402 108" fill="none" stroke="#e2903a" stroke-width="2"/>
  <path d="M 468 124 C 510 118, 545 112, 578 104" fill="none" stroke="#e2903a" stroke-width="2" stroke-dasharray="6 3"/>
  <path d="M 578 104 l -9 -4 l 3 5 l -5 4 z" fill="#e2903a"/>

  <!-- stops -->
  <!-- print towns (own newspaper in 1740): blue ring -->
  <circle cx="330" cy="254" r="6.5" fill="none" stroke="#4c8dd6" stroke-width="2"/>
  <circle cx="374" cy="220" r="6.5" fill="none" stroke="#4c8dd6" stroke-width="2"/>
  <circle cx="462" cy="128" r="6.5" fill="none" stroke="#4c8dd6" stroke-width="2"/>
  <circle cx="262" cy="332" r="6.5" fill="none" stroke="#4c8dd6" stroke-width="2"/>
  <circle cx="190" cy="398" r="6.5" fill="none" stroke="#4c8dd6" stroke-width="2"/>

  <circle cx="308" cy="290" r="4" fill="#e2903a"/>
  <circle cx="330" cy="254" r="4" fill="#e2903a"/>
  <circle cx="374" cy="220" r="4" fill="#e2903a"/>
  <circle cx="262" cy="332" r="4" fill="#e2903a"/>
  <circle cx="190" cy="398" r="4" fill="#e2903a"/>
  <circle cx="158" cy="430" r="4" fill="#e2903a"/>
  <circle cx="432" cy="164" r="4" fill="#e2903a"/>
  <circle cx="462" cy="128" r="4" fill="#e2903a"/>
  <circle cx="400" cy="106" r="4" fill="#e2903a"/>

  <!-- labels -->
  <text x="296" y="304" text-anchor="end" font-size="11" fill="currentColor">Lewes, Del. — lands Oct 30, 1739</text>
  <text x="318" y="250" text-anchor="end" font-size="11" font-weight="bold" fill="currentColor">Philadelphia</text>
  <text x="318" y="263" text-anchor="end" font-size="10" fill="currentColor" opacity="0.55">newspapers count 25,000</text>
  <text x="386" y="224" font-size="11" fill="currentColor">New York</text>
  <text x="250" y="336" text-anchor="end" font-size="11" fill="currentColor">Williamsburg</text>
  <text x="178" y="402" text-anchor="end" font-size="11" fill="currentColor">Charleston</text>
  <text x="146" y="434" text-anchor="end" font-size="11" fill="currentColor">Savannah</text>
  <text x="172" y="447" font-size="10" fill="currentColor" opacity="0.55">winter 1739–40 · Bethesda orphanage</text>
  <text x="444" y="196" font-size="11" fill="currentColor">Newport · Sept 14, 1740</text>
  <text x="474" y="132" font-size="11" font-weight="bold" fill="currentColor">Boston</text>
  <text x="474" y="145" font-size="10" fill="currentColor" opacity="0.55">farewell: 20–30,000 hearers,</text>
  <text x="474" y="157" font-size="10" fill="currentColor" opacity="0.55">in a town of ≈16,500</text>
  <text x="388" y="98" text-anchor="end" font-size="11" fill="currentColor">Northampton (Edwards)</text>
  <text x="536" y="76" text-anchor="middle" font-size="10" fill="#e2903a">sails for England, Jan 1741</text>

  <!-- legend -->
  <circle cx="36" cy="132" r="6.5" fill="none" stroke="#4c8dd6" stroke-width="2"/>
  <circle cx="36" cy="132" r="3.5" fill="#e2903a"/>
  <text x="48" y="136" font-size="11" fill="currentColor">stop in a town with its own newspaper, 1740</text>
  <line x1="28" y1="156" x2="44" y2="156" stroke="#e2903a" stroke-width="2"/>
  <text x="48" y="160" font-size="11" fill="currentColor">preaching route (dashed: sea leg)</text>
  <text x="28" y="186" font-size="10" fill="currentColor" opacity="0.55">Crowd figures are period estimates; the route is schematic.</text>
</svg>

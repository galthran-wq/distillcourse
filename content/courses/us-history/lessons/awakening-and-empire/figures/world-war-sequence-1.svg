<svg viewBox="0 0 620 400" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="310" y="20" text-anchor="middle" font-size="13" font-weight="bold" fill="currentColor">1754: two skirmishes in the Ohio Country</text>

  <!-- left panel: the spark -->
  <text x="145" y="46" text-anchor="middle" font-size="12" font-weight="bold" fill="currentColor">The spark: the Ohio Country</text>
  <!-- rivers: Allegheny (from top), Monongahela (from bottom right), Ohio (to left) -->
  <path d="M 150 70 C 145 100, 140 120, 132 140" fill="none" stroke="currentColor" stroke-width="2" opacity="0.45"/>
  <path d="M 235 235 C 200 200, 160 165, 132 140" fill="none" stroke="currentColor" stroke-width="2" opacity="0.45"/>
  <path d="M 132 140 C 100 150, 70 148, 40 138" fill="none" stroke="currentColor" stroke-width="2.5" opacity="0.45"/>
  <text x="158" y="86" font-size="10" fill="currentColor" opacity="0.55">Allegheny</text>
  <text x="238" y="248" font-size="10" fill="currentColor" opacity="0.55" text-anchor="end">Monongahela</text>
  <text x="52" y="130" font-size="10" fill="currentColor" opacity="0.55">Ohio</text>
  <!-- Fort Duquesne at the forks -->
  <rect x="126" y="134" width="12" height="12" fill="#4c8dd6"/>
  <text x="120" y="164" font-size="10" fill="#4c8dd6">Fort Duquesne (French, 1754)</text>
  <text x="120" y="176" font-size="9" fill="currentColor" opacity="0.55">the Forks: modern Pittsburgh</text>
  <!-- Jumonville Glen -->
  <circle cx="205" cy="268" r="4" fill="#e2903a"/>
  <text x="196" y="264" text-anchor="end" font-size="10" fill="#e2903a">Jumonville Glen, May 28, 1754</text>
  <text x="196" y="276" text-anchor="end" font-size="9" fill="currentColor" opacity="0.55">Washington's 15-minute ambush</text>
  <!-- Fort Necessity -->
  <circle cx="188" cy="316" r="4" fill="#e2903a"/>
  <text x="180" y="312" text-anchor="end" font-size="10" fill="#e2903a">Fort Necessity, July 3, 1754</text>
  <text x="180" y="324" text-anchor="end" font-size="9" fill="currentColor" opacity="0.55">Washington surrenders</text>

  <!-- divider -->
  <line x1="290" y1="40" x2="290" y2="380" stroke="currentColor" stroke-width="1" opacity="0.25"/>

  <!-- right panel: the theaters -->
  <text x="455" y="46" text-anchor="middle" font-size="12" font-weight="bold" fill="currentColor">The theaters (still at peace)</text>
  <circle cx="320" cy="70" r="5" fill="currentColor" opacity="0.25"/>
  <text x="334" y="74" font-size="11" fill="currentColor" opacity="0.35">North America</text>
  <circle cx="320" cy="122" r="5" fill="currentColor" opacity="0.25"/>
  <text x="334" y="126" font-size="11" fill="currentColor" opacity="0.35">Caribbean</text>
  <circle cx="320" cy="174" r="5" fill="currentColor" opacity="0.25"/>
  <text x="334" y="178" font-size="11" fill="currentColor" opacity="0.35">Europe</text>
  <circle cx="320" cy="226" r="5" fill="currentColor" opacity="0.25"/>
  <text x="334" y="230" font-size="11" fill="currentColor" opacity="0.35">West Africa</text>
  <circle cx="320" cy="278" r="5" fill="currentColor" opacity="0.25"/>
  <text x="334" y="282" font-size="11" fill="currentColor" opacity="0.35">India</text>
  <circle cx="320" cy="330" r="5" fill="currentColor" opacity="0.25"/>
  <text x="334" y="334" font-size="11" fill="currentColor" opacity="0.35">Philippines</text>
</svg>

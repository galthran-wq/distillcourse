<svg viewBox="0 0 640 350" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrAmber" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#e2903a"/>
    </marker>
    <marker id="arrBlue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#4c8dd6"/>
    </marker>
    <marker id="arrCur" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- nodes -->
  <rect x="24" y="36" width="190" height="42" rx="6" fill="none" stroke="currentColor"/>
  <text x="119" y="62" font-size="12.5" font-weight="bold" fill="currentColor" text-anchor="middle">British mainland colonies</text>
  <rect x="470" y="36" width="146" height="42" rx="6" fill="none" stroke="currentColor"/>
  <text x="543" y="62" font-size="12.5" font-weight="bold" fill="currentColor" text-anchor="middle">Britain</text>
  <rect x="24" y="262" width="190" height="42" rx="6" fill="none" stroke="currentColor"/>
  <text x="119" y="288" font-size="12.5" font-weight="bold" fill="currentColor" text-anchor="middle">Caribbean sugar islands</text>
  <rect x="470" y="262" width="146" height="42" rx="6" fill="none" stroke="currentColor"/>
  <text x="543" y="288" font-size="12.5" font-weight="bold" fill="currentColor" text-anchor="middle">West Africa</text>

  <!-- Britain <-> mainland: the thick amber pair -->
  <line x1="222" y1="48" x2="458" y2="48" stroke="#e2903a" stroke-width="5" marker-end="url(#arrAmber)"/>
  <text x="340" y="34" font-size="11" fill="#e2903a" text-anchor="middle">tobacco, rice, furs, naval stores</text>
  <line x1="458" y1="68" x2="222" y2="68" stroke="#e2903a" stroke-width="5" marker-end="url(#arrAmber)"/>
  <text x="340" y="92" font-size="11" fill="#e2903a" text-anchor="middle">manufactured goods and credit</text>

  <!-- mainland <-> Caribbean: blue pair -->
  <line x1="90" y1="84" x2="90" y2="254" stroke="#4c8dd6" stroke-width="3" marker-end="url(#arrBlue)"/>
  <text x="98" y="150" font-size="11" fill="#4c8dd6">fish, grain, lumber</text>
  <line x1="150" y1="254" x2="150" y2="84" stroke="#4c8dd6" stroke-width="3" marker-end="url(#arrBlue)"/>
  <text x="158" y="182" font-size="11" fill="#4c8dd6">sugar, molasses</text>

  <!-- Africa -> Caribbean: Middle Passage -->
  <line x1="462" y1="283" x2="222" y2="283" stroke="currentColor" stroke-width="3" marker-end="url(#arrCur)"/>
  <text x="340" y="320" font-size="11" fill="currentColor" text-anchor="middle">enslaved people (the Middle Passage)</text>

  <!-- Britain -> Africa -->
  <line x1="543" y1="84" x2="543" y2="254" stroke="currentColor" stroke-width="1.5" marker-end="url(#arrCur)"/>
  <text x="551" y="166" font-size="11" fill="currentColor" opacity="0.55">textiles, arms</text>

  <!-- mainland -> Africa: rum -->
  <line x1="222" y1="106" x2="462" y2="262" stroke="currentColor" stroke-width="1.5" opacity="0.7" marker-end="url(#arrCur)"/>
  <text x="322" y="204" font-size="11" fill="currentColor" opacity="0.55">rum</text>

  <!-- legend -->
  <text x="24" y="340" font-size="11" fill="currentColor" opacity="0.55">arrow width &#8776; share of trade value; the thickest pair is the direct Britain &#8646; mainland exchange</text>
</svg>

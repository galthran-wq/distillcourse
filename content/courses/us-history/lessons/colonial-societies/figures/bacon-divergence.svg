<svg viewBox="0 0 640 290" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrC" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- input: the rebel coalition -->
  <rect x="16" y="70" width="248" height="150" rx="6" fill="none" stroke="currentColor"/>
  <text x="30" y="94" font-size="13" font-weight="bold" fill="currentColor">Bacon's army, 1676</text>
  <text x="30" y="118" font-size="12" fill="currentColor">&#8226; freed ex-servants without land</text>
  <text x="30" y="138" font-size="12" fill="currentColor">&#8226; indentured servants</text>
  <text x="30" y="158" font-size="12" fill="currentColor">&#8226; enslaved Black men</text>
  <text x="30" y="188" font-size="11" fill="currentColor" opacity="0.55">last band in arms: &#8776;80 enslaved men</text>
  <text x="30" y="204" font-size="11" fill="currentColor" opacity="0.55">and 20 English servants</text>

  <!-- fan arrows to the two outputs -->
  <line x1="268" y1="130" x2="342" y2="72" stroke="currentColor" stroke-width="2" marker-end="url(#arrC)"/>
  <line x1="268" y1="160" x2="342" y2="218" stroke="currentColor" stroke-width="2" marker-end="url(#arrC)"/>
  <text x="270" y="143" font-size="11" fill="currentColor" opacity="0.55">the assembly</text>
  <text x="270" y="157" font-size="11" fill="currentColor" opacity="0.55">divides it</text>

  <!-- output 1: poor whites -->
  <rect x="350" y="16" width="274" height="112" rx="6" fill="none" stroke="#4c8dd6" stroke-width="2"/>
  <text x="364" y="40" font-size="13" font-weight="bold" fill="#4c8dd6">Poor whites, after 1676</text>
  <text x="364" y="62" font-size="11.5" fill="currentColor">taxes cut; freedom dues kept, with</text>
  <text x="364" y="79" font-size="11.5" fill="currentColor">a musket added for men (1705);</text>
  <text x="364" y="96" font-size="11.5" fill="currentColor">placed by statute above every</text>
  <text x="364" y="113" font-size="11.5" fill="currentColor">Black Virginian, free or enslaved</text>

  <!-- output 2: Black Virginians -->
  <rect x="350" y="162" width="274" height="112" rx="6" fill="none" stroke="#e2903a" stroke-width="2"/>
  <text x="364" y="186" font-size="13" font-weight="bold" fill="#e2903a">Black Virginians, after 1676</text>
  <text x="364" y="208" font-size="11.5" fill="currentColor">African imports rise, sharply after</text>
  <text x="364" y="225" font-size="11.5" fill="currentColor">the slave-trade monopoly ends (1698);</text>
  <text x="364" y="242" font-size="11.5" fill="currentColor">the code hardens: 1682 import act,</text>
  <text x="364" y="259" font-size="11.5" fill="currentColor">1691 manumission bar, 1705 code</text>
</svg>

<svg viewBox="0 0 640 220" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrBlue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#4c8dd6"/>
    </marker>
  </defs>

  <!-- pre-term segment -->
  <line x1="30" y1="105" x2="70" y2="105" stroke="currentColor" opacity="0.4"/>
  <!-- the term: amber band -->
  <rect x="70" y="98" width="360" height="14" rx="3" fill="#e2903a"/>
  <text x="250" y="135" font-size="12" font-weight="bold" fill="#e2903a" text-anchor="middle">the term: 4&#8211;7 years of owned, saleable labor</text>
  <!-- post-term segment: free -->
  <line x1="430" y1="105" x2="600" y2="105" stroke="#4c8dd6" stroke-width="3" marker-end="url(#arrBlue)"/>
  <text x="530" y="92" font-size="13" font-weight="bold" fill="#4c8dd6" text-anchor="middle">free</text>

  <!-- event ticks -->
  <line x1="70" y1="88" x2="70" y2="122" stroke="currentColor"/>
  <line x1="250" y1="88" x2="250" y2="122" stroke="currentColor"/>
  <line x1="430" y1="88" x2="430" y2="122" stroke="currentColor"/>

  <text x="70" y="58" font-size="12" font-weight="bold" fill="currentColor" text-anchor="middle">term begins</text>
  <text x="70" y="74" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">passage paid, &#8776;&#163;6</text>
  <text x="250" y="58" font-size="12" font-weight="bold" fill="currentColor" text-anchor="middle">contract sold</text>
  <text x="250" y="74" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">new master, same term</text>
  <text x="430" y="58" font-size="12" font-weight="bold" fill="currentColor" text-anchor="middle">term expires</text>
  <text x="430" y="74" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">after 4&#8211;7 years</text>

  <!-- freedom dues at expiry -->
  <text x="440" y="145" font-size="11" fill="currentColor">freedom dues (1705): ten bushels</text>
  <text x="440" y="160" font-size="11" fill="currentColor">of corn, thirty shillings,</text>
  <text x="440" y="175" font-size="11" fill="currentColor">a musket for men</text>

  <!-- child branch -->
  <line x1="330" y1="112" x2="330" y2="180" stroke="#4c8dd6" stroke-width="2" marker-end="url(#arrBlue)"/>
  <text x="320" y="165" font-size="11" fill="currentColor" text-anchor="end">a child born during the term:</text>
  <text x="320" y="182" font-size="12" font-weight="bold" fill="#4c8dd6" text-anchor="end">born free, inherits no term</text>
</svg>

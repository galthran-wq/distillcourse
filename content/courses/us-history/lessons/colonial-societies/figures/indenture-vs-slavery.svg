<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- column headers -->
  <text x="255" y="26" font-size="13" font-weight="bold" fill="#4c8dd6" text-anchor="middle">Indentured servant</text>
  <text x="510" y="26" font-size="13" font-weight="bold" fill="#e2903a" text-anchor="middle">Enslaved person</text>

  <!-- row: Term -->
  <text x="16" y="72" font-size="12" font-weight="bold" fill="currentColor">Term</text>
  <rect x="135" y="42" width="240" height="55" rx="4" fill="none" stroke="currentColor" opacity="0.35"/>
  <text x="148" y="66" font-size="11.5" fill="currentColor">4&#8211;7 years,</text>
  <text x="148" y="83" font-size="11.5" fill="currentColor">fixed by a written contract</text>
  <rect x="390" y="42" width="234" height="55" rx="4" fill="none" stroke="#e2903a" stroke-width="2.5"/>
  <text x="403" y="74" font-size="11.5" font-weight="bold" fill="#e2903a">life</text>

  <!-- row: Children -->
  <text x="16" y="147" font-size="12" font-weight="bold" fill="currentColor">Children</text>
  <rect x="135" y="117" width="240" height="55" rx="4" fill="none" stroke="currentColor" opacity="0.35"/>
  <text x="148" y="141" font-size="11.5" fill="currentColor">born free;</text>
  <text x="148" y="158" font-size="11.5" fill="currentColor">the term does not descend</text>
  <rect x="390" y="117" width="234" height="55" rx="4" fill="none" stroke="#e2903a" stroke-width="2.5"/>
  <text x="403" y="141" font-size="11.5" font-weight="bold" fill="#e2903a">follow the mother's status:</text>
  <text x="403" y="158" font-size="11.5" font-weight="bold" fill="#e2903a">enslaved from birth (1662)</text>

  <!-- row: Exit -->
  <text x="16" y="222" font-size="12" font-weight="bold" fill="currentColor">Exit</text>
  <rect x="135" y="192" width="240" height="55" rx="4" fill="none" stroke="currentColor" opacity="0.35"/>
  <text x="148" y="216" font-size="11.5" fill="currentColor">freedom dues: corn, 30 shillings,</text>
  <text x="148" y="233" font-size="11.5" fill="currentColor">a musket for men (1705)</text>
  <rect x="390" y="192" width="234" height="55" rx="4" fill="none" stroke="currentColor" opacity="0.35"/>
  <text x="403" y="216" font-size="11.5" fill="currentColor">manumission only if shipped</text>
  <text x="403" y="233" font-size="11.5" fill="currentColor">out of the colony (1691)</text>

  <!-- row: Violence -->
  <text x="16" y="297" font-size="12" font-weight="bold" fill="currentColor">Violence</text>
  <rect x="135" y="267" width="240" height="55" rx="4" fill="none" stroke="currentColor" opacity="0.35"/>
  <text x="148" y="291" font-size="11.5" fill="currentColor">may sue in court; whipping naked</text>
  <text x="148" y="308" font-size="11.5" fill="currentColor">requires a justice's order (1705)</text>
  <rect x="390" y="267" width="234" height="55" rx="4" fill="none" stroke="currentColor" opacity="0.35"/>
  <text x="403" y="291" font-size="11.5" fill="currentColor">death under "correction"</text>
  <text x="403" y="308" font-size="11.5" fill="currentColor">is no felony (1669, 1705)</text>
</svg>

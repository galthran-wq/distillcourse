<svg viewBox="0 0 560 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- axes -->
  <line x1="52" y1="30" x2="52" y2="250" stroke="currentColor" opacity="0.4"/>
  <line x1="52" y1="250" x2="530" y2="250" stroke="currentColor" opacity="0.4"/>
  <text x="56" y="22" font-size="11" fill="currentColor" opacity="0.55">&#163; per year of labor</text>
  <text x="291" y="292" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">expected years of labor from purchase (E)</text>

  <!-- y ticks -->
  <text x="44" y="194" font-size="11" fill="currentColor" opacity="0.55" text-anchor="end">&#163;2</text>
  <text x="44" y="134" font-size="11" fill="currentColor" opacity="0.55" text-anchor="end">&#163;4</text>
  <text x="44" y="74" font-size="11" fill="currentColor" opacity="0.55" text-anchor="end">&#163;6</text>
  <line x1="48" y1="190" x2="52" y2="190" stroke="currentColor" opacity="0.4"/>
  <line x1="48" y1="130" x2="52" y2="130" stroke="currentColor" opacity="0.4"/>
  <line x1="48" y1="70" x2="52" y2="70" stroke="currentColor" opacity="0.4"/>

  <!-- x ticks -->
  <text x="147" y="268" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">5</text>
  <text x="242" y="268" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">10</text>
  <text x="337" y="268" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">15</text>
  <text x="432" y="268" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">20</text>
  <line x1="147" y1="250" x2="147" y2="254" stroke="currentColor" opacity="0.4"/>
  <line x1="242" y1="250" x2="242" y2="254" stroke="currentColor" opacity="0.4"/>
  <line x1="337" y1="250" x2="337" y2="254" stroke="currentColor" opacity="0.4"/>
  <line x1="432" y1="250" x2="432" y2="254" stroke="currentColor" opacity="0.4"/>

  <!-- servant: flat price per labor-year -->
  <line x1="52" y1="184" x2="530" y2="184" stroke="#4c8dd6" stroke-width="2.5"/>
  <text x="300" y="176" font-size="12" font-weight="bold" fill="#4c8dd6">servant: &#163;11 / 5-yr term = &#163;2.2 per yr</text>

  <!-- enslaved for life: 23/E -->
  <polyline points="118,53 128,78 147,112 166,135 185,151 204,164 223,174 242,181 251,184 280,193 318,201 356,207 394,212 432,216 508,221"
    fill="none" stroke="#e2903a" stroke-width="2.5"/>
  <text x="130" y="45" font-size="12" font-weight="bold" fill="#e2903a">enslaved for life: &#163;23 / E</text>

  <!-- marked survival horizons -->
  <circle cx="147" cy="112" r="4.5" fill="#e2903a"/>
  <text x="158" y="108" font-size="11" fill="currentColor">&#163;4.6 per yr at E = 5 (early-century survival)</text>
  <circle cx="432" cy="216" r="4.5" fill="#e2903a"/>
  <text x="428" y="236" font-size="11" fill="currentColor" text-anchor="end">&#163;1.15 per yr at E = 20 (after mid-century)</text>

  <!-- crossover -->
  <line x1="251" y1="184" x2="251" y2="250" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5"/>
  <circle cx="251" cy="184" r="4.5" fill="currentColor"/>
  <text x="259" y="165" font-size="12" font-weight="bold" fill="currentColor">break-even: E &#8776; 10 yr</text>
</svg>

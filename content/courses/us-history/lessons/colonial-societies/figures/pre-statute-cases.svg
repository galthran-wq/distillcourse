<svg viewBox="0 0 640 235" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- case 1: Anthony Johnson -->
  <rect x="12" y="30" width="142" height="160" rx="6" fill="none" stroke="currentColor" opacity="0.6"/>
  <text x="24" y="52" font-size="12" font-weight="bold" fill="currentColor">Anthony Johnson</text>
  <text x="24" y="68" font-size="11" fill="currentColor" opacity="0.55">arrived 1621</text>
  <text x="24" y="92" font-size="11" fill="currentColor">bound on a Virginia</text>
  <text x="24" y="107" font-size="11" fill="currentColor">plantation; free by</text>
  <text x="24" y="122" font-size="11" fill="currentColor">mid-century, owning</text>
  <text x="24" y="137" font-size="11" fill="currentColor">250 acres</text>
  <text x="24" y="176" font-size="12" font-weight="bold" fill="#4c8dd6">out: term ended</text>

  <!-- case 2: John Punch -->
  <rect x="170" y="30" width="142" height="160" rx="6" fill="none" stroke="currentColor" opacity="0.6"/>
  <text x="182" y="52" font-size="12" font-weight="bold" fill="currentColor">John Punch</text>
  <text x="182" y="68" font-size="11" fill="currentColor" opacity="0.55">runaway case, 1640</text>
  <text x="182" y="92" font-size="11" fill="currentColor">two European co-</text>
  <text x="182" y="107" font-size="11" fill="currentColor">runaways get added</text>
  <text x="182" y="122" font-size="11" fill="currentColor">years; Punch serves</text>
  <text x="182" y="137" font-size="11" fill="currentColor">for "his natural Life"</text>
  <text x="182" y="176" font-size="12" font-weight="bold" fill="#e2903a">out: none</text>

  <!-- case 3: Johnson v. Casor -->
  <rect x="328" y="30" width="142" height="160" rx="6" fill="none" stroke="currentColor" opacity="0.6"/>
  <text x="340" y="52" font-size="12" font-weight="bold" fill="currentColor">Johnson v. Casor</text>
  <text x="340" y="68" font-size="11" fill="currentColor" opacity="0.55">lawsuit, 1655</text>
  <text x="340" y="92" font-size="11" fill="currentColor">court confirms</text>
  <text x="340" y="107" font-size="11" fill="currentColor">Johnson's lifetime</text>
  <text x="340" y="122" font-size="11" fill="currentColor">claim to laborer</text>
  <text x="340" y="137" font-size="11" fill="currentColor">John Casor</text>
  <text x="340" y="176" font-size="12" font-weight="bold" fill="#e2903a">out: none, for Casor</text>

  <!-- case 4: Elizabeth Key -->
  <rect x="486" y="30" width="142" height="160" rx="6" fill="none" stroke="currentColor" opacity="0.6"/>
  <text x="498" y="52" font-size="12" font-weight="bold" fill="currentColor">Elizabeth Key</text>
  <text x="498" y="68" font-size="11" fill="currentColor" opacity="0.55">freedom suit, 1656</text>
  <text x="498" y="92" font-size="11" fill="currentColor">sues and wins her</text>
  <text x="498" y="107" font-size="11" fill="currentColor">freedom on three</text>
  <text x="498" y="122" font-size="11" fill="currentColor">grounds</text>
  <text x="498" y="161" font-size="12" font-weight="bold" fill="#4c8dd6">out: free father,</text>
  <text x="498" y="176" font-size="12" font-weight="bold" fill="#4c8dd6">baptism, term done</text>

  <!-- legend -->
  <rect x="12" y="207" width="10" height="10" rx="2" fill="#4c8dd6"/>
  <text x="28" y="216" font-size="11" fill="currentColor">left bondage through a door the law left open</text>
  <rect x="330" y="207" width="10" height="10" rx="2" fill="#e2903a"/>
  <text x="346" y="216" font-size="11" fill="currentColor">held for life, without a statute</text>
</svg>

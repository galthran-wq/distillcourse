<svg viewBox="0 0 640 344" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- ===== 1662 card ===== -->
  <rect x="16" y="16" width="608" height="104" rx="6" fill="none" stroke="currentColor" opacity="0.7"/>
  <rect x="32" y="30" width="56" height="24" rx="4" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <text x="60" y="47" font-size="13" font-weight="bold" fill="#e2903a" text-anchor="middle">1662</text>
  <text x="100" y="47" font-size="13" font-weight="bold" fill="currentColor">heredity: partus sequitur ventrem</text>

  <text x="32" y="78" font-size="12" fill="currentColor">&#8220;all children borne in this country shalbe held bond or free only</text>
  <text x="32" y="96" font-size="12" fill="currentColor"><tspan font-weight="bold" fill="#e2903a">according to the condition of the mother</tspan>&#8221;</text>

  <text x="420" y="78" font-size="11" fill="currentColor" opacity="0.55">the free-father exit closes: every child</text>
  <text x="420" y="93" font-size="11" fill="currentColor" opacity="0.55">of an enslaved mother is the owner's</text>
  <text x="420" y="108" font-size="11" fill="currentColor" opacity="0.55">asset, whoever the father</text>

  <!-- ===== connector: the intermediate rungs ===== -->
  <line x1="48" y1="120" x2="48" y2="216" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5"/>
  <circle cx="48" cy="150" r="4" fill="currentColor" opacity="0.55"/>
  <text x="64" y="147" font-size="11" fill="currentColor"><tspan font-weight="bold">1667</tspan><tspan opacity="0.55"> &#8212; baptism &#8220;doth not alter the condition&#8221; of bondage: the religion exit closes</tspan></text>
  <circle cx="48" cy="184" r="4" fill="currentColor" opacity="0.55"/>
  <text x="64" y="181" font-size="11" fill="currentColor"><tspan font-weight="bold">1691</tspan><tspan opacity="0.55"> &#8212; manumission only with deportation within six months: the owner's-grant exit closes</tspan></text>

  <!-- ===== 1705 card ===== -->
  <rect x="16" y="222" width="608" height="106" rx="6" fill="none" stroke="currentColor" opacity="0.7"/>
  <rect x="32" y="236" width="56" height="24" rx="4" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <text x="60" y="253" font-size="13" font-weight="bold" fill="#e2903a" text-anchor="middle">1705</text>
  <text x="100" y="253" font-size="13" font-weight="bold" fill="currentColor">consolidation: &#8220;an act concerning Servants and Slaves&#8221;</text>

  <text x="32" y="280" font-size="12" fill="currentColor">imports &#8220;who were not christians in their native country &#8230;</text>
  <text x="32" y="298" font-size="12" fill="currentColor"><tspan font-weight="bold" fill="#e2903a">shall be accounted and be slaves</tspan>&#8221;</text>
  <text x="32" y="316" font-size="11" fill="currentColor" opacity="0.55">a companion act of the same session classes slaves as real estate</text>

  <text x="440" y="280" font-size="11" fill="currentColor" opacity="0.55">the whole in one code: no term,</text>
  <text x="440" y="295" font-size="11" fill="currentColor" opacity="0.55">no exit, status fixed at purchase,</text>
  <text x="440" y="310" font-size="11" fill="currentColor" opacity="0.55">inherited like land</text>
</svg>

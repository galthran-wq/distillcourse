<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- timeline rail -->
  <line x1="68" y1="70" x2="68" y2="272" stroke="currentColor" opacity="0.4"/>
  <text x="16" y="88" font-size="13" font-weight="bold" fill="#e2903a">1662</text>
  <circle cx="68" cy="84" r="6" fill="#e2903a"/>
  <text x="16" y="152" font-size="13" fill="currentColor" opacity="0.5">1667</text>
  <circle cx="68" cy="148" r="6" fill="none" stroke="currentColor" opacity="0.4"/>
  <text x="16" y="216" font-size="13" fill="currentColor" opacity="0.5">1691</text>
  <circle cx="68" cy="212" r="6" fill="none" stroke="currentColor" opacity="0.4"/>
  <text x="16" y="280" font-size="13" fill="currentColor" opacity="0.5">1705</text>
  <circle cx="68" cy="276" r="6" fill="none" stroke="currentColor" opacity="0.4"/>

  <!-- accumulating panel -->
  <text x="120" y="44" font-size="13" font-weight="bold" fill="currentColor">What Virginia law now says</text>
  <rect x="120" y="56" width="504" height="240" rx="6" fill="none" stroke="currentColor" opacity="0.35"/>

  <text x="134" y="86" font-size="12" font-weight="bold" fill="#e2903a">1662 &#183; children are "bond or free only according to the condition of the mother"</text>
  <text x="134" y="104" font-size="11" fill="currentColor" opacity="0.55">slavery now passes from mother to child: hereditary</text>
</svg>

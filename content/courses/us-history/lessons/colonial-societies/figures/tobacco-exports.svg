<svg viewBox="0 0 480 250" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="70" y="24" font-size="11" fill="currentColor" opacity="0.55">pounds of tobacco shipped from the Chesapeake, log scale</text>

  <!-- log-scale gridlines -->
  <line x1="70" y1="205" x2="450" y2="205" stroke="currentColor" opacity="0.4"/>
  <line x1="70" y1="139" x2="450" y2="139" stroke="currentColor" stroke-dasharray="3 3" opacity="0.3"/>
  <line x1="70" y1="73" x2="450" y2="73" stroke="currentColor" stroke-dasharray="3 3" opacity="0.3"/>
  <text x="62" y="209" font-size="11" fill="currentColor" opacity="0.55" text-anchor="end">10&#179; lb</text>
  <text x="62" y="143" font-size="11" fill="currentColor" opacity="0.55" text-anchor="end">10&#8309; lb</text>
  <text x="62" y="77" font-size="11" fill="currentColor" opacity="0.55" text-anchor="end">10&#8311; lb</text>

  <!-- year ticks -->
  <line x1="90" y1="205" x2="90" y2="211" stroke="currentColor" opacity="0.4"/>
  <line x1="150" y1="205" x2="150" y2="211" stroke="currentColor" opacity="0.4"/>
  <line x1="430" y1="205" x2="430" y2="211" stroke="currentColor" opacity="0.4"/>
  <text x="90" y="227" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">1615</text>
  <text x="150" y="227" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">1630</text>
  <text x="430" y="227" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">1700</text>

  <!-- export curve -->
  <polyline points="90,193 150,100 430,62" fill="none" stroke="#e2903a" stroke-width="2.5"/>
  <circle cx="90" cy="193" r="4" fill="#e2903a"/>
  <circle cx="150" cy="100" r="4" fill="#e2903a"/>
  <circle cx="430" cy="62" r="4" fill="#e2903a"/>

  <text x="102" y="188" font-size="12" font-weight="bold" fill="#e2903a">2,300 lb</text>
  <text x="158" y="122" font-size="12" font-weight="bold" fill="#e2903a">&#8776;1.5 million lb</text>
  <text x="418" y="50" font-size="12" font-weight="bold" fill="#e2903a" text-anchor="end">&#8776;22 million lb</text>
</svg>

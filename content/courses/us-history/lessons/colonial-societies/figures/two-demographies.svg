<svg viewBox="0 0 640 310" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- panel divider -->
  <line x1="320" y1="14" x2="320" y2="286" stroke="currentColor" stroke-dasharray="3 3" opacity="0.35"/>

  <!-- ===== LEFT PANEL: Chesapeake ===== -->
  <text x="16" y="26" font-size="14" font-weight="bold" fill="currentColor">Chesapeake, c. 1650</text>

  <text x="16" y="52" font-size="11" fill="currentColor" opacity="0.55">migrants arriving, per one woman</text>
  <text x="16" y="76" font-size="12" fill="#e2903a" font-weight="bold">men</text>
  <rect x="62" y="64" width="180" height="15" rx="3" fill="#e2903a"/>
  <text x="248" y="76" font-size="12" fill="currentColor">&#8776;4</text>
  <text x="16" y="100" font-size="12" fill="#4c8dd6" font-weight="bold">women</text>
  <rect x="62" y="88" width="45" height="15" rx="3" fill="#4c8dd6"/>
  <text x="113" y="100" font-size="12" fill="currentColor">1</text>

  <text x="16" y="148" font-size="11" fill="currentColor" opacity="0.55">a man alive at 20 could expect to reach about</text>
  <line x1="40" y1="172" x2="280" y2="172" stroke="currentColor" opacity="0.4"/>
  <line x1="40" y1="167" x2="40" y2="177" stroke="currentColor" opacity="0.4"/>
  <line x1="280" y1="167" x2="280" y2="177" stroke="currentColor" opacity="0.4"/>
  <text x="34" y="192" font-size="11" fill="currentColor" opacity="0.55">20</text>
  <text x="270" y="192" font-size="11" fill="currentColor" opacity="0.55">80</text>
  <circle cx="140" cy="172" r="5" fill="#e2903a"/>
  <text x="132" y="160" font-size="12" font-weight="bold" fill="#e2903a">45</text>

  <text x="16" y="232" font-size="11" fill="currentColor" opacity="0.55">the century's tally</text>
  <text x="16" y="252" font-size="12" fill="currentColor">&#8776;120,000 migrants arrive &#8594;</text>
  <text x="16" y="270" font-size="12" font-weight="bold" fill="currentColor">&#8776;90,000 colonists in 1700</text>

  <!-- ===== RIGHT PANEL: New England ===== -->
  <text x="340" y="26" font-size="14" font-weight="bold" fill="currentColor">New England, c. 1650</text>

  <text x="340" y="52" font-size="11" fill="currentColor" opacity="0.55">migrants arriving, per one woman</text>
  <text x="340" y="76" font-size="12" fill="#e2903a" font-weight="bold">men</text>
  <rect x="386" y="64" width="68" height="15" rx="3" fill="#e2903a"/>
  <text x="460" y="76" font-size="12" fill="currentColor">&#8776;1.5</text>
  <text x="340" y="100" font-size="12" fill="#4c8dd6" font-weight="bold">women</text>
  <rect x="386" y="88" width="45" height="15" rx="3" fill="#4c8dd6"/>
  <text x="437" y="100" font-size="12" fill="currentColor">1</text>

  <text x="340" y="148" font-size="11" fill="currentColor" opacity="0.55">a man alive at 20 could expect to reach about</text>
  <line x1="364" y1="172" x2="604" y2="172" stroke="currentColor" opacity="0.4"/>
  <line x1="364" y1="167" x2="364" y2="177" stroke="currentColor" opacity="0.4"/>
  <line x1="604" y1="167" x2="604" y2="177" stroke="currentColor" opacity="0.4"/>
  <text x="358" y="192" font-size="11" fill="currentColor" opacity="0.55">20</text>
  <text x="594" y="192" font-size="11" fill="currentColor" opacity="0.55">80</text>
  <circle cx="564" cy="172" r="5" fill="#e2903a"/>
  <text x="556" y="160" font-size="12" font-weight="bold" fill="#e2903a">70</text>

  <text x="340" y="232" font-size="11" fill="currentColor" opacity="0.55">the century's tally</text>
  <text x="340" y="252" font-size="12" fill="currentColor">&#8776;21,000 migrants arrive by 1642 &#8594;</text>
  <text x="340" y="270" font-size="12" font-weight="bold" fill="currentColor">&#8776;91,000 colonists in 1700</text>
</svg>

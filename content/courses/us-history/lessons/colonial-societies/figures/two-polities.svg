<svg viewBox="0 0 640 428" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- panel divider -->
  <line x1="320" y1="14" x2="320" y2="336" stroke="currentColor" stroke-dasharray="3 3" opacity="0.35"/>

  <!-- ===== LEFT: VIRGINIA ===== -->
  <text x="40" y="28" font-size="14" font-weight="bold" fill="currentColor">Virginia</text>
  <text x="110" y="28" font-size="11" fill="currentColor" opacity="0.55">royal colony from 1624</text>

  <!-- Crown -->
  <rect x="40" y="40" width="240" height="22" rx="4" fill="none" stroke="currentColor" opacity="0.5"/>
  <text x="160" y="55" font-size="12" fill="currentColor" opacity="0.7" text-anchor="middle">the Crown</text>

  <!-- appoint arrow (left edge) -->
  <path d="M 30 46 L 30 92 M 25 87 L 30 93 L 35 87" stroke="#4c8dd6" stroke-width="2" fill="none"/>
  <text x="20" y="80" font-size="10" fill="#4c8dd6" transform="rotate(-90 20 80)" text-anchor="middle">appoints</text>

  <!-- governor + council -->
  <rect x="40" y="78" width="112" height="38" rx="4" fill="none" stroke="#4c8dd6"/>
  <text x="96" y="94" font-size="12" fill="currentColor" text-anchor="middle">royal governor</text>
  <text x="96" y="108" font-size="10" fill="#4c8dd6" text-anchor="middle">appointed</text>
  <rect x="164" y="78" width="116" height="38" rx="4" fill="none" stroke="#4c8dd6"/>
  <text x="222" y="94" font-size="12" fill="currentColor" text-anchor="middle">Council: 12 planters</text>
  <text x="222" y="108" font-size="10" fill="#4c8dd6" text-anchor="middle">appointed for life</text>

  <!-- Burgesses -->
  <rect x="40" y="132" width="240" height="38" rx="4" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <text x="160" y="148" font-size="12" font-weight="bold" fill="currentColor" text-anchor="middle">House of Burgesses</text>
  <text x="160" y="162" font-size="10" fill="#e2903a" text-anchor="middle">elected, from 1619</text>

  <!-- county tier -->
  <rect x="40" y="186" width="240" height="52" rx="4" fill="none" stroke="#4c8dd6"/>
  <text x="160" y="203" font-size="12" fill="currentColor" text-anchor="middle">county court: justices, appointed</text>
  <text x="160" y="218" font-size="12" fill="currentColor" text-anchor="middle">parish vestry: self-perpetuating</text>
  <text x="160" y="232" font-size="10" fill="#4c8dd6" text-anchor="middle">the gentry, not the voters</text>

  <!-- appoint arrow gov -> county (right edge) -->
  <path d="M 290 116 L 290 184 M 285 179 L 290 185 L 295 179" stroke="#4c8dd6" stroke-width="2" fill="none"/>

  <!-- elect arrow base -> Burgesses (left edge) -->
  <path d="M 30 252 L 30 172 M 25 178 L 30 171 L 35 178" stroke="#e2903a" stroke-width="2" fill="none"/>
  <text x="20" y="214" font-size="10" fill="#e2903a" transform="rotate(-90 20 214)" text-anchor="middle">elect</text>

  <!-- franchise base -->
  <rect x="40" y="254" width="240" height="56" rx="4" fill="none" stroke="currentColor" stroke-dasharray="4 3" opacity="0.7"/>
  <text x="160" y="271" font-size="12" font-weight="bold" fill="currentColor" text-anchor="middle">voters: white male freeholders</text>
  <text x="160" y="286" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">out: women, servants, the enslaved;</text>
  <text x="160" y="299" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">free Black men barred by act, 1723</text>

  <text x="160" y="330" font-size="11" fill="#e2903a" text-anchor="middle">participation: a vote for two burgesses</text>

  <!-- ===== RIGHT: MASSACHUSETTS ===== -->
  <text x="360" y="28" font-size="14" font-weight="bold" fill="currentColor">Massachusetts</text>
  <text x="470" y="28" font-size="11" fill="currentColor" opacity="0.55">charter colony</text>

  <!-- Crown -->
  <rect x="360" y="40" width="240" height="22" rx="4" fill="none" stroke="currentColor" opacity="0.5"/>
  <text x="480" y="55" font-size="12" fill="currentColor" opacity="0.7" text-anchor="middle">the Crown: royal charter, 1691</text>

  <!-- appoint arrow -->
  <path d="M 350 46 L 350 92 M 345 87 L 350 93 L 355 87" stroke="#4c8dd6" stroke-width="2" fill="none"/>

  <!-- governor -->
  <rect x="360" y="78" width="240" height="38" rx="4" fill="none" stroke="#4c8dd6"/>
  <text x="480" y="94" font-size="12" fill="currentColor" text-anchor="middle">governor</text>
  <text x="480" y="108" font-size="10" fill="#4c8dd6" text-anchor="middle">elected by freemen to 1691, then appointed</text>

  <!-- General Court -->
  <rect x="360" y="132" width="240" height="38" rx="4" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <text x="480" y="148" font-size="12" font-weight="bold" fill="currentColor" text-anchor="middle">General Court</text>
  <text x="480" y="162" font-size="10" fill="#e2903a" text-anchor="middle">deputies elected by every town, from 1634</text>

  <!-- town meeting -->
  <rect x="360" y="186" width="240" height="52" rx="4" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <text x="480" y="203" font-size="12" font-weight="bold" fill="currentColor" text-anchor="middle">town meeting</text>
  <text x="480" y="218" font-size="12" fill="currentColor" text-anchor="middle">elects selectmen; votes land,</text>
  <text x="480" y="232" font-size="12" fill="currentColor" text-anchor="middle">rates, minister, school</text>

  <!-- send deputies arrow (right edge) -->
  <path d="M 610 184 L 610 172 M 605 178 L 610 171 L 615 178" stroke="#e2903a" stroke-width="2" fill="none"/>

  <!-- attend arrow base -> town meeting (left edge) -->
  <path d="M 350 252 L 350 240 M 345 246 L 350 239 L 355 246" stroke="#e2903a" stroke-width="2" fill="none"/>

  <!-- franchise base -->
  <rect x="360" y="254" width="240" height="56" rx="4" fill="none" stroke="currentColor" stroke-dasharray="4 3" opacity="0.7"/>
  <text x="480" y="271" font-size="12" font-weight="bold" fill="currentColor" text-anchor="middle">town: male householders</text>
  <text x="480" y="286" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">colony vote: church members to 1691, then property;</text>
  <text x="480" y="299" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">out: women, servants, the unadmitted</text>

  <text x="480" y="330" font-size="11" fill="#e2903a" text-anchor="middle">participation: direct, several meetings a year</text>

  <!-- shared takeaway + legend -->
  <line x1="16" y1="348" x2="624" y2="348" stroke="currentColor" opacity="0.25"/>
  <text x="320" y="372" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">both self-governing by London's standards</text>
  <text x="320" y="390" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">the changed variable: who participates, and at what level</text>
  <rect x="204" y="402" width="10" height="10" rx="2" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <text x="220" y="411" font-size="11" fill="currentColor">chosen from below</text>
  <rect x="340" y="402" width="10" height="10" rx="2" fill="none" stroke="#4c8dd6" stroke-width="1.5"/>
  <text x="356" y="411" font-size="11" fill="currentColor">appointed from above</text>
</svg>

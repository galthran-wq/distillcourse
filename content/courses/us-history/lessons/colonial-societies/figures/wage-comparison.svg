<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- panel divider -->
  <line x1="320" y1="14" x2="320" y2="252" stroke="currentColor" stroke-dasharray="3 3" opacity="0.35"/>

  <!-- ===== LEFT PANEL: colonies ===== -->
  <text x="16" y="26" font-size="14" font-weight="bold" fill="currentColor">British North America, c. 1774</text>

  <text x="16" y="50" font-size="11" fill="currentColor" opacity="0.55">acres per pair of hands</text>
  <rect x="16" y="58" width="210" height="14" rx="3" fill="#4c8dd6"/>
  <text x="232" y="70" font-size="12" fill="currentColor">many</text>

  <text x="16" y="106" font-size="11" fill="currentColor" opacity="0.55">what that ratio does to the two prices</text>

  <!-- land price: down -->
  <path d="M 22 124 L 22 140 M 17 135 L 22 141 L 27 135" stroke="#4c8dd6" stroke-width="2" fill="none"/>
  <text x="38" y="130" font-size="12" font-weight="bold" fill="#4c8dd6">an acre of land: cheap</text>
  <text x="38" y="146" font-size="11" fill="currentColor" opacity="0.55">50 acres came free with each person imported</text>

  <!-- labor price: up -->
  <path d="M 22 200 L 22 184 M 17 189 L 22 183 L 27 189" stroke="#e2903a" stroke-width="2" fill="none"/>
  <text x="38" y="190" font-size="12" font-weight="bold" fill="#e2903a">a day's labor: dear</text>
  <text x="38" y="206" font-size="11" fill="currentColor" opacity="0.55">ordinary households out-bought their English</text>
  <text x="38" y="220" font-size="11" fill="currentColor" opacity="0.55">counterparts at every rank but the top few</text>

  <!-- ===== RIGHT PANEL: England ===== -->
  <text x="340" y="26" font-size="14" font-weight="bold" fill="currentColor">England &amp; Wales, c. 1774</text>

  <text x="340" y="50" font-size="11" fill="currentColor" opacity="0.55">acres per pair of hands</text>
  <rect x="340" y="58" width="34" height="14" rx="3" fill="#4c8dd6"/>
  <text x="380" y="70" font-size="12" fill="currentColor">few</text>

  <text x="340" y="106" font-size="11" fill="currentColor" opacity="0.55">what that ratio does to the two prices</text>

  <!-- land price: up -->
  <path d="M 346 140 L 346 124 M 341 129 L 346 123 L 351 129" stroke="#4c8dd6" stroke-width="2" fill="none"/>
  <text x="362" y="130" font-size="12" font-weight="bold" fill="#4c8dd6">an acre of land: dear</text>
  <text x="362" y="146" font-size="11" fill="currentColor" opacity="0.55">an acre cost decades of its yearly rent</text>

  <!-- labor price: down -->
  <path d="M 346 184 L 346 200 M 341 195 L 346 201 L 351 195" stroke="#e2903a" stroke-width="2" fill="none"/>
  <text x="362" y="190" font-size="12" font-weight="bold" fill="#e2903a">a day's labor: cheap</text>
  <text x="362" y="206" font-size="11" fill="currentColor" opacity="0.55">the wage the migrants left behind</text>

  <!-- shared takeaway -->
  <line x1="16" y1="266" x2="624" y2="266" stroke="currentColor" opacity="0.25"/>
  <text x="320" y="292" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">one ratio, two prices</text>
  <text x="320" y="312" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">read by a free worker: the world's best ordinary earnings &#183; read by a planter: labor worth buying and binding</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 330" font-family="system-ui, sans-serif" font-size="12">
  <!-- headers -->
  <text x="24" y="26" font-size="13" font-weight="bold" fill="currentColor">a government needs to&#8230;</text>
  <text x="250" y="26" font-size="13" font-weight="bold" fill="#4c8dd6">Articles (1781)</text>
  <text x="440" y="26" font-size="13" font-weight="bold" fill="#e2903a">Constitution (1787)</text>
  <line x1="24" y1="38" x2="596" y2="38" stroke="currentColor" opacity="0.35"/>

  <!-- row 1: revenue -->
  <text x="24" y="62" fill="currentColor" font-weight="bold">raise revenue</text>
  <text x="250" y="62" fill="#4c8dd6">requisitions only &#8212;</text>
  <text x="250" y="77" fill="#4c8dd6">states pay, or don&#8217;t</text>
  <text x="440" y="62" fill="currentColor">taxes on individuals</text>
  <text x="440" y="77" fill="currentColor" opacity="0.55" font-size="11">Art. I &#167;8</text>
  <line x1="24" y1="88" x2="596" y2="88" stroke="currentColor" opacity="0.15"/>

  <!-- row 2: commerce -->
  <text x="24" y="112" fill="currentColor" font-weight="bold">regulate commerce</text>
  <text x="250" y="112" fill="#4c8dd6">no &#8212; states tax</text>
  <text x="250" y="127" fill="#4c8dd6">each other&#8217;s trade</text>
  <text x="440" y="112" fill="currentColor">interstate and foreign</text>
  <text x="440" y="127" fill="currentColor" opacity="0.55" font-size="11">Art. I &#167;8</text>
  <line x1="24" y1="138" x2="596" y2="138" stroke="currentColor" opacity="0.15"/>

  <!-- row 3: execute / adjudicate -->
  <text x="24" y="162" fill="currentColor" font-weight="bold">execute and adjudicate</text>
  <text x="250" y="162" fill="#4c8dd6">no executive,</text>
  <text x="250" y="177" fill="#4c8dd6">no courts</text>
  <text x="440" y="162" fill="currentColor">president; federal courts</text>
  <text x="440" y="177" fill="currentColor" opacity="0.55" font-size="11">Arts. II, III</text>
  <line x1="24" y1="188" x2="596" y2="188" stroke="currentColor" opacity="0.15"/>

  <!-- row 4: bind individuals -->
  <text x="24" y="212" fill="currentColor" font-weight="bold">bind individuals</text>
  <text x="250" y="212" fill="#4c8dd6">acts only on states,</text>
  <text x="250" y="227" fill="#4c8dd6">which it cannot compel</text>
  <text x="440" y="212" fill="currentColor">supreme law, reaching</text>
  <text x="440" y="227" fill="currentColor">persons directly</text>
  <line x1="24" y1="238" x2="596" y2="238" stroke="currentColor" opacity="0.15"/>

  <!-- row 5: amend (highlighted) -->
  <rect x="18" y="246" width="578" height="42" rx="5" fill="#e2903a" opacity="0.12"/>
  <rect x="18" y="246" width="578" height="42" rx="5" fill="none" stroke="#e2903a"/>
  <text x="24" y="264" fill="#e2903a" font-weight="bold">repair itself</text>
  <text x="250" y="264" fill="#4c8dd6">all 13 states &#8212; the impost</text>
  <text x="250" y="279" fill="#4c8dd6">died at 12&#8211;1, twice</text>
  <text x="440" y="264" fill="currentColor">2/3 propose, 3/4 ratify</text>
  <text x="440" y="279" fill="currentColor" opacity="0.55" font-size="11">Art. V</text>

  <!-- takeaway -->
  <text x="24" y="316" fill="currentColor" opacity="0.55">the last row made the others permanent: defects that cannot be amended away</text>
</svg>

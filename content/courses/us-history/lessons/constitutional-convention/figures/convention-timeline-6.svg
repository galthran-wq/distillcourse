<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 150" font-family="system-ui, sans-serif" font-size="12">
  <!-- axis: May 20 to September 20, 1787 -->
  <line x1="40" y1="88" x2="600" y2="88" stroke="currentColor"/>
  <g stroke="currentColor" opacity="0.4">
    <line x1="93" y1="85" x2="93" y2="91"/>
    <line x1="225" y1="85" x2="225" y2="91"/>
    <line x1="361" y1="85" x2="361" y2="91"/>
    <line x1="498" y1="85" x2="498" y2="91"/>
  </g>
  <text x="93" y="103" text-anchor="middle" fill="currentColor" opacity="0.55" font-size="10">June</text>
  <text x="225" y="103" text-anchor="middle" fill="currentColor" opacity="0.55" font-size="10">July</text>
  <text x="361" y="103" text-anchor="middle" fill="currentColor" opacity="0.55" font-size="10">Aug</text>
  <text x="498" y="103" text-anchor="middle" fill="currentColor" opacity="0.55" font-size="10">Sept</text>
  <circle cx="62" cy="88" r="4" fill="currentColor"/>
  <line x1="62" y1="94" x2="62" y2="112" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5"/>
  <text x="24" y="127" text-anchor="start" fill="currentColor" font-size="11">May 25 &#183; quorum</text>
  <circle cx="80" cy="88" r="4" fill="currentColor"/>
  <line x1="80" y1="50" x2="80" y2="82" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5"/>
  <text x="40" y="42" text-anchor="start" fill="currentColor" font-size="11">May 29 &#183; Virginia Plan</text>
  <circle cx="154" cy="88" r="4" fill="currentColor"/>
  <line x1="154" y1="94" x2="154" y2="112" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5"/>
  <text x="134" y="127" text-anchor="start" fill="currentColor" font-size="11">June 15 &#183; New Jersey Plan</text>
  <circle cx="291" cy="88" r="4" fill="currentColor"/>
  <line x1="291" y1="50" x2="291" y2="82" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5"/>
  <text x="291" y="42" text-anchor="middle" fill="currentColor" font-size="11">July 16 &#183; compromise, 5&#8211;4&#8211;1</text>
  <circle cx="462" cy="88" r="4" fill="currentColor"/>
  <line x1="462" y1="94" x2="462" y2="112" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5"/>
  <text x="462" y="127" text-anchor="middle" fill="currentColor" font-size="11">late Aug &#183; slavery clauses</text>
  <circle cx="568" cy="88" r="4.5" fill="#e2903a"/>
  <line x1="568" y1="50" x2="568" y2="82" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5"/>
  <text x="600" y="42" text-anchor="end" fill="#e2903a" font-weight="bold" font-size="11">Sept 17 &#183; 39 of 55 sign</text>

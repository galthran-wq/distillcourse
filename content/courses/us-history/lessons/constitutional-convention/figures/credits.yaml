  - file: shays-springfield-1787.jpg
    title: "\"Shays's Forces in Massachusetts\" — the attack on the Continental arsenal at Springfield, January 25, 1787"
    credit: "Wood engraving, signed with the interlaced monogram \"W L S\", from R. M. Devens, *Our First Century: Being a Popular Descriptive Portraiture of the One Hundred Great and Memorable Events … in the History of Our Country* (Springfield, Mass.: C. A. Nichols & Co.; Chicago: Hugh Heron, 1878), p. 127. Scanned by the University of Connecticut Libraries for the Internet Archive"
    source_url: "https://archive.org/details/ourfirstcenturyb00deve/page/127/mode/1up"
    license: "public domain (published 1878; the Internet Archive records the volume as not in copyright)"
    retrieved: "2026-08-01"
    located: "Devens, Our First Century, p. 127, the head-of-page engraving; the same block is cataloged by the Library of Congress Prints and Photographs Division as \"Shay's forces in Massachusetts,\" LC-USZ62-59894 (LCCN 2004679901), whose note reads \"Illus. in: Devens, Our First Century, p. 127\""
    modifications: "cropped to the rectangular upper block of the engraving, inside its own printed frame line — the printed caption \"SHAYS'S FORCES IN MASSACHUSETTS.\" and the two columns of body text that the vignette runs into at the foot of the page are cut away; resized to 1400px wide and metadata stripped. Nothing inside the picture was altered, retouched or tonally corrected: the paper tone is the scanned sheet's own"
    background: light
  - file: madison-stuart-1821-convention.jpg
    title: "James Madison"
    credit: "Gilbert Stuart (1755–1828), oil on panel, 65.3 × 54.3 cm, c. 1821; National Gallery of Art, Washington, Ailsa Mellon Bruce Fund, accession 1979.4.2 (NGA object 56914); file obtained via Wikimedia Commons"
    source_url: "https://commons.wikimedia.org/wiki/File:Gilbert_Stuart,_James_Madison,_c._1821,_NGA_56914.jpg"
    license: "public domain — the National Gallery of Art dedicates its reproduction of this work under the Creative Commons CC0 1.0 Universal Public Domain Dedication (NGA Open Access), and the painting itself is out of copyright (Stuart died 1828)"
    retrieved: "2026-07-30"
    located: "the whole panel, from NGA's open-access scan (3388×4000; the working capture is the 1200×1417 derivative) — Madison half-length, powdered hair, black coat and white stock, against a dark ground with a green curtain at the right"
    modifications: "7px of the digitisation's outer edge trimmed on all four sides (the darkened panel border), then downscaled to 1100px wide, metadata stripped and re-encoded as JPEG; nothing inside the picture retouched, removed or enhanced"
    background: none

<svg viewBox="0 0 634 292" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- header row -->
  <text x="102" y="24" font-size="12" font-weight="600" fill="currentColor">Iroquois Grand Council</text>
  <text x="278" y="24" font-size="12" font-weight="600" fill="currentColor">Albany Plan (1754)</text>
  <text x="452" y="24" font-size="12" font-weight="600" fill="currentColor">Articles (1781)</text>
  <line x1="8" y1="34" x2="612" y2="34" stroke="currentColor" stroke-width="1" opacity="0.5"/>

  <!-- row 1: selection -->
  <text x="8" y="56" font-size="11" fill="currentColor" opacity="0.55">selection</text>
  <text x="102" y="56" font-size="12" fill="currentColor">
    <tspan x="102" dy="0">sachems appointed for</tspan>
    <tspan x="102" dy="14">life by designated</tspan>
    <tspan x="102" dy="14">clan families</tspan>
  </text>
  <text x="278" y="56" font-size="12" fill="currentColor">
    <tspan x="278" dy="0">elected by colonial</tspan>
    <tspan x="278" dy="14">assemblies to</tspan>
    <tspan x="278" dy="14">three-year terms</tspan>
  </text>
  <text x="452" y="56" font-size="12" fill="currentColor">
    <tspan x="452" dy="0">delegates named</tspan>
    <tspan x="452" dy="14">annually by state</tspan>
    <tspan x="452" dy="14">legislatures</tspan>
  </text>
  <line x1="8" y1="104" x2="612" y2="104" stroke="currentColor" stroke-width="1" opacity="0.2"/>

  <!-- row 2: apportionment -->
  <text x="8" y="126" font-size="11" fill="currentColor" opacity="0.55">apportionment</text>
  <text x="102" y="126" font-size="12" fill="currentColor">
    <tspan x="102" dy="0">seats fixed per nation —</tspan>
    <tspan x="102" dy="14">never by population</tspan>
  </text>
  <text x="278" y="126" font-size="12" fill="currentColor">
    <tspan x="278" dy="0">seats by contribution</tspan>
    <tspan x="278" dy="14">to the common treasury</tspan>
  </text>
  <text x="452" y="126" font-size="12" fill="currentColor">
    <tspan x="452" dy="0">one state, one vote</tspan>
  </text>
  <line x1="8" y1="160" x2="612" y2="160" stroke="currentColor" stroke-width="1" opacity="0.2"/>

  <!-- row 3: decision rule -->
  <text x="8" y="182" font-size="11" fill="currentColor" opacity="0.55">decision rule</text>
  <text x="102" y="182" font-size="12" font-weight="600" fill="#e2903a">unanimity</text>
  <text x="278" y="182" font-size="12" fill="currentColor">majority</text>
  <text x="452" y="182" font-size="12" fill="currentColor">
    <tspan x="452" dy="0">majority; nine of 13 for</tspan>
    <tspan x="452" dy="14">war, treaties, money —</tspan>
    <tspan x="452" dy="14" font-weight="600" fill="#e2903a">unanimity only to amend</tspan>
  </text>

  <!-- bracket linking the two unanimity cells -->
  <path d="M 130 190 V 240 M 500 218 V 240 M 130 240 H 500" fill="none" stroke="#e2903a" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.8"/>
  <text x="315" y="258" font-size="11.5" fill="#e2903a" text-anchor="middle">the one feature the Articles shared with the Grand Council —</text>
  <text x="315" y="273" font-size="11.5" fill="#e2903a" text-anchor="middle">and the one that killed them</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="system-ui, sans-serif" font-size="12">
  <!-- branch boxes -->
  <rect x="26" y="36" width="190" height="86" rx="6" fill="#e2903a" opacity="0.12"/>
  <rect x="26" y="36" width="190" height="86" rx="6" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <text x="121" y="58" text-anchor="middle" fill="#e2903a" font-weight="bold">Art. I &#8212; Congress</text>
  <text x="121" y="76" text-anchor="middle" fill="currentColor" font-size="11">House + Senate</text>
  <text x="121" y="92" text-anchor="middle" fill="currentColor" font-size="11">tax &#183; commerce &#183; war</text>
  <text x="121" y="108" text-anchor="middle" fill="currentColor" opacity="0.55" font-size="11">10 sections, ~half the text</text>

  <rect x="266" y="46" width="140" height="66" rx="6" fill="none" stroke="currentColor"/>
  <text x="336" y="70" text-anchor="middle" fill="currentColor" font-weight="bold">Art. II</text>
  <text x="336" y="88" text-anchor="middle" fill="currentColor" font-size="11">President</text>

  <rect x="456" y="46" width="150" height="66" rx="6" fill="none" stroke="currentColor"/>
  <text x="531" y="70" text-anchor="middle" fill="currentColor" font-weight="bold">Art. III</text>
  <text x="531" y="88" text-anchor="middle" fill="currentColor" font-size="11">federal courts</text>
  <text x="531" y="128" text-anchor="middle" fill="currentColor" opacity="0.55" font-size="11">tenure during good behavior</text>

  <!-- checks between I and II -->
  <line x1="266" y1="62" x2="224" y2="62" stroke="#4c8dd6" stroke-width="1.5"/>
  <path d="M 220 62 l 8 -4 l 0 8 z" fill="#4c8dd6"/>
  <text x="245" y="52" text-anchor="middle" fill="#4c8dd6" font-size="10.5">veto</text>

  <line x1="222" y1="96" x2="258" y2="96" stroke="#4c8dd6" stroke-width="1.5"/>
  <path d="M 262 96 l -8 -4 l 0 8 z" fill="#4c8dd6"/>
  <line x1="241" y1="102" x2="241" y2="126" stroke="#4c8dd6" stroke-dasharray="3 3" opacity="0.5"/>
  <text x="241" y="140" text-anchor="middle" fill="#4c8dd6" font-size="10.5">override &#183; impeach &#183; Senate consents</text>

  <!-- check between II and III -->
  <line x1="406" y1="79" x2="448" y2="79" stroke="#4c8dd6" stroke-width="1.5"/>
  <path d="M 452 79 l -8 -4 l 0 8 z" fill="#4c8dd6"/>
  <text x="429" y="68" text-anchor="middle" fill="#4c8dd6" font-size="10.5">appoints</text>

  <!-- rails -->
  <text x="26" y="172" fill="currentColor" opacity="0.55" font-size="11">the frame the branches stand on:</text>

  <rect x="26" y="182" width="580" height="26" rx="5" fill="none" stroke="currentColor" opacity="0.6"/>
  <text x="38" y="199" fill="currentColor" font-weight="bold" font-size="11.5">IV</text>
  <text x="62" y="199" fill="currentColor" font-size="11.5">states&#8217; relations &#8212; full faith and credit, privileges, extradition</text>

  <rect x="26" y="214" width="580" height="26" rx="5" fill="#e2903a" opacity="0.12"/>
  <rect x="26" y="214" width="580" height="26" rx="5" fill="none" stroke="#e2903a"/>
  <text x="38" y="231" fill="#e2903a" font-weight="bold" font-size="11.5">V</text>
  <text x="62" y="231" fill="currentColor" font-size="11.5">amendment &#8212; 2/3 propose, 3/4 ratify: the designed escape hatch</text>

  <rect x="26" y="246" width="580" height="26" rx="5" fill="none" stroke="currentColor" opacity="0.6"/>
  <text x="38" y="263" fill="currentColor" font-weight="bold" font-size="11.5">VI</text>
  <text x="62" y="263" fill="currentColor" font-size="11.5">supremacy &#8212; federal law overrides state law and constitutions</text>

  <rect x="26" y="278" width="580" height="26" rx="5" fill="none" stroke="currentColor" opacity="0.6"/>
  <text x="38" y="295" fill="currentColor" font-weight="bold" font-size="11.5">VII</text>
  <text x="62" y="295" fill="currentColor" font-size="11.5">ratification &#8212; conventions of the people in nine states suffice</text>

  <!-- takeaway -->
  <text x="26" y="328" fill="currentColor" opacity="0.55">three armed branches on four structural rails &#8212; the engine is Article I</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300" font-family="system-ui, sans-serif" font-size="12">
  <!-- column headers -->
  <text x="140" y="26" font-size="13" font-weight="bold" fill="currentColor">Virginia 1776</text>
  <text x="300" y="26" font-size="13" font-weight="bold" fill="#4c8dd6">Pennsylvania 1776</text>
  <text x="470" y="26" font-size="13" font-weight="bold" fill="#e2903a">Massachusetts 1780</text>
  <line x1="24" y1="38" x2="596" y2="38" stroke="currentColor" opacity="0.35"/>

  <!-- row 1: suffrage -->
  <text x="24" y="66" fill="currentColor" font-weight="bold">suffrage</text>
  <text x="140" y="66" fill="currentColor">freeholders only</text>
  <text x="140" y="81" fill="currentColor" opacity="0.55" font-size="11">colonial rule kept</text>
  <text x="300" y="66" fill="#4c8dd6">all taxpaying men</text>
  <text x="300" y="81" fill="#4c8dd6" opacity="0.75" font-size="11">broadest in the world</text>
  <text x="470" y="66" fill="currentColor">property test</text>
  <text x="470" y="81" fill="currentColor" opacity="0.55" font-size="11">raised from colonial level</text>
  <line x1="24" y1="94" x2="596" y2="94" stroke="currentColor" opacity="0.15"/>

  <!-- row 2: establishment -->
  <text x="24" y="122" fill="currentColor" font-weight="bold">established</text>
  <text x="24" y="137" fill="currentColor" font-weight="bold">church</text>
  <text x="140" y="122" fill="currentColor">Anglican, dismantled</text>
  <text x="140" y="137" fill="currentColor" opacity="0.55" font-size="11">ends with the 1786 statute</text>
  <text x="300" y="122" fill="#4c8dd6">none</text>
  <text x="300" y="137" fill="#4c8dd6" opacity="0.75" font-size="11">never had one</text>
  <text x="470" y="122" fill="currentColor">town-supported</text>
  <text x="470" y="137" fill="currentColor" opacity="0.55" font-size="11">ministers, until 1833</text>
  <line x1="24" y1="150" x2="596" y2="150" stroke="currentColor" opacity="0.15"/>

  <!-- row 3: executive -->
  <text x="24" y="178" fill="currentColor" font-weight="bold">executive</text>
  <text x="140" y="178" fill="currentColor">chosen by legislature,</text>
  <text x="140" y="193" fill="currentColor">no veto</text>
  <text x="300" y="178" fill="#4c8dd6">no governor &#8212;</text>
  <text x="300" y="193" fill="#4c8dd6">a 12-member council</text>
  <text x="470" y="178" fill="currentColor">elected governor</text>
  <text x="470" y="193" fill="currentColor">with a veto</text>
  <line x1="24" y1="206" x2="596" y2="206" stroke="currentColor" opacity="0.15"/>

  <!-- row 4: constituent procedure (highlighted) -->
  <rect x="18" y="214" width="578" height="42" rx="5" fill="#e2903a" opacity="0.12"/>
  <rect x="18" y="214" width="578" height="42" rx="5" fill="none" stroke="#e2903a"/>
  <text x="24" y="232" fill="#e2903a" font-weight="bold">made by</text>
  <text x="140" y="232" fill="currentColor">sitting convention,</text>
  <text x="140" y="247" fill="currentColor">no popular ratification</text>
  <text x="300" y="232" fill="#4c8dd6">sitting convention,</text>
  <text x="300" y="247" fill="#4c8dd6">no popular ratification</text>
  <text x="470" y="232" fill="currentColor">special convention,</text>
  <text x="470" y="247" fill="currentColor">ratified by the towns</text>

  <!-- takeaway -->
  <text x="24" y="284" fill="currentColor" opacity="0.55">three answers to every question &#8212; and the highlighted row is the procedure Article VII reuses</text>
</svg>

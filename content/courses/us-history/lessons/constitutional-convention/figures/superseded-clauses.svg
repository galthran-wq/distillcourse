<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" font-family="system-ui, sans-serif" font-size="12">
  <!-- headers -->
  <text x="24" y="26" font-size="13" font-weight="bold" fill="currentColor">the 1787 text said&#8230;</text>
  <text x="430" y="26" font-size="13" font-weight="bold" fill="#4c8dd6">superseded by</text>
  <line x1="24" y1="38" x2="596" y2="38" stroke="currentColor" opacity="0.35"/>

  <!-- row 1: three-fifths (slavery, highlighted) -->
  <rect x="18" y="46" width="578" height="34" rx="5" fill="#e2903a" opacity="0.12"/>
  <rect x="18" y="46" width="578" height="34" rx="5" fill="none" stroke="#e2903a"/>
  <text x="24" y="67" fill="#e2903a" font-weight="bold">I &#167;2</text>
  <text x="70" y="67" fill="currentColor">&#8220;three fifths of all other Persons&#8221; counted</text>
  <text x="430" y="67" fill="#4c8dd6" font-weight="bold">14th &#183; 1868</text>
  <line x1="24" y1="88" x2="596" y2="88" stroke="currentColor" opacity="0"/>

  <!-- row 2: Senate election -->
  <text x="24" y="107" fill="currentColor" font-weight="bold">I &#167;3</text>
  <text x="70" y="107" fill="currentColor">senators chosen by state legislatures</text>
  <text x="430" y="107" fill="#4c8dd6" font-weight="bold">17th &#183; 1913</text>
  <line x1="24" y1="118" x2="596" y2="118" stroke="currentColor" opacity="0.15"/>

  <!-- row 3: direct taxes -->
  <text x="24" y="139" fill="currentColor" font-weight="bold">I &#167;9</text>
  <text x="70" y="139" fill="currentColor">direct taxes only in proportion to the census</text>
  <text x="430" y="139" fill="#4c8dd6" font-weight="bold">16th &#183; 1913</text>
  <line x1="24" y1="150" x2="596" y2="150" stroke="currentColor" opacity="0.15"/>

  <!-- row 4: electoral tie -->
  <text x="24" y="171" fill="currentColor" font-weight="bold">II &#167;1</text>
  <text x="70" y="171" fill="currentColor">electors&#8217; runner-up becomes vice president</text>
  <text x="430" y="171" fill="#4c8dd6" font-weight="bold">12th &#183; 1804</text>
  <line x1="24" y1="182" x2="596" y2="182" stroke="currentColor" opacity="0.15"/>

  <!-- row 5: succession -->
  <text x="24" y="203" fill="currentColor" font-weight="bold">II &#167;1</text>
  <text x="70" y="203" fill="currentColor">succession on death or inability left undefined</text>
  <text x="430" y="203" fill="#4c8dd6" font-weight="bold">25th &#183; 1967</text>
  <line x1="24" y1="214" x2="596" y2="214" stroke="currentColor" opacity="0.15"/>

  <!-- row 6: sovereign immunity -->
  <text x="24" y="235" fill="currentColor" font-weight="bold">III &#167;2</text>
  <text x="70" y="235" fill="currentColor">suits against a state by outside citizens allowed</text>
  <text x="430" y="235" fill="#4c8dd6" font-weight="bold">11th &#183; 1795</text>
  <line x1="24" y1="246" x2="596" y2="246" stroke="currentColor" opacity="0.15"/>

  <!-- row 7: fugitive slave (slavery, highlighted) -->
  <rect x="18" y="254" width="578" height="34" rx="5" fill="#e2903a" opacity="0.12"/>
  <rect x="18" y="254" width="578" height="34" rx="5" fill="none" stroke="#e2903a"/>
  <text x="24" y="275" fill="#e2903a" font-weight="bold">IV &#167;2</text>
  <text x="70" y="275" fill="currentColor">escaped &#8220;Person held to Service or Labour&#8221; delivered up</text>
  <text x="430" y="275" fill="#4c8dd6" font-weight="bold">13th &#183; 1865</text>

  <line x1="24" y1="304" x2="596" y2="304" stroke="currentColor" opacity="0.35"/>

  <!-- takeaway -->
  <text x="24" y="330" fill="currentColor" opacity="0.55">seven clauses of the original text, struck or replaced through Article V&#8217;s own procedure;</text>
  <text x="24" y="346" fill="currentColor" opacity="0.55">the highlighted slavery clauses were both dead by 1868. Idea from the National Archives&#8217;</text>
  <text x="24" y="362" fill="currentColor" opacity="0.55">annotated transcript, which brackets every superseded passage.</text>
</svg>

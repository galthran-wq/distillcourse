<svg viewBox="0 0 600 235" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="170" y="22" font-size="13" font-weight="600" fill="currentColor">Slaveholding states&#8217; seats in the House, apportionment of 1793</text>

  <!-- whole-House guide at 105 seats -->
  <line x1="569" y1="40" x2="569" y2="168" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5"/>
  <text x="569" y="182" font-size="11" fill="currentColor" opacity="0.55" text-anchor="end">whole House: 105 seats</text>

  <!-- bar 1: with the three-fifths clause -->
  <text x="160" y="72" font-size="12" fill="currentColor" text-anchor="end">counting 3/5</text>
  <text x="160" y="87" font-size="12" fill="currentColor" text-anchor="end">of the enslaved</text>
  <rect x="170" y="60" width="125.4" height="30" rx="3" fill="#4c8dd6"/>
  <rect x="295.4" y="60" width="53.2" height="30" rx="3" fill="#e2903a"/>
  <text x="357" y="80" font-size="13" font-weight="600" fill="currentColor">47</text>

  <!-- bonus callout -->
  <path d="M 322 92 L 322 104 L 348 104" stroke="#e2903a" fill="none"/>
  <text x="354" y="108" font-size="12" fill="#e2903a">+14 seats: the three-fifths bonus</text>

  <!-- bar 2: free population only -->
  <text x="160" y="142" font-size="12" fill="currentColor" text-anchor="end">counting free</text>
  <text x="160" y="157" font-size="12" fill="currentColor" text-anchor="end">population only</text>
  <rect x="170" y="130" width="125.4" height="30" rx="3" fill="#4c8dd6"/>
  <text x="303" y="150" font-size="13" font-weight="600" fill="currentColor">33</text>

  <!-- consequence note -->
  <text x="170" y="205" font-size="11" fill="currentColor" opacity="0.55">Every House seat is also an electoral vote: the 14-seat bonus entered</text>
  <text x="170" y="220" font-size="11" fill="currentColor" opacity="0.55">each presidential election until the Civil War.</text>
</svg>

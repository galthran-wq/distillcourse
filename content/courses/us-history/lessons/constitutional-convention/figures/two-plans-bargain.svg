<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" font-family="system-ui, sans-serif" font-size="12">
  <!-- panel 1: Virginia Plan (top left) -->
  <text x="30" y="26" font-size="13" font-weight="bold" fill="currentColor">Virginia Plan &#183; May 29</text>
  <rect x="30" y="36" width="155" height="30" rx="5" fill="none" stroke="currentColor"/>
  <text x="107" y="55" text-anchor="middle" fill="currentColor" font-size="11">upper house &#183; proportional</text>
  <rect x="30" y="72" width="155" height="30" rx="5" fill="none" stroke="currentColor"/>
  <text x="107" y="91" text-anchor="middle" fill="currentColor" font-size="11">lower house &#183; proportional</text>
  <text x="30" y="120" fill="currentColor" opacity="0.55" font-size="11">+ national veto over state laws</text>

  <!-- panel 2: New Jersey Plan (bottom left) -->
  <text x="30" y="162" font-size="13" font-weight="bold" fill="#4c8dd6">New Jersey Plan &#183; June 15</text>
  <rect x="30" y="172" width="155" height="38" rx="5" fill="none" stroke="#4c8dd6"/>
  <text x="107" y="188" text-anchor="middle" fill="#4c8dd6" font-size="11">one house</text>
  <text x="107" y="202" text-anchor="middle" fill="#4c8dd6" font-size="11">one state, one vote</text>
  <text x="30" y="228" fill="#4c8dd6" opacity="0.8" font-size="11">+ taxes, commerce, supremacy</text>

  <!-- merge arrows -->
  <path d="M 192 69 L 250 69 L 250 125" fill="none" stroke="currentColor" opacity="0.5"/>
  <path d="M 192 191 L 250 191 L 250 145" fill="none" stroke="currentColor" opacity="0.5"/>
  <line x1="250" y1="132" x2="296" y2="132" stroke="currentColor" stroke-width="2"/>
  <path d="M 300 132 l -8 -4.5 l 0 9 z" fill="currentColor"/>

  <!-- panel 3: the trade (right) -->
  <text x="316" y="52" font-size="13" font-weight="bold" fill="#e2903a">the trade &#183; July 16</text>
  <rect x="316" y="62" width="180" height="36" rx="5" fill="#e2903a" opacity="0.15"/>
  <rect x="316" y="62" width="180" height="36" rx="5" fill="none" stroke="#e2903a"/>
  <text x="406" y="78" text-anchor="middle" fill="#e2903a" font-weight="bold">Senate &#8212; equal</text>
  <text x="406" y="92" text-anchor="middle" fill="#e2903a" font-size="11">two votes per state</text>
  <rect x="316" y="106" width="180" height="36" rx="5" fill="none" stroke="currentColor"/>
  <text x="406" y="122" text-anchor="middle" fill="currentColor">House &#8212; proportional</text>
  <text x="406" y="136" text-anchor="middle" fill="currentColor" opacity="0.55" font-size="11">money bills originate here</text>

  <!-- tally -->
  <text x="516" y="82" fill="#e2903a" font-weight="bold" font-size="12.5">carried 5&#8211;4&#8211;1</text>
  <text x="516" y="98" fill="currentColor" opacity="0.55" font-size="11">Virginia and</text>
  <text x="516" y="112" fill="currentColor" opacity="0.55" font-size="11">Pennsylvania: no</text>

  <!-- takeaway -->
  <line x1="24" y1="240" x2="616" y2="240" stroke="currentColor" opacity="0.2"/>
  <text x="30" y="260" fill="currentColor" opacity="0.55">each side keeps one house; representation was the whole fight &#8212; both plans already granted taxes</text>
</svg>

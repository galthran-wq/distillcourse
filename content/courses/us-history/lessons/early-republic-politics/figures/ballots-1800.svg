<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- top: electoral college -->
  <text x="30" y="26" font-size="12.5" font-weight="bold" fill="currentColor">the electoral count, December 1800</text>
  <!-- bars: scale 2.4 px per vote -->
  <rect x="150" y="40" width="175" height="16" fill="#e2903a"/>
  <text x="30" y="53" font-size="11.5" fill="currentColor">Jefferson (R)</text>
  <text x="332" y="53" font-size="11.5" font-weight="bold" fill="currentColor">73</text>
  <rect x="150" y="62" width="175" height="16" fill="#e2903a" fill-opacity="0.55"/>
  <text x="30" y="75" font-size="11.5" fill="currentColor">Burr (R)</text>
  <text x="332" y="75" font-size="11.5" font-weight="bold" fill="currentColor">73</text>
  <rect x="150" y="84" width="156" height="16" fill="#4c8dd6"/>
  <text x="30" y="97" font-size="11.5" fill="currentColor">Adams (F)</text>
  <text x="313" y="97" font-size="11.5" fill="currentColor">65</text>
  <rect x="150" y="106" width="154" height="16" fill="#4c8dd6" fill-opacity="0.55"/>
  <text x="30" y="119" font-size="11.5" fill="currentColor">Pinckney (F)</text>
  <text x="311" y="119" font-size="11.5" fill="currentColor">64 &#160;&#160;(Jay 1)</text>
  <path d="M 368 40 q 14 0 14 14 l 0 5 q 0 5 8 5 q -8 0 -8 5 l 0 5 q 0 14 -14 14" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.7"/>
  <text x="400" y="68" font-size="11.5" fill="currentColor">a tie between running mates:</text>
  <text x="400" y="83" font-size="11.5" fill="currentColor">every Republican elector cast</text>
  <text x="400" y="98" font-size="11.5" fill="currentColor">both votes for the ticket</text>

  <!-- bottom: 36 ballots -->
  <text x="30" y="162" font-size="12.5" font-weight="bold" fill="currentColor">the House ballots, February 11–17, 1801 — states carried, of 16</text>
  <!-- legend -->
  <rect x="30" y="176" width="10" height="10" fill="#e2903a"/>
  <text x="46" y="185" font-size="11" fill="currentColor">Jefferson: 8 states through 35 ballots</text>
  <line x1="270" y1="181" x2="290" y2="181" stroke="#4c8dd6" stroke-width="2.5"/>
  <text x="296" y="185" font-size="11" fill="currentColor">Burr: 6 states (two delegations divided)</text>

  <!-- 36th-ballot annotation, upper right, clear of the bars -->
  <text x="596" y="222" font-size="11" font-weight="bold" fill="#e2903a" text-anchor="end">36th ballot: Jefferson 10, Burr 4</text>
  <text x="596" y="237" font-size="10.5" fill="currentColor" opacity="0.8" text-anchor="end">Delaware and South Carolina file blanks</text>
  <line x1="578" y1="242" x2="577" y2="256" stroke="#e2903a" stroke-width="1.1" opacity="0.8"/>

  <!-- axis: baseline y=366, 11 px/state; majority line at 9 states: y = 366-99 = 267 -->
  <line x1="40" y1="267" x2="600" y2="267" stroke="currentColor" stroke-width="1" stroke-dasharray="4 3" opacity="0.6"/>
  <text x="42" y="261" font-size="10.5" fill="currentColor" opacity="0.75">9 states elect a president</text>

  <!-- Jefferson bars: ballots 1-35 at 8 states (88px, y=278), ballot 36 at 10 (110px, y=256) -->
  <g fill="#e2903a">
    <rect x="46"  y="278" width="10" height="88"/><rect x="61"  y="278" width="10" height="88"/><rect x="76"  y="278" width="10" height="88"/><rect x="91"  y="278" width="10" height="88"/><rect x="106" y="278" width="10" height="88"/>
    <rect x="121" y="278" width="10" height="88"/><rect x="136" y="278" width="10" height="88"/><rect x="151" y="278" width="10" height="88"/><rect x="166" y="278" width="10" height="88"/><rect x="181" y="278" width="10" height="88"/>
    <rect x="196" y="278" width="10" height="88"/><rect x="211" y="278" width="10" height="88"/><rect x="226" y="278" width="10" height="88"/><rect x="241" y="278" width="10" height="88"/><rect x="256" y="278" width="10" height="88"/>
    <rect x="271" y="278" width="10" height="88"/><rect x="286" y="278" width="10" height="88"/><rect x="301" y="278" width="10" height="88"/><rect x="316" y="278" width="10" height="88"/><rect x="331" y="278" width="10" height="88"/>
    <rect x="346" y="278" width="10" height="88"/><rect x="361" y="278" width="10" height="88"/><rect x="376" y="278" width="10" height="88"/><rect x="391" y="278" width="10" height="88"/><rect x="406" y="278" width="10" height="88"/>
    <rect x="421" y="278" width="10" height="88"/><rect x="436" y="278" width="10" height="88"/><rect x="451" y="278" width="10" height="88"/><rect x="466" y="278" width="10" height="88"/><rect x="481" y="278" width="10" height="88"/>
    <rect x="496" y="278" width="10" height="88"/><rect x="511" y="278" width="10" height="88"/><rect x="526" y="278" width="10" height="88"/><rect x="541" y="278" width="10" height="88"/><rect x="556" y="278" width="10" height="88"/>
    <rect x="571" y="256" width="10" height="110"/>
  </g>
  <!-- Burr markers: 6 states through 35 ballots (y = 366-66 = 300), 4 on the 36th (y = 366-44 = 322) -->
  <g stroke="#4c8dd6" stroke-width="2.5" fill="none">
    <line x1="46" y1="300" x2="566" y2="300"/>
    <line x1="571" y1="322" x2="581" y2="322"/>
  </g>
  <line x1="40" y1="366" x2="600" y2="366" stroke="currentColor" stroke-width="1.2" opacity="0.7"/>
  <text x="46" y="382" font-size="10.5" fill="currentColor" opacity="0.7">ballot 1 — Feb 11</text>
  <text x="581" y="382" font-size="10.5" fill="currentColor" opacity="0.7" text-anchor="end">ballot 36 — Feb 17</text>
  <text x="320" y="398" font-size="11" fill="currentColor" opacity="0.6" text-anchor="middle">one state delegation, one vote; the outgoing, Federalist-controlled House chooses between the two Republicans</text>
</svg>

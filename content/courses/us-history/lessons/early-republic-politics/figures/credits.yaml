images:
  - file: lansdowne-washington-1796.jpg
    title: "Gilbert Stuart, \"George Washington\" (the \"Lansdowne\" portrait) — oil on canvas, 1796, the president full-length in black velvet with a dress sword, before a classical column and swagged drapery"
    credit: "Gilbert Stuart (1755–1828), oil on canvas, 1796, 247.6 × 158.7 cm; National Portrait Gallery, Smithsonian Institution; acquired as a gift to the nation through the generosity of the Donald W. Reynolds Foundation (NPG.2001.13). Scan by the Google Cultural Institute; file via Wikimedia Commons"
    source_url: "https://commons.wikimedia.org/wiki/File:Gilbert_Stuart_-_George_Washington_(Lansdowne_Portrait)_-_Google_Art_Project.jpg"
    license: "public domain (painted 1796, artist d. 1828, published before 1 January 1931); Wikimedia Commons carries the Google Cultural Institute photograph as PD-Art, a faithful reproduction of a two-dimensional public-domain work"
    retrieved: "2026-07-30"
    located: "Wikimedia Commons file Gilbert_Stuart_-_George_Washington_(Lansdowne_Portrait)_-_Google_Art_Project.jpg — the Google Cultural Institute's 6661×10582 scan of the whole canvas, commissioned by William and Anne Bingham as a gift for the Marquess of Lansdowne and on view at the National Portrait Gallery since 1968"
    modifications: "none to the picture — the whole canvas, uncropped, at 1000×1589 (a straight downscale of the 6661×10582 Commons scan, identical aspect ratio); metadata stripped on re-encoding as JPEG"
    background: none
  - file: hamilton-trumbull-1792.jpg
    title: "Alexander Hamilton (John Trumbull, c. 1792)"
    credit: "John Trumbull (1756–1843), c. 1792, oil on canvas, 76.2 × 60.5 cm — National Gallery of Art, Washington DC, Gift of the Avalon Foundation (accession 1952.1.1); museum scan via Wikimedia Commons"
    source_url: "https://commons.wikimedia.org/wiki/File:Alexander_Hamilton_A17950.jpg"
    license: "public domain (PD-Art / PD-US — Trumbull died in 1843 and the painting was published long before 1931; the photographic reproduction of a two-dimensional public-domain work carries no new copyright and is marked Creative Commons Public Domain Mark 1.0)"
    retrieved: "2026-08-01"
    located: "NGA accession 1952.1.1 — the half-length life portrait Trumbull painted while Hamilton was secretary of the treasury, a distinct canvas from the posthumous 1806 portrait (NPG.79.216) used in the ratification lesson"
    modifications: "cropped in from the top and left canvas edges (about 9% of the height and 11% of the width of the 2400×3013 working scan) to tighten the framing on head and torso — the right and bottom edges are the painting's own; then downscaled to 1100px wide, metadata stripped and re-encoded as JPEG at quality 86. Nothing inside the picture retouched, removed or tonally corrected"
    background: none
  - file: jefferson-peale-1800.jpg
    title: "Thomas Jefferson (Rembrandt Peale, 1800)"
    credit: "Rembrandt Peale (1778–1860), 1800, oil on canvas, 58.8 × 48.9 cm (23⅛ × 19¼ in) — White House Collection, White House Historical Association (accession 1962.395.1, gift of Mr. and Mrs. Paul Mellon, 1962); Google Cultural Institute scan via Wikimedia Commons"
    source_url: "https://commons.wikimedia.org/wiki/File:Rembrandt_Peale_-_Thomas_Jefferson_-_Google_Art_Project.jpg"
    license: "public domain — Peale died in 1860 and the painting was published before 1930, so both the work and its faithful photographic reproduction (PD-Art) are in the public domain"
    retrieved: "2026-08-01"
    located: "White House, State Floor, Blue Room — the canvas painted from life in Philadelphia and finished before mid-May 1800, while Jefferson was vice president; not the New-York Historical Society Peale Jefferson (1867.306), which that museum dates 1805"
    modifications: "none to the picture — the whole canvas, neither cropped nor upscaled; downscaled from the 7117×8497 Google Cultural Institute master to 1100×1313, metadata stripped and re-encoded as JPEG at quality 84"
    background: none
  - file: congressional-pugilists-1798.jpg
    title: "\"Congressional Pugilists\" — the anonymous etching of the fight between Matthew Lyon and Roger Griswold on the floor of the House, Congress Hall, Philadelphia, February 15, 1798"
    credit: "Anonymous, American, 18th century; etching, third state of three (later restrike?), plate 16.6 × 22.3 cm. The Metropolitan Museum of Art, New York, Drawings and Prints, accession 50.587.13, Gift of Albert Ten Eyck Gardner, 1950; file via Wikimedia Commons (Met image DP876932)"
    source_url: "https://commons.wikimedia.org/wiki/File:Congressional_Pugilists_MET_DP876932.jpg"
    license: "CC0 1.0 Universal (the Metropolitan Museum's Open Access dedication on its photograph, as stated on Wikimedia Commons; the 1798 etching is itself public domain)"
    license_url: "https://creativecommons.org/publicdomain/zero/1.0/"
    retrieved: "2026-08-01"
    located: "Met object 388906 (metmuseum.org/art/collection/search/388906); the Commons file is the museum's 3018×2244 scan of the whole sheet — title and the keyed names of Speaker Dayton and Clerk Condy along the top, the scene inside its plate border, the framed \"Royal Sport\" cockfight on the back wall, and the three-column doggerel and Philadelphia imprint printed below"
    modifications: "cropped from the full sheet to just outside the printed matter (the blank paper margins and a collector's pencil number in the upper-right corner removed), downscaled to 1400px wide, metadata stripped, re-encoded as JPEG. Nothing inside the plate retouched, removed or enhanced; the printed caption is the artefact's own and is kept"
    background: none
  - file: sedition-act-enrolled-1798.jpg
    title: "An Act in Addition to the Act, Entitled \"An Act for the Punishment of Certain Crimes Against the United States\" (the Sedition Act), July 14, 1798"
    credit: "Fifth Congress, 2nd Session; enrolled act on paper, signed by Speaker Jonathan Dayton, Senate President pro tempore Theodore Sedgwick, and President John Adams. National Archives and Records Administration, Record Group 11, General Records of the United States Government; Enrolled Acts and Resolutions of Congress; National Archives Identifier 189698389 — digital copy via the Digital Public Library of America and Wikimedia Commons"
    source_url: "https://commons.wikimedia.org/wiki/File:An_Act_in_Addition_to_the_Act,_Entitled_%22An_Act_for_the_Punishment_of_Certain_Crimes_Against_the_United_States%22_-_DPLA_-_71062ffc0a2718116795c74ca43a0875.jpg"
    license: "public domain (US federal record; NARA use restriction \"Unrestricted\", rights statement No Copyright - United States)"
    license_url: "https://rightsstatements.org/vocab/NoC-US/1.0/"
    retrieved: "2026-08-01"
    located: "NARA catalog id 189698389, the whole sheet, uncropped. Note: the catalog's scope note misidentifies this act as the Alien Enemies Act; the document is the Sedition Act, matching 1 Stat. 596 — Sect. 2 penalises \"false, scandalous and malicious writing\" and Sect. 4 expires the act on 3 March 1801"
    modifications: "none to the image — the entire sheet; downscaled from 2397x2862 to 1400x1672, transparency flattened, metadata stripped, re-encoded as JPEG at quality 88. No cropping, no tonal correction"
    background: none

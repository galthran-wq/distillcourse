<svg viewBox="0 0 660 380" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- inputs -->
  <rect x="16" y="36" width="168" height="40" rx="4" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.75"/>
  <text x="100" y="53" font-size="11.5" fill="currentColor" text-anchor="middle">federal war debt</text>
  <text x="100" y="68" font-size="10.5" fill="currentColor" opacity="0.65" text-anchor="middle">≈ $54M, deeply discounted</text>

  <rect x="16" y="94" width="168" height="40" rx="4" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.75"/>
  <text x="100" y="111" font-size="11.5" fill="currentColor" text-anchor="middle">state war debts</text>
  <text x="100" y="126" font-size="10.5" fill="currentColor" opacity="0.65" text-anchor="middle">≈ $25M, assumed 1790</text>

  <!-- arrows into funding -->
  <line x1="184" y1="56" x2="228" y2="76" stroke="currentColor" stroke-width="1.3" opacity="0.6"/>
  <line x1="184" y1="114" x2="228" y2="94" stroke="currentColor" stroke-width="1.3" opacity="0.6"/>
  <path d="M 232 78 l -10 -2 l 5 8 z" fill="currentColor" opacity="0.6"/>
  <path d="M 232 92 l -10 2 l 5 -8 z" fill="currentColor" opacity="0.6"/>

  <!-- funding node -->
  <rect x="234" y="60" width="180" height="50" rx="4" fill="#e2903a" fill-opacity="0.12" stroke="#e2903a" stroke-width="1.6"/>
  <text x="324" y="80" font-size="12" font-weight="bold" fill="currentColor" text-anchor="middle">assumption + funding</text>
  <text x="324" y="96" font-size="10.5" fill="currentColor" opacity="0.7" text-anchor="middle">old paper swapped at face value</text>

  <!-- outputs -->
  <line x1="414" y1="72" x2="456" y2="52" stroke="#e2903a" stroke-width="1.6"/>
  <path d="M 458 51 l -9 0 l 3 8 z" fill="#e2903a"/>
  <rect x="460" y="28" width="184" height="44" rx="4" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.75"/>
  <text x="552" y="46" font-size="11" fill="currentColor" text-anchor="middle">creditors hold federal bonds:</text>
  <text x="552" y="61" font-size="10.5" fill="currentColor" opacity="0.65" text-anchor="middle">the moneyed tied to the union</text>

  <line x1="414" y1="98" x2="456" y2="118" stroke="#e2903a" stroke-width="1.6"/>
  <path d="M 458 119 l -9 -1 l 3 -8 z" fill="#e2903a"/>
  <rect x="460" y="100" width="184" height="50" rx="4" fill="#4c8dd6" fill-opacity="0.12" stroke="#4c8dd6" stroke-width="1.6"/>
  <text x="552" y="120" font-size="12" font-weight="bold" fill="currentColor" text-anchor="middle">Bank of the United States</text>
  <text x="552" y="136" font-size="10.5" fill="currentColor" opacity="0.7" text-anchor="middle">1791 · 20-yr charter · 80% private</text>

  <line x1="552" y1="150" x2="552" y2="180" stroke="#4c8dd6" stroke-width="1.4"/>
  <path d="M 552 182 l -4 -8 l 8 0 z" fill="#4c8dd6"/>
  <rect x="460" y="184" width="184" height="40" rx="4" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.75"/>
  <text x="552" y="201" font-size="11" fill="currentColor" text-anchor="middle">national paper and credit</text>
  <text x="552" y="216" font-size="10.5" fill="currentColor" opacity="0.65" text-anchor="middle">for commerce and the Treasury</text>

  <!-- revenue feed -->
  <rect x="234" y="150" width="180" height="44" rx="4" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.75"/>
  <text x="324" y="168" font-size="11" fill="currentColor" text-anchor="middle">import duties + whiskey excise</text>
  <text x="324" y="183" font-size="10.5" fill="currentColor" opacity="0.65" text-anchor="middle">service the bond interest</text>
  <line x1="324" y1="150" x2="324" y2="118" stroke="currentColor" stroke-width="1.3" opacity="0.6"/>
  <path d="M 324 116 l -4 8 l 8 0 z" fill="currentColor" opacity="0.6"/>
  <text x="324" y="212" font-size="10.5" fill="currentColor" opacity="0.6" text-anchor="middle">the excise → the Whiskey Rebellion, 1794:</text>
  <text x="324" y="226" font-size="10.5" fill="currentColor" opacity="0.6" text-anchor="middle">13,000 militia marched west</text>

  <!-- constitutional objection annotation -->
  <rect x="16" y="252" width="628" height="110" rx="5" fill="none" stroke="#4c8dd6" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="32" y="276" font-size="11.5" font-weight="bold" fill="#4c8dd6">the fight at the Bank node</text>
  <text x="32" y="296" font-size="11" fill="currentColor">Jefferson and Randolph: chartering a bank is not among Congress's enumerated powers — the bill is void.</text>
  <text x="32" y="314" font-size="11" fill="currentColor">Hamilton: "necessary and proper" implies any power conducive to an enumerated end.</text>
  <text x="32" y="340" font-size="11" fill="currentColor" opacity="0.7">Washington signs, February 1791. Strict against broad construction dates from this exchange.</text>
  <line x1="560" y1="252" x2="580" y2="152" stroke="#4c8dd6" stroke-width="1.1" stroke-dasharray="4 3" opacity="0.7"/>
</svg>

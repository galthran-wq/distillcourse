<svg viewBox="0 0 640 250" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- timeline spine -->
  <line x1="40" y1="60" x2="600" y2="60" stroke="currentColor" stroke-width="1.5" opacity="0.6"/>
  <path d="M 600 60 l -10 -5 l 0 10 z" fill="currentColor" opacity="0.6"/>

  <!-- node 1: 1798-99 -->
  <circle cx="110" cy="60" r="6" fill="#e2903a"/>
  <text x="110" y="42" font-size="12.5" font-weight="bold" fill="currentColor" text-anchor="middle">1798–99</text>
  <line x1="110" y1="66" x2="110" y2="88" stroke="#e2903a" stroke-width="1.2" opacity="0.7"/>
  <text x="110" y="106" font-size="11.5" fill="currentColor" text-anchor="middle">Kentucky and Virginia Resolutions:</text>
  <text x="110" y="121" font-size="11.5" fill="currentColor" text-anchor="middle">states may "interpose" against</text>
  <text x="110" y="136" font-size="11.5" fill="currentColor" text-anchor="middle">unconstitutional federal acts;</text>
  <text x="110" y="151" font-size="11.5" fill="currentColor" text-anchor="middle">Kentucky, 1799: "nullification"</text>
  <text x="110" y="169" font-size="10.5" fill="currentColor" opacity="0.6" text-anchor="middle">written to defend newspaper editors</text>

  <!-- node 2: 1832-33 -->
  <circle cx="330" cy="60" r="6" fill="currentColor" opacity="0.8"/>
  <text x="330" y="42" font-size="12.5" font-weight="bold" fill="currentColor" text-anchor="middle">1832–33</text>
  <line x1="330" y1="66" x2="330" y2="88" stroke="currentColor" stroke-width="1.2" opacity="0.5"/>
  <text x="330" y="106" font-size="11.5" fill="currentColor" text-anchor="middle">South Carolina nullifies the federal</text>
  <text x="330" y="121" font-size="11.5" fill="currentColor" text-anchor="middle">tariff, citing "the principles of '98";</text>
  <text x="330" y="136" font-size="11.5" fill="currentColor" text-anchor="middle">backs down before Jackson's</text>
  <text x="330" y="151" font-size="11.5" fill="currentColor" text-anchor="middle">Force Bill</text>

  <!-- node 3: 1860-61 -->
  <circle cx="545" cy="60" r="6" fill="currentColor" opacity="0.8"/>
  <text x="545" y="42" font-size="12.5" font-weight="bold" fill="currentColor" text-anchor="middle">1860–61</text>
  <line x1="545" y1="66" x2="545" y2="88" stroke="currentColor" stroke-width="1.2" opacity="0.5"/>
  <text x="545" y="106" font-size="11.5" fill="currentColor" text-anchor="middle">eleven seceding states invoke</text>
  <text x="545" y="121" font-size="11.5" fill="currentColor" text-anchor="middle">state sovereignty; the claim</text>
  <text x="545" y="136" font-size="11.5" fill="currentColor" text-anchor="middle">is settled by the Civil War</text>

  <!-- citation arcs -->
  <path d="M 118 52 Q 220 18 322 52" fill="none" stroke="#e2903a" stroke-width="1.1" stroke-dasharray="4 3" opacity="0.7"/>
  <path d="M 338 52 Q 437 20 537 52" fill="none" stroke="#e2903a" stroke-width="1.1" stroke-dasharray="4 3" opacity="0.7"/>
  <text x="320" y="212" font-size="11" fill="currentColor" opacity="0.6" text-anchor="middle">dashed arcs mark citation, not causation — each later crisis quoted the earlier text</text>
  <text x="320" y="232" font-size="11" fill="currentColor" opacity="0.6" text-anchor="middle">Madison, to his death in 1836, denied the Resolutions authorized any state veto</text>
</svg>

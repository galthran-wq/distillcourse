<svg viewBox="0 0 620 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <rect x="14" y="12" width="592" height="296" rx="6" fill="none" stroke="currentColor" stroke-width="1.4" opacity="0.8"/>
  <text x="310" y="40" font-size="14" font-weight="bold" fill="currentColor" text-anchor="middle">The Sedition Act — July 14, 1798</text>
  <line x1="34" y1="54" x2="586" y2="54" stroke="currentColor" stroke-width="1" opacity="0.4"/>

  <text x="40" y="82" font-size="12" font-weight="bold" fill="#e2903a">forbidden</text>
  <text x="150" y="82" font-size="11.5" fill="currentColor">"false, scandalous and malicious writing" against the government,</text>
  <text x="150" y="98" font-size="11.5" fill="currentColor">either house of Congress, or the President</text>
  <text x="150" y="116" font-size="11" fill="#e2903a">not on the list: the Vice President — Thomas Jefferson</text>

  <line x1="34" y1="130" x2="586" y2="130" stroke="currentColor" stroke-width="1" opacity="0.25"/>
  <text x="40" y="156" font-size="12" font-weight="bold" fill="currentColor" opacity="0.85">penalty</text>
  <text x="150" y="156" font-size="11.5" fill="currentColor">fine up to $2,000 and up to two years' imprisonment</text>
  <text x="150" y="172" font-size="11" fill="currentColor" opacity="0.6">§3: truth a defense, jury decides law and fact — liberal on paper only</text>

  <line x1="34" y1="186" x2="586" y2="186" stroke="currentColor" stroke-width="1" opacity="0.25"/>
  <text x="40" y="212" font-size="12" font-weight="bold" fill="currentColor" opacity="0.85">enforced</text>
  <text x="150" y="212" font-size="11.5" fill="currentColor">17 verifiable indictments · 10 convictions</text>
  <text x="150" y="228" font-size="11" fill="currentColor" opacity="0.6">Republican printers and one congressman — all from the opposition</text>

  <line x1="34" y1="242" x2="586" y2="242" stroke="currentColor" stroke-width="1" opacity="0.25"/>
  <text x="40" y="268" font-size="12" font-weight="bold" fill="#e2903a">expires</text>
  <text x="150" y="268" font-size="11.5" font-weight="bold" fill="currentColor">March 3, 1801</text>
  <text x="150" y="284" font-size="11" fill="#e2903a">the last day of Adams's term — a sunset synchronized to the election</text>
</svg>

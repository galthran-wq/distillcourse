<svg viewBox="0 0 620 330" font-family="system-ui, sans-serif">
  <!-- ocean -->
  <text x="300" y="180" text-anchor="middle" font-size="13" letter-spacing="6" fill="currentColor" opacity="0.25">ATLANTIC</text>

  <!-- east coastline: Iberia + West Africa (schematic) -->
  <path d="M 585 15 C 560 55, 545 80, 552 110 C 560 145, 520 170, 528 210 C 535 250, 560 285, 575 320" fill="none" stroke="currentColor" opacity="0.45" stroke-width="1.5"/>
  <text x="596" y="42" text-anchor="end" font-size="11" fill="currentColor" opacity="0.6">Portugal</text>
  <text x="600" y="240" text-anchor="end" font-size="11" fill="currentColor" opacity="0.6">West</text>
  <text x="600" y="253" text-anchor="end" font-size="11" fill="currentColor" opacity="0.6">Africa</text>

  <!-- west coastline: Caribbean + Brazil (schematic) -->
  <path d="M 55 30 C 80 70, 70 110, 95 140 C 120 172, 100 210, 120 245 C 135 272, 120 300, 105 325" fill="none" stroke="currentColor" opacity="0.45" stroke-width="1.5"/>
  <text x="30" y="118" font-size="11" fill="currentColor" opacity="0.6">Caribbean</text>
  <text x="40" y="290" font-size="11" fill="currentColor" opacity="0.6">South</text>
  <text x="40" y="303" font-size="11" fill="currentColor" opacity="0.6">America</text>

  <!-- equator + Tordesillas line -->
  <line x1="20" y1="258" x2="600" y2="258" stroke="currentColor" opacity="0.3" stroke-dasharray="3 4"/>
  <text x="24" y="252" font-size="10" fill="currentColor" opacity="0.5">equator</text>
  <line x1="255" y1="15" x2="255" y2="320" stroke="currentColor" opacity="0.35" stroke-dasharray="3 4"/>
  <text x="261" y="26" font-size="10" fill="currentColor" opacity="0.55">Tordesillas line, 1494</text>

  <defs>
    <marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#e2903a"/>
    </marker>
  </defs>

  <!-- stations -->
  <circle cx="560" cy="50" r="4" fill="currentColor"/>
  <text x="548" y="54" text-anchor="end" font-size="11.5" font-weight="600" fill="currentColor">Lisbon</text>

  <circle cx="497" cy="105" r="4.5" fill="#e2903a"/>
  <text x="488" y="97" text-anchor="end" font-size="11.5" font-weight="600" fill="currentColor">Madeira</text>
  <text x="488" y="110" text-anchor="end" font-size="10" fill="currentColor" opacity="0.6">1420s · sugar under crown license</text>

  <circle cx="522" cy="258" r="4.5" fill="#e2903a"/>
  <text x="512" y="278" text-anchor="end" font-size="11.5" font-weight="600" fill="currentColor">São Tomé</text>
  <text x="512" y="291" text-anchor="end" font-size="10" fill="currentColor" opacity="0.6">1490s · + enslaved African labor</text>
  <text x="512" y="303" text-anchor="end" font-size="10" fill="currentColor" opacity="0.6">= the plantation template</text>

  <circle cx="100" cy="128" r="4.5" fill="#e2903a"/>
  <text x="112" y="122" font-size="11.5" font-weight="600" fill="currentColor">Hispaniola</text>
  <text x="112" y="135" font-size="10" fill="currentColor" opacity="0.6">1500s · Columbus's base island</text>

  <circle cx="128" cy="252" r="4.5" fill="#e2903a"/>
  <text x="140" y="246" font-size="11.5" font-weight="600" fill="currentColor">Brazil</text>
  <text x="140" y="259" font-size="10" fill="currentColor" opacity="0.6">1500s</text>

  <!-- the route -->
  <path d="M 552 58 L 507 96" fill="none" stroke="#e2903a" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M 500 114 C 505 165, 512 210, 519 248" fill="none" stroke="#e2903a" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M 487 110 C 340 118, 220 122, 112 127" fill="none" stroke="#e2903a" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M 511 260 C 390 262, 260 258, 140 253" fill="none" stroke="#e2903a" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="300" y="145" text-anchor="middle" font-size="10.5" fill="#e2903a">after 1492 — the template crosses whole</text>
</svg>

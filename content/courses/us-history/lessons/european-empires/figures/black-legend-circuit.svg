<svg viewBox="0 0 640 440" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- source node -->
  <rect x="30" y="16" width="380" height="44" rx="5" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <text x="40" y="34" font-size="12" font-weight="bold" fill="#e2903a">Seville, 1552</text>
  <text x="40" y="50" font-size="11" fill="currentColor">Las Casas prints the Brev&#237;sima: a reform brief addressed to the crown</text>

  <!-- chain arrows -->
  <path d="M 220 60 L 220 76 M 215 70 L 220 77 L 225 70" stroke="currentColor" stroke-width="1.5" fill="none" opacity="0.6"/>

  <!-- reprint nodes -->
  <rect x="30" y="80" width="380" height="40" rx="5" fill="none" stroke="#4c8dd6"/>
  <text x="40" y="97" font-size="12" font-weight="bold" fill="#4c8dd6">Dutch translations, from 1578</text>
  <text x="40" y="112" font-size="11" fill="currentColor">ammunition for the revolt against Philip II</text>

  <path d="M 220 120 L 220 136 M 215 130 L 220 137 L 225 130" stroke="currentColor" stroke-width="1.5" fill="none" opacity="0.6"/>

  <rect x="30" y="140" width="380" height="40" rx="5" fill="none" stroke="#4c8dd6"/>
  <text x="40" y="157" font-size="12" font-weight="bold" fill="#4c8dd6">London, 1583: The Spanish Colonie</text>
  <text x="40" y="172" font-size="11" fill="currentColor">printed as England drifts into war with Spain</text>

  <path d="M 220 180 L 220 196 M 215 190 L 220 197 L 225 190" stroke="currentColor" stroke-width="1.5" fill="none" opacity="0.6"/>

  <rect x="30" y="200" width="380" height="40" rx="5" fill="none" stroke="#4c8dd6"/>
  <text x="40" y="217" font-size="12" font-weight="bold" fill="#4c8dd6">Frankfurt, 1598: De Bry&#8217;s 17 engravings</text>
  <text x="40" y="232" font-size="11" fill="currentColor">images added by an engraver who never saw America</text>

  <path d="M 220 240 L 220 256 M 215 250 L 220 257 L 225 250" stroke="currentColor" stroke-width="1.5" fill="none" opacity="0.6"/>

  <rect x="30" y="260" width="380" height="40" rx="5" fill="none" stroke="#4c8dd6"/>
  <text x="40" y="277" font-size="12" font-weight="bold" fill="#4c8dd6">London, 1656 and 1689</text>
  <text x="40" y="292" font-size="11" fill="currentColor">Tears of the Indians (Cromwell&#8217;s Jamaica fleet); Popery Truly Display&#8217;d</text>

  <!-- payoff -->
  <path d="M 410 280 L 448 280 M 442 275 L 449 280 L 442 285" stroke="currentColor" stroke-width="1.5" fill="none" opacity="0.6"/>
  <rect x="452" y="240" width="172" height="80" rx="5" fill="#4c8dd6" opacity="0.12"/>
  <rect x="452" y="240" width="172" height="80" rx="5" fill="none" stroke="#4c8dd6" stroke-width="1.5"/>
  <text x="538" y="262" font-size="11" font-weight="bold" fill="currentColor" text-anchor="middle">the printed argument:</text>
  <text x="538" y="280" font-size="11" fill="currentColor" text-anchor="middle">Spain uniquely cruel,</text>
  <text x="538" y="296" font-size="11" fill="currentColor" text-anchor="middle">so rival colonization</text>
  <text x="538" y="312" font-size="11" fill="currentColor" text-anchor="middle">= rescue</text>

  <!-- side note on source vs product -->
  <text x="452" y="40" font-size="11" fill="currentColor" opacity="0.55">same text at every step;</text>
  <text x="452" y="55" font-size="11" fill="currentColor" opacity="0.55">the argument is swapped</text>
  <text x="452" y="70" font-size="11" fill="currentColor" opacity="0.55">at each border</text>

  <!-- method boxes -->
  <line x1="30" y1="336" x2="624" y2="336" stroke="currentColor" opacity="0.25"/>
  <rect x="30" y="348" width="184" height="76" rx="5" fill="none" stroke="currentColor" opacity="0.7"/>
  <text x="40" y="366" font-size="11" font-weight="bold" fill="currentColor">records</text>
  <text x="40" y="382" font-size="10" fill="currentColor">real atrocities, by an eyewitness</text>
  <text x="40" y="395" font-size="10" fill="currentColor">with standing; collapse corroborated</text>
  <text x="40" y="408" font-size="10" fill="currentColor">by Spain&#8217;s own tribute registers</text>

  <rect x="228" y="348" width="184" height="76" rx="5" fill="none" stroke="currentColor" opacity="0.7"/>
  <text x="238" y="366" font-size="11" font-weight="bold" fill="currentColor">argues</text>
  <text x="238" y="382" font-size="10" fill="currentColor">author: reform my empire;</text>
  <text x="238" y="395" font-size="10" fill="currentColor">printers: Spain uniquely cruel,</text>
  <text x="238" y="408" font-size="10" fill="currentColor">our colonization is rescue</text>

  <rect x="426" y="348" width="198" height="76" rx="5" fill="none" stroke="currentColor" opacity="0.7"/>
  <text x="436" y="366" font-size="11" font-weight="bold" fill="currentColor">omits</text>
  <text x="436" y="382" font-size="10" fill="currentColor">its Spanish reform origin; that the</text>
  <text x="436" y="395" font-size="10" fill="currentColor">images were drawn from prose; the</text>
  <text x="436" y="408" font-size="10" fill="currentColor">printing empires&#8217; own record</text>
</svg>

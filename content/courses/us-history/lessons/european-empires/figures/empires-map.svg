<svg viewBox="0 0 640 520" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="24" y="28" font-size="13" font-weight="bold" fill="currentColor">North America, c. 1700 (schematic)</text>

  <!-- land fill (faint), closed through the frame edges -->
  <path d="M 600 80
           C 585 105, 570 120, 560 130
           C 545 150, 528 172, 510 190
           C 495 205, 482 215, 470 225
           C 462 245, 456 262, 450 280
           C 443 298, 436 315, 430 330
           C 424 345, 419 358, 415 370
           C 420 378, 424 386, 426 395
           C 428 420, 430 445, 431 468
           C 424 462, 415 448, 407 432
           C 402 420, 398 412, 395 405
           C 377 402, 358 401, 340 402
           C 320 402, 300 400, 280 400
           C 260 401, 240 405, 220 410
           C 200 416, 180 422, 160 430
           C 146 440, 132 450, 122 460
           L 30 460 L 30 80 Z"
        fill="currentColor" opacity="0.05"/>
  <!-- coastline -->
  <path d="M 600 80
           C 585 105, 570 120, 560 130
           C 545 150, 528 172, 510 190
           C 495 205, 482 215, 470 225
           C 462 245, 456 262, 450 280
           C 443 298, 436 315, 430 330
           C 424 345, 419 358, 415 370
           C 420 378, 424 386, 426 395
           C 428 420, 430 445, 431 468
           C 424 462, 415 448, 407 432
           C 402 420, 398 412, 395 405
           C 377 402, 358 401, 340 402
           C 320 402, 300 400, 280 400
           C 260 401, 240 405, 220 410
           C 200 416, 180 422, 160 430
           C 146 440, 132 450, 122 460"
        fill="none" stroke="currentColor" opacity="0.5"/>

  <!-- Great Lakes -->
  <ellipse cx="395" cy="172" rx="20" ry="9" fill="none" stroke="currentColor" opacity="0.45"/>
  <ellipse cx="350" cy="158" rx="22" ry="9" fill="none" stroke="currentColor" opacity="0.45"/>
  <ellipse cx="305" cy="172" rx="16" ry="8" fill="none" stroke="currentColor" opacity="0.45"/>

  <!-- rivers -->
  <path d="M 585 95 C 545 115, 505 135, 460 158 C 440 166, 425 170, 413 172" stroke="currentColor" fill="none" opacity="0.45"/>
  <path d="M 330 188 C 322 250, 326 310, 312 370 C 307 385, 303 395, 300 402" stroke="currentColor" fill="none" opacity="0.45"/>
  <path d="M 140 290 C 152 340, 168 400, 185 452" stroke="currentColor" fill="none" opacity="0.45"/>

  <!-- FRENCH ARC -->
  <path d="M 585 95 C 545 115, 505 135, 460 158 C 438 167, 420 172, 408 176 C 370 180, 340 182, 330 190 C 322 250, 326 310, 312 370 C 307 385, 303 395, 300 400"
        stroke="#5aa46a" stroke-width="13" fill="none" opacity="0.3" stroke-linecap="round"/>
  <circle cx="520" cy="128" r="4" fill="#5aa46a"/>
  <text x="531" y="124" font-size="11" fill="currentColor">Quebec 1608</text>
  <circle cx="468" cy="154" r="4" fill="#5aa46a"/>
  <text x="479" y="150" font-size="11" fill="currentColor">Montreal 1642</text>
  <text x="170" y="112" font-size="12" font-weight="bold" fill="#5aa46a">NEW FRANCE</text>
  <text x="170" y="128" font-size="11" fill="currentColor">&#8776;15,000 colonists, 1700:</text>
  <text x="170" y="142" font-size="11" fill="currentColor">a river-and-lakes arc of posts</text>
  <path d="M 285 124 L 330 150 M 322 143 L 332 151 L 324 155" stroke="#5aa46a" stroke-width="1.5" fill="none"/>
  <text x="248" y="300" font-size="10" fill="#5aa46a" transform="rotate(80 248 300)">La Salle claims the Mississippi, 1682</text>

  <!-- SPANISH: Florida -->
  <path d="M 415 370 C 420 378, 424 386, 426 395 C 428 420, 430 445, 431 468 C 424 462, 415 448, 407 432 C 402 420, 398 412, 395 405 C 385 403, 372 402, 360 402 C 370 388, 385 378, 398 372 C 404 370, 410 370, 415 370 Z"
        fill="#4c8dd6" opacity="0.25" stroke="#4c8dd6"/>
  <circle cx="424" cy="398" r="4" fill="#4c8dd6"/>
  <text x="436" y="402" font-size="11" fill="currentColor">St. Augustine 1565</text>
  <!-- SPANISH: New Mexico -->
  <ellipse cx="150" cy="330" rx="40" ry="55" fill="#4c8dd6" opacity="0.25" stroke="#4c8dd6"/>
  <circle cx="152" cy="308" r="4" fill="#4c8dd6"/>
  <text x="163" y="304" font-size="11" fill="currentColor">Santa Fe 1610</text>
  <text x="46" y="412" font-size="12" font-weight="bold" fill="#4c8dd6">NEW SPAIN&#8217;S BORDERLANDS</text>
  <text x="46" y="427" font-size="11" fill="currentColor">a few thousand colonists;</text>
  <text x="46" y="441" font-size="11" fill="currentColor">the empire&#8217;s core lies south, in Mexico</text>
  <path d="M 155 448 L 143 486 M 137 478 L 142 488 L 149 481" stroke="#4c8dd6" stroke-width="1.5" fill="none"/>
  <text x="165" y="482" font-size="10" fill="currentColor" opacity="0.7">to Mexico City</text>

  <!-- ENGLISH STRIP -->
  <path d="M 512 192
           C 497 207, 484 217, 473 227
           C 465 247, 459 264, 453 282
           C 446 300, 439 317, 433 332
           C 427 347, 422 360, 418 371
           C 410 368, 403 364, 397 360
           C 402 346, 408 331, 414 316
           C 421 298, 428 279, 436 260
           C 443 242, 452 224, 462 208
           C 472 197, 483 188, 494 180 Z"
        fill="#e2903a" opacity="0.35" stroke="#e2903a"/>
  <text x="512" y="290" font-size="12" font-weight="bold" fill="#e2903a">ENGLISH STRIP</text>
  <text x="512" y="306" font-size="11" fill="currentColor">&#8776;250,000</text>
  <text x="512" y="320" font-size="11" fill="currentColor">colonists, 1700</text>
  <path d="M 508 286 L 452 292 M 459 287 L 450 293 L 460 298" stroke="#e2903a" stroke-width="1.5" fill="none"/>

  <!-- Hudson corridor -->
  <path d="M 470 225 C 462 208, 456 195, 452 182" stroke="#e2903a" stroke-width="3" fill="none" opacity="0.7" stroke-dasharray="5 3"/>
  <text x="480" y="176" font-size="11" fill="#e2903a">Hudson corridor:</text>
  <text x="480" y="190" font-size="11" fill="#e2903a">Dutch 1614&#8211;1664</text>
  <path d="M 476 180 L 460 194 M 463 186 L 458 196 L 469 194" stroke="#e2903a" stroke-width="1" fill="none" opacity="0.7"/>

  <!-- legend -->
  <rect x="330" y="470" width="10" height="10" rx="2" fill="#4c8dd6" opacity="0.6"/>
  <text x="346" y="479" font-size="11" fill="currentColor">Spain: rule</text>
  <rect x="424" y="470" width="10" height="10" rx="2" fill="#5aa46a" opacity="0.6"/>
  <text x="440" y="479" font-size="11" fill="currentColor">France: exchange</text>
  <rect x="330" y="490" width="10" height="10" rx="2" fill="#e2903a" opacity="0.6"/>
  <text x="346" y="499" font-size="11" fill="currentColor">the English strip (Dutch on the Hudson to 1664)</text>
</svg>

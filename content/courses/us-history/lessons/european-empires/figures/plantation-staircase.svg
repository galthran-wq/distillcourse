<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- axis: east to west -->
  <text x="320" y="22" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">east&#8594;west across the Atlantic, 1420s&#8211;1500s</text>

  <!-- Madeira -->
  <rect x="24" y="46" width="176" height="88" rx="5" fill="none" stroke="currentColor"/>
  <text x="112" y="66" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">Madeira, 1420s</text>
  <text x="112" y="86" font-size="11" fill="currentColor" text-anchor="middle">sugar under crown license</text>
  <text x="112" y="102" font-size="11" fill="currentColor" text-anchor="middle">Europe&#8217;s largest producer</text>
  <text x="112" y="118" font-size="11" fill="currentColor" text-anchor="middle">by 1500</text>

  <!-- arrow 1 -->
  <path d="M 202 90 L 228 90 M 222 85 L 229 90 L 222 95" stroke="#e2903a" stroke-width="2" fill="none"/>

  <!-- Sao Tome -->
  <rect x="232" y="46" width="176" height="88" rx="5" fill="none" stroke="currentColor"/>
  <text x="320" y="66" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">S&#227;o Tom&#233;, 1490s</text>
  <text x="320" y="86" font-size="11" fill="currentColor" text-anchor="middle">+ enslaved African labor:</text>
  <text x="320" y="102" font-size="11" fill="#e2903a" text-anchor="middle">the plantation template</text>
  <text x="320" y="118" font-size="11" fill="#e2903a" text-anchor="middle">complete</text>

  <!-- Tordesillas line -->
  <line x1="425" y1="38" x2="425" y2="180" stroke="currentColor" stroke-dasharray="4 3" opacity="0.5"/>
  <text x="418" y="112" font-size="10" fill="currentColor" opacity="0.55" transform="rotate(-90 418 112)" text-anchor="middle">Tordesillas, 1494</text>

  <!-- arrow 2 -->
  <path d="M 410 90 L 438 90 M 432 85 L 439 90 L 432 95" stroke="#e2903a" stroke-width="2" fill="none"/>

  <!-- Hispaniola / Brazil -->
  <rect x="442" y="46" width="176" height="88" rx="5" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <text x="530" y="66" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">Hispaniola &#183; Brazil</text>
  <text x="530" y="86" font-size="11" fill="currentColor" text-anchor="middle">1500s: the template lands</text>
  <text x="530" y="102" font-size="11" fill="currentColor" text-anchor="middle">finished &#8212; crop, coerced</text>
  <text x="530" y="118" font-size="11" fill="currentColor" text-anchor="middle">labor, crown license</text>

  <!-- bottom notes -->
  <line x1="24" y1="158" x2="618" y2="158" stroke="currentColor" opacity="0.25"/>
  <text x="24" y="182" font-size="11" fill="currentColor">the ocean was partitioned before it was mapped: the treaty line of 1494 divides</text>
  <text x="24" y="198" font-size="11" fill="currentColor">unexplored water, and European peace treaties stop at the amity lines &#8212;</text>
  <text x="24" y="214" font-size="11" fill="currentColor" opacity="0.55">&#8220;no peace beyond the line&#8221;: the Caribbean stays a war zone whatever is signed at home</text>
  <rect x="24" y="228" width="10" height="10" rx="2" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <text x="40" y="237" font-size="11" fill="currentColor">the moving template: cash crop + bound labor + crown license</text>
</svg>

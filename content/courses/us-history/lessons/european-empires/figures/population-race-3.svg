<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="90" y="30" font-size="15" font-weight="bold" fill="currentColor">1750</text>

  <!-- axis -->
  <line x1="90" y1="48" x2="90" y2="300" stroke="currentColor"/>
  <line x1="90" y1="300" x2="600" y2="300" stroke="currentColor"/>
  <line x1="90" y1="248" x2="600" y2="248" stroke="currentColor" opacity="0.15"/>
  <line x1="90" y1="195" x2="600" y2="195" stroke="currentColor" opacity="0.15"/>
  <line x1="90" y1="143" x2="600" y2="143" stroke="currentColor" opacity="0.15"/>
  <line x1="90" y1="90" x2="600" y2="90" stroke="currentColor" opacity="0.15"/>
  <text x="84" y="304" font-size="10" fill="currentColor" opacity="0.55" text-anchor="end">0</text>
  <text x="84" y="252" font-size="10" fill="currentColor" opacity="0.55" text-anchor="end">250k</text>
  <text x="84" y="199" font-size="10" fill="currentColor" opacity="0.55" text-anchor="end">500k</text>
  <text x="84" y="147" font-size="10" fill="currentColor" opacity="0.55" text-anchor="end">750k</text>
  <text x="84" y="94" font-size="10" fill="currentColor" opacity="0.55" text-anchor="end">1M</text>

  <!-- bars -->
  <rect x="140" y="54" width="90" height="246" fill="#e2903a"/>
  <text x="185" y="46" font-size="12" font-weight="bold" fill="currentColor" text-anchor="middle">&#8776;1,170,000</text>
  <rect x="300" y="288" width="90" height="12" fill="#5aa46a"/>
  <text x="345" y="280" font-size="12" fill="currentColor" text-anchor="middle">&#8776;55&#8211;70,000</text>
  <rect x="460" y="297" width="90" height="3" fill="#4c8dd6"/>
  <text x="505" y="287" font-size="12" fill="currentColor" text-anchor="middle">&#8776;10&#8211;20,000</text>

  <!-- Franklin annotation -->
  <rect x="332" y="70" width="256" height="96" rx="5" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <text x="344" y="92" font-size="11" font-weight="bold" fill="#e2903a">Franklin, 1751:</text>
  <text x="344" y="108" font-size="11" fill="currentColor">&#8220;This Million doubling, suppose but</text>
  <text x="344" y="123" font-size="11" fill="currentColor">once in 25 Years, will in another Century</text>
  <text x="344" y="138" font-size="11" fill="currentColor">be more than the People of England&#8221;</text>
  <text x="344" y="156" font-size="10" fill="currentColor" opacity="0.7">measured 1650&#8211;1750 doubling time: &#8776;22 years</text>
  <path d="M 332 118 L 240 118 M 247 113 L 238 118 L 247 123" stroke="#e2903a" stroke-width="1.5" fill="none"/>

  <!-- legend -->
  <rect x="120" y="322" width="10" height="10" rx="2" fill="#e2903a"/>
  <text x="136" y="331" font-size="11" fill="currentColor">British colonies</text>
  <rect x="268" y="322" width="10" height="10" rx="2" fill="#5aa46a"/>
  <text x="284" y="331" font-size="11" fill="currentColor">New France</text>
  <rect x="404" y="322" width="10" height="10" rx="2" fill="#4c8dd6"/>
  <text x="420" y="331" font-size="11" fill="currentColor">Spanish borderlands (est.)</text>
  <text x="345" y="350" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">shared scale across all frames; French and Spanish figures are estimates</text>
</svg>

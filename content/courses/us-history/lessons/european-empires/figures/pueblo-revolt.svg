<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- horse dispersal arrow (top) -->
  <path d="M 238 150 C 248 60, 420 28, 585 36 M 577 30 L 588 36 L 579 42" stroke="#5aa46a" stroke-width="2" fill="none"/>
  <text x="440" y="24" font-size="11" fill="#5aa46a" text-anchor="middle">scattered horse herds pass to the Plains nations</text>

  <!-- timeline base -->
  <line x1="40" y1="200" x2="610" y2="200" stroke="currentColor" stroke-width="1.5"/>
  <!-- Pueblo-rule band 1680-1692 -->
  <rect x="235" y="188" width="240" height="24" rx="4" fill="#e2903a" opacity="0.18"/>

  <!-- tick 1675 -->
  <line x1="110" y1="194" x2="110" y2="206" stroke="currentColor" stroke-width="1.5"/>
  <text x="110" y="222" font-size="11" font-weight="bold" fill="currentColor" text-anchor="middle">1675</text>
  <line x1="110" y1="188" x2="110" y2="94" stroke="currentColor" opacity="0.4"/>
  <text x="110" y="56" font-size="11" fill="currentColor" text-anchor="middle">dozens of Pueblo religious leaders</text>
  <text x="110" y="71" font-size="11" fill="currentColor" text-anchor="middle">arrested for &#8220;sorcery&#8221;; several hanged,</text>
  <text x="110" y="86" font-size="11" fill="currentColor" text-anchor="middle">the rest whipped &#8212; Pop&#233; among them</text>

  <!-- tick 1680 -->
  <line x1="235" y1="192" x2="235" y2="208" stroke="#e2903a" stroke-width="2.5"/>
  <text x="235" y="222" font-size="11" font-weight="bold" fill="#e2903a" text-anchor="middle">Aug 10, 1680</text>
  <line x1="235" y1="188" x2="235" y2="150" stroke="#e2903a" opacity="0.6"/>
  <text x="278" y="112" font-size="11" font-weight="bold" fill="#e2903a" text-anchor="middle">the rising: ~2 dozen pueblos, together</text>
  <text x="278" y="127" font-size="11" fill="currentColor" text-anchor="middle">deadline carried as knotted cords, one knot per day</text>
  <!-- knotted cord icon -->
  <path d="M 150 147 q 12 8 24 0 q 12 -8 24 0 q 12 8 24 0" stroke="currentColor" fill="none" opacity="0.7"/>
  <circle cx="162" cy="150" r="3" fill="#e2903a"/>
  <circle cx="186" cy="146" r="3" fill="#e2903a"/>
  <circle cx="210" cy="150" r="3" fill="#e2903a"/>

  <!-- band label + casualties -->
  <text x="355" y="240" font-size="11" fill="#e2903a" text-anchor="middle">New Mexico under Pueblo rule &#8212; twelve years, no European government</text>
  <text x="235" y="262" font-size="10" fill="currentColor" opacity="0.7" text-anchor="middle">&#8776;400 colonists killed, 21 of 33 friars;</text>
  <text x="235" y="275" font-size="10" fill="currentColor" opacity="0.7" text-anchor="middle">&#8776;2,000 survivors retreat to El Paso</text>

  <!-- tick 1692 -->
  <line x1="475" y1="194" x2="475" y2="206" stroke="currentColor" stroke-width="1.5"/>
  <text x="475" y="222" font-size="11" font-weight="bold" fill="currentColor" text-anchor="middle">1692</text>
  <line x1="475" y1="188" x2="475" y2="148" stroke="currentColor" opacity="0.4"/>
  <text x="527" y="104" font-size="11" fill="currentColor" text-anchor="middle">Vargas begins the reconquest;</text>
  <text x="527" y="119" font-size="11" fill="currentColor" text-anchor="middle">the returning regime restores</text>
  <text x="527" y="134" font-size="11" fill="currentColor" text-anchor="middle">no encomienda in New Mexico</text>

  <!-- endpoints -->
  <text x="40" y="222" font-size="10" fill="currentColor" opacity="0.55">1670s</text>
  <text x="600" y="222" font-size="10" fill="currentColor" opacity="0.55" text-anchor="end">1696</text>

  <!-- takeaway -->
  <line x1="40" y1="288" x2="610" y2="288" stroke="currentColor" opacity="0.25"/>
  <text x="325" y="310" font-size="12" font-weight="bold" fill="currentColor" text-anchor="middle">the most successful Indigenous rising against a European empire in North America</text>
</svg>

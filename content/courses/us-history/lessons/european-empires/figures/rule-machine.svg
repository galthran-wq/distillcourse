<svg viewBox="0 0 620 340" font-family="system-ui, sans-serif">
  <defs>
    <marker id="rm-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="currentColor" opacity="0.5"/>
    </marker>
    <marker id="rm-am" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#e2903a"/>
    </marker>
  </defs>

  <!-- the asset -->
  <rect x="150" y="14" width="320" height="46" rx="6" fill="none" stroke="currentColor" opacity="0.6"/>
  <text x="310" y="33" text-anchor="middle" font-size="12.5" font-weight="600" fill="currentColor">the asset: tens of millions of Indigenous subjects</text>
  <text x="310" y="50" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.55">no other European empire in the Americas had this</text>

  <!-- arrows to mechanisms -->
  <path d="M 230 60 L 115 108" fill="none" stroke="currentColor" opacity="0.5" marker-end="url(#rm-a)"/>
  <path d="M 310 60 L 310 108" fill="none" stroke="currentColor" opacity="0.5" marker-end="url(#rm-a)"/>
  <path d="M 390 60 L 505 108" fill="none" stroke="currentColor" opacity="0.5" marker-end="url(#rm-a)"/>

  <!-- three institutions -->
  <rect x="18" y="112" width="192" height="78" rx="6" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <text x="114" y="132" text-anchor="middle" font-size="12.5" font-weight="600" fill="#e2903a">encomienda</text>
  <text x="114" y="149" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.7">tribute and labor of a</text>
  <text x="114" y="162" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.7">named community —</text>
  <text x="114" y="175" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.7">people, not land</text>

  <rect x="214" y="112" width="192" height="78" rx="6" fill="none" stroke="#4c8dd6" stroke-width="1.5"/>
  <text x="310" y="132" text-anchor="middle" font-size="12.5" font-weight="600" fill="#4c8dd6">missions</text>
  <text x="310" y="149" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.7">friars concentrate converts</text>
  <text x="310" y="162" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.7">under church discipline —</text>
  <text x="310" y="175" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.7">the frontier instrument</text>

  <rect x="410" y="112" width="192" height="78" rx="6" fill="none" stroke="currentColor" opacity="0.6"/>
  <text x="506" y="132" text-anchor="middle" font-size="12.5" font-weight="600" fill="currentColor">sistema de castas</text>
  <text x="506" y="149" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.7">rank by ancestry: peninsulares →</text>
  <text x="506" y="162" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.7">criollos → mestizos →</text>
  <text x="506" y="175" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.7">Indigenous → enslaved</text>

  <!-- arrows to products -->
  <path d="M 114 190 L 150 248" fill="none" stroke="#e2903a" stroke-width="1.5" marker-end="url(#rm-am)"/>
  <path d="M 310 190 L 420 248" fill="none" stroke="currentColor" opacity="0.5" marker-end="url(#rm-a)"/>
  <path d="M 506 190 L 460 248" fill="none" stroke="currentColor" opacity="0.5" marker-end="url(#rm-a)"/>

  <!-- two products -->
  <rect x="52" y="252" width="230" height="64" rx="6" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <text x="167" y="272" text-anchor="middle" font-size="12" font-weight="600" fill="#e2903a">silver home under crown license</text>
  <text x="167" y="289" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.7">Potosí and Zacatecas; the treasure fleet</text>
  <text x="167" y="302" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.7">is the empire's spine</text>

  <rect x="330" y="252" width="240" height="64" rx="6" fill="none" stroke="currentColor" opacity="0.6"/>
  <text x="450" y="272" text-anchor="middle" font-size="12" font-weight="600" fill="currentColor">a hybrid, stratified society</text>
  <text x="450" y="289" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.7">225,000 migrants, mostly single men;</text>
  <text x="450" y="302" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.7">Mexico City on Tenochtitlán's ruins</text>
</svg>

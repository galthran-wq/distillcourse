<svg viewBox="0 0 640 470" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- column headers -->
  <rect x="130" y="16" width="160" height="30" rx="4" fill="#4c8dd6" opacity="0.18"/>
  <text x="210" y="36" font-size="13" font-weight="bold" fill="#4c8dd6" text-anchor="middle">New Spain</text>
  <rect x="298" y="16" width="160" height="30" rx="4" fill="#5aa46a" opacity="0.18"/>
  <text x="378" y="36" font-size="13" font-weight="bold" fill="#5aa46a" text-anchor="middle">New France</text>
  <rect x="466" y="16" width="160" height="30" rx="4" fill="#e2903a" opacity="0.18"/>
  <text x="546" y="36" font-size="13" font-weight="bold" fill="#e2903a" text-anchor="middle">New Netherland</text>

  <!-- row separators -->
  <line x1="14" y1="52" x2="626" y2="52" stroke="currentColor" opacity="0.2"/>
  <line x1="14" y1="122" x2="626" y2="122" stroke="currentColor" opacity="0.2"/>
  <line x1="14" y1="192" x2="626" y2="192" stroke="currentColor" opacity="0.2"/>
  <line x1="14" y1="262" x2="626" y2="262" stroke="currentColor" opacity="0.2"/>
  <line x1="14" y1="332" x2="626" y2="332" stroke="currentColor" opacity="0.2"/>
  <line x1="14" y1="402" x2="626" y2="402" stroke="currentColor" opacity="0.2"/>

  <!-- row: population -->
  <text x="18" y="80" font-size="11" font-weight="bold" fill="currentColor">population</text>
  <text x="18" y="94" font-size="10" fill="currentColor" opacity="0.55">inside the later</text>
  <text x="18" y="106" font-size="10" fill="currentColor" opacity="0.55">US, mid-1700s</text>
  <text x="210" y="80" font-size="11" fill="currentColor" text-anchor="middle">&#8776;10&#8211;20,000 in the</text>
  <text x="210" y="94" font-size="11" fill="currentColor" text-anchor="middle">borderlands (Mexico</text>
  <text x="210" y="108" font-size="11" fill="currentColor" text-anchor="middle">itself: millions)</text>
  <text x="378" y="80" font-size="11" fill="currentColor" text-anchor="middle">&lt;70,000 in all of</text>
  <text x="378" y="94" font-size="11" fill="currentColor" text-anchor="middle">New France by 1750</text>
  <text x="546" y="80" font-size="11" fill="currentColor" text-anchor="middle">&#8776;9,000 at the</text>
  <text x="546" y="94" font-size="11" fill="currentColor" text-anchor="middle">English takeover, 1664</text>

  <!-- row: labor -->
  <text x="18" y="152" font-size="11" font-weight="bold" fill="currentColor">labor system</text>
  <text x="210" y="146" font-size="11" fill="currentColor" text-anchor="middle">Indigenous tribute +</text>
  <text x="210" y="160" font-size="11" fill="currentColor" text-anchor="middle">labor draft (encomienda</text>
  <text x="210" y="174" font-size="11" fill="currentColor" text-anchor="middle">&#8594; repartimiento)</text>
  <text x="378" y="146" font-size="11" fill="currentColor" text-anchor="middle">Native trappers;</text>
  <text x="378" y="160" font-size="11" fill="currentColor" text-anchor="middle">French traders,</text>
  <text x="378" y="174" font-size="11" fill="currentColor" text-anchor="middle">boatmen, soldiers</text>
  <text x="546" y="146" font-size="11" fill="currentColor" text-anchor="middle">company employees,</text>
  <text x="546" y="160" font-size="11" fill="currentColor" text-anchor="middle">few tenants,</text>
  <text x="546" y="174" font-size="11" fill="currentColor" text-anchor="middle">enslaved Africans</text>

  <!-- row: church -->
  <text x="18" y="222" font-size="11" font-weight="bold" fill="currentColor">church</text>
  <text x="210" y="216" font-size="11" fill="currentColor" text-anchor="middle">state church;</text>
  <text x="210" y="230" font-size="11" fill="currentColor" text-anchor="middle">Franciscan missions</text>
  <text x="210" y="244" font-size="11" fill="currentColor" text-anchor="middle">concentrate converts</text>
  <text x="378" y="216" font-size="11" fill="currentColor" text-anchor="middle">Catholics only;</text>
  <text x="378" y="230" font-size="11" fill="currentColor" text-anchor="middle">Jesuits live among</text>
  <text x="378" y="244" font-size="11" fill="currentColor" text-anchor="middle">allied nations</text>
  <text x="546" y="216" font-size="11" fill="currentColor" text-anchor="middle">Reformed church official;</text>
  <text x="546" y="230" font-size="11" fill="currentColor" text-anchor="middle">toleration in practice</text>
  <text x="546" y="244" font-size="11" fill="currentColor" text-anchor="middle">(18 languages, 1643)</text>

  <!-- row: Native nations -->
  <text x="18" y="292" font-size="11" font-weight="bold" fill="currentColor">Native nations</text>
  <text x="210" y="286" font-size="11" fill="currentColor" text-anchor="middle">subjects: tribute,</text>
  <text x="210" y="300" font-size="11" fill="currentColor" text-anchor="middle">conversion,</text>
  <text x="210" y="314" font-size="11" fill="currentColor" text-anchor="middle">coerced labor</text>
  <text x="378" y="286" font-size="11" fill="currentColor" text-anchor="middle">allies: trade, gifts,</text>
  <text x="378" y="300" font-size="11" fill="currentColor" text-anchor="middle">marriage, shared war</text>
  <text x="378" y="314" font-size="11" fill="currentColor" text-anchor="middle">(the middle ground)</text>
  <text x="546" y="286" font-size="11" fill="currentColor" text-anchor="middle">trading partners upriver;</text>
  <text x="546" y="300" font-size="11" fill="currentColor" text-anchor="middle">war where farms spread</text>
  <text x="546" y="314" font-size="11" fill="currentColor" text-anchor="middle">(Kieft&#8217;s War, 1643&#8211;45)</text>

  <!-- row: export -->
  <text x="18" y="362" font-size="11" font-weight="bold" fill="currentColor">main export</text>
  <text x="210" y="362" font-size="11" fill="currentColor" text-anchor="middle">silver (from Mexico);</text>
  <text x="210" y="376" font-size="11" fill="currentColor" text-anchor="middle">hides on the frontier</text>
  <text x="378" y="362" font-size="11" fill="currentColor" text-anchor="middle">beaver pelts</text>
  <text x="546" y="362" font-size="11" fill="currentColor" text-anchor="middle">furs transshipped</text>
  <text x="546" y="376" font-size="11" fill="currentColor" text-anchor="middle">through Manhattan</text>

  <!-- summary row -->
  <text x="18" y="432" font-size="11" font-weight="bold" fill="currentColor">in one word</text>
  <text x="210" y="432" font-size="14" font-weight="bold" fill="#4c8dd6" text-anchor="middle">rule</text>
  <text x="378" y="432" font-size="14" font-weight="bold" fill="#5aa46a" text-anchor="middle">exchange</text>
  <text x="546" y="432" font-size="14" font-weight="bold" fill="#e2903a" text-anchor="middle">commerce</text>
  <text x="320" y="458" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">none of the three is built to mass-produce self-governing settler families</text>
</svg>

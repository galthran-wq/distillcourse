<svg viewBox="0 0 600 440" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="20" y="434" font-size="10.5" fill="currentColor" opacity="0.55">step 1 &#183; the definition</text>
  <rect x="130" y="14" width="340" height="100" rx="6" fill="none" stroke="currentColor" stroke-width="1.3"/>
  <text x="300" y="33" text-anchor="middle" font-size="12" font-weight="bold" fill="currentColor">a faction, defined (No. 10)</text>
  <g font-size="10.5" fill="currentColor" text-anchor="middle">
    <text x="300" y="50">'a number of citizens, whether amounting to a majority</text>
    <text x="300" y="63">or a minority of the whole,' united by 'some common</text>
    <text x="300" y="76">impulse of passion, or of interest, adversed to the</text>
    <text x="300" y="89">rights of other citizens, or to the permanent and</text>
    <text x="300" y="102">aggregate interests of the community'</text>
  </g>
</svg>

<svg viewBox="0 0 600 440" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="20" y="434" font-size="10.5" fill="currentColor" opacity="0.55">step 3 &#183; the remaining branch splits on size</text>
  <rect x="130" y="14" width="340" height="100" rx="6" fill="none" stroke="currentColor" stroke-width="1.3"/>
  <text x="300" y="33" text-anchor="middle" font-size="12" font-weight="bold" fill="currentColor">a faction, defined (No. 10)</text>
  <g font-size="10.5" fill="currentColor" text-anchor="middle">
    <text x="300" y="50">'a number of citizens, whether amounting to a majority</text>
    <text x="300" y="63">or a minority of the whole,' united by 'some common</text>
    <text x="300" y="76">impulse of passion, or of interest, adversed to the</text>
    <text x="300" y="89">rights of other citizens, or to the permanent and</text>
    <text x="300" y="102">aggregate interests of the community'</text>
  </g>
  <g stroke="currentColor" stroke-width="1.2" fill="none">
    <line x1="240" y1="114" x2="160" y2="144"/>
    <path d="M 160 144 l 8 -6 M 160 144 l 2 -10" />
    <line x1="360" y1="114" x2="440" y2="144"/>
    <path d="M 440 144 l -8 -6 M 440 144 l -2 -10" />
  </g>
  <rect x="45" y="148" width="225" height="34" rx="5" fill="none" stroke="currentColor" stroke-width="1.3"/>
  <text x="157" y="169" text-anchor="middle" font-size="12" font-weight="bold" fill="currentColor">Cure 1: remove its causes</text>
  <rect x="330" y="148" width="225" height="34" rx="5" fill="none" stroke="currentColor" stroke-width="1.3"/>
  <text x="442" y="169" text-anchor="middle" font-size="12" font-weight="bold" fill="currentColor">Cure 2: control its effects</text>
  <g stroke="currentColor" stroke-width="1.2" fill="none">
    <line x1="110" y1="182" x2="90" y2="210"/>
    <path d="M 90 210 l 8 -5 M 90 210 l 1 -10" />
    <line x1="205" y1="182" x2="225" y2="210"/>
    <path d="M 225 210 l -8 -5 M 225 210 l -1 -10" />
  </g>
  <rect x="25" y="214" width="125" height="92" rx="5" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <g font-size="10.5" fill="currentColor" text-anchor="middle">
    <text x="87" y="234">destroy the liberty</text>
    <text x="87" y="247">that feeds it</text>
    <text x="87" y="272">'worse than</text>
    <text x="87" y="285">the disease'</text>
  </g>
  <line x1="30" y1="298" x2="145" y2="222" stroke="currentColor" stroke-width="1.5" opacity="0.65"/>
  <rect x="165" y="214" width="125" height="92" rx="5" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <g font-size="10.5" fill="currentColor" text-anchor="middle">
    <text x="227" y="232">give every citizen</text>
    <text x="227" y="245">'the same opinions,</text>
    <text x="227" y="258">the same passions,</text>
    <text x="227" y="271">and the same interests'</text>
    <text x="227" y="290">'impracticable'</text>
  </g>
  <line x1="170" y1="298" x2="285" y2="222" stroke="currentColor" stroke-width="1.5" opacity="0.65"/>
  <g stroke="currentColor" stroke-width="1.2" fill="none">
    <line x1="410" y1="182" x2="380" y2="210"/>
    <path d="M 380 210 l 9 -4 M 380 210 l 2 -10" />
    <line x1="475" y1="182" x2="507" y2="210"/>
    <path d="M 507 210 l -9 -4 M 507 210 l -2 -10" />
  </g>
  <rect x="318" y="214" width="115" height="92" rx="5" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <g font-size="10.5" fill="currentColor" text-anchor="middle">
    <text x="375" y="240">a minority faction:</text>
    <text x="375" y="253">outvoted by 'the</text>
    <text x="375" y="266">republican principle'</text>
    <text x="375" y="286" opacity="0.55">(regular vote)</text>
  </g>
  <rect x="447" y="214" width="128" height="92" rx="5" fill="none" stroke="#e2903a" stroke-width="1.8"/>
  <g font-size="10.5" fill="currentColor" text-anchor="middle">
    <text x="511" y="236" font-weight="bold">a majority faction:</text>
    <text x="511" y="252">'the great object to</text>
    <text x="511" y="265">which our inquiries</text>
    <text x="511" y="278">are directed'</text>
  </g>
</svg>

<svg viewBox="0 0 620 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="310" y="26" text-anchor="middle" font-size="11" fill="currentColor">'three sources of vague and incorrect definitions' (No. 37)</text>

  <rect x="24" y="44" width="300" height="62" rx="6" fill="none" stroke="#4c8dd6" stroke-width="1.6"/>
  <text x="174" y="66" text-anchor="middle" font-size="12" font-weight="bold" fill="#4c8dd6">indistinctness of the object</text>
  <text x="174" y="84" text-anchor="middle" font-size="10.5" fill="currentColor">no science has yet marked the boundaries</text>
  <text x="174" y="98" text-anchor="middle" font-size="10.5" fill="currentColor">of government's 'three great provinces'</text>

  <rect x="24" y="120" width="300" height="62" rx="6" fill="none" stroke="#4c8dd6" stroke-width="1.6"/>
  <text x="174" y="142" text-anchor="middle" font-size="12" font-weight="bold" fill="#4c8dd6">imperfection of the organ of conception</text>
  <text x="174" y="160" text-anchor="middle" font-size="10.5" fill="currentColor">the framers' own grasp of the design</text>
  <text x="174" y="174" text-anchor="middle" font-size="10.5" fill="currentColor">is fallible</text>

  <rect x="24" y="196" width="300" height="62" rx="6" fill="none" stroke="#4c8dd6" stroke-width="1.6"/>
  <text x="174" y="218" text-anchor="middle" font-size="12" font-weight="bold" fill="#4c8dd6">inadequateness of the vehicle of ideas</text>
  <text x="174" y="236" text-anchor="middle" font-size="10.5" fill="currentColor">'no language is so copious as to supply</text>
  <text x="174" y="250" text-anchor="middle" font-size="10.5" fill="currentColor">words and phrases for every complex idea'</text>

  <path d="M 328 75 L 396 132" fill="none" stroke="currentColor" stroke-width="1.4" opacity="0.6"/>
  <path d="M 399 135 l -10 -3 M 399 135 l -4 -10" stroke="currentColor" stroke-width="1.4" fill="none" opacity="0.6"/>
  <path d="M 328 151 L 396 151" fill="none" stroke="currentColor" stroke-width="1.4" opacity="0.6"/>
  <path d="M 400 151 l -9 -6 M 400 151 l -9 6" stroke="currentColor" stroke-width="1.4" fill="none" opacity="0.6"/>
  <path d="M 328 227 L 396 170" fill="none" stroke="currentColor" stroke-width="1.4" opacity="0.6"/>
  <path d="M 399 167 l -10 3 M 399 167 l -4 10" stroke="currentColor" stroke-width="1.4" fill="none" opacity="0.6"/>

  <rect x="404" y="106" width="192" height="90" rx="6" fill="none" stroke="#e2903a" stroke-width="1.8"/>
  <text x="500" y="132" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#e2903a">the ratified text</text>
  <text x="500" y="152" text-anchor="middle" font-size="10.5" fill="currentColor">unavoidably imprecise,</text>
  <text x="500" y="166" text-anchor="middle" font-size="10.5" fill="currentColor">even if the design</text>
  <text x="500" y="180" text-anchor="middle" font-size="10.5" fill="currentColor">were faultless</text>

  <text x="310" y="284" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.55">the warrant beneath No. 85: demand a repair mechanism, not a perfect text</text>
</svg>

<svg viewBox="0 0 620 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="310" y="24" text-anchor="middle" font-size="11" fill="currentColor">the departments are not equal: opposite defects, opposite remedies (No. 51)</text>

  <rect x="40" y="44" width="240" height="62" rx="6" fill="none" stroke="#e2903a" stroke-width="1.8"/>
  <text x="160" y="68" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#e2903a">the legislature</text>
  <text x="160" y="88" text-anchor="middle" font-size="10.5" fill="currentColor">'necessarily predominates'</text>

  <rect x="340" y="44" width="240" height="62" rx="6" fill="none" stroke="#4c8dd6" stroke-width="1.6"/>
  <text x="460" y="68" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4c8dd6">the executive</text>
  <text x="460" y="88" text-anchor="middle" font-size="10.5" fill="currentColor">comparatively weak</text>

  <line x1="160" y1="106" x2="160" y2="138" stroke="currentColor" stroke-width="1.4" opacity="0.6"/>
  <path d="M 160 142 l -4 -8 M 160 142 l 4 -8" stroke="currentColor" stroke-width="1.4" fill="none" opacity="0.6"/>
  <text x="168" y="128" font-size="10" fill="currentColor" opacity="0.55">remedy: divide it</text>

  <line x1="460" y1="106" x2="460" y2="138" stroke="currentColor" stroke-width="1.4" opacity="0.6"/>
  <path d="M 460 142 l -4 -8 M 460 142 l 4 -8" stroke="currentColor" stroke-width="1.4" fill="none" opacity="0.6"/>
  <text x="468" y="128" font-size="10" fill="currentColor" opacity="0.55">remedy: fortify it</text>

  <rect x="40" y="146" width="112" height="40" rx="4" fill="none" stroke="#e2903a" stroke-width="1.4"/>
  <text x="96" y="170" text-anchor="middle" font-size="11.5" fill="#e2903a">House</text>
  <rect x="168" y="146" width="112" height="40" rx="4" fill="none" stroke="#e2903a" stroke-width="1.4"/>
  <text x="224" y="170" text-anchor="middle" font-size="11.5" fill="#e2903a">Senate</text>
  <text x="160" y="204" text-anchor="middle" font-size="10" fill="currentColor">'different modes of election and</text>
  <text x="160" y="217" text-anchor="middle" font-size="10" fill="currentColor">different principles of action ...</text>
  <text x="160" y="230" text-anchor="middle" font-size="10" fill="currentColor">as little connected with each other'</text>

  <rect x="340" y="146" width="240" height="40" rx="4" fill="none" stroke="#4c8dd6" stroke-width="1.4"/>
  <text x="460" y="170" text-anchor="middle" font-size="11.5" fill="#4c8dd6">the veto</text>
  <text x="460" y="204" text-anchor="middle" font-size="10" fill="currentColor">absolute negative rejected: 'neither</text>
  <text x="460" y="217" text-anchor="middle" font-size="10" fill="currentColor">altogether safe nor alone sufficient' &#8594;</text>
  <text x="460" y="230" text-anchor="middle" font-size="10" fill="currentColor">a qualified veto, two-thirds override</text>

  <text x="310" y="266" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.55">weaken the strong branch by division; arm the weak branch with a defensive tool</text>
  <text x="310" y="282" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.55">plus a 'qualified connection' leading the Senate to support the executive's constitutional rights</text>
</svg>

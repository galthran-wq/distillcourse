<svg viewBox="0 0 620 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="310" y="26" text-anchor="middle" font-size="11" fill="currentColor">'the necessary constitutional means and personal motives to resist encroachments' (No. 51)</text>

  <rect x="30" y="46" width="260" height="88" rx="6" fill="none" stroke="#4c8dd6" stroke-width="1.6"/>
  <text x="160" y="70" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4c8dd6">constitutional MEANS</text>
  <text x="160" y="90" text-anchor="middle" font-size="10.5" fill="currentColor">tools attached to the office:</text>
  <text x="160" y="104" text-anchor="middle" font-size="10.5" fill="currentColor">the veto, the divided legislature,</text>
  <text x="160" y="118" text-anchor="middle" font-size="10.5" fill="currentColor">separate modes of election</text>

  <rect x="330" y="46" width="260" height="88" rx="6" fill="none" stroke="#4c8dd6" stroke-width="1.6"/>
  <text x="460" y="70" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4c8dd6">personal MOTIVES</text>
  <text x="460" y="90" text-anchor="middle" font-size="10.5" fill="currentColor">'the interest of the man ...</text>
  <text x="460" y="104" text-anchor="middle" font-size="10.5" fill="currentColor">connected with the constitutional</text>
  <text x="460" y="118" text-anchor="middle" font-size="10.5" fill="currentColor">rights of the place'</text>

  <text x="160" y="154" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.55">alone: a power nobody uses</text>
  <text x="460" y="154" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.55">alone: ambition with no tool</text>

  <path d="M 160 162 L 160 182 L 244 200" fill="none" stroke="currentColor" stroke-width="1.4" opacity="0.6"/>
  <path d="M 248 202 l -11 -1 M 248 202 l -7 -8" stroke="currentColor" stroke-width="1.4" fill="none" opacity="0.6"/>
  <path d="M 460 162 L 460 182 L 376 200" fill="none" stroke="currentColor" stroke-width="1.4" opacity="0.6"/>
  <path d="M 372 202 l 11 -1 M 372 202 l 7 -8" stroke="currentColor" stroke-width="1.4" fill="none" opacity="0.6"/>

  <rect x="150" y="196" width="320" height="72" rx="6" fill="none" stroke="#e2903a" stroke-width="1.8"/>
  <text x="310" y="220" text-anchor="middle" font-size="12" font-weight="bold" fill="#e2903a">each department defends its own boundaries</text>
  <text x="310" y="240" text-anchor="middle" font-size="10.5" fill="currentColor">'Ambition must be made to counteract ambition.</text>
  <text x="310" y="254" text-anchor="middle" font-size="10.5" fill="currentColor">The interest of the man must be connected with the ... rights of the place.'</text>

  <text x="310" y="296" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.55">first line: 'dependence on the people' &#183; this machinery: the 'auxiliary precautions'</text>
</svg>

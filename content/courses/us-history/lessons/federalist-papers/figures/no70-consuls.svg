<svg viewBox="0 0 620 240" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <rect x="24" y="40" width="200" height="96" rx="6" fill="none" stroke="currentColor" stroke-width="1.6"/>
  <text x="124" y="64" text-anchor="middle" font-size="12" font-weight="bold" fill="currentColor">the adverse precedent</text>
  <text x="124" y="84" text-anchor="middle" font-size="10.5" fill="currentColor">Rome: two consuls,</text>
  <text x="124" y="98" text-anchor="middle" font-size="10.5" fill="currentColor">centuries of survival</text>
  <text x="124" y="118" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.55">'a matter of astonishment'</text>

  <line x1="224" y1="88" x2="264" y2="88" stroke="currentColor" stroke-width="1.4" opacity="0.6"/>
  <path d="M 268 88 l -8 -4 M 268 88 l -8 4" stroke="currentColor" stroke-width="1.4" fill="none" opacity="0.6"/>

  <text x="404" y="30" text-anchor="middle" font-size="10.5" fill="#e2903a">the two distinguishing conditions</text>
  <rect x="272" y="40" width="264" height="44" rx="4" fill="none" stroke="#e2903a" stroke-width="1.6"/>
  <text x="404" y="58" text-anchor="middle" font-size="10.5" fill="currentColor">class interest: both usually patricians,</text>
  <text x="404" y="72" text-anchor="middle" font-size="10.5" fill="currentColor">united against the plebeians</text>
  <rect x="272" y="92" width="264" height="44" rx="4" fill="none" stroke="#e2903a" stroke-width="1.6"/>
  <text x="404" y="110" text-anchor="middle" font-size="10.5" fill="currentColor">commands divided by lot: one consul took</text>
  <text x="404" y="124" text-anchor="middle" font-size="10.5" fill="currentColor">Rome, the other the provinces</text>

  <line x1="404" y1="136" x2="404" y2="162" stroke="currentColor" stroke-width="1.4" opacity="0.6"/>
  <path d="M 404 166 l -4 -8 M 404 166 l 4 -8" stroke="currentColor" stroke-width="1.4" fill="none" opacity="0.6"/>

  <rect x="244" y="170" width="320" height="52" rx="6" fill="none" stroke="#4c8dd6" stroke-width="1.8"/>
  <text x="404" y="192" text-anchor="middle" font-size="12" font-weight="bold" fill="#4c8dd6">confined, not denied</text>
  <text x="404" y="210" text-anchor="middle" font-size="10.5" fill="currentColor">conditions the United States would not reproduce</text>
</svg>

<svg viewBox="0 0 620 340" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="30" y="30" font-size="12" font-weight="bold" fill="#e2903a">unity gives</text>
  <text x="30" y="45" font-size="10" fill="currentColor" opacity="0.55">one President (Art. II)</text>
  <text x="250" y="30" font-size="12" font-weight="bold" fill="currentColor" opacity="0.7">plurality produces</text>
  <text x="250" y="45" font-size="10" fill="currentColor" opacity="0.55">two consuls, or an executive council</text>
  <line x1="230" y1="56" x2="230" y2="298" stroke="currentColor" stroke-width="1" stroke-dasharray="3 3" opacity="0.5"/>

  <g stroke="currentColor" stroke-width="1" opacity="0.2">
    <line x1="20" y1="60" x2="600" y2="60"/>
    <line x1="20" y1="108" x2="600" y2="108"/>
    <line x1="20" y1="156" x2="600" y2="156"/>
    <line x1="20" y1="204" x2="600" y2="204"/>
    <line x1="20" y1="252" x2="600" y2="252"/>
    <line x1="20" y1="298" x2="600" y2="298"/>
  </g>

  <text x="30" y="88" font-size="13" font-weight="bold" fill="#e2903a">decision</text>
  <text x="250" y="80" font-size="10.5" fill="currentColor">'the most bitter dissensions' between equals</text>
  <text x="250" y="94" font-size="10.5" fill="currentColor">'impede or frustrate the most important measures'</text>

  <text x="30" y="136" font-size="13" font-weight="bold" fill="#e2903a">activity</text>
  <text x="250" y="128" font-size="10.5" fill="currentColor">'a spirit of habitual feebleness and dilatoriness,'</text>
  <text x="250" y="142" font-size="10.5" fill="currentColor">even where no 'artful cabal' forms</text>

  <text x="30" y="184" font-size="13" font-weight="bold" fill="#e2903a">secrecy</text>
  <text x="250" y="176" font-size="10.5" fill="currentColor">every counsellor whose concurrence is required</text>
  <text x="250" y="190" font-size="10.5" fill="currentColor">is another keeper of the plan</text>

  <text x="30" y="232" font-size="13" font-weight="bold" fill="#e2903a">despatch</text>
  <text x="250" y="224" font-size="10.5" fill="currentColor">nothing moves until colleagues agree, 'from the</text>
  <text x="250" y="238" font-size="10.5" fill="currentColor">first step to the final conclusion'</text>

  <text x="30" y="272" font-size="13" font-weight="bold" fill="#e2903a">responsibility</text>
  <text x="30" y="287" font-size="10" fill="currentColor" opacity="0.55">the safety argument</text>
  <text x="250" y="272" font-size="10.5" fill="currentColor">blame 'shifted from one to another':</text>
  <text x="250" y="286" font-size="10.5" fill="currentColor">'I was overruled by my council.'</text>

  <text x="310" y="325" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">'the executive power is more easily confined when it is ONE' (No. 70)</text>
</svg>

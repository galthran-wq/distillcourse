<svg viewBox="0 0 560 470" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <rect x="60" y="16" width="440" height="74" rx="6" fill="none" stroke="currentColor" stroke-width="1.3"/>
  <text x="280" y="38" text-anchor="middle" font-size="11.5" font-weight="bold" fill="currentColor">step 1 &#183; what the Constitution is</text>
  <text x="280" y="56" text-anchor="middle" font-size="10.5" fill="currentColor">'a fundamental law': the people's own act, a commission</text>
  <text x="280" y="70" text-anchor="middle" font-size="10.5" fill="currentColor">setting the limits of their agents' authority</text>
  <line x1="280" y1="90" x2="280" y2="114" stroke="currentColor" stroke-width="1.2"/>
  <path d="M 280 114 l -5 -8 M 280 114 l 5 -8" stroke="currentColor" stroke-width="1.2" fill="none"/>

  <rect x="60" y="118" width="440" height="74" rx="6" fill="none" stroke="currentColor" stroke-width="1.3"/>
  <text x="280" y="140" text-anchor="middle" font-size="11.5" font-weight="bold" fill="currentColor">step 2 &#183; what a statute is</text>
  <text x="280" y="158" text-anchor="middle" font-size="10.5" fill="currentColor">the act of a delegated authority: 'every act of a delegated authority,</text>
  <text x="280" y="172" text-anchor="middle" font-size="10.5" fill="currentColor">contrary to the tenor of the commission under which it is exercised, is void'</text>
  <line x1="280" y1="192" x2="280" y2="216" stroke="currentColor" stroke-width="1.2"/>
  <path d="M 280 216 l -5 -8 M 280 216 l 5 -8" stroke="currentColor" stroke-width="1.2" fill="none"/>

  <rect x="60" y="220" width="440" height="74" rx="6" fill="none" stroke="currentColor" stroke-width="1.3"/>
  <text x="280" y="242" text-anchor="middle" font-size="11.5" font-weight="bold" fill="currentColor">step 3 &#183; the conflict rule</text>
  <text x="280" y="260" text-anchor="middle" font-size="10.5" fill="currentColor">'the Constitution ought to be preferred to the statute,</text>
  <text x="280" y="274" text-anchor="middle" font-size="10.5" fill="currentColor">the intention of the people to the intention of their agents'</text>
  <line x1="280" y1="294" x2="280" y2="318" stroke="currentColor" stroke-width="1.2"/>
  <path d="M 280 318 l -5 -8 M 280 318 l 5 -8" stroke="currentColor" stroke-width="1.2" fill="none"/>

  <rect x="60" y="322" width="440" height="80" rx="6" fill="none" stroke="#e2903a" stroke-width="2.2"/>
  <text x="280" y="346" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#e2903a">conclusion &#183; judicial review</text>
  <text x="280" y="364" text-anchor="middle" font-size="10.5" fill="currentColor">courts, whose 'proper and peculiar province' is 'the interpretation</text>
  <text x="280" y="378" text-anchor="middle" font-size="10.5" fill="currentColor">of the laws,' must disregard a statute repugnant to the Constitution</text>
  <text x="280" y="430" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.55">not judicial supremacy: 'It only supposes that the power</text>
  <text x="280" y="444" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.55">of the people is superior to both.'</text>
</svg>

<svg viewBox="0 0 640 290" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="320" y="30" text-anchor="middle" font-size="11.5" fill="currentColor">the drafters' answer to No. 84, written as a rule of construction</text>

  <rect x="20" y="48" width="280" height="200" rx="6" fill="none" stroke="#4c8dd6" stroke-width="1.6"/>
  <text x="160" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#4c8dd6">Hamilton, No. 84 &#183; 1788</text>
  <g font-size="10.5" fill="currentColor" text-anchor="middle">
    <text x="160" y="96">rights declarations 'would contain</text>
    <text x="160" y="110">various exceptions to powers not</text>
    <text x="160" y="124">granted; and, on this very account,</text>
    <text x="160" y="138">would afford a colorable pretext</text>
    <text x="160" y="152">to claim more than were granted'</text>
    <text x="160" y="180">'For why declare that things shall</text>
    <text x="160" y="194">not be done which there is</text>
    <text x="160" y="208">no power to do?'</text>
  </g>

  <line x1="304" y1="148" x2="332" y2="148" stroke="#e2903a" stroke-width="2.2"/>
  <path d="M 336 148 l -9 -6 M 336 148 l -9 6" stroke="#e2903a" stroke-width="2.2" fill="none"/>

  <rect x="340" y="48" width="280" height="200" rx="6" fill="none" stroke="#e2903a" stroke-width="1.6"/>
  <text x="480" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#e2903a">Ninth Amendment &#183; 1791</text>
  <g font-size="11" fill="currentColor" text-anchor="middle">
    <text x="480" y="106">'The enumeration in the</text>
    <text x="480" y="122">Constitution, of certain rights,</text>
    <text x="480" y="138">shall not be construed to deny</text>
    <text x="480" y="154">or disparage others retained</text>
    <text x="480" y="170">by the people.'</text>
  </g>
  <text x="480" y="206" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.55">enumeration licenses no inference</text>
  <text x="480" y="220" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.55">about the unenumerated</text>

  <text x="320" y="274" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.55">what it does not supply: an enforcement mechanism for the rights it protects</text>
</svg>

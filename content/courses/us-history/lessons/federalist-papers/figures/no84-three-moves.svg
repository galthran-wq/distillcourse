<svg viewBox="0 0 620 290" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <path d="M 60 160 L 300 100 L 520 44" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.5"/>
  <path d="M 524 43 l -10 -1 M 524 43 l -6 8" stroke="currentColor" stroke-width="1.2" fill="none" opacity="0.5"/>
  <text x="290" y="60" font-size="10.5" fill="currentColor" opacity="0.55">ascending ambition</text>

  <rect x="20" y="170" width="180" height="76" rx="6" fill="none" stroke="currentColor" stroke-width="1.6"/>
  <text x="110" y="190" text-anchor="middle" font-size="12" font-weight="bold" fill="currentColor">1 &#183; inventory</text>
  <text x="110" y="208" text-anchor="middle" font-size="10" fill="currentColor">the text already protects rights:</text>
  <text x="110" y="221" text-anchor="middle" font-size="10" fill="currentColor">habeas corpus, no attainder, no</text>
  <text x="110" y="234" text-anchor="middle" font-size="10" fill="currentColor">ex post facto, jury trial, no titles</text>
  <text x="110" y="262" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.55">a bill of rights is unnecessary</text>

  <rect x="220" y="110" width="180" height="76" rx="6" fill="none" stroke="currentColor" stroke-width="1.6"/>
  <text x="310" y="130" text-anchor="middle" font-size="12" font-weight="bold" fill="currentColor">2 &#183; genealogy</text>
  <text x="310" y="148" text-anchor="middle" font-size="10" fill="currentColor">bills of rights are 'stipulations</text>
  <text x="310" y="161" text-anchor="middle" font-size="10" fill="currentColor">between kings and their subjects';</text>
  <text x="310" y="174" text-anchor="middle" font-size="10" fill="currentColor">'the people surrender nothing'</text>
  <text x="310" y="202" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.55">the genre does not apply</text>

  <rect x="420" y="50" width="180" height="76" rx="6" fill="none" stroke="#e2903a" stroke-width="1.8"/>
  <text x="510" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#e2903a">3 &#183; danger</text>
  <text x="510" y="88" text-anchor="middle" font-size="10" fill="currentColor">exceptions to 'powers not granted'</text>
  <text x="510" y="101" text-anchor="middle" font-size="10" fill="currentColor">afford 'a colorable pretext to</text>
  <text x="510" y="114" text-anchor="middle" font-size="10" fill="currentColor">claim more than were granted'</text>
  <text x="510" y="142" text-anchor="middle" font-size="10" fill="#e2903a">a bill of rights would do harm</text>
</svg>

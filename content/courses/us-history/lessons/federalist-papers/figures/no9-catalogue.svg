<svg viewBox="0 0 620 250" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="310" y="24" text-anchor="middle" font-size="11" fill="currentColor">No. 9: improvements 'either not known at all, or imperfectly known to the ancients'</text>

  <g font-size="11.5" fill="currentColor">
    <text x="30" y="62">'distribution of power into distinct departments'</text>
    <text x="30" y="98">'legislative balances and checks'</text>
    <text x="30" y="134">judges 'holding their offices during good behavior'</text>
    <text x="30" y="170">representation 'by deputies of their own election'</text>
    <text x="30" y="206">'the ENLARGEMENT of the ORBIT'</text>
  </g>

  <g stroke="currentColor" stroke-width="1.2" opacity="0.5">
    <line x1="360" y1="58" x2="466" y2="74"/>
    <line x1="288" y1="94" x2="466" y2="84"/>
    <line x1="384" y1="130" x2="466" y2="130"/>
    <line x1="376" y1="166" x2="466" y2="180"/>
    <line x1="266" y1="202" x2="466" y2="190"/>
  </g>

  <rect x="470" y="56" width="120" height="44" rx="6" fill="none" stroke="#e2903a" stroke-width="1.6"/>
  <text x="530" y="82" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#e2903a">No. 51</text>

  <rect x="470" y="112" width="120" height="36" rx="6" fill="none" stroke="#e2903a" stroke-width="1.6"/>
  <text x="530" y="134" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#e2903a">No. 78</text>

  <rect x="470" y="162" width="120" height="44" rx="6" fill="none" stroke="#e2903a" stroke-width="1.6"/>
  <text x="530" y="188" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#e2903a">No. 10</text>

  <text x="310" y="238" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.55">the two items the ancients lacked entirely, representation and scale, are No. 10's whole cure</text>
</svg>

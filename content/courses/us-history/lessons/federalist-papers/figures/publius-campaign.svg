<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- top lane: Publius -->
  <text x="70" y="40" font-size="12" font-weight="bold" fill="currentColor">Publius: 85 essays</text>
  <text x="112" y="54" font-size="10.5" fill="currentColor" opacity="0.55">Nos. 1&#8211;77 in three New York papers, up to four a week</text>
  <rect x="112" y="58" width="260" height="13" rx="3" fill="#e2903a"/>
  <text x="112" y="84" font-size="10" fill="currentColor" opacity="0.55">No. 1 &#183; Oct 27</text>
  <text x="346" y="84" text-anchor="end" font-size="10" fill="currentColor" opacity="0.55">No. 77 &#183; Apr 2</text>
  <!-- McLean edition markers -->
  <line x1="354" y1="58" x2="354" y2="96" stroke="currentColor" stroke-width="1.2"/>
  <text x="248" y="108" font-size="10.5" fill="currentColor">McLean Vol. I &#183; Mar 22</text>
  <line x1="463" y1="58" x2="463" y2="112" stroke="#e2903a" stroke-width="1.4"/>
  <text x="352" y="124" font-size="10.5" fill="#e2903a">McLean Vol. II &#183; May 28: Nos. 78&#8211;85 appear here first,</text>
  <text x="352" y="137" font-size="10.5" fill="#e2903a">then run in the papers Jun 14&#8211;Aug 16 (dashed bar)</text>
  <rect x="492" y="58" width="102" height="13" rx="3" fill="none" stroke="#e2903a" stroke-width="1.4" stroke-dasharray="3 3"/>
  <!-- guide from Vol II down to convention lane -->
  <line x1="463" y1="112" x2="463" y2="236" stroke="currentColor" stroke-width="1" stroke-dasharray="3 3" opacity="0.3"/>

  <!-- bottom lane: ratification -->
  <text x="70" y="172" font-size="12" font-weight="bold" fill="currentColor">ratification votes</text>
  <g stroke="currentColor" stroke-width="1.2">
    <line x1="180" y1="180" x2="180" y2="194"/>
    <line x1="188" y1="180" x2="188" y2="194"/>
    <line x1="197" y1="180" x2="197" y2="194"/>
    <line x1="222" y1="180" x2="222" y2="194"/>
    <line x1="233" y1="180" x2="233" y2="194"/>
    <line x1="278" y1="180" x2="278" y2="194"/>
    <line x1="415" y1="180" x2="415" y2="194"/>
    <line x1="455" y1="180" x2="455" y2="194"/>
    <line x1="503" y1="180" x2="503" y2="194"/>
    <line x1="510" y1="180" x2="510" y2="194"/>
    <line x1="560" y1="180" x2="560" y2="194" stroke-width="2"/>
  </g>
  <g font-size="10" fill="currentColor">
    <text x="180" y="206" text-anchor="middle">DE</text>
    <text x="190" y="218" text-anchor="middle">PA</text>
    <text x="200" y="230" text-anchor="middle">NJ</text>
    <text x="222" y="206" text-anchor="middle">GA</text>
    <text x="235" y="218" text-anchor="middle">CT</text>
    <text x="278" y="206" text-anchor="middle">MA</text>
    <text x="415" y="206" text-anchor="middle">MD</text>
    <text x="455" y="206" text-anchor="middle">SC</text>
    <text x="497" y="206" text-anchor="middle">NH (9th)</text>
    <text x="513" y="218" text-anchor="middle">VA</text>
    <text x="563" y="206" text-anchor="middle" font-weight="bold">NY 30&#8211;27</text>
  </g>
  <rect x="497" y="236" width="63" height="10" rx="3" fill="#4c8dd6"/>
  <text x="490" y="245" text-anchor="end" font-size="10" fill="#4c8dd6">New York convention, Poughkeepsie &#183; Jun 17&#8211;Jul 26</text>

  <!-- month axis -->
  <line x1="70" y1="262" x2="620" y2="262" stroke="currentColor" stroke-width="1"/>
  <g font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">
    <text x="95" y="276">Oct</text>
    <text x="145" y="276">Nov</text>
    <text x="195" y="276">Dec</text>
    <text x="245" y="276">Jan</text>
    <text x="295" y="276">Feb</text>
    <text x="345" y="276">Mar</text>
    <text x="395" y="276">Apr</text>
    <text x="445" y="276">May</text>
    <text x="495" y="276">Jun</text>
    <text x="545" y="276">Jul</text>
    <text x="595" y="276">Aug</text>
    <text x="120" y="291">1787</text>
    <text x="245" y="291">1788</text>
  </g>
</svg>

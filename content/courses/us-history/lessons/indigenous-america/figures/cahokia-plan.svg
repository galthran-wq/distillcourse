<svg viewBox="0 0 560 380" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .rule { stroke: currentColor; fill: none; }
    .mound { fill: #e2903a; }
    .small { fill: currentColor; opacity: 0.7; }
  </style>

  <text class="label" x="20" y="22" font-weight="600">Cahokia, central precinct, about 1100 CE</text>

  <!-- palisade -->
  <rect class="rule" x="100" y="44" width="360" height="290" rx="6" stroke-width="2"/>
  <line class="rule" x1="70" y1="60" x2="100" y2="60" stroke-width="1"/>
  <text class="muted" x="66" y="57" text-anchor="end">palisade</text>
  <text class="muted" x="66" y="71" text-anchor="end">3.2 km,</text>
  <text class="muted" x="66" y="84" text-anchor="end">~20,000 logs</text>

  <!-- Monks Mound -->
  <rect class="mound" x="224" y="56" width="122" height="85" rx="2"/>
  <text class="label" x="356" y="84">Monks Mound</text>
  <text class="muted" x="356" y="99">305 × 213 m,</text>
  <text class="muted" x="356" y="113">30 m high</text>

  <!-- Grand Plaza -->
  <rect class="rule" x="216" y="150" width="180" height="175" stroke-dasharray="3 3" opacity="0.5"/>
  <text class="label" x="306" y="240" text-anchor="middle">Grand Plaza</text>
  <text class="muted" x="306" y="256" text-anchor="middle">20 ha, leveled and filled</text>

  <!-- other mounds -->
  <g class="small">
    <rect x="112" y="70" width="10" height="8" rx="1"/>
    <rect x="140" y="105" width="10" height="8" rx="1"/>
    <rect x="118" y="145" width="10" height="8" rx="1"/>
    <rect x="148" y="185" width="10" height="8" rx="1"/>
    <rect x="115" y="225" width="10" height="8" rx="1"/>
    <rect x="142" y="265" width="10" height="8" rx="1"/>
    <rect x="120" y="300" width="10" height="8" rx="1"/>
    <rect x="168" y="316" width="10" height="8" rx="1"/>
    <rect x="410" y="170" width="10" height="8" rx="1"/>
    <rect x="432" y="205" width="10" height="8" rx="1"/>
    <rect x="405" y="245" width="10" height="8" rx="1"/>
    <rect x="428" y="285" width="10" height="8" rx="1"/>
    <rect x="410" y="315" width="10" height="8" rx="1"/>
  </g>

  <!-- scale bar -->
  <line class="rule" x1="100" y1="356" x2="300" y2="356" stroke-width="2"/>
  <line class="rule" x1="100" y1="350" x2="100" y2="362" stroke-width="2"/>
  <line class="rule" x1="300" y1="350" x2="300" y2="362" stroke-width="2"/>
  <text class="muted" x="200" y="375" text-anchor="middle">500 m</text>
  <text class="muted" x="320" y="375">small squares: 12 of about 120 mounds</text>
</svg>

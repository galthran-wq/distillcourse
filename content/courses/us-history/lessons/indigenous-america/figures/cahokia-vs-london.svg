<svg viewBox="0 0 300 230" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .rule { stroke: currentColor; fill: none; }
    .a { fill: #e2903a; }
    .b { fill: #4c8dd6; }
  </style>

  <text class="muted" x="10" y="18">peak population estimate</text>

  <!-- gridlines -->
  <line class="rule" x1="45" y1="68" x2="285" y2="68" stroke-dasharray="3 3" opacity="0.3"/>
  <line class="rule" x1="45" y1="124" x2="285" y2="124" stroke-dasharray="3 3" opacity="0.3"/>
  <line class="rule" x1="45" y1="180" x2="285" y2="180" stroke-width="1.5"/>
  <text class="muted" x="40" y="72" text-anchor="end">20k</text>
  <text class="muted" x="40" y="128" text-anchor="end">10k</text>
  <text class="muted" x="40" y="184" text-anchor="end">0</text>

  <!-- bars -->
  <rect class="a" x="75" y="96" width="55" height="84" rx="2"/>
  <rect class="b" x="175" y="96" width="55" height="84" rx="2"/>

  <!-- estimate ranges -->
  <g class="rule" stroke-width="1.5">
    <line x1="102" y1="68" x2="102" y2="124"/>
    <line x1="94" y1="68" x2="110" y2="68"/>
    <line x1="94" y1="124" x2="110" y2="124"/>
    <line x1="202" y1="68" x2="202" y2="124"/>
    <line x1="194" y1="68" x2="210" y2="68"/>
    <line x1="194" y1="124" x2="210" y2="124"/>
  </g>

  <text class="label" x="102" y="199" text-anchor="middle">Cahokia</text>
  <text class="muted" x="102" y="213" text-anchor="middle">c. 1100</text>
  <text class="label" x="202" y="199" text-anchor="middle">London</text>
  <text class="muted" x="202" y="213" text-anchor="middle">c. 1100</text>
  <text class="muted" x="150" y="228" text-anchor="middle">bars: central estimate; whiskers: 10–20k, where most estimates cluster</text>
</svg>

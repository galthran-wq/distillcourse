<svg viewBox="0 0 560 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .rule { stroke: currentColor; fill: none; }
    .bar { fill: #e2903a; }
  </style>

  <text class="label" x="20" y="22" font-weight="600">Indigenous population of central Mexico</text>
  <text class="muted" x="20" y="38">Cook &amp; Borah tribute-record series; dashed mark = competing low estimate for 1519</text>

  <line class="rule" x1="96" y1="106" x2="520" y2="106" stroke-dasharray="3 3" opacity="0.3"/>
  <line class="rule" x1="96" y1="175" x2="520" y2="175" stroke-dasharray="3 3" opacity="0.3"/>
  <line class="rule" x1="96" y1="240" x2="520" y2="240" stroke-width="1.5"/>
  <text class="muted" x="88" y="110" text-anchor="end">20 M</text>
  <text class="muted" x="88" y="179" text-anchor="end">10 M</text>
  <text class="muted" x="88" y="244" text-anchor="end">0</text>

  <text class="muted" x="130" y="258" text-anchor="middle">1519</text>
  <text class="muted" x="240" y="258" text-anchor="middle">1532</text>
  <text class="muted" x="350" y="258" text-anchor="middle">1548</text>
  <text class="muted" x="460" y="258" text-anchor="middle">1568</text>

  <rect class="bar" x="100" y="66" width="60" height="174" rx="2"/>
  <line class="rule" x1="96" y1="164" x2="164" y2="164" stroke-width="2" stroke-dasharray="4 3"/>
  <text class="muted" x="170" y="168">11 M</text>
  <text class="label" x="130" y="58" text-anchor="middle">25.2 M</text>

  <rect class="bar" x="210" y="124" width="60" height="116" rx="2"/>
  <text class="label" x="240" y="116" text-anchor="middle">16.8 M</text>
  <text class="muted" x="240" y="98" text-anchor="middle">smallpox, 1520</text>

  <rect class="bar" x="320" y="197" width="60" height="43" rx="2"/>
  <text class="label" x="350" y="189" text-anchor="middle">6.3 M</text>
  <text class="muted" x="350" y="171" text-anchor="middle">cocoliztli, 1545–48</text>
</svg>

<svg viewBox="0 0 620 280" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .rule { stroke: currentColor; fill: none; }
  </style>
  <defs>
    <marker id="head-thick" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#e2903a"/>
    </marker>
    <marker id="head-thin" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>

  <text class="label" x="20" y="22" font-weight="600">Inputs to the Spanish victories</text>

  <rect class="rule" x="20" y="40" width="230" height="52" rx="5"/>
  <text class="label" x="34" y="62">Epidemic mortality</text>
  <text class="muted" x="34" y="80">Tenochtitlán 1520; Andes 1524–28</text>

  <rect class="rule" x="20" y="112" width="230" height="52" rx="5"/>
  <text class="label" x="34" y="134">Indigenous allies</text>
  <text class="muted" x="34" y="152">Tlaxcala; the Huáscar faction</text>

  <rect class="rule" x="20" y="184" width="230" height="52" rx="5"/>
  <text class="label" x="34" y="206">Spanish force</text>
  <text class="muted" x="34" y="224">about 500 men (1519); 168 (1532)</text>

  <line x1="252" y1="66" x2="406" y2="120" stroke="#e2903a" stroke-width="9" marker-end="url(#head-thick)"/>
  <line x1="252" y1="138" x2="406" y2="140" stroke="#e2903a" stroke-width="9" marker-end="url(#head-thick)"/>
  <line class="rule" x1="252" y1="210" x2="414" y2="158" stroke-width="1.5" marker-end="url(#head-thin)"/>

  <rect class="rule" x="422" y="100" width="180" height="80" rx="5" stroke-width="2"/>
  <text class="label" x="512" y="132" text-anchor="middle">Tenochtitlán falls, 1521</text>
  <text class="label" x="512" y="154" text-anchor="middle">Cuzco falls, 1533</text>

  <text class="muted" x="20" y="266">arrow thickness = weight of the cause</text>
</svg>

<svg viewBox="0 0 600 318" font-family="system-ui, sans-serif">
  <!-- Americas column -->
  <rect x="22" y="24" width="262" height="236" rx="6" fill="none" stroke="currentColor" opacity="0.5"/>
  <text x="153" y="46" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor">the Americas held</text>
  <text x="40" y="74" font-size="12" fill="currentColor">maize — several× more food per seed</text>
  <text x="40" y="94" font-size="12" fill="currentColor">the potato</text>
  <text x="40" y="114" font-size="12" fill="currentColor">chinampa wetland agriculture</text>
  <text x="40" y="134" font-size="12" fill="currentColor">cities of 10,000–20,000</text>
  <text x="40" y="154" font-size="12" fill="currentColor">monumental earthworks and roads</text>
  <line x1="40" y1="172" x2="266" y2="172" stroke="currentColor" opacity="0.3" stroke-dasharray="3 3"/>
  <text x="40" y="192" font-size="11" fill="currentColor" opacity="0.55">without: iron, wheels in use,</text>
  <text x="40" y="208" font-size="11" fill="currentColor" opacity="0.55">draft animals, ocean ships</text>

  <!-- Europe column -->
  <rect x="316" y="24" width="262" height="236" rx="6" fill="none" stroke="currentColor" opacity="0.5"/>
  <text x="447" y="46" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor">Europe held</text>
  <rect x="328" y="60" width="238" height="20" rx="4" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <text x="336" y="74" font-size="12" font-weight="600" fill="#e2903a">ocean-going ships (caravel)</text>
  <text x="336" y="100" font-size="12" fill="currentColor">iron and steel</text>
  <text x="336" y="120" font-size="12" fill="currentColor">gunpowder</text>
  <text x="336" y="140" font-size="12" fill="currentColor">wheels and draft animals</text>
  <text x="336" y="160" font-size="12" fill="currentColor">the printing press</text>
  <line x1="336" y1="176" x2="562" y2="176" stroke="currentColor" opacity="0.3" stroke-dasharray="3 3"/>
  <text x="336" y="196" font-size="11" fill="currentColor" opacity="0.55">without: maize, potato</text>
  <text x="336" y="212" font-size="11" fill="currentColor" opacity="0.55">(until the exchange)</text>

  <!-- the deciding line: ships cross -->
  <path d="M 328 70 C 300 70, 300 236, 270 274" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <path d="M 270 274 l 10 -7 M 270 274 l 12 1" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <text x="300" y="292" text-anchor="middle" font-size="12" font-weight="600" fill="#e2903a">1492: the side with ships crossed</text>
  <text x="300" y="310" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">the inventories barely intersect — this line set the direction of contact</text>
</svg>

<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.55; font-size: 11px; }
    .rule { stroke: currentColor; fill: none; }
    .west { fill: #e2903a; }
    .east { fill: #4c8dd6; }
  </style>
  <defs>
    <marker id="head-west" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#e2903a"/>
    </marker>
    <marker id="head-east" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4c8dd6"/>
    </marker>
  </defs>

  <text class="label" x="105" y="26" text-anchor="middle" font-weight="600">Afro-Eurasia</text>
  <text class="label" x="535" y="26" text-anchor="middle" font-weight="600">The Americas</text>
  <line class="rule" x1="170" y1="42" x2="170" y2="272" opacity="0.25"/>
  <line class="rule" x1="470" y1="42" x2="470" y2="272" opacity="0.25"/>

  <!-- westbound -->
  <text class="label" x="320" y="62" text-anchor="middle">smallpox · measles · typhus · influenza</text>
  <line x1="175" y1="85" x2="452" y2="85" stroke="#e2903a" stroke-width="12" marker-end="url(#head-west)"/>
  <text class="label" x="320" y="112" text-anchor="middle">cattle · pigs · horses · sheep · wheat · sugarcane</text>
  <text class="west" x="320" y="136" text-anchor="middle" font-size="12">outcome: population down about 90% by 1600</text>

  <line class="rule" x1="20" y1="158" x2="620" y2="158" opacity="0.2"/>

  <!-- eastbound -->
  <text class="label" x="320" y="190" text-anchor="middle">maize · potato · cassava · tomato · cacao · tobacco</text>
  <line x1="465" y1="213" x2="185" y2="213" stroke="#4c8dd6" stroke-width="12" marker-end="url(#head-east)"/>
  <text class="label" x="320" y="240" text-anchor="middle">more calories per hectare on existing farmland</text>
  <text class="east" x="320" y="264" text-anchor="middle" font-size="12">outcome: potato alone ≈ ¼ of Old World population growth, 1700–1900</text>

  <text class="muted" x="320" y="290" text-anchor="middle">the transfer runs both ways; the consequences do not</text>
</svg>

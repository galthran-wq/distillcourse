<svg viewBox="0 0 620 370" font-family="system-ui, sans-serif" xmlns="http://www.w3.org/2000/svg">
  <!-- ocean -->
  <text x="280" y="200" text-anchor="middle" font-size="13" letter-spacing="6" fill="currentColor" opacity="0.25">ATLANTIC</text>

  <!-- east coastline: Iberia -->
  <path d="M 615 30 C 590 35, 565 40, 552 55 C 545 65, 555 78, 572 84 L 615 88" fill="none" stroke="currentColor" opacity="0.45" stroke-width="1.5"/>
  <text x="600" y="22" text-anchor="end" font-size="11" fill="currentColor" opacity="0.6">Iberia</text>

  <!-- east coastline: Africa, Gibraltar down to the Cape -->
  <path d="M 615 100 C 580 105, 530 125, 500 160 C 478 185, 472 200, 486 215 C 505 233, 540 240, 565 245 C 585 250, 592 275, 590 300 C 588 320, 585 335, 578 352" fill="none" stroke="currentColor" opacity="0.45" stroke-width="1.5"/>
  <text x="560" y="140" font-size="11" fill="currentColor" opacity="0.6">Africa</text>

  <!-- west coastline: Caribbean (schematic) -->
  <path d="M 60 40 C 85 80, 75 120, 100 150 C 122 178, 108 215, 122 250" fill="none" stroke="currentColor" opacity="0.45" stroke-width="1.5"/>
  <text x="30" y="130" font-size="11" fill="currentColor" opacity="0.6">Caribbean</text>

  <defs>
    <marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#e2903a"/>
    </marker>
  </defs>

  <!-- stations -->
  <circle cx="562" cy="60" r="4" fill="currentColor"/>
  <text x="552" y="52" text-anchor="end" font-size="11.5" font-weight="600" fill="currentColor">Lisbon</text>

  <circle cx="498" cy="110" r="4.5" fill="#e2903a"/>
  <text x="488" y="103" text-anchor="end" font-size="11.5" font-weight="600" fill="currentColor">Madeira</text>
  <text x="488" y="116" text-anchor="end" font-size="10" fill="currentColor" opacity="0.6">sugar by the 1450s</text>

  <circle cx="452" cy="196" r="4.5" fill="#e2903a"/>
  <text x="442" y="190" text-anchor="end" font-size="11.5" font-weight="600" fill="currentColor">Cape Verde Is.</text>

  <circle cx="548" cy="242" r="4.5" fill="#e2903a"/>
  <text x="540" y="262" text-anchor="end" font-size="11.5" font-weight="600" fill="currentColor">Elmina, 1482</text>
  <text x="540" y="275" text-anchor="end" font-size="10" fill="currentColor" opacity="0.6">Gold Coast (modern Ghana)</text>

  <circle cx="580" cy="350" r="4.5" fill="#e2903a"/>
  <text x="568" y="345" text-anchor="end" font-size="11.5" font-weight="600" fill="currentColor">Cape of Good Hope</text>
  <text x="568" y="358" text-anchor="end" font-size="10" fill="currentColor" opacity="0.6">Dias, 1488</text>

  <!-- Portuguese route down the coast -->
  <path d="M 554 66 L 508 102" fill="none" stroke="#e2903a" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M 494 119 C 478 145, 464 168, 456 188" fill="none" stroke="#e2903a" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M 460 202 C 485 220, 510 232, 539 240" fill="none" stroke="#e2903a" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M 556 248 C 580 265, 585 300, 581 341" fill="none" stroke="#e2903a" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- Columbus 1492 -->
  <circle cx="112" cy="165" r="4.5" fill="#4c8dd6"/>
  <path d="M 490 120 C 370 165, 245 175, 124 166" fill="none" stroke="#4c8dd6" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#ar2)"/>
  <defs>
    <marker id="ar2" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4c8dd6"/>
    </marker>
  </defs>
  <text x="300" y="145" text-anchor="middle" font-size="10.5" fill="#4c8dd6">Columbus, 1492 — the system turned west</text>
</svg>

<svg viewBox="0 0 640 250" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .label { fill: currentColor; }
    .muted { fill: currentColor; opacity: 0.6; font-size: 11px; }
    .rule { stroke: currentColor; fill: none; }
    .num { fill: #e2903a; font-weight: 600; }
  </style>

  <text class="label" x="15" y="24" font-weight="600">Three questions for any artifact</text>

  <rect class="rule" x="15" y="40" width="190" height="170" rx="5"/>
  <text class="num" x="31" y="66">1. What it records</text>
  <text class="muted" x="31" y="94">Portuguese survey data:</text>
  <text class="muted" x="31" y="112">the African coast in detail,</text>
  <text class="muted" x="31" y="130">latitudes, compass roses.</text>
  <text class="muted" x="31" y="160">The parts drawn firmly are</text>
  <text class="muted" x="31" y="178">the parts already sailed.</text>

  <rect class="rule" x="225" y="40" width="190" height="170" rx="5"/>
  <text class="num" x="241" y="66">2. What it argues</text>
  <text class="muted" x="241" y="94">The Tordesillas meridian,</text>
  <text class="muted" x="241" y="112">ruled as a firm straight line</text>
  <text class="muted" x="241" y="130">across unsurveyed ocean:</text>
  <text class="muted" x="241" y="160">a legal claim presented</text>
  <text class="muted" x="241" y="178">as a measurement.</text>

  <rect class="rule" x="435" y="40" width="190" height="170" rx="5"/>
  <text class="num" x="451" y="66">3. What it omits</text>
  <text class="muted" x="451" y="94">No Pacific, no interior,</text>
  <text class="muted" x="451" y="112">no continuous American</text>
  <text class="muted" x="451" y="130">coastline.</text>
  <text class="muted" x="451" y="160">A decade after 1492,</text>
  <text class="muted" x="451" y="178">Europeans knew edges only.</text>

  <text class="muted" x="15" y="238">applied here to the Cantino planisphere, 1502</text>
</svg>

  - file: battle-of-new-orleans-1815.jpg
    title: "\"Battle of New Orleans\", Jean Hyacinthe de Laclotte, 1815"
    credit: "Jean Hyacinthe de Laclotte (1766–1829), oil on canvas, 29½ × 36 in., painted in 1815 from sketches the artist made on the field as a member of the Louisiana Militia. New Orleans Museum of Art, accession 65.7, gift of Edgar William and Bernice Chrysler Garbisch"
    source_url: "https://noma.org/collection/battle-of-new-orleans/"
    license: "public domain (artist died 1829; published before 1931 — Commons tags PD-old-100-expired and PD-US-expired)"
    retrieved: "2026-08-01"
    located: "the 2000×1611 museum photograph on Wikimedia Commons, File:Battle of New Orleans, Jean Hyacinthe de Laclotte.jpg — the whole plate: Mississippi in the foreground, Jackson's earthwork running back from the river at left, British columns in the open field at right, cypress swamp on the horizon"
    modifications: "cropped to the battlefield — the upper band of storm sky, a strip of foreground water and the darkened canvas edges at left and right removed (1972×1215 out of 2000×1611); resized to 1400px and re-encoded as JPEG. Nothing depicted has been removed, added, or retouched"
    background: none

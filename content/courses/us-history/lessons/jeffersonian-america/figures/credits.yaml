images:
  - file: marshall-portrait-peale-1834.jpg
    title: "John Marshall (Rembrandt Peale, 1834)"
    credit: "Rembrandt Peale (1778–1860), 1834, oil on canvas, 76.2 × 63.5 cm — Virginia Museum of Fine Arts, Richmond; the Arthur and Margaret Glasgow Fund. Museum photograph via Wikimedia Commons"
    source_url: "https://commons.wikimedia.org/wiki/File:John_Marshall,_by_Rembrandt_Peale.jpg"
    license: "public domain — Peale died in 1860 and the painting was published before 1 January 1931; the faithful photographic reproduction of a two-dimensional public-domain work carries no new copyright and is marked Creative Commons Public Domain Mark 1.0"
    retrieved: "2026-08-01"
    located: "Virginia Museum of Fine Arts collection database; the Commons file is the museum's 1187×1458 photograph of the whole canvas. Painted from life at Washington and inscribed \"Chief Justice Marshall. / Painted at [W]ashington D.C. / by Rembrandt Peale / 1834\" — Marshall's last year, thirty-three years into the chief justiceship and one year before his death in July 1835"
    modifications: "cropped only at the edges — about 10px of canvas edge off each side and roughly 9% off the bottom of the 1187×1458 scan, removing empty robe and the pale canvas margin to tighten the framing for a floated placement; then downscaled to 1100×1244, metadata stripped, re-encoded as JPEG at quality 84. Nothing inside the picture retouched, removed or tonally corrected"
    background: none
  - file: marbury-show-cause-order-1802.jpg
    title: "Rule ordering James Madison, Secretary of State, to show cause in Marbury v. Madison, 1802"
    credit: "Supreme Court of the United States; Records of the Supreme Court of the United States, Record Group 267, National Archives and Records Administration, Washington, DC"
    source_url: "https://catalog.archives.gov/id/472494396"
    license: "public domain — a record of the United States government; the National Archives Catalog lists this item's use restriction as Unrestricted"
    retrieved: "2026-08-01"
    located: "National Archives Catalog, National Archives Identifier 472494396, \"Rule to Madison to Show Cause, March 22, 1802\" — page 1 of the digitised item (file 311846714_17_15_Page_1.jpg, 2423×3150), in the file unit Marbury v. Madison (NAID 311846714), series Original Jurisdiction Case Files (NAID 597292). The same leaf appears at 500×653 as document 15 on archives.gov/milestone-documents/marbury-v-madison, which notes that the damage is from the 1898 fire in the Capitol Building"
    modifications: "cropped to the sheet (scanner background strip and mount trimmed from all four sides), resized to 820px wide, metadata stripped, re-encoded as JPEG. The burnt-away right-hand third is the document's own condition and has not been retouched, filled, or enhanced"
    background: none
  - file: louisiana-purchase-map-1803.jpg
    title: "\"Territory of Louisiana 1803-1819\" (Map No. 4) — the Louisiana Purchase mapped by the General Land Office"
    credit: "Department of the Interior, General Land Office; drawn by I. P. Berthrong and C. J. Helm, lithographed by the Columbia Planograph Co., Washington, D.C. National Archives and Records Administration, Record Group 49 (Records of the Bureau of Land Management), Old Map File, National Archives Identifier 594889. The National Archives catalogue dates the plate 1903; it was issued as Map No. 4 in Frank Bond, Louisiana and the Louisiana Purchase (Washington: Government Printing Office, 1912), the form in which Wikimedia Commons holds the high-resolution scan."
    source_url: "https://commons.wikimedia.org/wiki/File:Frank_bond_1912_louisiana_and_the_louisiana_purchase.jpg"
    license: "public domain — a work of the United States government; Wikimedia Commons carries it as PD-USGov and PD-US (first published before 1 January 1931)"
    retrieved: "2026-08-01"
    located: "Wikimedia Commons full-resolution file, 2500x1636 (category \"Maps of the Louisiana Purchase\"); NARA catalogue record 594889, reached via DocsTeach"
    modifications: "cropped to the map's printed neatline — the plate heading \"Map No. 4\" above it and the draughtsmen's and lithographer's imprint below it removed — then resized to 1400px and re-encoded with metadata stripped. Nothing inside the neatline was altered; the faint grey band across the legend box is the scan's own condition."
    background: none
  - file: tenskwatawa-catlin-1831.jpg
    title: "George Catlin, \"Ten-sqúat-a-way, The Open Door, Known as The Prophet, Brother of Tecumseh\" — Tenskwatawa painted from life about 1830, holding his \"medicine fire\" and his sacred string of beads"
    credit: "George Catlin (1796–1872), 1830, oil on canvas, 73.7 × 60.9 cm (29 × 24 in) — Smithsonian American Art Museum, Gift of Mrs. Joseph Harrison, Jr. (accession 1985.66.279); museum scan via Wikimedia Commons"
    source_url: "https://commons.wikimedia.org/wiki/File:Ten-sq%C3%BAat-a-way.jpg"
    license: "CC0 — the Smithsonian American Art Museum releases its image of this work under Creative Commons Zero through Smithsonian Open Access; the 1830 painting is itself public domain (Catlin died in 1872, published long before 1 January 1931)"
    license_url: "https://creativecommons.org/publicdomain/zero/1.0/"
    retrieved: "2026-08-01"
    located: "SAAM object 1985.66.279 (americanart.si.edu, record id 4301), part of the Catlin Indian Gallery; the Commons file is the museum's 2006×2437 scan of the whole canvas. The museum dates the portrait 1830 and places its making at Fort Leavenworth on Catlin's first western journey, after the Prophet had moved west of the Mississippi; Commons gives the wider range 1830–1832. Catlin's own note on the sitter describes the \"medicine fire\" in the right hand and the \"sacred string of beads\" in the left, both visible here"
    modifications: "none to the picture — the whole canvas, uncropped; downscaled from the 2006×2437 museum scan to 900×1093, metadata stripped, re-encoded as JPEG at quality 84. Nothing retouched, removed or tonally corrected"
    background: none

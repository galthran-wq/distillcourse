<svg viewBox="0 0 640 252" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="14" y="26" font-size="11.5" fill="#e2903a">each step, more federal coercion</text>

  <!-- step 1: Embargo Act -->
  <rect x="8" y="150" width="136" height="92" rx="6" fill="none" stroke="#e2903a" stroke-width="1.4"/>
  <text x="18" y="169" font-size="12" font-weight="bold" fill="currentColor">Dec 22, 1807</text>
  <text x="18" y="185" font-size="11.5" fill="currentColor">Embargo Act:</text>
  <text x="18" y="200" font-size="11.5" fill="currentColor">ports closed to all</text>
  <text x="18" y="215" font-size="11.5" fill="currentColor">foreign trade</text>

  <!-- arrow 1 -->
  <line x1="144" y1="170" x2="167" y2="170" stroke="#e2903a" stroke-width="1.4"/>
  <polygon points="176,170 167,166 167,174" fill="#e2903a"/>

  <!-- step 2: insurrection proclamation -->
  <rect x="176" y="98" width="136" height="92" rx="6" fill="none" stroke="#e2903a" stroke-width="1.4"/>
  <text x="186" y="117" font-size="12" font-weight="bold" fill="currentColor">Apr 1808</text>
  <text x="186" y="133" font-size="11.5" fill="currentColor">Lake Champlain</text>
  <text x="186" y="148" font-size="11.5" fill="currentColor">region declared in</text>
  <text x="186" y="163" font-size="11.5" fill="currentColor">insurrection</text>

  <!-- arrow 2 -->
  <line x1="312" y1="118" x2="335" y2="118" stroke="#e2903a" stroke-width="1.4"/>
  <polygon points="344,118 335,114 335,122" fill="#e2903a"/>

  <!-- step 3: Enforcement Act -->
  <rect x="344" y="46" width="136" height="92" rx="6" fill="none" stroke="#e2903a" stroke-width="1.4"/>
  <text x="354" y="65" font-size="12" font-weight="bold" fill="currentColor">Jan 1809</text>
  <text x="354" y="81" font-size="11.5" fill="currentColor">Enforcement Act:</text>
  <text x="354" y="96" font-size="11.5" fill="currentColor">warrantless seizure;</text>
  <text x="354" y="111" font-size="11.5" fill="currentColor">army and navy back</text>
  <text x="354" y="126" font-size="11.5" fill="currentColor">the revenue officers</text>

  <!-- arrow 3: down to repeal -->
  <path d="M 480 92 H 566 V 141" fill="none" stroke="currentColor" stroke-width="1.4" opacity="0.6"/>
  <polygon points="566,150 561,141 571,141" fill="currentColor" opacity="0.6"/>

  <!-- step 4: repeal -->
  <rect x="494" y="150" width="140" height="92" rx="6" fill="none" stroke="#5aa46a" stroke-width="1.4"/>
  <text x="504" y="169" font-size="12" font-weight="bold" fill="currentColor">Mar 1, 1809</text>
  <text x="504" y="185" font-size="11.5" fill="currentColor">repeal, three days</text>
  <text x="504" y="200" font-size="11.5" fill="currentColor">before Jefferson</text>
  <text x="504" y="215" font-size="11.5" fill="currentColor">leaves office</text>
</svg>

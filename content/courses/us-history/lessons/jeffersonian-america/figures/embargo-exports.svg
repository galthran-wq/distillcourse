<svg viewBox="0 0 640 350" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- axes -->
  <line x1="60" y1="300" x2="628" y2="300" stroke="currentColor" stroke-width="1.2" opacity="0.7"/>
  <line x1="60" y1="52" x2="60" y2="300" stroke="currentColor" stroke-width="1.2" opacity="0.7"/>
  <!-- y ticks and gridlines: $0, 25, 50, 75, 100 million -->
  <g font-size="11" fill="currentColor" opacity="0.55" text-anchor="end">
    <text x="52" y="304">0</text>
    <text x="52" y="249.5">25</text>
    <text x="52" y="194.9">50</text>
    <text x="52" y="140.4">75</text>
    <text x="52" y="85.8">100</text>
  </g>
  <g stroke="currentColor" stroke-width="0.6" opacity="0.15">
    <line x1="60" y1="245.5" x2="628" y2="245.5"/>
    <line x1="60" y1="190.9" x2="628" y2="190.9"/>
    <line x1="60" y1="136.4" x2="628" y2="136.4"/>
    <line x1="60" y1="81.8" x2="628" y2="81.8"/>
  </g>
  <text x="24" y="46" font-size="11" fill="currentColor" opacity="0.55">US exports, $ million/yr</text>
  <!-- x ticks -->
  <g font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">
    <text x="60" y="318">1790</text>
    <text x="172" y="318">1795</text>
    <text x="284" y="318">1800</text>
    <text x="396" y="318">1805</text>
    <text x="508" y="318">1810</text>
    <text x="620" y="318">1815</text>
  </g>
  <!-- embargo span guides -->
  <line x1="452" y1="58" x2="452" y2="300" stroke="#e2903a" stroke-width="1.1" stroke-dasharray="3 3" opacity="0.75"/>
  <line x1="480" y1="58" x2="480" y2="300" stroke="#e2903a" stroke-width="1.1" stroke-dasharray="3 3" opacity="0.75"/>
  <text x="434" y="96" font-size="11" fill="#e2903a" text-anchor="end">Embargo Act,</text>
  <text x="434" y="110" font-size="11" fill="#e2903a" text-anchor="end">Dec 1807</text>
  <text x="486" y="70" font-size="11" fill="#e2903a">repeal,</text>
  <text x="486" y="84" font-size="11" fill="#e2903a">Mar 1809</text>
  <!-- war span -->
  <line x1="560" y1="120" x2="560" y2="300" stroke="#4c8dd6" stroke-width="1.1" stroke-dasharray="3 3" opacity="0.7"/>
  <text x="566" y="132" font-size="11" fill="#4c8dd6">war declared,</text>
  <text x="566" y="146" font-size="11" fill="#4c8dd6">Jun 1812</text>
  <!-- export line -->
  <polyline fill="none" stroke="#e2903a" stroke-width="2"
    points="60,255.9 82.4,258.5 104.8,254.6 127.2,243.1 149.6,228.0 172,195.3 194.4,153.6 216.8,175.9 239.2,165.8 261.6,128.3 284,145.1 306.4,94.7 328.8,141.8 351.2,178.3 373.6,130.5 396,91.4 418.4,78.6 440.8,63.7 463.2,251.1 485.6,186.1 508,154.3 530.4,166.3 552.8,216.0 575.2,239.1 597.6,284.9 620,185.2"/>
  <!-- key points -->
  <circle cx="440.8" cy="63.7" r="4" fill="#e2903a"/>
  <circle cx="463.2" cy="251.1" r="4" fill="#e2903a"/>
  <circle cx="597.6" cy="284.9" r="4" fill="#4c8dd6"/>
  <!-- drop annotation -->
  <text x="360" y="52" font-size="11.5" font-weight="bold" fill="currentColor" text-anchor="end">1807: $108M</text>
  <text x="418" y="240" font-size="11.5" font-weight="bold" fill="currentColor" text-anchor="end">1808: $22M</text>
  <text x="418" y="256" font-size="11" fill="currentColor" opacity="0.7" text-anchor="end">−80% in one year</text>
  <line x1="366" y1="48" x2="432" y2="60" stroke="currentColor" stroke-width="0.8" opacity="0.5"/>
  <line x1="424" y1="244" x2="454" y2="250" stroke="currentColor" stroke-width="0.8" opacity="0.5"/>
  <!-- blockade annotation -->
  <text x="590" y="270" font-size="11" fill="#4c8dd6" text-anchor="end">1814: $7M —</text>
  <text x="590" y="284" font-size="11" fill="#4c8dd6" text-anchor="end">British blockade</text>
  <text x="336" y="342" font-size="11" fill="currentColor" opacity="0.6" text-anchor="middle">annual value of all US exports, 1790–1815 (Historical Statistics of the United States, series U 1–25)</text>
</svg>

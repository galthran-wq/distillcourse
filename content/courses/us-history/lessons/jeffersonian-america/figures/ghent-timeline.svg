<svg viewBox="0 0 640 258" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- news-lag band: the peace exists, but America does not know -->
  <rect x="60" y="96" width="481" height="28" fill="#4c8dd6" opacity="0.12"/>
  <text x="300" y="88" font-size="11" fill="#4c8dd6" text-anchor="middle">the peace already exists — but no one in America knows it yet</text>
  <line x1="60" y1="70" x2="541" y2="70" stroke="#4c8dd6" stroke-width="0.9" opacity="0.55"/>
  <line x1="60" y1="65" x2="60" y2="75" stroke="#4c8dd6" stroke-width="0.9" opacity="0.55"/>
  <line x1="541" y1="65" x2="541" y2="75" stroke="#4c8dd6" stroke-width="0.9" opacity="0.55"/>
  <text x="300" y="62" font-size="11" fill="#4c8dd6" text-anchor="middle">49 days for the treaty to cross the Atlantic</text>

  <!-- spine -->
  <line x1="40" y1="110" x2="620" y2="110" stroke="currentColor" stroke-width="1.5" opacity="0.6"/>
  <path d="M 620 110 l -10 -5 l 0 10 z" fill="currentColor" opacity="0.6"/>

  <!-- Ghent -->
  <circle cx="60" cy="110" r="6" fill="#4c8dd6"/>
  <line x1="60" y1="116" x2="60" y2="138" stroke="#4c8dd6" stroke-width="1.2" opacity="0.7"/>
  <text x="60" y="154" font-size="12" font-weight="bold" fill="currentColor" text-anchor="start">Dec 24, 1814</text>
  <text x="60" y="169" font-size="11.5" fill="currentColor" text-anchor="start">Treaty of Ghent signed</text>
  <text x="60" y="184" font-size="11.5" fill="currentColor" text-anchor="start">in Flanders</text>

  <!-- New Orleans -->
  <circle cx="207" cy="110" r="6" fill="#e2903a"/>
  <line x1="207" y1="116" x2="207" y2="196" stroke="#e2903a" stroke-width="1.2" opacity="0.7"/>
  <text x="207" y="212" font-size="12" font-weight="bold" fill="currentColor" text-anchor="middle">Jan 8, 1815</text>
  <text x="207" y="227" font-size="11.5" fill="currentColor" text-anchor="middle">Battle of New Orleans —</text>
  <text x="207" y="242" font-size="11.5" fill="currentColor" text-anchor="middle">15 days into the peace</text>

  <!-- news of New Orleans -->
  <circle cx="472" cy="110" r="5" fill="none" stroke="#e2903a" stroke-width="1.6"/>
  <line x1="472" y1="116" x2="472" y2="138" stroke="#e2903a" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.7"/>
  <text x="452" y="154" font-size="12" font-weight="bold" fill="currentColor" text-anchor="middle">Feb 4</text>
  <text x="452" y="169" font-size="11.5" fill="currentColor" text-anchor="middle">news of the victory</text>
  <text x="452" y="184" font-size="11.5" fill="currentColor" text-anchor="middle">reaches Washington</text>

  <!-- treaty arrives -->
  <circle cx="541" cy="110" r="5" fill="none" stroke="#4c8dd6" stroke-width="1.6"/>
  <line x1="541" y1="104" x2="541" y2="34" stroke="#4c8dd6" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.7"/>
  <text x="541" y="16" font-size="12" font-weight="bold" fill="currentColor" text-anchor="middle">Feb 11</text>
  <text x="541" y="30" font-size="11.5" fill="currentColor" text-anchor="middle">treaty reaches New York</text>

  <!-- ratification -->
  <circle cx="600" cy="110" r="6" fill="#5aa46a"/>
  <line x1="600" y1="116" x2="600" y2="150" stroke="#5aa46a" stroke-width="1.2" opacity="0.7"/>
  <text x="634" y="166" font-size="12" font-weight="bold" fill="currentColor" text-anchor="end">Feb 16–17</text>
  <text x="634" y="181" font-size="11.5" fill="currentColor" text-anchor="end">Senate ratifies 35–0;</text>
  <text x="634" y="196" font-size="11.5" fill="currentColor" text-anchor="end">the war legally ends</text>
</svg>

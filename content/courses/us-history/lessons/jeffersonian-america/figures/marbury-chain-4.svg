<svg viewBox="0 0 640 392" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <rect x="20" y="14" width="600" height="58" rx="5" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.55"/>
  <circle cx="40" cy="34" r="10" fill="#5aa46a" opacity="1"/>
  <text x="40" y="38.5" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">1</text>
  <text x="58" y="38.5" font-size="12.5" font-weight="bold" fill="currentColor" opacity="1">The right</text>
  <text x="34" y="54" font-size="11" fill="currentColor" opacity="1">Marbury’s commission was signed and sealed; the appointment was complete.</text>
  <text x="34" y="68" font-size="11" fill="currentColor" opacity="1">Withholding delivery violates a vested legal right.</text>
  <line x1="320" y1="74" x2="320" y2="84" stroke="currentColor" stroke-width="1.2" opacity="0.5"/>
  <path d="M 320 86 l -4 -6 l 8 0 z" fill="currentColor" opacity="0.5"/>
  <rect x="20" y="88" width="600" height="58" rx="5" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.55"/>
  <circle cx="40" cy="108" r="10" fill="#5aa46a" opacity="1"/>
  <text x="40" y="112.5" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">2</text>
  <text x="58" y="112.5" font-size="12.5" font-weight="bold" fill="currentColor" opacity="1">The remedy</text>
  <text x="34" y="128" font-size="11" fill="currentColor" opacity="1">Where there is a legal right, the laws afford a remedy. Delivering a completed</text>
  <text x="34" y="142" font-size="11" fill="currentColor" opacity="1">commission is a ministerial duty — a court may order a cabinet secretary to do it.</text>
  <line x1="320" y1="148" x2="320" y2="158" stroke="currentColor" stroke-width="1.2" opacity="0.5"/>
  <path d="M 320 160 l -4 -6 l 8 0 z" fill="currentColor" opacity="0.5"/>
  <rect x="20" y="162" width="600" height="58" rx="5" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.55"/>
  <circle cx="40" cy="182" r="10" fill="#5aa46a" opacity="1"/>
  <text x="40" y="186.5" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">3</text>
  <text x="58" y="186.5" font-size="12.5" font-weight="bold" fill="currentColor" opacity="1">The jurisdiction</text>
  <text x="34" y="202" font-size="11" fill="currentColor" opacity="1">Article III gives this Court original jurisdiction only over ambassadors, public</text>
  <text x="34" y="216" font-size="11" fill="currentColor" opacity="1">ministers and consuls, and states. Marbury’s case is none of these.</text>
  <line x1="320" y1="222" x2="320" y2="232" stroke="currentColor" stroke-width="1.2" opacity="0.5"/>
  <path d="M 320 234 l -4 -6 l 8 0 z" fill="currentColor" opacity="0.5"/>
  <rect x="20" y="236" width="600" height="58" rx="5" fill="none" stroke="#e2903a" stroke-width="2" opacity="1"/>
  <circle cx="40" cy="256" r="10" fill="#e2903a" opacity="1"/>
  <text x="40" y="260.5" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">4</text>
  <text x="58" y="260.5" font-size="12.5" font-weight="bold" fill="currentColor" opacity="1">The statute falls</text>
  <text x="34" y="276" font-size="11" fill="currentColor" opacity="1">Section 13 of the Judiciary Act of 1789, read as adding mandamus to the Court’s</text>
  <text x="34" y="290" font-size="11" fill="currentColor" opacity="1">original jurisdiction, contradicts Article III — so the section cannot be applied.</text>
  <line x1="320" y1="296" x2="320" y2="306" stroke="#e2903a" stroke-width="1.2" opacity="0.9"/>
  <path d="M 320 308 l -4 -6 l 8 0 z" fill="#e2903a" opacity="0.9"/>
  <rect x="90" y="312" width="460" height="40" rx="5" fill="none" stroke="#e2903a" stroke-width="2" stroke-dasharray="none" opacity="1"/>
  <text x="320" y="337" font-size="12" font-weight="bold" fill="currentColor" opacity="1" text-anchor="middle">“a law repugnant to the constitution is void” — the writ is refused</text>
</svg>

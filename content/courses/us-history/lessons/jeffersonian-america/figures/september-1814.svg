<svg viewBox="0 0 640 210" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- legend -->
  <circle cx="16" cy="16" r="4.5" fill="#4c8dd6"/>
  <text x="26" y="20" font-size="11.5" fill="currentColor">British success</text>
  <circle cx="126" cy="16" r="4.5" fill="#5aa46a"/>
  <text x="136" y="20" font-size="11.5" fill="currentColor">American success</text>

  <!-- spine -->
  <line x1="40" y1="118" x2="612" y2="118" stroke="currentColor" stroke-width="1.5" opacity="0.6"/>
  <path d="M 620 118 l -10 -5 l 0 10 z" fill="currentColor" opacity="0.6"/>

  <!-- Washington burned -->
  <circle cx="110" cy="118" r="6" fill="#4c8dd6"/>
  <line x1="110" y1="124" x2="110" y2="145" stroke="#4c8dd6" stroke-width="1.2" opacity="0.7"/>
  <text x="40" y="162" font-size="12" font-weight="bold" fill="currentColor">Aug 24 — Washington</text>
  <text x="40" y="177" font-size="11.5" fill="currentColor">the capital's public buildings</text>
  <text x="40" y="192" font-size="11.5" fill="currentColor">burned; the government in flight</text>

  <!-- Plattsburgh -->
  <circle cx="500" cy="118" r="6" fill="#5aa46a"/>
  <line x1="500" y1="112" x2="500" y2="76" stroke="#5aa46a" stroke-width="1.2" opacity="0.7"/>
  <text x="440" y="36" font-size="12" font-weight="bold" fill="currentColor" text-anchor="middle">Sept 11 — Plattsburgh, Lake Champlain</text>
  <text x="440" y="52" font-size="11.5" fill="currentColor" text-anchor="middle">Macdonough destroys the British flotilla;</text>
  <text x="440" y="67" font-size="11.5" fill="currentColor" text-anchor="middle">the invasion from Canada turns back</text>

  <!-- Baltimore -->
  <circle cx="575" cy="118" r="6" fill="#5aa46a"/>
  <line x1="575" y1="124" x2="575" y2="145" stroke="#5aa46a" stroke-width="1.2" opacity="0.7"/>
  <text x="632" y="162" font-size="12" font-weight="bold" fill="currentColor" text-anchor="end">Sept 13–14 — Baltimore</text>
  <text x="632" y="177" font-size="11.5" fill="currentColor" text-anchor="end">Fort McHenry rides out the bombardment;</text>
  <text x="632" y="192" font-size="11.5" fill="currentColor" text-anchor="end">the British fleet withdraws</text>
</svg>

<svg viewBox="0 0 640 388" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- legend -->
  <circle cx="180" cy="18" r="4.5" fill="#5aa46a"/>
  <text x="190" y="22" font-size="11.5" fill="currentColor">American success</text>
  <circle cx="330" cy="18" r="4.5" fill="#4c8dd6"/>
  <text x="340" y="22" font-size="11.5" fill="currentColor">British success</text>

  <!-- card 1: Canadian frontier -->
  <rect x="16" y="38" width="296" height="160" rx="6" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.45"/>
  <text x="32" y="62" font-size="12.5" font-weight="bold" fill="currentColor">Canadian frontier, 1812–13</text>
  <circle cx="38" cy="84" r="4" fill="#4c8dd6"/>
  <text x="50" y="88" font-size="11.5" fill="currentColor">Detroit surrendered without a fight,</text>
  <text x="50" y="102" font-size="11.5" fill="currentColor">Aug 1812</text>
  <circle cx="38" cy="120" r="4" fill="#4c8dd6"/>
  <text x="50" y="124" font-size="11.5" fill="currentColor">two further invasions turned back</text>
  <text x="50" y="138" font-size="11.5" fill="currentColor">at the border, 1812–13</text>
  <text x="32" y="182" font-size="11.5" fill="currentColor" opacity="0.6">outcome: stalemate — Canada holds</text>

  <!-- card 2: Great Lakes / Northwest -->
  <rect x="328" y="38" width="296" height="160" rx="6" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.45"/>
  <text x="344" y="62" font-size="12.5" font-weight="bold" fill="currentColor">Great Lakes and the Northwest</text>
  <circle cx="350" cy="84" r="4" fill="#5aa46a"/>
  <text x="362" y="88" font-size="11.5" fill="currentColor">Perry takes Lake Erie, Sept 1813</text>
  <circle cx="350" cy="120" r="4" fill="#5aa46a"/>
  <text x="362" y="124" font-size="11.5" fill="currentColor">the Thames, Oct 1813: Tecumseh</text>
  <text x="362" y="138" font-size="11.5" fill="currentColor">killed, the confederacy broken</text>
  <text x="344" y="182" font-size="11.5" fill="currentColor" opacity="0.6">outcome: the Northwest secured</text>

  <!-- card 3: Chesapeake -->
  <rect x="16" y="214" width="296" height="160" rx="6" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.45"/>
  <text x="32" y="238" font-size="12.5" font-weight="bold" fill="currentColor">Chesapeake, 1814</text>
  <circle cx="38" cy="260" r="4" fill="#4c8dd6"/>
  <text x="50" y="264" font-size="11.5" fill="currentColor">Washington burned, Aug 24, 1814</text>
  <circle cx="38" cy="296" r="4" fill="#5aa46a"/>
  <text x="50" y="300" font-size="11.5" fill="currentColor">Baltimore holds: Fort McHenry,</text>
  <text x="50" y="314" font-size="11.5" fill="currentColor">Sept 1814</text>
  <text x="32" y="358" font-size="11.5" fill="currentColor" opacity="0.6">outcome: a raid, not a conquest</text>

  <!-- card 4: Gulf and the South -->
  <rect x="328" y="214" width="296" height="160" rx="6" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.45"/>
  <text x="344" y="238" font-size="12.5" font-weight="bold" fill="currentColor">Gulf and the South</text>
  <circle cx="350" cy="260" r="4" fill="#5aa46a"/>
  <text x="362" y="264" font-size="11.5" fill="currentColor">Horseshoe Bend, Mar 1814:</text>
  <text x="362" y="278" font-size="11.5" fill="currentColor">the Creek War ends</text>
  <circle cx="350" cy="296" r="4" fill="#5aa46a"/>
  <text x="362" y="300" font-size="11.5" fill="currentColor">New Orleans, Jan 8, 1815</text>
  <text x="344" y="344" font-size="11.5" fill="currentColor" opacity="0.6">outcome: the famous victory, won</text>
  <text x="344" y="358" font-size="11.5" fill="currentColor" opacity="0.6">after the peace was signed</text>
</svg>

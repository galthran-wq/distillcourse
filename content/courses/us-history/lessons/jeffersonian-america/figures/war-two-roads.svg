<svg viewBox="0 0 640 200" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- maritime road -->
  <rect x="8" y="16" width="400" height="72" rx="6" fill="none" stroke="#4c8dd6" stroke-width="1.4"/>
  <text x="20" y="38" font-size="12.5" font-weight="bold" fill="#4c8dd6">The maritime road</text>
  <text x="20" y="56" font-size="11.5" fill="currentColor">≈900 ships seized, 1807–12 · ≈6,000 sailors impressed</text>
  <text x="20" y="72" font-size="11.5" fill="currentColor">the Chesapeake fired on, 1807 · the embargo fails, 1809</text>

  <!-- interior road -->
  <rect x="8" y="112" width="400" height="72" rx="6" fill="none" stroke="#e2903a" stroke-width="1.4"/>
  <text x="20" y="134" font-size="12.5" font-weight="bold" fill="#e2903a">The interior road</text>
  <text x="20" y="152" font-size="11.5" fill="currentColor">cession treaties (Fort Wayne, 1809) · the confederacy</text>
  <text x="20" y="168" font-size="11.5" fill="currentColor">at Prophetstown · Tippecanoe, Nov 1811</text>

  <!-- converging arrows -->
  <line x1="408" y1="52" x2="462" y2="80" stroke="currentColor" stroke-width="1.4" opacity="0.6"/>
  <polygon points="470,84 460,84 464,76" fill="currentColor" opacity="0.6"/>
  <line x1="408" y1="148" x2="462" y2="120" stroke="currentColor" stroke-width="1.4" opacity="0.6"/>
  <polygon points="470,116 460,117 464,124" fill="currentColor" opacity="0.6"/>

  <!-- declaration -->
  <rect x="470" y="56" width="162" height="88" rx="6" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <text x="551" y="78" font-size="12.5" font-weight="bold" fill="currentColor" text-anchor="middle">war declared</text>
  <text x="551" y="96" font-size="12.5" font-weight="bold" fill="currentColor" text-anchor="middle">June 18, 1812</text>
  <text x="551" y="115" font-size="11.5" fill="currentColor" text-anchor="middle">House 79–49</text>
  <text x="551" y="131" font-size="11.5" fill="currentColor" text-anchor="middle">Senate 19–13</text>
</svg>

    title: "\"The Times\""
    credit: "Edward Williams Clay (1799–1857), lithograph on wove paper, printed and published by Henry R. Robinson, 52 Cortlandt Street, New York, 1837; Library of Congress, Prints and Photographs Division, American cartoon print filing series, digital id ds.04507 (LCCN 2008661304) — reproduction via Wikimedia Commons"
    source_url: "https://commons.wikimedia.org/wiki/File:The_times_LCCN2008661304.jpg"

    background: light
  - file: lowell-mill-girl-daguerreotype.jpg
    title: "Mary D. Warner, sixth-plate daguerreotype in its case, ca. 1854"
    credit: "Unknown photographer; Kheel Center for Labor-Management Documentation & Archives, Cornell University Library — from the records that came to Cornell from the American Textile History Museum. Shown in the Cornell University Library online exhibition \"Social Fabric: Land, Labor, and the World the Textile Industry Created\""
    source_url: "https://exhibits.library.cornell.edu/social-fabric-land-labor-and-the-world-the-textile-industry-created/catalog/109-6045"
    license: "public domain — Cornell University Library states of this item: \"This item is presumed to be in the public domain by virtue of creation date.\""
    retrieved: "2026-08-01"
    located: "Exhibit item 109-6045 (\"Mary D. Warner\"), the plate half of the opened case; a slip of paper in the case lid reads \"Mary D. Warner, taken about 1854\". The Kheel Center's textile curator, Marcie Farwell, identifies the sitter as a mill worker in Lowell, Massachusetts, and likely a weaver from the shuttle in her lap (Cornell Chronicle, 26 May 2021)."
    modifications: "cropped from the 2636x1590 photograph of the opened case to the plate half — gilt preserver, mat and a margin of the case kept; the lid with the identifying slip cropped away — then metadata stripped and re-encoded as JPEG at quality 86 at its native 1074x1250. No tonal, colour or contrast correction; the tarnish at the plate edges is the object's own condition."
    background: none

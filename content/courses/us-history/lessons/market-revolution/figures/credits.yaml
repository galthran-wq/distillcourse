    located: "the whole sheet, 32.7 × 48.4 cm (image), signed \"Clay fec.\"; Reilly, American Political Prints 1766–1876, entry 1837-8"
    modifications: "cropped to the sheet edge — blank scanner margin removed, the print's own imprint line and letterpress title \"THE TIMES\" kept; resized to 1600px wide from the 7850×5470 master, metadata stripped, re-encoded as JPEG at quality 86. Nothing inside the picture altered"
    background: none

  - file: peale-artist-in-his-museum-1822.jpg
    title: "Charles Willson Peale, \"The Artist in His Museum\" (1822)"
    credit: "Charles Willson Peale (1741–1827), 1822, oil on canvas, 103¾ × 79⅞ in. (263.5 × 202.9 cm) — Pennsylvania Academy of the Fine Arts, Philadelphia, accession 1878.1.2, Gift of Mrs. Sarah Harrison (The Joseph Harrison, Jr. Collection). Reproduction via the Smithsonian American Art Museum"
    source_url: "https://americanart.si.edu/exhibitions/humboldt/online/charles-willson-peale-artist"
    license: "public domain — Peale died in 1827 and the painting was published long before 1 January 1931; PAFA's collection record for accession 1878.1.2 states \"No known copyright restrictions,\" and a faithful photographic reproduction of a two-dimensional public-domain work carries no new copyright"
    retrieved: "2026-08-01"
    located: "Smithsonian American Art Museum, \"Alexander von Humboldt and the United States\" online exhibition, the essay page on Peale — the museum's 1254×1600 photograph of the whole canvas, printed there with the PAFA credit line. The object record is pafa.org/museum/collection/item/artist-his-museum. Peale painted himself at eighty-one lifting the curtain on the Long Room of his museum, then on the second floor of the old Pennsylvania State House: the ranked glass cases of mounted birds down the left wall, the row of his own Revolutionary portraits above them, paying visitors in the gallery, his palette and the mastodon's femur on the green table at right, the jaw with its teeth on the floor, and the taxidermy tray and wild turkey at lower left. Wikimedia Commons holds only a 575×750 copy of this painting"
    modifications: "none to the picture — the whole canvas, uncropped; downscaled from the 1254×1600 museum reproduction to 1000×1276, metadata stripped, re-encoded as JPEG at quality 84. Nothing retouched, removed or tonally corrected"
    background: none

<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="70" y="20" font-size="13" font-weight="bold" fill="currentColor">Tons of freight arriving at tidewater via the Erie Canal, by origin</text>

  <!-- gridlines -->
  <g stroke="currentColor" stroke-width="0.7" opacity="0.18">
    <line x1="70" y1="230" x2="590" y2="230"/>
    <line x1="70" y1="180" x2="590" y2="180"/>
    <line x1="70" y1="130" x2="590" y2="130"/>
    <line x1="70" y1="80" x2="590" y2="80"/>
  </g>
  <g font-size="11" fill="currentColor" opacity="0.55" text-anchor="end">
    <text x="64" y="234">0.5M</text>
    <text x="64" y="184">1.0M</text>
    <text x="64" y="134">1.5M</text>
    <text x="64" y="84">2.0M</text>
  </g>

  <!-- New York origin band (bottom, blue) -->
  <polygon fill="#4c8dd6" opacity="0.4" points="70.0,280.0 70.0,243.5 91.7,246.9 113.3,246.4 135.0,253.5 156.7,249.1 178.3,249.2 200.0,254.1 221.7,242.1 243.3,230.8 265.0,214.5 286.7,220.0 308.3,218.2 330.0,226.6 351.7,230.2 373.3,227.0 395.0,233.7 416.7,230.7 438.3,216.2 460.0,219.8 481.7,247.2 503.3,242.5 525.0,260.3 546.7,257.6 568.3,238.5 590.0,242.1 590.0,280.0"/>

  <!-- Western states band (stacked above, amber) -->
  <polygon fill="#e2903a" opacity="0.55" points="70.0,243.5 91.7,246.9 113.3,246.4 135.0,253.5 156.7,249.1 178.3,249.2 200.0,254.1 221.7,242.1 243.3,230.8 265.0,214.5 286.7,220.0 308.3,218.2 330.0,226.6 351.7,230.2 373.3,227.0 395.0,233.7 416.7,230.7 438.3,216.2 460.0,219.8 481.7,247.2 503.3,242.5 525.0,260.3 546.7,257.6 568.3,238.5 590.0,242.1 590.0,52.4 568.3,134.9 546.7,130.3 525.0,158.3 503.3,121.3 481.7,137.9 460.0,110.3 438.3,94.9 416.7,115.5 395.0,129.1 373.3,142.8 351.7,153.3 330.0,161.6 308.3,136.9 286.7,169.3 265.0,184.0 243.3,200.0 221.7,216.5 200.0,232.0 178.3,226.7 156.7,233.3 135.0,241.4 113.3,238.1 91.7,241.2 70.0,238.1"/>

  <!-- axes -->
  <line x1="70" y1="280" x2="590" y2="280" stroke="currentColor" stroke-width="1.2" opacity="0.7"/>
  <line x1="70" y1="280" x2="70" y2="40" stroke="currentColor" stroke-width="1.2" opacity="0.7"/>

  <!-- x labels -->
  <g font-size="11" fill="currentColor" opacity="0.7" text-anchor="middle">
    <text x="70" y="296">1836</text>
    <text x="156.7" y="296">1840</text>
    <text x="265" y="296">1845</text>
    <text x="373.3" y="296">1850</text>
    <text x="481.7" y="296">1855</text>
    <text x="580" y="296">1860</text>
  </g>

  <!-- series labels, color-bound -->
  <text x="300" y="252" font-size="12" font-weight="bold" fill="#4c8dd6">from New York State</text>
  <text x="330" y="115" font-size="12" font-weight="bold" fill="#e2903a">from the Western states</text>

  <!-- 1847 crossover -->
  <line x1="308.3" y1="280" x2="308.3" y2="128" stroke="currentColor" stroke-width="0.9" stroke-dasharray="3 3" opacity="0.5"/>
  <text x="308" y="322" font-size="11" fill="currentColor" opacity="0.8" text-anchor="middle">1847: western freight passes New York's own</text>
  <line x1="308" y1="313" x2="308" y2="300" stroke="currentColor" stroke-width="0.8" opacity="0.4"/>

  <!-- endpoints -->
  <text x="75" y="232" font-size="11" fill="currentColor" opacity="0.8">1836: 13% western</text>
  <text x="586" y="44" font-size="11" fill="currentColor" opacity="0.8" text-anchor="end">1860: 2.28M tons, 83% western</text>
</svg>

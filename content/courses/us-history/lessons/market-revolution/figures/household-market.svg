<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="24" y="22" font-size="13" font-weight="bold" fill="currentColor">The same farm household, before and after the market</text>

  <!-- left panel: c. 1800 -->
  <rect x="24" y="40" width="280" height="230" rx="6" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.7"/>
  <text x="164" y="62" font-size="12" font-weight="bold" fill="currentColor" text-anchor="middle">c. 1800: the household produces</text>
  <g font-size="11" fill="currentColor">
    <rect x="44" y="78" width="110" height="24" rx="4" fill="#4c8dd6" opacity="0.25"/>
    <text x="99" y="94" text-anchor="middle">spins &amp; weaves cloth</text>
    <rect x="174" y="78" width="110" height="24" rx="4" fill="#4c8dd6" opacity="0.25"/>
    <text x="229" y="94" text-anchor="middle">sews its clothing</text>
    <rect x="44" y="112" width="110" height="24" rx="4" fill="#4c8dd6" opacity="0.25"/>
    <text x="99" y="128" text-anchor="middle">candles &amp; soap</text>
    <rect x="174" y="112" width="110" height="24" rx="4" fill="#4c8dd6" opacity="0.25"/>
    <text x="229" y="128" text-anchor="middle">butter &amp; cheese</text>
    <rect x="44" y="146" width="240" height="24" rx="4" fill="#4c8dd6" opacity="0.25"/>
    <text x="164" y="162" text-anchor="middle">grows most of its own food</text>
  </g>
  <text x="44" y="196" font-size="10.5" fill="currentColor" opacity="0.7">surplus bartered with neighbors;</text>
  <text x="44" y="209" font-size="10.5" fill="currentColor" opacity="0.7">debts kept in account books, settled in kind</text>
  <text x="44" y="232" font-size="10.5" fill="currentColor" opacity="0.7">work paced by task and season</text>

  <!-- right panel: c. 1840 -->
  <rect x="336" y="40" width="280" height="230" rx="6" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.7"/>
  <text x="476" y="62" font-size="12" font-weight="bold" fill="currentColor" text-anchor="middle">c. 1840: the household buys</text>
  <g font-size="11" fill="currentColor">
    <rect x="356" y="78" width="110" height="24" rx="4" fill="#e2903a" opacity="0.3"/>
    <text x="411" y="94" text-anchor="middle">factory cloth</text>
    <rect x="486" y="78" width="110" height="24" rx="4" fill="#e2903a" opacity="0.3"/>
    <text x="541" y="94" text-anchor="middle">ready-made goods</text>
    <rect x="356" y="112" width="110" height="24" rx="4" fill="#e2903a" opacity="0.3"/>
    <text x="411" y="128" text-anchor="middle">store credit</text>
    <rect x="486" y="112" width="110" height="24" rx="4" fill="#e2903a" opacity="0.3"/>
    <text x="541" y="128" text-anchor="middle">a clock</text>
    <rect x="356" y="146" width="240" height="24" rx="4" fill="#e2903a" opacity="0.3"/>
    <text x="476" y="162" text-anchor="middle">one or two crops grown for sale</text>
  </g>
  <text x="356" y="196" font-size="10.5" fill="currentColor" opacity="0.7">cash and bank notes settle the accounts;</text>
  <text x="356" y="209" font-size="10.5" fill="currentColor" opacity="0.7">prices set in markets nobody in town controls</text>
  <text x="356" y="232" font-size="10.5" fill="currentColor" opacity="0.7">work paced by clock and contract</text>

  <!-- cash arrow between panels -->
  <line x1="304" y1="150" x2="336" y2="150" stroke="#5aa46a" stroke-width="2.4"/>
  <path d="M 336 150 l -9 -5 l 0 10 z" fill="#5aa46a"/>
  <text x="320" y="140" font-size="10.5" font-weight="bold" fill="#5aa46a" text-anchor="middle">cash</text>
</svg>

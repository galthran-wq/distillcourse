<svg viewBox="0 0 640 268" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="24" y="22" font-size="13" font-weight="bold" fill="currentColor">The information network grows</text>

  <!-- baseline -->
  <line x1="24" y1="196" x2="616" y2="196" stroke="currentColor" stroke-width="0.8" opacity="0.35"/>

  <!-- panel 1: post office employees -->
  <text x="118" y="48" font-size="12" fill="currentColor" text-anchor="middle">Post Office employees</text>
  <rect x="64" y="170" width="44" height="26" rx="3" fill="#4c8dd6" opacity="0.85"/>
  <text x="86" y="163" font-size="11.5" font-weight="bold" fill="currentColor" text-anchor="middle">3,341</text>
  <rect x="128" y="86" width="44" height="110" rx="3" fill="#e2903a" opacity="0.85"/>
  <text x="150" y="79" font-size="11.5" font-weight="bold" fill="currentColor" text-anchor="middle">14,290</text>
  <text x="86" y="214" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">1816</text>
  <text x="150" y="214" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">1841</text>
  <text x="118" y="234" font-size="12" font-weight="bold" fill="#e2903a" text-anchor="middle">&#215;4</text>

  <!-- panel 2: newspaper titles -->
  <text x="322" y="48" font-size="12" fill="currentColor" text-anchor="middle">Newspaper titles</text>
  <rect x="268" y="188" width="44" height="8" rx="2" fill="#4c8dd6" opacity="0.85"/>
  <text x="290" y="181" font-size="11.5" font-weight="bold" fill="currentColor" text-anchor="middle">92</text>
  <rect x="332" y="86" width="44" height="110" rx="3" fill="#e2903a" opacity="0.85"/>
  <text x="354" y="79" font-size="11.5" font-weight="bold" fill="currentColor" text-anchor="middle">1,258</text>
  <text x="290" y="214" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">1790</text>
  <text x="354" y="214" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">1835</text>
  <text x="322" y="234" font-size="12" font-weight="bold" fill="#e2903a" text-anchor="middle">&#215;14</text>

  <!-- panel 3: copies circulated per year -->
  <text x="526" y="48" font-size="12" fill="currentColor" text-anchor="middle">Copies mailed per year</text>
  <rect x="472" y="191" width="44" height="5" rx="2" fill="#4c8dd6" opacity="0.85"/>
  <text x="494" y="184" font-size="11.5" font-weight="bold" fill="currentColor" text-anchor="middle">&lt;4M</text>
  <rect x="536" y="86" width="44" height="110" rx="3" fill="#e2903a" opacity="0.85"/>
  <text x="558" y="79" font-size="11.5" font-weight="bold" fill="currentColor" text-anchor="middle">&gt;90M</text>
  <text x="494" y="214" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">1790</text>
  <text x="558" y="214" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">1835</text>
  <text x="526" y="234" font-size="12" font-weight="bold" fill="#e2903a" text-anchor="middle">&#215;23</text>

  <text x="24" y="258" font-size="11" fill="currentColor" opacity="0.6">Each panel to its own scale. Data: Howe, What Hath God Wrought (2007), chs. 1 and 6</text>
</svg>

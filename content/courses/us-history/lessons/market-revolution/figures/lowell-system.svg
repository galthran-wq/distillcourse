<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="24" y="22" font-size="13" font-weight="bold" fill="currentColor">The Waltham–Lowell system, and where it broke</text>

  <!-- pipeline boxes -->
  <g fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.8">
    <rect x="24" y="60" width="128" height="52" rx="5"/>
    <rect x="188" y="60" width="128" height="52" rx="5"/>
    <rect x="352" y="60" width="118" height="52" rx="5"/>
    <rect x="500" y="60" width="120" height="52" rx="5"/>
  </g>
  <g font-size="11.5" fill="currentColor">
    <text x="88" y="80" text-anchor="middle" font-weight="bold">farm household</text>
    <text x="88" y="96" text-anchor="middle" opacity="0.75" font-size="10.5">a daughter, age 15–30</text>
    <text x="252" y="80" text-anchor="middle" font-weight="bold">boardinghouse</text>
    <text x="252" y="96" text-anchor="middle" opacity="0.75" font-size="10.5">matron, curfew, church</text>
    <text x="411" y="80" text-anchor="middle" font-weight="bold">mill floor</text>
    <text x="411" y="96" text-anchor="middle" opacity="0.75" font-size="10.5">~73 hours a week</text>
    <text x="560" y="80" text-anchor="middle" font-weight="bold">cash wages</text>
    <text x="560" y="96" text-anchor="middle" opacity="0.75" font-size="10.5">$3–4/wk, board $1.25</text>
  </g>

  <!-- flow arrows -->
  <g stroke="currentColor" stroke-width="1.4" opacity="0.7">
    <line x1="152" y1="86" x2="182" y2="86"/>
    <line x1="316" y1="86" x2="346" y2="86"/>
    <line x1="470" y1="86" x2="494" y2="86"/>
  </g>
  <g fill="currentColor" opacity="0.7">
    <path d="M 182 86 l -8 -4 l 0 8 z"/>
    <path d="M 346 86 l -8 -4 l 0 8 z"/>
    <path d="M 494 86 l -8 -4 l 0 8 z"/>
  </g>

  <!-- wage outflow -->
  <g stroke="#5aa46a" stroke-width="1.4" fill="none" opacity="0.85">
    <polyline points="560,112 560,140"/>
  </g>
  <path d="M 560 140 l -4 -8 l 8 0 z" fill="#5aa46a" opacity="0.85"/>
  <text x="620" y="156" font-size="11" fill="#5aa46a" text-anchor="end">savings · schooling · money home</text>

  <!-- pressure points -->
  <g fill="#e2903a">
    <circle cx="560" cy="60" r="6"/>
    <circle cx="252" cy="60" r="6"/>
    <circle cx="411" cy="60" r="6"/>
  </g>
  <g stroke="#e2903a" stroke-width="1" opacity="0.7">
    <line x1="252" y1="54" x2="252" y2="40"/>
    <line x1="411" y1="54" x2="411" y2="40"/>
    <line x1="560" y1="54" x2="560" y2="40"/>
  </g>
  <g font-size="10.5" fill="#e2903a" text-anchor="middle">
    <text x="252" y="34">1836: board raised</text>
    <text x="411" y="34">1840s: speed-up, stretch-out</text>
    <text x="560" y="34">1834: wages cut 12.5%</text>
  </g>

  <!-- outcomes strip -->
  <g font-size="11" fill="currentColor">
    <rect x="24" y="196" width="596" height="100" rx="5" fill="none" stroke="#e2903a" stroke-width="1.2" opacity="0.9"/>
    <text x="36" y="216" font-weight="bold" fill="#e2903a">The pressure points produced the resistance:</text>
    <text x="36" y="236">1834 turn-out: ~800 walk out against the wage cut; the strike fails within days.</text>
    <text x="36" y="254">1836 turn-out: 1,500+ walk out against the board increase; the corporations back down.</text>
    <text x="36" y="272">1845: Lowell Female Labor Reform Association; ten-hour petitions gather thousands of signatures.</text>
    <text x="36" y="290">After 1845: Irish famine migrants replace the Yankee women; the boardinghouse system fades.</text>
  </g>
</svg>

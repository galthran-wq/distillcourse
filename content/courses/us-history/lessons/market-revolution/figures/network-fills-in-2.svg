<svg viewBox="0 0 640 430" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="24" y="24" font-size="13" font-weight="bold" fill="currentColor">1825 — the Erie Canal and the steamboat turn rivers into two-way roads</text>

  <!-- coastline -->
  <polyline points="545,60 520,95 500,120 485,145 470,160 460,180 448,200 445,215 452,235 450,270 432,308 412,330 380,345 340,362 300,375 255,390 200,398" fill="none" stroke="currentColor" stroke-width="1.3" opacity="0.5"/>

  <!-- lakes -->
  <path d="M 300 112 Q 335 103 370 118 Q 335 130 302 122 Z" fill="#4c8dd6" opacity="0.25"/>
  <path d="M 392 92 Q 425 84 455 94 Q 424 102 393 97 Z" fill="#4c8dd6" opacity="0.25"/>
  <path d="M 240 48 Q 252 46 254 80 L 256 120 Q 246 122 242 90 Z" fill="#4c8dd6" opacity="0.25"/>

  <!-- rivers: steamboats make them two-way -->
  <g stroke="#4c8dd6" stroke-width="2.4" fill="none" opacity="0.85">
    <polyline points="480,105 485,145"/>
    <polyline points="390,180 350,200 310,215 285,240 230,260"/>
    <polyline points="228,155 215,235 230,260 240,300 248,340 255,390"/>
  </g>
  <text x="196" y="150" font-size="10" fill="#4c8dd6" opacity="0.9">Mississippi</text>
  <text x="330" y="238" font-size="10" fill="#4c8dd6" opacity="0.9">Ohio</text>
  <path d="M 246 306 l -5 -10 l 9 1 z" fill="#4c8dd6"/>
  <path d="M 234 334 l 9 -1 l -4 10 z" fill="#4c8dd6"/>
  <text x="120" y="322" font-size="10" fill="#4c8dd6">steamboats: upstream</text>
  <text x="120" y="334" font-size="10" fill="#4c8dd6">now moves too (200+ boats by 1830)</text>

  <!-- turnpike roads -->
  <g stroke="currentColor" stroke-width="1.6" stroke-dasharray="4 3" fill="none" opacity="0.5">
    <polyline points="520,95 485,145 455,170 435,192"/>
    <polyline points="455,170 420,175 390,180"/>
    <polyline points="435,192 410,186 390,180"/>
  </g>
  <text x="404" y="205" font-size="10" fill="currentColor" opacity="0.7">National Road</text>

  <!-- ERIE CANAL: the frame's addition -->
  <polyline points="480,105 430,106 365,115" fill="none" stroke="#e2903a" stroke-width="3"/>
  <text x="396" y="128" font-size="11" font-weight="bold" fill="#e2903a">Erie Canal, 1825</text>

  <!-- cities -->
  <g fill="currentColor">
    <circle cx="520" cy="95" r="3.5"/><circle cx="485" cy="145" r="3.5"/><circle cx="480" cy="105" r="3"/>
    <circle cx="365" cy="115" r="3"/><circle cx="455" cy="170" r="3.5"/><circle cx="435" cy="192" r="3.5"/>
    <circle cx="390" cy="180" r="3"/><circle cx="340" cy="140" r="3"/><circle cx="300" cy="105" r="3"/>
    <circle cx="245" cy="125" r="3"/><circle cx="310" cy="215" r="3"/><circle cx="215" cy="235" r="3"/>
    <circle cx="255" cy="390" r="3.5"/><circle cx="432" cy="308" r="3"/>
  </g>
  <g font-size="10" fill="currentColor" opacity="0.85">
    <text x="528" y="93">Boston</text>
    <text x="493" y="152">New York</text>
    <text x="463" y="103">Albany</text>
    <text x="350" y="100">Buffalo</text>
    <text x="463" y="177">Philadelphia</text>
    <text x="443" y="199">Baltimore</text>
    <text x="362" y="196">Pittsburgh</text>
    <text x="304" y="136">Cleveland</text>
    <text x="264" y="100">Detroit</text>
    <text x="200" y="120">Chicago</text>
    <text x="318" y="222">Cincinnati</text>
    <text x="160" y="240">St. Louis</text>
    <text x="263" y="396">New Orleans</text>
    <text x="440" y="314">Charleston</text>
  </g>

  <text x="140" y="418" font-size="10.5" fill="currentColor" opacity="0.7">The lakes now drain east to New York harbor, not only south to New Orleans</text>
</svg>

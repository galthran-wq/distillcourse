<svg viewBox="0 0 640 250" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="24" y="22" font-size="13" font-weight="bold" fill="currentColor">Cost to move one ton one mile, in cents</text>

  <!-- wagon 1816: ~30c -->
  <rect x="180" y="44" width="420" height="26" rx="3" fill="#e2903a" opacity="0.85"/>
  <text x="172" y="61" font-size="12" fill="currentColor" text-anchor="end">freight wagon, 1816</text>
  <text x="594" y="61" font-size="12" font-weight="bold" fill="currentColor" text-anchor="end">~30¢</text>

  <!-- wagon 1850s: ~15c -->
  <rect x="180" y="82" width="210" height="26" rx="3" fill="#e2903a" opacity="0.5"/>
  <text x="172" y="99" font-size="12" fill="currentColor" text-anchor="end">wagon, good roads, 1850s</text>
  <text x="398" y="99" font-size="12" font-weight="bold" fill="currentColor">~15¢</text>

  <!-- railroad 1850s: ~3c -->
  <rect x="180" y="120" width="42" height="26" rx="3" fill="#5aa46a" opacity="0.85"/>
  <text x="172" y="137" font-size="12" fill="currentColor" text-anchor="end">railroad, 1850s</text>
  <text x="230" y="137" font-size="12" font-weight="bold" fill="currentColor">~3¢</text>

  <!-- canal 1830s-50s: ~1-3c -->
  <rect x="180" y="158" width="28" height="26" rx="3" fill="#4c8dd6" opacity="0.85"/>
  <text x="172" y="175" font-size="12" fill="currentColor" text-anchor="end">canal boat, 1830s–50s</text>
  <text x="216" y="175" font-size="12" font-weight="bold" fill="currentColor">1–3¢</text>

  <!-- scale line -->
  <line x1="180" y1="196" x2="600" y2="196" stroke="currentColor" stroke-width="0.8" opacity="0.35"/>
  <g font-size="10.5" fill="currentColor" opacity="0.55" text-anchor="middle">
    <text x="180" y="212">0</text>
    <text x="320" y="212">10¢</text>
    <text x="460" y="212">20¢</text>
    <text x="600" y="212">30¢</text>
  </g>

  <text x="24" y="238" font-size="11" fill="currentColor" opacity="0.6">Sources: US Senate committee report, 1816; antebellum rate averages (Taylor, The Transportation Revolution)</text>
</svg>

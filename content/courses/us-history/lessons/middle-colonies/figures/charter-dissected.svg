<svg viewBox="0 0 620 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="310" y="20" text-anchor="middle" font-size="13" font-weight="bold" fill="currentColor">Charter of Privileges (1701), Article I: what it grants, what it still requires</text>

  <!-- the operative sentence, condensed -->
  <rect x="20" y="34" width="580" height="112" rx="6" fill="none" stroke="currentColor" opacity="0.35"/>
  <text x="32" y="56" font-size="12" fill="currentColor">"… no person or persons inhabiting in this province or territories,</text>
  <text x="32" y="76" font-size="12" fill="#4c8dd6">who shall confess and acknowledge one almighty God</text>
  <text x="32" y="96" font-size="12" fill="#e2903a">shall be in any case molested or prejudiced … because of his or their</text>
  <text x="32" y="116" font-size="12" fill="#e2903a">conscientious persuasion or practice, nor be compelled to frequent or</text>
  <text x="32" y="136" font-size="12" fill="#e2903a">maintain any religious worship, place, or ministry …"</text>

  <!-- labels with pointer lines -->
  <line x1="352" y1="72" x2="470" y2="60" stroke="#4c8dd6" stroke-width="1"/>
  <text x="474" y="63" font-size="11" font-weight="bold" fill="#4c8dd6">boundary: theists only</text>

  <line x1="330" y1="140" x2="330" y2="158" stroke="#e2903a" stroke-width="1"/>
  <text x="330" y="172" text-anchor="middle" font-size="11" font-weight="bold" fill="#e2903a">grant: no molestation, no compelled worship, no church tax</text>

  <!-- second clause -->
  <rect x="20" y="184" width="360" height="52" rx="6" fill="none" stroke="#4c8dd6" opacity="0.7"/>
  <text x="32" y="204" font-size="11.5" fill="#4c8dd6">"all persons who also profess to believe in Jesus Christ …</text>
  <text x="32" y="222" font-size="11.5" fill="#4c8dd6">[shall be] capable … to serve this government"</text>
  <text x="392" y="204" font-size="11" font-weight="bold" fill="#4c8dd6">boundary: office restricted</text>
  <text x="392" y="218" font-size="11" fill="#4c8dd6">to professing Christians</text>

  <!-- entrenchment clause -->
  <rect x="20" y="246" width="360" height="36" rx="6" fill="none" stroke="#5aa46a" opacity="0.8"/>
  <text x="32" y="262" font-size="11.5" fill="#5aa46a">"the first article … shall be kept and remain</text>
  <text x="32" y="276" font-size="11.5" fill="#5aa46a">without any alteration, inviolably forever"</text>
  <text x="392" y="262" font-size="11" font-weight="bold" fill="#5aa46a">entrenchment: Article I</text>
  <text x="392" y="276" font-size="11" fill="#5aa46a">exempt even from the 6/7 rule</text>

  <!-- duration bar -->
  <line x1="60" y1="308" x2="560" y2="308" stroke="currentColor" opacity="0.3"/>
  <rect x="60" y="302" width="500" height="12" rx="3" fill="#e2903a" opacity="0.75"/>
  <text x="60" y="296" text-anchor="middle" font-size="11" fill="currentColor">1701</text>
  <text x="560" y="296" text-anchor="middle" font-size="11" fill="currentColor">1776</text>
  <text x="310" y="328" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">in force 75 years, until the Pennsylvania Constitution of 1776</text>
</svg>

images:
  - file: middle-colonies-new-amsterdam-view-1660.jpg
    title: "\"Nieuw Amsterdam ofte nue Nieuw Iorx opt 't Eylant Man\" — watercolor prospect of New Amsterdam from the harbor, anonymous, c. 1660"
    credit: "Anonymous draughtsman, c. 1660; Rijksmuseum, Amsterdam, object NG-28; file via Wikimedia Commons"
    source_url: "https://commons.wikimedia.org/wiki/File:Nieuw_Amsterdam_ofte_nue_Nieuw_Iorx_opt't_Eylant_Man_(titel_op_object),_NG-28.jpg"

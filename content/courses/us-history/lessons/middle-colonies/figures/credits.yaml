    retrieved: "2026-07-31"
    located: "Rijksmuseum object NG-28, watercolor, 43.5 × 64.5 cm (hdl.handle.net/10934/RM0001.COLLECT.248719); the Commons file is the museum's 6186×4963 scan of the full sheet, the drawing inside its ruled gold-and-black frame with the handwritten title across the sky"
    modifications: "cropped from the full sheet to just outside the drawing's own ruled frame (cutting the blank, stained paper margins), downscaled to 2400px wide, metadata stripped, re-encoded as JPEG at quality 82; nothing inside the frame retouched"
  - file: middle-colonies-quaker-meeting-heemskerck.jpg
    title: "Egbert van Heemskerck, \"A Quakers' meeting\" — oil on canvas, late seventeenth century, a woman preaching from an upturned barrel"
    credit: "Egbert van Heemskerck (1634/35–1704); monogrammed oil on canvas, 76 × 63 cm, photographed for sale at Auktionshaus Zeller; file via Wikimedia Commons"
    source_url: "https://commons.wikimedia.org/wiki/File:Egbert_van_Heemskerck_Quakers_meeting.jpg"
    license: "public domain (seventeenth-century painting, artist d. 1704; Wikimedia Commons carries the photograph as PD-Art with the Creative Commons Public Domain Mark 1.0, a faithful reproduction of a two-dimensional public-domain work)"
    retrieved: "2026-07-31"
    located: "Wikimedia Commons file Egbert_van_Heemskerck_Quakers_meeting.jpg (824×1000) — the whole canvas: the meeting hall with its gallery, the woman minister standing on the barrel at center, the crowd of listeners"
    modifications: "none to the picture — the whole canvas at its native 824×1000; metadata stripped and re-encoded as JPEG"
  - file: middle-colonies-flushing-remonstrance-1657.jpg
    title: "\"Remonstrance of the magistrates and inhabitants of Flushing, L. I. (with names), against the law against Quakers\", December 27, 1657 — the third and last leaf, carrying the signatures and marks"
    credit: "New York State Archives. New Netherland. Council. Dutch colonial council minutes, 1638–1665. Series A1809, Volume 8, document NYSA_A1809-78_V08_0625; digitised under the Archives' Dutch Colonial Records Digitization Project and served from New York State Archives Digital Collections"
    source_url: "https://www.nysarchivestrust.org/exhibits/right-petition/dutch-colonial-petitions/flushing-remonstrance"
    license: "public domain (written 1657); the New York State Archives states of its scan \"This image is provided for education and research purposes. Rights may be reserved\", and Wikimedia Commons carries the same New York State Archives scan of this document as public domain"
    retrieved: "2026-07-31"
    located: "third of the three page images published for NYSA_A1809-78_V08_0625 — the leaf of names and marks, mounted on conservation paper, its head and right edge burned away in the 1911 New York State Capitol fire; the sheet survives bound into volume 8 of the council minutes, where it was filed when it reached Stuyvesant's council"
    modifications: "none to the picture — the Archives' page image exactly as digitised (700×1083, its native derivative size), neither cropped nor scaled; metadata stripped and re-encoded as JPEG at quality 86"
    background: light
  - file: middle-colonies-penn-portrait.png
    title: "William Penn — an eighteenth-century engraved portrait (c. 1750)"
    credit: "Unknown engraver, 18th century; Bibliothèque publique et universitaire de Neuchâtel, IconoNeuch portrait collection, via Wikimedia Commons"
    source_url: "https://commons.wikimedia.org/wiki/File:William_Penn.png"
    license: "public domain (engraved c. 1750, published before 1 January 1931); Wikimedia Commons additionally carries the file under the Creative Commons Public Domain Mark 1.0"
    retrieved: "2026-07-31"
    located: "Wikimedia Commons file William_Penn.png (719×894), from the Neuchâtel library's A–Z portrait iconography (bpun.unine.ch/IconoNeuch/Portraits/A-Z/P.htm) — the whole plate: half-length bust in tricorne and long wig, inside its double-ruled oval frame"
    modifications: "none to the picture — the whole plate at its native 719×894, neither cropped nor scaled; the transparent area outside the oval frame was flattened onto white so the engraving stays visible in the dark theme, and metadata was stripped on re-encoding"
    background: light
  - file: middle-colonies-germantown-protest-1688-*.jpg
    title: "The 1688 Germantown Quaker Petition Against Slavery — both leaves after conservation, and the closing page carrying the four signatures and the Dublin Monthly Meeting's minute"
    credit: "Francis Daniel Pastorius, Garret Hendericks, Derick op den Graeff and Abraham op den Graeff, Germantown, 1688; original held by Haverford College Quaker & Special Collections (joint repository, with Swarthmore's Friends Historical Library, for the records of Philadelphia Yearly Meeting). Photographed by the conservators who treated the document at the Conservation Center for Art and Historic Artifacts, Philadelphia, 2005–07, for Germantown Monthly Meeting of the Society of Friends; file obtained via Wikimedia Commons"
    source_url: "https://commons.wikimedia.org/wiki/File:The_1688_Germantown_Quaker_petition_against_slavery.jpg"
    license: "public domain (manuscript of 1688; Wikimedia Commons carries the conservators' photograph as PD-art / PD-old-100, a faithful reproduction of a two-dimensional public-domain work)"
    retrieved: "2026-07-31"
    located: "Wikimedia Commons file The_1688_Germantown_Quaker_petition_against_slavery.jpg (1985×1554), showing both sides of the 9 x 14 inch sheet, the iron-gall ink substantially faded; frame 2 is the lower right of that plate — the closing lines, the date \"yᵉ 18 of the 2 month 1688\", the signatures gerret hendericks / derick vp de graeff / francis daniell Pastorius / Abraham op den graef, the Dublin Monthly Meeting minute signed \"p Jo: Hart\", and the Quarterly Meeting's note beneath it"
    modifications: "frame 1 is the whole plate downscaled to 880px; frame 2 is a crop of the same plate (880x689+1105+865) to the closing block, at native scale. Both re-encoded as JPEG at quality 86 with metadata stripped. Nothing on the document retouched, removed or enhanced"
    background: light

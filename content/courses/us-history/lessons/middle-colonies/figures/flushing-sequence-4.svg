<svg viewBox="0 0 560 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="280" y="22" text-anchor="middle" font-size="13" font-weight="bold" fill="currentColor">Conscience against the director-general, 1657–1663</text>

  <rect x="40" y="40" width="480" height="50" rx="6" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <text x="52" y="60" font-size="11.5" font-weight="bold" fill="#e2903a">Dec 27, 1657 — Flushing signs a remonstrance (30 signers, none Quakers)</text>
  <text x="52" y="78" font-size="11" fill="currentColor">"wee cannot in conscience lay violent hands upon them"</text>

  <rect x="40" y="104" width="480" height="50" rx="6" fill="none" stroke="#4c8dd6" stroke-width="1.5"/>
  <text x="52" y="124" font-size="11.5" font-weight="bold" fill="#4c8dd6">1657–58 — Stuyvesant answers with force</text>
  <text x="52" y="142" font-size="11" fill="currentColor">clerk and sheriff arrested; town officers replaced with appointees</text>

  <rect x="40" y="168" width="480" height="50" rx="6" fill="none" stroke="#4c8dd6" stroke-width="1.5"/>
  <text x="52" y="188" font-size="11.5" font-weight="bold" fill="#4c8dd6">1662 — John Bowne banished for hosting Quaker worship</text>
  <text x="52" y="206" font-size="11" fill="currentColor">he sails to Amsterdam and appeals over Stuyvesant's head, to the Company</text>

  <rect x="40" y="232" width="480" height="50" rx="6" fill="none" stroke="#5aa46a" stroke-width="1.5"/>
  <text x="52" y="252" font-size="11.5" font-weight="bold" fill="#5aa46a">1663 — the directors overrule Stuyvesant</text>
  <text x="52" y="270" font-size="11" fill="currentColor">toleration ordered restored; the colony needs migrants; Bowne comes home</text>
</svg>

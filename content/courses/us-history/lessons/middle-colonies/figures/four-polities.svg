<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="320" y="20" text-anchor="middle" font-size="13" font-weight="bold" fill="currentColor">Four polities, 1700–1750: the same rows, four answers</text>

  <!-- column x-centers: labels col 8..118; MA 122..248; VA 252..378; NY 382..508; PA 512..636 -->
  <!-- header row -->
  <text x="185" y="44" text-anchor="middle" font-size="12" font-weight="bold" fill="currentColor">Massachusetts</text>
  <text x="315" y="44" text-anchor="middle" font-size="12" font-weight="bold" fill="currentColor">Virginia</text>
  <text x="445" y="44" text-anchor="middle" font-size="12" font-weight="bold" fill="currentColor">New York</text>
  <text x="575" y="44" text-anchor="middle" font-size="12" font-weight="bold" fill="#e2903a">Pennsylvania</text>

  <!-- PA column highlight -->
  <rect x="512" y="52" width="126" height="262" rx="6" fill="#e2903a" opacity="0.10"/>
  <rect x="512" y="52" width="126" height="262" rx="6" fill="none" stroke="#e2903a" stroke-width="1.5"/>

  <!-- row separators -->
  <line x1="8" y1="52" x2="638" y2="52" stroke="currentColor" opacity="0.35"/>
  <line x1="8" y1="118" x2="638" y2="118" stroke="currentColor" opacity="0.2"/>
  <line x1="8" y1="182" x2="638" y2="182" stroke="currentColor" opacity="0.2"/>
  <line x1="8" y1="246" x2="638" y2="246" stroke="currentColor" opacity="0.2"/>

  <!-- row labels -->
  <text x="10" y="72" font-size="11" font-weight="bold" fill="currentColor">Established</text>
  <text x="10" y="85" font-size="11" font-weight="bold" fill="currentColor">church</text>
  <text x="10" y="138" font-size="11" font-weight="bold" fill="currentColor">Franchise</text>
  <text x="10" y="202" font-size="11" font-weight="bold" fill="currentColor">Assembly</text>
  <text x="10" y="266" font-size="11" font-weight="bold" fill="currentColor">Toleration</text>
  <text x="10" y="279" font-size="11" font-weight="bold" fill="currentColor">text</text>

  <!-- Row 1: established church -->
  <text x="185" y="68" text-anchor="middle" font-size="10.5" fill="currentColor">Congregational,</text>
  <text x="185" y="81" text-anchor="middle" font-size="10.5" fill="currentColor">town-taxed</text>
  <text x="185" y="94" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.55">minister in every town</text>
  <text x="315" y="68" text-anchor="middle" font-size="10.5" fill="currentColor">Church of England,</text>
  <text x="315" y="81" text-anchor="middle" font-size="10.5" fill="currentColor">parish-taxed</text>
  <text x="315" y="94" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.55">vestry runs poor relief</text>
  <text x="445" y="68" text-anchor="middle" font-size="10.5" fill="currentColor">Anglican on paper,</text>
  <text x="445" y="81" text-anchor="middle" font-size="10.5" fill="currentColor">4 counties (1693)</text>
  <text x="445" y="94" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.55">contested by dissenters</text>
  <text x="575" y="68" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#e2903a">none</text>
  <text x="575" y="81" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.55">no church tax,</text>
  <text x="575" y="94" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.55">ever</text>

  <!-- Row 2: franchise -->
  <text x="185" y="134" text-anchor="middle" font-size="10.5" fill="currentColor">church members</text>
  <text x="185" y="147" text-anchor="middle" font-size="10.5" fill="currentColor">to 1691,</text>
  <text x="185" y="160" text-anchor="middle" font-size="10.5" fill="currentColor">property after</text>
  <text x="315" y="134" text-anchor="middle" font-size="10.5" fill="currentColor">white male</text>
  <text x="315" y="147" text-anchor="middle" font-size="10.5" fill="currentColor">freeholders</text>
  <text x="315" y="160" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.55">race line by statute, 1723</text>
  <text x="445" y="134" text-anchor="middle" font-size="10.5" fill="currentColor">male freeholders</text>
  <text x="445" y="147" text-anchor="middle" font-size="10.5" fill="currentColor">and urban freemen</text>
  <text x="575" y="134" text-anchor="middle" font-size="10.5" fill="currentColor">male property-holders;</text>
  <text x="575" y="147" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#e2903a">affirmation accepted</text>
  <text x="575" y="160" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.55">no oath required</text>

  <!-- Row 3: assembly -->
  <text x="185" y="198" text-anchor="middle" font-size="10.5" fill="currentColor">bicameral General Court</text>
  <text x="185" y="211" text-anchor="middle" font-size="10.5" fill="currentColor">+ town meeting below</text>
  <text x="315" y="198" text-anchor="middle" font-size="10.5" fill="currentColor">elected Burgesses,</text>
  <text x="315" y="211" text-anchor="middle" font-size="10.5" fill="currentColor">appointed Council</text>
  <text x="315" y="224" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.55">+ county courts below</text>
  <text x="445" y="198" text-anchor="middle" font-size="10.5" fill="currentColor">elected assembly,</text>
  <text x="445" y="211" text-anchor="middle" font-size="10.5" fill="currentColor">appointed council</text>
  <text x="445" y="224" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.55">assembly from 1683/1691</text>
  <text x="575" y="198" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#e2903a">unicameral (1701)</text>
  <text x="575" y="211" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.55">the only one</text>
  <text x="575" y="224" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.55">in British America</text>

  <!-- Row 4: toleration text -->
  <text x="185" y="262" text-anchor="middle" font-size="10.5" fill="currentColor">liberty for Protestants</text>
  <text x="185" y="275" text-anchor="middle" font-size="10.5" fill="currentColor">imposed by the</text>
  <text x="185" y="288" text-anchor="middle" font-size="10.5" fill="currentColor">1691 royal charter</text>
  <text x="315" y="262" text-anchor="middle" font-size="10.5" fill="currentColor">conformity; licensed</text>
  <text x="315" y="275" text-anchor="middle" font-size="10.5" fill="currentColor">dissent after 1689</text>
  <text x="445" y="262" text-anchor="middle" font-size="10.5" fill="currentColor">1683: those who</text>
  <text x="445" y="275" text-anchor="middle" font-size="10.5" fill="currentColor">"professe ffaith in God</text>
  <text x="445" y="288" text-anchor="middle" font-size="10.5" fill="currentColor">by Jesus Christ"</text>
  <text x="575" y="262" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#e2903a">1701: all who own</text>
  <text x="575" y="275" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#e2903a">"one almighty God";</text>
  <text x="575" y="288" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.55">office: Christians only</text>

  <text x="320" y="324" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.55">Pennsylvania is the outlier on every row: no establishment, affirmation, one chamber, the widest toleration text.</text>
</svg>

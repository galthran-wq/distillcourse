<svg viewBox="0 0 620 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="310" y="20" text-anchor="middle" font-size="13" font-weight="bold" fill="currentColor">Two ports, 1700–1775: Philadelphia passes a stalled Boston</text>

  <!-- axes -->
  <line x1="80" y1="280" x2="580" y2="280" stroke="currentColor" stroke-width="1"/>
  <line x1="80" y1="280" x2="80" y2="40" stroke="currentColor" stroke-width="1"/>

  <!-- y ticks: 0 at 280, 35k at 50 -> y = 280 - v/35000*230 -->
  <text x="72" y="284" text-anchor="end" font-size="11" fill="currentColor" opacity="0.55">0</text>
  <line x1="76" y1="214" x2="80" y2="214" stroke="currentColor"/>
  <text x="72" y="218" text-anchor="end" font-size="11" fill="currentColor" opacity="0.55">10k</text>
  <line x1="76" y1="149" x2="80" y2="149" stroke="currentColor"/>
  <text x="72" y="153" text-anchor="end" font-size="11" fill="currentColor" opacity="0.55">20k</text>
  <line x1="76" y1="83" x2="80" y2="83" stroke="currentColor"/>
  <text x="72" y="87" text-anchor="end" font-size="11" fill="currentColor" opacity="0.55">30k</text>

  <!-- x: 1700 x=80, 1775 x=580 -> 6.667 px/yr -->
  <text x="80" y="298" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">1700</text>
  <text x="213" y="298" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">1720</text>
  <text x="347" y="298" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">1740</text>
  <text x="480" y="298" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">1760</text>
  <text x="580" y="298" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">1775</text>

  <!-- Boston (blue): 1700 6.7k y=236; 1720 12k y=201; 1743 16.3k y=173; 1760 15.6k y=177; 1775 16k y=175 -->
  <polyline points="80,236 213,201 367,173 480,177 580,175" fill="none" stroke="#4c8dd6" stroke-width="2.5"/>
  <circle cx="80" cy="236" r="3.5" fill="#4c8dd6"/>
  <circle cx="213" cy="201" r="3.5" fill="#4c8dd6"/>
  <circle cx="367" cy="173" r="3.5" fill="#4c8dd6"/>
  <circle cx="480" cy="177" r="3.5" fill="#4c8dd6"/>
  <circle cx="580" cy="175" r="3.5" fill="#4c8dd6"/>
  <text x="300" y="160" text-anchor="middle" font-size="11" font-weight="bold" fill="#4c8dd6">Boston: ≈16,000 by 1743, flat to 1775</text>

  <!-- Philadelphia (amber): 1700 2.5k y=264; 1740 9.5k y=218; 1760 19k y=155; 1775 32k y=70 -->
  <polyline points="80,264 347,218 480,155 580,70" fill="none" stroke="#e2903a" stroke-width="2.5"/>
  <circle cx="80" cy="264" r="3.5" fill="#e2903a"/>
  <circle cx="347" cy="218" r="3.5" fill="#e2903a"/>
  <circle cx="480" cy="155" r="3.5" fill="#e2903a"/>
  <circle cx="580" cy="70" r="3.5" fill="#e2903a"/>
  <text x="576" y="58" text-anchor="end" font-size="11" font-weight="bold" fill="#e2903a">Philadelphia: ≈32,000 with suburbs, 1775</text>

  <!-- crossover: ~1755 x=447 -->
  <line x1="447" y1="62" x2="447" y2="280" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5"/>
  <text x="447" y="272" text-anchor="middle" font-size="11" font-weight="bold" fill="currentColor">≈1755: Philadelphia passes Boston</text>
</svg>

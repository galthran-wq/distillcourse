<svg viewBox="0 0 620 340" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="310" y="20" text-anchor="middle" font-size="13" font-weight="bold" fill="currentColor">Pennsylvania's population, 1680–1780: recruitment as policy</text>

  <!-- axes -->
  <line x1="70" y1="300" x2="600" y2="300" stroke="currentColor" stroke-width="1"/>
  <line x1="70" y1="300" x2="70" y2="40" stroke="currentColor" stroke-width="1"/>

  <!-- y ticks -->
  <text x="62" y="304" text-anchor="end" font-size="11" fill="currentColor" opacity="0.55">0</text>
  <line x1="66" y1="221" x2="70" y2="221" stroke="currentColor"/>
  <text x="62" y="225" text-anchor="end" font-size="11" fill="currentColor" opacity="0.55">100k</text>
  <line x1="66" y1="142" x2="70" y2="142" stroke="currentColor"/>
  <text x="62" y="146" text-anchor="end" font-size="11" fill="currentColor" opacity="0.55">200k</text>
  <line x1="66" y1="64" x2="70" y2="64" stroke="currentColor"/>
  <text x="62" y="68" text-anchor="end" font-size="11" fill="currentColor" opacity="0.55">300k</text>

  <!-- x ticks: 1680 x=70, step 106 per 20y -->
  <text x="70" y="318" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">1680</text>
  <text x="176" y="318" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">1700</text>
  <text x="282" y="318" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">1720</text>
  <text x="388" y="318" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">1740</text>
  <text x="494" y="318" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">1760</text>
  <text x="600" y="318" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">1780</text>

  <!-- curve: 1680:700 y=299; 1700:18000 y=286; 1720:31000 y=276; 1740:85600 y=233; 1760:183700 y=155; 1780:327300 y=43 -->
  <polyline points="70,299 176,286 282,276 388,233 494,155 600,43" fill="none" stroke="#e2903a" stroke-width="2.5"/>
  <circle cx="70" cy="299" r="4" fill="#e2903a"/>
  <circle cx="176" cy="286" r="4" fill="#e2903a"/>
  <circle cx="282" cy="276" r="4" fill="#e2903a"/>
  <circle cx="388" cy="233" r="4" fill="#e2903a"/>
  <circle cx="494" cy="155" r="4" fill="#e2903a"/>
  <circle cx="600" cy="43" r="4" fill="#e2903a"/>
  <text x="596" y="34" text-anchor="end" font-size="11" font-weight="bold" fill="#e2903a">≈327,000</text>
  <text x="94" y="290" font-size="11" fill="#e2903a">≈700</text>

  <!-- instruments box -->
  <rect x="90" y="46" width="330" height="112" rx="6" fill="none" stroke="#4c8dd6" opacity="0.8"/>
  <text x="102" y="66" font-size="11.5" font-weight="bold" fill="#4c8dd6">The recruitment instruments, in place first:</text>
  <text x="102" y="84" font-size="11" fill="#4c8dd6">1681  promotional tract printed in German &amp; Dutch</text>
  <text x="102" y="101" font-size="11" fill="#4c8dd6">1682  liberty of conscience by statute</text>
  <text x="102" y="118" font-size="11" fill="#4c8dd6">1683  Germantown founded by the first German migrants</text>
  <text x="102" y="135" font-size="11" fill="#4c8dd6">          affirmation accepted in place of oaths</text>
  <text x="102" y="152" font-size="11" fill="#4c8dd6">          cheap land, easy naturalization</text>

  <!-- arrow from box to early curve -->
  <line x1="230" y1="158" x2="230" y2="270" stroke="#4c8dd6" stroke-width="1" stroke-dasharray="3 3" opacity="0.7"/>
  <path d="M 230 270 L 226 262 L 234 262 Z" fill="#4c8dd6" opacity="0.7"/>
  <text x="76" y="230" font-size="10.5" fill="#4c8dd6">instruments precede</text>
  <text x="76" y="244" font-size="10.5" fill="#4c8dd6">the curve's turn</text>
</svg>

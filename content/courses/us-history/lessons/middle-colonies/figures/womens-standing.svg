<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="320" y="20" text-anchor="middle" font-size="13" font-weight="bold" fill="currentColor">A married woman's legal standing: three regimes, three answers</text>

  <!-- columns: labels 8..108; coverture 112..282; dutch 286..456; quaker 460..632 -->
  <text x="197" y="46" text-anchor="middle" font-size="12" font-weight="bold" fill="currentColor">English coverture</text>
  <text x="371" y="46" text-anchor="middle" font-size="12" font-weight="bold" fill="currentColor">Dutch practice</text>
  <text x="546" y="46" text-anchor="middle" font-size="12" font-weight="bold" fill="currentColor">Quaker meeting</text>
  <text x="197" y="59" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.55">all English colonies</text>
  <text x="371" y="59" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.55">New Netherland, to 1664</text>
  <text x="546" y="59" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.55">Pennsylvania Friends</text>

  <line x1="8" y1="66" x2="632" y2="66" stroke="currentColor" opacity="0.35"/>
  <line x1="8" y1="140" x2="632" y2="140" stroke="currentColor" opacity="0.2"/>
  <line x1="8" y1="206" x2="632" y2="206" stroke="currentColor" opacity="0.2"/>

  <!-- row labels -->
  <text x="10" y="94" font-size="11" font-weight="bold" fill="currentColor">Property in</text>
  <text x="10" y="107" font-size="11" font-weight="bold" fill="currentColor">marriage?</text>
  <text x="10" y="168" font-size="11" font-weight="bold" fill="currentColor">Make a will?</text>
  <text x="10" y="234" font-size="11" font-weight="bold" fill="currentColor">Voice in</text>
  <text x="10" y="247" font-size="11" font-weight="bold" fill="currentColor">governance?</text>

  <!-- Row 1 -->
  <text x="197" y="86" text-anchor="middle" font-size="10.5" fill="currentColor">no: her "legal existence</text>
  <text x="197" y="99" text-anchor="middle" font-size="10.5" fill="currentColor">… is suspended" (Blackstone);</text>
  <text x="197" y="112" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.55">widow's dower: 1/3 life interest</text>
  <rect x="290" y="72" width="164" height="48" rx="5" fill="#5aa46a" opacity="0.12"/>
  <text x="371" y="86" text-anchor="middle" font-size="10.5" fill="#5aa46a">yes: community of goods;</text>
  <text x="371" y="99" text-anchor="middle" font-size="10.5" fill="#5aa46a">wife trades in her own name</text>
  <text x="371" y="112" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.55">case: Margaret Hardenbroeck</text>
  <text x="546" y="86" text-anchor="middle" font-size="10.5" fill="currentColor">no: Pennsylvania law</text>
  <text x="546" y="99" text-anchor="middle" font-size="10.5" fill="currentColor">follows coverture</text>

  <!-- Row 2 -->
  <text x="197" y="160" text-anchor="middle" font-size="10.5" fill="currentColor">only with the</text>
  <text x="197" y="173" text-anchor="middle" font-size="10.5" fill="currentColor">husband's consent</text>
  <rect x="290" y="146" width="164" height="46" rx="5" fill="#5aa46a" opacity="0.12"/>
  <text x="371" y="160" text-anchor="middle" font-size="10.5" fill="#5aa46a">yes: mutual wills,</text>
  <text x="371" y="173" text-anchor="middle" font-size="10.5" fill="#5aa46a">spouses as equal heirs</text>
  <text x="546" y="160" text-anchor="middle" font-size="10.5" fill="currentColor">as under</text>
  <text x="546" y="173" text-anchor="middle" font-size="10.5" fill="currentColor">common law</text>

  <!-- Row 3 -->
  <text x="197" y="228" text-anchor="middle" font-size="10.5" fill="currentColor">none: no vote,</text>
  <text x="197" y="241" text-anchor="middle" font-size="10.5" fill="currentColor">no office, no jury</text>
  <text x="371" y="228" text-anchor="middle" font-size="10.5" fill="currentColor">none formally;</text>
  <text x="371" y="241" text-anchor="middle" font-size="10.5" fill="currentColor">broad economic standing</text>
  <rect x="464" y="212" width="164" height="62" rx="5" fill="#5aa46a" opacity="0.12"/>
  <text x="546" y="228" text-anchor="middle" font-size="10.5" fill="#5aa46a">yes, inside the Society:</text>
  <text x="546" y="241" text-anchor="middle" font-size="10.5" fill="#5aa46a">women's meetings rule on</text>
  <text x="546" y="254" text-anchor="middle" font-size="10.5" fill="#5aa46a">marriage and poor relief;</text>
  <text x="546" y="267" text-anchor="middle" font-size="10.5" fill="#5aa46a">women travel as ministers</text>

  <!-- erosion arrow on Dutch column -->
  <line x1="371" y1="278" x2="371" y2="300" stroke="#e2903a" stroke-width="1.5"/>
  <path d="M 371 302 L 366 293 L 376 293 Z" fill="#e2903a"/>
  <text x="371" y="316" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#e2903a">after 1664: English law phases in — mutual wills and women traders fade</text>
</svg>

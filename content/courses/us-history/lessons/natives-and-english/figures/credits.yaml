images:
  - file: natives-and-english-underhill-mystic-woodcut.jpg
    title: "\"The figure of the Indians' fort or palizado in New England and the manner of the destroying it by Captayne Underhill and Captayne Mason\" — the 1638 engraving of the assault on the Pequot fort at Mystic"
    credit: "Engraving signed \"RH\", plate in John Underhill, Nevves from America (London: printed by J. D. for Peter Cole, 1638) — Library of Congress, Rare Book and Special Collections Division (Illus. in E83.63 .U55); digital file from a black-and-white film copy negative, Prints and Photographs Division, digital ID cph.3a32588, reproduction no. LC-USZ62-32055; file obtained via Wikimedia Commons"
    source_url: "https://www.loc.gov/pictures/item/2001695745/"
    license: "public domain (engraved 1638); the Library of Congress states \"No known restrictions on publication\" for its reproduction, and Wikimedia Commons carries the file as PD-old-100-1923"
    retrieved: "2026-07-31"
    located: "Library of Congress digital ID cph.3a32588 — the whole plate: title block at upper left, the engraver's \"RH\" monogram at lower left, the palisade with \"The Indians houses\" and \"Their Streets\" inside, the English ring with the two entry points named for Underhill and Mason, and the outer ring of allied Native archers"
    modifications: "none to the picture — the whole plate as the Library of Congress digitised it, neither cropped nor scaled (1536×1266, its native digitised size); metadata stripped and re-encoded as JPEG at quality 88"

  - file: natives-and-english-wampum-belt-peabody.jpg
    title: "Wampum belt, Iroquois and Algonquian, commemorating a peace treaty in the seventeenth century — purple quahog and white whelk shell beads woven on hide, with a loose string of white wampum beside it"
    credit: "Native American Collection, Peabody Museum of Archaeology and Ethnology, Harvard University, Cambridge, Massachusetts; exhibit photograph by Daderot (2012), via Wikimedia Commons"
    source_url: "https://commons.wikimedia.org/wiki/File:Wampum_belt,_Iroquois_and_Algonkian,_commemorating_peace_treaty_in_17th_century_-_Native_American_collection_-_Peabody_Museum,_Harvard_University_-_DSC05807.jpg"
    license: "CC0 1.0 Universal (the photographer's public-domain dedication, as stated on Wikimedia Commons; the belt itself is a seventeenth-century artefact)"
    retrieved: "2026-07-31"
    located: "Wikimedia Commons file DSC05807.jpg (5472×3506 original), photographed in the Peabody Museum's Native American galleries; the museum's label identifies the belt as Iroquois and Algonquian, commemorating a seventeenth-century peace treaty"
    modifications: "cropped from 5472×3506 to 5472×2500 (case furniture above and below the belt removed; the belt, its fringes, and the loose bead string kept), downscaled to 2000px and re-encoded as JPEG; nothing on the object retouched"

  - file: natives-and-english-foster-map-new-england-1677.jpg
    title: "A Map of New-England, Being the First that Ever was Here Cut, and Done by the Best Pattern that Could be Had (Boston, 1677) — the \"White hills\" version, state 2"
    credit: "John Foster, cartographer and woodcut engraver, after the 1665 survey by William Reed; issued with William Hubbard, A Narrative of the Troubles with the Indians in New-England (Boston, 1677) — Boston Public Library, Rare Books Department (G.365.62), Norman B. Leventhal Map & Education Center Collection; digitised on Digital Commonwealth"
    source_url: "https://www.digitalcommonwealth.org/search/commonwealth:3f462s808"
    license: "no known copyright restrictions (woodcut printed 1677; the Boston Public Library records the digitised sheet as \"No known restrictions on use\")"
    retrieved: "2026-07-31"
    located: "Digital Commonwealth commonwealth:3f462s808 (ark:/50959/3f462s808), IIIF image commonwealth:3f462s81j — the whole sheet, 31 x 39 cm, oriented with north to the right"
    modifications: "cropped to the sheet (the scan's dark edge shadow removed), downscaled to 1600px and re-encoded as JPEG; eight ring markers, leader lines and labels in red were then drawn on top as our annotation — nothing in Foster's engraving was removed, moved or redrawn"

  - file: natives-and-english-rowlandson-title-1682.jpg
    title: "Title page of the 1682 Cambridge edition of Mary Rowlandson's The Soveraignty & Goodness of God — \"The second Addition Corrected and amended\", the earliest surviving edition"
    credit: "Printed by Samuel Green, Cambridge, Massachusetts, 1682 (Evans 332; ESTC W15640) — Boston Public Library, Rare Books Department, Thomas Prince Library copy H.15.8-9; scan via Internet Archive"
    source_url: "https://archive.org/details/soveraigntygoodn00rowl"
    license: "public domain (printed 1682; the Boston Public Library scan is a mechanical reproduction of a public-domain original, recorded by the Internet Archive as NOT_IN_COPYRIGHT)"
    retrieved: "2026-07-31"
    located: "leaf 6 of the 120-image scan (IIIF canvas $5) — the title page, set within a mourning border, carrying an early ownership inscription at the head of the page and the imprint \"CAMBRIDGE, Printed by Samuel Green, 1682\"; the first Boston printing of 1682 survives only as eight leaves reused as lining paper, so this is the earliest edition extant whole"
    modifications: "cropped to the leaf's mourning border (scanner background and the adjacent binding removed), downscaled from 1697px to 1100px and re-encoded as JPEG at quality 84; no other alteration"

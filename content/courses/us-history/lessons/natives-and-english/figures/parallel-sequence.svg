<svg viewBox="0 0 640 250" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrP" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- New England row -->
  <text x="16" y="30" font-size="13" font-weight="bold" fill="currentColor">New England</text>
  <line x1="16" y1="66" x2="620" y2="66" stroke="currentColor" opacity="0.4" marker-end="url(#arrP)"/>

  <circle cx="60" cy="66" r="5" fill="#4c8dd6"/>
  <text x="30" y="50" font-size="11" fill="#4c8dd6">1621 alliance</text>
  <text x="30" y="86" font-size="10" fill="currentColor" opacity="0.55">trade + treaty</text>

  <circle cx="230" cy="66" r="5" fill="#e2903a"/>
  <text x="188" y="50" font-size="11" fill="#e2903a">1636&#8211;38 Pequot War</text>
  <text x="188" y="86" font-size="10" fill="currentColor" opacity="0.55">Mystic; name outlawed</text>

  <circle cx="410" cy="66" r="5" fill="#e2903a"/>
  <text x="352" y="50" font-size="11" fill="#e2903a">1675&#8211;76 King Philip's War</text>
  <text x="352" y="86" font-size="10" fill="currentColor" opacity="0.55">60&#8211;80% Native decline</text>

  <circle cx="560" cy="66" r="5" fill="currentColor"/>
  <text x="516" y="50" font-size="11" fill="currentColor">after 1676</text>
  <text x="516" y="86" font-size="10" fill="currentColor" opacity="0.55">no polity can contest</text>
  <text x="516" y="99" font-size="10" fill="currentColor" opacity="0.55">the region</text>

  <!-- Virginia row -->
  <text x="16" y="142" font-size="13" font-weight="bold" fill="currentColor">Virginia</text>
  <line x1="16" y1="178" x2="620" y2="178" stroke="currentColor" opacity="0.4" marker-end="url(#arrP)"/>

  <circle cx="60" cy="178" r="5" fill="#4c8dd6"/>
  <text x="30" y="162" font-size="11" fill="#4c8dd6">1614 peace</text>
  <text x="30" y="198" font-size="10" fill="currentColor" opacity="0.55">trade + marriage</text>

  <circle cx="200" cy="178" r="5" fill="#e2903a"/>
  <text x="164" y="162" font-size="11" fill="#e2903a">1622 attack</text>
  <text x="164" y="198" font-size="10" fill="currentColor" opacity="0.55">347 dead, 1/3 of colony</text>

  <circle cx="340" cy="178" r="5" fill="#e2903a"/>
  <text x="306" y="162" font-size="11" fill="#e2903a">1644 attack</text>
  <text x="306" y="198" font-size="10" fill="currentColor" opacity="0.55">&#8776;400&#8211;500 dead</text>

  <circle cx="460" cy="178" r="5" fill="currentColor"/>
  <text x="424" y="162" font-size="11" fill="currentColor">1646 treaty</text>
  <text x="424" y="198" font-size="10" fill="currentColor" opacity="0.55">tributary status,</text>
  <text x="424" y="211" font-size="10" fill="currentColor" opacity="0.55">fixed boundary</text>

  <circle cx="575" cy="178" r="5" fill="#e2903a"/>
  <text x="540" y="162" font-size="11" fill="#e2903a">1675&#8211;76</text>
  <text x="540" y="198" font-size="10" fill="currentColor" opacity="0.55">frontier war feeds</text>
  <text x="540" y="211" font-size="10" fill="currentColor" opacity="0.55">Bacon's Rebellion</text>

  <text x="16" y="238" font-size="10.5" fill="currentColor" opacity="0.7">blue = negotiated equilibrium &#160;&#183;&#160; amber = war</text>
</svg>

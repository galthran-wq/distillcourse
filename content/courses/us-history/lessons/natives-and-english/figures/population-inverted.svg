<svg viewBox="0 0 600 250" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <linearGradient id="pi-fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e2903a" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#e2903a" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- vertical scale guides -->
  <g stroke="currentColor" stroke-dasharray="3 3" opacity="0.25">
    <line x1="170" y1="30" x2="170" y2="200"/>
    <line x1="305" y1="30" x2="305" y2="200"/>
    <line x1="440" y1="30" x2="440" y2="200"/>
    <line x1="575" y1="30" x2="575" y2="200"/>
  </g>
  <g fill="currentColor" font-size="11" opacity="0.55" text-anchor="middle">
    <text x="170" y="216">0</text>
    <text x="305" y="216">20,000</text>
    <text x="440" y="216">40,000</text>
    <text x="575" y="216">60,000</text>
  </g>

  <!-- 1621 group -->
  <text x="10" y="56" fill="currentColor" font-size="14" font-weight="600">1621</text>
  <text x="10" y="71" fill="currentColor" font-size="11" opacity="0.55">the treaty</text>

  <rect x="170" y="40" width="3" height="14" fill="#4c8dd6"/>
  <text x="180" y="52" fill="#4c8dd6" font-size="12">English: about 50 colonists at Plymouth</text>

  <rect x="170" y="68" width="280" height="14" fill="url(#pi-fade)"/>
  <text x="180" y="98" fill="#e2903a" font-size="12">Wampanoag confederation and neighbors:</text>
  <text x="180" y="112" fill="currentColor" font-size="11" opacity="0.55">populous, uncounted; no census survives</text>

  <!-- 1675 group -->
  <text x="10" y="152" fill="currentColor" font-size="14" font-weight="600">1675</text>
  <text x="10" y="167" fill="currentColor" font-size="11" opacity="0.55">the war</text>

  <rect x="170" y="136" width="337" height="14" fill="#4c8dd6"/>
  <rect x="507" y="136" width="68" height="14" fill="#4c8dd6" opacity="0.4"/>
  <text x="178" y="147" fill="#ffffff" font-size="12">English: 50,000&#8211;60,000</text>

  <rect x="170" y="166" width="135" height="14" fill="#e2903a"/>
  <text x="592" y="177" text-anchor="end" fill="#e2903a" font-size="12">Native, southern New England: about 20,000</text>

  <text x="10" y="240" fill="currentColor" font-size="11" opacity="0.55">English totals from town and militia records; Native totals are reconstructions.</text>
</svg>

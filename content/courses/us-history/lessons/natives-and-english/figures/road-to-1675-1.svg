<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- timeline rail -->
  <line x1="68" y1="70" x2="68" y2="308" stroke="currentColor" opacity="0.4"/>
  <text x="12" y="84" font-size="13" font-weight="bold" fill="#e2903a">1660s</text>
  <circle cx="68" cy="80" r="6" fill="#e2903a"/>
  <text x="12" y="140" font-size="13" fill="currentColor" opacity="0.5">1662</text>
  <circle cx="68" cy="136" r="6" fill="none" stroke="currentColor" opacity="0.4"/>
  <text x="12" y="196" font-size="13" fill="currentColor" opacity="0.5">1671</text>
  <circle cx="68" cy="192" r="6" fill="none" stroke="currentColor" opacity="0.4"/>
  <text x="12" y="252" font-size="13" fill="currentColor" opacity="0.5">6/1675</text>
  <circle cx="68" cy="248" r="6" fill="none" stroke="currentColor" opacity="0.4"/>
  <text x="12" y="308" font-size="13" fill="currentColor" opacity="0.5">war</text>
  <circle cx="68" cy="304" r="6" fill="none" stroke="currentColor" opacity="0.4"/>

  <!-- accumulating panel -->
  <text x="120" y="44" font-size="13" font-weight="bold" fill="currentColor">What the alliance now means</text>
  <rect x="120" y="56" width="504" height="264" rx="6" fill="none" stroke="currentColor" opacity="0.35"/>

  <text x="134" y="82" font-size="12" font-weight="bold" fill="#e2903a">1660s &#183; livestock and deeds &#160;<tspan fill="#4c8dd6" font-size="10.5">LAND</tspan></text>
  <text x="134" y="100" font-size="11" fill="currentColor" opacity="0.55">free-ranging English cattle and hogs ruin unfenced cornfields; courts treat</text>
  <text x="134" y="114" font-size="11" fill="currentColor" opacity="0.55">unfenced land as unowned; Swansea (1667) laid out beside Pokanoket itself</text>
</svg>

<svg viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#4c8dd6"/>
    </marker>
    <marker id="arrA" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#e2903a"/>
    </marker>
  </defs>

  <!-- European buyers, left column -->
  <rect x="16" y="40" width="180" height="86" rx="6" fill="none" stroke="currentColor"/>
  <text x="28" y="64" font-size="13" font-weight="bold" fill="currentColor">English colonies</text>
  <text x="28" y="84" font-size="11" fill="currentColor" opacity="0.55">Plymouth &#183; Massachusetts Bay</text>
  <text x="28" y="100" font-size="11" fill="currentColor" opacity="0.55">&#183; Connecticut River towns</text>

  <rect x="16" y="240" width="180" height="70" rx="6" fill="none" stroke="currentColor"/>
  <text x="28" y="264" font-size="13" font-weight="bold" fill="currentColor">Dutch New Netherland</text>
  <text x="28" y="284" font-size="11" fill="currentColor" opacity="0.55">Fort Orange &#183; Manhattan</text>

  <!-- Native producers, right column -->
  <rect x="420" y="40" width="204" height="100" rx="6" fill="none" stroke="currentColor"/>
  <text x="432" y="64" font-size="13" font-weight="bold" fill="currentColor">Coastal nations</text>
  <text x="432" y="84" font-size="11.5" fill="currentColor">Wampanoag &#183; Narragansett</text>
  <text x="432" y="100" font-size="11.5" fill="currentColor">&#183; Pequot</text>
  <text x="432" y="122" font-size="11" fill="#e2903a">make wampum; grow corn</text>

  <rect x="420" y="240" width="204" height="86" rx="6" fill="none" stroke="currentColor"/>
  <text x="432" y="264" font-size="13" font-weight="bold" fill="currentColor">Interior nations</text>
  <text x="432" y="284" font-size="11.5" fill="currentColor">Mohegan &#183; Nipmuc &#183; Abenaki</text>
  <text x="432" y="306" font-size="11" fill="#e2903a">trap beaver</text>

  <!-- flows: European goods (blue) out, wampum & furs (amber) back -->
  <line x1="196" y1="66" x2="420" y2="66" stroke="#4c8dd6" stroke-width="2" marker-end="url(#arrB)"/>
  <text x="230" y="58" font-size="11.5" fill="#4c8dd6">cloth, kettles, hoes, later guns</text>

  <line x1="420" y1="104" x2="196" y2="104" stroke="#e2903a" stroke-width="2" marker-end="url(#arrA)"/>
  <text x="252" y="120" font-size="11.5" fill="#e2903a">wampum, corn, furs</text>

  <line x1="196" y1="262" x2="420" y2="262" stroke="#4c8dd6" stroke-width="2" marker-end="url(#arrB)"/>
  <text x="252" y="254" font-size="11.5" fill="#4c8dd6">metal goods, wampum</text>

  <line x1="420" y1="296" x2="196" y2="296" stroke="#e2903a" stroke-width="2" marker-end="url(#arrA)"/>
  <text x="272" y="312" font-size="11.5" fill="#e2903a">beaver pelts</text>

  <!-- wampum passed inland along the coast-interior axis -->
  <line x1="522" y1="140" x2="522" y2="240" stroke="#e2903a" stroke-width="2" marker-end="url(#arrA)" opacity="0.8"/>
  <text x="532" y="186" font-size="11" fill="#e2903a">wampum moves</text>
  <text x="532" y="200" font-size="11" fill="#e2903a">inland for furs</text>

  <!-- rivalries, dashed -->
  <line x1="106" y1="126" x2="106" y2="240" stroke="currentColor" stroke-dasharray="4 4" opacity="0.5"/>
  <text x="114" y="180" font-size="10.5" fill="currentColor" opacity="0.55">rival buyers</text>

  <line x1="448" y1="140" x2="448" y2="240" stroke="currentColor" stroke-dasharray="4 4" opacity="0.5"/>
  <text x="342" y="186" font-size="10.5" fill="currentColor" opacity="0.55">Pequot vs Mohegan</text>

  <line x1="424" y1="46" x2="330" y2="20" stroke="currentColor" stroke-dasharray="4 4" opacity="0.5"/>
  <text x="180" y="18" font-size="10.5" fill="currentColor" opacity="0.55">Wampanoag vs Narragansett</text>

  <!-- legend -->
  <line x1="16" y1="352" x2="44" y2="352" stroke="#4c8dd6" stroke-width="2"/>
  <text x="50" y="356" font-size="10.5" fill="currentColor" opacity="0.7">European goods</text>
  <line x1="160" y1="352" x2="188" y2="352" stroke="#e2903a" stroke-width="2"/>
  <text x="194" y="356" font-size="10.5" fill="currentColor" opacity="0.7">wampum, corn, furs</text>
  <line x1="320" y1="352" x2="348" y2="352" stroke="currentColor" stroke-dasharray="4 4" opacity="0.5"/>
  <text x="354" y="356" font-size="10.5" fill="currentColor" opacity="0.7">standing rivalry</text>
</svg>

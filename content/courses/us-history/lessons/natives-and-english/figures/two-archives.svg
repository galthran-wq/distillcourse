<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- colonial archive column -->
  <rect x="16" y="16" width="298" height="328" rx="6" fill="none" stroke="#4c8dd6" stroke-width="2"/>
  <text x="30" y="40" font-size="13" font-weight="bold" fill="#4c8dd6">The colonial archive</text>
  <text x="30" y="56" font-size="10.5" fill="currentColor" opacity="0.55">Bradford &#183; war narratives &#183; Rowlandson (1682)</text>

  <text x="30" y="84" font-size="11.5" font-weight="bold" fill="currentColor">preserves</text>
  <text x="30" y="102" font-size="11" fill="currentColor">dates, names, counts; treaty texts;</text>
  <text x="30" y="117" font-size="11" fill="currentColor">the wars' course day by day; wartime</text>
  <text x="30" y="132" font-size="11" fill="currentColor">famine and Native political life, seen</text>
  <text x="30" y="147" font-size="11" fill="currentColor">from inside a captive's fourteen weeks</text>

  <text x="30" y="180" font-size="11.5" font-weight="bold" fill="currentColor">argues</text>
  <text x="30" y="198" font-size="11" fill="currentColor">providence: victory as God's judgment,</text>
  <text x="30" y="213" font-size="11" fill="currentColor">captivity as affliction and redemption;</text>
  <text x="30" y="228" font-size="11" fill="currentColor">the enemy as instrument, not polity</text>

  <text x="30" y="261" font-size="11.5" font-weight="bold" fill="currentColor">cannot preserve</text>
  <text x="30" y="279" font-size="11" fill="currentColor">Native counsel and motive except</text>
  <text x="30" y="294" font-size="11" fill="currentColor">through hostile filters; the wars'</text>
  <text x="30" y="309" font-size="11" fill="currentColor">causes as the other side stated them;</text>
  <text x="30" y="324" font-size="11" fill="currentColor">grief on the other side of the palisade</text>

  <!-- Native record column -->
  <rect x="326" y="16" width="298" height="328" rx="6" fill="none" stroke="#e2903a" stroke-width="2"/>
  <text x="340" y="40" font-size="13" font-weight="bold" fill="#e2903a">The Native record</text>
  <text x="340" y="56" font-size="10.5" fill="currentColor" opacity="0.55">oral tradition &#183; objects &#183; petitions &#183; testimony</text>

  <text x="340" y="84" font-size="11.5" font-weight="bold" fill="currentColor">preserves</text>
  <text x="340" y="102" font-size="11" fill="currentColor">place, kinship, and cause as communities</text>
  <text x="340" y="117" font-size="11" fill="currentColor">kept them; wampum belts and burned</text>
  <text x="340" y="132" font-size="11" fill="currentColor">town sites; letters and petitions by</text>
  <text x="340" y="147" font-size="11" fill="currentColor">literate Nipmuc and Wampanoag hands</text>

  <text x="340" y="180" font-size="11.5" font-weight="bold" fill="currentColor">argues</text>
  <text x="340" y="198" font-size="11" fill="currentColor">the covenants were reciprocity, not</text>
  <text x="340" y="213" font-size="11" fill="currentColor">subjection; the war answered broken</text>
  <text x="340" y="228" font-size="11" fill="currentColor">obligations, land loss, and the courts</text>

  <text x="340" y="261" font-size="11.5" font-weight="bold" fill="currentColor">cannot preserve</text>
  <text x="340" y="279" font-size="11" fill="currentColor">what the war destroyed: keepers killed,</text>
  <text x="340" y="294" font-size="11" fill="currentColor">enslaved, or dispersed; writing mostly</text>
  <text x="340" y="309" font-size="11" fill="currentColor">survives inside colonial custody, on</text>
  <text x="340" y="324" font-size="11" fill="currentColor">colonial terms (courts, amnesty pleas)</text>
</svg>

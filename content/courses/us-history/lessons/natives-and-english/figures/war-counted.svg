<svg viewBox="0 0 640 430" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="16" y="24" font-size="14" font-weight="bold" fill="currentColor">King Philip's War, 1675&#8211;76, counted</text>

  <!-- English panel -->
  <rect x="16" y="40" width="298" height="200" rx="6" fill="none" stroke="#4c8dd6" stroke-width="2"/>
  <text x="30" y="64" font-size="13" font-weight="bold" fill="#4c8dd6">English losses</text>
  <text x="30" y="80" font-size="10.5" fill="currentColor" opacity="0.55">of &#8776;55,000 colonists, &#8776;90 towns</text>

  <text x="30" y="106" font-size="12" fill="currentColor">killed</text>
  <rect x="150" y="96" width="30" height="12" fill="#4c8dd6"/>
  <text x="186" y="106" font-size="11.5" fill="currentColor">600&#8211;1,000</text>

  <text x="30" y="138" font-size="12" fill="currentColor">towns attacked</text>
  <rect x="150" y="128" width="82" height="12" fill="#4c8dd6"/>
  <text x="238" y="138" font-size="11.5" fill="currentColor">&gt; half of &#8776;90</text>

  <text x="30" y="170" font-size="12" fill="currentColor">towns destroyed</text>
  <rect x="150" y="160" width="20" height="12" fill="#4c8dd6"/>
  <text x="176" y="170" font-size="11.5" fill="currentColor">&#8776;12</text>

  <text x="30" y="202" font-size="12" fill="currentColor">houses burned</text>
  <rect x="150" y="192" width="44" height="12" fill="#4c8dd6"/>
  <text x="200" y="202" font-size="11.5" fill="currentColor">&#8776;1,200</text>

  <text x="30" y="228" font-size="10.5" fill="currentColor" opacity="0.55">killed &#8776; 5&#8211;9% of the &#8776;11,000 men of military age</text>

  <!-- Native panel -->
  <rect x="326" y="40" width="298" height="200" rx="6" fill="none" stroke="#e2903a" stroke-width="2"/>
  <text x="340" y="64" font-size="13" font-weight="bold" fill="#e2903a">Native losses, southern New England</text>
  <text x="340" y="80" font-size="10.5" fill="currentColor" opacity="0.55">of &#8776;20,000 people in 1675</text>

  <text x="340" y="106" font-size="12" fill="currentColor">killed in the fighting</text>
  <rect x="480" y="96" width="50" height="12" fill="#e2903a"/>
  <text x="536" y="106" font-size="11.5" fill="currentColor">&#8776;2,000</text>

  <text x="340" y="138" font-size="12" fill="currentColor">dead of disease, hunger</text>
  <rect x="480" y="128" width="75" height="12" fill="#e2903a"/>
  <text x="561" y="138" font-size="11.5" fill="currentColor">&#8776;3,000</text>

  <text x="340" y="170" font-size="12" fill="currentColor">enslaved, shipped out</text>
  <rect x="480" y="160" width="25" height="12" fill="#e2903a"/>
  <text x="511" y="170" font-size="11.5" fill="currentColor">&#8776;1,000</text>

  <text x="340" y="202" font-size="12" fill="currentColor">fled the region</text>
  <rect x="480" y="192" width="50" height="12" fill="#e2903a"/>
  <text x="536" y="202" font-size="11.5" fill="currentColor">&#8776;2,000</text>

  <text x="340" y="228" font-size="10.5" fill="currentColor" opacity="0.55">population decline 60&#8211;80%; bars on one shared scale</text>

  <!-- proportional strip -->
  <text x="16" y="284" font-size="13" font-weight="bold" fill="currentColor">Share of the population killed, war by war</text>

  <text x="16" y="312" font-size="11.5" fill="currentColor">King Philip's War</text>
  <text x="16" y="326" font-size="10" fill="currentColor" opacity="0.55">both peoples, 14 months</text>
  <rect x="180" y="304" width="375" height="14" fill="#e2903a"/>
  <text x="561" y="315" font-size="11.5" font-weight="bold" fill="#e2903a">&#8776;7.5%</text>

  <text x="16" y="352" font-size="11.5" fill="currentColor">Civil War, 1861&#8211;65</text>
  <rect x="180" y="344" width="120" height="14" fill="currentColor" opacity="0.6"/>
  <text x="306" y="355" font-size="11.5" fill="currentColor">&#8776;2.4%</text>

  <text x="16" y="392" font-size="11.5" fill="currentColor">Revolution, 1775&#8211;83</text>
  <rect x="180" y="384" width="50" height="14" fill="currentColor" opacity="0.6"/>
  <text x="236" y="395" font-size="11.5" fill="currentColor">&#8776;1%</text>

  <text x="16" y="420" font-size="10.5" fill="currentColor" opacity="0.55">shares computed in the worked example; death tolls per Philbrick (2006) and the American Yawp, ch. 3</text>
</svg>

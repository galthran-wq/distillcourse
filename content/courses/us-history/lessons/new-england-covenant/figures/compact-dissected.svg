<svg viewBox="0 0 640 386" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- ===== three labels on top ===== -->
  <g font-size="12">
    <circle cx="38" cy="30" r="10" fill="none" stroke="#e2903a" stroke-width="1.5"/>
    <text x="38" y="34" font-size="12" font-weight="bold" fill="#e2903a" text-anchor="middle">1</text>
    <text x="56" y="27" font-weight="bold" fill="currentColor">who acts</text>
    <text x="56" y="43" fill="currentColor" opacity="0.55">the signers, each to each</text>

    <circle cx="268" cy="30" r="10" fill="none" stroke="#e2903a" stroke-width="1.5"/>
    <text x="268" y="34" font-size="12" font-weight="bold" fill="#e2903a" text-anchor="middle">2</text>
    <text x="286" y="27" font-weight="bold" fill="currentColor">what is created</text>
    <text x="286" y="43" fill="currentColor" opacity="0.55">a government</text>

    <circle cx="448" cy="30" r="10" fill="none" stroke="#e2903a" stroke-width="1.5"/>
    <text x="448" y="34" font-size="12" font-weight="bold" fill="#e2903a" text-anchor="middle">3</text>
    <text x="466" y="27" font-weight="bold" fill="currentColor">what it may do</text>
    <text x="466" y="43" fill="currentColor" opacity="0.55">laws + obedience</text>
  </g>

  <!-- ===== thin label arrows onto the phrases ===== -->
  <g stroke="currentColor" stroke-width="1" opacity="0.5" fill="none">
    <path d="M 90 50 L 118 116"/>
    <path d="M 296 50 L 262 158"/>
    <path d="M 478 50 L 470 178"/>
  </g>

  <!-- ===== the paragraph ===== -->
  <rect x="24" y="104" width="592" height="196" rx="6" fill="none" stroke="currentColor" opacity="0.7"/>
  <g font-size="13" fill="currentColor">
    <text x="44" y="132">IN the Name of God, Amen. We whose Names are under-written &#8230; Do by</text>
    <text x="44" y="154">these Presents, solemnly and mutually, in the presence of God and one</text>
    <text x="44" y="176">another, <tspan font-weight="bold" fill="#e2903a">Covenant and Combine our selves together</tspan> into a <tspan font-weight="bold" fill="#e2903a">Civil Body</tspan></text>
    <text x="44" y="198"><tspan font-weight="bold" fill="#e2903a">Politick</tspan>, &#8230; and by virtue hereof do <tspan font-weight="bold" fill="#e2903a">enact, constitute, and frame, such</tspan></text>
    <text x="44" y="220"><tspan font-weight="bold" fill="#e2903a">just and equal Laws</tspan>, Ordinances, Acts, Constitutions and Officers &#8230;</text>
    <text x="44" y="242">unto which <tspan font-weight="bold" fill="#e2903a">we promise all due submission and obedience</tspan>.</text>
    <text x="44" y="276" opacity="0.55">&#8230; at Cape Cod, the eleventh of November &#8230; Anno Dom. 1620.</text>
  </g>

  <!-- ===== signature strip ===== -->
  <text x="44" y="330" font-size="12" fill="currentColor"><tspan font-weight="bold">41 names</tspan> subscribed: the free adult men aboard, Separatist and stranger alike</text>
  <text x="44" y="350" font-size="11" fill="currentColor" opacity="0.55">earliest surviving text: Morton&#8217;s New-England&#8217;s Memoriall (1669);</text>
  <text x="44" y="365" font-size="11" fill="currentColor" opacity="0.55">contemporaries said &#8220;the combination&#8221; &#8212; &#8220;Mayflower Compact&#8221; dates from 1793</text>
</svg>

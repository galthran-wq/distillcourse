<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- axes -->
  <line x1="60" y1="300" x2="610" y2="300" stroke="currentColor"/>
  <line x1="60" y1="300" x2="60" y2="40" stroke="currentColor"/>
  <g font-size="11" fill="currentColor">
    <text x="60" y="318" text-anchor="middle">1620</text>
    <text x="195" y="318" text-anchor="middle">1640</text>
    <text x="330" y="318" text-anchor="middle">1660</text>
    <text x="465" y="318" text-anchor="middle">1680</text>
    <text x="600" y="318" text-anchor="middle">1700</text>
    <text x="52" y="304" text-anchor="end">0</text>
    <text x="52" y="174" text-anchor="end">50,000</text>
    <text x="52" y="44" text-anchor="end">100,000</text>
  </g>
  <line x1="60" y1="170" x2="610" y2="170" stroke="currentColor" stroke-dasharray="3 3" opacity="0.3"/>

  <!-- migration band 1630-1642 -->
  <rect x="127.5" y="40" width="81" height="260" fill="#4c8dd6" opacity="0.15"/>
  <text x="132" y="60" font-size="11" fill="#4c8dd6" font-weight="bold">Great Migration</text>
  <text x="132" y="75" font-size="11" fill="#4c8dd6">1630&#8211;42: ~21,000 arrive</text>

  <!-- immigration-shut marker -->
  <line x1="208.5" y1="40" x2="208.5" y2="300" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5"/>
  <text x="216" y="95" font-size="11" fill="currentColor" opacity="0.55">net migration &#8776; 0 after 1642:</text>
  <text x="216" y="110" font-size="11" fill="currentColor" opacity="0.55">all growth from here is births</text>

  <!-- population curve -->
  <path d="M 60 299.7 L 127.5 297.4 L 168 279.2 L 208.5 245.4 L 296 224.6 L 391 190.8 L 485 144 L 600 63.4"
        fill="none" stroke="#e2903a" stroke-width="2.5"/>
  <circle cx="208.5" cy="245.4" r="4" fill="#e2903a"/>
  <circle cx="600" cy="63.4" r="4" fill="#e2903a"/>
  <text x="228" y="252" font-size="12" fill="#e2903a" font-weight="bold">21,000 (1642)</text>
  <text x="596" y="52" font-size="12" fill="#e2903a" font-weight="bold" text-anchor="end">91,000 (1700)</text>

  <!-- doubling annotation -->
  <text x="360" y="255" font-size="12" fill="currentColor">&#215;4.3 in 58 years</text>
  <text x="360" y="271" font-size="12" fill="currentColor">&#8776; doubling every 27 years</text>
</svg>

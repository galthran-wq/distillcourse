images:
  - file: new-england-covenant-morton-memoriall-1669.jpg
    title: "The Plymouth Combination in print — page 15 of Nathaniel Morton, New-Englands Memoriall (Cambridge, Mass., 1669)"
    credit: "Nathaniel Morton, New-Englands Memoriall (Cambridge [Mass.]: printed by S[amuel] G[reen] and M[armaduke] J[ohnson] for John Usher of Boston, 1669) — John Carter Brown Library copy, digitised by the John Carter Brown Library on the Internet Archive"
    source_url: "https://archive.org/details/newenglandsmemor00mort_0"
    license: "public domain (printed 1669; the John Carter Brown Library scan is a mechanical reproduction of a public-domain original and carries no rights restriction)"
    retrieved: "2026-07-31"
    located: "John Carter Brown Library copy, call no. D669 .M819n — printed p. 15 (leaf 33 of the Internet Archive scan): the Compact entire, the printed marginal gloss, and the first 21 subscribers"
    modifications: "cropped to the leaf itself (the photographic backdrop, the binding board and the gutter shadow removed), downscaled to 1400px and re-encoded as JPEG; not upscaled, no other alteration"

  - file: new-england-covenant-bradford-manuscript.jpg
    title: "Facsimile of the first page of William Bradford's manuscript \"Of Plimoth Plantation\""
    credit: "Photographic facsimile plate in Bradford's History \"Of Plimoth Plantation.\" From the Original Manuscript (Boston: Wright & Potter Printing Co., State Printers, 1898) — the edition printed by order of the General Court after the manuscript's return to Massachusetts; Library of Congress copy, scan via Internet Archive"
    source_url: "https://archive.org/details/bradfordshistory00brawi"
    license: "public domain (published 1898; Internet Archive records the scan as NOT_IN_COPYRIGHT)"
    retrieved: "2026-07-31"
    located: "unnumbered facsimile plate facing p. 1 (scan leaf 100); described in the Introduction, p. viii, as \"the first page of which is produced in facsimile in this volume, slightly reduced\""
    modifications: "cropped to the photographic plate and to the head of the page, ending after the line \"the course of ye Gospell; but that it speedily overspred, with\"; downscaled to 1200px and re-encoded as JPEG; no other alteration"

  - file: new-england-covenant-mourts-relation-1622.jpg
    title: "Title page of the 1622 London first edition of Mourt's Relation — \"A Relation or Iournall of the beginning and proceedings of the English Plantation setled at Plimoth in New England\""
    credit: "Printed by John Dawson for Iohn Bellamie, London, 1622 — Boston Public Library, Rare Books Department (F68.M928); scan via Internet Archive"
    source_url: "https://archive.org/details/relationoriourna00daws"
    license: "public domain (printed 1622; the Boston Public Library scan is a mechanical reproduction of a public-domain original)"
    retrieved: "2026-07-31"
    located: "leaf n8 of the 102-leaf scan — the title page of the first edition, second issue (Church 393); the volume collects the Bradford/Winslow journal that carries Winslow's December 11, 1621 letter"
    modifications: "single leaf extracted from the volume scan, downscaled from 3285px to 2000px and re-encoded as JPEG at quality 76; no cropping, no other alteration"

  - file: new-england-covenant-bay-psalm-book-1640.jpg
    title: "Title page of the Bay Psalm Book — The Whole Booke of Psalmes Faithfully Translated into English Metre (Cambridge, Mass., 1640)"
    credit: "Printed by Stephen Daye at Cambridge, Massachusetts Bay Colony, 1640 — Beinecke Rare Book and Manuscript Library, Yale University, General Collection; scan via Wikimedia Commons"
    source_url: "https://commons.wikimedia.org/wiki/File:Bay_Psalm_Book_title_page.jpg"
    license: "public domain (printed 1640; the photographic reproduction of a two-dimensional public-domain page carries no new copyright — Commons marks the file public domain)"
    retrieved: "2026-07-31"
    located: "Beinecke Library copy — the title leaf, genuinely typeset with its printer's-flower border (several surviving copies, the Library of Congress's among them, carry pen-and-ink facsimile title leaves); the imprint line reads only 'Imprinted 1640', naming neither printer nor place"
    modifications: "re-encoded as JPEG with metadata stripped; not cropped, not upscaled, no other alteration"

  - file: albionseed-john-winthrop-portrait.jpg
    title: "Portrait of John Winthrop (1587/8–1649), governor of the Massachusetts Bay Colony"
    credit: "Unknown painter, attributed to a follower of Anthony van Dyck, 17th century (c. 1650), oil on canvas — American Antiquarian Society, Worcester, Massachusetts; held in the Winthrop family until the 19th century; scan via Wikimedia Commons"
    source_url: "https://commons.wikimedia.org/wiki/File:John_Winthrop_17th_cent._American_Antiquarian_Society_portrait.jpg"
    license: "public domain (PD-Art / Public Domain Mark 1.0; PD-US — 17th-century painting, and the photographic reproduction of a two-dimensional public-domain work carries no new copyright)"
    retrieved: "2026-07-30"
    located: "American Antiquarian Society portrait collection, via Wikimedia Commons — three-quarter-length, in black doublet and lace-edged ruff, gloves in the left hand"
    modifications: "cropped to a head-and-shoulders bust (the sitter's hands, the gloves and the lower canvas fall outside the crop), re-encoded as JPEG at quality 88; the working copy had already been downscaled from the 1645×2000 source to 1600×1945; not upscaled, no other alteration"

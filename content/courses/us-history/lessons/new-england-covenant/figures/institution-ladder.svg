<svg viewBox="0 0 640 470" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- ===== grayed future rungs (top) ===== -->
  <g opacity="0.4">
    <rect x="60" y="20" width="400" height="34" rx="6" fill="none" stroke="currentColor"/>
    <text x="76" y="42" font-size="13" fill="currentColor"><tspan font-weight="bold">Constitution, 1787</tspan><tspan opacity="0.7"> &#8212; the founding module&#8217;s subject</tspan></text>
    <rect x="60" y="68" width="400" height="34" rx="6" fill="none" stroke="currentColor"/>
    <text x="76" y="90" font-size="13" fill="currentColor"><tspan font-weight="bold">state constitutions, 1776</tspan><tspan opacity="0.7"> &#8212; compacts become constitutions</tspan></text>
  </g>
  <line x1="260" y1="116" x2="260" y2="104" stroke="currentColor" opacity="0.4"/>
  <path d="M 255 110 L 260 104 L 265 110" fill="none" stroke="currentColor" opacity="0.4"/>

  <!-- ===== rung 4: colony ===== -->
  <rect x="60" y="120" width="400" height="72" rx="6" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <text x="76" y="142" font-size="13" font-weight="bold" fill="#e2903a">colony: assembly of the towns</text>
  <text x="76" y="160" font-size="12" fill="currentColor">General Court of deputies, 1634 &#183; Body of Liberties, 1641</text>
  <text x="76" y="178" font-size="12" fill="currentColor">Fundamental Orders, 1639: three towns covenant together</text>

  <line x1="260" y1="216" x2="260" y2="196" stroke="currentColor"/>
  <path d="M 255 202 L 260 196 L 265 202" fill="none" stroke="currentColor"/>

  <!-- ===== rung 3: town ===== -->
  <rect x="60" y="220" width="400" height="72" rx="6" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <text x="76" y="242" font-size="13" font-weight="bold" fill="#e2903a">town: covenant + meeting</text>
  <text x="76" y="260" font-size="12" fill="currentColor">Dedham Covenant, 1636 &#183; town land, town taxes, town school</text>
  <text x="76" y="278" font-size="12" fill="currentColor">Pilgrim Code, 1636, cites &#8220;the combination made at Cape Cod&#8221;</text>

  <line x1="260" y1="316" x2="260" y2="296" stroke="currentColor"/>
  <path d="M 255 302 L 260 296 L 265 302" fill="none" stroke="currentColor"/>

  <!-- ===== rung 2: congregation ===== -->
  <rect x="60" y="320" width="400" height="56" rx="6" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <text x="76" y="342" font-size="13" font-weight="bold" fill="#e2903a">congregation: church by mutual covenant</text>
  <text x="76" y="362" font-size="12" fill="currentColor">Salem, 1629 (one sentence) &#183; Charlestown-Boston, 1630</text>

  <line x1="260" y1="400" x2="260" y2="380" stroke="currentColor"/>
  <path d="M 255 386 L 260 380 L 265 386" fill="none" stroke="currentColor"/>

  <!-- ===== rung 1: compact ===== -->
  <rect x="60" y="404" width="400" height="56" rx="6" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <text x="76" y="426" font-size="13" font-weight="bold" fill="#e2903a">Plymouth Combination (Mayflower Compact), 1620</text>
  <text x="76" y="446" font-size="12" fill="currentColor">a &#8220;civil body politick&#8221; by consent &#183; &#8220;just and equal laws&#8221;</text>

  <!-- ===== side note ===== -->
  <text x="480" y="250" font-size="12" fill="currentColor" opacity="0.55">each rung:</text>
  <text x="480" y="266" font-size="12" fill="currentColor" opacity="0.55">the covenant</text>
  <text x="480" y="282" font-size="12" fill="currentColor" opacity="0.55">form, one</text>
  <text x="480" y="298" font-size="12" fill="currentColor" opacity="0.55">scale up</text>
  <path d="M 490 320 L 490 230" stroke="currentColor" opacity="0" fill="none"/>
</svg>

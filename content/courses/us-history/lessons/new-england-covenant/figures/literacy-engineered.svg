<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- ===== left: the statutes ===== -->
  <rect x="16" y="24" width="288" height="110" rx="6" fill="none" stroke="currentColor" opacity="0.7"/>
  <rect x="28" y="36" width="52" height="22" rx="4" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <text x="54" y="52" font-size="12" font-weight="bold" fill="#e2903a" text-anchor="middle">1642</text>
  <text x="92" y="52" font-size="12" font-weight="bold" fill="currentColor">households must teach</text>
  <text x="28" y="80" font-size="11" fill="currentColor">children to &#8220;read &amp; understand the principles</text>
  <text x="28" y="95" font-size="11" fill="currentColor">of religion and the capital laws&#8221;</text>
  <text x="28" y="118" font-size="11" fill="currentColor" opacity="0.55">enforced by the selectmen, on pain of fines</text>

  <rect x="16" y="150" width="288" height="140" rx="6" fill="none" stroke="currentColor" opacity="0.7"/>
  <rect x="28" y="162" width="52" height="22" rx="4" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <text x="54" y="178" font-size="12" font-weight="bold" fill="#e2903a" text-anchor="middle">1647</text>
  <text x="92" y="178" font-size="12" font-weight="bold" fill="currentColor">towns must school</text>
  <text x="28" y="206" font-size="11" fill="currentColor">50 households &#8594; a teacher of reading</text>
  <text x="28" y="221" font-size="11" fill="currentColor">and writing</text>
  <text x="28" y="243" font-size="11" fill="currentColor">100 families &#8594; a grammar school</text>
  <text x="28" y="268" font-size="11" fill="currentColor" opacity="0.55">penalty: &#8220;pay 5 pounds to the next school</text>
  <text x="28" y="283" font-size="11" fill="currentColor" opacity="0.55">till they shall perform this order&#8221;</text>

  <!-- ===== right: the signature series ===== -->
  <text x="336" y="40" font-size="12" font-weight="bold" fill="currentColor">New England signature literacy</text>
  <line x1="348" y1="260" x2="620" y2="260" stroke="currentColor"/>
  <line x1="348" y1="260" x2="348" y2="56" stroke="currentColor"/>
  <g font-size="10" fill="currentColor">
    <text x="340" y="264" text-anchor="end">0%</text>
    <text x="340" y="164" text-anchor="end">50%</text>
    <text x="340" y="64" text-anchor="end">100%</text>
    <text x="367" y="276" text-anchor="middle">1650&#8211;70</text>
    <text x="553" y="276" text-anchor="middle">1758&#8211;62</text>
    <text x="609" y="290" text-anchor="middle">1787&#8211;95</text>
  </g>
  <line x1="348" y1="160" x2="620" y2="160" stroke="currentColor" stroke-dasharray="3 3" opacity="0.3"/>

  <!-- male series: 60 -> 85 -> 90 -->
  <path d="M 367 140 L 553 90 L 609 80" fill="none" stroke="#e2903a" stroke-width="2.5"/>
  <circle cx="367" cy="140" r="4" fill="#e2903a"/>
  <circle cx="553" cy="90" r="4" fill="#e2903a"/>
  <circle cx="609" cy="80" r="4" fill="#e2903a"/>
  <text x="380" y="158" font-size="11" fill="#e2903a" font-weight="bold">men: 60%</text>
  <text x="530" y="82" font-size="11" fill="#e2903a" font-weight="bold" text-anchor="end">85%</text>
  <text x="609" y="70" font-size="11" fill="#e2903a" font-weight="bold" text-anchor="middle">90%</text>

  <!-- female series: 31 -> 48 -->
  <path d="M 367 198 L 609 164" fill="none" stroke="#4c8dd6" stroke-width="2" stroke-dasharray="5 3"/>
  <circle cx="367" cy="198" r="3.5" fill="#4c8dd6"/>
  <circle cx="609" cy="164" r="3.5" fill="#4c8dd6"/>
  <text x="380" y="212" font-size="11" fill="#4c8dd6" font-weight="bold">women: 31%</text>
  <text x="600" y="152" font-size="11" fill="#4c8dd6" font-weight="bold" text-anchor="end">48%</text>

  <text x="348" y="312" font-size="10" fill="currentColor" opacity="0.55">method: signatures vs. marks on wills (Lockridge, 1974);</text>
  <text x="348" y="326" font-size="10" fill="currentColor" opacity="0.55">undercounts readers who could not write &#8212; women most</text>
</svg>

<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="30" y="28" font-size="13" font-weight="bold" fill="currentColor">Massachusetts</text>
  <text x="430" y="28" font-size="13" font-weight="bold" fill="currentColor" opacity="0.55">Virginia, for contrast</text>

  <!-- timeline spine -->
  <line x1="86" y1="44" x2="86" y2="320" stroke="currentColor" opacity="0.5"/>

  <g font-size="12" fill="currentColor">
    <circle cx="86" cy="60" r="4" fill="#e2903a"/>
    <text x="76" y="64" font-weight="bold" text-anchor="end" fill="#e2903a">1636</text>
    <text x="100" y="58"><tspan font-weight="bold">Harvard College</tspan> voted by the</text>
    <text x="100" y="74">General Court, six years after landing</text>

    <circle cx="86" cy="116" r="4" fill="#e2903a"/>
    <text x="76" y="120" font-weight="bold" text-anchor="end" fill="#e2903a">1638</text>
    <text x="100" y="114"><tspan font-weight="bold">printing press</tspan> at Cambridge,</text>
    <text x="100" y="130">the first in English America</text>

    <circle cx="86" cy="172" r="4" fill="#e2903a"/>
    <text x="76" y="176" font-weight="bold" text-anchor="end" fill="#e2903a">1640</text>
    <text x="100" y="170"><tspan font-weight="bold">Bay Psalm Book</tspan>, first book</text>
    <text x="100" y="186">printed in the English colonies</text>

    <circle cx="86" cy="228" r="4" fill="#e2903a"/>
    <text x="76" y="232" font-weight="bold" text-anchor="end" fill="#e2903a">1690</text>
    <text x="100" y="226"><tspan font-weight="bold">Publick Occurrences</tspan>, first colonial</text>
    <text x="100" y="242">newspaper; suppressed after one issue</text>

    <circle cx="86" cy="284" r="4" fill="#e2903a"/>
    <text x="76" y="288" font-weight="bold" text-anchor="end" fill="#e2903a">1704</text>
    <text x="100" y="282"><tspan font-weight="bold">Boston News-Letter</tspan>,</text>
    <text x="100" y="298">the first continuous newspaper</text>
  </g>

  <!-- Virginia contrast -->
  <g font-size="11" fill="currentColor" opacity="0.55">
    <text x="430" y="58">Gov. Berkeley, 1671: &#8220;I thank God,</text>
    <text x="430" y="73">there are no free schools</text>
    <text x="430" y="88">nor printing&#8230;&#8221;</text>
  </g>
  <g font-size="12" fill="currentColor" opacity="0.55">
    <line x1="470" y1="212" x2="470" y2="290" stroke="currentColor" opacity="0.5"/>
    <circle cx="470" cy="228" r="4" fill="currentColor"/>
    <text x="460" y="232" font-weight="bold" text-anchor="end">1730</text>
    <text x="484" y="232">first licensed press</text>
    <circle cx="470" cy="284" r="4" fill="currentColor"/>
    <text x="460" y="288" font-weight="bold" text-anchor="end">1736</text>
    <text x="484" y="288">first newspaper</text>
  </g>

  <text x="30" y="342" font-size="11" fill="currentColor" opacity="0.55">every &#8220;first in English America&#8221; before 1710 sits in one colony&#8217;s river valley</text>
</svg>

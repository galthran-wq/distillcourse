<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="30" y="34" font-size="14" font-weight="bold" fill="currentColor">1 &#183; the grant</text>
  <text x="30" y="54" font-size="12" fill="currentColor" opacity="0.55">the General Court grants a township to a covenanted group of families</text>

  <!-- township tract -->
  <rect x="30" y="70" width="380" height="290" rx="8" fill="none" stroke="currentColor" stroke-dasharray="4 3" opacity="0.6"/>
  <text x="220" y="220" font-size="12" fill="currentColor" opacity="0.45" text-anchor="middle">the granted tract</text>

  <!-- covenant document -->
  <rect x="46" y="86" width="26" height="34" rx="2" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <line x1="51" y1="96" x2="67" y2="96" stroke="#e2903a" stroke-width="1"/>
  <line x1="51" y1="103" x2="67" y2="103" stroke="#e2903a" stroke-width="1"/>
  <line x1="51" y1="110" x2="62" y2="110" stroke="#e2903a" stroke-width="1"/>
  <text x="82" y="106" font-size="12" fill="#e2903a" font-weight="bold">the town covenant, signed</text>

  <!-- step list -->
  <g font-size="12">
    <text x="440" y="120" font-weight="bold" fill="#e2903a">&#9679; grant to covenanted group</text>
    <text x="440" y="150" fill="currentColor" opacity="0.35">&#9675; meetinghouse, lots, common</text>
    <text x="440" y="180" fill="currentColor" opacity="0.35">&#9675; meeting: elect, divide, tax</text>
    <text x="440" y="210" fill="currentColor" opacity="0.35">&#9675; school required (1647)</text>
  </g>
  <text x="440" y="330" font-size="11" fill="currentColor" opacity="0.55">land goes to the group, not to</text>
  <text x="440" y="345" font-size="11" fill="currentColor" opacity="0.55">individuals; the covenant is the</text>
  <text x="440" y="360" font-size="11" fill="currentColor" opacity="0.55">title-holder&#8217;s constitution</text>
</svg>

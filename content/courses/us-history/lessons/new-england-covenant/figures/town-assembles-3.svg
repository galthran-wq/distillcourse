<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="30" y="34" font-size="14" font-weight="bold" fill="currentColor">3 &#183; the meeting</text>
  <text x="30" y="54" font-size="12" fill="currentColor" opacity="0.55">householders assemble: elect selectmen, divide land, tax themselves for the minister</text>

  <!-- township tract -->
  <rect x="30" y="70" width="380" height="290" rx="8" fill="none" stroke="currentColor" stroke-dasharray="4 3" opacity="0.6"/>

  <!-- covenant document -->
  <rect x="46" y="86" width="26" height="34" rx="2" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <line x1="51" y1="96" x2="67" y2="96" stroke="#e2903a" stroke-width="1"/>
  <line x1="51" y1="103" x2="67" y2="103" stroke="#e2903a" stroke-width="1"/>
  <line x1="51" y1="110" x2="62" y2="110" stroke="#e2903a" stroke-width="1"/>

  <!-- common field -->
  <rect x="240" y="100" width="140" height="70" fill="none" stroke="currentColor" opacity="0.6"/>
  <text x="310" y="140" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">common field</text>

  <!-- street and home lots -->
  <line x1="60" y1="270" x2="390" y2="270" stroke="currentColor" opacity="0.6"/>
  <g fill="currentColor" opacity="0.8">
    <circle cx="90" cy="252" r="4"/><circle cx="140" cy="252" r="4"/><circle cx="190" cy="252" r="4"/>
    <circle cx="250" cy="252" r="4"/><circle cx="300" cy="252" r="4"/><circle cx="350" cy="252" r="4"/>
    <circle cx="115" cy="290" r="4"/><circle cx="165" cy="290" r="4"/><circle cx="275" cy="290" r="4"/><circle cx="325" cy="290" r="4"/>
  </g>

  <!-- meetinghouse -->
  <rect x="206" y="200" width="20" height="18" fill="none" stroke="#e2903a" stroke-width="1.8"/>
  <path d="M 204 200 L 216 188 L 228 200" fill="none" stroke="#e2903a" stroke-width="1.8"/>

  <!-- householders walk to the meeting -->
  <g stroke="#e2903a" stroke-width="1" fill="none" opacity="0.7">
    <path d="M 92 248 L 206 214"/>
    <path d="M 190 248 L 210 220"/>
    <path d="M 300 248 L 226 216"/>
    <path d="M 325 286 L 228 218"/>
  </g>
  <text x="80" y="180" font-size="12" font-weight="bold" fill="#e2903a">town meeting:</text>
  <text x="80" y="196" font-size="11" fill="currentColor">elect selectmen &#183; divide land &#183; rate for the minister</text>

  <!-- step list -->
  <g font-size="12">
    <text x="440" y="120" fill="currentColor">&#9679; grant to covenanted group</text>
    <text x="440" y="150" fill="currentColor">&#9679; meetinghouse, lots, common</text>
    <text x="440" y="180" font-weight="bold" fill="#e2903a">&#9679; meeting: elect, divide, tax</text>
    <text x="440" y="210" fill="currentColor" opacity="0.35">&#9675; school required (1647)</text>
  </g>
  <text x="440" y="330" font-size="11" fill="currentColor" opacity="0.55">the voters are the taxed; the</text>
  <text x="440" y="345" font-size="11" fill="currentColor" opacity="0.55">taxed are the governed; all three</text>
  <text x="440" y="360" font-size="11" fill="currentColor" opacity="0.55">meet in one room, several times a year</text>
</svg>

<svg viewBox="0 0 640 428" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- ===== column heads ===== -->
  <text x="170" y="26" font-size="13" font-weight="bold" fill="#4c8dd6" text-anchor="middle">Massasoit&#8217;s obligations</text>
  <text x="470" y="26" font-size="13" font-weight="bold" fill="#e2903a" text-anchor="middle">Plymouth&#8217;s obligations</text>
  <line x1="320" y1="36" x2="320" y2="300" stroke="currentColor" stroke-dasharray="3 3" opacity="0.35"/>

  <!-- ===== clause rows (as Bradford records them) ===== -->
  <g font-size="12">
    <!-- 1 violence -->
    <text x="30" y="58" font-weight="bold" fill="currentColor">1</text>
    <text x="48" y="58" fill="currentColor">none of his shall injure or hurt any of theirs</text>
    <text x="470" y="58" fill="currentColor" opacity="0.4" text-anchor="middle">&#8212; (one-sided as recorded)</text>

    <!-- 2 justice -->
    <text x="30" y="94" font-weight="bold" fill="currentColor">2</text>
    <text x="48" y="94" fill="currentColor">offenders sent to Plymouth for punishment</text>
    <text x="470" y="94" fill="currentColor" opacity="0.4" text-anchor="middle">&#8212; (one-sided as recorded)</text>

    <!-- 3 property: mutual -->
    <rect x="22" y="112" width="596" height="38" rx="5" fill="none" stroke="#5aa46a" opacity="0.9"/>
    <text x="30" y="136" font-weight="bold" fill="currentColor">3</text>
    <text x="48" y="136" fill="currentColor">anything taken shall be restored</text>
    <text x="356" y="136" fill="currentColor">&#8220;and they should doe the like to his&#8221;</text>
    <path d="M 300 131 L 344 131" stroke="#5aa46a" stroke-width="1.5" fill="none"/>
    <path d="M 308 126 L 300 131 L 308 136 M 336 126 L 344 131 L 336 136" stroke="#5aa46a" stroke-width="1.5" fill="none"/>

    <!-- 4 defense: mutual -->
    <rect x="22" y="158" width="596" height="38" rx="5" fill="none" stroke="#5aa46a" opacity="0.9"/>
    <text x="30" y="182" font-weight="bold" fill="currentColor">4</text>
    <text x="48" y="182" fill="currentColor">he shall aid them if any war on them</text>
    <text x="356" y="182" fill="currentColor">they shall aid him if any war unjustly on him</text>
    <path d="M 300 177 L 344 177" stroke="#5aa46a" stroke-width="1.5" fill="none"/>
    <path d="M 308 172 L 300 177 L 308 182 M 336 172 L 344 177 L 336 182" stroke="#5aa46a" stroke-width="1.5" fill="none"/>

    <!-- 5 diplomacy -->
    <text x="30" y="222" font-weight="bold" fill="currentColor">5</text>
    <text x="48" y="222" fill="currentColor">notify neighbor confederates, that they &#8220;might be likewise comprised in the conditions of peace&#8221;</text>

    <!-- 6 arms -->
    <text x="30" y="258" font-weight="bold" fill="currentColor">6</text>
    <text x="48" y="258" fill="currentColor">visiting men leave bows and arrows behind</text>
    <text x="356" y="258" fill="currentColor" opacity="0.55">&#8220;as we should do our pieces&#8221; &#8212;</text>
    <text x="356" y="274" fill="currentColor" opacity="0.55">mutual in Mourt&#8217;s (1622); dropped by Bradford</text>
  </g>

  <text x="30" y="300" font-size="11" fill="currentColor" opacity="0.55">green frames: clauses explicitly mutual in Bradford&#8217;s record</text>

  <!-- ===== duration bar ===== -->
  <line x1="60" y1="352" x2="600" y2="352" stroke="currentColor" stroke-width="1"/>
  <rect x="60" y="345" width="540" height="14" rx="3" fill="#e2903a" opacity="0.25"/>
  <g font-size="12" fill="currentColor">
    <line x1="60" y1="340" x2="60" y2="364" stroke="currentColor"/>
    <text x="60" y="382" text-anchor="middle" font-weight="bold">1621</text>
    <text x="60" y="398" text-anchor="middle" font-size="11" opacity="0.55">signed</text>
    <line x1="460" y1="340" x2="460" y2="364" stroke="currentColor"/>
    <text x="460" y="382" text-anchor="middle">c. 1661</text>
    <text x="460" y="398" text-anchor="middle" font-size="11" opacity="0.55">Massasoit dies; peace holds</text>
    <line x1="600" y1="340" x2="600" y2="364" stroke="currentColor"/>
    <text x="600" y="382" text-anchor="middle" font-weight="bold">1675</text>
    <text x="600" y="398" text-anchor="middle" font-size="11" opacity="0.55">war</text>
    <text x="260" y="338" font-size="12" font-weight="bold" fill="#e2903a">the peace: 54 years</text>
  </g>
</svg>

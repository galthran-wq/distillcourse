<svg viewBox="0 0 640 350" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- stage 1: state lists -->
  <text x="120" y="24" font-size="12.5" font-weight="bold" fill="currentColor" text-anchor="middle">the states' recommended</text>
  <text x="120" y="40" font-size="12.5" font-weight="bold" fill="currentColor" text-anchor="middle">amendments, 1788</text>
  <text x="120" y="56" font-size="10.5" fill="currentColor" opacity="0.6" text-anchor="middle">Mass. 9 · Va. 40 · N.Y. ~50 · N.C.'s list</text>

  <rect x="24" y="68" width="192" height="86" rx="6" fill="#e2903a" fill-opacity="0.15" stroke="#e2903a" stroke-width="1.8"/>
  <text x="120" y="88" font-size="12" font-weight="bold" fill="#e2903a" text-anchor="middle">rights provisions</text>
  <text x="120" y="106" font-size="10.5" fill="currentColor" text-anchor="middle">press · religion · jury · petition</text>
  <text x="120" y="121" font-size="10.5" fill="currentColor" text-anchor="middle">arms · due process · searches</text>
  <text x="120" y="141" font-size="10.5" fill="currentColor" opacity="0.65" text-anchor="middle">cheap: cut no federal power</text>

  <rect x="24" y="170" width="192" height="100" rx="6" fill="#4c8dd6" fill-opacity="0.15" stroke="#4c8dd6" stroke-width="1.8"/>
  <text x="120" y="190" font-size="12" font-weight="bold" fill="#4c8dd6" text-anchor="middle">structural limits</text>
  <text x="120" y="208" font-size="10.5" fill="currentColor" text-anchor="middle">direct taxes restricted · standing</text>
  <text x="120" y="223" font-size="10.5" fill="currentColor" text-anchor="middle">army curbed · "expressly" delegated</text>
  <text x="120" y="238" font-size="10.5" fill="currentColor" text-anchor="middle">powers · two-thirds trade laws</text>
  <text x="120" y="258" font-size="10.5" fill="currentColor" opacity="0.65" text-anchor="middle">the Anti-Federalist program</text>

  <!-- stage 2: Madison's selection -->
  <rect x="278" y="120" width="150" height="96" rx="6" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="353" y="144" font-size="12" font-weight="bold" fill="currentColor" text-anchor="middle">Madison's selection</text>
  <text x="353" y="160" font-size="10.5" fill="currentColor" opacity="0.7" text-anchor="middle">House, June 8, 1789</text>
  <text x="353" y="182" font-size="10.5" fill="currentColor" text-anchor="middle">rights only; every</text>
  <text x="353" y="197" font-size="10.5" fill="currentColor" text-anchor="middle">structural demand dropped</text>

  <!-- rights arrow passes -->
  <line x1="216" y1="111" x2="300" y2="140" stroke="#e2903a" stroke-width="2.2"/>
  <path d="M 300 140 l -9 -2 l 4 -8 z" fill="#e2903a"/>
  <!-- structural arrow blocked -->
  <line x1="216" y1="220" x2="262" y2="212" stroke="#4c8dd6" stroke-width="2.2"/>
  <line x1="266" y1="196" x2="266" y2="228" stroke="#4c8dd6" stroke-width="3.5"/>
  <text x="266" y="248" font-size="10.5" fill="#4c8dd6" text-anchor="middle">blocked</text>

  <!-- stage 3: chain to ratification -->
  <line x1="428" y1="168" x2="462" y2="168" stroke="currentColor" stroke-width="1.5"/>
  <path d="M 462 168 l -8 -5 l 0 10 z" fill="currentColor"/>

  <rect x="466" y="72" width="150" height="40" rx="5" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="541" y="89" font-size="11" fill="currentColor" text-anchor="middle">House passes 17 articles</text>
  <text x="541" y="104" font-size="10" fill="currentColor" opacity="0.6" text-anchor="middle">August 1789</text>
  <rect x="466" y="122" width="150" height="40" rx="5" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="541" y="139" font-size="11" fill="currentColor" text-anchor="middle">Senate compresses to 12</text>
  <text x="541" y="154" font-size="10" fill="currentColor" opacity="0.6" text-anchor="middle">September 1789</text>
  <rect x="466" y="172" width="150" height="40" rx="5" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="541" y="189" font-size="11" fill="currentColor" text-anchor="middle">12 proposed to the states</text>
  <text x="541" y="204" font-size="10" fill="currentColor" opacity="0.6" text-anchor="middle">Sept. 25 · sent Oct. 2, 1789</text>
  <rect x="466" y="222" width="150" height="40" rx="5" fill="#5aa46a" fill-opacity="0.15" stroke="#5aa46a" stroke-width="1.8"/>
  <text x="541" y="239" font-size="11" font-weight="bold" fill="currentColor" text-anchor="middle">10 ratified</text>
  <text x="541" y="254" font-size="10" fill="currentColor" opacity="0.7" text-anchor="middle">December 15, 1791</text>
  <line x1="541" y1="112" x2="541" y2="122" stroke="currentColor" stroke-width="1.2"/>
  <line x1="541" y1="162" x2="541" y2="172" stroke="currentColor" stroke-width="1.2"/>
  <line x1="541" y1="212" x2="541" y2="222" stroke="currentColor" stroke-width="1.2"/>

  <text x="320" y="300" font-size="11" fill="currentColor" opacity="0.7" text-anchor="middle">One structural survivor: the Tenth Amendment — with the word "expressly," which the states had</text>
  <text x="320" y="316" font-size="11" fill="currentColor" opacity="0.7" text-anchor="middle">asked for, deliberately left out. The blue column never reached the parchment.</text>
</svg>

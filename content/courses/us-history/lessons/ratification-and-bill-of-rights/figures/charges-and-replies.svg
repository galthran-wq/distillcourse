<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- column headers -->
  <text x="24" y="22" font-size="13" font-weight="600" fill="#e2903a">The charge</text>
  <text x="268" y="22" font-size="13" font-weight="600" fill="#4c8dd6">The Federalist reply</text>
  <text x="500" y="22" font-size="13" font-weight="600" fill="currentColor" opacity="0.55">The fate</text>

  <!-- row 1: scale -->
  <rect x="16" y="36" width="228" height="44" rx="5" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <text x="26" y="54" font-size="12" font-weight="600" fill="currentColor">Scale</text>
  <text x="26" y="70" font-size="11" fill="currentColor" opacity="0.55">a free republic must be small</text>
  <line x1="244" y1="58" x2="258" y2="58" stroke="currentColor" stroke-width="1" opacity="0.4"/>
  <rect x="260" y="36" width="220" height="44" rx="5" fill="none" stroke="#4c8dd6" stroke-width="1.5"/>
  <text x="270" y="54" font-size="11" fill="currentColor">scale itself is the cure:</text>
  <text x="270" y="70" font-size="11" fill="currentColor">the extended republic (No. 10)</text>

  <!-- row 2: taxation -->
  <rect x="16" y="92" width="228" height="44" rx="5" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <text x="26" y="110" font-size="12" font-weight="600" fill="currentColor">The purse</text>
  <text x="26" y="126" font-size="11" fill="currentColor" opacity="0.55">unbounded federal taxation</text>

  <!-- row 3: army -->
  <rect x="16" y="148" width="228" height="44" rx="5" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <text x="26" y="166" font-size="12" font-weight="600" fill="currentColor">The sword</text>
  <text x="26" y="182" font-size="11" fill="currentColor" opacity="0.55">standing armies in peacetime</text>

  <!-- shared reply for rows 2-3 -->
  <line x1="244" y1="114" x2="252" y2="114" stroke="currentColor" stroke-width="1" opacity="0.4"/>
  <line x1="244" y1="170" x2="252" y2="170" stroke="currentColor" stroke-width="1" opacity="0.4"/>
  <line x1="252" y1="114" x2="252" y2="170" stroke="currentColor" stroke-width="1" opacity="0.4"/>
  <line x1="252" y1="142" x2="258" y2="142" stroke="currentColor" stroke-width="1" opacity="0.4"/>
  <rect x="260" y="120" width="220" height="44" rx="5" fill="none" stroke="#4c8dd6" stroke-width="1.5"/>
  <text x="270" y="138" font-size="11" fill="currentColor">structure checks power:</text>
  <text x="270" y="154" font-size="11" fill="currentColor">the double security (No. 51)</text>

  <!-- row 4: rights -->
  <rect x="16" y="212" width="228" height="44" rx="5" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <text x="26" y="230" font-size="12" font-weight="600" fill="currentColor">The missing bill</text>
  <text x="26" y="246" font-size="11" fill="currentColor" opacity="0.55">no declaration of rights</text>
  <line x1="244" y1="234" x2="258" y2="234" stroke="currentColor" stroke-width="1" opacity="0.4"/>
  <rect x="260" y="212" width="226" height="44" rx="5" fill="none" stroke="#4c8dd6" stroke-width="1.5"/>
  <text x="268" y="230" font-size="11" fill="currentColor">enumerated powers need no fence;</text>
  <text x="268" y="246" font-size="11" fill="currentColor">a list endangers what it omits (No. 84)</text>

  <!-- fate brackets -->
  <path d="M 492 40 L 498 40 L 498 188 L 492 188" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <text x="506" y="106" font-size="11" font-weight="600" fill="#e2903a">structural demands</text>
  <text x="506" y="121" font-size="11" fill="currentColor" opacity="0.55">refused in 1789,</text>
  <text x="506" y="136" font-size="11" fill="currentColor" opacity="0.55">never enacted</text>

  <path d="M 492 216 L 498 216 L 498 252 L 492 252" fill="none" stroke="#5aa46a" stroke-width="1.5"/>
  <text x="506" y="228" font-size="11" font-weight="600" fill="#5aa46a">rights demand</text>
  <text x="506" y="243" font-size="11" fill="currentColor" opacity="0.55">paid in 1791</text>

  <!-- divider between structural block and rights row -->
  <line x1="16" y1="202" x2="480" y2="202" stroke="currentColor" stroke-width="1" opacity="0.15" stroke-dasharray="3 3"/>

  <text x="16" y="286" font-size="11" fill="currentColor" opacity="0.55">Brutus I (Oct 1787) and Mason carry the charges; Publius's replies are the next section's subject.</text>
</svg>

schema_version: 1
images:
  - file: "bill-of-rights-twelve-articles-*.jpg"
    title: "The engrossed Bill of Rights — the enrolled resolution of the First Congress proposing twelve amendments, September 25, 1789"
    credit: "United States Congress, engrossed on parchment and signed by Frederick Augustus Muhlenberg, Speaker of the House, and John Adams, Vice President and President of the Senate; National Archives and Records Administration, Washington DC, National Archives Identifier 1408042 (Charters of Freedom). Conservation photograph of the front, April 9, 2003; file via Wikimedia Commons"
    source_url: "https://catalog.archives.gov/id/1408042"
    license: "public domain (US federal government record; Wikimedia Commons carries the NARA photograph as public domain)"
    retrieved: "2026-08-01"
    located: "NARA's 3794×4670 conservation photograph of the parchment's front. Frame 1 is the whole sheet, from the engrossed heading down to the attestations of Muhlenberg, Adams, John Beckley and Samuel A. Otis; frame 2 is a detail of the left column of article headings, \"Article the first\" through \"Article the twelfth\""
    modifications: "cropped only — frame 1 to the parchment itself (the GretagMacbeth ColorChecker chart above it and the National Archives scale bar below it removed), frame 2 to the article-heading column; both downscaled to 1400px wide, metadata stripped, re-encoded as JPEG at quality 86. Nothing on the document was retouched, removed or enhanced"
    background: light

  - file: federal-pillars-1788.jpg
    title: "\"The Federal Pillars\", Massachusetts Centinel, 16 January 1788"
    credit: "Unattributed woodcut, printed in Benjamin Russell's *Massachusetts Centinel*, Boston, 16 January 1788; Library of Congress, Prints and Photographs Division"
    source_url: "https://commons.wikimedia.org/wiki/File:The_federal_pillars_LCCN2004676796.jpg"
    license: "public domain — published before 1928; the Library of Congress states \"No known restrictions on publication\" for this item, and Wikimedia Commons carries it as PD-old"
    retrieved: "2026-08-01"
    located: "LOC digital ID cph.3a45780, LCCN 2004676796 (Cresswell, *The American Revolution in Drawings and Prints*, no. 894a-c) — the catalogue item covers all three prints of the 1788 series (16 January, 11 June, 2 August); this digital file is the first, with five pillars standing and Massachusetts being raised"
    modifications: "cropped from the 1536×1277 scan to the clipping itself — the unrelated news column beneath the motto and the newspaper's column rules at both sides removed; downscaled to 1400px and re-encoded as JPEG at quality 85. Nothing within the woodcut altered; the broken 'giv[e]' at the right margin is the source clipping's own trim"
    background: light

  - file: looking-glass-1787.jpg
    title: "\"The Looking Glass for 1787\" — Connecticut's Council of Twelve hauling the state's debt-mired wagon in opposite directions"
    credit: "Attributed to Amos Doolittle (1754–1832) — the Library of Congress records that the attribution comes from the Sotheby's sale catalog, not from the sheet itself; engraving and rocker work with watercolor on laid paper, 28.7 × 36.7 cm, [New Haven], 1787. Library of Congress Prints and Photographs Division, American cartoon print filing series, PC/US - 1787.D664, no. 1 (B size); digital file from the original, LC-DIG-ppmsca-17522. Full catalog title: \"The looking glass for 1787. A house divided against itself cannot stand. Mat. chap. 13th verse 26\""
    source_url: "https://www.loc.gov/pictures/item/2008661778/"
    license: "public domain — the Library of Congress states \"No known restrictions on publication\" for this print, published in 1787"
    retrieved: "2026-08-01"
    located: "the upper register of the sheet, cut from the Library's uncompressed master scan of the original (9687×7299): the title cartouche, the CONNECTICUTT wagon with the Council of Twelve's driver standing on the load, the five Federal councillors and their beaming sun at left, the seven Antifederal councillors with storm cloud and fire at right"
    modifications: "cropped to the top ~40% of the sheet — the lower register (Parnassus and the Connecticut Wits, \"Cato\", the ploughman, \"Agricola\" and \"S--H--P\", the New York shoreline, the shipping, and the printed motto line \"A House divided against its self cannot stand\") is cut away, together with the lower half of the right-hand lightning bolt; downscaled to 2400px wide, metadata stripped and re-encoded as JPEG at quality 84. Nothing inside the picture was retouched, removed or tonally corrected — the paper tone, fold creases and foxing are the sheet's own"
    background: none

  - file: patrick-henry-matthews.jpg
    title: "Patrick Henry"
    credit: "George Bagby Matthews (1857–1943), after Thomas Sully (1783–1872), oil on canvas, c. 1891, 74.93 × 62.55 cm; U.S. Senate Collection, Washington, DC — file via Wikimedia Commons"
    source_url: "https://commons.wikimedia.org/wiki/File:Patrick_henry.JPG"
    license: "public domain — a work of the U.S. federal government (Matthews was employed at the Capitol as a painter and restorer of art); Commons carries it as PD-USGov-Congress"
    retrieved: "2026-07-30"
    located: "U.S. Senate Collection accession no. 31.00011.000, signed \"G MAtthews\" in the lower left corner; a copy after a Sully portrait of Henry, not painted from life"
    modifications: "none to the picture — the whole canvas at its native 610×737, neither cropped nor scaled; metadata stripped and re-encoded as JPEG at quality 95"
    background: none

  - file: hamilton-trumbull.jpg
    title: "Alexander Hamilton (John Trumbull, 1806)"
    credit: "John Trumbull (1756–1843), 1806, oil on canvas, 77.5 × 62.2 cm — National Portrait Gallery, Smithsonian Institution, Washington DC (NPG.79.216); high-resolution scan by the Google Cultural Institute, via Wikimedia Commons"
    source_url: "https://commons.wikimedia.org/wiki/File:John_Trumbull_-_Alexander_Hamilton_-_Google_Art_Project.jpg"
    license: "public domain (PD-Art / PD-US — Trumbull died in 1843 and the work was published before 1931; the photographic reproduction of a two-dimensional public-domain painting carries no new copyright and is marked Creative Commons Public Domain Mark 1.0)"
    retrieved: "2026-08-01"
    located: "NPG.79.216 — the half-length type Trumbull painted of Hamilton in 1806, two years after the sitter's death"
    modifications: "cropped from the full canvas to a head-and-shoulders bust (the lower canvas and the outer background fall outside the crop), downscaled from the 5890×7326 source to 1200px wide, re-encoded as JPEG at quality 86; not upscaled, no other alteration"
    background: none

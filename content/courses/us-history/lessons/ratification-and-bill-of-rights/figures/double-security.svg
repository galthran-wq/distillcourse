<svg viewBox="0 0 600 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- the people -->
  <rect x="215" y="12" width="170" height="32" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="300" y="32" font-size="13" fill="currentColor" text-anchor="middle">power surrendered by the people</text>

  <!-- first division -->
  <line x1="300" y1="44" x2="160" y2="84" stroke="#e2903a" stroke-width="2"/>
  <path d="M 160 84 l 3 -8 l 6 5 z" fill="#e2903a"/>
  <line x1="300" y1="44" x2="440" y2="84" stroke="#e2903a" stroke-width="2"/>
  <path d="M 440 84 l -3 -8 l -6 5 z" fill="#e2903a"/>
  <text x="300" y="70" font-size="11" fill="#e2903a" text-anchor="middle" font-weight="bold">first divided</text>

  <!-- federal box -->
  <rect x="40" y="88" width="240" height="150" rx="6" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="160" y="108" font-size="12.5" font-weight="bold" fill="currentColor" text-anchor="middle">the federal government</text>
  <rect x="54" y="122" width="64" height="60" rx="4" fill="#4c8dd6" opacity="0.25"/>
  <text x="86" y="148" font-size="10.5" fill="currentColor" text-anchor="middle">legis-</text>
  <text x="86" y="161" font-size="10.5" fill="currentColor" text-anchor="middle">lative</text>
  <rect x="128" y="122" width="64" height="60" rx="4" fill="#4c8dd6" opacity="0.25"/>
  <text x="160" y="148" font-size="10.5" fill="currentColor" text-anchor="middle">exec-</text>
  <text x="160" y="161" font-size="10.5" fill="currentColor" text-anchor="middle">utive</text>
  <rect x="202" y="122" width="64" height="60" rx="4" fill="#4c8dd6" opacity="0.25"/>
  <text x="234" y="148" font-size="10.5" fill="currentColor" text-anchor="middle">judi-</text>
  <text x="234" y="161" font-size="10.5" fill="currentColor" text-anchor="middle">cial</text>
  <!-- internal check arrows -->
  <path d="M 100 196 q 60 26 120 0" fill="none" stroke="#4c8dd6" stroke-width="1.5"/>
  <path d="M 220 196 l -2 8 l -7 -5 z" fill="#4c8dd6"/>
  <text x="160" y="226" font-size="10.5" fill="#4c8dd6" text-anchor="middle">then subdivided: each controls itself</text>

  <!-- state box -->
  <rect x="320" y="88" width="240" height="150" rx="6" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="440" y="108" font-size="12.5" font-weight="bold" fill="currentColor" text-anchor="middle">the state governments</text>
  <rect x="334" y="122" width="64" height="60" rx="4" fill="#4c8dd6" opacity="0.25"/>
  <text x="366" y="148" font-size="10.5" fill="currentColor" text-anchor="middle">legis-</text>
  <text x="366" y="161" font-size="10.5" fill="currentColor" text-anchor="middle">lative</text>
  <rect x="408" y="122" width="64" height="60" rx="4" fill="#4c8dd6" opacity="0.25"/>
  <text x="440" y="148" font-size="10.5" fill="currentColor" text-anchor="middle">exec-</text>
  <text x="440" y="161" font-size="10.5" fill="currentColor" text-anchor="middle">utive</text>
  <rect x="482" y="122" width="64" height="60" rx="4" fill="#4c8dd6" opacity="0.25"/>
  <text x="514" y="148" font-size="10.5" fill="currentColor" text-anchor="middle">judi-</text>
  <text x="514" y="161" font-size="10.5" fill="currentColor" text-anchor="middle">cial</text>
  <path d="M 380 196 q 60 26 120 0" fill="none" stroke="#4c8dd6" stroke-width="1.5"/>
  <path d="M 500 196 l -2 8 l -7 -5 z" fill="#4c8dd6"/>
  <text x="440" y="226" font-size="10.5" fill="#4c8dd6" text-anchor="middle">then subdivided: each controls itself</text>

  <!-- mutual control arrow between the two governments -->
  <line x1="284" y1="160" x2="316" y2="160" stroke="#e2903a" stroke-width="2"/>
  <path d="M 284 160 l 8 -5 l 0 10 z" fill="#e2903a"/>
  <path d="M 316 160 l -8 -5 l 0 10 z" fill="#e2903a"/>
  <text x="300" y="262" font-size="11" fill="#e2903a" text-anchor="middle" font-weight="bold">"the different governments will control each other"</text>

  <text x="300" y="292" font-size="11.5" fill="currentColor" text-anchor="middle">Hence a double security arises to the rights of the people. — No. 51</text>
  <text x="300" y="314" font-size="10.5" fill="currentColor" opacity="0.55" text-anchor="middle">amber: the federal division (federalism) · blue: the departmental division (separation of powers)</text>
</svg>

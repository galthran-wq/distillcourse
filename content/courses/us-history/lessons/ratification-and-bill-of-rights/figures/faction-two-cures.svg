<svg viewBox="0 0 560 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- root -->
  <rect x="185" y="14" width="190" height="34" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="280" y="35" font-size="13" fill="currentColor" text-anchor="middle">"the mischiefs of faction"</text>

  <!-- branch lines -->
  <line x1="280" y1="48" x2="150" y2="86" stroke="currentColor" stroke-width="1" opacity="0.6"/>
  <line x1="280" y1="48" x2="420" y2="86" stroke="currentColor" stroke-width="1" opacity="0.6"/>

  <!-- cure 1: remove causes -->
  <rect x="60" y="86" width="180" height="32" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="150" y="106" font-size="12.5" fill="currentColor" text-anchor="middle">cure 1: remove its causes</text>
  <line x1="150" y1="118" x2="90" y2="152" stroke="currentColor" stroke-width="1" opacity="0.6"/>
  <line x1="150" y1="118" x2="210" y2="152" stroke="currentColor" stroke-width="1" opacity="0.6"/>

  <g opacity="0.75">
    <rect x="20" y="152" width="140" height="46" rx="5" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="90" y="171" font-size="11.5" fill="currentColor" text-anchor="middle">destroy the liberty</text>
    <text x="90" y="186" font-size="11.5" fill="currentColor" text-anchor="middle">faction feeds on</text>
    <line x1="26" y1="196" x2="154" y2="154" stroke="currentColor" stroke-width="1.6"/>
  </g>
  <text x="90" y="216" font-size="11" fill="currentColor" opacity="0.65" text-anchor="middle">"worse than the disease"</text>

  <g opacity="0.75">
    <rect x="170" y="152" width="140" height="46" rx="5" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="240" y="171" font-size="11.5" fill="currentColor" text-anchor="middle">give every citizen the</text>
    <text x="240" y="186" font-size="11.5" fill="currentColor" text-anchor="middle">same opinions and interests</text>
    <line x1="176" y1="196" x2="304" y2="154" stroke="currentColor" stroke-width="1.6"/>
  </g>
  <text x="240" y="216" font-size="11" fill="currentColor" opacity="0.65" text-anchor="middle">"impracticable"</text>

  <!-- cure 2: control effects -->
  <rect x="330" y="86" width="180" height="32" rx="5" fill="none" stroke="#e2903a" stroke-width="2"/>
  <text x="420" y="106" font-size="12.5" fill="#e2903a" text-anchor="middle" font-weight="bold">cure 2: control its effects</text>
  <line x1="420" y1="118" x2="420" y2="152" stroke="#e2903a" stroke-width="1.5"/>
  <path d="M 420 152 l -4 -7 l 8 0 z" fill="#e2903a"/>

  <rect x="340" y="154" width="160" height="50" rx="5" fill="none" stroke="#e2903a" stroke-width="2"/>
  <text x="420" y="174" font-size="12" fill="currentColor" text-anchor="middle">representation, plus</text>
  <text x="420" y="190" font-size="12" fill="currentColor" text-anchor="middle">an extended republic</text>
  <text x="420" y="224" font-size="11" fill="currentColor" opacity="0.65" text-anchor="middle">"Extend the sphere, and you take in</text>
  <text x="420" y="238" font-size="11" fill="currentColor" opacity="0.65" text-anchor="middle">a greater variety of parties and interests"</text>

  <text x="280" y="282" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">Federalist No. 10: both cause-removing cures rejected; the design controls effects instead.</text>
</svg>

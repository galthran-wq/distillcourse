<svg viewBox="0 0 640 235" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- left panel: unanimity under the Articles -->
  <text x="20" y="24" font-size="13" font-weight="600" fill="currentColor">Amend the Articles: 13 of 13</text>

  <!-- 13 state squares: 12 yes (blue), 1 holdout (amber) -->
  <g>
    <rect x="20" y="40" width="16" height="16" rx="3" fill="#4c8dd6"/>
    <rect x="41" y="40" width="16" height="16" rx="3" fill="#4c8dd6"/>
    <rect x="62" y="40" width="16" height="16" rx="3" fill="#4c8dd6"/>
    <rect x="83" y="40" width="16" height="16" rx="3" fill="#4c8dd6"/>
    <rect x="104" y="40" width="16" height="16" rx="3" fill="#4c8dd6"/>
    <rect x="125" y="40" width="16" height="16" rx="3" fill="#4c8dd6"/>
    <rect x="146" y="40" width="16" height="16" rx="3" fill="#4c8dd6"/>
    <rect x="167" y="40" width="16" height="16" rx="3" fill="#4c8dd6"/>
    <rect x="188" y="40" width="16" height="16" rx="3" fill="#4c8dd6"/>
    <rect x="209" y="40" width="16" height="16" rx="3" fill="#4c8dd6"/>
    <rect x="230" y="40" width="16" height="16" rx="3" fill="#4c8dd6"/>
    <rect x="251" y="40" width="16" height="16" rx="3" fill="#4c8dd6"/>
    <rect x="272" y="40" width="16" height="16" rx="3" fill="#e2903a"/>
    <text x="280" y="52" font-size="11" font-weight="700" fill="currentColor" text-anchor="middle">N</text>
  </g>
  <text x="20" y="74" font-size="11" fill="currentColor" opacity="0.55">12 yes</text>
  <line x1="280" y1="60" x2="280" y2="72" stroke="#e2903a" stroke-width="1.5"/>
  <text x="274" y="76" font-size="11" fill="#e2903a" text-anchor="end">one no</text>

  <text x="20" y="100" font-size="12" fill="currentColor">proposal dead — the impost, twice</text>
  <text x="20" y="122" font-size="12" font-weight="600" fill="#e2903a">the last holdout holds a veto to sell</text>

  <!-- divider -->
  <line x1="330" y1="16" x2="330" y2="130" stroke="currentColor" stroke-width="1" opacity="0.25" stroke-dasharray="3 3"/>

  <!-- right panel: Article VII -->
  <text x="356" y="24" font-size="13" font-weight="600" fill="currentColor">Ratify the Constitution: 9 of 13</text>

  <!-- 9 in (blue), 4 outside (outline) -->
  <g>
    <rect x="356" y="40" width="16" height="16" rx="3" fill="#4c8dd6"/>
    <rect x="377" y="40" width="16" height="16" rx="3" fill="#4c8dd6"/>
    <rect x="398" y="40" width="16" height="16" rx="3" fill="#4c8dd6"/>
    <rect x="419" y="40" width="16" height="16" rx="3" fill="#4c8dd6"/>
    <rect x="440" y="40" width="16" height="16" rx="3" fill="#4c8dd6"/>
    <rect x="461" y="40" width="16" height="16" rx="3" fill="#4c8dd6"/>
    <rect x="482" y="40" width="16" height="16" rx="3" fill="#4c8dd6"/>
    <rect x="503" y="40" width="16" height="16" rx="3" fill="#4c8dd6"/>
    <rect x="524" y="40" width="16" height="16" rx="3" fill="#4c8dd6"/>
    <rect x="551" y="40" width="16" height="16" rx="3" fill="none" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5"/>
    <rect x="572" y="40" width="16" height="16" rx="3" fill="none" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5"/>
    <rect x="593" y="40" width="16" height="16" rx="3" fill="none" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5"/>
    <rect x="614" y="40" width="16" height="16" rx="3" fill="none" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5"/>
  </g>
  <!-- bracket under the nine -->
  <path d="M 356 62 L 356 68 L 540 68 L 540 62" fill="none" stroke="#4c8dd6" stroke-width="1.5"/>
  <text x="356" y="83" font-size="11" fill="#4c8dd6">nine ratify — the union operates</text>
  <text x="630" y="100" font-size="11" fill="currentColor" opacity="0.55" text-anchor="end">outside the union:</text>
  <text x="630" y="114" font-size="11" fill="currentColor" opacity="0.55" text-anchor="end">no trade, no protection, no vote</text>

  <text x="356" y="134" font-size="12" font-weight="600" fill="#e2903a">the holdout risks exclusion, not leverage</text>

  <!-- bottom band: the two that tested it -->
  <line x1="20" y1="150" x2="630" y2="150" stroke="currentColor" stroke-width="1" opacity="0.15"/>
  <text x="20" y="176" font-size="12" fill="currentColor">The rule, tested: <tspan font-weight="600">North Carolina</tspan> stayed out to Nov 1789, <tspan font-weight="600">Rhode Island</tspan> to May 1790 —</text>
  <text x="20" y="196" font-size="12" fill="currentColor">both joined a union already running without them, the second under threatened trade sanctions.</text>
  <text x="20" y="222" font-size="11" fill="currentColor" opacity="0.55">Under unanimity each could have blocked everything; under Article VII each could only exclude itself.</text>
</svg>

<svg viewBox="0 0 640 270" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <marker id="nr-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M 0 0 L 6 3 L 0 6 z" fill="#4c8dd6"/>
    </marker>
  </defs>

  <text x="20" y="22" font-size="13" font-weight="600" fill="currentColor">Three conventions, five weeks, news at horse speed</text>

  <!-- New Hampshire lane -->
  <text x="248" y="52" font-size="11" fill="currentColor">New Hampshire — second session</text>
  <rect x="248" y="58" width="27" height="10" rx="3" fill="currentColor" opacity="0.18"/>
  <circle cx="275" cy="63" r="4" fill="#e2903a"/>
  <text x="283" y="67" font-size="11" fill="#e2903a">June 21 · 57–47 · the ninth state</text>

  <!-- Virginia lane -->
  <text x="104" y="100" font-size="11" fill="currentColor">Virginia — Richmond, June 2–25</text>
  <rect x="104" y="106" width="207" height="10" rx="3" fill="currentColor" opacity="0.18"/>
  <circle cx="311" cy="111" r="4" fill="#e2903a"/>
  <text x="305" y="131" font-size="11" fill="#e2903a" text-anchor="end">June 25 · 89–79</text>

  <!-- New York lane -->
  <rect x="239" y="168" width="351" height="10" rx="3" fill="currentColor" opacity="0.18"/>
  <circle cx="302" cy="173" r="3" fill="#4c8dd6"/>
  <circle cx="374" cy="173" r="3" fill="#4c8dd6"/>
  <circle cx="590" cy="173" r="4" fill="#e2903a"/>
  <text x="239" y="196" font-size="11" fill="currentColor">New York — Poughkeepsie, June 17–July 26</text>
  <text x="598" y="196" font-size="11" fill="#e2903a" text-anchor="end">July 26 · 30–27</text>

  <!-- news: NH result to Richmond, too late -->
  <line x1="277" y1="68" x2="345" y2="103" stroke="#4c8dd6" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#nr-arrow)"/>
  <text x="352" y="102" font-size="10" fill="#4c8dd6">arrived after the vote</text>

  <!-- news: NH result to Poughkeepsie, June 24 -->
  <line x1="277" y1="70" x2="300" y2="166" stroke="#4c8dd6" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#nr-arrow)"/>
  <text x="270" y="148" font-size="10" fill="#4c8dd6" text-anchor="end">rider, 3 days</text>

  <!-- news: VA result to Poughkeepsie, July 2 -->
  <line x1="314" y1="118" x2="372" y2="166" stroke="#4c8dd6" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#nr-arrow)"/>
  <text x="352" y="148" font-size="10" fill="#4c8dd6">rider, 7 days</text>

  <!-- date axis -->
  <line x1="95" y1="215" x2="620" y2="215" stroke="currentColor" stroke-width="1" opacity="0.4"/>
  <line x1="104" y1="212" x2="104" y2="218" stroke="currentColor" stroke-width="1" opacity="0.4"/>
  <line x1="275" y1="212" x2="275" y2="218" stroke="currentColor" stroke-width="1" opacity="0.4"/>
  <line x1="311" y1="212" x2="311" y2="218" stroke="currentColor" stroke-width="1" opacity="0.4"/>
  <line x1="374" y1="212" x2="374" y2="218" stroke="currentColor" stroke-width="1" opacity="0.4"/>
  <line x1="590" y1="212" x2="590" y2="218" stroke="currentColor" stroke-width="1" opacity="0.4"/>
  <text x="104" y="230" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">June 2</text>
  <text x="275" y="230" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">21</text>
  <text x="311" y="230" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">25</text>
  <text x="374" y="230" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">July 2</text>
  <text x="590" y="230" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">July 26</text>

  <text x="20" y="250" font-size="11" fill="currentColor" opacity="0.55">New Hampshire and Virginia voted four days apart, each ignorant of the other;</text>
  <text x="20" y="264" font-size="11" fill="currentColor" opacity="0.55">New York, stalled until both results rode in, voted knowing.</text>
</svg>

<svg viewBox="0 0 640 636" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- header -->
  <text x="16" y="22" font-size="12" font-weight="bold" fill="currentColor">State</text>
  <text x="172" y="22" font-size="12" font-weight="bold" fill="currentColor">Date</text>
  <text x="286" y="22" font-size="12" font-weight="bold" fill="currentColor">Vote</text>
  <text x="392" y="22" font-size="12" font-weight="bold" fill="currentColor">Share voting yes</text>
  <line x1="12" y1="30" x2="628" y2="30" stroke="currentColor" stroke-width="1" opacity="0.4"/>

  <!-- 50% guide -->
  <line x1="467" y1="34" x2="467" y2="560" stroke="currentColor" stroke-width="1" stroke-dasharray="3 3" opacity="0.35"/>
  <text x="467" y="576" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">50%</text>

  <!-- rows -->
  <!-- Delaware -->
  <text x="16" y="52" font-size="12" fill="currentColor">Delaware</text>
  <text x="172" y="52" font-size="11" fill="currentColor" opacity="0.7">Dec 7, 1787</text>
  <text x="286" y="52" font-size="12" fill="currentColor">30–0</text>
  <rect x="392" y="42" width="150" height="12" rx="2" fill="#4c8dd6" opacity="0.25"/>
  <rect x="392" y="42" width="150" height="12" rx="2" fill="#e2903a"/>
  <!-- Pennsylvania -->
  <text x="16" y="86" font-size="12" fill="currentColor">Pennsylvania</text>
  <text x="172" y="86" font-size="11" fill="currentColor" opacity="0.7">Dec 12, 1787</text>
  <text x="286" y="86" font-size="12" fill="currentColor">46–23</text>
  <rect x="392" y="76" width="150" height="12" rx="2" fill="#4c8dd6" opacity="0.25"/>
  <rect x="392" y="76" width="100" height="12" rx="2" fill="#e2903a"/>
  <!-- New Jersey -->
  <text x="16" y="120" font-size="12" fill="currentColor">New Jersey</text>
  <text x="172" y="120" font-size="11" fill="currentColor" opacity="0.7">Dec 18, 1787</text>
  <text x="286" y="120" font-size="12" fill="currentColor">38–0</text>
  <rect x="392" y="110" width="150" height="12" rx="2" fill="#4c8dd6" opacity="0.25"/>
  <rect x="392" y="110" width="150" height="12" rx="2" fill="#e2903a"/>
  <!-- Georgia -->
  <text x="16" y="154" font-size="12" fill="currentColor">Georgia</text>
  <text x="172" y="154" font-size="11" fill="currentColor" opacity="0.7">Jan 2, 1788</text>
  <text x="286" y="154" font-size="12" fill="currentColor">26–0</text>
  <rect x="392" y="144" width="150" height="12" rx="2" fill="#4c8dd6" opacity="0.25"/>
  <rect x="392" y="144" width="150" height="12" rx="2" fill="#e2903a"/>
  <!-- Connecticut -->
  <text x="16" y="188" font-size="12" fill="currentColor">Connecticut</text>
  <text x="172" y="188" font-size="11" fill="currentColor" opacity="0.7">Jan 9, 1788</text>
  <text x="286" y="188" font-size="12" fill="currentColor">128–40</text>
  <rect x="392" y="178" width="150" height="12" rx="2" fill="#4c8dd6" opacity="0.25"/>
  <rect x="392" y="178" width="114" height="12" rx="2" fill="#e2903a"/>
  <!-- Massachusetts (razor) -->
  <rect x="10" y="200" width="620" height="26" rx="4" fill="#e2903a" opacity="0.1"/>
  <text x="16" y="218" font-size="12" font-weight="bold" fill="currentColor">Massachusetts</text>
  <text x="172" y="218" font-size="11" fill="currentColor" opacity="0.7">Feb 6, 1788</text>
  <text x="286" y="218" font-size="12" font-weight="bold" fill="currentColor">187–168</text>
  <rect x="392" y="207" width="150" height="12" rx="2" fill="#4c8dd6" opacity="0.25"/>
  <rect x="392" y="207" width="79" height="12" rx="2" fill="#e2903a"/>
  <text x="550" y="218" font-size="11" font-weight="bold" fill="#e2903a">19 of 355</text>
  <!-- Maryland -->
  <text x="16" y="252" font-size="12" fill="currentColor">Maryland</text>
  <text x="172" y="252" font-size="11" fill="currentColor" opacity="0.7">Apr 28, 1788</text>
  <text x="286" y="252" font-size="12" fill="currentColor">63–11</text>
  <rect x="392" y="242" width="150" height="12" rx="2" fill="#4c8dd6" opacity="0.25"/>
  <rect x="392" y="242" width="128" height="12" rx="2" fill="#e2903a"/>
  <!-- South Carolina -->
  <text x="16" y="286" font-size="12" fill="currentColor">South Carolina</text>
  <text x="172" y="286" font-size="11" fill="currentColor" opacity="0.7">May 23, 1788</text>
  <text x="286" y="286" font-size="12" fill="currentColor">149–73</text>
  <rect x="392" y="276" width="150" height="12" rx="2" fill="#4c8dd6" opacity="0.25"/>
  <rect x="392" y="276" width="101" height="12" rx="2" fill="#e2903a"/>
  <!-- New Hampshire -->
  <text x="16" y="320" font-size="12" fill="currentColor">New Hampshire</text>
  <text x="172" y="320" font-size="11" fill="currentColor" opacity="0.7">Jun 21, 1788</text>
  <text x="286" y="320" font-size="12" fill="currentColor">57–47</text>
  <rect x="392" y="310" width="150" height="12" rx="2" fill="#4c8dd6" opacity="0.25"/>
  <rect x="392" y="310" width="82" height="12" rx="2" fill="#e2903a"/>
  <!-- ninth-state threshold -->
  <line x1="12" y1="334" x2="628" y2="334" stroke="#5aa46a" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="16" y="348" font-size="11" fill="#5aa46a">ninth ratification — Article VII satisfied: the Constitution takes effect for the ratifying states</text>
  <!-- Virginia (razor) -->
  <rect x="10" y="356" width="620" height="26" rx="4" fill="#e2903a" opacity="0.1"/>
  <text x="16" y="374" font-size="12" font-weight="bold" fill="currentColor">Virginia</text>
  <text x="172" y="374" font-size="11" fill="currentColor" opacity="0.7">Jun 25, 1788</text>
  <text x="286" y="374" font-size="12" font-weight="bold" fill="currentColor">89–79</text>
  <rect x="392" y="363" width="150" height="12" rx="2" fill="#4c8dd6" opacity="0.25"/>
  <rect x="392" y="363" width="79" height="12" rx="2" fill="#e2903a"/>
  <text x="550" y="374" font-size="11" font-weight="bold" fill="#e2903a">10 of 168</text>
  <!-- New York (razor) -->
  <rect x="10" y="390" width="620" height="26" rx="4" fill="#e2903a" opacity="0.1"/>
  <text x="16" y="408" font-size="12" font-weight="bold" fill="currentColor">New York</text>
  <text x="172" y="408" font-size="11" fill="currentColor" opacity="0.7">Jul 26, 1788</text>
  <text x="286" y="408" font-size="12" font-weight="bold" fill="currentColor">30–27</text>
  <rect x="392" y="397" width="150" height="12" rx="2" fill="#4c8dd6" opacity="0.25"/>
  <rect x="392" y="397" width="79" height="12" rx="2" fill="#e2903a"/>
  <text x="550" y="408" font-size="11" font-weight="bold" fill="#e2903a">3 of 57</text>
  <!-- North Carolina -->
  <text x="16" y="442" font-size="12" fill="currentColor">North Carolina</text>
  <text x="172" y="442" font-size="11" fill="currentColor" opacity="0.7">Nov 21, 1789</text>
  <text x="286" y="442" font-size="12" fill="currentColor">194–77</text>
  <rect x="392" y="432" width="150" height="12" rx="2" fill="#4c8dd6" opacity="0.25"/>
  <rect x="392" y="432" width="107" height="12" rx="2" fill="#e2903a"/>
  <text x="34" y="458" font-size="10.5" fill="currentColor" opacity="0.6">Aug 1788, Hillsborough: voted 184–84 to neither ratify nor reject</text>
  <!-- Rhode Island -->
  <text x="16" y="486" font-size="12" fill="currentColor">Rhode Island</text>
  <text x="172" y="486" font-size="11" fill="currentColor" opacity="0.7">May 29, 1790</text>
  <text x="286" y="486" font-size="12" fill="currentColor">34–32</text>
  <rect x="392" y="476" width="150" height="12" rx="2" fill="#4c8dd6" opacity="0.25"/>
  <rect x="392" y="476" width="77" height="12" rx="2" fill="#e2903a"/>
  <text x="34" y="502" font-size="10.5" fill="currentColor" opacity="0.6">Mar 1788 referendum (Federalists boycotting): rejected 2,708–237</text>

  <!-- legend -->
  <rect x="392" y="524" width="14" height="10" rx="2" fill="#e2903a"/>
  <text x="411" y="533" font-size="11" fill="currentColor" opacity="0.7">for ratification</text>
  <rect x="497" y="524" width="14" height="10" rx="2" fill="#4c8dd6" opacity="0.25"/>
  <text x="516" y="533" font-size="11" fill="currentColor" opacity="0.7">against</text>
  <text x="16" y="533" font-size="11" fill="currentColor" opacity="0.7">Highlighted rows: the three closest large-state conventions.</text>
</svg>

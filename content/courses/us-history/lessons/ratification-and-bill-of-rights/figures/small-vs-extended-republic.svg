<svg viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- left panel: small republic -->
  <text x="150" y="26" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">small republic</text>
  <rect x="40" y="40" width="220" height="160" rx="6" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <!-- one faction is a majority: 60% amber block -->
  <rect x="48" y="48" width="204" height="86" rx="4" fill="#e2903a" opacity="0.85"/>
  <text x="150" y="86" font-size="12" fill="currentColor" text-anchor="middle">one interest</text>
  <text x="150" y="102" font-size="12" font-weight="bold" fill="currentColor" text-anchor="middle">60% — a standing majority</text>
  <rect x="48" y="140" width="100" height="52" rx="4" fill="currentColor" opacity="0.18"/>
  <text x="98" y="169" font-size="11" fill="currentColor" text-anchor="middle" opacity="0.8">25%</text>
  <rect x="154" y="140" width="98" height="52" rx="4" fill="currentColor" opacity="0.1"/>
  <text x="203" y="169" font-size="11" fill="currentColor" text-anchor="middle" opacity="0.8">15%</text>
  <text x="150" y="222" font-size="11.5" fill="currentColor" opacity="0.7" text-anchor="middle">a majority faction needs no partners:</text>
  <text x="150" y="237" font-size="11.5" fill="currentColor" opacity="0.7" text-anchor="middle">it can outvote every check</text>

  <!-- arrow -->
  <line x1="278" y1="120" x2="316" y2="120" stroke="currentColor" stroke-width="2"/>
  <path d="M 316 120 l -8 -5 l 0 10 z" fill="currentColor"/>
  <text x="297" y="106" font-size="10.5" fill="currentColor" opacity="0.65" text-anchor="middle">extend</text>

  <!-- right panel: extended republic -->
  <text x="450" y="26" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">extended republic</text>
  <rect x="340" y="40" width="220" height="160" rx="6" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <!-- many small interests; largest is amber at 15% -->
  <rect x="348" y="48" width="66" height="44" rx="4" fill="#e2903a" opacity="0.85"/>
  <text x="381" y="74" font-size="10.5" fill="currentColor" text-anchor="middle">15%</text>
  <rect x="420" y="48" width="60" height="44" rx="4" fill="currentColor" opacity="0.2"/>
  <rect x="486" y="48" width="66" height="44" rx="4" fill="currentColor" opacity="0.12"/>
  <rect x="348" y="98" width="52" height="46" rx="4" fill="currentColor" opacity="0.16"/>
  <rect x="406" y="98" width="70" height="46" rx="4" fill="currentColor" opacity="0.1"/>
  <rect x="482" y="98" width="70" height="46" rx="4" fill="currentColor" opacity="0.2"/>
  <rect x="348" y="150" width="76" height="42" rx="4" fill="currentColor" opacity="0.12"/>
  <rect x="430" y="150" width="54" height="42" rx="4" fill="currentColor" opacity="0.18"/>
  <rect x="490" y="150" width="62" height="42" rx="4" fill="currentColor" opacity="0.1"/>
  <text x="450" y="222" font-size="11.5" fill="currentColor" opacity="0.7" text-anchor="middle">no interest close to a majority: ruling requires</text>
  <text x="450" y="237" font-size="11.5" fill="currentColor" opacity="0.7" text-anchor="middle">a coalition, and coalitions must bargain</text>

  <text x="300" y="270" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">The largest faction (amber) shrinks from ruler to bargainer</text>
  <text x="300" y="285" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">as the sphere widens — No. 10's inversion of the axiom.</text>
</svg>

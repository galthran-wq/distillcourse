<svg viewBox="0 0 620 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <text x="130" y="24" font-size="12.5" font-weight="bold" fill="currentColor" text-anchor="middle">on the 1789 parchment</text>
  <text x="470" y="24" font-size="12.5" font-weight="bold" fill="currentColor" text-anchor="middle">what became of it</text>

  <!-- Article the first -->
  <rect x="30" y="40" width="200" height="30" rx="4" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.7"/>
  <text x="130" y="59" font-size="11.5" fill="currentColor" text-anchor="middle">Article the first — House size</text>
  <line x1="230" y1="55" x2="360" y2="55" stroke="currentColor" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.5"/>
  <path d="M 360 55 l -8 -4 l 0 8 z" fill="currentColor" opacity="0.5"/>
  <text x="470" y="52" font-size="11.5" fill="currentColor" opacity="0.7" text-anchor="middle">never ratified — sent without a deadline,</text>
  <text x="470" y="66" font-size="11.5" fill="currentColor" opacity="0.7" text-anchor="middle">technically still before the states</text>

  <!-- Article the second -->
  <rect x="30" y="82" width="200" height="30" rx="4" fill="none" stroke="#5aa46a" stroke-width="1.6"/>
  <text x="130" y="101" font-size="11.5" fill="currentColor" text-anchor="middle">Article the second — pay raises</text>
  <line x1="230" y1="97" x2="360" y2="97" stroke="#5aa46a" stroke-width="1.6"/>
  <path d="M 360 97 l -8 -4 l 0 8 z" fill="#5aa46a"/>
  <text x="470" y="94" font-size="11.5" font-weight="bold" fill="#5aa46a" text-anchor="middle">ratified May 1992:</text>
  <text x="470" y="108" font-size="11.5" fill="currentColor" text-anchor="middle">the 27th Amendment — 202 years later</text>

  <!-- Articles 3..12 -->
  <rect x="30" y="124" width="200" height="176" rx="4" fill="#e2903a" fill-opacity="0.12" stroke="#e2903a" stroke-width="1.6"/>
  <text x="130" y="146" font-size="11.5" fill="currentColor" text-anchor="middle">Article the third</text>
  <text x="130" y="164" font-size="11.5" fill="currentColor" text-anchor="middle">Article the fourth</text>
  <text x="130" y="182" font-size="11.5" fill="currentColor" text-anchor="middle">Article the fifth</text>
  <text x="130" y="200" font-size="11.5" fill="currentColor" text-anchor="middle">⋮</text>
  <text x="130" y="220" font-size="11.5" fill="currentColor" text-anchor="middle">Article the twelfth</text>
  <line x1="230" y1="212" x2="360" y2="212" stroke="#e2903a" stroke-width="2"/>
  <path d="M 360 212 l -8 -4 l 0 8 z" fill="#e2903a"/>
  <text x="470" y="196" font-size="11.5" font-weight="bold" fill="#e2903a" text-anchor="middle">Amendments 1–10,</text>
  <text x="470" y="211" font-size="11.5" fill="currentColor" text-anchor="middle">ratified December 15, 1791</text>
  <text x="470" y="231" font-size="10.5" fill="currentColor" opacity="0.65" text-anchor="middle">"Article the third" — religion, speech,</text>
  <text x="470" y="245" font-size="10.5" fill="currentColor" opacity="0.65" text-anchor="middle">press, assembly, petition — became</text>
  <text x="470" y="259" font-size="10.5" fill="currentColor" opacity="0.65" text-anchor="middle">the First Amendment</text>

  <text x="310" y="322" font-size="11" fill="currentColor" opacity="0.6" text-anchor="middle">Twelve articles, proposed September 25, 1789; "the Bill of Rights" begins two articles down the sheet.</text>
</svg>

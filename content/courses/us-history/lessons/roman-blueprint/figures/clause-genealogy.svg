<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" font-family="system-ui, sans-serif" font-size="12">
  <!-- headers -->
  <text x="24" y="26" font-size="13" font-weight="bold" fill="#e2903a">the design of 1787&#8211;91</text>
  <text x="360" y="26" font-size="13" font-weight="bold" fill="#4c8dd6">named source</text>
  <line x1="24" y1="38" x2="596" y2="38" stroke="currentColor" opacity="0.35"/>

  <!-- row 1: due process -->
  <text x="24" y="60" fill="currentColor" font-weight="bold">due process &#183; 5th Am.</text>
  <text x="360" y="60" fill="currentColor">Magna Carta cl. 39 (1215)</text>
  <line x1="24" y1="72" x2="596" y2="72" stroke="currentColor" opacity="0.15"/>

  <!-- row 2: petition -->
  <text x="24" y="94" fill="currentColor" font-weight="bold">petition &#183; 1st Am.</text>
  <text x="360" y="94" fill="currentColor">Bill of Rights (1689)</text>
  <line x1="24" y1="106" x2="596" y2="106" stroke="currentColor" opacity="0.15"/>

  <!-- row 3: arms -->
  <text x="24" y="128" fill="currentColor" font-weight="bold">arms &#183; 2nd Am.</text>
  <text x="360" y="128" fill="currentColor">Bill of Rights (1689)</text>
  <line x1="24" y1="140" x2="596" y2="140" stroke="currentColor" opacity="0.15"/>

  <!-- row 4: quartering -->
  <text x="24" y="162" fill="currentColor" font-weight="bold">no quartering &#183; 3rd Am.</text>
  <text x="360" y="162" fill="currentColor">Petition of Right (1628); 1689 army clause</text>
  <line x1="24" y1="174" x2="596" y2="174" stroke="currentColor" opacity="0.15"/>

  <!-- row 5: jury -->
  <text x="24" y="196" fill="currentColor" font-weight="bold">jury trial &#183; Art. III, 6th&#8211;7th Am.</text>
  <text x="360" y="196" fill="currentColor">common law; 1689 jurors clause</text>
  <line x1="24" y1="208" x2="596" y2="208" stroke="currentColor" opacity="0.15"/>

  <!-- row 6: HIGHLIGHTED worked row -->
  <rect x="18" y="216" width="578" height="40" rx="5" fill="#e2903a" opacity="0.12"/>
  <rect x="18" y="216" width="578" height="40" rx="5" fill="none" stroke="#e2903a"/>
  <text x="24" y="234" fill="#e2903a" font-weight="bold">bail &#183; fines &#183; punishments &#183; 8th Am.</text>
  <text x="360" y="234" fill="currentColor">Bill of Rights (1689) &#8594; Virginia (1776)</text>
  <text x="24" y="250" fill="currentColor" opacity="0.7" font-size="11">near-verbatim: one word changes &#8212; &#8220;ought not&#8221; becomes &#8220;shall not&#8221; (traced in the text)</text>

  <!-- row 7: triad -->
  <text x="24" y="280" fill="currentColor" font-weight="bold">President &#183; Senate &#183; House</text>
  <text x="360" y="280" fill="currentColor">Polybius VI: the one, few, and many mixed</text>
  <line x1="24" y1="292" x2="596" y2="292" stroke="currentColor" opacity="0.15"/>

  <!-- row 8: separation -->
  <text x="24" y="314" fill="currentColor" font-weight="bold">separated, mutually checking powers</text>
  <text x="360" y="314" fill="currentColor">Montesquieu XI.6 (1748), corrected</text>
  <text x="360" y="329" fill="currentColor" opacity="0.55" font-size="11">by Federalist 47&#8211;51</text>
  <line x1="24" y1="340" x2="596" y2="340" stroke="currentColor" opacity="0.15"/>

  <!-- row 9: written constitution -->
  <text x="24" y="362" fill="currentColor" font-weight="bold">written constitution above legislature</text>
  <text x="360" y="362" fill="currentColor">charters &#183; compacts &#183; Massachusetts 1780</text>
  <line x1="24" y1="374" x2="596" y2="374" stroke="currentColor" opacity="0.35"/>

  <!-- takeaway -->
  <text x="24" y="400" fill="currentColor" opacity="0.55">every load-bearing clause has a named ancestor; what is new in 1787 is the</text>
  <text x="24" y="416" fill="currentColor" opacity="0.55">assembly of all of them into one written, superior, ratified document</text>
</svg>

    title: "General George Washington Resigning His Commission, 1824"
    credit: "John Trumbull (1756–1843), oil on canvas, 365.76 × 548.64 cm, commissioned 1817 and placed in the United States Capitol rotunda in 1824; photograph by the Architect of the Capitol, file obtained via Wikimedia Commons"

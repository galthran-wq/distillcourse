<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 320" font-family="system-ui, sans-serif" font-size="12">
  <!-- origin block -->
  <rect x="24" y="118" width="104" height="76" rx="6" fill="#e2903a" opacity="0.12"/>
  <rect x="24" y="118" width="104" height="76" rx="6" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <text x="76" y="150" text-anchor="middle" fill="#e2903a" font-weight="bold">the design</text>
  <text x="76" y="168" text-anchor="middle" fill="#e2903a" font-weight="bold">of 1787&#8211;91</text>

  <!-- fan arrows -->
  <g stroke="currentColor" opacity="0.5" fill="none">
    <path d="M 128 132 L 168 56"/>
    <path d="M 128 150 L 168 128"/>
    <path d="M 128 166 L 168 200"/>
    <path d="M 128 182 L 168 270"/>
  </g>

  <!-- row 1: written constitutions -->
  <text x="176" y="44" fill="currentColor" font-weight="bold">written national constitution</text>
  <text x="176" y="62" fill="currentColor">Poland, May 1791 &#183; France, Sept 1791 &#183; now the near-universal default</text>

  <!-- row 2: elected executive / separation -->
  <text x="176" y="116" fill="currentColor" font-weight="bold">separated powers, elected executive</text>
  <text x="176" y="134" fill="currentColor">Venezuela 1811, then the Latin American republics</text>

  <!-- row 3: federal structure -->
  <text x="176" y="188" fill="currentColor" font-weight="bold">federal structure</text>
  <text x="176" y="206" fill="currentColor">Mexico 1824 &#183; Switzerland 1848 &#183; Canada 1867 &#183; Australia 1901</text>

  <!-- row 4: judicial review -->
  <text x="176" y="258" fill="currentColor" font-weight="bold">judicial constitutional review</text>
  <text x="176" y="276" fill="currentColor">worldwide after 1945: Germany &#183; Japan &#183; India &#183; Italy</text>

  <line x1="176" y1="74" x2="596" y2="74" stroke="currentColor" opacity="0.15"/>
  <line x1="176" y1="146" x2="596" y2="146" stroke="currentColor" opacity="0.15"/>
  <line x1="176" y1="218" x2="596" y2="218" stroke="currentColor" opacity="0.15"/>
</svg>

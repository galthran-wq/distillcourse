<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" font-family="system-ui, sans-serif" font-size="12">
  <!-- ===== top rung: Bill of Rights ===== -->
  <rect x="120" y="20" width="400" height="40" rx="6" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <text x="136" y="44" font-size="13" fill="currentColor"><tspan font-weight="bold" fill="#e2903a">Bill of Rights, 1791</tspan><tspan opacity="0.7"> &#8212; English clauses, re-enacted as &#8220;shall&#8221;</tspan></text>

  <line x1="320" y1="94" x2="320" y2="64" stroke="currentColor"/>
  <path d="M 315 71 L 320 64 L 325 71" fill="none" stroke="currentColor"/>

  <!-- ===== rung: Constitution 1787 (the junction) ===== -->
  <rect x="120" y="98" width="400" height="52" rx="6" fill="#e2903a" opacity="0.12"/>
  <rect x="120" y="98" width="400" height="52" rx="6" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <text x="136" y="120" font-size="13" font-weight="bold" fill="#e2903a">Constitution, 1787: the two channels join</text>
  <text x="136" y="138" fill="currentColor">drafted by convention, ratified by conventions of the people</text>

  <line x1="320" y1="186" x2="320" y2="154" stroke="currentColor"/>
  <path d="M 315 161 L 320 154 L 325 161" fill="none" stroke="currentColor"/>

  <!-- ===== rung: Articles ===== -->
  <rect x="120" y="190" width="400" height="40" rx="6" fill="none" stroke="currentColor"/>
  <text x="136" y="214" font-size="13" fill="currentColor"><tspan font-weight="bold">Articles of Confederation, 1781</tspan><tspan opacity="0.7"> &#8212; a league; no tax power</tspan></text>

  <line x1="320" y1="266" x2="320" y2="234" stroke="currentColor"/>
  <path d="M 315 241 L 320 234 L 325 241" fill="none" stroke="currentColor"/>

  <!-- ===== rung: state constitutions ===== -->
  <rect x="120" y="270" width="400" height="40" rx="6" fill="none" stroke="currentColor"/>
  <text x="136" y="294" font-size="13" fill="currentColor"><tspan font-weight="bold">state constitutions, 1776&#8211;80</tspan><tspan opacity="0.7"> &#8212; the rehearsal</tspan></text>

  <line x1="320" y1="346" x2="320" y2="314" stroke="currentColor"/>
  <path d="M 315 321 L 320 314 L 325 321" fill="none" stroke="currentColor"/>

  <!-- ===== compressed colonial rungs ===== -->
  <g opacity="0.5">
    <rect x="120" y="350" width="400" height="32" rx="6" fill="none" stroke="currentColor"/>
    <text x="136" y="370" fill="currentColor"><tspan font-weight="bold">colonial assembly &#183; covenanted town &#183; congregation</tspan></text>
    <rect x="120" y="390" width="400" height="32" rx="6" fill="none" stroke="currentColor"/>
    <text x="136" y="410" fill="currentColor"><tspan font-weight="bold">Mayflower Compact, 1620</tspan><tspan opacity="0.8"> &#8212; a civil body politic by written consent</tspan></text>
    <line x1="320" y1="386" x2="320" y2="382" stroke="currentColor"/>
  </g>

  <!-- ===== feeder channel: bottom-up ===== -->
  <path d="M 96 406 L 60 406 L 60 124 L 120 124" fill="none" stroke="#4c8dd6" stroke-width="1.5"/>
  <path d="M 112 119 L 120 124 L 112 129" fill="none" stroke="#4c8dd6" stroke-width="1.5"/>
  <path d="M 120 406 L 96 406" fill="none" stroke="#4c8dd6" stroke-width="1.5" opacity="0"/>
  <text x="14" y="240" fill="#4c8dd6" font-size="11" font-weight="bold">bottom-up:</text>
  <text x="14" y="255" fill="#4c8dd6" font-size="11" font-weight="bold">colonial</text>
  <text x="14" y="270" fill="#4c8dd6" font-size="11" font-weight="bold">practice</text>

  <!-- ===== feeder channel: top-down ===== -->
  <path d="M 580 300 L 580 124 L 520 124" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <path d="M 528 119 L 520 124 L 528 129" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <text x="536" y="320" fill="#e2903a" font-size="11" font-weight="bold">top-down:</text>
  <text x="536" y="335" fill="#e2903a" font-size="11" font-weight="bold">Polybius &#183;</text>
  <text x="536" y="350" fill="#e2903a" font-size="11" font-weight="bold">Magna Carta &#183;</text>
  <text x="536" y="365" fill="#e2903a" font-size="11" font-weight="bold">1689 &#183;</text>
  <text x="536" y="380" fill="#e2903a" font-size="11" font-weight="bold">Montesquieu</text>
</svg>

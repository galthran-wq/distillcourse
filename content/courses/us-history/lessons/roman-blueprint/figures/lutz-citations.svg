<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 366" font-family="system-ui, sans-serif" font-size="12">
  <text x="24" y="20" font-size="13" font-weight="bold" fill="currentColor">Share of all citations, ~1,000 publications, 1760&#8211;1805</text>

  <!-- shared scale, both panels: 1% = 12px, bars start x=150 -->
  <g stroke="currentColor" stroke-dasharray="3 3" opacity="0.2">
    <line x1="270" y1="34" x2="270" y2="176"/>
    <line x1="390" y1="34" x2="390" y2="176"/>
    <line x1="510" y1="34" x2="510" y2="176"/>
    <line x1="270" y1="206" x2="270" y2="292"/>
    <line x1="390" y1="206" x2="390" y2="292"/>
    <line x1="510" y1="206" x2="510" y2="292"/>
  </g>
  <line x1="150" y1="34" x2="150" y2="176" stroke="currentColor" opacity="0.4"/>
  <line x1="150" y1="206" x2="150" y2="292" stroke="currentColor" opacity="0.4"/>

  <!-- panel 1: category shares -->
  <!-- Bible ~34% -->
  <text x="142" y="52" text-anchor="end" fill="currentColor">Bible</text>
  <rect x="150" y="40" width="408" height="16" rx="3" fill="currentColor" opacity="0.35"/>
  <text x="158" y="52" fill="currentColor">mostly reprinted sermons</text>
  <text x="550" y="52" text-anchor="end" fill="currentColor">~34%</text>
  <!-- Enlightenment ~22% -->
  <text x="142" y="78" text-anchor="end" fill="currentColor">Enlightenment</text>
  <rect x="150" y="66" width="264" height="16" rx="3" fill="currentColor" opacity="0.35"/>
  <text x="422" y="78" fill="currentColor">~22%</text>
  <!-- Whig ~18% -->
  <text x="142" y="104" text-anchor="end" fill="currentColor">English Whigs</text>
  <rect x="150" y="92" width="216" height="16" rx="3" fill="currentColor" opacity="0.35"/>
  <text x="374" y="104" fill="currentColor">~18%</text>
  <text x="418" y="104" fill="currentColor" opacity="0.55">Cato&#8217;s Letters and kin</text>
  <!-- common law ~11% -->
  <text x="142" y="130" text-anchor="end" fill="currentColor">Common law</text>
  <rect x="150" y="118" width="132" height="16" rx="3" fill="currentColor" opacity="0.35"/>
  <text x="290" y="130" fill="currentColor">~11%</text>
  <!-- classical ~9% -->
  <text x="142" y="156" text-anchor="end" font-weight="bold" fill="#e2903a">Classical</text>
  <rect x="150" y="144" width="108" height="16" rx="3" fill="#e2903a"/>
  <text x="266" y="156" fill="#e2903a" font-weight="bold">~9%</text>
  <text x="308" y="156" fill="currentColor" opacity="0.55">one stream among several</text>

  <line x1="24" y1="176" x2="596" y2="176" stroke="currentColor" opacity="0.25"/>

  <!-- panel 2: top named authors, same scale -->
  <text x="24" y="198" font-size="13" font-weight="bold" fill="currentColor">Most-cited individual authors <tspan font-weight="normal" opacity="0.55">(same scale)</tspan></text>

  <text x="142" y="226" text-anchor="end" fill="currentColor">Montesquieu</text>
  <rect x="150" y="214" width="100" height="16" rx="3" fill="#4c8dd6"/>
  <text x="258" y="226" fill="#4c8dd6" font-weight="bold">8.3%</text>

  <text x="142" y="252" text-anchor="end" fill="currentColor">Blackstone</text>
  <rect x="150" y="240" width="95" height="16" rx="3" fill="#4c8dd6" opacity="0.6"/>
  <text x="253" y="252" fill="currentColor">7.9%</text>

  <text x="142" y="278" text-anchor="end" fill="currentColor">Locke</text>
  <rect x="150" y="266" width="35" height="16" rx="3" fill="#4c8dd6" opacity="0.6"/>
  <text x="193" y="278" fill="currentColor">2.9%</text>

  <!-- axis -->
  <line x1="150" y1="292" x2="558" y2="292" stroke="currentColor" opacity="0.4"/>
  <g fill="currentColor" opacity="0.55" font-size="11">
    <text x="150" y="308" text-anchor="middle">0</text>
    <text x="270" y="308" text-anchor="middle">10</text>
    <text x="390" y="308" text-anchor="middle">20</text>
    <text x="510" y="308" text-anchor="middle">30</text>
    <text x="354" y="324" text-anchor="middle">% of all citations</text>
  </g>

  <text x="24" y="348" fill="currentColor" opacity="0.55">Counts: Lutz 1984/1988. &#8220;Deuteronomy is cited almost twice as often as all of</text>
  <text x="24" y="363" fill="currentColor" opacity="0.55">Locke&#8217;s writings put together.&#8221;</text>
</svg>

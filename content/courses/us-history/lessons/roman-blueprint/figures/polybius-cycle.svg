<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="system-ui, sans-serif" font-size="12">
  <!-- ===== left: the cycle ===== -->
  <text x="150" y="26" text-anchor="middle" font-size="13" font-weight="bold" fill="currentColor">the cycle (anacyclosis)</text>

  <!-- six stages around a circle, center (150,220), r=120; arrows clockwise -->
  <!-- kingship (top) -->
  <text x="150" y="92" text-anchor="middle" fill="currentColor" font-weight="bold">kingship</text>
  <!-- tyranny (upper right) -->
  <text x="256" y="158" text-anchor="middle" fill="currentColor" opacity="0.55">tyranny</text>
  <!-- aristocracy (lower right) -->
  <text x="258" y="292" text-anchor="middle" fill="currentColor" font-weight="bold">aristocracy</text>
  <!-- oligarchy (bottom) -->
  <text x="150" y="360" text-anchor="middle" fill="currentColor" opacity="0.55">oligarchy</text>
  <!-- democracy (lower left) -->
  <text x="44" y="292" text-anchor="middle" fill="currentColor" font-weight="bold">democracy</text>
  <!-- mob rule (upper left) -->
  <text x="46" y="158" text-anchor="middle" fill="currentColor" opacity="0.55">mob rule</text>

  <!-- clockwise arc arrows between stages -->
  <g fill="none" stroke="currentColor" opacity="0.6">
    <path d="M 178 100 A 105 105 0 0 1 238 138"/>
    <path d="M 262 172 A 105 105 0 0 1 268 260"/>
    <path d="M 244 302 A 105 105 0 0 1 186 344"/>
    <path d="M 118 346 A 105 105 0 0 1 60 304"/>
    <path d="M 36 262 A 105 105 0 0 1 40 172"/>
    <path d="M 62 140 A 105 105 0 0 1 120 100"/>
  </g>
  <g fill="none" stroke="currentColor" opacity="0.6">
    <path d="M 231 131 L 238 138 L 228 141"/>
    <path d="M 262 250 L 268 260 L 258 258"/>
    <path d="M 196 340 L 186 344 L 190 334"/>
    <path d="M 66 294 L 60 304 L 70 306"/>
    <path d="M 36 182 L 40 172 L 46 181"/>
    <path d="M 110 103 L 120 100 L 114 110"/>
  </g>
  <text x="150" y="212" text-anchor="middle" fill="currentColor" opacity="0.55">each pure form</text>
  <text x="150" y="228" text-anchor="middle" fill="currentColor" opacity="0.55">decays into its</text>
  <text x="150" y="244" text-anchor="middle" fill="currentColor" opacity="0.55">corrupt twin</text>

  <!-- ===== right: the cure and the translation ===== -->
  <text x="475" y="26" text-anchor="middle" font-size="13" font-weight="bold" fill="currentColor">the cure: mix the three forms</text>

  <!-- Rome row -->
  <text x="475" y="52" text-anchor="middle" fill="currentColor" opacity="0.55">Rome (Polybius VI)</text>
  <rect x="340" y="62" width="84" height="34" rx="5" fill="none" stroke="currentColor"/>
  <text x="382" y="78" text-anchor="middle" fill="currentColor">consuls</text>
  <text x="382" y="91" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.55">the one</text>
  <rect x="433" y="62" width="84" height="34" rx="5" fill="none" stroke="currentColor"/>
  <text x="475" y="78" text-anchor="middle" fill="currentColor">senate</text>
  <text x="475" y="91" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.55">the few</text>
  <rect x="526" y="62" width="90" height="34" rx="5" fill="none" stroke="currentColor"/>
  <text x="571" y="78" text-anchor="middle" fill="currentColor">assemblies</text>
  <text x="571" y="91" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.55">the many</text>
  <!-- mutual check arrows -->
  <g stroke="currentColor" opacity="0.5" fill="none">
    <path d="M 424 79 L 433 79"/>
    <path d="M 517 79 L 526 79"/>
    <path d="M 382 96 Q 475 130 571 96"/>
  </g>
  <text x="475" y="124" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.55">each checks the others</text>

  <!-- translation arrow -->
  <line x1="475" y1="138" x2="475" y2="168" stroke="#e2903a" stroke-width="1.5"/>
  <path d="M 470 161 L 475 168 L 480 161" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <text x="490" y="158" fill="#e2903a" font-size="11">1787</text>

  <!-- 1787 row -->
  <rect x="340" y="176" width="84" height="34" rx="5" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <text x="382" y="192" text-anchor="middle" fill="currentColor">President</text>
  <text x="382" y="205" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.55">the one</text>
  <rect x="433" y="176" width="84" height="34" rx="5" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <text x="475" y="192" text-anchor="middle" fill="currentColor">Senate</text>
  <text x="475" y="205" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.55">the few</text>
  <rect x="526" y="176" width="90" height="34" rx="5" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <text x="571" y="192" text-anchor="middle" fill="currentColor">House</text>
  <text x="571" y="205" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.55">the many</text>

  <!-- changed premise strip -->
  <rect x="340" y="232" width="276" height="64" rx="6" fill="#e2903a" opacity="0.12"/>
  <rect x="340" y="232" width="276" height="64" rx="6" fill="none" stroke="#e2903a"/>
  <text x="478" y="252" text-anchor="middle" fill="#e2903a" font-weight="bold">the changed premise</text>
  <text x="478" y="270" text-anchor="middle" fill="currentColor">no orders to balance: all three branches</text>
  <text x="478" y="286" text-anchor="middle" fill="currentColor">derive from the same sovereign people</text>

  <!-- footnote linking panels -->
  <text x="340" y="330" fill="currentColor" opacity="0.55">the mixture is the brake on the wheel:</text>
  <text x="340" y="346" fill="currentColor" opacity="0.55">no pure form, so no pure form&#8217;s decay</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 196" font-family="system-ui, sans-serif" font-size="12">
  <!-- axis: 1200-1800, x = 30 + (year-1200)*0.9 -->
  <line x1="30" y1="98" x2="586" y2="98" stroke="currentColor" opacity="0.4"/>
  <g stroke="currentColor" opacity="0.3">
    <line x1="30" y1="94" x2="30" y2="102"/>
    <line x1="120" y1="94" x2="120" y2="102"/>
    <line x1="210" y1="94" x2="210" y2="102"/>
    <line x1="300" y1="94" x2="300" y2="102"/>
    <line x1="390" y1="94" x2="390" y2="102"/>
    <line x1="480" y1="94" x2="480" y2="102"/>
    <line x1="570" y1="94" x2="570" y2="102"/>
  </g>
  <g fill="currentColor" opacity="0.55" font-size="11">
    <text x="30" y="116" text-anchor="middle">1200</text>
    <text x="120" y="116" text-anchor="middle">1300</text>
    <text x="210" y="116" text-anchor="middle">1400</text>
    <text x="300" y="116" text-anchor="middle">1500</text>
    <text x="390" y="116" text-anchor="middle">1600</text>
    <text x="480" y="116" text-anchor="middle">1700</text>
  </g>

  <!-- 1215 Magna Carta (above) -->
  <circle cx="44" cy="98" r="4" fill="currentColor"/>
  <line x1="44" y1="80" x2="44" y2="92" stroke="currentColor" opacity="0.5"/>
  <text x="36" y="40" font-weight="bold" fill="currentColor">Magna Carta, 1215</text>
  <text x="36" y="56" fill="currentColor" opacity="0.55">judgment of his peers,</text>
  <text x="36" y="70" fill="currentColor" opacity="0.55">the law of the land</text>

  <!-- 1689 Bill of Rights (above) -->
  <circle cx="470" cy="98" r="4" fill="currentColor"/>
  <line x1="470" y1="80" x2="470" y2="92" stroke="currentColor" opacity="0.5"/>
  <text x="470" y="40" text-anchor="middle" font-weight="bold" fill="currentColor">Bill of Rights, 1689</text>
  <text x="470" y="56" text-anchor="middle" fill="currentColor" opacity="0.55">petition, arms, jury,</text>
  <text x="470" y="70" text-anchor="middle" fill="currentColor" opacity="0.55">bail, fines, punishments</text>

  <!-- 1628 Petition of Right (below) -->
  <circle cx="415" cy="98" r="4" fill="currentColor"/>
  <line x1="415" y1="104" x2="415" y2="128" stroke="currentColor" opacity="0.5"/>
  <text x="340" y="146" text-anchor="middle" font-weight="bold" fill="currentColor">Petition of Right, 1628</text>
  <text x="340" y="162" text-anchor="middle" fill="currentColor" opacity="0.55">no tax without consent,</text>
  <text x="340" y="176" text-anchor="middle" fill="currentColor" opacity="0.55">no quartering</text>

  <!-- 1791 US Bill of Rights (below) -->
  <circle cx="562" cy="98" r="4" fill="#e2903a"/>
  <line x1="562" y1="104" x2="562" y2="128" stroke="#e2903a" opacity="0.7"/>
  <text x="590" y="146" text-anchor="end" font-weight="bold" fill="#e2903a">US Bill of Rights, 1791</text>
  <text x="590" y="162" text-anchor="end" fill="currentColor" opacity="0.55">the clauses re-enacted:</text>
  <text x="590" y="176" text-anchor="end" fill="currentColor" opacity="0.55">ought &#8594; shall</text>
</svg>

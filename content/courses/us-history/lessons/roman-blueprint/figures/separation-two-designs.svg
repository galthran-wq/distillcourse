<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 224" font-family="system-ui, sans-serif" font-size="12">
  <!-- panel separator -->
  <line x1="318" y1="16" x2="318" y2="208" stroke="currentColor" opacity="0.15"/>

  <!-- ===== left panel: declared ===== -->
  <text x="159" y="24" text-anchor="middle" fill="currentColor" font-weight="bold" font-size="13">DECLARED</text>
  <text x="159" y="40" text-anchor="middle" fill="currentColor" opacity="0.55" font-size="11">Virginia 1776 &#183; Massachusetts Art. XXX, 1780</text>

  <text x="159" y="76" text-anchor="middle" fill="currentColor" opacity="0.55" font-size="11">the boundary: a sentence on paper</text>
  <line x1="110" y1="84" x2="110" y2="138" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5"/>
  <line x1="208" y1="84" x2="208" y2="138" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5"/>

  <rect x="18" y="96" width="86" height="32" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="61" y="116" text-anchor="middle" fill="currentColor" font-weight="bold" font-size="11">LEGISLATIVE</text>
  <rect x="116" y="96" width="86" height="32" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="159" y="116" text-anchor="middle" fill="currentColor" font-weight="bold" font-size="11">EXECUTIVE</text>
  <rect x="214" y="96" width="86" height="32" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="257" y="116" text-anchor="middle" fill="currentColor" font-weight="bold" font-size="11">JUDICIAL</text>

  <!-- 1780s practice: the assembly walks through the boundary -->
  <g stroke="#4c8dd6" stroke-width="1.5" fill="none">
    <path d="M 54 128 C 54 166, 159 166, 159 134"/>
    <path d="M 154 142 L 159 134 L 164 142"/>
    <path d="M 68 128 C 68 194, 257 194, 257 134"/>
    <path d="M 252 142 L 257 134 L 262 142"/>
  </g>
  <text x="159" y="212" text-anchor="middle" fill="#4c8dd6" font-size="11">1780s practice: the assembly overrides both</text>

  <!-- ===== right panel: armed ===== -->
  <text x="477" y="24" text-anchor="middle" fill="currentColor" font-weight="bold" font-size="13">ARMED</text>
  <text x="477" y="40" text-anchor="middle" fill="currentColor" opacity="0.55" font-size="11">Constitution of 1787</text>

  <rect x="336" y="96" width="86" height="32" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="379" y="116" text-anchor="middle" fill="currentColor" font-weight="bold" font-size="11">LEGISLATIVE</text>
  <rect x="434" y="96" width="86" height="32" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="477" y="116" text-anchor="middle" fill="currentColor" font-weight="bold" font-size="11">EXECUTIVE</text>
  <rect x="532" y="96" width="86" height="32" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="575" y="116" text-anchor="middle" fill="currentColor" font-weight="bold" font-size="11">JUDICIAL</text>

  <!-- veto: executive inside legislation -->
  <g stroke="#e2903a" stroke-width="1.5" fill="none">
    <path d="M 477 92 C 477 64, 379 64, 379 90"/>
    <path d="M 374 82 L 379 90 L 384 82"/>
  </g>
  <text x="428" y="58" text-anchor="middle" fill="#e2903a" font-weight="bold" font-size="11">veto</text>

  <!-- appointments and treaties: legislature inside the executive -->
  <g stroke="#e2903a" stroke-width="1.5" fill="none">
    <path d="M 379 132 C 379 166, 477 166, 477 134"/>
    <path d="M 472 142 L 477 134 L 482 142"/>
  </g>
  <text x="428" y="184" text-anchor="middle" fill="#e2903a" font-weight="bold" font-size="11">appointments &#183; treaties</text>

  <!-- the judiciary's arm: irremovable tenure -->
  <rect x="532" y="140" width="86" height="5" rx="2" fill="#e2903a"/>
  <text x="575" y="160" text-anchor="middle" fill="#e2903a" font-weight="bold" font-size="11">tenure during</text>
  <text x="575" y="173" text-anchor="middle" fill="#e2903a" font-weight="bold" font-size="11">good behavior</text>
</svg>

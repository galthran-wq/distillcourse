<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 360" font-family="system-ui, sans-serif" font-size="12">
  <text x="24" y="26" font-size="13" font-weight="bold" fill="currentColor">1776 &#183; Pennsylvania: the assembly speaks as the people</text>

  <!-- constitution slot: still the assembly's own act (dashed, beside the legislature) -->
  <rect x="420" y="172" width="170" height="36" rx="5" fill="none" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5"/>
  <text x="505" y="188" text-anchor="middle" fill="currentColor" opacity="0.7">the constitution:</text>
  <text x="505" y="202" text-anchor="middle" fill="currentColor" opacity="0.7">the assembly&#8217;s own act</text>

  <!-- legislature -->
  <rect x="200" y="166" width="180" height="48" rx="6" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="290" y="184" text-anchor="middle" fill="currentColor" font-weight="bold">LEGISLATURE</text>
  <text x="290" y="198" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.55">one annually elected house;</text>
  <text x="290" y="210" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.55">no governor, no upper house</text>

  <!-- amber sovereignty marker on the legislature -->
  <circle cx="200" cy="166" r="7" fill="#e2903a"/>
  <text x="214" y="156" fill="#e2903a" font-size="11" font-weight="bold">sovereign authority sits here</text>

  <!-- people -->
  <rect x="170" y="304" width="280" height="36" rx="6" fill="none" stroke="currentColor"/>
  <text x="310" y="327" text-anchor="middle" fill="currentColor" font-weight="bold">THE PEOPLE</text>

  <!-- election arrow -->
  <line x1="290" y1="304" x2="290" y2="216" stroke="currentColor"/>
  <path d="M 285 224 L 290 216 L 295 224" fill="none" stroke="currentColor"/>
  <text x="298" y="264" fill="currentColor" opacity="0.55" font-size="11">annual election</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 360" font-family="system-ui, sans-serif" font-size="12">
  <text x="24" y="26" font-size="13" font-weight="bold" fill="currentColor">1780 &#183; Massachusetts: the constitution rises above the legislature</text>

  <!-- constitution elevated -->
  <rect x="200" y="70" width="220" height="44" rx="6" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="310" y="89" text-anchor="middle" fill="currentColor" font-weight="bold">CONSTITUTION</text>
  <text x="310" y="105" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.55">fundamental law, above the government it creates</text>

  <!-- amber sovereignty marker moves to the constitution -->
  <circle cx="200" cy="70" r="7" fill="#e2903a"/>
  <text x="214" y="60" fill="#e2903a" font-size="11" font-weight="bold">sovereign authority moves up</text>

  <!-- subordination line -->
  <line x1="310" y1="114" x2="310" y2="166" stroke="currentColor" opacity="0.6"/>
  <path d="M 305 158 L 310 166 L 315 158" fill="none" stroke="currentColor" opacity="0.6"/>
  <text x="318" y="144" fill="currentColor" opacity="0.55" font-size="11">subordinate</text>

  <!-- legislature -->
  <rect x="200" y="166" width="180" height="48" rx="6" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="290" y="186" text-anchor="middle" fill="currentColor" font-weight="bold">LEGISLATURE</text>
  <text x="290" y="203" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.55">makes statutes, not fundamental law</text>

  <!-- people -->
  <rect x="170" y="304" width="280" height="36" rx="6" fill="none" stroke="currentColor"/>
  <text x="310" y="327" text-anchor="middle" fill="currentColor" font-weight="bold">THE PEOPLE</text>

  <!-- election arrow -->
  <line x1="290" y1="304" x2="290" y2="216" stroke="currentColor"/>
  <path d="M 285 224 L 290 216 L 295 224" fill="none" stroke="currentColor"/>
  <text x="298" y="264" fill="currentColor" opacity="0.55" font-size="11">election</text>

  <!-- constituent channel: convention drafts, towns ratify -->
  <path d="M 170 316 L 96 316 L 96 92 L 200 92" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <path d="M 192 87 L 200 92 L 192 97" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <text x="30" y="184" fill="#e2903a" font-size="11" font-weight="bold">special convention</text>
  <text x="30" y="199" fill="#e2903a" font-size="11" font-weight="bold">drafts; the towns</text>
  <text x="30" y="214" fill="#e2903a" font-size="11" font-weight="bold">ratify</text>
</svg>

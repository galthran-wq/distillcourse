<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 360" font-family="system-ui, sans-serif" font-size="12">
  <text x="24" y="26" font-size="13" font-weight="bold" fill="currentColor">1786&#8594; &#183; courts become the boundary&#8217;s guards</text>

  <!-- constitution elevated -->
  <rect x="200" y="70" width="220" height="44" rx="6" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="310" y="89" text-anchor="middle" fill="currentColor" font-weight="bold">CONSTITUTION, 1787</text>
  <text x="310" y="105" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.55">&#8220;We the People &#8230; do ordain and establish&#8221;</text>

  <!-- amber sovereignty marker -->
  <circle cx="200" cy="70" r="7" fill="#e2903a"/>
  <text x="214" y="60" fill="#e2903a" font-size="11" font-weight="bold">sovereign authority stays with the ratified text</text>

  <!-- subordination lines -->
  <g stroke="currentColor" opacity="0.6" fill="none">
    <path d="M 250 114 L 200 166"/>
    <path d="M 310 114 L 310 166"/>
    <path d="M 370 114 L 420 166"/>
    <path d="M 203 158 L 200 166 L 210 162"/>
    <path d="M 305 158 L 310 166 L 315 158"/>
    <path d="M 411 162 L 420 166 L 417 158"/>
  </g>

  <!-- three branches; courts highlighted -->
  <rect x="145" y="166" width="110" height="48" rx="6" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="200" y="193" text-anchor="middle" fill="currentColor" font-weight="bold">Congress</text>
  <rect x="265" y="166" width="90" height="48" rx="6" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="310" y="193" text-anchor="middle" fill="currentColor" font-weight="bold">President</text>
  <rect x="365" y="166" width="110" height="48" rx="6" fill="none" stroke="#5aa46a" stroke-width="2"/>
  <text x="420" y="187" text-anchor="middle" fill="#5aa46a" font-weight="bold">Courts</text>
  <text x="420" y="203" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.55">guard the boundary</text>

  <!-- rejected act -->
  <rect x="490" y="238" width="112" height="46" rx="5" fill="none" stroke="currentColor" stroke-dasharray="3 3" opacity="0.6"/>
  <text x="546" y="256" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.7">act repugnant to</text>
  <text x="546" y="270" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.7">the constitution</text>
  <line x1="522" y1="244" x2="570" y2="278" stroke="#5aa46a" stroke-width="2"/>
  <line x1="570" y1="244" x2="522" y2="278" stroke="#5aa46a" stroke-width="2"/>
  <path d="M 445 214 L 500 238" fill="none" stroke="#5aa46a" stroke-width="1.5"/>
  <path d="M 491 236 L 500 238 L 495 230" fill="none" stroke="#5aa46a" stroke-width="1.5"/>
  <text x="452" y="308" fill="#5aa46a" font-size="11" font-weight="bold">rejected: Trevett, 1786;</text>
  <text x="452" y="323" fill="#5aa46a" font-size="11" font-weight="bold">Federalist 78</text>

  <!-- people -->
  <rect x="170" y="304" width="280" height="36" rx="6" fill="none" stroke="currentColor"/>
  <text x="310" y="327" text-anchor="middle" fill="currentColor" font-weight="bold">THE PEOPLE</text>

  <!-- election arrow -->
  <line x1="290" y1="304" x2="290" y2="216" stroke="currentColor"/>
  <path d="M 285 224 L 290 216 L 295 224" fill="none" stroke="currentColor"/>
  <text x="298" y="264" fill="currentColor" opacity="0.55" font-size="11">elections</text>
</svg>

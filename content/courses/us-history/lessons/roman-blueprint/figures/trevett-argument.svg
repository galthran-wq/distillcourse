<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 282" font-family="system-ui, sans-serif" font-size="12">
  <!-- the people -->
  <rect x="20" y="14" width="250" height="30" rx="5" fill="none" stroke="currentColor"/>
  <text x="145" y="33" text-anchor="middle" font-weight="bold" fill="currentColor">The people</text>

  <!-- trust arrow -->
  <line x1="145" y1="44" x2="145" y2="66" stroke="currentColor"/>
  <path d="M141 62 L145 70 L149 62" fill="none" stroke="currentColor"/>
  <text x="153" y="60" fill="currentColor" opacity="0.55">trust</text>

  <!-- fundamental law -->
  <rect x="20" y="70" width="250" height="58" rx="5" fill="none" stroke="currentColor"/>
  <text x="145" y="89" text-anchor="middle" font-weight="bold" fill="currentColor">Fundamental law</text>
  <text x="145" y="105" text-anchor="middle" fill="currentColor" opacity="0.55">1663 charter; Magna Carta cl. 39</text>
  <text x="145" y="119" text-anchor="middle" fill="currentColor" opacity="0.55">re-enacted: jury, law of the land</text>

  <!-- subordination arrow -->
  <line x1="145" y1="128" x2="145" y2="150" stroke="currentColor"/>
  <path d="M141 146 L145 154 L149 146" fill="none" stroke="currentColor"/>
  <text x="153" y="144" fill="currentColor" opacity="0.55">delegates, subordinate</text>

  <!-- legislature -->
  <rect x="20" y="154" width="250" height="44" rx="5" fill="none" stroke="currentColor"/>
  <text x="145" y="173" text-anchor="middle" font-weight="bold" fill="currentColor">The legislature</text>
  <text x="145" y="189" text-anchor="middle" fill="currentColor" opacity="0.55">no power but under that law</text>

  <!-- enacts arrow -->
  <line x1="270" y1="176" x2="312" y2="176" stroke="#4c8dd6"/>
  <path d="M308 172 L316 176 L308 180" fill="none" stroke="#4c8dd6"/>
  <text x="291" y="168" text-anchor="middle" fill="#4c8dd6" opacity="0.85">enacts</text>

  <!-- the act -->
  <rect x="316" y="154" width="224" height="58" rx="5" fill="none" stroke="#4c8dd6"/>
  <text x="428" y="173" text-anchor="middle" font-weight="bold" fill="#4c8dd6">Forcing act, 1786</text>
  <text x="428" y="189" text-anchor="middle" fill="currentColor" opacity="0.55">paper money at face value;</text>
  <text x="428" y="203" text-anchor="middle" fill="currentColor" opacity="0.55">guilt without a jury</text>

  <!-- contrary link -->
  <polyline points="428,154 428,99 270,99" fill="none" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5"/>
  <text x="350" y="92" text-anchor="middle" fill="#e2903a" font-weight="bold">&#10007; contrary to</text>

  <!-- court -->
  <rect x="316" y="248" width="224" height="30" rx="5" fill="none" stroke="#e2903a"/>
  <text x="428" y="267" text-anchor="middle" font-weight="bold" fill="#e2903a">The court must reject it</text>

  <!-- refuses arrow -->
  <line x1="428" y1="248" x2="428" y2="220" stroke="#e2903a"/>
  <path d="M424 224 L428 216 L432 224" fill="none" stroke="#e2903a"/>
  <text x="436" y="236" fill="#e2903a">refuses effect</text>
</svg>

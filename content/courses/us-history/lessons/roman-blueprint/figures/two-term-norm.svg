<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 185" font-family="system-ui, sans-serif" font-size="12">
  <!-- axis, 1780 to about 1960 at 3 px per year -->
  <line x1="40" y1="120" x2="592" y2="120" stroke="currentColor"/>
  <g stroke="currentColor" opacity="0.4">
    <line x1="250" y1="117" x2="250" y2="123"/>
    <line x1="400" y1="117" x2="400" y2="123"/>
  </g>
  <text x="250" y="136" text-anchor="middle" fill="currentColor" opacity="0.55" font-size="10">1850</text>
  <text x="400" y="136" text-anchor="middle" fill="currentColor" opacity="0.55" font-size="10">1900</text>

  <!-- 1783: the resignation at Annapolis -->
  <circle cx="49" cy="120" r="4" fill="currentColor"/>
  <line x1="49" y1="126" x2="49" y2="150" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5"/>
  <text x="24" y="163" fill="currentColor" font-size="11">1783 &#8212; Washington resigns his commission</text>

  <!-- 1789-97: the presidency, two terms -->
  <rect x="67" y="113" width="24" height="7" fill="#4c8dd6"/>
  <line x1="79" y1="113" x2="79" y2="72" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5"/>
  <text x="30" y="64" fill="currentColor" font-size="11">1789&#8211;97 &#8212; president, two terms, then retires</text>

  <!-- the unwritten norm, 1797-1940 -->
  <rect x="91" y="106" width="429" height="14" rx="3" fill="#e2903a" opacity="0.9"/>
  <text x="305" y="94" text-anchor="middle" fill="#e2903a" font-weight="bold" font-size="12.5">unwritten two-term norm &#8212; 143 years</text>

  <!-- 1940: the norm breaks -->
  <circle cx="520" cy="120" r="4" fill="currentColor"/>
  <line x1="520" y1="58" x2="520" y2="102" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5"/>
  <text x="600" y="50" text-anchor="end" fill="currentColor" font-size="11">1940 &#8212; FDR&#8217;s third election breaks the norm</text>

  <!-- 1951: written into the Constitution -->
  <circle cx="553" cy="120" r="4.5" fill="#5aa46a"/>
  <line x1="553" y1="126" x2="553" y2="150" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5"/>
  <text x="616" y="163" text-anchor="end" fill="#5aa46a" font-size="11">1951 &#8212; Twenty-second Amendment writes it in</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 232" font-family="system-ui, sans-serif" font-size="12">
  <text x="24" y="20" font-weight="bold" font-size="13" fill="currentColor">The peace of 1783: what changed hands</text>

  <!-- lost -->
  <rect x="24" y="36" width="278" height="122" rx="6" fill="#e2903a" opacity="0.08"/>
  <rect x="24" y="36" width="278" height="122" rx="6" fill="none" stroke="#e2903a"/>
  <text x="163" y="58" text-anchor="middle" fill="#e2903a" font-weight="bold">Britain lost</text>
  <text x="40" y="84" fill="currentColor">the thirteen colonies</text>
  <text x="40" y="106" fill="currentColor">claims east of the Mississippi</text>
  <text x="40" y="128" fill="currentColor">American fishing rights conceded</text>
  <text x="40" y="150" fill="currentColor">North's ministry, March 1782</text>

  <!-- kept -->
  <rect x="318" y="36" width="278" height="122" rx="6" fill="none" stroke="#4c8dd6"/>
  <text x="457" y="58" text-anchor="middle" fill="#4c8dd6" font-weight="bold">Britain kept</text>
  <text x="334" y="84" fill="currentColor">Canada</text>
  <text x="334" y="106" fill="currentColor">Gibraltar: siege beaten off, 1779&#8211;83</text>
  <text x="334" y="128" fill="currentColor">the Caribbean: de Grasse beaten, Apr 1782</text>
  <text x="334" y="150" fill="currentColor">the navy, the money, the empire</text>

  <!-- payoff -->
  <text x="310" y="190" text-anchor="middle" fill="currentColor">Britain cut one theater of a four-front war;</text>
  <text x="310" y="210" text-anchor="middle" fill="currentColor" font-weight="bold">the empire walked away intact</text>
</svg>

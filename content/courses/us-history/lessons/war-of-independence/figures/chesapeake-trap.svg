<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 320" font-family="system-ui, sans-serif" font-size="11">
  <text x="24" y="20" font-weight="bold" font-size="13" fill="currentColor">The Yorktown trap, August&#8211;October 1781</text>

  <!-- coastline with the Chesapeake notch -->
  <path d="M410,38 C435,90 445,140 440,172 L345,168 C328,180 328,200 342,212 L437,208 C445,240 445,272 432,308" fill="none" stroke="currentColor" stroke-width="2" opacity="0.55"/>
  <text x="386" y="160" text-anchor="middle" fill="currentColor" opacity="0.55">Chesapeake Bay</text>

  <!-- New York -->
  <circle cx="412" cy="44" r="4" fill="currentColor"/>
  <text x="402" y="40" text-anchor="end" fill="currentColor" font-weight="bold">New York</text>

  <!-- allied land march -->
  <path d="M398,52 C320,85 295,135 328,168" fill="none" stroke="#e2903a" stroke-width="2.5"/>
  <polygon points="334,176 322,170 331,162" fill="#e2903a"/>
  <text x="240" y="118" text-anchor="middle" fill="currentColor">Washington and Rochambeau:</text>
  <text x="240" y="132" text-anchor="middle" fill="currentColor">450 miles south in secrecy</text>

  <!-- Cornwallis at Yorktown -->
  <circle cx="425" cy="200" r="4" fill="#4c8dd6"/>
  <line x1="422" y1="206" x2="414" y2="226" stroke="currentColor" stroke-dasharray="2 3" opacity="0.5"/>
  <text x="430" y="240" text-anchor="end" fill="currentColor">Yorktown: Cornwallis, &#8776;8,000, sealed off</text>

  <!-- de Grasse holds the mouth -->
  <line x1="443" y1="166" x2="440" y2="214" stroke="#e2903a" stroke-width="5" opacity="0.9"/>
  <text x="454" y="178" fill="#e2903a" font-weight="bold">de Grasse holds the bay</text>
  <text x="454" y="192" fill="#e2903a">28 ships of the line,</text>
  <text x="454" y="206" fill="#e2903a">Aug 30 &#8211; Oct 19</text>
  <path d="M480,300 C468,270 456,245 448,224" fill="none" stroke="#e2903a" stroke-width="2"/>
  <polygon points="445,216 442,229 453,225" fill="#e2903a"/>
  <text x="490" y="288" fill="currentColor">from the Caribbean</text>

  <!-- Graves turned back -->
  <path d="M425,60 C450,105 458,135 452,158" fill="none" stroke="#4c8dd6" stroke-width="1.5" stroke-dasharray="5 3"/>
  <polygon points="450,166 446,154 457,156" fill="#4c8dd6"/>
  <path d="M462,150 C472,118 464,88 442,66" fill="none" stroke="#4c8dd6" stroke-width="1.5" stroke-dasharray="5 3"/>
  <polygon points="436,60 447,63 440,73" fill="#4c8dd6"/>
  <text x="478" y="100" fill="#4c8dd6">Graves: 19 ships;</text>
  <text x="478" y="114" fill="#4c8dd6">turns back Sept 5</text>

  <!-- payoff -->
  <text x="24" y="310" fill="currentColor" font-weight="bold">Two armies by land, one fleet at the mouth: the exit closed</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 240" font-family="system-ui, sans-serif" font-size="11">
  <text x="24" y="20" font-weight="bold" font-size="13" fill="currentColor">The Six Nations split, 1775&#8211;1779</text>

  <!-- with Britain -->
  <rect x="24" y="36" width="330" height="124" rx="6" fill="none" stroke="#4c8dd6" stroke-width="1.5"/>
  <text x="189" y="56" text-anchor="middle" fill="#4c8dd6" font-weight="bold">fought with Britain</text>
  <rect x="40" y="68" width="150" height="30" rx="4" fill="none" stroke="currentColor" opacity="0.5"/>
  <text x="115" y="87" text-anchor="middle" fill="currentColor">Mohawk</text>
  <rect x="198" y="68" width="140" height="30" rx="4" fill="none" stroke="currentColor" opacity="0.5"/>
  <text x="268" y="87" text-anchor="middle" fill="currentColor">Seneca</text>
  <rect x="40" y="112" width="150" height="30" rx="4" fill="none" stroke="currentColor" opacity="0.5"/>
  <text x="115" y="131" text-anchor="middle" fill="currentColor">Cayuga</text>
  <rect x="198" y="112" width="140" height="30" rx="4" fill="none" stroke="currentColor" opacity="0.5"/>
  <text x="268" y="131" text-anchor="middle" fill="currentColor">Onondaga</text>

  <!-- with the Americans -->
  <rect x="380" y="36" width="216" height="124" rx="6" fill="none" stroke="#e2903a" stroke-width="1.5"/>
  <text x="488" y="56" text-anchor="middle" fill="#e2903a" font-weight="bold">fought with the Americans</text>
  <rect x="396" y="68" width="184" height="42" rx="4" fill="#e2903a" opacity="0.12"/>
  <rect x="396" y="68" width="184" height="42" rx="4" fill="none" stroke="#e2903a" opacity="0.7"/>
  <text x="488" y="85" text-anchor="middle" fill="currentColor" font-weight="bold">Oneida</text>
  <text x="488" y="101" text-anchor="middle" fill="currentColor" opacity="0.55">neutral June 1775, then allied</text>
  <rect x="396" y="120" width="184" height="30" rx="4" fill="none" stroke="#e2903a" opacity="0.7"/>
  <text x="488" y="139" text-anchor="middle" fill="currentColor">Tuscarora (most)</text>

  <!-- beyond the confederacy -->
  <line x1="24" y1="180" x2="596" y2="180" stroke="currentColor" opacity="0.35"/>
  <text x="310" y="204" text-anchor="middle" fill="currentColor">Beyond the confederacy, the major interior nations also chose Britain:</text>
  <text x="310" y="224" text-anchor="middle" fill="#4c8dd6" font-weight="bold">Shawnee &#183; Cherokee &#183; Creek</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 226" font-family="system-ui, sans-serif" font-size="11">
  <text x="24" y="20" font-weight="bold" font-size="13" fill="currentColor">The civil war among colonists, tallied</text>

  <!-- allegiance bar -->
  <text x="24" y="46" fill="currentColor">Allegiance of white colonists:</text>
  <rect x="24" y="54" width="114" height="20" rx="3" fill="#4c8dd6" opacity="0.85"/>
  <rect x="138" y="54" width="458" height="20" rx="3" fill="currentColor" opacity="0.12"/>
  <text x="81" y="90" text-anchor="middle" fill="#4c8dd6" font-weight="bold">Loyalist: &#8776;1 in 5</text>
  <text x="367" y="90" text-anchor="middle" fill="currentColor" opacity="0.55">patriot or divided: the rest</text>

  <!-- the exile -->
  <text x="24" y="122" fill="currentColor">&#8776;60,000 exiles by the war's end: about 1 person in 40</text>
  <g fill="currentColor" opacity="0.25">
    <circle cx="62" cy="144" r="5"/><circle cx="90" cy="144" r="5"/><circle cx="118" cy="144" r="5"/><circle cx="146" cy="144" r="5"/><circle cx="174" cy="144" r="5"/><circle cx="202" cy="144" r="5"/><circle cx="230" cy="144" r="5"/><circle cx="258" cy="144" r="5"/><circle cx="286" cy="144" r="5"/><circle cx="314" cy="144" r="5"/><circle cx="342" cy="144" r="5"/><circle cx="370" cy="144" r="5"/><circle cx="398" cy="144" r="5"/><circle cx="426" cy="144" r="5"/><circle cx="454" cy="144" r="5"/><circle cx="482" cy="144" r="5"/><circle cx="510" cy="144" r="5"/><circle cx="538" cy="144" r="5"/><circle cx="566" cy="144" r="5"/>
    <circle cx="34" cy="168" r="5"/><circle cx="62" cy="168" r="5"/><circle cx="90" cy="168" r="5"/><circle cx="118" cy="168" r="5"/><circle cx="146" cy="168" r="5"/><circle cx="174" cy="168" r="5"/><circle cx="202" cy="168" r="5"/><circle cx="230" cy="168" r="5"/><circle cx="258" cy="168" r="5"/><circle cx="286" cy="168" r="5"/><circle cx="314" cy="168" r="5"/><circle cx="342" cy="168" r="5"/><circle cx="370" cy="168" r="5"/><circle cx="398" cy="168" r="5"/><circle cx="426" cy="168" r="5"/><circle cx="454" cy="168" r="5"/><circle cx="482" cy="168" r="5"/><circle cx="510" cy="168" r="5"/><circle cx="538" cy="168" r="5"/><circle cx="566" cy="168" r="5"/>
  </g>
  <circle cx="34" cy="144" r="5" fill="#4c8dd6"/>
  <text x="24" y="204" fill="#4c8dd6">the blue dot leaves: for Nova Scotia, Quebec, Britain, or the Caribbean</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 330" font-family="system-ui, sans-serif" font-size="12">
  <!-- column headers -->
  <text x="250" y="30" text-anchor="middle" font-size="13" font-weight="bold" fill="#4c8dd6">Britain</text>
  <text x="480" y="30" text-anchor="middle" font-size="13" font-weight="bold" fill="#e2903a">The thirteen colonies</text>

  <!-- row separators -->
  <line x1="24" y1="42" x2="596" y2="42" stroke="currentColor" opacity="0.35"/>
  <line x1="24" y1="88" x2="596" y2="88" stroke="currentColor" opacity="0.15"/>
  <line x1="24" y1="140" x2="596" y2="140" stroke="currentColor" opacity="0.15"/>
  <line x1="24" y1="192" x2="596" y2="192" stroke="currentColor" opacity="0.15"/>
  <line x1="24" y1="238" x2="596" y2="238" stroke="currentColor" opacity="0.35"/>

  <!-- row: navy -->
  <text x="24" y="68" fill="currentColor" font-weight="bold">Navy</text>
  <text x="250" y="68" text-anchor="middle" fill="currentColor">the largest on earth</text>
  <text x="480" y="68" text-anchor="middle" fill="currentColor">none</text>

  <!-- row: army -->
  <text x="24" y="112" fill="currentColor" font-weight="bold">Army</text>
  <text x="250" y="106" text-anchor="middle" fill="currentColor">&#8776;35,000 regulars (peak &#8776;40,000, 1781);</text>
  <text x="250" y="122" text-anchor="middle" fill="currentColor">&#8776;30,000 Hessians over the whole war</text>
  <text x="480" y="106" text-anchor="middle" fill="currentColor">rarely 20,000 effectives;</text>
  <text x="480" y="122" text-anchor="middle" fill="currentColor">enlistments expire yearly</text>

  <!-- row: money -->
  <text x="24" y="164" fill="currentColor" font-weight="bold">Money</text>
  <text x="250" y="158" text-anchor="middle" fill="currentColor">the empire's taxes</text>
  <text x="250" y="174" text-anchor="middle" fill="currentColor">and borrowing power</text>
  <text x="480" y="158" text-anchor="middle" fill="currentColor">no power to tax;</text>
  <text x="480" y="174" text-anchor="middle" fill="currentColor">paper money depreciating</text>

  <!-- row: people -->
  <text x="24" y="216" fill="currentColor" font-weight="bold">People</text>
  <text x="250" y="216" text-anchor="middle" fill="currentColor">&#8776;8,000,000</text>
  <text x="480" y="216" text-anchor="middle" fill="currentColor">&#8776;2,500,000 &#8212; 1 in 5 enslaved</text>

  <!-- the one rebel asset -->
  <rect x="24" y="252" width="572" height="64" rx="6" fill="#e2903a" opacity="0.12"/>
  <rect x="24" y="252" width="572" height="64" rx="6" fill="none" stroke="#e2903a"/>
  <text x="310" y="274" text-anchor="middle" fill="#e2903a" font-weight="bold">The one rebel asset: space</text>
  <text x="310" y="292" text-anchor="middle" fill="currentColor">3,000 miles of ocean between Britain and the war; a theater the size of a continent;</text>
  <text x="310" y="308" text-anchor="middle" fill="currentColor">no capital whose capture ends the rebellion</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 350" font-family="system-ui, sans-serif" font-size="11">
  <text x="24" y="20" font-weight="bold" font-size="13" fill="currentColor">The ten crucial days, Dec 25, 1776 &#8211; Jan 3, 1777</text>

  <!-- legend: British outposts -->
  <circle cx="424" cy="37" r="6" fill="none" stroke="#4c8dd6" stroke-width="1.5"/>
  <text x="436" y="41" fill="#4c8dd6">British outpost, Dec 1776</text>

  <!-- region labels -->
  <text x="70" y="300" fill="currentColor" opacity="0.55" letter-spacing="2">PENNSYLVANIA</text>
  <text x="300" y="62" fill="currentColor" opacity="0.55" letter-spacing="2">NEW JERSEY</text>
  <text x="166" y="60" text-anchor="end" fill="currentColor" opacity="0.55">Delaware River</text>

  <!-- the Delaware -->
  <path d="M175,28 C185,90 205,150 235,205 C250,232 258,268 258,330" fill="none" stroke="currentColor" stroke-width="2" opacity="0.55"/>

  <!-- main crossing: McConkey's Ferry -->
  <text x="142" y="100" text-anchor="end" fill="currentColor">Dec 25: main column,</text>
  <text x="142" y="114" text-anchor="end" fill="currentColor">2,400 men, 18 guns</text>
  <line x1="150" y1="112" x2="216" y2="126" stroke="#e2903a" stroke-width="2.5"/>
  <polygon points="226,128 213,120 211,131" fill="#e2903a"/>

  <!-- supporting crossings, stopped -->
  <text x="182" y="200" text-anchor="end" fill="currentColor" opacity="0.7">Ewing: stopped by ice</text>
  <line x1="190" y1="204" x2="228" y2="209" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.5"/>
  <text x="205" y="262" text-anchor="end" fill="currentColor" opacity="0.7">Cadwalader: stopped by ice</text>
  <line x1="212" y1="266" x2="250" y2="270" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.5"/>

  <!-- night march to Trenton -->
  <path d="M222,132 C230,160 238,183 245,203" fill="none" stroke="#e2903a" stroke-width="2"/>
  <polygon points="247,213 239,203 251,201" fill="#e2903a"/>
  <text x="214" y="172" text-anchor="end" fill="currentColor">9 miles in the storm</text>

  <!-- Trenton -->
  <circle cx="248" cy="218" r="4" fill="#e2903a"/>
  <circle cx="248" cy="218" r="8" fill="none" stroke="#4c8dd6" stroke-width="1.5"/>
  <text x="262" y="222" fill="currentColor" font-weight="bold">Trenton, Dec 26</text>

  <!-- Assunpink -->
  <line x1="250" y1="244" x2="296" y2="256" stroke="currentColor" stroke-width="2" opacity="0.5"/>
  <text x="304" y="260" fill="currentColor">Assunpink Creek: held Jan 2</text>

  <!-- night flank march to Princeton -->
  <path d="M258,212 C300,196 345,180 380,167" fill="none" stroke="#e2903a" stroke-width="2" stroke-dasharray="5 4"/>
  <polygon points="391,163 379,161 382,172" fill="#e2903a"/>
  <text x="345" y="200" text-anchor="middle" fill="currentColor">night march, Jan 2&#8211;3</text>

  <!-- Princeton -->
  <circle cx="397" cy="160" r="4" fill="#e2903a"/>
  <circle cx="397" cy="160" r="8" fill="none" stroke="#4c8dd6" stroke-width="1.5"/>
  <text x="410" y="156" fill="currentColor" font-weight="bold">Princeton, Jan 3</text>

  <!-- New Brunswick and New York -->
  <circle cx="500" cy="110" r="6" fill="none" stroke="#4c8dd6" stroke-width="1.5"/>
  <text x="510" y="106" fill="#4c8dd6">New Brunswick</text>
  <line x1="505" y1="104" x2="552" y2="72" stroke="currentColor" stroke-dasharray="3 3" opacity="0.4"/>
  <text x="558" y="64" text-anchor="middle" fill="currentColor" opacity="0.55">toward New York</text>

  <!-- the contraction strip -->
  <line x1="24" y1="316" x2="596" y2="316" stroke="currentColor" opacity="0.2"/>
  <line x1="250" y1="330" x2="512" y2="330" stroke="#4c8dd6" stroke-width="2.5"/>
  <polygon points="522,330 510,324 510,336" fill="#4c8dd6"/>
  <text x="385" y="346" text-anchor="middle" fill="currentColor">Jan 1777: the winter line falls back &#8776;60 miles, to New Brunswick and Amboy</text>
</svg>

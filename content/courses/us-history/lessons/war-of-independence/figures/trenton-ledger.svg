<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300" font-family="system-ui, sans-serif" font-size="12">
  <text x="24" y="26" font-weight="bold" font-size="13" fill="currentColor">Trenton, December 26, 1776: the ledger</text>
  <text x="24" y="44" fill="currentColor" opacity="0.55" font-size="11">2,400 Americans attacked Rall's &#8776;1,500 in the snowstorm; one scale, 1 px = 5 men (smallest bars at minimum width)</text>

  <!-- Hessian losses -->
  <text x="24" y="76" fill="#4c8dd6" font-weight="bold">Hessian losses</text>
  <rect x="190" y="86" width="180" height="14" fill="#4c8dd6"/>
  <text x="180" y="97" text-anchor="end" fill="currentColor">captured</text>
  <text x="378" y="97" fill="currentColor">&#8776;900</text>
  <rect x="190" y="108" width="17" height="14" fill="#4c8dd6" opacity="0.6"/>
  <text x="180" y="119" text-anchor="end" fill="currentColor">wounded</text>
  <text x="215" y="119" fill="currentColor">83</text>
  <rect x="190" y="130" width="5" height="14" fill="#4c8dd6" opacity="0.6"/>
  <text x="180" y="141" text-anchor="end" fill="currentColor">killed</text>
  <text x="203" y="141" fill="currentColor">22, Col. Rall among them</text>

  <!-- American losses -->
  <text x="24" y="180" fill="#e2903a" font-weight="bold">American losses</text>
  <text x="180" y="201" text-anchor="end" fill="currentColor">killed by enemy fire</text>
  <text x="190" y="201" fill="currentColor">0</text>
  <rect x="190" y="212" width="2" height="14" fill="#e2903a"/>
  <text x="180" y="223" text-anchor="end" fill="currentColor">dead of exposure</text>
  <text x="200" y="223" fill="currentColor">2, on the march</text>
  <rect x="190" y="234" width="2" height="14" fill="#e2903a"/>
  <text x="180" y="245" text-anchor="end" fill="currentColor">wounded</text>
  <text x="200" y="245" fill="currentColor">&#8776;5, Lt. James Monroe among them</text>

  <!-- tally -->
  <line x1="24" y1="264" x2="596" y2="264" stroke="currentColor" opacity="0.35"/>
  <text x="310" y="286" text-anchor="middle" fill="currentColor" font-weight="bold">The exchange: &#8776;900 prisoners for 2 dead &#8212; neither killed by the enemy</text>
</svg>

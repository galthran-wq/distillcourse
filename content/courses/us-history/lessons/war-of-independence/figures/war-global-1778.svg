<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 310" font-family="system-ui, sans-serif" font-size="12">
  <!-- left panel: before -->
  <text x="150" y="28" text-anchor="middle" font-weight="bold" font-size="13" fill="currentColor">1775&#8211;1777</text>
  <text x="150" y="44" text-anchor="middle" fill="currentColor" opacity="0.55" font-size="11">one rebellion, one theater</text>
  <rect x="35" y="128" width="90" height="36" rx="5" fill="none" stroke="#4c8dd6" stroke-width="1.5"/>
  <text x="80" y="150" text-anchor="middle" fill="#4c8dd6" font-weight="bold">Britain</text>
  <line x1="125" y1="146" x2="155" y2="146" stroke="currentColor" stroke-width="1.5"/>
  <polygon points="163,146 153,141 153,151" fill="currentColor"/>
  <rect x="163" y="128" width="102" height="36" rx="5" fill="#e2903a" opacity="0.15"/>
  <rect x="163" y="128" width="102" height="36" rx="5" fill="none" stroke="#e2903a"/>
  <text x="214" y="150" text-anchor="middle" fill="#e2903a" font-weight="bold">America</text>

  <!-- center arrow -->
  <line x1="283" y1="146" x2="318" y2="146" stroke="currentColor" stroke-width="2.5"/>
  <polygon points="328,146 316,140 316,152" fill="currentColor"/>
  <text x="305" y="118" text-anchor="middle" fill="currentColor" font-size="11">Feb 1778:</text>
  <text x="305" y="132" text-anchor="middle" fill="currentColor" font-size="11">the French</text>
  <text x="305" y="176" text-anchor="middle" fill="currentColor" font-size="11">treaties</text>

  <!-- right panel: after -->
  <text x="484" y="28" text-anchor="middle" font-weight="bold" font-size="13" fill="currentColor">1778&#8211;1783</text>
  <text x="484" y="44" text-anchor="middle" fill="currentColor" opacity="0.55" font-size="11">a world war on four fronts</text>
  <rect x="344" y="128" width="86" height="36" rx="5" fill="none" stroke="#4c8dd6" stroke-width="1.5"/>
  <text x="387" y="150" text-anchor="middle" fill="#4c8dd6" font-weight="bold">Britain</text>

  <line x1="430" y1="140" x2="490" y2="72" stroke="currentColor" stroke-width="1.5"/>
  <line x1="430" y1="144" x2="490" y2="122" stroke="currentColor" stroke-width="1.5"/>
  <line x1="430" y1="148" x2="490" y2="172" stroke="currentColor" stroke-width="1.5"/>
  <line x1="430" y1="152" x2="490" y2="222" stroke="currentColor" stroke-width="1.5"/>

  <rect x="490" y="52" width="138" height="40" rx="5" fill="#e2903a" opacity="0.15"/>
  <rect x="490" y="52" width="138" height="40" rx="5" fill="none" stroke="#e2903a"/>
  <text x="559" y="69" text-anchor="middle" fill="#e2903a" font-weight="bold">America</text>
  <text x="559" y="85" text-anchor="middle" fill="currentColor" font-size="11">+ France 1778</text>

  <rect x="490" y="102" width="138" height="40" rx="5" fill="none" stroke="currentColor" opacity="0.7"/>
  <text x="559" y="119" text-anchor="middle" fill="currentColor" font-weight="bold">Caribbean</text>
  <text x="559" y="135" text-anchor="middle" fill="currentColor" font-size="11">the sugar islands</text>

  <rect x="490" y="152" width="138" height="40" rx="5" fill="none" stroke="currentColor" opacity="0.7"/>
  <text x="559" y="169" text-anchor="middle" fill="currentColor" font-weight="bold">Gibraltar</text>
  <text x="559" y="185" text-anchor="middle" fill="currentColor" font-size="11">+ Spain 1779</text>

  <rect x="490" y="202" width="138" height="40" rx="5" fill="none" stroke="currentColor" opacity="0.7"/>
  <text x="559" y="219" text-anchor="middle" fill="currentColor" font-weight="bold">India &#38; trade</text>
  <text x="559" y="235" text-anchor="middle" fill="currentColor" font-size="11">+ Netherlands 1780</text>

  <!-- payoff -->
  <line x1="24" y1="262" x2="616" y2="262" stroke="currentColor" opacity="0.35"/>
  <text x="320" y="284" text-anchor="middle" fill="currentColor">A navy obliged to be strong everywhere lost local command of the sea once:</text>
  <text x="320" y="300" text-anchor="middle" fill="currentColor" font-weight="bold">the Chesapeake, September&#8211;October 1781</text>
</svg>

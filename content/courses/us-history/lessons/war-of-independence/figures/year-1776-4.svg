<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 320" font-family="system-ui, sans-serif" font-size="12">
  <text x="70" y="30" font-weight="bold" font-size="13" fill="currentColor">4 &#183; The crossing (December 25&#8211;26, 1776)</text>

  <!-- axes -->
  <line x1="70" y1="250" x2="580" y2="250" stroke="currentColor"/>
  <line x1="70" y1="60" x2="70" y2="250" stroke="currentColor"/>
  <line x1="70" y1="98" x2="580" y2="98" stroke="currentColor" stroke-dasharray="3 3" opacity="0.3"/>
  <line x1="70" y1="174" x2="580" y2="174" stroke="currentColor" stroke-dasharray="3 3" opacity="0.3"/>
  <text x="64" y="102" text-anchor="end" fill="currentColor" opacity="0.55">20,000</text>
  <text x="64" y="178" text-anchor="end" fill="currentColor" opacity="0.55">10,000</text>
  <text x="64" y="254" text-anchor="end" fill="currentColor" opacity="0.55">0</text>

  <!-- month ticks -->
  <text x="70" y="268" text-anchor="middle" fill="currentColor" opacity="0.55">J</text>
  <text x="109" y="268" text-anchor="middle" fill="currentColor" opacity="0.55">F</text>
  <text x="148" y="268" text-anchor="middle" fill="currentColor" opacity="0.55">M</text>
  <text x="188" y="268" text-anchor="middle" fill="currentColor" opacity="0.55">A</text>
  <text x="227" y="268" text-anchor="middle" fill="currentColor" opacity="0.55">M</text>
  <text x="266" y="268" text-anchor="middle" fill="currentColor" opacity="0.55">J</text>
  <text x="305" y="268" text-anchor="middle" fill="currentColor" opacity="0.55">J</text>
  <text x="344" y="268" text-anchor="middle" fill="currentColor" opacity="0.55">A</text>
  <text x="384" y="268" text-anchor="middle" fill="currentColor" opacity="0.55">S</text>
  <text x="423" y="268" text-anchor="middle" fill="currentColor" opacity="0.55">O</text>
  <text x="462" y="268" text-anchor="middle" fill="currentColor" opacity="0.55">N</text>
  <text x="501" y="268" text-anchor="middle" fill="currentColor" opacity="0.55">D</text>
  <text x="540" y="268" text-anchor="middle" fill="currentColor" opacity="0.55">J</text>
  <text x="540" y="282" text-anchor="middle" fill="currentColor" opacity="0.55" font-size="10">'77</text>
  <text x="70" y="298" fill="currentColor" opacity="0.55" font-size="11">Washington's main army, effectives (approximate)</text>

  <!-- enlistment clock (emphasized this frame) -->
  <line x1="540" y1="55" x2="540" y2="250" stroke="#e2903a" stroke-dasharray="4 3"/>
  <text x="534" y="50" text-anchor="end" fill="#e2903a" font-size="11" font-weight="bold">Dec 31:</text>
  <text x="534" y="64" text-anchor="end" fill="#e2903a" font-size="11" font-weight="bold">enlistments expire</text>

  <!-- strength curve -->
  <polyline points="70,128 168,128 266,106 378,98 402,128 482,197 524,227" fill="none" stroke="#e2903a" stroke-width="2.5"/>
  <circle cx="168" cy="128" r="4" fill="#e2903a" opacity="0.45"/>
  <text x="176" y="112" fill="currentColor" opacity="0.45">Mar 17: Howe evacuates Boston</text>
  <circle cx="378" cy="98" r="4" fill="#e2903a" opacity="0.45"/>
  <text x="340" y="64" text-anchor="middle" fill="currentColor" opacity="0.45">Aug 27: Long Island lost;</text>
  <text x="340" y="78" text-anchor="middle" fill="currentColor" opacity="0.45">Aug 29&#8211;30, 9,000 escape by night</text>
  <circle cx="482" cy="197" r="4" fill="#e2903a" opacity="0.45"/>
  <text x="470" y="170" text-anchor="end" fill="currentColor" opacity="0.45">Nov 16: Fort Washington,</text>
  <text x="470" y="184" text-anchor="end" fill="currentColor" opacity="0.45">&#8776;2,800 captured</text>
  <circle cx="530" cy="227" r="5" fill="#e2903a"/>
  <text x="520" y="209" text-anchor="end" fill="currentColor">Dec 25&#8211;26: 2,400 cross the Delaware</text>
  <text x="520" y="223" text-anchor="end" fill="currentColor">with six days on the clock</text>
</svg>

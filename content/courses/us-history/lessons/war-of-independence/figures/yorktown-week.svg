<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" font-family="system-ui, sans-serif" font-size="11">
  <text x="24" y="24" font-weight="bold" font-size="13" fill="currentColor">Yorktown, autumn 1781: the window of French sea power</text>

  <!-- shaded window: Aug 30 to Oct 19 -->
  <rect x="92" y="120" width="415" height="60" fill="#e2903a" opacity="0.12"/>
  <text x="300" y="113" text-anchor="middle" fill="#e2903a" font-size="11">the French fleet holds the bay &#8212; Cornwallis sealed off from the sea</text>

  <!-- axis -->
  <line x1="50" y1="150" x2="600" y2="150" stroke="currentColor" stroke-width="1.5"/>
  <line x1="108" y1="146" x2="108" y2="154" stroke="currentColor"/>
  <text x="108" y="196" text-anchor="middle" fill="currentColor" opacity="0.55">Sept 1</text>
  <line x1="357" y1="146" x2="357" y2="154" stroke="currentColor"/>
  <text x="357" y="196" text-anchor="middle" fill="currentColor" opacity="0.55">Oct 1</text>

  <!-- Aug 30 -->
  <circle cx="92" cy="150" r="4" fill="#e2903a"/>
  <text x="92" y="216" text-anchor="middle" fill="currentColor">Aug 30: de Grasse anchors &#8212;</text>
  <text x="92" y="230" text-anchor="middle" fill="currentColor">28 ships of the line, 3,000 troops</text>

  <!-- Sep 5 -->
  <circle cx="141" cy="150" r="4" fill="#e2903a"/>
  <text x="150" y="58" text-anchor="middle" fill="currentColor">Sept 5: Battle of the Capes &#8212;</text>
  <text x="150" y="72" text-anchor="middle" fill="currentColor">24 French vs 19 British ships of the line;</text>
  <text x="150" y="86" text-anchor="middle" fill="currentColor">Graves turns back to New York</text>
  <line x1="141" y1="146" x2="141" y2="92" stroke="currentColor" stroke-dasharray="2 3" opacity="0.5"/>

  <!-- Sep 28 -->
  <circle cx="332" cy="150" r="4" fill="currentColor"/>
  <text x="332" y="216" text-anchor="middle" fill="currentColor">Sept 28: the siege begins &#8212;</text>
  <text x="332" y="230" text-anchor="middle" fill="currentColor">&#8776;19,000 allies vs &#8776;8,000</text>

  <!-- Oct 14 -->
  <circle cx="465" cy="150" r="4" fill="currentColor"/>
  <text x="440" y="58" text-anchor="middle" fill="currentColor">Oct 14: redoubts</text>
  <text x="440" y="72" text-anchor="middle" fill="currentColor">9 and 10 stormed</text>
  <line x1="465" y1="146" x2="465" y2="78" stroke="currentColor" stroke-dasharray="2 3" opacity="0.5"/>

  <!-- Oct 19 -->
  <circle cx="507" cy="150" r="5" fill="#e2903a"/>
  <text x="520" y="216" text-anchor="middle" fill="currentColor">Oct 19: Cornwallis surrenders &#8776;7,500;</text>
  <text x="520" y="230" text-anchor="middle" fill="currentColor">the relief fleet sails from New York</text>

  <!-- Oct 24 -->
  <circle cx="548" cy="150" r="4" fill="currentColor" opacity="0.55"/>
  <text x="566" y="90" text-anchor="middle" fill="currentColor" opacity="0.7">Oct 24: relief arrives &#8212;</text>
  <text x="566" y="104" text-anchor="middle" fill="currentColor" opacity="0.7">five days late</text>
  <line x1="548" y1="146" x2="548" y2="110" stroke="currentColor" stroke-dasharray="2 3" opacity="0.4"/>

  <text x="320" y="264" text-anchor="middle" fill="currentColor" font-weight="bold">Seven weeks without the Royal Navy converted a stalemate into independence</text>
</svg>

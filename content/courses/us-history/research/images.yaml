  shows: 'General Land Office plate ''Territory of Louisiana 1803-1819'' (Map No. 4): the Louisiana Purchase
    hatched in red across the Mississippi-to-Rockies interior, set against the white pre-1803 United States
    east of the Mississippi, Spanish Florida, and ''United States and Spain 1803-1819'' west of the divide;
    the legend gives the boundary only ''as asserted and maintained by the American Government'''
  located: hunted for jeffersonian-america (no pool candidate existed); Wikimedia Commons category 'Maps
    of the Louisiana Purchase', full-resolution file, from NARA catalogue NAID 594889 (RG 49, Old Map File)
    via DocsTeach
  url: https://commons.wikimedia.org/wiki/File:Frank_bond_1912_louisiana_and_the_louisiana_purchase.jpg
  license: public domain (work of the US federal government; Commons PD-USGov / PD-US, published before
    1 January 1931)
  quality: 2500x1636 colour lithograph scan; display lettering and legend crisp, state names small but sharp,
    a faint grey scan band across the legend box
- id: commons-catlin-tenskwatawa-saam-1830
  capture: research/images/commons-catlin-tenskwatawa-saam-1830.jpg
  shows: George Catlin's oil portrait "Ten-sqúat-a-way, The Open Door, Known as The Prophet, Brother
    of Tecumseh" — Tenskwatawa painted from life about 1830, in turban, fur robe and silver ornaments,
    raising the "medicine fire" staff and holding the sacred string of beads, the objects of the
    revitalization preaching that supplied the religious half of the Shawnee brothers' confederacy
  located: Smithsonian American Art Museum, accession 1985.66.279, Gift of Mrs. Joseph Harrison, Jr.;
    part of the Catlin Indian Gallery (SAAM record id 4301). Museum scan via Wikimedia Commons
    (File:Ten-sqúat-a-way.jpg), pixel-identical in dimensions to SAAM's own high-resolution master, and
    checked against the museum's delivery copy before use. Hunted for jeffersonian-america (writer
    handoff tenskwatawa-catlin-1831), which had no pool candidate. SAAM dates the painting 1830 and
    suggests Fort Leavenworth as the place of sitting; Commons gives 1830–1832 — the "1831" in the
    lesson's file stem is the writer's approximation
  url: https://commons.wikimedia.org/wiki/File:Ten-sq%C3%BAat-a-way.jpg
  license: CC0 (Smithsonian Open Access dedication on the museum's photograph); the 1830 painting is
    itself public domain (PD-old / PD-US-expired; Catlin died 1872)
  quality: source 2006x2437 JPEG (5.4 MB), captured at full size; whole canvas, no frame, no watermark
    and no page furniture, good colour, brushwork and canvas weave resolved
- id: commons-laclotte-battle-of-new-orleans-1815
  capture: research/images/commons-laclotte-battle-of-new-orleans-1815.jpg
  shows: Jean Hyacinthe de Laclotte, 'Battle of New Orleans' (1815) — aerial panorama from across the
    Mississippi showing Jackson's earthwork running from the river to the cypress swamp, the American
    line behind it under the flag, and the massed British columns advancing in ordered blocks across
    the open field with their dead scattered in front; painted by a Louisiana Militia participant from
    sketches made on the field
  located: New Orleans Museum of Art, accession 65.7 (gift of Edgar William and Bernice Chrysler Garbisch);
    hunted for the jeffersonian-america lesson — the January 8, 1815 geometry behind the 2,000-to-70 casualty
    figure
  url: https://upload.wikimedia.org/wikipedia/commons/1/15/Battle_of_New_Orleans%2C_Jean_Hyacinthe_de_Laclotte.jpg
  license: public domain (artist d. 1829; published pre-1931; Commons PD-old-100-expired / PD-US-expired)
  quality: 2000x1611 JPEG museum photograph, sharp enough to resolve individual figures on the parapet;
    dark storm sky occupies the upper third and is worth cropping away for use
- id: ia-american-scenery-lockport-erie-canal-1839
  capture: research/images/ia-american-scenery-lockport-erie-canal-1839.jpg
  shows: 'W. H. Bartlett, ''Lockport, Erie Canal'' (1839), engraved by W. Tombleson — the
    canal working: a lock chamber of the Lockport flight with lockmen leaning on the balance
    beams to close the mitred gates, the towpath crossing above them, boats in the upper
    reach, and the Deep Cut driven through solid rock toward Lake Erie under a timber trestle;
    crated freight on the wharf billed OHIO, ROME and BUFFALO'
  located: N. P. Willis, American Scenery, vol. 1 (London: George Virtue, 1840), plate facing
    p. 110; Internet Archive scan leaf 339 of the Getty Research Institute copy; hunted for
    the market-revolution lesson — the physical infrastructure behind the tidewater-tonnage
    chart. Wikimedia Commons carries only a 656x432 hand-coloured rescan
    (File:Lockport bartlett color.jpg), too small to use
  url: https://archive.org/details/americansceneryo01will
  license: public domain (plate published 1839; artist d. 1854, engraver d. 1872)
  quality: 2488x3268 full-page leaf, scanned sideways — the plate itself occupies
    2482x1611 after rotating 90 degrees clockwise and cropping; sharp enough that the
    crate lettering and the lockmen's faces resolve
- id: saam-peale-artist-in-his-museum-1822
  capture: research/images/saam-peale-artist-in-his-museum-1822.jpg
  shows: Charles Willson Peale, 'The Artist in His Museum' (1822) — the eighty-one-year-old proprietor lifting the
    curtain on the Long Room of his Philadelphia museum: ranked glass cases of mounted birds, his Revolutionary

# Index of the captured real-image pool for the US History course.
# Every file under research/images/ has exactly one entry here; the source is
# never re-read. Captures are candidates — a lesson uses one only if its brief
# plans it as a `source:` figure, and figure-artist crops/fits/credits it then.
#
# Dedup notes (July 2026):
#   - yawp-wounded-knee-mass-grave DELETED: same Northwestern Photo Co.
#     photograph as mitushist-wounded-knee-burial (kept — 1600px, wider frame,
#     LOC provenance).
#   - milestone-13th-amendment-resolution DELETED: same artefact class as
#     loc-lincoln-13th-amendment-joint-resolution (kept — 1598x2127 vs 500px).
#   - Two reader candidates were never captured to disk and are NOT indexed:
#     bcf-charleston-mercury-broadside, foner-recon-worse-than-slavery-nast-1874.
#     Re-fetch from Wikimedia Commons if a brief needs them.

images:
  # ---- The American Yawp ----
  - id: yawp-cantino-planisphere
    capture: research/images/yawp-cantino-planisphere.png
    shows: "Cantino planisphere (1502): early Portuguese world map with the Tordesillas line and the barely-charted American coast — evidence of what Europeans knew and did not know in 1502"
    located: "American Yawp Ch.1/Ch.2, European exploration section"
    url: "http://www.americanyawp.com/text/wp-content/uploads/Cantino_planisphere_1502-1000x469.jpg (Biblioteca Estense, Modena, via Wikimedia)"
    license: "public domain (pre-1928 manuscript)"
    quality: "1000x469, compass roses and coastal detail legible"

  - id: yawp-gordon-scourged-back
    capture: research/images/yawp-gordon-scourged-back.png
    shows: "Brady-studio 1863 carte-de-visite of 'Gordon', formerly enslaved, back covered in whip scars — itself an 1863 abolitionist evidentiary artifact"
    located: "American Yawp Ch.11 (The Cotton Revolution), final figure, climax of the auction-image sequence"
    url: "http://www.americanyawp.com/text/wp-content/uploads/Gordon_scourged_back_NPG_1863-500x834.jpg (NPG, Smithsonian)"
    license: "public domain (1863 photograph)"
    quality: "500x834 sepia scan, card border and 'Brady/Washington' imprint visible"

  - id: yawp-fort-sumter-telegram
    capture: research/images/yawp-fort-sumter-telegram.png
    shows: "Maj. Anderson's actual pasted-tape telegram of April 18, 1861 reporting Fort Sumter's surrender — the first official document of the Civil War"
    located: "American Yawp Ch.14, opening of 'A War for Union 1861-1863'"
    url: "http://www.americanyawp.com/text/wp-content/uploads/Fort_Sumter_telegram-1000x1260.jpg (National Archives)"
    license: "public domain (US federal record)"
    quality: "1000x1260, tape strips and period lettering legible despite staining"

  - id: yawp-riis-five-cents-a-spot
    capture: research/images/yawp-riis-five-cents-a-spot.png
    shows: "Jacob Riis flash photograph 'Five Cents a Spot' (c.1890): immigrant lodgers crowded into a Lower East Side tenement room"
    located: "American Yawp Ch.16 (Capital and Labor) tenement/inequality section; also used with Ch.18"
    url: "http://www.americanyawp.com/text/wp-content/uploads/18_Riis_Five_Cents-1000x562.jpg (Museum of the City of New York)"
    license: "public domain (pre-1928 photograph)"
    quality: "1000x562, good contrast, figures and bedding legible"

  - id: yawp-migrant-mother
    capture: research/images/yawp-migrant-mother.png
    shows: "Dorothea Lange, 'Migrant Mother' (Nipomo, CA, 1936) — the canonical FSA photograph of Depression-era migration"
    located: "American Yawp Ch.23, 'Migration and the Great Depression' section"
    url: "http://www.americanyawp.com/text/wp-content/uploads/Lange-Migrant-Mother-e1408474615332.jpg (LOC FSA collection)"
    license: "public domain (US government work)"
    quality: "1100x1399, excellent tonal range"

  - id: yawp-march-on-washington
    capture: research/images/yawp-march-on-washington.png
    shows: "MLK and civil rights and Jewish leaders arm-in-arm at the March on Washington, Aug 28 1963, 'We March for Jobs for All Now!' placards legible"
    located: "American Yawp Ch.27, Civil Rights Movement section"
    url: "http://www.americanyawp.com/text/wp-content/uploads/March_on_washington_Aug_28_1963-1000x792.jpg (US National Archives)"
    license: "public domain (US government photograph)"
    quality: "1000x792, sharp, placard text and faces legible"

  - id: yawp-selma-montgomery-march
    capture: research/images/yawp-selma-montgomery-march.png
    shows: "1965 Selma-to-Montgomery marchers, including children with American flags, passing a small-town Coca-Cola storefront"
    located: "American Yawp Ch.27, Civil Rights Movement section, opening figure"
    url: "http://www.americanyawp.com/text/wp-content/uploads/selma1-1000x500.jpg"
    license: "public domain / rights holder not stated on source page (era news photograph)"
    quality: "1000x500, storefront text and faces legible"


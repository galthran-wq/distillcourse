- id: commons-clay-the-times-1837-loc
  capture: research/images/commons-clay-the-times-1837-loc.jpg
  shows: Edward Williams Clay, "The Times" (1837) — the canonical caricature of the Panic of 1837, a
    New York street in which the Custom House stands idle behind "All Bonds must be paid in Specie"
    while the Mechanics Bank next door is mobbed under "No Specie payments made here"; a pawnbroker
    ("Shylock Graspall") and a liquor store thrive, a sheriff's office and an attorney do business, a
    manufactory is closed, the harbour's shipping lies idle, a mother sprawls with her infant on a
    straw mat and a widow begs from a stout banker, while handbills offer money to loan at 7 percent
    a month and specie at 15 percent premium and Jackson's hat, spectacles and pipe radiate "GLORY"
    over the whole scene
  located: Library of Congress, Prints and Photographs Division, American cartoon print filing series,
    digital id ds.04507, LCCN 2008661304; printed and published by H. R. Robinson, 52 Cortlandt Street,
    New York, signed "Clay fec.", deposited for copyright 8 July 1837 (Reilly, American Political Prints
    1766–1876, entry 1837-8). Hunted for the market-revolution lesson — the credit section's artifact.
    Taken from the Wikimedia Commons mirror of the LoC master because loc.gov is behind a Cloudflare
    challenge; the alternate Commons file "The times panic 1837.jpg" (5255×3639) is the older b&w film
    copy negative cph.3a11390 and is visibly flatter — this is the better of the two impressions
  url: https://commons.wikimedia.org/wiki/File:The_times_LCCN2008661304.jpg (original
    https://upload.wikimedia.org/wikipedia/commons/b/be/The_times_LCCN2008661304.jpg, 7850×5470)
  license: public domain — LoC states "No known restrictions on publication"; lithograph published 1837
  quality: downscaled to 4000x2787 from the 7850x5470 master to fit the 6 MB pool budget; sign lettering
    down to "No Specie payments made here" and the "52 Courtlandt Street New York" imprint all legible

- id: si-morse-tape-1844
  capture: research/images/si-morse-tape-1844.jpg
  shows: Samuel Morse's paper register tape of "What hath God wrought" — embossed American Morse
    dots and dashes with the letter for each group written beneath in Morse's hand, and his ink
    inscription and signature across the top; the 25 May 1844 strip telegraphed back from Baltimore
    to Washington the morning after the inaugural transmission (the 24 May Washington original is
    in the Library of Congress, whose scan does not show the embossing)
  located: National Museum of American History, catalogue EM.001028 (accession 65555), Smithsonian
    Open Access image NMAH-JN2019-02030
  url: https://www.si.edu/object/what-hath-god-wrought-telegraph-message:nmah_713485 (file via
    https://ids.si.edu/ids/download?id=NMAH-JN2019-02030.jpg)
  license: CC0 1.0, Smithsonian Open Access (1844 artefact, public domain)
  quality: 11098x4846 studio photograph on white; code impressions, pencil letters and the ink
    inscription all legible at native resolution

source: "Portrait of Union General David Hunter, studio photograph, c. 1860s (Library of Congress Civil War Collection)"
covers: >
  Chapter 6 "'Self-Emancipation'" of Freedom National (shard 2), section
  "General Hunter's Two Proclamations" — Hunter's April 13, 1862 emancipation
  order for Fort Pulaski/Cockspur Island (which stood) and his broader May 9,
  1862 proclamation abolishing slavery in South Carolina, Georgia, and
  Florida (which Lincoln revoked on May 19, 1862).

source: "Portrait of John C. Frémont, oval studio photograph, c. 1856 (California State Library)"
covers: >
  Chapter 5 "The Border States" of Freedom National (shard 2) — Frémont
  commanded the Department of the West in Missouri and issued the August 30,
  1861 martial-law/emancipation proclamation that Lincoln forced him to
  modify, then revoked him from command that fall. Central figure of the
  chapter's "Frémont and Civilian Rule" section.
url: "https://commons.wikimedia.org/wiki/File:John_Charles_Fremont_Oval.png (direct file: https://upload.wikimedia.org/wikipedia/commons/b/b3/John_Charles_Fremont_Oval.png)"
fetched_via: WebFetch (resolved Commons page), then curl via `npm run image -- capture`
notes: >
  Public domain (California State Library, author unknown, 1856; PD-US).
  Original capture was 4099x5660 (28.6MB), ran `image fit` twice down to
  900x1243 (1.6MB) to clear the size budget. Good legibility/contrast; this
  is the standard c.1856 studio portrait used to represent Frémont around the
  time of his 1856 presidential run, a few years before his Civil War
  command — slightly younger-looking than he was in Missouri in 1861, but
  the best free/public-domain photographic likeness available.

source: "\"Contrabands Aboard U.S. Ship Vermont, Port Royal, South Carolina,\" photograph, 1862 (U.S. Government photographer; Metropolitan Museum of Art, accession 2005.100.897)"
covers: >
  Chapter 6 "'Self-Emancipation'" of Freedom National (shard 2), section
  "The Sea Islands" — the November 7, 1861 Union capture of Port Royal, the
  mass flight of Sea Island planters, and the ~11,000 enslaved Sea Islanders
  who became, in Oakes's account, the first large-scale test case of
  "self-emancipation": people who stayed on the land as their owners fled
  and were treated as free by the Union military/Treasury Department months
  before the Emancipation Proclamation.
url: "https://commons.wikimedia.org/wiki/File:Detail_of_Contrabands_Aboard_U.S._Ship_Vermont,_Port_Royal,_South_Carolina_MET_DP254888.jpg (direct file: https://upload.wikimedia.org/wikipedia/commons/b/bd/Detail_of_Contrabands_Aboard_U.S._Ship_Vermont%2C_Port_Royal%2C_South_Carolina_MET_DP254888.jpg)"
fetched_via: WebFetch (resolved Commons page), then curl via `npm run image -- capture`
notes: >
  Public domain (US government work, 1862; PD-US-Gov / PD Mark). 548x548,
  108KB JPEG — this is a cropped "detail" version from the Met; legible but
  modest resolution and square-cropped, so a lesson wanting the full
  original frame (with more of the ship's deck and more people visible)
  would need to source the uncropped Met/LOC scan directly. Authentic period
  photograph, exactly the kind of image a redrawing would flatten into
  generic clip art.

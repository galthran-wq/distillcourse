source: "Portrait photograph of Susie King Taylor, 1902 (Library of Congress, Prints and Photographs Division, LCCN2003653538)"
covers: >
  Chapter 6 "'Self-Emancipation'" of Freedom National (shard 2), section
  "General Hunter's Two Proclamations" — Oakes quotes Susie King Taylor's own
  memoir recalling her escape as a Savannah slave to St. Catherine's/St.
  Simons Island after the fall of Fort Pulaski in April 1862, and her role
  teaching at one of the Sea Island freedpeople's schools.
url: "https://commons.wikimedia.org/wiki/File:Susie_King_Taylor_LCCN2003653538.jpg (direct file: https://upload.wikimedia.org/wikipedia/commons/a/a3/Susie_King_Taylor_LCCN2003653538.jpg)"
fetched_via: WebFetch (resolved Commons page), then curl via `npm run image -- capture`
notes: >
  Public domain (published pre-1931; LOC, no known restrictions). 757x1536,
  138KB JPEG, clean and legible with her signature reproduced beneath the
  portrait. Taken in 1902, four decades after the events the shard narrates
  (she was in her teens/twenties at Port Royal in 1862), so it depicts her
  late in life as the published memoirist she became rather than as a young
  wartime teacher — flag this vintage gap for whoever captions it — but it
  is the standard, best-attested photographic likeness of her.

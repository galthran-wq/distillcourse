source: "Portrait of Alexis de Tocqueville, oil on canvas, by Théodore Chassériau (1850)"
covers: >
  Author portrait — not shard-specific content, but the standard image used to
  identify Tocqueville himself when introducing the source or its author.
url: "https://commons.wikimedia.org/wiki/File:Alexis_de_tocqueville.jpg (direct file: https://upload.wikimedia.org/wikipedia/commons/a/aa/Alexis_de_tocqueville.jpg)"
fetched_via: WebFetch (resolved Commons page to direct file URL), then curl via `npm run image -- capture`
notes: >
  Public domain (artwork from 1850, photographic reproduction of 2D PD
  artwork). Held at the Palace of Versailles (accession MV 7384). 1031x1382px,
  158KB JPEG, good color and resolution, no visible damage/glare. Painted 15
  years after the 1831 American journey and publication of Vol. 1 (1835), so
  it depicts Tocqueville a bit older than he was in America, but it is the
  best-known and most widely reproduced painted portrait of him.

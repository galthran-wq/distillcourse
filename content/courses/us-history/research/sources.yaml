  - title: "Historical Statistics of the United States (Millennial Ed.) + MeasuringWorth + Maddison Project"
    author: "Carter et al. (eds.), Cambridge UP; Officer & Williamson; Bolt & van Zanden (Groningen)"
    url: "https://hsus.cambridge.org/ | https://www.measuringworth.com/ | https://www.rug.nl/ggdc/historicaldevelopment/maddison/"

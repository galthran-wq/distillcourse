# Research canon for the US History course, compiled July 2026 by the
# source-reading swarm. "role" = which modules/lessons the source grounds.
# Image captures referenced by the briefs live in research/images/ and are
# indexed in research/images.yaml.

sources:
  - title: "The American Yawp (2 vols.)"
    author: "J. Locke, B. Wright (eds.), 500+ contributing historians"
    url: "https://www.americanyawp.com/"
    kind: textbook
    role: >
      The narrative spine for every module: 30 chapters, Indigenous America
      (Ch.1) through the Recent Past (Ch.30). CC-BY-SA 4.0, so its structure,
      statistics, and images are freely reusable. Companion Primary Source
      Reader (americanyawp.com/reader/) supplies one document set per chapter.
    access: >
      Free, full text fetched chapter by chapter. The live site is the
      archived First Edition; the Stanford UP Second Edition retitles a few
      chapters (The Cotton Revolution = The Old South; The Great Depression =
      The New Deal; The New Era = The Twenties; The Triumph of the Right =
      The Rise of the Right).

  - title: "Give Me Liberty! An American History, 8th ed. (+ Voices of Freedom reader)"
    author: "E. Foner, K. DuVal, L. McGirr"
    url: "https://seagull.wwnorton.com/givemeliberty/toc"
    kind: textbook
    role: >
      The course's analytic lens: freedom's meanings, material conditions, and
      boundaries, applied era by era. Its paired dominant-view/dissent
      documents (Carnegie vs George, Washington vs Du Bois, Hoover vs FDR,
      Malcolm X vs LBJ) structure several lessons' primary-source
      confrontations.
    access: >
      TOC-only for the 8th-ed. main text (Norton login wall). The companion
      Voices of Freedom Vol. 2 (5th ed., chapters 15-28) was read in full and
      is the verified proxy for chapter emphases; pre-1865 claims rest on
      secondary description only.

  - title: "21H.101 American History to 1865 (Fall 2010)"
    author: "P. Maier, MIT OpenCourseWare"
    url: "https://ocw.mit.edu/courses/21h-101-american-history-to-1865-fall-2010/"
    kind: course-syllabus
    role: >
      Pedagogical model for the pre-1865 modules: two-track weeks (narrative +
      primary-document close reading), the Dane family opener, the three-stage
      constitution-making sequence (states, convention, ratification), the
      Fitzhugh/Stowe juxtaposition, and the six-document secession-crisis
      escalation stack.
    access: >
      Free, full: syllabus, readings (all 14 weeks), and assignment prompts
      fetched directly. Dane family tree PDF captured.

  - title: "21H.102 American History Since 1865 (Spring 2018)"
    author: "C. Horan (lecture notes by C. Lee), MIT OpenCourseWare"
    url: "https://ocw.mit.edu/courses/21h-102-american-history-since-1865-spring-2018/"
    kind: course-syllabus
    role: >
      Post-1865 interpretive frames: Trachtenberg's incorporation thesis, the
      extermination-or-assimilation framing of Indian policy, Progressivism's
      purity/efficiency dual strands, the long-civil-rights-movement thesis,
      and the manifesto-stack treatment of late-1960s identity politics.
    access: >
      Full for what OCW publishes: complete 26-session reading list and
      published lecture notes for sessions 2, 5, 6, 8, 9 (Reconstruction,
      Frontier West, Capital/Labor, World Power, Progressive Reform). Units
      4-8 documented at reading-list level only.

  - title: "HIST 119: The Civil War and Reconstruction Era, 1845-1877"
    author: "D. W. Blight, Open Yale Courses (Spring 2008)"
    url: "https://oyc.yale.edu/history/hist-119"
    kind: lecture-course
    role: >
      Depth source for Modules 4-5: the sectional-crisis escalation (L6-11),
      emancipation's zones and agency (L15-16), total war (L19), the
      Reconstruction arc (L20-25), and the Race and Reunion memory thesis
      (L26-27) that grounds the civil-war-memory extra lesson.
    access: >
      Free: all 27 lecture transcripts, audio, and video published. Multiple
      transcripts fetched directly; reading list reconstructed from the
      overview page (syllabus PDF 404s).

  - title: "America's Founding Documents (Charters of Freedom)"
    author: "U.S. National Archives"
    url: "https://www.archives.gov/founding-docs"
    kind: primary-source-archive
    role: >
      The founding module's primary sources: annotated transcripts of the
      Declaration, Constitution, and Bill of Rights; the drafting/ratification
      narrative essays; the original-vs-Stone-engraving preservation story;
      and high-resolution parchment scans (captured).
    access: >
      Free, full. Transcripts, "A History" and "A More Perfect Union" essays,
      and Q&A pages fetched; high-res scans downloaded and resized.

  - title: "The Federalist Papers (Nos. 1-85)"
    author: "A. Hamilton, J. Madison, J. Jay (as Publius)"
    url: "https://avalon.law.yale.edu/subject_menus/fed.asp"
    kind: primary-source
    role: >
      Primary text for ratification-and-bill-of-rights and the federalist-papers
      extra lesson: Nos. 1, 10, 39, 47, 51, 68, 70, 78, 84, 85 verified against
      the full Avalon text. Raw primary source — all framing must come from the
      course.
    access: >
      Free, full: every essay as a separate Avalon HTML page (fed01-fed85).
      The ToC page is a bare index; titles and content verified by fetching
      individual essays.

  - title: "Abraham Lincoln Papers (LOC resource guide + emancipation essay)"
    author: "Library of Congress"
    url: "https://guides.loc.gov/abraham-lincoln-guide"
    kind: primary-source-archive
    role: >
      The emancipation and union-victory lessons' manuscript spine: the
      preliminary Emancipation Proclamation draft, the final lithograph, the
      Gettysburg Nicolay copy, the First and Second Inaugural manuscripts, and
      the 13th Amendment ceremonial copy (all captured). The "Abraham Lincoln
      and Emancipation" essay supplies the narrative beats and quotations.
    access: >
      Full via browser user-agent and Wayback cache (loc.gov 403s plain
      fetchers). NOTE: House Divided and Cooper Union are NOT in this
      collection — use newspaper printings via other sources if needed.

  - title: "Milestone Documents"
    author: "U.S. National Archives"
    url: "https://www.archives.gov/milestone-documents/list"
    kind: primary-source-archive
    role: >
      The course-wide document backbone: 96 canonical documents 1776-1965,
      each with facsimile, background note, and transcript. Grounds document
      set-pieces from Marbury's scorched order through Dred Scott, EO 9066,
      Brown, and the Civil Rights Act (captures in the pool). List currently
      stops at 1965.
    access: >
      Free, full. List page plus ~20 individual document pages fetched;
      remaining entries recorded from the verified list (title + year).

  - title: "Empire of Liberty: A History of the Early Republic, 1789-1815"
    author: "G. S. Wood (Oxford History of the United States, 2009)"
    url: "https://academic.oup.com/book/47392"
    kind: monograph
    role: >
      Depth source for Module 3's first two lessons: the monarchical republic,
      Hamilton's program, the party split, 1798-1800, Marbury's two-step,
      the Louisiana Purchase, the embargo's arithmetic, the War of 1812, plus
      the Cane Ridge / camp-meeting material for religion-and-reform.
    access: >
      Full text read via erenow.org mirror (OUP page is navigation chrome
      only); structure cross-checked against the publisher record. Cite the
      OUP edition; treat the mirror as working copy.

  - title: "Battle Cry of Freedom: The Civil War Era"
    author: "J. M. McPherson (Oxford History of the United States, 1988)"
    url: "https://global.oup.com/academic/product/battle-cry-of-freedom-9780195168952"
    kind: monograph
    role: >
      Depth source for Modules 4-5: the 1850s escalation chapter arc, the
      revolution/counterrevolution framing of 1860-61, contingency at
      Antietam and Atlanta, war finance and the draft riots, and the
      contested-freedom title thesis (both sides sang the same tune).
    access: >
      Summary-based: verified chapter TOC, Wikipedia synthesis, and published
      reviews; full copyrighted text not quoted. Chapter numbering confirmed;
      do not quote prose passages from it without library verification.

  - title: "Reconstruction: America's Unfinished Revolution, 1863-1877 (updated ed.)"
    author: "E. Foner"
    url: "https://www.harpercollins.com/products/reconstruction-updated-edition-eric-foner"
    kind: monograph
    role: >
      The authority for Module 5's Reconstruction lessons: freedpeople's
      agency as organizing method, the land question (Field Order 15, Stevens's
      confiscation bill), the Klan/enforcement arc, Colfax/Cruikshank, the
      Panic of 1873, and the unfinished-revolution thesis.
    access: >
      Summary-based: LOC-verified chapter TOC plus sourced reviews (McFeely
      NYT 1988, The Nation 2019) and reading guides. Full text not accessed;
      do not quote prose directly.

  - title: "Freedom from Fear: The American People in Depression and War, 1929-1945"
    author: "D. M. Kennedy (Oxford History of the United States, 1999)"
    url: "https://global.oup.com/academic/product/freedom-from-fear-9780195144031"
    kind: monograph
    role: >
      Depth source for Module 8: Hoover reassessed, the interregnum banking
      collapse, Hundred Days improvisation, the Long/Coughlin/Townsend
      pressure, court-packing and the 1937 recession, military Keynesianism,
      and the uniquely-privileged-belligerent thesis.
    access: >
      Summary-based: Internet Archive catalog TOC (complete chapter list),
      Wikipedia, Kirkus, and Folsom's critical review (which supplies specific
      statistics). Full text borrow-only; do not quote prose directly.

  - title: "American Panorama: An Atlas of United States History"
    author: "Digital Scholarship Lab, University of Richmond (with Stamen Design)"
    url: "https://dsl.richmond.edu/panorama/"
    kind: digital-atlas
    role: >
      The course's quantitative-spatial evidence (outcome co-data): Forced
      Migration of Enslaved People (cotton-kingdom), Overland Trails
      (manifest-destiny), Foreign-Born Population (immigration), Canals
      (market-revolution), Renewing Inequality and Electing the President
      (later modules). Interface screenshots captured; Stamen images are
      publisher-copyright, teaching use.
    access: >
      Summary-based for the SPA interfaces (client-side React; screenshots
      from Stamen's project write-up), backed by the DH2017 abstract, SSRC
      editor interview, and Blevins's published critique.

  - title: "Mapping Inequality: Redlining in New Deal America"
    author: "R. K. Nelson, LaDale Winling, et al. (DSL Richmond / American Panorama)"
    url: "https://dsl.richmond.edu/panorama/redlining/"
    kind: digital-archive
    role: >
      The redlining extra lesson's entire source base: the HOLC A-D grading
      scheme in the surveyors' own words, the HOLC-vs-FHA correction, the
      Carver Heights and Tacoma D1 case studies, and five captured primary
      documents (Decatur map, area-description form, FHA Kenosha map, Daytona
      Beach non-HOLC map, FHLBB Review article).
    access: >
      Full: essay text, navigation, legend/data model, and the 10,154-polygon
      GeoJSON recovered by reading the site's JS bundle and public data
      endpoint directly. Map/area-description scans are public domain (NARA
      City Survey Files).

  - title: "The Creation of the American Republic, 1776-1787"
    author: "G. S. Wood (UNC Press, 1969; Bancroft Prize 1970)"
    url: "https://uncpress.org/book/9780807847237/the-creation-of-the-american-republic-1776-1787/"
    kind: monograph
    role: >
      The intellectual spine of the roman-blueprint lesson and depth source
      for constitutional-convention and ratification-and-bill-of-rights:
      classical republicanism and civic virtue as the ideology of 1776
      (Ch.I-III), state constitution-making and the shift of sovereignty from
      legislatures to conventions of the people (Ch.IV-IX), the 1780s "vices"
      and republican remedies incl. early judicial-review reasoning (Trevett
      v. Weeden, Ch.X-XI), the Federalist persuasion and Adams's mixed-
      government theory (Ch.XII-XIV), and the "End of Classical Politics"
      thesis (Ch.XV). Present the republican-synthesis thesis as a strong
      interpretation to argue WITH — pair it with the Lockean counter-reading
      (Hayward's Claremont/AEI critique) per the historiographical-lenses
      brief.
    access: >
      Summary-based: verified ToC (publisher/library listings) plus multiple
      substantive secondary accounts (Hayward/AEI essay, New Republic
      retrospective, review essays) with the Ch.XV conclusion quoted across
      them. Full text is controlled-digital-lending only; do not quote prose
      beyond the widely reproduced Ch.II and Ch.XV passages without library
      verification.

  - title: "Ratification: The People Debate the Constitution, 1787-1788"
    author: "P. Maier (Simon & Schuster, 2010)"
    url: "https://www.simonandschuster.com/books/Ratification/Pauline-Maier/9780684868554"
    kind: monograph
    role: >
      Depth source for ratification-and-bill-of-rights (and context for
      federalist-papers): contingency of the whole process (MA 187-168, VA
      89-79, NY 30-27), Article VII's nine-state rule inverting holdout
      leverage, the Massachusetts Compromise as the template, the press skew
      (12 of 90+ papers printed substantial Antifederalist material), South
      Carolina convention malapportionment, the Federalist/Antifederalist
      spectrum-not-binary corrective, and the Epilogue's amendments funnel
      into the Bill of Rights.
    access: >
      Summary-based: archive.org catalog record (chapter list), Klarman's
      page-cited Harvard Law Review essay-review (125 Harv. L. Rev. 544, read
      in full), Rakove's Harvard Magazine review, and the JAR "10 Things"
      piece. Page pointers below chapter level come via Klarman; verify
      before quoting Maier's own prose.

  - title: "What Hath God Wrought: The Transformation of America, 1815-1848"
    author: "D. W. Howe (Oxford History of the United States, 2007; Pulitzer 2008)"
    url: "https://global.oup.com/academic/product/what-hath-god-wrought-9780195392432"
    kind: monograph
    role: >
      Depth source for the early-republic module's later lessons:
      the communications/transportation revolution as the era's engine
      ("overcoming the tyranny of distance", Ch.6 and 17) for
      market-revolution; the Whig-vs-Democrat revision of the "Age of
      Jackson" (Ch.9, 13, 15) and Worcester v. Georgia defied (Ch.11) for
      jacksonian-democracy; Second Great Awakening and postmillennial reform
      (Ch.5, 7-8) and Seneca Falls as the era's hopeful culmination (Ch.20)
      for religion-and-reform; cotton's spread (Ch.4) feeding cotton-kingdom;
      manifest destiny and the Mexican War sharpening the sectional conflict
      (Ch.18-19) for manifest-destiny.
    access: >
      Summary-based: verified LOC table of contents (all 20 chapters +
      Prologue + Finale), publisher page, and ~8 substantive reviews
      (Claremont, FPRI, HNN, others). Full text paywalled; do not quote prose
      without library verification.

  - title: "1776"
    author: "D. McCullough (Simon & Schuster, 2005)"
    url: "https://www.simonandschuster.com/books/1776/David-McCullough/9780743226721"
    kind: monograph
    role: >
      The war-of-independence lesson's narrative spine for 1775-77: George
      III's confidence (Ch.1), the rabble army (Ch.2), Knox's cannon and
      Dorchester Heights (Ch.3), the Long Island disaster and East River
      escape (Ch.4-5), the retreat (Ch.6), and Paine's Crisis, the Delaware
      crossing, Trenton, and Princeton (Ch.7) — contingency stated in
      concrete numbers (59 guns/300 miles/40 days; ~900 Hessians captured
      vs 2 dead of exposure; enlistments expiring Dec 31). McCullough's own
      commentary that Leutze's painting is dramatically true but factually
      wrong grounds a myth-vs-fact source reading.
    access: >
      Summary-based: LOC ToC record, Wikipedia book article, and multiple
      study-guide summaries corroborating scene-level detail. Recent
      copyrighted bestseller — chapter/section pointers only; verify any
      direct quotation against a library copy.

  - title: "A History of the American People"
    author: "P. Johnson (HarperCollins, 1997/1998 1st US ed.)"
    url: "https://www.harpercollins.com/products/a-history-of-the-american-people-paul-johnson"
    kind: monograph
    role: >
      Register reference and colonial-module color: a single-author grand
      narrative in the national-achievement register whose three organizing
      questions (can origins be atoned, can idealism fuse with acquisitiveness,
      was the "City on a Hill" a real model) parallel this course's thesis
      question. Supplies the Winthrop "Citty upon a Hill" framing and Part One
      set pieces (Madeira's Adam and Eve, Ralegh's Irish rehearsal, Barlow's
      Roanoke first-contact account) for new-england-covenant and
      european-empires. Use as an opinionated narrative to quote and test,
      not as a neutral authority; its Preface states its selection method and
      its rejection of academic framing in so many words.
    access: >
      Partial full-text: archive.org PDF of the 1st US edition front matter
      (title page, dedication, full Parts One-Five contents, complete
      Preface, ~16pp of Part One narrative) read directly; Parts Six-Nine
      verified only at metadata level (CDL borrow-only). Quote only from the
      verified front-matter/Part One material.

  # --- Curated canon expansion, July 2026 (second reading swarm) ---

  - title: "Democracy in America (Vol. 1, 1835; Vol. 2, 1840), trans. Henry Reeve"
    author: "A. de Tocqueville"
    url: "https://www.gutenberg.org/ebooks/815"
    kind: primary-source
    role: >
      Its own lesson (tocqueville-democracy) and period evidence across the
      early-republic module: the township set piece (Vol.1 Ch.V), judicial
      review described by a European in 1835 (Ch.VI), political associations
      and the 1831 Philadelphia Free Trade Convention (Ch.XII), tyranny of
      the majority and its breakwaters (Ch.XV-XVI), religion as political
      institution and the circumstances<laws<manners ranking (Ch.XVII), the
      three-races chapter with the Choctaw crossing at Memphis (Ch.XVIII);
      Vol.2's individualism, associations, self-interest rightly understood,
      and soft-despotism arguments. A primary source about 1831-40, not a
      neutral authority.
    access: >
      Free, full: both volumes read complete by the swarm (Gutenberg #815 and
      #816, Reeve translation). Cached at research/texts/tocqueville-vol1.txt
      and tocqueville-vol2.txt (converted locally from Gutenberg HTML; the
      plain-text 816 derivative 404s). Gutenberg's Vol.1 chapter numbering
      runs I-XVIII continuously, one or two off from modern two-part print
      editions — locate passages by heading text, not chapter number.

  - title: "Colonial Origins of the American Constitution: A Documentary History"
    author: "D. S. Lutz (ed.) (Liberty Fund, 1998)"
    url: "https://oll.libertyfund.org/titles/lutz-colonial-origins-of-the-american-constitution-a-documentary-history"
    kind: primary-source-anthology
    role: >
      Documentary spine of Module 1: all 80 colonial foundation documents in
      original spelling with scholarly headnotes — Mayflower Compact from the
      1669 Morton reprint (doc 3), Salem Covenant (doc 5), Oath of a Freeman
      (docs 9/15), Pilgrim Code of Law (doc 20), Massachusetts Body of
      Liberties (doc 22), Providence Agreement (doc 32), Fundamental Orders
      of Connecticut (doc 43), Penn's Charter of Liberties (doc 59), Maryland
      Toleration Act (doc 68), Albany Plan and Articles of Confederation
      (docs 77-78). Grounds new-england-covenant, middle-colonies, and
      colonial-societies with quotable primary text.
    access: >
      Free, full: Liberty Fund PDF (digital-native, clean extraction), read
      cover to cover by the swarm. Cached at
      research/texts/lutz-colonial-origins.pdf and .txt (16,668 lines) with
      .meta.yaml sidecar.

  - title: "The Origins of American Constitutionalism"
    author: "D. S. Lutz (LSU Press, 1988)"
    url: "https://lsupress.org/9780807115060/the-origins-of-american-constitutionalism/"
    kind: monograph
    role: >
      The covenant-to-1787 institutional line in monograph form: foundation
      elements building covenant into constitution, the charter-to-
      constitution conversion, federalism-from-covenant, the 24-of-28
      Declaration grievances sourced to state-constitution preambles, and
      the 1760-1805 citation-frequency study (Bible ~1/3 of citations;
      Montesquieu 8.3%, Blackstone 7.9%, Locke 2.9%). Grounds
      new-england-covenant, roman-blueprint, and constitutional-convention.
    access: >
      Full OCR text obtained by the swarm via a mirror routed through a
      reader proxy (archive.org copy is access-restricted); cached at
      research/texts/lutz-origins.txt with .meta.yaml. OCR is good but has
      scanned-paperback artifacts and one unreadable data table — verify any
      direct quotation and all Ch.11 table numbers against a print copy.

  - title: "The Ideological Origins of the American Revolution"
    author: "B. Bailyn (Belknap/Harvard, 1967; Pulitzer & Bancroft)"
    url: "https://www.hup.harvard.edu/books/9780674975651"
    kind: monograph
    role: >
      The Revolution's intellectual substructure for american-revolution and
      roman-blueprint: the pamphlet literature, the five source streams with
      Country/Commonwealth opposition writing (Cato's Letters) as the
      integrating strand, the power-vs-liberty grammar, the conspiracy
      reading of 1763-76, and the transformations of representation,
      constitution, and sovereignty; Ch.VI's "contagion of liberty" reaches
      slavery, establishment, and deference.
    access: >
      Full text of the 1967 first edition read by the swarm via the
      archive.org OCR stream of an Indian reprint; cleaned copy cached at
      research/texts/bailyn-clean.txt (with bailyn-ideological-origins.txt).
      The 1992 "Fulfillment" postscript and 2017 anniversary essays were NOT
      read (restricted). Page numbers cited are 1967 pagination.

  - title: "Albion's Seed: Four British Folkways in America"
    author: "D. H. Fischer (Oxford UP, 1989)"
    url: "https://global.oup.com/academic/product/albions-seed-9780195069051"
    kind: monograph
    role: >
      Migration selectivity given regional texture: four British source
      regions to four American hearths, each a full cultural package, and
      the four liberties (ordered, hegemonic, reciprocal, natural) whose
      "creative tension" closes the book. Grounds regional-contrast material
      in new-england-covenant, colonial-societies, and middle-colonies.
      Treat as an influential but contested synthesis (Sosin, McKinney,
      Zelinsky critiques on sourcing and cultural determinism) — flag it,
      don't state it as consensus.
    access: >
      Summary-based: no legal full view exists (archive.org CDL only;
      snippet-only elsewhere). Built from the verified TOC, a page-cited
      scholarly walkthrough, and the Su-Dale 1990 peer review; raw material
      cached at research/texts/albionseed-*.txt/pdf with sidecars grading
      reliability. Do not quote Fischer's prose without library verification.

  - title: "The Founders and the Classics: Greece, Rome, and the American Enlightenment"
    author: "C. J. Richard (Harvard UP, 1994)"
    url: "https://www.hup.harvard.edu/books/9780674314269"
    kind: monograph
    role: >
      roman-blueprint's evidence that the classical references were working
      design vocabulary: the classical conditioning of 18th-century schooling
      (Ch.1), pseudonyms and symbolism (Ch.2), the antimodel roll call —
      Sulla, Catiline, Nero, Caligula, Caesar (Ch.3), mixed government and
      regime-cycle theory (Ch.4), and the Paine/Rush classics-skeptic
      counter-voices as a built-in debate pairing.
    access: >
      Summary-based only: archive.org CDL locked to automated access; built
      from the confirmed 6-chapter TOC, publisher blurb, and two substantive
      reviews. Cached at research/texts/richardclassics-secondary.txt with
      sidecar. Chapter pointers are inferred order — verify page numbers and
      all quotations (incl. the Hamilton "neither Greek nor Trojan" line)
      before use.

  - title: "Washington's Crossing"
    author: "D. H. Fischer (Oxford UP, 2004; Pulitzer 2005)"
    url: "https://global.oup.com/academic/product/washingtons-crossing-9780195181593"
    kind: monograph
    role: >
      war-of-independence depth on the Ten Crucial Days (Dec 25, 1776 -
      Jan 3, 1777) as one contingent sequence: three-armies social profile
      (Ch.1-3), the Leutze-painting-vs-physical-evidence autopsy (Ch.10,
      pp.206-220), the drunk-Hessians myth-bust via eyewitness John
      Greenwood, and the strategic-reversal thesis. Pairs with McCullough's
      1776 — Fischer supplies the evidentiary apparatus and myth-testing
      method.
    access: >
      TOC-plus-excerpt only: archive.org is CDL-restricted. Verified
      page-numbered TOC, one ~700-word publisher-sanctioned excerpt
      (pp.206-208), and page-anchored secondary citations, cached at
      research/texts/wcrossing-*.txt with sidecars. Do not quote running
      prose beyond the cached excerpt without library verification.

  - title: "Freedom National: The Destruction of Slavery in the United States, 1861-1865"
    author: "J. Oakes (W.W. Norton, 2013)"
    url: "https://wwnorton.com/books/Freedom-National/"
    kind: monograph
    role: >
      The Lincoln-Douglass register in scholarly form, grounding emancipation
      and union-victory: the federal consensus, the two legal routes
      (containment and military emancipation), Fortress Monroe and the
      contraband decision, the two Confiscation Acts, purpose-vs-effect
      rhetoric, the exemption paradox, black enlistment, the 525,000-of-4M
      scale problem, and the 13th Amendment as the only permanent cure —
      with the Reluctant/Great Emancipator myths dismantled in Ch.9.
    access: >
      Full text read by the swarm from a mirrored PDF of the 2013 Norton
      first edition, cached git-ignored at research/texts/oakesfn.pdf with
      per-shard extractions oakesfn-s1..s4.txt (+sidecars) covering Ch.1-12
      and the Epilogue opening. Cite the Norton edition; endnotes
      (pp.395-558) were not extracted.

  - title: "Reconstruction: A Concise History"
    author: "A. C. Guelzo (Oxford UP, 2018)"
    url: "https://global.oup.com/academic/product/reconstruction-9780190865696"
    kind: monograph
    role: >
      Counterweight to Foner for reconstruction and redemption: a
      constitutional/free-labor reading that rejects the bourgeois-revolution
      frame, names Reconstruction's four successes alongside its overthrow,
      and supplies the four-part periodization (Early / Presidential /
      Congressional / Overthrow, plus Aftermath to Plessy). Use paired with
      Foner, not instead of him.
    access: >
      Partial: front matter + complete Introduction (pp.1-13) read in full
      via the Gettysburg College repository PDF, cached at
      research/texts/guelzorecon.pdf/.txt with sidecar. Chapters 1-7 and

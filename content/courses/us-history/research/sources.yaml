      beyond titles/date-ranges without library verification.

  - title: "History of Public Land Law Development"
    author: "P. W. Gates (with R. W. Swenson) (US GPO for the Public Land Law Review Commission, 1968)"
    url: "https://archive.org/details/historyofpublicl00gate"
    kind: reference-work
    role: >
      The statutes behind "cheap land" for manifest-destiny and
      conquering-the-west: the 1785/1787 ordinances, credit-to-cash-to-
      graduation-to-homestead arc, preemption, railroad grants and the
      double-minimum myth, the Homestead Act and its documented capture,
      Powell's road not taken, and the conservation/reclamation/mining
      regimes. Gates's promise-vs-outcome method is itself a model for the
      course's evidence-forward register.
    access: >
      Free, full: 1968 US government publication, no copyright. Complete OCR
      and 235MB page-image PDF cached at research/texts/gateslandlaw*.txt
      and gateslandlaw.pdf (PDF page = printed page + 20). Prose OCR is
      good; numeric tables are frequently garbled — re-verify all exact
      figures against page images before quoting.


concepts:
  - id: surprisal
    name: Surprisal
    definition: "Information content of one event: -log2 p, in bits"
    introduced_in: what-is-surprise
  - id: entropy
    name: Entropy
    definition: "Expected surprisal of a distribution"
    introduced_in: entropy-as-average-surprise
  - id: prefix-code
    name: Prefix code
    definition: "A code where no codeword is a prefix of another, decodable without separators"
    introduced_in: guessing-games-and-codes
  - id: huffman-coding
    name: Huffman coding
    definition: "Greedy construction of an optimal prefix code by merging least likely symbols"
    introduced_in: huffman-by-hand
